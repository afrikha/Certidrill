id: dp600-cs1c-litware-energy
status: draft
title:
  en: Litware Energy
  fr: Litware Energy
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Litware Energy distributes electricity to two million customers. Every smart meter sends a reading every 15 minutes. The grid operations team monitors voltage quality in near real time, and the customer analytics team builds monthly consumption and billing analyses.

        Litware uses the Real-Time Intelligence workload of Microsoft Fabric for the meter data.
      fr: |
        Litware Energy distribue de l'électricité à deux millions de clients. Chaque compteur intelligent envoie une mesure toutes les 15 minutes. L'équipe des opérations réseau surveille la qualité de la tension en quasi-temps réel, et l'équipe d'analytique client produit des analyses mensuelles de consommation et de facturation.

        Litware utilise la charge de travail Real-Time Intelligence de Microsoft Fabric pour les données des compteurs.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Litware has a Fabric capacity and the following workspaces.

        | Workspace | Items |
        | --- | --- |
        | LE-Grid | Eventstream **ES_Meters**, which reads the meter messages from Azure Event Hubs; eventhouse **EH_Grid** with the KQL database **GridDB** |
        | LE-Customer | Lakehouse **LH_Customers**, notebook **NB_Consumption** |

        GridDB contains the following tables:

        | Table | Content |
        | --- | --- |
        | **MeterReadings** | One row per reading: MeterId (string), ReadingTime (datetime), Kwh (real), Voltage (real). Loaded continuously by ES_Meters. |
        | **Meters** | One row per meter: MeterId, Substation, Region. Updated once a day. |
        | **DailyUsage** | One row per meter and day, calculated by an update policy. |

        LH_Customers contains the **customers** and **contracts** Delta tables, which are loaded every night from the CRM. Several semantic models in other workspaces use LH_Customers.

        The following Microsoft Entra security groups exist: **SG-GridOps** (grid operations analysts) and **SG-CustomerAnalytics** (customer analytics team, assigned the Member role in LE-Customer).
      fr: |
        Litware dispose d'une capacité Fabric et des espaces de travail suivants.

        | Espace de travail | Éléments |
        | --- | --- |
        | LE-Grid | Eventstream **ES_Meters**, qui lit les messages des compteurs depuis Azure Event Hubs ; eventhouse **EH_Grid** avec la base de données KQL **GridDB** |
        | LE-Customer | Lakehouse **LH_Customers**, notebook **NB_Consumption** |

        GridDB contient les tables suivantes :

        | Table | Contenu |
        | --- | --- |
        | **MeterReadings** | Une ligne par mesure : MeterId (string), ReadingTime (datetime), Kwh (real), Voltage (real). Alimentée en continu par ES_Meters. |
        | **Meters** | Une ligne par compteur : MeterId, Substation, Region. Mise à jour une fois par jour. |
        | **DailyUsage** | Une ligne par compteur et par jour, calculée par une stratégie de mise à jour. |

        LH_Customers contient les tables Delta **customers** et **contracts**, chargées chaque nuit depuis le CRM. Plusieurs modèles sémantiques d'autres espaces de travail utilisent LH_Customers.

        Les groupes de sécurité Microsoft Entra suivants existent : **SG-GridOps** (analystes des opérations réseau) et **SG-CustomerAnalytics** (équipe d'analytique client, à qui le rôle Member est attribué dans LE-Customer).
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Access**

        1. The members of SG-GridOps must be able to create and edit KQL querysets and Real-Time dashboards in LE-Grid. They must not be able to add users to LE-Grid.

        **Data access and discovery**

        2. NB_Consumption must read the MeterReadings data as a Delta table from LH_Customers. The data must not be copied by a pipeline, an eventstream or a notebook.
        3. The analysts must be able to find the data streams of ES_Meters and the KQL tables they can access from a single tenant-wide view.
        4. Before the customers table schema is changed, the owners of the semantic models that depend on LH_Customers must be identified and notified.

        **Analysis**

        5. A voltage quality query must return, for each meter, the average voltage per 15-minute interval over the last six hours, keeping only the readings below 210 volts.
        6. A Power BI report named **Grid Quality** must show the MeterReadings data without waiting for a refresh, the DailyUsage data from an in-memory copy, and slicers on the Meters columns. Query performance must be maximized.
      fr: |
        **Accès**

        1. Les membres de SG-GridOps doivent pouvoir créer et modifier des ensembles de requêtes KQL et des tableaux de bord en temps réel dans LE-Grid. Ils ne doivent pas pouvoir ajouter d'utilisateurs à LE-Grid.

        **Accès aux données et découverte**

        2. NB_Consumption doit lire les données de MeterReadings sous forme de table Delta depuis LH_Customers. Les données ne doivent pas être copiées par un pipeline, un eventstream ou un notebook.
        3. Les analystes doivent pouvoir trouver les flux de données de ES_Meters et les tables KQL auxquelles ils ont accès depuis une vue unique à l'échelle du locataire.
        4. Avant toute modification du schéma de la table customers, les propriétaires des modèles sémantiques qui dépendent de LH_Customers doivent être identifiés et prévenus.

        **Analyse**

        5. Une requête de qualité de tension doit renvoyer, pour chaque compteur, la tension moyenne par intervalle de 15 minutes sur les six dernières heures, en ne conservant que les mesures inférieures à 210 volts.
        6. Un rapport Power BI nommé **Grid Quality** doit afficher les données de MeterReadings sans attendre d'actualisation, les données de DailyUsage à partir d'une copie en mémoire, et des segments sur les colonnes de Meters. Les performances des requêtes doivent être maximisées.
