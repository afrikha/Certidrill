id: dp600-sr1-joint-accounts
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware Bank is building a semantic model in Power BI Desktop. The model contains the following tables:

    - **Customer**: `CustomerID`, `CustomerName`.
    - **Account**: `AccountID`, `AccountType`.
    - **AccountHolder**: `AccountID`, `CustomerID`, with one row for each holder of each account. A joint account has several holders, and a customer can hold several accounts.
    - **Transaction**: `TransactionDate`, `AccountID`, `Amount`.

    Account has a one-to-many relationship with Transaction on `AccountID`, with a single cross-filter direction. The model has a measure defined as `Balance = SUM ( Transaction[Amount] )`.

    You need to ensure that a table visual that shows `Customer[CustomerName]` and Balance returns, for each customer, the balance of the accounts that the customer holds. The solution must not modify the Balance measure and must use at most one relationship with the Both cross-filter direction.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware Bank crée un modèle sémantique dans Power BI Desktop. Le modèle contient les tables suivantes :

    - **Customer** : `CustomerID`, `CustomerName`.
    - **Account** : `AccountID`, `AccountType`.
    - **AccountHolder** : `AccountID`, `CustomerID`, avec une ligne pour chaque titulaire de chaque compte. Un compte joint a plusieurs titulaires, et un client peut détenir plusieurs comptes.
    - **Transaction** : `TransactionDate`, `AccountID`, `Amount`.

    Account a une relation un-à-plusieurs avec Transaction sur `AccountID`, avec une direction de filtrage croisé unique. Le modèle contient une mesure définie comme `Balance = SUM ( Transaction[Amount] )`.

    Vous devez faire en sorte qu'un visuel de table qui affiche `Customer[CustomerName]` et Balance renvoie, pour chaque client, le solde des comptes que ce client détient. La solution ne doit pas modifier la mesure Balance et doit utiliser au plus une relation avec la direction de filtrage croisé Les deux.
