id: dp600-sr2-city-profit-view
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have a Fabric workspace named **Retail-WS** that contains a warehouse named **WH-Retail**. WH-Retail contains a table named **dbo.FactSale** that has the columns CityKey and Profit, and a table named **dbo.DimCity** that has the columns CityKey, City and StateProvince. A pipeline loads new rows into dbo.FactSale every hour.

    A data analyst named **Lena** has the Contributor role in Retail-WS. Lena does not write T-SQL.

    Lena needs to create an object in WH-Retail that returns the total profit for each city. The solution must meet the following requirements:

    - Other analysts must be able to query the object by using T-SQL.
    - The object must always return results based on the current rows of dbo.FactSale, without any reload.
    - Lena must not write any code.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un espace de travail Fabric nommé **Retail-WS** qui contient un entrepôt nommé **WH-Retail**. WH-Retail contient une table nommée **dbo.FactSale** qui comporte les colonnes CityKey et Profit, et une table nommée **dbo.DimCity** qui comporte les colonnes CityKey, City et StateProvince. Un pipeline charge de nouvelles lignes dans dbo.FactSale toutes les heures.

    Une analyste de données nommée **Lena** dispose du rôle Contributor dans Retail-WS. Lena n'écrit pas de T-SQL.

    Lena doit créer dans WH-Retail un objet qui renvoie le bénéfice total de chaque ville. La solution doit répondre aux exigences suivantes :

    - Les autres analystes doivent pouvoir interroger l'objet en T-SQL.
    - L'objet doit toujours renvoyer des résultats basés sur les lignes actuelles de dbo.FactSale, sans aucun rechargement.
    - Lena ne doit écrire aucun code.
