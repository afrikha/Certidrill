id: dp600-sr1-ledger-auditors
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has a Fabric workspace named **WS-Finance** that contains a warehouse named **WH-Ledger**, a lakehouse named **LH-Staging**, several notebooks and several Power BI reports.

    A Microsoft Entra group named **ExtAuditors** contains external auditors. The auditors must connect to WH-Ledger from SQL Server Management Studio (SSMS) and run `SELECT` queries against every table and view of WH-Ledger. The solution must meet the following requirements:

    - The auditors must not be able to see or open any other item of WS-Finance.
    - The auditors must not be able to modify data.
    - The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un espace de travail Fabric nommé **WS-Finance** qui contient un entrepôt nommé **WH-Ledger**, un lakehouse nommé **LH-Staging**, plusieurs notebooks et plusieurs rapports Power BI.

    Un groupe Microsoft Entra nommé **ExtAuditors** contient des auditeurs externes. Les auditeurs doivent se connecter à WH-Ledger depuis SQL Server Management Studio (SSMS) et exécuter des requêtes `SELECT` sur toutes les tables et vues de WH-Ledger. La solution doit répondre aux exigences suivantes :

    - Les auditeurs ne doivent pouvoir ni voir ni ouvrir aucun autre élément de WS-Finance.
    - Les auditeurs ne doivent pas pouvoir modifier les données.
    - La solution doit respecter le principe du moindre privilège.
