id: dp600-sr2-sales-tables-access
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have a Fabric workspace named **Finance-WS** that contains a warehouse named **WH-Finance**, a lakehouse named **LH-Ledger**, two semantic models and several reports. WH-Finance contains 14 tables, including **dbo.FactSales** and **dbo.DimProduct**.

    A user named **Auditor1** belongs to the internal audit team and has no role in Finance-WS. Auditor1 will connect to WH-Finance from SQL Server Management Studio.

    You need to ensure that Auditor1 can run SELECT queries against dbo.FactSales and dbo.DimProduct. The solution must meet the following requirements:

    - Auditor1 must not be able to read any other table of WH-Finance.
    - Auditor1 must not have access to any other item of Finance-WS.
    - The solution must follow the principle of least privilege.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un espace de travail Fabric nommé **Finance-WS** qui contient un entrepôt nommé **WH-Finance**, un lakehouse nommé **LH-Ledger**, deux modèles sémantiques et plusieurs rapports. WH-Finance contient 14 tables, dont **dbo.FactSales** et **dbo.DimProduct**.

    Un utilisateur nommé **Auditor1** appartient à l'équipe d'audit interne et n'a aucun rôle dans Finance-WS. Auditor1 se connectera à WH-Finance depuis SQL Server Management Studio.

    Vous devez vous assurer qu'Auditor1 peut exécuter des requêtes SELECT sur dbo.FactSales et dbo.DimProduct. La solution doit répondre aux exigences suivantes :

    - Auditor1 ne doit pouvoir lire aucune autre table de WH-Finance.
    - Auditor1 ne doit avoir accès à aucun autre élément de Finance-WS.
    - La solution doit respecter le principe du moindre privilège.
