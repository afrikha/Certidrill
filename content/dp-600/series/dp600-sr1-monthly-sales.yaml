id: dp600-sr1-monthly-sales
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has a Fabric warehouse named **WH-Sales** that contains a table named **dbo.FactSales**. dbo.FactSales contains one row per order line and has the following columns: `OrderDate` (date), `ProductKey` (int), `Quantity` (int) and `SalesAmount` (decimal(18,2)).

    You need to create an object named **dbo.MonthlyProductSales** in WH-Sales. The solution must meet the following requirements:

    - dbo.MonthlyProductSales must contain one row per product and calendar month, with the total quantity and the total sales amount.
    - The aggregated values must be stored, so that queries on dbo.MonthlyProductSales don't aggregate dbo.FactSales when they run.
    - A pipeline will drop and re-create dbo.MonthlyProductSales every night.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un entrepôt Fabric nommé **WH-Sales** qui contient une table nommée **dbo.FactSales**. dbo.FactSales contient une ligne par ligne de commande et comporte les colonnes suivantes : `OrderDate` (date), `ProductKey` (int), `Quantity` (int) et `SalesAmount` (decimal(18,2)).

    Vous devez créer un objet nommé **dbo.MonthlyProductSales** dans WH-Sales. La solution doit répondre aux exigences suivantes :

    - dbo.MonthlyProductSales doit contenir une ligne par produit et par mois civil, avec la quantité totale et le montant total des ventes.
    - Les valeurs agrégées doivent être stockées, afin que les requêtes sur dbo.MonthlyProductSales n'agrègent pas dbo.FactSales au moment de leur exécution.
    - Un pipeline supprimera et recréera dbo.MonthlyProductSales chaque nuit.
