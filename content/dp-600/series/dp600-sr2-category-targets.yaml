id: dp600-sr2-category-targets
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have a Fabric workspace that contains an Import semantic model named **SM-Retail**. SM-Retail contains the following tables:

    - **Product**: one row per product, with the columns ProductKey (unique), Product and Category. Each category contains many products.
    - **Sales**: one row per order line, related to Product by a one-to-many relationship on ProductKey with a single cross-filter direction.

    You import a table named **Target** that contains one row per category and year, with the columns Category, TargetYear and TargetQuantity.

    You need to relate Target to the model. The solution must meet the following requirements:

    - A slicer on Product[Category] must filter both Sales and Target.
    - Filters applied to Target must not propagate to Product or Sales.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un espace de travail Fabric qui contient un modèle sémantique en mode Import nommé **SM-Retail**. SM-Retail contient les tables suivantes :

    - **Product** : une ligne par produit, avec les colonnes ProductKey (unique), Product et Category. Chaque catégorie contient de nombreux produits.
    - **Sales** : une ligne par ligne de commande, reliée à Product par une relation un-à-plusieurs sur ProductKey avec une direction de filtrage croisé unique.

    Vous importez une table nommée **Target** qui contient une ligne par catégorie et par année, avec les colonnes Category, TargetYear et TargetQuantity.

    Vous devez relier Target au modèle. La solution doit répondre aux exigences suivantes :

    - Un segment sur Product[Category] doit filtrer à la fois Sales et Target.
    - Les filtres appliqués à Target ne doivent pas se propager à Product ni à Sales.
