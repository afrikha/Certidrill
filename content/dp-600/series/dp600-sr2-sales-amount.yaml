id: dp600-sr2-sales-amount
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have a Fabric workspace that contains a semantic model named **SM-Orders**. SM-Orders contains a table named **Sales** that has one row per order line, with the columns OrderDate, ProductKey, Quantity and UnitPrice. UnitPrice varies between order lines because of discounts. Sales has no sales amount column.

    You need to create a measure named **Sales Amount** that returns the sum of Quantity multiplied by UnitPrice for each order line. The solution must meet the following requirements:

    - The measure must return the correct value at every level of a report, including totals, products and months.
    - You must not add columns or tables to SM-Orders.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un espace de travail Fabric qui contient un modèle sémantique nommé **SM-Orders**. SM-Orders contient une table nommée **Sales** qui comporte une ligne par ligne de commande, avec les colonnes OrderDate, ProductKey, Quantity et UnitPrice. UnitPrice varie d'une ligne de commande à l'autre en raison des remises. Sales ne comporte aucune colonne de montant des ventes.

    Vous devez créer une mesure nommée **Sales Amount** qui renvoie la somme de Quantity multipliée par UnitPrice pour chaque ligne de commande. La solution doit répondre aux exigences suivantes :

    - La mesure doit renvoyer la valeur correcte à tous les niveaux d'un rapport, y compris les totaux, les produits et les mois.
    - Vous ne devez pas ajouter de colonnes ni de tables à SM-Orders.
