id: dp600-sr1-inactive-customers
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum has a Fabric workspace that contains a Dataflow Gen2 named **DF-Retention**. DF-Retention contains the following queries:

    - **Customers**: one row per customer, with the columns `CustomerID`, `CustomerName` and `Segment`.
    - **Orders**: one row per order, with the columns `OrderID`, `CustomerID` and `OrderDate`. `OrderID` never contains null values.

    You need to add a query named **InactiveCustomers** to DF-Retention. InactiveCustomers must return one row for each customer who has no orders, with the three columns of Customers only. The solution must use the Power Query editor of DF-Retention.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum dispose d'un espace de travail Fabric qui contient un Dataflow Gen2 nommé **DF-Retention**. DF-Retention contient les requêtes suivantes :

    - **Customers** : une ligne par client, avec les colonnes `CustomerID`, `CustomerName` et `Segment`.
    - **Orders** : une ligne par commande, avec les colonnes `OrderID`, `CustomerID` et `OrderDate`. `OrderID` ne contient jamais de valeur null.

    Vous devez ajouter une requête nommée **InactiveCustomers** à DF-Retention. InactiveCustomers doit renvoyer une ligne pour chaque client qui n'a aucune commande, avec uniquement les trois colonnes de Customers. La solution doit utiliser l'éditeur Power Query de DF-Retention.
