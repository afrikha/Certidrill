id: dp600-sr2-customer-order-count
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    You have a Fabric warehouse named **WH-Sales** that contains the following tables:

    - **dbo.DimCustomer**: one row per customer, with the columns CustomerKey and CustomerName.
    - **dbo.FactOrder**: one row per order since 2019, with the columns OrderKey, CustomerKey and OrderDate (date). OrderKey is never NULL.

    Many customers placed no order in 2026.

    You need to write a T-SQL query that returns one row for each customer in dbo.DimCustomer with the number of orders that the customer placed in 2026. Customers who placed no order in 2026 must be returned with a count of 0.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Vous disposez d'un entrepôt Fabric nommé **WH-Sales** qui contient les tables suivantes :

    - **dbo.DimCustomer** : une ligne par client, avec les colonnes CustomerKey et CustomerName.
    - **dbo.FactOrder** : une ligne par commande depuis 2019, avec les colonnes OrderKey, CustomerKey et OrderDate (date). OrderKey n'est jamais NULL.

    De nombreux clients n'ont passé aucune commande en 2026.

    Vous devez écrire une requête T-SQL qui renvoie une ligne pour chaque client de dbo.DimCustomer avec le nombre de commandes passées par ce client en 2026. Les clients qui n'ont passé aucune commande en 2026 doivent être renvoyés avec un nombre égal à 0.
