id: dp600-sr1-merged-model
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has a Fabric workspace named **WS-Sales** that is connected to the **main** branch of an Azure DevOps repository named **Repo1**. WS-Sales contains a semantic model named **SM-Sales** and two reports.

    A developer merged a pull request into main that adds three measures to the definition of SM-Sales. In the Source control pane of WS-Sales, no item has uncommitted changes, and SM-Sales shows the status **Update required from Git**.

    Two users can act on WS-Sales:

    - **User1** has the Viewer role in WS-Sales and the Contribute permission in Repo1.
    - **User2** has the Contributor role in WS-Sales and the Read permission in Repo1.

    You need to ensure that SM-Sales in WS-Sales contains the three new measures. The solution must not change any role or permission.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose d'un espace de travail Fabric nommé **WS-Sales** connecté à la branche **main** d'un référentiel Azure DevOps nommé **Repo1**. WS-Sales contient un modèle sémantique nommé **SM-Sales** et deux rapports.

    Un développeur a fusionné dans main une demande de tirage (pull request) qui ajoute trois mesures à la définition de SM-Sales. Dans le volet Contrôle de code source de WS-Sales, aucun élément n'a de modifications non validées, et SM-Sales affiche le statut **Update required from Git**.

    Deux utilisateurs peuvent agir sur WS-Sales :

    - **User1** a le rôle Viewer dans WS-Sales et l'autorisation Contribute dans Repo1.
    - **User2** a le rôle Contributor dans WS-Sales et l'autorisation Read dans Repo1.

    Vous devez faire en sorte que SM-Sales dans WS-Sales contienne les trois nouvelles mesures. La solution ne doit modifier aucun rôle ni aucune autorisation.
