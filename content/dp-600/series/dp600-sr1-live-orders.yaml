id: dp600-sr1-live-orders
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure SQL database named **SalesDB** that contains a fact table named **FactOrders** and three dimension tables named **DimProduct**, **DimStore** and **DimDate**. FactOrders contains 800 million rows and receives new rows every few seconds. Each dimension table contains fewer than 50,000 rows and changes once a day.

    You are creating a semantic model in Power BI Desktop. You connect to SalesDB and add the four tables in DirectQuery mode. Each dimension table has a one-to-many relationship with FactOrders. After publication, the model will be refreshed once a day.

    The model must meet the following requirements:

    - Visuals that use FactOrders must show the rows inserted into SalesDB without waiting for a model refresh.
    - Slicers that list dimension values must get their values from the model cache.
    - The relationships between the dimension tables and FactOrders must remain regular relationships, so that the joins are pushed to SalesDB.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'une base de données Azure SQL nommée **SalesDB** qui contient une table de faits nommée **FactOrders** et trois tables de dimension nommées **DimProduct**, **DimStore** et **DimDate**. FactOrders contient 800 millions de lignes et reçoit de nouvelles lignes toutes les quelques secondes. Chaque table de dimension contient moins de 50 000 lignes et change une fois par jour.

    Vous créez un modèle sémantique dans Power BI Desktop. Vous vous connectez à SalesDB et ajoutez les quatre tables en mode DirectQuery. Chaque table de dimension a une relation un-à-plusieurs avec FactOrders. Après la publication, le modèle sera actualisé une fois par jour.

    Le modèle doit répondre aux exigences suivantes :

    - Les visuels qui utilisent FactOrders doivent afficher les lignes insérées dans SalesDB sans attendre une actualisation du modèle.
    - Les segments qui listent des valeurs de dimension doivent obtenir leurs valeurs à partir du cache du modèle.
    - Les relations entre les tables de dimension et FactOrders doivent rester des relations régulières, afin que les jointures soient envoyées à SalesDB.
