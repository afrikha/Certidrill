id: ai901-1c-sp-read-messages
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys builds a mobile app for its delivery drivers. So that drivers keep their eyes on the road, the app must read incoming text messages aloud.

    Which speech capability should the app use?
  fr: |
    Tailspin Toys crée une application mobile pour ses chauffeurs-livreurs. Pour que les chauffeurs gardent les yeux sur la route, l'application doit lire à voix haute les messages texte entrants.

    Quelle fonctionnalité vocale l'application doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Speech recognition", fr: "Reconnaissance vocale" } }
    - { id: b, text: { en: "Speech synthesis", fr: "Synthèse vocale" } }
    - { id: c, text: { en: "Language identification", fr: "Identification de la langue" } }
    - { id: d, text: { en: "Diarization", fr: "Diarisation" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Speech synthesis, also called text to speech, converts text into audible speech that can be played through a speaker. Reading messages aloud is one of its typical uses.
    fr: |
      La synthèse vocale, aussi appelée conversion de texte par synthèse vocale (text to speech), convertit du texte en parole audible qui peut être lue sur un haut-parleur. Lire des messages à voix haute est l'un de ses usages types.
  options:
    a: { en: "Speech recognition goes the other way: it converts spoken audio into text.", fr: "La reconnaissance vocale va dans l'autre sens : elle convertit de l'audio parlé en texte." }
    c: { en: "Language identification finds which language is spoken in audio; it produces no speech.", fr: "L'identification de la langue détermine quelle langue est parlée dans un audio ; elle ne produit aucune parole." }
    d: { en: "Diarization separates the speakers of a recording; it is a feature of transcription.", fr: "La diarisation sépare les interlocuteurs d'un enregistrement ; c'est une fonctionnalité de la transcription." }
references:
  - title: Speech synthesis
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
