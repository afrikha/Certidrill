id: ai901-1a-priv-yn-primarily-privacy
objective: "1.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following actions, select **Yes** if the action is primarily a privacy and security measure. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des actions suivantes, sélectionnez **Oui** si l'action est avant tout une mesure de confidentialité et de sécurité. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "Letting users choose whether their voice is recorded", fr: "Laisser les utilisateurs choisir si leur voix est enregistrée" }
    - id: s2
      text: { en: "Telling users that the answers of a chatbot are generated by AI", fr: "Indiquer aux utilisateurs que les réponses d'un chatbot sont générées par l'IA" }
    - id: s3
      text: { en: "Encrypting customer data in transit and at rest", fr: "Chiffrer les données des clients en transit et au repos" }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Giving people control over how their data is collected and used, and encrypting data in transit and at rest, both protect personal data: they are privacy and security measures. Disclosing that answers are generated by AI helps users understand what they are dealing with, which is transparency."
    fr: "Donner aux personnes le contrôle de la collecte et de l'utilisation de leurs données, et chiffrer les données en transit et au repos, protègent les données personnelles : ce sont des mesures de confidentialité et de sécurité. Signaler que des réponses sont générées par l'IA aide les utilisateurs à comprendre à quoi ils ont affaire : cela relève de la transparence."
references:
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
