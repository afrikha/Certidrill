id: ai901-1c-deploy-basics-yn
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy a model from the model catalog in Microsoft Foundry.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de déployer un modèle du catalogue de modèles dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Deploying the model creates an API endpoint that applications can call.
        fr: Le déploiement du modèle crée un point de terminaison d'API que les applications peuvent appeler.
    - id: s2
      text:
        en: To use a different temperature in an application, you must create a new deployment.
        fr: Pour utiliser une autre température dans une application, vous devez créer un nouveau déploiement.
    - id: s3
      text:
        en: You can select the model version when you configure the deployment.
        fr: Vous pouvez sélectionner la version du modèle lorsque vous configurez le déploiement.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Deploying a model allocates compute, creates an API endpoint and starts monitoring. The deployment type, the model version and the tokens per minute (TPM) rate limit are chosen for the deployment. Temperature is a parameter set in the playground or passed in each request, so changing it does not need another deployment.
    fr: |
      Le déploiement d'un modèle alloue du calcul, crée un point de terminaison d'API et démarre la surveillance. Le type de déploiement, la version du modèle et la limite de débit en jetons par minute (TPM) se choisissent pour le déploiement. La température est un paramètre réglé dans le terrain de jeu ou passé dans chaque requête : la changer ne demande pas un autre déploiement.
references:
  - title: Generative AI models
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
