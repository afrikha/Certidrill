id: ai901-1b-model-yn-outputs
objective: "1.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An embedding model such as text-embedding-3-small returns numeric vectors rather than generated sentences."
        fr: "Un modèle d'embedding comme text-embedding-3-small renvoie des vecteurs numériques plutôt que des phrases générées."
    - id: s2
      text:
        en: "A multimodal chat model that accepts images, such as GPT-4.1, generates videos as output."
        fr: "Un modèle de conversation multimodal qui accepte des images, comme GPT-4.1, génère des vidéos en sortie."
    - id: s3
      text:
        en: "An image generation model creates an image that corresponds to a text description."
        fr: "Un modèle de génération d'images crée une image qui correspond à une description textuelle."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Embedding models are built for semantic vector representations, and image generation models create images that correspond to text descriptions. A multimodal chat model accepts several types of input but doesn't generate video output: the Sora models are the video generation models that Foundry provides directly."
    fr: "Les modèles d'embedding sont conçus pour produire des représentations vectorielles sémantiques, et les modèles de génération d'images créent des images qui correspondent à des descriptions textuelles. Un modèle de conversation multimodal accepte plusieurs types d'entrée mais ne génère pas de vidéo en sortie : les modèles Sora sont les modèles de génération de vidéos que Foundry fournit directement."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
