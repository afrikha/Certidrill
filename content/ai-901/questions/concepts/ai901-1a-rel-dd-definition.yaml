id: ai901-1a-rel-dd-definition
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      According to the reliability and safety principle, AI systems should operate as they were designed, respond safely to [[cond]] and resist [[manip]].
    fr: |
      Selon le principe de fiabilité et de sécurité, les systèmes d'IA doivent fonctionner comme ils ont été conçus, réagir sans danger [[cond]] et résister [[manip]].
  slots:
    - id: cond
      options:
        - { id: users, text: { en: "authorized users only", fr: "aux seuls utilisateurs autorisés" } }
        - { id: unant, text: { en: "unanticipated conditions", fr: "aux conditions imprévues" } }
        - { id: groups, text: { en: "similarly situated groups", fr: "aux groupes dans des situations similaires" } }
    - id: manip
      options:
        - { id: manip, text: { en: "harmful manipulation", fr: "aux manipulations nuisibles" } }
        - { id: review, text: { en: "human review", fr: "à la révision humaine" } }
        - { id: minim, text: { en: "data minimization", fr: "à la minimisation des données" } }
answer:
  values: { cond: unant, manip: manip }
explanation:
  correct:
    en: "Microsoft defines reliability and safety as AI systems that operate as they were originally designed, respond safely to unanticipated conditions and resist harmful manipulation."
    fr: "Microsoft définit la fiabilité et la sécurité ainsi : les systèmes d'IA fonctionnent comme ils ont été conçus à l'origine, réagissent sans danger aux conditions imprévues et résistent aux manipulations nuisibles."
  options:
    users: { en: "Limiting a system to authorized users is an access control, which belongs to privacy and security.", fr: "Limiter un système aux utilisateurs autorisés est un contrôle d'accès, qui relève de la confidentialité et de la sécurité." }
    groups: { en: "Similarly situated groups are the subject of the fairness principle.", fr: "Les groupes dans des situations similaires sont l'objet du principe d'impartialité." }
    review: { en: "Human review is a practice that responsible AI recommends, not something a system resists.", fr: "La révision humaine est une pratique que l'IA responsable recommande, pas quelque chose à quoi un système résiste." }
references:
  - title: "Artificial Intelligence overview"
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
