id: ai901-1a-priv-yn-secrets
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A developer builds an application that calls a model endpoint in Microsoft Foundry.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur crée une application qui appelle le point de terminaison d'un modèle dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "A key is a secret that authenticates the request when the application calls the endpoint.", fr: "Une clé est un secret qui authentifie la requête lorsque l'application appelle le point de terminaison." }
    - id: s2
      text: { en: "A database connection string is a secret that the application must keep hidden.", fr: "Une chaîne de connexion de base de données est un secret que l'application doit garder caché." }
    - id: s3
      text: { en: "Role-based access control filters harmful content from the responses of the model.", fr: "Le contrôle d'accès en fonction du rôle filtre le contenu nuisible des réponses du modèle." }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "A secret is any sensitive value that grants access to a system, a service or data: API keys, database connection strings, OAuth tokens and passwords. A key is a secret that authenticates a request to an endpoint. Role-based access control limits access to model deployments, resources and data; filtering harmful content is the job of content filters."
    fr: "Un secret est toute valeur sensible qui donne accès à un système, à un service ou à des données : clés d'API, chaînes de connexion de base de données, jetons OAuth et mots de passe. Une clé est un secret qui authentifie une requête adressée à un point de terminaison. Le contrôle d'accès en fonction du rôle limite l'accès aux déploiements de modèles, aux ressources et aux données ; filtrer le contenu nuisible est le rôle des filtres de contenu."
references:
  - title: "Developing AI apps on Azure"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/3-develop-ai-apps
