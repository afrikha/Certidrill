id: ai901-1c-deploy-types-yn
objective: "1.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You compare the deployment types of Microsoft Foundry Models.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez les types de déploiement de Microsoft Foundry Models.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Standard deployment processes prompts and responses within the Azure geography of the resource.
        fr: Un déploiement Standard traite les invites et les réponses dans la zone géographique Azure de la ressource.
    - id: s2
      text:
        en: A Global Batch deployment costs less than a Global Standard deployment and returns its results asynchronously.
        fr: Un déploiement Global Batch coûte moins cher qu'un déploiement Global Standard et renvoie ses résultats de façon asynchrone.
    - id: s3
      text:
        en: A Data Zone Standard deployment is billed for reserved provisioned throughput units (PTUs).
        fr: Un déploiement Data Zone Standard est facturé en unités de débit approvisionné (PTU) réservées.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Standard keeps processing inside the Azure geography specified for the resource. Data Zone Standard is a pay-per-token type that keeps processing inside a data zone; reserved PTUs are the billing model of the provisioned types. Global Batch handles large asynchronous jobs at about a 50 % discount on Global Standard, with a 24-hour target and no real-time answer.
    fr: |
      Standard garde le traitement dans la zone géographique Azure indiquée pour la ressource. Data Zone Standard est un type facturé au jeton qui garde le traitement dans une zone de données ; les PTU réservées sont le mode de facturation des types approvisionnés. Global Batch traite de gros travaux asynchrones avec environ 50 % de remise par rapport à Global Standard, un délai cible de 24 heures et aucune réponse en temps réel.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
