id: ai901-1c-param-code-dd
objective: "1.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    A Python application sends invoices to a chat model deployed in Microsoft Foundry and asks for the invoice number. The variable `client` is an OpenAI-compatible client that is already connected to the deployment.

    Each response must be limited to 150 tokens, and the responses must be as repeatable as possible.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python envoie des factures à un modèle de conversation déployé dans Microsoft Foundry et demande le numéro de facture. La variable `client` est un client compatible OpenAI déjà connecté au déploiement.

    Chaque réponse doit être limitée à 150 jetons, et les réponses doivent être aussi reproductibles que possible.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = client.responses.create(
        model=os.environ["DEPLOYMENT_NAME"],
        input=[{"role": "system", "content": "Return only the invoice number."},
               {"role": "user", "content": invoice_text}],
        [[cap]]=150,
        temperature=[[temp]]
    )
    print(response.output_text)
  slots:
    - id: cap
      options:
        - { id: topp, text: top_p }
        - { id: maxout, text: max_output_tokens }
        - { id: temperature, text: temperature }
    - id: temp
      options:
        - { id: t01, text: "0.1" }
        - { id: t07, text: "0.7" }
        - { id: t15, text: "1.5" }
        - { id: t20, text: "2.0" }
answer:
  values: { cap: maxout, temp: t01 }
explanation:
  correct:
    en: |
      `max_output_tokens` caps the length of the response, here at 150 tokens. Temperature can be set between 0 and 2: the lower the value, the more focused and repeatable the output, so 0.1 is the right choice among the values offered.
    fr: |
      `max_output_tokens` plafonne la longueur de la réponse, ici à 150 jetons. La température se règle entre 0 et 2 : plus la valeur est basse, plus la sortie est ciblée et reproductible ; 0.1 est donc le bon choix parmi les valeurs proposées.
  options:
    topp: { en: "top_p controls randomness and takes a probability, not a number of tokens.", fr: "top_p contrôle le caractère aléatoire et prend une probabilité, pas un nombre de jetons." }
    temperature: { en: "temperature is already set on the next line and does not limit the length.", fr: "temperature est déjà défini à la ligne suivante et ne limite pas la longueur." }
    t07: { en: "0.7 gives noticeably more varied wording than 0.1.", fr: "0.7 donne une formulation nettement plus variée que 0.1." }
    t15: { en: "1.5 is a high temperature, suited to creative text.", fr: "1.5 est une température élevée, adaptée à du texte créatif." }
    t20: { en: "2.0 is the maximum: the most random output.", fr: "2.0 est le maximum : la sortie la plus aléatoire." }
references:
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
