id: ai901-1c-sp-assistant-dd
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys designs a voice assistant for its online store. Customers ask questions aloud, and the assistant answers aloud.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys conçoit un assistant vocal pour sa boutique en ligne. Les clients posent leurs questions à voix haute, et l'assistant répond à voix haute.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To obtain the text of the question that a customer asks, the assistant uses [[c1]].

      To say the status of an order to the customer, the assistant uses [[c2]].

      So that the spoken answers have a natural intonation, the assistant uses [[c3]].
    fr: |
      Pour obtenir le texte de la question qu'un client pose, l'assistant utilise [[c1]].

      Pour dire au client l'état d'une commande, l'assistant utilise [[c2]].

      Pour que les réponses parlées aient une intonation naturelle, l'assistant utilise [[c3]].
  slots:
    - id: c1
      options:
        - { id: c1syn, text: { en: "speech synthesis", fr: "la synthèse vocale" } }
        - { id: c1rec, text: { en: "speech recognition", fr: "la reconnaissance vocale" } }
        - { id: c1tr, text: { en: "speech translation", fr: "la traduction vocale" } }
    - id: c2
      options:
        - { id: c2syn, text: { en: "speech synthesis", fr: "la synthèse vocale" } }
        - { id: c2rec, text: { en: "speech recognition", fr: "la reconnaissance vocale" } }
        - { id: c2tr, text: { en: "speech translation", fr: "la traduction vocale" } }
    - id: c3
      options:
        - { id: c3ac, text: { en: "an acoustic model", fr: "un modèle acoustique" } }
        - { id: c3pl, text: { en: "a phrase list", fr: "une liste d'expressions" } }
        - { id: c3nv, text: { en: "a neural voice", fr: "une voix neuronale" } }
answer:
  values: { c1: c1rec, c2: c2syn, c3: c3nv }
explanation:
  correct:
    en: |
      Speech recognition converts the spoken question into text that the assistant can process. Speech synthesis converts the text of the answer into audible speech. Neural voices use neural networks to overcome the intonation problems of traditional synthesis, which makes the answers sound more natural.
    fr: |
      La reconnaissance vocale convertit la question parlée en texte que l'assistant peut traiter. La synthèse vocale convertit le texte de la réponse en parole audible. Les voix neuronales utilisent des réseaux neuronaux pour dépasser les problèmes d'intonation de la synthèse traditionnelle, ce qui rend les réponses plus naturelles.
  options:
    c1tr: { en: "Speech translation is needed only when the output must be in another language.", fr: "La traduction vocale n'est nécessaire que si la sortie doit être dans une autre langue." }
    c3ac: { en: "An acoustic model is the part of speech recognition that converts audio into phonemes.", fr: "Un modèle acoustique est la partie de la reconnaissance vocale qui convertit l'audio en phonèmes." }
    c3pl: { en: "A phrase list helps speech recognition with specific words; it does not change the voice.", fr: "Une liste d'expressions aide la reconnaissance vocale sur des mots précis ; elle ne change pas la voix." }
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/1-introduction
  - title: Speech synthesis
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
