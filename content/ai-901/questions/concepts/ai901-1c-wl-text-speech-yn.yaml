id: ai901-1c-wl-text-speech-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A hospital group evaluates several AI projects.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe hospitalier évalue plusieurs projets d'IA.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Finding the medications and diagnoses mentioned in written clinical notes is a text analysis scenario.
        fr: Relever les médicaments et les diagnostics mentionnés dans des notes cliniques écrites est un scénario d'analyse de texte.
    - id: s2
      text:
        en: Converting the notes that a doctor dictates into written text is a speech scenario.
        fr: Convertir en texte écrit les notes qu'un médecin dicte est un scénario de reconnaissance et de synthèse vocales.
    - id: s3
      text:
        en: Writing a new patient information leaflet from a list of key points is a text analysis scenario.
        fr: Rédiger une nouvelle notice d'information pour les patients à partir d'une liste de points clés est un scénario d'analyse de texte.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Extracting clinical information such as medications and diagnoses from unstructured written documents is text analysis. Dictation converts spoken audio into text, which is speech recognition, a speech workload. Writing a new leaflet creates content from a prompt: that is generative AI, whereas text analysis extracts meaning from text that already exists.
    fr: |
      Extraire des informations cliniques comme les médicaments et les diagnostics de documents écrits non structurés relève de l'analyse de texte. La dictée convertit de l'audio parlé en texte : c'est de la reconnaissance vocale, une charge de travail vocale. Rédiger une nouvelle notice crée du contenu à partir d'une invite : c'est de l'IA générative, alors que l'analyse de texte extrait du sens d'un texte qui existe déjà.
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/1-introduction
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/1-introduction
