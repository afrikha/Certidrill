id: ai901-1a-incl-dd-speech-capabilities
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A museum wants its mobile application to be usable by visitors who have a hearing or a vision disability.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un musée veut que son application mobile soit utilisable par les visiteurs ayant un handicap auditif ou visuel.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To display live captions of what a guide says, the application uses [[cap]]. To read the written description of an exhibit aloud, the application uses [[read]].
    fr: |
      Pour afficher en direct les sous-titres de ce que dit un guide, l'application utilise [[cap]]. Pour lire à voix haute la description écrite d'une œuvre, l'application utilise [[read]].
  slots:
    - id: cap
      options:
        - { id: img, text: { en: "image generation", fr: "la génération d'images" } }
        - { id: stt, text: { en: "speech recognition", fr: "la reconnaissance vocale" } }
        - { id: sent, text: { en: "sentiment analysis", fr: "l'analyse des sentiments" } }
        - { id: tts, text: { en: "speech synthesis", fr: "la synthèse vocale" } }
    - id: read
      options:
        - { id: tts, text: { en: "speech synthesis", fr: "la synthèse vocale" } }
        - { id: img, text: { en: "image generation", fr: "la génération d'images" } }
        - { id: stt, text: { en: "speech recognition", fr: "la reconnaissance vocale" } }
        - { id: sent, text: { en: "sentiment analysis", fr: "l'analyse des sentiments" } }
answer:
  values: { cap: stt, read: tts }
explanation:
  correct:
    en: "Speech recognition (speech to text) converts spoken words into text, which is how captions are produced for visitors who are unable to hear the guide. Speech synthesis (text to speech) generates audible speech from text, which lets visitors who are unable to read the screen listen to the description."
    fr: "La reconnaissance vocale (speech to text) convertit la parole en texte : c'est ainsi que sont produits les sous-titres pour les visiteurs qui n'entendent pas le guide. La synthèse vocale (text to speech) génère une parole audible à partir d'un texte : les visiteurs qui ne peuvent pas lire l'écran écoutent ainsi la description."
  options:
    img: { en: "Image generation creates new images from a prompt; it neither transcribes nor reads aloud.", fr: "La génération d'images crée de nouvelles images à partir d'une invite ; elle ne transcrit pas et ne lit pas à voix haute." }
    sent: { en: "Sentiment analysis evaluates whether a text is positive or negative.", fr: "L'analyse des sentiments évalue si un texte est positif ou négatif." }
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: "Speech synthesis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
