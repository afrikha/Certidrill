id: ai901-1d-yn-video-generation
objective: "1.3.4"
type: "yesno_statements"
difficulty: 2
status: draft
stem:
  en: |
    You plan to generate images by using Azure OpenAI image-generation models in Microsoft Foundry.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de générer des images avec les modèles de génération d'images Azure OpenAI dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: The request returns a job ID that you must poll until the job completes before you can download the image.
      fr: "La requête renvoie un ID de travail que vous devez interroger jusqu'à la fin du travail avant de pouvoir télécharger l'image."
  - id: s2
    text:
      en: The request names the deployment of the image model that must generate the image.
      fr: "La requête nomme le déploiement du modèle d'images qui doit générer l'image."
  - id: s3
    text:
      en: Default guardrails (content filters) apply to the prompts and to the generated images.
      fr: "Des garde-fous (filtres de contenu) par défaut s'appliquent aux invites et aux images générées."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: "A call to the Responses API with the image_generation tool returns the image in the response itself, as base64 data; the job-and-poll flow belongs to video generation. The model argument of the request is the deployment name in Foundry. Azure OpenAI models come with default guardrail policies, and image generation has its own default policy for prompts and completions."
    fr: "Un appel à l'API Responses avec l'outil image_generation renvoie l'image dans la réponse elle-même, en données base64 ; le flux « travail puis interrogation » est celui de la génération de vidéos. L'argument model de la requête est le nom du déploiement dans Foundry. Les modèles Azure OpenAI ont des stratégies de garde-fous par défaut, et la génération d'images a sa propre stratégie par défaut pour les invites et les complétions."
references:
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
- title: Default Guardrail policies for Azure OpenAI
  url: "https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/default-safety-policies"
