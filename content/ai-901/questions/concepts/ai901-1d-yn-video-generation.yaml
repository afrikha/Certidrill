id: ai901-1d-yn-video-generation
objective: "1.3.4"
type: "yesno_statements"
difficulty: 2
status: draft
stem:
  en: |
    You plan to generate videos by using Sora models in Microsoft Foundry.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de générer des vidéos avec les modèles Sora dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: The request that starts a video generation returns the finished video in its response.
      fr: "La requête qui lance la génération d'une vidéo renvoie la vidéo terminée dans sa réponse."
  - id: s2
    text:
      en: A Sora model can use an image as input to guide the video that it creates.
      fr: "Un modèle Sora peut utiliser une image en entrée pour guider la vidéo qu'il crée."
  - id: s3
    text:
      en: Sora models apply responsible AI restrictions, such as limits on depicting real people.
      fr: "Les modèles Sora appliquent des restrictions d'IA responsable, par exemple des limites sur la représentation de personnes réelles."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: "Video generation is resource-intensive and runs as an asynchronous job: you create the job, poll its status, then download the video once the job is completed, typically after a few minutes. Sora models generate video from text and can use an image as input. They include responsible AI restrictions, such as limits on real people and copyrighted characters."
    fr: "La génération de vidéos consomme beaucoup de ressources et s'exécute comme un travail asynchrone : vous créez le travail, vous interrogez son état, puis vous téléchargez la vidéo une fois le travail terminé, en général après quelques minutes. Les modèles Sora génèrent une vidéo à partir de texte et peuvent utiliser une image en entrée. Ils intègrent des restrictions d'IA responsable, par exemple des limites sur les personnes réelles et les personnages protégés par le droit d'auteur."
references:
- title: Video generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation"
