id: ai901-1d-fields-vs-ocr
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam receives invoices from hundreds of vendors, each with its own layout. An accounting application needs the vendor name, the invoice date and the invoice total of each invoice as separate named values.

    Which technique should Fabrikam use?
  fr: |
    Fabrikam reçoit des factures de centaines de fournisseurs, chacun avec sa propre mise en page. Une application comptable a besoin du nom du fournisseur, de la date et du total de chaque facture sous forme de valeurs nommées distinctes.

    Quelle technique faut-il utiliser ?
body:
  options:
  - id: a
    text:
      en: Optical character recognition (OCR), to return the text of each page
      fr: La reconnaissance optique de caractères (OCR), pour renvoyer le texte de chaque page
  - id: b
    text:
      en: Schema-based field extraction, to return the value of each field that you define
      fr: "L'extraction de champs fondée sur un schéma, pour renvoyer la valeur de chaque champ que vous définissez"
  - id: c
    text:
      en: Layout analysis, to return the paragraphs and tables of each page
      fr: "L'analyse de la disposition, pour renvoyer les paragraphes et les tableaux de chaque page"
  - id: d
    text:
      en: Key phrase extraction, to return the main concepts of each invoice
      fr: "L'extraction d'expressions clés, pour renvoyer les principaux concepts de chaque facture"
answer:
  optionId: b
explanation:
  correct:
    en: Field extraction applies a schema, which lists the fields you want and their structure, and returns each value under the name of its field, typically as JSON. The schema is matched by meaning, so the technique copes with layouts and labels that differ from one vendor to another.
    fr: "L'extraction de champs applique un schéma, qui liste les champs voulus et leur structure, et renvoie chaque valeur sous le nom de son champ, en général en JSON. Le schéma est appliqué selon le sens ; la technique s'adapte donc à des mises en page et à des libellés qui diffèrent d'un fournisseur à l'autre."
  options:
    a:
      en: "OCR returns the text, but it does not understand its meaning: it cannot tell which number is the invoice total."
      fr: "L'OCR renvoie le texte, mais n'en comprend pas le sens : il ne sait pas quel nombre est le total de la facture."
    c:
      en: Layout analysis returns the structure of the page, not values identified as the vendor, the date or the total.
      fr: "L'analyse de la disposition renvoie la structure de la page, pas des valeurs identifiées comme le fournisseur, la date ou le total."
    d:
      en: Key phrase extraction returns the main concepts of a text, not a fixed set of named fields.
      fr: "L'extraction d'expressions clés renvoie les principaux concepts d'un texte, pas un ensemble fixe de champs nommés."
references:
- title: Extract information from documents
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents"
