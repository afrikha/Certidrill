id: ai901-1d-schema-purpose
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to extract structured data from documents by using an analyzer of Azure Content Understanding in Foundry Tools.

    What does the schema of the analyzer define?
  fr: |
    Vous prévoyez d'extraire des données structurées de documents avec un analyseur d'Azure Content Understanding dans Foundry Tools.

    Que définit le schéma de l'analyseur ?
body:
  options:
  - id: a
    text:
      en: The fields to extract and how they are structured
      fr: Les champs à extraire et la façon dont ils sont structurés
  - id: b
    text:
      en: The file formats that the service accepts as input
      fr: Les formats de fichiers que le service accepte en entrée
  - id: c
    text:
      en: The credentials that a client application presents
      fr: "Les informations d'identification que présente une application cliente"
  - id: d
    text:
      en: The region in which the content is processed
      fr: La région dans laquelle le contenu est traité
answer:
  optionId: a
explanation:
  correct:
    en: "A schema describes what information you want to extract and how it should be structured: it lists the fields, which can be nested, such as a collection of line items. The analyzer returns results that match this schema."
    fr: "Un schéma décrit les informations que vous voulez extraire et la façon de les structurer : il liste les champs, qui peuvent être imbriqués, comme une collection de lignes d'articles. L'analyseur renvoie des résultats conformes à ce schéma."
  options:
    b:
      en: The supported input formats are a characteristic of the service, not something a schema declares.
      fr: "Les formats d'entrée pris en charge sont une caractéristique du service, pas un élément déclaré dans un schéma."
    c:
      en: "A client application authenticates with a key or with Microsoft Entra ID; this is unrelated to the schema."
      fr: "Une application cliente s'authentifie avec une clé ou avec Microsoft Entra ID ; cela n'a pas de rapport avec le schéma."
    d:
      en: The region depends on where the Foundry resource is created, not on the schema.
      fr: "La région dépend de l'endroit où la ressource Foundry est créée, pas du schéma."
references:
- title: Extract information from documents
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents"
