id: ai901-1a-rel-dd-block-or-measure
objective: "1.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam builds an AI agent in Microsoft Foundry.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée un agent d'IA dans Microsoft Foundry.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To block harmful responses before they reach users, use [[block]]. To measure before release how often a set of test prompts leads to harmful responses, use [[measure]].
    fr: |
      Pour bloquer les réponses nuisibles avant qu'elles n'atteignent les utilisateurs, utilisez [[block]]. Pour mesurer avant la mise en service la fréquence à laquelle un ensemble d'invites de test produit des réponses nuisibles, utilisez [[measure]].
  slots:
    - id: block
      options:
        - { id: guard, text: { en: "guardrails (content filters)", fr: "des garde-fous (filtres de contenu)" } }
        - { id: eval, text: { en: "risk and safety evaluators", fr: "des évaluateurs de risque et de sécurité" } }
        - { id: pii, text: { en: "PII detection in Azure Language", fr: "la détection des PII d'Azure Language" } }
        - { id: rbac, text: { en: "role-based access control (RBAC)", fr: "le contrôle d'accès en fonction du rôle (RBAC)" } }
    - id: measure
      options:
        - { id: pii, text: { en: "PII detection in Azure Language", fr: "la détection des PII d'Azure Language" } }
        - { id: eval, text: { en: "risk and safety evaluators", fr: "des évaluateurs de risque et de sécurité" } }
        - { id: rbac, text: { en: "role-based access control (RBAC)", fr: "le contrôle d'accès en fonction du rôle (RBAC)" } }
        - { id: guard, text: { en: "guardrails (content filters)", fr: "des garde-fous (filtres de contenu)" } }
answer:
  values: { block: guard, measure: eval }
explanation:
  correct:
    en: "Guardrails and content filters act at run time: they block harmful output before it reaches users. Risk and safety evaluators only measure: they score the responses to a set of test inputs for categories such as violence or self-harm and report a defect rate, which shows the risks before release."
    fr: "Les garde-fous et filtres de contenu agissent à l'exécution : ils bloquent les sorties nuisibles avant qu'elles n'atteignent les utilisateurs. Les évaluateurs de risque et de sécurité se contentent de mesurer : ils notent les réponses à un ensemble d'entrées de test pour des catégories comme la violence ou l'automutilation et indiquent un taux de défauts, ce qui montre les risques avant la mise en service."
  options:
    pii: { en: "PII detection finds and redacts personal data in text; it neither blocks nor measures harmful content.", fr: "La détection des PII trouve et masque les données personnelles dans un texte ; elle ne bloque ni ne mesure le contenu nuisible." }
    rbac: { en: "RBAC limits who can access resources; it doesn't examine the content of responses.", fr: "Le RBAC limite les personnes qui peuvent accéder aux ressources ; il n'examine pas le contenu des réponses." }
references:
  - title: "Responsible AI for Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview
  - title: "Risk and safety evaluators"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
