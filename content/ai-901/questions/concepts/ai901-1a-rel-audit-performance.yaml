id: ai901-1a-rel-audit-performance
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam deployed an AI model six months ago.

    You need to verify over time that the model still behaves as intended.

    What should you set up?
  fr: |
    Fabrikam a déployé un modèle d'IA il y a six mois.

    Vous devez vérifier dans la durée que le modèle se comporte toujours comme prévu.

    Que devez-vous mettre en place ?
body:
  options:
    - id: a
      text: { en: "A review process that checks the interface against accessibility standards", fr: "Un processus de revue qui contrôle l'interface par rapport aux normes d'accessibilité" }
    - id: b
      text: { en: "A consent process that records how users allow their data to be used", fr: "Un processus de consentement qui enregistre comment les utilisateurs autorisent l'utilisation de leurs données" }
    - id: c
      text: { en: "An audit process that monitors performance against established measures", fr: "Un processus d'audit qui surveille les performances par rapport à des mesures établies" }
    - id: d
      text: { en: "A publication process that documents the limitations of the model for users", fr: "Un processus de publication qui documente les limites du modèle pour les utilisateurs" }
answer: { optionId: c }
explanation:
  correct:
    en: "For reliability and safety, Microsoft recommends processes for auditing AI systems: they evaluate the quality and suitability of data and models, monitor ongoing performance and verify that the system behaves as intended against established performance measures."
    fr: "Pour la fiabilité et la sécurité, Microsoft recommande des processus d'audit des systèmes d'IA : ils évaluent la qualité et la pertinence des données et des modèles, surveillent les performances dans la durée et vérifient que le système se comporte comme prévu par rapport à des mesures de performances établies."
  options:
    a: { en: "An accessibility review serves inclusiveness; it doesn't measure how the model behaves.", fr: "Une revue d'accessibilité sert l'inclusion ; elle ne mesure pas le comportement du modèle." }
    b: { en: "Recording consent is a privacy measure.", fr: "Enregistrer le consentement est une mesure de confidentialité." }
    d: { en: "Documenting limitations is a transparency measure; it doesn't verify the behavior of the model over time.", fr: "Documenter les limites est une mesure de transparence ; cela ne vérifie pas le comportement du modèle dans la durée." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
