id: ai901-1d-dd-technique-per-need
objective: "1.3.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso needs to extract information from several types of content.

    Which technique should Contoso use for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso doit extraire des informations de plusieurs types de contenu.

    Quelle technique faut-il utiliser pour chaque besoin ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Obtain the words that are spoken in a recorded call: [[t1]]

      Return VendorName and InvoiceTotal as named values: [[t2]]

      Read the text of a scanned contract: [[t3]]
    fr: |
      Obtenir les mots prononcés dans un appel enregistré : [[t1]]

      Renvoyer VendorName et InvoiceTotal sous forme de valeurs nommées : [[t2]]

      Lire le texte d'un contrat numérisé : [[t3]]
  slots:
  - id: t1
    options:
    - id: ocr
      text:
        en: Optical character recognition (OCR)
        fr: Reconnaissance optique de caractères (OCR)
    - id: stt
      text:
        en: Speech recognition
        fr: Reconnaissance vocale
    - id: tts
      text:
        en: Speech synthesis
        fr: Synthèse vocale
    - id: fields
      text:
        en: Schema-based field extraction
        fr: Extraction de champs fondée sur un schéma
  - id: t2
    options:
    - id: ocr
      text:
        en: Optical character recognition (OCR)
        fr: Reconnaissance optique de caractères (OCR)
    - id: stt
      text:
        en: Speech recognition
        fr: Reconnaissance vocale
    - id: tts
      text:
        en: Speech synthesis
        fr: Synthèse vocale
    - id: fields
      text:
        en: Schema-based field extraction
        fr: Extraction de champs fondée sur un schéma
  - id: t3
    options:
    - id: ocr
      text:
        en: Optical character recognition (OCR)
        fr: Reconnaissance optique de caractères (OCR)
    - id: stt
      text:
        en: Speech recognition
        fr: Reconnaissance vocale
    - id: tts
      text:
        en: Speech synthesis
        fr: Synthèse vocale
    - id: fields
      text:
        en: Schema-based field extraction
        fr: Extraction de champs fondée sur un schéma
answer:
  values:
    t1: stt
    t2: fields
    t3: ocr
explanation:
  correct:
    en: Speech recognition transcribes recorded speech into text. Named values come from field extraction, which applies a schema that lists the fields to return. OCR reads the text of a scanned document. Speech synthesis goes from text to audio and extracts nothing.
    fr: "La reconnaissance vocale transcrit la parole enregistrée en texte. Les valeurs nommées proviennent de l'extraction de champs, qui applique un schéma listant les champs à renvoyer. L'OCR lit le texte d'un document numérisé. La synthèse vocale va du texte vers l'audio et n'extrait rien."
references:
- title: Extract information from documents
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents"
- title: Extract information from audio and video
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video"
