id: ai901-1c-wl-agent-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your team must decide whether its new projects call for generative AI alone or for agentic AI.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe doit décider si ses nouveaux projets relèvent de l'IA générative seule ou de l'IA agentique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Drafting a reply to a customer email from a prompt requires an agent that has tools.
        fr: Rédiger une réponse à l'e-mail d'un client à partir d'une invite exige un agent doté d'outils.
    - id: s2
      text:
        en: An agent can call an external API to carry out an action for a user.
        fr: Un agent peut appeler une API externe pour accomplir une action pour un utilisateur.
    - id: s3
      text:
        en: An agent uses a generative AI model to reason about the request of a user.
        fr: Un agent utilise un modèle d'IA générative pour raisonner sur la demande d'un utilisateur.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Drafting text from a prompt is plain inference: a deployed model does it without any tool. An agent packages a model, instructions and tools; the model provides the reasoning, and the tools, such as APIs, functions or knowledge sources, let the agent act and work through several steps.
    fr: |
      Rédiger un texte à partir d'une invite est une simple inférence : un modèle déployé le fait sans aucun outil. Un agent regroupe un modèle, des instructions et des outils ; le modèle fournit le raisonnement, et les outils, comme des API, des fonctions ou des sources de connaissances, permettent à l'agent d'agir et d'enchaîner plusieurs étapes.
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
