id: ai901-1a-incl-captions-many-users
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso added real-time captions to its video meetings for employees who are deaf. Usage data shows that most of the people who turn the captions on work in noisy factories or aren't native speakers of the language of the meetings.

    Which statement about this result is correct?
  fr: |
    Contoso a ajouté des sous-titres en temps réel à ses réunions vidéo pour les employés sourds. Les données d'utilisation montrent que la plupart des personnes qui activent les sous-titres travaillent dans des usines bruyantes ou n'ont pas la langue des réunions pour langue maternelle.

    Quelle affirmation à propos de ce résultat est correcte ?
body:
  options:
    - id: a
      text: { en: "It shows that the feature fails the inclusiveness principle, because it mostly serves other people than those it was designed for.", fr: "Il montre que la fonctionnalité ne respecte pas le principe d'inclusion, car elle sert surtout d'autres personnes que celles pour lesquelles elle a été conçue." }
    - id: b
      text: { en: "It shows that the feature must be limited to employees who are deaf, so that it complies with the fairness principle.", fr: "Il montre que la fonctionnalité doit être limitée aux employés sourds, afin de respecter le principe d'impartialité." }
    - id: c
      text: { en: "It shows that captions are a measure of the transparency principle rather than of the inclusiveness principle.", fr: "Il montre que les sous-titres sont une mesure du principe de transparence plutôt que du principe d'inclusion." }
    - id: d
      text: { en: "It shows the inclusive design principle of solving for one and extending to many, which the inclusiveness principle encourages.", fr: "Il illustre le principe de conception inclusive qui consiste à résoudre pour une personne et étendre à plusieurs, ce que le principe d'inclusion encourage." }
answer: { optionId: d }
explanation:
  correct:
    en: "Solve for one, extend to many is one of Microsoft's inclusive design principles: designing for a specific need creates a broader impact. Captions that were designed for people who are deaf also help anyone who is unable to hear or follow the audio well."
    fr: "Résoudre pour une personne, étendre à plusieurs (Solve for one, extend to many) est l'un des principes de conception inclusive de Microsoft : concevoir pour un besoin spécifique crée un impact plus large. Des sous-titres conçus pour les personnes sourdes aident aussi toute personne qui entend ou suit mal l'audio."
  options:
    a: { en: "A wider benefit doesn't remove the benefit for employees who are deaf; it is the expected effect of inclusive design.", fr: "Un bénéfice plus large ne supprime pas le bénéfice pour les employés sourds ; c'est l'effet attendu de la conception inclusive." }
    b: { en: "Fairness is about comparable people receiving comparable results; it doesn't require a helpful feature to be reserved for one group.", fr: "L'impartialité consiste à ce que des personnes comparables obtiennent des résultats comparables ; elle n'exige pas de réserver une fonctionnalité utile à un seul groupe." }
    c: { en: "Transparency is about understanding how an AI system works; captions give access to spoken content.", fr: "La transparence consiste à comprendre comment un système d'IA fonctionne ; les sous-titres donnent accès au contenu parlé." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
