id: ai901-1b-transp-yn-genai
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware adds a generative AI assistant to its document editor.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware ajoute un assistant d'IA générative à son éditeur de documents.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If the assistant's answers are accurate, users don't need to know that the text was generated by AI."
        fr: "Si les réponses de l'assistant sont exactes, les utilisateurs n'ont pas besoin de savoir que le texte a été généré par l'IA."
    - id: s2
      text:
        en: "Showing which documents an answer is grounded in helps users understand how the answer was generated."
        fr: "Montrer dans quels documents une réponse est ancrée aide les utilisateurs à comprendre comment la réponse a été générée."
    - id: s3
      text:
        en: "Setting a low temperature on the model makes the assistant transparent to its users."
        fr: "Régler une température basse sur le modèle rend l'assistant transparent pour ses utilisateurs."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Transparency requires clearly communicating the presence and role of AI in a product, whatever the quality of the output, and helping users understand how outputs are generated, for example by showing their sources. Temperature only controls how creative or deterministic the model is; it explains nothing to users."
    fr: "La transparence exige d'indiquer clairement la présence et le rôle de l'IA dans un produit, quelle que soit la qualité du résultat, et d'aider les utilisateurs à comprendre comment les sorties sont générées, par exemple en montrant leurs sources. La température règle seulement le caractère créatif ou déterministe du modèle ; elle n'explique rien aux utilisateurs."
references:
  - title: "Responsible AI for agent design"
    url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
