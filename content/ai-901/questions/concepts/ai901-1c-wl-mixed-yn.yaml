id: ai901-1c-wl-mixed-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A retailer plans three AI solutions for its stores and its contact center.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un distributeur prévoit trois solutions d'IA pour ses magasins et son centre de contact.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A voice assistant uses speech synthesis to understand the spoken request of a customer.
        fr: Un assistant vocal utilise la synthèse vocale pour comprendre la demande parlée d'un client.
    - id: s2
      text:
        en: Detecting from store camera images that a product is out of stock on a shelf is a computer vision scenario.
        fr: Détecter, à partir des images des caméras d'un magasin, qu'un produit est en rupture dans un rayon est un scénario de vision par ordinateur.
    - id: s3
      text:
        en: Analyzing recorded support calls to return the problem and the resolution of each call as data fields is an information extraction scenario.
        fr: Analyser des appels de support enregistrés pour renvoyer le problème et la résolution de chaque appel sous forme de champs de données est un scénario d'extraction d'informations.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Shelf monitoring with cameras is computer vision. A voice assistant understands spoken input with speech recognition; speech synthesis is used in the other direction, to speak the answer. Information extraction turns unstructured content, including audio recordings, into structured data such as the problem and the resolution of a call.
    fr: |
      La surveillance des rayons par caméras relève de la vision par ordinateur. Un assistant vocal comprend une entrée parlée grâce à la reconnaissance vocale ; la synthèse vocale sert dans l'autre sens, pour prononcer la réponse. L'extraction d'informations transforme un contenu non structuré, y compris des enregistrements audio, en données structurées comme le problème et la résolution d'un appel.
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/1-introduction
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/1-introduction
