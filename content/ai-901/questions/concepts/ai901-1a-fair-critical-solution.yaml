id: ai901-1a-fair-critical-solution
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans four AI solutions.

    For which solution is it most important to assess fairness before deployment?
  fr: |
    Contoso prévoit quatre solutions d'IA.

    Pour quelle solution est-il le plus important d'évaluer l'impartialité avant le déploiement ?
body:
  options:
    - id: a
      text: { en: "A solution that recommends which patients receive a specialist appointment first", fr: "Une solution qui recommande les patients à recevoir en priorité chez un spécialiste" }
    - id: b
      text: { en: "A solution that translates product manuals into several languages", fr: "Une solution qui traduit des manuels de produits dans plusieurs langues" }
    - id: c
      text: { en: "A solution that generates illustrations of landscapes for a brochure", fr: "Une solution qui génère des illustrations de paysages pour une brochure" }
    - id: d
      text: { en: "A solution that transcribes recorded team meetings", fr: "Une solution qui transcrit des réunions d'équipe enregistrées" }
answer: { optionId: a }
explanation:
  correct:
    en: "Fairness matters most when an AI system gives guidance that affects people's lives, such as medical treatment, loan applications or employment: people with similar symptoms must receive the same recommendation. The three other solutions don't allocate a service or an opportunity among people."
    fr: "L'impartialité compte le plus lorsqu'un système d'IA oriente des décisions qui touchent la vie des personnes, comme un traitement médical, une demande de prêt ou un emploi : des personnes aux symptômes similaires doivent recevoir la même recommandation. Les trois autres solutions n'attribuent ni service ni opportunité à des personnes."
  options:
    b: { en: "Translating manuals doesn't decide how people are treated.", fr: "Traduire des manuels ne décide pas de la manière dont des personnes sont traitées." }
    c: { en: "Generating illustrations of landscapes doesn't produce a recommendation about a person.", fr: "Générer des illustrations de paysages ne produit pas de recommandation concernant une personne." }
    d: { en: "Transcribing meetings converts speech to text; it doesn't recommend an outcome for a person.", fr: "Transcrire des réunions convertit la parole en texte ; cela ne recommande aucun résultat pour une personne." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
