id: ai901-1a-fair-two-practices
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team builds an AI system that helps decide who is invited to a job interview.

    Which two practices help the team address fairness? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe crée un système d'IA qui aide à décider qui est convoqué à un entretien d'embauche.

    Quelles sont les deux pratiques qui aident l'équipe à traiter l'impartialité ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Store the keys of the system in Azure Key Vault.", fr: "Stocker les clés du système dans Azure Key Vault." }
    - id: b
      text: { en: "Include team members who have different backgrounds, experiences and perspectives.", fr: "Intégrer à l'équipe des membres ayant des parcours, des expériences et des points de vue différents." }
    - id: c
      text: { en: "Compare the recommendations of the system across groups such as gender, ethnicity and age.", fr: "Comparer les recommandations du système entre des groupes comme le genre, l'origine ethnique et l'âge." }
    - id: d
      text: { en: "Add real-time captions to the interface of the system.", fr: "Ajouter des sous-titres en temps réel à l'interface du système." }
    - id: e
      text: { en: "Add a notice that says that the recommendations are generated by AI.", fr: "Ajouter une mention indiquant que les recommandations sont générées par l'IA." }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: "A diverse team is more likely to notice how the system could harm certain groups, and comparing outcomes across sensitive groups reveals whether similarly qualified candidates are treated differently. Both practices belong to the fairness principle."
    fr: "Une équipe diversifiée a plus de chances de remarquer comment le système pourrait nuire à certains groupes, et comparer les résultats entre groupes sensibles révèle si des candidats aux qualifications similaires sont traités différemment. Ces deux pratiques relèvent du principe d'impartialité."
  options:
    a: { en: "Protecting keys is a privacy and security measure.", fr: "Protéger les clés est une mesure de confidentialité et de sécurité." }
    d: { en: "Captions make the interface accessible, which is inclusiveness.", fr: "Les sous-titres rendent l'interface accessible : cela relève de l'inclusion." }
    e: { en: "Disclosing the use of AI is transparency; it doesn't show whether the results are fair.", fr: "Signaler l'utilisation de l'IA relève de la transparence ; cela n'indique pas si les résultats sont équitables." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2
