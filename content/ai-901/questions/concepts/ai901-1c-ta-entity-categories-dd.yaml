id: ai901-1c-ta-entity-categories-dd
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You apply entity detection to the following sentence:

    *The workshop in Oslo lasted 3 hours, and 40% of the attendees came from Contoso.*

    Which entity type is returned for each item? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous appliquez la détection d'entités à la phrase suivante :

    *The workshop in Oslo lasted 3 hours, and 40% of the attendees came from Contoso.*

    Quel type d'entité est renvoyé pour chaque élément ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      "Oslo" is returned as [[e1]].

      "3 hours" is returned as [[e2]].

      "40%" is returned as [[e3]].
    fr: |
      « Oslo » est renvoyé comme [[e1]].

      « 3 hours » est renvoyé comme [[e2]].

      « 40% » est renvoyé comme [[e3]].
  slots:
    - id: e1
      options:
        - { id: e1person, text: Person }
        - { id: e1org, text: Organization }
        - { id: e1loc, text: Location }
    - id: e2
      options:
        - { id: e2dt, text: DateTime }
        - { id: e2qty, text: Quantity }
        - { id: e2loc, text: Location }
    - id: e3
      options:
        - { id: e3dt, text: DateTime }
        - { id: e3org, text: Organization }
        - { id: e3qty, text: Quantity }
answer:
  values: { e1: e1loc, e2: e2dt, e3: e3qty }
explanation:
  correct:
    en: |
      An entity is an item of a particular type, sometimes with a subtype. A city is a Location. A length of time such as "3 hours" is a DateTime entity with the Duration subtype. A percentage such as "40%" is a Quantity entity with the Percentage subtype. Contoso, which is not asked here, would be an Organization.
    fr: |
      Une entité est un élément d'un type particulier, parfois avec un sous-type. Une ville est une entité Location. Une durée comme « 3 hours » est une entité DateTime de sous-type Duration. Un pourcentage comme « 40% » est une entité Quantity de sous-type Percentage. Contoso, qui n'est pas demandé ici, serait une entité Organization.
  options:
    e2qty: { en: "A duration is a DateTime entity, even though it contains a number.", fr: "Une durée est une entité DateTime, même si elle contient un nombre." }
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
