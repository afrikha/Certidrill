id: ai901-1c-ta-sentiment-outputs
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application submits customer reviews to the sentiment analysis feature of Azure Language in Foundry Tools.

    Which two items does the result contain for each review?

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application soumet des avis de clients à la fonctionnalité d'analyse des sentiments d'Azure Language dans Foundry Tools.

    Quels sont les deux éléments que le résultat contient pour chaque avis ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The main concepts of the review as a list of phrases", fr: "Les principaux concepts de l'avis sous forme de liste d'expressions" } }
    - { id: b, text: { en: "A label such as positive, neutral or negative", fr: "Une étiquette telle que positif, neutre ou négatif" } }
    - { id: c, text: { en: "The category of each person, place and date in the review", fr: "La catégorie de chaque personne, lieu et date de l'avis" } }
    - { id: d, text: { en: "Confidence scores between 0 and 1", fr: "Des scores de confiance compris entre 0 et 1" } }
    - { id: e, text: { en: "A rank score for the most salient sentences", fr: "Un score de classement pour les phrases les plus saillantes" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Sentiment analysis assigns a label such as positive, neutral or negative, at the level of the document and of each sentence. It also returns confidence scores between 0 and 1 for the positive, neutral and negative sentiments; the label is the sentiment with the highest score.
    fr: |
      L'analyse des sentiments attribue une étiquette telle que positif, neutre ou négatif, au niveau du document et de chaque phrase. Elle renvoie aussi des scores de confiance compris entre 0 et 1 pour les sentiments positif, neutre et négatif ; l'étiquette est le sentiment dont le score est le plus élevé.
  options:
    a: { en: "A list of the main concepts is the output of key phrase extraction.", fr: "Une liste des principaux concepts est la sortie de l'extraction d'expressions clés." }
    c: { en: "Categorized people, places and dates are the output of entity detection.", fr: "Des personnes, lieux et dates classés par catégorie sont la sortie de la détection d'entités." }
    e: { en: "A rank score for sentences is part of the output of extractive summarization.", fr: "Un score de classement des phrases fait partie de la sortie du résumé extractif." }
references:
  - title: What are sentiment analysis and opinion mining?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/sentiment-opinion-mining/overview
