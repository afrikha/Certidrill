id: ai901-1d-video-remix-audio
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware used a video-generation model in Microsoft Foundry to create a promotional clip.

    Proseware now needs to apply a targeted edit to the clip instead of regenerating the entire video. The new version must include generated audio.

    Which model provides these capabilities?
  fr: |
    Proseware a utilisé un modèle de génération de vidéos dans Microsoft Foundry pour créer un clip promotionnel.

    Proseware doit maintenant appliquer une modification ciblée au clip au lieu de régénérer toute la vidéo. La nouvelle version doit inclure de l'audio généré.

    Quel modèle offre ces fonctionnalités ?
body:
  options:
  - id: a
    text: GPT-Image-1.5
  - id: b
    text: Sora 1
  - id: c
    text: Sora 2
  - id: d
    text: FLUX
answer:
  optionId: c
explanation:
  correct:
    en: Sora 2 adds a video-to-video modality, called remix, which applies targeted edits to an existing video instead of regenerating it, and it can generate audio. Microsoft Learn lists both capabilities for Sora 2, not for Sora 1.
    fr: "Sora 2 ajoute une modalité vidéo vers vidéo, appelée remix, qui applique des modifications ciblées à une vidéo existante au lieu de la régénérer, et il peut générer de l'audio. Microsoft Learn indique ces deux fonctionnalités pour Sora 2, pas pour Sora 1."
  options:
    a:
      en: GPT-Image-1.5 creates and edits still images, not videos.
      fr: GPT-Image-1.5 crée et modifie des images fixes, pas des vidéos.
    b:
      en: Sora 1 generates clips from text prompts and can use images as input, but remix and audio generation are described for Sora 2.
      fr: "Sora 1 génère des clips à partir d'invites en texte et peut utiliser des images en entrée, mais le remix et la génération audio sont décrits pour Sora 2."
    d:
      en: FLUX generates still images from text prompts.
      fr: "FLUX génère des images fixes à partir d'invites en texte."
references:
- title: Video generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation"
