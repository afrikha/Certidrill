id: ai901-1d-video-remix-audio
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware calls an image-generation model deployed in Microsoft Foundry by using the following Python code.

    ```python
    response = client.responses.create(
        model="img-deploy",
        input="A flat illustration of a bicycle on a mountain road",
        tools=[{"type": "image_generation"}],
    )
    result = next(
        item.result for item in response.output
        if item.type == "image_generation_call"
    )
    ```

    Proseware needs to save the generated picture as a PNG file.

    What does `result` contain?
  fr: |
    Proseware appelle un modèle de génération d'images déployé dans Microsoft Foundry avec le code Python suivant.

    ```python
    response = client.responses.create(
        model="img-deploy",
        input="A flat illustration of a bicycle on a mountain road",
        tools=[{"type": "image_generation"}],
    )
    result = next(
        item.result for item in response.output
        if item.type == "image_generation_call"
    )
    ```

    Proseware doit enregistrer l'image générée dans un fichier PNG.

    Que contient `result` ?
body:
  options:
  - id: a
    text:
      en: A URL from which the picture can be downloaded
      fr: "Une URL à partir de laquelle l'image peut être téléchargée"
  - id: b
    text:
      en: A text description of the picture that the model generated
      fr: "Une description en texte de l'image générée par le modèle"
  - id: c
    text:
      en: The generated picture, encoded as base64 text
      fr: "L'image générée, encodée en texte base64"
  - id: d
    text:
      en: The name of the deployment that generated the picture
      fr: "Le nom du déploiement qui a généré l'image"
answer:
  optionId: c
explanation:
  correct:
    en: "With the image_generation tool, the Responses API returns the picture in an output item of type image_generation_call. Its result field holds the image as base64 text, because JSON can carry only text. The code decodes it with base64.b64decode and writes the bytes to a file opened in binary mode."
    fr: "Avec l'outil image_generation, l'API Responses renvoie l'image dans un élément de sortie de type image_generation_call. Son champ result contient l'image en texte base64, car le JSON ne transporte que du texte. Le code la décode avec base64.b64decode et écrit les octets dans un fichier ouvert en mode binaire."
  options:
    a:
      en: "The picture itself is in the response; no download link is returned in this field."
      fr: "L'image elle-même figure dans la réponse ; aucun lien de téléchargement n'est renvoyé dans ce champ."
    b:
      en: "The code selects the image_generation_call item, which carries the image data, not a description of it."
      fr: "Le code sélectionne l'élément image_generation_call, qui porte les données de l'image, pas sa description."
    d:
      en: "The deployment name is what the code passes as model; the result field carries the generated image."
      fr: "Le nom du déploiement est ce que le code passe comme model ; le champ result porte l'image générée."
references:
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
