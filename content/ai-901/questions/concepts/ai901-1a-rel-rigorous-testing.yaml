id: ai901-1a-rel-rigorous-testing
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hospital plans to deploy an AI system that adjusts the dosage of medication pumps.

    You need to apply the reliability and safety principle before the system is used with patients.

    What should you do?
  fr: |
    Un hôpital prévoit de déployer un système d'IA qui ajuste le dosage de pompes à médicaments.

    Vous devez appliquer le principe de fiabilité et de sécurité avant que le système soit utilisé avec des patients.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Test rigorously how the system responds to circumstances that weren't anticipated.", fr: "Tester rigoureusement la réaction du système à des circonstances qui n'avaient pas été anticipées." }
    - id: b
      text: { en: "Ask each patient to choose how the system may use their medical data.", fr: "Demander à chaque patient de choisir comment le système peut utiliser ses données médicales." }
    - id: c
      text: { en: "Publish a description of how the system calculates each dosage.", fr: "Publier une description de la manière dont le système calcule chaque dosage." }
    - id: d
      text: { en: "Provide the interface of the system in several accessible formats.", fr: "Proposer l'interface du système dans plusieurs formats accessibles." }
answer: { optionId: a }
explanation:
  correct:
    en: "For reliability and safety, a system is tested rigorously during development and deployment so that it responds safely to unanticipated circumstances and has no unexpected performance failures. This matters most for a system that affects human safety."
    fr: "Pour la fiabilité et la sécurité, un système est testé rigoureusement pendant le développement et le déploiement afin qu'il réagisse sans danger aux circonstances imprévues et ne présente pas de défaillance inattendue. C'est d'autant plus important pour un système qui touche à la sécurité des personnes."
  options:
    b: { en: "Giving people control over how their data is used is a privacy and security measure.", fr: "Donner aux personnes le contrôle de l'utilisation de leurs données est une mesure de confidentialité et de sécurité." }
    c: { en: "Explaining how the system reaches its results is a transparency measure.", fr: "Expliquer comment le système parvient à ses résultats est une mesure de transparence." }
    d: { en: "Accessible formats serve inclusiveness.", fr: "Les formats accessibles servent l'inclusion." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
