id: ai901-1a-incl-yn-basics
objective: "1.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "Adopting recognized accessibility standards supports the inclusiveness principle.", fr: "Adopter des normes d'accessibilité reconnues sert le principe d'inclusion." }
    - id: s2
      text: { en: "AI can open access to education, employment and government services for people with disabilities.", fr: "L'IA peut ouvrir l'accès à l'éducation, à l'emploi et aux services publics aux personnes en situation de handicap." }
    - id: s3
      text: { en: "Making sure that applicants who have similar qualifications receive similar recommendations is primarily an inclusiveness consideration.", fr: "S'assurer que des candidats aux qualifications similaires reçoivent des recommandations similaires est avant tout une considération d'inclusion." }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Inclusiveness means that AI systems work for everyone: recognized accessibility standards serve that goal, and AI can open doors to education, employment, government services and information for people with disabilities. Similar recommendations for similar applicants is the definition of fairness."
    fr: "L'inclusion signifie que les systèmes d'IA fonctionnent pour tous : les normes d'accessibilité reconnues servent cet objectif, et l'IA peut ouvrir aux personnes en situation de handicap les portes de l'éducation, de l'emploi, des services publics et de l'information. Des recommandations similaires pour des candidats similaires correspondent à la définition de l'impartialité."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
