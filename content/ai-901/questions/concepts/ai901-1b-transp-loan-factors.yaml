id: ai901-1b-transp-loan-factors
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses an AI system to help decide whether loan applications are approved. The bank wants every applicant to be able to understand which factors led to the decision on their application.

    Which responsible AI principle does this requirement address?
  fr: |
    Woodgrove Bank utilise un système d'IA pour aider à décider si les demandes de prêt sont acceptées. La banque veut que chaque demandeur puisse comprendre quels facteurs ont conduit à la décision prise sur sa demande.

    À quel principe de l'IA responsable cette exigence répond-elle ?
body:
  options:
    - { id: a, text: { en: "Accountability", fr: "Responsabilité" } }
    - { id: b, text: { en: "Fairness", fr: "Impartialité" } }
    - { id: c, text: { en: "Transparency", fr: "Transparence" } }
    - { id: d, text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Transparency means that people can understand how an AI system reaches its results, especially when those results inform decisions that affect their lives, such as a credit decision. Explaining the factors behind a decision makes the behavior of the system intelligible to the people it affects."
    fr: "La transparence signifie que les personnes peuvent comprendre comment un système d'IA parvient à ses résultats, surtout quand ces résultats orientent des décisions qui touchent leur vie, comme une décision de crédit. Expliquer les facteurs d'une décision rend le comportement du système intelligible pour les personnes concernées."
  options:
    a:
      en: "Accountability is about the people who answer for the system and can review or override its decisions, not about explaining a decision."
      fr: "La responsabilité porte sur les personnes qui répondent du système et peuvent revoir ou annuler ses décisions, pas sur l'explication d'une décision."
    b:
      en: "Fairness is about giving comparable applicants comparable outcomes; the requirement here is to make the outcome understandable."
      fr: "L'impartialité consiste à donner des résultats comparables à des demandeurs comparables ; l'exigence porte ici sur la compréhension du résultat."
    d:
      en: "Reliability and safety is about the system performing as designed, including in unexpected conditions."
      fr: "La fiabilité et la sécurité portent sur le fait que le système fonctionne comme prévu, y compris dans des conditions inattendues."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai
