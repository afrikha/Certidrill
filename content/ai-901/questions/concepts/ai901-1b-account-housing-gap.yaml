id: ai901-1b-account-housing-gap
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A city uses an AI system to allocate social housing. The city publishes how the system works and tells applicants that AI is used. Tests show that the system gives comparable applicants comparable results. However, no person reviews the allocations, and nobody is designated to handle errors.

    Which responsible AI principle is the city failing to apply?
  fr: |
    Une ville utilise un système d'IA pour attribuer des logements sociaux. La ville publie le fonctionnement du système et informe les demandeurs que l'IA est utilisée. Des tests montrent que le système donne des résultats comparables à des demandeurs comparables. En revanche, personne ne relit les attributions et personne n'est désigné pour traiter les erreurs.

    Quel principe de l'IA responsable la ville n'applique-t-elle pas ?
body:
  options:
    - { id: a, text: { en: "Accountability", fr: "Responsabilité" } }
    - { id: b, text: { en: "Fairness", fr: "Impartialité" } }
    - { id: c, text: { en: "Transparency", fr: "Transparence" } }
    - { id: d, text: { en: "Privacy and security", fr: "Confidentialité et sécurité" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The system is the final authority on a decision that affects people's lives, and nobody answers for its errors. Accountability requires that humans keep meaningful control and that a clear system of governance exists to correct the system."
    fr: "Le système est l'autorité finale sur une décision qui touche la vie des gens, et personne ne répond de ses erreurs. La responsabilité exige que des humains gardent un contrôle significatif et qu'un système clair de gouvernance existe pour corriger le système."
  options:
    b:
      en: "The tests show comparable results for comparable applicants, which is what fairness requires."
      fr: "Les tests montrent des résultats comparables pour des demandeurs comparables, ce qu'exige l'impartialité."
    c:
      en: "The city discloses the use of AI and publishes how the system works: transparency is applied."
      fr: "La ville signale l'utilisation de l'IA et publie le fonctionnement du système : la transparence est appliquée."
    d:
      en: "Nothing in the scenario describes a problem with the protection of applicants' data."
      fr: "Rien dans le scénario ne décrit un problème de protection des données des demandeurs."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai
