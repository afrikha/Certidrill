id: ai901-1b-model-yn-variants
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "GPT-4.1 accepts images as well as text in the same prompt."
        fr: "GPT-4.1 accepte des images aussi bien que du texte dans la même invite."
    - id: s2
      text:
        en: "GPT-Image-1.5 supports editing an existing image as well as creating an image from text."
        fr: "GPT-Image-1.5 prend en charge la modification d'une image existante aussi bien que la création d'une image à partir de texte."
    - id: s3
      text:
        en: "GPT-Image-1-Mini is designed for higher image fidelity than GPT-Image-1.5, at a higher cost."
        fr: "GPT-Image-1-Mini est conçu pour une fidélité d'image supérieure à celle de GPT-Image-1.5, pour un coût plus élevé."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "GPT-4.1 is a multimodal model: it processes text and images in the same prompt and answers in text. GPT-Image-1.5 supports text-to-image, image-to-image and precise image editing, and it is the high-fidelity model of the family. GPT-Image-1-Mini is the lighter, more cost-efficient variant: it favors lower latency and lower cost over maximum fidelity."
    fr: "GPT-4.1 est un modèle multimodal : il traite du texte et des images dans la même invite et répond en texte. GPT-Image-1.5 prend en charge la génération d'image à partir de texte ou d'une image et la modification précise d'images, et c'est le modèle haute fidélité de la famille. GPT-Image-1-Mini est la variante plus légère et plus économique : elle privilégie une latence et un coût réduits plutôt que la fidélité maximale."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
