id: ai901-1b-model-yn-variants
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Sora 2 can generate a video from an image as well as from a text prompt."
        fr: "Sora 2 peut générer une vidéo à partir d'une image aussi bien qu'à partir d'une invite textuelle."
    - id: s2
      text:
        en: "GPT-Image-1.5 supports editing an existing image as well as creating an image from text."
        fr: "GPT-Image-1.5 prend en charge la modification d'une image existante aussi bien que la création d'une image à partir de texte."
    - id: s3
      text:
        en: "GPT-Image-1-Mini is designed for higher image fidelity than GPT-Image-1, at a higher cost."
        fr: "GPT-Image-1-Mini est conçu pour une fidélité d'image supérieure à celle de GPT-Image-1, pour un coût plus élevé."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Sora 2 supports text-to-video, image-to-video and video-to-video generation. GPT-Image-1.5 supports text-to-image, image-to-image and precise image editing. GPT-Image-1-Mini is the lighter, more cost-efficient variant of GPT-Image-1: it favors lower latency and lower cost over maximum fidelity."
    fr: "Sora 2 prend en charge la génération de vidéo à partir de texte, d'une image ou d'une vidéo. GPT-Image-1.5 prend en charge la génération d'image à partir de texte ou d'une image et la modification précise d'images. GPT-Image-1-Mini est la variante plus légère et plus économique de GPT-Image-1 : elle privilégie une latence et un coût réduits plutôt que la fidélité maximale."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
