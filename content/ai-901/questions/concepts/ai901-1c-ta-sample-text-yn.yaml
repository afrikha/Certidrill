id: ai901-1c-ta-sample-text-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You analyze the following customer comment:

    *Our flight to Madrid on Friday was delayed by three hours, and the crew of Northwind Air was unhelpful.*

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous analysez le commentaire de client suivant :

    *Our flight to Madrid on Friday was delayed by three hours, and the crew of Northwind Air was unhelpful.*

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Entity detection can identify Madrid as a location.
        fr: La détection d'entités peut identifier Madrid comme un lieu.
    - id: s2
      text:
        en: Sentiment analysis returns the list of the main concepts of the comment, such as "flight" and "crew".
        fr: L'analyse des sentiments renvoie la liste des principaux concepts du commentaire, comme « flight » et « crew ».
    - id: s3
      text:
        en: Sentiment analysis can classify the comment as negative.
        fr: L'analyse des sentiments peut classer le commentaire comme négatif.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Entity detection finds items of known categories: Madrid is a location, Friday a date, Northwind Air an organization. The list of main concepts, such as "flight" and "crew", is produced by key phrase extraction. Sentiment analysis classifies the text as positive, negative or neutral; a delayed flight and an unhelpful crew make this comment negative.
    fr: |
      La détection d'entités trouve des éléments de catégories connues : Madrid est un lieu, Friday une date, Northwind Air une organisation. La liste des principaux concepts, comme « flight » et « crew », est produite par l'extraction d'expressions clés. L'analyse des sentiments classe le texte comme positif, négatif ou neutre ; un vol retardé et un équipage peu serviable rendent ce commentaire négatif.
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
