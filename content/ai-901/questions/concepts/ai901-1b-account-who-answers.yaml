id: ai901-1b-account-who-answers
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys builds a shopping agent on a model from the Foundry model catalog and makes the agent available to its customers.

    According to the accountability principle, who answers for how the agent operates?
  fr: |
    Tailspin Toys crée un agent d'achat à partir d'un modèle du catalogue de modèles de Foundry et met l'agent à la disposition de ses clients.

    Selon le principe de responsabilité, qui répond du fonctionnement de l'agent ?
body:
  options:
    - { id: a, text: { en: "The customers of Tailspin Toys who send prompts to the agent", fr: "Les clients de Tailspin Toys qui envoient des invites à l'agent" } }
    - { id: b, text: { en: "The language model that generates the answers of the agent", fr: "Le modèle de langage qui génère les réponses de l'agent" } }
    - { id: c, text: { en: "The people at Tailspin Toys who designed and deployed the agent", fr: "Les personnes de Tailspin Toys qui ont conçu et déployé l'agent" } }
    - { id: d, text: { en: "The provider that published the model in the model catalog", fr: "Le fournisseur qui a publié le modèle dans le catalogue de modèles" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Under the accountability principle, the people and organizations that design and deploy an AI system are accountable for how it operates. Tailspin Toys chose the model, built the agent and released it, so its teams must answer for the agent's behavior."
    fr: "Selon le principe de responsabilité, les personnes et les organisations qui conçoivent et déploient un système d'IA sont responsables de son fonctionnement. Tailspin Toys a choisi le modèle, créé l'agent et l'a mis en service : ce sont donc ses équipes qui répondent du comportement de l'agent."
  options:
    a:
      en: "Users interact with the agent; they didn't design or deploy it."
      fr: "Les utilisateurs interagissent avec l'agent ; ils ne l'ont ni conçu ni déployé."
    b:
      en: "A model is a component: accountability always rests with people, never with the AI itself."
      fr: "Un modèle est un composant : la responsabilité revient toujours à des personnes, jamais à l'IA elle-même."
    d:
      en: "The provider documents its model, but the organization that builds and deploys an agent on it answers for that agent."
      fr: "Le fournisseur documente son modèle, mais c'est l'organisation qui crée et déploie un agent à partir de celui-ci qui répond de cet agent."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Transparency Note for Foundry Agent Service"
    url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/agents/transparency-note
