id: ai901-1c-ta-language-routing
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel agency receives customer messages from many countries. Each message must first be routed to the team that handles the language in which it is written. No information about the sender is available.

    Which capability should the agency apply first to each message?
  fr: |
    Une agence de voyages reçoit des messages de clients de nombreux pays. Chaque message doit d'abord être dirigé vers l'équipe qui traite la langue dans laquelle il est écrit. Aucune information sur l'expéditeur n'est disponible.

    Quelle fonctionnalité l'agence doit-elle appliquer en premier à chaque message ?
body:
  options:
    - { id: a, text: { en: "Entity detection", fr: "Détection d'entités" } }
    - { id: b, text: { en: "Key phrase extraction", fr: "Extraction d'expressions clés" } }
    - { id: c, text: { en: "Sentiment analysis", fr: "Analyse des sentiments" } }
    - { id: d, text: { en: "Language detection", fr: "Détection de langue" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Language detection identifies the primary language of a text and returns it with a confidence score. It is often the first step of a multilingual workflow, because the result is used to route the text to the right process.
    fr: |
      La détection de langue identifie la langue principale d'un texte et la renvoie avec un score de confiance. C'est souvent la première étape d'un flux multilingue, car le résultat sert à diriger le texte vers le bon traitement.
  options:
    a: { en: "Entity detection can find a country or a city named in the message, which does not tell in which language the message is written.", fr: "La détection d'entités peut trouver un pays ou une ville cités dans le message, ce qui n'indique pas dans quelle langue le message est écrit." }
    b: { en: "Key phrase extraction returns the main concepts of the message, not its language.", fr: "L'extraction d'expressions clés renvoie les principaux concepts du message, pas sa langue." }
    c: { en: "Sentiment analysis returns the opinion expressed, not the language.", fr: "L'analyse des sentiments renvoie l'opinion exprimée, pas la langue." }
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
