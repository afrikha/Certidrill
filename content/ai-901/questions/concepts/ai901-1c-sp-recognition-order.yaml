id: ai901-1c-sp-recognition-order
objective: "1.3.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    An application uses speech recognition to turn what a user says into text.

    Which four steps occur in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une application utilise la reconnaissance vocale pour transformer en texte ce que dit un utilisateur.

    Quelles sont les quatre étapes qui se déroulent dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: capture, text: { en: "The spoken audio is captured from a microphone or loaded from a file.", fr: "L'audio parlé est capté depuis un microphone ou chargé depuis un fichier." } }
    - { id: acoustic, text: { en: "An acoustic model converts the audio into phonemes.", fr: "Un modèle acoustique convertit l'audio en phonèmes." } }
    - { id: language, text: { en: "A language model maps the phonemes to words.", fr: "Un modèle de langage associe les phonèmes à des mots." } }
    - { id: text, text: { en: "The recognized words are returned as text.", fr: "Les mots reconnus sont renvoyés sous forme de texte." } }
    - { id: prosody, text: { en: "The phonetic transcription is broken down into prosodic units.", fr: "La transcription phonétique est découpée en unités prosodiques." } }
    - { id: voice, text: { en: "A voice, a speaking rate and a pitch are applied to the phonemes.", fr: "Une voix, un débit de parole et une hauteur sont appliqués aux phonèmes." } }
answer:
  sequence: [ capture, acoustic, language, text ]
explanation:
  correct:
    en: |
      Speech recognition starts from audio, captured from a microphone or read from a file. An acoustic model converts the audio into phonemes, the representations of specific sounds; a language model then maps the phonemes to words, and the recognized words are returned as text.
    fr: |
      La reconnaissance vocale part de l'audio, capté depuis un microphone ou lu dans un fichier. Un modèle acoustique convertit l'audio en phonèmes, les représentations de sons précis ; un modèle de langage associe ensuite les phonèmes à des mots, et les mots reconnus sont renvoyés sous forme de texte.
  options:
    prosody: { en: "Breaking a phonetic transcription into prosodic units (phrases, clauses or sentences) is a step of speech synthesis.", fr: "Découper une transcription phonétique en unités prosodiques (groupes de mots, propositions ou phrases) est une étape de la synthèse vocale." }
    voice: { en: "Applying a voice, a speaking rate and a pitch happens when audio is synthesized from text.", fr: "Appliquer une voix, un débit de parole et une hauteur se fait lorsque l'audio est synthétisé à partir de texte." }
references:
  - title: Speech recognition
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: Speech synthesis
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
