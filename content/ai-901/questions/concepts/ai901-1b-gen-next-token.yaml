id: ai901-1b-gen-next-token
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    How does a large language model (LLM) generate its response to a prompt?
  fr: |
    Comment un grand modèle de langage (LLM) génère-t-il sa réponse à une invite ?
body:
  options:
    - { id: a, text: { en: "It searches its training documents and returns the passage that best matches the prompt.", fr: "Il recherche dans ses documents d'entraînement et renvoie le passage qui correspond le mieux à l'invite." } }
    - { id: b, text: { en: "It repeatedly predicts the most probable next token and appends it to the sequence.", fr: "Il prédit de manière répétée le jeton suivant le plus probable et l'ajoute à la séquence." } }
    - { id: c, text: { en: "It applies rules that developers wrote in the system prompt for each type of question.", fr: "Il applique des règles que les développeurs ont écrites dans l'invite système pour chaque type de question." } }
    - { id: d, text: { en: "It selects the stored response whose vector has the highest cosine similarity to the prompt.", fr: "Il sélectionne la réponse stockée dont le vecteur a la similarité cosinus la plus élevée avec l'invite." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An LLM is trained to generate a completion from a prompt. Starting from the prompt, it predicts the most probable next token, appends it to the sequence and repeats the process until it predicts that the sequence has ended."
    fr: "Un LLM est entraîné à générer une complétion à partir d'une invite. En partant de l'invite, il prédit le jeton suivant le plus probable, l'ajoute à la séquence et répète le processus jusqu'à prédire que la séquence est terminée."
  options:
    a:
      en: "The model doesn't keep or search its training documents; it has learned relationships between tokens."
      fr: "Le modèle ne conserve pas ses documents d'entraînement et n'y recherche rien ; il a appris des relations entre les jetons."
    c:
      en: "A system prompt guides the behavior of the model, but the text is still generated by prediction, not by rules."
      fr: "Une invite système oriente le comportement du modèle, mais le texte reste généré par prédiction, pas par des règles."
    d:
      en: "The model has no store of ready-made responses; cosine similarity measures how close two embeddings are."
      fr: "Le modèle n'a pas de réserve de réponses toutes faites ; la similarité cosinus mesure la proximité de deux embeddings."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
