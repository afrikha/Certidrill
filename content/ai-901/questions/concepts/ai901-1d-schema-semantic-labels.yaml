id: ai901-1d-schema-semantic-labels
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses an analyzer whose schema contains a field named `InvoiceNumber`. Some vendors label the value *Invoice No.*, others label it *Invoice #*, and some print the number without any label.

    How does the analyzer handle these invoices?
  fr: |
    Adatum utilise un analyseur dont le schéma contient un champ nommé `InvoiceNumber`. Certains fournisseurs libellent la valeur *Invoice No.*, d'autres *Invoice #*, et certains impriment le numéro sans aucun libellé.

    Comment l'analyseur traite-t-il ces factures ?
body:
  options:
  - id: a
    text:
      en: It fills in the field only when a label matches the field name exactly, because fields are matched by label text.
      fr: "Il ne remplit le champ que si un libellé correspond exactement au nom du champ, car les champs sont associés d'après le texte du libellé."
  - id: b
    text:
      en: It fills in the field only when the number is at a fixed position on the page, because fields are matched by position.
      fr: "Il ne remplit le champ que si le numéro se trouve à une position fixe sur la page, car les champs sont associés d'après la position."
  - id: c
    text:
      en: It needs a separate schema for each vendor, because a schema supports a single label per field.
      fr: "Il lui faut un schéma distinct par fournisseur, car un schéma n'accepte qu'un seul libellé par champ."
  - id: d
    text:
      en: It can fill in the field in all three cases, because the schema is applied semantically.
      fr: Il peut remplir le champ dans les trois cas, car le schéma est appliqué sémantiquement.
answer:
  optionId: d
explanation:
  correct:
    en: "Schemas are applied semantically: a field can be extracted even when the labels differ or are missing, as long as the analyzer determines that the value represents the same concept. *Invoice No.*, *Invoice #* and an unlabeled number can therefore all map to `InvoiceNumber`."
    fr: "Les schémas sont appliqués sémantiquement : un champ peut être extrait même si les libellés diffèrent ou sont absents, dès lors que l'analyseur détermine que la valeur représente le même concept. *Invoice No.*, *Invoice #* et un numéro sans libellé peuvent donc tous alimenter `InvoiceNumber`."
  options:
    a:
      en: The match is based on the meaning of the value, not on the exact text of a label.
      fr: "L'association repose sur le sens de la valeur, pas sur le texte exact d'un libellé."
    b:
      en: The match is based on the meaning of the value, not on a fixed position in the page.
      fr: "L'association repose sur le sens de la valeur, pas sur une position fixe dans la page."
    c:
      en: "One analyzer applies the same schema to every document; no schema per vendor is required."
      fr: "Un seul analyseur applique le même schéma à tous les documents ; aucun schéma par fournisseur n'est nécessaire."
references:
- title: Extract information from documents
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents"
