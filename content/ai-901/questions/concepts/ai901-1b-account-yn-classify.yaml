id: ai901-1b-account-yn-classify
objective: "1.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Listing in each answer the documents that the answer is based on is an application of the accountability principle."
        fr: "Indiquer dans chaque réponse les documents sur lesquels elle s'appuie est une application du principe de responsabilité."
    - id: s2
      text:
        en: "Recording who approved the release of an AI system, and why, supports the accountability principle."
        fr: "Consigner qui a approuvé la mise en service d'un système d'IA, et pourquoi, va dans le sens du principe de responsabilité."
    - id: s3
      text:
        en: "Publishing the known limitations of an AI system is an application of the accountability principle."
        fr: "Publier les limites connues d'un système d'IA est une application du principe de responsabilité."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Accountability is about people answering for a system, so keeping governance data such as who released a system and why supports it. Showing the sources of an answer and publishing the limitations of a system help users understand the system: both are transparency measures."
    fr: "La responsabilité veut que des personnes répondent d'un système : conserver des données de gouvernance, comme qui a mis un système en service et pourquoi, va donc dans ce sens. Montrer les sources d'une réponse et publier les limites d'un système aident les utilisateurs à comprendre le système : ce sont deux mesures de transparence."
references:
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
