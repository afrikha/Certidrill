id: ai901-1b-gen-yn-grounding
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A generative AI model can produce content that sounds reasonable but is inaccurate."
        fr: "Un modèle IA génératif peut produire un contenu qui semble plausible mais qui est inexact."
    - id: s2
      text:
        en: "Grounding prompts in data from trusted sources eliminates the risk of inaccurate responses."
        fr: "Ancrer les invites dans des données issues de sources de confiance élimine le risque de réponses inexactes."
    - id: s3
      text:
        en: "When retrieved documents are added to a prompt, the response is grounded in the information that they contain."
        fr: "Quand des documents récupérés sont ajoutés à une invite, la réponse est ancrée dans les informations qu'ils contiennent."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A model predicts probable text and doesn't verify facts, so it can fabricate content that sounds reasonable. Adding retrieved information to the prompt (RAG) grounds the response in that information, which reduces the likelihood of inaccurate responses but doesn't completely eliminate it."
    fr: "Un modèle prédit un texte probable et ne vérifie pas les faits : il peut donc fabriquer un contenu qui semble plausible. Ajouter des informations récupérées à l'invite (RAG) ancre la réponse dans ces informations, ce qui réduit la probabilité de réponses inexactes sans l'éliminer complètement."
references:
  - title: "Transparency note for Azure OpenAI"
    url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/transparency-note
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
