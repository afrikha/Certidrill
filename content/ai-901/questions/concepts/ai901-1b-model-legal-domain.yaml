id: ai901-1b-model-legal-domain
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm wants a generative AI application that drafts and reviews contracts. The firm needs a model that is tuned for the vocabulary and the tasks of the legal sector.

    Which type of model should the firm look for in the Foundry model catalog?
  fr: |
    Un cabinet d'avocats veut une application d'IA générative qui rédige et relit des contrats. Le cabinet a besoin d'un modèle adapté au vocabulaire et aux tâches du secteur juridique.

    Quel type de modèle le cabinet doit-il rechercher dans le catalogue de modèles de Foundry ?
body:
  options:
    - { id: a, text: { en: "A general-purpose small language model", fr: "Un petit modèle de langage à usage général" } }
    - { id: b, text: { en: "A text embedding model", fr: "Un modèle d'embedding de texte" } }
    - { id: c, text: { en: "An industry or domain-specific model", fr: "Un modèle spécifique à un secteur ou à un domaine" } }
    - { id: d, text: { en: "An image generation model", fr: "Un modèle de génération d'images" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Model selection starts with the workload, the task type and the constraints. For industries such as finance, healthcare and legal, the catalog contains domain-tuned models, and it can be filtered by industry."
    fr: "Le choix d'un modèle part de la charge de travail, du type de tâche et des contraintes. Pour des secteurs comme la finance, la santé et le juridique, le catalogue contient des modèles adaptés à un domaine, et il peut être filtré par secteur."
  options:
    a:
      en: "A general-purpose small model isn't tuned for legal vocabulary and tasks."
      fr: "Un petit modèle à usage général n'est pas adapté au vocabulaire et aux tâches juridiques."
    b:
      en: "An embedding model returns vectors; it can't draft or review a contract."
      fr: "Un modèle d'embedding renvoie des vecteurs ; il ne peut ni rédiger ni relire un contrat."
    d:
      en: "An image generation model creates images, not contract text."
      fr: "Un modèle de génération d'images crée des images, pas le texte d'un contrat."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Overview of Microsoft Foundry Models"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview
