id: ai901-1c-sp-live-translation
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At an international conference, a presenter speaks English. Attendees must hear the talk in Spanish through their headphones while the presenter is speaking.

    Which capability of Azure Speech meets this requirement?
  fr: |
    Lors d'une conférence internationale, un présentateur parle anglais. Les participants doivent entendre l'exposé en espagnol dans leur casque pendant que le présentateur parle.

    Quelle fonctionnalité d'Azure Speech répond à ce besoin ?
body:
  options:
    - { id: a, text: { en: "Batch transcription", fr: "La transcription par lots" } }
    - { id: b, text: { en: "Pronunciation assessment", fr: "L'évaluation de la prononciation" } }
    - { id: c, text: { en: "Diarization", fr: "La diarisation" } }
    - { id: d, text: { en: "Speech translation", fr: "La traduction vocale" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Speech translation translates spoken audio in real time into another language. The result can be translated text, synthesized speech in the target language, or both, which covers speech-to-speech translation for the attendees.
    fr: |
      La traduction vocale traduit en temps réel de l'audio parlé vers une autre langue. Le résultat peut être du texte traduit, de la parole synthétisée dans la langue cible, ou les deux, ce qui couvre la traduction de parole à parole pour les participants.
  options:
    a: { en: "Batch transcription returns, after the event, the text of stored recordings in the language spoken.", fr: "La transcription par lots renvoie, après l'événement, le texte d'enregistrements stockés dans la langue parlée." }
    b: { en: "Pronunciation assessment gives a speaker feedback on accuracy and fluency; it translates nothing.", fr: "L'évaluation de la prononciation donne à une personne un retour sur la précision et la fluidité ; elle ne traduit rien." }
    c: { en: "Diarization separates the speakers of a recording; it translates nothing.", fr: "La diarisation sépare les interlocuteurs d'un enregistrement ; elle ne traduit rien." }
references:
  - title: What is speech translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation
  - title: What Is Azure Speech?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview
