id: ai901-1c-ta-details-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You document the results that text analysis techniques return.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez les résultats que renvoient les techniques d'analyse de texte.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Key phrase extraction assigns a category, such as Person or Organization, to each phrase that it returns.
        fr: L'extraction d'expressions clés attribue une catégorie, comme Person ou Organization, à chaque expression qu'elle renvoie.
    - id: s2
      text:
        en: Sentiment analysis can return a result for each sentence of a document as well as for the whole document.
        fr: L'analyse des sentiments peut renvoyer un résultat pour chaque phrase d'un document ainsi que pour le document entier.
    - id: s3
      text:
        en: Entity detection can return a subtype for an entity, such as Date or Duration for a DateTime entity.
        fr: La détection d'entités peut renvoyer un sous-type pour une entité, comme Date ou Duration pour une entité DateTime.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Key phrase extraction returns the main concepts as plain phrases, without categories; assigning categories is what entity detection does. Sentiment is evaluated both at the sentence level and at the document level. An entity has a type and sometimes a subtype: a DateTime entity can be a Date, a Time or a Duration, and a Quantity can be a Number, a Percentage or a Dimension.
    fr: |
      L'extraction d'expressions clés renvoie les principaux concepts sous forme d'expressions simples, sans catégorie ; attribuer des catégories est le rôle de la détection d'entités. Le sentiment est évalué à la fois au niveau de la phrase et au niveau du document. Une entité a un type et parfois un sous-type : une entité DateTime peut être Date, Time ou Duration, et une entité Quantity peut être Number, Percentage ou Dimension.
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
  - title: What are sentiment analysis and opinion mining?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/sentiment-opinion-mining/overview
