id: ai901-1c-param-temperature-consistent
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An HR assistant uses a model deployed in Microsoft Foundry. When employees ask the same question about the leave policy, the wording of the answer changes noticeably from one request to the next.

    You need the answers to be more focused and consistent.

    What should you do?
  fr: |
    Un assistant RH utilise un modèle déployé dans Microsoft Foundry. Lorsque des employés posent la même question sur la politique de congés, la formulation de la réponse change nettement d'une requête à l'autre.

    Les réponses doivent être plus ciblées et plus régulières.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the temperature.", fr: "Augmenter la température." } }
    - { id: b, text: { en: "Decrease the temperature.", fr: "Diminuer la température." } }
    - { id: c, text: { en: "Decrease the max output tokens value.", fr: "Diminuer le nombre maximal de jetons de sortie." } }
    - { id: d, text: { en: "Increase the tokens per minute (TPM) limit.", fr: "Augmenter la limite de jetons par minute (TPM)." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Temperature controls how random the output is. A lower value makes the model choose more probable tokens, so the answers are more focused and vary less between requests.
    fr: |
      La température contrôle le caractère aléatoire de la sortie. Une valeur plus basse amène le modèle à choisir des jetons plus probables : les réponses sont plus ciblées et varient moins d'une requête à l'autre.
  options:
    a: { en: "A higher temperature makes the output more random and more varied, which is the opposite of the goal.", fr: "Une température plus élevée rend la sortie plus aléatoire et plus variée, à l'opposé de l'objectif." }
    c: { en: "Max output tokens caps the length of a response; it does not change how much the wording varies.", fr: "Le nombre maximal de jetons de sortie plafonne la longueur d'une réponse ; il ne change pas la variabilité de la formulation." }
    d: { en: "The TPM limit sets how many tokens the deployment can process per minute; it has no effect on the content of the answers.", fr: "La limite TPM fixe le nombre de jetons que le déploiement peut traiter par minute ; elle n'a aucun effet sur le contenu des réponses." }
references:
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
