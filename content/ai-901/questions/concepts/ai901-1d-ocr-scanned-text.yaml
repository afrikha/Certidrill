id: ai901-1d-ocr-scanned-text
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores thousands of scanned letters as image files. Contoso needs to convert the printed and handwritten text of the images into digital text that can be searched.

    Which technique should Contoso use?
  fr: |
    Contoso stocke des milliers de lettres numérisées sous forme de fichiers image. Contoso doit convertir le texte imprimé et manuscrit des images en texte numérique dans lequel il est possible de faire des recherches.

    Quelle technique faut-il utiliser ?
body:
  options:
  - id: a
    text:
      en: Speech recognition
      fr: La reconnaissance vocale
  - id: b
    text:
      en: Sentiment analysis
      fr: "L'analyse des sentiments"
  - id: c
    text:
      en: Optical character recognition (OCR)
      fr: La reconnaissance optique de caractères (OCR)
  - id: d
    text:
      en: Image generation
      fr: "La génération d'images"
answer:
  optionId: c
explanation:
  correct:
    en: Optical character recognition lets a computer read the text of an image, such as a scanned document or a photo, and convert it into editable, searchable digital text. It handles printed and handwritten text.
    fr: "La reconnaissance optique de caractères permet à un ordinateur de lire le texte d'une image, par exemple un document numérisé ou une photo, et de le convertir en texte numérique modifiable, dans lequel il est possible de faire des recherches. Elle traite le texte imprimé et le texte manuscrit."
  options:
    a:
      en: "Speech recognition converts spoken audio into text; the letters are images, not recordings."
      fr: "La reconnaissance vocale convertit de l'audio parlé en texte ; les lettres sont des images, pas des enregistrements."
    b:
      en: "Sentiment analysis evaluates whether a text is positive, negative or neutral; it needs the text to be extracted first."
      fr: "L'analyse des sentiments évalue si un texte est positif, négatif ou neutre ; elle suppose que le texte a déjà été extrait."
    d:
      en: "Image generation creates new images from a description; it reads nothing."
      fr: "La génération d'images crée de nouvelles images à partir d'une description ; elle ne lit rien."
references:
- title: Extract information from documents
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents"
