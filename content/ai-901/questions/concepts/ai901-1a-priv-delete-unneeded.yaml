id: ai901-1a-priv-delete-unneeded
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AI shopping assistant inadvertently collected the home addresses of customers. The addresses aren't needed for the defined purpose of the assistant.

    What should the company do to respect the privacy and security principle?
  fr: |
    Un assistant d'achat basé sur l'IA a collecté par inadvertance les adresses personnelles de clients. Ces adresses ne sont pas nécessaires à la finalité définie de l'assistant.

    Que doit faire l'entreprise pour respecter le principe de confidentialité et de sécurité ?
body:
  options:
    - id: a
      text: { en: "Keep the addresses to improve future versions of the assistant.", fr: "Conserver les adresses pour améliorer les futures versions de l'assistant." }
    - id: b
      text: { en: "Move the addresses to a separate storage account and keep them there.", fr: "Déplacer les adresses vers un compte de stockage distinct et les y conserver." }
    - id: c
      text: { en: "Delete the addresses from the systems of the company.", fr: "Supprimer les adresses des systèmes de l'entreprise." }
    - id: d
      text: { en: "Share the addresses with partners after the customers are informed.", fr: "Partager les adresses avec des partenaires après en avoir informé les clients." }
answer: { optionId: c }
explanation:
  correct:
    en: "To maintain the integrity of personal data, an AI system uses it only for the time required and for the defined purposes. Personal data that was collected inadvertently, or that is no longer relevant to the defined purpose, is deleted."
    fr: "Pour maintenir l'intégrité des données personnelles, un système d'IA ne les utilise que pendant la durée nécessaire et pour les finalités définies. Les données personnelles collectées par inadvertance, ou qui ne sont plus pertinentes pour la finalité définie, sont supprimées."
  options:
    a: { en: "A possible future use isn't the defined purpose for which data may be kept.", fr: "Un éventuel usage futur n'est pas la finalité définie qui autorise à conserver les données." }
    b: { en: "Moving the data elsewhere still keeps personal data that the purpose doesn't require.", fr: "Déplacer les données ailleurs revient toujours à conserver des données personnelles que la finalité n'exige pas." }
    d: { en: "Sharing the data spreads personal data that should not have been collected in the first place.", fr: "Partager les données diffuse des données personnelles qui n'auraient pas dû être collectées." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
