id: ai901-1a-rel-yn-default-guardrails
objective: "1.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You deploy a text chat model in Microsoft Foundry and keep the default guardrail policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez un modèle de conversation textuel dans Microsoft Foundry et conservez la stratégie de garde-fous par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "A completion that is classified as low severity in the Violence category is blocked.", fr: "Une complétion classée en gravité faible (Low) dans la catégorie Violence est bloquée." }
    - id: s2
      text: { en: "Detection of user prompt injection attacks (jailbreak) is enabled.", fr: "La détection des attaques par injection d'invite utilisateur (jailbreak) est activée." }
    - id: s3
      text: { en: "The deployment has no content filter until you create a custom guardrail.", fr: "Le déploiement n'a aucun filtre de contenu tant que vous n'avez pas créé de garde-fou personnalisé." }
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Default safety policies apply to Foundry model deployments without any configuration (transcription models use a different configuration). The four core harm categories use the Medium threshold on prompts and completions: content of medium or high severity is blocked and low severity passes. Detection of user prompt attacks is enabled by default."
    fr: "Les stratégies de sécurité par défaut s'appliquent aux déploiements de modèles Foundry sans aucune configuration (les modèles de transcription utilisent une configuration différente). Les quatre catégories de préjudice principales utilisent le seuil Medium sur les invites et les complétions : le contenu de gravité moyenne ou élevée est bloqué et la gravité faible passe. La détection des attaques par invite utilisateur est activée par défaut."
references:
  - title: "Default Guardrail policies for Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/default-safety-policies
  - title: "Harm categories and severity levels in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-severity-levels
