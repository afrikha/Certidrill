id: ai901-1d-yn-two-deployments
objective: "1.3.4"
type: "yesno_statements"
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Microsoft Foundry resource that contains two model deployments: **chat1** (GPT-4.1) and **img1** (GPT-Image-1). No other model is deployed.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une ressource Microsoft Foundry qui contient deux déploiements de modèles : **chat1** (GPT-4.1) et **img1** (GPT-Image-1). Aucun autre modèle n'est déployé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Litware can use chat1 to explain a diagram that a user uploads.
      fr: Litware peut utiliser chat1 pour expliquer un diagramme chargé par un utilisateur.
  - id: s2
    text:
      en: Litware can use chat1 to create a 10-second video clip from a text prompt.
      fr: "Litware peut utiliser chat1 pour créer un clip vidéo de 10 secondes à partir d'une invite en texte."
  - id: s3
    text:
      en: Litware can use img1 to create a variation of an existing product picture.
      fr: "Litware peut utiliser img1 pour créer une variante d'une image de produit existante."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: "GPT-4.1 is a vision-enabled multimodal model: it interprets charts, diagrams, screenshots and photos and answers in text. It does not produce video; in Microsoft Foundry, video generation requires a Sora model. GPT-Image-1 supports text-to-image generation, image variations and image editing."
    fr: "GPT-4.1 est un modèle multimodal compatible avec la vision : il interprète des graphiques, des diagrammes, des captures d'écran et des photos, et répond en texte. Il ne produit pas de vidéo ; dans Microsoft Foundry, la génération de vidéos nécessite un modèle Sora. GPT-Image-1 prend en charge la génération d'images à partir de texte, les variantes d'images et la modification d'images."
references:
- title: Multimodal models for image analysis
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models"
- title: Video generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation"
