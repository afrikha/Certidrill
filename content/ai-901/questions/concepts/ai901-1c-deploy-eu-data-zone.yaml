id: ai901-1c-deploy-eu-data-zone
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to deploy a chat model in Microsoft Foundry. Prompts and responses must be processed only inside the European Union, and Contoso wants to pay for the tokens that it uses.

    Which deployment type should Contoso select?
  fr: |
    Contoso prévoit de déployer un modèle de conversation dans Microsoft Foundry. Les invites et les réponses doivent être traitées uniquement dans l'Union européenne, et Contoso veut payer les jetons qu'elle consomme.

    Quel type de déploiement Contoso doit-elle sélectionner ?
body:
  options:
    - { id: a, text: "Global Standard" }
    - { id: b, text: "Global Batch" }
    - { id: c, text: "Data Zone Standard" }
    - { id: d, text: "Global Provisioned" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Data Zone Standard deployment processes prompts and responses only inside the selected data zone (United States, European Union or Asia Pacific) and is billed per token. It is the pay-per-token choice when processing must stay in the EU.
    fr: |
      Un déploiement Data Zone Standard traite les invites et les réponses uniquement dans la zone de données choisie (États-Unis, Union européenne ou Asie-Pacifique) et il est facturé au jeton. C'est le choix avec paiement au jeton quand le traitement doit rester dans l'UE.
  options:
    a: { en: "Global Standard is billed per token, but requests may be processed in any Azure region.", fr: "Global Standard est facturé au jeton, mais les requêtes peuvent être traitées dans n'importe quelle région Azure." }
    b: { en: "Global Batch may process requests in any Azure region and does not answer in real time.", fr: "Global Batch peut traiter les requêtes dans n'importe quelle région Azure et ne répond pas en temps réel." }
    d: { en: "Global Provisioned may process requests in any Azure region and bills reserved provisioned throughput units, not tokens.", fr: "Global Provisioned peut traiter les requêtes dans n'importe quelle région Azure et facture des unités de débit approvisionné réservées, pas des jetons." }
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
