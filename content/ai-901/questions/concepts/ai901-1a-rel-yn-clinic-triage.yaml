id: ai901-1a-rel-yn-clinic-triage
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A clinic builds an AI assistant that suggests the urgency of patient requests.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une clinique crée un assistant d'IA qui suggère le degré d'urgence des demandes des patients.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "Because the assistant affects the safety of patients, it should be tested in a lab and in real-world scenarios.", fr: "Comme l'assistant touche à la sécurité des patients, il doit être testé en laboratoire et dans des scénarios réels." }
    - id: s2
      text: { en: "Involving medical experts in the design of the assistant supports its reliability and safety.", fr: "Impliquer des experts médicaux dans la conception de l'assistant contribue à sa fiabilité et à sa sécurité." }
    - id: s3
      text: { en: "After the assistant passes its tests, monitoring its performance in production is unnecessary.", fr: "Une fois que l'assistant a réussi ses tests, il est inutile de surveiller ses performances en production." }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "High-stakes systems that affect human safety or large populations are tested in both lab and real-world scenarios, and domain experts take part in the design when AI helps make consequential decisions about people. Tests before release don't replace the monitoring of ongoing performance, which verifies that the system keeps behaving as intended."
    fr: "Les systèmes à enjeux élevés qui touchent à la sécurité des personnes ou à de larges populations sont testés en laboratoire et dans des scénarios réels, et des experts du domaine participent à la conception lorsque l'IA aide à prendre des décisions importantes concernant des personnes. Les tests avant la mise en service ne remplacent pas la surveillance des performances dans la durée, qui vérifie que le système continue de se comporter comme prévu."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
