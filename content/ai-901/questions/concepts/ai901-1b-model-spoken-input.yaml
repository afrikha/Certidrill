id: ai901-1b-model-spoken-input
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders wants a chat application in which a user can send a recorded spoken question together with a text instruction in the same prompt. The model must answer in text.

    Which model should you deploy?
  fr: |
    Northwind Traders veut une application de conversation dans laquelle un utilisateur peut envoyer une question orale enregistrée accompagnée d'une instruction textuelle dans la même invite. Le modèle doit répondre en texte.

    Quel modèle devez-vous déployer ?
body:
  options:
    - { id: a, text: "text-embedding-3-small" }
    - { id: b, text: "Phi-4-multimodal-instruct" }
    - { id: c, text: "gpt-image-1" }
    - { id: d, text: "o3-mini" }
answer: { optionId: b }
explanation:
  correct:
    en: "A prompt that combines audio and text needs a multimodal model. Phi-4-multimodal-instruct is one of the multimodal models of the Foundry model catalog, which accept images and audio as well as text in a chat prompt."
    fr: "Une invite qui combine de l'audio et du texte nécessite un modèle multimodal. Phi-4-multimodal-instruct fait partie des modèles multimodaux du catalogue de modèles de Foundry, qui acceptent des images et de l'audio en plus du texte dans une invite de conversation."
  options:
    a:
      en: "text-embedding-3-small converts text into vectors and doesn't accept audio."
      fr: "text-embedding-3-small convertit du texte en vecteurs et n'accepte pas d'audio."
    c:
      en: "gpt-image-1 generates images from a description."
      fr: "gpt-image-1 génère des images à partir d'une description."
    d:
      en: "o3-mini is a reasoning model that accepts only text input."
      fr: "o3-mini est un modèle de raisonnement qui n'accepte que du texte en entrée."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Foundry Models sold by Azure"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
