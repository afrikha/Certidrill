id: ai901-1b-transp-agent-disclose
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are building a customer support agent for Fabrikam.

    You need to apply the transparency principle of responsible AI.

    What should you do?
  fr: |
    Vous créez un agent de support client pour Fabrikam.

    Vous devez appliquer le principe de transparence de l'IA responsable.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Require a support employee to approve each refund that the agent proposes.", fr: "Exiger qu'un employé du support approuve chaque remboursement proposé par l'agent." } }
    - { id: b, text: { en: "Tell users that they are chatting with an AI agent and describe what it can and can't do.", fr: "Indiquer aux utilisateurs qu'ils conversent avec un agent IA et décrire ce qu'il sait et ne sait pas faire." } }
    - { id: c, text: { en: "Remove customer names and addresses from the transcripts before they are stored.", fr: "Supprimer les noms et adresses des clients des transcriptions avant leur stockage." } }
    - { id: d, text: { en: "Add speech input and output so that users who can't type can use the agent.", fr: "Ajouter une entrée et une sortie vocales pour les utilisateurs qui ne peuvent pas taper au clavier." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Transparency requires an AI system to make its presence, capabilities and limitations clear. Telling users that they are talking to an AI agent and what it can do lets them make informed decisions about how much to rely on it."
    fr: "La transparence exige qu'un système d'IA indique clairement sa présence, ses capacités et ses limites. Dire aux utilisateurs qu'ils parlent à un agent IA et ce qu'il sait faire leur permet de décider en connaissance de cause dans quelle mesure s'y fier."
  options:
    a:
      en: "Human approval of the agent's actions is human oversight, which belongs to accountability."
      fr: "L'approbation humaine des actions de l'agent relève de la supervision humaine, donc de la responsabilité."
    c:
      en: "Removing personal data from stored transcripts protects customers' data: privacy and security."
      fr: "Retirer les données personnelles des transcriptions stockées protège les données des clients : confidentialité et sécurité."
    d:
      en: "A speech interface makes the agent usable by more people: inclusiveness."
      fr: "Une interface vocale rend l'agent utilisable par davantage de personnes : inclusion."
references:
  - title: "Responsible AI for agent design"
    url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
