id: ai901-1c-sp-webinar-captions
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso hosts live webinars. The text of what the presenter says must appear on the screen of the attendees while the presenter is speaking.

    Which capability of Azure Speech should Contoso use?
  fr: |
    Contoso organise des webinaires en direct. Le texte de ce que dit le présentateur doit s'afficher sur l'écran des participants pendant que le présentateur parle.

    Quelle fonctionnalité d'Azure Speech Contoso doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Text to speech with a neural voice", fr: "La synthèse vocale avec une voix neuronale" } }
    - { id: b, text: { en: "Batch transcription", fr: "La transcription par lots" } }
    - { id: c, text: { en: "Real-time transcription", fr: "La transcription en temps réel" } }
    - { id: d, text: { en: "Text to speech with a custom voice", fr: "La synthèse vocale avec une voix personnalisée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Real-time transcription is a speech recognition feature: the application streams audio to the service while a person is speaking and receives the transcribed text immediately. This is what live captions need.
    fr: |
      La transcription en temps réel est une fonctionnalité de reconnaissance vocale : l'application envoie l'audio en flux au service pendant qu'une personne parle et reçoit aussitôt le texte transcrit. C'est ce que demandent des sous-titres en direct.
  options:
    a: { en: "Text to speech produces audio from text; captions need text produced from audio.", fr: "La synthèse vocale produit de l'audio à partir de texte ; des sous-titres demandent du texte produit à partir d'audio." }
    b: { en: "Batch transcription processes stored recordings asynchronously; its results do not arrive while the presenter is speaking.", fr: "La transcription par lots traite des enregistrements stockés de façon asynchrone ; ses résultats n'arrivent pas pendant que le présentateur parle." }
    d: { en: "A custom voice is a synthesis feature; it creates speech and transcribes nothing.", fr: "Une voix personnalisée est une fonctionnalité de synthèse ; elle crée de la parole et ne transcrit rien." }
references:
  - title: Speech recognition
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
