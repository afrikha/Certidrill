id: ai901-1d-text-heavy-image-document
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Employees of Wingtip Toys photograph their paper receipts with a phone. The photos show almost nothing but printed text. Wingtip Toys needs the merchant name, the date and the total of each receipt as structured data.

    Which technique of Azure Content Understanding in Foundry Tools should Wingtip Toys use?
  fr: |
    Les employés de Wingtip Toys photographient leurs reçus papier avec un téléphone. Les photos ne montrent presque que du texte imprimé. Wingtip Toys a besoin du nom du commerçant, de la date et du total de chaque reçu sous forme de données structurées.

    Quelle technique d'Azure Content Understanding dans Foundry Tools faut-il utiliser ?
body:
  options:
  - id: a
    text:
      en: "Image field extraction: an image analyzer fills in the three fields from the picture"
      fr: "L'extraction de champs d'image : un analyseur d'images remplit les trois champs d'après l'image"
  - id: b
    text:
      en: "Image description: an image analyzer generates a description of each photo"
      fr: "La description d'image : un analyseur d'images génère une description de chaque photo"
  - id: c
    text:
      en: "Document field extraction: a document analyzer extracts the three fields from the text"
      fr: "L'extraction de champs de document : un analyseur de documents extrait les trois champs du texte"
  - id: d
    text:
      en: "Text extraction only: OCR returns the words of each receipt"
      fr: "L'extraction du texte seule : l'OCR renvoie les mots de chaque reçu"
answer:
  optionId: c
explanation:
  correct:
    en: "Although the files are photos, their content is mainly text. Image analyzers are not optimized for scenarios in which the analysis depends mainly on extracted text; Microsoft Learn recommends a document field extraction schema in that case. A document analyzer reads the text and returns the merchant, the date and the total as named fields."
    fr: "Même si les fichiers sont des photos, leur contenu est surtout du texte. Les analyseurs d'images ne sont pas optimisés pour les scénarios où l'analyse dépend surtout du texte extrait ; Microsoft Learn recommande dans ce cas un schéma d'extraction de champs de document. Un analyseur de documents lit le texte et renvoie le commerçant, la date et le total sous forme de champs nommés."
  options:
    a:
      en: An image analyzer is meant for what a picture shows, such as objects or defects, not for content that is essentially text.
      fr: "Un analyseur d'images est destiné à ce que montre une image, comme des objets ou des défauts, pas à un contenu qui est essentiellement du texte."
    b:
      en: "A description helps to search a collection of images; it does not return the three values as fields."
      fr: "Une description aide à faire des recherches dans une collection d'images ; elle ne renvoie pas les trois valeurs sous forme de champs."
    d:
      en: Reading the text returns words and paragraphs, without identifying which of them are the merchant, the date and the total.
      fr: La lecture du texte renvoie des mots et des paragraphes, sans indiquer lesquels sont le commerçant, la date et le total.
