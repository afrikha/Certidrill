id: ai901-1d-analysis-plus-generation
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders is designing an app that has two features:

    - Explain in text what a customer's photo of a room shows.
    - Create an original picture of a redecorated room from the customer's written description.

    Which model deployments does the app require?
  fr: |
    Northwind Traders conçoit une application qui offre deux fonctions :

    - Expliquer en texte ce que montre la photo d'une pièce envoyée par un client.
    - Créer une image originale d'une pièce redécorée à partir de la description écrite du client.

    De quels déploiements de modèles l'application a-t-elle besoin ?
body:
  options:
  - id: a
    text:
      en: A vision-enabled multimodal model only
      fr: Un modèle multimodal compatible avec la vision uniquement
  - id: b
    text:
      en: An image-generation model only
      fr: "Un modèle de génération d'images uniquement"
  - id: c
    text:
      en: A vision-enabled multimodal model and a video-generation model
      fr: Un modèle multimodal compatible avec la vision et un modèle de génération de vidéos
  - id: d
    text:
      en: A vision-enabled multimodal model and an image-generation model
      fr: "Un modèle multimodal compatible avec la vision et un modèle de génération d'images"
answer:
  optionId: d
explanation:
  correct:
    en: "The two features go in opposite directions. Explaining a photo is image analysis: a vision-enabled multimodal model receives the image with an instruction and returns text. Creating a picture from a description is image generation, which requires an image-generation model such as one of the GPT-Image-1 family."
    fr: "Les deux fonctions vont dans des sens opposés. Expliquer une photo relève de l'analyse d'images : un modèle multimodal compatible avec la vision reçoit l'image avec une instruction et renvoie du texte. Créer une image à partir d'une description relève de la génération d'images, qui nécessite un modèle de génération d'images, par exemple de la famille GPT-Image-1."
  options:
    a:
      en: "A vision-enabled chat model interprets images and answers in text; it does not create the new picture."
      fr: "Un modèle de conversation compatible avec la vision interprète des images et répond en texte ; il ne crée pas la nouvelle image."
    b:
      en: "An image-generation model creates images; it is not the model that explains in text what a photo shows."
      fr: "Un modèle de génération d'images crée des images ; ce n'est pas le modèle qui explique en texte ce que montre une photo."
    c:
      en: A video-generation model returns video clips, whereas the second feature needs a still picture.
      fr: Un modèle de génération de vidéos renvoie des clips vidéo, alors que la seconde fonction demande une image fixe.
references:
- title: Multimodal models for image analysis
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models"
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
