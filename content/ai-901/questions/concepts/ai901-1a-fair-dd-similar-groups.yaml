id: ai901-1a-fair-dd-similar-groups
objective: "1.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The fairness principle states that AI systems should avoid affecting [[who]] in different ways. For example, a system that gives guidance on [[ex]] should make the same recommendations to people who have similar professional qualifications.
    fr: |
      Le principe d'impartialité indique que les systèmes d'IA doivent éviter d'affecter différemment [[who]]. Par exemple, un système qui oriente des décisions en matière [[ex]] doit faire les mêmes recommandations aux personnes dont les qualifications professionnelles sont similaires.
  slots:
    - id: who
      options:
        - { id: groups, text: { en: "similarly situated groups of people", fr: "des groupes de personnes dans des situations similaires" } }
        - { id: devices, text: { en: "users who have different devices", fr: "des utilisateurs équipés d'appareils différents" } }
        - { id: devs, text: { en: "the developers of the system", fr: "les développeurs du système" } }
    - id: ex
      options:
        - { id: medical, text: { en: "medical treatment", fr: "de traitement médical" } }
        - { id: loan, text: { en: "loan applications", fr: "de demandes de prêt" } }
        - { id: job, text: { en: "employment", fr: "d'emploi" } }
answer:
  values: { who: groups, ex: job }
explanation:
  correct:
    en: "Fairness means that AI systems treat everyone fairly and avoid affecting similarly situated groups of people in different ways. Microsoft's examples pair each kind of guidance with what makes people comparable: similar symptoms for medical treatment, similar financial circumstances for loan applications and similar professional qualifications for employment."
    fr: "L'impartialité signifie que les systèmes d'IA traitent tout le monde de manière équitable et évitent d'affecter différemment des groupes de personnes dans des situations similaires. Les exemples de Microsoft associent chaque type de décision à ce qui rend les personnes comparables : des symptômes similaires pour un traitement médical, une situation financière similaire pour une demande de prêt et des qualifications professionnelles similaires pour un emploi."
  options:
    medical: { en: "For medical treatment, people are comparable when they have similar symptoms.", fr: "Pour un traitement médical, les personnes sont comparables lorsqu'elles ont des symptômes similaires." }
    loan: { en: "For loan applications, people are comparable when they have similar financial circumstances.", fr: "Pour une demande de prêt, les personnes sont comparables lorsque leur situation financière est similaire." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
