id: ai901-1c-wl-receipts
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders processes expense claims. Employees upload scanned receipts, and the finance system must receive the description and the amount of each expense as data fields.

    Which AI workload does this scenario represent?
  fr: |
    Northwind Traders traite des notes de frais. Les employés chargent des reçus numérisés, et le système financier doit recevoir la description et le montant de chaque dépense sous forme de champs de données.

    Quelle charge de travail d'IA ce scénario représente-t-il ?
body:
  options:
    - { id: a, text: { en: "Generative AI", fr: "IA générative" } }
    - { id: b, text: { en: "Information extraction", fr: "Extraction d'informations" } }
    - { id: c, text: { en: "Speech", fr: "Reconnaissance et synthèse vocales" } }
    - { id: d, text: { en: "Agentic AI", fr: "IA agentique" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Information extraction turns unstructured content, such as scanned receipts, invoices and forms, into structured, machine-readable data. Getting the description and the amount of each expense as fields is exactly that.
    fr: |
      L'extraction d'informations transforme un contenu non structuré, comme des reçus numérisés, des factures et des formulaires, en données structurées lisibles par une machine. Obtenir la description et le montant de chaque dépense sous forme de champs correspond exactement à cela.
  options:
    a: { en: "Generative AI creates new content; here the values already exist on the receipts and must only be captured.", fr: "L'IA générative crée du contenu nouveau ; ici, les valeurs existent déjà sur les reçus et doivent seulement être relevées." }
    c: { en: "Speech workloads handle spoken audio; a scanned receipt contains no audio.", fr: "Les charges de travail vocales traitent de l'audio parlé ; un reçu numérisé ne contient aucun audio." }
    d: { en: "Agentic AI is about using tools to carry out tasks; the requirement is only to capture data from documents.", fr: "L'IA agentique consiste à utiliser des outils pour accomplir des tâches ; le besoin est seulement de relever des données dans des documents." }
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/1-introduction
