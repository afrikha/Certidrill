id: ai901-1b-account-release-committee
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At Northwind Traders, a committee oversees the AI projects. It reviews each AI system against company policy, gives guidance on sensitive cases and can block the release of a system.

    Which responsible AI principle does the committee apply?
  fr: |
    Chez Northwind Traders, un comité supervise les projets d'IA. Il examine chaque système d'IA au regard de la politique de l'entreprise, donne des conseils sur les cas sensibles et peut bloquer la mise en service d'un système.

    Quel principe de l'IA responsable ce comité applique-t-il ?
body:
  options:
    - { id: a, text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" } }
    - { id: b, text: { en: "Transparency", fr: "Transparence" } }
    - { id: c, text: { en: "Inclusiveness", fr: "Inclusion" } }
    - { id: d, text: { en: "Accountability", fr: "Responsabilité" } }
answer: { optionId: d }
explanation:
  correct:
    en: "An internal review board that oversees how AI systems are developed and released is a governance measure. Governance and human oversight are how an organization stays accountable for the AI systems that it deploys."
    fr: "Un conseil d'examen interne qui supervise le développement et la mise en service des systèmes d'IA est une mesure de gouvernance. La gouvernance et la supervision humaine sont les moyens par lesquels une organisation reste responsable des systèmes d'IA qu'elle déploie."
  options:
    a:
      en: "Reliability and safety is about how the system itself behaves, which is established by testing and monitoring it; the committee is an oversight body."
      fr: "La fiabilité et la sécurité portent sur le comportement du système lui-même, établi par les tests et la surveillance ; le comité est un organe de supervision."
    b:
      en: "Transparency would be about explaining the system to its users and stakeholders."
      fr: "La transparence consisterait à expliquer le système à ses utilisateurs et aux parties prenantes."
    c:
      en: "Inclusiveness would be about making sure that the system can be used by everyone."
      fr: "L'inclusion consisterait à s'assurer que le système est utilisable par tous."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
