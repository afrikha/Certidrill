id: ai901-1a-rel-drone-conditions
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum develops an AI system that guides drones that inspect power lines. Before release, the team verifies that the system performs as it was designed and reacts safely when it meets weather conditions that weren't planned for.

    Which responsible AI principle does this work support?
  fr: |
    Adatum développe un système d'IA qui guide des drones d'inspection de lignes électriques. Avant la mise en service, l'équipe vérifie que le système fonctionne comme il a été conçu et réagit sans danger lorsqu'il rencontre des conditions météorologiques qui n'avaient pas été prévues.

    Quel principe de l'IA responsable ce travail sert-il ?
body:
  options:
    - id: acc
      text: { en: "Accountability", fr: "Responsabilité" }
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
    - id: rel
      text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" }
    - id: priv
      text: { en: "Privacy and security", fr: "Confidentialité et sécurité" }
answer: { optionId: rel }
explanation:
  correct:
    en: "Reliability and safety means that an AI system operates as it was originally designed, responds safely to unanticipated conditions and resists harmful manipulation. Verifying the behavior of the drones in unplanned weather is exactly that."
    fr: "La fiabilité et la sécurité signifient qu'un système d'IA fonctionne comme il a été conçu à l'origine, réagit sans danger aux conditions imprévues et résiste aux manipulations nuisibles. Vérifier le comportement des drones par un temps non prévu correspond exactement à cela."
  options:
    acc: { en: "Accountability is about the people who answer for the system and oversee it, not about how the system behaves in unexpected conditions.", fr: "La responsabilité concerne les personnes qui répondent du système et le supervisent, pas le comportement du système dans des conditions inattendues." }
    fair: { en: "Fairness is about treating similarly situated people in the same way; no group of people is compared here.", fr: "L'impartialité consiste à traiter de la même manière des personnes dans des situations similaires ; aucun groupe de personnes n'est comparé ici." }
    priv: { en: "Privacy and security is about protecting data and systems against unauthorized access, not about safe behavior in unplanned conditions.", fr: "La confidentialité et la sécurité consistent à protéger les données et les systèmes contre les accès non autorisés, pas à garantir un comportement sûr dans des conditions non prévues." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Artificial Intelligence overview"
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence
