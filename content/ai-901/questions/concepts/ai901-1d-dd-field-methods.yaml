id: ai901-1d-dd-field-methods
objective: "1.3.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    In Azure Content Understanding in Foundry Tools, the value of each field of a schema is produced by one of three methods: `extract`, `classify` or `generate`.

    Which method fits each field? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans Azure Content Understanding dans Foundry Tools, la valeur de chaque champ d'un schéma est produite par l'une des trois méthodes suivantes : `extract`, `classify` ou `generate`.

    Quelle méthode convient à chaque champ ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A summary of a recorded conversation: [[f1]]

      The date of a receipt, as it is printed on the receipt: [[f2]]

      A description of each scene of a video: [[f3]]

      The type of a chart, chosen from a list of predefined categories: [[f4]]
    fr: |
      Un résumé d'une conversation enregistrée : [[f1]]

      La date d'un reçu, telle qu'elle est imprimée sur le reçu : [[f2]]

      Une description de chaque scène d'une vidéo : [[f3]]

      Le type d'un graphique, choisi dans une liste de catégories prédéfinies : [[f4]]
  slots:
  - id: f1
    options:
    - id: extract
      text: extract
    - id: classify
      text: classify
    - id: generate
      text: generate
  - id: f2
    options:
    - id: extract
      text: extract
    - id: classify
      text: classify
    - id: generate
      text: generate
  - id: f3
    options:
    - id: extract
      text: extract
    - id: classify
      text: classify
    - id: generate
      text: generate
  - id: f4
    options:
    - id: extract
      text: extract
    - id: classify
      text: classify
    - id: generate
      text: generate
answer:
  values:
    f1: generate
    f2: extract
    f3: generate
    f4: classify
explanation:
  correct:
    en: "`extract` pulls a value as it appears in the content, such as a date on a receipt; it applies to documents. `classify` assigns the content to one of a predefined set of categories, such as a chart type or a call sentiment. `generate` creates a value freely from the input, such as a summary of an audio conversation or a description of a video scene."
    fr: "`extract` reprend une valeur telle qu'elle apparaît dans le contenu, comme une date sur un reçu ; cette méthode s'applique aux documents. `classify` affecte le contenu à l'une des catégories d'un ensemble prédéfini, comme un type de graphique ou le sentiment d'un appel. `generate` crée librement une valeur à partir de l'entrée, comme le résumé d'une conversation audio ou la description d'une scène vidéo."
references:
- title: "What is Azure Content Understanding in Foundry Tools?"
  url: "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"
