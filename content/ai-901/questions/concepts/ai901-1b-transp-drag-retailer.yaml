id: ai901-1b-transp-drag-retailer
objective: "1.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    An online retailer named Wingtip Toys uses an AI system to recommend products.

    Match each measure to the responsible AI principle that it applies.

    To answer, drag the appropriate principle to each measure. Each principle may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un détaillant en ligne nommé Wingtip Toys utilise un système d'IA pour recommander des produits.

    Associez chaque mesure au principe de l'IA responsable qu'elle applique.

    Pour répondre, faites glisser le principe approprié vers chaque mesure. Chaque principe peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fa, text: { en: "Fairness", fr: "Impartialité" } }
    - { id: ac, text: { en: "Accountability", fr: "Responsabilité" } }
    - { id: ps, text: { en: "Privacy and security", fr: "Confidentialité et sécurité" } }
    - { id: tr, text: { en: "Transparency", fr: "Transparence" } }
    - { id: in, text: { en: "Inclusiveness", fr: "Inclusion" } }
  targets:
    - id: t1
      text: { en: "The website states that the recommendations are produced by an AI system and explains how the system selects the products.", fr: "Le site web indique que les recommandations sont produites par un système d'IA et explique comment le système sélectionne les produits." }
    - id: t2
      text: { en: "A designated team answers for the recommendations and corrects the system when a problem is reported.", fr: "Une équipe désignée répond des recommandations et corrige le système quand un problème est signalé." }
    - id: t3
      text: { en: "The recommendation pages are tested with customers who browse by using a screen reader.", fr: "Les pages de recommandations sont testées avec des clients qui naviguent à l'aide d'un lecteur d'écran." }
answer:
  mapping: { t1: tr, t2: ac, t3: in }
explanation:
  correct:
    en: "Disclosing the use of AI and explaining how the system works is transparency. A team that answers for the system and corrects it is accountability. Testing with customers who use assistive technologies makes sure that nobody is excluded, which is inclusiveness."
    fr: "Signaler l'utilisation de l'IA et expliquer le fonctionnement du système relève de la transparence. Une équipe qui répond du système et le corrige relève de la responsabilité. Tester avec des clients qui utilisent des technologies d'assistance garantit que personne n'est exclu : c'est l'inclusion."
  options:
    fa:
      en: "Fairness would be checked by comparing the recommendations made to similar customers from different groups."
      fr: "L'impartialité se vérifierait en comparant les recommandations faites à des clients similaires de groupes différents."
    ps:
      en: "Privacy and security would concern the protection of customers' personal data."
      fr: "La confidentialité et la sécurité concerneraient la protection des données personnelles des clients."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
