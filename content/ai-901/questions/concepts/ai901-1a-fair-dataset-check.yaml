id: ai901-1a-fair-dataset-check
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to use five years of past hiring decisions as the data of an AI system that screens job applications.

    You need to identify a fairness risk before the data is used.

    What should you evaluate?
  fr: |
    Litware prévoit d'utiliser cinq ans de décisions de recrutement passées comme données d'un système d'IA qui présélectionne les candidatures.

    Vous devez identifier un risque lié à l'impartialité avant que les données soient utilisées.

    Que devez-vous évaluer ?
body:
  options:
    - id: a
      text: { en: "Whether the data is encrypted in transit and at rest", fr: "Le chiffrement des données en transit et au repos" }
    - id: b
      text: { en: "Whether the screening interface follows accessibility standards", fr: "La conformité de l'interface de présélection aux normes d'accessibilité" }
    - id: c
      text: { en: "Whether applicants are told that an AI system screens their applications", fr: "L'information des candidats sur la présélection de leur candidature par un système d'IA" }
    - id: d
      text: { en: "Where the data came from and whether each group of applicants is properly represented", fr: "La provenance des données et la représentation correcte de chaque groupe de candidats" }
answer: { optionId: d }
explanation:
  correct:
    en: "Bias in a dataset is identified by evaluating where the data came from, how it was organized and whether it is represented properly. Past hiring decisions can carry the preferences of earlier recruiters and under-represent some groups, and the system would reproduce them."
    fr: "On identifie un biais dans un jeu de données en évaluant la provenance des données, leur organisation et leur représentativité. Des décisions de recrutement passées peuvent porter les préférences d'anciens recruteurs et sous-représenter certains groupes, et le système les reproduirait."
  options:
    a: { en: "Encryption protects the data against unauthorized access, which is a privacy and security measure; it reveals nothing about bias.", fr: "Le chiffrement protège les données contre les accès non autorisés : c'est une mesure de confidentialité et de sécurité, qui ne révèle rien sur les biais." }
    b: { en: "Accessibility standards concern who can use the interface, which is inclusiveness.", fr: "Les normes d'accessibilité concernent les personnes qui peuvent utiliser l'interface : cela relève de l'inclusion." }
    c: { en: "Telling applicants that AI is used is a transparency measure; it doesn't show whether the data is biased.", fr: "Dire aux candidats qu'une IA est utilisée est une mesure de transparence ; cela n'indique pas si les données sont biaisées." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
