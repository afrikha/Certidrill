id: ai901-1a-rel-human-input
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware designs an AI system that prioritizes incoming emergency calls.

    Which design decision is a reliability and safety consideration?
  fr: |
    Proseware conçoit un système d'IA qui hiérarchise les appels d'urgence entrants.

    Quelle décision de conception est une considération de fiabilité et de sécurité ?
body:
  options:
    - id: a
      text: { en: "Define when the system must seek the input of a human operator in a critical situation.", fr: "Définir quand le système doit solliciter l'intervention d'un opérateur humain dans une situation critique." }
    - id: b
      text: { en: "Define how callers choose the way in which their recordings are used.", fr: "Définir comment les appelants choisissent la manière dont leurs enregistrements sont utilisés." }
    - id: c
      text: { en: "Define a text alternative for callers who are unable to use voice.", fr: "Définir une alternative textuelle pour les appelants qui ne peuvent pas utiliser la voix." }
    - id: d
      text: { en: "Define how the priorities of similar incidents are compared between neighborhoods.", fr: "Définir comment les priorités d'incidents similaires sont comparées entre les quartiers." }
answer: { optionId: a }
explanation:
  correct:
    en: "Under reliability and safety, a team evaluates when and how an AI system should seek human input for impactful decisions or critical situations, and how control is transferred to a person in a meaningful and intelligible way."
    fr: "Au titre de la fiabilité et de la sécurité, une équipe évalue quand et comment un système d'IA doit solliciter une intervention humaine pour les décisions à fort impact ou les situations critiques, et comment le contrôle est transmis à une personne de manière claire et intelligible."
  options:
    b: { en: "A choice about how recordings are used is a privacy and security consideration.", fr: "Un choix sur l'utilisation des enregistrements est une considération de confidentialité et de sécurité." }
    c: { en: "An alternative for people who are unable to use voice is an inclusiveness consideration.", fr: "Une alternative pour les personnes qui ne peuvent pas utiliser la voix est une considération d'inclusion." }
    d: { en: "Comparing the treatment of similar cases between groups is a fairness consideration.", fr: "Comparer le traitement de cas similaires entre des groupes est une considération d'impartialité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
