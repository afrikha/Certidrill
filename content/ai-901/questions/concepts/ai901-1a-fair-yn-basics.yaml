id: ai901-1a-fair-yn-basics
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "An AI system that recommends the same medical treatment to patients who have similar symptoms supports the fairness principle.", fr: "Un système d'IA qui recommande le même traitement médical à des patients présentant des symptômes similaires respecte le principe d'impartialité." }
    - id: s2
      text: { en: "Providing real-time captions for users who are deaf is primarily an example of the fairness principle.", fr: "Fournir des sous-titres en temps réel aux utilisateurs sourds est avant tout un exemple du principe d'impartialité." }
    - id: s3
      text: { en: "Asking who an AI system is designed for, and whether it will work for everyone equally, helps a team understand fairness risks.", fr: "Se demander pour qui un système d'IA est conçu, et s'il fonctionnera de la même façon pour tout le monde, aide une équipe à comprendre les risques liés à l'impartialité." }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Fairness means the same recommendations for people in similar situations, for example patients with similar symptoms. Captions remove a barrier for people who have a hearing disability, which is inclusiveness. To address fairness, a team first understands the scope and the potential uses of the system: who it is designed for, whether it works for everyone equally and how it could harm others."
    fr: "L'impartialité signifie les mêmes recommandations pour des personnes dans des situations similaires, par exemple des patients aux symptômes similaires. Les sous-titres suppriment un obstacle pour les personnes ayant un handicap auditif : cela relève de l'inclusion. Pour traiter l'impartialité, une équipe commence par comprendre la portée et les usages possibles du système : pour qui il est conçu, s'il fonctionne de la même façon pour tous et comment il pourrait nuire à d'autres personnes."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
