id: ai901-1a-incl-match-principles
objective: "1.1.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Match each scenario to the responsible AI principle that it relates to. To answer, drag the appropriate principle to each scenario. Each principle may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque scénario au principe de l'IA responsable auquel il se rapporte. Pour répondre, faites glisser le principe approprié vers chaque scénario. Chaque principe peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
    - id: incl
      text: { en: "Inclusiveness", fr: "Inclusion" }
    - id: transp
      text: { en: "Transparency", fr: "Transparence" }
    - id: acc
      text: { en: "Accountability", fr: "Responsabilité" }
    - id: rel
      text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" }
  targets:
    - id: t1
      text: { en: "A form can be completed by voice by users who are unable to use a keyboard.", fr: "Un formulaire peut être rempli à la voix par les utilisateurs qui ne peuvent pas se servir d'un clavier." }
    - id: t2
      text: { en: "Two candidates who have the same qualifications receive the same ranking, whatever their age.", fr: "Deux candidats ayant les mêmes qualifications reçoivent le même classement, quel que soit leur âge." }
    - id: t3
      text: { en: "A solution is checked against accessibility standards before it is purchased.", fr: "Une solution est contrôlée par rapport aux normes d'accessibilité avant son achat." }
    - id: t4
      text: { en: "Users are told that a decision was made by AI and which factors influenced it.", fr: "Les utilisateurs sont informés qu'une décision a été prise par l'IA et des facteurs qui l'ont influencée." }
answer:
  mapping: { t1: incl, t2: fair, t3: incl, t4: transp }
explanation:
  correct:
    en: "Voice input for people who are unable to use a keyboard and conformance to accessibility standards both make sure that nobody is left out, which is inclusiveness. The same ranking for candidates who have the same qualifications is fairness. Telling users that AI made a decision, and why, is transparency."
    fr: "La saisie vocale pour les personnes qui ne peuvent pas se servir d'un clavier et la conformité aux normes d'accessibilité font toutes deux en sorte que personne ne soit laissé de côté : c'est l'inclusion. Le même classement pour des candidats ayant les mêmes qualifications relève de l'impartialité. Dire aux utilisateurs qu'une IA a pris une décision, et pourquoi, relève de la transparence."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
