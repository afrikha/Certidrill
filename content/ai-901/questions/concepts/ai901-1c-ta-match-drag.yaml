id: ai901-1c-ta-match-drag
objective: "1.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum wants to apply text analysis to several kinds of documents.

    Which technique should Adatum use for each requirement? To answer, drag the appropriate techniques to the correct requirements. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum veut appliquer l'analyse de texte à plusieurs types de documents.

    Quelle technique Adatum doit-elle utiliser pour chaque besoin ? Pour répondre, faites glisser les techniques appropriées vers les besoins correspondants. Chaque technique peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: kpe, text: { en: "Key phrase extraction", fr: "Extraction d'expressions clés" } }
    - { id: ent, text: { en: "Entity detection", fr: "Détection d'entités" } }
    - { id: sent, text: { en: "Sentiment analysis", fr: "Analyse des sentiments" } }
    - { id: sum, text: { en: "Summarization", fr: "Résumé de texte" } }
    - { id: lang, text: { en: "Language detection", fr: "Détection de langue" } }
  targets:
    - id: t1
      text: { en: "List the companies and the cities named in press releases", fr: "Lister les entreprises et les villes citées dans des communiqués de presse" }
    - id: t2
      text: { en: "Give executives a three-sentence version of each 20-page report", fr: "Fournir aux dirigeants une version en trois phrases de chaque rapport de 20 pages" }
    - id: t3
      text: { en: "Alert a manager when the email of a customer expresses frustration", fr: "Alerter un responsable lorsque l'e-mail d'un client exprime de la frustration" }
    - id: t4
      text: { en: "Tag each blog article with the main topics that it covers", fr: "Étiqueter chaque article de blog avec les principaux sujets qu'il traite" }
answer:
  mapping: { t1: ent, t2: sum, t3: sent, t4: kpe }
explanation:
  correct:
    en: |
      Companies and cities are entities of the organization and location categories: entity detection. A three-sentence version of a long report is a summary. Frustration is a negative opinion, found by sentiment analysis. The main topics of an article are its key phrases. Language detection, which returns the language of a text, is not needed.
    fr: |
      Les entreprises et les villes sont des entités des catégories organisation et lieu : détection d'entités. Une version en trois phrases d'un long rapport est un résumé. La frustration est une opinion négative, repérée par l'analyse des sentiments. Les principaux sujets d'un article sont ses expressions clés. La détection de langue, qui renvoie la langue d'un texte, n'est pas nécessaire.
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
