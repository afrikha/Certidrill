id: ai901-1a-incl-dd-captions
objective: "1.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      An AI feature that generates real-time captions mainly helps people who have a [[dis]] disability. Providing this feature is an example of the [[p]] principle.
    fr: |
      Une fonctionnalité d'IA qui génère des sous-titres en temps réel aide principalement les personnes qui ont un handicap [[dis]]. Proposer cette fonctionnalité est un exemple du principe [[p]].
  slots:
    - id: dis
      options:
        - { id: vision, text: { en: "vision", fr: "visuel" } }
        - { id: hearing, text: { en: "hearing", fr: "auditif" } }
        - { id: mobility, text: { en: "mobility", fr: "moteur" } }
    - id: p
      options:
        - { id: fair, text: { en: "fairness", fr: "d'impartialité" } }
        - { id: acc, text: { en: "accountability", fr: "de responsabilité" } }
        - { id: incl, text: { en: "inclusiveness", fr: "d'inclusion" } }
answer:
  values: { dis: hearing, p: incl }
explanation:
  correct:
    en: "Real-time captions turn speech into text on the screen, so people who are deaf or hard of hearing can follow spoken content. With image recognition and predictive text, they are among the examples that Microsoft gives of AI serving inclusiveness."
    fr: "Les sous-titres en temps réel transforment la parole en texte à l'écran : les personnes sourdes ou malentendantes peuvent ainsi suivre un contenu parlé. Avec la reconnaissance d'images et le texte prédictif, ils font partie des exemples que Microsoft donne d'une IA au service de l'inclusion."
  options:
    vision: { en: "Captions are read on a screen; people who have a vision disability are helped by spoken descriptions.", fr: "Les sous-titres se lisent à l'écran ; les personnes ayant un handicap visuel sont aidées par des descriptions parlées." }
    fair: { en: "Fairness is about comparable results for comparable people.", fr: "L'impartialité porte sur des résultats comparables pour des personnes comparables." }
    acc: { en: "Accountability is about the people who answer for the system.", fr: "La responsabilité concerne les personnes qui répondent du système." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
