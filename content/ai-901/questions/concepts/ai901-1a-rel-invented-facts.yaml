id: ai901-1a-rel-invented-facts
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A pharmacy deploys a generative AI assistant. Tests show that the assistant sometimes describes drug interactions that don't exist.

    Which responsible AI principle is most directly at stake?
  fr: |
    Une pharmacie déploie un assistant d'IA générative. Des tests montrent que l'assistant décrit parfois des interactions médicamenteuses qui n'existent pas.

    Quel principe de l'IA responsable est le plus directement en jeu ?
body:
  options:
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
    - id: incl
      text: { en: "Inclusiveness", fr: "Inclusion" }
    - id: priv
      text: { en: "Privacy and security", fr: "Confidentialité et sécurité" }
    - id: rel
      text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" }
answer: { optionId: rel }
explanation:
  correct:
    en: "An assistant that invents facts doesn't perform as it was designed, and wrong medical information can harm people. Operating reliably and safely is the reliability and safety principle."
    fr: "Un assistant qui invente des faits ne fonctionne pas comme il a été conçu, et une information médicale fausse peut nuire à des personnes. Fonctionner de manière fiable et sûre correspond au principe de fiabilité et de sécurité."
  options:
    fair: { en: "Fairness would be at stake if comparable groups of people received different results.", fr: "L'impartialité serait en jeu si des groupes de personnes comparables recevaient des résultats différents." }
    incl: { en: "Inclusiveness would be at stake if some people were unable to use the assistant.", fr: "L'inclusion serait en jeu si certaines personnes ne pouvaient pas utiliser l'assistant." }
    priv: { en: "Privacy and security would be at stake if personal data or access to the system were poorly protected.", fr: "La confidentialité et la sécurité seraient en jeu si des données personnelles ou l'accès au système étaient mal protégés." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Artificial Intelligence overview"
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence
