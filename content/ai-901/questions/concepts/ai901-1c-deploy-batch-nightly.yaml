id: ai901-1c-deploy-batch-nightly
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every night, Litware must summarize about 200,000 archived documents by using a model deployed in Microsoft Foundry. The summaries are needed only the next day. Litware has no data residency requirement and wants to minimize the cost.

    Which deployment type should Litware use?
  fr: |
    Chaque nuit, Litware doit résumer environ 200 000 documents archivés à l'aide d'un modèle déployé dans Microsoft Foundry. Les résumés ne sont nécessaires que le lendemain. Litware n'a aucune exigence de résidence des données et veut réduire le coût au minimum.

    Quel type de déploiement Litware doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Global Standard" }
    - { id: b, text: "Global Provisioned" }
    - { id: c, text: "Standard" }
    - { id: d, text: "Global Batch" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Global Batch deployment processes large groups of requests asynchronously, with a 24-hour target turnaround, at about half the price of Global Standard. It fits a large job whose results are not needed immediately.
    fr: |
      Un déploiement Global Batch traite de grands groupes de requêtes de façon asynchrone, avec un délai cible de 24 heures, pour environ la moitié du prix de Global Standard. Il convient à un gros traitement dont les résultats ne sont pas nécessaires immédiatement.
  options:
    a: { en: "Global Standard answers in real time at the full pay-per-token price, which is not the cheapest option for a job that can wait.", fr: "Global Standard répond en temps réel au plein tarif du paiement au jeton, ce qui n'est pas le moins cher pour un traitement qui peut attendre." }
    b: { en: "Global Provisioned reserves capacity for consistent latency; paying for reserved throughput is not needed for a job that can wait.", fr: "Global Provisioned réserve de la capacité pour une latence régulière ; payer un débit réservé est inutile pour un traitement qui peut attendre." }
    c: { en: "Standard answers in real time at the pay-per-token price and is meant for low to medium volume.", fr: "Standard répond en temps réel au tarif du paiement au jeton et vise un volume faible à moyen." }
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
