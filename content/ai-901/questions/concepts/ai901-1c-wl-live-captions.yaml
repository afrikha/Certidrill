id: ai901-1c-wl-live-captions
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A video platform of Adventure Works wants to generate captions automatically for its live streams, so that viewers can read what the presenters say.

    Which AI workload does this scenario represent?
  fr: |
    Une plateforme vidéo d'Adventure Works veut générer automatiquement des sous-titres pour ses diffusions en direct, afin que les spectateurs puissent lire ce que disent les présentateurs.

    Quelle charge de travail d'IA ce scénario représente-t-il ?
body:
  options:
    - { id: a, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
    - { id: b, text: { en: "Generative AI", fr: "IA générative" } }
    - { id: c, text: { en: "Speech", fr: "Reconnaissance et synthèse vocales" } }
    - { id: d, text: { en: "Text analysis", fr: "Analyse de texte" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Captions are the written form of what is said. Producing them requires speech recognition, which converts spoken audio into text, so automated captioning is a speech workload even though the content is a video.
    fr: |
      Les sous-titres sont la forme écrite de ce qui est dit. Les produire demande la reconnaissance vocale, qui convertit l'audio parlé en texte : le sous-titrage automatique est donc une charge de travail vocale, même si le contenu est une vidéo.
  options:
    a: { en: "Computer vision interprets what is seen in the images; captions come from what is heard in the audio track.", fr: "La vision par ordinateur interprète ce qui est vu dans les images ; les sous-titres viennent de ce qui est entendu dans la piste audio." }
    b: { en: "The captions must reproduce the presenters' words, not create new content from a prompt.", fr: "Les sous-titres doivent reproduire les paroles des présentateurs, pas créer du contenu nouveau à partir d'une invite." }
    d: { en: "Text analysis works on text that already exists; here the text must first be obtained from speech.", fr: "L'analyse de texte porte sur un texte qui existe déjà ; ici, le texte doit d'abord être obtenu à partir de la parole." }
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/1-introduction
