id: ai901-1b-account-yn-basics
objective: "1.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An organization should define a governance framework to help ensure that it applies responsible AI principles to its work."
        fr: "Une organisation doit définir un cadre de gouvernance pour s'assurer qu'elle applique les principes de l'IA responsable à son travail."
    - id: s2
      text:
        en: "The people who design and deploy an AI system remain accountable for how the system operates."
        fr: "Les personnes qui conçoivent et déploient un système d'IA restent responsables de son fonctionnement."
    - id: s3
      text:
        en: "Using a model from a third-party provider transfers all accountability for an AI solution to that provider."
        fr: "Utiliser un modèle d'un fournisseur tiers transfère à ce fournisseur toute la responsabilité d'une solution d'IA."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "The people and organizations that develop and distribute AI solutions are accountable for them, and they should define and apply a governance framework to make sure the principles are applied. Building on someone else's model doesn't remove that accountability: the organization that designs and deploys the solution still answers for it."
    fr: "Les personnes et les organisations qui développent et distribuent des solutions d'IA en sont responsables, et elles doivent définir et appliquer un cadre de gouvernance pour s'assurer que les principes sont appliqués. S'appuyer sur le modèle d'un tiers ne supprime pas cette responsabilité : l'organisation qui conçoit et déploie la solution en répond toujours."
references:
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
