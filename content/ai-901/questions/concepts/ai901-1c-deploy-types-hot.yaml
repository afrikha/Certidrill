id: ai901-1c-deploy-types-hot
objective: "1.2.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Foundry project that contains the model deployments shown in the following table.

    Answer each prompt by selecting the appropriate deployment.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un projet Foundry qui contient les déploiements de modèles figurant dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le déploiement approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The deployment that is billed for reserved capacity instead of for each token", fr: "Le déploiement facturé pour une capacité réservée plutôt que pour chaque jeton" }
    - id: p2
      text: { en: "The deployment that answers in real time and may process a request in any Azure region", fr: "Le déploiement qui répond en temps réel et peut traiter une requête dans n'importe quelle région Azure" }
  grid:
    header: [{ en: "Deployment name", fr: "Nom du déploiement" }, { en: "Deployment type", fr: "Type de déploiement" }, { en: "Used by", fr: "Utilisé par" }]
    rows:
      - [{ text: web-chat, area: d1 }, { text: "Global Standard" }, { text: { en: "Public website assistant", fr: "Assistant du site web public" } }]
      - [{ text: hr-chat, area: d2 }, { text: "Data Zone Standard" }, { text: { en: "Internal HR assistant", fr: "Assistant RH interne" } }]
      - [{ text: night-docs, area: d3 }, { text: "Global Batch" }, { text: { en: "Document classification job", fr: "Traitement de classement de documents" } }]
      - [{ text: desk-chat, area: d4 }, { text: "Data Zone Provisioned" }, { text: { en: "Contact center assistant", fr: "Assistant du centre de contact" } }]
answer:
  values: { p1: d4, p2: d1 }
explanation:
  correct:
    en: |
      Provisioned types, here Data Zone Provisioned, bill reserved provisioned throughput units (PTUs); the three other deployments are billed for the tokens they process. Global Standard answers in real time and may process a request in any Azure region. Global Batch may also use any region, but it processes jobs asynchronously with a 24-hour target, and the data zone types keep processing inside their data zone.
    fr: |
      Les types approvisionnés, ici Data Zone Provisioned, facturent des unités de débit approvisionné (PTU) réservées ; les trois autres déploiements sont facturés pour les jetons qu'ils traitent. Global Standard répond en temps réel et peut traiter une requête dans n'importe quelle région Azure. Global Batch peut aussi utiliser n'importe quelle région, mais il traite les travaux de façon asynchrone avec un délai cible de 24 heures, et les types de zone de données gardent le traitement dans leur zone de données.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
