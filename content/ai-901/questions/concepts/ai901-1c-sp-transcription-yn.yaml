id: ai901-1c-sp-transcription-yn
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to use the speech-to-text capabilities of Azure Speech in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser les fonctionnalités de reconnaissance vocale d'Azure Speech dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Real-time transcription can take its audio from a microphone or from an audio file.
        fr: La transcription en temps réel peut prendre son audio d'un microphone ou d'un fichier audio.
    - id: s2
      text:
        en: Batch transcription returns its results asynchronously.
        fr: La transcription par lots renvoie ses résultats de façon asynchrone.
    - id: s3
      text:
        en: Batch transcription is the appropriate choice to display captions during a live presentation.
        fr: La transcription par lots est le choix approprié pour afficher des sous-titres pendant une présentation en direct.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Real-time transcription listens to audio from a microphone or a file, streams it to the service and receives the text as it is recognized. Batch transcription handles recordings that are already stored: jobs are scheduled on a best-effort basis and the results are retrieved asynchronously, so it cannot feed live captions.
    fr: |
      La transcription en temps réel écoute l'audio d'un microphone ou d'un fichier, l'envoie en flux au service et reçoit le texte au fur et à mesure de la reconnaissance. La transcription par lots traite des enregistrements déjà stockés : les traitements sont planifiés au mieux et les résultats sont récupérés de façon asynchrone ; elle ne peut donc pas alimenter des sous-titres en direct.
references:
  - title: Speech recognition
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
