id: ai901-1d-imagegen-mini-volume
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is building an internal tool that generates thousands of simple illustrations each day. Lower cost and lower latency matter more than maximum visual fidelity.

    Which model should Woodgrove Bank deploy?
  fr: |
    Woodgrove Bank crée un outil interne qui génère chaque jour des milliers d'illustrations simples. Un coût réduit et une latence plus faible comptent davantage que la fidélité visuelle maximale.

    Quel modèle faut-il déployer ?
body:
  options:
  - id: a
    text: GPT-4.1-mini
  - id: b
    text: GPT-Image-1.5
  - id: c
    text: GPT-Image-1-Mini
  - id: d
    text: Sora 2
answer:
  optionId: c
explanation:
  correct:
    en: GPT-Image-1-Mini is the lighter, more cost-efficient model of the GPT-Image-1 family. It handles the same core tasks, but favors lower latency or reduced cost over maximum visual fidelity, which suits internal tools and high-volume generation.
    fr: GPT-Image-1-Mini est le modèle plus léger et plus économique de la famille GPT-Image-1. Il réalise les mêmes tâches de base, mais privilégie une latence plus faible ou un coût réduit plutôt que la fidélité visuelle maximale, ce qui convient aux outils internes et à la génération en grand volume.
  options:
    a:
      en: "GPT-4.1-mini is a multimodal model that understands text and images; it is not an image-generation model."
      fr: "GPT-4.1-mini est un modèle multimodal qui comprend le texte et les images ; ce n'est pas un modèle de génération d'images."
    b:
      en: GPT-Image-1.5 is the most advanced model of the family, intended for high-fidelity creation and editing, not for the lowest cost.
      fr: GPT-Image-1.5 est le modèle le plus avancé de la famille, destiné à la création et à la modification haute fidélité, pas au coût le plus bas.
    d:
      en: Sora 2 generates videos, not still images.
      fr: Sora 2 génère des vidéos, pas des images fixes.
references:
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
