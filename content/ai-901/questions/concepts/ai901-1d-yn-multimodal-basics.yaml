id: ai901-1d-yn-multimodal-basics
objective: "1.3.4"
type: "yesno_statements"
difficulty: 1
status: draft
stem:
  en: |
    You are learning about the vision capabilities of models in Microsoft Foundry.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous découvrez les fonctionnalités de vision des modèles dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A multimodal model can work with more than one type of data, such as text and images, at the same time.
      fr: Un modèle multimodal peut traiter plusieurs types de données en même temps, par exemple du texte et des images.
  - id: s2
    text:
      en: A vision-enabled chat model can answer a question about the objects that a photo shows.
      fr: Un modèle de conversation compatible avec la vision peut répondre à une question sur les objets que montre une photo.
  - id: s3
    text:
      en: An image-generation model receives an image and returns a written description of it.
      fr: "Un modèle de génération d'images reçoit une image et en renvoie une description écrite."
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: "A multimodal model understands several types of data together, such as text and images. Vision-enabled models use this to describe an image and to answer questions about its objects, text or scene. An image-generation model works the other way: it receives a description and returns a new image."
    fr: "Un modèle multimodal comprend plusieurs types de données à la fois, par exemple du texte et des images. Les modèles compatibles avec la vision s'en servent pour décrire une image et répondre à des questions sur ses objets, son texte ou sa scène. Un modèle de génération d'images fonctionne dans l'autre sens : il reçoit une description et renvoie une nouvelle image."
references:
- title: Multimodal models for image analysis
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models"
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
