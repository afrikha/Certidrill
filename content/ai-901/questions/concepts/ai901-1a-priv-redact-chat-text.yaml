id: ai901-1a-priv-redact-chat-text
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores the text of customer support chats for later analysis. Names, addresses and financial identifiers must be detected and redacted before the text is stored.

    Which capability should you use?
  fr: |
    Contoso stocke le texte des conversations de son support client pour l'analyser plus tard. Les noms, les adresses et les identifiants financiers doivent être détectés et masqués avant le stockage du texte.

    Quelle fonctionnalité devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "PII detection in Azure Language", fr: "La détection des PII d'Azure Language" }
    - id: b
      text: { en: "Named entity recognition in Azure Language", fr: "La reconnaissance d'entités nommées d'Azure Language" }
    - id: c
      text: { en: "Key phrase extraction in Azure Language", fr: "L'extraction d'expressions clés d'Azure Language" }
    - id: d
      text: { en: "Guardrails (content filters) in Microsoft Foundry", fr: "Les garde-fous (filtres de contenu) de Microsoft Foundry" }
answer: { optionId: a }
explanation:
  correct:
    en: "PII detection in Azure Language identifies, classifies and redacts sensitive data such as names, addresses, financial IDs and health identifiers. The result contains the detected entities with their categories and the redacted text, which can then be stored."
    fr: "La détection des PII d'Azure Language identifie, classe et masque les données sensibles comme les noms, les adresses, les identifiants financiers et les identifiants de santé. Le résultat contient les entités détectées avec leur catégorie et le texte masqué, qui peut ensuite être stocké."
  options:
    b: { en: "Named entity recognition identifies and categorizes entities in text, but it isn't designed to target sensitive data and return a redacted text.", fr: "La reconnaissance d'entités nommées identifie et classe des entités dans un texte, mais elle n'est pas conçue pour cibler les données sensibles et renvoyer un texte masqué." }
    c: { en: "Key phrase extraction returns the main talking points of a text; it doesn't find or redact personal data.", fr: "L'extraction d'expressions clés renvoie les principaux sujets d'un texte ; elle ne trouve ni ne masque les données personnelles." }
    d: { en: "Guardrails filter harmful content such as hate or violence in prompts and responses; they aren't a tool for redacting stored text.", fr: "Les garde-fous filtrent le contenu nuisible, comme la haine ou la violence, dans les invites et les réponses ; ce n'est pas un outil pour masquer un texte stocké." }
references:
  - title: "What is PII detection in Azure Language?"
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
  - title: "Text Personally Identifiable Information (PII) redaction overview"
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/text-pii-overview
