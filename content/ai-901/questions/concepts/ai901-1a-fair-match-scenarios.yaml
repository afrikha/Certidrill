id: ai901-1a-fair-match-scenarios
objective: "1.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Match each scenario to the responsible AI principle that it relates to. To answer, drag the appropriate principle to each scenario. Each principle may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque scénario au principe de l'IA responsable auquel il se rapporte. Pour répondre, faites glisser le principe approprié vers chaque scénario. Chaque principe peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: transp
      text: { en: "Transparency", fr: "Transparence" }
    - id: priv
      text: { en: "Privacy and security", fr: "Confidentialité et sécurité" }
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
    - id: acc
      text: { en: "Accountability", fr: "Responsabilité" }
    - id: incl
      text: { en: "Inclusiveness", fr: "Inclusion" }
  targets:
    - id: t1
      text: { en: "A model recommends different treatments for patients who have the same symptoms, depending on their ethnic origin.", fr: "Un modèle recommande des traitements différents à des patients présentant les mêmes symptômes, selon leur origine ethnique." }
    - id: t2
      text: { en: "A video course has no captions for learners who are deaf.", fr: "Un cours vidéo n'a pas de sous-titres pour les apprenants sourds." }
    - id: t3
      text: { en: "A bank gives each customer the reasons why its AI system rejected their loan application.", fr: "Une banque donne à chaque client les raisons pour lesquelles son système d'IA a refusé sa demande de prêt." }
answer:
  mapping: { t1: fair, t2: incl, t3: transp }
explanation:
  correct:
    en: "Different recommendations for patients with the same symptoms affect similarly situated people differently, which concerns fairness. Missing captions exclude people who have a hearing disability, which concerns inclusiveness. Explaining why an application was rejected lets people understand how the system reached its result, which is transparency."
    fr: "Des recommandations différentes pour des patients aux mêmes symptômes affectent différemment des personnes dans des situations similaires : cela concerne l'impartialité. L'absence de sous-titres exclut les personnes ayant un handicap auditif : cela concerne l'inclusion. Expliquer pourquoi une demande a été refusée permet de comprendre comment le système est parvenu à son résultat : c'est la transparence."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
