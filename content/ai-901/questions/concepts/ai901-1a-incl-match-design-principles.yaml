id: ai901-1a-incl-match-design-principles
objective: "1.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the Microsoft inclusive design principle that it describes. To answer, drag the appropriate principle to each description. Each principle may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au principe de conception inclusive de Microsoft qu'elle décrit. Pour répondre, faites glisser le principe approprié vers chaque description. Chaque principe peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: learn
      text: { en: "Learn from diversity", fr: "Apprendre de la diversité (Learn from diversity)" }
    - id: unint
      text: { en: "Design for unintended circumstances", fr: "Concevoir pour les circonstances inattendues (Design for unintended circumstances)" }
    - id: rec
      text: { en: "Recognize exclusion", fr: "Reconnaître l'exclusion (Recognize exclusion)" }
    - id: solve
      text: { en: "Solve for one, extend to many", fr: "Résoudre pour une personne, étendre à plusieurs (Solve for one, extend to many)" }
  targets:
    - id: t1
      text: { en: "Understand who might be left out and why.", fr: "Comprendre qui peut être laissé de côté et pourquoi." }
    - id: t2
      text: { en: "Design for a specific need to create a broader impact.", fr: "Concevoir pour un besoin spécifique afin de créer un impact plus large." }
    - id: t3
      text: { en: "Engage with different perspectives to build better solutions.", fr: "Échanger avec des points de vue différents pour créer de meilleures solutions." }
answer:
  mapping: { t1: rec, t2: solve, t3: learn }
explanation:
  correct:
    en: "Microsoft's three inclusive design principles are: recognize exclusion (understand who might be left out and why), solve for one, extend to many (design for a specific need to create a broader impact) and learn from diversity (engage with different perspectives). Designing for unintended circumstances is a practice of the reliability and safety principle."
    fr: "Les trois principes de conception inclusive de Microsoft sont : reconnaître l'exclusion (comprendre qui peut être laissé de côté et pourquoi), résoudre pour une personne et étendre à plusieurs (concevoir pour un besoin spécifique afin de créer un impact plus large) et apprendre de la diversité (échanger avec des points de vue différents). Concevoir pour les circonstances inattendues est une pratique du principe de fiabilité et de sécurité."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
