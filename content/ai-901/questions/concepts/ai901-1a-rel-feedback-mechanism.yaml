id: ai901-1a-rel-feedback-mechanism
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys releases an AI assistant that answers questions about its products. The team wants to learn quickly when the assistant gives wrong or unhelpful answers to real users, so that the problems can be resolved.

    What should the team add to the solution?
  fr: |
    Wingtip Toys met en service un assistant d'IA qui répond aux questions sur ses produits. L'équipe veut savoir rapidement quand l'assistant donne des réponses fausses ou inutiles à de vrais utilisateurs, afin de résoudre les problèmes.

    Que doit ajouter l'équipe à la solution ?
body:
  options:
    - id: a
      text: { en: "A form that lets users choose how their data is used", fr: "Un formulaire qui permet aux utilisateurs de choisir comment leurs données sont utilisées" }
    - id: b
      text: { en: "A feedback mechanism that lets users report performance issues", fr: "Un mécanisme de commentaires qui permet aux utilisateurs de signaler les problèmes de performances" }
    - id: c
      text: { en: "A notice that tells users that they interact with an AI system", fr: "Une mention qui indique aux utilisateurs qu'ils interagissent avec un système d'IA" }
    - id: d
      text: { en: "A setting that lets users switch from text input to voice input", fr: "Un paramètre qui permet aux utilisateurs de passer de la saisie de texte à la saisie vocale" }
answer: { optionId: b }
explanation:
  correct:
    en: "A robust feedback mechanism lets users report performance issues so that the team can resolve them quickly. It is one of the practices of the reliability and safety principle, together with the monitoring of ongoing performance."
    fr: "Un mécanisme de commentaires robuste permet aux utilisateurs de signaler les problèmes de performances afin que l'équipe les résolve rapidement. C'est l'une des pratiques du principe de fiabilité et de sécurité, avec la surveillance des performances dans la durée."
  options:
    a: { en: "A choice about data use is a privacy control; it doesn't reveal wrong answers.", fr: "Un choix sur l'utilisation des données est un contrôle de confidentialité ; il ne révèle pas les réponses fausses." }
    c: { en: "Disclosing the use of AI is a transparency measure; it doesn't tell the team when the assistant fails.", fr: "Signaler l'utilisation de l'IA est une mesure de transparence ; cela n'indique pas à l'équipe quand l'assistant échoue." }
    d: { en: "An alternative input method serves inclusiveness.", fr: "Un autre mode de saisie sert l'inclusion." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
