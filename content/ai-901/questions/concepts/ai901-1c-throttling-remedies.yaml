id: ai901-1c-throttling-remedies
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application sends requests to a model deployed in Microsoft Foundry. At peak hours, the deployment is throttled and the application receives rate-limit errors.

    Which two changes to the application can reduce the throttling? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application envoie des requêtes à un modèle déployé dans Microsoft Foundry. Aux heures de pointe, le déploiement subit une limitation et l'application reçoit des erreurs de limite de débit.

    Quelles sont les deux modifications de l'application qui peuvent réduire la limitation ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the temperature of each request.", fr: "Augmenter la température de chaque requête." } }
    - { id: b, text: { en: "Lower the max output tokens value of each request.", fr: "Diminuer le nombre maximal de jetons de sortie de chaque requête." } }
    - { id: c, text: { en: "Add more background text to each prompt.", fr: "Ajouter davantage de texte de contexte à chaque invite." } }
    - { id: d, text: { en: "Send fewer concurrent requests.", fr: "Envoyer moins de requêtes simultanées." } }
    - { id: e, text: { en: "Change the top P value of each request.", fr: "Modifier la valeur Top P de chaque requête." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Throttling happens when a deployment receives more tokens or requests than its limit allows. Larger prompts and a higher max output tokens setting consume more of the tokens per minute (TPM) limit, so lowering max output tokens or reducing the number of concurrent requests keeps the application under the limit.
    fr: |
      La limitation survient quand un déploiement reçoit plus de jetons ou de requêtes que sa limite ne le permet. Des invites plus longues et un nombre maximal de jetons de sortie plus élevé consomment davantage la limite de jetons par minute (TPM) : abaisser le nombre maximal de jetons de sortie ou réduire le nombre de requêtes simultanées maintient l'application sous la limite.
  options:
    a: { en: "Temperature changes the randomness of the output, not the number of tokens or requests.", fr: "La température change le caractère aléatoire de la sortie, pas le nombre de jetons ni de requêtes." }
    c: { en: "Longer prompts consume more tokens per minute and make throttling worse.", fr: "Des invites plus longues consomment plus de jetons par minute et aggravent la limitation." }
    e: { en: "Top P is another control of randomness; it does not reduce token consumption.", fr: "Top P est un autre réglage du caractère aléatoire ; il ne réduit pas la consommation de jetons." }
references:
  - title: Generative AI models
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
