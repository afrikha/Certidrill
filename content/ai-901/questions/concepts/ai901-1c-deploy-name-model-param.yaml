id: ai901-1c-deploy-name-model-param
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a Foundry project named **proj-support**, you deploy the gpt-4.1 model and name the deployment **helpdesk-chat**. A Python application calls the model through the Responses API.

    Which value should the application pass in the `model` parameter of the request?
  fr: |
    Dans un projet Foundry nommé **proj-support**, vous déployez le modèle gpt-4.1 et vous nommez le déploiement **helpdesk-chat**. Une application Python appelle le modèle par l'intermédiaire de l'API Responses.

    Quelle valeur l'application doit-elle passer dans le paramètre `model` de la requête ?
body:
  options:
    - { id: a, text: "gpt-4.1" }
    - { id: b, text: "helpdesk-chat" }
    - { id: c, text: "proj-support" }
    - { id: d, text: { en: "The URL of the project endpoint", fr: "L'URL du point de terminaison du projet" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A request targets a deployment, so the `model` parameter must contain the deployment name, here helpdesk-chat. The same model can be deployed several times under different names, for example with different settings, and the name tells the service which deployment to use.
    fr: |
      Une requête vise un déploiement : le paramètre `model` doit donc contenir le nom du déploiement, ici helpdesk-chat. Un même modèle peut être déployé plusieurs fois sous des noms différents, par exemple avec des réglages différents, et le nom indique au service quel déploiement utiliser.
  options:
    a: { en: "gpt-4.1 is the name of the model in the catalog; the deployment was given another name, and that name is what the request must contain.", fr: "gpt-4.1 est le nom du modèle dans le catalogue ; le déploiement a reçu un autre nom, et c'est ce nom que la requête doit contenir." }
    c: { en: "The project name identifies the workspace, not a model deployment.", fr: "Le nom du projet identifie l'espace de travail, pas un déploiement de modèle." }
    d: { en: "The endpoint URL is used to create the client; it is not the value of the `model` parameter.", fr: "L'URL du point de terminaison sert à créer le client ; ce n'est pas la valeur du paramètre `model`." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
