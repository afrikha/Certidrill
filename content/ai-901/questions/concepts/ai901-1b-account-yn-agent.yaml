id: ai901-1b-account-yn-agent
objective: "1.1.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso builds an agent by using Foundry Agent Service. The agent can update customer orders by using action tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un agent à l'aide de Foundry Agent Service. L'agent peut modifier les commandes des clients à l'aide d'outils d'action.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Because Microsoft hosts the model, Microsoft is responsible for making sure that the agent complies with the laws that apply to Contoso."
        fr: "Comme Microsoft héberge le modèle, c'est à Microsoft de s'assurer que l'agent respecte les lois qui s'appliquent à Contoso."
    - id: s2
      text:
        en: "Because the platform applies content filters, Contoso doesn't need human oversight of the agent's actions."
        fr: "Comme la plateforme applique des filtres de contenu, Contoso n'a pas besoin d'une supervision humaine des actions de l'agent."
    - id: s3
      text:
        en: "Contoso should let an operator intervene and override the agent when it behaves in an unintended way."
        fr: "Contoso doit permettre à un opérateur d'intervenir et de passer outre l'agent quand celui-ci se comporte de manière imprévue."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "The organization that builds an agent is responsible for complying with the laws and safety standards that apply to it; hosting by Microsoft doesn't transfer that responsibility. Content filters reduce harmful output but don't replace oversight: Microsoft recommends human-in-the-loop controls so that a user or an operator can intervene, correct or override the agent."
    fr: "L'organisation qui crée un agent est responsable du respect des lois et des normes de sécurité qui s'y appliquent ; l'hébergement par Microsoft ne transfère pas cette responsabilité. Les filtres de contenu réduisent les sorties nuisibles mais ne remplacent pas la supervision : Microsoft recommande des contrôles avec intervention humaine pour qu'un utilisateur ou un opérateur puisse intervenir, corriger l'agent ou passer outre."
references:
  - title: "Transparency Note for Foundry Agent Service"
    url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/agents/transparency-note
  - title: "Responsible AI for agent design"
    url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
