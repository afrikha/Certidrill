id: ai901-1a-incl-yn-primarily-inclusive
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following changes, select **Yes** if the change primarily addresses inclusiveness. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des modifications suivantes, sélectionnez **Oui** si la modification traite avant tout l'inclusion. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "A chatbot is configured to block violent content.", fr: "Un chatbot est configuré pour bloquer le contenu violent." }
    - id: s2
      text: { en: "An application that required a mouse is redesigned so that it can be operated by keyboard or by voice.", fr: "Une application qui exigeait une souris est repensée pour être utilisable au clavier ou à la voix." }
    - id: s3
      text: { en: "Voice recordings are deleted as soon as they are transcribed.", fr: "Les enregistrements vocaux sont supprimés dès qu'ils sont transcrits." }
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Blocking violent content keeps the behavior of the chatbot safe, which is reliability and safety. Adding keyboard and voice operation removes a barrier for people who are unable to use a mouse, which is inclusiveness. Deleting recordings that are no longer needed protects personal data, which is privacy and security."
    fr: "Bloquer le contenu violent garde le comportement du chatbot sans danger : c'est la fiabilité et la sécurité. Ajouter l'utilisation au clavier et à la voix supprime un obstacle pour les personnes qui ne peuvent pas se servir d'une souris : c'est de l'inclusion. Supprimer des enregistrements devenus inutiles protège les données personnelles : c'est la confidentialité et la sécurité."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
