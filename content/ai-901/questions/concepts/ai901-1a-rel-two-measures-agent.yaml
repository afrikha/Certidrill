id: ai901-1a-rel-two-measures-agent
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware prepares the release of a customer-facing AI agent that was built in Microsoft Foundry.

    Which two measures address the reliability and safety principle? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prépare la mise en service d'un agent d'IA destiné aux clients, créé dans Microsoft Foundry.

    Quelles sont les deux mesures qui relèvent du principe de fiabilité et de sécurité ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Content filters block harmful generated content before it reaches users.", fr: "Des filtres de contenu bloquent le contenu généré nuisible avant qu'il n'atteigne les utilisateurs." }
    - id: b
      text: { en: "Role-based access control limits who can read the data of the agent.", fr: "Le contrôle d'accès en fonction du rôle limite les personnes qui peuvent lire les données de l'agent." }
    - id: c
      text: { en: "The responses of the agent cite the documents that they are based on.", fr: "Les réponses de l'agent citent les documents sur lesquels elles s'appuient." }
    - id: d
      text: { en: "Adversarial prompts are used before release to find jailbreak vulnerabilities.", fr: "Des invites contradictoires sont utilisées avant la mise en service pour trouver des vulnérabilités de type jailbreak." }
    - id: e
      text: { en: "The chat window of the agent can be operated with a keyboard only.", fr: "La fenêtre de conversation de l'agent peut être utilisée uniquement au clavier." }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "A reliable and safe system resists harmful manipulation and doesn't cause harm through its own behavior. Testing an agent with adversarial prompts discovers jailbreak vulnerabilities before release, and content filters and guardrails block harmful output before it reaches users."
    fr: "Un système fiable et sûr résiste aux manipulations nuisibles et ne cause pas de tort par son propre comportement. Tester un agent avec des invites contradictoires révèle les vulnérabilités de type jailbreak avant la mise en service, et les filtres de contenu et garde-fous bloquent les sorties nuisibles avant qu'elles n'atteignent les utilisateurs."
  options:
    b: { en: "Limiting who can read data is a privacy and security measure.", fr: "Limiter les personnes qui peuvent lire les données est une mesure de confidentialité et de sécurité." }
    c: { en: "Citing sources helps users understand and verify an answer, which is transparency.", fr: "Citer les sources aide les utilisateurs à comprendre et à vérifier une réponse : cela relève de la transparence." }
    e: { en: "Keyboard-only operation makes the agent accessible, which is inclusiveness.", fr: "L'utilisation au clavier seul rend l'agent accessible : cela relève de l'inclusion." }
references:
  - title: "Responsible AI for Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
