id: ai901-1c-wl-order-agent
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys wants an assistant for its online store. When a customer asks to change a delivery address, the assistant must look up the order in the order system and update it, without help from an employee.

    Which AI workload does this scenario represent?
  fr: |
    Wingtip Toys veut un assistant pour sa boutique en ligne. Lorsqu'un client demande à changer une adresse de livraison, l'assistant doit retrouver la commande dans le système de commandes et la mettre à jour, sans l'aide d'un employé.

    Quelle charge de travail d'IA ce scénario représente-t-il ?
body:
  options:
    - { id: a, text: { en: "Agentic AI", fr: "IA agentique" } }
    - { id: b, text: { en: "Generative AI", fr: "IA générative" } }
    - { id: c, text: { en: "Text analysis", fr: "Analyse de texte" } }
    - { id: d, text: { en: "Information extraction", fr: "Extraction d'informations" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An agent combines a model, instructions and tools. The tools let it take actions, such as querying a system or calling an API, across several steps. Looking up an order and then updating it is an action on a business system, which is what distinguishes agentic AI.
    fr: |
      Un agent combine un modèle, des instructions et des outils. Les outils lui permettent d'agir, par exemple en interrogeant un système ou en appelant une API, sur plusieurs étapes. Retrouver une commande puis la mettre à jour est une action sur un système métier : c'est ce qui distingue l'IA agentique.
  options:
    b: { en: "Generative AI alone produces content from a prompt; reading and updating the order system requires tools, which is what an agent adds.", fr: "L'IA générative seule produit du contenu à partir d'une invite ; lire et mettre à jour le système de commandes demande des outils, ce qu'un agent ajoute." }
    c: { en: "Text analysis extracts meaning from text, such as sentiment or entities; it takes no action.", fr: "L'analyse de texte extrait du sens d'un texte, comme les sentiments ou les entités ; elle n'accomplit aucune action." }
    d: { en: "Information extraction turns unstructured content into structured data; it does not update an order.", fr: "L'extraction d'informations transforme un contenu non structuré en données structurées ; elle ne met pas à jour une commande." }
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
