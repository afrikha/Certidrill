id: ai901-1c-sp-batch-calls
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A contact center of Northwind Traders stores 50,000 recorded calls as audio files in Azure Storage. The company needs the text of all the calls for a quality review next month. The results are not needed immediately.

    Which capability of Azure Speech should the company use?
  fr: |
    Un centre de contact de Northwind Traders conserve 50 000 appels enregistrés sous forme de fichiers audio dans Stockage Azure. L'entreprise a besoin du texte de tous les appels pour une revue qualité le mois prochain. Les résultats ne sont pas nécessaires immédiatement.

    Quelle fonctionnalité d'Azure Speech l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Batch transcription", fr: "La transcription par lots" } }
    - { id: b, text: { en: "Real-time transcription", fr: "La transcription en temps réel" } }
    - { id: c, text: { en: "Speech translation", fr: "La traduction vocale" } }
    - { id: d, text: { en: "Text to speech", fr: "La synthèse vocale" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Batch transcription is designed for large amounts of audio stored in files. You point the service to the files, the jobs run asynchronously, and you collect the transcripts when they are ready.
    fr: |
      La transcription par lots est conçue pour de grandes quantités d'audio stockées dans des fichiers. Vous indiquez les fichiers au service, les traitements s'exécutent de façon asynchrone et vous récupérez les transcriptions quand elles sont prêtes.
  options:
    b: { en: "Real-time transcription is meant for audio streamed while a person is speaking, not for a large stock of stored recordings.", fr: "La transcription en temps réel vise l'audio envoyé en flux pendant qu'une personne parle, pas un grand stock d'enregistrements." }
    c: { en: "Speech translation returns the speech in another language, which is not requested.", fr: "La traduction vocale renvoie la parole dans une autre langue, ce qui n'est pas demandé." }
    d: { en: "Text to speech creates audio from text; the company needs text from audio.", fr: "La synthèse vocale crée de l'audio à partir de texte ; l'entreprise a besoin de texte à partir d'audio." }
references:
  - title: Speech recognition
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: What is speech to text?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-to-text
