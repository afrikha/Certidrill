id: ai901-1c-sp-synthesis-features
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You list the capabilities of Azure Speech in Foundry Tools for a design document.

    Which two capabilities belong to speech synthesis?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous dressez la liste des fonctionnalités d'Azure Speech dans Foundry Tools pour un document de conception.

    Quelles sont les deux fonctionnalités qui relèvent de la synthèse vocale ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Batch transcription of stored recordings", fr: "La transcription par lots d'enregistrements stockés" } }
    - { id: b, text: { en: "Neural voices with natural intonation", fr: "Les voix neuronales à l'intonation naturelle" } }
    - { id: c, text: { en: "An acoustic model that converts audio into phonemes", fr: "Un modèle acoustique qui convertit l'audio en phonèmes" } }
    - { id: d, text: { en: "Control of the speaking rate and the pitch", fr: "Le réglage du débit de parole et de la hauteur de la voix" } }
    - { id: e, text: { en: "Separation of the speakers of a conversation", fr: "La séparation des interlocuteurs d'une conversation" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Speech synthesis turns text into audio spoken by a voice. Neural voices use neural networks to produce more natural intonation, and the synthesized audio can be given a particular voice, speaking rate, pitch and volume.
    fr: |
      La synthèse vocale transforme du texte en audio prononcé par une voix. Les voix neuronales utilisent des réseaux neuronaux pour produire une intonation plus naturelle, et l'audio synthétisé peut recevoir une voix, un débit de parole, une hauteur et un volume particuliers.
  options:
    a: { en: "Batch transcription converts stored audio into text: it is speech recognition.", fr: "La transcription par lots convertit de l'audio stocké en texte : c'est de la reconnaissance vocale." }
    c: { en: "The acoustic model is the part of speech recognition that turns audio into phonemes.", fr: "Le modèle acoustique est la partie de la reconnaissance vocale qui transforme l'audio en phonèmes." }
    e: { en: "Separating speakers (diarization) is a feature of transcription, so of speech recognition.", fr: "Séparer les interlocuteurs (diarisation) est une fonctionnalité de la transcription, donc de la reconnaissance vocale." }
references:
  - title: Speech synthesis
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
  - title: Speech recognition
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
