id: ai901-1b-account-drag-practices
objective: "1.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    An organization wants to remain accountable for the AI systems that it deploys.

    Match each goal to the practice that achieves it.

    To answer, drag the appropriate practice to each goal. Each practice may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une organisation veut rester responsable des systèmes d'IA qu'elle déploie.

    Associez chaque objectif à la pratique qui permet de l'atteindre.

    Pour répondre, faites glisser la pratique appropriée vers chaque objectif. Chaque pratique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: disclosure, text: { en: "An in-product disclosure", fr: "Une mention affichée dans le produit" } }
    - { id: training, text: { en: "Employee training", fr: "La formation des employés" } }
    - { id: board, text: { en: "An internal review board", fr: "Un conseil d'examen interne" } }
    - { id: filter, text: { en: "A content filter", fr: "Un filtre de contenu" } }
    - { id: loop, text: { en: "A human in the loop", fr: "Un humain dans la boucle" } }
  targets:
    - id: t1
      text: { en: "Provide oversight and guidance, and define best practices for documenting and testing AI systems.", fr: "Assurer une supervision et des conseils, et définir les bonnes pratiques pour documenter et tester les systèmes d'IA." }
    - id: t2
      text: { en: "Let a person with the required expertise inspect automated decisions and resolve problems with the output of the model.", fr: "Permettre à une personne possédant l'expertise nécessaire d'inspecter les décisions automatisées et de résoudre les problèmes liés à la sortie du modèle." }
    - id: t3
      text: { en: "Make sure that staff use and maintain the solution responsibly and recognize when it needs extra technical support.", fr: "Faire en sorte que le personnel utilise et maintienne la solution de manière responsable et sache reconnaître quand elle nécessite un support technique supplémentaire." }
answer:
  mapping: { t1: board, t2: loop, t3: training }
explanation:
  correct:
    en: "Internal review boards provide oversight and guidance and can define best practices for documenting and testing AI systems. Keeping humans with the requisite expertise in the loop lets them inspect and resolve problems with automated decisions. Training makes sure that employees use and maintain the solution responsibly and know when it needs more support."
    fr: "Les conseils d'examen internes assurent une supervision et des conseils, et peuvent définir les bonnes pratiques pour documenter et tester les systèmes d'IA. Garder impliqués des humains possédant l'expertise nécessaire leur permet d'inspecter les décisions automatisées et d'en résoudre les problèmes. La formation garantit que les employés utilisent et maintiennent la solution de manière responsable et savent quand elle nécessite davantage de support."
  options:
    disclosure:
      en: "An in-product disclosure informs users that AI is involved; it is a transparency measure."
      fr: "Une mention affichée dans le produit informe les utilisateurs que l'IA intervient ; c'est une mesure de transparence."
    filter:
      en: "A content filter blocks harmful prompts and responses; it is a safety measure."
      fr: "Un filtre de contenu bloque les invites et les réponses nuisibles ; c'est une mesure de sécurité."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
