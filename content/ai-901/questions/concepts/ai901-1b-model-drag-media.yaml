id: ai901-1b-model-drag-media
objective: "1.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys plans three features for its marketing application.

    Match each feature to the model that provides it.

    To answer, drag the appropriate model to each feature. Each model may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit trois fonctionnalités pour son application marketing.

    Associez chaque fonctionnalité au modèle qui la fournit.

    Pour répondre, faites glisser le modèle approprié vers chaque fonctionnalité. Chaque modèle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gpt41, text: "GPT-4.1" }
    - { id: emb, text: "text-embedding-3-small" }
    - { id: sora, text: "Sora 2" }
    - { id: o3, text: "o3-mini" }
    - { id: img, text: "GPT-Image-1.5" }
  targets:
    - id: t1
      text: { en: "Create a short promotional video clip from a text description.", fr: "Créer un court clip vidéo promotionnel à partir d'une description textuelle." }
    - id: t2
      text: { en: "Create a product illustration from a text description.", fr: "Créer l'illustration d'un produit à partir d'une description textuelle." }
    - id: t3
      text: { en: "Describe in text what a photo uploaded by a customer shows.", fr: "Décrire en texte ce que montre une photo chargée par un client." }
answer:
  mapping: { t1: sora, t2: img, t3: gpt41 }
explanation:
  correct:
    en: "Sora 2 is a video generation model. GPT-Image-1.5 is an image generation model that creates images from text descriptions. GPT-4.1 is a multimodal model that processes text and images together, so it can describe a photo in natural language."
    fr: "Sora 2 est un modèle de génération de vidéos. GPT-Image-1.5 est un modèle de génération d'images qui crée des images à partir de descriptions textuelles. GPT-4.1 est un modèle multimodal qui traite ensemble le texte et les images : il peut donc décrire une photo en langage naturel."
  options:
    emb:
      en: "text-embedding-3-small converts text into vectors for similarity comparisons."
      fr: "text-embedding-3-small convertit du texte en vecteurs pour des comparaisons de similarité."
    o3:
      en: "o3-mini is a reasoning model that accepts only text and generates only text."
      fr: "o3-mini est un modèle de raisonnement qui n'accepte que du texte et ne génère que du texte."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
