id: ai901-1a-incl-which-scenario
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Which scenario describes an inclusiveness issue in an AI solution?
  fr: |
    Quel scénario décrit un problème d'inclusion dans une solution d'IA ?
body:
  options:
    - id: a
      text: { en: "A lending model sets lower credit limits for women than for men who have the same finances.", fr: "Un modèle de prêt fixe des plafonds de crédit plus bas pour les femmes que pour les hommes ayant les mêmes finances." }
    - id: b
      text: { en: "A voice assistant offers no alternative for people who are unable to speak.", fr: "Un assistant vocal ne propose aucune alternative aux personnes qui ne peuvent pas parler." }
    - id: c
      text: { en: "A hiring model ranks candidates over 50 lower than younger candidates who have the same qualifications.", fr: "Un modèle de recrutement classe les candidats de plus de 50 ans moins bien que des candidats plus jeunes ayant les mêmes qualifications." }
    - id: d
      text: { en: "A triage model assigns different priorities to patients who have the same symptoms, depending on their ethnic origin.", fr: "Un modèle de triage attribue des priorités différentes à des patients présentant les mêmes symptômes, selon leur origine ethnique." }
answer: { optionId: b }
explanation:
  correct:
    en: "Inclusiveness is about access: nobody should be left out because of a disability or another need. A voice-only assistant excludes people who are unable to speak. In the three other scenarios everyone can use the system, but comparable people receive different results, which is a fairness issue."
    fr: "L'inclusion porte sur l'accès : personne ne doit être laissé de côté à cause d'un handicap ou d'un autre besoin. Un assistant uniquement vocal exclut les personnes qui ne peuvent pas parler. Dans les trois autres scénarios, tout le monde peut utiliser le système, mais des personnes comparables obtiennent des résultats différents : c'est un problème d'impartialité."
  options:
    a: { en: "Different credit limits for people who have the same finances is a fairness issue.", fr: "Des plafonds de crédit différents pour des personnes ayant les mêmes finances sont un problème d'impartialité." }
    c: { en: "A different ranking for candidates who have the same qualifications is a fairness issue.", fr: "Un classement différent pour des candidats ayant les mêmes qualifications est un problème d'impartialité." }
    d: { en: "Different priorities for patients who have the same symptoms is a fairness issue.", fr: "Des priorités différentes pour des patients présentant les mêmes symptômes sont un problème d'impartialité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
