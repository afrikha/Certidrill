id: ai901-1c-ta-sentiment-dashboard
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hotel chain collects about 10,000 free-text guest comments each month. Management wants a dashboard that shows, for each hotel, the share of comments written by unhappy guests.

    Which text analysis technique provides the data for the dashboard?
  fr: |
    Une chaîne d'hôtels recueille chaque mois environ 10 000 commentaires de clients en texte libre. La direction veut un tableau de bord qui montre, pour chaque hôtel, la part des commentaires rédigés par des clients mécontents.

    Quelle technique d'analyse de texte fournit les données du tableau de bord ?
body:
  options:
    - { id: a, text: { en: "Key phrase extraction", fr: "Extraction d'expressions clés" } }
    - { id: b, text: { en: "Entity detection", fr: "Détection d'entités" } }
    - { id: c, text: { en: "Sentiment analysis", fr: "Analyse des sentiments" } }
    - { id: d, text: { en: "Summarization", fr: "Résumé de texte" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Sentiment analysis classifies each comment as positive, negative or neutral. Counting the negative comments of each hotel gives the share of unhappy guests directly.
    fr: |
      L'analyse des sentiments classe chaque commentaire comme positif, négatif ou neutre. Compter les commentaires négatifs de chaque hôtel donne directement la part des clients mécontents.
  options:
    a: { en: "Key phrase extraction lists what the comments talk about, not whether the guests are satisfied.", fr: "L'extraction d'expressions clés liste ce dont parlent les commentaires, pas si les clients sont satisfaits." }
    b: { en: "Entity detection finds names, places, dates and quantities; it does not measure opinion.", fr: "La détection d'entités trouve des noms, des lieux, des dates et des quantités ; elle ne mesure pas l'opinion." }
    d: { en: "Summarization shortens each comment; someone would still have to judge whether it is negative.", fr: "Le résumé raccourcit chaque commentaire ; il faudrait encore juger s'il est négatif." }
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
  - title: What are sentiment analysis and opinion mining?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/sentiment-opinion-mining/overview
