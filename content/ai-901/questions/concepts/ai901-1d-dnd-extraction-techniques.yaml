id: ai901-1d-dnd-extraction-techniques
objective: "1.3.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You need to match each requirement to the content extraction technique that meets it.

    Which technique should you use for each requirement? To answer, drag the appropriate technique to each requirement. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez associer chaque besoin à la technique d'extraction de contenu qui y répond.

    Quelle technique devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser la technique appropriée vers chaque besoin. Chaque technique peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: ocr
    text:
      en: Optical character recognition (OCR)
      fr: Reconnaissance optique de caractères (OCR)
  - id: layout
    text:
      en: Layout analysis
      fr: Analyse de la disposition
  - id: diar
    text:
      en: Diarization
      fr: Diarisation
  - id: keyframes
    text:
      en: Key frame extraction
      fr: "Extraction d'images clés"
  - id: shots
    text:
      en: Shot detection
      fr: Détection des plans
  targets:
  - id: speakers
    text:
      en: Attribute each part of the transcript of a call to the person who spoke
      fr: "Attribuer chaque partie de la transcription d'un appel à la personne qui a parlé"
  - id: tables
    text:
      en: Identify the tables and the sections of a contract
      fr: "Identifier les tableaux et les sections d'un contrat"
  - id: frames
    text:
      en: Select still images from a video so that a model can analyze what is shown
      fr: "Sélectionner des images fixes d'une vidéo pour qu'un modèle puisse analyser ce qui est montré"
  - id: handwriting
    text:
      en: Read the handwritten notes of a scanned form
      fr: "Lire les notes manuscrites d'un formulaire numérisé"
answer:
  mapping:
    speakers: diar
    tables: layout
    frames: keyframes
    handwriting: ocr
explanation:
  correct:
    en: Diarization distinguishes the speakers of a recording and attributes the parts of the transcript to them. Layout analysis recognizes the structure of a document, such as paragraphs, sections and tables. Key frame extraction takes frames from each shot of a video so that field extraction has images to work on. OCR reads printed and handwritten text. Shot detection only locates the shot boundaries of a video.
    fr: "La diarisation distingue les locuteurs d'un enregistrement et leur attribue les parties de la transcription. L'analyse de la disposition reconnaît la structure d'un document, comme les paragraphes, les sections et les tableaux. L'extraction d'images clés prélève des images dans chaque plan d'une vidéo pour que l'extraction de champs dispose d'images à traiter. L'OCR lit le texte imprimé et manuscrit. La détection des plans se limite à repérer les limites des plans d'une vidéo."
references:
- title: Azure Content Understanding in Foundry Tools video overview
  url: "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"
- title: Azure Content Understanding in Foundry Tools audio overview
  url: "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview"
