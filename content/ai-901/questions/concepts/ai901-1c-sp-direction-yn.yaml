id: ai901-1c-sp-direction-yn
objective: "1.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You decide which speech capability each feature of a new application needs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déterminez de quelle fonctionnalité vocale chaque fonction d'une nouvelle application a besoin.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Producing the written text of a voicemail message requires speech recognition.
        fr: Produire le texte écrit d'un message vocal demande la reconnaissance vocale.
    - id: s2
      text:
        en: Announcing train departures over a loudspeaker from a text timetable requires speech recognition.
        fr: Annoncer les départs de trains sur un haut-parleur à partir d'un horaire en texte demande la reconnaissance vocale.
    - id: s3
      text:
        en: Writing down a note that a user dictates requires speech synthesis.
        fr: Mettre par écrit une note qu'un utilisateur dicte demande la synthèse vocale.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Look at the direction of the conversion. Speech recognition (speech to text) turns spoken audio into text: a voicemail transcript and dictation both need it. Speech synthesis (text to speech) turns text into spoken audio: announcements made from a text timetable need it.
    fr: |
      Regardez le sens de la conversion. La reconnaissance vocale (speech to text) transforme de l'audio parlé en texte : la transcription d'un message vocal et la dictée en ont toutes deux besoin. La synthèse vocale (text to speech) transforme du texte en audio parlé : des annonces faites à partir d'un horaire en texte en ont besoin.
references:
  - title: Speech recognition
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: Speech synthesis
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
