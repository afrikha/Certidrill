id: ai901-1a-rel-yn-primarily-safety
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following actions, select **Yes** if the action is primarily a reliability and safety measure. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des actions suivantes, sélectionnez **Oui** si l'action est avant tout une mesure de fiabilité et de sécurité. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "Encrypting the conversation logs of an AI agent", fr: "Chiffrer les journaux de conversation d'un agent d'IA" }
    - id: s2
      text: { en: "Testing how an AI agent responds to input that mixes languages and contains typing errors", fr: "Tester la réaction d'un agent d'IA à des entrées qui mélangent les langues et contiennent des fautes de frappe" }
    - id: s3
      text: { en: "Blocking a generated response that contains instructions for self-harm", fr: "Bloquer une réponse générée qui contient des instructions d'automutilation" }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Encryption protects data against unauthorized access, which is privacy and security. Testing with unusual input checks that the agent responds safely to conditions that weren't anticipated, and blocking harmful generated content keeps the behavior of the agent from causing harm: both are reliability and safety measures."
    fr: "Le chiffrement protège les données contre les accès non autorisés : cela relève de la confidentialité et de la sécurité. Tester avec des entrées inhabituelles vérifie que l'agent réagit sans danger à des conditions imprévues, et bloquer le contenu généré nuisible évite que le comportement de l'agent cause du tort : ce sont deux mesures de fiabilité et de sécurité."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Responsible AI for Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/azure/foundry/responsible-use-of-ai-overview
