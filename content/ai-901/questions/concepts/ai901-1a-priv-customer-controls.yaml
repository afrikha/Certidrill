id: ai901-1a-priv-customer-controls
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The AI assistant of Adatum personalizes its answers from the purchase history of each customer. A new settings page lets customers choose whether, and for which purposes, their purchase history is used.

    Which responsible AI principle does the settings page primarily support?
  fr: |
    L'assistant d'IA d'Adatum personnalise ses réponses à partir de l'historique d'achats de chaque client. Une nouvelle page de paramètres permet aux clients de choisir si leur historique d'achats est utilisé, et à quelles fins.

    Quel principe de l'IA responsable la page de paramètres sert-elle avant tout ?
body:
  options:
    - id: priv
      text: { en: "Privacy and security", fr: "Confidentialité et sécurité" }
    - id: transp
      text: { en: "Transparency", fr: "Transparence" }
    - id: acc
      text: { en: "Accountability", fr: "Responsabilité" }
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
answer: { optionId: priv }
explanation:
  correct:
    en: "Providing appropriate controls so that customers can choose how and why their data is collected and used is a privacy and security consideration. The page gives people control over their personal data."
    fr: "Fournir des contrôles appropriés pour que les clients choisissent comment et pourquoi leurs données sont collectées et utilisées est une considération de confidentialité et de sécurité. La page donne aux personnes le contrôle de leurs données personnelles."
  options:
    transp: { en: "Transparency is about understanding how the system reaches its results and what its limits are; the page gives control over personal data rather than an explanation of the system.", fr: "La transparence consiste à comprendre comment le système parvient à ses résultats et quelles sont ses limites ; la page donne un contrôle sur les données personnelles, pas une explication du système." }
    acc: { en: "Accountability is about the people who answer for the system, with governance and human oversight.", fr: "La responsabilité concerne les personnes qui répondent du système, avec une gouvernance et une supervision humaine." }
    fair: { en: "Fairness is about comparable customers receiving comparable results, not about control over data.", fr: "L'impartialité consiste à ce que des clients comparables obtiennent des résultats comparables, pas à contrôler des données." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2
