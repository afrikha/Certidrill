id: ai901-1a-priv-collection-obligation
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company records the voices of its customers to improve an AI voice assistant.

    Which obligation falls under the privacy and security principle?
  fr: |
    Une entreprise enregistre la voix de ses clients pour améliorer un assistant vocal basé sur l'IA.

    Quelle obligation relève du principe de confidentialité et de sécurité ?
body:
  options:
    - id: a
      text: { en: "Make sure that the assistant understands customers who have a speech impairment.", fr: "S'assurer que l'assistant comprend les clients qui ont un trouble de la parole." }
    - id: b
      text: { en: "Make sure that the assistant answers consistently in noisy environments.", fr: "S'assurer que l'assistant répond de manière cohérente dans les environnements bruyants." }
    - id: c
      text: { en: "Make sure that the assistant gives similar customers similar offers.", fr: "S'assurer que l'assistant fait des offres similaires à des clients similaires." }
    - id: d
      text: { en: "Make sure that customers are told how their recordings are collected, used and stored.", fr: "S'assurer que les clients sont informés de la manière dont leurs enregistrements sont collectés, utilisés et stockés." }
answer: { optionId: d }
explanation:
  correct:
    en: "AI systems must comply with privacy laws that require transparency about the collection, use and storage of data and that give people appropriate controls over their data. Informing customers about their recordings is therefore a privacy obligation."
    fr: "Les systèmes d'IA doivent respecter les lois sur la protection de la vie privée, qui exigent de la transparence sur la collecte, l'utilisation et le stockage des données et qui donnent aux personnes des contrôles appropriés sur leurs données. Informer les clients au sujet de leurs enregistrements est donc une obligation de confidentialité."
  options:
    a: { en: "Serving customers who have a speech impairment is an inclusiveness consideration.", fr: "Servir les clients qui ont un trouble de la parole est une considération d'inclusion." }
    b: { en: "Consistent behavior in difficult conditions is a reliability and safety consideration.", fr: "Un comportement cohérent dans des conditions difficiles est une considération de fiabilité et de sécurité." }
    c: { en: "Similar offers for similar customers is a fairness consideration.", fr: "Des offres similaires pour des clients similaires sont une considération d'impartialité." }
references:
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
