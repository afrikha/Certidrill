id: ai901-1a-fair-definition
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the fairness principle of responsible AI?
  fr: |
    Quelle affirmation décrit le principe d'impartialité de l'IA responsable ?
body:
  options:
    - id: a
      text: { en: "AI systems should be usable by people who have a wide range of abilities and needs.", fr: "Les systèmes d'IA doivent être utilisables par des personnes ayant des capacités et des besoins très variés." }
    - id: b
      text: { en: "AI systems should perform as they were designed, including in unexpected conditions.", fr: "Les systèmes d'IA doivent fonctionner comme ils ont été conçus, y compris dans des conditions inattendues." }
    - id: c
      text: { en: "AI systems should avoid affecting similarly situated groups of people in different ways.", fr: "Les systèmes d'IA doivent éviter d'affecter différemment des groupes de personnes dans des situations similaires." }
    - id: d
      text: { en: "AI systems should let people understand how they reach their decisions.", fr: "Les systèmes d'IA doivent permettre aux personnes de comprendre comment ils parviennent à leurs décisions." }
answer: { optionId: c }
explanation:
  correct:
    en: "Fairness means that AI systems treat everyone fairly and avoid affecting similarly situated groups of people in different ways. People with similar symptoms, finances or qualifications should receive the same recommendations."
    fr: "L'impartialité signifie que les systèmes d'IA traitent tout le monde de manière équitable et évitent d'affecter différemment des groupes de personnes dans des situations similaires. Des personnes dont les symptômes, les finances ou les qualifications sont similaires doivent recevoir les mêmes recommandations."
  options:
    a: { en: "This statement describes inclusiveness.", fr: "Cette affirmation décrit l'inclusion." }
    b: { en: "This statement describes reliability and safety.", fr: "Cette affirmation décrit la fiabilité et la sécurité." }
    d: { en: "This statement describes transparency.", fr: "Cette affirmation décrit la transparence." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Artificial Intelligence overview"
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence
