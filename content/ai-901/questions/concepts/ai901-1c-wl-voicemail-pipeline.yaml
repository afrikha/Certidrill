id: ai901-1c-wl-voicemail-pipeline
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A clinic of Lamna Healthcare records the voicemail messages left by patients. The clinic wants a solution that first produces the written text of each message, and then determines which messages express dissatisfaction.

    Which two AI workloads should the solution combine, in this order?
  fr: |
    Une clinique de Lamna Healthcare enregistre les messages vocaux laissés par les patients. La clinique veut une solution qui produit d'abord le texte écrit de chaque message, puis détermine quels messages expriment une insatisfaction.

    Quelles sont les deux charges de travail d'IA que la solution doit combiner, dans cet ordre ?
body:
  options:
    - { id: a, text: { en: "Text analysis, then speech", fr: "Analyse de texte, puis reconnaissance et synthèse vocales" } }
    - { id: b, text: { en: "Computer vision, then text analysis", fr: "Vision par ordinateur, puis analyse de texte" } }
    - { id: c, text: { en: "Speech, then computer vision", fr: "Reconnaissance et synthèse vocales, puis vision par ordinateur" } }
    - { id: d, text: { en: "Speech, then text analysis", fr: "Reconnaissance et synthèse vocales, puis analyse de texte" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A voicemail is spoken audio: speech recognition, a speech workload, converts it into text. Deciding whether a text expresses dissatisfaction is sentiment analysis, a text analysis technique, and it can only run once the text exists.
    fr: |
      Un message vocal est de l'audio parlé : la reconnaissance vocale, une charge de travail vocale, le convertit en texte. Déterminer si un texte exprime une insatisfaction relève de l'analyse des sentiments, une technique d'analyse de texte, qui ne peut s'exécuter qu'une fois le texte disponible.
  options:
    a: { en: "Text analysis needs text as input, and the text does not exist until the audio has been transcribed.", fr: "L'analyse de texte a besoin de texte en entrée, et ce texte n'existe pas tant que l'audio n'a pas été transcrit." }
    b: { en: "Computer vision interprets images and video; a voicemail is audio.", fr: "La vision par ordinateur interprète des images et des vidéos ; un message vocal est de l'audio." }
    c: { en: "The first step is right, but the transcript is text: finding dissatisfaction in it is text analysis, not computer vision.", fr: "La première étape est juste, mais la transcription est du texte : y repérer l'insatisfaction relève de l'analyse de texte, pas de la vision par ordinateur." }
references:
  - title: Speech recognition
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
