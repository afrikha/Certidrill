id: ai901-1a-incl-voice-only-exclusion
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys designs a smart speaker assistant whose only input method is voice.

    You apply the inclusive design principle of recognizing exclusion.

    Which group of users is most likely to be left out by this design?
  fr: |
    Tailspin Toys conçoit un assistant pour enceinte connectée dont le seul mode de saisie est la voix.

    Vous appliquez le principe de conception inclusive qui consiste à reconnaître l'exclusion.

    Quel groupe d'utilisateurs risque le plus d'être laissé de côté par cette conception ?
body:
  options:
    - id: a
      text: { en: "People who are blind", fr: "Les personnes aveugles" }
    - id: b
      text: { en: "People who have limited use of their hands", fr: "Les personnes ayant un usage limité de leurs mains" }
    - id: c
      text: { en: "People who have a speech disability", fr: "Les personnes ayant un trouble de la parole" }
    - id: d
      text: { en: "People who have low vision", fr: "Les personnes malvoyantes" }
answer: { optionId: c }
explanation:
  correct:
    en: "Recognizing exclusion means understanding who might be left out and why. An assistant that accepts only voice input excludes people who are unable to speak clearly, so the design needs another input method for them."
    fr: "Reconnaître l'exclusion consiste à comprendre qui peut être laissé de côté et pourquoi. Un assistant qui n'accepte que la saisie vocale exclut les personnes qui ne peuvent pas parler distinctement : la conception a donc besoin d'un autre mode de saisie pour elles."
  options:
    a: { en: "Voice input needs neither a screen nor sight, so it helps people who are blind.", fr: "La saisie vocale ne demande ni écran ni vue : elle aide donc les personnes aveugles." }
    b: { en: "Voice input needs no keyboard and no touch, so it helps people who have limited use of their hands.", fr: "La saisie vocale ne demande ni clavier ni toucher : elle aide donc les personnes ayant un usage limité de leurs mains." }
    d: { en: "Voice input doesn't depend on reading a screen, so it helps people who have low vision.", fr: "La saisie vocale ne dépend pas de la lecture d'un écran : elle aide donc les personnes malvoyantes." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
