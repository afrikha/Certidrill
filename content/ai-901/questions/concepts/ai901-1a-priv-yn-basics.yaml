id: ai901-1a-priv-yn-basics
objective: "1.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "Making sure that an AI system reacts safely to unexpected input is primarily a privacy and security consideration.", fr: "S'assurer qu'un système d'IA réagit sans danger à une entrée inattendue est avant tout une considération de confidentialité et de sécurité." }
    - id: s2
      text: { en: "Using role-based access to protect an AI system from bad actors is a privacy and security consideration.", fr: "Utiliser l'accès en fonction du rôle pour protéger un système d'IA contre les acteurs malveillants est une considération de confidentialité et de sécurité." }
    - id: s3
      text: { en: "An AI system should use personal data only for the time required and for defined purposes.", fr: "Un système d'IA ne doit utiliser les données personnelles que pendant la durée nécessaire et pour des finalités définies." }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A safe reaction to unexpected input concerns the behavior of the system, which is the reliability and safety principle. The privacy and security principle covers the protection of AI systems from bad actors, for example with role-based access, and the integrity of personal data, which is used only for the time required and for defined purposes."
    fr: "Une réaction sûre à une entrée inattendue concerne le comportement du système : c'est le principe de fiabilité et de sécurité. Le principe de confidentialité et de sécurité couvre la protection des systèmes d'IA contre les acteurs malveillants, par exemple avec l'accès en fonction du rôle, et l'intégrité des données personnelles, utilisées uniquement pendant la durée nécessaire et pour des finalités définies."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
