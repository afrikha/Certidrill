id: ai901-1d-yn-extraction-basics
objective: "1.3.5"
type: "yesno_statements"
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is evaluating AI-powered information extraction.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders évalue l'extraction d'informations fondée sur l'IA.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Information extraction turns unstructured content, such as scanned receipts, into structured data that applications can search and analyze.
      fr: "L'extraction d'informations transforme un contenu non structuré, comme des reçus numérisés, en données structurées que des applications peuvent interroger et analyser."
  - id: s2
    text:
      en: Basic OCR identifies which of the numbers printed on an invoice is the invoice total.
      fr: "L'OCR de base identifie lequel des nombres imprimés sur une facture est le total de la facture."
  - id: s3
    text:
      en: Azure Content Understanding in Foundry Tools can analyze audio and video in addition to documents and images.
      fr: "Azure Content Understanding dans Foundry Tools peut analyser de l'audio et de la vidéo, en plus des documents et des images."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: "AI-powered information extraction turns unstructured content into machine-readable data that can be searched and analyzed. Basic OCR only recognizes text: it does not understand meaning, context or the relationships between values, so naming the total requires schema-based field extraction. Content Understanding supports documents, images, audio and video."
    fr: "L'extraction d'informations fondée sur l'IA transforme un contenu non structuré en données lisibles par une machine, qui peuvent être interrogées et analysées. L'OCR de base ne fait que reconnaître le texte : il ne comprend ni le sens, ni le contexte, ni les relations entre les valeurs ; désigner le total demande donc une extraction de champs fondée sur un schéma. Content Understanding prend en charge les documents, les images, l'audio et la vidéo."
references:
- title: Introduction
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/1-introduction"
- title: Extract information from documents
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents"
