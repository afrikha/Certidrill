id: ai901-1b-model-yn-catalog
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Foundry model catalog contains only models that were developed by Microsoft or OpenAI."
        fr: "Le catalogue de modèles de Foundry ne contient que des modèles développés par Microsoft ou OpenAI."
    - id: s2
      text:
        en: "The entry of a model in the catalog typically includes benchmark results and a model card."
        fr: "L'entrée d'un modèle dans le catalogue comprend généralement des résultats de benchmarks et une carte de modèle."
    - id: s3
      text:
        en: "For a well-defined task such as key phrase extraction, you can use a Foundry Tool with a prebuilt model instead of a model from the catalog."
        fr: "Pour une tâche bien définie comme l'extraction d'expressions clés, vous pouvez utiliser un outil Foundry doté d'un modèle prédéfini plutôt qu'un modèle du catalogue."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The model catalog brings together models from many providers, including Anthropic, Mistral, Meta, Cohere, DeepSeek and Hugging Face. Each entry typically describes the capabilities of the model and gives benchmark results and a model card. For a well-defined use case, a Foundry Tool such as Azure Language offers a prebuilt model with predictable performance."
    fr: "Le catalogue de modèles réunit des modèles de nombreux fournisseurs, dont Anthropic, Mistral, Meta, Cohere, DeepSeek et Hugging Face. Chaque entrée décrit généralement les fonctionnalités du modèle et donne des résultats de benchmarks et une carte de modèle. Pour un cas d'usage bien défini, un outil Foundry comme Azure Language offre un modèle prédéfini aux performances prévisibles."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Microsoft Foundry for AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/4-microsoft-foundry
