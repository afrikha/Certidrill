id: ai901-1c-wl-match-drag
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam lists the AI solutions that it wants to build.

    Which AI workload does each solution represent? To answer, drag the appropriate workloads to the correct solutions. Each workload may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dresse la liste des solutions d'IA qu'elle veut créer.

    Quelle charge de travail d'IA chaque solution représente-t-elle ? Pour répondre, faites glisser les charges de travail appropriées vers les solutions correspondantes. Chaque charge de travail peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gen, text: { en: "Generative AI", fr: "IA générative" } }
    - { id: agent, text: { en: "Agentic AI", fr: "IA agentique" } }
    - { id: ta, text: { en: "Text analysis", fr: "Analyse de texte" } }
    - { id: speech, text: { en: "Speech", fr: "Reconnaissance et synthèse vocales" } }
    - { id: cv, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
    - { id: ie, text: { en: "Information extraction", fr: "Extraction d'informations" } }
  targets:
    - id: t1
      text: { en: "Label each written product review as positive, negative or neutral", fr: "Étiqueter chaque avis écrit sur un produit comme positif, négatif ou neutre" }
    - id: t2
      text: { en: "Return the supplier, the date and the total of each scanned invoice as JSON fields", fr: "Renvoyer le fournisseur, la date et le total de chaque facture numérisée sous forme de champs JSON" }
    - id: t3
      text: { en: "Check a supplier's stock through an API, then place the replenishment order", fr: "Vérifier le stock d'un fournisseur par une API, puis passer la commande de réapprovisionnement" }
    - id: t4
      text: { en: "Announce the next departures aloud in a station from the timetable text", fr: "Annoncer à voix haute les prochains départs dans une gare à partir du texte des horaires" }
answer:
  mapping: { t1: ta, t2: ie, t3: agent, t4: speech }
explanation:
  correct:
    en: |
      Labeling reviews by sentiment is text analysis. Returning named fields from scanned invoices is information extraction. Checking stock and then placing an order requires tools and actions on other systems, which is agentic AI. Announcing text aloud is speech synthesis, a speech workload. Generative AI and computer vision are not used here.
    fr: |
      Étiqueter des avis selon leur sentiment relève de l'analyse de texte. Renvoyer des champs nommés à partir de factures numérisées relève de l'extraction d'informations. Vérifier un stock puis passer une commande demande des outils et des actions sur d'autres systèmes : c'est de l'IA agentique. Annoncer un texte à voix haute est de la synthèse vocale, une charge de travail vocale. L'IA générative et la vision par ordinateur ne servent pas ici.
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/1-introduction
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
