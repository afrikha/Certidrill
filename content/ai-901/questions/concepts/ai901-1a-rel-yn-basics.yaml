id: ai901-1a-rel-yn-basics
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "An AI system that responds safely to conditions that its developers didn't anticipate supports the reliability and safety principle.", fr: "Un système d'IA qui réagit sans danger à des conditions que ses développeurs n'avaient pas anticipées respecte le principe de fiabilité et de sécurité." }
    - id: s2
      text: { en: "Obtaining the consent of users before their personal data is collected is primarily a reliability and safety consideration.", fr: "Obtenir le consentement des utilisateurs avant la collecte de leurs données personnelles est avant tout une considération de fiabilité et de sécurité." }
    - id: s3
      text: { en: "An AI system that resists attempts to manipulate it into causing harm supports the reliability and safety principle.", fr: "Un système d'IA qui résiste aux tentatives de manipulation visant à lui faire causer du tort respecte le principe de fiabilité et de sécurité." }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "The reliability and safety principle states that AI systems operate as they were designed, respond safely to unanticipated conditions and resist harmful manipulation. Consent to the collection of personal data belongs to the privacy and security principle."
    fr: "Le principe de fiabilité et de sécurité indique que les systèmes d'IA fonctionnent comme ils ont été conçus, réagissent sans danger aux conditions imprévues et résistent aux manipulations nuisibles. Le consentement à la collecte de données personnelles relève du principe de confidentialité et de sécurité."
references:
  - title: "Artificial Intelligence overview"
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
