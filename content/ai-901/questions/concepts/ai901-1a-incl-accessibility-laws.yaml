id: ai901-1a-incl-accessibility-laws
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum sells an AI assistant to public agencies.

    Which requirement is an inclusiveness consideration?
  fr: |
    Adatum vend un assistant d'IA à des organismes publics.

    Quelle exigence est une considération d'inclusion ?
body:
  options:
    - id: a
      text: { en: "The assistant must keep its keys in Azure Key Vault.", fr: "L'assistant doit conserver ses clés dans Azure Key Vault." }
    - id: b
      text: { en: "The assistant must comply with accessibility laws and procurement requirements.", fr: "L'assistant doit respecter les lois sur l'accessibilité et les exigences d'approvisionnement." }
    - id: c
      text: { en: "The assistant must be tested with adversarial prompts before release.", fr: "L'assistant doit être testé avec des invites contradictoires avant sa mise en service." }
    - id: d
      text: { en: "The assistant must be approved by an internal review board before release.", fr: "L'assistant doit être approuvé par un comité de revue interne avant sa mise en service." }
answer: { optionId: b }
explanation:
  correct:
    en: "To make AI systems inclusive, Microsoft recommends following accessibility laws and procurement requirements and adopting recognized accessibility standards, so that the system works for everyone."
    fr: "Pour rendre les systèmes d'IA inclusifs, Microsoft recommande de suivre les lois sur l'accessibilité et les exigences d'approvisionnement et d'adopter des normes d'accessibilité reconnues, afin que le système fonctionne pour tous."
  options:
    a: { en: "Protecting keys is a privacy and security consideration.", fr: "Protéger les clés est une considération de confidentialité et de sécurité." }
    c: { en: "Testing resistance to manipulation is a reliability and safety consideration.", fr: "Tester la résistance aux manipulations est une considération de fiabilité et de sécurité." }
    d: { en: "Oversight by a review board is an accountability consideration.", fr: "La supervision par un comité de revue est une considération de responsabilité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
