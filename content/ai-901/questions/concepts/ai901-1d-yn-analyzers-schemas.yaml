id: ai901-1d-yn-analyzers-schemas
objective: "1.3.5"
type: "yesno_statements"
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to use analyzers of Azure Content Understanding in Foundry Tools to extract data from purchasing documents.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'utiliser des analyseurs d'Azure Content Understanding dans Foundry Tools pour extraire des données de documents d'achat.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: "A prebuilt analyzer such as `prebuilt-invoice` returns invoice fields without requiring Proseware to write its own schema."
      fr: "Un analyseur prédéfini tel que `prebuilt-invoice` renvoie les champs d'une facture sans que Proseware ait à écrire son propre schéma."
  - id: s2
    text:
      en: An analyzer applies the same schema to every document that is submitted to it.
      fr: Un analyseur applique le même schéma à chaque document qui lui est soumis.
  - id: s3
    text:
      en: A schema supports only fields that are not nested, so the line items of an invoice are returned as a single text value.
      fr: "Un schéma n'accepte que des champs non imbriqués ; les lignes d'articles d'une facture sont donc renvoyées sous la forme d'une seule valeur de texte."
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: "Prebuilt analyzers cover common scenarios such as invoices and already include their schema; custom analyzers are for needs they do not cover. Once configured, an analyzer applies the same extraction logic and schema consistently to every item. Schemas support structured and nested fields: `Items` can be a collection in which each item has a description, a unit price, a quantity and a line total."
    fr: "Les analyseurs prédéfinis couvrent des scénarios courants comme les factures et incluent déjà leur schéma ; les analyseurs personnalisés servent aux besoins qu'ils ne couvrent pas. Une fois configuré, un analyseur applique de façon cohérente la même logique d'extraction et le même schéma à chaque élément. Les schémas acceptent des champs structurés et imbriqués : `Items` peut être une collection dont chaque élément comporte une description, un prix unitaire, une quantité et un total de ligne."
references:
- title: Extract information from documents
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents"
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"
