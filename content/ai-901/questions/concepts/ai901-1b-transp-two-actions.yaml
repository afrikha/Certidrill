id: ai901-1b-transp-two-actions
objective: "1.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two actions make an AI solution more transparent?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux actions qui rendent une solution d'IA plus transparente ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Encrypt the training data at rest and in transit.", fr: "Chiffrer les données d'entraînement au repos et en transit." } }
    - { id: b, text: { en: "Tell users when the content that they see was generated by AI.", fr: "Indiquer aux utilisateurs quand le contenu affiché a été généré par l'IA." } }
    - { id: c, text: { en: "Appoint an owner who must approve each release of the solution.", fr: "Désigner un responsable qui doit approuver chaque mise en service de la solution." } }
    - { id: d, text: { en: "Document the capabilities and limitations of the solution for its users.", fr: "Documenter les capacités et les limites de la solution pour ses utilisateurs." } }
    - { id: e, text: { en: "Test the solution with users who rely on a screen reader.", fr: "Tester la solution avec des utilisateurs qui se servent d'un lecteur d'écran." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Transparency means making users aware that AI is involved, how the system works and what its limitations are. Disclosing AI-generated content and documenting capabilities and limitations both help users decide how far to trust the solution."
    fr: "La transparence consiste à faire savoir aux utilisateurs que l'IA intervient, comment le système fonctionne et quelles sont ses limites. Signaler le contenu généré par l'IA et documenter les capacités et les limites aident tous deux les utilisateurs à décider dans quelle mesure faire confiance à la solution."
  options:
    a:
      en: "Encryption protects data against unauthorized access: privacy and security."
      fr: "Le chiffrement protège les données contre les accès non autorisés : confidentialité et sécurité."
    c:
      en: "An owner who approves releases is a governance measure: accountability."
      fr: "Un responsable qui approuve les mises en service est une mesure de gouvernance : responsabilité."
    e:
      en: "Testing with users of assistive technologies makes sure nobody is excluded: inclusiveness."
      fr: "Tester avec des utilisateurs de technologies d'assistance garantit que personne n'est exclu : inclusion."
references:
  - title: "Responsible AI for agent design"
    url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
