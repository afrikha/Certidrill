id: ai901-1c-tokens-tpm-dd
objective: "1.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You describe to a colleague how a model deployment in Microsoft Foundry handles its load.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous décrivez à un collègue comment un déploiement de modèle dans Microsoft Foundry gère sa charge.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A [[unit]] is the smallest unit of text that a generative AI model processes.

      The [[limit]] setting of a deployment defines its rate limit.

      When the requests exceed this limit, the deployment is [[state]] and the application receives rate-limit errors.
    fr: |
      La plus petite unité de texte qu'un modèle d'IA générative traite s'appelle [[unit]].

      Le paramètre [[limit]] d'un déploiement définit sa limite de débit.

      Lorsque les requêtes dépassent cette limite, le déploiement est [[state]] et l'application reçoit des erreurs de limite de débit.
  slots:
    - id: unit
      options:
        - { id: prompt, text: { en: "prompt", fr: "une invite" } }
        - { id: token, text: { en: "token", fr: "un jeton" } }
        - { id: endpoint, text: { en: "endpoint", fr: "un point de terminaison" } }
    - id: limit
      options:
        - { id: temp, text: { en: "temperature", fr: "température" } }
        - { id: version, text: { en: "model version", fr: "version du modèle" } }
        - { id: tpm, text: { en: "tokens per minute (TPM)", fr: "jetons par minute (TPM)" } }
        - { id: topp, text: "Top P" }
    - id: state
      options:
        - { id: throttled, text: { en: "throttled", fr: "soumis à une limitation" } }
        - { id: deleted, text: { en: "deleted", fr: "supprimé" } }
        - { id: upgraded, text: { en: "moved to a newer model version", fr: "basculé vers une version plus récente du modèle" } }
answer:
  values: { unit: token, limit: tpm, state: throttled }
explanation:
  correct:
    en: |
      A token is a word, a part of a word, a character or a punctuation mark: the unit in which models count their work. The tokens per minute (TPM) value assigned to a deployment sets its rate limit. A deployment that receives more than its limit allows is throttled, and the application gets rate-limit errors until it sends less.
    fr: |
      Un jeton est un mot, une partie de mot, un caractère ou un signe de ponctuation : l'unité dans laquelle les modèles comptent leur travail. La valeur de jetons par minute (TPM) attribuée à un déploiement fixe sa limite de débit. Un déploiement qui reçoit plus que sa limite ne le permet subit une limitation, et l'application reçoit des erreurs de limite de débit jusqu'à ce qu'elle envoie moins.
  options:
    prompt: { en: "A prompt is the whole input sent to the model; it is made of many tokens.", fr: "Une invite est l'entrée complète envoyée au modèle ; elle est composée de nombreux jetons." }
    temp: { en: "Temperature controls the randomness of the output, not the rate limit.", fr: "La température contrôle le caractère aléatoire de la sortie, pas la limite de débit." }
    deleted: { en: "Exceeding the rate limit never deletes a deployment.", fr: "Dépasser la limite de débit ne supprime jamais un déploiement." }
references:
  - title: Generative AI models
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
