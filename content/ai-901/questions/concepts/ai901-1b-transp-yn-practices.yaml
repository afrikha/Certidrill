id: ai901-1b-transp-yn-practices
objective: "1.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    An organization is defining the practices that it will follow to make its AI systems transparent.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une organisation définit les pratiques qu'elle suivra pour rendre ses systèmes d'IA transparents.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Once the behavior of an AI system has been explained to employees, they no longer need to be held accountable for the decisions that they base on its results."
        fr: "Une fois le comportement d'un système d'IA expliqué aux employés, il n'est plus nécessaire de les tenir responsables des décisions qu'ils fondent sur ses résultats."
    - id: s2
      text:
        en: "Sharing the key characteristics of a dataset helps developers judge whether the dataset is appropriate for their use case."
        fr: "Partager les principales caractéristiques d'un jeu de données aide les développeurs à juger si ce jeu de données convient à leur cas d'usage."
    - id: s3
      text:
        en: "Using a simpler model can make the behavior of an AI system easier to explain."
        fr: "Utiliser un modèle plus simple peut rendre le comportement d'un système d'IA plus facile à expliquer."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Microsoft's guidance for transparency is to share the key characteristics of datasets, to improve intelligibility by using simpler models and generating intelligible explanations, and to train employees to interpret AI output while keeping them accountable for the consequential decisions based on it. Transparency therefore works together with accountability; it doesn't replace it."
    fr: "Pour la transparence, Microsoft recommande de partager les principales caractéristiques des jeux de données, d'améliorer l'intelligibilité en utilisant des modèles plus simples et en générant des explications intelligibles, et de former les employés à interpréter les sorties de l'IA tout en les gardant responsables des décisions importantes qui en découlent. La transparence va donc de pair avec la responsabilité ; elle ne la remplace pas."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
