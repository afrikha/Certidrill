id: ai901-1d-image-shelf-fields
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys takes a photo of each shelf in its stores. For every photo, the company wants the products detected, the number of items and the number of empty slots as structured data.

    Which technique should Tailspin Toys use?
  fr: |
    Tailspin Toys prend une photo de chaque rayon de ses magasins. Pour chaque photo, l'entreprise veut obtenir les produits détectés, le nombre d'articles et le nombre d'emplacements vides sous forme de données structurées.

    Quelle technique faut-il utiliser ?
body:
  options:
  - id: a
    text:
      en: Speech recognition with speaker diarization
      fr: La reconnaissance vocale avec diarisation des locuteurs
  - id: b
    text:
      en: Image analysis with a schema whose fields are filled in from what the picture shows
      fr: "L'analyse d'images avec un schéma dont les champs sont remplis d'après ce que montre l'image"
  - id: c
    text:
      en: Text-to-image generation from a description of the shelf
      fr: "La génération d'images à partir d'une description en texte du rayon"
  - id: d
    text:
      en: Optical character recognition (OCR) of the price labels of the shelf
      fr: La reconnaissance optique de caractères (OCR) des étiquettes de prix du rayon
answer:
  optionId: b
explanation:
  correct:
    en: To extract information from an image, you define a schema of fields, with their descriptions and types, and the service returns structured data based on what the picture shows. Shelf analysis, which detects and counts retail products, is one of the scenarios that Microsoft Learn gives for image analyzers.
    fr: "Pour extraire des informations d'une image, vous définissez un schéma de champs, avec leur description et leur type, et le service renvoie des données structurées d'après ce que montre l'image. L'analyse de rayons, qui détecte et compte des produits, fait partie des scénarios que Microsoft Learn cite pour les analyseurs d'images."
  options:
    a:
      en: Speech recognition and diarization process audio, not photos.
      fr: "La reconnaissance vocale et la diarisation traitent de l'audio, pas des photos."
    c:
      en: "Text-to-image generation creates a new picture; it extracts nothing from the photos taken in the stores."
      fr: "La génération d'images à partir de texte crée une nouvelle image ; elle n'extrait rien des photos prises dans les magasins."
    d:
      en: "OCR returns the text that is printed on the labels; it does not count the products or the empty slots."
      fr: "L'OCR renvoie le texte imprimé sur les étiquettes ; il ne compte ni les produits ni les emplacements vides."
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview"
