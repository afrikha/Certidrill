id: ai901-1b-account-diagnosis
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A clinic uses an AI system that proposes diagnoses from medical images. The clinic decides that a doctor must confirm every diagnosis, so that the system is never the final authority on a decision that affects a patient.

    Which responsible AI principle does this decision apply?
  fr: |
    Une clinique utilise un système d'IA qui propose des diagnostics à partir d'images médicales. La clinique décide qu'un médecin doit confirmer chaque diagnostic, afin que le système ne soit jamais l'autorité finale sur une décision qui touche un patient.

    Quel principe de l'IA responsable cette décision applique-t-elle ?
body:
  options:
    - { id: a, text: { en: "Accountability", fr: "Responsabilité" } }
    - { id: b, text: { en: "Fairness", fr: "Impartialité" } }
    - { id: c, text: { en: "Privacy and security", fr: "Confidentialité et sécurité" } }
    - { id: d, text: { en: "Transparency", fr: "Transparence" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Accountability means that people answer for how an AI system operates. Its norms ensure that an AI system isn't the final authority on a decision that affects people's lives and that humans keep meaningful control, which is what the doctor's confirmation provides."
    fr: "La responsabilité signifie que des personnes répondent du fonctionnement d'un système d'IA. Ses normes garantissent qu'un système d'IA n'est pas l'autorité finale sur une décision qui touche la vie des gens et que les humains gardent un contrôle significatif : c'est ce qu'apporte la confirmation du médecin."
  options:
    b:
      en: "Fairness is about giving similar patients similar results, not about who makes the final decision."
      fr: "L'impartialité consiste à donner des résultats similaires à des patients similaires, pas à déterminer qui prend la décision finale."
    c:
      en: "Privacy and security is about protecting the patients' data and controlling access to it."
      fr: "La confidentialité et la sécurité portent sur la protection des données des patients et le contrôle de leur accès."
    d:
      en: "Transparency would be about explaining how the system reaches a diagnosis, not about a human confirming it."
      fr: "La transparence consisterait à expliquer comment le système parvient à un diagnostic, pas à le faire confirmer par un humain."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai
