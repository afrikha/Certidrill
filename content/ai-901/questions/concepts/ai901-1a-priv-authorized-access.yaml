id: ai901-1a-priv-authorized-access
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retailer makes sure that the data and the models of its AI solution can be reached only by authorized employees and services.

    Which responsible AI principle does this measure support?
  fr: |
    Un distributeur s'assure que les données et les modèles de sa solution d'IA ne sont accessibles qu'aux employés et aux services autorisés.

    Quel principe de l'IA responsable cette mesure sert-elle ?
body:
  options:
    - id: rel
      text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" }
    - id: acc
      text: { en: "Accountability", fr: "Responsabilité" }
    - id: incl
      text: { en: "Inclusiveness", fr: "Inclusion" }
    - id: priv
      text: { en: "Privacy and security", fr: "Confidentialité et sécurité" }
answer: { optionId: priv }
explanation:
  correct:
    en: "The privacy and security principle states that data and models are protected and that the right to privacy is preserved. Limiting access to authorized people and services protects the solution against bad actors."
    fr: "Le principe de confidentialité et de sécurité indique que les données et les modèles sont protégés et que le droit à la vie privée est préservé. Limiter l'accès aux personnes et aux services autorisés protège la solution contre les acteurs malveillants."
  options:
    rel: { en: "Reliability and safety is about the behavior of the system: operating as designed and responding safely to unexpected conditions. Protection against unauthorized access is security.", fr: "La fiabilité et la sécurité portent sur le comportement du système : fonctionner comme prévu et réagir sans danger aux conditions inattendues. La protection contre les accès non autorisés relève de la sécurité au sens de « security »." }
    acc: { en: "Accountability is about the people who answer for the system and oversee it.", fr: "La responsabilité concerne les personnes qui répondent du système et le supervisent." }
    incl: { en: "Inclusiveness is about making the system usable by everyone, not about restricting access to data.", fr: "L'inclusion consiste à rendre le système utilisable par tous, pas à restreindre l'accès aux données." }
references:
  - title: "Artificial Intelligence overview"
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
