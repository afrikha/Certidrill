id: ai901-1c-sp-match-drag
objective: "1.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans several features that use Azure Speech in Foundry Tools.

    Which capability does each feature need? To answer, drag the appropriate capabilities to the correct features. Each capability may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit plusieurs fonctions qui utilisent Azure Speech dans Foundry Tools.

    De quelle fonctionnalité chaque fonction a-t-elle besoin ? Pour répondre, faites glisser les fonctionnalités appropriées vers les fonctions correspondantes. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: rec, text: { en: "Speech recognition", fr: "Reconnaissance vocale" } }
    - { id: syn, text: { en: "Speech synthesis", fr: "Synthèse vocale" } }
    - { id: tr, text: { en: "Speech translation", fr: "Traduction vocale" } }
    - { id: lid, text: { en: "Language identification", fr: "Identification de la langue" } }
  targets:
    - id: t1
      text: { en: "Produce the text transcript of a recorded podcast", fr: "Produire la transcription en texte d'un podcast enregistré" } 
    - id: t2
      text: { en: "Create an audio file from the text of an e-book", fr: "Créer un fichier audio à partir du texte d'un livre numérique" }
    - id: t3
      text: { en: "Let users control a device with voice commands", fr: "Permettre aux utilisateurs de piloter un appareil par des commandes vocales" }
    - id: t4
      text: { en: "Display English subtitles while a speaker talks in German", fr: "Afficher des sous-titres en anglais pendant qu'un orateur parle en allemand" }
answer:
  mapping: { t1: rec, t2: syn, t3: rec, t4: tr }
explanation:
  correct:
    en: |
      A transcript and voice commands both start from spoken audio that must become text or data: speech recognition. An audio file created from text is speech synthesis. Subtitles in a language other than the one spoken require speech translation, which returns translated text from spoken audio. Language identification only tells which language is spoken.
    fr: |
      Une transcription et des commandes vocales partent toutes deux d'un audio parlé qui doit devenir du texte ou des données : reconnaissance vocale. Un fichier audio créé à partir de texte relève de la synthèse vocale. Des sous-titres dans une autre langue que celle parlée demandent la traduction vocale, qui renvoie du texte traduit à partir d'audio parlé. L'identification de la langue indique seulement quelle langue est parlée.
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/1-introduction
  - title: What Is Azure Speech?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview
