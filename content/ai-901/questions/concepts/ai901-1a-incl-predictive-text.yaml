id: ai901-1a-incl-predictive-text
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A messaging application uses AI to suggest the next words as a user types, so that people who have limited mobility can write with fewer keystrokes.

    Which responsible AI principle does this feature support?
  fr: |
    Une application de messagerie utilise l'IA pour suggérer les mots suivants pendant la saisie, afin que les personnes à mobilité réduite puissent écrire en appuyant sur moins de touches.

    Quel principe de l'IA responsable cette fonctionnalité sert-elle ?
body:
  options:
    - id: transp
      text: { en: "Transparency", fr: "Transparence" }
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
    - id: incl
      text: { en: "Inclusiveness", fr: "Inclusion" }
    - id: rel
      text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" }
answer: { optionId: incl }
explanation:
  correct:
    en: "Inclusiveness means that technology empowers every person and reflects the full spectrum of human experiences and needs. Predictive text, like real-time captions and image recognition, is one of the AI capabilities that already help people with disabilities."
    fr: "L'inclusion signifie que la technologie donne des moyens d'agir à chaque personne et reflète toute la diversité des expériences et des besoins humains. Le texte prédictif, comme les sous-titres en temps réel et la reconnaissance d'images, fait partie des fonctionnalités d'IA qui aident déjà les personnes en situation de handicap."
  options:
    transp: { en: "Transparency is about people understanding how the system works and what its limits are.", fr: "La transparence consiste à permettre aux personnes de comprendre comment le système fonctionne et quelles sont ses limites." }
    fair: { en: "Fairness is about giving comparable results to comparable people; this feature removes a barrier to using the application.", fr: "L'impartialité consiste à donner des résultats comparables à des personnes comparables ; cette fonctionnalité supprime un obstacle à l'utilisation de l'application." }
    rel: { en: "Reliability and safety is about operating as designed and responding safely to unexpected conditions.", fr: "La fiabilité et la sécurité consistent à fonctionner comme prévu et à réagir sans danger aux conditions inattendues." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
