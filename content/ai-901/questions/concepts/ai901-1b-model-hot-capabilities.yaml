id: ai901-1b-model-hot-capabilities
objective: "1.2.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    A Foundry project contains five model deployments. The input that each model accepts and the output that it generates are shown in the following table.

    Answer each prompt by selecting the appropriate deployment.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un projet Foundry contient cinq déploiements de modèles. L'entrée que chaque modèle accepte et la sortie qu'il génère figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le déploiement approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The deployment to use to explain a chart that a user uploads as a screenshot", fr: "Le déploiement à utiliser pour expliquer un graphique qu'un utilisateur charge sous forme de capture d'écran" }
    - id: p2
      text: { en: "The deployment to use to find the documents whose meaning is closest to a user's question", fr: "Le déploiement à utiliser pour trouver les documents dont le sens est le plus proche de la question d'un utilisateur" }
  grid:
    header: [{ en: "Deployment", fr: "Déploiement" }, { en: "Accepted input", fr: "Entrée acceptée" }, { en: "Generated output", fr: "Sortie générée" }]
    rows:
      - [{ text: "Model1", area: m1 }, { text: { en: "Text", fr: "Texte" } }, { text: { en: "Text", fr: "Texte" } }]
      - [{ text: "Model2", area: m2 }, { text: { en: "Text, images", fr: "Texte, images" } }, { text: { en: "Images", fr: "Images" } }]
      - [{ text: "Model3", area: m3 }, { text: { en: "Text", fr: "Texte" } }, { text: { en: "Vectors", fr: "Vecteurs" } }]
      - [{ text: "Model4", area: m4 }, { text: { en: "Text, images", fr: "Texte, images" } }, { text: { en: "Text", fr: "Texte" } }]
      - [{ text: "Model5", area: m5 }, { text: { en: "Text, images", fr: "Texte, images" } }, { text: { en: "Video", fr: "Vidéo" } }]
answer:
  values: { p1: m4, p2: m3 }
explanation:
  correct:
    en: "Explaining a screenshot requires a multimodal model that accepts an image with the text of the prompt and answers in text: Model4. Finding documents by meaning requires an embedding model, which returns vectors that can be compared: Model3."
    fr: "Expliquer une capture d'écran nécessite un modèle multimodal qui accepte une image avec le texte de l'invite et répond en texte : Model4. Trouver des documents par le sens nécessite un modèle d'embedding, qui renvoie des vecteurs comparables : Model3."
  options:
    m1:
      en: "Model1 accepts only text, so it can't read the screenshot, and it returns text rather than vectors."
      fr: "Model1 n'accepte que du texte : il ne peut donc pas lire la capture d'écran, et il renvoie du texte plutôt que des vecteurs."
    m2:
      en: "Model2 accepts images but generates images: it is an image generation model."
      fr: "Model2 accepte des images mais génère des images : c'est un modèle de génération d'images."
    m5:
      en: "Model5 generates video: it is a video generation model."
      fr: "Model5 génère de la vidéo : c'est un modèle de génération de vidéos."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
