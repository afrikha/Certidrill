id: ai901-1b-gen-yn-transformer
objective: "1.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When the next token is predicted, attention gives the same weight to every token of the sequence."
        fr: "Lors de la prédiction du jeton suivant, l'attention donne le même poids à tous les jetons de la séquence."
    - id: s2
      text:
        en: "When the decoder predicts a token, its attention layers consider only the tokens that precede that token."
        fr: "Quand le décodeur prédit un jeton, ses couches d'attention ne prennent en compte que les jetons qui précèdent ce jeton."
    - id: s3
      text:
        en: "The initial vectors assigned to tokens are transformed into embeddings that reflect how the tokens appear in the training data."
        fr: "Les vecteurs initiaux attribués aux jetons sont transformés en embeddings qui reflètent la façon dont les jetons apparaissent dans les données d'entraînement."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Attention weighs the tokens of a sequence by their influence: to predict \"bark\" after \"I heard a dog\", \"heard\" and \"dog\" count more than \"I\" or \"a\". The decoder only takes into account the tokens that precede the one being predicted. Token vectors start with initial values and are transformed during training into embeddings that encode the context in which the tokens appear."
    fr: "L'attention pondère les jetons d'une séquence selon leur influence : pour prédire « bark » après « I heard a dog », « heard » et « dog » comptent plus que « I » ou « a ». Le décodeur ne tient compte que des jetons qui précèdent celui à prédire. Les vecteurs des jetons partent de valeurs initiales et sont transformés pendant l'entraînement en embeddings qui encodent le contexte dans lequel les jetons apparaissent."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
