id: ai901-1a-fair-dd-bias-stages
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Bias can be introduced into an AI system [[when]]. Identifying and removing bias supports the [[principle]] principle.
    fr: |
      Un biais peut être introduit dans un système d'IA [[when]]. Identifier et supprimer les biais sert le principe [[principle]].
  slots:
    - id: when
      options:
        - { id: collect, text: { en: "only while the data is collected", fr: "uniquement pendant la collecte des données" } }
        - { id: model, text: { en: "only while the model is built", fr: "uniquement pendant la construction du modèle" } }
        - { id: all, text: { en: "at every stage, from collection to operation", fr: "à chaque étape, de la collecte à l'exploitation" } }
    - id: principle
      options:
        - { id: incl, text: { en: "inclusiveness", fr: "d'inclusion" } }
        - { id: fair, text: { en: "fairness", fr: "d'impartialité" } }
        - { id: acc, text: { en: "accountability", fr: "de responsabilité" } }
answer:
  values: { when: all, principle: fair }
explanation:
  correct:
    en: "Bias can be introduced at every stage, from data collection to modeling to operation, so a check that is limited to one stage isn't enough. Identifying bias in datasets and in algorithms, and removing it, is part of the fairness principle."
    fr: "Un biais peut être introduit à chaque étape, de la collecte des données à la modélisation puis à l'exploitation : un contrôle limité à une seule étape ne suffit donc pas. Identifier les biais dans les jeux de données et dans les algorithmes, puis les supprimer, fait partie du principe d'impartialité."
  options:
    incl: { en: "Inclusiveness is about making sure that nobody is excluded from using the system.", fr: "L'inclusion consiste à s'assurer que personne n'est exclu de l'utilisation du système." }
    acc: { en: "Accountability is about the people who answer for how the system operates.", fr: "La responsabilité concerne les personnes qui répondent du fonctionnement du système." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
