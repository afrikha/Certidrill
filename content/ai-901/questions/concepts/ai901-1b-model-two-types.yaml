id: ai901-1b-model-two-types
objective: "1.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso is building a support application that has the following requirements:

    - Answer questions about the photos that customers upload.
    - Find past support tickets whose meaning is close to a new ticket.

    Which two types of models should you deploy? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée une application de support qui présente les exigences suivantes :

    - Répondre aux questions sur les photos que les clients chargent.
    - Trouver les anciens tickets de support dont le sens est proche de celui d'un nouveau ticket.

    Quels sont les deux types de modèles à déployer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An image generation model", fr: "Un modèle de génération d'images" } }
    - { id: b, text: { en: "An embedding model", fr: "Un modèle d'embedding" } }
    - { id: c, text: { en: "A video generation model", fr: "Un modèle de génération de vidéos" } }
    - { id: d, text: { en: "A multimodal chat model", fr: "Un modèle de conversation multimodal" } }
    - { id: e, text: { en: "A text-only reasoning model", fr: "Un modèle de raisonnement acceptant uniquement du texte" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A multimodal chat model accepts text and images in the same prompt, so it can answer questions about a photo. An embedding model converts each ticket into a vector, and comparing vectors finds the tickets whose meaning is closest."
    fr: "Un modèle de conversation multimodal accepte du texte et des images dans la même invite : il peut donc répondre à des questions sur une photo. Un modèle d'embedding convertit chaque ticket en vecteur, et la comparaison des vecteurs permet de trouver les tickets dont le sens est le plus proche."
  options:
    a:
      en: "An image generation model creates new images from a description; it doesn't interpret an existing photo."
      fr: "Un modèle de génération d'images crée de nouvelles images à partir d'une description ; il n'interprète pas une photo existante."
    c:
      en: "A video generation model creates video clips, which no requirement asks for."
      fr: "Un modèle de génération de vidéos crée des clips vidéo, ce qu'aucune exigence ne demande."
    e:
      en: "A text-only model can't read the uploaded photos, and it doesn't produce vectors for a similarity search."
      fr: "Un modèle acceptant uniquement du texte ne peut pas lire les photos chargées, et il ne produit pas de vecteurs pour une recherche par similarité."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
