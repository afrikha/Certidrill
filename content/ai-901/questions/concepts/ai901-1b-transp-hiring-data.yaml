id: ai901-1b-transp-hiring-data
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware uses an AI system to screen job applications.

    Which action applies the transparency principle?
  fr: |
    Litware utilise un système d'IA pour présélectionner des candidatures.

    Quelle action applique le principe de transparence ?
body:
  options:
    - { id: a, text: { en: "Publish the purpose of the system and the key characteristics of its training data.", fr: "Publier la finalité du système et les principales caractéristiques de ses données d'entraînement." } }
    - { id: b, text: { en: "Create a review board that can overrule the system and stop its use if necessary.", fr: "Créer un conseil d'examen qui peut passer outre le système et en arrêter l'utilisation si nécessaire." } }
    - { id: c, text: { en: "Compare the selection rates of the system for men and for women who apply.", fr: "Comparer les taux de sélection du système pour les hommes et pour les femmes qui postulent." } }
    - { id: d, text: { en: "Test the system with applications in unexpected formats before each release.", fr: "Tester le système avec des candidatures de formats inattendus avant chaque mise en service." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Transparency is about helping people understand a system: being open about why and how AI is used and sharing the key characteristics of the data. Publishing this information lets candidates and recruiters judge how the results were produced."
    fr: "La transparence consiste à aider les personnes à comprendre un système : dire ouvertement pourquoi et comment l'IA est utilisée et partager les principales caractéristiques des données. Publier ces informations permet aux candidats et aux recruteurs de juger comment les résultats ont été produits."
  options:
    b:
      en: "A review board provides human oversight and governance: accountability."
      fr: "Un conseil d'examen assure une supervision humaine et une gouvernance : responsabilité."
    c:
      en: "Comparing outcomes between groups looks for bias: fairness."
      fr: "Comparer les résultats entre groupes revient à rechercher un biais : impartialité."
    d:
      en: "Testing with unexpected input checks that the system behaves as designed: reliability and safety."
      fr: "Tester avec des entrées inattendues vérifie que le système se comporte comme prévu : fiabilité et sécurité."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
