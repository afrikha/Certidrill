id: ai901-1b-gen-embedding-close
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a language model, the embeddings of the tokens **dog** and **puppy** point in similar directions.

    What does this indicate?
  fr: |
    Dans un modèle de langage, les embeddings des jetons **dog** et **puppy** pointent dans des directions similaires.

    Qu'est-ce que cela indique ?
body:
  options:
    - { id: a, text: { en: "The tokens have consecutive numeric identifiers in the vocabulary.", fr: "Les jetons ont des identificateurs numériques consécutifs dans le vocabulaire." } }
    - { id: b, text: { en: "The tokens appear at the same position in the prompt.", fr: "Les jetons apparaissent à la même position dans l'invite." } }
    - { id: c, text: { en: "The tokens are used in similar contexts, so their meanings are related.", fr: "Les jetons sont employés dans des contextes similaires : leurs sens sont proches." } }
    - { id: d, text: { en: "The tokens are made of the same number of characters.", fr: "Les jetons comptent le même nombre de caractères." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An embedding is a vector whose elements encode the linguistic and semantic attributes of a token, learned from how the token appears in the training data. Tokens that are used in similar contexts have vectors that point in similar directions, so dog is close to puppy and far from skateboard."
    fr: "Un embedding est un vecteur dont les éléments encodent les attributs linguistiques et sémantiques d'un jeton, appris à partir de la façon dont le jeton apparaît dans les données d'entraînement. Les jetons employés dans des contextes similaires ont des vecteurs de directions voisines : dog est proche de puppy et loin de skateboard."
  options:
    a:
      en: "Token identifiers are assigned when the text is split into tokens and carry no meaning."
      fr: "Les identificateurs de jetons sont attribués lors du découpage du texte et ne portent aucun sens."
    b:
      en: "The position of a token in a sequence is recorded by the positional encoding, not by the direction of its embedding."
      fr: "La position d'un jeton dans une séquence est indiquée par l'encodage positionnel, pas par la direction de son embedding."
    d:
      en: "Embeddings encode meaning, not the spelling or the length of a token."
      fr: "Les embeddings encodent le sens, pas l'orthographe ni la longueur d'un jeton."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
