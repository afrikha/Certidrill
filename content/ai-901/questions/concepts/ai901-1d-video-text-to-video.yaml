id: ai901-1d-video-text-to-video
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys wants to turn a text prompt into a short video clip for a storyboard.

    Which model should Tailspin Toys use?
  fr: |
    Tailspin Toys veut transformer une invite en texte en un court clip vidéo pour un storyboard.

    Quel modèle faut-il utiliser ?
body:
  options:
  - id: a
    text: FLUX
  - id: b
    text: Sora
  - id: c
    text: GPT-Image-1
  - id: d
    text: GPT-4.1
answer:
  optionId: b
explanation:
  correct:
    en: "Sora models are the video-generation models of Microsoft Foundry: they create short video clips from a text prompt and can also start from an image."
    fr: "Les modèles Sora sont les modèles de génération de vidéos de Microsoft Foundry : ils créent de courts clips vidéo à partir d'une invite en texte et peuvent aussi partir d'une image."
  options:
    a:
      en: "FLUX is a family of image-generation models; it produces still images."
      fr: "FLUX est une famille de modèles de génération d'images ; elle produit des images fixes."
    c:
      en: GPT-Image-1 generates and edits still images.
      fr: GPT-Image-1 génère et modifie des images fixes.
    d:
      en: "GPT-4.1 is a multimodal model that understands text and images; it does not generate video."
      fr: "GPT-4.1 est un modèle multimodal qui comprend le texte et les images ; il ne génère pas de vidéo."
references:
- title: Video generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation"
