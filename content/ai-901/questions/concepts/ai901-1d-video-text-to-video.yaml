id: ai901-1d-video-text-to-video
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys wants to type a short description of each scene of a storyboard and receive a still picture of that scene.

    Which model should Tailspin Toys use?
  fr: |
    Tailspin Toys veut saisir une courte description de chaque scène d'un storyboard et recevoir une image fixe de cette scène.

    Quel modèle faut-il utiliser ?
body:
  options:
  - id: a
    text: GPT-4.1
  - id: b
    text: FLUX
  - id: c
    text: text-embedding-3-small
  - id: d
    text: Sora 2
answer:
  optionId: b
explanation:
  correct:
    en: "FLUX is a family of image-generation models from Black Forest Labs, available in Microsoft Foundry: it creates still images from text prompts. Turning a written description into a picture is text-to-image generation."
    fr: "FLUX est une famille de modèles de génération d'images de Black Forest Labs, disponible dans Microsoft Foundry : elle crée des images fixes à partir d'invites en texte. Transformer une description écrite en image relève de la génération d'images à partir de texte."
  options:
    a:
      en: "GPT-4.1 is a multimodal model that understands text and images and answers in text; it doesn't create pictures."
      fr: "GPT-4.1 est un modèle multimodal qui comprend le texte et les images et répond en texte ; il ne crée pas d'images."
    c:
      en: "text-embedding-3-small converts text into vectors for similarity comparisons; it doesn't generate images."
      fr: "text-embedding-3-small convertit du texte en vecteurs pour des comparaisons de similarité ; il ne génère pas d'images."
    d:
      en: "Sora 2 is a video-generation model, currently in preview; it creates video clips, not still pictures."
      fr: "Sora 2 est un modèle de génération de vidéos, actuellement en préversion ; il crée des clips vidéo, pas des images fixes."
references:
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
