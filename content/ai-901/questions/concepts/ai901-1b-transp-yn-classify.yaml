id: ai901-1b-transp-yn-classify
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A committee that must approve an AI system before its release is an application of the transparency principle."
        fr: "Un comité qui doit approuver un système d'IA avant sa mise en service est une application du principe de transparence."
    - id: s2
      text:
        en: "Explaining to a candidate why an AI system rejected their application is an application of the transparency principle."
        fr: "Expliquer à un candidat pourquoi un système d'IA a rejeté sa candidature est une application du principe de transparence."
    - id: s3
      text:
        en: "Adding text captions to the answers of a speech-based agent is an application of the transparency principle."
        fr: "Ajouter des sous-titres aux réponses d'un agent vocal est une application du principe de transparence."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Transparency is about people understanding how a system reaches its results, so explaining a rejection applies it. An approval committee is human oversight and governance, which is accountability. Captions keep a speech-based agent usable by people with hearing impairments, which is inclusiveness."
    fr: "La transparence concerne la compréhension de la façon dont un système parvient à ses résultats : expliquer un rejet l'applique donc. Un comité d'approbation relève de la supervision humaine et de la gouvernance, c'est-à-dire de la responsabilité. Les sous-titres gardent un agent vocal utilisable par les personnes malentendantes, ce qui relève de l'inclusion."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
