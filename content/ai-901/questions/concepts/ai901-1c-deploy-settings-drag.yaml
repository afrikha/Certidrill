id: ai901-1c-deploy-settings-drag
objective: "1.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You deploy a model in the Foundry portal and review the settings of the deployment.

    Which setting matches each description? To answer, drag the appropriate settings to the correct descriptions. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez un modèle dans le portail Foundry et vous passez en revue les paramètres du déploiement.

    Quel paramètre correspond à chaque description ? Pour répondre, faites glisser les paramètres appropriés vers les descriptions correspondantes. Chaque paramètre peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: name, text: { en: "Deployment name", fr: "Nom du déploiement" } }
    - { id: version, text: { en: "Model version", fr: "Version du modèle" } }
    - { id: dtype, text: { en: "Deployment type", fr: "Type de déploiement" } }
    - { id: tpm, text: { en: "Tokens per minute (TPM)", fr: "Jetons par minute (TPM)" } }
    - { id: temp, text: { en: "Temperature", fr: "Température" } }
  targets:
    - id: t1
      text: { en: "Determines where inference is processed and how the deployment is billed", fr: "Détermine où l'inférence est traitée et comment le déploiement est facturé" }
    - id: t2
      text: { en: "Defines the rate limit of the deployment", fr: "Définit la limite de débit du déploiement" }
    - id: t3
      text: { en: "Selects which release of the model the deployment runs", fr: "Sélectionne l'édition du modèle que le déploiement exécute" }
answer:
  mapping: { t1: dtype, t2: tpm, t3: version }
explanation:
  correct:
    en: |
      The deployment type (for example Global Standard, Data Zone Standard or a provisioned type) decides where requests are processed and how you pay. The tokens per minute (TPM) value is the rate limit of the deployment. The model version fixes which release of the model answers. The deployment name only identifies the deployment in requests, and temperature is a parameter of the requests, not a deployment setting.
    fr: |
      Le type de déploiement (par exemple Global Standard, Data Zone Standard ou un type approvisionné) décide où les requêtes sont traitées et comment vous payez. La valeur de jetons par minute (TPM) est la limite de débit du déploiement. La version du modèle fixe l'édition du modèle qui répond. Le nom du déploiement identifie seulement le déploiement dans les requêtes, et la température est un paramètre des requêtes, pas un paramètre du déploiement.
references:
  - title: Generative AI models
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
