id: ai901-1d-multi-vision-tasks
objective: "1.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys deploys a vision-enabled multimodal model in Microsoft Foundry.

    Which two tasks can the model perform?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys déploie un modèle multimodal compatible avec la vision dans Microsoft Foundry.

    Quelles sont les deux tâches que le modèle peut réaliser ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Describe the contents of a photo in natural language
      fr: "Décrire le contenu d'une photo en langage naturel"
  - id: b
    text:
      en: Generate a short video clip from a text prompt
      fr: "Générer un court clip vidéo à partir d'une invite en texte"
  - id: c
    text:
      en: Explain the trend that a chart in a screenshot shows
      fr: "Expliquer la tendance que montre un graphique dans une capture d'écran"
  - id: d
    text:
      en: Create a logo image from a text description
      fr: "Créer l'image d'un logo à partir d'une description en texte"
answer:
  optionIds:
  - a
  - c
explanation:
  correct:
    en: "Vision-enabled models take an image and a text instruction and return text: they describe images, answer questions about them and extract meaning from charts, screenshots, documents and photos. Creating visual content is the job of generative image and video models."
    fr: "Les modèles compatibles avec la vision prennent une image et une instruction en texte, et renvoient du texte : ils décrivent des images, répondent à des questions à leur sujet et extraient le sens de graphiques, de captures d'écran, de documents et de photos. La création de contenu visuel revient aux modèles génératifs d'images et de vidéos."
  options:
    b:
      en: Video generation requires a video-generation model such as Sora.
      fr: La génération de vidéos nécessite un modèle de génération de vidéos tel que Sora.
    d:
      en: Creating an image from a description requires an image-generation model such as GPT-Image-1.5.
      fr: "Créer une image à partir d'une description nécessite un modèle de génération d'images tel que GPT-Image-1.5."
references:
- title: Multimodal models for image analysis
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models"
