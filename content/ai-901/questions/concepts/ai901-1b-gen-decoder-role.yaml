id: ai901-1b-gen-decoder-role
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a transformer model, which component uses embeddings to predict the next most probable token of a sequence that starts with a prompt?
  fr: |
    Dans un modèle transformer, quel composant utilise les embeddings pour prédire le jeton suivant le plus probable d'une séquence qui commence par une invite ?
body:
  options:
    - { id: a, text: { en: "The tokenization step", fr: "L'étape de tokenisation" } }
    - { id: b, text: { en: "The encoder block", fr: "Le bloc encodeur" } }
    - { id: c, text: { en: "The positional encoding", fr: "L'encodage positionnel" } }
    - { id: d, text: { en: "The decoder block", fr: "Le bloc décodeur" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A transformer has two blocks. The encoder creates the embeddings by using attention, and the decoder uses those embeddings to predict the next most probable token of a sequence that starts with a prompt."
    fr: "Un transformer comprend deux blocs. L'encodeur crée les embeddings à l'aide de l'attention, et le décodeur utilise ces embeddings pour prédire le jeton suivant le plus probable d'une séquence qui commence par une invite."
  options:
    a:
      en: "Tokenization only splits the text into tokens and assigns their identifiers."
      fr: "La tokenisation se limite à découper le texte en jetons et à leur attribuer des identificateurs."
    b:
      en: "The encoder block creates the embeddings; it doesn't generate the completion."
      fr: "Le bloc encodeur crée les embeddings ; il ne génère pas la complétion."
    c:
      en: "The positional encoding records where each token appears in the sequence."
      fr: "L'encodage positionnel indique où chaque jeton apparaît dans la séquence."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
