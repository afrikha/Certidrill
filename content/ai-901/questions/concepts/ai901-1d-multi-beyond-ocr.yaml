id: ai901-1d-multi-beyond-ocr
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses basic OCR to process scanned order forms. Adatum plans to replace it with schema-based extraction by an analyzer.

    Which two capabilities does schema-based extraction add to basic OCR?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise un OCR de base pour traiter des bons de commande numérisés. Adatum prévoit de le remplacer par une extraction fondée sur un schéma, réalisée par un analyseur.

    Quelles sont les deux fonctionnalités que l'extraction fondée sur un schéma ajoute à l'OCR de base ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Converting the printed characters of a scanned page into digital text
      fr: "Convertir les caractères imprimés d'une page numérisée en texte numérique"
  - id: b
    text:
      en: Returning each value under the name of the field that it belongs to
      fr: Renvoyer chaque valeur sous le nom du champ auquel elle appartient
  - id: c
    text:
      en: Converting the extracted text of a form into spoken audio
      fr: "Convertir le texte extrait d'un formulaire en audio parlé"
  - id: d
    text:
      en: Returning nested structures, such as line items that each have a quantity and a price
      fr: "Renvoyer des structures imbriquées, comme des lignes d'articles ayant chacune une quantité et un prix"
  - id: e
    text:
      en: Creating a new image of a form from a text description
      fr: "Créer une nouvelle image d'un formulaire à partir d'une description en texte"
answer:
  optionIds:
  - b
  - d
explanation:
  correct:
    en: Basic OCR recognizes text but does not understand its meaning or the relationships between words. A schema lists the fields to extract and their structure, so the analyzer returns named values and can represent relationships, for example a collection of line items in which each item has its own quantity and price.
    fr: "L'OCR de base reconnaît le texte, mais n'en comprend ni le sens ni les relations entre les mots. Un schéma liste les champs à extraire et leur structure ; l'analyseur renvoie donc des valeurs nommées et peut représenter des relations, par exemple une collection de lignes d'articles dont chacune a sa quantité et son prix."
  options:
    a:
      en: Converting printed characters into digital text is what basic OCR already does.
      fr: "Convertir des caractères imprimés en texte numérique, c'est ce que fait déjà l'OCR de base."
    c:
      en: Converting text into spoken audio is speech synthesis, not information extraction.
      fr: "Convertir du texte en audio parlé relève de la synthèse vocale, pas de l'extraction d'informations."
    e:
      en: Creating an image from a description is image generation, not information extraction.
      fr: "Créer une image à partir d'une description relève de la génération d'images, pas de l'extraction d'informations."
references:
- title: Extract information from documents
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents"
