id: ai901-1b-account-two-practices
objective: "1.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two practices apply the accountability principle of responsible AI?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux pratiques qui appliquent le principe de responsabilité de l'IA responsable ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Make sure that a person, not the AI system, has the final say on decisions that affect people's lives.", fr: "Faire en sorte qu'une personne, et non le système d'IA, ait le dernier mot sur les décisions qui touchent la vie des gens." } }
    - { id: b, text: { en: "Publish a description of the data that was used to train the AI system.", fr: "Publier une description des données qui ont servi à entraîner le système d'IA." } }
    - { id: c, text: { en: "Define who in the organization must correct the AI system when it causes harm.", fr: "Définir qui, dans l'organisation, doit corriger le système d'IA quand il cause un préjudice." } }
    - { id: d, text: { en: "Provide text captions for the audio that the AI system generates.", fr: "Fournir des sous-titres pour l'audio que le système d'IA génère." } }
    - { id: e, text: { en: "Collect only the personal data that the AI system needs.", fr: "Ne collecter que les données personnelles dont le système d'IA a besoin." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Accountability means that people answer for an AI system: the system isn't the final authority on decisions that affect people's lives, and a clear system of governance says who remediates problems."
    fr: "La responsabilité signifie que des personnes répondent d'un système d'IA : le système n'est pas l'autorité finale sur les décisions qui touchent la vie des gens, et un système clair de gouvernance indique qui corrige les problèmes."
  options:
    b:
      en: "Describing the training data helps people understand the system: transparency."
      fr: "Décrire les données d'entraînement aide à comprendre le système : transparence."
    d:
      en: "Captions keep the system usable by people with hearing impairments: inclusiveness."
      fr: "Les sous-titres gardent le système utilisable par les personnes malentendantes : inclusion."
    e:
      en: "Limiting the personal data collected is data minimization: privacy and security."
      fr: "Limiter les données personnelles collectées relève de la minimisation des données : confidentialité et sécurité."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
