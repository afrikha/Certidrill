id: ai901-1b-transp-dd-definitions
objective: "1.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The principle of [[p1]] means that people can understand how an AI system works and what its limitations are. The principle of [[p2]] means that the people who design and deploy an AI system answer for how it operates.
    fr: |
      Le principe appelé [[p1]] veut que les personnes puissent comprendre comment un système d'IA fonctionne et quelles sont ses limites. Le principe appelé [[p2]] veut que les personnes qui conçoivent et déploient un système d'IA répondent de son fonctionnement.
  slots:
    - id: p1
      options:
        - { id: tr, text: { en: "transparency", fr: "transparence" } }
        - { id: ac, text: { en: "accountability", fr: "responsabilité" } }
        - { id: fa, text: { en: "fairness", fr: "impartialité" } }
        - { id: rs, text: { en: "reliability and safety", fr: "fiabilité et sécurité" } }
    - id: p2
      options:
        - { id: tr, text: { en: "transparency", fr: "transparence" } }
        - { id: ac, text: { en: "accountability", fr: "responsabilité" } }
        - { id: fa, text: { en: "fairness", fr: "impartialité" } }
        - { id: rs, text: { en: "reliability and safety", fr: "fiabilité et sécurité" } }
answer:
  values: { p1: tr, p2: ac }
explanation:
  correct:
    en: "Transparency is about understanding: users are made aware of how the system works and of its potential limitations. Accountability is about people: those who design and deploy an AI system are accountable for how it operates."
    fr: "La transparence porte sur la compréhension : les utilisateurs sont informés du fonctionnement du système et de ses limites éventuelles. La responsabilité porte sur les personnes : celles qui conçoivent et déploient un système d'IA sont responsables de son fonctionnement."
  options:
    fa:
      en: "Fairness means that the system treats similar people in similar ways and avoids bias."
      fr: "L'impartialité signifie que le système traite de la même façon des personnes similaires et évite les biais."
    rs:
      en: "Reliability and safety means that the system performs consistently and safely, even in unexpected conditions."
      fr: "La fiabilité et la sécurité signifient que le système fonctionne de manière cohérente et sûre, même dans des conditions inattendues."
references:
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
