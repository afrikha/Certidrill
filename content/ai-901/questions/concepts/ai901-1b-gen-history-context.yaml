id: ai901-1b-gen-history-context
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a chat application, a user asks a model to list the key considerations for adopting generative AI. The user then asks: "What are common privacy-related risks?" The model answers about the privacy risks of generative AI.

    Why can the model interpret the second question in the context of the first one?
  fr: |
    Dans une application de conversation, un utilisateur demande à un modèle de lister les points clés à considérer pour adopter l'IA générative. L'utilisateur demande ensuite : « Quels sont les risques courants liés à la confidentialité ? » Le modèle répond sur les risques de l'IA générative pour la confidentialité.

    Pourquoi le modèle peut-il interpréter la deuxième question dans le contexte de la première ?
body:
  options:
    - { id: a, text: { en: "The application includes the earlier prompts and responses in the new prompt.", fr: "L'application inclut les invites et les réponses précédentes dans la nouvelle invite." } }
    - { id: b, text: { en: "The model was retrained on the first exchange before it answered.", fr: "Le modèle a été réentraîné sur le premier échange avant de répondre." } }
    - { id: c, text: { en: "The deployment stores each conversation in the weights of the model.", fr: "Le déploiement stocke chaque conversation dans les pondérations du modèle." } }
    - { id: d, text: { en: "The embeddings of the model are recalculated after each response.", fr: "Les embeddings du modèle sont recalculés après chaque réponse." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A model only works from the prompt that it receives. Generative AI applications keep track of the conversation history and include it, often summarized, in later prompts, which gives the model the context needed to interpret a follow-up question."
    fr: "Un modèle ne travaille qu'à partir de l'invite qu'il reçoit. Les applications d'IA générative suivent l'historique des conversations et l'incluent, souvent sous forme résumée, dans les invites suivantes, ce qui donne au modèle le contexte nécessaire pour interpréter une question de suivi."
  options:
    b:
      en: "Training happens before deployment; a conversation doesn't retrain the model."
      fr: "L'entraînement a lieu avant le déploiement ; une conversation ne réentraîne pas le modèle."
    c:
      en: "The weights of a deployed model don't change during inference."
      fr: "Les pondérations d'un modèle déployé ne changent pas pendant l'inférence."
    d:
      en: "Embeddings are learned during training and aren't recalculated from one response to the next."
      fr: "Les embeddings sont appris pendant l'entraînement et ne sont pas recalculés d'une réponse à l'autre."
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
