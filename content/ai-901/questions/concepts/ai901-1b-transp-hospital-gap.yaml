id: ai901-1b-transp-hospital-gap
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A hospital uses an AI system to prioritize patients in the emergency department. The system has been tested extensively and performs as designed. A doctor validates every priority before it's applied. However, neither the doctors nor the patients can find out why the system assigns a given priority.

    Which responsible AI principle does the hospital still need to address?
  fr: |
    Un hôpital utilise un système d'IA pour établir la priorité des patients aux urgences. Le système a été testé de manière approfondie et fonctionne comme prévu. Un médecin valide chaque priorité avant qu'elle soit appliquée. En revanche, ni les médecins ni les patients ne peuvent savoir pourquoi le système attribue une priorité donnée.

    Quel principe de l'IA responsable l'hôpital doit-il encore traiter ?
body:
  options:
    - { id: a, text: { en: "Accountability", fr: "Responsabilité" } }
    - { id: b, text: { en: "Transparency", fr: "Transparence" } }
    - { id: c, text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" } }
    - { id: d, text: { en: "Inclusiveness", fr: "Inclusion" } }
answer: { optionId: b }
explanation:
  correct:
    en: "When an AI system informs decisions that affect people's lives, people must be able to understand how the system reaches its conclusions. Here nobody can obtain a useful explanation of the system's behavior, so intelligibility, the core of transparency, is missing."
    fr: "Quand un système d'IA oriente des décisions qui touchent la vie des gens, ceux-ci doivent pouvoir comprendre comment le système parvient à ses conclusions. Ici, personne ne peut obtenir d'explication utile du comportement du système : l'intelligibilité, au cœur de la transparence, fait défaut."
  options:
    a:
      en: "A doctor validates every priority, so the system isn't the final authority: accountability is already addressed."
      fr: "Un médecin valide chaque priorité : le système n'est donc pas l'autorité finale et la responsabilité est déjà traitée."
    c:
      en: "The system was tested extensively and performs as designed, which is what reliability and safety requires."
      fr: "Le système a été testé de manière approfondie et fonctionne comme prévu, ce qu'exigent la fiabilité et la sécurité."
    d:
      en: "Nothing in the scenario indicates that some people are excluded from using or benefiting from the system."
      fr: "Rien dans le scénario n'indique que certaines personnes sont exclues de l'utilisation ou des bénéfices du système."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai
