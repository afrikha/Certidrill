id: ai901-1a-priv-order-call-transcripts
objective: "1.1.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys records customer support calls as audio files. Analysts must study what customers say, but the analytics database must never contain personal data such as names and addresses.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys enregistre les appels de son support client sous forme de fichiers audio. Des analystes doivent étudier ce que disent les clients, mais la base de données d'analyse ne doit jamais contenir de données personnelles comme des noms et des adresses.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: raw
      text: { en: "Save the transcripts in the analytics database.", fr: "Enregistrer les transcriptions dans la base de données d'analyse." }
    - id: pii
      text: { en: "Submit the transcripts to PII detection in Azure Language.", fr: "Soumettre les transcriptions à la détection des PII d'Azure Language." }
    - id: tts
      text: { en: "Convert the transcripts to audio by using speech synthesis in Azure Speech.", fr: "Convertir les transcriptions en audio à l'aide de la synthèse vocale d'Azure Speech." }
    - id: stt
      text: { en: "Transcribe the audio files to text by using speech recognition in Azure Speech.", fr: "Transcrire les fichiers audio en texte à l'aide de la reconnaissance vocale d'Azure Speech." }
    - id: store
      text: { en: "Save the redacted text that the service returns in the analytics database.", fr: "Enregistrer dans la base de données d'analyse le texte masqué que le service renvoie." }
    - id: manual
      text: { en: "Ask the analysts to delete the names that they find in the analytics database.", fr: "Demander aux analystes de supprimer les noms qu'ils trouvent dans la base de données d'analyse." }
answer:
  sequence: [stt, pii, store]
explanation:
  correct:
    en: "PII detection works on text, so the calls are first transcribed with speech recognition (speech to text). The transcripts are then submitted to PII detection, which returns the detected entities and a redacted text. Only that redacted text is saved, so personal data never enters the analytics database."
    fr: "La détection des PII fonctionne sur du texte : les appels sont donc d'abord transcrits avec la reconnaissance vocale (speech to text). Les transcriptions sont ensuite soumises à la détection des PII, qui renvoie les entités détectées et un texte masqué. Seul ce texte masqué est enregistré : les données personnelles n'entrent donc jamais dans la base de données d'analyse."
  options:
    raw: { en: "The raw transcripts still contain names and addresses, which the database must never contain.", fr: "Les transcriptions brutes contiennent encore des noms et des adresses, que la base de données ne doit jamais contenir." }
    tts: { en: "Speech synthesis turns text into audio; it is the opposite of what the analysis needs and removes nothing.", fr: "La synthèse vocale transforme du texte en audio ; c'est l'inverse de ce dont l'analyse a besoin, et elle ne retire rien." }
    manual: { en: "Manual cleanup happens after personal data has already entered the database.", fr: "Un nettoyage manuel intervient après l'entrée des données personnelles dans la base de données." }
references:
  - title: "What is PII detection in Azure Language?"
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
