id: ai901-1d-dd-model-types
objective: "1.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are browsing the model catalog in the Microsoft Foundry portal.

    What type of model is each of the following? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous parcourez le catalogue de modèles dans le portail Microsoft Foundry.

    De quel type est chacun des modèles suivants ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      GPT-4.1-mini: [[m1]]

      GPT-Image-1.5 and FLUX: [[m2]]

      Sora 2: [[m3]]
    fr: |
      GPT-4.1-mini : [[m1]]

      GPT-Image-1.5 et FLUX : [[m2]]

      Sora 2 : [[m3]]
  slots:
  - id: m1
    options:
    - id: gen
      text:
        en: Image-generation model
        fr: "Modèle de génération d'images"
    - id: vid
      text:
        en: Video-generation model
        fr: Modèle de génération de vidéos
    - id: mm
      text:
        en: Vision-enabled multimodal model
        fr: Modèle multimodal compatible avec la vision
  - id: m2
    options:
    - id: gen
      text:
        en: Image-generation model
        fr: "Modèle de génération d'images"
    - id: vid
      text:
        en: Video-generation model
        fr: Modèle de génération de vidéos
    - id: mm
      text:
        en: Vision-enabled multimodal model
        fr: Modèle multimodal compatible avec la vision
  - id: m3
    options:
    - id: gen
      text:
        en: Image-generation model
        fr: "Modèle de génération d'images"
    - id: vid
      text:
        en: Video-generation model
        fr: Modèle de génération de vidéos
    - id: mm
      text:
        en: Vision-enabled multimodal model
        fr: Modèle multimodal compatible avec la vision
answer:
  values:
    m1: mm
    m2: gen
    m3: vid
explanation:
  correct:
    en: GPT-4.1-mini is a multimodal model that processes text and images together, so it can analyze images. GPT-Image-1.5 and FLUX create still images from text prompts. Sora models create videos.
    fr: "GPT-4.1-mini est un modèle multimodal qui traite ensemble du texte et des images ; il peut donc analyser des images. GPT-Image-1.5 et FLUX créent des images fixes à partir d'invites en texte. Les modèles Sora créent des vidéos."
references:
- title: Multimodal models for image analysis
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models"
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
