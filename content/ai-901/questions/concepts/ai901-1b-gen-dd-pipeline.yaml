id: ai901-1b-gen-dd-pipeline
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[first]] splits the text of a prompt into units that each have a numeric identifier. Because the order of the units matters, the model also uses [[order]] to record where each unit appears in the sequence.
    fr: |
      [[first]] découpe le texte d'une invite en unités qui possèdent chacune un identificateur numérique. Comme l'ordre des unités compte, le modèle utilise aussi [[order]] pour indiquer où chaque unité apparaît dans la séquence.
  slots:
    - id: first
      options:
        - { id: att, text: { en: "Attention", fr: "L'attention" } }
        - { id: ground, text: { en: "Grounding", fr: "L'ancrage" } }
        - { id: tok, text: { en: "Tokenization", fr: "La tokenisation" } }
        - { id: inf, text: { en: "Inference", fr: "L'inférence" } }
    - id: order
      options:
        - { id: pos, text: { en: "a positional encoding", fr: "un encodage positionnel" } }
        - { id: sys, text: { en: "a system prompt", fr: "une invite système" } }
        - { id: filter, text: { en: "a content filter", fr: "un filtre de contenu" } }
        - { id: cos, text: { en: "a cosine similarity", fr: "une similarité cosinus" } }
answer:
  values: { first: tok, order: pos }
explanation:
  correct:
    en: "Tokenization breaks text into tokens and assigns each one a numeric identifier. The token vectors are then fed into the transformer together with a positional encoding that indicates where each token appears in the sequence."
    fr: "La tokenisation découpe le texte en jetons et attribue à chacun un identificateur numérique. Les vecteurs des jetons sont ensuite fournis au transformer avec un encodage positionnel qui indique où chaque jeton apparaît dans la séquence."
  options:
    att:
      en: "Attention weighs how much the tokens of a sequence influence each other; it doesn't split the text."
      fr: "L'attention pondère l'influence des jetons d'une séquence les uns sur les autres ; elle ne découpe pas le texte."
    cos:
      en: "Cosine similarity measures how close two embeddings are; it doesn't record a position."
      fr: "La similarité cosinus mesure la proximité de deux embeddings ; elle n'indique pas une position."
    sys:
      en: "A system prompt gives the model instructions about its behavior."
      fr: "Une invite système donne au modèle des instructions sur son comportement."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
