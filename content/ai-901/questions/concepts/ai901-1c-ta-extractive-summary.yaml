id: ai901-1c-ta-extractive-summary
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A compliance team of Litware needs a three-sentence summary of each contract. Every sentence of the summary must appear word for word in the contract, so that reviewers can trace it back to the original text.

    Which technique should the team use?
  fr: |
    Une équipe de conformité de Litware a besoin d'un résumé en trois phrases de chaque contrat. Chaque phrase du résumé doit figurer mot pour mot dans le contrat, afin que les relecteurs puissent la retrouver dans le texte d'origine.

    Quelle technique l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Abstractive summarization", fr: "Résumé abstractif" } }
    - { id: b, text: { en: "Key phrase extraction", fr: "Extraction d'expressions clés" } }
    - { id: c, text: { en: "Extractive summarization", fr: "Résumé extractif" } }
    - { id: d, text: { en: "Entity detection", fr: "Détection d'entités" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Extractive summarization builds the summary from the most salient sentences of the source text, unchanged. Each sentence comes with a rank score and its position, so a three-sentence summary is the three highest-ranked original sentences.
    fr: |
      Le résumé extractif construit le résumé à partir des phrases les plus saillantes du texte source, sans les modifier. Chaque phrase est accompagnée d'un score de classement et de sa position : un résumé en trois phrases correspond aux trois phrases d'origine les mieux classées.
  options:
    a: { en: "Abstractive summarization generates new, concise sentences that are not copied verbatim from the source.", fr: "Le résumé abstractif génère de nouvelles phrases concises qui ne sont pas copiées mot pour mot depuis la source." }
    b: { en: "Key phrase extraction returns isolated phrases, not complete sentences of the contract.", fr: "L'extraction d'expressions clés renvoie des expressions isolées, pas des phrases complètes du contrat." }
    d: { en: "Entity detection returns categorized items such as parties and dates, not a summary.", fr: "La détection d'entités renvoie des éléments classés par catégorie, comme les parties et les dates, pas un résumé." }
references:
  - title: What is summarization?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/summarization/overview
