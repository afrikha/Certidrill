id: ai901-1a-incl-yn-voice-ordering
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam builds a voice-controlled ordering assistant for its restaurants.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée un assistant de commande à contrôle vocal pour ses restaurants.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "Because the assistant uses the same model for every customer, it meets the inclusiveness principle.", fr: "Comme l'assistant utilise le même modèle pour tous les clients, il respecte le principe d'inclusion." }
    - id: s2
      text: { en: "Offering a touch screen as an alternative to voice input makes the assistant more inclusive.", fr: "Proposer un écran tactile comme alternative à la saisie vocale rend l'assistant plus inclusif." }
    - id: s3
      text: { en: "A feature that is designed for customers who have a specific disability can also benefit many other customers.", fr: "Une fonctionnalité conçue pour des clients ayant un handicap spécifique peut aussi profiter à beaucoup d'autres clients." }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Using one model for everyone says nothing about whether everyone is able to use the assistant: inclusiveness requires the team to identify who might be left out. An alternative input method removes a barrier for customers who are unable to speak, and designing for a specific need often creates a broader impact (solve for one, extend to many)."
    fr: "Utiliser un seul modèle pour tous ne dit rien sur la capacité de chacun à utiliser l'assistant : l'inclusion exige que l'équipe identifie qui peut être laissé de côté. Un autre mode de saisie supprime un obstacle pour les clients qui ne peuvent pas parler, et concevoir pour un besoin spécifique crée souvent un impact plus large (Solve for one, extend to many)."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
