id: ai901-1c-wl-basics-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You classify scenarios by AI workload.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous classez des scénarios par charge de travail d'IA.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Creating a custom quiz from the chapter of a textbook is a generative AI scenario.
        fr: Créer un quiz personnalisé à partir du chapitre d'un manuel est un scénario d'IA générative.
    - id: s2
      text:
        en: Reading the text of a message aloud to a driver is a computer vision scenario.
        fr: Lire à voix haute le texte d'un message à un conducteur est un scénario de vision par ordinateur.
    - id: s3
      text:
        en: Highlighting possible fractures on X-ray images is a computer vision scenario.
        fr: Signaler de possibles fractures sur des radiographies est un scénario de vision par ordinateur.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A quiz written from a chapter is new content created from a prompt: generative AI. Reading text aloud converts text into spoken audio, which is speech synthesis, a speech workload. Analyzing medical images such as X-rays to highlight anomalies is computer vision.
    fr: |
      Un quiz rédigé à partir d'un chapitre est un contenu nouveau créé à partir d'une invite : de l'IA générative. Lire un texte à voix haute convertit du texte en audio parlé : c'est de la synthèse vocale, une charge de travail vocale. Analyser des images médicales comme des radiographies pour signaler des anomalies relève de la vision par ordinateur.
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/1-introduction
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/1-introduction
