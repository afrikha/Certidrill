id: ai901-1b-transp-note
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You plan to build a solution that uses Azure OpenAI models in Microsoft Foundry.

    You need a Microsoft document that describes how the technology works, its capabilities and limitations, and the choices of system owners that influence the performance and behavior of the system.

    Which document should you read?
  fr: |
    Vous prévoyez de créer une solution qui utilise des modèles Azure OpenAI dans Microsoft Foundry.

    Vous avez besoin d'un document de Microsoft qui décrit le fonctionnement de la technologie, ses capacités et ses limites, ainsi que les choix des propriétaires de systèmes qui influencent les performances et le comportement du système.

    Quel document devez-vous lire ?
body:
  options:
    - { id: a, text: { en: "The Microsoft Product Terms", fr: "Les Microsoft Product Terms" } }
    - { id: b, text: { en: "A service-level agreement (SLA)", fr: "Un contrat de niveau de service (SLA)" } }
    - { id: c, text: { en: "A model leaderboard", fr: "Un classement de modèles" } }
    - { id: d, text: { en: "A Transparency Note", fr: "Une note de transparence (Transparency Note)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Microsoft publishes Transparency Notes to help customers understand how its AI technology works, what its capabilities and limitations are, and which choices of system owners influence performance and behavior. They are one of the ways Microsoft puts its AI principles into practice."
    fr: "Microsoft publie des notes de transparence (Transparency Notes) pour aider ses clients à comprendre comment sa technologie d'IA fonctionne, quelles sont ses capacités et ses limites, et quels choix des propriétaires de systèmes influencent les performances et le comportement. C'est l'une des façons dont Microsoft met en pratique ses principes d'IA."
  options:
    a:
      en: "The Product Terms are the terms under which Microsoft sells its products; they don't explain how an AI system behaves."
      fr: "Les Product Terms sont les conditions auxquelles Microsoft vend ses produits ; ils n'expliquent pas le comportement d'un système d'IA."
    b:
      en: "An SLA is a commitment on the availability of a service, not a description of its capabilities and limitations."
      fr: "Un SLA est un engagement sur la disponibilité d'un service, pas une description de ses capacités et de ses limites."
    c:
      en: "A leaderboard ranks models on benchmarks such as quality, safety and throughput."
      fr: "Un classement ordonne les modèles selon des benchmarks comme la qualité, la sécurité et le débit."
references:
  - title: "Transparency note for Azure OpenAI"
    url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/transparency-note
  - title: "Responsible AI for agent design"
    url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
