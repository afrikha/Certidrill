id: ai901-1c-ta-model-vs-language-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You compare two ways to analyze text in Microsoft Foundry: prompting a general-purpose model that is deployed in a project, and calling Azure Language in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez deux façons d'analyser du texte dans Microsoft Foundry : envoyer des invites à un modèle à usage général déployé dans un projet, et appeler Azure Language dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A general-purpose model can extract key phrases and then summarize the same text in one conversation, by following natural language prompts.
        fr: Un modèle à usage général peut extraire des expressions clés puis résumer le même texte dans une seule conversation, en suivant des invites en langage naturel.
    - id: s2
      text:
        en: Azure Language uses purpose-built analyzers that return structured, deterministic results.
        fr: Azure Language utilise des analyseurs spécialisés qui renvoient des résultats structurés et déterministes.
    - id: s3
      text:
        en: Abstractive summarization returns only sentences that are copied word for word from the source text.
        fr: Le résumé abstractif renvoie uniquement des phrases copiées mot pour mot depuis le texte source.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A general-purpose model follows natural language instructions, so it can chain several text analysis tasks in the same conversation, with output that varies with the wording of the prompt. Azure Language offers purpose-built analyzers whose structured, deterministic output suits automated pipelines. Abstractive summarization generates new sentences; copying the most salient original sentences is extractive summarization.
    fr: |
      Un modèle à usage général suit des instructions en langage naturel : il peut donc enchaîner plusieurs tâches d'analyse de texte dans la même conversation, avec une sortie qui varie selon la formulation de l'invite. Azure Language propose des analyseurs spécialisés dont la sortie structurée et déterministe convient aux pipelines automatisés. Le résumé abstractif génère de nouvelles phrases ; reprendre les phrases d'origine les plus saillantes est le résumé extractif.
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
  - title: What is summarization?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/summarization/overview
