id: ai901-1b-model-dd-compare
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are selecting a model in the Foundry portal for a new application.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous sélectionnez un modèle dans le portail Foundry pour une nouvelle application.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To see how candidate models rank on standard benchmark datasets for quality, safety and throughput, use [[rank]]. To submit your own prompts to a candidate model and check its responses, use [[test]].
    fr: |
      Pour voir comment les modèles candidats se classent sur des jeux de données de benchmark standard en matière de qualité, de sécurité et de débit, utilisez [[rank]]. Pour soumettre vos propres invites à un modèle candidat et vérifier ses réponses, utilisez [[test]].
  slots:
    - id: rank
      options:
        - { id: filters, text: { en: "the content filters", fr: "les filtres de contenu" } }
        - { id: play, text: { en: "the model playground", fr: "le terrain de jeu du modèle" } }
        - { id: note, text: { en: "a Transparency Note", fr: "une note de transparence" } }
        - { id: leader, text: { en: "the model leaderboards", fr: "les classements de modèles" } }
    - id: test
      options:
        - { id: filters, text: { en: "the content filters", fr: "les filtres de contenu" } }
        - { id: play, text: { en: "the model playground", fr: "le terrain de jeu du modèle" } }
        - { id: note, text: { en: "a Transparency Note", fr: "une note de transparence" } }
        - { id: leader, text: { en: "the model leaderboards", fr: "les classements de modèles" } }
answer:
  values: { rank: leader, test: play }
explanation:
  correct:
    en: "Model leaderboards rank the models of the catalog on industry-standard benchmarks for quality, safety, cost and performance. The playground lets you try your own prompts against a model and see whether its responses meet your expectations before you write any code."
    fr: "Les classements de modèles ordonnent les modèles du catalogue selon des benchmarks standard du secteur pour la qualité, la sécurité, le coût et les performances. Le terrain de jeu vous permet d'essayer vos propres invites sur un modèle et de voir si ses réponses répondent à vos attentes avant d'écrire du code."
  options:
    filters:
      en: "Content filters block harmful prompts and responses; they don't compare models."
      fr: "Les filtres de contenu bloquent les invites et les réponses nuisibles ; ils ne comparent pas les modèles."
    note:
      en: "A Transparency Note documents how a technology works and its limitations; it neither ranks nor tests models."
      fr: "Une note de transparence documente le fonctionnement et les limites d'une technologie ; elle ne classe pas et ne teste pas les modèles."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Model leaderboards in Microsoft Foundry portal (preview)"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/model-benchmarks
