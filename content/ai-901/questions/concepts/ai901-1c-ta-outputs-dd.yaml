id: ai901-1c-ta-outputs-dd
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An application analyzes the following text with three text analysis techniques:

    *Maria Lopez from Fabrikam ordered 25 laptops on June 4. She says that the delivery was fast and that the support team was fantastic.*

    Which technique produced each output? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application analyse le texte suivant avec trois techniques d'analyse de texte :

    *Maria Lopez from Fabrikam ordered 25 laptops on June 4. She says that the delivery was fast and that the support team was fantastic.*

    Quelle technique a produit chaque sortie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The output "laptops, delivery, support team" was produced by [[o1]].

      The output "Maria Lopez: Person; Fabrikam: Organization; 25: Quantity; June 4: DateTime" was produced by [[o2]].

      The output "Positive" was produced by [[o3]].
    fr: |
      La sortie « laptops, delivery, support team » a été produite par [[o1]].

      La sortie « Maria Lopez : Person ; Fabrikam : Organization ; 25 : Quantity ; June 4 : DateTime » a été produite par [[o2]].

      La sortie « Positive » a été produite par [[o3]].
  slots:
    - id: o1
      options:
        - { id: ent, text: { en: "entity detection", fr: "la détection d'entités" } }
        - { id: kpe, text: { en: "key phrase extraction", fr: "l'extraction d'expressions clés" } }
        - { id: sum, text: { en: "summarization", fr: "le résumé de texte" } }
    - id: o2
      options:
        - { id: kpe, text: { en: "key phrase extraction", fr: "l'extraction d'expressions clés" } }
        - { id: sent, text: { en: "sentiment analysis", fr: "l'analyse des sentiments" } }
        - { id: ent, text: { en: "entity detection", fr: "la détection d'entités" } }
    - id: o3
      options:
        - { id: sent, text: { en: "sentiment analysis", fr: "l'analyse des sentiments" } }
        - { id: sum, text: { en: "summarization", fr: "le résumé de texte" } }
        - { id: ent, text: { en: "entity detection", fr: "la détection d'entités" } }
answer:
  values: { o1: kpe, o2: ent, o3: sent }
explanation:
  correct:
    en: |
      A plain list of the main concepts of the text comes from key phrase extraction. Items returned with a category such as Person, Organization, Quantity or DateTime come from entity detection. A positive, negative or neutral label comes from sentiment analysis.
    fr: |
      Une simple liste des principaux concepts du texte vient de l'extraction d'expressions clés. Des éléments renvoyés avec une catégorie comme Person, Organization, Quantity ou DateTime viennent de la détection d'entités. Une étiquette positif, négatif ou neutre vient de l'analyse des sentiments.
  options:
    sum: { en: "Summarization returns a shorter text made of sentences, not a list of phrases or a label.", fr: "Le résumé renvoie un texte plus court composé de phrases, pas une liste d'expressions ni une étiquette." }
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
