id: ai901-1a-incl-definition
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the inclusiveness principle of responsible AI?
  fr: |
    Quelle affirmation décrit le principe d'inclusion de l'IA responsable ?
body:
  options:
    - id: a
      text: { en: "AI systems should empower everyone and reflect the full range of human experiences and needs.", fr: "Les systèmes d'IA doivent donner des moyens d'agir à chacun et refléter toute la diversité des expériences et des besoins humains." }
    - id: b
      text: { en: "AI systems should make the same recommendations to people who are in similar situations.", fr: "Les systèmes d'IA doivent faire les mêmes recommandations aux personnes qui se trouvent dans des situations similaires." }
    - id: c
      text: { en: "AI systems should be overseen by people who answer for the way in which the systems operate.", fr: "Les systèmes d'IA doivent être supervisés par des personnes qui répondent de la manière dont ils fonctionnent." }
    - id: d
      text: { en: "AI systems should protect data and models and preserve the right of people to privacy.", fr: "Les systèmes d'IA doivent protéger les données et les modèles et préserver le droit des personnes à la vie privée." }
answer: { optionId: a }
explanation:
  correct:
    en: "Inclusiveness means that technology should empower every person, so AI systems must reflect the full spectrum of human experiences and needs, including those of people with disabilities."
    fr: "L'inclusion signifie que la technologie doit donner des moyens d'agir à chaque personne : les systèmes d'IA doivent donc refléter toute la diversité des expériences et des besoins humains, y compris ceux des personnes en situation de handicap."
  options:
    b: { en: "This statement describes fairness.", fr: "Cette affirmation décrit l'impartialité." }
    c: { en: "This statement describes accountability.", fr: "Cette affirmation décrit la responsabilité." }
    d: { en: "This statement describes privacy and security.", fr: "Cette affirmation décrit la confidentialité et la sécurité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Artificial Intelligence overview"
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence
