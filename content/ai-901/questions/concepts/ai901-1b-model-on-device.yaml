id: ai901-1b-model-on-device
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware is building an assistant for field technicians. The assistant answers questions on one focused topic and must run on the technicians' devices, which have limited computing resources.

    Which type of model should you choose?
  fr: |
    Litware crée un assistant pour des techniciens de terrain. L'assistant répond à des questions sur un seul domaine ciblé et doit s'exécuter sur les appareils des techniciens, dont les ressources de calcul sont limitées.

    Quel type de modèle devez-vous choisir ?
body:
  options:
    - { id: a, text: { en: "A small language model (SLM) such as Phi-4", fr: "Un petit modèle de langage (SLM) comme Phi-4" } }
    - { id: b, text: { en: "A large reasoning model such as GPT-5", fr: "Un grand modèle de raisonnement comme GPT-5" } }
    - { id: c, text: { en: "A video generation model such as Sora 2", fr: "Un modèle de génération de vidéos comme Sora 2" } }
    - { id: d, text: { en: "An embedding model such as text-embedding-3-small", fr: "Un modèle d'embedding comme text-embedding-3-small" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Small language models are trained on less data and have fewer variables than large ones, so they need fewer resources. They suit focused topic areas, small applications that are deployed locally and on-device agents."
    fr: "Les petits modèles de langage sont entraînés sur moins de données et comptent moins de variables que les grands : ils demandent donc moins de ressources. Ils conviennent aux domaines ciblés, aux petites applications déployées localement et aux agents sur l'appareil."
  options:
    b:
      en: "A large reasoning model generalizes well but costs more to use and isn't meant to run on a small device."
      fr: "Un grand modèle de raisonnement généralise bien, mais coûte plus cher à utiliser et n'est pas destiné à s'exécuter sur un petit appareil."
    c:
      en: "A video generation model creates video clips; it doesn't answer questions."
      fr: "Un modèle de génération de vidéos crée des clips vidéo ; il ne répond pas à des questions."
    d:
      en: "An embedding model returns vectors, not answers in natural language."
      fr: "Un modèle d'embedding renvoie des vecteurs, pas des réponses en langage naturel."
references:
  - title: "Generative AI and agents"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/2-generative-ai
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
