id: ai901-1a-rel-which-risk
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso reviews four risks of its customer-facing AI agent.

    Which risk should be addressed under the reliability and safety principle?
  fr: |
    Contoso passe en revue quatre risques de son agent d'IA destiné aux clients.

    Quel risque doit être traité au titre du principe de fiabilité et de sécurité ?
body:
  options:
    - id: a
      text: { en: "Chat histories are kept longer than the stated purpose requires.", fr: "Les historiques de conversation sont conservés plus longtemps que ne l'exige la finalité annoncée." }
    - id: b
      text: { en: "A key that grants access to the data of the agent is published in a code repository.", fr: "Une clé qui donne accès aux données de l'agent est publiée dans un dépôt de code." }
    - id: c
      text: { en: "A contractor who has no business need can read the customer records that the agent uses.", fr: "Un sous-traitant sans besoin professionnel peut lire les dossiers clients que l'agent utilise." }
    - id: d
      text: { en: "The agent gives unsafe repair advice when a question describes a situation that was never tested.", fr: "L'agent donne des conseils de réparation dangereux lorsqu'une question décrit une situation qui n'a jamais été testée." }
answer: { optionId: d }
explanation:
  correct:
    en: "Reliability and safety is about the behavior of the system itself: it must perform as designed and respond safely to situations that its developers didn't anticipate. The three other risks concern the protection of data and access, which is privacy and security."
    fr: "La fiabilité et la sécurité portent sur le comportement du système lui-même : il doit fonctionner comme prévu et réagir sans danger aux situations que ses développeurs n'avaient pas anticipées. Les trois autres risques concernent la protection des données et des accès, c'est-à-dire la confidentialité et la sécurité."
  options:
    a: { en: "Keeping personal data longer than its purpose requires is a privacy issue.", fr: "Conserver des données personnelles plus longtemps que ne l'exige leur finalité est un problème de confidentialité." }
    b: { en: "An exposed key is a security issue: secrets must be protected against unauthorized access.", fr: "Une clé exposée est un problème de sécurité : les secrets doivent être protégés contre les accès non autorisés." }
    c: { en: "Access to customer data by someone who has no need for it is a privacy and security issue.", fr: "L'accès aux données des clients par une personne qui n'en a pas besoin est un problème de confidentialité et de sécurité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
