id: ai901-1b-gen-order-steps
objective: "1.2.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A user submits a prompt to a deployed large language model (LLM).

    Which four steps does the model perform in sequence to generate the completion? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Un utilisateur soumet une invite à un grand modèle de langage (LLM) déployé.

    Quelles sont les quatre étapes que le modèle effectue dans l'ordre pour générer la complétion ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: pred, text: { en: "Use attention to weigh the tokens and predict the most probable next token.", fr: "Utiliser l'attention pour pondérer les jetons et prédire le jeton suivant le plus probable." } }
    - { id: train, text: { en: "Adjust the weights of the model to reduce the prediction error.", fr: "Ajuster les pondérations du modèle pour réduire l'erreur de prédiction." } }
    - { id: tok, text: { en: "Split the text of the prompt into tokens.", fr: "Découper le texte de l'invite en jetons." } }
    - { id: loop, text: { en: "Append the predicted token to the sequence and repeat the prediction.", fr: "Ajouter le jeton prédit à la séquence et répéter la prédiction." } }
    - { id: search, text: { en: "Search the training documents for a passage that matches the prompt.", fr: "Rechercher dans les documents d'entraînement un passage qui correspond à l'invite." } }
    - { id: vec, text: { en: "Represent each token as a vector that encodes its meaning and its position.", fr: "Représenter chaque jeton par un vecteur qui encode son sens et sa position." } }
answer:
  sequence: [ tok, vec, pred, loop ]
explanation:
  correct:
    en: "The prompt is first split into tokens. Each token is represented by a vector (its embedding, with a positional encoding). Attention then weighs how the tokens influence each other so that the model can predict the most probable next token, which is appended to the sequence; the prediction repeats until the model predicts the end of the sequence."
    fr: "L'invite est d'abord découpée en jetons. Chaque jeton est représenté par un vecteur (son embedding, avec un encodage positionnel). L'attention pondère ensuite l'influence des jetons les uns sur les autres pour que le modèle prédise le jeton suivant le plus probable, qui est ajouté à la séquence ; la prédiction se répète jusqu'à ce que le modèle prédise la fin de la séquence."
  options:
    train:
      en: "Weights are adjusted during training, not when a deployed model generates a completion."
      fr: "Les pondérations sont ajustées pendant l'entraînement, pas quand un modèle déployé génère une complétion."
    search:
      en: "The model doesn't keep or search its training documents; it predicts tokens."
      fr: "Le modèle ne conserve pas ses documents d'entraînement et n'y recherche rien ; il prédit des jetons."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
