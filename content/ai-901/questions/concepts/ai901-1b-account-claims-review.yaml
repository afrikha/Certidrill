id: ai901-1b-account-claims-review
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses an AI system to automate decisions on insurance claims.

    Which practice keeps Adatum accountable for the automated decisions?
  fr: |
    Adatum utilise un système d'IA pour automatiser les décisions sur les déclarations de sinistre.

    Quelle pratique permet à Adatum de rester responsable des décisions automatisées ?
body:
  options:
    - { id: a, text: { en: "Customers are told that an AI system processed their claim.", fr: "Les clients sont informés qu'un système d'IA a traité leur déclaration." } }
    - { id: b, text: { en: "Qualified employees can inspect the decisions and correct those that are wrong.", fr: "Des employés qualifiés peuvent inspecter les décisions et corriger celles qui sont erronées." } }
    - { id: c, text: { en: "Claim data is encrypted and deleted when it's no longer needed.", fr: "Les données des déclarations sont chiffrées et supprimées quand elles ne sont plus nécessaires." } }
    - { id: d, text: { en: "The system is monitored for failures and tested under heavy load.", fr: "Le système est surveillé pour détecter les défaillances et testé sous forte charge." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Accountability requires keeping humans with the requisite expertise in the loop. When decisions are automated, those people must be able to inspect, identify and resolve problems with the output of the model."
    fr: "La responsabilité exige que des humains possédant l'expertise nécessaire restent impliqués. Quand les décisions sont automatisées, ces personnes doivent pouvoir inspecter, identifier et résoudre les problèmes liés à la sortie du modèle."
  options:
    a:
      en: "Disclosing the use of AI is transparency; it doesn't give anyone control over the decisions."
      fr: "Signaler l'utilisation de l'IA relève de la transparence ; cela ne donne à personne le contrôle des décisions."
    c:
      en: "Encrypting and deleting data protects customers' information: privacy and security."
      fr: "Chiffrer et supprimer les données protège les informations des clients : confidentialité et sécurité."
    d:
      en: "Monitoring and load testing make the system dependable: reliability and safety."
      fr: "La surveillance et les tests de charge rendent le système fiable : fiabilité et sécurité."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
