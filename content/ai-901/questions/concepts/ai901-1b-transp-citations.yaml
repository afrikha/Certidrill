id: ai901-1b-transp-citations
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Contoso agent answers employee questions by using the company's HR policy documents.

    Employees must be able to see which information each answer was generated from.

    What should the agent include in its answers?
  fr: |
    Un agent de Contoso répond aux questions des employés à l'aide des documents de politique RH de l'entreprise.

    Les employés doivent pouvoir voir à partir de quelles informations chaque réponse a été générée.

    Que doit inclure l'agent dans ses réponses ?
body:
  options:
    - { id: a, text: { en: "The number of tokens that the answer consumed", fr: "Le nombre de jetons consommés par la réponse" } }
    - { id: b, text: { en: "The system instructions that define the agent's role", fr: "Les instructions système qui définissent le rôle de l'agent" } }
    - { id: c, text: { en: "The name of the employee who approved the agent's release", fr: "Le nom de l'employé qui a approuvé la mise en service de l'agent" } }
    - { id: d, text: { en: "References to the policy documents that the answer is based on", fr: "Les références des documents de politique sur lesquels la réponse s'appuie" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A transparent agent communicates how its outputs are generated so that users can make informed decisions. When an answer is grounded in retrieved documents, citing those documents shows employees where the information comes from and lets them check it."
    fr: "Un agent transparent indique comment ses sorties sont générées, afin que les utilisateurs décident en connaissance de cause. Quand une réponse est ancrée dans des documents récupérés, citer ces documents montre aux employés d'où vient l'information et leur permet de la vérifier."
  options:
    a:
      en: "The token count measures consumption; it doesn't show which information was used."
      fr: "Le nombre de jetons mesure la consommation ; il ne montre pas quelles informations ont été utilisées."
    b:
      en: "The system instructions set the behavior of the agent, not the source of a particular answer."
      fr: "Les instructions système fixent le comportement de l'agent, pas la source d'une réponse donnée."
    c:
      en: "Knowing who approved the release relates to accountability and doesn't tell where an answer comes from."
      fr: "Savoir qui a approuvé la mise en service relève de la responsabilité et n'indique pas d'où vient une réponse."
references:
  - title: "Responsible AI for agent design"
    url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
