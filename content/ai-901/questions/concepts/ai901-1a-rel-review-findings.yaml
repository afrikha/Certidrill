id: ai901-1a-rel-review-findings
objective: "1.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso reviews an AI assistant before release. The findings of the review are shown in the following table.

    Answer each prompt by selecting the appropriate finding.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso passe en revue un assistant d'IA avant sa mise en service. Les constats de la revue figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le constat approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The finding that shows that the assistant doesn't perform reliably on unexpected input that isn't an attack", fr: "Le constat qui montre que l'assistant ne fonctionne pas de manière fiable face à une entrée inattendue qui n'est pas une attaque" }
    - id: p2
      text: { en: "The finding that shows that the assistant doesn't resist harmful manipulation", fr: "Le constat qui montre que l'assistant ne résiste pas à une manipulation nuisible" }
  grid:
    header: [{ en: "Finding", fr: "Constat" }, "Description"]
    rows:
      - [{ text: "F1", area: f1 }, { text: { en: "Every employee can read chat logs that contain the phone numbers of customers.", fr: "Tous les employés peuvent lire des journaux de conversation qui contiennent les numéros de téléphone des clients." } }]
      - [{ text: "F2", area: f2 }, { text: { en: "A message that asks the assistant to ignore its instructions makes it explain how to disable a smoke detector.", fr: "Un message qui demande à l'assistant d'ignorer ses instructions lui fait expliquer comment désactiver un détecteur de fumée." } }]
      - [{ text: "F3", area: f3 }, { text: { en: "The assistant offers a smaller discount to customers whose first names are common in certain communities.", fr: "L'assistant propose une remise plus faible aux clients dont le prénom est courant dans certaines communautés." } }]
      - [{ text: "F4", area: f4 }, { text: { en: "When a message is written in capital letters with typing errors, the assistant returns an internal error instead of an answer.", fr: "Lorsqu'un message est écrit en majuscules avec des fautes de frappe, l'assistant renvoie une erreur interne au lieu d'une réponse." } }]
      - [{ text: "F5", area: f5 }, { text: { en: "The chat window is unusable with a keyboard only.", fr: "La fenêtre de conversation est inutilisable au clavier seul." } }]
answer:
  values: { p1: f4, p2: f2 }
explanation:
  correct:
    en: "Reliability and safety covers two different failures here. F4 shows that the assistant doesn't perform as designed when it receives unusual but harmless input, and F2 shows that a prompt can manipulate it into giving dangerous instructions. F1 is a privacy and security issue, F3 a fairness issue and F5 an inclusiveness issue."
    fr: "La fiabilité et la sécurité couvrent ici deux défaillances différentes. F4 montre que l'assistant ne fonctionne pas comme prévu lorsqu'il reçoit une entrée inhabituelle mais inoffensive, et F2 montre qu'une invite peut le manipuler pour lui faire donner des instructions dangereuses. F1 est un problème de confidentialité et de sécurité, F3 un problème d'impartialité et F5 un problème d'inclusion."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "Artificial Intelligence overview"
    url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence
