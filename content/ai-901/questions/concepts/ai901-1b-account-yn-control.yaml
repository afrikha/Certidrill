id: ai901-1b-account-yn-control
objective: "1.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An AI system whose measured accuracy is high can be the final authority on decisions that affect people's lives."
        fr: "Un système d'IA dont la précision mesurée est élevée peut être l'autorité finale sur les décisions qui touchent la vie des gens."
    - id: s2
      text:
        en: "Humans should maintain meaningful control over highly autonomous AI systems."
        fr: "Les humains doivent garder un contrôle significatif sur les systèmes d'IA très autonomes."
    - id: s3
      text:
        en: "Organizations should draw on industry standards to develop their accountability norms."
        fr: "Les organisations doivent s'appuyer sur les normes du secteur pour élaborer leurs normes de responsabilité."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Organizations should draw on industry standards to develop accountability norms. Those norms ensure that AI systems aren't the final authority on any decision that affects people's lives, whatever their accuracy, and that humans keep meaningful control over highly autonomous systems."
    fr: "Les organisations doivent s'appuyer sur les normes du secteur pour élaborer des normes de responsabilité. Ces normes garantissent que les systèmes d'IA ne sont l'autorité finale sur aucune décision qui touche la vie des gens, quelle que soit leur précision, et que les humains gardent un contrôle significatif sur les systèmes très autonomes."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai
