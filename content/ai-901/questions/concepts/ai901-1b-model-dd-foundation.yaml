id: ai901-1b-model-dd-foundation
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[fm]] is a large pretrained model that provides general language, reasoning or multimodal capabilities out of the box. [[fam]] is a group of related models that share an architecture or a lineage but differ in size, capability or version.
    fr: |
      [[fm]] est un grand modèle préentraîné qui offre d'emblée des capacités générales de langage, de raisonnement ou multimodales. [[fam]] est un groupe de modèles apparentés qui partagent une architecture ou une lignée, mais diffèrent par la taille, les capacités ou la version.
  slots:
    - id: fm
      options:
        - { id: emb, text: { en: "An embedding model", fr: "Un modèle d'embedding" } }
        - { id: tool, text: { en: "A Foundry Tool", fr: "Un outil Foundry" } }
        - { id: agent, text: { en: "An agent", fr: "Un agent" } }
        - { id: fm, text: { en: "A foundation model", fr: "Un modèle de base" } }
    - id: fam
      options:
        - { id: deploy, text: { en: "A model deployment", fr: "Un déploiement de modèle" } }
        - { id: family, text: { en: "A model family", fr: "Une famille de modèles" } }
        - { id: card, text: { en: "A model card", fr: "Une carte de modèle" } }
        - { id: leader, text: { en: "A model leaderboard", fr: "Un classement de modèles" } }
answer:
  values: { fm: fm, fam: family }
explanation:
  correct:
    en: "Foundation models, such as the GPT, Claude and Mistral models, are large pretrained models with general capabilities that can be used as soon as they are deployed. The catalog groups many of them into model families: related models that share an architecture or a lineage and differ in size, capability, specialization or version."
    fr: "Les modèles de base, comme les modèles GPT, Claude et Mistral, sont de grands modèles préentraînés aux capacités générales, utilisables dès leur déploiement. Le catalogue en regroupe beaucoup par familles de modèles : des modèles apparentés qui partagent une architecture ou une lignée et diffèrent par la taille, les capacités, la spécialisation ou la version."
  options:
    tool:
      en: "A Foundry Tool is a prebuilt service for a well-defined task, not a general-purpose model."
      fr: "Un outil Foundry est un service prédéfini pour une tâche bien définie, pas un modèle à usage général."
    agent:
      en: "An agent is an application built on a model, with instructions and tools."
      fr: "Un agent est une application construite sur un modèle, avec des instructions et des outils."
    card:
      en: "A model card documents one model, including its constraints and caveats."
      fr: "Une carte de modèle documente un modèle, notamment ses contraintes et ses mises en garde."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
