id: ai901-1a-priv-yn-insurance-claims
objective: "1.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    An insurance company uses an AI system to assess claims.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une compagnie d'assurance utilise un système d'IA pour évaluer les sinistres.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "Publishing which categories of personal data the system collects, and how long they are stored, helps the company comply with privacy laws.", fr: "Publier les catégories de données personnelles que le système collecte, et leur durée de stockage, aide la compagnie à respecter les lois sur la protection de la vie privée." }
    - id: s2
      text: { en: "Explaining to a customer which factors led the system to reduce a claim is primarily a privacy and security measure.", fr: "Expliquer à un client quels facteurs ont conduit le système à réduire une indemnisation est avant tout une mesure de confidentialité et de sécurité." }
    - id: s3
      text: { en: "A privacy and security review of the system is unnecessary when all the personal data is anonymized.", fr: "Une revue de confidentialité et de sécurité du système est inutile lorsque toutes les données personnelles sont anonymisées." }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Privacy laws require transparency about the collection, use and storage of data, so publishing this information is a privacy measure. Explaining the factors behind a decision makes the behavior of the system intelligible, which is the transparency principle. Microsoft recommends privacy and security reviews for all AI systems; anonymization is one consideration among others, such as access and protection against attacks."
    fr: "Les lois sur la protection de la vie privée exigent de la transparence sur la collecte, l'utilisation et le stockage des données : publier ces informations est donc une mesure de confidentialité. Expliquer les facteurs d'une décision rend le comportement du système intelligible : cela relève du principe de transparence. Microsoft recommande des revues de confidentialité et de sécurité pour tous les systèmes d'IA ; l'anonymisation n'est qu'une considération parmi d'autres, comme les accès et la protection contre les attaques."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2
