id: ai901-1a-fair-which-scenario
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which scenario is an example of a fairness issue in an AI solution?
  fr: |
    Quel scénario est un exemple de problème d'impartialité dans une solution d'IA ?
body:
  options:
    - id: a
      text: { en: "A recruiting system ranks equally qualified candidates lower when they are over 50.", fr: "Un système de recrutement classe moins bien des candidats aussi qualifiés que les autres lorsqu'ils ont plus de 50 ans." }
    - id: b
      text: { en: "A voice assistant offers no alternative for users who are unable to speak.", fr: "Un assistant vocal ne propose aucune alternative aux utilisateurs qui ne peuvent pas parler." }
    - id: c
      text: { en: "A chatbot doesn't tell users that its answers are generated by AI.", fr: "Un chatbot n'indique pas aux utilisateurs que ses réponses sont générées par l'IA." }
    - id: d
      text: { en: "A call center keeps customer recordings longer than its stated purpose requires.", fr: "Un centre d'appels conserve les enregistrements des clients plus longtemps que ne l'exige la finalité annoncée." }
answer: { optionId: a }
explanation:
  correct:
    en: "A fairness issue exists when similarly situated people are affected differently. Candidates with equal qualifications should receive the same ranking whatever their age."
    fr: "Il y a un problème d'impartialité lorsque des personnes dans des situations similaires sont affectées différemment. Des candidats aux qualifications égales doivent recevoir le même classement quel que soit leur âge."
  options:
    b: { en: "A system that some people are unable to use is an inclusiveness issue.", fr: "Un système que certaines personnes ne peuvent pas utiliser est un problème d'inclusion." }
    c: { en: "Not disclosing the use of AI is a transparency issue.", fr: "Ne pas signaler l'utilisation de l'IA est un problème de transparence." }
    d: { en: "Keeping personal data longer than required is a privacy and security issue.", fr: "Conserver des données personnelles plus longtemps que nécessaire est un problème de confidentialité et de sécurité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
