id: ai901-1a-priv-match-scenarios
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each practice to the responsible AI principle that it supports. To answer, drag the appropriate principle to each practice. Each principle may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque pratique au principe de l'IA responsable qu'elle sert. Pour répondre, faites glisser le principe approprié vers chaque pratique. Chaque principe peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: rel
      text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" }
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
    - id: priv
      text: { en: "Privacy and security", fr: "Confidentialité et sécurité" }
    - id: transp
      text: { en: "Transparency", fr: "Transparence" }
    - id: acc
      text: { en: "Accountability", fr: "Responsabilité" }
  targets:
    - id: t1
      text: { en: "Personal data is kept only as long as the defined purpose of the system requires.", fr: "Les données personnelles ne sont conservées que pendant la durée exigée par la finalité définie du système." }
    - id: t2
      text: { en: "The system is tested with input that its designers didn't anticipate.", fr: "Le système est testé avec des entrées que ses concepteurs n'avaient pas anticipées." }
    - id: t3
      text: { en: "An internal review board oversees the deployment of the system.", fr: "Un comité de revue interne supervise le déploiement du système." }
    - id: t4
      text: { en: "Users are informed about what the system is unable to do.", fr: "Les utilisateurs sont informés de ce que le système ne sait pas faire." }
answer:
  mapping: { t1: priv, t2: rel, t3: acc, t4: transp }
explanation:
  correct:
    en: "Keeping personal data only for the time and the purpose required protects privacy. Testing with unanticipated input verifies that the system responds safely, which is reliability and safety. A review board that oversees deployment makes people answerable for the system, which is accountability. Telling users about the limitations of the system is transparency."
    fr: "Ne conserver les données personnelles que pendant la durée et pour la finalité nécessaires protège la vie privée. Tester avec des entrées imprévues vérifie que le système réagit sans danger : c'est la fiabilité et la sécurité. Un comité de revue qui supervise le déploiement rend des personnes responsables du système : c'est la responsabilité. Informer les utilisateurs des limites du système relève de la transparence."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
