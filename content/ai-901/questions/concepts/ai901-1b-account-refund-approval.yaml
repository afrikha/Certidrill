id: ai901-1b-account-refund-approval
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Proseware agent uses an action tool to issue refunds to customers. Proseware considers refunds above 500 euros to be high-stakes actions.

    You need to make sure that humans keep meaningful control over these actions.

    What should you implement?
  fr: |
    Un agent de Proseware utilise un outil d'action pour émettre des remboursements aux clients. Proseware considère les remboursements supérieurs à 500 euros comme des actions à fort enjeu.

    Vous devez faire en sorte que des humains gardent un contrôle significatif sur ces actions.

    Que devez-vous mettre en place ?
body:
  options:
    - { id: a, text: { en: "A message that tells customers that refunds are issued by an AI agent", fr: "Un message qui indique aux clients que les remboursements sont émis par un agent IA" } }
    - { id: b, text: { en: "A content filter that blocks harmful prompts and harmful responses", fr: "Un filtre de contenu qui bloque les invites et les réponses nuisibles" } }
    - { id: c, text: { en: "A step in which an employee reviews and approves the refund before it's issued", fr: "Une étape dans laquelle un employé examine et approuve le remboursement avant son émission" } }
    - { id: d, text: { en: "A lower temperature so that the responses of the agent are more consistent", fr: "Une température plus basse pour que les réponses de l'agent soient plus régulières" } }
answer: { optionId: c }
explanation:
  correct:
    en: "For agents that take actions, Microsoft recommends human-in-the-loop controls: mandatory human review and approval for critical or high-stakes tasks, and the ability to intervene or override the agent. An approval step keeps a person in control of each large refund."
    fr: "Pour les agents qui exécutent des actions, Microsoft recommande des contrôles avec intervention humaine : examen et approbation obligatoires par un humain pour les tâches critiques ou à fort enjeu, et possibilité d'intervenir ou de passer outre l'agent. Une étape d'approbation laisse à une personne le contrôle de chaque remboursement important."
  options:
    a:
      en: "A disclosure informs customers (transparency) but doesn't give anyone control over the action."
      fr: "Une mention informe les clients (transparence) mais ne donne à personne le contrôle de l'action."
    b:
      en: "A content filter screens harmful text; it doesn't decide whether a refund should be issued."
      fr: "Un filtre de contenu écarte le texte nuisible ; il ne décide pas si un remboursement doit être émis."
    d:
      en: "Temperature changes how varied the generated text is, not who authorizes an action."
      fr: "La température modifie la variété du texte généré, pas la personne qui autorise une action."
references:
  - title: "Transparency Note for Foundry Agent Service"
    url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/agents/transparency-note
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
