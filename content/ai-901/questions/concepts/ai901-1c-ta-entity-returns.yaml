id: ai901-1c-ta-entity-returns
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You apply entity detection (named entity recognition) to a collection of news articles.

    What does the analysis return for each article?
  fr: |
    Vous appliquez la détection d'entités (reconnaissance d'entités nommées) à une collection d'articles de presse.

    Que renvoie l'analyse pour chaque article ?
body:
  options:
    - { id: a, text: { en: "A label that says whether the article is positive, negative or neutral", fr: "Une étiquette indiquant si l'article est positif, négatif ou neutre" } }
    - { id: b, text: { en: "A shorter text that keeps the most important information of the article", fr: "Un texte plus court qui garde les informations les plus importantes de l'article" } }
    - { id: c, text: { en: "The language in which the article is written, with a confidence score", fr: "La langue dans laquelle l'article est écrit, avec un score de confiance" } }
    - { id: d, text: { en: "The people, places, organizations and dates of the article, with their category", fr: "Les personnes, lieux, organisations et dates de l'article, avec leur catégorie" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Entity detection finds the items of a text that belong to a known category, such as person, location, organization, date and time, or quantity, and returns each item with its category and sometimes a subtype.
    fr: |
      La détection d'entités trouve les éléments d'un texte qui appartiennent à une catégorie connue, comme personne, lieu, organisation, date et heure ou quantité, et renvoie chaque élément avec sa catégorie et parfois un sous-type.
  options:
    a: { en: "A positive, negative or neutral label is the result of sentiment analysis.", fr: "Une étiquette positif, négatif ou neutre est le résultat de l'analyse des sentiments." }
    b: { en: "A shorter text is the result of summarization.", fr: "Un texte plus court est le résultat du résumé." }
    c: { en: "The language and its confidence score are the result of language detection.", fr: "La langue et son score de confiance sont le résultat de la détection de langue." }
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
  - title: What is named entity recognition (NER) in Azure Language?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/named-entity-recognition/overview
