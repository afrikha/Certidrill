id: ai901-1a-fair-yn-guardrail-category
objective: "1.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso deploys a chat model in Microsoft Foundry and keeps the default guardrail policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie un modèle de conversation dans Microsoft Foundry et conserve la stratégie de garde-fous par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "The Hate and fairness category covers content that attacks or uses discriminatory language about a person or an identity group.", fr: "La catégorie Hate and fairness (Haine et impartialité) couvre le contenu qui attaque une personne ou un groupe identitaire, ou qui emploie un langage discriminatoire à leur égard." }
    - id: s2
      text: { en: "By default, the Hate and fairness filter is applied to prompts and to completions.", fr: "Par défaut, le filtre Hate and fairness s'applique aux invites et aux complétions." }
    - id: s3
      text: { en: "The Hate and fairness filter ensures that the model makes the same recommendation to people who are in similar situations.", fr: "Le filtre Hate and fairness garantit que le modèle fait la même recommandation aux personnes qui se trouvent dans des situations similaires." }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "In Foundry guardrails, Hate and fairness is a harm category for content that attacks or discriminates against a person or an identity group, and the default policy applies it with the Medium threshold to prompts and completions. A content filter classifies and blocks harmful language; it doesn't compare the outcomes that different groups receive, so the fairness of the solution's results still has to be assessed."
    fr: "Dans les garde-fous de Foundry, Hate and fairness est une catégorie de préjudice pour le contenu qui attaque ou discrimine une personne ou un groupe identitaire, et la stratégie par défaut l'applique avec le seuil Medium aux invites et aux complétions. Un filtre de contenu classe et bloque le langage nuisible ; il ne compare pas les résultats obtenus par différents groupes : l'impartialité des résultats de la solution reste donc à évaluer."
references:
  - title: "Harm categories and severity levels in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-severity-levels
  - title: "Default Guardrail policies for Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/default-safety-policies
