id: ai901-1c-sp-who-said-what
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam transcribes its recorded project meetings with Azure Speech. In each transcript, the sentences must be attributed to the different people who spoke during the meeting.

    Which feature of speech recognition should Fabrikam use?
  fr: |
    Fabrikam transcrit ses réunions de projet enregistrées avec Azure Speech. Dans chaque transcription, les phrases doivent être attribuées aux différentes personnes qui ont parlé pendant la réunion.

    Quelle fonctionnalité de la reconnaissance vocale Fabrikam doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Language identification", fr: "L'identification de la langue" } }
    - { id: b, text: { en: "Diarization", fr: "La diarisation" } }
    - { id: c, text: { en: "A phrase list", fr: "Une liste d'expressions" } }
    - { id: d, text: { en: "Custom speech", fr: "La reconnaissance vocale personnalisée (Custom Speech)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Diarization distinguishes and separates the different speakers of an audio recording, so each part of the transcript can be attributed to a speaker. It is intended for conversations, meetings and other multi-speaker audio.
    fr: |
      La diarisation distingue et sépare les différents interlocuteurs d'un enregistrement audio : chaque partie de la transcription peut ainsi être attribuée à un interlocuteur. Elle est prévue pour les conversations, les réunions et tout audio à plusieurs voix.
  options:
    a: { en: "Language identification finds which language is spoken, not who is speaking.", fr: "L'identification de la langue détermine quelle langue est parlée, pas qui parle." }
    c: { en: "A phrase list improves the recognition of specific words or names; it does not separate speakers.", fr: "Une liste d'expressions améliore la reconnaissance de mots ou de noms précis ; elle ne sépare pas les interlocuteurs." }
    d: { en: "Custom speech improves recognition accuracy for a domain or for audio conditions; it does not attribute sentences to speakers.", fr: "La reconnaissance vocale personnalisée améliore la précision pour un domaine ou des conditions audio ; elle n'attribue pas les phrases aux interlocuteurs." }
references:
  - title: What is speech to text?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-to-text
