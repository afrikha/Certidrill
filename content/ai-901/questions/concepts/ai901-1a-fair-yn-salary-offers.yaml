id: ai901-1a-fair-yn-salary-offers
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware builds an AI system that proposes salary offers for new employees.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware crée un système d'IA qui propose des offres salariales pour les nouveaux employés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "Applying the same model to every candidate guarantees that all groups are treated fairly.", fr: "Appliquer le même modèle à tous les candidats garantit que tous les groupes sont traités équitablement." }
    - id: s2
      text: { en: "Evaluating how the historical salary data was collected helps Proseware identify bias.", fr: "Évaluer la manière dont les données salariales historiques ont été collectées aide Proseware à identifier des biais." }
    - id: s3
      text: { en: "Having trained employees review the proposals of the system helps Proseware limit unfair decisions.", fr: "Faire relire les propositions du système par des employés formés aide Proseware à limiter les décisions inéquitables." }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A single model applied to everyone reproduces any bias in its data, so it guarantees nothing. Bias is found by evaluating where the data came from and how well it represents people; historical salaries can carry past inequalities. Microsoft recommends pairing AI-driven decisions about people with human review by employees who are trained to understand the results."
    fr: "Un modèle unique appliqué à tous reproduit les biais de ses données : il ne garantit donc rien. On trouve les biais en évaluant la provenance des données et leur représentativité ; des salaires historiques peuvent porter des inégalités passées. Microsoft recommande d'associer les décisions pilotées par l'IA qui concernent des personnes à une révision humaine par des employés formés à comprendre les résultats."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
