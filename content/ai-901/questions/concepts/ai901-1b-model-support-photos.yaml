id: ai901-1b-model-support-photos
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam is building a real-time support chat. Customers type a question and can attach a photo of a damaged product. The model must process the text and the photo in the same prompt and answer in text. The application handles a high volume of requests, so cost and response time must be kept low.

    Which model should you deploy?
  fr: |
    Fabrikam crée une conversation de support en temps réel. Les clients saisissent une question et peuvent joindre la photo d'un produit endommagé. Le modèle doit traiter le texte et la photo dans la même invite et répondre en texte. L'application traite un grand volume de requêtes : le coût et le temps de réponse doivent donc rester faibles.

    Quel modèle devez-vous déployer ?
body:
  options:
    - { id: a, text: "o3-mini" }
    - { id: b, text: "gpt-image-1-mini" }
    - { id: c, text: "gpt-4.1-mini" }
    - { id: d, text: "text-embedding-3-small" }
answer: { optionId: c }
explanation:
  correct:
    en: "GPT-4.1-mini is a general-purpose multimodal model: it processes text and images together and answers in text. The GPT-4.1 models are optimized for speed and low-latency, high-volume workloads such as real-time chat, and the mini variant is a smaller model of the family."
    fr: "GPT-4.1-mini est un modèle multimodal à usage général : il traite ensemble le texte et les images et répond en texte. Les modèles GPT-4.1 sont optimisés pour la vitesse et pour les charges de travail à faible latence et à gros volume comme la conversation en temps réel, et la variante mini est un modèle plus petit de la famille."
  options:
    a:
      en: "o3-mini is a reasoning model that accepts only text, and reasoning models spend more time on each request."
      fr: "o3-mini est un modèle de raisonnement qui n'accepte que du texte, et les modèles de raisonnement passent plus de temps sur chaque requête."
    b:
      en: "gpt-image-1-mini creates images; it doesn't answer questions about a photo in text."
      fr: "gpt-image-1-mini crée des images ; il ne répond pas en texte à des questions sur une photo."
    d:
      en: "text-embedding-3-small converts text into vectors; it can't read a photo or hold a conversation."
      fr: "text-embedding-3-small convertit du texte en vecteurs ; il ne peut ni lire une photo ni tenir une conversation."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Foundry Models sold by Azure"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
