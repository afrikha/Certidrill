id: ai901-1a-incl-two-scenarios
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Which two scenarios are examples of the inclusiveness principle?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux scénarios qui sont des exemples du principe d'inclusion ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Image recognition describes photos for users who are blind.", fr: "La reconnaissance d'images décrit des photos aux utilisateurs aveugles." }
    - id: b
      text: { en: "The recommendations of a model are compared for men and for women.", fr: "Les recommandations d'un modèle sont comparées pour les hommes et pour les femmes." }
    - id: c
      text: { en: "A voice interface lets users who are unable to use a keyboard operate an application.", fr: "Une interface vocale permet aux utilisateurs qui ne peuvent pas se servir d'un clavier d'utiliser une application." }
    - id: d
      text: { en: "Users are told that an assistant can make mistakes.", fr: "Les utilisateurs sont informés qu'un assistant peut faire des erreurs." }
    - id: e
      text: { en: "A team monitors the performance of a model after its release.", fr: "Une équipe surveille les performances d'un modèle après sa mise en service." }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "Inclusiveness removes the barriers that exclude people: image recognition gives people who are blind access to visual content, and a voice interface gives access to people who are unable to use a keyboard."
    fr: "L'inclusion supprime les obstacles qui excluent des personnes : la reconnaissance d'images donne aux personnes aveugles l'accès au contenu visuel, et une interface vocale donne l'accès aux personnes qui ne peuvent pas se servir d'un clavier."
  options:
    b: { en: "Comparing results between groups is a fairness practice.", fr: "Comparer les résultats entre des groupes est une pratique d'impartialité." }
    d: { en: "Telling users about the limits of a system is transparency.", fr: "Informer les utilisateurs des limites d'un système relève de la transparence." }
    e: { en: "Monitoring performance is a reliability and safety practice.", fr: "Surveiller les performances est une pratique de fiabilité et de sécurité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
