id: ai901-1b-model-planning-agent
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is building an agent that analyzes technical reports, plans multi-step tasks and orchestrates several tools. The quality of the reasoning matters more than the response time.

    Which model family should you choose?
  fr: |
    Adatum crée un agent qui analyse des rapports techniques, planifie des tâches en plusieurs étapes et orchestre plusieurs outils. La qualité du raisonnement compte plus que le temps de réponse.

    Quelle famille de modèles devez-vous choisir ?
body:
  options:
    - { id: a, text: "GPT-Image-1" }
    - { id: b, text: "GPT-4.1" }
    - { id: c, text: "text-embedding-3" }
    - { id: d, text: "GPT-5" }
answer: { optionId: d }
explanation:
  correct:
    en: "The GPT-5 family is designed for multi-step reasoning, structured logic, planning and agentic workflows, such as code analysis or the orchestration of multi-tool agents. Reasoning models spend more time processing a request, which is acceptable here."
    fr: "La famille GPT-5 est conçue pour le raisonnement en plusieurs étapes, la logique structurée, la planification et les flux de travail agentiques, comme l'analyse de code ou l'orchestration d'agents à plusieurs outils. Les modèles de raisonnement passent plus de temps à traiter une requête, ce qui est acceptable ici."
  options:
    a:
      en: "The GPT-Image-1 family generates and edits images."
      fr: "La famille GPT-Image-1 génère et modifie des images."
    b:
      en: "GPT-4.1 is optimized for speed, efficiency and low-latency inference, which suits real-time chat and high-volume workloads rather than deep multi-step reasoning."
      fr: "GPT-4.1 est optimisé pour la vitesse, l'efficacité et l'inférence à faible latence, ce qui convient à la conversation en temps réel et aux gros volumes plutôt qu'au raisonnement approfondi en plusieurs étapes."
    c:
      en: "The text-embedding-3 models return vectors; they can't plan or call tools."
      fr: "Les modèles text-embedding-3 renvoient des vecteurs ; ils ne peuvent ni planifier ni appeler des outils."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Azure OpenAI reasoning models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
