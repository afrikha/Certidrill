id: ai901-1a-priv-two-actions-agent
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders prepares an AI agent that uses customer data.

    Which two actions support the privacy and security principle? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prépare un agent d'IA qui utilise des données de clients.

    Quelles sont les deux actions qui servent le principe de confidentialité et de sécurité ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Protect the customer data that the agent transfers to third parties.", fr: "Protéger les données des clients que l'agent transfère à des tiers." }
    - id: b
      text: { en: "Track and audit who accesses the customer data and how it is used.", fr: "Suivre et auditer qui accède aux données des clients et comment elles sont utilisées." }
    - id: c
      text: { en: "Publish the limitations of the agent for the people who use it.", fr: "Publier les limites de l'agent à l'intention des personnes qui l'utilisent." }
    - id: d
      text: { en: "Compare the answers of the agent across groups of similar customers.", fr: "Comparer les réponses de l'agent entre des groupes de clients similaires." }
    - id: e
      text: { en: "Test the agent in a lab and in real-world scenarios.", fr: "Tester l'agent en laboratoire et dans des scénarios réels." }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: "Protecting an AI system from bad actors includes protecting the personal and confidential data that is transferred to third parties. Tracking information about customer data, and auditing how it is accessed and used, is also part of the privacy and security principle."
    fr: "Protéger un système d'IA contre les acteurs malveillants inclut la protection des données personnelles et confidentielles transférées à des tiers. Suivre les informations relatives aux données des clients et auditer la manière dont elles sont consultées et utilisées fait aussi partie du principe de confidentialité et de sécurité."
  options:
    c: { en: "Publishing limitations is a transparency measure.", fr: "Publier les limites est une mesure de transparence." }
    d: { en: "Comparing results across similar groups is a fairness measure.", fr: "Comparer les résultats entre des groupes similaires est une mesure d'impartialité." }
    e: { en: "Testing in lab and real-world scenarios is a reliability and safety measure.", fr: "Tester en laboratoire et dans des scénarios réels est une mesure de fiabilité et de sécurité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
