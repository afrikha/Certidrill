id: ai901-1b-gen-train-vs-infer
objective: "1.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Which two statements about how a language model is trained and then used are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux affirmations vraies sur la façon dont un modèle de langage est entraîné puis utilisé ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "During inference, the model adjusts its weights after each response that it returns to the application.", fr: "Pendant l'inférence, le modèle ajuste ses pondérations après chaque réponse qu'il renvoie à l'application." } }
    - { id: b, text: { en: "During training, the model compares each predicted token with the actual next token and adjusts its weights.", fr: "Pendant l'entraînement, le modèle compare chaque jeton prédit au jeton suivant réel et ajuste ses pondérations." } }
    - { id: c, text: { en: "During inference, each predicted token is appended to the sequence before the next token is predicted.", fr: "Pendant l'inférence, chaque jeton prédit est ajouté à la séquence avant la prédiction du jeton suivant." } }
    - { id: d, text: { en: "During training, the attention layers take into account the tokens that come after the token to predict.", fr: "Pendant l'entraînement, les couches d'attention tiennent compte des jetons situés après le jeton à prédire." } }
    - { id: e, text: { en: "During inference, the actual next token must be known before the model can calculate its prediction.", fr: "Pendant l'inférence, le jeton suivant réel doit être connu avant que le modèle puisse calculer sa prédiction." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "During training, the next token of the sequence is known, so the model compares its prediction with it and adjusts its weights to reduce the error. During inference, the weights are fixed: the model predicts the most probable token, appends it to the sequence and repeats until it predicts the end of the sequence."
    fr: "Pendant l'entraînement, le jeton suivant de la séquence est connu : le modèle y compare donc sa prédiction et ajuste ses pondérations pour réduire l'erreur. Pendant l'inférence, les pondérations sont figées : le modèle prédit le jeton le plus probable, l'ajoute à la séquence et recommence jusqu'à prédire la fin de la séquence."
  options:
    a:
      en: "Weights are adjusted during training only; generating a response doesn't change the model."
      fr: "Les pondérations ne sont ajustées que pendant l'entraînement ; générer une réponse ne modifie pas le modèle."
    d:
      en: "Training uses masked attention, which ignores the tokens that follow the one being predicted."
      fr: "L'entraînement utilise l'attention masquée, qui ignore les jetons situés après celui à prédire."
    e:
      en: "The actual next token is known only in the training data; at inference there is nothing to compare with."
      fr: "Le jeton suivant réel n'est connu que dans les données d'entraînement ; à l'inférence, il n'y a rien à comparer."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
