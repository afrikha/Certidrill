id: ai901-1a-fair-domain-expert
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam designs an AI system that produces credit scores for consumers. The scores will inform decisions that have consequences for people.

    You need to apply Microsoft's fairness guidance to the design and the deployment of the system.

    Which participant should you add to the team for this purpose?
  fr: |
    Fabrikam conçoit un système d'IA qui produit des scores de crédit pour des particuliers. Ces scores orienteront des décisions qui ont des conséquences pour les personnes.

    Vous devez appliquer les recommandations de Microsoft en matière d'impartialité à la conception et au déploiement du système.

    Quel participant devez-vous ajouter à l'équipe dans ce but ?
body:
  options:
    - id: a
      text: { en: "A data protection officer", fr: "Un délégué à la protection des données" }
    - id: b
      text: { en: "A consumer credit subject matter expert", fr: "Un expert du crédit à la consommation" }
    - id: c
      text: { en: "An accessibility specialist", fr: "Un spécialiste de l'accessibilité" }
    - id: d
      text: { en: "A network security engineer", fr: "Un ingénieur en sécurité réseau" }
answer: { optionId: b }
explanation:
  correct:
    en: "For fairness, Microsoft recommends human review and domain expertise: subject matter experts take part in the design and deployment of systems that inform consequential decisions about people, for example a consumer credit expert for a credit scoring system. The expert recognizes results that the domain doesn't justify."
    fr: "Pour l'impartialité, Microsoft recommande la révision humaine et l'expertise du domaine : des experts du domaine participent à la conception et au déploiement des systèmes qui orientent des décisions importantes concernant des personnes, par exemple un expert du crédit à la consommation pour un système de score de crédit. L'expert reconnaît les résultats que le domaine ne justifie pas."
  options:
    a: { en: "A data protection officer deals with how personal data is collected and protected, which is the privacy and security principle.", fr: "Un délégué à la protection des données s'occupe de la collecte et de la protection des données personnelles : cela relève du principe de confidentialité et de sécurité." }
    c: { en: "An accessibility specialist helps make the system usable by people with disabilities, which is the inclusiveness principle.", fr: "Un spécialiste de l'accessibilité aide à rendre le système utilisable par les personnes en situation de handicap : cela relève du principe d'inclusion." }
    d: { en: "A network security engineer protects the system against unauthorized access, which is the privacy and security principle.", fr: "Un ingénieur en sécurité réseau protège le système contre les accès non autorisés : cela relève du principe de confidentialité et de sécurité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
