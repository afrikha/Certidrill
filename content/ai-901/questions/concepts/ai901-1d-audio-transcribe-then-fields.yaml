id: ai901-1d-audio-transcribe-then-fields
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank records its customer support calls. For each recording, the bank wants a summary of the call and the list of the topics discussed, returned as structured data.

    Which sequence of techniques produces this result?
  fr: |
    Woodgrove Bank enregistre ses appels de support client. Pour chaque enregistrement, la banque veut un résumé de l'appel et la liste des sujets abordés, renvoyés sous forme de données structurées.

    Quel enchaînement de techniques produit ce résultat ?
body:
  options:
  - id: a
    text:
      en: OCR to read the text, then layout analysis to locate the tables
      fr: "L'OCR pour lire le texte, puis l'analyse de la disposition pour repérer les tableaux"
  - id: b
    text:
      en: Speech synthesis to create audio, then sentiment analysis of that audio
      fr: "La synthèse vocale pour créer de l'audio, puis l'analyse des sentiments de cet audio"
  - id: c
    text:
      en: Speech recognition to produce a transcript, then generation of the fields from the transcript
      fr: La reconnaissance vocale pour produire une transcription, puis la génération des champs à partir de la transcription
  - id: d
    text:
      en: Shot detection to split the recording, then classification of each key frame
      fr: "La détection des plans pour découper l'enregistrement, puis la classification de chaque image clé"
answer:
  optionId: c
explanation:
  correct:
    en: Audio is first transcribed by speech recognition. A generative model then uses the transcript to produce the fields of the schema, such as a summary or the topics of the call, and the result is returned as structured data.
    fr: "L'audio est d'abord transcrit par la reconnaissance vocale. Un modèle génératif utilise ensuite la transcription pour produire les champs du schéma, comme un résumé ou les sujets de l'appel, et le résultat est renvoyé sous forme de données structurées."
  options:
    a:
      en: OCR and layout analysis apply to documents and images of text, not to recorded speech.
      fr: "L'OCR et l'analyse de la disposition s'appliquent aux documents et aux images de texte, pas à la parole enregistrée."
    b:
      en: Speech synthesis converts text into audio, which is the opposite of what a recording requires.
      fr: "La synthèse vocale convertit du texte en audio, soit l'inverse de ce qu'exige un enregistrement."
    d:
      en: "Shot detection and key frames are video techniques; a call recording contains no images."
      fr: "La détection des plans et les images clés sont des techniques vidéo ; un enregistrement d'appel ne contient pas d'images."
references:
- title: Extract information from audio and video
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video"
- title: Azure Content Understanding in Foundry Tools audio overview
  url: "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview"
