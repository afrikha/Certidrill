id: ai901-1d-yn-voicemail-extraction
objective: "1.3.5"
type: "yesno_statements"
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to extract information from the voicemail messages that its sales team receives.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit d'extraire des informations des messages vocaux que reçoit son équipe commerciale.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Optical character recognition (OCR) is the technique that converts the recorded speech into a transcript.
      fr: La reconnaissance optique de caractères (OCR) est la technique qui convertit la parole enregistrée en transcription.
  - id: s2
    text:
      en: An audio analyzer can return the callback number that a caller gives as a separate field.
      fr: Un analyseur audio peut renvoyer le numéro de rappel donné par un appelant sous forme de champ distinct.
  - id: s3
    text:
      en: A summary of each message can be generated from its transcript.
      fr: Un résumé de chaque message peut être généré à partir de sa transcription.
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: "Speech is converted into a transcript by speech recognition; OCR reads text in images and documents. With a schema that lists fields such as the caller, a message summary and the callback number, an audio analyzer returns each of them as a separate value, generated from the transcript."
    fr: "La parole est convertie en transcription par la reconnaissance vocale ; l'OCR lit le texte des images et des documents. Avec un schéma qui liste des champs comme l'appelant, un résumé du message et le numéro de rappel, un analyseur audio renvoie chacun d'eux sous forme de valeur distincte, générée à partir de la transcription."
references:
- title: Extract information from audio and video
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video"
- title: Azure Content Understanding in Foundry Tools audio overview
  url: "https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview"
