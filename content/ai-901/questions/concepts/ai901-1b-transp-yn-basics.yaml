id: ai901-1b-transp-yn-basics
objective: "1.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Telling users that they are interacting with an AI system supports the transparency principle."
        fr: "Indiquer aux utilisateurs qu'ils interagissent avec un système d'IA va dans le sens du principe de transparence."
    - id: s2
      text:
        en: "To be transparent, a bank must reveal the confidential data that was used to train its loan approval model."
        fr: "Pour être transparente, une banque doit révéler les données confidentielles qui ont servi à entraîner son modèle d'approbation de prêts."
    - id: s3
      text:
        en: "Describing the known limitations of an AI system to its users supports the transparency principle."
        fr: "Décrire aux utilisateurs les limites connues d'un système d'IA va dans le sens du principe de transparence."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Transparency means making users aware of the presence of AI, of how the system works and of its potential limitations. It doesn't require disclosing confidential information: a bank can disclose that it uses AI and describe the features of the training data without revealing confidential details."
    fr: "La transparence consiste à informer les utilisateurs de la présence de l'IA, du fonctionnement du système et de ses limites éventuelles. Elle n'impose pas de divulguer des informations confidentielles : une banque peut indiquer qu'elle utilise l'IA et décrire les caractéristiques des données d'entraînement sans révéler de détails confidentiels."
references:
  - title: "Responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai
  - title: "Responsible AI for agent design"
    url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
