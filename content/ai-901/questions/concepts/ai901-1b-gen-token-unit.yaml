id: ai901-1b-gen-token-unit
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the context of a generative AI model, what is a token?
  fr: |
    Dans le contexte d'un modèle IA génératif, qu'est-ce qu'un jeton (token) ?
body:
  options:
    - { id: a, text: { en: "A secret value that authenticates a request to the endpoint of the model", fr: "Une valeur secrète qui authentifie une requête adressée au point de terminaison du modèle" } }
    - { id: b, text: { en: "A vector of numeric values that encodes the meaning of a word in context", fr: "Un vecteur de valeurs numériques qui encode le sens d'un mot dans son contexte" } }
    - { id: c, text: { en: "A unit of text that the model processes, such as a word or part of a word", fr: "Une unité de texte que le modèle traite, par exemple un mot ou une partie de mot" } }
    - { id: d, text: { en: "The complete text that an application submits to the model in one request", fr: "Le texte complet qu'une application soumet au modèle dans une requête" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A token is the smallest unit of text that a generative AI model processes: a word, a sub-word, a character or a punctuation mark. Models read prompts and generate responses token by token, and limits such as tokens per minute are counted in tokens."
    fr: "Un jeton est la plus petite unité de texte qu'un modèle IA génératif traite : un mot, un sous-mot, un caractère ou un signe de ponctuation. Les modèles lisent les invites et génèrent les réponses jeton par jeton, et les limites comme les jetons par minute se comptent en jetons."
  options:
    a:
      en: "A secret value that authenticates a call to an endpoint is a key, not a token of the model."
      fr: "Une valeur secrète qui authentifie un appel à un point de terminaison est une clé, pas un jeton du modèle."
    b:
      en: "A vector that encodes meaning is an embedding; it represents a token but isn't the token."
      fr: "Un vecteur qui encode le sens est un embedding ; il représente un jeton mais n'est pas le jeton."
    d:
      en: "The text submitted to the model is the prompt, which is made of many tokens."
      fr: "Le texte soumis au modèle est l'invite, qui se compose de nombreux jetons."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
