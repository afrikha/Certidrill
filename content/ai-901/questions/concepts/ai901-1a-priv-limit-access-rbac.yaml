id: ai901-1a-priv-limit-access-rbac
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Microsoft Foundry project that contains model deployments and data. Only the members of the data science team should be able to use them.

    What should you use to limit access?
  fr: |
    Vous disposez d'un projet Microsoft Foundry qui contient des déploiements de modèles et des données. Seuls les membres de l'équipe de science des données doivent pouvoir les utiliser.

    Que devez-vous utiliser pour limiter l'accès ?
body:
  options:
    - id: a
      text: { en: "Guardrails (content filters)", fr: "Des garde-fous (filtres de contenu)" }
    - id: b
      text: { en: "PII detection in Azure Language", fr: "La détection des PII d'Azure Language" }
    - id: c
      text: { en: "Role-based access control (RBAC)", fr: "Le contrôle d'accès en fonction du rôle (RBAC)" }
    - id: d
      text: { en: "Risk and safety evaluators", fr: "Des évaluateurs de risque et de sécurité" }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Entra ID makes sure that only the right people and services can access AI resources, and it enables role-based access control (RBAC) to limit access to model deployments, resources and data."
    fr: "Microsoft Entra ID garantit que seuls les personnes et les services appropriés peuvent accéder aux ressources d'IA, et il permet le contrôle d'accès en fonction du rôle (RBAC) pour limiter l'accès aux déploiements de modèles, aux ressources et aux données."
  options:
    a: { en: "Guardrails filter harmful content in prompts and responses; they don't decide who may use a deployment.", fr: "Les garde-fous filtrent le contenu nuisible des invites et des réponses ; ils ne décident pas qui peut utiliser un déploiement." }
    b: { en: "PII detection finds and redacts personal data in text; it doesn't control access to resources.", fr: "La détection des PII trouve et masque les données personnelles dans un texte ; elle ne contrôle pas l'accès aux ressources." }
    d: { en: "Evaluators measure the risks in the output of a model or an agent; they don't control access.", fr: "Les évaluateurs mesurent les risques dans la sortie d'un modèle ou d'un agent ; ils ne contrôlent pas l'accès." }
references:
  - title: "Developing AI apps on Azure"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/3-develop-ai-apps
