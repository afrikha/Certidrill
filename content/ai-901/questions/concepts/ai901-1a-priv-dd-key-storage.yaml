id: ai901-1a-priv-dd-key-storage
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An application calls a model endpoint in Microsoft Foundry and authenticates with a key.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application appelle le point de terminaison d'un modèle dans Microsoft Foundry et s'authentifie avec une clé.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The key should be stored as a secret in [[store]]. The application should retrieve the secret at runtime by using [[how]].
    fr: |
      La clé doit être stockée en tant que secret dans [[store]]. L'application doit récupérer le secret au moment de l'exécution à l'aide [[how]].
  slots:
    - id: store
      options:
        - { id: code, text: { en: "the application code", fr: "le code de l'application" } }
        - { id: repo, text: { en: "a GitHub repository", fr: "un dépôt GitHub" } }
        - { id: kv, text: "Azure Key Vault" }
    - id: how
      options:
        - { id: mi, text: { en: "a managed identity", fr: "d'une identité managée" } }
        - { id: pwd, text: { en: "a password that is saved in a configuration file", fr: "d'un mot de passe enregistré dans un fichier de configuration" } }
        - { id: anon, text: { en: "an anonymous request", fr: "d'une requête anonyme" } }
answer:
  values: { store: kv, how: mi }
explanation:
  correct:
    en: "In Azure, secrets such as keys are stored in Azure Key Vault, not in code or in GitHub. The application retrieves the secret at runtime with a secure method, a managed identity, so that no other credential has to be stored with the application."
    fr: "Dans Azure, les secrets comme les clés sont stockés dans Azure Key Vault, pas dans le code ni dans GitHub. L'application récupère le secret au moment de l'exécution avec une méthode sécurisée, une identité managée : aucune autre information d'identification n'a donc besoin d'être stockée avec l'application."
  options:
    code: { en: "A key in the code is exposed to everyone who can read the code.", fr: "Une clé dans le code est exposée à tous ceux qui peuvent lire le code." }
    repo: { en: "A repository spreads the key to everyone who can access it.", fr: "Un dépôt diffuse la clé à tous ceux qui peuvent y accéder." }
    pwd: { en: "A saved password is one more secret to protect.", fr: "Un mot de passe enregistré est un secret de plus à protéger." }
    anon: { en: "An anonymous request has no identity that Key Vault could authorize.", fr: "Une requête anonyme n'a aucune identité que Key Vault pourrait autoriser." }
references:
  - title: "Developing AI apps on Azure"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/3-develop-ai-apps
