id: ai901-1c-wl-product-descriptions
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The marketing team of Tailspin Toys wants a solution that writes a new description for each product in the catalog from a short list of features.

    Which AI workload does this scenario represent?
  fr: |
    L'équipe marketing de Tailspin Toys veut une solution qui rédige une nouvelle description pour chaque produit du catalogue à partir d'une courte liste de caractéristiques.

    Quelle charge de travail d'IA ce scénario représente-t-il ?
body:
  options:
    - { id: a, text: { en: "Text analysis", fr: "Analyse de texte" } }
    - { id: b, text: { en: "Information extraction", fr: "Extraction d'informations" } }
    - { id: c, text: { en: "Generative AI", fr: "IA générative" } }
    - { id: d, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Generative AI creates new content, such as text, code or images, in answer to a prompt. Writing product descriptions that did not exist before is a typical generative AI scenario.
    fr: |
      L'IA générative crée du contenu nouveau, comme du texte, du code ou des images, en réponse à une invite. Rédiger des descriptions de produits qui n'existaient pas est un scénario type d'IA générative.
  options:
    a: { en: "Text analysis extracts meaning, such as sentiment or key phrases, from existing text; it does not write new text.", fr: "L'analyse de texte extrait du sens, comme les sentiments ou les expressions clés, d'un texte existant ; elle ne rédige pas de nouveau texte." }
    b: { en: "Information extraction turns existing documents, images, audio or video into structured data.", fr: "L'extraction d'informations transforme des documents, des images, de l'audio ou des vidéos existants en données structurées." }
    d: { en: "Computer vision interprets images and video; the scenario has no visual input.", fr: "La vision par ordinateur interprète des images et des vidéos ; le scénario ne comporte aucune entrée visuelle." }
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/1-introduction
