id: ai901-1c-sp-brand-voice
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Azure Speech in Foundry Tools for its telephone assistant. The spoken answers of the assistant must use a synthetic voice that is unique to the Woodgrove brand, instead of one of the voices that are available out of the box.

    What should the bank use?
  fr: |
    Woodgrove Bank utilise Azure Speech dans Foundry Tools pour son assistant téléphonique. Les réponses parlées de l'assistant doivent utiliser une voix de synthèse propre à la marque Woodgrove, plutôt que l'une des voix disponibles par défaut.

    Que doit utiliser la banque ?
body:
  options:
    - { id: a, text: { en: "Custom speech", fr: "La reconnaissance vocale personnalisée (Custom Speech)" } }
    - { id: b, text: { en: "A phrase list", fr: "Une liste d'expressions" } }
    - { id: c, text: { en: "Pronunciation assessment", fr: "L'évaluation de la prononciation" } }
    - { id: d, text: { en: "A custom voice", fr: "Une voix personnalisée" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Besides its predefined voices, text to speech lets you develop custom voices that are unique to a product or a brand. A custom voice is therefore the synthesis feature that gives the assistant its own voice.
    fr: |
      En plus de ses voix prédéfinies, la synthèse vocale permet de développer des voix personnalisées propres à un produit ou à une marque. Une voix personnalisée est donc la fonctionnalité de synthèse qui donne à l'assistant sa propre voix.
  options:
    a: { en: "Custom speech improves the accuracy of speech recognition, for example for domain vocabulary; it does not change the voice of spoken output.", fr: "La reconnaissance vocale personnalisée améliore la précision de la reconnaissance, par exemple pour le vocabulaire d'un domaine ; elle ne change pas la voix de la sortie parlée." }
    b: { en: "A phrase list helps speech recognition with specific words or names; it has no effect on synthesis.", fr: "Une liste d'expressions aide la reconnaissance vocale sur des mots ou des noms précis ; elle n'a aucun effet sur la synthèse." }
    c: { en: "Pronunciation assessment evaluates how a person speaks; it does not create a voice.", fr: "L'évaluation de la prononciation évalue la façon dont une personne parle ; elle ne crée pas de voix." }
references:
  - title: Speech synthesis
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
  - title: What is text to speech?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech
