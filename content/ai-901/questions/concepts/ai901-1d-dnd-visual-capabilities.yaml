id: ai901-1d-dnd-visual-capabilities
objective: "1.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You need to match each requirement to the visual AI capability that meets it.

    Which capability should you use for each requirement? To answer, drag the appropriate capability to each requirement. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez associer chaque besoin à la fonctionnalité d'IA visuelle qui y répond.

    Quelle fonctionnalité devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser la fonctionnalité appropriée vers chaque besoin. Chaque fonctionnalité peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: analysis
    text:
      en: Image analysis
      fr: "Analyse d'images"
  - id: t2i
    text:
      en: Text-to-image generation
      fr: "Génération d'images à partir de texte (text-to-image)"
  - id: edit
    text:
      en: Image editing (image-to-image)
      fr: "Modification d'une image existante (image-to-image)"
  - id: t2v
    text:
      en: Text-to-video generation
      fr: Génération de vidéos à partir de texte (text-to-video)
  - id: i2v
    text:
      en: Image-to-video generation
      fr: "Génération de vidéos à partir d'une image (image-to-video)"
  targets:
  - id: poster
    text:
      en: Create a poster from a written description only
      fr: "Créer une affiche à partir d'une simple description écrite"
  - id: caption
    text:
      en: Write a caption for each photo of a product catalog
      fr: "Rédiger une légende pour chaque photo d'un catalogue de produits"
  - id: animate
    text:
      en: Turn a still product photo into a short animated clip
      fr: "Transformer une photo fixe d'un produit en un court clip animé"
  - id: background
    text:
      en: Change the background of an existing product photo by following a text instruction
      fr: "Changer l'arrière-plan d'une photo de produit existante en suivant une instruction en texte"
answer:
  mapping:
    poster: t2i
    caption: analysis
    animate: i2v
    background: edit
explanation:
  correct:
    en: A poster created from a description alone is text-to-image generation. A caption is text produced from an image, which is image analysis by a vision-enabled model. Animating a still photo uses an image as the input of a video-generation model. Changing part of an existing picture is image editing by an image-generation model. Text-to-video generation starts from text only, so it fits none of the requirements.
    fr: "Une affiche créée à partir d'une seule description relève de la génération d'images à partir de texte. Une légende est un texte produit à partir d'une image : c'est de l'analyse d'images par un modèle compatible avec la vision. Animer une photo fixe utilise une image comme entrée d'un modèle de génération de vidéos. Changer une partie d'une image existante relève de la modification d'images par un modèle de génération d'images. La génération de vidéos à partir de texte part uniquement de texte ; elle ne correspond donc à aucun des besoins."
references:
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
- title: Video generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation"
