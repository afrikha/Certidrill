id: ai901-1b-gen-rag-policy
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso deploys a chat model. When employees ask about travel expenses, the model gives generic answers because it doesn't know Contoso's expense policy.

    A developer changes the application so that it retrieves the relevant sections of the policy and adds them to each prompt.

    Which technique does the application now use?
  fr: |
    Contoso déploie un modèle de conversation. Quand les employés posent des questions sur les frais de déplacement, le modèle donne des réponses génériques, car il ne connaît pas la politique de frais de Contoso.

    Un développeur modifie l'application pour qu'elle récupère les sections pertinentes de la politique et les ajoute à chaque invite.

    Quelle technique l'application utilise-t-elle désormais ?
body:
  options:
    - { id: a, text: { en: "Retrieval augmented generation (RAG)", fr: "La génération augmentée par récupération (RAG)" } }
    - { id: b, text: { en: "Tokenization of the policy documents", fr: "La tokenisation des documents de politique" } }
    - { id: c, text: { en: "Multi-head attention in the transformer", fr: "L'attention multi-têtes dans le transformer" } }
    - { id: d, text: { en: "Positional encoding of the tokens", fr: "L'encodage positionnel des jetons" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Retrieval augmented generation (RAG) retrieves relevant information, such as documents, and adds it to the prompt. The response of the model is then grounded in that information instead of relying only on what the model learned during training."
    fr: "La génération augmentée par récupération (RAG) récupère des informations pertinentes, par exemple des documents, et les ajoute à l'invite. La réponse du modèle est alors ancrée dans ces informations au lieu de reposer uniquement sur ce que le modèle a appris pendant l'entraînement."
  options:
    c:
      en: "Multi-head attention is an internal mechanism of the transformer; an application doesn't add documents with it."
      fr: "L'attention multi-têtes est un mécanisme interne du transformer ; une application ne s'en sert pas pour ajouter des documents."
    b:
      en: "Tokenization splits text into tokens; it happens for every prompt and adds no knowledge."
      fr: "La tokenisation découpe le texte en jetons ; elle a lieu pour chaque invite et n'apporte aucune connaissance."
    d:
      en: "Positional encoding records the order of the tokens inside the model."
      fr: "L'encodage positionnel indique l'ordre des jetons à l'intérieur du modèle."
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
