id: ai901-1c-wl-assembly-line
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A factory of Proseware installs cameras above an assembly line. A solution must detect, in real time, products that have surface defects or missing components.

    Which AI workload does this scenario represent?
  fr: |
    Une usine de Proseware installe des caméras au-dessus d'une chaîne de montage. Une solution doit détecter, en temps réel, les produits qui présentent des défauts de surface ou des composants manquants.

    Quelle charge de travail d'IA ce scénario représente-t-il ?
body:
  options:
    - { id: a, text: { en: "Text analysis", fr: "Analyse de texte" } }
    - { id: b, text: { en: "Speech", fr: "Reconnaissance et synthèse vocales" } }
    - { id: c, text: { en: "Generative AI", fr: "IA générative" } }
    - { id: d, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Computer vision enables software to interpret images, video and live camera feeds. Inspecting products on an assembly line to find defects or missing components is one of its classic uses.
    fr: |
      La vision par ordinateur permet à un logiciel d'interpréter des images, des vidéos et des flux de caméras en direct. Inspecter des produits sur une chaîne de montage pour trouver des défauts ou des composants manquants est l'un de ses usages classiques.
  options:
    a: { en: "Text analysis works on written text, not on camera images.", fr: "L'analyse de texte porte sur du texte écrit, pas sur des images de caméras." }
    b: { en: "Speech workloads handle spoken audio, which the scenario does not contain.", fr: "Les charges de travail vocales traitent de l'audio parlé, absent du scénario." }
    c: { en: "Generative AI creates new content; the need is to interpret existing images.", fr: "L'IA générative crée du contenu nouveau ; le besoin est d'interpréter des images existantes." }
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/1-introduction
