id: ai901-1a-fair-yn-primarily-fairness
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following situations, select **Yes** if the situation is primarily a fairness issue. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des situations suivantes, sélectionnez **Oui** si la situation est avant tout un problème d'impartialité. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "A grant selection system ranks applicants from rural schools lower than applicants from urban schools who have identical grades.", fr: "Un système de sélection de boursiers classe les candidats des écoles rurales moins bien que ceux des écoles urbaines ayant des notes identiques." }
    - id: s2
      text: { en: "An application is unusable for people who rely on a screen reader.", fr: "Une application est inutilisable pour les personnes qui dépendent d'un lecteur d'écran." }
    - id: s3
      text: { en: "A bank is unable to explain why its AI system rejected a loan application.", fr: "Une banque est incapable d'expliquer pourquoi son système d'IA a refusé une demande de prêt." }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Ranking applicants with identical grades differently because of their school affects similarly situated people in different ways, which is a fairness issue. An application that some people are unable to use is an inclusiveness issue. A decision that nobody is able to explain is a transparency issue."
    fr: "Classer différemment des candidats aux notes identiques à cause de leur école affecte différemment des personnes dans des situations similaires : c'est un problème d'impartialité. Une application que certaines personnes ne peuvent pas utiliser est un problème d'inclusion. Une décision que personne ne sait expliquer est un problème de transparence."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
