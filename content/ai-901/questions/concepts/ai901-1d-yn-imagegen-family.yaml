id: ai901-1d-yn-imagegen-family
objective: "1.3.4"
type: "yesno_statements"
difficulty: 2
status: draft
stem:
  en: |
    You are evaluating the image-generation models of the Microsoft Foundry model catalog.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez les modèles de génération d'images du catalogue de modèles de Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: FLUX is a family of video-generation models.
      fr: FLUX est une famille de modèles de génération de vidéos.
  - id: s2
    text:
      en: GPT-Image-1 can edit an existing image in addition to creating an image from a text prompt.
      fr: "GPT-Image-1 peut modifier une image existante, en plus de créer une image à partir d'une invite en texte."
  - id: s3
    text:
      en: GPT-Image-1.5 is the lightweight model of its family, intended mainly for low-cost, high-volume generation.
      fr: GPT-Image-1.5 est le modèle léger de sa famille, destiné surtout à la génération à faible coût et en grand volume.
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: "FLUX is a family of image-generation models from Black Forest Labs that produces photorealistic still images. GPT-Image-1 supports text-to-image generation, image variations and precise editing of an image. The lightweight, cost-efficient model for high-volume generation is GPT-Image-1-Mini; GPT-Image-1.5 is the most advanced, high-fidelity model."
    fr: "FLUX est une famille de modèles de génération d'images de Black Forest Labs, qui produit des images fixes photoréalistes. GPT-Image-1 prend en charge la génération d'images à partir de texte, les variantes d'images et la modification précise d'une image. Le modèle léger et économique pour la génération en grand volume est GPT-Image-1-Mini ; GPT-Image-1.5 est le modèle le plus avancé, à haute fidélité."
references:
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
