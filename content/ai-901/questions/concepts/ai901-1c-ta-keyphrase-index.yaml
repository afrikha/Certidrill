id: ai901-1c-ta-keyphrase-index
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a knowledge base of several thousand support articles. To improve search, the company wants to index each article by the main concepts that it discusses.

    Which text analysis technique should Proseware use?
  fr: |
    Proseware possède une base de connaissances de plusieurs milliers d'articles de support. Pour améliorer la recherche, l'entreprise veut indexer chaque article selon les principaux concepts qu'il aborde.

    Quelle technique d'analyse de texte Proseware doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Key phrase extraction", fr: "Extraction d'expressions clés" } }
    - { id: b, text: { en: "Sentiment analysis", fr: "Analyse des sentiments" } }
    - { id: c, text: { en: "Language detection", fr: "Détection de langue" } }
    - { id: d, text: { en: "Summarization", fr: "Résumé de texte" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Key phrase extraction, also called keyword extraction, identifies the main concepts of a text and returns them as a list of phrases. This list is what a search index needs to tag each article.
    fr: |
      L'extraction d'expressions clés, aussi appelée extraction de mots clés, identifie les principaux concepts d'un texte et les renvoie sous forme de liste d'expressions. Cette liste est ce dont un index de recherche a besoin pour étiqueter chaque article.
  options:
    b: { en: "Sentiment analysis says whether a text is positive, negative or neutral; it does not list its topics.", fr: "L'analyse des sentiments indique si un texte est positif, négatif ou neutre ; elle ne liste pas ses sujets." }
    c: { en: "Language detection returns the language in which the text is written, not its concepts.", fr: "La détection de langue renvoie la langue dans laquelle le texte est écrit, pas ses concepts." }
    d: { en: "Summarization returns a shorter text, not a list of terms to index.", fr: "Le résumé renvoie un texte plus court, pas une liste de termes à indexer." }
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
  - title: What is key phrase extraction in Azure Language in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/key-phrase-extraction/overview
