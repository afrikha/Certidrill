id: ai901-1c-deploy-provisioned
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a customer-facing assistant on a model deployed in Microsoft Foundry. The assistant receives a high and predictable volume of requests all day. Fabrikam needs guaranteed capacity and consistent latency, and has no data residency requirement.

    Which deployment type should Fabrikam use?
  fr: |
    Fabrikam exploite un assistant destiné à ses clients sur un modèle déployé dans Microsoft Foundry. L'assistant reçoit toute la journée un volume de requêtes élevé et prévisible. Fabrikam a besoin d'une capacité garantie et d'une latence régulière, et n'a aucune exigence de résidence des données.

    Quel type de déploiement Fabrikam doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Global Provisioned" }
    - { id: b, text: "Global Standard" }
    - { id: c, text: "Global Batch" }
    - { id: d, text: "Standard" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A provisioned deployment reserves capacity in provisioned throughput units (PTUs). It gives guaranteed throughput with lower and more consistent latency, which suits a predictable high volume. Without a residency requirement, the global variant is appropriate.
    fr: |
      Un déploiement approvisionné réserve de la capacité en unités de débit approvisionné (PTU). Il apporte un débit garanti et une latence plus basse et plus régulière, ce qui convient à un gros volume prévisible. Sans exigence de résidence, la variante globale convient.
  options:
    b: { en: "Global Standard is pay per token and best effort: it does not reserve capacity, so latency can vary.", fr: "Global Standard est facturé au jeton et fonctionne au mieux : il ne réserve pas de capacité, la latence peut donc varier." }
    c: { en: "Global Batch processes asynchronous jobs with a 24-hour target; it cannot serve an interactive assistant.", fr: "Global Batch traite des travaux asynchrones avec un délai cible de 24 heures ; il ne peut pas servir un assistant interactif." }
    d: { en: "Standard is pay per token and is meant for low to medium volume inside one Azure geography; it does not guarantee throughput.", fr: "Standard est facturé au jeton et vise un volume faible à moyen dans une zone géographique Azure ; il ne garantit pas le débit." }
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
