id: ai901-1d-vision-photo-questions
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a support app. Customers send photos of faulty products, and the app must answer free-form questions about what each photo shows.

    Which type of model should Contoso use?
  fr: |
    Contoso crée une application de support. Les clients envoient des photos de produits défectueux, et l'application doit répondre à des questions libres sur ce que montre chaque photo.

    Quel type de modèle faut-il utiliser ?
body:
  options:
  - id: a
    text:
      en: An image-generation model
      fr: "Un modèle de génération d'images"
  - id: b
    text:
      en: A vision-enabled multimodal model
      fr: Un modèle multimodal compatible avec la vision
  - id: c
    text:
      en: A video-generation model
      fr: Un modèle de génération de vidéos
  - id: d
    text:
      en: An embedding model
      fr: "Un modèle d'embedding"
answer:
  optionId: b
explanation:
  correct:
    en: A vision-enabled multimodal model accepts an image and a text instruction in the same prompt and answers in natural language. It can describe a photo and answer questions about the objects, the text or the scene that it shows.
    fr: "Un modèle multimodal compatible avec la vision accepte une image et une instruction en texte dans la même invite, et répond en langage naturel. Il peut décrire une photo et répondre à des questions sur les objets, le texte ou la scène qu'elle montre."
  options:
    a:
      en: "An image-generation model creates a new image from a description; it does not interpret a photo that it receives."
      fr: "Un modèle de génération d'images crée une nouvelle image à partir d'une description ; il n'interprète pas une photo qu'il reçoit."
    c:
      en: "A video-generation model produces video clips from a prompt; it does not answer questions about a photo."
      fr: "Un modèle de génération de vidéos produit des clips vidéo à partir d'une invite ; il ne répond pas à des questions sur une photo."
    d:
      en: "An embedding model represents content as numeric vectors for search and comparison; it does not produce an answer in natural language."
      fr: "Un modèle d'embedding représente un contenu sous forme de vecteurs numériques pour la recherche et la comparaison ; il ne produit pas de réponse en langage naturel."
references:
- title: Multimodal models for image analysis
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models"
