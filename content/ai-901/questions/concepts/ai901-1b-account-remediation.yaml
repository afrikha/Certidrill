id: ai901-1b-account-remediation
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam discovers that its product recommendation model has started to treat some groups of customers unfairly.

    According to the accountability principle, what should Fabrikam have in place so that the problem is corrected?
  fr: |
    Fabrikam découvre que son modèle de recommandation de produits s'est mis à traiter certains groupes de clients de manière inéquitable.

    Selon le principe de responsabilité, de quoi Fabrikam doit-elle disposer pour que le problème soit corrigé ?
body:
  options:
    - { id: a, text: { en: "A notice that tells customers that recommendations are generated by AI", fr: "Un avis qui indique aux clients que les recommandations sont générées par l'IA" } }
    - { id: b, text: { en: "A policy that deletes customer data when it's no longer needed", fr: "Une règle qui supprime les données des clients quand elles ne sont plus nécessaires" } }
    - { id: c, text: { en: "An interface that customers can use with assistive technologies", fr: "Une interface que les clients peuvent utiliser avec des technologies d'assistance" } }
    - { id: d, text: { en: "A clear system of governance that defines who carries out the correction", fr: "Un système clair de gouvernance qui définit qui effectue la correction" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Accountability includes establishing a clear system of accountability and governance to carry out remediation or correction when a model behaves unfairly or harmfully. Without designated people and a process, a detected problem has no owner."
    fr: "La responsabilité comprend la mise en place d'un système clair de responsabilité et de gouvernance pour mener les actions de correction quand un modèle se comporte de manière inéquitable ou nuisible. Sans personnes désignées ni processus, un problème détecté n'a pas de propriétaire."
  options:
    a:
      en: "A notice is a transparency measure; it doesn't organize the correction of the model."
      fr: "Un avis est une mesure de transparence ; il n'organise pas la correction du modèle."
    b:
      en: "Deleting unneeded data is a privacy measure and doesn't address unfair behavior."
      fr: "Supprimer les données inutiles est une mesure de confidentialité et ne traite pas un comportement inéquitable."
    c:
      en: "Support for assistive technologies is an inclusiveness measure."
      fr: "La prise en charge des technologies d'assistance est une mesure d'inclusion."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
