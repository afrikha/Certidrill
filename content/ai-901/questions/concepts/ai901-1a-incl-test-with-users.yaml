id: ai901-1a-incl-test-with-users
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team builds an AI-powered information kiosk for a train station. The kiosk must be usable by the widest possible audience.

    What should the team do to apply the inclusiveness principle?
  fr: |
    Une équipe crée une borne d'information basée sur l'IA pour une gare. La borne doit être utilisable par le public le plus large possible.

    Que doit faire l'équipe pour appliquer le principe d'inclusion ?
body:
  options:
    - id: a
      text: { en: "Encrypt the data that the kiosk collects from travelers.", fr: "Chiffrer les données que la borne collecte auprès des voyageurs." }
    - id: b
      text: { en: "Display a notice that says that the kiosk uses AI.", fr: "Afficher une mention indiquant que la borne utilise l'IA." }
    - id: c
      text: { en: "Monitor the error rate of the kiosk after its release.", fr: "Surveiller le taux d'erreur de la borne après sa mise en service." }
    - id: d
      text: { en: "Include people with disabilities in the testing of the kiosk.", fr: "Inclure des personnes en situation de handicap dans les tests de la borne." }
answer: { optionId: d }
explanation:
  correct:
    en: "To make an AI system inclusive, Microsoft recommends including people with disabilities in testing, which validates that the system is usable by the widest audience. The team also follows accessibility laws and adopts recognized accessibility standards."
    fr: "Pour rendre un système d'IA inclusif, Microsoft recommande d'inclure des personnes en situation de handicap dans les tests, ce qui valide que le système est utilisable par le public le plus large. L'équipe suit aussi les lois sur l'accessibilité et adopte des normes d'accessibilité reconnues."
  options:
    a: { en: "Encryption protects data, which is a privacy and security measure.", fr: "Le chiffrement protège les données : c'est une mesure de confidentialité et de sécurité." }
    b: { en: "Disclosing the use of AI is a transparency measure.", fr: "Signaler l'utilisation de l'IA est une mesure de transparence." }
    c: { en: "Monitoring performance after release is a reliability and safety measure.", fr: "Surveiller les performances après la mise en service est une mesure de fiabilité et de sécurité." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
