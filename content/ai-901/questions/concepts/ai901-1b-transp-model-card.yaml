id: ai901-1b-transp-model-card
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You plan to use a model from the Foundry model catalog in a customer-facing application.

    Before you deploy the model, you need to read the constraints and caveats that are documented for it.

    What should you review?
  fr: |
    Vous prévoyez d'utiliser un modèle du catalogue de modèles de Foundry dans une application destinée aux clients.

    Avant de déployer le modèle, vous devez lire les contraintes et les mises en garde documentées pour celui-ci.

    Que devez-vous consulter ?
body:
  options:
    - { id: a, text: { en: "The model card", fr: "La carte de modèle" } }
    - { id: b, text: { en: "The model leaderboard", fr: "Le classement de modèles" } }
    - { id: c, text: { en: "The model playground", fr: "Le terrain de jeu du modèle" } }
    - { id: d, text: { en: "The tokens per minute (TPM) limit", fr: "La limite de jetons par minute (TPM)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Each model entry in the Foundry model catalog includes responsible AI documentation: a model card with the constraints and caveats of the model. Reading it tells you what the model is meant for and where its limits are before you build on it."
    fr: "Chaque entrée du catalogue de modèles de Foundry comprend une documentation d'IA responsable : une carte de modèle avec les contraintes et les mises en garde du modèle. Sa lecture vous indique à quoi le modèle est destiné et où sont ses limites avant de l'utiliser."
  options:
    b:
      en: "Leaderboards rank models against each other on benchmarks; they don't document the caveats of one model."
      fr: "Les classements ordonnent les modèles entre eux selon des benchmarks ; ils ne documentent pas les mises en garde d'un modèle."
    c:
      en: "The playground is used to try prompts against a deployed model, not to read its documentation."
      fr: "Le terrain de jeu sert à essayer des invites sur un modèle déployé, pas à lire sa documentation."
    d:
      en: "The TPM limit is the rate limit of a deployment; it says nothing about the model's constraints."
      fr: "La limite TPM est la limite de débit d'un déploiement ; elle ne dit rien des contraintes du modèle."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Overview of Microsoft Foundry Models"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview
