id: ai901-1b-account-dd-admissions
objective: "1.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A university uses an AI system to rank applications for admission.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une université utilise un système d'IA pour classer les candidatures à l'admission.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      An admissions officer reviews every rejection that the system proposes and can overturn it. This measure applies the principle of [[m1]]. The university's website explains which criteria the system takes into account. This measure applies the principle of [[m2]].
    fr: |
      Un responsable des admissions relit chaque refus proposé par le système et peut l'annuler. Cette mesure applique le principe appelé [[m1]]. Le site web de l'université explique quels critères le système prend en compte. Cette mesure applique le principe appelé [[m2]].
  slots:
    - id: m1
      options:
        - { id: fa, text: { en: "fairness", fr: "impartialité" } }
        - { id: tr, text: { en: "transparency", fr: "transparence" } }
        - { id: in, text: { en: "inclusiveness", fr: "inclusion" } }
        - { id: ac, text: { en: "accountability", fr: "responsabilité" } }
    - id: m2
      options:
        - { id: fa, text: { en: "fairness", fr: "impartialité" } }
        - { id: tr, text: { en: "transparency", fr: "transparence" } }
        - { id: in, text: { en: "inclusiveness", fr: "inclusion" } }
        - { id: ac, text: { en: "accountability", fr: "responsabilité" } }
answer:
  values: { m1: ac, m2: tr }
explanation:
  correct:
    en: "A person who reviews the system's proposals and can overturn them keeps humans in control of a decision that affects people's lives: accountability. Explaining the criteria helps applicants understand how the system reaches its results: transparency."
    fr: "Une personne qui relit les propositions du système et peut les annuler garde aux humains le contrôle d'une décision qui touche la vie des gens : responsabilité. Expliquer les critères aide les candidats à comprendre comment le système parvient à ses résultats : transparence."
  options:
    fa:
      en: "Fairness would be shown by checking that similar applicants receive similar rankings."
      fr: "L'impartialité se traduirait par la vérification que des candidats similaires reçoivent des classements similaires."
    in:
      en: "Inclusiveness would be shown by making the application process usable by everyone."
      fr: "L'inclusion se traduirait par un processus de candidature utilisable par tous."
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
