id: ai901-1a-fair-approval-by-group
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders tests an AI system that recommends whether rental applications should be accepted. The test uses applicants who have comparable incomes and rental histories.

    | Age group | Applicants | Recommended for acceptance |
    | --- | --- | --- |
    | Under 30 | 1,000 | 640 |
    | 30 to 60 | 1,000 | 655 |
    | Over 60 | 1,000 | 410 |

    The overall accuracy of the system is 93 percent.

    What should you conclude?
  fr: |
    Northwind Traders teste un système d'IA qui recommande d'accepter ou non des dossiers de location. Le test porte sur des demandeurs dont les revenus et l'historique de location sont comparables.

    | Tranche d'âge | Demandeurs | Acceptation recommandée |
    | --- | --- | --- |
    | Moins de 30 ans | 1 000 | 640 |
    | De 30 à 60 ans | 1 000 | 655 |
    | Plus de 60 ans | 1 000 | 410 |

    La précision globale du système est de 93 %.

    Que devez-vous en conclure ?
body:
  options:
    - id: a
      text: { en: "The system meets the fairness principle, because its overall accuracy is above 90 percent.", fr: "Le système respecte le principe d'impartialité, car sa précision globale dépasse 90 %." }
    - id: b
      text: { en: "The system has an inclusiveness issue, because applicants over 60 are unable to use it.", fr: "Le système présente un problème d'inclusion, car les demandeurs de plus de 60 ans ne peuvent pas l'utiliser." }
    - id: c
      text: { en: "The system has a reliability issue, because the three groups don't receive identical results.", fr: "Le système présente un problème de fiabilité, car les trois groupes ne reçoivent pas des résultats identiques." }
    - id: d
      text: { en: "The system has a potential fairness issue, because comparable applicants over 60 are recommended less often.", fr: "Le système présente un problème potentiel d'impartialité, car des demandeurs comparables de plus de 60 ans sont moins souvent recommandés." }
answer: { optionId: d }
explanation:
  correct:
    en: "Fairness is assessed by comparing results across sensitive groups such as age, not by overall accuracy alone. The applicants are comparable, yet the group over 60 is recommended far less often, so similarly situated people are affected differently and the team must investigate."
    fr: "L'impartialité s'évalue en comparant les résultats entre des groupes sensibles comme l'âge, et pas seulement avec la précision globale. Les demandeurs sont comparables, mais le groupe des plus de 60 ans est bien moins souvent recommandé : des personnes dans des situations similaires sont donc affectées différemment, et l'équipe doit en rechercher la cause."
  options:
    a: { en: "A high overall accuracy can hide a group that is treated differently; fairness requires a comparison by group.", fr: "Une précision globale élevée peut masquer un groupe traité différemment ; l'impartialité exige une comparaison par groupe." }
    b: { en: "Nothing indicates that these applicants are unable to use the system; they use it and receive a different outcome.", fr: "Rien n'indique que ces demandeurs ne peuvent pas utiliser le système ; ils l'utilisent et obtiennent un résultat différent." }
    c: { en: "Reliability is about operating as designed and responding safely to unexpected conditions; the table shows a difference of treatment between comparable groups.", fr: "La fiabilité consiste à fonctionner comme prévu et à réagir sans danger aux conditions inattendues ; le tableau montre une différence de traitement entre des groupes comparables." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
  - title: "What is Responsible AI?"
    url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai?view=azureml-api-2
