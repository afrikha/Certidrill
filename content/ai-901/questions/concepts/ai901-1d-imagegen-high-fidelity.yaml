id: ai901-1d-imagegen-high-fidelity
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The design team of Adatum creates brand visuals for marketing campaigns. The team needs high-fidelity images, precise editing of existing images and consistent results from one iteration to the next.

    Which model should the team use?
  fr: |
    L'équipe de conception d'Adatum crée des visuels de marque pour des campagnes marketing. Elle a besoin d'images haute fidélité, d'une modification précise d'images existantes et de résultats cohérents d'une itération à l'autre.

    Quel modèle l'équipe doit-elle utiliser ?
body:
  options:
  - id: a
    text: GPT-Image-1-Mini
  - id: b
    text: GPT-5.1
  - id: c
    text: Sora 1
  - id: d
    text: GPT-Image-1.5
answer:
  optionId: d
explanation:
  correct:
    en: GPT-Image-1.5 is the most advanced image-generation model of the GPT-Image-1 family. It is designed for high-fidelity creation and precise editing with improved consistency across iterations, and Microsoft Learn recommends it for branding, marketing and design work.
    fr: "GPT-Image-1.5 est le modèle de génération d'images le plus avancé de la famille GPT-Image-1. Il est conçu pour la création haute fidélité et la modification précise, avec une meilleure cohérence entre les itérations, et Microsoft Learn le recommande pour les travaux d'image de marque, de marketing et de conception."
  options:
    a:
      en: GPT-Image-1-Mini trades visual fidelity for lower cost and latency.
      fr: "GPT-Image-1-Mini sacrifie une part de fidélité visuelle au profit d'un coût et d'une latence réduits."
    b:
      en: "GPT-5.1 is a multimodal model that takes text and images as input for reasoning; it is not an image-generation model."
      fr: "GPT-5.1 est un modèle multimodal qui prend du texte et des images en entrée pour raisonner ; ce n'est pas un modèle de génération d'images."
    c:
      en: Sora 1 generates video clips, not still images.
      fr: Sora 1 génère des clips vidéo, pas des images fixes.
references:
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
