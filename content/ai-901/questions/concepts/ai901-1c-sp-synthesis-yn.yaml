id: ai901-1c-sp-synthesis-yn
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to use the text-to-speech capabilities of Azure Speech in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser les fonctionnalités de synthèse vocale d'Azure Speech dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Neural voices are used to increase the accuracy of transcripts.
        fr: Les voix neuronales servent à augmenter la précision des transcriptions.
    - id: s2
      text:
        en: The synthesized speech can be written to an audio file instead of being played through a speaker.
        fr: La parole synthétisée peut être écrite dans un fichier audio au lieu d'être lue sur un haut-parleur.
    - id: s3
      text:
        en: A text-to-speech solution requires the text to be spoken and the voice that speaks it.
        fr: Une solution de synthèse vocale a besoin du texte à prononcer et de la voix qui le prononce.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Neural voices are a synthesis feature: they use neural networks to give synthesized speech a more natural intonation, and have nothing to do with transcription. The text-to-speech API can play the audio directly through a speaker or write it to an audio file. A text-to-speech solution typically needs two things: the text and the voice.
    fr: |
      Les voix neuronales sont une fonctionnalité de synthèse : elles utilisent des réseaux neuronaux pour donner à la parole synthétisée une intonation plus naturelle, et n'ont aucun rapport avec la transcription. L'API de synthèse vocale peut lire l'audio directement sur un haut-parleur ou l'écrire dans un fichier audio. Une solution de synthèse vocale a typiquement besoin de deux choses : le texte et la voix.
references:
  - title: Speech synthesis
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
