id: ai901-1c-wl-agentic-two
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You review the AI projects proposed by several teams of Contoso.

    Which two projects are agentic AI scenarios?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous passez en revue les projets d'IA proposés par plusieurs équipes de Contoso.

    Quels sont les deux projets qui sont des scénarios d'IA agentique ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A solution that writes a blog post from a title and a few keywords.", fr: "Une solution qui rédige un article de blog à partir d'un titre et de quelques mots clés." } }
    - { id: b, text: { en: "An assistant that searches the expense policy and then files the claim in the finance system.", fr: "Un assistant qui cherche dans la politique de notes de frais, puis dépose la demande dans le système financier." } }
    - { id: c, text: { en: "A solution that creates concept art from a text description.", fr: "Une solution qui crée des illustrations conceptuelles à partir d'une description en texte." } }
    - { id: d, text: { en: "A solution that produces the transcript of each recorded support call.", fr: "Une solution qui produit la transcription de chaque appel de support enregistré." } }
    - { id: e, text: { en: "An assistant that finds a free meeting room and then books it through the calendar API.", fr: "Un assistant qui trouve une salle de réunion libre, puis la réserve par l'intermédiaire de l'API de calendrier." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      An agent combines a model, instructions and tools, and uses the tools to carry out a task in several steps. Searching a policy and then filing a claim, or finding a room and then booking it through an API, both require the solution to act on other systems.
    fr: |
      Un agent combine un modèle, des instructions et des outils, et utilise les outils pour accomplir une tâche en plusieurs étapes. Chercher dans une politique puis déposer une demande, ou trouver une salle puis la réserver par une API, exigent tous deux que la solution agisse sur d'autres systèmes.
  options:
    a: { en: "Writing a blog post from a prompt is content creation: generative AI, with no tool or action.", fr: "Rédiger un article de blog à partir d'une invite est de la création de contenu : de l'IA générative, sans outil ni action." }
    c: { en: "Creating an image from a description is generative AI.", fr: "Créer une image à partir d'une description relève de l'IA générative." }
    d: { en: "Transcribing calls is speech recognition, a speech workload.", fr: "Transcrire des appels relève de la reconnaissance vocale, une charge de travail vocale." }
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/1-introduction
