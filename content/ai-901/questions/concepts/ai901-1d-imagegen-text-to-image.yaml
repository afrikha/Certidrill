id: ai901-1d-imagegen-text-to-image
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The marketing team of Fabrikam wants to type a description such as *a flat illustration of a robot watering a plant, pastel colors* and receive an original picture that matches it.

    Which capability does the team need?
  fr: |
    L'équipe marketing de Fabrikam veut saisir une description telle que *une illustration en aplat d'un robot qui arrose une plante, couleurs pastel* et recevoir une image originale qui y correspond.

    De quelle fonctionnalité l'équipe a-t-elle besoin ?
body:
  options:
  - id: a
    text:
      en: Text-to-image generation
      fr: "La génération d'images à partir de texte (text-to-image)"
  - id: b
    text:
      en: Image analysis by a multimodal model
      fr: "L'analyse d'images par un modèle multimodal"
  - id: c
    text:
      en: Optical character recognition (OCR)
      fr: La reconnaissance optique de caractères (OCR)
  - id: d
    text:
      en: Text-to-video generation
      fr: La génération de vidéos à partir de texte (text-to-video)
answer:
  optionId: a
explanation:
  correct:
    en: Text-to-image generation produces an original image from a text description. Image-generation models, such as those of the GPT-Image-1 family, provide this capability.
    fr: "La génération d'images à partir de texte produit une image originale à partir d'une description en texte. Les modèles de génération d'images, comme ceux de la famille GPT-Image-1, offrent cette fonctionnalité."
  options:
    b:
      en: "Image analysis goes the other way: the model receives an image and returns text about it."
      fr: "L'analyse d'images va dans l'autre sens : le modèle reçoit une image et renvoie du texte à son sujet."
    c:
      en: "OCR reads the text that appears in an existing image; it creates no picture."
      fr: "L'OCR lit le texte présent dans une image existante ; il ne crée aucune image."
    d:
      en: Text-to-video generation returns a video clip, not a still picture.
      fr: La génération de vidéos à partir de texte renvoie un clip vidéo, pas une image fixe.
references:
- title: Image generation models
  url: "https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation"
