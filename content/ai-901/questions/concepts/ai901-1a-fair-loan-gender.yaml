id: ai901-1a-fair-loan-gender
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses an AI system to recommend whether loan applications should be approved. A review shows that applicants who have the same income, debts and credit history receive different recommendations depending on their gender.

    Which responsible AI principle does the system violate?
  fr: |
    Woodgrove Bank utilise un système d'IA pour recommander l'approbation ou le refus des demandes de prêt. Un examen montre que des demandeurs ayant les mêmes revenus, les mêmes dettes et le même historique de crédit reçoivent des recommandations différentes selon leur genre.

    Quel principe de l'IA responsable le système enfreint-il ?
body:
  options:
    - id: incl
      text: { en: "Inclusiveness", fr: "Inclusion" }
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
    - id: transp
      text: { en: "Transparency", fr: "Transparence" }
    - id: rel
      text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" }
answer: { optionId: fair }
explanation:
  correct:
    en: "Fairness requires an AI system to treat everyone fairly and to make the same recommendations to people whose financial circumstances are similar. Here, gender alone changes the outcome for comparable applicants."
    fr: "L'impartialité exige qu'un système d'IA traite tout le monde de manière équitable et fasse les mêmes recommandations aux personnes dont la situation financière est similaire. Ici, le genre suffit à changer le résultat pour des demandeurs comparables."
  options:
    incl: { en: "Inclusiveness is about making a system usable by people with the full range of abilities and needs; here every applicant can use the system.", fr: "L'inclusion consiste à rendre un système utilisable par des personnes ayant toute la diversité des capacités et des besoins ; ici, tous les demandeurs peuvent utiliser le système." }
    transp: { en: "Transparency is about people understanding how the system reaches its decisions; the problem here is the unequal outcome itself.", fr: "La transparence consiste à permettre aux personnes de comprendre comment le système parvient à ses décisions ; le problème ici est le résultat inégal lui-même." }
    rel: { en: "Reliability and safety is about operating as designed and responding safely to unexpected conditions, not about treating comparable groups differently.", fr: "La fiabilité et la sécurité consistent à fonctionner comme prévu et à réagir sans danger aux conditions inattendues, pas à traiter différemment des groupes comparables." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
