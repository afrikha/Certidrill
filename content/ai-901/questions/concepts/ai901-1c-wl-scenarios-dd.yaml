id: ai901-1c-wl-scenarios-dd
objective: "1.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You match the projects of three teams to AI workloads.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous associez les projets de trois équipes à des charges de travail d'IA.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Developers want functions to be written for them from comments in natural language. This is a [[w1]] scenario.

      A car maker wants its vehicles to recognize road signs, lane markings and pedestrians. This is a [[w2]] scenario.

      A language school wants an app that listens to students and gives feedback on their pronunciation. This is a [[w3]] scenario.
    fr: |
      Des développeurs veulent que des fonctions soient écrites pour eux à partir de commentaires en langage naturel. C'est un scénario de type [[w1]].

      Un constructeur automobile veut que ses véhicules reconnaissent les panneaux de signalisation, le marquage des voies et les piétons. C'est un scénario de type [[w2]].

      Une école de langues veut une application qui écoute les élèves et leur donne un retour sur leur prononciation. C'est un scénario de type [[w3]].
  slots:
    - id: w1
      options:
        - { id: gen, text: { en: "generative AI", fr: "IA générative" } }
        - { id: ta, text: { en: "text analysis", fr: "analyse de texte" } }
        - { id: ie, text: { en: "information extraction", fr: "extraction d'informations" } }
    - id: w2
      options:
        - { id: speech, text: { en: "speech", fr: "reconnaissance et synthèse vocales" } }
        - { id: gen, text: { en: "generative AI", fr: "IA générative" } }
        - { id: cv, text: { en: "computer vision", fr: "vision par ordinateur" } }
    - id: w3
      options:
        - { id: ta, text: { en: "text analysis", fr: "analyse de texte" } }
        - { id: speech, text: { en: "speech", fr: "reconnaissance et synthèse vocales" } }
        - { id: cv, text: { en: "computer vision", fr: "vision par ordinateur" } }
answer:
  values: { w1: gen, w2: cv, w3: speech }
explanation:
  correct:
    en: |
      Generating code from natural language prompts is generative AI: new content is created. Recognizing road signs, lane markings and pedestrians means interpreting camera images, which is computer vision. An app that listens to students works on spoken audio, so pronunciation feedback is a speech scenario.
    fr: |
      Générer du code à partir d'invites en langage naturel relève de l'IA générative : du contenu nouveau est créé. Reconnaître les panneaux, le marquage des voies et les piétons revient à interpréter des images de caméras : c'est de la vision par ordinateur. Une application qui écoute les élèves travaille sur de l'audio parlé : le retour sur la prononciation est donc un scénario vocal.
  options:
    ta: { en: "Text analysis extracts meaning from existing written text; it neither writes code nor listens to audio.", fr: "L'analyse de texte extrait du sens d'un texte écrit existant ; elle n'écrit pas de code et n'écoute pas d'audio." }
    ie: { en: "Information extraction returns structured data from existing content; it does not write new code.", fr: "L'extraction d'informations renvoie des données structurées à partir d'un contenu existant ; elle n'écrit pas de nouveau code." }
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/1-introduction
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/1-introduction
