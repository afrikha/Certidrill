id: ai901-1c-param-max-tokens-truncated
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You test a deployed model in the Foundry playground. When you ask for a detailed report, the response stops in the middle of a sentence. Short answers are complete, and no rate-limit error is returned.

    Which setting should you increase?
  fr: |
    Vous testez un modèle déployé dans le terrain de jeu Foundry. Lorsque vous demandez un rapport détaillé, la réponse s'arrête au milieu d'une phrase. Les réponses courtes sont complètes, et aucune erreur de limite de débit n'est renvoyée.

    Quel paramètre devez-vous augmenter ?
body:
  options:
    - { id: a, text: { en: "Temperature", fr: "La température" } }
    - { id: b, text: { en: "Top P", fr: "Top P" } }
    - { id: c, text: { en: "Tokens per minute (TPM)", fr: "Les jetons par minute (TPM)" } }
    - { id: d, text: { en: "Max output tokens", fr: "Le nombre maximal de jetons de sortie" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Max output tokens caps the length of a response. When the cap is reached, generation stops, even in the middle of a sentence. Raising the value lets the model finish long answers.
    fr: |
      Le nombre maximal de jetons de sortie plafonne la longueur d'une réponse. Quand le plafond est atteint, la génération s'arrête, même au milieu d'une phrase. Augmenter la valeur permet au modèle de terminer les réponses longues.
  options:
    a: { en: "Temperature changes how random the wording is, not how long the response can be.", fr: "La température change le caractère aléatoire de la formulation, pas la longueur possible de la réponse." }
    b: { en: "Top P is another way to control randomness; it does not set a length limit.", fr: "Top P est une autre façon de contrôler le caractère aléatoire ; il ne fixe pas de limite de longueur." }
    c: { en: "The TPM limit matters when the deployment is throttled, and here no rate-limit error is returned.", fr: "La limite TPM intervient quand le déploiement subit une limitation ; ici, aucune erreur de limite de débit n'est renvoyée." }
references:
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
