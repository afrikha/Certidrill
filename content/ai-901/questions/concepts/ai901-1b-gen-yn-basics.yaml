id: ai901-1b-gen-yn-basics
objective: "1.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Each token in the vocabulary of a language model has a numeric identifier."
        fr: "Chaque jeton du vocabulaire d'un modèle de langage possède un identificateur numérique."
    - id: s2
      text:
        en: "A language model answers a prompt by searching a stored copy of the documents that it was trained on."
        fr: "Un modèle de langage répond à une invite en recherchant dans une copie stockée des documents sur lesquels il a été entraîné."
    - id: s3
      text:
        en: "The response that a model generates for a prompt is called a completion."
        fr: "La réponse qu'un modèle génère pour une invite s'appelle une complétion."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Training starts by splitting text into tokens and giving each token a unique numeric identifier. The model learns relationships between tokens; it doesn't keep its training documents, and it generates a completion by predicting the most probable continuation of the prompt."
    fr: "L'entraînement commence par découper le texte en jetons et attribuer à chacun un identificateur numérique unique. Le modèle apprend des relations entre les jetons ; il ne conserve pas ses documents d'entraînement, et il génère une complétion en prédisant la suite la plus probable de l'invite."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
