id: ai901-1b-gen-drag-terms
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each description to the term that it defines.

    To answer, drag the appropriate term to each description. Each term may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque description au terme qu'elle définit.

    Pour répondre, faites glisser le terme approprié vers chaque description. Chaque terme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: prompt, text: { en: "Prompt", fr: "Invite" } }
    - { id: att, text: { en: "Attention", fr: "Attention" } }
    - { id: token, text: { en: "Token", fr: "Jeton" } }
    - { id: completion, text: { en: "Completion", fr: "Complétion" } }
    - { id: emb, text: { en: "Embedding", fr: "Embedding" } }
  targets:
    - id: t1
      text: { en: "A vector that encodes the meaning of a token, learned from the contexts in which the token appears", fr: "Un vecteur qui encode le sens d'un jeton, appris à partir des contextes dans lesquels le jeton apparaît" }
    - id: t2
      text: { en: "A technique that determines how much the other tokens of a sequence influence a token", fr: "Une technique qui détermine dans quelle mesure les autres jetons d'une séquence influencent un jeton" }
    - id: t3
      text: { en: "The text that a model generates in response to the input that it receives", fr: "Le texte qu'un modèle génère en réponse à l'entrée qu'il reçoit" }
answer:
  mapping: { t1: emb, t2: att, t3: completion }
explanation:
  correct:
    en: "An embedding is the vector that represents a token and encodes its meaning from the contexts seen in training. Attention examines each token and determines how the surrounding tokens influence it. The model responds to a prompt with a completion."
    fr: "Un embedding est le vecteur qui représente un jeton et encode son sens à partir des contextes vus à l'entraînement. L'attention examine chaque jeton et détermine comment les jetons qui l'entourent l'influencent. Le modèle répond à une invite par une complétion."
  options:
    prompt:
      en: "A prompt is the input given to the model, not what the model generates."
      fr: "Une invite est l'entrée fournie au modèle, pas ce que le modèle génère."
    token:
      en: "A token is a unit of text, such as a word or a sub-word; the vector that represents it is its embedding."
      fr: "Un jeton est une unité de texte, par exemple un mot ou un sous-mot ; le vecteur qui le représente est son embedding."
references:
  - title: "Large language models (LLMs)"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
