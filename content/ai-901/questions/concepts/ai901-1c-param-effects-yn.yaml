id: ai901-1c-param-effects-yn
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You configure the parameters of a deployed chat model in the Foundry playground.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez les paramètres d'un modèle de conversation déployé dans le terrain de jeu Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Raising the max output tokens value makes the responses more creative.
        fr: Augmenter le nombre maximal de jetons de sortie rend les réponses plus créatives.
    - id: s2
      text:
        en: Lowering the temperature makes the responses more deterministic.
        fr: Diminuer la température rend les réponses plus déterministes.
    - id: s3
      text:
        en: Top P controls the randomness of the responses.
        fr: Top P contrôle le caractère aléatoire des réponses.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Max output tokens only caps the length of a response; it has no effect on creativity. Temperature controls creativity against determinism: a lower value gives more focused, repeatable answers. Top P also controls randomness, in a different way, and the general recommendation is to change temperature or top P, not both at once.
    fr: |
      Le nombre maximal de jetons de sortie plafonne seulement la longueur d'une réponse ; il n'a aucun effet sur la créativité. La température arbitre entre créativité et déterminisme : une valeur plus basse donne des réponses plus ciblées et reproductibles. Top P contrôle lui aussi le caractère aléatoire, d'une autre façon, et la recommandation générale est de modifier la température ou Top P, pas les deux à la fois.
references:
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
