id: ai901-1b-transp-dd-label
objective: "1.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A generative AI application displays the following text under each answer: "AI-generated content may be incorrect."

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application d'IA générative affiche le texte suivant sous chaque réponse : « Le contenu généré par l'IA peut être incorrect. »

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The text is [[what]]. It applies the responsible AI principle of [[principle]].
    fr: |
      Ce texte est [[what]]. Il applique le principe de l'IA responsable appelé [[principle]].
  slots:
    - id: what
      options:
        - { id: filter, text: { en: "a content safety filter", fr: "un filtre de sécurité du contenu" } }
        - { id: disclosure, text: { en: "an in-product disclosure", fr: "une mention affichée dans le produit" } }
        - { id: system, text: { en: "a system prompt of the model", fr: "une invite système du modèle" } }
        - { id: card, text: { en: "a model card of the catalog", fr: "une carte de modèle du catalogue" } }
    - id: principle
      options:
        - { id: ac, text: { en: "accountability", fr: "responsabilité" } }
        - { id: fa, text: { en: "fairness", fr: "impartialité" } }
        - { id: ps, text: { en: "privacy and security", fr: "confidentialité et sécurité" } }
        - { id: tr, text: { en: "transparency", fr: "transparence" } }
answer:
  values: { what: disclosure, principle: tr }
explanation:
  correct:
    en: "A label that warns users about AI-generated content is an in-product disclosure. It applies transparency: it communicates the presence of AI and one of its limitations, so that users can decide how much to rely on the answer."
    fr: "Un libellé qui avertit les utilisateurs au sujet du contenu généré par l'IA est une mention affichée dans le produit. Il applique la transparence : il signale la présence de l'IA et l'une de ses limites, afin que les utilisateurs décident dans quelle mesure se fier à la réponse."
  options:
    filter:
      en: "A content filter blocks harmful prompts and responses; it doesn't inform the user."
      fr: "Un filtre de contenu bloque les invites et les réponses nuisibles ; il n'informe pas l'utilisateur."
    system:
      en: "A system prompt gives instructions to the model and isn't shown to users as a notice."
      fr: "Une invite système donne des instructions au modèle et n'est pas affichée aux utilisateurs comme un avis."
    ac:
      en: "Accountability would be shown by a person or a team that answers for the content, not by a notice."
      fr: "La responsabilité se traduirait par une personne ou une équipe qui répond du contenu, pas par un avis."
references:
  - title: "Responsible AI for agent design"
    url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
