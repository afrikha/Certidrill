id: ai901-1b-model-semantic-search
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys wants customers to search its product catalog by meaning rather than by exact keywords. The solution must convert product descriptions and search queries into vectors that can be compared.

    Which model should you deploy?
  fr: |
    Wingtip Toys veut que ses clients recherchent dans son catalogue de produits par le sens plutôt que par mots clés exacts. La solution doit convertir les descriptions de produits et les requêtes de recherche en vecteurs comparables.

    Quel modèle devez-vous déployer ?
body:
  options:
    - { id: a, text: "gpt-image-1-mini" }
    - { id: b, text: "text-embedding-3-small" }
    - { id: c, text: "sora-2" }
    - { id: d, text: "gpt-4.1-nano" }
answer: { optionId: b }
explanation:
  correct:
    en: "Embedding models such as text-embedding-3-small are built to produce semantic vector representations of text. Comparing the vector of a query with the vectors of the product descriptions finds the products whose meaning is closest."
    fr: "Les modèles d'embedding comme text-embedding-3-small sont conçus pour produire des représentations vectorielles sémantiques du texte. Comparer le vecteur d'une requête aux vecteurs des descriptions de produits permet de trouver les produits dont le sens est le plus proche."
  options:
    a:
      en: "gpt-image-1-mini generates images from a description; it doesn't return text embeddings."
      fr: "gpt-image-1-mini génère des images à partir d'une description ; il ne renvoie pas d'embeddings de texte."
    c:
      en: "sora-2 is a video generation model."
      fr: "sora-2 est un modèle de génération de vidéos."
    d:
      en: "gpt-4.1-nano is a general-purpose model that generates text, not vectors to compare."
      fr: "gpt-4.1-nano est un modèle à usage général qui génère du texte, pas des vecteurs à comparer."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Foundry Models sold by Azure"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
