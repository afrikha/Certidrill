id: ai901-1a-priv-anonymize-records
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before an AI system analyzes medical records, a hospital removes the names and the other details that identify the patients.

    Which responsible AI principle does this practice support?
  fr: |
    Avant qu'un système d'IA analyse des dossiers médicaux, un hôpital retire les noms et les autres détails qui identifient les patients.

    Quel principe de l'IA responsable cette pratique sert-elle ?
body:
  options:
    - id: transp
      text: { en: "Transparency", fr: "Transparence" }
    - id: priv
      text: { en: "Privacy and security", fr: "Confidentialité et sécurité" }
    - id: fair
      text: { en: "Fairness", fr: "Impartialité" }
    - id: incl
      text: { en: "Inclusiveness", fr: "Inclusion" }
answer: { optionId: priv }
explanation:
  correct:
    en: "Removing personal identification from data lets an AI system maintain anonymity, which is one of the considerations of the privacy and security principle. The system still gets the data it needs, without exposing who the patients are."
    fr: "Retirer des données ce qui identifie les personnes permet à un système d'IA de préserver l'anonymat : c'est l'une des considérations du principe de confidentialité et de sécurité. Le système dispose toujours des données dont il a besoin, sans exposer l'identité des patients."
  options:
    transp: { en: "Transparency is about people understanding how the system works and what its limits are.", fr: "La transparence consiste à permettre aux personnes de comprendre comment le système fonctionne et quelles sont ses limites." }
    fair: { en: "Fairness is about giving similar results to people in similar situations.", fr: "L'impartialité consiste à donner des résultats similaires à des personnes dans des situations similaires." }
    incl: { en: "Inclusiveness is about making the system usable by people with all abilities and needs.", fr: "L'inclusion consiste à rendre le système utilisable par des personnes ayant toutes les capacités et tous les besoins." }
references:
  - title: "Identify guiding principles for responsible AI"
    url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
