id: ai901-1c-wl-ticket-dissatisfaction
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank receives thousands of written support tickets and survey comments each week. The bank wants to detect dissatisfied customers early and to identify the topics that come up most often.

    Which AI workload does this scenario represent?
  fr: |
    Woodgrove Bank reçoit chaque semaine des milliers de tickets de support et de commentaires d'enquête écrits. La banque veut repérer tôt les clients insatisfaits et identifier les sujets qui reviennent le plus souvent.

    Quelle charge de travail d'IA ce scénario représente-t-il ?
body:
  options:
    - { id: a, text: { en: "Speech", fr: "Reconnaissance et synthèse vocales" } }
    - { id: b, text: { en: "Text analysis", fr: "Analyse de texte" } }
    - { id: c, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
    - { id: d, text: { en: "Agentic AI", fr: "IA agentique" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Text analysis examines written text to extract useful information such as sentiment, key phrases, entities or topics. Detecting dissatisfaction and recurring topics in tickets and survey comments is customer feedback analysis, a text analysis scenario.
    fr: |
      L'analyse de texte examine du texte écrit pour en extraire des informations utiles comme les sentiments, les expressions clés, les entités ou les sujets. Repérer l'insatisfaction et les sujets récurrents dans des tickets et des commentaires d'enquête relève de l'analyse des retours clients, un scénario d'analyse de texte.
  options:
    a: { en: "The tickets and comments are written, so no spoken audio has to be recognized or synthesized.", fr: "Les tickets et les commentaires sont écrits : aucun audio parlé n'est à reconnaître ni à synthétiser." }
    c: { en: "Computer vision interprets images and video, which the scenario does not contain.", fr: "La vision par ordinateur interprète des images et des vidéos, absentes du scénario." }
    d: { en: "The bank does not ask for a solution that uses tools to act; it asks for meaning extracted from text.", fr: "La banque ne demande pas une solution qui utilise des outils pour agir ; elle demande d'extraire du sens à partir de texte." }
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/1-introduction
