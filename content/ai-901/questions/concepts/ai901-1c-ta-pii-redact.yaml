id: ai901-1c-ta-pii-redact
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank archives the text of its customer chats. To comply with privacy regulations, the names, phone numbers and street addresses of the customers must be identified and redacted before the text is stored.

    Which Azure Language capability should the bank use?
  fr: |
    Woodgrove Bank archive le texte de ses conversations avec les clients. Pour respecter la réglementation sur la confidentialité, les noms, les numéros de téléphone et les adresses postales des clients doivent être identifiés et masqués avant le stockage du texte.

    Quelle fonctionnalité d'Azure Language la banque doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Key phrase extraction", fr: "Extraction d'expressions clés" } }
    - { id: b, text: { en: "PII detection", fr: "Détection des PII" } }
    - { id: c, text: { en: "Language detection", fr: "Détection de langue" } }
    - { id: d, text: { en: "Summarization", fr: "Résumé de texte" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Personally identifiable information (PII) detection identifies personal details such as names, phone numbers, email addresses and street addresses, and can redact them. It is the capability intended for meeting privacy requirements before text is stored or shared.
    fr: |
      La détection des informations d'identification personnelle (PII) identifie les détails personnels comme les noms, les numéros de téléphone, les adresses e-mail et les adresses postales, et peut les masquer. C'est la fonctionnalité prévue pour respecter les exigences de confidentialité avant de stocker ou de partager un texte.
  options:
    a: { en: "Key phrase extraction returns the main concepts of the chat; it does not look for personal data and redacts nothing.", fr: "L'extraction d'expressions clés renvoie les principaux concepts de la conversation ; elle ne cherche pas les données personnelles et ne masque rien." }
    c: { en: "Language detection only returns the language of the text.", fr: "La détection de langue renvoie seulement la langue du texte." }
    d: { en: "A summary is shorter, but it can still contain names, phone numbers and addresses.", fr: "Un résumé est plus court, mais il peut encore contenir des noms, des numéros de téléphone et des adresses." }
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
