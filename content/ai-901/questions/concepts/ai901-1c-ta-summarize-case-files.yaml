id: ai901-1c-ta-summarize-case-files
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm stores court rulings that are often more than 50 pages long. The attorneys want to read a one-paragraph version of each ruling that keeps its most important information.

    Which text analysis technique should the firm use?
  fr: |
    Un cabinet d'avocats conserve des décisions de justice qui dépassent souvent 50 pages. Les avocats veulent lire une version en un paragraphe de chaque décision, qui en garde les informations les plus importantes.

    Quelle technique d'analyse de texte le cabinet doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Entity detection", fr: "Détection d'entités" } }
    - { id: b, text: { en: "Summarization", fr: "Résumé de texte" } }
    - { id: c, text: { en: "Key phrase extraction", fr: "Extraction d'expressions clés" } }
    - { id: d, text: { en: "Sentiment analysis", fr: "Analyse des sentiments" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Summarization condenses a long text into a shorter one by identifying its most important information. A one-paragraph version of a 50-page ruling is a summary.
    fr: |
      Le résumé condense un texte long en un texte plus court en identifiant ses informations les plus importantes. Une version en un paragraphe d'une décision de 50 pages est un résumé.
  options:
    a: { en: "Entity detection returns the people, places, organizations and dates of the ruling, not a readable paragraph.", fr: "La détection d'entités renvoie les personnes, lieux, organisations et dates de la décision, pas un paragraphe lisible." }
    c: { en: "Key phrase extraction returns a list of isolated phrases, not sentences that tell what the ruling says.", fr: "L'extraction d'expressions clés renvoie une liste d'expressions isolées, pas des phrases qui disent ce que la décision énonce." }
    d: { en: "Sentiment analysis returns a positive, negative or neutral label.", fr: "L'analyse des sentiments renvoie une étiquette positif, négatif ou neutre." }
references:
  - title: Introduction
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/1-introduction
  - title: What is summarization?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/summarization/overview
