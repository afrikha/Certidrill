id: ai901-1b-gen-dd-llm-slm
objective: "1.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[big]] are powerful and generalize well, but they cost more to train and use. [[small]] suit focused topic areas, small applications that are deployed locally and on-device agents.
    fr: |
      [[big]] sont puissants et généralisent bien, mais ils coûtent plus cher à entraîner et à utiliser. [[small]] conviennent aux domaines ciblés, aux petites applications déployées localement et aux agents sur l'appareil.
  slots:
    - id: big
      options:
        - { id: emb, text: { en: "Embedding models", fr: "Les modèles d'embedding" } }
        - { id: llm, text: { en: "Large language models (LLMs)", fr: "Les grands modèles de langage (LLM)" } }
        - { id: img, text: { en: "Image generation models", fr: "Les modèles de génération d'images" } }
        - { id: slm, text: { en: "Small language models (SLMs)", fr: "Les petits modèles de langage (SLM)" } }
    - id: small
      options:
        - { id: emb, text: { en: "Embedding models", fr: "Les modèles d'embedding" } }
        - { id: llm, text: { en: "Large language models (LLMs)", fr: "Les grands modèles de langage (LLM)" } }
        - { id: img, text: { en: "Image generation models", fr: "Les modèles de génération d'images" } }
        - { id: slm, text: { en: "Small language models (SLMs)", fr: "Les petits modèles de langage (SLM)" } }
answer:
  values: { big: llm, small: slm }
explanation:
  correct:
    en: "Large and small language models work in the same way; they differ in the volume of data they were trained on and in their number of variables. LLMs generalize well at a higher cost, whereas SLMs are suited to focused topics, small local deployments and on-device agents."
    fr: "Les grands et les petits modèles de langage fonctionnent de la même façon ; ils diffèrent par le volume de données d'entraînement et par leur nombre de variables. Les LLM généralisent bien pour un coût plus élevé, tandis que les SLM conviennent aux sujets ciblés, aux petits déploiements locaux et aux agents sur l'appareil."
  options:
    emb:
      en: "Embedding models return vectors that represent meaning; they don't generate text."
      fr: "Les modèles d'embedding renvoient des vecteurs qui représentent le sens ; ils ne génèrent pas de texte."
    img:
      en: "Image generation models create images from descriptions; the sentences describe language models."
      fr: "Les modèles de génération d'images créent des images à partir de descriptions ; les phrases décrivent des modèles de langage."
references:
  - title: "Generative AI and agents"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/2-generative-ai
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
