id: ai901-1c-sp-internals-yn
objective: "1.3.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You explain to a project team how speech capabilities work.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous expliquez à une équipe de projet comment fonctionnent les fonctionnalités vocales.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In speech recognition, an acoustic model converts the audio into phonemes.
        fr: Dans la reconnaissance vocale, un modèle acoustique convertit l'audio en phonèmes.
    - id: s2
      text:
        en: In speech synthesis, a language model maps phonemes to the words of a transcript.
        fr: Dans la synthèse vocale, un modèle de langage associe des phonèmes aux mots d'une transcription.
    - id: s3
      text:
        en: Speech translation can return the translation of spoken audio as text, as synthesized speech, or as both.
        fr: La traduction vocale peut renvoyer la traduction d'un audio parlé sous forme de texte, de parole synthétisée, ou des deux.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Speech recognition typically uses an acoustic model, which converts the audio into phonemes, and a language model, which maps the phonemes to words. Mapping phonemes to words is therefore a step of recognition; synthesis goes from text to phonemes and then to audio. Speech translation takes spoken audio and returns translated text, synthesized speech in the target language, or both.
    fr: |
      La reconnaissance vocale utilise typiquement un modèle acoustique, qui convertit l'audio en phonèmes, et un modèle de langage, qui associe les phonèmes à des mots. Associer des phonèmes à des mots est donc une étape de la reconnaissance ; la synthèse va du texte aux phonèmes, puis à l'audio. La traduction vocale prend de l'audio parlé et renvoie du texte traduit, de la parole synthétisée dans la langue cible, ou les deux.
references:
  - title: Speech recognition
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: What is speech translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation
