id: ai901-2b-client-dnd-code-roles
objective: "2.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You review the code of a lightweight Python client that calls an agent saved in a Foundry project.

    Which code element performs each task? To answer, drag the appropriate code elements to the correct tasks. Each code element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code d'un client Python léger qui appelle un agent enregistré dans un projet Foundry.

    Quel élément de code effectue chaque tâche ? Pour répondre, faites glisser les éléments de code appropriés vers les tâches correspondantes. Chaque élément de code peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cred, text: "`DefaultAzureCredential()`" }
    - { id: client, text: "`AIProjectClient(...)`" }
    - { id: get, text: "`agents.get(agent_name=...)`" }
    - { id: create, text: "`responses.create(...)`" }
    - { id: out, text: "`output_text`" }
  targets:
    - id: t1
      text: { en: "Authenticates the application with Microsoft Entra ID", fr: "Authentifie l'application avec Microsoft Entra ID" }
    - id: t2
      text: { en: "Retrieves the agent that is saved in the project", fr: "Récupère l'agent enregistré dans le projet" }
    - id: t3
      text: { en: "Sends the prompt of the user to the agent", fr: "Envoie l'invite de l'utilisateur à l'agent" }
    - id: t4
      text: { en: "Holds the text of the agent's answer", fr: "Contient le texte de la réponse de l'agent" }
answer:
  mapping: { t1: cred, t2: get, t3: create, t4: out }
explanation:
  correct:
    en: |
      `DefaultAzureCredential()` provides the Microsoft Entra ID identity of the application. `agents.get(agent_name=...)` returns the existing agent. `responses.create(...)` sends the prompt, with the agent reference, through the Responses API, and the generated text is in `output_text`. `AIProjectClient(...)` creates the connection to the project, which isn't one of the four tasks.
    fr: |
      `DefaultAzureCredential()` fournit l'identité Microsoft Entra ID de l'application. `agents.get(agent_name=...)` renvoie l'agent existant. `responses.create(...)` envoie l'invite, avec la référence à l'agent, par l'intermédiaire de l'API Responses, et le texte généré se trouve dans `output_text`. `AIProjectClient(...)` crée la connexion au projet, ce qui ne fait pas partie des quatre tâches.
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
