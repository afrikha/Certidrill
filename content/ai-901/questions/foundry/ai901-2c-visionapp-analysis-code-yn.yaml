id: ai901-2c-visionapp-analysis-code-yn
objective: "2.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You review the following Python code. The `key` and `endpoint` variables contain the key and the endpoint of a Foundry resource.

    ```python
    from openai import OpenAI

    client = OpenAI(api_key=key, base_url=endpoint)

    response = client.responses.create(
        model="safari-vision",
        input=[
            {
                "role": "user",
                "content": [
                    {"type": "input_text", "text": "Which animal is in this photo? Answer in one sentence."},
                    {"type": "input_image", "image_url": "https://www.contoso.com/photos/animal01.jpg"},
                ],
            }
        ],
    )
    print(response.output_text)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code Python suivant. Les variables `key` et `endpoint` contiennent la clé et le point de terminaison d'une ressource Foundry.

    ```python
    from openai import OpenAI

    client = OpenAI(api_key=key, base_url=endpoint)

    response = client.responses.create(
        model="safari-vision",
        input=[
            {
                "role": "user",
                "content": [
                    {"type": "input_text", "text": "Which animal is in this photo? Answer in one sentence."},
                    {"type": "input_image", "image_url": "https://www.contoso.com/photos/animal01.jpg"},
                ],
            }
        ],
    )
    print(response.output_text)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The text instruction and the image are sent to the model in the same request."
        fr: "L'instruction en texte et l'image sont envoyées au modèle dans la même requête."
    - id: s2
      text:
        en: "The application reads the image file and sends its content as base64 data."
        fr: "L'application lit le fichier image et envoie son contenu sous forme de données base64."
    - id: s3
      text:
        en: "The application displays the answer of the model as text."
        fr: "L'application affiche la réponse du modèle sous forme de texte."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: |
      The user message holds an `input_text` item and an `input_image` item, so one request carries the instruction and the image. Here the image is referenced by its URL; the application doesn't read or encode a file. The answer of the model is text, available in `response.output_text`, which the code prints.
    fr: |
      Le message utilisateur contient un élément `input_text` et un élément `input_image` : une seule requête porte donc l'instruction et l'image. Ici, l'image est référencée par son URL ; l'application ne lit ni n'encode aucun fichier. La réponse du modèle est du texte, disponible dans `response.output_text`, que le code affiche.
references:
