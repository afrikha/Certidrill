id: ai901-2a-playground-after-deploy
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Foundry portal, you select a chat model in the model catalog and deploy it with the default settings.

    Which experience opens when the deployment completes?
  fr: |
    Dans le portail Foundry, vous sélectionnez un modèle de conversation dans le catalogue de modèles et vous le déployez avec les paramètres par défaut.

    Quelle expérience s'ouvre à la fin du déploiement ?
body:
  options:
    - { id: a, text: { en: "The agents playground", fr: "Le terrain de jeu des agents" } }
    - { id: b, text: { en: "The model leaderboards", fr: "Les classements de modèles" } }
    - { id: c, text: { en: "The model playground", fr: "Le terrain de jeu de modèles" } }
    - { id: d, text: { en: "VS Code for the Web", fr: "VS Code pour le web" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The model playground opens automatically when you deploy a model in the Foundry portal. You can enter prompts there at once, set the instructions and adjust the parameters.
    fr: |
      Le terrain de jeu de modèles s'ouvre automatiquement lorsque vous déployez un modèle dans le portail Foundry. Vous pouvez aussitôt y saisir des invites, définir les instructions et régler les paramètres.
  options:
    a:
      en: "The agents playground opens for an agent, for example after you save a model configuration as an agent."
      fr: "Le terrain de jeu des agents s'ouvre pour un agent, par exemple après l'enregistrement d'une configuration de modèle en tant qu'agent."
    b:
      en: "The leaderboards rank the models of the catalog; you consult them before choosing a model."
      fr: "Les classements ordonnent les modèles du catalogue ; vous les consultez avant de choisir un modèle."
    d:
      en: "VS Code for the Web opens only when you select **Open in VS Code for the Web** on the **Code** tab."
      fr: "VS Code pour le web ne s'ouvre que si vous sélectionnez **Open in VS Code for the Web** dans l'onglet **Code**."
references:
  - title: "Microsoft Foundry Playgrounds"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
  - title: "Deploy Microsoft Foundry Models in the Foundry portal"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/deploy-foundry-models
