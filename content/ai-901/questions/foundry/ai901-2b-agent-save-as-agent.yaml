id: ai901-2b-agent-save-as-agent
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Foundry portal, you deployed a model and opened it in the model playground. You wrote the instructions and enabled the Web search tool.

    You need to keep this configuration as a named component that applications can call.

    What should you select in the playground?
  fr: |
    Dans le portail Foundry, vous avez déployé un modèle et vous l'avez ouvert dans le terrain de jeu de modèles. Vous avez écrit les instructions et activé l'outil Web search.

    Vous devez conserver cette configuration sous la forme d'un composant nommé que des applications peuvent appeler.

    Que devez-vous sélectionner dans le terrain de jeu ?
body:
  options:
    - { id: a, text: "**New chat**" }
    - { id: b, text: "**Compare models**" }
    - { id: c, text: "**Open in VS Code for the Web**" }
    - { id: d, text: "**Save as agent**" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      **Save as agent** packages the model, the instructions and the tools of the playground under an agent name. The agent then opens in its own playground, where you continue to test and refine it, and applications can call it by name.
    fr: |
      **Save as agent** regroupe le modèle, les instructions et les outils du terrain de jeu sous un nom d'agent. L'agent s'ouvre ensuite dans son propre terrain de jeu, où vous continuez à le tester et à l'affiner, et des applications peuvent l'appeler par son nom.
  options:
    a:
      en: "**New chat** starts a new conversation; it doesn't save the configuration."
      fr: "**New chat** démarre une nouvelle conversation ; cela n'enregistre pas la configuration."
    b:
      en: "**Compare models** runs the same prompt on up to three models side by side."
      fr: "**Compare models** exécute la même invite sur trois modèles au maximum, côte à côte."
    c:
      en: "**Open in VS Code for the Web** imports a code sample with the endpoint and the key into a workspace; it doesn't create an agent."
      fr: "**Open in VS Code for the Web** importe un exemple de code avec le point de terminaison et la clé dans un espace de travail ; cela ne crée pas d'agent."
references:
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
