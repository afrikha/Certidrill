id: ai901-2d-av-diarization
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You analyze recordings of project meetings by using an audio analyzer of Azure Content Understanding in Foundry Tools. In the transcript, each sentence must be attributed to the participant who said it, for example Speaker 1 or Speaker 2.

    Which capability provides this?
  fr: |
    Vous analysez des enregistrements de réunions de projet à l'aide d'un analyseur audio d'Azure Content Understanding dans Foundry Tools. Dans la transcription, chaque phrase doit être attribuée au participant qui l'a prononcée, par exemple Speaker 1 ou Speaker 2.

    Quelle fonctionnalité fournit ce résultat ?
body:
  options:
  - id: a
    text:
      en: Shot detection
      fr: La détection des plans
  - id: b
    text:
      en: Language detection
      fr: La détection de langue
  - id: c
    text:
      en: Key frame extraction
      fr: L'extraction d'images clés
  - id: d
    text:
      en: Diarization
      fr: La diarisation
answer:
  optionId: d
explanation:
  correct:
    en: Diarization distinguishes the speakers of a conversation and attributes each part of the transcript to one of them. The transcript then shows who said what, with labels such as Speaker 1 and Speaker 2.
    fr: La diarisation distingue les locuteurs d'une conversation et attribue chaque partie de la transcription à l'un d'eux. La transcription montre alors qui a dit quoi, avec des libellés comme Speaker 1 et Speaker 2.
  options:
    a:
      en: Shot detection finds the points of a video where the camera shot changes.
      fr: La détection des plans repère les instants d'une vidéo où le plan de caméra change.
    b:
      en: Language detection identifies the language that is spoken, not the person who speaks.
      fr: La détection de langue identifie la langue parlée, pas la personne qui parle.
    c:
      en: Key frame extraction selects representative images of a video.
      fr: L'extraction d'images clés sélectionne des images représentatives d'une vidéo.
references:
- title: Azure Content Understanding in Foundry Tools audio overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview
