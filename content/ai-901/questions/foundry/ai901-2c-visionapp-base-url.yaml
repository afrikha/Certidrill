id: ai901-2c-visionapp-base-url
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python application creates a client with `OpenAI(api_key=..., base_url=...)` to call a vision-enabled model deployed in a Foundry resource named `contoso-ai`.

    Which value should you pass in `base_url`?
  fr: |
    Une application Python crée un client avec `OpenAI(api_key=..., base_url=...)` pour appeler un modèle compatible avec la vision déployé dans une ressource Foundry nommée `contoso-ai`.

    Quelle valeur devez-vous transmettre dans `base_url` ?
body:
  options:
    - id: a
      text: "`https://ai.azure.com/`"
    - id: b
      text: "`https://portal.azure.com/`"
    - id: c
      text: "`https://contoso-ai.openai.azure.com/openai/v1/`"
    - id: d
      text: "`https://contoso-ai.blob.core.windows.net/`"
answer:
  optionId: c
explanation:
  correct:
    en: |
      The `base_url` of the client is the endpoint of the Foundry resource for the OpenAI API, in the form `https://<resource-name>.openai.azure.com/openai/v1/`. With this endpoint and the key, the client can send requests to the deployments of the resource.
    fr: |
      Le `base_url` du client est le point de terminaison de la ressource Foundry pour l'API OpenAI, de la forme `https://<nom-de-la-ressource>.openai.azure.com/openai/v1/`. Avec ce point de terminaison et la clé, le client peut envoyer des requêtes aux déploiements de la ressource.
  options:
    a:
      en: "`https://ai.azure.com/` is the address of the Foundry portal, used in a browser, not an API endpoint of the resource."
      fr: "`https://ai.azure.com/` est l'adresse du portail Foundry, utilisée dans un navigateur, pas un point de terminaison d'API de la ressource."
    b:
      en: "`https://portal.azure.com/` is the Azure portal, where resources are managed."
      fr: "`https://portal.azure.com/` est le portail Azure, où l'on gère les ressources."
    d:
      en: "A `blob.core.windows.net` address is the endpoint of a storage account, not of a model."
      fr: "Une adresse `blob.core.windows.net` est le point de terminaison d'un compte de stockage, pas d'un modèle."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Exercise - Get started with computer vision in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/5-exercise
