id: ai901-2d-app-yn-code
objective: "2.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You review the following Python code, which uses Azure Content Understanding in Foundry Tools.

    ```python
    client = ContentUnderstandingClient(endpoint=endpoint, credential=AzureKeyCredential(key))

    poller = client.begin_analyze(
        analyzer_id="prebuilt-receipt",
        inputs=[{"url": "https://files.contoso.com/receipts/receipt-0412.pdf"}],
    )
    result = poller.result()

    for content in result.contents:
        print(content.markdown)
        print(content.fields)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code Python suivant, qui utilise Azure Content Understanding dans Foundry Tools.

    ```python
    client = ContentUnderstandingClient(endpoint=endpoint, credential=AzureKeyCredential(key))

    poller = client.begin_analyze(
        analyzer_id="prebuilt-receipt",
        inputs=[{"url": "https://files.contoso.com/receipts/receipt-0412.pdf"}],
    )
    result = poller.result()

    for content in result.contents:
        print(content.markdown)
        print(content.fields)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: The code uploads a file from the local disk of the computer.
      fr: Le code charge un fichier depuis le disque local de l'ordinateur.
  - id: s2
    text:
      en: '`content.markdown` contains the text of the receipt as Markdown.'
      fr: '`content.markdown` contient le texte du reçu en Markdown.'
  - id: s3
    text:
      en: The code defines the schema of the fields to extract.
      fr: Le code définit le schéma des champs à extraire.
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: 'The file is referenced by its URL in `inputs`; nothing is read from the local disk. `content.markdown` holds the content of the document as Markdown and `content.fields` the extracted values. The schema isn''t in the code: it belongs to the prebuilt analyzer `prebuilt-receipt`.'
    fr: 'Le fichier est référencé par son URL dans `inputs` ; rien n''est lu sur le disque local. `content.markdown` contient le contenu du document en Markdown et `content.fields` les valeurs extraites. Le schéma ne figure pas dans le code : il appartient à l''analyseur prédéfini `prebuilt-receipt`.'
references:
