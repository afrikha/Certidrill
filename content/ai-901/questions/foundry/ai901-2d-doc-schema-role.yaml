id: ai901-2d-doc-schema-role
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: In Azure Content Understanding in Foundry Tools, which element lists the fields to extract from a document and describes how they are structured?
  fr: Dans Azure Content Understanding dans Foundry Tools, quel élément répertorie les champs à extraire d'un document et décrit leur structure ?
body:
  options:
  - id: a
    text:
      en: A base analyzer
      fr: Un analyseur de base
  - id: b
    text:
      en: A confidence score
      fr: Un score de confiance
  - id: c
    text:
      en: A field schema
      fr: Un schéma de champs
  - id: d
    text:
      en: A Markdown output
      fr: Une sortie Markdown
answer:
  optionId: c
explanation:
  correct:
    en: 'A field schema describes the information that you want to extract: the fields and their structure, including nested fields and collections. An analyzer then applies this schema to the content.'
    fr: 'Un schéma de champs décrit les informations à extraire : les champs et leur structure, y compris les champs imbriqués et les collections. Un analyseur applique ensuite ce schéma au contenu.'
  options:
    a:
      en: A base analyzer is the parent from which a custom analyzer is derived for a type of content; it doesn't list your fields.
      fr: Un analyseur de base est le parent dont dérive un analyseur personnalisé pour un type de contenu ; il ne répertorie pas vos champs.
    b:
      en: A confidence score estimates the reliability of an extracted value; it is part of the result.
      fr: Un score de confiance estime la fiabilité d'une valeur extraite ; il fait partie du résultat.
    d:
      en: Markdown is one of the output formats of the analyzed content, not a definition of fields.
      fr: Markdown est l'un des formats de sortie du contenu analysé, pas une définition de champs.
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
- title: Content Understanding Glossary
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/glossary
