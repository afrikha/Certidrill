id: ai901-2d-doc-nested-items
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You design the schema of an analyzer in Azure Content Understanding in Foundry Tools. The analyzer processes purchase orders. Each order contains a variable number of lines, and each line has a description, a quantity and a unit price.

    How should you define the order lines in the schema?
  fr: |
    Vous concevez le schéma d'un analyseur dans Azure Content Understanding dans Foundry Tools. L'analyseur traite des bons de commande. Chaque commande contient un nombre variable de lignes, et chaque ligne a une description, une quantité et un prix unitaire.

    Comment devez-vous définir les lignes de commande dans le schéma ?
body:
  options:
  - id: a
    text:
      en: As one string field that holds all the lines as text
      fr: Sous la forme d'un champ de type chaîne qui contient toutes les lignes en texte
  - id: b
    text:
      en: As three fields per line, named after the line number
      fr: Sous la forme de trois champs par ligne, nommés d'après le numéro de ligne
  - id: c
    text:
      en: As a collection field in which each item has three subfields
      fr: Sous la forme d'un champ collection dont chaque élément a trois sous-champs
  - id: d
    text:
      en: As a second analyzer that runs once for each line
      fr: Sous la forme d'un second analyseur exécuté une fois par ligne
answer:
  optionId: c
explanation:
  correct:
    en: Schemas support structured and nested fields. Repeated data such as order lines is defined as a collection (an array) whose items are objects with their own subfields, so the result contains one item per line, whatever the number of lines.
    fr: 'Les schémas prennent en charge les champs structurés et imbriqués. Les données répétées comme les lignes de commande se définissent sous la forme d''une collection (un tableau) dont les éléments sont des objets dotés de leurs propres sous-champs : le résultat contient ainsi un élément par ligne, quel que soit le nombre de lignes.'
  options:
    a:
      en: 'A single string loses the structure: the application would have to parse the text to find each quantity and price.'
      fr: 'Une chaîne unique perd la structure : l''application devrait analyser le texte pour retrouver chaque quantité et chaque prix.'
    b:
      en: The number of lines varies, so a fixed list of numbered fields can't cover every order.
      fr: 'Le nombre de lignes varie : une liste fixe de champs numérotés ne peut pas couvrir toutes les commandes.'
    d:
      en: An analyzer processes a whole file; the lines belong to the schema of the same analyzer.
      fr: Un analyseur traite un fichier entier ; les lignes relèvent du schéma du même analyseur.
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
- title: Best practices for using Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
