id: ai901-2d-img-dnd-capabilities
objective: "2.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans three solutions.

    Which capability should Northwind use for each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit trois solutions.

    Quelle fonctionnalité Northwind doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: aud
    text:
      en: A Content Understanding audio analyzer
      fr: Un analyseur audio Content Understanding
  - id: doc
    text:
      en: A Content Understanding document analyzer
      fr: Un analyseur de documents Content Understanding
  - id: img
    text:
      en: A Content Understanding image analyzer
      fr: Un analyseur d'images Content Understanding
  - id: vid
    text:
      en: A Content Understanding video analyzer
      fr: Un analyseur vidéo Content Understanding
  - id: gen
    text:
      en: An image-generation model
      fr: Un modèle de génération d'images
  targets:
  - id: t1
    text:
      en: Return the number of pallets visible in photos of a warehouse
      fr: Renvoyer le nombre de palettes visibles sur des photos d'un entrepôt
  - id: t2
    text:
      en: Return the invoice number and the dates printed on photographed invoices
      fr: Renvoyer le numéro de facture et les dates imprimés sur des factures photographiées
  - id: t3
    text:
      en: Create an illustration for a brochure from a text description
      fr: Créer une illustration pour une brochure à partir d'une description textuelle
answer:
  mapping:
    t1: img
    t2: doc
    t3: gen
explanation:
  correct:
    en: 'Counting objects in photos is image analysis: a schema field is generated from what the picture shows. A photographed invoice is mostly text, and image analyzers aren''t optimized for text-based analysis, so it goes to a document analyzer. Creating a new picture requires an image-generation model.'
    fr: 'Compter des objets sur des photos relève de l''analyse d''images : un champ du schéma est généré d''après ce que montre l''image. Une facture photographiée est surtout du texte, et les analyseurs d''images ne sont pas optimisés pour une analyse fondée sur le texte : elle relève donc d''un analyseur de documents. Créer une nouvelle image exige un modèle de génération d''images.'
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
