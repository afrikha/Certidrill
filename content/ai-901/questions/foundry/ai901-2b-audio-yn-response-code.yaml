id: ai901-2b-audio-yn-response-code
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An application sent a spoken prompt to a deployed `gpt-audio-mini` model with `modalities=["text", "audio"]` and `audio={"voice": "alloy", "format": "wav"}`. It processes the response with the following code.

    ```python
    answer = completion.choices[0].message.audio
    print(answer.transcript)

    wav_bytes = base64.b64decode(answer.data)
    with open("answer.wav", "wb") as f:
        f.write(wav_bytes)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application a envoyé une invite vocale à un modèle `gpt-audio-mini` déployé avec `modalities=["text", "audio"]` et `audio={"voice": "alloy", "format": "wav"}`. Elle traite la réponse avec le code suivant.

    ```python
    answer = completion.choices[0].message.audio
    print(answer.transcript)

    wav_bytes = base64.b64decode(answer.data)
    with open("answer.wav", "wb") as f:
        f.write(wav_bytes)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The code plays the answer through the default speaker of the computer.
        fr: Le code diffuse la réponse sur le haut-parleur par défaut de l'ordinateur.
    - id: s2
      text:
        en: The code displays the text of the spoken answer.
        fr: Le code affiche le texte de la réponse parlée.
    - id: s3
      text:
        en: The file answer.wav contains the spoken answer of the model.
        fr: Le fichier answer.wav contient la réponse parlée du modèle.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      `transcript` is the text of the spoken answer, which `print` displays. `data` is the audio in base64: the code decodes it and writes the bytes to answer.wav, in the WAV format that the request asked for. Nothing in the code plays the sound; another step would be needed for that.
    fr: |
      `transcript` est le texte de la réponse parlée, que `print` affiche. `data` est l'audio en base64 : le code le décode et écrit les octets dans answer.wav, au format WAV demandé par la requête. Rien dans le code ne diffuse le son ; il faudrait pour cela une autre étape.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
