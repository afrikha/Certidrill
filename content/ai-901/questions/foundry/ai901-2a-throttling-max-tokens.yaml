id: ai901-2a-throttling-max-tokens
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application calls a model deployment in Microsoft Foundry. During busy periods, requests fail with rate-limit errors because the deployment reaches its tokens-per-minute (TPM) limit.

    The quota of the deployment stays as it is.

    Which change to the requests reduces the throttling?
  fr: |
    Une application appelle un déploiement de modèle dans Microsoft Foundry. Aux heures de pointe, des requêtes échouent avec des erreurs de limite de débit, car le déploiement atteint sa limite de jetons par minute (TPM).

    Le quota du déploiement reste inchangé.

    Quelle modification des requêtes réduit la limitation ?
body:
  options:
    - { id: a, text: { en: "Raise the temperature value.", fr: "Augmenter la valeur de la température." } }
    - { id: b, text: { en: "Lower the max output tokens value.", fr: "Réduire le nombre maximal de jetons de sortie." } }
    - { id: c, text: { en: "Add more examples to each prompt.", fr: "Ajouter plus d'exemples à chaque invite." } }
    - { id: d, text: { en: "Send more requests concurrently.", fr: "Envoyer plus de requêtes simultanées." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Larger prompts and higher max output tokens settings consume more of the TPM of a deployment. When throttling occurs, lowering the max output tokens value or reducing the number of concurrent requests keeps the deployment under its limit.
    fr: |
      Des invites plus longues et un nombre maximal de jetons de sortie plus élevé consomment davantage du TPM d'un déploiement. En cas de limitation, réduire le nombre maximal de jetons de sortie ou le nombre de requêtes simultanées maintient le déploiement sous sa limite.
  options:
    a:
      en: "The temperature changes how random the output is, not the number of tokens that a request consumes."
      fr: "La température modifie le caractère aléatoire de la sortie, pas le nombre de jetons qu'une requête consomme."
    c:
      en: "More examples make each prompt larger, which consumes more tokens per minute."
      fr: "Plus d'exemples allongent chaque invite, ce qui consomme plus de jetons par minute."
    d:
      en: "More concurrent requests consume the TPM faster and increase the throttling."
      fr: "Plus de requêtes simultanées consomment le TPM plus vite et aggravent la limitation."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
