id: ai901-2a-grounding-and-out
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An application of Woodgrove Bank sends the following system prompt to a model. Before each request, the application replaces `{passages}` with text retrieved from the fee schedule of the bank.

    ```text
    You answer questions about Woodgrove Bank fees.
    Use only the passages below.
    If the passages don't contain the answer, say "I can't find that in the fee schedule."
    ---
    {passages}
    ---
    ```

    Which two prompt engineering techniques does this system prompt apply?

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application de Woodgrove Bank envoie l'invite système suivante à un modèle. Avant chaque requête, l'application remplace `{passages}` par du texte récupéré dans la grille tarifaire de la banque.

    ```text
    Vous répondez aux questions sur les frais de Woodgrove Bank.
    Utilisez uniquement les passages ci-dessous.
    Si les passages ne contiennent pas la réponse, dites « Je ne trouve pas cette information dans la grille tarifaire. »
    ---
    {passages}
    ---
    ```

    Quelles sont les deux techniques d'ingénierie d'invite que cette invite système applique ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Few-shot learning", fr: "L'apprentissage en quelques exemples (few-shot)" } }
    - { id: b, text: { en: "Providing grounding context", fr: "La fourniture d'un contexte d'ancrage" } }
    - { id: c, text: { en: "Chain of thought prompting", fr: "La chaîne de pensée (chain of thought)" } }
    - { id: d, text: { en: "Giving the model an \"out\"", fr: "Une porte de sortie donnée au modèle" } }
    - { id: e, text: { en: "Priming the output with a cue", fr: "L'amorçage de la sortie par un signal (cue)" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The retrieved passages are grounding context: data from which the model must draw its answer. The sentence to say when the passages don't contain the answer gives the model an "out", an alternative path that helps it avoid a false response.
    fr: |
      Les passages récupérés constituent un contexte d'ancrage : des données dans lesquelles le modèle doit puiser sa réponse. La phrase à dire quand les passages ne contiennent pas la réponse donne au modèle une porte de sortie, une autre voie qui l'aide à éviter une fausse réponse.
  options:
    a:
      en: "Few-shot learning requires examples of inputs with the expected outputs. The prompt contains none."
      fr: "L'apprentissage en quelques exemples exige des exemples d'entrées avec les sorties attendues. L'invite n'en contient aucun."
    c:
      en: "Nothing asks the model to proceed step by step or to show its steps."
      fr: "Rien ne demande au modèle de procéder étape par étape ni de montrer ses étapes."
    e:
      en: "A cue is a prefix placed at the end of the prompt to start the output in the desired form. The prompt ends with the passages, not with a cue."
      fr: "Un signal (cue) est un préfixe placé à la fin de l'invite pour amorcer la sortie dans la forme voulue. L'invite se termine par les passages, pas par un signal."
references:
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
