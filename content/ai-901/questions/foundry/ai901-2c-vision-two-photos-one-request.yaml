id: ai901-2c-vision-two-photos-one-request
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance application must ask a vision-enabled model deployed in Microsoft Foundry to describe the differences between two photos of the same car, taken before and after a repair.

    What should the application send to the model?
  fr: |
    Une application d'assurance doit demander à un modèle compatible avec la vision déployé dans Microsoft Foundry de décrire les différences entre deux photos d'une même voiture, prises avant et après une réparation.

    Que doit envoyer l'application au modèle ?
body:
  options:
    - id: a
      text:
        en: "One request that contains a text instruction and both photos"
        fr: "Une requête qui contient une instruction en texte et les deux photos"
    - id: b
      text:
        en: "Two requests, each with one photo, to two different deployments"
        fr: "Deux requêtes, chacune avec une photo, à deux déploiements différents"
    - id: c
      text:
        en: "One request that contains only the second photo and no text"
        fr: "Une requête qui ne contient que la seconde photo, sans texte"
    - id: d
      text:
        en: "One request with the file names of the two photos as text"
        fr: "Une requête avec les noms de fichier des deux photos sous forme de texte"
answer:
  optionId: a
explanation:
  correct:
    en: |
      A prompt for a vision-enabled model is made of a text instruction and one or more image inputs sent in the same request. With both photos and the instruction in one request, the model can look at the two images together and describe what changed.
    fr: |
      Une invite destinée à un modèle compatible avec la vision se compose d'une instruction en texte et d'une ou plusieurs images en entrée, envoyées dans la même requête. Avec les deux photos et l'instruction dans une seule requête, le modèle peut examiner les deux images ensemble et décrire ce qui a changé.
  options:
    b:
      en: "Two deployments that each see one photo can't compare the photos with each other."
      fr: "Deux déploiements qui ne voient chacun qu'une photo ne peuvent pas comparer les photos entre elles."
    c:
      en: "With one photo and no instruction, the model has nothing to compare and doesn't know the task."
      fr: "Avec une seule photo et sans instruction, le modèle n'a rien à comparer et ne connaît pas la tâche."
    d:
      en: "File names give the model no image content to examine."
      fr: "Des noms de fichier ne donnent au modèle aucun contenu d'image à examiner."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
