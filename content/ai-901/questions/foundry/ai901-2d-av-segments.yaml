id: ai901-2d-av-segments
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You analyze a 40-minute recorded webinar by using the `prebuilt-videoSearch` analyzer of Azure Content Understanding in Foundry Tools. The result contains several content items.

    What does each content item represent?
  fr: |
    Vous analysez un webinaire enregistré de 40 minutes à l'aide de l'analyseur `prebuilt-videoSearch` d'Azure Content Understanding dans Foundry Tools. Le résultat contient plusieurs éléments de contenu.

    Que représente chaque élément de contenu ?
body:
  options:
  - id: a
    text:
      en: One speaker, with everything that the speaker said
      fr: Un locuteur, avec tout ce que ce locuteur a dit
  - id: b
    text:
      en: One segment, with its transcript and its description
      fr: Un segment, avec sa transcription et sa description
  - id: c
    text:
      en: One key frame, with the text visible in the frame
      fr: Une image clé, avec le texte visible dans l'image
  - id: d
    text:
      en: One language, with the phrases spoken in that language
      fr: Une langue, avec les phrases prononcées dans cette langue
answer:
  optionId: b
explanation:
  correct:
    en: '`prebuilt-videoSearch` divides a video into segments, for example at topic shifts or scene changes, and returns one content item per segment. Each item has its own time range, transcript, key frames and generated description.'
    fr: '`prebuilt-videoSearch` divise une vidéo en segments, par exemple aux changements de sujet ou de scène, et renvoie un élément de contenu par segment. Chaque élément a sa propre plage de temps, sa transcription, ses images clés et sa description générée.'
  options:
    a:
      en: Speakers are identified inside the transcript of each segment; they aren't separate content items.
      fr: Les locuteurs sont identifiés à l'intérieur de la transcription de chaque segment ; ce ne sont pas des éléments de contenu distincts.
    c:
      en: Key frames are listed inside each segment; one segment contains several of them.
      fr: Les images clés sont répertoriées à l'intérieur de chaque segment ; un segment en contient plusieurs.
    d:
      en: The language is a property of the phrases of the transcript, not a way to divide the result.
      fr: La langue est une propriété des phrases de la transcription, pas une façon de diviser le résultat.
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
- title: 'AudioVisual analysis: extracting structured content with Azure Content Understanding in Foundry Tools'
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/elements
