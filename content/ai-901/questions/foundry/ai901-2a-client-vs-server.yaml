id: ai901-2a-client-vs-server
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A lightweight chat client calls a model deployment in Microsoft Foundry.

    Which task is performed by the client application?
  fr: |
    Un client de conversation léger appelle un déploiement de modèle dans Microsoft Foundry.

    Quelle tâche est effectuée par l'application cliente ?
body:
  options:
    - { id: a, text: { en: "Collecting the user's input and displaying the returned output", fr: "Recueillir la saisie de l'utilisateur et afficher la sortie renvoyée" } }
    - { id: b, text: { en: "Running inference on the model to generate the output", fr: "Exécuter l'inférence sur le modèle pour générer la sortie" } }
    - { id: c, text: { en: "Applying the safety settings of the deployment to the request", fr: "Appliquer à la requête les paramètres de sécurité du déploiement" } }
    - { id: d, text: { en: "Allocating the compute resources that the model needs", fr: "Allouer les ressources de calcul dont le modèle a besoin" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In this client-server interaction, the client presents an interface, collects the user's input, formats it into a prompt or an API request, sends it to the model endpoint and displays the returned output. The server, which is the model deployment, receives the prompt, runs inference, applies the system instructions and safety, and returns the generated output.
    fr: |
      Dans cette interaction client-serveur, le client présente une interface, recueille la saisie de l'utilisateur, la met en forme dans une invite ou une requête d'API, l'envoie au point de terminaison du modèle et affiche la sortie renvoyée. Le serveur, c'est-à-dire le déploiement de modèle, reçoit l'invite, exécute l'inférence, applique les instructions système et la sécurité, puis renvoie la sortie générée.
  options:
    b:
      en: "Inference runs on the server side, in the model deployment."
      fr: "L'inférence s'exécute côté serveur, dans le déploiement de modèle."
    c:
      en: "Safety is applied by the server when it processes the prompt."
      fr: "La sécurité est appliquée par le serveur lorsqu'il traite l'invite."
    d:
      en: "Compute resources are allocated in Foundry when the model is deployed."
      fr: "Les ressources de calcul sont allouées dans Foundry au moment du déploiement du modèle."
references:
  - title: "Microsoft Foundry for AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/4-microsoft-foundry
