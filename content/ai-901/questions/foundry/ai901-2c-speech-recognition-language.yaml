id: ai901-2c-speech-recognition-language
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A call center in Germany uses an application built with the Azure Speech SDK to transcribe calls. The callers speak German.

    Which property of the `SpeechConfig` object should you set to `de-DE`?
  fr: |
    Un centre d'appels en Allemagne utilise une application créée avec le SDK Azure Speech pour transcrire des appels. Les appelants parlent allemand.

    Quelle propriété de l'objet `SpeechConfig` devez-vous définir sur `de-DE` ?
body:
  options:
    - id: a
      text: "`speech_synthesis_voice_name`"
    - id: b
      text: "`speech_synthesis_language`"
    - id: c
      text: "`endpoint_id`"
    - id: d
      text: "`speech_recognition_language`"
answer:
  optionId: d
explanation:
  correct:
    en: |
      The language of the audio to transcribe is set with the `speech_recognition_language` property of the `SpeechConfig` object, for example `speech_config.speech_recognition_language = "de-DE"`. The `SpeechRecognizer` object created from this configuration then expects German speech.
    fr: |
      La langue de l'audio à transcrire se définit avec la propriété `speech_recognition_language` de l'objet `SpeechConfig`, par exemple `speech_config.speech_recognition_language = "de-DE"`. L'objet `SpeechRecognizer` créé à partir de cette configuration attend alors de la parole en allemand.
  options:
    a:
      en: "`speech_synthesis_voice_name` selects the voice of a speech synthesis and expects a voice name, not a locale."
      fr: "`speech_synthesis_voice_name` sélectionne la voix d'une synthèse vocale et attend un nom de voix, pas des paramètres régionaux."
    b:
      en: "`speech_synthesis_language` selects the language of synthesized speech; the application transcribes, it doesn't speak."
      fr: "`speech_synthesis_language` sélectionne la langue de la parole synthétisée ; l'application transcrit, elle ne parle pas."
    c:
      en: "`endpoint_id` identifies a deployed custom model; it doesn't contain a language code."
      fr: "`endpoint_id` identifie un modèle personnalisé déployé ; il ne contient pas de code de langue."
references:
  - title: "How to recognize speech"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-recognize-speech
