id: ai901-2b-client-yn-request
objective: "2.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A client application sends a request to an agent with the following code. The agent has a knowledge file named **warranty.pdf**.

    ```python
    openai_client = project_client.get_openai_client()

    response = openai_client.responses.create(
        input=[{"role": "user", "content": "How long is the warranty?"}],
        extra_body={"agent": {"name": "warranty-agent", "type": "agent_reference"}},
    )
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application cliente envoie une requête à un agent avec le code suivant. L'agent dispose d'un fichier de connaissances nommé **warranty.pdf**.

    ```python
    openai_client = project_client.get_openai_client()

    response = openai_client.responses.create(
        input=[{"role": "user", "content": "How long is the warranty?"}],
        extra_body={"agent": {"name": "warranty-agent", "type": "agent_reference"}},
    )
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The request is sent through the Responses API.
        fr: La requête est envoyée par l'intermédiaire de l'API Responses.
    - id: s2
      text:
        en: The `input` argument carries the prompt of the user.
        fr: L'argument `input` porte l'invite de l'utilisateur.
    - id: s3
      text:
        en: The client must attach warranty.pdf to the request so that the agent can use it.
        fr: Le client doit joindre warranty.pdf à la requête pour que l'agent puisse l'utiliser.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      `get_openai_client()` returns an OpenAI-compatible client, and `responses.create` submits the prompt through the Responses API. The user's message is in `input`. The knowledge file was indexed when it was added to the agent in Foundry: the agent retrieves from it by itself, and the client sends nothing but the prompt and the agent reference.
    fr: |
      `get_openai_client()` renvoie un client compatible OpenAI, et `responses.create` soumet l'invite par l'intermédiaire de l'API Responses. Le message de l'utilisateur se trouve dans `input`. Le fichier de connaissances a été indexé quand il a été ajouté à l'agent dans Foundry : l'agent y puise de lui-même, et le client n'envoie rien d'autre que l'invite et la référence à l'agent.
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
