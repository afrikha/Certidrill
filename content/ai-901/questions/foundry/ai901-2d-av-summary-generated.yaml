id: ai901-2d-av-summary-generated
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The schema of an audio analyzer of Azure Content Understanding in Foundry Tools contains a field named `CallSummary`. No sentence of the recording states the summary.

    How does the analyzer produce the value of the field?
  fr: |
    Le schéma d'un analyseur audio d'Azure Content Understanding dans Foundry Tools contient un champ nommé `CallSummary`. Aucune phrase de l'enregistrement n'énonce le résumé.

    Comment l'analyseur produit-il la valeur du champ ?
body:
  options:
  - id: a
    text:
      en: It copies the first sentence of the transcript.
      fr: Il copie la première phrase de la transcription.
  - id: b
    text:
      en: It reads the value from the metadata of the audio file.
      fr: Il lit la valeur dans les métadonnées du fichier audio.
  - id: c
    text:
      en: A reviewer types the value in the Foundry portal.
      fr: Un réviseur saisit la valeur dans le portail Foundry.
  - id: d
    text:
      en: A generative model writes the value from the transcript.
      fr: Un modèle génératif rédige la valeur à partir de la transcription.
answer:
  optionId: d
explanation:
  correct:
    en: The analyzer first transcribes the speech. A generative model then produces the fields of the schema from the transcript; a summary is a typical generated value that appears nowhere in the recording itself.
    fr: L'analyseur transcrit d'abord la parole. Un modèle génératif produit ensuite les champs du schéma à partir de la transcription ; un résumé est une valeur générée typique, qui n'apparaît nulle part dans l'enregistrement lui-même.
  options:
    a:
      en: The first sentence of a call is usually a greeting, not a summary; nothing is copied blindly.
      fr: La première phrase d'un appel est en général une salutation, pas un résumé ; rien n'est copié aveuglément.
    b:
      en: File metadata describes the file (format, duration), not the content of the conversation.
      fr: Les métadonnées du fichier décrivent le fichier (format, durée), pas le contenu de la conversation.
    c:
      en: The purpose of the analyzer is to produce the value automatically, without manual entry.
      fr: Le but de l'analyseur est de produire la valeur automatiquement, sans saisie manuelle.
references:
- title: Azure Content Understanding in Foundry Tools audio overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview
- title: What is Azure Content Understanding in Foundry Tools?
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
