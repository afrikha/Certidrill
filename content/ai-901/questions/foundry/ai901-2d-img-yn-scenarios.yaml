id: ai901-2d-img-yn-scenarios
objective: "2.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam evaluates image analysis in Azure Content Understanding in Foundry Tools for three projects.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam évalue l'analyse d'images dans Azure Content Understanding dans Foundry Tools pour trois projets.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Image analysis is suited to flagging the photos of circuit boards that show a visible crack.
      fr: L'analyse d'images convient pour signaler les photos de circuits imprimés qui présentent une fissure visible.
  - id: s2
    text:
      en: Image analysis is suited to producing a photo of a product on a white background from a text description.
      fr: L'analyse d'images convient pour produire la photo d'un produit sur fond blanc à partir d'une description textuelle.
  - id: s3
    text:
      en: Image analysis is suited to returning the type of a chart and its overall trend from an image of the chart.
      fr: L'analyse d'images convient pour renvoyer le type d'un graphique et sa tendance générale à partir d'une image du graphique.
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: 'Detecting defects such as scratches or cracks for quality control and analyzing charts for reports are documented uses of image analysis: both extract information from existing images. Producing a new picture from a description is image generation, which requires an image-generation model.'
    fr: 'La détection de défauts comme des rayures ou des fissures pour le contrôle qualité et l''analyse de graphiques pour des rapports sont des usages documentés de l''analyse d''images : les deux extraient des informations d''images existantes. Produire une nouvelle image à partir d''une description relève de la génération d''images, qui exige un modèle de génération d''images.'
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
