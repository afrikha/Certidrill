id: ai901-2c-imagegen-flux-family
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which statement describes the FLUX models that are available in Microsoft Foundry?
  fr: |
    Quelle affirmation décrit les modèles FLUX disponibles dans Microsoft Foundry ?
body:
  options:
    - id: a
      text:
        en: "A family of video-generation models from OpenAI"
        fr: "Une famille de modèles de génération de vidéos d'OpenAI"
    - id: b
      text:
        en: "A family of image-generation models from Black Forest Labs"
        fr: "Une famille de modèles de génération d'images de Black Forest Labs"
    - id: c
      text:
        en: "A family of small language models from Microsoft"
        fr: "Une famille de petits modèles de langage de Microsoft"
    - id: d
      text:
        en: "A family of neural voices in Azure Speech"
        fr: "Une famille de voix neuronales dans Azure Speech"
answer:
  optionId: b
explanation:
  correct:
    en: |
      FLUX is a family of image-generation models created by Black Forest Labs and offered in Foundry as third-party models. They produce photorealistic and stylistically flexible images from text prompts, next to the GPT-Image family.
    fr: |
      FLUX est une famille de modèles de génération d'images créée par Black Forest Labs et proposée dans Foundry en tant que modèles tiers. Ils produisent des images photoréalistes et de styles variés à partir d'invites en texte, à côté de la famille GPT-Image.
  options:
    a:
      en: "The video-generation models from OpenAI in Foundry are the Sora models."
      fr: "Les modèles de génération de vidéos d'OpenAI dans Foundry sont les modèles Sora."
    c:
      en: "FLUX models generate images; they aren't language models."
      fr: "Les modèles FLUX génèrent des images ; ce ne sont pas des modèles de langage."
    d:
      en: "Neural voices belong to speech synthesis in Azure Speech, which is unrelated to FLUX."
      fr: "Les voix neuronales relèvent de la synthèse vocale dans Azure Speech, sans rapport avec FLUX."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
