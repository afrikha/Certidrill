id: ai901-2a-openai-client-key-code
objective: "2.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You write a chat client with the `openai` package. The client must call the Azure OpenAI endpoint of the Foundry resource named **contoso-ai** and authenticate with the API key stored in an environment variable.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un client de conversation avec le package `openai`. Le client doit appeler le point de terminaison Azure OpenAI de la ressource Foundry nommée **contoso-ai** et s'authentifier avec la clé d'API stockée dans une variable d'environnement.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    import os
    from openai import OpenAI

    client = OpenAI(
        [[url]]="https://contoso-ai.openai.azure.com/openai/v1/",
        [[key]]=os.environ["AZURE_OPENAI_API_KEY"],
    )

    response = client.responses.create(
        model="chat-prod",
        input="Give me a fun fact about bees.",
    )
  slots:
    - id: url
      options:
        - { id: ep, text: "endpoint" }
        - { id: bu, text: "base_url" }
        - { id: md, text: "model" }
    - id: key
      options:
        - { id: cr, text: "credential" }
        - { id: tp, text: "azure_ad_token_provider" }
        - { id: ak, text: "api_key" }
answer:
  values: { url: bu, key: ak }
explanation:
  correct:
    en: |
      The `OpenAI` client takes the Azure OpenAI endpoint of the resource, which ends with `/openai/v1/`, in `base_url`, and the key in `api_key`. The call to `responses.create` is then the same as with the client returned by the Foundry SDK.
    fr: |
      Le client `OpenAI` reçoit dans `base_url` le point de terminaison Azure OpenAI de la ressource, qui se termine par `/openai/v1/`, et la clé dans `api_key`. L'appel à `responses.create` est ensuite le même qu'avec le client renvoyé par le SDK Foundry.
  options:
    ep:
      en: "`endpoint` is the argument of `AIProjectClient`, which takes a project endpoint."
      fr: "`endpoint` est l'argument d'`AIProjectClient`, qui reçoit un point de terminaison de projet."
    md:
      en: "`model` is an argument of `responses.create`; it names the deployment."
      fr: "`model` est un argument de `responses.create` ; il nomme le déploiement."
    cr:
      en: "`credential` is the argument of `AIProjectClient`, which takes a Microsoft Entra ID credential such as `DefaultAzureCredential()`."
      fr: "`credential` est l'argument d'`AIProjectClient`, qui reçoit des informations d'identification Microsoft Entra ID comme `DefaultAzureCredential()`."
    tp:
      en: "`azure_ad_token_provider` is used by the `AnthropicFoundry` client for Microsoft Entra ID tokens, not for an API key."
      fr: "`azure_ad_token_provider` est utilisé par le client `AnthropicFoundry` pour des jetons Microsoft Entra ID, pas pour une clé d'API."
references:
  - title: "Microsoft Foundry SDKs and endpoints"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
