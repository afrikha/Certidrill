id: ai901-2b-agent-dd-components
objective: "2.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You describe the parts of an agent in Microsoft Foundry to a colleague.

    How should you complete the description? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous décrivez à un collègue les éléments d'un agent dans Microsoft Foundry.

    Comment devez-vous compléter la description ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      What defines the role, the tone and the constraints of the agent: [[c1]]

      What lets the agent take actions, such as calling an external system: [[c2]]

      What supplies documents that are indexed and retrieved to ground the answers: [[c3]]
    fr: |
      Ce qui définit le rôle, le ton et les contraintes de l'agent : [[c1]]

      Ce qui permet à l'agent d'effectuer des actions, comme appeler un système externe : [[c2]]

      Ce qui fournit des documents indexés puis récupérés pour ancrer les réponses : [[c3]]
  slots:
    - id: c1
      options:
        - { id: ins, text: { en: "Instructions", fr: "Instructions" } }
        - { id: tools, text: { en: "Tools", fr: "Outils" } }
        - { id: know, text: { en: "Knowledge", fr: "Connaissances" } }
        - { id: model, text: { en: "Model", fr: "Modèle" } }
    - id: c2
      options:
        - { id: ins, text: { en: "Instructions", fr: "Instructions" } }
        - { id: tools, text: { en: "Tools", fr: "Outils" } }
        - { id: know, text: { en: "Knowledge", fr: "Connaissances" } }
        - { id: model, text: { en: "Model", fr: "Modèle" } }
    - id: c3
      options:
        - { id: ins, text: { en: "Instructions", fr: "Instructions" } }
        - { id: tools, text: { en: "Tools", fr: "Outils" } }
        - { id: know, text: { en: "Knowledge", fr: "Connaissances" } }
        - { id: model, text: { en: "Model", fr: "Modèle" } }
answer:
  values: { c1: ins, c2: tools, c3: know }
explanation:
  correct:
    en: |
      The instructions are the system prompt: role, behavior, style and constraints. Tools are actions that the agent can take, such as searching the web or calling an external system. Knowledge is context: documents that Foundry indexes and retrieves to ground the answers. The model provides the reasoning; it doesn't define rules, perform actions or supply documents by itself.
    fr: |
      Les instructions sont l'invite système : rôle, comportement, style et contraintes. Les outils sont des actions que l'agent peut effectuer, comme chercher sur le web ou appeler un système externe. Les connaissances sont du contexte : des documents que Foundry indexe et récupère pour ancrer les réponses. Le modèle fournit le raisonnement ; à lui seul, il ne définit pas de règles, n'effectue pas d'actions et ne fournit pas de documents.
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
