id: ai901-2c-speech-tts-playground
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before you write code, you want to try speech synthesis in the Foundry portal.

    What can you do in the **Azure Speech - Text to Speech** playground?
  fr: |
    Avant d'écrire du code, vous voulez essayer la synthèse vocale dans le portail Foundry.

    Que pouvez-vous faire dans le terrain de jeu **Azure Speech - Text to Speech** ?
body:
  options:
    - id: a
      text:
        en: "Upload an audio file and get its transcription"
        fr: "Charger un fichier audio et obtenir sa transcription"
    - id: b
      text:
        en: "Upload an image and ask a question about it"
        fr: "Charger une image et poser une question à son sujet"
    - id: c
      text:
        en: "Describe an image and have it generated"
        fr: "Décrire une image et la faire générer"
    - id: d
      text:
        en: "Choose a voice and adjust its speed and pitch"
        fr: "Choisir une voix et régler sa vitesse et sa hauteur"
answer:
  optionId: d
explanation:
  correct:
    en: |
      In the text to speech playground, you select one of the available synthetic voices, adjust parameters such as the speed and the pitch, and listen to the audio generated from a text. It is a way to choose a voice before using the API in an application.
    fr: |
      Dans le terrain de jeu de synthèse vocale, vous sélectionnez l'une des voix synthétiques disponibles, vous réglez des paramètres comme la vitesse et la hauteur, et vous écoutez l'audio généré à partir d'un texte. C'est un moyen de choisir une voix avant d'utiliser l'API dans une application.
  options:
    a:
      en: "Transcribing an uploaded or recorded audio file is done in the Azure Speech - Speech to Text playground."
      fr: "La transcription d'un fichier audio chargé ou enregistré se fait dans le terrain de jeu Azure Speech - Speech to Text."
    b:
      en: "Asking a question about an uploaded image is done in the playground of a vision-enabled model."
      fr: "Poser une question sur une image chargée se fait dans le terrain de jeu d'un modèle compatible avec la vision."
    c:
      en: "Generating an image from a description is done with an image-generation model, not with Azure Speech."
      fr: "Générer une image à partir d'une description se fait avec un modèle de génération d'images, pas avec Azure Speech."
references:
  - title: "Speech synthesis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
