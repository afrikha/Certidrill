id: ai901-2d-doc-id-prebuilt
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank opens accounts online. Each customer uploads a scan of a passport or a driver license. The bank needs the name, the date of birth and the document number as named values, without defining a schema.

    Which analyzer should the bank use?
  fr: |
    Woodgrove Bank ouvre des comptes en ligne. Chaque client charge la numérisation d'un passeport ou d'un permis de conduire. La banque a besoin du nom, de la date de naissance et du numéro du document sous forme de valeurs nommées, sans définir de schéma.

    Quel analyseur la banque doit-elle utiliser ?
body:
  options:
  - id: a
    text: '`prebuilt-layout`'
  - id: b
    text: '`prebuilt-invoice`'
  - id: c
    text: '`prebuilt-imageSearch`'
  - id: d
    text: '`prebuilt-idDocument`'
answer:
  optionId: d
explanation:
  correct:
    en: '`prebuilt-idDocument` is a domain-specific prebuilt analyzer for identity documents such as passports and driver licenses. It returns their fields without you defining a schema.'
    fr: '`prebuilt-idDocument` est un analyseur prédéfini propre à un domaine, destiné aux documents d''identité comme les passeports et les permis de conduire. Il renvoie leurs champs sans que vous définissiez de schéma.'
  options:
    a:
      en: '`prebuilt-layout` returns the text and the structure of a document, not named values.'
      fr: '`prebuilt-layout` renvoie le texte et la structure d''un document, pas des valeurs nommées.'
    b:
      en: '`prebuilt-invoice` returns the fields of invoices, such as the customer and the due date.'
      fr: '`prebuilt-invoice` renvoie les champs des factures, comme le client et la date d''échéance.'
    c:
      en: '`prebuilt-imageSearch` generates a description of an image; it doesn''t return the fields of an identity document.'
      fr: '`prebuilt-imageSearch` génère une description d''une image ; il ne renvoie pas les champs d''un document d''identité.'
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
