id: ai901-2b-text-env-file
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python application that analyzes text starts with the following code.

    ```python
    load_dotenv()
    endpoint = os.getenv("AZURE_LANGUAGE_ENDPOINT")
    key = os.getenv("API_KEY")
    ```

    Where does the application expect the endpoint and the key to be defined?
  fr: |
    Une application Python qui analyse du texte commence par le code suivant.

    ```python
    load_dotenv()
    endpoint = os.getenv("AZURE_LANGUAGE_ENDPOINT")
    key = os.getenv("API_KEY")
    ```

    Où l'application s'attend-elle à trouver la définition du point de terminaison et de la clé ?
body:
  options:
    - { id: a, text: { en: "In a `.env` configuration file", fr: "Dans un fichier de configuration `.env`" } }
    - { id: b, text: { en: "In the instructions of the model deployment", fr: "Dans les instructions du déploiement de modèle" } }
    - { id: c, text: { en: "In the result returned by Azure Language", fr: "Dans le résultat renvoyé par Azure Language" } }
    - { id: d, text: { en: "In the text that is sent for analysis", fr: "Dans le texte envoyé pour analyse" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `load_dotenv()` loads the values of a `.env` file into the environment of the application, and `os.getenv()` reads each value by its name. Keeping the endpoint and the key in this configuration file avoids writing them in the code; the names in the file must match the names used in the code.
    fr: |
      `load_dotenv()` charge les valeurs d'un fichier `.env` dans l'environnement de l'application, et `os.getenv()` lit chaque valeur par son nom. Conserver le point de terminaison et la clé dans ce fichier de configuration évite de les écrire dans le code ; les noms du fichier doivent correspondre à ceux utilisés dans le code.
  options:
    b:
      en: "Instructions are a system prompt for a model; they don't hold connection settings for an application."
      fr: "Les instructions sont une invite système destinée à un modèle ; elles ne contiennent pas les paramètres de connexion d'une application."
    c:
      en: "The application needs the endpoint and the key before it can call the service at all."
      fr: "L'application a besoin du point de terminaison et de la clé avant même de pouvoir appeler le service."
    d:
      en: "The analyzed text is the data of the request, not its configuration."
      fr: "Le texte analysé constitue les données de la requête, pas sa configuration."
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
