id: ai901-2a-system-prompt-limits-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You design the system prompt of an assistant that is based on a model deployed in Microsoft Foundry.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez l'invite système d'un assistant fondé sur un modèle déployé dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The system prompt guarantees that the model complies with every rule that it contains.", fr: "L'invite système garantit que le modèle respecte chacune des règles qu'elle contient." } }
    - { id: s2, text: { en: "A long system prompt uses space in the context window of the model.", fr: "Une invite système longue occupe de la place dans la fenêtre de contexte du modèle." } }
    - { id: s3, text: { en: "The system prompt can require responses in a structured format such as JSON.", fr: "L'invite système peut exiger des réponses dans un format structuré comme JSON." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A system prompt influences the model but doesn't guarantee compliance, so you test it and combine it with other mitigations such as filtering and evaluation. An overly long system prompt consumes space in the context window. Specifying an output format, such as JSON with fixed keys, is one of the common uses of a system prompt.
    fr: |
      Une invite système influence le modèle mais ne garantit pas le respect des règles : vous la testez et vous la combinez avec d'autres mesures, comme le filtrage et l'évaluation. Une invite système trop longue consomme de la place dans la fenêtre de contexte. Imposer un format de sortie, comme du JSON avec des clés fixes, est l'un des usages courants d'une invite système.
references:
  - title: "System message design"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/advanced-prompt-engineering
