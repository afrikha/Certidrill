id: ai901-2d-app-dnd-code-roles
objective: "2.4.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You review the following Python code, which uses Azure Content Understanding in Foundry Tools.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-invoice",
        inputs=[{"url": file_url}],
    )
    result = poller.result()

    for content in result.contents:
        print(content.markdown)
        print(content.fields)
    ```

    Which element of the code matches each description? To answer, drag the appropriate elements to the correct descriptions. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code Python suivant, qui utilise Azure Content Understanding dans Foundry Tools.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-invoice",
        inputs=[{"url": file_url}],
    )
    result = poller.result()

    for content in result.contents:
        print(content.markdown)
        print(content.fields)
    ```

    Quel élément du code correspond à chaque description ? Pour répondre, faites glisser les éléments appropriés vers les descriptions correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: aid
    text: '`analyzer_id`'
  - id: inp
    text: '`inputs`'
  - id: res
    text: '`poller.result()`'
  - id: md
    text: '`content.markdown`'
  - id: fld
    text: '`content.fields`'
  targets:
  - id: t1
    text:
      en: Selects the analyzer that the service runs
      fr: Sélectionne l'analyseur que le service exécute
  - id: t2
    text:
      en: Waits for the end of the analysis
      fr: Attend la fin de l'analyse
  - id: t3
    text:
      en: Holds the named values that were extracted
      fr: Contient les valeurs nommées extraites
  - id: t4
    text:
      en: Holds the text of the document
      fr: Contient le texte du document
answer:
  mapping:
    t1: aid
    t2: res
    t3: fld
    t4: md
explanation:
  correct:
    en: '`analyzer_id` names the prebuilt or custom analyzer to run. `poller.result()` waits until the asynchronous analysis is complete and returns the result. In each content item, `fields` holds the extracted values and `markdown` the text of the document. `inputs` describes the file to analyze.'
    fr: '`analyzer_id` désigne l''analyseur prédéfini ou personnalisé à exécuter. `poller.result()` attend la fin de l''analyse asynchrone et renvoie le résultat. Dans chaque élément de contenu, `fields` contient les valeurs extraites et `markdown` le texte du document. `inputs` décrit le fichier à analyser.'
references:
