id: ai901-2c-visionapp-local-image-data-url
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Python application must ask a deployed vision-enabled model to describe a photo stored on the user's device in a file named `photo.jpg`. The application reads the file and stores its base64-encoded content in a variable named `b64`.

    Which content item should the application add to the user message?
  fr: |
    Une application Python doit demander à un modèle compatible avec la vision déployé de décrire une photo stockée sur l'appareil de l'utilisateur dans un fichier nommé `photo.jpg`. L'application lit le fichier et stocke son contenu encodé en base64 dans une variable nommée `b64`.

    Quel élément de contenu l'application doit-elle ajouter au message utilisateur ?
body:
  options:
    - id: a
      text: "`{\"type\": \"input_image\", \"image_url\": \"photo.jpg\"}`"
    - id: b
      text: "`{\"type\": \"input_image\", \"image_url\": f\"data:image/jpeg;base64,{b64}\"}`"
    - id: c
      text: "`{\"type\": \"input_text\", \"text\": b64}`"
    - id: d
      text: "`{\"type\": \"image_generation\", \"image_url\": b64}`"
answer:
  optionId: b
explanation:
  correct:
    en: |
      An image is passed in an `input_image` item whose `image_url` is either a URL or a data URL. For a local file, the application builds a data URL that starts with the media type and `base64`, followed by the encoded content: `data:image/jpeg;base64,...`.
    fr: |
      Une image se transmet dans un élément `input_image` dont `image_url` est soit une URL, soit une URL de données. Pour un fichier local, l'application construit une URL de données qui commence par le type de média et `base64`, suivis du contenu encodé : `data:image/jpeg;base64,...`.
  options:
    a:
      en: "A local file name isn't a URL that the service can fetch, and it carries no image data."
      fr: "Un nom de fichier local n'est pas une URL que le service peut récupérer, et il ne porte aucune donnée d'image."
    c:
      en: "Sent as `input_text`, the base64 string is treated as ordinary text, not as an image."
      fr: "Envoyée comme `input_text`, la chaîne base64 est traitée comme du texte ordinaire, pas comme une image."
    d:
      en: "`image_generation` is the type of a tool that creates images, not of a content item that carries one."
      fr: "`image_generation` est le type d'un outil qui crée des images, pas d'un élément de contenu qui en porte une."
references:
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
