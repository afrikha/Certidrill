id: ai901-2c-visionapp-code-lines-hotarea
objective: "2.3.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You review the following Python code of an application that analyzes a photo with a model deployed in Microsoft Foundry.

    Answer each prompt by selecting the appropriate line of code.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code Python suivant, issu d'une application qui analyse une photo avec un modèle déployé dans Microsoft Foundry.

    Répondez à chaque consigne en sélectionnant la ligne de code appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "The line that you change to ask a different question about the photo"
        fr: "La ligne à modifier pour poser une autre question sur la photo"
    - id: p2
      text:
        en: "The line that identifies the Foundry resource that receives the request"
        fr: "La ligne qui identifie la ressource Foundry qui reçoit la requête"
  grid:
    header:
      - en: "Line"
        fr: "Ligne"
      - "Code"
    rows:
      - - text: "1"
        - text: "`client = OpenAI(api_key=key, base_url=\"https://contoso-ai.openai.azure.com/openai/v1/\")`"
          area: l1
      - - text: "2"
        - text: "`response = client.responses.create(`"
          area: l2
      - - text: "3"
        - text: "`model=\"defect-vision\",`"
          area: l3
      - - text: "4"
        - text: "`input=[{\"role\": \"user\", \"content\": [`"
          area: l4
      - - text: "5"
        - text: "`{\"type\": \"input_text\", \"text\": \"List the visible defects.\"},`"
          area: l5
      - - text: "6"
        - text: "`{\"type\": \"input_image\", \"image_url\": photo_url}]}])`"
          area: l6
      - - text: "7"
        - text: "`print(response.output_text)`"
          area: l7
answer:
  values:
    p1: l5
    p2: l1
explanation:
  correct:
    en: |
      The question is the text of the `input_text` item on line 5, so that line changes when the instruction changes. The Foundry resource is identified on line 1 by the `base_url` of the client, which is the endpoint of the resource. Line 3 selects the deployment, line 6 provides the photo, and line 7 displays the answer.
    fr: |
      La question est le texte de l'élément `input_text` de la ligne 5 : c'est donc cette ligne qui change quand l'instruction change. La ressource Foundry est identifiée à la ligne 1 par le `base_url` du client, qui est le point de terminaison de la ressource. La ligne 3 sélectionne le déploiement, la ligne 6 fournit la photo et la ligne 7 affiche la réponse.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
