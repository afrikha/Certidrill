id: ai901-2c-imagegen-portal-steps
objective: "2.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Foundry project that contains no model deployment. In the Foundry portal, you need to find a suitable model, deploy it and generate an image from a description.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un projet Foundry qui ne contient aucun déploiement de modèle. Dans le portail Foundry, vous devez trouver un modèle adapté, le déployer et générer une image à partir d'une description.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: upload
      text:
        en: "In the chat pane, select **Upload image** and add a photo."
        fr: "Dans le volet de conversation, sélectionner **Upload image** et ajouter une photo."
    - id: describe
      text:
        en: "In the image playground, enter a description of the image."
        fr: "Dans le terrain de jeu d'images, saisir une description de l'image."
    - id: filter
      text:
        en: "In the model catalog, filter the inference tasks on **Text to image**."
        fr: "Dans le catalogue de modèles, filtrer les tâches d'inférence sur **Text to image**."
    - id: embed
      text:
        en: "Deploy an embedding model, such as text-embedding-3-small."
        fr: "Déployer un modèle d'embedding, comme text-embedding-3-small."
    - id: deploy
      text:
        en: "Deploy one of the listed models, such as gpt-image-1-mini."
        fr: "Déployer l'un des modèles listés, comme gpt-image-1-mini."
    - id: duration
      text:
        en: "In the video playground, set the duration of the output."
        fr: "Dans le terrain de jeu vidéo, régler la durée de la sortie."
answer:
  sequence: [filter, deploy, describe]
explanation:
  correct:
    en: |
      Filtering the model catalog on the **Text to image** inference task lists the image-generation models. You deploy one of them, and the image playground then lets you describe the image that you want and review the result.
    fr: |
      Filtrer le catalogue de modèles sur la tâche d'inférence **Text to image** liste les modèles de génération d'images. Vous déployez l'un d'eux, puis le terrain de jeu d'images vous permet de décrire l'image voulue et d'examiner le résultat.
  options:
    upload:
      en: "Uploading a photo is how you analyze an existing image with a vision-enabled model; it doesn't generate one."
      fr: "Charger une photo sert à analyser une image existante avec un modèle compatible avec la vision ; cela n'en génère pas."
    embed:
      en: "An embedding model returns vectors and can't generate an image."
      fr: "Un modèle d'embedding renvoie des vecteurs et ne peut pas générer d'image."
    duration:
      en: "A duration is a setting of video generation, which isn't required here."
      fr: "Une durée est un paramètre de la génération de vidéos, qui n'est pas demandée ici."
references:
  - title: "Exercise - Get started with computer vision in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/5-exercise
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
