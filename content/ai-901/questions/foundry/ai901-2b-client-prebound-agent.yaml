id: ai901-2b-client-prebound-agent
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Python client application contains the following code. `project` is an `AIProjectClient` object that is connected to a Foundry project.

    ```python
    openai = project.get_openai_client(agent_name="order-agent")
    conversation = openai.conversations.create()

    response = openai.responses.create(
        conversation=conversation.id,
        input="Where is my order 1042?",
    )
    print(response.output_text)
    ```

    The request contains no `model` argument. How is the request processed?
  fr: |
    Une application cliente Python contient le code suivant. `project` est un objet `AIProjectClient` connecté à un projet Foundry.

    ```python
    openai = project.get_openai_client(agent_name="order-agent")
    conversation = openai.conversations.create()

    response = openai.responses.create(
        conversation=conversation.id,
        input="Where is my order 1042?",
    )
    print(response.output_text)
    ```

    La requête ne contient aucun argument `model`. Comment la requête est-elle traitée ?
body:
  options:
    - { id: a, text: { en: "The client is bound to the agent order-agent, which answers with its own model and instructions.", fr: "Le client est lié à l'agent order-agent, qui répond avec son propre modèle et ses propres instructions." } }
    - { id: b, text: { en: "The request is routed to the first model deployment that was created in the project.", fr: "La requête est acheminée vers le premier déploiement de modèle créé dans le projet." } }
    - { id: c, text: { en: "The conversation object selects a model from the wording of the question.", fr: "L'objet conversation sélectionne un modèle d'après la formulation de la question." } }
    - { id: d, text: { en: "The request is answered by the model that was named when the project client was created.", fr: "La requête est traitée par le modèle nommé à la création du client de projet." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Passing `agent_name` to `get_openai_client` returns an OpenAI-compatible client that is bound to that agent. The requests sent with this client go to the agent, which uses the model, the instructions and the tools saved in it, so the client names no model.
    fr: |
      Passer `agent_name` à `get_openai_client` renvoie un client compatible OpenAI lié à cet agent. Les requêtes envoyées avec ce client vont à l'agent, qui utilise le modèle, les instructions et les outils qui y sont enregistrés : le client ne nomme donc aucun modèle.
  options:
    b:
      en: "A project has no default deployment that receives requests without a model; here the target is the agent."
      fr: "Un projet n'a pas de déploiement par défaut qui recevrait les requêtes sans modèle ; ici, la cible est l'agent."
    c:
      en: "A conversation keeps the turns of a dialogue so that follow-up questions are understood; it doesn't choose a model."
      fr: "Une conversation conserve les tours d'un dialogue pour que les questions de suivi soient comprises ; elle ne choisit pas de modèle."
    d:
      en: "The project client is created with an endpoint and a credential only; no model is named there."
      fr: "Le client de projet est créé avec un point de terminaison et des informations d'identification seulement ; aucun modèle n'y est nommé."
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
