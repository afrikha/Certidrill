id: ai901-2d-doc-dd-claim-schema
objective: "2.4.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware Insurance creates a custom analyzer in Azure Content Understanding in Foundry Tools. The analyzer must meet the following requirements:

    - It processes scanned claim forms (PDF files).
    - `PolicyNumber` is taken exactly as it is printed on the form.
    - `ClaimSummary` is a two-sentence summary that the model writes.

    How should you complete the definition of the analyzer? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware Insurance crée un analyseur personnalisé dans Azure Content Understanding dans Foundry Tools. L'analyseur doit répondre aux exigences suivantes :

    - Il traite des formulaires de déclaration de sinistre numérisés (fichiers PDF).
    - `PolicyNumber` est repris exactement tel qu'il est imprimé sur le formulaire.
    - `ClaimSummary` est un résumé en deux phrases que le modèle rédige.

    Comment devez-vous compléter la définition de l'analyseur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "description": "Claim form analyzer",
      "baseAnalyzerId": "[[base]]",
      "config": {
        "estimateFieldSourceAndConfidence": true
      },
      "fieldSchema": {
        "fields": {
          "PolicyNumber": {
            "type": "string",
            "method": "[[m1]]",
            "description": "Policy number printed at the top of the form"
          },
          "ClaimSummary": {
            "type": "string",
            "method": "[[m2]]",
            "description": "Two-sentence summary of the claim"
          }
        }
      }
    }
  slots:
  - id: base
    options:
    - id: bimg
      text: prebuilt-image
    - id: bdoc
      text: prebuilt-document
    - id: baud
      text: prebuilt-audio
    - id: bvid
      text: prebuilt-video
  - id: m1
    options:
    - id: gen1
      text: generate
    - id: cla1
      text: classify
    - id: ext1
      text: extract
  - id: m2
    options:
    - id: ext2
      text: extract
    - id: gen2
      text: generate
    - id: cla2
      text: classify
answer:
  values:
    base: bdoc
    m1: ext1
    m2: gen2
explanation:
  correct:
    en: 'A custom analyzer inherits from the base analyzer of its type of content: `prebuilt-document` for scanned forms. The `extract` method copies a value as it appears in the document, which fits the policy number. The `generate` method lets the model write a value from the content, which fits a summary.'
    fr: 'Un analyseur personnalisé hérite de l''analyseur de base de son type de contenu : `prebuilt-document` pour des formulaires numérisés. La méthode `extract` copie une valeur telle qu''elle apparaît dans le document, ce qui convient au numéro de police. La méthode `generate` laisse le modèle rédiger une valeur à partir du contenu, ce qui convient à un résumé.'
  options:
    bimg:
      en: '`prebuilt-image` is the base for images whose visual content is analyzed; a scanned form is processed as a document.'
      fr: '`prebuilt-image` est la base pour les images dont le contenu visuel est analysé ; un formulaire numérisé se traite comme un document.'
    gen1:
      en: '`generate` lets the model produce the value; the requirement is the number exactly as printed.'
      fr: '`generate` laisse le modèle produire la valeur ; l''exigence est le numéro exactement tel qu''il est imprimé.'
    ext2:
      en: A summary isn't printed on the form, so there is nothing to copy.
      fr: 'Un résumé n''est pas imprimé sur le formulaire : il n''y a donc rien à copier.'
    cla1:
      en: '`classify` selects a value from a predefined list of categories.'
      fr: '`classify` sélectionne une valeur dans une liste prédéfinie de catégories.'
    cla2:
      en: '`classify` selects a value from a predefined list of categories.'
      fr: '`classify` sélectionne une valeur dans une liste prédéfinie de catégories.'
references:
- title: Create a custom analyzer with Azure Content Understanding in Foundry Tools
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/tutorial/create-custom-analyzer
- title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
