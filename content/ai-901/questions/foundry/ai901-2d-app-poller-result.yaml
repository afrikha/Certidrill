id: ai901-2d-app-poller-result
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python application contains the following code. The `client` object is a valid `ContentUnderstandingClient`.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-invoice",
        inputs=[{"url": file_url}],
    )

    for content in poller.contents:
        print(content.fields)
    ```

    The application raises an error on the `for` line.

    What should you do?
  fr: |
    Une application Python contient le code suivant. L'objet `client` est un `ContentUnderstandingClient` valide.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-invoice",
        inputs=[{"url": file_url}],
    )

    for content in poller.contents:
        print(content.fields)
    ```

    L'application génère une erreur à la ligne `for`.

    Que devez-vous faire ?
body:
  options:
  - id: a
    text:
      en: Call `client.begin_analyze` a second time and loop over the new poller.
      fr: Appeler `client.begin_analyze` une seconde fois et parcourir le nouveau poller.
  - id: b
    text:
      en: Replace `prebuilt-invoice` with `prebuilt-read` in the call.
      fr: Remplacer `prebuilt-invoice` par `prebuilt-read` dans l'appel.
  - id: c
    text:
      en: Call `poller.result()` and loop over the `contents` of its return value.
      fr: Appeler `poller.result()` et parcourir les `contents` de sa valeur de retour.
  - id: d
    text:
      en: Pass the key of the Foundry resource in the `inputs` argument.
      fr: Transmettre la clé de la ressource Foundry dans l'argument `inputs`.
answer:
  optionId: c
explanation:
  correct:
    en: '`begin_analyze` starts an asynchronous analysis and immediately returns a poller, which holds no result. `poller.result()` waits for the end of the analysis and returns the result, whose `contents` hold the Markdown and the fields.'
    fr: '`begin_analyze` démarre une analyse asynchrone et renvoie immédiatement un poller, qui ne contient aucun résultat. `poller.result()` attend la fin de l''analyse et renvoie le résultat, dont les `contents` contiennent le Markdown et les champs.'
  options:
    a:
      en: A second call starts a second analysis and returns another poller, with the same problem.
      fr: Un second appel démarre une seconde analyse et renvoie un autre poller, avec le même problème.
    b:
      en: 'The analyzer isn''t the cause: whatever the analyzer, the poller has no `contents`.'
      fr: 'L''analyseur n''est pas en cause : quel que soit l''analyseur, le poller n''a pas de `contents`.'
    d:
      en: The key belongs to the credential of the client; `inputs` describes the content to analyze.
      fr: La clé relève des informations d'identification du client ; `inputs` décrit le contenu à analyser.
references:
