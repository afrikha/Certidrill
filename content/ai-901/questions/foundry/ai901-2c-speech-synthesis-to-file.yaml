id: ai901-2c-speech-synthesis-to-file
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A backend service uses the Azure Speech SDK to generate spoken versions of news articles. The audio must be saved for later playback and must not be played when it is generated.

    Which audio configuration should you pass to the `SpeechSynthesizer` object?
  fr: |
    Un service back-end utilise le SDK Azure Speech pour générer des versions parlées d'articles d'actualité. L'audio doit être enregistré pour une lecture ultérieure et ne doit pas être lu au moment où il est généré.

    Quelle configuration audio devez-vous transmettre à l'objet `SpeechSynthesizer` ?
body:
  options:
    - id: a
      text: "`speechsdk.audio.AudioOutputConfig(use_default_speaker=True)`"
    - id: b
      text: "`speechsdk.audio.AudioConfig(filename=\"article.wav\")`"
    - id: c
      text: "`speechsdk.audio.AudioConfig(use_default_microphone=True)`"
    - id: d
      text: "`speechsdk.audio.AudioOutputConfig(filename=\"article.wav\")`"
answer:
  optionId: d
explanation:
  correct:
    en: |
      The output of a speech synthesis is described by an `AudioOutputConfig` object. Created with `filename`, it writes the synthesized speech to an audio file instead of playing it, which is what a backend service that prepares audio for later needs.
    fr: |
      La sortie d'une synthèse vocale est décrite par un objet `AudioOutputConfig`. Créé avec `filename`, il écrit la parole synthétisée dans un fichier audio au lieu de la lire, ce dont a besoin un service back-end qui prépare de l'audio pour plus tard.
  options:
    a:
      en: "With `use_default_speaker=True`, the audio is played immediately on the default speaker and isn't saved."
      fr: "Avec `use_default_speaker=True`, l'audio est lu immédiatement sur le haut-parleur par défaut et n'est pas enregistré."
    b:
      en: "`AudioConfig(filename=...)` designates an existing audio file as the input of speech recognition, not an output file."
      fr: "`AudioConfig(filename=...)` désigne un fichier audio existant comme entrée de la reconnaissance vocale, pas un fichier de sortie."
    c:
      en: "`AudioConfig(use_default_microphone=True)` captures speech from a microphone for recognition."
      fr: "`AudioConfig(use_default_microphone=True)` capte la parole depuis un microphone pour la reconnaissance."
references:
  - title: "Speech synthesis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
  - title: "How to synthesize speech from text"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-speech-synthesis
