id: ai901-2a-deploy-custom-settings
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You are about to deploy a model from the model catalog of the Foundry portal.

    You need to give the deployment a name that differs from the model name and to choose its deployment type.

    What should you select on the page of the model?
  fr: |
    Vous êtes sur le point de déployer un modèle à partir du catalogue de modèles du portail Foundry.

    Vous devez donner au déploiement un nom différent de celui du modèle et choisir son type de déploiement.

    Que devez-vous sélectionner dans la page du modèle ?
body:
  options:
    - { id: a, text: { en: "**Deploy** > **Default settings**", fr: "**Deploy** > **Default settings**" } }
    - { id: b, text: { en: "**Deploy** > **Custom settings**", fr: "**Deploy** > **Custom settings**" } }
    - { id: c, text: { en: "**Compare models**", fr: "**Compare models**" } }
    - { id: d, text: { en: "**Save as agent**", fr: "**Save as agent**" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      **Deploy** > **Custom settings** lets you configure the deployment before it is created, including its name and its deployment type. **Deploy** > **Default settings** creates the deployment at once, with the name of the model.
    fr: |
      **Deploy** > **Custom settings** vous permet de configurer le déploiement avant sa création, notamment son nom et son type de déploiement. **Deploy** > **Default settings** crée le déploiement immédiatement, avec le nom du modèle.
  options:
    a:
      en: "With the default settings, the deployment takes the name of the model and you don't choose its settings."
      fr: "Avec les paramètres par défaut, le déploiement prend le nom du modèle et vous n'en choisissez pas les paramètres."
    c:
      en: "**Compare models** is an option of the model playground that runs one prompt against several deployed models."
      fr: "**Compare models** est une option du terrain de jeu de modèles qui exécute une invite sur plusieurs modèles déployés."
    d:
      en: "**Save as agent** turns the configuration tested in the playground into an agent; it doesn't configure a deployment."
      fr: "**Save as agent** transforme en agent la configuration testée dans le terrain de jeu ; l'option ne configure pas un déploiement."
references:
  - title: "Deploy Microsoft Foundry Models in the Foundry portal"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/deploy-foundry-models
