id: ai901-2a-temperature-code
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A chat client generates slogans by calling a deployed model as follows.

    ```text
    response = openai_client.responses.create(
        model="gpt-4.1",
        input="Write a slogan for a bakery.",
        temperature=0.2,
        max_output_tokens=300,
    )
    print(response.output_text)
    ```

    The slogans are almost identical at every run. You need more varied and more creative results.

    What should you change in the code?
  fr: |
    Un client de conversation génère des slogans en appelant un modèle déployé comme suit.

    ```text
    response = openai_client.responses.create(
        model="gpt-4.1",
        input="Write a slogan for a bakery.",
        temperature=0.2,
        max_output_tokens=300,
    )
    print(response.output_text)
    ```

    Les slogans sont presque identiques à chaque exécution. Vous avez besoin de résultats plus variés et plus créatifs.

    Que devez-vous modifier dans le code ?
body:
  options:
    - { id: a, text: { en: "Increase the value of `temperature`.", fr: "Augmenter la valeur de `temperature`." } }
    - { id: b, text: { en: "Decrease the value of `temperature`.", fr: "Diminuer la valeur de `temperature`." } }
    - { id: c, text: { en: "Increase the value of `max_output_tokens`.", fr: "Augmenter la valeur de `max_output_tokens`." } }
    - { id: d, text: { en: "Decrease the value of `max_output_tokens`.", fr: "Diminuer la valeur de `max_output_tokens`." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The temperature controls creativity versus determinism. A low value such as 0.2 produces focused output that changes little between runs, while a higher value produces more random and more varied output, which suits creative text.
    fr: |
      La température arbitre entre créativité et déterminisme. Une valeur basse comme 0.2 produit une sortie ciblée qui change peu d'une exécution à l'autre, tandis qu'une valeur plus élevée produit une sortie plus aléatoire et plus variée, ce qui convient à un texte créatif.
  options:
    b:
      en: "A lower temperature makes the output even more deterministic."
      fr: "Une température plus basse rend la sortie encore plus déterministe."
    c:
      en: "`max_output_tokens` caps the length of the response. A higher cap doesn't make a short slogan more varied."
      fr: "`max_output_tokens` plafonne la longueur de la réponse. Un plafond plus élevé ne rend pas un court slogan plus varié."
    d:
      en: "A lower cap can only shorten the response."
      fr: "Un plafond plus bas ne peut que raccourcir la réponse."
references:
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
