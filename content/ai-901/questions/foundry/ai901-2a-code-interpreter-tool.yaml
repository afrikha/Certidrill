id: ai901-2a-code-interpreter-tool
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You test a deployed chat model in the model playground of the Foundry portal.

    You attach a Python file. You want the model to write and run code in a sandboxed environment to check the calculations that the file contains.

    Which tool should you add in the **Tools** section?
  fr: |
    Vous testez un modèle de conversation déployé dans le terrain de jeu de modèles du portail Foundry.

    Vous joignez un fichier Python. Vous voulez que le modèle écrive et exécute du code dans un environnement isolé pour vérifier les calculs que contient le fichier.

    Quel outil devez-vous ajouter dans la section **Tools** ?
body:
  options:
    - { id: a, text: { en: "Web search", fr: "Web search (recherche web)" } }
    - { id: b, text: { en: "File search", fr: "File search (recherche de fichiers)" } }
    - { id: c, text: { en: "Code interpreter", fr: "Code interpreter (interpréteur de code)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The code interpreter tool lets a supported model write, run and debug code in a sandboxed environment, which suits calculations, data transformations and logic checks. In the model playground, you expand **Tools**, select **Add** and then **Code interpreter**, and attach the code files.
    fr: |
      L'outil Code interpreter permet à un modèle pris en charge d'écrire, d'exécuter et de déboguer du code dans un environnement isolé, ce qui convient aux calculs, aux transformations de données et aux vérifications de logique. Dans le terrain de jeu de modèles, vous développez **Tools**, sélectionnez **Add** puis **Code interpreter**, et joignez les fichiers de code.
  options:
    a:
      en: "Web search lets the model look up current information on the web. It doesn't run code."
      fr: "Web search permet au modèle de rechercher des informations à jour sur le web. Il n'exécute pas de code."
    b:
      en: "File search retrieves content from uploaded files to ground the answers. It doesn't run code."
      fr: "File search récupère du contenu dans des fichiers chargés pour ancrer les réponses. Il n'exécute pas de code."
references:
  - title: "Microsoft Foundry Playgrounds"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
