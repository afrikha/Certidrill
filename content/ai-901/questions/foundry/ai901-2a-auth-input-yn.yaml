id: ai901-2a-auth-input-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You review the following chat client. The code runs without error.

    ```text
    from azure.identity import DefaultAzureCredential
    from azure.ai.projects import AIProjectClient

    project = AIProjectClient(
        endpoint=PROJECT_ENDPOINT,
        credential=DefaultAzureCredential(),
    )
    openai_client = project.get_openai_client()

    response = openai_client.responses.create(
        model="gpt-4.1",
        input="Give one use of generative AI in retail.",
    )
    print(response.output_text)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le client de conversation suivant. Le code s'exécute sans erreur.

    ```text
    from azure.identity import DefaultAzureCredential
    from azure.ai.projects import AIProjectClient

    project = AIProjectClient(
        endpoint=PROJECT_ENDPOINT,
        credential=DefaultAzureCredential(),
    )
    openai_client = project.get_openai_client()

    response = openai_client.responses.create(
        model="gpt-4.1",
        input="Give one use of generative AI in retail.",
    )
    print(response.output_text)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The client authenticates with an API key that is stored in the project.", fr: "Le client s'authentifie avec une clé d'API stockée dans le projet." } }
    - { id: s2, text: { en: "The request contains a user prompt and no system prompt.", fr: "La requête contient une invite utilisateur et aucune invite système." } }
    - { id: s3, text: { en: "The OpenAI-compatible client is obtained from the project client.", fr: "Le client compatible OpenAI est obtenu à partir du client de projet." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      `DefaultAzureCredential` authenticates with Microsoft Entra ID, for example with the identity signed in by `az login`; the code uses no API key. `input` is a single string here, which is sent as the user's prompt, and no message with the `system` role is present. `project.get_openai_client()` returns the OpenAI-compatible client from the `AIProjectClient` object.
    fr: |
      `DefaultAzureCredential` authentifie avec Microsoft Entra ID, par exemple avec l'identité connectée par `az login` ; le code n'utilise aucune clé d'API. `input` est ici une simple chaîne, envoyée comme invite de l'utilisateur, et aucun message de rôle `system` n'est présent. `project.get_openai_client()` renvoie le client compatible OpenAI à partir de l'objet `AIProjectClient`.
