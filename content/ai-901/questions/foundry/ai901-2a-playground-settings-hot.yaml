id: ai901-2a-playground-settings-hot
objective: "2.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You test a deployment in the model playground of the Foundry portal. The current configuration is shown in the following table.

    Answer each prompt by selecting the setting that you should change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous testez un déploiement dans le terrain de jeu de modèles du portail Foundry. La configuration actuelle figure dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "The responses to the same prompt must vary less from one run to the next.", fr: "Les réponses à une même invite doivent moins varier d'une exécution à l'autre." } }
    - { id: p2, text: { en: "The model must answer only questions about cycling and decline all the others.", fr: "Le modèle ne doit répondre qu'aux questions sur le cyclisme et refuser toutes les autres." } }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Current value", fr: "Valeur actuelle" }]
    rows:
      - [{ text: "Instructions", area: ins }, { text: { en: "You are a helpful assistant.", fr: "Vous êtes un assistant utile." } }]
      - [{ text: "Temperature", area: tmp }, { text: "1" }]
      - [{ text: "Max output tokens", area: max }, { text: "800" }]
      - [{ text: "Tools", area: tls }, { text: { en: "None", fr: "Aucun" } }]
answer:
  values: { p1: tmp, p2: ins }
explanation:
  correct:
    en: |
      The temperature controls creativity versus determinism: a lower value gives more focused and repeatable responses. The role and the scope of the model are set by the system prompt, which you write in **Instructions**. Max output tokens only caps the length of a response, and a tool gives the model an action such as web search.
    fr: |
      La température arbitre entre créativité et déterminisme : une valeur plus basse donne des réponses plus ciblées et plus reproductibles. Le rôle et le périmètre du modèle sont fixés par l'invite système, que vous écrivez dans **Instructions**. Le nombre maximal de jetons de sortie ne fait que plafonner la longueur d'une réponse, et un outil donne au modèle une action comme la recherche web.
references:
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: "Microsoft Foundry Playgrounds"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
