id: ai901-2a-sdk-clients-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan a chat client that uses the Foundry SDK.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez un client de conversation qui utilise le SDK Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The Foundry SDK provides a project client for Foundry-native operations.", fr: "Le SDK Foundry fournit un client de projet pour les opérations natives de Foundry." } }
    - { id: s2, text: { en: "The chat client must create an agent in the project before it can send a prompt to a deployed model.", fr: "Le client de conversation doit créer un agent dans le projet avant de pouvoir envoyer une invite à un modèle déployé." } }
    - { id: s3, text: { en: "Most applications that use the Foundry SDK use both the project client and the OpenAI-compatible client.", fr: "La plupart des applications qui utilisent le SDK Foundry se servent à la fois du client de projet et du client compatible OpenAI." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The Foundry SDK exposes a project client for Foundry-native operations and an OpenAI-compatible client that calls models through the Responses API; most applications use both. A chat client needs only a Foundry project and a deployed chat model: it calls the model on its own, as pure inference, without any agent.
    fr: |
      Le SDK Foundry expose un client de projet pour les opérations natives de Foundry et un client compatible OpenAI qui appelle les modèles via l'API Responses ; la plupart des applications utilisent les deux. Un client de conversation n'a besoin que d'un projet Foundry et d'un modèle de conversation déployé : il appelle le modèle seul, en pure inférence, sans aucun agent.
references:
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: "Microsoft Foundry SDKs and endpoints"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview
