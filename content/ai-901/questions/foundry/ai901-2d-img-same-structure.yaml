id: ai901-2d-img-same-structure
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Every night, Woodgrove Insurance processes 20,000 photos of damaged vehicles. For each photo, the same five named values must be stored in a database.

    Why is an analyzer of Azure Content Understanding in Foundry Tools suited to this workload?
  fr: |
    Chaque nuit, Woodgrove Insurance traite 20 000 photos de véhicules endommagés. Pour chaque photo, les cinq mêmes valeurs nommées doivent être stockées dans une base de données.

    Pourquoi un analyseur d'Azure Content Understanding dans Foundry Tools convient-il à cette charge de travail ?
body:
  options:
  - id: a
    text:
      en: It applies the same schema to every photo and returns the same JSON structure.
      fr: Il applique le même schéma à chaque photo et renvoie la même structure JSON.
  - id: b
    text:
      en: It repairs the damaged areas of each photo before the photo is stored.
      fr: Il répare les zones endommagées de chaque photo avant son stockage.
  - id: c
    text:
      en: It trains a new vision model on the photos of each night.
      fr: Il entraîne chaque nuit un nouveau modèle de vision sur les photos.
  - id: d
    text:
      en: It converts each photo into a transcript in the WebVTT format.
      fr: Il convertit chaque photo en transcription au format WebVTT.
answer:
  optionId: a
explanation:
  correct:
    en: An analyzer applies its schema consistently to all the content that it receives. Every photo therefore produces the same named fields in the same JSON structure, which a database or another system can consume directly.
    fr: Un analyseur applique son schéma de façon cohérente à tout le contenu qu'il reçoit. Chaque photo produit donc les mêmes champs nommés dans la même structure JSON, qu'une base de données ou un autre système peut exploiter directement.
  options:
    b:
      en: An analyzer extracts information; it doesn't modify the images that it receives.
      fr: Un analyseur extrait des informations ; il ne modifie pas les images qu'il reçoit.
    c:
      en: 'No model is trained during an analysis: the analyzer uses a deployed generative model as it is.'
      fr: 'Aucun modèle n''est entraîné pendant une analyse : l''analyseur utilise tel quel un modèle génératif déployé.'
    d:
      en: WebVTT is the format of the transcripts of audio and video, not a result of image analysis.
      fr: WebVTT est le format des transcriptions de l'audio et de la vidéo, pas un résultat de l'analyse d'images.
references:
- title: What is Azure Content Understanding in Foundry Tools?
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
