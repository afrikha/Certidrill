id: ai901-2a-sdk-packages
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You write a Python chat client that creates an `AIProjectClient` object and authenticates with `DefaultAzureCredential`.

    Which two packages provide these classes? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un client de conversation Python qui crée un objet `AIProjectClient` et s'authentifie avec `DefaultAzureCredential`.

    Quels sont les deux packages qui fournissent ces classes ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "azure-ai-textanalytics" }
    - { id: b, text: "azure-identity" }
    - { id: c, text: "azure-storage-blob" }
    - { id: d, text: "azure-cognitiveservices-speech" }
    - { id: e, text: "azure-ai-projects" }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      `AIProjectClient` is the project client of the Foundry SDK, in the `azure-ai-projects` package. `DefaultAzureCredential`, which authenticates with Microsoft Entra ID, comes from the `azure-identity` package.
    fr: |
      `AIProjectClient` est le client de projet du SDK Foundry, dans le package `azure-ai-projects`. `DefaultAzureCredential`, qui authentifie avec Microsoft Entra ID, provient du package `azure-identity`.
  options:
    a:
      en: "`azure-ai-textanalytics` is the client library for text analysis with Azure Language."
      fr: "`azure-ai-textanalytics` est la bibliothèque cliente d'analyse de texte d'Azure Language."
    c:
      en: "`azure-storage-blob` is the client library for Azure Blob Storage."
      fr: "`azure-storage-blob` est la bibliothèque cliente de Stockage Blob Azure."
    d:
      en: "`azure-cognitiveservices-speech` is the Speech SDK."
      fr: "`azure-cognitiveservices-speech` est le SDK Speech."
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: "Microsoft Foundry SDKs and endpoints"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview
