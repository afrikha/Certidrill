id: ai901-2b-agent-yn-save-flow
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You deploy a model in the Foundry portal and open it in the model playground. You plan to turn it into an agent.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez un modèle dans le portail Foundry et vous l'ouvrez dans le terrain de jeu de modèles. Vous prévoyez d'en faire un agent.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Saving the configuration as an agent creates a separate model deployment for each tool.
        fr: L'enregistrement de la configuration en tant qu'agent crée un déploiement de modèle distinct pour chaque outil.
    - id: s2
      text:
        en: You can write the instructions and add tools in the model playground before you save the configuration as an agent.
        fr: Vous pouvez écrire les instructions et ajouter des outils dans le terrain de jeu de modèles avant d'enregistrer la configuration en tant qu'agent.
    - id: s3
      text:
        en: After you save the configuration as an agent, you can continue to test and refine the agent in the playground.
        fr: Après avoir enregistré la configuration en tant qu'agent, vous pouvez continuer à tester et à affiner l'agent dans le terrain de jeu.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The model playground lets you set a system prompt and enable tools such as web search, file search and code interpreter. Saving as an agent packages the existing model, the instructions and the tools under one name; it doesn't deploy anything else. The agent then stays available in the playground for further tests and changes.
    fr: |
      Le terrain de jeu de modèles permet de définir une invite système et d'activer des outils comme la recherche web, la recherche de fichiers et l'interpréteur de code. L'enregistrement en tant qu'agent regroupe le modèle existant, les instructions et les outils sous un même nom ; il ne déploie rien d'autre. L'agent reste ensuite disponible dans le terrain de jeu pour d'autres tests et modifications.
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
