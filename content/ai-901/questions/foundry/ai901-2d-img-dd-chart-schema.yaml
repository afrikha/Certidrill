id: ai901-2d-img-dd-chart-schema
objective: "2.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You define a custom analyzer in Azure Content Understanding in Foundry Tools that processes images of charts. The schema must meet the following requirements:

    - `ChartType` returns one of three predefined values.
    - `Trend` returns one sentence that the model writes to describe the overall trend.

    How should you complete the definition of the analyzer? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez dans Azure Content Understanding dans Foundry Tools un analyseur personnalisé qui traite des images de graphiques. Le schéma doit répondre aux exigences suivantes :

    - `ChartType` renvoie l'une de trois valeurs prédéfinies.
    - `Trend` renvoie une phrase que le modèle rédige pour décrire la tendance générale.

    Comment devez-vous compléter la définition de l'analyseur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "baseAnalyzerId": "prebuilt-image",
      "fieldSchema": {
        "fields": {
          "ChartType": {
            "type": "string",
            "method": "[[m1]]",
            "description": "Type of the chart",
            "enum": ["bar", "line", "pie"]
          },
          "Trend": {
            "type": "[[t]]",
            "method": "[[m2]]",
            "description": "One sentence that describes the overall trend of the chart"
          }
        }
      }
    }
  slots:
  - id: m1
    options:
    - id: ext1
      text: extract
    - id: cla1
      text: classify
    - id: gen1
      text: generate
  - id: t
    options:
    - id: tnum
      text: number
    - id: tbool
      text: boolean
    - id: tstr
      text: string
  - id: m2
    options:
    - id: gen2
      text: generate
    - id: cla2
      text: classify
    - id: ext2
      text: extract
answer:
  values:
    m1: cla1
    t: tstr
    m2: gen2
explanation:
  correct:
    en: 'The `classify` method selects a value from a predefined set, listed in `enum`: it fits the chart type. A sentence is a `string`, and the `generate` method lets the model write it from the image.'
    fr: 'La méthode `classify` sélectionne une valeur dans un ensemble prédéfini, répertorié dans `enum` : elle convient au type de graphique. Une phrase est de type `string`, et la méthode `generate` laisse le modèle la rédiger à partir de l''image.'
  options:
    ext1:
      en: '`extract` is supported for documents only.'
      fr: '`extract` est pris en charge uniquement pour les documents.'
    ext2:
      en: '`extract` is supported for documents only.'
      fr: '`extract` est pris en charge uniquement pour les documents.'
    gen1:
      en: '`generate` returns free text, without the guarantee of one of the three listed values.'
      fr: '`generate` renvoie du texte libre, sans garantie d''obtenir l''une des trois valeurs répertoriées.'
    cla2:
      en: '`classify` selects from a fixed list; a sentence describing a trend is free text.'
      fr: '`classify` sélectionne dans une liste fixe ; une phrase décrivant une tendance est du texte libre.'
references:
- title: Create a custom analyzer with Azure Content Understanding in Foundry Tools
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/tutorial/create-custom-analyzer
- title: Best practices for using Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
