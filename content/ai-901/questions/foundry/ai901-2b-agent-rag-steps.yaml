id: ai901-2b-agent-rag-steps
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You upload a set of policy documents as knowledge for an agent in the Foundry portal.

    Which two operations does Foundry perform so that the agent can use the documents in its answers? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous chargez un ensemble de documents de stratégie en tant que connaissances pour un agent dans le portail Foundry.

    Quelles sont les deux opérations que Foundry effectue pour que l'agent puisse utiliser les documents dans ses réponses ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It ingests and indexes the content of the documents.", fr: "Il ingère et indexe le contenu des documents." } }
    - { id: b, text: { en: "It fine-tunes the model on the content of the documents.", fr: "Il effectue un réglage fin (fine-tuning) du modèle sur le contenu des documents." } }
    - { id: c, text: { en: "It copies the full text of the documents into the instructions.", fr: "Il copie le texte intégral des documents dans les instructions." } }
    - { id: d, text: { en: "It searches the index and grounds the response in the retrieved content.", fr: "Il effectue une recherche dans l'index et ancre la réponse dans le contenu récupéré." } }
    - { id: e, text: { en: "It publishes the documents so that the Web search tool can find them.", fr: "Il publie les documents pour que l'outil Web search puisse les trouver." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Knowledge works by retrieval-augmented generation (RAG). Foundry first ingests and indexes the content; then, for each question, it searches the index and grounds the model's response in the passages it retrieved, with a citation.
    fr: |
      Les connaissances fonctionnent par génération augmentée par récupération (RAG). Foundry commence par ingérer et indexer le contenu ; puis, à chaque question, il effectue une recherche dans l'index et ancre la réponse du modèle dans les passages récupérés, avec une citation.
  options:
    b:
      en: "The model isn't retrained: its weights don't change. The documents are retrieved at the time of the question."
      fr: "Le modèle n'est pas réentraîné : ses poids ne changent pas. Les documents sont récupérés au moment de la question."
    c:
      en: "The instructions stay as you wrote them; only the relevant passages are retrieved for each question."
      fr: "Les instructions restent telles que vous les avez écrites ; seuls les passages pertinents sont récupérés à chaque question."
    e:
      en: "The documents stay private in the project. Web search covers public web content and has no part in this."
      fr: "Les documents restent privés dans le projet. Web search couvre le contenu web public et n'intervient pas ici."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: File search tool for Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/file-search
