id: ai901-2b-audio-multimodal-meaning
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deploy `gpt-audio-mini` in Microsoft Foundry so that an application can answer questions that users ask aloud. The model is described as multimodal.

    What does *multimodal* mean for this model?
  fr: |
    Vous déployez `gpt-audio-mini` dans Microsoft Foundry pour qu'une application puisse répondre à des questions que les utilisateurs posent à voix haute. Le modèle est décrit comme multimodal.

    Que signifie *multimodal* pour ce modèle ?
body:
  options:
    - { id: a, text: { en: "It is deployed in more than one Azure region.", fr: "Il est déployé dans plusieurs régions Azure." } }
    - { id: b, text: { en: "It handles more than one type of content, here text and audio.", fr: "Il traite plusieurs types de contenu, ici le texte et l'audio." } }
    - { id: c, text: { en: "It combines several agents that share a conversation.", fr: "Il combine plusieurs agents qui partagent une conversation." } }
    - { id: d, text: { en: "It is called by several applications at the same time.", fr: "Il est appelé par plusieurs applications en même temps." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A modality is a type of content. `gpt-audio` and `gpt-audio-mini` support the text and audio modalities: a prompt can contain text, audio or both, and the answer can be text or text with audio. This is what lets the model respond to a spoken prompt.
    fr: |
      Une modalité est un type de contenu. `gpt-audio` et `gpt-audio-mini` prennent en charge les modalités texte et audio : une invite peut contenir du texte, de l'audio ou les deux, et la réponse peut être du texte ou du texte accompagné d'audio. C'est ce qui permet au modèle de répondre à une invite vocale.
  options:
    a:
      en: "The regions of a deployment concern availability, not the kinds of content that the model handles."
      fr: "Les régions d'un déploiement concernent la disponibilité, pas les types de contenu que le modèle traite."
    c:
      en: "Several agents working together form a multi-agent solution, which is unrelated to modalities."
      fr: "Plusieurs agents qui travaillent ensemble forment une solution multi-agent, sans rapport avec les modalités."
    d:
      en: "Any deployment can serve several applications; that doesn't make a model multimodal."
      fr: "Tout déploiement peut servir plusieurs applications ; cela ne rend pas un modèle multimodal."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
