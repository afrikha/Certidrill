id: ai901-2a-few-shot-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You add pairs of sample questions and answers to the prompts that you send to a chat model.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez des paires de questions et de réponses d'exemple aux invites que vous envoyez à un modèle de conversation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The examples change the model permanently, so later conversations get the same effect without them.", fr: "Les exemples modifient le modèle de façon permanente : les conversations suivantes obtiennent le même effet sans eux." } }
    - { id: s2, text: { en: "A prompt that contains no examples is called a zero-shot prompt.", fr: "Une invite qui ne contient aucun exemple est appelée invite zero-shot." } }
    - { id: s3, text: { en: "The examples can be supplied as pairs of user and assistant messages placed after the system message.", fr: "Les exemples peuvent être fournis sous forme de paires de messages utilisateur et assistant placées après le message système." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Examples condition the model only for the current inference; the model itself is not changed, so each new request must include them again. A prompt without examples is a zero-shot prompt, while one or a few examples make it one-shot or few-shot. In a chat conversation, the examples are added as user and assistant messages after the system message.
    fr: |
      Les exemples ne conditionnent le modèle que pour l'inférence en cours ; le modèle lui-même n'est pas modifié, et chaque nouvelle requête doit donc les inclure à nouveau. Une invite sans exemple est une invite zero-shot, tandis qu'un ou quelques exemples en font une invite one-shot ou few-shot. Dans une conversation, les exemples sont ajoutés sous forme de messages utilisateur et assistant après le message système.
references:
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
