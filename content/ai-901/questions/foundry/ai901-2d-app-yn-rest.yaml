id: ai901-2d-app-yn-rest
objective: "2.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A JavaScript application calls the REST API of Azure Content Understanding in Foundry Tools directly, without an SDK. It sends a POST request to analyze an invoice and receives the response `202 Accepted`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application JavaScript appelle directement l'API REST d'Azure Content Understanding dans Foundry Tools, sans SDK. Elle envoie une requête POST pour analyser une facture et reçoit la réponse `202 Accepted`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: The body of the `202 Accepted` response contains the extracted fields.
      fr: Le corps de la réponse `202 Accepted` contient les champs extraits.
  - id: s2
    text:
      en: The `Operation-Location` header of the response contains the URL to query for the result.
      fr: L'en-tête `Operation-Location` de la réponse contient l'URL à interroger pour obtenir le résultat.
  - id: s3
    text:
      en: The application should query that URL again while the status is `Running`.
      fr: L'application doit interroger de nouveau cette URL tant que l'état est `Running`.
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: 'The analysis is asynchronous: `202 Accepted` only means that the request was accepted. Without an SDK, the application sends GET requests to the URL of the `Operation-Location` header and repeats them until the status is `Succeeded`; the fields are in that final response.'
    fr: 'L''analyse est asynchrone : `202 Accepted` signifie seulement que la requête a été acceptée. Sans SDK, l''application envoie des requêtes GET à l''URL de l''en-tête `Operation-Location` et les répète jusqu''à ce que l''état soit `Succeeded` ; les champs se trouvent dans cette réponse finale.'
references:
- title: 'Quickstart: Azure Content Understanding in Foundry Tools'
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
