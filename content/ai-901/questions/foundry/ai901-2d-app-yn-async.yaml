id: ai901-2d-app-yn-async
objective: "2.4.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A Python application analyzes documents by using the SDK of Azure Content Understanding in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python analyse des documents à l'aide du SDK d'Azure Content Understanding dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: 'The analysis is asynchronous: the result becomes available after the service has finished its work.'
      fr: 'L''analyse est asynchrone : le résultat devient disponible une fois que le service a terminé son travail.'
  - id: s2
    text:
      en: The `begin_analyze` method waits for the end of the analysis and returns the extracted fields directly.
      fr: La méthode `begin_analyze` attend la fin de l'analyse et renvoie directement les champs extraits.
  - id: s3
    text:
      en: When the application calls `poller.result()`, the SDK polls the service until the analysis is finished.
      fr: Lorsque l'application appelle `poller.result()`, le SDK interroge le service jusqu'à la fin de l'analyse.
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: Analysis is a long-running operation. `begin_analyze` returns a poller immediately; `poller.result()` hides the polling and returns the result once the analysis is complete.
    fr: L'analyse est une opération de longue durée. `begin_analyze` renvoie immédiatement un poller ; `poller.result()` masque l'interrogation répétée du service et renvoie le résultat une fois l'analyse terminée.
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
