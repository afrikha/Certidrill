id: ai901-2c-speech-once-vs-continuous
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You are testing an application that transcribes dictation from a microphone by using the Azure Speech SDK. The application calls `recognize_once_async()`.

    When a user dictates for two minutes, only the first sentence is transcribed. The application must transcribe everything that the user says until the user selects **Stop**.

    What should you do?
  fr: |
    Vous testez une application qui transcrit une dictée captée par un microphone à l'aide du SDK Azure Speech. L'application appelle `recognize_once_async()`.

    Quand un utilisateur dicte pendant deux minutes, seule la première phrase est transcrite. L'application doit transcrire tout ce que dit l'utilisateur jusqu'à ce qu'il sélectionne **Stop**.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Replace the `AudioConfig` object with an `AudioOutputConfig` object that uses the default speaker."
        fr: "Remplacer l'objet `AudioConfig` par un objet `AudioOutputConfig` qui utilise le haut-parleur par défaut."
    - id: b
      text:
        en: "Call `start_continuous_recognition()`, then `stop_continuous_recognition()` when the user selects Stop."
        fr: "Appeler `start_continuous_recognition()`, puis `stop_continuous_recognition()` quand l'utilisateur sélectionne Stop."
    - id: c
      text:
        en: "Set the `speech_synthesis_voice_name` property of the `SpeechConfig` object before the recognition starts."
        fr: "Définir la propriété `speech_synthesis_voice_name` de l'objet `SpeechConfig` avant le début de la reconnaissance."
    - id: d
      text:
        en: "Replace the call with a batch transcription job that reads the dictation from a SAS URI."
        fr: "Remplacer l'appel par un travail de transcription par lots qui lit la dictée à partir d'un URI SAS."
answer:
  optionId: b
explanation:
  correct:
    en: |
      `recognize_once_async()` performs a single-shot recognition: it returns one utterance, which ends at the first silence or after at most 15 seconds of audio. To keep transcribing until the application decides to stop, start a continuous recognition, handle the `recognized` event, and call `stop_continuous_recognition()` when the user selects Stop.
    fr: |
      `recognize_once_async()` effectue une reconnaissance unique : elle renvoie un seul énoncé, qui se termine au premier silence ou après 15 secondes d'audio au plus. Pour continuer à transcrire jusqu'à ce que l'application décide d'arrêter, démarrez une reconnaissance continue, gérez l'événement `recognized`, puis appelez `stop_continuous_recognition()` quand l'utilisateur sélectionne Stop.
  options:
    a:
      en: "`AudioOutputConfig` describes where synthesized speech is played; the microphone input is already correct."
      fr: "`AudioOutputConfig` décrit où la parole synthétisée est lue ; l'entrée microphone est déjà correcte."
    c:
      en: "A voice name only affects speech synthesis; it doesn't change how long the recognition lasts."
      fr: "Un nom de voix n'agit que sur la synthèse vocale ; il ne change pas la durée de la reconnaissance."
    d:
      en: "Batch transcription processes stored audio files asynchronously; it doesn't transcribe live speech from a microphone."
      fr: "La transcription par lots traite des fichiers audio stockés de façon asynchrone ; elle ne transcrit pas la parole en direct d'un microphone."
references:
  - title: "How to recognize speech"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-recognize-speech
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
