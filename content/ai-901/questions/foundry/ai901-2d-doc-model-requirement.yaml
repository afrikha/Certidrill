id: ai901-2d-doc-model-requirement
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You test Azure Content Understanding in the Foundry portal. The **OCR/Read** and **Layout** analyzers run on your sample documents. When you select the **Receipt** analyzer, the portal prompts you to deploy models.

    Why does the Receipt analyzer need a model deployment?
  fr: |
    Vous testez Azure Content Understanding dans le portail Foundry. Les analyseurs **OCR/Read** et **Layout** s'exécutent sur vos exemples de documents. Lorsque vous sélectionnez l'analyseur **Receipt**, le portail vous invite à déployer des modèles.

    Pourquoi l'analyseur Receipt a-t-il besoin d'un déploiement de modèle ?
body:
  options:
  - id: a
    text:
      en: Receipts are images, and image files must first be converted by an image-generation model.
      fr: Les reçus sont des images, et les fichiers image doivent d'abord être convertis par un modèle de génération d'images.
  - id: b
    text:
      en: Field extraction relies on a generative model that is deployed in the Foundry resource.
      fr: L'extraction de champs s'appuie sur un modèle génératif déployé dans la ressource Foundry.
  - id: c
    text:
      en: Each prebuilt analyzer must be trained on your own documents before its first run.
      fr: Chaque analyseur prédéfini doit être entraîné sur vos propres documents avant sa première exécution.
  - id: d
    text:
      en: The Receipt analyzer transcribes speech, which requires a deployed speech model.
      fr: L'analyseur Receipt transcrit la parole, ce qui exige un modèle vocal déployé.
answer:
  optionId: b
explanation:
  correct:
    en: The read and layout analyzers perform content extraction only (text and structure) and don't require a language model. An analyzer that maps values to fields, such as the receipt analyzer, uses a generative model that you deploy in your Foundry resource.
    fr: Les analyseurs read et layout effectuent uniquement l'extraction de contenu (texte et structure) et n'ont pas besoin de modèle de langage. Un analyseur qui associe des valeurs à des champs, comme l'analyseur de reçus, utilise un modèle génératif que vous déployez dans votre ressource Foundry.
  options:
    a:
      en: An image-generation model creates images; it plays no role in reading a receipt.
      fr: Un modèle de génération d'images crée des images ; il ne joue aucun rôle dans la lecture d'un reçu.
    c:
      en: Prebuilt analyzers are ready to use; they need no training on your documents.
      fr: Les analyseurs prédéfinis sont prêts à l'emploi ; ils n'exigent aucun entraînement sur vos documents.
    d:
      en: 'A receipt is a document: no speech is transcribed.'
      fr: 'Un reçu est un document : aucune parole n''est transcrite.'
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
- title: Model deployment options for Content Understanding analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/models-deployments
