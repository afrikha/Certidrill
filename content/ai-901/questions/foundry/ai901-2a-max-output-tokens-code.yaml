id: ai901-2a-max-output-tokens-code
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A chat client contains the following code.

    ```text
    response = client.responses.create(
        model="chat-prod",
        input=[
            {"role": "system", "content": "You are a helpful assistant."},
            {"role": "user", "content": question},
        ],
        max_output_tokens=50,
        temperature=0.7,
    )
    print(response.output_text)
    ```

    The answers to complex questions stop in the middle of a sentence.

    Which argument should you change?
  fr: |
    Un client de conversation contient le code suivant.

    ```text
    response = client.responses.create(
        model="chat-prod",
        input=[
            {"role": "system", "content": "You are a helpful assistant."},
            {"role": "user", "content": question},
        ],
        max_output_tokens=50,
        temperature=0.7,
    )
    print(response.output_text)
    ```

    Les réponses aux questions complexes s'arrêtent au milieu d'une phrase.

    Quel argument devez-vous modifier ?
body:
  options:
    - { id: a, text: "model" }
    - { id: b, text: "input" }
    - { id: c, text: "max_output_tokens" }
    - { id: d, text: "temperature" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `max_output_tokens` caps the length of the response. With a cap of 50 tokens, a long answer is cut off when the cap is reached; a higher value lets the model finish.
    fr: |
      `max_output_tokens` plafonne la longueur de la réponse. Avec un plafond de 50 jetons, une réponse longue est coupée dès qu'il est atteint ; une valeur plus élevée laisse le modèle terminer.
  options:
    a:
      en: "`model` names the deployment that answers. It doesn't limit the length of the output."
      fr: "`model` nomme le déploiement qui répond. Il ne limite pas la longueur de la sortie."
    b:
      en: "`input` carries the system and user messages. The truncation comes from the output limit."
      fr: "`input` transporte les messages système et utilisateur. La troncature vient de la limite de sortie."
    d:
      en: "`temperature` changes how random the wording is, not where the response stops."
      fr: "`temperature` modifie le caractère aléatoire de la formulation, pas l'endroit où la réponse s'arrête."
references:
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
