id: ai901-2b-audio-dnd-models
objective: "2.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans three features that use models deployed in Microsoft Foundry.

    Which model should you deploy for each feature? To answer, drag the appropriate models to the correct features. Each model may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit trois fonctionnalités qui utilisent des modèles déployés dans Microsoft Foundry.

    Quel modèle devez-vous déployer pour chaque fonctionnalité ? Pour répondre, faites glisser les modèles appropriés vers les fonctionnalités correspondantes. Chaque modèle peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: audio, text: "`gpt-audio-mini`" }
    - { id: stt, text: "`gpt-4o-mini-transcribe`" }
    - { id: tts, text: "`gpt-4o-mini-tts`" }
    - { id: image, text: "`gpt-image-1`" }
  targets:
    - id: t1
      text: { en: "Understand a question that a user asks aloud and reply to it with a spoken answer, in one request", fr: "Comprendre une question qu'un utilisateur pose à voix haute et y répondre par une réponse parlée, en une seule requête" }
    - id: t2
      text: { en: "Produce only the written transcript of a recorded meeting", fr: "Produire uniquement la transcription écrite d'une réunion enregistrée" }
    - id: t3
      text: { en: "Read a written notification aloud", fr: "Lire à voix haute une notification écrite" }
answer:
  mapping: { t1: audio, t2: stt, t3: tts }
explanation:
  correct:
    en: |
      `gpt-audio-mini` is an audio-enabled chat model: it takes a spoken prompt, reasons about it and generates text and audio. `gpt-4o-mini-transcribe` is a speech-to-text model that returns the transcript of an audio file. `gpt-4o-mini-tts` is a text-to-speech model that vocalizes a text. `gpt-image-1` generates images and has no role here.
    fr: |
      `gpt-audio-mini` est un modèle de conversation compatible avec l'audio : il prend une invite vocale, raisonne dessus et génère du texte et de l'audio. `gpt-4o-mini-transcribe` est un modèle de reconnaissance vocale qui renvoie la transcription d'un fichier audio. `gpt-4o-mini-tts` est un modèle de synthèse vocale qui vocalise un texte. `gpt-image-1` génère des images et n'a aucun rôle ici.
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
