id: ai901-2c-visionapp-key-environment
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are writing a Python application that calls a vision-enabled model deployed in a Foundry resource. The application authenticates with the key of the resource. The key must not appear in the source code.

    Where should the application get the key at run time?
  fr: |
    Vous écrivez une application Python qui appelle un modèle compatible avec la vision déployé dans une ressource Foundry. L'application s'authentifie avec la clé de la ressource. La clé ne doit pas figurer dans le code source.

    Où l'application doit-elle obtenir la clé à l'exécution ?
body:
  options:
    - id: a
      text:
        en: "From an environment variable, read with `os.getenv()`"
        fr: "Dans une variable d'environnement, lue avec `os.getenv()`"
    - id: b
      text:
        en: "From the text of the prompt that is sent to the model"
        fr: "Dans le texte de l'invite envoyée au modèle"
    - id: c
      text:
        en: "From the name of the model deployment"
        fr: "Dans le nom du déploiement du modèle"
    - id: d
      text:
        en: "From the `output_text` property of the response"
        fr: "Dans la propriété `output_text` de la réponse"
answer:
  optionId: a
explanation:
  correct:
    en: |
      The key, the endpoint and the deployment name are configuration values. Storing them in environment variables, set locally or in the service that hosts the application, and reading them with `os.getenv()` keeps the key out of the source code.
    fr: |
      La clé, le point de terminaison et le nom du déploiement sont des valeurs de configuration. Les stocker dans des variables d'environnement, définies localement ou dans le service qui héberge l'application, et les lire avec `os.getenv()` maintient la clé hors du code source.
  options:
    b:
      en: "The prompt is content sent to the model; putting a key in it would expose the key and wouldn't authenticate the request."
      fr: "L'invite est un contenu envoyé au modèle ; y placer une clé l'exposerait et n'authentifierait pas la requête."
    c:
      en: "A deployment name identifies a deployed model; it isn't a place to store a secret."
      fr: "Un nom de déploiement identifie un modèle déployé ; ce n'est pas un emplacement où stocker un secret."
    d:
      en: "`output_text` is returned by the model after an authenticated request; it can't supply the key."
      fr: "`output_text` est renvoyé par le modèle après une requête authentifiée ; il ne peut pas fournir la clé."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
