id: ai901-2b-audio-multi-turn-id
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application sent a recorded question to a deployed `gpt-audio-mini` model through the Chat Completions API and received a spoken answer in `completion`. The user now types a follow-up question.

    The follow-up request must include the previous spoken answer in the history of the conversation.

    What should the application add to the `messages` list before the new user message?
  fr: |
    Une application a envoyé une question enregistrée à un modèle `gpt-audio-mini` déployé par l'intermédiaire de l'API Chat Completions et a reçu une réponse parlée dans `completion`. L'utilisateur saisit maintenant une question de suivi.

    La requête de suivi doit inclure la réponse parlée précédente dans l'historique de la conversation.

    Que doit ajouter l'application à la liste `messages` avant le nouveau message utilisateur ?
body:
  options:
    - { id: a, text: { en: "A system message that contains the file name of the previous audio answer", fr: "Un message système qui contient le nom du fichier de la réponse audio précédente" } }
    - { id: b, text: { en: "A user message that contains the previous audio answer as an `input_audio` part", fr: "Un message utilisateur qui contient la réponse audio précédente sous la forme d'une partie `input_audio`" } }
    - { id: c, text: { en: "A user message that contains the voice and the format of the previous audio answer", fr: "Un message utilisateur qui contient la voix et le format de la réponse audio précédente" } }
    - { id: d, text: { en: "An assistant message that references the previous audio answer by its ID", fr: "Un message assistant qui référence la réponse audio précédente par son ID" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The history of a chat alternates user and assistant messages. For an answer that was given as audio, the application appends an assistant message of the form `{"role": "assistant", "audio": {"id": ...}}`, with the ID read from `completion.choices[0].message.audio.id`, and then the new user message.
    fr: |
      L'historique d'une conversation alterne des messages utilisateur et assistant. Pour une réponse donnée en audio, l'application ajoute un message assistant de la forme `{"role": "assistant", "audio": {"id": ...}}`, avec l'ID lu dans `completion.choices[0].message.audio.id`, puis le nouveau message utilisateur.
  options:
    a:
      en: "A system message sets the behavior of the model; a local file name means nothing to the service."
      fr: "Un message système fixe le comportement du modèle ; un nom de fichier local ne signifie rien pour le service."
    b:
      en: "`input_audio` in a user message is audio spoken by the user. The previous answer came from the model, so it belongs in an assistant message."
      fr: "`input_audio` dans un message utilisateur est de l'audio prononcé par l'utilisateur. La réponse précédente venait du modèle : elle a donc sa place dans un message assistant."
    c:
      en: "The voice and the format are settings of the request (`audio`), not content of the conversation."
      fr: "La voix et le format sont des paramètres de la requête (`audio`), pas du contenu de la conversation."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
