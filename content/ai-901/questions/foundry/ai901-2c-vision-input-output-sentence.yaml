id: ai901-2c-vision-input-output-sentence
objective: "2.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A vision-enabled multimodal model accepts [[in]] in the same prompt and returns [[out]].
    fr: |
      Un modèle multimodal compatible avec la vision accepte [[in]] dans la même invite et renvoie [[out]].
  slots:
    - id: in
      options:
        - id: text
          text:
            en: "text only"
            fr: "uniquement du texte"
        - id: both
          text:
            en: "text and images"
            fr: "du texte et des images"
        - id: audio
          text:
            en: "audio only"
            fr: "uniquement de l'audio"
    - id: out
      options:
        - id: image
          text:
            en: "a newly generated image"
            fr: "une image nouvellement générée"
        - id: vector
          text:
            en: "a list of numeric vectors"
            fr: "une liste de vecteurs numériques"
        - id: answer
          text:
            en: "an answer in natural language"
            fr: "une réponse en langage naturel"
answer:
  values:
    in: both
    out: answer
explanation:
  correct:
    en: |
      Vision-enabled models take a text instruction and one or more images in a single prompt, and they respond with text: a description, an answer or an explanation. Creating images is the role of image-generation models, and vectors are returned by embedding models.
    fr: |
      Les modèles compatibles avec la vision reçoivent une instruction en texte et une ou plusieurs images dans une seule invite, et ils répondent par du texte : une description, une réponse ou une explication. Créer des images est le rôle des modèles de génération d'images, et les vecteurs sont renvoyés par les modèles d'embedding.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
