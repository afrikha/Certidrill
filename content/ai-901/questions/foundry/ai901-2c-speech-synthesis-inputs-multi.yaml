id: ai901-2c-speech-synthesis-inputs-multi
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are designing a feature that uses the text to speech capability of Azure Speech.

    Which two pieces of information does a speech synthesis solution typically work from?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez une fonctionnalité qui utilise la synthèse vocale (text-to-speech) d'Azure Speech.

    À partir de quelles deux informations une solution de synthèse vocale fonctionne-t-elle habituellement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "An audio recording of the user"
        fr: "Un enregistrement audio de l'utilisateur"
    - id: b
      text:
        en: "The text to be spoken"
        fr: "Le texte à prononcer"
    - id: c
      text:
        en: "A SAS URI to a storage container"
        fr: "Un URI SAS vers un conteneur de stockage"
    - id: d
      text:
        en: "The voice used to speak"
        fr: "La voix utilisée pour parler"
    - id: e
      text:
        en: "A microphone on the device"
        fr: "Un microphone sur l'appareil"
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: |
      Speech synthesis turns text into audible speech, so it needs the text to speak and the voice that vocalizes it. Azure Speech offers many predefined voices, including neural voices, and the application selects one of them.
    fr: |
      La synthèse vocale transforme du texte en parole audible : il lui faut donc le texte à prononcer et la voix qui le vocalise. Azure Speech propose de nombreuses voix prédéfinies, dont des voix neuronales, et l'application en sélectionne une.
  options:
    a:
      en: "A recording of the user is an input of speech recognition, not of speech synthesis."
      fr: "Un enregistrement de l'utilisateur est une entrée de la reconnaissance vocale, pas de la synthèse vocale."
    c:
      en: "A SAS URI is used to point batch transcription to stored audio files."
      fr: "Un URI SAS sert à indiquer à la transcription par lots des fichiers audio stockés."
    e:
      en: "A microphone captures speech to transcribe; synthesis sends audio to a speaker or to a file."
      fr: "Un microphone capte la parole à transcrire ; la synthèse envoie l'audio vers un haut-parleur ou un fichier."
references:
  - title: "Speech synthesis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
