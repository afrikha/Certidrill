id: ai901-2a-grounding-context
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Employees of Litware ask a chat application: "What is the maximum that I can claim for a hotel night?" The model gives a generic answer and suggests that they consult the company policy.

    You need answers that reflect Litware's own expense policy.

    What should the application add to the prompt?
  fr: |
    Des employés de Litware demandent à une application de conversation : « Quel est le montant maximal que je peux me faire rembourser pour une nuit d'hôtel ? » Le modèle donne une réponse générique et leur suggère de consulter la politique de l'entreprise.

    Les réponses doivent refléter la politique de notes de frais propre à Litware.

    Que doit ajouter l'application à l'invite ?
body:
  options:
    - { id: a, text: { en: "A request to format the answer as a numbered list", fr: "Une demande de mise en forme de la réponse en liste numérotée" } }
    - { id: b, text: { en: "An instruction to answer in a cheerful and friendly manner", fr: "Une instruction demandant de répondre de façon enjouée et amicale" } }
    - { id: c, text: { en: "The relevant sections retrieved from the expense policy documents", fr: "Les sections pertinentes récupérées dans les documents de la politique de notes de frais" } }
    - { id: d, text: { en: "A sample answer that shows the writing style that employees expect", fr: "Un exemple de réponse qui montre le style de rédaction attendu par les employés" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Retrieval augmented generation (RAG) retrieves relevant information, such as sections of the policy, and adds it to the prompt with the original question. The response of the model is then grounded in that information instead of being generic.
    fr: |
      La génération augmentée par récupération (RAG) récupère des informations pertinentes, comme des sections de la politique, et les ajoute à l'invite avec la question d'origine. La réponse du modèle est alors ancrée dans ces informations au lieu d'être générique.
  options:
    a:
      en: "Asking for a structure changes the layout of the answer, not the facts that the model has at its disposal."
      fr: "Demander une structure modifie la présentation de la réponse, pas les faits dont le modèle dispose."
    b:
      en: "A tone instruction changes the style. The model still doesn't know the amounts set by Litware."
      fr: "Une instruction de ton modifie le style. Le modèle ne connaît toujours pas les montants fixés par Litware."
    d:
      en: "An example of style helps the model imitate a form. It doesn't provide the content of the policy."
      fr: "Un exemple de style aide le modèle à imiter une forme. Il ne fournit pas le contenu de la politique."
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
