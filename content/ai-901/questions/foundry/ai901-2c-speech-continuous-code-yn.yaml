id: ai901-2c-speech-continuous-code-yn
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You review the following Python code. The `key` and `endpoint` variables contain the key and the endpoint of a Foundry resource.

    ```python
    import azure.cognitiveservices.speech as speechsdk

    speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)
    audio_config = speechsdk.audio.AudioConfig(use_default_microphone=True)
    recognizer = speechsdk.SpeechRecognizer(speech_config=speech_config, audio_config=audio_config)

    recognizer.recognized.connect(lambda evt: print(evt.result.text))

    recognizer.start_continuous_recognition()
    input("Press Enter to stop...")
    recognizer.stop_continuous_recognition()
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code Python suivant. Les variables `key` et `endpoint` contiennent la clé et le point de terminaison d'une ressource Foundry.

    ```python
    import azure.cognitiveservices.speech as speechsdk

    speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)
    audio_config = speechsdk.audio.AudioConfig(use_default_microphone=True)
    recognizer = speechsdk.SpeechRecognizer(speech_config=speech_config, audio_config=audio_config)

    recognizer.recognized.connect(lambda evt: print(evt.result.text))

    recognizer.start_continuous_recognition()
    input("Press Enter to stop...")
    recognizer.stop_continuous_recognition()
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The application captures the audio from the default microphone."
        fr: "L'application capte l'audio à partir du microphone par défaut."
    - id: s2
      text:
        en: "The application stops transcribing after the first phrase that it recognizes."
        fr: "L'application arrête de transcrire après la première phrase qu'elle reconnaît."
    - id: s3
      text:
        en: "Each time a phrase is recognized, its text is displayed."
        fr: "Chaque fois qu'une phrase est reconnue, son texte est affiché."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: |
      `AudioConfig(use_default_microphone=True)` selects the default microphone as the audio source. `start_continuous_recognition()` keeps the recognition running until `stop_continuous_recognition()` is called, here when the user presses Enter. The handler connected to the `recognized` event receives the final text of each phrase and prints it.
    fr: |
      `AudioConfig(use_default_microphone=True)` sélectionne le microphone par défaut comme source audio. `start_continuous_recognition()` maintient la reconnaissance active jusqu'à l'appel de `stop_continuous_recognition()`, ici quand l'utilisateur appuie sur Entrée. Le gestionnaire connecté à l'événement `recognized` reçoit le texte définitif de chaque phrase et l'affiche.
references:
