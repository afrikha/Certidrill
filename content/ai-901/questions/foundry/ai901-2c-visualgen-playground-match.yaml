id: ai901-2c-visualgen-playground-match
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A Foundry project contains deployments of a vision-enabled chat model, an image-generation model and a video-generation model.

    Which playground of the Foundry portal should you use for each request? To answer, drag the appropriate playground to each request. Each playground may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un projet Foundry contient les déploiements d'un modèle de conversation compatible avec la vision, d'un modèle de génération d'images et d'un modèle de génération de vidéos.

    Quel terrain de jeu du portail Foundry devez-vous utiliser pour chaque demande ? Pour répondre, faites glisser le terrain de jeu approprié vers chaque demande. Chaque terrain de jeu peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: img
      text:
        en: "Image playground"
        fr: "Terrain de jeu d'images"
    - id: vid
      text:
        en: "Video playground"
        fr: "Terrain de jeu vidéo"
    - id: chat
      text:
        en: "Model playground, with an uploaded image"
        fr: "Terrain de jeu de modèles, avec une image chargée"
    - id: tts
      text:
        en: "Azure Speech - Text to Speech playground"
        fr: "Terrain de jeu Azure Speech - Text to Speech"
  targets:
    - id: t1
      text:
        en: "Create a watercolor painting of a fox in a forest."
        fr: "Créer une aquarelle représentant un renard dans une forêt."
    - id: t2
      text:
        en: "Create an eight-second clip of waves breaking on a beach."
        fr: "Créer un clip de huit secondes de vagues qui se brisent sur une plage."
    - id: t3
      text:
        en: "Find out which breed the dog in a photo is."
        fr: "Savoir de quelle race est le chien sur une photo."
answer:
  mapping:
    t1: img
    t2: vid
    t3: chat
explanation:
  correct:
    en: |
      A new still image is created in the image playground, where you describe the image to an image-generation model. A clip is created in the video playground, where you also set the dimensions and the duration. A question about an existing photo is image analysis: you upload the photo in the model playground of the vision-enabled model. The text to speech playground produces audio, not visual content.
    fr: |
      Une nouvelle image fixe se crée dans le terrain de jeu d'images, où vous décrivez l'image à un modèle de génération d'images. Un clip se crée dans le terrain de jeu vidéo, où vous réglez aussi les dimensions et la durée. Une question sur une photo existante relève de l'analyse d'images : vous chargez la photo dans le terrain de jeu de modèles du modèle compatible avec la vision. Le terrain de jeu de synthèse vocale produit de l'audio, pas du contenu visuel.
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
