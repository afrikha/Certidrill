id: ai901-2d-app-code-tab
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Content Understanding playground of the Foundry portal, you test the **Receipt** analyzer on a sample receipt. You now want a Python sample that calls the same analyzer from an application.

    Which tab of the playground should you select?
  fr: |
    Dans le terrain de jeu Content Understanding du portail Foundry, vous testez l'analyseur **Receipt** sur un exemple de reçu. Vous souhaitez maintenant obtenir un exemple Python qui appelle le même analyseur depuis une application.

    Quel onglet du terrain de jeu devez-vous sélectionner ?
body:
  options:
  - id: a
    text: '**Fields**'
  - id: b
    text: '**Markdown**'
  - id: c
    text: '**Code**'
  - id: d
    text: '**Result**'
answer:
  optionId: c
explanation:
  correct:
    en: The **Code** tab of the playground shows sample code that creates a `ContentUnderstandingClient`, calls `begin_analyze` with the identifier of the analyzer that you tested (here `prebuilt-receipt`) and reads the result.
    fr: L'onglet **Code** du terrain de jeu affiche un exemple de code qui crée un `ContentUnderstandingClient`, appelle `begin_analyze` avec l'identificateur de l'analyseur testé (ici `prebuilt-receipt`) et lit le résultat.
  options:
    a:
      en: '**Fields** shows the extracted values in a readable view.'
      fr: '**Fields** affiche les valeurs extraites dans une vue lisible.'
    b:
      en: '**Markdown** shows the content of the document as Markdown.'
      fr: '**Markdown** affiche le contenu du document en Markdown.'
    d:
      en: '**Result** shows the raw JSON that an application would receive, not the code that requests it.'
      fr: '**Result** affiche le JSON brut qu''une application recevrait, pas le code qui le demande.'
references:
- title: Exercise - Get started with information extraction in Microsoft Foundry
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/4-exercise
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
