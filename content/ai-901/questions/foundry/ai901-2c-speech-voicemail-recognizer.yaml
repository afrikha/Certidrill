id: ai901-2c-speech-voicemail-recognizer
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a lightweight application that converts recorded voicemail messages into text by using the Azure Speech SDK.

    Which object of the SDK performs the transcription?
  fr: |
    Contoso crée une application légère qui convertit en texte des messages vocaux enregistrés, à l'aide du SDK Azure Speech.

    Quel objet du SDK effectue la transcription ?
body:
  options:
    - id: a
      text: "`SpeechRecognizer`"
    - id: b
      text: "`SpeechSynthesizer`"
    - id: c
      text: "`AudioOutputConfig`"
    - id: d
      text: "`SpeechConfig`"
answer:
  optionId: a
explanation:
  correct:
    en: |
      Converting audio into text is speech recognition, and the `SpeechRecognizer` object does it. The application gives it the connection settings and the audio source, then displays the text that it returns.
    fr: |
      Convertir de l'audio en texte relève de la reconnaissance vocale, et c'est l'objet `SpeechRecognizer` qui s'en charge. L'application lui fournit les paramètres de connexion et la source audio, puis affiche le texte qu'il renvoie.
  options:
    b:
      en: "`SpeechSynthesizer` does the opposite: it converts text into spoken audio."
      fr: "`SpeechSynthesizer` fait l'inverse : il convertit du texte en audio parlé."
    c:
      en: "`AudioOutputConfig` only says where synthesized audio goes (a speaker or a file); it transcribes nothing."
      fr: "`AudioOutputConfig` indique seulement où va l'audio synthétisé (un haut-parleur ou un fichier) ; il ne transcrit rien."
    d:
      en: "`SpeechConfig` holds the endpoint and the key used to connect; it is needed, but it doesn't perform the transcription."
      fr: "`SpeechConfig` contient le point de terminaison et la clé utilisés pour la connexion ; il est nécessaire, mais il n'effectue pas la transcription."
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
