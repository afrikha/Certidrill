id: ai901-2b-text-yn-mcp
objective: "2.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    In the Foundry portal, you connect an agent to the Azure Language MCP server by adding the **Azure Language in Foundry Tools** tool. The agent runs in a project of a Foundry resource.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans le portail Foundry, vous connectez un agent au serveur MCP Azure Language en ajoutant l'outil **Azure Language in Foundry Tools**. L'agent s'exécute dans un projet d'une ressource Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In the Model Context Protocol, the agent acts as the client and the server exposes the tools.
        fr: Dans le protocole MCP (Model Context Protocol), l'agent joue le rôle de client et le serveur expose les outils.
    - id: s2
      text:
        en: You must create a separate Azure Language resource before you add the tool.
        fr: Vous devez créer une ressource Azure Language distincte avant d'ajouter l'outil.
    - id: s3
      text:
        en: The code of the agent must call the Azure Language REST API and manage the authentication tokens.
        fr: Le code de l'agent doit appeler l'API REST Azure Language et gérer les jetons d'authentification.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      MCP uses a client-server architecture: the MCP client is the agent, or the application that hosts it, and the MCP server exposes tools, data or actions. A Foundry resource already includes access to the Language tools, so the connection is configured with the name of the Foundry resource and no separate Azure Language resource is needed. The agent calls the tools through the standard protocol, without calling the REST API directly or handling tokens in its code.
    fr: |
      MCP repose sur une architecture client-serveur : le client MCP est l'agent, ou l'application qui l'héberge, et le serveur MCP expose des outils, des données ou des actions. Une ressource Foundry inclut déjà l'accès aux outils Language : la connexion se configure avec le nom de la ressource Foundry et aucune ressource Azure Language distincte n'est nécessaire. L'agent appelle les outils par le protocole standard, sans appeler directement l'API REST ni gérer de jetons dans son code.
references:
  - title: Use Azure Language with an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/4-language-mcp
