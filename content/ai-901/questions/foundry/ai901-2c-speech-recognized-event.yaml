id: ai901-2c-speech-recognized-event
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application uses the continuous recognition of the Azure Speech SDK. While a person speaks, the application must ignore the partial results and store only the final text of each phrase.

    To which event of the `SpeechRecognizer` object should you connect the handler that stores the text?
  fr: |
    Une application utilise la reconnaissance continue du SDK Azure Speech. Pendant qu'une personne parle, l'application doit ignorer les résultats partiels et ne stocker que le texte définitif de chaque phrase.

    À quel événement de l'objet `SpeechRecognizer` devez-vous connecter le gestionnaire qui stocke le texte ?
body:
  options:
    - id: a
      text: "`recognized`"
    - id: b
      text: "`recognizing`"
    - id: c
      text: "`session_started`"
    - id: d
      text: "`canceled`"
answer:
  optionId: a
explanation:
  correct:
    en: |
      The `recognized` event is raised with the final result of a recognition, so its handler receives the complete text of each phrase. Connecting the handler with `recognizer.recognized.connect(...)` therefore stores only final text.
    fr: |
      L'événement `recognized` est déclenché avec le résultat final d'une reconnaissance : son gestionnaire reçoit donc le texte complet de chaque phrase. Connecter le gestionnaire avec `recognizer.recognized.connect(...)` ne stocke ainsi que du texte définitif.
  options:
    b:
      en: "`recognizing` delivers intermediate results while the person is still speaking, which the application must ignore."
      fr: "`recognizing` fournit des résultats intermédiaires pendant que la personne parle encore, ce que l'application doit ignorer."
    c:
      en: "`session_started` only signals that a recognition session begins; it carries no recognized text."
      fr: "`session_started` signale seulement le début d'une session de reconnaissance ; il ne porte aucun texte reconnu."
    d:
      en: "`canceled` signals that a recognition was canceled, for example after a connection failure."
      fr: "`canceled` signale qu'une reconnaissance a été annulée, par exemple après un échec de connexion."
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: "How to recognize speech"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-recognize-speech
