id: ai901-2d-doc-yn-basics
objective: "2.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You evaluate Azure Content Understanding in Foundry Tools for a document-processing project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez Azure Content Understanding dans Foundry Tools pour un projet de traitement de documents.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Content Understanding can extract information from documents, images, audio files and videos.
      fr: Content Understanding peut extraire des informations de documents, d'images, de fichiers audio et de vidéos.
  - id: s2
    text:
      en: An analyzer applies the same schema to every document that it processes.
      fr: Un analyseur applique le même schéma à chaque document qu'il traite.
  - id: s3
    text:
      en: You must create a custom analyzer before you can extract the fields of an invoice.
      fr: Vous devez créer un analyseur personnalisé avant de pouvoir extraire les champs d'une facture.
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: Content Understanding processes documents, images, audio and video. An analyzer applies its schema consistently to all the content that it receives and returns a predictable result. Prebuilt analyzers such as `prebuilt-invoice` cover common scenarios, so a custom analyzer isn't required for invoices.
    fr: 'Content Understanding traite les documents, les images, l''audio et la vidéo. Un analyseur applique son schéma de façon cohérente à tout le contenu qu''il reçoit et renvoie un résultat prévisible. Des analyseurs prédéfinis comme `prebuilt-invoice` couvrent les scénarios courants : un analyseur personnalisé n''est donc pas nécessaire pour les factures.'
references:
- title: Introduction
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/1-introduction
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
