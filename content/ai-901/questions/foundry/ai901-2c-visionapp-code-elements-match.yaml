id: ai901-2c-visionapp-code-elements-match
objective: "2.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A Python application uses the `openai` package with models deployed in Microsoft Foundry.

    Match each code element to what it does. To answer, drag the appropriate code element to each description. Each code element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python utilise le package `openai` avec des modèles déployés dans Microsoft Foundry.

    Associez chaque élément de code à ce qu'il fait. Pour répondre, faites glisser l'élément de code approprié vers chaque description. Chaque élément de code peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: resp
      text: "`client.responses.create()`"
    - id: gen
      text: "`client.images.generate()`"
    - id: dec
      text: "`base64.b64decode()`"
    - id: out
      text: "`response.output_text`"
  targets:
    - id: t1
      text:
        en: "Sends a text instruction and an image to a vision-enabled model"
        fr: "Envoie une instruction en texte et une image à un modèle compatible avec la vision"
    - id: t2
      text:
        en: "Sends a prompt, a number of images and a size to an image-generation model"
        fr: "Envoie une invite, un nombre d'images et une taille à un modèle de génération d'images"
    - id: t3
      text:
        en: "Converts a returned base64 string into bytes that can be saved as a PNG file"
        fr: "Convertit une chaîne base64 renvoyée en octets qui peuvent être enregistrés dans un fichier PNG"
answer:
  mapping:
    t1: resp
    t2: gen
    t3: dec
explanation:
  correct:
    en: |
      Image analysis goes through `responses.create()`, whose input holds `input_text` and `input_image` items. Image generation goes through `images.generate()`, which takes `prompt`, `n` and `size`. The generated image is returned as base64 text, which `base64.b64decode()` converts into bytes. `output_text` is only the text answer of a Responses call.
    fr: |
      L'analyse d'images passe par `responses.create()`, dont l'entrée contient des éléments `input_text` et `input_image`. La génération d'images passe par `images.generate()`, qui reçoit `prompt`, `n` et `size`. L'image générée est renvoyée sous forme de texte base64, que `base64.b64decode()` convertit en octets. `output_text` n'est que la réponse en texte d'un appel Responses.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Azure OpenAI image generation models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e
