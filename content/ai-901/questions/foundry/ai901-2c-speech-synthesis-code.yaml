id: ai901-2c-speech-synthesis-code
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Python application that reads a text aloud through the default speaker of the computer by using Azure Speech. The `speech_config` object is already created.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui lit un texte à voix haute sur le haut-parleur par défaut de l'ordinateur à l'aide d'Azure Speech. L'objet `speech_config` est déjà créé.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import azure.cognitiveservices.speech as speechsdk

    audio_config = speechsdk.audio.[[cfg]](use_default_speaker=True)
    synthesizer = speechsdk.[[cls]](speech_config=speech_config, audio_config=audio_config)

    synthesizer.[[method]]("Your order has shipped.").get()
  slots:
    - id: cfg
      options:
        - id: in
          text: "AudioConfig"
        - id: out
          text: "AudioOutputConfig"
        - id: push
          text: "PushAudioInputStream"
    - id: cls
      options:
        - id: synth
          text: "SpeechSynthesizer"
        - id: recog
          text: "SpeechRecognizer"
        - id: conf
          text: "SpeechConfig"
    - id: method
      options:
        - id: once
          text: "recognize_once_async"
        - id: cont
          text: "start_continuous_recognition"
        - id: speak
          text: "speak_text_async"
answer:
  values:
    cfg: out
    cls: synth
    method: speak
explanation:
  correct:
    en: |
      Speech synthesis sends audio out, so the destination is described by an `AudioOutputConfig` object, here the default speaker. The `SpeechSynthesizer` object converts the text into speech, and its `speak_text_async()` method takes the text to speak.
    fr: |
      La synthèse vocale produit de l'audio en sortie : la destination est donc décrite par un objet `AudioOutputConfig`, ici le haut-parleur par défaut. L'objet `SpeechSynthesizer` convertit le texte en parole, et sa méthode `speak_text_async()` reçoit le texte à prononcer.
  options:
    in:
      en: "`AudioConfig` describes an audio input, such as a microphone or a file to transcribe."
      fr: "`AudioConfig` décrit une entrée audio, comme un microphone ou un fichier à transcrire."
    push:
      en: "`PushAudioInputStream` is a stream that feeds audio into a recognizer; it isn't an output."
      fr: "`PushAudioInputStream` est un flux qui alimente un module de reconnaissance en audio ; ce n'est pas une sortie."
    recog:
      en: "`SpeechRecognizer` converts speech into text, the opposite of what is required."
      fr: "`SpeechRecognizer` convertit la parole en texte, l'inverse de ce qui est demandé."
    conf:
      en: "`SpeechConfig` holds the connection settings; it is already created and doesn't speak."
      fr: "`SpeechConfig` contient les paramètres de connexion ; il est déjà créé et ne prononce rien."
    once:
      en: "`recognize_once_async` is a method of `SpeechRecognizer`."
      fr: "`recognize_once_async` est une méthode de `SpeechRecognizer`."
    cont:
      en: "`start_continuous_recognition` is a method of `SpeechRecognizer`."
      fr: "`start_continuous_recognition` est une méthode de `SpeechRecognizer`."
references:
  - title: "Speech synthesis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
  - title: "How to synthesize speech from text"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-speech-synthesis
