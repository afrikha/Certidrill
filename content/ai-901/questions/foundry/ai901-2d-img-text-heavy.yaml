id: ai901-2d-img-text-heavy
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Drivers of Adatum photograph printed delivery notes with their phones. Each JPEG file shows a full page of printed text. Adatum needs the order number, the delivery date and the name of the recipient that are printed on each note.

    You plan to create a custom analyzer in Azure Content Understanding in Foundry Tools.

    Which base analyzer should the custom analyzer use?
  fr: |
    Les chauffeurs d'Adatum photographient des bons de livraison imprimés avec leur téléphone. Chaque fichier JPEG montre une page entière de texte imprimé. Adatum a besoin du numéro de commande, de la date de livraison et du nom du destinataire imprimés sur chaque bon.

    Vous prévoyez de créer un analyseur personnalisé dans Azure Content Understanding dans Foundry Tools.

    Quel analyseur de base l'analyseur personnalisé doit-il utiliser ?
body:
  options:
  - id: a
    text: '`prebuilt-image`'
  - id: b
    text: '`prebuilt-audio`'
  - id: c
    text: '`prebuilt-video`'
  - id: d
    text: '`prebuilt-document`'
answer:
  optionId: d
explanation:
  correct:
    en: Image analyzers aren't optimized for scenarios in which the analysis relies mainly on text. When the goal is to extract text values from a picture, such as a photographed form, Microsoft recommends a document field extraction schema; JPEG files are accepted as documents.
    fr: Les analyseurs d'images ne sont pas optimisés pour les scénarios où l'analyse repose surtout sur du texte. Lorsque l'objectif est d'extraire des valeurs textuelles d'une image, comme un formulaire photographié, Microsoft recommande un schéma d'extraction de champs de document ; les fichiers JPEG sont acceptés comme documents.
  options:
    a:
      en: '`prebuilt-image` suits images whose visual content is analyzed, such as a scene or a chart; here the information is printed text.'
      fr: '`prebuilt-image` convient aux images dont le contenu visuel est analysé, comme une scène ou un graphique ; ici, l''information est du texte imprimé.'
    b:
      en: '`prebuilt-audio` is the base analyzer for recordings.'
      fr: '`prebuilt-audio` est l''analyseur de base pour les enregistrements audio.'
    c:
      en: '`prebuilt-video` is the base analyzer for video files.'
      fr: '`prebuilt-video` est l''analyseur de base pour les fichiers vidéo.'
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
- title: Service quotas and limits - Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/service-limits
