id: ai901-2d-img-description-improve
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A custom image analyzer of Azure Content Understanding in Foundry Tools inspects photos of machined parts. Its schema contains a field named `DefectType`. During the tests, the values of the field are vague and inconsistent.

    What should you do first?
  fr: |
    Un analyseur d'images personnalisé d'Azure Content Understanding dans Foundry Tools inspecte des photos de pièces usinées. Son schéma contient un champ nommé `DefectType`. Pendant les tests, les valeurs du champ sont vagues et incohérentes.

    Que devez-vous faire en premier ?
body:
  options:
  - id: a
    text:
      en: Convert the photos to PDF files before the analysis.
      fr: Convertir les photos en fichiers PDF avant l'analyse.
  - id: b
    text:
      en: Replace the analyzer with the `prebuilt-read` analyzer.
      fr: Remplacer l'analyseur par l'analyseur `prebuilt-read`.
  - id: c
    text:
      en: Write a more detailed description for the field.
      fr: Rédiger une description plus détaillée du champ.
  - id: d
    text:
      en: Submit each photo twice and compare the two results.
      fr: Envoyer chaque photo deux fois et comparer les deux résultats.
answer:
  optionId: c
explanation:
  correct:
    en: The model treats the description of a field as its instructions. Microsoft's guidance is to start by refining the descriptions (what the field contains, the expected format, the possible values), which often resolves quality issues without anything else.
    fr: Le modèle traite la description d'un champ comme ses instructions. Microsoft recommande de commencer par affiner les descriptions (ce que contient le champ, le format attendu, les valeurs possibles), ce qui résout souvent les problèmes de qualité sans autre action.
  options:
    a:
      en: Changing the file format doesn't tell the model what a defect type is.
      fr: Changer le format de fichier n'indique pas au modèle ce qu'est un type de défaut.
    b:
      en: '`prebuilt-read` returns text (OCR); it can''t describe a defect that is visible on a part.'
      fr: '`prebuilt-read` renvoie du texte (OCR) ; il ne peut pas décrire un défaut visible sur une pièce.'
    d:
      en: Comparing two runs shows the inconsistency again but doesn't correct its cause.
      fr: Comparer deux exécutions montre à nouveau l'incohérence, mais n'en corrige pas la cause.
references:
- title: Best practices for using Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
- title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
