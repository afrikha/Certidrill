id: ai901-2c-vision-typical-task
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which task is a typical use of a vision-enabled multimodal model deployed in Microsoft Foundry?
  fr: |
    Quelle tâche est un usage typique d'un modèle multimodal compatible avec la vision déployé dans Microsoft Foundry ?
body:
  options:
    - id: a
      text:
        en: "Creating a company logo from a written description"
        fr: "Créer le logo d'une entreprise à partir d'une description écrite"
    - id: b
      text:
        en: "Reading a text message aloud in a natural voice"
        fr: "Lire un message texte à voix haute avec une voix naturelle"
    - id: c
      text:
        en: "Explaining what a chart in a screenshot shows"
        fr: "Expliquer ce que montre un graphique dans une capture d'écran"
    - id: d
      text:
        en: "Transcribing a recorded phone call into text"
        fr: "Transcrire en texte un appel téléphonique enregistré"
answer:
  optionId: c
explanation:
  correct:
    en: |
      Vision-enabled models interpret visual input: they extract meaning from charts, diagrams, screenshots, documents and photos, and explain it in natural language. Explaining a chart from a screenshot is exactly this kind of image understanding.
    fr: |
      Les modèles compatibles avec la vision interprètent des données visuelles : ils dégagent le sens de graphiques, de diagrammes, de captures d'écran, de documents et de photos, et l'expliquent en langage naturel. Expliquer un graphique à partir d'une capture d'écran relève exactement de cette compréhension d'image.
  options:
    a:
      en: "Creating a new image from a description is image generation, done by a model such as GPT-Image-1."
      fr: "Créer une nouvelle image à partir d'une description relève de la génération d'images, assurée par un modèle comme GPT-Image-1."
    b:
      en: "Reading text aloud is speech synthesis, a capability of Azure Speech."
      fr: "Lire un texte à voix haute relève de la synthèse vocale, une capacité d'Azure Speech."
    d:
      en: "Transcribing a recording is speech recognition, a capability of Azure Speech."
      fr: "Transcrire un enregistrement relève de la reconnaissance vocale, une capacité d'Azure Speech."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
