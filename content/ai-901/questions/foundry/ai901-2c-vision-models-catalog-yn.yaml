id: ai901-2c-vision-models-catalog-yn
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You select a model in the Foundry model catalog for an application that interprets images.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous sélectionnez un modèle dans le catalogue de modèles Foundry pour une application qui interprète des images.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "To analyze an image with a GPT-5 series model, the image must first pass through a separate computer vision pipeline."
        fr: "Pour analyser une image avec un modèle de la série GPT-5, l'image doit d'abord passer par un pipeline de vision par ordinateur distinct."
    - id: s2
      text:
        en: "A deployment of GPT-4.1-mini accepts text and images in the same prompt."
        fr: "Un déploiement de GPT-4.1-mini accepte du texte et des images dans la même invite."
    - id: s3
      text:
        en: "The catalog also offers multimodal models provided by partners."
        fr: "Le catalogue propose aussi des modèles multimodaux fournis par des partenaires."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: |
      The GPT-4.1 models, including GPT-4.1-mini, and the GPT-5 series are multimodal: one model takes the text and the images of a prompt, which removes the need for a separate vision pipeline. The Foundry model catalog also contains multimodal models from partners, for example Anthropic.
    fr: |
      Les modèles GPT-4.1, dont GPT-4.1-mini, et la série GPT-5 sont multimodaux : un seul modèle reçoit le texte et les images d'une invite, ce qui supprime le besoin d'un pipeline de vision séparé. Le catalogue de modèles Foundry contient aussi des modèles multimodaux de partenaires, par exemple Anthropic.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
