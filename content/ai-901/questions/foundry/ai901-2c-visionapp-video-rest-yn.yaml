id: ai901-2c-visionapp-video-rest-yn
objective: "2.3.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    An application runs the following command to request a video from a Sora 2 deployment in a Foundry resource.

    ```bash
    curl -X POST "https://contoso-ai.openai.azure.com/openai/v1/videos" \
      -H "Content-Type: application/json" \
      -H "api-key: $AZURE_OPENAI_API_KEY" \
      -d '{
        "model": "sora-2",
        "prompt": "A paper boat floating down a rainy street.",
        "size": "1280x720",
        "seconds": "8"
      }'
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application exécute la commande suivante pour demander une vidéo à un déploiement de Sora 2 dans une ressource Foundry.

    ```bash
    curl -X POST "https://contoso-ai.openai.azure.com/openai/v1/videos" \
      -H "Content-Type: application/json" \
      -H "api-key: $AZURE_OPENAI_API_KEY" \
      -d '{
        "model": "sora-2",
        "prompt": "A paper boat floating down a rainy street.",
        "size": "1280x720",
        "seconds": "8"
      }'
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The request is authenticated with a key sent in a header."
        fr: "La requête est authentifiée par une clé envoyée dans un en-tête."
    - id: s2
      text:
        en: "The request asks for an eight-second video with a size of 1280x720."
        fr: "La requête demande une vidéo de huit secondes d'une taille de 1280x720."
    - id: s3
      text:
        en: "The response to this request contains the finished MP4 file."
        fr: "La réponse à cette requête contient le fichier MP4 terminé."
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: |
      The `api-key` header carries the key of the resource, and the JSON body asks the `sora-2` deployment for a video of 8 seconds in 1280x720. The POST request only creates an asynchronous job and returns a video ID; the application then polls the status of the job and downloads the MP4 file once the status is `completed`.
    fr: |
      L'en-tête `api-key` porte la clé de la ressource, et le corps JSON demande au déploiement `sora-2` une vidéo de 8 secondes en 1280x720. La requête POST ne fait que créer un travail asynchrone et renvoie un ID de vidéo ; l'application interroge ensuite l'état du travail et télécharge le fichier MP4 une fois l'état passé à `completed`.
references:
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
