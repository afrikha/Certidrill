id: ai901-2c-imagegen-prompt-description
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the image playground of the Foundry portal, you enter the prompt `A picture of a bike`. The generated images differ widely from one another, and none has the style that you expect.

    What should you do?
  fr: |
    Dans le terrain de jeu d'images du portail Foundry, vous saisissez l'invite `A picture of a bike`. Les images générées sont très différentes les unes des autres, et aucune n'a le style que vous attendez.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Deploy a vision-enabled chat model and enter the same prompt."
        fr: "Déployer un modèle de conversation compatible avec la vision et saisir la même invite."
    - id: b
      text:
        en: "Encode the prompt in base64 before you submit it."
        fr: "Encoder l'invite en base64 avant de l'envoyer."
    - id: c
      text:
        en: "Describe the subject, the style and the colors in the prompt."
        fr: "Décrire le sujet, le style et les couleurs dans l'invite."
    - id: d
      text:
        en: "Poll the status of the request until it is completed."
        fr: "Interroger l'état de la requête jusqu'à ce qu'elle soit terminée."
answer:
  optionId: c
explanation:
  correct:
    en: |
      An image-generation model builds the image from the description that it receives. A prompt that states the subject, the style and the colors, such as "A modern flat illustration of a robot holding a potted plant, clean vector style, pastel colors", leaves less to chance than a vague one and gives results closer to the intent.
    fr: |
      Un modèle de génération d'images construit l'image à partir de la description qu'il reçoit. Une invite qui précise le sujet, le style et les couleurs, comme « A modern flat illustration of a robot holding a potted plant, clean vector style, pastel colors », laisse moins de place au hasard qu'une invite vague et donne des résultats plus proches de l'intention.
  options:
    a:
      en: "A vision-enabled chat model answers in text; it doesn't generate the picture."
      fr: "Un modèle de conversation compatible avec la vision répond en texte ; il ne génère pas l'image."
    b:
      en: "Base64 is a way to carry binary data such as an image as text; it doesn't improve a prompt."
      fr: "Le base64 sert à transporter sous forme de texte des données binaires comme une image ; il n'améliore pas une invite."
    d:
      en: "Polling tells you when an asynchronous job has finished; it doesn't change what is generated."
      fr: "Interroger l'état indique quand un travail asynchrone est terminé ; cela ne change pas ce qui est généré."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
