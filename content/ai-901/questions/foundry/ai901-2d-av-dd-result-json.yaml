id: ai901-2d-av-dd-result-json
objective: "2.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An application analyzes a recorded call by using the `prebuilt-audioSearch` analyzer of Azure Content Understanding in Foundry Tools. The result contains the following content item.

    ```json
    {
      "kind": "audioVisual",
      "startTimeMs": 0,
      "endTimeMs": 114670,
      "markdown": "# Audio: 00:00.000 => 01:54.670\n\nTranscript\n\nWEBVTT\n\n00:00.080 --> 00:02.160\n<v Speaker 1>Thank you for calling Adatum Insurance. ...",
      "fields": {
        "Summary": {
          "type": "string",
          "valueString": "A customer called Adatum Insurance to report a damaged windshield. ..."
        }
      }
    }
    ```

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application analyse un appel enregistré à l'aide de l'analyseur `prebuilt-audioSearch` d'Azure Content Understanding dans Foundry Tools. Le résultat contient l'élément de contenu suivant.

    ```json
    {
      "kind": "audioVisual",
      "startTimeMs": 0,
      "endTimeMs": 114670,
      "markdown": "# Audio: 00:00.000 => 01:54.670\n\nTranscript\n\nWEBVTT\n\n00:00.080 --> 00:02.160\n<v Speaker 1>Thank you for calling Adatum Insurance. ...",
      "fields": {
        "Summary": {
          "type": "string",
          "valueString": "A customer called Adatum Insurance to report a damaged windshield. ..."
        }
      }
    }
    ```

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: The recording lasts about [[dur]]. The application reads the transcript of the call in the [[tr]] property and the summary of the call in the [[sum]] property.
    fr: L'enregistrement dure environ [[dur]]. L'application lit la transcription de l'appel dans la propriété [[tr]] et le résumé de l'appel dans la propriété [[sum]].
  slots:
  - id: dur
    options:
    - id: d11
      text:
        en: 11 seconds
        fr: 11 secondes
    - id: d115s
      text:
        en: 115 seconds
        fr: 115 secondes
    - id: d115m
      text:
        en: 115 minutes
        fr: 115 minutes
  - id: tr
    options:
    - id: pkind
      text: '`kind`'
    - id: pmd
      text: '`markdown`'
    - id: pend
      text: '`endTimeMs`'
  - id: sum
    options:
    - id: pval
      text: '`fields.Summary.valueString`'
    - id: pmd2
      text: '`markdown`'
    - id: ptype
      text: '`fields.Summary.type`'
answer:
  values:
    dur: d115s
    tr: pmd
    sum: pval
explanation:
  correct:
    en: '`startTimeMs` and `endTimeMs` are in milliseconds: 114,670 ms is about 115 seconds (1 minute 55 seconds). For audio, the `markdown` property contains the transcript in the WebVTT format, with the speakers. The fields of the analyzer are under `fields`; the value of a string field is in `valueString`.'
    fr: '`startTimeMs` et `endTimeMs` sont exprimés en millisecondes : 114 670 ms représentent environ 115 secondes (1 minute 55 secondes). Pour l''audio, la propriété `markdown` contient la transcription au format WebVTT, avec les locuteurs. Les champs de l''analyseur se trouvent sous `fields` ; la valeur d''un champ de type chaîne est dans `valueString`.'
  options:
    pkind:
      en: '`kind` gives the type of the content item (`audioVisual` for audio and video).'
      fr: '`kind` donne le type de l''élément de contenu (`audioVisual` pour l''audio et la vidéo).'
    pmd2:
      en: '`markdown` holds the transcript; the summary is a generated field.'
      fr: '`markdown` contient la transcription ; le résumé est un champ généré.'
    ptype:
      en: '`type` gives the type of the field (`string`), not its value.'
      fr: '`type` donne le type du champ (`string`), pas sa valeur.'
references:
- title: 'Quickstart: Azure Content Understanding in Foundry Tools'
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
- title: 'AudioVisual analysis: extracting structured content with Azure Content Understanding in Foundry Tools'
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/elements
