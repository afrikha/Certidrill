id: ai901-2b-audio-yn-request-code
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A Python application contains the following code. `client` is an `AzureOpenAI` object.

    ```python
    with open("question.wav", "rb") as f:
        encoded_audio = base64.b64encode(f.read()).decode("utf-8")

    completion = client.chat.completions.create(
        model="gpt-audio-mini",
        modalities=["text", "audio"],
        audio={"voice": "alloy", "format": "wav"},
        messages=[{
            "role": "user",
            "content": [
                {"type": "text", "text": "Answer the question asked in this recording."},
                {"type": "input_audio", "input_audio": {"data": encoded_audio, "format": "wav"}},
            ],
        }],
    )
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python contient le code suivant. `client` est un objet `AzureOpenAI`.

    ```python
    with open("question.wav", "rb") as f:
        encoded_audio = base64.b64encode(f.read()).decode("utf-8")

    completion = client.chat.completions.create(
        model="gpt-audio-mini",
        modalities=["text", "audio"],
        audio={"voice": "alloy", "format": "wav"},
        messages=[{
            "role": "user",
            "content": [
                {"type": "text", "text": "Answer the question asked in this recording."},
                {"type": "input_audio", "input_audio": {"data": encoded_audio, "format": "wav"}},
            ],
        }],
    )
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The recording is sent to the model as base64-encoded data.
        fr: L'enregistrement est envoyé au modèle sous forme de données encodées en base64.
    - id: s2
      text:
        en: The model returns a text answer only.
        fr: Le modèle renvoie uniquement une réponse en texte.
    - id: s3
      text:
        en: The user message combines a text instruction and the recording.
        fr: Le message utilisateur combine une instruction en texte et l'enregistrement.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The file is read in binary mode and encoded with `base64.b64encode`; the result is the `data` of the `input_audio` part. The content of the user message has two parts, a text part and the audio part. Because `modalities` lists text and audio, the model returns a spoken answer, in the alloy voice and in WAV format, along with its text.
    fr: |
      Le fichier est lu en mode binaire et encodé avec `base64.b64encode` ; le résultat constitue la valeur `data` de la partie `input_audio`. Le contenu du message utilisateur comporte deux parties, une partie texte et la partie audio. Comme `modalities` liste le texte et l'audio, le modèle renvoie une réponse parlée, avec la voix alloy et au format WAV, accompagnée de son texte.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
