id: ai901-2b-text-agent-language-tool
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You build an agent in the Foundry portal that triages support tickets. The agent must identify the language of each ticket with a consistent, structured result, instead of relying on the judgment of its generative model.

    What should you do?
  fr: |
    Vous créez dans le portail Foundry un agent qui trie des tickets de support. L'agent doit identifier la langue de chaque ticket avec un résultat cohérent et structuré, au lieu de s'en remettre au jugement de son modèle génératif.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the **Azure Language in Foundry Tools** tool to the agent.", fr: "Ajouter l'outil **Azure Language in Foundry Tools** à l'agent." } }
    - { id: b, text: { en: "Ask for the language of each ticket in the instructions of the agent.", fr: "Demander la langue de chaque ticket dans les instructions de l'agent." } }
    - { id: c, text: { en: "Upload a list of language codes as knowledge for the agent.", fr: "Charger une liste de codes de langue en tant que connaissances pour l'agent." } }
    - { id: d, text: { en: "Add the Web search tool to the agent.", fr: "Ajouter l'outil Web search à l'agent." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Language in Foundry Tools tool connects the agent to the Azure Language MCP server. The agent can then call capabilities such as language detection and get the deterministic, structured output of Azure Language instead of generated text.
    fr: |
      L'outil Azure Language in Foundry Tools connecte l'agent au serveur MCP Azure Language. L'agent peut alors appeler des fonctionnalités comme la détection de langue et obtenir la sortie déterministe et structurée d'Azure Language au lieu d'un texte généré.
  options:
    b:
      en: "With instructions alone, the language is still guessed by the generative model, whose output isn't deterministic."
      fr: "Avec les seules instructions, la langue est toujours estimée par le modèle génératif, dont la sortie n'est pas déterministe."
    c:
      en: "A list of codes is reference content; it doesn't analyze the text of a ticket."
      fr: "Une liste de codes est un contenu de référence ; elle n'analyse pas le texte d'un ticket."
    d:
      en: "Web search retrieves public web information and has no language detection capability."
      fr: "Web search récupère des informations publiques du web et n'a aucune capacité de détection de langue."
references:
  - title: Use Azure Language with an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/4-language-mcp
