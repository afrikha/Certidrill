id: ai901-2d-av-keyframes-purpose
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A video analyzer of Azure Content Understanding in Foundry Tools extracts key frames from each video that it processes.

    What are the key frames used for?
  fr: |
    Un analyseur vidéo d'Azure Content Understanding dans Foundry Tools extrait des images clés de chaque vidéo qu'il traite.

    À quoi servent les images clés ?
body:
  options:
  - id: a
    text:
      en: They replace the audio track so that the speech doesn't need to be transcribed.
      fr: Elles remplacent la piste audio afin que la parole n'ait pas à être transcrite.
  - id: b
    text:
      en: They are assembled into a shorter video that summarizes the recording.
      fr: Elles sont assemblées en une vidéo plus courte qui résume l'enregistrement.
  - id: c
    text:
      en: They give the generative model images of each shot from which it generates the fields.
      fr: Elles fournissent au modèle génératif des images de chaque plan à partir desquelles il génère les champs.
  - id: d
    text:
      en: They hold the confidence score of each word of the transcript.
      fr: Elles contiennent le score de confiance de chaque mot de la transcription.
answer:
  optionId: c
explanation:
  correct:
    en: Key frames are selected from the camera shots of the video so that each shot is represented. Together with the transcript of the speech, they are the input from which the generative model produces the fields and the descriptions.
    fr: Les images clés sont sélectionnées parmi les plans de caméra de la vidéo afin que chaque plan soit représenté. Avec la transcription de la parole, elles constituent l'entrée à partir de laquelle le modèle génératif produit les champs et les descriptions.
  options:
    a:
      en: 'The speech is still transcribed: a video analysis uses both the images and the transcript.'
      fr: 'La parole reste transcrite : une analyse vidéo utilise à la fois les images et la transcription.'
    b:
      en: The analyzer returns data about the video, not a new video.
      fr: L'analyseur renvoie des données sur la vidéo, pas une nouvelle vidéo.
    d:
      en: Key frames are images; they carry no information about the words of the transcript.
      fr: Les images clés sont des images ; elles ne portent aucune information sur les mots de la transcription.
references:
- title: Azure Content Understanding in Foundry Tools video overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
- title: 'AudioVisual analysis: extracting structured content with Azure Content Understanding in Foundry Tools'
