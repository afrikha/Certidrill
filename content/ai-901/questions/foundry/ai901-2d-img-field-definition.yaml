id: ai901-2d-img-field-definition
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You define the schema of an image analyzer in Azure Content Understanding in Foundry Tools.

    What do you specify for each field of the schema?
  fr: |
    Vous définissez le schéma d'un analyseur d'images dans Azure Content Understanding dans Foundry Tools.

    Que spécifiez-vous pour chaque champ du schéma ?
body:
  options:
  - id: a
    text:
      en: The pixel coordinates of the area to read
      fr: Les coordonnées en pixels de la zone à lire
  - id: b
    text:
      en: A set of labeled training images
      fr: Un ensemble d'images d'entraînement étiquetées
  - id: c
    text:
      en: A temperature and a maximum number of tokens
      fr: Une température et un nombre maximal de jetons
  - id: d
    text:
      en: A name, a description and a value type
      fr: Un nom, une description et un type de valeur
answer:
  optionId: d
explanation:
  correct:
    en: A schema for images specifies the fields, their descriptions and their output types. The generative model uses the description of each field to decide what to return, in the declared type.
    fr: Un schéma pour les images spécifie les champs, leurs descriptions et leurs types de sortie. Le modèle génératif s'appuie sur la description de chaque champ pour décider quoi renvoyer, dans le type déclaré.
  options:
    a:
      en: The analyzer works from the meaning of the field, not from fixed coordinates in the image.
      fr: L'analyseur travaille à partir du sens du champ, pas à partir de coordonnées fixes dans l'image.
    b:
      en: 'A schema needs no training images: describing the fields is enough to start.'
      fr: 'Un schéma n''a pas besoin d''images d''entraînement : décrire les champs suffit pour commencer.'
    c:
      en: Temperature and token limits are parameters of a chat model request, not properties of a field.
      fr: La température et les limites de jetons sont des paramètres d'une requête à un modèle de conversation, pas des propriétés d'un champ.
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
- title: Content Understanding Glossary
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/glossary
