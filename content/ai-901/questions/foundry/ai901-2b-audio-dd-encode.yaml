id: ai901-2b-audio-dd-encode
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing Python code that prepares a recorded question, stored in a file named **question.wav**, so that it can be sent in a prompt to a deployed `gpt-audio-mini` model.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez du code Python qui prépare une question enregistrée, stockée dans un fichier nommé **question.wav**, afin de l'envoyer dans une invite à un modèle `gpt-audio-mini` déployé.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import base64

    with open("question.wav", "[[mode]]") as audio_file:
        encoded_audio = base64.[[fn]](audio_file.read()).decode("utf-8")

    audio_part = {
        "type": "input_audio",
        "input_audio": {"data": [[val]], "format": "wav"},
    }
  slots:
    - id: mode
      options:
        - { id: r, text: r }
        - { id: rb, text: rb }
        - { id: wb, text: wb }
    - id: fn
      options:
        - { id: decode, text: b64decode }
        - { id: encode, text: b64encode }
        - { id: urlsafe, text: urlsafe_b64decode }
    - id: val
      options:
        - { id: file, text: audio_file }
        - { id: path, text: '"question.wav"' }
        - { id: encoded, text: encoded_audio }
answer:
  values: { mode: rb, fn: encode, val: encoded }
explanation:
  correct:
    en: |
      An audio file is binary, so it is opened for reading in binary mode (`rb`). Its bytes are encoded in base64 with `b64encode` and converted to a string, and that string is the `data` value of the `input_audio` part of the user message.
    fr: |
      Un fichier audio est binaire : il s'ouvre donc en lecture en mode binaire (`rb`). Ses octets sont encodés en base64 avec `b64encode` puis convertis en chaîne, et cette chaîne constitue la valeur `data` de la partie `input_audio` du message utilisateur.
  options:
    r: { en: "r opens the file as text, which fails or corrupts binary audio.", fr: "r ouvre le fichier comme du texte, ce qui échoue ou altère de l'audio binaire." }
    wb: { en: "wb opens the file for writing and erases its content.", fr: "wb ouvre le fichier en écriture et efface son contenu." }
    decode: { en: "b64decode converts base64 back to bytes; it is used on the audio that the model returns, not on the file to send.", fr: "b64decode reconvertit du base64 en octets ; il s'utilise sur l'audio que le modèle renvoie, pas sur le fichier à envoyer." }
    urlsafe: { en: "urlsafe_b64decode also decodes; here the bytes must be encoded.", fr: "urlsafe_b64decode décode lui aussi ; ici, les octets doivent être encodés." }
    file: { en: "A file object can't be placed in the request; the model needs the encoded content.", fr: "Un objet fichier ne peut pas être placé dans la requête ; le modèle a besoin du contenu encodé." }
    path: { en: "The service can't read a file from a local path; the content itself must be sent.", fr: "Le service ne peut pas lire un fichier à partir d'un chemin local ; c'est le contenu lui-même qui doit être envoyé." }
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
