id: ai901-2d-av-yn-basics
objective: "2.4.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to analyze recorded calls by using an audio analyzer of Azure Content Understanding in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'analyser des appels enregistrés à l'aide d'un analyseur audio d'Azure Content Understanding dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: An audio analyzer returns a transcript of the speech in a recording.
      fr: Un analyseur audio renvoie une transcription de la parole d'un enregistrement.
  - id: s2
    text:
      en: An audio analyzer can return a summary of a recorded call as a field.
      fr: Un analyseur audio peut renvoyer le résumé d'un appel enregistré sous forme de champ.
  - id: s3
    text:
      en: To obtain a summary of a recorded call, you must first transcribe the call with another service and submit the text.
      fr: Pour obtenir le résumé d'un appel enregistré, vous devez d'abord transcrire l'appel avec un autre service et envoyer le texte.
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: 'An audio analyzer performs both steps itself: it transcribes the recording, then generates the fields of the schema, such as a summary, from the transcript. You submit the audio file directly.'
    fr: 'Un analyseur audio effectue lui-même les deux étapes : il transcrit l''enregistrement, puis génère les champs du schéma, comme un résumé, à partir de la transcription. Vous envoyez directement le fichier audio.'
references:
- title: Azure Content Understanding in Foundry Tools audio overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview
- title: Extract information from audio and video.
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video
