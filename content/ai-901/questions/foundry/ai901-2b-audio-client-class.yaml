id: ai901-2b-audio-client-class
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You write a Python application that sends a recorded question to a `gpt-audio-mini` model deployed in a Foundry resource and receives the model's answer in the same call.

    Which client object does the application use to send the request?
  fr: |
    Vous écrivez une application Python qui envoie une question enregistrée à un modèle `gpt-audio-mini` déployé dans une ressource Foundry et reçoit la réponse du modèle dans le même appel.

    Quel objet client l'application utilise-t-elle pour envoyer la requête ?
body:
  options:
    - { id: a, text: { en: "`SpeechRecognizer`, from the Speech SDK", fr: "`SpeechRecognizer`, du SDK Speech" } }
    - { id: b, text: { en: "`TextAnalyticsClient`, from the Azure Language SDK", fr: "`TextAnalyticsClient`, du SDK Azure Language" } }
    - { id: c, text: { en: "`SpeechSynthesizer`, from the Speech SDK", fr: "`SpeechSynthesizer`, du SDK Speech" } }
    - { id: d, text: { en: "`AzureOpenAI`, from the `openai` package", fr: "`AzureOpenAI`, du package `openai`" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An audio-enabled model is a generative model: the application calls its deployment with the OpenAI library, here the `AzureOpenAI` client, through `chat.completions.create`. The recording is part of the prompt and the model answers directly.
    fr: |
      Un modèle compatible avec l'audio est un modèle génératif : l'application appelle son déploiement avec la bibliothèque OpenAI, ici le client `AzureOpenAI`, par l'intermédiaire de `chat.completions.create`. L'enregistrement fait partie de l'invite et le modèle répond directement.
  options:
    a:
      en: "`SpeechRecognizer` belongs to Azure Speech and only converts speech to text; it doesn't send a prompt to a generative model."
      fr: "`SpeechRecognizer` appartient à Azure Speech et convertit seulement la parole en texte ; il n'envoie pas d'invite à un modèle génératif."
    b:
      en: "`TextAnalyticsClient` analyzes written text with Azure Language."
      fr: "`TextAnalyticsClient` analyse du texte écrit avec Azure Language."
    c:
      en: "`SpeechSynthesizer` belongs to Azure Speech and converts text to speech."
      fr: "`SpeechSynthesizer` appartient à Azure Speech et convertit du texte en parole."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
