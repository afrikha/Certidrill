id: ai901-2a-sys-persistent-rules
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are building a chat application for Contoso Bikes that uses a generative AI model deployed in Microsoft Foundry.

    In every conversation, the model must act as a support assistant, use a formal tone and decline questions that are not about orders or repairs.

    Where should you define these rules?
  fr: |
    Vous créez pour Contoso Bikes une application de conversation qui utilise un modèle d'IA générative déployé dans Microsoft Foundry.

    Dans chaque conversation, le modèle doit se comporter en assistant du support, employer un ton formel et refuser les questions qui ne portent pas sur les commandes ou les réparations.

    Où devez-vous définir ces règles ?
body:
  options:
    - { id: a, text: { en: "In each user prompt", fr: "Dans chaque invite utilisateur" } }
    - { id: b, text: { en: "In the conversation history", fr: "Dans l'historique de la conversation" } }
    - { id: c, text: { en: "In the system prompt", fr: "Dans l'invite système" } }
    - { id: d, text: { en: "In the temperature parameter", fr: "Dans le paramètre de température" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The system prompt sets the behavior, the tone and the constraints that the model follows during the whole conversation. The application normally sets it once, and the model then answers each user prompt while obeying it.
    fr: |
      L'invite système fixe le comportement, le ton et les contraintes que le modèle suit pendant toute la conversation. C'est normalement l'application qui la définit une fois ; le modèle répond ensuite à chaque invite utilisateur en la respectant.
  options:
    a:
      en: "A user prompt carries the request of one turn. The rules would have to be repeated at every turn, and the customers are the ones who type the user prompts."
      fr: "Une invite utilisateur porte la demande d'un tour. Il faudrait répéter les règles à chaque tour, et ce sont les clients qui saisissent les invites utilisateur."
    b:
      en: "The conversation history is the record of the earlier prompts and responses that gives context to a follow-up question. It is not where an application defines its rules."
      fr: "L'historique de la conversation est la trace des invites et des réponses précédentes, qui donne du contexte à une question de suivi. Ce n'est pas là qu'une application définit ses règles."
    d:
      en: "The temperature controls how creative or deterministic the output is. It can't express a role, a tone or a scope."
      fr: "La température règle le caractère créatif ou déterministe de la sortie. Elle ne peut exprimer ni un rôle, ni un ton, ni un périmètre."
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
