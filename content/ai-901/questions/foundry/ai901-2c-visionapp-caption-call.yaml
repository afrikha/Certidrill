id: ai901-2c-visionapp-caption-call
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Foundry resource has a deployment of GPT-4.1-mini named `vision` and a deployment of GPT-Image-1 named `images`.

    A function of a Python application must return a written caption for a product photo. The `content` variable holds a list with an `input_text` item (`Write a caption for this photo.`) and an `input_image` item (the URL of the photo).

    Which call should the function use?
  fr: |
    Une ressource Foundry contient un déploiement de GPT-4.1-mini nommé `vision` et un déploiement de GPT-Image-1 nommé `images`.

    Une fonction d'une application Python doit renvoyer une légende écrite pour la photo d'un produit. La variable `content` contient une liste avec un élément `input_text` (`Write a caption for this photo.`) et un élément `input_image` (l'URL de la photo).

    Quel appel la fonction doit-elle utiliser ?
body:
  options:
    - id: a
      text: "`client.images.generate(model=\"images\", prompt=\"Write a caption for this photo.\", n=1, size=\"1024x1024\")`"
    - id: b
      text: "`client.responses.create(model=\"images\", input=[{\"role\": \"user\", \"content\": content}])`"
    - id: c
      text: "`client.responses.create(model=\"vision\", input=[{\"role\": \"user\", \"content\": content}])`"
    - id: d
      text: "`client.images.generate(model=\"vision\", prompt=\"Write a caption for this photo.\", n=1, size=\"1024x1024\")`"
answer:
  optionId: c
explanation:
  correct:
    en: |
      A caption is text produced from an image: this is image analysis. The function calls `responses.create()` on the vision-enabled deployment, with a user message that contains the instruction and the photo, and reads the caption from `output_text`. `images.generate()` and the GPT-Image-1 deployment produce images, not text.
    fr: |
      Une légende est un texte produit à partir d'une image : il s'agit d'analyse d'images. La fonction appelle `responses.create()` sur le déploiement compatible avec la vision, avec un message utilisateur qui contient l'instruction et la photo, et lit la légende dans `output_text`. `images.generate()` et le déploiement de GPT-Image-1 produisent des images, pas du texte.
  options:
    a:
      en: "`images.generate()` creates a new image from the prompt; it never sees the photo and returns no caption."
      fr: "`images.generate()` crée une nouvelle image à partir de l'invite ; il ne voit jamais la photo et ne renvoie aucune légende."
    b:
      en: "The `images` deployment is an image-generation model: its output is an image, not a written caption."
      fr: "Le déploiement `images` est un modèle de génération d'images : sa sortie est une image, pas une légende écrite."
    d:
      en: "`images.generate()` requires an image-generation deployment, and it wouldn't return text in any case."
      fr: "`images.generate()` exige un déploiement de génération d'images, et il ne renverrait de toute façon pas de texte."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Azure OpenAI image generation models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e
