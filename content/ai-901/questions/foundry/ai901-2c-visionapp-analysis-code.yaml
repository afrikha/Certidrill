id: ai901-2c-visionapp-analysis-code
objective: "2.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Python application that asks a deployed vision-enabled model what an image shows. The `client` object and the `image_url` variable are already defined.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui demande à un modèle compatible avec la vision déployé ce que montre une image. L'objet `client` et la variable `image_url` sont déjà définis.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = client.responses.create(
        model="my-vision-deployment",
        input=[
            {
                "role": "user",
                "content": [
                    {"type": "[[t1]]", "text": "What is in this image?"},
                    {"type": "[[t2]]", "image_url": image_url},
                ],
            }
        ],
    )
    print(response.output_text)
  slots:
    - id: t1
      options:
        - id: img1
          text: "input_image"
        - id: txt1
          text: "input_text"
        - id: gen1
          text: "image_generation"
    - id: t2
      options:
        - id: call2
          text: "image_generation_call"
        - id: txt2
          text: "input_text"
        - id: img2
          text: "input_image"
answer:
  values:
    t1: txt1
    t2: img2
explanation:
  correct:
    en: |
      The user message contains two content items sent together: an item of type `input_text` that carries the instruction, and an item of type `input_image` whose `image_url` gives the image as a URL or as base64 data. The model processes both and its answer is read from `output_text`.
    fr: |
      Le message utilisateur contient deux éléments de contenu envoyés ensemble : un élément de type `input_text` qui porte l'instruction, et un élément de type `input_image` dont `image_url` fournit l'image sous forme d'URL ou de données base64. Le modèle traite les deux, et sa réponse se lit dans `output_text`.
  options:
    img1:
      en: "An `input_image` item carries an image in `image_url`, not a `text` value."
      fr: "Un élément `input_image` porte une image dans `image_url`, pas une valeur `text`."
    gen1:
      en: "`image_generation` is the type of a tool that creates images; it isn't a content item."
      fr: "`image_generation` est le type d'un outil qui crée des images ; ce n'est pas un élément de contenu."
    call2:
      en: "`image_generation_call` is the type of an output item that contains a generated image."
      fr: "`image_generation_call` est le type d'un élément de sortie qui contient une image générée."
    txt2:
      en: "An `input_text` item carries text in `text`, not an image."
      fr: "Un élément `input_text` porte du texte dans `text`, pas une image."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
