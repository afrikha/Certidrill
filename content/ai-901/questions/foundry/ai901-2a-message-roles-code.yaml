id: ai901-2a-message-roles-code
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A chat client sends two messages to a deployed model. The first message must set the behavior of the model for the request. The second message carries the question that the user typed, which is stored in the `question` variable.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un client de conversation envoie deux messages à un modèle déployé. Le premier message doit fixer le comportement du modèle pour la requête. Le second transporte la question saisie par l'utilisateur, stockée dans la variable `question`.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    response = openai_client.responses.create(
        model="chat-prod",
        input=[
            {"role": "[[r1]]", "content": "You are a tutor. Explain each answer in simple words."},
            {"role": "[[r2]]", "content": question},
        ],
    )
  slots:
    - id: r1
      options:
        - { id: usr, text: "user" }
        - { id: ast, text: "assistant" }
        - { id: sys, text: "system" }
    - id: r2
      options:
        - { id: sys, text: "system" }
        - { id: usr, text: "user" }
        - { id: ast, text: "assistant" }
answer:
  values: { r1: sys, r2: usr }
explanation:
  correct:
    en: |
      In the `input` list, the message with the `system` role is the system prompt: it sets the behavior and the tone of the model. The message with the `user` role is the user prompt: the request to answer.
    fr: |
      Dans la liste `input`, le message de rôle `system` est l'invite système : il fixe le comportement et le ton du modèle. Le message de rôle `user` est l'invite utilisateur : la demande à laquelle répondre.
  options:
    ast:
      en: "The `assistant` role marks a response of the model, for example an earlier turn or a few-shot example."
      fr: "Le rôle `assistant` désigne une réponse du modèle, par exemple un tour précédent ou un exemple few-shot."
references:
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
