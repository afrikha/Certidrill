id: ai901-2d-img-dd-sentence
objective: "2.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: To inspect photos of parts on a production line, you create a custom analyzer whose base analyzer is [[base]]. In its schema, the field `DefectPresent`, which states whether a defect is visible, has the [[type]] type. The value of each field is [[how]].
    fr: Pour inspecter des photos de pièces sur une chaîne de production, vous créez un analyseur personnalisé dont l'analyseur de base est [[base]]. Dans son schéma, le champ `DefectPresent`, qui indique si un défaut est visible, est de type [[type]]. La valeur de chaque champ est [[how]].
  slots:
  - id: base
    options:
    - id: bdoc
      text: '`prebuilt-document`'
    - id: bvid
      text: '`prebuilt-video`'
    - id: bimg
      text: '`prebuilt-image`'
  - id: type
    options:
    - id: tbool
      text: '`boolean`'
    - id: tdate
      text: '`date`'
    - id: tarr
      text: '`array`'
  - id: how
    options:
    - id: ocr
      text:
        en: copied from the image by OCR
        fr: copiée depuis l'image par OCR
    - id: gen
      text:
        en: generated by a generative model from the image
        fr: générée par un modèle génératif à partir de l'image
    - id: man
      text:
        en: typed by a reviewer in the Foundry portal
        fr: saisie par un réviseur dans le portail Foundry
answer:
  values:
    base: bimg
    type: tbool
    how: gen
explanation:
  correct:
    en: A custom analyzer for photos inherits from `prebuilt-image`. A yes/no piece of information is a `boolean` field. For images, a generative model produces the value of each field from what the picture shows.
    fr: Un analyseur personnalisé pour des photos hérite de `prebuilt-image`. Une information de type oui/non est un champ `boolean`. Pour les images, un modèle génératif produit la valeur de chaque champ d'après ce que montre l'image.
  options:
    bdoc:
      en: '`prebuilt-document` is the base for documents, including images that are mostly text.'
      fr: '`prebuilt-document` est la base pour les documents, y compris les images composées surtout de texte.'
    tdate:
      en: A `date` field holds a calendar date, not a yes/no answer.
      fr: Un champ `date` contient une date du calendrier, pas une réponse oui/non.
    tarr:
      en: An `array` field holds a list of values.
      fr: Un champ `array` contient une liste de valeurs.
    ocr:
      en: OCR reads text; a defect on a part isn't text.
      fr: L'OCR lit du texte ; un défaut sur une pièce n'est pas du texte.
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
- title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
