id: ai901-2a-user-prompt-identify
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel agency configures a chat application that is based on a generative AI model. The application handles the following four pieces of text.

    Which text is a user prompt?
  fr: |
    Une agence de voyages configure une application de conversation fondée sur un modèle d'IA générative. L'application manipule les quatre textes suivants.

    Quel texte est une invite utilisateur ?
body:
  options:
    - { id: a, text: { en: "You are a travel assistant. Use a friendly tone.", fr: "Vous êtes un assistant de voyage. Employez un ton amical." } }
    - { id: b, text: { en: "Answer only questions about flights and hotels.", fr: "Ne répondez qu'aux questions sur les vols et les hôtels." } }
    - { id: c, text: { en: "If you don't know the answer, say that you don't know.", fr: "Si vous ne connaissez pas la réponse, dites que vous ne savez pas." } }
    - { id: d, text: { en: "Suggest three hotels near the Lisbon airport for next weekend.", fr: "Proposez trois hôtels près de l'aéroport de Lisbonne pour le week-end prochain." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A user prompt asks for a response to one specific question or instruction, here a list of hotels. The three other texts describe how the model must behave in general, which is the purpose of the system prompt.
    fr: |
      Une invite utilisateur demande une réponse à une question ou à une instruction précise, ici une liste d'hôtels. Les trois autres textes décrivent la façon dont le modèle doit se comporter en général, ce qui est le rôle de l'invite système.
  options:
    a:
      en: "This text gives the model a role and a tone. It belongs in the system prompt."
      fr: "Ce texte donne au modèle un rôle et un ton. Il relève de l'invite système."
    b:
      en: "This text limits the scope of the answers for the whole conversation. It belongs in the system prompt."
      fr: "Ce texte limite le périmètre des réponses pour toute la conversation. Il relève de l'invite système."
    c:
      en: "This text tells the model what to do when it lacks an answer, a rule that applies to every turn. It belongs in the system prompt."
      fr: "Ce texte indique au modèle quoi faire quand il n'a pas de réponse, une règle valable à chaque tour. Il relève de l'invite système."
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
