id: ai901-2d-app-yn-result
objective: "2.4.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    An application analyzes an invoice by using the `prebuilt-invoice` analyzer of Azure Content Understanding in Foundry Tools. The invoice shows the due date as "April 13, 2026". The result contains the following fields.

    ```json
    "fields": {
      "CustomerName": { "type": "string", "valueString": "Contoso Ltd", "confidence": 0.96 },
      "DueDate": { "type": "date", "valueDate": "2026-04-13", "confidence": 0.58 },
      "LineItems": { "type": "array", "valueArray": [ { "type": "object" }, { "type": "object" } ] }
    }
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application analyse une facture à l'aide de l'analyseur `prebuilt-invoice` d'Azure Content Understanding dans Foundry Tools. La facture indique la date d'échéance sous la forme « April 13, 2026 ». Le résultat contient les champs suivants.

    ```json
    "fields": {
      "CustomerName": { "type": "string", "valueString": "Contoso Ltd", "confidence": 0.96 },
      "DueDate": { "type": "date", "valueDate": "2026-04-13", "confidence": 0.58 },
      "LineItems": { "type": "array", "valueArray": [ { "type": "object" }, { "type": "object" } ] }
    }
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: The analyzer is more confident about the name of the customer than about the due date.
      fr: L'analyseur est plus confiant dans le nom du client que dans la date d'échéance.
  - id: s2
    text:
      en: The `LineItems` field holds a collection of items.
      fr: Le champ `LineItems` contient une collection d'éléments.
  - id: s3
    text:
      en: The due date is returned as the text that is printed on the invoice.
      fr: La date d'échéance est renvoyée sous la forme du texte imprimé sur la facture.
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: 'The confidence score estimates the reliability of each value: 0.96 for `CustomerName` against 0.58 for `DueDate`. A field of the `array` type holds a list of items in `valueArray`. Typed values such as dates are normalized to a canonical format: "April 13, 2026" is returned as `2026-04-13` in `valueDate`.'
    fr: 'Le score de confiance estime la fiabilité de chaque valeur : 0.96 pour `CustomerName` contre 0.58 pour `DueDate`. Un champ de type `array` contient une liste d''éléments dans `valueArray`. Les valeurs typées comme les dates sont normalisées dans un format canonique : « April 13, 2026 » est renvoyé sous la forme `2026-04-13` dans `valueDate`.'
references:
- title: 'Quickstart: Azure Content Understanding in Foundry Tools'
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
- title: Azure Content Understanding in Foundry Tools Document Overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/overview
