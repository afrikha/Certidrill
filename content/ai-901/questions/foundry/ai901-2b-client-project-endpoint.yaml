id: ai901-2b-client-project-endpoint
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Python client application that uses `AIProjectClient` to connect to a Foundry project and call an agent.

    Which value should you pass as the `endpoint` argument?
  fr: |
    Vous écrivez une application cliente Python qui utilise `AIProjectClient` pour se connecter à un projet Foundry et appeler un agent.

    Quelle valeur devez-vous passer dans l'argument `endpoint` ?
body:
  options:
    - { id: a, text: { en: "The Azure OpenAI endpoint of the resource, which ends with `/openai/v1/`", fr: "Le point de terminaison Azure OpenAI de la ressource, qui se termine par `/openai/v1/`" } }
    - { id: b, text: { en: "The project endpoint, which ends with `/api/projects/<project-name>`", fr: "Le point de terminaison du projet, qui se termine par `/api/projects/<project-name>`" } }
    - { id: c, text: { en: "The endpoint of the resource in the `cognitiveservices.azure.com` domain", fr: "Le point de terminaison de la ressource dans le domaine `cognitiveservices.azure.com`" } }
    - { id: d, text: { en: "The address of the Foundry portal, `https://ai.azure.com`", fr: "L'adresse du portail Foundry, `https://ai.azure.com`" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `AIProjectClient` connects to a project, so it takes the project endpoint, in the form `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`. The agent is then retrieved from that project by its name.
    fr: |
      `AIProjectClient` se connecte à un projet : il prend donc le point de terminaison du projet, de la forme `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`. L'agent est ensuite récupéré dans ce projet par son nom.
  options:
    a:
      en: "The Azure OpenAI endpoint is the base URL of an `OpenAI` client that calls a model deployment directly; it doesn't identify a project."
      fr: "Le point de terminaison Azure OpenAI est l'URL de base d'un client `OpenAI` qui appelle directement un déploiement de modèle ; il n'identifie pas un projet."
    c:
      en: "That endpoint is used by Foundry Tools SDKs such as the Azure Language SDK, not by the project client."
      fr: "Ce point de terminaison est utilisé par les SDK de Foundry Tools comme le SDK Azure Language, pas par le client de projet."
    d:
      en: "`https://ai.azure.com` is the website where you sign in to the portal, not an API endpoint for client code."
      fr: "`https://ai.azure.com` est le site web sur lequel vous vous connectez au portail, pas un point de terminaison d'API pour du code client."
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
