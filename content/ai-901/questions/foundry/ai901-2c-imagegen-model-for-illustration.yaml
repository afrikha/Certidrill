id: ai901-2c-imagegen-model-for-illustration
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum wants an application that creates an illustration from a description typed by the user.

    Which model should you deploy in Microsoft Foundry?
  fr: |
    Adatum veut une application qui crée une illustration à partir d'une description saisie par l'utilisateur.

    Quel modèle devez-vous déployer dans Microsoft Foundry ?
body:
  options:
    - id: a
      text: "GPT-Image-2"
    - id: b
      text: "GPT-4.1"
    - id: c
      text: "text-embedding-3-small"
    - id: d
      text: "Sora 2"
answer:
  optionId: a
explanation:
  correct:
    en: |
      GPT-Image-2 is a generally available image-generation model: it takes a text description and produces an image that corresponds to it. This text-to-image task is the reverse of image analysis.
    fr: |
      GPT-Image-2 est un modèle de génération d'images en disponibilité générale : il reçoit une description en texte et produit une image qui lui correspond. Cette tâche de texte vers image est l'inverse de l'analyse d'images.
  options:
    b:
      en: "GPT-4.1 is a vision-enabled chat model: it interprets images and answers in text, but it doesn't create illustrations."
      fr: "GPT-4.1 est un modèle de conversation compatible avec la vision : il interprète des images et répond en texte, mais il ne crée pas d'illustrations."
    c:
      en: "An embedding model returns numeric vectors, not images."
      fr: "Un modèle d'embedding renvoie des vecteurs numériques, pas des images."
    d:
      en: "Sora 2 generates videos, not still illustrations."
      fr: "Sora 2 génère des vidéos, pas des illustrations fixes."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Azure OpenAI image generation models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e
