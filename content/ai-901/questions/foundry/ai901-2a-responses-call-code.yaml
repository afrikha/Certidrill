id: ai901-2a-responses-call-code
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A Python script has created an `AIProjectClient` object named `project`. The script must send a prompt to the deployment named **chat-prod** and print the text that the model generates.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un script Python a créé un objet `AIProjectClient` nommé `project`. Le script doit envoyer une invite au déploiement nommé **chat-prod** et afficher le texte que le modèle génère.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    openai_client = project.[[get]]()

    response = openai_client.[[api]].create(
        model="chat-prod",
        input="Suggest a name for a hiking club.",
    )
    print(response.[[out]])
  slots:
    - id: get
      options:
        - { id: ag, text: "agents.get" }
        - { id: goc, text: "get_openai_client" }
        - { id: cv, text: "agents.create_version" }
    - id: api
      options:
        - { id: conv, text: "conversations" }
        - { id: emb, text: "embeddings" }
        - { id: resp, text: "responses" }
    - id: out
      options:
        - { id: id, text: "id" }
        - { id: txt, text: "output_text" }
        - { id: st, text: "status" }
answer:
  values: { get: goc, api: resp, out: txt }
explanation:
  correct:
    en: |
      `project.get_openai_client()` returns the OpenAI-compatible client. `responses.create` sends the prompt to the deployment through the Responses API, and `response.output_text` contains the text that the model generated.
    fr: |
      `project.get_openai_client()` renvoie le client compatible OpenAI. `responses.create` envoie l'invite au déploiement via l'API Responses, et `response.output_text` contient le texte généré par le modèle.
  options:
    ag:
      en: "`agents.get` retrieves an existing agent by its name. It doesn't return a client that calls models."
      fr: "`agents.get` récupère un agent existant par son nom. Il ne renvoie pas un client qui appelle des modèles."
    cv:
      en: "`agents.create_version` creates an agent or a new version of it."
      fr: "`agents.create_version` crée un agent ou une nouvelle version de celui-ci."
    conv:
      en: "`conversations.create` creates a conversation object for multi-turn chat. It doesn't take a prompt and generate a response."
      fr: "`conversations.create` crée un objet conversation pour un dialogue à plusieurs tours. Il ne reçoit pas une invite pour générer une réponse."
    emb:
      en: "`embeddings` produces vector representations of text, not a chat response."
      fr: "`embeddings` produit des représentations vectorielles de texte, pas une réponse de conversation."
    id:
      en: "`id` is the identifier of the response."
      fr: "`id` est l'identifiant de la réponse."
    st:
      en: "`status` indicates the state of the response, such as `completed`."
      fr: "`status` indique l'état de la réponse, par exemple `completed`."
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: "Microsoft Foundry SDKs and endpoints"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview
