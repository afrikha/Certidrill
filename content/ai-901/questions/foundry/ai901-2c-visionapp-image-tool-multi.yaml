id: ai901-2c-visionapp-image-tool-multi
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A Python application must generate an image by calling `client.responses.create()` with a prompt such as `A flat illustration of a lighthouse`.

    Which two things must the code do to obtain the image? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python doit générer une image en appelant `client.responses.create()` avec une invite comme `A flat illustration of a lighthouse`.

    Quelles sont les deux opérations que le code doit effectuer pour obtenir l'image ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add a tool of type `image_generation` to the request."
        fr: "Ajouter à la requête un outil de type `image_generation`."
    - id: b
      text:
        en: "Read the image from the `output_text` property of the response."
        fr: "Lire l'image dans la propriété `output_text` de la réponse."
    - id: c
      text:
        en: "Add a content item of type `input_image` to the user message."
        fr: "Ajouter au message utilisateur un élément de contenu de type `input_image`."
    - id: d
      text:
        en: "Read the base64 image from the output item of type `image_generation_call`."
        fr: "Lire l'image base64 dans l'élément de sortie de type `image_generation_call`."
    - id: e
      text:
        en: "Decode the prompt with `base64.b64decode()` before it is sent."
        fr: "Décoder l'invite avec `base64.b64decode()` avant son envoi."
answer:
  optionIds: [a, d]
explanation:
  correct:
    en: |
      With the Responses API, image generation is a tool: the request passes `tools=[{"type": "image_generation"}]` along with the prompt. The generated image doesn't come back as text; it is the base64 `result` of the output item whose type is `image_generation_call`, which the code decodes and saves.
    fr: |
      Avec l'API Responses, la génération d'images est un outil : la requête transmet `tools=[{"type": "image_generation"}]` avec l'invite. L'image générée ne revient pas sous forme de texte ; c'est le `result` en base64 de l'élément de sortie dont le type est `image_generation_call`, que le code décode et enregistre.
  options:
    b:
      en: "`output_text` contains the text answer of the model, not the generated image."
      fr: "`output_text` contient la réponse en texte du modèle, pas l'image générée."
    c:
      en: "An `input_image` item sends an existing image to analyze; none is needed to create an image from a description."
      fr: "Un élément `input_image` envoie une image existante à analyser ; il n'en faut pas pour créer une image à partir d'une description."
    e:
      en: "The prompt is plain text; base64 decoding applies to the image that is returned."
      fr: "L'invite est du texte brut ; le décodage base64 s'applique à l'image renvoyée."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
