id: ai901-2b-agent-hot-configuration
objective: "2.1.4"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You review an agent named **trip-planner** in the agents playground of the Foundry portal. Its configuration is shown in the following table.

    Answer each prompt by selecting the setting that you should change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez un agent nommé **trip-planner** dans le terrain de jeu des agents du portail Foundry. Sa configuration figure dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The agent must always answer in a formal tone, in three sentences at most.", fr: "L'agent doit toujours répondre sur un ton formel, en trois phrases au maximum." }
    - id: p2
      text: { en: "The agent must be able to run Python code to calculate the budget of a trip.", fr: "L'agent doit pouvoir exécuter du code Python pour calculer le budget d'un voyage." }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Current value", fr: "Valeur actuelle" }]
    rows:
      - [{ text: { en: "Model", fr: "Modèle" }, area: model }, { text: "gpt-5-mini" }]
      - [{ text: "Instructions", area: instructions }, { text: { en: "You are a travel assistant. Answer in a friendly tone.", fr: "You are a travel assistant. Answer in a friendly tone." } }]
      - [{ text: { en: "Tools", fr: "Outils" }, area: tools }, { text: "Web search" }]
      - [{ text: { en: "Knowledge", fr: "Connaissances" }, area: knowledge }, { text: "hotel-catalog.pdf" }]
answer:
  values: { p1: instructions, p2: tools }
explanation:
  correct:
    en: |
      Tone and length are rules of behavior, so they are set in the instructions, the system prompt of the agent. Running Python code is an action: it requires the Code interpreter tool, which is added to the tools. The model and the knowledge file aren't concerned by either requirement.
    fr: |
      Le ton et la longueur sont des règles de comportement : ils se définissent donc dans les instructions, l'invite système de l'agent. L'exécution de code Python est une action : elle demande l'outil Code interpreter, qui s'ajoute aux outils. Ni le modèle ni le fichier de connaissances ne sont concernés par ces deux exigences.
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
