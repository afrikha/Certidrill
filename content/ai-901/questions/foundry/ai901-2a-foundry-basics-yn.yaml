id: ai901-2a-foundry-basics-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A Foundry resource can contain more than one Foundry project.", fr: "Une ressource Foundry peut contenir plusieurs projets Foundry." } }
    - { id: s2, text: { en: "The Foundry portal is a command-line tool that you install on your computer.", fr: "Le portail Foundry est un outil en ligne de commande que vous installez sur votre ordinateur." } }
    - { id: s3, text: { en: "A Foundry project contains one or more Foundry resources.", fr: "Un projet Foundry contient une ou plusieurs ressources Foundry." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A Foundry resource is the Azure resource that provides the platform capabilities, and a project is a workspace inside it; one resource can hold many projects, for example one per AI use case. The Foundry portal is a web-based interface in which you discover models, deploy them and test them. The containment goes one way only: projects sit inside a resource, never the reverse.
    fr: |
      Une ressource Foundry est la ressource Azure qui fournit les capacités de la plateforme, et un projet est un espace de travail qu'elle contient ; une ressource peut contenir de nombreux projets, par exemple un par cas d'usage d'IA. Le portail Foundry est une interface web dans laquelle vous découvrez des modèles, les déployez et les testez. L'inclusion ne va que dans un sens : les projets se trouvent dans une ressource, jamais l'inverse.
references:
  - title: "Microsoft Foundry for AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/4-microsoft-foundry
