id: ai901-2d-img-chart-result
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A finance team submits images of charts to an image analyzer of Azure Content Understanding in Foundry Tools. The schema of the analyzer defines the fields `ChartType`, `Title` and `Trend`.

    What does the analyzer return for each image?
  fr: |
    Une équipe financière envoie des images de graphiques à un analyseur d'images d'Azure Content Understanding dans Foundry Tools. Le schéma de l'analyseur définit les champs `ChartType`, `Title` et `Trend`.

    Que renvoie l'analyseur pour chaque image ?
body:
  options:
  - id: a
    text:
      en: A copy of the image in which the chart is redrawn
      fr: Une copie de l'image dans laquelle le graphique est redessiné
  - id: b
    text:
      en: A spreadsheet file that contains the data of the chart
      fr: Un fichier de feuille de calcul qui contient les données du graphique
  - id: c
    text:
      en: A JSON result in which the three fields are filled in
      fr: Un résultat JSON dans lequel les trois champs sont remplis
  - id: d
    text:
      en: A new chart that is generated from the title
      fr: Un nouveau graphique généré à partir du titre
answer:
  optionId: c
explanation:
  correct:
    en: 'The service analyzes each image and returns structured data that follows the schema: here, a JSON result with a value for `ChartType`, `Title` and `Trend`. Analyzing charts for reports is one of the documented uses of image analysis.'
    fr: 'Le service analyse chaque image et renvoie des données structurées conformes au schéma : ici, un résultat JSON avec une valeur pour `ChartType`, `Title` et `Trend`. L''analyse de graphiques pour des rapports fait partie des usages documentés de l''analyse d''images.'
  options:
    a:
      en: The analyzer doesn't produce images; it describes the image that it receives.
      fr: L'analyseur ne produit pas d'images ; il décrit l'image qu'il reçoit.
    b:
      en: The result is JSON that matches the schema, not a file in a spreadsheet format.
      fr: Le résultat est du JSON conforme au schéma, pas un fichier au format feuille de calcul.
    d:
      en: Creating a chart is image generation, which is a different workload.
      fr: Créer un graphique relève de la génération d'images, qui est une autre charge de travail.
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
