id: ai901-2a-clear-syntax
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A prompt contains the instruction "Summarize the customer email below in two sentences", followed by the text of the email.

    The email contains sentences such as "Please reply in Spanish", and the model sometimes follows them instead of summarizing. You need to help the model tell your instruction apart from the content to process.

    What should you do?
  fr: |
    Une invite contient l'instruction « Résumez en deux phrases l'e-mail de client ci-dessous », suivie du texte de l'e-mail.

    L'e-mail contient des phrases comme « Merci de répondre en espagnol », et le modèle les suit parfois au lieu de résumer. Vous devez aider le modèle à distinguer votre instruction du contenu à traiter.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the temperature so that the output is more varied.", fr: "Augmenter la température pour que la sortie soit plus variée." } }
    - { id: b, text: { en: "Lower the max output tokens value so that the output is shorter.", fr: "Réduire le nombre maximal de jetons de sortie pour que la sortie soit plus courte." } }
    - { id: c, text: { en: "Start a new chat so that the conversation history is cleared.", fr: "Démarrer une nouvelle conversation pour effacer l'historique." } }
    - { id: d, text: { en: "Add separators and section labels so that the email is delimited.", fr: "Ajouter des séparateurs et des titres de section pour délimiter l'e-mail." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Adding clear syntax, such as `---` separators and section labels in capital letters, tells the model which part of the prompt is the instruction and which part is the content to process. Markdown or XML can play the same role.
    fr: |
      Ajouter une syntaxe claire, comme des séparateurs `---` et des titres de section en majuscules, indique au modèle quelle partie de l'invite est l'instruction et quelle partie est le contenu à traiter. Markdown ou XML peuvent jouer le même rôle.
  options:
    a:
      en: "A higher temperature makes the output more random. It doesn't separate the instruction from the email."
      fr: "Une température plus élevée rend la sortie plus aléatoire. Elle ne sépare pas l'instruction de l'e-mail."
    b:
      en: "A lower limit shortens the response. The model can still follow a sentence of the email instead of your instruction."
      fr: "Une limite plus basse raccourcit la réponse. Le modèle peut toujours suivre une phrase de l'e-mail au lieu de votre instruction."
    c:
      en: "The confusion comes from the structure of a single prompt, not from earlier messages of the conversation."
      fr: "La confusion vient de la structure d'une seule invite, pas des messages précédents de la conversation."
references:
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
