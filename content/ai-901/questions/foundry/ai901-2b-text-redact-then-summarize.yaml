id: ai901-2b-text-redact-then-summarize
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank builds a Python application that summarizes customer e-mails with a deployed general-purpose model. Names, phone numbers and addresses must be removed before any text is sent to the model.

    In the code, `language_client` is a `TextAnalyticsClient` object and `openai_client` is an `OpenAI` object.

    Which sequence of calls should the application use for each e-mail?
  fr: |
    Woodgrove Bank crée une application Python qui résume des e-mails de clients avec un modèle à usage général déployé. Les noms, les numéros de téléphone et les adresses doivent être retirés avant tout envoi de texte au modèle.

    Dans le code, `language_client` est un objet `TextAnalyticsClient` et `openai_client` est un objet `OpenAI`.

    Quelle séquence d'appels l'application doit-elle utiliser pour chaque e-mail ?
body:
  options:
    - { id: a, text: { en: "`language_client.detect_language`, then `openai_client.responses.create` with the `iso6391_name` value", fr: "`language_client.detect_language`, puis `openai_client.responses.create` avec la valeur `iso6391_name`" } }
    - { id: b, text: { en: "`openai_client.responses.create`, then `language_client.recognize_pii_entities` on the summary", fr: "`openai_client.responses.create`, puis `language_client.recognize_pii_entities` sur le résumé" } }
    - { id: c, text: { en: "`language_client.recognize_pii_entities`, then `openai_client.responses.create` with the `redacted_text` value", fr: "`language_client.recognize_pii_entities`, puis `openai_client.responses.create` avec la valeur `redacted_text`" } }
    - { id: d, text: { en: "`language_client.recognize_pii_entities`, then `openai_client.responses.create` with the `entities` list", fr: "`language_client.recognize_pii_entities`, puis `openai_client.responses.create` avec la liste `entities`" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `recognize_pii_entities` detects personal data and returns `redacted_text`, a version of the e-mail in which that data is masked. Sending this redacted text in the prompt of `responses.create` lets the model summarize the e-mail without ever receiving the personal data.
    fr: |
      `recognize_pii_entities` détecte les données personnelles et renvoie `redacted_text`, une version de l'e-mail dans laquelle ces données sont masquées. Envoyer ce texte masqué dans l'invite de `responses.create` permet au modèle de résumer l'e-mail sans jamais recevoir les données personnelles.
  options:
    a:
      en: "Language detection returns a language code; it removes nothing, and the code alone can't be summarized."
      fr: "La détection de langue renvoie un code de langue ; elle ne retire rien, et le code seul ne peut pas être résumé."
    b:
      en: "The model would receive the full e-mail first, which the requirement forbids."
      fr: "Le modèle recevrait d'abord l'e-mail complet, ce que l'exigence interdit."
    d:
      en: "The `entities` list contains the detected personal data itself, exactly what must not reach the model."
      fr: "La liste `entities` contient justement les données personnelles détectées, exactement ce qui ne doit pas atteindre le modèle."
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
  - title: What is the Personally Identifiable Information (PII) detection feature in Azure Language?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
