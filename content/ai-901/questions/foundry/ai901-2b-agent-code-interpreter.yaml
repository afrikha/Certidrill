id: ai901-2b-agent-code-interpreter
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The users of an agent attach a CSV file of monthly sales and ask the agent to calculate the average per region and to draw a bar chart of the result.

    Which tool should you add to the agent in the Foundry portal?
  fr: |
    Les utilisateurs d'un agent joignent un fichier CSV de ventes mensuelles et demandent à l'agent de calculer la moyenne par région et de tracer un graphique à barres du résultat.

    Quel outil devez-vous ajouter à l'agent dans le portail Foundry ?
body:
  options:
    - { id: a, text: "File search" }
    - { id: b, text: "Web search" }
    - { id: c, text: "Code interpreter" }
    - { id: d, text: "Azure Language in Foundry Tools" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Code interpreter lets the agent write and run Python code in a sandboxed environment. It is the tool for data analysis, math and chart generation on files such as CSV files.
    fr: |
      Code interpreter permet à l'agent d'écrire et d'exécuter du code Python dans un environnement de bac à sable. C'est l'outil prévu pour l'analyse de données, les calculs et la génération de graphiques à partir de fichiers tels que des fichiers CSV.
  options:
    a:
      en: "File search retrieves passages of documents to ground an answer; it doesn't run calculations or draw charts."
      fr: "File search récupère des passages de documents pour ancrer une réponse ; il n'exécute pas de calculs et ne trace pas de graphiques."
    b:
      en: "Web search brings public web information into the answer; it doesn't process the uploaded file."
      fr: "Web search apporte des informations publiques du web dans la réponse ; il ne traite pas le fichier chargé."
    d:
      en: "Azure Language analyzes text, for example to detect a language or personal data; it doesn't compute statistics or produce charts."
      fr: "Azure Language analyse du texte, par exemple pour détecter une langue ou des données personnelles ; il ne calcule pas de statistiques et ne produit pas de graphiques."
references:
  - title: Use Code Interpreter with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/code-interpreter
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
