id: ai901-2a-history-rag-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Including the conversation history in a prompt lets the model interpret a follow-up question in context.", fr: "Inclure l'historique de la conversation dans une invite permet au modèle d'interpréter une question de suivi dans son contexte." } }
    - { id: s2, text: { en: "A response is grounded when it is based on information that was supplied in the prompt.", fr: "Une réponse est ancrée lorsqu'elle s'appuie sur des informations fournies dans l'invite." } }
    - { id: s3, text: { en: "With retrieval augmented generation (RAG), the model is retrained on the retrieved documents before it answers.", fr: "Avec la génération augmentée par récupération (RAG), le modèle est réentraîné sur les documents récupérés avant de répondre." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Generative AI applications keep track of the conversation history and include it in the subsequent prompts, which gives the model the context of a follow-up question. RAG retrieves information such as documents and adds it to the prompt; the model is not retrained. Its response is then grounded in the information provided.
    fr: |
      Les applications d'IA générative conservent l'historique de la conversation et l'incluent dans les invites suivantes, ce qui donne au modèle le contexte d'une question de suivi. La RAG récupère des informations, comme des documents, et les ajoute à l'invite ; le modèle n'est pas réentraîné. Sa réponse est alors ancrée dans les informations fournies.
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
