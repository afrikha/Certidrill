id: ai901-2d-app-order-steps
objective: "2.4.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You write a Python application that extracts the fields of supplier invoices by using the `prebuilt-invoice` analyzer of Azure Content Understanding in Foundry Tools. The SDK package is already installed.

    Which four actions should the code perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous écrivez une application Python qui extrait les champs de factures fournisseurs à l'aide de l'analyseur `prebuilt-invoice` d'Azure Content Understanding dans Foundry Tools. Le package du SDK est déjà installé.

    Quelles sont les quatre actions que le code doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
  - id: read
    text:
      en: Read the fields of each item of `contents`.
      fr: Lire les champs de chaque élément de `contents`.
  - id: custom
    text:
      en: Create a custom analyzer whose schema lists the invoice fields.
      fr: Créer un analyseur personnalisé dont le schéma répertorie les champs de facture.
  - id: begin
    text:
      en: Call `begin_analyze` with `prebuilt-invoice` and the URL of the invoice.
      fr: Appeler `begin_analyze` avec `prebuilt-invoice` et l'URL de la facture.
  - id: train
    text:
      en: Train the `prebuilt-invoice` analyzer with sample invoices.
      fr: Entraîner l'analyseur `prebuilt-invoice` avec des exemples de factures.
  - id: client
    text:
      en: Create a `ContentUnderstandingClient` object with the endpoint and a credential.
      fr: Créer un objet `ContentUnderstandingClient` avec le point de terminaison et des informations d'identification.
  - id: wait
    text:
      en: Call `result()` on the poller that is returned.
      fr: Appeler `result()` sur le poller renvoyé.
  - id: deploy
    text:
      en: Deploy an image-generation model in the Foundry resource.
      fr: Déployer un modèle de génération d'images dans la ressource Foundry.
answer:
  sequence:
  - client
  - begin
  - wait
  - read
explanation:
  correct:
    en: The code first creates the client, then starts the analysis with `begin_analyze`, which returns a poller. Calling `result()` on the poller waits for the end of the asynchronous analysis; the fields are then read from the items of `contents`.
    fr: Le code crée d'abord le client, puis démarre l'analyse avec `begin_analyze`, qui renvoie un poller. L'appel de `result()` sur le poller attend la fin de l'analyse asynchrone ; les champs se lisent ensuite dans les éléments de `contents`.
  options:
    custom:
      en: '`prebuilt-invoice` already contains the schema of an invoice; a custom analyzer isn''t needed.'
      fr: '`prebuilt-invoice` contient déjà le schéma d''une facture ; un analyseur personnalisé est inutile.'
    train:
      en: A prebuilt analyzer is ready to use; it isn't trained by the application.
      fr: Un analyseur prédéfini est prêt à l'emploi ; l'application ne l'entraîne pas.
    deploy:
      en: An image-generation model creates images; it plays no role in extracting invoice fields.
      fr: Un modèle de génération d'images crée des images ; il ne joue aucun rôle dans l'extraction des champs de facture.
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
