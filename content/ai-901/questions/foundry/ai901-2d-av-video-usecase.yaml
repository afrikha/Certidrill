id: ai901-2d-av-video-usecase
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: Which scenario is a use of video analysis in Azure Content Understanding in Foundry Tools?
  fr: Quel scénario est un usage de l'analyse vidéo dans Azure Content Understanding dans Foundry Tools ?
body:
  options:
  - id: a
    text:
      en: Producing a spoken version of the written articles of a magazine
      fr: Produire une version parlée des articles écrits d'un magazine
  - id: b
    text:
      en: Generating a short video clip for an advert from a text prompt
      fr: Générer un court clip vidéo publicitaire à partir d'une invite textuelle
  - id: c
    text:
      en: Finding the moments of recorded lectures in which a topic is discussed
      fr: Retrouver les moments de cours enregistrés où un sujet donné est abordé
  - id: d
    text:
      en: Extracting the totals from the scanned sales receipts of employees
      fr: Extraire les totaux des tickets de caisse numérisés des employés
answer:
  optionId: c
explanation:
  correct:
    en: Video analysis turns recordings into transcripts, segments and descriptions that can be indexed. Indexing lectures to retrieve specific moments is one of its documented uses, in education and e-learning.
    fr: L'analyse vidéo transforme des enregistrements en transcriptions, en segments et en descriptions qui peuvent être indexés. Indexer des cours pour retrouver des moments précis fait partie de ses usages documentés, dans l'enseignement et la formation en ligne.
  options:
    a:
      en: Producing speech from text is speech synthesis.
      fr: Produire de la parole à partir de texte relève de la synthèse vocale.
    b:
      en: Creating a video from a prompt is content generation, not information extraction.
      fr: Créer une vidéo à partir d'une invite relève de la génération de contenu, pas de l'extraction d'informations.
    d:
      en: 'Receipts are documents: they go to a document analyzer such as `prebuilt-receipt`.'
      fr: 'Les tickets de caisse sont des documents : ils relèvent d''un analyseur de documents comme `prebuilt-receipt`.'
references:
- title: Azure Content Understanding in Foundry Tools video overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
