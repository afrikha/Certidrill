id: ai901-2a-system-prompt-elements
objective: "2.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You write the system prompt of a support assistant for Wingtip Toys.

    Which two elements should you include in the system prompt? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous rédigez l'invite système d'un assistant de support pour Wingtip Toys.

    Quels sont les deux éléments à inclure dans l'invite système ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The order number that a customer gives during a chat", fr: "Le numéro de commande qu'un client donne pendant une conversation" } }
    - { id: b, text: { en: "The role that the assistant plays", fr: "Le rôle que joue l'assistant" } }
    - { id: c, text: { en: "The question that a customer asks in the current turn", fr: "La question qu'un client pose dans le tour en cours" } }
    - { id: d, text: { en: "The topics that the assistant must decline", fr: "Les sujets que l'assistant doit refuser" } }
    - { id: e, text: { en: "The text of the response that the model has just generated", fr: "Le texte de la réponse que le modèle vient de générer" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      A system prompt starts with the job of the assistant, that is its role and the expected outcome, and it defines the boundaries: the topics, actions or content to avoid. These rules stay the same from one conversation to the next.
    fr: |
      Une invite système commence par la mission de l'assistant, c'est-à-dire son rôle et le résultat attendu, et elle définit les limites : les sujets, les actions ou les contenus à éviter. Ces règles restent les mêmes d'une conversation à l'autre.
  options:
    a:
      en: "An order number is a piece of data of one conversation. It arrives in a user prompt."
      fr: "Un numéro de commande est une donnée d'une conversation particulière. Il arrive dans une invite utilisateur."
    c:
      en: "The question of the customer is the user prompt itself."
      fr: "La question du client est l'invite utilisateur elle-même."
    e:
      en: "A generated response is a completion. It becomes part of the conversation history, not of the system prompt."
      fr: "Une réponse générée est une complétion. Elle rejoint l'historique de la conversation, pas l'invite système."
references:
  - title: "System message design"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/advanced-prompt-engineering
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
