id: ai901-2d-app-client-class
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python application must submit a scanned receipt to an analyzer of Azure Content Understanding in Foundry Tools.

    Which class should the application instantiate?
  fr: |
    Une application Python doit envoyer un reçu numérisé à un analyseur d'Azure Content Understanding dans Foundry Tools.

    Quelle classe l'application doit-elle instancier ?
body:
  options:
  - id: a
    text: '`ContentUnderstandingClient`'
  - id: b
    text: '`AIProjectClient`'
  - id: c
    text: '`TextAnalyticsClient`'
  - id: d
    text: '`DocumentIntelligenceClient`'
answer:
  optionId: a
explanation:
  correct:
    en: '`ContentUnderstandingClient` is the client of the Content Understanding SDK. It is created with the endpoint of the Foundry resource and a credential, and its `begin_analyze` method submits content to an analyzer.'
    fr: '`ContentUnderstandingClient` est le client du SDK Content Understanding. Il se crée avec le point de terminaison de la ressource Foundry et des informations d''identification, et sa méthode `begin_analyze` envoie du contenu à un analyseur.'
  options:
    b:
      en: '`AIProjectClient` connects to a Foundry project to use models and agents.'
      fr: '`AIProjectClient` se connecte à un projet Foundry pour utiliser des modèles et des agents.'
    c:
      en: '`TextAnalyticsClient` analyzes text that you already have, for example its sentiment.'
      fr: '`TextAnalyticsClient` analyse du texte dont vous disposez déjà, par exemple son sentiment.'
    d:
      en: '`DocumentIntelligenceClient` is the client of Azure Document Intelligence, a different service with its own models.'
      fr: '`DocumentIntelligenceClient` est le client d''Azure Document Intelligence, un autre service doté de ses propres modèles.'
references:
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
