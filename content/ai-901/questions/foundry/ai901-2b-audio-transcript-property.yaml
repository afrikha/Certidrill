id: ai901-2b-audio-transcript-property
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application requests a spoken answer from a deployed `gpt-audio-mini` model with `modalities=["text", "audio"]`. The response is stored in `completion`.

    The application must display the words of the spoken answer as a caption on the screen.

    Which expression should the application use?
  fr: |
    Une application demande une réponse parlée à un modèle `gpt-audio-mini` déployé avec `modalities=["text", "audio"]`. La réponse est stockée dans `completion`.

    L'application doit afficher à l'écran, sous forme de sous-titre, les mots de la réponse parlée.

    Quelle expression l'application doit-elle utiliser ?
body:
  options:
    - { id: a, text: "`completion.choices[0].message.audio.data`" }
    - { id: b, text: "`completion.choices[0].message.audio.transcript`" }
    - { id: c, text: "`completion.choices[0].message.audio.id`" }
    - { id: d, text: "`completion.choices[0].finish_reason`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the model answers with audio, the `audio` object of the message carries the spoken answer and its text: `transcript` is the text of what is said, ready to be displayed.
    fr: |
      Quand le modèle répond en audio, l'objet `audio` du message porte la réponse parlée et son texte : `transcript` est le texte de ce qui est dit, prêt à être affiché.
  options:
    a:
      en: "`data` is the audio itself, encoded in base64; it must be decoded and played or saved, and it can't be read as words."
      fr: "`data` est l'audio lui-même, encodé en base64 ; il doit être décodé puis lu ou enregistré, et ne peut pas être lu comme des mots."
    c:
      en: "`id` identifies the audio answer, so that a later request can reference it in the conversation history."
      fr: "`id` identifie la réponse audio, pour qu'une requête ultérieure puisse la référencer dans l'historique de la conversation."
    d:
      en: "`finish_reason` tells why the generation stopped."
      fr: "`finish_reason` indique pourquoi la génération s'est arrêtée."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
