id: ai901-2b-text-summarize-followup
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python application must summarize long customer reviews in one short paragraph, and then let the user ask free-form follow-up questions about each review in the same conversation.

    What should the application call?
  fr: |
    Une application Python doit résumer de longs avis clients en un court paragraphe, puis permettre à l'utilisateur de poser librement des questions de suivi sur chaque avis dans la même conversation.

    Que doit appeler l'application ?
body:
  options:
    - { id: a, text: { en: "The language detection feature of Azure Language", fr: "La fonctionnalité de détection de langue d'Azure Language" } }
    - { id: b, text: { en: "The PII detection feature of Azure Language", fr: "La fonctionnalité de détection des PII d'Azure Language" } }
    - { id: c, text: { en: "The speech to text API of Azure Speech", fr: "L'API de reconnaissance vocale d'Azure Speech" } }
    - { id: d, text: { en: "A general-purpose model, through the Responses API", fr: "Un modèle à usage général, par l'intermédiaire de l'API Responses" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A general-purpose model summarizes text and answers questions about a passage from a simple prompt, and several tasks can be combined in one conversation. The Responses API suits this flexible, conversational analysis that needs no fixed structured output.
    fr: |
      Un modèle à usage général résume un texte et répond à des questions sur un passage à partir d'une simple invite, et plusieurs tâches peuvent être combinées dans une même conversation. L'API Responses convient à cette analyse souple et conversationnelle, qui ne demande pas de sortie structurée fixe.
  options:
    a:
      en: "Language detection only identifies the language of a text."
      fr: "La détection de langue identifie seulement la langue d'un texte."
    b:
      en: "PII detection finds and masks personal data; it doesn't summarize or answer questions."
      fr: "La détection des PII trouve et masque des données personnelles ; elle ne résume pas et ne répond pas à des questions."
    c:
      en: "Speech to text transcribes audio; the reviews are written text."
      fr: "La reconnaissance vocale transcrit de l'audio ; les avis sont du texte écrit."
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
