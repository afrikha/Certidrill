id: ai901-2b-agent-order-create-test
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that contains no Microsoft Foundry resources. You need to build an agent in the Foundry portal that can search the web, and then check how it behaves.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un abonnement Azure qui ne contient aucune ressource Microsoft Foundry. Vous devez créer dans le portail Foundry un agent capable de chercher sur le web, puis vérifier son comportement.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: test, text: { en: "Send test prompts to the agent in the agents playground.", fr: "Envoyer des invites de test à l'agent dans le terrain de jeu des agents." } }
    - { id: bing, text: { en: "Create a Bing resource in the Azure portal.", fr: "Créer une ressource Bing dans le portail Azure." } }
    - { id: deploy, text: { en: "Deploy a model from the model catalog.", fr: "Déployer un modèle à partir du catalogue de modèles." } }
    - { id: save, text: { en: "In the model playground, write the instructions, add the Web search tool and select **Save as agent**.", fr: "Dans le terrain de jeu de modèles, écrire les instructions, ajouter l'outil Web search et sélectionner **Save as agent**." } }
    - { id: tune, text: { en: "Fine-tune the model with sample conversations.", fr: "Effectuer un réglage fin du modèle avec des exemples de conversations." } }
    - { id: project, text: { en: "Create a Foundry project.", fr: "Créer un projet Foundry." } }
answer:
  sequence: [ project, deploy, save, test ]
explanation:
  correct:
    en: |
      A model is deployed in a project, so the project comes first. The model playground opens once the model is deployed: there you write the instructions, add the tool and save the configuration as an agent. The agent then opens in the agents playground, where you test it.
    fr: |
      Un modèle se déploie dans un projet : le projet vient donc en premier. Le terrain de jeu de modèles s'ouvre une fois le modèle déployé : vous y écrivez les instructions, ajoutez l'outil et enregistrez la configuration en tant qu'agent. L'agent s'ouvre alors dans le terrain de jeu des agents, où vous le testez.
  options:
    bing: { en: "General web search needs no separate Bing resource.", fr: "La recherche web générale ne demande pas de ressource Bing distincte." }
    tune: { en: "An agent uses a deployed model as it is; instructions and tools shape its behavior, without any training.", fr: "Un agent utilise un modèle déployé tel quel ; les instructions et les outils façonnent son comportement, sans aucun entraînement." }
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
