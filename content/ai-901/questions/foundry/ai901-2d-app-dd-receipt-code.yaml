id: ai901-2d-app-dd-receipt-code
objective: "2.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You write a Python application that extracts the merchant, the date and the total from scanned sales receipts by using Azure Content Understanding in Foundry Tools. The application authenticates with a key.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui extrait le commerçant, la date et le total de tickets de caisse numérisés à l'aide d'Azure Content Understanding dans Foundry Tools. L'application s'authentifie avec une clé.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.contentunderstanding import ContentUnderstandingClient
    from azure.core.credentials import AzureKeyCredential

    client = ContentUnderstandingClient(endpoint=endpoint, credential=[[cred]])

    poller = client.[[method]](
        analyzer_id="[[an]]",
        inputs=[{"url": file_url}],
    )
    result = poller.result()
  slots:
  - id: cred
    options:
    - id: ckey
      text: key
    - id: cakc
      text: AzureKeyCredential(key)
    - id: cend
      text: AzureKeyCredential(endpoint)
  - id: method
    options:
    - id: mcreate
      text: begin_create_analyzer
    - id: mget
      text: get_analyzer
    - id: manalyze
      text: begin_analyze
  - id: an
    options:
    - id: aread
      text: prebuilt-read
    - id: areceipt
      text: prebuilt-receipt
    - id: alayout
      text: prebuilt-layout
answer:
  values:
    cred: cakc
    method: manalyze
    an: areceipt
explanation:
  correct:
    en: The key is wrapped in an `AzureKeyCredential` object. `begin_analyze` submits the file to the analyzer named in `analyzer_id` and returns a poller. Named values of receipts come from `prebuilt-receipt`.
    fr: La clé est encapsulée dans un objet `AzureKeyCredential`. `begin_analyze` envoie le fichier à l'analyseur désigné par `analyzer_id` et renvoie un poller. Les valeurs nommées des reçus proviennent de `prebuilt-receipt`.
  options:
    ckey:
      en: The `credential` parameter expects a credential object, not the key as a plain string.
      fr: Le paramètre `credential` attend un objet d'informations d'identification, pas la clé sous forme de simple chaîne.
    cend:
      en: The credential wraps the key; the endpoint is passed separately.
      fr: Les informations d'identification encapsulent la clé ; le point de terminaison est transmis séparément.
    mcreate:
      en: '`begin_create_analyzer` creates a custom analyzer; it doesn''t analyze a file.'
      fr: '`begin_create_analyzer` crée un analyseur personnalisé ; il n''analyse pas de fichier.'
    mget:
      en: '`get_analyzer` returns the definition of an analyzer.'
      fr: '`get_analyzer` renvoie la définition d''un analyseur.'
    aread:
      en: '`prebuilt-read` returns the text only, without named values.'
      fr: '`prebuilt-read` renvoie uniquement le texte, sans valeurs nommées.'
    alayout:
      en: '`prebuilt-layout` returns the text and its structure, without named values.'
      fr: '`prebuilt-layout` renvoie le texte et sa structure, sans valeurs nommées.'
references:
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
