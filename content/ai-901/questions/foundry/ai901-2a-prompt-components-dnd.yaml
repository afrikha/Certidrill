id: ai901-2a-prompt-components-dnd
objective: "2.1.1"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    You assemble a prompt that asks a model to summarize an article.

    Which prompt component does each part of the prompt represent? To answer, drag the appropriate components to the correct parts. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous assemblez une invite qui demande à un modèle de résumer un article.

    Quel composant d'invite chaque partie de l'invite représente-t-elle ? Pour répondre, faites glisser les composants appropriés vers les parties correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ins, text: { en: "Instructions", fr: "Instructions" } }
    - { id: pri, text: { en: "Primary content", fr: "Contenu principal" } }
    - { id: exa, text: { en: "Examples", fr: "Exemples" } }
    - { id: cue, text: { en: "Cue", fr: "Signal (cue)" } }
    - { id: sup, text: { en: "Supporting content", fr: "Contenu d'appui" } }
  targets:
    - { id: t1, text: { en: "The sentence \"Write a summary of the article for a weekly newsletter.\"", fr: "La phrase « Rédigez un résumé de l'article pour une lettre d'information hebdomadaire. »" } }
    - { id: t2, text: { en: "The full text of the article to summarize", fr: "Le texte complet de l'article à résumer" } }
    - { id: t3, text: { en: "The words \"Key points:\" followed by a dash, at the very end of the prompt", fr: "Les mots « Points clés : » suivis d'un tiret, tout à la fin de l'invite" } }
    - { id: t4, text: { en: "The current date and the topics that the reader considers important", fr: "La date du jour et les sujets que le lecteur juge importants" } }
answer:
  mapping: { t1: ins, t2: pri, t3: cue, t4: sup }
explanation:
  correct:
    en: |
      Instructions tell the model what to do. Primary content is the text that the model processes or transforms, here the article. A cue is a prefix at the end of the prompt that jumpstarts the output and steers its form, and supporting content is context that influences the output without being its main target. The prompt contains no examples of inputs with the expected outputs.
    fr: |
      Les instructions disent au modèle quoi faire. Le contenu principal est le texte que le modèle traite ou transforme, ici l'article. Un signal (cue) est un préfixe placé à la fin de l'invite, qui amorce la sortie et en oriente la forme, et le contenu d'appui est un contexte qui influence la sortie sans en être la cible principale. L'invite ne contient aucun exemple d'entrée accompagné de la sortie attendue.
references:
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
