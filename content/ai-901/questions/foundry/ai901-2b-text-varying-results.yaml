id: ai901-2b-text-varying-results
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application sends the same product review twice to a deployed general-purpose model through the Responses API, with the prompt "Describe the sentiment of this review." The two answers reach the same conclusion but are worded differently.

    What explains the difference?
  fr: |
    Une application envoie deux fois le même avis sur un produit à un modèle à usage général déployé, par l'intermédiaire de l'API Responses, avec l'invite « Describe the sentiment of this review. ». Les deux réponses arrivent à la même conclusion mais sont formulées différemment.

    Qu'est-ce qui explique la différence ?
body:
  options:
    - { id: a, text: { en: "The model is retrained on the review after the first call.", fr: "Le modèle est réentraîné sur l'avis après le premier appel." } }
    - { id: b, text: { en: "The output of a generative model is probabilistic and can vary between calls.", fr: "La sortie d'un modèle génératif est probabiliste et peut varier d'un appel à l'autre." } }
    - { id: c, text: { en: "The deployment switches to another model at every second call.", fr: "Le déploiement bascule sur un autre modèle un appel sur deux." } }
    - { id: d, text: { en: "The service stores the first answer and forbids the model to repeat it.", fr: "Le service stocke la première réponse et interdit au modèle de la répéter." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A generative model produces its text token by token from probabilities, so the same prompt can give differently worded results. When an application needs consistent, structured values, such as a language code, a confidence score or a redacted text, the Azure Language SDK is the better choice.
    fr: |
      Un modèle génératif produit son texte jeton par jeton à partir de probabilités : la même invite peut donc donner des résultats formulés différemment. Quand une application a besoin de valeurs régulières et structurées, comme un code de langue, un score de confiance ou un texte masqué, le SDK Azure Language est le meilleur choix.
  options:
    a:
      en: "Calling a deployed model doesn't train it; its weights stay the same."
      fr: "Appeler un modèle déployé ne l'entraîne pas ; ses poids restent les mêmes."
    c:
      en: "A deployment serves the model it was created with; it doesn't alternate between models."
      fr: "Un déploiement sert le modèle avec lequel il a été créé ; il n'alterne pas entre des modèles."
    d:
      en: "Nothing prevents a model from giving the same answer twice; variation comes from how the text is generated."
      fr: "Rien n'empêche un modèle de donner deux fois la même réponse ; la variation vient de la manière dont le texte est généré."
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
