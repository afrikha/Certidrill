id: ai901-2b-audio-yn-outputs
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An application uses a deployed `gpt-audio-mini` model through the Chat Completions API.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application utilise un modèle `gpt-audio-mini` déployé par l'intermédiaire de l'API Chat Completions.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To obtain a spoken answer, the application must send the text answer of the model to the text to speech API of Azure Speech.
        fr: Pour obtenir une réponse parlée, l'application doit envoyer la réponse en texte du modèle à l'API de synthèse vocale d'Azure Speech.
    - id: s2
      text:
        en: The model can return a spoken answer to a prompt that was typed as text.
        fr: Le modèle peut renvoyer une réponse parlée à une invite saisie sous forme de texte.
    - id: s3
      text:
        en: The spoken answer is returned in the response as base64-encoded audio data.
        fr: La réponse parlée est renvoyée dans la réponse sous forme de données audio encodées en base64.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The model generates the speech itself when the request asks for the audio modality, so no call to Azure Speech is needed. Text in and text plus audio out is a supported combination. The audio arrives in `message.audio.data`, encoded in base64, and the application decodes it before saving or playing it.
    fr: |
      Le modèle génère lui-même la parole quand la requête demande la modalité audio : aucun appel à Azure Speech n'est donc nécessaire. Une entrée en texte avec une sortie en texte et audio est une combinaison prise en charge. L'audio arrive dans `message.audio.data`, encodé en base64, et l'application le décode avant de l'enregistrer ou de le lire.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
