id: ai901-2d-av-multi-audio-usecases
objective: "2.4.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two scenarios are uses of audio analysis in Azure Content Understanding in Foundry Tools?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quels sont les deux scénarios qui sont des usages de l'analyse audio dans Azure Content Understanding dans Foundry Tools ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Summarizing recorded customer calls and their sentiment
      fr: Résumer des appels clients enregistrés et leur sentiment
  - id: b
    text:
      en: Reading a news article aloud with a natural voice
      fr: Lire un article d'actualité à voix haute avec une voix naturelle
  - id: c
    text:
      en: Counting the products in photos of store shelves
      fr: Compter les produits sur des photos de rayons de magasin
  - id: d
    text:
      en: Generating summaries of podcast episodes
      fr: Générer des résumés d'épisodes de podcast
  - id: e
    text:
      en: Creating background music from a text prompt
      fr: Créer une musique de fond à partir d'une invite textuelle
answer:
  optionIds:
  - a
  - d
explanation:
  correct:
    en: Audio analysis transcribes recordings and generates fields such as summaries, sentiment and topics. Customer insights from calls and automated summaries for podcasts are documented uses.
    fr: L'analyse audio transcrit des enregistrements et génère des champs comme des résumés, le sentiment et les sujets. L'analyse des appels clients et les résumés automatiques de podcasts sont des usages documentés.
  options:
    b:
      en: Reading text aloud is speech synthesis.
      fr: Lire du texte à voix haute relève de la synthèse vocale.
    c:
      en: Counting objects in photos is image analysis.
      fr: Compter des objets sur des photos relève de l'analyse d'images.
    e:
      en: Creating audio from a prompt is content generation, not information extraction.
      fr: Créer de l'audio à partir d'une invite relève de la génération de contenu, pas de l'extraction d'informations.
references:
- title: Azure Content Understanding in Foundry Tools audio overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview
