id: ai901-2b-text-structured-result
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders builds a Python application that routes incoming support messages. For each message, an automated pipeline needs the same structured result at every run: the code of the language and a confidence score.

    What should the application use?
  fr: |
    Northwind Traders crée une application Python qui achemine les messages de support entrants. Pour chaque message, un pipeline automatisé a besoin du même résultat structuré à chaque exécution : le code de la langue et un score de confiance.

    Que doit utiliser l'application ?
body:
  options:
    - { id: a, text: { en: "A general-purpose model called with a prompt", fr: "Un modèle à usage général appelé avec une invite" } }
    - { id: b, text: { en: "Azure Language in Foundry Tools", fr: "Azure Language dans Foundry Tools" } }
    - { id: c, text: { en: "Azure Speech in Foundry Tools", fr: "Azure Speech dans Foundry Tools" } }
    - { id: d, text: { en: "Azure Content Understanding in Foundry Tools", fr: "Azure Content Understanding dans Foundry Tools" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Language provides purpose-built analyzers that return structured, deterministic output. Its language detection returns the name of the language, its ISO 639-1 code and a confidence score, which an automated pipeline can rely on.
    fr: |
      Azure Language fournit des analyseurs spécialisés qui renvoient une sortie structurée et déterministe. Sa détection de langue renvoie le nom de la langue, son code ISO 639-1 et un score de confiance, sur lesquels un pipeline automatisé peut s'appuyer.
  options:
    a:
      en: "A general-purpose model can name the language, but its output is generated text whose form can vary between calls."
      fr: "Un modèle à usage général peut nommer la langue, mais sa sortie est du texte généré dont la forme peut varier d'un appel à l'autre."
    c:
      en: "Azure Speech converts speech to text and text to speech; the messages here are already text."
      fr: "Azure Speech convertit la parole en texte et le texte en parole ; ici, les messages sont déjà du texte."
    d:
      en: "Content Understanding extracts information from documents, images, audio and video; it isn't the language detection service."
      fr: "Content Understanding extrait des informations de documents, d'images, d'audio et de vidéo ; ce n'est pas le service de détection de langue."
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
