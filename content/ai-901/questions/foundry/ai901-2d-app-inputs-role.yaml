id: ai901-2d-app-inputs-role
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python application calls Azure Content Understanding in Foundry Tools with the following code.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-receipt",
        inputs=[{"url": file_url}],
    )
    ```

    What does the `inputs` argument specify?
  fr: |
    Une application Python appelle Azure Content Understanding dans Foundry Tools avec le code suivant.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-receipt",
        inputs=[{"url": file_url}],
    )
    ```

    Que spécifie l'argument `inputs` ?
body:
  options:
  - id: a
    text:
      en: The fields that the analyzer must extract
      fr: Les champs que l'analyseur doit extraire
  - id: b
    text:
      en: The content to analyze, given here as the URL of a file
      fr: Le contenu à analyser, donné ici sous la forme de l'URL d'un fichier
  - id: c
    text:
      en: The key that authenticates the application
      fr: La clé qui authentifie l'application
  - id: d
    text:
      en: The model deployment that the analyzer must use
      fr: Le déploiement de modèle que l'analyseur doit utiliser
answer:
  optionId: b
explanation:
  correct:
    en: '`inputs` lists the content to analyze; here, one file referenced by its URL. The analyzer to run is selected by `analyzer_id`.'
    fr: '`inputs` répertorie le contenu à analyser ; ici, un fichier référencé par son URL. L''analyseur à exécuter est sélectionné par `analyzer_id`.'
  options:
    a:
      en: The fields come from the schema of the analyzer named in `analyzer_id`, not from `inputs`.
      fr: Les champs proviennent du schéma de l'analyseur désigné par `analyzer_id`, pas de `inputs`.
    c:
      en: The credential is given when the client is created, not in each call.
      fr: Les informations d'identification sont fournies à la création du client, pas à chaque appel.
    d:
      en: '`inputs` describes the files to analyze; it doesn''t select a model deployment.'
      fr: '`inputs` décrit les fichiers à analyser ; il ne sélectionne pas de déploiement de modèle.'
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
