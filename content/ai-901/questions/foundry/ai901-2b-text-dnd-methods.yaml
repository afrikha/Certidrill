id: ai901-2b-text-dnd-methods
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are building a Python application with the `TextAnalyticsClient` class of the Azure Language SDK.

    Which method should you call for each requirement? To answer, drag the appropriate methods to the correct requirements. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une application Python avec la classe `TextAnalyticsClient` du SDK Azure Language.

    Quelle méthode devez-vous appeler pour chaque exigence ? Pour répondre, faites glisser les méthodes appropriées vers les exigences correspondantes. Chaque méthode peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lang, text: "`detect_language`" }
    - { id: pii, text: "`recognize_pii_entities`" }
    - { id: sent, text: "`analyze_sentiment`" }
    - { id: keys, text: "`extract_key_phrases`" }
    - { id: ner, text: "`recognize_entities`" }
  targets:
    - id: t1
      text: { en: "Decide whether a review is favorable or unfavorable", fr: "Déterminer si un avis est favorable ou défavorable" }
    - id: t2
      text: { en: "Hide the phone numbers and e-mail addresses in a transcript", fr: "Occulter les numéros de téléphone et les adresses e-mail dans une transcription" }
    - id: t3
      text: { en: "Route each message according to whether it is written in German, Spanish or Japanese", fr: "Acheminer chaque message selon qu'il est écrit en allemand, en espagnol ou en japonais" }
    - id: t4
      text: { en: "List the main talking points of an article", fr: "Lister les principaux points abordés dans un article" }
answer:
  mapping: { t1: sent, t2: pii, t3: lang, t4: keys }
explanation:
  correct:
    en: |
      `analyze_sentiment` returns a positive, neutral or negative sentiment with confidence scores. `recognize_pii_entities` detects personal data and returns a redacted text. `detect_language` identifies the language of each document. `extract_key_phrases` returns the main concepts of a text. `recognize_entities` identifies and categorizes entities such as people and places, but it doesn't mask them.
    fr: |
      `analyze_sentiment` renvoie un sentiment positif, neutre ou négatif avec des scores de confiance. `recognize_pii_entities` détecte les données personnelles et renvoie un texte masqué. `detect_language` identifie la langue de chaque document. `extract_key_phrases` renvoie les principaux concepts d'un texte. `recognize_entities` identifie et catégorise des entités comme des personnes et des lieux, mais ne les masque pas.
references:
  - title: Azure Text Analytics client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-textanalytics-readme
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
