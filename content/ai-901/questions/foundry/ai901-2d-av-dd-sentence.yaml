id: ai901-2d-av-dd-sentence
objective: "2.4.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: When Azure Content Understanding in Foundry Tools analyzes an audio file, content extraction produces [[a]]. For a video, content extraction also produces [[b]]. In both cases, a field of the schema such as a summary is [[c]].
    fr: Lorsqu'Azure Content Understanding dans Foundry Tools analyse un fichier audio, l'extraction de contenu produit [[a]]. Pour une vidéo, l'extraction de contenu produit aussi [[b]]. Dans les deux cas, un champ du schéma tel qu'un résumé est [[c]].
  slots:
  - id: a
    options:
    - id: tab
      text:
        en: a table of line items
        fr: un tableau de lignes d'articles
    - id: bar
      text:
        en: a list of barcodes
        fr: une liste de codes-barres
    - id: tr
      text:
        en: a transcript of the speech
        fr: une transcription de la parole
  - id: b
    options:
    - id: kf
      text:
        en: key frames
        fr: des images clés
    - id: sel
      text:
        en: selection marks
        fr: des marques de sélection
    - id: pg
      text:
        en: page numbers
        fr: des numéros de page
  - id: c
    options:
    - id: ocr
      text:
        en: read by OCR
        fr: lu par OCR
    - id: gen
      text:
        en: generated by a generative model
        fr: généré par un modèle génératif
    - id: man
      text:
        en: typed when the analyzer is created
        fr: saisi lors de la création de l'analyseur
answer:
  values:
    a: tr
    b: kf
    c: gen
explanation:
  correct:
    en: Content extraction transcribes the speech of audio and video files; for a video, it also extracts key frames and detects the shots. Field extraction then uses a generative model to produce the values of the schema, such as a summary.
    fr: L'extraction de contenu transcrit la parole des fichiers audio et vidéo ; pour une vidéo, elle extrait aussi des images clés et détecte les plans. L'extraction de champs utilise ensuite un modèle génératif pour produire les valeurs du schéma, comme un résumé.
  options:
    tab:
      en: Tables of line items are found in documents such as invoices.
      fr: Les tableaux de lignes d'articles se trouvent dans des documents comme les factures.
    sel:
      en: Selection marks, such as check boxes, are elements of documents.
      fr: Les marques de sélection, comme les cases à cocher, sont des éléments de documents.
    ocr:
      en: OCR reads the text of documents; a summary of a recording is written by a model.
      fr: L'OCR lit le texte de documents ; le résumé d'un enregistrement est rédigé par un modèle.
references:
- title: Azure Content Understanding in Foundry Tools audio overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview
- title: Azure Content Understanding in Foundry Tools video overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
