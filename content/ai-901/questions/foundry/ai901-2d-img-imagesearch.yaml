id: ai901-2d-img-imagesearch
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a collection of 50,000 product photos. To make the collection searchable, Wingtip needs a one-paragraph description of each photo. No custom field is required.

    Which prebuilt analyzer should Wingtip use?
  fr: |
    Wingtip Toys possède une collection de 50 000 photos de produits. Pour rendre la collection interrogeable, Wingtip a besoin d'une description en un paragraphe de chaque photo. Aucun champ personnalisé n'est requis.

    Quel analyseur prédéfini Wingtip doit-elle utiliser ?
body:
  options:
  - id: a
    text: '`prebuilt-read`'
  - id: b
    text: '`prebuilt-imageSearch`'
  - id: c
    text: '`prebuilt-layout`'
  - id: d
    text: '`prebuilt-videoSearch`'
answer:
  optionId: b
explanation:
  correct:
    en: '`prebuilt-imageSearch` generates a one-paragraph description of an image, intended for search scenarios. It is ready to use: there is no schema to define.'
    fr: '`prebuilt-imageSearch` génère une description en un paragraphe d''une image, destinée aux scénarios de recherche. Il est prêt à l''emploi : il n''y a aucun schéma à définir.'
  options:
    a:
      en: '`prebuilt-read` returns the text found in a file (OCR); it doesn''t describe what a photo shows.'
      fr: '`prebuilt-read` renvoie le texte trouvé dans un fichier (OCR) ; il ne décrit pas ce que montre une photo.'
    c:
      en: '`prebuilt-layout` returns the text and the structure of a document, such as tables and sections.'
      fr: '`prebuilt-layout` renvoie le texte et la structure d''un document, comme les tableaux et les sections.'
    d:
      en: '`prebuilt-videoSearch` analyzes videos and returns their segments, not descriptions of photos.'
      fr: '`prebuilt-videoSearch` analyse des vidéos et renvoie leurs segments, pas des descriptions de photos.'
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
