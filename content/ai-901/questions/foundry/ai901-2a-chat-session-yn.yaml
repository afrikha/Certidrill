id: ai901-2a-chat-session-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You chat with a deployed model in the model playground of the Foundry portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous conversez avec un modèle déployé dans le terrain de jeu de modèles du portail Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A follow-up prompt is interpreted in the context of the earlier messages of the chat.", fr: "Une invite de suivi est interprétée dans le contexte des messages précédents de la conversation." } }
    - { id: s2, text: { en: "Selecting **New chat** clears the conversation history.", fr: "La sélection de **New chat** efface l'historique de la conversation." } }
    - { id: s3, text: { en: "The text in **Instructions** is replaced each time that you send a user prompt.", fr: "Le texte de la zone **Instructions** est remplacé chaque fois que vous envoyez une invite utilisateur." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The playground keeps the conversation history, so a follow-up such as "What else did she write?" is understood from the earlier messages. **New chat** starts a conversation with an empty history. **Instructions** holds the system prompt: it stays in place and the model follows it for each user prompt that you send in the chat pane.
    fr: |
      Le terrain de jeu conserve l'historique de la conversation : une question de suivi comme « Qu'a-t-elle écrit d'autre ? » est donc comprise grâce aux messages précédents. **New chat** démarre une conversation dont l'historique est vide. La zone **Instructions** contient l'invite système : elle reste en place et le modèle la suit pour chaque invite utilisateur que vous envoyez dans le volet de conversation.
references:
  - title: "Exercise - Get started with generative AI and agents in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/6-exercise
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
