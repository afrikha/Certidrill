id: ai901-2c-speech-sdk-objects-match
objective: "2.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Match each object of the Azure Speech SDK to its role in an application.

    To answer, drag the appropriate object to each role. Each object may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Associez chaque objet du SDK Azure Speech à son rôle dans une application.

    Pour répondre, faites glisser l'objet approprié vers chaque rôle. Chaque objet peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: conf
      text: "`SpeechConfig`"
    - id: in
      text: "`AudioConfig`"
    - id: out
      text: "`AudioOutputConfig`"
    - id: synth
      text: "`SpeechSynthesizer`"
    - id: recog
      text: "`SpeechRecognizer`"
  targets:
    - id: r1
      text:
        en: "Holds the endpoint and the key used to connect to the Foundry resource"
        fr: "Contient le point de terminaison et la clé utilisés pour se connecter à la ressource Foundry"
    - id: r2
      text:
        en: "Selects the microphone or an audio file as the source of the audio to transcribe"
        fr: "Sélectionne le microphone ou un fichier audio comme source de l'audio à transcrire"
    - id: r3
      text:
        en: "Selects the speaker or an audio file as the destination of the generated audio"
        fr: "Sélectionne le haut-parleur ou un fichier audio comme destination de l'audio généré"
    - id: r4
      text:
        en: "Converts text into spoken audio"
        fr: "Convertit du texte en audio parlé"
answer:
  mapping:
    r1: conf
    r2: in
    r3: out
    r4: synth
explanation:
  correct:
    en: |
      `SpeechConfig` carries the connection settings: the endpoint and the key of the Foundry resource. `AudioConfig` describes an audio input, and `AudioOutputConfig` an audio output. `SpeechSynthesizer` turns text into speech, whereas `SpeechRecognizer`, which is not used here, turns speech into text.
    fr: |
      `SpeechConfig` porte les paramètres de connexion : le point de terminaison et la clé de la ressource Foundry. `AudioConfig` décrit une entrée audio, et `AudioOutputConfig` une sortie audio. `SpeechSynthesizer` transforme du texte en parole, alors que `SpeechRecognizer`, non utilisé ici, transforme la parole en texte.
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: "Speech synthesis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
