id: ai901-2b-audio-yn-concepts
objective: "2.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to respond to spoken prompts with an audio-enabled multimodal model deployed in Microsoft Foundry, such as `gpt-audio`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de répondre à des invites vocales avec un modèle multimodal compatible avec l'audio déployé dans Microsoft Foundry, comme `gpt-audio`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The model can take a recorded question as its prompt.
        fr: Le modèle peut prendre une question enregistrée comme invite.
    - id: s2
      text:
        en: The application must first convert the recording to text with a separate service.
        fr: L'application doit d'abord convertir l'enregistrement en texte avec un service distinct.
    - id: s3
      text:
        en: A spoken answer requires a second model deployment that converts text to speech.
        fr: Une réponse parlée exige un deuxième déploiement de modèle qui convertit le texte en parole.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Audio-enabled models use audio inputs as prompts and generate spoken audio responses themselves. The recording is sent directly in the request, so no separate transcription step is required, and the same deployment produces the spoken answer when the request asks for the audio modality.
    fr: |
      Les modèles compatibles avec l'audio utilisent des entrées audio comme invites et génèrent eux-mêmes des réponses audio parlées. L'enregistrement est envoyé directement dans la requête : aucune étape de transcription distincte n'est donc requise, et le même déploiement produit la réponse parlée quand la requête demande la modalité audio.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
