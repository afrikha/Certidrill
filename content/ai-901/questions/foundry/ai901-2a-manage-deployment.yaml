id: ai901-2a-manage-deployment
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your Foundry resource contains a model deployment that is no longer needed.

    Where in the Foundry portal can you view the endpoint details and the keys of the deployment, adjust its settings or delete it?
  fr: |
    Votre ressource Foundry contient un déploiement de modèle devenu inutile.

    Dans le portail Foundry, où pouvez-vous consulter les détails du point de terminaison et les clés du déploiement, modifier ses paramètres ou le supprimer ?
body:
  options:
    - { id: a, text: { en: "On the page of the model in the model catalog", fr: "Dans la page du modèle du catalogue de modèles" } }
    - { id: b, text: { en: "On the model leaderboards", fr: "Dans les classements de modèles" } }
    - { id: c, text: { en: "On the detail page of the deployment", fr: "Dans la page de détails du déploiement" } }
    - { id: d, text: { en: "In the agents playground", fr: "Dans le terrain de jeu des agents" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the Foundry portal, **Build** > **Models** lists the deployments of the resource. From the detail page of a deployment, you can view its endpoint details and keys, adjust its settings and delete it.
    fr: |
      Dans le portail Foundry, **Build** > **Models** répertorie les déploiements de la ressource. À partir de la page de détails d'un déploiement, vous pouvez consulter les détails de son point de terminaison et ses clés, modifier ses paramètres et le supprimer.
  options:
    a:
      en: "The page of a model in the catalog describes the model and lets you deploy it. It doesn't manage an existing deployment."
      fr: "La page d'un modèle du catalogue décrit le modèle et permet de le déployer. Elle ne gère pas un déploiement existant."
    b:
      en: "The leaderboards rank the models of the catalog by benchmark results."
      fr: "Les classements ordonnent les modèles du catalogue d'après des résultats de benchmarks."
    d:
      en: "The agents playground is for testing agents, not for managing model deployments."
      fr: "Le terrain de jeu des agents sert à tester des agents, pas à gérer des déploiements de modèles."
references:
  - title: "Deploy Microsoft Foundry Models in the Foundry portal"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/deploy-foundry-models
