id: ai901-2c-vision-model-for-photos
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders wants a support application in which customers upload a photo of a damaged product and ask questions about it. The answers must be returned in natural language.

    Which model should you deploy in Microsoft Foundry?
  fr: |
    Northwind Traders veut une application de support dans laquelle les clients chargent la photo d'un produit endommagé et posent des questions à son sujet. Les réponses doivent être renvoyées en langage naturel.

    Quel modèle devez-vous déployer dans Microsoft Foundry ?
body:
  options:
    - id: a
      text: "GPT-Image-1-Mini"
    - id: b
      text: "text-embedding-3-small"
    - id: c
      text: "Sora 2"
    - id: d
      text: "GPT-4.1-mini"
answer:
  optionId: d
explanation:
  correct:
    en: |
      GPT-4.1-mini is a vision-enabled multimodal model: it accepts text and images in the same prompt and answers in natural language. It can therefore describe the photo and answer the customer's questions about it.
    fr: |
      GPT-4.1-mini est un modèle multimodal compatible avec la vision : il accepte du texte et des images dans la même invite et répond en langage naturel. Il peut donc décrire la photo et répondre aux questions du client à son sujet.
  options:
    a:
      en: "GPT-Image-1-Mini is an image-generation model: it produces images, not written answers about a photo."
      fr: "GPT-Image-1-Mini est un modèle de génération d'images : il produit des images, pas des réponses écrites sur une photo."
    b:
      en: "An embedding model returns numeric vectors; it doesn't describe images or hold a conversation."
      fr: "Un modèle d'embedding renvoie des vecteurs numériques ; il ne décrit pas d'images et ne tient pas de conversation."
    c:
      en: "Sora 2 generates videos; it doesn't answer questions about an uploaded photo."
      fr: "Sora 2 génère des vidéos ; il ne répond pas à des questions sur une photo chargée."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
