id: ai901-2c-visionapp-openai-package
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are building a Python application that sends a photo and a question to a vision-enabled model deployed in a Foundry resource. The code starts with the line `from openai import OpenAI` and calls the Responses API.

    Which package should you install?
  fr: |
    Vous créez une application Python qui envoie une photo et une question à un modèle compatible avec la vision déployé dans une ressource Foundry. Le code commence par la ligne `from openai import OpenAI` et appelle l'API Responses.

    Quel package devez-vous installer ?
body:
  options:
    - id: a
      text: "`openai`"
    - id: b
      text: "`azure-cognitiveservices-speech`"
    - id: c
      text: "`azure-identity`"
    - id: d
      text: "`azure-ai-projects`"
answer:
  optionId: a
explanation:
  correct:
    en: |
      The `OpenAI` client class comes from the `openai` package, installed with `pip install openai`. Pointed at the endpoint of the Foundry resource, this client calls the Responses API to send text and images to the deployed model.
    fr: |
      La classe cliente `OpenAI` provient du package `openai`, installé avec `pip install openai`. Dirigé vers le point de terminaison de la ressource Foundry, ce client appelle l'API Responses pour envoyer du texte et des images au modèle déployé.
  options:
    b:
      en: "`azure-cognitiveservices-speech` is the Azure Speech SDK, for speech recognition and synthesis."
      fr: "`azure-cognitiveservices-speech` est le SDK Azure Speech, pour la reconnaissance et la synthèse vocales."
    c:
      en: "`azure-identity` provides Microsoft Entra credentials; it doesn't contain the `OpenAI` class."
      fr: "`azure-identity` fournit des informations d'identification Microsoft Entra ; il ne contient pas la classe `OpenAI`."
    d:
      en: "`azure-ai-projects` provides `AIProjectClient` to connect to a Foundry project; the `OpenAI` class is imported from `openai`."
      fr: "`azure-ai-projects` fournit `AIProjectClient` pour se connecter à un projet Foundry ; la classe `OpenAI` s'importe depuis `openai`."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Microsoft Foundry SDKs and endpoints"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview
