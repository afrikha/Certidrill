id: ai901-2a-code-reading-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You review the following chat client.

    ```text
    import os
    from openai import OpenAI

    client = OpenAI(
        base_url=os.environ["AZURE_OPENAI_ENDPOINT"] + "/openai/v1/",
        api_key=os.environ["AZURE_OPENAI_API_KEY"],
    )

    response = client.responses.create(
        model=os.environ["DEPLOYMENT_NAME"],
        input=[
            {"role": "system", "content": "You answer in one short paragraph."},
            {"role": "user", "content": "What is a token?"},
        ],
        max_output_tokens=300,
    )
    print(response.output_text)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le client de conversation suivant.

    ```text
    import os
    from openai import OpenAI

    client = OpenAI(
        base_url=os.environ["AZURE_OPENAI_ENDPOINT"] + "/openai/v1/",
        api_key=os.environ["AZURE_OPENAI_API_KEY"],
    )

    response = client.responses.create(
        model=os.environ["DEPLOYMENT_NAME"],
        input=[
            {"role": "system", "content": "You answer in one short paragraph."},
            {"role": "user", "content": "What is a token?"},
        ],
        max_output_tokens=300,
    )
    print(response.output_text)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The request contains both a system prompt and a user prompt.", fr: "La requête contient à la fois une invite système et une invite utilisateur." } }
    - { id: s2, text: { en: "The API key is written directly in the code.", fr: "La clé d'API est écrite directement dans le code." } }
    - { id: s3, text: { en: "The generated answer is limited to 300 words.", fr: "La réponse générée est limitée à 300 mots." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The `input` list holds a message with the `system` role, which is the system prompt, and a message with the `user` role, which is the user prompt. The endpoint, the key and the deployment name are read from environment variables with `os.environ`, so no secret appears in the code. `max_output_tokens=300` caps the response at 300 output tokens; a token is a unit of text such as a word or a part of a word, so the cap isn't a number of words.
    fr: |
      La liste `input` contient un message de rôle `system`, qui est l'invite système, et un message de rôle `user`, qui est l'invite utilisateur. Le point de terminaison, la clé et le nom du déploiement sont lus dans des variables d'environnement avec `os.environ` : aucun secret n'apparaît donc dans le code. `max_output_tokens=300` plafonne la réponse à 300 jetons de sortie ; un jeton est une unité de texte comme un mot ou une partie de mot : le plafond n'est donc pas un nombre de mots.
