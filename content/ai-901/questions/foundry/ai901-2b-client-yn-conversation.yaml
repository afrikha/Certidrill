id: ai901-2b-client-yn-conversation
objective: "2.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A client application talks to an agent with the following code. `openai` is an OpenAI-compatible client that is bound to the agent.

    ```python
    conversation = openai.conversations.create()

    response = openai.responses.create(
        conversation=conversation.id,
        input="What is the size of Canada in square kilometers?",
    )
    print(response.output_text)

    response = openai.responses.create(
        conversation=conversation.id,
        input="And what is its capital city?",
    )
    print(response.output_text)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application cliente dialogue avec un agent à l'aide du code suivant. `openai` est un client compatible OpenAI lié à l'agent.

    ```python
    conversation = openai.conversations.create()

    response = openai.responses.create(
        conversation=conversation.id,
        input="What is the size of Canada in square kilometers?",
    )
    print(response.output_text)

    response = openai.responses.create(
        conversation=conversation.id,
        input="And what is its capital city?",
    )
    print(response.output_text)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "`openai.conversations.create()` creates a conversation that can hold several turns."
        fr: "`openai.conversations.create()` crée une conversation qui peut contenir plusieurs tours."
    - id: s2
      text:
        en: The second request must repeat the first question in `input` for the agent to understand the follow-up.
        fr: La deuxième requête doit répéter la première question dans `input` pour que l'agent comprenne la question de suivi.
    - id: s3
      text:
        en: Passing the same conversation ID in both requests lets the agent answer the second question in context.
        fr: Passer le même ID de conversation dans les deux requêtes permet à l'agent de répondre à la deuxième question en contexte.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The conversation object stores the turns of a multi-turn chat. Because both requests pass `conversation.id`, the agent keeps the history: it knows that "its" refers to Canada without the client sending the first question again.
    fr: |
      L'objet conversation stocke les tours d'un dialogue à plusieurs tours. Comme les deux requêtes passent `conversation.id`, l'agent conserve l'historique : il sait que « its » désigne le Canada sans que le client renvoie la première question.
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
