id: ai901-2d-doc-yn-ocr
objective: "2.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A company digitizes its paper invoices.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise numérise ses factures papier.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: Optical character recognition (OCR) converts the printed text of a scanned page into machine-readable text.
      fr: La reconnaissance optique de caractères (OCR) convertit le texte imprimé d'une page numérisée en texte lisible par une machine.
  - id: s2
    text:
      en: OCR alone identifies which date on an invoice is the due date.
      fr: L'OCR identifie à elle seule quelle date d'une facture est la date d'échéance.
  - id: s3
    text:
      en: Azure Content Understanding in Foundry Tools combines OCR with generative AI models to fill the fields of a schema.
      fr: Azure Content Understanding dans Foundry Tools associe l'OCR à des modèles d'IA générative pour remplir les champs d'un schéma.
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: OCR reads the characters of a scan but doesn't understand their meaning or the relationships between values, so it can't tell an invoice date from a due date. Content Understanding adds AI models on top of OCR to map the values to the fields of a schema.
    fr: 'L''OCR lit les caractères d''une numérisation, mais ne comprend ni leur sens ni les relations entre les valeurs : elle ne distingue donc pas une date de facture d''une date d''échéance. Content Understanding ajoute des modèles d''IA à l''OCR pour associer les valeurs aux champs d''un schéma.'
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
- title: What is Azure Content Understanding in Foundry Tools?
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
