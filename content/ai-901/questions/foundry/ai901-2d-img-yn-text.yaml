id: ai901-2d-img-yn-text
objective: "2.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You choose analyzers of Azure Content Understanding in Foundry Tools for files in the JPEG format.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous choisissez des analyseurs d'Azure Content Understanding dans Foundry Tools pour des fichiers au format JPEG.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: An image analyzer is the recommended choice for a photographed form when the information to extract is its printed text.
      fr: Un analyseur d'images est le choix recommandé pour un formulaire photographié lorsque l'information à extraire est son texte imprimé.
  - id: s2
    text:
      en: The `prebuilt-imageSearch` analyzer generates a description of an image.
      fr: L'analyseur `prebuilt-imageSearch` génère une description d'une image.
  - id: s3
    text:
      en: A custom analyzer for photos of products uses `prebuilt-image` as its base analyzer.
      fr: Un analyseur personnalisé pour des photos de produits utilise `prebuilt-image` comme analyseur de base.
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: 'Image analyzers aren''t optimized for analysis that relies mainly on extracted text: a photographed form goes to a document analyzer. `prebuilt-imageSearch` returns a one-paragraph description of an image. A custom image analyzer inherits from the base analyzer `prebuilt-image`.'
    fr: 'Les analyseurs d''images ne sont pas optimisés pour une analyse qui repose surtout sur du texte extrait : un formulaire photographié relève d''un analyseur de documents. `prebuilt-imageSearch` renvoie une description en un paragraphe d''une image. Un analyseur d''images personnalisé hérite de l''analyseur de base `prebuilt-image`.'
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
