id: ai901-2b-agent-reuse-behavior
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your team at Contoso tested a model deployment in the Foundry portal with a set of instructions and two tools. Three internal applications must now reuse exactly this combination of model, instructions and tools.

    What should you create?
  fr: |
    Votre équipe chez Contoso a testé un déploiement de modèle dans le portail Foundry avec un jeu d'instructions et deux outils. Trois applications internes doivent maintenant réutiliser exactement cette combinaison de modèle, d'instructions et d'outils.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A second deployment of the model", fr: "Un deuxième déploiement du modèle" } }
    - { id: b, text: { en: "A separate project for each application", fr: "Un projet distinct pour chaque application" } }
    - { id: c, text: { en: "An agent saved in the project", fr: "Un agent enregistré dans le projet" } }
    - { id: d, text: { en: "A user prompt template for each application", fr: "Un modèle d'invite utilisateur pour chaque application" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An agent is a reusable component that packages a model, instructions (the system prompt) and tools. Every application that calls the agent gets the same behavior, without defining the instructions or the tools again.
    fr: |
      Un agent est un composant réutilisable qui regroupe un modèle, des instructions (l'invite système) et des outils. Toute application qui appelle l'agent obtient le même comportement, sans redéfinir les instructions ni les outils.
  options:
    a:
      en: "A second deployment only makes the model available a second time; it carries neither the instructions nor the tools."
      fr: "Un deuxième déploiement rend seulement le modèle disponible une seconde fois ; il ne porte ni les instructions ni les outils."
    b:
      en: "Separate projects would multiply the configuration to maintain instead of sharing it."
      fr: "Des projets distincts multiplieraient la configuration à maintenir au lieu de la partager."
    d:
      en: "A user prompt carries one request; it doesn't hold the instructions or the tools, and each application would have to keep its own copy."
      fr: "Une invite utilisateur porte une demande ; elle ne contient ni les instructions ni les outils, et chaque application devrait en conserver sa propre copie."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
