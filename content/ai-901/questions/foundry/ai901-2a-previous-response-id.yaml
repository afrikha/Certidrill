id: ai901-2a-previous-response-id
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A chat client sends two requests to a deployed model through the Responses API.

    ```text
    first = client.responses.create(
        model="chat-prod",
        input="Name three benefits of cloud computing.",
    )

    second = client.responses.create(
        model="chat-prod",
        input="Explain the second one in more detail.",
    )
    ```

    The second request must continue the conversation of the first response, without sending the first prompt and its answer again.

    Which argument should you add to the second call?
  fr: |
    Un client de conversation envoie deux requêtes à un modèle déployé via l'API Responses.

    ```text
    first = client.responses.create(
        model="chat-prod",
        input="Name three benefits of cloud computing.",
    )

    second = client.responses.create(
        model="chat-prod",
        input="Explain the second one in more detail.",
    )
    ```

    La seconde requête doit poursuivre la conversation de la première réponse, sans renvoyer la première invite ni sa réponse.

    Quel argument devez-vous ajouter au second appel ?
body:
  options:
    - { id: a, text: "stream=True" }
    - { id: b, text: "previous_response_id=first.id" }
    - { id: c, text: "store=False" }
    - { id: d, text: "temperature=0" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Responses API is stateful: a request that passes the ID of an earlier response in `previous_response_id` is chained to it, so the model answers with the context of that response. The client then sends only the new input.
    fr: |
      L'API Responses est avec état : une requête qui passe l'ID d'une réponse antérieure dans `previous_response_id` y est chaînée, et le modèle répond donc avec le contexte de cette réponse. Le client n'envoie alors que la nouvelle entrée.
  options:
    a:
      en: "`stream=True` returns the output progressively as events. It doesn't link two responses."
      fr: "`stream=True` renvoie la sortie progressivement sous forme d'événements. Il ne relie pas deux réponses."
    c:
      en: "`store=False` makes a request stateless; the application must then manage the conversation state itself."
      fr: "`store=False` rend une requête sans état ; l'application doit alors gérer elle-même l'état de la conversation."
    d:
      en: "A temperature of 0 makes the output more deterministic. It gives the model no memory of the first exchange."
      fr: "Une température de 0 rend la sortie plus déterministe. Elle ne donne au modèle aucune mémoire du premier échange."
references:
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
