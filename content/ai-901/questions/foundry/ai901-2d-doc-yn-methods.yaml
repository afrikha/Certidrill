id: ai901-2d-doc-yn-methods
objective: "2.4.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You define the fields of a custom document analyzer in Azure Content Understanding in Foundry Tools. Each field uses one of the three generation methods: `extract`, `generate` or `classify`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez les champs d'un analyseur de documents personnalisé dans Azure Content Understanding dans Foundry Tools. Chaque champ utilise l'une des trois méthodes de génération : `extract`, `generate` ou `classify`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A field that uses the `extract` method takes its value as it appears in the document.
      fr: Un champ qui utilise la méthode `extract` prend sa valeur telle qu'elle apparaît dans le document.
  - id: s2
    text:
      en: A field that uses the `generate` method returns only text that is printed word for word in the document.
      fr: Un champ qui utilise la méthode `generate` renvoie uniquement du texte imprimé mot pour mot dans le document.
  - id: s3
    text:
      en: A field that uses the `classify` method returns any text that the model writes freely.
      fr: Un champ qui utilise la méthode `classify` renvoie n'importe quel texte que le modèle rédige librement.
answer:
  values:
    s1: true
    s2: false
    s3: false
explanation:
  correct:
    en: '`extract` copies a value as it appears in the content, such as a date or an invoice number. `generate` lets the model produce a value from the content, such as a summary that is written nowhere in the document. `classify` selects a value from a predefined set of categories.'
    fr: '`extract` copie une valeur telle qu''elle apparaît dans le contenu, comme une date ou un numéro de facture. `generate` laisse le modèle produire une valeur à partir du contenu, comme un résumé qui n''est écrit nulle part dans le document. `classify` sélectionne une valeur dans un ensemble prédéfini de catégories.'
references:
- title: What is Azure Content Understanding in Foundry Tools?
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
- title: Best practices for using Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
