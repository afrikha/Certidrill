id: ai901-2a-model-leaderboards
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You plan to deploy a chat model in a Foundry project. No model is deployed yet.

    You want to see how the candidate models rank on quality, safety and throughput, based on standard benchmark datasets.

    What should you use in the Foundry portal?
  fr: |
    Vous prévoyez de déployer un modèle de conversation dans un projet Foundry. Aucun modèle n'est encore déployé.

    Vous voulez voir comment les modèles candidats se classent en qualité, en sécurité et en débit, d'après des jeux de données de référence standard.

    Que devez-vous utiliser dans le portail Foundry ?
body:
  options:
    - { id: a, text: { en: "The model leaderboards", fr: "Les classements de modèles" } }
    - { id: b, text: { en: "The **Compare models** option of the model playground", fr: "L'option **Compare models** du terrain de jeu de modèles" } }
    - { id: c, text: { en: "The **Code** tab of the model playground", fr: "L'onglet **Code** du terrain de jeu de modèles" } }
    - { id: d, text: { en: "The **Instructions** box of the model playground", fr: "La zone **Instructions** du terrain de jeu de modèles" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The model leaderboards of the Foundry portal rank the models of the catalog by quality, safety and throughput, from benchmarks that use standard datasets and consistent criteria. You can consult them before any deployment.
    fr: |
      Les classements de modèles du portail Foundry ordonnent les modèles du catalogue par qualité, sécurité et débit, à partir de benchmarks qui utilisent des jeux de données standard et des critères homogènes. Vous pouvez les consulter avant tout déploiement.
  options:
    b:
      en: "**Compare models** sends your own prompt to up to three deployed models. It needs deployments and doesn't show benchmark rankings."
      fr: "**Compare models** envoie votre propre invite à trois modèles déployés au maximum. L'option exige des déploiements et n'affiche pas de classements de benchmarks."
    c:
      en: "The **Code** tab shows sample code that calls a deployment."
      fr: "L'onglet **Code** affiche un exemple de code qui appelle un déploiement."
    d:
      en: "The **Instructions** box holds the system prompt of a deployed model."
      fr: "La zone **Instructions** contient l'invite système d'un modèle déployé."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
