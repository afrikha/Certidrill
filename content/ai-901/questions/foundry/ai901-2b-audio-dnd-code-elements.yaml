id: ai901-2b-audio-dnd-code-elements
objective: "2.2.2"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    An application sends a spoken prompt to a deployed `gpt-audio-mini` model through the Chat Completions API and processes the response.

    Which code element matches each description? To answer, drag the appropriate code elements to the correct descriptions. Each code element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application envoie une invite vocale à un modèle `gpt-audio-mini` déployé par l'intermédiaire de l'API Chat Completions et traite la réponse.

    Quel élément de code correspond à chaque description ? Pour répondre, faites glisser les éléments de code appropriés vers les descriptions correspondantes. Chaque élément de code peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mods, text: { en: "The `modalities` parameter of the request", fr: "Le paramètre `modalities` de la requête" } }
    - { id: audio, text: { en: "The `audio` parameter of the request", fr: "Le paramètre `audio` de la requête" } }
    - { id: input, text: { en: "An `input_audio` part of the user message", fr: "Une partie `input_audio` du message utilisateur" } }
    - { id: transcript, text: "`message.audio.transcript`" }
    - { id: data, text: "`message.audio.data`" }
  targets:
    - id: t1
      text: { en: "Sets the voice and the file format of the spoken answer", fr: "Définit la voix et le format de fichier de la réponse parlée" }
    - id: t2
      text: { en: "Carries the recording of the user's question", fr: "Porte l'enregistrement de la question de l'utilisateur" }
    - id: t3
      text: { en: "Contains the spoken answer as base64-encoded audio", fr: "Contient la réponse parlée sous forme d'audio encodé en base64" }
    - id: t4
      text: { en: "Contains the words of the spoken answer as text", fr: "Contient les mots de la réponse parlée sous forme de texte" }
answer:
  mapping: { t1: audio, t2: input, t3: data, t4: transcript }
explanation:
  correct:
    en: |
      In the request, `audio` gives the voice and the format of the spoken answer, and the recording travels as an `input_audio` part with its base64 data. In the response, `message.audio.data` is the generated audio in base64 and `message.audio.transcript` is its text. `modalities` only states which kinds of output the model must return.
    fr: |
      Dans la requête, `audio` donne la voix et le format de la réponse parlée, et l'enregistrement est transmis sous la forme d'une partie `input_audio` avec ses données en base64. Dans la réponse, `message.audio.data` est l'audio généré en base64 et `message.audio.transcript` en est le texte. `modalities` indique seulement quels types de sortie le modèle doit renvoyer.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
