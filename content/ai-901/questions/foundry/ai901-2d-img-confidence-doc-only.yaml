id: ai901-2d-img-confidence-doc-only
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application of Fabrikam analyzes invoices by using a document analyzer of Azure Content Understanding in Foundry Tools. The application sends a field to a reviewer when the confidence score of the field is below 0.8.

    Fabrikam reuses the same logic for a custom image analyzer that inspects photos of store shelves. The fields of the image results have no confidence score.

    What is the cause?
  fr: |
    Une application de Fabrikam analyse des factures à l'aide d'un analyseur de documents d'Azure Content Understanding dans Foundry Tools. L'application envoie un champ à un réviseur lorsque le score de confiance du champ est inférieur à 0,8.

    Fabrikam réutilise la même logique pour un analyseur d'images personnalisé qui inspecte des photos de rayons de magasin. Les champs des résultats d'images n'ont aucun score de confiance.

    Quelle en est la cause ?
body:
  options:
  - id: a
    text:
      en: Confidence scores are returned only for photos in the PNG format.
      fr: Les scores de confiance sont renvoyés uniquement pour les photos au format PNG.
  - id: b
    text:
      en: Confidence scores are returned only by document analyzers.
      fr: Les scores de confiance sont renvoyés uniquement par les analyseurs de documents.
  - id: c
    text:
      en: Confidence scores are returned only for fields of the number type.
      fr: Les scores de confiance sont renvoyés uniquement pour les champs de type nombre.
  - id: d
    text:
      en: Confidence scores are returned only by prebuilt analyzers.
      fr: Les scores de confiance sont renvoyés uniquement par les analyseurs prédéfinis.
answer:
  optionId: b
explanation:
  correct:
    en: Only document analyzers support confidence scores and grounding; the setting that enables them applies to document analyzers. The fields of an image analyzer are generated or classified by the model and come without a score, so the review logic needs another criterion.
    fr: 'Seuls les analyseurs de documents prennent en charge les scores de confiance et l''ancrage ; le paramètre qui les active s''applique aux analyseurs de documents. Les champs d''un analyseur d''images sont générés ou classifiés par le modèle et arrivent sans score : la logique de révision a donc besoin d''un autre critère.'
  options:
    a:
      en: The file format of the image doesn't change the fact that image fields have no confidence score.
      fr: Le format de fichier de l'image ne change rien au fait que les champs d'image n'ont pas de score de confiance.
    c:
      en: For documents, confidence is available for every field type, not only for numbers.
      fr: Pour les documents, la confiance est disponible pour tous les types de champs, pas seulement pour les nombres.
    d:
      en: A custom document analyzer can return confidence scores too; the limit is the type of content.
      fr: Un analyseur de documents personnalisé peut lui aussi renvoyer des scores de confiance ; la limite tient au type de contenu.
references:
- title: Best practices for using Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
- title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
