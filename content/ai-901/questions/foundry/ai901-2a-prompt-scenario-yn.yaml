id: ai901-2a-prompt-scenario-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    An application sends the following prompts to a model.

    ```text
    System: You are an assistant for Margie's Travel. Answer only questions about flights and hotels. Reply in at most three bullet points. If you don't know, say so.
    User: Which documents do I need for a flight to Canada?
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application envoie les invites suivantes à un modèle.

    ```text
    Système : Vous êtes un assistant de Margie's Travel. Ne répondez qu'aux questions sur les vols et les hôtels. Répondez en trois puces au maximum. Si vous ne savez pas, dites-le.
    Utilisateur : De quels documents ai-je besoin pour un vol vers le Canada ?
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The system prompt limits the topics that the model should answer.", fr: "L'invite système limite les sujets auxquels le modèle doit répondre." } }
    - { id: s2, text: { en: "The format of the response is specified in the user prompt.", fr: "Le format de la réponse est précisé dans l'invite utilisateur." } }
    - { id: s3, text: { en: "The system prompt tells the model what to do when it lacks an answer.", fr: "L'invite système indique au modèle quoi faire quand il n'a pas de réponse." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The system prompt gives the model a role, limits its scope to flights and hotels, fixes the format (three bullet points at most) and tells it to say so when it doesn't know. The user prompt contains only the question about the documents; it says nothing about the format.
    fr: |
      L'invite système donne un rôle au modèle, limite son périmètre aux vols et aux hôtels, fixe le format (trois puces au maximum) et lui demande de le dire quand il ne sait pas. L'invite utilisateur ne contient que la question sur les documents ; elle ne dit rien du format.
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
  - title: "System message design"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/advanced-prompt-engineering
