id: ai901-2b-audio-api-choice
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python application records a complete question from the user, sends the recording to a deployed `gpt-audio` model and waits for the complete answer. `client` is an `AzureOpenAI` object.

    Which method should the application call to send the recording and receive the answer?
  fr: |
    Une application Python enregistre une question complète de l'utilisateur, envoie l'enregistrement à un modèle `gpt-audio` déployé et attend la réponse complète. `client` est un objet `AzureOpenAI`.

    Quelle méthode l'application doit-elle appeler pour envoyer l'enregistrement et recevoir la réponse ?
body:
  options:
    - { id: a, text: "`client.audio.transcriptions.create`" }
    - { id: b, text: "`client.audio.speech.create`" }
    - { id: c, text: "`client.chat.completions.create`" }
    - { id: d, text: "`client.embeddings.create`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `gpt-audio` models bring the audio modality to the existing Chat Completions API. The recording is added to the user message of `chat.completions.create`, and the completion contains the answer of the model.
    fr: |
      Les modèles `gpt-audio` apportent la modalité audio à l'API Chat Completions existante. L'enregistrement est ajouté au message utilisateur de `chat.completions.create`, et la complétion contient la réponse du modèle.
  options:
    a:
      en: "`audio.transcriptions.create` is used with a speech-to-text model and returns only the transcript of the audio, not an answer to the question."
      fr: "`audio.transcriptions.create` s'utilise avec un modèle de reconnaissance vocale et renvoie seulement la transcription de l'audio, pas une réponse à la question."
    b:
      en: "`audio.speech.create` is used with a text-to-speech model: it turns a given text into audio and takes no recording as input."
      fr: "`audio.speech.create` s'utilise avec un modèle de synthèse vocale : il transforme un texte donné en audio et ne prend aucun enregistrement en entrée."
    d:
      en: "`embeddings.create` returns numeric vectors that represent a text."
      fr: "`embeddings.create` renvoie des vecteurs numériques qui représentent un texte."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
  - title: Transcribe speech
    url: https://learn.microsoft.com/en-us/training/modules/develop-generative-ai-audio-apps/3-develop-audio-chat-app
