id: ai901-2b-agent-knowledge-manuals
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are building an agent in the Foundry portal for the support team of Fabrikam. The agent must answer questions from the content of 40 internal product manuals in PDF format, and each answer must show which manual it comes from.

    What should you add to the agent?
  fr: |
    Vous créez un agent dans le portail Foundry pour l'équipe de support de Fabrikam. L'agent doit répondre aux questions à partir du contenu de 40 manuels de produits internes au format PDF, et chaque réponse doit indiquer le manuel dont elle provient.

    Que devez-vous ajouter à l'agent ?
body:
  options:
    - { id: a, text: { en: "The Web search tool", fr: "L'outil Web search" } }
    - { id: b, text: { en: "The manuals, as knowledge", fr: "Les manuels, en tant que connaissances" } }
    - { id: c, text: { en: "The Code interpreter tool", fr: "L'outil Code interpreter" } }
    - { id: d, text: { en: "The titles of the manuals, in the instructions", fr: "Les titres des manuels, dans les instructions" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Knowledge gives the agent context: Foundry ingests and indexes the uploaded documents, searches them when a question arrives and grounds the response in what it retrieved. A response that uses knowledge includes a citation to its source, which shows the manual it comes from.
    fr: |
      Les connaissances donnent du contexte à l'agent : Foundry ingère et indexe les documents chargés, y effectue une recherche à chaque question et ancre la réponse dans le contenu récupéré. Une réponse qui utilise des connaissances inclut une citation de sa source, ce qui indique le manuel dont elle provient.
  options:
    a:
      en: "Web search retrieves public information from the web, not the content of internal PDF files."
      fr: "Web search récupère des informations publiques sur le web, pas le contenu de fichiers PDF internes."
    c:
      en: "Code interpreter runs Python code in a sandbox, for calculations or charts; it isn't a way to ground answers in a set of documents."
      fr: "Code interpreter exécute du code Python dans un bac à sable, pour des calculs ou des graphiques ; ce n'est pas un moyen d'ancrer les réponses dans un ensemble de documents."
    d:
      en: "The instructions set the role and the rules of the agent. Listing titles there doesn't give the agent the content of the manuals."
      fr: "Les instructions fixent le rôle et les règles de l'agent. Y lister des titres ne donne pas à l'agent le contenu des manuels."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: File search tool for Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/file-search
