id: ai901-2c-visionapp-deployment-name
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In a Foundry resource, you deploy the GPT-4.1-mini model and name the deployment `shelf-vision`. A Python application calls `client.responses.create()` to analyze images with this deployment.

    Which value should the application pass in the `model` parameter?
  fr: |
    Dans une ressource Foundry, vous déployez le modèle GPT-4.1-mini et nommez le déploiement `shelf-vision`. Une application Python appelle `client.responses.create()` pour analyser des images avec ce déploiement.

    Quelle valeur l'application doit-elle transmettre dans le paramètre `model` ?
body:
  options:
    - id: a
      text: "`gpt-4.1-mini`"
    - id: b
      text:
        en: "The endpoint of the Foundry resource"
        fr: "Le point de terminaison de la ressource Foundry"
    - id: c
      text: "`shelf-vision`"
    - id: d
      text:
        en: "The key of the Foundry resource"
        fr: "La clé de la ressource Foundry"
answer:
  optionId: c
explanation:
  correct:
    en: |
      A deployed model has a base name, here GPT-4.1-mini, and a deployment name that you assign. The `model` parameter of the request takes the deployment name, so the application passes `shelf-vision`.
    fr: |
      Un modèle déployé a un nom de base, ici GPT-4.1-mini, et un nom de déploiement que vous lui attribuez. Le paramètre `model` de la requête reçoit le nom du déploiement : l'application transmet donc `shelf-vision`.
  options:
    a:
      en: "`gpt-4.1-mini` is the base name of the model, not the name given to this deployment."
      fr: "`gpt-4.1-mini` est le nom de base du modèle, pas le nom donné à ce déploiement."
    b:
      en: "The endpoint is given to the client as `base_url`; it identifies the resource, not the deployment."
      fr: "Le point de terminaison est fourni au client en tant que `base_url` ; il identifie la ressource, pas le déploiement."
    d:
      en: "The key is given to the client as `api_key` to authenticate the application."
      fr: "La clé est fournie au client en tant que `api_key` pour authentifier l'application."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
