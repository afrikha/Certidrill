id: ai901-2a-model-arg-deployment
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Foundry resource named **contoso-ai** contains a project named **proj-support**. In the project, the **gpt-4.1** model is deployed under the deployment name **chat-prod**.

    You write a chat client that calls `responses.create`.

    Which value should you pass in the `model` argument to route the requests to that deployment?
  fr: |
    Une ressource Foundry nommée **contoso-ai** contient un projet nommé **proj-support**. Dans le projet, le modèle **gpt-4.1** est déployé sous le nom de déploiement **chat-prod**.

    Vous écrivez un client de conversation qui appelle `responses.create`.

    Quelle valeur devez-vous passer dans l'argument `model` pour acheminer les requêtes vers ce déploiement ?
body:
  options:
    - { id: a, text: "contoso-ai" }
    - { id: b, text: "proj-support" }
    - { id: c, text: "gpt-4.1" }
    - { id: d, text: "chat-prod" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      During inference, the `model` parameter takes the deployment name, which routes the request to that deployment. The deployment name defaults to the model name but can differ from it, as it does here.
    fr: |
      Lors de l'inférence, le paramètre `model` reçoit le nom du déploiement, ce qui achemine la requête vers ce déploiement. Le nom du déploiement est par défaut celui du modèle, mais il peut en différer, comme ici.
  options:
    a:
      en: "The name of the Foundry resource is part of the endpoint URL, not a value of `model`."
      fr: "Le nom de la ressource Foundry fait partie de l'URL du point de terminaison ; ce n'est pas une valeur de `model`."
    b:
      en: "The name of the project is part of the project endpoint, not a value of `model`."
      fr: "Le nom du projet fait partie du point de terminaison du projet ; ce n'est pas une valeur de `model`."
    c:
      en: "gpt-4.1 is the name of the model. Here the deployment has another name, and the request must name the deployment."
      fr: "gpt-4.1 est le nom du modèle. Ici, le déploiement porte un autre nom, et la requête doit nommer le déploiement."
references:
  - title: "Deploy Microsoft Foundry Models in the Foundry portal"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/deploy-foundry-models
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
