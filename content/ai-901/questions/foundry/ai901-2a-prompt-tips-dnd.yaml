id: ai901-2a-prompt-tips-dnd
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You improve the user prompt "Explain how vaccines work" in three ways.

    Which tip for better prompts does each change apply? To answer, drag the appropriate tips to the correct changes. Each tip may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous améliorez de trois façons l'invite utilisateur « Expliquez comment fonctionnent les vaccins ».

    Quel conseil pour de meilleures invites chaque modification applique-t-elle ? Pour répondre, faites glisser les conseils appropriés vers les modifications correspondantes. Chaque conseil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: clr, text: { en: "Be clear and specific", fr: "Être clair et précis" } }
    - { id: ctx, text: { en: "Add context", fr: "Ajouter du contexte" } }
    - { id: exa, text: { en: "Use examples", fr: "Utiliser des exemples" } }
    - { id: str, text: { en: "Ask for structure", fr: "Demander une structure" } }
  targets:
    - { id: t1, text: { en: "You add: \"The readers are first-year nursing students.\"", fr: "Vous ajoutez : « Les lecteurs sont des étudiants infirmiers de première année. »" } }
    - { id: t2, text: { en: "You add: \"Present the result as a table with two columns.\"", fr: "Vous ajoutez : « Présentez le résultat sous forme de tableau à deux colonnes. »" } }
    - { id: t3, text: { en: "You add a short paragraph written in the style that you want the model to imitate.", fr: "Vous ajoutez un court paragraphe rédigé dans le style que le modèle doit imiter." } }
answer:
  mapping: { t1: ctx, t2: str, t3: exa }
explanation:
  correct:
    en: |
      Mentioning the audience adds context. Requesting a table asks for structure, like bullet points or numbered lists would. Providing a sample of the style that you want uses an example. Being clear and specific is about replacing vague language with an explicit instruction or question, which none of the three changes does.
    fr: |
      Mentionner le public ajoute du contexte. Demander un tableau revient à demander une structure, comme le feraient des puces ou une liste numérotée. Fournir un échantillon du style voulu, c'est utiliser un exemple. Être clair et précis consiste à remplacer une formulation vague par une instruction ou une question explicite, ce que ne fait aucune des trois modifications.
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
