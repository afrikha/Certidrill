id: ai901-2c-imagegen-reverse-sentence
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentence, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter la phrase, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Image-generation models do the reverse of image analysis: they take [[in]] and produce [[out]].
    fr: |
      Les modèles de génération d'images font l'inverse de l'analyse d'images : ils reçoivent [[in]] et produisent [[out]].
  slots:
    - id: in
      options:
        - id: photo
          text:
            en: "a photo and a question"
            fr: "une photo et une question"
        - id: audio
          text:
            en: "an audio recording"
            fr: "un enregistrement audio"
        - id: desc
          text:
            en: "a text description"
            fr: "une description en texte"
    - id: out
      options:
        - id: img
          text:
            en: "an image"
            fr: "une image"
        - id: answer
          text:
            en: "a written answer"
            fr: "une réponse écrite"
        - id: transcript
          text:
            en: "a transcription"
            fr: "une transcription"
answer:
  values:
    in: desc
    out: img
explanation:
  correct:
    en: |
      Image analysis matches what an image shows to text; image generation goes the other way, from a text description to an image that corresponds to it. A photo with a question and a written answer describe image analysis, and a recording with a transcription describe speech recognition.
    fr: |
      L'analyse d'images fait correspondre du texte à ce que montre une image ; la génération d'images va dans l'autre sens, d'une description en texte vers une image qui lui correspond. Une photo avec une question et une réponse écrite décrivent l'analyse d'images, et un enregistrement avec une transcription décrivent la reconnaissance vocale.
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
