id: ai901-2b-text-language-package
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are building a Python application that detects the language of customer messages by using the Azure Language SDK.

    Which package should you install?
  fr: |
    Vous créez une application Python qui détecte la langue de messages de clients à l'aide du SDK Azure Language.

    Quel package devez-vous installer ?
body:
  options:
    - { id: a, text: "`openai`" }
    - { id: b, text: "`azure-ai-projects`" }
    - { id: c, text: "`azure-ai-textanalytics`" }
    - { id: d, text: "`azure-cognitiveservices-speech`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Azure Language SDK for Python is the `azure-ai-textanalytics` package. It provides the `TextAnalyticsClient` class, whose methods such as `detect_language` and `recognize_pii_entities` call Azure Language.
    fr: |
      Le SDK Azure Language pour Python est le package `azure-ai-textanalytics`. Il fournit la classe `TextAnalyticsClient`, dont les méthodes comme `detect_language` et `recognize_pii_entities` appellent Azure Language.
  options:
    a:
      en: "`openai` is the library used to call a deployed generative model, for example through the Responses API."
      fr: "`openai` est la bibliothèque utilisée pour appeler un modèle génératif déployé, par exemple par l'intermédiaire de l'API Responses."
    b:
      en: "`azure-ai-projects` is the Foundry SDK that connects to a project and its agents."
      fr: "`azure-ai-projects` est le SDK Foundry qui se connecte à un projet et à ses agents."
    d:
      en: "`azure-cognitiveservices-speech` is the Speech SDK, for speech recognition and synthesis."
      fr: "`azure-cognitiveservices-speech` est le SDK Speech, pour la reconnaissance et la synthèse vocales."
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
  - title: Azure Text Analytics client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-textanalytics-readme
