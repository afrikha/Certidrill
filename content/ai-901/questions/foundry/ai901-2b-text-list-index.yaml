id: ai901-2b-text-list-index
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python application contains the following line. `client` is a `TextAnalyticsClient` object and `text` is a string.

    ```python
    result = client.detect_language([text])[0]
    ```

    Why does the line end with `[0]`?
  fr: |
    Une application Python contient la ligne suivante. `client` est un objet `TextAnalyticsClient` et `text` est une chaîne.

    ```python
    result = client.detect_language([text])[0]
    ```

    Pourquoi la ligne se termine-t-elle par `[0]` ?
body:
  options:
    - { id: a, text: { en: "The method returns languages sorted by score, and `[0]` is the least likely language.", fr: "La méthode renvoie les langues triées par score, et `[0]` est la langue la moins probable." } }
    - { id: b, text: { en: "The method returns the text split into sentences, and `[0]` is the first sentence.", fr: "La méthode renvoie le texte découpé en phrases, et `[0]` est la première phrase." } }
    - { id: c, text: { en: "The method returns a name and a code, and `[0]` is the name of the language.", fr: "La méthode renvoie un nom et un code, et `[0]` est le nom de la langue." } }
    - { id: d, text: { en: "The method returns one result per document, and `[0]` is the result of the first document.", fr: "La méthode renvoie un résultat par document, et `[0]` est le résultat du premier document." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The methods of `TextAnalyticsClient` take a list of documents, here a list with a single string, and return a list with one result for each document, in the same order. `[0]` selects the result of the only document that was sent.
    fr: |
      Les méthodes de `TextAnalyticsClient` prennent une liste de documents, ici une liste d'une seule chaîne, et renvoient une liste contenant un résultat par document, dans le même ordre. `[0]` sélectionne le résultat du seul document envoyé.
  options:
    a:
      en: "Each result describes the primary language of one document; the list isn't a ranking of candidate languages."
      fr: "Chaque résultat décrit la langue principale d'un document ; la liste n'est pas un classement de langues candidates."
    b:
      en: "Language detection doesn't split the text; it returns one result for the whole document."
      fr: "La détection de langue ne découpe pas le texte ; elle renvoie un résultat pour l'ensemble du document."
    c:
      en: "The name and the code are properties of `primary_language` in the result, read by name and not by index."
      fr: "Le nom et le code sont des propriétés de `primary_language` dans le résultat, lues par leur nom et non par un index."
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
  - title: Azure Text Analytics client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-textanalytics-readme
