id: ai901-2d-img-yn-methods
objective: "2.4.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You define the fields of a custom image analyzer in Azure Content Understanding in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez les champs d'un analyseur d'images personnalisé dans Azure Content Understanding dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A field of an image analyzer can use the `generate` method to describe the scene.
      fr: Un champ d'un analyseur d'images peut utiliser la méthode `generate` pour décrire la scène.
  - id: s2
    text:
      en: A field of an image analyzer can use the `classify` method to select one category from a list.
      fr: Un champ d'un analyseur d'images peut utiliser la méthode `classify` pour sélectionner une catégorie dans une liste.
  - id: s3
    text:
      en: A field of an image analyzer can use the `extract` method to copy a value from the image.
      fr: Un champ d'un analyseur d'images peut utiliser la méthode `extract` pour copier une valeur de l'image.
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: The generation methods supported for images are `generate` and `classify`. The `extract` method, which copies a value as it appears in the content, is supported for documents only.
    fr: Les méthodes de génération prises en charge pour les images sont `generate` et `classify`. La méthode `extract`, qui copie une valeur telle qu'elle apparaît dans le contenu, est prise en charge uniquement pour les documents.
references:
- title: Service quotas and limits - Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/service-limits
- title: What is Azure Content Understanding in Foundry Tools?
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
