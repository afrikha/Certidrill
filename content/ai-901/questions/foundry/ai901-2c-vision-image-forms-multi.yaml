id: ai901-2c-vision-image-forms-multi
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application sends prompts that contain images to a vision-enabled model deployed in Microsoft Foundry.

    In which two forms can the application provide an image in a request? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application envoie des invites contenant des images à un modèle compatible avec la vision déployé dans Microsoft Foundry.

    Sous quelles deux formes l'application peut-elle fournir une image dans une requête ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "As the path of the file on the user's device"
        fr: "Sous forme de chemin du fichier sur l'appareil de l'utilisateur"
    - id: b
      text:
        en: "As the URL of the image"
        fr: "Sous forme d'URL de l'image"
    - id: c
      text:
        en: "As a vector produced by an embedding model"
        fr: "Sous forme de vecteur produit par un modèle d'embedding"
    - id: d
      text:
        en: "As base64-encoded image data"
        fr: "Sous forme de données d'image encodées en base64"
    - id: e
      text:
        en: "As the file name written in the text of the prompt"
        fr: "Sous forme de nom de fichier écrit dans le texte de l'invite"
answer:
  optionIds: [b, d]
explanation:
  correct:
    en: |
      A request to a vision-enabled model combines a text instruction with one or more image inputs. Each image is provided either as a URL that the service can fetch or as base64-encoded image data placed in the request.
    fr: |
      Une requête envoyée à un modèle compatible avec la vision combine une instruction en texte et une ou plusieurs images en entrée. Chaque image est fournie soit sous forme d'URL que le service peut récupérer, soit sous forme de données d'image encodées en base64 placées dans la requête.
  options:
    a:
      en: "A local path means nothing to the model, which runs in Foundry and has no access to the user's device."
      fr: "Un chemin local ne signifie rien pour le modèle, qui s'exécute dans Foundry et n'a pas accès à l'appareil de l'utilisateur."
    c:
      en: "An embedding is a numeric representation for comparing meanings; a chat model doesn't take it as an image."
      fr: "Un embedding est une représentation numérique servant à comparer des sens ; un modèle de conversation ne l'accepte pas comme image."
    e:
      en: "A file name in the text gives the model no image content to look at."
      fr: "Un nom de fichier dans le texte ne donne au modèle aucun contenu d'image à examiner."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
