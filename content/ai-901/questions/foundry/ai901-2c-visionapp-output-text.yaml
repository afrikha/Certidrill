id: ai901-2c-visionapp-output-text
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python application calls `client.responses.create()` with a text instruction and an image, and stores the result in a variable named `response`.

    Which expression contains the answer of the model as text?
  fr: |
    Une application Python appelle `client.responses.create()` avec une instruction en texte et une image, et stocke le résultat dans une variable nommée `response`.

    Quelle expression contient la réponse du modèle sous forme de texte ?
body:
  options:
    - id: a
      text: "`response.id`"
    - id: b
      text: "`response.data[0].b64_json`"
    - id: c
      text: "`response.model`"
    - id: d
      text: "`response.output_text`"
answer:
  optionId: d
explanation:
  correct:
    en: |
      The Responses API returns the text generated by the model in the `output_text` property of the response. An image-analysis application therefore prints or stores `response.output_text`.
    fr: |
      L'API Responses renvoie le texte généré par le modèle dans la propriété `output_text` de la réponse. Une application d'analyse d'images affiche ou stocke donc `response.output_text`.
  options:
    a:
      en: "`response.id` is the identifier of the response, not its content."
      fr: "`response.id` est l'identifiant de la réponse, pas son contenu."
    b:
      en: "`data[0].b64_json` is where `images.generate()` returns a generated image; a Responses result has no such list."
      fr: "`data[0].b64_json` est l'endroit où `images.generate()` renvoie une image générée ; un résultat Responses n'a pas cette liste."
    c:
      en: "`response.model` names the model that produced the response."
      fr: "`response.model` nomme le modèle qui a produit la réponse."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
