id: ai901-2a-portal-steps-order
objective: "2.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription that contains no Microsoft Foundry resources.

    You need to chat with the **gpt-4.1** model in the Foundry portal.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un abonnement Azure qui ne contient aucune ressource Microsoft Foundry.

    Vous devez converser avec le modèle **gpt-4.1** dans le portail Foundry.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: agent, text: { en: "Select **Save as agent**.", fr: "Sélectionner **Save as agent**." } }
    - { id: chat, text: { en: "Enter a prompt in the chat pane of the model playground.", fr: "Saisir une invite dans le volet de conversation du terrain de jeu de modèles." } }
    - { id: deploy, text: { en: "Select **Deploy**.", fr: "Sélectionner **Deploy**." } }
    - { id: project, text: { en: "Sign in to the Foundry portal and create a project.", fr: "Se connecter au portail Foundry et créer un projet." } }
    - { id: aml, text: { en: "Create an Azure Machine Learning workspace.", fr: "Créer un espace de travail Azure Machine Learning." } }
    - { id: catalog, text: { en: "Select the model in the model catalog.", fr: "Sélectionner le modèle dans le catalogue de modèles." } }
answer:
  sequence: [project, catalog, deploy, chat]
explanation:
  correct:
    en: |
      You first sign in to the Foundry portal and create a project. You then pick the model in the model catalog and deploy it. When the deployment completes, the model playground opens and you can enter prompts.
    fr: |
      Vous vous connectez d'abord au portail Foundry et vous créez un projet. Vous choisissez ensuite le modèle dans le catalogue de modèles et vous le déployez. À la fin du déploiement, le terrain de jeu de modèles s'ouvre et vous pouvez saisir des invites.
  options:
    agent:
      en: "**Save as agent** packages the model configuration as an agent. It isn't needed to chat with the model."
      fr: "**Save as agent** empaquette la configuration du modèle sous forme d'agent. Ce n'est pas nécessaire pour converser avec le modèle."
    aml:
      en: "A Foundry project doesn't require an Azure Machine Learning workspace."
      fr: "Un projet Foundry n'exige pas d'espace de travail Azure Machine Learning."
references:
  - title: "Microsoft Foundry for AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/4-microsoft-foundry
  - title: "Microsoft Foundry Playgrounds"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
