id: ai901-2a-prompt-types-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A system prompt sets the behavior and the tone of the model for the conversation.", fr: "Une invite système fixe le comportement et le ton du modèle pour la conversation." } }
    - { id: s2, text: { en: "An application can generate a user prompt on behalf of the user.", fr: "Une application peut générer une invite utilisateur au nom de l'utilisateur." } }
    - { id: s3, text: { en: "A user prompt is where an application normally defines the constraints that apply to every response.", fr: "C'est dans une invite utilisateur qu'une application définit normalement les contraintes applicables à toutes les réponses." } }
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      System prompts set the behavior and the tone of the model, and any constraints that it should follow; the application usually sets them. User prompts request a response to a specific question or instruction, so the general constraints don't belong there. A user prompt is either typed by a person or generated by the application on the person's behalf.
    fr: |
      Les invites système fixent le comportement et le ton du modèle, ainsi que les contraintes qu'il doit respecter ; c'est généralement l'application qui les définit. Les invites utilisateur demandent une réponse à une question ou à une instruction précise : les contraintes générales n'y ont donc pas leur place. Une invite utilisateur est soit saisie par une personne, soit générée par l'application en son nom.
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
