id: ai901-2b-audio-modalities-param
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application sends a spoken prompt to a deployed audio-enabled model with a request that starts as follows.

    ```python
    completion = client.chat.completions.create(
        model="gpt-audio-mini",
        modalities=["text", "audio"],
        audio={"voice": "alloy", "format": "wav"},
        messages=messages,
    )
    ```

    What is the effect of the `modalities` argument?
  fr: |
    Une application envoie une invite vocale à un modèle déployé compatible avec l'audio, avec une requête qui commence ainsi.

    ```python
    completion = client.chat.completions.create(
        model="gpt-audio-mini",
        modalities=["text", "audio"],
        audio={"voice": "alloy", "format": "wav"},
        messages=messages,
    )
    ```

    Quel est l'effet de l'argument `modalities` ?
body:
  options:
    - { id: a, text: { en: "The model returns its answer as speech together with its text.", fr: "Le modèle renvoie sa réponse sous forme de parole accompagnée de son texte." } }
    - { id: b, text: { en: "The model rejects prompts that don't contain both text and audio.", fr: "Le modèle rejette les invites qui ne contiennent pas à la fois du texte et de l'audio." } }
    - { id: c, text: { en: "The model answers twice, once for each listed value.", fr: "Le modèle répond deux fois, une fois pour chaque valeur listée." } }
    - { id: d, text: { en: "The model translates the answer into two languages.", fr: "Le modèle traduit la réponse en deux langues." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `modalities` states what the model must return. With `["text", "audio"]`, the response contains a spoken answer, in the voice and format given by `audio`, and the text of that answer.
    fr: |
      `modalities` indique ce que le modèle doit renvoyer. Avec `["text", "audio"]`, la réponse contient une réponse parlée, dans la voix et le format donnés par `audio`, ainsi que le texte de cette réponse.
  options:
    b:
      en: "The argument describes the output, not the input: a prompt can be text only, audio only or both."
      fr: "L'argument décrit la sortie, pas l'entrée : une invite peut contenir du texte seul, de l'audio seul ou les deux."
    c:
      en: "There is one answer, delivered in two forms."
      fr: "Il y a une seule réponse, fournie sous deux formes."
    d:
      en: "A modality is a type of content, such as text or audio, not a language."
      fr: "Une modalité est un type de contenu, comme le texte ou l'audio, pas une langue."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
