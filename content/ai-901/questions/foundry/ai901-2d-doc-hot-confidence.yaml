id: ai901-2d-doc-hot-confidence
objective: "2.4.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso analyzes a supplier invoice by using the `prebuilt-invoice` analyzer of Azure Content Understanding in Foundry Tools. Some of the fields that the analyzer returns are shown in the following table.

    An application of Contoso sends a value to a reviewer when the reliability of the value is low, and processes the other values automatically.

    Answer each prompt by selecting the appropriate field.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso analyse une facture fournisseur à l'aide de l'analyseur `prebuilt-invoice` d'Azure Content Understanding dans Foundry Tools. Certains des champs renvoyés par l'analyseur figurent dans le tableau suivant.

    Une application de Contoso envoie une valeur à un réviseur lorsque la fiabilité de la valeur est faible, et traite les autres valeurs automatiquement.

    Répondez à chaque consigne en sélectionnant le champ approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
  - id: p1
    text:
      en: The value that a reviewer should check first
      fr: La valeur qu'un réviseur doit vérifier en premier
  - id: p2
    text:
      en: The value that the analyzer considers the most reliable
      fr: La valeur que l'analyseur considère comme la plus fiable
  grid:
    header:
    - en: Field
      fr: Champ
    - Type
    - en: Value
      fr: Valeur
    - en: Confidence
      fr: Confiance
    rows:
    - - text: InvoiceId
        area: id
      - text: string
      - text: INV-2041
      - text: '0.97'
    - - text: CustomerName
        area: cust
      - text: string
      - text: Contoso Ltd
      - text: '0.74'
    - - text: InvoiceDate
        area: idate
      - text: date
      - text: '2026-03-14'
      - text: '0.93'
    - - text: DueDate
        area: due
      - text: date
      - text: '2026-04-13'
      - text: '0.52'
answer:
  values:
    p1: due
    p2: id
explanation:
  correct:
    en: A confidence score is an estimate, from 0 to 1, of the reliability of an extracted value. The lowest score (0.52 for `DueDate`) marks the value to review first; the highest score (0.97 for `InvoiceId`) marks the value that can be processed automatically with the least risk.
    fr: Un score de confiance est une estimation, de 0 à 1, de la fiabilité d'une valeur extraite. Le score le plus bas (0.52 pour `DueDate`) désigne la valeur à vérifier en premier ; le score le plus élevé (0.97 pour `InvoiceId`) désigne la valeur qui peut être traitée automatiquement avec le moins de risque.
references:
- title: What is Azure Content Understanding in Foundry Tools?
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
- title: Best practices for using Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
