id: ai901-2c-vision-capabilities-yn
objective: "2.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You evaluate vision-enabled multimodal models in Microsoft Foundry.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez les modèles multimodaux compatibles avec la vision dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The model can describe the content of an image in natural language."
        fr: "Le modèle peut décrire le contenu d'une image en langage naturel."
    - id: s2
      text:
        en: "The model can answer a question about text that appears in an image."
        fr: "Le modèle peut répondre à une question sur du texte qui figure dans une image."
    - id: s3
      text:
        en: "A separate service must convert an image to text before the image is added to a prompt."
        fr: "Un service distinct doit convertir une image en texte avant que l'image soit ajoutée à une invite."
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: |
      Vision-enabled models describe images in natural language and answer questions about the objects, the text or the scene that an image shows. Because the same model processes the text and the image of a prompt together, no separate vision step is needed before the image is sent.
    fr: |
      Les modèles compatibles avec la vision décrivent des images en langage naturel et répondent à des questions sur les objets, le texte ou la scène que montre une image. Comme le même modèle traite ensemble le texte et l'image d'une invite, aucune étape de vision séparée n'est nécessaire avant l'envoi de l'image.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
