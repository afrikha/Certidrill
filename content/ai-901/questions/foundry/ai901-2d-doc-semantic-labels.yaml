id: ai901-2d-doc-semantic-labels
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders receives invoices from 40 suppliers. Depending on the supplier, the invoice number is labeled "Invoice No.", "Invoice #" or "Ref.", and some invoices print it without any label.

    You create an analyzer in Azure Content Understanding in Foundry Tools. Its schema contains a field named `InvoiceNumber`.

    You need to extract the invoice number from all the invoices. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Northwind Traders reçoit des factures de 40 fournisseurs. Selon le fournisseur, le numéro de facture porte le libellé « Invoice No. », « Invoice # » ou « Ref. », et certaines factures l'impriment sans aucun libellé.

    Vous créez un analyseur dans Azure Content Understanding dans Foundry Tools. Son schéma contient un champ nommé `InvoiceNumber`.

    Vous devez extraire le numéro de facture de toutes les factures. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
  - id: a
    text:
      en: Create one analyzer for each supplier layout.
      fr: Créer un analyseur pour chaque disposition de fournisseur.
  - id: b
    text:
      en: Add one field to the schema for each possible label.
      fr: Ajouter au schéma un champ pour chaque libellé possible.
  - id: c
    text:
      en: Run the `prebuilt-read` analyzer and search the text for each label.
      fr: Exécuter l'analyseur `prebuilt-read` et rechercher chaque libellé dans le texte.
  - id: d
    text:
      en: Use the same analyzer and the single field for all the invoices.
      fr: Utiliser le même analyseur et le champ unique pour toutes les factures.
answer:
  optionId: d
explanation:
  correct:
    en: 'A schema is applied semantically: the analyzer looks for the meaning of a value, not for a fixed label or position. "Invoice No.", "Invoice #" or a number without a label can all fill the same `InvoiceNumber` field, so one analyzer handles every supplier.'
    fr: 'Un schéma s''applique de façon sémantique : l''analyseur cherche le sens d''une valeur, pas un libellé ou une position fixes. « Invoice No. », « Invoice # » ou un numéro sans libellé peuvent tous remplir le même champ `InvoiceNumber` : un seul analyseur traite donc tous les fournisseurs.'
  options:
    a:
      en: One analyzer per layout multiplies the work; semantic matching makes it unnecessary.
      fr: Un analyseur par disposition multiplie le travail ; l'application sémantique du schéma le rend inutile.
    b:
      en: A field describes a piece of information, not a label; one field per label would split the same value across several fields.
      fr: Un champ décrit une information, pas un libellé ; un champ par libellé répartirait la même valeur entre plusieurs champs.
    c:
      en: '`prebuilt-read` only returns the text. Searching for labels is custom code to maintain, and it fails for invoices without a label.'
      fr: '`prebuilt-read` renvoie seulement le texte. La recherche des libellés est du code à maintenir, et elle échoue pour les factures sans libellé.'
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
