id: ai901-2b-client-sdk-package
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are preparing a Python environment for a client application that connects to a Foundry project and calls an agent.

    Which package provides the `AIProjectClient` class?
  fr: |
    Vous préparez un environnement Python pour une application cliente qui se connecte à un projet Foundry et appelle un agent.

    Quel package fournit la classe `AIProjectClient` ?
body:
  options:
    - { id: a, text: "`azure-identity`" }
    - { id: b, text: "`azure-ai-projects`" }
    - { id: c, text: "`azure-ai-textanalytics`" }
    - { id: d, text: "`azure-cognitiveservices-speech`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `AIProjectClient` is the project client of the Foundry SDK, in the `azure-ai-projects` package. The application uses it to connect to the project, retrieve the agent and get the OpenAI-compatible client that sends the requests.
    fr: |
      `AIProjectClient` est le client de projet du SDK Foundry, dans le package `azure-ai-projects`. L'application l'utilise pour se connecter au projet, récupérer l'agent et obtenir le client compatible OpenAI qui envoie les requêtes.
  options:
    a:
      en: "`azure-identity` provides `DefaultAzureCredential`, which authenticates the application; it doesn't contain the project client."
      fr: "`azure-identity` fournit `DefaultAzureCredential`, qui authentifie l'application ; il ne contient pas le client de projet."
    c:
      en: "`azure-ai-textanalytics` is the Azure Language SDK, with `TextAnalyticsClient`."
      fr: "`azure-ai-textanalytics` est le SDK Azure Language, avec `TextAnalyticsClient`."
    d:
      en: "`azure-cognitiveservices-speech` is the Speech SDK, for speech recognition and synthesis."
      fr: "`azure-cognitiveservices-speech` est le SDK Speech, pour la reconnaissance et la synthèse vocales."
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
