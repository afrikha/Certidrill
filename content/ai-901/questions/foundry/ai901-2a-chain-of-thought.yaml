id: ai901-2a-chain-of-thought
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You use a chat model that is not a reasoning model to solve multi-step word problems about delivery costs.

    The final results are often wrong, and you can't see how the model reached them.

    Which technique should you apply to the prompt?
  fr: |
    Vous utilisez un modèle de conversation, qui n'est pas un modèle de raisonnement, pour résoudre des problèmes en plusieurs étapes sur des coûts de livraison.

    Les résultats finaux sont souvent faux, et vous ne voyez pas comment le modèle y est parvenu.

    Quelle technique devez-vous appliquer à l'invite ?
body:
  options:
    - { id: a, text: { en: "Instruct the model to answer with a single number and no other text.", fr: "Demander au modèle de répondre par un seul nombre, sans autre texte." } }
    - { id: b, text: { en: "Instruct the model to proceed step by step and to show all the steps.", fr: "Demander au modèle de procéder étape par étape et de montrer toutes les étapes." } }
    - { id: c, text: { en: "Remove the examples so that the prompt becomes a zero-shot prompt.", fr: "Retirer les exemples pour que l'invite devienne une invite sans exemple (zero-shot)." } }
    - { id: d, text: { en: "Replace the system prompt with a longer description of the company.", fr: "Remplacer l'invite système par une description plus longue de l'entreprise." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Chain of thought prompting instructs a non-reasoning model to work step by step and to present every step. This reduces the risk of an inaccurate result and makes the response easier to assess.
    fr: |
      La chaîne de pensée demande à un modèle qui n'est pas un modèle de raisonnement de travailler étape par étape et de présenter chaque étape. Cela réduit le risque de résultat inexact et rend la réponse plus facile à évaluer.
  options:
    a:
      en: "A bare number hides the reasoning completely and does nothing to make the calculation more accurate."
      fr: "Un nombre seul masque entièrement le raisonnement et ne rend en rien le calcul plus exact."
    c:
      en: "Removing examples gives the model less guidance about the expected result."
      fr: "Retirer les exemples donne au modèle moins d'indications sur le résultat attendu."
    d:
      en: "A description of the company adds context about the business, not a method for solving a multi-step problem."
      fr: "Une description de l'entreprise ajoute du contexte sur l'activité, pas une méthode pour résoudre un problème en plusieurs étapes."
references:
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
