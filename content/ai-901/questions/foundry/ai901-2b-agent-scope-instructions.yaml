id: ai901-2b-agent-scope-instructions
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You test an agent named **rail-helper** in the agents playground of the Foundry portal. The agent is meant to answer only questions about train travel, but during your tests it also answers questions about cooking and sports.

    What should you do?
  fr: |
    Vous testez un agent nommé **rail-helper** dans le terrain de jeu des agents du portail Foundry. L'agent est censé répondre uniquement aux questions sur les voyages en train, mais pendant vos tests il répond aussi à des questions sur la cuisine et le sport.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Edit the instructions of the agent.", fr: "Modifier les instructions de l'agent." } }
    - { id: b, text: { en: "Upload a train timetable as knowledge.", fr: "Charger des horaires de train en tant que connaissances." } }
    - { id: c, text: { en: "Remove every tool from the agent.", fr: "Retirer tous les outils de l'agent." } }
    - { id: d, text: { en: "Select a smaller model for the agent.", fr: "Sélectionner un modèle plus petit pour l'agent." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The instructions are the system prompt of the agent: they define its role, its behavior and its constraints. Limiting the agent to one subject, and telling it to decline anything else, is a rule that belongs in the instructions.
    fr: |
      Les instructions sont l'invite système de l'agent : elles définissent son rôle, son comportement et ses contraintes. Limiter l'agent à un sujet, et lui dire de refuser tout le reste, est une règle qui a sa place dans les instructions.
  options:
    b:
      en: "Knowledge adds context to ground the answers about trains; it doesn't stop the agent from answering other subjects."
      fr: "Les connaissances ajoutent du contexte pour ancrer les réponses sur les trains ; elles n'empêchent pas l'agent de répondre sur d'autres sujets."
    c:
      en: "Tools are actions. Without tools, the model still answers general questions from what it learned in training."
      fr: "Les outils sont des actions. Sans outils, le modèle répond encore aux questions générales à partir de ce qu'il a appris à l'entraînement."
    d:
      en: "A smaller model changes cost and capability, not the scope that the agent is allowed to cover."
      fr: "Un modèle plus petit change le coût et les capacités, pas le périmètre que l'agent est autorisé à couvrir."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
