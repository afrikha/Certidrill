id: ai901-2d-img-multi-true
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to extract information from photos by using a custom image analyzer in Azure Content Understanding in Foundry Tools.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'extraire des informations de photos à l'aide d'un analyseur d'images personnalisé dans Azure Content Understanding dans Foundry Tools.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Every field of the schema must use the `extract` method.
      fr: Chaque champ du schéma doit utiliser la méthode `extract`.
  - id: b
    text:
      en: A generative model fills in the fields from what the image shows.
      fr: Un modèle génératif remplit les champs d'après ce que montre l'image.
  - id: c
    text:
      en: The analyzer returns an edited copy of each image.
      fr: L'analyseur renvoie une copie modifiée de chaque image.
  - id: d
    text:
      en: The analyzer must be trained with labeled images before its first use.
      fr: L'analyseur doit être entraîné avec des images étiquetées avant sa première utilisation.
  - id: e
    text:
      en: A schema can combine fields of different types, such as a number and a string.
      fr: Un schéma peut associer des champs de types différents, comme un nombre et une chaîne.
answer:
  optionIds:
  - b
  - e
explanation:
  correct:
    en: For images, the values of the fields are produced by a generative model from the visual content. A schema declares a type for each field (string, number, boolean, date, array or object), so it can mix, for example, a count and a description.
    fr: 'Pour les images, les valeurs des champs sont produites par un modèle génératif à partir du contenu visuel. Un schéma déclare un type pour chaque champ (chaîne, nombre, booléen, date, tableau ou objet) : il peut donc associer, par exemple, un nombre d''objets et une description.'
  options:
    a:
      en: The `extract` method is supported for documents only; image fields use `generate` or `classify`.
      fr: La méthode `extract` est prise en charge uniquement pour les documents ; les champs d'image utilisent `generate` ou `classify`.
    c:
      en: The analyzer returns data about the image, not a new version of the image.
      fr: L'analyseur renvoie des données sur l'image, pas une nouvelle version de l'image.
    d:
      en: 'No training is required: the analyzer works from the schema and its descriptions.'
      fr: 'Aucun entraînement n''est requis : l''analyseur travaille à partir du schéma et de ses descriptions.'
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
- title: Service quotas and limits - Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/service-limits
