id: ai901-2d-doc-schema-true
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to extract data from supplier forms by using a custom analyzer in Azure Content Understanding in Foundry Tools.

    Which two statements about the schema of the analyzer are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'extraire des données de formulaires fournisseurs à l'aide d'un analyseur personnalisé dans Azure Content Understanding dans Foundry Tools.

    Quelles sont les deux affirmations vraies à propos du schéma de l'analyseur ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: Each field must include the page coordinates of the value to read.
      fr: Chaque champ doit inclure les coordonnées de page de la valeur à lire.
  - id: b
    text:
      en: A field can be a collection whose items contain their own subfields.
      fr: Un champ peut être une collection dont les éléments contiennent leurs propres sous-champs.
  - id: c
    text:
      en: The schema applies only to the first page of each form.
      fr: Le schéma s'applique uniquement à la première page de chaque formulaire.
  - id: d
    text:
      en: A field is filled even when the label printed on the form differs from the field name.
      fr: Un champ est rempli même lorsque le libellé imprimé sur le formulaire diffère du nom du champ.
  - id: e
    text:
      en: The schema must be defined again for every form that is submitted.
      fr: Le schéma doit être redéfini pour chaque formulaire envoyé.
answer:
  optionIds:
  - b
  - d
explanation:
  correct:
    en: A schema supports nested fields and collections, for example a list of items in which each item has a description and a price. It is applied semantically, so a value is found even when its label differs from the field name or is missing.
    fr: 'Un schéma prend en charge les champs imbriqués et les collections, par exemple une liste d''articles dont chaque élément a une description et un prix. Il s''applique de façon sémantique : une valeur est trouvée même lorsque son libellé diffère du nom du champ ou est absent.'
  options:
    a:
      en: A field has a name, a type and a description; the analyzer finds the value by its meaning, not by coordinates.
      fr: Un champ a un nom, un type et une description ; l'analyseur trouve la valeur par son sens, pas par des coordonnées.
    c:
      en: The analyzer processes the whole document, not only its first page.
      fr: L'analyseur traite l'ensemble du document, pas uniquement sa première page.
    e:
      en: The schema belongs to the analyzer, which applies it consistently to all the content that it receives.
      fr: Le schéma appartient à l'analyseur, qui l'applique de façon cohérente à tout le contenu qu'il reçoit.
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
