id: ai901-2b-agent-yn-web-search
objective: "2.1.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You add the Web search tool to an agent in Microsoft Foundry so that the agent can answer questions about recent public events.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez l'outil Web search à un agent dans Microsoft Foundry pour que l'agent puisse répondre à des questions sur des événements publics récents.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The tool searches the files that you uploaded to the agent.
        fr: L'outil effectue ses recherches dans les fichiers que vous avez chargés pour l'agent.
    - id: s2
      text:
        en: Responses that use the tool include citations with the URLs of their sources.
        fr: Les réponses qui utilisent l'outil incluent des citations avec les URL de leurs sources.
    - id: s3
      text:
        en: General web search requires that you first create a separate Bing resource and connect it to the project.
        fr: La recherche web générale exige que vous créiez d'abord une ressource Bing distincte et que vous la connectiez au projet.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The Web search tool retrieves real-time information from the public web and grounds the response in it; uploaded files are searched by file search, not by web search. Responses carry URL citations. General web search needs no separate Bing resource or project connection; only search restricted to chosen domains uses a Grounding with Bing Custom Search connection.
    fr: |
      L'outil Web search récupère en temps réel des informations du web public et y ancre la réponse ; les fichiers chargés sont interrogés par la recherche de fichiers, pas par la recherche web. Les réponses portent des citations d'URL. La recherche web générale ne demande ni ressource Bing distincte ni connexion de projet ; seule la recherche limitée à des domaines choisis utilise une connexion Grounding with Bing Custom Search.
references:
  - title: Use web search tool in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/web-search
