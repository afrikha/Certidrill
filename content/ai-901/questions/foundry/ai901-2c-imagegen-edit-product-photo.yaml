id: ai901-2c-imagegen-edit-product-photo
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has photos of its products. The marketing team wants a new version of each photo in which the background is replaced by a beach while the product itself stays unchanged.

    Which model should the team use?
  fr: |
    Proseware possède des photos de ses produits. L'équipe marketing veut une nouvelle version de chaque photo dans laquelle l'arrière-plan est remplacé par une plage, alors que le produit lui-même reste inchangé.

    Quel modèle l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: "GPT-4.1"
    - id: b
      text: "text-embedding-3-small"
    - id: c
      text: "Sora 1"
    - id: d
      text: "GPT-Image-1.5"
answer:
  optionId: d
explanation:
  correct:
    en: |
      The expected output is a new image, so an image-generation model is required even though a photo is provided as input. GPT-Image-1.5 supports image-to-image generation and precise image editing, which is what replacing a background while keeping the subject needs.
    fr: |
      La sortie attendue est une nouvelle image : il faut donc un modèle de génération d'images, même si une photo est fournie en entrée. GPT-Image-1.5 prend en charge la génération d'image à image et la modification précise d'images, ce qu'exige le remplacement d'un arrière-plan en conservant le sujet.
  options:
    a:
      en: "GPT-4.1 accepts images in a prompt, but it answers in text: it can describe the photo, not return an edited one."
      fr: "GPT-4.1 accepte des images dans une invite, mais il répond en texte : il peut décrire la photo, pas en renvoyer une version modifiée."
    b:
      en: "An embedding model returns vectors, not images."
      fr: "Un modèle d'embedding renvoie des vecteurs, pas des images."
    c:
      en: "Sora 1 generates video clips; the team wants still photos."
      fr: "Sora 1 génère des clips vidéo ; l'équipe veut des photos fixes."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
