id: ai901-2d-doc-markdown-search
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys analyzes supplier contracts by using Azure Content Understanding in Foundry Tools. The full text of each contract, with its headings and tables, must be loaded into a search index that a chat application queries.

    Which part of the analysis result should you load into the index?
  fr: |
    Tailspin Toys analyse des contrats fournisseurs à l'aide d'Azure Content Understanding dans Foundry Tools. Le texte complet de chaque contrat, avec ses titres et ses tableaux, doit être chargé dans un index de recherche qu'une application de conversation interroge.

    Quelle partie du résultat de l'analyse devez-vous charger dans l'index ?
body:
  options:
  - id: a
    text:
      en: The confidence score of each field
      fr: Le score de confiance de chaque champ
  - id: b
    text:
      en: The Markdown representation of the content
      fr: La représentation Markdown du contenu
  - id: c
    text:
      en: The identifier of the analyzer
      fr: L'identificateur de l'analyseur
  - id: d
    text:
      en: The list of the field names of the schema
      fr: La liste des noms de champs du schéma
answer:
  optionId: b
explanation:
  correct:
    en: An analysis result contains the content as Markdown, which keeps the text and its structure and is intended for search and retrieval scenarios. The fields, returned as JSON that matches the schema, serve automation and analytics instead.
    fr: Un résultat d'analyse contient le contenu en Markdown, qui conserve le texte et sa structure et qui est destiné aux scénarios de recherche et de récupération. Les champs, renvoyés en JSON conforme au schéma, servent plutôt à l'automatisation et à l'analytique.
  options:
    a:
      en: A confidence score estimates the reliability of one field value; it isn't the text of the contract.
      fr: Un score de confiance estime la fiabilité d'une valeur de champ ; ce n'est pas le texte du contrat.
    c:
      en: The analyzer identifier only says which analyzer produced the result.
      fr: L'identificateur de l'analyseur indique seulement quel analyseur a produit le résultat.
    d:
      en: Field names describe the schema, not the content of a given contract.
      fr: Les noms de champs décrivent le schéma, pas le contenu d'un contrat donné.
references:
- title: What is Azure Content Understanding in Foundry Tools?
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
