id: ai901-2b-audio-workload-fit
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Which solution is an appropriate use of an audio-enabled multimodal model that is deployed in Microsoft Foundry?
  fr: |
    Quelle solution constitue une utilisation appropriée d'un modèle multimodal compatible avec l'audio déployé dans Microsoft Foundry ?
body:
  options:
    - { id: a, text: { en: "A pipeline that extracts the totals from scanned invoices", fr: "Un pipeline qui extrait les totaux de factures numérisées" } }
    - { id: b, text: { en: "A website that generates product pictures from descriptions", fr: "Un site web qui génère des images de produits à partir de descriptions" } }
    - { id: c, text: { en: "A museum kiosk that lets visitors ask a question aloud and plays a spoken answer", fr: "Une borne de musée qui permet aux visiteurs de poser une question à voix haute et diffuse une réponse parlée" } }
    - { id: d, text: { en: "A tool that returns the language code of written reviews with a confidence score", fr: "Un outil qui renvoie le code de langue d'avis écrits avec un score de confiance" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An audio-enabled model accepts audio in the prompt and can generate a spoken response, so it fits voice-based interactions such as answering a question that is asked aloud.
    fr: |
      Un modèle compatible avec l'audio accepte de l'audio dans l'invite et peut générer une réponse parlée : il convient donc aux interactions vocales, comme répondre à une question posée à voix haute.
  options:
    a:
      en: "Extracting fields from documents is an information extraction workload, for Azure Content Understanding."
      fr: "L'extraction de champs dans des documents est une charge de travail d'extraction d'informations, pour Azure Content Understanding."
    b:
      en: "Creating pictures requires an image-generation model."
      fr: "La création d'images demande un modèle de génération d'images."
    d:
      en: "A language code with a confidence score for written text is the structured output of Azure Language."
      fr: "Un code de langue avec un score de confiance pour du texte écrit est la sortie structurée d'Azure Language."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
