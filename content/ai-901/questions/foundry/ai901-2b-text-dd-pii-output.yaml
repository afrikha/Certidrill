id: ai901-2b-text-dd-pii-output
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A Python application calls Azure Language to detect personal data in a text. `client` is a `TextAnalyticsClient` object.

    The application must display the masked text, and then, for each detected item, its text and its type, for example Person.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python appelle Azure Language pour détecter des données personnelles dans un texte. `client` est un objet `TextAnalyticsClient`.

    L'application doit afficher le texte masqué, puis, pour chaque élément détecté, son texte et son type, par exemple Person.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    result = client.recognize_pii_entities([text])[0]

    print(result.[[masked]])
    for entity in result.[[items]]:
        print(entity.text, entity.[[kind]])
  slots:
    - id: masked
      options:
        - { id: redacted, text: redacted_text }
        - { id: primary, text: primary_language }
        - { id: phrases, text: key_phrases }
        - { id: sentiment, text: sentiment }
    - id: items
      options:
        - { id: phrases, text: key_phrases }
        - { id: entities, text: entities }
        - { id: scores, text: confidence_scores }
    - id: kind
      options:
        - { id: score, text: confidence_score }
        - { id: iso, text: iso6391_name }
        - { id: category, text: category }
answer:
  values: { masked: redacted, items: entities, kind: category }
explanation:
  correct:
    en: |
      The result of `recognize_pii_entities` exposes `redacted_text`, the text in which the personal data is masked, and `entities`, the list of what was found. Each entity has a `text`, a `category` such as Person, and a `confidence_score`.
    fr: |
      Le résultat de `recognize_pii_entities` expose `redacted_text`, le texte dans lequel les données personnelles sont masquées, et `entities`, la liste de ce qui a été trouvé. Chaque entité a un `text`, une `category` comme Person et un `confidence_score`.
  options:
    primary: { en: "primary_language belongs to the result of `detect_language`.", fr: "primary_language appartient au résultat de `detect_language`." }
    phrases: { en: "key_phrases belongs to the result of key phrase extraction.", fr: "key_phrases appartient au résultat de l'extraction d'expressions clés." }
    sentiment: { en: "sentiment belongs to the result of sentiment analysis.", fr: "sentiment appartient au résultat de l'analyse des sentiments." }
    scores: { en: "confidence_scores holds the positive, neutral and negative scores of sentiment analysis.", fr: "confidence_scores contient les scores positif, neutre et négatif de l'analyse des sentiments." }
    score: { en: "confidence_score is a number between 0 and 1, not the type of the item.", fr: "confidence_score est un nombre compris entre 0 et 1, pas le type de l'élément." }
    iso: { en: "iso6391_name is the language code returned by language detection.", fr: "iso6391_name est le code de langue renvoyé par la détection de langue." }
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
  - title: Azure Text Analytics client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-textanalytics-readme
