id: ai901-2c-speech-voice-name-property
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application uses the Azure Speech SDK to read notifications aloud.

    You need to choose the voice that speaks the text.

    What should you set?
  fr: |
    Une application utilise le SDK Azure Speech pour lire des notifications à voix haute.

    Vous devez choisir la voix qui prononce le texte.

    Que devez-vous définir ?
body:
  options:
    - id: a
      text:
        en: "The `speech_recognition_language` property of the `SpeechConfig` object"
        fr: "La propriété `speech_recognition_language` de l'objet `SpeechConfig`"
    - id: b
      text:
        en: "The `use_default_speaker` parameter of the `AudioOutputConfig` object"
        fr: "Le paramètre `use_default_speaker` de l'objet `AudioOutputConfig`"
    - id: c
      text:
        en: "The `speech_synthesis_voice_name` property of the `SpeechConfig` object"
        fr: "La propriété `speech_synthesis_voice_name` de l'objet `SpeechConfig`"
    - id: d
      text:
        en: "The `filename` parameter of the `AudioConfig` object"
        fr: "Le paramètre `filename` de l'objet `AudioConfig`"
answer:
  optionId: c
explanation:
  correct:
    en: |
      The voice is selected by its name in the `speech_synthesis_voice_name` property of the `SpeechConfig` object, for example `en-US-Ava:DragonHDLatestNeural`. The `SpeechSynthesizer` object created from this configuration then speaks with that voice.
    fr: |
      La voix se choisit par son nom dans la propriété `speech_synthesis_voice_name` de l'objet `SpeechConfig`, par exemple `en-US-Ava:DragonHDLatestNeural`. L'objet `SpeechSynthesizer` créé à partir de cette configuration parle alors avec cette voix.
  options:
    a:
      en: "`speech_recognition_language` sets the language of the audio to transcribe; it has no effect on the voice of the output."
      fr: "`speech_recognition_language` définit la langue de l'audio à transcrire ; elle n'a aucun effet sur la voix de la sortie."
    b:
      en: "`use_default_speaker` sends the audio to the default speaker; it doesn't select a voice."
      fr: "`use_default_speaker` envoie l'audio vers le haut-parleur par défaut ; il ne sélectionne pas de voix."
    d:
      en: "`filename` on `AudioConfig` designates an audio file used as input for speech recognition."
      fr: "`filename` sur `AudioConfig` désigne un fichier audio utilisé comme entrée de la reconnaissance vocale."
references:
  - title: "Speech synthesis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
  - title: "How to synthesize speech from text"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-speech-synthesis
