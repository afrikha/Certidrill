id: ai901-2a-model-catalog
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Microsoft Foundry project.

    You need to browse the models from Microsoft, OpenAI and other providers, filter them by capability and select one to deploy.

    What should you use in the Foundry portal?
  fr: |
    Vous disposez d'un projet Microsoft Foundry.

    Vous devez parcourir les modèles de Microsoft, d'OpenAI et d'autres fournisseurs, les filtrer par capacité et en sélectionner un à déployer.

    Que devez-vous utiliser dans le portail Foundry ?
body:
  options:
    - { id: a, text: { en: "The agents playground", fr: "Le terrain de jeu des agents" } }
    - { id: b, text: { en: "The model catalog", fr: "Le catalogue de modèles" } }
    - { id: c, text: { en: "The Evaluator Library", fr: "La bibliothèque d'évaluateurs (Evaluator Library)" } }
    - { id: d, text: { en: "The **Code** tab of the model playground", fr: "L'onglet **Code** du terrain de jeu de modèles" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The model catalog is the central hub of Foundry for the generative AI models of many providers. You can filter the models by source, capabilities and inference tasks, open the page of a model and deploy it from there.
    fr: |
      Le catalogue de modèles est le point central de Foundry pour les modèles d'IA générative de nombreux fournisseurs. Vous pouvez y filtrer les modèles par source, capacités et tâches d'inférence, ouvrir la page d'un modèle et le déployer à partir de là.
  options:
    a:
      en: "The agents playground is for prototyping and testing agents with tools and knowledge, not for browsing models."
      fr: "Le terrain de jeu des agents sert à prototyper et à tester des agents avec des outils et des connaissances, pas à parcourir des modèles."
    c:
      en: "The Evaluator Library provides reusable evaluators that score the quality and the safety of outputs."
      fr: "La bibliothèque d'évaluateurs fournit des évaluateurs réutilisables qui notent la qualité et la sécurité des sorties."
    d:
      en: "The **Code** tab shows sample code for a model that is already deployed."
      fr: "L'onglet **Code** affiche un exemple de code pour un modèle déjà déployé."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
