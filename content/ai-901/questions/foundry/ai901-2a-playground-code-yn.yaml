id: ai901-2a-playground-code-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have tested a deployed model in the model playground of the Foundry portal. You now want to call the model from an application.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez testé un modèle déployé dans le terrain de jeu de modèles du portail Foundry. Vous voulez maintenant appeler le modèle depuis une application.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "The code that the playground provides calls the deployment through the Responses API.", fr: "Le code fourni par le terrain de jeu appelle le déploiement via l'API Responses." } }
    - { id: s2, text: { en: "You must create a second deployment of the model before an application can call it.", fr: "Vous devez créer un second déploiement du modèle avant qu'une application puisse l'appeler." } }
    - { id: s3, text: { en: "The system prompt and the parameter values that you tested in the playground can be reused in the application code.", fr: "L'invite système et les valeurs de paramètres testées dans le terrain de jeu peuvent être réutilisées dans le code de l'application." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The playground is a bridge to code: it provides code that calls your deployment through the OpenAI-compatible Responses API, which is essentially what runs when you use the chat interface. You can reuse the same system prompt, user prompts and parameter values in your code. The application calls the deployment that you tested; no other deployment is needed.
    fr: |
      Le terrain de jeu fait le lien avec le code : il fournit un code qui appelle votre déploiement via l'API Responses compatible OpenAI, soit en substance ce qui s'exécute quand vous utilisez l'interface de conversation. Vous pouvez réutiliser la même invite système, les mêmes invites utilisateur et les mêmes valeurs de paramètres dans votre code. L'application appelle le déploiement que vous avez testé ; aucun autre déploiement n'est nécessaire.
references:
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
