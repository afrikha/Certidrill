id: ai901-2c-visionapp-requirements-yn
objective: "2.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan two lightweight Python applications that use a Foundry resource: one analyzes photos and one generates images.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez deux applications Python légères qui utilisent une ressource Foundry : l'une analyse des photos et l'autre génère des images.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A deployment of GPT-Image-1 can answer a question about a photo in text."
        fr: "Un déploiement de GPT-Image-1 peut répondre en texte à une question sur une photo."
    - id: s2
      text:
        en: "Both applications can use the `openai` package with the endpoint of the Foundry resource."
        fr: "Les deux applications peuvent utiliser le package `openai` avec le point de terminaison de la ressource Foundry."
    - id: s3
      text:
        en: "Both applications must authenticate with a key, because Microsoft Entra ID is reserved for the Foundry portal."
        fr: "Les deux applications doivent s'authentifier avec une clé, car Microsoft Entra ID est réservé au portail Foundry."
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: |
      The two applications share the same client: the `openai` package pointed at the endpoint of the Foundry resource, authenticated with an API key or with Microsoft Entra ID. What differs is the deployment and the call: a vision-enabled model answers questions about a photo in text, whereas GPT-Image-1 is an image-generation model whose output is an image.
    fr: |
      Les deux applications partagent le même client : le package `openai` dirigé vers le point de terminaison de la ressource Foundry, authentifié par une clé API ou par Microsoft Entra ID. Ce qui diffère, c'est le déploiement et l'appel : un modèle compatible avec la vision répond en texte à des questions sur une photo, alors que GPT-Image-1 est un modèle de génération d'images dont la sortie est une image.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
