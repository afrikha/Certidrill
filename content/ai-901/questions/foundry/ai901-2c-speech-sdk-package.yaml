id: ai901-2c-speech-sdk-package
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are building a Python application that will transcribe speech by using Azure Speech in Foundry Tools.

    Which package should you install to use the Speech SDK?
  fr: |
    Vous créez une application Python qui transcrira de la parole à l'aide d'Azure Speech dans Foundry Tools.

    Quel package devez-vous installer pour utiliser le SDK Speech ?
body:
  options:
    - id: a
      text: "`azure-identity`"
    - id: b
      text: "`openai`"
    - id: c
      text: "`azure-cognitiveservices-speech`"
    - id: d
      text: "`azure-ai-projects`"
answer:
  optionId: c
explanation:
  correct:
    en: |
      The Speech SDK for Python is installed with `pip install azure-cognitiveservices-speech`. This package provides the objects that a speech application uses, such as `SpeechConfig`, `SpeechRecognizer` and `SpeechSynthesizer`.
    fr: |
      Le SDK Speech pour Python s'installe avec `pip install azure-cognitiveservices-speech`. Ce package fournit les objets qu'utilise une application vocale, comme `SpeechConfig`, `SpeechRecognizer` et `SpeechSynthesizer`.
  options:
    a:
      en: "`azure-identity` provides Microsoft Entra credentials such as `DefaultAzureCredential`; it contains no speech class."
      fr: "`azure-identity` fournit des informations d'identification Microsoft Entra comme `DefaultAzureCredential` ; il ne contient aucune classe vocale."
    b:
      en: "The `openai` package calls generative models, for example through the Responses API; it doesn't contain the Speech SDK."
      fr: "Le package `openai` appelle des modèles génératifs, par exemple via l'API Responses ; il ne contient pas le SDK Speech."
    d:
      en: "`azure-ai-projects` is the Foundry SDK, which connects to a Foundry project with `AIProjectClient`; it isn't the Speech SDK."
      fr: "`azure-ai-projects` est le SDK Foundry, qui se connecte à un projet Foundry avec `AIProjectClient` ; ce n'est pas le SDK Speech."
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: "Microsoft Foundry SDKs and endpoints"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview
