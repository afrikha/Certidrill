id: ai901-2c-visualgen-deployments-scenario-yn
objective: "2.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    The design team of Northwind Traders has deployments of GPT-4.1, GPT-Image-1, FLUX and Sora 2 in a Foundry project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de design de Northwind Traders dispose de déploiements de GPT-4.1, GPT-Image-1, FLUX et Sora 2 dans un projet Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "To turn the sentence `a red bicycle against a white wall` into a picture, the team can use the GPT-Image-1 deployment."
        fr: "Pour transformer la phrase `a red bicycle against a white wall` en image, l'équipe peut utiliser le déploiement de GPT-Image-1."
    - id: s2
      text:
        en: "To obtain a written description of a photo of the bicycle, the team can use the GPT-4.1 deployment."
        fr: "Pour obtenir une description écrite d'une photo du vélo, l'équipe peut utiliser le déploiement de GPT-4.1."
    - id: s3
      text:
        en: "To obtain an eight-second clip of the bicycle in motion, the team can use the FLUX deployment."
        fr: "Pour obtenir un clip de huit secondes du vélo en mouvement, l'équipe peut utiliser le déploiement de FLUX."
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: |
      GPT-Image-1 generates an image from a text description. GPT-4.1 is a vision-enabled model that interprets an image and answers in text. FLUX generates still images only; a video clip requires the Sora 2 deployment.
    fr: |
      GPT-Image-1 génère une image à partir d'une description en texte. GPT-4.1 est un modèle compatible avec la vision qui interprète une image et répond en texte. FLUX ne génère que des images fixes ; un clip vidéo exige le déploiement de Sora 2.
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
