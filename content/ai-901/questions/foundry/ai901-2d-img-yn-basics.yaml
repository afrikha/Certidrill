id: ai901-2d-img-yn-basics
objective: "2.4.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan to analyze photos by using an image analyzer of Azure Content Understanding in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'analyser des photos à l'aide d'un analyseur d'images d'Azure Content Understanding dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A schema can ask for the number of people visible in a photo as a field of the number type.
      fr: Un schéma peut demander le nombre de personnes visibles sur une photo sous la forme d'un champ de type nombre.
  - id: s2
    text:
      en: An image analyzer fills in a field only if the image contains printed text.
      fr: Un analyseur d'images remplit un champ uniquement si l'image contient du texte imprimé.
  - id: s3
    text:
      en: The result of an image analysis is returned as structured JSON.
      fr: Le résultat d'une analyse d'image est renvoyé sous forme de JSON structuré.
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: An image schema defines fields with a name, a description and a type, for example a count of people as a number. The model fills them in from what the picture shows, whether or not it contains text, and the service returns structured data as JSON.
    fr: Un schéma d'image définit des champs dotés d'un nom, d'une description et d'un type, par exemple un nombre de personnes. Le modèle les remplit d'après ce que montre l'image, qu'elle contienne ou non du texte, et le service renvoie des données structurées en JSON.
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
- title: Extract information from audio and video.
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video
