id: ai901-2c-speech-recognition-flow-sentences
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The following sentences describe what happens when an application that uses the Azure Speech SDK for speech recognition runs.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les phrases suivantes décrivent ce qui se passe à l'exécution d'une application qui utilise le SDK Azure Speech pour la reconnaissance vocale.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The application initializes the Speech SDK with the endpoint of the Foundry resource and [[auth]].

      The audio is then sent to Azure Speech, and the speech recognition runs [[where]].
    fr: |
      L'application initialise le SDK Speech avec le point de terminaison de la ressource Foundry et [[auth]].

      L'audio est ensuite envoyé à Azure Speech, et la reconnaissance vocale s'exécute [[where]].
  slots:
    - id: auth
      options:
        - id: voice
          text:
            en: "the name of a voice"
            fr: "le nom d'une voix"
        - id: key
          text:
            en: "a key or Microsoft Entra ID"
            fr: "une clé ou Microsoft Entra ID"
        - id: sas
          text:
            en: "a shared access signature (SAS) URI"
            fr: "un URI de signature d'accès partagé (SAS)"
    - id: where
      options:
        - id: cloud
          text:
            en: "in the cloud, in the Azure Speech service"
            fr: "dans le cloud, dans le service Azure Speech"
        - id: local
          text:
            en: "on the device, inside the SDK package"
            fr: "sur l'appareil, dans le package du SDK"
        - id: portal
          text:
            en: "in a playground of the Foundry portal"
            fr: "dans un terrain de jeu du portail Foundry"
answer:
  values:
    auth: key
    where: cloud
explanation:
  correct:
    en: |
      The Speech SDK connects to the Foundry resource with its endpoint and an authentication, which is a key or Microsoft Entra ID. The SDK then captures or loads the audio and sends it to Azure Speech; the recognition itself runs in the cloud, and the application receives the recognized text.
    fr: |
      Le SDK Speech se connecte à la ressource Foundry avec son point de terminaison et une authentification, c'est-à-dire une clé ou Microsoft Entra ID. Le SDK capte ou charge ensuite l'audio et l'envoie à Azure Speech ; la reconnaissance elle-même s'exécute dans le cloud, et l'application reçoit le texte reconnu.
  options:
    voice:
      en: "A voice name is a setting of speech synthesis; it doesn't authenticate the application."
      fr: "Un nom de voix est un paramètre de la synthèse vocale ; il n'authentifie pas l'application."
    sas:
      en: "A SAS URI gives batch transcription access to stored audio files; it isn't how the SDK authenticates to Azure Speech."
      fr: "Un URI SAS donne à la transcription par lots l'accès à des fichiers audio stockés ; ce n'est pas ainsi que le SDK s'authentifie auprès d'Azure Speech."
    local:
      en: "The SDK handles the connection and the audio streaming; the recognition models run in the service."
      fr: "Le SDK gère la connexion et la diffusion de l'audio ; les modèles de reconnaissance s'exécutent dans le service."
    portal:
      en: "A playground is for interactive experiments; an application calls the service directly."
      fr: "Un terrain de jeu sert aux essais interactifs ; une application appelle directement le service."
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
