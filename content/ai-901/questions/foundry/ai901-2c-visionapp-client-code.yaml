id: ai901-2c-visionapp-client-code
objective: "2.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are writing a Python application that analyzes an image with a model deployed in a Foundry resource. The key, the endpoint and the deployment name are stored in the environment variables `FOUNDRY_KEY`, `ENDPOINT` and `MODEL_NAME`. The `content` variable holds the text and image items of the prompt.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui analyse une image avec un modèle déployé dans une ressource Foundry. La clé, le point de terminaison et le nom du déploiement sont stockés dans les variables d'environnement `FOUNDRY_KEY`, `ENDPOINT` et `MODEL_NAME`. La variable `content` contient les éléments de texte et d'image de l'invite.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os
    from openai import OpenAI

    client = OpenAI(
        api_key=os.getenv("FOUNDRY_KEY"),
        [[url]]=os.getenv("ENDPOINT"),
    )

    response = client.responses.create(
        [[dep]]=os.getenv("MODEL_NAME"),
        input=[{"role": "user", "content": content}],
    )
    print(response.output_text)
  slots:
    - id: url
      options:
        - id: imgurl
          text: "image_url"
        - id: base
          text: "base_url"
        - id: timeout
          text: "timeout"
    - id: dep
      options:
        - id: model
          text: "model"
        - id: instr
          text: "instructions"
        - id: tools
          text: "tools"
answer:
  values:
    url: base
    dep: model
explanation:
  correct:
    en: |
      The `OpenAI` client receives the key in `api_key` and the endpoint of the Foundry resource in `base_url`. The request then names the deployment to use in its `model` parameter.
    fr: |
      Le client `OpenAI` reçoit la clé dans `api_key` et le point de terminaison de la ressource Foundry dans `base_url`. La requête désigne ensuite le déploiement à utiliser dans son paramètre `model`.
  options:
    imgurl:
      en: "`image_url` is a key of an `input_image` content item, not a parameter of the client."
      fr: "`image_url` est une clé d'un élément de contenu `input_image`, pas un paramètre du client."
    timeout:
      en: "`timeout` limits how long the client waits; it doesn't set the endpoint."
      fr: "`timeout` limite le temps d'attente du client ; il ne définit pas le point de terminaison."
    instr:
      en: "`instructions` carries a system prompt, not the name of a deployment."
      fr: "`instructions` porte une invite système, pas le nom d'un déploiement."
    tools:
      en: "`tools` lists the tools that the model may use, such as image generation."
      fr: "`tools` liste les outils que le modèle peut utiliser, comme la génération d'images."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
