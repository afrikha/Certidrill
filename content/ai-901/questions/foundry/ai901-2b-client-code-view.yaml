id: ai901-2b-client-code-view
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You saved an agent in the Foundry portal and tested it. You need sample Python code that calls this agent, as a starting point for a client application.

    Where should you look?
  fr: |
    Vous avez enregistré un agent dans le portail Foundry et vous l'avez testé. Vous avez besoin d'un exemple de code Python qui appelle cet agent, comme point de départ d'une application cliente.

    Où devez-vous chercher ?
body:
  options:
    - { id: a, text: { en: "On the page of the model in the model catalog", fr: "Dans la page du modèle dans le catalogue de modèles" } }
    - { id: b, text: { en: "In the **Tools** section of the agent", fr: "Dans la section **Tools** de l'agent" } }
    - { id: c, text: { en: "In the code view of the agents playground", fr: "Dans la vue du code du terrain de jeu des agents" } }
    - { id: d, text: { en: "In the instructions of the agent", fr: "Dans les instructions de l'agent" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The playground of the agent has a code view that shows sample code to call the agent you are testing, with the values to use for your project. You copy it into your own application and adapt it.
    fr: |
      Le terrain de jeu de l'agent comporte une vue du code qui affiche un exemple de code pour appeler l'agent que vous testez, avec les valeurs à utiliser pour votre projet. Vous le copiez dans votre propre application et vous l'adaptez.
  options:
    a:
      en: "The model page describes the model; it knows nothing about the agent you saved."
      fr: "La page du modèle décrit le modèle ; elle ne sait rien de l'agent que vous avez enregistré."
    b:
      en: "The **Tools** section is where you add or remove the tools of the agent."
      fr: "La section **Tools** est l'endroit où vous ajoutez ou retirez les outils de l'agent."
    d:
      en: "The instructions are the system prompt of the agent, written in natural language, not client code."
      fr: "Les instructions sont l'invite système de l'agent, écrite en langage naturel, pas du code client."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
