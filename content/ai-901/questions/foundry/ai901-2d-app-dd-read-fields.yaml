id: ai901-2d-app-dd-read-fields
objective: "2.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A Python application has started the analysis of an invoice with the `prebuilt-invoice` analyzer of Azure Content Understanding in Foundry Tools. The application must print the name of the customer and report the value when the service considers it unreliable.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python a démarré l'analyse d'une facture avec l'analyseur `prebuilt-invoice` d'Azure Content Understanding dans Foundry Tools. L'application doit afficher le nom du client et signaler la valeur lorsque le service la considère comme peu fiable.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    result = poller.result()
    content = result.[[coll]][0]

    customer = content.[[prop]].get("CustomerName")
    print(customer.value)

    if customer.[[conf]] < 0.8:
        print("Send to a reviewer")
  slots:
  - id: coll
    options:
    - id: rfields
      text: fields
    - id: rcontents
      text: contents
    - id: rmarkdown
      text: markdown
  - id: prop
    options:
    - id: cmarkdown
      text: markdown
    - id: ckind
      text: kind
    - id: cfields
      text: fields
  - id: conf
    options:
    - id: fconf
      text: confidence
    - id: fvalue
      text: value
    - id: fsource
      text: source
answer:
  values:
    coll: rcontents
    prop: cfields
    conf: fconf
explanation:
  correct:
    en: The result contains a list named `contents`, with one item per analyzed content. Each item exposes `markdown` and `fields`; a field is read by its name and gives its `value` and, for documents, its `confidence` between 0 and 1.
    fr: Le résultat contient une liste nommée `contents`, avec un élément par contenu analysé. Chaque élément expose `markdown` et `fields` ; un champ se lit par son nom et fournit sa `value` et, pour les documents, sa `confidence` comprise entre 0 et 1.
  options:
    rfields:
      en: The fields belong to each content item, not directly to the result.
      fr: Les champs appartiennent à chaque élément de contenu, pas directement au résultat.
    cmarkdown:
      en: '`markdown` is the text of the document as one string; it has no named values.'
      fr: '`markdown` est le texte du document sous forme d''une seule chaîne ; il ne contient pas de valeurs nommées.'
    ckind:
      en: '`kind` gives the type of the content item, for example a document.'
      fr: '`kind` donne le type de l''élément de contenu, par exemple un document.'
    fvalue:
      en: '`value` is the extracted value itself, here the name of the customer.'
      fr: '`value` est la valeur extraite elle-même, ici le nom du client.'
    fsource:
      en: '`source` locates the value in the document; it isn''t a reliability estimate.'
      fr: '`source` localise la valeur dans le document ; ce n''est pas une estimation de fiabilité.'
references:
- title: 'Quickstart: Azure Content Understanding in Foundry Tools'
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
