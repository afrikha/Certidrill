id: ai901-2c-speech-file-recognition-code
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Python application that transcribes a short recorded message, a single sentence stored in a file named `voicemail.wav`, and displays the text. The `speech_config` object is already created.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui transcrit un court message enregistré, une seule phrase stockée dans un fichier nommé `voicemail.wav`, et qui affiche le texte. L'objet `speech_config` est déjà créé.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import azure.cognitiveservices.speech as speechsdk

    audio_config = speechsdk.audio.AudioConfig([[src]])
    recognizer = speechsdk.SpeechRecognizer(speech_config=speech_config, audio_config=audio_config)

    result = recognizer.[[method]]().get()
    print(result.[[prop]])
  slots:
    - id: src
      options:
        - id: mic
          text: "use_default_microphone=True"
        - id: file
          text: "filename=\"voicemail.wav\""
        - id: spk
          text: "use_default_speaker=True"
    - id: method
      options:
        - id: speak
          text: "speak_text_async"
        - id: stop
          text: "stop_continuous_recognition"
        - id: once
          text: "recognize_once_async"
    - id: prop
      options:
        - id: text
          text: "text"
        - id: audio
          text: "audio_data"
        - id: cancel
          text: "cancellation_details"
answer:
  values:
    src: file
    method: once
    prop: text
explanation:
  correct:
    en: |
      The audio source is a file, so the `AudioConfig` object is created with `filename`. `recognize_once_async()` recognizes a single utterance, which fits a one-sentence message, and the transcription is in the `text` property of the result.
    fr: |
      La source audio est un fichier : l'objet `AudioConfig` est donc créé avec `filename`. `recognize_once_async()` reconnaît un seul énoncé, ce qui convient à un message d'une phrase, et la transcription se trouve dans la propriété `text` du résultat.
  options:
    mic:
      en: "`use_default_microphone=True` captures live audio from the microphone, not the recorded file."
      fr: "`use_default_microphone=True` capte l'audio en direct du microphone, pas le fichier enregistré."
    spk:
      en: "`use_default_speaker` belongs to `AudioOutputConfig`, which describes the output of speech synthesis."
      fr: "`use_default_speaker` appartient à `AudioOutputConfig`, qui décrit la sortie de la synthèse vocale."
    speak:
      en: "`speak_text_async` is a method of `SpeechSynthesizer`: it turns text into speech."
      fr: "`speak_text_async` est une méthode de `SpeechSynthesizer` : elle transforme du texte en parole."
    stop:
      en: "`stop_continuous_recognition` ends a continuous recognition; it returns no transcription."
      fr: "`stop_continuous_recognition` met fin à une reconnaissance continue ; elle ne renvoie aucune transcription."
    audio:
      en: "`audio_data` holds the audio produced by a speech synthesis, not recognized text."
      fr: "`audio_data` contient l'audio produit par une synthèse vocale, pas le texte reconnu."
    cancel:
      en: "`cancellation_details` describes why a request was canceled; it isn't the transcription."
      fr: "`cancellation_details` décrit la raison de l'annulation d'une requête ; ce n'est pas la transcription."
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: "How to recognize speech"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-recognize-speech
