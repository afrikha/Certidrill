id: ai901-2c-vision-tasks-multi
objective: "2.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Which two tasks can a vision-enabled multimodal model perform when an image is included in the prompt?

    NOTE: Each correct selection is worth one point.
  fr: |
    Quelles sont les deux tâches qu'un modèle multimodal compatible avec la vision peut accomplir quand une image est incluse dans l'invite ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Answer a question about the objects shown in a photo"
        fr: "Répondre à une question sur les objets visibles sur une photo"
    - id: b
      text:
        en: "Return a short video that animates the photo"
        fr: "Renvoyer une courte vidéo qui anime la photo"
    - id: c
      text:
        en: "Return the photo with a new background"
        fr: "Renvoyer la photo avec un nouvel arrière-plan"
    - id: d
      text:
        en: "Explain what a diagram or a screenshot shows"
        fr: "Expliquer ce que montre un diagramme ou une capture d'écran"
    - id: e
      text:
        en: "Return a vector embedding of the photo"
        fr: "Renvoyer un vecteur d'embedding de la photo"
answer:
  optionIds: [a, d]
explanation:
  correct:
    en: |
      A vision-enabled model takes images as input and answers in text: it can answer questions about objects, text or scenes, and extract meaning from charts, diagrams, screenshots and documents. Its output is language, not a new image, a video or a vector.
    fr: |
      Un modèle compatible avec la vision reçoit des images en entrée et répond en texte : il peut répondre à des questions sur des objets, du texte ou des scènes, et dégager le sens de graphiques, de diagrammes, de captures d'écran et de documents. Sa sortie est du langage, pas une nouvelle image, une vidéo ou un vecteur.
  options:
    b:
      en: "Turning an image into a video is done by a video-generation model such as Sora 2."
      fr: "Transformer une image en vidéo est le rôle d'un modèle de génération de vidéos comme Sora 2."
    c:
      en: "Producing an edited image is done by an image-generation model such as GPT-Image-1."
      fr: "Produire une image modifiée est le rôle d'un modèle de génération d'images comme GPT-Image-1."
    e:
      en: "Vectors are the output of an embedding model, not of a chat model."
      fr: "Les vecteurs sont la sortie d'un modèle d'embedding, pas d'un modèle de conversation."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
