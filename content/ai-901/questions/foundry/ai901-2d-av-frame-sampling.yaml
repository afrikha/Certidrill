id: ai901-2d-av-frame-sampling
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware analyzes videos of a production line by using a video analyzer of Azure Content Understanding in Foundry Tools. In some recordings, a warning light flashes for the duration of a single video frame. The fields that the analyzer generates never mention the flash.

    What is the most likely cause?
  fr: |
    Litware analyse des vidéos d'une chaîne de production à l'aide d'un analyseur vidéo d'Azure Content Understanding dans Foundry Tools. Dans certains enregistrements, un voyant d'alerte clignote pendant la durée d'une seule image de la vidéo. Les champs générés par l'analyseur ne mentionnent jamais ce clignotement.

    Quelle est la cause la plus probable ?
body:
  options:
  - id: a
    text:
      en: The analyzer inspects about one frame per second.
      fr: L'analyseur inspecte environ une image par seconde.
  - id: b
    text:
      en: The analyzer processes only the first 30 seconds of a video.
      fr: L'analyseur traite uniquement les 30 premières secondes d'une vidéo.
  - id: c
    text:
      en: The analyzer ignores every frame during which nobody speaks.
      fr: L'analyseur ignore toute image pendant laquelle personne ne parle.
  - id: d
    text:
      en: The analyzer reads only the frames that contain text.
      fr: L'analyseur lit uniquement les images qui contiennent du texte.
answer:
  optionId: a
explanation:
  correct:
    en: A video analyzer samples approximately one frame per second. A very brief event, such as a flash that lasts one frame, can fall between two sampled frames and remain invisible to the model.
    fr: Un analyseur vidéo échantillonne environ une image par seconde. Un événement très bref, comme un clignotement qui dure une image, peut tomber entre deux images échantillonnées et rester invisible pour le modèle.
  options:
    b:
      en: The whole video is analyzed; the limits on duration are counted in minutes and hours.
      fr: La vidéo entière est analysée ; les limites de durée se comptent en minutes et en heures.
    c:
      en: Frames are sampled whether or not someone speaks; the speech is transcribed separately.
      fr: Les images sont échantillonnées que quelqu'un parle ou non ; la parole est transcrite séparément.
    d:
      en: The model looks at the visual content of the sampled frames, with or without text.
      fr: Le modèle examine le contenu visuel des images échantillonnées, avec ou sans texte.
references:
- title: Azure Content Understanding in Foundry Tools video overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
- title: Service quotas and limits - Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/service-limits
