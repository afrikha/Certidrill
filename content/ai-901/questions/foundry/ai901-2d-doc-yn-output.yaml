id: ai901-2d-doc-yn-output
objective: "2.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You compare the results that analyzers of Azure Content Understanding in Foundry Tools return for a scanned invoice.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez les résultats que des analyseurs d'Azure Content Understanding dans Foundry Tools renvoient pour une facture numérisée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: The `prebuilt-read` analyzer returns named fields such as the name of the customer.
      fr: L'analyseur `prebuilt-read` renvoie des champs nommés comme le nom du client.
  - id: s2
    text:
      en: The `prebuilt-invoice` analyzer returns the content of the invoice as Markdown in addition to its fields.
      fr: L'analyseur `prebuilt-invoice` renvoie le contenu de la facture en Markdown en plus de ses champs.
  - id: s3
    text:
      en: A field value that the `prebuilt-invoice` analyzer extracts can carry a confidence score between 0 and 1.
      fr: Une valeur de champ extraite par l'analyseur `prebuilt-invoice` peut être accompagnée d'un score de confiance compris entre 0 et 1.
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: '`prebuilt-read` performs OCR: it returns the text, not named fields. The result of `prebuilt-invoice` contains both the Markdown of the document and its fields. For documents, a field value can come with a confidence score from 0 to 1 that estimates its reliability.'
    fr: '`prebuilt-read` effectue l''OCR : il renvoie le texte, pas des champs nommés. Le résultat de `prebuilt-invoice` contient à la fois le Markdown du document et ses champs. Pour les documents, une valeur de champ peut être accompagnée d''un score de confiance de 0 à 1 qui estime sa fiabilité.'
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
- title: 'Quickstart: Azure Content Understanding in Foundry Tools'
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
