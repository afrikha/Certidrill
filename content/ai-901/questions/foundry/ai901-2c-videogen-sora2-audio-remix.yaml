id: ai901-2c-videogen-sora2-audio-remix
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys needs promotional clips that include generated audio. The team also wants to apply a targeted change to a generated clip without regenerating the whole video.

    Which model should the team deploy in Microsoft Foundry?
  fr: |
    Wingtip Toys a besoin de clips promotionnels qui incluent de l'audio généré. L'équipe veut aussi appliquer une modification ciblée à un clip généré sans régénérer toute la vidéo.

    Quel modèle l'équipe doit-elle déployer dans Microsoft Foundry ?
body:
  options:
    - id: a
      text: "Sora 1"
    - id: b
      text: "GPT-Image-1.5"
    - id: c
      text: "Sora 2"
    - id: d
      text: "FLUX"
answer:
  optionId: c
explanation:
  correct:
    en: |
      Sora 2 adds audio generation to video generation, and its video-to-video mode, called remix, applies targeted edits to an existing video instead of regenerating it entirely. It also accepts text or an image as the starting point.
    fr: |
      Sora 2 ajoute la génération audio à la génération de vidéos, et son mode vidéo vers vidéo, appelé remix, applique des modifications ciblées à une vidéo existante au lieu de la régénérer entièrement. Il accepte aussi du texte ou une image comme point de départ.
  options:
    a:
      en: "Sora 1 generates short clips from text, optionally guided by images; audio generation and remix arrive with Sora 2."
      fr: "Sora 1 génère de courts clips à partir de texte, éventuellement guidés par des images ; la génération audio et le remix arrivent avec Sora 2."
    b:
      en: "GPT-Image-1.5 creates and edits still images, not video clips."
      fr: "GPT-Image-1.5 crée et modifie des images fixes, pas des clips vidéo."
    d:
      en: "FLUX is a family of image-generation models."
      fr: "FLUX est une famille de modèles de génération d'images."
references:
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
  - title: "Video generation with Sora 2 (preview)"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation
