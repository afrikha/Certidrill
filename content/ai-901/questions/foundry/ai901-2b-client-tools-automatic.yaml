id: ai901-2b-client-tools-automatic
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An agent named **research-agent** is configured in the Foundry portal with the Web search tool. You write a lightweight client application that sends the questions of users to the agent.

    What must the client code contain so that the agent can search the web?
  fr: |
    Un agent nommé **research-agent** est configuré dans le portail Foundry avec l'outil Web search. Vous écrivez une application cliente légère qui envoie les questions des utilisateurs à l'agent.

    Que doit contenir le code du client pour que l'agent puisse chercher sur le web ?
body:
  options:
    - { id: a, text: { en: "A definition of the Web search tool in each request", fr: "Une définition de l'outil Web search dans chaque requête" } }
    - { id: b, text: { en: "A call to a search API whose results are added to the prompt", fr: "Un appel à une API de recherche dont les résultats sont ajoutés à l'invite" } }
    - { id: c, text: { en: "The name of the tool at the start of each user message", fr: "Le nom de l'outil au début de chaque message utilisateur" } }
    - { id: d, text: { en: "Only the reference to the agent, as for any other request", fr: "Seulement la référence à l'agent, comme pour toute autre requête" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The tools are part of the agent that is saved in Foundry. The client only references the agent; the agent decides when a request requires the tool and calls it automatically.
    fr: |
      Les outils font partie de l'agent enregistré dans Foundry. Le client se contente de référencer l'agent ; c'est l'agent qui décide quand une demande exige l'outil et qui l'appelle automatiquement.
  options:
    a:
      en: "A client that calls a model directly would have to declare tools; a client that calls an agent uses the tools already configured in it."
      fr: "Un client qui appelle directement un modèle devrait déclarer des outils ; un client qui appelle un agent utilise les outils déjà configurés dans celui-ci."
    b:
      en: "The search runs on the service side, inside the agent; the client doesn't search by itself."
      fr: "La recherche s'exécute côté service, dans l'agent ; le client ne cherche pas lui-même."
    c:
      en: "The agent chooses its tools from the meaning of the request, not from a keyword in the message."
      fr: "L'agent choisit ses outils d'après le sens de la demande, pas d'après un mot clé du message."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
