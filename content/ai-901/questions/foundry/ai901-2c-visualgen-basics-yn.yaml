id: ai901-2c-visualgen-basics-yn
objective: "2.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You compare the generative models of Microsoft Foundry that create visual content.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez les modèles génératifs de Microsoft Foundry qui créent du contenu visuel.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An image-generation model produces an image that corresponds to a text description."
        fr: "Un modèle de génération d'images produit une image qui correspond à une description en texte."
    - id: s2
      text:
        en: "Sora models generate still images rather than videos."
        fr: "Les modèles Sora génèrent des images fixes plutôt que des vidéos."
    - id: s3
      text:
        en: "In addition to the GPT-Image family, Foundry offers image-generation models from third parties."
        fr: "En plus de la famille GPT-Image, Foundry propose des modèles de génération d'images tiers."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: |
      Image-generation models perform text-to-image inferencing: a description goes in and a matching image comes out. Sora models are video-generation models. The catalog isn't limited to the GPT-Image family: third-party models such as FLUX, from Black Forest Labs, also generate images.
    fr: |
      Les modèles de génération d'images réalisent une inférence de texte vers image : une description en entrée, une image correspondante en sortie. Les modèles Sora sont des modèles de génération de vidéos. Le catalogue ne se limite pas à la famille GPT-Image : des modèles tiers comme FLUX, de Black Forest Labs, génèrent aussi des images.
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
