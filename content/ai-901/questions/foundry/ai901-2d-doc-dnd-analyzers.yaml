id: ai901-2d-doc-dnd-analyzers
objective: "2.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware processes several types of documents by using Azure Content Understanding in Foundry Tools. The solution must minimize development effort.

    Which analyzer should Litware use for each requirement? To answer, drag the appropriate analyzers to the correct requirements. Each analyzer may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware traite plusieurs types de documents à l'aide d'Azure Content Understanding dans Foundry Tools. La solution doit réduire au minimum l'effort de développement.

    Quel analyseur Litware doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser les analyseurs appropriés vers les exigences correspondantes. Chaque analyseur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: read
    text: '`prebuilt-read`'
  - id: layout
    text: '`prebuilt-layout`'
  - id: invoice
    text: '`prebuilt-invoice`'
  - id: receipt
    text: '`prebuilt-receipt`'
  - id: custom
    text:
      en: A custom analyzer
      fr: Un analyseur personnalisé
  targets:
  - id: t1
    text:
      en: Return only the printed and handwritten text of scanned letters
      fr: Renvoyer uniquement le texte imprimé et manuscrit de lettres numérisées
  - id: t2
    text:
      en: Return the text of annual reports together with their tables and sections
      fr: Renvoyer le texte de rapports annuels avec leurs tableaux et leurs sections
  - id: t3
    text:
      en: Return the customer, the due date and the line items of supplier invoices
      fr: Renvoyer le client, la date d'échéance et les lignes de factures fournisseurs
  - id: t4
    text:
      en: Return the named values of a warranty form that is specific to Litware
      fr: Renvoyer les valeurs nommées d'un formulaire de garantie propre à Litware
answer:
  mapping:
    t1: read
    t2: layout
    t3: invoice
    t4: custom
explanation:
  correct:
    en: '`prebuilt-read` returns the text only (OCR). `prebuilt-layout` adds the structure: tables, paragraphs and sections. `prebuilt-invoice` returns the fields of an invoice without any schema to define. A form that no prebuilt analyzer covers requires a custom analyzer with its own schema. `prebuilt-receipt` targets sales receipts and isn''t needed here.'
    fr: '`prebuilt-read` renvoie uniquement le texte (OCR). `prebuilt-layout` ajoute la structure : tableaux, paragraphes et sections. `prebuilt-invoice` renvoie les champs d''une facture sans schéma à définir. Un formulaire qu''aucun analyseur prédéfini ne couvre exige un analyseur personnalisé doté de son propre schéma. `prebuilt-receipt` vise les tickets de caisse et n''est pas nécessaire ici.'
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
