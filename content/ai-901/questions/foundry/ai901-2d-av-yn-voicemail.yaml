id: ai901-2d-av-yn-voicemail
objective: "2.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware creates a custom audio analyzer for voicemails in Azure Content Understanding in Foundry Tools. Its schema contains the fields `Caller`, `CallbackNumber` and `MessageSummary`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware crée dans Azure Content Understanding dans Foundry Tools un analyseur audio personnalisé pour des messages vocaux. Son schéma contient les champs `Caller`, `CallbackNumber` et `MessageSummary`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: The callback number is returned in its own field, in addition to the transcript.
      fr: Le numéro de rappel est renvoyé dans son propre champ, en plus de la transcription.
  - id: s2
    text:
      en: The `MessageSummary` field contains the complete transcript, word for word.
      fr: Le champ `MessageSummary` contient la transcription complète, mot pour mot.
  - id: s3
    text:
      en: The analyzer applies the same schema to every voicemail that is submitted.
      fr: L'analyseur applique le même schéma à chaque message vocal envoyé.
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: 'The result contains the transcript and, separately, one value per field of the schema: the caller, the callback number and a short summary that the model writes. The analyzer applies the schema consistently to every recording.'
    fr: 'Le résultat contient la transcription et, séparément, une valeur par champ du schéma : l''appelant, le numéro de rappel et un court résumé que le modèle rédige. L''analyseur applique le schéma de façon cohérente à chaque enregistrement.'
references:
- title: Extract information from audio and video.
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video
