id: ai901-2a-deployment-settings-dd
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When you deploy a model in Microsoft Foundry, [[type]] determines where and how inference is processed. [[rate]] is a rate limit that sets how fast the deployment can process tokens.
    fr: |
      Lorsque vous déployez un modèle dans Microsoft Foundry, [[type]] détermine où et comment l'inférence est traitée. [[rate]] est une limite de débit qui fixe la vitesse à laquelle le déploiement peut traiter les jetons.
  slots:
    - id: type
      options:
        - { id: ver, text: { en: "the model version", fr: "la version du modèle" } }
        - { id: nam, text: { en: "the deployment name", fr: "le nom du déploiement" } }
        - { id: typ, text: { en: "the deployment type", fr: "le type de déploiement" } }
    - id: rate
      options:
        - { id: tpm, text: { en: "Tokens per minute (TPM)", fr: "Le nombre de jetons par minute (TPM)" } }
        - { id: max, text: { en: "Max output tokens", fr: "Le nombre maximal de jetons de sortie" } }
        - { id: tmp, text: { en: "Temperature", fr: "La température" } }
answer:
  values: { type: typ, rate: tpm }
explanation:
  correct:
    en: |
      The deployment type, such as standard, global batch or regional provisioned throughput, determines where and how inference is processed. The tokens per minute (TPM) rate limit sets how fast the deployment can process tokens; when the limit is reached, requests are throttled.
    fr: |
      Le type de déploiement, par exemple standard, global batch ou débit provisionné régional, détermine où et comment l'inférence est traitée. La limite de débit en jetons par minute (TPM) fixe la vitesse à laquelle le déploiement peut traiter les jetons ; quand elle est atteinte, les requêtes sont limitées.
  options:
    ver:
      en: "The model version selects which release of the model is deployed."
      fr: "La version du modèle sélectionne l'édition du modèle qui est déployée."
    nam:
      en: "The deployment name identifies the deployment; client code sends it in the `model` parameter."
      fr: "Le nom du déploiement identifie le déploiement ; le code client l'envoie dans le paramètre `model`."
    max:
      en: "Max output tokens caps the length of one response. It is a parameter of a request, not a rate limit of the deployment."
      fr: "Le nombre maximal de jetons de sortie plafonne la longueur d'une réponse. C'est un paramètre d'une requête, pas une limite de débit du déploiement."
    tmp:
      en: "The temperature controls how creative or deterministic the responses are."
      fr: "La température règle le caractère créatif ou déterministe des réponses."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
