id: ai901-2d-av-yn-details
objective: "2.4.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You define the fields of custom audio and video analyzers in Azure Content Understanding in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez les champs d'analyseurs audio et vidéo personnalisés dans Azure Content Understanding dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: A field of an audio analyzer can use the `extract` method.
      fr: Un champ d'un analyseur audio peut utiliser la méthode `extract`.
  - id: s2
    text:
      en: A field of an audio analyzer can use the `classify` method to label a call as positive, neutral or negative.
      fr: Un champ d'un analyseur audio peut utiliser la méthode `classify` pour qualifier un appel de positif, neutre ou négatif.
  - id: s3
    text:
      en: Each field of a video analyzer is returned with a confidence score.
      fr: Chaque champ d'un analyseur vidéo est renvoyé avec un score de confiance.
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: For audio and video, the supported generation methods are `generate` and `classify`; `extract` is supported for documents only. Classifying the sentiment of a call from a list of categories is a typical use of `classify`. Confidence scores are supported only by document analyzers.
    fr: Pour l'audio et la vidéo, les méthodes de génération prises en charge sont `generate` et `classify` ; `extract` est pris en charge uniquement pour les documents. Classifier le sentiment d'un appel à partir d'une liste de catégories est un usage typique de `classify`. Les scores de confiance sont pris en charge uniquement par les analyseurs de documents.
references:
- title: Service quotas and limits - Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/service-limits
- title: Best practices for using Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
