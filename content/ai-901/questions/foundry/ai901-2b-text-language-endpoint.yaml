id: ai901-2b-text-language-endpoint
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You create a `TextAnalyticsClient` object to call Azure Language through a Foundry resource named **adatum-ai**. The same resource hosts a project named **text** with a deployed GPT model.

    Which endpoint should you pass to `TextAnalyticsClient`?
  fr: |
    Vous créez un objet `TextAnalyticsClient` pour appeler Azure Language par l'intermédiaire d'une ressource Foundry nommée **adatum-ai**. La même ressource héberge un projet nommé **text** avec un modèle GPT déployé.

    Quel point de terminaison devez-vous passer à `TextAnalyticsClient` ?
body:
  options:
    - { id: a, text: "`https://adatum-ai.openai.azure.com/openai/v1/`" }
    - { id: b, text: "`https://adatum-ai.cognitiveservices.azure.com/`" }
    - { id: c, text: "`https://adatum-ai.services.ai.azure.com/api/projects/text`" }
    - { id: d, text: "`https://ai.azure.com`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Azure Language SDK connects to the endpoint of the Foundry resource in the `cognitiveservices.azure.com` domain, together with the key of the resource wrapped in `AzureKeyCredential`.
    fr: |
      Le SDK Azure Language se connecte au point de terminaison de la ressource Foundry dans le domaine `cognitiveservices.azure.com`, avec la clé de la ressource encapsulée dans `AzureKeyCredential`.
  options:
    a:
      en: "This is the Azure OpenAI endpoint, used as the base URL of an `OpenAI` client that calls a deployed model."
      fr: "Il s'agit du point de terminaison Azure OpenAI, utilisé comme URL de base d'un client `OpenAI` qui appelle un modèle déployé."
    c:
      en: "This is a project endpoint, used by `AIProjectClient` to reach a project and its agents."
      fr: "Il s'agit d'un point de terminaison de projet, utilisé par `AIProjectClient` pour atteindre un projet et ses agents."
    d:
      en: "This is the address of the Foundry portal, a website and not an API endpoint."
      fr: "Il s'agit de l'adresse du portail Foundry, un site web et non un point de terminaison d'API."
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
