id: ai901-2b-text-detect-language-output
objective: "2.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A Python application calls the `detect_language` method of the Azure Language SDK for a customer message.

    Which two values does the result contain for the message?

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python appelle la méthode `detect_language` du SDK Azure Language pour un message de client.

    Quelles sont les deux valeurs que contient le résultat pour le message ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A redacted version of the message", fr: "Une version masquée du message" } }
    - { id: b, text: { en: "The ISO 639-1 code of the language", fr: "Le code ISO 639-1 de la langue" } }
    - { id: c, text: { en: "A sentiment label", fr: "Une étiquette de sentiment" } }
    - { id: d, text: { en: "A summary of the message", fr: "Un résumé du message" } }
    - { id: e, text: { en: "A confidence score", fr: "Un score de confiance" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      `detect_language` returns, for each document, the primary language with its name, its ISO 639-1 code (`iso6391_name`) and a confidence score between 0 and 1.
    fr: |
      `detect_language` renvoie, pour chaque document, la langue principale avec son nom, son code ISO 639-1 (`iso6391_name`) et un score de confiance compris entre 0 et 1.
  options:
    a:
      en: "A redacted text is returned by `recognize_pii_entities`, the PII detection method."
      fr: "Un texte masqué est renvoyé par `recognize_pii_entities`, la méthode de détection des PII."
    c:
      en: "A sentiment label comes from sentiment analysis, a different task."
      fr: "Une étiquette de sentiment provient de l'analyse des sentiments, une tâche différente."
    d:
      en: "Language detection doesn't generate text; a summary is typically obtained from a general-purpose model with a prompt."
      fr: "La détection de langue ne génère pas de texte ; un résumé s'obtient en général auprès d'un modèle à usage général avec une invite."
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
  - title: What is language detection in Azure Language?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/language-detection/overview
