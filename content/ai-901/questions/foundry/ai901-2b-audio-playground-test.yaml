id: ai901-2b-audio-playground-test
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deployed `gpt-audio-mini` in a Foundry project. Before you write any code, you want to check how the model responds to a question that you ask aloud.

    What should you do in the Foundry portal?
  fr: |
    Vous avez déployé `gpt-audio-mini` dans un projet Foundry. Avant d'écrire du code, vous souhaitez vérifier comment le modèle répond à une question que vous posez à voix haute.

    Que devez-vous faire dans le portail Foundry ?
body:
  options:
    - { id: a, text: { en: "Type the question in the instructions of the deployment.", fr: "Saisir la question dans les instructions du déploiement." } }
    - { id: b, text: { en: "Record an audio prompt in the chat playground.", fr: "Enregistrer une invite audio dans le terrain de jeu de conversation." } }
    - { id: c, text: { en: "Upload a recording of the question as knowledge for an agent.", fr: "Charger un enregistrement de la question en tant que connaissances pour un agent." } }
    - { id: d, text: { en: "Open the page of the model in the model catalog.", fr: "Ouvrir la page du modèle dans le catalogue de modèles." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the chat playground, with the deployed audio model selected, you can record audio prompts, attach audio files or type text, and listen to the audio responses of the model. No code is needed.
    fr: |
      Dans le terrain de jeu de conversation, une fois le modèle audio déployé sélectionné, vous pouvez enregistrer des invites audio, joindre des fichiers audio ou saisir du texte, et écouter les réponses audio du modèle. Aucun code n'est nécessaire.
  options:
    a:
      en: "Instructions are the system prompt that sets the behavior of the model; they aren't a spoken user prompt."
      fr: "Les instructions sont l'invite système qui fixe le comportement du modèle ; ce n'est pas une invite utilisateur vocale."
    c:
      en: "Knowledge is content that grounds the answers of an agent; it isn't a prompt."
      fr: "Les connaissances sont du contenu qui ancre les réponses d'un agent ; ce n'est pas une invite."
    d:
      en: "The model page describes the model; it doesn't let you talk to your deployment."
      fr: "La page du modèle décrit le modèle ; elle ne permet pas de dialoguer avec votre déploiement."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
