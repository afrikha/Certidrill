id: ai901-2d-av-voicemail-fields
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum receives hundreds of voicemails each day. For each voicemail, Adatum needs the name of the caller, the callback number and a summary of the message, each returned as a separate value.

    What should Adatum use?
  fr: |
    Adatum reçoit des centaines de messages vocaux chaque jour. Pour chaque message vocal, Adatum a besoin du nom de l'appelant, du numéro de rappel et d'un résumé du message, chacun renvoyé sous forme de valeur distincte.

    Que doit utiliser Adatum ?
body:
  options:
  - id: a
    text:
      en: Speech synthesis in Azure Speech in Foundry Tools
      fr: La synthèse vocale d'Azure Speech dans Foundry Tools
  - id: b
    text:
      en: A Content Understanding audio analyzer with a schema
      fr: Un analyseur audio Content Understanding doté d'un schéma
  - id: c
    text:
      en: Speech recognition in Azure Speech in Foundry Tools
      fr: La reconnaissance vocale d'Azure Speech dans Foundry Tools
  - id: d
    text:
      en: The `prebuilt-layout` analyzer of Content Understanding
      fr: L'analyseur `prebuilt-layout` de Content Understanding
answer:
  optionId: b
explanation:
  correct:
    en: An audio analyzer transcribes the recording and then fills the fields of its schema, such as the caller, the callback number and a summary of the message. Each field is returned as a separate value, in addition to the transcript.
    fr: Un analyseur audio transcrit l'enregistrement, puis remplit les champs de son schéma, comme l'appelant, le numéro de rappel et un résumé du message. Chaque champ est renvoyé sous forme de valeur distincte, en plus de la transcription.
  options:
    a:
      en: Speech synthesis produces spoken audio from text; it doesn't analyze recordings.
      fr: La synthèse vocale produit de l'audio parlé à partir de texte ; elle n'analyse pas d'enregistrements.
    c:
      en: Speech recognition returns a transcript only; the caller, the number and the summary would still have to be found in the text.
      fr: La reconnaissance vocale renvoie uniquement une transcription ; l'appelant, le numéro et le résumé resteraient à retrouver dans le texte.
    d:
      en: '`prebuilt-layout` analyzes the text and the structure of documents, not audio files.'
      fr: '`prebuilt-layout` analyse le texte et la structure de documents, pas des fichiers audio.'
references:
- title: Extract information from audio and video.
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video
