id: ai901-2b-text-yn-pii
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An application calls the `recognize_pii_entities` method of the Azure Language SDK on the transcript of a support chat.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application appelle la méthode `recognize_pii_entities` du SDK Azure Language sur la transcription d'une conversation de support.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The result contains a version of the text in which the detected personal data is masked.
        fr: Le résultat contient une version du texte dans laquelle les données personnelles détectées sont masquées.
    - id: s2
      text:
        en: Each detected entity has a category, such as a person or a phone number, and a confidence score.
        fr: Chaque entité détectée a une catégorie, comme une personne ou un numéro de téléphone, et un score de confiance.
    - id: s3
      text:
        en: Before the first call, you must train the feature with labeled examples of your own data.
        fr: Avant le premier appel, vous devez entraîner la fonctionnalité avec des exemples étiquetés de vos propres données.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      `recognize_pii_entities` returns the redacted text (`redacted_text`) and the list of entities it found, each with its text, its category and a confidence score. PII detection is a prebuilt capability that uses predefined entity categories: it runs as it is, with no training on your data.
    fr: |
      `recognize_pii_entities` renvoie le texte masqué (`redacted_text`) et la liste des entités trouvées, chacune avec son texte, sa catégorie et un score de confiance. La détection des PII est une fonctionnalité prédéfinie qui utilise des catégories d'entités prédéfinies : elle s'exécute telle quelle, sans entraînement sur vos données.
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
  - title: What is the Personally Identifiable Information (PII) detection feature in Azure Language?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
