id: ai901-2c-vision-internal-photo-base64
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application must ask a vision-enabled model deployed in Microsoft Foundry to describe product photos. The photos are stored on a file server that can be reached only from the internal network of the company.

    How should the application provide each photo to the model?
  fr: |
    Une application doit demander à un modèle compatible avec la vision déployé dans Microsoft Foundry de décrire des photos de produits. Les photos sont stockées sur un serveur de fichiers accessible uniquement depuis le réseau interne de l'entreprise.

    Comment l'application doit-elle fournir chaque photo au modèle ?
body:
  options:
    - id: a
      text:
        en: "Include the internal URL of the file in the request as the image URL."
        fr: "Inclure l'URL interne du fichier dans la requête comme URL de l'image."
    - id: b
      text:
        en: "Write the file name of the photo in the text of the prompt."
        fr: "Écrire le nom de fichier de la photo dans le texte de l'invite."
    - id: c
      text:
        en: "Read the file and include its content in the request as base64-encoded data."
        fr: "Lire le fichier et inclure son contenu dans la requête sous forme de données encodées en base64."
    - id: d
      text:
        en: "Convert the photo to a vector with an embedding model and send the vector."
        fr: "Convertir la photo en vecteur avec un modèle d'embedding et envoyer le vecteur."
answer:
  optionId: c
explanation:
  correct:
    en: |
      An image can be given to the model as a URL or as base64-encoded data. A URL works only if the service can fetch the image, which requires a publicly accessible address; a file on an internal server doesn't qualify. The application, which can reach the server, reads the file and embeds its base64-encoded content in the request.
    fr: |
      Une image peut être fournie au modèle sous forme d'URL ou de données encodées en base64. Une URL ne fonctionne que si le service peut récupérer l'image, ce qui exige une adresse accessible publiquement ; un fichier sur un serveur interne ne remplit pas cette condition. L'application, qui peut joindre le serveur, lit le fichier et intègre son contenu encodé en base64 dans la requête.
  options:
    a:
      en: "The model runs in Azure and can't reach an address that exists only on the internal network."
      fr: "Le modèle s'exécute dans Azure et ne peut pas joindre une adresse qui n'existe que sur le réseau interne."
    b:
      en: "A file name gives the model no image content to analyze."
      fr: "Un nom de fichier ne donne au modèle aucun contenu d'image à analyser."
    d:
      en: "A chat model doesn't accept an embedding vector as an image input."
      fr: "Un modèle de conversation n'accepte pas un vecteur d'embedding comme image en entrée."
references:
  - title: "Use vision-enabled chat models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
