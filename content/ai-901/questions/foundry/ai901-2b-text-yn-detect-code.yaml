id: ai901-2b-text-yn-detect-code
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A Python application contains the following code.

    ```python
    client = TextAnalyticsClient(endpoint=endpoint, credential=AzureKeyCredential(key))

    result = client.detect_language(["Buongiorno, vorrei prenotare un tavolo per due."])[0]
    print(result.primary_language.name)
    print(result.primary_language.iso6391_name)
    print(result.primary_language.confidence_score)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python contient le code suivant.

    ```python
    client = TextAnalyticsClient(endpoint=endpoint, credential=AzureKeyCredential(key))

    result = client.detect_language(["Buongiorno, vorrei prenotare un tavolo per due."])[0]
    print(result.primary_language.name)
    print(result.primary_language.iso6391_name)
    print(result.primary_language.confidence_score)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The code sends the text to a deployed GPT model.
        fr: Le code envoie le texte à un modèle GPT déployé.
    - id: s2
      text:
        en: The second `print` statement displays a language code such as `it`.
        fr: La deuxième instruction `print` affiche un code de langue tel que `it`.
    - id: s3
      text:
        en: The third `print` statement displays a number between 0 and 1.
        fr: La troisième instruction `print` affiche un nombre compris entre 0 et 1.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      `TextAnalyticsClient` is the client of the Azure Language SDK: the text goes to Azure Language, not to a generative model. For the detected language, `name` is the readable name, `iso6391_name` is the ISO 639-1 code (here `it` for Italian) and `confidence_score` is a value between 0 and 1.
    fr: |
      `TextAnalyticsClient` est le client du SDK Azure Language : le texte est envoyé à Azure Language, pas à un modèle génératif. Pour la langue détectée, `name` est le nom lisible, `iso6391_name` est le code ISO 639-1 (ici `it` pour l'italien) et `confidence_score` est une valeur comprise entre 0 et 1.
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
