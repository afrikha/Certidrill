id: ai901-2c-vision-text-instruction-format
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Users of an application upload a photo of a whiteboard. For each photo, a vision-enabled model deployed in Microsoft Foundry must return the action items written on the whiteboard as three bullet points. The solution must minimize development effort.

    What should you do?
  fr: |
    Les utilisateurs d'une application chargent la photo d'un tableau blanc. Pour chaque photo, un modèle compatible avec la vision déployé dans Microsoft Foundry doit renvoyer les actions notées sur le tableau sous forme de trois puces. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Deploy an image-generation model that redraws the whiteboard as a list."
        fr: "Déployer un modèle de génération d'images qui redessine le tableau sous forme de liste."
    - id: b
      text:
        en: "Send the photo alone, then format the answer in the application code."
        fr: "Envoyer la photo seule, puis mettre en forme la réponse dans le code de l'application."
    - id: c
      text:
        en: "Transcribe the photo with Azure Speech, then summarize the transcription."
        fr: "Transcrire la photo avec Azure Speech, puis résumer la transcription."
    - id: d
      text:
        en: "Send the photo with a text instruction that asks for three bullet points."
        fr: "Envoyer la photo avec une instruction en texte qui demande trois puces."
answer:
  optionId: d
explanation:
  correct:
    en: |
      A prompt to a vision-enabled model combines an image with a text instruction, and the instruction can say what to look for and how to format the answer, for example "Provide 3 bullet points". The model then reads the whiteboard and returns the list in a single call, with no extra code.
    fr: |
      Une invite destinée à un modèle compatible avec la vision combine une image et une instruction en texte, et l'instruction peut préciser ce qu'il faut chercher et comment mettre en forme la réponse, par exemple « Provide 3 bullet points ». Le modèle lit alors le tableau et renvoie la liste en un seul appel, sans code supplémentaire.
  options:
    a:
      en: "An image-generation model produces a picture, not a text list of the action items."
      fr: "Un modèle de génération d'images produit une image, pas une liste en texte des actions."
    b:
      en: "Without an instruction, the model doesn't know that action items are expected, and formatting in code adds development effort."
      fr: "Sans instruction, le modèle ne sait pas que des actions sont attendues, et la mise en forme dans le code ajoute de l'effort de développement."
    c:
      en: "Azure Speech transcribes audio; it doesn't read a photo."
      fr: "Azure Speech transcrit de l'audio ; il ne lit pas une photo."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
