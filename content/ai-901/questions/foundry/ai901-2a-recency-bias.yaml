id: ai901-2a-recency-bias
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You send a model a long prompt. The prompt starts with the instruction "Answer only from the report below", continues with a 40-page report and ends with a question.

    The model sometimes ignores the instruction. You decide to test repeating the instruction at the end of the prompt.

    Which model behavior does this technique address?
  fr: |
    Vous envoyez à un modèle une longue invite. Elle commence par l'instruction « Répondez uniquement à partir du rapport ci-dessous », se poursuit par un rapport de 40 pages et se termine par une question.

    Le modèle ignore parfois l'instruction. Vous décidez de tester la répétition de l'instruction à la fin de l'invite.

    À quel comportement du modèle cette technique répond-elle ?
body:
  options:
    - { id: a, text: { en: "Recency bias", fr: "Le biais de récence" } }
    - { id: b, text: { en: "Tokenization", fr: "La segmentation en jetons" } }
    - { id: c, text: { en: "Throttling", fr: "La limitation" } }
    - { id: d, text: { en: "Grounding", fr: "L'ancrage" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Models can be subject to recency bias: the information at the end of a prompt can influence the output more than the information at the beginning. Repeating a key instruction at the end of a long prompt is therefore worth testing.
    fr: |
      Les modèles peuvent présenter un biais de récence : les informations situées à la fin d'une invite peuvent influencer la sortie davantage que celles du début. Répéter une instruction essentielle à la fin d'une longue invite mérite donc d'être testé.
  options:
    b:
      en: "Tokenization is the splitting of the input into tokens. It doesn't explain why an instruction placed early is ignored."
      fr: "La segmentation en jetons est le découpage de l'entrée en jetons. Elle n'explique pas pourquoi une instruction placée au début est ignorée."
    c:
      en: "Throttling limits the processing when a deployment nears its rate limits. It causes rate-limit errors, not ignored instructions."
      fr: "La limitation restreint le traitement quand un déploiement approche de ses limites de débit. Elle provoque des erreurs de limite de débit, pas des instructions ignorées."
    d:
      en: "Grounding means that the response is based on the information supplied in the prompt. It is the goal of the instruction, not the behavior that makes the model ignore it."
      fr: "L'ancrage signifie que la réponse s'appuie sur les informations fournies dans l'invite. C'est le but de l'instruction, pas le comportement qui conduit le modèle à l'ignorer."
references:
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
