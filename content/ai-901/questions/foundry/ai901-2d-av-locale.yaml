id: ai901-2d-av-locale
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware analyzes recorded customer calls by using a custom audio analyzer of Azure Content Understanding in Foundry Tools. All the calls are in French (France). Some transcripts contain phrases that were recognized in another language.

    You need to improve the quality of the transcripts.

    What should you do?
  fr: |
    Proseware analyse des appels clients enregistrés à l'aide d'un analyseur audio personnalisé d'Azure Content Understanding dans Foundry Tools. Tous les appels sont en français (France). Certaines transcriptions contiennent des phrases reconnues dans une autre langue.

    Vous devez améliorer la qualité des transcriptions.

    Que devez-vous faire ?
body:
  options:
  - id: a
    text:
      en: Add a field named `Language` to the schema.
      fr: Ajouter au schéma un champ nommé `Language`.
  - id: b
    text:
      en: Set the `locales` of the analyzer to `fr-FR`.
      fr: Définir les `locales` de l'analyseur sur `fr-FR`.
  - id: c
    text:
      en: Convert the recordings to video files.
      fr: Convertir les enregistrements en fichiers vidéo.
  - id: d
    text:
      en: Split each recording into files of one minute.
      fr: Découper chaque enregistrement en fichiers d'une minute.
answer:
  optionId: b
explanation:
  correct:
    en: 'When no locale is specified, the analyzer uses multilingual transcription and decides the language of each phrase itself, which can cause errors. Microsoft''s guidance is to configure only the languages that you expect: here the single locale `fr-FR`.'
    fr: 'Lorsqu''aucun paramètre régional n''est spécifié, l''analyseur utilise la transcription multilingue et décide lui-même de la langue de chaque phrase, ce qui peut provoquer des erreurs. Microsoft recommande de configurer uniquement les langues attendues : ici le seul paramètre régional `fr-FR`.'
  options:
    a:
      en: A field is filled from the transcript after transcription; it doesn't change how the speech is recognized.
      fr: Un champ est rempli à partir de la transcription, après celle-ci ; il ne change pas la façon dont la parole est reconnue.
    c:
      en: The speech of a video is transcribed in the same way; the container format doesn't select the language.
      fr: La parole d'une vidéo est transcrite de la même façon ; le format du conteneur ne sélectionne pas la langue.
    d:
      en: Shorter files don't tell the analyzer which language is spoken.
      fr: Des fichiers plus courts n'indiquent pas à l'analyseur quelle langue est parlée.
references:
- title: Azure Content Understanding in Foundry Tools audio overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview
- title: Best practices for using Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
