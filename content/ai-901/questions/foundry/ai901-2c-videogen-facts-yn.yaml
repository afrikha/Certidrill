id: ai901-2c-videogen-facts-yn
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to generate videos with models from the Foundry model catalog.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de générer des vidéos avec des modèles du catalogue de modèles Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A multimodal chat model such as GPT-4.1 can return a video as its output."
        fr: "Un modèle de conversation multimodal comme GPT-4.1 peut renvoyer une vidéo en sortie."
    - id: s2
      text:
        en: "Sora 1 can use an image as input to guide the creation of a video."
        fr: "Sora 1 peut utiliser une image en entrée pour guider la création d'une vidéo."
    - id: s3
      text:
        en: "A deployed video-generation model can be tested in a video playground of the Foundry portal."
        fr: "Un modèle de génération de vidéos déployé peut être testé dans un terrain de jeu vidéo du portail Foundry."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: |
      Multimodal chat models accept several types of input, but they don't generate video output; in Foundry, video generation is provided by the Sora models. Sora 1 creates short clips from text prompts and can take images as input to guide the result. Once deployed, a Sora model can be tried in the video playground.
    fr: |
      Les modèles de conversation multimodaux acceptent plusieurs types d'entrée, mais ils ne génèrent pas de vidéo en sortie ; dans Foundry, la génération de vidéos est assurée par les modèles Sora. Sora 1 crée de courts clips à partir d'invites en texte et peut recevoir des images en entrée pour guider le résultat. Une fois déployé, un modèle Sora peut être essayé dans le terrain de jeu vidéo.
references:
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
