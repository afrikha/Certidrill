id: ai901-2b-client-required-values
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You write a lightweight Python client for an agent that already exists in a Foundry project. The client uses `AIProjectClient` and authenticates with `DefaultAzureCredential`.

    Which two values does the code need in order to reach the agent? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un client Python léger pour un agent qui existe déjà dans un projet Foundry. Le client utilise `AIProjectClient` et s'authentifie avec `DefaultAzureCredential`.

    Quelles sont les deux valeurs dont le code a besoin pour atteindre l'agent ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The text of the agent's instructions", fr: "Le texte des instructions de l'agent" } }
    - { id: b, text: { en: "The endpoint of the project", fr: "Le point de terminaison du projet" } }
    - { id: c, text: { en: "The list of the agent's tools", fr: "La liste des outils de l'agent" } }
    - { id: d, text: { en: "The name of the agent", fr: "Le nom de l'agent" } }
    - { id: e, text: { en: "The name of the index that holds the agent's knowledge", fr: "Le nom de l'index qui contient les connaissances de l'agent" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The project endpoint tells `AIProjectClient` which project to connect to, and the agent name lets the code retrieve the agent with `agents.get(agent_name=...)` and reference it in the request. Everything else is stored in the agent.
    fr: |
      Le point de terminaison du projet indique à `AIProjectClient` à quel projet se connecter, et le nom de l'agent permet au code de récupérer l'agent avec `agents.get(agent_name=...)` et de le référencer dans la requête. Tout le reste est stocké dans l'agent.
  options:
    a:
      en: "The instructions are saved in the agent; the client doesn't send them."
      fr: "Les instructions sont enregistrées dans l'agent ; le client ne les envoie pas."
    c:
      en: "The tools are configured in the agent and called by it; the client doesn't list them."
      fr: "Les outils sont configurés dans l'agent et appelés par lui ; le client ne les énumère pas."
    e:
      en: "The knowledge index is attached to the agent in Foundry; the client never addresses it."
      fr: "L'index de connaissances est attaché à l'agent dans Foundry ; le client ne s'y adresse jamais."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
