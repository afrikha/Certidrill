id: ai901-2b-client-dd-send-read
objective: "2.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are completing a Python client application that calls an agent through the Responses API. `openai_client` was obtained with `project_client.get_openai_client()`, and `agent` refers to the agent.

    The application must send the question of the user to the agent and display the text of the answer.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous complétez une application cliente Python qui appelle un agent par l'intermédiaire de l'API Responses. `openai_client` a été obtenu avec `project_client.get_openai_client()`, et `agent` désigne l'agent.

    L'application doit envoyer la question de l'utilisateur à l'agent et afficher le texte de la réponse.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = openai_client.responses.create(
        [[arg]]=[{"role": "user", "content": question}],
        extra_body={"agent": {"name": agent.name, "type": "agent_reference"}},
    )
    print(response.[[out]])
  slots:
    - id: arg
      options:
        - { id: messages, text: messages }
        - { id: input, text: input }
        - { id: instructions, text: instructions }
    - id: out
      options:
        - { id: id, text: id }
        - { id: status, text: status }
        - { id: model, text: model }
        - { id: text, text: output_text }
answer:
  values: { arg: input, out: text }
explanation:
  correct:
    en: |
      In the Responses API, the prompt is passed in `input`, as a string or as a list of messages with roles. The generated text is read from the `output_text` property of the response.
    fr: |
      Dans l'API Responses, l'invite se passe dans `input`, sous la forme d'une chaîne ou d'une liste de messages avec des rôles. Le texte généré se lit dans la propriété `output_text` de la réponse.
  options:
    messages: { en: "messages is the parameter of the Chat Completions API, not of `responses.create`.", fr: "messages est le paramètre de l'API Chat Completions, pas celui de `responses.create`." }
    instructions: { en: "instructions carries a system-style guide as a string; it isn't where the user's question goes, and an agent already holds its instructions.", fr: "instructions porte des consignes de type système sous forme de chaîne ; ce n'est pas l'endroit où va la question de l'utilisateur, et un agent détient déjà ses instructions." }
    id: { en: "id is the identifier of the response.", fr: "id est l'identifiant de la réponse." }
    status: { en: "status tells whether the response is completed.", fr: "status indique si la réponse est terminée." }
    model: { en: "model is the name of the model that produced the response.", fr: "model est le nom du modèle qui a produit la réponse." }
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
