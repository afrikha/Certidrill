id: ai901-2d-doc-portal-test
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before you write any code, you want to upload a few sample invoices, run an analyzer on them, and inspect the extracted fields and the JSON that an application would receive.

    What should you use?
  fr: |
    Avant d'écrire du code, vous souhaitez charger quelques exemples de factures, exécuter un analyseur sur celles-ci, puis examiner les champs extraits et le JSON qu'une application recevrait.

    Que devez-vous utiliser ?
body:
  options:
  - id: a
    text:
      en: The Content Understanding playground in the Foundry portal
      fr: Le terrain de jeu Content Understanding dans le portail Foundry
  - id: b
    text:
      en: The playground of a chat model deployment in the Foundry portal
      fr: Le terrain de jeu d'un déploiement de modèle de conversation dans le portail Foundry
  - id: c
    text:
      en: The speech playground in the Foundry portal
      fr: Le terrain de jeu vocal dans le portail Foundry
  - id: d
    text:
      en: Azure Cloud Shell in the Azure portal
      fr: Azure Cloud Shell dans le portail Azure
answer:
  optionId: a
explanation:
  correct:
    en: In the Foundry portal, the Content Understanding playground lets you choose an analyzer, run it on a sample or on your own file, and review the extracted fields, the Markdown and the raw JSON result. It is the way to validate an analyzer before you automate the work in code.
    fr: Dans le portail Foundry, le terrain de jeu Content Understanding permet de choisir un analyseur, de l'exécuter sur un exemple ou sur votre propre fichier, puis de consulter les champs extraits, le Markdown et le résultat JSON brut. C'est le moyen de valider un analyseur avant d'automatiser le travail dans du code.
  options:
    b:
      en: A chat model playground sends prompts to a model; it doesn't run a Content Understanding analyzer or show its fields.
      fr: Le terrain de jeu d'un modèle de conversation envoie des invites à un modèle ; il n'exécute pas d'analyseur Content Understanding et n'affiche pas ses champs.
    c:
      en: The speech playground tests speech recognition and speech synthesis, not document analysis.
      fr: Le terrain de jeu vocal teste la reconnaissance vocale et la synthèse vocale, pas l'analyse de documents.
    d:
      en: 'Cloud Shell is a command line: using it means writing commands or code, which you want to avoid at this stage.'
      fr: 'Cloud Shell est une ligne de commande : l''utiliser revient à écrire des commandes ou du code, ce que vous voulez éviter à ce stade.'
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
- title: Exercise - Get started with information extraction in Microsoft Foundry
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/4-exercise
