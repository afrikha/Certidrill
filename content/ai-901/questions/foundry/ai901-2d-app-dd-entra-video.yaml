id: ai901-2d-app-dd-entra-video
objective: "2.4.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You write a Python application that analyzes recorded webinars by using Azure Content Understanding in Foundry Tools. The application must meet the following requirements:

    - Authenticate with Microsoft Entra ID, without a key.
    - Return, for each segment of a video, a transcript and a description.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui analyse des webinaires enregistrés à l'aide d'Azure Content Understanding dans Foundry Tools. L'application doit répondre aux exigences suivantes :

    - S'authentifier avec Microsoft Entra ID, sans clé.
    - Renvoyer, pour chaque segment d'une vidéo, une transcription et une description.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.contentunderstanding import ContentUnderstandingClient
    from [[mod]] import DefaultAzureCredential

    client = ContentUnderstandingClient(endpoint=endpoint, credential=DefaultAzureCredential())

    poller = client.begin_analyze(
        analyzer_id="[[an]]",
        inputs=[{"url": video_url}],
    )
    result = poller.result()

    for content in result.contents:
        print(content.markdown)
        print(content.fields)
  slots:
  - id: mod
    options:
    - id: mcore
      text: azure.core.credentials
    - id: mcu
      text: azure.ai.contentunderstanding
    - id: mid
      text: azure.identity
  - id: an
    options:
    - id: aaudio
      text: prebuilt-audioSearch
    - id: avideo
      text: prebuilt-videoSearch
    - id: abase
      text: prebuilt-video
    - id: aimage
      text: prebuilt-imageSearch
answer:
  values:
    mod: mid
    an: avideo
explanation:
  correct:
    en: '`DefaultAzureCredential` comes from the `azure.identity` package and authenticates the application with Microsoft Entra ID. `prebuilt-videoSearch` divides a video into segments and returns one content item per segment, with its transcript and a generated description, which is why the code loops over `result.contents`.'
    fr: '`DefaultAzureCredential` provient du package `azure.identity` et authentifie l''application avec Microsoft Entra ID. `prebuilt-videoSearch` divise une vidéo en segments et renvoie un élément de contenu par segment, avec sa transcription et une description générée : c''est pourquoi le code parcourt `result.contents`.'
  options:
    mcore:
      en: '`azure.core.credentials` provides `AzureKeyCredential`, for key authentication.'
      fr: '`azure.core.credentials` fournit `AzureKeyCredential`, pour l''authentification par clé.'
    mcu:
      en: The Content Understanding package provides the client, not the Microsoft Entra credentials.
      fr: Le package Content Understanding fournit le client, pas les informations d'identification Microsoft Entra.
    aaudio:
      en: '`prebuilt-audioSearch` returns a transcript and one summary of the conversation, without video segments or visual descriptions.'
      fr: '`prebuilt-audioSearch` renvoie une transcription et un seul résumé de la conversation, sans segments vidéo ni descriptions visuelles.'
    abase:
      en: '`prebuilt-video` is the base analyzer from which custom video analyzers are derived; it has no fields of its own.'
      fr: '`prebuilt-video` est l''analyseur de base dont dérivent les analyseurs vidéo personnalisés ; il n''a pas de champs propres.'
    aimage:
      en: '`prebuilt-imageSearch` describes a single image.'
      fr: '`prebuilt-imageSearch` décrit une seule image.'
references:
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
- title: 'Quickstart: Azure Content Understanding in Foundry Tools'
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
