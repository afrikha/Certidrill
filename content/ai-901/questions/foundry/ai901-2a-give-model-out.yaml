id: ai901-2a-give-model-out
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A model deployed in Microsoft Foundry answers questions about a product manual. The application includes the text of the manual in each prompt.

    When the manual does not contain the answer, the model invents a plausible one. You need to reduce these false responses by changing the system prompt.

    Which instruction should you add?
  fr: |
    Un modèle déployé dans Microsoft Foundry répond à des questions sur un manuel produit. L'application inclut le texte du manuel dans chaque invite.

    Quand le manuel ne contient pas la réponse, le modèle en invente une qui paraît plausible. Vous devez réduire ces fausses réponses en modifiant l'invite système.

    Quelle instruction devez-vous ajouter ?
body:
  options:
    - { id: a, text: { en: "\"Write every answer in an enthusiastic and confident tone.\"", fr: "« Rédigez chaque réponse sur un ton enthousiaste et assuré. »" } }
    - { id: b, text: { en: "\"Always answer in at least three detailed paragraphs.\"", fr: "« Répondez toujours en au moins trois paragraphes détaillés. »" } }
    - { id: c, text: { en: "\"Never ask the user to rephrase or to clarify a question.\"", fr: "« Ne demandez jamais à l'utilisateur de reformuler ou de préciser une question. »" } }
    - { id: d, text: { en: "\"If the answer is not in the manual, reply 'not found'.\"", fr: "« Si la réponse ne figure pas dans le manuel, répondez : introuvable. »" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Giving the model an "out", that is an alternative path to follow when the answer is not present, helps it avoid generating false responses. Without that path, the model tends to produce the most likely continuation, even if it is invented.
    fr: |
      Donner au modèle une porte de sortie, c'est-à-dire une autre voie à suivre quand la réponse est absente, l'aide à ne pas générer de fausses réponses. Sans cette voie, le modèle tend à produire la suite la plus probable, même inventée.
  options:
    a:
      en: "A confident tone changes the style only. An invented answer would simply sound more convincing."
      fr: "Un ton assuré ne change que le style. Une réponse inventée paraîtrait seulement plus convaincante."
    b:
      en: "Imposing a minimum length pushes the model to write more, including when it has nothing reliable to say."
      fr: "Imposer une longueur minimale pousse le modèle à écrire davantage, y compris quand il n'a rien de fiable à dire."
    c:
      en: "Forbidding clarifying questions removes a fallback behavior and leaves the model no choice but to answer."
      fr: "Interdire les questions de clarification supprime un comportement de repli et ne laisse au modèle d'autre choix que de répondre."
references:
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
  - title: "System message design"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/advanced-prompt-engineering
