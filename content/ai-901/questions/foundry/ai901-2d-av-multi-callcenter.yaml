id: ai901-2d-av-multi-callcenter
objective: "2.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys analyzes recorded support calls by using the `prebuilt-callCenter` analyzer of Azure Content Understanding in Foundry Tools.

    Which two results does the analyzer return for each call?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys analyse des appels de support enregistrés à l'aide de l'analyseur `prebuilt-callCenter` d'Azure Content Understanding dans Foundry Tools.

    Quels sont les deux résultats que l'analyseur renvoie pour chaque appel ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: The key frames of the call
      fr: Les images clés de l'appel
  - id: b
    text:
      en: A transcript in which the speakers have the Agent and Customer roles
      fr: Une transcription dans laquelle les locuteurs ont les rôles Agent et Customer
  - id: c
    text:
      en: A spoken reply for the customer
      fr: Une réponse parlée destinée au client
  - id: d
    text:
      en: The sentiment of the call
      fr: Le sentiment de l'appel
  - id: e
    text:
      en: A version of the recording in another language
      fr: Une version de l'enregistrement dans une autre langue
answer:
  optionIds:
  - b
  - d
explanation:
  correct:
    en: '`prebuilt-callCenter` is designed for post-call analysis: it returns a transcript with speaker role detection (agent and customer), a summary of the call, its sentiment and other fields such as the topics and the companies mentioned.'
    fr: '`prebuilt-callCenter` est conçu pour l''analyse post-appel : il renvoie une transcription avec détection du rôle des locuteurs (agent et client), un résumé de l''appel, son sentiment et d''autres champs comme les sujets et les entreprises mentionnés.'
  options:
    a:
      en: Key frames exist only for videos; a call recording has no images.
      fr: Les images clés n'existent que pour les vidéos ; un enregistrement d'appel n'a pas d'images.
    c:
      en: Producing speech is speech synthesis; the analyzer only extracts information.
      fr: Produire de la parole relève de la synthèse vocale ; l'analyseur extrait seulement des informations.
    e:
      en: The analyzer transcribes and analyzes the call; it doesn't produce a translated recording.
      fr: L'analyseur transcrit et analyse l'appel ; il ne produit pas d'enregistrement traduit.
references:
- title: Azure Content Understanding in Foundry Tools audio overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview
