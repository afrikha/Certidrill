id: ai901-2d-img-meeting-room
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso keeps a photo of each meeting room taken during hybrid meetings. For each photo, Contoso needs the location, the number of in-person attendees and the number of remote attendees shown on the screen, returned as structured data.

    What should Contoso use?
  fr: |
    Contoso conserve une photo de chaque salle de réunion prise pendant les réunions hybrides. Pour chaque photo, Contoso a besoin du lieu, du nombre de participants en personne et du nombre de participants à distance affichés à l'écran, renvoyés sous forme de données structurées.

    Que doit utiliser Contoso ?
body:
  options:
  - id: a
    text:
      en: An image-generation model with a text prompt
      fr: Un modèle de génération d'images avec une invite textuelle
  - id: b
    text:
      en: Speech recognition in Azure Speech in Foundry Tools
      fr: La reconnaissance vocale d'Azure Speech dans Foundry Tools
  - id: c
    text:
      en: A Content Understanding image analyzer with a schema
      fr: Un analyseur d'images Content Understanding doté d'un schéma
  - id: d
    text:
      en: The `prebuilt-invoice` analyzer of Content Understanding
      fr: L'analyseur `prebuilt-invoice` de Content Understanding
answer:
  optionId: c
explanation:
  correct:
    en: For images, you define a schema whose fields describe what you want to know, such as the location and the number of attendees. The analyzer examines each image and returns those fields as structured data.
    fr: Pour les images, vous définissez un schéma dont les champs décrivent ce que vous voulez savoir, comme le lieu et le nombre de participants. L'analyseur examine chaque image et renvoie ces champs sous forme de données structurées.
  options:
    a:
      en: An image-generation model creates new images; it doesn't extract information from existing photos.
      fr: Un modèle de génération d'images crée de nouvelles images ; il n'extrait pas d'informations de photos existantes.
    b:
      en: Speech recognition converts spoken audio into text; a photo contains no speech.
      fr: La reconnaissance vocale convertit de l'audio parlé en texte ; une photo ne contient aucune parole.
    d:
      en: '`prebuilt-invoice` returns the fields of invoices, not information about a room and its occupants.'
      fr: '`prebuilt-invoice` renvoie les champs de factures, pas des informations sur une salle et ses occupants.'
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
- title: Extract information from audio and video.
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video
