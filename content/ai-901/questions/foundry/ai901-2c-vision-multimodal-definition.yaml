id: ai901-2c-vision-multimodal-definition
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    What is a multimodal model?
  fr: |
    Qu'est-ce qu'un modèle multimodal ?
body:
  options:
    - id: a
      text:
        en: "A model that is deployed to more than one Azure region"
        fr: "Un modèle déployé dans plusieurs régions Azure"
    - id: b
      text:
        en: "A model that accepts more than one type of data, such as text and images"
        fr: "Un modèle qui accepte plusieurs types de données, comme du texte et des images"
    - id: c
      text:
        en: "A model that returns several alternative answers to each prompt"
        fr: "Un modèle qui renvoie plusieurs réponses possibles à chaque invite"
    - id: d
      text:
        en: "A model that can be called from more than one programming language"
        fr: "Un modèle qui peut être appelé depuis plusieurs langages de programmation"
answer:
  optionId: b
explanation:
  correct:
    en: |
      A modality is a type of data: text, image, audio or video. A multimodal model accepts more than one of them at the same time, which is why a vision-enabled model can receive a photo and a question in the same prompt.
    fr: |
      Une modalité est un type de données : texte, image, audio ou vidéo. Un modèle multimodal en accepte plusieurs à la fois, ce qui explique qu'un modèle compatible avec la vision puisse recevoir une photo et une question dans la même invite.
  options:
    a:
      en: "Where a model is deployed is a deployment choice; it says nothing about the types of data that the model accepts."
      fr: "L'endroit où un modèle est déployé est un choix de déploiement ; il ne dit rien des types de données que le modèle accepte."
    c:
      en: "The number of answers returned is unrelated to the types of input that the model understands."
      fr: "Le nombre de réponses renvoyées est sans rapport avec les types d'entrée que le modèle comprend."
    d:
      en: "Any deployed model can be called from several languages through its API; that isn't what multimodal means."
      fr: "Tout modèle déployé peut être appelé depuis plusieurs langages via son API ; ce n'est pas le sens de multimodal."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
