id: ai901-2d-img-dnd-types
objective: "2.4.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You define the schema of an image analyzer in Azure Content Understanding in Foundry Tools. The analyzer processes photos of a construction site.

    Which value type should you use for each field? To answer, drag the appropriate types to the correct fields. Each type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez le schéma d'un analyseur d'images dans Azure Content Understanding dans Foundry Tools. L'analyseur traite des photos d'un chantier de construction.

    Quel type de valeur devez-vous utiliser pour chaque champ ? Pour répondre, faites glisser les types appropriés vers les champs correspondants. Chaque type peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: tarr
    text: '`array`'
  - id: tbool
    text: '`boolean`'
  - id: tdate
    text: '`date`'
  - id: tnum
    text: '`number`'
  - id: tstr
    text: '`string`'
  targets:
  - id: t1
    text:
      en: A short description of the scene
      fr: Une courte description de la scène
  - id: t2
    text:
      en: The number of people in the photo
      fr: Le nombre de personnes sur la photo
  - id: t3
    text:
      en: Whether a safety helmet is visible
      fr: La présence visible d'un casque de sécurité
  - id: t4
    text:
      en: The list of the vehicles detected
      fr: La liste des véhicules détectés
answer:
  mapping:
    t1: tstr
    t2: tnum
    t3: tbool
    t4: tarr
explanation:
  correct:
    en: 'Each field of a schema declares the type of its value: free text is a `string`, a count is a `number`, a yes/no answer is a `boolean`, and a list of values is an `array`. No field here holds a calendar date.'
    fr: 'Chaque champ d''un schéma déclare le type de sa valeur : un texte libre est de type `string`, un nombre d''objets de type `number`, une réponse oui/non de type `boolean`, et une liste de valeurs de type `array`. Aucun champ ici ne contient une date du calendrier.'
references:
- title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
- title: Service quotas and limits - Content Understanding
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/service-limits
