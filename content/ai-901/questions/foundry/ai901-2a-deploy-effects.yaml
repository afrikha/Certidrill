id: ai901-2a-deploy-effects
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You deploy a model in a Microsoft Foundry project.

    Which two things happen as a result of the deployment?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez un modèle dans un projet Microsoft Foundry.

    Quelles sont les deux conséquences du déploiement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The model is retrained on the files of the project.", fr: "Le modèle est réentraîné sur les fichiers du projet." } }
    - { id: b, text: { en: "An API endpoint is created so that applications can call the model.", fr: "Un point de terminaison d'API est créé pour que les applications puissent appeler le modèle." } }
    - { id: c, text: { en: "A new Foundry resource is created to host the deployment.", fr: "Une nouvelle ressource Foundry est créée pour héberger le déploiement." } }
    - { id: d, text: { en: "Compute resources are allocated to run the model.", fr: "Des ressources de calcul sont allouées pour exécuter le modèle." } }
    - { id: e, text: { en: "The model is downloaded to each client application.", fr: "Le modèle est téléchargé dans chaque application cliente." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      When you deploy a model, compute resources are allocated for it and an API endpoint is created, through which client applications invoke the model. The configuration of the deployment is locked in, and monitoring and logging start.
    fr: |
      Lorsque vous déployez un modèle, des ressources de calcul lui sont allouées et un point de terminaison d'API est créé, par lequel les applications clientes appellent le modèle. La configuration du déploiement est figée, et la surveillance et la journalisation démarrent.
  options:
    a:
      en: "A deployment serves the pretrained model as it is. It doesn't train the model on your files."
      fr: "Un déploiement sert le modèle préentraîné tel quel. Il n'entraîne pas le modèle sur vos fichiers."
    c:
      en: "The deployment is created in the existing Foundry resource of the project."
      fr: "Le déploiement est créé dans la ressource Foundry existante du projet."
    e:
      en: "The model runs in Foundry. Client applications send requests to its endpoint and never receive the model itself."
      fr: "Le modèle s'exécute dans Foundry. Les applications clientes envoient des requêtes à son point de terminaison et ne reçoivent jamais le modèle lui-même."
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
