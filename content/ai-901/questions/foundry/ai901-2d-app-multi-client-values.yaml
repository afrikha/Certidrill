id: ai901-2d-app-multi-client-values
objective: "2.4.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You write a Python application that creates a `ContentUnderstandingClient` object and authenticates with a key.

    Which two values does the application need to create the client? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui crée un objet `ContentUnderstandingClient` et s'authentifie avec une clé.

    Quelles sont les deux valeurs dont l'application a besoin pour créer le client ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
  - id: a
    text:
      en: The name of a prebuilt analyzer
      fr: Le nom d'un analyseur prédéfini
  - id: b
    text:
      en: The endpoint of the Foundry resource
      fr: Le point de terminaison de la ressource Foundry
  - id: c
    text:
      en: The URL of the file to analyze
      fr: L'URL du fichier à analyser
  - id: d
    text:
      en: The ID of the Azure subscription
      fr: L'ID de l'abonnement Azure
  - id: e
    text:
      en: A key of the Foundry resource
      fr: Une clé de la ressource Foundry
answer:
  optionIds:
  - b
  - e
explanation:
  correct:
    en: 'The client is created with the endpoint of the Foundry resource and a credential: `ContentUnderstandingClient(endpoint=endpoint, credential=AzureKeyCredential(key))`. The analyzer and the file are given later, in each call to `begin_analyze`.'
    fr: 'Le client se crée avec le point de terminaison de la ressource Foundry et des informations d''identification : `ContentUnderstandingClient(endpoint=endpoint, credential=AzureKeyCredential(key))`. L''analyseur et le fichier sont fournis ensuite, à chaque appel de `begin_analyze`.'
  options:
    a:
      en: The analyzer is selected by `analyzer_id` in `begin_analyze`, not when the client is created.
      fr: L'analyseur est sélectionné par `analyzer_id` dans `begin_analyze`, pas à la création du client.
    c:
      en: The file is passed in `inputs` when the analysis is started.
      fr: Le fichier est transmis dans `inputs` au démarrage de l'analyse.
    d:
      en: The endpoint already identifies the resource; the subscription ID isn't a parameter of the client.
      fr: Le point de terminaison identifie déjà la ressource ; l'ID d'abonnement n'est pas un paramètre du client.
references:
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
