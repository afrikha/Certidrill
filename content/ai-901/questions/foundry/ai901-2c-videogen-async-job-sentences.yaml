id: ai901-2c-videogen-async-job-sentences
objective: "2.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An application generates videos by calling a Sora model through the REST interface of Microsoft Foundry.

    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application génère des vidéos en appelant un modèle Sora via l'interface REST de Microsoft Foundry.

    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Because video generation is resource-intensive, the application starts [[job]].

      The application then [[poll]], and finally downloads [[file]].
    fr: |
      Comme la génération de vidéos consomme beaucoup de ressources, l'application démarre [[job]].

      L'application [[poll]], puis télécharge [[file]].
  slots:
    - id: job
      options:
        - id: chat
          text:
            en: "a chat conversation"
            fr: "une conversation"
        - id: async
          text:
            en: "an asynchronous job"
            fr: "un travail asynchrone"
        - id: batch
          text:
            en: "a batch transcription"
            fr: "une transcription par lots"
    - id: poll
      options:
        - id: status
          text:
            en: "checks the status of the job until it is completed"
            fr: "vérifie l'état du travail jusqu'à ce qu'il soit terminé"
        - id: resend
          text:
            en: "sends the same prompt again every few seconds"
            fr: "renvoie la même invite toutes les quelques secondes"
        - id: frames
          text:
            en: "uploads the frames of the video one by one"
            fr: "charge les images de la vidéo une par une"
    - id: file
      options:
        - id: png
          text:
            en: "a PNG file"
            fr: "un fichier PNG"
        - id: wav
          text:
            en: "a WAV file"
            fr: "un fichier WAV"
        - id: mp4
          text:
            en: "an MP4 file"
            fr: "un fichier MP4"
answer:
  values:
    job: async
    poll: status
    file: mp4
explanation:
  correct:
    en: |
      Generating a video typically takes from one to five minutes, so the REST interface works with an asynchronous job: the application creates the job, polls its status until it is completed, and then downloads the finished video as an MP4 file.
    fr: |
      Générer une vidéo prend en général d'une à cinq minutes : l'interface REST fonctionne donc avec un travail asynchrone. L'application crée le travail, interroge son état jusqu'à ce qu'il soit terminé, puis télécharge la vidéo finale sous forme de fichier MP4.
references:
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
