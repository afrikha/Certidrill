id: ai901-2c-vision-instructions-requirement
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In the model playground of the Foundry portal, you test a vision-enabled model with photos of plants. Whatever the user asks about a photo, every answer must end with a warning if the plant is toxic to pets.

    Where should you write this requirement?
  fr: |
    Dans le terrain de jeu de modèles du portail Foundry, vous testez un modèle compatible avec la vision avec des photos de plantes. Quelle que soit la question de l'utilisateur sur une photo, chaque réponse doit se terminer par un avertissement si la plante est toxique pour les animaux de compagnie.

    Où devez-vous écrire cette exigence ?
body:
  options:
    - id: a
      text:
        en: "In the name of the model deployment"
        fr: "Dans le nom du déploiement du modèle"
    - id: b
      text:
        en: "In the file name of each uploaded photo"
        fr: "Dans le nom de fichier de chaque photo chargée"
    - id: c
      text:
        en: "In the instructions of the playground"
        fr: "Dans les instructions du terrain de jeu"
    - id: d
      text:
        en: "In the description entered in the image playground"
        fr: "Dans la description saisie dans le terrain de jeu d'images"
answer:
  optionId: c
explanation:
  correct:
    en: |
      The instructions of the playground are the system prompt: they set the behavior of the model for the whole conversation, whatever the user asks. The photo and the user's question then form the user prompt, and the model applies the instructions to every answer.
    fr: |
      Les instructions du terrain de jeu constituent l'invite système : elles fixent le comportement du modèle pour toute la conversation, quelle que soit la question de l'utilisateur. La photo et la question de l'utilisateur forment ensuite l'invite utilisateur, et le modèle applique les instructions à chaque réponse.
  options:
    a:
      en: "A deployment name only identifies the deployment; the model doesn't read it as guidance."
      fr: "Un nom de déploiement ne fait qu'identifier le déploiement ; le modèle ne le lit pas comme une consigne."
    b:
      en: "A file name isn't an instruction, and it would have to be repeated for every photo."
      fr: "Un nom de fichier n'est pas une instruction, et il faudrait le répéter pour chaque photo."
    d:
      en: "The image playground sends a description to an image-generation model to create a picture."
      fr: "Le terrain de jeu d'images envoie une description à un modèle de génération d'images pour créer une image."
references:
  - title: "Exercise - Get started with computer vision in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/5-exercise
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
