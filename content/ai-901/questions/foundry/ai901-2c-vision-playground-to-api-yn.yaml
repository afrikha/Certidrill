id: ai901-2c-vision-playground-to-api-yn
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to test image prompts in the Foundry portal and then use them in an application.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de tester des invites contenant des images dans le portail Foundry, puis de les utiliser dans une application.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "You must deploy a vision-enabled model before you can test image prompts in the model playground."
        fr: "Vous devez déployer un modèle compatible avec la vision avant de pouvoir tester des invites contenant des images dans le terrain de jeu de modèles."
    - id: s2
      text:
        en: "In the model playground, an image can be analyzed only if it is already published at a public URL."
        fr: "Dans le terrain de jeu de modèles, une image ne peut être analysée que si elle est déjà publiée à une URL publique."
    - id: s3
      text:
        en: "After you validate the prompts in the playground, an application can submit images with text prompts through an API."
        fr: "Une fois les invites validées dans le terrain de jeu, une application peut envoyer des images avec des invites en texte via une API."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: |
      The model playground works with a deployed model, so a vision-enabled model must be deployed first. In the playground you upload the image file directly from your computer; no public URL is needed. The same capability is then available in code, where the application sends images together with text prompts through the Responses API.
    fr: |
      Le terrain de jeu de modèles fonctionne avec un modèle déployé : un modèle compatible avec la vision doit donc être déployé au préalable. Dans le terrain de jeu, vous chargez le fichier image directement depuis votre ordinateur ; aucune URL publique n'est nécessaire. La même capacité est ensuite disponible dans le code, où l'application envoie des images avec des invites en texte via l'API Responses.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Exercise - Get started with computer vision in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/5-exercise
