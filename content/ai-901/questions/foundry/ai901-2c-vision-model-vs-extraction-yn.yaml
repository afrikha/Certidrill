id: ai901-2c-vision-model-vs-extraction-yn
objective: "2.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware has two needs:

    - Support agents ask free-form questions about photos sent by customers.
    - A back-office process must extract the same named fields (vendor, date, total) from thousands of scanned invoices and store them as JSON.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware a deux besoins :

    - Les agents du support posent des questions libres sur des photos envoyées par des clients.
    - Un processus de back-office doit extraire les mêmes champs nommés (fournisseur, date, total) de milliers de factures numérisées et les stocker au format JSON.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A vision-enabled multimodal model deployed in Foundry fits the free-form questions of the support agents."
        fr: "Un modèle multimodal compatible avec la vision déployé dans Foundry convient aux questions libres des agents du support."
    - id: s2
      text:
        en: "An image-generation model is needed to read the text printed on the invoices."
        fr: "Un modèle de génération d'images est nécessaire pour lire le texte imprimé sur les factures."
    - id: s3
      text:
        en: "An analyzer of Azure Content Understanding in Foundry Tools fits the extraction of the same fields from every invoice."
        fr: "Un analyseur d'Azure Content Understanding dans Foundry Tools convient à l'extraction des mêmes champs de chaque facture."
answer:
  values:
    s1: true
    s2: false
    s3: true
explanation:
  correct:
    en: |
      A vision-enabled model answers a different question about each photo in natural language, which matches the support scenario. Extracting the same fields from every document is the purpose of a Content Understanding analyzer: its schema is applied consistently to all the files and the result is returned as JSON. An image-generation model creates images and reads nothing.
    fr: |
      Un modèle compatible avec la vision répond en langage naturel à une question différente sur chaque photo, ce qui correspond au scénario du support. Extraire les mêmes champs de chaque document est le but d'un analyseur Content Understanding : son schéma est appliqué de façon homogène à tous les fichiers et le résultat est renvoyé au format JSON. Un modèle de génération d'images crée des images et ne lit rien.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "What is Azure Content Understanding in Foundry Tools?"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
