id: ai901-2a-client-model-location
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a lightweight chat client: a single Python file that asks the user for a question, calls a model of a Microsoft Foundry project and prints the answer.

    Where does the model run?
  fr: |
    Vous créez un client de conversation léger : un seul fichier Python qui demande une question à l'utilisateur, appelle un modèle d'un projet Microsoft Foundry et affiche la réponse.

    Où le modèle s'exécute-t-il ?
body:
  options:
    - { id: a, text: { en: "On the user's computer, inside the Python process", fr: "Sur l'ordinateur de l'utilisateur, dans le processus Python" } }
    - { id: b, text: { en: "In Foundry, behind the endpoint of the model deployment", fr: "Dans Foundry, derrière le point de terminaison du déploiement de modèle" } }
    - { id: c, text: { en: "In the browser that displays the Foundry portal", fr: "Dans le navigateur qui affiche le portail Foundry" } }
    - { id: d, text: { en: "In the package that the Foundry SDK installs", fr: "Dans le package installé par le SDK Foundry" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A lightweight client only collects the input, calls a remote service and displays the result; the state and the compute stay mostly on the server. The model runs remotely in Foundry, and the client reaches it through the endpoint of the deployment.
    fr: |
      Un client léger se contente de recueillir la saisie, d'appeler un service distant et d'afficher le résultat ; l'état et le calcul restent pour l'essentiel sur le serveur. Le modèle s'exécute à distance dans Foundry, et le client l'atteint par le point de terminaison du déploiement.
  options:
    a:
      en: "The Python process only sends requests and prints responses. It doesn't load or run the model."
      fr: "Le processus Python ne fait qu'envoyer des requêtes et afficher des réponses. Il ne charge ni n'exécute le modèle."
    c:
      en: "The portal is a web interface for building and testing. The client doesn't go through a browser."
      fr: "Le portail est une interface web pour créer et tester. Le client ne passe pas par un navigateur."
    d:
      en: "The SDK is a code library that wraps the calls to the service. It doesn't contain the model."
      fr: "Le SDK est une bibliothèque de code qui encapsule les appels au service. Il ne contient pas le modèle."
references:
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: "Microsoft Foundry for AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/4-microsoft-foundry
