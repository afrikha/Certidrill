id: ai901-2c-visionapp-generation-code
objective: "2.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Python application that generates an image with a deployed image-generation model and saves the image to a file. The `client` object is already defined.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui génère une image avec un modèle de génération d'images déployé et enregistre l'image dans un fichier. L'objet `client` est déjà défini.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import base64

    result = client.[[call]](
        model="my-image-deployment",
        prompt="A vintage PC with a CRT monitor",
        n=1,
        size="1024x1024",
    )

    image_bytes = base64.[[dec]](result.data[0].[[prop]])
    with open("output.png", "wb") as f:
        f.write(image_bytes)
  slots:
    - id: call
      options:
        - id: resp
          text: "responses.create"
        - id: gen
          text: "images.generate"
        - id: emb
          text: "embeddings.create"
    - id: dec
      options:
        - id: b64enc
          text: "b64encode"
        - id: encbytes
          text: "encodebytes"
        - id: b64dec
          text: "b64decode"
    - id: prop
      options:
        - id: b64
          text: "b64_json"
        - id: out
          text: "output_text"
        - id: txt
          text: "text"
answer:
  values:
    call: gen
    dec: b64dec
    prop: b64
explanation:
  correct:
    en: |
      `client.images.generate()` sends the prompt, the number of images and the size to the image-generation deployment. The image comes back as base64 text in `data[0].b64_json`; `base64.b64decode()` turns it into bytes, which are written to the PNG file in binary mode.
    fr: |
      `client.images.generate()` envoie l'invite, le nombre d'images et la taille au déploiement du modèle de génération d'images. L'image revient sous forme de texte base64 dans `data[0].b64_json` ; `base64.b64decode()` la transforme en octets, qui sont écrits dans le fichier PNG en mode binaire.
  options:
    resp:
      en: "`responses.create` takes `input`, not `prompt`, `n` and `size`, and its result has no `data` list."
      fr: "`responses.create` reçoit `input`, pas `prompt`, `n` et `size`, et son résultat n'a pas de liste `data`."
    emb:
      en: "`embeddings.create` returns numeric vectors for a text, not an image."
      fr: "`embeddings.create` renvoie des vecteurs numériques pour un texte, pas une image."
    b64enc:
      en: "`b64encode` does the opposite: it encodes bytes into base64."
      fr: "`b64encode` fait l'inverse : il encode des octets en base64."
    encbytes:
      en: "`encodebytes` also encodes; the returned image must be decoded."
      fr: "`encodebytes` encode également ; l'image renvoyée doit être décodée."
    out:
      en: "`output_text` is the text answer of a Responses API call."
      fr: "`output_text` est la réponse en texte d'un appel à l'API Responses."
    txt:
      en: "An image result exposes the base64 image in `b64_json`."
      fr: "Un résultat d'image expose l'image base64 dans `b64_json`."
references:
  - title: "Azure OpenAI image generation models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e
  - title: "Exercise - Get started with computer vision in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/5-exercise
