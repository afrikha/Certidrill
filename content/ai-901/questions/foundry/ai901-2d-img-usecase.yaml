id: ai901-2d-img-usecase
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: Which scenario is a use of image analysis in Azure Content Understanding in Foundry Tools?
  fr: Quel scénario est un usage de l'analyse d'images dans Azure Content Understanding dans Foundry Tools ?
body:
  options:
  - id: a
    text:
      en: Creating a logo from a text description
      fr: Créer un logo à partir d'une description textuelle
  - id: b
    text:
      en: Counting the products visible in photos of store shelves
      fr: Compter les produits visibles sur des photos de rayons de magasin
  - id: c
    text:
      en: Reading a product description aloud to a customer
      fr: Lire à voix haute une description de produit à un client
  - id: d
    text:
      en: Translating a product sheet into another language
      fr: Traduire une fiche produit dans une autre langue
answer:
  optionId: b
explanation:
  correct:
    en: 'Shelf analysis and inventory management (detecting, counting and extracting product details in retail photos) is one of the uses of image analysis in Content Understanding: it extracts information from existing images.'
    fr: 'L''analyse de rayons et la gestion des stocks (détecter, compter et extraire les détails des produits sur des photos de commerce de détail) font partie des usages de l''analyse d''images dans Content Understanding : elle extrait des informations d''images existantes.'
  options:
    a:
      en: Creating an image from a description is image generation.
      fr: Créer une image à partir d'une description relève de la génération d'images.
    c:
      en: Reading a text aloud is speech synthesis.
      fr: Lire un texte à voix haute relève de la synthèse vocale.
    d:
      en: Translating a text is a text workload, not an extraction of information from images.
      fr: Traduire un texte est une charge de travail de texte, pas une extraction d'informations à partir d'images.
references:
- title: Azure Content Understanding in Foundry Tools image overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
