id: ai901-2b-agent-citation-test
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You add a file named **returns-policy.docx** as knowledge to an agent in the Foundry portal. In the agents playground, you ask a question about product returns.

    What shows that the answer is grounded in the file?
  fr: |
    Vous ajoutez un fichier nommé **returns-policy.docx** en tant que connaissances à un agent dans le portail Foundry. Dans le terrain de jeu des agents, vous posez une question sur les retours de produits.

    Qu'est-ce qui montre que la réponse est ancrée dans le fichier ?
body:
  options:
    - { id: a, text: { en: "The response repeats the instructions of the agent.", fr: "La réponse répète les instructions de l'agent." } }
    - { id: b, text: { en: "The response is presented as a table.", fr: "La réponse est présentée sous forme de tableau." } }
    - { id: c, text: { en: "The response includes a citation to the knowledge source.", fr: "La réponse inclut une citation de la source de connaissances." } }
    - { id: d, text: { en: "The response is identical at every attempt.", fr: "La réponse est identique à chaque tentative." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When an agent uses knowledge, Foundry searches the indexed content and grounds the response in what it retrieves. The response then includes a citation to the knowledge store that was used, which is what you check during a test.
    fr: |
      Quand un agent utilise des connaissances, Foundry effectue une recherche dans le contenu indexé et ancre la réponse dans ce qu'il récupère. La réponse inclut alors une citation de la base de connaissances utilisée : c'est ce que vous vérifiez pendant un test.
  options:
    a:
      en: "The instructions guide the behavior of the agent; an agent doesn't repeat them to prove where an answer comes from."
      fr: "Les instructions guident le comportement de l'agent ; un agent ne les répète pas pour prouver l'origine d'une réponse."
    b:
      en: "The layout of a response depends on the instructions or on the prompt, not on the use of knowledge."
      fr: "La mise en forme d'une réponse dépend des instructions ou de l'invite, pas de l'utilisation de connaissances."
    d:
      en: "Generated wording can vary between attempts, with or without knowledge; identical wording proves nothing about the source."
      fr: "La formulation générée peut varier d'une tentative à l'autre, avec ou sans connaissances ; une formulation identique ne prouve rien sur la source."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
