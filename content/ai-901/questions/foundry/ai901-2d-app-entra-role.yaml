id: ai901-2d-app-entra-role
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Python application creates its Azure Content Understanding in Foundry Tools client as follows.

    ```python
    client = ContentUnderstandingClient(endpoint=endpoint, credential=DefaultAzureCredential())
    ```

    You run the application with your own account, which has the Owner role on the Foundry resource. The calls to `begin_analyze` are refused for lack of permission.

    Which role should you assign to your account on the Foundry resource?
  fr: |
    Une application Python crée son client Azure Content Understanding dans Foundry Tools comme suit.

    ```python
    client = ContentUnderstandingClient(endpoint=endpoint, credential=DefaultAzureCredential())
    ```

    Vous exécutez l'application avec votre propre compte, qui possède le rôle Owner sur la ressource Foundry. Les appels à `begin_analyze` sont refusés faute d'autorisation.

    Quel rôle devez-vous attribuer à votre compte sur la ressource Foundry ?
body:
  options:
  - id: a
    text: Reader
  - id: b
    text: Contributor
  - id: c
    text: User Access Administrator
  - id: d
    text: Cognitive Services User
answer:
  optionId: d
explanation:
  correct:
    en: With Microsoft Entra ID authentication, the caller needs the Cognitive Services User role on the Foundry resource to call the service. Microsoft states that this assignment is required even for the owner of the resource, because Owner manages the resource but doesn't grant access to its data operations.
    fr: Avec l'authentification Microsoft Entra ID, l'appelant a besoin du rôle Cognitive Services User sur la ressource Foundry pour appeler le service. Microsoft précise que cette attribution est nécessaire même pour le propriétaire de la ressource, car Owner gère la ressource mais ne donne pas accès à ses opérations de données.
  options:
    a:
      en: Reader lets you view the resource; it doesn't allow calls to the analysis operations.
      fr: Reader permet de consulter la ressource ; il n'autorise pas les appels aux opérations d'analyse.
    b:
      en: Contributor manages the resource, like Owner, without granting the right to call the service with Microsoft Entra ID.
      fr: Contributor gère la ressource, comme Owner, sans accorder le droit d'appeler le service avec Microsoft Entra ID.
    c:
      en: User Access Administrator manages role assignments; it doesn't allow calls to the service.
      fr: User Access Administrator gère les attributions de rôles ; il n'autorise pas les appels au service.
references:
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
