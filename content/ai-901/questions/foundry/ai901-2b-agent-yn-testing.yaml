id: ai901-2b-agent-yn-testing
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You want to test an agent in the agents playground of the Foundry portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous souhaitez tester un agent dans le terrain de jeu des agents du portail Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can test the agent in the playground without writing code.
        fr: Vous pouvez tester l'agent dans le terrain de jeu sans écrire de code.
    - id: s2
      text:
        en: You can attach tools such as file search and code interpreter to the agent in the playground.
        fr: Vous pouvez associer à l'agent des outils comme la recherche de fichiers et l'interpréteur de code dans le terrain de jeu.
    - id: s3
      text:
        en: You must publish the agent before you can test it in the playground.
        fr: Vous devez publier l'agent avant de pouvoir le tester dans le terrain de jeu.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The agents playground is made to explore, prototype and test agents without running code: you configure the instructions, attach tools, add knowledge and try multi-turn conversations. Testing comes before publishing in the life cycle of an agent; publishing is what later gives the agent a stable endpoint.
    fr: |
      Le terrain de jeu des agents sert à explorer, prototyper et tester des agents sans exécuter de code : vous configurez les instructions, associez des outils, ajoutez des connaissances et essayez des conversations à plusieurs tours. Dans le cycle de vie d'un agent, le test précède la publication ; c'est la publication qui donne ensuite à l'agent un point de terminaison stable.
references:
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
  - title: What is Microsoft Foundry Agent Service?
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
