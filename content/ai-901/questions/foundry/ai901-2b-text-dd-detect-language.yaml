id: ai901-2b-text-dd-detect-language
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Python application that uses the Azure Language SDK to display the two-letter code of the language of a text. The application authenticates with the key of the Foundry resource, stored in `key`.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application Python qui utilise le SDK Azure Language pour afficher le code à deux lettres de la langue d'un texte. L'application s'authentifie avec la clé de la ressource Foundry, stockée dans `key`.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    client = [[cls]](endpoint=endpoint, credential=[[cred]](key))

    result = client.detect_language([text])[0]
    print(result.primary_language.[[attr]])
  slots:
    - id: cls
      options:
        - { id: openai, text: OpenAI }
        - { id: project, text: AIProjectClient }
        - { id: language, text: TextAnalyticsClient }
        - { id: speech, text: SpeechRecognizer }
    - id: cred
      options:
        - { id: keycred, text: AzureKeyCredential }
        - { id: entra, text: DefaultAzureCredential }
        - { id: dotenv, text: load_dotenv }
    - id: attr
      options:
        - { id: name, text: name }
        - { id: iso, text: iso6391_name }
        - { id: score, text: confidence_score }
answer:
  values: { cls: language, cred: keycred, attr: iso }
explanation:
  correct:
    en: |
      `TextAnalyticsClient` is the client class of the Azure Language SDK, and it offers `detect_language`. A key is passed to it wrapped in `AzureKeyCredential`. In the result, `primary_language.iso6391_name` is the ISO 639-1 code of the language, such as `fr` or `es`.
    fr: |
      `TextAnalyticsClient` est la classe cliente du SDK Azure Language, et elle propose `detect_language`. Une clé lui est passée encapsulée dans `AzureKeyCredential`. Dans le résultat, `primary_language.iso6391_name` est le code ISO 639-1 de la langue, comme `fr` ou `es`.
  options:
    openai: { en: "OpenAI is the client that calls a deployed generative model; it has no `detect_language` method.", fr: "OpenAI est le client qui appelle un modèle génératif déployé ; il n'a pas de méthode `detect_language`." }
    project: { en: "AIProjectClient connects to a Foundry project and its agents.", fr: "AIProjectClient se connecte à un projet Foundry et à ses agents." }
    speech: { en: "SpeechRecognizer converts speech to text in the Speech SDK.", fr: "SpeechRecognizer convertit la parole en texte dans le SDK Speech." }
    entra: { en: "DefaultAzureCredential authenticates with Microsoft Entra ID and takes no key.", fr: "DefaultAzureCredential authentifie avec Microsoft Entra ID et ne prend pas de clé." }
    dotenv: { en: "load_dotenv loads the values of a `.env` file; it doesn't create a credential.", fr: "load_dotenv charge les valeurs d'un fichier `.env` ; il ne crée pas d'informations d'identification." }
    name: { en: "name is the readable name of the language, such as French.", fr: "name est le nom lisible de la langue, par exemple French." }
    score: { en: "confidence_score is a number between 0 and 1.", fr: "confidence_score est un nombre compris entre 0 et 1." }
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
  - title: Azure Text Analytics client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-textanalytics-readme
