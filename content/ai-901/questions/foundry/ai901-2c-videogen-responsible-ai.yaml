id: ai901-2c-videogen-responsible-ai
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing team uses a Sora model deployed in Microsoft Foundry. A team member submits a prompt that asks for a video of a well-known cartoon character that is protected by copyright.

    What should the team expect?
  fr: |
    Une équipe marketing utilise un modèle Sora déployé dans Microsoft Foundry. Un membre de l'équipe envoie une invite qui demande une vidéo d'un personnage de dessin animé célèbre, protégé par le droit d'auteur.

    À quoi l'équipe doit-elle s'attendre ?
body:
  options:
    - id: a
      text:
        en: "The video is generated, because the restrictions apply to image models only."
        fr: "La vidéo est générée, car les restrictions ne s'appliquent qu'aux modèles d'images."
    - id: b
      text:
        en: "The request returns a still image of the character instead of a clip."
        fr: "La requête renvoie une image fixe du personnage au lieu d'un clip."
    - id: c
      text:
        en: "The video is generated if the shortest duration is selected."
        fr: "La vidéo est générée si la durée la plus courte est sélectionnée."
    - id: d
      text:
        en: "The request is limited by the Responsible AI restrictions of the model."
        fr: "La requête est limitée par les restrictions d'IA responsable du modèle."
answer:
  optionId: d
explanation:
  correct:
    en: |
      The Sora models include Responsible AI restrictions, among them limits on real people and on copyrighted characters. A prompt that asks for a protected character falls under these safeguards, whatever the other settings of the request.
    fr: |
      Les modèles Sora intègrent des restrictions d'IA responsable, dont des limites sur les personnes réelles et sur les personnages protégés par le droit d'auteur. Une invite qui demande un personnage protégé relève de ces garde-fous, quels que soient les autres paramètres de la requête.
  options:
    a:
      en: "The Responsible AI restrictions are part of the Sora video models themselves."
      fr: "Les restrictions d'IA responsable font partie des modèles vidéo Sora eux-mêmes."
    b:
      en: "A Sora model generates video; it doesn't replace a restricted request with a still image."
      fr: "Un modèle Sora génère de la vidéo ; il ne remplace pas une requête restreinte par une image fixe."
    c:
      en: "The restrictions concern the content of the video, not its duration."
      fr: "Les restrictions portent sur le contenu de la vidéo, pas sur sa durée."
references:
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
  - title: "Video generation with Sora 2 (preview)"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation
