id: ai901-2a-playground-features-dnd
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You test a deployed model in the model playground of the Foundry portal.

    Which playground feature should you use for each task? To answer, drag the appropriate features to the correct tasks. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous testez un modèle déployé dans le terrain de jeu de modèles du portail Foundry.

    Quelle fonctionnalité du terrain de jeu devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les fonctionnalités appropriées vers les tâches correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ins, text: "Instructions" }
    - { id: cmp, text: "Compare models" }
    - { id: cod, text: "Code" }
    - { id: tls, text: "Tools" }
    - { id: new, text: "New chat" }
  targets:
    - { id: t1, text: { en: "Send one prompt to several deployed models at the same time", fr: "Envoyer une invite à plusieurs modèles déployés en même temps" } }
    - { id: t2, text: { en: "Get sample code that calls the deployment", fr: "Obtenir un exemple de code qui appelle le déploiement" } }
    - { id: t3, text: { en: "Let the model search the web for current information", fr: "Permettre au modèle de rechercher des informations à jour sur le web" } }
answer:
  mapping: { t1: cmp, t2: cod, t3: tls }
explanation:
  correct:
    en: |
      **Compare models** runs up to three models in parallel with the same prompt. The **Code** tab of the chat pane shows code samples that call the deployment. Web search is one of the tools that you add in the **Tools** section. **Instructions** holds the system prompt, and **New chat** starts a conversation with an empty history.
    fr: |
      **Compare models** exécute jusqu'à trois modèles en parallèle avec la même invite. L'onglet **Code** du volet de conversation affiche des exemples de code qui appellent le déploiement. La recherche web est l'un des outils que vous ajoutez dans la section **Tools**. La zone **Instructions** contient l'invite système, et **New chat** démarre une conversation dont l'historique est vide.
references:
  - title: "Microsoft Foundry Playgrounds"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
