id: ai901-2b-text-yn-model-client
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A Python application analyzes customer reviews with the following code. `review` contains the text of a review.

    ```python
    client = OpenAI(base_url=endpoint, api_key=api_key)

    response = client.responses.create(
        model=deployment_name,
        input="List the key phrases of this review: " + review,
    )
    print(response.output_text)
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python analyse des avis de clients avec le code suivant. `review` contient le texte d'un avis.

    ```python
    client = OpenAI(base_url=endpoint, api_key=api_key)

    response = client.responses.create(
        model=deployment_name,
        input="List the key phrases of this review: " + review,
    )
    print(response.output_text)
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The application uses the Azure Language SDK to extract the key phrases.
        fr: L'application utilise le SDK Azure Language pour extraire les expressions clés.
    - id: s2
      text:
        en: Changing the wording of `input` can turn the task into sentiment analysis without any other change to the code.
        fr: Modifier la formulation de `input` peut transformer la tâche en analyse des sentiments sans autre changement dans le code.
    - id: s3
      text:
        en: "`deployment_name` must contain the name that was given to the model when it was deployed."
        fr: "`deployment_name` doit contenir le nom donné au modèle lors de son déploiement."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The code uses the OpenAI library and the Responses API to call a deployed general-purpose model; the Azure Language SDK isn't involved. With a model, the prompt describes the analysis, so another prompt gives another task. The `model` argument takes the deployment name, which equals the model name only if you didn't customize it.
    fr: |
      Le code utilise la bibliothèque OpenAI et l'API Responses pour appeler un modèle à usage général déployé ; le SDK Azure Language n'intervient pas. Avec un modèle, c'est l'invite qui décrit l'analyse : une autre invite donne donc une autre tâche. L'argument `model` prend le nom du déploiement, qui n'est égal au nom du modèle que si vous ne l'avez pas personnalisé.
references:
  - title: Create a client application that analyzes text
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
