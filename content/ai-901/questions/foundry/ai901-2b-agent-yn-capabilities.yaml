id: ai901-2b-agent-yn-capabilities
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are evaluating what an agent created in Microsoft Foundry can do.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez ce que peut faire un agent créé dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An agent includes a model, which it uses for reasoning.
        fr: Un agent comprend un modèle, qu'il utilise pour raisonner.
    - id: s2
      text:
        en: Each application that calls an agent must define the agent's tools again in its own code.
        fr: Chaque application qui appelle un agent doit redéfinir les outils de l'agent dans son propre code.
    - id: s3
      text:
        en: An agent can call one of its tools automatically when a request requires it.
        fr: Un agent peut appeler automatiquement l'un de ses outils lorsqu'une demande l'exige.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      An agent combines a model used for reasoning, instructions and tools. Because these parts are saved together, an application only references the agent: it doesn't define the tools again. During a conversation, the agent calls its tools automatically when they are needed.
    fr: |
      Un agent combine un modèle utilisé pour raisonner, des instructions et des outils. Comme ces éléments sont enregistrés ensemble, une application se contente de référencer l'agent : elle ne redéfinit pas les outils. Pendant une conversation, l'agent appelle automatiquement ses outils quand ils sont nécessaires.
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
