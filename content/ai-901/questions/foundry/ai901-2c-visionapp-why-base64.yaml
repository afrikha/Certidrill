id: ai901-2c-visionapp-why-base64
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application calls an image-generation model deployed in Microsoft Foundry. The response contains the generated image as a base64 string.

    Why is the image returned in this form?
  fr: |
    Une application appelle un modèle de génération d'images déployé dans Microsoft Foundry. La réponse contient l'image générée sous forme de chaîne base64.

    Pourquoi l'image est-elle renvoyée sous cette forme ?
body:
  options:
    - id: a
      text:
        en: "Base64 compresses the image, which reduces the cost of the request."
        fr: "Le base64 compresse l'image, ce qui réduit le coût de la requête."
    - id: b
      text:
        en: "Base64 encrypts the image, which protects it during the transfer."
        fr: "Le base64 chiffre l'image, ce qui la protège pendant le transfert."
    - id: c
      text:
        en: "Base64 increases the resolution of the image before it is saved."
        fr: "Le base64 augmente la résolution de l'image avant son enregistrement."
    - id: d
      text:
        en: "Base64 represents binary data as text, which can be embedded in JSON."
        fr: "Le base64 représente des données binaires sous forme de texte, qui peut être intégré dans du JSON."
answer:
  optionId: d
explanation:
  correct:
    en: |
      An image is binary data, whereas a JSON response is text. Base64 encoding converts the bytes of the image into ASCII text so that they can travel inside JSON; the application decodes the string to get the bytes back before it writes the file.
    fr: |
      Une image est constituée de données binaires, alors qu'une réponse JSON est du texte. L'encodage base64 convertit les octets de l'image en texte ASCII pour qu'ils puissent voyager dans du JSON ; l'application décode la chaîne pour retrouver les octets avant d'écrire le fichier.
  options:
    a:
      en: "Base64 doesn't compress: the encoded text is larger than the original bytes."
      fr: "Le base64 ne compresse pas : le texte encodé est plus volumineux que les octets d'origine."
    b:
      en: "Base64 is an encoding that anyone can reverse, not an encryption."
      fr: "Le base64 est un encodage que n'importe qui peut inverser, pas un chiffrement."
    c:
      en: "Encoding changes how the bytes are written, not the content or the resolution of the image."
      fr: "L'encodage change la façon d'écrire les octets, pas le contenu ni la résolution de l'image."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
