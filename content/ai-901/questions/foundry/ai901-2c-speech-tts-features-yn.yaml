id: ai901-2c-speech-tts-features-yn
objective: "2.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You evaluate the text to speech capability of Azure Speech in Foundry Tools for a lightweight application.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez la synthèse vocale (text-to-speech) d'Azure Speech dans Foundry Tools pour une application légère.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The predefined voices are available for the English language only."
        fr: "Les voix prédéfinies ne sont disponibles que pour la langue anglaise."
    - id: s2
      text:
        en: "The synthesized speech can be written to an audio file instead of being played on a speaker."
        fr: "La parole synthétisée peut être écrite dans un fichier audio au lieu d'être lue sur un haut-parleur."
    - id: s3
      text:
        en: "Before an application can synthesize speech, you must train a custom voice."
        fr: "Avant qu'une application puisse synthétiser de la parole, vous devez entraîner une voix personnalisée."
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: |
      The text to speech API offers many predefined voices that cover multiple languages and regional pronunciations, including natural-sounding neural voices, so no training is required to start. Custom voices are an option, not a prerequisite. The generated audio can be played through a speaker or written to an audio file.
    fr: |
      L'API de synthèse vocale propose de nombreuses voix prédéfinies qui couvrent plusieurs langues et prononciations régionales, dont des voix neuronales au rendu naturel : aucun entraînement n'est donc requis pour commencer. Les voix personnalisées sont une option, pas un prérequis. L'audio généré peut être lu sur un haut-parleur ou écrit dans un fichier audio.
references:
  - title: "Speech synthesis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
  - title: "What is text to speech?"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech
