id: ai901-2b-agent-compare-tools
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In the model playground of the Foundry portal, you compare the answers of three deployed models side by side. You choose one of them and want to add the Code interpreter tool to it before you save it as an agent, but the **Tools** section isn't displayed.

    What should you do first?
  fr: |
    Dans le terrain de jeu de modèles du portail Foundry, vous comparez côte à côte les réponses de trois modèles déployés. Vous en choisissez un et souhaitez lui ajouter l'outil Code interpreter avant de l'enregistrer en tant qu'agent, mais la section **Tools** n'est pas affichée.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Deploy the chosen model again in another region.", fr: "Déployer de nouveau le modèle choisi dans une autre région." } }
    - { id: b, text: { en: "Select **New chat** to clear the conversation.", fr: "Sélectionner **New chat** pour effacer la conversation." } }
    - { id: c, text: { en: "Close the models that are open for comparison.", fr: "Fermer les modèles ouverts pour la comparaison." } }
    - { id: d, text: { en: "Create the agent with the Foundry SDK instead.", fr: "Créer plutôt l'agent avec le SDK Foundry." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the model playground, tools appear only in the single-model view: they aren't visible in compare mode. After you close the comparison models, you expand **Tools**, select **Add** and then **Code interpreter**, and you can save the configuration as an agent.
    fr: |
      Dans le terrain de jeu de modèles, les outils n'apparaissent que dans la vue à un seul modèle : ils ne sont pas visibles en mode comparaison. Après avoir fermé les modèles de comparaison, vous développez **Tools**, sélectionnez **Add** puis **Code interpreter**, et vous pouvez enregistrer la configuration en tant qu'agent.
  options:
    a:
      en: "The region of the deployment isn't what hides the section; the comparison view is."
      fr: "Ce n'est pas la région du déploiement qui masque la section, mais la vue de comparaison."
    b:
      en: "A new chat clears the conversation history but keeps the comparison view open."
      fr: "Une nouvelle conversation efface l'historique mais laisse la vue de comparaison ouverte."
    d:
      en: "The SDK can create agents, but it isn't required: the portal shows the tools as soon as the comparison is closed."
      fr: "Le SDK peut créer des agents, mais il n'est pas nécessaire : le portail affiche les outils dès que la comparaison est fermée."
references:
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
