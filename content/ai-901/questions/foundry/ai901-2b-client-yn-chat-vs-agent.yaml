id: ai901-2b-client-yn-chat-vs-agent
objective: "2.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You compare two Python applications written with the Foundry SDK: a chat client that calls a model deployment, and a client that calls an agent.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez deux applications Python écrites avec le SDK Foundry : un client de conversation qui appelle un déploiement de modèle, et un client qui appelle un agent.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Only the chat client reads the generated answer from `response.output_text`.
        fr: Seul le client de conversation lit la réponse générée dans `response.output_text`.
    - id: s2
      text:
        en: The chat client names a model deployment in its request, and the agent client references an agent.
        fr: Le client de conversation nomme un déploiement de modèle dans sa requête, et le client de l'agent référence un agent.
    - id: s3
      text:
        en: Both applications can connect to the project with `AIProjectClient`.
        fr: Les deux applications peuvent se connecter au projet avec `AIProjectClient`.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Both clients connect with `AIProjectClient`, send their request with `responses.create` and read the text from `output_text`. What differs is the target: a chat client passes `model` with a deployment name, while an agent client passes a reference to the agent, which already holds its model, instructions and tools.
    fr: |
      Les deux clients se connectent avec `AIProjectClient`, envoient leur requête avec `responses.create` et lisent le texte dans `output_text`. Ce qui diffère, c'est la cible : un client de conversation passe `model` avec un nom de déploiement, alors que le client d'un agent passe une référence à l'agent, qui détient déjà son modèle, ses instructions et ses outils.
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
