id: ai901-2c-imagegen-family-yn
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You evaluate the GPT-Image models in Microsoft Foundry.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez les modèles GPT-Image dans Microsoft Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A deployed image-generation model can be tested in a playground of the Foundry portal and called from code through an API."
        fr: "Un modèle de génération d'images déployé peut être testé dans un terrain de jeu du portail Foundry et appelé depuis du code via une API."
    - id: s2
      text:
        en: "GPT-Image-2 is limited to text-to-image generation and offers no image editing."
        fr: "GPT-Image-2 se limite à la génération de texte vers image et n'offre aucune modification d'image."
    - id: s3
      text:
        en: "GPT-Image-1-Mini is optimized for maximum visual fidelity rather than for cost."
        fr: "GPT-Image-1-Mini est optimisé pour la fidélité visuelle maximale plutôt que pour le coût."
answer:
  values:
    s1: true
    s2: false
    s3: false
explanation:
  correct:
    en: |
      The image-generation models are deployed in a Foundry resource, tested in the playground and accessed from code through the Responses API or the image generation APIs. GPT-Image-2 accepts text and images as input and supports image editing, with inpainting and variations. GPT-Image-1-Mini covers the core generation tasks, but it is the lighter model, optimized for lower latency or cost instead of maximum fidelity.
    fr: |
      Les modèles de génération d'images sont déployés dans une ressource Foundry, testés dans le terrain de jeu et utilisés depuis du code via l'API Responses ou les API de génération d'images. GPT-Image-2 accepte du texte et des images en entrée et prend en charge la modification d'images, avec l'inpainting et les variantes. GPT-Image-1-Mini couvre les tâches de génération de base, mais c'est le modèle le plus léger, optimisé pour une latence ou un coût réduits plutôt que pour la fidélité maximale.
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
  - title: "Azure OpenAI image generation models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e
