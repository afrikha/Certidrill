id: ai901-2b-agent-dnd-portal-areas
objective: "2.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You create and test an agent in the playground of the Foundry portal.

    Which element of the playground should you use for each task? To answer, drag the appropriate elements to the correct tasks. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez et testez un agent dans le terrain de jeu du portail Foundry.

    Quel élément du terrain de jeu devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les éléments appropriés vers les tâches correspondantes. Chaque élément peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ins, text: { en: "The **Instructions** box", fr: "La zone **Instructions**" } }
    - { id: tools, text: { en: "The **Tools** section", fr: "La section **Tools**" } }
    - { id: save, text: "**Save as agent**" }
    - { id: chat, text: { en: "The chat pane", fr: "Le volet de conversation" } }
    - { id: compare, text: "**Compare models**" }
  targets:
    - id: t1
      text: { en: "Write the system prompt that sets the role of the agent", fr: "Écrire l'invite système qui fixe le rôle de l'agent" }
    - id: t2
      text: { en: "Enable web search for the agent", fr: "Activer la recherche web pour l'agent" }
    - id: t3
      text: { en: "Give the configuration a name so that applications can call it", fr: "Donner un nom à la configuration pour que des applications puissent l'appeler" }
    - id: t4
      text: { en: "Send test prompts and read the responses", fr: "Envoyer des invites de test et lire les réponses" }
answer:
  mapping: { t1: ins, t2: tools, t3: save, t4: chat }
explanation:
  correct:
    en: |
      The system prompt is written in **Instructions**. Tools such as Web search are enabled in the **Tools** section. **Save as agent** packages the model, the instructions and the tools under an agent name. Test prompts are typed in the chat pane. **Compare models** only shows the answers of several models side by side.
    fr: |
      L'invite système s'écrit dans **Instructions**. Les outils comme Web search s'activent dans la section **Tools**. **Save as agent** regroupe le modèle, les instructions et les outils sous un nom d'agent. Les invites de test se saisissent dans le volet de conversation. **Compare models** affiche seulement les réponses de plusieurs modèles côte à côte.
references:
  - title: Microsoft Foundry Playgrounds
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
