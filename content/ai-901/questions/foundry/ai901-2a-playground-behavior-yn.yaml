id: ai901-2a-playground-behavior-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use the model playground of the Foundry portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez le terrain de jeu de modèles du portail Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "After you change the temperature in the playground, you must redeploy the model for the change to apply.", fr: "Après avoir modifié la température dans le terrain de jeu, vous devez redéployer le modèle pour que la modification s'applique." } }
    - { id: s2, text: { en: "The playground lets you try prompts on a deployed model before you write application code.", fr: "Le terrain de jeu vous permet d'essayer des invites sur un modèle déployé avant d'écrire le code d'une application." } }
    - { id: s3, text: { en: "When you use **Compare models**, each model receives the same prompt by default.", fr: "Lorsque vous utilisez **Compare models**, chaque modèle reçoit par défaut la même invite." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The playgrounds are an on-demand chat environment for testing a model before you write production code. **Compare models** runs up to three models in parallel with synced input: the same prompt, system message and parameters. The temperature is a parameter of the requests that you set in the playground settings; it is not part of the deployment.
    fr: |
      Les terrains de jeu offrent un environnement de conversation à la demande pour tester un modèle avant d'écrire du code de production. **Compare models** exécute jusqu'à trois modèles en parallèle avec une entrée synchronisée : la même invite, le même message système et les mêmes paramètres. La température est un paramètre des requêtes que vous réglez dans les paramètres du terrain de jeu ; elle ne fait pas partie du déploiement.
references:
  - title: "Microsoft Foundry Playgrounds"
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
