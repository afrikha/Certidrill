id: ai901-2c-videogen-playground-settings
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deployed a Sora model and opened it in the video playground of the Foundry portal.

    In addition to the prompt, which settings can you specify for the video?
  fr: |
    Vous avez déployé un modèle Sora et l'avez ouvert dans le terrain de jeu vidéo du portail Foundry.

    En plus de l'invite, quels paramètres pouvez-vous définir pour la vidéo ?
body:
  options:
    - id: a
      text:
        en: "The dimensions and the duration"
        fr: "Les dimensions et la durée"
    - id: b
      text:
        en: "The voice and the speaking rate"
        fr: "La voix et le débit de parole"
    - id: c
      text:
        en: "The analyzer and the schema"
        fr: "L'analyseur et le schéma"
    - id: d
      text:
        en: "The instructions and the tools"
        fr: "Les instructions et les outils"
answer:
  optionId: a
explanation:
  correct:
    en: |
      In the video playground you describe the video in a prompt and set parameters such as the dimensions of the video and its duration. The model then produces the video after a few minutes.
    fr: |
      Dans le terrain de jeu vidéo, vous décrivez la vidéo dans une invite et définissez des paramètres comme les dimensions de la vidéo et sa durée. Le modèle produit ensuite la vidéo au bout de quelques minutes.
  options:
    b:
      en: "A voice and a speaking rate are settings of speech synthesis in Azure Speech."
      fr: "Une voix et un débit de parole sont des paramètres de la synthèse vocale dans Azure Speech."
    c:
      en: "An analyzer and a schema belong to Azure Content Understanding, which extracts information."
      fr: "Un analyseur et un schéma relèvent d'Azure Content Understanding, qui extrait des informations."
    d:
      en: "Instructions and tools define an agent, not a video generation."
      fr: "Des instructions et des outils définissent un agent, pas une génération de vidéo."
references:
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
