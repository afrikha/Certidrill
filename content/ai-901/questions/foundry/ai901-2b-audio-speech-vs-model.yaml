id: ai901-2b-audio-speech-vs-model
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys already answers spoken questions with an audio-enabled multimodal model deployed in Microsoft Foundry. The company lists new requirements.

    Which two requirements should be met with Azure Speech in Foundry Tools instead of the multimodal model?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys répond déjà à des questions vocales avec un modèle multimodal compatible avec l'audio déployé dans Microsoft Foundry. L'entreprise dresse la liste de nouvelles exigences.

    Quelles sont les deux exigences à satisfaire avec Azure Speech dans Foundry Tools plutôt qu'avec le modèle multimodal ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Transcribe 50,000 stored call recordings asynchronously, as a batch.", fr: "Transcrire 50 000 enregistrements d'appels stockés de façon asynchrone, par lots." } }
    - { id: b, text: { en: "Answer a question that a user asks aloud, in a single call.", fr: "Répondre à une question qu'un utilisateur pose à voix haute, en un seul appel." } }
    - { id: c, text: { en: "Reason about the content of a recording and reply with text and speech.", fr: "Raisonner sur le contenu d'un enregistrement et répondre par du texte et de la parole." } }
    - { id: d, text: { en: "Speak with a custom voice created for the company's brand.", fr: "Parler avec une voix personnalisée créée pour la marque de l'entreprise." } }
    - { id: e, text: { en: "Continue a spoken exchange with a typed follow-up question.", fr: "Poursuivre un échange vocal avec une question de suivi saisie au clavier." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Azure Speech is the dedicated speech service: its batch transcription processes large volumes of stored audio asynchronously, and its custom voice feature creates a unique voice for a brand. The multimodal model offers a fixed set of built-in voices and answers one prompt per call.
    fr: |
      Azure Speech est le service dédié à la parole : sa transcription par lots traite de gros volumes d'audio stocké de façon asynchrone, et sa fonctionnalité de voix personnalisée crée une voix unique pour une marque. Le modèle multimodal propose un ensemble fixe de voix intégrées et répond à une invite par appel.
  options:
    b:
      en: "Understanding a spoken question and answering it in one call is what the multimodal model does."
      fr: "Comprendre une question vocale et y répondre en un seul appel, c'est ce que fait le modèle multimodal."
    c:
      en: "Reasoning about audio and replying in text and speech is the role of the generative model; Azure Speech converts between speech and text without reasoning."
      fr: "Raisonner sur de l'audio et répondre en texte et en parole est le rôle du modèle génératif ; Azure Speech convertit entre parole et texte sans raisonner."
    e:
      en: "The multimodal model handles multi-turn conversations in which audio and text prompts are mixed."
      fr: "Le modèle multimodal gère des conversations à plusieurs tours dans lesquelles se mêlent invites audio et invites texte."
references:
  - title: What Is Azure Speech?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/overview
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
