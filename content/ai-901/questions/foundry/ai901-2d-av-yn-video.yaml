id: ai901-2d-av-yn-video
objective: "2.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to analyze recorded meetings by using a video analyzer of Azure Content Understanding in Foundry Tools.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'analyser des réunions enregistrées à l'aide d'un analyseur vidéo d'Azure Content Understanding dans Foundry Tools.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: You must convert a video into a series of images before you submit it to a video analyzer.
      fr: Vous devez convertir une vidéo en une série d'images avant de l'envoyer à un analyseur vidéo.
  - id: s2
    text:
      en: A video analyzer generates fields from both the images and the speech of a video.
      fr: Un analyseur vidéo génère des champs à partir des images et de la parole d'une vidéo.
  - id: s3
    text:
      en: A schema for recorded meetings can ask for a summary of the discussion and the list of the assigned actions.
      fr: Un schéma pour des réunions enregistrées peut demander un résumé de la discussion et la liste des actions attribuées.
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: 'You submit the video file itself: the analyzer extracts the key frames and transcribes the speech, then a generative model uses both to produce the fields. For a recorded meeting, a schema can ask for the attendance, who spoke, a summary of the discussion and the assigned actions.'
    fr: 'Vous envoyez le fichier vidéo lui-même : l''analyseur extrait les images clés et transcrit la parole, puis un modèle génératif utilise les deux pour produire les champs. Pour une réunion enregistrée, un schéma peut demander les participants, qui a parlé, un résumé de la discussion et les actions attribuées.'
references:
- title: Azure Content Understanding in Foundry Tools video overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
- title: Extract information from audio and video.
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/3-audio-video
