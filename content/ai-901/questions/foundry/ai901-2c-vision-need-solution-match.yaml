id: ai901-2c-vision-need-solution-match
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A product team at Tailspin Toys has three requirements.

    What should the team use for each requirement? To answer, drag the appropriate solution to each requirement. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe produit de Tailspin Toys a trois besoins.

    Que doit utiliser l'équipe pour chaque besoin ? Pour répondre, faites glisser la solution appropriée vers chaque besoin. Chaque solution peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: mm
      text:
        en: "A vision-enabled multimodal model"
        fr: "Un modèle multimodal compatible avec la vision"
    - id: ig
      text:
        en: "An image-generation model"
        fr: "Un modèle de génération d'images"
    - id: sp
      text:
        en: "Azure Speech in Foundry Tools"
        fr: "Azure Speech dans Foundry Tools"
    - id: emb
      text:
        en: "An embedding model"
        fr: "Un modèle d'embedding"
  targets:
    - id: t1
      text:
        en: "Explain to a customer what an assembly diagram shows."
        fr: "Expliquer à un client ce que montre un schéma de montage."
    - id: t2
      text:
        en: "Create an illustration of a new toy from a written description."
        fr: "Créer l'illustration d'un nouveau jouet à partir d'une description écrite."
    - id: t3
      text:
        en: "Read a written answer aloud to a customer."
        fr: "Lire une réponse écrite à voix haute à un client."
answer:
  mapping:
    t1: mm
    t2: ig
    t3: sp
explanation:
  correct:
    en: |
      Interpreting a diagram is image understanding: a vision-enabled model receives the image with a prompt and explains it in text. Creating a picture from a description is the reverse task and requires an image-generation model. Reading text aloud is speech synthesis, provided by Azure Speech. An embedding model only returns vectors.
    fr: |
      Interpréter un schéma relève de la compréhension d'image : un modèle compatible avec la vision reçoit l'image avec une invite et l'explique en texte. Créer une image à partir d'une description est la tâche inverse et exige un modèle de génération d'images. Lire un texte à voix haute relève de la synthèse vocale, fournie par Azure Speech. Un modèle d'embedding ne renvoie que des vecteurs.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
