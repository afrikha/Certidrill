id: ai901-2a-endpoints-dnd
objective: "2.1.3"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    A Foundry resource named **contoso-ai** contains a project named **proj-support**. You build chat clients for a model deployed in the project.

    Which URL should you use for each purpose? To answer, drag the appropriate URLs to the correct purposes. Each URL may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une ressource Foundry nommée **contoso-ai** contient un projet nommé **proj-support**. Vous créez des clients de conversation pour un modèle déployé dans le projet.

    Quelle URL devez-vous utiliser pour chaque usage ? Pour répondre, faites glisser les URL appropriées vers les usages correspondants. Chaque URL peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: aoai, text: "https://contoso-ai.openai.azure.com/openai/v1/" }
    - { id: anth, text: "https://contoso-ai.services.ai.azure.com/anthropic" }
    - { id: portal, text: "https://ai.azure.com" }
    - { id: proj, text: "https://contoso-ai.services.ai.azure.com/api/projects/proj-support" }
    - { id: azure, text: "https://portal.azure.com" }
  targets:
    - { id: t1, text: { en: "The `endpoint` argument of `AIProjectClient`", fr: "L'argument `endpoint` d'`AIProjectClient`" } }
    - { id: t2, text: { en: "The `base_url` argument of an `OpenAI` client that authenticates with an API key", fr: "L'argument `base_url` d'un client `OpenAI` qui s'authentifie avec une clé d'API" } }
    - { id: t3, text: { en: "The address at which you sign in to the Foundry portal", fr: "L'adresse à laquelle vous vous connectez au portail Foundry" } }
answer:
  mapping: { t1: proj, t2: aoai, t3: portal }
explanation:
  correct:
    en: |
      The Foundry SDK uses the project endpoint, in the form `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`. The OpenAI SDK uses the Azure OpenAI endpoint, `https://<resource-name>.openai.azure.com/openai/v1`, on which API keys work. The Foundry portal is at `https://ai.azure.com`. The `/anthropic` endpoint serves Claude models through the Anthropic SDK, and `https://portal.azure.com` is the Azure portal.
    fr: |
      Le SDK Foundry utilise le point de terminaison du projet, de la forme `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`. Le SDK OpenAI utilise le point de terminaison Azure OpenAI, `https://<resource-name>.openai.azure.com/openai/v1`, sur lequel les clés d'API fonctionnent. Le portail Foundry se trouve à l'adresse `https://ai.azure.com`. Le point de terminaison `/anthropic` sert les modèles Claude via le SDK Anthropic, et `https://portal.azure.com` est le portail Azure.
references:
  - title: "Microsoft Foundry SDKs and endpoints"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
