id: ai901-2b-client-az-login
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You copy the following Python code to your workstation to call an agent in a Foundry project. The required packages are installed.

    ```python
    project_client = AIProjectClient(
        endpoint=project_endpoint,
        credential=DefaultAzureCredential(),
    )
    ```

    What should you do before you run the script?
  fr: |
    Vous copiez le code Python suivant sur votre poste de travail pour appeler un agent dans un projet Foundry. Les packages nécessaires sont installés.

    ```python
    project_client = AIProjectClient(
        endpoint=project_endpoint,
        credential=DefaultAzureCredential(),
    )
    ```

    Que devez-vous faire avant d'exécuter le script ?
body:
  options:
    - { id: a, text: { en: "Sign in to Azure by running `az login`.", fr: "Vous connecter à Azure en exécutant `az login`." } }
    - { id: b, text: { en: "Store the key of the Foundry resource in an environment variable.", fr: "Stocker la clé de la ressource Foundry dans une variable d'environnement." } }
    - { id: c, text: { en: "Append a shared access signature (SAS) token to the endpoint.", fr: "Ajouter un jeton de signature d'accès partagé (SAS) au point de terminaison." } }
    - { id: d, text: { en: "Publish the agent to Microsoft Teams.", fr: "Publier l'agent dans Microsoft Teams." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `DefaultAzureCredential` authenticates the application with a Microsoft Entra ID identity, for example the one of your Azure CLI session after `az login`. Microsoft Entra ID is the only authentication method that the project client supports.
    fr: |
      `DefaultAzureCredential` authentifie l'application avec une identité Microsoft Entra ID, par exemple celle de votre session Azure CLI après `az login`. Microsoft Entra ID est la seule méthode d'authentification que le client de projet prend en charge.
  options:
    b:
      en: "The project client doesn't accept an API key, and this code never reads one."
      fr: "Le client de projet n'accepte pas de clé API, et ce code n'en lit aucune."
    c:
      en: "SAS tokens grant access to Azure Storage resources; they aren't used to call a Foundry project."
      fr: "Les jetons SAS accordent l'accès à des ressources du Stockage Azure ; ils ne servent pas à appeler un projet Foundry."
    d:
      en: "Publishing shares an agent through other channels; a client can call the agent in the project without it."
      fr: "La publication partage un agent par d'autres canaux ; un client peut appeler l'agent dans le projet sans elle."
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: Azure AI Projects client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-projects-readme
