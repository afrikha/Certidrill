id: ai901-2b-agent-mcp-tool
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a remote server that exposes the operations of its order-tracking system to AI agents through an open standard protocol. An agent that you create in the Foundry portal must be able to check the current status of an order during a conversation.

    What should you add to the agent?
  fr: |
    Litware exploite un serveur distant qui expose les opérations de son système de suivi des commandes aux agents IA par l'intermédiaire d'un protocole fondé sur une norme ouverte. Un agent que vous créez dans le portail Foundry doit pouvoir vérifier l'état actuel d'une commande pendant une conversation.

    Que devez-vous ajouter à l'agent ?
body:
  options:
    - { id: a, text: { en: "A knowledge file exported from the order system", fr: "Un fichier de connaissances exporté du système de commandes" } }
    - { id: b, text: { en: "The Web search tool", fr: "L'outil Web search" } }
    - { id: c, text: { en: "The Code interpreter tool", fr: "L'outil Code interpreter" } }
    - { id: d, text: { en: "The MCP server, as a tool", fr: "Le serveur MCP, en tant qu'outil" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Model Context Protocol (MCP) is an open standard that defines how AI agents connect to external tools and data sources. Tools are the actions of an agent: when the MCP server is added as a tool, the agent discovers the operations that the server exposes and calls them when a request requires it.
    fr: |
      Le protocole MCP (Model Context Protocol) est une norme ouverte qui définit la façon dont les agents IA se connectent à des outils et à des sources de données externes. Les outils sont les actions d'un agent : quand le serveur MCP est ajouté en tant qu'outil, l'agent découvre les opérations que le serveur expose et les appelle lorsqu'une demande l'exige.
  options:
    a:
      en: "Knowledge is context that is indexed once; an exported file wouldn't reflect the current status of an order."
      fr: "Les connaissances sont du contexte indexé une fois ; un fichier exporté ne refléterait pas l'état actuel d'une commande."
    b:
      en: "Web search retrieves public web content; it can't query Litware's internal order system."
      fr: "Web search récupère du contenu web public ; il ne peut pas interroger le système de commandes interne de Litware."
    c:
      en: "Code interpreter runs Python code in an isolated sandbox that can't make outbound network requests, so it can't reach the server."
      fr: "Code interpreter exécute du code Python dans un bac à sable isolé qui ne peut pas émettre de requêtes réseau sortantes : il ne peut donc pas joindre le serveur."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: Use Azure Language with an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/4-language-mcp
