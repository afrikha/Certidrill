id: ai901-2b-client-dd-get-agent
objective: "2.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    An agent named **support-agent** exists in a Foundry project. You write Python code that retrieves the agent and sends it a question. `project_client` is an `AIProjectClient` object that is connected to the project.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un agent nommé **support-agent** existe dans un projet Foundry. Vous écrivez du code Python qui récupère l'agent et lui envoie une question. `project_client` est un objet `AIProjectClient` connecté au projet.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    agent = project_client.agents.[[op]](agent_name="support-agent")
    openai_client = project_client.get_openai_client()

    response = openai_client.responses.create(
        input=[{"role": "user", "content": "How do I reset my password?"}],
        extra_body={"agent": {"name": agent.name, "type": "[[ref]]"}},
    )
    print(response.output_text)
  slots:
    - id: op
      options:
        - { id: get, text: get }
        - { id: create, text: create_version }
        - { id: delete, text: delete_version }
    - id: ref
      options:
        - { id: function, text: function }
        - { id: message, text: message }
        - { id: agentref, text: agent_reference }
        - { id: websearch, text: web_search }
answer:
  values: { op: get, ref: agentref }
explanation:
  correct:
    en: |
      `agents.get(agent_name=...)` retrieves an agent that already exists in the project. In the request, the agent is designated by its name with the type `agent_reference`, which tells the service that the request is addressed to that agent.
    fr: |
      `agents.get(agent_name=...)` récupère un agent qui existe déjà dans le projet. Dans la requête, l'agent est désigné par son nom avec le type `agent_reference`, ce qui indique au service que la requête s'adresse à cet agent.
  options:
    create: { en: "create_version creates an agent, or a new version of it, from a definition; here the agent already exists.", fr: "create_version crée un agent, ou une nouvelle version de celui-ci, à partir d'une définition ; ici, l'agent existe déjà." }
    delete: { en: "delete_version removes a version of the agent.", fr: "delete_version supprime une version de l'agent." }
    function: { en: "function is the type of a custom function tool, not of a reference to an agent.", fr: "function est le type d'un outil de fonction personnalisée, pas celui d'une référence à un agent." }
    message: { en: "message is the type of an input item of a conversation.", fr: "message est le type d'un élément d'entrée d'une conversation." }
    websearch: { en: "web_search is the type of the web search tool.", fr: "web_search est le type de l'outil de recherche web." }
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
