id: ai901-2c-speech-capabilities-match
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You plan three features that use Azure Speech in Foundry Tools.

    Which capability should you use for each feature? To answer, drag the appropriate capability to each feature. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez trois fonctionnalités qui utilisent Azure Speech dans Foundry Tools.

    Quelle capacité devez-vous utiliser pour chaque fonctionnalité ? Pour répondre, faites glisser la capacité appropriée vers chaque fonctionnalité. Chaque capacité peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: rt
      text:
        en: "Real-time transcription"
        fr: "Transcription en temps réel"
    - id: batch
      text:
        en: "Batch transcription"
        fr: "Transcription par lots"
    - id: tts
      text:
        en: "Text to speech"
        fr: "Synthèse vocale (text-to-speech)"
    - id: trans
      text:
        en: "Speech translation"
        fr: "Traduction vocale"
  targets:
    - id: t1
      text:
        en: "Display captions while a presenter speaks into a microphone."
        fr: "Afficher des sous-titres pendant qu'un présentateur parle dans un microphone."
    - id: t2
      text:
        en: "Transcribe thousands of call recordings stored in Azure Storage, and collect the results later."
        fr: "Transcrire des milliers d'enregistrements d'appels stockés dans Stockage Azure, et récupérer les résultats plus tard."
    - id: t3
      text:
        en: "Read the status of an order aloud to a customer."
        fr: "Lire à voix haute l'état d'une commande à un client."
answer:
  mapping:
    t1: rt
    t2: batch
    t3: tts
explanation:
  correct:
    en: |
      Real-time transcription converts an audio stream into text as the person speaks, which is what live captions need. Batch transcription processes stored recordings asynchronously, so the results are collected later. Reading a text aloud is speech synthesis, also called text to speech. Speech translation isn't needed, because no feature changes the language.
    fr: |
      La transcription en temps réel convertit un flux audio en texte au fil de la parole, ce qu'exigent des sous-titres en direct. La transcription par lots traite des enregistrements stockés de façon asynchrone : les résultats sont récupérés plus tard. Lire un texte à voix haute relève de la synthèse vocale (text-to-speech). La traduction vocale n'est pas nécessaire, car aucune fonctionnalité ne change de langue.
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: "What is speech to text?"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-to-text
