id: ai901-2b-text-yn-approaches
objective: "2.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are choosing between a general-purpose model and Azure Language in Foundry Tools for an application that analyzes text.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous hésitez entre un modèle à usage général et Azure Language dans Foundry Tools pour une application qui analyse du texte.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A general-purpose model can summarize a text or extract its key phrases when a prompt asks for it.
        fr: Un modèle à usage général peut résumer un texte ou en extraire les expressions clés quand une invite le demande.
    - id: s2
      text:
        en: A general-purpose model must be trained on labeled reviews before it can analyze the sentiment of a review.
        fr: Un modèle à usage général doit être entraîné sur des avis étiquetés avant de pouvoir analyser le sentiment d'un avis.
    - id: s3
      text:
        en: Azure Language returns structured results that an automated pipeline can rely on.
        fr: Azure Language renvoie des résultats structurés sur lesquels un pipeline automatisé peut s'appuyer.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A deployed general-purpose model performs key phrase extraction, sentiment analysis or summarization from a natural language prompt, with no configuration or training. Azure Language offers purpose-built analyzers whose output is structured and deterministic, which suits automated pipelines.
    fr: |
      Un modèle à usage général déployé effectue l'extraction d'expressions clés, l'analyse des sentiments ou le résumé à partir d'une invite en langage naturel, sans configuration ni entraînement. Azure Language propose des analyseurs spécialisés dont la sortie est structurée et déterministe, ce qui convient aux pipelines automatisés.
references:
  - title: Understand text analysis in Foundry
    url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
