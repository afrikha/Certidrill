id: ai901-2b-client-dd-connect
objective: "2.1.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are writing a Python client application that connects to a Foundry project to call an agent named **support-agent**. The application must authenticate with Microsoft Entra ID. The endpoint of the project is in the `project_endpoint` variable.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez une application cliente Python qui se connecte à un projet Foundry pour appeler un agent nommé **support-agent**. L'application doit s'authentifier avec Microsoft Entra ID. Le point de terminaison du projet se trouve dans la variable `project_endpoint`.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    project_client = [[cls]](
        endpoint=project_endpoint,
        credential=[[cred]],
    )
    agent = project_client.agents.get(agent_name="support-agent")
  slots:
    - id: cls
      options:
        - { id: project, text: AIProjectClient }
        - { id: language, text: TextAnalyticsClient }
        - { id: speech, text: SpeechRecognizer }
        - { id: openai, text: OpenAI }
    - id: cred
      options:
        - { id: entra, text: "DefaultAzureCredential()" }
        - { id: key, text: "AzureKeyCredential(api_key)" }
        - { id: env, text: 'os.getenv("API_KEY")' }
answer:
  values: { cls: project, cred: entra }
explanation:
  correct:
    en: |
      `AIProjectClient` is the Foundry SDK class that connects to a project and gives access to its agents. `DefaultAzureCredential()` authenticates the application with a Microsoft Entra ID identity, the only method that the project client supports.
    fr: |
      `AIProjectClient` est la classe du SDK Foundry qui se connecte à un projet et donne accès à ses agents. `DefaultAzureCredential()` authentifie l'application avec une identité Microsoft Entra ID, la seule méthode que le client de projet prend en charge.
  options:
    language: { en: "TextAnalyticsClient is the client of the Azure Language SDK; it has no `agents` operations.", fr: "TextAnalyticsClient est le client du SDK Azure Language ; il n'a pas d'opérations `agents`." }
    speech: { en: "SpeechRecognizer belongs to the Speech SDK and converts speech to text.", fr: "SpeechRecognizer appartient au SDK Speech et convertit la parole en texte." }
    openai: { en: "The OpenAI client calls models; it is obtained from the project client and can't retrieve an agent with `agents.get`.", fr: "Le client OpenAI appelle des modèles ; il s'obtient à partir du client de projet et ne peut pas récupérer un agent avec `agents.get`." }
    key: { en: "AzureKeyCredential wraps an API key, which isn't Microsoft Entra ID authentication.", fr: "AzureKeyCredential encapsule une clé API, ce qui n'est pas une authentification Microsoft Entra ID." }
    env: { en: "This reads a key from an environment variable; it isn't a credential object and isn't Microsoft Entra ID authentication.", fr: "Cette expression lit une clé dans une variable d'environnement ; ce n'est pas un objet d'informations d'identification ni une authentification Microsoft Entra ID." }
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: Azure AI Projects client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-projects-readme
