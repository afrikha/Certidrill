id: ai901-2c-videogen-model-family
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A training team wants to produce short video clips from text descriptions by using a model from the Foundry model catalog.

    Which family of models should the team use?
  fr: |
    Une équipe de formation veut produire de courts clips vidéo à partir de descriptions en texte, à l'aide d'un modèle du catalogue de modèles Foundry.

    Quelle famille de modèles l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: "GPT-Image"
    - id: b
      text: "FLUX"
    - id: c
      text: "GPT-4.1"
    - id: d
      text: "Sora"
answer:
  optionId: d
explanation:
  correct:
    en: |
      The Sora models are the video-generation models of Microsoft Foundry: they create video clips from text prompts. The other families listed produce still images or text.
    fr: |
      Les modèles Sora sont les modèles de génération de vidéos de Microsoft Foundry : ils créent des clips vidéo à partir d'invites en texte. Les autres familles citées produisent des images fixes ou du texte.
  options:
    a:
      en: "The GPT-Image family generates and edits still images."
      fr: "La famille GPT-Image génère et modifie des images fixes."
    b:
      en: "FLUX is a family of image-generation models; it produces still images."
      fr: "FLUX est une famille de modèles de génération d'images ; elle produit des images fixes."
    c:
      en: "GPT-4.1 is a multimodal chat model whose output is text."
      fr: "GPT-4.1 est un modèle de conversation multimodal dont la sortie est du texte."
references:
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
