id: ai901-2d-doc-ocr-result
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum scans paper purchase forms and runs optical character recognition (OCR) on each scan.

    Which result does OCR alone provide?
  fr: |
    Adatum numérise des bons d'achat papier et applique la reconnaissance optique de caractères (OCR) à chaque numérisation.

    Quel résultat l'OCR fournit-elle à elle seule ?
body:
  options:
  - id: a
    text:
      en: The text of the form as machine-readable characters
      fr: Le texte du formulaire sous forme de caractères lisibles par une machine
  - id: b
    text:
      en: The named fields of the form, such as the order total
      fr: Les champs nommés du formulaire, comme le total de la commande
  - id: c
    text:
      en: A summary of the form written by a generative model
      fr: Un résumé du formulaire rédigé par un modèle génératif
  - id: d
    text:
      en: A classification of the form by document type
      fr: Une classification du formulaire par type de document
answer:
  optionId: a
explanation:
  correct:
    en: OCR converts the text of an image or a scan into digital text. It doesn't understand what the values mean or how they relate to each other, so it can't tell which number is the order total.
    fr: 'L''OCR convertit le texte d''une image ou d''une numérisation en texte numérique. Elle ne comprend ni le sens des valeurs ni leurs relations : elle ne peut donc pas dire quel nombre est le total de la commande.'
  options:
    b:
      en: Named fields require an analyzer that applies a schema; OCR only returns what is written.
      fr: Les champs nommés exigent un analyseur qui applique un schéma ; l'OCR renvoie seulement ce qui est écrit.
    c:
      en: A summary is a value that a generative model produces, not a result of character recognition.
      fr: Un résumé est une valeur produite par un modèle génératif, pas un résultat de la reconnaissance de caractères.
    d:
      en: Classifying a document is a separate analysis step; OCR doesn't interpret the content.
      fr: Classifier un document est une étape d'analyse distincte ; l'OCR n'interprète pas le contenu.
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
