id: ai901-2b-agent-knowledge-sources
objective: "2.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are configuring an agent in the Foundry portal. You must decide which items to add as knowledge, that is, as content that the agent retrieves to ground its answers.

    Which two items are knowledge sources?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez un agent dans le portail Foundry. Vous devez décider quels éléments ajouter en tant que connaissances, c'est-à-dire en tant que contenu que l'agent récupère pour ancrer ses réponses.

    Quels sont les deux éléments qui sont des sources de connaissances ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Internal PDF documents that describe the company's products", fr: "Des documents PDF internes qui décrivent les produits de l'entreprise" } }
    - { id: b, text: { en: "A custom function that creates a support ticket", fr: "Une fonction personnalisée qui crée un ticket de support" } }
    - { id: c, text: { en: "Content stored on the company's SharePoint site", fr: "Du contenu stocké sur le site SharePoint de l'entreprise" } }
    - { id: d, text: { en: "A code interpreter that runs Python code", fr: "Un interpréteur de code qui exécute du code Python" } }
    - { id: e, text: { en: "A rule that sets the tone of the answers", fr: "Une règle qui fixe le ton des réponses" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Knowledge is context: documents or datasets, such as internal PDF files, SharePoint content or files in Azure Storage, that Foundry indexes and retrieves to ground the answers of the agent.
    fr: |
      Les connaissances sont du contexte : des documents ou des jeux de données, comme des fichiers PDF internes, du contenu SharePoint ou des fichiers du Stockage Azure, que Foundry indexe et récupère pour ancrer les réponses de l'agent.
  options:
    b:
      en: "A custom function is a tool: it lets the agent perform an action in an external system."
      fr: "Une fonction personnalisée est un outil : elle permet à l'agent d'effectuer une action dans un système externe."
    d:
      en: "A code interpreter is a tool: it performs an action, running code, instead of providing content."
      fr: "Un interpréteur de code est un outil : il effectue une action, l'exécution de code, au lieu de fournir du contenu."
    e:
      en: "A rule about tone belongs in the instructions, the system prompt of the agent."
      fr: "Une règle sur le ton a sa place dans les instructions, l'invite système de l'agent."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
