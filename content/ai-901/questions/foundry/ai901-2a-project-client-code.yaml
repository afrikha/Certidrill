id: ai901-2a-project-client-code
objective: "2.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You write a Python chat client with the Foundry SDK. The client must connect to a Foundry project and authenticate with Microsoft Entra ID.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un client de conversation Python avec le SDK Foundry. Le client doit se connecter à un projet Foundry et s'authentifier avec Microsoft Entra ID.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    project = [[cls]](
        endpoint=PROJECT_ENDPOINT,
        credential=[[cred]](),
    )
    openai_client = project.get_openai_client()
  slots:
    - id: cls
      options:
        - { id: oai, text: "OpenAI" }
        - { id: apc, text: "AIProjectClient" }
        - { id: pad, text: "PromptAgentDefinition" }
    - id: cred
      options:
        - { id: dac, text: "DefaultAzureCredential" }
        - { id: btp, text: "get_bearer_token_provider" }
        - { id: apc, text: "AIProjectClient" }
answer:
  values: { cls: apc, cred: dac }
explanation:
  correct:
    en: |
      `AIProjectClient` is the project client of the Foundry SDK: it takes the project endpoint and a credential. `DefaultAzureCredential()` supplies a Microsoft Entra ID credential, for example the identity signed in by `az login`.
    fr: |
      `AIProjectClient` est le client de projet du SDK Foundry : il reçoit le point de terminaison du projet et des informations d'identification. `DefaultAzureCredential()` fournit des informations d'identification Microsoft Entra ID, par exemple l'identité connectée par `az login`.
  options:
    oai:
      en: "`OpenAI` is the client of the `openai` package; it is created with `base_url` and `api_key`, and it has no `get_openai_client` method."
      fr: "`OpenAI` est le client du package `openai` ; il se crée avec `base_url` et `api_key`, et il n'a pas de méthode `get_openai_client`."
    pad:
      en: "`PromptAgentDefinition` describes an agent (model and instructions). It isn't a client."
      fr: "`PromptAgentDefinition` décrit un agent (modèle et instructions). Ce n'est pas un client."
    btp:
      en: "`get_bearer_token_provider` builds a token provider from a credential and a scope. It isn't a credential class that you instantiate without arguments."
      fr: "`get_bearer_token_provider` construit un fournisseur de jetons à partir d'informations d'identification et d'une étendue. Ce n'est pas une classe d'informations d'identification que l'on instancie sans argument."
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
