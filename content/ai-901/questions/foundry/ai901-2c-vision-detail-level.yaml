id: ai901-2c-vision-detail-level
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application sends scanned forms to a vision-enabled model deployed in Microsoft Foundry. Each image input is sent with `"detail": "low"`. The model answers quickly, but it often misreads small printed text.

    You need to improve how the model reads the small text.

    What should you do?
  fr: |
    Une application envoie des formulaires numérisés à un modèle compatible avec la vision déployé dans Microsoft Foundry. Chaque image en entrée est envoyée avec `"detail": "low"`. Le modèle répond vite, mais il lit souvent mal le petit texte imprimé.

    Vous devez améliorer la lecture du petit texte par le modèle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Send each image as base64-encoded data instead of as a URL."
        fr: "Envoyer chaque image sous forme de données encodées en base64 plutôt que sous forme d'URL."
    - id: b
      text:
        en: "Set `detail` to `high` on the image inputs."
        fr: "Définir `detail` sur `high` pour les images en entrée."
    - id: c
      text:
        en: "Add a second copy of each image to the same request."
        fr: "Ajouter une seconde copie de chaque image à la même requête."
    - id: d
      text:
        en: "Deploy an image-generation model for the scanned forms."
        fr: "Déployer un modèle de génération d'images pour les formulaires numérisés."
answer:
  optionId: b
explanation:
  correct:
    en: |
      The `detail` setting of an image input controls how the model processes the image. With `low`, the model works from a low-resolution version: responses are faster and use fewer tokens, but small objects and text can be missed. With `high`, the model also examines detailed segments of the image, which improves the reading of fine print.
    fr: |
      Le paramètre `detail` d'une image en entrée détermine la façon dont le modèle traite l'image. Avec `low`, le modèle travaille sur une version en basse résolution : les réponses sont plus rapides et consomment moins de jetons, mais les petits objets et le petit texte peuvent lui échapper. Avec `high`, le modèle examine aussi des segments détaillés de l'image, ce qui améliore la lecture des petits caractères.
  options:
    a:
      en: "The way the image is transported, URL or base64, doesn't change the level of detail that the model uses."
      fr: "Le mode de transport de l'image, URL ou base64, ne change pas le niveau de détail qu'utilise le modèle."
    c:
      en: "A duplicate image is processed with the same low level of detail and adds nothing."
      fr: "Une image en double est traitée avec le même niveau de détail faible et n'apporte rien."
    d:
      en: "An image-generation model creates images; it doesn't read the text of a scanned form."
      fr: "Un modèle de génération d'images crée des images ; il ne lit pas le texte d'un formulaire numérisé."
references:
  - title: "Use vision-enabled chat models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision
  - title: "Use the Azure OpenAI Responses API"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/responses
