id: ai901-2a-deployment-facts-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "Deploying a model makes it available to applications through an endpoint.", fr: "Le déploiement d'un modèle le rend accessible aux applications par un point de terminaison." } }
    - { id: s2, text: { en: "Deploying a model that is sold directly by Azure, such as an Azure OpenAI model, requires an Azure Marketplace subscription.", fr: "Le déploiement d'un modèle vendu directement par Azure, comme un modèle Azure OpenAI, exige un abonnement à la Place de marché Azure." } }
    - { id: s3, text: { en: "After a model is deployed, the usage, the latency and the errors of the deployment are tracked.", fr: "Une fois un modèle déployé, l'utilisation, la latence et les erreurs du déploiement sont suivies." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Deploying a model makes it available through a stable and secure endpoint that applications call through an API. Only the models from partners and the community require an Azure Marketplace subscription before deployment; the models sold directly by Azure don't. Once the model is deployed, monitoring and logging track usage, performance, latency, errors and costs.
    fr: |
      Le déploiement d'un modèle le rend accessible par un point de terminaison stable et sécurisé que les applications appellent via une API. Seuls les modèles des partenaires et de la communauté exigent un abonnement à la Place de marché Azure avant le déploiement ; pas les modèles vendus directement par Azure. Une fois le modèle déployé, la surveillance et la journalisation suivent l'utilisation, les performances, la latence, les erreurs et les coûts.
references:
  - title: "Generative AI models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
  - title: "Deploy Microsoft Foundry Models in the Foundry portal"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/deploy-foundry-models
