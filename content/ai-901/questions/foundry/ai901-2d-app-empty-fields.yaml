id: ai901-2d-app-empty-fields
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python application submits supplier invoices to Azure Content Understanding in Foundry Tools with the following code.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-layout",
        inputs=[{"url": file_url}],
    )
    result = poller.result()
    content = result.contents[0]
    ```

    For each invoice, `content.markdown` contains the text and the tables, but `content.fields` contains no invoice value.

    What is the cause?
  fr: |
    Une application Python envoie des factures fournisseurs à Azure Content Understanding dans Foundry Tools avec le code suivant.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-layout",
        inputs=[{"url": file_url}],
    )
    result = poller.result()
    content = result.contents[0]
    ```

    Pour chaque facture, `content.markdown` contient le texte et les tableaux, mais `content.fields` ne contient aucune valeur de facture.

    Quelle en est la cause ?
body:
  options:
  - id: a
    text:
      en: The analysis isn't finished when `poller.result()` returns.
      fr: L'analyse n'est pas terminée lorsque `poller.result()` rend la main.
  - id: b
    text:
      en: Fields are returned only for files in an image format.
      fr: Les champs sont renvoyés uniquement pour les fichiers dans un format d'image.
  - id: c
    text:
      en: The key of the resource doesn't allow the application to read fields.
      fr: La clé de la ressource n'autorise pas l'application à lire les champs.
  - id: d
    text:
      en: The layout analyzer returns the content and its structure, not named fields.
      fr: L'analyseur layout renvoie le contenu et sa structure, pas des champs nommés.
answer:
  optionId: d
explanation:
  correct:
    en: '`prebuilt-layout` performs content extraction only: text, tables and sections, returned as Markdown. Named values require an analyzer that has a schema, such as `prebuilt-invoice` for invoices.'
    fr: '`prebuilt-layout` effectue uniquement l''extraction de contenu : texte, tableaux et sections, renvoyés en Markdown. Les valeurs nommées exigent un analyseur doté d''un schéma, comme `prebuilt-invoice` pour les factures.'
  options:
    a:
      en: '`poller.result()` returns only when the analysis is finished; the Markdown is complete, which confirms it.'
      fr: '`poller.result()` ne rend la main que lorsque l''analyse est terminée ; le Markdown est complet, ce qui le confirme.'
    b:
      en: 'Fields don''t depend on the file format: `prebuilt-invoice` returns them for PDF files.'
      fr: 'Les champs ne dépendent pas du format de fichier : `prebuilt-invoice` les renvoie pour des fichiers PDF.'
    c:
      en: A key gives access to the whole result; there is no separate permission for fields.
      fr: Une clé donne accès à l'ensemble du résultat ; il n'existe pas d'autorisation distincte pour les champs.
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
