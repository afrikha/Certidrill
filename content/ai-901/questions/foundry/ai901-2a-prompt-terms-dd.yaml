id: ai901-2a-prompt-terms-dd
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The input that you give to a generative AI model is called [[input]]. The model responds with [[output]]. In a chat application, it is usually the application that supplies [[sys]], which determines the constraints and the style of the responses.
    fr: |
      L'entrée que vous donnez à un modèle d'IA générative s'appelle [[input]]. Le modèle répond par [[output]]. Dans une application de conversation, c'est généralement l'application qui fournit [[sys]], qui détermine les contraintes et le style des réponses.
  slots:
    - id: input
      options:
        - { id: tok, text: { en: "a token", fr: "un jeton" } }
        - { id: prm, text: { en: "a prompt", fr: "une invite" } }
        - { id: dep, text: { en: "a deployment", fr: "un déploiement" } }
    - id: output
      options:
        - { id: cmp, text: { en: "a completion", fr: "une complétion" } }
        - { id: par, text: { en: "a parameter", fr: "un paramètre" } }
        - { id: cat, text: { en: "a catalog", fr: "un catalogue" } }
    - id: sys
      options:
        - { id: usr, text: { en: "the user prompt", fr: "l'invite utilisateur" } }
        - { id: his, text: { en: "the conversation history", fr: "l'historique de la conversation" } }
        - { id: sys, text: { en: "the system prompt", fr: "l'invite système" } }
answer:
  values: { input: prm, output: cmp, sys: sys }
explanation:
  correct:
    en: |
      A prompt is the input given to a model, and the model responds to it with a completion. The system prompt, which sets the behavior, the tone and the constraints of the responses, is usually set by the application, whereas user prompts come from the user.
    fr: |
      Une invite est l'entrée donnée à un modèle, et le modèle y répond par une complétion. L'invite système, qui fixe le comportement, le ton et les contraintes des réponses, est généralement définie par l'application, tandis que les invites utilisateur viennent de l'utilisateur.
  options:
    tok:
      en: "A token is the smallest unit of text that a model processes, not the whole input."
      fr: "Un jeton est la plus petite unité de texte qu'un modèle traite, pas l'entrée entière."
    par:
      en: "A parameter such as the temperature configures the model; it is not what the model returns."
      fr: "Un paramètre comme la température configure le modèle ; ce n'est pas ce que le modèle renvoie."
    usr:
      en: "The user prompt carries one request and usually comes from the user."
      fr: "L'invite utilisateur porte une demande et vient généralement de l'utilisateur."
    his:
      en: "The conversation history gives context to a follow-up question; it doesn't set the constraints of the responses."
      fr: "L'historique de la conversation donne du contexte à une question de suivi ; il ne fixe pas les contraintes des réponses."
references:
  - title: "Prompts"
    url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/6-writing-prompts
