id: ai901-2b-client-no-system-message
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A client application calls an agent named **hr-agent** with the following code.

    ```python
    agent = project_client.agents.get(agent_name="hr-agent")
    openai_client = project_client.get_openai_client()

    response = openai_client.responses.create(
        input=[{"role": "user", "content": "How many vacation days do I have?"}],
        extra_body={"agent": {"name": agent.name, "type": "agent_reference"}},
    )
    print(response.output_text)
    ```

    The answers follow the role and the rules that were defined for hr-agent in the Foundry portal, although the code contains no system prompt.

    What explains this behavior?
  fr: |
    Une application cliente appelle un agent nommé **hr-agent** avec le code suivant.

    ```python
    agent = project_client.agents.get(agent_name="hr-agent")
    openai_client = project_client.get_openai_client()

    response = openai_client.responses.create(
        input=[{"role": "user", "content": "How many vacation days do I have?"}],
        extra_body={"agent": {"name": agent.name, "type": "agent_reference"}},
    )
    print(response.output_text)
    ```

    Les réponses respectent le rôle et les règles définis pour hr-agent dans le portail Foundry, alors que le code ne contient aucune invite système.

    Qu'est-ce qui explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "The instructions are added to the request by the credential at sign-in.", fr: "Les instructions sont ajoutées à la requête par les informations d'identification à la connexion." } }
    - { id: b, text: { en: "The instructions are part of the project endpoint URL.", fr: "Les instructions font partie de l'URL du point de terminaison du projet." } }
    - { id: c, text: { en: "The instructions are stored in the agent that the request references.", fr: "Les instructions sont stockées dans l'agent que la requête référence." } }
    - { id: d, text: { en: "The instructions are sent in the content of the user message.", fr: "Les instructions sont envoyées dans le contenu du message utilisateur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An agent keeps its model, its instructions and its tools together. A client that references the agent doesn't repeat the system prompt: the agent applies its own instructions to every request it receives.
    fr: |
      Un agent conserve ensemble son modèle, ses instructions et ses outils. Un client qui référence l'agent ne répète pas l'invite système : l'agent applique ses propres instructions à chaque requête qu'il reçoit.
  options:
    a:
      en: "The credential only proves the identity of the application to Microsoft Entra ID; it carries no instructions."
      fr: "Les informations d'identification prouvent seulement l'identité de l'application auprès de Microsoft Entra ID ; elles ne portent aucune instruction."
    b:
      en: "The endpoint identifies the Foundry resource and the project, nothing else."
      fr: "Le point de terminaison identifie la ressource Foundry et le projet, rien d'autre."
    d:
      en: "The user message of this code contains only the question of the user."
      fr: "Le message utilisateur de ce code ne contient que la question de l'utilisateur."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
