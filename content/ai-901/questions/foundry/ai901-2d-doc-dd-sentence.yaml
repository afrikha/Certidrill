id: ai901-2d-doc-dd-sentence
objective: "2.4.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: In Azure Content Understanding in Foundry Tools, [[what]] lists the fields to extract from a document. [[who]] applies it to each document that is submitted and returns [[out]].
    fr: Dans Azure Content Understanding dans Foundry Tools, [[what]] répertorie les champs à extraire d'un document. [[who]] l'applique à chaque document envoyé et renvoie [[out]].
  slots:
  - id: what
    options:
    - id: dep
      text:
        en: a deployment
        fr: un déploiement
    - id: sch
      text:
        en: a schema
        fr: un schéma
    - id: pol
      text:
        en: a poller
        fr: un poller
  - id: who
    options:
    - id: ana
      text:
        en: An analyzer
        fr: Un analyseur
    - id: play
      text:
        en: A playground
        fr: Un terrain de jeu
    - id: key
      text:
        en: A key
        fr: Une clé
  - id: out
    options:
    - id: img
      text:
        en: a scanned image
        fr: une image numérisée
    - id: wav
      text:
        en: an audio file
        fr: un fichier audio
    - id: json
      text:
        en: structured JSON
        fr: du JSON structuré
answer:
  values:
    what: sch
    who: ana
    out: json
explanation:
  correct:
    en: A schema describes the fields to extract and their structure. An analyzer applies the schema consistently to the content that it receives and returns structured JSON that an application can store, search or pass to another system.
    fr: Un schéma décrit les champs à extraire et leur structure. Un analyseur applique le schéma de façon cohérente au contenu qu'il reçoit et renvoie du JSON structuré qu'une application peut stocker, interroger ou transmettre à un autre système.
  options:
    dep:
      en: A deployment makes a model available; it doesn't describe fields.
      fr: Un déploiement met un modèle à disposition ; il ne décrit pas de champs.
    pol:
      en: A poller is the object that an SDK returns to wait for the end of an analysis.
      fr: Un poller est l'objet qu'un SDK renvoie pour attendre la fin d'une analyse.
    play:
      en: A playground is the place in the portal where you test an analyzer; the analyzer does the work.
      fr: Un terrain de jeu est l'endroit du portail où vous testez un analyseur ; c'est l'analyseur qui fait le travail.
references:
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
