id: ai901-2c-vision-playground-inputs-yn
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    In the model playground of the Foundry portal, you select a deployment of GPT-4.1-mini and enter the following instructions: `You help people identify vintage computer hardware.`

    You then upload a photo and enter the prompt `What can you tell me about this?`

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans le terrain de jeu de modèles du portail Foundry, vous sélectionnez un déploiement de GPT-4.1-mini et saisissez les instructions suivantes : `You help people identify vintage computer hardware.`

    Vous chargez ensuite une photo et saisissez l'invite `What can you tell me about this?`

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The model produces its answer from the instructions, the prompt and the photo together."
        fr: "Le modèle produit sa réponse à partir des instructions, de l'invite et de la photo réunies."
    - id: s2
      text:
        en: "A second deployment is required to convert the photo to text before the model answers."
        fr: "Un second déploiement est nécessaire pour convertir la photo en texte avant que le modèle réponde."
    - id: s3
      text:
        en: "The model returns its answer as an edited copy of the photo."
        fr: "Le modèle renvoie sa réponse sous forme de copie modifiée de la photo."
answer:
  values:
    s1: true
    s2: false
    s3: false
explanation:
  correct:
    en: |
      GPT-4.1-mini is a vision-enabled model: it processes the instructions, the text of the prompt and the uploaded image in the same request, with no intermediate model. Its answer is text in natural language; producing or editing images is the job of an image-generation model.
    fr: |
      GPT-4.1-mini est un modèle compatible avec la vision : il traite les instructions, le texte de l'invite et l'image chargée dans la même requête, sans modèle intermédiaire. Sa réponse est du texte en langage naturel ; produire ou modifier des images est le rôle d'un modèle de génération d'images.
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Exercise - Get started with computer vision in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/5-exercise
