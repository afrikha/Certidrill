id: ai901-2b-client-yn-lightweight
objective: "2.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You plan a lightweight client application, a single Python file, for an agent that is saved in a Foundry project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez une application cliente légère, un seul fichier Python, pour un agent enregistré dans un projet Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The client collects the input of the user and displays the response of the agent.
        fr: Le client recueille la saisie de l'utilisateur et affiche la réponse de l'agent.
    - id: s2
      text:
        en: The compute stays on the service side, which keeps the code of the client small.
        fr: Le calcul reste côté service, ce qui limite la taille du code du client.
    - id: s3
      text:
        en: The model of the agent runs on the computer that runs the client.
        fr: Le modèle de l'agent s'exécute sur l'ordinateur qui exécute le client.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A lightweight client collects user input, calls a remote API and displays the result. The model, the tools and the knowledge of the agent run in Foundry; state and compute stay on the server, so the client has a small code footprint.
    fr: |
      Un client léger recueille la saisie de l'utilisateur, appelle une API distante et affiche le résultat. Le modèle, les outils et les connaissances de l'agent s'exécutent dans Foundry ; l'état et le calcul restent sur le serveur, de sorte que le client contient peu de code.
references:
  - title: Using a generative AI model
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
