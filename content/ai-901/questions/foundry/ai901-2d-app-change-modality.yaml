id: ai901-2d-app-change-modality
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python application analyzes invoices by using Azure Content Understanding in Foundry Tools with the following code.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-invoice",
        inputs=[{"url": file_url}],
    )
    result = poller.result()

    for content in result.contents:
        print(content.markdown)
        print(content.fields)
    ```

    The application must now analyze recorded voicemails (WAV files) to obtain a transcript and a summary of each message. The solution must minimize the changes to the code.

    What should you do?
  fr: |
    Une application Python analyse des factures à l'aide d'Azure Content Understanding dans Foundry Tools avec le code suivant.

    ```python
    poller = client.begin_analyze(
        analyzer_id="prebuilt-invoice",
        inputs=[{"url": file_url}],
    )
    result = poller.result()

    for content in result.contents:
        print(content.markdown)
        print(content.fields)
    ```

    L'application doit désormais analyser des messages vocaux enregistrés (fichiers WAV) pour obtenir une transcription et un résumé de chaque message. La solution doit réduire au minimum les modifications du code.

    Que devez-vous faire ?
body:
  options:
  - id: a
    text:
      en: Set `analyzer_id` to `prebuilt-audioSearch` and `file_url` to the URL of a recording.
      fr: Définir `analyzer_id` sur `prebuilt-audioSearch` et `file_url` sur l'URL d'un enregistrement.
  - id: b
    text:
      en: Keep `prebuilt-invoice` and set `file_url` to the URL of a recording.
      fr: Conserver `prebuilt-invoice` et définir `file_url` sur l'URL d'un enregistrement.
  - id: c
    text:
      en: Create a second Foundry resource that is dedicated to audio files.
      fr: Créer une seconde ressource Foundry dédiée aux fichiers audio.
  - id: d
    text:
      en: Replace the client with a speech recognizer of the Azure Speech SDK.
      fr: Remplacer le client par un module de reconnaissance vocale du SDK Azure Speech.
answer:
  optionId: a
explanation:
  correct:
    en: 'The same client and the same calls handle every type of content. To analyze a recording, only the analyzer and the file change: `prebuilt-audioSearch` returns the transcript in `content.markdown` and a summary in `content.fields`.'
    fr: 'Le même client et les mêmes appels traitent tous les types de contenu. Pour analyser un enregistrement, seuls l''analyseur et le fichier changent : `prebuilt-audioSearch` renvoie la transcription dans `content.markdown` et un résumé dans `content.fields`.'
  options:
    b:
      en: '`prebuilt-invoice` is a document analyzer: it can''t process an audio file.'
      fr: '`prebuilt-invoice` est un analyseur de documents : il ne peut pas traiter un fichier audio.'
    c:
      en: One Foundry resource serves documents, images, audio and video; a second resource isn't needed.
      fr: Une seule ressource Foundry sert les documents, les images, l'audio et la vidéo ; une seconde ressource est inutile.
    d:
      en: A speech recognizer returns a transcript without a summary, and it requires rewriting the code.
      fr: Un module de reconnaissance vocale renvoie une transcription sans résumé, et il impose de réécrire le code.
