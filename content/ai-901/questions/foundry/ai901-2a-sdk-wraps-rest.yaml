id: ai901-2a-sdk-wraps-rest
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The models deployed in Microsoft Foundry are exposed through REST interfaces at an endpoint.

    What does an SDK such as the Foundry SDK provide to the developer of a chat client?
  fr: |
    Les modèles déployés dans Microsoft Foundry sont exposés par des interfaces REST à un point de terminaison.

    Qu'apporte un SDK comme le SDK Foundry au développeur d'un client de conversation ?
body:
  options:
    - { id: a, text: { en: "A web interface for testing prompts without writing code", fr: "Une interface web pour tester des invites sans écrire de code" } }
    - { id: b, text: { en: "A catalog for comparing the benchmarks of the available models", fr: "Un catalogue pour comparer les benchmarks des modèles disponibles" } }
    - { id: c, text: { en: "A copy of the model that runs on the developer's computer", fr: "Une copie du modèle qui s'exécute sur l'ordinateur du développeur" } }
    - { id: d, text: { en: "Code libraries that wrap the REST interfaces for a language such as Python", fr: "Des bibliothèques de code qui encapsulent les interfaces REST pour un langage comme Python" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Applications communicate with an endpoint by sending REST requests with headers and a JSON body. Most developers use an SDK instead: it wraps the REST interfaces in code libraries for languages such as Python, JavaScript or C#.
    fr: |
      Les applications communiquent avec un point de terminaison en envoyant des requêtes REST composées d'en-têtes et d'un corps JSON. La plupart des développeurs utilisent plutôt un SDK : il encapsule les interfaces REST dans des bibliothèques de code pour des langages comme Python, JavaScript ou C#.
  options:
    a:
      en: "That describes the playgrounds of the Foundry portal."
      fr: "Cela décrit les terrains de jeu du portail Foundry."
    b:
      en: "That describes the model catalog and its leaderboards."
      fr: "Cela décrit le catalogue de modèles et ses classements."
    c:
      en: "The model stays in Foundry. An SDK only helps the client call it."
      fr: "Le modèle reste dans Foundry. Un SDK aide seulement le client à l'appeler."
references:
  - title: "Using Microsoft Foundry endpoints"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/5-endpoints
