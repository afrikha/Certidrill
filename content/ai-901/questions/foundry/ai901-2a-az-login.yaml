id: ai901-2a-az-login
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You run a Python chat client on your computer. The client creates an `AIProjectClient` object with `DefaultAzureCredential()`.

    The script fails with the error `DefaultAzureCredential failed to retrieve a token`.

    What should you do first?
  fr: |
    Vous exécutez un client de conversation Python sur votre ordinateur. Le client crée un objet `AIProjectClient` avec `DefaultAzureCredential()`.

    Le script échoue avec l'erreur `DefaultAzureCredential failed to retrieve a token`.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Replace the deployment name in the `model` argument with the name of the model.", fr: "Remplacer le nom du déploiement dans l'argument `model` par le nom du modèle." } }
    - { id: b, text: { en: "Increase the value of the `max_output_tokens` argument of the request.", fr: "Augmenter la valeur de l'argument `max_output_tokens` de la requête." } }
    - { id: c, text: { en: "Run `az login` to sign in with an identity that has access to the project.", fr: "Exécuter `az login` pour vous connecter avec une identité qui a accès au projet." } }
    - { id: d, text: { en: "Deploy the model a second time under a different deployment name.", fr: "Déployer le modèle une seconde fois sous un autre nom de déploiement." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `DefaultAzureCredential` authenticates with Microsoft Entra ID. On a development computer, it relies on the sign-in of the Azure CLI, so you run `az login` before the script, with an identity that holds the required Foundry role.
    fr: |
      `DefaultAzureCredential` authentifie avec Microsoft Entra ID. Sur un poste de développement, il s'appuie sur la connexion d'Azure CLI : vous exécutez donc `az login` avant le script, avec une identité qui détient le rôle Foundry requis.
  options:
    a:
      en: "The error occurs when the credential is obtained, before any request names a deployment."
      fr: "L'erreur survient à l'obtention des informations d'identification, avant qu'une requête ne nomme un déploiement."
    b:
      en: "`max_output_tokens` limits the length of a response. It has no effect on authentication."
      fr: "`max_output_tokens` limite la longueur d'une réponse. Il n'a aucun effet sur l'authentification."
    d:
      en: "The deployment isn't the cause: no token could be retrieved for the caller."
      fr: "Le déploiement n'est pas en cause : aucun jeton n'a pu être obtenu pour l'appelant."
references:
  - title: "Microsoft Foundry SDKs and endpoints"
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
