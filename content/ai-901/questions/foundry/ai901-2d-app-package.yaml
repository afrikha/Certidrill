id: ai901-2d-app-package
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You develop a Python application that analyzes invoices by using Azure Content Understanding in Foundry Tools.

    Which package should you install?
  fr: |
    Vous développez une application Python qui analyse des factures à l'aide d'Azure Content Understanding dans Foundry Tools.

    Quel package devez-vous installer ?
body:
  options:
  - id: a
    text: '`azure-ai-projects`'
  - id: b
    text: '`azure-ai-textanalytics`'
  - id: c
    text: '`azure-ai-contentunderstanding`'
  - id: d
    text: '`azure-cognitiveservices-speech`'
answer:
  optionId: c
explanation:
  correct:
    en: The Python SDK of Content Understanding is the `azure-ai-contentunderstanding` package, installed with `pip`. It provides the `ContentUnderstandingClient` class that submits content to an analyzer.
    fr: Le SDK Python de Content Understanding est le package `azure-ai-contentunderstanding`, installé avec `pip`. Il fournit la classe `ContentUnderstandingClient` qui envoie du contenu à un analyseur.
  options:
    a:
      en: '`azure-ai-projects` is the Foundry SDK package used to work with a Foundry project, its models and its agents.'
      fr: '`azure-ai-projects` est le package du SDK Foundry utilisé pour travailler avec un projet Foundry, ses modèles et ses agents.'
    b:
      en: '`azure-ai-textanalytics` is the client library for text analysis, such as sentiment and entities.'
      fr: '`azure-ai-textanalytics` est la bibliothèque cliente d''analyse de texte, par exemple pour le sentiment et les entités.'
    d:
      en: '`azure-cognitiveservices-speech` is the Azure Speech SDK, for speech recognition and synthesis.'
      fr: '`azure-cognitiveservices-speech` est le SDK Azure Speech, pour la reconnaissance et la synthèse vocales.'
references:
- title: Azure AI Content Understanding client library for Python
  url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
- title: Extract information from documents
  url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
