id: ai901-2c-visionapp-generation-code-yn
objective: "2.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You review the following Python code. The `key` and `endpoint` variables contain the key and the endpoint of a Foundry resource.

    ```python
    import base64
    from openai import OpenAI

    client = OpenAI(api_key=key, base_url=endpoint)

    result = client.images.generate(
        model="poster-images",
        prompt="A poster of a mountain lake at sunrise, flat illustration",
        n=1,
        size="1024x1024",
    )

    with open("poster.png", "wb") as f:
        f.write(base64.b64decode(result.data[0].b64_json))
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code Python suivant. Les variables `key` et `endpoint` contiennent la clé et le point de terminaison d'une ressource Foundry.

    ```python
    import base64
    from openai import OpenAI

    client = OpenAI(api_key=key, base_url=endpoint)

    result = client.images.generate(
        model="poster-images",
        prompt="A poster of a mountain lake at sunrise, flat illustration",
        n=1,
        size="1024x1024",
    )

    with open("poster.png", "wb") as f:
        f.write(base64.b64decode(result.data[0].b64_json))
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The model returns the URL of a PNG file, which the code then downloads."
        fr: "Le modèle renvoie l'URL d'un fichier PNG, que le code télécharge ensuite."
    - id: s2
      text:
        en: "The code saves one generated image to a file named `poster.png`."
        fr: "Le code enregistre une image générée dans un fichier nommé `poster.png`."
    - id: s3
      text:
        en: "`poster-images` must be the name of the deployment of an image-generation model."
        fr: "`poster-images` doit être le nom du déploiement d'un modèle de génération d'images."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: |
      `images.generate()` is called on the deployment named in `model`, which must be an image-generation model. With `n=1`, one image is returned, as base64 text in `data[0].b64_json` and not as a URL. The code decodes this text and writes the bytes to `poster.png`.
    fr: |
      `images.generate()` est appelé sur le déploiement nommé dans `model`, qui doit être un modèle de génération d'images. Avec `n=1`, une seule image est renvoyée, sous forme de texte base64 dans `data[0].b64_json` et non sous forme d'URL. Le code décode ce texte et écrit les octets dans `poster.png`.
references:
  - title: "Azure OpenAI image generation models"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e
  - title: "Exercise - Get started with computer vision in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/5-exercise
