id: ai901-2a-resource-project-dd
objective: "2.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    To complete the sentences, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      [[a]] is created in an Azure subscription and provides access to models, quotas, security boundaries and monitoring. [[b]] is a workspace in which you build AI applications and agents and manage their files and connections.
    fr: |
      [[a]] se crée dans un abonnement Azure et donne accès aux modèles, aux quotas, aux limites de sécurité et à la surveillance. [[b]] est un espace de travail dans lequel vous créez des applications et des agents d'IA et gérez leurs fichiers et leurs connexions.
  slots:
    - id: a
      options:
        - { id: prj, text: { en: "A Foundry project", fr: "Un projet Foundry" } }
        - { id: res, text: { en: "A Foundry resource", fr: "Une ressource Foundry" } }
        - { id: dep, text: { en: "A model deployment", fr: "Un déploiement de modèle" } }
    - id: b
      options:
        - { id: res, text: { en: "A Foundry resource", fr: "Une ressource Foundry" } }
        - { id: plg, text: { en: "A model playground", fr: "Un terrain de jeu de modèles" } }
        - { id: prj, text: { en: "A Foundry project", fr: "Un projet Foundry" } }
answer:
  values: { a: res, b: prj }
explanation:
  correct:
    en: |
      A Foundry resource is the Azure resource that provides the platform capabilities: access to models, deployment governance, monitoring, security boundaries and quotas. A Foundry project is a workspace inside a resource, in which you build and manage agents, evaluations, files, connections and project settings.
    fr: |
      Une ressource Foundry est la ressource Azure qui fournit les capacités de la plateforme : accès aux modèles, gouvernance des déploiements, surveillance, limites de sécurité et quotas. Un projet Foundry est un espace de travail à l'intérieur d'une ressource, dans lequel vous créez et gérez des agents, des évaluations, des fichiers, des connexions et les paramètres du projet.
  options:
    dep:
      en: "A model deployment makes one model available through an endpoint; it lives in a Foundry resource."
      fr: "Un déploiement de modèle rend un modèle accessible par un point de terminaison ; il se trouve dans une ressource Foundry."
    plg:
      en: "A model playground is a chat environment of the portal for testing a deployed model."
      fr: "Un terrain de jeu de modèles est un environnement de conversation du portail pour tester un modèle déployé."
references:
  - title: "Microsoft Foundry for AI"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-ai-in-azure/4-microsoft-foundry
