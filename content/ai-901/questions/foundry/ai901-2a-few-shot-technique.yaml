id: ai901-2a-few-shot-technique
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You want a model to classify support tickets as *Billing*, *Shipping* or *Technical*, and to word its answers as your team does.

    In the prompt, before the ticket to classify, you add three sample tickets, each followed by the expected answer.

    Which prompt engineering technique are you using?
  fr: |
    Vous voulez qu'un modèle classe des tickets de support dans les catégories *Facturation*, *Livraison* ou *Technique*, et qu'il formule ses réponses comme le fait votre équipe.

    Dans l'invite, avant le ticket à classer, vous ajoutez trois exemples de tickets, chacun suivi de la réponse attendue.

    Quelle technique d'ingénierie d'invite utilisez-vous ?
body:
  options:
    - { id: a, text: { en: "Zero-shot prompting", fr: "Une invite sans exemple (zero-shot)" } }
    - { id: b, text: { en: "Chain of thought prompting", fr: "Une invite en chaîne de pensée (chain of thought)" } }
    - { id: c, text: { en: "Few-shot learning", fr: "L'apprentissage en quelques exemples (few-shot)" } }
    - { id: d, text: { en: "Retrieval augmented generation (RAG)", fr: "La génération augmentée par récupération (RAG)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Few-shot learning provides a few examples of inputs with the expected outputs in the prompt, so that the model imitates their form and wording. The examples only condition the model for the current request.
    fr: |
      L'apprentissage en quelques exemples (few-shot) fournit dans l'invite quelques exemples d'entrées avec les sorties attendues, afin que le modèle en imite la forme et la formulation. Les exemples ne conditionnent le modèle que pour la requête en cours.
  options:
    a:
      en: "A zero-shot prompt contains no example at all."
      fr: "Une invite sans exemple (zero-shot) ne contient aucun exemple."
    b:
      en: "Chain of thought prompting asks the model to proceed step by step and to show its steps. It doesn't rely on sample answers."
      fr: "La chaîne de pensée demande au modèle de procéder étape par étape et de montrer ses étapes. Elle ne repose pas sur des exemples de réponses."
    d:
      en: "RAG retrieves information such as documents and adds it to the prompt to ground the answer. The sample tickets are examples of style, not retrieved data."
      fr: "La RAG récupère des informations, comme des documents, et les ajoute à l'invite pour ancrer la réponse. Les tickets d'exemple sont des exemples de style, pas des données récupérées."
references:
  - title: "Prompt engineering techniques"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
