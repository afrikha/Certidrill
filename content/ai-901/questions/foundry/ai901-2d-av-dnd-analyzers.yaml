id: ai901-2d-av-dnd-analyzers
objective: "2.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans three solutions that use Azure Content Understanding in Foundry Tools. The solutions must not require a custom schema.

    Which prebuilt analyzer should Wingtip use for each requirement? To answer, drag the appropriate analyzers to the correct requirements. Each analyzer may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit trois solutions qui utilisent Azure Content Understanding dans Foundry Tools. Les solutions ne doivent pas exiger de schéma personnalisé.

    Quel analyseur prédéfini Wingtip doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser les analyseurs appropriés vers les exigences correspondantes. Chaque analyseur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
  - id: as
    text: '`prebuilt-audioSearch`'
  - id: cc
    text: '`prebuilt-callCenter`'
  - id: is
    text: '`prebuilt-imageSearch`'
  - id: lay
    text: '`prebuilt-layout`'
  - id: vs
    text: '`prebuilt-videoSearch`'
  targets:
  - id: t1
    text:
      en: Transcribe podcast episodes and write a one-paragraph summary of each episode
      fr: Transcrire des épisodes de podcast et rédiger un résumé en un paragraphe de chaque épisode
  - id: t2
    text:
      en: Identify the agent and the customer in support calls and return the sentiment of each call
      fr: Identifier l'agent et le client dans des appels de support et renvoyer le sentiment de chaque appel
  - id: t3
    text:
      en: Divide recorded webinars into segments, each with a transcript and a description
      fr: Diviser des webinaires enregistrés en segments, chacun avec une transcription et une description
answer:
  mapping:
    t1: as
    t2: cc
    t3: vs
explanation:
  correct:
    en: '`prebuilt-audioSearch` transcribes a conversation and generates a one-paragraph summary. `prebuilt-callCenter` adds what a contact center needs: the agent and customer roles, the sentiment and the topics. `prebuilt-videoSearch` segments a video and returns a transcript and a description for each segment. The two other analyzers process images and documents.'
    fr: '`prebuilt-audioSearch` transcrit une conversation et génère un résumé en un paragraphe. `prebuilt-callCenter` ajoute ce dont un centre de contact a besoin : les rôles agent et client, le sentiment et les sujets. `prebuilt-videoSearch` segmente une vidéo et renvoie une transcription et une description pour chaque segment. Les deux autres analyseurs traitent des images et des documents.'
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
- title: Azure Content Understanding in Foundry Tools audio overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview
