id: ai901-2b-client-extra-body
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python client application contains the following code. `agent` refers to an agent that is saved in a Foundry project.

    ```python
    response = openai_client.responses.create(
        input=[{"role": "user", "content": "What can you help me with?"}],
        extra_body={"agent": {"name": agent.name, "type": "agent_reference"}},
    )
    ```

    What is the purpose of the `extra_body` argument?
  fr: |
    Une application cliente Python contient le code suivant. `agent` désigne un agent enregistré dans un projet Foundry.

    ```python
    response = openai_client.responses.create(
        input=[{"role": "user", "content": "What can you help me with?"}],
        extra_body={"agent": {"name": agent.name, "type": "agent_reference"}},
    )
    ```

    À quoi sert l'argument `extra_body` ?
body:
  options:
    - { id: a, text: { en: "It sets the system prompt of the request.", fr: "Il définit l'invite système de la requête." } }
    - { id: b, text: { en: "It identifies the agent that must process the request.", fr: "Il identifie l'agent qui doit traiter la requête." } }
    - { id: c, text: { en: "It attaches a knowledge file to the request.", fr: "Il joint un fichier de connaissances à la requête." } }
    - { id: d, text: { en: "It limits the length of the response.", fr: "Il limite la longueur de la réponse." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The agent reference in `extra_body` names the agent, with the type `agent_reference`. The request is then handled by that agent, with the model, the instructions and the tools that are saved in it.
    fr: |
      La référence d'agent placée dans `extra_body` nomme l'agent, avec le type `agent_reference`. La requête est alors traitée par cet agent, avec le modèle, les instructions et les outils qui y sont enregistrés.
  options:
    a:
      en: "The system prompt of an agent is its instructions, stored in the agent; the client doesn't send it."
      fr: "L'invite système d'un agent, ce sont ses instructions, stockées dans l'agent ; le client ne l'envoie pas."
    c:
      en: "Knowledge is configured in the agent in Foundry; nothing in this argument uploads a file."
      fr: "Les connaissances sont configurées dans l'agent dans Foundry ; rien dans cet argument ne charge de fichier."
    d:
      en: "The length of a response is limited by a parameter such as `max_output_tokens`, not by an agent reference."
      fr: "La longueur d'une réponse se limite avec un paramètre comme `max_output_tokens`, pas avec une référence d'agent."
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
