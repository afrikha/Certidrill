id: ai901-2c-imagegen-drafts-and-finals
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A design agency uses the GPT-Image-1 family in Microsoft Foundry for two workloads:

    - **Drafts**: thousands of quick internal mock-ups per day, where low cost and low latency matter more than maximum visual fidelity.
    - **Finals**: campaign visuals that require high fidelity and precise editing, with consistent results across iterations.

    Which models should the agency use?
  fr: |
    Une agence de design utilise la famille GPT-Image-1 dans Microsoft Foundry pour deux charges de travail :

    - **Brouillons** : des milliers de maquettes internes rapides par jour, pour lesquelles un coût et une latence faibles comptent plus que la fidélité visuelle maximale.
    - **Versions finales** : des visuels de campagne qui exigent une haute fidélité et une modification précise, avec des résultats cohérents d'une itération à l'autre.

    Quels modèles l'agence doit-elle utiliser ?
body:
  options:
    - id: a
      text:
        en: "GPT-Image-1.5 for the drafts and GPT-Image-1-Mini for the finals"
        fr: "GPT-Image-1.5 pour les brouillons et GPT-Image-1-Mini pour les versions finales"
    - id: b
      text:
        en: "GPT-Image-1-Mini for the drafts and GPT-Image-1.5 for the finals"
        fr: "GPT-Image-1-Mini pour les brouillons et GPT-Image-1.5 pour les versions finales"
    - id: c
      text:
        en: "GPT-Image-1-Mini for the drafts and Sora 1 for the finals"
        fr: "GPT-Image-1-Mini pour les brouillons et Sora 1 pour les versions finales"
    - id: d
      text:
        en: "GPT-4.1-mini for the drafts and GPT-Image-1.5 for the finals"
        fr: "GPT-4.1-mini pour les brouillons et GPT-Image-1.5 pour les versions finales"
answer:
  optionId: b
explanation:
  correct:
    en: |
      GPT-Image-1-Mini is the lighter, more cost-efficient member of the family, optimized for lower latency or cost rather than for maximum fidelity, which suits high-volume internal drafts. GPT-Image-1.5 targets high-fidelity creation and precise editing with better consistency across iterations, which suits branding and marketing visuals.
    fr: |
      GPT-Image-1-Mini est le membre le plus léger et le plus économique de la famille, optimisé pour une latence ou un coût réduits plutôt que pour la fidélité maximale, ce qui convient à des brouillons internes en grand volume. GPT-Image-1.5 vise la création haute fidélité et la modification précise, avec une meilleure cohérence d'une itération à l'autre, ce qui convient aux visuels de marque et de marketing.
  options:
    a:
      en: "This choice is reversed: it spends the most capable model on drafts and uses the lighter model where fidelity matters."
      fr: "Ce choix est inversé : il consacre le modèle le plus performant aux brouillons et utilise le modèle léger là où la fidélité compte."
    c:
      en: "Sora 1 generates video clips, not still campaign visuals."
      fr: "Sora 1 génère des clips vidéo, pas des visuels de campagne fixes."
    d:
      en: "GPT-4.1-mini is a chat model whose output is text; it doesn't generate mock-ups."
      fr: "GPT-4.1-mini est un modèle de conversation dont la sortie est du texte ; il ne génère pas de maquettes."
references:
  - title: "Image generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
