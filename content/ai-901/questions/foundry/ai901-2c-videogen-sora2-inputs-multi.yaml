id: ai901-2c-videogen-sora2-inputs-multi
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    In addition to a text prompt, which two types of input can Sora 2 use to generate a video?

    NOTE: Each correct selection is worth one point.
  fr: |
    En plus d'une invite en texte, quels sont les deux types d'entrée que Sora 2 peut utiliser pour générer une vidéo ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "An image"
        fr: "Une image"
    - id: b
      text:
        en: "An audio recording"
        fr: "Un enregistrement audio"
    - id: c
      text:
        en: "A PDF document"
        fr: "Un document PDF"
    - id: d
      text:
        en: "An existing video"
        fr: "Une vidéo existante"
    - id: e
      text:
        en: "A vector embedding"
        fr: "Un vecteur d'embedding"
answer:
  optionIds: [a, d]
explanation:
  correct:
    en: |
      Sora 2 supports three modes: text to video, image to video, and video to video, also called remix. An image can serve as the starting point of the clip, and an existing video can be modified with targeted changes.
    fr: |
      Sora 2 prend en charge trois modes : texte vers vidéo, image vers vidéo, et vidéo vers vidéo, aussi appelé remix. Une image peut servir de point de départ au clip, et une vidéo existante peut être modifiée par des changements ciblés.
  options:
    b:
      en: "Sora 2 can generate audio with the video, but an audio recording isn't one of its input modes."
      fr: "Sora 2 peut générer de l'audio avec la vidéo, mais un enregistrement audio ne fait pas partie de ses modes d'entrée."
    c:
      en: "A document isn't an input of video generation."
      fr: "Un document n'est pas une entrée de la génération de vidéos."
    e:
      en: "Embeddings are used to compare meanings, for example in search; they aren't an input of Sora 2."
      fr: "Les embeddings servent à comparer des sens, par exemple pour la recherche ; ce ne sont pas une entrée de Sora 2."
references:
  - title: "Video generation models"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/4-video-generation
  - title: "Video generation with Sora 2 (preview)"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation
