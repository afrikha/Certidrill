id: ai901-2b-client-dd-role-name
objective: "2.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    A Python client application retrieves an agent from a Foundry project and then forwards the question that the end user typed, stored in `question`, to the agent.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application cliente Python récupère un agent dans un projet Foundry, puis transmet à l'agent la question saisie par l'utilisateur final, stockée dans `question`.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    agent = project_client.agents.get(agent_name="support-agent")
    openai_client = project_client.get_openai_client()

    response = openai_client.responses.create(
        input=[{"role": "[[role]]", "content": question}],
        extra_body={"agent": {"name": [[name]], "type": "agent_reference"}},
    )
    print(response.output_text)
  slots:
    - id: role
      options:
        - { id: system, text: system }
        - { id: user, text: user }
        - { id: assistant, text: assistant }
    - id: name
      options:
        - { id: id, text: agent.id }
        - { id: version, text: agent.version }
        - { id: name, text: agent.name }
answer:
  values: { role: user, name: name }
explanation:
  correct:
    en: |
      What the end user types is a user prompt, so the message has the role `user`. The agent reference designates the agent by its name, which the code reads from `agent.name`.
    fr: |
      Ce que l'utilisateur final saisit est une invite utilisateur : le message porte donc le rôle `user`. La référence d'agent désigne l'agent par son nom, que le code lit dans `agent.name`.
  options:
    system: { en: "The system role carries instructions for the model; an agent already holds its instructions, and the question isn't one.", fr: "Le rôle system porte des instructions destinées au modèle ; un agent détient déjà ses instructions, et la question n'en est pas une." }
    assistant: { en: "The assistant role marks answers generated by the model in the history of a conversation.", fr: "Le rôle assistant marque les réponses générées par le modèle dans l'historique d'une conversation." }
    id: { en: "agent.id is the identifier of the agent object, but the `name` key of the reference expects the name.", fr: "agent.id est l'identifiant de l'objet agent, alors que la clé `name` de la référence attend le nom." }
    version: { en: "agent.version is the version number of the agent, not its name.", fr: "agent.version est le numéro de version de l'agent, pas son nom." }
references:
  - title: Creating an agent
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
