id: ai901-2d-av-nonspeech
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A nature channel analyzes its documentaries by using a video analyzer of Azure Content Understanding in Foundry Tools. The soundtrack of each documentary contains a narrator, music and animal sounds.

    What does the transcript in the result contain?
  fr: |
    Une chaîne consacrée à la nature analyse ses documentaires à l'aide d'un analyseur vidéo d'Azure Content Understanding dans Foundry Tools. La bande-son de chaque documentaire contient un narrateur, de la musique et des sons d'animaux.

    Que contient la transcription dans le résultat ?
body:
  options:
  - id: a
    text:
      en: The words of the narrator and a description of the music
      fr: Les paroles du narrateur et une description de la musique
  - id: b
    text:
      en: The words of the narrator and the names of the animals heard
      fr: Les paroles du narrateur et les noms des animaux entendus
  - id: c
    text:
      en: A description of every sound of the soundtrack
      fr: Une description de chaque son de la bande-son
  - id: d
    text:
      en: The words of the narrator, without the other sounds
      fr: Les paroles du narrateur, sans les autres sons
answer:
  optionId: d
explanation:
  correct:
    en: Only spoken words are transcribed. Music, sound effects and ambient noise are ignored, so the transcript contains what the narrator says and nothing about the other sounds.
    fr: 'Seules les paroles prononcées sont transcrites. La musique, les effets sonores et les bruits ambiants sont ignorés : la transcription contient donc ce que dit le narrateur et rien sur les autres sons.'
  options:
    a:
      en: Music isn't transcribed or described in the transcript.
      fr: La musique n'est ni transcrite ni décrite dans la transcription.
    b:
      en: 'Animal sounds are ambient noise: the transcription ignores them.'
      fr: 'Les sons d''animaux sont des bruits ambiants : la transcription les ignore.'
    c:
      en: A transcript is the text of the speech, not an inventory of sounds.
      fr: Une transcription est le texte de la parole, pas un inventaire des sons.
references:
- title: Azure Content Understanding in Foundry Tools video overview
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
