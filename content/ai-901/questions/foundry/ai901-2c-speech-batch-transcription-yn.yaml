id: ai901-2c-speech-batch-transcription-yn
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores recordings of customer calls as audio files in Azure Storage. The company plans to transcribe the files by using the batch transcription of Azure Speech.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke des enregistrements d'appels de clients sous forme de fichiers audio dans Stockage Azure. La société prévoit de transcrire les fichiers à l'aide de la transcription par lots d'Azure Speech.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Fabrikam can point to the audio files by using a shared access signature (SAS) URI."
        fr: "Fabrikam peut désigner les fichiers audio à l'aide d'un URI de signature d'accès partagé (SAS)."
    - id: s2
      text:
        en: "Batch transcription jobs are scheduled on a best-effort basis."
        fr: "Les travaux de transcription par lots sont planifiés selon le principe du meilleur effort (best effort)."
    - id: s3
      text:
        en: "The transcription of the files is returned in the response to the request that creates the job."
        fr: "La transcription des fichiers est renvoyée dans la réponse à la requête qui crée le travail."
answer:
  values:
    s1: true
    s2: true
    s3: false
explanation:
  correct:
    en: |
      Batch transcription is designed for recordings that are already stored: you point to the files, for example with a SAS URI, and the job runs asynchronously. Jobs are scheduled on a best-effort basis, so there is no guaranteed start time, and the results are retrieved later instead of being returned by the request that creates the job.
    fr: |
      La transcription par lots est conçue pour des enregistrements déjà stockés : vous désignez les fichiers, par exemple avec un URI SAS, et le travail s'exécute de façon asynchrone. Les travaux sont planifiés selon le principe du meilleur effort, sans heure de démarrage garantie, et les résultats sont récupérés plus tard au lieu d'être renvoyés par la requête qui crée le travail.
references:
  - title: "Speech recognition"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
  - title: "What is batch transcription?"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription
