id: ai901-2d-doc-yn-prebuilt
objective: "2.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You choose analyzers of Azure Content Understanding in Foundry Tools for several types of documents.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous choisissez des analyseurs d'Azure Content Understanding dans Foundry Tools pour plusieurs types de documents.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
  - id: s1
    text:
      en: The `prebuilt-read` analyzer returns the tables of a document as rows and columns.
      fr: L'analyseur `prebuilt-read` renvoie les tableaux d'un document sous forme de lignes et de colonnes.
  - id: s2
    text:
      en: The `prebuilt-invoice` analyzer extracts fields without you defining a schema.
      fr: L'analyseur `prebuilt-invoice` extrait des champs sans que vous définissiez de schéma.
  - id: s3
    text:
      en: A custom analyzer is limited to the fields that a prebuilt analyzer already defines.
      fr: Un analyseur personnalisé est limité aux champs qu'un analyseur prédéfini définit déjà.
answer:
  values:
    s1: false
    s2: true
    s3: false
explanation:
  correct:
    en: '`prebuilt-read` provides basic OCR without layout analysis; tables and sections are returned by `prebuilt-layout`. `prebuilt-invoice` already contains the schema of an invoice. A custom analyzer exists precisely to extract the fields of your own schema when no prebuilt analyzer fits.'
    fr: '`prebuilt-read` fournit une OCR de base sans analyse de la disposition ; les tableaux et les sections sont renvoyés par `prebuilt-layout`. `prebuilt-invoice` contient déjà le schéma d''une facture. Un analyseur personnalisé sert précisément à extraire les champs de votre propre schéma lorsqu''aucun analyseur prédéfini ne convient.'
references:
- title: Azure Content Understanding in Foundry Tools prebuilt analyzers
  url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
