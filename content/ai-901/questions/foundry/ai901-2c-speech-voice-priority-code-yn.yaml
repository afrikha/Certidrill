id: ai901-2c-speech-voice-priority-code-yn
objective: "2.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You review the following Python code. The `key` and `endpoint` variables contain the key and the endpoint of a Foundry resource.

    ```python
    import azure.cognitiveservices.speech as speechsdk

    speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)
    speech_config.speech_synthesis_language = "fr-FR"
    speech_config.speech_synthesis_voice_name = "en-US-Ava:DragonHDLatestNeural"

    audio_config = speechsdk.audio.AudioOutputConfig(filename="welcome.wav")
    synthesizer = speechsdk.SpeechSynthesizer(speech_config=speech_config, audio_config=audio_config)
    result = synthesizer.speak_text_async("Welcome to Contoso.").get()

    if result.reason == speechsdk.ResultReason.SynthesizingAudioCompleted:
        print("Done")
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez le code Python suivant. Les variables `key` et `endpoint` contiennent la clé et le point de terminaison d'une ressource Foundry.

    ```python
    import azure.cognitiveservices.speech as speechsdk

    speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)
    speech_config.speech_synthesis_language = "fr-FR"
    speech_config.speech_synthesis_voice_name = "en-US-Ava:DragonHDLatestNeural"

    audio_config = speechsdk.audio.AudioOutputConfig(filename="welcome.wav")
    synthesizer = speechsdk.SpeechSynthesizer(speech_config=speech_config, audio_config=audio_config)
    result = synthesizer.speak_text_async("Welcome to Contoso.").get()

    if result.reason == speechsdk.ResultReason.SynthesizingAudioCompleted:
        print("Done")
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The speech is played through the default speaker of the computer."
        fr: "La parole est lue sur le haut-parleur par défaut de l'ordinateur."
    - id: s2
      text:
        en: "The text is spoken by the voice `en-US-Ava:DragonHDLatestNeural`."
        fr: "Le texte est prononcé par la voix `en-US-Ava:DragonHDLatestNeural`."
    - id: s3
      text:
        en: "`Done` is displayed when the synthesis completes successfully."
        fr: "`Done` s'affiche quand la synthèse se termine correctement."
answer:
  values:
    s1: false
    s2: true
    s3: true
explanation:
  correct:
    en: |
      The `AudioOutputConfig` object is created with `filename`, so the speech is written to `welcome.wav` and not played on the speaker. When both a voice name and a synthesis language are set, the voice named in `speech_synthesis_voice_name` speaks and the language setting is ignored. A result whose reason is `SynthesizingAudioCompleted` means that the synthesis succeeded, so `Done` is printed.
    fr: |
      L'objet `AudioOutputConfig` est créé avec `filename` : la parole est donc écrite dans `welcome.wav` et n'est pas lue sur le haut-parleur. Quand un nom de voix et une langue de synthèse sont tous deux définis, c'est la voix nommée dans `speech_synthesis_voice_name` qui parle et le paramètre de langue est ignoré. Un résultat dont la raison est `SynthesizingAudioCompleted` signifie que la synthèse a réussi : `Done` est donc affiché.
