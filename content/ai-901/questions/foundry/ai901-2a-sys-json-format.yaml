id: ai901-2a-sys-json-format
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application sends customer emails to a model deployed in Microsoft Foundry. The application code then parses each response to read the name, the company and the phone number of the customer.

    Some responses are returned as free text, and the parsing fails. You need every response to have the same predictable form.

    What should you add to the system prompt?
  fr: |
    Une application envoie des e-mails de clients à un modèle déployé dans Microsoft Foundry. Le code de l'application analyse ensuite chaque réponse pour y lire le nom, la société et le numéro de téléphone du client.

    Certaines réponses sont renvoyées en texte libre, et l'analyse échoue. Chaque réponse doit avoir la même forme prévisible.

    Que devez-vous ajouter à l'invite système ?
body:
  options:
    - { id: a, text: { en: "An instruction to answer in a friendly and professional tone", fr: "Une instruction demandant de répondre sur un ton amical et professionnel" } }
    - { id: b, text: { en: "An instruction to return only JSON that uses a fixed set of keys", fr: "Une instruction demandant de ne renvoyer que du JSON avec un ensemble fixe de clés" } }
    - { id: c, text: { en: "An instruction to decline the requests that are outside the scope", fr: "Une instruction demandant de refuser les demandes hors périmètre" } }
    - { id: d, text: { en: "An instruction to proceed step by step and to show all the steps", fr: "Une instruction demandant de procéder étape par étape et de montrer toutes les étapes" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When an application needs structured output, the system prompt should state the output format plainly, for example JSON with fixed keys, and keep it stable. The code can then parse every response in the same way.
    fr: |
      Quand une application a besoin d'une sortie structurée, l'invite système doit énoncer clairement le format de sortie, par exemple du JSON avec des clés fixes, et le garder stable. Le code peut alors analyser chaque réponse de la même manière.
  options:
    a:
      en: "The tone changes the style of the text, not its structure. The response would still be free text."
      fr: "Le ton modifie le style du texte, pas sa structure. La réponse resterait du texte libre."
    c:
      en: "Defining boundaries limits the topics that the model handles. It doesn't make the response easier to parse."
      fr: "Définir des limites restreint les sujets que le modèle traite. Cela ne rend pas la réponse plus facile à analyser."
    d:
      en: "Asking for the steps makes the response longer and more detailed, which is the opposite of a fixed structure."
      fr: "Demander les étapes rend la réponse plus longue et plus détaillée, à l'opposé d'une structure fixe."
references:
  - title: "System message design"
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/advanced-prompt-engineering
