id: ai901-2a-deployment-default-name
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In the Foundry portal, you open the page of the **gpt-4.1** model in the model catalog and select **Deploy** > **Default settings**.

    Which name does the new deployment take?
  fr: |
    Dans le portail Foundry, vous ouvrez la page du modèle **gpt-4.1** dans le catalogue de modèles et vous sélectionnez **Deploy** > **Default settings**.

    Quel nom le nouveau déploiement prend-il ?
body:
  options:
    - { id: a, text: { en: "The name of the Foundry project", fr: "Le nom du projet Foundry" } }
    - { id: b, text: { en: "The name of the Foundry resource", fr: "Le nom de la ressource Foundry" } }
    - { id: c, text: { en: "The name of the resource group", fr: "Le nom du groupe de ressources" } }
    - { id: d, text: { en: "The name of the model", fr: "Le nom du modèle" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, the deployment name is the name of the model, here gpt-4.1. You can change it before you deploy; it is the value that client code then sends in the `model` parameter.
    fr: |
      Par défaut, le nom du déploiement est le nom du modèle, ici gpt-4.1. Vous pouvez le modifier avant de déployer ; c'est la valeur que le code client envoie ensuite dans le paramètre `model`.
  options:
    a:
      en: "The project is the workspace in which you work; a deployment doesn't take its name."
      fr: "Le projet est l'espace de travail dans lequel vous travaillez ; un déploiement ne prend pas son nom."
    b:
      en: "The Foundry resource hosts the deployments; its name appears in the endpoints, not as the deployment name."
      fr: "La ressource Foundry héberge les déploiements ; son nom apparaît dans les points de terminaison, pas comme nom de déploiement."
    c:
      en: "The resource group is the Azure container of the Foundry resource. It plays no role in the name of a deployment."
      fr: "Le groupe de ressources est le conteneur Azure de la ressource Foundry. Il ne joue aucun rôle dans le nom d'un déploiement."
references:
  - title: "Deploy Microsoft Foundry Models in the Foundry portal"
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/deploy-foundry-models
