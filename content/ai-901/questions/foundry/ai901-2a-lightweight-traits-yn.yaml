id: ai901-2a-lightweight-traits-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "A lightweight chat client typically needs extensive configuration and large local dependencies.", fr: "Un client de conversation léger exige généralement une configuration étendue et de volumineuses dépendances locales." } }
    - { id: s2, text: { en: "A lightweight chat client can run as a command-line application.", fr: "Un client de conversation léger peut s'exécuter comme une application en ligne de commande." } }
    - { id: s3, text: { en: "For Foundry, a lightweight chat client is often a single Python file that connects to a project endpoint.", fr: "Pour Foundry, un client de conversation léger est souvent un seul fichier Python qui se connecte au point de terminaison d'un projet." } }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A lightweight client is a small application that collects the user's input, calls a remote service and displays the result. It typically runs as a command-line tool, a small desktop utility or a simple web page, with a small code footprint and minimal configuration, often environment variables and a short script. For Foundry, it is often one Python file that connects to a project endpoint and sends chat messages to a deployed model.
    fr: |
      Un client léger est une petite application qui recueille la saisie de l'utilisateur, appelle un service distant et affiche le résultat. Il s'exécute généralement comme un outil en ligne de commande, un petit utilitaire de bureau ou une page web simple, avec peu de code et une configuration minimale, souvent des variables d'environnement et un court script. Pour Foundry, c'est souvent un seul fichier Python qui se connecte au point de terminaison d'un projet et envoie des messages de conversation à un modèle déployé.
references:
  - title: "Using a generative AI model"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
