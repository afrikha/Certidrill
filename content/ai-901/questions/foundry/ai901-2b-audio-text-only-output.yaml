id: ai901-2b-audio-text-only-output
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A call-center application sends recorded customer questions to a deployed `gpt-audio-mini` model through the Chat Completions API. Human operators read the model's answers on a screen; nobody listens to them.

    The solution must avoid generating audio that isn't used.

    What should the application do?
  fr: |
    Une application de centre d'appels envoie des questions de clients enregistrées à un modèle `gpt-audio-mini` déployé par l'intermédiaire de l'API Chat Completions. Des opérateurs humains lisent les réponses du modèle sur un écran ; personne ne les écoute.

    La solution doit éviter de générer de l'audio qui n'est pas utilisé.

    Que doit faire l'application ?
body:
  options:
    - { id: a, text: { en: "Send each recording as an `input_audio` part and request the text modality only.", fr: "Envoyer chaque enregistrement sous la forme d'une partie `input_audio` et demander uniquement la modalité texte." } }
    - { id: b, text: { en: "Request the text and audio modalities and ignore the `audio.data` value.", fr: "Demander les modalités texte et audio et ignorer la valeur `audio.data`." } }
    - { id: c, text: { en: "Request the text and audio modalities and display the `audio.transcript` value.", fr: "Demander les modalités texte et audio et afficher la valeur `audio.transcript`." } }
    - { id: d, text: { en: "Send each recording as a text part that contains the path of the audio file.", fr: "Envoyer chaque enregistrement sous la forme d'une partie texte qui contient le chemin du fichier audio." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The input and output modalities are independent: the audio-enabled models accept an audio prompt and can return text only. The recording still travels as an `input_audio` part, and without the audio modality in the request no spoken answer is generated.
    fr: |
      Les modalités d'entrée et de sortie sont indépendantes : les modèles compatibles avec l'audio acceptent une invite audio et peuvent renvoyer du texte seul. L'enregistrement est toujours transmis sous la forme d'une partie `input_audio`, et sans la modalité audio dans la requête aucune réponse parlée n'est générée.
  options:
    b:
      en: "The spoken answer would still be generated and returned, which the requirement excludes."
      fr: "La réponse parlée serait tout de même générée et renvoyée, ce que l'exigence exclut."
    c:
      en: "The transcript gives the text, but the audio it accompanies is generated as well."
      fr: "La transcription donne le texte, mais l'audio qu'elle accompagne est lui aussi généré."
    d:
      en: "The model can't open a file from a path on the client; the content of the recording must be sent, encoded in base64."
      fr: "Le modèle ne peut pas ouvrir un fichier à partir d'un chemin sur le client ; le contenu de l'enregistrement doit être envoyé, encodé en base64."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
