id: ai901-2b-audio-dd-request
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are completing a request that sends a recorded question to a deployed `gpt-audio-mini` model. The base64-encoded content of the recording is in `encoded_audio`.

    The model must answer in text and in speech, with the voice named alloy.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous complétez une requête qui envoie une question enregistrée à un modèle `gpt-audio-mini` déployé. Le contenu de l'enregistrement, encodé en base64, se trouve dans `encoded_audio`.

    Le modèle doit répondre en texte et en parole, avec la voix nommée alloy.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    completion = client.chat.completions.create(
        model="gpt-audio-mini",
        modalities=[[mods]],
        audio={"[[key]]": "alloy", "format": "wav"},
        messages=[{
            "role": "[[role]]",
            "content": [
                {"type": "text", "text": "Answer the question asked in this recording."},
                {"type": "input_audio", "input_audio": {"data": encoded_audio, "format": "wav"}},
            ],
        }],
    )
  slots:
    - id: mods
      options:
        - { id: text, text: '["text"]' }
        - { id: both, text: '["text", "audio"]' }
        - { id: wav, text: '["wav"]' }
    - id: key
      options:
        - { id: role, text: role }
        - { id: type, text: type }
        - { id: voice, text: voice }
    - id: role
      options:
        - { id: system, text: system }
        - { id: assistant, text: assistant }
        - { id: user, text: user }
answer:
  values: { mods: both, key: voice, role: user }
explanation:
  correct:
    en: |
      `modalities=["text", "audio"]` asks for an answer in both forms. In the `audio` parameter, `voice` names the voice and `format` the audio format of the spoken answer. The recorded question comes from the user, so it is placed in a message whose role is `user`.
    fr: |
      `modalities=["text", "audio"]` demande une réponse sous les deux formes. Dans le paramètre `audio`, `voice` nomme la voix et `format` le format audio de la réponse parlée. La question enregistrée vient de l'utilisateur : elle se place donc dans un message dont le rôle est `user`.
  options:
    text: { en: 'With `["text"]`, the model returns no spoken answer.', fr: 'Avec `["text"]`, le modèle ne renvoie aucune réponse parlée.' }
    wav: { en: "wav is an audio format, set with `format`; it isn't a modality.", fr: "wav est un format audio, défini avec `format` ; ce n'est pas une modalité." }
    role: { en: "role is a key of a message, not of the `audio` parameter.", fr: "role est une clé d'un message, pas du paramètre `audio`." }
    type: { en: "type is a key of a content part, not of the `audio` parameter.", fr: "type est une clé d'une partie de contenu, pas du paramètre `audio`." }
    system: { en: "A system message sets the behavior of the model; it doesn't carry the user's question.", fr: "Un message système fixe le comportement du modèle ; il ne porte pas la question de l'utilisateur." }
    assistant: { en: "An assistant message holds an earlier answer of the model in the history.", fr: "Un message assistant contient une réponse antérieure du modèle dans l'historique." }
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
