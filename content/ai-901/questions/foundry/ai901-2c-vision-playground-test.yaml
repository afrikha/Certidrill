id: ai901-2c-vision-playground-test
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deployed a vision-enabled model in a Foundry project. Without writing code, you want to check how the model describes a photo.

    What should you do in the Foundry portal?
  fr: |
    Vous avez déployé un modèle compatible avec la vision dans un projet Foundry. Sans écrire de code, vous voulez vérifier comment le modèle décrit une photo.

    Que devez-vous faire dans le portail Foundry ?
body:
  options:
    - id: a
      text:
        en: "In the model playground, upload the image and enter a prompt."
        fr: "Dans le terrain de jeu de modèles, charger l'image et saisir une invite."
    - id: b
      text:
        en: "In the image playground, enter a description of the photo."
        fr: "Dans le terrain de jeu d'images, saisir une description de la photo."
    - id: c
      text:
        en: "In the video playground, set the dimensions and the duration."
        fr: "Dans le terrain de jeu vidéo, régler les dimensions et la durée."
    - id: d
      text:
        en: "In the model catalog, filter the inference tasks on Text to image."
        fr: "Dans le catalogue de modèles, filtrer les tâches d'inférence sur Text to image."
answer:
  optionId: a
explanation:
  correct:
    en: |
      The model playground lets you chat with a deployed model. With a vision-enabled model, you upload an image in the chat and type a prompt such as "What can you tell me about this?"; the model answers from the text and the image together.
    fr: |
      Le terrain de jeu de modèles permet de converser avec un modèle déployé. Avec un modèle compatible avec la vision, vous chargez une image dans la conversation et saisissez une invite comme « What can you tell me about this? » ; le modèle répond à partir du texte et de l'image réunis.
  options:
    b:
      en: "The image playground is used with an image-generation model: a description entered there creates a new image."
      fr: "Le terrain de jeu d'images s'utilise avec un modèle de génération d'images : une description saisie à cet endroit crée une nouvelle image."
    c:
      en: "The video playground is used with a video-generation model to create a clip."
      fr: "Le terrain de jeu vidéo s'utilise avec un modèle de génération de vidéos pour créer un clip."
    d:
      en: "This filter finds image-generation models to deploy; it doesn't analyze a photo."
      fr: "Ce filtre permet de trouver des modèles de génération d'images à déployer ; il n'analyse pas une photo."
references:
  - title: "Multimodal models for image analysis"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
  - title: "Exercise - Get started with computer vision in Microsoft Foundry"
    url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/5-exercise
