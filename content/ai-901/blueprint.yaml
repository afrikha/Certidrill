# AI-901 — Microsoft Azure AI Fundamentals (exam created in 2026, replaces AI-900)
# Source: official study guide, "Skills measured as of April 15, 2026" (en-us and fr-fr pages,
# checked on 2026-11-16): https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ai-901
# Real exam: 45 minutes (fundamentals exam time on Learn, "Exam duration and exam experience"),
# passing score 700/1000 (exam page), no case study, no lab and no Yes/No series; Microsoft does
# not publish the number of questions (about 35 to 45 in practice).
# Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
certification:
  code: ai-901
  title: Microsoft Azure AI Fundamentals
  vendor: Microsoft
  active: false
blueprint:
  version: '2026-04-15'
  durationMin: 45
  questionCount:
    min: 35
    max: 45
  passScore: 700
  maxScore: 1000
  typeMix:
    single:
      min: 0.4
      max: 0.55
    multi:
      min: 0.05
      max: 0.1
    yesno_statements:
      min: 0.2
      max: 0.3
    dropdown:
      min: 0.1
      max: 0.15
    dragdrop:
      min: 0.05
      max: 0.1
    ordering:
      min: 0.0
      max: 0.03
    hotarea:
      min: 0.0
      max: 0.03
  difficultyMix:
    easy: 0.4
    medium: 0.45
    hard: 0.15
  structure:
    # Fundamentals: no case study and no Yes/No series (structure.caseStudies / series left out).
    maxPerObjective: 2
    warningsMin:
    - 10
    - 5
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale:
        from: 600
        to: 850
      weights:
        level: 0.5
        consistency: 0.2
        domains: 0.2
        freshness: 0.1
      bands:
        progressing: 50
        almost: 70
        ready: 85
      freshness:
        staleDays: 30
        zeroDays: 90
        minNewShare: 0.5
    progression:
      xp:
        base: 50
        scoreFrom: 400
        perPoint: 0.5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 50
      levels:
      - xp: 0
        title:
          en: AI curious
          fr: Curieux de l'IA
      - xp: 150
        title:
          en: Prompt apprentice
          fr: Apprenti des invites
      - xp: 400
        title:
          en: Token counter
          fr: Compteur de jetons
      - xp: 750
        title:
          en: Model picker
          fr: Sélectionneur de modèles
      - xp: 1200
        title:
          en: Responsible AI advocate
          fr: Défenseur de l'IA responsable
      - xp: 1750
        title:
          en: Speech and vision scout
          fr: Éclaireur voix et vision
      - xp: 2400
        title:
          en: Agent builder
          fr: Bâtisseur d'agents
      - xp: 3150
        title:
          en: Foundry insider
          fr: Initié Foundry
      - xp: 4000
        title:
          en: Fundamentals master
          fr: Maître des fondamentaux
      - xp: 5000
        title:
          en: AI legend
          fr: Légende de l'IA
      mastery:
        bronze: 650
        silver: 700
        gold: 850
      badges:
        hatTrick:
          count: 3
          min: 800
        regular:
          weeks: 4
        comeback:
          gain: 150
domains:
- code: concepts
  order: 1
  weight:
    min: 0.4
    max: 0.45
  title:
    en: Identify AI concepts and capabilities
    fr: Identifier les concepts et fonctionnalités de l'IA
- code: foundry
  order: 2
  weight:
    min: 0.55
    max: 0.6
  title:
    en: Implement AI solutions by using Microsoft Foundry
    fr: Implémenter des solutions IA à l'aide de Microsoft Foundry
