chapter: 23-vision-image-generation
questions:
  # ------------------------------------------------------------------ 1
  - id: ai901-qz-23-01
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An internal assistant of Wingtip Toys receives the request *Draw a cartoon of a cat wearing a yellow raincoat*.

        Which kind of model must produce the result?
      fr: |
        Un assistant interne de Wingtip Toys reçoit la demande *Draw a cartoon of a cat wearing a yellow raincoat*.

        Quel type de modèle doit produire le résultat ?
    body:
      options:
        - { id: a, text: { en: "A vision-enabled chat model, such as GPT-4.1-mini", fr: "Un modèle de conversation compatible avec la vision, comme GPT-4.1-mini" } }
        - { id: b, text: { en: "A video-generation model, such as Sora 2", fr: "Un modèle de génération de vidéos, comme Sora 2" } }
        - { id: c, text: { en: "An embedding model, such as text-embedding-3-small", fr: "Un modèle d'embedding, comme text-embedding-3-small" } }
        - { id: d, text: { en: "An image-generation model of the GPT-Image family", fr: "Un modèle de génération d'images de la famille GPT-Image" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          "Draw", "create" or "design" an image calls for an image-generation model: it produces a still image that matches a text description. The GPT-Image family generates still images, and FLUX is a partner family that does the same.
        fr: |
          « Dessiner », « créer » ou « concevoir » une image appelle un modèle de génération d'images : il produit une image fixe qui correspond à une description en texte. La famille GPT-Image génère des images fixes, et FLUX est une famille partenaire qui fait de même.
      options:
        a: { en: "A vision-enabled chat model reads an image and answers in text; it doesn't draw a new image.", fr: "Un modèle de conversation compatible avec la vision lit une image et répond en texte ; il ne dessine pas de nouvelle image." }
        b: { en: "Sora generates video clips, not a still cartoon.", fr: "Sora génère des clips vidéo, pas un dessin fixe." }
        c: { en: "An embedding model returns vectors that represent a text; it produces neither text answers nor images.", fr: "Un modèle d'embedding renvoie des vecteurs qui représentent un texte ; il ne produit ni réponse en texte ni image." }
    references:
      - title: "Image generation models"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation

  # ------------------------------------------------------------------ 2
  - id: ai901-qz-23-02
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A field-inspection application of Fabrikam must answer questions that technicians ask about photos of electrical panels.

        Which model from the Foundry model catalog can answer these questions?
      fr: |
        Une application d'inspection sur le terrain de Fabrikam doit répondre aux questions que posent les techniciens sur des photos de tableaux électriques.

        Quel modèle du catalogue de modèles Foundry peut répondre à ces questions ?
    body:
      options:
        - { id: a, text: "text-embedding-3-large" }
        - { id: b, text: "GPT-5.1" }
        - { id: c, text: "gpt-4o-mini-tts" }
        - { id: d, text: "Sora 2" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The GPT-5 series, like the GPT-4.1 family, is made of multimodal models: they accept text and images in the same prompt and answer in natural language, without a separate vision pipeline. They can answer questions about the objects, the text or the scene that a photo shows.
        fr: |
          La série GPT-5, comme la famille GPT-4.1, se compose de modèles multimodaux : ils acceptent du texte et des images dans la même invite et répondent en langage naturel, sans pipeline de vision séparé. Ils peuvent répondre à des questions sur les objets, le texte ou la scène qu'une photo montre.
      options:
        a: { en: "An embedding model turns text into vectors; it can't interpret an image, whatever the prompt says.", fr: "Un modèle d'embedding convertit du texte en vecteurs ; il ne peut pas interpréter une image, quoi que dise l'invite." }
        c: { en: "gpt-4o-mini-tts converts text to speech; it doesn't analyze photos.", fr: "gpt-4o-mini-tts convertit du texte en parole ; il n'analyse pas de photos." }
        d: { en: "Sora generates videos; it doesn't answer questions about a photo.", fr: "Sora génère des vidéos ; il ne répond pas à des questions sur une photo." }
    references:
      - title: "Multimodal models for image analysis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models

  # ------------------------------------------------------------------ 3
  - id: ai901-qz-23-03
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A Python application of Adatum sends a request that contains an `input_text` item and an `input_image` item to a deployment named **catalog-search**. The request fails. You discover that catalog-search is a deployment of text-embedding-3-small.

        The application must get a written description of each product photo.

        What should you do?
      fr: |
        Une application Python d'Adatum envoie une requête qui contient un élément `input_text` et un élément `input_image` à un déploiement nommé **catalog-search**. La requête échoue. Vous découvrez que catalog-search est un déploiement de text-embedding-3-small.

        L'application doit obtenir une description écrite de chaque photo de produit.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Send each photo as base64-encoded data instead of as a URL.", fr: "Envoyer chaque photo sous forme de données encodées en base64 au lieu d'une URL." } }
        - { id: b, text: { en: "Add a sentence that asks the model to look closely at the photo.", fr: "Ajouter une phrase qui demande au modèle de regarder attentivement la photo." } }
        - { id: c, text: { en: "Deploy GPT-4.1-mini and set `model` to the name of that deployment.", fr: "Déployer GPT-4.1-mini et définir `model` avec le nom de ce déploiement." } }
        - { id: d, text: { en: "Call `client.images.generate()` with catalog-search as the model.", fr: "Appeler `client.images.generate()` avec catalog-search comme modèle." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Only a vision-enabled model, such as GPT-4.1-mini, can interpret an image. An embedding model can't, whatever the request contains. After you deploy a vision-enabled model, the `model` argument must contain the name you gave that deployment.
        fr: |
          Seul un modèle compatible avec la vision, comme GPT-4.1-mini, peut interpréter une image. Un modèle d'embedding ne le peut pas, quel que soit le contenu de la requête. Après avoir déployé un modèle compatible avec la vision, l'argument `model` doit contenir le nom que vous avez donné à ce déploiement.
      options:
        a: { en: "A URL and base64 data are both valid ways to send an image; the form of the image isn't what fails.", fr: "Une URL et des données base64 sont deux façons valides d'envoyer une image ; ce n'est pas la forme de l'image qui échoue." }
        b: { en: "No prompt can give an embedding model the ability to interpret an image.", fr: "Aucune invite ne peut donner à un modèle d'embedding la capacité d'interpréter une image." }
        d: { en: "`images.generate` creates images on an image-generation deployment; it doesn't describe photos, and catalog-search isn't such a deployment.", fr: "`images.generate` crée des images sur un déploiement de génération d'images ; il ne décrit pas de photos, et catalog-search n'est pas un tel déploiement." }
    references:
      - title: "Multimodal models for image analysis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models

  # ------------------------------------------------------------------ 4
  - id: ai901-qz-23-04
    objective: "2.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A Python application of Proseware calls `client.images.generate()` on an image-generation deployment with `n=1`. It decodes `result.data[0].b64_json` with `base64.b64decode()` and saves the image to a file.

        The marketing team now wants four variants of each banner from a single request.

        What should you do?
      fr: |
        Une application Python de Proseware appelle `client.images.generate()` sur un déploiement de génération d'images avec `n=1`. Elle décode `result.data[0].b64_json` avec `base64.b64decode()` et enregistre l'image dans un fichier.

        L'équipe marketing veut maintenant quatre variantes de chaque bannière en une seule requête.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `n=4`, and decode and save only `result.data[0].b64_json`.", fr: "Définir `n=4`, puis décoder et enregistrer seulement `result.data[0].b64_json`." } }
        - { id: b, text: { en: "Keep `n=1`, and decode `result.data[0].b64_json` four times.", fr: "Conserver `n=1`, puis décoder quatre fois `result.data[0].b64_json`." } }
        - { id: c, text: { en: "Set `n=4`, and decode and save every item of `result.data`.", fr: "Définir `n=4`, puis décoder et enregistrer chaque élément de `result.data`." } }
        - { id: d, text: { en: "Keep `n=1`, and repeat the prompt four times in the `prompt` text.", fr: "Conserver `n=1`, puis répéter l'invite quatre fois dans le texte de `prompt`." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The `n` parameter of `images.generate` sets the number of images that one request returns. With `n=4`, `result.data` contains four items, each with its own base64 image in `b64_json`, so the application decodes and saves each one.
        fr: |
          Le paramètre `n` de `images.generate` fixe le nombre d'images qu'une requête renvoie. Avec `n=4`, `result.data` contient quatre éléments, chacun avec sa propre image en base64 dans `b64_json` : l'application décode et enregistre donc chacun d'eux.
      options:
        a: { en: "Four images are generated, but only the first one is saved.", fr: "Quatre images sont générées, mais seule la première est enregistrée." }
        b: { en: "Decoding the same string four times gives four copies of one image, not four variants.", fr: "Décoder quatre fois la même chaîne donne quatre copies d'une seule image, et non quatre variantes." }
        d: { en: "Repeating the description doesn't change the number of images; with `n=1` the request still returns one image.", fr: "Répéter la description ne change pas le nombre d'images ; avec `n=1`, la requête renvoie toujours une seule image." }
    references:
      - title: "Azure OpenAI image generation models"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 5
  - id: ai901-qz-23-05
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        The internal assistant of Contoso can use two deployments in Microsoft Foundry: a vision-enabled chat model and an image-generation model. Employees send the following requests, some of them with an attached picture.

        Which two requests should the assistant send to the image-generation deployment?

        NOTE: Each correct selection is worth one point.
      fr: |
        L'assistant interne de Contoso peut utiliser deux déploiements dans Microsoft Foundry : un modèle de conversation compatible avec la vision et un modèle de génération d'images. Les employés envoient les demandes suivantes, certaines avec une image jointe.

        Quelles sont les deux demandes que l'assistant doit envoyer au déploiement de génération d'images ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Read the expiry date printed on the label in the attached photo.", fr: "Lire la date d'expiration imprimée sur l'étiquette de la photo jointe." } }
        - { id: b, text: { en: "Create a mock-up of a new label for our olive oil bottle.", fr: "Créer une maquette d'une nouvelle étiquette pour notre bouteille d'huile d'olive." } }
        - { id: c, text: { en: "Describe the colors and layout of the attached shop window photo.", fr: "Décrire les couleurs et la disposition de la photo de vitrine jointe." } }
        - { id: d, text: { en: "Design a flat illustration of our mascot holding a lantern.", fr: "Concevoir une illustration en aplat de notre mascotte tenant une lanterne." } }
        - { id: e, text: { en: "Suggest three names for the mascot of our new store.", fr: "Proposer trois noms pour la mascotte de notre nouveau magasin." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Requests that create, draw or design a new picture, such as a label mock-up or an illustration of a mascot, go to the image-generation model, which turns a text description into an image. Requests that read or describe an existing picture, or that only need a written answer, go to the vision-enabled chat model, which answers in text.
        fr: |
          Les demandes qui créent, dessinent ou conçoivent une nouvelle image, comme une maquette d'étiquette ou une illustration de mascotte, vont au modèle de génération d'images, qui convertit une description en texte en image. Les demandes qui lisent ou décrivent une image existante, ou qui n'attendent qu'une réponse écrite, vont au modèle de conversation compatible avec la vision, qui répond en texte.
      options:
        a: { en: "Reading text in a photo is image analysis: the vision-enabled model returns the date as text.", fr: "Lire du texte sur une photo relève de l'analyse d'images : le modèle compatible avec la vision renvoie la date en texte." }
        c: { en: "Describing a photo is image analysis, answered in text by the vision-enabled model.", fr: "Décrire une photo relève de l'analyse d'images, à laquelle le modèle compatible avec la vision répond en texte." }
        e: { en: "Suggesting names asks for a text answer, which the chat model writes; no picture is created.", fr: "Proposer des noms demande une réponse en texte, que le modèle de conversation rédige ; aucune image n'est créée." }
    references:
      - title: "Image generation models"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation
      - title: "Multimodal models for image analysis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models

  # ------------------------------------------------------------------ 6
  - id: ai901-qz-23-06
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware builds two lightweight Python applications on its Foundry resource with the `openai` package. The first one asks a vision-enabled deployment what a photo shows by calling `client.responses.create()`. The second one creates pictures on an image-generation deployment by calling `client.images.generate()`.

        What does each application send and receive? To answer, drag the appropriate elements to the correct descriptions. Each element may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware crée deux applications Python légères sur sa ressource Foundry avec le package `openai`. La première demande à un déploiement compatible avec la vision ce que montre une photo, en appelant `client.responses.create()`. La seconde crée des images sur un déploiement de génération d'images, en appelant `client.images.generate()`.

        Qu'est-ce que chaque application envoie et reçoit ? Pour répondre, faites glisser les éléments appropriés vers les descriptions correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: items, text: { en: "`input_text` and `input_image` items", fr: "Des éléments `input_text` et `input_image`" } }
        - { id: outtext, text: { en: "Text in `output_text`", fr: "Du texte dans `output_text`" } }
        - { id: params, text: { en: "`prompt`, `n` and `size`", fr: "`prompt`, `n` et `size`" } }
        - { id: b64, text: { en: "A base64 string in `b64_json`", fr: "Une chaîne base64 dans `b64_json`" } }
        - { id: audio, text: { en: "An `input_audio` part and `modalities`", fr: "Une partie `input_audio` et `modalities`" } }
        - { id: url, text: { en: "The URL of a PNG file to download", fr: "L'URL d'un fichier PNG à télécharger" } }
      targets:
        - { id: t1, text: { en: "Sent by the photo analysis application", fr: "Envoyé par l'application d'analyse de photos" } }
        - { id: t2, text: { en: "Received by the photo analysis application", fr: "Reçu par l'application d'analyse de photos" } }
        - { id: t3, text: { en: "Sent by the picture creation application", fr: "Envoyé par l'application de création d'images" } }
        - { id: t4, text: { en: "Received by the picture creation application", fr: "Reçu par l'application de création d'images" } }
    answer:
      mapping: { t1: items, t2: outtext, t3: params, t4: b64 }
    explanation:
      correct:
        en: |
          Image analysis sends a user message with an `input_text` item and an `input_image` item, and the answer of the model comes back as text in `output_text`. Image generation sends a `prompt`, the number of images `n` and the `size`, and each generated image comes back as base64 text in `b64_json`, to decode with `base64.b64decode()` before saving.
        fr: |
          L'analyse d'images envoie un message utilisateur avec un élément `input_text` et un élément `input_image`, et la réponse du modèle revient sous forme de texte dans `output_text`. La génération d'images envoie un `prompt`, le nombre d'images `n` et la taille `size`, et chaque image générée revient sous forme de texte base64 dans `b64_json`, à décoder avec `base64.b64decode()` avant l'enregistrement.
      options:
        audio: { en: "An `input_audio` part and `modalities` belong to a request that sends a spoken prompt to an audio-enabled model.", fr: "Une partie `input_audio` et `modalities` appartiennent à une requête qui envoie une invite vocale à un modèle compatible avec l'audio." }
        url: { en: "The GPT-Image models return the image itself as base64 data, not a URL to download.", fr: "Les modèles GPT-Image renvoient l'image elle-même sous forme de données base64, pas une URL à télécharger." }
    references:
      - title: "Multimodal models for image analysis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
      - title: "Azure OpenAI image generation models"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 7
  - id: ai901-qz-23-07
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders photographs the same store shelf every Monday and every Friday to track missing products. **shelf-check** is a deployment of GPT-4.1-mini. A stock-control script contains the code below; both variables hold public URLs of the photos.

        ```python
        response = client.responses.create(
            model="shelf-check",
            input=[{
                "role": "user",
                "content": [
                    {"type": "input_text", "text": "As bullet points, list the products on the first shelf that are missing from the second."},
                    {"type": "input_image", "image_url": monday_photo_url},
                    {"type": "input_image", "image_url": friday_photo_url},
                ],
            }],
        )
        print(response.output_text)
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders photographie le même rayon de magasin chaque lundi et chaque vendredi pour suivre les produits manquants. **shelf-check** est un déploiement de GPT-4.1-mini. Un script de gestion des stocks contient le code ci-dessous ; les deux variables contiennent les URL publiques des photos.

        ```python
        response = client.responses.create(
            model="shelf-check",
            input=[{
                "role": "user",
                "content": [
                    {"type": "input_text", "text": "As bullet points, list the products on the first shelf that are missing from the second."},
                    {"type": "input_image", "image_url": monday_photo_url},
                    {"type": "input_image", "image_url": friday_photo_url},
                ],
            }],
        )
        print(response.output_text)
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The model receives the instruction and the two photos in a single request.", fr: "Le modèle reçoit l'instruction et les deux photos dans une seule requête." }
        - id: s2
          text: { en: "Each photo must first be converted to a text description by a separate call.", fr: "Chaque photo doit d'abord être convertie en description textuelle par un appel distinct." }
        - id: s3
          text: { en: "The bullet-point form of the answer comes from the text instruction of the prompt.", fr: "La forme en puces de la réponse vient de l'instruction en texte de l'invite." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A prompt to a vision-enabled model combines a text instruction with one or more images, sent together, and the model processes them in the same call. No separate vision pipeline or description step is needed. The model follows the text instruction about the images, including the form of the answer that it asks for.
        fr: |
          Une invite envoyée à un modèle compatible avec la vision combine une instruction en texte et une ou plusieurs images, envoyées ensemble, et le modèle les traite dans le même appel. Aucun pipeline de vision ni aucune étape de description séparés ne sont nécessaires. Le modèle suit l'instruction en texte portant sur les images, y compris la forme de réponse qu'elle demande.
      options:
        s2: { en: "GPT-4.1-mini interprets images directly; a separate conversion of each photo to text isn't needed.", fr: "GPT-4.1-mini interprète directement les images ; une conversion séparée de chaque photo en texte n'est pas nécessaire." }
    references:
      - title: "Multimodal models for image analysis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models

  # ------------------------------------------------------------------ 8
  - id: ai901-qz-23-08
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys writes a Python application that turns a hand-drawn logo sketch into a clean logo. The sketch is a local file. The application asks the vision-enabled deployment **vision-chat** to describe the sketch, then uses the description as the prompt for the image-generation deployment **logo-images**, and saves the result. `client` is an `OpenAI` object.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys écrit une application Python qui transforme l'esquisse dessinée à la main d'un logo en logo net. L'esquisse est un fichier local. L'application demande au déploiement compatible avec la vision **vision-chat** de décrire l'esquisse, puis utilise la description comme invite pour le déploiement de génération d'images **logo-images**, et enregistre le résultat. `client` est un objet `OpenAI`.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        import base64

        with open("sketch.jpg", "rb") as f:
            sketch_b64 = base64.[[enc]](f.read()).decode("utf-8")

        analysis = client.[[analyze]](
            model="vision-chat",
            input=[{"role": "user", "content": [
                {"type": "input_text", "text": "Describe this logo sketch in one sentence."},
                {"type": "input_image", "image_url": f"data:image/jpeg;base64,{sketch_b64}"},
            ]}],
        )

        result = client.[[generate]](
            model="logo-images",
            prompt="A clean, colored version of this logo: " + analysis.output_text,
            n=1,
            size="1024x1024",
        )
        with open("logo.png", "wb") as f:
            f.write(base64.[[dec]](result.data[0].b64_json))
      slots:
        - id: enc
          options:
            - { id: enc_encode, text: "b64encode" }
            - { id: enc_decode, text: "b64decode" }
            - { id: enc_urlsafe, text: "urlsafe_b64decode" }
        - id: analyze
          options:
            - { id: an_images, text: "images.generate" }
            - { id: an_responses, text: "responses.create" }
            - { id: an_embeddings, text: "embeddings.create" }
        - id: generate
          options:
            - { id: gen_responses, text: "responses.create" }
            - { id: gen_embeddings, text: "embeddings.create" }
            - { id: gen_images, text: "images.generate" }
        - id: dec
          options:
            - { id: dec_encode, text: "b64encode" }
            - { id: dec_decode, text: "b64decode" }
            - { id: dec_bytes, text: "encodebytes" }
    answer:
      values: { enc: enc_encode, analyze: an_responses, generate: gen_images, dec: dec_decode }
    explanation:
      correct:
        en: |
          Base64 turns binary data into text that can travel inside JSON. The local sketch is therefore encoded with `b64encode` before it's sent in an `input_image` item to `responses.create`, which returns the description in `output_text`. `images.generate` takes the `prompt`, `n` and `size` and returns the new logo as base64 text in `b64_json`, which `b64decode` turns back into the bytes of the PNG file.
        fr: |
          Le base64 convertit des données binaires en texte qui peut voyager dans du JSON. L'esquisse locale est donc encodée avec `b64encode` avant d'être envoyée dans un élément `input_image` à `responses.create`, qui renvoie la description dans `output_text`. `images.generate` prend le `prompt`, `n` et `size` et renvoie le nouveau logo sous forme de texte base64 dans `b64_json`, que `b64decode` reconvertit en octets du fichier PNG.
      options:
        enc_decode: { en: "The file contains raw image bytes: they must be encoded to base64 before sending, not decoded.", fr: "Le fichier contient les octets bruts de l'image : il faut les encoder en base64 avant l'envoi, et non les décoder." }
        an_images: { en: "`images.generate` creates images from a `prompt`; it takes no `input` with an image to describe.", fr: "`images.generate` crée des images à partir d'un `prompt` ; il ne prend pas d'`input` contenant une image à décrire." }
        gen_responses: { en: "The arguments `prompt`, `n` and `size` and the result in `data[0].b64_json` belong to `images.generate`, not to `responses.create`.", fr: "Les arguments `prompt`, `n` et `size` et le résultat dans `data[0].b64_json` appartiennent à `images.generate`, pas à `responses.create`." }
        dec_encode: { en: "`b64_json` is already base64 text: encoding it again wouldn't give the bytes of a PNG image.", fr: "`b64_json` est déjà du texte base64 : l'encoder de nouveau ne donnerait pas les octets d'une image PNG." }
    references:
      - title: "Multimodal models for image analysis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
      - title: "Azure OpenAI image generation models"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e

