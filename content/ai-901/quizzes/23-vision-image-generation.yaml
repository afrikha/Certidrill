  # ------------------------------------------------------------------ 10
  - id: ai901-qz-23-10
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum Insurance lets customers report car damage with a photo. **claims-vision** is a deployment of GPT-4.1-mini. `photo_url` holds the public HTTPS address of the customer's photo, and the application sends this request:

        ```python
        response = client.responses.create(
            model="claims-vision",
            input=[{
                "role": "user",
                "content": [
                    {"type": "input_text", "text": "Describe the damage visible in this photo: " + photo_url},
                ],
            }],
        )
        ```

        The answers never describe what the photos actually show.

        What should you do?
      fr: |
        Adatum Insurance permet à ses clients de déclarer des dégâts sur leur voiture avec une photo. **claims-vision** est un déploiement de GPT-4.1-mini. `photo_url` contient l'adresse HTTPS publique de la photo du client, et l'application envoie cette requête :

        ```python
        response = client.responses.create(
            model="claims-vision",
            input=[{
                "role": "user",
                "content": [
                    {"type": "input_text", "text": "Describe the damage visible in this photo: " + photo_url},
                ],
            }],
        )
        ```

        Les réponses ne décrivent jamais ce que les photos montrent réellement.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Deploy GPT-4.1 and send the same request to the new deployment.", fr: "Déployer GPT-4.1 et envoyer la même requête au nouveau déploiement." } }
        - { id: b, text: { en: "Encode `photo_url` in base64 inside the `input_text` item.", fr: "Encoder `photo_url` en base64 dans l'élément `input_text`." } }
        - { id: c, text: { en: "Call `client.images.generate()` with `photo_url` as the prompt.", fr: "Appeler `client.images.generate()` avec `photo_url` comme invite." } }
        - { id: d, text: { en: "Add an `input_image` item whose `image_url` is `photo_url`.", fr: "Ajouter un élément `input_image` dont l'`image_url` est `photo_url`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          GPT-4.1-mini is vision-enabled, so the model isn't the problem: the request contains no image. The photo is only a string inside the text instruction. The prompt must combine an `input_text` item with an `input_image` item that carries the image as a URL or as base64 data, so that the model processes the photo together with the instruction.
        fr: |
          GPT-4.1-mini est compatible avec la vision : le modèle n'est donc pas en cause, c'est la requête qui ne contient aucune image. La photo n'est qu'une chaîne dans l'instruction en texte. L'invite doit combiner un élément `input_text` et un élément `input_image` qui porte l'image sous forme d'URL ou de données base64, pour que le modèle traite la photo avec l'instruction.
      options:
        a: { en: "GPT-4.1 and GPT-4.1-mini are both vision-enabled; with the same request, the new deployment still receives no image.", fr: "GPT-4.1 et GPT-4.1-mini sont tous deux compatibles avec la vision ; avec la même requête, le nouveau déploiement ne reçoit toujours aucune image." }
        b: { en: "Base64 data is a way to send the image itself in an `input_image` item; encoding the address inside the text still sends no image.", fr: "Les données base64 servent à envoyer l'image elle-même dans un élément `input_image` ; encoder l'adresse dans le texte n'envoie toujours aucune image." }
        c: { en: "`images.generate` creates a new image from a description; it doesn't describe an existing photo.", fr: "`images.generate` crée une nouvelle image à partir d'une description ; il ne décrit pas une photo existante." }
    references:
      - title: "Multimodal models for image analysis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
