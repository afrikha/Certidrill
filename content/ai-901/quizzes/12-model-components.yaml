chapter: 12-model-components
questions:
  # ------------------------------------------------------------------ 1
  - id: ai901-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer sends the same prompt twice to a chat model deployed in Microsoft Foundry, without changing any setting between the two calls. Both answers have the same meaning, but their wording is different.

        What explains this difference?
      fr: |
        Un développeur envoie deux fois la même invite à un modèle de conversation déployé dans Microsoft Foundry, sans modifier aucun paramètre entre les deux appels. Les deux réponses ont le même sens, mais leur formulation est différente.

        Qu'est-ce qui explique cette différence ?
    body:
      options:
        - { id: a, text: { en: "The model is retrained between the two calls on the prompts that it receives.", fr: "Le modèle est réentraîné entre les deux appels sur les invites qu'il reçoit." } }
        - { id: b, text: { en: "The model searches a different part of its training documents at each call.", fr: "Le modèle recherche dans une partie différente de ses documents d'entraînement à chaque appel." } }
        - { id: c, text: { en: "The model picks each next token from probabilities, so the sequence can vary.", fr: "Le modèle choisit chaque jeton suivant selon des probabilités, donc la séquence peut varier." } }
        - { id: d, text: { en: "The deployment switches to another model version between the two calls.", fr: "Le déploiement passe à une autre version du modèle entre les deux appels." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A language model generates a completion by predicting a probable next token, appending it and repeating. Generation is probabilistic, so the same prompt can lead to a slightly different sequence of tokens from one call to the next. The temperature controls how random these choices are.
        fr: |
          Un modèle de langage génère une complétion en prédisant un jeton suivant probable, en l'ajoutant puis en recommençant. La génération est probabiliste : la même invite peut donc conduire à une séquence de jetons légèrement différente d'un appel à l'autre. La température contrôle le caractère aléatoire de ces choix.
      options:
        a: { en: "Inference doesn't change the model: training happens before deployment, not between calls.", fr: "L'inférence ne modifie pas le modèle : l'entraînement a lieu avant le déploiement, pas entre les appels." }
        b: { en: "A model doesn't look up stored documents; it predicts plausible text from what it learned.", fr: "Un modèle ne consulte pas des documents stockés ; il prédit un texte plausible à partir de ce qu'il a appris." }
        d: { en: "The model version is fixed by the deployment configuration; it doesn't change from one call to the next.", fr: "La version du modèle est fixée par la configuration du déploiement ; elle ne change pas d'un appel à l'autre." }
    references:
      - title: "Large language models (LLMs)"
        url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
      - title: "Prompt engineering techniques"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering

  # ------------------------------------------------------------------ 2
  - id: ai901-qz-12-02
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders must detect the language of two million short customer reviews. For each review, the solution must return a language code and a confidence score in the same format, and the same review must always get the same result.

        What should Northwind Traders use?
      fr: |
        Northwind Traders doit détecter la langue de deux millions de courts avis clients. Pour chaque avis, la solution doit renvoyer un code de langue et un score de confiance dans le même format, et le même avis doit toujours obtenir le même résultat.

        Que doit utiliser Northwind Traders ?
    body:
      options:
        - { id: a, text: { en: "A reasoning model from the GPT-5 family", fr: "Un modèle de raisonnement de la famille GPT-5" } }
        - { id: b, text: { en: "Azure Language in Foundry Tools", fr: "Azure Language dans Foundry Tools" } }
        - { id: c, text: { en: "An embedding model such as text-embedding-3-small", fr: "Un modèle d'embedding comme text-embedding-3-small" } }
        - { id: d, text: { en: "A multimodal model such as Phi-4-multimodal-instruct", fr: "Un modèle multimodal comme Phi-4-multimodal-instruct" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For a well-defined task, a Foundry Tool can replace a model from the catalog. Azure Language detects the language of a text and returns the language with a confidence score; its prebuilt analyzers return structured, deterministic output, which a generative model doesn't guarantee.
        fr: |
          Pour une tâche bien définie, un outil Foundry peut remplacer un modèle du catalogue. Azure Language détecte la langue d'un texte et renvoie la langue avec un score de confiance ; ses analyseurs prédéfinis renvoient une sortie structurée et déterministe, ce qu'un modèle génératif ne garantit pas.
      options:
        a: { en: "A reasoning model is built for multi-step planning; its generated output is probabilistic and costly for a simple, high-volume task.", fr: "Un modèle de raisonnement est conçu pour la planification en plusieurs étapes ; sa sortie générée est probabiliste et coûteuse pour une tâche simple à gros volume." }
        c: { en: "An embedding model returns vectors that encode meaning, not a language code with a confidence score.", fr: "Un modèle d'embedding renvoie des vecteurs qui encodent le sens, pas un code de langue avec un score de confiance." }
        d: { en: "A multimodal model accepts images or audio in prompts; the reviews are text, and its generated output isn't deterministic.", fr: "Un modèle multimodal accepte des images ou de l'audio dans les invites ; les avis sont du texte, et sa sortie générée n'est pas déterministe." }
    references:
      - title: "Generative AI models"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
      - title: "Understand text analysis in Foundry"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language

  # ------------------------------------------------------------------ 3
  - id: ai901-qz-12-03
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You test a chat model deployment in the Foundry playground. To make the answers more focused, you have already lowered the temperature. A colleague suggests that you also lower Top P in the same test.

        What is the recommended approach?
      fr: |
        Vous testez un déploiement de modèle de conversation dans le terrain de jeu de Foundry. Pour rendre les réponses plus ciblées, vous avez déjà baissé la température. Un collègue suggère de baisser aussi Top P dans le même test.

        Quelle est l'approche recommandée ?
    body:
      options:
        - { id: a, text: { en: "Change Top P or the temperature, but not both at the same time.", fr: "Modifier Top P ou la température, mais pas les deux à la fois." } }
        - { id: b, text: { en: "Lower both values, because their effects add up to give more accurate answers.", fr: "Baisser les deux valeurs, car leurs effets s'additionnent pour donner des réponses plus exactes." } }
        - { id: c, text: { en: "Lower Top P and raise the temperature, so that the two effects balance out.", fr: "Baisser Top P et augmenter la température, afin que les deux effets s'équilibrent." } }
        - { id: d, text: { en: "Keep both values and lower the max output tokens, which sets the randomness.", fr: "Garder les deux valeurs et baisser le nombre maximal de jetons de sortie, qui règle le caractère aléatoire." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Temperature and Top P both control the randomness of the responses, in different ways. The general recommendation is to alter one of these two parameters at a time, not both, so that you can see the effect of each change.
        fr: |
          La température et Top P contrôlent tous deux le caractère aléatoire des réponses, de façons différentes. La recommandation générale est de modifier un seul de ces deux paramètres à la fois, pas les deux, afin de voir l'effet de chaque changement.
      options:
        b: { en: "Neither parameter makes answers more accurate, and changing both at once is what the recommendation advises against.", fr: "Aucun des deux paramètres ne rend les réponses plus exactes, et modifier les deux à la fois est justement ce que la recommandation déconseille." }
        c: { en: "Moving the two parameters in opposite directions still changes both at once and makes the result hard to predict.", fr: "Faire varier les deux paramètres en sens inverse revient toujours à modifier les deux à la fois et rend le résultat difficile à prévoir." }
        d: { en: "Max output tokens caps the length of the answer; it doesn't control randomness.", fr: "Le nombre maximal de jetons de sortie plafonne la longueur de la réponse ; il ne contrôle pas le caractère aléatoire." }
    references:
      - title: "Prompt engineering techniques"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering

  # ------------------------------------------------------------------ 4
  - id: ai901-qz-12-04
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso is choosing a model in the Foundry model catalog for an internal assistant that summarizes meeting notes. The shortlist contains a large foundation model and a small language model. The team also estimates how many tokens per minute the deployment of the chosen model will need at peak hours.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso choisit un modèle dans le catalogue de modèles de Foundry pour un assistant interne qui résume des notes de réunion. La liste restreinte contient un grand modèle de base et un petit modèle de langage. L'équipe estime aussi le nombre de jetons par minute dont le déploiement du modèle choisi aura besoin aux heures de pointe.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A foundation model from the catalog can generate completions as soon as it's deployed, without additional training.", fr: "Un modèle de base du catalogue peut générer des complétions dès qu'il est déployé, sans entraînement supplémentaire." }
        - id: s2
          text: { en: "A small language model (SLM) such as Phi-4 generates text by a different process than predicting the next token.", fr: "Un petit modèle de langage (SLM) comme Phi-4 génère du texte par un autre procédé que la prédiction du jeton suivant." }
        - id: s3
          text: { en: "The rate limit of the deployment counts only the tokens of the generated answers, not the tokens of the prompts.", fr: "La limite de débit du déploiement ne compte que les jetons des réponses générées, pas les jetons des invites." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Foundation models are large pretrained models with general capabilities that can be deployed and used immediately. SLMs work the same way as LLMs, predicting one token after another, with fewer resources. Tokens are the unit of work: rate limits count the input tokens of the prompt as well as the generated tokens.
        fr: |
          Les modèles de base sont de grands modèles préentraînés aux capacités générales, qui peuvent être déployés et utilisés immédiatement. Les SLM fonctionnent comme les LLM, en prédisant un jeton après l'autre, avec moins de ressources. Les jetons sont l'unité de travail : les limites de débit comptent les jetons d'entrée de l'invite comme les jetons générés.
      options:
        s2: { en: "Small and large language models both generate a completion by repeatedly predicting the next token; an SLM is simply more compact.", fr: "Les petits comme les grands modèles de langage génèrent une complétion en prédisant le jeton suivant de façon répétée ; un SLM est simplement plus compact." }
        s3: { en: "Token rate limits use the actual input tokens and the generated tokens of each request.", fr: "Les limites de débit en jetons utilisent les jetons d'entrée réels et les jetons générés de chaque requête." }
    references:
      - title: "Generative AI models"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
      - title: "Manage Azure OpenAI in Microsoft Foundry Models quota"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/quota

  # ------------------------------------------------------------------ 5
  - id: ai901-qz-12-05
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Employees find the answers of an HR assistant too long. To shorten them, a developer sets max output tokens to 80 on the model deployment. Now many answers stop in the middle of a sentence.

        The answers must be short and complete. What should you do?
      fr: |
        Les employés trouvent trop longues les réponses d'un assistant RH. Pour les raccourcir, un développeur règle le nombre maximal de jetons de sortie à 80 sur le déploiement du modèle. Désormais, beaucoup de réponses s'arrêtent au milieu d'une phrase.

        Les réponses doivent être courtes et complètes. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep max output tokens at 80, and lower the temperature so that the model writes fewer words.", fr: "Garder le nombre maximal de jetons de sortie à 80, et baisser la température pour que le modèle écrive moins de mots." } }
        - { id: b, text: { en: "Keep max output tokens at 80, and lower Top P so that the model selects shorter tokens.", fr: "Garder le nombre maximal de jetons de sortie à 80, et baisser Top P pour que le modèle choisisse des jetons plus courts." } }
        - { id: c, text: { en: "Raise max output tokens again, and ask for short answers in the system instructions.", fr: "Relever le nombre maximal de jetons de sortie, et demander des réponses courtes dans les instructions système." } }
        - { id: d, text: { en: "Lower max output tokens further, so that the model plans a shorter answer in advance.", fr: "Baisser encore le nombre maximal de jetons de sortie, pour que le modèle prévoie une réponse plus courte." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Max output tokens only caps the length: the answer is cut when the cap is reached, and the model isn't asked to be concise. The system instructions set the rules of the model for the conversation, so a request for short answers there produces short, complete answers, while a sufficient cap prevents truncation.
        fr: |
          Le nombre maximal de jetons de sortie ne fait que plafonner la longueur : la réponse est coupée quand le plafond est atteint, et rien ne demande au modèle d'être concis. Les instructions système fixent les règles du modèle pour la conversation : y demander des réponses courtes produit des réponses courtes et complètes, tandis qu'un plafond suffisant évite la troncature.
      options:
        a: { en: "A lower temperature makes the answers more focused and repeatable, not shorter; they are still cut at 80 tokens.", fr: "Une température plus basse rend les réponses plus ciblées et reproductibles, pas plus courtes ; elles restent coupées à 80 jetons." }
        b: { en: "Top P controls randomness, not the length of tokens or answers; the cut at 80 tokens remains.", fr: "Top P contrôle le caractère aléatoire, pas la longueur des jetons ni des réponses ; la coupure à 80 jetons demeure." }
        d: { en: "The model doesn't adapt its answer to the cap; a lower cap cuts the answers even earlier.", fr: "Le modèle n'adapte pas sa réponse au plafond ; un plafond plus bas coupe les réponses encore plus tôt." }
    references:
      - title: "Using a generative AI model"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models

  # ------------------------------------------------------------------ 6
  - id: ai901-qz-12-06
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys plans four features for its customer service platform. Each feature will use a separate model deployment in Microsoft Foundry. The solution must use the type of model that matches the capability that each feature requires.

        Which type of model should you use for each feature? To answer, drag the appropriate model types to the correct features. Each model type may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys prévoit quatre fonctionnalités pour sa plateforme de service client. Chaque fonctionnalité utilisera un déploiement de modèle distinct dans Microsoft Foundry. La solution doit utiliser le type de modèle qui correspond à la capacité qu'exige chaque fonctionnalité.

        Quel type de modèle devez-vous utiliser pour chaque fonctionnalité ? Pour répondre, faites glisser les types de modèles appropriés vers les fonctionnalités correspondantes. Chaque type de modèle peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: reason, text: { en: "Reasoning model", fr: "Modèle de raisonnement" } }
        - { id: embed, text: { en: "Embedding model", fr: "Modèle d'embedding" } }
        - { id: small, text: { en: "Small language model (SLM)", fr: "Petit modèle de langage (SLM)" } }
        - { id: image, text: { en: "Image-generation model", fr: "Modèle de génération d'images" } }
        - { id: multi, text: { en: "Multimodal model", fr: "Modèle multimodal" } }
        - { id: video, text: { en: "Video-generation model", fr: "Modèle de génération de vidéos" } }
      targets:
        - { id: t1, text: { en: "Plan the steps of a product return and call the order, shipping and refund tools in the right order.", fr: "Planifier les étapes d'un retour de produit et appeler les outils de commande, d'expédition et de remboursement dans le bon ordre." } }
        - { id: t2, text: { en: "Find the help articles whose meaning is closest to the text of a customer's question.", fr: "Trouver les articles d'aide dont le sens est le plus proche du texte de la question d'un client." } }
        - { id: t3, text: { en: "Answer thousands of simple text questions about order status per minute, at the lowest cost and latency.", fr: "Répondre à des milliers de questions textuelles simples sur l'état des commandes par minute, au coût et à la latence les plus faibles." } }
        - { id: t4, text: { en: "Create the banner picture of a promotion from a text description.", fr: "Créer l'image de bannière d'une promotion à partir d'une description textuelle." } }
    answer:
      mapping: { t1: reason, t2: embed, t3: small, t4: image }
    explanation:
      correct:
        en: |
          Reasoning models are optimized for multi-step reasoning, planning and agentic workflows that chain tools. Embedding models return vectors that encode meaning, which is what semantic search compares. Smaller models such as SLMs suit simple, high-volume tasks where cost and latency matter most. An image-generation model creates an image from a description.
        fr: |
          Les modèles de raisonnement sont optimisés pour le raisonnement en plusieurs étapes, la planification et les flux agentiques qui enchaînent des outils. Les modèles d'embedding renvoient des vecteurs qui encodent le sens, ce que compare la recherche sémantique. Les modèles plus petits comme les SLM conviennent aux tâches simples à gros volume, où le coût et la latence comptent le plus. Un modèle de génération d'images crée une image à partir d'une description.
      options:
        multi: { en: "A multimodal model accepts images or audio in prompts; no feature sends anything other than text to the model.", fr: "Un modèle multimodal accepte des images ou de l'audio dans les invites ; aucune fonctionnalité n'envoie autre chose que du texte au modèle." }
        video: { en: "No feature needs a video; the banner is a still image.", fr: "Aucune fonctionnalité n'a besoin d'une vidéo ; la bannière est une image fixe." }
    references:
      - title: "Generative AI models"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models

  # ------------------------------------------------------------------ 7
  - id: ai901-qz-12-07
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum's sales assistant uses a chat model deployed in Microsoft Foundry, with the temperature set to 0. The prompt contains only the system instructions and the user's question. When salespeople ask about a product line that Adatum launched last month, the assistant gives a fluent, confident and wrong description, and the description is the same every time.

        What explains this behavior, and what should Adatum do?
      fr: |
        L'assistant commercial d'Adatum utilise un modèle de conversation déployé dans Microsoft Foundry, avec une température réglée à 0. L'invite contient uniquement les instructions système et la question de l'utilisateur. Quand les commerciaux posent une question sur une gamme de produits qu'Adatum a lancée le mois dernier, l'assistant donne une description fluide, assurée et fausse, et cette description est la même à chaque fois.

        Qu'est-ce qui explique ce comportement, et que doit faire Adatum ?
    body:
      options:
        - { id: a, text: { en: "A temperature of 0 limits the model to facts it already knows. Raise the temperature so that it considers newer facts.", fr: "Une température de 0 limite le modèle aux faits qu'il connaît déjà. Augmenter la température pour qu'il considère des faits plus récents." } }
        - { id: b, text: { en: "The model writes plausible text from its training data, which predates the products. Add the product information to the prompt.", fr: "Le modèle écrit un texte plausible à partir de ses données d'entraînement, antérieures aux produits. Ajouter les informations sur les produits à l'invite." } }
        - { id: c, text: { en: "The answer is cut before the model reaches the recent facts. Raise the max output tokens value of each request.", fr: "La réponse est coupée avant que le modèle n'atteigne les faits récents. Relever le nombre maximal de jetons de sortie de chaque requête." } }
        - { id: d, text: { en: "The TPM limit of the deployment blocks access to recent data. Raise the TPM limit so that the model reaches it.", fr: "La limite TPM du déploiement bloque l'accès aux données récentes. Relever la limite TPM pour que le modèle y accède." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A model predicts plausible text; it doesn't look up facts, and it only knows its training data unless the prompt brings more context. Retrieving the product information and adding it to the prompt grounds the answer in that data (retrieval-augmented generation). A temperature of 0 explains why the wrong answer is repeated, not why it's wrong.
        fr: |
          Un modèle prédit un texte plausible ; il ne consulte pas des faits, et il ne connaît que ses données d'entraînement, sauf si l'invite apporte du contexte. Récupérer les informations sur les produits et les ajouter à l'invite ancre la réponse dans ces données (génération augmentée par récupération). Une température de 0 explique pourquoi la réponse fausse se répète, pas pourquoi elle est fausse.
      options:
        a: { en: "Temperature changes how varied the wording is; a higher value makes answers more random, not more up to date.", fr: "La température change la variété de la formulation ; une valeur plus haute rend les réponses plus aléatoires, pas plus à jour." }
        c: { en: "The answers are complete, and max output tokens only caps their length; it adds no knowledge.", fr: "Les réponses sont complètes, et le nombre maximal de jetons de sortie ne fait que plafonner leur longueur ; il n'apporte aucune connaissance." }
        d: { en: "The TPM limit is a rate limit: exceeding it causes rate-limit errors, not wrong answers.", fr: "La limite TPM est une limite de débit : la dépasser provoque des erreurs de limite de débit, pas des réponses fausses." }
    references:
      - title: "Large language models (LLMs)"
        url: https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/3-language-models
      - title: "Prompt engineering techniques"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering

  # ------------------------------------------------------------------ 8
  - id: ai901-qz-12-08
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware wants employees to get written answers to their questions, based on the most relevant passages of a 300-page HR handbook. A developer deploys text-embedding-3-small in Microsoft Foundry and sends each employee question to it. The deployment returns an array of numbers for each question instead of an answer.

        What should the developer do to meet the requirement?
      fr: |
        Litware veut que les employés obtiennent des réponses rédigées à leurs questions, fondées sur les passages les plus pertinents d'un manuel RH de 300 pages. Un développeur déploie text-embedding-3-small dans Microsoft Foundry et lui envoie chaque question d'employé. Le déploiement renvoie un tableau de nombres pour chaque question au lieu d'une réponse.

        Que doit faire le développeur pour satisfaire l'exigence ?
    body:
      options:
        - { id: a, text: { en: "Raise the temperature of the embedding deployment so that it returns sentences instead of numbers.", fr: "Augmenter la température du déploiement d'embedding pour qu'il renvoie des phrases au lieu de nombres." } }
        - { id: b, text: { en: "Replace the embedding model with a chat model, which can answer from the handbook without any search.", fr: "Remplacer le modèle d'embedding par un modèle de conversation, qui peut répondre à partir du manuel sans aucune recherche." } }
        - { id: c, text: { en: "Raise the max output tokens of the embedding deployment so that the vectors are decoded into text.", fr: "Relever le nombre maximal de jetons de sortie du déploiement d'embedding pour que les vecteurs soient décodés en texte." } }
        - { id: d, text: { en: "Use the vectors to find the closest handbook passages, and have a chat model write the answer from them.", fr: "Utiliser les vecteurs pour trouver les passages du manuel les plus proches, et faire rédiger la réponse par un modèle de conversation." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          An embedding model returns vectors, not text: it can compare the meaning of a question with the meaning of the handbook passages but can't hold a conversation. The relevant passages are then added to the prompt of a chat model, which writes an answer grounded in them (retrieval-augmented generation).
        fr: |
          Un modèle d'embedding renvoie des vecteurs, pas du texte : il peut comparer le sens d'une question avec celui des passages du manuel, mais il ne peut pas tenir une conversation. Les passages pertinents sont ensuite ajoutés à l'invite d'un modèle de conversation, qui rédige une réponse ancrée dans ces passages (génération augmentée par récupération).
      options:
        a: { en: "No parameter turns an embedding model into a text generator; its output is always a vector.", fr: "Aucun paramètre ne transforme un modèle d'embedding en générateur de texte ; sa sortie est toujours un vecteur." }
        b: { en: "A chat model knows only its training data, not Litware's handbook; without retrieval, its answers aren't grounded in the handbook.", fr: "Un modèle de conversation ne connaît que ses données d'entraînement, pas le manuel de Litware ; sans récupération, ses réponses ne sont pas ancrées dans le manuel." }
        c: { en: "Max output tokens caps the length of generated text; an embedding model generates no text to cap.", fr: "Le nombre maximal de jetons de sortie plafonne la longueur d'un texte généré ; un modèle d'embedding ne génère aucun texte à plafonner." }
    references:
      - title: "Generative AI models"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/2-generative-ai-models
      - title: "Foundry Models sold by Azure"
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure

  # ------------------------------------------------------------------ 9
  - id: ai901-qz-12-09
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam deploys the same chat model in Microsoft Foundry for three workloads, described in the answer area. Each deployment must meet the requirements of its workload at the lowest cost.

        Which deployment type should you choose for each workload? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam déploie le même modèle de conversation dans Microsoft Foundry pour trois charges de travail, décrites dans la zone de réponse. Chaque déploiement doit satisfaire les exigences de sa charge de travail au coût le plus bas.

        Quel type de déploiement devez-vous choisir pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Internal assistant with low, irregular traffic. Prompts and responses must be processed only within the Azure geography of the resource, and Fabrikam pays only for the tokens used: [[w1]]

          Monthly classification of three million archived contracts. Results within 24 hours are acceptable, and processing must stay inside the EU data zone: [[w2]]

          Contact center assistant with a constant high volume. It needs reserved capacity and consistent latency, and processing must stay inside the EU data zone: [[w3]]
        fr: |
          Assistant interne au trafic faible et irrégulier. Les invites et les réponses doivent être traitées uniquement dans la zone géographique Azure de la ressource, et Fabrikam ne paie que les jetons utilisés : [[w1]]

          Classement mensuel de trois millions de contrats archivés. Des résultats sous 24 heures sont acceptables, et le traitement doit rester dans la zone de données UE : [[w2]]

          Assistant de centre de contact au volume élevé et constant. Il a besoin d'une capacité réservée et d'une latence régulière, et le traitement doit rester dans la zone de données UE : [[w3]]
      slots:
        - id: w1
          options:
            - { id: gstd, text: Global Standard }
            - { id: dzstd, text: Data Zone Standard }
            - { id: std, text: Standard }
            - { id: rprov, text: Regional Provisioned }
        - id: w2
          options:
            - { id: gbatch, text: Global Batch }
            - { id: dzstd, text: Data Zone Standard }
            - { id: dzprov, text: Data Zone Provisioned }
            - { id: dzbatch, text: Data Zone Batch }
        - id: w3
          options:
            - { id: dzbatch, text: Data Zone Batch }
            - { id: dzprov, text: Data Zone Provisioned }
            - { id: gprov, text: Global Provisioned }
            - { id: dzstd, text: Data Zone Standard }
    answer:
      values: { w1: std, w2: dzbatch, w3: dzprov }
    explanation:
      correct:
        en: |
          Standard processes data within the Azure geography of the resource, bills per token and suits low-to-medium, bursty volumes. Data Zone Batch keeps processing in the data zone, costs about 50 percent less than standard pricing and targets a 24-hour turnaround. Data Zone Provisioned combines data zone processing with reserved provisioned throughput units (PTUs) for predictable throughput and latency.
        fr: |
          Standard traite les données dans la zone géographique Azure de la ressource, facture au jeton et convient aux volumes faibles à moyens et irréguliers. Data Zone Batch garde le traitement dans la zone de données, coûte environ 50 % de moins que la tarification standard et vise un délai de 24 heures. Data Zone Provisioned combine le traitement dans la zone de données avec des unités de débit approvisionné (PTU) réservées, pour un débit et une latence prévisibles.
      options:
        gstd: { en: "Global Standard may process a request in any Azure region, which breaks the geography requirement.", fr: "Global Standard peut traiter une requête dans n'importe quelle région Azure, ce qui enfreint l'exigence de zone géographique." }
        dzstd: { en: "Data Zone Standard spans the whole data zone, which is larger than one Azure geography; for the batch job it costs more than Batch; and it reserves no capacity.", fr: "Data Zone Standard couvre toute la zone de données, plus large qu'une zone géographique Azure ; pour le traitement par lots, il coûte plus cher que Batch ; et il ne réserve aucune capacité." }
        rprov: { en: "Regional Provisioned bills reserved PTUs, not the tokens used, which is costly for low, irregular traffic.", fr: "Regional Provisioned facture des PTU réservées, pas les jetons utilisés, ce qui est coûteux pour un trafic faible et irrégulier." }
        gbatch: { en: "Global Batch may process the contracts in any Azure region, outside the EU data zone.", fr: "Global Batch peut traiter les contrats dans n'importe quelle région Azure, en dehors de la zone de données UE." }
        dzprov: { en: "For the monthly job, reserved capacity is paid for all month; Batch is cheaper when a 24-hour turnaround is acceptable.", fr: "Pour le traitement mensuel, la capacité réservée est payée tout le mois ; Batch est moins cher quand un délai de 24 heures est acceptable." }
        dzbatch: { en: "Batch isn't real time, so it can't serve a contact center assistant.", fr: "Batch n'est pas en temps réel : il ne peut pas servir un assistant de centre de contact." }
        gprov: { en: "Global Provisioned may process requests in any Azure region, outside the EU data zone.", fr: "Global Provisioned peut traiter les requêtes dans n'importe quelle région Azure, en dehors de la zone de données UE." }
    references:
      - title: "Deployment types for Microsoft Foundry Models"
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types

  # ------------------------------------------------------------------ 10
  - id: ai901-qz-12-10
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A Wingtip Toys application sends chat requests to a Global Standard deployment named **faq-bot** of the gpt-4.1-mini model, with the `model` value of each request set to faq-bot. At peak hours, the application receives HTTP 429 errors. Wingtip Toys still has unused quota for this model, and creates a second deployment named **faq-bot-2** of the same model to share the load.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Une application de Wingtip Toys envoie des requêtes de conversation à un déploiement Global Standard nommé **faq-bot** du modèle gpt-4.1-mini, avec la valeur `model` de chaque requête réglée sur faq-bot. Aux heures de pointe, l'application reçoit des erreurs HTTP 429. Wingtip Toys dispose encore d'un quota inutilisé pour ce modèle et crée un second déploiement nommé **faq-bot-2** du même modèle pour répartir la charge.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Raising the TPM limit of faq-bot, within the unused quota, can reduce the 429 errors.", fr: "Relever la limite TPM de faq-bot, dans la limite du quota inutilisé, peut réduire les erreurs 429." }
        - id: s2
          text: { en: "Moving the chat traffic to a Global Batch deployment removes the 429 errors and keeps the answers interactive.", fr: "Déplacer le trafic de conversation vers un déploiement Global Batch supprime les erreurs 429 et garde les réponses interactives." }
        - id: s3
          text: { en: "faq-bot-2 receives requests only after the application sends some of its requests with faq-bot-2 as the model value.", fr: "faq-bot-2 ne reçoit des requêtes qu'une fois que l'application envoie une partie de ses requêtes avec faq-bot-2 comme valeur model." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A 429 error means that the deployment is throttled because it reached its rate limit; quota that isn't allocated to the deployment receiving the traffic doesn't help, so raising its TPM limit can. Batch deployments are cheaper but process requests asynchronously with a 24-hour target, so they can't serve a chat. Code calls a deployment by its name, so a new deployment receives nothing until the application uses that name.
        fr: |
          Une erreur 429 signifie que le déploiement est limité parce qu'il a atteint sa limite de débit ; un quota qui n'est pas alloué au déploiement qui reçoit le trafic n'aide pas, alors que relever sa limite TPM le peut. Les déploiements Batch sont moins chers mais traitent les requêtes de façon asynchrone avec un objectif de 24 heures : ils ne peuvent pas servir une conversation. Le code appelle un déploiement par son nom : un nouveau déploiement ne reçoit rien tant que l'application n'utilise pas ce nom.
      options:
        s2: { en: "Batch has no real-time SLA and targets results within 24 hours: the chat would no longer be interactive.", fr: "Batch n'a pas de contrat de niveau de service en temps réel et vise des résultats sous 24 heures : la conversation ne serait plus interactive." }
    references:
      - title: "Manage Azure OpenAI in Microsoft Foundry Models quota"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/quota
      - title: "Deployment types for Microsoft Foundry Models"
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types
