chapter: 21-generative-apps-agents
questions:
  # ------------------------------------------------------------------ 1
  - id: ai901-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware builds a chat assistant for a museum, based on a model deployed in Microsoft Foundry.

        Which of the following texts belongs in the system prompt?
      fr: |
        Proseware crée un assistant de conversation pour un musée, basé sur un modèle déployé dans Microsoft Foundry.

        Lequel des textes suivants a sa place dans l'invite système ?
    body:
      options:
        - { id: a, text: { en: "What time does the museum close on Sundays and on public holidays?", fr: "À quelle heure le musée ferme-t-il le dimanche et les jours fériés ?" } }
        - { id: b, text: { en: "Is there a reduced ticket price for students and for groups of ten?", fr: "Existe-t-il un tarif réduit pour les étudiants et les groupes de dix ?" } }
        - { id: c, text: { en: "Answer only questions about exhibitions, tickets and opening hours.", fr: "Répondez uniquement aux questions sur les expositions, les billets et les horaires." } }
        - { id: d, text: { en: "Which exhibition should I visit first with two children under ten?", fr: "Quelle exposition dois-je visiter en premier avec deux enfants de moins de dix ans ?" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The system prompt sets the behavior of the model for the whole conversation: its role, its scope, its tone and its constraints. A rule that limits the topics the assistant answers is such a constraint. It's written once by the developer, in the **Instructions** box of the playground or in the `system` message in code.
        fr: |
          L'invite système fixe le comportement du modèle pour toute la conversation : son rôle, son périmètre, son ton et ses contraintes. Une règle qui limite les sujets auxquels l'assistant répond est une telle contrainte. Elle est écrite une fois par le développeur, dans la zone **Instructions** du terrain de jeu ou dans le message `system` dans le code.
      options:
        a: { en: "This is a question that a visitor asks at one turn of the conversation: a user prompt.", fr: "C'est une question posée par un visiteur à un tour de la conversation : une invite utilisateur." }
        b: { en: "This is one request of a visitor, which the model answers while following the system prompt: a user prompt.", fr: "C'est une demande d'un visiteur, à laquelle le modèle répond en suivant l'invite système : une invite utilisateur." }
        d: { en: "This question asks for one answer for one visitor; it doesn't set a rule for the conversation, so it's a user prompt.", fr: "Cette question demande une réponse pour un visiteur ; elle ne fixe aucune règle pour la conversation : c'est une invite utilisateur." }
    references:
      - title: "Using a generative AI model"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models

  # ------------------------------------------------------------------ 2
  - id: ai901-qz-21-02
    objective: "2.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You created a project in the Foundry portal. A developer needs the project endpoint and the API key to configure a client application.

        Where does the Foundry portal display them?
      fr: |
        Vous avez créé un projet dans le portail Foundry. Un développeur a besoin du point de terminaison du projet et de la clé d'API pour configurer une application cliente.

        Où le portail Foundry les affiche-t-il ?
    body:
      options:
        - { id: a, text: { en: "On the model page of the model catalog", fr: "Dans la page du modèle du catalogue de modèles" } }
        - { id: b, text: { en: "On the Home page of the project", fr: "Dans la page Home du projet" } }
        - { id: c, text: { en: "In the Instructions box of the playground", fr: "Dans la zone Instructions du terrain de jeu" } }
        - { id: d, text: { en: "In the Compare models pane of the playground", fr: "Dans le volet Compare models du terrain de jeu" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The **Home** page of a project shows the project endpoint and the API key, as well as the Azure OpenAI endpoint. The key isn't needed when the client authenticates with Microsoft Entra ID, for example through `DefaultAzureCredential()`.
        fr: |
          La page **Home** d'un projet affiche le point de terminaison du projet et la clé d'API, ainsi que le point de terminaison Azure OpenAI. La clé n'est pas nécessaire quand le client s'authentifie avec Microsoft Entra ID, par exemple via `DefaultAzureCredential()`.
      options:
        a: { en: "The model page describes a model of the catalog, its capabilities and benchmarks; it doesn't show the endpoint of your project.", fr: "La page du modèle décrit un modèle du catalogue, ses fonctionnalités et ses bancs d'essai ; elle n'affiche pas le point de terminaison de votre projet." }
        c: { en: "The Instructions box holds the system prompt that you test; it doesn't display connection details.", fr: "La zone Instructions contient l'invite système que vous testez ; elle n'affiche pas les informations de connexion." }
        d: { en: "Compare models runs up to three models side by side; it doesn't display the endpoint or the key.", fr: "Compare models exécute jusqu'à trois modèles côte à côte ; il n'affiche ni le point de terminaison ni la clé." }
    references:
      - title: "Create a project for Microsoft Foundry"
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/create-projects

  # ------------------------------------------------------------------ 3
  - id: ai901-qz-21-03
    objective: "2.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An employee of Contoso uses a chat model to prepare the company newsletter. The prompt *Write about our new bike* returns a long, generic text. The employee needs a short text aimed at a specific audience, in a format that can be pasted into the newsletter as is.

        Which user prompt should the employee send instead?
      fr: |
        Un employé de Contoso utilise un modèle de conversation pour préparer la lettre d'information de l'entreprise. L'invite *Write about our new bike* renvoie un texte long et générique. L'employé a besoin d'un texte court destiné à un public précis, dans un format qui peut être collé tel quel dans la lettre d'information.

        Quelle invite utilisateur l'employé doit-il envoyer à la place ?
    body:
      options:
        - { id: a, text: { en: "Write a lot about our new bike, with as many details as you can, so that nothing is missing.", fr: "Écris beaucoup sur notre nouveau vélo, avec autant de détails que possible, pour que rien ne manque." } }
        - { id: b, text: { en: "Write about our new bike again, but this time make the text better and more pleasant to read.", fr: "Écris de nouveau sur notre nouveau vélo, mais cette fois rends le texte meilleur et plus agréable à lire." } }
        - { id: c, text: { en: "Write about our new bike for everyone who might buy it, in whatever format you think is best.", fr: "Écris sur notre nouveau vélo pour tous ceux qui pourraient l'acheter, dans le format qui te semble le meilleur." } }
        - { id: d, text: { en: "Write a 100-word description of the Contoso E2 e-bike for daily commuters, as three bullet points.", fr: "Écris une description de 100 mots du vélo électrique Contoso E2 pour les navetteurs quotidiens, en trois puces." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A clear and specific user prompt states the task explicitly, adds context such as the topic and the audience, and asks for a structure. This prompt names the product, the audience and the length, and asks for bullet points, which reduces interpretation and gives a short text in the required format.
        fr: |
          Une invite utilisateur claire et précise énonce la tâche explicitement, ajoute du contexte comme le sujet et le public, et demande une structure. Cette invite nomme le produit, le public et la longueur, et demande des puces, ce qui réduit l'interprétation et donne un texte court au format requis.
      options:
        a: { en: "Asking for as many details as possible makes the text longer, and the prompt still gives no audience or format.", fr: "Demander autant de détails que possible rend le texte plus long, et l'invite ne donne toujours ni public ni format." }
        b: { en: "Better and more pleasant are vague: the prompt adds no context, no length and no structure.", fr: "Meilleur et plus agréable sont vagues : l'invite n'ajoute ni contexte, ni longueur, ni structure." }
        c: { en: "Everyone isn't a specific audience, and leaving the format to the model doesn't give a text that can be pasted as is.", fr: "Tout le monde n'est pas un public précis, et laisser le format au modèle ne donne pas un texte qui peut être collé tel quel." }
    references:
      - title: "Prompt engineering techniques"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering

  # ------------------------------------------------------------------ 4
  - id: ai901-qz-21-04
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        The HR team of Northwind Traders prototypes an assistant on a gpt-4.1-mini deployment. The team has written its instructions and will select **Save as agent** under the name **hr-helper**. Three internal applications will then call hr-helper.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe RH de Northwind Traders met au point un prototype d'assistant sur un déploiement gpt-4.1-mini. L'équipe a écrit ses instructions et va sélectionner **Save as agent** sous le nom **hr-helper**. Trois applications internes appelleront ensuite hr-helper.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The three applications get the same behavior from hr-helper without sending its instructions in their requests.", fr: "Les trois applications obtiennent le même comportement de hr-helper sans envoyer ses instructions dans leurs requêtes." }
        - id: s2
          text: { en: "Adding the sentence *Search the web when you need recent information* to the instructions lets hr-helper search the web.", fr: "Ajouter la phrase *Search the web when you need recent information* aux instructions permet à hr-helper de chercher sur le web." }
        - id: s3
          text: { en: "When you upload a file as knowledge, the portal indexes the file and attaches the index to hr-helper.", fr: "Quand vous chargez un fichier comme connaissance, le portail indexe le fichier et attache l'index à hr-helper." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A saved agent packages a model, instructions and tools, so every application that calls it gets the same behavior. Instructions only describe behavior: the ability to search the web comes from the **Web search** tool added under **Tools**. Knowledge is ingested and indexed, and the agent searches the index to ground its answers.
        fr: |
          Un agent enregistré regroupe un modèle, des instructions et des outils : toute application qui l'appelle obtient donc le même comportement. Les instructions ne font que décrire le comportement : la capacité de chercher sur le web vient de l'outil **Web search** ajouté sous **Tools**. Les connaissances sont ingérées et indexées, et l'agent cherche dans l'index pour ancrer ses réponses.
      options:
        s2: { en: "Changing the instructions alone gives the agent no tool; you must add the Web search tool for the agent to search the web.", fr: "Modifier seulement les instructions ne donne aucun outil à l'agent ; vous devez ajouter l'outil Web search pour que l'agent cherche sur le web." }
    references:
      - title: "Creating an agent"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
      - title: "Microsoft Foundry Playgrounds"
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds

  # ------------------------------------------------------------------ 5
  - id: ai901-qz-21-05
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A chat client creates an `AIProjectClient` object with the project endpoint and `DefaultAzureCredential()`, obtains an OpenAI-compatible client with `get_openai_client()`, and calls `responses.create(model="faq-chat", input=...)`. The deployment is named faq-chat.

        For a test computer that can't sign in to Azure, a developer rewrites the client to create the `OpenAI` client of the `openai` package directly, with `base_url` set to the Azure OpenAI endpoint and `api_key` set to the key of the resource.

        What must change in the `responses.create` call?
      fr: |
        Un client de conversation crée un objet `AIProjectClient` avec le point de terminaison du projet et `DefaultAzureCredential()`, obtient un client compatible OpenAI avec `get_openai_client()`, et appelle `responses.create(model="faq-chat", input=...)`. Le déploiement s'appelle faq-chat.

        Pour un ordinateur de test qui ne peut pas se connecter à Azure, un développeur réécrit le client pour créer directement le client `OpenAI` du package `openai`, avec `base_url` égal au point de terminaison Azure OpenAI et `api_key` égal à la clé de la ressource.

        Que faut-il modifier dans l'appel à `responses.create` ?
    body:
      options:
        - { id: a, text: { en: "The `model` argument must contain the model name instead of the deployment name.", fr: "L'argument `model` doit contenir le nom du modèle au lieu du nom du déploiement." } }
        - { id: b, text: { en: "The `api_key` value must also be passed to `responses.create` in each request.", fr: "La valeur `api_key` doit aussi être passée à `responses.create` dans chaque requête." } }
        - { id: c, text: { en: "Nothing: the call stays the same, and only the creation of the client changes.", fr: "Rien : l'appel reste le même, et seule la création du client change." } }
        - { id: d, text: { en: "The `input` argument must hold a list of messages instead of a simple string.", fr: "L'argument `input` doit contenir une liste de messages au lieu d'une simple chaîne." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Both approaches give an OpenAI-compatible client that calls the deployment through the Responses API. With the `openai` package, the client is created with `base_url` and `api_key` instead of the project endpoint and a credential, but the call to `responses.create`, with the deployment name in `model` and the prompt in `input`, is the same.
        fr: |
          Les deux approches donnent un client compatible OpenAI qui appelle le déploiement via l'API Responses. Avec le package `openai`, le client est créé avec `base_url` et `api_key` au lieu du point de terminaison du projet et d'informations d'identification, mais l'appel à `responses.create`, avec le nom du déploiement dans `model` et l'invite dans `input`, est le même.
      options:
        a: { en: "The `model` argument always takes the deployment name, whichever client calls the deployment.", fr: "L'argument `model` prend toujours le nom du déploiement, quel que soit le client qui appelle le déploiement." }
        b: { en: "The key is given once, when the `OpenAI` client is created; the client then authenticates every request.", fr: "La clé est donnée une fois, à la création du client `OpenAI` ; le client authentifie ensuite chaque requête." }
        d: { en: "The `input` argument accepts a simple string or a list of messages with roles, with both kinds of client.", fr: "L'argument `input` accepte une simple chaîne ou une liste de messages avec des rôles, avec les deux types de client." }
    references:
      - title: "Using a generative AI model"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
      - title: "Quickstart: Get started with Microsoft Foundry SDK"
        url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code

  # ------------------------------------------------------------------ 6
  - id: ai901-qz-21-06
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso Bikes uses a support assistant based on a model deployed in Microsoft Foundry. The system prompt is *You are a support assistant for Contoso Bikes. Be friendly.* With each request, the application adds the text of the return policy to the prompt.

        Users report two problems:

        - The assistant gives cooking recipes when it's asked for them.
        - When the return policy doesn't cover a case, the assistant invents a return deadline.

        Which two sentences should you add to the system prompt? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso Bikes utilise un assistant de support basé sur un modèle déployé dans Microsoft Foundry. L'invite système est *You are a support assistant for Contoso Bikes. Be friendly.* À chaque requête, l'application ajoute à l'invite le texte de la politique de retour.

        Les utilisateurs signalent deux problèmes :

        - L'assistant donne des recettes de cuisine quand on lui en demande.
        - Quand la politique de retour ne couvre pas un cas, l'assistant invente un délai de retour.

        Quelles sont les deux phrases à ajouter à l'invite système ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Always find an answer for the customer, even when the information is incomplete.", fr: "Trouvez toujours une réponse pour le client, même quand les informations sont incomplètes." } }
        - { id: b, text: { en: "Answer only questions about orders, returns and repairs, and decline other topics.", fr: "Répondez uniquement aux questions sur les commandes, les retours et les réparations, et refusez les autres sujets." } }
        - { id: c, text: { en: "Reply in three bullet points at most, and use a friendly and simple tone.", fr: "Répondez en trois puces au maximum, et utilisez un ton amical et simple." } }
        - { id: d, text: { en: "If the return policy doesn't contain the answer, say that you don't know.", fr: "Si la politique de retour ne contient pas la réponse, dites que vous ne savez pas." } }
        - { id: e, text: { en: "Repeat the question of the customer at the start of every answer.", fr: "Répétez la question du client au début de chaque réponse." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Rules that must hold for the whole conversation go in the system prompt. Limiting the scope makes the model decline off-topic requests such as recipes. Giving the model an out, an alternative answer when the supplied text doesn't contain the information, helps it avoid inventing a deadline.
        fr: |
          Les règles qui doivent tenir pendant toute la conversation vont dans l'invite système. Limiter le périmètre conduit le modèle à refuser les demandes hors sujet comme les recettes. Donner au modèle une porte de sortie, une réponse de repli quand le texte fourni ne contient pas l'information, l'aide à ne pas inventer de délai.
      options:
        a: { en: "Asking for an answer at any cost pushes the model to fill gaps, which makes invented deadlines more likely.", fr: "Exiger une réponse à tout prix pousse le modèle à combler les lacunes, ce qui rend les délais inventés plus probables." }
        c: { en: "The format and the tone don't limit the topics and don't stop the model from inventing a deadline.", fr: "Le format et le ton ne limitent pas les sujets et n'empêchent pas le modèle d'inventer un délai." }
        e: { en: "Repeating the question changes the layout of the answers but solves neither problem.", fr: "Répéter la question change la présentation des réponses mais ne résout aucun des deux problèmes." }
    references:
      - title: "Prompt engineering techniques"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
      - title: "Using a generative AI model"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models

  # ------------------------------------------------------------------ 7
  - id: ai901-qz-21-07
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        In the model playground of the Foundry portal, you test a deployment named **support-chat**. You write instructions that require formal answers of at most three sentences, and you set the temperature to 0.2. The answers meet the requirements.

        A developer then writes an application that sends the same user prompts to support-chat through the Responses API. The answers of the application are long and informal.

        What explains the difference?
      fr: |
        Dans le terrain de jeu de modèles du portail Foundry, vous testez un déploiement nommé **support-chat**. Vous écrivez des instructions qui exigent des réponses formelles de trois phrases au maximum, et vous réglez la température sur 0,2. Les réponses satisfont les exigences.

        Un développeur écrit ensuite une application qui envoie les mêmes invites utilisateur à support-chat via l'API Responses. Les réponses de l'application sont longues et informelles.

        Qu'est-ce qui explique la différence ?
    body:
      options:
        - { id: a, text: { en: "The model must be deployed again after the playground changes, so that applications receive them.", fr: "Le modèle doit être déployé de nouveau après les modifications du terrain de jeu, pour que les applications les reçoivent." } }
        - { id: b, text: { en: "The Responses API ignores system instructions, and only the playground can apply them to a deployment.", fr: "L'API Responses ignore les instructions système, et seul le terrain de jeu peut les appliquer à un déploiement." } }
        - { id: c, text: { en: "The application must authenticate with the API key, because Entra ID requests use default parameters.", fr: "L'application doit s'authentifier avec la clé d'API, car les requêtes Entra ID utilisent les paramètres par défaut." } }
        - { id: d, text: { en: "The playground settings aren't stored in the deployment, so the application must send them in its requests.", fr: "Les paramètres du terrain de jeu ne sont pas stockés dans le déploiement : l'application doit donc les envoyer dans ses requêtes." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          In a chat client, the instructions and the parameter values are sent by the client in each request; the deployment doesn't keep what you typed in the playground. The code view of the playground provides code that calls the deployment with the same instructions and parameters, which the developer can reuse as a starting point.
        fr: |
          Dans un client de conversation, les instructions et les valeurs des paramètres sont envoyées par le client dans chaque requête ; le déploiement ne conserve pas ce que vous avez saisi dans le terrain de jeu. La vue du code du terrain de jeu fournit un code qui appelle le déploiement avec les mêmes instructions et paramètres, que le développeur peut réutiliser comme point de départ.
      options:
        a: { en: "Changing instructions or parameters in the playground requires no new deployment, and a new deployment wouldn't store them either.", fr: "Modifier des instructions ou des paramètres dans le terrain de jeu n'exige aucun nouveau déploiement, et un nouveau déploiement ne les stockerait pas non plus." }
        b: { en: "The Responses API accepts a system message in `input`; the playground code itself calls the deployment through this API.", fr: "L'API Responses accepte un message système dans `input` ; le code du terrain de jeu appelle lui-même le déploiement via cette API." }
        c: { en: "The authentication method doesn't change how the model answers; it only proves who calls the deployment.", fr: "La méthode d'authentification ne change pas la façon dont le modèle répond ; elle prouve seulement qui appelle le déploiement." }
    references:
      - title: "Using a generative AI model"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/3-using-generative-ai-models
      - title: "Microsoft Foundry Playgrounds"
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/concept-playgrounds

  # ------------------------------------------------------------------ 8
  - id: ai901-qz-21-08
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware builds an agent named **people-assistant** in the Foundry portal. The agent must meet four requirements, described in the answer area.

        What should you configure for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware crée un agent nommé **people-assistant** dans le portail Foundry. L'agent doit satisfaire quatre exigences, décrites dans la zone de réponse.

        Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: instr, text: { en: "The instructions of the agent", fr: "Les instructions de l'agent" } }
        - { id: know, text: { en: "A file uploaded as knowledge", fr: "Un fichier chargé comme connaissance" } }
        - { id: web, text: { en: "The Web search tool", fr: "L'outil Web search" } }
        - { id: code, text: { en: "The Code interpreter tool", fr: "L'outil Code interpreter" } }
        - { id: mcp, text: { en: "An MCP server added as a tool", fr: "Un serveur MCP ajouté comme outil" } }
        - { id: temp, text: { en: "A lower temperature", fr: "Une température plus basse" } }
      targets:
        - { id: t1, text: { en: "Decline every question that isn't about human resources.", fr: "Refuser toute question qui ne porte pas sur les ressources humaines." } }
        - { id: t2, text: { en: "Answer from the 2026 employee handbook, and cite the handbook in each answer.", fr: "Répondre à partir du manuel des employés 2026, et citer le manuel dans chaque réponse." } }
        - { id: t3, text: { en: "Compute the remaining leave of each employee from an uploaded CSV file, and draw a chart.", fr: "Calculer les congés restants de chaque employé à partir d'un fichier CSV chargé, et tracer un graphique." } }
        - { id: t4, text: { en: "Report the public holidays that governments announced this week.", fr: "Indiquer les jours fériés que les gouvernements ont annoncés cette semaine." } }
    answer:
      mapping: { t1: instr, t2: know, t3: code, t4: web }
    explanation:
      correct:
        en: |
          Scope rules are behavior, so they go in the instructions, the system prompt of the agent. Knowledge is context: the handbook is indexed, retrieved to ground the answers, and cited. Tools are actions: Code interpreter runs code for data analysis and charts, and Web search retrieves current public information with citations.
        fr: |
          Les règles de périmètre relèvent du comportement : elles vont dans les instructions, l'invite système de l'agent. Les connaissances sont du contexte : le manuel est indexé, récupéré pour ancrer les réponses, puis cité. Les outils sont des actions : Code interpreter exécute du code pour l'analyse de données et les graphiques, et Web search récupère des informations publiques actuelles avec des citations.
      options:
        mcp: { en: "An MCP server exposes the operations of an external system; no requirement calls such a system.", fr: "Un serveur MCP expose les opérations d'un système externe ; aucune exigence n'appelle un tel système." }
        temp: { en: "The temperature controls randomness; it neither limits topics nor gives the agent content or actions.", fr: "La température contrôle le caractère aléatoire ; elle ne limite pas les sujets et ne donne à l'agent ni contenu ni actions." }
        know: { en: "For this week's announcements, an uploaded file is a fixed copy that can't contain news published after the upload.", fr: "Pour les annonces de cette semaine, un fichier chargé est une copie figée qui ne peut pas contenir les nouvelles publiées après le chargement." }
    references:
