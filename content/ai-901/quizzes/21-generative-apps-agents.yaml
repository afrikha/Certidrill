  # ------------------------------------------------------------------ 9
  - id: ai901-qz-21-09
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The Foundry project **hr-portal** of Adatum contains a deployment named **hr-chat** of the gpt-4.1-mini model. A developer runs the following chat client on a workstation. The variable `question` holds the text that the user typed.

        ```text
        from azure.identity import DefaultAzureCredential
        from azure.ai.projects import AIProjectClient

        project = AIProjectClient(
            endpoint="https://adatum-ai.services.ai.azure.com/api/projects/hr-portal",
            credential=DefaultAzureCredential(),
        )
        client = project.get_openai_client()

        first = client.responses.create(
            model="hr-chat",
            input=[
                {"role": "system", "content": "Answer HR questions in two sentences."},
                {"role": "user", "content": question},
            ],
        )
        print(first.output_text)
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le projet Foundry **hr-portal** d'Adatum contient un déploiement nommé **hr-chat** du modèle gpt-4.1-mini. Un développeur exécute le client de conversation suivant sur un poste de travail. La variable `question` contient le texte que l'utilisateur a saisi.

        ```text
        from azure.identity import DefaultAzureCredential
        from azure.ai.projects import AIProjectClient

        project = AIProjectClient(
            endpoint="https://adatum-ai.services.ai.azure.com/api/projects/hr-portal",
            credential=DefaultAzureCredential(),
        )
        client = project.get_openai_client()

        first = client.responses.create(
            model="hr-chat",
            input=[
                {"role": "system", "content": "Answer HR questions in two sentences."},
                {"role": "user", "content": question},
            ],
        )
        print(first.output_text)
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The client authenticates with an API key, which must be stored in an environment variable of the workstation.", fr: "Le client s'authentifie avec une clé d'API, qui doit être stockée dans une variable d'environnement du poste de travail." }
        - id: s2
          text: { en: "The value hr-chat is correct for the `model` argument, even though the deployed model is gpt-4.1-mini.", fr: "La valeur hr-chat est correcte pour l'argument `model`, même si le modèle déployé est gpt-4.1-mini." }
        - id: s3
          text: { en: "If the client then sends a second request whose `input` contains only a follow-up question, the model interprets it in the context of the first exchange.", fr: "Si le client envoie ensuite une deuxième requête dont l'`input` ne contient qu'une question de suivi, le modèle l'interprète dans le contexte du premier échange." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          `DefaultAzureCredential()` authenticates with Microsoft Entra ID, for example after `az login`; no key appears in the code. The `model` argument takes the deployment name, here hr-chat. Each request stands alone: a follow-up is understood in context only if the request carries the earlier exchange, for example the history in `input` or the `previous_response_id` of the first response.
        fr: |
          `DefaultAzureCredential()` authentifie avec Microsoft Entra ID, par exemple après `az login` ; aucune clé n'apparaît dans le code. L'argument `model` prend le nom du déploiement, ici hr-chat. Chaque requête est indépendante : une question de suivi n'est comprise dans son contexte que si la requête transmet l'échange précédent, par exemple l'historique dans `input` ou le `previous_response_id` de la première réponse.
      options:
        s1: { en: "The client uses `DefaultAzureCredential()`, which signs in with a Microsoft Entra identity; it reads no key.", fr: "Le client utilise `DefaultAzureCredential()`, qui se connecte avec une identité Microsoft Entra ; il ne lit aucune clé." }
        s3: { en: "The second request carries neither the history nor a reference to the first response, so the model has no context for the follow-up.", fr: "La deuxième requête ne transmet ni l'historique ni une référence à la première réponse : le modèle n'a donc aucun contexte pour la question de suivi." }
    references:
      - title: "Quickstart: Get started with Microsoft Foundry SDK"
        url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
      - title: "Build with agents, conversations, and responses"
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components

  # ------------------------------------------------------------------ 10
  - id: ai901-qz-21-10
    objective: "2.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank saved an agent named **policy-agent** in its Foundry project. The agent uses the deployment **gpt-mini-prod**, has instructions, and has the file credit-policy.pdf as knowledge. In the agents playground, its answers cite credit-policy.pdf.

        A developer writes the following client and copies the instructions of the agent into the system message. `project` is an `AIProjectClient` object connected to the project.

        ```text
        openai_client = project.get_openai_client()

        response = openai_client.responses.create(
            model="gpt-mini-prod",
            input=[
                {"role": "system", "content": "<instructions of policy-agent>"},
                {"role": "user", "content": question},
            ],
        )
        print(response.output_text)
        ```

        The answers of the client are generic and never cite credit-policy.pdf. The client must answer as policy-agent does in the playground.

        What should you change in the client?
      fr: |
        Woodgrove Bank a enregistré un agent nommé **policy-agent** dans son projet Foundry. L'agent utilise le déploiement **gpt-mini-prod**, a des instructions et a le fichier credit-policy.pdf comme connaissance. Dans le terrain de jeu des agents, ses réponses citent credit-policy.pdf.

        Un développeur écrit le client suivant et copie les instructions de l'agent dans le message système. `project` est un objet `AIProjectClient` connecté au projet.

        ```text
        openai_client = project.get_openai_client()

        response = openai_client.responses.create(
            model="gpt-mini-prod",
            input=[
                {"role": "system", "content": "<instructions of policy-agent>"},
                {"role": "user", "content": question},
            ],
        )
        print(response.output_text)
        ```

        Les réponses du client sont génériques et ne citent jamais credit-policy.pdf. Le client doit répondre comme le fait policy-agent dans le terrain de jeu.

        Que devez-vous modifier dans le client ?
    body:
      options:
        - { id: a, text: { en: "Add the name credit-policy.pdf to the system message, so that the model searches the file.", fr: "Ajouter le nom credit-policy.pdf au message système, pour que le modèle cherche dans le fichier." } }
        - { id: b, text: { en: "Raise the max output tokens of the request, so that the model has room to quote the policy.", fr: "Relever le nombre maximal de jetons de sortie de la requête, pour que le modèle ait la place de citer la politique." } }
        - { id: c, text: { en: "Create a second deployment of the model for the client, and save it as another agent.", fr: "Créer un deuxième déploiement du modèle pour le client, et l'enregistrer comme un autre agent." } }
        - { id: d, text: { en: "Retrieve policy-agent by name, and reference it in the request instead of the deployment.", fr: "Récupérer policy-agent par son nom, et le référencer dans la requête au lieu du déploiement." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The request names a model deployment, so it's a chat client: it gets only what it sends, and the knowledge of the agent isn't used. An agent client retrieves the agent by its name, with `agents.get(agent_name=...)`, and references it in the request; the agent then answers with its own model, instructions, tools and knowledge, and the system message no longer needs to be copied.
        fr: |
          La requête nomme un déploiement de modèle : c'est donc un client de conversation, qui n'obtient que ce qu'il envoie, et les connaissances de l'agent ne sont pas utilisées. Un client d'agent récupère l'agent par son nom, avec `agents.get(agent_name=...)`, et le référence dans la requête ; l'agent répond alors avec ses propres modèle, instructions, outils et connaissances, et le message système n'a plus besoin d'être copié.
      options:
        a: { en: "Naming a file in the prompt gives the model no access to it; the knowledge index is used only when the request targets the agent.", fr: "Nommer un fichier dans l'invite ne donne au modèle aucun accès à ce fichier ; l'index des connaissances n'est utilisé que quand la requête cible l'agent." }
        b: { en: "Max output tokens caps the length of the answer; it gives the model no access to the policy.", fr: "Le nombre maximal de jetons de sortie plafonne la longueur de la réponse ; il ne donne au modèle aucun accès à la politique." }
        c: { en: "A new deployment and a new agent add nothing while the client still names a deployment instead of an agent.", fr: "Un nouveau déploiement et un nouvel agent n'apportent rien tant que le client nomme un déploiement au lieu d'un agent." }
    references:
      - title: "Creating an agent"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
      - title: "Build with agents, conversations, and responses"
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components
