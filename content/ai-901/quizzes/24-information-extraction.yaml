chapter: 24-information-extraction
questions:
  # ------------------------------------------------------------------ 1
  - id: ai901-qz-24-01
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In Azure Content Understanding in Foundry Tools, what is a field?
      fr: |
        Dans Azure Content Understanding dans Foundry Tools, qu'est-ce qu'un champ ?
    body:
      options:
        - { id: a, text: { en: "A named value of the result, with a type and, for documents, a confidence score", fr: "Une valeur nommée du résultat, avec un type et, pour les documents, un score de confiance" } }
        - { id: b, text: { en: "The unit that takes the content, applies the analysis and returns the result", fr: "L'unité qui prend le contenu, applique l'analyse et renvoie le résultat" } }
        - { id: c, text: { en: "The list of the values to extract from the content, and how they are structured", fr: "La liste des valeurs à extraire du contenu, et la façon dont elles sont structurées" } }
        - { id: d, text: { en: "The version of the content in Markdown that the analysis returns with the JSON", fr: "La version du contenu en Markdown que l'analyse renvoie avec le JSON" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A field is one named value in the result of an analysis, such as `InvoiceNumber` or `Total`, with its type and its value. For documents, each field also carries a confidence score between 0 and 1. The schema of the analyzer lists the fields to fill.
        fr: |
          Un champ est une valeur nommée dans le résultat d'une analyse, comme `InvoiceNumber` ou `Total`, avec son type et sa valeur. Pour les documents, chaque champ porte aussi un score de confiance entre 0 et 1. Le schéma de l'analyseur liste les champs à remplir.
      options:
        b: { en: "This describes an analyzer, prebuilt or custom, which applies the same logic to every file.", fr: "Cela décrit un analyseur, prédéfini ou personnalisé, qui applique la même logique à chaque fichier." }
        c: { en: "This describes the schema: it lists the fields and their structure, but it isn't a value of the result.", fr: "Cela décrit le schéma : il liste les champs et leur structure, mais ce n'est pas une valeur du résultat." }
        d: { en: "This is the `markdown` part of the result: the text or transcript of the content, not a named value.", fr: "C'est la partie `markdown` du résultat : le texte ou la transcription du contenu, pas une valeur nommée." }
    references:
      - title: "Extract information from documents"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents

  # ------------------------------------------------------------------ 2
  - id: ai901-qz-24-02
    objective: "2.4.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys analyzes its training videos by using a video analyzer of Azure Content Understanding in Foundry Tools. The result must indicate the moments at which the camera cuts from one scene to the next.

        Which content extraction capability provides this information?
      fr: |
        Tailspin Toys analyse ses vidéos de formation à l'aide d'un analyseur vidéo d'Azure Content Understanding dans Foundry Tools. Le résultat doit indiquer les moments où la caméra passe d'une scène à la suivante.

        Quelle fonctionnalité d'extraction de contenu fournit cette information ?
    body:
      options:
        - { id: a, text: { en: "Key frame extraction", fr: "Extraction des images clés" } }
        - { id: b, text: { en: "Speaker diarization", fr: "Séparation des interlocuteurs" } }
        - { id: c, text: { en: "Shot detection", fr: "Détection des plans" } }
        - { id: d, text: { en: "Speech transcription", fr: "Transcription de la parole" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Content extraction of a video produces the transcript of the speech, key frames and shot detection. Shot detection returns the boundaries of each camera shot, that is, the moments at which the video cuts to another shot. It requires no schema.
        fr: |
          L'extraction de contenu d'une vidéo produit la transcription de la parole, des images clés et la détection des plans. La détection des plans renvoie les limites de chaque plan, c'est-à-dire les moments où la vidéo passe à un autre plan. Elle ne demande aucun schéma.
      options:
        a: { en: "Key frames are images taken from each shot so that the model can generate the fields; they don't mark where a shot starts or ends.", fr: "Les images clés sont des images prises dans chaque plan pour que le modèle génère les champs ; elles ne marquent pas où un plan commence ou finit." }
        b: { en: "Diarization attributes each part of the transcript to a speaker; it says nothing about the camera.", fr: "La séparation des interlocuteurs attribue chaque partie de la transcription à un interlocuteur ; elle ne dit rien de la caméra." }
        d: { en: "The transcript holds what is said, with timestamps of the speech, not the changes of scene.", fr: "La transcription contient ce qui est dit, avec l'horodatage de la parole, pas les changements de scène." }
    references:
      - title: "Azure Content Understanding in Foundry Tools video overview"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview

  # ------------------------------------------------------------------ 3
  - id: ai901-qz-24-03
    objective: "2.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys installs cameras above the parking lot of its warehouse. For each photo, Wingtip needs the number of free parking spaces and whether a vehicle blocks the exit gate, stored as two separate values in a database.

        What should Wingtip use in Azure Content Understanding in Foundry Tools?
      fr: |
        Wingtip Toys installe des caméras au-dessus du parking de son entrepôt. Pour chaque photo, Wingtip a besoin du nombre de places de stationnement libres et de savoir si un véhicule bloque la sortie, stockés comme deux valeurs distinctes dans une base de données.

        Que doit utiliser Wingtip dans Azure Content Understanding dans Foundry Tools ?
    body:
      options:
        - { id: a, text: { en: "The `prebuilt-imageSearch` analyzer, which writes a description of each photo", fr: "L'analyseur `prebuilt-imageSearch`, qui rédige une description de chaque photo" } }
        - { id: b, text: { en: "The `prebuilt-read` analyzer, which returns the text detected in each photo", fr: "L'analyseur `prebuilt-read`, qui renvoie le texte détecté dans chaque photo" } }
        - { id: c, text: { en: "The `prebuilt-layout` analyzer, which returns the structure of each photo", fr: "L'analyseur `prebuilt-layout`, qui renvoie la structure de chaque photo" } }
        - { id: d, text: { en: "A custom analyzer whose schema defines one field for each of the values", fr: "Un analyseur personnalisé dont le schéma définit un champ pour chacune des valeurs" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          For an image, the analyzer looks at the picture itself: you define a schema whose fields have a name, a description and a type, and a generative model fills them in from what it sees. A field for the number of free spaces and a field for the blocked exit return the two values that Wingtip stores, in the same JSON structure for every photo.
        fr: |
          Pour une image, l'analyseur regarde l'image elle-même : vous définissez un schéma dont les champs ont un nom, une description et un type, et un modèle génératif les remplit d'après ce qu'il voit. Un champ pour le nombre de places libres et un champ pour la sortie bloquée renvoient les deux valeurs que Wingtip stocke, dans la même structure JSON pour chaque photo.
      options:
        a: { en: "`prebuilt-imageSearch` returns a description to make images searchable, not the two named values that the database needs.", fr: "`prebuilt-imageSearch` renvoie une description pour rendre les images interrogeables, pas les deux valeurs nommées dont la base de données a besoin." }
        b: { en: "`prebuilt-read` returns written text by OCR; a parking lot photo shows no text that holds these values.", fr: "`prebuilt-read` renvoie le texte écrit par OCR ; une photo de parking ne montre aucun texte qui contienne ces valeurs." }
        c: { en: "`prebuilt-layout` returns the text of a document with its paragraphs and tables; it doesn't count vehicles or spaces.", fr: "`prebuilt-layout` renvoie le texte d'un document avec ses paragraphes et ses tableaux ; il ne compte ni les véhicules ni les places." }
    references:
      - title: "Azure Content Understanding in Foundry Tools image overview"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview

  # ------------------------------------------------------------------ 4
  - id: ai901-qz-24-04
    objective: "2.4.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware created a custom analyzer named `warrantyClaims` in its Foundry resource and tested it in the Content Understanding playground. A Python application of Proseware analyzes invoices: it calls `begin_analyze` with `analyzer_id="prebuilt-invoice"` and the URL of each file, then calls `poller.result()`.

        The application must now process warranty claims with the custom analyzer.

        What should you change in the code?
      fr: |
        Proseware a créé un analyseur personnalisé nommé `warrantyClaims` dans sa ressource Foundry et l'a testé dans le terrain de jeu Content Understanding. Une application Python de Proseware analyse des factures : elle appelle `begin_analyze` avec `analyzer_id="prebuilt-invoice"` et l'URL de chaque fichier, puis appelle `poller.result()`.

        L'application doit maintenant traiter des demandes de garantie avec l'analyseur personnalisé.

        Que devez-vous modifier dans le code ?
    body:
      options:
        - { id: a, text: { en: "Pass the schema of `warrantyClaims` in the `inputs` argument of the call.", fr: "Passer le schéma de `warrantyClaims` dans l'argument `inputs` de l'appel." } }
        - { id: b, text: { en: "Set `analyzer_id` to `warrantyClaims` and keep the rest of the code.", fr: "Définir `analyzer_id` sur `warrantyClaims` et conserver le reste du code." } }
        - { id: c, text: { en: "Create a second client with the endpoint of the `warrantyClaims` analyzer.", fr: "Créer un second client avec le point de terminaison de l'analyseur `warrantyClaims`." } }
        - { id: d, text: { en: "Install a separate SDK package for custom analyzers and use its client.", fr: "Installer un package de SDK distinct pour les analyseurs personnalisés et utiliser son client." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `analyzer_id` takes either a prebuilt identifier or the name of a custom analyzer. The schema is stored in the analyzer itself, so the call, the poller and the loop over `result.contents` stay the same: only the analyzer name and the files change.
        fr: |
          `analyzer_id` accepte soit un identificateur prédéfini, soit le nom d'un analyseur personnalisé. Le schéma est stocké dans l'analyseur lui-même : l'appel, le poller et la boucle sur `result.contents` restent identiques, seuls le nom de l'analyseur et les fichiers changent.
      options:
        a: { en: "`inputs` holds the content to analyze, such as the URL of a file; the schema belongs to the analyzer, not to each call.", fr: "`inputs` contient le contenu à analyser, comme l'URL d'un fichier ; le schéma appartient à l'analyseur, pas à chaque appel." }
        c: { en: "An analyzer has no endpoint of its own: the client uses the endpoint of the Foundry resource for every analyzer.", fr: "Un analyseur n'a pas de point de terminaison propre : le client utilise le point de terminaison de la ressource Foundry pour tous les analyseurs." }
        d: { en: "The `azure-ai-contentunderstanding` package and its `ContentUnderstandingClient` run prebuilt and custom analyzers alike.", fr: "Le package `azure-ai-contentunderstanding` et son `ContentUnderstandingClient` exécutent aussi bien les analyseurs prédéfinis que personnalisés." }
    references:
      - title: "Quickstart: Azure Content Understanding in Foundry Tools"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
      - title: "Azure AI Content Understanding client library for Python"
        url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme

  # ------------------------------------------------------------------ 5
  - id: ai901-qz-24-05
    objective: "2.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam Insurance analyzes recorded support calls by using Azure Content Understanding in Foundry Tools. For each call, Fabrikam needs the sentiment of the call, a summary, and the claim number that the customer gives during the call, each as a separate value.

        What should Fabrikam use?
      fr: |
        Fabrikam Insurance analyse des appels d'assistance enregistrés à l'aide d'Azure Content Understanding dans Foundry Tools. Pour chaque appel, Fabrikam a besoin du sentiment de l'appel, d'un résumé et du numéro de sinistre que le client donne pendant l'appel, chacun sous forme de valeur distincte.

        Que doit utiliser Fabrikam ?
    body:
      options:
        - { id: a, text: { en: "A custom audio analyzer whose schema lists the three values", fr: "Un analyseur audio personnalisé dont le schéma liste les trois valeurs" } }
        - { id: b, text: { en: "The `prebuilt-callCenter` analyzer, without any change", fr: "L'analyseur `prebuilt-callCenter`, sans aucune modification" } }
        - { id: c, text: { en: "The `prebuilt-audioSearch` analyzer, without any change", fr: "L'analyseur `prebuilt-audioSearch`, sans aucune modification" } }
        - { id: d, text: { en: "Speech recognition in Azure Speech in Foundry Tools", fr: "La reconnaissance vocale d'Azure Speech dans Foundry Tools" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The claim number is specific to Fabrikam: no prebuilt analyzer returns it. A custom audio analyzer applies a schema to the transcript of each call, and a generative model fills the sentiment, the summary and the claim number as separate fields, in addition to the transcript.
        fr: |
          Le numéro de sinistre est propre à Fabrikam : aucun analyseur prédéfini ne le renvoie. Un analyseur audio personnalisé applique un schéma à la transcription de chaque appel, et un modèle génératif remplit le sentiment, le résumé et le numéro de sinistre dans des champs distincts, en plus de la transcription.
      options:
        b: { en: "`prebuilt-callCenter` returns the agent and customer roles, a summary, the sentiment and topics, but no claim number field.", fr: "`prebuilt-callCenter` renvoie les rôles agent et client, un résumé, le sentiment et les sujets, mais aucun champ de numéro de sinistre." }
        c: { en: "`prebuilt-audioSearch` returns a transcript and a summary only: neither the sentiment nor the claim number.", fr: "`prebuilt-audioSearch` renvoie seulement une transcription et un résumé : ni le sentiment ni le numéro de sinistre." }
        d: { en: "Speech recognition returns a transcript; it doesn't return a summary, a sentiment or a claim number as separate fields.", fr: "La reconnaissance vocale renvoie une transcription ; elle ne renvoie ni résumé, ni sentiment, ni numéro de sinistre dans des champs distincts." }
    references:
      - title: "Azure Content Understanding in Foundry Tools audio overview"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/audio/overview

  # ------------------------------------------------------------------ 6
  - id: ai901-qz-24-06
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso Finance processes loan application forms that are specific to the company. An application submits each scanned form to the `prebuilt-layout` analyzer of Azure Content Understanding in Foundry Tools, then uses regular expressions on the Markdown to find the values that follow labels such as "Applicant:".

        Contoso acquires another lender. Its forms print "Name of borrower" instead of "Applicant:", and some values have no label at all. The regular expressions fail on these forms.

        You need to obtain the applicant name, the loan amount and the loan term as named values for both versions of the form. The solution must minimize maintenance.

        What should you do?
      fr: |
        Contoso Finance traite des formulaires de demande de prêt propres à l'entreprise. Une application envoie chaque formulaire numérisé à l'analyseur `prebuilt-layout` d'Azure Content Understanding dans Foundry Tools, puis applique des expressions régulières au Markdown pour trouver les valeurs qui suivent des libellés tels que « Applicant: ».

        Contoso rachète un autre prêteur. Ses formulaires impriment « Name of borrower » au lieu de « Applicant: », et certaines valeurs n'ont aucun libellé. Les expressions régulières échouent sur ces formulaires.

        Vous devez obtenir le nom du demandeur, le montant du prêt et sa durée sous forme de valeurs nommées pour les deux versions du formulaire. La solution doit réduire la maintenance au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace `prebuilt-layout` with `prebuilt-read`, and keep the regular expressions.", fr: "Remplacer `prebuilt-layout` par `prebuilt-read`, et conserver les expressions régulières." } }
        - { id: b, text: { en: "Keep `prebuilt-layout`, and add a regular expression for each label of the new forms.", fr: "Conserver `prebuilt-layout`, et ajouter une expression régulière pour chaque libellé des nouveaux formulaires." } }
        - { id: c, text: { en: "Create a custom analyzer that defines the three fields, and call it instead of `prebuilt-layout`.", fr: "Créer un analyseur personnalisé qui définit les trois champs, et l'appeler à la place de `prebuilt-layout`." } }
        - { id: d, text: { en: "Replace `prebuilt-layout` with `prebuilt-invoice`, which returns named values without a schema.", fr: "Remplacer `prebuilt-layout` par `prebuilt-invoice`, qui renvoie des valeurs nommées sans schéma." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The layout analyzer returns what is written, not what it means, so the application has to find the values itself. A custom analyzer applies its schema semantically: "Applicant:", "Name of borrower" or an unlabeled name at the expected place all fill the same applicant field. One analyzer serves both versions of the form and returns named values, with no expression to maintain; field extraction relies on a generative model deployed in the Foundry resource.
        fr: |
          L'analyseur de disposition renvoie ce qui est écrit, pas ce que cela signifie : l'application doit trouver les valeurs elle-même. Un analyseur personnalisé applique son schéma de façon sémantique : « Applicant: », « Name of borrower » ou un nom sans libellé à l'endroit attendu remplissent tous le même champ du demandeur. Un seul analyseur sert les deux versions du formulaire et renvoie des valeurs nommées, sans expression à maintenir ; l'extraction de champs s'appuie sur un modèle génératif déployé dans la ressource Foundry.
      options:
        a: { en: "`prebuilt-read` returns the text without the structure: the labels still differ and some values still have none.", fr: "`prebuilt-read` renvoie le texte sans la structure : les libellés diffèrent toujours et certaines valeurs n'en ont toujours pas." }
        b: { en: "Each new label adds an expression to maintain, and an expression can't find a value that has no label.", fr: "Chaque nouveau libellé ajoute une expression à maintenir, et une expression ne peut pas trouver une valeur sans libellé." }
        d: { en: "`prebuilt-invoice` returns the fields of an invoice (vendor, dates, items, totals), not those of a loan form.", fr: "`prebuilt-invoice` renvoie les champs d'une facture (fournisseur, dates, articles, totaux), pas ceux d'un formulaire de prêt." }
    references:
      - title: "Extract information from documents"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/2-documents
      - title: "Azure Content Understanding in Foundry Tools prebuilt analyzers"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers

  # ------------------------------------------------------------------ 7
  - id: ai901-qz-24-07
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        At Litware, field technicians take JPEG photos with a mobile app, which sends them to Azure Content Understanding in Foundry Tools. No schema may be defined: every photo goes to a prebuilt analyzer.

        You must route each kind of photo to the analyzer that returns the expected result. To answer, drag the appropriate analyzers to the correct kinds of photos. Each analyzer may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Chez Litware, les techniciens d'intervention prennent des photos JPEG avec une application mobile, qui les envoie à Azure Content Understanding dans Foundry Tools. Aucun schéma ne peut être défini : chaque photo va à un analyseur prédéfini.

        Vous devez diriger chaque type de photo vers l'analyseur qui renvoie le résultat attendu. Pour répondre, faites glisser les analyseurs appropriés vers les types de photos correspondants. Chaque analyseur peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: read, text: "`prebuilt-read`" }
        - { id: layout, text: "`prebuilt-layout`" }
        - { id: receipt, text: "`prebuilt-receipt`" }
        - { id: invoice, text: "`prebuilt-invoice`" }
        - { id: imgsearch, text: "`prebuilt-imageSearch`" }
        - { id: vidsearch, text: "`prebuilt-videoSearch`" }
      targets:
        - { id: t1, text: { en: "Photos of fuel receipts: return the merchant, the date and the total as named values", fr: "Photos de reçus de carburant : renvoyer le commerçant, la date et le total sous forme de valeurs nommées" } }
        - { id: t2, text: { en: "Photos of printed equipment data sheets: return the text with its tables and sections", fr: "Photos de fiches techniques imprimées : renvoyer le texte avec ses tableaux et ses sections" } }
        - { id: t3, text: { en: "Photos of supplier invoices: return the vendor, the due date and the line items", fr: "Photos de factures fournisseurs : renvoyer le fournisseur, la date d'échéance et les lignes d'articles" } }
        - { id: t4, text: { en: "Photos of completed installations: return a description that makes them searchable", fr: "Photos d'installations terminées : renvoyer une description qui les rend interrogeables" } }
    answer:
      mapping: { t1: receipt, t2: layout, t3: invoice, t4: imgsearch }
    explanation:
      correct:
        en: |
          A photo whose main content is text is a document, not an image to describe: receipts, data sheets and invoices go to document analyzers even as JPEG files. `prebuilt-receipt` and `prebuilt-invoice` return named fields without a schema, and `prebuilt-layout` keeps the tables and sections. Only the photos of installations, which show a scene rather than text, go to `prebuilt-imageSearch`, which generates a description of each image.
        fr: |
          Une photo dont le contenu principal est du texte est un document, pas une image à décrire : reçus, fiches techniques et factures vont à des analyseurs de documents, même au format JPEG. `prebuilt-receipt` et `prebuilt-invoice` renvoient des champs nommés sans schéma, et `prebuilt-layout` conserve les tableaux et les sections. Seules les photos d'installations, qui montrent une scène plutôt que du texte, vont à `prebuilt-imageSearch`, qui génère une description de chaque image.
      options:
        read: { en: "`prebuilt-read` returns the words and paragraphs but not the tables, and no named values.", fr: "`prebuilt-read` renvoie les mots et les paragraphes, mais pas les tableaux, ni aucune valeur nommée." }
        vidsearch: { en: "`prebuilt-videoSearch` analyzes video files, not photos.", fr: "`prebuilt-videoSearch` analyse des fichiers vidéo, pas des photos." }
    references:
      - title: "Azure Content Understanding in Foundry Tools prebuilt analyzers"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
      - title: "Azure Content Understanding in Foundry Tools image overview"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview

  # ------------------------------------------------------------------ 8
  - id: ai901-qz-24-08
    objective: "2.4.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders records its project meetings as MP4 videos: a camera shows the meeting room, and the soundtrack contains the discussion. Northwind creates a custom video analyzer in Azure Content Understanding in Foundry Tools. Its schema asks for the number of in-person attendees, a summary of the discussion and the list of assigned actions.

        Another application of Northwind sends each invoice field whose confidence is below 0.8 to a reviewer.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders enregistre ses réunions de projet sous forme de vidéos MP4 : une caméra montre la salle de réunion, et la bande sonore contient la discussion. Northwind crée un analyseur vidéo personnalisé dans Azure Content Understanding dans Foundry Tools. Son schéma demande le nombre de participants sur place, un résumé de la discussion et la liste des actions attribuées.

        Une autre application de Northwind envoie à un réviseur chaque champ de facture dont la confiance est inférieure à 0,8.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The analyzer can fill the number of in-person attendees from the images of the video.", fr: "L'analyseur peut remplir le nombre de participants sur place à partir des images de la vidéo." } }
        - { id: s2, text: { en: "An audio analyzer with the same schema, applied to the soundtracks only, returns the same results as the video analyzer.", fr: "Un analyseur audio doté du même schéma, appliqué aux seules bandes sonores, renvoie les mêmes résultats que l'analyseur vidéo." } }
        - { id: s3, text: { en: "Northwind can apply the same 0.8 confidence rule to the fields of the meeting results.", fr: "Northwind peut appliquer la même règle de confiance de 0,8 aux champs des résultats des réunions." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A video analyzer generates its fields from both the images (key frames) and the speech, so the people visible in the room can be counted. An audio analyzer only has the transcript: it can still summarize the discussion and list the actions, but it can't see who sits in the room. Confidence scores come with the fields of documents; the fields of a video result have none, so the 0.8 rule can't be reused as is.
        fr: |
          Un analyseur vidéo génère ses champs à partir des images (images clés) et de la parole : les personnes visibles dans la salle peuvent donc être comptées. Un analyseur audio ne dispose que de la transcription : il peut encore résumer la discussion et lister les actions, mais il ne voit pas qui est assis dans la salle. Les scores de confiance accompagnent les champs des documents ; les champs d'un résultat vidéo n'en ont pas, la règle de 0,8 ne peut donc pas être reprise telle quelle.
    references:
      - title: "Azure Content Understanding in Foundry Tools video overview"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
      - title: "Best practices for using Content Understanding"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices

  # ------------------------------------------------------------------ 9
  - id: ai901-qz-24-09
    objective: "2.4.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A Python script of Woodgrove Bank calls the REST API of Azure Content Understanding in Foundry Tools directly, without the SDK, to analyze recorded customer calls with the `prebuilt-callCenter` analyzer. The script must wait for the end of the analysis, then read the fields of the result.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un script Python de Woodgrove Bank appelle directement l'API REST d'Azure Content Understanding dans Foundry Tools, sans le SDK, pour analyser des appels clients enregistrés avec l'analyseur `prebuilt-callCenter`. Le script doit attendre la fin de l'analyse, puis lire les champs du résultat.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        import time
        import requests

        headers = {"Ocp-Apim-Subscription-Key": key}
        analyze_url = f"{endpoint}/contentunderstanding/analyzers/prebuilt-callCenter:analyze?api-version=2025-11-01"

        response = requests.post(analyze_url, headers=headers, json={"inputs": [{"url": call_url}]})
        result_url = response.headers["[[hdr]]"]

        while True:
            body = requests.[[verb]](result_url, headers=headers).json()
            if body["status"] == "[[done]]":
                break
            time.sleep(2)

        fields = body["result"]["[[coll]]"][0]["fields"]
      slots:
        - id: hdr
          options:
            - { id: hloc, text: "Location" }
            - { id: hop, text: "Operation-Location" }
            - { id: hcont, text: "Content-Location" }
        - id: verb
          options:
            - { id: vpost, text: "post" }
            - { id: vput, text: "put" }
            - { id: vget, text: "get" }
        - id: done
          options:
            - { id: drun, text: "Running" }
            - { id: dacc, text: "Accepted" }
            - { id: dsuc, text: "Succeeded" }
            - { id: dcomp, text: "Completed" }
        - id: coll
          options:
            - { id: ccont, text: "contents" }
            - { id: cpages, text: "pages" }
            - { id: cwarn, text: "warnings" }
    answer:
      values: { hdr: hop, verb: vget, done: dsuc, coll: ccont }
    explanation:
      correct:
        en: |
          The analysis is asynchronous: the POST request returns `202 Accepted` and the `Operation-Location` header holds the URL of the result. The script sends GET requests to that URL until `status` is `Succeeded` (it is `NotStarted` or `Running` before). The analyzed content is then in `result.contents`, and each item carries its `fields`. The SDK does this polling for you in `poller.result()`.
        fr: |
          L'analyse est asynchrone : la requête POST renvoie `202 Accepted` et l'en-tête `Operation-Location` contient l'URL du résultat. Le script envoie des requêtes GET à cette URL jusqu'à ce que `status` soit `Succeeded` (il vaut `NotStarted` ou `Running` avant). Le contenu analysé se trouve alors dans `result.contents`, et chaque élément porte ses `fields`. Le SDK fait cette interrogation pour vous dans `poller.result()`.
      options:
        vpost: { en: "A new POST would start another analysis of the same call instead of reading the result of the first one.", fr: "Un nouveau POST lancerait une autre analyse du même appel au lieu de lire le résultat de la première." }
        drun: { en: "`Running` means the analysis isn't finished: the loop would stop before the fields exist.", fr: "`Running` signifie que l'analyse n'est pas terminée : la boucle s'arrêterait avant que les champs existent." }
        dacc: { en: "`Accepted` is the meaning of the 202 response to the POST, not a status value of the result.", fr: "`Accepted` est le sens de la réponse 202 au POST, pas une valeur d'état du résultat." }
        cwarn: { en: "`warnings` lists the warnings of the analysis; the fields are in the items of `contents`.", fr: "`warnings` liste les avertissements de l'analyse ; les champs se trouvent dans les éléments de `contents`." }
    references:
      - title: "Quickstart: Azure Content Understanding in Foundry Tools"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api

  # ------------------------------------------------------------------ 10
  - id: ai901-qz-24-10
    objective: "2.4.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso uses a Microsoft Foundry resource with Azure Content Understanding in Foundry Tools. A company policy forbids deploying any generative or embedding model in the resource, and Contoso uses prebuilt analyzers only.

        Which two requirements can Contoso meet?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise une ressource Microsoft Foundry avec Azure Content Understanding dans Foundry Tools. Une règle interne de l'entreprise interdit de déployer tout modèle génératif ou d'incorporation dans la ressource, et Contoso utilise uniquement des analyseurs prédéfinis.

        Quelles sont les deux exigences auxquelles Contoso peut répondre ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Return the handwritten text of scanned visitor cards as plain text", fr: "Renvoyer en texte brut le contenu manuscrit de fiches visiteurs numérisées" } }
        - { id: b, text: { en: "Return the total of each photographed receipt as a named value", fr: "Renvoyer le total de chaque reçu photographié sous forme de valeur nommée" } }
        - { id: c, text: { en: "Return the tables and the sections of scanned supplier price lists", fr: "Renvoyer les tableaux et les sections de tarifs fournisseurs numérisés" } }
        - { id: d, text: { en: "Return the vendor and the due date of each scanned supplier invoice", fr: "Renvoyer le fournisseur et la date d'échéance de chaque facture fournisseur numérisée" } }
        - { id: e, text: { en: "Return a one-paragraph description of each photo in a product catalog", fr: "Renvoyer une description d'un paragraphe de chaque photo d'un catalogue de produits" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          `prebuilt-read` (text by OCR, printed or handwritten) and `prebuilt-layout` (text with its tables and sections) return what is written and don't need a language or embedding model. Every analyzer that returns named fields or generated content relies on a generative model deployed in the Foundry resource, which the policy forbids.
        fr: |
          `prebuilt-read` (texte par OCR, imprimé ou manuscrit) et `prebuilt-layout` (texte avec ses tableaux et ses sections) renvoient ce qui est écrit et n'ont besoin d'aucun modèle de langage ou d'incorporation. Tout analyseur qui renvoie des champs nommés ou du contenu généré s'appuie sur un modèle génératif déployé dans la ressource Foundry, ce que la règle interne interdit.
      options:
        b: { en: "The total is printed on the receipt, but returning it as a named value is field extraction with `prebuilt-receipt`, which needs a generative model.", fr: "Le total est imprimé sur le reçu, mais le renvoyer sous forme de valeur nommée est une extraction de champs avec `prebuilt-receipt`, qui exige un modèle génératif." }
        d: { en: "`prebuilt-invoice` returns these fields through field extraction, which needs a generative model.", fr: "`prebuilt-invoice` renvoie ces champs par extraction de champs, ce qui exige un modèle génératif." }
        e: { en: "`prebuilt-imageSearch` generates the description with a generative model, which can't be deployed here.", fr: "`prebuilt-imageSearch` génère la description avec un modèle génératif, qui ne peut pas être déployé ici." }
    references:
      - title: "Azure Content Understanding in Foundry Tools prebuilt analyzers"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
      - title: "Azure AI Content Understanding client library for Python"
        url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
