chapter: 11-responsible-ai
questions:
  # ------------------------------------------------------------------ 1
  - id: ai901-qz-11-01
    objective: "1.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank offers its virtual assistant in several languages. The assistant also has a simplified mode that guides, step by step, customers who have little experience with technology.

        Which responsible AI principle do these features primarily support?
      fr: |
        Woodgrove Bank propose son assistant virtuel en plusieurs langues. L'assistant dispose aussi d'un mode simplifié qui guide pas à pas les clients qui ont peu d'expérience des technologies.

        Quel principe de l'IA responsable ces fonctionnalités servent-elles principalement ?
    body:
      options:
        - { id: a, text: { en: "Fairness", fr: "Impartialité" } }
        - { id: b, text: { en: "Transparency", fr: "Transparence" } }
        - { id: c, text: { en: "Inclusiveness", fr: "Inclusion" } }
        - { id: d, text: { en: "Reliability and safety", fr: "Fiabilité et sécurité" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Inclusiveness asks AI systems to empower everyone and to accommodate diverse needs, including language variation and different levels of technical proficiency. Offering several languages and a guided mode removes barriers that would otherwise leave some customers unable to use the assistant.
        fr: |
          L'inclusion demande que les systèmes d'IA donnent des moyens d'agir à tous et s'adaptent à des besoins divers, notamment les différences de langue et les différents niveaux de compétence technique. Proposer plusieurs langues et un mode guidé lève des obstacles qui empêcheraient sinon certains clients d'utiliser l'assistant.
      options:
        a: { en: "Fairness is about outcomes: comparable customers receive comparable results. These features are about access to the assistant, not about the results it gives.", fr: "L'impartialité porte sur les résultats : des clients comparables obtiennent des résultats comparables. Ces fonctionnalités portent sur l'accès à l'assistant, pas sur les résultats qu'il donne." }
        b: { en: "Transparency is about understanding how the system works and its limits; neither feature explains the assistant's behavior.", fr: "La transparence porte sur la compréhension du fonctionnement du système et de ses limites ; aucune de ces fonctionnalités n'explique le comportement de l'assistant." }
        d: { en: "Reliability and safety is about operating as designed and responding safely to unexpected conditions, not about who can use the assistant.", fr: "La fiabilité et la sécurité portent sur le fonctionnement conforme à la conception et la réaction sans danger aux conditions imprévues, pas sur les personnes qui peuvent utiliser l'assistant." }
    references:
      - title: "Responsible AI for agent design"
        url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai

  # ------------------------------------------------------------------ 2
  - id: ai901-qz-11-02
    objective: "1.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Two of the responsible AI principles are reliability and safety, and privacy and security.

        In the reliability and safety principle, what does safety refer to?
      fr: |
        Deux des principes de l'IA responsable sont la fiabilité et la sécurité, et la confidentialité et la sécurité.

        Dans le principe de fiabilité et de sécurité, à quoi la sécurité fait-elle référence ?
    body:
      options:
        - { id: a, text: { en: "The data and the models of the system are protected against unauthorized access.", fr: "Les données et les modèles du système sont protégés contre les accès non autorisés." } }
        - { id: b, text: { en: "The behavior of the system doesn't cause harm, even in conditions nobody anticipated.", fr: "Le comportement du système ne cause pas de tort, même dans des conditions que personne n'avait prévues." } }
        - { id: c, text: { en: "People in similar situations receive similar results from the system.", fr: "Les personnes dans des situations similaires obtiennent des résultats similaires du système." } }
        - { id: d, text: { en: "The people who deploy the system answer for the harm that it causes.", fr: "Les personnes qui déploient le système répondent des torts qu'il cause." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Reliability and safety means that an AI system operates as designed, responds safely to unanticipated conditions and resists harmful manipulation: safety is about the system's own behavior not causing harm. Protecting data and systems against unauthorized access is the "security" of the privacy and security principle.
        fr: |
          La fiabilité et la sécurité signifient qu'un système d'IA fonctionne comme prévu, réagit sans danger aux conditions imprévues et résiste aux manipulations nuisibles : cette sécurité (safety) porte sur le fait que le comportement du système lui-même ne cause pas de tort. Protéger les données et les systèmes contre les accès non autorisés est la sécurité (security) du principe de confidentialité et de sécurité.
      options:
        a: { en: "Protection against unauthorized access is the security of the privacy and security principle, not the safety of reliability and safety.", fr: "La protection contre les accès non autorisés est la sécurité (security) du principe de confidentialité et de sécurité, pas la sécurité (safety) de la fiabilité et de la sécurité." }
        c: { en: "Similar results for people in similar situations defines fairness.", fr: "Des résultats similaires pour des personnes dans des situations similaires définissent l'impartialité." }
        d: { en: "People answering for the system defines accountability.", fr: "Le fait que des personnes répondent du système définit la responsabilité." }
    references:
      - title: "Identify guiding principles for responsible AI"
        url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai

  # ------------------------------------------------------------------ 3
  - id: ai901-qz-11-03
    objective: "1.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware builds an agent that answers questions from job applicants. Before release, the team runs the Hateful and unfairness evaluator of Microsoft Foundry on the agent's answers to a set of test questions. Several answers fail the evaluation.

        Which statement describes what the evaluator did?
      fr: |
        Litware crée un agent qui répond aux questions des candidats à un emploi. Avant la mise en service, l'équipe exécute l'évaluateur Hateful and unfairness de Microsoft Foundry sur les réponses de l'agent à un ensemble de questions de test. Plusieurs réponses échouent à l'évaluation.

        Quelle affirmation décrit ce que l'évaluateur a fait ?
    body:
      options:
        - { id: a, text: { en: "It rewrote the failing answers, so that applicants now receive answers without unfair content.", fr: "Il a réécrit les réponses en échec, afin que les candidats reçoivent désormais des réponses sans contenu inéquitable." } }
        - { id: b, text: { en: "It raised the guardrail thresholds of the deployment, so that unfair content is blocked from now on.", fr: "Il a relevé les seuils des garde-fous du déploiement, afin que le contenu inéquitable soit bloqué désormais." } }
        - { id: c, text: { en: "It retrained the model on balanced data, so that the next run of the test questions passes.", fr: "Il a réentraîné le modèle sur des données équilibrées, afin que la prochaine exécution des questions de test réussisse." } }
        - { id: d, text: { en: "It scored the severity of each answer, so that the team can find the problem and change the agent.", fr: "Il a noté la gravité de chaque réponse, afin que l'équipe puisse trouver le problème et modifier l'agent." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Content safety evaluators such as Hateful and unfairness assign each response a severity score on a 0-7 scale, with a pass or fail label and a reason. They only measure: the team must then change the agent (data, instructions, filters) and evaluate again.
        fr: |
          Les évaluateurs de sécurité du contenu comme Hateful and unfairness attribuent à chaque réponse un score de gravité sur une échelle de 0 à 7, avec une étiquette de réussite ou d'échec et une justification. Ils se contentent de mesurer : l'équipe doit ensuite modifier l'agent (données, instructions, filtres) et évaluer à nouveau.
      options:
        a: { en: "Evaluators annotate responses; they never rewrite them. Changing what users receive is up to the team.", fr: "Les évaluateurs annotent les réponses ; ils ne les réécrivent jamais. Changer ce que reçoivent les utilisateurs incombe à l'équipe." }
        b: { en: "Guardrails are configured separately on the deployment; running an evaluation doesn't change them.", fr: "Les garde-fous se configurent séparément sur le déploiement ; exécuter une évaluation ne les modifie pas." }
        c: { en: "An evaluation doesn't train or modify the model; it only scores the responses that it receives.", fr: "Une évaluation n'entraîne ni ne modifie le modèle ; elle note seulement les réponses qu'elle reçoit." }
    references:
      - title: "Risk and safety evaluators"
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators

  # ------------------------------------------------------------------ 4
  - id: ai901-qz-11-04
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        A clinic deploys an AI assistant on its patient portal. The assistant answers patients' questions about their treatment, such as when to take a medicine, and keeps a history of each conversation. The clinic's responsible AI review describes two of the measures that the clinic applies.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Une clinique déploie un assistant d'IA sur son portail patients. L'assistant répond aux questions des patients sur leur traitement, par exemple à quel moment prendre un médicament, et conserve l'historique de chaque conversation. La revue d'IA responsable de la clinique décrit deux des mesures que la clinique applique.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          When a question about a dosage falls outside the situations that the assistant was tested for, the assistant doesn't answer and refers the patient to a nurse. This measure applies the [[m1]] principle.

          Only the members of a patient's care team can open the patient's conversations with the assistant. This measure applies the [[m2]] principle.
        fr: |
          Quand une question sur une posologie sort des situations pour lesquelles l'assistant a été testé, l'assistant ne répond pas et oriente le patient vers une infirmière. Cette mesure applique le principe [[m1]].

          Seuls les membres de l'équipe soignante d'un patient peuvent ouvrir les conversations du patient avec l'assistant. Cette mesure applique le principe [[m2]].
      slots:
        - id: m1
          options:
            - { id: acc, text: { en: "accountability", fr: "de responsabilité" } }
            - { id: priv, text: { en: "privacy and security", fr: "de confidentialité et de sécurité" } }
            - { id: rel, text: { en: "reliability and safety", fr: "de fiabilité et de sécurité" } }
            - { id: tra, text: { en: "transparency", fr: "de transparence" } }
        - id: m2
          options:
            - { id: rel, text: { en: "reliability and safety", fr: "de fiabilité et de sécurité" } }
            - { id: tra, text: { en: "transparency", fr: "de transparence" } }
            - { id: acc, text: { en: "accountability", fr: "de responsabilité" } }
            - { id: priv, text: { en: "privacy and security", fr: "de confidentialité et de sécurité" } }
    answer:
      values: { m1: rel, m2: priv }
    explanation:
      correct:
        en: |
          Responding safely to conditions that weren't anticipated, and defining when control passes to a person, are reliability and safety considerations: the measure keeps the assistant's own behavior from causing harm. Limiting who can read patients' conversations protects personal data against unauthorized access, which is privacy and security.
        fr: |
          Réagir sans danger aux conditions non prévues, et définir quand le contrôle passe à une personne, relèvent de la fiabilité et de la sécurité : la mesure empêche que le comportement de l'assistant lui-même cause du tort. Limiter qui peut lire les conversations des patients protège les données personnelles contre les accès non autorisés, ce qui relève de la confidentialité et de la sécurité.
      options:
        acc: { en: "Accountability is about people answering for the system and overseeing consequential decisions. Here, the hand-over is triggered by an untested situation, to avoid harm: a reliability and safety design choice.", fr: "La responsabilité porte sur les personnes qui répondent du système et supervisent les décisions importantes. Ici, le passage de relais est déclenché par une situation non testée, pour éviter un tort : c'est un choix de conception de fiabilité et de sécurité." }
        tra: { en: "Neither measure explains how the assistant works or what its limits are to the patients.", fr: "Aucune des deux mesures n'explique aux patients comment l'assistant fonctionne ni quelles sont ses limites." }
    references:
      - title: "Identify guiding principles for responsible AI"
        url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai

  # ------------------------------------------------------------------ 5
  - id: ai901-qz-11-05
    objective: "1.1.6"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware uses an AI agent that calculates the compensation that customers receive for late deliveries. The agent reads the delivery history of the order, applies the compensation rules of Litware and sends the payment automatically. Each month, the agent pays several thousand customers.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware utilise un agent d'IA qui calcule l'indemnisation que reçoivent les clients pour les livraisons en retard. L'agent lit l'historique de livraison de la commande, applique les règles d'indemnisation de Litware et envoie le paiement automatiquement. Chaque mois, l'agent paie plusieurs milliers de clients.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Recording, for each compensation, the model version and the instructions that produced it helps Litware trace and correct a wrong amount.", fr: "Consigner, pour chaque indemnisation, la version du modèle et les instructions qui l'ont produite aide Litware à retracer et à corriger un montant erroné." }
        - id: s2
          text: { en: "Labeling each compensation message as generated by AI keeps Litware accountable without any human oversight of the amounts.", fr: "Signaler chaque message d'indemnisation comme généré par l'IA maintient la responsabilité de Litware sans aucune supervision humaine des montants." }
        - id: s3
          text: { en: "Litware's accountability for the agent starts only when the agent is released to customers.", fr: "La responsabilité de Litware à l'égard de l'agent ne commence qu'au moment où l'agent est mis à la disposition des clients." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Traceability supports accountability: knowing which model version and which instructions produced a decision lets the responsible people find and correct an error. Labeling content as AI-generated is a transparency measure; it doesn't replace the human oversight that keeps people in control of consequential decisions. Governance covers the system from its design through its deployment and operation.
        fr: |
          La traçabilité sert la responsabilité : savoir quelle version du modèle et quelles instructions ont produit une décision permet aux personnes responsables de trouver et de corriger une erreur. Signaler un contenu comme généré par l'IA est une mesure de transparence ; cela ne remplace pas la supervision humaine qui garde les personnes aux commandes des décisions importantes. La gouvernance couvre le système depuis sa conception jusqu'à son déploiement et son exploitation.
      options:
        s2: { en: "A label tells customers that AI was used (transparency). Accountability needs people who answer for the amounts and can inspect and correct them.", fr: "Une mention indique aux clients que l'IA a été utilisée (transparence). La responsabilité exige des personnes qui répondent des montants et peuvent les inspecter et les corriger." }
        s3: { en: "Review boards and governance oversee development as well as deployment: accountability applies from the design of the agent.", fr: "Les comités de revue et la gouvernance supervisent le développement autant que le déploiement : la responsabilité s'applique dès la conception de l'agent." }
    references:
      - title: "Identify guiding principles for responsible AI"
        url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
      - title: "Responsible AI"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai

  # ------------------------------------------------------------------ 6
  - id: ai901-qz-11-06
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A city uses an AI assistant to help residents apply for housing benefits. The city has taken the following measures:

        - The website says that an AI assistant is used and describes its limitations.
        - A caseworker reviews every decision and can overturn it.
        - Applicant data is encrypted, and only caseworkers can read it.
        - Tests show that applicants in comparable situations who submit an application receive comparable decisions.

        Usage data shows that residents who aren't fluent in the city's main language, and residents who use a screen reader, rarely manage to submit an application.

        Which responsible AI principle should the city address next?
      fr: |
        Une ville utilise un assistant d'IA pour aider les habitants à demander une aide au logement. La ville a pris les mesures suivantes :

        - Le site web indique qu'un assistant d'IA est utilisé et décrit ses limites.
        - Un travailleur social revoit chaque décision et peut l'annuler.
        - Les données des demandeurs sont chiffrées, et seuls les travailleurs sociaux peuvent les lire.
        - Les tests montrent que les demandeurs dans des situations comparables qui déposent une demande reçoivent des décisions comparables.

        Les données d'utilisation montrent que les habitants qui ne maîtrisent pas la langue principale de la ville, et les habitants qui utilisent un lecteur d'écran, parviennent rarement à déposer une demande.

        Quel principe de l'IA responsable la ville doit-elle traiter ensuite ?
    body:
      options:
        - { id: a, text: { en: "Fairness", fr: "Impartialité" } }
        - { id: b, text: { en: "Inclusiveness", fr: "Inclusion" } }
        - { id: c, text: { en: "Transparency", fr: "Transparence" } }
        - { id: d, text: { en: "Accountability", fr: "Responsabilité" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The problem happens before any decision: some residents can't use the assistant at all because of their language or a disability. Inclusiveness asks systems to accommodate language variation and to follow accessibility standards, tested with people with disabilities. Disclosure (transparency), human review (accountability) and protected data (privacy and security) are already in place.
        fr: |
          Le problème survient avant toute décision : certains habitants ne peuvent pas du tout utiliser l'assistant à cause de leur langue ou d'un handicap. L'inclusion demande que les systèmes tiennent compte des différences de langue et respectent les normes d'accessibilité, en testant avec des personnes en situation de handicap. L'information des utilisateurs (transparence), la revue humaine (responsabilité) et la protection des données (confidentialité et sécurité) sont déjà en place.
      options:
        a: { en: "The groups differ in how often they can submit an application, but comparable applicants who submit receive comparable decisions: the outcomes are fair, and the barrier is access.", fr: "Les groupes diffèrent par leur capacité à déposer une demande, mais les demandeurs comparables qui déposent reçoivent des décisions comparables : les résultats sont impartiaux, et l'obstacle est l'accès." }
        c: { en: "The website already discloses the use of AI and its limitations.", fr: "Le site web indique déjà l'utilisation de l'IA et ses limites." }
        d: { en: "A caseworker already reviews and can overturn every decision.", fr: "Un travailleur social revoit déjà chaque décision et peut l'annuler." }
    references:
      - title: "Identify guiding principles for responsible AI"
        url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
      - title: "Responsible AI for agent design"
        url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai

  # ------------------------------------------------------------------ 7
  - id: ai901-qz-11-07
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The marketing team of Fabrikam uses an image-generation model deployed in Microsoft Foundry to create the pictures of its social media posts. Team members describe the picture they want in a short prompt, and a designer approves each picture before it's published on the company's accounts.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe marketing de Fabrikam utilise un modèle de génération d'images déployé dans Microsoft Foundry pour créer les illustrations de ses publications sur les réseaux sociaux. Les membres de l'équipe décrivent l'illustration voulue dans une courte invite, et un graphiste approuve chaque illustration avant sa publication sur les comptes de l'entreprise.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Adding a mention that identifies the published pictures as AI-generated applies the transparency principle.", fr: "Ajouter une mention qui identifie les illustrations publiées comme générées par l'IA applique le principe de transparence." }
        - id: s2
          text: { en: "Because a designer approves each picture, Fabrikam has no reason to disclose that the pictures were generated by AI.", fr: "Puisqu'un graphiste approuve chaque illustration, Fabrikam n'a aucune raison d'indiquer que les illustrations ont été générées par l'IA." }
        - id: s3
          text: { en: "Telling the marketing team which kinds of requests the model handles poorly applies the transparency principle.", fr: "Indiquer à l'équipe marketing les types de demandes que le modèle traite mal applique le principe de transparence." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Transparency asks organizations to be open about when, why and how they use AI, for example by labeling generated content, and to make the capabilities and limitations of a system clear to the people who use it. The designer's approval is a human review that supports accountability; it doesn't tell the audience that the pictures were generated by AI.
        fr: |
          La transparence demande aux organisations de dire ouvertement quand, pourquoi et comment elles utilisent l'IA, par exemple en signalant le contenu généré, et de rendre claires les capacités et les limites d'un système pour ceux qui l'utilisent. L'approbation du graphiste est une revue humaine qui sert la responsabilité ; elle n'indique pas au public que les illustrations ont été générées par l'IA.
      options:
        s2: { en: "Human approval and disclosure answer different principles: approval is accountability, disclosure is transparency. One doesn't replace the other.", fr: "L'approbation humaine et l'information répondent à des principes différents : l'approbation relève de la responsabilité, l'information de la transparence. L'une ne remplace pas l'autre." }
    references:
      - title: "Responsible AI for agent design"
        url: https://learn.microsoft.com/en-us/agents/design-guidelines/responsible-ai
      - title: "Artificial Intelligence overview"
        url: https://learn.microsoft.com/en-us/compliance/assurance/assurance-artificial-intelligence

  # ------------------------------------------------------------------ 8
  - id: ai901-qz-11-08
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware prepares a customer support agent in Microsoft Foundry. The agent calls a model endpoint that authenticates with a key, and the conversations are stored as transcripts for later analysis. The team lists four needs.

        Which capability should the team use for each need? To answer, drag the appropriate capabilities to the correct needs. Each capability may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware prépare un agent de support client dans Microsoft Foundry. L'agent appelle un point de terminaison de modèle qui s'authentifie avec une clé, et les conversations sont stockées sous forme de transcriptions pour une analyse ultérieure. L'équipe liste quatre besoins.

        Quelle fonctionnalité l'équipe doit-elle utiliser pour chaque besoin ? Pour répondre, faites glisser les fonctionnalités appropriées vers les besoins correspondants. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: guard, text: { en: "Guardrails (content filters)", fr: "Garde-fous (filtres de contenu)" } }
        - { id: eval, text: { en: "Risk and safety evaluators", fr: "Évaluateurs de risque et de sécurité" } }
        - { id: card, text: { en: "Model card", fr: "Carte de modèle" } }
        - { id: board, text: { en: "Model leaderboards", fr: "Classements de modèles" } }
        - { id: pii, text: { en: "PII detection in Azure Language", fr: "Détection des PII d'Azure Language" } }
        - { id: kv, text: { en: "Azure Key Vault", fr: "Azure Key Vault" } }
      targets:
        - { id: t1, text: { en: "In production, stop user prompts that try to make the agent ignore its instructions.", fr: "En production, arrêter les invites utilisateur qui tentent de faire ignorer ses instructions à l'agent." } }
        - { id: t2, text: { en: "Before choosing a catalog model, read the constraints and caveats documented for it.", fr: "Avant de choisir un modèle du catalogue, lire les contraintes et mises en garde documentées pour celui-ci." } }
        - { id: t3, text: { en: "Remove customers' names and phone numbers from the transcripts before they're stored.", fr: "Retirer les noms et numéros de téléphone des clients des transcriptions avant leur stockage." } }
        - { id: t4, text: { en: "Keep the key of the model endpoint out of the agent's source code.", fr: "Garder la clé du point de terminaison du modèle hors du code source de l'agent." } }
    answer:
      mapping: { t1: guard, t2: card, t3: pii, t4: kv }
    explanation:
      correct:
        en: |
          Guardrails act at run time; user prompt attack (jailbreak) detection is enabled by default for Foundry models. The model card of a catalog entry documents the model's constraints and caveats. PII detection in Azure Language identifies and redacts personal data such as names and phone numbers. Secrets such as keys belong in Azure Key Vault, not in code.
        fr: |
          Les garde-fous agissent à l'exécution ; la détection des attaques par invite utilisateur (jailbreak) est activée par défaut pour les modèles Foundry. La carte de modèle d'une entrée du catalogue documente les contraintes et les mises en garde du modèle. La détection des PII d'Azure Language identifie et masque les données personnelles comme les noms et les numéros de téléphone. Les secrets comme les clés ont leur place dans Azure Key Vault, pas dans le code.
      options:
        eval: { en: "Evaluators score responses to test inputs to measure risks; they don't block anything in production.", fr: "Les évaluateurs notent les réponses à des entrées de test pour mesurer les risques ; ils ne bloquent rien en production." }
        board: { en: "Leaderboards rank models by quality, safety and throughput on benchmarks; the caveats of a model are in its model card.", fr: "Les classements ordonnent les modèles par qualité, sécurité et débit sur des benchmarks ; les mises en garde d'un modèle figurent dans sa carte de modèle." }
    references:
      - title: "Default Guardrail policies for Microsoft Foundry"
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/default-safety-policies
      - title: "What is PII detection in Azure Language?"
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview

  # ------------------------------------------------------------------ 9
  - id: ai901-qz-11-09
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Insurance builds an AI system that proposes the price of home insurance policies. The model learns from ten years of past policies. Before training, the team removes the gender and age columns from the data. The overall accuracy of the model is 94 percent.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Insurance crée un système d'IA qui propose le prix des contrats d'assurance habitation. Le modèle apprend à partir de dix ans de contrats passés. Avant l'entraînement, l'équipe retire les colonnes de genre et d'âge des données. La précision globale du modèle est de 94 pour cent.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Because gender and age are no longer in the data, the team doesn't need to compare the proposed prices across gender and age groups.", fr: "Puisque le genre et l'âge ne figurent plus dans les données, l'équipe n'a pas besoin de comparer les prix proposés entre les groupes de genre et d'âge." }
        - id: s2
          text: { en: "If rural customers are underrepresented in the past policies, the model can propose unfair prices to them despite its overall accuracy.", fr: "Si les clients ruraux sont sous-représentés dans les contrats passés, le modèle peut leur proposer des prix inéquitables malgré sa précision globale." }
        - id: s3
          text: { en: "Once the model passes its fairness checks before release, the outcomes for each group no longer need to be checked in production.", fr: "Une fois que le modèle a passé ses contrôles d'impartialité avant la mise en service, les résultats pour chaque groupe n'ont plus besoin d'être contrôlés en production." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Bias can enter at every stage, from data collection to modeling to operation, so removing two columns doesn't prove that comparable customers get comparable prices: only comparing the outcomes by group shows it. A dataset in which a group is poorly represented can produce unfair results for that group even when the overall accuracy is high. Because bias can also appear while the system operates, outcomes must keep being monitored after release.
        fr: |
          Un biais peut entrer à chaque étape, de la collecte des données à la modélisation et à l'exploitation : retirer deux colonnes ne prouve donc pas que des clients comparables obtiennent des prix comparables ; seule la comparaison des résultats par groupe le montre. Un jeu de données où un groupe est mal représenté peut produire des résultats inéquitables pour ce groupe même quand la précision globale est élevée. Comme un biais peut aussi apparaître pendant l'exploitation du système, les résultats doivent continuer à être surveillés après la mise en service.
      options:
        s1: { en: "The remaining data, collected over ten years, can still carry bias against these groups. Fairness is checked on the outcomes, not on the list of columns.", fr: "Les données restantes, collectées sur dix ans, peuvent encore porter un biais envers ces groupes. L'impartialité se vérifie sur les résultats, pas sur la liste des colonnes." }
        s3: { en: "Bias can be introduced when the system operates, for example when the population of customers changes; monitoring continues in production.", fr: "Un biais peut être introduit pendant l'exploitation du système, par exemple quand la population des clients change ; la surveillance continue en production." }
    references:
      - title: "Identify guiding principles for responsible AI"
        url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
      - title: "Responsible AI"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-ai-fundamentals/7-responsible-ai

  # ------------------------------------------------------------------ 10
  - id: ai901-qz-11-10
    objective: "1.1.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank uses an AI system that recommends whether personal loan applications are approved. Loan officers make the final decision. During an internal audit, the bank describes three measures that it applies to the system, each with its goal.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank utilise un système d'IA qui recommande d'accepter ou non les demandes de prêt personnel. Les chargés de prêt prennent la décision finale. Lors d'un audit interne, la banque décrit trois mesures qu'elle applique au système, chacune avec son objectif.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Goal: check whether applicants who have similar finances are approved at similar rates, whatever their age band. To do so, the bank asks applicants for their age band, with their consent. This measure primarily applies [[m1]].

          Goal: detect an employee who reads applicant files without a business need. The system logs every employee who opens a file. This measure primarily applies [[m2]].

          Goal: when a customer contests a decision, find out which model version produced it and which manager approved the release of that version. Each decision is stored with this information. This measure primarily applies [[m3]].
        fr: |
          Objectif : vérifier si des demandeurs aux finances similaires sont acceptés dans des proportions similaires, quelle que soit leur tranche d'âge. Pour cela, la banque demande aux demandeurs leur tranche d'âge, avec leur consentement. Cette mesure applique principalement [[m1]].

          Objectif : détecter un employé qui lit des dossiers de demandeurs sans besoin professionnel. Le système journalise chaque employé qui ouvre un dossier. Cette mesure applique principalement [[m2]].

          Objectif : quand un client conteste une décision, savoir quelle version du modèle l'a produite et quel responsable a approuvé la mise en service de cette version. Chaque décision est stockée avec ces informations. Cette mesure applique principalement [[m3]].
      slots:
        - id: m1
          options:
            - { id: priv, text: { en: "privacy and security", fr: "la confidentialité et la sécurité" } }
            - { id: fair, text: { en: "fairness", fr: "l'impartialité" } }
            - { id: incl, text: { en: "inclusiveness", fr: "l'inclusion" } }
            - { id: tra, text: { en: "transparency", fr: "la transparence" } }
        - id: m2
          options:
            - { id: acc, text: { en: "accountability", fr: "la responsabilité" } }
            - { id: tra, text: { en: "transparency", fr: "la transparence" } }
            - { id: priv, text: { en: "privacy and security", fr: "la confidentialité et la sécurité" } }
            - { id: rel, text: { en: "reliability and safety", fr: "la fiabilité et la sécurité" } }
        - id: m3
          options:
            - { id: priv, text: { en: "privacy and security", fr: "la confidentialité et la sécurité" } }
            - { id: rel, text: { en: "reliability and safety", fr: "la fiabilité et la sécurité" } }
            - { id: tra, text: { en: "transparency", fr: "la transparence" } }
            - { id: acc, text: { en: "accountability", fr: "la responsabilité" } }
    answer:
      values: { m1: fair, m2: priv, m3: acc }
    explanation:
      correct:
        en: |
          Classify each measure by its goal, not by its keywords. Comparing approval rates of similar applicants across age bands is a fairness assessment; the consent only makes the data collection lawful. Logging who opens personal files audits access to customer data, a privacy and security practice. Tracing which model version made a decision and who approved its release lets the bank answer for the decision and correct it, which is accountability.
        fr: |
          Classez chaque mesure selon son objectif, pas selon ses mots clés. Comparer les taux d'acceptation de demandeurs similaires entre tranches d'âge est une évaluation de l'impartialité ; le consentement ne fait que rendre la collecte licite. Journaliser qui ouvre des dossiers personnels audite l'accès aux données des clients, une pratique de confidentialité et de sécurité. Retracer quelle version du modèle a pris une décision et qui a approuvé sa mise en service permet à la banque de répondre de la décision et de la corriger, ce qui relève de la responsabilité.
      options:
        priv: { en: "Consent concerns how the age band is collected, but the goal of measure 1 is to compare outcomes between groups. Measure 3 records decisions and approvals, not access to personal data.", fr: "Le consentement concerne la façon dont la tranche d'âge est collectée, mais l'objectif de la mesure 1 est de comparer les résultats entre groupes. La mesure 3 consigne des décisions et des approbations, pas des accès à des données personnelles." }
        acc: { en: "Measure 2 records who accesses customer data to protect it from misuse: auditing access and use of data belongs to privacy and security.", fr: "La mesure 2 consigne qui accède aux données des clients pour les protéger d'un mauvais usage : auditer l'accès aux données et leur utilisation relève de la confidentialité et de la sécurité." }
        tra: { en: "None of the measures explains the system or its limits to applicants.", fr: "Aucune des mesures n'explique le système ou ses limites aux demandeurs." }
    references:
      - title: "Identify guiding principles for responsible AI"
        url: https://learn.microsoft.com/en-us/training/modules/embrace-responsible-ai-principles-practices/3-identify-guiding-principles-responsible-ai
