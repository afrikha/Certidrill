chapter: 13-ai-workloads
questions:
  # ------------------------------------------------------------------ 1
  - id: ai901-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In Microsoft Foundry, an agent brings together a generative AI model, instructions and a third element. Thanks to this third element, the agent can query a database or update an order instead of only writing an answer.

        What is this third element?
      fr: |
        Dans Microsoft Foundry, un agent réunit un modèle d'IA générative, des instructions et un troisième élément. Grâce à ce troisième élément, l'agent peut interroger une base de données ou mettre à jour une commande au lieu de seulement rédiger une réponse.

        Quel est ce troisième élément ?
    body:
      options:
        - { id: a, text: { en: "A context window, which holds the earlier turns of the conversation", fr: "Une fenêtre de contexte, qui conserve les tours précédents de la conversation" } }
        - { id: b, text: { en: "Tools, which the model can call to work with external systems", fr: "Des outils, que le modèle peut appeler pour travailler avec des systèmes externes" } }
        - { id: c, text: { en: "A low temperature, which makes each answer more predictable", fr: "Une température basse, qui rend chaque réponse plus prévisible" } }
        - { id: d, text: { en: "An embedding model, which turns each request into a vector", fr: "Un modèle d'embedding, qui transforme chaque requête en vecteur" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An agent in Foundry combines a model for reasoning, instructions that define its role and rules, and tools. Tools are callable capabilities, such as querying a database, searching or calling an API, that let the agent take real actions. Without tools, the solution only generates content: it's generative AI, not agentic AI.
        fr: |
          Un agent dans Foundry combine un modèle pour le raisonnement, des instructions qui définissent son rôle et ses règles, et des outils. Les outils sont des fonctionnalités appelables, comme interroger une base de données, faire une recherche ou appeler une API, qui permettent à l'agent d'agir réellement. Sans outils, la solution ne fait que générer du contenu : c'est de l'IA générative, pas de l'IA agentique.
      options:
        a: { en: "The context window lets the model take earlier messages into account; it doesn't let it act on another system.", fr: "La fenêtre de contexte permet au modèle de tenir compte des messages précédents ; elle ne lui permet pas d'agir sur un autre système." }
        c: { en: "The temperature controls how random the generated text is; it gives the model no way to update an order.", fr: "La température contrôle le caractère aléatoire du texte généré ; elle ne donne au modèle aucun moyen de mettre à jour une commande." }
        d: { en: "An embedding model returns vectors that encode meaning; it isn't the component that lets an agent take actions.", fr: "Un modèle d'embedding renvoie des vecteurs qui encodent le sens ; ce n'est pas le composant qui permet à un agent d'agir." }
    references:
      - title: "Creating an agent"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent

  # ------------------------------------------------------------------ 2
  - id: ai901-qz-13-02
    objective: "1.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An application submits the following message to the language detection capability of Azure Language in Foundry Tools:

        *Guten Tag, ich möchte meine Bestellung stornieren.*

        What does the result contain?
      fr: |
        Une application soumet le message suivant à la fonctionnalité de détection de langue d'Azure Language dans Foundry Tools :

        *Guten Tag, ich möchte meine Bestellung stornieren.*

        Que contient le résultat ?
    body:
      options:
        - { id: a, text: { en: "An English translation of the message, with a confidence score", fr: "Une traduction du message en anglais, avec un score de confiance" } }
        - { id: b, text: { en: "The value negative, with a confidence score", fr: "La valeur négatif, avec un score de confiance" } }
        - { id: c, text: { en: "The value German (de), with a confidence score", fr: "La valeur allemand (de), avec un score de confiance" } }
        - { id: d, text: { en: "The key phrase Bestellung, with a confidence score", fr: "L'expression clé Bestellung, avec un score de confiance" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Language detection identifies the primary language of a text and returns it, with its ISO 639-1 code, and a confidence score. It's typically the first step that routes a message to the right team or to a language-specific process.
        fr: |
          La détection de langue identifie la langue principale d'un texte et la renvoie, avec son code ISO 639-1, ainsi qu'un score de confiance. C'est en général la première étape, qui oriente un message vers la bonne équipe ou vers un traitement propre à la langue.
      options:
        a: { en: "Language detection doesn't translate the text; it only identifies its language.", fr: "La détection de langue ne traduit pas le texte ; elle ne fait qu'identifier sa langue." }
        b: { en: "A positive, negative or neutral label is the result of sentiment analysis, not of language detection.", fr: "Une étiquette positive, négative ou neutre est le résultat de l'analyse des sentiments, pas de la détection de langue." }
        d: { en: "The main concepts of a text are returned by key phrase extraction, not by language detection.", fr: "Les principaux concepts d'un texte sont renvoyés par l'extraction d'expressions clés, pas par la détection de langue." }
    references:
      - title: "What is language detection in Azure Language?"
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/language-detection/overview
      - title: "Understand text analysis in Foundry"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language

  # ------------------------------------------------------------------ 3
  - id: ai901-qz-13-03
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam wants a virtual agent on its website. The virtual agent chats with customers in natural language and gives general advice on how to care for leather shoes. It doesn't connect to any Fabrikam system and doesn't look anything up.

        Which AI workload does this solution represent?
      fr: |
        Fabrikam veut un agent virtuel sur son site web. L'agent virtuel converse avec les clients en langage naturel et donne des conseils généraux sur l'entretien des chaussures en cuir. Il ne se connecte à aucun système de Fabrikam et ne recherche aucune information.

        Quelle charge de travail d'IA cette solution représente-t-elle ?
    body:
      options:
        - { id: a, text: { en: "Agentic AI", fr: "IA agentique" } }
        - { id: b, text: { en: "Text analysis", fr: "Analyse de texte" } }
        - { id: c, text: { en: "Generative AI", fr: "IA générative" } }
        - { id: d, text: { en: "Information extraction", fr: "Extraction d'informations" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The solution only produces new content, natural language answers, in response to the customers' prompts. Customer support by virtual agents that understand and answer inquiries in natural language is a typical generative AI use case. Generative AI answers; agentic AI acts.
        fr: |
          La solution ne fait que produire du contenu nouveau, des réponses en langage naturel, en réponse aux invites des clients. Le support client par des agents virtuels qui comprennent les demandes et y répondent en langage naturel est un cas d'usage type de l'IA générative. L'IA générative répond ; l'IA agentique agit.
      options:
        a: { en: "The name virtual agent doesn't make it agentic AI: the solution calls no tool, searches nothing and takes no action.", fr: "Le nom d'agent virtuel n'en fait pas de l'IA agentique : la solution n'appelle aucun outil, ne recherche rien et n'effectue aucune action." }
        b: { en: "Text analysis extracts meaning from existing text, such as sentiment or entities; here the solution writes new answers.", fr: "L'analyse de texte extrait le sens d'un texte existant, comme les sentiments ou les entités ; ici, la solution rédige de nouvelles réponses." }
        d: { en: "Information extraction turns unstructured content into structured data fields; the solution returns conversational answers.", fr: "L'extraction d'informations transforme un contenu non structuré en champs de données structurées ; la solution renvoie des réponses conversationnelles." }
    references:
      - title: "Introduction"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/1-introduction
      - title: "Creating an agent"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent

  # ------------------------------------------------------------------ 4
  - id: ai901-qz-13-04
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys builds a hands-free cooking app. The app reads each step of a recipe aloud. When the user says *next*, the app moves on to the following step.

        Which speech capabilities does the app use?
      fr: |
        Wingtip Toys crée une application de cuisine mains libres. L'application lit chaque étape d'une recette à voix haute. Quand l'utilisateur dit *suivant*, l'application passe à l'étape d'après.

        Quelles fonctionnalités vocales l'application utilise-t-elle ?
    body:
      options:
        - { id: a, text: { en: "Speech recognition to read the steps, and speech synthesis to detect the command", fr: "La reconnaissance vocale pour lire les étapes, et la synthèse vocale pour détecter la commande" } }
        - { id: b, text: { en: "A neural voice to read the steps, and batch transcription to detect the command", fr: "Une voix neuronale pour lire les étapes, et la transcription par lots pour détecter la commande" } }
        - { id: c, text: { en: "Speech synthesis to read the steps, and speech translation to detect the command", fr: "La synthèse vocale pour lire les étapes, et la traduction vocale pour détecter la commande" } }
        - { id: d, text: { en: "Speech synthesis to read the steps, and speech recognition to detect the command", fr: "La synthèse vocale pour lire les étapes, et la reconnaissance vocale pour détecter la commande" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Reading text aloud converts text into audio: that's speech synthesis (text-to-speech). Understanding the spoken command converts audio into text that the app can act on: that's speech recognition (speech-to-text), which also powers voice commands.
        fr: |
          Lire un texte à voix haute convertit du texte en audio : c'est la synthèse vocale (text-to-speech). Comprendre la commande prononcée convertit de l'audio en texte sur lequel l'application peut agir : c'est la reconnaissance vocale (speech-to-text), qui permet aussi les commandes vocales.
      options:
        a: { en: "The directions are reversed: recognition turns speech into text, and synthesis turns text into speech.", fr: "Les sens sont inversés : la reconnaissance transforme la parole en texte, et la synthèse transforme le texte en parole." }
        b: { en: "A neural voice can read the steps, but batch transcription processes stored recordings asynchronously, which is too late for a live command.", fr: "Une voix neuronale peut lire les étapes, mais la transcription par lots traite des enregistrements stockés de façon asynchrone, ce qui est trop tard pour une commande en direct." }
        c: { en: "Speech translation converts speech into another language; the command only has to be recognized.", fr: "La traduction vocale convertit la parole dans une autre langue ; la commande doit seulement être reconnue." }
    references:
      - title: "Speech synthesis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
      - title: "Speech recognition"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition

  # ------------------------------------------------------------------ 5
  - id: ai901-qz-13-05
    objective: "1.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The marketing team of Proseware has a finished illustration of the company mascot. The team wants several new pictures that show this same character in different poses, without redrawing it.

        Which capability should the team use?
      fr: |
        L'équipe marketing de Proseware dispose d'une illustration finalisée de la mascotte de l'entreprise. L'équipe veut plusieurs nouvelles images qui montrent ce même personnage dans des poses différentes, sans le redessiner.

        Quelle fonctionnalité l'équipe doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "Image-to-image generation, with the finished illustration as input", fr: "La génération image vers image, avec l'illustration finalisée en entrée" } }
        - { id: b, text: { en: "Image analysis by a vision-enabled model, with the illustration as input", fr: "L'analyse d'images par un modèle compatible avec la vision, avec l'illustration en entrée" } }
        - { id: c, text: { en: "Text-to-image generation, with a new written description as the only input", fr: "La génération texte vers image, avec une nouvelle description écrite comme seule entrée" } }
        - { id: d, text: { en: "Video generation, with the illustration as the starting point of a clip", fr: "La génération de vidéos, avec l'illustration comme point de départ d'un clip" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The output is new images, so the team needs an image-generation model. Because the new pictures must keep the existing character, the illustration must be part of the input: image-to-image generation, editing and variations, supported by the GPT-Image-1 family, start from an existing image.
        fr: |
          La sortie est de nouvelles images : l'équipe a donc besoin d'un modèle de génération d'images. Comme les nouvelles images doivent garder le personnage existant, l'illustration doit faire partie de l'entrée : la génération image vers image, la modification et les variantes, prises en charge par la famille GPT-Image-1, partent d'une image existante.
      options:
        b: { en: "A vision-enabled model reads an image and returns text about it; it doesn't create new pictures.", fr: "Un modèle compatible avec la vision lit une image et renvoie du texte à son sujet ; il ne crée pas de nouvelles images." }
        c: { en: "Without the illustration as input, the model invents a character from the description, which won't be exactly the mascot.", fr: "Sans l'illustration en entrée, le modèle invente un personnage à partir de la description, qui ne sera pas exactement la mascotte." }
        d: { en: "Video generation produces a clip, not several still pictures.", fr: "La génération de vidéos produit un clip, pas plusieurs images fixes." }
    references:
      - title: "Image generation models"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation

  # ------------------------------------------------------------------ 6
  - id: ai901-qz-13-06
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Lamna Healthcare collects free-text comments from patients and will share them with an external research partner. The solution must meet the following requirements:

        - The names, phone numbers and street addresses of the patients must be removed from each comment before it's shared.
        - For each comment, the partner must receive whether the opinion of the patient is positive, negative or neutral.
        - For each comment, the partner must receive a list of the main concepts that it discusses, such as *waiting time* or *parking*, to index the comments.

        Which three text analysis techniques should you use? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Lamna Healthcare recueille des commentaires en texte libre de patients et va les partager avec un partenaire de recherche externe. La solution doit satisfaire les exigences suivantes :

        - Les noms, numéros de téléphone et adresses postales des patients doivent être retirés de chaque commentaire avant son partage.
        - Pour chaque commentaire, le partenaire doit savoir si l'opinion du patient est positive, négative ou neutre.
        - Pour chaque commentaire, le partenaire doit recevoir une liste des principaux concepts abordés, comme *temps d'attente* ou *parking*, afin d'indexer les commentaires.

        Quelles sont les trois techniques d'analyse de texte à utiliser ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Entity detection", fr: "Détection d'entités" } }
        - { id: b, text: { en: "Key phrase extraction", fr: "Extraction d'expressions clés" } }
        - { id: c, text: { en: "Summarization", fr: "Résumé" } }
        - { id: d, text: { en: "PII detection", fr: "Détection des informations d'identification personnelle (PII)" } }
        - { id: e, text: { en: "Sentiment analysis", fr: "Analyse des sentiments" } }
        - { id: f, text: { en: "Language detection", fr: "Détection de langue" } }
    answer: { optionIds: [b, d, e] }
    explanation:
      correct:
        en: |
          PII detection identifies personal details such as names, phone numbers and street addresses, and can redact them. Sentiment analysis labels each comment as positive, negative or neutral. Key phrase extraction returns the main concepts of a text, which is what indexing needs.
        fr: |
          La détection des informations d'identification personnelle (PII) identifie les détails personnels comme les noms, numéros de téléphone et adresses postales, et peut les masquer. L'analyse des sentiments classe chaque commentaire comme positif, négatif ou neutre. L'extraction d'expressions clés renvoie les principaux concepts d'un texte, ce dont l'indexation a besoin.
      options:
        a: { en: "Entity detection returns items of known categories, such as people and places, but it doesn't redact them and doesn't return the main concepts such as waiting time.", fr: "La détection d'entités renvoie des éléments de catégories connues, comme des personnes et des lieux, mais elle ne les masque pas et ne renvoie pas les principaux concepts comme le temps d'attente." }
        c: { en: "A summary is a shorter text, not a list of concepts to index, and it doesn't remove the personal details.", fr: "Un résumé est un texte plus court, pas une liste de concepts à indexer, et il ne retire pas les détails personnels." }
        f: { en: "Language detection returns the language of each comment, which no requirement asks for.", fr: "La détection de langue renvoie la langue de chaque commentaire, ce qu'aucune exigence ne demande." }
    references:
      - title: "Understand text analysis in Foundry"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
      - title: "What is key phrase extraction in Azure Language in Foundry Tools?"
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/key-phrase-extraction/overview

  # ------------------------------------------------------------------ 7
  - id: ai901-qz-13-07
    objective: "1.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        The tourist office of Contoso films a public square with a fixed camera. The camera saves one video file for each hour of recording. For capacity planning, the office needs an estimate of the number of visitors in each file, returned as a numeric data field.

        Which approach meets the requirement?
      fr: |
        L'office de tourisme de Contoso filme une place publique avec une caméra fixe. La caméra enregistre un fichier vidéo pour chaque heure d'enregistrement. Pour planifier la capacité d'accueil, l'office a besoin d'une estimation du nombre de visiteurs dans chaque fichier, renvoyée sous forme de champ de données numérique.

        Quelle approche satisfait l'exigence ?
    body:
      options:
        - { id: a, text: { en: "Transcribe the speech of each file, then have a model generate the visitor count from the transcript.", fr: "Transcrire la parole de chaque fichier, puis faire générer le nombre de visiteurs par un modèle à partir de la transcription." } }
        - { id: b, text: { en: "Run OCR on the frames of each file, then map the text that it recognizes to a visitor count field.", fr: "Exécuter l'OCR sur les images de chaque fichier, puis associer le texte reconnu à un champ de nombre de visiteurs." } }
        - { id: c, text: { en: "Run layout analysis on each file to find the areas of the square, then return them as table rows.", fr: "Exécuter l'analyse de la disposition sur chaque fichier pour trouver les zones de la place, puis les renvoyer en lignes de tableau." } }
        - { id: d, text: { en: "Extract key frames from each file, then have a model fill in a visitor count field from what they show.", fr: "Extraire les images clés de chaque fichier, puis faire remplir un champ de nombre de visiteurs par un modèle d'après ce qu'elles montrent." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Extracting information from video combines speech transcription, key frame extraction and shot detection; a generative model then fills in the fields of a schema from what the frames show. Visitors are seen, not heard, so the count must come from the key frames, and a schema field returns it as structured data.
        fr: |
          Extraire des informations d'une vidéo combine la transcription de la parole, l'extraction d'images clés et la détection des plans ; un modèle génératif remplit ensuite les champs d'un schéma d'après ce que montrent les images. Les visiteurs sont vus, pas entendus : le nombre doit donc venir des images clés, et un champ de schéma le renvoie sous forme de données structurées.
      options:
        a: { en: "A transcript holds only what is said; most visitors of a square never speak near the camera, so the count can't come from it.", fr: "Une transcription ne contient que ce qui est dit ; la plupart des visiteurs d'une place ne parlent jamais près de la caméra, donc le nombre ne peut pas en venir." }
        b: { en: "OCR reads text, such as signs; the number of visitors isn't written anywhere in the frames.", fr: "L'OCR lit du texte, comme des panneaux ; le nombre de visiteurs n'est écrit nulle part dans les images." }
        c: { en: "Layout analysis finds paragraphs and tables in documents; it doesn't count people in a video.", fr: "L'analyse de la disposition trouve les paragraphes et les tableaux des documents ; elle ne compte pas les personnes d'une vidéo." }
    references:
      - title: "Azure Content Understanding in Foundry Tools video overview"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
      - title: "Introduction"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/1-introduction

  # ------------------------------------------------------------------ 8
  - id: ai901-qz-13-08
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam is designing four features for its furniture app, described in the answer area. Each feature must use the type of model whose output matches what the feature returns.

        Which type of model should each feature use? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam conçoit quatre fonctionnalités pour son application d'ameublement, décrites dans la zone de réponse. Chaque fonctionnalité doit utiliser le type de modèle dont la sortie correspond à ce que renvoie la fonctionnalité.

        Quel type de modèle chaque fonctionnalité doit-elle utiliser ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A customer uploads a photo of a living room, and the app says in which style the room is furnished: [[f1]]

          A customer uploads a photo of a bedroom, and the app shows the same bedroom with green walls: [[f2]]

          The catalog team uploads a photo of a new sofa, and the app writes the catalog description of the sofa: [[f3]]

          A designer types the description of an armchair that doesn't exist yet, and the app shows what it would look like: [[f4]]
        fr: |
          Un client charge une photo d'un salon, et l'application indique dans quel style la pièce est meublée : [[f1]]

          Un client charge une photo d'une chambre, et l'application montre la même chambre avec des murs verts : [[f2]]

          L'équipe catalogue charge une photo d'un nouveau canapé, et l'application rédige la description du canapé pour le catalogue : [[f3]]

          Un designer tape la description d'un fauteuil qui n'existe pas encore, et l'application montre à quoi il ressemblerait : [[f4]]
      slots:
        - id: f1
          options:
            - { id: vis, text: { en: "A vision-enabled multimodal model", fr: "Un modèle multimodal compatible avec la vision" } }
            - { id: img, text: { en: "An image-generation model", fr: "Un modèle de génération d'images" } }
            - { id: vid, text: { en: "A video-generation model", fr: "Un modèle de génération de vidéos" } }
        - id: f2
          options:
            - { id: vis, text: { en: "A vision-enabled multimodal model", fr: "Un modèle multimodal compatible avec la vision" } }
            - { id: img, text: { en: "An image-generation model", fr: "Un modèle de génération d'images" } }
            - { id: vid, text: { en: "A video-generation model", fr: "Un modèle de génération de vidéos" } }
        - id: f3
          options:
            - { id: vis, text: { en: "A vision-enabled multimodal model", fr: "Un modèle multimodal compatible avec la vision" } }
            - { id: img, text: { en: "An image-generation model", fr: "Un modèle de génération d'images" } }
            - { id: vid, text: { en: "A video-generation model", fr: "Un modèle de génération de vidéos" } }
        - id: f4
          options:
            - { id: vis, text: { en: "A vision-enabled multimodal model", fr: "Un modèle multimodal compatible avec la vision" } }
            - { id: img, text: { en: "An image-generation model", fr: "Un modèle de génération d'images" } }
            - { id: vid, text: { en: "A video-generation model", fr: "Un modèle de génération de vidéos" } }
    answer:
      values: { f1: vis, f2: img, f3: vis, f4: img }
    explanation:
      correct:
        en: |
          Decide by the output, not by the input. Identifying the style of a room and writing a description from a photo both turn an image into text: that's image analysis by a vision-enabled multimodal model, even though the description is newly written. Showing the bedroom with green walls returns a new image from an existing one (image-to-image editing), and showing an armchair from a description is text-to-image generation: both need an image-generation model.
        fr: |
          Décidez d'après la sortie, pas d'après l'entrée. Identifier le style d'une pièce et rédiger une description à partir d'une photo transforment tous deux une image en texte : c'est l'analyse d'images par un modèle multimodal compatible avec la vision, même si la description est nouvellement rédigée. Montrer la chambre avec des murs verts renvoie une nouvelle image à partir d'une image existante (modification image vers image), et montrer un fauteuil à partir d'une description relève de la génération texte vers image : les deux demandent un modèle de génération d'images.
      options:
        img: { en: "For the style and the sofa description, the output is text; an image-generation model creates images and doesn't describe them.", fr: "Pour le style et la description du canapé, la sortie est du texte ; un modèle de génération d'images crée des images et ne les décrit pas." }
        vis: { en: "For the green walls and the armchair, the output is a new image; a vision-enabled model reads images but doesn't create them.", fr: "Pour les murs verts et le fauteuil, la sortie est une nouvelle image ; un modèle compatible avec la vision lit des images mais n'en crée pas." }
        vid: { en: "No feature returns a video; every output is a text or a still image.", fr: "Aucune fonctionnalité ne renvoie de vidéo ; chaque sortie est un texte ou une image fixe." }
    references:
      - title: "Multimodal models for image analysis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/2-vision-enabled-models
      - title: "Image generation models"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-vision-azure/3-image-generation

  # ------------------------------------------------------------------ 9
  - id: ai901-qz-13-09
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Media has three requirements:

        1. During live news shows, subtitles must show what the presenters say while they're speaking.
        2. Ten years of archived shows, stored as audio files in Azure Storage, must be transcribed. The transcripts are needed within a month.
        3. Weather bulletins written by editors must be broadcast as speech that sounds natural.

        Which capabilities of Azure Speech in Foundry Tools should Northwind Media use for requirements 1, 2 and 3, in this order?
      fr: |
        Northwind Media a trois exigences :

        1. Pendant les journaux télévisés en direct, des sous-titres doivent afficher ce que disent les présentateurs pendant qu'ils parlent.
        2. Dix ans d'émissions archivées, stockées sous forme de fichiers audio dans Stockage Azure, doivent être transcrites. Les transcriptions sont attendues sous un mois.
        3. Les bulletins météo rédigés par les journalistes doivent être diffusés sous forme de parole au rendu naturel.

        Quelles fonctionnalités d'Azure Speech dans Foundry Tools Northwind Media doit-elle utiliser pour les exigences 1, 2 et 3, dans cet ordre ?
    body:
      options:
        - { id: a, text: { en: "Batch transcription; real-time transcription; speech synthesis with a neural voice", fr: "Transcription par lots ; transcription en temps réel ; synthèse vocale avec une voix neuronale" } }
        - { id: b, text: { en: "Real-time transcription; batch transcription; speech synthesis with a neural voice", fr: "Transcription en temps réel ; transcription par lots ; synthèse vocale avec une voix neuronale" } }
        - { id: c, text: { en: "Real-time transcription; batch transcription; speech recognition with a custom voice", fr: "Transcription en temps réel ; transcription par lots ; reconnaissance vocale avec une voix personnalisée" } }
        - { id: d, text: { en: "Speech synthesis with a neural voice; batch transcription; speech translation", fr: "Synthèse vocale avec une voix neuronale ; transcription par lots ; traduction vocale" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Live subtitles are speech recognition on an audio stream: real-time transcription returns the text while the presenter speaks. Stored recordings with no urgency suit batch transcription, which processes the files asynchronously. Broadcasting written text as speech is speech synthesis, and neural voices give it a natural intonation.
        fr: |
          Des sous-titres en direct relèvent de la reconnaissance vocale sur un flux audio : la transcription en temps réel renvoie le texte pendant que le présentateur parle. Des enregistrements stockés sans urgence conviennent à la transcription par lots, qui traite les fichiers de façon asynchrone. Diffuser un texte écrit sous forme de parole relève de la synthèse vocale, et les voix neuronales lui donnent une intonation naturelle.
      options:
        a: { en: "Batch transcription returns its results asynchronously, too late for live subtitles.", fr: "La transcription par lots renvoie ses résultats de façon asynchrone, trop tard pour des sous-titres en direct." }
        c: { en: "A custom voice is a speech synthesis feature, and the bulletins need text to be turned into speech, not speech to be recognized.", fr: "Une voix personnalisée est une fonctionnalité de synthèse vocale, et les bulletins exigent de transformer du texte en parole, pas de reconnaître de la parole." }
        d: { en: "Subtitles are text produced from speech, which is recognition, not synthesis; and the bulletins aren't translated into another language.", fr: "Les sous-titres sont du texte produit à partir de la parole, ce qui relève de la reconnaissance, pas de la synthèse ; et les bulletins ne sont pas traduits dans une autre langue." }
    references:
      - title: "Speech recognition"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
      - title: "Speech synthesis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis

  # ------------------------------------------------------------------ 10
  - id: ai901-qz-13-10
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum Insurance records the phone calls of its claims department and plans four features, described in the answer area.

        Which AI workload does each feature represent? To answer, drag the appropriate workloads to the correct features. Each workload may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Insurance enregistre les appels téléphoniques de son service des sinistres et prévoit quatre fonctionnalités, décrites dans la zone de réponse.

        Quelle charge de travail d'IA chaque fonctionnalité représente-t-elle ? Pour répondre, faites glisser les charges de travail appropriées vers les fonctionnalités correspondantes. Chaque charge de travail peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: gen, text: { en: "Generative AI", fr: "IA générative" } }
        - { id: agent, text: { en: "Agentic AI", fr: "IA agentique" } }
        - { id: text, text: { en: "Text analysis", fr: "Analyse de texte" } }
        - { id: speech, text: { en: "Speech", fr: "Reconnaissance et synthèse vocales (speech)" } }
        - { id: vision, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
        - { id: ie, text: { en: "Information extraction", fr: "Extraction d'informations" } }
      targets:
        - { id: t1, text: { en: "Produce a word-for-word written record of each recorded call, for the claim file.", fr: "Produire un compte rendu écrit mot pour mot de chaque appel enregistré, pour le dossier de sinistre." } }
        - { id: t2, text: { en: "Return the policy number, the type of damage and the callback date of each recorded call as data fields.", fr: "Renvoyer le numéro de contrat, le type de dommage et la date de rappel de chaque appel enregistré sous forme de champs de données." } }
        - { id: t3, text: { en: "When a customer asks for it, check the claim in the claims system and book a repair with a partner garage.", fr: "Quand un client le demande, vérifier le sinistre dans le système de gestion des sinistres et réserver une réparation auprès d'un garage partenaire." } }
        - { id: t4, text: { en: "Write a letter to the customer that explains the decision on the claim, from the notes of the adjuster.", fr: "Rédiger une lettre au client qui explique la décision sur le sinistre, à partir des notes de l'expert." } }
    answer:
      mapping: { t1: speech, t2: ie, t3: agent, t4: gen }
    explanation:
      correct:
        en: |
          A word-for-word transcript of a call is speech recognition. Returning named values from the same recordings turns unstructured audio into structured data: that's information extraction. Checking a system and booking a repair requires tools and actions, which makes it agentic AI. Writing a new letter from notes is content creation: generative AI.
        fr: |
          Une transcription mot pour mot d'un appel relève de la reconnaissance vocale. Renvoyer des valeurs nommées à partir des mêmes enregistrements transforme de l'audio non structuré en données structurées : c'est de l'extraction d'informations. Vérifier un système et réserver une réparation demande des outils et des actions, ce qui en fait de l'IA agentique. Rédiger une nouvelle lettre à partir de notes, c'est créer du contenu : de l'IA générative.
      options:
        text: { en: "Text analysis extracts meaning, such as sentiment or entities, from written text; no feature asks for it, and the field values come from audio.", fr: "L'analyse de texte extrait le sens, comme les sentiments ou les entités, d'un texte écrit ; aucune fonctionnalité ne la demande, et les valeurs des champs viennent de l'audio." }
        vision: { en: "No feature works with images or video.", fr: "Aucune fonctionnalité ne travaille avec des images ou des vidéos." }
        speech: { en: "For the data fields, a transcript alone isn't enough: the values must be returned under named fields, which is information extraction.", fr: "Pour les champs de données, une transcription seule ne suffit pas : les valeurs doivent être renvoyées sous des champs nommés, ce qui relève de l'extraction d'informations." }
    references:
      - title: "Introduction"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-information-extraction/1-introduction
      - title: "Creating an agent"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-with-generative-ai-and-agents/4-creating-an-agent
