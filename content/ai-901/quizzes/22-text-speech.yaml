  # ------------------------------------------------------------------ 10
  - id: ai901-qz-22-10
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank plans three features for its customer service, all built on its Foundry resource:

        - Every night, transcribe about 20,000 call recordings stored in Azure Storage. Nobody waits for the results: the transcripts are needed only the next morning.
        - On the phone hotline, understand a question that a customer asks aloud and answer it aloud, in a single call per question.
        - Before a transcript is archived, hide the names and phone numbers it contains, with the same result at every run.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank prévoit trois fonctionnalités pour son service client, toutes basées sur sa ressource Foundry :

        - Chaque nuit, transcrire environ 20 000 enregistrements d'appels stockés dans Stockage Azure. Personne n'attend les résultats : les transcriptions ne sont nécessaires que le lendemain matin.
        - Sur la ligne d'assistance téléphonique, comprendre une question qu'un client pose à l'oral et y répondre à l'oral, en un seul appel par question.
        - Avant l'archivage d'une transcription, masquer les noms et les numéros de téléphone qu'elle contient, avec le même résultat à chaque exécution.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To transcribe the stored recordings, use [[night]].

          To answer the spoken questions of the hotline, use [[hotline]].

          To hide the names and phone numbers, use [[mask]].
        fr: |
          Pour transcrire les enregistrements stockés, utilisez [[night]].

          Pour répondre aux questions orales de la ligne d'assistance, utilisez [[hotline]].

          Pour masquer les noms et les numéros de téléphone, utilisez [[mask]].
      slots:
        - id: night
          options:
            - { id: batch, text: { en: "the batch transcription of Azure Speech", fr: "la transcription par lots d'Azure Speech" } }
            - { id: realtime, text: { en: "a `SpeechRecognizer` object that reads the default microphone", fr: "un objet `SpeechRecognizer` qui lit le microphone par défaut" } }
            - { id: nightmodel, text: { en: "`gpt-audio-mini`, with each recording in an `input_audio` part", fr: "`gpt-audio-mini`, avec chaque enregistrement dans une partie `input_audio`" } }
        - id: hotline
          options:
            - { id: synth, text: { en: "a `SpeechSynthesizer` object that reads the question aloud", fr: "un objet `SpeechSynthesizer` qui lit la question à voix haute" } }
            - { id: voicemodel, text: { en: "`gpt-audio-mini`, with `modalities=[\"text\", \"audio\"]`", fr: "`gpt-audio-mini`, avec `modalities=[\"text\", \"audio\"]`" } }
            - { id: hotbatch, text: { en: "the batch transcription of Azure Speech", fr: "la transcription par lots d'Azure Speech" } }
        - id: mask
          options:
            - { id: prompt, text: { en: "a general-purpose model with the prompt *Remove all names and phone numbers*", fr: "un modèle à usage général avec l'invite *Remove all names and phone numbers*" } }
            - { id: detect, text: { en: "the `detect_language` method of `TextAnalyticsClient`", fr: "la méthode `detect_language` de `TextAnalyticsClient`" } }
            - { id: pii, text: { en: "the `recognize_pii_entities` method of `TextAnalyticsClient`", fr: "la méthode `recognize_pii_entities` de `TextAnalyticsClient`" } }
    answer:
      values: { night: batch, hotline: voicemodel, mask: pii }
    explanation:
      correct:
        en: |
          Large volumes of stored recordings processed asynchronously call for Azure Speech batch transcription: you point to the files, for example with a SAS URI, and collect the results later. Understanding a spoken question and answering it aloud in one call is the job of an audio-enabled multimodal model that returns text and audio. A masked text that is identical at every run comes from Azure Language, whose `recognize_pii_entities` method returns the redacted text.
        fr: |
          De gros volumes d'enregistrements stockés, traités de façon asynchrone, appellent la transcription par lots d'Azure Speech : vous indiquez les fichiers, par exemple avec un URI SAS, et récupérez les résultats plus tard. Comprendre une question orale et y répondre à l'oral en un seul appel est le rôle d'un modèle multimodal compatible avec l'audio qui renvoie du texte et de l'audio. Un texte masqué identique à chaque exécution vient d'Azure Language, dont la méthode `recognize_pii_entities` renvoie le texte masqué.
      options:
        realtime: { en: "Real-time recognition processes live audio from the microphone; it doesn't process stored recordings in bulk.", fr: "La reconnaissance en temps réel traite l'audio en direct du microphone ; elle ne traite pas des enregistrements stockés en masse." }
        nightmodel: { en: "The model answers one request at a time about a recording; transcribing large volumes of stored audio in batch is a job for Azure Speech.", fr: "Le modèle répond à une requête à la fois sur un enregistrement ; transcrire par lots de gros volumes d'audio stocké relève d'Azure Speech." }
        hotbatch: { en: "Batch transcription only returns text, later and asynchronously; it can't answer a caller during the call.", fr: "La transcription par lots ne renvoie que du texte, plus tard et de façon asynchrone ; elle ne peut pas répondre à un appelant pendant l'appel." }
        synth: { en: "A synthesizer only turns a given text into speech; it doesn't understand the question or produce an answer.", fr: "Un synthétiseur ne fait que convertir un texte donné en parole ; il ne comprend pas la question et ne produit pas de réponse." }
        prompt: { en: "A prompt can remove personal data, but the output of a generative model can vary between runs.", fr: "Une invite peut retirer les données personnelles, mais la sortie d'un modèle génératif peut varier d'une exécution à l'autre." }
        detect: { en: "`detect_language` returns the language of the text, not a redacted version of it.", fr: "`detect_language` renvoie la langue du texte, pas une version masquée de celui-ci." }
    references:
      - title: "Speech recognition"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
      - title: "Quickstart: Get started with Azure OpenAI audio generation"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart
