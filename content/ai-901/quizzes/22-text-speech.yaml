    stem:
      en: |
        Tailspin Toys adapted a sample of the Azure Speech SDK to build an application that must transcribe a voicemail stored in the file **voicemail.wav** and keep the text in the list `transcript`. The current code is shown in the answer area.

        Answer each prompt by selecting the appropriate line of code.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys a adapté un exemple du SDK Azure Speech pour créer une application qui doit transcrire un message vocal stocké dans le fichier **voicemail.wav** et conserver le texte dans la liste `transcript`. Le code actuel est présenté dans la zone de réponse.

        Répondez à chaque consigne en sélectionnant la ligne de code appropriée.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The line that you must change so that the application transcribes voicemail.wav", fr: "La ligne à modifier pour que l'application transcrive voicemail.wav" }
        - id: p2
          text: { en: "The line that you can delete without changing the text stored in `transcript`", fr: "La ligne que vous pouvez supprimer sans changer le texte stocké dans `transcript`" }
      grid:
        header:
          - { en: "Line", fr: "Ligne" }
          - "Code"
        rows:
          - - text: "1"
            - text: "`speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)`"
              area: l1
          - - text: "2"
            - text: "`speech_config.speech_synthesis_voice_name = \"en-US-Ava:DragonHDLatestNeural\"`"
              area: l2
          - - text: "3"
            - text: "`audio_in = speechsdk.audio.AudioConfig(use_default_microphone=True)`"
              area: l3
          - - text: "4"
            - text: "`recognizer = speechsdk.SpeechRecognizer(speech_config=speech_config, audio_config=audio_in)`"
              area: l4
          - - text: "5"
            - text: "`recognizer.recognized.connect(lambda evt: transcript.append(evt.result.text))`"
              area: l5
          - - text: "6"
            - text: "`recognizer.start_continuous_recognition()`"
              area: l6
    answer:
      values: { p1: l3, p2: l2 }
    explanation:
      correct:
        en: |
          The source of the audio to recognize is set by the `AudioConfig` object on line 3: it must point to the file, with `filename="voicemail.wav"`, instead of the default microphone. Line 2 sets the voice of speech synthesis; a transcription application has no synthesizer, so the line has no effect on the stored text. The other lines connect to the resource, create the recognizer, store each recognized phrase and start the recognition.
        fr: |
          La source de l'audio à reconnaître est définie par l'objet `AudioConfig` de la ligne 3 : il doit pointer vers le fichier, avec `filename="voicemail.wav"`, au lieu du microphone par défaut. La ligne 2 fixe la voix de la synthèse vocale ; une application de transcription n'a pas de synthétiseur : la ligne n'a donc aucun effet sur le texte stocké. Les autres lignes se connectent à la ressource, créent le module de reconnaissance, stockent chaque phrase reconnue et démarrent la reconnaissance.
      options:
