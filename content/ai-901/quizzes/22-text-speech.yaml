chapter: 22-text-speech
questions:
  # ------------------------------------------------------------------ 1
  - id: ai901-qz-22-01
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Before writing any code, a developer at Litware wants to check how Azure Speech in Foundry Tools transcribes a recording of a team meeting.

        Which playground of the Foundry portal should the developer open?
      fr: |
        Avant d'écrire du code, un développeur de Litware veut vérifier comment Azure Speech dans Foundry Tools transcrit l'enregistrement d'une réunion d'équipe.

        Quel terrain de jeu du portail Foundry le développeur doit-il ouvrir ?
    body:
      options:
        - { id: a, text: "Azure Speech - Text to Speech" }
        - { id: b, text: { en: "The Language playground", fr: "Le terrain de jeu Language" } }
        - { id: c, text: "Azure Speech - Speech to Text" }
        - { id: d, text: { en: "The agents playground", fr: "Le terrain de jeu des agents" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Transcription is speech recognition: audio in, text out. In the **Azure Speech - Speech to Text** playground, under **Build** > **Models** > **AI services**, you upload an audio file or record yourself, and Azure Speech returns its transcription.
        fr: |
          La transcription relève de la reconnaissance vocale : de l'audio en entrée, du texte en sortie. Dans le terrain de jeu **Azure Speech - Speech to Text**, sous **Build** > **Models** > **AI services**, vous chargez un fichier audio ou vous vous enregistrez, et Azure Speech renvoie sa transcription.
      options:
        a: { en: "The Text to Speech playground does the opposite: you choose a voice, adjust its speed and pitch, and listen to a text.", fr: "Le terrain de jeu Text to Speech fait l'inverse : vous choisissez une voix, réglez sa vitesse et sa hauteur, et écoutez un texte." }
        b: { en: "The Language playground tests Azure Language on written text, such as language or PII detection; it doesn't transcribe audio.", fr: "Le terrain de jeu Language teste Azure Language sur du texte écrit, comme la détection de la langue ou des données personnelles ; il ne transcrit pas d'audio." }
        d: { en: "The agents playground tests an agent with its instructions, tools and knowledge; it doesn't test Azure Speech transcription.", fr: "Le terrain de jeu des agents teste un agent avec ses instructions, ses outils et ses connaissances ; il ne teste pas la transcription d'Azure Speech." }
    references:
      - title: "Speech recognition"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition

  # ------------------------------------------------------------------ 2
  - id: ai901-qz-22-02
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        In the Foundry portal, you add the **Azure Language in Foundry Tools** tool to an agent that triages customer e-mails.

        What does the tool connect the agent to?
      fr: |
        Dans le portail Foundry, vous ajoutez l'outil **Azure Language in Foundry Tools** à un agent qui trie les e-mails des clients.

        À quoi l'outil connecte-t-il l'agent ?
    body:
      options:
        - { id: a, text: { en: "The Azure Language REST API, called by the code of the agent", fr: "L'API REST Azure Language, appelée par le code de l'agent" } }
        - { id: b, text: { en: "A new Azure Language resource that the portal creates", fr: "Une nouvelle ressource Azure Language que le portail crée" } }
        - { id: c, text: { en: "A search index built from the Azure Language documentation", fr: "Un index de recherche créé à partir de la documentation d'Azure Language" } }
        - { id: d, text: { en: "The Azure Language MCP server, through the Foundry resource", fr: "Le serveur MCP Azure Language, via la ressource Foundry" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The tool connects the agent to the Azure Language MCP server, a managed service that exposes Azure Language capabilities through the Model Context Protocol. You configure the connection with the name of your Foundry resource, and the agent combines the structured analysis of the tool with the reasoning of its model.
        fr: |
          L'outil connecte l'agent au serveur MCP Azure Language, un service managé qui expose les fonctionnalités d'Azure Language via le protocole MCP (Model Context Protocol). Vous configurez la connexion avec le nom de votre ressource Foundry, et l'agent combine l'analyse structurée de l'outil avec le raisonnement de son modèle.
      options:
        a: { en: "With the tool, the agent code doesn't call the Azure Language REST API or manage authentication tokens itself.", fr: "Avec l'outil, le code de l'agent n'appelle pas lui-même l'API REST Azure Language et ne gère pas les jetons d'authentification." }
        b: { en: "No separate Azure Language resource is needed: the MCP server is reached through the existing Foundry resource.", fr: "Aucune ressource Azure Language distincte n'est nécessaire : le serveur MCP est joint via la ressource Foundry existante." }
        c: { en: "A search index is what knowledge adds to an agent; the Azure Language tool analyzes text instead of searching documents.", fr: "Un index de recherche est ce que les connaissances ajoutent à un agent ; l'outil Azure Language analyse du texte au lieu de chercher dans des documents." }
    references:
      - title: "Use Azure Language with an agent"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/4-language-mcp

  # ------------------------------------------------------------------ 3
  - id: ai901-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A Python application sends questions recorded as WAV files to a deployed `gpt-audio-mini` model through the Chat Completions API. The model must reply with speech, and the spoken reply must be saved as an MP3 file.

        Which format values should the request contain?
      fr: |
        Une application Python envoie des questions enregistrées dans des fichiers WAV à un modèle `gpt-audio-mini` déployé, via l'API Chat Completions. Le modèle doit répondre à l'oral, et la réponse parlée doit être enregistrée dans un fichier MP3.

        Quelles valeurs de format la requête doit-elle contenir ?
    body:
      options:
        - { id: a, text: { en: "`\"wav\"` in the `audio` parameter and `\"mp3\"` in the `input_audio` part", fr: "`\"wav\"` dans le paramètre `audio` et `\"mp3\"` dans la partie `input_audio`" } }
        - { id: b, text: { en: "`\"mp3\"` in the `audio` parameter and `\"wav\"` in the `input_audio` part", fr: "`\"mp3\"` dans le paramètre `audio` et `\"wav\"` dans la partie `input_audio`" } }
        - { id: c, text: { en: "`\"mp3\"` in the `audio` parameter and `\"mp3\"` in the `input_audio` part", fr: "`\"mp3\"` dans le paramètre `audio` et `\"mp3\"` dans la partie `input_audio`" } }
        - { id: d, text: { en: "`\"wav\"` in the `audio` parameter and `\"wav\"` in the `input_audio` part", fr: "`\"wav\"` dans le paramètre `audio` et `\"wav\"` dans la partie `input_audio`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The two format values describe two different audio streams. The `format` of the `input_audio` part describes the recording that you send, here WAV. The `audio` parameter sets the voice and the format of the spoken answer that the model returns, here MP3, one of the supported output formats.
        fr: |
          Les deux valeurs de format décrivent deux flux audio différents. Le `format` de la partie `input_audio` décrit l'enregistrement que vous envoyez, ici du WAV. Le paramètre `audio` fixe la voix et le format de la réponse parlée que le modèle renvoie, ici du MP3, l'un des formats de sortie pris en charge.
      options:
        a: { en: "This swaps the two values: the recording is WAV, so `input_audio` says `wav`, and the answer must be MP3, so `audio` says `mp3`.", fr: "Les deux valeurs sont inversées : l'enregistrement est en WAV, donc `input_audio` indique `wav`, et la réponse doit être en MP3, donc `audio` indique `mp3`." }
        c: { en: "The recording is a WAV file; declaring it as MP3 in `input_audio` describes the input wrongly.", fr: "L'enregistrement est un fichier WAV ; le déclarer en MP3 dans `input_audio` décrit mal l'entrée." }
        d: { en: "With `wav` in the `audio` parameter, the model returns the spoken answer as WAV, not as the required MP3.", fr: "Avec `wav` dans le paramètre `audio`, le modèle renvoie la réponse parlée en WAV, et non en MP3 comme demandé." }
    references:
      - title: "Quickstart: Get started with Azure OpenAI audio generation"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart

  # ------------------------------------------------------------------ 4
  - id: ai901-qz-22-04
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys sells toys in several countries and sorts the reviews of its online store by language before its regional teams read them. A scheduled job runs the following Python code every night on the reviews of the day. `client` is a `TextAnalyticsClient` object.

        ```python
        reviews = ["Great toy, my son loves it.", "El envío fue muy lento.", "Jouet cassé à la livraison."]

        results = client.detect_language(reviews)
        for result in results:
            print(result.primary_language.iso6391_name, result.primary_language.confidence_score)
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys vend des jouets dans plusieurs pays et trie les avis de sa boutique en ligne par langue avant que ses équipes régionales ne les lisent. Une tâche planifiée exécute chaque nuit le code Python suivant sur les avis du jour. `client` est un objet `TextAnalyticsClient`.

        ```python
        reviews = ["Great toy, my son loves it.", "El envío fue muy lento.", "Jouet cassé à la livraison."]

        results = client.detect_language(reviews)
        for result in results:
            print(result.primary_language.iso6391_name, result.primary_language.confidence_score)
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The three reviews are analyzed in a single call to `detect_language`.", fr: "Les trois avis sont analysés en un seul appel à `detect_language`." }
        - id: s2
          text: { en: "The loop displays one language code and one score per review.", fr: "La boucle affiche un code de langue et un score par avis." }
        - id: s3
          text: { en: "Run on the same three reviews the next night, the code can display other language codes.", fr: "Exécuté la nuit suivante sur les trois mêmes avis, le code peut afficher d'autres codes de langue." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          `detect_language` takes a list of texts and returns one result per text, so one call analyzes the three reviews and the loop prints a two-letter ISO 639-1 code and a confidence score for each one. Azure Language analyzers return structured, deterministic output: the same texts give the same codes at every run, which is why an automated pipeline can rely on them.
        fr: |
          `detect_language` prend une liste de textes et renvoie un résultat par texte : un seul appel analyse donc les trois avis, et la boucle affiche pour chacun un code ISO 639-1 à deux lettres et un score de confiance. Les analyseurs d'Azure Language renvoient une sortie structurée et déterministe : les mêmes textes donnent les mêmes codes à chaque exécution, et c'est pourquoi un pipeline automatisé peut s'appuyer dessus.
      options:
        s3: { en: "Results that vary between calls are typical of a general-purpose model driven by a prompt, not of Azure Language.", fr: "Des résultats qui varient d'un appel à l'autre sont typiques d'un modèle à usage général piloté par une invite, pas d'Azure Language." }
    references:
      - title: "Create a client application that analyzes text"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk
      - title: "Understand text analysis in Foundry"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language

  # ------------------------------------------------------------------ 5
  - id: ai901-qz-22-05
    objective: "2.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A kiosk application of Northwind Traders uses the Azure Speech SDK. It creates a `SpeechConfig` object, an `AudioConfig` object for the default microphone and a `SpeechRecognizer` object, and displays the order that a customer dictates.

        The kiosk must now also read a confirmation aloud through its default speaker.

        What should you add to the application?
      fr: |
        Une application de borne de Northwind Traders utilise le SDK Azure Speech. Elle crée un objet `SpeechConfig`, un objet `AudioConfig` pour le microphone par défaut et un objet `SpeechRecognizer`, et affiche la commande qu'un client dicte.

        La borne doit maintenant aussi lire une confirmation à voix haute sur son haut-parleur par défaut.

        Que devez-vous ajouter à l'application ?
    body:
      options:
        - { id: a, text: { en: "A `SpeechSynthesizer` object that uses the existing `AudioConfig` object", fr: "Un objet `SpeechSynthesizer` qui utilise l'objet `AudioConfig` existant" } }
        - { id: b, text: { en: "A second `SpeechRecognizer` object that uses an `AudioOutputConfig` object", fr: "Un second objet `SpeechRecognizer` qui utilise un objet `AudioOutputConfig`" } }
        - { id: c, text: { en: "A `SpeechSynthesizer` object that uses a new `AudioOutputConfig` object", fr: "Un objet `SpeechSynthesizer` qui utilise un nouvel objet `AudioOutputConfig`" } }
        - { id: d, text: { en: "A second `SpeechConfig` object that connects to a separate Speech resource", fr: "Un second objet `SpeechConfig` qui se connecte à une ressource Speech distincte" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Reading a text aloud is speech synthesis: a `SpeechSynthesizer` object converts the text to audio, and an `AudioOutputConfig` object with `use_default_speaker=True` sends that audio to the speaker. The existing `SpeechConfig` object already holds the endpoint and the key of the Foundry resource and can also carry the voice name.
        fr: |
          Lire un texte à voix haute relève de la synthèse vocale : un objet `SpeechSynthesizer` convertit le texte en audio, et un objet `AudioOutputConfig` avec `use_default_speaker=True` envoie cet audio vers le haut-parleur. L'objet `SpeechConfig` existant contient déjà le point de terminaison et la clé de la ressource Foundry et peut aussi porter le nom de la voix.
      options:
        a: { en: "`AudioConfig` describes an audio input, here the microphone; the synthesizer needs an output, described by `AudioOutputConfig`.", fr: "`AudioConfig` décrit une entrée audio, ici le microphone ; le synthétiseur a besoin d'une sortie, décrite par `AudioOutputConfig`." }
        b: { en: "A `SpeechRecognizer` turns audio into text; a second one can't read a confirmation aloud.", fr: "Un `SpeechRecognizer` convertit de l'audio en texte ; un second ne peut pas lire une confirmation à voix haute." }
        d: { en: "Recognition and synthesis are both provided by Azure Speech through the same Foundry resource, so one `SpeechConfig` object is enough.", fr: "La reconnaissance et la synthèse sont toutes deux fournies par Azure Speech via la même ressource Foundry : un seul objet `SpeechConfig` suffit." }
    references:
      - title: "Speech synthesis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis
      - title: "Speech recognition"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition

  # ------------------------------------------------------------------ 6
  - id: ai901-qz-22-06
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum Insurance analyzes the transcripts of its customer calls. The team plans four features. Some results feed an automated pipeline; others are read by claims handlers.

        What should you use for each feature? To answer, drag the appropriate solutions to the correct features. Each solution may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Insurance analyse les transcriptions des appels de ses clients. L'équipe prévoit quatre fonctionnalités. Certains résultats alimentent un pipeline automatisé ; d'autres sont lus par des gestionnaires de sinistres.

        Que devez-vous utiliser pour chaque fonctionnalité ? Pour répondre, faites glisser les solutions appropriées vers les fonctionnalités correspondantes. Chaque solution peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: lang, text: "Azure Language in Foundry Tools" }
        - { id: model, text: { en: "A general-purpose model called through the Responses API", fr: "Un modèle à usage général appelé via l'API Responses" } }
        - { id: speech, text: "Azure Speech in Foundry Tools" }
      targets:
        - { id: t1, text: { en: "Return every person name, phone number and address in a transcript, each with its category and a confidence score, for the pipeline", fr: "Renvoyer chaque nom de personne, numéro de téléphone et adresse d'une transcription, chacun avec sa catégorie et un score de confiance, pour le pipeline" } }
        - { id: t2, text: { en: "Explain to a claims handler, in a short paragraph, why the customer sounds dissatisfied", fr: "Expliquer à un gestionnaire de sinistres, en un court paragraphe, pourquoi le client semble mécontent" } }
        - { id: t3, text: { en: "Describe, for a claims handler, what each person named in the transcript asked for", fr: "Décrire, pour un gestionnaire de sinistres, ce que chaque personne nommée dans la transcription a demandé" } }
        - { id: t4, text: { en: "Return the ISO 639-1 code of the language of each transcript, identical at every run, for the pipeline", fr: "Renvoyer le code ISO 639-1 de la langue de chaque transcription, identique à chaque exécution, pour le pipeline" } }
    answer:
      mapping: { t1: lang, t2: model, t3: model, t4: lang }
    explanation:
      correct:
        en: |
          Both solutions can find entities or judge sentiment: the form of the output decides. The pipeline needs consistent, structured values, so Azure Language fits: `recognize_pii_entities` returns entities with a category and a confidence score, and `detect_language` returns the ISO 639-1 code. A free-form explanation or account written for a person fits a general-purpose model driven by a prompt.
        fr: |
          Les deux solutions savent trouver des entités ou juger un sentiment : c'est la forme de la sortie qui décide. Le pipeline a besoin de valeurs régulières et structurées : Azure Language convient, car `recognize_pii_entities` renvoie des entités avec une catégorie et un score de confiance, et `detect_language` renvoie le code ISO 639-1. Une explication ou un compte rendu en texte libre, écrit pour une personne, convient à un modèle à usage général piloté par une invite.
      options:
        t3: { en: "Finding the people is entity detection, but describing what each one asked for is free-form text, which Azure Language doesn't write.", fr: "Trouver les personnes relève de la détection d'entités, mais décrire ce que chacune a demandé est du texte libre, qu'Azure Language ne rédige pas." }
        speech: { en: "Azure Speech converts between audio and text; the transcripts are already text, so it plays no part in these features.", fr: "Azure Speech convertit entre audio et texte ; les transcriptions sont déjà du texte : il ne joue donc aucun rôle dans ces fonctionnalités." }
    references:
      - title: "Understand text analysis in Foundry"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/2-azure-language
      - title: "Create a client application that analyzes text"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-text-analysis-azure/3-language-sdk

  # ------------------------------------------------------------------ 7
  - id: ai901-qz-22-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        The IT helpdesk of Contoso receives voicemails from employees and wants a short written summary of each problem in its ticketing tool. Contoso deployed `gpt-audio-mini` in a Foundry resource under the deployment name **helpdesk-audio**. A ticketing script contains the code below; `client` is an `AzureOpenAI` object, and `encoded_audio` holds a voicemail in base64.

        ```python
        completion = client.chat.completions.create(
            model="helpdesk-audio",
            messages=[{
                "role": "user",
                "content": [
                    {"type": "text", "text": "Summarize the problem described in this voicemail."},
                    {"type": "input_audio", "input_audio": {"data": encoded_audio, "format": "wav"}},
                ],
            }],
        )
        print(completion.choices[0].message.content)
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le support informatique de Contoso reçoit des messages vocaux des employés et veut un court résumé écrit de chaque problème dans son outil de tickets. Contoso a déployé `gpt-audio-mini` dans une ressource Foundry sous le nom de déploiement **helpdesk-audio**. Un script de gestion des tickets contient le code ci-dessous ; `client` est un objet `AzureOpenAI`, et `encoded_audio` contient un message vocal en base64.

        ```python
        completion = client.chat.completions.create(
            model="helpdesk-audio",
            messages=[{
                "role": "user",
                "content": [
                    {"type": "text", "text": "Summarize the problem described in this voicemail."},
                    {"type": "input_audio", "input_audio": {"data": encoded_audio, "format": "wav"}},
                ],
            }],
        )
        print(completion.choices[0].message.content)
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The model works on the recording itself, without a transcription produced beforehand by Azure Speech.", fr: "Le modèle travaille sur l'enregistrement lui-même, sans transcription produite au préalable par Azure Speech." }
        - id: s2
          text: { en: "The response contains a spoken summary that the application can decode and save as a WAV file.", fr: "La réponse contient un résumé parlé que l'application peut décoder et enregistrer dans un fichier WAV." }
        - id: s3
          text: { en: "For the request to reach the model, the `model` argument must be set to `gpt-audio-mini`.", fr: "Pour que la requête atteigne le modèle, l'argument `model` doit valoir `gpt-audio-mini`." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          An audio-enabled multimodal model accepts the recording as an `input_audio` part and reasons about it in the same call, with no separate transcription step. The request sets neither `modalities` nor `audio`, so the answer is text only, read from `message.content`. The `model` argument takes the deployment name, here helpdesk-audio.
        fr: |
          Un modèle multimodal compatible avec l'audio accepte l'enregistrement sous forme de partie `input_audio` et raisonne dessus dans le même appel, sans étape de transcription séparée. La requête ne définit ni `modalities` ni `audio` : la réponse est donc en texte seul, lue dans `message.content`. L'argument `model` prend le nom du déploiement, ici helpdesk-audio.
      options:
        s2: { en: "A spoken answer requires `modalities=[\"text\", \"audio\"]` and the `audio` parameter; without them the model returns text only.", fr: "Une réponse parlée exige `modalities=[\"text\", \"audio\"]` et le paramètre `audio` ; sans eux, le modèle ne renvoie que du texte." }
        s3: { en: "`model` names the deployment, not the base model; the deployment name helpdesk-audio is correct as written.", fr: "`model` désigne le déploiement, pas le modèle de base ; le nom de déploiement helpdesk-audio est correct tel quel." }
    references:
      - title: "Quickstart: Get started with Azure OpenAI audio generation"
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart

  # ------------------------------------------------------------------ 8
  - id: ai901-qz-22-08
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam builds a dictation tool for its field technicians: a technician dictates notes, sees them on screen, and hears a short spoken message at the end. A developer wrote the code below with the Azure Speech SDK; `key` and `endpoint` hold the credentials of a Foundry resource.

        ```python
        speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)
        speech_config.speech_synthesis_voice_name = "en-US-Ava:DragonHDLatestNeural"

        audio_in = speechsdk.audio.AudioConfig(use_default_microphone=True)
        recognizer = speechsdk.SpeechRecognizer(speech_config=speech_config, audio_config=audio_in)

        audio_out = speechsdk.audio.AudioOutputConfig(filename="notes.wav")
        synthesizer = speechsdk.SpeechSynthesizer(speech_config=speech_config, audio_config=audio_out)

        recognizer.recognized.connect(lambda evt: print(evt.result.text))
        recognizer.start_continuous_recognition()
        input("Press Enter to stop...")
        recognizer.stop_continuous_recognition()

        synthesizer.speak_text_async("Dictation finished.").get()
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam crée un outil de dictée pour ses techniciens de terrain : un technicien dicte des notes, les voit à l'écran et entend un court message parlé à la fin. Un développeur a écrit le code ci-dessous avec le SDK Azure Speech ; `key` et `endpoint` contiennent les informations d'identification d'une ressource Foundry.

        ```python
        speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)
        speech_config.speech_synthesis_voice_name = "en-US-Ava:DragonHDLatestNeural"

        audio_in = speechsdk.audio.AudioConfig(use_default_microphone=True)
        recognizer = speechsdk.SpeechRecognizer(speech_config=speech_config, audio_config=audio_in)

        audio_out = speechsdk.audio.AudioOutputConfig(filename="notes.wav")
        synthesizer = speechsdk.SpeechSynthesizer(speech_config=speech_config, audio_config=audio_out)

        recognizer.recognized.connect(lambda evt: print(evt.result.text))
        recognizer.start_continuous_recognition()
        input("Press Enter to stop...")
        recognizer.stop_continuous_recognition()

        synthesizer.speak_text_async("Dictation finished.").get()
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The file notes.wav contains the recording of what the user dictated.", fr: "Le fichier notes.wav contient l'enregistrement de ce que l'utilisateur a dicté." }
        - id: s2
          text: { en: "The text of each dictated phrase is read aloud as soon as it's recognized.", fr: "Le texte de chaque phrase dictée est lu à voix haute dès qu'il est reconnu." }
        - id: s3
          text: { en: "The sentence *Dictation finished.* is spoken with the voice `en-US-Ava:DragonHDLatestNeural`.", fr: "La phrase *Dictation finished.* est prononcée avec la voix `en-US-Ava:DragonHDLatestNeural`." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          The microphone is the input of the recognizer, and the `recognized` handler only prints the final text of each phrase. `AudioOutputConfig(filename="notes.wav")` is the output of the synthesizer: the file receives the synthesized sentence, not the dictation. The synthesizer uses the same `SpeechConfig` object, so it speaks with the voice set in `speech_synthesis_voice_name`.
        fr: |
          Le microphone est l'entrée du module de reconnaissance, et le gestionnaire `recognized` ne fait qu'afficher le texte définitif de chaque phrase. `AudioOutputConfig(filename="notes.wav")` est la sortie du synthétiseur : le fichier reçoit la phrase synthétisée, pas la dictée. Le synthétiseur utilise le même objet `SpeechConfig` : il parle donc avec la voix définie dans `speech_synthesis_voice_name`.
      options:
        s1: { en: "`AudioOutputConfig` describes where synthesized audio goes; the code never saves the microphone audio.", fr: "`AudioOutputConfig` décrit où va l'audio synthétisé ; le code n'enregistre jamais l'audio du microphone." }
        s2: { en: "The handler calls `print`, not the synthesizer; the only text synthesized is the final sentence, after recognition stops.", fr: "Le gestionnaire appelle `print`, pas le synthétiseur ; le seul texte synthétisé est la phrase finale, après l'arrêt de la reconnaissance." }
    references:
      - title: "Speech recognition"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/2-speech-recognition
      - title: "Speech synthesis"
        url: https://learn.microsoft.com/en-us/training/modules/get-started-speech-azure/3-speech-synthesis

  # ------------------------------------------------------------------ 9
  - id: ai901-qz-22-09
    objective: "2.2.3"
