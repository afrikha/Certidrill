        l5: { en: "Deleting line 5 would leave `transcript` empty: the handler is what stores the text of each recognized phrase.", fr: "Supprimer la ligne 5 laisserait `transcript` vide : c'est le gestionnaire qui stocke le texte de chaque phrase reconnue." }
