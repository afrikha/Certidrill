# AI-901 objectives — official study guide, skills measured as of 2026-04-15 (en-us and fr-fr pages, checked on 2026-11-16).
# French from the fr-fr page; only the elisions were corrected ("de Azure" -> "d'Azure").
# `code` is the stable key referenced by question files and course sections.
concepts:
- group:
    en: Describe principles of responsible AI
    fr: Décrire les principes de l'IA responsable
  objectives:
  - code: 1.1.1
    en: Describe considerations for fairness in an AI solution
    fr: Décrire les considérations relatives à l'impartialité dans une solution d'IA
  - code: 1.1.2
    en: Describe considerations for reliability and safety in an AI solution
    fr: Décrire les considérations relatives à la fiabilité et à la sécurité dans une solution d'IA
  - code: 1.1.3
    en: Describe considerations for privacy and security in an AI solution
    fr: Décrire les considérations relatives à la confidentialité et à la sécurité dans une solution d'IA
  - code: 1.1.4
    en: Describe considerations for inclusiveness in an AI solution
    fr: Décrire les considérations relatives à l'inclusion dans une solution d'IA
  - code: 1.1.5
    en: Describe considerations for transparency in an AI solution
    fr: Décrire les considérations relatives à la transparence dans une solution d'IA
  - code: 1.1.6
    en: Describe considerations for accountability in an AI solution
    fr: Décrire les considérations relatives à la responsabilité dans une solution d'IA
- group:
    en: Identify AI model components and configurations
    fr: Identifier les composants et configurations du modèle IA
  objectives:
  - code: 1.2.1
    en: Describe how generative AI models work
    fr: Décrire le fonctionnement des modèles IA génératifs
  - code: 1.2.2
    en: Identify an appropriate AI model, based on capabilities
    fr: Identifier un modèle IA approprié, en fonction des fonctionnalités
  - code: 1.2.3
    en: Identify appropriate model deployment options and configuration parameters
    fr: Identifier les options de déploiement de modèle appropriées et les paramètres de configuration
- group:
    en: Identify AI workloads
    fr: Identifier les charges de travail d'IA
  objectives:
  - code: 1.3.1
    en: Identify scenarios for common AI workloads, including generative and agentic AI, text analysis, speech, computer vision, and information extraction
    fr: Identifier les scénarios de charges de travail IA courantes, notamment l'IA générative et agentique, l'analyse de texte, la reconnaissance vocale, la vision par ordinateur et l'extraction d'informations
  - code: 1.3.2
    en: Describe common text analysis techniques, including keyword extraction, entity detection, sentiment analysis, and summarization
    fr: Décrire les techniques d'analyse de texte courantes, notamment l'extraction de mots clés, la détection d'entités, l'analyse des sentiments et la synthèse
  - code: 1.3.3
    en: Identify features and capabilities of speech recognition and speech synthesis
    fr: Identifier les fonctionnalités et capacités de la reconnaissance vocale et de la synthèse vocale
  - code: 1.3.4
    en: Identify features and capabilities of computer vision and image-generation models
    fr: Identifier les fonctionnalités et les capacités des modèles de vision par ordinateur et de génération d'images
  - code: 1.3.5
    en: Identify techniques to extract information from text, images, audio, and videos
    fr: Identifier les techniques d'extraction d'informations à partir de texte, d'images, d'audio et de vidéos
foundry:
- group:
    en: Implement generative AI apps and agents by using Foundry
    fr: Implémenter des applications et des agents d'IA génératives à l'aide de Foundry
  objectives:
  - code: 2.1.1
    en: Create effective system and user prompts for generative AI models
    fr: Créer des invites système et utilisateur efficaces pour les modèles IA génératifs
  - code: 2.1.2
    en: Deploy a model and interact with it in the Foundry portal
    fr: Déployer un modèle et interagir avec celui-ci dans le portail Foundry
  - code: 2.1.3
    en: Create a lightweight chat client application by using the Foundry SDK
    fr: Créer une application cliente de conversation légère à l'aide du Kit de développement logiciel (SDK) Foundry
  - code: 2.1.4
    en: Create and test a single-agent solution in the Foundry portal
    fr: Créer et tester une solution à agent unique dans le portail Foundry
  - code: 2.1.5
    en: Create a lightweight client application for an agent
    fr: Créer une application cliente légère pour un agent
- group:
    en: Implement AI solutions for text and speech by using Foundry
    fr: Implémenter des solutions IA pour le texte et la parole à l'aide de Foundry
  objectives:
  - code: 2.2.1
    en: Build a lightweight application that includes text analysis
    fr: Créer une application légère qui inclut l'analyse de texte
  - code: 2.2.2
    en: Respond to spoken prompts by using a deployed multimodal model
    fr: Répondre aux invites vocales à l'aide d'un modèle multimodal déployé
  - code: 2.2.3
    en: Build a lightweight application by using Azure Speech in Foundry Tools
    fr: Créer une application légère à l'aide d'Azure Speech dans Foundry Tools
- group:
    en: Implement AI solutions with computer vision and image-generation capabilities by using Foundry
    fr: Implémenter des solutions IA avec des fonctionnalités de vision par ordinateur et de génération d'images à l'aide de Foundry
  objectives:
  - code: 2.3.1
    en: Interpret visual input in prompts by using a deployed multimodal model
    fr: Interpréter les données visuelles dans les instructions à l'aide d'un modèle multimodal déployé
  - code: 2.3.2
    en: Create new visual outputs by using generative models
    fr: Créer des sorties visuelles à l'aide de modèles génératifs
  - code: 2.3.3
    en: Build a lightweight application that includes vision capabilities
    fr: Créer une application légère qui inclut des fonctionnalités de vision
- group:
    en: Implement AI solutions for information extraction by using Foundry
    fr: Implémenter des solutions IA pour l'extraction d'informations à l'aide de Foundry
  objectives:
  - code: 2.4.1
    en: Extract information from documents and forms by using Azure Content Understanding in Foundry Tools
    fr: Extraire des informations à partir de documents et de formulaires à l'aide d'Azure Content Understanding dans Foundry Tools
  - code: 2.4.2
    en: Extract information from images by using Content Understanding
    fr: Extraire des informations d'images à l'aide de Content Understanding
  - code: 2.4.3
    en: Extract information from audio and video by using Content Understanding
    fr: Extraire des informations de l'audio et de la vidéo à l'aide de Content Understanding
  - code: 2.4.4
    en: Build a lightweight application with information extraction capabilities by using Content Understanding
    fr: Créer une application légère avec des fonctionnalités d'extraction d'informations à l'aide de Content Understanding
