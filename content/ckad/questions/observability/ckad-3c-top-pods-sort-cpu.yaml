id: ckad-3c-top-pods-sort-cpu
objective: "3.3.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Metrics Server is installed in the cluster. Show the current CPU and memory usage of every Pod in namespace `shop`, with the Pods that use the most CPU listed first.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl top
    path: verb
    op: equals
    value: top
  - id: resource
    label: Reports usage of Pods
    path: resource
    op: equals
    value: pod
  - id: namespace
    label: Runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  - id: sort
    label: Sorts by CPU
    path: flags.sort-by
    op: equals
    value: cpu
  solution:
  - command: kubectl top pod -n shop --sort-by=cpu
  - command: k top pods --sort-by cpu --namespace=shop
  - command: kubectl top po --sort-by=cpu -n shop
  negatives:
  - command: kubectl top pod -n shop --sort-by=memory
    why: This sorts by memory usage, not CPU.
  - command: kubectl top pod --sort-by=cpu
    why: Without -n the command reports the Pods of the context namespace, default.
  - command: kubectl get pods -n shop --sort-by=cpu
    why: kubectl get shows no usage; its --sort-by expects a JSONPath field of the object, not a metric.
explanation:
  correct:
    en: '`kubectl top pod` reads current usage from the Metrics API (Metrics Server). `--sort-by` accepts `cpu` or `memory`, and `-n shop` limits the list to that namespace. `kubectl get` and `kubectl describe` show requests and limits from the spec, never the measured usage.'
references:
- title: kubectl top pod
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/kubectl_top_pod/
