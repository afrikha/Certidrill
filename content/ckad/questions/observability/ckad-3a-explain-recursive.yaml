id: ckad-3a-explain-recursive
objective: "3.1.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    You do not remember how the update strategy of a Deployment is structured. Print, from the cluster's API schema, the whole tree of fields under `spec.strategy` of a Deployment (every nested field with its type, not only the first level).

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl explain
    path: verb
    op: equals
    value: explain
  - id: field
    label: Targets the field deployment.spec.strategy
    path: args
    op: matches
    value: ^\["deploy(ments?)?\.spec\.strategy"\]$
  - id: recursive
    label: Prints nested fields (--recursive)
    path: flags.recursive
    op: equals
    value: true
  solution:
  - command: kubectl explain deployment.spec.strategy --recursive
  - command: k explain deploy.spec.strategy -R
  - command: kubectl explain deployments.spec.strategy --recursive=true
  negatives:
  - command: kubectl explain deployment.spec.strategy
    why: Without --recursive, explain describes only the first level (type and rollingUpdate), not the fields inside rollingUpdate.
  - command: kubectl explain deployment --recursive
    why: This prints the field tree of the whole Deployment, not the strategy field asked for.
  - command: kubectl describe deployment.spec.strategy
    why: describe shows live objects, not the API schema; deployment.spec.strategy is not an object name.
explanation:
  correct:
    en: '`kubectl explain TYPE.FIELD[.FIELD]` reads the schema served by the API server in OpenAPI format. `--recursive` (shorthand `-R`) prints the fields of fields, here `type` and `rollingUpdate.maxSurge` / `rollingUpdate.maxUnavailable`. Short names and plurals (`deploy`, `deployments`) are accepted in the field path.'
references:
- title: kubectl explain
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_explain/
