id: ckad-3c-get-pods-wide
objective: "3.3.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    List the Pods of namespace `shop` in a table that, in addition to the usual columns, shows the IP address of each Pod and the node it runs on. Use the kubectl output format built for this, not a custom template.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Lists Pods
    path: resource
    op: equals
    value: pod
  - id: namespace
    label: Runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  - id: output
    label: Uses the wide output format
    path: flags.output
    op: equals
    value: wide
  solution:
  - command: kubectl get pods -n shop -o wide
  - command: k get po -o wide --namespace shop
  - command: kubectl get pod --output=wide -n shop
  negatives:
  - command: kubectl get pods -n shop --show-labels
    why: --show-labels adds a LABELS column, not the Pod IP and node.
  - command: kubectl get pods -n shop -o yaml
    why: YAML prints the full objects, not a table.
  - command: kubectl get pods -o wide
    why: Without -n the command lists the Pods of the context namespace, default.
explanation:
  correct:
    en: '`-o wide` prints the plain-text table with extra columns; for Pods it adds the Pod IP and the node name, among other columns. `--show-labels` adds labels only, and `-o yaml` or `-o json` print whole objects.'
references:
- title: kubectl Quick Reference
  url: https://kubernetes.io/docs/reference/kubectl/quick-reference/
