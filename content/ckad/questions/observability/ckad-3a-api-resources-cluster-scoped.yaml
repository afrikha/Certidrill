id: ckad-3a-api-resources-cluster-scoped
objective: "3.1.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    You need the list of the resource types that are **not** namespaced and that support the `list` verb, printed as names only (one `resource.group` per line, without columns).

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl api-resources
    path: verb
    op: equals
    value: api-resources
  - id: scope
    label: Keeps only non-namespaced resources (--namespaced=false)
    path: flags.namespaced
    op: equals
    value: "false"
  - id: verbs
    label: Keeps only resources that support list
    path: flags.verbs
    op: equals
    value: list
  - id: output
    label: Prints names only (-o name)
    path: flags.output
    op: equals
    value: name
  solution:
  - command: kubectl api-resources --namespaced=false --verbs=list -o name
  - command: k api-resources -o=name --verbs list --namespaced=false
  - command: kubectl api-resources --output=name --namespaced=false --verbs=list
  negatives:
  - command: kubectl api-resources --namespaced -o name --verbs=list
    why: --namespaced alone means true, so the command lists the namespaced resources.
  - command: kubectl api-resources --namespaced=false --verbs=list -o wide
    why: -o wide prints the full table with extra columns, not names only.
  - command: kubectl api-resources --namespaced=false -o name
    why: Without --verbs=list the output also includes cluster-scoped types that cannot be listed (for example create-only review resources).
explanation:
  correct:
    en: '`--namespaced` defaults to true; `--namespaced=false` returns the cluster-scoped types (Node, PersistentVolume, StorageClass, ClusterRole...). `--verbs=list` keeps the types that support that verb, and `-o name` prints one `resource.group` per line. A boolean flag must be written `--namespaced=false`: `--namespaced` alone sets it to true.'
references:
- title: kubectl api-resources
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_api-resources/
