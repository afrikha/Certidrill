id: ckad-3d-native-sidecar-log-tail
objective: "3.4.2"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    The container `app` of image `registry.example.com/orders:4.2` appends its log to the file `/var/log/orders/orders.log`, so `kubectl logs` shows nothing.

    Write the manifest of a Pod named `orders` in namespace `shop` that exposes this file through `kubectl logs orders -c log-tail -n shop`:

    - an `emptyDir` volume named `logs` is mounted at `/var/log/orders` in both containers;
    - `log-tail` is a native sidecar: it runs `busybox:1.36` with the command `tail -F /var/log/orders/orders.log`, starts before `app` and keeps running for the whole life of the Pod.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: orders
      namespace: shop
    spec:
      containers:
      - name: app
        image: registry.example.com/orders:4.2
answer:
  checks:
  - id: pod
    label: A Pod named orders in namespace shop
    path: metadata
    op: subset
    value: {name: orders, namespace: shop}
  - id: app-image
    label: Container app runs registry.example.com/orders:4.2
    path: spec.containers[name=app].image
    op: equals
    value: registry.example.com/orders:4.2
  - id: app-mount
    label: Container app mounts logs at /var/log/orders
    path: spec.containers[name=app].volumeMounts[name=logs].mountPath
    op: equals
    value: /var/log/orders
  - id: volume
    label: Volume logs is an emptyDir
    path: spec.volumes[name=logs].emptyDir
    op: exists
  - id: sidecar-init
    label: log-tail is declared under initContainers
    path: spec.initContainers[name=log-tail].image
    op: equals
    value: busybox:1.36
  - id: sidecar-restart
    label: log-tail has restartPolicy Always (native sidecar)
    path: spec.initContainers[name=log-tail].restartPolicy
    op: equals
    value: Always
  - id: sidecar-mount
    label: log-tail mounts logs at /var/log/orders
    path: spec.initContainers[name=log-tail].volumeMounts[name=logs].mountPath
    op: equals
    value: /var/log/orders
  - id: sidecar-tail
    label: log-tail runs tail -F on /var/log/orders/orders.log
    path: spec.initContainers[name=log-tail]
    op: matches
    value: 'tail.*-F.*/var/log/orders/orders\.log'
  - id: not-regular
    label: log-tail is not also a regular container
    path: spec.containers[name=log-tail]
    op: absent
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: orders
        namespace: shop
      spec:
        initContainers:
        - name: log-tail
          image: busybox:1.36
          restartPolicy: Always
          command: ['sh', '-c', 'tail -F /var/log/orders/orders.log']
          volumeMounts:
          - name: logs
            mountPath: /var/log/orders
        containers:
        - name: app
          image: registry.example.com/orders:4.2
          volumeMounts:
          - name: logs
            mountPath: /var/log/orders
        volumes:
        - name: logs
          emptyDir: {}
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: orders
        namespace: shop
      spec:
        containers:
        - name: app
          image: registry.example.com/orders:4.2
          volumeMounts:
          - {name: logs, mountPath: /var/log/orders}
        initContainers:
        - name: log-tail
          image: busybox:1.36
          command: ["tail", "-F", "/var/log/orders/orders.log"]
          restartPolicy: Always
          volumeMounts:
          - {name: logs, mountPath: /var/log/orders}
        volumes:
        - name: logs
          emptyDir: {}
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: orders
        namespace: shop
      spec:
        initContainers:
        - name: log-tail
          image: busybox:1.36
          command: ['sh', '-c', 'tail -F /var/log/orders/orders.log']
          volumeMounts:
          - name: logs
            mountPath: /var/log/orders
        containers:
        - name: app
          image: registry.example.com/orders:4.2
          volumeMounts:
          - name: logs
            mountPath: /var/log/orders
        volumes:
        - name: logs
          emptyDir: {}
    why: Without restartPolicy Always it is a classic init container; tail -F never exits, so app never starts.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: orders
        namespace: shop
      spec:
        restartPolicy: Always
        containers:
        - name: app
          image: registry.example.com/orders:4.2
          volumeMounts:
          - name: logs
            mountPath: /var/log/orders
        - name: log-tail
          image: busybox:1.36
          command: ['sh', '-c', 'tail -F /var/log/orders/orders.log']
          volumeMounts:
          - name: logs
            mountPath: /var/log/orders
        volumes:
        - name: logs
          emptyDir: {}
    why: A second regular container is a classic sidecar with no start order; a native sidecar is an init container with its own restartPolicy Always.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: orders
        namespace: shop
      spec:
        initContainers:
        - name: log-tail
          image: busybox:1.36
          restartPolicy: Always
          command: ['sh', '-c', 'tail -F /var/log/orders/orders.log']
        containers:
        - name: app
          image: registry.example.com/orders:4.2
          volumeMounts:
          - name: logs
            mountPath: /var/log/orders
        volumes:
        - name: logs
          emptyDir: {}
    why: The sidecar does not mount the volume, so it cannot see the file app writes.
explanation:
  correct:
    en: 'A native sidecar is an entry of `initContainers` with `restartPolicy: Always`: it starts before the app containers and keeps running during the whole life of the Pod (stable since v1.33). Both containers mount the same `emptyDir`, and `tail -F` turns the file into the sidecar''s stdout, which `kubectl logs orders -c log-tail` reads. Without `restartPolicy: Always`, an init container must exit before the next one starts.'
references:
- title: Sidecar Containers
  url: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
- title: Logging Architecture
  url: https://kubernetes.io/docs/concepts/cluster-administration/logging/
