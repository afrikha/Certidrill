id: ckad-3b-describe-probe-failures
objective: "3.2.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Pod `catalog` in namespace `shop` shows `READY 0/1` and its `RESTARTS` count keeps increasing. With one command, display the probe settings of its containers (delay, timeout, period, thresholds) together with the recent events of the Pod, such as `Liveness probe failed` or `Readiness probe failed`.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl describe
    path: verb
    op: equals
    value: describe
  - id: resource
    label: Describes a Pod
    path: resource
    op: equals
    value: pod
  - id: name
    label: Names the Pod catalog
    path: names
    op: contains
    value: catalog
  - id: namespace
    label: Runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  solution:
  - command: kubectl describe pod catalog -n shop
  - command: k -n shop describe po/catalog
  - command: kubectl describe pods catalog --namespace=shop
  negatives:
  - command: kubectl logs catalog -n shop
    why: logs prints what the application writes; probe settings and kubelet events are not in the container log.
  - command: kubectl get pod catalog -n shop -o wide
    why: get shows the READY and RESTARTS columns, but neither the probe settings nor the events.
  - command: kubectl describe pod catalog
    why: Without -n kubectl looks for catalog in the context namespace, default.
explanation:
  correct:
    en: '`kubectl describe pod catalog -n shop` prints each container''s probes in one line (for example `Liveness: http-get http://:8080/healthz delay=0s timeout=1s period=10s #success=1 #failure=3`), the restart count and last state, and the Events list where the kubelet records `Unhealthy` events for failed probes and `Killing` when liveness fails. A failing readiness probe only removes the Pod from Service endpoints; a failing liveness probe restarts the container.'
references:
- title: Configure Liveness, Readiness and Startup Probes
  url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
