id: ckad-3a-api-resources-group
objective: "3.1.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Before writing a NetworkPolicy and an Ingress, you want to see which resource types the cluster serves in the API group `networking.k8s.io`, and only those.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl api-resources
    path: verb
    op: equals
    value: api-resources
  - id: group
    label: Limits the list to the API group networking.k8s.io
    path: flags.api-group
    op: equals
    value: networking.k8s.io
  solution:
  - command: kubectl api-resources --api-group=networking.k8s.io
  - command: k api-resources --api-group networking.k8s.io -o wide
  negatives:
  - command: kubectl api-versions
    why: api-versions prints the served group/version pairs (networking.k8s.io/v1), not the resource types of the group.
  - command: kubectl api-resources --api-group=networking
    why: The group is named networking.k8s.io; --api-group=networking matches no group and prints nothing.
  - command: kubectl api-resources
    why: Without --api-group the command lists the resource types of every group.
explanation:
  correct:
    en: '`kubectl api-resources --api-group=networking.k8s.io` lists the resource types served in that group (Ingress, IngressClass, NetworkPolicy and others) with their short names, API version, scope and kind. `-o wide` adds the supported verbs and categories. `kubectl api-versions` only prints group/version strings such as `networking.k8s.io/v1`.'
references:
- title: kubectl api-resources
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_api-resources/
