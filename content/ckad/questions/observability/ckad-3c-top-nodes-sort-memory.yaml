id: ckad-3c-top-nodes-sort-memory
objective: "3.3.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Metrics Server is installed. Find the node that currently uses the most memory: list the resource usage of all nodes of the cluster, sorted by memory usage.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl top
    path: verb
    op: equals
    value: top
  - id: resource
    label: Reports usage of nodes
    path: resource
    op: equals
    value: node
  - id: sort
    label: Sorts by memory
    path: flags.sort-by
    op: equals
    value: memory
  solution:
  - command: kubectl top node --sort-by=memory
  - command: k top nodes --sort-by memory
  - command: kubectl top no --sort-by=memory
  negatives:
  - command: kubectl top pod -A --sort-by=memory
    why: This lists Pods, not nodes.
  - command: kubectl top node --sort-by=cpu
    why: This sorts by CPU usage, not memory.
  - command: kubectl describe nodes
    why: describe node shows the requests and limits allocated on each node, not the measured usage, and does not sort.
explanation:
  correct:
    en: '`kubectl top node` shows the CPU and memory usage of each node from the Metrics API; `--sort-by=memory` puts the largest consumer first (the field can be `cpu` or `memory`). By default the percentages are computed against the node''s allocatable resources. `describe node` lists allocated requests and limits, which can differ a lot from real usage.'
references:
- title: kubectl top node
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/kubectl_top_node/
