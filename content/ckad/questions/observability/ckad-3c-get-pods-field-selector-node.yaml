id: ckad-3c-get-pods-field-selector-node
objective: "3.3.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Node `worker-2` is going to be drained. With `kubectl get`, list the Pods of all namespaces that are scheduled on `worker-2`, letting the API server filter them on the Pod field that holds the node name.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Lists Pods
    path: resource
    op: equals
    value: pod
  - id: all-ns
    label: Covers all namespaces
    path: flags.all-namespaces
    op: equals
    value: true
  - id: field
    label: Filters with the field selector spec.nodeName=worker-2
    path: flags.field-selector
    op: matches
    value: '^spec\.nodeName==?worker-2$'
  solution:
  - command: kubectl get pods -A --field-selector spec.nodeName=worker-2
  - command: k get po --all-namespaces --field-selector=spec.nodeName==worker-2
  - command: kubectl get pod --field-selector=spec.nodeName=worker-2 -A -o wide
  negatives:
  - command: kubectl get pods -A -l kubernetes.io/hostname=worker-2
    why: kubernetes.io/hostname is a label of the Node object; Pods do not carry it, so the label selector matches nothing.
  - command: kubectl get pods --field-selector spec.nodeName=worker-2
    why: Without -A only the Pods of the context namespace are listed.
  - command: kubectl get pods -A --field-selector status.nodeName=worker-2
    why: The node a Pod is assigned to is spec.nodeName; status.nodeName is not a Pod field.
explanation:
  correct:
    en: 'Field selectors filter on resource fields with `=`, `==` and `!=`; for Pods, `spec.nodeName` is a supported field. `kubectl get pods -A --field-selector spec.nodeName=worker-2` returns every Pod bound to that node. Labels are matched with `-l`, and `kubernetes.io/hostname` is a node label, not a Pod label.'
references:
- title: Field Selectors
  url: https://kubernetes.io/docs/concepts/overview/working-with-objects/field-selectors/
