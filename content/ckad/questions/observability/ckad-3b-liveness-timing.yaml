id: ckad-3b-liveness-timing
objective: "3.2.2"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    The billing service answers `GET /healthz` on port 8080 but can be slow under load. Write the manifest of a Pod named `billing` in namespace `payments` with one container named `app` running `registry.example.com/billing:2.0`, with a liveness probe on `GET /healthz` port 8080 that:

    - runs its first check 20 seconds after the container starts;
    - then checks every 15 seconds;
    - counts an attempt as failed only after 3 seconds without an answer;
    - restarts the container only after 4 consecutive failures.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: billing
      namespace: payments
    spec:
      containers:
      - name: app
        image: registry.example.com/billing:2.0
answer:
  checks:
  - id: pod
    label: A Pod named billing in namespace payments
    path: metadata
    op: subset
    value: {name: billing, namespace: payments}
  - id: image
    label: Container app runs registry.example.com/billing:2.0
    path: spec.containers[name=app].image
    op: equals
    value: registry.example.com/billing:2.0
  - id: http
    label: The liveness probe is an HTTP GET on /healthz port 8080
    path: spec.containers[name=app].livenessProbe.httpGet
    op: subset
    value: {path: /healthz, port: 8080}
  - id: initial-delay
    label: initialDelaySeconds is 20
    path: spec.containers[name=app].livenessProbe.initialDelaySeconds
    op: equals
    value: 20
  - id: period
    label: periodSeconds is 15
    path: spec.containers[name=app].livenessProbe.periodSeconds
    op: equals
    value: 15
  - id: timeout
    label: timeoutSeconds is 3
    path: spec.containers[name=app].livenessProbe.timeoutSeconds
    op: equals
    value: 3
  - id: failure
    label: failureThreshold is 4
    path: spec.containers[name=app].livenessProbe.failureThreshold
    op: equals
    value: 4
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing
        namespace: payments
      spec:
        containers:
        - name: app
          image: registry.example.com/billing:2.0
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing
        namespace: payments
      spec:
        containers:
        - name: app
          image: registry.example.com/billing:2.0
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
    why: Without timeoutSeconds each attempt times out after 1 second (the default), so a slow answer counts as a failure.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing
        namespace: payments
      spec:
        containers:
        - name: app
          image: registry.example.com/billing:2.0
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            successThreshold: 4
    why: successThreshold is not the failure count (and must be 1 for liveness); failureThreshold stays at its default of 3.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing
        namespace: payments
      spec:
        containers:
        - name: app
          image: registry.example.com/billing:2.0
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
    why: initialDelaySeconds and periodSeconds are swapped; the first check would run after 15 seconds and then every 20.
explanation:
  correct:
    en: '`initialDelaySeconds` delays the first probe after the container starts, `periodSeconds` sets the interval (default 10), `timeoutSeconds` is how long one attempt may take (default 1) and `failureThreshold` is the number of consecutive failures before the probe is considered failed (default 3). Here the kubelet restarts the container after 4 failed checks in a row, about 60 seconds after the first failure.'
references:
- title: Configure Liveness, Readiness and Startup Probes
  url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
- title: Pod
  url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
