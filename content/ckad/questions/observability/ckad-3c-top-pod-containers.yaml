id: ckad-3c-top-pod-containers
objective: "3.3.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Pod `checkout-5f7d8` in namespace `payments` runs two containers, `app` and `envoy`. Its total memory usage keeps growing and you must find out which container is responsible.

    Show the CPU and memory usage of each container of this Pod separately. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl top
    path: verb
    op: equals
    value: top
  - id: resource
    label: Reports usage of a Pod
    path: resource
    op: equals
    value: pod
  - id: name
    label: Targets Pod checkout-5f7d8
    path: names
    op: contains
    value: checkout-5f7d8
  - id: containers
    label: Breaks usage down per container (--containers)
    path: flags.containers
    op: equals
    value: true
  - id: namespace
    label: Runs in namespace payments
    path: flags.namespace
    op: equals
    value: payments
  solution:
  - command: kubectl top pod checkout-5f7d8 --containers -n payments
  - command: k -n payments top po checkout-5f7d8 --containers
  - command: kubectl top pods checkout-5f7d8 --namespace payments --containers=true
  negatives:
  - command: kubectl top pod checkout-5f7d8 -n payments
    why: Without --containers, kubectl top prints one line with the total usage of the Pod.
  - command: kubectl top pod checkout-5f7d8 -c envoy -n payments
    why: kubectl top pod has no -c flag; the per-container view is --containers.
  - command: kubectl describe pod checkout-5f7d8 -n payments
    why: describe shows the requests and limits declared in the spec, not the measured usage.
explanation:
  correct:
    en: '`kubectl top pod NAME --containers` prints one line per container with its current CPU and memory usage, which shows whether `app` or `envoy` is growing. Without `--containers` the output is the sum for the whole Pod. `describe` only shows declared requests and limits.'
references:
- title: kubectl top pod
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/kubectl_top_pod/
