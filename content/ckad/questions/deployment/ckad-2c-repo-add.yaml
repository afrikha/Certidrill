id: ckad-2c-repo-add
objective: "2.3.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    The team publishes its Helm charts at `https://charts.example.com/stable`. Register this chart repository in your Helm client under the name `acme`, so that charts can be referenced as `acme/<chart>`.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: tool
    label: Uses helm
    path: tool
    op: equals
    value: helm
  - id: repo
    label: It is a helm repo command
    path: verb
    op: equals
    value: repo
  - id: add
    label: Uses helm repo add
    path: args[0]
    op: equals
    value: add
  - id: name
    label: Names the repository acme
    path: args[1]
    op: equals
    value: acme
  - id: url
    label: Points to https://charts.example.com/stable
    path: args[2]
    op: oneOf
    value: ["https://charts.example.com/stable", "https://charts.example.com/stable/"]
  solution:
  - command: helm repo add acme https://charts.example.com/stable
  - command: helm repo add acme https://charts.example.com/stable/ --force-update
  negatives:
  - command: helm repo add https://charts.example.com/stable acme
    why: The arguments are in the wrong order. helm repo add takes the local NAME first, then the URL.
  - command: helm repo update acme
    why: repo update refreshes the index of a repository that is already registered; it does not register a new one.
  - command: helm search repo acme
    why: search repo only searches the repositories that are already added to the client.
explanation:
  correct:
    en: '`helm repo add NAME URL` stores the repository in the client configuration and downloads its index, after which charts are referenced as `acme/<chart>`. The name comes first, then the URL. `helm repo update` only refreshes repositories that are already registered, and `helm repo list` shows them.'
references:
- title: helm repo add
  url: https://helm.sh/docs/helm/helm_repo_add/
- title: Using Helm
  url: https://helm.sh/docs/intro/using_helm/
