id: ckad-2c-list-failed-all-namespaces
objective: "2.3.3"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Releases are installed in many namespaces of the cluster. List the Helm releases of **all** namespaces whose status is `failed`, and only those.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: list
    label: Uses helm list (or its alias ls)
    path: verb
    op: oneOf
    value: [list, ls]
  - id: all-namespaces
    label: Looks in all namespaces (-A)
    path: flags.all-namespaces
    op: equals
    value: true
  - id: failed
    label: Shows only failed releases (--failed)
    path: flags.failed
    op: equals
    value: true
  solution:
  - command: helm list -A --failed
  - command: helm ls --all-namespaces --failed
  negatives:
  - command: helm list --failed
    why: Without -A, helm list only looks in the namespace of the current context.
  - command: helm list -A
    why: Without a status filter, helm list shows releases in every status, not only failed ones.
  - command: helm history -A --failed
    why: helm history shows the revisions of one named release; it does not list releases.
explanation:
  correct:
    en: '`helm list` (alias `ls`) shows the releases of the current namespace in any status. `-A`/`--all-namespaces` widens it to every namespace, and the status flags (`--failed`, `--deployed`, `--pending`, `--superseded`, `--uninstalled`) narrow it to those statuses.'
references:
- title: helm list
  url: https://helm.sh/docs/helm/helm_list/
