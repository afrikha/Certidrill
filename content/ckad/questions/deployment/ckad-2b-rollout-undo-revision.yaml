id: ckad-2b-rollout-undo-revision
objective: "2.2.3"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The last two rollouts of Deployment `api` in namespace `payments` are broken. `kubectl rollout history` lists revisions 2, 3 and 4: revision 4 is the current one and revision 2 is the last good one.

    Roll the Deployment back to revision 2 with a single command.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl rollout undo
    path: subverb
    op: equals
    value: undo
  - id: rollout
    label: It is a rollout command
    path: verb
    op: equals
    value: rollout
  - id: target
    label: Targets Deployment api
    path: resource
    op: equals
    value: deployment
  - id: name
    label: Names the Deployment api
    path: names
    op: contains
    value: api
  - id: revision
    label: Rolls back to revision 2
    path: flags.to-revision
    op: equals
    value: "2"
  - id: namespace
    label: Runs in namespace payments
    path: flags.namespace
    op: equals
    value: payments
  solution:
  - command: kubectl rollout undo deployment/api --to-revision=2 -n payments
  - command: k -n payments rollout undo deploy api --to-revision 2
  negatives:
  - command: kubectl rollout undo deployment/api -n payments
    why: Without --to-revision, undo goes back to the previous revision, 3, which is also broken.
  - command: kubectl rollout history deployment/api --revision=2 -n payments
    why: history only shows the details of revision 2.
  - command: kubectl rollout undo deployment/api --to-revision=2
    why: Without -n the command looks for api in the context namespace.
explanation:
  correct:
    en: '`kubectl rollout undo deployment/api --to-revision=2 -n payments` restores the Pod template of revision 2, which becomes a new revision (5). Without `--to-revision`, `undo` returns to the previous revision. `rollout history --revision=2` only displays that revision.'
references:
- title: Deployments
  url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
