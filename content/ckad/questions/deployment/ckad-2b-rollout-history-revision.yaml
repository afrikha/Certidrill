id: ckad-2b-rollout-history-revision
objective: "2.2.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Before choosing a revision to return to, display the details (Pod template, images, change cause) of **revision 3** of Deployment `web` in namespace `shop`. Nothing must change in the cluster.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: It is a rollout command
    path: verb
    op: equals
    value: rollout
  - id: subverb
    label: Uses kubectl rollout history
    path: subverb
    op: equals
    value: history
  - id: resource
    label: Targets a Deployment
    path: resource
    op: equals
    value: deployment
  - id: name
    label: Names the Deployment web
    path: names
    op: contains
    value: web
  - id: revision
    label: Shows revision 3
    path: flags.revision
    op: equals
    value: "3"
  - id: namespace
    label: Runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  solution:
  - command: kubectl rollout history deployment/web --revision=3 -n shop
  - command: k -n shop rollout history deploy web --revision 3
  negatives:
  - command: kubectl rollout undo deployment/web --to-revision=3 -n shop
    why: undo rolls the Deployment back to revision 3; the task only asks to look at it.
  - command: kubectl rollout history deployment/web -n shop
    why: Without --revision, history only lists the revisions and their change causes, not the details of revision 3.
  - command: kubectl rollout history deployment/web --revision=3
    why: Without -n the command looks for web in the context namespace, default.
explanation:
  correct:
    en: '`kubectl rollout history deployment/web -n shop` lists the revisions with their CHANGE-CAUSE; adding `--revision=3` prints the Pod template of that revision. It is read-only, unlike `rollout undo --to-revision=3`, which would start a rollback.'
references:
- title: Deployments
  url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
