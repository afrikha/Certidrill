id: ckad-2d-kustomization-basics
objective: "2.4.1"
difficulty: 1
status: draft
type: manifest
stem:
  en: |-
    The directory `/opt/shop` contains `deployment.yaml` (Deployment `web`) and `service.yaml` (Service `web`), with no namespace set. Write `/opt/shop/kustomization.yaml` so that `kubectl kustomize /opt/shop` outputs both objects:

    - in namespace `shop`;
    - with names prefixed by `prod-` (`prod-web`).
body:
  starter: |
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
answer:
  checks:
  - id: deployment
    label: Lists deployment.yaml in resources
    path: resources
    op: contains
    value: deployment.yaml
  - id: service
    label: Lists service.yaml in resources
    path: resources
    op: contains
    value: service.yaml
  - id: namespace
    label: Sets namespace shop
    path: namespace
    op: equals
    value: shop
  - id: prefix
    label: Prefixes names with prod-
    path: namePrefix
    op: equals
    value: prod-
  solution:
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      namespace: shop
      namePrefix: prod-
      resources:
      - deployment.yaml
      - service.yaml
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
      - service.yaml
      - deployment.yaml
      namePrefix: prod-
      namespace: shop
  negatives:
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      namespace: shop
      nameSuffix: -prod
      resources:
      - deployment.yaml
      - service.yaml
    why: nameSuffix appends to the name (web-prod); the task asks for a prefix (prod-web).
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      namespace: shop
      namePrefix: prod
      resources:
      - deployment.yaml
      - service.yaml
    why: namePrefix is prepended as is, so prod gives prodweb; the dash must be part of the prefix.
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      namespace: shop
      namePrefix: prod-
      resources:
      - deployment.yaml
    why: service.yaml is not listed in resources, so the Service is not part of the output.
explanation:
  correct:
    en: '`resources` lists the files (or directories) Kustomize reads; every entry must exist. `namespace: shop` sets the namespace of every namespaced object, and `namePrefix: prod-` is prepended verbatim to every name, so the dash belongs in the value. Kustomize also updates references, such as a Service name used elsewhere, to the new names.'
references:
- title: Declarative Management of Kubernetes Objects Using Kustomize
  url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
