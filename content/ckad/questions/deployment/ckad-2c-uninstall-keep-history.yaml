id: ckad-2c-uninstall-keep-history
objective: "2.3.3"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Remove the Helm release `legacy-api` and all its Kubernetes objects from namespace `payments`. The release record must be kept, so that `helm list -n payments --uninstalled` still shows it for the audit.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: uninstall
    label: Uses helm uninstall (or an alias)
    path: verb
    op: oneOf
    value: [uninstall, delete, del, un]
  - id: release
    label: Targets the release legacy-api
    path: args[0]
    op: equals
    value: legacy-api
  - id: namespace
    label: Looks in namespace payments
    path: flags.namespace
    op: equals
    value: payments
  - id: keep-history
    label: Keeps the release history (--keep-history)
    path: flags.keep-history
    op: equals
    value: true
  - id: not-dry-run
    label: Really uninstalls (no --dry-run)
    path: flags.dry-run
    op: absent
  solution:
  - command: helm uninstall legacy-api -n payments --keep-history
  - command: helm uninstall legacy-api --keep-history --namespace=payments
  negatives:
  - command: helm uninstall legacy-api -n payments
    why: Without --keep-history the release record is deleted too, so list --uninstalled shows nothing.
  - command: helm uninstall legacy-api -n payments --keep-history --dry-run
    why: --dry-run only simulates the uninstall; nothing is removed.
  - command: helm uninstall legacy-api --keep-history
    why: Without -n Helm looks for the release in the context namespace, default.
explanation:
  correct:
    en: '`helm uninstall RELEASE` deletes the objects of the release. With `--keep-history` Helm removes the objects but keeps the release record, marked as uninstalled, so `helm list --uninstalled` shows it and `helm history` still works. Without the flag the record is deleted as well.'
references:
- title: helm uninstall
  url: https://helm.sh/docs/helm/helm_uninstall/
- title: Using Helm
  url: https://helm.sh/docs/intro/using_helm/
