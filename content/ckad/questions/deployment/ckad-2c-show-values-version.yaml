id: ckad-2c-show-values-version
objective: "2.3.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The repository `acme` is added to your Helm client. Before installing anything, display the default values (the chart's `values.yaml`) of the chart `acme/webapp` at version `2.3.1`, which is not the latest version of the chart.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: show
    label: Uses helm show
    path: verb
    op: equals
    value: show
  - id: values
    label: Shows the chart values (show values)
    path: args[0]
    op: equals
    value: values
  - id: chart
    label: Targets the chart acme/webapp
    path: args[1]
    op: equals
    value: acme/webapp
  - id: version
    label: Reads version 2.3.1 of the chart
    path: flags.version
    op: equals
    value: 2.3.1
  solution:
  - command: helm show values acme/webapp --version 2.3.1
  - command: helm show values acme/webapp --version=2.3.1
  negatives:
  - command: helm show values acme/webapp
    why: Without --version, Helm shows the values of the latest version, not 2.3.1.
  - command: helm get values webapp
    why: get values reads the values supplied to an installed release; nothing is installed yet.
  - command: helm show chart acme/webapp --version 2.3.1
    why: show chart prints the Chart.yaml metadata, not the default values.
explanation:
  correct:
    en: '`helm show values CHART` prints the `values.yaml` packaged in a chart, which lists the keys you can override with `--set` or `-f`. `--version` selects a specific chart version; without it Helm uses the latest one. `helm get values` works on an installed release, and `helm show chart` prints the chart metadata.'
references:
- title: helm show values
  url: https://helm.sh/docs/helm/helm_show_values/
