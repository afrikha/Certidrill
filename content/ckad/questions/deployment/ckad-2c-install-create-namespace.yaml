id: ckad-2c-install-create-namespace
objective: "2.3.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Using `helm install`, install the chart `acme/webapp` at version `2.3.1` as a release named `shop-web` in namespace `shop`. The namespace `shop` does not exist yet and must be created by the same command. Override the chart value `replicaCount` to `3` on the command line.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: install
    label: Uses helm install
    path: verb
    op: equals
    value: install
  - id: release
    label: The release is named shop-web
    path: args[0]
    op: equals
    value: shop-web
  - id: chart
    label: Installs the chart acme/webapp
    path: args[1]
    op: equals
    value: acme/webapp
  - id: version
    label: Pins chart version 2.3.1
    path: flags.version
    op: equals
    value: 2.3.1
  - id: namespace
    label: Installs into namespace shop
    path: flags.namespace
    op: equals
    value: shop
  - id: create-namespace
    label: Creates the namespace (--create-namespace)
    path: flags.create-namespace
    op: equals
    value: true
  - id: replicas
    label: Sets replicaCount=3
    path: flags.set
    op: matches
    value: '(^|[",])replicaCount=3($|[",])'
  solution:
  - command: helm install shop-web acme/webapp --version 2.3.1 -n shop --create-namespace --set replicaCount=3
  - command: helm install shop-web acme/webapp --namespace=shop --create-namespace --version=2.3.1 --set=replicaCount=3
  - command: helm -n shop install shop-web acme/webapp --create-namespace --set replicaCount=3 --version 2.3.1
  negatives:
  - command: helm install shop-web acme/webapp --version 2.3.1 -n shop --set replicaCount=3
    why: Without --create-namespace the install fails because namespace shop does not exist.
  - command: helm install acme/webapp shop-web --version 2.3.1 -n shop --create-namespace --set replicaCount=3
    why: helm install takes the release NAME first, then the CHART.
  - command: helm install shop-web acme/webapp --version 2.3.1 --create-namespace --set replicaCount=3
    why: Without -n the release goes to the context namespace, default, and shop is never created.
  - command: helm install shop-web acme/webapp -n shop --create-namespace --set replicaCount=3
    why: Without --version Helm installs the latest chart version, not 2.3.1.
explanation:
  correct:
    en: '`helm install NAME CHART` creates a release; `-n shop` sets the release namespace and `--create-namespace` creates it when it does not exist. `--version 2.3.1` pins the chart version (the latest is used otherwise) and `--set replicaCount=3` overrides one value, with higher precedence than any `-f` file.'
references:
- title: helm install
  url: https://helm.sh/docs/helm/helm_install/
