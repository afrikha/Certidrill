id: ckad-2c-get-values-revision
objective: "2.3.3"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The release `api` in namespace `payments` is at revision 4. Display the values that the user supplied (with `--set` or `-f`) for **revision 2** of the release, without the chart defaults.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: get
    label: Uses helm get
    path: verb
    op: equals
    value: get
  - id: values
    label: Reads the release values (get values)
    path: args[0]
    op: equals
    value: values
  - id: release
    label: Targets the release api
    path: args[1]
    op: equals
    value: api
  - id: revision
    label: Reads revision 2
    path: flags.revision
    op: equals
    value: "2"
  - id: namespace
    label: Looks in namespace payments
    path: flags.namespace
    op: equals
    value: payments
  - id: user-only
    label: Shows only the user-supplied values (no --all)
    path: flags.all
    op: absent
  solution:
  - command: helm get values api --revision 2 -n payments
  - command: helm get values api -n payments --revision=2 -o yaml
  negatives:
  - command: helm get values api -n payments
    why: Without --revision, get values shows the values of the current revision, 4.
  - command: helm get values api --revision 2 -n payments --all
    why: --all dumps the computed values, chart defaults included.
  - command: helm status api --revision 2 -n payments
    why: status shows the state and notes of the revision, not the values supplied for it.
  - command: helm get values api --revision 2
    why: Without -n Helm looks for the release in the context namespace, default.
explanation:
  correct:
    en: '`helm get values RELEASE` prints the values supplied by the user for a release; `--revision 2` reads an older revision, and `-a`/`--all` would add the computed chart defaults. Run `helm history api -n payments` to see the revision numbers. `helm status` shows the state of a revision, not its values.'
references:
- title: helm get values
  url: https://helm.sh/docs/helm/helm_get_values/
- title: helm history
  url: https://helm.sh/docs/helm/helm_history/
