id: ckad-2c-repo-update-one
objective: "2.3.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Several chart repositories are registered in your Helm client. A new version of a chart was just published in the repository `acme`, but `helm search repo` does not show it yet. Refresh the local index of the `acme` repository **only**, leaving the other repositories untouched.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: repo
    label: It is a helm repo command
    path: verb
    op: equals
    value: repo
  - id: update
    label: Uses helm repo update
    path: args[0]
    op: equals
    value: update
  - id: only-acme
    label: Updates only the acme repository
    path: args
    op: equals
    value: [update, acme]
  solution:
  - command: helm repo update acme
  - command: helm repo update acme --timeout 5m
  negatives:
  - command: helm repo update
    why: Without a repository name, repo update refreshes every registered repository, not only acme.
  - command: helm repo list
    why: repo list only shows the registered repositories; it does not download a new index.
  - command: helm search repo acme --devel
    why: search repo reads the cached index; --devel adds pre-releases but does not refresh the cache.
explanation:
  correct:
    en: '`helm repo update` downloads the latest index of the chart repositories into the local cache that `helm search repo` reads. Given one or more repository names (`helm repo update acme`), it refreshes only those; without a name it refreshes all of them.'
references:
- title: helm repo update
  url: https://helm.sh/docs/helm/helm_repo_update/
