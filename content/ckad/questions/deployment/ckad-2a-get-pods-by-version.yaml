id: ckad-2a-get-pods-by-version
objective: "2.1.3"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    In namespace `shop`, several applications run a blue and a green version. List only the Pods labelled `app=web` **and** `version=green`.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Lists Pods
    path: resource
    op: equals
    value: pod
  - id: selector
    label: Filters on app=web and version=green
    path: flags.selector
    op: oneOf
    value: ["app=web,version=green", "version=green,app=web", "app==web,version==green", "version==green,app==web"]
  - id: namespace
    label: Runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  solution:
  - command: kubectl get pods -l app=web,version=green -n shop
  - command: k get po --selector=version=green,app=web -n shop
  - command: kubectl -n shop get pod -l app=web,version=green
  negatives:
  - command: kubectl get pods -l version=green -n shop
    why: This also lists the green Pods of the other applications.
  - command: kubectl get deployments -l app=web,version=green -n shop
    why: This lists Deployments, not Pods, and only those whose own labels match.
  - command: kubectl get pods -l app=web,version=green
    why: Without -n the command searches the context namespace, default.
explanation:
  correct:
    en: '`-l` (or `--selector`) takes an equality-based label selector; requirements separated by a comma are ANDed, so `-l app=web,version=green` keeps only the Pods that carry both labels. This is the same selection a Service with the selector `app: web, version: green` makes, which is how you check which Pods a blue/green switch will reach.'
references:
- title: Labels and Selectors
  url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
