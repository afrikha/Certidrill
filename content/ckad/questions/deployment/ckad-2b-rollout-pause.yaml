id: ckad-2b-rollout-pause
objective: "2.2.3"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    You are about to make three separate changes to Deployment `api` in namespace `payments` (image, environment variable, memory limit) and want them to produce **one** rollout at the end instead of three.

    Type the single command you would run **before** making the changes.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: It is a rollout command
    path: verb
    op: equals
    value: rollout
  - id: subverb
    label: Uses kubectl rollout pause
    path: subverb
    op: equals
    value: pause
  - id: resource
    label: Targets a Deployment
    path: resource
    op: equals
    value: deployment
  - id: name
    label: Names the Deployment api
    path: names
    op: contains
    value: api
  - id: namespace
    label: Runs in namespace payments
    path: flags.namespace
    op: equals
    value: payments
  solution:
  - command: kubectl rollout pause deployment/api -n payments
  - command: k -n payments rollout pause deploy api
  negatives:
  - command: kubectl rollout resume deployment/api -n payments
    why: resume is the command to run after the changes, to start the single rollout.
  - command: kubectl scale deployment api --replicas=0 -n payments
    why: Scaling to 0 stops the application; it does not hold back rollouts.
  - command: kubectl rollout pause deployment/api
    why: Without -n the command looks for api in the context namespace, default.
explanation:
  correct:
    en: '`kubectl rollout pause deployment/api -n payments` sets `spec.paused: true`: template changes made while the Deployment is paused do not trigger a rollout. After the three changes, `kubectl rollout resume deployment/api -n payments` starts one rollout with all of them. A paused Deployment cannot be rolled back until it is resumed.'
references:
- title: Deployments
  url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
