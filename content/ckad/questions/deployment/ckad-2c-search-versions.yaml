id: ckad-2c-search-versions
objective: "2.3.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The chart repository `acme` is already added to your Helm client and its index is up to date. Before pinning a version, you need to see **every** version of the chart `acme/webapp` that the repository offers, one per line, not only the latest one.

    Type the single command you would run.
body:
  mode: invocation
  tools: [helm]
  namespace: default
answer:
  checks:
  - id: search
    label: Uses helm search
    path: verb
    op: equals
    value: search
  - id: repo
    label: Searches the added repositories (search repo)
    path: args[0]
    op: equals
    value: repo
  - id: keyword
    label: Searches for acme/webapp
    path: args[1]
    op: oneOf
    value: ["acme/webapp", "webapp"]
  - id: versions
    label: Lists every version (--versions)
    path: flags.versions
    op: equals
    value: true
  - id: no-constraint
    label: Sets no version constraint that would hide versions
    path: flags.version
    op: absent
  solution:
  - command: helm search repo acme/webapp --versions
  - command: helm search repo webapp --versions
  negatives:
  - command: helm search repo acme/webapp
    why: Without --versions, search repo shows only the latest stable version of each chart.
  - command: helm search hub webapp --versions
    why: search hub queries Artifact Hub, not the acme repository added to the client.
  - command: helm search repo acme/webapp --version 2.3.1
    why: --version is a semantic version constraint; it returns the latest version matching it, not the full list.
explanation:
  correct:
    en: '`helm search repo` searches the local index of the repositories added to the client, without a network call. By default it prints only the latest stable version of each matching chart; `--versions` (short `-l`) prints every version on its own line. `helm search hub` searches Artifact Hub instead, and `--version` filters with a semver constraint.'
references:
- title: helm search repo
  url: https://helm.sh/docs/helm/helm_search_repo/
