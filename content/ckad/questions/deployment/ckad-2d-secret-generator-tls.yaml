id: ckad-2d-secret-generator-tls
objective: "2.4.2"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    The directory `/opt/shop` contains `ingress.yaml` and the files `certs/tls.crt` and `certs/tls.key`. The Ingress needs a TLS Secret named `shop-tls`. Write `/opt/shop/kustomization.yaml` that keeps the Ingress and generates `shop-tls` as a Secret of type `kubernetes.io/tls` whose keys are `tls.crt` and `tls.key`.
body:
  starter: |
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    resources:
    - ingress.yaml
answer:
  checks:
  - id: resources
    label: Keeps ingress.yaml in resources
    path: resources
    op: contains
    value: ingress.yaml
  - id: type
    label: Generates shop-tls with type kubernetes.io/tls
    path: secretGenerator[name=shop-tls].type
    op: equals
    value: kubernetes.io/tls
  - id: crt
    label: Adds certs/tls.crt under the key tls.crt
    path: secretGenerator[name=shop-tls].files
    op: matches
    value: '"(tls\.crt=)?certs/tls\.crt"'
  - id: key
    label: Adds certs/tls.key under the key tls.key
    path: secretGenerator[name=shop-tls].files
    op: matches
    value: '"(tls\.key=)?certs/tls\.key"'
  - id: no-configmap
    label: Generates a Secret, not a ConfigMap
    path: configMapGenerator
    op: absent
  solution:
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
      - ingress.yaml
      secretGenerator:
      - name: shop-tls
        type: kubernetes.io/tls
        files:
        - certs/tls.crt
        - certs/tls.key
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
      - ingress.yaml
      secretGenerator:
      - name: shop-tls
        files:
        - tls.crt=certs/tls.crt
        - tls.key=certs/tls.key
        type: "kubernetes.io/tls"
  negatives:
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
      - ingress.yaml
      secretGenerator:
      - name: shop-tls
        files:
        - certs/tls.crt
        - certs/tls.key
    why: Without type the generated Secret is Opaque, not kubernetes.io/tls.
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
      - ingress.yaml
      secretGenerator:
      - name: shop-tls
        type: kubernetes.io/tls
        files:
        - crt=certs/tls.crt
        - key=certs/tls.key
    why: The keys would be crt and key; a kubernetes.io/tls Secret needs the keys tls.crt and tls.key.
  - manifest: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
      - ingress.yaml
      configMapGenerator:
      - name: shop-tls
        files:
        - certs/tls.crt
        - certs/tls.key
    why: configMapGenerator creates a ConfigMap; an Ingress TLS section references a Secret.
explanation:
  correct:
    en: '`secretGenerator` works like `configMapGenerator` and base64-encodes the data. `type: kubernetes.io/tls` sets the Secret type (the default is `Opaque`), and a file entry is stored under its file name, so `certs/tls.crt` becomes the key `tls.crt`; `tls.crt=certs/tls.crt` is the explicit form. The generated name gets a hash suffix and the Ingress reference is updated to it.'
references:
- title: secretGenerator
  url: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/secretgenerator/
- title: Managing Secrets using Kustomize
  url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kustomize/
