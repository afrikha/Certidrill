id: ckad-1a-podman-push-destination
objective: "1.1.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Only Podman is installed on this host. The local image store contains `localhost/billing:1.5`, and you are already logged in to `registry.example.com`.

    Push this image to `registry.example.com/finance/billing:1.5` without adding a new tag to the local image first.

    Type the single command you would run.
body:
  mode: invocation
  tools: [podman, docker]
  namespace: default
answer:
  checks:
  - id: tool
    label: Uses podman, the tool installed on the host
    path: tool
    op: equals
    value: podman
  - id: verb
    label: It is a push command
    path: verb
    op: equals
    value: push
  - id: source
    label: Pushes the local image localhost/billing:1.5
    path: args[0]
    op: oneOf
    value: [localhost/billing:1.5, billing:1.5]
  - id: destination
    label: Sends it to registry.example.com/finance/billing:1.5
    path: args[1]
    op: oneOf
    value: [registry.example.com/finance/billing:1.5, docker://registry.example.com/finance/billing:1.5]
  solution:
  - command: podman push localhost/billing:1.5 registry.example.com/finance/billing:1.5
  - command: podman push billing:1.5 docker://registry.example.com/finance/billing:1.5
  negatives:
  - command: podman push localhost/billing:1.5
    why: Without a destination, Podman pushes to the registry in the image name, localhost.
  - command: podman tag localhost/billing:1.5 registry.example.com/finance/billing:1.5
    why: tag only adds a local name; nothing is sent to the registry, and the task forbids adding a tag.
  - command: podman push registry.example.com/finance/billing:1.5
    why: No local image has that name, because it was never tagged.
explanation:
  correct:
    en: '`podman push IMAGE DESTINATION` sends a local image to a destination that can differ from its name; `docker://` is the explicit registry transport and may be omitted. Docker has no destination argument: there you would first run `docker tag` and then `docker push` with the new name.'
references:
- title: podman-push
  url: https://docs.podman.io/en/latest/markdown/podman-push.1.html
