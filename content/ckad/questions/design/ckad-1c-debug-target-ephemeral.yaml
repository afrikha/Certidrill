id: ckad-1c-debug-target-ephemeral
objective: "1.3.3"
difficulty: 3
status: draft
type: command
stem:
  en: |-
    In namespace `payments`, Pod `ledger` runs a single container named `app` built from a distroless image: it has no shell. The Pod does not set `shareProcessNamespace`.

    Without restarting or copying the Pod, attach an interactive ephemeral container with the image `busybox:1.36` that can see the processes of `app` (for example with `ps`). Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl debug
    path: verb
    op: equals
    value: debug
  - id: pod
    label: Targets Pod ledger
    path: names
    op: contains
    value: ledger
  - id: image
    label: Ephemeral container runs busybox:1.36
    path: flags.image
    op: equals
    value: busybox:1.36
  - id: target
    label: Shares the process namespace of container app (--target)
    path: flags.target
    op: equals
    value: app
  - id: interactive
    label: Interactive session (-i)
    path: flags.stdin
    op: equals
    value: true
  - id: no-copy
    label: Debugs the running Pod, not a copy
    path: flags.copy-to
    op: absent
  - id: namespace
    label: Runs in namespace payments
    path: flags.namespace
    op: equals
    value: payments
  solution:
  - command: kubectl debug -it ledger -n payments --image=busybox:1.36 --target=app
  - command: k -n payments debug pod/ledger -it --image busybox:1.36 --target app
  - command: kubectl debug ledger --stdin --tty --image=busybox:1.36 --target=app --namespace=payments
  negatives:
  - command: kubectl debug -it ledger -n payments --image=busybox:1.36
    why: Without --target the ephemeral container gets its own process namespace (the Pod does not share one), so ps does not show the processes of app.
  - command: kubectl debug -it ledger -n payments --image=busybox:1.36 --share-processes --copy-to=ledger-debug
    why: --copy-to creates a new Pod, a copy of ledger; the task asks to debug the running Pod without copying it.
  - command: kubectl exec -it ledger -n payments -c app -- sh
    why: The distroless image of app has no shell, so exec fails.
explanation:
  correct:
    en: '`kubectl debug -it ledger --image=busybox:1.36 --target=app` adds an ephemeral container to the running Pod and attaches to it. `--target` puts it in the process namespace of `app`, which is needed when the Pod does not share its process namespace; the container runtime must support it. `--copy-to` with `--share-processes` is the other technique, but it debugs a copy of the Pod.'
references:
- title: Debug Running Pods
  url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/
