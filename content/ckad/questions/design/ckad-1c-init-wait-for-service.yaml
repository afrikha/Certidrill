id: ckad-1c-init-wait-for-service
objective: "1.3.1"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    In namespace `shop`, Pod `checkout` runs one container named `app` with the image `registry.example.com/checkout:3.1`. The application crashes when the Service `payments-api` (same namespace) does not exist yet.

    Complete the manifest so that the `app` container starts only after the name `payments-api` resolves in cluster DNS:

    - add an init container named `wait-payments` with the image `busybox:1.36`;
    - it runs `sh -c 'until nslookup payments-api; do sleep 2; done'`;
    - `app` stays the only application container.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: checkout
      namespace: shop
    spec:
      containers:
      - name: app
        image: registry.example.com/checkout:3.1
answer:
  checks:
  - id: pod
    label: A Pod named checkout in namespace shop
    path: metadata
    op: subset
    value: {name: checkout, namespace: shop}
  - id: app
    label: Container app runs registry.example.com/checkout:3.1
    path: spec.containers[name=app].image
    op: equals
    value: registry.example.com/checkout:3.1
  - id: one-app-container
    label: app is the only entry in containers
    path: spec.containers
    op: length
    value: 1
  - id: init-image
    label: Init container wait-payments runs busybox:1.36
    path: spec.initContainers[name=wait-payments].image
    op: equals
    value: busybox:1.36
  - id: init-lookup
    label: wait-payments loops on nslookup payments-api
    path: spec.initContainers[name=wait-payments]
    op: matches
    value: "until nslookup payments-api"
  - id: init-not-sidecar
    label: wait-payments is a regular init container (no restartPolicy)
    path: spec.initContainers[name=wait-payments].restartPolicy
    op: absent
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: checkout
        namespace: shop
      spec:
        initContainers:
        - name: wait-payments
          image: busybox:1.36
          command: ['sh', '-c', 'until nslookup payments-api; do sleep 2; done']
        containers:
        - name: app
          image: registry.example.com/checkout:3.1
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: checkout
        namespace: shop
      spec:
        containers:
        - name: app
          image: registry.example.com/checkout:3.1
        initContainers:
        - name: wait-payments
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ["until nslookup payments-api; do sleep 2; done"]
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: checkout
        namespace: shop
      spec:
        containers:
        - name: wait-payments
          image: busybox:1.36
          command: ['sh', '-c', 'until nslookup payments-api; do sleep 2; done']
        - name: app
          image: registry.example.com/checkout:3.1
    why: Entries of containers start together, so app starts at once without waiting for the lookup to succeed.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: checkout
        namespace: shop
      spec:
        initContainers:
        - name: wait-payments
          image: busybox:1.36
          restartPolicy: Always
          command: ['sh', '-c', 'until nslookup payments-api; do sleep 2; done']
        containers:
        - name: app
          image: registry.example.com/checkout:3.1
    why: restartPolicy Always turns the init container into a sidecar; app then starts as soon as the sidecar has started, not after it completes.
explanation:
  correct:
    en: 'Init containers run one after the other and must all exit successfully before the app containers start, so `wait-payments` in `spec.initContainers` blocks `app` until `nslookup payments-api` succeeds. While it loops, `kubectl get pod` shows `Init:0/1`. Putting the loop in `containers` starts it in parallel with `app`, and adding `restartPolicy: Always` makes it a native sidecar that does not have to complete.'
references:
- title: Init Containers
  url: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
