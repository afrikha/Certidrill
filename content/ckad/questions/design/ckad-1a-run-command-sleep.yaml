id: ckad-1a-run-command-sleep
objective: "1.1.3"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    In namespace `ops`, create a Pod named `toolbox` from the image `busybox:1.36`. Its container must run `sleep 3600` as the container `command` (not as `args`), and the Pod must not be restarted when the command exits.

    Type the single command you would run.
body:
  mode: object
  namespace: default
answer:
  checks:
  - id: kind
    label: The object is a Pod
    path: kind
    op: equals
    value: Pod
  - id: name
    label: It is named toolbox
    path: metadata.name
    op: equals
    value: toolbox
  - id: namespace
    label: It is created in namespace ops
    path: metadata.namespace
    op: equals
    value: ops
  - id: image
    label: Its container runs busybox:1.36
    path: spec.containers[0].image
    op: equals
    value: busybox:1.36
  - id: command
    label: The container command is sleep 3600
    path: spec.containers[0].command
    op: equals
    value: [sleep, "3600"]
  - id: args
    label: No args are set
    path: spec.containers[0].args
    op: absent
  - id: restart
    label: restartPolicy is Never
    path: spec.restartPolicy
    op: equals
    value: Never
  solution:
  - command: kubectl run toolbox --image=busybox:1.36 -n ops --restart=Never --command -- sleep 3600
    output: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          run: toolbox
        name: toolbox
        namespace: ops
      spec:
        containers:
        - command:
          - sleep
          - "3600"
          image: busybox:1.36
          name: toolbox
          resources: {}
        dnsPolicy: ClusterFirst
        restartPolicy: Never
      status: {}
  - command: k -n ops run toolbox --image busybox:1.36 --restart Never --dry-run=client -o yaml --command -- sleep 3600
    output: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          run: toolbox
        name: toolbox
        namespace: ops
      spec:
        containers:
        - command:
          - sleep
          - "3600"
          image: busybox:1.36
          name: toolbox
          resources: {}
        dnsPolicy: ClusterFirst
        restartPolicy: Never
      status: {}
  negatives:
  - command: kubectl run toolbox --image=busybox:1.36 -n ops --restart=Never -- sleep 3600
    why: Without --command, the words after -- become args, which are appended to the image entrypoint instead of replacing it.
    output: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          run: toolbox
        name: toolbox
        namespace: ops
      spec:
        containers:
        - args:
          - sleep
          - "3600"
          image: busybox:1.36
          name: toolbox
          resources: {}
        dnsPolicy: ClusterFirst
        restartPolicy: Never
      status: {}
  - command: kubectl run toolbox --image=busybox:1.36 -n ops --command -- sleep 3600
    why: The default --restart is Always, so the kubelet restarts the container each time sleep ends.
    output: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          run: toolbox
        name: toolbox
        namespace: ops
      spec:
        containers:
        - command:
          - sleep
          - "3600"
          image: busybox:1.36
          name: toolbox
          resources: {}
        dnsPolicy: ClusterFirst
        restartPolicy: Always
      status: {}
explanation:
  correct:
    en: 'With `--command`, the words after `--` fill the container `command` (which replaces the image ENTRYPOINT); without it they fill `args` (which replaces CMD). `--restart=Never` sets `restartPolicy: Never`; the default is `Always`. Every kubectl flag, including `--dry-run` and `-o`, must come before `--`.'
references:
- title: kubectl run
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_run/
- title: Define a Command and Arguments for a Container
  url: https://kubernetes.io/docs/tasks/configure-pod-container/define-command-argument-container/
