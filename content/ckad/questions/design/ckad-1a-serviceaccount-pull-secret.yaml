id: ckad-1a-serviceaccount-pull-secret
objective: "1.1.4"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    The Secret `ci-registry`, of type `kubernetes.io/dockerconfigjson`, exists in namespace `ci`. Pods that run as one ServiceAccount must get these pull credentials without listing them in their own spec.

    Write one file with two documents:

    - a ServiceAccount named `deployer` in namespace `ci` that adds `ci-registry` as an image pull secret to the Pods using it;
    - a Pod named `runner` in namespace `ci` that runs as `deployer`, with one container named `runner` running `registry.example.com/ci/runner:5.0`.
body:
  starter: ""
answer:
  checks:
  - id: sa
    label: A ServiceAccount named deployer in namespace ci
    select: {kind: ServiceAccount, name: deployer}
    path: metadata.namespace
    op: equals
    value: ci
  - id: sa-pull-secret
    label: The ServiceAccount lists ci-registry in imagePullSecrets
    select: {kind: ServiceAccount, name: deployer}
    path: imagePullSecrets
    op: contains
    value: {name: ci-registry}
  - id: pod
    label: A Pod named runner in namespace ci
    select: {kind: Pod, name: runner}
    path: metadata.namespace
    op: equals
    value: ci
  - id: pod-sa
    label: The Pod runs as ServiceAccount deployer
    select: {kind: Pod, name: runner}
    path: spec.serviceAccountName
    op: equals
    value: deployer
  - id: pod-image
    label: Container runner runs registry.example.com/ci/runner:5.0
    select: {kind: Pod, name: runner}
    path: spec.containers[name=runner].image
    op: equals
    value: registry.example.com/ci/runner:5.0
  solution:
  - manifest: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: deployer
        namespace: ci
      imagePullSecrets:
      - name: ci-registry
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: runner
        namespace: ci
      spec:
        serviceAccountName: deployer
        containers:
        - name: runner
          image: registry.example.com/ci/runner:5.0
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: runner
        namespace: ci
      spec:
        serviceAccountName: deployer
        containers:
        - name: runner
          image: registry.example.com/ci/runner:5.0
      ---
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        namespace: ci
        name: deployer
      imagePullSecrets: [{name: ci-registry}]
  negatives:
  - manifest: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: deployer
        namespace: ci
      secrets:
      - name: ci-registry
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: runner
        namespace: ci
      spec:
        serviceAccountName: deployer
        containers:
        - name: runner
          image: registry.example.com/ci/runner:5.0
    why: The secrets field of a ServiceAccount is not used for image pulls; only imagePullSecrets is copied into the Pods.
  - manifest: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: deployer
        namespace: ci
      spec:
        imagePullSecrets:
        - name: ci-registry
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: runner
        namespace: ci
      spec:
        serviceAccountName: deployer
        containers:
        - name: runner
          image: registry.example.com/ci/runner:5.0
    why: A ServiceAccount has no spec; imagePullSecrets is a top-level field of the object.
  - manifest: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: deployer
        namespace: ci
      imagePullSecrets:
      - name: ci-registry
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: runner
        namespace: ci
      spec:
        containers:
        - name: runner
          image: registry.example.com/ci/runner:5.0
    why: Without serviceAccountName the Pod runs as the default ServiceAccount, which does not carry the pull secret.
explanation:
  correct:
    en: 'A ServiceAccount has a top-level `imagePullSecrets` list (it has no `spec`). When a Pod with `serviceAccountName: deployer` is created, the ServiceAccount admission controller copies that list into the Pod spec when the Pod has no `imagePullSecrets` of its own, so the Pod itself needs none. The ServiceAccount, the Secret and the Pod must be in the same namespace.'
references:
- title: Configure Service Accounts for Pods
  url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
- title: Managing Service Accounts
  url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
