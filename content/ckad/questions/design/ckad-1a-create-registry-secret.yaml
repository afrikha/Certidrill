id: ckad-1a-create-registry-secret
objective: "1.1.4"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Pods in namespace `shop` must pull images from the private registry `registry.example.com` with the user `ci-bot` and the password `example-pass`.

    Create, in namespace `shop`, the Secret named `regcred` that Pods can reference in `imagePullSecrets` for this registry.

    Type the single command you would run.
body:
  mode: object
  namespace: default
answer:
  checks:
  - id: kind
    label: The object is a Secret
    path: kind
    op: equals
    value: Secret
  - id: name
    label: It is named regcred
    path: metadata.name
    op: equals
    value: regcred
  - id: namespace
    label: It is created in namespace shop
    path: metadata.namespace
    op: equals
    value: shop
  - id: type
    label: Its type is kubernetes.io/dockerconfigjson
    path: type
    op: equals
    value: kubernetes.io/dockerconfigjson
  - id: server
    label: The .dockerconfigjson key holds credentials for registry.example.com
    path: data[".dockerconfigjson"]
    op: matches
    value: '^eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6'
  solution:
  - command: kubectl create secret docker-registry regcred -n shop --docker-server=registry.example.com --docker-username=ci-bot --docker-password=example-pass
    output: |
      apiVersion: v1
      data:
        .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6ImNpLWJvdCIsInBhc3N3b3JkIjoiZXhhbXBsZS1wYXNzIiwiYXV0aCI6Ilkya3RZbTkwT21WNFlXMXdiR1V0Y0dGemN3PT0ifX19
      kind: Secret
      metadata:
        name: regcred
        namespace: shop
      type: kubernetes.io/dockerconfigjson
  - command: k create secret docker-registry regcred --docker-username ci-bot --docker-password example-pass --docker-server registry.example.com --namespace shop --dry-run=client -o yaml
    output: |
      apiVersion: v1
      data:
        .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6ImNpLWJvdCIsInBhc3N3b3JkIjoiZXhhbXBsZS1wYXNzIiwiYXV0aCI6Ilkya3RZbTkwT21WNFlXMXdiR1V0Y0dGemN3PT0ifX19
      kind: Secret
      metadata:
        name: regcred
        namespace: shop
      type: kubernetes.io/dockerconfigjson
  negatives:
  - command: kubectl create secret generic regcred -n shop --from-literal=username=ci-bot --from-literal=password=example-pass
    why: A generic Secret is of type Opaque; the kubelet only uses kubernetes.io/dockerconfigjson (or dockercfg) Secrets as image pull credentials.
    output: |
      apiVersion: v1
      data:
        password: ZXhhbXBsZS1wYXNz
        username: Y2ktYm90
      kind: Secret
      metadata:
        name: regcred
        namespace: shop
  - command: kubectl create secret docker-registry regcred -n shop --docker-username=ci-bot --docker-password=example-pass
    why: Without --docker-server the credentials are stored for Docker Hub (https://index.docker.io/v1/), not for registry.example.com.
    output: |
      apiVersion: v1
      data:
        .dockerconfigjson: eyJhdXRocyI6eyJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOnsidXNlcm5hbWUiOiJjaS1ib3QiLCJwYXNzd29yZCI6ImV4YW1wbGUtcGFzcyIsImF1dGgiOiJZMmt0WW05ME9tVjRZVzF3YkdVdGNHRnpjdz09In19fQ==
      kind: Secret
      metadata:
        name: regcred
        namespace: shop
      type: kubernetes.io/dockerconfigjson
  - command: kubectl create secret docker-registry regcred --docker-server=registry.example.com --docker-username=ci-bot --docker-password=example-pass
    why: Without -n the Secret is created in the context namespace, default; imagePullSecrets only reads Secrets from the Pod's own namespace.
    output: |
      apiVersion: v1
      data:
        .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6ImNpLWJvdCIsInBhc3N3b3JkIjoiZXhhbXBsZS1wYXNzIiwiYXV0aCI6Ilkya3RZbTkwT21WNFlXMXdiR1V0Y0dGemN3PT0ifX19
      kind: Secret
      metadata:
        name: regcred
      type: kubernetes.io/dockerconfigjson
explanation:
  correct:
    en: '`kubectl create secret docker-registry` builds a Secret of type `kubernetes.io/dockerconfigjson` whose `.dockerconfigjson` key holds an `auths` entry for `--docker-server` (default `https://index.docker.io/v1/`); `--docker-email` is optional. The Secret must live in the namespace of the Pods that list it in `imagePullSecrets`.'
references:
- title: kubectl create secret docker-registry
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_docker-registry/
- title: Pull an Image from a Private Registry
  url: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
