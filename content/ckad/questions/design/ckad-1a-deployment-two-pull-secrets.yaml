id: ckad-1a-deployment-two-pull-secrets
objective: "1.1.4"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    In namespace `payments`, the Secrets `regcred-example` (credentials for `registry.example.com`) and `regcred-quay` (credentials for `quay.example.net`) already exist.

    Write the manifest of a Deployment named `portal` in namespace `payments` with 2 replicas, Pods labelled `app: portal` and selected by that label, and two containers:

    - `web` running `registry.example.com/payments/portal-web:4.0`;
    - `pdf` running `quay.example.net/tools/pdf-render:1.9`.

    Both private images must be pulled with the right credentials.
body:
  starter: ""
answer:
  checks:
  - id: kind
    label: An apps/v1 Deployment
    path: apiVersion
    op: equals
    value: apps/v1
  - id: deployment
    label: A Deployment named portal in namespace payments
    path: metadata
    op: subset
    value: {name: portal, namespace: payments}
  - id: replicas
    label: It runs 2 replicas
    path: spec.replicas
    op: equals
    value: 2
  - id: selector
    label: The selector matches app=portal
    path: spec.selector.matchLabels
    op: equals
    value: {app: portal}
  - id: labels
    label: The Pod template has the label app=portal
    path: spec.template.metadata.labels.app
    op: equals
    value: portal
  - id: web
    label: Container web runs registry.example.com/payments/portal-web:4.0
    path: spec.template.spec.containers[name=web].image
    op: equals
    value: registry.example.com/payments/portal-web:4.0
  - id: pdf
    label: Container pdf runs quay.example.net/tools/pdf-render:1.9
    path: spec.template.spec.containers[name=pdf].image
    op: equals
    value: quay.example.net/tools/pdf-render:1.9
  - id: secret-example
    label: The Pod template lists regcred-example in imagePullSecrets
    path: spec.template.spec.imagePullSecrets
    op: contains
    value: {name: regcred-example}
  - id: secret-quay
    label: The Pod template lists regcred-quay in imagePullSecrets
    path: spec.template.spec.imagePullSecrets
    op: contains
    value: {name: regcred-quay}
  solution:
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: portal
        namespace: payments
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: portal
        template:
          metadata:
            labels:
              app: portal
          spec:
            imagePullSecrets:
            - name: regcred-example
            - name: regcred-quay
            containers:
            - name: web
              image: registry.example.com/payments/portal-web:4.0
            - name: pdf
              image: quay.example.net/tools/pdf-render:1.9
  negatives:
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: portal
        namespace: payments
      spec:
        replicas: 2
        imagePullSecrets:
        - name: regcred-example
        - name: regcred-quay
        selector:
          matchLabels:
            app: portal
        template:
          metadata:
            labels:
              app: portal
          spec:
            containers:
            - name: web
              image: registry.example.com/payments/portal-web:4.0
            - name: pdf
              image: quay.example.net/tools/pdf-render:1.9
    why: imagePullSecrets belongs to the Pod spec, spec.template.spec; at the Deployment spec level it is an unknown field.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: portal
        namespace: payments
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: portal
        template:
          metadata:
            labels:
              app: portal
          spec:
            imagePullSecrets:
            - name: regcred-example
            containers:
            - name: web
              image: registry.example.com/payments/portal-web:4.0
            - name: pdf
              image: quay.example.net/tools/pdf-render:1.9
    why: Only the registry.example.com credentials are given, so pulling the quay.example.net image fails with ErrImagePull.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: portal
        namespace: payments
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: portal
        template:
          metadata:
            labels:
              app: portal
          spec:
            containers:
            - name: web
              image: registry.example.com/payments/portal-web:4.0
              imagePullSecrets:
              - name: regcred-example
            - name: pdf
              image: quay.example.net/tools/pdf-render:1.9
              imagePullSecrets:
              - name: regcred-quay
    why: There is no per-container imagePullSecrets; the list is set once in the Pod spec and covers every container.
explanation:
  correct:
    en: 'In a Deployment the Pod spec is `spec.template.spec`, and `imagePullSecrets` goes there, listing one Secret per registry; the kubelet tries the matching credentials for each image. The field does not exist on containers or at the Deployment spec level. The selector must match the template labels.'
references:
- title: Images
  url: https://kubernetes.io/docs/concepts/containers/images/
- title: Deployments
  url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
