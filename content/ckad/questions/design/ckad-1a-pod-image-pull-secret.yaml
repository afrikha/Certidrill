id: ckad-1a-pod-image-pull-secret
objective: "1.1.4"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    The Secret `regcred`, of type `kubernetes.io/dockerconfigjson`, already exists in namespace `billing` and holds credentials for `registry.example.com`.

    Write the manifest of a Pod named `invoice` in namespace `billing` with one container named `invoice` running the private image `registry.example.com/finance/invoice:3.2`, pulled with the credentials of `regcred`.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: invoice
      namespace: billing
    spec:
      containers:
      - name: invoice
        image: registry.example.com/finance/invoice:3.2
answer:
  checks:
  - id: pod
    label: A Pod named invoice in namespace billing
    path: metadata
    op: subset
    value: {name: invoice, namespace: billing}
  - id: image
    label: Container invoice runs registry.example.com/finance/invoice:3.2
    path: spec.containers[name=invoice].image
    op: equals
    value: registry.example.com/finance/invoice:3.2
  - id: pull-secret
    label: The Pod spec lists regcred in imagePullSecrets
    path: spec.imagePullSecrets
    op: contains
    value: {name: regcred}
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: invoice
        namespace: billing
      spec:
        containers:
        - name: invoice
          image: registry.example.com/finance/invoice:3.2
        imagePullSecrets:
        - name: regcred
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        namespace: billing
        name: invoice
      spec:
        imagePullSecrets: [{name: regcred}]
        containers:
        - image: registry.example.com/finance/invoice:3.2
          name: invoice
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: invoice
        namespace: billing
      spec:
        containers:
        - name: invoice
          image: registry.example.com/finance/invoice:3.2
          imagePullSecrets:
          - name: regcred
    why: imagePullSecrets is a Pod spec field, not a container field; under the container it is rejected or ignored.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: invoice
        namespace: billing
      spec:
        containers:
        - name: invoice
          image: registry.example.com/finance/invoice:3.2
        imagePullSecrets:
        - regcred
    why: Each imagePullSecrets item is an object with a name field, not a bare string.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: invoice
        namespace: billing
      spec:
        containers:
        - name: invoice
          image: registry.example.com/finance/invoice:3.2
        imagePullSecret:
          name: regcred
    why: The field is the list imagePullSecrets; imagePullSecret does not exist.
explanation:
  correct:
    en: '`spec.imagePullSecrets` is a list of references, `- name: regcred`, at the Pod spec level next to `containers`. The kubelet uses those credentials for every image of the Pod. The Secret must be of type `kubernetes.io/dockerconfigjson` (or `kubernetes.io/dockercfg`) and in the Pod namespace.'
references:
- title: Pull an Image from a Private Registry
  url: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
- title: Images
  url: https://kubernetes.io/docs/concepts/containers/images/
