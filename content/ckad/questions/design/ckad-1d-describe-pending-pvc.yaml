id: ckad-1d-describe-pending-pvc
objective: "1.4.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    In namespace `shop`, the PersistentVolumeClaim `uploads` has been `Pending` for several minutes.

    Display the claim's details together with its recent events, which explain why it is not bound. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl describe
    path: verb
    op: equals
    value: describe
  - id: resource
    label: Describes a PersistentVolumeClaim
    path: resource
    op: equals
    value: persistentvolumeclaim
  - id: name
    label: Names the claim uploads
    path: names
    op: contains
    value: uploads
  - id: namespace
    label: Runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  solution:
  - command: kubectl describe pvc uploads -n shop
  - command: k -n shop describe persistentvolumeclaim/uploads
  - command: kubectl describe persistentvolumeclaims uploads --namespace=shop
  negatives:
  - command: kubectl get pvc uploads -n shop
    why: get prints only the status line (Pending), not the events that explain it.
  - command: kubectl describe pv uploads
    why: uploads is a claim, not a PersistentVolume; a Pending claim has no volume yet.
  - command: kubectl describe pvc uploads
    why: Without -n the command looks for uploads in the context namespace, default.
explanation:
  correct:
    en: '`kubectl describe pvc uploads -n shop` shows the claim''s StorageClass, access modes, requested size and, at the bottom, its events (for example no matching PersistentVolume, an unknown StorageClass, or a claim waiting for its first consumer). `kubectl get` shows only the phase.'
references:
- title: Persistent Volumes
  url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
