id: ckad-1a-load-image-archive
objective: "1.1.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Docker and Podman are both installed: use either. The file `/opt/images/worker-1.3.tar` was created with `docker save` on another host.

    Load the image it contains, with its tags and layers, into the local image store.

    Type the single command you would run.
body:
  mode: invocation
  tools: [docker, podman]
  namespace: default
answer:
  checks:
  - id: tool
    label: Uses docker or podman
    path: tool
    op: oneOf
    value: [docker, podman]
  - id: verb
    label: It is a load command (load or image load)
    path: verb
    op: oneOf
    value: [load, image]
  - id: sub
    label: No other sub-command or positional argument
    path: args
    op: matches
    value: '^\[("load")?\]$'
  - id: input
    label: Reads the archive /opt/images/worker-1.3.tar
    path: flags
    op: matches
    value: '"input":"/opt/images/worker-1\.3\.tar"'
  solution:
  - command: docker load -i /opt/images/worker-1.3.tar
  - command: podman load --input /opt/images/worker-1.3.tar
  - command: docker image load --input=/opt/images/worker-1.3.tar
  negatives:
  - command: docker import /opt/images/worker-1.3.tar
    why: import creates an image from a container filesystem tarball and drops the image tags and metadata; a docker save archive is loaded with load.
  - command: docker load /opt/images/worker-1.3.tar
    why: load reads standard input unless -i/--input names the file; the path is not a positional argument.
  - command: docker image import /opt/images/worker-1.3.tar
    why: image import is the same as import, not load.
explanation:
  correct:
    en: '`docker load -i FILE` (alias `docker image load`) restores the images, tags and layers written by `docker save`; Podman accepts the same `load -i` syntax. Without `-i`/`--input` the command reads the archive from standard input. `docker import` is for a filesystem tarball exported from a container.'
references:
- title: docker image load
  url: https://docs.docker.com/reference/cli/docker/image/load/
- title: docker image save
  url: https://docs.docker.com/reference/cli/docker/image/save/
