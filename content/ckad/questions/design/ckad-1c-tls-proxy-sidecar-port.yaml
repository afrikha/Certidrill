id: ckad-1c-tls-proxy-sidecar-port
objective: "1.3.2"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    In namespace `finance`, the Pod `billing-api` (label `app: billing`) runs the container `api` (`registry.example.com/finance/billing-api:4.2`), which listens on `127.0.0.1:8080` only. Clients must reach it over TLS through a proxy in the same Pod. Write one file with two documents:

    1. The Pod `billing-api`, completed with a **native sidecar** named `tls-proxy`, image `registry.example.com/tools/tls-proxy:1.5`, `args: ["--listen=0.0.0.0:8443", "--upstream=127.0.0.1:8080"]`. It must be running before `api` starts and for the whole life of the Pod, and the Pod must count as Ready only when a TCP connection to port 8443 succeeds.
    2. A ClusterIP Service `billing` in namespace `finance` that selects `app: billing` and exposes port 443 to the clients.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: billing-api
      namespace: finance
      labels:
        app: billing
    spec:
      containers:
      - name: api
        image: registry.example.com/finance/billing-api:4.2
answer:
  checks:
  - id: pod
    label: The Pod billing-api in namespace finance
    select: {kind: Pod, name: billing-api}
    path: metadata
    op: subset
    value: {name: billing-api, namespace: finance, labels: {app: billing}}
  - id: api-only
    label: api stays the only application container
    select: {kind: Pod, name: billing-api}
    path: spec.containers
    op: length
    value: 1
  - id: api-image
    label: Container api runs registry.example.com/finance/billing-api:4.2
    select: {kind: Pod, name: billing-api}
    path: spec.containers[name=api].image
    op: equals
    value: registry.example.com/finance/billing-api:4.2
  - id: sidecar
    label: tls-proxy is an init container with restartPolicy Always
    select: {kind: Pod, name: billing-api}
    path: spec.initContainers[name=tls-proxy].restartPolicy
    op: equals
    value: Always
  - id: sidecar-image
    label: tls-proxy runs registry.example.com/tools/tls-proxy:1.5 with the given args
    select: {kind: Pod, name: billing-api}
    path: spec.initContainers[name=tls-proxy]
    op: subset
    value: {image: "registry.example.com/tools/tls-proxy:1.5", args: ["--listen=0.0.0.0:8443", "--upstream=127.0.0.1:8080"]}
  - id: readiness
    label: tls-proxy has a TCP readiness probe on port 8443
    select: {kind: Pod, name: billing-api}
    path: spec.initContainers[name=tls-proxy].readinessProbe.tcpSocket.port
    op: equals
    value: 8443
  - id: svc
    label: The Service billing in namespace finance
    select: {kind: Service}
    path: metadata
    op: subset
    value: {name: billing, namespace: finance}
  - id: svc-selector
    label: The Service selects app billing
    select: {kind: Service}
    path: spec.selector
    op: equals
    value: {app: billing}
  - id: svc-port
    label: The Service port 443 forwards to the proxy's port 8443
    select: {kind: Service}
    path: spec.ports
    op: contains
    value: {port: 443, targetPort: 8443}
  - id: svc-type
    label: The Service is of type ClusterIP
    select: {kind: Service}
    path: spec
    op: matches
    value: '^(?![\s\S]*"type":"(?!ClusterIP")).*$'
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing-api
        namespace: finance
        labels:
          app: billing
      spec:
        initContainers:
        - name: tls-proxy
          image: registry.example.com/tools/tls-proxy:1.5
          restartPolicy: Always
          args: ["--listen=0.0.0.0:8443", "--upstream=127.0.0.1:8080"]
          ports:
          - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
        containers:
        - name: api
          image: registry.example.com/finance/billing-api:4.2
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: billing
        namespace: finance
      spec:
        selector:
          app: billing
        ports:
        - port: 443
          targetPort: 8443
  - manifest: |
      apiVersion: v1
      kind: Service
      metadata:
        name: billing
        namespace: finance
      spec:
        type: ClusterIP
        selector:
          app: billing
        ports:
        - name: https
          protocol: TCP
          port: 443
          targetPort: 8443
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing-api
        namespace: finance
        labels:
          app: billing
      spec:
        containers:
        - name: api
          image: registry.example.com/finance/billing-api:4.2
        initContainers:
        - name: tls-proxy
          image: registry.example.com/tools/tls-proxy:1.5
          args:
          - --listen=0.0.0.0:8443
          - --upstream=127.0.0.1:8080
          restartPolicy: Always
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 5
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing-api
        namespace: finance
        labels:
          app: billing
      spec:
        initContainers:
        - name: tls-proxy
          image: registry.example.com/tools/tls-proxy:1.5
          restartPolicy: Always
          args: ["--listen=0.0.0.0:8443", "--upstream=127.0.0.1:8080"]
          readinessProbe:
            tcpSocket:
              port: 8443
        containers:
        - name: api
          image: registry.example.com/finance/billing-api:4.2
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: billing
        namespace: finance
      spec:
        selector:
          app: billing
        ports:
        - port: 443
          targetPort: 8080
    why: api listens on 127.0.0.1 only, so traffic sent to the Pod IP on port 8080 is refused; the Service must target the proxy's port 8443.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing-api
        namespace: finance
        labels:
          app: billing
      spec:
        initContainers:
        - name: tls-proxy
          image: registry.example.com/tools/tls-proxy:1.5
          args: ["--listen=0.0.0.0:8443", "--upstream=127.0.0.1:8080"]
          readinessProbe:
            tcpSocket:
              port: 8443
        containers:
        - name: api
          image: registry.example.com/finance/billing-api:4.2
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: billing
        namespace: finance
      spec:
        selector:
          app: billing
        ports:
        - port: 443
          targetPort: 8443
    why: Without restartPolicy Always, tls-proxy is a regular init container; it may not have a readiness probe, and a proxy never exits, so api would never start.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: billing-api
        namespace: finance
        labels:
          app: billing
      spec:
        containers:
        - name: api
          image: registry.example.com/finance/billing-api:4.2
        - name: tls-proxy
          image: registry.example.com/tools/tls-proxy:1.5
          args: ["--listen=0.0.0.0:8443", "--upstream=127.0.0.1:8080"]
          readinessProbe:
            tcpSocket:
              port: 8443
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: billing
        namespace: finance
      spec:
        selector:
          app: billing
        ports:
        - port: 443
          targetPort: 8443
    why: A second entry in containers is a classic helper; it starts at the same time as api, not before it, and is not stopped after it.
explanation:
  correct:
    en: 'A native sidecar is an entry of `initContainers` with `restartPolicy: Always`: it starts before `api` and runs until the end of the Pod. Unlike a regular init container it accepts probes, and its `readinessProbe` counts in the Ready state of the Pod. All containers share the Pod''s network namespace, so the proxy reaches `api` on `127.0.0.1:8080`, but only the proxy listens on the Pod IP: the Service must send port 443 to `targetPort: 8443`. Declaring `containerPort: 8443` is informational and optional.'
references:
- title: Sidecar Containers
  url: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
- title: Service
  url: https://kubernetes.io/docs/concepts/services-networking/service/
