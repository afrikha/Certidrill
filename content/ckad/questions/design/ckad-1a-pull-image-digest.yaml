id: ckad-1a-pull-image-digest
objective: "1.1.2"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Docker and Podman are both installed: use either. The release notes of `registry.example.com/shop/api` version 2.1 give its digest:

    `sha256:cc7e3508353834e0b9cd0b23d9229bbcdd0b90f18d0f810fc81f66d8b1ee9f32`

    The tag `2.1` has since been overwritten by a rebuild. Pull exactly the image of the release notes, by its digest.

    Type the single command you would run.
body:
  mode: invocation
  tools: [docker, podman]
  namespace: default
answer:
  checks:
  - id: tool
    label: Uses docker or podman
    path: tool
    op: oneOf
    value: [docker, podman]
  - id: verb
    label: It is a pull command
    path: verb
    op: equals
    value: pull
  - id: digest
    label: References the image by name@sha256 digest
    path: args
    op: equals
    value: ["registry.example.com/shop/api@sha256:cc7e3508353834e0b9cd0b23d9229bbcdd0b90f18d0f810fc81f66d8b1ee9f32"]
  solution:
  - command: docker pull registry.example.com/shop/api@sha256:cc7e3508353834e0b9cd0b23d9229bbcdd0b90f18d0f810fc81f66d8b1ee9f32
  - command: podman pull registry.example.com/shop/api@sha256:cc7e3508353834e0b9cd0b23d9229bbcdd0b90f18d0f810fc81f66d8b1ee9f32
  negatives:
  - command: docker pull registry.example.com/shop/api:2.1
    why: The tag now points to the rebuilt image; only the digest identifies the original content.
  - command: docker pull registry.example.com/shop/api:cc7e3508353834e0b9cd0b23d9229bbcdd0b90f18d0f810fc81f66d8b1ee9f32
    why: A colon introduces a tag; a digest is written after @ with its algorithm, sha256:.
  - command: docker pull --all-tags registry.example.com/shop/api
    why: This downloads every tag of the repository, not the one image of the release notes.
explanation:
  correct:
    en: 'A digest is an immutable content hash written `NAME@sha256:<hex>`, while a tag such as `2.1` can be moved to another image. `docker pull` and `podman pull` both accept `NAME@DIGEST`. The same syntax works in a Pod `image` field to pin the exact image a cluster runs.'
references:
- title: docker image pull
  url: https://docs.docker.com/reference/cli/docker/image/pull/
- title: Images
  url: https://kubernetes.io/docs/concepts/containers/images/
