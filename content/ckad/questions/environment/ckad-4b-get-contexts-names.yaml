id: ckad-4b-get-contexts-names
objective: "4.2.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Print the names of all the contexts defined in your kubeconfig file, one per line, with no table header and no other columns. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl config
    path: verb
    op: equals
    value: config
  - id: subverb
    label: Uses get-contexts
    path: subverb
    op: equals
    value: get-contexts
  - id: output
    label: Prints names only (-o name)
    path: flags.output
    op: equals
    value: name
  solution:
  - command: kubectl config get-contexts -o name
  - command: k config get-contexts --output=name
  negatives:
  - command: kubectl config get-contexts
    why: The default output is a table with CURRENT, NAME, CLUSTER, AUTHINFO and NAMESPACE columns.
  - command: kubectl config current-context
    why: current-context prints only the name of the current context, not all of them.
  - command: kubectl config get-contexts --no-headers
    why: --no-headers removes the header line but keeps the other columns of the table.
explanation:
  correct:
    en: '`kubectl config get-contexts` lists the contexts as a table; `-o name` (the only output format it accepts) prints just the names, one per line. `current-context` shows only the selected one. To see the details of one context, pass its name: `kubectl config get-contexts prod-eu`.'
references:
- title: kubectl config get-contexts
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_config/kubectl_config_get-contexts/
