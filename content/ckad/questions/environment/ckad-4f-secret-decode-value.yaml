id: ckad-4f-secret-decode-value
objective: "4.6.2"
difficulty: 3
status: draft
type: command
stem:
  en: |-
    Secret `db-cred` in namespace `payments` has a key `password`. Print the **decoded** (plain-text) value of that key.

    Use a single kubectl command: no pipe and no `base64` tool. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Reads a Secret
    path: resource
    op: equals
    value: secret
  - id: name
    label: Names the Secret db-cred
    path: names
    op: contains
    value: db-cred
  - id: namespace
    label: Runs in namespace payments
    path: flags.namespace
    op: equals
    value: payments
  - id: template
    label: Prints through a Go template
    path: flags
    op: matches
    value: go-template|"template"
  - id: decode
    label: The template decodes the value with base64decode
    path: flags
    op: matches
    value: base64decode
  - id: key
    label: The template reads the key password
    path: flags
    op: matches
    value: \.data\.password|index \.data \\"password\\"
  solution:
  - command: kubectl get secret db-cred -n payments -o go-template='{{.data.password | base64decode}}'
  - command: k -n payments get secret/db-cred --template='{{.data.password|base64decode}}'
  - command: kubectl get secrets db-cred --namespace=payments -o go-template --template '{{index .data "password" | base64decode}}'
  negatives:
  - command: kubectl get secret db-cred -n payments -o jsonpath='{.data.password}'
    why: jsonpath prints the stored value, which is still base64-encoded.
  - command: kubectl describe secret db-cred -n payments
    why: describe only shows the size of each key in bytes, never the values.
  - command: kubectl get secret db-cred -o go-template='{{.data.password | base64decode}}'
    why: Without -n kubectl looks for db-cred in the context namespace, default.
explanation:
  correct:
    en: 'Secret values are stored base64-encoded in `data`, and `-o jsonpath=''{.data.password}''` prints them encoded; the documented way is to pipe that output to `base64 --decode`. Without a pipe, kubectl Go templates provide a `base64decode` function: `-o go-template=''{{.data.password | base64decode}}''` (or `--template`, which implies a Go template). `kubectl describe secret` never shows values, only their size.'
references:
- title: Managing Secrets using kubectl
  url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/
- title: kubectl Quick Reference
  url: https://kubernetes.io/docs/reference/kubectl/quick-reference/
