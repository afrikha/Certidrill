id: ckad-4b-set-context-namespace
objective: "4.2.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    You will run many commands in namespace `payments` and do not want to add `-n payments` to each of them.

    Without looking up the name of the current context, make `payments` the default namespace of the current context. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl config
    path: verb
    op: equals
    value: config
  - id: subverb
    label: Uses set-context
    path: subverb
    op: equals
    value: set-context
  - id: current
    label: Modifies the current context (--current)
    path: flags.current
    op: equals
    value: true
  - id: namespace
    label: Sets the namespace payments
    path: flags.namespace
    op: equals
    value: payments
  solution:
  - command: kubectl config set-context --current --namespace=payments
  - command: k config set-context --current --namespace payments
  - command: kubectl config set-context --namespace=payments --current
  negatives:
  - command: kubectl config set-context --namespace=payments
    why: Without a context name or --current, set-context has no context entry to modify and fails.
  - command: kubectl config set-context payments --namespace=payments
    why: This creates a new context entry named payments, which is not the current context.
  - command: kubectl config use-context payments
    why: use-context switches to a context named payments; payments is a namespace, not a context.
explanation:
  correct:
    en: '`kubectl config set-context --current --namespace=payments` writes `namespace: payments` into the entry of the current context, so commands without `-n` go to `payments`. Giving a name instead of `--current` modifies (or creates) that named context, and `use-context` selects a context, not a namespace.'
references:
- title: kubectl config set-context
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_config/kubectl_config_set-context/
