id: ckad-4a-cr-schema-enum
objective: "4.1.2"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    The CRD in `maintenancewindow-crd.yaml` is installed. Its schema validates every field.

    Write a `MaintenanceWindow` named `weekend-patching` in namespace `ops` for a window that starts at 01:30 every Saturday and every Sunday, lasts 3 hours, drains the nodes and uses the time zone `Europe/Paris`. Every value must pass the schema validation.
body:
  starter: ""
  files:
  - name: maintenancewindow-crd.yaml
    content: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: maintenancewindows.ops.example.com
      spec:
        group: ops.example.com
        scope: Namespaced
        names:
          plural: maintenancewindows
          singular: maintenancewindow
          kind: MaintenanceWindow
          shortNames: [mw]
        versions:
        - name: v1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [start, durationMinutes, days, action]
                  properties:
                    start:
                      type: string
                      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                    durationMinutes:
                      type: integer
                      minimum: 15
                      maximum: 240
                    days:
                      type: array
                      items:
                        type: string
                        enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
                    action:
                      type: string
                      enum: [Drain, Cordon]
                    timeZone:
                      type: string
                      default: UTC
answer:
  checks:
  - id: api
    label: apiVersion is ops.example.com/v1
    path: apiVersion
    op: equals
    value: ops.example.com/v1
  - id: kind
    label: Kind is MaintenanceWindow
    path: kind
    op: equals
    value: MaintenanceWindow
  - id: meta
    label: Named weekend-patching in namespace ops
    path: metadata
    op: subset
    value: {name: weekend-patching, namespace: ops}
  - id: start
    label: start is 01:30 (HH:MM, as the pattern requires)
    path: spec.start
    op: equals
    value: "01:30"
  - id: duration
    label: durationMinutes is 180
    path: spec.durationMinutes
    op: equals
    value: 180
  - id: sat
    label: days contains Sat
    path: spec.days
    op: contains
    value: Sat
  - id: sun
    label: days contains Sun
    path: spec.days
    op: contains
    value: Sun
  - id: days-count
    label: days is a list of exactly two days
    path: spec.days
    op: length
    value: 2
  - id: action
    label: action is Drain (enum value)
    path: spec.action
    op: equals
    value: Drain
  - id: tz
    label: timeZone is Europe/Paris
    path: spec.timeZone
    op: equals
    value: Europe/Paris
  solution:
  - manifest: |
      apiVersion: ops.example.com/v1
      kind: MaintenanceWindow
      metadata:
        name: weekend-patching
        namespace: ops
      spec:
        start: "01:30"
        durationMinutes: 180
        days:
        - Sat
        - Sun
        action: Drain
        timeZone: Europe/Paris
  - manifest: |
      apiVersion: ops.example.com/v1
      kind: MaintenanceWindow
      metadata:
        name: weekend-patching
        namespace: ops
      spec:
        action: Drain
        days: [Sun, Sat]
        durationMinutes: 180
        start: '01:30'
        timeZone: Europe/Paris
  negatives:
  - manifest: |
      apiVersion: ops.example.com/v1
      kind: MaintenanceWindow
      metadata:
        name: weekend-patching
        namespace: ops
      spec:
        start: "01:30"
        durationMinutes: 3
        days: [Sat, Sun]
        action: Drain
        timeZone: Europe/Paris
    why: durationMinutes counts minutes; 3 is below the schema minimum of 15 and is not 3 hours (180).
  - manifest: |
      apiVersion: ops.example.com/v1
      kind: MaintenanceWindow
      metadata:
        name: weekend-patching
        namespace: ops
      spec:
        start: "01:30"
        durationMinutes: 180
        days: [Sat, Sun]
        action: drain
        timeZone: Europe/Paris
    why: Enum values are case-sensitive; drain is not one of Drain or Cordon.
  - manifest: |
      apiVersion: ops.example.com/v1
      kind: MaintenanceWindow
      metadata:
        name: weekend-patching
        namespace: ops
      spec:
        start: "01:30"
        durationMinutes: 180
        days: "Sat,Sun"
        action: Drain
        timeZone: Europe/Paris
    why: days is an array of strings; a single comma-separated string fails the type check.
  - manifest: |
      apiVersion: ops.example.com/v1
      kind: MaintenanceWindow
      metadata:
        name: weekend-patching
        namespace: ops
      spec:
        start: "1:30"
        durationMinutes: 180
        days: [Sat, Sun]
        action: Drain
    why: 1:30 does not match the two-digit HH:MM pattern, and without timeZone the default UTC applies instead of Europe/Paris.
explanation:
  correct:
    en: 'Read the CRD schema before writing the object: `required` lists mandatory fields, `enum` values are case-sensitive (`Drain`, `Sat`, `Sun`), `pattern` constrains strings (`"01:30"`, quoted so YAML keeps it a string), `minimum`/`maximum` bound integers (180 minutes) and `days` is an array. `timeZone` has a default of UTC, so it must be set explicitly. Invalid objects are rejected by the API server with the failing field in the message.'
references:
- title: Extend the Kubernetes API with CustomResourceDefinitions
  url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
