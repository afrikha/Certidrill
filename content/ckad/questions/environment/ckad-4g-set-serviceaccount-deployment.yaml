id: ckad-4g-set-serviceaccount-deployment
objective: "4.7.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Deployment `api` in namespace `shop` runs with the `default` ServiceAccount. Its manifest is in the file `api.yaml` of the working directory.

    Without editing the file, change the Deployment so that its Pods run with the existing ServiceAccount `reporter`. Type the single command you would run.
body:
  mode: object
  namespace: shop
  files:
  - name: api.yaml
    content: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: api
        template:
          metadata:
            labels:
              app: api
          spec:
            containers:
            - name: api
              image: registry.example.com/shop/api:3.1
answer:
  checks:
  - id: kind
    label: The object is the Deployment api
    path: metadata.name
    op: equals
    value: api
  - id: sa
    label: The Pod template uses ServiceAccount reporter
    path: spec.template.spec.serviceAccountName
    op: equals
    value: reporter
  - id: not-deployment-spec
    label: The ServiceAccount is not set on the Deployment spec itself
    path: spec.serviceAccountName
    op: absent
  - id: image
    label: The container image is unchanged
    path: spec.template.spec.containers[name=api].image
    op: equals
    value: registry.example.com/shop/api:3.1
  solution:
  - command: kubectl set serviceaccount deployment api reporter
    output: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: api
        strategy: {}
        template:
          metadata:
            labels:
              app: api
          spec:
            containers:
            - image: registry.example.com/shop/api:3.1
              name: api
              resources: {}
            serviceAccountName: reporter
      status: {}
  - command: k set sa deploy/api reporter -n shop
    output: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: api
        strategy: {}
        template:
          metadata:
            labels:
              app: api
          spec:
            containers:
            - image: registry.example.com/shop/api:3.1
              name: api
              resources: {}
            serviceAccountName: reporter
      status: {}
  - command: kubectl set sa -f api.yaml reporter --local -o yaml
    output: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: api
        strategy: {}
        template:
          metadata:
            labels:
              app: api
          spec:
            containers:
            - image: registry.example.com/shop/api:3.1
              name: api
              resources: {}
            serviceAccountName: reporter
      status: {}
  negatives:
  - command: kubectl set serviceaccount deployment api shop:reporter
    why: The namespace:name form belongs to `kubectl create rolebinding --serviceaccount`; here the last argument is the bare ServiceAccount name, so the Pods would reference a non-existent ServiceAccount "shop:reporter".
    output: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: api
        strategy: {}
        template:
          metadata:
            labels:
              app: api
          spec:
            containers:
            - image: registry.example.com/shop/api:3.1
              name: api
              resources: {}
            serviceAccountName: shop:reporter
      status: {}
  - command: kubectl annotate deployment api kubernetes.io/service-account.name=reporter
    why: That annotation links a token Secret to a ServiceAccount; on a Deployment it changes nothing, and the Pods keep the default ServiceAccount.
    output: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        annotations:
          kubernetes.io/service-account.name: reporter
        name: api
        namespace: shop
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: api
        template:
          metadata:
            labels:
              app: api
          spec:
            containers:
            - image: registry.example.com/shop/api:3.1
              name: api
explanation:
  correct:
    en: '`kubectl set serviceaccount (-f FILE | TYPE NAME) SERVICE_ACCOUNT` (alias `sa`) writes `spec.template.spec.serviceAccountName` in the Pod template, which triggers a new rollout with Pods running as `reporter`. The ServiceAccount name is the last argument, without namespace prefix. `serviceAccountName` cannot be changed on an existing Pod, which is why you change the template of the controller.'
references:
- title: kubectl set serviceaccount
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_set/kubectl_set_serviceaccount/
- title: Configure Service Accounts for Pods
  url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
