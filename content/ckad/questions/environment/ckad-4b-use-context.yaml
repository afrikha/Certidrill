id: ckad-4b-use-context
objective: "4.2.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Your kubeconfig file contains three contexts: `dev-eu`, `prod-eu` and `prod-us`. The current context is `dev-eu`.

    Make `prod-eu` the current context so that the next kubectl commands go to that cluster. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl config
    path: verb
    op: equals
    value: config
  - id: subverb
    label: Uses use-context
    path: subverb
    op: equals
    value: use-context
  - id: name
    label: Switches to the context prod-eu
    path: args[1]
    op: equals
    value: prod-eu
  solution:
  - command: kubectl config use-context prod-eu
  - command: k config use-context prod-eu
  negatives:
  - command: kubectl config set-context prod-eu
    why: set-context creates or modifies the context entry prod-eu but does not make it the current context.
  - command: kubectl config get-contexts prod-eu
    why: get-contexts only displays the context; the current context stays dev-eu.
  - command: kubectl config use-context prod-us
    why: This switches to the US production cluster, not prod-eu.
explanation:
  correct:
    en: '`kubectl config use-context prod-eu` sets `current-context` in the kubeconfig file, so every following command uses the cluster, user and namespace of that context. On the exam, each task gives the context to switch to first. `set-context` edits a context entry without selecting it, and `get-contexts` only lists contexts.'
references:
- title: Configure Access to Multiple Clusters
  url: https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/
