id: ckad-4f-secret-volume-items-envfrom
objective: "4.6.2"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    In namespace `shop`, the TLS Secret `shop-tls` has the keys `tls.crt` and `tls.key`, and the Secret `storefront-env` holds the application settings.

    Write the manifest of a Deployment named `storefront` in namespace `shop` with 3 replicas, Pod label `app: storefront` and one container named `web` running `registry.example.com/shop/storefront:4.2`:

    - a volume named `tls` comes from Secret `shop-tls` and is mounted read-only at `/etc/storefront/tls`;
    - in that directory the files must be named `server.crt` (from `tls.crt`) and `server.key` (from `tls.key`);
    - every key of Secret `storefront-env` becomes an environment variable of the same name.
body:
  starter: ""
answer:
  checks:
  - id: kind
    label: The object is a Deployment
    path: kind
    op: equals
    value: Deployment
  - id: meta
    label: It is named storefront in namespace shop
    path: metadata
    op: subset
    value: {name: storefront, namespace: shop}
  - id: replicas
    label: It runs 3 replicas
    path: spec.replicas
    op: equals
    value: 3
  - id: selector
    label: The selector matches app=storefront
    path: spec.selector.matchLabels.app
    op: equals
    value: storefront
  - id: labels
    label: The Pod template carries app=storefront
    path: spec.template.metadata.labels.app
    op: equals
    value: storefront
  - id: image
    label: Container web runs registry.example.com/shop/storefront:4.2
    path: spec.template.spec.containers[name=web].image
    op: equals
    value: registry.example.com/shop/storefront:4.2
  - id: secret
    label: Volume tls comes from Secret shop-tls (secretName)
    path: spec.template.spec.volumes[name=tls].secret.secretName
    op: equals
    value: shop-tls
  - id: crt
    label: tls.crt is projected as server.crt
    path: spec.template.spec.volumes[name=tls].secret.items
    op: contains
    value: {key: tls.crt, path: server.crt}
  - id: key
    label: tls.key is projected as server.key
    path: spec.template.spec.volumes[name=tls].secret.items
    op: contains
    value: {key: tls.key, path: server.key}
  - id: mount
    label: Volume tls is mounted at /etc/storefront/tls
    path: spec.template.spec.containers[name=web].volumeMounts[name=tls].mountPath
    op: equals
    value: /etc/storefront/tls
  - id: read-only
    label: The mount is read-only
    path: spec.template.spec.containers[name=web].volumeMounts[name=tls].readOnly
    op: equals
    value: true
  - id: envfrom
    label: Container web imports every key of Secret storefront-env
    path: spec.template.spec.containers[name=web].envFrom
    op: contains
    value: {secretRef: {name: storefront-env}}
  solution:
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storefront
        namespace: shop
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: storefront
        template:
          metadata:
            labels:
              app: storefront
          spec:
            containers:
            - name: web
              image: registry.example.com/shop/storefront:4.2
              envFrom:
              - secretRef:
                  name: storefront-env
              volumeMounts:
              - name: tls
                mountPath: /etc/storefront/tls
                readOnly: true
            volumes:
            - name: tls
              secret:
                secretName: shop-tls
                items:
                - key: tls.crt
                  path: server.crt
                - key: tls.key
                  path: server.key
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storefront
        namespace: shop
        labels:
          app: storefront
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: storefront
        template:
          metadata:
            labels:
              app: storefront
          spec:
            volumes:
            - name: tls
              secret:
                secretName: shop-tls
                items:
                - path: server.key
                  key: tls.key
                - path: server.crt
                  key: tls.crt
            containers:
            - image: registry.example.com/shop/storefront:4.2
              name: web
              volumeMounts:
              - readOnly: true
                mountPath: /etc/storefront/tls
                name: tls
              envFrom:
              - secretRef:
                  name: storefront-env
                  optional: false
  negatives:
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storefront
        namespace: shop
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: storefront
        template:
          metadata:
            labels:
              app: storefront
          spec:
            containers:
            - name: web
              image: registry.example.com/shop/storefront:4.2
              envFrom:
              - secretRef:
                  name: storefront-env
              volumeMounts:
              - name: tls
                mountPath: /etc/storefront/tls
                readOnly: true
            volumes:
            - name: tls
              secret:
                name: shop-tls
                items:
                - key: tls.crt
                  path: server.crt
                - key: tls.key
                  path: server.key
    why: A secret volume names its Secret with secretName; name is the field of a configMap volume and is rejected here.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storefront
        namespace: shop
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: storefront
        template:
          metadata:
            labels:
              app: storefront
          spec:
            containers:
            - name: web
              image: registry.example.com/shop/storefront:4.2
              envFrom:
              - secretRef:
                  name: storefront-env
              volumeMounts:
              - name: tls
                mountPath: /etc/storefront/tls
                readOnly: true
            volumes:
            - name: tls
              secret:
                secretName: shop-tls
    why: Without items the files keep the key names, tls.crt and tls.key.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storefront
        namespace: shop
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: storefront
        template:
          metadata:
            labels:
              app: storefront
          spec:
            containers:
            - name: web
              image: registry.example.com/shop/storefront:4.2
              envFrom:
              - configMapRef:
                  name: storefront-env
              volumeMounts:
              - name: tls
                mountPath: /etc/storefront/tls
                readOnly: true
            volumes:
            - name: tls
              secret:
                secretName: shop-tls
                items:
                - key: tls.crt
                  path: server.crt
                - key: tls.key
                  path: server.key
    why: configMapRef looks for a ConfigMap named storefront-env; the settings are in a Secret.
  - manifest: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storefront
        namespace: shop
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: storefront
        template:
          metadata:
            labels:
              app: storefront
          spec:
            containers:
            - name: web
              image: registry.example.com/shop/storefront:4.2
              envFrom:
              - secretRef:
                  name: storefront-env
              volumeMounts:
              - name: tls
                mountPath: /etc/storefront/tls
            volumes:
            - name: tls
              secret:
                secretName: shop-tls
                items:
                - key: tls.crt
                  path: server.crt
                - key: tls.key
                  path: server.key
    why: The mount is not read-only; readOnly true is required on the volumeMount.
explanation:
  correct:
    en: 'A `secret` volume references its Secret with `secretName` (a `configMap` volume uses `name`), and `items` maps each `key` to a file `path`, projecting only the listed keys. `readOnly: true` is set on the container `volumeMount`. `envFrom` with `secretRef` imports every key of `storefront-env` as a variable of the same name.'
references:
- title: Distribute Credentials Securely Using Secrets
  url: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/
- title: Secrets
  url: https://kubernetes.io/docs/concepts/configuration/secret/
