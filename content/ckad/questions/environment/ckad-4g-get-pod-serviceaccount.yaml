id: ckad-4g-get-pod-serviceaccount
objective: "4.7.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    A teammate says that Pod `ledger-0` in namespace `finance` was started with the ServiceAccount `ledger`, not `default`. Check it: print only the name of the ServiceAccount that the Pod runs with, nothing else.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Reads a Pod
    path: resource
    op: equals
    value: pod
  - id: name
    label: Reads Pod ledger-0
    path: names
    op: contains
    value: ledger-0
  - id: namespace
    label: Runs in namespace finance
    path: flags.namespace
    op: equals
    value: finance
  - id: jsonpath
    label: Prints .spec.serviceAccountName with a JSONPath output
    path: flags.output
    op: matches
    value: '^jsonpath=.*\.?spec\.serviceAccountName\b'
  solution:
  - command: kubectl get pod ledger-0 -n finance -o jsonpath='{.spec.serviceAccountName}'
  - command: k -n finance get po/ledger-0 --output=jsonpath="{.spec.serviceAccountName}"
  - command: kubectl get pods ledger-0 --namespace finance -o 'jsonpath={.spec.serviceAccountName}{"\n"}'
  negatives:
  - command: kubectl get serviceaccount -n finance
    why: This lists every ServiceAccount of the namespace; it does not say which one the Pod uses.
  - command: kubectl get pod ledger-0 -n finance -o jsonpath='{.metadata.serviceAccountName}'
    why: serviceAccountName is under spec, not metadata; the JSONPath prints nothing.
  - command: kubectl get pod ledger-0 -o jsonpath='{.spec.serviceAccountName}'
    why: Without -n finance kubectl looks for the Pod in the context namespace, default.
explanation:
  correct:
    en: 'The ServiceAccount of a Pod is stored in `spec.serviceAccountName` (Kubernetes sets it to `default` when the manifest omits it). `kubectl get pod ledger-0 -n finance -o jsonpath=''{.spec.serviceAccountName}''` prints only that value. Quote the JSONPath expression so the shell does not interpret the braces.'
references:
- title: Configure Service Accounts for Pods
  url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
