id: ckad-4f-secret-tls-from-files
objective: "4.6.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The current directory contains a PEM certificate `shop.crt` and its private key `shop.key` for `shop.example.com`. In namespace `shop`, create a Secret named `shop-tls` that an Ingress can reference for TLS termination (Secret type and key names as Kubernetes expects for TLS).

    Type the single command you would run.
body:
  mode: object
  namespace: default
  files:
  - name: shop.crt
    content: |
      -----BEGIN CERTIFICATE-----
      MIIBijCCATGgAwIBAgIUOgzs9lT6FpFCVyZcB2WtCPlzvWkwCgYIKoZIzj0EAwIw
      GzEZMBcGA1UEAwwQc2hvcC5leGFtcGxlLmNvbTAeFw0yNjExMjcwODIyMDVaFw0z
      NjExMjQwODIyMDVaMBsxGTAXBgNVBAMMEHNob3AuZXhhbXBsZS5jb20wWTATBgcq
      hkjOPQIBBggqhkjOPQMBBwNCAAS8jJ39HiIqu1QZzE4yF8jg92Rq11267lOm7DTu
      ajIFrzbiAShu8zkSUDpQ1R8TJF7wXGpPO7XReIEv9BYx7cJRo1MwUTAdBgNVHQ4E
      FgQUyOBJO1sVceMtrMwwKf6oqiCBW/swHwYDVR0jBBgwFoAUyOBJO1sVceMtrMww
      Kf6oqiCBW/swDwYDVR0TAQH/BAUwAwEB/zAKBggqhkjOPQQDAgNHADBEAiBluOLS
      FJcq7ns/LLa0GlYdJ5HdwvnS8godlo9aK9T7IAIgXvJlzgl+6poPGDBESjrC0UY9
      01YalZVauHjZnRTr5RM=
      -----END CERTIFICATE-----
  - name: shop.key
    content: |
      -----BEGIN PRIVATE KEY-----
      MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgYvxgFVFTlOmb5CZ6
      iFLBfkG2ZfCyW3g/0W7hLb3zo9qhRANCAAS8jJ39HiIqu1QZzE4yF8jg92Rq1126
      7lOm7DTuajIFrzbiAShu8zkSUDpQ1R8TJF7wXGpPO7XReIEv9BYx7cJR
      -----END PRIVATE KEY-----
answer:
  checks:
  - id: kind
    label: The object is a Secret
    path: kind
    op: equals
    value: Secret
  - id: name
    label: It is named shop-tls
    path: metadata.name
    op: equals
    value: shop-tls
  - id: namespace
    label: It is created in namespace shop
    path: metadata.namespace
    op: equals
    value: shop
  - id: type
    label: Its type is kubernetes.io/tls
    path: type
    op: equals
    value: kubernetes.io/tls
  - id: crt
    label: Key tls.crt holds the certificate
    path: data["tls.crt"]
    op: equals
    value: 
  - id: key
    label: Key tls.key holds the private key
    path: data["tls.key"]
    op: equals
    value: 
  solution:
  - command: kubectl create secret tls shop-tls --cert=shop.crt --key=shop.key -n shop
    output: |
      apiVersion: v1
      data:
        tls.crt: 
        tls.key: 
      kind: Secret
      metadata:
        name: shop-tls
        namespace: shop
      type: kubernetes.io/tls
  - command: k create secret tls shop-tls -n shop --key ./shop.key --cert ./shop.crt --dry-run=client -o yaml
    output: |
      apiVersion: v1
      data:
        tls.crt: 
        tls.key: 
      kind: Secret
      metadata:
        name: shop-tls
        namespace: shop
      type: kubernetes.io/tls
  - command: kubectl create secret generic shop-tls --type=kubernetes.io/tls --from-file=tls.crt=shop.crt --from-file=tls.key=shop.key -n shop
    output: |
      apiVersion: v1
      data:
        tls.crt: 
        tls.key: 
      kind: Secret
      metadata:
        name: shop-tls
        namespace: shop
      type: kubernetes.io/tls
  negatives:
  - command: kubectl create secret generic shop-tls --from-file=shop.crt --from-file=shop.key -n shop
    why: The keys are named after the files (shop.crt, shop.key) and the type is Opaque; a TLS Secret needs type kubernetes.io/tls with keys tls.crt and tls.key.
    output: |
      apiVersion: v1
      data:
        shop.crt: 
        shop.key: 
      kind: Secret
      metadata:
        name: shop-tls
        namespace: shop
  - command: kubectl create secret tls shop-tls --cert=shop.crt --key=shop.key
    why: Without -n the Secret is created in the context namespace, default; an Ingress can only use a TLS Secret of its own namespace.
    output: |
      apiVersion: v1
      data:
        tls.crt: 
        tls.key: 
      kind: Secret
      metadata:
        name: shop-tls
      type: kubernetes.io/tls
explanation:
  correct:
    en: '`kubectl create secret tls NAME --cert=FILE --key=FILE` checks that the PEM certificate matches the key, then stores them under the keys `tls.crt` and `tls.key` with `type: kubernetes.io/tls`, whatever the file names are. The API server requires those two keys for this type. `generic` with `--from-file` keeps the file names as keys and creates an `Opaque` Secret unless you add `--type` and rename the keys yourself.'
references:
- title: kubectl create secret tls
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_tls/
- title: Secrets
  url: https://kubernetes.io/docs/concepts/configuration/secret/
