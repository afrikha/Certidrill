id: ckad-4g-pod-serviceaccountname
objective: "4.7.1"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    Write one file with two objects, both in namespace `billing`:

    - a ServiceAccount named `invoice-reader`;
    - a Pod named `invoice-worker` with one container named `worker` running `registry.example.com/billing/worker:1.8`, which runs with the ServiceAccount `invoice-reader`.
body:
  starter: |
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: invoice-reader
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: invoice-worker
    spec:
      containers:
      - name: worker
        image: registry.example.com/billing/worker:1.8
answer:
  checks:
  - id: sa
    label: ServiceAccount invoice-reader is in namespace billing
    select: {kind: ServiceAccount, name: invoice-reader}
    path: metadata.namespace
    op: equals
    value: billing
  - id: pod-ns
    label: Pod invoice-worker is in namespace billing
    select: {kind: Pod, name: invoice-worker}
    path: metadata.namespace
    op: equals
    value: billing
  - id: pod-sa
    label: The Pod runs with ServiceAccount invoice-reader
    select: {kind: Pod, name: invoice-worker}
    path: spec.serviceAccountName
    op: equals
    value: invoice-reader
  - id: image
    label: Container worker runs registry.example.com/billing/worker:1.8
    select: {kind: Pod, name: invoice-worker}
    path: spec.containers[name=worker].image
    op: equals
    value: registry.example.com/billing/worker:1.8
  solution:
  - manifest: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: invoice-reader
        namespace: billing
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: invoice-worker
        namespace: billing
      spec:
        serviceAccountName: invoice-reader
        containers:
        - name: worker
          image: registry.example.com/billing/worker:1.8
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        namespace: billing
        name: invoice-worker
      spec:
        containers:
        - image: registry.example.com/billing/worker:1.8
          name: worker
        serviceAccountName: invoice-reader
      ---
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        namespace: billing
        name: invoice-reader
  negatives:
  - manifest: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: invoice-reader
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: invoice-worker
        namespace: billing
      spec:
        serviceAccountName: invoice-reader
        containers:
        - name: worker
          image: registry.example.com/billing/worker:1.8
    why: The ServiceAccount has no namespace, so it lands in the namespace of the context; a Pod in billing can only use a ServiceAccount of billing and is rejected.
  - manifest: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: invoice-reader
        namespace: billing
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: invoice-worker
        namespace: billing
      spec:
        containers:
        - name: worker
          image: registry.example.com/billing/worker:1.8
          serviceAccountName: invoice-reader
    why: serviceAccountName is a field of the Pod spec, not of a container; the Pod would run with the default ServiceAccount (and strict validation rejects the unknown field).
  - manifest: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: invoice-reader
        namespace: billing
      ---
      apiVersion: v1
      kind: Pod
      metadata:
        name: invoice-worker
        namespace: billing
        annotations:
          serviceAccountName: invoice-reader
      spec:
        containers:
        - name: worker
          image: registry.example.com/billing/worker:1.8
    why: An annotation does not select the identity; without spec.serviceAccountName the Pod gets the default ServiceAccount.
explanation:
  correct:
    en: 'A ServiceAccount is namespaced, and a Pod can only use a ServiceAccount of its own namespace, so both objects need `namespace: billing`. The Pod selects it with `spec.serviceAccountName: invoice-reader`, a Pod-level field that can only be set at creation. `spec.serviceAccount` is a deprecated alias: use `serviceAccountName`.'
references:
- title: Configure Service Accounts for Pods
  url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
