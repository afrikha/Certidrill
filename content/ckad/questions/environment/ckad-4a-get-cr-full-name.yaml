id: ckad-4a-get-cr-full-name
objective: "4.1.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Two installed CRDs use the same plural: `certificates.pki.example.com` and `certificates.tls.example.org`. Both define namespaced resources served at version `v1`.

    List the `certificates` objects of the group `pki.example.com` in all namespaces, and only those. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl get
    path: verb
    op: equals
    value: get
  - id: resource
    label: Names the resource with its group, pki.example.com
    path: resource
    op: matches
    value: ^certificates?(\.v1)?\.pki\.example\.com$
  - id: all-ns
    label: Lists objects in all namespaces
    path: flags.all-namespaces
    op: equals
    value: true
  solution:
  - command: kubectl get certificates.pki.example.com -A
  - command: k get certificate.pki.example.com --all-namespaces
  - command: kubectl get certificates.v1.pki.example.com -A
  negatives:
  - command: kubectl get certificates -A
    why: The plural alone is ambiguous with two groups; kubectl resolves it to a single group, which may be tls.example.org.
  - command: kubectl get crd certificates.pki.example.com
    why: This returns the CustomResourceDefinition itself, not the Certificate objects it defines.
  - command: kubectl get certificates.pki.example.com
    why: Without -A the command lists only the objects of the context namespace, default.
explanation:
  correct:
    en: 'When two groups define the same plural, use the fully qualified name `<plural>.<group>` (optionally `<plural>.<version>.<group>`): `kubectl get certificates.pki.example.com -A`. Resource names are case-insensitive and the singular works too. `kubectl get crd <name>` returns the definition, not its objects.'
references:
- title: Extend the Kubernetes API with CustomResourceDefinitions
  url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
