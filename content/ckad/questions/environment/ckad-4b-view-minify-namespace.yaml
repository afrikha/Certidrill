id: ckad-4b-view-minify-namespace
objective: "4.2.1"
difficulty: 3
status: draft
type: command
stem:
  en: |-
    Your kubeconfig file defines five contexts, each with its own namespace. The current context sets a namespace.

    Print only the namespace of the current context (just the value, not a table or a YAML document). Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl config
    path: verb
    op: equals
    value: config
  - id: subverb
    label: Uses config view
    path: subverb
    op: equals
    value: view
  - id: minify
    label: Keeps only the current context (--minify)
    path: flags.minify
    op: equals
    value: true
  - id: jsonpath
    label: Extracts the namespace with a JSONPath expression
    path: flags.output
    op: matches
    value: ^jsonpath=.*namespace
  solution:
  - command: kubectl config view --minify -o jsonpath='{..namespace}'
  - command: k config view --minify --output 'jsonpath={.contexts[0].context.namespace}'
  - command: kubectl config view -o=jsonpath='{..namespace}' --minify
  negatives:
  - command: kubectl config view -o jsonpath='{..namespace}'
    why: Without --minify the output contains every context, so the expression prints the namespaces of all five contexts.
  - command: kubectl config view --minify -o jsonpath='{.current-context}'
    why: current-context is the name of the context, not its namespace.
  - command: kubectl config get-contexts
    why: get-contexts prints a table of all contexts instead of the namespace value alone.
explanation:
  correct:
    en: '`kubectl config view --minify` keeps only the information used by the current context, and `-o jsonpath=''{..namespace}''` (or `{.contexts[0].context.namespace}`) prints its namespace alone. Without `--minify`, the same expression matches the namespace of every context in the file.'
references:
- title: kubectl config view
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_config/kubectl_config_view/
