id: ckad-4a-explain-custom-field
objective: "4.1.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    The CRD `backups.data.example.com` defines the namespaced resource `backups` (kind `Backup`, short name `bk`). Its field `spec.target` is an object with several nested fields, some of them objects too.

    Display the documentation of `spec.target` of a Backup together with all its nested fields, at every depth. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl explain
    path: verb
    op: equals
    value: explain
  - id: field
    label: Explains the field spec.target of the Backup resource
    path: args[0]
    op: matches
    value: ^(backups|backup|bk|Backup)\.spec\.target$
  - id: recursive
    label: Prints the nested fields recursively
    path: flags.recursive
    op: equals
    value: true
  solution:
  - command: kubectl explain backups.spec.target --recursive
  - command: k explain bk.spec.target -R
  - command: kubectl explain backup.spec.target --recursive --api-version=data.example.com/v1
  negatives:
  - command: kubectl explain backups.spec.target
    why: Without --recursive, explain shows only the direct fields of spec.target, not the fields nested below them.
  - command: kubectl explain backups --recursive
    why: This prints the whole Backup schema instead of the spec.target field.
  - command: kubectl describe crd backups.data.example.com
    why: describe shows the CRD object and its raw schema, not the field documentation of spec.target.
explanation:
  correct:
    en: '`kubectl explain TYPE.FIELD[.FIELD]` reads the OpenAPI schema that the API server publishes, including the structural schema of a CRD, so it works for custom resources as for built-in ones. The type can be the plural, the singular, the kind or a short name; `--recursive` (`-R`) prints the fields of fields at every depth, and `--api-version` selects a version when several are served.'
references:
- title: kubectl explain
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_explain/
