id: ckad-4g-create-serviceaccount
objective: "4.7.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    The CI Pods of namespace `ci` must run with their own identity. Create a ServiceAccount named `builder` in namespace `ci`.

    Type the single command you would run.
body:
  mode: object
  namespace: default
answer:
  checks:
  - id: kind
    label: The object is a ServiceAccount
    path: kind
    op: equals
    value: ServiceAccount
  - id: name
    label: It is named builder
    path: metadata.name
    op: equals
    value: builder
  - id: namespace
    label: It is created in namespace ci
    path: metadata.namespace
    op: equals
    value: ci
  solution:
  - command: kubectl create serviceaccount builder -n ci
    output: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: builder
        namespace: ci
  - command: k create sa builder --namespace=ci --dry-run=client -o yaml
    output: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: builder
        namespace: ci
  negatives:
  - command: kubectl create serviceaccount builder
    why: Without -n the ServiceAccount is created in the context namespace, default, and Pods in ci cannot use it.
    output: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: builder
  - command: kubectl create sa ci -n builder
    why: Name and namespace are swapped; the positional argument is the ServiceAccount name.
    output: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: ci
        namespace: builder
explanation:
  correct:
    en: '`kubectl create serviceaccount NAME` (alias `sa`) creates a ServiceAccount; `-n ci` (or `--namespace=ci`) puts it in the right namespace. A ServiceAccount is namespaced and a Pod can only use a ServiceAccount of its own namespace, so creating it in default would not help the CI Pods. Pods then reference it with `spec.serviceAccountName: builder`.'
references:
- title: kubectl create serviceaccount
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_serviceaccount/
- title: Configure Service Accounts for Pods
  url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
