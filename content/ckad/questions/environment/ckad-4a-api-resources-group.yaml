id: ckad-4a-api-resources-group
objective: "4.1.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    A monitoring Operator was installed in the cluster. Its CustomResourceDefinitions all belong to the API group `monitoring.example.com`.

    List every resource type that the API server serves in the group `monitoring.example.com`, with its short names and kind. Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl api-resources
    path: verb
    op: equals
    value: api-resources
  - id: group
    label: Limits the list to the API group monitoring.example.com
    path: flags.api-group
    op: equals
    value: monitoring.example.com
  solution:
  - command: kubectl api-resources --api-group=monitoring.example.com
  - command: k api-resources --api-group monitoring.example.com -o wide
  negatives:
  - command: kubectl get crd
    why: This lists the CustomResourceDefinition objects of every group, not the resource types served in monitoring.example.com with their short names.
  - command: kubectl api-versions
    why: api-versions prints group/version pairs only, without resource types, short names or kinds.
  - command: kubectl api-resources --namespaced=true
    why: This lists every namespaced resource type of every group instead of limiting the list to monitoring.example.com.
explanation:
  correct:
    en: '`kubectl api-resources` prints the resource types served by the API server with their short names, API version, namespaced flag and kind; `--api-group=monitoring.example.com` keeps only the types of that group, which is how you discover what an installed CRD or Operator added. `kubectl get crd` lists the definitions themselves, and `kubectl api-versions` shows only group/version pairs.'
references:
- title: kubectl api-resources
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_api-resources/
