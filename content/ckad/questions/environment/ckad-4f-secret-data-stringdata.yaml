id: ckad-4f-secret-data-stringdata
objective: "4.6.1"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    Write the manifest of a generic Secret named `api-keys` in namespace `payments`:

    - key `API_TOKEN`: you received its value **already base64-encoded**, `dG9rLTdmM2E5Yi1kZW1v`; write it in the manifest exactly as received, without decoding it;
    - key `API_URL`: `https://api.example.com/v2`, written in the manifest as plain text, without encoding it yourself;
    - once created, the Secret data must not be modifiable.
body:
  starter: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: api-keys
      namespace: payments
answer:
  checks:
  - id: kind
    label: The object is a Secret
    path: kind
    op: equals
    value: Secret
  - id: meta
    label: It is named api-keys in namespace payments
    path: metadata
    op: subset
    value: {name: api-keys, namespace: payments}
  - id: token
    label: API_TOKEN is in data, as the base64 value received
    path: data.API_TOKEN
    op: equals
    value: dG9rLTdmM2E5Yi1kZW1v
  - id: url
    label: API_URL is in stringData, in plain text
    path: stringData.API_URL
    op: equals
    value: https://api.example.com/v2
  - id: immutable
    label: The Secret is immutable
    path: immutable
    op: equals
    value: true
  solution:
  - manifest: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: api-keys
        namespace: payments
      type: Opaque
      data:
        API_TOKEN: dG9rLTdmM2E5Yi1kZW1v
      stringData:
        API_URL: https://api.example.com/v2
      immutable: true
  - manifest: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: api-keys
        namespace: payments
      immutable: true
      stringData:
        API_URL: "https://api.example.com/v2"
      data:
        API_TOKEN: "dG9rLTdmM2E5Yi1kZW1v"
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: api-keys
        namespace: payments
      stringData:
        API_TOKEN: dG9rLTdmM2E5Yi1kZW1v
        API_URL: https://api.example.com/v2
      immutable: true
    why: In stringData the base64 text is taken as plain text and encoded again, so the application would read dG9rLTdmM2E5Yi1kZW1v instead of the token.
  - manifest: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: api-keys
        namespace: payments
      data:
        API_TOKEN: dG9rLTdmM2E5Yi1kZW1v
        API_URL: https://api.example.com/v2
      immutable: true
    why: Values under data must be base64; the API server rejects the plain URL there.
  - manifest: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: api-keys
        namespace: payments
      data:
        API_TOKEN: dG9rLTdmM2E5Yi1kZW1v
      stringData:
        API_URL: https://api.example.com/v2
    why: Without immutable true the data can still be changed.
explanation:
  correct:
    en: '`data` holds base64-encoded values, so a value received already encoded goes there as is; `stringData` takes plain text, which the API server encodes and merges into `data` (if a key is in both, `stringData` wins). Putting the encoded token in `stringData` would encode it twice. `immutable: true` is a top-level field; without `type`, the Secret is `Opaque`.'
references:
- title: Secrets
  url: https://kubernetes.io/docs/concepts/configuration/secret/
