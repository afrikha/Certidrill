id: ckad-4f-secret-volume-mount
objective: "4.6.2"
difficulty: 1
status: draft
type: manifest
stem:
  en: |-
    Write the manifest of a Pod named `backup` in namespace `ops` with one container named `backup` running `registry.example.com/ops/backup:1.0`.

    Every key of Secret `s3-cred` must appear as a file in the directory `/etc/s3` of the container, through a volume named `creds`.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: backup
      namespace: ops
    spec:
      containers:
      - name: backup
        image: registry.example.com/ops/backup:1.0
answer:
  checks:
  - id: pod
    label: A Pod named backup in namespace ops
    path: metadata
    op: subset
    value: {name: backup, namespace: ops}
  - id: image
    label: Container backup runs registry.example.com/ops/backup:1.0
    path: spec.containers[name=backup].image
    op: equals
    value: registry.example.com/ops/backup:1.0
  - id: volume
    label: Volume creds comes from Secret s3-cred
    path: spec.volumes[name=creds].secret.secretName
    op: equals
    value: s3-cred
  - id: mount
    label: Volume creds is mounted at /etc/s3
    path: spec.containers[name=backup].volumeMounts[name=creds].mountPath
    op: equals
    value: /etc/s3
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: backup
        namespace: ops
      spec:
        containers:
        - name: backup
          image: registry.example.com/ops/backup:1.0
          volumeMounts:
          - name: creds
            mountPath: /etc/s3
        volumes:
        - name: creds
          secret:
            secretName: s3-cred
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: backup
        namespace: ops
      spec:
        volumes:
        - name: creds
          secret:
            secretName: s3-cred
        containers:
        - name: backup
          image: registry.example.com/ops/backup:1.0
          volumeMounts:
          - name: creds
            mountPath: /etc/s3
            readOnly: true
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: backup
        namespace: ops
      spec:
        containers:
        - name: backup
          image: registry.example.com/ops/backup:1.0
          volumeMounts:
          - name: creds
            mountPath: /etc/s3
        volumes:
        - name: creds
          configMap:
            name: s3-cred
    why: A configMap volume reads a ConfigMap named s3-cred; the data is in a Secret.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: backup
        namespace: ops
      spec:
        containers:
        - name: backup
          image: registry.example.com/ops/backup:1.0
          volumeMounts:
          - name: s3-cred
            mountPath: /etc/s3
        volumes:
        - name: creds
          secret:
            secretName: s3-cred
    why: volumeMounts[].name must be the volume name (creds), not the Secret name.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: backup
        namespace: ops
      spec:
        containers:
        - name: backup
          image: registry.example.com/ops/backup:1.0
          envFrom:
          - secretRef:
              name: s3-cred
    why: envFrom turns the keys into environment variables, not files under /etc/s3.
explanation:
  correct:
    en: 'A volume of type `secret` with `secretName: s3-cred` projects each key of the Secret as a file holding the decoded value. The container `volumeMounts` entry refers to the volume by its name (`creds`) and sets the directory with `mountPath`. Files in a Secret volume are updated when the Secret changes, unlike environment variables.'
references:
- title: Distribute Credentials Securely Using Secrets
  url: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/
