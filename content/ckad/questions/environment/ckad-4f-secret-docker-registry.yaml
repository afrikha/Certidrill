id: ckad-4f-secret-docker-registry
objective: "4.6.1"
difficulty: 2
status: draft
type: command
stem:
  en: |-
    Pods in namespace `ci` pull images from the private registry `registry.example.com`. In namespace `ci`, create a Secret named `regcred` that the kubelet can use as an image pull secret for that registry, with username `deploy-bot`, password `p4ssw0rd-42` and email `ci@example.com`.

    Type the single command you would run.
body:
  mode: object
  namespace: default
answer:
  checks:
  - id: kind
    label: The object is a Secret
    path: kind
    op: equals
    value: Secret
  - id: name
    label: It is named regcred
    path: metadata.name
    op: equals
    value: regcred
  - id: namespace
    label: It is created in namespace ci
    path: metadata.namespace
    op: equals
    value: ci
  - id: type
    label: Its type is kubernetes.io/dockerconfigjson
    path: type
    op: equals
    value: kubernetes.io/dockerconfigjson
  - id: config
    label: Key .dockerconfigjson holds the credentials for registry.example.com
    path: data[".dockerconfigjson"]
    op: equals
    value: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6ImRlcGxveS1ib3QiLCJwYXNzd29yZCI6InA0c3N3MHJkLTQyIiwiZW1haWwiOiJjaUBleGFtcGxlLmNvbSIsImF1dGgiOiJaR1Z3Ykc5NUxXSnZkRHB3TkhOemR6QnlaQzAwTWc9PSJ9fX0=
  solution:
  - command: kubectl create secret docker-registry regcred --docker-server=registry.example.com --docker-username=deploy-bot --docker-password=p4ssw0rd-42 --docker-email=ci@example.com -n ci
    output: |
      apiVersion: v1
      data:
        .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6ImRlcGxveS1ib3QiLCJwYXNzd29yZCI6InA0c3N3MHJkLTQyIiwiZW1haWwiOiJjaUBleGFtcGxlLmNvbSIsImF1dGgiOiJaR1Z3Ykc5NUxXSnZkRHB3TkhOemR6QnlaQzAwTWc9PSJ9fX0=
      kind: Secret
      metadata:
        name: regcred
        namespace: ci
      type: kubernetes.io/dockerconfigjson
  - command: k -n ci create secret docker-registry regcred --docker-email ci@example.com --docker-username deploy-bot --docker-password p4ssw0rd-42 --docker-server registry.example.com --dry-run=client -o yaml
    output: |
      apiVersion: v1
      data:
        .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6ImRlcGxveS1ib3QiLCJwYXNzd29yZCI6InA0c3N3MHJkLTQyIiwiZW1haWwiOiJjaUBleGFtcGxlLmNvbSIsImF1dGgiOiJaR1Z3Ykc5NUxXSnZkRHB3TkhOemR6QnlaQzAwTWc9PSJ9fX0=
      kind: Secret
      metadata:
        name: regcred
        namespace: ci
      type: kubernetes.io/dockerconfigjson
  negatives:
  - command: kubectl create secret docker-registry regcred --docker-username=deploy-bot --docker-password=p4ssw0rd-42 --docker-email=ci@example.com -n ci
    why: Without --docker-server the credentials are stored for the default server https://index.docker.io/v1/ (Docker Hub), not registry.example.com.
    output: |
      apiVersion: v1
      data:
        .dockerconfigjson: eyJhdXRocyI6eyJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOnsidXNlcm5hbWUiOiJkZXBsb3ktYm90IiwicGFzc3dvcmQiOiJwNHNzdzByZC00MiIsImVtYWlsIjoiY2lAZXhhbXBsZS5jb20iLCJhdXRoIjoiWkdWd2JHOTVMV0p2ZERwd05ITnpkekJ5WkMwME1nPT0ifX19
      kind: Secret
      metadata:
        name: regcred
        namespace: ci
      type: kubernetes.io/dockerconfigjson
  - command: kubectl create secret generic regcred --from-literal=username=deploy-bot --from-literal=password=p4ssw0rd-42 -n ci
    why: An Opaque Secret with username and password keys is not a registry credential; imagePullSecrets needs type kubernetes.io/dockerconfigjson.
    output: |
      apiVersion: v1
      data:
        password: cDRzc3cwcmQtNDI=
        username: ZGVwbG95LWJvdA==
      kind: Secret
      metadata:
        name: regcred
        namespace: ci
  - command: kubectl create secret docker-registry regcred --docker-server=registry.example.com --docker-username=deploy-bot --docker-password=p4ssw0rd-42 --docker-email=ci@example.com
    why: Without -n the Secret lands in the context namespace, default; Pods can only reference image pull secrets of their own namespace.
    output: |
      apiVersion: v1
      data:
        .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6ImRlcGxveS1ib3QiLCJwYXNzd29yZCI6InA0c3N3MHJkLTQyIiwiZW1haWwiOiJjaUBleGFtcGxlLmNvbSIsImF1dGgiOiJaR1Z3Ykc5NUxXSnZkRHB3TkhOemR6QnlaQzAwTWc9PSJ9fX0=
      kind: Secret
      metadata:
        name: regcred
      type: kubernetes.io/dockerconfigjson
explanation:
  correct:
    en: '`kubectl create secret docker-registry` builds a Docker `config.json` for the server given by `--docker-server` and stores it, base64-encoded, under the key `.dockerconfigjson` with `type: kubernetes.io/dockerconfigjson`. `--docker-server` defaults to `https://index.docker.io/v1/`, so it must be set for a private registry. The Secret is then listed in the Pod `imagePullSecrets` or attached to its ServiceAccount.'
references:
- title: kubectl create secret docker-registry
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_docker-registry/
- title: Secrets
  url: https://kubernetes.io/docs/concepts/configuration/secret/
