id: ckad-4f-secret-env-keyref
objective: "4.6.2"
difficulty: 2
status: draft
type: manifest
stem:
  en: |-
    Secret `db-cred` in namespace `payments` has the keys `username`, `password` and `root_password`.

    Write the manifest of a Pod named `api` in namespace `payments` with one container named `api` running `registry.example.com/payments/api:1.8`:

    - the environment variable `DB_USER` takes the value of the key `username`;
    - the environment variable `DB_PASSWORD` takes the value of the key `password`;
    - no other key of the Secret is exposed to the container.
body:
  starter: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: api
      namespace: payments
    spec:
      containers:
      - name: api
        image: registry.example.com/payments/api:1.8
answer:
  checks:
  - id: pod
    label: A Pod named api in namespace payments
    path: metadata
    op: subset
    value: {name: api, namespace: payments}
  - id: image
    label: Container api runs registry.example.com/payments/api:1.8
    path: spec.containers[name=api].image
    op: equals
    value: registry.example.com/payments/api:1.8
  - id: user
    label: DB_USER reads key username of Secret db-cred
    path: spec.containers[name=api].env[name=DB_USER].valueFrom.secretKeyRef
    op: subset
    value: {name: db-cred, key: username}
  - id: password
    label: DB_PASSWORD reads key password of Secret db-cred
    path: spec.containers[name=api].env[name=DB_PASSWORD].valueFrom.secretKeyRef
    op: subset
    value: {name: db-cred, key: password}
  - id: no-envfrom
    label: The container does not import the whole Secret (no envFrom)
    path: spec.containers[name=api].envFrom
    op: absent
  solution:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: api
        namespace: payments
      spec:
        containers:
        - name: api
          image: registry.example.com/payments/api:1.8
          env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: db-cred
                key: username
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-cred
                key: password
  negatives:
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: api
        namespace: payments
      spec:
        containers:
        - name: api
          image: registry.example.com/payments/api:1.8
          env:
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: db-cred
                key: username
          - name: DB_PASSWORD
            valueFrom:
              configMapKeyRef:
                name: db-cred
                key: password
    why: configMapKeyRef reads a ConfigMap; db-cred is a Secret, so the container cannot start.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: api
        namespace: payments
      spec:
        containers:
        - name: api
          image: registry.example.com/payments/api:1.8
          envFrom:
          - secretRef:
              name: db-cred
    why: envFrom exposes every key, root_password included, under the key names (username, password), not DB_USER and DB_PASSWORD.
  - manifest: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: api
        namespace: payments
      spec:
        containers:
        - name: api
          image: registry.example.com/payments/api:1.8
          env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: db-cred
                key: username
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-cred
                key: root_password
    why: DB_PASSWORD reads root_password instead of password.
explanation:
  correct:
    en: '`env[].valueFrom.secretKeyRef` maps one key of one Secret to a variable whose name you choose, and the kubelet injects the decoded value. Only the listed keys reach the container, whereas `envFrom` with `secretRef` imports every key under its own name. `configMapKeyRef` has the same shape but reads a ConfigMap.'
references:
- title: Distribute Credentials Securely Using Secrets
  url: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/
