id: ckad-4f-secret-generic-literals
objective: "4.6.1"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    In namespace `payments`, create a generic Secret named `db-cred` with two keys: `username` set to `app` and `password` set to `Tr0ub4dor`.

    Type the single command you would run.
body:
  mode: object
  namespace: default
answer:
  checks:
  - id: kind
    label: The object is a Secret
    path: kind
    op: equals
    value: Secret
  - id: name
    label: It is named db-cred
    path: metadata.name
    op: equals
    value: db-cred
  - id: namespace
    label: It is created in namespace payments
    path: metadata.namespace
    op: equals
    value: payments
  - id: username
    label: Key username holds app (base64 YXBw)
    path: data.username
    op: equals
    value: YXBw
  - id: password
    label: Key password holds Tr0ub4dor (base64 VHIwdWI0ZG9y)
    path: data.password
    op: equals
    value: VHIwdWI0ZG9y
  solution:
  - command: kubectl create secret generic db-cred --from-literal=username=app --from-literal=password=Tr0ub4dor -n payments
    output: |
      apiVersion: v1
      data:
        password: VHIwdWI0ZG9y
        username: YXBw
      kind: Secret
      metadata:
        name: db-cred
        namespace: payments
  - command: k -n payments create secret generic db-cred --from-literal password=Tr0ub4dor --from-literal username=app --dry-run=client -o yaml
    output: |
      apiVersion: v1
      data:
        password: VHIwdWI0ZG9y
        username: YXBw
      kind: Secret
      metadata:
        name: db-cred
        namespace: payments
  negatives:
  - command: kubectl create configmap db-cred --from-literal=username=app --from-literal=password=Tr0ub4dor -n payments
    why: This creates a ConfigMap, meant for non-confidential data, not a Secret.
    output: |
      apiVersion: v1
      data:
        password: Tr0ub4dor
        username: app
      kind: ConfigMap
      metadata:
        name: db-cred
        namespace: payments
  - command: kubectl create secret generic db-cred --from-literal=username=app --from-literal=password=Tr0ub4dor
    why: Without -n the Secret is created in the context namespace, default.
    output: |
      apiVersion: v1
      data:
        password: VHIwdWI0ZG9y
        username: YXBw
      kind: Secret
      metadata:
        name: db-cred
  - command: kubectl create secret generic db-cred --from-literal=password=Tr0ub4dor -n payments
    why: Each key needs its own --from-literal flag; username is missing.
    output: |
      apiVersion: v1
      data:
        password: VHIwdWI0ZG9y
      kind: Secret
      metadata:
        name: db-cred
        namespace: payments
explanation:
  correct:
    en: '`kubectl create secret generic NAME --from-literal=KEY=VALUE` takes plain values and stores them base64-encoded in `data` (`app` → `YXBw`). The `generic` subcommand creates an `Opaque` Secret, the default type. Base64 is an encoding, not encryption: anyone who can read the Secret can decode it.'
references:
- title: kubectl create secret generic
  url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_generic/
- title: Managing Secrets using kubectl
  url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/
