id: ckad-5c-describe-ingress
objective: "5.3.2"
difficulty: 1
status: draft
type: command
stem:
  en: |-
    Ingress `store` in namespace `shop` does not route requests. Display its rules with the backend endpoints, its TLS settings and the events recorded for it.

    Type the single command you would run.
body:
  mode: invocation
  namespace: default
answer:
  checks:
  - id: verb
    label: Uses kubectl describe
    path: verb
    op: equals
    value: describe
  - id: resource
    label: Targets an Ingress
    path: resource
    op: equals
    value: ingress
  - id: name
    label: Names the Ingress store
    path: names
    op: contains
    value: store
  - id: namespace
    label: Runs in namespace shop
    path: flags.namespace
    op: equals
    value: shop
  solution:
  - command: kubectl describe ingress store -n shop
  - command: k describe ing/store --namespace=shop
  - command: kubectl -n shop describe ingresses store
  negatives:
  - command: kubectl get ingress store -n shop
    why: get lists class, hosts, address and ports, but neither the backends nor the events.
  - command: kubectl describe ingress store
    why: Without -n the command looks for store in the context namespace, default.
  - command: kubectl describe ingressclass store -n shop
    why: This describes an IngressClass, a cluster-scoped object, not the Ingress store.
explanation:
  correct:
    en: '`kubectl describe ingress store -n shop` prints the default backend, each rule with its host, path and backend Service with its endpoints, the TLS section and the events, which reveal a missing Service or Secret. `kubectl get ingress` only gives a one-line summary (class, hosts, address, ports).'
references:
- title: Ingress
  url: https://kubernetes.io/docs/concepts/services-networking/ingress/
