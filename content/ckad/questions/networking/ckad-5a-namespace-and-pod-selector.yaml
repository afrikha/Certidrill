id: ckad-5a-namespace-and-pod-selector
objective: "5.1.1"
difficulty: 3
status: draft
type: manifest
stem:
  en: |-
    The Pods labeled `app: orders` in namespace `shop` listen on TCP port 8080. The storefront Pods carry the label `role: frontend` and run in namespace `web`. Other namespaces also run Pods labeled `role: frontend`, and namespace `web` also runs Pods with other labels. You do not know which custom labels namespace `web` has.

    Write a NetworkPolicy named `orders-from-web-frontend` in namespace `shop` so that the `app: orders` Pods accept ingress only from Pods that are labeled `role: frontend` **and** run in namespace `web`, on TCP port 8080.
body:
  starter: |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: orders-from-web-frontend
      namespace: shop
    spec:
answer:
  checks:
  - id: meta
    label: A NetworkPolicy named orders-from-web-frontend in namespace shop
    path: metadata
    op: subset
    value: {name: orders-from-web-frontend, namespace: shop}
  - id: kind
    label: The object is a NetworkPolicy
    path: kind
    op: equals
    value: NetworkPolicy
  - id: target
    label: The policy selects the app=orders Pods
    path: spec.podSelector.matchLabels
    op: equals
    value: {app: orders}
  - id: same-peer
    label: One from element combines the namespace web and the role=frontend Pods (AND)
    path: spec.ingress
    op: contains
    value:
      from:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: web}
        podSelector:
          matchLabels: {role: frontend}
  - id: no-or
    label: No other from element lets in Pods by label alone
    path: spec.ingress[0].from
    op: length
    value: 1
  - id: port
    label: The rule is limited to port 8080
    path: spec.ingress
    op: contains
    value: {ports: [{port: 8080}]}
  solution:
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: orders-from-web-frontend
        namespace: shop
      spec:
        podSelector:
          matchLabels:
            app: orders
        policyTypes:
        - Ingress
        ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: web
            podSelector:
              matchLabels:
                role: frontend
          ports:
          - protocol: TCP
            port: 8080
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: orders-from-web-frontend
        namespace: shop
      spec:
        podSelector:
          matchLabels:
            app: orders
        ingress:
        - ports:
          - port: 8080
          from:
          - podSelector:
              matchLabels:
                role: frontend
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: web
  negatives:
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: orders-from-web-frontend
        namespace: shop
      spec:
        podSelector:
          matchLabels:
            app: orders
        policyTypes:
        - Ingress
        ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: web
          - podSelector:
              matchLabels:
                role: frontend
          ports:
          - protocol: TCP
            port: 8080
    why: Two from elements are ORed. This allows every Pod of namespace web, plus the role=frontend Pods of namespace shop.
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: orders-from-web-frontend
        namespace: shop
      spec:
        podSelector:
          matchLabels:
            app: orders
        policyTypes:
        - Ingress
        ingress:
        - from:
          - podSelector:
              matchLabels:
                role: frontend
          ports:
          - protocol: TCP
            port: 8080
    why: A podSelector alone in from matches Pods of the policy's own namespace (shop), not of namespace web.
  - manifest: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: orders-from-web-frontend
        namespace: shop
      spec:
        podSelector:
          matchLabels:
            app: orders
        policyTypes:
        - Ingress
        ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                name: web
            podSelector:
              matchLabels:
                role: frontend
          ports:
          - protocol: TCP
            port: 8080
    why: Namespaces do not get a label name=web automatically; the label the control plane sets on every namespace is kubernetes.io/metadata.name.
explanation:
  correct:
    en: 'Inside one `from` element, `namespaceSelector` and `podSelector` must both match: Pods labeled `role: frontend` in namespaces selected by the namespace selector. Two separate elements would be ORed. A NetworkPolicy cannot name a namespace directly, but the control plane sets the immutable label `kubernetes.io/metadata.name` on every namespace, so `kubernetes.io/metadata.name: web` selects namespace `web`.'
references:
- title: Network Policies
  url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
