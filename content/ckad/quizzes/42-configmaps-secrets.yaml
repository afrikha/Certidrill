chapter: 42-configmaps-secrets
questions:
  # ------------------------------------------------------------------ 1
  - id: ckad-qz-42-01
    objective: "4.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The directory `/opt/shop/conf/` contains two regular files, `app.properties` and `db.properties`, and a subdirectory `extra/` that holds a file `cache.properties`. You run:

        ```bash
        kubectl create configmap shop-conf -n shop --from-file=/opt/shop/conf/
        ```

        Which keys does ConfigMap `shop-conf` contain?
    body:
      options:
        - { id: a, text: "`app.properties` and `db.properties`" }
        - { id: b, text: "`app.properties`, `db.properties` and `cache.properties`" }
        - { id: c, text: "`app.properties`, `db.properties` and `extra/cache.properties`" }
        - { id: d, text: "A single key `conf` whose value holds the content of the directory" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          When `--from-file` points to a directory, kubectl packages each regular file of that directory whose name is a valid key, with the file name as the key and the file content as the value. Every other directory entry, subdirectories included, is ignored, so `extra/cache.properties` is not read.
      options:
        b: { en: "kubectl does not descend into subdirectories: `extra/` is a directory entry that is not a regular file, so it is ignored with everything it contains." }
        c: { en: "Subdirectories are ignored, and a key can only contain letters, digits, `-`, `_` and `.`: `extra/cache.properties` is not even a valid key name." }
        d: { en: "Only `--from-file=KEY=PATH` with a file gives a key of your choice; a directory source produces one key per regular file, never a single key named after the directory." }
    references:
      - title: kubectl create configmap
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_configmap/
      - title: Configure a Pod to Use a ConfigMap
        url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/

  # ------------------------------------------------------------------ 2
  - id: ckad-qz-42-02
    objective: "4.6.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You apply the following manifest. `b2xkLXBhc3M=` is the base64 encoding of `old-pass`.

        ```yaml
        apiVersion: v1
        kind: Secret
        metadata:
          name: smtp-cred
          namespace: mail
        type: Opaque
        data:
          password: b2xkLXBhc3M=
        stringData:
          password: new-pass
        ```

        What does `kubectl get secret smtp-cred -n mail -o yaml` show for the key `password`?
    body:
      options:
        - { id: a, text: "`data.password: b2xkLXBhc3M=`, because `data` takes precedence over `stringData`" }
        - { id: b, text: "`data.password: bmV3LXBhc3M=`, the base64 encoding of `new-pass`" }
        - { id: c, text: "Both `data.password: b2xkLXBhc3M=` and `stringData.password: new-pass`" }
        - { id: d, text: "Nothing: the API server rejects a key that appears in both `data` and `stringData`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The API server merges every `stringData` pair into `data` on write, encoding it in base64, and when a key appears in both fields the `stringData` value wins. The stored Secret therefore has `data.password` equal to the encoding of `new-pass`.
      options:
        a: { en: "The precedence is the other way round: a key present in both fields takes the `stringData` value." }
        c: { en: "`stringData` is a write-only input field: it is merged into `data` and never returned when the Secret is read." }
        d: { en: "The duplicate key is allowed and resolved by precedence; the manifest is accepted." }
    references:
      - title: Secrets
        url: https://kubernetes.io/docs/concepts/configuration/secret/
      - title: Secret
        url: https://kubernetes.io/docs/reference/kubernetes-api/config-and-storage-resources/secret-v1/

  # ------------------------------------------------------------------ 3
  - id: ckad-qz-42-03
    objective: "4.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The Pods of Deployment `api` in namespace `shop` use ConfigMap `api-config` in two ways: `envFrom` with `configMapRef`, and a volume built from the same ConfigMap and mounted on the directory `/etc/api` (no `subPath`). The ConfigMap is not immutable.

        You run `kubectl edit configmap api-config -n shop` and change the key `LOG_LEVEL` from `info` to `debug`. You do not touch the Deployment. Ten minutes later, what do the running containers see?
    body:
      options:
        - { id: a, text: "The variable `LOG_LEVEL` and the file `/etc/api/LOG_LEVEL` both contain `debug`." }
        - { id: b, text: "The variable `LOG_LEVEL` contains `debug`; the file `/etc/api/LOG_LEVEL` still contains `info`." }
        - { id: c, text: "The variable `LOG_LEVEL` and the file `/etc/api/LOG_LEVEL` both still contain `info`." }
        - { id: d, text: "The variable `LOG_LEVEL` still contains `info`; the file `/etc/api/LOG_LEVEL` contains `debug`." }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Keys projected in a ConfigMap volume are refreshed by the kubelet, with a delay of at most the kubelet sync period plus the cache delay (about two minutes by default), so the file shows `debug`. Environment variables are set when the container starts and are never updated: the containers need a restart, for example `kubectl rollout restart deployment/api -n shop`.
      options:
        a: { en: "Variables from `envFrom` or `valueFrom` are read once at container start; only the volume follows the change." }
        b: { en: "This reverses the behaviour: the mounted file is refreshed, the variable is not." }
        c: { en: "A volume mounted without `subPath` receives ConfigMap updates; after ten minutes the kubelet has refreshed the file." }
    references:
      - title: ConfigMaps
        url: https://kubernetes.io/docs/concepts/configuration/configmap/

  # ------------------------------------------------------------------ 4
  - id: ckad-qz-42-04
    objective: "4.6.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Secret `web-tls` in namespace `shop` has the type `kubernetes.io/tls` and the keys `tls.crt` and `tls.key`. A task asks you to save the decoded PEM certificate to the file `/opt/out/web.crt`.

        Which command produces the expected file?
    body:
      options:
        - { id: a, text: "`kubectl get secret web-tls -n shop -o jsonpath='{.data.tls.crt}' | base64 -d > /opt/out/web.crt`" }
        - { id: b, text: "`kubectl get secret web-tls -n shop -o jsonpath='{.data.tls\\.crt}' > /opt/out/web.crt`" }
        - { id: c, text: "`kubectl get secret web-tls -n shop -o jsonpath='{.data.tls\\.crt}' | base64 -d > /opt/out/web.crt`" }
        - { id: d, text: "`kubectl get secret web-tls -n shop -o jsonpath='{.stringData.tls\\.crt}' > /opt/out/web.crt`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In a JSONPath expression a dot separates fields, so a key that contains a dot must be escaped: `{.data.tls\.crt}`. The value stored in `data` is base64-encoded, so it is piped to `base64 -d` before being written to the file.
      options:
        a: { en: "Without the escape, kubectl looks for a field `crt` inside a field `tls` of `data`; it finds nothing, and the file receives no certificate." }
        b: { en: "The key is read correctly, but the file receives the base64 text stored in `data`, not the decoded PEM certificate." }
        d: { en: "`stringData` is a write-only field: it is merged into `data` and never returned when the Secret is read, so the file is empty." }
    references:
      - title: JSONPath Support
        url: https://kubernetes.io/docs/reference/kubectl/jsonpath/
      - title: Managing Secrets using kubectl
        url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/

  # ------------------------------------------------------------------ 5
  - id: ckad-qz-42-05
    objective: "4.6.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Secret `web-tls` in namespace `shop` has the keys `tls.crt` and `tls.key`. A Pod in namespace `shop` contains this configuration:

        ```yaml
        spec:
          containers:
          - name: web
            image: nginx:1.27
            volumeMounts:
            - name: tls
              mountPath: /etc/web
          volumes:
          - name: tls
            secret:
              secretName: web-tls
              defaultMode: 0400
              items:
              - key: tls.crt
                path: server.crt
        ```

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
    body:
      choose: 2
      options:
        - { id: a, text: "The file `/etc/web/server.crt` exists with the permissions `0400`." }
        - { id: b, text: "The file `/etc/web/tls.key` exists with the permissions `0400`." }
        - { id: c, text: "The file `/etc/web/server.crt` has the permissions `0644`, because `defaultMode` does not apply to keys listed in `items`." }
        - { id: d, text: "If `web-tls` is updated, `/etc/web/server.crt` is eventually updated without restarting the Pod." }
        - { id: e, text: "If `web-tls` does not exist, the container starts and `/etc/web` is empty." }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          With `items`, only the listed keys are projected, at the given paths: the volume holds only `server.crt`. `defaultMode` sets the permissions of every file of the volume unless an item sets its own `mode`, so `server.crt` gets `0400`. A Secret volume mounted without `subPath` is updated by the kubelet, eventually, when the Secret changes.
      options:
        b: { en: "Only the keys listed in `items` are projected; `tls.key` is not listed, so no file is created for it." }
        c: { en: "`defaultMode` applies to every projected file; only a per-item `mode` overrides it. `0644` is the default when neither is set." }
        e: { en: "The reference is not marked `optional: true`, so no container of the Pod starts until the Secret exists." }
    references:
      - title: Distribute Credentials Securely Using Secrets
        url: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/
      - title: Secrets
        url: https://kubernetes.io/docs/concepts/configuration/secret/

  # ------------------------------------------------------------------ 6
  - id: ckad-qz-42-06
    objective: "4.6.1"
    difficulty: 3
    status: draft
    type: command
    stem:
      en: |-
        A build tool in namespace `ci` expects its Git credentials in a Secret of the built-in Kubernetes type for basic authentication.

        In namespace `ci`, create a Secret named `git-cred` of that type, with the key `username` set to `build-bot` and the key `password` set to `p4ss-9f2c`.

        Type the single command you would run.
    body:
      mode: object
      namespace: default
    answer:
      checks:
        - id: kind
          label: The object is a Secret
          path: kind
          op: equals
          value: Secret
        - id: name
          label: It is named git-cred
          path: metadata.name
          op: equals
          value: git-cred
        - id: namespace
          label: It is created in namespace ci
          path: metadata.namespace
          op: equals
          value: ci
        - id: type
          label: Its type is kubernetes.io/basic-auth
          path: type
          op: equals
          value: kubernetes.io/basic-auth
        - id: username
          label: Key username holds build-bot (base64 YnVpbGQtYm90)
          path: data.username
          op: equals
          value: YnVpbGQtYm90
        - id: password
          label: Key password holds p4ss-9f2c (base64 cDRzcy05ZjJj)
          path: data.password
          op: equals
          value: cDRzcy05ZjJj
      solution:
        - command: kubectl create secret generic git-cred -n ci --type=kubernetes.io/basic-auth --from-literal=username=build-bot --from-literal=password=p4ss-9f2c
          output: |
            apiVersion: v1
            data:
              password: cDRzcy05ZjJj
              username: YnVpbGQtYm90
            kind: Secret
            metadata:
              name: git-cred
              namespace: ci
            type: kubernetes.io/basic-auth
        - command: k create secret generic git-cred --from-literal username=build-bot --from-literal password=p4ss-9f2c --type kubernetes.io/basic-auth --namespace=ci --dry-run=client -o yaml
          output: |
            apiVersion: v1
            data:
              password: cDRzcy05ZjJj
              username: YnVpbGQtYm90
            kind: Secret
            metadata:
              name: git-cred
              namespace: ci
            type: kubernetes.io/basic-auth
      negatives:
        - command: kubectl create secret generic git-cred -n ci --from-literal=username=build-bot --from-literal=password=p4ss-9f2c
          why: Without --type a generic Secret has the default type Opaque, not kubernetes.io/basic-auth.
          output: |
            apiVersion: v1
            data:
              password: cDRzcy05ZjJj
              username: YnVpbGQtYm90
            kind: Secret
            metadata:
              name: git-cred
              namespace: ci
        - command: kubectl create secret generic git-cred -n ci --type=basic-auth --from-literal=username=build-bot --from-literal=password=p4ss-9f2c
          why: kubectl stores the type string as given; basic-auth is not the built-in type, whose name is kubernetes.io/basic-auth.
          output: |
            apiVersion: v1
            data:
              password: cDRzcy05ZjJj
              username: YnVpbGQtYm90
            kind: Secret
            metadata:
              name: git-cred
              namespace: ci
            type: basic-auth
        - command: kubectl create secret generic git-cred --type=kubernetes.io/basic-auth --from-literal=username=build-bot --from-literal=password=p4ss-9f2c
          why: Without -n the Secret is created in the context namespace, default, where the build tool in ci cannot use it.
          output: |
            apiVersion: v1
            data:
              password: cDRzcy05ZjJj
              username: YnVpbGQtYm90
            kind: Secret
            metadata:
              name: git-cred
            type: kubernetes.io/basic-auth
    explanation:
      correct:
        en: '`kubectl create secret` only has the `generic`, `tls` and `docker-registry` subcommands; for any other built-in type, use `generic` with `--type`. The basic authentication type is `kubernetes.io/basic-auth`, whose keys are `username` and `password`. Without `--type`, the Secret is `Opaque`, and kubectl base64-encodes the literal values in `data`.'
    references:
      - title: kubectl create secret generic
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_generic/
      - title: Secrets
        url: https://kubernetes.io/docs/concepts/configuration/secret/

  # ------------------------------------------------------------------ 7
  - id: ckad-qz-42-07
    objective: "4.4.1"
    difficulty: 3
    status: draft
    type: command
    stem:
      en: |-
        The current directory contains a directory `conf/` with the files `app.properties` and `cache.properties`, and a file `prod-logging.xml`.

        In namespace `billing`, create a ConfigMap named `billing-conf` with exactly these four keys:

        - `app.properties` and `cache.properties`, each holding the content of the file of the same name in `conf/`;
        - `logging.xml`, holding the content of `prod-logging.xml`;
        - `PROFILE`, with the value `prod`.

        Type the single command you would run.
    body:
      mode: object
      namespace: default
      files:
        - name: conf/app.properties
          content: |
            currency=EUR
            rounding=HALF_UP
        - name: conf/cache.properties
          content: |
            ttl=300
            max-entries=5000
        - name: prod-logging.xml
          content: |
            <configuration>
              <root level="WARN"/>
            </configuration>
    answer:
      checks:
        - id: kind
          label: The object is a ConfigMap
          path: kind
          op: equals
          value: ConfigMap
        - id: name
          label: It is named billing-conf
          path: metadata.name
          op: equals
          value: billing-conf
        - id: namespace
          label: It is created in namespace billing
          path: metadata.namespace
          op: equals
          value: billing
        - id: app
          label: Key app.properties holds the content of conf/app.properties
          path: data["app.properties"]
          op: contains
          value: rounding=HALF_UP
        - id: cache
          label: Key cache.properties holds the content of conf/cache.properties
          path: data["cache.properties"]
          op: contains
          value: max-entries=5000
        - id: logging
          label: Key logging.xml holds the content of prod-logging.xml
          path: data["logging.xml"]
          op: contains
          value: <root level="WARN"/>
        - id: profile
          label: Key PROFILE holds prod
          path: data.PROFILE
          op: equals
          value: prod
        - id: count
          label: The ConfigMap has exactly four keys
          path: data
          op: length
          value: 4
      solution:
        - command: kubectl create configmap billing-conf -n billing --from-file=conf/ --from-file=logging.xml=prod-logging.xml --from-literal=PROFILE=prod
          output: |
            apiVersion: v1
            data:
              PROFILE: prod
              app.properties: |
                currency=EUR
                rounding=HALF_UP
              cache.properties: |
                ttl=300
                max-entries=5000
              logging.xml: |
                <configuration>
                  <root level="WARN"/>
                </configuration>
            kind: ConfigMap
            metadata:
              name: billing-conf
              namespace: billing
        - command: k create cm billing-conf --from-file conf --from-file logging.xml=./prod-logging.xml --from-literal PROFILE=prod --namespace billing --dry-run=client -o yaml
          output: |
            apiVersion: v1
            data:
              PROFILE: prod
              app.properties: |
                currency=EUR
                rounding=HALF_UP
              cache.properties: |
                ttl=300
                max-entries=5000
              logging.xml: |
                <configuration>
                  <root level="WARN"/>
                </configuration>
            kind: ConfigMap
            metadata:
              name: billing-conf
              namespace: billing
        - command: kubectl -n billing create configmap billing-conf --from-file=conf/app.properties --from-file=conf/cache.properties --from-file=logging.xml=prod-logging.xml --from-literal=PROFILE=prod
          output: |
            apiVersion: v1
            data:
              PROFILE: prod
              app.properties: |
                currency=EUR
                rounding=HALF_UP
              cache.properties: |
                ttl=300
                max-entries=5000
              logging.xml: |
                <configuration>
                  <root level="WARN"/>
                </configuration>
            kind: ConfigMap
            metadata:
              name: billing-conf
              namespace: billing
      negatives:
        - command: kubectl create configmap billing-conf -n billing --from-file=conf/ --from-file=prod-logging.xml --from-literal=PROFILE=prod
          why: Without KEY= the key defaults to the file basename, prod-logging.xml, so there is no key logging.xml.
          output: |
            apiVersion: v1
            data:
              PROFILE: prod
              app.properties: |
                currency=EUR
                rounding=HALF_UP
              cache.properties: |
                ttl=300
                max-entries=5000
              prod-logging.xml: |
                <configuration>
                  <root level="WARN"/>
                </configuration>
            kind: ConfigMap
            metadata:
              name: billing-conf
              namespace: billing
        - command: kubectl create configmap billing-conf -n billing --from-file=conf/ --from-literal=logging.xml=prod-logging.xml --from-literal=PROFILE=prod
          why: --from-literal stores the text prod-logging.xml as the value; it does not read the file.
          output: |
            apiVersion: v1
            data:
              PROFILE: prod
              app.properties: |
                currency=EUR
                rounding=HALF_UP
              cache.properties: |
                ttl=300
                max-entries=5000
              logging.xml: prod-logging.xml
            kind: ConfigMap
            metadata:
              name: billing-conf
              namespace: billing
        - command: kubectl create configmap billing-conf --from-file=conf/ --from-file=logging.xml=prod-logging.xml --from-literal=PROFILE=prod
          why: Without -n the ConfigMap is created in the context namespace, default.
          output: |
            apiVersion: v1
            data:
              PROFILE: prod
              app.properties: |
                currency=EUR
                rounding=HALF_UP
              cache.properties: |
                ttl=300
                max-entries=5000
              logging.xml: |
                <configuration>
                  <root level="WARN"/>
                </configuration>
            kind: ConfigMap
            metadata:
              name: billing-conf
    explanation:
      correct:
        en: 'One `kubectl create configmap` can combine several `--from-file` and `--from-literal` sources (only `--from-env-file` cannot be mixed with them). `--from-file=conf/` adds one key per regular file of the directory, named after the file; listing the two files works too. `--from-file=logging.xml=prod-logging.xml` stores the file under a key of your choice, while `--from-file=prod-logging.xml` would use the basename as the key.'
    references:
      - title: kubectl create configmap
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_configmap/
      - title: Configure a Pod to Use a ConfigMap
        url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/

  # ------------------------------------------------------------------ 8
  - id: ckad-qz-42-08
    objective: "4.4.2"
    difficulty: 3
    status: draft
    type: command
    stem:
      en: |-
        Deployment `api` in namespace `shop` runs one container. ConfigMap `api-config` in the same namespace has the keys `LOG_LEVEL`, `MAX_CONN` and `app.properties`.

        Without opening an editor and without writing YAML or JSON (no file, no patch), change the live Deployment so that its container receives the environment variables `API_LOG_LEVEL` and `API_MAX_CONN`, read from the keys `LOG_LEVEL` and `MAX_CONN` of `api-config`. The key `app.properties` must not become a variable.

        Type the single command you would run.
    body:
      mode: invocation
      namespace: default
    answer:
      checks:
        - id: verb
          label: Uses kubectl set env
          path: subverb
          op: equals
          value: env
        - id: set
          label: It is a set command
          path: verb
          op: equals
          value: set
        - id: resource
          label: Targets a Deployment
          path: resource
          op: equals
          value: deployment
        - id: name
          label: Names the Deployment api
          path: names
          op: contains
          value: api
        - id: namespace
          label: Runs in namespace shop
          path: flags.namespace
          op: equals
          value: shop
        - id: from
          label: Imports from ConfigMap api-config
          path: flags.from
          op: oneOf
          value: [configmap/api-config, configmaps/api-config, cm/api-config]
        - id: key-log
          label: Imports the key LOG_LEVEL
          path: flags.keys
          op: contains
          value: LOG_LEVEL
        - id: key-max
          label: Imports the key MAX_CONN
          path: flags.keys
          op: contains
          value: MAX_CONN
        - id: no-properties
          label: Does not import the key app.properties
          path: flags.keys
          op: matches
          value: ^(?![\s\S]*app\.properties)
        - id: prefix
          label: Prefixes the variable names with API_
          path: flags.prefix
          op: equals
          value: API_
        - id: live
          label: Changes the live Deployment (no dry run)
          path: flags["dry-run"]
          op: absent
      solution:
        - command: kubectl set env deployment/api -n shop --from=configmap/api-config --keys=LOG_LEVEL,MAX_CONN --prefix=API_
        - command: k -n shop set env deploy api --from configmap/api-config --keys MAX_CONN,LOG_LEVEL --prefix API_
        - command: kubectl set env --from=configmap/api-config --keys=LOG_LEVEL --keys=MAX_CONN --prefix=API_ deployment/api --namespace=shop
      negatives:
        - command: kubectl set env deployment/api -n shop --from=configmap/api-config --prefix=API_
          why: Without --keys every key is imported, app.properties included.
        - command: kubectl set env deployment/api -n shop --from=configmap/api-config --keys=LOG_LEVEL,MAX_CONN --prefix=API
          why: The prefix is prepended as given, so the variables would be APILOG_LEVEL and APIMAX_CONN.
        - command: kubectl set env deployment/api -n shop API_LOG_LEVEL=LOG_LEVEL API_MAX_CONN=MAX_CONN
          why: NAME=VALUE pairs set literal values, so API_LOG_LEVEL would be the string LOG_LEVEL instead of a reference to the ConfigMap key.
        - command: kubectl set env deployment/api -n shop --from=configmap/api-config --keys=LOG_LEVEL,MAX_CONN --prefix=API_ --dry-run=client -o yaml
          why: A client dry run only prints the modified Deployment; the live object is not changed.
    explanation:
      correct:
        en: '`kubectl set env --from=configmap/api-config` adds to the Pod template one `env` entry per key, each with a `configMapKeyRef`; `--keys` limits the import to the listed keys and `--prefix` is prepended to each variable name exactly as written. The change to the template triggers a rollout, so new Pods start with the variables. The result is `env` entries, not an `envFrom` block.'
    references:
      - title: kubectl set env
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_set/kubectl_set_env/

  # ------------------------------------------------------------------ 9
  - id: ckad-qz-42-09
    objective: "4.6.2"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        In namespace `payments`, the Secrets `regcred` (type `kubernetes.io/dockerconfigjson`, credentials for `registry.example.com`), `ledger-db` (keys `username`, `password`) and `ledger-flags` (keys `audit`, `strict`) exist. The Secret `ledger-signing` is created later by another team.

        Write the manifest of a Deployment named `ledger` in namespace `payments` with 2 replicas, Pod label `app: ledger` and one container named `ledger` running `registry.example.com/payments/ledger:5.0`:

        - the kubelet pulls the image with the credentials of `regcred`;
        - the variable `DB_PASSWORD` takes the value of the key `password` of `ledger-db`;
        - every key of `ledger-flags` becomes a variable whose name is the key prefixed with `FLAG_` (`FLAG_audit`, `FLAG_strict`);
        - a volume named `signing` comes from Secret `ledger-signing` and is mounted read-only at `/var/run/signing`; the Pods must start even while `ledger-signing` does not exist.
    body:
      starter: ""
    answer:
      checks:
        - id: kind
          label: The object is a Deployment
          path: kind
          op: equals
          value: Deployment
        - id: meta
          label: It is named ledger in namespace payments
          path: metadata
          op: subset
          value: { name: ledger, namespace: payments }
        - id: replicas
          label: It runs 2 replicas
          path: spec.replicas
          op: equals
          value: 2
        - id: selector
          label: The selector and the Pod template use the label app=ledger
          path: spec
          op: subset
          value: { selector: { matchLabels: { app: ledger } }, template: { metadata: { labels: { app: ledger } } } }
        - id: image
          label: Container ledger runs registry.example.com/payments/ledger:5.0
          path: spec.template.spec.containers[name=ledger].image
          op: equals
          value: registry.example.com/payments/ledger:5.0
        - id: pull
          label: The Pod spec lists regcred in imagePullSecrets
          path: spec.template.spec.imagePullSecrets
          op: contains
          value: { name: regcred }
        - id: db-password
          label: DB_PASSWORD reads key password of Secret ledger-db
          path: spec.template.spec.containers[name=ledger].env[name=DB_PASSWORD].valueFrom.secretKeyRef
          op: subset
          value: { name: ledger-db, key: password }
        - id: flags
          label: Every key of Secret ledger-flags is imported with the prefix FLAG_
          path: spec.template.spec.containers[name=ledger].envFrom
          op: contains
          value: { prefix: FLAG_, secretRef: { name: ledger-flags } }
        - id: volume
          label: Volume signing comes from Secret ledger-signing
          path: spec.template.spec.volumes[name=signing].secret.secretName
          op: equals
          value: ledger-signing
        - id: optional
          label: The Secret volume is optional
          path: spec.template.spec.volumes[name=signing].secret.optional
          op: equals
          value: true
        - id: mount
          label: Volume signing is mounted at /var/run/signing
          path: spec.template.spec.containers[name=ledger].volumeMounts[name=signing].mountPath
          op: matches
          value: ^/var/run/signing/?$
        - id: read-only
          label: The mount is read-only
          path: spec.template.spec.containers[name=ledger].volumeMounts[name=signing].readOnly
          op: equals
          value: true
      solution:
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ledger
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: ledger
              template:
                metadata:
                  labels:
                    app: ledger
                spec:
                  imagePullSecrets:
                  - name: regcred
                  containers:
                  - name: ledger
                    image: registry.example.com/payments/ledger:5.0
                    env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ledger-db
                          key: password
                    envFrom:
                    - prefix: FLAG_
                      secretRef:
                        name: ledger-flags
                    volumeMounts:
                    - name: signing
                      mountPath: /var/run/signing
                      readOnly: true
                  volumes:
                  - name: signing
                    secret:
                      secretName: ledger-signing
                      optional: true
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              namespace: payments
              name: ledger
              labels:
                app: ledger
            spec:
              replicas: 2
              selector:
                matchLabels: {app: ledger}
              template:
                metadata:
                  labels: {app: ledger}
                spec:
                  volumes:
                  - name: signing
                    secret: {secretName: ledger-signing, optional: true, defaultMode: 0400}
                  containers:
                  - name: ledger
                    image: registry.example.com/payments/ledger:5.0
                    envFrom:
                    - secretRef: {name: ledger-flags}
                      prefix: FLAG_
                    env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef: {key: password, name: ledger-db}
                    volumeMounts:
                    - {name: signing, mountPath: /var/run/signing/, readOnly: true}
                  imagePullSecrets:
                  - name: regcred
      negatives:
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ledger
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: ledger
              template:
                metadata:
                  labels:
                    app: ledger
                spec:
                  containers:
                  - name: ledger
                    image: registry.example.com/payments/ledger:5.0
                    imagePullSecrets:
                    - name: regcred
                    env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ledger-db
                          key: password
                    envFrom:
                    - prefix: FLAG_
                      secretRef:
                        name: ledger-flags
                    volumeMounts:
                    - name: signing
                      mountPath: /var/run/signing
                      readOnly: true
                  volumes:
                  - name: signing
                    secret:
                      secretName: ledger-signing
                      optional: true
          why: imagePullSecrets is a field of the Pod spec, not of a container; under the container it is an unknown field and no pull credentials are used.
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ledger
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: ledger
              template:
                metadata:
                  labels:
                    app: ledger
                spec:
                  imagePullSecrets:
                  - name: regcred
                  containers:
                  - name: ledger
                    image: registry.example.com/payments/ledger:5.0
                    env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ledger-db
                          key: password
                    envFrom:
                    - secretRef:
                        name: ledger-flags
                        prefix: FLAG_
                    volumeMounts:
                    - name: signing
                      mountPath: /var/run/signing
                      readOnly: true
                  volumes:
                  - name: signing
                    secret:
                      secretName: ledger-signing
                      optional: true
          why: prefix belongs to the envFrom entry, next to secretRef; inside secretRef it is an unknown field, so it never prefixes the variable names.
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ledger
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: ledger
              template:
                metadata:
                  labels:
                    app: ledger
                spec:
                  imagePullSecrets:
                  - name: regcred
                  containers:
                  - name: ledger
                    image: registry.example.com/payments/ledger:5.0
                    env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: ledger-db
                          key: password
                    envFrom:
                    - prefix: FLAG_
                      secretRef:
                        name: ledger-flags
                    volumeMounts:
                    - name: signing
                      mountPath: /var/run/signing
                      readOnly: true
                  volumes:
                  - name: signing
                    secret:
                      secretName: ledger-signing
          why: Secrets are required by default; without optional true no container starts until ledger-signing exists.
    explanation:
      correct:
        en: '`imagePullSecrets` sits in the Pod spec (here `spec.template.spec`) and names a `kubernetes.io/dockerconfigjson` Secret of the same namespace. `secretKeyRef` maps one key to a variable you name; `envFrom` with `secretRef` imports every key, and its `prefix` field, a sibling of `secretRef`, is prepended to each name. A Secret volume uses `secretName`, and `optional: true` lets the Pods start while the Secret is missing.'
    references:
      - title: Secrets
        url: https://kubernetes.io/docs/concepts/configuration/secret/
      - title: Distribute Credentials Securely Using Secrets
        url: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/

  # ------------------------------------------------------------------ 10
  - id: ckad-qz-42-10
    objective: "4.4.2"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        Deployment `catalog` in namespace `shop` (pre-filled in the editor) uses ConfigMap `catalog-settings`, which has the keys `app.yaml`, `legacy.yaml`, `cache.ttl` and `PAGE_SIZE`. The image has nothing of its own in `/etc/catalog`.

        Fix the manifest so that it meets every requirement below. Keep the Deployment name, namespace, labels, replicas, image, container name and the volume name `settings`.

        - The application reloads `/etc/catalog/app.yaml` when the file changes: an update of the ConfigMap must reach this file in the running Pods, without restarting them.
        - `/etc/catalog` contains only `app.yaml` (no `legacy.yaml`, no other key).
        - The container receives exactly two variables from the ConfigMap: `CACHE_TTL` (from the key `cache.ttl`) and `PAGE_SIZE` (from the key `PAGE_SIZE`).
    body:
      starter: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: catalog
          namespace: shop
        spec:
          replicas: 3
          selector:
            matchLabels:
              app: catalog
          template:
            metadata:
              labels:
                app: catalog
            spec:
              containers:
              - name: catalog
                image: registry.example.com/shop/catalog:3.2
                envFrom:
                - configMapRef:
                    name: catalog-settings
                volumeMounts:
                - name: settings
                  mountPath: /etc/catalog/app.yaml
                  subPath: app.yaml
              volumes:
              - name: settings
                configMap:
                  name: catalog-settings
    answer:
      checks:
        - id: meta
          label: Deployment catalog in namespace shop
          path: metadata
          op: subset
          value: { name: catalog, namespace: shop }
        - id: replicas
          label: It still runs 3 replicas with the label app=catalog
          path: spec
          op: subset
          value: { replicas: 3, selector: { matchLabels: { app: catalog } }, template: { metadata: { labels: { app: catalog } } } }
        - id: image
          label: Container catalog still runs registry.example.com/shop/catalog:3.2
          path: spec.template.spec.containers[name=catalog].image
          op: equals
          value: registry.example.com/shop/catalog:3.2
        - id: no-envfrom
          label: The container no longer imports every key with envFrom
          path: spec.template.spec.containers[name=catalog].envFrom
          op: absent
        - id: cache-ttl
          label: CACHE_TTL reads key cache.ttl of ConfigMap catalog-settings
          path: spec.template.spec.containers[name=catalog].env[name=CACHE_TTL].valueFrom.configMapKeyRef
          op: subset
          value: { name: catalog-settings, key: cache.ttl }
        - id: page-size
          label: PAGE_SIZE reads key PAGE_SIZE of ConfigMap catalog-settings
          path: spec.template.spec.containers[name=catalog].env[name=PAGE_SIZE].valueFrom.configMapKeyRef
          op: subset
          value: { name: catalog-settings, key: PAGE_SIZE }
        - id: mount-dir
          label: Volume settings is mounted on the directory /etc/catalog
          path: spec.template.spec.containers[name=catalog].volumeMounts[name=settings].mountPath
          op: matches
          value: ^/etc/catalog/?$
        - id: no-subpath
          label: The mount does not use subPath (so it receives updates)
          path: spec.template.spec.containers[name=catalog].volumeMounts[name=settings].subPath
          op: absent
        - id: source
          label: Volume settings still comes from ConfigMap catalog-settings
          path: spec.template.spec.volumes[name=settings].configMap.name
          op: equals
          value: catalog-settings
        - id: one-item
          label: The volume projects a single key
          path: spec.template.spec.volumes[name=settings].configMap.items
          op: length
          value: 1
        - id: app-item
          label: The projected key is app.yaml, as the file app.yaml
          path: spec.template.spec.volumes[name=settings].configMap.items
          op: contains
          value: { key: app.yaml, path: app.yaml }
      solution:
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: catalog
              namespace: shop
            spec:
              replicas: 3
              selector:
                matchLabels:
                  app: catalog
              template:
                metadata:
                  labels:
                    app: catalog
                spec:
                  containers:
                  - name: catalog
                    image: registry.example.com/shop/catalog:3.2
                    env:
                    - name: CACHE_TTL
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: cache.ttl
                    - name: PAGE_SIZE
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: PAGE_SIZE
                    volumeMounts:
                    - name: settings
                      mountPath: /etc/catalog
                  volumes:
                  - name: settings
                    configMap:
                      name: catalog-settings
                      items:
                      - key: app.yaml
                        path: app.yaml
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: catalog
              namespace: shop
            spec:
              replicas: 3
              selector:
                matchLabels:
                  app: catalog
              template:
                metadata:
                  labels:
                    app: catalog
                spec:
                  volumes:
                  - name: settings
                    configMap:
                      name: catalog-settings
                      items:
                      - {key: app.yaml, path: app.yaml}
                  containers:
                  - name: catalog
                    image: registry.example.com/shop/catalog:3.2
                    env:
                    - name: PAGE_SIZE
                      valueFrom:
                        configMapKeyRef: {key: PAGE_SIZE, name: catalog-settings}
                    - name: CACHE_TTL
                      valueFrom:
                        configMapKeyRef: {key: cache.ttl, name: catalog-settings}
                    volumeMounts:
                    - name: settings
                      mountPath: /etc/catalog/
                      readOnly: true
      negatives:
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: catalog
              namespace: shop
            spec:
              replicas: 3
              selector:
                matchLabels:
                  app: catalog
              template:
                metadata:
                  labels:
                    app: catalog
                spec:
                  containers:
                  - name: catalog
                    image: registry.example.com/shop/catalog:3.2
                    env:
                    - name: CACHE_TTL
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: cache.ttl
                    - name: PAGE_SIZE
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: PAGE_SIZE
                    volumeMounts:
                    - name: settings
                      mountPath: /etc/catalog/app.yaml
                      subPath: app.yaml
                  volumes:
                  - name: settings
                    configMap:
                      name: catalog-settings
          why: A subPath mount never receives ConfigMap updates, so the running Pods keep the old app.yaml until they restart.
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: catalog
              namespace: shop
            spec:
              replicas: 3
              selector:
                matchLabels:
                  app: catalog
              template:
                metadata:
                  labels:
                    app: catalog
                spec:
                  containers:
                  - name: catalog
                    image: registry.example.com/shop/catalog:3.2
                    env:
                    - name: CACHE_TTL
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: cache.ttl
                    - name: PAGE_SIZE
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: PAGE_SIZE
                    volumeMounts:
                    - name: settings
                      mountPath: /etc/catalog
                  volumes:
                  - name: settings
                    configMap:
                      name: catalog-settings
          why: Without items every key becomes a file, so /etc/catalog also holds legacy.yaml, cache.ttl and PAGE_SIZE.
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: catalog
              namespace: shop
            spec:
              replicas: 3
              selector:
                matchLabels:
                  app: catalog
              template:
                metadata:
                  labels:
                    app: catalog
                spec:
                  containers:
                  - name: catalog
                    image: registry.example.com/shop/catalog:3.2
                    envFrom:
                    - configMapRef:
                        name: catalog-settings
                    env:
                    - name: CACHE_TTL
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: cache.ttl
                    volumeMounts:
                    - name: settings
                      mountPath: /etc/catalog
                  volumes:
                  - name: settings
                    configMap:
                      name: catalog-settings
                      items:
                      - key: app.yaml
                        path: app.yaml
          why: envFrom still imports every key as a variable of the same name (app.yaml, legacy.yaml, cache.ttl, PAGE_SIZE), not only the two required ones.
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: catalog
              namespace: shop
            spec:
              replicas: 3
              selector:
                matchLabels:
                  app: catalog
              template:
                metadata:
                  labels:
                    app: catalog
                spec:
                  containers:
                  - name: catalog
                    image: registry.example.com/shop/catalog:3.2
                    env:
                    - name: CACHE_TTL
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: cache.ttl
                    - name: PAGE_SIZE
                      valueFrom:
                        configMapKeyRef:
                          name: catalog-settings
                          key: PAGE_SIZE
                    volumeMounts:
                    - name: settings
                      mountPath: /etc/catalog/app.yaml
                  volumes:
                  - name: settings
                    configMap:
                      name: catalog-settings
                      items:
                      - key: app.yaml
                        path: app.yaml
          why: Without subPath the volume is a directory; mounted at /etc/catalog/app.yaml it creates /etc/catalog/app.yaml/app.yaml.
    explanation:
      correct:
        en: 'A ConfigMap volume mounted on a directory receives updates, while a `subPath` mount never does: mount `settings` on `/etc/catalog` (the image has nothing there to hide) and use `items` so that only `app.yaml` is projected. `envFrom` imports every key under its own name (dotted keys are valid variable names in current Kubernetes), so replace it with two `env` entries using `configMapKeyRef`, which also choose the names `CACHE_TTL` and `PAGE_SIZE`.'
    references:
      - title: ConfigMaps
        url: https://kubernetes.io/docs/concepts/configuration/configmap/
      - title: Configure a Pod to Use a ConfigMap
        url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
