chapter: 12-multicontainer-volumes
questions:
  # ------------------------------------------------------------------ 1
  - id: ckad-qz-12-01
    objective: "1.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A legacy application serves its health and throughput figures as a custom JSON page on `localhost:8080/status`. The monitoring team scrapes Prometheus metrics only. A second container in the same Pod reads `/status` and exposes the same figures at `/metrics` in Prometheus format, without any change to the application.

        Which multi-container pattern does this second container implement?
    body:
      options:
        - { id: a, text: { en: "Ambassador" } }
        - { id: b, text: { en: "Init container" } }
        - { id: c, text: { en: "Adapter" } }
        - { id: d, text: { en: "Ephemeral container" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: An adapter converts the output of the application into the format that the outside world expects, here a custom status page into Prometheus metrics. The application keeps its own format and needs no code change; only the helper knows both formats.
      options:
        a: { en: "An ambassador proxies the application's outgoing connections to a remote service (the application talks to `localhost` and the ambassador handles discovery or routing); it does not translate the application's own output." }
        b: { en: "An init container runs once, to completion, before the application starts. It cannot keep serving `/metrics` while the application runs." }
        d: { en: "An ephemeral container is added temporarily with `kubectl debug` for troubleshooting; it is never restarted, may not declare ports and is not meant to run part of the application." }
    references:
      - title: "Kubernetes Multicontainer Pods: An Overview"
        url: https://kubernetes.io/blog/2025/04/22/multi-container-pods-overview/

  # ------------------------------------------------------------------ 2
  - id: ckad-qz-12-02
    objective: "1.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A PersistentVolumeClaim is backed by a CSI driver. The application writes to the volume, and at most one running instance of it may mount the volume at any time, even when two instances that use the claim land on the same node.

        Which access mode should the claim request?
    body:
      options:
        - { id: a, text: "ReadWriteOnce" }
        - { id: b, text: "ReadWriteOncePod" }
        - { id: c, text: "ReadWriteMany" }
        - { id: d, text: "ReadOnlyMany" }
    answer: { optionId: b }
    explanation:
      correct:
        en: "`ReadWriteOncePod` (RWOP) allows a single Pod in the cluster to mount the volume read-write. It is supported only for CSI volumes, which is the case here."
      options:
        a: { en: "`ReadWriteOnce` limits the volume to one node, not one Pod: several Pods on that node can mount it read-write at the same time." }
        c: { en: "`ReadWriteMany` lets Pods on many nodes mount the volume read-write, the opposite of the requirement." }
        d: { en: "`ReadOnlyMany` gives read-only access to many nodes: the Pod could not write, and nothing limits the number of Pods." }
    references:
      - title: Persistent Volumes
        url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/

  # ------------------------------------------------------------------ 3
  - id: ckad-qz-12-03
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A Pod has two init containers and two application containers. No container sets a container-level `restartPolicy`. The CPU requests are:

        - init container `migrate`: `600m`, then init container `seed`: `200m`;
        - containers `api`: `250m` and `metrics`: `100m`.

        What CPU request does the scheduler use for this Pod when it chooses a node?
    body:
      options:
        - { id: a, text: "`350m`" }
        - { id: b, text: "`600m`" }
        - { id: c, text: "`800m`" }
        - { id: d, text: "`1150m`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: "Init containers run one at a time and finish before the application containers start, so their requests are not added together. The Pod requests the larger of the biggest init container request (`600m`) and the sum of the application containers (`250m` + `100m` = `350m`): `600m`, and the node keeps it reserved after initialization."
      options:
        a: { en: "`350m` is only the sum of the application containers. The `migrate` init container needs `600m` while it runs, so the Pod must be placed on a node that can give it that much." }
        c: { en: "`800m` adds the two init containers, but they never run at the same time: only the largest one counts." }
        d: { en: "`1150m` adds every container, as if init and application containers ran together. Regular init containers have finished before the application containers start." }
    references:
      - title: Init Containers
        url: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/

  # ------------------------------------------------------------------ 4
  - id: ckad-qz-12-04
    objective: "1.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The PersistentVolume `pv-reports` (class `manual`, `5Gi`, ReadWriteOnce, hostPath, reclaim policy `Retain`) was bound to the claim `reports` in namespace `finance`. A developer deleted the claim, then created a new claim `reports` with exactly the same spec. The new claim has stayed `Pending` for ten minutes, and `kubectl get pv` shows `pv-reports` with status `Released` and claim `finance/reports`.

        Why does the new claim not bind to `pv-reports`?
    body:
      options:
        - { id: a, text: { en: "`Released` means the kubelet is still unmounting the volume from the node; the claim binds by itself as soon as the volume returns to `Available`." } }
        - { id: b, text: { en: "`Released` means the former claim was deleted while its data stays on the volume; the volume is not offered to another claim until an administrator reclaims it." } }
        - { id: c, text: { en: "`Retain` reserves the volume for the namespace of its first claim; the new claim binds only if it names the volume in `spec.volumeName`." } }
        - { id: d, text: { en: "The `kubernetes.io/pvc-protection` finalizer keeps the old binding until every Pod that used the claim is deleted; the volume is then `Available` again." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: "With the `Retain` policy, deleting the claim moves the volume to `Released`: it still records the old claim and keeps the previous claimant's data, so Kubernetes does not offer it to another claim. An administrator must reclaim it, for example by deleting the PersistentVolume object (the node directory and its files stay) and creating it again with the same hostPath."
      options:
        a: { en: "A `Released` volume never goes back to `Available` by itself, whatever the kubelet does: the new claim would stay `Pending` indefinitely." }
        c: { en: "The reclaim policy says what happens to the volume when its claim is deleted; it reserves nothing for a namespace. `volumeName` does not help either: the volume still references the old claim, so the binding stays pending." }
        d: { en: "The `pvc-protection` finalizer only delays the deletion of a claim that a Pod still uses. Here the claim is already gone, and the volume does not become `Available` when Pods are deleted." }
    references:
      - title: Persistent Volumes
        url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/

  # ------------------------------------------------------------------ 5
  - id: ckad-qz-12-05
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        A Pod spec contains the following containers (other fields omitted):

        ```yaml
        initContainers:
        - name: log-agent
          image: registry.example.com/log-agent:2.0
          restartPolicy: Always
        - name: migrate
          image: registry.example.com/migrate:1.4
        containers:
        - name: app
          image: registry.example.com/app:3.0
        ```

        Which two statements are true? (Choose two.)
    body:
      choose: 2
      options:
        - { id: a, text: { en: "`migrate` starts as soon as `log-agent` has started, without waiting for `log-agent` to exit." } }
        - { id: b, text: { en: "`app` starts only after `log-agent` has exited with status 0." } }
        - { id: c, text: { en: "`log-agent` may define a `livenessProbe` and a `readinessProbe`." } }
        - { id: d, text: { en: "When the Pod terminates, `log-agent` is stopped before `app`." } }
        - { id: e, text: { en: "Moving `log-agent`, with its `restartPolicy: Always`, to the end of `containers` keeps the same start order." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: "An `initContainers` entry with `restartPolicy: Always` is a native sidecar. The kubelet starts the next init container as soon as the sidecar is started (process running, or startup probe succeeded), and the sidecar keeps running alongside `app`. Unlike regular init containers, sidecars support probes and `lifecycle`."
      options:
        b: { en: "A sidecar is not expected to exit: `app` starts once every regular init container (`migrate`) has completed, while `log-agent` keeps running." }
        d: { en: "The kubelet stops sidecars only after the application containers have stopped, in the reverse order of their declaration, so `log-agent` can still ship the last logs of `app`." }
        e: { en: "In `containers`, a container-level `restartPolicy` only overrides the Pod restart policy for that container: there is no start ordering and no sidecar behavior. Native sidecars exist only in `initContainers`." }
    references:
      - title: Sidecar Containers
        url: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/

  # ------------------------------------------------------------------ 6
  - id: ckad-qz-12-06
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: command
    stem:
      en: |-
        In namespace `payments`, Pod `ledger` runs two containers: `app`, built from a distroless image without a shell, and `proxy`. You must inspect the processes of `app` from a shell, but the spec of `ledger` must stay exactly as it is and `ledger` must keep running.

        Create a copy of the Pod named `ledger-debug` with an additional interactive debugging container from the image `busybox:1.37`, able to see the processes of `app`, and attach to it. Type the single command you would run.
    body:
      mode: invocation
      namespace: default
    answer:
      checks:
        - id: verb
          label: Uses kubectl debug
          path: verb
          op: equals
          value: debug
        - id: pod
          label: Debugs Pod ledger
          path: names
          op: contains
          value: ledger
        - id: copy
          label: Creates a copy named ledger-debug
          path: flags.copy-to
          op: equals
          value: ledger-debug
        - id: image
          label: Adds a debugging container from busybox:1.37
          path: flags.image
          op: equals
          value: busybox:1.37
        - id: stdin
          label: The debugging session is interactive
          path: flags.stdin
          op: equals
          value: true
        - id: share
          label: Process namespace sharing is not turned off in the copy
          path: flags
          op: matches
          value: '^(?!.*"share-processes":"?false).*$'
        - id: keep
          label: The original Pod is not deleted
          path: flags.replace
          op: absent
        - id: namespace
          label: Runs in namespace payments
          path: flags.namespace
          op: equals
          value: payments
      solution:
        - command: kubectl debug ledger -it --image=busybox:1.37 --copy-to=ledger-debug -n payments
        - command: k -n payments debug pod/ledger --copy-to ledger-debug --image busybox:1.37 -it --share-processes
        - command: kubectl debug ledger --namespace=payments --stdin --tty --copy-to=ledger-debug --share-processes=true --image=busybox:1.37
      negatives:
        - command: kubectl debug ledger -it --image=busybox:1.37 --target=app -n payments
          why: Without --copy-to, kubectl adds an ephemeral container to ledger itself; it changes the Pod spec and can never be removed.
        - command: kubectl debug ledger -it --copy-to=ledger-debug --set-image=app=busybox:1.37 -n payments
          why: --set-image replaces the image of app in the copy, so the process to inspect is gone; --image is the flag that adds a debugging container.
        - command: kubectl debug ledger -it --image=busybox:1.37 --copy-to=ledger-debug --replace -n payments
          why: --replace deletes the original Pod once the copy is created; ledger must keep running.
        - command: kubectl debug ledger -it --image=busybox:1.37 --copy-to=ledger-debug --share-processes=false -n payments
          why: Without process namespace sharing, the busybox container sees only its own processes, not those of app.
        - command: kubectl debug ledger -it --image=busybox:1.37 --copy-to=ledger-debug
          why: Without -n payments, kubectl looks for ledger in the context namespace, default.
    explanation:
      correct:
        en: "`kubectl debug ledger -it --image=busybox:1.37 --copy-to=ledger-debug -n payments` creates a new Pod from the spec of `ledger`, adds a busybox container and attaches to it; the original Pod is not touched. With `--copy-to`, `--share-processes` defaults to true, so `ps` in busybox lists the processes of `app`. `--target` without a copy would add a permanent ephemeral container to `ledger`, `--set-image` changes existing images instead of adding a container, and `--replace` deletes the original."
    references:
      - title: kubectl debug
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/
      - title: Ephemeral Containers
        url: https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/

  # ------------------------------------------------------------------ 7
  - id: ckad-qz-12-07
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        In namespace `shop`, the Secret `api-tls` has three keys: `tls.crt`, `tls.key` and `ca.crt`. Write the manifest of a Pod named `api` with one container named `api` (`registry.example.com/shop/api:3.2`) that reads its certificate from `/etc/api/tls/server.crt` and its private key from `/etc/api/tls/server.key`.

        - Use one `secret` volume named `tls`, mounted at `/etc/api/tls`.
        - `ca.crt` must not appear in the container.
        - Certificates are rotated in place: when `api-tls` is updated, both files must change without restarting the Pod.
    body:
      starter: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: api
          namespace: shop
        spec:
          containers:
          - name: api
            image: registry.example.com/shop/api:3.2
    answer:
      checks:
        - id: pod
          label: A Pod named api in namespace shop
          path: metadata
          op: subset
          value: { name: api, namespace: shop }
        - id: image
          label: Container api runs registry.example.com/shop/api:3.2
          path: spec.containers[name=api].image
          op: equals
          value: registry.example.com/shop/api:3.2
        - id: secret
          label: Volume tls takes its data from the Secret api-tls
          path: spec.volumes[name=tls].secret.secretName
          op: equals
          value: api-tls
        - id: crt
          label: Key tls.crt is projected as server.crt
          path: spec.volumes[name=tls].secret.items
          op: contains
          value: { key: tls.crt, path: server.crt }
        - id: key
          label: Key tls.key is projected as server.key
          path: spec.volumes[name=tls].secret.items
          op: contains
          value: { key: tls.key, path: server.key }
        - id: only-two
          label: Only two keys are projected (ca.crt is left out)
          path: spec.volumes[name=tls].secret.items
          op: length
          value: 2
        - id: mount
          label: Volume tls is mounted at /etc/api/tls
          path: spec.containers[name=api].volumeMounts[name=tls].mountPath
          op: equals
          value: /etc/api/tls
        - id: no-subpath
          label: The mount uses no subPath, so Secret updates reach the files
          path: spec.containers[name=api].volumeMounts[name=tls].subPath
          op: absent
      solution:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: api
              namespace: shop
            spec:
              containers:
              - name: api
                image: registry.example.com/shop/api:3.2
                volumeMounts:
                - name: tls
                  mountPath: /etc/api/tls
                  readOnly: true
              volumes:
              - name: tls
                secret:
                  secretName: api-tls
                  items:
                  - key: tls.crt
                    path: server.crt
                  - key: tls.key
                    path: server.key
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              namespace: shop
              name: api
            spec:
              volumes:
              - name: tls
                secret:
                  secretName: api-tls
                  defaultMode: 0400
                  items:
                  - path: server.key
                    key: tls.key
                  - path: server.crt
                    key: tls.crt
              containers:
              - name: api
                image: registry.example.com/shop/api:3.2
                volumeMounts:
                - mountPath: /etc/api/tls
                  name: tls
      negatives:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: api
              namespace: shop
            spec:
              containers:
              - name: api
                image: registry.example.com/shop/api:3.2
                volumeMounts:
                - name: tls
                  mountPath: /etc/api/tls
              volumes:
              - name: tls
                secret:
                  name: api-tls
                  items:
                  - key: tls.crt
                    path: server.crt
                  - key: tls.key
                    path: server.key
          why: A secret volume names its Secret with secretName; name is the field of a configMap volume and is rejected here.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: api
              namespace: shop
            spec:
              containers:
              - name: api
                image: registry.example.com/shop/api:3.2
                volumeMounts:
                - name: tls
                  mountPath: /etc/api/tls/server.crt
                  subPath: tls.crt
                - name: tls
                  mountPath: /etc/api/tls/server.key
                  subPath: tls.key
              volumes:
              - name: tls
                secret:
                  secretName: api-tls
          why: Files mounted with subPath never receive Secret updates, so a rotated certificate would only appear after a Pod restart.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: api
              namespace: shop
            spec:
              containers:
              - name: api
                image: registry.example.com/shop/api:3.2
                volumeMounts:
                - name: tls
                  mountPath: /etc/api/tls
              volumes:
              - name: tls
                secret:
                  secretName: api-tls
          why: Without items, every key is projected under its own name (tls.crt, tls.key and ca.crt), so server.crt and server.key do not exist and ca.crt is exposed.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: api
              namespace: shop
            spec:
              containers:
              - name: api
                image: registry.example.com/shop/api:3.2
                volumeMounts:
                - name: tls
                  mountPath: /etc/api/tls
              volumes:
              - name: tls
                secret:
                  secretName: api-tls
                  items:
                  - key: server.crt
                    path: tls.crt
                  - key: server.key
                    path: tls.key
          why: key and path are swapped. key names an entry of the Secret (tls.crt); the Secret has no key server.crt, and a listed key that does not exist prevents the volume from being created.
    explanation:
      correct:
        en: "The `secret` volume names its Secret with `secretName`, and `items` both selects keys and renames them: only `tls.crt` and `tls.key` are projected, as `server.crt` and `server.key` under the mount path. Mounting the whole volume on `/etc/api/tls` lets the kubelet refresh the files when the Secret changes; a `subPath` mount would never be updated. Secret volumes are always read-only, so `readOnly: true` is optional."
    references:
      - title: Distribute Credentials Securely Using Secrets
        url: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/
      - title: Volume Types
        url: https://kubernetes.io/docs/reference/storage/volume-types/

  # ------------------------------------------------------------------ 8
  - id: ckad-qz-12-08
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        The cluster has a default StorageClass named `standard` that provisions volumes dynamically. Administrators create hostPath PersistentVolumes of class `manual` for several teams, and each team's claims must bind only to the volumes labelled for that team. Write two documents:

        1. a PersistentVolume named `pv-finance-01` with the label `team: finance`: `20Gi`, ReadWriteOnce, class `manual`, hostPath `/mnt/data/finance`;
        2. a PersistentVolumeClaim named `reports` in namespace `finance`: `8Gi`, ReadWriteOnce, that can bind to any volume of class `manual` labelled `team: finance`, and to no other volume.
    body:
      starter: ""
    answer:
      checks:
        - id: pv-label
          label: PersistentVolume pv-finance-01 has the label team=finance
          select: { kind: PersistentVolume, name: pv-finance-01 }
          path: metadata.labels.team
          op: equals
          value: finance
        - id: pv-class
          label: The PersistentVolume has class manual
          select: { kind: PersistentVolume, name: pv-finance-01 }
          path: spec.storageClassName
          op: equals
          value: manual
        - id: pv-size
          label: The PersistentVolume offers 20Gi
          select: { kind: PersistentVolume, name: pv-finance-01 }
          path: spec.capacity.storage
          op: quantity
          value: 20Gi
        - id: pv-mode
          label: The PersistentVolume offers ReadWriteOnce
          select: { kind: PersistentVolume, name: pv-finance-01 }
          path: spec.accessModes
          op: contains
          value: ReadWriteOnce
        - id: pv-path
          label: The PersistentVolume uses hostPath /mnt/data/finance
          select: { kind: PersistentVolume, name: pv-finance-01 }
          path: spec.hostPath.path
          op: equals
          value: /mnt/data/finance
        - id: pvc
          label: A PersistentVolumeClaim named reports in namespace finance
          select: { kind: PersistentVolumeClaim, name: reports }
          path: metadata
          op: subset
          value: { name: reports, namespace: finance }
        - id: pvc-class
          label: The claim requests class manual (not the default class)
          select: { kind: PersistentVolumeClaim, name: reports }
          path: spec.storageClassName
          op: equals
          value: manual
        - id: pvc-selector
          label: The claim selects volumes labelled team=finance
          select: { kind: PersistentVolumeClaim, name: reports }
          path: spec.selector
          op: matches
          value: '"matchLabels":\{[^}]*"team":"finance"|\{(?=[^}]*"key":"team")(?=[^}]*"operator":"In")(?=[^}]*"values":\["finance"\])'
        - id: pvc-mode
          label: The claim requests ReadWriteOnce
          select: { kind: PersistentVolumeClaim, name: reports }
          path: spec.accessModes
          op: contains
          value: ReadWriteOnce
        - id: pvc-size
          label: The claim requests 8Gi
          select: { kind: PersistentVolumeClaim, name: reports }
          path: spec.resources.requests.storage
          op: quantity
          value: 8Gi
      solution:
        - manifest: |
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: pv-finance-01
              labels:
                team: finance
            spec:
              storageClassName: manual
              capacity:
                storage: 20Gi
              accessModes:
              - ReadWriteOnce
              hostPath:
                path: /mnt/data/finance
            ---
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: reports
              namespace: finance
            spec:
              storageClassName: manual
              accessModes:
              - ReadWriteOnce
              selector:
                matchLabels:
                  team: finance
              resources:
                requests:
                  storage: 8Gi
        - manifest: |
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              namespace: finance
              name: reports
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: manual
              volumeMode: Filesystem
              resources:
                requests:
                  storage: 8Gi
              selector:
                matchExpressions:
                - key: team
                  operator: In
                  values: ["finance"]
            ---
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              labels:
                team: finance
              name: pv-finance-01
            spec:
              capacity:
                storage: 20Gi
              accessModes: ["ReadWriteOnce"]
              persistentVolumeReclaimPolicy: Retain
              storageClassName: manual
              hostPath:
                path: /mnt/data/finance
                type: DirectoryOrCreate
      negatives:
        - manifest: |
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: pv-finance-01
              labels:
                team: finance
            spec:
              storageClassName: manual
              capacity:
                storage: 20Gi
              accessModes:
              - ReadWriteOnce
              hostPath:
                path: /mnt/data/finance
            ---
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: reports
              namespace: finance
            spec:
              accessModes:
              - ReadWriteOnce
              selector:
                matchLabels:
                  team: finance
              resources:
                requests:
                  storage: 8Gi
          why: Without storageClassName the claim receives the default class standard, so it can never bind to a volume of class manual, and a claim with a selector cannot be provisioned dynamically either.
        - manifest: |
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: pv-finance-01
              labels:
                team: finance
            spec:
              storageClassName: manual
              capacity:
                storage: 20Gi
              accessModes:
              - ReadWriteOnce
              hostPath:
                path: /mnt/data/finance
            ---
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: reports
              namespace: finance
            spec:
              storageClassName: ""
              accessModes:
              - ReadWriteOnce
              selector:
                matchLabels:
                  team: finance
              resources:
                requests:
                  storage: 8Gi
          why: storageClassName "" asks for a volume with no class; pv-finance-01 has class manual and does not match.
        - manifest: |
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: pv-finance-01
              labels:
                team: finance
            spec:
              storageClassName: manual
              capacity:
                storage: 20Gi
              accessModes:
              - ReadWriteOnce
              hostPath:
                path: /mnt/data/finance
            ---
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: reports
              namespace: finance
            spec:
              storageClassName: manual
              accessModes:
              - ReadWriteOnce
              selector:
                team: finance
              resources:
                requests:
                  storage: 8Gi
          why: A label selector holds matchLabels or matchExpressions; a bare team key under selector is an unknown field and the claim is rejected.
        - manifest: |
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: pv-finance-01
            spec:
              storageClassName: manual
              capacity:
                storage: 20Gi
              accessModes:
              - ReadWriteOnce
              hostPath:
                path: /mnt/data/finance
            ---
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: reports
              namespace: finance
              labels:
                team: finance
            spec:
              storageClassName: manual
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 8Gi
          why: The label is on the claim instead of the volume, and the claim has no selector, so it can bind to any manual volume of another team.
    explanation:
      correct:
        en: "A claim binds only to a volume whose class, access modes and size match; `spec.selector` (with `matchLabels` or `matchExpressions`) further restricts it to volumes carrying the label. The claim must name the class `manual`: without `storageClassName` it receives the default class `standard`, and `\"\"` means no class. The `8Gi` claim gets the whole `20Gi` volume, and a claim with a selector is never provisioned dynamically."
    references:
      - title: Persistent Volumes
        url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/

  # ------------------------------------------------------------------ 9
  - id: ckad-qz-12-09
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        In namespace `shop`, write the manifest of a Pod named `orders` whose three containers start in this order:

        1. `mysql-tunnel` (`registry.example.com/mysql-tunnel:1.6`) opens a tunnel to the database and listens on port 3306. It must keep running for the whole life of the Pod.
        2. `schema-migrate` (`registry.example.com/orders-migrate:4.0`, `command: ["migrate", "--target", "latest"]`) connects through the tunnel on `127.0.0.1:3306`. It must start only once the tunnel accepts TCP connections on port 3306, and it runs once, to completion.
        3. `orders` (`registry.example.com/orders:4.0`), the only application container, starts after the migration has succeeded.
    body:
      starter: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: orders
          namespace: shop
        spec:
          containers:
          - name: orders
            image: registry.example.com/orders:4.0
    answer:
      checks:
        - id: pod
          label: A Pod named orders in namespace shop
          path: metadata
          op: subset
          value: { name: orders, namespace: shop }
        - id: first
          label: mysql-tunnel is the first init container
          path: spec.initContainers[0].name
          op: equals
          value: mysql-tunnel
        - id: second
          label: schema-migrate is the second init container
          path: spec.initContainers[1].name
          op: equals
          value: schema-migrate
        - id: sidecar
          label: mysql-tunnel is a native sidecar (restartPolicy Always)
          path: spec.initContainers[name=mysql-tunnel].restartPolicy
          op: equals
          value: Always
        - id: tunnel-image
          label: mysql-tunnel runs registry.example.com/mysql-tunnel:1.6
          path: spec.initContainers[name=mysql-tunnel].image
          op: equals
          value: registry.example.com/mysql-tunnel:1.6
        - id: startup
          label: A startup probe of mysql-tunnel checks port 3306
          path: spec.initContainers[name=mysql-tunnel].startupProbe
          op: matches
          value: '3306'
        - id: migrate-once
          label: schema-migrate is a regular init container (runs to completion)
          path: spec.initContainers[name=schema-migrate].restartPolicy
          op: absent
        - id: migrate-image
          label: schema-migrate runs registry.example.com/orders-migrate:4.0
          path: spec.initContainers[name=schema-migrate].image
          op: equals
          value: registry.example.com/orders-migrate:4.0
        - id: migrate-command
          label: schema-migrate runs migrate --target latest
          path: spec.initContainers[name=schema-migrate].command
          op: equals
          value: ["migrate", "--target", "latest"]
        - id: app
          label: orders runs registry.example.com/orders:4.0
          path: spec.containers[name=orders].image
          op: equals
          value: registry.example.com/orders:4.0
        - id: one-app
          label: orders is the only application container
          path: spec.containers
          op: length
          value: 1
      solution:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: orders
              namespace: shop
            spec:
              initContainers:
              - name: mysql-tunnel
                image: registry.example.com/mysql-tunnel:1.6
                restartPolicy: Always
                startupProbe:
                  tcpSocket:
                    port: 3306
                  periodSeconds: 2
                  failureThreshold: 30
              - name: schema-migrate
                image: registry.example.com/orders-migrate:4.0
                command: ["migrate", "--target", "latest"]
              containers:
              - name: orders
                image: registry.example.com/orders:4.0
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              namespace: shop
              name: orders
            spec:
              containers:
              - image: registry.example.com/orders:4.0
                name: orders
              initContainers:
              - image: registry.example.com/mysql-tunnel:1.6
                name: mysql-tunnel
                ports:
                - containerPort: 3306
                startupProbe:
                  tcpSocket:
                    port: 3306
                restartPolicy: Always
              - command:
                - migrate
                - --target
                - latest
                image: registry.example.com/orders-migrate:4.0
                name: schema-migrate
      negatives:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: orders
              namespace: shop
            spec:
              initContainers:
              - name: mysql-tunnel
                image: registry.example.com/mysql-tunnel:1.6
                restartPolicy: Always
                readinessProbe:
                  tcpSocket:
                    port: 3306
              - name: schema-migrate
                image: registry.example.com/orders-migrate:4.0
                command: ["migrate", "--target", "latest"]
              containers:
              - name: orders
                image: registry.example.com/orders:4.0
          why: The next init container waits for the sidecar's started status, which a startup probe controls; a readiness probe does not delay schema-migrate, which may start before the tunnel accepts connections.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: orders
              namespace: shop
            spec:
              initContainers:
              - name: schema-migrate
                image: registry.example.com/orders-migrate:4.0
                command: ["migrate", "--target", "latest"]
              containers:
              - name: orders
                image: registry.example.com/orders:4.0
              - name: mysql-tunnel
                image: registry.example.com/mysql-tunnel:1.6
                startupProbe:
                  tcpSocket:
                    port: 3306
          why: A tunnel in containers starts only after every init container has completed, so schema-migrate runs while no tunnel exists and never succeeds.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: orders
              namespace: shop
            spec:
              initContainers:
              - name: schema-migrate
                image: registry.example.com/orders-migrate:4.0
                command: ["migrate", "--target", "latest"]
              - name: mysql-tunnel
                image: registry.example.com/mysql-tunnel:1.6
                restartPolicy: Always
                startupProbe:
                  tcpSocket:
                    port: 3306
              containers:
              - name: orders
                image: registry.example.com/orders:4.0
          why: Init containers start in list order; with schema-migrate first, the tunnel is started only after the migration, which cannot connect.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: orders
              namespace: shop
            spec:
              initContainers:
              - name: mysql-tunnel
                image: registry.example.com/mysql-tunnel:1.6
                restartPolicy: Always
                startupProbe:
                  tcpSocket:
                    port: 3306
              - name: schema-migrate
                image: registry.example.com/orders-migrate:4.0
                command: ["migrate", "--target", "latest"]
                restartPolicy: Always
              containers:
              - name: orders
                image: registry.example.com/orders:4.0
          why: restartPolicy Always also turns schema-migrate into a sidecar; it is restarted after each exit and orders no longer waits for the migration to succeed.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: orders
              namespace: shop
            spec:
              initContainers:
              - name: mysql-tunnel
                image: registry.example.com/mysql-tunnel:1.6
                restartPolicy: Always
              - name: schema-migrate
                image: registry.example.com/orders-migrate:4.0
                command: ["migrate", "--target", "latest"]
              containers:
              - name: orders
                image: registry.example.com/orders:4.0
          why: Without a startup probe, the sidecar counts as started as soon as its process runs, so schema-migrate may start before port 3306 accepts connections.
    explanation:
      correct:
        en: "`mysql-tunnel` must be the first `initContainers` entry with `restartPolicy: Always`: a native sidecar that keeps running. The kubelet starts the next init container once the sidecar is started, which with a `startupProbe` (here `tcpSocket` on 3306) means once the probe succeeds; a readiness probe does not gate this. `schema-migrate` stays a regular init container, so `orders` starts only after it has exited successfully."
    references:
      - title: Sidecar Containers
        url: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
      - title: Init Containers
        url: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/

  # ------------------------------------------------------------------ 10
  - id: ckad-qz-12-10
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        The cluster has a default StorageClass named `standard`, and the namespace of your current context is `default`. The PersistentVolume `pv-photos` (file `pv-photos.yaml`) exists and is `Available`.

        A colleague wrote the claim and the Pod pre-filled in the editor. Applied with `kubectl apply -f`, the claim must bind to `pv-photos` and the Pod `gallery` in namespace `media` must start with the volume mounted at `/srv/photos`. Neither works.

        Fix the manifest. Keep the object names, the volume name, the image and the requested size, and do not change the PersistentVolume.
    body:
      starter: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: photos
        spec:
          accessModes:
          - ReadWriteMany
          volumeMode: Block
          resources:
            requests:
              storage: 8Gi
        ---
        apiVersion: v1
        kind: Pod
        metadata:
          name: gallery
          namespace: media
        spec:
          containers:
          - name: gallery
            image: registry.example.com/gallery:2.3
            volumeMounts:
            - name: photos
              mountPath: /srv/photos
          volumes:
          - name: photos
            persistentVolumeClaim:
              name: photos
      files:
        - name: pv-photos.yaml
          content: |
            apiVersion: v1
            kind: PersistentVolume
            metadata:
              name: pv-photos
            spec:
              storageClassName: manual
              capacity:
                storage: 10Gi
              accessModes:
              - ReadWriteOnce
              volumeMode: Filesystem
              hostPath:
                path: /mnt/data/photos
    answer:
      checks:
        - id: pvc
          label: The claim photos is in namespace media, with the Pod
          select: { kind: PersistentVolumeClaim, name: photos }
          path: metadata
          op: subset
          value: { name: photos, namespace: media }
        - id: pvc-class
          label: The claim requests class manual, the class of pv-photos
          select: { kind: PersistentVolumeClaim, name: photos }
          path: spec.storageClassName
          op: equals
          value: manual
        - id: pvc-modes
          label: The claim requests only ReadWriteOnce, the mode pv-photos offers
          select: { kind: PersistentVolumeClaim, name: photos }
          path: spec.accessModes
          op: equals
          value: ["ReadWriteOnce"]
        - id: pvc-volume-mode
          label: The claim asks for a filesystem volume, like pv-photos
          select: { kind: PersistentVolumeClaim, name: photos }
          path: spec
          op: matches
          value: '^(?!.*"volumeMode":"(?!Filesystem")).*$'
        - id: pvc-size
          label: The claim still requests 8Gi
          select: { kind: PersistentVolumeClaim, name: photos }
          path: spec.resources.requests.storage
          op: quantity
          value: 8Gi
        - id: pod
          label: Pod gallery is in namespace media
          select: { kind: Pod, name: gallery }
          path: metadata
          op: subset
          value: { name: gallery, namespace: media }
        - id: pod-image
          label: Container gallery runs registry.example.com/gallery:2.3
          select: { kind: Pod, name: gallery }
          path: spec.containers[name=gallery].image
          op: equals
          value: registry.example.com/gallery:2.3
        - id: claim-name
          label: Volume photos references the claim with claimName
          select: { kind: Pod, name: gallery }
          path: spec.volumes[name=photos].persistentVolumeClaim.claimName
          op: equals
          value: photos
        - id: mount
          label: Volume photos is mounted at /srv/photos
          select: { kind: Pod, name: gallery }
          path: spec.containers[name=gallery].volumeMounts[name=photos].mountPath
          op: equals
          value: /srv/photos
      solution:
        - manifest: |
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: photos
              namespace: media
            spec:
              storageClassName: manual
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 8Gi
            ---
            apiVersion: v1
            kind: Pod
            metadata:
              name: gallery
              namespace: media
            spec:
              containers:
              - name: gallery
                image: registry.example.com/gallery:2.3
                volumeMounts:
                - name: photos
                  mountPath: /srv/photos
              volumes:
              - name: photos
                persistentVolumeClaim:
                  claimName: photos
        - manifest: |
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: photos
              namespace: media
            spec:
              accessModes:
              - ReadWriteOnce
              volumeMode: Filesystem
              storageClassName: manual
              volumeName: pv-photos
              resources:
                requests:
                  storage: 8Gi
            ---
            apiVersion: v1
            kind: Pod
            metadata:
              name: gallery
              namespace: media
            spec:
              containers:
              - name: gallery
                image: registry.example.com/gallery:2.3
                volumeMounts:
                - name: photos
                  mountPath: /srv/photos
              volumes:
              - name: photos
                persistentVolumeClaim:
                  claimName: photos
      negatives:
        - manifest: |
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: photos
            spec:
              storageClassName: manual
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 8Gi
            ---
            apiVersion: v1
            kind: Pod
            metadata:
              name: gallery
              namespace: media
            spec:
              containers:
              - name: gallery
                image: registry.example.com/gallery:2.3
                volumeMounts:
                - name: photos
                  mountPath: /srv/photos
              volumes:
              - name: photos
                persistentVolumeClaim:
                  claimName: photos
          why: Without a namespace the claim is created in the context namespace, default; a Pod can only use a claim of its own namespace, media.
        - manifest: |
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: photos
              namespace: media
            spec:
              storageClassName: ""
              volumeName: pv-photos
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 8Gi
            ---
            apiVersion: v1
            kind: Pod
            metadata:
              name: gallery
              namespace: media
            spec:
              containers:
              - name: gallery
                image: registry.example.com/gallery:2.3
                volumeMounts:
                - name: photos
                  mountPath: /srv/photos
              volumes:
              - name: photos
                persistentVolumeClaim:
                  claimName: photos
          why: storageClassName "" asks for a volume with no class, but pv-photos has class manual; even with volumeName the class must match, so the claim stays Pending.
        - manifest: |
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: photos
              namespace: media
            spec:
              storageClassName: manual
              accessModes:
              - ReadWriteOnce
              - ReadWriteMany
              resources:
                requests:
                  storage: 8Gi
            ---
            apiVersion: v1
            kind: Pod
            metadata:
              name: gallery
              namespace: media
            spec:
              containers:
              - name: gallery
                image: registry.example.com/gallery:2.3
                volumeMounts:
                - name: photos
                  mountPath: /srv/photos
              volumes:
              - name: photos
                persistentVolumeClaim:
                  claimName: photos
          why: The volume must offer every access mode the claim lists; pv-photos offers only ReadWriteOnce, so a claim that also asks for ReadWriteMany does not bind.
        - manifest: |
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: photos
              namespace: media
            spec:
              storageClassName: manual
              accessModes:
              - ReadWriteOnce
              volumeMode: Block
              resources:
                requests:
                  storage: 8Gi
            ---
            apiVersion: v1
            kind: Pod
            metadata:
              name: gallery
              namespace: media
            spec:
              containers:
              - name: gallery
                image: registry.example.com/gallery:2.3
                volumeMounts:
                - name: photos
                  mountPath: /srv/photos
              volumes:
              - name: photos
                persistentVolumeClaim:
                  claimName: photos
          why: volumeMode Block does not match the Filesystem volume pv-photos, and a block claim would need volumeDevices, not volumeMounts.
        - manifest: |
            apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: photos
              namespace: media
            spec:
              storageClassName: manual
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 8Gi
            ---
            apiVersion: v1
            kind: Pod
            metadata:
              name: gallery
              namespace: media
            spec:
              containers:
              - name: gallery
                image: registry.example.com/gallery:2.3
                volumeMounts:
                - name: photos
                  mountPath: /srv/photos
              volumes:
              - name: photos
                persistentVolumeClaim:
                  name: photos
          why: A persistentVolumeClaim volume references its claim with claimName; name is an unknown field there and claimName is required, so the Pod is rejected.
    explanation:
      correct:
        en: "The starter has five errors. The claim needs `namespace: media`, because a Pod can only use a claim of its own namespace, and `storageClassName: manual`, because without it the claim receives the default class `standard` and never matches `pv-photos`. Its access modes and volume mode must be offered by the volume (`ReadWriteOnce` only, `Filesystem`, the default), and the Pod volume must reference the claim with `claimName`."
    references:
      - title: Persistent Volumes
        url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
