                    configMapKeyRef:
                      name: invoicer-config
                      key: smtp_host
                - name: SMTP_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: invoicer-config
                      key: SMTP_PORT
                - name: SMTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: invoicer-smtp-secret
                      key: user
                - name: SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: invoicer-smtp-secret
                      key: password
    answer:
      checks:
        - id: deployment
          label: Deployment invoicer in namespace billing
          path: metadata
          op: subset
          value: { name: invoicer, namespace: billing }
        - id: kind
          label: The fix is made in the Deployment (the owner), not in a Pod
          path: kind
          op: equals
          value: Deployment
        - id: image
          label: Image unchanged
          path: spec.template.spec.containers[name=invoicer].image
          op: equals
          value: registry.example.com/billing/invoicer:3.4
        - id: host
          label: SMTP_HOST reads key SMTP_HOST of ConfigMap invoicer-config
          path: spec.template.spec.containers[name=invoicer].env[name=SMTP_HOST].valueFrom.configMapKeyRef
          op: subset
          value: { name: invoicer-config, key: SMTP_HOST }
        - id: port
          label: SMTP_PORT still reads key SMTP_PORT of ConfigMap invoicer-config
          path: spec.template.spec.containers[name=invoicer].env[name=SMTP_PORT].valueFrom.configMapKeyRef
          op: subset
          value: { name: invoicer-config, key: SMTP_PORT }
        - id: user
          label: SMTP_USER reads key username of Secret invoicer-smtp
          path: spec.template.spec.containers[name=invoicer].env[name=SMTP_USER].valueFrom.secretKeyRef
          op: subset
          value: { name: invoicer-smtp, key: username }
        - id: password
          label: SMTP_PASSWORD reads key password of Secret invoicer-smtp
          path: spec.template.spec.containers[name=invoicer].env[name=SMTP_PASSWORD].valueFrom.secretKeyRef
          op: subset
          value: { name: invoicer-smtp, key: password }
        - id: not-optional
          label: No reference is marked optional (that would hide the error with an empty variable)
          path: spec.template.spec.containers[name=invoicer].env
          op: matches
          value: '^(?!.*"optional":true)'
        - id: labels
          label: Template labels still match the selector (app=invoicer)
          path: spec.template.metadata.labels.app
          op: equals
          value: invoicer
