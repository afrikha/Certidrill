    explanation:
      correct:
        en: '`CreateContainerConfigError` means a referenced ConfigMap, Secret or key is missing. The kubelet reports only the first bad reference, so compare every reference with the objects: the ConfigMap key is `SMTP_HOST`, not `smtp_host`; the Secret is `invoicer-smtp`, not `invoicer-smtp-secret`; and its keys are `username` and `password`. Fix the Deployment, whose template recreates the Pods; `optional: true` would only hide the error and leave the variable unset.'
