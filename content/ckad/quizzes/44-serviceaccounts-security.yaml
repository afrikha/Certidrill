chapter: 44-serviceaccounts-security
questions:
  # ------------------------------------------------------------------ 1
  - id: ckad-qz-44-01
    objective: "4.7.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |-
        Namespace `shop` contains two ServiceAccounts, `default` and `api-sa`. A developer applies this manifest:

        ```yaml
        apiVersion: v1
        kind: Pod
        metadata:
          name: web
          namespace: shop
        spec:
          containers:
          - name: web
            image: nginx:1.27
        ```

        Which ServiceAccount does Pod `web` run with?
    body:
      options:
        - { id: a, text: { en: "The ServiceAccount `default` of namespace `default`" } }
        - { id: b, text: { en: "The ServiceAccount `default` of namespace `shop`" } }
        - { id: c, text: { en: "None: its API requests are sent as the anonymous user" } }
        - { id: d, text: { en: "The ServiceAccount `api-sa`, the only one a user created in `shop`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |-
          Every namespace has a ServiceAccount named `default`, and a Pod that sets no `serviceAccountName` gets the `default` ServiceAccount of its own namespace. The API server writes it into `spec.serviceAccountName`, so `kubectl get pod web -n shop -o yaml` shows `serviceAccountName: default`.
      options:
        a: { en: "ServiceAccounts are namespaced and a Pod uses one of its own namespace; the `default` of namespace `default` is never used by a Pod in `shop`." }
        c: { en: "A Pod always has a ServiceAccount identity; without `serviceAccountName` it gets `default`, not an anonymous identity." }
        d: { en: "Kubernetes never picks a ServiceAccount by name or by who created it; `api-sa` is used only when the Pod names it in `spec.serviceAccountName`." }
    references:
      - title: Configure Service Accounts for Pods
        url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
      - title: Service Accounts
        url: https://kubernetes.io/docs/concepts/security/service-accounts/

  # ------------------------------------------------------------------ 2
  - id: ckad-qz-44-02
    objective: "4.8.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |-
        Which of these fields can be set only in the Pod-level `spec.securityContext`, and not in the `securityContext` of a container?
    body:
      options:
        - { id: a, text: "`runAsGroup`" }
        - { id: b, text: "`readOnlyRootFilesystem`" }
        - { id: c, text: "`fsGroup`" }
        - { id: d, text: "`runAsNonRoot`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |-
          `fsGroup` belongs to the PodSecurityContext only: it is a supplemental group of every container of the Pod, and the kubelet makes the volumes that support ownership management owned by that group. Because it acts on the Pod's volumes, it has no container-level equivalent.
      options:
        a: { en: "`runAsGroup` exists at both levels; a container value overrides the Pod value." }
        b: { en: "`readOnlyRootFilesystem` is the opposite case: it exists only in the container `securityContext`." }
        d: { en: "`runAsNonRoot` exists at both levels; the container value takes precedence when both are set." }
    references:
      - title: Configure a Security Context for a Pod or Container
        url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/

  # ------------------------------------------------------------------ 3
  - id: ckad-qz-44-03
    objective: "4.7.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |-
        A release script runs `kubectl create token api-sa -n shop` and passes the printed token to a CI system. Later, an auditor runs `kubectl get secrets -n shop` and finds no Secret that holds this token.

        Which statement explains what the auditor sees?
    body:
      options:
        - { id: a, text: { en: "The API server issued the token through the TokenRequest API and returned it to kubectl; no object stores it" } }
        - { id: b, text: { en: "The token is kept in a Secret of type `kubernetes.io/service-account-token` that is deleted when the token is printed" } }
        - { id: c, text: { en: "kubectl read the token from the Secret created with `api-sa`, which `kubectl get secrets` hides because of its type" } }
        - { id: d, text: { en: "The token was written into the `kube-api-access-` projected volume of the Pods that run with `api-sa`" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |-
          `kubectl create token` calls the TokenRequest API: the API server signs a short-lived token for the ServiceAccount and returns it, and kubectl prints it. Nothing is written to the cluster, and since v1.24 creating a ServiceAccount no longer creates a token Secret either, so there is nothing to list.
      options:
        b: { en: "No Secret is created at any point: a `kubernetes.io/service-account-token` Secret exists only if someone creates it explicitly for a long-lived token." }
        c: { en: "Since v1.24 no token Secret is generated when a ServiceAccount is created, and `kubectl get secrets` lists Secrets of every type." }
        d: { en: "The `kube-api-access-` volume holds a separate token that the kubelet requests for each Pod; `kubectl create token` does not touch running Pods." }
    references:
      - title: kubectl create token
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_token/
      - title: Service Accounts
        url: https://kubernetes.io/docs/concepts/security/service-accounts/

  # ------------------------------------------------------------------ 4
  - id: ckad-qz-44-04
    objective: "4.8.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |-
        Namespace `payments` has the label `pod-security.kubernetes.io/enforce: restricted`. A Pod manifest sets `runAsNonRoot: true` and `runAsUser: 10001` at Pod level, and `allowPrivilegeEscalation: false` and `capabilities.drop: ["ALL"]` on its only container. It sets no seccomp profile, and the API server rejects it for that reason only.

        A seccomp profile file `profiles/payments.json` is present in the kubelet seccomp directory of every node. Which two Pod-level `seccompProfile` settings would each let the Pod be admitted? (Choose two.)
    body:
      choose: 2
      options:
        - { id: a, text: "`type: Unconfined`" }
        - { id: b, text: "`type: RuntimeDefault`" }
        - { id: c, text: "`type: runtime/default`" }
        - { id: d, text: "`type: Localhost` with `localhostProfile: profiles/payments.json`" }
        - { id: e, text: "`type: Localhost` with no `localhostProfile`" }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |-
          The restricted profile requires the seccomp profile to be set explicitly to `RuntimeDefault` or `Localhost`; leaving it unset or choosing `Unconfined` is refused. `RuntimeDefault` uses the container runtime's default filter, and `Localhost` loads a profile file whose path, given in `localhostProfile`, is relative to the kubelet's seccomp directory.
      options:
        a: { en: "`Unconfined` disables seccomp filtering; and the restricted profile explicitly forbids it." }
        c: { en: "`runtime/default` was the value of the removed seccomp annotations; the `type` field is an enum and only accepts `RuntimeDefault`, `Localhost` or `Unconfined`." }
        e: { en: "With `type: Localhost`, `localhostProfile` is required; the API server rejects the profile without it." }
    references:
      - title: Pod Security Standards
        url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
      - title: Configure a Security Context for a Pod or Container
        url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/

  # ------------------------------------------------------------------ 5
  - id: ckad-qz-44-05
    objective: "4.8.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |-
        Pod `worker` in namespace `jobs` runs the image `registry.example.com/jobs/worker:2.0`, whose Dockerfile has no `USER` instruction, so its processes run as root by default. The manifest sets `runAsNonRoot: true` in `spec.securityContext` and sets `runAsUser` nowhere.

        What happens when the Pod is created, and which change makes it run while keeping the guard?
    body:
      options:
        - { id: a, text: { en: "The API server rejects the Pod; replace `runAsNonRoot: true` with `runAsUser: 1000`" } }
        - { id: b, text: { en: "The container starts as root with a warning event; add `allowPrivilegeEscalation: false` to enforce the guard" } }
        - { id: c, text: { en: "The kubelet starts the container as user 65534 (nobody); no change is needed" } }
        - { id: d, text: { en: "The kubelet does not start the container (`CreateContainerConfigError`); add a non-zero `runAsUser`, such as 1000" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |-
          `runAsNonRoot: true` does not choose a user: it makes the kubelet check, when it starts the container, that the process would not run as UID 0, and fail the start if it would. With a root image and no `runAsUser`, the container stays in `CreateContainerConfigError`. Setting a numeric non-zero `runAsUser` (Pod or container level) passes the check and keeps the guard.
      options:
        a: { en: "The check is done by the kubelet at container start, not by the API server at creation; removing `runAsNonRoot` also drops the guard the task keeps." }
        b: { en: "`runAsNonRoot: true` is enforced, not advisory; `allowPrivilegeEscalation` controls `no_new_privs`, not the user the process starts as." }
        c: { en: "Kubernetes never picks a user on its own: without `runAsUser` the image's user is used, and here it is root, so the check fails." }
    references:
      - title: Pod
        url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/
      - title: Configure a Security Context for a Pod or Container
        url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/

  # ------------------------------------------------------------------ 6
  - id: ckad-qz-44-06
    objective: "4.7.2"
    difficulty: 3
    status: draft
    type: command
    stem:
      en: |-
        A publishing job runs outside the cluster with the identity of the ServiceAccount `publisher` of namespace `ci`. It sends the same token to two services:

        - the cluster's API server, which accepts tokens issued for the audience `https://kubernetes.default.svc.cluster.local`;
        - the artifact registry, which accepts only tokens issued for the audience `https://registry.example.com`.

        Request a token for `publisher` that both services accept, valid for 45 minutes, and print it. The namespace of your context is `default`.

        Type the single command you would run.
    body:
      mode: invocation
      namespace: default
    answer:
      checks:
        - id: verb
          label: Uses kubectl create token
          path: subverb
          op: equals
          value: token
        - id: create
          label: It is a create command
          path: verb
          op: equals
          value: create
        - id: name
          label: Requests a token for ServiceAccount publisher
          path: names
          op: contains
          value: publisher
        - id: namespace
          label: Targets namespace ci
          path: flags.namespace
          op: equals
          value: ci
        - id: aud-api
          label: The token is issued for the API server audience
          path: flags.audience
          op: contains
          value: https://kubernetes.default.svc.cluster.local
        - id: aud-registry
          label: The token is issued for the registry audience
          path: flags.audience
          op: contains
          value: https://registry.example.com
        - id: duration
          label: Requests a lifetime of 45 minutes
          path: flags.duration
          op: oneOf
          value: ["45m", "2700s", "45m0s", "0.75h"]
      solution:
        - command: kubectl create token publisher -n ci --audience=https://kubernetes.default.svc.cluster.local --audience=https://registry.example.com --duration=45m
        - command: k -n ci create token publisher --duration 2700s --audience https://registry.example.com --audience https://kubernetes.default.svc.cluster.local
      negatives:
        - command: kubectl create token publisher -n ci --audience=https://registry.example.com --duration=45m
          why: Once --audience is set, the token carries only the listed audiences; the API server audience is no longer in it, so the API server rejects the token.
        - command: kubectl create token publisher -n ci --duration=45m
          why: Without --audience the token is issued for the API server only, and the registry rejects it.
        - command: kubectl create token ci:publisher --audience=https://kubernetes.default.svc.cluster.local --audience=https://registry.example.com --duration=45m
          why: The positional argument is the bare ServiceAccount name; the namespace goes in -n. Here kubectl looks for a ServiceAccount named "ci:publisher" in namespace default.
    explanation:
      correct:
        en: |-
          `kubectl create token publisher -n ci` asks the TokenRequest API for a token of the ServiceAccount. Without `--audience` the token is for the API server; as soon as `--audience` is given, only the listed audiences are in the token, so the flag is repeated with the API server audience and the registry audience. `--duration=45m` (or `2700s`) requests the lifetime, which the server may adjust.
    references:
      - title: kubectl create token
        url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_token/

  # ------------------------------------------------------------------ 7
  - id: ckad-qz-44-07
    objective: "4.7.1"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        In namespace `finance`, write one file with two objects:

        - a ServiceAccount `reporter`. A Deployment that calls the Kubernetes API will run with it later, so do **not** set `automountServiceAccountToken` on the ServiceAccount;
        - a CronJob `monthly-report` with the schedule `0 6 1 * *`. Its Pods run with the ServiceAccount `reporter`, have one container `report` with image `registry.example.com/finance/report:2.4`, use `restartPolicy: OnFailure`, and must not get an API token mounted, because the report never calls the API.
    body:
      starter: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: reporter
        ---
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: monthly-report
        spec:
          schedule: "0 6 1 * *"
    answer:
      checks:
        - id: sa-ns
          label: ServiceAccount reporter is in namespace finance
          select: { kind: ServiceAccount, name: reporter }
          path: metadata.namespace
          op: equals
          value: finance
        - id: sa-automount
          label: The ServiceAccount does not set automountServiceAccountToken
          select: { kind: ServiceAccount, name: reporter }
          path: automountServiceAccountToken
          op: absent
        - id: cj-ns
          label: CronJob monthly-report is in namespace finance
          select: { kind: CronJob, name: monthly-report }
          path: metadata.namespace
          op: equals
          value: finance
        - id: cj-api
          label: The CronJob uses apiVersion batch/v1
          select: { kind: CronJob, name: monthly-report }
          path: apiVersion
          op: equals
          value: batch/v1
        - id: schedule
          label: The schedule is 0 6 1 * *
          select: { kind: CronJob, name: monthly-report }
          path: spec.schedule
          op: equals
          value: "0 6 1 * *"
        - id: pod-sa
          label: The Pod template runs with ServiceAccount reporter
          select: { kind: CronJob, name: monthly-report }
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          op: equals
          value: reporter
        - id: pod-automount
          label: The Pod template disables token automounting
          select: { kind: CronJob, name: monthly-report }
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          op: equals
          value: false
        - id: restart
          label: The Pod template uses restartPolicy OnFailure
          select: { kind: CronJob, name: monthly-report }
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          op: equals
          value: OnFailure
        - id: image
          label: Container report runs registry.example.com/finance/report:2.4
          select: { kind: CronJob, name: monthly-report }
          path: spec.jobTemplate.spec.template.spec.containers[name=report].image
          op: equals
          value: registry.example.com/finance/report:2.4
      solution:
        - manifest: |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: reporter
              namespace: finance
            ---
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: monthly-report
              namespace: finance
            spec:
              schedule: "0 6 1 * *"
              jobTemplate:
                spec:
                  template:
                    spec:
                      serviceAccountName: reporter
                      automountServiceAccountToken: false
                      restartPolicy: OnFailure
                      containers:
                      - name: report
                        image: registry.example.com/finance/report:2.4
        - manifest: |
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              namespace: finance
              name: monthly-report
            spec:
              jobTemplate:
                spec:
                  template:
                    spec:
                      containers:
                      - image: registry.example.com/finance/report:2.4
                        name: report
                      restartPolicy: OnFailure
                      automountServiceAccountToken: false
                      serviceAccountName: reporter
              schedule: 0 6 1 * *
            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              namespace: finance
              name: reporter
      negatives:
        - manifest: |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: reporter
              namespace: finance
            ---
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: monthly-report
              namespace: finance
            spec:
              schedule: "0 6 1 * *"
              jobTemplate:
                spec:
                  serviceAccountName: reporter
                  automountServiceAccountToken: false
                  template:
                    spec:
                      restartPolicy: OnFailure
                      containers:
                      - name: report
                        image: registry.example.com/finance/report:2.4
          why: serviceAccountName and automountServiceAccountToken are Pod spec fields; under the Job spec they are unknown fields (strict validation rejects them) and the Pods would run as default with a token.
        - manifest: |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: reporter
              namespace: finance
            automountServiceAccountToken: false
            ---
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: monthly-report
              namespace: finance
            spec:
              schedule: "0 6 1 * *"
              jobTemplate:
                spec:
                  template:
                    spec:
                      serviceAccountName: reporter
                      restartPolicy: OnFailure
                      containers:
                      - name: report
                        image: registry.example.com/finance/report:2.4
          why: Disabling automounting on the ServiceAccount also removes the token from the future Deployment that needs it; the setting belongs in the Pod template of the CronJob.
        - manifest: |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: reporter
              namespace: finance
            ---
            apiVersion: batch/v1beta1
            kind: CronJob
            metadata:
              name: monthly-report
              namespace: finance
            spec:
              schedule: "0 6 1 * *"
              jobTemplate:
                spec:
                  template:
                    spec:
                      serviceAccountName: reporter
                      automountServiceAccountToken: false
                      restartPolicy: OnFailure
                      containers:
                      - name: report
                        image: registry.example.com/finance/report:2.4
          why: batch/v1beta1 CronJob was removed in Kubernetes v1.25; the API server no longer serves it.
        - manifest: |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: reporter
              namespace: finance
            ---
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: monthly-report
              namespace: finance
            spec:
              schedule: "0 6 1 * *"
              jobTemplate:
                spec:
                  template:
                    spec:
                      serviceAccountName: reporter
                      restartPolicy: OnFailure
                      containers:
                      - name: report
                        image: registry.example.com/finance/report:2.4
                        automountServiceAccountToken: false
          why: automountServiceAccountToken is a Pod spec field, not a container field; the Pods still get the token.
    explanation:
      correct:
        en: |-
          A CronJob nests three specs: CronJob `spec`, then `jobTemplate.spec` (the Job), then `template.spec` (the Pod). `serviceAccountName`, `automountServiceAccountToken` and `restartPolicy` are Pod spec fields, so they go under `spec.jobTemplate.spec.template.spec`. Setting `automountServiceAccountToken: false` there removes the token from the report Pods only, while other Pods of `reporter` keep the default; both objects need `namespace: finance` because a Pod can only use a ServiceAccount of its own namespace.
    references:
      - title: Configure Service Accounts for Pods
        url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
      - title: CronJob
        url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/

  # ------------------------------------------------------------------ 8
  - id: ckad-qz-44-08
    objective: "4.8.1"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        `kubectl apply` fails for Pod `catalog` in namespace `store`: the API server reports unknown fields in its security settings. The manifest is pre-filled in the editor.

        Fix it so that the API server accepts it and its author's intent is met:

        - every process of both containers runs as user ID `1000` (keep this setting once, at Pod level);
        - both containers have a read-only root filesystem, and their processes cannot gain more privileges than their parent process;
        - the `uploads` volume, and the files created in it, belong to group ID `2000`.

        Do not change the images, the volume or the mounts.
    body:
      starter: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: catalog
          namespace: store
        spec:
          securityContext:
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumes:
          - name: uploads
            emptyDir: {}
          containers:
          - name: catalog
            image: registry.example.com/store/catalog:3.2
            securityContext:
              fsGroup: 2000
            volumeMounts:
            - name: uploads
              mountPath: /uploads
          - name: thumbnailer
            image: registry.example.com/store/thumbnailer:1.0
            volumeMounts:
            - name: uploads
              mountPath: /uploads
    answer:
      checks:
        - id: pod
          label: The Pod catalog in namespace store
          path: metadata
          op: subset
          value: { name: catalog, namespace: store }
        - id: pod-user
          label: Pod-level runAsUser is 1000
          path: spec.securityContext.runAsUser
          op: equals
          value: 1000
        - id: pod-fsgroup
          label: Pod-level fsGroup is 2000
          path: spec.securityContext.fsGroup
          op: equals
          value: 2000
        - id: pod-no-rorf
          label: readOnlyRootFilesystem is no longer in the Pod securityContext
          path: spec.securityContext.readOnlyRootFilesystem
          op: absent
        - id: pod-no-ape
          label: allowPrivilegeEscalation is no longer in the Pod securityContext
          path: spec.securityContext.allowPrivilegeEscalation
          op: absent
        - id: catalog-rorf
          label: Container catalog has a read-only root filesystem
          path: spec.containers[name=catalog].securityContext.readOnlyRootFilesystem
          op: equals
          value: true
        - id: catalog-ape
          label: Container catalog sets allowPrivilegeEscalation to false
          path: spec.containers[name=catalog].securityContext.allowPrivilegeEscalation
          op: equals
          value: false
        - id: catalog-no-fsgroup
          label: fsGroup is no longer in the container securityContext
          path: spec.containers[name=catalog].securityContext.fsGroup
          op: absent
        - id: thumb-rorf
          label: Container thumbnailer has a read-only root filesystem
          path: spec.containers[name=thumbnailer].securityContext.readOnlyRootFilesystem
          op: equals
          value: true
        - id: thumb-ape
          label: Container thumbnailer sets allowPrivilegeEscalation to false
          path: spec.containers[name=thumbnailer].securityContext.allowPrivilegeEscalation
          op: equals
          value: false
        - id: volume
          label: Volume uploads is still an emptyDir
          path: spec.volumes[name=uploads].emptyDir
          op: exists
        - id: catalog-mount
          label: Container catalog still mounts uploads at /uploads
          path: spec.containers[name=catalog].volumeMounts[name=uploads].mountPath
          op: equals
          value: /uploads
        - id: thumb-mount
          label: Container thumbnailer still mounts uploads at /uploads
          path: spec.containers[name=thumbnailer].volumeMounts[name=uploads].mountPath
          op: equals
          value: /uploads
      solution:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: catalog
              namespace: store
            spec:
              securityContext:
                runAsUser: 1000
                fsGroup: 2000
              volumes:
              - name: uploads
                emptyDir: {}
              containers:
              - name: catalog
                image: registry.example.com/store/catalog:3.2
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
              - name: thumbnailer
                image: registry.example.com/store/thumbnailer:1.0
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
      negatives:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: catalog
              namespace: store
            spec:
              securityContext:
                runAsUser: 1000
                fsGroup: 2000
              volumes:
              - name: uploads
                emptyDir: {}
              containers:
              - name: catalog
                image: registry.example.com/store/catalog:3.2
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
              - name: thumbnailer
                image: registry.example.com/store/thumbnailer:1.0
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
          why: readOnlyRootFilesystem and allowPrivilegeEscalation are per-container fields with no Pod-level value to inherit; thumbnailer keeps a writable root filesystem and can escalate privileges.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: catalog
              namespace: store
            spec:
              securityContext:
                runAsUser: 1000
                fsGroup: 2000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              volumes:
              - name: uploads
                emptyDir: {}
              containers:
              - name: catalog
                image: registry.example.com/store/catalog:3.2
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
              - name: thumbnailer
                image: registry.example.com/store/thumbnailer:1.0
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
          why: Only fsGroup is fixed; readOnlyRootFilesystem and allowPrivilegeEscalation are still unknown fields of the Pod securityContext, so apply still fails.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: catalog
              namespace: store
            spec:
              securityContext:
                runAsUser: 1000
                runAsGroup: 2000
              volumes:
              - name: uploads
                emptyDir: {}
              containers:
              - name: catalog
                image: registry.example.com/store/catalog:3.2
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
              - name: thumbnailer
                image: registry.example.com/store/thumbnailer:1.0
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
          why: runAsGroup changes the primary group of the processes; only fsGroup makes the kubelet give the volume itself to group 2000.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: catalog
              namespace: store
            spec:
              securityContext:
                runAsUser: 1000
                fsGroup: 2000
              volumes:
              - name: uploads
                emptyDir: {}
              containers:
              - name: catalog
                image: registry.example.com/store/catalog:3.2
                securityContext:
                  readOnlyRootFilesystem: true
                  privileged: false
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
              - name: thumbnailer
                image: registry.example.com/store/thumbnailer:1.0
                securityContext:
                  readOnlyRootFilesystem: true
                  privileged: false
                volumeMounts:
                - name: uploads
                  mountPath: /uploads
          why: privileged false is already the default and does not set no_new_privs; without allowPrivilegeEscalation false (default true) a setuid binary can still raise privileges.
    explanation:
      correct:
        en: |-
          The author put the fields at the wrong levels. `fsGroup` exists only in the Pod securityContext, so it moves up next to `runAsUser`; `readOnlyRootFilesystem` and `allowPrivilegeEscalation` exist only in a container securityContext, so they move down and must be repeated in **each** container, since a container field has no Pod-level value to inherit. The emptyDir mounted at `/uploads` stays writable even with read-only root filesystems.
    references:
      - title: Configure a Security Context for a Pod or Container
        url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
      - title: Pod
        url: https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/

  # ------------------------------------------------------------------ 9
  - id: ckad-qz-44-09
    objective: "4.7.2"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        In namespace `accounts`, write the manifest of a Pod `ledger-api` that runs with the existing ServiceAccount `ledger`. The ServiceAccount is shared with other teams and must not be changed. The Pod has two containers:

        - `app`, image `registry.example.com/accounts/ledger:4.2`, which never calls the Kubernetes API and must not have any ServiceAccount token in its filesystem;
        - `api-proxy`, image `registry.example.com/tools/api-proxy:1.6`, which calls the API server (it already trusts the cluster CA). It reads a token issued for the API server, valid for 2 hours, from the file `/var/run/secrets/tokens/api-token`, and must keep receiving the token that the kubelet rotates.

        Name the volume `api-token`.
    body:
      starter: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: ledger-api
          namespace: accounts
        spec:
          serviceAccountName: ledger
          containers:
          - name: app
            image: registry.example.com/accounts/ledger:4.2
          - name: api-proxy
            image: registry.example.com/tools/api-proxy:1.6
    answer:
      checks:
        - id: pod
          label: A Pod named ledger-api in namespace accounts
          path: metadata
          op: subset
          value: { name: ledger-api, namespace: accounts }
        - id: sa
          label: The Pod runs with ServiceAccount ledger
          path: spec.serviceAccountName
          op: equals
          value: ledger
        - id: no-automount
          label: The Pod disables the automatic API token
          path: spec.automountServiceAccountToken
          op: equals
          value: false
        - id: token-path
          label: The projected token file is named api-token in the volume
          path: spec.volumes[name=api-token].projected.sources
          op: contains
          value: { serviceAccountToken: { path: api-token } }
        - id: token-ttl
          label: The projected token is valid for 7200 seconds
          path: spec.volumes[name=api-token].projected.sources
          op: contains
          value: { serviceAccountToken: { expirationSeconds: 7200 } }
        - id: proxy-mount
          label: Container api-proxy mounts the volume at /var/run/secrets/tokens
          path: spec.containers[name=api-proxy].volumeMounts[name=api-token].mountPath
          op: oneOf
          value: [/var/run/secrets/tokens, /var/run/secrets/tokens/]
        - id: proxy-no-subpath
          label: The token volume is not mounted with subPath, so rotated tokens reach api-proxy
          path: spec.containers[name=api-proxy].volumeMounts[name=api-token].subPath
          op: absent
        - id: app-no-mount
          label: Container app does not mount the token volume
          path: spec.containers[name=app].volumeMounts[name=api-token]
          op: absent
        - id: app-image
          label: Container app runs registry.example.com/accounts/ledger:4.2
          path: spec.containers[name=app].image
          op: equals
          value: registry.example.com/accounts/ledger:4.2
        - id: proxy-image
          label: Container api-proxy runs registry.example.com/tools/api-proxy:1.6
          path: spec.containers[name=api-proxy].image
          op: equals
          value: registry.example.com/tools/api-proxy:1.6
      solution:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: ledger-api
              namespace: accounts
            spec:
              serviceAccountName: ledger
              automountServiceAccountToken: false
              containers:
              - name: app
                image: registry.example.com/accounts/ledger:4.2
              - name: api-proxy
                image: registry.example.com/tools/api-proxy:1.6
                volumeMounts:
                - name: api-token
                  mountPath: /var/run/secrets/tokens
                  readOnly: true
              volumes:
              - name: api-token
                projected:
                  sources:
                  - serviceAccountToken:
                      path: api-token
                      expirationSeconds: 7200
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: ledger-api
              namespace: accounts
            spec:
              automountServiceAccountToken: false
              serviceAccountName: ledger
              volumes:
              - name: api-token
                projected:
                  sources:
                  - serviceAccountToken:
                      expirationSeconds: 7200
                      path: api-token
              containers:
              - name: api-proxy
                image: registry.example.com/tools/api-proxy:1.6
                volumeMounts:
                - mountPath: /var/run/secrets/tokens/
                  name: api-token
              - name: app
                image: registry.example.com/accounts/ledger:4.2
      negatives:
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: ledger-api
              namespace: accounts
            spec:
              serviceAccountName: ledger
              containers:
              - name: app
                image: registry.example.com/accounts/ledger:4.2
              - name: api-proxy
                image: registry.example.com/tools/api-proxy:1.6
                volumeMounts:
                - name: api-token
                  mountPath: /var/run/secrets/tokens
              volumes:
              - name: api-token
                projected:
                  sources:
                  - serviceAccountToken:
                      path: api-token
                      expirationSeconds: 7200
          why: Without automountServiceAccountToken false the control plane still mounts the kube-api-access volume in every container, app included, at /var/run/secrets/kubernetes.io/serviceaccount.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: ledger-api
              namespace: accounts
            spec:
              serviceAccountName: ledger
              automountServiceAccountToken: false
              containers:
              - name: app
                image: registry.example.com/accounts/ledger:4.2
                volumeMounts:
                - name: api-token
                  mountPath: /var/run/secrets/tokens
              - name: api-proxy
                image: registry.example.com/tools/api-proxy:1.6
                volumeMounts:
                - name: api-token
                  mountPath: /var/run/secrets/tokens
              volumes:
              - name: api-token
                projected:
                  sources:
                  - serviceAccountToken:
                      path: api-token
                      expirationSeconds: 7200
          why: A volume is visible only in the containers that mount it; mounting api-token in app as well puts the token in its filesystem.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: ledger-api
              namespace: accounts
            spec:
              serviceAccountName: ledger
              automountServiceAccountToken: false
              containers:
              - name: app
                image: registry.example.com/accounts/ledger:4.2
              - name: api-proxy
                image: registry.example.com/tools/api-proxy:1.6
                volumeMounts:
                - name: api-token
                  mountPath: /var/run/secrets/tokens/api-token
                  subPath: api-token
              volumes:
              - name: api-token
                projected:
                  sources:
                  - serviceAccountToken:
                      path: api-token
                      expirationSeconds: 7200
          why: The file is at the right path, but a container that mounts a projected source with subPath does not receive updates; api-proxy keeps the first token and fails once it expires.
        - manifest: |
            apiVersion: v1
            kind: Pod
            metadata:
              name: ledger-api
              namespace: accounts
            spec:
              serviceAccountName: ledger
              automountServiceAccountToken: false
              containers:
              - name: app
                image: registry.example.com/accounts/ledger:4.2
              - name: api-proxy
                image: registry.example.com/tools/api-proxy:1.6
                volumeMounts:
                - name: api-token
                  mountPath: /var/run/secrets/tokens
              volumes:
              - name: api-token
                projected:
                  sources:
                  - serviceAccountToken:
                      path: api-token
                      expirationSeconds: 120
          why: expirationSeconds is in seconds; 120 is below the 600-second minimum and is rejected. Two hours is 7200.
    explanation:
      correct:
        en: |-
          `automountServiceAccountToken` is a Pod-level switch, so `false` in the Pod spec removes the automatic token from both containers without touching the shared ServiceAccount. The token for `api-proxy` then comes from a `projected` volume with a `serviceAccountToken` source (no `audience`, so the API server is the audience; `expirationSeconds: 7200`; `path: api-token`), mounted only in `api-proxy` at `/var/run/secrets/tokens`. A plain directory mount is required: a `subPath` mount of a projected source does not receive the rotated token.
    references:
      - title: Projected Volumes
        url: https://kubernetes.io/docs/concepts/storage/projected-volumes/
      - title: Configure Service Accounts for Pods
        url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/

  # ------------------------------------------------------------------ 10
  - id: ckad-qz-44-10
    objective: "4.8.2"
    difficulty: 3
    status: draft
    type: manifest
    stem:
      en: |-
        Namespace `payments` has the label `pod-security.kubernetes.io/enforce: restricted`. The Deployment `checkout` below creates no Pods: its ReplicaSet shows `FailedCreate` events that cite the restricted profile. All three images run as root unless told otherwise. The manifest is pre-filled in the editor.

        Fix the Deployment:

        - every container, including the init container, must comply with the restricted profile;
        - set the non-root guard and the user ID `10001` once, at Pod level, for all containers;
        - `checkout` must keep the one Linux capability that lets a non-root process bind port 443; no other container keeps or gets any added capability;
        - keep the seccomp setting, the images and the ports.
    body:
      starter: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: checkout
          namespace: payments
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: checkout
          template:
            metadata:
              labels:
                app: checkout
            spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              initContainers:
              - name: migrate
                image: registry.example.com/payments/migrate:1.3
              containers:
              - name: checkout
                image: registry.example.com/payments/checkout:8.0
                ports:
                - containerPort: 443
                securityContext:
                  allowPrivilegeEscalation: false
              - name: metrics
                image: registry.example.com/tools/metrics-agent:0.9
                securityContext:
                  capabilities:
                    add: ["NET_RAW"]
    answer:
      checks:
        - id: deploy
          label: The Deployment checkout in namespace payments
          path: metadata
          op: subset
          value: { name: checkout, namespace: payments }
        - id: non-root
          label: Pod-level runAsNonRoot is true
          path: spec.template.spec.securityContext.runAsNonRoot
          op: equals
          value: true
        - id: user
          label: Pod-level runAsUser is 10001
          path: spec.template.spec.securityContext.runAsUser
          op: equals
          value: 10001
        - id: seccomp
          label: Pod-level seccomp profile is still RuntimeDefault
          path: spec.template.spec.securityContext.seccompProfile.type
          op: equals
          value: RuntimeDefault
        - id: init-ape
          label: Init container migrate sets allowPrivilegeEscalation to false
          path: spec.template.spec.initContainers[name=migrate].securityContext.allowPrivilegeEscalation
          op: equals
          value: false
        - id: init-drop
          label: Init container migrate drops ALL capabilities
          path: spec.template.spec.initContainers[name=migrate].securityContext.capabilities.drop
          op: contains
          value: ALL
        - id: checkout-ape
          label: Container checkout sets allowPrivilegeEscalation to false
          path: spec.template.spec.containers[name=checkout].securityContext.allowPrivilegeEscalation
          op: equals
          value: false
        - id: checkout-drop
          label: Container checkout drops ALL capabilities
          path: spec.template.spec.containers[name=checkout].securityContext.capabilities.drop
          op: contains
          value: ALL
        - id: checkout-add
          label: Container checkout adds NET_BIND_SERVICE
          path: spec.template.spec.containers[name=checkout].securityContext.capabilities.add
          op: contains
          value: NET_BIND_SERVICE
        - id: checkout-add-only
          label: Container checkout adds no other capability
          path: spec.template.spec.containers[name=checkout].securityContext.capabilities.add
          op: length
          value: 1
        - id: metrics-ape
          label: Container metrics sets allowPrivilegeEscalation to false
          path: spec.template.spec.containers[name=metrics].securityContext.allowPrivilegeEscalation
          op: equals
          value: false
        - id: metrics-drop
          label: Container metrics drops ALL capabilities
          path: spec.template.spec.containers[name=metrics].securityContext.capabilities.drop
          op: contains
          value: ALL
        - id: metrics-no-add
          label: Container metrics adds no capability
          path: spec.template.spec.containers[name=metrics].securityContext.capabilities
          op: matches
          value: '^(?!.*"add":\[")'
        - id: images
          label: Container checkout keeps its image
          path: spec.template.spec.containers[name=checkout].image
          op: equals
          value: registry.example.com/payments/checkout:8.0
      solution:
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: checkout
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: checkout
              template:
                metadata:
                  labels:
                    app: checkout
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10001
                    seccompProfile:
                      type: RuntimeDefault
                  initContainers:
                  - name: migrate
                    image: registry.example.com/payments/migrate:1.3
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                  containers:
                  - name: checkout
                    image: registry.example.com/payments/checkout:8.0
                    ports:
                    - containerPort: 443
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                        add: ["NET_BIND_SERVICE"]
                  - name: metrics
                    image: registry.example.com/tools/metrics-agent:0.9
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: checkout
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: checkout
              template:
                metadata:
                  labels:
                    app: checkout
                spec:
                  securityContext:
                    seccompProfile:
                      type: RuntimeDefault
                    runAsUser: 10001
                    runAsNonRoot: true
                  initContainers:
                  - name: migrate
                    image: registry.example.com/payments/migrate:1.3
                    securityContext:
                      capabilities:
                        drop:
                        - ALL
                      allowPrivilegeEscalation: false
                  containers:
                  - name: metrics
                    image: registry.example.com/tools/metrics-agent:0.9
                    securityContext:
                      capabilities:
                        drop:
                        - ALL
                        add: []
                      allowPrivilegeEscalation: false
                  - name: checkout
                    image: registry.example.com/payments/checkout:8.0
                    ports:
                    - containerPort: 443
                    securityContext:
                      capabilities:
                        add:
                        - NET_BIND_SERVICE
                        drop:
                        - ALL
                      allowPrivilegeEscalation: false
      negatives:
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: checkout
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: checkout
              template:
                metadata:
                  labels:
                    app: checkout
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10001
                    seccompProfile:
                      type: RuntimeDefault
                  initContainers:
                  - name: migrate
                    image: registry.example.com/payments/migrate:1.3
                  containers:
                  - name: checkout
                    image: registry.example.com/payments/checkout:8.0
                    ports:
                    - containerPort: 443
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                        add: ["NET_BIND_SERVICE"]
                  - name: metrics
                    image: registry.example.com/tools/metrics-agent:0.9
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
          why: The restricted profile checks initContainers too; migrate still lacks allowPrivilegeEscalation false and drop ALL, so the ReplicaSet still cannot create Pods.
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: checkout
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: checkout
              template:
                metadata:
                  labels:
                    app: checkout
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10001
                    seccompProfile:
                      type: RuntimeDefault
                  initContainers:
                  - name: migrate
                    image: registry.example.com/payments/migrate:1.3
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                  containers:
                  - name: checkout
                    image: registry.example.com/payments/checkout:8.0
                    ports:
                    - containerPort: 443
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                        add: ["CAP_NET_BIND_SERVICE"]
                  - name: metrics
                    image: registry.example.com/tools/metrics-agent:0.9
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
          why: Capability names in a manifest omit the CAP_ prefix; restricted allows only NET_BIND_SERVICE in add, so CAP_NET_BIND_SERVICE is refused.
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: checkout
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: checkout
              template:
                metadata:
                  labels:
                    app: checkout
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10001
                    seccompProfile:
                      type: RuntimeDefault
                  initContainers:
                  - name: migrate
                    image: registry.example.com/payments/migrate:1.3
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                  containers:
                  - name: checkout
                    image: registry.example.com/payments/checkout:8.0
                    ports:
                    - containerPort: 443
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                        add: ["NET_BIND_SERVICE"]
                  - name: metrics
                    image: registry.example.com/tools/metrics-agent:0.9
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                        add: ["NET_RAW"]
          why: Restricted allows no added capability other than NET_BIND_SERVICE; NET_RAW on metrics still gets the Pods rejected, and the task removes it.
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: checkout
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: checkout
              template:
                metadata:
                  labels:
                    app: checkout
                spec:
                  securityContext:
                    runAsNonRoot: true
                    seccompProfile:
                      type: RuntimeDefault
                  initContainers:
                  - name: migrate
                    image: registry.example.com/payments/migrate:1.3
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                  containers:
                  - name: checkout
                    image: registry.example.com/payments/checkout:8.0
                    ports:
                    - containerPort: 443
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                        add: ["NET_BIND_SERVICE"]
                  - name: metrics
                    image: registry.example.com/tools/metrics-agent:0.9
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
          why: The Pods are admitted, but the images run as root and no runAsUser is set, so the kubelet refuses to start the containers (CreateContainerConfigError).
        - manifest: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: checkout
              namespace: payments
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: checkout
              template:
                metadata:
                  labels:
                    app: checkout
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 10001
                    seccompProfile:
                      type: RuntimeDefault
                    capabilities:
                      drop: ["ALL"]
                  initContainers:
                  - name: migrate
                    image: registry.example.com/payments/migrate:1.3
                    securityContext:
                      allowPrivilegeEscalation: false
                  containers:
                  - name: checkout
                    image: registry.example.com/payments/checkout:8.0
                    ports:
                    - containerPort: 443
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        add: ["NET_BIND_SERVICE"]
                  - name: metrics
                    image: registry.example.com/tools/metrics-agent:0.9
                    securityContext:
                      allowPrivilegeEscalation: false
          why: capabilities is a container field; the Pod securityContext has none, so the API server refuses the unknown field and no container drops ALL.
    explanation:
      correct:
        en: |-
          The restricted profile checks `containers` and `initContainers` alike: each needs `allowPrivilegeEscalation: false` and a `capabilities.drop` list containing `ALL`, and `add` may contain only `NET_BIND_SERVICE` (written without `CAP_`), which `checkout` keeps for port 443. `runAsNonRoot: true` with a non-zero `runAsUser: 10001` at Pod level covers every container, and the existing `RuntimeDefault` seccomp profile already satisfies the seccomp rule. Without `runAsUser`, the root images would pass admission but fail to start.
    references:
      - title: Pod Security Standards
        url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
      - title: Configure a Security Context for a Pod or Container
        url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
