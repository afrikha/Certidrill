# CKAD objectives — Certified Kubernetes Application Developer.
# Source: Linux Foundation certification page
# (https://training.linuxfoundation.org/certification/certified-kubernetes-application-developer-ckad/,
# read on 2026-11-27): 5 domains, 23 competencies, exam based on Kubernetes v1.37. Groups below are the
# competencies, titles verbatim, in the page's order.
# WRITTEN OBJECTIVES: the page lists competency names only. Every objective below is OUR wording,
# 3–5 per competency, stating the tasks a candidate performs for it on a v1.37 cluster with kubectl
# (kubernetes.io/docs tasks and concepts, helm.sh/docs, kubectl reference). They are hands-on: each one
# is practised by command and manifest exercises (docs/SPECS-KUBERNETES-PRATIQUE.md).
# Codes <domain order>.<group>.<n>; English only (the exam is not offered in French).
design:
- group:
    en: Define, build and modify container images
  objectives:
  - code: 1.1.1
    en: Write and modify a Dockerfile or Containerfile (base image, COPY, RUN, ENV, EXPOSE, USER, ENTRYPOINT and CMD, multi-stage builds)
  - code: 1.1.2
    en: Build, tag, save, load and push images with Docker or Podman, and reference an image by tag or digest
  - code: 1.1.3
    en: Run an image in a Pod and override its entrypoint and arguments with command and args, and choose an imagePullPolicy
  - code: 1.1.4
    en: Pull images from a private registry with an imagePullSecret
- group:
    en: Choose and use the right workload resource (Deployment, DaemonSet, CronJob, etc.)
  objectives:
  - code: 1.2.1
    en: Create Pods and Deployments imperatively and declaratively, and generate manifests with kubectl --dry-run=client -o yaml
  - code: 1.2.2
    en: Choose between Deployment, StatefulSet, DaemonSet, Job and CronJob for a workload
  - code: 1.2.3
    en: Create and tune Jobs (completions, parallelism, backoffLimit, activeDeadlineSeconds, ttlSecondsAfterFinished, restartPolicy)
  - code: 1.2.4
    en: Create and tune CronJobs (schedule, timeZone, concurrencyPolicy, suspend, successful and failed history limits, startingDeadlineSeconds) and start a Job from a CronJob
- group:
    en: Understand multi-container Pod design patterns (e.g. sidecar, init and others)
  objectives:
  - code: 1.3.1
    en: Add init containers that must complete before the application containers start
  - code: 1.3.2
    en: Add native sidecar containers (init containers with restartPolicy Always) and classic helper containers that share volumes or the network namespace
  - code: 1.3.3
    en: Recognize the sidecar, ambassador and adapter patterns and target one container with kubectl logs, exec and debug
- group:
    en: Utilize persistent and ephemeral volumes
  objectives:
  - code: 1.4.1
    en: Mount ephemeral volumes (emptyDir, including medium Memory and sizeLimit, configMap, secret, downwardAPI, projected) into containers with mountPath, subPath and readOnly
  - code: 1.4.2
    en: Request persistent storage with a PersistentVolumeClaim (storageClassName, accessModes, volumeMode, resources.requests.storage) and mount it in a Pod
  - code: 1.4.3
    en: Create a PersistentVolume (hostPath for practice) and bind a claim to it, and interpret claim and volume status
deployment:
- group:
    en: Use Kubernetes primitives to implement common deployment strategies (e.g. blue/green or canary)
  objectives:
  - code: 2.1.1
    en: Implement a blue/green deployment with two Deployments and a Service whose selector is switched
  - code: 2.1.2
    en: Implement a canary with two Deployments behind one Service, splitting traffic by replica counts
  - code: 2.1.3
    en: Use labels and selectors to route traffic between versions and roll back a strategy
- group:
    en: Understand Deployments and how to perform rolling updates
  objectives:
  - code: 2.2.1
    en: Change a Deployment's image or template and follow the rollout (set image, rollout status, history, change-cause annotation)
  - code: 2.2.2
    en: Configure the update strategy (RollingUpdate maxSurge and maxUnavailable, Recreate, minReadySeconds, progressDeadlineSeconds, revisionHistoryLimit)
  - code: 2.2.3
    en: Pause, resume, restart and roll back a Deployment (rollout pause, resume, restart, undo --to-revision)
  - code: 2.2.4
    en: Scale a Deployment manually and with a HorizontalPodAutoscaler
- group:
    en: Use the Helm package manager to deploy existing packages
  objectives:
  - code: 2.3.1
    en: Add and update chart repositories, search them and show a chart's values
  - code: 2.3.2
    en: Install and upgrade a release in a namespace with --set and values files, and preview it with template or --dry-run
  - code: 2.3.3
    en: List, inspect, roll back and uninstall releases (list, status, get values, history, rollback, uninstall)
- group:
    en: Kustomize
  objectives:
  - code: 2.4.1
    en: Write a kustomization.yaml (resources, namespace, namePrefix, labels, images, replicas) and render or apply it with kubectl kustomize and kubectl apply -k
  - code: 2.4.2
    en: Generate ConfigMaps and Secrets with configMapGenerator and secretGenerator
  - code: 2.4.3
    en: Create overlays that patch a base (patches with strategic merge or JSON 6902)
observability:
- group:
    en: Understand API deprecations
  objectives:
  - code: 3.1.1
    en: Find the served API versions and resources of a cluster (kubectl api-versions, api-resources, explain)
  - code: 3.1.2
    en: Recognize removed or deprecated apiVersions and update manifests to the current version
- group:
    en: Implement probes and health checks
  objectives:
  - code: 3.2.1
    en: Add liveness, readiness and startup probes with httpGet, tcpSocket, grpc and exec handlers
  - code: 3.2.2
    en: Tune probe timing (initialDelaySeconds, periodSeconds, timeoutSeconds, failureThreshold, successThreshold) and predict the effect of a failing probe
- group:
    en: Use provided tools to monitor Kubernetes applications
  objectives:
  - code: 3.3.1
    en: Inspect resource usage with kubectl top for Pods, containers and nodes, sorted and filtered
  - code: 3.3.2
    en: Inspect objects and their state with get (wide, labels, selectors, field selectors, custom columns, JSONPath), describe and events
- group:
    en: Utilize container logs
  objectives:
  - code: 3.4.1
    en: Read container logs (kubectl logs with -c, --all-containers, -f, --previous, --since, --tail, -l selectors, deployment/name)
  - code: 3.4.2
    en: Save logs and command output to a file for a task and relate logs to restarts
- group:
    en: Debugging in Kubernetes
  objectives:
  - code: 3.5.1
    en: Diagnose Pods that are Pending, CrashLoopBackOff, ImagePullBackOff, OOMKilled or not Ready from status, describe and events
  - code: 3.5.2
    en: Run commands in containers and debug with kubectl exec, kubectl debug (ephemeral container, copy of a Pod), port-forward and a temporary Pod
  - code: 3.5.3
    en: Fix a broken workload (wrong image, command, port, selector, probe, mount or resource) by editing or replacing it
environment:
- group:
    en: Discover and use resources that extend Kubernetes (CRD, Operators)
  objectives:
  - code: 4.1.1
    en: List and inspect CustomResourceDefinitions and the custom resources they define (api-resources, explain, get)
  - code: 4.1.2
    en: Create a custom resource for an installed CRD or Operator, and recognize what an Operator does
- group:
    en: Understand authentication, authorization and admission control
  objectives:
  - code: 4.2.1
    en: Read and switch kubeconfig contexts and namespaces (config get-contexts, use-context, set-context --current --namespace)
  - code: 4.2.2
    en: Grant an application or user access with Role and RoleBinding (create role, create rolebinding) and test it with kubectl auth can-i --as
  - code: 4.2.3
    en: Recognize admission control effects (Pod Security Admission labels on a namespace, ResourceQuota and LimitRange rejections)
- group:
    en: Understand requests, limits, quotas
  objectives:
  - code: 4.3.1
    en: Create a ResourceQuota for compute resources and object counts in a namespace, and read its usage
  - code: 4.3.2
    en: Create a LimitRange with default requests and limits and min and max constraints, and predict its effect on new Pods
- group:
    en: Understand ConfigMaps
  objectives:
  - code: 4.4.1
    en: Create ConfigMaps from literals, files and env files
  - code: 4.4.2
    en: Consume a ConfigMap as environment variables (env valueFrom, envFrom) and as a mounted volume, including selected keys
- group:
    en: Define resource requirements
  objectives:
  - code: 4.5.1
    en: Set CPU and memory requests and limits on containers (kubectl set resources or the manifest), with quantity units
  - code: 4.5.2
    en: Predict scheduling and runtime effects of requests and limits (Pending, OOMKilled, CPU throttling, QoS classes)
- group:
    en: Create & consume Secrets
  objectives:
  - code: 4.6.1
    en: Create generic, TLS and docker-registry Secrets
  - code: 4.6.2
    en: Consume a Secret as environment variables and as a mounted volume, and decode a Secret value
- group:
    en: Understand ServiceAccounts
  objectives:
  - code: 4.7.1
    en: Create a ServiceAccount and run a Pod or Deployment with it (serviceAccountName, kubectl set serviceaccount)
  - code: 4.7.2
    en: Control API token mounting (automountServiceAccountToken) and request a short-lived token with kubectl create token
- group:
    en: Understand Application Security (SecurityContexts, Capabilities, etc.)
  objectives:
  - code: 4.8.1
    en: Set Pod and container securityContext fields (runAsUser, runAsGroup, fsGroup, runAsNonRoot, readOnlyRootFilesystem, allowPrivilegeEscalation)
  - code: 4.8.2
    en: Add and drop Linux capabilities and set a seccomp profile
networking:
- group:
    en: Demonstrate basic understanding of NetworkPolicies
  objectives:
  - code: 5.1.1
    en: Write NetworkPolicies that allow ingress from selected Pods, namespaces and IP blocks on given ports
  - code: 5.1.2
    en: Write default-deny and egress policies (including DNS egress) and predict which traffic a set of policies allows
- group:
    en: Provide and troubleshoot access to applications via services
  objectives:
  - code: 5.2.1
    en: Expose workloads with ClusterIP, NodePort and LoadBalancer Services (kubectl expose, create service, manifest) with port, targetPort and named ports
  - code: 5.2.2
    en: Troubleshoot a Service that has no endpoints or the wrong port (selectors, labels, EndpointSlices, readiness) and test it from a temporary Pod
- group:
    en: Use Ingress rules to expose applications
  objectives:
  - code: 5.3.1
    en: Create Ingress resources with host and path rules, pathType, ingressClassName and a default backend (kubectl create ingress or manifest)
  - code: 5.3.2
    en: Add TLS to an Ingress with a TLS Secret and troubleshoot an Ingress that does not route
