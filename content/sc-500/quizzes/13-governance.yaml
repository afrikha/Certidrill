chapter: 13-governance
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-13-01
    objective: "1.3.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan to protect Azure resources against accidental deletion by using resource locks.

        At which scope are resource locks not supported?
      fr: |
        Vous prévoyez de protéger des ressources Azure contre la suppression accidentelle à l'aide de verrous de ressources.

        À quelle étendue les verrous de ressources ne sont-ils pas pris en charge ?
    body:
      options:
        - { id: a, text: { en: "A subscription", fr: "Un abonnement" } }
        - { id: b, text: { en: "A resource group", fr: "Un groupe de ressources" } }
        - { id: c, text: { en: "A management group", fr: "Un groupe d'administration" } }
        - { id: d, text: { en: "A single storage account", fr: "Un compte de stockage précis" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Locks can be applied to a subscription, a resource group or an individual resource, and they're inherited by the child scopes. Management groups can't receive a lock. To protect resources across several subscriptions, apply a lock to each subscription, or use a control such as a `denyAction` policy assigned to the management group.
        fr: |
          Les verrous peuvent être posés sur un abonnement, un groupe de ressources ou une ressource précise, et ils sont hérités par les étendues enfants. Un groupe d'administration ne peut pas recevoir de verrou. Pour protéger des ressources dans plusieurs abonnements, posez un verrou sur chaque abonnement ou utilisez un contrôle comme une stratégie `denyAction` attribuée au groupe d'administration.
      options:
        a: { en: "A subscription supports locks, and the lock applies to every resource group and resource it contains.", fr: "Un abonnement prend en charge les verrous, et le verrou s'applique à tous les groupes de ressources et à toutes les ressources qu'il contient." }
        b: { en: "A resource group supports locks, which its resources inherit.", fr: "Un groupe de ressources prend en charge les verrous, dont ses ressources héritent." }
        d: { en: "An individual resource such as a storage account supports locks.", fr: "Une ressource précise comme un compte de stockage prend en charge les verrous." }
    references:
      - title: Lock your Azure resources to protect your infrastructure
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-13-02
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are writing a custom Azure Policy definition for production Azure Cosmos DB accounts. Users must still be able to create and update the accounts, but any request to remove a matching account must be blocked.

        Which effect should the definition use?
      fr: |
        Vous rédigez une définition Azure Policy personnalisée pour les comptes Azure Cosmos DB de production. Les utilisateurs doivent toujours pouvoir créer et mettre à jour les comptes, mais toute demande de retrait d'un compte ciblé doit être bloquée.

        Quel effet la définition doit-elle utiliser ?
    body:
      options:
        - { id: a, text: "`deny`" }
        - { id: b, text: "`denyAction`" }
        - { id: c, text: "`auditIfNotExists`" }
        - { id: d, text: "`modify`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The `denyAction` effect blocks a listed action, currently only `delete`, on the resources that match the rule, and returns a 403 error. It doesn't evaluate create or update requests, so the accounts can still be created and changed.
        fr: |
          L'effet `denyAction` bloque une action listée, actuellement uniquement `delete`, sur les ressources qui correspondent à la règle, et renvoie une erreur 403. Il n'évalue pas les demandes de création ou de mise à jour : les comptes peuvent donc toujours être créés et modifiés.
      options:
        a: { en: "`deny` refuses create and update requests of matching resources; it doesn't block their deletion.", fr: "`deny` refuse les demandes de création et de mise à jour des ressources ciblées ; il ne bloque pas leur suppression." }
        c: { en: "`auditIfNotExists` only reports a missing related resource; it blocks nothing.", fr: "`auditIfNotExists` signale seulement une ressource associée manquante ; il ne bloque rien." }
        d: { en: "`modify` changes properties or tags of the request; it can't block an operation.", fr: "`modify` modifie des propriétés ou des étiquettes de la demande ; il ne peut pas bloquer une opération." }
    references:
      - title: Azure Policy definitions denyAction effect
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deny-action

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-13-03
    objective: "1.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has 12 Azure subscriptions organized under several management groups. A user named **Admin1** holds the **Global Administrator** role in Microsoft Entra ID and has no Azure role assignment.

        To fix a broken access configuration, Admin1 turns on **Access management for Azure resources** in the properties of Microsoft Entra ID, then signs in again.

        Which Azure role assignment does Admin1 now have?
      fr: |
        Wingtip Toys dispose de 12 abonnements Azure organisés sous plusieurs groupes d'administration. Un utilisateur nommé **Admin1** détient le rôle **Global Administrator** dans Microsoft Entra ID et n'a aucune attribution de rôle Azure.

        Pour corriger une configuration d'accès défaillante, Admin1 active **Access management for Azure resources** (gestion de l'accès pour les ressources Azure) dans les propriétés de Microsoft Entra ID, puis se reconnecte.

        De quelle attribution de rôle Azure Admin1 dispose-t-il maintenant ?
    body:
      options:
        - { id: a, text: { en: "Owner at the scope of the Tenant Root Group management group", fr: "Owner à l'étendue du groupe d'administration Groupe racine du locataire" } }
        - { id: b, text: { en: "User Access Administrator at the root scope (/)", fr: "User Access Administrator à l'étendue racine (/)" } }
        - { id: c, text: { en: "Role Based Access Control Administrator on each of the 12 subscriptions", fr: "Role Based Access Control Administrator sur chacun des 12 abonnements" } }
        - { id: d, text: { en: "User Access Administrator on each of the 12 subscriptions", fr: "User Access Administrator sur chacun des 12 abonnements" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Elevating access assigns the User Access Administrator role at the root scope (`/`), which covers every management group and subscription of the tenant. Admin1 can then assign roles anywhere. Microsoft recommends turning the setting off again once the change is done, because the elevated assignment is a standing privileged access.
        fr: |
          L'élévation d'accès attribue le rôle User Access Administrator à l'étendue racine (`/`), qui couvre tous les groupes d'administration et tous les abonnements du locataire. Admin1 peut alors attribuer des rôles partout. Microsoft recommande de désactiver à nouveau le paramètre une fois la modification faite, car l'attribution élevée est un accès privilégié permanent.
      options:
        a: { en: "Elevation doesn't grant Owner, and it isn't assigned at the Tenant Root Group but at the root scope above it.", fr: "L'élévation n'accorde pas Owner, et l'attribution ne se fait pas au Groupe racine du locataire mais à l'étendue racine au-dessus de lui." }
        c: { en: "Role Based Access Control Administrator isn't the role that elevation assigns, and no per-subscription assignment is created.", fr: "Role Based Access Control Administrator n'est pas le rôle attribué par l'élévation, et aucune attribution par abonnement n'est créée." }
        d: { en: "The role is right, but elevation creates a single assignment at the root scope, not one per subscription.", fr: "Le rôle est le bon, mais l'élévation crée une seule attribution à l'étendue racine, pas une par abonnement." }
    references:
      - title: Elevate access to manage all Azure subscriptions and management groups
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-13-04
    objective: "1.3.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. deploys its production network from a Bicep file to a resource group named **rg-prod** by using a pipeline. Before each deployment, a security reviewer must see which resources the deployment would create, modify or delete, and which properties would change. The review step must not change any resource.

        Which Azure CLI command should the pipeline run before the deployment?
      fr: |
        Proseware, Inc. déploie son réseau de production à partir d'un fichier Bicep dans un groupe de ressources nommé **rg-prod** à l'aide d'un pipeline. Avant chaque déploiement, un réviseur de sécurité doit voir quelles ressources le déploiement créerait, modifierait ou supprimerait, et quelles propriétés changeraient. L'étape de revue ne doit modifier aucune ressource.

        Quelle commande Azure CLI le pipeline doit-il exécuter avant le déploiement ?
    body:
      options:
        - { id: a, text: "`az deployment group validate`" }
        - { id: b, text: "`az group export`" }
        - { id: c, text: "`az stack group create`" }
        - { id: d, text: "`az deployment group what-if`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The what-if operation predicts the changes a Bicep file would make if it were deployed (Create, Delete, Modify, NoChange...) and lists the property changes, without modifying any resource. `az deployment group what-if` runs it at the resource group scope; `--confirm-with-what-if` on the create command shows the same preview and asks for confirmation.
        fr: |
          L'opération what-if prévoit les modifications qu'un fichier Bicep apporterait s'il était déployé (Create, Delete, Modify, NoChange...) et liste les modifications de propriétés, sans modifier aucune ressource. `az deployment group what-if` l'exécute à l'étendue d'un groupe de ressources ; `--confirm-with-what-if` sur la commande de création affiche le même aperçu et demande une confirmation.
      options:
        a: { en: "`validate` checks that the template would be accepted by Azure Resource Manager, but it doesn't list the changes to the resources.", fr: "`validate` vérifie que le modèle serait accepté par Azure Resource Manager, mais ne liste pas les modifications des ressources." }
        b: { en: "`az group export` produces a template of the resources that already exist; it doesn't compare them with the Bicep file.", fr: "`az group export` produit un modèle des ressources existantes ; il ne les compare pas au fichier Bicep." }
        c: { en: "`az stack group create` deploys the file as a deployment stack: it changes the resources instead of previewing the changes.", fr: "`az stack group create` déploie le fichier sous forme de pile de déploiement : il modifie les ressources au lieu d'afficher un aperçu des modifications." }
    references:
      - title: "Bicep What-If: Preview Changes Before Deployment"
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-13-05
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has the **PCI DSS** standard assigned to a subscription named **Sub-Card** in Microsoft Defender for Cloud. Defender CSPM is enabled.

        External auditors ask for the compliance certificates that Microsoft obtained for the Azure services themselves, so that they can evaluate the part of the controls that Microsoft operates. You need to provide these documents from Defender for Cloud.

        What should you use on the **Regulatory compliance** dashboard?
      fr: |
        Fabrikam, Inc. a attribué la norme **PCI DSS** à un abonnement nommé **Sub-Card** dans Microsoft Defender for Cloud. Defender CSPM est activé.

        Des auditeurs externes demandent les certificats de conformité que Microsoft a obtenus pour les services Azure eux-mêmes, afin d'évaluer la partie des contrôles que Microsoft exploite. Vous devez fournir ces documents depuis Defender for Cloud.

        Que devez-vous utiliser dans le tableau de bord **Regulatory compliance** (conformité réglementaire) ?
    body:
      options:
        - { id: a, text: { en: "The Download report option, for the PCI DSS standard", fr: "L'option Download report, pour la norme PCI DSS" } }
        - { id: b, text: { en: "The Audit reports option, on the PCI tab", fr: "L'option Audit reports, dans l'onglet PCI" } }
        - { id: c, text: { en: "The Manual attestation and evidence section of the standard", fr: "La section Manual attestation and evidence de la norme" } }
        - { id: d, text: { en: "A continuous export of the regulatory compliance data", fr: "Une exportation continue des données de conformité réglementaire" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          **Audit reports** lets you download the Azure certification reports that Microsoft obtained (grouped in tabs such as PCI, SOC and ISO), with the collateral needed to present them. They cover what Microsoft operates, which complements the assessment of your own resources.
        fr: |
          **Audit reports** permet de télécharger les rapports de certification Azure obtenus par Microsoft (regroupés dans des onglets comme PCI, SOC et ISO), avec les documents nécessaires pour les présenter. Ils couvrent ce que Microsoft exploite, ce qui complète l'évaluation de vos propres ressources.
      options:
        a: { en: "Download report produces a PDF or CSV summary of Fabrikam's own compliance status, based on Defender for Cloud assessments, not Microsoft's certificates.", fr: "Download report produit un résumé PDF ou CSV de l'état de conformité de Fabrikam elle-même, fondé sur les évaluations de Defender for Cloud, pas les certificats de Microsoft." }
        c: { en: "Manual attestation records Fabrikam's own evidence for controls that can't be assessed automatically.", fr: "L'attestation manuelle enregistre les preuves de Fabrikam elle-même pour les contrôles qui ne peuvent pas être évalués automatiquement." }
        d: { en: "Continuous export streams Fabrikam's compliance assessment data to Event Hubs or Log Analytics; it contains no Microsoft certificate.", fr: "L'exportation continue envoie les données d'évaluation de conformité de Fabrikam vers Event Hubs ou Log Analytics ; elle ne contient aucun certificat de Microsoft." }
    references:
      - title: Improve regulatory compliance
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-13-06
    objective: "1.3.7"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys has an Azure subscription named **Sub-Fin**. Defender CSPM and its Permissions Management (CIEM) capability are enabled. All users have Microsoft Entra ID P2 licenses.

        An access review of Sub-Fin finds the four issues listed in the answer area. You need to remediate each issue. The solution must follow the principle of least privilege, keep every legitimate task possible, and minimize future administrative effort.

        Which remediation should you apply to each issue? To answer, drag the appropriate remediations to the correct issues. Each remediation may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un abonnement Azure nommé **Sub-Fin**. Defender CSPM et sa fonctionnalité Permissions Management (CIEM) sont activés. Tous les utilisateurs disposent de licences Microsoft Entra ID P2.

        Une revue des accès de Sub-Fin relève les quatre problèmes listés dans la zone de réponse. Vous devez corriger chaque problème. La solution doit respecter le principe du moindre privilège, conserver toutes les tâches légitimes et réduire au minimum l'effort d'administration futur.

        Quelle correction devez-vous appliquer à chaque problème ? Pour répondre, faites glisser les corrections appropriées vers les problèmes correspondants. Chaque correction peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: narrow, text: { en: "Replace the assignment with a data role scoped to the resource the task uses", fr: "Remplacer l'attribution par un rôle de données limité à la ressource utilisée par la tâche" } }
        - { id: remove, text: { en: "Remove the role assignment", fr: "Supprimer l'attribution de rôle" } }
        - { id: pim, text: { en: "Convert the assignment to an eligible assignment in Privileged Identity Management", fr: "Convertir l'attribution en attribution éligible dans Privileged Identity Management" } }
        - { id: cond, text: { en: "Replace the assignment with Role Based Access Control Administrator and a condition", fr: "Remplacer l'attribution par Role Based Access Control Administrator avec une condition" } }
        - { id: group, text: { en: "Replace the assignments with one assignment to a security group", fr: "Remplacer les attributions par une seule attribution à un groupe de sécurité" } }
        - { id: lock, text: { en: "Apply a CanNotDelete lock to the scope of the assignment", fr: "Poser un verrou CanNotDelete sur l'étendue de l'attribution" } }
      targets:
        - id: t1
          text: { en: "The managed identity of an app named app-ledger has Contributor on Sub-Fin. It only reads and writes blobs in a storage account named stledger.", fr: "L'identité managée d'une application nommée app-ledger dispose de Contributor sur Sub-Fin. Elle ne fait que lire et écrire des objets blob dans un compte de stockage nommé stledger." }
        - id: t2
          text: { en: "A contractor whose contract ended in July still has Contributor on a resource group. CIEM reports the identity as inactive.", fr: "Un prestataire dont le contrat a pris fin en juillet dispose toujours de Contributor sur un groupe de ressources. Le CIEM signale l'identité comme inactive." }
        - id: t3
          text: { en: "A team lead holds User Access Administrator on Sub-Fin only to grant Virtual Machine Contributor to the developers of his team.", fr: "Un chef d'équipe détient User Access Administrator sur Sub-Fin uniquement pour accorder Virtual Machine Contributor aux développeurs de son équipe." }
        - id: t4
          text: { en: "Each of 25 auditors has a direct Reader assignment on Sub-Fin. Auditors join and leave every quarter.", fr: "Chacun des 25 auditeurs dispose d'une attribution Reader directe sur Sub-Fin. Des auditeurs arrivent et partent chaque trimestre." }
    answer:
      mapping: { t1: narrow, t2: remove, t3: cond, t4: group }
    explanation:
      correct:
        en: |
          app-ledger only uses blob data, so Contributor on the subscription becomes a blob data role (Storage Blob Data Contributor) on stledger. An identity that no longer has any legitimate use, flagged inactive by CIEM (no action for 45 days), loses its assignment. A delegated administrator who must only grant one role gets Role Based Access Control Administrator with a condition that limits the roles he can assign. Many identical direct assignments are replaced by one assignment to a group whose membership changes with the team.
        fr: |
          app-ledger n'utilise que des données blob : Contributor sur l'abonnement devient un rôle de données blob (Storage Blob Data Contributor) sur stledger. Une identité qui n'a plus d'usage légitime, signalée inactive par le CIEM (aucune action depuis 45 jours), perd son attribution. Un administrateur délégué qui ne doit accorder qu'un rôle reçoit Role Based Access Control Administrator avec une condition qui limite les rôles qu'il peut attribuer. De nombreuses attributions directes identiques sont remplacées par une seule attribution à un groupe dont l'appartenance suit l'équipe.
      options:
        pim: { en: "PIM removes standing access, but an eligible User Access Administrator could still grant any role once activated: it doesn't limit the team lead to one role.", fr: "PIM supprime l'accès permanent, mais un User Access Administrator éligible pourrait toujours accorder n'importe quel rôle une fois activé : il ne limite pas le chef d'équipe à un seul rôle." }
        lock: { en: "A lock blocks control plane changes to resources whatever the role; it doesn't reduce the permissions of an assignment.", fr: "Un verrou bloque les modifications du plan de contrôle des ressources quel que soit le rôle ; il ne réduit pas les autorisations d'une attribution." }
    references:
      - title: Identity and access security recommendations
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/recommendations-reference-identity-access

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-13-07
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware, Inc. uses Microsoft Defender for Cloud on an Azure subscription named **Sub-Web** and on an AWS account connected through a connector. Defender CSPM is enabled on both, and the Microsoft cloud security benchmark is assigned everywhere.

        The security team considers the following actions.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. utilise Microsoft Defender for Cloud sur un abonnement Azure nommé **Sub-Web** et sur un compte AWS connecté par un connecteur. Defender CSPM est activé sur les deux, et le Microsoft cloud security benchmark est attribué partout.

        L'équipe de sécurité envisage les actions suivantes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Setting the effect of an MCSB recommendation to Deny in the security policies of the AWS connector prevents new non-compliant AWS resources from being created.", fr: "Définir l'effet d'une recommandation MCSB sur Deny dans les stratégies de sécurité du connecteur AWS empêche la création de nouvelles ressources AWS non conformes." }
        - id: s2
          text: { en: "Exempting a virtual machine named vm-legacy01 from a recommendation with the Risk accepted (waiver) category stops vm-legacy01 from counting as an unhealthy resource of that recommendation in the secure score.", fr: "Exempter une machine virtuelle nommée vm-legacy01 d'une recommandation avec la catégorie Risk accepted (waiver) fait que vm-legacy01 ne compte plus comme une ressource non saine de cette recommandation dans le score de sécurité (secure score)." }
        - id: s3
          text: { en: "Remediating the 40 resources affected by a recommendation flagged Preview raises the secure score of Sub-Web.", fr: "Corriger les 40 ressources concernées par une recommandation marquée Preview augmente le score de sécurité (secure score) de Sub-Web." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The Deny and Disabled effects of MCSB recommendations are available only for the Azure environment, so they can't block AWS resources. A waiver exemption excludes the resource from the secure score calculation: it no longer counts as unhealthy, although it doesn't count as healthy either (that is the mitigated category). Recommendations flagged Preview aren't included in the secure score, so fixing them doesn't change it until they become generally available.
        fr: |
          Les effets Deny et Disabled des recommandations MCSB ne sont disponibles que pour l'environnement Azure ; ils ne peuvent donc pas bloquer des ressources AWS. Une exemption de type waiver exclut la ressource du calcul du score de sécurité : elle ne compte plus comme non saine, sans compter non plus comme saine (c'est le cas de la catégorie mitigated). Les recommandations marquées Preview ne sont pas incluses dans le score de sécurité ; les corriger ne le modifie donc pas tant qu'elles ne sont pas en disponibilité générale.
    references:
      - title: Manage MCSB recommendations in Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/prevent-misconfigurations
      - title: Exempt resources from recommendations
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/exempt-resource

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-13-08
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has a subscription named **Sub-Data** with two Azure Policy assignments:

        | Assignment | Built-in definition | Effect |
        | --- | --- | --- |
        | A1 | Configure storage accounts to disable public network access | Modify |
        | A2 | Storage accounts should disable public network access | Deny |

        A1 has a managed identity with the roles that the definition requires. Both assignments were created yesterday. Since last month, Sub-Data contains a storage account named **stlegacy** whose public network access is enabled. No remediation task exists.

        Today, a developer deploys a template that creates a new storage account named **stnew01** with `publicNetworkAccess` set to `Enabled`.

        What is the result?
      fr: |
        Contoso, Ltd. dispose d'un abonnement nommé **Sub-Data** avec deux attributions Azure Policy :

        | Attribution | Définition intégrée | Effet |
        | --- | --- | --- |
        | A1 | Configure storage accounts to disable public network access | Modify |
        | A2 | Storage accounts should disable public network access | Deny |

        A1 dispose d'une identité managée avec les rôles qu'exige la définition. Les deux attributions ont été créées hier. Depuis le mois dernier, Sub-Data contient un compte de stockage nommé **stlegacy** dont l'accès réseau public est activé. Aucune tâche de correction n'existe.

        Aujourd'hui, un développeur déploie un modèle qui crée un nouveau compte de stockage nommé **stnew01** avec `publicNetworkAccess` défini sur `Enabled`.

        Quel est le résultat ?
    body:
      options:
        - { id: a, text: { en: "A2 denies the creation of stnew01. A1 disables public network access on stlegacy during the next evaluation cycle.", fr: "A2 refuse la création de stnew01. A1 désactive l'accès réseau public de stlegacy lors du prochain cycle d'évaluation." } }
        - { id: b, text: { en: "A2 denies the creation of stnew01. stlegacy keeps public network access and is reported as non-compliant.", fr: "A2 refuse la création de stnew01. stlegacy conserve l'accès réseau public et est signalé comme non conforme." } }
        - { id: c, text: { en: "stnew01 is created with public network access disabled. stlegacy keeps public network access and is reported as non-compliant.", fr: "stnew01 est créé avec l'accès réseau public désactivé. stlegacy conserve l'accès réseau public et est signalé comme non conforme." } }
        - { id: d, text: { en: "stnew01 is created with public network access enabled. A1 disables it on both accounts during the next evaluation cycle.", fr: "stnew01 est créé avec l'accès réseau public activé. A1 le désactive sur les deux comptes lors du prochain cycle d'évaluation." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          On a create or update request, `modify` is evaluated before `deny`. A1 rewrites the request so that public network access is disabled, and A2 then evaluates a compliant request, so stnew01 is created without public access. Neither effect changes an existing resource during the evaluation cycle: stlegacy is only reported as non-compliant until someone runs a remediation task for A1.
        fr: |
          Sur une demande de création ou de mise à jour, `modify` est évalué avant `deny`. A1 réécrit la demande pour que l'accès réseau public soit désactivé, puis A2 évalue une demande conforme : stnew01 est donc créé sans accès public. Aucun des deux effets ne modifie une ressource existante pendant le cycle d'évaluation : stlegacy est seulement signalé comme non conforme jusqu'à ce que quelqu'un exécute une tâche de correction pour A1.
      options:
        a: { en: "The request is modified before `deny` is evaluated, so A2 doesn't block it; and the evaluation cycle never changes existing resources.", fr: "La demande est modifiée avant l'évaluation de `deny`, donc A2 ne la bloque pas ; et le cycle d'évaluation ne modifie jamais les ressources existantes." }
        b: { en: "The stlegacy part is right, but A1 has already changed the request when A2 evaluates it, so stnew01 isn't denied.", fr: "La partie sur stlegacy est juste, mais A1 a déjà modifié la demande quand A2 l'évalue : stnew01 n'est donc pas refusé." }
        d: { en: "`modify` acts on the request itself, not after creation, and existing resources are fixed only by a remediation task.", fr: "`modify` agit sur la demande elle-même, pas après la création, et les ressources existantes ne sont corrigées que par une tâche de correction." }
    references:
      - title: Azure Policy definitions effect basics
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
      - title: Azure Policy definitions modify effect
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-modify

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-13-09
    objective: "1.3.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum Corporation has a management group named **MG-Corp** that contains 14 Azure subscriptions, including **Sub-East** and **Sub-West**. Its Microsoft Entra tenant has Microsoft Entra ID P1 licenses for all users. A user named **Admin1** must perform two tasks:

        - Create an Azure custom role named **Restore Operator (custom)** that can be assigned in Sub-East and Sub-West, and nowhere else.
        - Create a Microsoft Entra custom role that contains the permissions of the built-in **Application Administrator** role, except the permissions to delete applications.

        You need to grant Admin1 the required roles and define both custom roles. The solution must follow the principle of least privilege.

        How should you complete the plan? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation dispose d'un groupe d'administration nommé **MG-Corp** qui contient 14 abonnements Azure, dont **Sub-East** et **Sub-West**. Son locataire Microsoft Entra dispose de licences Microsoft Entra ID P1 pour tous les utilisateurs. Un utilisateur nommé **Admin1** doit effectuer deux tâches :

        - Créer un rôle personnalisé Azure nommé **Restore Operator (custom)** qui peut être attribué dans Sub-East et Sub-West, et nulle part ailleurs.
        - Créer un rôle personnalisé Microsoft Entra qui contient les autorisations du rôle intégré **Application Administrator**, sauf les autorisations de suppression d'applications.

        Vous devez accorder à Admin1 les rôles nécessaires et définir les deux rôles personnalisés. La solution doit respecter le principe du moindre privilège.

        Comment devez-vous compléter le plan ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Azure role to assign to Admin1 on Sub-East and Sub-West: [[azrole]]
          AssignableScopes of Restore Operator (custom): [[scope]]
          Microsoft Entra role to assign to Admin1: [[entrarole]]
          How to build the Microsoft Entra custom role: [[build]]
        fr: |
          Rôle Azure à attribuer à Admin1 sur Sub-East et Sub-West : [[azrole]]
          AssignableScopes de Restore Operator (custom) : [[scope]]
          Rôle Microsoft Entra à attribuer à Admin1 : [[entrarole]]
          Façon de construire le rôle personnalisé Microsoft Entra : [[build]]
      slots:
        - id: azrole
          options:
            - { id: rbacadmin, text: Role Based Access Control Administrator }
            - { id: uaa, text: User Access Administrator }
            - { id: owner, text: Owner }
            - { id: rpc, text: Resource Policy Contributor }
        - id: scope
          options:
            - { id: mg, text: "/providers/Microsoft.Management/managementGroups/MG-Corp" }
            - { id: subs, text: { en: "The IDs of Sub-East and Sub-West, as two entries", fr: "Les ID de Sub-East et de Sub-West, en deux entrées" } }
            - { id: root, text: "/" }
        - id: entrarole
          options:
            - { id: appadmin, text: Application Administrator }
            - { id: cloudapp, text: Cloud Application Administrator }
            - { id: pra, text: Privileged Role Administrator }
            - { id: uaa2, text: User Administrator }
        - id: build
          options:
            - { id: clone, text: { en: "Clone the Application Administrator role, then remove the delete permissions", fr: "Cloner le rôle Application Administrator, puis retirer les autorisations de suppression" } }
            - { id: edit, text: { en: "Edit the Application Administrator role, then remove the delete permissions", fr: "Modifier le rôle Application Administrator, puis retirer les autorisations de suppression" } }
            - { id: scratch, text: { en: "Create a new custom role, then add the needed permissions one by one", fr: "Créer un nouveau rôle personnalisé, puis ajouter une à une les autorisations nécessaires" } }
    answer:
      values: { azrole: uaa, scope: subs, entrarole: pra, build: scratch }
    explanation:
      correct:
        en: |
          Creating an Azure custom role requires `Microsoft.Authorization/roleDefinitions/write` on all its assignable scopes: User Access Administrator has it through `Microsoft.Authorization/*` with far less than Owner. Listing the two subscription IDs in `AssignableScopes` limits the role to them. Microsoft Entra custom roles are created by a Privileged Role Administrator, and a built-in Entra role can be neither modified nor cloned (only custom roles can be cloned), so the permissions must be selected in a new role.
        fr: |
          Créer un rôle personnalisé Azure exige `Microsoft.Authorization/roleDefinitions/write` sur toutes ses étendues attribuables : User Access Administrator le possède par `Microsoft.Authorization/*`, avec bien moins de droits qu'Owner. Lister les ID des deux abonnements dans `AssignableScopes` limite le rôle à ceux-ci. Les rôles personnalisés Microsoft Entra sont créés par un Privileged Role Administrator, et un rôle Entra intégré ne peut être ni modifié ni cloné (seuls les rôles personnalisés peuvent l'être) : les autorisations doivent donc être sélectionnées dans un nouveau rôle.
      options:
        rbacadmin: { en: "Role Based Access Control Administrator can write role assignments but not role definitions.", fr: "Role Based Access Control Administrator peut écrire des attributions de rôles, mais pas des définitions de rôles." }
        owner: { en: "Owner works but grants full control of every resource: it isn't least privilege.", fr: "Owner fonctionne mais accorde le contrôle total de toutes les ressources : ce n'est pas le moindre privilège." }
        rpc: { en: "Resource Policy Contributor manages Azure Policy, not role definitions.", fr: "Resource Policy Contributor gère Azure Policy, pas les définitions de rôles." }
        mg: { en: "MG-Corp would make the role assignable in the 12 other subscriptions too.", fr: "MG-Corp rendrait le rôle attribuable aussi dans les 12 autres abonnements." }
        root: { en: "The root scope (/) isn't allowed in the AssignableScopes of a custom role.", fr: "L'étendue racine (/) n'est pas autorisée dans les AssignableScopes d'un rôle personnalisé." }
        appadmin: { en: "Application Administrator manages applications; it can't create Microsoft Entra role definitions.", fr: "Application Administrator gère les applications ; il ne peut pas créer de définitions de rôles Microsoft Entra." }
        clone: { en: "Only a custom Microsoft Entra role can be cloned; a built-in role can't.", fr: "Seul un rôle Microsoft Entra personnalisé peut être cloné ; un rôle intégré ne le peut pas." }
        edit: { en: "Built-in Microsoft Entra roles have a fixed set of permissions that can't be modified.", fr: "Les rôles Microsoft Entra intégrés ont un ensemble fixe d'autorisations qui ne peut pas être modifié." }
    references:
      - title: Azure custom roles
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
      - title: Create a custom role in Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-create

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-13-10
    objective: "1.3.8"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has a Recovery Services vault named **rsv-hr** in a subscription named **Sub-HR**. rsv-hr has the following configuration:

        - Soft delete is enabled, but not always-on.
        - Immutability is **Enabled** (not locked) and based on the backup policy.
        - rsv-hr is associated with a Resource Guard named **guard-hr** in a subscription managed by the security team. When guard-hr was associated, the **Modify policy** operation was excluded; the other operations use their default protection.

        A backup administrator named **Ops1** has the **Contributor** role on rsv-hr and the **Reader** role on guard-hr. Ops1 has no other role.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un coffre Recovery Services nommé **rsv-hr** dans un abonnement nommé **Sub-HR**. rsv-hr a la configuration suivante :

        - La suppression réversible est activée, mais pas toujours active.
        - L'immuabilité est **Enabled** (non verrouillée) et fondée sur la stratégie de sauvegarde.
        - rsv-hr est associé à un Resource Guard nommé **guard-hr** dans un abonnement géré par l'équipe de sécurité. Lors de l'association de guard-hr, l'opération **Modify policy** a été exclue ; les autres opérations utilisent leur protection par défaut.

        Un administrateur de sauvegarde nommé **Ops1** dispose du rôle **Contributor** sur rsv-hr et du rôle **Reader** sur guard-hr. Ops1 n'a aucun autre rôle.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Ops1 can reduce the daily retention of the backup policy of rsv-hr from 30 days to 7 days without any approval from the security team.", fr: "Ops1 peut réduire la rétention quotidienne de la stratégie de sauvegarde de rsv-hr de 30 jours à 7 jours sans aucune approbation de l'équipe de sécurité." }
        - id: s2
          text: { en: "The security team can exclude the operation that disables soft delete from the protected operations of guard-hr, so that Ops1 can disable soft delete without approval.", fr: "L'équipe de sécurité peut exclure l'opération qui désactive la suppression réversible des opérations protégées de guard-hr, afin qu'Ops1 puisse désactiver la suppression réversible sans approbation." }
        - id: s3
          text: { en: "If the security team grants Ops1 the Backup MUA Operator role on guard-hr for four hours, Ops1 can disable immutability and then reduce the retention during that time.", fr: "Si l'équipe de sécurité accorde à Ops1 le rôle Backup MUA Operator sur guard-hr pendant quatre heures, Ops1 peut désactiver l'immuabilité puis réduire la rétention pendant ce délai." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Excluding Modify policy removes the MUA check on retention changes, but the enabled immutable vault still blocks any retention reduction, and disabling immutability is protected by guard-hr by default. Disabling soft delete is a mandatory protected operation, like removing MUA protection: it can't be excluded. With Backup MUA Operator on the guard, Ops1 can perform the protected operations during the grant: immutability isn't locked, so it can be disabled, and the retention change is then no longer blocked.
        fr: |
          Exclure Modify policy supprime le contrôle MUA sur les modifications de rétention, mais le coffre immuable activé bloque toujours toute réduction de la rétention, et la désactivation de l'immuabilité est protégée par défaut par guard-hr. La désactivation de la suppression réversible est une opération protégée obligatoire, comme le retrait de la protection MUA : elle ne peut pas être exclue. Avec Backup MUA Operator sur le Resource Guard, Ops1 peut effectuer les opérations protégées pendant la durée de l'octroi : l'immuabilité n'est pas verrouillée, elle peut donc être désactivée, et la modification de la rétention n'est alors plus bloquée.
    references:
      - title: Multiuser authorization using Resource Guard
        url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
      - title: Immutable vault for Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
