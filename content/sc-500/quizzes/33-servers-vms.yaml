chapter: 33-servers-vms
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-33-01
    objective: "3.2.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum plans to deploy Windows Server virtual machines with the **Trusted launch** security type so that they get secure boot and a virtual TPM.

        Which requirement must the virtual machines meet?
      fr: |
        Adatum prévoit de déployer des machines virtuelles Windows Server avec le type de sécurité **Trusted launch** (lancement fiable) afin qu'elles bénéficient du démarrage sécurisé et d'un TPM virtuel.

        Quelle exigence les machines virtuelles doivent-elles respecter ?
    body:
      options:
        - { id: a, text: { en: "They must be Generation 2 virtual machines.", fr: "Ce doivent être des machines virtuelles de génération 2." } }
        - { id: b, text: { en: "They must use a confidential size, such as DCasv5.", fr: "Elles doivent utiliser une taille confidentielle, comme DCasv5." } }
        - { id: c, text: { en: "They must be created from a managed image.", fr: "Elles doivent être créées à partir d'une image managée." } }
        - { id: d, text: { en: "They must use encryption at host with a disk encryption set.", fr: "Elles doivent utiliser le chiffrement sur l'hôte avec un jeu de chiffrement de disque." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Trusted launch is supported only on Generation 2 virtual machines; a Generation 1 VM must first be upgraded to Generation 2. Trusted launch also needs a supported size and image, and it adds no cost to the VM.
        fr: |
          Le lancement fiable n'est pris en charge que sur les machines virtuelles de génération 2 ; une machine virtuelle de génération 1 doit d'abord être mise à niveau en génération 2. Le lancement fiable demande aussi une taille et une image prises en charge, et il n'ajoute aucun coût à la machine virtuelle.
      options:
        b: { en: "Confidential sizes are for the Confidential VM security type; Trusted launch runs on general-purpose sizes such as the Dsv5 series.", fr: "Les tailles confidentielles servent au type de sécurité Confidential VM ; le lancement fiable fonctionne sur des tailles généralistes comme la série Dsv5." }
        c: { en: "Managed images aren't supported with Trusted launch: publish the image in an Azure Compute Gallery instead.", fr: "Les images managées ne sont pas prises en charge avec le lancement fiable : publiez plutôt l'image dans une galerie Azure Compute Gallery." }
        d: { en: "Encryption at host is an independent disk encryption option; it isn't a prerequisite of secure boot or vTPM.", fr: "Le chiffrement sur l'hôte est une option de chiffrement de disque indépendante ; ce n'est pas un prérequis du démarrage sécurisé ni du vTPM." }
    references:
      - title: Trusted Launch for Azure virtual machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-33-02
    objective: "3.2.2"
    difficulty: 1
    status: draft
    shuffle: false
    type: single
    stem:
      en: |
        Fabrikam has a virtual network named **VNet-Hub** that is connected to its datacenter by a site-to-site VPN. Administrators must open RDP sessions through an Azure Bastion host deployed in VNet-Hub to an on-premises server by entering its private IP address, 10.50.1.20.

        Session recording isn't required. The solution must minimize cost. Which Azure Bastion SKU should you deploy?
      fr: |
        Fabrikam dispose d'un réseau virtuel nommé **VNet-Hub** relié à son centre de données par un VPN site à site. Les administrateurs doivent ouvrir des sessions RDP, via un hôte Azure Bastion déployé dans VNet-Hub, vers un serveur local en saisissant son adresse IP privée, 10.50.1.20.

        L'enregistrement des sessions n'est pas nécessaire. La solution doit réduire les coûts au minimum. Quelle référence SKU Azure Bastion devez-vous déployer ?
    body:
      options:
        - { id: a, text: Developer }
        - { id: b, text: Basic }
        - { id: c, text: Standard }
        - { id: d, text: Premium }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Connecting to a machine by its IP address, including an on-premises server reachable through a VPN, is the IP-based connection feature. It's available from the Standard SKU, which is the cheapest SKU that offers it.
        fr: |
          Se connecter à une machine par son adresse IP, y compris un serveur local joignable par un VPN, correspond à la fonctionnalité de connexion par adresse IP. Elle est disponible à partir de la SKU Standard, qui est la SKU la moins coûteuse qui la propose.
      options:
        a: { en: "The Developer SKU uses a shared host and connects only to VMs of its own virtual network, without IP-based connection.", fr: "La SKU Developer utilise un hôte partagé et ne se connecte qu'aux machines virtuelles de son propre réseau virtuel, sans connexion par adresse IP." }
        b: { en: "Basic reaches VMs in the virtual network and peered networks, but doesn't support IP-based connection.", fr: "Basic atteint les machines virtuelles du réseau virtuel et des réseaux reliés par peering, mais ne prend pas en charge la connexion par adresse IP." }
        d: { en: "Premium supports IP-based connection too, but it costs more; its extra features (session recording, private-only deployment) aren't required.", fr: "Premium prend aussi en charge la connexion par adresse IP, mais coûte plus cher ; ses fonctionnalités supplémentaires (enregistrement des sessions, déploiement privé uniquement) ne sont pas requises." }
    references:
      - title: Choose the right Azure Bastion SKU to meet your needs
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-33-03
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a Windows Server virtual machine named **VM-LEDGER**. Its data disk is encrypted with Azure Disk Encryption (ADE).

        Before ADE is retired, the security team requires that the data of this disk be protected by encryption at host, so that the temp disk and the caches are encrypted too. What should you do?
      fr: |
        Woodgrove Bank dispose d'une machine virtuelle Windows Server nommée **VM-LEDGER**. Son disque de données est chiffré avec Azure Disk Encryption (ADE).

        Avant la mise hors service d'ADE, l'équipe de sécurité exige que les données de ce disque soient protégées par le chiffrement sur l'hôte, afin que le disque temporaire et les caches soient aussi chiffrés. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Disable ADE, deallocate VM-LEDGER, and then enable encryption at host on VM-LEDGER and its existing data disk.", fr: "Désactiver ADE, libérer VM-LEDGER, puis activer le chiffrement sur l'hôte sur VM-LEDGER et sur son disque de données existant." } }
        - { id: b, text: { en: "Keep ADE enabled and enable encryption at host as well, so that both options protect the disk during the transition.", fr: "Conserver ADE et activer aussi le chiffrement sur l'hôte, afin que les deux options protègent le disque pendant la transition." } }
        - { id: c, text: { en: "Disable ADE, copy the data to a new managed disk, and then attach that disk to a new VM that uses encryption at host.", fr: "Désactiver ADE, copier les données vers un nouveau disque managé, puis attacher ce disque à une nouvelle machine virtuelle qui utilise le chiffrement sur l'hôte." } }
        - { id: d, text: { en: "Re-encrypt the disk with ADE by using a key encryption key stored in Azure Key Vault Managed HSM.", fr: "Chiffrer de nouveau le disque avec ADE en utilisant une clé de chiffrement à clé stockée dans un HSM managé Azure Key Vault." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          ADE and encryption at host are mutually exclusive, and there's no in-place conversion: a VM or disk that has had ADE can't simply be switched to encryption at host. After decrypting, you create new managed disks with a copy of the data and attach them to a new VM created with encryption at host.
        fr: |
          ADE et le chiffrement sur l'hôte s'excluent mutuellement, et il n'existe pas de conversion sur place : une machine virtuelle ou un disque qui a eu ADE ne peut pas simplement passer au chiffrement sur l'hôte. Après le déchiffrement, vous créez de nouveaux disques managés avec une copie des données et les attachez à une nouvelle machine virtuelle créée avec le chiffrement sur l'hôte.
      options:
        a: { en: "Disabling ADE doesn't make the VM or its disk eligible: in-place migration to encryption at host isn't supported.", fr: "Désactiver ADE ne rend ni la machine virtuelle ni son disque éligibles : la migration sur place vers le chiffrement sur l'hôte n'est pas prise en charge." }
        b: { en: "ADE and encryption at host can't be combined on the same VM.", fr: "ADE et le chiffrement sur l'hôte ne peuvent pas être combinés sur la même machine virtuelle." }
        d: { en: "The retirement applies to ADE itself, whatever the key store: after September 15, 2028, ADE-encrypted disks fail to unlock after a reboot.", fr: "La mise hors service concerne ADE lui-même, quel que soit le magasin de clés : après le 15 septembre 2028, les disques chiffrés avec ADE ne se déverrouillent plus après un redémarrage." }
    references:
      - title: Migrate from Azure Disk Encryption to encryption at host - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-migrate

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-33-04
    objective: "3.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has an on-premises Linux server named **SRV-PAY** that is connected to Azure Arc. A script that runs on SRV-PAY must read a secret from an Azure key vault named **kv-pay**, which uses the Azure role-based access control permission model.

        No credential may be stored on SRV-PAY, and the solution must follow the principle of least privilege. What should you do?
      fr: |
        Contoso dispose d'un serveur Linux local nommé **SRV-PAY** connecté à Azure Arc. Un script qui s'exécute sur SRV-PAY doit lire un secret dans un coffre de clés Azure nommé **kv-pay**, qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure.

        Aucune information d'identification ne doit être stockée sur SRV-PAY, et la solution doit respecter le principe du moindre privilège. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign Key Vault Secrets User on kv-pay to the managed identity of SRV-PAY, and get tokens from the agent's local endpoint.", fr: "Attribuer Key Vault Secrets User sur kv-pay à l'identité managée de SRV-PAY, puis obtenir les jetons auprès du point de terminaison local de l'agent." } }
        - { id: b, text: { en: "Assign Key Vault Secrets Officer on kv-pay to the managed identity of SRV-PAY, and get tokens from the agent's local endpoint.", fr: "Attribuer Key Vault Secrets Officer sur kv-pay à l'identité managée de SRV-PAY, puis obtenir les jetons auprès du point de terminaison local de l'agent." } }
        - { id: c, text: { en: "Create a service principal with a certificate, install the certificate on SRV-PAY, and assign it Key Vault Secrets User on kv-pay.", fr: "Créer un principal de service avec un certificat, installer le certificat sur SRV-PAY, puis lui attribuer Key Vault Secrets User sur kv-pay." } }
        - { id: d, text: { en: "Assign Key Vault Secrets User on kv-pay to the service principal that onboarded the servers with Azure Connected Machine Onboarding.", fr: "Attribuer Key Vault Secrets User sur kv-pay au principal de service qui a intégré les serveurs avec Azure Connected Machine Onboarding." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The Connected Machine agent gives each Azure Arc-enabled server a system-assigned managed identity. A local process obtains tokens for it from the agent's local identity endpoint, so no secret is stored on the server. Key Vault Secrets User only allows reading secret contents, which is the least privilege for this need.
        fr: |
          L'agent Connected Machine donne à chaque serveur avec Azure Arc une identité managée affectée par le système. Un processus local obtient des jetons pour cette identité auprès du point de terminaison d'identité local de l'agent ; aucun secret n'est donc stocké sur le serveur. Key Vault Secrets User permet seulement de lire le contenu des secrets, ce qui est le moindre privilège pour ce besoin.
      options:
        b: { en: "Key Vault Secrets Officer can also create, update and delete secrets: more than reading one secret requires.", fr: "Key Vault Secrets Officer peut aussi créer, modifier et supprimer des secrets : c'est plus que ce qu'exige la lecture d'un secret." }
        c: { en: "The certificate and its private key would be a credential stored on SRV-PAY.", fr: "Le certificat et sa clé privée seraient une information d'identification stockée sur SRV-PAY." }
        d: { en: "The onboarding service principal isn't the server's identity; using it on SRV-PAY would require storing its secret, and it would gain access far beyond onboarding.", fr: "Le principal de service d'intégration n'est pas l'identité du serveur ; l'utiliser sur SRV-PAY exigerait de stocker son secret, et il obtiendrait un accès bien au-delà de l'intégration." }
    references:
      - title: Access Azure resources with managed identity on Azure Arc-enabled servers - Azure Arc
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/managed-identity-authentication
      - title: Overview of the Azure Connected Machine agent - Azure Arc
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/agent-overview

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-33-05
    objective: "3.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware enabled Microsoft Defender for Servers Plan 1 on an Azure subscription named **Sub1**. The settings of the plan are the following:

        | Component | Status |
        | --- | --- |
        | Vulnerability assessment for machines | On (Microsoft Defender Vulnerability Management) |
        | Endpoint protection | Off |

        None of the VMs of Sub1 has vulnerability findings in Defender for Cloud. You need vulnerability findings for every VM of Sub1 without enabling another Defender plan. What should you do?
      fr: |
        Litware a activé Microsoft Defender for Servers Plan 1 sur un abonnement Azure nommé **Sub1**. Les paramètres du plan sont les suivants :

        | Composant | État |
        | --- | --- |
        | Évaluation des vulnérabilités des machines | On (Microsoft Defender Vulnerability Management) |
        | Protection des points de terminaison | Off |

        Aucune machine virtuelle de Sub1 n'a de résultat de vulnérabilité dans Defender for Cloud. Vous devez obtenir des résultats de vulnérabilité pour toutes les machines virtuelles de Sub1 sans activer un autre plan Defender. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Turn on Agentless scanning for machines in the settings of the plan.", fr: "Activer Analyse sans agent des machines dans les paramètres du plan." } }
        - { id: b, text: { en: "Turn on the Endpoint protection setting in the settings of the plan.", fr: "Activer le paramètre Protection des points de terminaison dans les paramètres du plan." } }
        - { id: c, text: { en: "Install the Azure Monitor Agent on the new VMs with a data collection rule.", fr: "Installer l'agent Azure Monitor sur les nouvelles machines virtuelles avec une règle de collecte de données." } }
        - { id: d, text: { en: "Turn on File integrity monitoring in the settings of the plan.", fr: "Activer Surveillance de l'intégrité des fichiers dans les paramètres du plan." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With Plan 1, vulnerability scanning is agent-based: Defender Vulnerability Management uses the Defender for Endpoint sensor, which the Endpoint protection setting deploys automatically. Turning it on onboards the VMs, and their findings then appear in Defender for Cloud.
        fr: |
          Avec le Plan 1, l'analyse des vulnérabilités se fait avec agent : Defender Vulnerability Management utilise le capteur Defender for Endpoint, que le paramètre Protection des points de terminaison déploie automatiquement. L'activer intègre les machines virtuelles, dont les résultats apparaissent ensuite dans Defender for Cloud.
      options:
        a: { en: "Agentless scanning is part of Plan 2 and Defender CSPM, not Plan 1, and the plan must not change.", fr: "L'analyse sans agent fait partie du Plan 2 et de Defender CSPM, pas du Plan 1, et le plan ne doit pas changer." }
        c: { en: "The Azure Monitor Agent collects logs and metrics; it doesn't perform vulnerability assessment.", fr: "L'agent Azure Monitor collecte des journaux et des métriques ; il n'effectue pas d'évaluation des vulnérabilités." }
        d: { en: "File integrity monitoring is a Plan 2 feature that tracks file and registry changes; it doesn't report vulnerabilities.", fr: "La surveillance de l'intégrité des fichiers est une fonctionnalité du Plan 2 qui suit les modifications de fichiers et de registre ; elle ne signale pas de vulnérabilités." }
    references:
      - title: Vulnerability scanning in the Defender for Servers plan in Microsoft Defender for Cloud. - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/auto-deploy-vulnerability-assessment

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-33-06
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys uses Defender for Servers Plan 2 on an Azure subscription named **Sub-Ops**. The virtual machines of Sub-Ops are protected by network security groups.

        You create a custom Azure role for a group named **G-SecEng**, assigned at the scope of Sub-Ops. Members of G-SecEng must be able to enable just-in-time (JIT) VM access on the VMs of Sub-Ops and edit the existing JIT policies (ports, maximum request time, allowed source IPs). The role already contains the read actions on VMs, network interfaces and JIT policies.

        The solution must follow the principle of least privilege. Which two actions should you add to the role? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys utilise Defender for Servers Plan 2 sur un abonnement Azure nommé **Sub-Ops**. Les machines virtuelles de Sub-Ops sont protégées par des groupes de sécurité réseau.

        Vous créez un rôle Azure personnalisé pour un groupe nommé **G-SecEng**, attribué à l'étendue de Sub-Ops. Les membres de G-SecEng doivent pouvoir activer l'accès juste-à-temps (JIT) aux machines virtuelles de Sub-Ops et modifier les stratégies JIT existantes (ports, durée maximale de demande, adresses IP sources autorisées). Le rôle contient déjà les actions de lecture sur les machines virtuelles, les cartes réseau et les stratégies JIT.

        La solution doit respecter le principe du moindre privilège. Quelles sont les deux actions que vous devez ajouter au rôle ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "`Microsoft.Security/locations/jitNetworkAccessPolicies/initiate/action`" }
        - { id: b, text: "`Microsoft.Security/locations/jitNetworkAccessPolicies/write`" }
        - { id: c, text: "`Microsoft.Network/networkSecurityGroups/securityRules/write`" }
        - { id: d, text: "`Microsoft.Compute/virtualMachines/write`" }
        - { id: e, text: "`Microsoft.Security/pricings/write`" }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The least-privilege permissions to configure or edit a JIT policy are `Microsoft.Security/locations/jitNetworkAccessPolicies/write` and `Microsoft.Compute/virtualMachines/write` on the subscription or resource group of the VMs. Defender for Cloud then creates and removes the NSG rules itself when it applies the policy and approves requests.
        fr: |
          Les autorisations minimales pour configurer ou modifier une stratégie JIT sont `Microsoft.Security/locations/jitNetworkAccessPolicies/write` et `Microsoft.Compute/virtualMachines/write` sur l'abonnement ou le groupe de ressources des machines virtuelles. Defender for Cloud crée et supprime ensuite lui-même les règles des NSG quand il applique la stratégie et approuve les demandes.
      options:
        a: { en: "`initiate/action` lets a user request JIT access; it's needed to open ports on request, not to configure policies.", fr: "`initiate/action` permet à un utilisateur de demander un accès JIT ; il sert à ouvrir des ports sur demande, pas à configurer des stratégies." }
        c: { en: "The NSG rules are written by Defender for Cloud; the documented permissions to configure JIT don't include NSG write access.", fr: "Les règles des NSG sont écrites par Defender for Cloud ; les autorisations documentées pour configurer JIT n'incluent pas l'écriture sur les NSG." }
        e: { en: "`pricings/write` changes Defender plans; Plan 2 is already enabled and editing JIT policies doesn't need it.", fr: "`pricings/write` modifie les plans Defender ; le Plan 2 est déjà activé et la modification des stratégies JIT n'en a pas besoin." }
    references:
      - title: Enable Just-in-Time Access - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-33-07
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware has an Azure subscription named **Sub-Shared** that hosts the Azure VMs and Azure Arc-enabled servers of several business units. Microsoft Defender for Servers is off on Sub-Shared.

        The retail business unit tags its machines with **BU=Retail**. These machines must be onboarded to Microsoft Defender for Endpoint by Defender for Servers and must get agent-based vulnerability findings. Machines without the tag, including those that will be created later, must not be billed for Defender for Servers.

        The solution must minimize cost. What should you do?
      fr: |
        Proseware dispose d'un abonnement Azure nommé **Sub-Shared** qui héberge les machines virtuelles Azure et les serveurs avec Azure Arc de plusieurs unités commerciales. Microsoft Defender for Servers est désactivé sur Sub-Shared.

        L'unité commerciale de la vente au détail étiquette ses machines avec **BU=Retail**. Ces machines doivent être intégrées à Microsoft Defender for Endpoint par Defender for Servers et doivent obtenir des résultats de vulnérabilité avec agent. Les machines sans cette étiquette, y compris celles qui seront créées plus tard, ne doivent pas être facturées pour Defender for Servers.

        La solution doit réduire les coûts au minimum. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Turn on the Servers plan with Plan 1 on Sub-Shared, and then disable Defender for Servers at resource level on the untagged machines.", fr: "Activer le plan Serveurs avec le Plan 1 sur Sub-Shared, puis désactiver Defender for Servers au niveau de la ressource sur les machines sans étiquette." } }
        - { id: b, text: { en: "Assign the built-in policy that enables Defender for Servers with the P1 subplan on resources with a selected tag, and create a remediation task.", fr: "Attribuer la stratégie intégrée qui active Defender for Servers avec le sous-plan P1 sur les ressources ayant une étiquette choisie, puis créer une tâche de correction." } }
        - { id: c, text: { en: "Use the REST API to enable Defender for Servers with the P2 subplan at resource level on each machine that has the BU=Retail tag.", fr: "Utiliser l'API REST pour activer Defender for Servers avec le sous-plan P2 au niveau de la ressource sur chaque machine qui a l'étiquette BU=Retail." } }
        - { id: d, text: { en: "Turn on the Defender CSPM plan on Sub-Shared, and then turn on Agentless scanning for machines in the settings of the plan.", fr: "Activer le plan Defender CSPM sur Sub-Shared, puis activer Analyse sans agent des machines dans les paramètres du plan." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Plan 1 is the only Defender for Servers plan that can be enabled at resource level, and it includes the Defender for Endpoint integration and agent-based vulnerability scanning. The built-in policy of the Security Center – Granular Pricing category enables Plan 1 on the Azure VMs and Azure Arc-enabled servers that carry the selected tag (BU=Retail here); the remediation task covers the existing machines, and untagged machines stay unbilled.
        fr: |
          Le Plan 1 est le seul plan Defender for Servers activable au niveau de la ressource, et il comprend l'intégration de Defender for Endpoint et l'analyse des vulnérabilités avec agent. La stratégie intégrée de la catégorie Security Center – Granular Pricing active le Plan 1 sur les machines virtuelles Azure et les serveurs avec Azure Arc qui portent l'étiquette choisie (ici BU=Retail) ; la tâche de correction couvre les machines existantes, et les machines sans étiquette ne sont pas facturées.
      options:
        a: { en: "With the plan on at subscription level, every new machine is billed by default until someone excludes it, which breaks the requirement for future untagged machines.", fr: "Avec le plan activé au niveau de l'abonnement, chaque nouvelle machine est facturée par défaut jusqu'à ce que quelqu'un l'exclue, ce qui enfreint l'exigence pour les futures machines sans étiquette." }
        c: { en: "Plan 2 can't be enabled at resource level, only disabled; and it costs more than the Plan 1 features required.", fr: "Le Plan 2 ne peut pas être activé au niveau de la ressource, seulement désactivé ; et il coûte plus cher que les fonctionnalités du Plan 1 requises." }
        d: { en: "Defender CSPM doesn't onboard machines to Defender for Endpoint, and it applies to the whole subscription rather than to the tagged machines.", fr: "Defender CSPM n'intègre pas les machines à Defender for Endpoint, et il s'applique à tout l'abonnement plutôt qu'aux machines étiquetées." }
    references:
      - title: Protect your servers with Defender for Servers - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-servers-plan

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-33-08
    objective: "3.2.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders enabled Microsoft Defender for Servers Plan 2 on an Azure subscription named **Sub1** and on an AWS account connected to Defender for Cloud. **Agentless scanning for machines** is On for both. No disk uses a customer-managed key, and every machine runs continuously.

        | Machine | Environment | Configuration |
        | --- | --- | --- |
        | VM1 | Azure VM in Sub1 | Premium SSD OS disk, one Premium SSD v2 data disk, NTFS |
        | EC2-APP | Amazon EC2 instance in the connected AWS account | No Defender for Endpoint sensor |
        | SRV-OPS | On-premises server connected to Azure Arc in Sub1 | Defender for Endpoint sensor installed |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders a activé Microsoft Defender for Servers Plan 2 sur un abonnement Azure nommé **Sub1** et sur un compte AWS connecté à Defender for Cloud. **Analyse sans agent des machines** est sur On pour les deux. Aucun disque n'utilise de clé gérée par le client, et toutes les machines s'exécutent en permanence.

        | Machine | Environnement | Configuration |
        | --- | --- | --- |
        | VM1 | Machine virtuelle Azure dans Sub1 | Disque de système d'exploitation SSD Premium, un disque de données SSD Premium v2, NTFS |
        | EC2-APP | Instance Amazon EC2 dans le compte AWS connecté | Aucun capteur Defender for Endpoint |
        | SRV-OPS | Serveur local connecté à Azure Arc dans Sub1 | Capteur Defender for Endpoint installé |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Agentless scanning reports the software inventory of VM1.", fr: "L'analyse sans agent signale l'inventaire logiciel de VM1." }
        - id: s2
          text: { en: "Agentless scanning can detect malware on the disks of EC2-APP.", fr: "L'analyse sans agent peut détecter des logiciels malveillants sur les disques d'EC2-APP." }
        - id: s3
          text: { en: "The vulnerability findings of SRV-OPS come from a daily snapshot of its disks.", fr: "Les résultats de vulnérabilité de SRV-OPS proviennent d'un instantané quotidien de ses disques." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Agentless scanning snapshots the disks of Azure VMs, AWS EC2 instances and GCP instances, and malware scanning is included with Plan 2. A VM that has an Ultra disk or a Premium SSD v2 disk attached isn't scanned at all. An on-premises Arc-enabled server has no cloud disk to snapshot: its vulnerability findings come from the Defender for Endpoint sensor.
        fr: |
          L'analyse sans agent prend des instantanés des disques des machines virtuelles Azure, des instances AWS EC2 et des instances GCP, et l'analyse des logiciels malveillants est incluse avec le Plan 2. Une machine virtuelle à laquelle est attaché un disque Ultra ou un disque SSD Premium v2 n'est pas analysée du tout. Un serveur local avec Arc n'a pas de disque cloud à capturer : ses résultats de vulnérabilité proviennent du capteur Defender for Endpoint.
      options:
        s1: { en: "A `PremiumV2_LRS` disk makes the whole VM unsupported, including its OS disk.", fr: "Un disque `PremiumV2_LRS` rend toute la machine virtuelle non prise en charge, y compris son disque de système d'exploitation." }
        s3: { en: "Agentless scanning covers Azure, AWS and GCP machines only; SRV-OPS is assessed through its Defender for Endpoint sensor.", fr: "L'analyse sans agent ne couvre que les machines Azure, AWS et GCP ; SRV-OPS est évalué grâce à son capteur Defender for Endpoint." }
    references:
      - title: Enable Agentless Machine Scanning - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-agentless-scanning-vms
      - title: Agentless machine scanning in Microsoft Defender for Cloud - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-agentless-data-collection

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-33-09
    objective: "3.2.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso must deploy a Linux virtual machine named **vm-pay03** in the resource group **RG-Pay** by using the Azure CLI. The image alias Ubuntu2204 is a Generation 2 Marketplace image that supports Trusted launch. The VM must meet the following requirements:

        - Use a size with 4 vCPUs.
        - Start only signed boot loaders, kernels and drivers, and protect keys with a virtual TPM.
        - Let Microsoft Defender for Cloud validate its boot integrity remotely.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso doit déployer une machine virtuelle Linux nommée **vm-pay03** dans le groupe de ressources **RG-Pay** avec Azure CLI. L'alias d'image Ubuntu2204 est une image de génération 2 de la Place de marché qui prend en charge le lancement fiable. La machine virtuelle doit respecter les exigences suivantes :

        - Utiliser une taille à 4 processeurs virtuels.
        - Ne démarrer que des chargeurs de démarrage, noyaux et pilotes signés, et protéger les clés avec un TPM virtuel.
        - Permettre à Microsoft Defender for Cloud de valider à distance l'intégrité de son démarrage.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az vm create -g RG-Pay -n vm-pay03 --image Ubuntu2204 \
          --size [[size]] \
          --security-type [[sec]] \
          --enable-secure-boot true --enable-vtpm true \
          [[mon]]
      slots:
        - id: size
          options:
            - { id: a4v2, text: Standard_A4_v2 }
            - { id: d4v3, text: Standard_D4_v3 }
            - { id: d4sv5, text: Standard_D4s_v5 }
        - id: sec
          options:
            - { id: std, text: Standard }
            - { id: tl, text: TrustedLaunch }
            - { id: cvm, text: ConfidentialVM }
        - id: mon
          options:
            - { id: assign, text: "--assign-identity" }
            - { id: noauto, text: "--disable-integrity-monitoring-autoupgrade" }
            - { id: im, text: "--enable-integrity-monitoring" }
            - { id: eah, text: "--encryption-at-host true" }
    answer:
      values: { size: d4sv5, sec: tl, mon: im }
    explanation:
      correct:
        en: |
          Trusted launch provides secure boot and the vTPM, but not on every size: the A and Dv3 families aren't supported, while Dsv5 is. ConfidentialVM requires a confidential size, which none of the listed sizes is. Remote boot integrity validation needs the Guest Attestation extension, which `--enable-integrity-monitoring` installs, together with a system-assigned identity, on a Trusted launch VM.
        fr: |
          Le lancement fiable fournit le démarrage sécurisé et le vTPM, mais pas sur toutes les tailles : les familles A et Dv3 ne sont pas prises en charge, alors que Dsv5 l'est. ConfidentialVM exige une taille confidentielle, ce qu'aucune des tailles proposées n'est. La validation à distance de l'intégrité du démarrage demande l'extension Guest Attestation, que `--enable-integrity-monitoring` installe, avec une identité affectée par le système, sur une machine virtuelle à lancement fiable.
      options:
        size: { en: "Standard_A4_v2 and Standard_D4_v3 belong to families that don't support Trusted launch.", fr: "Standard_A4_v2 et Standard_D4_v3 appartiennent à des familles qui ne prennent pas en charge le lancement fiable." }
        sec: { en: "Standard provides neither secure boot nor vTPM; ConfidentialVM needs a confidential size such as DCasv5.", fr: "Standard ne fournit ni démarrage sécurisé ni vTPM ; ConfidentialVM exige une taille confidentielle comme DCasv5." }
        mon: { en: "`--assign-identity` alone doesn't install the Guest Attestation extension, `--disable-integrity-monitoring-autoupgrade` only changes its upgrades, and encryption at host doesn't validate the boot chain.", fr: "`--assign-identity` seul n'installe pas l'extension Guest Attestation, `--disable-integrity-monitoring-autoupgrade` ne change que ses mises à niveau, et le chiffrement sur l'hôte ne valide pas la chaîne de démarrage." }
    references:
      - title: Trusted Launch for Azure virtual machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
      - title: az vm
        url: https://learn.microsoft.com/en-us/cli/azure/vm?view=azure-cli-latest

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-33-10
    objective: "3.2.9"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Three weeks ago, Fabrikam assigned the **Deploy prerequisites to enable Guest Configuration policies on virtual machines** initiative and the **Windows machines should meet requirements of the Azure compute security baseline** policy to a subscription named **Sub-Corp**. No remediation task was created. Every machine has outbound HTTPS access to Azure, and no machine was modified after its creation except as stated below.

        | Machine | Type | Created | Configuration |
        | --- | --- | --- | --- |
        | VM-A | Azure Windows VM | Two months ago | AzurePolicyforWindows extension installed manually; user-assigned managed identity only |
        | VM-B | Azure Windows VM | Last week | Created from the portal without any extension or managed identity |
        | SRV-C | On-premises Windows server connected to Azure Arc in Sub-Corp | Last month | No VM extension installed |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Il y a trois semaines, Fabrikam a attribué l'initiative **Deploy prerequisites to enable Guest Configuration policies on virtual machines** et la stratégie **Windows machines should meet requirements of the Azure compute security baseline** à un abonnement nommé **Sub-Corp**. Aucune tâche de correction n'a été créée. Chaque machine dispose d'un accès HTTPS sortant vers Azure, et aucune machine n'a été modifiée après sa création, sauf indication ci-dessous.

        | Machine | Type | Création | Configuration |
        | --- | --- | --- | --- |
        | VM-A | Machine virtuelle Windows Azure | Il y a deux mois | Extension AzurePolicyforWindows installée manuellement ; identité managée affectée par l'utilisateur uniquement |
        | VM-B | Machine virtuelle Windows Azure | La semaine dernière | Créée depuis le portail sans extension ni identité managée |
        | SRV-C | Serveur Windows local connecté à Azure Arc dans Sub-Corp | Le mois dernier | Aucune extension de machine virtuelle installée |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "VM-A reports compliance results for the Azure compute security baseline.", fr: "VM-A signale des résultats de conformité pour la base de référence de sécurité de calcul Azure." }
        - id: s2
          text: { en: "VM-B reports compliance results for the Azure compute security baseline.", fr: "VM-B signale des résultats de conformité pour la base de référence de sécurité de calcul Azure." }
        - id: s3
          text: { en: "SRV-C must receive the AzurePolicyforWindows extension before it can report baseline compliance results.", fr: "SRV-C doit recevoir l'extension AzurePolicyforWindows avant de pouvoir signaler des résultats de conformité à la base de référence." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          On an Azure VM, Machine Configuration needs the extension and a system-assigned managed identity. VM-A existed before the assignment and, without a remediation task, never received the system-assigned identity, so it can't report. VM-B was created after the assignment, so the prerequisites were deployed to it automatically. On Arc-enabled servers, the machine configuration agent is part of the Connected Machine agent, which also provides the system-assigned identity: no extension is needed.
        fr: |
          Sur une machine virtuelle Azure, Machine Configuration a besoin de l'extension et d'une identité managée affectée par le système. VM-A existait avant l'attribution et, sans tâche de correction, n'a jamais reçu l'identité affectée par le système ; elle ne peut donc pas signaler de résultats. VM-B a été créée après l'attribution : les prérequis lui ont été déployés automatiquement. Sur les serveurs avec Arc, l'agent Machine Configuration fait partie de l'agent Connected Machine, qui fournit aussi l'identité affectée par le système : aucune extension n'est nécessaire.
      options:
        s1: { en: "A user-assigned identity doesn't meet the requirement: the VM must have a system-assigned managed identity, and existing VMs get one only through a remediation task.", fr: "Une identité affectée par l'utilisateur ne répond pas à l'exigence : la machine virtuelle doit avoir une identité managée affectée par le système, et les machines virtuelles existantes n'en reçoivent une que par une tâche de correction." }
        s3: { en: "The Connected Machine agent includes the machine configuration agent (GCArcService); the AzurePolicyforWindows extension is for Azure VMs.", fr: "L'agent Connected Machine inclut l'agent Machine Configuration (GCArcService) ; l'extension AzurePolicyforWindows est destinée aux machines virtuelles Azure." }
    references:
      - title: Azure Machine Configuration (guest configuration) - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/guest-configuration
      - title: Overview of the Azure Connected Machine agent - Azure Arc
        url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/agent-overview
