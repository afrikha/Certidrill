  # ------------------------------------------------------------------ 8
  - id: sc500-qz-44-08
    objective: "4.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys uses Microsoft Defender XDR, Microsoft Sentinel and Microsoft Security Copilot. An administrator named **Admin1** is explicitly assigned the Copilot owner role and holds the Security Reader role in Microsoft Entra ID.

        The SOC has the following requirements:

        - The Threat Intelligence Briefing Agent must deliver a briefing every Monday at 08:00.
        - Analysts must use the Security Analyst Agent to analyze Microsoft Sentinel data, and each analyst must get results only from the data that the analyst can already read.

        The solution must follow the principle of least privilege.

        How should you complete the plan? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys utilise Microsoft Defender XDR, Microsoft Sentinel et Microsoft Security Copilot. Un administrateur nommé **Admin1** a une attribution explicite du rôle Copilot owner et détient le rôle Security Reader dans Microsoft Entra ID.

        Le SOC a les exigences suivantes :

        - Le Threat Intelligence Briefing Agent doit fournir un briefing chaque lundi à 8 h 00.
        - Les analystes doivent utiliser le Security Analyst Agent pour analyser les données Microsoft Sentinel, et chaque analyste ne doit obtenir des résultats qu'à partir des données qu'il peut déjà lire.

        La solution doit respecter le principe du moindre privilège.

        Comment devez-vous compléter le plan ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To set up the Threat Intelligence Briefing Agent, Admin1 also needs [[role]].
          During setup, the briefing agent is configured to run [[trig]].
          For the Security Analyst Agent, [[sa]].
        fr: |
          Pour configurer le Threat Intelligence Briefing Agent, Admin1 a aussi besoin [[role]].
          Lors de la configuration, l'agent de briefing est configuré pour s'exécuter [[trig]].
          Pour le Security Analyst Agent, [[sa]].
      slots:
        - id: role
          options:
            - { id: none, text: { en: "no other role, because Copilot owner is enough", fr: "d'aucun autre rôle, car Copilot owner suffit" } }
            - { id: secop, text: { en: "the Security Operator role", fr: "du rôle Security Operator" } }
            - { id: secadm, text: { en: "the Security Administrator role", fr: "du rôle Security Administrator" } }
            - { id: ga, text: { en: "the Global Administrator role", fr: "du rôle Global Administrator" } }
        - id: trig
          options:
            - { id: interval, text: { en: "at a time interval set during setup", fr: "à un intervalle de temps défini lors de la configuration" } }
            - { id: incident, text: { en: "each time a new incident is created", fr: "chaque fois qu'un nouvel incident est créé" } }
            - { id: onetime, text: { en: "only when an analyst selects One time", fr: "uniquement quand un analyste sélectionne One time" } }
        - id: sa
          options:
            - { id: shared, text: { en: "Admin1 creates one agent identity that all analysts share", fr: "Admin1 crée une identité d'agent que tous les analystes partagent" } }
            - { id: own, text: { en: "each analyst configures it and runs it under their own identity", fr: "chaque analyste le configure et l'exécute sous sa propre identité" } }
            - { id: admin, text: { en: "Admin1 assigns the Admin1 user account to the agent for all analysts", fr: "Admin1 attribue son propre compte d'utilisateur à l'agent pour tous les analystes" } }
    answer:
      values: { role: secadm, trig: interval, sa: own }
    explanation:
      correct:
        en: |
          The Threat Intelligence Briefing Agent is set up and managed by a Security Administrator; Copilot roles give no access to security data. It runs at the time interval configured during setup, or manually. The Security Analyst Agent is tied to the identity of each user, who configures it independently, so every analyst gets results only from the data sources that analyst can read.
        fr: |
          Le Threat Intelligence Briefing Agent est configuré et géré par un Security Administrator ; les rôles Copilot ne donnent aucun accès aux données de sécurité. Il s'exécute à l'intervalle de temps défini lors de la configuration, ou manuellement. Le Security Analyst Agent est lié à l'identité de chaque utilisateur, qui le configure de manière indépendante ; chaque analyste n'obtient donc des résultats que des sources de données qu'il peut lire.
      options:
        none: { en: "Copilot owner controls the Security Copilot platform only; the agent's setup requires Security Administrator.", fr: "Copilot owner contrôle seulement la plateforme Security Copilot ; la configuration de l'agent exige Security Administrator." }
        ga: { en: "Global Administrator would work but is far more privileged than Security Administrator.", fr: "Global Administrator fonctionnerait, mais il est bien plus privilégié que Security Administrator." }
        incident: { en: "The briefing agent runs on a time interval or manually; an event trigger such as each new alert belongs to the Security Alert Triage Agent.", fr: "L'agent de briefing s'exécute à intervalle de temps ou manuellement ; un déclencheur sur événement comme chaque nouvelle alerte est celui du Security Alert Triage Agent." }
        shared: { en: "A shared identity would give every analyst the same access, not the analyst's own.", fr: "Une identité partagée donnerait à chaque analyste le même accès, pas le sien propre." }
        admin: { en: "Every analyst would see what Admin1 can read instead of their own data.", fr: "Chaque analyste verrait ce que peut lire Admin1, au lieu de ses propres données." }
    references:
      - title: Deploy AI agents in Microsoft Defender
        url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-agents-defender

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-44-09
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso uses Microsoft Security Copilot. The **Plugin settings** page shows the following configuration:

        | Setting | Value |
        | --- | --- |
        | Who can add and manage their own custom plugins (user scope) | Contributors and Owners |
        | Who can add and manage custom plugins for everyone in the organization (tenant scope) | Owners only |
        | Preinstalled plugin availability | All users |

        A Copilot owner named **Owner1** adds two custom plugins: **P1**, which Owner1 makes available to just Owner1, and **P2**, which Owner1 makes available to anyone in the organization. A Copilot contributor named **User3** adds a custom plugin named **P3** for personal use.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise Microsoft Security Copilot. La page **Plugin settings** affiche la configuration suivante :

        | Paramètre | Valeur |
        | --- | --- |
        | Who can add and manage their own custom plugins (étendue utilisateur) | Contributors and Owners |
        | Who can add and manage custom plugins for everyone in the organization (étendue locataire) | Owners only |
        | Preinstalled plugin availability | All users |

        Un Copilot owner nommé **Owner1** ajoute deux plug-ins personnalisés : **P1**, qu'Owner1 rend disponible pour lui seul, et **P2**, qu'Owner1 rend disponible pour toute l'organisation. Un Copilot contributor nommé **User3** ajoute un plug-in personnalisé nommé **P3** pour son usage personnel.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              The other Copilot owners of the workspace can use P1 in their sessions.
            fr: |
              Les autres Copilot owner de l'espace de travail peuvent utiliser P1 dans leurs sessions.
        - id: s2
          text:
            en: |
              User3 can turn P2 off for User3's own sessions.
            fr: |
              User3 peut désactiver P2 pour ses propres sessions.
        - id: s3
          text:
            en: |
              User3 can update the manifest of P2 because User3 is allowed to manage custom plugins at the user scope.
            fr: |
              User3 peut mettre à jour le manifeste de P2, car User3 est autorisé à gérer des plug-ins personnalisés à l'étendue utilisateur.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A plugin that its owner makes available to just themselves gets a private tag and isn't available to other users, owners included. A plugin made available to anyone in the organization can be accessed, turned on or off and used by every Security Copilot user, but only owners can modify it, and custom plugins created by owners aren't editable by contributors. The user scope only lets User3 add and manage User3's own plugins, such as P3.
        fr: |
          Un plug-in que son propriétaire rend disponible pour lui seul reçoit une balise privée et n'est pas disponible pour les autres utilisateurs, propriétaires compris. Un plug-in rendu disponible pour toute l'organisation peut être consulté, activé ou désactivé et utilisé par chaque utilisateur de Security Copilot, mais seuls les propriétaires peuvent le modifier, et les plug-ins personnalisés créés par des propriétaires ne sont pas modifiables par les contributeurs. L'étendue utilisateur permet seulement à User3 d'ajouter et de gérer ses propres plug-ins, comme P3.
      options:
        s1: { en: "P1 is private to Owner1; being an owner doesn't give access to another owner's private plugin.", fr: "P1 est privé à Owner1 ; être propriétaire ne donne pas accès au plug-in privé d'un autre propriétaire." }
        s3: { en: "The user scope covers User3's own plugins; plugins created by owners can be modified only by owners.", fr: "L'étendue utilisateur couvre les plug-ins de User3 ; les plug-ins créés par des propriétaires ne peuvent être modifiés que par des propriétaires." }
    references:
      - title: Manage plugins in Microsoft Security Copilot
        url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-44-10
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware uses Microsoft Security Copilot with two workspaces: **WS-SOC**, the oldest workspace of the tenant, and **WS-Lab**. Audit logging of Security Copilot activity to Microsoft Purview is turned on.

        A user named **UserA** holds no Microsoft Entra role. UserA is explicitly assigned the Copilot owner role in WS-Lab and has no role assignment in WS-SOC. Contributors of both workspaces are currently allowed to upload files.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware utilise Microsoft Security Copilot avec deux espaces de travail : **WS-SOC**, le plus ancien espace de travail du locataire, et **WS-Lab**. La journalisation d'audit de l'activité de Security Copilot vers Microsoft Purview est activée.

        Une utilisatrice nommée **UserA** ne détient aucun rôle Microsoft Entra. UserA a une attribution explicite du rôle Copilot owner dans WS-Lab et n'a aucune attribution de rôle dans WS-SOC. Les contributeurs des deux espaces de travail sont actuellement autorisés à charger des fichiers.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              UserA can restrict file uploads in WS-Lab to owners only, and contributors of WS-SOC can still upload files afterward.
            fr: |
              UserA peut réserver le chargement de fichiers aux propriétaires dans WS-Lab, et les contributeurs de WS-SOC peuvent toujours charger des fichiers ensuite.
        - id: s2
          text:
            en: |
              UserA can change the data sharing settings of WS-SOC, because WS-SOC is the default workspace of the tenant.
            fr: |
              UserA peut modifier les paramètres de partage des données de WS-SOC, car WS-SOC est l'espace de travail par défaut du locataire.
        - id: s3
          text:
            en: |
              UserA can turn off the audit logging of Security Copilot activity for WS-Lab only.
            fr: |
              UserA peut désactiver la journalisation d'audit de l'activité de Security Copilot pour WS-Lab uniquement.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Copilot roles are workspace-specific: as owner of WS-Lab, UserA configures the settings of WS-Lab only, and the file upload permission applies to that workspace without affecting WS-SOC. Being the default workspace doesn't give UserA any right in WS-SOC. Audit logging is the exception among owner settings: it applies tenant-wide across all workspaces and only a Security Administrator can change it.
        fr: |
          Les rôles Copilot sont propres à chaque espace de travail : en tant que propriétaire de WS-Lab, UserA configure uniquement les paramètres de WS-Lab, et l'autorisation de chargement de fichiers s'applique à cet espace sans affecter WS-SOC. Le fait d'être l'espace de travail par défaut ne donne à UserA aucun droit dans WS-SOC. La journalisation d'audit est l'exception parmi les paramètres de propriétaire : elle s'applique à tout le locataire, sur tous les espaces de travail, et seul un Security Administrator peut la modifier.
      options:
        s2: { en: "UserA has no role in WS-SOC; the default workspace only receives the embedded experiences' traffic.", fr: "UserA n'a aucun rôle dans WS-SOC ; l'espace de travail par défaut reçoit seulement le trafic des expériences intégrées." }
        s3: { en: "Audit logging is a tenant-wide setting that only a Security Administrator can change; it can't be set per workspace.", fr: "La journalisation d'audit est un paramètre à l'échelle du locataire que seul un Security Administrator peut modifier ; elle ne se définit pas par espace de travail." }
    references:
      - title: Configure workspace access and settings
        url: https://learn.microsoft.com/en-us/training/modules/configure-security-copilot-workspaces/4-configure-workspace-access-settings
      - title: Understand authentication in Microsoft Security Copilot
        url: https://learn.microsoft.com/en-us/copilot/security/authentication
