chapter: 44-security-copilot
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-44-01
    objective: "4.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso uses Microsoft Security Copilot with a single workspace. You need to give the members of a security group named **SOC-Tier2** the Copilot contributor role.

        Where should you make the assignment?
      fr: |
        Contoso utilise Microsoft Security Copilot avec un seul espace de travail. Vous devez donner aux membres d'un groupe de sécurité nommé **SOC-Tier2** le rôle Copilot contributor.

        Où devez-vous effectuer l'attribution ?
    body:
      options:
        - { id: a, text: { en: "In the Microsoft Entra admin center, under Roles and administrators", fr: "Dans le centre d'administration Microsoft Entra, sous Rôles et administrateurs" } }
        - { id: b, text: { en: "In the Azure portal, under Access control (IAM) of the Security Copilot capacity", fr: "Dans le portail Azure, sous Contrôle d'accès (IAM) de la capacité Security Copilot" } }
        - { id: c, text: { en: "In the Security Copilot portal, under Role assignment in the home menu", fr: "Dans le portail Security Copilot, sous Role assignment dans le menu d'accueil" } }
        - { id: d, text: { en: "In the Microsoft Defender portal, under Permissions for Defender XDR roles", fr: "Dans le portail Microsoft Defender, sous Autorisations pour les rôles Defender XDR" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Copilot owner and Copilot contributor are roles of the Security Copilot platform, not Microsoft Entra roles. You assign them in the Security Copilot portal: home menu > **Role assignment** > **Add members**, then select the group and the role.
        fr: |
          Copilot owner et Copilot contributor sont des rôles de la plateforme Security Copilot, pas des rôles Microsoft Entra. Vous les attribuez dans le portail Security Copilot : menu d'accueil > **Role assignment** > **Add members**, puis vous sélectionnez le groupe et le rôle.
      options:
        a: { en: "The Copilot roles aren't Microsoft Entra roles, so they aren't listed under Roles and administrators.", fr: "Les rôles Copilot ne sont pas des rôles Microsoft Entra ; ils ne figurent donc pas sous Rôles et administrateurs." }
        b: { en: "Azure roles on the capacity control who manages the Azure resource, not who can use Security Copilot.", fr: "Les rôles Azure sur la capacité déterminent qui gère la ressource Azure, pas qui peut utiliser Security Copilot." }
        d: { en: "Custom Defender XDR roles can include a Security Copilot permission, but the Copilot contributor role itself is assigned in the Security Copilot portal.", fr: "Des rôles Defender XDR personnalisés peuvent inclure une autorisation Security Copilot, mais le rôle Copilot contributor lui-même s'attribue dans le portail Security Copilot." }
    references:
      - title: Understand authentication in Microsoft Security Copilot
        url: https://learn.microsoft.com/en-us/copilot/security/authentication

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-44-02
    objective: "4.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a Security Copilot workspace named **WS-SOC** that uses a capacity named **Cap-SOC** with 5 provisioned SCUs. You are creating a second workspace named **WS-Lab** for testing, and you planned to select Cap-SOC for it so that both workspaces draw on the same SCUs. WS-SOC must keep working.

        How should you provide capacity to WS-Lab?
      fr: |
        Northwind Traders dispose d'un espace de travail Security Copilot nommé **WS-SOC** qui utilise une capacité nommée **Cap-SOC** de 5 SCU provisionnées. Vous créez un second espace de travail nommé **WS-Lab** pour les tests, et vous aviez prévu de sélectionner Cap-SOC pour qu'il puise dans les mêmes SCU. WS-SOC doit continuer à fonctionner.

        Comment devez-vous fournir de la capacité à WS-Lab ?
    body:
      options:
        - { id: a, text: { en: "Select Cap-SOC for WS-Lab, because one capacity can serve several workspaces.", fr: "Sélectionner Cap-SOC pour WS-Lab, car une capacité peut servir plusieurs espaces de travail." } }
        - { id: b, text: { en: "Raise the overage SCUs of Cap-SOC, and then select Cap-SOC for WS-Lab.", fr: "Augmenter les SCU de dépassement de Cap-SOC, puis sélectionner Cap-SOC pour WS-Lab." } }
        - { id: c, text: { en: "Create WS-Lab without a capacity, so that it uses the capacity of WS-SOC.", fr: "Créer WS-Lab sans capacité, afin qu'il utilise la capacité de WS-SOC." } }
        - { id: d, text: { en: "Select Create new capacity for WS-Lab, because a capacity serves one workspace.", fr: "Sélectionner Create new capacity pour WS-Lab, car une capacité sert un seul espace de travail." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A capacity can be used by only one workspace at a time; when the existing capacity is already allocated, you create a new one. The association can be changed later, but moving Cap-SOC to WS-Lab would leave WS-SOC without capacity, and a workspace always needs a capacity to work.
        fr: |
          Une capacité ne peut être utilisée que par un seul espace de travail à la fois ; quand la capacité existante est déjà allouée, vous en créez une nouvelle. L'association peut être modifiée plus tard, mais déplacer Cap-SOC vers WS-Lab laisserait WS-SOC sans capacité, et un espace de travail a toujours besoin d'une capacité pour fonctionner.
      options:
        a: { en: "A capacity is used by one workspace at a time; it can't be shared by WS-SOC and WS-Lab.", fr: "Une capacité est utilisée par un seul espace de travail à la fois ; WS-SOC et WS-Lab ne peuvent pas la partager." }
        b: { en: "Overage adds SCUs to the same capacity but doesn't let a second workspace use it.", fr: "Le dépassement ajoute des SCU à la même capacité, mais ne permet pas à un second espace de travail de l'utiliser." }
        c: { en: "A workspace must always have its own assigned capacity; it doesn't borrow the capacity of another workspace.", fr: "Un espace de travail doit toujours avoir sa propre capacité attribuée ; il n'emprunte pas la capacité d'un autre espace de travail." }
    references:
      - title: Create a Security Copilot workspace
        url: https://learn.microsoft.com/en-us/training/modules/configure-security-copilot-workspaces/3-create-workspace

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-44-03
    objective: "4.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has two Security Copilot workspaces, **WS-SOC** and **WS-Hunt**. You are a Copilot owner of both workspaces. You added a custom Security Copilot plugin named **TI-Lookup** in WS-SOC and made it available to everyone. The threat hunters are Copilot contributors in WS-Hunt only, and they don't see TI-Lookup in their sessions.

        The hunters must use TI-Lookup in WS-Hunt. They must not receive additional permissions.

        What should you do?
      fr: |
        Litware dispose de deux espaces de travail Security Copilot, **WS-SOC** et **WS-Hunt**. Vous êtes Copilot owner des deux espaces de travail. Vous avez ajouté un plug-in Security Copilot personnalisé nommé **TI-Lookup** dans WS-SOC et l'avez rendu disponible pour tout le monde. Les chasseurs de menaces sont Copilot contributor dans WS-Hunt uniquement, et ils ne voient pas TI-Lookup dans leurs sessions.

        Les chasseurs doivent utiliser TI-Lookup dans WS-Hunt. Ils ne doivent pas recevoir d'autorisations supplémentaires.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In WS-SOC, set the preinstalled plugin availability to All users.", fr: "Dans WS-SOC, définir la disponibilité des plug-ins préinstallés sur All users." } }
        - { id: b, text: { en: "Add TI-Lookup in WS-Hunt and make it available to everyone there.", fr: "Ajouter TI-Lookup dans WS-Hunt et l'y rendre disponible pour tout le monde." } }
        - { id: c, text: { en: "In WS-Hunt, let Contributors and Owners add custom plugins for everyone.", fr: "Dans WS-Hunt, permettre aux Contributors and Owners d'ajouter des plug-ins personnalisés pour tout le monde." } }
        - { id: d, text: { en: "Add the hunters to the Copilot contributor role of WS-SOC.", fr: "Ajouter les chasseurs au rôle Copilot contributor de WS-SOC." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Plugin decisions apply only to the workspace where they are made: enabling or adding a plugin in WS-SOC doesn't make it available in WS-Hunt. Adding TI-Lookup in WS-Hunt for everyone gives the hunters the plugin without changing their role.
        fr: |
          Les décisions relatives aux plug-ins ne s'appliquent qu'à l'espace de travail où elles sont prises : activer ou ajouter un plug-in dans WS-SOC ne le rend pas disponible dans WS-Hunt. Ajouter TI-Lookup dans WS-Hunt pour tout le monde donne le plug-in aux chasseurs sans modifier leur rôle.
      options:
        a: { en: "This setting governs preinstalled plugins, not custom ones, and it applies to WS-SOC, not WS-Hunt.", fr: "Ce paramètre régit les plug-ins préinstallés, pas les plug-ins personnalisés, et il s'applique à WS-SOC, pas à WS-Hunt." }
        c: { en: "This gives the contributors a new permission and still doesn't add TI-Lookup to WS-Hunt.", fr: "Cela donne une nouvelle autorisation aux contributeurs et n'ajoute toujours pas TI-Lookup dans WS-Hunt." }
        d: { en: "A role in WS-SOC is an additional permission, and the hunters would use the plugin in WS-SOC, not in WS-Hunt.", fr: "Un rôle dans WS-SOC est une autorisation supplémentaire, et les chasseurs utiliseraient le plug-in dans WS-SOC, pas dans WS-Hunt." }
    references:
      - title: Configure workspace access and settings
        url: https://learn.microsoft.com/en-us/training/modules/configure-security-copilot-workspaces/4-configure-workspace-access-settings
      - title: Manage plugins in Microsoft Security Copilot
        url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-44-04
    objective: "4.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses Microsoft Security Copilot. In **Plugin settings**, both custom plugin scopes are set to **Contributors and Owners**. A Copilot owner named **Owner1** added a custom plugin named **ThreatFeed** and made it available to anyone in the organization.

        The internal API that ThreatFeed calls moves to a new URL, which is defined in the plugin manifest. **User7**, a Copilot contributor who maintains the API, has the updated manifest file.

        You need to update ThreatFeed for every user.

        What should you do?
      fr: |
        Fabrikam utilise Microsoft Security Copilot. Dans **Plugin settings**, les deux étendues de plug-ins personnalisés sont définies sur **Contributors and Owners**. Un Copilot owner nommé **Owner1** a ajouté un plug-in personnalisé nommé **ThreatFeed** et l'a rendu disponible pour toute l'organisation.

        L'API interne qu'appelle ThreatFeed passe à une nouvelle URL, définie dans le manifeste du plug-in. **User7**, un Copilot contributor qui maintient l'API, dispose du fichier manifeste mis à jour.

        Vous devez mettre à jour ThreatFeed pour tous les utilisateurs.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "User7 selects the gear icon of ThreatFeed, selects Edit file and saves the new manifest.", fr: "User7 sélectionne l'icône d'engrenage de ThreatFeed, sélectionne Edit file et enregistre le nouveau manifeste." } }
        - { id: b, text: { en: "User7 runs Set up for ThreatFeed again and enters the new URL in the settings.", fr: "User7 relance Set up pour ThreatFeed et saisit la nouvelle URL dans les paramètres." } }
        - { id: c, text: { en: "An owner selects the gear icon of ThreatFeed, selects Edit file and saves the new manifest.", fr: "Un propriétaire sélectionne l'icône d'engrenage de ThreatFeed, sélectionne Edit file et enregistre le nouveau manifeste." } }
        - { id: d, text: { en: "User7 turns ThreatFeed off and on again so that the plugin reloads its manifest.", fr: "User7 désactive puis réactive ThreatFeed pour que le plug-in recharge son manifeste." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A plugin that an owner adds for everyone in the organization can be used and turned on or off by all users, but only owners can modify it: custom plugins created by owners aren't editable by contributors, whatever the custom plugin scopes. An owner opens the gear icon beside the plugin in the **Custom** section, selects **Edit file**, saves and confirms.
        fr: |
          Un plug-in qu'un propriétaire ajoute pour toute l'organisation peut être utilisé, activé ou désactivé par tous les utilisateurs, mais seuls les propriétaires peuvent le modifier : les plug-ins personnalisés créés par des propriétaires ne sont pas modifiables par les contributeurs, quelles que soient les étendues de plug-ins personnalisés. Un propriétaire ouvre l'icône d'engrenage à côté du plug-in dans la section **Custom**, sélectionne **Edit file**, enregistre et confirme.
      options:
        a: { en: "Contributors can't edit custom plugins created by owners, even when they may add their own plugins.", fr: "Les contributeurs ne peuvent pas modifier les plug-ins personnalisés créés par des propriétaires, même s'ils peuvent ajouter leurs propres plug-ins." }
        b: { en: "Setup values are configured per user, and the URL is in the manifest, which Set up doesn't change.", fr: "Les valeurs de configuration se définissent par utilisateur, et l'URL est dans le manifeste, que Set up ne modifie pas." }
        d: { en: "The toggle only turns the plugin on or off for the user's sessions; it doesn't change the manifest.", fr: "Le bouton bascule active ou désactive seulement le plug-in pour les sessions de l'utilisateur ; il ne modifie pas le manifeste." }
    references:
      - title: Manage plugins in Microsoft Security Copilot
        url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-44-05
    objective: "4.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso set up the Threat Intelligence Briefing Agent in Microsoft Security Copilot with an agent identity. The agent runs automatically every Monday, and analysts have given it feedback that is stored in its memory.

        During a three-week change freeze, the agent must not run. After the freeze, it must run again with the same parameters and memory. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso a configuré le Threat Intelligence Briefing Agent dans Microsoft Security Copilot avec une identité d'agent. L'agent s'exécute automatiquement chaque lundi, et les analystes lui ont donné des commentaires stockés dans sa mémoire.

        Pendant un gel des modifications de trois semaines, l'agent ne doit pas s'exécuter. Après le gel, il doit de nouveau s'exécuter avec les mêmes paramètres et la même mémoire. La solution doit réduire l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Pause the agent from its page, and turn it back on after the freeze.", fr: "Suspendre l'agent depuis sa page, puis le réactiver après le gel." } }
        - { id: b, text: { en: "Delete the agent identity, and create a new one after the freeze.", fr: "Supprimer l'identité de l'agent, puis en créer une nouvelle après le gel." } }
        - { id: c, text: { en: "Open Manage memory, and select Reject feedback for each item.", fr: "Ouvrir Manage memory, puis sélectionner Reject feedback pour chaque élément." } }
        - { id: d, text: { en: "Edit the agent, and assign an existing user account as its identity.", fr: "Modifier l'agent, puis lui attribuer un compte d'utilisateur existant comme identité." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          An agent that doesn't need to be active can be paused, which stops its operations temporarily without removing its configuration. Its parameters, identity and memory stay in place, so the agent can run again on its trigger after the freeze.
        fr: |
          Un agent qui n'a pas besoin d'être actif peut être suspendu, ce qui arrête temporairement ses opérations sans supprimer sa configuration. Ses paramètres, son identité et sa mémoire restent en place ; l'agent peut donc de nouveau s'exécuter sur son déclencheur après le gel.
      options:
        b: { en: "Deleting the identity breaks the agent's access and forces a new setup; it isn't a way to suspend it.", fr: "Supprimer l'identité coupe les accès de l'agent et impose une nouvelle configuration ; ce n'est pas un moyen de le suspendre." }
        c: { en: "Reject feedback removes items from the agent's memory, which the requirement says to keep, and the agent still runs.", fr: "Reject feedback retire des éléments de la mémoire de l'agent, que l'exigence demande de conserver, et l'agent s'exécute toujours." }
        d: { en: "Changing the identity changes the account the agent runs under; the agent keeps running on its schedule.", fr: "Changer l'identité change le compte sous lequel l'agent s'exécute ; l'agent continue de s'exécuter selon sa planification." }
    references:
      - title: Setup and manage Security Copilot agents
        url: https://learn.microsoft.com/en-us/copilot/security/agents-manage

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-44-06
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum uses Microsoft Security Copilot with one workspace named **WS-SOC**. Its capacity, **Cap-SOC**, has 8 provisioned SCUs that the SOC consumes almost entirely during business hours. You are a Security Administrator in Microsoft Entra ID and an Owner of the Azure subscription that contains Cap-SOC.

        The members of a group named **Lab-Eng** must test experimental plugins and choose the data sharing settings of a new sandbox workspace named **WS-Lab**. Lab-Eng must have no administrative rights in WS-SOC, and the lab must not consume the SCUs of Cap-SOC. The solution must follow the principle of least privilege.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum utilise Microsoft Security Copilot avec un espace de travail nommé **WS-SOC**. Sa capacité, **Cap-SOC**, compte 8 SCU provisionnées que le SOC consomme presque entièrement pendant les heures ouvrées. Vous êtes Security Administrator dans Microsoft Entra ID et Owner de l'abonnement Azure qui contient Cap-SOC.

        Les membres d'un groupe nommé **Lab-Eng** doivent tester des plug-ins expérimentaux et choisir les paramètres de partage des données d'un nouvel espace de travail de bac à sable nommé **WS-Lab**. Lab-Eng ne doit avoir aucun droit d'administration dans WS-SOC, et le laboratoire ne doit pas consommer les SCU de Cap-SOC. La solution doit respecter le principe du moindre privilège.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create WS-Lab and select Create new capacity during its creation.", fr: "Créer WS-Lab et sélectionner Create new capacity lors de sa création." } }
        - { id: b, text: { en: "Create WS-Lab and associate Cap-SOC with it during its creation.", fr: "Créer WS-Lab et lui associer Cap-SOC lors de sa création." } }
        - { id: c, text: { en: "Add Lab-Eng to the Copilot owner role in WS-SOC.", fr: "Ajouter Lab-Eng au rôle Copilot owner dans WS-SOC." } }
        - { id: d, text: { en: "Add Lab-Eng to the Copilot owner role in WS-Lab.", fr: "Ajouter Lab-Eng au rôle Copilot owner dans WS-Lab." } }
        - { id: e, text: { en: "Assign Lab-Eng the Security Administrator role in Microsoft Entra ID.", fr: "Attribuer à Lab-Eng le rôle Security Administrator dans Microsoft Entra ID." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          WS-Lab needs its own capacity, because a capacity serves one workspace at a time and the lab must not draw on Cap-SOC. Plugin management and data sharing are owner settings that apply to the workspace being configured, and the owner role is workspace-specific: Copilot owner in WS-Lab gives Lab-Eng these rights in the sandbox only.
        fr: |
          WS-Lab a besoin de sa propre capacité, car une capacité sert un seul espace de travail à la fois et le laboratoire ne doit pas puiser dans Cap-SOC. La gestion des plug-ins et le partage des données sont des paramètres de propriétaire qui s'appliquent à l'espace de travail configuré, et le rôle de propriétaire est propre à chaque espace de travail : Copilot owner dans WS-Lab donne ces droits à Lab-Eng dans le bac à sable uniquement.
      options:
        b: { en: "Cap-SOC can serve only one workspace at a time: moving it to WS-Lab would leave WS-SOC without capacity, and the lab would use the SOC's SCUs.", fr: "Cap-SOC ne peut servir qu'un seul espace de travail à la fois : la déplacer vers WS-Lab laisserait WS-SOC sans capacité, et le laboratoire utiliserait les SCU du SOC." }
        c: { en: "Owner in WS-SOC gives Lab-Eng administrative rights in the SOC workspace, which is forbidden, and nothing in WS-Lab.", fr: "Owner dans WS-SOC donne à Lab-Eng des droits d'administration dans l'espace du SOC, ce qui est interdit, et rien dans WS-Lab." }
        e: { en: "Security Administrator is a tenant-wide Microsoft Entra role that makes its holders Copilot owners by default, including in WS-SOC.", fr: "Security Administrator est un rôle Microsoft Entra à l'échelle du locataire qui fait de ses détenteurs des Copilot owner par défaut, y compris dans WS-SOC." }
    references:
      - title: Plan a workspace deployment
        url: https://learn.microsoft.com/en-us/training/modules/configure-security-copilot-workspaces/2-plan-workspace-deployment
      - title: Create a Security Copilot workspace
        url: https://learn.microsoft.com/en-us/training/modules/configure-security-copilot-workspaces/3-create-workspace

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-44-07
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank uses Microsoft Security Copilot with one workspace named **WS-Global**. Its data storage location is the United States, its prompts are evaluated anywhere with available capacity, and it uses a capacity named **Cap-Global**. WS-Global must keep serving the other teams without any change.

        The Swiss private banking unit will use Security Copilot under the following requirements:

        - Session data must be stored at rest in Switzerland.
        - Prompts must never be evaluated outside Switzerland.
        - During month-end closing, prompts must still be served after the provisioned SCUs run out, but the extra spending must have a fixed ceiling.

        How should you configure Security Copilot for the unit? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank utilise Microsoft Security Copilot avec un espace de travail nommé **WS-Global**. Son emplacement de stockage des données est les États-Unis, ses invites sont évaluées n'importe où avec de la capacité disponible, et il utilise une capacité nommée **Cap-Global**. WS-Global doit continuer à servir les autres équipes sans aucune modification.

        L'unité suisse de banque privée utilisera Security Copilot selon les exigences suivantes :

        - Les données de session doivent être stockées au repos en Suisse.
        - Les invites ne doivent jamais être évaluées hors de Suisse.
        - Pendant la clôture de fin de mois, les invites doivent encore être servies une fois les SCU provisionnées épuisées, mais les dépenses supplémentaires doivent avoir un plafond fixe.

        Comment devez-vous configurer Security Copilot pour l'unité ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Workspace: [[ws]]
          Prompt evaluation location: [[eval]]
          Capacity of the unit: [[over]]
        fr: |
          Espace de travail : [[ws]]
          Emplacement d'évaluation des invites : [[eval]]
          Capacité de l'unité : [[over]]
      slots:
        - id: ws
          options:
            - { id: editglobal, text: { en: "Change the data storage location of WS-Global to Switzerland", fr: "Changer l'emplacement de stockage des données de WS-Global en Suisse" } }
            - { id: newch, text: { en: "Create a new workspace with Switzerland as the data storage location", fr: "Créer un nouvel espace de travail avec la Suisse comme emplacement de stockage des données" } }
            - { id: neweu, text: { en: "Create a new workspace with Europe as the data storage location", fr: "Créer un nouvel espace de travail avec l'Europe comme emplacement de stockage des données" } }
        - id: eval
          options:
            - { id: anywhere, text: { en: "Evaluate anywhere with available capacity", fr: "Evaluate anywhere with available capacity" } }
            - { id: geo, text: { en: "The geography of the data storage location", fr: "La géographie de l'emplacement de stockage des données" } }
        - id: over
          options:
            - { id: noover, text: { en: "Provisioned SCUs only, with no overage", fr: "SCU provisionnées uniquement, sans dépassement" } }
            - { id: unlimited, text: { en: "Provisioned SCUs plus unlimited overage", fr: "SCU provisionnées plus un dépassement illimité" } }
            - { id: maxover, text: { en: "Provisioned SCUs plus overage with a maximum", fr: "SCU provisionnées plus un dépassement plafonné" } }
    answer:
      values: { ws: newch, eval: geo, over: maxover }
    explanation:
      correct:
        en: |
          The data storage location is immutable after a workspace is created, so the unit needs a new workspace whose storage location is Switzerland. Prompt evaluation must stay in the geography of the data storage location, because "Evaluate anywhere" routes prompts to the least busy datacenter worldwide. Overage SCUs are used only when provisioned SCUs run out and can be set to a maximum, which keeps service at month-end with a ceiling on spending.
        fr: |
          L'emplacement de stockage des données est immuable après la création d'un espace de travail ; l'unité a donc besoin d'un nouvel espace de travail dont l'emplacement de stockage est la Suisse. L'évaluation des invites doit rester dans la géographie de l'emplacement de stockage, car « Evaluate anywhere » achemine les invites vers le centre de données le moins chargé dans le monde. Les SCU de dépassement ne servent que lorsque les SCU provisionnées sont épuisées et peuvent être plafonnées, ce qui maintient le service en fin de mois avec un plafond de dépenses.
      options:
        editglobal: { en: "The data storage location can't be changed after creation, and WS-Global must stay unchanged.", fr: "L'emplacement de stockage des données ne peut pas être modifié après la création, et WS-Global doit rester inchangé." }
        neweu: { en: "Switzerland is a storage geography of its own, distinct from Europe (EU).", fr: "La Suisse est une géographie de stockage à part entière, distincte de l'Europe (UE)." }
        noover: { en: "Without overage, requests stop when the provisioned SCUs run out.", fr: "Sans dépassement, les requêtes s'arrêtent quand les SCU provisionnées sont épuisées." }
        unlimited: { en: "Unlimited overage keeps the service running but has no spending ceiling.", fr: "Un dépassement illimité maintient le service mais n'a pas de plafond de dépenses." }
    references:
      - title: Create a Security Copilot workspace
        url: https://learn.microsoft.com/en-us/training/modules/configure-security-copilot-workspaces/3-create-workspace
      - title: Microsoft Security Copilot Security Compute Units and capacity
