chapter: 23-network-security
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-23-01
    objective: "2.3.9"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam must keep a history of the flows that were allowed or denied in a virtual network named **VNet-Pay**, by NSG rules and by Azure Virtual Network Manager security admin rules, with the rule that decided each flow. No flow logging is configured yet.

        What should you enable?
      fr: |
        Fabrikam doit conserver un historique des flux autorisés ou refusés dans un réseau virtuel nommé **VNet-Pay**, par les règles des NSG et par les règles d'administration de la sécurité d'Azure Virtual Network Manager, avec la règle qui a décidé de chaque flux. Aucune journalisation des flux n'est encore configurée.

        Que devez-vous activer ?
    body:
      options:
        - { id: a, text: { en: "NSG flow logs on each NSG of VNet-Pay", fr: "Des journaux de flux NSG sur chaque NSG de VNet-Pay" } }
        - { id: b, text: { en: "A Connection Monitor test for each subnet of VNet-Pay", fr: "Un test du Moniteur de connexion pour chaque sous-réseau de VNet-Pay" } }
        - { id: c, text: { en: "Virtual network flow logs on VNet-Pay", fr: "Des journaux de flux de réseau virtuel sur VNet-Pay" } }
        - { id: d, text: { en: "IP flow verify for each virtual machine of VNet-Pay", fr: "La vérification des flux IP pour chaque machine virtuelle de VNet-Pay" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Virtual network flow logs are enabled once at the virtual network level and record the layer 4 flows of its workloads, with the flow state and the rule that allowed or denied each flow, including Virtual Network Manager security admin rules. The records are written to a storage account in the region of the virtual network.
        fr: |
          Les journaux de flux de réseau virtuel s'activent une seule fois au niveau du réseau virtuel et enregistrent les flux de couche 4 de ses charges de travail, avec l'état du flux et la règle qui l'a autorisé ou refusé, y compris les règles d'administration de la sécurité de Virtual Network Manager. Les enregistrements sont écrits dans un compte de stockage de la région du réseau virtuel.
      options:
        a: { en: "NSG flow logs no longer support the creation of new flow logs and retire on September 30, 2027.", fr: "Les journaux de flux NSG ne permettent plus de créer de nouveaux journaux de flux et sont mis hors service le 30 septembre 2027." }
        b: { en: "Connection Monitor runs synthetic tests between endpoints; it doesn't record the real flows and their deciding rules.", fr: "Le Moniteur de connexion exécute des tests synthétiques entre des points de terminaison ; il n'enregistre pas les flux réels ni leurs règles décisives." }
        d: { en: "IP flow verify tests one flow at the time you run it; it keeps no history.", fr: "La vérification des flux IP teste un flux au moment où vous l'exécutez ; elle ne conserve aucun historique." }
    references:
      - title: Virtual network flow logs
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
      - title: Flow logging for network security groups
        url: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-23-02
    objective: "2.3.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys plans to deploy Azure Firewall Basic in a new virtual network named **VNet-Branch**.

        Which subnets must VNet-Branch contain for the firewall?
      fr: |
        Wingtip Toys prévoit de déployer le Pare-feu Azure Basic dans un nouveau réseau virtuel nommé **VNet-Branch**.

        Quels sous-réseaux VNet-Branch doit-il contenir pour le pare-feu ?
    body:
      options:
        - { id: a, text: { en: "AzureFirewallSubnet only", fr: "AzureFirewallSubnet uniquement" } }
        - { id: b, text: { en: "AzureFirewallSubnet and GatewaySubnet", fr: "AzureFirewallSubnet et GatewaySubnet" } }
        - { id: c, text: { en: "AzureFirewallSubnet and AzureBastionSubnet", fr: "AzureFirewallSubnet et AzureBastionSubnet" } }
        - { id: d, text: { en: "AzureFirewallSubnet and AzureFirewallManagementSubnet", fr: "AzureFirewallSubnet et AzureFirewallManagementSubnet" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Every Azure Firewall Basic has a management NIC enabled, which separates management traffic from customer traffic. Besides AzureFirewallSubnet, the virtual network therefore needs a subnet named AzureFirewallManagementSubnet, of at least /26, and the firewall needs a dedicated management public IP address.
        fr: |
          Tout Pare-feu Azure Basic a une carte réseau de gestion activée, qui sépare le trafic de gestion du trafic des clients. En plus d'AzureFirewallSubnet, le réseau virtuel a donc besoin d'un sous-réseau nommé AzureFirewallManagementSubnet, d'au moins /26, et le pare-feu a besoin d'une adresse IP publique de gestion dédiée.
      options:
        a: { en: "AzureFirewallSubnet alone is enough for Standard or Premium without the management NIC, not for Basic.", fr: "AzureFirewallSubnet seul suffit pour Standard ou Premium sans carte réseau de gestion, pas pour Basic." }
        b: { en: "GatewaySubnet hosts VPN or ExpressRoute gateways; the firewall doesn't need it.", fr: "GatewaySubnet héberge les passerelles VPN ou ExpressRoute ; le pare-feu n'en a pas besoin." }
        c: { en: "AzureBastionSubnet hosts Azure Bastion; it plays no role in the firewall deployment.", fr: "AzureBastionSubnet héberge Azure Bastion ; il ne joue aucun rôle dans le déploiement du pare-feu." }
    references:
      - title: Azure Firewall Management NIC
        url: https://learn.microsoft.com/en-us/azure/firewall/management-nic

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-23-03
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a site-to-site connection named **Conn-Lyon** between a VPN gateway of SKU VpnGw2AZ and the firewall of its Lyon branch office. Conn-Lyon uses the default IPsec/IKE proposals of the gateway.

        A security audit requires the IKE phase of Conn-Lyon to use DH group 14 or stronger. The Lyon firewall supports DHGroup24.

        What should you do?
      fr: |
        Adatum dispose d'une connexion site à site nommée **Conn-Lyon** entre une passerelle VPN de SKU VpnGw2AZ et le pare-feu de sa succursale de Lyon. Conn-Lyon utilise les propositions IPsec/IKE par défaut de la passerelle.

        Un audit de sécurité exige que la phase IKE de Conn-Lyon utilise le groupe DH 14 ou plus fort. Le pare-feu de Lyon prend en charge DHGroup24.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Resize the VPN gateway to VpnGw3AZ, whose default proposals use stronger DH groups.", fr: "Redimensionner la passerelle VPN en VpnGw3AZ, dont les propositions par défaut utilisent des groupes DH plus forts." } }
        - { id: b, text: { en: "Set a custom IPsec/IKE policy on Conn-Lyon with DHGroup24 and every other IKE and IPsec value.", fr: "Définir sur Conn-Lyon une stratégie IPsec/IKE personnalisée avec DHGroup24 et toutes les autres valeurs IKE et IPsec." } }
        - { id: c, text: { en: "Set UsePolicyBasedTrafficSelectors to $True on Conn-Lyon, and then reset the VPN gateway.", fr: "Régler UsePolicyBasedTrafficSelectors sur $True sur Conn-Lyon, puis réinitialiser la passerelle VPN." } }
        - { id: d, text: { en: "Enable BGP on the local network gateway of Lyon, and advertise the branch prefixes with BGP.", fr: "Activer BGP sur la passerelle de réseau local de Lyon, et annoncer les préfixes de la succursale par BGP." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The default proposals favor interoperability and include weak DH groups such as DH Group 2. A custom IPsec/IKE policy, applied to the connection, replaces them for that connection only. Partial policies aren't allowed: you must set every IKE and IPsec algorithm and group, matching the Lyon firewall.
        fr: |
          Les propositions par défaut privilégient l'interopérabilité et incluent des groupes DH faibles comme le groupe DH 2. Une stratégie IPsec/IKE personnalisée, appliquée à la connexion, les remplace pour cette connexion uniquement. Les stratégies partielles ne sont pas autorisées : il faut définir chaque algorithme et chaque groupe IKE et IPsec, en accord avec le pare-feu de Lyon.
      options:
        a: { en: "The gateway SKU changes throughput and connection limits, not the default cryptographic proposals.", fr: "Le SKU de la passerelle change le débit et les limites de connexions, pas les propositions cryptographiques par défaut." }
        c: { en: "Policy-based traffic selectors change which prefix pairs the tunnel negotiates, not the DH group of the IKE phase.", fr: "Les sélecteurs de trafic basés sur des stratégies changent les paires de préfixes négociées par le tunnel, pas le groupe DH de la phase IKE." }
        d: { en: "BGP exchanges routes over the tunnel; it doesn't change the IKE cryptography.", fr: "BGP échange des itinéraires dans le tunnel ; il ne change pas la cryptographie IKE." }
    references:
      - title: About cryptographic requirements and Azure VPN gateways
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-compliance-crypto

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-23-04
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has two web virtual machines in the backend pool of an internal Standard Load Balancer named **lb-web**, which uses a TCP health probe on port 443. The NSG of their subnet, **nsg-web**, has the following custom inbound rules.

        | Priority | Name | Source | Port | Action |
        | --- | --- | --- | --- | --- |
        | 100 | Allow-App-443 | 10.20.0.0/16 | TCP 443 | Allow |
        | 4000 | Deny-All-In | Any | Any | Deny |

        Since Deny-All-In was added, both backends are marked as unhealthy, and the clients in 10.20.0.0/16 can no longer use the application through lb-web. You need to restore the application without allowing any other client source.

        What should you do?
      fr: |
        Contoso dispose de deux machines virtuelles web dans le pool principal d'un Standard Load Balancer interne nommé **lb-web**, qui utilise une sonde d'intégrité TCP sur le port 443. Le NSG de leur sous-réseau, **nsg-web**, a les règles personnalisées de trafic entrant suivantes.

        | Priorité | Nom | Source | Port | Action |
        | --- | --- | --- | --- | --- |
        | 100 | Allow-App-443 | 10.20.0.0/16 | TCP 443 | Allow |
        | 4000 | Deny-All-In | Any | Any | Deny |

        Depuis l'ajout de Deny-All-In, les deux serveurs principaux sont marqués comme non sains, et les clients de 10.20.0.0/16 ne peuvent plus utiliser l'application par lb-web. Vous devez rétablir l'application sans autoriser aucune autre source cliente.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add an inbound rule with priority 200 that allows TCP 443 from the AzureLoadBalancer service tag.", fr: "Ajouter une règle de trafic entrant de priorité 200 qui autorise TCP 443 depuis l'étiquette de service AzureLoadBalancer." } }
        - { id: b, text: { en: "Add an outbound rule with priority 200 that allows TCP 443 to the AzureLoadBalancer service tag.", fr: "Ajouter une règle de trafic sortant de priorité 200 qui autorise TCP 443 vers l'étiquette de service AzureLoadBalancer." } }
        - { id: c, text: { en: "Change the priority of Deny-All-In to 65100, so that it's evaluated after the default rules.", fr: "Changer la priorité de Deny-All-In en 65100, pour qu'elle soit évaluée après les règles par défaut." } }
        - { id: d, text: { en: "Replace the TCP health probe of lb-web with an HTTPS health probe on port 443.", fr: "Remplacer la sonde d'intégrité TCP de lb-web par une sonde d'intégrité HTTPS sur le port 443." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Health probes come from 168.63.129.16, which the AzureLoadBalancer service tag identifies; the default rule AllowAzureLoadBalancerInBound (65001) allows them, but Deny-All-In (4000) is processed first. With failing probes, the load balancer marks the backends as down and sends them no new flows. An Allow rule for AzureLoadBalancer with a lower priority number than 4000 restores the probes without opening the application to other clients.
        fr: |
          Les sondes d'intégrité proviennent de 168.63.129.16, que l'étiquette de service AzureLoadBalancer identifie ; la règle par défaut AllowAzureLoadBalancerInBound (65001) les autorise, mais Deny-All-In (4000) est traitée avant. Quand les sondes échouent, l'équilibreur de charge marque les serveurs principaux comme hors service et ne leur envoie plus de nouveaux flux. Une règle Allow pour AzureLoadBalancer avec un numéro de priorité inférieur à 4000 rétablit les sondes sans ouvrir l'application à d'autres clients.
      options:
        b: { en: "Probes are inbound traffic to the backends, and NSGs are stateful: an outbound rule doesn't let them in.", fr: "Les sondes sont du trafic entrant vers les serveurs principaux, et les NSG sont avec état : une règle de trafic sortant ne les laisse pas entrer." }
        c: { en: "Custom rules use priorities from 100 to 4096; a custom rule can't be placed after the default rules.", fr: "Les règles personnalisées utilisent des priorités de 100 à 4096 ; une règle personnalisée ne peut pas être placée après les règles par défaut." }
        d: { en: "An HTTPS probe still comes from 168.63.129.16 and is still denied by Deny-All-In.", fr: "Une sonde HTTPS provient toujours de 168.63.129.16 et reste refusée par Deny-All-In." }
    references:
      - title: Azure Load Balancer health probes
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-23-05
    objective: "2.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a hub virtual network named **VNet-Hub** that is peered with two spoke virtual networks, **VNet-App1** and **VNet-App2**. All the virtual networks use Azure-provided DNS. A key vault named **kv-nw-apps** has a private endpoint in VNet-Hub, registered in the private DNS zone `privatelink.vaultcore.azure.net`, which is linked to VNet-Hub only.

        After the public network access of kv-nw-apps is set to Disabled, the virtual machines in VNet-Hub still reach the vault, but those in VNet-App1 and VNet-App2 don't. Public network access must stay disabled.

        What should you do?
      fr: |
        Northwind Traders dispose d'un réseau virtuel hub nommé **VNet-Hub** relié par peering à deux réseaux virtuels spokes, **VNet-App1** et **VNet-App2**. Tous les réseaux virtuels utilisent le DNS fourni par Azure. Un coffre de clés nommé **kv-nw-apps** a un point de terminaison privé dans VNet-Hub, inscrit dans la zone DNS privée `privatelink.vaultcore.azure.net`, qui n'est liée qu'à VNet-Hub.

        Après le passage de l'accès au réseau public de kv-nw-apps sur Désactivé, les machines virtuelles de VNet-Hub atteignent toujours le coffre, mais pas celles de VNet-App1 et VNet-App2. L'accès au réseau public doit rester désactivé.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable gateway transit on the peerings between VNet-Hub and the two spokes.", fr: "Activer le transit par passerelle sur les peerings entre VNet-Hub et les deux spokes." } }
        - { id: b, text: { en: "Create a private DNS zone named vaultcore.azure.net and link it to the two spokes.", fr: "Créer une zone DNS privée nommée vaultcore.azure.net et la lier aux deux spokes." } }
        - { id: c, text: { en: "Link the zone privatelink.vaultcore.azure.net to VNet-App1 and VNet-App2.", fr: "Lier la zone privatelink.vaultcore.azure.net à VNet-App1 et VNet-App2." } }
        - { id: d, text: { en: "Add a Microsoft.KeyVault service endpoint to the subnets of the two spokes.", fr: "Ajouter un point de terminaison de service Microsoft.KeyVault aux sous-réseaux des deux spokes." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A virtual network that isn't linked to the private DNS zone resolves the vault name to its public IP address, which is now closed. Linking the same zone to every spoke that hosts clients lets Azure-provided DNS return the private IP of the endpoint, and the peering carries the traffic to VNet-Hub.
        fr: |
          Un réseau virtuel qui n'est pas lié à la zone DNS privée résout le nom du coffre en son adresse IP publique, désormais fermée. Lier la même zone à chaque spoke qui héberge des clients permet au DNS fourni par Azure de renvoyer l'adresse IP privée du point de terminaison, et le peering achemine le trafic vers VNet-Hub.
      options:
        a: { en: "Gateway transit shares a VPN or ExpressRoute gateway; the spokes already reach VNet-Hub, the problem is name resolution.", fr: "Le transit par passerelle partage une passerelle VPN ou ExpressRoute ; les spokes atteignent déjà VNet-Hub, le problème est la résolution de noms." }
        b: { en: "A zone named vaultcore.azure.net would override the public zone with records you must maintain; the recommended zone is the privatelink one.", fr: "Une zone nommée vaultcore.azure.net remplacerait la zone publique par des enregistrements à maintenir vous-même ; la zone recommandée est la zone privatelink." }
        d: { en: "A service endpoint still uses the public endpoint of the vault, which public network access Disabled blocks.", fr: "Un point de terminaison de service utilise toujours le point de terminaison public du coffre, que l'accès au réseau public Désactivé bloque." }
    references:
      - title: Azure Private Endpoint DNS Integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-23-06
    objective: "2.3.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware publishes an API to its customers through a Private Link service named **pls-api** in a virtual network named **VNet-Svc**. pls-api uses an internal Standard Load Balancer whose backend virtual machines are in the subnet **snet-api** (10.5.1.0/24). The NAT IP configuration of pls-api uses the subnet **snet-pls** (10.5.9.0/24). TCP Proxy v2 isn't enabled.

        A customer, Contoso, connects from a private endpoint with the address 10.200.4.10 in its own virtual network (10.200.0.0/16). The private endpoint connection is **Approved**, but the connections time out. The NSG of snet-api has the following inbound rules.

        | Priority | Source | Port | Action |
        | --- | --- | --- | --- |
        | 100 | 10.200.0.0/16 | TCP 443 | Allow |
        | 110 | AzureLoadBalancer | TCP 443 | Allow |
        | 4000 | Any | TCP 443 | Deny |

        Only the traffic that comes through pls-api must reach the backend virtual machines on TCP 443.

        What should you do?
      fr: |
        Litware publie une API pour ses clients par un service Private Link nommé **pls-api** dans un réseau virtuel nommé **VNet-Svc**. pls-api utilise un Standard Load Balancer interne dont les machines virtuelles principales sont dans le sous-réseau **snet-api** (10.5.1.0/24). La configuration IP NAT de pls-api utilise le sous-réseau **snet-pls** (10.5.9.0/24). TCP Proxy v2 n'est pas activé.

        Un client, Contoso, se connecte depuis un point de terminaison privé d'adresse 10.200.4.10 dans son propre réseau virtuel (10.200.0.0/16). La connexion de point de terminaison privé est **Approved**, mais les connexions expirent. Le NSG de snet-api a les règles de trafic entrant suivantes.

        | Priorité | Source | Port | Action |
        | --- | --- | --- | --- |
        | 100 | 10.200.0.0/16 | TCP 443 | Allow |
        | 110 | AzureLoadBalancer | TCP 443 | Allow |
        | 4000 | Any | TCP 443 | Deny |

        Seul le trafic qui arrive par pls-api doit atteindre les machines virtuelles principales sur TCP 443.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable TCP Proxy v2 on pls-api, so that the rule with priority 100 matches the Contoso addresses.", fr: "Activer TCP Proxy v2 sur pls-api, pour que la règle de priorité 100 corresponde aux adresses de Contoso." } }
        - { id: b, text: { en: "Change the source of the rule with priority 100 to 10.200.4.10, the address of the private endpoint.", fr: "Changer la source de la règle de priorité 100 en 10.200.4.10, l'adresse du point de terminaison privé." } }
        - { id: c, text: { en: "Change the source of the rule with priority 100 to 10.5.9.0/24, the address range of snet-pls.", fr: "Changer la source de la règle de priorité 100 en 10.5.9.0/24, la plage d'adresses de snet-pls." } }
        - { id: d, text: { en: "Disable the Private Link service network policies on snet-api, so that the NSG stops filtering pls-api.", fr: "Désactiver les stratégies réseau du service Private Link sur snet-api, pour que le NSG cesse de filtrer pls-api." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A Private Link service translates the consumer traffic: on the provider side, the NAT IP address appears as the source of every packet that the backends receive. The NSG of snet-api therefore sees sources in 10.5.9.0/24, which match only the Deny rule with priority 4000. Allowing snet-pls instead of the consumer range admits the Private Link traffic and nothing else.
        fr: |
          Un service Private Link traduit le trafic des consommateurs : côté fournisseur, l'adresse IP NAT apparaît comme source de chaque paquet que reçoivent les serveurs principaux. Le NSG de snet-api voit donc des sources dans 10.5.9.0/24, qui ne correspondent qu'à la règle Deny de priorité 4000. Autoriser snet-pls au lieu de la plage du consommateur admet le trafic Private Link et rien d'autre.
      options:
        a: { en: "TCP Proxy v2 adds a header that the application can read; the packets still carry the NAT IP as source, so the NSG still denies them.", fr: "TCP Proxy v2 ajoute un en-tête que l'application peut lire ; les paquets portent toujours l'IP NAT comme source, et le NSG les refuse donc toujours." }
        b: { en: "The address of the consumer's private endpoint never reaches the provider network; the backends see the NAT IP.", fr: "L'adresse du point de terminaison privé du consommateur n'arrive jamais sur le réseau du fournisseur ; les serveurs principaux voient l'IP NAT." }
        d: { en: "That setting concerns the subnet that holds the NAT IP configuration; it doesn't stop the NSG of snet-api from filtering the backends.", fr: "Ce paramètre concerne le sous-réseau qui porte la configuration IP NAT ; il n'empêche pas le NSG de snet-api de filtrer les serveurs principaux." }
    references:
      - title: What is Azure Private Link service?
        url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-23-07
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a Standard Azure Virtual WAN with one hub named **Hub1** that contains an Azure Firewall. Hub1 has only the defaultRouteTable and the noneRouteTable. Three virtual networks, **VNet-Prod1**, **VNet-Prod2** and **VNet-Test**, and site-to-site VPN connections from ten branch offices are connected to Hub1. The subnets of VNet-Test have a NAT gateway.

        You have the following requirements:

        - The firewall must inspect all the traffic between the virtual networks and the branch offices, and between branch offices.
        - The firewall must inspect the internet-bound traffic of VNet-Prod1 and VNet-Prod2.
        - The internet-bound traffic of VNet-Test must leave directly through its NAT gateway.

        How should you complete the configuration of Hub1? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un Azure Virtual WAN Standard avec un hub nommé **Hub1** qui contient un Pare-feu Azure. Hub1 n'a que la defaultRouteTable et la noneRouteTable. Trois réseaux virtuels, **VNet-Prod1**, **VNet-Prod2** et **VNet-Test**, ainsi que les connexions VPN site à site de dix succursales sont connectés à Hub1. Les sous-réseaux de VNet-Test ont une passerelle NAT.

        Vous avez les exigences suivantes :

        - Le pare-feu doit inspecter tout le trafic entre les réseaux virtuels et les succursales, et entre succursales.
        - Le pare-feu doit inspecter le trafic à destination d'Internet de VNet-Prod1 et VNet-Prod2.
        - Le trafic à destination d'Internet de VNet-Test doit sortir directement par sa passerelle NAT.

        Comment devez-vous compléter la configuration de Hub1 ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Routing intent policies of Hub1: [[pol]]

          Next hop of the routing policies: [[nh]]

          Virtual network connections with Propagate default route enabled: [[pdr]]
        fr: |
          Stratégies d'intention de routage de Hub1 : [[pol]]

          Tronçon suivant des stratégies de routage : [[nh]]

          Connexions de réseau virtuel avec Propagate default route activé : [[pdr]]
      slots:
        - id: pol
          options:
            - { id: priv, text: { en: "Private traffic only", fr: "Trafic privé uniquement" } }
            - { id: inet, text: { en: "Internet traffic only", fr: "Trafic Internet uniquement" } }
            - { id: both, text: { en: "Private traffic and Internet traffic", fr: "Trafic privé et Trafic Internet" } }
        - id: nh
          options:
            - { id: fw, text: { en: "The Azure Firewall of Hub1", fr: "Le Pare-feu Azure de Hub1" } }
            - { id: vpngw, text: { en: "The VPN gateway of Hub1", fr: "La passerelle VPN de Hub1" } }
            - { id: natgw, text: { en: "The NAT gateway of VNet-Test", fr: "La passerelle NAT de VNet-Test" } }
        - id: pdr
          options:
            - { id: all, text: { en: "VNet-Prod1, VNet-Prod2 and VNet-Test", fr: "VNet-Prod1, VNet-Prod2 et VNet-Test" } }
            - { id: prod, text: { en: "VNet-Prod1 and VNet-Prod2 only", fr: "VNet-Prod1 et VNet-Prod2 uniquement" } }
            - { id: test, text: { en: "VNet-Test only", fr: "VNet-Test uniquement" } }
            - { id: none, text: { en: "No connection", fr: "Aucune connexion" } }
    answer:
      values: { pol: both, nh: fw, pdr: prod }
    explanation:
      correct:
        en: |
          A Private traffic policy sends branch and virtual network traffic, branch-to-branch included, to the firewall, and an Internet traffic policy makes the hub advertise 0.0.0.0/0 through the firewall. The default route reaches only the connections whose Propagate default route (Enable internet security) flag is on. With the flag off, VNet-Test doesn't learn 0.0.0.0/0, so its internet traffic leaves through its NAT gateway while its private traffic is still inspected.
        fr: |
          Une stratégie Trafic privé envoie au pare-feu le trafic des succursales et des réseaux virtuels, y compris de succursale à succursale, et une stratégie Trafic Internet fait annoncer par le hub 0.0.0.0/0 via le pare-feu. L'itinéraire par défaut n'atteint que les connexions dont l'indicateur Propagate default route (Enable internet security) est activé. Indicateur désactivé, VNet-Test n'apprend pas 0.0.0.0/0 : son trafic Internet sort par sa passerelle NAT, tandis que son trafic privé reste inspecté.
      options:
        priv: { en: "Without an Internet traffic policy, the internet traffic of VNet-Prod1 and VNet-Prod2 isn't sent to the firewall.", fr: "Sans stratégie Trafic Internet, le trafic Internet de VNet-Prod1 et VNet-Prod2 n'est pas envoyé au pare-feu." }
        inet: { en: "Without a Private traffic policy, the traffic between virtual networks and branches isn't inspected.", fr: "Sans stratégie Trafic privé, le trafic entre réseaux virtuels et succursales n'est pas inspecté." }
        natgw: { en: "A routing policy's next hop is a security solution in the hub: Azure Firewall, a supported NVA or a SaaS solution.", fr: "Le tronçon suivant d'une stratégie de routage est une solution de sécurité du hub : Pare-feu Azure, NVA prise en charge ou solution SaaS." }
        all: { en: "With the flag on, VNet-Test would learn 0.0.0.0/0 and send its internet traffic to the firewall.", fr: "Avec l'indicateur activé, VNet-Test apprendrait 0.0.0.0/0 et enverrait son trafic Internet au pare-feu." }
    references:
      - title: How to configure Virtual WAN Hub routing intent and routing policies
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-23-08
    objective: "2.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uses Microsoft Entra Private Access. Quick Access contains application segments for 10.10.0.0/16, in the Paris datacenter, and uses a connector group named **CG-Paris** whose two connectors are in Paris. The group **GRP-Staff** is assigned directly to Quick Access.

        The same users must now reach the Lyon datacenter range 10.20.0.0/16 on TCP 445 and 3389. There's no network path between the Paris and Lyon datacenters, and the Lyon traffic must not go through Paris. You installed two private network connectors in Lyon.

        What should you do next?
      fr: |
        Northwind Traders utilise Microsoft Entra Private Access. Quick Access contient des segments d'application pour 10.10.0.0/16, dans le centre de données de Paris, et utilise un groupe de connecteurs nommé **CG-Paris** dont les deux connecteurs sont à Paris. Le groupe **GRP-Staff** est attribué directement à Quick Access.

        Les mêmes utilisateurs doivent maintenant atteindre la plage 10.20.0.0/16 du centre de données de Lyon sur TCP 445 et 3389. Il n'existe aucun chemin réseau entre les centres de données de Paris et de Lyon, et le trafic de Lyon ne doit pas passer par Paris. Vous avez installé deux connecteurs de réseau privé à Lyon.

        Que devez-vous faire ensuite ?
    body:
      options:
        - { id: a, text: { en: "Add the Lyon connectors to CG-Paris, and add a segment for 10.20.0.0/16 on TCP 445 and 3389 to Quick Access.", fr: "Ajouter les connecteurs de Lyon à CG-Paris, et ajouter à Quick Access un segment pour 10.20.0.0/16 sur TCP 445 et 3389." } }
        - { id: b, text: { en: "Put the Lyon connectors in a group CG-Lyon, and create a second Quick Access app for 10.20.0.0/16 that uses CG-Lyon.", fr: "Placer les connecteurs de Lyon dans un groupe CG-Lyon, et créer une deuxième application Quick Access pour 10.20.0.0/16 qui utilise CG-Lyon." } }
        - { id: c, text: { en: "Add a segment for 10.20.0.0/16 on TCP 445 and 3389 to Quick Access, and enable private DNS with the Lyon DNS suffix.", fr: "Ajouter à Quick Access un segment pour 10.20.0.0/16 sur TCP 445 et 3389, et activer le DNS privé avec le suffixe DNS de Lyon." } }
        - { id: d, text: { en: "Put the Lyon connectors in a group CG-Lyon, and publish 10.20.0.0/16 in a Global Secure Access app on CG-Lyon assigned to GRP-Staff.", fr: "Placer les connecteurs de Lyon dans un groupe CG-Lyon, et publier 10.20.0.0/16 dans une application Global Secure Access sur CG-Lyon attribuée à GRP-Staff." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A connector group handles the traffic of the applications assigned to it, and Quick Access is a single app that uses one connector group. Publishing Lyon through its own Global Secure Access app, served by a connector group of Lyon connectors, keeps each site's traffic on its local connectors. The app needs its own assignment, because Quick Access assignments aren't copied to it.
        fr: |
          Un groupe de connecteurs traite le trafic des applications qui lui sont affectées, et Quick Access est une application unique qui utilise un seul groupe de connecteurs. Publier Lyon par sa propre application Global Secure Access, servie par un groupe de connecteurs de Lyon, garde le trafic de chaque site sur ses connecteurs locaux. L'application a besoin de sa propre attribution, car les attributions de Quick Access n'y sont pas copiées.
      options:
        a: { en: "A connector group distributes requests across its connectors; Paris connectors would receive Lyon requests that they can't deliver, and the reverse.", fr: "Un groupe de connecteurs répartit les requêtes entre ses connecteurs ; ceux de Paris recevraient des requêtes pour Lyon qu'ils ne peuvent pas acheminer, et inversement." }
        b: { en: "Quick Access is a single application of the tenant; the resources that need another connector group go to Global Secure Access apps.", fr: "Quick Access est une application unique du locataire ; les ressources qui ont besoin d'un autre groupe de connecteurs vont dans des applications Global Secure Access." }
        c: { en: "Private DNS resolves internal names; the Lyon segment would still be served by CG-Paris, which can't reach Lyon.", fr: "Le DNS privé résout les noms internes ; le segment de Lyon serait toujours servi par CG-Paris, qui ne peut pas atteindre Lyon." }
    references:
      - title: Microsoft Entra private network connector groups
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-connector-groups
      - title: How to configure Quick Access for Global Secure Access
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-quick-access

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-23-09
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        A virtual network named **VNet1** contains two subnets: **snet-app** (10.1.1.0/24), associated with an NSG named **nsg-app**, and **snet-mgmt** (10.1.2.0/24), which has no NSG. A virtual machine named **VM-A** (10.1.1.4) is connected to snet-app, and its network interface is associated with an NSG named **nsg-vma**. A virtual machine named **VM-M** (10.1.2.10) is connected to snet-mgmt. snet-app uses a NAT gateway for outbound internet traffic.

        The answer area shows the custom rules of both NSGs and some of their default rules. Both connections below are blocked.

        For each connection, select the rule that blocks it.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un réseau virtuel nommé **VNet1** contient deux sous-réseaux : **snet-app** (10.1.1.0/24), associé à un NSG nommé **nsg-app**, et **snet-mgmt** (10.1.2.0/24), qui n'a pas de NSG. Une machine virtuelle nommée **VM-A** (10.1.1.4) est connectée à snet-app, et sa carte réseau est associée à un NSG nommé **nsg-vma**. Une machine virtuelle nommée **VM-M** (10.1.2.10) est connectée à snet-mgmt. snet-app utilise une passerelle NAT pour le trafic Internet sortant.

        La zone de réponse montre les règles personnalisées des deux NSG et une partie de leurs règles par défaut. Les deux connexions ci-dessous sont bloquées.

        Pour chaque connexion, sélectionnez la règle qui la bloque.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "VM-A opens an HTTPS connection to a website on the internet", fr: "VM-A ouvre une connexion HTTPS vers un site web sur Internet" }
        - id: p2
          text: { en: "VM-M connects to VM-A on TCP 1433", fr: "VM-M se connecte à VM-A sur TCP 1433" }
      grid:
        header:
          - NSG
          - { en: "Direction", fr: "Direction" }
          - { en: "Priority", fr: "Priorité" }
          - { en: "Name", fr: "Nom" }
          - Source
          - Destination
          - Port
          - Action
        rows:
          - [ { text: nsg-app }, { text: Inbound }, { text: "100" }, { text: Allow-App-Sql, area: r1 }, { text: 10.1.1.0/24 }, { text: Any }, { text: TCP 1433 }, { text: Allow } ]
          - [ { text: nsg-app }, { text: Inbound }, { text: "200" }, { text: Deny-Sql, area: r2 }, { text: Any }, { text: Any }, { text: TCP 1433 }, { text: Deny } ]
          - [ { text: nsg-app }, { text: Outbound }, { text: "100" }, { text: Deny-Web-Out, area: r3 }, { text: Any }, { text: Internet }, { text: TCP 443 }, { text: Deny } ]
          - [ { text: nsg-app }, { text: Outbound }, { text: "65001" }, { text: AllowInternetOutBound, area: r4 }, { text: Any }, { text: Internet }, { text: Any }, { text: Allow } ]
          - [ { text: nsg-vma }, { text: Inbound }, { text: "100" }, { text: Deny-Mgmt-Sql, area: r5 }, { text: 10.1.2.0/24 }, { text: Any }, { text: TCP 1433 }, { text: Deny } ]
          - [ { text: nsg-vma }, { text: Inbound }, { text: "65500" }, { text: DenyAllInBound, area: r6 }, { text: Any }, { text: Any }, { text: Any }, { text: Deny } ]
          - [ { text: nsg-vma }, { text: Outbound }, { text: "100" }, { text: Allow-Web-Out, area: r7 }, { text: Any }, { text: Internet }, { text: TCP 443 }, { text: Allow } ]
          - [ { text: nsg-vma }, { text: Outbound }, { text: "65500" }, { text: DenyAllOutBound, area: r8 }, { text: Any }, { text: Any }, { text: Any }, { text: Deny } ]
    answer:
      values: { p1: r3, p2: r2 }
    explanation:
      correct:
        en: |
          For outbound traffic, Azure processes the NSG of the network interface first, then the NSG of the subnet. Allow-Web-Out in nsg-vma lets the HTTPS traffic of VM-A leave the interface, but Deny-Web-Out in nsg-app then blocks it. For inbound traffic, the subnet NSG comes first: the connection from VM-M doesn't match Allow-App-Sql, whose source is snet-app, so Deny-Sql blocks it before nsg-vma and its Deny-Mgmt-Sql rule are evaluated.
        fr: |
          Pour le trafic sortant, Azure traite d'abord le NSG de la carte réseau, puis celui du sous-réseau. Allow-Web-Out de nsg-vma laisse le trafic HTTPS de VM-A quitter la carte réseau, mais Deny-Web-Out de nsg-app le bloque ensuite. Pour le trafic entrant, le NSG du sous-réseau passe en premier : la connexion de VM-M ne correspond pas à Allow-App-Sql, dont la source est snet-app ; Deny-Sql la bloque donc avant que nsg-vma et sa règle Deny-Mgmt-Sql ne soient évalués.
      options:
        r5: { en: "Deny-Mgmt-Sql would also deny the flow, but the subnet NSG is evaluated first for inbound traffic, so the traffic never reaches nsg-vma.", fr: "Deny-Mgmt-Sql refuserait aussi le flux, mais le NSG du sous-réseau est évalué en premier pour le trafic entrant : le trafic n'atteint donc jamais nsg-vma." }
        r7: { en: "Allow-Web-Out only lets the traffic pass the interface NSG; the subnet NSG must allow it too.", fr: "Allow-Web-Out ne fait que laisser passer le trafic au niveau du NSG de la carte réseau ; le NSG du sous-réseau doit aussi l'autoriser." }
    references:
      - title: How network security groups filter network traffic
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-23-10
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure Virtual Network Manager instance named **NM1** whose scope is the management group **MG-Corp**, which contains the subscriptions Sub-A and Sub-B. A network group named **NG-Web** uses dynamic membership: every virtual network tagged `tier=web`. A security admin configuration named **SAC-Web**, with default settings, targets NG-Web with a Deny rule for inbound TCP 3389 from Internet. SAC-Web was deployed to West Europe last week.

        | Virtual network | Subscription | Region | Notes |
        | --- | --- | --- | --- |
        | VNet-W1 | Sub-A | West Europe | |
        | VNet-W2 | Sub-B | North Europe | |
        | VNet-W3 | Sub-C, not under MG-Corp | West Europe | |
        | VNet-W4 | Sub-A | West Europe | Contains an Azure SQL managed instance |
        | VNet-W5 | Sub-B | West Europe | Created yesterday |

        All five virtual networks are tagged `tier=web`. Each of them contains virtual machines with public IP addresses, in subnets whose NSG allows TCP 3389 from Internet.

        In which virtual networks does SAC-Web block RDP connections from the internet to the virtual machines?
      fr: |
        Fabrikam dispose d'une instance Azure Virtual Network Manager nommée **NM1** dont l'étendue est le groupe d'administration **MG-Corp**, qui contient les abonnements Sub-A et Sub-B. Un groupe réseau nommé **NG-Web** utilise l'appartenance dynamique : tous les réseaux virtuels avec l'étiquette `tier=web`. Une configuration d'administration de la sécurité nommée **SAC-Web**, avec les paramètres par défaut, cible NG-Web avec une règle Deny pour le TCP 3389 entrant depuis Internet. SAC-Web a été déployée dans la région Europe Ouest la semaine dernière.

        | Réseau virtuel | Abonnement | Région | Remarques |
        | --- | --- | --- | --- |
        | VNet-W1 | Sub-A | Europe Ouest | |
        | VNet-W2 | Sub-B | Europe Nord | |
        | VNet-W3 | Sub-C, hors de MG-Corp | Europe Ouest | |
        | VNet-W4 | Sub-A | Europe Ouest | Contient une instance managée Azure SQL |
        | VNet-W5 | Sub-B | Europe Ouest | Créé hier |

        Les cinq réseaux virtuels ont l'étiquette `tier=web`. Chacun contient des machines virtuelles avec des adresses IP publiques, dans des sous-réseaux dont le NSG autorise le TCP 3389 depuis Internet.

        Dans quels réseaux virtuels SAC-Web bloque-t-elle les connexions RDP depuis Internet vers les machines virtuelles ?
    shuffle: false
    body:
      options:
        - { id: a, text: { en: "VNet-W1 only", fr: "VNet-W1 uniquement" } }
        - { id: b, text: { en: "VNet-W1 and VNet-W5 only", fr: "VNet-W1 et VNet-W5 uniquement" } }
        - { id: c, text: { en: "VNet-W1, VNet-W4 and VNet-W5 only", fr: "VNet-W1, VNet-W4 et VNet-W5 uniquement" } }
        - { id: d, text: { en: "VNet-W1, VNet-W2, VNet-W4 and VNet-W5 only", fr: "VNet-W1, VNet-W2, VNet-W4 et VNet-W5 uniquement" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A security admin configuration applies only in the regions it's deployed to, to the members of its network groups, and a network group can only contain virtual networks within the scope of the network manager. VNet-W5 joined NG-Web through dynamic membership and gets the rules without a new deployment. VNet-W2 is in a region where SAC-Web isn't deployed, VNet-W3 is outside the scope of NM1, and by default security admin rules aren't applied to a virtual network that contains an Azure SQL managed instance.
        fr: |
          Une configuration d'administration de la sécurité ne s'applique que dans les régions où elle est déployée, aux membres de ses groupes réseau, et un groupe réseau ne peut contenir que des réseaux virtuels de l'étendue du gestionnaire de réseau. VNet-W5 a rejoint NG-Web par l'appartenance dynamique et reçoit les règles sans nouveau déploiement. VNet-W2 est dans une région où SAC-Web n'est pas déployée, VNet-W3 est hors de l'étendue de NM1, et par défaut les règles d'administration de la sécurité ne sont pas appliquées à un réseau virtuel qui contient une instance managée Azure SQL.
      options:
        a: { en: "Dynamic membership adds VNet-W5 to NG-Web, and the deployed configuration applies to it without redeployment.", fr: "L'appartenance dynamique ajoute VNet-W5 à NG-Web, et la configuration déployée s'y applique sans redéploiement." }
        c: { en: "By default, security admin rules aren't applied to a virtual network that contains an Azure SQL managed instance; AllowRulesOnly would apply only Allow rules there.", fr: "Par défaut, les règles d'administration de la sécurité ne sont pas appliquées à un réseau virtuel qui contient une instance managée Azure SQL ; AllowRulesOnly n'y appliquerait que les règles Allow." }
        d: { en: "SAC-Web is deployed to West Europe only, so VNet-W2 in North Europe gets none of its rules.", fr: "SAC-Web n'est déployée qu'en Europe Ouest : VNet-W2, en Europe Nord, ne reçoit aucune de ses règles." }
    references:
      - title: Security admin rules in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
      - title: Manage configuration deployments in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-deployments
