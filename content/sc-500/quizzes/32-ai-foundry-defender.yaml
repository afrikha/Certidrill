chapter: 32-ai-foundry-defender
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-32-01
    objective: "3.1.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. exposes its Microsoft Foundry model deployments through an Azure API Management instance used as an AI gateway. The FinOps team wants Azure Monitor charts that show the prompt and completion tokens consumed, split by client IP address and by API.

        Which policy should you add to the APIs?
      fr: |
        Contoso, Ltd. expose ses déploiements de modèles Microsoft Foundry par une instance Azure API Management utilisée comme passerelle IA. L'équipe FinOps veut des graphiques Azure Monitor qui montrent les jetons de prompt et de complétion consommés, répartis par adresse IP du client et par API.

        Quelle stratégie devez-vous ajouter aux API ?
    body:
      options:
        - { id: a, text: "`llm-token-limit`" }
        - { id: b, text: "`llm-emit-token-metric`" }
        - { id: c, text: "`llm-content-safety`" }
        - { id: d, text: "`llm-semantic-cache-store`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The `llm-emit-token-metric` policy sends metrics about the tokens consumed by LLM APIs to Azure Monitor. Its `dimension` elements add custom dimensions, such as the client IP address or the API ID, so the FinOps team can split the consumption in its charts.
        fr: |
          La stratégie `llm-emit-token-metric` envoie à Azure Monitor des métriques sur les jetons consommés par les API de LLM. Ses éléments `dimension` ajoutent des dimensions personnalisées, comme l'adresse IP du client ou l'ID de l'API, pour que l'équipe FinOps puisse répartir la consommation dans ses graphiques.
      options:
        a: { en: "`llm-token-limit` enforces a tokens-per-minute limit or a token quota; it doesn't publish consumption metrics to Azure Monitor.", fr: "`llm-token-limit` applique une limite de jetons par minute ou un quota de jetons ; il ne publie pas de métriques de consommation dans Azure Monitor." }
        c: { en: "`llm-content-safety` moderates prompts with Azure AI Content Safety; it doesn't measure token consumption.", fr: "`llm-content-safety` modère les prompts avec Azure AI Content Safety ; il ne mesure pas la consommation de jetons." }
        d: { en: "`llm-semantic-cache-store` stores responses for semantic caching, which reduces calls but doesn't emit metrics.", fr: "`llm-semantic-cache-store` stocke des réponses pour la mise en cache sémantique, ce qui réduit les appels mais n'émet pas de métriques." }
    references:
      - title: AI gateway capabilities in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-32-02
    objective: "3.1.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. builds generative AI applications with Azure OpenAI and Microsoft Foundry in an Azure subscription. The security team needs Microsoft Defender for Cloud to build an AI bill of materials (AI BOM) of these applications and to show recommendations and attack paths for their AI resources.

        Which Defender for Cloud plan should you enable on the subscription?
      fr: |
        Fabrikam, Inc. développe des applications d'IA générative avec Azure OpenAI et Microsoft Foundry dans un abonnement Azure. L'équipe de sécurité a besoin que Microsoft Defender for Cloud construise une nomenclature IA (AI BOM) de ces applications et affiche des recommandations et des chemins d'attaque pour leurs ressources d'IA.

        Quel plan de Defender for Cloud devez-vous activer sur l'abonnement ?
    body:
      options:
        - { id: a, text: AI services }
        - { id: b, text: Defender CSPM }
        - { id: c, text: Defender for Storage }
        - { id: d, text: Defender for APIs }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          AI security posture management is part of the Defender CSPM plan. It discovers the AI BOM of applications built with Azure OpenAI, Foundry, Azure Machine Learning, Amazon Bedrock and Google Vertex AI, and adds AI recommendations, such as private endpoints and managed identity, and attack path analysis.
        fr: |
          La gestion de la posture de sécurité de l'IA fait partie du plan Defender CSPM. Elle découvre l'AI BOM des applications créées avec Azure OpenAI, Foundry, Azure Machine Learning, Amazon Bedrock et Google Vertex AI, et ajoute des recommandations pour l'IA, comme les points de terminaison privés et l'identité managée, ainsi que l'analyse des chemins d'attaque.
      options:
        a: { en: "The AI services plan is threat protection: it raises alerts on prompts and responses but doesn't build the AI BOM or attack paths.", fr: "Le plan AI services est une protection contre les menaces : il génère des alertes sur les prompts et les réponses, mais ne construit ni l'AI BOM ni les chemins d'attaque." }
        c: { en: "Defender for Storage detects threats to storage accounts; it doesn't inventory AI applications.", fr: "Defender for Storage détecte les menaces visant les comptes de stockage ; il n'inventorie pas les applications d'IA." }
        d: { en: "Defender for APIs protects APIs published in API Management; it doesn't discover AI components or build attack paths for them.", fr: "Defender for APIs protège les API publiées dans API Management ; il ne découvre pas les composants d'IA et ne construit pas leurs chemins d'attaque." }
    references:
      - title: Overview - AI security posture management
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-32-03
    objective: "3.1.9"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. has a Microsoft Foundry model deployment named **gpt-hr** that uses the default guardrail **Microsoft.DefaultV2**. The HR team requires gpt-hr to block hateful content of every severity in prompts and completions.

        You have the Foundry Account Owner role. What should you do?
      fr: |
        Proseware, Inc. dispose d'un déploiement de modèle Microsoft Foundry nommé **gpt-hr** qui utilise le garde-fou par défaut **Microsoft.DefaultV2**. L'équipe RH exige que gpt-hr bloque le contenu haineux de toute gravité dans les prompts et les complétions.

        Vous avez le rôle Foundry Account Owner. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Edit Microsoft.DefaultV2 and set the Hate control to High.", fr: "Modifier Microsoft.DefaultV2 et définir le contrôle Hate sur High." } }
        - { id: b, text: { en: "Create a custom guardrail with Hate set to Low, and assign it to gpt-hr.", fr: "Créer un garde-fou personnalisé avec Hate défini sur Low, puis l'attribuer à gpt-hr." } }
        - { id: c, text: { en: "Create a custom guardrail with Hate set to High, and assign it to gpt-hr.", fr: "Créer un garde-fou personnalisé avec Hate défini sur High, puis l'attribuer à gpt-hr." } }
        - { id: d, text: { en: "Edit Microsoft.DefaultV2 and set the Hate control to Annotate only.", fr: "Modifier Microsoft.DefaultV2 et définir le contrôle Hate sur Annotate seulement." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft default guardrails can't be edited: to change the behavior of a deployment, you create a custom guardrail and assign it. The High blocking level is the most restrictive and blocks low, medium and high severity content, which is what the HR team requires.
        fr: |
          Les garde-fous par défaut de Microsoft ne sont pas modifiables : pour changer le comportement d'un déploiement, vous créez un garde-fou personnalisé et vous l'attribuez. Le niveau de blocage High est le plus restrictif et bloque le contenu de gravité faible, moyenne et élevée, ce que l'équipe RH exige.
      options:
        a: { en: "Microsoft.DefaultV2 is a Microsoft default guardrail, which can't be edited; a custom guardrail is required.", fr: "Microsoft.DefaultV2 est un garde-fou par défaut de Microsoft, qui n'est pas modifiable ; un garde-fou personnalisé est nécessaire." }
        b: { en: "Low is the least restrictive level: it blocks only high-severity content and lets low and medium severity through.", fr: "Low est le niveau le moins restrictif : il ne bloque que le contenu de gravité élevée et laisse passer les gravités faible et moyenne." }
        d: { en: "The default guardrail can't be edited, and Annotate only flags content without blocking it.", fr: "Le garde-fou par défaut n'est pas modifiable, et l'annotation seule signale le contenu sans le bloquer." }
    references:
      - title: How to configure guardrails and controls in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/how-to-create-guardrails
      - title: Guardrails and controls overview in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-32-04
    objective: "3.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. uses an Azure API Management instance as an AI gateway. The instance publishes model deployments of a Microsoft Foundry resource and models of Amazon Bedrock as LLM APIs.

        You need every prompt sent through the gateway to be screened for harmful content and prompt attacks, and rejected when flagged, before it's forwarded to any model backend. The solution must use a single control for both providers.

        What should you do?
      fr: |
        Litware, Inc. utilise une instance Azure API Management comme passerelle IA. L'instance publie, sous forme d'API de LLM, des déploiements de modèles d'une ressource Microsoft Foundry et des modèles d'Amazon Bedrock.

        Vous devez faire analyser chaque prompt envoyé par la passerelle à la recherche de contenu préjudiciable et d'attaques par prompt, et le faire rejeter s'il est signalé, avant qu'il soit transmis à un back-end de modèle. La solution doit utiliser un seul contrôle pour les deux fournisseurs.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign a custom Foundry guardrail with a User prompt attacks control to the Foundry deployments.", fr: "Attribuer aux déploiements Foundry un garde-fou Foundry personnalisé avec un contrôle User prompt attacks." } }
        - { id: b, text: { en: "Turn on the AI services plan of Defender for Cloud on the subscription of the gateway.", fr: "Activer le plan AI services de Defender for Cloud sur l'abonnement de la passerelle." } }
        - { id: c, text: { en: "Add the `llm-content-safety` policy to the inbound section of the LLM APIs in the gateway.", fr: "Ajouter la stratégie `llm-content-safety` à la section inbound des API de LLM de la passerelle." } }
        - { id: d, text: { en: "Add the `llm-token-limit` policy with `estimate-prompt-tokens` set to `true` to the LLM APIs.", fr: "Ajouter aux API de LLM la stratégie `llm-token-limit` avec `estimate-prompt-tokens` défini sur `true`." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The `llm-content-safety` policy of API Management sends the prompts to Azure AI Content Safety, which checks harm categories and, with `shield-prompt`, attack patterns, and blocks the request with a `403` error before it reaches the backend when the content is flagged. Because the policy runs in the gateway, it applies to every LLM API that the gateway publishes, whatever the model provider.
        fr: |
          La stratégie `llm-content-safety` d'API Management envoie les prompts à Azure AI Content Safety, qui vérifie les catégories de préjudice et, avec `shield-prompt`, les schémas d'attaque, et bloque la requête avec une erreur `403` avant qu'elle atteigne le back-end quand le contenu est signalé. Comme la stratégie s'exécute dans la passerelle, elle s'applique à toutes les API de LLM que publie la passerelle, quel que soit le fournisseur du modèle.
      options:
        a: { en: "A Foundry guardrail applies to Foundry Models and agents; it doesn't moderate the prompts sent to the Amazon Bedrock models.", fr: "Un garde-fou Foundry s'applique aux modèles et aux agents Foundry ; il ne modère pas les prompts envoyés aux modèles Amazon Bedrock." }
        b: { en: "The AI services plan detects threats and raises alerts; it doesn't moderate or reject prompts in the gateway.", fr: "Le plan AI services détecte les menaces et génère des alertes ; il ne modère ni ne rejette les prompts dans la passerelle." }
        d: { en: "Prompt token estimation lets the gateway reject requests over the token limit early; it doesn't check the content of the prompts.", fr: "L'estimation des jetons de prompt permet à la passerelle de rejeter tôt les requêtes au-delà de la limite de jetons ; elle ne vérifie pas le contenu des prompts." }
    references:
      - title: Azure API Management policy reference - llm-content-safety
        url: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
      - title: AI gateway capabilities in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-32-05
    objective: "3.1.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a Microsoft Foundry model deployment named **gpt-shared** that several applications call. gpt-shared uses a custom guardrail named **gr-standard**.

        A new application named **KidsQuiz** needs stricter content filtering for its own requests. The other applications must keep gr-standard, and you must not create another deployment.

        You create a custom guardrail named **gr-kids**. What should you do next?
      fr: |
        Tailspin Toys dispose d'un déploiement de modèle Microsoft Foundry nommé **gpt-shared** qu'appellent plusieurs applications. gpt-shared utilise un garde-fou personnalisé nommé **gr-standard**.

        Une nouvelle application nommée **KidsQuiz** a besoin d'un filtrage du contenu plus strict pour ses propres requêtes. Les autres applications doivent conserver gr-standard, et vous ne devez pas créer d'autre déploiement.

        Vous créez un garde-fou personnalisé nommé **gr-kids**. Que devez-vous faire ensuite ?
    body:
      options:
        - { id: a, text: { en: "Assign gr-kids to gpt-shared from the Guardrails page of the Foundry portal.", fr: "Attribuer gr-kids à gpt-shared depuis la page Guardrails du portail Foundry." } }
        - { id: b, text: { en: "Set `raiPolicyName` to gr-kids in the properties of the gpt-shared deployment.", fr: "Définir `raiPolicyName` sur gr-kids dans les propriétés du déploiement gpt-shared." } }
        - { id: c, text: { en: "Have KidsQuiz send the `x-policy-id` header with the value gr-kids in its requests.", fr: "Faire envoyer par KidsQuiz l'en-tête `x-policy-id` avec la valeur gr-kids dans ses requêtes." } }
        - { id: d, text: { en: "Have KidsQuiz send the `api-key` header of a key generated for gr-kids in its requests.", fr: "Faire envoyer par KidsQuiz l'en-tête `api-key` d'une clé générée pour gr-kids dans ses requêtes." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The `x-policy-id` request header names a custom guardrail that overrides the deployment-level guardrail for that API call only. KidsQuiz gets gr-kids on its own requests, and the other applications keep gr-standard. If the named guardrail doesn't exist, the API returns an InvalidContentFilterPolicy error.
        fr: |
          L'en-tête de requête `x-policy-id` désigne un garde-fou personnalisé qui remplace le garde-fou du déploiement pour cet appel d'API uniquement. KidsQuiz obtient gr-kids sur ses propres requêtes, et les autres applications conservent gr-standard. Si le garde-fou indiqué n'existe pas, l'API renvoie une erreur InvalidContentFilterPolicy.
      options:
        a: { en: "Assigning gr-kids to the deployment replaces gr-standard for every application that calls gpt-shared.", fr: "Attribuer gr-kids au déploiement remplace gr-standard pour toutes les applications qui appellent gpt-shared." }
        b: { en: "`raiPolicyName` assigns the guardrail to the whole deployment through the REST API, so all applications would get gr-kids.", fr: "`raiPolicyName` attribue le garde-fou à tout le déploiement par l'API REST : toutes les applications recevraient gr-kids." }
        d: { en: "Keys belong to the Foundry resource, not to a guardrail; the key doesn't select which guardrail filters a request.", fr: "Les clés appartiennent à la ressource Foundry, pas à un garde-fou ; la clé ne sélectionne pas le garde-fou qui filtre une requête." }
    references:
      - title: How to configure guardrails and controls in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/how-to-create-guardrails

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-32-06
    objective: "3.1.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum Corporation exposes the model deployments of a Microsoft Foundry resource named **foundry-adt** through an Azure API Management instance named **apim-adt** (Standard v2) configured as an AI gateway. Five internal applications call the models. They run in Azure Container Apps in a virtual network, and all their outbound traffic leaves through one NAT gateway.

        You have the following requirements:

        - The gateway must not be reachable from the internet.
        - Each application has its own token budget, and a compromised application must not be able to use the quota or the identity of another application.
        - No API key may be used between the applications, the gateway and the models.

        How should you complete the design? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation expose les déploiements de modèles d'une ressource Microsoft Foundry nommée **foundry-adt** par une instance Azure API Management nommée **apim-adt** (Standard v2) configurée comme passerelle IA. Cinq applications internes appellent les modèles. Elles s'exécutent dans Azure Container Apps dans un réseau virtuel, et tout leur trafic sortant passe par une même passerelle NAT.

        Vous avez les exigences suivantes :

        - La passerelle ne doit pas être accessible depuis Internet.
        - Chaque application a son propre budget de jetons, et une application compromise ne doit pas pouvoir utiliser le quota ni l'identité d'une autre application.
        - Aucune clé API ne doit être utilisée entre les applications, la passerelle et les modèles.

        Comment devez-vous compléter la conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Network access to apim-adt: [[net]]

          Authentication of the applications to apim-adt: [[caller]]

          Authentication of apim-adt to foundry-adt: [[backend]]

          `counter-key` of the `llm-token-limit` policy: [[key]]
        fr: |
          Accès réseau à apim-adt : [[net]]

          Authentification des applications auprès d'apim-adt : [[caller]]

          Authentification d'apim-adt auprès de foundry-adt : [[backend]]

          `counter-key` de la stratégie `llm-token-limit` : [[key]]
      slots:
        - id: net
          options:
            - { id: pe, text: { en: "A private endpoint, with public network access disabled", fr: "Un point de terminaison privé, avec l'accès réseau public désactivé" } }
            - { id: ipallow, text: { en: "IP allowlisting of the public IP address of the NAT gateway", fr: "Une liste d'adresses IP autorisées contenant l'adresse IP publique de la passerelle NAT" } }
            - { id: subkey, text: { en: "The public endpoint, protected by a subscription key per application", fr: "Le point de terminaison public, protégé par une clé d'abonnement par application" } }
        - id: caller
          options:
            - { id: entra, text: { en: "A Microsoft Entra token of each application's managed identity, checked by `validate-azure-ad-token`", fr: "Un jeton Microsoft Entra de l'identité managée de chaque application, vérifié par `validate-azure-ad-token`" } }
            - { id: shared, text: { en: "One API Management subscription key shared by the five applications", fr: "Une clé d'abonnement API Management partagée par les cinq applications" } }
            - { id: fwd, text: { en: "The API key of foundry-adt, forwarded by the gateway to the models", fr: "La clé API de foundry-adt, transmise par la passerelle aux modèles" } }
        - id: backend
          options:
            - { id: mi, text: { en: "The managed identity of apim-adt, assigned Cognitive Services OpenAI User on foundry-adt", fr: "L'identité managée d'apim-adt, avec le rôle Cognitive Services OpenAI User sur foundry-adt" } }
            - { id: named, text: { en: "The API key of foundry-adt, stored in a secret named value of apim-adt", fr: "La clé API de foundry-adt, stockée dans une valeur nommée secrète d'apim-adt" } }
            - { id: kvref, text: { en: "The API key of foundry-adt, stored as a Key Vault reference in apim-adt", fr: "La clé API de foundry-adt, stockée comme référence Key Vault dans apim-adt" } }
        - id: key
          options:
            - { id: appid, text: { en: "The client application ID taken from the caller's validated token", fr: "L'ID de l'application cliente extrait du jeton validé de l'appelant" } }
            - { id: ip, text: { en: "The client IP address of the request", fr: "L'adresse IP du client de la requête" } }
            - { id: apiid, text: { en: "The ID of the LLM API that the request calls", fr: "L'ID de l'API de LLM appelée par la requête" } }
    answer:
      values: { net: pe, caller: entra, backend: mi, key: appid }
    explanation:
      correct:
        en: |
          A private endpoint lets the applications reach apim-adt from the virtual network while public access is disabled. Each application authenticates with a Microsoft Entra token of its own managed identity, which the gateway validates with `validate-azure-ad-token`, and the gateway calls foundry-adt with its own managed identity, which holds Cognitive Services OpenAI User: no key exists anywhere. Using the client application ID from the validated token as the counter key gives each application its own token counter that another application can't use.
        fr: |
          Un point de terminaison privé permet aux applications d'atteindre apim-adt depuis le réseau virtuel alors que l'accès public est désactivé. Chaque application s'authentifie avec un jeton Microsoft Entra de sa propre identité managée, que la passerelle valide avec `validate-azure-ad-token`, et la passerelle appelle foundry-adt avec sa propre identité managée, qui détient Cognitive Services OpenAI User : aucune clé n'existe nulle part. Utiliser comme clé de compteur l'ID de l'application cliente extrait du jeton validé donne à chaque application son propre compteur de jetons, qu'aucune autre application ne peut utiliser.
      options:
        ipallow: { en: "IP allowlisting keeps the endpoint public, and the five applications share the same NAT IP address.", fr: "La liste d'adresses IP autorisées laisse le point de terminaison public, et les cinq applications partagent la même adresse IP NAT." }
        subkey: { en: "A subscription key is a key, and the public endpoint stays reachable from the internet.", fr: "Une clé d'abonnement est une clé, et le point de terminaison public reste accessible depuis Internet." }
        named: { en: "A named value still stores an API key, which the requirements forbid.", fr: "Une valeur nommée stocke toujours une clé API, ce que les exigences interdisent." }
        kvref: { en: "A Key Vault reference only moves where the API key is stored; it's still key-based authentication.", fr: "Une référence Key Vault ne fait que déplacer l'endroit où la clé API est stockée ; l'authentification reste fondée sur une clé." }
        ip: { en: "All the applications leave through the same NAT gateway, so they would share one counter.", fr: "Toutes les applications sortent par la même passerelle NAT : elles partageraient un seul compteur." }
        apiid: { en: "Every application calls the same LLM API, so they would share one counter.", fr: "Toutes les applications appellent la même API de LLM : elles partageraient un seul compteur." }
    references:
      - title: Authenticate and Authorize to LLM APIs - Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/api-management-authenticate-authorize-azure-openai
      - title: Azure API Management policy reference - llm-token-limit
        url: https://learn.microsoft.com/en-us/azure/api-management/llm-token-limit-policy

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-32-07
    objective: "3.1.9"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders uses Microsoft Foundry. The tenant contains the following agents:

        - **OrderAgent**, built in Foundry Agent Service. It uses the model deployment **gpt-orders**.
        - **ServiceAgent**, built in Copilot Studio and registered in the Foundry control plane.

        You create a custom guardrail named **gr-agents** and plan to assign it to both agents. You have the Foundry Account Owner role.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders utilise Microsoft Foundry. Le locataire contient les agents suivants :

        - **OrderAgent**, créé dans Foundry Agent Service. Il utilise le déploiement de modèle **gpt-orders**.
        - **ServiceAgent**, créé dans Copilot Studio et inscrit dans le plan de contrôle Foundry.

        Vous créez un garde-fou personnalisé nommé **gr-agents** et prévoyez de l'attribuer aux deux agents. Vous avez le rôle Foundry Account Owner.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "In gr-agents, you can set a Protected material for text control on the Output intervention point with the Annotate action, so that OrderAgent flags such content without blocking it.", fr: "Dans gr-agents, vous pouvez définir un contrôle Protected material for text au point d'intervention Output avec l'action Annotate, pour qu'OrderAgent signale ce contenu sans le bloquer." }
        - id: s2
          text: { en: "After you assign gr-agents to OrderAgent from the Guardrails page, the new controls apply to OrderAgent without redeploying it.", fr: "Après l'attribution de gr-agents à OrderAgent depuis la page Guardrails, les nouveaux contrôles s'appliquent à OrderAgent sans le redéployer." }
        - id: s3
          text: { en: "Once gr-agents is assigned to ServiceAgent, the Foundry guardrail scans the prompts that users send to ServiceAgent.", fr: "Une fois gr-agents attribué à ServiceAgent, le garde-fou Foundry analyse les prompts que les utilisateurs envoient à ServiceAgent." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          For agents, the only available action is Annotate and block; Annotate alone is available for models only. Assigning a guardrail takes effect immediately, so OrderAgent is checked by gr-agents as soon as the assignment is saved. Guardrails currently apply only to agents built in Foundry Agent Service, not to the other agents registered in the Foundry control plane, such as a Copilot Studio agent.
        fr: |
          Pour les agents, la seule action disponible est Annotate and block ; Annotate seule n'est disponible que pour les modèles. L'attribution d'un garde-fou prend effet immédiatement : OrderAgent est vérifié par gr-agents dès que l'attribution est enregistrée. Les garde-fous ne s'appliquent actuellement qu'aux agents créés dans Foundry Agent Service, pas aux autres agents inscrits dans le plan de contrôle Foundry, comme un agent Copilot Studio.
      options:
        s1: { en: "Annotate is a model-only action: an agent's controls always use Annotate and block.", fr: "Annotate est une action réservée aux modèles : les contrôles d'un agent utilisent toujours Annotate and block." }
        s3: { en: "Foundry guardrails don't apply to agents built on other platforms that are only registered in the Foundry control plane.", fr: "Les garde-fous Foundry ne s'appliquent pas aux agents créés sur d'autres plateformes et seulement inscrits dans le plan de contrôle Foundry." }
    references:
      - title: Guardrails and controls overview in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
      - title: How to configure guardrails and controls in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/how-to-create-guardrails

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-32-08
    objective: "3.1.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank hosts a customer chat application on an Azure OpenAI model deployment named **gpt-chat** in Microsoft Foundry. gpt-chat uses a custom guardrail whose **User prompt attacks** control has the **Annotate** action. Microsoft Defender for Cloud has only the foundational CSPM capabilities on the subscription.

        You have the following requirements:

        - Jailbreak attempts must be stopped before they reach the model.
        - The SOC must receive a Defender for Cloud alert for each jailbreak attempt, with the suspicious segment of the prompt in the alert evidence.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank héberge une application de conversation pour ses clients sur un déploiement de modèle Azure OpenAI nommé **gpt-chat** dans Microsoft Foundry. gpt-chat utilise un garde-fou personnalisé dont le contrôle **User prompt attacks** a l'action **Annotate**. Microsoft Defender for Cloud ne dispose que des fonctionnalités CSPM de base sur l'abonnement.

        Vous avez les exigences suivantes :

        - Les tentatives de jailbreak doivent être arrêtées avant d'atteindre le modèle.
        - Le SOC doit recevoir une alerte Defender for Cloud pour chaque tentative de jailbreak, avec le segment suspect du prompt dans les preuves de l'alerte.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Change the action of the User prompt attacks control to Annotate and block.", fr: "Remplacer l'action du contrôle User prompt attacks par Annotate and block." } }
        - { id: b, text: { en: "Add an Indirect attacks control at the Output intervention point of the guardrail.", fr: "Ajouter un contrôle Indirect attacks au point d'intervention Output du garde-fou." } }
        - { id: c, text: { en: "Turn on the AI services plan and its Enable user prompt evidence setting.", fr: "Activer le plan AI services et son paramètre Enable user prompt evidence." } }
        - { id: d, text: { en: "Turn on the AI services plan and its data security for AI interactions setting.", fr: "Activer le plan AI services et son paramètre de sécurité des données pour les interactions d'IA." } }
        - { id: e, text: { en: "Turn on the Defender CSPM plan and review the attack paths of gpt-chat.", fr: "Activer le plan Defender CSPM et examiner les chemins d'attaque de gpt-chat." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Defender for AI services detects and alerts but doesn't block, so the block comes from the guardrail: User prompt attacks with Annotate and block stops the jailbreak at the user input. The AI services plan raises alerts for jailbreak attempts, including attempts blocked by Prompt Shields, and its user prompt evidence setting adds the suspicious prompt segments, with sensitive data redacted, to the alerts.
        fr: |
          Defender for AI services détecte et alerte mais ne bloque pas : le blocage vient donc du garde-fou. User prompt attacks avec Annotate and block arrête le jailbreak à l'entrée utilisateur. Le plan AI services génère des alertes pour les tentatives de jailbreak, y compris celles bloquées par Prompt Shields, et son paramètre de preuve des prompts utilisateur ajoute aux alertes les segments suspects des prompts, avec les données sensibles masquées.
      options:
        b: { en: "Indirect attacks target injections in documents or tool output, and the Output point scans the completion, not the user's jailbreak prompt.", fr: "Indirect attacks vise les injections dans des documents ou des sorties d'outils, et le point Output analyse la complétion, pas le prompt de jailbreak de l'utilisateur." }
        d: { en: "Data security for AI interactions shares prompts with Microsoft Purview for compliance; it doesn't add prompt segments to Defender alerts.", fr: "La sécurité des données pour les interactions d'IA partage les prompts avec Microsoft Purview pour la conformité ; elle n'ajoute pas de segments de prompts aux alertes Defender." }
        e: { en: "Defender CSPM provides posture and attack paths; it doesn't alert on prompts or block them.", fr: "Defender CSPM fournit la posture et les chemins d'attaque ; il ne génère pas d'alertes sur les prompts et ne les bloque pas." }
    references:
      - title: Enable threat protection for AI services
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding
      - title: Alerts for AI services
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-ai-workloads

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-32-09
    objective: "3.1.10"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Litware, Inc. uses the Data and AI security dashboard of Microsoft Defender for Cloud. Its generative AI applications use storage accounts for grounding data and Azure SQL databases for transactional data. The `Microsoft.Security` resource provider is registered on every subscription, and the Defender for Cloud plans are configured as shown in the following table.

        For each requirement, select the subscription that meets it.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. utilise le tableau de bord de sécurité des données et de l'IA de Microsoft Defender for Cloud. Ses applications d'IA générative utilisent des comptes de stockage pour les données d'ancrage et des bases de données Azure SQL pour les données transactionnelles. Le fournisseur de ressources `Microsoft.Security` est inscrit sur tous les abonnements, et les plans de Defender for Cloud sont configurés comme le montre le tableau suivant.

        Pour chaque exigence, sélectionnez l'abonnement qui la satisfait.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text:
            en: "The AI threat protection widget reports the prompts scanned, and the security explorer queries of the AI closer look can find sensitive data used for grounding."
            fr: "Le widget AI threat protection indique les prompts analysés, et les requêtes de l'explorateur de sécurité de la section AI closer look peuvent trouver les données sensibles utilisées pour l'ancrage."
        - id: p2
          text:
            en: "The Data threat protection widget of the Data closer look shows alerts for the Azure SQL databases."
            fr: "Le widget Data threat protection de la section Data closer look affiche des alertes pour les bases de données Azure SQL."
      grid:
        header: [{ en: Subscription, fr: Abonnement }, Defender CSPM, { en: "Sensitive data discovery", fr: "Découverte des données sensibles" }, Defender for Storage, Defender for Databases, AI services]
        rows:
          - [{ text: Sub1, area: sub1 }, { text: "On" }, { text: "On" }, { text: "On" }, { text: "Off" }, { text: "Off" }]
          - [{ text: Sub2, area: sub2 }, { text: "On" }, { text: "Off" }, { text: "Off" }, { text: "On" }, { text: "On" }]
          - [{ text: Sub3, area: sub3 }, { text: "Off" }, { text: "Off" }, { text: "On" }, { text: "Off" }, { text: "On" }]
          - [{ text: Sub4, area: sub4 }, { text: "On" }, { text: "On" }, { text: "Off" }, { text: "Off" }, { text: "On" }]
    answer:
      values: { p1: sub4, p2: sub2 }
    explanation:
      correct:
        en: |
          The dashboard works per subscription and shows what the enabled plans allow. The AI threat protection widget needs threat protection for AI services, and finding sensitive grounding data needs Defender CSPM with the sensitive data discovery extension: only Sub4 has all three. Data threat protection alerts for managed databases come from Defender for Databases, which is on in Sub2 only.
        fr: |
          Le tableau de bord fonctionne par abonnement et affiche ce que permettent les plans activés. Le widget AI threat protection exige la protection contre les menaces pour les services d'IA, et trouver les données d'ancrage sensibles exige Defender CSPM avec l'extension de découverte des données sensibles : seul Sub4 réunit les trois. Les alertes de protection contre les menaces sur les bases de données managées viennent de Defender for Databases, activé uniquement dans Sub2.
      options:
        sub1: { en: "Sub1 has sensitive data discovery but not the AI services plan, and Defender for Databases is off.", fr: "Sub1 a la découverte des données sensibles, mais pas le plan AI services, et Defender for Databases est désactivé." }
        sub3: { en: "Sub3 has the AI services plan but no Defender CSPM, so no sensitive data discovery, and Defender for Databases is off.", fr: "Sub3 a le plan AI services mais pas Defender CSPM, donc pas de découverte des données sensibles, et Defender for Databases est désactivé." }
    references:
      - title: Data and AI Security Dashboard - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/data-aware-security-dashboard-overview

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-32-10
    objective: "3.1.9"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has an agent named **TripPlanner** built in Foundry Agent Service. TripPlanner uses the Bing Grounding tool and the model deployment **gpt-travel**. TripPlanner has no guardrail of its own, so it uses the guardrail of gpt-travel, named **gr-travel**, which sets **Violence** to **High** at the user input and output intervention points.

        You need to assign TripPlanner a custom guardrail that meets the following requirements:

        - Jailbreak attempts typed by users are blocked before they reach the agent.
        - Instructions hidden in the web pages returned by Bing Grounding stop the agent.
        - The violence filtering that TripPlanner receives today stays the same.
        - gr-travel isn't modified.

        Which set of controls should the guardrail contain? Every control uses the Annotate and block action.
      fr: |
        Fabrikam, Inc. dispose d'un agent nommé **TripPlanner** créé dans Foundry Agent Service. TripPlanner utilise l'outil Bing Grounding et le déploiement de modèle **gpt-travel**. TripPlanner n'a pas de garde-fou propre : il utilise donc le garde-fou de gpt-travel, nommé **gr-travel**, qui définit **Violence** sur **High** aux points d'intervention User input et Output.

        Vous devez attribuer à TripPlanner un garde-fou personnalisé qui satisfait aux exigences suivantes :

        - Les tentatives de jailbreak saisies par les utilisateurs sont bloquées avant d'atteindre l'agent.
        - Les instructions cachées dans les pages web renvoyées par Bing Grounding arrêtent l'agent.
        - Le filtrage de la violence que reçoit TripPlanner aujourd'hui reste le même.
        - gr-travel n'est pas modifié.

        Quel ensemble de contrôles le garde-fou doit-il contenir ? Chaque contrôle utilise l'action Annotate and block.
    body:
      options:
        - { id: a, text: { en: "User prompt attacks at User input; Indirect attacks at User input; Violence at High at User input and Output", fr: "User prompt attacks à User input ; Indirect attacks à User input ; Violence au niveau High à User input et Output" } }
        - { id: b, text: { en: "User prompt attacks at User input; Indirect attacks at Tool response; Violence at Low at User input and Output", fr: "User prompt attacks à User input ; Indirect attacks à Tool response ; Violence au niveau Low à User input et Output" } }
        - { id: c, text: { en: "User prompt attacks at Tool call; Indirect attacks at Tool response; Violence at High at User input and Output", fr: "User prompt attacks à Tool call ; Indirect attacks à Tool response ; Violence au niveau High à User input et Output" } }
        - { id: d, text: { en: "User prompt attacks at User input; Indirect attacks at Tool response; Violence at High at User input and Output", fr: "User prompt attacks à User input ; Indirect attacks à Tool response ; Violence au niveau High à User input et Output" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A user's jailbreak is a user prompt attack, scanned at the User input point. Instructions hidden in content returned by a tool are an indirect attack, scanned at the Tool response point, and Bing Grounding supports tool moderation. Because an agent's guardrail fully overrides the guardrail of its model deployment, the new guardrail must itself set Violence at High on User input and Output to keep today's filtering.
        fr: |
          Le jailbreak d'un utilisateur est une attaque par prompt utilisateur, analysée au point User input. Des instructions cachées dans le contenu renvoyé par un outil sont une attaque indirecte, analysée au point Tool response, et Bing Grounding prend en charge la modération des outils. Comme le garde-fou d'un agent remplace entièrement celui de son déploiement de modèle, le nouveau garde-fou doit lui-même définir Violence au niveau High sur User input et Output pour conserver le filtrage actuel.
      options:
        a: { en: "The web pages come back from the tool: an Indirect attacks control at User input doesn't scan the Bing Grounding responses.", fr: "Les pages web reviennent de l'outil : un contrôle Indirect attacks à User input n'analyse pas les réponses de Bing Grounding." }
        b: { en: "The agent's guardrail replaces gr-travel, so Violence at Low would block only high-severity content instead of every severity.", fr: "Le garde-fou de l'agent remplace gr-travel : Violence au niveau Low ne bloquerait que le contenu de gravité élevée au lieu de toutes les gravités." }
        c: { en: "A jailbreak typed by a user arrives in the user input; the Tool call point scans what the agent sends to a tool.", fr: "Un jailbreak saisi par un utilisateur arrive dans l'entrée utilisateur ; le point Tool call analyse ce que l'agent envoie à un outil." }
    references:
      - title: Guardrails and controls overview in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
      - title: Intervention points concepts - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
