chapter: 31-ai-data-agents
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-31-01
    objective: "3.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. uses Microsoft Purview DSPM for AI. The Windows devices of its employees are onboarded to Microsoft Purview and have the Microsoft Purview browser extension. Activity explorer shows that several employees pasted customer credit card numbers into a third-party generative AI website.

        You need to prevent employees from pasting this type of data into the website.

        What should you do?
      fr: |
        Contoso, Ltd. utilise Microsoft Purview DSPM for AI. Les appareils Windows de ses employés sont intégrés à Microsoft Purview et disposent de l'extension de navigateur Microsoft Purview. L'explorateur d'activités montre que plusieurs employés ont collé des numéros de carte bancaire de clients dans un site web d'IA générative tiers.

        Vous devez empêcher les employés de coller ce type de données dans le site web.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a custom data risk assessment in DSPM for AI that covers these employees.", fr: "Créer dans DSPM for AI une évaluation personnalisée des risques liés aux données qui couvre ces employés." } }
        - { id: b, text: { en: "Activate the one-click policy DSPM for AI - Detect risky AI usage for these employees.", fr: "Activer pour ces employés la stratégie en un clic DSPM for AI - Detect risky AI usage." } }
        - { id: c, text: { en: "Create a Microsoft Purview DLP policy that blocks sharing this data with the AI website.", fr: "Créer une stratégie DLP Microsoft Purview qui bloque le partage de ces données avec le site web d'IA." } }
        - { id: d, text: { en: "Enable restricted content discovery on the SharePoint sites that store the customer data.", fr: "Activer la découverte de contenu restreinte sur les sites SharePoint qui stockent les données clients." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          DSPM for AI gives visibility into AI interactions, but it doesn't block anything by itself: enforcement comes from the policies it relies on. A Microsoft Purview DLP policy can warn or block when users share sensitive information with third-party AI sites, which requires the onboarded devices and the browser extension that Contoso already has.
        fr: |
          DSPM for AI donne de la visibilité sur les interactions d'IA, mais ne bloque rien par lui-même : l'application vient des stratégies sur lesquelles il s'appuie. Une stratégie DLP Microsoft Purview peut avertir ou bloquer quand des utilisateurs partagent des informations sensibles avec des sites d'IA tiers, ce qui exige les appareils intégrés et l'extension de navigateur dont Contoso dispose déjà.
      options:
        a: { en: "A data risk assessment finds overshared SharePoint content used for grounding; it doesn't act on what users paste into websites.", fr: "Une évaluation des risques liés aux données détecte le contenu SharePoint surpartagé utilisé pour l'ancrage ; elle n'agit pas sur ce que les utilisateurs collent dans des sites web." }
        b: { en: "Detect risky AI usage is an Insider Risk Management policy that calculates user risk; it detects and alerts but doesn't block the paste.", fr: "Detect risky AI usage est une stratégie de gestion des risques internes qui calcule le risque utilisateur ; elle détecte et alerte, mais ne bloque pas le collage." }
        d: { en: "Restricted content discovery hides sites from organization-wide search and Copilot; users who already have the data can still paste it anywhere.", fr: "La découverte de contenu restreinte masque des sites dans la recherche à l'échelle de l'organisation et dans Copilot ; les utilisateurs qui ont déjà les données peuvent toujours les coller n'importe où." }
    references:
      - title: Considerations for DSPM for AI to manage data security and compliance protections for AI interactions - (classic)
        url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview-considerations

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-31-02
    objective: "3.1.11"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. starts a pilot of agents for Microsoft 365 Copilot. During the pilot, only the members of a group named **Pilot-Agents** must be able to use agents and plugins. The other users must not use any agent or plugin, whoever publishes it.

        What should you configure in **Agents > Settings** in the Microsoft 365 admin center?
      fr: |
        Fabrikam, Inc. lance un pilote d'agents pour Microsoft 365 Copilot. Pendant le pilote, seuls les membres d'un groupe nommé **Pilot-Agents** doivent pouvoir utiliser des agents et des plug-ins. Les autres utilisateurs ne doivent utiliser aucun agent ni aucun plug-in, quel qu'en soit l'éditeur.

        Que devez-vous configurer dans **Agents > Settings** du Centre d'administration Microsoft 365 ?
    body:
      options:
        - { id: a, text: { en: "Set **Sharing** to **Specific users** and select Pilot-Agents.", fr: "Définir **Sharing** sur **Specific users** et sélectionner Pilot-Agents." } }
        - { id: b, text: { en: "Set **User access** to **Specific users or groups** and select Pilot-Agents.", fr: "Définir **User access** sur **Specific users or groups** et sélectionner Pilot-Agents." } }
        - { id: c, text: { en: "In **Agent and plugin access**, clear the three **Allow** options.", fr: "Dans **Agent and plugin access**, désélectionner les trois options **Allow**." } }
        - { id: d, text: { en: "Create an **Agent management rules** entry that installs agents for Pilot-Agents.", fr: "Créer une entrée **Agent management rules** qui installe les agents pour Pilot-Agents." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          User access controls who can access and install agents and plugins: All users (the default), No users, or Specific users or groups. With Specific users or groups, only the selected users can use agents and plugins, even if other users have install permissions in the Agent Registry.
        fr: |
          User access contrôle qui peut accéder aux agents et aux plug-ins et les installer : All users (par défaut), No users, ou Specific users or groups. Avec Specific users or groups, seuls les utilisateurs sélectionnés peuvent utiliser les agents et les plug-ins, même si d'autres utilisateurs ont des autorisations d'installation dans le registre des agents.
      options:
        a: { en: "Sharing only controls who can share agents built with Agent Builder; it doesn't restrict who uses agents.", fr: "Sharing contrôle seulement qui peut partager les agents créés avec Agent Builder ; il ne restreint pas qui utilise les agents." }
        c: { en: "Agent and plugin access applies to every user and hides agent types from the Agent Store; it can't keep agents for one group.", fr: "Agent and plugin access s'applique à tous les utilisateurs et masque des types d'agents dans l'Agent Store ; il ne peut pas réserver les agents à un groupe." }
        d: { en: "Installing agents for a group deploys them to that group but doesn't prevent the other users from using agents.", fr: "Installer des agents pour un groupe les déploie pour ce groupe, mais n'empêche pas les autres utilisateurs d'utiliser des agents." }
    references:
      - title: Agent settings in Microsoft 365 admin center
        url: https://learn.microsoft.com/en-us/microsoft-agent-365/admin/agent-settings

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-31-03
    objective: "3.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys enabled security for AI agents in the Microsoft Defender portal. **Assets > AI Agents** lists an agent named **PolicyBot** built with Copilot Studio and an agent named **ClaimsBot** built in Microsoft Foundry.

        You need to assess the blast radius of PolicyBot: the breadth of its permissions, its knowledge source configuration and its risky settings.

        What should you do in the Microsoft Defender portal?
      fr: |
        Tailspin Toys a activé la sécurité des agents d'IA dans le portail Microsoft Defender. **Assets > AI Agents** liste un agent nommé **PolicyBot** créé avec Copilot Studio et un agent nommé **ClaimsBot** créé dans Microsoft Foundry.

        Vous devez évaluer le rayon d'impact de PolicyBot : l'étendue de ses autorisations, la configuration de ses sources de connaissances et ses paramètres à risque.

        Que devez-vous faire dans le portail Microsoft Defender ?
    body:
      options:
        - { id: a, text: { en: "In Assets > AI Agents, select PolicyBot and review the risk factors in its detail pane.", fr: "Dans Assets > AI Agents, sélectionner PolicyBot et examiner les facteurs de risque de son volet de détails." } }
        - { id: b, text: { en: "In Assets > AI Agents, select PolicyBot and select View on map to display its attack paths.", fr: "Dans Assets > AI Agents, sélectionner PolicyBot et sélectionner View on map pour afficher ses chemins d'attaque." } }
        - { id: c, text: { en: "In Advanced hunting, open the Queries tab and run the AI Agents queries for PolicyBot.", fr: "Dans le repérage avancé, ouvrir l'onglet Queries et exécuter les requêtes AI Agents pour PolicyBot." } }
        - { id: d, text: { en: "In the Risky Agents report of ID Protection, review the risk detections of PolicyBot.", fr: "Dans le rapport Risky Agents d'ID Protection, examiner les détections de risque de PolicyBot." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          For Copilot Studio agents, the AI Agents inventory supports discovery only, not posture analysis in the UI. The prebuilt AI Agents queries of advanced hunting analyze their permission breadth, knowledge source configuration and risky settings. The detail pane and View on map are available for Foundry, AWS Bedrock and GCP Vertex AI agents such as ClaimsBot.
        fr: |
          Pour les agents Copilot Studio, l'inventaire AI Agents ne prend en charge que la découverte, pas l'analyse de posture dans l'interface. Les requêtes prédéfinies AI Agents du repérage avancé analysent l'étendue de leurs autorisations, la configuration de leurs sources de connaissances et leurs paramètres à risque. Le volet de détails et View on map sont disponibles pour les agents Foundry, AWS Bedrock et GCP Vertex AI, comme ClaimsBot.
      options:
        a: { en: "The detail pane with permissions, knowledge sources and risk factors is offered for Foundry, Bedrock and Vertex AI agents, not for Copilot Studio agents.", fr: "Le volet de détails avec les autorisations, les sources de connaissances et les facteurs de risque est proposé pour les agents Foundry, Bedrock et Vertex AI, pas pour les agents Copilot Studio." }
        b: { en: "View on map opens from the detail pane of Foundry, Bedrock and Vertex AI agents; Copilot Studio agents are analyzed in advanced hunting.", fr: "View on map s'ouvre depuis le volet de détails des agents Foundry, Bedrock et Vertex AI ; les agents Copilot Studio s'analysent dans le repérage avancé." }
        d: { en: "The Risky Agents report lists risk detections such as sign-in spikes; it doesn't assess permissions or knowledge sources.", fr: "Le rapport Risky Agents liste des détections de risque comme les pics de connexion ; il n'évalue ni les autorisations ni les sources de connaissances." }
    references:
      - title: Assess blast radius and attack paths - Training
        url: https://learn.microsoft.com/en-us/training/modules/analyze-ai-identity-risks-defender-xdr/3-assess-blast-radius-attack-paths

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-31-04
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders protects its Copilot Studio agents with Microsoft Defender real-time protection. Security for AI Agents is turned on, the Power Platform side of the integration shows **Connected**, and only the built-in Default rule exists.

        During a test, analysts trigger risky tool invocations in a Copilot Studio agent. No alert or incident for the agent appears in **Incidents & alerts**.

        You need alerts and incidents for Copilot Studio agent activity to appear in the Microsoft Defender portal.

        What should you do?
      fr: |
        Northwind Traders protège ses agents Copilot Studio avec la protection en temps réel de Microsoft Defender. Security for AI Agents est activé, la partie Power Platform de l'intégration affiche **Connected**, et seule la règle intégrée Default existe.

        Pendant un test, des analystes déclenchent des invocations d'outils à risque dans un agent Copilot Studio. Aucune alerte ni aucun incident concernant l'agent n'apparaît dans **Incidents & alerts**.

        Vous devez faire apparaître dans le portail Microsoft Defender des alertes et des incidents pour l'activité des agents Copilot Studio.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a custom real-time protection rule that blocks every detection type for all agents.", fr: "Créer une règle de protection en temps réel personnalisée qui bloque tous les types de détection pour tous les agents." } }
        - { id: b, text: { en: "In the Power Platform admin center, set Set error behavior to Block the query.", fr: "Dans le Centre d'administration Power Platform, définir Set error behavior sur Block the query." } }
        - { id: c, text: { en: "In Settings > Security for AI > Get started, connect the Microsoft 365 connector.", fr: "Dans Settings > Security for AI > Get started, connecter le connecteur Microsoft 365." } }
        - { id: d, text: { en: "In the Power Platform admin center, set up Additional threat detection for the environment.", fr: "Dans le Centre d'administration Power Platform, configurer Additional threat detection pour l'environnement." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          For Copilot Studio agents, alerts and incidents appear in the Defender portal only when the Microsoft 365 connector is connected; it also enables investigation and advanced hunting of AI agent activity. You connect it from the Get started checklist of Security for AI, with at least Microsoft Entra ID Management events and Microsoft 365 activities selected.
        fr: |
          Pour les agents Copilot Studio, les alertes et les incidents n'apparaissent dans le portail Defender que si le connecteur Microsoft 365 est connecté ; il permet aussi l'investigation et le repérage avancé de l'activité des agents d'IA. Vous le connectez depuis la liste de configuration Get started de Security for AI, avec au moins Microsoft Entra ID Management events et Microsoft 365 activities sélectionnés.
      options:
        a: { en: "A blocking rule stops matching actions before they run; it doesn't make the missing alerts and incidents appear.", fr: "Une règle de blocage arrête les actions correspondantes avant leur exécution ; elle ne fait pas apparaître les alertes et les incidents manquants." }
        b: { en: "Set error behavior decides whether the tool runs when the provider doesn't answer within one second; it has no effect on alerts.", fr: "Set error behavior décide si l'outil s'exécute quand le fournisseur ne répond pas en une seconde ; il n'a aucun effet sur les alertes." }
        d: { en: "Additional threat detection configures a provider per environment; the Defender integration is already connected and evaluates the agents.", fr: "Additional threat detection configure un fournisseur par environnement ; l'intégration Defender est déjà connectée et évalue les agents." }
    references:
      - title: Enable security for AI agents using Microsoft Defender
        url: https://learn.microsoft.com/en-us/defender-xdr/security-for-ai/get-started-defender-security-for-ai

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-31-05
    objective: "3.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation uses Microsoft Entra Agent ID and Microsoft Agent 365. A user named **User1** is the sponsor of 30 agent identities. Other employees will also leave the company and change departments over time.

        You need to ensure that when a sponsor leaves the company, the sponsorship of their agent identities moves to the sponsor's manager automatically. The solution must minimize administrative effort.

        What should you use?
      fr: |
        Adatum Corporation utilise Microsoft Entra Agent ID et Microsoft Agent 365. Un utilisateur nommé **User1** est le sponsor de 30 identités d'agent. D'autres employés quitteront aussi l'entreprise ou changeront de service au fil du temps.

        Vous devez faire en sorte que, quand un sponsor quitte l'entreprise, le parrainage de ses identités d'agent passe automatiquement à son responsable. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "An access review of the access packages that are assigned to the agent identities", fr: "Une révision d'accès des packages d'accès attribués aux identités d'agent" } }
        - { id: b, text: { en: "A leaver workflow in Lifecycle Workflows that includes the agent identity sponsor tasks", fr: "Un flux de travail de départ dans les flux de travail de cycle de vie qui inclut les tâches de sponsor d'identité d'agent" } }
        - { id: c, text: { en: "The default inactivity policy of Microsoft Entra Agent ID, which acts on the agent identities of inactive sponsors", fr: "La stratégie d'inactivité par défaut de Microsoft Entra Agent ID, qui agit sur les identités d'agent des sponsors inactifs" } }
        - { id: d, text: { en: "The manager of each sponsor, added as an owner of every agent identity that the sponsor is accountable for", fr: "Le responsable de chaque sponsor, ajouté comme propriétaire de chaque identité d'agent dont le sponsor est responsable" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Lifecycle Workflows has agent identity sponsor tasks for mover and leaver workflows. The Transfer agent identity sponsorships to manager task moves the sponsorship of the departing sponsor's agent identities to that sponsor's manager, so the agents always keep an accountable sponsor without manual work.
        fr: |
          Les flux de travail de cycle de vie proposent des tâches de sponsor d'identité d'agent pour les flux de mobilité et de départ. La tâche Transfer agent identity sponsorships to manager transfère le parrainage des identités d'agent du sponsor qui part à son responsable : les agents gardent ainsi toujours un sponsor responsable, sans travail manuel.
      options:
        a: { en: "An access review recertifies the access that agents hold; it doesn't change who sponsors them.", fr: "Une révision d'accès recertifie les accès détenus par les agents ; elle ne change pas leur sponsor." }
        c: { en: "The inactivity policy watches the activity of agent identities and disables inactive ones; it doesn't track sponsors or reassign them.", fr: "La stratégie d'inactivité surveille l'activité des identités d'agent et désactive celles qui sont inactives ; elle ne suit pas les sponsors et ne les réattribue pas." }
        d: { en: "Owners handle technical administration and don't replace the required sponsor; adding them for every agent is also manual work.", fr: "Les propriétaires assurent l'administration technique et ne remplacent pas le sponsor obligatoire ; les ajouter pour chaque agent est en outre un travail manuel." }
    references:
      - title: Agent identity sponsor tasks in Lifecycle Workflows
        url: https://learn.microsoft.com/en-us/entra/id-governance/agent-sponsor-tasks
      - title: Governing Agent Identities
        url: https://learn.microsoft.com/en-us/entra/id-governance/agent-id-governance-overview

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-31-06
    objective: "3.1.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank uses Microsoft Entra ID Governance with Microsoft Agent 365 licenses. An autonomous agent identity named **LedgerBot** runs without a signed-in user. A user named **User1** is the sponsor of LedgerBot, and a user named **User2** is its owner.

        You create an access package named **AP-Ledger** that contains the membership of a security group and a Microsoft Entra role. Its assignment policy has the following settings:

        - **Who can get access**: For users, service principals, and agent identities in your directory > All agents
        - **Expiration**: assignments expire after 90 days; extensions are allowed

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank utilise Microsoft Entra ID Governance avec des licences Microsoft Agent 365. Une identité d'agent autonome nommée **LedgerBot** s'exécute sans utilisateur connecté. Un utilisateur nommé **User1** est le sponsor de LedgerBot, et un utilisateur nommé **User2** en est le propriétaire.

        Vous créez un package d'accès nommé **AP-Ledger** qui contient l'appartenance à un groupe de sécurité et un rôle Microsoft Entra. Sa stratégie d'attribution a les paramètres suivants :

        - **Who can get access** : For users, service principals, and agent identities in your directory > All agents
        - **Expiration** : les attributions expirent après 90 jours ; les prolongations sont autorisées

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "LedgerBot can request AP-Ledger for itself by calling Microsoft Graph, without any user involved in the request.", fr: "LedgerBot peut demander AP-Ledger pour lui-même en appelant Microsoft Graph, sans qu'aucun utilisateur n'intervienne dans la demande." }
        - id: s2
          text: { en: "If User1 doesn't act on the expiration notifications, the assignment of LedgerBot is extended because LedgerBot is still active.", fr: "Si User1 ne donne pas suite aux notifications d'expiration, l'attribution de LedgerBot est prolongée parce que LedgerBot est toujours actif." }
        - id: s3
          text: { en: "Under this policy, a deployment tool that authenticates with a regular service principal, not an agent identity, can also be assigned AP-Ledger.", fr: "Avec cette stratégie, un outil de déploiement qui s'authentifie avec un principal de service classique, et non une identité d'agent, peut aussi se voir attribuer AP-Ledger." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          An agent identity can request an access package programmatically by creating an `accessPackageAssignmentRequest` in Microsoft Graph; its sponsor or owner can also request it on its behalf, or an administrator can assign it. When an assignment approaches expiry, the sponsor is notified and can request an extension; without action, the assignment expires and the agent loses the group membership and the role. The All agents option targets agent identities: agents that use regular service principals need a separate policy with All Service principals.
        fr: |
          Une identité d'agent peut demander un package d'accès par programmation en créant une `accessPackageAssignmentRequest` dans Microsoft Graph ; son sponsor ou son propriétaire peut aussi le demander pour elle, ou un administrateur peut le lui attribuer. Quand une attribution approche de son expiration, le sponsor est averti et peut demander une prolongation ; sans action, l'attribution expire et l'agent perd l'appartenance au groupe et le rôle. L'option All agents cible les identités d'agent : les agents qui utilisent des principaux de service classiques ont besoin d'une stratégie distincte avec All Service principals.
      options:
        s2: { en: "Nothing extends the assignment automatically: the sponsor must request the extension, otherwise the assignment ends on its expiration date.", fr: "Rien ne prolonge automatiquement l'attribution : le sponsor doit demander la prolongation, sinon l'attribution prend fin à sa date d'expiration." }
        s3: { en: "All agents doesn't include regular service principals; a second policy with All Service principals would be needed for them.", fr: "All agents n'inclut pas les principaux de service classiques ; une seconde stratégie avec All Service principals serait nécessaire pour eux." }
    references:
      - title: Governing Agent Identities
        url: https://learn.microsoft.com/en-us/entra/id-governance/agent-id-governance-overview

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-31-07
    objective: "3.1.11"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. manages its agents in the Agent Registry of the Microsoft 365 admin center. A developer built an agent named **ExpenseHelper** in Copilot Studio. While testing, the developer used **See agent in Microsoft 365** and shared the agent with a few colleagues. Later, the agent was submitted for approval and published to the organization.

        The security team reports that ExpenseHelper exposes confidential data. Two days ago, you deleted the ExpenseHelper entry whose publisher type is **Published by your org**. Today, some of the colleagues still use ExpenseHelper. All the other agents of the organization must remain available.

        You need to stop all users from using ExpenseHelper.

        What should you do?
      fr: |
        Litware, Inc. gère ses agents dans le registre des agents du Centre d'administration Microsoft 365. Un développeur a créé un agent nommé **ExpenseHelper** dans Copilot Studio. Pendant ses tests, le développeur a utilisé **See agent in Microsoft 365** et partagé l'agent avec quelques collègues. Plus tard, l'agent a été soumis pour approbation et publié dans l'organisation.

        L'équipe de sécurité signale qu'ExpenseHelper expose des données confidentielles. Il y a deux jours, vous avez supprimé l'entrée d'ExpenseHelper dont le type d'éditeur est **Published by your org**. Aujourd'hui, certains des collègues utilisent toujours ExpenseHelper. Tous les autres agents de l'organisation doivent rester disponibles.

        Vous devez empêcher tous les utilisateurs d'utiliser ExpenseHelper.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In All agents > Deleted, permanently delete the Published by your org entry of ExpenseHelper.", fr: "Dans All agents > Deleted, supprimer définitivement l'entrée Published by your org d'ExpenseHelper." } }
        - { id: b, text: { en: "In Agents > Settings, turn off Allow agents and plugins built by your organization.", fr: "Dans Agents > Settings, désactiver Allow agents and plugins built by your organization." } }
        - { id: c, text: { en: "In Agents > Settings, set Sharing to No users so that ExpenseHelper is no longer shared.", fr: "Dans Agents > Settings, définir Sharing sur No users pour qu'ExpenseHelper ne soit plus partagé." } }
        - { id: d, text: { en: "In the Agent Registry, block the Shared by creator entry of ExpenseHelper.", fr: "Dans le registre des agents, bloquer l'entrée Shared by creator d'ExpenseHelper." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          See agent in Microsoft 365 creates a Shared by creator entry, and publishing to the organization creates a separate Published by your org entry. Each entry is its own lifecycle record, so removing one doesn't remove the other; the colleagues keep using the shared entry. Blocking that entry stops ExpenseHelper across the organization while the other agents stay available.
        fr: |
          See agent in Microsoft 365 crée une entrée Shared by creator, et la publication dans l'organisation crée une entrée Published by your org distincte. Chaque entrée a son propre cycle de vie : supprimer l'une ne supprime pas l'autre, et les collègues continuent d'utiliser l'entrée partagée. Bloquer cette entrée arrête ExpenseHelper dans toute l'organisation, tandis que les autres agents restent disponibles.
      options:
        a: { en: "The deleted entry is already unavailable to users; permanently deleting it doesn't affect the separate Shared by creator entry that the colleagues use.", fr: "L'entrée supprimée est déjà indisponible pour les utilisateurs ; la supprimer définitivement n'affecte pas l'entrée Shared by creator distincte qu'utilisent les collègues." }
        b: { en: "This setting hides every agent built by the organization from the Agent Store, which breaks the requirement to keep the other agents available.", fr: "Ce paramètre masque dans l'Agent Store tous les agents créés par l'organisation, ce qui enfreint l'exigence de garder les autres agents disponibles." }
        c: { en: "Sharing only governs future sharing of Agent Builder agents, and No users still allows sharing with specific people; it doesn't stop this Copilot Studio agent.", fr: "Sharing ne régit que le partage des agents Agent Builder, et No users autorise toujours le partage avec des personnes précises ; il n'arrête pas cet agent Copilot Studio." }
    references:
      - title: Manage agent registry in Microsoft 365 admin center
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-registry
      - title: Governance and Lifecycle actions for agents available in Microsoft 365 admin center
        url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-31-08
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware, Inc. has SharePoint Advanced Management and is rolling out Microsoft 365 Copilot. As a SharePoint administrator, you have the following requirements:

        - The owners of the 40 sites listed in the Everyone except external users report must check and fix the permissions of their own sites, because administrators can't see the item-level details.
        - The **Treasury** site must stop appearing in Copilot responses and organization-wide search while its owners clean up its links. Nobody may lose access to it during the cleanup.
        - Users must be prevented from downloading the files of the **Litigation** site.
        - Users must sign in from a compliant device to access the **Board** site, without changing the policies that apply to the other sites.

        Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. dispose de SharePoint Advanced Management et déploie Microsoft 365 Copilot. En tant qu'administrateur SharePoint, vous avez les exigences suivantes :

        - Les propriétaires des 40 sites listés dans le rapport Everyone except external users doivent vérifier et corriger eux-mêmes les autorisations de leurs sites, car les administrateurs ne voient pas les détails au niveau des éléments.
        - Le site **Treasury** ne doit plus apparaître dans les réponses de Copilot ni dans la recherche à l'échelle de l'organisation pendant que ses propriétaires nettoient ses liens. Personne ne doit perdre l'accès au site pendant le nettoyage.
        - Les utilisateurs ne doivent pas pouvoir télécharger les fichiers du site **Litigation**.
        - Les utilisateurs doivent se connecter depuis un appareil conforme pour accéder au site **Board**, sans modifier les stratégies qui s'appliquent aux autres sites.

        Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: sar, text: { en: "Site access review", fr: "Révision d'accès aux sites" } }
        - { id: rcd, text: { en: "Restricted content discovery", fr: "Découverte de contenu restreinte" } }
        - { id: rac, text: { en: "Restricted access control", fr: "Contrôle d'accès restreint" } }
        - { id: bdp, text: { en: "Block download policy", fr: "Stratégie de blocage du téléchargement" } }
        - { id: authctx, text: { en: "Conditional Access with an authentication context", fr: "Accès conditionnel avec un contexte d'authentification" } }
        - { id: dag, text: { en: "Site permissions across your organization report", fr: "Rapport Site permissions across your organization" } }
      targets:
        - { id: owners, text: { en: "Owners of the 40 sites fix their own permissions", fr: "Les propriétaires des 40 sites corrigent leurs propres autorisations" } }
        - { id: treasury, text: { en: "Treasury: out of Copilot and search, no access lost", fr: "Treasury : hors de Copilot et de la recherche, sans perte d'accès" } }
        - { id: litigation, text: { en: "Litigation: no file downloads", fr: "Litigation : aucun téléchargement de fichier" } }
        - { id: board, text: { en: "Board: compliant device required", fr: "Board : appareil conforme exigé" } }
    answer:
      mapping: { owners: sar, treasury: rcd, litigation: bdp, board: authctx }
    explanation:
      correct:
        en: |
          A site access review delegates the review of a data access governance finding to the owners of the overshared sites, who fix the permissions with Manage access. Restricted content discovery keeps a site out of organization-wide search and Copilot without changing permissions. A block download policy blocks downloading files from a site, and an authentication context connects a Microsoft Entra Conditional Access policy, such as one that requires a compliant device, to a specific site.
        fr: |
          Une révision d'accès aux sites délègue l'examen d'un constat de gouvernance de l'accès aux données aux propriétaires des sites surpartagés, qui corrigent les autorisations avec Manage access. La découverte de contenu restreinte exclut un site de la recherche à l'échelle de l'organisation et de Copilot sans changer les autorisations. Une stratégie de blocage du téléchargement bloque le téléchargement des fichiers d'un site, et un contexte d'authentification relie une stratégie d'accès conditionnel Microsoft Entra, par exemple une stratégie qui exige un appareil conforme, à un site précis.
      options:
        rac: { en: "Restricted access control limits access to members of specific groups: users outside them would lose access to Treasury, and it doesn't check device compliance.", fr: "Le contrôle d'accès restreint limite l'accès aux membres de groupes précis : les utilisateurs hors de ces groupes perdraient l'accès à Treasury, et il ne vérifie pas la conformité des appareils." }
        dag: { en: "This data access governance report finds overshared sites, but it doesn't hand the fix over to the site owners.", fr: "Ce rapport de gouvernance de l'accès aux données détecte les sites surpartagés, mais ne confie pas la correction aux propriétaires des sites." }
    references:
      - title: SharePoint Advanced Management overview
        url: https://learn.microsoft.com/en-us/sharepoint/advanced-management
      - title: Initiate site access reviews for data access governance reports
        url: https://learn.microsoft.com/en-us/sharepoint/site-access-review

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-31-09
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has ten autonomous agents created from the agent identity blueprint **bp-logistics**, including an agent named **RouteOptimizer**. No Conditional Access policy in the tenant uses the agent risk condition.

        In Microsoft Defender XDR, the attack paths of RouteOptimizer lead to the storage accounts that hold customer contracts. Microsoft Entra ID Protection reports a Medium risk with the detection **Suspicious credential usage**, and your investigation confirms that the credentials of RouteOptimizer are compromised.

        You need to immediately prevent RouteOptimizer from signing in to Microsoft Entra ID and connected apps. The other agents created from bp-logistics must keep working.

        What should you do?
      fr: |
        Fabrikam, Inc. dispose de dix agents autonomes créés à partir du blueprint d'identité d'agent **bp-logistics**, dont un agent nommé **RouteOptimizer**. Aucune stratégie d'accès conditionnel du locataire n'utilise la condition de risque d'agent.

        Dans Microsoft Defender XDR, les chemins d'attaque de RouteOptimizer mènent aux comptes de stockage qui contiennent les contrats clients. Microsoft Entra ID Protection signale un risque Medium avec la détection **Suspicious credential usage**, et votre investigation confirme que les informations d'identification de RouteOptimizer sont compromises.

        Vous devez empêcher immédiatement RouteOptimizer de se connecter à Microsoft Entra ID et aux applications connectées. Les autres agents créés à partir de bp-logistics doivent continuer à fonctionner.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the Risky Agents report, select Confirm compromise for RouteOptimizer.", fr: "Dans le rapport Risky Agents, sélectionner Confirm compromise pour RouteOptimizer." } }
        - { id: b, text: { en: "Create a Conditional Access policy that targets bp-logistics and blocks access.", fr: "Créer une stratégie d'accès conditionnel qui cible bp-logistics et bloque l'accès." } }
        - { id: c, text: { en: "In the Risky Agents report, select Disable for RouteOptimizer.", fr: "Dans le rapport Risky Agents, sélectionner Disable pour RouteOptimizer." } }
        - { id: d, text: { en: "Replace the storage permissions of RouteOptimizer with narrower scoped ones.", fr: "Remplacer les autorisations de stockage de RouteOptimizer par des autorisations plus étroites." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Disable prevents all sign-ins of the agent across Microsoft Entra ID and connected apps, and it acts on RouteOptimizer only. Confirm compromise sets the agent risk to High and records the event, but the block depends on a Conditional Access policy that uses the agent risk condition, and Fabrikam has none.
        fr: |
          Disable empêche toutes les connexions de l'agent dans Microsoft Entra ID et les applications connectées, et n'agit que sur RouteOptimizer. Confirm compromise fait passer le risque de l'agent à High et enregistre l'événement, mais le blocage dépend d'une stratégie d'accès conditionnel qui utilise la condition de risque d'agent, et Fabrikam n'en a aucune.
      options:
        a: { en: "Confirm compromise only raises the risk to High; without a Conditional Access policy on agent risk, nothing blocks the agent's sign-ins.", fr: "Confirm compromise ne fait que porter le risque à High ; sans stratégie d'accès conditionnel sur le risque d'agent, rien ne bloque les connexions de l'agent." }
        b: { en: "A policy that targets the blueprint applies to every agent identity created from it, so the nine other agents would be blocked too.", fr: "Une stratégie qui cible le blueprint s'applique à toutes les identités d'agent créées à partir de celui-ci : les neuf autres agents seraient bloqués aussi." }
        d: { en: "Narrower permissions reduce the blast radius, but the compromised credentials can still be used to sign in.", fr: "Des autorisations plus étroites réduisent le rayon d'impact, mais les informations d'identification compromises permettent toujours de se connecter." }
    references:
      - title: ID Protection for Agents
        url: https://learn.microsoft.com/en-us/entra/id-protection/concept-risky-agents
      - title: Conditional Access for Agents in Microsoft Entra
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-31-10
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware, Inc. has Microsoft 365 E7 licenses and uses Microsoft Entra Agent ID. The following Conditional Access policy is set to **On**:

        - **Users, agents or workload identities**: Agents. Include: All agent identities. Exclude: agent identities whose custom security attribute `AgentGovernance.Status` is `Approved`.
        - **Target resources**: All resources
        - **Grant**: Block access

        None of the agents listed in the options has the `Approved` attribute.

        Which two access attempts are blocked by this policy?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware, Inc. dispose de licences Microsoft 365 E7 et utilise Microsoft Entra Agent ID. La stratégie d'accès conditionnel suivante est définie sur **On** :

        - **Users, agents or workload identities** : Agents. Inclure : All agent identities. Exclure : les identités d'agent dont l'attribut de sécurité personnalisé `AgentGovernance.Status` vaut `Approved`.
        - **Target resources** : All resources
        - **Grant** : Block access

        Aucun des agents listés dans les options n'a l'attribut `Approved`.

        Quelles sont les deux tentatives d'accès bloquées par cette stratégie ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Agent1 reads the mailbox of a signed-in user through the on-behalf-of flow.", fr: "Agent1 lit la boîte aux lettres d'un utilisateur connecté par le flux on-behalf-of." } }
        - { id: b, text: { en: "Agent2 requests a token for Microsoft Graph with its own agent identity.", fr: "Agent2 demande un jeton pour Microsoft Graph avec sa propre identité d'agent." } }
        - { id: c, text: { en: "Agent3 calls a third-party CRM API that authenticates it with an API key.", fr: "Agent3 appelle une API de CRM tierce qui l'authentifie par une clé API." } }
        - { id: d, text: { en: "Agent4 signs in to Exchange Online with its paired agent user account.", fr: "Agent4 se connecte à Exchange Online avec son compte d'utilisateur d'agent associé." } }
        - { id: e, text: { en: "Agent5, created next month from a blueprint, gets a token for SharePoint with its agent identity.", fr: "Agent5, créé le mois prochain à partir d'un blueprint, obtient un jeton pour SharePoint avec son identité d'agent." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Conditional Access applies to the subject of the token issued by Microsoft Entra ID. When an agent uses its own agent identity, the agent identity is the subject, so the policy blocks Agent2 and also Agent5: All agent identities covers identities created later, and Agent5 doesn't have the attribute that would exclude it.
        fr: |
          L'accès conditionnel s'applique au sujet du jeton émis par Microsoft Entra ID. Quand un agent utilise sa propre identité d'agent, le sujet est l'identité d'agent : la stratégie bloque donc Agent2 et aussi Agent5, car All agent identities couvre les identités créées plus tard et Agent5 n'a pas l'attribut qui l'exclurait.
      options:
        a: { en: "In the on-behalf-of flow, the token subject is the signed-in user: the policies that target users apply, not this one.", fr: "Dans le flux on-behalf-of, le sujet du jeton est l'utilisateur connecté : ce sont les stratégies qui ciblent les utilisateurs qui s'appliquent, pas celle-ci." }
        c: { en: "An API key bypasses Microsoft Entra authentication, so no token is issued and Conditional Access isn't evaluated.", fr: "Une clé API contourne l'authentification Microsoft Entra : aucun jeton n'est émis et l'accès conditionnel n'est pas évalué." }
        d: { en: "A policy on agent identities doesn't cover the agent's user account; agent user accounts need a policy of their own.", fr: "Une stratégie sur les identités d'agent ne couvre pas le compte d'utilisateur de l'agent ; les comptes d'utilisateur d'agent ont besoin de leur propre stratégie." }
    references:
      - title: Conditional Access for Agents in Microsoft Entra
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
      - title: Secure autonomous agents with Conditional Access
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-autonomous-agents
