chapter: 11-entra-access
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-11-01
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has enabled the Temporary Access Pass method in the Authentication methods policy and kept all its default settings.

        A helpdesk administrator must give a new employee a Temporary Access Pass that stays valid for three days, from Friday to Monday. The creation of the pass fails because the requested validity isn't allowed.

        Which setting of the Temporary Access Pass method should you change?
      fr: |
        Contoso, Ltd. a activé la méthode Passe d'accès temporaire dans la stratégie des méthodes d'authentification et conservé tous ses paramètres par défaut.

        Un administrateur du support doit remettre à un nouvel employé un Passe d'accès temporaire valable trois jours, du vendredi au lundi. La création du passe échoue, car la validité demandée n'est pas autorisée.

        Quel paramètre de la méthode Passe d'accès temporaire devez-vous modifier ?
    body:
      options:
        - { id: a, text: Default lifetime }
        - { id: b, text: Maximum lifetime }
        - { id: c, text: One-time use }
        - { id: d, text: Minimum lifetime }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Temporary Access Pass can be valid from 10 minutes to 30 days, but the policy caps each pass at its Maximum lifetime, which is 8 hours by default. Raising Maximum lifetime to at least three days lets the helpdesk create the pass with the requested validity.
        fr: |
          Un Passe d'accès temporaire peut être valable de 10 minutes à 30 jours, mais la stratégie limite chaque passe à sa valeur Maximum lifetime, de 8 heures par défaut. Porter Maximum lifetime à au moins trois jours permet au support de créer le passe avec la validité demandée.
      options:
        a: { en: "Default lifetime (1 hour by default) is the value proposed when no lifetime is chosen; a pass can't exceed Maximum lifetime, whatever its default.", fr: "Default lifetime (1 heure par défaut) est la valeur proposée quand aucune durée n'est choisie ; un passe ne peut pas dépasser Maximum lifetime, quelle que soit cette valeur." }
        c: { en: "One-time use decides whether the pass can be used once or several times during its validity; it doesn't change how long it stays valid.", fr: "One-time use détermine si le passe s'utilise une seule fois ou plusieurs fois pendant sa validité ; il ne change pas sa durée de validité." }
        d: { en: "Minimum lifetime (1 hour by default) sets the shortest validity allowed; a three-day pass is rejected by the upper bound, not by the lower one.", fr: "Minimum lifetime (1 heure par défaut) fixe la validité la plus courte autorisée ; un passe de trois jours est refusé par la borne supérieure, pas par la borne inférieure." }
    references:
      - title: Configure a Temporary Access Pass in Microsoft Entra ID to register passwordless authentication methods - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-temporary-access-pass

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-11-02
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. plans to use PIM for Groups so that engineers activate their membership of a group just in time, with a justification.

        Which group can you enable in PIM for Groups?
      fr: |
        Fabrikam, Inc. prévoit d'utiliser PIM for Groups pour que les ingénieurs activent leur appartenance à un groupe juste-à-temps, avec une justification.

        Quel groupe pouvez-vous activer dans PIM for Groups ?
    body:
      options:
        - { id: a, text: { en: "A security group synchronized from on-premises Active Directory by Microsoft Entra Connect", fr: "Un groupe de sécurité synchronisé depuis l'Active Directory local par Microsoft Entra Connect" } }
        - { id: b, text: { en: "A Microsoft 365 group whose members are assigned directly by its owners", fr: "Un groupe Microsoft 365 dont les membres sont attribués directement par ses propriétaires" } }
        - { id: c, text: { en: "A security group whose members are added by a rule on the department attribute", fr: "Un groupe de sécurité dont les membres sont ajoutés par une règle sur l'attribut department" } }
        - { id: d, text: { en: "A Microsoft 365 group whose members are added by a rule on the job title attribute", fr: "Un groupe Microsoft 365 dont les membres sont ajoutés par une règle sur l'attribut jobTitle" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          PIM for Groups supports Microsoft Entra security groups and Microsoft 365 groups, except dynamic membership groups and groups synchronized from on-premises. A Microsoft 365 group with assigned membership therefore qualifies, and PIM then manages eligible membership and ownership through two policies.
        fr: |
          PIM for Groups prend en charge les groupes de sécurité Microsoft Entra et les groupes Microsoft 365, sauf les groupes d'appartenance dynamique et les groupes synchronisés depuis l'environnement local. Un groupe Microsoft 365 à appartenance attribuée convient donc, et PIM gère ensuite l'appartenance et la propriété éligibles par deux stratégies.
      options:
        a: { en: "Groups synchronized from an on-premises environment can't be enabled in PIM for Groups; their membership is managed on premises.", fr: "Les groupes synchronisés depuis un environnement local ne peuvent pas être activés dans PIM for Groups ; leur appartenance se gère en local." }
        c: { en: "A membership rule makes it a dynamic membership group, which PIM for Groups doesn't support.", fr: "Une règle d'appartenance en fait un groupe d'appartenance dynamique, que PIM for Groups ne prend pas en charge." }
        d: { en: "Dynamic membership is excluded for Microsoft 365 groups too: PIM can't make members eligible in a group whose membership a rule computes.", fr: "L'appartenance dynamique est exclue aussi pour les groupes Microsoft 365 : PIM ne peut pas rendre éligibles des membres d'un groupe dont une règle calcule l'appartenance." }
    references:
      - title: Privileged Identity Management (PIM) for Groups - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/concept-pim-for-groups

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-11-03
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has Microsoft Entra ID P1 licenses. The public IP range of the head office is defined in a named location that is marked as trusted.

        Users must be able to register their MFA and passwordless methods only while they are connected to the head office network. Their access to applications from other networks must not change.

        How should you configure the Conditional Access policy that targets all users?
      fr: |
        Northwind Traders dispose de licences Microsoft Entra ID P1. La plage d'adresses IP publiques du siège est définie dans un emplacement nommé marqué comme approuvé.

        Les utilisateurs ne doivent pouvoir inscrire leurs méthodes MFA et sans mot de passe que lorsqu'ils sont connectés au réseau du siège. Leur accès aux applications depuis d'autres réseaux ne doit pas changer.

        Comment devez-vous configurer la stratégie d'accès conditionnel qui cible tous les utilisateurs ?
    body:
      options:
        - { id: a, text: { en: "Target resources: All resources. Network: any network except trusted locations. Grant: Block access.", fr: "Ressources cibles : All resources. Réseau : tout réseau sauf les emplacements approuvés. Accorder : Bloquer l'accès." } }
        - { id: b, text: { en: "Target resources: user action Register or join devices. Network: any network except trusted locations. Grant: Block access.", fr: "Ressources cibles : action utilisateur Register or join devices. Réseau : tout réseau sauf les emplacements approuvés. Accorder : Bloquer l'accès." } }
        - { id: c, text: { en: "Target resources: user action Register security information. Network: trusted locations only. Grant: Block access.", fr: "Ressources cibles : action utilisateur Register security information. Réseau : emplacements approuvés uniquement. Accorder : Bloquer l'accès." } }
        - { id: d, text: { en: "Target resources: user action Register security information. Network: any network except trusted locations. Grant: Block access.", fr: "Ressources cibles : action utilisateur Register security information. Réseau : tout réseau sauf les emplacements approuvés. Accorder : Bloquer l'accès." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The user action Register security information lets a policy act only when users register their methods, so sign-ins to applications aren't affected. Including any network and excluding the trusted locations, with Block access, blocks registration everywhere except from the head office.
        fr: |
          L'action utilisateur Register security information permet à une stratégie d'agir uniquement quand les utilisateurs inscrivent leurs méthodes ; les connexions aux applications ne sont donc pas affectées. Inclure tout réseau et exclure les emplacements approuvés, avec Bloquer l'accès, bloque l'inscription partout sauf depuis le siège.
      options:
        a: { en: "All resources would block every sign-in from outside the head office, not only the registration of methods.", fr: "All resources bloquerait toutes les connexions depuis l'extérieur du siège, et pas seulement l'inscription des méthodes." }
        b: { en: "Register or join devices applies when users register or join devices to Microsoft Entra ID, not when they register authentication methods.", fr: "Register or join devices s'applique quand les utilisateurs inscrivent ou joignent des appareils à Microsoft Entra ID, pas quand ils inscrivent des méthodes d'authentification." }
        c: { en: "Including only the trusted locations would block registration from the head office and allow it everywhere else: the opposite of the requirement.", fr: "N'inclure que les emplacements approuvés bloquerait l'inscription depuis le siège et l'autoriserait partout ailleurs : l'inverse de l'exigence." }
    references:
      - title: Control security information registration with Conditional Access - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-all-users-security-info-registration
      - title: Targeting Resources in Conditional Access Policies - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-cloud-apps

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-11-04
    objective: "1.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation finds that a third-party application named **DocSyncPro** holds risky permissions in its Microsoft Entra tenant: several users consented to delegated Microsoft Graph permissions, and an administrator granted it Microsoft Graph application permissions.

        While the security team investigates, DocSyncPro must immediately stop receiving tokens, both on behalf of users and as itself. The existing permission grants must stay unchanged as evidence.

        What should you do?
      fr: |
        Adatum Corporation découvre qu'une application tierce nommée **DocSyncPro** détient des autorisations risquées dans son locataire Microsoft Entra : plusieurs utilisateurs ont consenti à des autorisations déléguées Microsoft Graph, et un administrateur lui a accordé des autorisations d'application Microsoft Graph.

        Pendant l'enquête de l'équipe de sécurité, DocSyncPro doit cesser immédiatement de recevoir des jetons, aussi bien au nom des utilisateurs qu'en son propre nom. Les octrois d'autorisations existants doivent rester inchangés comme éléments de preuve.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the properties of the DocSyncPro enterprise application, set Assignment required to Yes.", fr: "Dans les propriétés de l'application d'entreprise DocSyncPro, définir Assignment required sur Yes." } }
        - { id: b, text: { en: "In the properties of the DocSyncPro enterprise application, set Visible to users to No.", fr: "Dans les propriétés de l'application d'entreprise DocSyncPro, définir Visible to users sur No." } }
        - { id: c, text: { en: "In the properties of the DocSyncPro enterprise application, set Enabled for users to sign-in? to No.", fr: "Dans les propriétés de l'application d'entreprise DocSyncPro, définir Enabled for users to sign-in? sur No." } }
        - { id: d, text: { en: "In the user consent settings of the tenant, select Do not allow user consent.", fr: "Dans les paramètres de consentement de l'utilisateur du locataire, sélectionner Do not allow user consent." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With Enabled for users to sign-in? set to No, Microsoft Entra ID issues no token for the application: users can't sign in, even if they consented or are assigned, and the service principal can't use its application permissions. The setting disables the service principal without removing its grants, so the evidence stays in place.
        fr: |
          Avec Enabled for users to sign-in? défini sur No, Microsoft Entra ID n'émet aucun jeton pour l'application : les utilisateurs ne peuvent pas se connecter, même s'ils ont consenti ou sont attribués, et le principal de service ne peut pas utiliser ses autorisations d'application. Le paramètre désactive le principal de service sans supprimer ses octrois ; les preuves restent donc en place.
      options:
        a: { en: "Assignment required only controls who can sign in to DocSyncPro: it would stop unassigned users, but DocSyncPro could still use its application permissions without a user.", fr: "Assignment required contrôle seulement qui peut se connecter à DocSyncPro : il arrêterait les utilisateurs non attribués, mais DocSyncPro pourrait encore utiliser ses autorisations d'application sans utilisateur." }
        b: { en: "Visible to users only hides the application from My Apps and the Microsoft 365 launcher; tokens are still issued.", fr: "Visible to users masque seulement l'application dans Mes applications et le lanceur Microsoft 365 ; les jetons sont toujours émis." }
        d: { en: "Changing the user consent setting blocks future consents only: the grants already given keep working.", fr: "Modifier le paramètre de consentement de l'utilisateur bloque seulement les consentements futurs : les octrois déjà accordés continuent de fonctionner." }
    references:
      - title: Properties of an enterprise application - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/application-properties

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-11-05
    objective: "1.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. has a resource group named **rg-identities** that contains five user-assigned managed identities created by the security team. Members of a group named **Ops-VM** have the Virtual Machine Contributor role on the resource groups that contain the virtual machines.

        Ops-VM members must attach the identities of rg-identities to virtual machines. They must not be able to create, modify or delete identities. The solution must follow the principle of least privilege.

        Which role should you assign to Ops-VM on rg-identities?
      fr: |
        Litware, Inc. dispose d'un groupe de ressources nommé **rg-identities** qui contient cinq identités managées affectées par l'utilisateur, créées par l'équipe de sécurité. Les membres d'un groupe nommé **Ops-VM** ont le rôle Virtual Machine Contributor sur les groupes de ressources qui contiennent les machines virtuelles.

        Les membres d'Ops-VM doivent attacher les identités de rg-identities à des machines virtuelles. Ils ne doivent pas pouvoir créer, modifier ni supprimer d'identités. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer à Ops-VM sur rg-identities ?
    body:
      options:
        - { id: a, text: Managed Identity Contributor }
        - { id: b, text: Reader }
        - { id: c, text: Managed Identity Operator }
        - { id: d, text: User Access Administrator }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Attaching a user-assigned identity to a resource requires the `assign/action` permission on the identity, in addition to write access to the virtual machine. Managed Identity Operator reads and assigns user-assigned identities, with no write or delete permission on them.
        fr: |
          Attacher une identité affectée par l'utilisateur à une ressource exige l'autorisation `assign/action` sur l'identité, en plus de l'accès en écriture à la machine virtuelle. Managed Identity Operator lit et attribue les identités affectées par l'utilisateur, sans autorisation d'écriture ni de suppression sur elles.
      options:
        a: { en: "Managed Identity Contributor creates, updates and deletes identities, which Ops-VM must not do.", fr: "Managed Identity Contributor crée, met à jour et supprime des identités, ce qu'Ops-VM ne doit pas faire." }
        b: { en: "Reader lists the identities but doesn't include the assign action needed to attach them.", fr: "Reader liste les identités, mais n'inclut pas l'action d'attribution nécessaire pour les attacher." }
        d: { en: "User Access Administrator manages role assignments; it doesn't include the assign action of managed identities and grants far more than needed.", fr: "User Access Administrator gère les attributions de rôles ; il n'inclut pas l'action d'attribution des identités managées et accorde bien plus que nécessaire." }
    references:
      - title: Azure built-in roles for Identity - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/identity

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-11-06
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has Microsoft Entra ID P1 licenses. The following Conditional Access policies are enabled:

        - **CA-All**: all users, all resources, grant **Require authentication strength: Multifactor authentication**.
        - **CA-Ops**: members of a group named **Ops-Admins**, all resources, grant **Require authentication strength: Passwordless MFA**.

        The following members of Ops-Admins have registered only the authentication methods listed in the table.

        | User | Registered methods |
        | --- | --- |
        | User1 | Password, Microsoft Authenticator with push notifications |
        | User2 | Microsoft Authenticator with phone sign-in |
        | User3 | Password, Temporary Access Pass |
        | User4 | SMS sign-in |
        | User5 | Certificate-based authentication configured as multifactor |

        Which two users can satisfy both policies?

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose de licences Microsoft Entra ID P1. Les stratégies d'accès conditionnel suivantes sont activées :

        - **CA-All** : tous les utilisateurs, toutes les ressources, contrôle **Require authentication strength: Multifactor authentication**.
        - **CA-Ops** : membres d'un groupe nommé **Ops-Admins**, toutes les ressources, contrôle **Require authentication strength: Passwordless MFA**.

        Les membres suivants d'Ops-Admins n'ont inscrit que les méthodes d'authentification listées dans le tableau.

        | Utilisateur | Méthodes inscrites |
        | --- | --- |
        | User1 | Mot de passe, Microsoft Authenticator avec notifications push |
        | User2 | Microsoft Authenticator avec connexion par téléphone |
        | User3 | Mot de passe, Passe d'accès temporaire |
        | User4 | Connexion par SMS |
        | User5 | Authentification par certificat configurée comme multifacteur |

        Quels sont les deux utilisateurs qui peuvent satisfaire les deux stratégies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: u1, text: User1 }
        - { id: u2, text: User2 }
        - { id: u3, text: User3 }
        - { id: u4, text: User4 }
        - { id: u5, text: User5 }
    answer: { optionIds: [u2, u5] }
    explanation:
      correct:
        en: |
          Every policy that applies must be satisfied, so each user needs a method that is in both the Multifactor authentication and the Passwordless MFA strengths. Microsoft Authenticator phone sign-in and multifactor certificate-based authentication are in both built-in strengths. The other combinations satisfy at most the Multifactor authentication strength.
        fr: |
          Toutes les stratégies qui s'appliquent doivent être satisfaites ; chaque utilisateur a donc besoin d'une méthode présente à la fois dans la force Multifactor authentication et dans la force Passwordless MFA. La connexion par téléphone Microsoft Authenticator et l'authentification par certificat multifacteur figurent dans ces deux forces intégrées. Les autres combinaisons satisfont au plus la force Multifactor authentication.
      options:
        u1: { en: "Password plus a push notification satisfies the Multifactor authentication strength only: it is password-based, so Passwordless MFA rejects it.", fr: "Mot de passe plus notification push satisfait seulement la force Multifactor authentication : la combinaison repose sur un mot de passe, donc Passwordless MFA la refuse." }
        u3: { en: "A Temporary Access Pass is in the Multifactor authentication strength but not in Passwordless MFA.", fr: "Un Passe d'accès temporaire fait partie de la force Multifactor authentication, mais pas de Passwordless MFA." }
        u4: { en: "SMS sign-in is a single-factor method, in none of the built-in strengths: User4 fails both policies.", fr: "La connexion par SMS est une méthode à un seul facteur, absente de toutes les forces intégrées : User4 échoue aux deux stratégies." }
    references:
      - title: Overview of Conditional Access Authentication Strengths - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-strengths

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-11-07
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has an app registration named **gh-infra**. A GitHub Actions workflow of the repository **tailspin/platform** signs in to Azure as gh-infra by using workload identity federation. gh-infra has one federated credential, configured as follows:

        | Setting | Value |
        | --- | --- |
        | Federated credential scenario | GitHub Actions deploying Azure resources |
        | Organization / Repository | tailspin / platform |
        | Entity type | Branch |
        | GitHub branch name | main |

        To add protection rules, a developer edits the deploy job so that it references the GitHub environment **production**. Since then, the Azure sign-in step of the job fails, although the job still runs on the main branch.

        You need to restore authentication. Only jobs that run in the production environment must be able to sign in as gh-infra, and no secret may be stored in GitHub. What should you do?
      fr: |
        Tailspin Toys dispose d'une inscription d'application nommée **gh-infra**. Un workflow GitHub Actions du dépôt **tailspin/platform** se connecte à Azure en tant que gh-infra à l'aide de la fédération des identités de charge de travail. gh-infra a une seule information d'identification fédérée, configurée comme suit :

        | Paramètre | Valeur |
        | --- | --- |
        | Federated credential scenario | GitHub Actions deploying Azure resources |
        | Organization / Repository | tailspin / platform |
        | Entity type | Branch |
        | GitHub branch name | main |

        Pour ajouter des règles de protection, un développeur modifie le job de déploiement afin qu'il référence l'environnement GitHub **production**. Depuis, l'étape de connexion à Azure du job échoue, bien que le job s'exécute toujours sur la branche main.

        Vous devez rétablir l'authentification. Seuls les jobs qui s'exécutent dans l'environnement production doivent pouvoir se connecter en tant que gh-infra, et aucun secret ne doit être stocké dans GitHub. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the audience of the existing federated credential to the URL of the production environment.", fr: "Remplacer l'audience de l'information d'identification fédérée existante par l'URL de l'environnement production." } }
        - { id: b, text: { en: "Change the subject of the existing federated credential to `repo:tailspin/platform:*` to match every job.", fr: "Remplacer le sujet de l'information d'identification fédérée existante par `repo:tailspin/platform:*` pour couvrir tous les jobs." } }
        - { id: c, text: { en: "Store a client secret of gh-infra as a secret of the production environment, and sign in with it.", fr: "Stocker un secret client de gh-infra comme secret de l'environnement production, puis se connecter avec." } }
        - { id: d, text: { en: "Replace the existing federated credential with one whose entity type is Environment, named production.", fr: "Remplacer l'information d'identification fédérée existante par une autre de type d'entité Environment, nommée production." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          When a job references an environment, the subject of its GitHub token becomes `repo:tailspin/platform:environment:production` instead of the branch reference, and Microsoft Entra ID accepts the token only if a federated credential matches the subject exactly. A credential of entity type Environment named production matches these jobs, and removing the Branch credential prevents jobs without the environment from signing in.
        fr: |
          Quand un job référence un environnement, le sujet de son jeton GitHub devient `repo:tailspin/platform:environment:production` au lieu de la référence de branche, et Microsoft Entra ID n'accepte le jeton que si une information d'identification fédérée correspond exactement à ce sujet. Une information d'identification de type d'entité Environment nommée production correspond à ces jobs, et supprimer celle de type Branch empêche les jobs sans environnement de se connecter.
      options:
        a: { en: "The audience must stay `api://AzureADTokenExchange`; the mismatch is in the subject, not in the audience.", fr: "L'audience doit rester `api://AzureADTokenExchange` ; l'écart porte sur le sujet, pas sur l'audience." }
        b: { en: "Wildcard characters aren't supported in any federated credential property, and such a subject would also admit jobs outside production.", fr: "Les caractères génériques ne sont pris en charge dans aucune propriété d'une information d'identification fédérée, et un tel sujet admettrait aussi des jobs hors de production." }
        c: { en: "A client secret stored in GitHub violates the requirement and brings back a credential to protect and rotate.", fr: "Un secret client stocké dans GitHub enfreint l'exigence et réintroduit une information d'identification à protéger et à faire tourner." }
    references:
      - title: Create a trust relationship between an app and an external identity provider - Microsoft Entra Workload ID
        url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-11-08
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso, Ltd. has Microsoft Entra ID P1 licenses. The public IP range of the head office is defined in a named location named **HQ** that is marked as trusted. The tenant contains the following Conditional Access policies.

        | Policy | Users | Target resources | Network | Grant | State |
        | --- | --- | --- | --- | --- | --- |
        | CA1 | All users, except two emergency access accounts | All resources | Any network | Require multifactor authentication | On |
        | CA2 | Group Finance | Windows Azure Service Management API | Any network, except HQ | Block access | On |
        | CA3 | Group Admins | Microsoft Admin Portals | Any network | Require device to be marked as compliant, and Require authentication strength: Phishing-resistant MFA (Require all the selected controls) | Report-only |

        A user named User1 is a member of Finance and Admins. User1 has registered only Microsoft Authenticator with push notifications, and uses a laptop that is marked as compliant.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose de licences Microsoft Entra ID P1. La plage d'adresses IP publiques du siège est définie dans un emplacement nommé **HQ** marqué comme approuvé. Le locataire contient les stratégies d'accès conditionnel suivantes.

        | Stratégie | Utilisateurs | Ressources cibles | Réseau | Accorder | État |
        | --- | --- | --- | --- | --- | --- |
        | CA1 | Tous les utilisateurs, sauf deux comptes d'accès d'urgence | All resources | Tout réseau | Exiger l'authentification multifacteur | On |
        | CA2 | Groupe Finance | Windows Azure Service Management API | Tout réseau, sauf HQ | Bloquer l'accès | On |
        | CA3 | Groupe Admins | Microsoft Admin Portals | Tout réseau | Exiger que l'appareil soit marqué comme conforme, et Require authentication strength: Phishing-resistant MFA (Require all the selected controls) | Report-only |

        Un utilisateur nommé User1 est membre de Finance et d'Admins. User1 n'a inscrit que Microsoft Authenticator avec notifications push, et utilise un ordinateur portable marqué comme conforme.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When User1 opens the Azure portal from home and approves a push notification, access is blocked.", fr: "Quand User1 ouvre le portail Azure depuis son domicile et approuve une notification push, l'accès est bloqué." }
        - id: s2
          text: { en: "When User1 opens the Microsoft Entra admin center from the head office and approves a push notification, access is granted.", fr: "Quand User1 ouvre le centre d'administration Microsoft Entra depuis le siège et approuve une notification push, l'accès est accordé." }
        - id: s3
          text: { en: "If CA3 is set to On, User1 can open the Exchange admin center from the head office on the compliant laptop by approving a push notification.", fr: "Si CA3 est défini sur On, User1 peut ouvrir le centre d'administration Exchange depuis le siège sur l'ordinateur portable conforme en approuvant une notification push." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Windows Azure Service Management API covers the Azure portal, so CA2 blocks User1 from home whatever the MFA result, and a block wins over the other policies. From the head office, CA2 doesn't apply, CA1 is satisfied by the push notification, and CA3 is only evaluated in report-only mode. Once CA3 is On, both of its controls are required, and a push notification isn't in the Phishing-resistant MFA strength, even on a compliant device.
        fr: |
          Windows Azure Service Management API couvre le portail Azure ; CA2 bloque donc User1 depuis son domicile quel que soit le résultat de la MFA, et un blocage l'emporte sur les autres stratégies. Depuis le siège, CA2 ne s'applique pas, CA1 est satisfaite par la notification push et CA3 n'est évaluée qu'en mode rapport uniquement. Une fois CA3 sur On, ses deux contrôles sont exigés, et une notification push ne fait pas partie de la force Phishing-resistant MFA, même sur un appareil conforme.
      options:
        s2: { en: "Report-only policies are evaluated and logged but never enforced, so CA3 doesn't block User1 yet.", fr: "Les stratégies en mode rapport uniquement sont évaluées et journalisées, mais jamais appliquées ; CA3 ne bloque donc pas encore User1." }
        s3: { en: "Require all the selected controls is an AND: the compliant laptop satisfies one control, but the authentication strength still fails.", fr: "Require all the selected controls est un ET : l'ordinateur portable conforme satisfait un contrôle, mais la force d'authentification échoue toujours." }
    references:
      - title: Targeting Resources in Conditional Access Policies - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-cloud-apps
      - title: How to Configure Grant Controls in Microsoft Entra - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-11-09
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fabrikam, Inc. is hardening the consent configuration of its Microsoft Entra tenant. The four tasks in the answer area must be delegated to administrators. Each administrator must receive the least privileged built-in Microsoft Entra role that can perform the task.

        Which role should you assign for each task? To answer, drag the appropriate roles to the correct tasks. Each role may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. renforce la configuration du consentement de son locataire Microsoft Entra. Les quatre tâches de la zone de réponse doivent être déléguées à des administrateurs. Chaque administrateur doit recevoir le rôle Microsoft Entra intégré le moins privilégié qui permet d'effectuer la tâche.

        Quel rôle devez-vous attribuer pour chaque tâche ? Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: ga, text: Global Administrator }
        - { id: pra, text: Privileged Role Administrator }
        - { id: aa, text: Application Administrator }
        - { id: caa, text: Cloud Application Administrator }
        - { id: sa, text: Security Administrator }
      targets:
        - id: t1
          text: { en: "Turn on the admin consent workflow and select its reviewers", fr: "Activer le flux de travail de consentement administrateur et choisir ses réviseurs" }
        - id: t2
          text: { en: "Change the user consent setting of the tenant by using Microsoft Graph PowerShell", fr: "Modifier le paramètre de consentement de l'utilisateur du locataire à l'aide de Microsoft Graph PowerShell" }
        - id: t3
          text: { en: "Classify the delegated permissions openid, profile and email as low impact", fr: "Classer les autorisations déléguées openid, profile et email comme à faible impact" }
        - id: t4
          text: { en: "Grant tenant-wide admin consent to an app for delegated Microsoft Graph permissions that require admin consent", fr: "Accorder le consentement administrateur pour tout le locataire à une application pour des autorisations déléguées Microsoft Graph qui exigent le consentement administrateur" }
    answer:
      mapping: { t1: ga, t2: pra, t3: caa, t4: caa }
    explanation:
      correct:
        en: |
          Turning on the admin consent workflow requires a Global Administrator. The user consent setting is managed by a Privileged Role Administrator; Global Administrator is needed only when you use the admin center. Permission classifications are managed by an Application Administrator or a Cloud Application Administrator, and both roles can grant tenant-wide consent for delegated permissions: Cloud Application Administrator is the less privileged of the two because it can't manage application proxy.
        fr: |
          Activer le flux de travail de consentement administrateur exige un Global Administrator. Le paramètre de consentement de l'utilisateur se gère avec Privileged Role Administrator ; Global Administrator n'est nécessaire que dans le centre d'administration. Les classifications d'autorisations se gèrent avec Application Administrator ou Cloud Application Administrator, et ces deux rôles peuvent accorder le consentement pour tout le locataire à des autorisations déléguées : Cloud Application Administrator est le moins privilégié des deux, car il ne gère pas le proxy d'application.
      options:
        aa: { en: "Application Administrator can classify permissions and grant delegated consent, but it adds application proxy management: it isn't the least privileged choice.", fr: "Application Administrator peut classer les autorisations et accorder le consentement délégué, mais il ajoute la gestion du proxy d'application : ce n'est pas le choix le moins privilégié." }
        sa: { en: "Security Administrator isn't one of the roles that can configure consent settings, classifications or tenant-wide consent.", fr: "Security Administrator ne fait pas partie des rôles qui configurent les paramètres de consentement, les classifications ou le consentement pour tout le locataire." }
        pra: { en: "Privileged Role Administrator can also grant delegated consent, but it manages every role assignment: Cloud Application Administrator is enough for t3 and t4.", fr: "Privileged Role Administrator peut aussi accorder le consentement délégué, mais il gère toutes les attributions de rôles : Cloud Application Administrator suffit pour t3 et t4." }
    references:
      - title: Configure the admin consent workflow - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-admin-consent-workflow
      - title: Grant tenant-wide admin consent to an application - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-11-10
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso, Ltd. has Microsoft Entra ID P2 licenses. Six security analysts must obtain the **Security Administrator** role just in time. You have the following requirements:

        - The analysts must get the role through their membership of a new Microsoft Entra group named **SG-SecAdmins**.
        - An analyst must perform a single activation, valid for at most four hours, and a user named Lead1 must approve each activation.
        - The role settings of Security Administrator must not change, because other administrators have eligible assignments of the role that they activate without approval.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose de licences Microsoft Entra ID P2. Six analystes de sécurité doivent obtenir le rôle **Security Administrator** juste-à-temps. Vous avez les exigences suivantes :

        - Les analystes doivent obtenir le rôle par leur appartenance à un nouveau groupe Microsoft Entra nommé **SG-SecAdmins**.
        - Un analyste doit effectuer une seule activation, valable quatre heures au plus, et un utilisateur nommé Lead1 doit approuver chaque activation.
        - Les paramètres de rôle de Security Administrator ne doivent pas changer, car d'autres administrateurs ont des attributions éligibles de ce rôle qu'ils activent sans approbation.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          SG-SecAdmins: [[group]]
          Assignment of Security Administrator to SG-SecAdmins: [[roleasg]]
          Assignment of each analyst to SG-SecAdmins: [[member]]
          Approval by Lead1 and four-hour maximum, configured in: [[settings]]
        fr: |
          SG-SecAdmins : [[group]]
          Attribution de Security Administrator à SG-SecAdmins : [[roleasg]]
          Attribution de chaque analyste à SG-SecAdmins : [[member]]
          Approbation par Lead1 et maximum de quatre heures, configurés dans : [[settings]]
      slots:
        - id: group
          options:
            - { id: ra, text: { en: "A security group created with Microsoft Entra roles can be assigned to the group set to Yes", fr: "Un groupe de sécurité créé avec Microsoft Entra roles can be assigned to the group défini sur Yes" } }
            - { id: dyn, text: { en: "A security group with a dynamic membership rule on the department attribute", fr: "Un groupe de sécurité avec une règle d'appartenance dynamique sur l'attribut department" } }
            - { id: m365, text: { en: "A Microsoft 365 group created with the default settings", fr: "Un groupe Microsoft 365 créé avec les paramètres par défaut" } }
        - id: roleasg
          options:
            - { id: active, text: { en: "Active, permanent", fr: "Active, permanente" } }
            - { id: elig, text: { en: "Eligible, permanent", fr: "Éligible, permanente" } }
            - { id: eligtb, text: { en: "Eligible, time-bound", fr: "Éligible, limitée dans le temps" } }
        - id: member
          options:
            - { id: am, text: { en: "Active member", fr: "Membre actif" } }
            - { id: em, text: { en: "Eligible member", fr: "Membre éligible" } }
            - { id: eo, text: { en: "Eligible owner", fr: "Propriétaire éligible" } }
        - id: settings
          options:
            - { id: roleset, text: { en: "The role settings of Security Administrator in PIM for Microsoft Entra roles", fr: "Les paramètres de rôle de Security Administrator dans PIM pour les rôles Microsoft Entra" } }
            - { id: memset, text: { en: "The Member role settings of SG-SecAdmins in PIM for Groups", fr: "Les paramètres du rôle Member de SG-SecAdmins dans PIM for Groups" } }
            - { id: ownset, text: { en: "The Owner role settings of SG-SecAdmins in PIM for Groups", fr: "Les paramètres du rôle Owner de SG-SecAdmins dans PIM for Groups" } }
            - { id: ctx, text: { en: "A Conditional Access policy that targets an authentication context", fr: "Une stratégie d'accès conditionnel qui cible un contexte d'authentification" } }
    answer:
      values: { group: ra, roleasg: active, member: em, settings: memset }
    explanation:
      correct:
        en: |
          Only a group created as role-assignable can receive a Microsoft Entra role. With an active assignment of the role to the group and eligible memberships, the single activation is the membership activation, so the approval and the maximum duration belong to the Member role settings of the group in PIM for Groups. Microsoft recommends requiring approval for eligible members of groups used to elevate into Microsoft Entra roles.
        fr: |
          Seul un groupe créé comme assignable à un rôle peut recevoir un rôle Microsoft Entra. Avec une attribution active du rôle au groupe et des appartenances éligibles, l'activation unique est celle de l'appartenance ; l'approbation et la durée maximale relèvent donc des paramètres du rôle Member du groupe dans PIM for Groups. Microsoft recommande d'exiger une approbation pour les membres éligibles des groupes qui servent à obtenir des rôles Microsoft Entra.
      options:
        dyn: { en: "A dynamic membership group can't be enabled in PIM for Groups, and it isn't role-assignable.", fr: "Un groupe d'appartenance dynamique ne peut pas être activé dans PIM for Groups, et il n'est pas assignable à un rôle." }
        m365: { en: "A group created with the default settings isn't role-assignable, so it can't receive the Security Administrator role.", fr: "Un groupe créé avec les paramètres par défaut n'est pas assignable à un rôle ; il ne peut donc pas recevoir le rôle Security Administrator." }
        elig: { en: "An eligible role assignment combined with eligible membership forces two activations; combined with active membership, the approval would have to be set in the role settings of Security Administrator.", fr: "Une attribution de rôle éligible combinée à une appartenance éligible impose deux activations ; combinée à une appartenance active, l'approbation devrait se configurer dans les paramètres de rôle de Security Administrator." }
        roleset: { en: "Role settings are shared by every assignment of the role: changing them would also require approval from the other administrators.", fr: "Les paramètres de rôle valent pour toutes les attributions du rôle : les modifier imposerait aussi l'approbation aux autres administrateurs." }
        eo: { en: "Owners manage the group; eligible ownership doesn't give the role of the group to the analysts.", fr: "Les propriétaires gèrent le groupe ; une propriété éligible ne donne pas aux analystes le rôle du groupe." }
    references:
      - title: Privileged Identity Management (PIM) for Groups - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/concept-pim-for-groups
