chapter: 12-key-vault
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-12-01
    objective: "1.2.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. stores an API key as a secret named **PartnerKey** in a key vault named **kv-fab-int**. The current version of PartnerKey is enabled, and its expiration date (`exp`) passed yesterday.

        An application that has the required permissions requests the current version of PartnerKey by using a get operation. What happens?
      fr: |
        Fabrikam, Inc. stocke une clé d'API dans un secret nommé **PartnerKey** d'un coffre de clés nommé **kv-fab-int**. La version actuelle de PartnerKey est activée, et sa date d'expiration (`exp`) est passée depuis hier.

        Une application qui dispose des autorisations nécessaires demande la version actuelle de PartnerKey par une opération get. Que se passe-t-il ?
    body:
      options:
        - { id: a, text: { en: "The request fails with 403 Forbidden, because operations on a secret after its expiration date are refused.", fr: "La requête échoue avec 403 Forbidden, car les opérations sur un secret après sa date d'expiration sont refusées." } }
        - { id: b, text: { en: "The vault returns the most recent version of PartnerKey whose expiration date hasn't passed yet.", fr: "Le coffre renvoie la version la plus récente de PartnerKey dont la date d'expiration n'est pas encore passée." } }
        - { id: c, text: { en: "The vault returns the value of the version, because the expiration date of a secret is informational.", fr: "Le coffre renvoie la valeur de la version, car la date d'expiration d'un secret est informative." } }
        - { id: d, text: { en: "The request fails with 404 Not Found, because Key Vault moved the expired version to the deleted secrets.", fr: "La requête échoue avec 404 Not Found, car Key Vault a déplacé la version expirée dans les secrets supprimés." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          For secrets, `exp` and `nbf` are informational: a get operation still works on an expired or not-yet-valid secret, which helps recovery and testing. To stop a version from being retrieved, set its enabled attribute to false; an expiration date alone doesn't do it.
        fr: |
          Pour les secrets, `exp` et `nbf` sont informatifs : une opération get fonctionne encore sur un secret expiré ou pas encore valide, ce qui facilite la récupération et les tests. Pour empêcher la récupération d'une version, définissez son attribut enabled sur false ; une date d'expiration seule ne le fait pas.
      options:
        a: { en: "The get operation is the documented exception: it works outside the nbf / exp window.", fr: "L'opération get est l'exception documentée : elle fonctionne en dehors de la fenêtre nbf / exp." }
        b: { en: "A get without a version always targets the current version; Key Vault doesn't fall back to an older version.", fr: "Un get sans version cible toujours la version actuelle ; Key Vault ne se replie pas sur une version plus ancienne." }
        d: { en: "Expiration never deletes a secret: only a delete operation moves it to the soft-deleted state.", fr: "L'expiration ne supprime jamais un secret : seule une opération de suppression le fait passer à l'état supprimé de manière réversible." }
    references:
      - title: About Azure Key Vault secrets - Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/secrets/about-secrets

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-12-02
    objective: "1.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has a key vault named **kv-cts-build**. **Allow access from** is set to **Allow public access from specific virtual networks and IP addresses**, with only the office range listed, and **Allow trusted Microsoft services to bypass this firewall** is selected.

        An Azure Pipelines job that runs on a Microsoft-hosted agent fails with a firewall error when it reads a secret, although its service connection has the Key Vault Secrets User role on the vault.

        What explains the failure?
      fr: |
        Contoso, Ltd. dispose d'un coffre de clés nommé **kv-cts-build**. **Allow access from** est défini sur **Allow public access from specific virtual networks and IP addresses**, avec seulement la plage du bureau, et **Allow trusted Microsoft services to bypass this firewall** est sélectionné.

        Un job Azure Pipelines qui s'exécute sur un agent hébergé par Microsoft échoue avec une erreur de pare-feu quand il lit un secret, bien que sa connexion de service ait le rôle Key Vault Secrets User sur le coffre.

        Qu'est-ce qui explique cet échec ?
    body:
      options:
        - { id: a, text: { en: "The trusted services exception takes effect only when Allow access from is set to Disable public access.", fr: "L'exception des services approuvés ne prend effet que si Allow access from est défini sur Disable public access." } }
        - { id: b, text: { en: "Azure DevOps isn't a trusted Microsoft service, so its agents must connect from an allowed network.", fr: "Azure DevOps n'est pas un service Microsoft approuvé ; ses agents doivent donc se connecter depuis un réseau autorisé." } }
        - { id: c, text: { en: "The trusted services exception covers only services that run in the same subscription as the vault.", fr: "L'exception des services approuvés ne couvre que les services qui s'exécutent dans le même abonnement que le coffre." } }
        - { id: d, text: { en: "Key Vault Secrets User applies only to requests that come from the networks listed in the firewall.", fr: "Key Vault Secrets User ne s'applique qu'aux requêtes qui viennent des réseaux listés dans le pare-feu." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The exception admits only the services of the trusted services list, such as Azure Backup or Azure Resource Manager template deployment. Azure DevOps isn't on that list, so a Microsoft-hosted agent is treated like any other public client and its address isn't allowed. Run the job from an allowed network, for example a self-hosted agent in a listed subnet.
        fr: |
          L'exception n'admet que les services de la liste des services approuvés, comme Sauvegarde Azure ou le service de déploiement de modèles Azure Resource Manager. Azure DevOps n'en fait pas partie ; un agent hébergé par Microsoft est donc traité comme n'importe quel client public, et son adresse n'est pas autorisée. Exécutez le job depuis un réseau autorisé, par exemple un agent auto-hébergé dans un sous-réseau listé.
      options:
        a: { en: "The exception also works with the selected-networks setting; it doesn't depend on public access being disabled.", fr: "L'exception fonctionne aussi avec le paramètre des réseaux sélectionnés ; elle ne dépend pas de la désactivation de l'accès public." }
        c: { en: "Trusted services aren't limited to the vault's subscription; the deciding factor is whether the service is on the list.", fr: "Les services approuvés ne sont pas limités à l'abonnement du coffre ; ce qui compte est la présence du service dans la liste." }
        d: { en: "Role assignments authorize requests whatever their origin; the firewall is a separate check that rejects the request first.", fr: "Les attributions de rôles autorisent les requêtes quelle que soit leur origine ; le pare-feu est un contrôle distinct qui rejette d'abord la requête." }
    references:
      - title: Virtual network service endpoints for Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview-vnet-service-endpoints

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-12-03
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a subscription named **Sub-Apps**. Its key vaults use the Azure role-based access control (Azure RBAC) permission model, soft delete with a 90-day retention period, and purge protection.

        A user named **Ops2** must be able to recover key vaults of Sub-Apps that were deleted by mistake. Ops2 must not be able to read secrets, keys or certificates, and must not be able to grant access to other users. The solution must follow the principle of least privilege.

        Which role should you assign to Ops2 on Sub-Apps?
      fr: |
        Tailspin Toys dispose d'un abonnement nommé **Sub-Apps**. Ses coffres de clés utilisent le modèle d'autorisation Azure RBAC, la suppression réversible avec une période de rétention de 90 jours et la protection contre le vidage.

        Un utilisateur nommé **Ops2** doit pouvoir récupérer les coffres de clés de Sub-Apps supprimés par erreur. Ops2 ne doit pas pouvoir lire les secrets, les clés ni les certificats, ni accorder l'accès à d'autres utilisateurs. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer à Ops2 sur Sub-Apps ?
    body:
      options:
        - { id: a, text: Key Vault Purge Operator }
        - { id: b, text: Key Vault Administrator }
        - { id: c, text: Owner }
        - { id: d, text: Key Vault Contributor }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Recovering a soft-deleted vault is a control plane operation reserved for a user who can create key vaults in the resource group. Key Vault Contributor manages vaults (`Microsoft.KeyVault/*`) without any data action and without role assignment permissions, and its NotActions even exclude purging.
        fr: |
          Récupérer un coffre supprimé de manière réversible est une opération du plan de contrôle réservée à un utilisateur qui peut créer des coffres de clés dans le groupe de ressources. Key Vault Contributor gère les coffres (`Microsoft.KeyVault/*`) sans aucune action de données ni autorisation d'attribution de rôles, et ses NotActions excluent même le vidage.
      options:
        a: { en: "Key Vault Purge Operator permanently deletes soft-deleted vaults; it doesn't recover them, and purge protection blocks purging anyway.", fr: "Key Vault Purge Operator supprime définitivement les coffres supprimés de manière réversible ; il ne les récupère pas, et la protection contre le vidage bloque de toute façon le vidage." }
        b: { en: "Key Vault Administrator works on the data plane (all objects, including secret values) and can't manage vault resources.", fr: "Key Vault Administrator agit sur le plan de données (tous les objets, y compris les valeurs des secrets) et ne peut pas gérer les ressources de coffre." }
        c: { en: "Owner could recover vaults, but it can also assign roles, including data roles to itself.", fr: "Owner pourrait récupérer les coffres, mais il peut aussi attribuer des rôles, y compris des rôles de données à lui-même." }
    references:
      - title: Azure Key Vault soft-delete
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
      - title: Azure built-in roles for Security - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/security

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-12-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has two applications. **app-loans** keeps its secrets in a key vault named **kv-wg-loans**, and **app-risk** keeps its secrets in a key vault named **kv-wg-risk**. Both vaults use the Azure role-based access control (Azure RBAC) permission model.

        app-risk must read the value of one secret of kv-wg-loans, named **LoansApiKey**, by using its managed identity. It must not be able to read any other secret of kv-wg-loans.

        What should you do?
      fr: |
        Woodgrove Bank a deux applications. **app-loans** conserve ses secrets dans un coffre de clés nommé **kv-wg-loans**, et **app-risk** conserve les siens dans un coffre de clés nommé **kv-wg-risk**. Les deux coffres utilisent le modèle d'autorisation Azure RBAC.

        app-risk doit lire la valeur d'un secret de kv-wg-loans, nommé **LoansApiKey**, à l'aide de son identité managée. Elle ne doit pouvoir lire aucun autre secret de kv-wg-loans.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign Key Vault Secrets User to the identity of app-risk at the scope of kv-wg-loans.", fr: "Attribuer Key Vault Secrets User à l'identité d'app-risk à l'étendue de kv-wg-loans." } }
        - { id: b, text: { en: "Assign Key Vault Reader to the identity of app-risk at the scope of the LoansApiKey secret.", fr: "Attribuer Key Vault Reader à l'identité d'app-risk à l'étendue du secret LoansApiKey." } }
        - { id: c, text: { en: "Assign Key Vault Secrets User to the identity of app-risk at the scope of the LoansApiKey secret.", fr: "Attribuer Key Vault Secrets User à l'identité d'app-risk à l'étendue du secret LoansApiKey." } }
        - { id: d, text: { en: "Add an access policy with the Get secret permission for the identity of app-risk on kv-wg-loans.", fr: "Ajouter une stratégie d'accès avec l'autorisation Get sur les secrets pour l'identité d'app-risk sur kv-wg-loans." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Roles are normally assigned at the vault scope, but a secret shared between applications is one of the documented exceptions where an assignment on the individual secret fits. Key Vault Secrets User reads secret contents, and its scope limited to LoansApiKey keeps the other secrets out of reach.
        fr: |
          Les rôles s'attribuent normalement à l'étendue du coffre, mais un secret partagé entre applications est l'une des exceptions documentées où une attribution sur le secret lui-même convient. Key Vault Secrets User lit le contenu des secrets, et son étendue limitée à LoansApiKey laisse les autres secrets hors de portée.
      options:
        a: { en: "At the vault scope, the role also lets app-risk read every other secret of kv-wg-loans.", fr: "À l'étendue du coffre, le rôle permet aussi à app-risk de lire tous les autres secrets de kv-wg-loans." }
        b: { en: "Key Vault Reader reads metadata only, never secret values.", fr: "Key Vault Reader ne lit que les métadonnées, jamais les valeurs des secrets." }
        d: { en: "Access policies are ignored by a vault that uses Azure RBAC, and they apply to all secrets of the vault anyway.", fr: "Les stratégies d'accès sont ignorées par un coffre qui utilise Azure RBAC, et elles s'appliquent de toute façon à tous les secrets du coffre." }
    references:
      - title: Grant permission to applications to access an Azure key vault using Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-12-05
    objective: "1.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has enabled the Defender CSPM plan with agentless scanning for machines on a subscription named **Sub-Prod**.

        An external auditor must review the secrets findings of the virtual machines of Sub-Prod and the related recommendations in Microsoft Defender for Cloud. The auditor must not be able to change the security policy, dismiss recommendations or modify resources. The solution must follow the principle of least privilege.

        Which role should you assign to the auditor on Sub-Prod?
      fr: |
        Contoso, Ltd. a activé le plan Defender CSPM avec l'analyse sans agent des machines sur un abonnement nommé **Sub-Prod**.

        Un auditeur externe doit examiner les résultats de secrets des machines virtuelles de Sub-Prod et les recommandations associées dans Microsoft Defender for Cloud. L'auditeur ne doit pas pouvoir modifier la stratégie de sécurité, ignorer des recommandations ni modifier des ressources. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer à l'auditeur sur Sub-Prod ?
    body:
      options:
        - { id: a, text: Security Admin }
        - { id: b, text: Security Reader }
        - { id: c, text: Key Vault Reader }
        - { id: d, text: Contributor }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Security Reader is one of the roles that can use secrets scanning results, and it views Defender for Cloud recommendations, alerts and security states without making changes. Its permissions are read operations, mainly in the Microsoft.Security namespace, with no data action.
        fr: |
          Security Reader fait partie des rôles qui peuvent exploiter les résultats de l'analyse des secrets ; il consulte les recommandations, les alertes et les états de sécurité de Defender for Cloud sans rien modifier. Ses autorisations sont des opérations de lecture, principalement dans l'espace de noms Microsoft.Security, sans action de données.
      options:
        a: { en: "Security Admin can also update the security policy and dismiss alerts and recommendations, which the auditor must not do.", fr: "Security Admin peut aussi mettre à jour la stratégie de sécurité et ignorer des alertes et des recommandations, ce que l'auditeur ne doit pas faire." }
        c: { en: "Key Vault Reader reads key vault metadata; it doesn't give access to Defender for Cloud findings of virtual machines.", fr: "Key Vault Reader lit les métadonnées des coffres de clés ; il ne donne pas accès aux résultats Defender for Cloud des machines virtuelles." }
        d: { en: "Contributor shows the findings but can modify every resource of the subscription.", fr: "Contributor affiche les résultats, mais peut modifier toutes les ressources de l'abonnement." }
    references:
      - title: Protecting secrets in Microsoft Defender for Cloud - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning
      - title: Azure built-in roles for Security - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/security

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-12-06
    objective: "1.2.1"
    difficulty: 3
    status: draft
    shuffle: false
    type: dropdown
    stem:
      en: |
        Proseware, Inc. is deploying two applications, **Orders** and **Web**. Each application has a development environment and a production environment, in a single Azure region. You have the following requirements:

        - The production keys of Orders must be HSM-protected. Software-protected keys are acceptable for Orders in development.
        - Web stores only secrets and TLS certificates.
        - Each application team administers the network settings and the role assignments of its own vaults only, and the administrators of an environment must not be able to administer the vaults of the other environment.
        - Costs must be minimized.

        How should you complete the deployment plan? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. déploie deux applications, **Orders** et **Web**. Chaque application a un environnement de développement et un environnement de production, dans une seule région Azure. Vous avez les exigences suivantes :

        - Les clés de production d'Orders doivent être protégées par HSM. Des clés protégées par logiciel suffisent pour Orders en développement.
        - Web ne stocke que des secrets et des certificats TLS.
        - Chaque équipe d'application administre les paramètres réseau et les attributions de rôles de ses propres coffres uniquement, et les administrateurs d'un environnement ne doivent pas pouvoir administrer les coffres de l'autre environnement.
        - Les coûts doivent être réduits au minimum.

        Comment devez-vous compléter le plan de déploiement ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Number of resources to deploy (key vaults or managed HSMs): [[count]]
          Orders, production: [[ordersprod]]
          Orders, development: [[ordersdev]]
          Web, production: [[webprod]]
        fr: |
          Nombre de ressources à déployer (coffres de clés ou HSM managés) : [[count]]
          Orders, production : [[ordersprod]]
          Orders, développement : [[ordersdev]]
          Web, production : [[webprod]]
      slots:
        - id: count
          options:
            - { id: c1, text: "1" }
            - { id: c2, text: "2" }
            - { id: c4, text: "4" }
            - { id: c8, text: "8" }
        - id: ordersprod
          options:
            - { id: std, text: { en: "Key vault, Standard tier", fr: "Coffre de clés, niveau Standard" } }
            - { id: prem, text: { en: "Key vault, Premium tier", fr: "Coffre de clés, niveau Premium" } }
            - { id: mhsm, text: Managed HSM }
        - id: ordersdev
          options:
            - { id: std, text: { en: "Key vault, Standard tier", fr: "Coffre de clés, niveau Standard" } }
            - { id: prem, text: { en: "Key vault, Premium tier", fr: "Coffre de clés, niveau Premium" } }
            - { id: mhsm, text: Managed HSM }
        - id: webprod
          options:
            - { id: std, text: { en: "Key vault, Standard tier", fr: "Coffre de clés, niveau Standard" } }
            - { id: prem, text: { en: "Key vault, Premium tier", fr: "Coffre de clés, niveau Premium" } }
            - { id: mhsm, text: Managed HSM }
    answer:
      values: { count: c4, ordersprod: prem, ordersdev: std, webprod: std }
    explanation:
      correct:
        en: |
          Network settings and role management require vault-level permissions, so isolating two teams and two environments means one vault per application per environment: four vaults. HSM-protected keys (RSA-HSM, EC-HSM) need the Premium tier of a key vault, while Standard covers software-protected keys, secrets and certificates at a lower cost. Managed HSM is a separate, single-tenant HSM pool for keys only, more expensive and unable to store secrets or certificates.
        fr: |
          Les paramètres réseau et la gestion des rôles exigent des autorisations au niveau du coffre ; isoler deux équipes et deux environnements impose donc un coffre par application et par environnement : quatre coffres. Les clés protégées par HSM (RSA-HSM, EC-HSM) exigent le niveau Premium d'un coffre de clés, tandis que Standard couvre les clés protégées par logiciel, les secrets et les certificats à moindre coût. Managed HSM est un pool HSM distinct et à locataire unique réservé aux clés, plus coûteux et incapable de stocker des secrets ou des certificats.
      options:
        c2: { en: "Two vaults would make either the two applications or the two environments share a vault, and its administrators would administer both.", fr: "Deux coffres obligeraient les deux applications ou les deux environnements à partager un coffre, dont les administrateurs administreraient les deux." }
        c8: { en: "Eight vaults add no isolation that the requirements ask for and increase administration.", fr: "Huit coffres n'ajoutent aucune isolation exigée et augmentent l'administration." }
        mhsm: { en: "Managed HSM meets the HSM requirement but costs more than a Premium vault and stores keys only.", fr: "Managed HSM satisfait l'exigence HSM, mais coûte plus cher qu'un coffre Premium et ne stocke que des clés." }
    references:
      - title: About keys - Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/keys/about-keys
      - title: Grant permission to applications to access an Azure key vault using Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-12-07
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. has a key vault named **kv-lw-certs** that two teams share. The Web team stores TLS certificates issued by an internal certificate authority (CA), and the Partner team stores certificates issued by a public CA. Neither CA is integrated with Key Vault, and both teams must keep using their CA.

        Each team must receive the expiry email notifications of its own certificates, and never those of the other team. Each team already has the Key Vault Certificates Officer role on kv-lw-certs. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Litware, Inc. dispose d'un coffre de clés nommé **kv-lw-certs** que partagent deux équipes. L'équipe Web y stocke des certificats TLS émis par une autorité de certification (AC) interne, et l'équipe Partner des certificats émis par une AC publique. Aucune des deux AC n'est intégrée à Key Vault, et les deux équipes doivent continuer à utiliser leur AC.

        Chaque équipe doit recevoir les notifications d'expiration par e-mail de ses propres certificats, et jamais celles de l'autre équipe. Chaque équipe a déjà le rôle Key Vault Certificates Officer sur kv-lw-certs. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add both teams as certificate contacts of kv-lw-certs, and select EmailContacts in the policy of every certificate.", fr: "Ajouter les deux équipes comme contacts de certificat de kv-lw-certs, puis sélectionner EmailContacts dans la stratégie de chaque certificat." } }
        - { id: b, text: { en: "Move the certificates of one team to a second key vault, and set the certificate contacts of each vault to its team.", fr: "Déplacer les certificats d'une équipe vers un second coffre de clés, puis définir les contacts de certificat de chaque coffre sur son équipe." } }
        - { id: c, text: { en: "Change the role of each team to Key Vault Certificates Officer scoped to its certificates, so that emails go to the role holders.", fr: "Limiter le rôle Key Vault Certificates Officer de chaque équipe à l'étendue de ses certificats, pour que les e-mails aillent aux détenteurs du rôle." } }
        - { id: d, text: { en: "Select AutoRenew in the policy of every certificate, so that Key Vault renews them before expiry without sending emails.", fr: "Sélectionner AutoRenew dans la stratégie de chaque certificat, pour que Key Vault les renouvelle avant expiration sans envoyer d'e-mail." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Certificate contacts are defined at the vault level: every certificate of a vault shares them, and a lifetime event of any certificate notifies all of them. Separating the teams into two vaults, each with its own contacts and an EmailContacts lifetime action, is the only way to keep the notifications apart.
        fr: |
          Les contacts de certificat se définissent au niveau du coffre : tous les certificats d'un coffre les partagent, et un événement de durée de vie de n'importe quel certificat les notifie tous. Séparer les équipes dans deux coffres, chacun avec ses propres contacts et une action de durée de vie EmailContacts, est le seul moyen de séparer les notifications.
      options:
        a: { en: "Both teams would receive the notifications of every certificate of the vault, because contacts are shared by all its certificates.", fr: "Les deux équipes recevraient les notifications de tous les certificats du coffre, car les contacts sont partagés par tous ses certificats." }
        c: { en: "Notifications go to the certificate contacts of the vault, not to the holders of a role, whatever its scope.", fr: "Les notifications vont aux contacts de certificat du coffre, pas aux détenteurs d'un rôle, quelle que soit son étendue." }
        d: { en: "Automatic renewal works only with an integrated issuer (DigiCert, GlobalSign) or a self-signed certificate; non-integrated CAs need manual renewal.", fr: "Le renouvellement automatique ne fonctionne qu'avec un émetteur intégré (DigiCert, GlobalSign) ou un certificat auto-signé ; les AC non intégrées exigent un renouvellement manuel." }
    references:
      - title: About Azure Key Vault certificates
        url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-12-08
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum Corporation has a key vault named **kv-adt-pay**. Its **Allow access from** setting is **Disable public access**. An administrator created a private endpoint for kv-adt-pay in a subnet of a virtual network named **vnet-pay** and chose not to integrate it with a private DNS zone. vnet-pay uses the DNS servers provided by Azure.

        Applications on the virtual machines of vnet-pay can't reach kv-adt-pay. On these virtual machines, `nslookup kv-adt-pay.vault.azure.net` returns a public IP address.

        You need the applications to reach kv-adt-pay through the private endpoint. Public access must stay disabled.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation dispose d'un coffre de clés nommé **kv-adt-pay**. Son paramètre **Allow access from** est **Disable public access**. Un administrateur a créé un point de terminaison privé pour kv-adt-pay dans un sous-réseau d'un réseau virtuel nommé **vnet-pay**, sans l'intégrer à une zone DNS privée. vnet-pay utilise les serveurs DNS fournis par Azure.

        Les applications des machines virtuelles de vnet-pay ne peuvent pas joindre kv-adt-pay. Sur ces machines virtuelles, `nslookup kv-adt-pay.vault.azure.net` renvoie une adresse IP publique.

        Vous devez faire en sorte que les applications joignent kv-adt-pay par le point de terminaison privé. L'accès public doit rester désactivé.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a private DNS zone named privatelink.vaultcore.azure.net with an A record kv-adt-pay for the private endpoint IP.", fr: "Créer une zone DNS privée nommée privatelink.vaultcore.azure.net avec un enregistrement A kv-adt-pay pour l'IP du point de terminaison privé." } }
        - { id: b, text: { en: "Create a private DNS zone named privatelink.managedhsm.azure.net with an A record kv-adt-pay for the private endpoint IP.", fr: "Créer une zone DNS privée nommée privatelink.managedhsm.azure.net avec un enregistrement A kv-adt-pay pour l'IP du point de terminaison privé." } }
        - { id: c, text: { en: "Add a virtual network link between the private DNS zone and vnet-pay.", fr: "Ajouter une liaison de réseau virtuel entre la zone DNS privée et vnet-pay." } }
        - { id: d, text: { en: "Enable a service endpoint for Microsoft.KeyVault on the subnet of the virtual machines.", fr: "Activer un point de terminaison de service pour Microsoft.KeyVault sur le sous-réseau des machines virtuelles." } }
        - { id: e, text: { en: "Select Allow trusted Microsoft services to bypass this firewall on kv-adt-pay.", fr: "Sélectionner Allow trusted Microsoft services to bypass this firewall sur kv-adt-pay." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The public name `kv-adt-pay.vault.azure.net` is a CNAME to `kv-adt-pay.privatelink.vaultcore.azure.net`; without a private zone of that exact name, Azure DNS resolves it to the public ingress, which rejects the request because public access is disabled. The zone needs an A record with the simple vault name pointing to the private endpoint IP, and it must be linked to vnet-pay, otherwise queries from the virtual network still return the public address.
        fr: |
          Le nom public `kv-adt-pay.vault.azure.net` est un CNAME vers `kv-adt-pay.privatelink.vaultcore.azure.net` ; sans zone privée portant exactement ce nom, le DNS Azure le résout vers l'entrée publique, qui rejette la requête puisque l'accès public est désactivé. La zone a besoin d'un enregistrement A avec le nom simple du coffre pointant vers l'IP du point de terminaison privé, et elle doit être liée à vnet-pay, sinon les requêtes du réseau virtuel renvoient toujours l'adresse publique.
      options:
        b: { en: "privatelink.managedhsm.azure.net is the zone of Managed HSM private endpoints, not of key vaults.", fr: "privatelink.managedhsm.azure.net est la zone des points de terminaison privés de Managed HSM, pas des coffres de clés." }
        d: { en: "A service endpoint keeps traffic on the public endpoint of the vault, which public access disabled still rejects.", fr: "Un point de terminaison de service garde le trafic sur le point de terminaison public du coffre, que la désactivation de l'accès public rejette toujours." }
        e: { en: "The trusted services exception admits listed Azure services, not applications on virtual machines, and doesn't change name resolution.", fr: "L'exception des services approuvés admet des services Azure listés, pas des applications sur des machines virtuelles, et ne change pas la résolution de noms." }
    references:
      - title: Integrate Key Vault with Azure Private Link
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/private-link-service

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-12-09
    objective: "1.2.7"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Northwind Traders has a key vault named **kv-nw-hr** that allows public access from all networks. Microsoft Defender for Key Vault is enabled on the subscription.

        Defender for Key Vault raises an alert for kv-nw-hr: secrets were read by using the account of an HR administrator who holds the Key Vault Secrets Officer role, from a public IP address outside Azure.

        You need to respond to the alert by following Microsoft's recommended process. Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Northwind Traders dispose d'un coffre de clés nommé **kv-nw-hr** qui autorise l'accès public depuis tous les réseaux. Microsoft Defender for Key Vault est activé sur l'abonnement.

        Defender for Key Vault déclenche une alerte pour kv-nw-hr : des secrets ont été lus avec le compte d'un administrateur RH qui détient le rôle Key Vault Secrets Officer, depuis une adresse IP publique extérieure à Azure.

        Vous devez répondre à l'alerte en suivant le processus recommandé par Microsoft. Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 4
      actions:
        - { id: rotate, text: { en: "Rotate the secrets that were read, and disable or delete their compromised versions.", fr: "Faire tourner les secrets lus, puis désactiver ou supprimer leurs versions compromises." } }
        - { id: source, text: { en: "Check whether the traffic came from your tenant, and contact the HR administrator about the access.", fr: "Vérifier si le trafic provient de votre locataire, puis contacter l'administrateur RH au sujet de l'accès." } }
        - { id: dismiss, text: { en: "Dismiss the alert, because the account belongs to a known HR administrator.", fr: "Ignorer l'alerte, car le compte appartient à un administrateur RH connu." } }
        - { id: firewall, text: { en: "Enable the Key Vault firewall of kv-nw-hr, and allow only trusted networks.", fr: "Activer le pare-feu Key Vault de kv-nw-hr, puis n'autoriser que les réseaux approuvés." } }
        - { id: purge, text: { en: "Enable purge protection on kv-nw-hr.", fr: "Activer la protection contre le vidage sur kv-nw-hr." } }
        - { id: impact, text: { en: "Review the list of secrets accessed and their timestamps on the Security page of kv-nw-hr.", fr: "Examiner la liste des secrets consultés et leurs horodatages dans la page Security de kv-nw-hr." } }
    answer:
      sequence: [source, firewall, impact, rotate]
    explanation:
      correct:
        en: |
          Microsoft's process starts by identifying the source, without dismissing the alert because the user is known. For an unrecognized IP address, containment is the Key Vault firewall restricted to trusted networks. Then measure the impact from the accessed secrets and timestamps on the vault's Security page (and the diagnostic logs), and finally rotate the affected secrets and disable or delete the compromised versions.
        fr: |
          Le processus de Microsoft commence par l'identification de la source, sans ignorer l'alerte parce que l'utilisateur est connu. Pour une adresse IP non reconnue, le confinement passe par le pare-feu Key Vault limité aux réseaux approuvés. Mesurez ensuite l'impact à partir des secrets consultés et des horodatages de la page Security du coffre (et des journaux de diagnostic), puis faites tourner les secrets concernés et désactivez ou supprimez les versions compromises.
      options:
        dismiss: { en: "Microsoft explicitly warns not to dismiss an alert just because you recognize the user or the application.", fr: "Microsoft met explicitement en garde contre le fait d'ignorer une alerte simplement parce que vous reconnaissez l'utilisateur ou l'application." }
        purge: { en: "Purge protection guards against permanent deletion; it doesn't contain an access with stolen credentials.", fr: "La protection contre le vidage protège contre la suppression définitive ; elle ne contient pas un accès effectué avec des identifiants volés." }
    references:
      - title: Microsoft Defender for Key Vault - the benefits and features - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-key-vault-usage

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-12-10
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso, Ltd. has a key vault named **kv-cts-old** that uses the vault access policy permission model. Public access is allowed from all networks. The following table shows all the access policies and role assignments that concern kv-cts-old.

        | Principal | Configuration |
        | --- | --- |
        | App1 (managed identity) | Access policy: Get and List on secrets |
        | User1 | Azure role assignment: Key Vault Secrets Officer at the kv-cts-old scope |
        | User2 | Azure role assignment: Owner at the scope of the resource group that contains kv-cts-old |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. dispose d'un coffre de clés nommé **kv-cts-old** qui utilise le modèle d'autorisation de stratégie d'accès au coffre. L'accès public est autorisé depuis tous les réseaux. Le tableau suivant présente toutes les stratégies d'accès et attributions de rôles qui concernent kv-cts-old.

        | Principal | Configuration |
        | --- | --- |
        | App1 (identité managée) | Stratégie d'accès : Get et List sur les secrets |
        | User1 | Attribution de rôle Azure : Key Vault Secrets Officer à l'étendue de kv-cts-old |
        | User2 | Attribution de rôle Azure : Owner à l'étendue du groupe de ressources qui contient kv-cts-old |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "User1 can create a new secret in kv-cts-old.", fr: "User1 peut créer un nouveau secret dans kv-cts-old." }
        - id: s2
          text: { en: "User2 can switch kv-cts-old to the Azure role-based access control permission model.", fr: "User2 peut faire passer kv-cts-old au modèle d'autorisation Azure RBAC." }
        - id: s3
          text: { en: "After kv-cts-old is switched to the Azure role-based access control permission model, User1 can create a new secret in it.", fr: "Une fois kv-cts-old passé au modèle d'autorisation Azure RBAC, User1 peut y créer un nouveau secret." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Key Vault data roles such as Key Vault Secrets Officer only work for vaults that use the Azure RBAC permission model, so User1 has no data plane access while the vault uses access policies. Switching the model requires role assignment write permission, which Owner has at the resource group scope. Once the vault uses Azure RBAC, User1's existing assignment takes effect, while App1's access policy becomes invalid and App1 loses access.
        fr: |
          Les rôles de données Key Vault comme Key Vault Secrets Officer ne fonctionnent que pour les coffres qui utilisent le modèle d'autorisation Azure RBAC ; User1 n'a donc aucun accès au plan de données tant que le coffre utilise des stratégies d'accès. Changer de modèle exige l'autorisation d'écriture des attributions de rôles, qu'Owner détient à l'étendue du groupe de ressources. Une fois le coffre sous Azure RBAC, l'attribution existante de User1 prend effet, tandis que la stratégie d'accès d'App1 devient non valide et qu'App1 perd son accès.
      options:
        s1: { en: "With access policies, only the access policies of the vault authorize the data plane; User1 has none.", fr: "Avec les stratégies d'accès, seules les stratégies d'accès du coffre autorisent le plan de données ; User1 n'en a aucune." }
    references:
      - title: Grant permission to applications to access an Azure key vault using Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
      - title: Azure built-in roles for Security - Azure RBAC
        url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/security
