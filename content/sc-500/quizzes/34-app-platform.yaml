chapter: 34-app-platform
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-34-01
    objective: "3.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer at Litware signs in to an Azure container registry named **acrlit** with the Azure CLI by using her Microsoft Entra account at 9:00. She then pushes images with `docker push` all morning. At 12:30, `docker push` fails with an authentication error. Her role assignments haven't changed.

        What should she do?
      fr: |
        Une développeuse de Litware se connecte à un registre de conteneurs Azure nommé **acrlit** avec Azure CLI en utilisant son compte Microsoft Entra à 9 h 00. Elle envoie ensuite des images avec `docker push` toute la matinée. À 12 h 30, `docker push` échoue avec une erreur d'authentification. Ses attributions de rôles n'ont pas changé.

        Que doit-elle faire ?
    body:
      options:
        - { id: a, text: { en: "Ask an administrator to enable the admin user of acrlit and use its password.", fr: "Demander à un administrateur d'activer l'utilisateur administrateur d'acrlit et utiliser son mot de passe." } }
        - { id: b, text: { en: "Ask an administrator to create a token with a scope map for her repositories.", fr: "Demander à un administrateur de créer un jeton avec un mappage d'étendue pour ses référentiels." } }
        - { id: c, text: { en: "Sign in to the registry again with `az acr login`, and then retry the push.", fr: "Se reconnecter au registre avec `az acr login`, puis relancer l'envoi." } }
        - { id: d, text: { en: "Ask an administrator to assign her the AcrPush role a second time.", fr: "Demander à un administrateur de lui attribuer une seconde fois le rôle AcrPush." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The token that `az acr login` obtains for an individual Microsoft Entra identity is valid for 3 hours. After it expires, the developer signs in again; her role assignments still authorize the push.
        fr: |
          Le jeton que `az acr login` obtient pour une identité Microsoft Entra individuelle est valable 3 heures. Après son expiration, la développeuse se connecte de nouveau ; ses attributions de rôles autorisent toujours l'envoi.
      options:
        a: { en: "The admin user is meant for single-user tests, has full rights and no RBAC; it isn't needed to renew an expired token.", fr: "L'utilisateur administrateur est destiné aux tests par un seul utilisateur, a tous les droits et pas de RBAC ; il n'est pas nécessaire pour renouveler un jeton expiré." }
        b: { en: "Tokens with scope maps are for systems that can't use Microsoft Entra ID; the developer's Entra identity already has access.", fr: "Les jetons avec mappages d'étendue servent aux systèmes qui ne peuvent pas utiliser Microsoft Entra ID ; l'identité Entra de la développeuse a déjà accès." }
        d: { en: "Her role assignment still exists; the failure comes from the expired sign-in token, not from missing permissions.", fr: "Son attribution de rôle existe toujours ; l'échec vient du jeton de connexion expiré, pas d'une autorisation manquante." }
    references:
      - title: Azure Container Registry Authentication Options Explained - Azure Container Registry
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-authentication

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-34-02
    objective: "3.3.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam runs several container apps in an Azure Container Apps environment named **env-claims**. The apps call each other by app name. A compliance rule requires that the traffic between the apps inside the environment be TLS-encrypted, with certificates managed by the platform.

        What should you enable?
      fr: |
        Fabrikam exécute plusieurs applications conteneur dans un environnement Azure Container Apps nommé **env-claims**. Les applications s'appellent entre elles par leur nom. Une règle de conformité exige que le trafic entre les applications à l'intérieur de l'environnement soit chiffré par TLS, avec des certificats gérés par la plateforme.

        Que devez-vous activer ?
    body:
      options:
        - { id: a, text: { en: "Internal ingress on each container app", fr: "L'entrée (ingress) interne sur chaque application conteneur" } }
        - { id: b, text: { en: "Peer-to-peer encryption on env-claims", fr: "Le chiffrement de pair à pair sur env-claims" } }
        - { id: c, text: { en: "Client certificate mode Require on each container app", fr: "Le mode de certificat client Require sur chaque application conteneur" } }
        - { id: d, text: { en: "Built-in authentication on each container app", fr: "L'authentification intégrée sur chaque application conteneur" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Peer-to-peer encryption is an environment setting (`--enable-peer-to-peer-encryption`). It encrypts the network traffic within the environment, including direct app-to-app calls, with private certificates that Azure Container Apps manages automatically.
        fr: |
          Le chiffrement de pair à pair est un paramètre de l'environnement (`--enable-peer-to-peer-encryption`). Il chiffre le trafic réseau à l'intérieur de l'environnement, y compris les appels directs entre applications, avec des certificats privés qu'Azure Container Apps gère automatiquement.
      options:
        a: { en: "Internal ingress limits who can reach an app; it doesn't encrypt the traffic between apps.", fr: "L'entrée interne limite qui peut joindre une application ; elle ne chiffre pas le trafic entre les applications." }
        c: { en: "Client certificate mode makes callers present a certificate (mTLS from clients); you would have to manage the certificates, and it doesn't cover traffic inside the environment.", fr: "Le mode de certificat client oblige les appelants à présenter un certificat (mTLS depuis les clients) ; vous devriez gérer les certificats, et il ne couvre pas le trafic à l'intérieur de l'environnement." }
        d: { en: "Built-in authentication signs users in; it doesn't encrypt network traffic.", fr: "L'authentification intégrée connecte les utilisateurs ; elle ne chiffre pas le trafic réseau." }
    references:
      - title: Configure ingress in an Azure Container Apps environment
        url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-environment-configuration

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-34-03
    objective: "3.3.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin publishes a web app through an Azure Front Door Standard profile named **fd-tailspin**. A WAF policy in Prevention mode, with custom geo-filtering rules, is associated with the domain of the app.

        The security team now requires protection by the Microsoft Default Rule Set and blocking of known bad bots. The app must stay available, and the solution must minimize administrative effort. What should you do?
      fr: |
        Tailspin publie une application web via un profil Azure Front Door Standard nommé **fd-tailspin**. Une stratégie WAF en mode Prévention, avec des règles personnalisées de filtrage géographique, est associée au domaine de l'application.

        L'équipe de sécurité exige désormais une protection par le Default Rule Set de Microsoft et le blocage des bots malveillants connus. L'application doit rester disponible, et la solution doit réduire au minimum l'effort administratif. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the Default Rule Set and the Bot Manager rule set to the existing WAF policy of fd-tailspin.", fr: "Ajouter le Default Rule Set et l'ensemble de règles Bot Manager à la stratégie WAF existante de fd-tailspin." } }
        - { id: b, text: { en: "Add custom rules that match SQL injection and bot user agents to the existing WAF policy.", fr: "Ajouter à la stratégie WAF existante des règles personnalisées qui détectent l'injection SQL et les agents utilisateurs de bots." } }
        - { id: c, text: { en: "Upgrade fd-tailspin to the Premium tier, and then enable the managed rule sets on its premium WAF policy.", fr: "Mettre à niveau fd-tailspin vers le niveau Premium, puis activer les ensembles de règles managés sur sa stratégie WAF premium." } }
        - { id: d, text: { en: "Deploy an Application Gateway WAF_v2 with the managed rule sets between fd-tailspin and the app.", fr: "Déployer une passerelle Application Gateway WAF_v2 avec les ensembles de règles managés entre fd-tailspin et l'application." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          On Azure Front Door Standard, the WAF supports custom rules only; managed rule sets such as the Default Rule Set and Bot Manager require Premium. A Standard profile can be upgraded to Premium without downtime: the upgrade creates a premium copy of the WAF policy, on which you then enable the managed rules.
        fr: |
          Sur Azure Front Door Standard, le WAF ne prend en charge que les règles personnalisées ; les ensembles de règles managés comme le Default Rule Set et Bot Manager exigent Premium. Un profil Standard peut être mis à niveau vers Premium sans interruption : la mise à niveau crée une copie premium de la stratégie WAF, sur laquelle vous activez ensuite les règles managées.
      options:
        a: { en: "A WAF policy of a Standard profile can't use managed rule sets: they need the Premium tier.", fr: "Une stratégie WAF d'un profil Standard ne peut pas utiliser d'ensembles de règles managés : ils exigent le niveau Premium." }
        b: { en: "Hand-written custom rules aren't the Microsoft Default Rule Set, and maintaining them is far more effort.", fr: "Des règles personnalisées écrites à la main ne sont pas le Default Rule Set de Microsoft, et leur maintenance demande bien plus d'effort." }
        d: { en: "A second WAF tier adds a gateway to deploy and operate, which doesn't minimize administrative effort.", fr: "Un second niveau de WAF ajoute une passerelle à déployer et à exploiter, ce qui ne réduit pas l'effort administratif au minimum." }
    references:
      - title: What Is Azure Web Application Firewall on Azure Front Door?
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
      - title: Upgrade from Azure Front Door Standard to Premium
        url: https://learn.microsoft.com/en-us/azure/frontdoor/tier-upgrade

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-34-04
    objective: "3.3.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has an App Service app named **api-loans** that exposes a REST API to partner daemons. Built-in authentication with the Microsoft Entra provider is enabled with **Require authentication**. Unauthenticated calls currently receive an HTTP 302 redirect to the sign-in page, which the partner clients can't follow.

        You need unauthenticated calls to be rejected with the status code that tells API clients they must authenticate. The application code must not change. What should you do?
      fr: |
        Woodgrove dispose d'une application App Service nommée **api-loans** qui expose une API REST à des démons de partenaires. L'authentification intégrée avec le fournisseur Microsoft Entra est activée avec **Exiger l'authentification**. Les appels non authentifiés reçoivent actuellement une redirection HTTP 302 vers la page de connexion, que les clients des partenaires ne peuvent pas suivre.

        Vous devez faire en sorte que les appels non authentifiés soient rejetés avec le code d'état qui indique aux clients d'API qu'ils doivent s'authentifier. Le code de l'application ne doit pas changer. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the action for unauthenticated requests to HTTP 401 Unauthorized.", fr: "Définir l'action pour les requêtes non authentifiées sur HTTP 401 Unauthorized." } }
        - { id: b, text: { en: "Set the action for unauthenticated requests to HTTP 403 Forbidden.", fr: "Définir l'action pour les requêtes non authentifiées sur HTTP 403 Forbidden." } }
        - { id: c, text: { en: "Set the restricted access option to Allow unauthenticated requests.", fr: "Définir l'option d'accès restreint sur Autoriser les requêtes non authentifiées." } }
        - { id: d, text: { en: "Set the client certificate mode of api-loans to Required.", fr: "Définir le mode de certificat client d'api-loans sur Obligatoire." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With Require authentication, App Service rejects unauthenticated traffic before it reaches the code. HTTP 302 redirects are recommended for websites; HTTP 401 Unauthorized is the response recommended for APIs, and you can configure it for all requests.
        fr: |
          Avec Exiger l'authentification, App Service rejette le trafic non authentifié avant qu'il n'atteigne le code. Les redirections HTTP 302 sont recommandées pour les sites web ; HTTP 401 Unauthorized est la réponse recommandée pour les API, et vous pouvez la configurer pour toutes les requêtes.
      options:
        b: { en: "403 Forbidden means the caller isn't allowed, not that it must authenticate; 401 is the response recommended for APIs.", fr: "403 Forbidden signifie que l'appelant n'est pas autorisé, et non qu'il doit s'authentifier ; 401 est la réponse recommandée pour les API." }
        c: { en: "Allowing unauthenticated requests defers authorization to the application code, which would have to change.", fr: "Autoriser les requêtes non authentifiées délègue l'autorisation au code de l'application, qui devrait alors changer." }
        d: { en: "Client certificates add mutual TLS; they don't change how Microsoft Entra authentication responds to anonymous calls.", fr: "Les certificats clients ajoutent le TLS mutuel ; ils ne changent pas la réponse de l'authentification Microsoft Entra aux appels anonymes." }
    references:
      - title: Authentication and authorization in Azure App Service and Azure Functions
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-authentication-authorization

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-34-05
    objective: "3.3.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has an AKS cluster named **aks-retail** that uses Microsoft Entra ID authentication with Azure RBAC for Kubernetes authorization. The cluster contains the namespaces **orders** and **billing**. The following role assignments exist.

        | Group | Role | Scope |
        | --- | --- | --- |
        | G-Audit | Azure Kubernetes Service RBAC Reader | Namespace orders |
        | G-Leads | Azure Kubernetes Service RBAC Admin | Namespace orders |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un cluster AKS nommé **aks-retail** qui utilise l'authentification Microsoft Entra ID avec Azure RBAC pour l'autorisation Kubernetes. Le cluster contient les espaces de noms **orders** et **billing**. Les attributions de rôles suivantes existent.

        | Groupe | Rôle | Étendue |
        | --- | --- | --- |
        | G-Audit | Azure Kubernetes Service RBAC Reader | Espace de noms orders |
        | G-Leads | Azure Kubernetes Service RBAC Admin | Espace de noms orders |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Members of G-Audit can read the Kubernetes Secrets of the orders namespace.", fr: "Les membres de G-Audit peuvent lire les Secrets Kubernetes de l'espace de noms orders." }
        - id: s2
          text: { en: "Members of G-Leads can create role bindings in the orders namespace.", fr: "Les membres de G-Leads peuvent créer des liaisons de rôles dans l'espace de noms orders." }
        - id: s3
          text: { en: "Members of G-Leads can modify the resource quota of the orders namespace.", fr: "Les membres de G-Leads peuvent modifier le quota de ressources de l'espace de noms orders." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Azure Kubernetes Service RBAC Reader reads most objects of the namespace but not Secrets, because reading them would expose service account credentials. RBAC Admin is the namespace administrator role: it includes creating roles and role bindings in the namespace, but not write access to the resource quota or to the namespace itself.
        fr: |
          Azure Kubernetes Service RBAC Reader lit la plupart des objets de l'espace de noms, mais pas les Secrets, car les lire exposerait les informations d'identification des comptes de service. RBAC Admin est le rôle d'administrateur de l'espace de noms : il permet de créer des rôles et des liaisons de rôles dans l'espace de noms, mais pas d'écrire le quota de ressources ni l'espace de noms lui-même.
      options:
        s1: { en: "Reading Secrets requires at least Azure Kubernetes Service RBAC Writer on the namespace.", fr: "La lecture des Secrets exige au moins Azure Kubernetes Service RBAC Writer sur l'espace de noms." }
        s3: { en: "RBAC Admin doesn't allow write access to the resource quota or to the namespace; that needs RBAC Cluster Admin.", fr: "RBAC Admin ne donne pas d'accès en écriture au quota de ressources ni à l'espace de noms ; cela exige RBAC Cluster Admin." }
    references:
      - title: Use Microsoft Entra ID authorization for the Kubernetes API in Azure Kubernetes Service (AKS)
        url: https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-34-06
    objective: "3.3.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has a function app named **func-ops** in an Elastic Premium plan. It contains 12 HTTP-triggered functions written by three development teams, and it has a system-assigned managed identity.

        A new function named **RotateKeys**, written by the security team, needs an API secret that grants administrative access to a payment provider. The secret is stored in a key vault named **kv-ops**. The security team requires that the code of no other function can obtain the secret. The solution must minimize changes to the other functions.

        What should you do?
      fr: |
        Adatum dispose d'une application de fonction nommée **func-ops** dans un plan Elastic Premium. Elle contient 12 fonctions à déclencheur HTTP écrites par trois équipes de développement, et elle a une identité managée affectée par le système.

        Une nouvelle fonction nommée **RotateKeys**, écrite par l'équipe de sécurité, a besoin d'un secret d'API qui donne un accès administratif à un prestataire de paiement. Le secret est stocké dans un coffre de clés nommé **kv-ops**. L'équipe de sécurité exige que le code d'aucune autre fonction ne puisse obtenir le secret. La solution doit réduire au minimum les modifications des autres fonctions.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a Key Vault reference to the secret in the app settings of func-ops, and grant the app's identity access to that secret only.", fr: "Ajouter une référence Key Vault au secret dans les paramètres d'application de func-ops, et donner à l'identité de l'application l'accès à ce secret uniquement." } }
        - { id: b, text: { en: "Add a user-assigned managed identity to func-ops with access to the secret, and use it only in the code of RotateKeys.", fr: "Ajouter à func-ops une identité managée affectée par l'utilisateur ayant accès au secret, et ne l'utiliser que dans le code de RotateKeys." } }
        - { id: c, text: { en: "Deploy RotateKeys to a separate function app whose managed identity is the only one granted access to the secret.", fr: "Déployer RotateKeys dans une application de fonction distincte dont l'identité managée est la seule à avoir accès au secret." } }
        - { id: d, text: { en: "Set the authorization level of RotateKeys to admin, so that only callers that hold the master key can run it.", fr: "Définir le niveau d'autorisation de RotateKeys sur admin, afin que seuls les appelants qui détiennent la clé principale puissent l'exécuter." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          All the functions of a function app share its app settings and its managed identities, so they all get the same permissions on the resources those credentials reach. To limit a credential to one function, move that function to its own function app with its own identity; the other functions stay untouched.
        fr: |
          Toutes les fonctions d'une application de fonction partagent ses paramètres d'application et ses identités managées ; elles obtiennent donc toutes les mêmes autorisations sur les ressources que ces informations d'identification atteignent. Pour limiter une information d'identification à une fonction, déplacez cette fonction dans sa propre application de fonction avec sa propre identité ; les autres fonctions restent inchangées.
      options:
        a: { en: "The resolved Key Vault reference is an app setting, readable by every function of func-ops, and the identity is shared too.", fr: "La référence Key Vault résolue est un paramètre d'application, lisible par toutes les fonctions de func-ops, et l'identité est elle aussi partagée." }
        b: { en: "An identity assigned to the function app can be used by the code of any of its functions; using it only in RotateKeys is a convention, not a control.", fr: "Une identité attribuée à l'application de fonction peut être utilisée par le code de n'importe laquelle de ses fonctions ; ne l'utiliser que dans RotateKeys est une convention, pas un contrôle." }
        d: { en: "The authorization level controls who can call RotateKeys over HTTP; it doesn't stop the code of the other functions from reading settings or using the identity.", fr: "Le niveau d'autorisation contrôle qui peut appeler RotateKeys en HTTP ; il n'empêche pas le code des autres fonctions de lire les paramètres ou d'utiliser l'identité." }
    references:
      - title: Securing Azure Functions
        url: https://learn.microsoft.com/en-us/azure/azure-functions/security-concepts

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-34-07
    objective: "3.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a Consumption logic app named **la-intake** whose workflow starts with a Request trigger. SAS authentication of the trigger is left at its default setting. The following settings are configured:

        - An authorization policy of type **AAD** with the **Issuer** of the Contoso tenant and the **Audience** `api://intake`.
        - **Allowed inbound IP addresses** for the trigger: **Specific IP ranges**, set to 203.0.113.0/24.
        - Allowed IP ranges for run history inputs and outputs: `0.0.0.0-0.0.0.0`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une application logique Consommation nommée **la-intake** dont le workflow commence par un déclencheur Request. L'authentification SAS du déclencheur est laissée à son paramètre par défaut. Les paramètres suivants sont configurés :

        - Une stratégie d'autorisation de type **AAD** avec l'**Issuer** du locataire Contoso et l'**Audience** `api://intake`.
        - **Adresses IP entrantes autorisées** pour le déclencheur : **Plages d'adresses IP spécifiques**, définies sur 203.0.113.0/24.
        - Plages d'adresses IP autorisées pour les entrées et sorties de l'historique des exécutions : `0.0.0.0-0.0.0.0`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "An application at 203.0.113.40 that calls the trigger's callback URL with its SAS, without any token, can start la-intake.", fr: "Une application à l'adresse 203.0.113.40 qui appelle l'URL de rappel du déclencheur avec sa SAS, sans aucun jeton, peut démarrer la-intake." }
        - id: s2
          text: { en: "An application at 198.51.100.7 that sends a valid Contoso token for `api://intake`, without SAS, can start la-intake.", fr: "Une application à l'adresse 198.51.100.7 qui envoie un jeton Contoso valide pour `api://intake`, sans SAS, peut démarrer la-intake." }
        - id: s3
          text: { en: "A user who has the Logic App Contributor role on la-intake can view the trigger outputs of past runs from a computer in 203.0.113.0/24.", fr: "Un utilisateur qui dispose du rôle Logic App Contributor sur la-intake peut consulter les sorties du déclencheur des exécutions passées depuis un ordinateur de 203.0.113.0/24." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Enabling OAuth with Microsoft Entra ID doesn't disable SAS: until you disable SAS authentication, a valid callback URL still starts the workflow. The inbound IP restriction applies to every caller of the trigger, whatever the authentication scheme. The run history range `0.0.0.0-0.0.0.0` blocks everyone from viewing inputs and outputs, whatever their role, until an administrator removes the restriction.
        fr: |
          Activer OAuth avec Microsoft Entra ID ne désactive pas la SAS : tant que vous ne désactivez pas l'authentification SAS, une URL de rappel valide démarre toujours le workflow. La restriction d'adresses IP entrantes s'applique à tout appelant du déclencheur, quel que soit le schéma d'authentification. La plage `0.0.0.0-0.0.0.0` de l'historique des exécutions empêche tout le monde de consulter les entrées et sorties, quel que soit son rôle, jusqu'à ce qu'un administrateur supprime la restriction.
      options:
        s2: { en: "A valid token doesn't bypass the inbound IP restriction: 198.51.100.7 isn't in the allowed range.", fr: "Un jeton valide ne contourne pas la restriction d'adresses IP entrantes : 198.51.100.7 n'est pas dans la plage autorisée." }
        s3: { en: "The run history range is independent of the trigger range, and `0.0.0.0-0.0.0.0` blocks access to inputs and outputs from every address.", fr: "La plage de l'historique des exécutions est indépendante de celle du déclencheur, et `0.0.0.0-0.0.0.0` bloque l'accès aux entrées et sorties depuis toutes les adresses." }
    references:
      - title: Secure access and data for workflows in Azure Logic Apps
        url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-securing-a-logic-app

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-34-08
    objective: "3.3.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind exposes a public API named **Catalog** through an Azure API Management instance named **apim-nw** in the **Consumption** tier. Catalog doesn't require a subscription, and the callers can't be changed to send subscription keys. A back end behind Catalog is overloaded by a few clients that send bursts of requests.

        You need to ensure that each caller IP address is limited to 100 calls per 60 seconds and that excess calls receive HTTP 429. Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind expose une API publique nommée **Catalog** via une instance Azure API Management nommée **apim-nw** au niveau **Consommation**. Catalog n'exige pas d'abonnement, et les appelants ne peuvent pas être modifiés pour envoyer des clés d'abonnement. Un back-end derrière Catalog est surchargé par quelques clients qui envoient des rafales de requêtes.

        Vous devez faire en sorte que chaque adresse IP d'appelant soit limitée à 100 appels par période de 60 secondes et que les appels en excès reçoivent HTTP 429. Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Publish Catalog through an API Management instance in the Standard v2 tier.", fr: "Publier Catalog via une instance API Management au niveau Standard v2." } }
        - { id: b, text: { en: "Add `<rate-limit calls=\"100\" renewal-period=\"60\" />` to the inbound section of Catalog.", fr: "Ajouter `<rate-limit calls=\"100\" renewal-period=\"60\" />` à la section inbound de Catalog." } }
        - { id: c, text: { en: "Add an `ip-filter` policy with `action=\"forbid\"` and the address ranges of the clients that send bursts.", fr: "Ajouter une stratégie `ip-filter` avec `action=\"forbid\"` et les plages d'adresses des clients qui envoient des rafales." } }
        - { id: d, text: { en: "Add `<rate-limit-by-key calls=\"100\" renewal-period=\"60\" counter-key=\"@(context.Request.IpAddress)\" />` to the inbound section.", fr: "Ajouter `<rate-limit-by-key calls=\"100\" renewal-period=\"60\" counter-key=\"@(context.Request.IpAddress)\" />` à la section inbound." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Throttling per IP address needs `rate-limit-by-key` with the caller IP as counter key; it returns 429 when the limit is exceeded. This policy isn't available in the Consumption tier (it applies to the Developer, Basic, Standard, Premium and v2 tiers), so Catalog must be served by an instance in a supported tier such as Standard v2.
        fr: |
          Limiter le débit par adresse IP exige `rate-limit-by-key` avec l'IP de l'appelant comme clé de compteur ; elle renvoie 429 quand la limite est dépassée. Cette stratégie n'est pas disponible au niveau Consommation (elle s'applique aux niveaux Developer, Basic, Standard, Premium et v2) : Catalog doit donc être servie par une instance d'un niveau pris en charge, comme Standard v2.
      options:
        b: { en: "`rate-limit` counts calls per subscription and applies only to calls made with a subscription key; Catalog's callers send none.", fr: "`rate-limit` compte les appels par abonnement et ne s'applique qu'aux appels effectués avec une clé d'abonnement ; les appelants de Catalog n'en envoient pas." }
        c: { en: "`ip-filter` blocks the listed addresses entirely instead of limiting each address to 100 calls per minute, and it returns 403, not 429.", fr: "`ip-filter` bloque entièrement les adresses listées au lieu de limiter chaque adresse à 100 appels par minute, et renvoie 403, pas 429." }
    references:
      - title: Azure API Management policy reference - rate-limit-by-key
        url: https://learn.microsoft.com/en-us/azure/api-management/rate-limit-by-key-policy
      - title: Azure API Management policy reference - rate-limit
        url: https://learn.microsoft.com/en-us/azure/api-management/rate-limit-policy

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-34-09
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware has an Azure subscription that contains an AKS cluster named **aks-shop** and an Azure container registry named **acrshop**. The Defender for Containers plan is enabled on the subscription, and no plan component is turned on yet. The security team lists the following requirements.

        Which configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un abonnement Azure qui contient un cluster AKS nommé **aks-shop** et un registre de conteneurs Azure nommé **acrshop**. Le plan Defender for Containers est activé sur l'abonnement, et aucun composant du plan n'est encore activé. L'équipe de sécurité liste les exigences suivantes.

        Quelle configuration devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: sensor, text: { en: "Turn on the Defender sensor", fr: "Activer le capteur Defender" } }
        - { id: policy, text: { en: "Turn on Azure Policy, and set the related recommendation to Deny", fr: "Activer Azure Policy, puis définir la recommandation correspondante sur Deny" } }
        - { id: api, text: { en: "Turn on Kubernetes API access", fr: "Activer l'accès à l'API Kubernetes" } }
        - { id: registry, text: { en: "Turn on Registry access", fr: "Activer l'accès au registre" } }
        - { id: nodes, text: { en: "Turn on Agentless scanning for machines", fr: "Activer l'analyse sans agent des machines" } }
        - { id: gating, text: { en: "Add a gated deployment rule with the Deny action", fr: "Ajouter une règle de déploiement contrôlé avec l'action Deny" } }
      targets:
        - { id: t1, text: { en: "Block the creation of new pods that run privileged containers in aks-shop.", fr: "Bloquer la création de nouveaux pods qui exécutent des conteneurs privilégiés dans aks-shop." } }
        - { id: t2, text: { en: "Raise an alert when a process that isn't part of the original image starts in a running container.", fr: "Déclencher une alerte quand un processus qui ne fait pas partie de l'image d'origine démarre dans un conteneur en cours d'exécution." } }
        - { id: t3, text: { en: "Report vulnerabilities in the operating system of the cluster nodes.", fr: "Signaler les vulnérabilités du système d'exploitation des nœuds du cluster." } }
        - { id: t4, text: { en: "Inventory the cluster's configuration and deployments with zero footprint in the cluster.", fr: "Inventorier la configuration et les déploiements du cluster sans aucune empreinte dans le cluster." } }
    answer:
      mapping: { t1: policy, t2: sensor, t3: nodes, t4: api }
    explanation:
      correct:
        en: |
          Data plane hardening is evaluated by Azure Policy for Kubernetes, in audit mode by default; setting a recommendation such as "Privileged containers should be avoided" to Deny blocks non-compliant requests at the API server. Runtime detection, such as binary drift, needs the Defender sensor on the nodes. Node vulnerabilities come from agentless scanning for machines, and Kubernetes API access gives agentless, API-based discovery of the cluster.
        fr: |
          Le renforcement du plan de données est évalué par Azure Policy pour Kubernetes, en mode audit par défaut ; définir une recommandation comme « Privileged containers should be avoided » sur Deny bloque les requêtes non conformes au niveau du serveur d'API. La détection à l'exécution, comme la dérive binaire, exige le capteur Defender sur les nœuds. Les vulnérabilités des nœuds proviennent de l'analyse sans agent des machines, et l'accès à l'API Kubernetes fournit une découverte du cluster sans agent, fondée sur l'API.
      options:
        gating: { en: "Gated deployment audits or blocks images according to their vulnerability findings; it doesn't evaluate whether a pod is privileged.", fr: "Le déploiement contrôlé audite ou bloque des images selon leurs résultats de vulnérabilité ; il n'évalue pas si un pod est privilégié." }
        registry: { en: "Registry access scans the images stored in acrshop, not the nodes' operating system or running processes.", fr: "L'accès au registre analyse les images stockées dans acrshop, pas le système d'exploitation des nœuds ni les processus en cours d'exécution." }
    references:
      - title: Introduction to Microsoft Defender for Containers
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
      - title: Configure Kubernetes data plane hardening in Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/kubernetes-workload-protections

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-34-10
    objective: "3.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has a Premium tier Azure container registry named **acrcore**. Last week, its **Role assignment permissions mode** was switched from RBAC Registry Permissions to **RBAC Registry + ABAC Repository Permissions**. Since then, every client has signed in again. The registry has the following role assignments.

        | Principal | Role | Condition |
        | --- | --- | --- |
        | sp-build (service principal) | AcrPush, assigned before the switch | None |
        | G-Platform (group) | Contributor | None |
        | mi-web (managed identity) | Container Registry Repository Reader | Repository name starts with `web/` |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un registre de conteneurs Azure de niveau Premium nommé **acrcore**. La semaine dernière, son **Role assignment permissions mode** est passé de RBAC Registry Permissions à **RBAC Registry + ABAC Repository Permissions**. Depuis, tous les clients se sont reconnectés. Le registre a les attributions de rôles suivantes.

        | Principal | Rôle | Condition |
        | --- | --- | --- |
        | sp-build (principal de service) | AcrPush, attribué avant le changement | Aucune |
        | G-Platform (groupe) | Contributor | Aucune |
        | mi-web (identité managée) | Container Registry Repository Reader | Le nom du référentiel commence par `web/` |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "sp-build can push images to acrcore.", fr: "sp-build peut envoyer des images vers acrcore." }
        - id: s2
          text: { en: "Members of G-Platform can disable public network access on acrcore.", fr: "Les membres de G-Platform peuvent désactiver l'accès réseau public d'acrcore." }
        - id: s3
          text: { en: "mi-web can pull the image `web/frontend:1.4` from acrcore.", fr: "mi-web peut tirer l'image `web/frontend:1.4` depuis acrcore." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          In an ABAC-enabled registry, the legacy AcrPull, AcrPush and AcrDelete roles aren't honored: pushing needs Container Registry Repository Writer. Owner, Contributor and Reader keep only their control plane permissions, so G-Platform can still change registry settings such as network access, but can't pull or push. Container Registry Repository Reader with a repository-name condition grants pull on the matching repositories, such as `web/frontend`.
        fr: |
          Dans un registre où ABAC est activé, les anciens rôles AcrPull, AcrPush et AcrDelete ne sont pas pris en compte : l'envoi exige Container Registry Repository Writer. Owner, Contributor et Reader ne conservent que leurs autorisations du plan de contrôle : G-Platform peut toujours modifier les paramètres du registre, comme l'accès réseau, mais ne peut ni tirer ni envoyer d'images. Container Registry Repository Reader avec une condition sur le nom du référentiel accorde le pull sur les référentiels correspondants, comme `web/frontend`.
      options:
        s1: { en: "AcrPush isn't honored in the ABAC-enabled mode; assign Container Registry Repository Writer to sp-build.", fr: "AcrPush n'est pas pris en compte dans le mode où ABAC est activé ; attribuez Container Registry Repository Writer à sp-build." }
    references:
      - title: Azure attribute-based access control (Azure ABAC) repository permissions in Azure Container Registry - Azure Container Registry
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-rbac-abac-repository-permissions
