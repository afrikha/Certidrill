chapter: 41-defender-cloud-posture
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure subscription named **Sub1** in which Microsoft Defender for Cloud runs with foundational CSPM only. No paid plan is enabled.

        Which capability requires the Defender CSPM plan on Sub1?
      fr: |
        Contoso dispose d'un abonnement Azure nommé **Sub1** dans lequel Microsoft Defender for Cloud fonctionne avec foundational CSPM uniquement. Aucun plan payant n'est activé.

        Quelle fonctionnalité exige le plan Defender CSPM sur Sub1 ?
    body:
      options:
        - { id: a, text: { en: "Continuous export of recommendations to a Log Analytics workspace", fr: "L'exportation continue des recommandations vers un espace de travail Log Analytics" } }
        - { id: b, text: { en: "Workflow automation that runs a logic app on a new recommendation", fr: "L'automatisation des workflows qui exécute une application logique sur une nouvelle recommandation" } }
        - { id: c, text: { en: "Risk prioritization of recommendations based on exploitability and impact", fr: "La hiérarchisation des risques des recommandations selon l'exploitabilité et l'impact" } }
        - { id: d, text: { en: "Asset inventory of the resources assessed against the Microsoft cloud security benchmark", fr: "L'inventaire des ressources évaluées par rapport au Microsoft cloud security benchmark" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Risk prioritization, which gives each recommendation a risk level computed from exploitability and business impact, is a Defender CSPM capability built on the cloud security graph. Foundational CSPM is free and covers the asset inventory, the recommendations of the Microsoft cloud security benchmark, remediation tools, data export and workflow automation.
        fr: |
          La hiérarchisation des risques, qui attribue à chaque recommandation un niveau de risque calculé à partir de l'exploitabilité et de l'impact métier, est une fonctionnalité de Defender CSPM qui s'appuie sur le graphe de sécurité cloud. Foundational CSPM est gratuit et couvre l'inventaire des ressources, les recommandations du Microsoft cloud security benchmark, les outils de correction, l'exportation des données et l'automatisation des workflows.
      options:
        a: { en: "Continuous export (data exporting) is part of foundational CSPM: no paid plan is needed.", fr: "L'exportation continue (exportation des données) fait partie de foundational CSPM : aucun plan payant n'est nécessaire." }
        b: { en: "Workflow automation is available with foundational CSPM.", fr: "L'automatisation des workflows est disponible avec foundational CSPM." }
        d: { en: "The asset inventory and the Microsoft cloud security benchmark are included in foundational CSPM.", fr: "L'inventaire des ressources et le Microsoft cloud security benchmark sont inclus dans foundational CSPM." }
    references:
      - title: What is Cloud Security Posture Management (CSPM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-41-02
    objective: "4.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to use Microsoft Defender External Attack Surface Management (Defender EASM). An engineer named **User1** must create a Defender EASM resource in a resource group named **RG-EASM**, then add discovery seeds and change the state of the discovered assets.

        You need to assign a role to User1 on RG-EASM. The solution must follow the principle of least privilege.

        Which role should you assign?
      fr: |
        Fabrikam prévoit d'utiliser Microsoft Defender External Attack Surface Management (Defender EASM). Un ingénieur nommé **User1** doit créer une ressource Defender EASM dans un groupe de ressources nommé **RG-EASM**, puis ajouter des valeurs de départ de découverte et modifier l'état des ressources découvertes.

        Vous devez attribuer un rôle à User1 sur RG-EASM. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer ?
    body:
      options:
        - { id: a, text: Reader }
        - { id: b, text: Security Admin }
        - { id: c, text: Owner }
        - { id: d, text: Contributor }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Creating a Defender EASM resource requires the Contributor role, and Contributor on the resource lets User1 edit it: add seeds, run discoveries and change asset states. Contributor is the least privileged built-in role that does all of this.
        fr: |
          La création d'une ressource Defender EASM exige le rôle Contributor, et Contributor sur la ressource permet à User1 de la modifier : ajouter des valeurs de départ, lancer des découvertes et modifier l'état des ressources. Contributor est le rôle intégré le moins privilégié qui permet tout cela.
      options:
        a: { en: "Reader only views the EASM resource and its inventory; it can't create the resource or change asset states.", fr: "Reader ne fait que consulter la ressource EASM et son inventaire ; il ne peut ni créer la ressource ni modifier l'état des ressources." }
        b: { en: "Security Admin manages Defender for Cloud settings, policies and alerts; it doesn't grant the right to create other resource types such as a Defender EASM resource.", fr: "Security Admin gère les paramètres, les stratégies et les alertes de Defender for Cloud ; il ne donne pas le droit de créer d'autres types de ressources comme une ressource Defender EASM." }
        c: { en: "Owner works, but it also lets User1 assign roles: it's broader than needed.", fr: "Owner fonctionne, mais il permet aussi à User1 d'attribuer des rôles : il est plus large que nécessaire." }
    references:
      - title: Create a Defender EASM Azure Resource
        url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/deploying-the-defender-easm-azure-resource

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-41-03
    objective: "4.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a storage account named **stupload01** where partners upload files. Defender for Storage is enabled on stupload01 with on-upload malware scanning.

        An Azure Functions app named **func-route** must move each blob to a processing storage account a few seconds after the scan reports that no threat was found. Blobs that aren't reported as clean must stay in stupload01.

        What should you configure?
      fr: |
        Adatum dispose d'un compte de stockage nommé **stupload01** où des partenaires chargent des fichiers. Defender for Storage est activé sur stupload01 avec l'analyse des logiciels malveillants au chargement.

        Une application Azure Functions nommée **func-route** doit déplacer chaque objet blob vers un compte de stockage de traitement quelques secondes après que l'analyse a signalé qu'aucune menace n'a été trouvée. Les objets blob qui ne sont pas signalés comme sains doivent rester dans stupload01.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A workflow automation that runs a logic app on the alert for a malicious file uploaded to a storage account", fr: "Une automatisation des workflows qui exécute une application logique sur l'alerte de fichier malveillant chargé dans un compte de stockage" } }
        - { id: b, text: { en: "An Event Grid custom topic for the scan results in the Defender for Cloud settings of stupload01, with func-route as subscriber", fr: "Une rubrique personnalisée Event Grid pour les résultats d'analyse dans les paramètres Defender for Cloud de stupload01, avec func-route comme abonné" } }
        - { id: c, text: { en: "A continuous export of the security alerts of the subscription to an event hub that func-route reads", fr: "Une exportation continue des alertes de sécurité de l'abonnement vers un hub d'événements que func-route lit" } }
        - { id: d, text: { en: "Sensitive data threat detection on stupload01, with func-route triggered by the classification of each blob", fr: "La détection des menaces sur les données sensibles sur stupload01, avec func-route déclenchée par la classification de chaque objet blob" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Malware scanning can send every scan result, including "No threats found", to an Event Grid custom topic set in the Defender for Cloud settings of the storage account. A function subscribed to the topic reacts within seconds and can move only the blobs whose result is clean.
        fr: |
          L'analyse des logiciels malveillants peut envoyer chaque résultat d'analyse, y compris « No threats found », vers une rubrique personnalisée Event Grid définie dans les paramètres Defender for Cloud du compte de stockage. Une fonction abonnée à la rubrique réagit en quelques secondes et peut déplacer uniquement les objets blob dont le résultat est sain.
      options:
        a: { en: "A security alert is raised only for malicious blobs, and logic apps respond more slowly: clean blobs never trigger this automation.", fr: "Une alerte de sécurité n'est déclenchée que pour les objets blob malveillants, et les applications logiques réagissent plus lentement : les objets blob sains ne déclenchent jamais cette automatisation." }
        c: { en: "Security alerts don't exist for clean blobs, so an export of alerts can't tell func-route which blobs to move.", fr: "Aucune alerte de sécurité n'existe pour les objets blob sains ; une exportation des alertes ne peut donc pas indiquer à func-route quels objets blob déplacer." }
        d: { en: "Sensitive data threat detection prioritizes alerts on accounts that hold sensitive data; it doesn't report malware scan results.", fr: "La détection des menaces sur les données sensibles hiérarchise les alertes sur les comptes qui contiennent des données sensibles ; elle ne signale pas les résultats de l'analyse des logiciels malveillants." }
    references:
      - title: Set up automated remediation for malware detection
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-configure-malware-scan

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-41-04
    objective: "4.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure subscription named **Sub-Prod** where Defender for Servers Plan 2 uses Microsoft Defender Vulnerability Management. A vulnerability recommendation reports a high-severity CVE on eight virtual machines that run a legacy application. The vendor will ship a fix next quarter.

        The CISO formally accepts the risk until March 31. No compensating control is in place. You must record this decision in Defender for Cloud so that it ends automatically on March 31.

        What should you do?
      fr: |
        Litware dispose d'un abonnement Azure nommé **Sub-Prod** où Defender for Servers Plan 2 utilise Microsoft Defender Vulnerability Management. Une recommandation de vulnérabilités signale une CVE de gravité élevée sur huit machines virtuelles qui exécutent une application héritée. L'éditeur livrera un correctif au prochain trimestre.

        Le RSSI accepte formellement le risque jusqu'au 31 mars. Aucun contrôle compensatoire n'est en place. Vous devez enregistrer cette décision dans Defender for Cloud de sorte qu'elle prenne fin automatiquement le 31 mars.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Exempt the eight VMs from the recommendation with the Mitigated category, and set March 31 as the review date in the description.", fr: "Exempter les huit machines virtuelles de la recommandation avec la catégorie Mitigated, et indiquer le 31 mars comme date de revue dans la description." } }
        - { id: b, text: { en: "Create a governance rule that assigns the recommendation to the application owner, with March 31 as the due date.", fr: "Créer une règle de gouvernance qui attribue la recommandation au propriétaire de l'application, avec le 31 mars comme date d'échéance." } }
        - { id: c, text: { en: "Exempt the eight VMs from the recommendation with the Waiver category, and set March 31 as the expiration date.", fr: "Exempter les huit machines virtuelles de la recommandation avec la catégorie Waiver, et définir le 31 mars comme date d'expiration." } }
        - { id: d, text: { en: "Delete the mdetvm vulnerability assessment resource of the eight VMs, and redeploy it on March 31.", fr: "Supprimer la ressource d'évaluation des vulnérabilités mdetvm des huit machines virtuelles, puis la redéployer le 31 mars." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A recommendation exemption is the way to accept a risk in Defender for Cloud. The Waiver category records a risk that you accept without mitigating it, and the expiration date ends the exemption automatically, so the VMs are assessed normally again after March 31.
        fr: |
          Une exemption de recommandation est le moyen d'accepter un risque dans Defender for Cloud. La catégorie Waiver enregistre un risque accepté sans atténuation, et la date d'expiration met fin automatiquement à l'exemption ; les machines virtuelles sont donc de nouveau évaluées normalement après le 31 mars.
      options:
        a: { en: "Mitigated means the issue is resolved by another means, which isn't the case here; and a date written in the description doesn't end the exemption.", fr: "Mitigated signifie que le problème est résolu par un autre moyen, ce qui n'est pas le cas ici ; et une date écrite dans la description ne met pas fin à l'exemption." }
        b: { en: "A governance rule assigns an owner and a due date to drive the fix; it doesn't record a risk acceptance.", fr: "Une règle de gouvernance attribue un propriétaire et une date d'échéance pour piloter la correction ; elle n'enregistre pas d'acceptation du risque." }
        d: { en: "Deleting mdetvm stops all vulnerability scanning of the VMs, not only this CVE, and nothing restores it automatically.", fr: "Supprimer mdetvm arrête toute l'analyse des vulnérabilités des machines virtuelles, pas seulement cette CVE, et rien ne la rétablit automatiquement." }
    references:
      - title: Exempt resources from recommendations
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/exempt-resource

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-41-05
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank assesses an Azure subscription named **Sub-Pay** against PCI DSS in Microsoft Defender for Cloud. All the automated assessments of the standard now pass. A manager wants to send the **Regulatory compliance** dashboard to an external auditor as proof that Woodgrove is PCI DSS certified.

        What should you tell the manager?
      fr: |
        Woodgrove Bank évalue un abonnement Azure nommé **Sub-Pay** par rapport à PCI DSS dans Microsoft Defender for Cloud. Toutes les évaluations automatisées de la norme réussissent désormais. Un responsable veut envoyer le tableau de bord **Conformité réglementaire** à un auditeur externe comme preuve que Woodgrove est certifiée PCI DSS.

        Que devez-vous répondre au responsable ?
    body:
      options:
        - { id: a, text: { en: "The Audit reports tab provides a PCI DSS certificate for Woodgrove, generated from the passing assessments of Sub-Pay.", fr: "L'onglet Rapports d'audit fournit un certificat PCI DSS pour Woodgrove, généré à partir des évaluations réussies de Sub-Pay." } }
        - { id: b, text: { en: "The dashboard isn't a certification: controls with manual assessments must be attested, and the auditor still assesses the controls.", fr: "Le tableau de bord n'est pas une certification : les contrôles à évaluation manuelle doivent être attestés, et l'auditeur évalue toujours les contrôles." } }
        - { id: c, text: { en: "The Download report option produces a signed PCI DSS certificate once every automated assessment of Sub-Pay passes.", fr: "L'option Télécharger le rapport produit un certificat PCI DSS signé dès que toutes les évaluations automatisées de Sub-Pay réussissent." } }
        - { id: d, text: { en: "Sub-Pay is certified, because every PCI DSS control is mapped to an automated assessment of the Microsoft cloud security benchmark.", fr: "Sub-Pay est certifié, car chaque contrôle PCI DSS est associé à une évaluation automatisée du Microsoft cloud security benchmark." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The dashboard shows the status of the assessments that Defender for Cloud runs; it isn't a certification. Controls with manual assessments stay unassessed until someone attests them with evidence, some controls have no automated assessment at all, and certification remains the auditor's decision.
        fr: |
          Le tableau de bord affiche l'état des évaluations exécutées par Defender for Cloud ; ce n'est pas une certification. Les contrôles à évaluation manuelle restent non évalués tant que personne ne les atteste avec des preuves, certains contrôles n'ont aucune évaluation automatisée, et la certification reste la décision de l'auditeur.
      options:
        a: { en: "Audit reports are Microsoft's own certification reports for Azure and Dynamics, not a certificate for the customer.", fr: "Les rapports d'audit sont les propres rapports de certification de Microsoft pour Azure et Dynamics, pas un certificat pour le client." }
        c: { en: "Download report produces a summary of the standard by control for stakeholders and auditors, not a certificate.", fr: "Télécharger le rapport produit une synthèse de la norme par contrôle pour les parties prenantes et les auditeurs, pas un certificat." }
        d: { en: "Some PCI DSS controls are procedural and have no automated assessment, and passing assessments never amounts to certification.", fr: "Certains contrôles PCI DSS sont procéduraux et n'ont aucune évaluation automatisée, et des évaluations réussies ne valent jamais certification." }
    references:
      - title: Improve regulatory compliance
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-41-06
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has two Azure subscriptions in Microsoft Defender for Cloud:

        | Subscription | Created | Defender plans |
        | --- | --- | --- |
        | Sub-Legacy | 2022 | Defender for Servers Plan 2, Defender for DNS |
        | Sub-Retail | 2026 | Defender for Servers Plan 1 |

        The virtual machines of Sub-Retail use the Azure default DNS resolvers. The security team must receive alerts when these virtual machines communicate with domains used for phishing or crypto mining, or exfiltrate data through DNS tunneling, as the machines of Sub-Legacy already do. The configuration of Sub-Legacy must not change.

        What should you do on Sub-Retail?
      fr: |
        Tailspin Toys dispose de deux abonnements Azure dans Microsoft Defender for Cloud :

        | Abonnement | Création | Plans Defender |
        | --- | --- | --- |
        | Sub-Legacy | 2022 | Defender for Servers Plan 2, Defender for DNS |
        | Sub-Retail | 2026 | Defender for Servers Plan 1 |

        Les machines virtuelles de Sub-Retail utilisent les résolveurs DNS par défaut d'Azure. L'équipe de sécurité doit recevoir des alertes quand ces machines virtuelles communiquent avec des domaines utilisés pour l'hameçonnage ou le minage de cryptomonnaie, ou exfiltrent des données par tunnel DNS, comme c'est déjà le cas pour les machines de Sub-Legacy. La configuration de Sub-Legacy ne doit pas changer.

        Que devez-vous faire sur Sub-Retail ?
    body:
      options:
        - { id: a, text: { en: "Enable the Defender for DNS plan in the Defender plans of Sub-Retail.", fr: "Activer le plan Defender for DNS dans les plans Defender de Sub-Retail." } }
        - { id: b, text: { en: "Enable the Defender for Resource Manager plan in the Defender plans of Sub-Retail.", fr: "Activer le plan Defender for Resource Manager dans les plans Defender de Sub-Retail." } }
        - { id: c, text: { en: "Turn on agentless scanning for machines in the Defender CSPM plan of Sub-Retail.", fr: "Activer l'analyse sans agent des machines dans le plan Defender CSPM de Sub-Retail." } }
        - { id: d, text: { en: "Change the Defender for Servers plan of Sub-Retail from Plan 1 to Plan 2.", fr: "Faire passer le plan Defender for Servers de Sub-Retail du Plan 1 au Plan 2." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Only customers that already had Defender for DNS keep it as a standalone plan, as Sub-Legacy does. For new subscriptions, alerts about suspicious DNS activity are part of Defender for Servers Plan 2, and Plan 1 doesn't include them, so Sub-Retail must move to Plan 2.
        fr: |
          Seuls les clients qui disposaient déjà de Defender for DNS le conservent comme plan autonome, comme Sub-Legacy. Pour les nouveaux abonnements, les alertes sur les activités DNS suspectes font partie de Defender for Servers Plan 2, et le Plan 1 ne les inclut pas ; Sub-Retail doit donc passer au Plan 2.
      options:
        a: { en: "The standalone Defender for DNS plan is kept only by existing customers; for a new subscription, DNS alerts come with Defender for Servers Plan 2.", fr: "Le plan autonome Defender for DNS n'est conservé que par les clients existants ; pour un nouvel abonnement, les alertes DNS viennent avec Defender for Servers Plan 2." }
        b: { en: "Defender for Resource Manager detects suspicious management operations, not DNS queries made by the virtual machines.", fr: "Defender for Resource Manager détecte les opérations de gestion suspectes, pas les requêtes DNS des machines virtuelles." }
        c: { en: "Agentless scanning finds vulnerabilities and secrets on the disks; it doesn't analyze DNS traffic, and Defender CSPM provides no threat alerts.", fr: "L'analyse sans agent trouve les vulnérabilités et les secrets sur les disques ; elle n'analyse pas le trafic DNS, et Defender CSPM ne fournit aucune alerte de menace." }
    references:
      - title: Overview of Microsoft Defender for DNS
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-dns-introduction
      - title: Overview of Defender for Servers in Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-41-07
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind Traders has an Azure subscription named **Sub-Core** and an AWS account connected to Microsoft Defender for Cloud. The Defender CSPM plan is enabled on both, and all the components of the plan are currently set to **Off**. Sub-Core contains AKS clusters, an Azure Container Registry and storage accounts.

        The security team has four requirements. You need to turn on only the components that are needed.

        Which Defender CSPM component should you turn on for each requirement? To answer, drag the appropriate components to the correct requirements. Each component may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un abonnement Azure nommé **Sub-Core** et d'un compte AWS connectés à Microsoft Defender for Cloud. Le plan Defender CSPM est activé sur les deux, et tous les composants du plan sont actuellement sur **Off**. Sub-Core contient des clusters AKS, un Azure Container Registry et des comptes de stockage.

        L'équipe de sécurité a quatre exigences. Vous devez activer uniquement les composants nécessaires.

        Quel composant de Defender CSPM devez-vous activer pour chaque exigence ? Pour répondre, faites glisser les composants appropriés vers les exigences correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: vms, text: { en: "Agentless scanning for machines", fr: "Analyse sans agent des machines" } }
        - { id: data, text: { en: "Sensitive data discovery", fr: "Découverte des données sensibles" } }
        - { id: ciem, text: { en: "Permissions management (CIEM)", fr: "Gestion des autorisations (CIEM)" } }
        - { id: k8s, text: { en: "Agentless discovery for Kubernetes", fr: "Découverte sans agent pour Kubernetes" } }
        - { id: cva, text: { en: "Container vulnerability assessment", fr: "Évaluation des vulnérabilités des conteneurs" } }
        - { id: mde, text: { en: "Defender for Endpoint integration", fr: "Intégration de Defender for Endpoint" } }
      targets:
        - id: t1
          text: { en: "A cloud security explorer query must return the storage accounts that contain credit card numbers.", fr: "Une requête de l'explorateur de sécurité cloud doit retourner les comptes de stockage qui contiennent des numéros de carte bancaire." }
        - id: t2
          text: { en: "Recommendations must flag overprovisioned identities and their access risks in Azure and AWS.", fr: "Des recommandations doivent signaler les identités surapprovisionnées et leurs risques d'accès dans Azure et AWS." }
        - id: t3
          text: { en: "Attack path analysis must include the workloads and the network exposure of the AKS clusters.", fr: "L'analyse des chemins d'attaque doit inclure les charges de travail et l'exposition réseau des clusters AKS." }
        - id: t4
          text: { en: "The images stored in the container registry must be assessed for vulnerabilities.", fr: "Les images stockées dans le registre de conteneurs doivent être évaluées pour les vulnérabilités." }
    answer:
      mapping: { t1: data, t2: ciem, t3: k8s, t4: cva }
    explanation:
      correct:
        en: |
          Sensitive data discovery samples managed data resources and adds data sensitivity to the cloud security graph, which explorer queries use. Permissions management (CIEM) analyzes identities and access rights and produces the identity recommendations. Agentless discovery for Kubernetes discovers the cluster architecture, workloads and exposure through the API, which attack path analysis needs. Container vulnerability assessment scans the images of the registries.
        fr: |
          La découverte des données sensibles échantillonne les ressources de données managées et ajoute la sensibilité des données au graphe de sécurité cloud, qu'utilisent les requêtes de l'explorateur. La gestion des autorisations (CIEM) analyse les identités et les droits d'accès et produit les recommandations sur les identités. La découverte sans agent pour Kubernetes découvre l'architecture, les charges de travail et l'exposition des clusters par l'API, ce dont l'analyse des chemins d'attaque a besoin. L'évaluation des vulnérabilités des conteneurs analyse les images des registres.
      options:
        vms: { en: "Agentless scanning for machines takes disk snapshots of VMs to find vulnerabilities and secrets; none of the four requirements concerns VM disks.", fr: "L'analyse sans agent des machines prend des instantanés des disques des machines virtuelles pour trouver vulnérabilités et secrets ; aucune des quatre exigences ne concerne les disques des machines virtuelles." }
        mde: { en: "The Defender for Endpoint integration is a setting of Defender for Servers, not a component of Defender CSPM.", fr: "L'intégration de Defender for Endpoint est un paramètre de Defender for Servers, pas un composant de Defender CSPM." }
    references:
      - title: Protect your resources with Defender CSPM
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-cspm-plan
      - title: Enable cloud infrastructure entitlement management (CIEM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-permissions-management

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-41-08
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware has two Azure subscriptions in Microsoft Defender for Cloud:

        | Subscription | Defender for Cloud plans | Standards on the Regulatory compliance dashboard |
        | --- | --- | --- |
        | Sub-A | Defender CSPM | Microsoft cloud security benchmark, PCI DSS |
        | Sub-B | Foundational CSPM only | Microsoft cloud security benchmark |

        The compliance team works in Microsoft Purview Compliance Manager. It sees the resource-level PCI DSS compliance data of Sub-A, but nothing for Sub-B.

        You need the resource-level PCI DSS compliance data of Sub-B to appear in Compliance Manager. The solution must minimize administrative effort.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose de deux abonnements Azure dans Microsoft Defender for Cloud :

        | Abonnement | Plans Defender for Cloud | Normes du tableau de bord Conformité réglementaire |
        | --- | --- | --- |
        | Sub-A | Defender CSPM | Microsoft cloud security benchmark, PCI DSS |
        | Sub-B | Foundational CSPM uniquement | Microsoft cloud security benchmark |

        L'équipe de conformité travaille dans Microsoft Purview Compliance Manager. Elle voit les données de conformité PCI DSS au niveau des ressources de Sub-A, mais rien pour Sub-B.

        Vous devez faire apparaître dans Compliance Manager les données de conformité PCI DSS au niveau des ressources de Sub-B. La solution doit réduire au minimum l'effort administratif.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Configure a continuous export of the regulatory compliance data of Sub-B to a Log Analytics workspace.", fr: "Configurer une exportation continue des données de conformité réglementaire de Sub-B vers un espace de travail Log Analytics." } }
        - { id: b, text: { en: "Enable the Defender CSPM plan on Sub-B in the Defender plans of the subscription.", fr: "Activer le plan Defender CSPM sur Sub-B dans les plans Defender de l'abonnement." } }
        - { id: c, text: { en: "Download the PCI DSS report of Sub-A and upload it to Compliance Manager as evidence for Sub-B.", fr: "Télécharger le rapport PCI DSS de Sub-A et le charger dans Compliance Manager comme preuve pour Sub-B." } }
        - { id: d, text: { en: "Set the PCI DSS standard to On in the Security policies of Sub-B, from Manage compliance policies.", fr: "Passer la norme PCI DSS sur On dans les Stratégies de sécurité de Sub-B, depuis Manage compliance policies." } }
        - { id: e, text: { en: "Create a workflow automation on Sub-B that runs when a regulatory compliance assessment changes state.", fr: "Créer une automatisation des workflows sur Sub-B qui s'exécute quand une évaluation de conformité réglementaire change d'état." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Standards other than the Microsoft cloud security benchmark require a paid plan, so Sub-B first needs a plan such as Defender CSPM. You then add PCI DSS to Sub-B in its security policies. Once a standard is on the Regulatory compliance dashboard, its resource-level compliance data appears automatically in Purview Compliance Manager, as it already does for Sub-A.
        fr: |
          Les normes autres que le Microsoft cloud security benchmark exigent un plan payant ; Sub-B a donc d'abord besoin d'un plan comme Defender CSPM. Vous ajoutez ensuite PCI DSS à Sub-B dans ses stratégies de sécurité. Dès qu'une norme figure dans le tableau de bord Conformité réglementaire, ses données de conformité au niveau des ressources apparaissent automatiquement dans Purview Compliance Manager, comme c'est déjà le cas pour Sub-A.
      options:
        a: { en: "Continuous export sends compliance data to Event Hubs or Log Analytics; it doesn't feed Compliance Manager, and Sub-B has no PCI DSS data to export yet.", fr: "L'exportation continue envoie les données de conformité vers Event Hubs ou Log Analytics ; elle n'alimente pas Compliance Manager, et Sub-B n'a encore aucune donnée PCI DSS à exporter." }
        c: { en: "The report of Sub-A describes the resources of Sub-A only; it gives no resource-level data for Sub-B.", fr: "Le rapport de Sub-A décrit uniquement les ressources de Sub-A ; il ne donne aucune donnée au niveau des ressources pour Sub-B." }
        e: { en: "Workflow automation runs a logic app on state changes of existing assessments; Sub-B has no PCI DSS assessment to trigger it.", fr: "L'automatisation des workflows exécute une application logique quand des évaluations existantes changent d'état ; Sub-B n'a aucune évaluation PCI DSS pour la déclencher." }
    references:
      - title: Improve regulatory compliance
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
      - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-41-09
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware connected an AWS account named **aws-fin** to Microsoft Defender for Cloud last year, by using a single account connector with the Defender CSPM plan and AWS CloudFormation. The connector is in an Azure subscription named **Sub-MC**.

        An engineer named **User1** has the Contributor role on Sub-MC and no other role or permission. User1 must turn on Permissions management (CIEM) for aws-fin so that recommendations about the identities of aws-fin appear. The solution must follow the principle of least privilege.

        How should you complete the procedure? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware a connecté l'an dernier un compte AWS nommé **aws-fin** à Microsoft Defender for Cloud, à l'aide d'un connecteur de compte unique avec le plan Defender CSPM et AWS CloudFormation. Le connecteur se trouve dans un abonnement Azure nommé **Sub-MC**.

        Un ingénieur nommé **User1** a le rôle Contributor sur Sub-MC et aucun autre rôle ni autorisation. User1 doit activer la gestion des autorisations (CIEM) pour aws-fin afin que des recommandations sur les identités d'aws-fin apparaissent. La solution doit respecter le principe du moindre privilège.

        Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          1. Assign User1 the [[role]] role on Sub-MC.
          2. Grant User1 the [[perm]] permission for the tenant.
          3. User1 turns on Permissions management (CIEM) in the Defender CSPM settings of the aws-fin connector, then [[aws]].
        fr: |
          1. Attribuer à User1 le rôle [[role]] sur Sub-MC.
          2. Accorder à User1 l'autorisation [[perm]] pour le locataire.
          3. User1 active la gestion des autorisations (CIEM) dans les paramètres Defender CSPM du connecteur aws-fin, puis [[aws]].
      slots:
        - id: role
          options:
            - { id: secadmin, text: Security Admin }
            - { id: owner, text: Owner }
            - { id: secreader, text: Security Reader }
            - { id: uaa, text: User Access Administrator }
        - id: perm
          options:
            - { id: dirread, text: Directory.Read.All }
            - { id: appwrite, text: Application.ReadWrite.All }
            - { id: polread, text: Policy.Read.All }
            - { id: userread, text: User.Read.All }
        - id: aws
          options:
            - { id: key, text: { en: "creates an IAM user access key in aws-fin and adds it to the connector", fr: "crée une clé d'accès d'utilisateur IAM dans aws-fin et l'ajoute au connecteur" } }
            - { id: perms, text: { en: "changes the permissions type of the connector to Least privilege access", fr: "change le type d'autorisations du connecteur en accès avec privilège minimum (Least privilege access)" } }
            - { id: stack, text: { en: "updates the CloudFormation stack in aws-fin with the template that the connector generates", fr: "met à jour la pile CloudFormation dans aws-fin avec le modèle généré par le connecteur" } }
            - { id: wait, text: { en: "waits for the next scan interval, because nothing has to change in AWS", fr: "attend le prochain intervalle d'analyse, car rien ne doit changer dans AWS" } }
    answer:
      values: { role: secadmin, perm: appwrite, aws: stack }
    explanation:
      correct:
        en: |
          Contributor on the subscription is enough to create and edit a connector, but CIEM also requires the Security Admin role and the Application.ReadWrite.All permission for the tenant. Turning on a new component changes the permissions that Defender for Cloud needs in AWS, so the CloudFormation stack must be updated with the new template before CIEM recommendations are calculated.
        fr: |
          Contributor sur l'abonnement suffit pour créer et modifier un connecteur, mais CIEM exige en plus le rôle Security Admin et l'autorisation Application.ReadWrite.All pour le locataire. Activer un nouveau composant modifie les autorisations dont Defender for Cloud a besoin dans AWS ; la pile CloudFormation doit donc être mise à jour avec le nouveau modèle avant que les recommandations CIEM soient calculées.
      options:
        owner: { en: "Owner also lets User1 assign roles: broader than the Security Admin role that CIEM requires.", fr: "Owner permet aussi à User1 d'attribuer des rôles : plus large que le rôle Security Admin qu'exige CIEM." }
        secreader: { en: "Security Reader only views security data; it can't change the plan settings.", fr: "Security Reader ne fait que consulter les données de sécurité ; il ne peut pas modifier les paramètres du plan." }
        key: { en: "The connector uses a federated trust with IAM roles and short-lived credentials, never stored access keys.", fr: "Le connecteur utilise une approbation fédérée avec des rôles IAM et des informations d'identification de courte durée, jamais des clés d'accès stockées." }
        wait: { en: "The scan interval doesn't grant new permissions in AWS: without the updated stack, CIEM can't collect its data.", fr: "L'intervalle d'analyse n'accorde aucune nouvelle autorisation dans AWS : sans la pile mise à jour, CIEM ne peut pas collecter ses données." }
    references:
      - title: Enable cloud infrastructure entitlement management (CIEM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-permissions-management
      - title: Connect AWS accounts to Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-41-10
    objective: "4.1.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has two Azure subscriptions in Microsoft Defender for Cloud. Vulnerability assessment for machines uses Microsoft Defender Vulnerability Management in both.

        | Subscription | Defender CSPM | Defender for Servers |
        | --- | --- | --- |
        | Sub1 | On, agentless scanning for machines On | Plan 1, Defender for Endpoint integration On |
        | Sub2 | Off | Plan 2, agentless scanning for machines On |

        Sub1 contains a Linux virtual machine named **VM1**. A vendor contract forbids installing the Defender for Endpoint sensor on VM1. Sub2 contains a virtual machine named **VM2** that is onboarded to Defender for Endpoint.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de deux abonnements Azure dans Microsoft Defender for Cloud. L'évaluation des vulnérabilités des machines utilise Microsoft Defender Vulnerability Management dans les deux.

        | Abonnement | Defender CSPM | Defender for Servers |
        | --- | --- | --- |
        | Sub1 | On, analyse sans agent des machines On | Plan 1, intégration de Defender for Endpoint On |
        | Sub2 | Off | Plan 2, analyse sans agent des machines On |

        Sub1 contient une machine virtuelle Linux nommée **VM1**. Un contrat avec un éditeur interdit d'installer le capteur Defender for Endpoint sur VM1. Sub2 contient une machine virtuelle nommée **VM2** intégrée à Defender for Endpoint.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Defender for Cloud reports vulnerability findings for VM1.", fr: "Defender for Cloud signale des résultats de vulnérabilités pour VM1." }
        - id: s2
          text: { en: "Analysts can use the Defender Vulnerability Management premium features for VM1 in the Microsoft Defender portal.", fr: "Les analystes peuvent utiliser les fonctionnalités premium de Defender Vulnerability Management pour VM1 dans le portail Microsoft Defender." }
        - id: s3
          text: { en: "The agentless findings of VM2 come from disk snapshots that Defender for Cloud analyzes about once every 24 hours.", fr: "Les résultats sans agent de VM2 proviennent d'instantanés de disques que Defender for Cloud analyse environ une fois toutes les 24 heures." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          VM1 has no sensor, but Defender CSPM with agentless scanning on Sub1 provides vulnerability assessment from disk snapshots, so VM1 gets findings (Yes). The Defender Vulnerability Management premium features come with Defender for Servers Plan 2 only, and Sub1 has Plan 1; Defender CSPM doesn't add them (No). Agentless scanning analyzes snapshots of the disks on a fixed 24-hour schedule (Yes).
        fr: |
          VM1 n'a pas de capteur, mais Defender CSPM avec l'analyse sans agent sur Sub1 fournit l'évaluation des vulnérabilités à partir d'instantanés de disques ; VM1 reçoit donc des résultats (Oui). Les fonctionnalités premium de Defender Vulnerability Management viennent uniquement avec Defender for Servers Plan 2, et Sub1 a le Plan 1 ; Defender CSPM ne les ajoute pas (Non). L'analyse sans agent analyse des instantanés des disques selon un calendrier fixe de 24 heures (Oui).
      options:
        s2: { en: "Premium features are a Defender for Servers Plan 2 benefit; neither Plan 1 nor Defender CSPM includes them.", fr: "Les fonctionnalités premium sont un avantage de Defender for Servers Plan 2 ; ni le Plan 1 ni Defender CSPM ne les incluent." }
    references:
      - title: Overview of Defender for Servers in Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
      - title: Enable agentless machine scanning
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-agentless-scanning-vms
