chapter: 22-database-security
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure SQL managed instance named **sqlmi-contoso** whose public endpoint is enabled. Users at a branch office that uses the public range 198.51.100.0/24 must connect to sqlmi-contoso through the public endpoint. No other public address must be allowed.

        What should you configure?
      fr: |
        Contoso dispose d'une instance managée Azure SQL nommée **sqlmi-contoso** dont le point de terminaison public est activé. Les utilisateurs d'une succursale qui utilise la plage publique 198.51.100.0/24 doivent se connecter à sqlmi-contoso par le point de terminaison public. Aucune autre adresse publique ne doit être autorisée.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "An inbound rule in the NSG of the managed instance subnet that allows TCP 3342 from 198.51.100.0/24", fr: "Une règle de trafic entrant dans le NSG du sous-réseau de l'instance managée qui autorise TCP 3342 depuis 198.51.100.0/24" } }
        - { id: b, text: { en: "A server-level IP firewall rule for 198.51.100.0/24, created with az sql server firewall-rule create", fr: "Une règle de pare-feu IP au niveau du serveur pour 198.51.100.0/24, créée avec az sql server firewall-rule create" } }
        - { id: c, text: { en: "A database-level IP firewall rule for 198.51.100.0/24, created with sp_set_database_firewall_rule", fr: "Une règle de pare-feu IP au niveau de la base de données pour 198.51.100.0/24, créée avec sp_set_database_firewall_rule" } }
        - { id: d, text: { en: "A virtual network rule on sqlmi-contoso for the subnet that the branch office VPN gateway uses", fr: "Une règle de réseau virtuel sur sqlmi-contoso pour le sous-réseau qu'utilise la passerelle VPN de la succursale" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A SQL managed instance has no server-level or database-level IP firewall rules: network access is filtered by the NSG associated with its subnet. The public endpoint listens on TCP 3342, so an inbound Allow rule for that port from 198.51.100.0/24, with a lower priority number than the deny rules, admits only the branch office.
        fr: |
          Une instance managée SQL n'a pas de règles de pare-feu IP au niveau du serveur ni au niveau de la base de données : l'accès réseau est filtré par le NSG associé à son sous-réseau. Le point de terminaison public écoute sur TCP 3342 ; une règle Allow de trafic entrant pour ce port depuis 198.51.100.0/24, avec un numéro de priorité inférieur à celui des règles de refus, n'admet donc que la succursale.
      options:
        b: { en: "Server-level IP firewall rules belong to the logical servers of Azure SQL Database; they don't apply to SQL Managed Instance.", fr: "Les règles de pare-feu IP au niveau du serveur appartiennent aux serveurs logiques d'Azure SQL Database ; elles ne s'appliquent pas à SQL Managed Instance." }
        c: { en: "Database-level IP firewall rules are also a feature of Azure SQL Database, not of SQL Managed Instance.", fr: "Les règles de pare-feu IP au niveau de la base de données sont elles aussi une fonctionnalité d'Azure SQL Database, pas de SQL Managed Instance." }
        d: { en: "Virtual network rules rely on the Microsoft.Sql service endpoint of a logical server; the branch office reaches the public endpoint over the internet anyway.", fr: "Les règles de réseau virtuel reposent sur le point de terminaison de service Microsoft.Sql d'un serveur logique ; de toute façon, la succursale atteint le point de terminaison public par Internet." }
    references:
      - title: Configure public endpoints in Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/public-endpoint-configure
      - title: Azure SQL Database IP firewall rules
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-22-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure Synapse Analytics workspace with a dedicated SQL pool named **dwsales** in a subscription named Sub1. The security team wants SQL vulnerability assessment and Advanced Threat Protection for dwsales.

        Which Microsoft Defender for Cloud plan should you enable on Sub1?
      fr: |
        Fabrikam dispose d'un espace de travail Azure Synapse Analytics avec un pool SQL dédié nommé **dwsales** dans un abonnement nommé Sub1. L'équipe de sécurité veut l'évaluation des vulnérabilités SQL et Advanced Threat Protection pour dwsales.

        Quel plan Microsoft Defender for Cloud devez-vous activer sur Sub1 ?
    body:
      options:
        - { id: a, text: Defender for SQL servers on machines }
        - { id: b, text: Defender for Azure SQL Databases }
        - { id: c, text: Defender for open-source relational databases }
        - { id: d, text: Defender for Storage }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Defender for Azure SQL Databases covers Azure SQL Database, SQL Managed Instance and the dedicated SQL pools of Azure Synapse Analytics. It provides SQL vulnerability assessment and Advanced Threat Protection for every supported resource of the subscription, including resources created later.
        fr: |
          Defender for Azure SQL Databases couvre Azure SQL Database, SQL Managed Instance et les pools SQL dédiés d'Azure Synapse Analytics. Il fournit l'évaluation des vulnérabilités SQL et Advanced Threat Protection pour toutes les ressources prises en charge de l'abonnement, y compris celles créées plus tard.
      options:
        a: { en: "This plan protects SQL Server running on Azure virtual machines or on machines enabled by Azure Arc, not a Synapse dedicated SQL pool.", fr: "Ce plan protège SQL Server exécuté sur des machines virtuelles Azure ou sur des machines activées par Azure Arc, pas un pool SQL dédié Synapse." }
        c: { en: "This plan protects PostgreSQL and MySQL flexible servers and Amazon RDS engines, not SQL pools.", fr: "Ce plan protège les serveurs flexibles PostgreSQL et MySQL et les moteurs Amazon RDS, pas les pools SQL." }
        d: { en: "Defender for Storage protects storage accounts; it doesn't scan or monitor a SQL engine.", fr: "Defender for Storage protège les comptes de stockage ; il n'analyse ni ne surveille un moteur SQL." }
    references:
      - title: Overview of Microsoft Defender for Azure SQL Databases
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-introduction

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has an Azure SQL Database logical server named **sql-litware-ops**. For months, server-level auditing has sent its records to a Log Analytics workspace named **law-ops**. The **Auditing** page of the server still shows auditing as enabled, with law-ops as the destination, but no new audit record has reached law-ops since Monday.

        The activity log shows the following operations on Monday. Which operation explains the missing audit records?
      fr: |
        Litware dispose d'un serveur logique Azure SQL Database nommé **sql-litware-ops**. Depuis des mois, l'audit au niveau du serveur envoie ses enregistrements vers un espace de travail Log Analytics nommé **law-ops**. La page **Audit** du serveur indique toujours que l'audit est activé, avec law-ops comme destination, mais aucun nouvel enregistrement d'audit n'est arrivé dans law-ops depuis lundi.

        Le journal d'activité montre les opérations suivantes lundi. Quelle opération explique l'absence des enregistrements d'audit ?
    body:
      options:
        - { id: a, text: { en: "The retention of law-ops was reduced from 90 days to 30 days.", fr: "La rétention de law-ops a été réduite de 90 jours à 30 jours." } }
        - { id: b, text: { en: "A diagnostic setting named SQLSecurityAuditEvents_7c1f was deleted.", fr: "Un paramètre de diagnostic nommé SQLSecurityAuditEvents_7c1f a été supprimé." } }
        - { id: c, text: { en: "The Log Analytics Reader role on law-ops was assigned to a group.", fr: "Le rôle Log Analytics Reader sur law-ops a été attribué à un groupe." } }
        - { id: d, text: { en: "A server-level IP firewall rule was added to sql-litware-ops.", fr: "Une règle de pare-feu IP au niveau du serveur a été ajoutée à sql-litware-ops." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When auditing writes to Log Analytics or Event Hubs, it relies on a diagnostic setting named SQLSecurityAuditEvents_... that is created with it. If this setting is deleted, auditing fails silently: the configuration still shows the destination, but no log reaches it. An activity log alert on the deletion of diagnostic settings helps detect it.
        fr: |
          Quand l'audit écrit vers Log Analytics ou Event Hubs, il repose sur un paramètre de diagnostic nommé SQLSecurityAuditEvents_... créé avec lui. Si ce paramètre est supprimé, l'audit échoue sans message : la configuration affiche toujours la destination, mais aucun journal n'y arrive. Une alerte du journal d'activité sur la suppression des paramètres de diagnostic permet de le détecter.
      options:
        a: { en: "A shorter retention deletes older data sooner; new records are still ingested.", fr: "Une rétention plus courte supprime plus tôt les anciennes données ; les nouveaux enregistrements sont toujours ingérés." }
        c: { en: "A reader role only grants access to query the data; it doesn't affect ingestion.", fr: "Un rôle de lecteur ne donne que l'accès en lecture aux données ; il n'affecte pas l'ingestion." }
        d: { en: "IP firewall rules filter client connections to the server; they don't affect where the audit logs are sent.", fr: "Les règles de pare-feu IP filtrent les connexions des clients au serveur ; elles n'affectent pas l'envoi des journaux d'audit." }
    references:
      - title: Set up Auditing for Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-setup

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-22-04
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has an Azure SQL Database logical server named **sql-nw-erp** with no minimum TLS version set. A colleague sets **Minimum TLS version** to **1.3** on the server. A reporting application whose driver supports TLS 1.2 but not TLS 1.3 then fails to sign in with error 47072. All the other clients support TLS 1.3.

        The reporting application must connect again, and the server must enforce the highest minimum TLS version that the application supports.

        What should you do?
      fr: |
        Northwind Traders dispose d'un serveur logique Azure SQL Database nommé **sql-nw-erp** sans version TLS minimale définie. Un collègue règle **Version TLS minimale** sur **1.3** sur le serveur. Une application de rapports dont le pilote prend en charge TLS 1.2 mais pas TLS 1.3 échoue alors à se connecter avec l'erreur 47072. Tous les autres clients prennent en charge TLS 1.3.

        L'application de rapports doit pouvoir se connecter à nouveau, et le serveur doit imposer la version TLS minimale la plus élevée que l'application prend en charge.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Reset Minimum TLS version to the default, with no minimum enforced.", fr: "Rétablir la valeur par défaut de Version TLS minimale, sans minimum imposé." } }
        - { id: b, text: { en: "Change the connection policy of sql-nw-erp from Redirect to Proxy.", fr: "Changer la stratégie de connexion de sql-nw-erp de Redirect à Proxy." } }
        - { id: c, text: { en: "Set Minimum TLS version to 1.2 on the Connectivity tab of sql-nw-erp.", fr: "Régler Version TLS minimale sur 1.2 dans l'onglet Connectivité de sql-nw-erp." } }
        - { id: d, text: { en: "Add a server-level IP firewall rule for the outbound address of the application.", fr: "Ajouter une règle de pare-feu IP au niveau du serveur pour l'adresse sortante de l'application." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Error 47072 means that the client's TLS version is below the minimum set on the server. TLS 1.2 is the lowest supported minimum, and it's the highest version that the reporting driver can use, so setting the minimum to 1.2 meets both requirements.
        fr: |
          L'erreur 47072 signifie que la version TLS du client est inférieure au minimum défini sur le serveur. TLS 1.2 est le minimum le plus bas pris en charge, et c'est la version la plus élevée que le pilote de rapports peut utiliser : régler le minimum sur 1.2 répond donc aux deux exigences.
      options:
        a: { en: "Once a minimum TLS version is enforced, you can't return to the default; and the requirement asks to enforce a minimum.", fr: "Une fois une version TLS minimale imposée, impossible de revenir à la valeur par défaut ; et l'exigence demande d'imposer un minimum." }
        b: { en: "The connection policy changes how connections are routed after sign-in; it doesn't change the TLS check that rejects the client.", fr: "La stratégie de connexion change le routage des connexions après l'authentification ; elle ne change pas le contrôle TLS qui rejette le client." }
        d: { en: "Error 47072 is a TLS version failure, not a firewall block; the application already reaches the server.", fr: "L'erreur 47072 est un échec de version TLS, pas un blocage du pare-feu : l'application atteint déjà le serveur." }
    references:
      - title: Connectivity settings for Azure SQL Database and SQL database in Fabric
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/connectivity-settings

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-22-05
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has an Azure SQL Database logical server named **sql-adatum-pay** that has a system-assigned managed identity. Server-level auditing must write to a storage account named **stadatumlogs** in the same region. stadatumlogs is a general-purpose v1 account. Its public network access is limited to selected virtual networks, and the trusted Microsoft services exception is selected. The identity of sql-adatum-pay has the Storage Blob Data Contributor role on stadatumlogs.

        Saving the auditing configuration with managed identity authentication fails. The network settings of stadatumlogs must not be relaxed.

        What should you do?
      fr: |
        Adatum dispose d'un serveur logique Azure SQL Database nommé **sql-adatum-pay** qui a une identité managée affectée par le système. L'audit au niveau du serveur doit écrire dans un compte de stockage nommé **stadatumlogs** dans la même région. stadatumlogs est un compte v1 universel (general-purpose v1). Son accès au réseau public est limité à des réseaux virtuels sélectionnés, et l'exception des services Microsoft approuvés est sélectionnée. L'identité de sql-adatum-pay dispose du rôle Storage Blob Data Contributor sur stadatumlogs.

        L'enregistrement de la configuration d'audit avec l'authentification par identité managée échoue. Les paramètres réseau de stadatumlogs ne doivent pas être assouplis.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Switch the storage authentication of the audit to storage access keys.", fr: "Passer l'authentification au stockage de l'audit aux clés d'accès au stockage." } }
        - { id: b, text: { en: "Assign the Storage Account Contributor role on stadatumlogs to the identity.", fr: "Attribuer le rôle Storage Account Contributor sur stadatumlogs à l'identité." } }
        - { id: c, text: { en: "Enable the hierarchical namespace on stadatumlogs, and then save again.", fr: "Activer l'espace de noms hiérarchique sur stadatumlogs, puis enregistrer à nouveau." } }
        - { id: d, text: { en: "Upgrade stadatumlogs to general-purpose v2, and then save again.", fr: "Mettre à niveau stadatumlogs vers v2 universel, puis enregistrer à nouveau." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Writing audit logs to a storage account behind a firewall or a virtual network requires a general-purpose v2 account; a general-purpose v1 or Blob Storage account must be upgraded first. The other prerequisites are already met: the trusted Microsoft services exception and the Storage Blob Data Contributor role for the server's managed identity.
        fr: |
          Écrire les journaux d'audit dans un compte de stockage derrière un pare-feu ou un réseau virtuel exige un compte v2 universel ; un compte v1 universel ou Blob Storage doit d'abord être mis à niveau. Les autres prérequis sont déjà remplis : l'exception des services Microsoft approuvés et le rôle Storage Blob Data Contributor pour l'identité managée du serveur.
      options:
        a: { en: "Behind a firewall or a virtual network, auditing must use managed identity authentication, not storage access keys.", fr: "Derrière un pare-feu ou un réseau virtuel, l'audit doit utiliser l'authentification par identité managée, pas les clés d'accès au stockage." }
        b: { en: "Storage Blob Data Contributor is the role that auditing needs, and it's already assigned; a control plane role doesn't remove the account kind requirement.", fr: "Storage Blob Data Contributor est le rôle dont l'audit a besoin, et il est déjà attribué ; un rôle du plan de contrôle ne lève pas l'exigence sur le type de compte." }
        c: { en: "The hierarchical namespace isn't a prerequisite of auditing, and the account kind requirement still isn't met.", fr: "L'espace de noms hiérarchique n'est pas un prérequis de l'audit, et l'exigence sur le type de compte n'est toujours pas remplie." }
    references:
      - title: Write audit to a storage account behind VNet and firewall
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/audit-write-storage-account-behind-vnet-firewall

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-22-06
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware has an Azure SQL Database logical server named **sql-prose-crm**. A Microsoft Entra group named **SQL-Admins** is set as the Microsoft Entra admin of the server. The server also has a SQL authentication server admin named **crmadmin**, and a SQL login named **app_batch** that a legacy batch job uses.

        You plan to enable Microsoft Entra-only authentication on sql-prose-crm.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un serveur logique Azure SQL Database nommé **sql-prose-crm**. Un groupe Microsoft Entra nommé **SQL-Admins** est défini comme administrateur Microsoft Entra du serveur. Le serveur a aussi un administrateur de serveur à authentification SQL nommé **crmadmin**, et une connexion SQL nommée **app_batch** qu'utilise un ancien traitement par lots.

        Vous prévoyez d'activer l'authentification Microsoft Entra uniquement sur sql-prose-crm.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "After you enable it, the app_batch login still exists, but the batch job can no longer sign in with it.", fr: "Après l'activation, la connexion app_batch existe toujours, mais le traitement par lots ne peut plus s'authentifier avec elle." } }
        - { id: b, text: { en: "After you enable it, crmadmin can still sign in with SQL authentication as an emergency access account.", fr: "Après l'activation, crmadmin peut toujours s'authentifier par l'authentification SQL comme compte d'accès d'urgence." } }
        - { id: c, text: { en: "Servers created later in the subscription inherit the setting from sql-prose-crm without other configuration.", fr: "Les serveurs créés plus tard dans l'abonnement héritent du paramètre de sql-prose-crm sans autre configuration." } }
        - { id: d, text: { en: "After you enable it, `SELECT SERVERPROPERTY('IsExternalAuthenticationOnly')` returns 1 on the server.", fr: "Après l'activation, `SELECT SERVERPROPERTY('IsExternalAuthenticationOnly')` renvoie 1 sur le serveur." } }
        - { id: e, text: { en: "After you enable it, you can remove SQL-Admins as Microsoft Entra admin, because the setting no longer needs one.", fr: "Après l'activation, vous pouvez retirer SQL-Admins comme administrateur Microsoft Entra, car le paramètre n'en a plus besoin." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Microsoft Entra-only authentication disables SQL authentication without deleting anything: existing SQL logins and users stay on the server but can't connect. Once it's enabled, the server property IsExternalAuthenticationOnly returns 1.
        fr: |
          L'authentification Microsoft Entra uniquement désactive l'authentification SQL sans rien supprimer : les connexions et utilisateurs SQL existants restent sur le serveur mais ne peuvent plus se connecter. Une fois la fonctionnalité activée, la propriété de serveur IsExternalAuthenticationOnly renvoie 1.
      options:
        b: { en: "No SQL authentication account can connect, the server admin included: it isn't a fallback or break-glass path.", fr: "Aucun compte à authentification SQL ne peut se connecter, administrateur du serveur compris : ce n'est pas une voie de secours ni d'accès d'urgence." }
        c: { en: "The setting is per server; to force new servers to be created with it, you use the built-in Azure Policy definitions.", fr: "Le paramètre est propre à chaque serveur ; pour imposer qu'il soit activé à la création des nouveaux serveurs, on utilise les définitions Azure Policy intégrées." }
        e: { en: "The Microsoft Entra admin is a prerequisite of the feature; removing it while the feature is enabled isn't supported.", fr: "L'administrateur Microsoft Entra est un prérequis de la fonctionnalité ; le retirer pendant qu'elle est activée n'est pas pris en charge." }
    references:
      - title: Microsoft Entra-only authentication with Azure SQL
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-22-07
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank uses SQL vulnerability assessment on two Azure SQL Database logical servers in a subscription named **Sub-Data**.

        | Server | Vulnerability assessment |
        | --- | --- |
        | sql-wg-cards | Express configuration |
        | sql-wg-loans | Classic configuration, with scan results in a storage account named stwgva |

        Two users have the following role assignments and no other role.

        | User | Role | Scope |
        | --- | --- | --- |
        | Admin1 | Security Admin | Sub-Data |
        | Auditor1 | Security Reader | Sub-Data |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank utilise l'évaluation des vulnérabilités SQL sur deux serveurs logiques Azure SQL Database d'un abonnement nommé **Sub-Data**.

        | Serveur | Évaluation des vulnérabilités |
        | --- | --- |
        | sql-wg-cards | Configuration express |
        | sql-wg-loans | Configuration classique, avec les résultats d'analyse dans un compte de stockage nommé stwgva |

        Deux utilisateurs ont les attributions de rôles suivantes et aucun autre rôle.

        | Utilisateur | Rôle | Étendue |
        | --- | --- | --- |
        | Admin1 | Security Admin | Sub-Data |
        | Auditor1 | Security Reader | Sub-Data |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Admin1 can change the vulnerability assessment settings of sql-wg-cards.", fr: "Admin1 peut modifier les paramètres d'évaluation des vulnérabilités de sql-wg-cards." }
        - id: s2
          text: { en: "Admin1 can change the vulnerability assessment settings of sql-wg-loans.", fr: "Admin1 peut modifier les paramètres d'évaluation des vulnérabilités de sql-wg-loans." }
        - id: s3
          text: { en: "Auditor1 can view the vulnerability assessment findings of both servers in the Defender for Cloud recommendations.", fr: "Auditor1 peut consulter les résultats de l'évaluation des vulnérabilités des deux serveurs dans les recommandations de Defender for Cloud." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          With the express configuration, SQL Security Manager or Security Admin is enough to change the settings, because Defender for Cloud manages the storage of the results. The classic configuration also needs access to your storage account: SQL Security Manager, Storage Blob Data Reader and Owner of the storage account together, which Admin1 doesn't have. In both configurations, Security Reader or Security Admin can view the findings in the recommendations.
        fr: |
          Avec la configuration express, SQL Security Manager ou Security Admin suffit pour modifier les paramètres, car Defender for Cloud gère le stockage des résultats. La configuration classique exige aussi l'accès à votre compte de stockage : SQL Security Manager, Storage Blob Data Reader et Owner du compte de stockage ensemble, ce qu'Admin1 n'a pas. Dans les deux configurations, Security Reader ou Security Admin peut consulter les résultats dans les recommandations.
      options:
        s2: { en: "Security Admin alone isn't enough for the classic configuration, which stores its results in stwgva.", fr: "Security Admin seul ne suffit pas pour la configuration classique, qui stocke ses résultats dans stwgva." }
    references:
      - title: Scan your Azure SQL databases for vulnerabilities
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/sql-azure-vulnerability-assessment-overview

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-22-08
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has an Azure SQL Database logical server named **sql-tt-orders** that has a system-assigned managed identity. You plan to use an RSA 3072-bit key named **key-tde** as the customer-managed TDE protector of sql-tt-orders. key-tde is enabled, has no expiration date, and is stored in a key vault named **kv-tt-sec** that has the following configuration.

        | Setting | Value |
        | --- | --- |
        | Permission model | Azure role-based access control |
        | Soft delete | Enabled, 90 days |
        | Purge protection | Enabled |
        | Public network access | Allow public access from specific virtual networks and IP addresses: only the subnet snet-apps |
        | Allow trusted Microsoft services to bypass this firewall | No |
        | Role assignment on key-tde | Key Vault Crypto Service Encryption User for the identity of sql-tt-orders |

        When you select key-tde as the TDE protector, the operation fails because sql-tt-orders can't reach the key. kv-tt-sec must not accept connections from any additional IP address or virtual network.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un serveur logique Azure SQL Database nommé **sql-tt-orders** qui a une identité managée affectée par le système. Vous prévoyez d'utiliser une clé RSA de 3072 bits nommée **key-tde** comme protecteur TDE géré par le client de sql-tt-orders. key-tde est activée, n'a pas de date d'expiration et est stockée dans un coffre de clés nommé **kv-tt-sec** dont la configuration est la suivante.

        | Paramètre | Valeur |
        | --- | --- |
        | Modèle d'autorisation | Contrôle d'accès en fonction du rôle Azure |
        | Suppression réversible | Activée, 90 jours |
        | Protection contre la suppression définitive | Activée |
        | Accès au réseau public | Allow public access from specific virtual networks and IP addresses : uniquement le sous-réseau snet-apps |
        | Allow trusted Microsoft services to bypass this firewall | No |
        | Attribution de rôle sur key-tde | Key Vault Crypto Service Encryption User pour l'identité de sql-tt-orders |

        Quand vous sélectionnez key-tde comme protecteur TDE, l'opération échoue, car sql-tt-orders ne peut pas atteindre la clé. kv-tt-sec ne doit accepter de connexions d'aucune adresse IP ni d'aucun réseau virtuel supplémentaire.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Switch kv-tt-sec to the vault access policy model, and grant get, wrapKey and unwrapKey to the identity.", fr: "Passer kv-tt-sec au modèle de stratégie d'accès du coffre, et accorder get, wrapKey et unwrapKey à l'identité." } }
        - { id: b, text: { en: "Add the outbound IP addresses of sql-tt-orders in its region to the firewall rules of kv-tt-sec.", fr: "Ajouter les adresses IP sortantes de sql-tt-orders dans sa région aux règles de pare-feu de kv-tt-sec." } }
        - { id: c, text: { en: "Set Allow trusted Microsoft services to bypass this firewall to Yes on kv-tt-sec.", fr: "Régler Allow trusted Microsoft services to bypass this firewall sur Yes sur kv-tt-sec." } }
        - { id: d, text: { en: "Assign the Key Vault Crypto Officer role on kv-tt-sec to the identity of sql-tt-orders.", fr: "Attribuer le rôle Key Vault Crypto Officer sur kv-tt-sec à l'identité de sql-tt-orders." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The vault settings, the key and the role assignment meet the requirements of customer-managed TDE; only the network path is missing. When the key vault firewall is enabled and no private endpoint is used for the server, the trusted Microsoft services exception lets Azure SQL reach the key without opening the vault to more addresses or networks.
        fr: |
          Les paramètres du coffre, la clé et l'attribution de rôle répondent aux exigences du TDE géré par le client ; seul le chemin réseau manque. Quand le pare-feu du coffre de clés est activé et qu'aucun point de terminaison privé n'est utilisé pour le serveur, l'exception des services Microsoft approuvés permet à Azure SQL d'atteindre la clé sans ouvrir le coffre à d'autres adresses ou réseaux.
      options:
        a: { en: "The permission is already granted through the RBAC model; changing the permission model doesn't open the network path.", fr: "L'autorisation est déjà accordée par le modèle RBAC ; changer de modèle d'autorisation n'ouvre pas le chemin réseau." }
        b: { en: "Adding IP addresses to the vault firewall breaks the requirement, and those addresses can change.", fr: "Ajouter des adresses IP au pare-feu du coffre enfreint l'exigence, et ces adresses peuvent changer." }
        d: { en: "Key Vault Crypto Officer manages keys but adds nothing that the server needs here, and it doesn't solve the network block.", fr: "Key Vault Crypto Officer gère les clés mais n'ajoute rien dont le serveur a besoin ici, et il ne résout pas le blocage réseau." }
    references:
      - title: Azure SQL Transparent Data Encryption with customer-managed key
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-22-09
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank has an Azure SQL managed instance named **sqlmi-wg-core**. A diagnostic setting named **diag-audit** sends the **SQLSecurityAuditEvents** category of sqlmi-wg-core to a Log Analytics workspace named **law-sec**. A server audit named **Audit-Std**, created with `TO EXTERNAL_MONITOR`, and its audit specification record sign-ins and schema changes.

        Regulators now require a record of the operations that Microsoft support engineers perform on sqlmi-wg-core, in law-sec. Audit-Std must keep recording the same events.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'une instance managée Azure SQL nommée **sqlmi-wg-core**. Un paramètre de diagnostic nommé **diag-audit** envoie la catégorie **SQLSecurityAuditEvents** de sqlmi-wg-core vers un espace de travail Log Analytics nommé **law-sec**. Un audit de serveur nommé **Audit-Std**, créé avec `TO EXTERNAL_MONITOR`, et sa spécification d'audit enregistrent les connexions et les modifications de schéma.

        Les régulateurs exigent désormais un enregistrement, dans law-sec, des opérations que les ingénieurs du support Microsoft effectuent sur sqlmi-wg-core. Audit-Std doit continuer à enregistrer les mêmes événements.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          1. In diag-audit, also select the category [[cat]].

          2. Run the statement: [[stmt]] TO [[dest]] WITH ([[opt]]);

          3. Enable the audit with `ALTER SERVER AUDIT ... WITH (STATE = ON);`
        fr: |
          1. Dans diag-audit, sélectionner aussi la catégorie [[cat]].

          2. Exécuter l'instruction : [[stmt]] TO [[dest]] WITH ([[opt]]);

          3. Activer l'audit avec `ALTER SERVER AUDIT ... WITH (STATE = ON);`
      slots:
        - id: cat
          options:
            - { id: devops, text: DevOps operations Audit Logs }
            - { id: usage, text: ResourceUsageStats }
            - { id: errors, text: Errors }
        - id: stmt
          options:
            - { id: alter, text: "ALTER SERVER AUDIT [Audit-Std]" }
            - { id: create, text: "CREATE SERVER AUDIT [Audit-Ops]" }
            - { id: spec, text: "CREATE SERVER AUDIT SPECIFICATION [Spec-Ops]" }
        - id: dest
          options:
            - { id: url, text: "URL (PATH = 'https://stwgaudit.blob.core.windows.net/ops')" }
            - { id: ext, text: EXTERNAL_MONITOR }
            - { id: applog, text: APPLICATION_LOG }
        - id: opt
          options:
            - { id: queue, text: QUEUE_DELAY = 0 }
            - { id: retention, text: RETENTION_DAYS = 0 }
            - { id: operator, text: OPERATOR_AUDIT = ON }
    answer:
      values: { cat: devops, stmt: create, dest: ext, opt: operator }
    explanation:
      correct:
        en: |
          Microsoft support operations are audited by a separate server audit with OPERATOR_AUDIT = ON. To reach Log Analytics, the audit uses TO EXTERNAL_MONITOR, and the diagnostic setting must include the DevOps operations Audit Logs category next to SQLSecurityAuditEvents. Turning the option on for Audit-Std would overwrite it so that it logs only support operations.
        fr: |
          Les opérations du support Microsoft s'auditent avec un audit de serveur distinct doté de OPERATOR_AUDIT = ON. Pour atteindre Log Analytics, l'audit utilise TO EXTERNAL_MONITOR, et le paramètre de diagnostic doit inclure la catégorie DevOps operations Audit Logs à côté de SQLSecurityAuditEvents. Activer l'option sur Audit-Std l'écraserait pour qu'il n'enregistre plus que les opérations du support.
      options:
        alter: { en: "Enabling support operations on an existing audit overwrites it, and Audit-Std would stop recording sign-ins and schema changes.", fr: "Activer les opérations du support sur un audit existant l'écrase, et Audit-Std n'enregistrerait plus les connexions ni les modifications de schéma." }
        spec: { en: "An audit specification selects action groups for an audit; the support operations option belongs to the server audit itself.", fr: "Une spécification d'audit choisit des groupes d'actions pour un audit ; l'option des opérations du support appartient à l'audit de serveur lui-même." }
        url: { en: "TO URL writes .xel files to a blob container, not to the Log Analytics workspace.", fr: "TO URL écrit des fichiers .xel dans un conteneur d'objets blob, pas dans l'espace de travail Log Analytics." }
        usage: { en: "ResourceUsageStats carries resource usage metrics, not audit events.", fr: "ResourceUsageStats transporte des métriques d'utilisation des ressources, pas des événements d'audit." }
    references:
      - title: Get started with Azure SQL Managed Instance auditing
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/auditing-configure

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-22-10
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has two Azure SQL Database logical servers. Each server has a system-assigned managed identity and a customer-managed TDE protector.

        | Server | Region | TDE protector | Role of the server identity |
        | --- | --- | --- | --- |
        | sql-ct-weu | West Europe | Key-A in kv-ct-weu | Key Vault Crypto Service Encryption User on kv-ct-weu |
        | sql-ct-neu | North Europe | Key-B in kv-ct-neu | Key Vault Crypto Service Encryption User on kv-ct-neu |

        Both key vaults use the Azure RBAC permission model and have soft delete and purge protection enabled. You try to create a failover group from sql-ct-weu to sql-ct-neu for a database named **db-claims**, and the creation fails. Each server must keep its own TDE protector and its own key vault.

        What should you do before you create the failover group again?
      fr: |
        Contoso dispose de deux serveurs logiques Azure SQL Database. Chaque serveur a une identité managée affectée par le système et un protecteur TDE géré par le client.

        | Serveur | Région | Protecteur TDE | Rôle de l'identité du serveur |
        | --- | --- | --- | --- |
        | sql-ct-weu | Europe Ouest | Key-A dans kv-ct-weu | Key Vault Crypto Service Encryption User sur kv-ct-weu |
        | sql-ct-neu | Europe Nord | Key-B dans kv-ct-neu | Key Vault Crypto Service Encryption User sur kv-ct-neu |

        Les deux coffres de clés utilisent le modèle d'autorisation RBAC Azure, avec la suppression réversible et la protection contre la suppression définitive activées. Vous essayez de créer un groupe de basculement de sql-ct-weu vers sql-ct-neu pour une base de données nommée **db-claims**, et la création échoue. Chaque serveur doit conserver son propre protecteur TDE et son propre coffre de clés.

        Que devez-vous faire avant de recréer le groupe de basculement ?
    body:
      options:
        - { id: a, text: { en: "Move kv-ct-neu to the West Europe region, so that both key vaults are in the region of the primary server.", fr: "Déplacer kv-ct-neu dans la région Europe Ouest, pour que les deux coffres de clés soient dans la région du serveur primaire." } }
        - { id: b, text: { en: "Grant each server identity the same role on the other key vault, and add Key-A and Key-B to both servers.", fr: "Accorder à chaque identité de serveur le même rôle sur l'autre coffre de clés, et ajouter Key-A et Key-B aux deux serveurs." } }
        - { id: c, text: { en: "Enable automatic key rotation on both servers, so that they use the latest version of the same key.", fr: "Activer la rotation automatique des clés sur les deux serveurs, pour qu'ils utilisent la dernière version de la même clé." } }
        - { id: d, text: { en: "Set the TDE protector of sql-ct-neu to service-managed until the failover group exists, then set Key-B again.", fr: "Régler le protecteur TDE de sql-ct-neu sur géré par le service jusqu'à ce que le groupe de basculement existe, puis remettre Key-B." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When you create a geo-replication link or a failover group, Azure SQL checks that both servers can access every customer-managed key that the databases need, and the creation fails otherwise. With Key-A on the primary and Key-B on the secondary, both keys must be added to both servers, and each server identity needs permissions on both key vaults, so that db-claims stays accessible after a failover.
        fr: |
          Quand vous créez un lien de géoréplication ou un groupe de basculement, Azure SQL vérifie que les deux serveurs peuvent accéder à chaque clé gérée par le client dont les bases ont besoin, sinon la création échoue. Avec Key-A sur le primaire et Key-B sur le secondaire, les deux clés doivent être ajoutées aux deux serveurs, et chaque identité de serveur a besoin d'autorisations sur les deux coffres, pour que db-claims reste accessible après un basculement.
      options:
        a: { en: "The servers and key vaults don't have to be in the same region; what's missing is access to the other server's key.", fr: "Les serveurs et les coffres de clés n'ont pas à être dans la même région ; ce qui manque, c'est l'accès à la clé de l'autre serveur." }
        c: { en: "Automatic rotation moves each server to the latest version of its own key; it doesn't give a server access to the other key vault.", fr: "La rotation automatique fait passer chaque serveur à la dernière version de sa propre clé ; elle ne donne pas à un serveur l'accès à l'autre coffre." }
        d: { en: "db-claims is still protected by Key-A, which sql-ct-neu can't access whatever its own protector; and each server must keep its protector.", fr: "db-claims reste protégée par Key-A, à laquelle sql-ct-neu n'a pas accès quel que soit son propre protecteur ; et chaque serveur doit conserver son protecteur." }
    references:
      - title: Azure SQL Transparent Data Encryption with customer-managed key
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
