chapter: 43-sentinel-collection
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-43-01
    objective: "4.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys collected the activity log of its three Azure subscriptions in Microsoft Sentinel several years ago, by using the legacy connection method of the Azure Activity connector. You plan to reconfigure the Azure Activity connector so that it uses the diagnostic settings pipeline.

        What should you do first?
      fr: |
        Tailspin Toys collecte depuis plusieurs années le journal d'activité de ses trois abonnements Azure dans Microsoft Sentinel, avec la méthode de connexion héritée du connecteur Azure Activity. Vous prévoyez de reconfigurer le connecteur Azure Activity pour qu'il utilise le pipeline des paramètres de diagnostic.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Register the SecurityInsights resource provider in each subscription.", fr: "Inscrire le fournisseur de ressources SecurityInsights dans chaque abonnement." } }
        - { id: b, text: { en: "Create a data collection rule that targets the three subscriptions.", fr: "Créer une règle de collecte de données qui cible les trois abonnements." } }
        - { id: c, text: { en: "Select Disconnect All in the configuration section of the connector page.", fr: "Sélectionner Disconnect All dans la section de configuration de la page du connecteur." } }
        - { id: d, text: { en: "Delete the AzureActivity table so that the new connector recreates it.", fr: "Supprimer la table AzureActivity pour que le nouveau connecteur la recrée." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Azure Activity connector now uses the diagnostic settings pipeline. Subscriptions still connected with the legacy method must be disconnected first (**Disconnect All** in the connector's configuration section); then you assign the policy that streams the activity log of each subscription to the workspace.
        fr: |
          Le connecteur Azure Activity utilise désormais le pipeline des paramètres de diagnostic. Les abonnements encore connectés avec la méthode héritée doivent d'abord être déconnectés (**Disconnect All** dans la section de configuration du connecteur) ; vous attribuez ensuite la stratégie qui envoie le journal d'activité de chaque abonnement vers l'espace de travail.
      options:
        a: { en: "The SecurityInsights provider is a prerequisite of the subscription-based Defender for Cloud connector, not a step of the Azure Activity migration.", fr: "Le fournisseur SecurityInsights est un prérequis du connecteur Defender for Cloud basé sur l'abonnement, pas une étape de la migration d'Azure Activity." }
        b: { en: "Data collection rules are used by the Azure Monitor Agent on machines; the activity log is sent through a diagnostic setting.", fr: "Les règles de collecte de données servent à l'agent Azure Monitor sur des machines ; le journal d'activité est envoyé par un paramètre de diagnostic." }
        d: { en: "AzureActivity is a built-in Azure table: it can't be deleted, and the migration doesn't require it.", fr: "AzureActivity est une table Azure intégrée : elle ne peut pas être supprimée, et la migration ne l'exige pas." }
    references:
      - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
        url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-43-02
    objective: "4.2.10"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An analyst at Contoso deleted a sensitive file in SharePoint Online at 10:00. At 10:15, an investigator searches the unified audit log from the **Audit** page of the Microsoft Defender portal and finds no record of the deletion. Audit log ingestion is turned on, and the investigator has the required audit role.

        What is the most likely explanation?
      fr: |
        Un analyste de Contoso a supprimé un fichier sensible dans SharePoint Online à 10 h 00. À 10 h 15, un enquêteur recherche dans le journal d'audit unifié depuis la page **Audit** du portail Microsoft Defender et ne trouve aucun enregistrement de la suppression. L'ingestion du journal d'audit est activée, et l'enquêteur dispose du rôle d'audit requis.

        Quelle est l'explication la plus probable ?
    body:
      options:
        - { id: a, text: { en: "SharePoint audit records typically become available 60 to 90 minutes after the event.", fr: "Les enregistrements d'audit SharePoint sont en général disponibles 60 à 90 minutes après l'événement." } }
        - { id: b, text: { en: "File deletions are recorded only when an audit log retention policy covers SharePoint.", fr: "Les suppressions de fichiers ne sont enregistrées que si une stratégie de rétention d'audit couvre SharePoint." } }
        - { id: c, text: { en: "The default date range of a search excludes activity that occurred on the current day.", fr: "La plage de dates par défaut d'une recherche exclut l'activité survenue le jour même." } }
        - { id: d, text: { en: "SharePoint activity can be searched only from the Microsoft Purview portal.", fr: "L'activité SharePoint ne peut être recherchée que depuis le portail Microsoft Purview." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          For core services such as Exchange, SharePoint, OneDrive and Teams, an audit record is typically available 60 to 90 minutes after the event, and Microsoft doesn't guarantee a specific time. A search run 15 minutes after the deletion can therefore return nothing although auditing works.
        fr: |
          Pour les services principaux comme Exchange, SharePoint, OneDrive et Teams, un enregistrement d'audit est en général disponible 60 à 90 minutes après l'événement, et Microsoft ne garantit pas de délai précis. Une recherche lancée 15 minutes après la suppression peut donc ne rien renvoyer alors que l'audit fonctionne.
      options:
        b: { en: "Retention policies decide how long records are kept, not whether an activity is recorded.", fr: "Les stratégies de rétention déterminent la durée de conservation des enregistrements, pas l'enregistrement d'une activité." }
        c: { en: "The default range is the last seven days, which includes the current day.", fr: "La plage par défaut couvre les sept derniers jours, jour même compris." }
        d: { en: "The Audit page of the Defender portal offers the same search as the Microsoft Purview portal.", fr: "La page Audit du portail Defender propose la même recherche que le portail Microsoft Purview." }
    references:
      - title: Search the audit log
        url: https://learn.microsoft.com/en-us/purview/audit-search

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-43-03
    objective: "4.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. has a Log Analytics workspace on which Microsoft Sentinel is enabled. An Azure administrator who isn't part of the SOC created a data collection rule (DCR) from the **Data collection rules** page of Azure Monitor. The DCR has a **Windows event logs** data source that collects the Security log, Audit success and Audit failure, from 50 Azure virtual machines, and sends it to the workspace.

        Analysts query the `SecurityEvent` table and find no events from these virtual machines.

        In which table are the collected Security events stored?
      fr: |
        Litware, Inc. dispose d'un espace de travail Log Analytics sur lequel Microsoft Sentinel est activé. Un administrateur Azure qui ne fait pas partie du SOC a créé une règle de collecte de données (DCR) depuis la page **Règles de collecte de données** d'Azure Monitor. La DCR a une source de données **Journaux des événements Windows** qui collecte le journal Security, Audit success et Audit failure, de 50 machines virtuelles Azure, et l'envoie vers l'espace de travail.

        Les analystes interrogent la table `SecurityEvent` et ne trouvent aucun événement de ces machines virtuelles.

        Dans quelle table les événements de sécurité collectés sont-ils stockés ?
    body:
      options:
        - { id: a, text: "`WindowsEvent`" }
        - { id: b, text: "`Event`" }
        - { id: c, text: "`SecurityAlert`" }
        - { id: d, text: "`AzureDiagnostics`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Windows event logs data source of an Azure Monitor DCR sends every collected log, including the Security log, to the `Event` table. To store Security events in `SecurityEvent`, the table that most Sentinel analytics rules query, the DCR must be created from the Windows Security Events via AMA connector, which uses the same agent and collects the same events.
        fr: |
          Une source de données Journaux des événements Windows d'une DCR Azure Monitor envoie tous les journaux collectés, y compris le journal Security, vers la table `Event`. Pour stocker les événements de sécurité dans `SecurityEvent`, la table qu'interrogent la plupart des règles d'analyse Sentinel, la DCR doit être créée depuis le connecteur Windows Security Events via AMA, qui utilise le même agent et collecte les mêmes événements.
      options:
        a: { en: "`WindowsEvent` receives the events collected by the Windows Forwarded Events connector on a Windows Event Collector server.", fr: "`WindowsEvent` reçoit les événements collectés par le connecteur Windows Forwarded Events sur un serveur collecteur d'événements Windows." }
        c: { en: "`SecurityAlert` stores alerts from security products such as Defender for Cloud, not raw Windows events.", fr: "`SecurityAlert` stocke les alertes de produits de sécurité comme Defender for Cloud, pas des événements Windows bruts." }
        d: { en: "`AzureDiagnostics` receives resource logs sent by diagnostic settings, not events collected by the Azure Monitor Agent.", fr: "`AzureDiagnostics` reçoit les journaux de ressources envoyés par des paramètres de diagnostic, pas les événements collectés par l'agent Azure Monitor." }
    references:
      - title: Collect Windows events from virtual machines with Azure Monitor Agent - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-windows-events
      - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
        url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-43-04
    objective: "4.2.7"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation manages the tables of the Log Analytics workspace that Microsoft Sentinel uses. The workspace contains built-in Azure tables, such as `Syslog`, and DCR-based custom tables. An engineer plans to store an extra value in the Linux records, to ingest a new low-value application log at a lower cost, and to reduce the cost of the syslog data that the SOC no longer queries.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation gère les tables de l'espace de travail Log Analytics qu'utilise Microsoft Sentinel. L'espace de travail contient des tables Azure intégrées, comme `Syslog`, et des tables personnalisées basées sur une DCR. Un ingénieur prévoit de stocker une valeur supplémentaire dans les enregistrements Linux, d'ingérer à moindre coût un nouveau journal d'application de faible valeur, et de réduire le coût des données syslog que le SOC n'interroge plus.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              A custom column that you add to an Azure table such as `Syslog` must have a name that ends with `_CF`.
            fr: |
              Une colonne personnalisée que vous ajoutez à une table Azure comme `Syslog` doit avoir un nom qui se termine par `_CF`.
        - id: s2
          text:
            en: |
              When you create a DCR-based custom table, you can select the Basic table plan instead of Analytics.
            fr: |
              Lorsque vous créez une table personnalisée basée sur une DCR, vous pouvez sélectionner le plan de table Basic au lieu d'Analytics.
        - id: s3
          text:
            en: |
              To stop paying for data you no longer need, you can delete the built-in `Syslog` table from the workspace.
            fr: |
              Pour ne plus payer des données dont vous n'avez plus besoin, vous pouvez supprimer la table intégrée `Syslog` de l'espace de travail.
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Custom tables end with `_CL`, and a custom column added to an Azure table must end with `_CF`. When you create a DCR-based custom table you choose its plan, Analytics (the default) or a lower-cost plan such as Basic. Azure tables can't be deleted: only custom tables can, and you reduce the cost of an Azure table by changing what is collected or its plan.
        fr: |
          Les tables personnalisées se terminent par `_CL`, et une colonne personnalisée ajoutée à une table Azure doit se terminer par `_CF`. À la création d'une table personnalisée basée sur une DCR, vous choisissez son plan, Analytics (par défaut) ou un plan moins coûteux comme Basic. Les tables Azure ne peuvent pas être supprimées : seules les tables personnalisées le peuvent, et l'on réduit le coût d'une table Azure en modifiant ce qui est collecté ou son plan.
      options:
        s3: { en: "Built-in Azure tables can't be deleted; only custom tables can.", fr: "Les tables Azure intégrées ne peuvent pas être supprimées ; seules les tables personnalisées le peuvent." }
    references:
      - title: Add or delete tables and columns in Azure Monitor Logs
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-43-05
    objective: "4.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank configured a Linux log forwarder named **lnx-fwd1** for Microsoft Sentinel. A data collection rule created from the Common Event Format (CEF) via AMA connector targets lnx-fwd1; no Syslog via AMA rule exists. You then ran the following command on lnx-fwd1 to send a test message to the local daemon:

        ```bash
        logger -p local4.warn -P 514 -n 127.0.0.1 --rfc3164 -t CEF "0|Mock-test|MOCK|common=event-format-test|end|TRAFFIC|rt=$common=event-formatted-receive_time"
        ```

        Twenty minutes later, you need to confirm that the test message reached the workspace.

        Which query should you run?
      fr: |
        Woodgrove Bank a configuré un redirecteur de journaux Linux nommé **lnx-fwd1** pour Microsoft Sentinel. Une règle de collecte de données créée depuis le connecteur Common Event Format (CEF) via AMA cible lnx-fwd1 ; il n'existe aucune règle Syslog via AMA. Vous avez ensuite exécuté la commande suivante sur lnx-fwd1 pour envoyer un message de test au démon local :

        ```bash
        logger -p local4.warn -P 514 -n 127.0.0.1 --rfc3164 -t CEF "0|Mock-test|MOCK|common=event-format-test|end|TRAFFIC|rt=$common=event-formatted-receive_time"
        ```

        Vingt minutes plus tard, vous devez confirmer que le message de test a atteint l'espace de travail.

        Quelle requête devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`Syslog | where TimeGenerated > ago(1d) | where ProcessName == \"MOCK\"`" }
        - { id: b, text: "`Heartbeat | where TimeGenerated > ago(1d) | where Computer == \"lnx-fwd1\"`" }
        - { id: c, text: "`SecurityEvent | where TimeGenerated > ago(1d) | where Computer == \"lnx-fwd1\"`" }
        - { id: d, text: "`CommonSecurityLog | where TimeGenerated > ago(1d) | where DeviceProduct == \"MOCK\"`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The CEF via AMA connector stores CEF messages in `CommonSecurityLog`, and the test message declares the device product `MOCK` in its CEF header. Filtering `CommonSecurityLog` on `DeviceProduct == "MOCK"` therefore shows whether the message went through the daemon and the agent to the workspace; logs can take up to 20 minutes to appear.
        fr: |
          Le connecteur CEF via AMA stocke les messages CEF dans `CommonSecurityLog`, et le message de test déclare le produit `MOCK` dans son en-tête CEF. Filtrer `CommonSecurityLog` sur `DeviceProduct == "MOCK"` montre donc si le message a traversé le démon et l'agent jusqu'à l'espace de travail ; les journaux peuvent mettre jusqu'à 20 minutes à apparaître.
      options:
        a: { en: "With only a CEF rule, the message isn't stored in `Syslog`; that table receives the data of the Syslog via AMA connector.", fr: "Avec une seule règle CEF, le message n'est pas stocké dans `Syslog` ; cette table reçoit les données du connecteur Syslog via AMA." }
        b: { en: "`Heartbeat` proves that the agent is connected, not that the test message was collected.", fr: "`Heartbeat` prouve que l'agent est connecté, pas que le message de test a été collecté." }
        c: { en: "`SecurityEvent` contains Windows Security events, not messages received by a Linux forwarder.", fr: "`SecurityEvent` contient des événements de sécurité Windows, pas des messages reçus par un redirecteur Linux." }
    references:
      - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
        url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-43-06
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam, Inc. collects the CEF messages of 12 network appliances in Microsoft Sentinel. The appliances are in the on-premises datacenter and send to **lnx-fwd2**, an on-premises Linux server that runs rsyslog, has the Azure Connected Machine agent installed, and runs the Azure Monitor Agent 1.33. A data collection rule (DCR) created from the Common Event Format (CEF) via AMA connector targets lnx-fwd2, and the forwarder installation script was run on lnx-fwd2 with its default settings.

        The network team will create the firewall rules between the appliances and lnx-fwd2. rsyslog on lnx-fwd2 still uses the distribution's default configuration, which writes every received message to a file under /var/log.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. collecte les messages CEF de 12 appliances réseau dans Microsoft Sentinel. Les appliances se trouvent dans le centre de données local et envoient vers **lnx-fwd2**, un serveur Linux local qui exécute rsyslog, sur lequel l'agent Azure Connected Machine est installé, et qui exécute l'agent Azure Monitor 1.33. Une règle de collecte de données (DCR) créée depuis le connecteur Common Event Format (CEF) via AMA cible lnx-fwd2, et le script d'installation du redirecteur a été exécuté sur lnx-fwd2 avec ses paramètres par défaut.

        L'équipe réseau va créer les règles de pare-feu entre les appliances et lnx-fwd2. rsyslog sur lnx-fwd2 utilise encore la configuration par défaut de la distribution, qui écrit chaque message reçu dans un fichier sous /var/log.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: |
              The firewall rules must allow the appliances to reach lnx-fwd2 on TCP port 28330.
            fr: |
              Les règles de pare-feu doivent autoriser les appliances à joindre lnx-fwd2 sur le port TCP 28330.
        - id: s2
          text:
            en: |
              The appliances can send their messages to lnx-fwd2 on port 514 over either TCP or UDP.
            fr: |
              Les appliances peuvent envoyer leurs messages à lnx-fwd2 sur le port 514, en TCP ou en UDP.
        - id: s3
          text:
            en: |
              With the current rsyslog configuration, the ingestion of the CEF messages into the workspace can stop when the disk of lnx-fwd2 is full.
            fr: |
              Avec la configuration actuelle de rsyslog, l'ingestion des messages CEF dans l'espace de travail peut s'arrêter quand le disque de lnx-fwd2 est plein.
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          The installation script configures the daemon to listen on port 514 over UDP and TCP, so the appliances only need to reach port 514. Port 28330 is used on the forwarder itself, between the daemon and the Azure Monitor Agent, and doesn't need to be opened to the appliances. Microsoft recommends configuring rsyslog or syslog-ng not to store unneeded logs, because a full disk disrupts the agent.
        fr: |
          Le script d'installation configure le démon pour écouter sur le port 514 en UDP et en TCP ; les appliances n'ont donc besoin de joindre que le port 514. Le port 28330 est utilisé sur le redirecteur lui-même, entre le démon et l'agent Azure Monitor, et n'a pas à être ouvert aux appliances. Microsoft recommande de configurer rsyslog ou syslog-ng pour ne pas stocker les journaux inutiles, car un disque plein perturbe l'agent.
      options:
        s1: { en: "28330 is the local port to which the daemon forwards messages to the agent; the appliances send to port 514.", fr: "28330 est le port local vers lequel le démon transfère les messages à l'agent ; les appliances envoient vers le port 514." }
    references:
      - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
        url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-43-07
    objective: "4.2.6"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind Traders sends the following data to the Log Analytics workspace of Microsoft Sentinel:

        - The Security log of 200 Azure virtual machines and of 30 on-premises Azure Arc-enabled servers, collected by a data collection rule (DCR) created from the Windows Security Events via AMA connector with the Minimal event set.
        - The Security events that 40 domain controllers forward by Windows Event Forwarding to a Windows Event Collector server named **srv-wec1**, collected by the Windows Forwarded Events connector.
        - The CEF messages of a firewall that sends on the local4 facility to a Linux log forwarder, collected by a DCR created from the Common Event Format (CEF) via AMA connector.
        - A DCR created from the Syslog via AMA connector on the same forwarder, which also collects local4 and has no transformation.

        An analyst needs to know which table to query for each type of record listed in the answer area.

        Which table should the analyst query for each type of record? To answer, drag the appropriate tables to the correct record types. Each table may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders envoie les données suivantes à l'espace de travail Log Analytics de Microsoft Sentinel :

        - Le journal Security de 200 machines virtuelles Azure et de 30 serveurs locaux activés par Azure Arc, collecté par une règle de collecte de données (DCR) créée depuis le connecteur Windows Security Events via AMA avec l'ensemble d'événements Minimal.
        - Les événements de sécurité que 40 contrôleurs de domaine transfèrent par le transfert d'événements Windows à un serveur collecteur d'événements Windows nommé **srv-wec1**, collectés par le connecteur Windows Forwarded Events.
        - Les messages CEF d'un pare-feu qui envoie sur la facility local4 à un redirecteur de journaux Linux, collectés par une DCR créée depuis le connecteur Common Event Format (CEF) via AMA.
        - Une DCR créée depuis le connecteur Syslog via AMA sur le même redirecteur, qui collecte aussi local4 et n'a aucune transformation.

        Un analyste doit savoir quelle table interroger pour chaque type d'enregistrement listé dans la zone de réponse.

        Quelle table l'analyste doit-il interroger pour chaque type d'enregistrement ? Pour répondre, faites glisser les tables appropriées vers les types d'enregistrements correspondants. Chaque table peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: secevent, text: "`SecurityEvent`" }
        - { id: winevent, text: "`WindowsEvent`" }
        - { id: event, text: "`Event`" }
        - { id: syslog, text: "`Syslog`" }
        - { id: csl, text: "`CommonSecurityLog`" }
      targets:
        - { id: t1, text: { en: "Failed sign-ins (4625) on the on-premises Azure Arc-enabled servers", fr: "Échecs de connexion (4625) sur les serveurs locaux activés par Azure Arc" } }
        - { id: t2, text: { en: "Account creations (4720) on the domain controllers", fr: "Créations de comptes (4720) sur les contrôleurs de domaine" } }
        - { id: t3, text: { en: "Parsed firewall records with their DeviceVendor and DeviceProduct fields", fr: "Enregistrements du pare-feu analysés, avec leurs champs DeviceVendor et DeviceProduct" } }
        - { id: t4, text: { en: "The duplicate copy of the firewall messages", fr: "La copie en double des messages du pare-feu" } }
    answer:
      mapping: { t1: secevent, t2: winevent, t3: csl, t4: syslog }
    explanation:
      correct:
        en: |
          The Windows Security Events via AMA connector writes to `SecurityEvent` for Azure VMs and for Arc-enabled servers alike. Events forwarded through Windows Event Forwarding, including Security events, go to `WindowsEvent`, not `SecurityEvent`. CEF via AMA stores parsed CEF records in `CommonSecurityLog`; because the syslog DCR collects the same facility without a transformation, a second copy of the firewall messages lands in `Syslog`.
        fr: |
          Le connecteur Windows Security Events via AMA écrit dans `SecurityEvent`, pour les machines virtuelles Azure comme pour les serveurs activés par Azure Arc. Les événements transférés par le transfert d'événements Windows, y compris les événements de sécurité, vont dans `WindowsEvent`, pas dans `SecurityEvent`. CEF via AMA stocke les enregistrements CEF analysés dans `CommonSecurityLog` ; comme la DCR syslog collecte la même facility sans transformation, une seconde copie des messages du pare-feu arrive dans `Syslog`.
      options:
        event: { en: "`Event` receives Windows events collected by a DCR created in Azure Monitor, without the Sentinel connectors used here.", fr: "`Event` reçoit les événements Windows collectés par une DCR créée dans Azure Monitor, sans les connecteurs Sentinel utilisés ici." }
        secevent: { en: "Events forwarded to srv-wec1 aren't written to `SecurityEvent`, even when they come from the Security log.", fr: "Les événements transférés à srv-wec1 ne sont pas écrits dans `SecurityEvent`, même lorsqu'ils proviennent du journal Security." }
        csl: { en: "`CommonSecurityLog` holds the copy collected by the CEF rule; the duplicate is the one collected by the syslog rule.", fr: "`CommonSecurityLog` contient la copie collectée par la règle CEF ; le doublon est celle que collecte la règle syslog." }
    references:
      - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
        url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
      - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
        url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-43-08
    objective: "4.2.10"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware, Inc. has Microsoft 365 E5 licenses and uses Microsoft Defender XDR. Proseware doesn't use Microsoft Sentinel.

        Investigators already find SharePoint `FileDownloaded` records when they search the unified audit log from the **Audit** page of the Defender portal. The SOC now needs an advanced hunting query that joins these downloads with `DeviceNetworkEvents` to spot downloads followed by uploads to unknown sites. The following query returns no results, although downloads occurred during the period:

        ```kusto
        CloudAppEvents
        | where Timestamp > ago(7d)
        | where ActionType == "FileDownloaded"
        ```

        You need to ensure that the query returns the SharePoint downloads.

        What should you do?
      fr: |
        Proseware, Inc. dispose de licences Microsoft 365 E5 et utilise Microsoft Defender XDR. Proseware n'utilise pas Microsoft Sentinel.

        Les enquêteurs trouvent déjà des enregistrements SharePoint `FileDownloaded` lorsqu'ils recherchent dans le journal d'audit unifié depuis la page **Audit** du portail Defender. Le SOC a maintenant besoin d'une requête de repérage avancé qui joint ces téléchargements avec `DeviceNetworkEvents` pour repérer les téléchargements suivis de chargements vers des sites inconnus. La requête suivante ne renvoie aucun résultat, bien que des téléchargements aient eu lieu pendant la période :

        ```kusto
        CloudAppEvents
        | where Timestamp > ago(7d)
        | where ActionType == "FileDownloaded"
        ```

        Vous devez faire en sorte que la requête renvoie les téléchargements SharePoint.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true in Exchange Online PowerShell.", fr: "Exécuter Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true dans Exchange Online PowerShell." } }
        - { id: b, text: { en: "Connect the Microsoft 365 app connector in Defender for Cloud Apps with Microsoft 365 activities selected.", fr: "Connecter le connecteur d'application Microsoft 365 dans Defender for Cloud Apps, avec Activités Microsoft 365 sélectionné." } }
        - { id: c, text: { en: "Assign the View-Only Audit Logs role in Microsoft Purview to the SOC analysts who run the query.", fr: "Attribuer le rôle View-Only Audit Logs dans Microsoft Purview aux analystes du SOC qui exécutent la requête." } }
        - { id: d, text: { en: "Replace CloudAppEvents with OfficeActivity and filter on the SharePointFileOperation record type.", fr: "Remplacer CloudAppEvents par OfficeActivity et filtrer sur le type d'enregistrement SharePointFileOperation." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `CloudAppEvents` is populated by Microsoft Defender for Cloud Apps. Office 365 activity appears in it only after the Microsoft 365 app connector is connected in **Settings** > **Cloud apps** > **App connectors** with the **Microsoft 365 activities** component selected. The Audit search works independently of this connector, which explains why investigators see the records there.
        fr: |
          `CloudAppEvents` est alimentée par Microsoft Defender for Cloud Apps. L'activité Office 365 n'y apparaît qu'une fois le connecteur d'application Microsoft 365 connecté dans **Paramètres** > **Applications cloud** > **Connecteurs d'applications**, avec le composant **Activités Microsoft 365** sélectionné. La recherche Audit fonctionne indépendamment de ce connecteur, ce qui explique que les enquêteurs y voient les enregistrements.
      options:
        a: { en: "Audit log ingestion is already on, because the Audit search returns the download records.", fr: "L'ingestion du journal d'audit est déjà activée, puisque la recherche Audit renvoie les enregistrements de téléchargement." }
        c: { en: "Audit roles control the Audit search, not the content of the advanced hunting tables.", fr: "Les rôles d'audit contrôlent la recherche Audit, pas le contenu des tables du repérage avancé." }
        d: { en: "OfficeActivity is filled by the Microsoft Sentinel connector for Microsoft 365, and Proseware has no Sentinel workspace.", fr: "OfficeActivity est alimentée par le connecteur Microsoft Sentinel pour Microsoft 365, et Proseware n'a pas d'espace de travail Sentinel." }
    references:
      - title: CloudAppEvents table in the advanced hunting schema
        url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-cloudappevents-table
      - title: Search the audit log
        url: https://learn.microsoft.com/en-us/purview/audit-search

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-43-09
    objective: "4.2.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. created a DCR-based custom table named **PosEvents_CL** in the Azure portal, with the columns TimeGenerated, StoreId and Action. The portal created a data collection rule named **dcr-pos** from a JSON sample, with the transformation `source`. A point-of-sale application sends records to the Logs Ingestion API by using a Microsoft Entra application that has the Monitoring Metrics Publisher role on dcr-pos.

        The developers add a field named Severity (string) to every record. You add a column named Severity (string) to PosEvents_CL by using **Edit schema**. One day later, new records still arrive, but the Severity column is always empty.

        You need to ensure that Severity is stored. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso, Ltd. a créé une table personnalisée basée sur une DCR nommée **PosEvents_CL** dans le portail Azure, avec les colonnes TimeGenerated, StoreId et Action. Le portail a créé une règle de collecte de données nommée **dcr-pos** à partir d'un exemple JSON, avec la transformation `source`. Une application de point de vente envoie des enregistrements à l'API d'ingestion des journaux au moyen d'une application Microsoft Entra qui a le rôle Monitoring Metrics Publisher sur dcr-pos.

        Les développeurs ajoutent un champ nommé Severity (string) à chaque enregistrement. Vous ajoutez une colonne nommée Severity (string) à PosEvents_CL au moyen de **Modifier le schéma**. Un jour plus tard, de nouveaux enregistrements arrivent toujours, mais la colonne Severity est toujours vide.

        Vous devez faire en sorte que Severity soit stocké. La solution doit réduire l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Delete PosEvents_CL and re-create it from a JSON sample that contains the Severity field.", fr: "Supprimer PosEvents_CL et la recréer à partir d'un exemple JSON qui contient le champ Severity." } }
        - { id: b, text: { en: "Rename the new column Severity_CF so that it is recognized as a custom column.", fr: "Renommer la nouvelle colonne Severity_CF pour qu'elle soit reconnue comme une colonne personnalisée." } }
        - { id: c, text: { en: "Update dcr-pos so that its stream declaration includes the Severity column.", fr: "Mettre à jour dcr-pos pour que sa déclaration de flux inclue la colonne Severity." } }
        - { id: d, text: { en: "Assign the Entra application the Monitoring Contributor role on dcr-pos.", fr: "Attribuer à l'application Entra le rôle Monitoring Contributor sur dcr-pos." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The DCR defines the shape of the incoming stream and how it flows to the table. Azure Monitor doesn't update DCRs automatically when a table schema changes, so dcr-pos still declares only the original fields and Severity never reaches the table. Adding Severity to the stream declaration of dcr-pos (the `source` transformation then passes it through) fixes the problem without touching the table or the application.
        fr: |
          La DCR définit la forme du flux entrant et son acheminement vers la table. Azure Monitor ne met pas à jour automatiquement les DCR quand le schéma d'une table change ; dcr-pos ne déclare donc toujours que les champs d'origine, et Severity n'atteint jamais la table. Ajouter Severity à la déclaration de flux de dcr-pos (la transformation `source` le laisse ensuite passer) corrige le problème sans toucher à la table ni à l'application.
      options:
        a: { en: "Re-creating the table loses the existing data and is more work than updating the DCR, which is the component that drops the field.", fr: "Recréer la table fait perdre les données existantes et demande plus de travail que la mise à jour de la DCR, qui est le composant qui écarte le champ." }
        b: { en: "The `_CF` suffix applies to custom columns added to Azure tables; PosEvents_CL is a custom table, and the DCR would still drop the field.", fr: "Le suffixe `_CF` s'applique aux colonnes personnalisées ajoutées aux tables Azure ; PosEvents_CL est une table personnalisée, et la DCR écarterait toujours le champ." }
        d: { en: "The application already sends successfully with Monitoring Metrics Publisher; a role that edits the DCR doesn't change what the DCR declares.", fr: "L'application envoie déjà correctement avec Monitoring Metrics Publisher ; un rôle permettant de modifier la DCR ne change pas ce que la DCR déclare." }
    references:
      - title: Add or delete tables and columns in Azure Monitor Logs
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
      - title: Logs Ingestion API in Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-ingestion-api-overview

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-43-10
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam, Inc. uses Microsoft Sentinel in the Azure portal; the workspace isn't onboarded to the Microsoft Defender portal. The Microsoft Defender for Cloud solution is installed from the content hub. An administrator named **Admin1** has read and write permissions on the Sentinel workspace.

        Admin1 must connect the following subscriptions by using the **Subscription-based Microsoft Defender for Cloud (Legacy)** connector:

        | Subscription | Microsoft Defender for Cloud plans | SecurityInsights resource provider | Admin1's role on the subscription |
        | --- | --- | --- | --- |
        | Sub-A | Defender for Servers Plan 2 on | Registered | Reader |
        | Sub-B | All plans off (foundational CSPM only) | Registered | Owner |
        | Sub-C | Defender for Storage on | Not registered | Contributor |

        Bi-directional sync isn't required. The solution must follow the principle of least privilege.

        What should be done for each subscription before Admin1 can connect it? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. utilise Microsoft Sentinel dans le portail Azure ; l'espace de travail n'est pas intégré au portail Microsoft Defender. La solution Microsoft Defender for Cloud est installée depuis le hub de contenu. Un administrateur nommé **Admin1** dispose des autorisations de lecture et d'écriture sur l'espace de travail Sentinel.

        Admin1 doit connecter les abonnements suivants au moyen du connecteur **Subscription-based Microsoft Defender for Cloud (Legacy)** :

        | Abonnement | Plans Microsoft Defender for Cloud | Fournisseur de ressources SecurityInsights | Rôle d'Admin1 sur l'abonnement |
        | --- | --- | --- | --- |
        | Sub-A | Defender for Servers Plan 2 activé | Inscrit | Reader |
        | Sub-B | Tous les plans désactivés (CSPM de base uniquement) | Inscrit | Owner |
        | Sub-C | Defender for Storage activé | Non inscrit | Contributor |

        La synchronisation bidirectionnelle n'est pas requise. La solution doit respecter le principe du moindre privilège.

        Que faut-il faire pour chaque abonnement avant qu'Admin1 puisse le connecter ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Sub-A: [[suba]]
          Sub-B: [[subb]]
          Sub-C: [[subc]]
        fr: |
          Sub-A : [[suba]]
          Sub-B : [[subb]]
          Sub-C : [[subc]]
      slots:
        - id: suba
          options:
            - { id: contrib, text: { en: "Assign Admin1 the Contributor role on the subscription.", fr: "Attribuer à Admin1 le rôle Contributor sur l'abonnement." } }
            - { id: secadm, text: { en: "Assign Admin1 the Security Admin role on the subscription.", fr: "Attribuer à Admin1 le rôle Security Admin sur l'abonnement." } }
            - { id: plan, text: { en: "Turn on at least one Defender plan on the subscription.", fr: "Activer au moins un plan Defender sur l'abonnement." } }
            - { id: rp, text: { en: "Register the SecurityInsights resource provider.", fr: "Inscrire le fournisseur de ressources SecurityInsights." } }
            - { id: none, text: { en: "Nothing; the subscription can be connected now.", fr: "Rien ; l'abonnement peut être connecté dès maintenant." } }
        - id: subb
          options:
            - { id: contrib, text: { en: "Assign Admin1 the Contributor role on the subscription.", fr: "Attribuer à Admin1 le rôle Contributor sur l'abonnement." } }
            - { id: secadm, text: { en: "Assign Admin1 the Security Admin role on the subscription.", fr: "Attribuer à Admin1 le rôle Security Admin sur l'abonnement." } }
            - { id: plan, text: { en: "Turn on at least one Defender plan on the subscription.", fr: "Activer au moins un plan Defender sur l'abonnement." } }
            - { id: rp, text: { en: "Register the SecurityInsights resource provider.", fr: "Inscrire le fournisseur de ressources SecurityInsights." } }
            - { id: none, text: { en: "Nothing; the subscription can be connected now.", fr: "Rien ; l'abonnement peut être connecté dès maintenant." } }
        - id: subc
          options:
            - { id: contrib, text: { en: "Assign Admin1 the Contributor role on the subscription.", fr: "Attribuer à Admin1 le rôle Contributor sur l'abonnement." } }
            - { id: secadm, text: { en: "Assign Admin1 the Security Admin role on the subscription.", fr: "Attribuer à Admin1 le rôle Security Admin sur l'abonnement." } }
            - { id: plan, text: { en: "Turn on at least one Defender plan on the subscription.", fr: "Activer au moins un plan Defender sur l'abonnement." } }
            - { id: rp, text: { en: "Register the SecurityInsights resource provider.", fr: "Inscrire le fournisseur de ressources SecurityInsights." } }
            - { id: none, text: { en: "Nothing; the subscription can be connected now.", fr: "Rien ; l'abonnement peut être connecté dès maintenant." } }
    answer:
      values: { suba: contrib, subb: plan, subc: rp }
    explanation:
      correct:
        en: |
          The subscription-based connector requires, for each subscription, the Contributor or Owner role for the person who connects it, at least one enabled Defender plan, and the registered `SecurityInsights` resource provider. Sub-A lacks only the role: Contributor is the least privileged option. Sub-B already has Owner and the provider but no plan, because foundational CSPM isn't a Defender plan. Sub-C has a plan and Contributor but not the provider, which Contributor can register.
        fr: |
          Le connecteur basé sur l'abonnement exige, pour chaque abonnement, le rôle Contributor ou Owner pour la personne qui le connecte, au moins un plan Defender activé et le fournisseur de ressources `SecurityInsights` inscrit. Il ne manque que le rôle sur Sub-A : Contributor est l'option du moindre privilège. Sub-B a déjà Owner et le fournisseur, mais aucun plan, car la CSPM de base n'est pas un plan Defender. Sub-C a un plan et Contributor, mais pas le fournisseur, que Contributor peut inscrire.
      options:
        secadm: { en: "Security Admin on the subscription is needed for bi-directional sync and to enable plans, not to connect the subscription.", fr: "Security Admin sur l'abonnement sert à la synchronisation bidirectionnelle et à l'activation des plans, pas à la connexion de l'abonnement." }
        none: { en: "Each subscription is missing exactly one prerequisite of the connector.", fr: "Il manque exactement un prérequis du connecteur à chaque abonnement." }
    references:
      - title: Ingest Microsoft Defender for Cloud alerts to Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/connect-defender-for-cloud
