chapter: 21-storage-security
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Anonymous access is allowed on a storage account. You need anonymous clients to be able to read a blob of a container when they know its URL, without being able to list the blobs of that container.

        Which anonymous access level should you set on the container?
      fr: |
        L'accès anonyme est autorisé sur un compte de stockage. Vous devez permettre à des clients anonymes de lire un objet blob d'un conteneur quand ils connaissent son URL, sans pouvoir lister les objets blob de ce conteneur.

        Quel niveau d'accès anonyme devez-vous définir sur le conteneur ?
    body:
      options:
        - { id: a, text: Private }
        - { id: b, text: Container }
        - { id: c, text: Blob }
        - { id: d, text: { en: "Off, with a stored access policy", fr: "Off, avec une stratégie d'accès stockée" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The **Blob** level lets anonymous clients read individual blobs by URL, but they can't enumerate the blobs of the container. The level is set on the container, never on a single blob.
        fr: |
          Le niveau **Blob** permet aux clients anonymes de lire des objets blob individuels par leur URL, mais ils ne peuvent pas énumérer les objets blob du conteneur. Le niveau se définit sur le conteneur, jamais sur un objet blob précis.
      options:
        a: { en: "Private (the default) allows no anonymous access at all: every request must be authorized.", fr: "Private (la valeur par défaut) n'autorise aucun accès anonyme : chaque requête doit être autorisée." }
        b: { en: "Container also lets anonymous clients list the blobs of the container, which the requirement forbids.", fr: "Container permet aussi aux clients anonymes de lister les objets blob du conteneur, ce que l'exigence interdit." }
        d: { en: "Off is the PowerShell name of Private; a stored access policy applies to service SAS tokens, which aren't anonymous access.", fr: "Off est le nom PowerShell de Private ; une stratégie d'accès stockée s'applique aux jetons SAS de service, qui ne sont pas un accès anonyme." }
    references:
      - title: Configure anonymous read access for containers and blobs
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-21-02
    objective: "2.1.4"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        An application uses its Microsoft Entra identity to request a user delegation key, which it then uses to sign user delegation SAS tokens for blobs.

        What is the maximum validity period of a user delegation key?
      fr: |
        Une application utilise son identité Microsoft Entra pour demander une clé de délégation d'utilisateur, qu'elle utilise ensuite pour signer des jetons SAS de délégation d'utilisateur pour des objets blob.

        Quelle est la durée de validité maximale d'une clé de délégation d'utilisateur ?
    body:
      options:
        - { id: a, text: { en: "1 hour", fr: "1 heure" } }
        - { id: b, text: { en: "24 hours", fr: "24 heures" } }
        - { id: c, text: { en: "7 days", fr: "7 jours" } }
        - { id: d, text: { en: "30 days", fr: "30 jours" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A user delegation key can be valid for up to seven days. A user delegation SAS must fall within the validity interval of the key that signed it: once the key expires, the SAS fails even if its own expiry time is later.
        fr: |
          Une clé de délégation d'utilisateur peut être valide jusqu'à sept jours. Une SAS de délégation d'utilisateur doit se situer dans l'intervalle de validité de la clé qui l'a signée : une fois la clé expirée, la SAS échoue même si sa propre heure d'expiration est plus tardive.
      options:
        a: { en: "One hour is the recommended maximum lifetime of an ad hoc service SAS, not the limit of a user delegation key.", fr: "Une heure est la durée de vie maximale recommandée pour une SAS de service ad hoc, pas la limite d'une clé de délégation d'utilisateur." }
        b: { en: "A user delegation key can be valid for longer than 24 hours.", fr: "Une clé de délégation d'utilisateur peut être valide plus de 24 heures." }
        d: { en: "30 days exceeds the seven-day maximum of a user delegation key.", fr: "30 jours dépasse le maximum de sept jours d'une clé de délégation d'utilisateur." }
    references:
      - title: Create a user delegation SAS
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. has a storage account named **stcontosoarc** whose public network access is set to **Enabled from selected networks**. On-premises servers in the 10.10.0.0/16 range reach the public endpoint of stcontosoarc through Azure ExpressRoute with Microsoft peering. The connectivity provider translates their traffic to the public range 198.51.100.16/28.

        You need to allow the on-premises servers to access stcontosoarc. What should you do?
      fr: |
        Contoso, Ltd. dispose d'un compte de stockage nommé **stcontosoarc** dont l'accès réseau public est défini sur **Enabled from selected networks** (activé à partir des réseaux sélectionnés). Des serveurs locaux de la plage 10.10.0.0/16 atteignent le point de terminaison public de stcontosoarc par Azure ExpressRoute avec le peering Microsoft. Le fournisseur de connectivité traduit leur trafic vers la plage publique 198.51.100.16/28.

        Vous devez autoriser les serveurs locaux à accéder à stcontosoarc. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add an IP network rule for 10.10.0.0/16.", fr: "Ajouter une règle de réseau IP pour 10.10.0.0/16." } }
        - { id: b, text: { en: "Add an IP network rule for 198.51.100.16/28.", fr: "Ajouter une règle de réseau IP pour 198.51.100.16/28." } }
        - { id: c, text: { en: "Add a virtual network rule for the GatewaySubnet of the ExpressRoute gateway.", fr: "Ajouter une règle de réseau virtuel pour le GatewaySubnet de la passerelle ExpressRoute." } }
        - { id: d, text: { en: "Select the exception for trusted Azure services.", fr: "Sélectionner l'exception pour les services Azure approuvés." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With ExpressRoute Microsoft peering, requests reach the storage account from the NAT public addresses that the provider or the customer uses for that peering. Those public addresses are the ones to allow in IP network rules. A /28 range is accepted; only /31 and /32 prefixes must be entered as single addresses.
        fr: |
          Avec le peering Microsoft d'ExpressRoute, les requêtes atteignent le compte de stockage depuis les adresses publiques NAT que le fournisseur ou le client utilise pour ce peering. Ce sont ces adresses publiques qu'il faut autoriser dans les règles de réseau IP. Une plage /28 est acceptée ; seuls les préfixes /31 et /32 doivent être saisis sous forme d'adresses individuelles.
      options:
        a: { en: "Private ranges defined by RFC 1918 (10, 172.16 to 172.31, 192.168) aren't allowed in IP network rules, and the servers' traffic arrives from the NAT addresses anyway.", fr: "Les plages privées définies par la RFC 1918 (10, 172.16 à 172.31, 192.168) ne sont pas autorisées dans les règles de réseau IP, et le trafic des serveurs arrive de toute façon depuis les adresses NAT." }
        c: { en: "Microsoft peering traffic doesn't come from a subnet of a virtual network, so a virtual network rule doesn't match it.", fr: "Le trafic du peering Microsoft ne provient pas d'un sous-réseau d'un réseau virtuel ; une règle de réseau virtuel ne le reconnaît donc pas." }
        d: { en: "The trusted services exception admits specific Azure services, not on-premises clients.", fr: "L'exception des services approuvés admet certains services Azure, pas des clients locaux." }
    references:
      - title: Firewall rules and network access control for Azure Blob, Data Lake, Queue, and Table Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
      - title: Guidelines and limitations for the Azure Storage firewall
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-21-04
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has a subscription named **Sub-Legacy** on which **Defender for Storage (classic)** was enabled several years ago. The security team now wants blobs uploaded to the storage accounts of Sub-Legacy to be scanned for malware.

        What should you do first?
      fr: |
        Fabrikam, Inc. dispose d'un abonnement nommé **Sub-Legacy** sur lequel **Defender for Storage (classic)** a été activé il y a plusieurs années. L'équipe de sécurité souhaite désormais que les objets blob chargés dans les comptes de stockage de Sub-Legacy soient analysés à la recherche de programmes malveillants.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Turn on sensitive data threat detection in the plan settings of Sub-Legacy.", fr: "Activer la détection des menaces sur les données sensibles dans les paramètres du plan de Sub-Legacy." } }
        - { id: b, text: { en: "Create a diagnostic setting on each storage account that sends blob logs to Log Analytics.", fr: "Créer sur chaque compte de stockage un paramètre de diagnostic qui envoie les journaux blob vers Log Analytics." } }
        - { id: c, text: { en: "Move Sub-Legacy to the Defender for Storage plan billed per storage account.", fr: "Faire passer Sub-Legacy au plan Defender for Storage facturé par compte de stockage." } }
        - { id: d, text: { en: "Enable the Defender CSPM plan on Sub-Legacy.", fr: "Activer le plan Defender CSPM sur Sub-Legacy." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Malware scanning is a paid feature available only in the current Defender for Storage plan, which is billed per protected storage account plus per gigabyte scanned. A subscription on Defender for Storage (classic) must migrate to the current plan to get the current features; malware scanning can then be turned on in the plan settings.
        fr: |
          L'analyse des programmes malveillants est une fonctionnalité payante disponible uniquement dans le plan Defender for Storage actuel, facturé par compte de stockage protégé plus par gigaoctet analysé. Un abonnement sous Defender for Storage (classic) doit migrer vers le plan actuel pour obtenir les fonctionnalités actuelles ; l'analyse des programmes malveillants peut ensuite être activée dans les paramètres du plan.
      options:
        a: { en: "Sensitive data threat detection is also a feature of the current plan, and it finds sensitive data to prioritize alerts; it doesn't scan for malware.", fr: "La détection des menaces sur les données sensibles est aussi une fonctionnalité du plan actuel, et elle repère les données sensibles pour hiérarchiser les alertes ; elle ne recherche pas de programmes malveillants." }
        b: { en: "Defender for Storage doesn't need resource logs, and logs don't scan blob content.", fr: "Defender for Storage n'a pas besoin des journaux de ressources, et les journaux n'analysent pas le contenu des objets blob." }
        d: { en: "Defender CSPM is a posture plan; it doesn't scan uploaded blobs for malware.", fr: "Defender CSPM est un plan de posture ; il n'analyse pas les objets blob chargés à la recherche de programmes malveillants." }
    references:
      - title: What is Microsoft Defender for Storage
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-21-05
    objective: "2.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. has a storage account named **stlitwarehr** that was created in 2022 with the default settings. It doesn't participate in any object replication policy. A security review requires that nobody can configure object replication between stlitwarehr and a storage account in another Microsoft Entra tenant. The other configuration settings of stlitwarehr must remain editable, and existing applications must keep working.

        What should you do?
      fr: |
        Litware, Inc. dispose d'un compte de stockage nommé **stlitwarehr** créé en 2022 avec les paramètres par défaut. Il ne participe à aucune stratégie de réplication d'objets. Une revue de sécurité exige que personne ne puisse configurer de réplication d'objets entre stlitwarehr et un compte de stockage d'un autre locataire Microsoft Entra. Les autres paramètres de configuration de stlitwarehr doivent rester modifiables, et les applications existantes doivent continuer à fonctionner.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Apply a ReadOnly lock to stlitwarehr.", fr: "Poser un verrou ReadOnly sur stlitwarehr." } }
        - { id: b, text: { en: "Set Allow storage account key access to Disabled.", fr: "Définir Allow storage account key access sur Disabled." } }
        - { id: c, text: { en: "Set public network access to Disabled.", fr: "Définir l'accès réseau public sur Disabled." } }
        - { id: d, text: { en: "Clear the Allow cross-tenant replication setting.", fr: "Décocher le paramètre Allow cross-tenant replication." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The `AllowCrossTenantReplication` property, shown as **Allow cross-tenant replication**, controls whether object replication policies can involve an account in another tenant. On an account created before December 15, 2023, the property isn't set, which allows cross-tenant replication; setting it to false blocks it without affecting other settings or clients. It can be set because no cross-tenant policy exists.
        fr: |
          La propriété `AllowCrossTenantReplication`, affichée comme **Allow cross-tenant replication**, détermine si des stratégies de réplication d'objets peuvent impliquer un compte d'un autre locataire. Sur un compte créé avant le 15 décembre 2023, la propriété n'est pas définie, ce qui autorise la réplication entre locataires ; la définir sur false la bloque sans toucher aux autres paramètres ni aux clients. Elle peut être définie car aucune stratégie entre locataires n'existe.
      options:
        a: { en: "A ReadOnly lock blocks every configuration change and the listKeys operation, which breaks the other requirements.", fr: "Un verrou ReadOnly bloque toute modification de configuration et l'opération listKeys, ce qui enfreint les autres exigences." }
        b: { en: "Disabling Shared Key access forces Microsoft Entra authorization and can break existing apps; it doesn't restrict object replication.", fr: "Désactiver l'accès par clé partagée impose l'autorisation Microsoft Entra et peut casser des applications existantes ; il ne restreint pas la réplication d'objets." }
        c: { en: "Disabling public network access only filters network traffic to the public endpoint; it can break existing clients and doesn't control replication policies.", fr: "Désactiver l'accès réseau public filtre seulement le trafic réseau vers le point de terminaison public ; il peut casser des clients existants et ne contrôle pas les stratégies de réplication." }
    references:
      - title: Prevent object replication across Microsoft Entra tenants
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-prevent-cross-tenant-policies

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-21-06
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has a storage account named **stwgfin** in the West Europe region. Public network access is set to **Enabled from selected networks** with the following configuration:

        - A virtual network rule for the subnet **VNet-App/snet-app**, which has the Microsoft.Storage service endpoint.
        - An IP network rule for **131.107.0.0/16**, the public range of the head office.
        - No exceptions.

        A private endpoint for the **blob** sub-resource of stwgfin is deployed in a virtual network named **VNet-Hub**, and its private DNS zone is linked to VNet-Hub.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un compte de stockage nommé **stwgfin** dans la région West Europe. L'accès réseau public est défini sur **Enabled from selected networks** (activé à partir des réseaux sélectionnés) avec la configuration suivante :

        - Une règle de réseau virtuel pour le sous-réseau **VNet-App/snet-app**, qui dispose du point de terminaison de service Microsoft.Storage.
        - Une règle de réseau IP pour **131.107.0.0/16**, la plage publique du siège.
        - Aucune exception.

        Un point de terminaison privé pour la sous-ressource **blob** de stwgfin est déployé dans un réseau virtuel nommé **VNet-Hub**, et sa zone DNS privée est liée à VNet-Hub.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "An administrator who has the Storage Account Contributor role and signs in from her home address, outside 131.107.0.0/16, can add an IP network rule for that address in the Azure portal.", fr: "Une administratrice qui dispose du rôle Storage Account Contributor et se connecte depuis son adresse personnelle, en dehors de 131.107.0.0/16, peut ajouter une règle de réseau IP pour cette adresse dans le portail Azure." }
        - id: s2
          text: { en: "If public network access is set to Disabled, virtual machines in snet-app keep their access to the blobs of stwgfin through the virtual network rule.", fr: "Si l'accès réseau public est défini sur Disabled, les machines virtuelles de snet-app conservent leur accès aux objets blob de stwgfin grâce à la règle de réseau virtuel." }
        - id: s3
          text: { en: "If public network access is set to Disabled, virtual machines in VNet-Hub that have the required data role can still read the blobs of stwgfin.", fr: "Si l'accès réseau public est défini sur Disabled, les machines virtuelles de VNet-Hub qui disposent du rôle de données nécessaire peuvent toujours lire les objets blob de stwgfin." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Storage firewall rules apply only to data plane operations; managing the account through Azure Resource Manager, including editing its network rules, isn't filtered. Disabled rejects all traffic to the public endpoint, and a service endpoint still targets the public endpoint, so the virtual network rule no longer grants access. A private endpoint gives the account a private address in VNet-Hub and keeps working when public network access is disabled; authorization still applies.
        fr: |
          Les règles du pare-feu de stockage s'appliquent uniquement aux opérations du plan de données ; la gestion du compte par Azure Resource Manager, y compris la modification de ses règles réseau, n'est pas filtrée. Disabled rejette tout le trafic vers le point de terminaison public, et un point de terminaison de service cible toujours le point de terminaison public : la règle de réseau virtuel n'accorde donc plus l'accès. Un point de terminaison privé donne au compte une adresse privée dans VNet-Hub et continue de fonctionner quand l'accès réseau public est désactivé ; l'autorisation s'applique toujours.
    references:
      - title: Guidelines and limitations for the Azure Storage firewall
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
      - title: Set the default public network access rule for an Azure Storage account
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-set-default-access

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-21-07
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a storage account named **stnwcatalog** that allows Shared Key authorization. Three distributors must list and read the blobs of a container named **price-lists** for the next 30 days.

        You need to meet the following requirements:

        - You can revoke the access of one distributor at any time without affecting the other two.
        - Revoking access must not require regenerating an account key, because internal applications use both keys.

        What should you do?
      fr: |
        Northwind Traders dispose d'un compte de stockage nommé **stnwcatalog** qui autorise l'autorisation par clé partagée (Shared Key). Trois distributeurs doivent lister et lire les objets blob d'un conteneur nommé **price-lists** pendant les 30 prochains jours.

        Vous devez répondre aux exigences suivantes :

        - Vous pouvez révoquer à tout moment l'accès d'un distributeur sans affecter les deux autres.
        - La révocation ne doit pas exiger la régénération d'une clé de compte, car des applications internes utilisent les deux clés.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Issue each distributor its own user delegation SAS for price-lists that expires in 30 days.", fr: "Remettre à chaque distributeur sa propre SAS de délégation d'utilisateur pour price-lists qui expire dans 30 jours." } }
        - { id: b, text: { en: "Create one stored access policy on price-lists, and issue each distributor a service SAS based on it.", fr: "Créer une stratégie d'accès stockée sur price-lists, et remettre à chaque distributeur une SAS de service fondée sur elle." } }
        - { id: c, text: { en: "Create three stored access policies on price-lists, and issue each distributor a service SAS based on a different one.", fr: "Créer trois stratégies d'accès stockées sur price-lists, et remettre à chaque distributeur une SAS de service fondée sur une stratégie différente." } }
        - { id: d, text: { en: "Issue each distributor an account SAS for the Blob service that is valid for 30 days and limited to price-lists.", fr: "Remettre à chaque distributeur une SAS de compte pour le service Blob valide 30 jours et limitée à price-lists." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A service SAS that references a stored access policy is revoked by deleting the policy, renaming its identifier or moving its expiry time to the past, with no key rotation. With one policy per distributor (a container accepts up to five), each distributor's tokens can be revoked separately.
        fr: |
          Une SAS de service qui référence une stratégie d'accès stockée se révoque en supprimant la stratégie, en renommant son identificateur ou en plaçant son heure d'expiration dans le passé, sans rotation de clé. Avec une stratégie par distributeur (un conteneur en accepte jusqu'à cinq), les jetons de chaque distributeur peuvent être révoqués séparément.
      options:
        a: { en: "A user delegation SAS can't outlive its user delegation key, which is valid for seven days at most, so it can't last 30 days.", fr: "Une SAS de délégation d'utilisateur ne peut pas survivre à sa clé de délégation d'utilisateur, valide sept jours au plus : elle ne peut donc pas durer 30 jours." }
        b: { en: "A single shared policy can only revoke the tokens of all three distributors at once.", fr: "Une seule stratégie partagée ne peut révoquer que les jetons des trois distributeurs en même temps." }
        d: { en: "An account SAS can't reference a stored access policy, and it can't be scoped to a single container; revoking it requires regenerating the key that signed it.", fr: "Une SAS de compte ne peut pas référencer de stratégie d'accès stockée et ne peut pas être limitée à un seul conteneur ; la révoquer exige de régénérer la clé qui l'a signée." }
    references:
      - title: Define a stored access policy
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
      - title: Create a user delegation SAS
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-21-08
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum Corporation has a subscription named **Sub-Media** that contains 20 general-purpose v2 storage accounts, including one named **stadmedia**. Defender for Storage is enabled at the subscription level with on-upload malware scanning. In the plan settings of Sub-Media, the monthly malware scanning cap is set to **5,000 GB**. No storage account overrides the subscription settings.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation dispose d'un abonnement nommé **Sub-Media** qui contient 20 comptes de stockage usage général v2, dont un nommé **stadmedia**. Defender for Storage est activé au niveau de l'abonnement avec l'analyse des programmes malveillants au chargement. Dans les paramètres du plan de Sub-Media, le plafond mensuel d'analyse des programmes malveillants est défini à **5 000 Go**. Aucun compte de stockage ne remplace les paramètres de l'abonnement.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A 60 GB block blob uploaded to stadmedia is scanned for malware on upload.", fr: "Un objet blob de blocs de 60 Go chargé dans stadmedia est analysé à la recherche de programmes malveillants au chargement." }
        - id: s2
          text: { en: "You can run an on-demand malware scan of stadmedia limited to the blobs whose path starts with invoices/2026/.", fr: "Vous pouvez lancer une analyse des programmes malveillants à la demande sur stadmedia limitée aux objets blob dont le chemin commence par invoices/2026/." }
        - id: s3
          text: { en: "The 20 storage accounts share a combined total of 5,000 GB of malware scanning per month.", fr: "Les 20 comptes de stockage se partagent un total cumulé de 5 000 Go d'analyse des programmes malveillants par mois." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Malware scanning handles blobs and files up to 50 GB, so a 60 GB blob isn't scanned. On-demand scanning can target the whole account, a container, a single blob or the objects that match a path prefix. A cap set at the subscription level is allocated to every storage account of the subscription: each account can scan up to 5,000 GB a month.
        fr: |
          L'analyse des programmes malveillants traite les objets blob et les fichiers jusqu'à 50 Go : un objet blob de 60 Go n'est donc pas analysé. L'analyse à la demande peut cibler tout le compte, un conteneur, un seul objet blob ou les objets qui correspondent à un préfixe de chemin. Un plafond défini au niveau de l'abonnement est attribué à chaque compte de stockage de l'abonnement : chaque compte peut analyser jusqu'à 5 000 Go par mois.
    references:
      - title: Introduction to malware scanning
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/introduction-malware-scanning
      - title: On-upload malware scanning
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/on-upload-malware-scanning

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-21-09
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam, Inc. is writing a Bicep file that creates a new general-purpose v2 storage account named **stfabhr001**. A user-assigned managed identity named **id-st-hr** already has the permissions it needs on an RSA key named **key-hr** in a key vault named **kv-fab-hr**. The account must meet the following requirements:

        - Blob, Azure Files and Queue data are encrypted with key-hr.
        - Table data stays encrypted with Microsoft-managed keys, to avoid the different billing rate of Table storage that uses the account key.
        - The data is encrypted at rest twice, at the service level and at the infrastructure level.

        How should you complete the file? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam, Inc. rédige un fichier Bicep qui crée un nouveau compte de stockage usage général v2 nommé **stfabhr001**. Une identité managée affectée par l'utilisateur nommée **id-st-hr** dispose déjà des autorisations nécessaires sur une clé RSA nommée **key-hr** dans un coffre de clés nommé **kv-fab-hr**. Le compte doit répondre aux exigences suivantes :

        - Les données Blob, Azure Files et Queue sont chiffrées avec key-hr.
        - Les données Table restent chiffrées avec des clés gérées par Microsoft, pour éviter le tarif différent du stockage Table qui utilise la clé du compte.
        - Les données sont chiffrées deux fois au repos, au niveau du service et au niveau de l'infrastructure.

        Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bicep
      template: |
        resource uami 'Microsoft.ManagedIdentity/userAssignedIdentities@2023-01-31' existing = {
          name: 'id-st-hr'
        }

        resource st 'Microsoft.Storage/storageAccounts@2023-05-01' = {
          name: 'stfabhr001'
          location: resourceGroup().location
          sku: { name: 'Standard_ZRS' }
          kind: 'StorageV2'
          identity: {
            type: 'UserAssigned'
            userAssignedIdentities: { '${uami.id}': {} }
          }
          properties: {
            encryption: {
              [[infra]]: true
              keySource: [[keysrc]]
              identity: { userAssignedIdentity: uami.id }
              keyvaultproperties: {
                keyvaulturi: 'https://kv-fab-hr.vault.azure.net/'
                keyname: 'key-hr'
              }
              services: {
                blob: { enabled: true, keyType: 'Account' }
                file: { enabled: true, keyType: 'Account' }
                queue: { enabled: true, keyType: [[qkey]] }
                table: { enabled: true, keyType: [[tkey]] }
              }
            }
          }
        }
      slots:
        - id: infra
          options:
            - { id: req, text: requireInfrastructureEncryption }
            - { id: https, text: supportsHttpsTrafficOnly }
            - { id: oauth, text: defaultToOAuthAuthentication }
        - id: keysrc
          options:
            - { id: storage, text: "'Microsoft.Storage'" }
            - { id: keyvault, text: "'Microsoft.Keyvault'" }
        - id: qkey
          options:
            - { id: account, text: "'Account'" }
            - { id: service, text: "'Service'" }
        - id: tkey
          options:
            - { id: account, text: "'Account'" }
            - { id: service, text: "'Service'" }
    answer:
      values: { infra: req, keysrc: keyvault, qkey: account, tkey: service }
    explanation:
      correct:
        en: |
          `requireInfrastructureEncryption: true` adds the second, infrastructure-level layer of encryption, and it can only be set when the account is created. `keySource: 'Microsoft.Keyvault'` uses the customer-managed key described in `keyvaultproperties`. Blob and Azure Files always use the account-scoped key; Queue and Table use it only if `keyType` is `'Account'` at creation, so Queue gets `'Account'` and Table keeps `'Service'`, which stays on Microsoft-managed keys. This scope can't be changed after creation.
        fr: |
          `requireInfrastructureEncryption: true` ajoute la seconde couche de chiffrement, au niveau de l'infrastructure, et ne peut être défini qu'à la création du compte. `keySource: 'Microsoft.Keyvault'` utilise la clé gérée par le client décrite dans `keyvaultproperties`. Blob et Azure Files utilisent toujours la clé de l'étendue du compte ; Queue et Table ne l'utilisent que si `keyType` vaut `'Account'` à la création : Queue reçoit donc `'Account'` et Table garde `'Service'`, qui reste sur des clés gérées par Microsoft. Cette étendue ne peut pas être modifiée après la création.
      options:
        https: { en: "`supportsHttpsTrafficOnly` is the secure transfer setting, a top-level property; it isn't a layer of encryption at rest.", fr: "`supportsHttpsTrafficOnly` est le paramètre de transfert sécurisé, une propriété de premier niveau ; ce n'est pas une couche de chiffrement au repos." }
        oauth: { en: "`defaultToOAuthAuthentication` makes the portal use Microsoft Entra authorization; it has nothing to do with encryption.", fr: "`defaultToOAuthAuthentication` fait utiliser l'autorisation Microsoft Entra par le portail ; il n'a aucun rapport avec le chiffrement." }
        storage: { en: "'Microsoft.Storage' means Microsoft-managed keys: key-hr wouldn't be used.", fr: "'Microsoft.Storage' signifie des clés gérées par Microsoft : key-hr ne serait pas utilisée." }
    references:
      - title: Create an account that supports customer-managed keys for tables and queues
        url: https://learn.microsoft.com/en-us/azure/storage/common/account-encryption-key-create
      - title: Microsoft.Storage storageAccounts
        url: https://learn.microsoft.com/en-us/azure/templates/microsoft.storage/storageaccounts

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-21-10
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Tailspin Toys has a storage account named **sttailreports** that contains a container named **reports**. Shared Key access is disabled on sttailreports. The following table shows the role assignments of four managed identities.

        Answer the two questions in the answer area by selecting one identity for each.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose d'un compte de stockage nommé **sttailreports** qui contient un conteneur nommé **reports**. L'accès par clé partagée est désactivé sur sttailreports. Le tableau suivant présente les attributions de rôles de quatre identités managées.

        Répondez aux deux questions de la zone de réponse en sélectionnant une identité pour chacune.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "Which identity can issue a user delegation SAS that lets a partner upload blobs to reports?", fr: "Quelle identité peut émettre une SAS de délégation d'utilisateur qui permet à un partenaire de charger des objets blob dans reports ?" }
        - id: p2
          text: { en: "Which identity can read the blobs of reports with its own identity, but fails to obtain a user delegation key?", fr: "Quelle identité peut lire les objets blob de reports avec sa propre identité, mais échoue à obtenir une clé de délégation d'utilisateur ?" }
      grid:
        header: [{ en: "Identity", fr: "Identité" }, { en: "Role", fr: "Rôle" }, { en: "Scope", fr: "Étendue" }]
        rows:
          - [{ text: id-ops, area: i1 }, { text: "Storage Blob Delegator + Storage Blob Data Reader" }, { text: { en: "sttailreports + container reports", fr: "sttailreports + conteneur reports" } }]
          - [{ text: id-etl, area: i2 }, { text: "Storage Blob Data Contributor" }, { text: { en: "Container reports", fr: "Conteneur reports" } }]
          - [{ text: id-app, area: i3 }, { text: "Storage Blob Delegator + Storage Blob Data Contributor" }, { text: { en: "sttailreports + container reports", fr: "sttailreports + conteneur reports" } }]
          - [{ text: id-adm, area: i4 }, { text: "Storage Account Contributor" }, { text: sttailreports }]
    answer:
      values: { p1: i3, p2: i2 }
    explanation:
      correct:
        en: |
          Requesting a user delegation key is an account-level operation, so the `generateUserDelegationKey` action must be granted at the storage account scope or above, here by Storage Blob Delegator. The permissions of a user delegation SAS are the intersection of the SAS permissions and the creator's own permissions: id-app can write to reports, so its SAS can allow uploads, whereas a SAS from id-ops is limited to reading. id-etl reads and writes reports through its container-scoped role, but that scope doesn't let it obtain a user delegation key. id-adm manages the account but holds no blob data role, and with Shared Key disabled it can't fall back on the keys.
        fr: |
          Demander une clé de délégation d'utilisateur est une opération au niveau du compte : l'action `generateUserDelegationKey` doit donc être accordée à l'étendue du compte de stockage ou au-dessus, ici par Storage Blob Delegator. Les autorisations d'une SAS de délégation d'utilisateur sont l'intersection des autorisations de la SAS et des autorisations de son créateur : id-app peut écrire dans reports, sa SAS peut donc autoriser des chargements, alors qu'une SAS émise par id-ops est limitée à la lecture. id-etl lit et écrit dans reports grâce à son rôle limité au conteneur, mais cette étendue ne lui permet pas d'obtenir une clé de délégation d'utilisateur. id-adm gère le compte mais ne détient aucun rôle de données blob, et avec la clé partagée désactivée, il ne peut pas se rabattre sur les clés.
    references:
      - title: Create a user delegation SAS
        url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas
