chapter: 42-sentinel-workspace
questions:
  # ------------------------------------------------------------------ 1
  - id: sc500-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso uses Microsoft Sentinel on a Log Analytics workspace named **law-soc**, which is managed from the Azure portal. The SOC must work with law-soc in the Microsoft Defender portal, and law-soc must become the primary workspace.

        Where should you start the connection?
      fr: |
        Contoso utilise Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-soc**, géré depuis le portail Azure. Le SOC doit travailler avec law-soc dans le portail Microsoft Defender, et law-soc doit devenir l'espace de travail principal.

        Où devez-vous lancer la connexion ?
    body:
      options:
        - { id: a, text: { en: "In the Azure portal, in Microsoft Sentinel > Settings > Workspace settings of law-soc", fr: "Dans le portail Azure, dans Microsoft Sentinel > Paramètres > Paramètres de l'espace de travail de law-soc" } }
        - { id: b, text: { en: "In the Defender portal, in Data & connectors > Tables, by selecting law-soc", fr: "Dans le portail Defender, dans Données et connecteurs > Tables, en sélectionnant law-soc" } }
        - { id: c, text: { en: "In the Defender portal, in System > Settings > Microsoft Sentinel > Connect a workspace", fr: "Dans le portail Defender, dans Système > Paramètres > Microsoft Sentinel > Connecter un espace de travail" } }
        - { id: d, text: { en: "In the Azure portal, in the Properties page of law-soc, by selecting its Defender tenant", fr: "Dans le portail Azure, dans la page Propriétés de law-soc, en sélectionnant son locataire Defender" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A workspace is connected from the Defender portal: **System** > **Settings** > **Microsoft Sentinel** > **Connect a workspace**, where you select the workspaces, choose the primary workspace and select **Connect**. This matters because Microsoft Sentinel is no longer supported in the Azure portal after March 31, 2027.
        fr: |
          Un espace de travail se connecte depuis le portail Defender : **Système** > **Paramètres** > **Microsoft Sentinel** > **Connecter un espace de travail**, où vous sélectionnez les espaces de travail, choisissez l'espace de travail principal, puis sélectionnez **Connecter**. C'est important, car Microsoft Sentinel n'est plus pris en charge dans le portail Azure après le 31 mars 2027.
      options:
        a: { en: "The connection to the Defender portal isn't set from the Sentinel settings in the Azure portal.", fr: "La connexion au portail Defender ne se règle pas depuis les paramètres de Sentinel dans le portail Azure." }
        b: { en: "Data & connectors > Tables is where you set the retention of the tables of a workspace that is already connected.", fr: "Données et connecteurs > Tables est l'endroit où vous réglez la rétention des tables d'un espace de travail déjà connecté." }
        d: { en: "A Log Analytics workspace has no setting in its Properties page that connects it to the Defender portal.", fr: "Un espace de travail Log Analytics n'a dans sa page Propriétés aucun paramètre qui le connecte au portail Defender." }
    references:
      - title: Connect Microsoft Sentinel to the Microsoft Defender portal
        url: https://learn.microsoft.com/en-us/unified-secops/microsoft-sentinel-onboard

  # ------------------------------------------------------------------ 2
  - id: sc500-qz-42-02
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses Microsoft Sentinel with the Microsoft Sentinel data lake. A threat analyst named **Analyst1** must create scheduled KQL jobs that write their results to data lake tables.

        You need to assign a Microsoft Entra role to Analyst1. The solution must follow the principle of least privilege.

        Which role should you assign?
      fr: |
        Fabrikam utilise Microsoft Sentinel avec le data lake Microsoft Sentinel. Un analyste des menaces nommé **Analyst1** doit créer des travaux KQL planifiés qui écrivent leurs résultats dans des tables du data lake.

        Vous devez attribuer un rôle Microsoft Entra à Analyst1. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer ?
    body:
      options:
        - { id: a, text: Security Reader }
        - { id: b, text: Global Reader }
        - { id: c, text: Security Administrator }
        - { id: d, text: Security Operator }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Writing to data lake tables and managing data lake jobs requires Security Operator, Security Administrator or Global Administrator in Microsoft Entra ID. Security Operator is the least privileged of these roles.
        fr: |
          L'écriture dans les tables du data lake et la gestion des travaux du data lake exigent Security Operator, Security Administrator ou Global Administrator dans Microsoft Entra ID. Security Operator est le moins privilégié de ces rôles.
      options:
        a: { en: "Security Reader gives read access to the data lake of every workspace, but it can't write tables or create jobs.", fr: "Security Reader donne un accès en lecture au data lake de tous les espaces de travail, mais il ne peut ni écrire de tables ni créer de travaux." }
        b: { en: "Global Reader is also a read-only role for the data lake.", fr: "Global Reader est lui aussi un rôle en lecture seule pour le data lake." }
        c: { en: "Security Administrator can manage the jobs, but it grants many more permissions than Security Operator.", fr: "Security Administrator peut gérer les travaux, mais il accorde beaucoup plus d'autorisations que Security Operator." }
    references:
      - title: Roles and permissions in the Microsoft Sentinel platform
        url: https://learn.microsoft.com/en-us/azure/sentinel/roles

  # ------------------------------------------------------------------ 3
  - id: sc500-qz-42-03
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum uses Microsoft Sentinel. A solution in the content hub contains a data connector, 14 analytics rule templates, 3 workbooks and 6 hunting queries. The detection team needs only one of the analytics rule templates of this solution. The solution isn't installed.

        You need to create an analytics rule from that template. What should you do?
      fr: |
        Adatum utilise Microsoft Sentinel. Une solution du hub de contenu contient un connecteur de données, 14 modèles de règles d'analyse, 3 classeurs et 6 requêtes de chasse. L'équipe de détection n'a besoin que d'un seul des modèles de règles d'analyse de cette solution. La solution n'est pas installée.

        Vous devez créer une règle d'analyse à partir de ce modèle. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select only that template in the list view of the content hub, select Install/Update, and then create the rule.", fr: "Sélectionner uniquement ce modèle dans la vue liste du hub de contenu, sélectionner Installer/Mettre à jour, puis créer la règle." } }
        - { id: b, text: { en: "Install the entire solution, and then create the rule from the template on the Manage page of the solution.", fr: "Installer la solution entière, puis créer la règle à partir du modèle sur la page Gérer de la solution." } }
        - { id: c, text: { en: "Create the rule from the Rule templates tab of the Analytics page, where the templates are available without any installation.", fr: "Créer la règle depuis l'onglet Rule templates de la page Analytics, où les modèles sont disponibles sans aucune installation." } }
        - { id: d, text: { en: "Configure the data connector of the solution, and then wait for the template to be added to the workspace with the first data.", fr: "Configurer le connecteur de données de la solution, puis attendre que le modèle soit ajouté à l'espace de travail avec les premières données." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          To use a content item that belongs to a solution, you must install the entire solution. Installing it adds templates, not active content: you then open the analytics rule template from the Manage page and select **Create rule**.
        fr: |
          Pour utiliser un élément de contenu qui appartient à une solution, vous devez installer la solution entière. Son installation ajoute des modèles, pas du contenu actif : vous ouvrez ensuite le modèle de règle d'analyse depuis la page Gérer et sélectionnez **Créer une règle**.
      options:
        a: { en: "Selecting one item of a solution in the list view leads to installing its whole solution: a single template can't be installed alone.", fr: "Sélectionner un élément d'une solution dans la vue liste mène à l'installation de toute sa solution : un modèle seul ne peut pas être installé." }
        c: { en: "The templates of a solution appear in the template gallery only after the solution is installed.", fr: "Les modèles d'une solution n'apparaissent dans la galerie de modèles qu'après l'installation de la solution." }
        d: { en: "Data connectors are themselves delivered by the solution; configuring a connector never installs the other content of a solution.", fr: "Les connecteurs de données sont eux-mêmes fournis par la solution ; configurer un connecteur n'installe jamais le reste du contenu d'une solution." }
    references:
      - title: Discover and manage Microsoft Sentinel out-of-the-box content
        url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions-deploy

  # ------------------------------------------------------------------ 4
  - id: sc500-qz-42-04
    objective: "4.2.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware uses Microsoft Sentinel on a workspace named **law-lit**. A custom table named **AppTrace_CL** uses the Basic plan. Analysts must be able to run interactive queries on the last 60 days of AppTrace_CL. When you open the retention settings of the table, the analytics retention can't be changed.

        What should you do?
      fr: |
        Litware utilise Microsoft Sentinel sur un espace de travail nommé **law-lit**. Une table personnalisée nommée **AppTrace_CL** utilise le plan Basic. Les analystes doivent pouvoir exécuter des requêtes interactives sur les 60 derniers jours d'AppTrace_CL. Quand vous ouvrez les paramètres de rétention de la table, la rétention d'analyse ne peut pas être modifiée.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the total retention of AppTrace_CL to 60 days, and keep the Basic plan.", fr: "Définir la rétention totale d'AppTrace_CL sur 60 jours, et conserver le plan Basic." } }
        - { id: b, text: { en: "Set the default retention of law-lit to 60 days, and keep the Basic plan.", fr: "Définir la rétention par défaut de law-lit sur 60 jours, et conserver le plan Basic." } }
        - { id: c, text: { en: "Restore the last 60 days of AppTrace_CL every week to a table whose name ends with _RST.", fr: "Restaurer chaque semaine les 60 derniers jours d'AppTrace_CL dans une table dont le nom se termine par _RST." } }
        - { id: d, text: { en: "Change the plan of AppTrace_CL to Analytics, and then set its analytics retention to 60 days.", fr: "Faire passer AppTrace_CL au plan Analytics, puis définir sa rétention d'analyse sur 60 jours." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A Basic table has a fixed 30-day query window, and only its total retention can be configured. To query 60 days interactively, the table must use the Analytics plan, whose analytics retention can be set per table.
        fr: |
          Une table Basic a une fenêtre de requête fixe de 30 jours, et seule sa rétention totale est configurable. Pour interroger 60 jours de façon interactive, la table doit utiliser le plan Analytics, dont la rétention d'analyse se règle par table.
      options:
        a: { en: "Total retention keeps the data longer, but a Basic table stays queryable interactively for 30 days only.", fr: "La rétention totale conserve les données plus longtemps, mais une table Basic ne reste interrogeable de façon interactive que pendant 30 jours." }
        b: { en: "The workspace default retention applies only to Analytics tables that use the default; it doesn't govern Basic tables.", fr: "La rétention par défaut de l'espace de travail s'applique uniquement aux tables Analytics qui utilisent la valeur par défaut ; elle ne régit pas les tables Basic." }
        c: { en: "A weekly restore adds cost and effort and creates a separate table each time; it's meant for occasional access to long-term data.", fr: "Une restauration hebdomadaire ajoute coût et effort et crée une table distincte à chaque fois ; elle sert à un accès occasionnel aux données à long terme." }
    references:
      - title: Manage data retention in a Log Analytics workspace
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-retention-configure

  # ------------------------------------------------------------------ 5
  - id: sc500-qz-42-05
    objective: "4.2.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys uses Microsoft Sentinel. An engineer created a workflow named **wf-ticket** in a Standard logic app named **la-soc** and selected the stateless workflow type. The Microsoft Sentinel service account has the Microsoft Sentinel Automation Contributor role on the resource group of la-soc. la-soc doesn't use private endpoints.

        wf-ticket can't be used as a playbook. The playbook must stay in la-soc. What should you do?
      fr: |
        Tailspin Toys utilise Microsoft Sentinel. Un ingénieur a créé un workflow nommé **wf-ticket** dans une application logique Standard nommée **la-soc** et a choisi le type de workflow sans état. Le compte de service Microsoft Sentinel a le rôle Microsoft Sentinel Automation Contributor sur le groupe de ressources de la-soc. la-soc n'utilise pas de points de terminaison privés.

        wf-ticket ne peut pas être utilisé comme playbook. Le playbook doit rester dans la-soc. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Define an access restriction policy on la-soc so that Microsoft Sentinel can call its workflows.", fr: "Définir une stratégie de restriction d'accès sur la-soc pour que Microsoft Sentinel puisse appeler ses workflows." } }
        - { id: b, text: { en: "Create the workflow again in la-soc from a Microsoft Sentinel playbook template of the content hub.", fr: "Recréer le workflow dans la-soc à partir d'un modèle de playbook Microsoft Sentinel du hub de contenu." } }
        - { id: c, text: { en: "Create the workflow again in la-soc as a stateful workflow with a Microsoft Sentinel trigger.", fr: "Recréer le workflow dans la-soc comme workflow avec état doté d'un déclencheur Microsoft Sentinel." } }
        - { id: d, text: { en: "Assign the Microsoft Sentinel Playbook Operator role on la-soc to the Microsoft Sentinel service account.", fr: "Attribuer le rôle Microsoft Sentinel Playbook Operator sur la-soc au compte de service Microsoft Sentinel." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft Sentinel supports Standard logic apps, but only stateful workflows: stateless workflows aren't supported. Recreating wf-ticket as a stateful workflow that starts with a Microsoft Sentinel trigger keeps it in la-soc and makes it usable as a playbook.
        fr: |
          Microsoft Sentinel prend en charge les applications logiques Standard, mais uniquement les workflows avec état : les workflows sans état ne sont pas pris en charge. Recréer wf-ticket comme workflow avec état qui commence par un déclencheur Microsoft Sentinel le garde dans la-soc et le rend utilisable comme playbook.
      options:
        a: { en: "An access restriction policy is required only when the Standard logic app uses private endpoints, which isn't the case.", fr: "Une stratégie de restriction d'accès n'est exigée que si l'application logique Standard utilise des points de terminaison privés, ce qui n'est pas le cas." }
        b: { en: "Playbook templates aren't supported with Standard logic apps: their workflows are created manually.", fr: "Les modèles de playbook ne sont pas pris en charge avec les applications logiques Standard : leurs workflows se créent manuellement." }
        d: { en: "Playbook Operator is a role for users who run playbooks manually; the service account already has the role it needs.", fr: "Playbook Operator est un rôle pour les utilisateurs qui exécutent des playbooks manuellement ; le compte de service a déjà le rôle dont il a besoin." }
    references:
      - title: Azure Logic Apps for Microsoft Sentinel playbooks
        url: https://learn.microsoft.com/en-us/azure/sentinel/automation/logic-apps-playbooks

  # ------------------------------------------------------------------ 6
  - id: sc500-qz-42-06
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has an Azure subscription named **Sub-SOC**. Sub-SOC contains two resource groups: **RG-SOC-EU** with a Microsoft Sentinel workspace named **law-eu**, and **RG-SOC-US** with a Microsoft Sentinel workspace named **law-us**. law-eu is already connected to the Microsoft Defender portal as the primary workspace.

        An engineer named **User1** has the Microsoft Sentinel Contributor role on RG-SOC-US and no other role, in Azure or in Microsoft Entra ID. User1 must connect law-us to the Defender portal as a secondary workspace.

        You need to grant User1 the missing permissions. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Northwind Traders dispose d'un abonnement Azure nommé **Sub-SOC**. Sub-SOC contient deux groupes de ressources : **RG-SOC-EU** avec un espace de travail Microsoft Sentinel nommé **law-eu**, et **RG-SOC-US** avec un espace de travail Microsoft Sentinel nommé **law-us**. law-eu est déjà connecté au portail Microsoft Defender comme espace de travail principal.

        Un ingénieur nommé **User1** a le rôle Microsoft Sentinel Contributor sur RG-SOC-US et aucun autre rôle, ni dans Azure ni dans Microsoft Entra ID. User1 doit connecter law-us au portail Defender comme espace de travail secondaire.

        Vous devez accorder à User1 les autorisations manquantes. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign User1 the User Access Administrator role on RG-SOC-US.", fr: "Attribuer à User1 le rôle User Access Administrator sur RG-SOC-US." } }
        - { id: b, text: { en: "Assign User1 the User Access Administrator role on Sub-SOC.", fr: "Attribuer à User1 le rôle User Access Administrator sur Sub-SOC." } }
        - { id: c, text: { en: "Assign User1 the Security Administrator role in Microsoft Entra ID.", fr: "Attribuer à User1 le rôle Security Administrator dans Microsoft Entra ID." } }
        - { id: d, text: { en: "Assign User1 the Owner role on Sub-SOC.", fr: "Attribuer à User1 le rôle Owner sur Sub-SOC." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Connecting or disconnecting a secondary workspace requires Owner, or User Access Administrator together with Microsoft Sentinel Contributor. User1 already has Microsoft Sentinel Contributor, which can be held at the resource group, but User Access Administrator must be assigned at the subscription.
        fr: |
          Connecter ou déconnecter un espace de travail secondaire exige Owner, ou User Access Administrator avec Microsoft Sentinel Contributor. User1 a déjà Microsoft Sentinel Contributor, qui peut être détenu sur le groupe de ressources, mais User Access Administrator doit être attribué sur l'abonnement.
      options:
        a: { en: "The scope of User Access Administrator for this task is the subscription; an assignment on the resource group isn't enough.", fr: "L'étendue de User Access Administrator pour cette tâche est l'abonnement ; une attribution sur le groupe de ressources ne suffit pas." }
        c: { en: "Security Administrator is part of the requirements for the primary workspace; it doesn't give the Azure permissions needed to connect a secondary workspace.", fr: "Security Administrator fait partie des exigences pour l'espace de travail principal ; il ne donne pas les autorisations Azure nécessaires pour connecter un espace de travail secondaire." }
        d: { en: "Owner on the subscription also works, but it grants full control of every resource: User Access Administrator, added to the existing role, is enough.", fr: "Owner sur l'abonnement fonctionne aussi, mais il donne le contrôle total de toutes les ressources : User Access Administrator, ajouté au rôle existant, suffit." }
    references:
      - title: Multiple workspaces - Microsoft Sentinel in Defender portal
        url: https://learn.microsoft.com/en-us/azure/sentinel/workspaces-defender-portal

  # ------------------------------------------------------------------ 7
  - id: sc500-qz-42-07
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has a single Microsoft Entra tenant. Two Microsoft Sentinel workspaces are connected to the Microsoft Defender portal: **law-hq** is the primary workspace and **law-branch** is a secondary workspace. The Microsoft Defender XDR connector is enabled.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un seul locataire Microsoft Entra. Deux espaces de travail Microsoft Sentinel sont connectés au portail Microsoft Defender : **law-hq** est l'espace de travail principal et **law-branch** un espace de travail secondaire. Le connecteur Microsoft Defender XDR est activé.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "An incident created from an analytics rule of law-branch can include alerts from Microsoft Defender XDR.", fr: "Un incident créé à partir d'une règle d'analyse de law-branch peut inclure des alertes de Microsoft Defender XDR." }
        - id: s2
          text: { en: "If you set law-branch as the primary workspace, the Defender XDR connector moves to law-branch automatically.", fr: "Si vous définissez law-branch comme espace de travail principal, le connecteur Defender XDR passe automatiquement à law-branch." }
        - id: s3
          text: { en: "Detection engineers can create custom detections in the Defender portal that run on the data of law-branch.", fr: "Les ingénieurs de détection peuvent créer dans le portail Defender des détections personnalisées qui s'exécutent sur les données de law-branch." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Only the primary workspace is correlated with Defender XDR: incidents of a secondary workspace contain only that workspace's data (No). When you change the primary workspace, the Defender XDR connector is moved to the new primary and disconnected from the former one automatically (Yes). Creating custom detections and API queries are limited to the primary workspace (No).
        fr: |
          Seul l'espace de travail principal est corrélé avec Defender XDR : les incidents d'un espace de travail secondaire ne contiennent que les données de cet espace de travail (Non). Quand vous changez d'espace de travail principal, le connecteur Defender XDR passe automatiquement au nouveau principal et se déconnecte de l'ancien (Oui). La création de détections personnalisées et les requêtes par API sont limitées à l'espace de travail principal (Non).
      options:
        s1: { en: "Incidents in a secondary workspace include no data from Defender XDR or from any other workspace.", fr: "Les incidents d'un espace de travail secondaire n'incluent aucune donnée de Defender XDR ni d'un autre espace de travail." }
        s3: { en: "Custom detections can be created only on the primary workspace.", fr: "Les détections personnalisées ne peuvent être créées que sur l'espace de travail principal." }
    references:
      - title: Multiple workspaces - Microsoft Sentinel in Defender portal
        url: https://learn.microsoft.com/en-us/azure/sentinel/workspaces-defender-portal
      - title: Connect Microsoft Sentinel to the Microsoft Defender portal
        url: https://learn.microsoft.com/en-us/unified-secops/microsoft-sentinel-onboard

  # ------------------------------------------------------------------ 8
  - id: sc500-qz-42-08
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso uses Microsoft Sentinel. The workspace is in a resource group named **RG-SOC**, and the playbooks (Consumption logic apps) are in a resource group named **RG-PB**. The Microsoft Sentinel service account already has the permissions it needs on RG-PB.

        A group named **SOC-Analysts** must be able to assign incidents and change their status, and to run the playbooks of RG-PB manually on incidents and entities. SOC-Analysts must not be able to create or edit analytics rules or playbooks.

        You need to assign roles to SOC-Analysts. The solution must follow the principle of least privilege.

        Which roles should you assign? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise Microsoft Sentinel. L'espace de travail se trouve dans un groupe de ressources nommé **RG-SOC**, et les playbooks (applications logiques Consumption) dans un groupe de ressources nommé **RG-PB**. Le compte de service Microsoft Sentinel dispose déjà des autorisations dont il a besoin sur RG-PB.

        Un groupe nommé **SOC-Analysts** doit pouvoir attribuer des incidents et modifier leur état, et exécuter manuellement les playbooks de RG-PB sur des incidents et des entités. SOC-Analysts ne doit pas pouvoir créer ni modifier de règles d'analyse ou de playbooks.

        Vous devez attribuer des rôles à SOC-Analysts. La solution doit respecter le principe du moindre privilège.

        Quels rôles devez-vous attribuer ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          On RG-SOC: [[r1]]
          On RG-PB: [[r2]]
        fr: |
          Sur RG-SOC : [[r1]]
          Sur RG-PB : [[r2]]
      slots:
        - id: r1
          options:
            - { id: reader, text: Microsoft Sentinel Reader }
            - { id: responder, text: Microsoft Sentinel Responder }
            - { id: contrib, text: Microsoft Sentinel Contributor }
            - { id: lac, text: Log Analytics Contributor }
        - id: r2
          options:
            - { id: operator, text: Microsoft Sentinel Playbook Operator }
            - { id: autocontrib, text: Microsoft Sentinel Automation Contributor }
            - { id: logic, text: Logic App Contributor }
            - { id: responder2, text: Microsoft Sentinel Responder }
    answer:
      values: { r1: responder, r2: operator }
    explanation:
      correct:
        en: |
          Microsoft Sentinel Responder on the workspace's resource group adds incident management (assign, change status) to the Reader permissions. Running playbooks manually requires Microsoft Sentinel Playbook Operator, which lists, views and runs playbooks without editing them, assigned on the playbooks' resource group. This is the combination Microsoft recommends for security analysts.
        fr: |
          Microsoft Sentinel Responder sur le groupe de ressources de l'espace de travail ajoute la gestion des incidents (attribution, changement d'état) aux autorisations de Reader. L'exécution manuelle de playbooks exige Microsoft Sentinel Playbook Operator, qui liste, affiche et exécute les playbooks sans les modifier, attribué sur le groupe de ressources des playbooks. C'est la combinaison que Microsoft recommande pour les analystes de sécurité.
      options:
        reader: { en: "Microsoft Sentinel Reader views incidents but can't assign them or change their status.", fr: "Microsoft Sentinel Reader consulte les incidents mais ne peut ni les attribuer ni modifier leur état." }
        contrib: { en: "Microsoft Sentinel Contributor also creates and edits analytics rules, which SOC-Analysts must not do.", fr: "Microsoft Sentinel Contributor crée et modifie aussi des règles d'analyse, ce que SOC-Analysts ne doit pas faire." }
        autocontrib: { en: "Microsoft Sentinel Automation Contributor is meant for the Sentinel service account, not for user accounts.", fr: "Microsoft Sentinel Automation Contributor est destiné au compte de service Sentinel, pas aux comptes d'utilisateur." }
        logic: { en: "Logic App Contributor lets users edit the playbooks, which SOC-Analysts must not do.", fr: "Logic App Contributor permet de modifier les playbooks, ce que SOC-Analysts ne doit pas faire." }
        responder2: { en: "Microsoft Sentinel Responder lets an analyst open the incident to run a playbook, but not run the playbook itself.", fr: "Microsoft Sentinel Responder permet à un analyste d'ouvrir l'incident pour exécuter un playbook, mais pas d'exécuter le playbook lui-même." }
    references:
      - title: Roles and permissions in the Microsoft Sentinel platform
        url: https://learn.microsoft.com/en-us/azure/sentinel/roles

  # ------------------------------------------------------------------ 9
  - id: sc500-qz-42-09
    objective: "4.2.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware uses Microsoft Sentinel on a workspace named **law-pro** that is onboarded to the Microsoft Defender portal. The SOC uses Scheduled and NRT analytics rules, automation rules and playbooks. The automation team is reviewing its design notes.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware utilise Microsoft Sentinel sur un espace de travail nommé **law-pro** intégré au portail Microsoft Defender. Le SOC utilise des règles d'analyse Scheduled et NRT, des règles d'automatisation et des playbooks. L'équipe d'automatisation relit ses notes de conception.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "An automation rule that uses the When alert is created trigger can have a condition on the severity of the alert.", fr: "Une règle d'automatisation qui utilise le déclencheur When alert is created peut avoir une condition sur la gravité de l'alerte." } }
        - { id: b, text: { en: "The Microsoft incident creation rules of law-pro must be disabled, because the Defender portal creates the incidents.", fr: "Les règles de création d'incidents Microsoft de law-pro doivent être désactivées, car c'est le portail Defender qui crée les incidents." } }
        - { id: c, text: { en: "Automation rules can't be exported, so each rule must be recreated by hand in the test workspace.", fr: "Les règles d'automatisation ne peuvent pas être exportées ; chaque règle doit donc être recréée à la main dans l'espace de travail de test." } }
        - { id: d, text: { en: "Changes made to one incident within a few minutes can reach Sentinel as a single update, so rules that react to each intermediate state can miss changes.", fr: "Des modifications apportées à un incident en quelques minutes peuvent parvenir à Sentinel comme une seule mise à jour ; les règles qui réagissent à chaque état intermédiaire peuvent donc manquer des changements." } }
        - { id: e, text: { en: "Alerts from Microsoft Defender XDR start the automation rules that use the When alert is created trigger.", fr: "Les alertes de Microsoft Defender XDR déclenchent les règles d'automatisation qui utilisent le déclencheur When alert is created." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          For a workspace onboarded to the Defender portal, incidents are created by the Defender portal, so the Microsoft incident creation rules of Sentinel must be disabled. When several changes hit the same incident within 5 to 10 minutes, only the most recent update is sent to Sentinel, so intermediate states can be lost for update-triggered rules.
        fr: |
          Pour un espace de travail intégré au portail Defender, les incidents sont créés par le portail Defender ; les règles de création d'incidents Microsoft de Sentinel doivent donc être désactivées. Quand plusieurs modifications touchent le même incident en 5 à 10 minutes, seule la dernière mise à jour est envoyée à Sentinel ; des états intermédiaires peuvent donc être perdus pour les règles déclenchées par mise à jour.
      options:
        a: { en: "With the alert trigger, the only condition you can set is the list of analytics rules that the automation rule applies to.", fr: "Avec le déclencheur d'alerte, la seule condition que vous pouvez définir est la liste des règles d'analyse auxquelles s'applique la règle d'automatisation." }
        c: { en: "Automation rules can be exported to ARM template files and imported into other workspaces.", fr: "Les règles d'automatisation peuvent être exportées dans des fichiers de modèle ARM et importées dans d'autres espaces de travail." }
        e: { en: "The alert trigger covers alerts of Scheduled and NRT analytics rules; Defender XDR alerts aren't available as an alert trigger in the Defender portal.", fr: "Le déclencheur d'alerte couvre les alertes des règles d'analyse Scheduled et NRT ; les alertes de Defender XDR ne sont pas disponibles comme déclencheur d'alerte dans le portail Defender." }
    references:
      - title: Automate threat response in Microsoft Sentinel with automation rules
        url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules

  # ------------------------------------------------------------------ 10
  - id: sc500-qz-42-10
    objective: "4.2.9"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses Microsoft Sentinel in the Microsoft Defender portal, with the Microsoft Sentinel data lake. A high-volume table named **FirewallFlow_CL** (about 900 GB per day) uses the Data lake tier with a retention of one year. Only about 1 % of its rows are denied connections.

        The SOC now needs a scheduled analytics rule that raises an alert within a day when a denied connection targets a server of the payment zone. A threat analyst who holds the Security Operator role will implement the solution. The solution must minimize costs and administrative effort.

        What should the analyst do?
      fr: |
        Fabrikam utilise Microsoft Sentinel dans le portail Microsoft Defender, avec le data lake Microsoft Sentinel. Une table à fort volume nommée **FirewallFlow_CL** (environ 900 Go par jour) utilise le niveau data lake avec une rétention d'un an. Seulement 1 % environ de ses lignes sont des connexions refusées.

        Le SOC a désormais besoin d'une règle d'analyse planifiée qui déclenche une alerte dans la journée quand une connexion refusée cible un serveur de la zone de paiement. Un analyste des menaces qui détient le rôle Security Operator mettra en œuvre la solution. La solution doit réduire au minimum les coûts et l'effort administratif.

        Que doit faire l'analyste ?
    body:
      options:
        - { id: a, text: { en: "Move FirewallFlow_CL to the Analytics tier with a 30-day analytics retention, and create the analytics rule on FirewallFlow_CL.", fr: "Faire passer FirewallFlow_CL au niveau d'analyse avec une rétention d'analyse de 30 jours, et créer la règle d'analyse sur FirewallFlow_CL." } }
        - { id: b, text: { en: "Run a search job on FirewallFlow_CL for the denied connections each morning, and create the analytics rule on the _SRCH table.", fr: "Exécuter chaque matin un travail de recherche sur FirewallFlow_CL pour les connexions refusées, et créer la règle d'analyse sur la table _SRCH." } }
        - { id: c, text: { en: "Create a daily KQL job that writes the denied connections to an Analytics tier table, and create the analytics rule on that table.", fr: "Créer un travail KQL quotidien qui écrit les connexions refusées dans une table du niveau d'analyse, et créer la règle d'analyse sur cette table." } }
        - { id: d, text: { en: "Create the analytics rule directly on FirewallFlow_CL, with a query frequency of 24 hours to reduce the query cost.", fr: "Créer la règle d'analyse directement sur FirewallFlow_CL, avec une fréquence de requête de 24 heures pour réduire le coût des requêtes." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Data that is only in the data lake can't be used by analytics rules, but KQL jobs can promote data to the Analytics tier. A daily KQL job that writes only the 1 % of denied connections to an Analytics tier table keeps the bulk of the data in low-cost storage, runs without manual work, and gives the analytics rule a table to query. Security Operator can create and manage data lake jobs.
        fr: |
          Les données qui se trouvent uniquement dans le data lake ne peuvent pas être utilisées par les règles d'analyse, mais les travaux KQL peuvent promouvoir des données vers le niveau d'analyse. Un travail KQL quotidien qui écrit uniquement les 1 % de connexions refusées dans une table du niveau d'analyse garde l'essentiel des données dans un stockage à faible coût, s'exécute sans intervention manuelle et donne à la règle d'analyse une table à interroger. Security Operator peut créer et gérer les travaux du data lake.
      options:
        a: { en: "Moving the whole table to the Analytics tier makes all 900 GB per day billed at the analytics ingestion price, to use 1 % of the rows.", fr: "Faire passer toute la table au niveau d'analyse fait facturer les 900 Go par jour au prix d'ingestion du niveau d'analyse, pour utiliser 1 % des lignes." }
        b: { en: "A search job is a one-time job that creates its own results table: it must be run by hand every day, and the rule wouldn't have a stable table to query.", fr: "Un travail de recherche est un travail ponctuel qui crée sa propre table de résultats : il doit être lancé à la main chaque jour, et la règle n'aurait pas de table stable à interroger." }
        d: { en: "Analytics rules don't run on data that is only in the data lake tier, whatever their frequency.", fr: "Les règles d'analyse ne s'exécutent pas sur des données qui se trouvent uniquement dans le niveau data lake, quelle que soit leur fréquence." }
    references:
      - title: Manage data tiers and retention in Microsoft Sentinel
        url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
      - title: Roles and permissions in the Microsoft Sentinel platform
        url: https://learn.microsoft.com/en-us/azure/sentinel/roles
