# SC-500 objectives — official study guide (en-us page last updated 2026-05-13, fr-fr page 2026-05-14; checked 2026-11-16).
# English verbatim. French from the fr-fr page, which is partly machine-translated: obvious errors were corrected
# (product names kept in English: Azure Firewall, Azure Backup, Defender for ..., Microsoft Entra Agent ID...;
# domain titles 2 and 3 put back in the infinitive).
# `code` is the stable key referenced by question files and course sections.
identity:
- group:
    en: Secure access to resources by using Microsoft Entra ID
    fr: Sécuriser l'accès aux ressources à l'aide de Microsoft Entra ID
  objectives:
  - code: 1.1.1
    en: Implement and configure Privileged Identity Management (PIM)
    fr: Implémenter et configurer Privileged Identity Management (PIM)
  - code: 1.1.2
    en: Implement conditional access policies
    fr: Implémenter des stratégies d'accès conditionnel
  - code: 1.1.3
    en: Implement and configure authentication methods, including multifactor authentication (MFA) and passwordless
    fr: Implémenter et configurer des méthodes d'authentification, y compris l'authentification multifacteur (MFA) et sans mot de passe
  - code: 1.1.4
    en: Implement and configure identity for applications, including enterprise applications and app registrations
    fr: Implémenter et configurer l'identité pour les applications, y compris les applications d'entreprise et les inscriptions d'applications
  - code: 1.1.5
    en: Manage OAuth permission grants and consent settings
    fr: Gérer les octrois d'autorisations OAuth et les paramètres de consentement
  - code: 1.1.6
    en: Implement and configure managed identities for Azure resources
    fr: Implémenter et configurer des identités managées pour les ressources Azure
- group:
    en: Secure secrets and keys by using Azure Key Vault
    fr: Sécuriser les secrets et les clés à l'aide d'Azure Key Vault
  objectives:
  - code: 1.2.1
    en: Deploy Key Vault
    fr: Déployer Key Vault
  - code: 1.2.2
    en: Configure Key Vault settings
    fr: Configurer les paramètres de Key Vault
  - code: 1.2.3
    en: Configure access to Key Vault
    fr: Configurer l'accès à Key Vault
  - code: 1.2.4
    en: Configure firewall settings on Key Vault
    fr: Configurer les paramètres de pare-feu sur Key Vault
  - code: 1.2.5
    en: Manage keys, secrets, and certificates
    fr: Gérer les clés, les secrets et les certificats
  - code: 1.2.6
    en: Scan for secrets by using Defender Cloud Security Posture Management (Defender CSPM)
    fr: Rechercher des secrets à l'aide de Defender Cloud Security Posture Management (Defender CSPM)
  - code: 1.2.7
    en: Implement Defender for Key Vault
    fr: Implémenter Defender for Key Vault
- group:
    en: Implement governance to enforce security and regulatory compliance
    fr: Implémenter la gouvernance pour appliquer la sécurité et la conformité réglementaire
  objectives:
  - code: 1.3.1
    en: Implement and configure security controls by using Azure Policy, including built-in and custom policy definitions
    fr: Implémenter et configurer des contrôles de sécurité à l'aide d'Azure Policy, notamment des définitions de stratégie intégrées et personnalisées
  - code: 1.3.2
    en: Evaluate regulatory compliance by using Microsoft Defender for Cloud
    fr: Évaluer la conformité réglementaire à l'aide de Microsoft Defender for Cloud
  - code: 1.3.3
    en: Implement and configure security controls in Defender for Cloud, including security standards and recommendations
    fr: Implémenter et configurer des contrôles de sécurité dans Defender for Cloud, y compris les normes de sécurité et les recommandations
  - code: 1.3.4
    en: Implement resource locks
    fr: Implémenter des verrous de ressources
  - code: 1.3.5
    en: Manage Azure built-in role assignments
    fr: Gérer les attributions de rôles intégrés Azure
  - code: 1.3.6
    en: Manage custom roles, including Azure roles and Microsoft Entra roles
    fr: Gérer des rôles personnalisés, notamment des rôles Azure et des rôles Microsoft Entra
  - code: 1.3.7
    en: Evaluate and remediate overprivileged access assignments by using Azure role-based access control (RBAC)
    fr: Évaluer et corriger les attributions d'accès disposant de privilèges excessifs à l'aide du contrôle d'accès en fonction du rôle Azure (RBAC)
  - code: 1.3.8
    en: Configure security controls for backup protection by using Azure Backup security features
    fr: Configurer des contrôles de sécurité pour la protection des sauvegardes à l'aide des fonctionnalités de sécurité d'Azure Backup
  - code: 1.3.9
    en: Implement and configure security controls by using infrastructure as code
    fr: Implémenter et configurer des contrôles de sécurité à l'aide de l'infrastructure en tant que code
data-networking:
- group:
    en: Implement security for storage accounts
    fr: Implémenter la sécurité pour les comptes de stockage
  objectives:
  - code: 2.1.1
    en: Implement and configure security for storage accounts
    fr: Implémenter et configurer la sécurité pour les comptes de stockage
  - code: 2.1.2
    en: Configure Azure Storage firewall rules
    fr: Configurer les règles de pare-feu d'Azure Storage
  - code: 2.1.3
    en: Implement Defender for Storage threat protection configurations
    fr: Implémenter les configurations de protection contre les menaces de Defender for Storage
  - code: 2.1.4
    en: Manage access to storage, including access policies
    fr: Gérer l'accès au stockage, y compris les stratégies d'accès
- group:
    en: Implement security for databases
    fr: Implémenter la sécurité pour les bases de données
  objectives:
  - code: 2.2.1
    en: Implement platform-level security configurations in Azure SQL
    fr: Implémenter des configurations de sécurité au niveau de la plateforme dans Azure SQL
  - code: 2.2.2
    en: Configure database auditing for Azure SQL Database and Azure SQL Managed Instance
    fr: Configurer l'audit de base de données pour Azure SQL Database et Azure SQL Managed Instance
  - code: 2.2.3
    en: Configure Defender for Databases protection across Azure database services
    fr: Configurer la protection Defender for Databases sur les services de base de données Azure
- group:
    en: Implement security for Azure network services
    fr: Implémenter la sécurité pour les services réseau Azure
  objectives:
  - code: 2.3.1
    en: Implement and manage network security groups (NSGs) and application security groups (ASGs)
    fr: Implémenter et gérer des groupes de sécurité réseau (NSG) et des groupes de sécurité d'application (ASG)
  - code: 2.3.2
    en: Implement and configure network access policies by using Azure Virtual Network Manager
    fr: Implémenter et configurer des stratégies d'accès réseau à l'aide d'Azure Virtual Network Manager
  - code: 2.3.3
    en: Configure security for an Azure Virtual WAN
    fr: Configurer la sécurité d'un Azure Virtual WAN
  - code: 2.3.4
    en: Implement and configure security for virtual private network (VPN) connections
    fr: Implémenter et configurer la sécurité pour les connexions de réseau privé virtuel (VPN)
  - code: 2.3.5
    en: Implement and configure Microsoft Entra Private Access
    fr: Implémenter et configurer Microsoft Entra Private Access
  - code: 2.3.6
    en: Configure Azure private endpoints to secure access to Azure platform as a service (PaaS) resources
    fr: Configurer des points de terminaison privés Azure pour sécuriser l'accès aux ressources PaaS (platform as a service) Azure
  - code: 2.3.7
    en: Configure Azure Private Link services to secure access to network resources
    fr: Configurer des services Azure Private Link pour sécuriser l'accès aux ressources réseau
  - code: 2.3.8
    en: Implement and configure Azure Firewall
    fr: Implémenter et configurer Azure Firewall
  - code: 2.3.9
    en: Evaluate effective security rules by using Azure Network Watcher diagnostics
    fr: Évaluer les règles de sécurité effectives à l'aide des diagnostics d'Azure Network Watcher
compute:
- group:
    en: Implement security for AI
    fr: Implémenter la sécurité pour l'IA
  objectives:
  - code: 3.1.1
    en: Identify overexposure of data in SharePoint
    fr: Identifier la surexposition des données dans SharePoint
  - code: 3.1.2
    en: Identify risks related to Microsoft Copilot and AI apps by using Microsoft Purview Data Security Posture Management (DSPM)
    fr: Identifier les risques liés à Microsoft Copilot et aux applications d'IA à l'aide de Microsoft Purview Data Security Posture Management (DSPM)
  - code: 3.1.3
    en: Enable and configure real-time protection for Microsoft Copilot Studio agents
    fr: Activer et configurer la protection en temps réel pour les agents Microsoft Copilot Studio
  - code: 3.1.4
    en: Implement conditional access for Microsoft Entra Agent ID
    fr: Implémenter l'accès conditionnel pour Microsoft Entra Agent ID
  - code: 3.1.5
    en: Analyze blast radius for security risks related to Entra Agent ID by using Defender XDR
    fr: Analyser le rayon d'impact (blast radius) des risques de sécurité liés à Entra Agent ID à l'aide de Defender XDR
  - code: 3.1.6
    en: Manage Entra Agent ID access
    fr: Gérer l'accès d'Entra Agent ID
  - code: 3.1.7
    en: Configure and deploy AI Gateway in Azure API Management for Microsoft Foundry
    fr: Configurer et déployer la passerelle IA (AI Gateway) dans Azure API Management pour Microsoft Foundry
  - code: 3.1.8
    en: Enable Defender for AI Service in Cloud Workload Protection in Defender for Cloud
    fr: Activer Defender for AI Service dans la protection des charges de travail cloud (Cloud Workload Protection) de Defender for Cloud
  - code: 3.1.9
    en: Configure guardrails for agent security in Foundry
    fr: Configurer des garde-fous pour la sécurité des agents dans Foundry
  - code: 3.1.10
    en: Monitor AI security by using the Data and AI security dashboard in Defender for Cloud
    fr: Surveiller la sécurité de l'IA à l'aide du tableau de bord de sécurité des données et de l'IA dans Defender for Cloud
  - code: 3.1.11
    en: Manage agents in Microsoft 365 admin center
    fr: Gérer les agents dans le Centre d'administration Microsoft 365
- group:
    en: Implement security for servers and virtual machines (VMs)
    fr: Implémenter la sécurité pour les serveurs et les machines virtuelles
  objectives:
  - code: 3.2.1
    en: Implement and configure disk encryption
    fr: Implémenter et configurer le chiffrement de disque
  - code: 3.2.2
    en: Plan and implement Azure Bastion
    fr: Planifier et implémenter Azure Bastion
  - code: 3.2.3
    en: Enable and enforce use of just-in-time (JIT) VM access
    fr: Activer et imposer l'utilisation de l'accès juste-à-temps (JIT) aux machines virtuelles
  - code: 3.2.4
    en: Extend security controls to hybrid and multicloud servers by using Azure Arc
    fr: Étendre les contrôles de sécurité aux serveurs hybrides et multiclouds à l'aide d'Azure Arc
  - code: 3.2.5
    en: Onboard servers to Defender for Servers in Defender for Cloud, including hybrid and multicloud scenarios
    fr: Intégrer des serveurs à Defender for Servers dans Defender for Cloud, y compris dans les scénarios hybrides et multiclouds
  - code: 3.2.6
    en: Configure Defender for Servers settings, including vulnerability scanning, and endpoint detection and response (EDR)
    fr: Configurer les paramètres de Defender for Servers, notamment l'analyse des vulnérabilités ainsi que la détection et la réponse sur les points de terminaison (EDR)
  - code: 3.2.7
    en: Implement and manage agentless scanning for VMs in Defender for Servers
    fr: Implémenter et gérer l'analyse sans agent pour les machines virtuelles dans Defender for Servers
  - code: 3.2.8
    en: Configure security features on a VM, including secure boot, virtual Trusted Platform Module (vTPM), integrity monitoring, and security type
    fr: Configurer des fonctionnalités de sécurité sur une machine virtuelle, notamment le démarrage sécurisé, le module de plateforme sécurisée virtuel (vTPM), la surveillance de l'intégrité et le type de sécurité
  - code: 3.2.9
    en: Enforce security configuration of Azure-managed servers by using Azure Machine Configuration
    fr: Appliquer la configuration de sécurité des serveurs gérés par Azure à l'aide d'Azure Machine Configuration
- group:
    en: Implement security for application platform services
    fr: Implémenter la sécurité pour les services de plateforme d'applications
  objectives:
  - code: 3.3.1
    en: Detect misconfigurations and runtime risks in container workloads by using Defender for Containers
    fr: Détecter les erreurs de configuration et les risques d'exécution dans les charges de travail de conteneur à l'aide de Defender for Containers
  - code: 3.3.2
    en: Implement and configure security controls for Azure Kubernetes Service (AKS)
    fr: Implémenter et configurer des contrôles de sécurité pour Azure Kubernetes Service (AKS)
  - code: 3.3.3
    en: Implement and configure security controls for Azure Container Registry
    fr: Implémenter et configurer des contrôles de sécurité pour Azure Container Registry
  - code: 3.3.4
    en: Implement and configure security controls for Azure Container Instances and Azure Container Apps
    fr: Implémenter et configurer des contrôles de sécurité pour Azure Container Instances et Azure Container Apps
  - code: 3.3.5
    en: Implement and configure security controls for Azure Functions, including authentication and network access
    fr: Implémenter et configurer des contrôles de sécurité pour Azure Functions, notamment l'authentification et l'accès réseau
  - code: 3.3.6
    en: Implement and configure security controls for Azure Logic Apps
    fr: Implémenter et configurer des contrôles de sécurité pour Azure Logic Apps
  - code: 3.3.7
    en: Implement and configure security controls for Azure App Service
    fr: Implémenter et configurer des contrôles de sécurité pour Azure App Service
  - code: 3.3.8
    en: Implement and configure Azure Web Application Firewall
    fr: Implémenter et configurer Azure Web Application Firewall
  - code: 3.3.9
    en: Implement security policies for back-end API protection by using API Management
    fr: Implémenter des stratégies de sécurité pour la protection des API back-end à l'aide d'API Management
posture:
- group:
    en: Manage security posture by using Defender for Cloud
    fr: Gérer la posture de sécurité à l'aide de Defender for Cloud
  objectives:
  - code: 4.1.1
    en: Identify security risks by using Defender CSPM
    fr: Identifier les risques de sécurité à l'aide de Defender CSPM
  - code: 4.1.2
    en: Evaluate compliance against security frameworks by using Defender for Cloud
    fr: Évaluer la conformité par rapport aux frameworks de sécurité à l'aide de Defender for Cloud
  - code: 4.1.3
    en: Enable and configure Defender for Cloud workload protection plans
    fr: Activer et configurer les plans de protection des charges de travail de Defender for Cloud
  - code: 4.1.4
    en: Connect hybrid cloud and multicloud environments to Defender for Cloud, including Amazon Web Services (AWS) and Google Cloud Platform (GCP)
    fr: Connecter des environnements cloud hybrides et multiclouds à Defender for Cloud, notamment Amazon Web Services (AWS) et Google Cloud Platform (GCP)
  - code: 4.1.5
    en: Configure Microsoft Defender Vulnerability Management settings for Azure VMs
    fr: Configurer les paramètres de Microsoft Defender Vulnerability Management pour les machines virtuelles Azure
  - code: 4.1.6
    en: Discover unprotected assets and vulnerabilities by using Microsoft Defender External Attack Surface Management (EASM)
    fr: Découvrir les ressources non protégées et les vulnérabilités à l'aide de Microsoft Defender External Attack Surface Management (EASM)
- group:
    en: Implement activity and event collection in Microsoft Sentinel
    fr: Implémenter la collecte des activités et des événements dans Microsoft Sentinel
  objectives:
  - code: 4.2.1
    en: Create and connect workspaces in Microsoft Sentinel
    fr: Créer et connecter des espaces de travail dans Microsoft Sentinel
  - code: 4.2.2
    en: Assign roles in Microsoft Sentinel
    fr: Attribuer des rôles dans Microsoft Sentinel
  - code: 4.2.3
    en: Implement and use content hub solutions
    fr: Implémenter et utiliser des solutions du hub de contenu
  - code: 4.2.4
    en: Configure and use Microsoft data connectors for Azure resources
    fr: Configurer et utiliser des connecteurs de données Microsoft pour les ressources Azure
  - code: 4.2.5
    en: Implement and configure syslog and Common Event Format (CEF) event collections
    fr: Implémenter et configurer la collecte d'événements syslog et Common Event Format (CEF)
  - code: 4.2.6
    en: Implement and configure collection of Windows Security events by using data collection rules, including Windows Event Forwarding (WEF)
    fr: Implémenter et configurer la collecte des événements de sécurité Windows à l'aide de règles de collecte de données, notamment le transfert d'événements Windows (WEF)
  - code: 4.2.7
    en: Create custom log tables in the workspace to store ingested data
    fr: Créer des tables de journaux personnalisées dans l'espace de travail pour stocker les données ingérées
  - code: 4.2.8
    en: Implement automation rules and playbooks in Microsoft Sentinel
    fr: Implémenter des règles d'automatisation et des playbooks dans Microsoft Sentinel
  - code: 4.2.9
    en: Implement data retention in Microsoft Sentinel data stores
    fr: Implémenter la rétention des données dans les magasins de données Microsoft Sentinel
  - code: 4.2.10
    en: Query Microsoft Purview Audit in Defender XDR
    fr: Interroger Microsoft Purview Audit dans Defender XDR
- group:
    en: Implement Microsoft Security Copilot
    fr: Implémenter Microsoft Security Copilot
  objectives:
  - code: 4.3.1
    en: Configure workspaces for Security Copilot
    fr: Configurer des espaces de travail pour Security Copilot
  - code: 4.3.2
    en: Manage permissions and roles in Security Copilot
    fr: Gérer les autorisations et les rôles dans Security Copilot
  - code: 4.3.3
    en: Enable and configure plugins
    fr: Activer et configurer des plug-ins
  - code: 4.3.4
    en: Enable and configure Microsoft agents and Security Store agents
    fr: Activer et configurer des agents Microsoft et des agents du Security Store
