# SC-500 — Implementing End-to-End Security Controls for Cloud and AI Workloads
# (Microsoft Certified: Cloud and AI Security Engineer Associate)
# Source: official study guide
# https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-500 (checked on 2026-11-16).
# The study guide of this 2026 exam carries no "Skills measured as of" line: blueprint.version is the
# "Last updated" date of the English study guide (May 13, 2026).
# Real exam: 120 minutes, passing score 700/1000, proctored, "may have interactive components" (labs possible),
# offered in 10 languages including French; Microsoft does not publish the number of questions (40 to 60 on
# most exams) nor whether this exam has case studies. On 2026-11-16 the certification page still said that no
# practice assessment was available (they usually arrive within 8 weeks after the end of the beta).
# Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
