id: sc500-cs4a-relecloud
status: draft
title:
  en: Relecloud
  fr: Relecloud
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Relecloud is a travel agency with 1,800 employees. The head office is in Nice, and 300 travel advisors work from 40 agencies.

        Relecloud is deploying AI agents that build itineraries and handle refund requests. The agents use models hosted in Microsoft Foundry and are exposed to internal applications through Azure API Management. A cloud security team of four engineers secures the platform.
      fr: |
        Relecloud est une agence de voyages qui compte 1 800 employés. Le siège est à Nice, et 300 conseillers voyage travaillent dans 40 agences.

        Relecloud déploie des agents IA qui construisent des itinéraires et traitent les demandes de remboursement. Les agents utilisent des modèles hébergés dans Microsoft Foundry et sont exposés aux applications internes par Azure API Management. Une équipe de sécurité cloud de quatre ingénieurs sécurise la plateforme.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity**

        Relecloud has a Microsoft Entra tenant named relecloud.com. All users have Microsoft 365 E7 licenses. The travel advisors are members of a group named **GRP-Advisors**, and the cloud security engineers are members of a group named **GRP-CloudSec**. Lena Roux is the travel operations manager. Omar Haddad is the platform engineer who configured the agents.

        The user consent setting of the tenant is **Allow user consent for apps**. Over the last year, travel advisors consented to about 60 third-party apps, many of them from unverified publishers.

        **Azure**

        Relecloud has an Azure subscription named **Sub-AI** in the France Central region that contains the following resources.

        | Name | Type | Configuration |
        | --- | --- | --- |
        | fdy-trips | Microsoft Foundry resource | Project **TripAssist**; public network access: **All networks** |
        | apim-mt | API Management, Standard v2 tier | User-assigned managed identity **uai-apim**; no system-assigned managed identity |
        | kv-trips | Key Vault | Permission model: Azure role-based access control; firewall: **Allow public access from specific virtual networks and IP addresses**, no exception enabled |
        | VNet-AI | Virtual network | 10.40.0.0/16, subnet **snet-pe** (10.40.1.0/24) |

        In Microsoft Defender for Cloud, Sub-AI has only the foundational CSPM capabilities. No Defender plan is enabled.

        **Agents**

        Omar Haddad created the following agents from an agent identity blueprint named **BP-Trips**. He is the owner and the sponsor of each agent identity.

        | Agent | Access to Microsoft Graph |
        | --- | --- |
        | ItineraryBuilder | Runs every night without a signed-in user and reads supplier contracts by using its own agent identity (application-only access). |
        | AdvisorAssist | Used by the travel advisors in Microsoft Teams. Calls Microsoft Graph on behalf of the signed-in advisor. |
        | RefundMail | Signs in with its own agent user account to send email to airlines and hotels. |
      fr: |
        **Identité**

        Relecloud dispose d'un locataire Microsoft Entra nommé relecloud.com. Tous les utilisateurs disposent de licences Microsoft 365 E7. Les conseillers voyage sont membres d'un groupe nommé **GRP-Advisors**, et les ingénieurs de sécurité cloud sont membres d'un groupe nommé **GRP-CloudSec**. Lena Roux est la responsable des opérations voyage. Omar Haddad est l'ingénieur de plateforme qui a configuré les agents.

        Le paramètre de consentement de l'utilisateur du locataire est **Allow user consent for apps**. Au cours de l'année écoulée, les conseillers voyage ont donné leur consentement à une soixantaine d'applications tierces, dont beaucoup proviennent d'éditeurs non vérifiés.

        **Azure**

        Relecloud dispose d'un abonnement Azure nommé **Sub-AI** dans la région France Central, qui contient les ressources suivantes.

        | Nom | Type | Configuration |
        | --- | --- | --- |
        | fdy-trips | Ressource Microsoft Foundry | Projet **TripAssist** ; accès réseau public : **All networks** |
        | apim-mt | API Management, niveau Standard v2 | Identité managée affectée par l'utilisateur **uai-apim** ; aucune identité managée affectée par le système |
        | kv-trips | Key Vault | Modèle d'autorisation : contrôle d'accès en fonction du rôle Azure ; pare-feu : **Allow public access from specific virtual networks and IP addresses**, aucune exception activée |
        | VNet-AI | Réseau virtuel | 10.40.0.0/16, sous-réseau **snet-pe** (10.40.1.0/24) |

        Dans Microsoft Defender for Cloud, Sub-AI ne dispose que des fonctionnalités CSPM de base (foundational CSPM). Aucun plan Defender n'est activé.

        **Agents**

        Omar Haddad a créé les agents suivants à partir d'un blueprint d'identité d'agent nommé **BP-Trips**. Il est propriétaire et sponsor de chaque identité d'agent.

        | Agent | Accès à Microsoft Graph |
        | --- | --- |
        | ItineraryBuilder | S'exécute chaque nuit sans utilisateur connecté et lit les contrats des fournisseurs avec sa propre identité d'agent (accès à l'application uniquement). |
        | AdvisorAssist | Utilisé par les conseillers voyage dans Microsoft Teams. Appelle Microsoft Graph pour le compte du conseiller connecté. |
        | RefundMail | Se connecte avec son propre compte d'utilisateur d'agent pour envoyer des e-mails aux compagnies aériennes et aux hôtels. |
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Relecloud identifies the following requirements.

        **Identity and secrets**

        1. Lena Roux must be accountable for ItineraryBuilder. She must be able to disable its agent identity and request access packages for it, but she must not be able to change its credentials.
        2. Users must be able to consent only to apps from verified publishers that request permissions classified as low impact. For any other app, users must be able to request approval from GRP-CloudSec.
        3. apim-mt must read the API key of an external fare-pricing service from kv-trips by using a named value. The kv-trips firewall must remain enabled.

        **Network**

        4. fdy-trips must be reachable only through a private endpoint in snet-pe. Name resolution must use Azure Private DNS zones linked to VNet-AI.

        **Security posture**

        5. The security team must identify the attack paths that lead to fdy-trips and discover the generative AI components of the itinerary application.

        **General**

        6. Use the principle of least privilege.
      fr: |
        Relecloud a défini les exigences suivantes.

        **Identité et secrets**

        1. Lena Roux doit être responsable d'ItineraryBuilder. Elle doit pouvoir désactiver son identité d'agent et demander des packages d'accès pour celle-ci, mais elle ne doit pas pouvoir modifier ses informations d'identification.
        2. Les utilisateurs ne doivent pouvoir donner leur consentement qu'aux applications d'éditeurs vérifiés qui demandent des autorisations classées à faible impact. Pour toute autre application, les utilisateurs doivent pouvoir demander l'approbation de GRP-CloudSec.
        3. apim-mt doit lire la clé API d'un service externe de tarification dans kv-trips au moyen d'une valeur nommée. Le pare-feu de kv-trips doit rester activé.

        **Réseau**

        4. fdy-trips ne doit être accessible que par un point de terminaison privé dans snet-pe. La résolution de noms doit utiliser des zones DNS privées Azure liées à VNet-AI.

        **Posture de sécurité**

        5. L'équipe de sécurité doit identifier les chemins d'attaque qui mènent à fdy-trips et découvrir les composants d'IA générative de l'application d'itinéraires.

        **Général**

        6. Appliquer le principe du moindre privilège.
