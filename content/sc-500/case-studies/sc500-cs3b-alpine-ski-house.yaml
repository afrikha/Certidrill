id: sc500-cs3b-alpine-ski-house
status: draft
title:
  en: Alpine Ski House
  fr: Alpine Ski House
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Alpine Ski House operates 14 ski resorts in Austria, France and Canada. Each resort has hotels, ski schools and lift ticket offices. The head office is in Innsbruck.

        A security operations center (SOC) of eight people monitors the company by using Microsoft Sentinel. Alpine Ski House acquires one or two resorts every season.
      fr: |
        Alpine Ski House exploite 14 stations de ski en Autriche, en France et au Canada. Chaque station comprend des hôtels, des écoles de ski et des points de vente de forfaits. Le siège est à Innsbruck.

        Un centre des opérations de sécurité (SOC) de huit personnes surveille l'entreprise avec Microsoft Sentinel. Alpine Ski House acquiert une ou deux stations à chaque saison.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Azure.** The Azure subscription **Sub-Ops** contains the following resources:

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | law-soc | Log Analytics workspace | Microsoft Sentinel enabled; resource group rg-soc |
        | VM-BOOK1, VM-BOOK2 | Virtual machines | Windows Server 2022, booking application; subnet protected by a network security group |
        | VM-PAY1 | Virtual machine | Windows Server 2022, payment gateway; its subnet has no network security group and is protected only by fw-hub |
        | fw-hub | Azure Firewall | Rules managed by a firewall policy in Azure Firewall Manager |
        | pb-close-noise | Logic App (playbook) | Runs from an automation rule; currently uses the Microsoft Sentinel connector with the account of a SOC engineer |

        Microsoft Defender for Servers Plan 1 is enabled on Sub-Ops.

        **On-premises.** The head office datacenter hosts a Linux server named **lnx-fwd01** with rsyslog and Python 3. The next-generation firewalls of the resorts already send Common Event Format (CEF) messages to lnx-fwd01 on port 514. The Common Event Format solution is installed from the Microsoft Sentinel content hub.

        **AWS.** The marketing websites run on Amazon EC2 instances in an AWS organization that contains a management account, a delegated administrator account used by the security team, and one member account per resort.
      fr: |
        **Azure.** L'abonnement Azure **Sub-Ops** contient les ressources suivantes :

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | law-soc | Espace de travail Log Analytics | Microsoft Sentinel activé ; groupe de ressources rg-soc |
        | VM-BOOK1, VM-BOOK2 | Machines virtuelles | Windows Server 2022, application de réservation ; sous-réseau protégé par un groupe de sécurité réseau |
        | VM-PAY1 | Machine virtuelle | Windows Server 2022, passerelle de paiement ; son sous-réseau n'a pas de groupe de sécurité réseau et n'est protégé que par fw-hub |
        | fw-hub | Azure Firewall | Règles gérées par une stratégie de pare-feu dans Azure Firewall Manager |
        | pb-close-noise | Application logique (playbook) | Exécutée par une règle d'automatisation ; utilise actuellement le connecteur Microsoft Sentinel avec le compte d'un ingénieur du SOC |

        Microsoft Defender for Servers Plan 1 est activé sur Sub-Ops.

        **Local.** Le centre de données du siège héberge un serveur Linux nommé **lnx-fwd01** avec rsyslog et Python 3. Les pare-feu de nouvelle génération des stations envoient déjà des messages Common Event Format (CEF) à lnx-fwd01 sur le port 514. La solution Common Event Format est installée depuis le hub de contenu de Microsoft Sentinel.

        **AWS.** Les sites web marketing s'exécutent sur des instances Amazon EC2 dans une organisation AWS qui contient un compte de gestion, un compte d'administrateur délégué utilisé par l'équipe de sécurité et un compte membre par station.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Alpine Ski House identifies the following requirements:

        1. The CEF messages of the resort firewalls must be ingested into law-soc by using the Azure Monitor Agent.
        2. The SOC roles must be assigned on rg-soc as follows:
           - Auditors view incidents, workbooks and data without making changes.
           - Detection engineers install content hub solutions and create analytics rules.
           - Automation developers create and edit the Logic Apps playbooks.
           - Shift leads list, view and manually run the existing playbooks.
        3. pb-close-noise must add comments to incidents and close them without using any user account or stored credential.
        4. Inbound RDP to the Azure VMs must be opened only on request and for a limited time.
        5. All the current and future AWS accounts of the organization must be connected to Defender for Cloud with minimum administrative effort.
        6. The principle of least privilege must be followed.
      fr: |
        Alpine Ski House a défini les exigences suivantes :

        1. Les messages CEF des pare-feu des stations doivent être ingérés dans law-soc avec l'agent Azure Monitor.
        2. Les rôles du SOC doivent être attribués sur rg-soc comme suit :
           - Les auditeurs consultent les incidents, les classeurs et les données sans rien modifier.
           - Les ingénieurs de détection installent des solutions du hub de contenu et créent des règles d'analyse.
           - Les développeurs d'automatisation créent et modifient les playbooks Logic Apps.
           - Les chefs d'équipe listent, consultent et exécutent manuellement les playbooks existants.
        3. pb-close-noise doit ajouter des commentaires aux incidents et les fermer sans utiliser de compte d'utilisateur ni d'informations d'identification stockées.
        4. Le RDP entrant vers les machines virtuelles Azure ne doit être ouvert qu'à la demande et pour une durée limitée.
        5. Tous les comptes AWS actuels et futurs de l'organisation doivent être connectés à Defender for Cloud avec un effort d'administration minimal.
        6. Le principe du moindre privilège doit être respecté.
