id: sc500-cs2a-nod-publishers
status: draft
title:
  en: |
    Nod Publishers
  fr: |
    Nod Publishers
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Nod Publishers is a publishing house based in Brussels. It has 600 employees in its editorial, rights and marketing departments.

        Nod uses Microsoft 365 E5 and has deployed Microsoft 365 Copilot to all employees. Editors build agents in Microsoft Copilot Studio to draft book blurbs and to check manuscripts. A security team of four engineers manages Microsoft Entra ID, Microsoft Defender XDR and Microsoft Purview.
      fr: |
        Nod Publishers est une maison d'édition basée à Bruxelles. Elle compte 600 employés dans ses services éditorial, droits et marketing.

        Nod utilise Microsoft 365 E5 et a déployé Microsoft 365 Copilot pour tous ses employés. Les éditeurs créent des agents dans Microsoft Copilot Studio pour rédiger des quatrièmes de couverture et vérifier des manuscrits. Une équipe de sécurité de quatre ingénieurs gère Microsoft Entra ID, Microsoft Defender XDR et Microsoft Purview.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Microsoft Entra ID**

        The user consent setting of the tenant is **Allow user consent for apps**. The admin consent workflow is disabled. No permission is classified.

        **SharePoint Online**

        | Site | Content |
        | --- | --- |
        | Manuscripts | Unpublished manuscripts, many of them labeled **Confidential - Manuscripts**. One of the 100 most used sites of the tenant. |
        | Contracts | Author contracts and royalty statements. Some files are shared with external users or by links that work for anyone. |
        | Archive2015 | Catalog files from 2012 to 2019. Most of the content hasn't been accessed for more than three years. |
        | Rights | Translation rights deals. Many unlabeled files contain bank account numbers. |

        A Microsoft Entra application is registered for item-level scanning in Microsoft Purview Data Security Posture Management (DSPM).

        **Agents**

        | Agent | Description |
        | --- | --- |
        | BlurbWriter | Copilot Studio agent shared with the marketing department. Its creator left Nod last week and the creator's account was deleted. BlurbWriter now appears as an agent without an owner. |
        | ManuscriptCheck | Copilot Studio agent used by editors. Its tools read SharePoint files and send email. |

        **Security operations**

        Security for AI agents is enabled in the Microsoft Defender portal, with the Microsoft 365 app connector, and Copilot Studio is connected. Real-time protection uses only the built-in **Default** rule.

        A Microsoft Sentinel workspace named **law-nod** is onboarded to the Defender portal. Its Microsoft 365 connector ingests the SharePoint and Exchange audit records.
      fr: |
        **Microsoft Entra ID**

        Le paramètre de consentement de l'utilisateur du locataire est **Allow user consent for apps**. Le workflow de consentement administrateur est désactivé. Aucune autorisation n'est classifiée.

        **SharePoint Online**

        | Site | Contenu |
        | --- | --- |
        | Manuscripts | Manuscrits non publiés, dont beaucoup portent l'étiquette de confidentialité **Confidential - Manuscripts**. L'un des 100 sites les plus utilisés du locataire. |
        | Contracts | Contrats d'auteurs et relevés de droits d'auteur. Certains fichiers sont partagés avec des utilisateurs externes ou par des liens accessibles à tous. |
        | Archive2015 | Fichiers du catalogue de 2012 à 2019. La plupart des contenus n'ont pas été consultés depuis plus de trois ans. |
        | Rights | Contrats de droits de traduction. De nombreux fichiers sans étiquette contiennent des numéros de compte bancaire. |

        Une application Microsoft Entra est inscrite pour l'analyse au niveau des éléments dans Microsoft Purview Data Security Posture Management (DSPM).

        **Agents**

        | Agent | Description |
        | --- | --- |
        | BlurbWriter | Agent Copilot Studio partagé avec le service marketing. Son créateur a quitté Nod la semaine dernière et son compte a été supprimé. BlurbWriter apparaît désormais comme un agent sans propriétaire. |
        | ManuscriptCheck | Agent Copilot Studio utilisé par les éditeurs. Ses outils lisent des fichiers SharePoint et envoient des e-mails. |

        **Opérations de sécurité**

        La sécurité des agents IA est activée dans le portail Microsoft Defender, avec le connecteur d'application Microsoft 365, et Copilot Studio est connecté. La protection en temps réel n'utilise que la règle intégrée **Default**.

        Un espace de travail Microsoft Sentinel nommé **law-nod** est intégré au portail Defender. Son connecteur Microsoft 365 ingère les enregistrements d'audit SharePoint et Exchange.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Nod identifies the following requirements:

        1. Microsoft 365 Copilot and agents must not summarize files labeled **Confidential - Manuscripts**.
        2. Microsoft 365 Copilot must not surface any content of the **Contracts** site.
        3. Content of the **Archive2015** site that hasn't been accessed for at least three years must be deleted automatically.
        4. Unlabeled files of the **Rights** site that contain sensitive information must be labeled automatically.
        5. The security team must identify each file of the **Contracts** site that has a sharing link for external or anonymous users, and must be able to remove those links from DSPM.
        6. BlurbWriter must become unavailable to users immediately. The marketing department must be able to review it next month.
        7. A ManuscriptCheck tool invocation that sends email to an unsafe domain must be stopped before it executes.
        8. Users must be able to consent to apps from verified publishers that request only the **openid**, **profile**, **email**, **offline_access** and **User.Read** permissions. Every other consent request must be submitted to the security team, which approves or denies it.
        9. Every week, the security team must use advanced hunting in the Defender portal to list the number of distinct SharePoint files that each user downloaded during the last seven days.
      fr: |
        Nod a défini les exigences suivantes :

        1. Microsoft 365 Copilot et les agents ne doivent pas résumer les fichiers portant l'étiquette **Confidential - Manuscripts**.
        2. Microsoft 365 Copilot ne doit faire apparaître aucun contenu du site **Contracts**.
        3. Les contenus du site **Archive2015** qui n'ont pas été consultés depuis au moins trois ans doivent être supprimés automatiquement.
        4. Les fichiers sans étiquette du site **Rights** qui contiennent des informations sensibles doivent être étiquetés automatiquement.
        5. L'équipe de sécurité doit identifier chaque fichier du site **Contracts** qui possède un lien de partage pour des utilisateurs externes ou anonymes, et doit pouvoir supprimer ces liens depuis DSPM.
        6. BlurbWriter doit devenir immédiatement indisponible pour les utilisateurs. Le service marketing doit pouvoir l'examiner le mois prochain.
        7. Un appel d'outil de ManuscriptCheck qui envoie un e-mail vers un domaine non sûr doit être arrêté avant son exécution.
        8. Les utilisateurs doivent pouvoir donner leur consentement aux applications d'éditeurs vérifiés qui ne demandent que les autorisations **openid**, **profile**, **email**, **offline_access** et **User.Read**. Toute autre demande de consentement doit être soumise à l'équipe de sécurité, qui l'approuve ou la refuse.
        9. Chaque semaine, l'équipe de sécurité doit utiliser la chasse avancée du portail Defender pour lister le nombre de fichiers SharePoint distincts que chaque utilisateur a téléchargés au cours des sept derniers jours.
