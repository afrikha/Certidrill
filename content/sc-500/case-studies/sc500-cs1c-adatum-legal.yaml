id: sc500-cs1c-adatum-legal
status: draft
title:
  en: |-
    Adatum Legal
  fr: |-
    Adatum Legal
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Adatum Legal is a law firm with offices in Paris and Brussels. It has three practice groups: Litigation, Tax and Corporate. Each practice group has its own budget for generative AI.

        Adatum is rolling out AI agents that help lawyers research case law and prepare matter files. The security team must secure the AI platform before the general rollout.
      fr: |
        Adatum Legal est un cabinet d'avocats présent à Paris et à Bruxelles. Il compte trois départements : Litigation, Tax et Corporate. Chaque département dispose de son propre budget pour l'IA générative.

        Adatum déploie des agents IA qui aident les avocats à rechercher la jurisprudence et à préparer les dossiers. L'équipe de sécurité doit sécuriser la plateforme IA avant le déploiement général.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Adatum has a Microsoft Entra tenant named adatumlegal.com with Microsoft 365 E5 and Microsoft Agent 365 licenses, and an Azure subscription named **Sub-AI** in the France Central region.

        | Resource | Configuration |
        | --- | --- |
        | adt-foundry | Microsoft Foundry resource with the project **proj-legal**; public network access enabled from all networks; model deployment **chat-main**, assigned the custom guardrail **gr-models** |
        | agent-research | Foundry Agent Service agent in proj-legal that uses chat-main and a tool that retrieves documents from public court websites; assigned the custom guardrail **gr-agents** |
        | apim-adt-ai | API Management, Standard v2 tier, used as the AI gateway for adt-foundry; system-assigned managed identity enabled; outbound virtual network integration with VNet-AI; one subscription per practice group |
        | VNet-AI | Virtual network with the subnets **snet-apim** and **snet-pe** |
        | law-adt-soc | Log Analytics workspace used by the SOC |

        Today, apim-adt-ai authenticates to adt-foundry by using an API key stored as a named value.

        Adatum also uses the following agents that have Microsoft Entra Agent ID identities:

        - **Matter Clerk**: agent identities created from the agent identity blueprint **bp-matter-clerk**, one per matter. They access SharePoint by using their own agent identity (application-only access).
        - **Intake Assistant**: accesses matter files in SharePoint on behalf of the signed-in lawyer (delegated access).

        Defender for Cloud has the Defender CSPM plan enabled on Sub-AI. The AI services plan is off.
      fr: |
        Adatum dispose d'un locataire Microsoft Entra nommé adatumlegal.com avec des licences Microsoft 365 E5 et Microsoft Agent 365, et d'un abonnement Azure nommé **Sub-AI** dans la région France Central.

        | Ressource | Configuration |
        | --- | --- |
        | adt-foundry | Ressource Microsoft Foundry avec le projet **proj-legal** ; accès réseau public activé depuis tous les réseaux ; déploiement de modèle **chat-main**, auquel est attribué le garde-fou personnalisé **gr-models** |
        | agent-research | Agent Foundry Agent Service dans proj-legal qui utilise chat-main et un outil qui récupère des documents sur des sites publics de juridictions ; garde-fou personnalisé **gr-agents** attribué |
        | apim-adt-ai | API Management, niveau Standard v2, utilisé comme passerelle IA pour adt-foundry ; identité managée affectée par le système activée ; intégration au réseau virtuel sortante avec VNet-AI ; un abonnement par département |
        | VNet-AI | Réseau virtuel avec les sous-réseaux **snet-apim** et **snet-pe** |
        | law-adt-soc | Espace de travail Log Analytics utilisé par le SOC |

        Aujourd'hui, apim-adt-ai s'authentifie auprès de adt-foundry avec une clé API stockée dans une valeur nommée.

        Adatum utilise aussi les agents suivants, qui ont des identités Microsoft Entra Agent ID :

        - **Matter Clerk** : identités d'agent créées à partir du blueprint d'identité d'agent **bp-matter-clerk**, une par dossier. Elles accèdent à SharePoint avec leur propre identité d'agent (accès application uniquement).
        - **Intake Assistant** : accède aux dossiers dans SharePoint pour le compte de l'avocat connecté (accès délégué).

        Defender for Cloud a le plan Defender CSPM activé sur Sub-AI. Le plan AI services est désactivé.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Adatum identifies the following requirements:

        1. **Token budget**: Each practice group must be limited to 50,000 tokens per minute across all its applications. A request whose estimated prompt already exceeds the remaining tokens must be rejected before it reaches the model.
        2. **Gateway authentication**: apim-adt-ai must call adt-foundry without any API key, by using the least privileged role.
        3. **Network**: adt-foundry must be reachable only from VNet-AI through a private endpoint.
        4. **Guardrails**: agent-research must block indirect attacks hidden in the documents returned by its tool.
        5. **Threat detection**: The SOC must receive threat alerts for adt-foundry, and the alerts must show the suspicious parts of the prompts.
        6. **Agent access**: When Intake Assistant accesses matter files, the access must come from a compliant device.
        7. Administrative effort must be minimized.
      fr: |
        Adatum a défini les exigences suivantes :

        1. **Budget de jetons** : chaque département doit être limité à 50 000 jetons par minute pour l'ensemble de ses applications. Une requête dont le prompt estimé dépasse déjà les jetons restants doit être rejetée avant d'atteindre le modèle.
        2. **Authentification de la passerelle** : apim-adt-ai doit appeler adt-foundry sans aucune clé API, avec le rôle le moins privilégié.
        3. **Réseau** : adt-foundry ne doit être accessible que depuis VNet-AI, par un point de terminaison privé.
        4. **Garde-fous** : agent-research doit bloquer les attaques indirectes dissimulées dans les documents renvoyés par son outil.
        5. **Détection des menaces** : le SOC doit recevoir des alertes de menace pour adt-foundry, et les alertes doivent montrer les parties suspectes des prompts.
        6. **Accès des agents** : quand Intake Assistant accède aux dossiers, l'accès doit provenir d'un appareil conforme.
        7. L'effort d'administration doit être réduit au minimum.
