id: sc500-cs3a-trey-research
status: draft
title:
  en: Trey Research
  fr: Trey Research
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Trey Research is a pharmaceutical research company with laboratories in Basel, Lyon and Boston. Its research teams use generative AI agents to review scientific literature and to query assay results.

        A central platform team of five engineers publishes the AI models and agents to the research teams. The security operations team monitors the platform.
      fr: |
        Trey Research est une société de recherche pharmaceutique qui possède des laboratoires à Bâle, Lyon et Boston. Ses équipes de recherche utilisent des agents d'IA générative pour analyser la littérature scientifique et interroger les résultats d'essais.

        Une équipe plateforme centrale de cinq ingénieurs publie les modèles et les agents d'IA pour les équipes de recherche. L'équipe des opérations de sécurité surveille la plateforme.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Trey Research has a Microsoft Entra tenant licensed with Microsoft 365 E7, and an Azure subscription named **Sub-AI** in the Sweden Central region. Microsoft Defender for Cloud is enabled on Sub-AI with the foundational CSPM capabilities only.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | fdy-trey | Microsoft Foundry resource | Model deployments that use the default guardrail Microsoft.DefaultV2; public network access Enabled from all networks |
        | apim-trey | API Management instance | Premium tier, internal virtual network mode in VNet-Hub; publishes the Foundry models to the research teams |
        | VNet-Hub | Virtual network | Subnets snet-apim and snet-pe |

        API Management currently calls fdy-trey by sending an API key in a header. Each research team has its own API Management subscription.

        The following agents are built in the Foundry Agent Service:

        | Agent | Description |
        | --- | --- |
        | agt-lit-review | Uses the Bing Grounding and SharePoint Grounding tools to read external publications and internal study reports |
        | agt-assay | Queries an internal assay data API. Its connection to the API uses an API key |

        All the agent identities of the research agents are created from a Microsoft Entra agent identity blueprint named **bp-research**. agt-lit-review also has an agent user account so that it can work in a shared mailbox.
      fr: |
        Trey Research dispose d'un locataire Microsoft Entra sous licence Microsoft 365 E7 et d'un abonnement Azure nommé **Sub-AI** dans la région Sweden Central. Microsoft Defender for Cloud est activé sur Sub-AI avec uniquement les fonctionnalités CSPM de base.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | fdy-trey | Ressource Microsoft Foundry | Déploiements de modèles qui utilisent le garde-fou par défaut Microsoft.DefaultV2 ; accès au réseau public activé à partir de tous les réseaux |
        | apim-trey | Instance API Management | Niveau Premium, mode réseau virtuel interne dans VNet-Hub ; publie les modèles Foundry pour les équipes de recherche |
        | VNet-Hub | Réseau virtuel | Sous-réseaux snet-apim et snet-pe |

        API Management appelle actuellement fdy-trey en envoyant une clé API dans un en-tête. Chaque équipe de recherche dispose de son propre abonnement API Management.

        Les agents suivants sont créés dans Foundry Agent Service :

        | Agent | Description |
        | --- | --- |
        | agt-lit-review | Utilise les outils Bing Grounding et SharePoint Grounding pour lire des publications externes et des rapports d'étude internes |
        | agt-assay | Interroge une API interne de données d'essais. Sa connexion à l'API utilise une clé API |

        Toutes les identités d'agent des agents de recherche sont créées à partir d'un blueprint d'identité d'agent Microsoft Entra nommé **bp-research**. agt-lit-review dispose aussi d'un compte d'utilisateur d'agent pour travailler dans une boîte aux lettres partagée.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Trey Research identifies the following requirements:

        1. fdy-trey must not accept any traffic on its public endpoint. apim-trey must reach fdy-trey through a private IP address in VNet-Hub.
        2. No API key or secret must be used between apim-trey and fdy-trey.
        3. Each research team must be limited to 20,000 tokens per minute and to 2,000,000 tokens per calendar month. A request whose prompt alone exceeds the per-minute limit must be rejected without being sent to the model.
        4. Hidden instructions in the documents and web pages that agt-lit-review retrieves must be detected and must stop the agent.
        5. A Conditional Access policy named **CA-AgentRisk** must block the agents that Microsoft Entra ID Protection identifies as high risk. The policy will target the bp-research blueprint.
        6. Security analysts must see the suspicious segments of the prompts in the Defender for Cloud alerts raised for the Foundry workloads.
        7. Administrative effort must be minimized and the principle of least privilege must be followed.
      fr: |
        Trey Research a défini les exigences suivantes :

        1. fdy-trey ne doit accepter aucun trafic sur son point de terminaison public. apim-trey doit joindre fdy-trey par une adresse IP privée de VNet-Hub.
        2. Aucune clé API ni aucun secret ne doit être utilisé entre apim-trey et fdy-trey.
        3. Chaque équipe de recherche doit être limitée à 20 000 jetons par minute et à 2 000 000 de jetons par mois civil. Une requête dont le prompt dépasse à lui seul la limite par minute doit être rejetée sans être envoyée au modèle.
        4. Les instructions cachées dans les documents et les pages web récupérés par agt-lit-review doivent être détectées et doivent arrêter l'agent.
        5. Une stratégie d'accès conditionnel nommée **CA-AgentRisk** doit bloquer les agents que Microsoft Entra ID Protection identifie comme présentant un risque élevé. La stratégie ciblera le blueprint bp-research.
        6. Les analystes de sécurité doivent voir les segments suspects des prompts dans les alertes Defender for Cloud générées pour les charges de travail Foundry.
        7. L'effort d'administration doit être réduit au minimum et le principe du moindre privilège doit être respecté.
