id: sc500-cs1a-wingtip-energy
status: draft
title:
  en: |-
    Wingtip Energy
  fr: |-
    Wingtip Energy
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Wingtip Energy is an electricity distribution company in Belgium. Its head office and its main datacenter are in Antwerp. A security operations center (SOC) of 12 people monitors the IT and operational technology (OT) networks.

        Wingtip is extending its cloud security controls to its on-premises servers and to the firewalls that protect the OT network, and is centralizing its security monitoring in Microsoft Sentinel.
      fr: |
        Wingtip Energy est un distributeur d'électricité en Belgique. Son siège et son datacenter principal se trouvent à Anvers. Un centre des opérations de sécurité (SOC) de 12 personnes surveille les réseaux informatiques et les réseaux de technologie opérationnelle (OT).

        Wingtip étend ses contrôles de sécurité cloud à ses serveurs locaux et aux pare-feu qui protègent le réseau OT, et centralise sa surveillance de la sécurité dans Microsoft Sentinel.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Wingtip has a Microsoft Entra tenant named wingtipenergy.com. All IT staff have Microsoft Entra ID P2 licenses. Wingtip has an Azure subscription named **Sub-OT** that contains the following resource groups.

        | Resource group | Content |
        | --- | --- |
        | RG-SCADA | Virtual machines that host the SCADA historian application |
        | RG-SOC | Log Analytics workspace **law-wingtip-soc**, with Microsoft Sentinel enabled |
        | RG-SOC-Automation | Logic Apps playbooks, including **pb-block-source-ip**, which uses the Microsoft Sentinel incident trigger |

        Microsoft Defender for Cloud has the Defender for Servers Plan 2 enabled on Sub-OT. The **Common Event Format** solution is installed from the Microsoft Sentinel content hub.

        The Antwerp datacenter contains the following on-premises resources. None of them is connected to Azure.

        | Resource | Description |
        | --- | --- |
        | 40 Windows servers, 25 Linux servers | Run Microsoft Defender for Endpoint |
        | FW-OT1 to FW-OT6 | Firewalls that protect the OT network and can send Common Event Format (CEF) messages over syslog |
        | LNX-FWD1 | Ubuntu 22.04 server with rsyslog and Python 3, planned as the log forwarder |

        A Microsoft Sentinel analytics rule named **OT-Firewall-BruteForce** creates incidents from the firewall logs.
      fr: |
        Wingtip dispose d'un locataire Microsoft Entra nommé wingtipenergy.com. Tout le personnel informatique dispose de licences Microsoft Entra ID P2. Wingtip dispose d'un abonnement Azure nommé **Sub-OT** qui contient les groupes de ressources suivants.

        | Groupe de ressources | Contenu |
        | --- | --- |
        | RG-SCADA | Machines virtuelles qui hébergent l'application d'historique SCADA |
        | RG-SOC | Espace de travail Log Analytics **law-wingtip-soc**, avec Microsoft Sentinel activé |
        | RG-SOC-Automation | Playbooks Logic Apps, dont **pb-block-source-ip**, qui utilise le déclencheur d'incident Microsoft Sentinel |

        Microsoft Defender for Cloud a le plan Defender for Servers Plan 2 activé sur Sub-OT. La solution **Common Event Format** est installée à partir du hub de contenu Microsoft Sentinel.

        Le datacenter d'Anvers contient les ressources locales suivantes. Aucune n'est connectée à Azure.

        | Ressource | Description |
        | --- | --- |
        | 40 serveurs Windows, 25 serveurs Linux | Exécutent Microsoft Defender for Endpoint |
        | FW-OT1 à FW-OT6 | Pare-feu qui protègent le réseau OT et peuvent envoyer des messages Common Event Format (CEF) via syslog |
        | LNX-FWD1 | Serveur Ubuntu 22.04 avec rsyslog et Python 3, prévu comme redirecteur de journaux |

        Une règle analytique Microsoft Sentinel nommée **OT-Firewall-BruteForce** crée des incidents à partir des journaux des pare-feu.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Wingtip identifies the following requirements:

        1. The on-premises servers must be protected by Defender for Servers Plan 2 in Sub-OT and must be evaluated against security baselines by Azure Policy machine configuration.
        2. The CEF messages of FW-OT1 to FW-OT6 must be ingested into the **CommonSecurityLog** table of law-wingtip-soc through LNX-FWD1.
        3. The SOC staff must receive the following permissions on Microsoft Sentinel, and nothing more:
           - Tier 1 analysts: view data and triage, assign and close incidents.
           - Detection engineers: install content hub solutions and create analytics rules.
           - Compliance auditors: view incidents, data and workbooks.
           - Automation operators: list, view and manually run the existing playbooks.
        4. Each incident created by OT-Firewall-BruteForce must be assigned automatically to the tier 2 lead analyst, Lena Maes, and pb-block-source-ip must run automatically on it.
        5. The members of the **OT-Engineers** group must not have standing administrative access to RG-SCADA. When needed, they must obtain the Contributor role on RG-SCADA for at most four hours, after approval by a member of the **OT-SecLeads** group, and must provide a change ticket number.
        6. Administrative effort must be minimized.
      fr: |
        Wingtip a défini les exigences suivantes :

        1. Les serveurs locaux doivent être protégés par Defender for Servers Plan 2 dans Sub-OT et doivent être évalués par rapport à des lignes de base de sécurité par la configuration machine d'Azure Policy.
        2. Les messages CEF de FW-OT1 à FW-OT6 doivent être ingérés dans la table **CommonSecurityLog** de law-wingtip-soc par l'intermédiaire de LNX-FWD1.
        3. Le personnel du SOC doit recevoir les autorisations suivantes sur Microsoft Sentinel, et rien de plus :
           - Analystes de niveau 1 : consulter les données et trier, attribuer et fermer les incidents.
           - Ingénieurs de détection : installer des solutions du hub de contenu et créer des règles analytiques.
           - Auditeurs de conformité : consulter les incidents, les données et les classeurs.
           - Opérateurs d'automatisation : lister, consulter et exécuter manuellement les playbooks existants.
        4. Chaque incident créé par OT-Firewall-BruteForce doit être attribué automatiquement à l'analyste responsable du niveau 2, Lena Maes, et pb-block-source-ip doit s'exécuter automatiquement sur cet incident.
        5. Les membres du groupe **OT-Engineers** ne doivent pas disposer d'un accès d'administration permanent à RG-SCADA. En cas de besoin, ils doivent obtenir le rôle Contributor sur RG-SCADA pendant quatre heures au maximum, après approbation par un membre du groupe **OT-SecLeads**, et doivent fournir un numéro de ticket de changement.
        6. L'effort d'administration doit être réduit au minimum.
