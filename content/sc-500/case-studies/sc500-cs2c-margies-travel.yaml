id: sc500-cs2c-margies-travel
status: draft
title:
  en: |
    Margie's Travel
  fr: |
    Margie's Travel
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Margie's Travel is a travel agency network with a head office in Lyon and 45 agencies in France and Belgium.

        The booking and payment applications run on Azure virtual machines. The back-office applications run in a datacenter in Lyon. Margie's must pass a payment card industry audit next quarter.
      fr: |
        Margie's Travel est un réseau d'agences de voyages dont le siège est à Lyon, avec 45 agences en France et en Belgique.

        Les applications de réservation et de paiement s'exécutent sur des machines virtuelles Azure. Les applications de back-office s'exécutent dans un centre de données à Lyon. Margie's doit réussir un audit de l'industrie des cartes de paiement le trimestre prochain.
  - key: azure
    title: { en: "Azure environment", fr: "Environnement Azure" }
    body:
      en: |
        Margie's has an Azure subscription named **Sub-Travel** in the France Central region. In Microsoft Defender for Cloud, Defender CSPM and Defender for Servers Plan 2 are enabled on Sub-Travel, and **Agentless scanning for machines** is turned on.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | vm-booking01 | Windows Server 2022 VM, generation 2 | Security type **Standard**. Protected by Azure Backup with a **Standard** backup policy. |
        | vm-pay01, vm-pay02 | Linux VMs | OS and data disks encrypted with a customer-managed key stored in kv-travel |
        | kv-travel | Key vault | Permission model: **Azure role-based access control** |
        | vnet-booking | Virtual network | Peered with vnet-crm |
        | vnet-pci | Virtual network | Contains the payment VMs. Not peered. |
        | vnet-crm | Virtual network | Peered with vnet-booking |

        No Azure Bastion host is deployed. The Azure VMs have no managed identity. Agentless scanning results are available for every Azure VM except vm-pay01 and vm-pay02.

        A Microsoft Sentinel workspace named **law-travel** is used by the security team.
      fr: |
        Margie's dispose d'un abonnement Azure nommé **Sub-Travel** dans la région France Central. Dans Microsoft Defender for Cloud, Defender CSPM et Defender for Servers Plan 2 sont activés sur Sub-Travel, et **Agentless scanning for machines** est activé.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | vm-booking01 | Machine virtuelle Windows Server 2022, génération 2 | Type de sécurité **Standard**. Protégée par la Sauvegarde Azure avec une stratégie de sauvegarde **Standard**. |
        | vm-pay01, vm-pay02 | Machines virtuelles Linux | Disques de système d'exploitation et de données chiffrés avec une clé gérée par le client stockée dans kv-travel |
        | kv-travel | Coffre de clés | Modèle d'autorisation : **contrôle d'accès en fonction du rôle Azure** |
        | vnet-booking | Réseau virtuel | Peering avec vnet-crm |
        | vnet-pci | Réseau virtuel | Contient les machines virtuelles de paiement. Aucun peering. |
        | vnet-crm | Réseau virtuel | Peering avec vnet-booking |

        Aucun hôte Azure Bastion n'est déployé. Les machines virtuelles Azure n'ont pas d'identité managée. Les résultats de l'analyse sans agent sont disponibles pour toutes les machines virtuelles Azure, sauf vm-pay01 et vm-pay02.

        Un espace de travail Microsoft Sentinel nommé **law-travel** est utilisé par l'équipe de sécurité.
  - key: onprem
    title: { en: "On-premises environment", fr: "Environnement local" }
    body:
      en: |
        The Lyon datacenter contains 60 Windows Server and Linux servers that aren't connected to Azure. An IT team deploys software to these servers by using a configuration management tool.

        A Windows Server named **wec01** is a Windows Event Collector. The 800 agency workstations forward their Security events to wec01 by using Windows Event Forwarding (WEF). The workstations have no Azure agent.

        A resource group named **rg-arc-lyon** in Sub-Travel is reserved for the on-premises servers.
      fr: |
        Le centre de données de Lyon contient 60 serveurs Windows Server et Linux qui ne sont pas connectés à Azure. Une équipe informatique déploie des logiciels sur ces serveurs avec un outil de gestion de la configuration.

        Un serveur Windows Server nommé **wec01** est un collecteur d'événements Windows. Les 800 postes de travail des agences transfèrent leurs événements de sécurité vers wec01 avec le transfert d'événements Windows (WEF). Les postes de travail n'ont aucun agent Azure.

        Un groupe de ressources nommé **rg-arc-lyon** dans Sub-Travel est réservé aux serveurs locaux.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Margie's identifies the following requirements:

        1. vm-booking01 must use the Trusted launch security type with Secure Boot and vTPM enabled. vm-booking01 must remain protected by Azure Backup.
        2. Agentless scanning must cover vm-pay01 and vm-pay02.
        3. The Security events of the workstations must be collected in law-travel through wec01.
        4. An Azure Bastion host must be deployed in each of the following virtual networks, with the lowest-cost SKU that meets the need:
           - vnet-booking: administrators connect from their workstations with the native RDP client through the Azure CLI, and upload files to VMs in vnet-booking and vnet-crm.
           - vnet-pci: all the sessions to the payment VMs must be recorded.
           - vnet-crm: support staff connect from the Azure portal to VMs in vnet-crm and in its peered virtual network.
        5. The Azure VMs and the on-premises servers must be audited against the operating system security baselines by using Azure Machine Configuration.
        6. The on-premises servers must be connected to Azure Arc in rg-arc-lyon by the configuration management tool, without interactive sign-in.
        7. Every identity must receive only the permissions that it requires, and administrative effort must be minimized.
      fr: |
        Margie's a défini les exigences suivantes :

        1. vm-booking01 doit utiliser le type de sécurité Lancement fiable (Trusted launch) avec le démarrage sécurisé (Secure Boot) et le vTPM activés. vm-booking01 doit rester protégée par la Sauvegarde Azure.
        2. L'analyse sans agent doit couvrir vm-pay01 et vm-pay02.
        3. Les événements de sécurité des postes de travail doivent être collectés dans law-travel par l'intermédiaire de wec01.
        4. Un hôte Azure Bastion doit être déployé dans chacun des réseaux virtuels suivants, avec la référence SKU la moins coûteuse qui répond au besoin :
           - vnet-booking : les administrateurs se connectent depuis leur poste de travail avec le client RDP natif par Azure CLI et chargent des fichiers vers les machines virtuelles de vnet-booking et de vnet-crm.
           - vnet-pci : toutes les sessions vers les machines virtuelles de paiement doivent être enregistrées.
           - vnet-crm : le personnel de support se connecte depuis le portail Azure aux machines virtuelles de vnet-crm et du réseau virtuel relié à vnet-crm par peering.
        5. Les machines virtuelles Azure et les serveurs locaux doivent être audités par rapport aux bases de référence de sécurité du système d'exploitation avec Azure Machine Configuration.
        6. Les serveurs locaux doivent être connectés à Azure Arc dans rg-arc-lyon par l'outil de gestion de la configuration, sans connexion interactive.
        7. Chaque identité ne doit recevoir que les autorisations dont elle a besoin, et l'effort d'administration doit être réduit au minimum.
