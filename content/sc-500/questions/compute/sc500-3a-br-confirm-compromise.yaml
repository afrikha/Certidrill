id: sc500-3a-br-confirm-compromise
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an autonomous agent named **StockSync** that was created from the agent identity blueprint **bp-supply**, together with nine other agents. A Conditional Access policy named **CA-AgentRisk** targets All agent identities, blocks access when the agent risk is High, and is set to **On**.

    ID Protection reports a Medium risk for StockSync with the detection **Unfamiliar resource access**. The attack paths of StockSync in Microsoft Defender XDR lead to the finance storage accounts. Your investigation confirms that StockSync is compromised.

    You need to block StockSync by using CA-AgentRisk and record the compromise in the risk history of StockSync. The other agents created from bp-supply must keep working.

    What should you do?
  fr: |
    Northwind Traders dispose d'un agent autonome nommé **StockSync**, créé à partir du blueprint d'identité d'agent **bp-supply**, comme neuf autres agents. Une stratégie d'accès conditionnel nommée **CA-AgentRisk** cible All agent identities, bloque l'accès lorsque le risque d'agent est High et est réglée sur **On**.

    ID Protection signale un risque Medium pour StockSync avec la détection **Unfamiliar resource access**. Dans Microsoft Defender XDR, les chemins d'attaque de StockSync mènent aux comptes de stockage du service financier. Votre investigation confirme que StockSync est compromis.

    Vous devez bloquer StockSync à l'aide de CA-AgentRisk et consigner la compromission dans l'historique des risques de StockSync. Les autres agents créés à partir de bp-supply doivent continuer à fonctionner.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable the bp-supply blueprint from its management page.", fr: "Désactiver le blueprint bp-supply depuis sa page de gestion." } }
    - { id: b, text: { en: "Select Dismiss risk for StockSync in the Risky Agents report.", fr: "Sélectionner Dismiss risk pour StockSync dans le rapport Risky Agents." } }
    - { id: c, text: { en: "Change CA-AgentRisk to include the Medium agent risk level.", fr: "Modifier CA-AgentRisk pour inclure le niveau de risque d'agent Medium." } }
    - { id: d, text: { en: "Select Confirm compromise for StockSync in the Risky Agents report.", fr: "Sélectionner Confirm compromise pour StockSync dans le rapport Risky Agents." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Confirm compromise is the incident response action after an investigation confirms a compromise. It sets the risk level of StockSync to High, creates an event in its risk detections and triggers the policies that block High agent risk, so CA-AgentRisk blocks only StockSync.
    fr: |
      Confirm compromise est l'action de réponse aux incidents à utiliser lorsqu'une investigation confirme une compromission. Elle fait passer le niveau de risque de StockSync à High, crée un événement dans ses détections de risque et déclenche les stratégies qui bloquent un risque d'agent High : CA-AgentRisk bloque donc uniquement StockSync.
  options:
    a:
      en: |
        Disabling a blueprint blocks every agent created from it, so the nine other agents would stop working, and it records nothing in the agent's risk history.
      fr: |
        Désactiver un blueprint bloque tous les agents créés à partir de celui-ci : les neuf autres agents cesseraient de fonctionner, et rien ne serait consigné dans l'historique des risques de l'agent.
    b:
      en: |
        Dismiss risk indicates that the risk is no longer relevant; it does not raise the risk or block the agent.
      fr: |
        Dismiss risk indique que le risque n'est plus pertinent ; cela n'augmente pas le risque et ne bloque pas l'agent.
    c:
      en: |
        Changing the policy would block every agent at Medium risk, not only StockSync, and would not record the confirmed compromise.
      fr: |
        Modifier la stratégie bloquerait tous les agents à risque Medium, pas seulement StockSync, et ne consignerait pas la compromission confirmée.
references:
  - title: ID Protection for agents
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-risky-agents
  - title: Manage agent identities in your organization
    url: https://learn.microsoft.com/en-us/entra/agent-id/manage-agent-identities-admin
