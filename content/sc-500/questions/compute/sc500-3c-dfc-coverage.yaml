id: sc500-3c-dfc-coverage
objective: "3.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware enables every component of the Defender for Containers plan on a subscription that contains an AKS cluster named **aks-hr** and an Azure container registry named **acrhr**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware active tous les composants du plan Defender for Containers sur un abonnement qui contient un cluster AKS nommé **aks-hr** et un registre de conteneurs Azure nommé **acrhr**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Images that remain in acrhr are rescanned for vulnerabilities every day, not only when they are pushed."
        fr: "Les images conservées dans acrhr sont réanalysées chaque jour pour rechercher des vulnérabilités, et pas seulement lors de leur envoi (push)."
    - id: s2
      text:
        en: "Binary drift blocking on aks-hr is provided by the Kubernetes audit logs that Defender for Cloud collects without a sensor."
        fr: "Le blocage de la dérive binaire sur aks-hr est assuré par les journaux d'audit Kubernetes que Defender for Cloud collecte sans capteur."
    - id: s3
      text:
        en: "You can exclude specific nodes from agentless scanning for machines by using an exclusion tag."
        fr: "Vous pouvez exclure certains nœuds de l'analyse sans agent des machines (Agentless scanning for machines) à l'aide d'une étiquette d'exclusion."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Defender for Containers rescans registry images daily and gives newly pushed images a quick scan. Binary drift detection and blocking are sensor-based capabilities, so they need the Defender sensor on the nodes; the audit logs feed only part of the runtime threat detection. Agentless scanning for machines lets you define an exclusion tag name and value to skip specific machines."
    fr: "Defender for Containers réanalyse chaque jour les images des registres et effectue une analyse rapide des images nouvellement envoyées. La détection et le blocage de la dérive binaire reposent sur le capteur Defender installé sur les nœuds ; les journaux d'audit n'alimentent qu'une partie de la détection des menaces à l'exécution. Agentless scanning for machines permet de définir un nom et une valeur d'étiquette d'exclusion pour ignorer certaines machines."
references:
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
  - title: Enable Defender for Containers in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-enable-plan
