id: sc500-3b-bastion-shareable-link
objective: "3.2.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Tailspin Toys has a virtual network named **VNet1** that contains Windows virtual machines without public IP addresses.

    External auditors must be able to open RDP sessions to two of the VMs from a browser without signing in to the Azure portal. Session recording isn't required. The solution must minimize cost.

    Which Azure Bastion SKU should you deploy?
  fr: |
    Tailspin Toys dispose d'un réseau virtuel nommé **VNet1** qui contient des machines virtuelles Windows sans adresse IP publique.

    Des auditeurs externes doivent pouvoir ouvrir des sessions RDP vers deux des machines virtuelles depuis un navigateur, sans se connecter au portail Azure. L'enregistrement des sessions n'est pas exigé. La solution doit réduire les coûts au minimum.

    Quelle SKU d'Azure Bastion devez-vous déployer ?
body:
  options:
    - { id: a, text: Developer }
    - { id: b, text: Basic }
    - { id: c, text: Standard }
    - { id: d, text: Premium }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Shareable Link feature lets users connect to a target VM through Azure Bastion without accessing the Azure portal, and it requires the Standard SKU or higher. Standard is the lowest SKU that meets the requirement, and session recording, the main Premium feature, isn't needed.
    fr: |
      La fonctionnalité Shareable Link permet aux utilisateurs de se connecter à une machine virtuelle cible via Azure Bastion sans accéder au portail Azure, et elle exige la SKU Standard ou supérieure. Standard est la SKU la moins élevée qui répond à l'exigence, et l'enregistrement des sessions, principale fonctionnalité de Premium, n'est pas nécessaire.
  options:
    a: { en: "The Developer SKU doesn't support shareable links and connects to only one VM at a time.", fr: "La SKU Developer ne prend pas en charge les liens partageables et ne se connecte qu'à une seule machine virtuelle à la fois." }
    b: { en: "The Basic SKU doesn't support shareable links.", fr: "La SKU Basic ne prend pas en charge les liens partageables." }
    d: { en: "Premium supports shareable links, but it costs more than Standard and its extra features aren't required.", fr: "Premium prend en charge les liens partageables, mais coûte plus cher que Standard et ses fonctionnalités supplémentaires ne sont pas exigées." }
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
