id: sc500-3a-spo-e5-activity
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has Microsoft 365 E5 licenses. It has no Microsoft 365 Copilot licenses and no SharePoint Advanced Management licenses. Data collection for data access governance activity reports has never been enabled.

    You plan a Copilot pilot. You need to identify the SharePoint sites where users recently created the most Anyone links.

    Which two actions should you perform in the SharePoint admin center? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose de licences Microsoft 365 E5. Elle n'a aucune licence Microsoft 365 Copilot ni SharePoint Advanced Management. La collecte de données pour les rapports d'activité de gouvernance de l'accès aux données n'a jamais été activée.

    Vous planifiez un pilote Copilot. Vous devez identifier les sites SharePoint dans lesquels des utilisateurs ont récemment créé le plus de liens Anyone.

    Quelles sont les deux actions à effectuer dans le Centre d'administration SharePoint ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable data collection for the activity reports.", fr: "Activer la collecte de données pour les rapports d'activité." } }
    - { id: b, text: { en: "Run the Site permissions for your organization report.", fr: "Exécuter le rapport Site permissions for your organization." } }
    - { id: c, text: { en: "After 24 hours, run the Sharing links report.", fr: "Après 24 heures, exécuter le rapport Sharing links." } }
    - { id: d, text: { en: "Initiate a site access review for each site.", fr: "Lancer une révision d'accès au site pour chaque site." } }
    - { id: e, text: { en: "Run the Site permissions for users report.", fr: "Exécuter le rapport Site permissions for users." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With Microsoft 365 E5 alone, administrators can use data access governance activity reports (up to 10,000 sites) but no other SharePoint Advanced Management feature. Without SharePoint Advanced Management, activity reports require data collection to be enabled first; reports become available 24 hours later and contain only data collected after that. The Sharing links report shows the sites with the most recently created Anyone, People in the organization and Specific people links.
    fr: |
      Avec Microsoft 365 E5 seul, les administrateurs peuvent utiliser les rapports d'activité de gouvernance de l'accès aux données (jusqu'à 10 000 sites), mais aucune autre fonctionnalité de SharePoint Advanced Management. Sans SharePoint Advanced Management, les rapports d'activité exigent d'abord d'activer la collecte de données ; les rapports sont disponibles 24 heures plus tard et ne contiennent que les données collectées depuis. Le rapport Sharing links montre les sites où ont été créés le plus de liens Anyone, People in the organization et Specific people récemment.
  options:
    b:
      en: |
        Snapshot reports such as site permissions are unavailable with Microsoft 365 E5 alone, and they show a permission baseline rather than recent link creation.
      fr: |
        Les rapports d'instantané comme les autorisations de site ne sont pas disponibles avec Microsoft 365 E5 seul, et ils montrent une base de référence des autorisations plutôt que la création récente de liens.
    d:
      en: |
        Site access review is a SharePoint Advanced Management remediation feature; it is not available here and does not identify the sites.
      fr: |
        La révision d'accès au site est une fonctionnalité de correction de SharePoint Advanced Management ; elle n'est pas disponible ici et n'identifie pas les sites.
    e:
      en: |
        Site permissions for users is a snapshot report of the sites that one specified user can access; it is unavailable with Microsoft 365 E5 alone and does not track link creation.
      fr: |
        Site permissions for users est un rapport d'instantané des sites auxquels un utilisateur donné peut accéder ; il n'est pas disponible avec Microsoft 365 E5 seul et ne suit pas la création de liens.
references:
  - title: Data access governance reports for SharePoint and OneDrive sites
    url: https://learn.microsoft.com/en-us/sharepoint/data-access-governance-reports
