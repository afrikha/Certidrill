id: sc500-3b-edr-settings-map
objective: "3.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys enabled Defender for Servers Plan 2 on an Azure subscription. You review the **Settings and monitoring** page of the plan to meet the following requirements.

    Which setting meets each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys a activé Defender for Servers Plan 2 sur un abonnement Azure. Vous examinez la page **Settings and monitoring** du plan pour répondre aux exigences suivantes.

    Quel paramètre répond à chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ep, text: Endpoint protection }
    - { id: va, text: Vulnerability assessment for machines }
    - { id: agentless, text: Agentless scanning for machines }
    - { id: fim, text: File integrity monitoring }
    - { id: jit, text: Just-in-time VM access }
  targets:
    - { id: t1, text: { en: "Automatically provision the Defender for Endpoint sensor on new VMs", fr: "Approvisionner automatiquement le capteur Defender for Endpoint sur les nouvelles machines virtuelles" } }
    - { id: t2, text: { en: "Choose the vulnerability assessment solution by using Edit configuration", fr: "Choisir la solution d'évaluation des vulnérabilités avec Edit configuration" } }
    - { id: t3, text: { en: "Find plaintext secrets on VM disks without installing anything on the VMs", fr: "Trouver des secrets en texte clair sur les disques des machines virtuelles sans rien installer sur celles-ci" } }
    - { id: t4, text: { en: "Track changes to critical files and registry keys", fr: "Suivre les modifications des fichiers critiques et des clés de Registre" } }
answer:
  mapping: { t1: ep, t2: va, t3: agentless, t4: fim }
explanation:
  correct:
    en: |
      Endpoint protection integrates Defender for Endpoint and enables automatic provisioning of its agent. Vulnerability assessment for machines has an Edit configuration option to choose the assessment solution (Defender Vulnerability Management). Agentless scanning for machines analyzes disk snapshots and includes secrets scanning. File integrity monitoring tracks changes to files and registry keys and is off by default.
    fr: |
      Endpoint protection intègre Defender for Endpoint et active l'approvisionnement automatique de son agent. Vulnerability assessment for machines propose l'option Edit configuration pour choisir la solution d'évaluation (Defender Vulnerability Management). Agentless scanning for machines analyse des instantanés de disques et inclut l'analyse des secrets. File integrity monitoring suit les modifications des fichiers et des clés de Registre et est désactivé par défaut.
  options:
    jit: { en: "Just-in-time VM access controls inbound management ports; it isn't a setting of the Settings and monitoring page and meets none of the requirements.", fr: "L'accès juste-à-temps contrôle les ports de gestion entrants ; ce n'est pas un paramètre de la page Settings and monitoring et il ne répond à aucune des exigences." }
references:
  - title: Modify Defender for Servers plan settings in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/configure-servers-coverage
  - title: Enable vulnerability scanning with Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management
