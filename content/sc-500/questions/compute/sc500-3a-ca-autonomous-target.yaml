id: sc500-3a-ca-autonomous-target
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has an agent named **InvoiceSweeper** that was created from the agent identity blueprint **bp-finance**. Every night, InvoiceSweeper runs without a signed-in user and calls Microsoft Graph by using its own agent identity.

    You need to create a Conditional Access policy that blocks InvoiceSweeper when Microsoft Entra ID Protection reports a high agent risk. Other agents created from bp-finance must not be affected.

    What should you configure under **Users, agents or workload identities** in the policy?
  fr: |
    Fabrikam, Inc. dispose d'un agent nommé **InvoiceSweeper**, créé à partir du blueprint d'identité d'agent **bp-finance**. Chaque nuit, InvoiceSweeper s'exécute sans utilisateur connecté et appelle Microsoft Graph à l'aide de sa propre identité d'agent.

    Vous devez créer une stratégie d'accès conditionnel qui bloque InvoiceSweeper lorsque Microsoft Entra ID Protection signale un risque d'agent élevé. Les autres agents créés à partir de bp-finance ne doivent pas être affectés.

    Que devez-vous configurer sous **Users, agents or workload identities** dans la stratégie ?
body:
  options:
    - { id: a, text: { en: "Select Users, and then include the group that contains the developers of InvoiceSweeper.", fr: "Sélectionner Users, puis inclure le groupe qui contient les développeurs d'InvoiceSweeper." } }
    - { id: b, text: { en: "Select Workload identities, and then include the service principal of bp-finance.", fr: "Sélectionner Workload identities, puis inclure le principal de service de bp-finance." } }
    - { id: c, text: { en: "Select Agents, and then include the InvoiceSweeper agent identity.", fr: "Sélectionner Agents, puis inclure l'identité d'agent InvoiceSweeper." } }
    - { id: d, text: { en: "Select Agents, and then include All agent users (Preview).", fr: "Sélectionner Agents, puis inclure All agent users (Preview)." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      InvoiceSweeper is an autonomous agent: the subject of its access tokens is its agent identity, so the policy must target that agent identity under Agents. Selecting the individual agent identity (instead of the blueprint) keeps the other agents created from bp-finance out of scope. The Agent risk (Preview) condition set to High and the Block grant control complete the policy.
    fr: |
      InvoiceSweeper est un agent autonome : le sujet de ses jetons d'accès est son identité d'agent, la stratégie doit donc cibler cette identité d'agent sous Agents. Sélectionner l'identité d'agent individuelle (et non le blueprint) laisse hors de portée les autres agents créés à partir de bp-finance. La condition Agent risk (Preview) réglée sur High et le contrôle d'octroi Block complètent la stratégie.
  options:
    a:
      en: |
        Policies that target users apply to tokens whose subject is a user, such as on-behalf-of requests. They are not evaluated when the agent signs in with its own agent identity.
      fr: |
        Les stratégies qui ciblent des utilisateurs s'appliquent aux jetons dont le sujet est un utilisateur, comme les requêtes on-behalf-of. Elles ne sont pas évaluées quand l'agent se connecte avec sa propre identité d'agent.
    b:
      en: |
        Agent identities are targeted under Agents, not Workload identities. Targeting the blueprint would also include every other agent created from bp-finance.
      fr: |
        Les identités d'agent se ciblent sous Agents, pas sous Workload identities. Cibler le blueprint inclurait en outre tous les autres agents créés à partir de bp-finance.
    d:
      en: |
        All agent users targets the agents' user accounts. InvoiceSweeper authenticates with its agent identity, and a policy on agent user accounts does not apply to agent identities.
      fr: |
        All agent users cible les comptes d'utilisateur des agents. InvoiceSweeper s'authentifie avec son identité d'agent, et une stratégie sur les comptes d'utilisateur d'agent ne s'applique pas aux identités d'agent.
references:
  - title: Secure autonomous agents with Conditional Access
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-autonomous-agents
  - title: Target agent identities in Microsoft Entra Conditional Access policies
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/howto-target-agent-identities
