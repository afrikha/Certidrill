id: sc500-3b-mdfs-onboard-paths
objective: "3.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has servers in several environments. You need to protect them with Microsoft Defender for Servers in Defender for Cloud. Each server must get the capabilities described below.

    Which onboarding method should you use for each server group? To answer, drag the appropriate methods to the correct server groups. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de serveurs dans plusieurs environnements. Vous devez les protéger avec Microsoft Defender for Servers dans Defender for Cloud. Chaque serveur doit obtenir les fonctionnalités décrites ci-dessous.

    Quelle méthode d'intégration devez-vous utiliser pour chaque groupe de serveurs ? Pour répondre, faites glisser les méthodes appropriées vers les groupes de serveurs correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: plan, text: { en: "Turn on the Servers plan for the subscription", fr: "Activer le plan Servers pour l'abonnement" } }
    - { id: aws, text: { en: "Connect the account to Defender for Cloud with a multicloud connector", fr: "Connecter le compte à Defender for Cloud avec un connecteur multicloud" } }
    - { id: arc, text: { en: "Install the Azure Connected Machine agent and connect the servers to Azure Arc", fr: "Installer l'agent Azure Connected Machine et connecter les serveurs à Azure Arc" } }
    - { id: direct, text: { en: "Use direct onboarding with Defender for Endpoint", fr: "Utiliser l'intégration directe avec Defender for Endpoint" } }
    - { id: ama, text: { en: "Install the Azure Monitor Agent with a data collection rule", fr: "Installer l'agent Azure Monitor avec une règle de collecte de données" } }
  targets:
    - { id: t1, text: { en: "Azure VMs in a subscription where Defender for Servers is off", fr: "Machines virtuelles Azure d'un abonnement où Defender for Servers est désactivé" } }
    - { id: t2, text: { en: "Amazon EC2 instances in an AWS account", fr: "Instances Amazon EC2 d'un compte AWS" } }
    - { id: t3, text: { en: "On-premises servers that need file integrity monitoring and Azure Policy", fr: "Serveurs locaux qui ont besoin de la surveillance de l'intégrité des fichiers et d'Azure Policy" } }
    - { id: t4, text: { en: "On-premises servers already in Defender for Endpoint that need only Plan 1 capabilities and must not be connected to Azure Arc", fr: "Serveurs locaux déjà présents dans Defender for Endpoint qui n'ont besoin que des fonctionnalités du Plan 1 et ne doivent pas être connectés à Azure Arc" } }
answer:
  mapping: { t1: plan, t2: aws, t3: arc, t4: direct }
explanation:
  correct:
    en: |
      Azure VMs are covered as soon as the Servers plan is on for their subscription. AWS accounts and GCP projects are connected to Defender for Cloud with a connector, which by default onboards the machines as Azure Arc-enabled servers. On-premises servers need Azure Arc for full Defender for Servers functionality and for Azure Policy, whereas direct onboarding through Defender for Endpoint, without Arc, provides only Plan 1 functionality.
    fr: |
      Les machines virtuelles Azure sont couvertes dès que le plan Servers est activé pour leur abonnement. Les comptes AWS et projets GCP sont connectés à Defender for Cloud avec un connecteur, qui intègre par défaut les machines comme serveurs avec Azure Arc. Les serveurs locaux ont besoin d'Azure Arc pour toutes les fonctionnalités de Defender for Servers et pour Azure Policy, alors que l'intégration directe via Defender for Endpoint, sans Arc, ne fournit que les fonctionnalités du Plan 1.
  options:
    ama: { en: "The Azure Monitor Agent collects logs into Log Analytics; it doesn't onboard servers to Defender for Servers.", fr: "L'agent Azure Monitor collecte des journaux dans Log Analytics ; il n'intègre pas les serveurs à Defender for Servers." }
references:
  - title: Protect your servers with Defender for Servers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-servers-plan
  - title: Enable Defender for Endpoint integration in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-defender-for-endpoint
