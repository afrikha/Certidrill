id: sc500-3a-dspm-policies-map
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Purview DSPM for AI and wants to activate one-click policies from the recommendations. You need to meet the following requirements:

    - Calculate user risk from risky prompts and responses in Microsoft 365 Copilot, agents and other generative AI apps.
    - Detect when users browse to AI sites.
    - Capture the prompts and responses of ChatGPT Enterprise.

    Which policy should you activate for each requirement? To answer, drag the appropriate policies to the correct requirements. Each policy may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise Microsoft Purview DSPM for AI et souhaite activer des stratégies en un clic depuis les recommandations. Vous devez respecter les exigences suivantes :

    - calculer le risque utilisateur à partir des prompts et réponses à risque dans Microsoft 365 Copilot, les agents et les autres applications d'IA générative ;
    - détecter quand des utilisateurs naviguent vers des sites d'IA ;
    - capturer les prompts et les réponses de ChatGPT Enterprise.

    Quelle stratégie devez-vous activer pour chaque exigence ? Pour répondre, faites glisser les stratégies appropriées vers les exigences correspondantes. Chaque stratégie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: risky, text: "DSPM for AI - Detect risky AI usage" }
    - { id: visit, text: "DSPM for AI - Detect when users visit AI sites" }
    - { id: enterprise, text: "DSPM for AI - Capture interactions for enterprise AI apps" }
    - { id: unethical, text: "DSPM for AI - Unethical behavior in AI apps" }
    - { id: copilotexp, text: "DSPM for AI - Capture interactions for Copilot experiences" }
  targets:
    - { id: t1, text: { en: "Calculate user risk from risky prompts and responses", fr: "Calculer le risque utilisateur à partir des prompts et réponses à risque" } }
    - { id: t2, text: { en: "Detect browsing to AI sites", fr: "Détecter la navigation vers des sites d'IA" } }
    - { id: t3, text: { en: "Capture ChatGPT Enterprise prompts and responses", fr: "Capturer les prompts et réponses de ChatGPT Enterprise" } }
answer:
  mapping: { t1: risky, t2: visit, t3: enterprise }
explanation:
  correct:
    en: |
      Detect risky AI usage is an Insider Risk Management policy that calculates user risk from risky prompts and responses. Detect when users visit AI sites is an Insider Risk Management policy that detects browsing to AI sites. Capture interactions for enterprise AI apps is a collection policy for enterprise AI apps such as ChatGPT Enterprise and apps connected through Microsoft Entra or Microsoft Foundry.
    fr: |
      Detect risky AI usage est une stratégie Insider Risk Management qui calcule le risque utilisateur à partir des prompts et réponses à risque. Detect when users visit AI sites est une stratégie Insider Risk Management qui détecte la navigation vers des sites d'IA. Capture interactions for enterprise AI apps est une stratégie de collecte pour les applications d'IA d'entreprise comme ChatGPT Enterprise et les applications connectées via Microsoft Entra ou Microsoft Foundry.
  options:
    unethical:
      en: |
        Unethical behavior in AI apps is a Communication Compliance policy that detects sensitive information in prompts and responses; it does not calculate user risk.
      fr: |
        Unethical behavior in AI apps est une stratégie Communication Compliance qui détecte des informations sensibles dans les prompts et réponses ; elle ne calcule pas de risque utilisateur.
    copilotexp:
      en: |
        Capture interactions for Copilot experiences collects prompts and responses from Copilot in Fabric and Security Copilot, not from ChatGPT Enterprise.
      fr: |
        Capture interactions for Copilot experiences collecte les prompts et réponses de Copilot dans Fabric et de Security Copilot, pas de ChatGPT Enterprise.
references:
  - title: Considerations for DSPM for AI to manage data security and compliance protections for AI interactions - (classic)
    url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview-considerations
