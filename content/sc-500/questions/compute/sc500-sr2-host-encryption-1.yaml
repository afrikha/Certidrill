id: sc500-sr2-host-encryption-1
objective: "3.2.1"
type: series_yesno
series: sc500-sr2-host-encryption
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You switch the disks of VM1 to a disk encryption set that uses key1.
  fr: Vous basculez les disques de VM1 vers un jeu de chiffrement de disque qui utilise key1.
body:
  solution:
    en: You create a disk encryption set named **DES1** with the encryption type **Encryption at-rest with a customer-managed key** and key1, and you grant DES1 access to KV1. You deallocate VM1, configure the OS disk and both data disks to use DES1, and start VM1.
    fr: Vous créez un jeu de chiffrement de disque nommé **DES1** avec le type de chiffrement **Encryption at-rest with a customer-managed key** et key1, puis vous accordez à DES1 l'accès à KV1. Vous libérez VM1, configurez le disque de système d'exploitation et les deux disques de données pour utiliser DES1, puis démarrez VM1.
answer: { value: false }
explanation:
  correct:
    en: Server-side encryption with a disk encryption set protects the OS and data disks with key1 when the data is stored on the storage clusters, without using the VM's CPU. It does not encrypt the temporary disk or the disk caches, and data does not flow encrypted from the host, so the first two requirements are not met.
    fr: "Le chiffrement côté serveur avec un jeu de chiffrement de disque protège les disques de système d'exploitation et de données avec key1 lorsque les données sont stockées sur les clusters de stockage, sans utiliser le processeur de la machine virtuelle. Il ne chiffre ni le disque temporaire ni les caches de disque, et les données ne circulent pas chiffrées depuis l'hôte : les deux premières exigences ne sont pas satisfaites."
references:
  - title: Overview of managed disk encryption options - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
