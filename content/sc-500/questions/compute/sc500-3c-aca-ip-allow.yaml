id: sc500-3c-aca-ip-allow
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a container app named **app-partners** with external ingress in an external Azure Container Apps environment. The app has the following IP ingress restriction rules.

    | Rule name | Action | IP address range |
    | --- | --- | --- |
    | block-scan1 | Deny | 192.0.2.0/24 |
    | block-scan2 | Deny | 198.51.100.0/24 |

    A new requirement states that app-partners must accept traffic only from the partner network 203.0.113.0/24.

    What should you do?
  fr: |
    Adatum dispose d'une application conteneur nommée **app-partners** dont l'entrée est externe, dans un environnement Azure Container Apps externe. L'application possède les règles de restriction d'entrée IP suivantes.

    | Nom de la règle | Action | Plage d'adresses IP |
    | --- | --- | --- |
    | block-scan1 | Deny | 192.0.2.0/24 |
    | block-scan2 | Deny | 198.51.100.0/24 |

    Une nouvelle exigence impose qu'app-partners n'accepte que le trafic du réseau partenaire 203.0.113.0/24.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an Allow rule for 203.0.113.0/24 and keep both Deny rules.", fr: "Ajouter une règle Allow pour 203.0.113.0/24 et conserver les deux règles Deny." } }
    - { id: b, text: { en: "Add a Deny rule for 0.0.0.0/0 and an Allow rule for 203.0.113.0/24.", fr: "Ajouter une règle Deny pour 0.0.0.0/0 et une règle Allow pour 203.0.113.0/24." } }
    - { id: c, text: { en: "Remove both Deny rules, then add an Allow rule for 203.0.113.0/24.", fr: "Supprimer les deux règles Deny, puis ajouter une règle Allow pour 203.0.113.0/24." } }
    - { id: d, text: { en: "Change the ingress of app-partners to Internal and add an Allow rule for 203.0.113.0/24.", fr: "Passer l'entrée d'app-partners en Internal et ajouter une règle Allow pour 203.0.113.0/24." } }
answer: { optionId: c }
explanation:
  correct:
    en: "All the IP restriction rules of a container app must be of the same type, so you must delete the existing Deny rules before you add Allow rules. When only Allow rules exist, inbound traffic is accepted only from the listed ranges, which also blocks the two scanner ranges."
    fr: "Toutes les règles de restriction IP d'une application conteneur doivent être du même type : vous devez supprimer les règles Deny existantes avant d'ajouter des règles Allow. Lorsque seules des règles Allow existent, le trafic entrant n'est accepté que depuis les plages listées, ce qui bloque aussi les deux plages des scanners."
  options:
    a:
      en: "Allow and Deny rules cannot be combined on the same app, so the Allow rule cannot be added while Deny rules exist."
      fr: "Les règles Allow et Deny ne peuvent pas être combinées sur la même application : la règle Allow ne peut pas être ajoutée tant que des règles Deny existent."
    b:
      en: "This option also mixes Deny and Allow rules, which Container Apps does not support."
      fr: "Cette option mélange elle aussi des règles Deny et Allow, ce que Container Apps ne prend pas en charge."
    d:
      en: "Internal ingress makes the app reachable only from apps in the same environment, so the partner network could not reach it."
      fr: "Une entrée interne rend l'application accessible uniquement depuis les applications du même environnement : le réseau partenaire ne pourrait pas la joindre."
references:
  - title: Set up IP ingress restrictions in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/ip-restrictions
