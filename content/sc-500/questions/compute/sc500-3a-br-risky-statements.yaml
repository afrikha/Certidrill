id: sc500-3a-br-risky-statements
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Entra ID Protection for agents. A Conditional Access policy named **CA-AgentRisk** is enabled. It targets All agent identities and blocks access when the agent risk is High.

    Some agents act autonomously with their own agent identity, and others act on behalf of signed-in users by using the on-behalf-of flow.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Entra ID Protection pour les agents. Une stratégie d'accès conditionnel nommée **CA-AgentRisk** est activée. Elle cible All agent identities et bloque l'accès lorsque le risque d'agent est High.

    Certains agents agissent de façon autonome avec leur propre identité d'agent, d'autres agissent pour le compte d'utilisateurs connectés à l'aide du flux on-behalf-of.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If you select Confirm compromise for an agent in the Risky Agents report, CA-AgentRisk blocks that agent's next token requests.
        fr: |
          Si vous sélectionnez Confirm compromise pour un agent dans le rapport Risky Agents, CA-AgentRisk bloque les prochaines demandes de jeton de cet agent.
    - id: s2
      text:
        en: |
          When an agent that uses the on-behalf-of flow performs risky activity, ID Protection raises the risk of the agent identity.
        fr: |
          Lorsqu'un agent qui utilise le flux on-behalf-of a une activité à risque, ID Protection augmente le risque de l'identité d'agent.
    - id: s3
      text:
        en: |
          The Agent detections tab of the Risk Detections report shows detections from the past 90 days.
        fr: |
          L'onglet Agent detections du rapport Risk Detections affiche les détections des 90 derniers jours.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Confirm compromise sets the agent's risk level to High, records a detection and triggers risk-based Conditional Access policies that block High agent risk. In on-behalf-of flows the agent uses the user's delegated permissions, so risky activity is attributed to the user, not to the agent; the agent detections cover autonomous activity. Agent detections are kept for up to 90 days; export them with diagnostic settings to keep them longer.
    fr: |
      Confirm compromise fait passer le niveau de risque de l'agent à High, enregistre une détection et déclenche les stratégies d'accès conditionnel basées sur le risque qui bloquent un risque d'agent High. Dans les flux on-behalf-of, l'agent utilise les autorisations déléguées de l'utilisateur : l'activité à risque est donc attribuée à l'utilisateur, pas à l'agent ; les détections d'agent couvrent l'activité autonome. Les détections d'agent sont conservées jusqu'à 90 jours ; exportez-les avec des paramètres de diagnostic pour les garder plus longtemps.
references:
  - title: ID Protection for agents
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-risky-agents
