id: sc500-3a-aid-sponsor-required
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a provisioning service that creates agent identities from an agent identity blueprint. The service calls Microsoft Graph by using application permissions, without a signed-in user.

    You need to ensure that the creation requests sent by the service succeed.

    What must each request specify for the new agent identity?
  fr: |
    Contoso, Ltd. dispose d'un service de provisionnement qui crée des identités d'agent à partir d'un blueprint d'identité d'agent. Le service appelle Microsoft Graph à l'aide d'autorisations d'application, sans utilisateur connecté.

    Vous devez faire en sorte que les requêtes de création envoyées par le service aboutissent.

    Que doit spécifier chaque requête pour la nouvelle identité d'agent ?
body:
  options:
    - { id: a, text: { en: "At least one owner, such as a developer of the agent", fr: "Au moins un propriétaire, par exemple un développeur de l'agent" } }
    - { id: b, text: { en: "A manager, such as the team lead who uses the agent", fr: "Un responsable, par exemple le chef d'équipe qui utilise l'agent" } }
    - { id: c, text: { en: "A paired agent user account, such as an account with a mailbox", fr: "Un compte d'utilisateur d'agent associé, par exemple un compte doté d'une boîte aux lettres" } }
    - { id: d, text: { en: "At least one sponsor, such as a user or a supported group", fr: "Au moins un sponsor, par exemple un utilisateur ou un groupe pris en charge" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A sponsor is required when an agent identity or an agent identity blueprint is created. With delegated creation the calling user becomes the sponsor automatically if none is specified, but an app-only caller must set one or more users or supported groups as sponsors itself.
    fr: |
      Un sponsor est obligatoire lors de la création d'une identité d'agent ou d'un blueprint d'identité d'agent. En création déléguée, l'utilisateur appelant devient automatiquement sponsor si aucun n'est indiqué, mais un appelant en mode application uniquement doit lui-même définir un ou plusieurs utilisateurs ou groupes pris en charge comme sponsors.
  options:
    a:
      en: |
        Owners handle technical administration and are optional for every agent identity object.
      fr: |
        Les propriétaires assurent l'administration technique et sont facultatifs pour tous les objets d'identité d'agent.
    b:
      en: |
        A manager is an optional individual user, mainly set on the agent's user account.
      fr: |
        Un responsable est un utilisateur individuel facultatif, défini surtout sur le compte d'utilisateur de l'agent.
    c:
      en: |
        An agent user account is optional and is used only when the agent must access systems that require a user object.
      fr: |
        Un compte d'utilisateur d'agent est facultatif et ne sert que lorsque l'agent doit accéder à des systèmes qui exigent un objet utilisateur.
references:
  - title: Administrative relationships in Microsoft Entra Agent ID (Owners, sponsors, and managers)
    url: https://learn.microsoft.com/en-us/entra/agent-id/agent-owners-sponsors-managers
