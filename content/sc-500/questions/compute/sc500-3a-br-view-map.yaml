id: sc500-3a-br-view-map
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has an agent named **ProcureAssist** that was built in Microsoft Foundry and has a Microsoft Entra agent identity. Security for AI agents is enabled in the Microsoft Defender portal.

    You need to view the attack paths that start at the ProcureAssist agent identity and end at sensitive data or privileged accounts.

    What should you do in the Microsoft Defender portal?
  fr: |
    Contoso, Ltd. dispose d'un agent nommé **ProcureAssist**, créé dans Microsoft Foundry et doté d'une identité d'agent Microsoft Entra. La sécurité des agents d'IA est activée dans le portail Microsoft Defender.

    Vous devez afficher les chemins d'attaque qui partent de l'identité d'agent de ProcureAssist et aboutissent à des données sensibles ou à des comptes privilégiés.

    Que devez-vous faire dans le portail Microsoft Defender ?
body:
  options:
    - { id: a, text: { en: "In Assets > AI Agents, select ProcureAssist, and then select View on map.", fr: "Dans Assets > AI Agents, sélectionner ProcureAssist, puis sélectionner View on map." } }
    - { id: b, text: { en: "In Incidents & alerts, open the latest incident for ProcureAssist, and then select Attack story.", fr: "Dans Incidents & alerts, ouvrir le dernier incident de ProcureAssist, puis sélectionner Attack story." } }
    - { id: c, text: { en: "In Settings > Security for AI, open Policies & rules, and then review the Real-time protection rules.", fr: "Dans Settings > Security for AI, ouvrir Policies & rules, puis examiner les règles Real-time protection." } }
    - { id: d, text: { en: "In Advanced hunting, run a query on the BehaviorInfo table for ProcureAssist.", fr: "Dans Advanced hunting, exécuter une requête sur la table BehaviorInfo pour ProcureAssist." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For Foundry agents, selecting the agent in Assets > AI Agents opens a detail pane with posture insights, risk factors, permissions and knowledge sources. View on map shows the attack paths from the agent identity, through intermediate resources, to targets such as sensitive data or privileged accounts.
    fr: |
      Pour les agents Foundry, sélectionner l'agent dans Assets > AI Agents ouvre un volet de détails avec les informations de posture, les facteurs de risque, les autorisations et les sources de connaissances. View on map affiche les chemins d'attaque depuis l'identité d'agent, à travers les ressources intermédiaires, jusqu'à des cibles comme des données sensibles ou des comptes privilégiés.
  options:
    b:
      en: |
        An incident's attack story shows how an attack that already happened unfolded; it does not map the potential exposure of the agent.
      fr: |
        Le récit d'attaque d'un incident montre le déroulement d'une attaque déjà survenue ; il ne cartographie pas l'exposition potentielle de l'agent.
    c:
      en: |
        Real-time protection rules audit or block risky agent actions at runtime; they do not show attack paths.
      fr: |
        Les règles de protection en temps réel auditent ou bloquent les actions risquées des agents à l'exécution ; elles n'affichent pas de chemins d'attaque.
    d:
      en: |
        BehaviorInfo records behaviors that runtime protection audited or blocked; it does not compute paths to sensitive targets.
      fr: |
        BehaviorInfo enregistre les comportements audités ou bloqués par la protection à l'exécution ; cette table ne calcule pas de chemins vers des cibles sensibles.
references:
  - title: Assess blast radius and attack paths
    url: https://learn.microsoft.com/en-us/training/modules/analyze-ai-identity-risks-defender-xdr/3-assess-blast-radius-attack-paths
