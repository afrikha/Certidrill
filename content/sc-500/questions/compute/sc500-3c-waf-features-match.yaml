id: sc500-3c-waf-features-match
objective: "3.3.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Application Gateway WAF_v2 named **agw-shop** that publishes https://shop.fabrikam.com. The URL path map of agw-shop contains a path-based rule for `/payment/*`. A WAF policy named **wafp-global** is associated with the gateway and uses the OWASP CRS 3.2 rule set.

    You need to meet the following requirements.

    Which WAF feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une Application Gateway WAF_v2 nommée **agw-shop** qui publie https://shop.fabrikam.com. Le mappage de chemins d'URL d'agw-shop contient une règle basée sur le chemin pour `/payment/*`. Une stratégie WAF nommée **wafp-global** est associée à la passerelle et utilise l'ensemble de règles OWASP CRS 3.2.

    Vous devez répondre aux exigences suivantes.

    Quelle fonctionnalité du WAF devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: geo, text: { en: "A custom rule with the Geomatch operator", fr: "Une règle personnalisée avec l'opérateur Geomatch" } }
    - { id: bot, text: { en: "The Bot Manager rule set", fr: "L'ensemble de règles Bot Manager" } }
    - { id: excl, text: { en: "An exclusion", fr: "Une exclusion" } }
    - { id: peruri, text: { en: "A second WAF policy associated with the path-based rule", fr: "Une seconde stratégie WAF associée à la règle basée sur le chemin" } }
    - { id: detect, text: { en: "Detection mode", fr: "Le mode Detection" } }
    - { id: listener, text: { en: "A second WAF policy associated with the listener", fr: "Une seconde stratégie WAF associée à l'écouteur" } }
  targets:
    - { id: t1, text: { en: "Block every request that comes from outside the countries where Fabrikam sells.", fr: "Bloquer toute requête provenant d'un pays où Fabrikam ne vend pas." } }
    - { id: t2, text: { en: "Block malicious bots while allowing verified search engine crawlers.", fr: "Bloquer les bots malveillants tout en autorisant les robots d'indexation vérifiés des moteurs de recherche." } }
    - { id: t3, text: { en: "Stop the managed rules from inspecting the value of the `session-token` cookie, which causes false positives.", fr: "Empêcher les règles managées d'inspecter la valeur du cookie `session-token`, qui provoque des faux positifs." } }
    - { id: t4, text: { en: "Apply a stricter rule configuration to the `/payment/*` pages only.", fr: "Appliquer une configuration de règles plus stricte aux seules pages `/payment/*`." } }
answer:
  mapping: { t1: geo, t2: bot, t3: excl, t4: peruri }
explanation:
  correct:
    en: "Custom rules support the Geomatch operator to allow or block countries or regions. The Bot Manager rule set blocks bad bots and allows verified search engine crawlers by default. An exclusion removes a header, cookie or argument from inspection. A policy associated with a path-based rule (per-URI) overrides the global and per-site policies for those URIs only."
    fr: "Les règles personnalisées prennent en charge l'opérateur Geomatch pour autoriser ou bloquer des pays ou régions. L'ensemble de règles Bot Manager bloque par défaut les bots malveillants et autorise les robots d'indexation vérifiés. Une exclusion retire un en-tête, un cookie ou un argument de l'inspection. Une stratégie associée à une règle basée sur le chemin (par URI) remplace les stratégies globale et par site pour ces seules URI."
  options:
    detect:
      en: "Detection mode logs threats but blocks nothing, for every request."
      fr: "Le mode Detection journalise les menaces mais ne bloque rien, pour toutes les requêtes."
    listener:
      en: "A per-site policy on the listener applies to the whole site, not only to `/payment/*`."
      fr: "Une stratégie par site sur l'écouteur s'applique à tout le site, pas seulement à `/payment/*`."
references:
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
  - title: Azure Web Application Firewall (WAF) policy overview
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/policy-overview
