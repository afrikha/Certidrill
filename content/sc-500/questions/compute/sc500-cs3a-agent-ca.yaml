id: sc500-cs3a-agent-ca
objective: "3.1.4"
type: yesno_statements
caseStudy: sc500-cs3a-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You create CA-AgentRisk to meet the Conditional Access requirement. The policy targets the bp-research agent identity blueprint and blocks access when the agent risk is high.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez CA-AgentRisk pour satisfaire l'exigence d'accès conditionnel. La stratégie cible le blueprint d'identité d'agent bp-research et bloque l'accès lorsque le risque de l'agent est élevé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          CA-AgentRisk applies to an agent identity that the platform team creates from bp-research next month.
        fr: |-
          CA-AgentRisk s'applique à une identité d'agent que l'équipe plateforme créera à partir de bp-research le mois prochain.
    - id: s2
      text:
        en: |-
          CA-AgentRisk applies when the agent user account of agt-lit-review signs in to the shared mailbox.
        fr: |-
          CA-AgentRisk s'applique lorsque le compte d'utilisateur d'agent de agt-lit-review se connecte à la boîte aux lettres partagée.
    - id: s3
      text:
        en: |-
          CA-AgentRisk is evaluated when agt-assay calls the assay data API through its current connection.
        fr: |-
          CA-AgentRisk est évaluée lorsque agt-assay appelle l'API de données d'essais par sa connexion actuelle.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      A policy that targets an agent identity blueprint applies to every agent identity created from that blueprint, including identities created later. It covers only the agent identities, not agent user accounts, which need a separate policy that targets Agent Users. Conditional Access is enforced when Microsoft Entra ID issues a token, so it does not apply when an agent authenticates with an API key.
    fr: |-
      Une stratégie qui cible un blueprint d'identité d'agent s'applique à toutes les identités d'agent créées à partir de ce blueprint, y compris celles créées plus tard. Elle ne couvre que les identités d'agent, pas les comptes d'utilisateur d'agent, qui demandent une stratégie distincte ciblant Agent Users. L'accès conditionnel s'applique quand Microsoft Entra ID émet un jeton : il ne s'applique donc pas quand un agent s'authentifie avec une clé API.
  options:
    s2:
      en: |-
        A policy scoped to a blueprint or to an agent identity does not apply to the agent's user account; target Agent Users in another policy.
      fr: |-
        Une stratégie limitée à un blueprint ou à une identité d'agent ne s'applique pas au compte d'utilisateur de l'agent ; ciblez Agent Users dans une autre stratégie.
    s3:
      en: |-
        The connection uses an API key instead of a token issued by Microsoft Entra ID, so no Conditional Access policy is evaluated.
      fr: |-
        La connexion utilise une clé API au lieu d'un jeton émis par Microsoft Entra ID : aucune stratégie d'accès conditionnel n'est évaluée.
references:
  - title: Conditional Access for agents
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
