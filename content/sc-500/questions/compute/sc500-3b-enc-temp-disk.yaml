id: sc500-3b-enc-temp-disk
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to deploy a new Azure virtual machine named **VM1** that will process payment data. VM1 uses managed disks and a supported VM size.

    The security policy requires that the temporary disk and the disk caches of VM1 are encrypted at rest, and that data flowing between the compute host and storage is encrypted. The encryption must not consume the CPU resources of VM1.

    What should you use?
  fr: |
    Contoso prévoit de déployer une nouvelle machine virtuelle Azure nommée **VM1** qui traitera des données de paiement. VM1 utilise des disques managés et une taille de machine virtuelle prise en charge.

    La stratégie de sécurité exige que le disque temporaire et les caches de disque de VM1 soient chiffrés au repos, et que les données échangées entre l'hôte de calcul et le stockage soient chiffrées. Le chiffrement ne doit pas consommer les ressources processeur de VM1.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Disk Encryption with a key encryption key", fr: "Azure Disk Encryption avec une clé de chiffrement à clé" } }
    - { id: b, text: { en: "Encryption at host with platform-managed keys", fr: "Le chiffrement sur l'hôte avec des clés gérées par la plateforme" } }
    - { id: c, text: { en: "Server-side encryption with a customer-managed key in a disk encryption set", fr: "Le chiffrement côté serveur avec une clé gérée par le client dans un jeu de chiffrement de disque" } }
    - { id: d, text: { en: "Double encryption at rest with platform-managed keys", fr: "Le double chiffrement au repos avec des clés gérées par la plateforme" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Encryption at host starts on the VM host, so the temp disk and the disk caches are encrypted at rest and data flows encrypted to the storage clusters. It doesn't use the VM's CPU and is the option Microsoft recommends for new VMs.
    fr: |
      Le chiffrement sur l'hôte commence sur l'hôte de la machine virtuelle : le disque temporaire et les caches de disque sont chiffrés au repos et les données circulent chiffrées jusqu'aux clusters de stockage. Il n'utilise pas le processeur de la machine virtuelle et c'est l'option que Microsoft recommande pour les nouvelles machines virtuelles.
  options:
    a: { en: "Azure Disk Encryption encrypts inside the guest with BitLocker or DM-Crypt, so it uses the VM's CPU; it is also scheduled for retirement on September 15, 2028.", fr: "Azure Disk Encryption chiffre dans l'invité avec BitLocker ou DM-Crypt : il utilise le processeur de la machine virtuelle ; sa mise hors service est en outre prévue le 15 septembre 2028." }
    c: { en: "Server-side encryption, with platform or customer-managed keys, doesn't encrypt temp disks or disk caches.", fr: "Le chiffrement côté serveur, avec des clés gérées par la plateforme ou par le client, ne chiffre ni les disques temporaires ni les caches de disque." }
    d: { en: "Double encryption at rest adds an infrastructure layer for persisted OS and data disks, snapshots and images; it doesn't cover temp disks or caches.", fr: "Le double chiffrement au repos ajoute une couche au niveau de l'infrastructure pour les disques de système d'exploitation et de données persistants, les instantanés et les images ; il ne couvre ni les disques temporaires ni les caches." }
references:
  - title: Overview of managed disk encryption options
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
  - title: Server-side encryption of Azure managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption
