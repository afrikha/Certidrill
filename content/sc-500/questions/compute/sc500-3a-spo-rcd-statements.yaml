id: sc500-3a-spo-rcd-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has Microsoft 365 Copilot licenses and SharePoint Advanced Management. A data access governance report shows that the SharePoint site **HR-Benefits** is overshared. While the site owners review its permissions, you enable restricted content discovery on HR-Benefits.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose de licences Microsoft 365 Copilot et de SharePoint Advanced Management. Un rapport de gouvernance de l'accès aux données montre que le site SharePoint **HR-Benefits** est surpartagé. Pendant que les propriétaires du site examinent ses autorisations, vous activez la découverte de contenu restreinte sur HR-Benefits.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who already has access to a file in HR-Benefits can still open the file from a direct link.
        fr: |
          Un utilisateur qui a déjà accès à un fichier de HR-Benefits peut toujours ouvrir le fichier à partir d'un lien direct.
    - id: s2
      text:
        en: |
          The content of HR-Benefits is removed from the Microsoft 365 search index, so eDiscovery searches no longer return it.
        fr: |
          Le contenu de HR-Benefits est supprimé de l'index de recherche Microsoft 365 ; les recherches eDiscovery ne le renvoient donc plus.
    - id: s3
      text:
        en: |
          You can apply the same setting to the OneDrive sites of the HR team members.
        fr: |
          Vous pouvez appliquer le même paramètre aux sites OneDrive des membres de l'équipe RH.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Restricted content discovery keeps a site out of organization-wide search and Copilot discovery without changing permissions, so people who have access still open its content. The content stays in the search index, and Microsoft Purview features such as eDiscovery and auto-labeling keep working. The setting is supported for SharePoint sites only, not for OneDrive sites.
    fr: |
      La découverte de contenu restreinte exclut un site de la recherche à l'échelle de l'organisation et de la découverte par Copilot sans modifier les autorisations : les personnes qui ont accès ouvrent toujours son contenu. Le contenu reste dans l'index de recherche, et les fonctionnalités Microsoft Purview comme eDiscovery et l'étiquetage automatique continuent de fonctionner. Le paramètre n'est pris en charge que pour les sites SharePoint, pas pour les sites OneDrive.
references:
  - title: Restrict discovery of SharePoint sites and content
    url: https://learn.microsoft.com/en-us/sharepoint/restricted-content-discovery
