id: sc500-3c-aks-local-accounts
objective: "3.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an AKS cluster named **aks-ops** that has been running for a year with Microsoft Entra integration. Administrators sometimes used `az aks get-credentials --admin` to connect. Microsoft Entra group **AKS-Admins** is configured as the cluster's Microsoft Entra administrators group.

    You run the following command:

    ```bash
    az aks update --resource-group RG1 --name aks-ops --disable-local-accounts
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un cluster AKS nommé **aks-ops**, en service depuis un an avec l'intégration Microsoft Entra. Les administrateurs se connectaient parfois avec `az aks get-credentials --admin`. Le groupe Microsoft Entra **AKS-Admins** est configuré comme groupe d'administrateurs Microsoft Entra du cluster.

    Vous exécutez la commande suivante :

    ```bash
    az aks update --resource-group RG1 --name aks-ops --disable-local-accounts
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Members of AKS-Admins can still retrieve the static admin kubeconfig by running `az aks get-credentials --admin`."
        fr: "Les membres d'AKS-Admins peuvent toujours récupérer le kubeconfig d'administration statique en exécutant `az aks get-credentials --admin`."
    - id: s2
      text:
        en: "You should rotate the cluster certificates to revoke the client certificates that administrators obtained before the change."
        fr: "Vous devez effectuer la rotation des certificats du cluster pour révoquer les certificats clients obtenus par les administrateurs avant la modification."
    - id: s3
      text:
        en: "If Northwind later deploys a private AKS cluster, authorized IP ranges can be added to it to limit which networks reach its API server."
        fr: "Si Northwind déploie ensuite un cluster AKS privé, des plages d'adresses IP autorisées pourront y être ajoutées pour limiter les réseaux qui joignent son serveur d'API."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "When local accounts are disabled, `az aks get-credentials --admin` fails for everyone because static credentials are no longer allowed; members of the Microsoft Entra administrators group connect with their non-admin (Microsoft Entra) credentials instead. On an existing cluster where local accounts were used, Microsoft requires rotating the cluster certificates to revoke the certificates already issued. Authorized IP ranges are not supported on private clusters."
    fr: "Lorsque les comptes locaux sont désactivés, `az aks get-credentials --admin` échoue pour tout le monde, car les informations d'identification statiques ne sont plus autorisées ; les membres du groupe d'administrateurs Microsoft Entra se connectent avec leurs informations d'identification Microsoft Entra (non administrateur). Sur un cluster existant où des comptes locaux ont été utilisés, Microsoft demande d'effectuer la rotation des certificats du cluster pour révoquer les certificats déjà émis. Les plages d'adresses IP autorisées ne sont pas prises en charge sur les clusters privés."
references:
  - title: Manage local accounts with Microsoft Entra integration
    url: https://learn.microsoft.com/en-us/azure/aks/manage-local-accounts-managed-azure-ad
  - title: Secure access to the API server using authorized IP address ranges in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/api-server-authorized-ip-ranges
