id: sc500-3b-bastion-nsg-rules
objective: "3.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum deploys Azure Bastion Standard in a virtual network named **VNet1** and associates a network security group named **NSG-Bastion** with **AzureBastionSubnet**. Users connect to VMs by using shareable links. NSG-Bastion contains the following custom rules.

    Answer each prompt by selecting the rule that provides the required traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie Azure Bastion Standard dans un réseau virtuel nommé **VNet1** et associe un groupe de sécurité réseau nommé **NSG-Bastion** à **AzureBastionSubnet**. Les utilisateurs se connectent aux machines virtuelles à l'aide de liens partageables. NSG-Bastion contient les règles personnalisées suivantes.

    Répondez à chaque consigne en sélectionnant la règle qui fournit le trafic exigé.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Lets the Azure control plane communicate with the bastion host", fr: "Permet au plan de contrôle Azure de communiquer avec l'hôte bastion" }
    - id: p2
      text: { en: "Is used for session validation, shareable links and certificate validation", fr: "Sert à la validation des sessions, aux liens partageables et à la validation des certificats" }
  grid:
    header: [{ en: "Direction", fr: "Direction" }, { en: "Name", fr: "Nom" }, { en: "Source", fr: "Source" }, { en: "Destination", fr: "Destination" }, Port]
    rows:
      - [{ text: { en: Inbound, fr: Entrant } }, { text: AllowHttpsInbound, area: r1 }, { text: Internet }, { text: Any }, { text: "443" }]
      - [{ text: { en: Inbound, fr: Entrant } }, { text: AllowGatewayManagerInbound, area: r2 }, { text: GatewayManager }, { text: Any }, { text: "443" }]
      - [{ text: { en: Inbound, fr: Entrant } }, { text: AllowAzureLoadBalancerInbound, area: r3 }, { text: AzureLoadBalancer }, { text: Any }, { text: "443" }]
      - [{ text: { en: Inbound, fr: Entrant } }, { text: AllowBastionHostCommunication, area: r4 }, { text: VirtualNetwork }, { text: VirtualNetwork }, { text: "8080, 5701" }]
      - [{ text: { en: Outbound, fr: Sortant } }, { text: AllowSshRdpOutbound, area: r5 }, { text: Any }, { text: VirtualNetwork }, { text: "22, 3389" }]
      - [{ text: { en: Outbound, fr: Sortant } }, { text: AllowAzureCloudOutbound, area: r6 }, { text: Any }, { text: AzureCloud }, { text: "443" }]
      - [{ text: { en: Outbound, fr: Sortant } }, { text: AllowHttpOutbound, area: r7 }, { text: Any }, { text: Internet }, { text: "80" }]
answer:
  values: { p1: r2, p2: r7 }
explanation:
  correct:
    en: |
      Inbound TCP 443 from the GatewayManager service tag lets the control plane (Gateway Manager) communicate with the bastion host. Outbound port 80 to the Internet is required for session validation, Bastion shareable links and certificate validation. The other rules are also required when an NSG is applied to AzureBastionSubnet, but for other purposes, such as health probes (AzureLoadBalancer), internal component communication (8080 and 5701) or diagnostics and metering logs (AzureCloud 443).
    fr: |
      Le trafic entrant TCP 443 depuis l'étiquette de service GatewayManager permet au plan de contrôle (Gateway Manager) de communiquer avec l'hôte bastion. Le port 80 sortant vers Internet est exigé pour la validation des sessions, les liens partageables Bastion et la validation des certificats. Les autres règles sont aussi exigées quand un NSG est appliqué à AzureBastionSubnet, mais pour d'autres usages, comme les sondes d'intégrité (AzureLoadBalancer), la communication entre les composants internes (8080 et 5701) ou les journaux de diagnostic et de mesure (AzureCloud 443).
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
