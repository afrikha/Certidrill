id: sc500-3b-mc-baseline-order
objective: "3.2.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a management group named **MG-Prod** that contains 500 existing Azure Windows VMs. More VMs are created every week. None of the VMs has the Machine Configuration extension or a managed identity.

    You need to report, for every current and future VM, whether the guest OS meets the Azure compute security baseline. You use Azure Policy.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'un groupe d'administration nommé **MG-Prod** qui contient 500 machines virtuelles Windows Azure existantes. De nouvelles machines virtuelles sont créées chaque semaine. Aucune machine virtuelle ne dispose de l'extension Machine Configuration ni d'une identité managée.

    Vous devez signaler, pour chaque machine virtuelle actuelle et future, si le système d'exploitation invité respecte la base de référence de sécurité de calcul Azure. Vous utilisez Azure Policy.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: prereq, text: { en: "Assign the Deploy prerequisites to enable Guest Configuration policies on virtual machines initiative to MG-Prod.", fr: "Attribuer à MG-Prod l'initiative Deploy prerequisites to enable Guest Configuration policies on virtual machines." } }
    - { id: remed, text: { en: "Create a remediation task for the prerequisites assignment.", fr: "Créer une tâche de correction pour l'attribution des prérequis." } }
    - { id: baseline, text: { en: "Assign the Windows machines should meet requirements of the Azure compute security baseline policy to MG-Prod.", fr: "Attribuer à MG-Prod la stratégie Windows machines should meet requirements of the Azure compute security baseline." } }
    - { id: review, text: { en: "Review the compliance results of the baseline assignment in Azure Policy.", fr: "Examiner les résultats de conformité de l'attribution de la base de référence dans Azure Policy." } }
    - { id: arc, text: { en: "Install the Azure Connected Machine agent on each VM.", fr: "Installer l'agent Azure Connected Machine sur chaque machine virtuelle." } }
    - { id: uami, text: { en: "Create one user-assigned managed identity and assign the Reader role to it on MG-Prod.", fr: "Créer une identité managée affectée par l'utilisateur et lui attribuer le rôle Reader sur MG-Prod." } }
answer:
  sequence: [ prereq, remed, baseline, review ]
explanation:
  correct:
    en: |
      The prerequisites initiative uses DeployIfNotExists policies to add the Machine Configuration extension and a system-assigned managed identity; new VMs get them automatically, but existing VMs need a remediation task. Once the VMs can authenticate to the Machine Configuration service, the baseline policy (AuditIfNotExists) can evaluate the guest settings, and the results appear in Azure Policy compliance.
    fr: |
      L'initiative des prérequis utilise des stratégies DeployIfNotExists pour ajouter l'extension Machine Configuration et une identité managée affectée par le système ; les nouvelles machines virtuelles les reçoivent automatiquement, mais les machines virtuelles existantes ont besoin d'une tâche de correction. Une fois que les machines virtuelles peuvent s'authentifier auprès du service Machine Configuration, la stratégie de base de référence (AuditIfNotExists) peut évaluer les paramètres de l'invité, et les résultats apparaissent dans la conformité d'Azure Policy.
  options:
    arc: { en: "The Azure Connected Machine agent is for machines outside Azure; Azure VMs use the Machine Configuration extension.", fr: "L'agent Azure Connected Machine est destiné aux machines hors d'Azure ; les machines virtuelles Azure utilisent l'extension Machine Configuration." }
    uami: { en: "The Machine Configuration extension on an Azure VM authenticates with the VM's system-assigned managed identity, which the prerequisites initiative deploys.", fr: "L'extension Machine Configuration d'une machine virtuelle Azure s'authentifie avec l'identité managée affectée par le système de la machine virtuelle, que l'initiative des prérequis déploie." }
references:
  - title: Azure Machine Configuration (guest configuration)
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/guest-configuration
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
