id: sc500-3a-ca-cloudpc-compliance
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses agents that have agent user accounts. The agents run in two ways:

    - Computer-using agents run on Intune-managed Windows 365 Cloud PCs for Agents.
    - Other agents run directly in Microsoft cloud infrastructure and have no device.

    You need to create a Conditional Access policy that requires a compliant device for the agent user sessions that come from the Cloud PCs. The agents that run in Microsoft cloud infrastructure must not be blocked by the policy.

    How should you configure the policy?
  fr: |
    Tailspin Toys utilise des agents qui ont des comptes d'utilisateur d'agent. Les agents s'exécutent de deux façons :

    - les agents d'utilisation de l'ordinateur s'exécutent sur des Windows 365 Cloud PCs for Agents gérés par Intune ;
    - les autres agents s'exécutent directement dans l'infrastructure cloud de Microsoft et n'ont pas d'appareil.

    Vous devez créer une stratégie d'accès conditionnel qui exige un appareil conforme pour les sessions d'utilisateur d'agent provenant des Cloud PCs. Les agents qui s'exécutent dans l'infrastructure cloud de Microsoft ne doivent pas être bloqués par la stratégie.

    Comment devez-vous configurer la stratégie ?
body:
  options:
    - id: a
      text:
        en: "Include All agent users (Preview), set the Agent execution environments (Preview) condition to Agent user sessions initiated from endpoints, and require the device to be marked as compliant."
        fr: "Inclure All agent users (Preview), régler la condition Agent execution environments (Preview) sur Agent user sessions initiated from endpoints et exiger que l'appareil soit marqué comme conforme."
    - id: b
      text:
        en: "Include All agent identities, set the Agent execution environments (Preview) condition to Agent user sessions initiated from endpoints, and require the device to be marked as compliant."
        fr: "Inclure All agent identities, régler la condition Agent execution environments (Preview) sur Agent user sessions initiated from endpoints et exiger que l'appareil soit marqué comme conforme."
    - id: c
      text:
        en: "Include All agent users (Preview), leave the Agent execution environments (Preview) condition unconfigured, and require the device to be marked as compliant."
        fr: "Inclure All agent users (Preview), laisser la condition Agent execution environments (Preview) non configurée et exiger que l'appareil soit marqué comme conforme."
    - id: d
      text:
        en: "Include a security group that contains the agent user accounts of the Cloud PC agents, and require the device to be marked as compliant."
        fr: "Inclure un groupe de sécurité qui contient les comptes d'utilisateur d'agent des agents Cloud PC et exiger que l'appareil soit marqué comme conforme."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Device compliance applies to agent user accounts, so the policy includes All agent users. The Agent execution environments condition with Agent user sessions initiated from endpoints scopes the policy to agents that run on a device; agents that run directly in Microsoft infrastructure have no device and are not evaluated by the scoped policy, so they are not blocked.
    fr: |
      La conformité de l'appareil s'applique aux comptes d'utilisateur d'agent : la stratégie inclut donc All agent users. La condition Agent execution environments avec Agent user sessions initiated from endpoints limite la stratégie aux agents qui s'exécutent sur un appareil ; les agents qui s'exécutent directement dans l'infrastructure de Microsoft n'ont pas d'appareil et ne sont pas évalués par cette stratégie, ils ne sont donc pas bloqués.
  options:
    b:
      en: |
        Agent identities support only the Block grant control, and a policy on agent identities does not apply to the agents' user accounts.
      fr: |
        Les identités d'agent ne prennent en charge que le contrôle d'octroi Block, et une stratégie sur les identités d'agent ne s'applique pas aux comptes d'utilisateur des agents.
    c:
      en: |
        Without the execution environment condition, the policy also evaluates cloud-hosted agents that have no device and no way to become compliant, so they are blocked.
      fr: |
        Sans la condition d'environnement d'exécution, la stratégie évalue aussi les agents hébergés dans le cloud, qui n'ont pas d'appareil ni aucun moyen de devenir conformes : ils sont bloqués.
    d:
      en: |
        Including or excluding agent user accounts through group membership is not supported; target all agent users, selected agent users or custom security attributes.
      fr: |
        Inclure ou exclure des comptes d'utilisateur d'agent par appartenance à un groupe n'est pas pris en charge ; ciblez tous les utilisateurs d'agent, des utilisateurs d'agent choisis ou des attributs de sécurité personnalisés.
references:
  - title: Secure agents that act as users with Conditional Access
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-agent-user
