id: sc500-3a-d4ai-statements
objective: "3.1.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. enables threat protection for AI services on the subscription that hosts its Microsoft Foundry workloads. In **Environment settings** > the subscription > **AI services** > **Settings**, you plan the plan components.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. active la protection contre les menaces pour les services d'IA sur l'abonnement qui héberge ses charges de travail Microsoft Foundry. Dans **Paramètres d'environnement** > l'abonnement > **AI services** > **Settings**, vous planifiez les composants du plan.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If Enable user prompt evidence is off, Defender for Cloud still analyzes prompts and responses for threats, but masks the prompt content in alerts.
        fr: |
          Si Enable user prompt evidence est désactivé, Defender for Cloud analyse toujours les prompts et réponses pour détecter les menaces, mais masque le contenu des prompts dans les alertes.
    - id: s2
      text:
        en: |
          Enable data security for AI interactions is included in the plan price and requires no additional license.
        fr: |
          Enable data security for AI interactions est inclus dans le prix du plan et n'exige aucune licence supplémentaire.
    - id: s3
      text:
        en: |
          AI model security scans models in Azure Machine Learning registries for risks such as embedded malware and serialization vulnerabilities.
        fr: |
          AI model security analyse les modèles des registres Azure Machine Learning à la recherche de risques comme des logiciels malveillants intégrés et des vulnérabilités de sérialisation.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Turning off user prompt evidence doesn't stop detection: prompts and responses are still analyzed, only their content is masked in alerts. Data security for AI interactions lets Microsoft Purview process prompts and responses and requires a Microsoft Purview license that is not included in the plan. AI model security scans models before production, including models registered in Azure Machine Learning registries, for malware, unsafe operators, serialization vulnerabilities and exposed secrets.
    fr: |
      Désactiver les preuves des prompts utilisateur n'arrête pas la détection : les prompts et réponses sont toujours analysés, seul leur contenu est masqué dans les alertes. Data security for AI interactions permet à Microsoft Purview de traiter les prompts et réponses et exige une licence Microsoft Purview non incluse dans le plan. AI model security analyse les modèles avant la production, notamment ceux inscrits dans des registres Azure Machine Learning, à la recherche de logiciels malveillants, d'opérateurs dangereux, de vulnérabilités de sérialisation et de secrets exposés.
references:
  - title: Enable threat protection for AI services
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding
