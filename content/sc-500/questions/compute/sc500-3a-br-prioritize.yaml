id: sc500-3a-br-prioritize
objective: "3.1.5"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Tailspin Toys analyzes the attack paths of its agent identities in Microsoft Defender XDR. The analysis returns the paths shown in the following table.

    | Path | Start | Steps | Target |
    | --- | --- | --- | --- |
    | P1 | Agent identity of TravelBot | 2 | SharePoint site with public product documentation |
    | P2 | Agent identity of BillingBot | 6 | Storage account with customer payment records |
    | P3 | Agent identity of MeetingBot | 3 | Mailbox folder with team meeting notes |
    | P4 | Agent identity of LabBot | 1 | Test SharePoint site with sample data |

    You have time to remediate one path this week. You need to reduce the most critical risk first.

    Which path should you remediate first?
  fr: |
    Tailspin Toys analyse les chemins d'attaque de ses identités d'agent dans Microsoft Defender XDR. L'analyse renvoie les chemins présentés dans le tableau suivant.

    | Chemin | Départ | Étapes | Cible |
    | --- | --- | --- | --- |
    | P1 | Identité d'agent de TravelBot | 2 | Site SharePoint de documentation produit publique |
    | P2 | Identité d'agent de BillingBot | 6 | Compte de stockage contenant les données de paiement des clients |
    | P3 | Identité d'agent de MeetingBot | 3 | Dossier de boîte aux lettres contenant les notes de réunion de l'équipe |
    | P4 | Identité d'agent de LabBot | 1 | Site SharePoint de test contenant des données d'exemple |

    Vous avez le temps de corriger un seul chemin cette semaine. Vous devez réduire d'abord le risque le plus critique.

    Quel chemin devez-vous corriger en premier ?
body:
  options:
    - { id: a, text: P1 }
    - { id: b, text: P2 }
    - { id: c, text: P3 }
    - { id: d, text: P4 }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Attack paths are prioritized by the criticality of their target, not by their complexity or number of steps. A path that ends at customer payment records reaches the most sensitive data store, so P2 comes first even though it is the longest path.
    fr: |
      Les chemins d'attaque se priorisent selon la criticité de leur cible, pas selon leur complexité ni leur nombre d'étapes. Un chemin qui aboutit aux données de paiement des clients atteint le magasin de données le plus sensible : P2 passe donc en premier, même si c'est le chemin le plus long.
  options:
    a:
      en: |
        P1 is short, but its target is public documentation, which has little impact if exposed.
      fr: |
        P1 est court, mais sa cible est une documentation publique, dont l'exposition a peu d'impact.
    c:
      en: |
        Meeting notes are less critical than customer payment records.
      fr: |
        Les notes de réunion sont moins critiques que les données de paiement des clients.
    d:
      en: |
        P4 has the fewest steps, but a test site with sample data is the least critical target.
      fr: |
        P4 compte le moins d'étapes, mais un site de test contenant des données d'exemple est la cible la moins critique.
references:
  - title: Assess blast radius and attack paths
    url: https://learn.microsoft.com/en-us/training/modules/analyze-ai-identity-risks-defender-xdr/3-assess-blast-radius-attack-paths
