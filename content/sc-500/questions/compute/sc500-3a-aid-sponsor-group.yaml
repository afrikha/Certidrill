id: sc500-3a-aid-sponsor-group
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. wants every member of its claims team to share sponsorship of a new agent identity named **ClaimsTriage**. The tenant contains the groups shown in the following table.

    | Group | Type | Membership type | Can be assigned to Microsoft Entra roles |
    | --- | --- | --- | --- |
    | G1 | Security | Assigned | No |
    | G2 | Security | Assigned | Yes |
    | G3 | Security | Dynamic | No |
    | G4 | Microsoft 365 | Assigned | Yes |

    You need to add one of the groups as a sponsor of ClaimsTriage.

    Which group can you add?
  fr: |
    Proseware, Inc. souhaite que tous les membres de son équipe sinistres partagent le parrainage d'une nouvelle identité d'agent nommée **ClaimsTriage**. Le locataire contient les groupes présentés dans le tableau suivant.

    | Groupe | Type | Type d'appartenance | Assignable à des rôles Microsoft Entra |
    | --- | --- | --- | --- |
    | G1 | Sécurité | Attribuée | Non |
    | G2 | Sécurité | Attribuée | Oui |
    | G3 | Sécurité | Dynamique | Non |
    | G4 | Microsoft 365 | Attribuée | Oui |

    Vous devez ajouter l'un des groupes comme sponsor de ClaimsTriage.

    Quel groupe pouvez-vous ajouter ?
body:
  options:
    - { id: a, text: G1 }
    - { id: b, text: G2 }
    - { id: c, text: G3 }
    - { id: d, text: G4 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An agent identity can have group sponsors, and all members of the group receive sponsor rights. Dynamic membership groups (security or Microsoft 365) and assigned Microsoft 365 groups are allowed; assigned security groups and role-assignable groups are not. G3 is the only group in the table that meets these rules.
    fr: |
      Une identité d'agent peut avoir des groupes comme sponsors, et tous les membres du groupe reçoivent les droits de sponsor. Les groupes à appartenance dynamique (sécurité ou Microsoft 365) et les groupes Microsoft 365 à appartenance attribuée sont autorisés ; les groupes de sécurité à appartenance attribuée et les groupes assignables à des rôles ne le sont pas. G3 est le seul groupe du tableau qui respecte ces règles.
  options:
    a:
      en: |
        Security groups with assigned membership are not supported as sponsors of an agent identity.
      fr: |
        Les groupes de sécurité à appartenance attribuée ne sont pas pris en charge comme sponsors d'une identité d'agent.
    b:
      en: |
        G2 is an assigned security group and is role-assignable; neither is supported for agent identity sponsors.
      fr: |
        G2 est un groupe de sécurité à appartenance attribuée et assignable à des rôles ; aucune de ces deux caractéristiques n'est prise en charge pour les sponsors d'identité d'agent.
    d:
      en: |
        Assigned Microsoft 365 groups are allowed, but role-assignable groups of any type are not.
      fr: |
        Les groupes Microsoft 365 à appartenance attribuée sont autorisés, mais pas les groupes assignables à des rôles, quel que soit leur type.
references:
  - title: Administrative relationships in Microsoft Entra Agent ID (Owners, sponsors, and managers)
    url: https://learn.microsoft.com/en-us/entra/agent-id/agent-owners-sponsors-managers
