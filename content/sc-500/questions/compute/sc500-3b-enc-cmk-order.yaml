id: sc500-3b-enc-cmk-order
objective: "3.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure virtual machine named **VM2** in West Europe. A data disk named **Disk2** is attached to VM2 and is encrypted with platform-managed keys. No key vault or disk encryption set exists yet.

    You need to encrypt Disk2 at rest with a customer-managed key that Fabrikam generates in Azure Key Vault. You use the Azure portal.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'une machine virtuelle Azure nommée **VM2** dans la région West Europe. Un disque de données nommé **Disk2** est attaché à VM2 et chiffré avec des clés gérées par la plateforme. Aucun coffre de clés ni jeu de chiffrement de disque n'existe encore.

    Vous devez chiffrer Disk2 au repos avec une clé gérée par le client que Fabrikam génère dans Azure Key Vault. Vous utilisez le portail Azure.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: kv, text: { en: "Create a key vault in West Europe with soft delete and purge protection enabled.", fr: "Créer un coffre de clés dans la région West Europe avec la suppression réversible et la protection contre le vidage activées." } }
    - { id: key, text: { en: "Generate an RSA 2048 key in the key vault.", fr: "Générer une clé RSA 2048 dans le coffre de clés." } }
    - { id: des, text: { en: "Create a disk encryption set with the encryption type Encryption at-rest with a customer-managed key and select the key.", fr: "Créer un jeu de chiffrement de disque avec le type de chiffrement Encryption at-rest with a customer-managed key et sélectionner la clé." } }
    - { id: grant, text: { en: "Grant the disk encryption set permissions on the key vault.", fr: "Accorder au jeu de chiffrement de disque des autorisations sur le coffre de clés." } }
    - { id: apply, text: { en: "Stop VM2, and then select the customer-managed key on the Encryption page of Disk2.", fr: "Arrêter VM2, puis sélectionner la clé gérée par le client dans la page Encryption de Disk2." } }
    - { id: feat, text: { en: "Register the EncryptionAtHost feature for the subscription.", fr: "Inscrire la fonctionnalité EncryptionAtHost pour l'abonnement." } }
    - { id: ade, text: { en: "Enable Azure Disk Encryption on VM2 with the key as a key encryption key.", fr: "Activer Azure Disk Encryption sur VM2 avec la clé comme clé de chiffrement à clé." } }
answer:
  sequence: [ kv, key, des, grant, apply ]
explanation:
  correct:
    en: |
      The key vault must have soft delete and purge protection, which are mandatory for managed disk encryption, and be in the same region as the disk encryption set. You create the key, then the disk encryption set that references it; the set gets a system-assigned managed identity, which you grant permissions on the key vault. Encrypting a disk attached to a VM requires the VM to be stopped before you select the customer-managed key on the disk.
    fr: |
      Le coffre de clés doit avoir la suppression réversible et la protection contre le vidage, obligatoires pour le chiffrement des disques managés, et se trouver dans la même région que le jeu de chiffrement de disque. Vous créez la clé, puis le jeu de chiffrement de disque qui la référence ; le jeu reçoit une identité managée affectée par le système, à laquelle vous accordez des autorisations sur le coffre de clés. Le chiffrement d'un disque attaché à une machine virtuelle exige d'arrêter celle-ci avant de sélectionner la clé gérée par le client sur le disque.
  options:
    feat: { en: "The EncryptionAtHost feature registration is needed only for encryption at host, not for server-side encryption with a customer-managed key.", fr: "L'inscription de la fonctionnalité EncryptionAtHost n'est nécessaire que pour le chiffrement sur l'hôte, pas pour le chiffrement côté serveur avec une clé gérée par le client." }
    ade: { en: "Azure Disk Encryption is guest-level encryption, not server-side encryption, and disks ever encrypted with it can't use customer-managed keys for server-side encryption.", fr: "Azure Disk Encryption est un chiffrement dans l'invité, pas un chiffrement côté serveur, et les disques qui l'ont déjà utilisé ne peuvent pas utiliser de clés gérées par le client pour le chiffrement côté serveur." }
references:
  - title: Use the Azure portal to enable server-side encryption with customer-managed keys for managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-customer-managed-keys-portal
