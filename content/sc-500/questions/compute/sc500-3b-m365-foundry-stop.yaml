id: sc500-3b-m365-foundry-stop
objective: "3.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders publishes agents built in Microsoft Foundry to Microsoft 365 Copilot. An administrator named Admin1 holds the Microsoft Entra **AI Administrator** role and no Azure role.

    Admin1 needs to use the **Stop** action in the Agent Registry of the Microsoft 365 admin center to deallocate the deployment of a Foundry agent named **InvoiceBot**. The solution must follow the principle of least privilege.

    Which additional role should Admin1 have?
  fr: |
    Northwind Traders publie dans Microsoft 365 Copilot des agents créés dans Microsoft Foundry. Un administrateur nommé Admin1 détient le rôle Microsoft Entra **AI Administrator** et aucun rôle Azure.

    Admin1 doit utiliser l'action **Stop** dans le registre des agents (Agent Registry) du Centre d'administration Microsoft 365 pour libérer le déploiement d'un agent Foundry nommé **InvoiceBot**. La solution doit respecter le principe du moindre privilège.

    Quel rôle supplémentaire Admin1 doit-il détenir ?
body:
  options:
    - { id: a, text: Azure AI User }
    - { id: b, text: Global Administrator }
    - { id: c, text: Azure AI Owner }
    - { id: d, text: Cognitive Services User }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Start and Stop apply only to Microsoft Foundry agents and operate on Azure compute by deallocating or provisioning the deployment. The documented requirement for these actions is the Azure AI Owner role; the AI Administrator role alone manages the agent in Microsoft 365 but not the underlying Azure resources.
    fr: |
      Start et Stop s'appliquent uniquement aux agents Microsoft Foundry et agissent sur le calcul Azure en libérant ou en approvisionnant le déploiement. Le rôle exigé pour ces actions est Azure AI Owner ; le rôle AI Administrator seul gère l'agent dans Microsoft 365, mais pas les ressources Azure sous-jacentes.
  options:
    a: { en: "Azure AI User is a Foundry role for using projects and models; it isn't the role that the Stop action requires.", fr: "Azure AI User est un rôle Foundry permettant d'utiliser les projets et les modèles ; ce n'est pas le rôle exigé par l'action Stop." }
    b: { en: "Global Administrator is a highly privileged Microsoft Entra role; it isn't least privilege and isn't the role that the Stop action requires.", fr: "Global Administrator est un rôle Microsoft Entra hautement privilégié ; il ne respecte pas le moindre privilège et ce n'est pas le rôle exigé par l'action Stop." }
    d: { en: "Cognitive Services User is a role for calling AI services; it isn't the role that the Stop action requires.", fr: "Cognitive Services User est un rôle permettant d'appeler les services d'IA ; ce n'est pas le rôle exigé par l'action Stop." }
references:
  - title: Governance and Lifecycle actions for agents available in Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions
