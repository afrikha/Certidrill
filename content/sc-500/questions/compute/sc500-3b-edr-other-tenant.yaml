id: sc500-3b-edr-other-tenant
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam acquired Litware. Litware's Azure virtual machines were moved to a Fabrikam subscription named **Sub1** in the Fabrikam tenant. Before the move, the VMs were onboarded to Litware's Microsoft Defender for Endpoint organization.

    You enable Defender for Servers Plan 1 on Sub1 with the Endpoint protection setting on. Two days later, the former Litware VMs still don't appear in Fabrikam's Defender for Endpoint device inventory, while the other VMs of Sub1 do.

    You need the former Litware VMs to report to Fabrikam's Defender for Endpoint organization.

    What should you do first?
  fr: |
    Fabrikam a acquis Litware. Les machines virtuelles Azure de Litware ont été déplacées vers un abonnement Fabrikam nommé **Sub1** dans le locataire Fabrikam. Avant le déplacement, les machines virtuelles étaient intégrées à l'organisation Microsoft Defender for Endpoint de Litware.

    Vous activez Defender for Servers Plan 1 sur Sub1 avec le paramètre Endpoint protection activé. Deux jours plus tard, les anciennes machines virtuelles de Litware n'apparaissent toujours pas dans l'inventaire des appareils Defender for Endpoint de Fabrikam, contrairement aux autres machines virtuelles de Sub1.

    Les anciennes machines virtuelles de Litware doivent remonter leurs données dans l'organisation Defender for Endpoint de Fabrikam.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Change the plan of Sub1 to Defender for Servers Plan 2", fr: "Passer le plan de Sub1 à Defender for Servers Plan 2" } }
    - { id: b, text: { en: "Turn Endpoint protection off and on again for Sub1", fr: "Désactiver puis réactiver Endpoint protection pour Sub1" } }
    - { id: c, text: { en: "Enable the unified solution under Fix > Missing components", fr: "Activer la solution unifiée sous Fix > Missing components" } }
    - { id: d, text: { en: "Offboard the VMs from Litware's Defender for Endpoint organization", fr: "Retirer les machines virtuelles de l'organisation Defender for Endpoint de Litware" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Defender for Cloud doesn't automatically reassign a device that is already onboarded to a different Defender for Endpoint organization. You must offboard the VMs from the previous organization; Defender for Cloud can then onboard them to the organization associated with Fabrikam's tenant.
    fr: |
      Defender for Cloud ne réattribue pas automatiquement un appareil déjà intégré à une autre organisation Defender for Endpoint. Vous devez retirer les machines virtuelles de l'organisation précédente ; Defender for Cloud peut ensuite les intégrer à l'organisation associée au locataire de Fabrikam.
  options:
    a: { en: "Endpoint protection with Defender for Endpoint is included in both plans; changing the plan doesn't move devices between organizations.", fr: "La protection des points de terminaison avec Defender for Endpoint est incluse dans les deux plans ; changer de plan ne déplace pas les appareils d'une organisation à l'autre." }
    b: { en: "Toggling the setting doesn't reassign devices that belong to another organization; they must be offboarded first.", fr: "Basculer le paramètre ne réattribue pas les appareils qui appartiennent à une autre organisation ; ils doivent d'abord en être retirés." }
    c: { en: "The unified solution fix applies to Windows Server 2012 R2 and 2016 in older subscriptions; it doesn't reassign devices onboarded elsewhere.", fr: "La correction de la solution unifiée concerne Windows Server 2012 R2 et 2016 dans des abonnements anciens ; elle ne réattribue pas des appareils intégrés ailleurs." }
references:
  - title: Enable Defender for Endpoint integration in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-defender-for-endpoint
