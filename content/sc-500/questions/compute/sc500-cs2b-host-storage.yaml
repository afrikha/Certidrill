id: sc500-cs2b-host-storage
objective: "3.3.5"
type: single
caseStudy: sc500-cs2b-city-power-light
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the requirement for the connection between func-meter and stcplhost. What should you do?
  fr: |
    Vous devez respecter l'exigence relative à la connexion entre func-meter et stcplhost. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the connection string with AzureWebJobsStorage__accountName and assign Storage Account Contributor on stcplhost", fr: "Remplacer la chaîne de connexion par AzureWebJobsStorage__accountName et attribuer Storage Account Contributor sur stcplhost" } }
    - { id: b, text: { en: "Replace the connection string with AzureWebJobsStorage__accountName and assign Storage Blob Data Reader and Storage Table Data Reader on stcplhost", fr: "Remplacer la chaîne de connexion par AzureWebJobsStorage__accountName et attribuer Storage Blob Data Reader et Storage Table Data Reader sur stcplhost" } }
    - { id: c, text: { en: "Replace the connection string with AzureWebJobsStorage__accountName and assign Storage Blob Data Owner and Storage Table Data Contributor on stcplhost", fr: "Remplacer la chaîne de connexion par AzureWebJobsStorage__accountName et attribuer Storage Blob Data Owner et Storage Table Data Contributor sur stcplhost" } }
    - { id: d, text: { en: "Store the connection string in kv-cpl, reference it from AzureWebJobsStorage and assign Key Vault Secrets User on kv-cpl", fr: "Stocker la chaîne de connexion dans kv-cpl, la référencer depuis AzureWebJobsStorage et attribuer Key Vault Secrets User sur kv-cpl" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With the AzureWebJobsStorage__accountName setting and no clientId setting, the Functions host connects to stcplhost with the system-assigned managed identity instead of an account key. Storage Blob Data Owner is the minimum role for the host-required AzureWebJobsStorage connection, and Storage Table Data Contributor is also needed for the diagnostic events stored in Table Storage.
    fr: |
      Avec le paramètre AzureWebJobsStorage__accountName et sans paramètre clientId, l'hôte Functions se connecte à stcplhost avec l'identité managée affectée par le système au lieu d'une clé de compte. Storage Blob Data Owner est le rôle minimal pour la connexion AzureWebJobsStorage requise par l'hôte, et Storage Table Data Contributor est aussi nécessaire pour les événements de diagnostic stockés dans le Stockage Table.
  options:
    a: { en: "Storage Account Contributor is a management-plane role; it doesn't grant the blob and table data access that an identity-based connection uses.", fr: "Storage Account Contributor est un rôle du plan de gestion ; il n'accorde pas l'accès aux données blob et table qu'utilise une connexion basée sur l'identité." }
    b: { en: "Read-only data roles don't let the host write the blobs and table entities it needs.", fr: "Les rôles de données en lecture seule ne permettent pas à l'hôte d'écrire les objets blob et les entités de table dont il a besoin." }
    d: { en: "A Key Vault reference protects the connection string, but the connection still uses an account key.", fr: "Une référence Key Vault protège la chaîne de connexion, mais la connexion utilise toujours une clé de compte." }
references:
  - title: Configure connections to remote services in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-identity-based-connections-tutorial
