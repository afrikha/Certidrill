id: sc500-cs2c-machine-config
objective: "3.2.9"
type: single
caseStudy: sc500-cs2c-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    The on-premises servers are now connected to Azure Arc. Before you assign the machine configuration baseline policies, you need to prepare the machines to meet the audit requirement. What should you do?
  fr: |
    Les serveurs locaux sont désormais connectés à Azure Arc. Avant d'attribuer les stratégies de base de référence de configuration machine, vous devez préparer les machines pour respecter l'exigence d'audit. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Install the Azure VM guest configuration extension on the Azure VMs and on the Arc-enabled servers", fr: "Installer l'extension de configuration invité de machine virtuelle Azure sur les machines virtuelles Azure et sur les serveurs avec Arc" } }
    - { id: b, text: { en: "Assign a user-assigned managed identity to the Azure VMs and to the Arc-enabled servers", fr: "Attribuer une identité managée affectée par l'utilisateur aux machines virtuelles Azure et aux serveurs avec Arc" } }
    - { id: c, text: { en: "Assign the Deploy prerequisites to enable Guest Configuration policies on virtual machines initiative to Sub-Travel", fr: "Attribuer l'initiative Deploy prerequisites to enable Guest Configuration policies on virtual machines à Sub-Travel" } }
    - { id: d, text: { en: "Deploy the Azure Monitor Agent to the Azure VMs and to the Arc-enabled servers by using a data collection rule", fr: "Déployer l'agent Azure Monitor sur les machines virtuelles Azure et sur les serveurs avec Arc avec une règle de collecte de données" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An Azure VM needs the guest configuration extension and a system-assigned managed identity for machine configuration, and the Deploy prerequisites to enable Guest Configuration policies on virtual machines initiative deploys both at scale; existing VMs are brought into compliance with a remediation task. Arc-enabled servers need no extension because machine configuration is included in the Connected Machine agent.
    fr: |
      Une machine virtuelle Azure a besoin de l'extension de configuration invité et d'une identité managée affectée par le système pour la configuration machine, et l'initiative Deploy prerequisites to enable Guest Configuration policies on virtual machines déploie les deux à grande échelle ; les machines virtuelles existantes sont mises en conformité par une tâche de correction. Les serveurs avec Arc n'ont besoin d'aucune extension, car la configuration machine est incluse dans l'agent Connected Machine.
  options:
    a: { en: "The extension isn't required on Arc-enabled servers, and installing it manually on each Azure VM still leaves the VMs without the required system-assigned identity.", fr: "L'extension n'est pas requise sur les serveurs avec Arc, et l'installer manuellement sur chaque machine virtuelle Azure laisse les machines virtuelles sans l'identité affectée par le système requise." }
    b: { en: "Machine configuration requires a system-assigned managed identity on Azure VMs, not a user-assigned one.", fr: "La configuration machine exige une identité managée affectée par le système sur les machines virtuelles Azure, pas une identité affectée par l'utilisateur." }
    d: { en: "The Azure Monitor Agent collects monitoring data; it isn't used by machine configuration to audit settings.", fr: "L'agent Azure Monitor collecte des données de supervision ; la configuration machine ne l'utilise pas pour auditer les paramètres." }
references:
  - title: Azure Machine Configuration prerequisites
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview/02-setup-prerequisites
