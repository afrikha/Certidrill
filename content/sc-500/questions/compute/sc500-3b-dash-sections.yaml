id: sc500-3b-dash-sections
objective: "3.1.10"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank enabled all the plans required by the Data and AI security dashboard in Microsoft Defender for Cloud. A security analyst asks you where to find specific information in the dashboard.

    Which section of the dashboard should the analyst open for each need? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a activé tous les plans exigés par le tableau de bord de sécurité des données et de l'IA de Microsoft Defender for Cloud. Une analyste de sécurité vous demande où trouver certaines informations dans le tableau de bord.

    Quelle section du tableau de bord l'analyste doit-elle ouvrir pour chaque besoin ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Check whether each storage asset is fully, partially or not protected: [[s1]]

      See the highest-severity alerts, presented by MITRE ATT&CK tactic: [[s2]]

      See the most common sensitive information types in cloud data resources: [[s3]]

      Run the prebuilt query that finds vulnerable containers used for AI: [[s4]]
    fr: |
      Vérifier si chaque ressource de stockage est entièrement, partiellement ou pas protégée : [[s1]]

      Voir les alertes de gravité la plus élevée, présentées par tactique MITRE ATT&CK : [[s2]]

      Voir les types d'informations sensibles les plus courants dans les ressources de données cloud : [[s3]]

      Exécuter la requête prédéfinie qui recherche les conteneurs vulnérables utilisés pour l'IA : [[s4]]
  slots:
    - id: s1
      options:
        - { id: ov, text: Data and AI security overview }
        - { id: top, text: Top issues }
        - { id: data, text: Data closer look }
        - { id: ai, text: AI closer look }
    - id: s2
      options:
        - { id: ov, text: Data and AI security overview }
        - { id: top, text: Top issues }
        - { id: data, text: Data closer look }
        - { id: ai, text: AI closer look }
    - id: s3
      options:
        - { id: ov, text: Data and AI security overview }
        - { id: top, text: Top issues }
        - { id: data, text: Data closer look }
        - { id: ai, text: AI closer look }
    - id: s4
      options:
        - { id: ov, text: Data and AI security overview }
        - { id: top, text: Top issues }
        - { id: data, text: Data closer look }
        - { id: ai, text: AI closer look }
answer:
  values: { s1: ov, s2: top, s3: data, s4: ai }
explanation:
  correct:
    en: |
      The overview shows the estate by category and whether each resource is fully, partially or not protected. Top issues lists the highest-severity alerts based on MITRE ATT&CK tactics, plus critical and high recommendations and attack paths. Data closer look contains sensitive data discovery, and AI closer look contains the security explorer queries for AI, such as vulnerable containers used for AI.
    fr: |
      La vue d'ensemble présente le patrimoine par catégorie et indique si chaque ressource est entièrement, partiellement ou pas protégée. Top issues répertorie les alertes de gravité la plus élevée selon les tactiques MITRE ATT&CK, ainsi que les recommandations et chemins d'attaque critiques et élevés. Data closer look contient la découverte des données sensibles, et AI closer look contient les requêtes de l'explorateur de sécurité pour l'IA, comme les conteneurs vulnérables utilisés pour l'IA.
references:
  - title: Data and AI security dashboard
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/data-aware-security-dashboard-overview
