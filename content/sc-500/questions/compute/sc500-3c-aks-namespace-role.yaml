id: sc500-3c-aks-namespace-role
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has an AKS cluster named **aks-core** that uses Microsoft Entra ID authentication with Azure RBAC for Kubernetes authorization. The cluster contains the namespaces **team-a**, **team-b** and **ingress**.

    A developer named **Dev1** must be able to perform the following tasks:

    - Create and update Deployments and Services in team-a.
    - Read the Kubernetes Secrets used by the applications in team-a.

    Dev1 must not be able to create or modify role bindings, and must have no access to the other namespaces. The solution must use the principle of least privilege.

    Which role assignment should you create for Dev1?
  fr: |
    Woodgrove dispose d'un cluster AKS nommé **aks-core** qui utilise l'authentification Microsoft Entra ID avec Azure RBAC pour l'autorisation Kubernetes. Le cluster contient les espaces de noms **team-a**, **team-b** et **ingress**.

    Un développeur nommé **Dev1** doit pouvoir effectuer les tâches suivantes :

    - Créer et mettre à jour des objets Deployment et Service dans team-a.
    - Lire les Secrets Kubernetes utilisés par les applications de team-a.

    Dev1 ne doit pas pouvoir créer ni modifier de liaisons de rôle (role bindings), et ne doit avoir aucun accès aux autres espaces de noms. La solution doit respecter le principe du moindre privilège.

    Quelle attribution de rôle devez-vous créer pour Dev1 ?
body:
  options:
    - { id: a, text: { en: "Azure Kubernetes Service RBAC Reader at the team-a namespace scope", fr: "Azure Kubernetes Service RBAC Reader à l'étendue de l'espace de noms team-a" } }
    - { id: b, text: { en: "Azure Kubernetes Service RBAC Writer at the team-a namespace scope", fr: "Azure Kubernetes Service RBAC Writer à l'étendue de l'espace de noms team-a" } }
    - { id: c, text: { en: "Azure Kubernetes Service RBAC Admin at the team-a namespace scope", fr: "Azure Kubernetes Service RBAC Admin à l'étendue de l'espace de noms team-a" } }
    - { id: d, text: { en: "Azure Kubernetes Service RBAC Writer at the cluster scope", fr: "Azure Kubernetes Service RBAC Writer à l'étendue du cluster" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Kubernetes Service RBAC Writer grants read/write access to most objects in a namespace, including Secrets, but not to roles or role bindings. Assigning it with the scope `<cluster ID>/namespaces/team-a` limits it to team-a."
    fr: "Azure Kubernetes Service RBAC Writer accorde l'accès en lecture et en écriture à la plupart des objets d'un espace de noms, y compris les Secrets, mais pas aux rôles ni aux liaisons de rôle. L'attribuer avec l'étendue `<ID du cluster>/namespaces/team-a` le limite à team-a."
  options:
    a:
      en: "The Reader role is read-only and cannot view Secrets, so Dev1 could neither deploy nor read the Secrets."
      fr: "Le rôle Reader est en lecture seule et ne permet pas de consulter les Secrets : Dev1 ne pourrait ni déployer ni lire les Secrets."
    c:
      en: "The Admin role also allows creating roles and role bindings in the namespace, which Dev1 must not be able to do."
      fr: "Le rôle Admin permet aussi de créer des rôles et des liaisons de rôle dans l'espace de noms, ce que Dev1 ne doit pas pouvoir faire."
    d:
      en: "At the cluster scope, the Writer role would also apply to team-b and ingress."
      fr: "À l'étendue du cluster, le rôle Writer s'appliquerait aussi à team-b et à ingress."
references:
  - title: Use Microsoft Entra ID authorization for the Kubernetes API in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/manage-azure-rbac
