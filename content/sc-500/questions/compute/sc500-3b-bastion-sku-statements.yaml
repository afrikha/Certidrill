id: sc500-3b-bastion-sku-statements
objective: "3.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has the following Azure Bastion deployments.

    | Name | SKU | Virtual network |
    | --- | --- | --- |
    | Bastion1 | Developer | VNet-Dev |
    | Bastion2 | Basic | VNet-Hub |
    | Bastion3 | Standard | VNet-Prod |

    VNet-Hub is peered with VNet-App.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose des déploiements Azure Bastion suivants.

    | Nom | SKU | Réseau virtuel |
    | --- | --- | --- |
    | Bastion1 | Developer | VNet-Dev |
    | Bastion2 | Basic | VNet-Hub |
    | Bastion3 | Standard | VNet-Prod |

    Un peering existe entre VNet-Hub et VNet-App.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can change Bastion3 to the Basic SKU without deleting it.
        fr: Vous pouvez passer Bastion3 à la SKU Basic sans le supprimer.
    - id: s2
      text:
        en: Upgrading Bastion1 to the Standard SKU requires an AzureBastionSubnet and a public IP address.
        fr: La mise à niveau de Bastion1 vers la SKU Standard exige un sous-réseau AzureBastionSubnet et une adresse IP publique.
    - id: s3
      text:
        en: Users can connect through Bastion2 to virtual machines in VNet-App.
        fr: Les utilisateurs peuvent se connecter via Bastion2 aux machines virtuelles de VNet-App.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Azure Bastion supports upgrades to higher SKUs but not downgrades; to go from Standard to Basic you must delete and recreate the bastion. Upgrading from Developer requires an AzureBastionSubnet (/26 or larger) and a Standard, static public IP address. The Basic SKU and higher support connections to VMs in peered virtual networks.
    fr: |
      Azure Bastion prend en charge la mise à niveau vers des SKU supérieures, mais pas la rétrogradation ; pour passer de Standard à Basic, il faut supprimer et recréer le bastion. La mise à niveau depuis Developer exige un sous-réseau AzureBastionSubnet (/26 ou plus grand) et une adresse IP publique Standard statique. La SKU Basic et les SKU supérieures prennent en charge les connexions aux machines virtuelles de réseaux virtuels reliés par peering.
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
