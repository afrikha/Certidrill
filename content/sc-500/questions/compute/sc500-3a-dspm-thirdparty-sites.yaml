id: sc500-3a-dspm-thirdparty-sites
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Purview DSPM for AI. Its employees use Windows 11 devices with Google Chrome, and some of them paste customer data into third-party generative AI websites.

    You need DSPM for AI to show the sensitive information that employees share with these third-party AI sites and the visits to these sites.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Purview DSPM for AI. Ses employés utilisent des appareils Windows 11 avec Google Chrome, et certains collent des données clients dans des sites web d'IA générative tiers.

    Vous devez faire en sorte que DSPM for AI affiche les informations sensibles que les employés partagent avec ces sites d'IA tiers ainsi que les visites de ces sites.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Onboard the Windows devices to Microsoft Purview.", fr: "Intégrer les appareils Windows à Microsoft Purview." } }
    - { id: b, text: { en: "Deploy the Microsoft Purview browser extension to the Windows users.", fr: "Déployer l'extension de navigateur Microsoft Purview pour les utilisateurs Windows." } }
    - { id: c, text: { en: "Integrate the third-party AI sites with the Microsoft Purview SDK.", fr: "Intégrer les sites d'IA tiers au SDK Microsoft Purview." } }
    - { id: d, text: { en: "Assign Microsoft 365 Copilot licenses to the employees.", fr: "Attribuer des licences Microsoft 365 Copilot aux employés." } }
    - { id: e, text: { en: "Create an Edge configuration policy that activates the Purview integration in Edge.", fr: "Créer une stratégie de configuration Edge qui active l'intégration Purview dans Edge." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      To monitor third-party generative AI sites, devices must be onboarded to Microsoft Purview, which gives visibility into sensitive information shared with those sites. The Microsoft Purview browser extension must also be deployed to Windows users: it detects visits to third-party AI sites and is required for Endpoint DLP on Windows with Chrome.
    fr: |
      Pour surveiller les sites d'IA générative tiers, les appareils doivent être intégrés à Microsoft Purview, ce qui donne la visibilité sur les informations sensibles partagées avec ces sites. L'extension de navigateur Microsoft Purview doit aussi être déployée pour les utilisateurs Windows : elle détecte les visites de sites d'IA tiers et est nécessaire à la DLP de point de terminaison sous Windows avec Chrome.
  options:
    c:
      en: |
        The Purview SDK is used by Entra-registered AI apps that you build or own, not by public third-party websites.
      fr: |
        Le SDK Purview est utilisé par des applications d'IA inscrites dans Entra que vous développez ou possédez, pas par des sites web publics tiers.
    d:
      en: |
        Microsoft 365 Copilot licenses are needed to monitor Microsoft 365 Copilot and agents, not third-party AI sites.
      fr: |
        Les licences Microsoft 365 Copilot servent à surveiller Microsoft 365 Copilot et les agents, pas les sites d'IA tiers.
    e:
      en: |
        The Edge configuration policy covers AI apps used in Microsoft Edge; the employees use Chrome.
      fr: |
        La stratégie de configuration Edge couvre les applications d'IA utilisées dans Microsoft Edge ; les employés utilisent Chrome.
references:
  - title: Considerations for DSPM for AI to manage data security and compliance protections for AI interactions - (classic)
    url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview-considerations
