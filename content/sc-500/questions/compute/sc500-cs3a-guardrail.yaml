id: sc500-cs3a-guardrail
objective: "3.1.9"
type: single
caseStudy: sc500-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |-
    You need to meet the requirement for the hidden instructions in the content that agt-lit-review retrieves. You create a custom guardrail and assign it to agt-lit-review. Which control should the guardrail contain?
  fr: |-
    Vous devez satisfaire l'exigence relative aux instructions cachées dans le contenu récupéré par agt-lit-review. Vous créez un garde-fou personnalisé et l'attribuez à agt-lit-review. Quel contrôle le garde-fou doit-il contenir ?
body:
  options:
    - { id: a, text: { en: "Risk Indirect attacks, intervention point Tool response, action Annotate and block", fr: "Risque Indirect attacks, point d'intervention Tool response, action Annotate and block" } }
    - { id: b, text: { en: "Risk User prompt attacks, intervention point User input, action Annotate and block", fr: "Risque User prompt attacks, point d'intervention User input, action Annotate and block" } }
    - { id: c, text: { en: "Risk Indirect attacks, intervention point Tool response, action Annotate", fr: "Risque Indirect attacks, point d'intervention Tool response, action Annotate" } }
    - { id: d, text: { en: "Risk Indirect attacks, intervention point Output, action Annotate and block", fr: "Risque Indirect attacks, point d'intervention Output, action Annotate and block" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Instructions hidden in retrieved documents are indirect prompt injection attacks, and the content comes back to the agent as a tool response. A control for Indirect attacks on the Tool response intervention point scans the payload returned by tools such as Bing Grounding and SharePoint Grounding, and Annotate and block stops the agent when an attack is detected. Because an agent's guardrail fully overrides the guardrail of its model deployment, the control must be in the guardrail assigned to agt-lit-review.
    fr: |-
      Des instructions cachées dans des documents récupérés constituent des attaques indirectes par injection de prompt, et ce contenu revient à l'agent sous forme de réponse d'outil. Un contrôle Indirect attacks sur le point d'intervention Tool response analyse la charge utile renvoyée par des outils comme Bing Grounding et SharePoint Grounding, et l'action Annotate and block arrête l'agent quand une attaque est détectée. Comme le garde-fou d'un agent remplace entièrement celui de son déploiement de modèle, le contrôle doit figurer dans le garde-fou attribué à agt-lit-review.
  options:
    b:
      en: |-
        User prompt attacks on the user input detect jailbreak attempts typed by the user, not instructions hidden in content returned by a tool.
      fr: |-
        User prompt attacks sur l'entrée utilisateur détecte les tentatives de jailbreak saisies par l'utilisateur, pas les instructions cachées dans le contenu renvoyé par un outil.
    c:
      en: |-
        The Annotate action is available for models only; for agents the action is Annotate and block, and an annotation alone would not stop the agent.
      fr: |-
        L'action Annotate n'est disponible que pour les modèles ; pour les agents, l'action est Annotate and block, et une simple annotation n'arrêterait pas l'agent.
    d:
      en: |-
        Scanning the final output happens after the agent has already processed the injected instructions; the payload must be scanned when the tool returns it.
      fr: |-
        L'analyse de la sortie finale intervient après que l'agent a déjà traité les instructions injectées ; la charge utile doit être analysée au moment où l'outil la renvoie.
references:
  - title: Intervention points
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
