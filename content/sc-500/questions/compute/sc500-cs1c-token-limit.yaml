id: sc500-cs1c-token-limit
objective: "3.1.7"
type: dropdown
caseStudy: sc500-cs1c-adatum-legal
difficulty: 2
status: draft
stem:
  en: |
    You need to configure apim-adt-ai to meet the token budget requirement. You add the following policy to the inbound section of the API that exposes chat-main.

    How should you complete the policy? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer apim-adt-ai pour satisfaire l'exigence relative au budget de jetons. Vous ajoutez la stratégie suivante à la section inbound de l'API qui expose chat-main.

    Comment devez-vous compléter la stratégie ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    <inbound>
        <base />
        <llm-token-limit
            counter-key="[[key]]"
            [[limit]]="50000"
            estimate-prompt-tokens="[[estimate]]"
            remaining-tokens-variable-name="remainingTokens" />
    </inbound>
  slots:
    - id: key
      options:
        - { id: subscription, text: "@(context.Subscription.Id)" }
        - { id: ip, text: "@(context.Request.IpAddress)" }
        - { id: api, text: "@(context.Api.Id)" }
    - id: limit
      options:
        - { id: tpm, text: tokens-per-minute }
        - { id: quota, text: token-quota }
        - { id: calls, text: calls }
    - id: estimate
      options:
        - { id: "true", text: "true" }
        - { id: "false", text: "false" }
answer:
  values: { key: subscription, limit: tpm, estimate: "true" }
explanation:
  correct:
    en: |-
      Each practice group has its own API Management subscription, so the subscription ID gives one counter per practice group across all its applications. tokens-per-minute sets the rate limit; token-quota sets a quota over an hourly to yearly period instead. With estimate-prompt-tokens set to true, the gateway estimates the prompt tokens before calling the backend, so a request that already exceeds the limit is rejected with 429 without reaching chat-main.
    fr: |-
      Chaque département dispose de son propre abonnement API Management : l'ID d'abonnement donne donc un compteur par département pour l'ensemble de ses applications. tokens-per-minute définit la limite de débit ; token-quota définit plutôt un quota sur une période horaire à annuelle. Avec estimate-prompt-tokens à true, la passerelle estime les jetons du prompt avant d'appeler le back-end : une requête qui dépasse déjà la limite est rejetée avec le code 429 sans atteindre chat-main.
  options:
    ip:
      en: |-
        A counter per client IP address does not group all the applications of a practice group.
      fr: |-
        Un compteur par adresse IP cliente ne regroupe pas toutes les applications d'un département.
    api:
      en: |-
        A counter per API would be shared by the three practice groups.
      fr: |-
        Un compteur par API serait partagé par les trois départements.
    "false":
      en: |-
        With false, the policy uses the actual token usage from the response, so the request reaches the model before it is counted.
      fr: |-
        Avec false, la stratégie utilise la consommation réelle de jetons renvoyée dans la réponse : la requête atteint le modèle avant d'être comptée.
references:
  - title: Limit large language model API token usage
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-token-limit-policy
