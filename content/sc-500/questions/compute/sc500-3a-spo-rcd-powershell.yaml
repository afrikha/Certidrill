id: sc500-3a-spo-rcd-powershell
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has Microsoft 365 Copilot licenses and SharePoint Advanced Management. A data access governance report shows that the SharePoint site **Payroll** is overshared. You need to meet the following requirements:

    - Remove the content of Payroll from organization-wide search results and Copilot responses without changing any permissions.
    - Allow site administrators to manage this setting for their own sites.

    How should you complete the PowerShell commands? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose de licences Microsoft 365 Copilot et de SharePoint Advanced Management. Un rapport de gouvernance de l'accès aux données montre que le site SharePoint **Payroll** est surpartagé. Vous devez respecter les exigences suivantes :

    - retirer le contenu de Payroll des résultats de recherche à l'échelle de l'organisation et des réponses de Copilot sans modifier aucune autorisation ;
    - permettre aux administrateurs de site de gérer ce paramètre pour leurs propres sites.

    Comment devez-vous compléter les commandes PowerShell ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    [[c1]] -Identity https://wingtiptoys.sharepoint.com/sites/Payroll -[[p1]] $true
    [[c2]] -[[p2]] $true
  slots:
    - id: c1
      options:
        - { id: site, text: Set-SPOSite }
        - { id: tenant, text: Set-SPOTenant }
        - { id: get, text: Get-SPOSite }
    - id: p1
      options:
        - { id: rcd, text: RestrictContentOrgWideSearch }
        - { id: rac, text: RestrictedAccessControl }
        - { id: deleg, text: DelegateRestrictedContentDiscoverabilityManagement }
    - id: c2
      options:
        - { id: site, text: Set-SPOSite }
        - { id: tenant, text: Set-SPOTenant }
        - { id: get, text: Get-SPOTenant }
    - id: p2
      options:
        - { id: delegrcd, text: DelegateRestrictedContentDiscoverabilityManagement }
        - { id: delegrac, text: DelegateRestrictedAccessControlManagement }
        - { id: enablerac, text: EnableRestrictedAccessControl }
answer:
  values: { c1: site, p1: rcd, c2: tenant, p2: delegrcd }
explanation:
  correct:
    en: |
      Restricted content discovery is a site setting: Set-SPOSite with RestrictContentOrgWideSearch set to $true keeps the site out of organization-wide search and Copilot discovery while permissions stay unchanged. Only SharePoint administrators manage it by default; the tenant-level Set-SPOTenant -DelegateRestrictedContentDiscoverabilityManagement $true lets site administrators manage it for their sites, with a justification for each change.
    fr: |
      La découverte de contenu restreinte est un paramètre de site : Set-SPOSite avec RestrictContentOrgWideSearch à $true exclut le site de la recherche à l'échelle de l'organisation et de la découverte par Copilot, sans modifier les autorisations. Par défaut, seuls les administrateurs SharePoint la gèrent ; la commande de locataire Set-SPOTenant -DelegateRestrictedContentDiscoverabilityManagement $true permet aux administrateurs de site de la gérer pour leurs sites, avec une justification pour chaque modification.
  options:
    rac:
      en: |
        RestrictedAccessControl limits who can open the site to members of control groups, which changes effective access instead of only hiding the site.
      fr: |
        RestrictedAccessControl limite l'ouverture du site aux membres de groupes de contrôle, ce qui modifie l'accès effectif au lieu de seulement masquer le site.
    delegrac:
      en: |
        DelegateRestrictedAccessControlManagement delegates restricted access control, not restricted content discovery.
      fr: |
        DelegateRestrictedAccessControlManagement délègue le contrôle d'accès restreint, pas la découverte de contenu restreinte.
references:
  - title: Restrict discovery of SharePoint sites and content
    url: https://learn.microsoft.com/en-us/sharepoint/restricted-content-discovery
  - title: Restrict SharePoint site access with Microsoft 365 groups and Microsoft Entra security groups
    url: https://learn.microsoft.com/en-us/sharepoint/restricted-access-control
