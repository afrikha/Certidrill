id: sc500-3b-arc-private-firewall
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam connects its datacenter to a virtual network named **VNet-Hub** in West Europe by using a site-to-site VPN. You configure the following:

    - An Azure Arc private link scope named **PLS1** in West Europe, with a private endpoint in VNet-Hub.
    - DNS forwarding so that the on-premises servers resolve the private endpoint FQDNs to private IP addresses.
    - An onboarding script generated with the connectivity method **Private endpoint** and PLS1.

    The on-premises firewall blocks all outbound traffic to the internet. When you run the script on a server named **SRV1**, the connection to Azure fails during authentication.

    You need to connect SRV1 to Azure Arc. Traffic to the Azure Arc services must continue to use PLS1.

    What should you do?
  fr: |
    Fabrikam relie son centre de données à un réseau virtuel nommé **VNet-Hub** dans la région West Europe par un VPN site à site. Vous configurez les éléments suivants :

    - Une étendue de liaison privée Azure Arc nommée **PLS1** dans la région West Europe, avec un point de terminaison privé dans VNet-Hub.
    - Un transfert DNS pour que les serveurs locaux résolvent les noms de domaine complets du point de terminaison privé en adresses IP privées.
    - Un script d'intégration généré avec la méthode de connectivité **Private endpoint** et PLS1.

    Le pare-feu local bloque tout le trafic sortant vers Internet. Quand vous exécutez le script sur un serveur nommé **SRV1**, la connexion à Azure échoue pendant l'authentification.

    Vous devez connecter SRV1 à Azure Arc. Le trafic vers les services Azure Arc doit continuer d'utiliser PLS1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a second private link scope and associate it with VNet-Hub", fr: "Créer une deuxième étendue de liaison privée et l'associer à VNet-Hub" } }
    - { id: b, text: { en: "Add the Microsoft Entra ID and Azure Resource Manager endpoints to PLS1", fr: "Ajouter à PLS1 les points de terminaison de Microsoft Entra ID et d'Azure Resource Manager" } }
    - { id: c, text: { en: "Allow outbound TCP 443 to the AzureActiveDirectory and AzureResourceManager service tags", fr: "Autoriser le trafic sortant TCP 443 vers les étiquettes de service AzureActiveDirectory et AzureResourceManager" } }
    - { id: d, text: { en: "Regenerate the script with the connectivity method Public endpoint and an Azure Arc gateway", fr: "Régénérer le script avec la méthode de connectivité Public endpoint et une passerelle Azure Arc" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Traffic to Microsoft Entra ID and Azure Resource Manager doesn't go through the Azure Arc private link scope; it keeps using the default route to the internet. You must allow outbound TCP 443 to the AzureActiveDirectory and AzureResourceManager service tags in the on-premises firewall, while the Azure Arc service traffic keeps using the private endpoint of PLS1.
    fr: |
      Le trafic vers Microsoft Entra ID et Azure Resource Manager ne passe pas par l'étendue de liaison privée Azure Arc ; il continue d'utiliser l'itinéraire par défaut vers Internet. Vous devez autoriser le trafic sortant TCP 443 vers les étiquettes de service AzureActiveDirectory et AzureResourceManager dans le pare-feu local, tandis que le trafic des services Azure Arc continue d'utiliser le point de terminaison privé de PLS1.
  options:
    a: { en: "At most one Azure Arc private link scope can be associated with a virtual network, and a second scope wouldn't carry Entra ID traffic either.", fr: "Une seule étendue de liaison privée Azure Arc au maximum peut être associée à un réseau virtuel, et une deuxième étendue ne transporterait pas non plus le trafic Entra ID." }
    b: { en: "An Azure Arc private link scope only covers the Azure Arc services; Entra ID and Resource Manager traffic doesn't traverse it.", fr: "Une étendue de liaison privée Azure Arc ne couvre que les services Azure Arc ; le trafic Entra ID et Resource Manager ne la traverse pas." }
    d: { en: "A public endpoint configuration sends the Azure Arc traffic over the internet instead of PLS1, which the requirement forbids.", fr: "Une configuration avec point de terminaison public envoie le trafic Azure Arc par Internet au lieu de PLS1, ce que l'exigence interdit." }
references:
  - title: Use Azure Private Link to connect servers to Azure Arc by using a private endpoint
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/private-link-security
