id: sc500-cs2c-bastion-sku
objective: "3.2.2"
type: dragdrop
caseStudy: sc500-cs2c-margies-travel
difficulty: 1
status: draft
stem:
  en: |
    You need to select the Azure Bastion SKU of each Bastion host to meet the Bastion requirement.

    Which SKU should you use for each virtual network? To answer, drag the appropriate SKUs to the correct virtual networks. Each SKU may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir la référence SKU Azure Bastion de chaque hôte Bastion pour respecter l'exigence relative à Bastion.

    Quelle référence SKU devez-vous utiliser pour chaque réseau virtuel ? Pour répondre, faites glisser les références SKU appropriées vers les réseaux virtuels correspondants. Chaque référence SKU peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: dev, text: Developer }
    - { id: basic, text: Basic }
    - { id: standard, text: Standard }
    - { id: premium, text: Premium }
  targets:
    - { id: booking, text: vnet-booking }
    - { id: pci, text: vnet-pci }
    - { id: crm, text: vnet-crm }
answer:
  mapping: { booking: standard, pci: premium, crm: basic }
explanation:
  correct:
    en: |
      Connecting with a native client through the Azure CLI and uploading or downloading files require the Standard SKU or higher. Session recording is available only in the Premium SKU. Browser-based connections to VMs in peered virtual networks are supported from the Basic SKU, which costs less than Standard.
    fr: |
      La connexion avec un client natif par Azure CLI et le chargement ou le téléchargement de fichiers nécessitent la référence SKU Standard ou supérieure. L'enregistrement des sessions n'est disponible qu'avec la référence SKU Premium. Les connexions par navigateur aux machines virtuelles de réseaux virtuels reliés par peering sont prises en charge à partir de la référence SKU Basic, moins coûteuse que Standard.
  options:
    dev: { en: "The Developer SKU can't connect to VMs in peered virtual networks and supports neither native clients, file transfer nor session recording.", fr: "La référence SKU Developer ne peut pas se connecter aux machines virtuelles de réseaux virtuels reliés par peering et ne prend en charge ni les clients natifs, ni le transfert de fichiers, ni l'enregistrement des sessions." }
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
