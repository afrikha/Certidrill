id: sc500-3b-edr-fim-default
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has just enabled Microsoft Defender for Servers Plan 2 on an Azure subscription named **Sub1** with the default settings.

    The compliance team requires that changes to critical system files and registry keys on the VMs of Sub1 are monitored.

    What should you do?
  fr: |
    Contoso vient d'activer Microsoft Defender for Servers Plan 2 sur un abonnement Azure nommé **Sub1** avec les paramètres par défaut.

    L'équipe de conformité exige que les modifications des fichiers système critiques et des clés de Registre sur les machines virtuelles de Sub1 soient surveillées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Nothing, because file integrity monitoring is on by default with Plan 2", fr: "Rien, car la surveillance de l'intégrité des fichiers est activée par défaut avec le Plan 2" } }
    - { id: b, text: { en: "Turn on Agentless scanning for machines in the Settings and monitoring page of the plan", fr: "Activer Agentless scanning for machines dans la page Settings and monitoring du plan" } }
    - { id: c, text: { en: "Turn on File integrity monitoring in the Settings and monitoring page of the plan", fr: "Activer File integrity monitoring dans la page Settings and monitoring du plan" } }
    - { id: d, text: { en: "Turn on Vulnerability assessment for machines in the Settings and monitoring page of the plan", fr: "Activer Vulnerability assessment for machines dans la page Settings and monitoring du plan" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      File integrity monitoring is available with Defender for Servers Plan 2 but isn't turned on by default. You enable it from Environment settings, in the Settings and monitoring page of the Defender for Servers plan.
    fr: |
      La surveillance de l'intégrité des fichiers est disponible avec Defender for Servers Plan 2, mais elle n'est pas activée par défaut. Vous l'activez depuis les paramètres d'environnement, dans la page Settings and monitoring du plan Defender for Servers.
  options:
    a: { en: "Vulnerability assessment, endpoint protection and agentless scanning are on by default with Plan 2, but file integrity monitoring is off by default.", fr: "L'évaluation des vulnérabilités, la protection des points de terminaison et l'analyse sans agent sont activées par défaut avec le Plan 2, mais pas la surveillance de l'intégrité des fichiers." }
    b: { en: "Agentless scanning finds vulnerabilities, secrets and malware in disk snapshots; it doesn't monitor changes to files and registry keys.", fr: "L'analyse sans agent recherche des vulnérabilités, des secrets et des logiciels malveillants dans des instantanés de disques ; elle ne surveille pas les modifications des fichiers et des clés de Registre." }
    d: { en: "Vulnerability assessment reports software vulnerabilities; it doesn't track file or registry changes, and it is already on by default.", fr: "L'évaluation des vulnérabilités signale les vulnérabilités logicielles ; elle ne suit pas les modifications de fichiers ni du Registre, et elle est déjà activée par défaut." }
references:
  - title: Modify Defender for Servers plan settings in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/configure-servers-coverage
