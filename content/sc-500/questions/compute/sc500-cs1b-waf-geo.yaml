id: sc500-cs1b-waf-geo
objective: "3.3.8"
type: dropdown
caseStudy: sc500-cs1b-proseware
difficulty: 3
status: draft
stem:
  en: |
    You need to update wafpol-shop to meet the web application firewall requirement.

    How should you complete the policy? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez mettre à jour wafpol-shop pour satisfaire l'exigence relative au pare-feu d'applications web.

    Comment devez-vous compléter la stratégie ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "policySettings": {
      "state": "Enabled",
      "mode": "[[mode]]"
    },
    "customRules": [
      {
        "name": "BlockOutsideCustomerCountries",
        "priority": 10,
        "ruleType": "MatchRule",
        "action": "[[action]]",
        "matchConditions": [
          {
            "matchVariables": [ { "variableName": "RemoteAddr" } ],
            "operator": "[[operator]]",
            "negationCondition": [[negation]],
            "matchValues": [ "FR", "BE", "CH", "ZZ" ]
          }
        ]
      }
    ]
  slots:
    - id: mode
      options:
        - { id: detection, text: Detection }
        - { id: prevention, text: Prevention }
    - id: action
      options:
        - { id: allow, text: Allow }
        - { id: block, text: Block }
        - { id: log, text: Log }
    - id: operator
      options:
        - { id: geomatch, text: Geomatch }
        - { id: ipmatch, text: IPMatch }
        - { id: contains, text: Contains }
    - id: negation
      options:
        - { id: "true", text: "true" }
        - { id: "false", text: "false" }
answer:
  values: { mode: prevention, action: block, operator: geomatch, negation: "true" }
explanation:
  correct:
    en: |-
      In Detection mode, the WAF only logs matches, so Prevention mode is needed to block both the custom rule matches and the attacks detected by the managed rules. The Geomatch operator on RemoteAddr compares the client IP address with country codes; with negationCondition set to true, the Block rule matches every address that is not in France, Belgium, Switzerland or ZZ, the code for addresses not mapped to a country. Requests that do not match continue to the managed rule set.
    fr: |-
      En mode Detection, le WAF ne fait que journaliser les correspondances : le mode Prevention est nécessaire pour bloquer à la fois les correspondances de la règle personnalisée et les attaques détectées par les règles managées. L'opérateur Geomatch sur RemoteAddr compare l'adresse IP du client à des codes de pays ; avec negationCondition à true, la règle Block correspond à toute adresse qui n'est pas en France, en Belgique, en Suisse ni dans ZZ, le code des adresses associées à aucun pays. Les requêtes qui ne correspondent pas continuent vers l'ensemble de règles managé.
  options:
    allow:
      en: |-
        An Allow rule that matches the customer countries would skip all the remaining rules, including the managed rule set, for those requests.
      fr: |-
        Une règle Allow qui correspond aux pays des clients ferait ignorer toutes les règles restantes, y compris l'ensemble de règles managé, pour ces requêtes.
    ipmatch:
      en: |-
        IPMatch compares addresses with IP ranges, not with country codes.
      fr: |-
        IPMatch compare les adresses à des plages IP, pas à des codes de pays.
    "false":
      en: |-
        Without negation, the Block rule would block the customers in France, Belgium and Switzerland instead of the other countries.
      fr: |-
        Sans négation, la règle Block bloquerait les clients de France, de Belgique et de Suisse au lieu des autres pays.
references:
  - title: Custom rules for Web Application Firewall v2 on Azure Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/custom-waf-rules-overview
