id: sc500-sr1-jit-rdp-2
objective: "3.2.3"
type: series_yesno
series: sc500-sr1-jit-rdp
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You enable Defender for Servers Plan 1, delete Allow-RDP and enable JIT.
  fr: Vous activez Defender for Servers Plan 1, supprimez Allow-RDP et activez JIT.
body:
  solution:
    en: |
      You enable **Defender for Servers Plan 1** on Sub1. You delete the Allow-RDP rule from NSG1. You enable just-in-time (JIT) VM access on VM1 to VM10 for port **3389** with a maximum request time of **3 hours**.
    fr: |
      Vous activez **Defender for Servers Plan 1** sur Sub1. Vous supprimez la règle Allow-RDP de NSG1. Vous activez l'accès juste-à-temps (JIT) aux machines virtuelles sur VM1 à VM10 pour le port **3389** avec une durée maximale de demande de **3 heures**.
answer: { value: false }
explanation:
  correct:
    en: |
      Just-in-time VM access is a Defender for Servers Plan 2 feature; Plan 1 focuses on the Microsoft Defender for Endpoint integration and does not include JIT. With Plan 1, JIT cannot be enabled on the VMs, so administrators have no way to request temporary RDP access after Allow-RDP is deleted.
    fr: |
      L'accès juste-à-temps aux machines virtuelles est une fonctionnalité de Defender for Servers Plan 2 ; Plan 1 est centré sur l'intégration de Microsoft Defender for Endpoint et n'inclut pas JIT. Avec Plan 1, JIT ne peut pas être activé sur les machines virtuelles : une fois Allow-RDP supprimée, les administrateurs n'ont aucun moyen de demander un accès RDP temporaire.
references:
  - title: Overview of Defender for Servers in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview
