id: sc500-cs4b-app-basic-auth
objective: "3.3.7"
type: multi
caseStudy: sc500-cs4b-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the deployment requirement for app-booking.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence de déploiement d'app-booking.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Set SCM Basic Auth Publishing Credentials to Off for app-booking.", fr: "Définir SCM Basic Auth Publishing Credentials sur Off pour app-booking." } }
    - { id: b, text: { en: "Set FTP Basic Auth Publishing Credentials to Off for app-booking.", fr: "Définir FTP Basic Auth Publishing Credentials sur Off pour app-booking." } }
    - { id: c, text: { en: "Reconfigure the GitHub Actions workflow to authenticate with a user-assigned managed identity.", fr: "Reconfigurer le workflow GitHub Actions pour qu'il s'authentifie avec une identité managée affectée par l'utilisateur." } }
    - { id: d, text: { en: "Reset the publish profile of app-booking and update the GitHub secret of the workflow.", fr: "Réinitialiser le profil de publication d'app-booking et mettre à jour le secret GitHub du workflow." } }
    - { id: e, text: { en: "Set the FTP state of app-booking to FTPS only.", fr: "Définir l'état FTP d'app-booking sur FTPS only." } }
    - { id: f, text: { en: "Enable App Service authentication on app-booking with the Microsoft identity provider.", fr: "Activer l'authentification App Service sur app-booking avec le fournisseur d'identité Microsoft." } }
answer: { optionIds: [a, b, c] }
explanation:
  correct:
    en: |
      Turning off SCM basic authentication blocks local Git and the other non-FTP methods that use publishing credentials, and turning off FTP basic authentication blocks FTP. An existing GitHub Actions workflow that uses the publish profile stops working once basic authentication is disabled, so it must be reconfigured to use a user-assigned identity, which authenticates with Microsoft Entra ID.
    fr: |
      La désactivation de l'authentification de base SCM bloque Git local et les autres méthodes non FTP qui utilisent les informations d'identification de publication, et la désactivation de l'authentification de base FTP bloque FTP. Un workflow GitHub Actions existant qui utilise le profil de publication cesse de fonctionner une fois l'authentification de base désactivée : il doit être reconfiguré pour utiliser une identité affectée par l'utilisateur, qui s'authentifie avec Microsoft Entra ID.
  options:
    d:
      en: |
        A new publish profile still contains basic authentication credentials, which are blocked once basic authentication is disabled.
      fr: |
        Un nouveau profil de publication contient toujours des informations d'identification d'authentification de base, qui sont bloquées une fois l'authentification de base désactivée.
    e:
      en: |
        FTPS only encrypts the FTP session, but FTPS still authenticates with the publishing credentials.
      fr: |
        FTPS only chiffre la session FTP, mais FTPS s'authentifie toujours avec les informations d'identification de publication.
    f:
      en: |
        App Service authentication signs in the users of the web app; it does not control how deployments authenticate.
      fr: |
        L'authentification App Service connecte les utilisateurs de l'application web ; elle ne contrôle pas la façon dont les déploiements s'authentifient.
references:
  - title: Disable basic authentication in Azure App Service deployments
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-basic-auth-disable
