id: sc500-3a-gw-limit-responses
objective: "3.1.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys shares one Microsoft Foundry resource between the projects of three teams. An AI Gateway is configured on the resource, and all projects are enabled on it. You need to meet the following requirements:

    - No team can consume the token capacity of another team.
    - A team's burst of requests is slowed down before the model deployment is called.
    - A team that exhausts its monthly token budget can't call the model until the next period.

    How should you complete the design? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys partage une ressource Microsoft Foundry entre les projets de trois équipes. Une passerelle AI Gateway est configurée sur la ressource, et tous les projets y sont activés. Vous devez respecter les exigences suivantes :

    - aucune équipe ne peut consommer la capacité en jetons d'une autre équipe ;
    - une rafale de requêtes d'une équipe est freinée avant l'appel du déploiement de modèle ;
    - une équipe qui épuise son budget mensuel de jetons ne peut plus appeler le modèle avant la période suivante.

    Comment devez-vous compléter la conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Set the token limits per: [[scope]]
      A request over the tokens-per-minute limit returns: [[tpm]]
      A request over the total token quota returns: [[quota]]
    fr: |
      Définir les limites de jetons par : [[scope]]
      Une requête au-delà de la limite de jetons par minute renvoie : [[tpm]]
      Une requête au-delà du quota total de jetons renvoie : [[quota]]
  slots:
    - id: scope
      options:
        - { id: project, text: { en: "Project and deployment", fr: "Projet et déploiement" } }
        - { id: resource, text: { en: "Foundry resource", fr: "Ressource Foundry" } }
        - { id: apim, text: { en: "API Management instance", fr: "Instance Gestion des API" } }
    - id: tpm
      options:
        - { id: c401, text: "401 Unauthorized" }
        - { id: c403, text: "403 Forbidden" }
        - { id: c429, text: "429 Too Many Requests" }
        - { id: c503, text: "503 Service Unavailable" }
    - id: quota
      options:
        - { id: c401, text: "401 Unauthorized" }
        - { id: c403, text: "403 Forbidden" }
        - { id: c429, text: "429 Too Many Requests" }
        - { id: c503, text: "503 Service Unavailable" }
answer:
  values: { scope: project, tpm: c429, quota: c403 }
explanation:
  correct:
    en: |
      All projects of a Foundry resource share one gateway, and Token management sets each limit for a project and deployment pair, which gives every team its own ceiling. Exceeding the tokens-per-minute rate limit returns 429 Too Many Requests, while exhausting the total token quota of the period returns 403 Forbidden.
    fr: |
      Tous les projets d'une ressource Foundry partagent une passerelle, et Token management définit chaque limite pour une paire projet-déploiement, ce qui donne à chaque équipe son propre plafond. Dépasser la limite de débit en jetons par minute renvoie 429 Too Many Requests, alors qu'épuiser le quota total de jetons de la période renvoie 403 Forbidden.
  options:
    resource:
      en: |
        A limit on the whole resource would let one team consume the capacity of the others.
      fr: |
        Une limite sur toute la ressource permettrait à une équipe de consommer la capacité des autres.
references:
  - title: Enforce token limits for models
    url: https://learn.microsoft.com/en-us/azure/foundry/control-plane/how-to-enforce-limits-models
  - title: Configure AI Gateway in your Foundry resources
    url: https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal
