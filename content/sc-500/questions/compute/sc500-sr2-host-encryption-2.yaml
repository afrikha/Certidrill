id: sc500-sr2-host-encryption-2
objective: "3.2.1"
type: series_yesno
series: sc500-sr2-host-encryption
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You register EncryptionAtHost, enable encryption at host, and use a disk encryption set with key1.
  fr: Vous inscrivez EncryptionAtHost, activez le chiffrement sur l'hôte et utilisez un jeu de chiffrement de disque avec key1.
body:
  solution:
    en: |
      You run the following commands.

      ```bash
      az feature register --namespace Microsoft.Compute --name EncryptionAtHost
      az feature show --namespace Microsoft.Compute --name EncryptionAtHost
      ```

      When the state is **Registered**, you create a disk encryption set named **DES1** with the encryption type **Encryption at-rest with a customer-managed key** and key1, and you grant DES1 access to KV1. You deallocate VM1. In **Disks** > **Additional settings**, you set **Encryption at host** to **Yes**, and you configure the OS disk and both data disks to use DES1. You start VM1.
    fr: |
      Vous exécutez les commandes suivantes.

      ```bash
      az feature register --namespace Microsoft.Compute --name EncryptionAtHost
      az feature show --namespace Microsoft.Compute --name EncryptionAtHost
      ```

      Lorsque l'état est **Registered**, vous créez un jeu de chiffrement de disque nommé **DES1** avec le type de chiffrement **Encryption at-rest with a customer-managed key** et key1, puis vous accordez à DES1 l'accès à KV1. Vous libérez VM1. Dans **Disks** > **Additional settings**, vous définissez **Encryption at host** sur **Yes**, puis vous configurez le disque de système d'exploitation et les deux disques de données pour utiliser DES1. Vous démarrez VM1.
answer: { value: true }
explanation:
  correct:
    en: Encryption at host requires the EncryptionAtHost feature registration, and an existing VM must be deallocated to enable it; VM1 never had Azure Disk Encryption, which would block it. It encrypts the temporary disk (with platform-managed keys) and the caches, and data flows encrypted to storage. With DES1, the OS and data disks use key1, and the host does the work, not the VM's CPU.
    fr: "Le chiffrement sur l'hôte nécessite l'inscription de la fonctionnalité EncryptionAtHost, et une machine virtuelle existante doit être libérée pour l'activer ; VM1 n'a jamais utilisé Azure Disk Encryption, qui l'empêcherait. Il chiffre le disque temporaire (avec des clés gérées par la plateforme) et les caches, et les données circulent chiffrées jusqu'au stockage. Avec DES1, les disques de système d'exploitation et de données utilisent key1, et c'est l'hôte qui travaille, pas le processeur de la machine virtuelle."
references:
