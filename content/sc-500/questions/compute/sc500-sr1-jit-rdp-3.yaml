id: sc500-sr1-jit-rdp-3
objective: "3.2.3"
type: series_yesno
series: sc500-sr1-jit-rdp
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You enable Defender for Servers Plan 2 and enable JIT without changing NSG1.
  fr: Vous activez Defender for Servers Plan 2 et activez JIT sans modifier NSG1.
body:
  solution:
    en: |
      You enable **Defender for Servers Plan 2** on Sub1. You enable just-in-time (JIT) VM access on VM1 to VM10 for port **3389** with a maximum request time of **3 hours**. You leave the existing rules of NSG1 unchanged.
    fr: |
      Vous activez **Defender for Servers Plan 2** sur Sub1. Vous activez l'accès juste-à-temps (JIT) aux machines virtuelles sur VM1 à VM10 pour le port **3389** avec une durée maximale de demande de **3 heures**. Vous laissez inchangées les règles existantes de NSG1.
answer: { value: false }
explanation:
  correct:
    en: |
      When JIT is enabled, Defender for Cloud ensures that deny rules exist for the selected ports, but existing rules that already cover those ports keep priority over the new deny rules. Allow-RDP still allows port 3389 from any source, so RDP is not blocked by default. The Allow-RDP rule must be removed for JIT to control access.
    fr: |
      Lorsque JIT est activé, Defender for Cloud s'assure que des règles de refus existent pour les ports sélectionnés, mais les règles existantes qui couvrent déjà ces ports restent prioritaires sur les nouvelles règles de refus. Allow-RDP autorise toujours le port 3389 depuis n'importe quelle source : le RDP n'est donc pas bloqué par défaut. La règle Allow-RDP doit être supprimée pour que JIT contrôle l'accès.
references:
  - title: Just-in-time machine access in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview
