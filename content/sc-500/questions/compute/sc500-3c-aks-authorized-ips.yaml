id: sc500-3c-aks-authorized-ips
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an AKS cluster named **aks-web** that uses a Standard SKU load balancer and a public API server endpoint. Administrators manage the cluster from the office network 203.0.113.0/24. A self-hosted build agent with the public IP address 198.51.100.10 deploys workloads to the cluster.

    You need to ensure that only the administrators and the build agent can reach the Kubernetes API server. The API server must keep its public endpoint, and the solution must minimize administrative effort.

    What should you do?
  fr: |
    Adatum dispose d'un cluster AKS nommé **aks-web** qui utilise un équilibreur de charge de SKU Standard et un point de terminaison public pour le serveur d'API. Les administrateurs gèrent le cluster depuis le réseau du bureau 203.0.113.0/24. Un agent de build auto-hébergé, d'adresse IP publique 198.51.100.10, déploie les charges de travail sur le cluster.

    Vous devez vous assurer que seuls les administrateurs et l'agent de build peuvent joindre le serveur d'API Kubernetes. Le serveur d'API doit conserver son point de terminaison public, et la solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Associate an NSG with the node subnet that allows TCP 443 only from both addresses.", fr: "Associer au sous-réseau des nœuds un NSG qui autorise TCP 443 uniquement depuis les deux adresses." } }
    - { id: b, text: { en: "Create a Kubernetes network policy that allows ingress only from both addresses.", fr: "Créer une stratégie réseau Kubernetes qui n'autorise le trafic entrant que depuis les deux adresses." } }
    - { id: c, text: { en: "Enable Azure RBAC for Kubernetes authorization and assign roles to both identities.", fr: "Activer Azure RBAC pour l'autorisation Kubernetes et attribuer des rôles aux deux identités." } }
    - { id: d, text: { en: "Run `az aks update` with `--api-server-authorized-ip-ranges` and both ranges.", fr: "Exécuter `az aks update` avec `--api-server-authorized-ip-ranges` et les deux plages." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Authorized IP ranges restrict which public addresses can reach the API server while keeping its public endpoint. On an existing cluster you run `az aks update --api-server-authorized-ip-ranges 203.0.113.0/24,198.51.100.10/32`; the feature requires the Standard load balancer, which aks-web uses."
    fr: "Les plages d'adresses IP autorisées limitent les adresses publiques qui peuvent joindre le serveur d'API tout en conservant son point de terminaison public. Sur un cluster existant, vous exécutez `az aks update --api-server-authorized-ip-ranges 203.0.113.0/24,198.51.100.10/32` ; la fonctionnalité nécessite l'équilibreur de charge Standard, qu'aks-web utilise."
  options:
    a:
      en: "The API server is part of the managed control plane, not of the node subnet, so an NSG on the node subnet does not filter API server traffic."
      fr: "Le serveur d'API fait partie du plan de contrôle managé, pas du sous-réseau des nœuds : un NSG sur ce sous-réseau ne filtre pas le trafic vers le serveur d'API."
    b:
      en: "Network policies filter traffic between pods; they do not control access to the API server."
      fr: "Les stratégies réseau filtrent le trafic entre pods ; elles ne contrôlent pas l'accès au serveur d'API."
    c:
      en: "Azure RBAC controls what an authenticated identity can do, not which networks can reach the endpoint."
      fr: "Azure RBAC contrôle ce qu'une identité authentifiée peut faire, pas les réseaux qui peuvent joindre le point de terminaison."
references:
  - title: Secure access to the API server using authorized IP address ranges in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/api-server-authorized-ip-ranges
