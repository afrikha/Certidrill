id: sc500-3a-aid-access-package
objective: "3.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Entra ID Governance with Microsoft Agent 365 licenses. You create an access package named **AP-ReportsReader** that contains the membership of a security group. The security group grants read access to a reporting API.

    You need to configure the assignment policy of AP-ReportsReader to meet the following requirements:

    - Any agent identity in the tenant can be assigned the package.
    - Requests come from the human who is accountable for the business purpose of each agent, so that a person stays in the loop.

    How should you complete the configuration? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Entra ID Governance avec des licences Microsoft Agent 365. Vous créez un package d'accès nommé **AP-ReportsReader** qui contient l'appartenance à un groupe de sécurité. Ce groupe de sécurité accorde l'accès en lecture à une API de rapports.

    Vous devez configurer la stratégie d'attribution d'AP-ReportsReader pour respecter les exigences suivantes :

    - toute identité d'agent du locataire peut se voir attribuer le package ;
    - les demandes proviennent de la personne responsable de la finalité métier de chaque agent, afin qu'un humain reste dans la boucle.

    Comment devez-vous compléter la configuration ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Who can get access: [[who]]
      Scope: [[scope]]
      Request submitted on behalf of each agent by: [[req]]
    fr: |
      Who can get access : [[who]]
      Étendue : [[scope]]
      Demande soumise pour le compte de chaque agent par : [[req]]
  slots:
    - id: who
      options:
        - { id: inside, text: "For users in your directory" }
        - { id: agents, text: "For users, service principals, and agent identities in your directory" }
        - { id: outside, text: "For users not in your directory" }
    - id: scope
      options:
        - { id: allagents, text: All agents }
        - { id: allsp, text: All Service principals }
        - { id: specific, text: Specific users and groups }
    - id: req
      options:
        - { id: sponsor, text: { en: "The agent's sponsor", fr: "Le sponsor de l'agent" } }
        - { id: owner, text: { en: "The agent's owner", fr: "Le propriétaire de l'agent" } }
        - { id: admin, text: { en: "A Global Administrator", fr: "Un Global Administrator" } }
answer:
  values: { who: agents, scope: allagents, req: sponsor }
explanation:
  correct:
    en: |
      To let agents receive a package, the policy's Who can get access section uses For users, service principals, and agent identities in your directory with All agents. A request can come from the agent identity itself, from its sponsor on its behalf, or from an administrator's direct assignment; the sponsor path keeps the business owner, a human, in the loop.
    fr: |
      Pour que des agents puissent recevoir un package, la section Who can get access de la stratégie utilise For users, service principals, and agent identities in your directory avec All agents. Une demande peut venir de l'identité d'agent elle-même, de son sponsor pour son compte ou d'une attribution directe par un administrateur ; le passage par le sponsor maintient le responsable métier, un humain, dans la boucle.
  options:
    allsp:
      en: |
        All Service principals is an additional policy for agents that use service principals instead of agent identities.
      fr: |
        All Service principals est une stratégie supplémentaire pour les agents qui utilisent des principaux de service au lieu d'identités d'agent.
    owner:
      en: |
        Owners are technical administrators; the business accountability that the requirement describes belongs to the sponsor.
      fr: |
        Les propriétaires sont des administrateurs techniques ; la responsabilité métier décrite par l'exigence appartient au sponsor.
references:
  - title: Governing Agent Identities
    url: https://learn.microsoft.com/en-us/entra/id-governance/agent-id-governance-overview
