id: sc500-3b-enc-host-restrictions
objective: "3.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has the following Azure virtual machines. The EncryptionAtHost feature is registered on the subscription, and both VMs use supported sizes.

    | VM | Current disk encryption |
    | --- | --- |
    | VM1 | Azure Disk Encryption was enabled last year and was disabled last month |
    | VM2 | Server-side encryption with platform-managed keys only |

    A disk encryption set named **DES1** uses a customer-managed key. You plan to enable encryption at host on the VMs and to use DES1 for their OS and data disks.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose des machines virtuelles Azure suivantes. La fonctionnalité EncryptionAtHost est inscrite sur l'abonnement, et les deux machines virtuelles utilisent des tailles prises en charge.

    | Machine virtuelle | Chiffrement de disque actuel |
    | --- | --- |
    | VM1 | Azure Disk Encryption a été activé l'an dernier et désactivé le mois dernier |
    | VM2 | Chiffrement côté serveur avec des clés gérées par la plateforme uniquement |

    Un jeu de chiffrement de disque nommé **DES1** utilise une clé gérée par le client. Vous prévoyez d'activer le chiffrement sur l'hôte sur les machines virtuelles et d'utiliser DES1 pour leurs disques de système d'exploitation et de données.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You can enable encryption at host on VM1 now that Azure Disk Encryption is disabled.", fr: "Vous pouvez activer le chiffrement sur l'hôte sur VM1 maintenant qu'Azure Disk Encryption est désactivé." } }
    - { id: b, text: { en: "VM2 must be deallocated before encryption at host can be enabled on it.", fr: "VM2 doit être libérée avant que le chiffrement sur l'hôte puisse y être activé." } }
    - { id: c, text: { en: "With DES1, the temp disk of VM2 is encrypted with the customer-managed key.", fr: "Avec DES1, le disque temporaire de VM2 est chiffré avec la clé gérée par le client." } }
    - { id: d, text: { en: "After encryption at host is enabled on VM2, Defender for Cloud reports VM2's disk encryption status as healthy.", fr: "Une fois le chiffrement sur l'hôte activé sur VM2, Defender for Cloud indique que l'état de chiffrement des disques de VM2 est sain." } }
    - { id: e, text: { en: "Encryption at host uses VM2's CPU to encrypt the disk caches.", fr: "Le chiffrement sur l'hôte utilise le processeur de VM2 pour chiffrer les caches de disque." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Existing VMs must be deallocated and reallocated to be encrypted at host. Defender for Cloud reports encryption at host as healthy for disk encryption, whereas server-side encryption alone is reported as unhealthy.
    fr: |
      Les machines virtuelles existantes doivent être libérées puis réallouées pour être chiffrées sur l'hôte. Defender for Cloud considère le chiffrement sur l'hôte comme sain pour le chiffrement de disque, alors que le chiffrement côté serveur seul est signalé comme non sain.
  options:
    a: { en: "Encryption at host can't be enabled on a VM that currently has or ever had Azure Disk Encryption enabled.", fr: "Le chiffrement sur l'hôte ne peut pas être activé sur une machine virtuelle sur laquelle Azure Disk Encryption est ou a déjà été activé." }
    c: { en: "Temp disks are encrypted with platform-managed keys only; the customer-managed key protects the OS and data disks and their caches.", fr: "Les disques temporaires sont chiffrés uniquement avec des clés gérées par la plateforme ; la clé gérée par le client protège les disques de système d'exploitation et de données et leurs caches." }
    e: { en: "Encryption at host runs on the VM host and doesn't use the VM's CPU.", fr: "Le chiffrement sur l'hôte s'exécute sur l'hôte de la machine virtuelle et n'utilise pas son processeur." }
references:
  - title: Server-side encryption of Azure managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption
  - title: Overview of managed disk encryption options
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
