id: sc500-3b-mc-no-results
objective: "3.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso assigned the Machine Configuration prerequisites initiative and the Azure compute security baseline policy to a subscription named **Sub1** two weeks ago, and remediated all existing VMs. Sub1 contains the following Azure VMs.

    | VM | Subnet | Machine Configuration extension | System-assigned managed identity |
    | --- | --- | --- | --- |
    | VM1 | Subnet-App | Installed | Enabled |
    | VM2 | Subnet-Data | Installed | Enabled |

    Both subnets use a NAT gateway for outbound access. The NSG of Subnet-Data contains an outbound rule that denies all traffic to the Internet service tag. No private endpoint exists in the virtual network. VM1 reports baseline compliance results, but VM2 never reports any guest assignment results.

    You need VM2 to report its baseline compliance.

    What should you do?
  fr: |
    Il y a deux semaines, Contoso a attribué à un abonnement nommé **Sub1** l'initiative des prérequis de Machine Configuration et la stratégie de base de référence de sécurité de calcul Azure, puis a corrigé toutes les machines virtuelles existantes. Sub1 contient les machines virtuelles Azure suivantes.

    | Machine virtuelle | Sous-réseau | Extension Machine Configuration | Identité managée affectée par le système |
    | --- | --- | --- | --- |
    | VM1 | Subnet-App | Installée | Activée |
    | VM2 | Subnet-Data | Installée | Activée |

    Les deux sous-réseaux utilisent une passerelle NAT pour l'accès sortant. Le NSG de Subnet-Data contient une règle sortante qui refuse tout le trafic vers l'étiquette de service Internet. Aucun point de terminaison privé n'existe dans le réseau virtuel. VM1 signale ses résultats de conformité à la base de référence, mais VM2 ne signale jamais aucun résultat d'attribution d'invité.

    VM2 doit signaler sa conformité à la base de référence.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a new remediation task for the prerequisites initiative assignment", fr: "Créer une nouvelle tâche de correction pour l'attribution de l'initiative des prérequis" } }
    - { id: b, text: { en: "Allow outbound HTTPS on TCP 443 from Subnet-Data to the Machine Configuration service", fr: "Autoriser le trafic HTTPS sortant sur TCP 443 de Subnet-Data vers le service Machine Configuration" } }
    - { id: c, text: { en: "Replace the system-assigned managed identity of VM2 with a user-assigned managed identity", fr: "Remplacer l'identité managée affectée par le système de VM2 par une identité managée affectée par l'utilisateur" } }
    - { id: d, text: { en: "Change the baseline assignment of VM2 to the Apply and Autocorrect mode", fr: "Passer l'attribution de la base de référence de VM2 en mode Apply and Autocorrect" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      VM2 already has the extension and the system-assigned identity, so the remaining requirement is connectivity. The Machine Configuration extension must reach the service by outbound HTTPS on TCP 443 or through private networking; the deny rule to Internet blocks the public path, and no private endpoint provides another one.
    fr: |
      VM2 dispose déjà de l'extension et de l'identité affectée par le système : l'exigence restante est la connectivité. L'extension Machine Configuration doit joindre le service en HTTPS sortant sur TCP 443 ou par un réseau privé ; la règle de refus vers Internet bloque le chemin public, et aucun point de terminaison privé n'en fournit un autre.
  options:
    a: { en: "A remediation task deploys the extension and the identity, which VM2 already has; it doesn't fix the network path.", fr: "Une tâche de correction déploie l'extension et l'identité, dont VM2 dispose déjà ; elle ne corrige pas le chemin réseau." }
    c: { en: "VM2's system-assigned identity already meets the authentication requirement; changing the identity type doesn't fix the blocked network path.", fr: "L'identité affectée par le système de VM2 répond déjà à l'exigence d'authentification ; changer de type d'identité ne corrige pas le chemin réseau bloqué." }
    d: { en: "The assignment mode controls whether settings are applied; it doesn't help a VM that can't reach the service.", fr: "Le mode d'attribution détermine si les paramètres sont appliqués ; il n'aide pas une machine virtuelle qui ne peut pas joindre le service." }
references:
  - title: Azure Machine Configuration (guest configuration)
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/guest-configuration
