id: sc500-3c-app-https-only
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an App Service web app named **app-catalog** with the custom domain catalog.proseware.com and a TLS binding for that domain. A previous administrator set **HTTPS Only** to **Off** in the app's general settings. The minimum inbound TLS version is 1.2.

    You need to ensure that users who browse to `http://catalog.proseware.com` are redirected to HTTPS.

    What should you do?
  fr: |
    Proseware dispose d'une application web App Service nommée **app-catalog** avec le domaine personnalisé catalog.proseware.com et une liaison TLS pour ce domaine. Un ancien administrateur a défini **HTTPS Only** sur **Off** dans les paramètres généraux de l'application. La version TLS minimale entrante est 1.2.

    Vous devez vous assurer que les utilisateurs qui accèdent à `http://catalog.proseware.com` sont redirigés vers HTTPS.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the minimum inbound TLS version to 1.3.", fr: "Définir la version TLS minimale entrante sur 1.3." } }
    - { id: b, text: { en: "Set the client certificate mode to **Required**.", fr: "Définir le mode de certificat client sur **Required**." } }
    - { id: c, text: { en: "Set **HTTPS Only** to **On**.", fr: "Définir **HTTPS Only** sur **On**." } }
    - { id: d, text: { en: "Set the unmatched rule action of the access restrictions to **Deny**.", fr: "Définir l'action de la règle sans correspondance des restrictions d'accès sur **Deny**." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The HTTPS Only setting makes App Service redirect HTTP requests to HTTPS. App Service applies this redirect by default, but it can be disabled in the general settings, as was done here, so you must turn it back on."
    fr: "Le paramètre HTTPS Only fait rediriger par App Service les requêtes HTTP vers HTTPS. App Service applique cette redirection par défaut, mais elle peut être désactivée dans les paramètres généraux, comme ici : vous devez donc la réactiver."
  options:
    a:
      en: "The minimum TLS version applies to HTTPS connections only; it does not redirect plain HTTP requests."
      fr: "La version TLS minimale ne s'applique qu'aux connexions HTTPS ; elle ne redirige pas les requêtes HTTP."
    b:
      en: "Client certificates add mutual TLS on HTTPS connections; they do not redirect HTTP traffic."
      fr: "Les certificats clients ajoutent le TLS mutuel sur les connexions HTTPS ; ils ne redirigent pas le trafic HTTP."
    d:
      en: "Access restrictions filter callers by source; they do not redirect and do not distinguish HTTP from HTTPS."
      fr: "Les restrictions d'accès filtrent les appelants selon leur source ; elles ne redirigent pas et ne distinguent pas HTTP de HTTPS."
references:
  - title: Enable HTTPS for a custom domain in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-bindings
