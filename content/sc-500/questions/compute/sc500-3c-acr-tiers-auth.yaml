id: sc500-3c-acr-tiers-auth
objective: "3.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has just created a Basic tier Azure container registry named **acrdev** with the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam vient de créer un registre de conteneurs Azure de niveau De base (Basic) nommé **acrdev** avec les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If you enable the admin user on acrdev, it can be limited to pull-only access by assigning it the AcrPull role."
        fr: "Si vous activez l'utilisateur administrateur sur acrdev, vous pouvez le limiter à l'extraction en lui attribuant le rôle AcrPull."
    - id: s2
      text:
        en: "You can enable anonymous pull access on acrdev without changing its tier."
        fr: "Vous pouvez activer l'accès d'extraction anonyme sur acrdev sans changer son niveau."
    - id: s3
      text:
        en: "You can create tokens with scope maps on acrdev to grant access to specific repositories."
        fr: "Vous pouvez créer sur acrdev des jetons associés à des mappages d'étendue pour accorder l'accès à des dépôts précis."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "The admin user is disabled by default and, when enabled, always has full pull and push access; it does not support Microsoft Entra role assignments. Anonymous pull is available only on the Standard and Premium tiers. Repository-scoped permissions with tokens and scope maps are available on all tiers, with lower token limits on Basic."
    fr: "L'utilisateur administrateur est désactivé par défaut et, une fois activé, dispose toujours d'un accès complet en extraction et en envoi ; il ne prend pas en charge les attributions de rôles Microsoft Entra. L'extraction anonyme n'est disponible que dans les niveaux Standard et Premium. Les autorisations limitées aux dépôts avec des jetons et des mappages d'étendue sont disponibles dans tous les niveaux, avec des limites de jetons plus faibles en niveau De base (Basic)."
references:
  - title: Authenticate with Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-authentication
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
