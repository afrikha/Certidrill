id: sc500-3b-edr-remove-sensor
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Defender for Servers Plan 2 on an Azure subscription named **Sub1**. Adatum decides to protect the Windows VMs of Sub1 with a non-Microsoft EDR product but to keep the other Defender for Servers features.

    You turn off the **Endpoint protection** setting of the plan for Sub1. A week later, the Defender for Endpoint sensor is still running on the VMs.

    You need to remove Defender for Endpoint from the VMs.

    What should you do next?
  fr: |
    Adatum utilise Defender for Servers Plan 2 sur un abonnement Azure nommé **Sub1**. Adatum décide de protéger les machines virtuelles Windows de Sub1 avec un produit EDR non Microsoft, tout en conservant les autres fonctionnalités de Defender for Servers.

    Vous désactivez le paramètre **Endpoint protection** du plan pour Sub1. Une semaine plus tard, le capteur Defender for Endpoint s'exécute toujours sur les machines virtuelles.

    Vous devez retirer Defender for Endpoint des machines virtuelles.

    Que devez-vous faire ensuite ?
body:
  options:
    - { id: a, text: { en: "Remove the MDE.Windows extension from each VM, and then offboard the devices from Defender for Endpoint", fr: "Supprimer l'extension MDE.Windows de chaque machine virtuelle, puis retirer les appareils de Defender for Endpoint" } }
    - { id: b, text: { en: "Change the plan of Sub1 to Plan 1, and then turn Endpoint protection off again", fr: "Passer le plan de Sub1 au Plan 1, puis désactiver de nouveau Endpoint protection" } }
    - { id: c, text: { en: "Delete the DeviceTags registry values on each VM, and then restart the VMs", fr: "Supprimer les valeurs de Registre DeviceTags sur chaque machine virtuelle, puis redémarrer les machines virtuelles" } }
    - { id: d, text: { en: "Turn off Vulnerability assessment for machines, and then turn off Agentless scanning for machines", fr: "Désactiver Vulnerability assessment for machines, puis désactiver Agentless scanning for machines" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Turning off Endpoint protection stops the integration but doesn't uninstall the sensor. The documented removal steps are to remove the MDE.Windows (or MDE.Linux) extension from the machine and then offboard the device from the Defender for Endpoint service.
    fr: |
      La désactivation d'Endpoint protection arrête l'intégration, mais ne désinstalle pas le capteur. La procédure de suppression consiste à supprimer l'extension MDE.Windows (ou MDE.Linux) de la machine, puis à retirer l'appareil du service Defender for Endpoint.
  options:
    b: { en: "Endpoint protection is part of both plans; changing the plan doesn't remove the sensor and Adatum wants to keep the Plan 2 features.", fr: "Endpoint protection fait partie des deux plans ; changer de plan ne supprime pas le capteur, et Adatum veut conserver les fonctionnalités du Plan 2." }
    c: { en: "The DeviceTags values remain after offboarding and don't affect functionality; deleting them doesn't remove the sensor.", fr: "Les valeurs DeviceTags subsistent après le retrait et n'affectent pas le fonctionnement ; les supprimer ne retire pas le capteur." }
    d: { en: "These settings control vulnerability scanning; they don't remove the Defender for Endpoint sensor.", fr: "Ces paramètres contrôlent l'analyse des vulnérabilités ; ils ne retirent pas le capteur Defender for Endpoint." }
references:
  - title: Enable Defender for Endpoint integration in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-defender-for-endpoint
