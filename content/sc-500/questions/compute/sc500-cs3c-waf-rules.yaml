id: sc500-cs3c-waf-rules
objective: "3.3.8"
type: yesno_statements
caseStudy: sc500-cs3c-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You review the custom rules of wafp-claims.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les règles personnalisées de wafp-claims.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          After wafp-claims is switched to Prevention mode, a request from 203.0.113.25 that contains a SQL injection pattern is blocked by the managed rule set.
        fr: |-
          Une fois wafp-claims passée en mode Prévention, une requête provenant de 203.0.113.25 qui contient un motif d'injection SQL est bloquée par l'ensemble de règles managé.
    - id: s2
      text:
        en: |-
          While wafp-claims is in Detection mode, a request from a client in France reaches the backend pool.
        fr: |-
          Tant que wafp-claims est en mode Détection, une requête d'un client situé en France atteint le pool principal.
    - id: s3
      text:
        en: |-
          After wafp-claims is switched to Prevention mode, a request from a client in France that is not in 203.0.113.0/24 is blocked without being evaluated by the managed rules.
        fr: |-
          Une fois wafp-claims passée en mode Prévention, une requête d'un client situé en France qui n'appartient pas à 203.0.113.0/24 est bloquée sans être évaluée par les règles managées.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      Custom rules are evaluated before the managed rule set, in ascending priority order. When AllowPartners matches, the request is sent to the backend pool and no other custom or managed rule is evaluated, so attacks from the partner range are not inspected. In Detection mode, a triggered custom rule is only logged, so the request from France passes. In Prevention mode, BlockGeo blocks the request and stops further evaluation.
    fr: |-
      Les règles personnalisées sont évaluées avant l'ensemble de règles managé, par ordre de priorité croissant. Quand AllowPartners correspond, la requête est envoyée au pool principal et aucune autre règle personnalisée ou managée n'est évaluée : les attaques provenant de la plage des partenaires ne sont donc pas inspectées. En mode Détection, une règle personnalisée déclenchée est seulement journalisée : la requête venant de France passe. En mode Prévention, BlockGeo bloque la requête et arrête l'évaluation.
  options:
    s1:
      en: |-
        The Allow action of AllowPartners (priority 10) skips all the remaining rules, including the managed rule set.
      fr: |-
        L'action Allow de AllowPartners (priorité 10) ignore toutes les règles restantes, y compris l'ensemble de règles managé.
references:
  - title: Azure Web Application Firewall (WAF) v2 Custom Rules on Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/custom-waf-rules-overview
