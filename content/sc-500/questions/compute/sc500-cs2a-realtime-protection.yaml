id: sc500-cs2a-realtime-protection
objective: "3.1.3"
type: yesno_statements
caseStudy: sc500-cs2a-nod-publishers
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for ManuscriptCheck tool invocations.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative aux appels d'outils de ManuscriptCheck.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          With the current real-time protection configuration, a ManuscriptCheck tool invocation that sends email to an unsafe domain is stopped before it executes.
        fr: |
          Avec la configuration actuelle de la protection en temps réel, un appel d'outil de ManuscriptCheck qui envoie un e-mail vers un domaine non sûr est arrêté avant son exécution.
    - id: s2
      text:
        en: |
          You can meet the requirement by creating a custom real-time protection rule that is scoped to ManuscriptCheck and has blocking enabled.
        fr: |
          Vous pouvez respecter l'exigence en créant une règle de protection en temps réel personnalisée, limitée à ManuscriptCheck et dont le blocage est activé.
    - id: s3
      text:
        en: |
          After a blocking rule covers ManuscriptCheck, Defender continues to generate near-real-time alerts for ManuscriptCheck.
        fr: |
          Une fois qu'une règle de blocage couvre ManuscriptCheck, Defender continue de générer des alertes en quasi temps réel pour ManuscriptCheck.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The built-in Default rule only audits agents, so the matching activity is recorded as a behavior but the tool call still runs. A custom rule created in Settings > Security for AI > Policies & rules > Real-time protection, scoped to the agent and with blocking enabled, stops matching actions before they execute; the unsafe email domain scenario is evaluated at the tool request step. Near-real-time alerts are generated only in audit mode, so they stop for an agent covered by a blocking rule; the events are still recorded in the BehaviorInfo table.
    fr: |
      La règle intégrée Default se contente d'auditer les agents : l'activité correspondante est enregistrée comme comportement, mais l'appel d'outil s'exécute quand même. Une règle personnalisée créée dans Settings > Security for AI > Policies & rules > Real-time protection, limitée à l'agent et dont le blocage est activé, arrête les actions correspondantes avant leur exécution ; le scénario de domaine de messagerie non sûr est évalué à l'étape de la demande d'outil. Les alertes en quasi temps réel ne sont générées qu'en mode audit : elles cessent pour un agent couvert par une règle de blocage, mais les événements restent enregistrés dans la table BehaviorInfo.
references:
  - title: Real-time protection for Microsoft Copilot Studio agents
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/real-time-agent-protection-during-runtime
