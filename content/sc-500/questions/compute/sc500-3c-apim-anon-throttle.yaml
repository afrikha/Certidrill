id: sc500-3c-apim-anon-throttle
objective: "3.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso publishes a public API named **Weather** through an Azure API Management instance named **apim-contoso** in the Standard v2 tier. Weather does not require a subscription, so callers send no subscription key.

    You need to meet the following requirements:

    - Each caller IP address must be limited to 60 calls per 60 seconds.
    - Calls from the address range 198.51.100.0 to 198.51.100.255, which belongs to a known scraper, must be rejected. All other addresses must stay allowed.

    Which two policy configurations should you add to the inbound section of Weather? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso publie une API publique nommée **Weather** via une instance Azure API Management nommée **apim-contoso** du niveau Standard v2. Weather ne requiert pas d'abonnement : les appelants n'envoient aucune clé d'abonnement.

    Vous devez répondre aux exigences suivantes :

    - Chaque adresse IP appelante doit être limitée à 60 appels par période de 60 secondes.
    - Les appels provenant de la plage d'adresses 198.51.100.0 à 198.51.100.255, qui appartient à un collecteur de données connu, doivent être rejetés. Toutes les autres adresses doivent rester autorisées.

    Quelles sont les deux configurations de stratégie à ajouter à la section inbound de Weather ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: '<rate-limit calls="60" renewal-period="60" />' }
    - { id: b, text: '<rate-limit-by-key calls="60" renewal-period="60" counter-key="@(context.Request.IpAddress)" />' }
    - { id: c, text: '<ip-filter action="allow"><address-range from="198.51.100.0" to="198.51.100.255" /></ip-filter>' }
    - { id: d, text: '<ip-filter action="forbid"><address-range from="198.51.100.0" to="198.51.100.255" /></ip-filter>' }
    - { id: e, text: '<quota calls="60" renewal-period="60" />' }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: "`rate-limit-by-key` keeps one counter per key value, so a counter key of `@(context.Request.IpAddress)` limits each caller IP address separately, without a subscription. `ip-filter` with `action=\"forbid\"` blocks the listed range and allows every address that does not match it."
    fr: "`rate-limit-by-key` tient un compteur par valeur de clé : une clé de compteur `@(context.Request.IpAddress)` limite séparément chaque adresse IP appelante, sans abonnement. `ip-filter` avec `action=\"forbid\"` bloque la plage listée et autorise toutes les adresses qui n'y correspondent pas."
  options:
    a:
      en: "`rate-limit` counts calls per subscription, and Weather callers have no subscription."
      fr: "`rate-limit` compte les appels par abonnement, et les appelants de Weather n'ont pas d'abonnement."
    c:
      en: "With `action=\"allow\"`, only the listed range would be accepted and every other caller would be denied."
      fr: "Avec `action=\"allow\"`, seule la plage listée serait acceptée et tous les autres appelants seraient refusés."
    e:
      en: "`quota` also works per subscription, and it enforces a call volume quota rather than a per-IP rate."
      fr: "`quota` fonctionne lui aussi par abonnement, et il impose un quota de volume d'appels plutôt qu'un débit par adresse IP."
references:
  - title: Limit call rate by key
    url: https://learn.microsoft.com/en-us/azure/api-management/rate-limit-by-key-policy
  - title: Restrict caller IPs
    url: https://learn.microsoft.com/en-us/azure/api-management/ip-filter-policy
