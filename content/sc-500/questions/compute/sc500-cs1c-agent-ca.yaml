id: sc500-cs1c-agent-ca
objective: "3.1.4"
type: single
caseStudy: sc500-cs1c-adatum-legal
difficulty: 2
status: draft
stem:
  en: |-
    You need to create a Conditional Access policy that requires a compliant device to meet the agent access requirement. The policy targets SharePoint Online. What should you select as the subject of the policy?
  fr: |-
    Vous devez créer une stratégie d'accès conditionnel qui exige un appareil conforme pour satisfaire l'exigence relative à l'accès des agents. La stratégie cible SharePoint Online. Que devez-vous sélectionner comme sujet de la stratégie ?
body:
  options:
    - { id: a, text: { en: "The agent identity of Intake Assistant", fr: "L'identité d'agent de Intake Assistant" } }
    - { id: b, text: { en: "The agent identity blueprint from which Intake Assistant was created", fr: "Le blueprint d'identité d'agent à partir duquel Intake Assistant a été créé" } }
    - { id: c, text: { en: "The lawyers who use Intake Assistant", fr: "Les avocats qui utilisent Intake Assistant" } }
    - { id: d, text: { en: "An agent user account created for Intake Assistant", fr: "Un compte d'utilisateur d'agent créé pour Intake Assistant" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Intake Assistant uses delegated access, so the signed-in lawyer is the subject of the access token and Conditional Access evaluates the policies assigned to that user. A policy that targets the lawyers and requires a compliant device therefore applies to the requests that Intake Assistant makes on their behalf.
    fr: |-
      Intake Assistant utilise un accès délégué : l'avocat connecté est le sujet du jeton d'accès et l'accès conditionnel évalue les stratégies attribuées à cet utilisateur. Une stratégie qui cible les avocats et exige un appareil conforme s'applique donc aux requêtes qu'Intake Assistant effectue en leur nom.
  options:
    a:
      en: |-
        A policy that targets an agent identity covers application-only access with that identity, not the requests the agent makes on behalf of a user.
      fr: |-
        Une stratégie qui cible une identité d'agent couvre l'accès application uniquement avec cette identité, pas les requêtes que l'agent effectue pour le compte d'un utilisateur.
    b:
      en: |-
        A blueprint policy covers the agent identities created from the blueprint when they use their own identity; it does not cover delegated access.
      fr: |-
        Une stratégie qui cible un blueprint couvre les identités d'agent créées à partir de celui-ci quand elles utilisent leur propre identité ; elle ne couvre pas l'accès délégué.
    d:
      en: |-
        A policy on an agent user account applies only when the token is issued to that agent user account, which is not the access pattern of Intake Assistant.
      fr: |-
        Une stratégie sur un compte d'utilisateur d'agent ne s'applique que lorsque le jeton est émis pour ce compte, ce qui n'est pas le mode d'accès d'Intake Assistant.
references:
  - title: Conditional Access for agents
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
