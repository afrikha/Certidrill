id: sc500-3b-jit-behavior
objective: "3.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure subscription named **Sub1** with Defender for Servers Plan 2 enabled. Sub1 contains the following Resource Manager virtual machines.

    | VM | Network protection |
    | --- | --- |
    | VM1 | NSG1 on the network interface, with a custom inbound rule (priority 100) that allows TCP 3389 from Any |
    | VM2 | Azure Firewall in the same virtual network, managed by Azure Firewall Manager with a firewall policy |
    | VM3 | NSG3 on the subnet, with no custom rule for TCP 22 |

    You plan to enable just-in-time VM access on the VMs by using the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un abonnement Azure nommé **Sub1** sur lequel Defender for Servers Plan 2 est activé. Sub1 contient les machines virtuelles Resource Manager suivantes.

    | Machine virtuelle | Protection réseau |
    | --- | --- |
    | VM1 | NSG1 sur l'interface réseau, avec une règle entrante personnalisée (priorité 100) qui autorise TCP 3389 depuis Any |
    | VM2 | Pare-feu Azure dans le même réseau virtuel, géré par Azure Firewall Manager avec une stratégie de pare-feu |
    | VM3 | NSG3 sur le sous-réseau, sans règle personnalisée pour TCP 22 |

    Vous prévoyez d'activer l'accès juste-à-temps aux machines virtuelles avec les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After you enable JIT on VM1, RDP connections from the internet to VM1 are still allowed without a JIT request.
        fr: Après l'activation de JIT sur VM1, les connexions RDP depuis Internet vers VM1 restent autorisées sans demande JIT.
    - id: s2
      text:
        en: You can enable JIT on VM2 without changing the way its firewall is managed.
        fr: Vous pouvez activer JIT sur VM2 sans modifier la façon dont son pare-feu est géré.
    - id: s3
      text:
        en: When an approved JIT request on VM3 expires, the SSH sessions opened during the request are disconnected.
        fr: Quand une demande JIT approuvée sur VM3 expire, les sessions SSH ouvertes pendant la demande sont déconnectées.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      When rules already exist for the selected ports, those existing rules take priority over the deny-all-inbound rules that JIT adds, so the priority 100 allow rule on VM1 keeps RDP open until you remove it. JIT doesn't support VMs protected by an Azure Firewall controlled by Azure Firewall Manager; the firewall must use classic rules, not a firewall policy. When the approved period expires, Defender for Cloud restores the NSG to its previous state, but established connections aren't interrupted.
    fr: |
      Quand des règles existent déjà pour les ports sélectionnés, ces règles existantes sont prioritaires sur les règles de refus de tout trafic entrant ajoutées par JIT : la règle d'autorisation de priorité 100 de VM1 laisse RDP ouvert tant que vous ne la supprimez pas. JIT ne prend pas en charge les machines virtuelles protégées par un Pare-feu Azure contrôlé par Azure Firewall Manager ; le pare-feu doit utiliser des règles classiques, pas une stratégie de pare-feu. À l'expiration de la période approuvée, Defender for Cloud rétablit l'état précédent du NSG, mais les connexions établies ne sont pas interrompues.
references:
  - title: Understand Just-in-time Virtual Machine Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview
