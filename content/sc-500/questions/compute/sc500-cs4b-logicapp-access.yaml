id: sc500-cs4b-logicapp-access
objective: "3.3.6"
type: dropdown
caseStudy: sc500-cs4b-blue-yonder-airlines
difficulty: 3
status: draft
stem:
  en: |
    An authorization policy for Microsoft Entra ID tokens is already configured on la-claims. You need to complete the workflow definition of la-claims to meet the remaining part of the requirement for la-claims.

    How should you complete the definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une stratégie d'autorisation pour les jetons Microsoft Entra ID est déjà configurée sur la-claims. Vous devez compléter la définition du workflow de la-claims pour respecter le reste de l'exigence concernant la-claims.

    Comment devez-vous compléter la définition ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "properties": {
      "accessControl": {
        "triggers": {
          "[[policy]]": {
            "state": "Disabled"
          }
        }
      },
      "definition": {
        "actions": {
          "Get_passenger": {
            "type": "Http",
            "runtimeConfiguration": {
              "secureData": {
                "properties": [ [[secure]] ]
              }
            }
          }
        }
      }
    }
  slots:
    - id: policy
      options:
        - { id: sas, text: sasAuthenticationPolicy }
        - { id: oauth, text: openAuthenticationPolicies }
        - { id: ip, text: allowedCallerIpAddresses }
    - id: secure
      options:
        - { id: inputs, text: "\"inputs\"" }
        - { id: outputs, text: "\"outputs\"" }
        - { id: both, text: "\"inputs\", \"outputs\"" }
answer:
  values: { policy: sas, secure: outputs }
explanation:
  correct:
    en: |
      A Request trigger accepts either a SAS or an OAuth 2.0 token from Microsoft Entra ID, and configuring OAuth does not disable SAS. Setting the state of sasAuthenticationPolicy to Disabled blocks the existing SAS signatures, so only Entra ID tokens work. The passenger details are the response of Get_passenger, so securing its outputs hides them in the run history; its inputs, the requests that the support engineers must still see, stay visible.
    fr: |
      Un déclencheur Request accepte soit une SAS, soit un jeton OAuth 2.0 de Microsoft Entra ID, et la configuration d'OAuth ne désactive pas la SAS. Définir l'état de sasAuthenticationPolicy sur Disabled bloque les signatures SAS existantes : seuls les jetons Entra ID fonctionnent. Les informations des passagers sont la réponse de Get_passenger : sécuriser ses sorties les masque dans l'historique des exécutions ; ses entrées, les requêtes que les ingénieurs du support doivent encore voir, restent visibles.
  options:
    oauth:
      en: |
        openAuthenticationPolicies holds the Microsoft Entra ID authorization policy that is already configured; disabling it would block the tokens instead of the SAS.
      fr: |
        openAuthenticationPolicies contient la stratégie d'autorisation Microsoft Entra ID déjà configurée ; la désactiver bloquerait les jetons au lieu de la SAS.
    ip:
      en: |
        allowedCallerIpAddresses restricts the caller IP addresses; it does not control the authorization scheme.
      fr: |
        allowedCallerIpAddresses limite les adresses IP des appelants ; il ne contrôle pas le schéma d'autorisation.
    inputs:
      en: |
        Securing only the inputs hides the requests that the support engineers must see, and not the passenger details that Get_passenger returns.
      fr: |
        Sécuriser uniquement les entrées masque les requêtes que les ingénieurs du support doivent voir, et pas les informations des passagers que renvoie Get_passenger.
    both:
      en: |
        Securing the inputs as well would hide the requests that the support engineers must still see.
      fr: |
        Sécuriser aussi les entrées masquerait les requêtes que les ingénieurs du support doivent encore voir.
references:
  - title: Secure access and data for workflows in Azure Logic Apps
    url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-securing-a-logic-app
