id: sc500-cs2a-dspm-remediation
objective: "3.1.2"
type: dragdrop
caseStudy: sc500-cs2a-nod-publishers
difficulty: 2
status: draft
stem:
  en: |
    You review the default data risk assessment in Microsoft Purview DSPM. You need to use the remediation options of the assessment to meet the requirements for the Manuscripts, Contracts, Archive2015 and Rights sites.

    Which remediation option should you use for each site? To answer, drag the appropriate options to the correct sites. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez l'évaluation des risques liés aux données par défaut dans Microsoft Purview DSPM. Vous devez utiliser les options de correction de l'évaluation pour respecter les exigences relatives aux sites Manuscripts, Contracts, Archive2015 et Rights.

    Quelle option de correction devez-vous utiliser pour chaque site ? Pour répondre, faites glisser les options appropriées vers les sites correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: label, text: { en: "Restrict access by label", fr: "Restrict access by label (restreindre l'accès par étiquette)" } }
    - { id: rcd, text: { en: "Restrict all items (Restricted Content Discovery)", fr: "Restrict all items (Restricted Content Discovery)" } }
    - { id: autolabel, text: { en: "Create an auto-labeling policy", fr: "Create an auto-labeling policy (créer une stratégie d'étiquetage automatique)" } }
    - { id: retention, text: { en: "Create retention policies", fr: "Create retention policies (créer des stratégies de rétention)" } }
    - { id: review, text: { en: "Start a SharePoint site access review", fr: "Start a SharePoint site access review (lancer une révision de l'accès au site SharePoint)" } }
    - { id: link, text: { en: "Remove sharing link", fr: "Remove sharing link (supprimer le lien de partage)" } }
  targets:
    - { id: manuscripts, text: Manuscripts }
    - { id: contracts, text: Contracts }
    - { id: archive, text: Archive2015 }
    - { id: rights, text: Rights }
answer:
  mapping: { manuscripts: label, contracts: rcd, archive: retention, rights: autolabel }
explanation:
  correct:
    en: |
      Restrict access by label creates a Microsoft Purview DLP policy that stops Microsoft 365 Copilot and agents from summarizing data that has the selected sensitivity labels. Restrict all items uses SharePoint Restricted Content Discovery to exempt a whole site from Microsoft 365 Copilot. Create retention policies uses Data Lifecycle Management to delete content not accessed for at least three years, and Create an auto-labeling policy labels unlabeled files that contain sensitive information.
    fr: |
      Restrict access by label crée une stratégie DLP Microsoft Purview qui empêche Microsoft 365 Copilot et les agents de résumer les données portant les étiquettes de confidentialité sélectionnées. Restrict all items utilise SharePoint Restricted Content Discovery pour exclure tout un site de Microsoft 365 Copilot. Create retention policies utilise la gestion du cycle de vie des données pour supprimer les contenus non consultés depuis au moins trois ans, et Create an auto-labeling policy étiquette les fichiers sans étiquette qui contiennent des informations sensibles.
  options:
    review: { en: "A site access review opens the SharePoint data access governance reports so that site owners review access; it doesn't block Copilot, label or delete anything by itself.", fr: "Une révision de l'accès au site ouvre les rapports de gouvernance de l'accès aux données SharePoint pour que les propriétaires examinent les accès ; elle ne bloque pas Copilot et n'étiquette ni ne supprime rien par elle-même." }
    link: { en: "Remove sharing link is an item-level action of a custom assessment; it doesn't stop Copilot from surfacing content that users can already access.", fr: "Remove sharing link est une action au niveau des éléments d'une évaluation personnalisée ; elle n'empêche pas Copilot de faire apparaître des contenus auxquels les utilisateurs ont déjà accès." }
references:
  - title: Prevent oversharing with data risk assessments from Data Security Posture Management
    url: https://learn.microsoft.com/en-us/purview/data-security-posture-management-oversharing
