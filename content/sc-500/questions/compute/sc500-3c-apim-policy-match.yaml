id: sc500-3c-apim-policy-match
objective: "3.3.9"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam publishes several APIs through an Azure API Management instance named **apim-fab** in the Premium tier. The security team lists the following requirements.

    Which policy should you use for each requirement? To answer, drag the appropriate policies to the correct requirements. Each policy may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam publie plusieurs API via une instance Azure API Management nommée **apim-fab** du niveau Premium. L'équipe de sécurité a défini les exigences suivantes.

    Quelle stratégie devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les stratégies appropriées vers les exigences correspondantes. Chaque stratégie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vcc, text: validate-client-certificate }
    - { id: acert, text: authentication-certificate }
    - { id: vcontent, text: validate-content }
    - { id: cors, text: cors }
    - { id: vjwt, text: validate-jwt }
    - { id: quota, text: quota }
  targets:
    - { id: t1, text: { en: "Reject callers that do not present a certificate issued by the Fabrikam certification authority.", fr: "Rejeter les appelants qui ne présentent pas de certificat émis par l'autorité de certification Fabrikam." } }
    - { id: t2, text: { en: "Present a certificate to a back end that requires mutual TLS.", fr: "Présenter un certificat à un back-end qui exige le TLS mutuel." } }
    - { id: t3, text: { en: "Reject request bodies that are larger than 128 KB or that do not match the API's JSON schema.", fr: "Rejeter les corps de requête de plus de 128 Ko ou qui ne correspondent pas au schéma JSON de l'API." } }
    - { id: t4, text: { en: "Allow a single-page application hosted on https://portal.fabrikam.com to call the API from the browser.", fr: "Permettre à une application monopage hébergée sur https://portal.fabrikam.com d'appeler l'API depuis le navigateur." } }
answer:
  mapping: { t1: vcc, t2: acert, t3: vcontent, t4: cors }
explanation:
  correct:
    en: "`validate-client-certificate` checks the certificate that a client presents to API Management. `authentication-certificate` makes API Management authenticate to the back end with a client certificate. `validate-content` validates the size or content of a body against the API schema. `cors` adds cross-origin resource sharing support so browser-based clients on another origin can call the API."
    fr: "`validate-client-certificate` vérifie le certificat qu'un client présente à API Management. `authentication-certificate` permet à API Management de s'authentifier auprès du back-end avec un certificat client. `validate-content` valide la taille ou le contenu d'un corps par rapport au schéma de l'API. `cors` ajoute la prise en charge du partage des ressources cross-origin (CORS), pour que des clients exécutés dans un navigateur sur une autre origine puissent appeler l'API."
  options:
    vjwt:
      en: "`validate-jwt` validates tokens, not certificates or request bodies."
      fr: "`validate-jwt` valide des jetons, pas des certificats ni des corps de requête."
    quota:
      en: "`quota` enforces a call volume or bandwidth quota per subscription."
      fr: "`quota` impose un quota de volume d'appels ou de bande passante par abonnement."
references:
  - title: Azure API Management policy reference
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-policies
