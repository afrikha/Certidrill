id: sc500-cs2a-ownerless-agent
objective: "3.1.11"
type: single
caseStudy: sc500-cs2a-nod-publishers
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the requirement for BlurbWriter. What should you do in the Microsoft 365 admin center?
  fr: |
    Vous devez respecter l'exigence relative à BlurbWriter. Que devez-vous faire dans le centre d'administration Microsoft 365 ?
body:
  options:
    - { id: a, text: { en: "In Agents > All agents > Registry, delete BlurbWriter", fr: "Dans Agents > All agents > Registry, supprimer BlurbWriter" } }
    - { id: b, text: { en: "In Agents > All agents, unpin BlurbWriter by using Manage pinned agents", fr: "Dans Agents > All agents, désépingler BlurbWriter avec Manage pinned agents" } }
    - { id: c, text: { en: "In Agents > All agents > Registry, block BlurbWriter", fr: "Dans Agents > All agents > Registry, bloquer BlurbWriter" } }
    - { id: d, text: { en: "In Users > Deleted users, permanently delete the account of the creator", fr: "Dans Users > Deleted users, supprimer définitivement le compte du créateur" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A shared agent becomes ownerless when its creator is deleted, and the admin can block or delete it from the registry. Blocking makes the agent unavailable while keeping it, and it can be unblocked later, so the marketing department can still review it next month.
    fr: |
      Un agent partagé devient sans propriétaire quand son créateur est supprimé, et l'administrateur peut le bloquer ou le supprimer depuis le registre. Le blocage rend l'agent indisponible tout en le conservant, et il peut être débloqué plus tard : le service marketing peut donc encore l'examiner le mois prochain.
  options:
    a: { en: "Deleting the agent makes it unavailable but doesn't keep it for the review next month.", fr: "La suppression rend l'agent indisponible, mais ne le conserve pas pour l'examen du mois prochain." }
    b: { en: "Unpinning only removes the agent from the agents pinned in Microsoft Copilot; users who have it can still use it.", fr: "Le désépinglage retire seulement l'agent des agents épinglés dans Microsoft Copilot ; les utilisateurs qui en disposent peuvent toujours l'utiliser." }
    d: { en: "Hard deleting the creator only updates the count of agents without owners; it doesn't make BlurbWriter unavailable.", fr: "La suppression définitive du créateur met seulement à jour le nombre d'agents sans propriétaire ; elle ne rend pas BlurbWriter indisponible." }
references:
  - title: Manage agent registry in Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-registry
