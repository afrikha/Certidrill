id: sc500-cs2c-trusted-launch
objective: "3.2.8"
type: single
caseStudy: sc500-cs2c-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You plan to change the security type of vm-booking01 from the Configuration page of the VM. What should you do first?
  fr: |
    Vous prévoyez de modifier le type de sécurité de vm-booking01 depuis la page Configuration de la machine virtuelle. Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Stop protection of vm-booking01 in Azure Backup and delete its backup data", fr: "Arrêter la protection de vm-booking01 dans la Sauvegarde Azure et supprimer ses données de sauvegarde" } }
    - { id: b, text: { en: "Enable Azure Site Recovery replication of vm-booking01 to a second region", fr: "Activer la réplication Azure Site Recovery de vm-booking01 vers une deuxième région" } }
    - { id: c, text: { en: "Upgrade vm-booking01 from generation 1 to generation 2", fr: "Mettre à niveau vm-booking01 de la génération 1 vers la génération 2" } }
    - { id: d, text: { en: "Protect vm-booking01 with an Enhanced backup policy instead of the Standard policy", fr: "Protéger vm-booking01 avec une stratégie de sauvegarde Enhanced au lieu de la stratégie Standard" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Trusted launch security type can't be enabled on a VM whose Azure Backup protection uses a Standard policy; the VM must be protected with an Enhanced policy. After that, you stop the VM, select Trusted launch in the Security type list of the Configuration page, select Secure Boot and vTPM, save, and start the VM.
    fr: |
      Le type de sécurité Lancement fiable ne peut pas être activé sur une machine virtuelle dont la protection par la Sauvegarde Azure utilise une stratégie Standard ; la machine virtuelle doit être protégée avec une stratégie Enhanced. Vous arrêtez ensuite la machine virtuelle, sélectionnez Trusted launch dans la liste Security type de la page Configuration, cochez Secure Boot et vTPM, enregistrez et démarrez la machine virtuelle.
  options:
    a: { en: "Deleting the backup data isn't needed, and vm-booking01 must remain protected by Azure Backup.", fr: "Supprimer les données de sauvegarde n'est pas nécessaire, et vm-booking01 doit rester protégée par la Sauvegarde Azure." }
    b: { en: "Site Recovery isn't a prerequisite; Learn even asks to disable it before an upgrade to Trusted launch from generation 1.", fr: "Site Recovery n'est pas un prérequis ; Learn demande même de le désactiver avant une mise à niveau vers le lancement fiable depuis la génération 1." }
    c: { en: "vm-booking01 is already a generation 2 VM.", fr: "vm-booking01 est déjà une machine virtuelle de génération 2." }
references:
  - title: Enable Trusted launch on existing Azure Gen2 VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch-existing-vm
