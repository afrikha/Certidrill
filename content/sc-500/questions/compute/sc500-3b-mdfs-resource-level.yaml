id: sc500-3b-mdfs-resource-level
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an Azure subscription named **Sub1** that contains 200 Azure virtual machines. Defender for Servers isn't enabled on Sub1.

    Ten of the VMs process cardholder data and have the tag **Scope=PCI**. These ten VMs must have file integrity monitoring. The other 190 VMs must not be billed for Defender for Servers.

    You need to configure Defender for Servers.

    What should you do?
  fr: |
    Northwind Traders dispose d'un abonnement Azure nommé **Sub1** qui contient 200 machines virtuelles Azure. Defender for Servers n'est pas activé sur Sub1.

    Dix des machines virtuelles traitent des données de titulaires de carte et portent l'étiquette **Scope=PCI**. Ces dix machines virtuelles doivent bénéficier de la surveillance de l'intégrité des fichiers. Les 190 autres machines virtuelles ne doivent pas être facturées pour Defender for Servers.

    Vous devez configurer Defender for Servers.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Plan 2 at resource level on the ten tagged VMs by assigning a Security Center – Granular Pricing policy", fr: "Activer le Plan 2 au niveau de la ressource sur les dix machines virtuelles étiquetées en attribuant une stratégie Security Center – Granular Pricing" } }
    - { id: b, text: { en: "Enable Plan 1 on Sub1, and then turn on file integrity monitoring in the plan settings", fr: "Activer le Plan 1 sur Sub1, puis activer la surveillance de l'intégrité des fichiers dans les paramètres du plan" } }
    - { id: c, text: { en: "Enable Plan 2 on Sub1, and then disable Defender for Servers at resource level on the 190 other VMs", fr: "Activer le Plan 2 sur Sub1, puis désactiver Defender for Servers au niveau de la ressource sur les 190 autres machines virtuelles" } }
    - { id: d, text: { en: "Enable Defender CSPM on Sub1, and then turn on file integrity monitoring for the ten tagged VMs", fr: "Activer Defender CSPM sur Sub1, puis activer la surveillance de l'intégrité des fichiers pour les dix machines virtuelles étiquetées" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      File integrity monitoring is a Plan 2 feature. At resource level you can enable only Plan 1, but you can disable both Plan 1 and Plan 2, so you enable Plan 2 on the subscription and disable it on the 190 other VMs (by REST API, script or the tag-based Granular Pricing policy that disables the plan). FIM is then turned on in the plan settings, where it is off by default.
    fr: |
      La surveillance de l'intégrité des fichiers est une fonctionnalité du Plan 2. Au niveau de la ressource, vous ne pouvez activer que le Plan 1, mais vous pouvez désactiver le Plan 1 comme le Plan 2 : vous activez donc le Plan 2 sur l'abonnement et vous le désactivez sur les 190 autres machines virtuelles (par l'API REST, un script ou la stratégie Granular Pricing basée sur une étiquette qui désactive le plan). La surveillance de l'intégrité des fichiers s'active ensuite dans les paramètres du plan, où elle est désactivée par défaut.
  options:
    a: { en: "Resource-level enablement supports Plan 1 only; the Granular Pricing policy enables Defender for Servers with the P1 subplan.", fr: "L'activation au niveau de la ressource ne prend en charge que le Plan 1 ; la stratégie Granular Pricing active Defender for Servers avec le sous-plan P1." }
    b: { en: "File integrity monitoring isn't available in Plan 1, and Plan 1 on Sub1 would bill all 200 VMs.", fr: "La surveillance de l'intégrité des fichiers n'est pas disponible dans le Plan 1, et le Plan 1 sur Sub1 facturerait les 200 machines virtuelles." }
    d: { en: "Defender CSPM doesn't include file integrity monitoring, which is part of Defender for Servers Plan 2.", fr: "Defender CSPM n'inclut pas la surveillance de l'intégrité des fichiers, qui fait partie de Defender for Servers Plan 2." }
references:
