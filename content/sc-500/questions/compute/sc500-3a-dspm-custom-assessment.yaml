id: sc500-3a-dspm-custom-assessment
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Purview DSPM for AI to find data that Microsoft 365 Copilot could expose. The tenant has about 4,000 SharePoint sites. A rarely used site named **Mergers2026** contains files labeled Highly Confidential and is shared with a large group.

    Mergers2026 does not appear in the results of the default data risk assessment.

    You need DSPM for AI to assess the oversharing risk of Mergers2026.

    What should you do?
  fr: |
    Fabrikam, Inc. utilise Microsoft Purview DSPM for AI pour trouver les données que Microsoft 365 Copilot pourrait exposer. Le locataire compte environ 4 000 sites SharePoint. Un site peu utilisé nommé **Mergers2026** contient des fichiers étiquetés Highly Confidential et est partagé avec un grand groupe.

    Mergers2026 n'apparaît pas dans les résultats de l'évaluation des risques liés aux données par défaut.

    Vous devez faire en sorte que DSPM for AI évalue le risque de surpartage de Mergers2026.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Wait for the next weekly run of the default data risk assessment.", fr: "Attendre la prochaine exécution hebdomadaire de l'évaluation des risques par défaut." } }
    - { id: b, text: { en: "Create a custom data risk assessment that includes Mergers2026.", fr: "Créer une évaluation des risques liés aux données personnalisée qui inclut Mergers2026." } }
    - { id: c, text: { en: "Enable restricted content discovery on Mergers2026.", fr: "Activer la découverte de contenu restreinte sur Mergers2026." } }
    - { id: d, text: { en: "Activate the one-click policy DSPM for AI - Detect risky AI usage.", fr: "Activer la stratégie en un clic DSPM for AI - Detect risky AI usage." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The default data risk assessment runs weekly on the top 100 SharePoint sites by usage, so a rarely used site is not included however sensitive it is. A custom data risk assessment lets you scan specific sites or a broader set of users, and its results show the sensitive data and sharing links of the site.
    fr: |
      L'évaluation des risques liés aux données par défaut s'exécute chaque semaine sur les 100 premiers sites SharePoint par utilisation : un site peu utilisé n'y figure donc pas, quelle que soit sa sensibilité. Une évaluation personnalisée permet d'analyser des sites précis ou un ensemble plus large d'utilisateurs, et ses résultats montrent les données sensibles et les liens de partage du site.
  options:
    a:
      en: |
        The next weekly run again covers the top 100 sites by usage, which still excludes a rarely used site.
      fr: |
        La prochaine exécution hebdomadaire couvre de nouveau les 100 premiers sites par utilisation, ce qui exclut toujours un site peu utilisé.
    c:
      en: |
        Restricted content discovery is a remediation that hides the site from Copilot; it does not assess the site's oversharing.
      fr: |
        La découverte de contenu restreinte est une correction qui masque le site à Copilot ; elle n'évalue pas le surpartage du site.
    d:
      en: |
        Detect risky AI usage calculates user risk from prompts and responses; it does not scan SharePoint sites for oversharing.
      fr: |
        Detect risky AI usage calcule le risque utilisateur à partir des prompts et réponses ; elle n'analyse pas le surpartage des sites SharePoint.
references:
  - title: Assess SharePoint overexposure
    url: https://learn.microsoft.com/en-us/training/modules/identify-ai-data-risks-purview/3-assess-sharepoint-overexposure
