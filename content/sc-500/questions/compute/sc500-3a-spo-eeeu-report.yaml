id: sc500-3a-spo-eeeu-report
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has SharePoint Advanced Management and is preparing a Microsoft 365 Copilot rollout. You are a SharePoint administrator.

    You need to identify the SharePoint sites where users shared content with all internal users by using the Everyone except external users group during the last four weeks.

    Which data access governance report should you run in the SharePoint admin center?
  fr: |
    Contoso, Ltd. dispose de SharePoint Advanced Management et prépare un déploiement de Microsoft 365 Copilot. Vous êtes administrateur SharePoint.

    Vous devez identifier les sites SharePoint dans lesquels des utilisateurs ont partagé du contenu avec tous les utilisateurs internes à l'aide du groupe Tout le monde sauf les utilisateurs externes (Everyone except external users) au cours des quatre dernières semaines.

    Quel rapport de gouvernance de l'accès aux données devez-vous exécuter dans le Centre d'administration SharePoint ?
body:
  options:
    - { id: a, text: "Sharing links" }
    - { id: b, text: "Site permissions for users" }
    - { id: c, text: "Shared with 'Everyone except external users'" }
    - { id: d, text: "Sensitivity label for files" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Shared with 'Everyone except external users' activity report lists the sites where content was shared with all internal users in the past 28 days. Activity reports track recent oversharing, while snapshot reports such as site permissions show the state on the day they are generated.
    fr: |
      Le rapport d'activité Shared with 'Everyone except external users' liste les sites où du contenu a été partagé avec tous les utilisateurs internes au cours des 28 derniers jours. Les rapports d'activité suivent le surpartage récent, alors que les rapports d'instantané comme les autorisations de site montrent l'état au jour de leur génération.
  options:
    a:
      en: |
        The Sharing links report shows the sites where users recently created the most Anyone, People in the organization and Specific people links, not sharing with the EEEU group.
      fr: |
        Le rapport Sharing links montre les sites où les utilisateurs ont récemment créé le plus de liens Anyone, People in the organization et Specific people, pas le partage avec le groupe EEEU.
    b:
      en: |
        Site permissions for users lists every site that one specified user can access; it does not track recent sharing activity.
      fr: |
        Site permissions for users liste tous les sites auxquels un utilisateur donné peut accéder ; il ne suit pas l'activité de partage récente.
    d:
      en: |
        Sensitivity label for files shows the sites that contain files with specific sensitivity labels; it does not report sharing.
      fr: |
        Sensitivity label for files montre les sites qui contiennent des fichiers portant certaines étiquettes de confidentialité ; il ne rend pas compte du partage.
references:
  - title: Data access governance reports for SharePoint and OneDrive sites
    url: https://learn.microsoft.com/en-us/sharepoint/data-access-governance-reports
