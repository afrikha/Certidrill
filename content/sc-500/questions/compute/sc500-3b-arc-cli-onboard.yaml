id: sc500-3b-arc-cli-onboard
objective: "3.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to connect 150 Linux servers hosted by another cloud provider to Azure Arc in the resource group **RG-Arc**. The Azure Connected Machine agent is already installed on each server.

    You need to create a service principal for unattended onboarding and connect each server. The service principal must have only the permissions required to onboard machines in RG-Arc.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de connecter à Azure Arc, dans le groupe de ressources **RG-Arc**, 150 serveurs Linux hébergés par un autre fournisseur de cloud. L'agent Azure Connected Machine est déjà installé sur chaque serveur.

    Vous devez créer un principal de service pour une intégration sans intervention et connecter chaque serveur. Le principal de service doit disposer uniquement des autorisations nécessaires pour intégrer des machines dans RG-Arc.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    # From an administration workstation
    az ad sp create-for-rbac --name sp-arc-onboarding \
      --role [[role]] \
      --scopes /subscriptions/<subscription ID>/resourceGroups/RG-Arc

    # On each server
    sudo [[cmd]] --service-principal-id "<app ID>" --service-principal-secret "<secret>" \
      --tenant-id "<tenant ID>" --subscription-id "<subscription ID>" \
      --resource-group RG-Arc --location westeurope
  slots:
    - id: role
      options:
        - { id: onboard, text: "\"Azure Connected Machine Onboarding\"" }
        - { id: contrib, text: "\"Contributor\"" }
        - { id: reader, text: "\"Reader\"" }
    - id: cmd
      options:
        - { id: check, text: azcmagent check }
        - { id: connect, text: azcmagent connect }
        - { id: show, text: azcmagent show }
answer:
  values: { role: onboard, cmd: connect }
explanation:
  correct:
    en: |
      The service principal needs the Azure Connected Machine Onboarding role, scoped to the resource group, which is the least-privilege role for onboarding. On each server, `azcmagent connect` with the service principal ID and secret, tenant ID, subscription ID, resource group and location registers the machine as an Azure Arc-enabled server.
    fr: |
      Le principal de service a besoin du rôle Azure Connected Machine Onboarding, limité au groupe de ressources : c'est le rôle du moindre privilège pour l'intégration. Sur chaque serveur, `azcmagent connect` avec l'ID et le secret du principal de service, l'ID de locataire, l'ID d'abonnement, le groupe de ressources et l'emplacement inscrit la machine comme serveur avec Azure Arc.
  options:
    contrib: { en: "Contributor can onboard machines but grants far more than onboarding permissions.", fr: "Contributor peut intégrer des machines, mais accorde bien plus que les autorisations d'intégration." }
    reader: { en: "Reader can't create Azure Arc-enabled server resources.", fr: "Reader ne peut pas créer de ressources de serveurs avec Azure Arc." }
    check: { en: "azcmagent check tests network connectivity to the required endpoints; it doesn't connect the machine.", fr: "azcmagent check teste la connectivité réseau vers les points de terminaison requis ; il ne connecte pas la machine." }
    show: { en: "azcmagent show displays the agent status and metadata; it doesn't connect the machine.", fr: "azcmagent show affiche l'état et les métadonnées de l'agent ; il ne connecte pas la machine." }
references:
  - title: Connect hybrid machines to Azure at scale
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/onboard-service-principal
