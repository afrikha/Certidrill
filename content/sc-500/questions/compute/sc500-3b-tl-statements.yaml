id: sc500-3b-tl-statements
objective: "3.2.8"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso has the following Azure virtual machines.

    | VM | Generation | Size | Security type | Notes |
    | --- | --- | --- | --- | --- |
    | VM1 | 2 | Standard_D4s_v5 | Trusted launch | Secure boot disabled, vTPM enabled, Guest Attestation extension installed |
    | VM2 | 2 | Standard_D4s_v5 | Trusted launch | Secure boot and vTPM enabled |
    | VM3 | 2 | Standard_D2s_v5 | Standard | Created from a managed image |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose des machines virtuelles Azure suivantes.

    | Machine virtuelle | Génération | Taille | Type de sécurité | Remarques |
    | --- | --- | --- | --- | --- |
    | VM1 | 2 | Standard_D4s_v5 | Lancement fiable | Démarrage sécurisé désactivé, vTPM activé, extension Guest Attestation installée |
    | VM2 | 2 | Standard_D4s_v5 | Lancement fiable | Démarrage sécurisé et vTPM activés |
    | VM3 | 2 | Standard_D2s_v5 | Standard | Créée à partir d'une image managée |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Boot integrity attestation of VM1 by Defender for Cloud succeeds.
        fr: L'attestation de l'intégrité du démarrage de VM1 par Defender for Cloud réussit.
    - id: s2
      text:
        en: You can resize VM2 to a size of the Dv3 series.
        fr: Vous pouvez redimensionner VM2 vers une taille de la série Dv3.
    - id: s3
      text:
        en: To get new VMs like VM3 with Trusted launch, you should publish the image in an Azure Compute Gallery instead of using a managed image.
        fr: Pour obtenir de nouvelles machines virtuelles comme VM3 avec le lancement fiable, vous devez publier l'image dans une galerie Azure Compute Gallery au lieu d'utiliser une image managée.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Attestation fails when secure boot is disabled, so VM1 can't pass boot integrity attestation even with the extension installed. The Dv3 series doesn't support Trusted launch, and a Trusted launch VM can't be resized to a size family that doesn't support it. Managed images aren't supported with Trusted launch; Microsoft recommends Azure Compute Gallery instead.
    fr: |
      L'attestation échoue quand le démarrage sécurisé est désactivé : VM1 ne peut pas réussir l'attestation de l'intégrité du démarrage, même avec l'extension installée. La série Dv3 ne prend pas en charge le lancement fiable, et une machine virtuelle à lancement fiable ne peut pas être redimensionnée vers une famille de tailles qui ne le prend pas en charge. Les images managées ne sont pas prises en charge avec le lancement fiable ; Microsoft recommande Azure Compute Gallery à la place.
references:
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
