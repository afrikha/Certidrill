id: sc500-3b-jit-request-role
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses just-in-time (JIT) VM access in Microsoft Defender for Cloud for the virtual machines in a subscription named **Sub1**. JIT policies are already configured by the security team.

    You create a custom Azure role for the help desk operators. The operators must be able to request JIT access to the VMs, but they must not be able to create or modify JIT policies. The role already contains the read actions on JIT policies, VMs, network interfaces and public IP addresses.

    Which action should you add to the role?
  fr: |
    Fabrikam utilise l'accès juste-à-temps (JIT) aux machines virtuelles de Microsoft Defender for Cloud pour les machines virtuelles d'un abonnement nommé **Sub1**. Les stratégies JIT sont déjà configurées par l'équipe de sécurité.

    Vous créez un rôle Azure personnalisé pour les opérateurs du support technique. Les opérateurs doivent pouvoir demander un accès JIT aux machines virtuelles, mais ne doivent pas pouvoir créer ni modifier de stratégies JIT. Le rôle contient déjà les actions de lecture sur les stratégies JIT, les machines virtuelles, les interfaces réseau et les adresses IP publiques.

    Quelle action devez-vous ajouter au rôle ?
body:
  options:
    - { id: a, text: "Microsoft.Security/locations/jitNetworkAccessPolicies/write" }
    - { id: b, text: "Microsoft.Compute/virtualMachines/write" }
    - { id: c, text: "Microsoft.Network/networkSecurityGroups/securityRules/write" }
    - { id: d, text: "Microsoft.Security/locations/jitNetworkAccessPolicies/initiate/action" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Requesting JIT access requires the `initiate/action` operation on JIT network access policies, together with read access to the policies, the VMs, their network interfaces and their public IP addresses. Defender for Cloud then creates the temporary allow rule itself, so the requester doesn't need write access to the NSG.
    fr: |
      La demande d'accès JIT exige l'opération `initiate/action` sur les stratégies d'accès réseau JIT, avec l'accès en lecture aux stratégies, aux machines virtuelles, à leurs interfaces réseau et à leurs adresses IP publiques. Defender for Cloud crée ensuite lui-même la règle d'autorisation temporaire : le demandeur n'a pas besoin d'un accès en écriture au NSG.
  options:
    a: { en: "The write action on JIT policies is required to configure or edit a JIT policy, which the operators must not do.", fr: "L'action d'écriture sur les stratégies JIT est requise pour configurer ou modifier une stratégie JIT, ce que les opérateurs ne doivent pas faire." }
    b: { en: "Write on the VM is part of the permissions to configure a JIT policy, not to request access.", fr: "L'écriture sur la machine virtuelle fait partie des autorisations pour configurer une stratégie JIT, pas pour demander l'accès." }
    c: { en: "Writing NSG rules would let operators open ports permanently and bypass JIT; Defender for Cloud manages the rules.", fr: "L'écriture de règles NSG permettrait aux opérateurs d'ouvrir des ports de façon permanente et de contourner JIT ; c'est Defender for Cloud qui gère les règles." }
references:
  - title: Enable just-in-time access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
