id: sc500-cs1b-apim-orders
objective: "3.3.9"
type: single
caseStudy: sc500-cs1b-proseware
difficulty: 3
status: draft
stem:
  en: |-
    You need to configure the inbound policy of the Orders API in apim-pw-partners to meet the Orders API requirement. Which policy configuration should you use?
  fr: |-
    Vous devez configurer la stratégie entrante de l'API Orders dans apim-pw-partners pour satisfaire l'exigence relative à l'API Orders. Quelle configuration de stratégie devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "validate-azure-ad-token that lists the approved client application IDs, followed by rate-limit with calls=\"100\" and renewal-period=\"60\"", fr: "validate-azure-ad-token qui liste les ID d'application cliente approuvés, suivie de rate-limit avec calls=\"100\" et renewal-period=\"60\"" } }
    - { id: b, text: { en: "validate-azure-ad-token that lists the approved client application IDs, followed by rate-limit-by-key with calls=\"100\", renewal-period=\"60\" and a counter-key based on the client application ID in the token", fr: "validate-azure-ad-token qui liste les ID d'application cliente approuvés, suivie de rate-limit-by-key avec calls=\"100\", renewal-period=\"60\" et une counter-key basée sur l'ID d'application cliente du jeton" } }
    - { id: c, text: { en: "ip-filter that allows the current supplier IP addresses, followed by rate-limit-by-key with calls=\"100\", renewal-period=\"60\" and a counter-key based on the caller IP address", fr: "ip-filter qui autorise les adresses IP actuelles des fournisseurs, suivie de rate-limit-by-key avec calls=\"100\", renewal-period=\"60\" et une counter-key basée sur l'adresse IP de l'appelant" } }
    - { id: d, text: { en: "check-header that requires the Authorization header, followed by rate-limit-by-key with calls=\"100\", renewal-period=\"60\" and a counter-key based on the client application ID in the token", fr: "check-header qui exige l'en-tête Authorization, suivie de rate-limit-by-key avec calls=\"100\", renewal-period=\"60\" et une counter-key basée sur l'ID d'application cliente du jeton" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      validate-azure-ad-token checks that the Microsoft Entra token is valid and that it was issued to one of the listed client application IDs. rate-limit-by-key keeps one counter per key value, so a key built from the client application ID limits each supplier application to 100 calls per 60-second window; the policy is supported by the v2 gateways and returns 429 when the limit is exceeded.
    fr: |-
      validate-azure-ad-token vérifie que le jeton Microsoft Entra est valide et qu'il a été émis pour l'un des ID d'application cliente listés. rate-limit-by-key tient un compteur par valeur de clé : une clé construite à partir de l'ID d'application cliente limite donc chaque application de fournisseur à 100 appels par fenêtre de 60 secondes ; la stratégie est prise en charge par les passerelles v2 et renvoie 429 quand la limite est dépassée.
  options:
    a:
      en: |-
        rate-limit counts calls per subscription and applies only when the API is called with a subscription key; the Orders API does not require one.
      fr: |-
        rate-limit compte les appels par abonnement et ne s'applique que lorsque l'API est appelée avec une clé d'abonnement ; l'API Orders n'en exige pas.
    c:
      en: |-
        The supplier IP addresses change without notice and are shared, so neither the IP filter nor an IP-based counter identifies an approved application.
      fr: |-
        Les adresses IP des fournisseurs changent sans préavis et sont partagées : ni le filtre IP ni un compteur basé sur l'IP n'identifient une application approuvée.
    d:
      en: |-
        check-header only checks that the header exists; it does not validate the token or its client application ID.
      fr: |-
        check-header vérifie seulement la présence de l'en-tête ; il ne valide ni le jeton ni son ID d'application cliente.
references:
  - title: Validate Microsoft Entra token
    url: https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy
  - title: Limit call rate by key
    url: https://learn.microsoft.com/en-us/azure/api-management/rate-limit-by-key-policy
