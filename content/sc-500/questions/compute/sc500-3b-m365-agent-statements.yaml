id: sc500-3b-m365-agent-statements
objective: "3.1.11"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware manages its agents in the Agent Registry of the Microsoft 365 admin center. The registry contains the following agents.

    | Agent | Platform | Owner |
    | --- | --- | --- |
    | Agent1 | Agent Builder (shared) | User1 |
    | Agent2 | Copilot Studio | User2 |
    | Agent3 | Microsoft Foundry | User3 |

    You plan the following actions: assign User4 as the new owner of Agent1, delete Agent2, and block Agent3.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware gère ses agents dans le registre des agents (Agent Registry) du Centre d'administration Microsoft 365. Le registre contient les agents suivants.

    | Agent | Plateforme | Propriétaire |
    | --- | --- | --- |
    | Agent1 | Agent Builder (partagé) | User1 |
    | Agent2 | Copilot Studio | User2 |
    | Agent3 | Microsoft Foundry | User3 |

    Vous prévoyez les actions suivantes : attribuer User4 comme nouveau propriétaire d'Agent1, supprimer Agent2 et bloquer Agent3.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After User4 becomes the owner of Agent1, User1 keeps read access to Agent1.
        fr: Une fois User4 devenu propriétaire d'Agent1, User1 conserve un accès en lecture à Agent1.
    - id: s2
      text:
        en: For 30 days after the deletion, you can restore Agent2 with its previous configuration.
        fr: Pendant 30 jours après la suppression, vous pouvez restaurer Agent2 avec sa configuration précédente.
    - id: s3
      text:
        en: Blocking Agent3 affects its availability in Microsoft Copilot Chat only.
        fr: Le blocage d'Agent3 agit uniquement sur sa disponibilité dans Microsoft Copilot Chat.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      When you assign a new owner, the new owner gets full edit and delete permissions and the previous owner loses all access, including read rights. Delete is a soft delete that keeps the agent's ID, metadata, channels, ownership and connections for 30 days, during which Restore returns it to an active state with its previous configuration. Blocking a SharePoint or Foundry agent only affects its availability in Microsoft Copilot Chat, whereas blocking an Agent Builder or Copilot Studio agent also affects the other host apps.
    fr: |
      Quand vous attribuez un nouveau propriétaire, celui-ci obtient tous les droits de modification et de suppression, et l'ancien propriétaire perd tout accès, y compris en lecture. Delete est une suppression réversible qui conserve l'ID, les métadonnées, les canaux, la propriété et les connexions de l'agent pendant 30 jours, période pendant laquelle Restore le rétablit dans un état actif avec sa configuration précédente. Le blocage d'un agent SharePoint ou Foundry n'agit que sur sa disponibilité dans Microsoft Copilot Chat, alors que le blocage d'un agent Agent Builder ou Copilot Studio agit aussi sur les autres applications hôtes.
references:
  - title: Governance and Lifecycle actions for agents available in Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions
