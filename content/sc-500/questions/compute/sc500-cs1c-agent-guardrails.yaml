id: sc500-cs1c-agent-guardrails
objective: "3.1.9"
type: yesno_statements
caseStudy: sc500-cs1c-adatum-legal
difficulty: 3
status: draft
stem:
  en: |
    You plan to configure the guardrails to meet the guardrail requirement. gr-models sets the Violence control to High. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer les garde-fous pour satisfaire l'exigence relative aux garde-fous. gr-models définit le contrôle Violence sur High. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          To meet the requirement, you can add an Indirect attacks control to gr-agents on the Tool response intervention point with the Annotate action.
        fr: |-
          Pour satisfaire l'exigence, vous pouvez ajouter à gr-agents un contrôle Indirect attacks sur le point d'intervention Tool response avec l'action Annotate.
    - id: s2
      text:
        en: |-
          If gr-agents sets the Violence control to Low, the user inputs of agent-research are scanned for violence at the High level set in gr-models.
        fr: |-
          Si gr-agents définit le contrôle Violence sur Low, les entrées utilisateur de agent-research sont analysées pour la violence au niveau High défini dans gr-models.
    - id: s3
      text:
        en: |-
          If you remove the assignment of gr-agents from agent-research, the agent uses gr-models.
        fr: |-
          Si vous supprimez l'attribution de gr-agents à agent-research, l'agent utilise gr-models.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |-
      The Annotate action is available only for models; a control on an agent must use Annotate and block, which also meets the blocking requirement. The guardrail assigned to an agent fully overrides the guardrail of its model deployment, so the Low level of gr-agents applies. When no custom guardrail is assigned to an agent, the agent inherits the guardrail of its underlying model deployment, here gr-models.
    fr: |-
      L'action Annotate n'est disponible que pour les modèles ; un contrôle sur un agent doit utiliser Annotate and block, ce qui répond aussi à l'exigence de blocage. Le garde-fou attribué à un agent remplace entièrement celui de son déploiement de modèle : c'est donc le niveau Low de gr-agents qui s'applique. Quand aucun garde-fou personnalisé n'est attribué à un agent, l'agent hérite du garde-fou de son déploiement de modèle sous-jacent, ici gr-models.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
