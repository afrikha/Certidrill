id: sc500-3a-dspm-audit-prereq
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation assigned Microsoft 365 Copilot licenses to its sales team two weeks ago. Several years ago, an administrator turned off Microsoft Purview auditing in the tenant.

    In Microsoft Purview DSPM for AI, the reports and Activity explorer show no Microsoft 365 Copilot interactions for the sales team.

    You need to ensure that DSPM for AI shows the Copilot interactions of the sales team.

    What should you do first?
  fr: |
    Adatum Corporation a attribué des licences Microsoft 365 Copilot à son équipe commerciale il y a deux semaines. Il y a plusieurs années, un administrateur a désactivé l'audit Microsoft Purview dans le locataire.

    Dans Microsoft Purview DSPM for AI, les rapports et l'Explorateur d'activités n'affichent aucune interaction Microsoft 365 Copilot pour l'équipe commerciale.

    Vous devez faire en sorte que DSPM for AI affiche les interactions Copilot de l'équipe commerciale.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Onboard the devices of the sales team to Microsoft Purview.", fr: "Intégrer les appareils de l'équipe commerciale à Microsoft Purview." } }
    - { id: b, text: { en: "Deploy the Microsoft Purview browser extension to the sales team.", fr: "Déployer l'extension de navigateur Microsoft Purview pour l'équipe commerciale." } }
    - { id: c, text: { en: "Turn on Microsoft Purview auditing for the tenant.", fr: "Activer l'audit Microsoft Purview pour le locataire." } }
    - { id: d, text: { en: "Set up pay-as-you-go billing for Microsoft Purview.", fr: "Configurer la facturation à l'utilisation pour Microsoft Purview." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Monitoring Microsoft 365 Copilot and agent interactions in DSPM for AI requires Microsoft Purview auditing, which is on by default but was turned off here, and Microsoft 365 Copilot licenses for the users. AI interaction events for Microsoft 365 Copilot and Copilot Chat depend on auditing.
    fr: |
      La surveillance des interactions Microsoft 365 Copilot et des agents dans DSPM for AI exige l'audit Microsoft Purview, actif par défaut mais désactivé ici, et des licences Microsoft 365 Copilot pour les utilisateurs. Les événements AI interaction de Microsoft 365 Copilot et de Copilot Chat dépendent de l'audit.
  options:
    a:
      en: |
        Device onboarding is needed to see sensitive information shared with third-party AI websites, not Microsoft 365 Copilot interactions.
      fr: |
        L'intégration des appareils sert à voir les informations sensibles partagées avec des sites web d'IA tiers, pas les interactions Microsoft 365 Copilot.
    b:
      en: |
        The browser extension detects visits to third-party AI sites; Copilot interactions are captured through auditing.
      fr: |
        L'extension de navigateur détecte les visites de sites d'IA tiers ; les interactions Copilot sont capturées par l'audit.
    d:
      en: |
        Pay-as-you-go billing is required for AI apps other than Microsoft 365 Copilot and Microsoft Facilitator.
      fr: |
        La facturation à l'utilisation est requise pour les applications d'IA autres que Microsoft 365 Copilot et Microsoft Facilitator.
references:
  - title: Considerations for DSPM for AI to manage data security and compliance protections for AI interactions - (classic)
    url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview-considerations
