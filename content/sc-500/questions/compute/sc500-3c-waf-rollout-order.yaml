id: sc500-3c-waf-rollout-order
objective: "3.3.8"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Application Gateway WAF_v2 named **agw-hr** that publishes a new web application. Diagnostic settings already send the gateway logs to a Log Analytics workspace. No WAF policy exists yet.

    You need to protect the application with the Microsoft managed rule set. Legitimate users must not be blocked by false positives while the rules are being tuned, and attacks must be blocked once tuning is complete.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'une Application Gateway WAF_v2 nommée **agw-hr** qui publie une nouvelle application web. Des paramètres de diagnostic envoient déjà les journaux de la passerelle vers un espace de travail Log Analytics. Aucune stratégie WAF n'existe encore.

    Vous devez protéger l'application avec l'ensemble de règles managées de Microsoft. Les utilisateurs légitimes ne doivent pas être bloqués par des faux positifs pendant l'ajustement des règles, et les attaques doivent être bloquées une fois l'ajustement terminé.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a WAF policy in **Detection** mode with the managed rule set.", fr: "Créer une stratégie WAF en mode **Detection** avec l'ensemble de règles managées." } }
    - { id: assoc, text: { en: "Associate the policy with agw-hr.", fr: "Associer la stratégie à agw-hr." } }
    - { id: tune, text: { en: "Review `ApplicationGatewayFirewallLog` entries and add exclusions for false positives.", fr: "Examiner les entrées `ApplicationGatewayFirewallLog` et ajouter des exclusions pour les faux positifs." } }
    - { id: prevent, text: { en: "Switch the policy to **Prevention** mode.", fr: "Passer la stratégie en mode **Prevention**." } }
    - { id: createprev, text: { en: "Create a WAF policy in **Prevention** mode with the managed rule set.", fr: "Créer une stratégie WAF en mode **Prevention** avec l'ensemble de règles managées." } }
    - { id: v1, text: { en: "Change the gateway SKU to WAF_v1.", fr: "Changer le SKU de la passerelle en WAF_v1." } }
answer:
  sequence: [create, assoc, tune, prevent]
explanation:
  correct:
    en: "In Detection mode, the WAF logs threat alerts without blocking requests. Once the policy is associated with the gateway, you review the firewall log, fix false positives with exclusions or custom rules, and then switch to Prevention mode, where matching attacks receive a 403 response."
    fr: "En mode Detection, le WAF journalise les alertes de menace sans bloquer les requêtes. Une fois la stratégie associée à la passerelle, vous examinez le journal du pare-feu, corrigez les faux positifs avec des exclusions ou des règles personnalisées, puis passez en mode Prevention, où les attaques détectées reçoivent une réponse 403."
  options:
    createprev:
      en: "Starting in Prevention mode would block legitimate users on false positives before tuning."
      fr: "Commencer en mode Prevention bloquerait les utilisateurs légitimes sur des faux positifs avant l'ajustement."
    v1:
      en: "WAF policy associations are supported only on the WAF_v2 SKU."
      fr: "Les associations de stratégies WAF ne sont prises en charge que sur le SKU WAF_v2."
references:
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
  - title: Azure Web Application Firewall (WAF) policy overview
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/policy-overview
