id: sc500-3a-rtp-classic-agent
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. enabled external threat detection for the Power Platform environment **Prod** that contains two custom Copilot Studio agents:

    - **HelpdeskAgent** uses generative orchestration.
    - **FormsAgent** is a classic agent that uses topics and manual triggers.

    The threat detection provider receives tool invocation checks from HelpdeskAgent but never from FormsAgent.

    What is the cause?
  fr: |
    Contoso, Ltd. a activé la détection externe des menaces pour l'environnement Power Platform **Prod**, qui contient deux agents Copilot Studio personnalisés :

    - **HelpdeskAgent** utilise l'orchestration générative ;
    - **FormsAgent** est un agent classique qui utilise des rubriques et des déclencheurs manuels.

    Le fournisseur de détection des menaces reçoit des vérifications d'invocation d'outils de HelpdeskAgent, mais jamais de FormsAgent.

    Quelle en est la cause ?
body:
  options:
    - { id: a, text: { en: "External threat detection is called only for agents that use generative orchestration.", fr: "La détection externe des menaces n'est appelée que pour les agents qui utilisent l'orchestration générative." } }
    - { id: b, text: { en: "External threat detection must be enabled separately in each agent's settings.", fr: "La détection externe des menaces doit être activée séparément dans les paramètres de chaque agent." } }
    - { id: c, text: { en: "FormsAgent was published before Set error behavior was configured.", fr: "FormsAgent a été publié avant la configuration de Set error behavior." } }
    - { id: d, text: { en: "FormsAgent must have a Microsoft Entra agent identity to be evaluated.", fr: "FormsAgent doit avoir une identité d'agent Microsoft Entra pour être évalué." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Copilot Studio calls the external threat detection system each time the generative orchestrator considers invoking a tool. Classic agents are skipped, so FormsAgent is never evaluated even though the environment is configured.
    fr: |
      Copilot Studio appelle le système de détection externe des menaces chaque fois que l'orchestrateur génératif envisage d'invoquer un outil. Les agents classiques sont ignorés : FormsAgent n'est donc jamais évalué, même si l'environnement est configuré.
  options:
    b:
      en: |
        The configuration is done per environment in the Power Platform admin center, not per agent.
      fr: |
        La configuration se fait par environnement dans le Centre d'administration Power Platform, pas par agent.
    c:
      en: |
        Set error behavior only decides what happens when the provider doesn't answer in time; it does not decide which agents are checked.
      fr: |
        Set error behavior décide seulement de ce qui se passe quand le fournisseur ne répond pas à temps ; il ne détermine pas quels agents sont vérifiés.
    d:
      en: |
        The prerequisites of external threat detection are the provider endpoint, an Entra application and the environment configuration; the agents that are skipped are the classic agents.
      fr: |
        Les prérequis de la détection externe des menaces sont le point de terminaison du fournisseur, une application Entra et la configuration de l'environnement ; les agents ignorés sont les agents classiques.
references:
  - title: Enable external threat detection and protection for Copilot Studio custom agents (preview)
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/external-security-provider
