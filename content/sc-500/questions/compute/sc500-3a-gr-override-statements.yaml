id: sc500-3a-gr-override-statements
objective: "3.1.9"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a model deployment named **gpt-claims** that uses a custom guardrail named **gr-model**. gr-model sets the **Sexual** risk to **High** at the user input and output intervention points.

    Two agents built in Foundry Agent Service use gpt-claims:

    - **ClaimsIntake** has no guardrail assigned.
    - **ClaimsReview** is assigned a custom guardrail named **gr-agent**, which sets Sexual to **Low** at the user input and output intervention points and contains no tool call or tool response controls.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un déploiement de modèle nommé **gpt-claims** qui utilise un garde-fou personnalisé nommé **gr-model**. gr-model règle le risque **Sexual** sur **High** aux points d'intervention User input et Output.

    Deux agents créés dans Foundry Agent Service utilisent gpt-claims :

    - **ClaimsIntake** n'a aucun garde-fou affecté ;
    - **ClaimsReview** a un garde-fou personnalisé nommé **gr-agent**, qui règle Sexual sur **Low** aux points d'intervention User input et Output et ne contient aucun contrôle Tool call ni Tool response.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The user input of ClaimsIntake is checked for the Sexual risk at the High blocking level.
        fr: |
          L'entrée utilisateur de ClaimsIntake est vérifiée pour le risque Sexual au niveau de blocage High.
    - id: s2
      text:
        en: |
          For ClaimsReview, low-severity sexual content in the user input is blocked, because the more restrictive setting of gr-model and gr-agent applies.
        fr: |
          Pour ClaimsReview, le contenu sexuel de faible gravité dans l'entrée utilisateur est bloqué, car le paramètre le plus restrictif entre gr-model et gr-agent s'applique.
    - id: s3
      text:
        en: |
          The content that ClaimsReview sends in its tool calls is scanned for the Sexual risk.
        fr: |
          Le contenu que ClaimsReview envoie dans ses appels d'outils est analysé pour le risque Sexual.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      An agent without its own guardrail inherits the guardrail of its model deployment, so ClaimsIntake is checked with gr-model at High. An agent's guardrail fully overrides the model's guardrail instead of being combined with it: ClaimsReview is checked at Low, which blocks only high-severity content. gr-agent has no tool call controls, so the content sent to tools isn't scanned for the Sexual risk.
    fr: |
      Un agent sans garde-fou propre hérite du garde-fou de son déploiement de modèle : ClaimsIntake est donc vérifié avec gr-model au niveau High. Le garde-fou d'un agent remplace entièrement celui du modèle au lieu de s'y combiner : ClaimsReview est vérifié au niveau Low, qui ne bloque que le contenu de gravité élevée. gr-agent n'a aucun contrôle Tool call : le contenu envoyé aux outils n'est donc pas analysé pour le risque Sexual.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
