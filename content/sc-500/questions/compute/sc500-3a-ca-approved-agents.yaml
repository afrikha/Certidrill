id: sc500-3a-ca-approved-agents
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Entra Agent ID. The HR department builds agents from the agent identity blueprint **bp-hr**. You need to create a Conditional Access policy that meets the following requirements:

    - Only agent identities created from bp-hr, including those created in the future, can access resources by using their own agent identity.
    - All other agent identities are blocked.
    - The impact of the policy is evaluated before it is enforced.

    How should you configure the policy? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise Microsoft Entra Agent ID. Le service RH crée des agents à partir du blueprint d'identité d'agent **bp-hr**. Vous devez créer une stratégie d'accès conditionnel qui respecte les exigences suivantes :

    - seules les identités d'agent créées à partir de bp-hr, y compris celles qui seront créées à l'avenir, peuvent accéder aux ressources avec leur propre identité d'agent ;
    - toutes les autres identités d'agent sont bloquées ;
    - l'impact de la stratégie est évalué avant qu'elle soit appliquée.

    Comment devez-vous configurer la stratégie ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Agents > Include: [[inc]]
      Agents > Exclude: [[exc]]
      Target resources > Include: All resources (formerly 'All cloud apps')
      Grant: [[grant]]
      Enable policy: [[mode]]
    fr: |
      Agents > Include : [[inc]]
      Agents > Exclude : [[exc]]
      Target resources > Include : All resources (formerly 'All cloud apps')
      Grant : [[grant]]
      Enable policy : [[mode]]
  slots:
    - id: inc
      options:
        - { id: allid, text: All agent identities }
        - { id: allusers, text: All agent users (Preview) }
        - { id: hr, text: { en: "The agent blueprint principal of bp-hr", fr: "Le principal de blueprint d'agent de bp-hr" } }
    - id: exc
      options:
        - { id: bp, text: { en: "The agent blueprint principal of bp-hr", fr: "Le principal de blueprint d'agent de bp-hr" } }
        - { id: each, text: { en: "Each agent identity that currently exists for bp-hr", fr: "Chaque identité d'agent existant actuellement pour bp-hr" } }
        - { id: owners, text: { en: "The owners of bp-hr", fr: "Les propriétaires de bp-hr" } }
    - id: grant
      options:
        - { id: block, text: Block access }
        - { id: mfa, text: "Grant access > Require multifactor authentication" }
        - { id: device, text: "Grant access > Require device to be marked as compliant" }
    - id: mode
      options:
        - { id: report, text: Report-only }
        - { id: on, text: "On" }
        - { id: off, text: "Off" }
answer:
  values: { inc: allid, exc: bp, grant: block, mode: report }
explanation:
  correct:
    en: |
      The documented pattern blocks every agent identity and excludes the approved ones. Excluding the blueprint principal covers all agent identities created from bp-hr, including future ones, whereas a list of current agent identities would miss new agents. Block is the only grant control available for agent identities, because they cannot perform interactive remediation. Report-only mode shows the impact before you switch the policy to On.
    fr: |
      Le modèle documenté bloque toutes les identités d'agent et exclut celles qui sont approuvées. Exclure le principal de blueprint couvre toutes les identités d'agent créées à partir de bp-hr, y compris les futures, alors qu'une liste des identités actuelles oublierait les nouveaux agents. Block est le seul contrôle d'octroi disponible pour les identités d'agent, qui ne peuvent pas effectuer de correction interactive. Le mode Report-only montre l'impact avant de passer la stratégie à On.
  options:
    allusers:
      en: |
        All agent users targets the agents' user accounts, not the agent identities that the requirement is about.
      fr: |
        All agent users cible les comptes d'utilisateur des agents, pas les identités d'agent visées par l'exigence.
    owners:
      en: |
        Owners are users or service principals that administer the blueprint; excluding them does not exclude the agent identities.
      fr: |
        Les propriétaires sont des utilisateurs ou des principaux de service qui administrent le blueprint ; les exclure n'exclut pas les identités d'agent.
    mfa:
      en: |
        Agent identities cannot satisfy interactive controls such as multifactor authentication; only Block is supported for them.
      fr: |
        Les identités d'agent ne peuvent pas satisfaire des contrôles interactifs comme l'authentification multifacteur ; seul Block est pris en charge pour elles.
references:
  - title: Secure autonomous agents with Conditional Access
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-autonomous-agents
  - title: Target agent identities in Microsoft Entra Conditional Access policies
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/howto-target-agent-identities
