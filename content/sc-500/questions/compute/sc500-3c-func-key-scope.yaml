id: sc500-3c-func-key-scope
objective: "3.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a function app named **func-billing** that contains six HTTP-triggered functions. A partner system must call only the **GetInvoice** function by using an access key. The partner's outbound proxy logs every requested URL, so the key must not appear in the URL.

    How should you configure access? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une application de fonction nommée **func-billing** qui contient six fonctions déclenchées par HTTP. Un système partenaire doit appeler uniquement la fonction **GetInvoice** à l'aide d'une clé d'accès. Le proxy sortant du partenaire journalise chaque URL demandée : la clé ne doit donc pas apparaître dans l'URL.

    Comment devez-vous configurer l'accès ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Authorization level of GetInvoice: [[level]]
      Key given to the partner: [[key]]
      The partner sends the key in the [[header]] request header.
    fr: |
      Niveau d'autorisation de GetInvoice : [[level]]
      Clé fournie au partenaire : [[key]]
      Le partenaire envoie la clé dans l'en-tête de requête [[header]].
  slots:
    - id: level
      options:
        - { id: anon, text: anonymous }
        - { id: function, text: function }
        - { id: admin, text: admin }
    - id: key
      options:
        - { id: fkey, text: { en: "a function key of GetInvoice", fr: "une clé de fonction de GetInvoice" } }
        - { id: hkey, text: { en: "a host key", fr: "une clé d'hôte" } }
        - { id: master, text: { en: "the master key (_master)", fr: "la clé principale (_master)" } }
    - id: header
      options:
        - { id: auth, text: Authorization }
        - { id: xfk, text: x-functions-key }
        - { id: apim, text: Ocp-Apim-Subscription-Key }
answer:
  values: { level: function, key: fkey, header: xfk }
explanation:
  correct:
    en: "With the `function` level, a request must present a function key or a host key. A function key allows access to a single function endpoint, whereas a host key works for every function in the app. Instead of the `code` query string parameter, the key can be sent in the `x-functions-key` header, which keeps it out of the URL."
    fr: "Avec le niveau `function`, une requête doit présenter une clé de fonction ou une clé d'hôte. Une clé de fonction donne accès à un seul point de terminaison de fonction, alors qu'une clé d'hôte fonctionne pour toutes les fonctions de l'application. Au lieu du paramètre de chaîne de requête `code`, la clé peut être envoyée dans l'en-tête `x-functions-key`, ce qui la maintient hors de l'URL."
  options:
    anon: { en: "The anonymous level requires no key at all.", fr: "Le niveau anonymous n'exige aucune clé." }
    admin: { en: "The admin level requires the master key, which must not be shared with third parties.", fr: "Le niveau admin exige la clé principale, qui ne doit pas être partagée avec des tiers." }
    hkey: { en: "A host key allows calls to all six functions.", fr: "Une clé d'hôte permet d'appeler les six fonctions." }
    master: { en: "The master key also grants administrative access to the runtime APIs.", fr: "La clé principale accorde aussi un accès administratif aux API du runtime." }
    auth: { en: "Access keys are passed in the code query parameter or the x-functions-key header, not in the Authorization header.", fr: "Les clés d'accès se transmettent dans le paramètre de requête code ou dans l'en-tête x-functions-key, pas dans l'en-tête Authorization." }
    apim: { en: "Ocp-Apim-Subscription-Key carries an API Management subscription key, not a Functions access key.", fr: "Ocp-Apim-Subscription-Key transporte une clé d'abonnement API Management, pas une clé d'accès Functions." }
references:
  - title: Work with access keys in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/function-keys-how-to
