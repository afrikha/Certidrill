id: sc500-3a-spo-rac-finance
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has Microsoft 365 Copilot and SharePoint Advanced Management licenses. The site permissions report shows that the SharePoint site **Finance-Close** is shared with Everyone except external users, and many files in the site have Anyone and People in the organization links.

    You need to ensure that, starting today, only the members of the **Finance-Team** group can open the content of Finance-Close, whatever sharing links exist. The site owners will clean up the links later.

    What should you do?
  fr: |
    Litware, Inc. dispose de licences Microsoft 365 Copilot et SharePoint Advanced Management. Le rapport des autorisations de site montre que le site SharePoint **Finance-Close** est partagé avec Tout le monde sauf les utilisateurs externes, et que de nombreux fichiers du site ont des liens Anyone et People in the organization.

    Vous devez faire en sorte que, dès aujourd'hui, seuls les membres du groupe **Finance-Team** puissent ouvrir le contenu de Finance-Close, quels que soient les liens de partage existants. Les propriétaires du site nettoieront les liens plus tard.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable restricted content discovery on Finance-Close.", fr: "Activer la découverte de contenu restreinte sur Finance-Close." } }
    - { id: b, text: { en: "Apply a restricted access control policy that allows Finance-Team on Finance-Close.", fr: "Appliquer une stratégie de contrôle d'accès restreint qui autorise Finance-Team sur Finance-Close." } }
    - { id: c, text: { en: "Initiate a site access review of Finance-Close for the site owners.", fr: "Lancer une révision d'accès au site Finance-Close pour les propriétaires du site." } }
    - { id: d, text: { en: "Run the Site permissions for users report for the Finance-Team members.", fr: "Exécuter le rapport Site permissions for users pour les membres de Finance-Team." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Restricted access control is the immediate remediation for an overshared site: it limits access to the site to the members of the specified group, so users outside Finance-Team cannot open the content even through existing sharing links. The owners can then fix the permissions and links at their own pace.
    fr: |
      Le contrôle d'accès restreint est la correction immédiate d'un site surpartagé : il limite l'accès au site aux membres du groupe indiqué, si bien que les utilisateurs extérieurs à Finance-Team ne peuvent pas ouvrir le contenu, même par des liens de partage existants. Les propriétaires peuvent ensuite corriger les autorisations et les liens à leur rythme.
  options:
    a:
      en: |
        Restricted content discovery only hides the site from organization-wide search and Copilot; anyone who has access through a link can still open the content.
      fr: |
        La découverte de contenu restreinte masque seulement le site dans la recherche à l'échelle de l'organisation et dans Copilot ; toute personne qui a accès par un lien peut toujours ouvrir le contenu.
    c:
      en: |
        A site access review asks the owners to review and update permissions; nothing is restricted until they act.
      fr: |
        Une révision d'accès au site demande aux propriétaires d'examiner et de mettre à jour les autorisations ; rien n'est restreint tant qu'ils n'agissent pas.
    d:
      en: |
        This report lists what specific users can access; it identifies exposure but does not restrict access.
      fr: |
        Ce rapport liste ce à quoi des utilisateurs précis peuvent accéder ; il identifie l'exposition mais ne restreint pas l'accès.
references:
  - title: Restrict SharePoint site access with Microsoft 365 groups and Microsoft Entra security groups
    url: https://learn.microsoft.com/en-us/sharepoint/restricted-access-control
  - title: Data access governance reports for SharePoint and OneDrive sites
    url: https://learn.microsoft.com/en-us/sharepoint/data-access-governance-reports
