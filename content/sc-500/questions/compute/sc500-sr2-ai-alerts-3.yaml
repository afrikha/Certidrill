id: sc500-sr2-ai-alerts-3
objective: "3.1.8"
type: series_yesno
series: sc500-sr2-ai-alerts
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You enable the AI services plan with suspicious prompt evidence.
  fr: Vous activez le plan AI services avec les preuves d'invites suspectes.
body:
  solution:
    en: In Defender for Cloud, you select **Environment settings** > Sub1 > **Defender plans**, and you set **AI services** to **On**. In the **Settings** of the AI services plan, you turn on **Suspicious prompt evidence**.
    fr: Dans Defender for Cloud, vous sélectionnez **Environment settings** > Sub1 > **Defender plans**, puis vous définissez **AI services** sur **On**. Dans les **Settings** du plan AI services, vous activez **Suspicious prompt evidence**.
answer: { value: true }
explanation:
  correct:
    en: The AI services plan provides threat protection for AI services and detects threats such as jailbreak and data leakage in real time; its alerts integrate with Defender XDR in the Defender portal. Suspicious prompt evidence adds the suspicious segments of user prompts and model responses to the alerts; without it, the prompt content is masked. The Owner role is enough to enable the plan.
    fr: "Le plan AI services fournit la protection contre les menaces pour les services IA et détecte en temps réel des menaces comme le jailbreak et la fuite de données ; ses alertes sont intégrées à Defender XDR dans le portail Defender. Les preuves d'invites suspectes ajoutent aux alertes les segments suspects des invites utilisateur et des réponses du modèle ; sans elles, le contenu des invites est masqué. Le rôle Owner suffit pour activer le plan."
references:
  - title: Enable threat protection for AI services
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding
  - title: AI threat protection in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
