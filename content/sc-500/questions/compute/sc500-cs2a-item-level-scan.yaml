id: sc500-cs2a-item-level-scan
objective: "3.1.1"
type: single
caseStudy: sc500-cs2a-nod-publishers
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for the files of the Contracts site that have sharing links. What should you do in Microsoft Purview DSPM?
  fr: |
    Vous devez respecter l'exigence relative aux fichiers du site Contracts qui possèdent des liens de partage. Que devez-vous faire dans Microsoft Purview DSPM ?
body:
  options:
    - { id: a, text: { en: "Open the default data risk assessment and use the actions of its Protect tab for the Contracts site", fr: "Ouvrir l'évaluation des risques liés aux données par défaut et utiliser les actions de son onglet Protect pour le site Contracts" } }
    - { id: b, text: { en: "Create a custom data risk assessment for the Contracts site and select the Item-level scan level", fr: "Créer une évaluation des risques liés aux données personnalisée pour le site Contracts et sélectionner le niveau d'analyse Item-level" } }
    - { id: c, text: { en: "Create a custom data risk assessment for all SharePoint sites and OneDrive accounts and select the Item-level scan level", fr: "Créer une évaluation des risques liés aux données personnalisée pour tous les sites SharePoint et comptes OneDrive et sélectionner le niveau d'analyse Item-level" } }
    - { id: d, text: { en: "Open the default data risk assessment and start a SharePoint site access review from its Monitor tab", fr: "Ouvrir l'évaluation des risques liés aux données par défaut et lancer une révision de l'accès au site SharePoint depuis son onglet Monitor" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Item-level scanning is available only in custom data risk assessments, for SharePoint sites. It flags each item that has a sharing link for external or anonymous users and offers item actions such as Remove sharing link. It requires a registered Microsoft Entra application and a one-time Authenticate step, and the case states that the application is already registered.
    fr: |
      L'analyse au niveau des éléments n'est disponible que dans les évaluations des risques liés aux données personnalisées, pour les sites SharePoint. Elle signale chaque élément qui possède un lien de partage pour des utilisateurs externes ou anonymes et propose des actions sur les éléments, comme Remove sharing link. Elle nécessite une application Microsoft Entra inscrite et une étape Authenticate unique ; l'étude de cas indique que l'application est déjà inscrite.
  options:
    a: { en: "The default assessment summarizes links that share data with anyone per site; its Protect tab offers site-level options (label restriction, Restricted Content Discovery, auto-labeling, retention), not item-level link removal.", fr: "L'évaluation par défaut résume par site les liens qui partagent des données avec tout le monde ; son onglet Protect propose des options au niveau du site (restriction par étiquette, Restricted Content Discovery, étiquetage automatique, rétention), pas la suppression de liens élément par élément." }
    c: { en: "Item-level scanning doesn't support OneDrive and is limited to 10 SharePoint sites.", fr: "L'analyse au niveau des éléments ne prend pas en charge OneDrive et est limitée à 10 sites SharePoint." }
    d: { en: "A site access review opens the SharePoint data access governance reports; it doesn't list the shared items or remove their links in DSPM.", fr: "Une révision de l'accès au site ouvre les rapports de gouvernance de l'accès aux données SharePoint ; elle ne liste pas les éléments partagés et ne supprime pas leurs liens dans DSPM." }
references:
  - title: Prevent oversharing with data risk assessments from Data Security Posture Management
    url: https://learn.microsoft.com/en-us/purview/data-security-posture-management-oversharing
