id: sc500-3a-gr-blocking-levels
objective: "3.1.9"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. creates a custom guardrail in Microsoft Foundry for an agent built in Foundry Agent Service. The guardrail must meet the following requirements:

    - Violence: block medium-severity and high-severity content, but allow low-severity content.
    - Hate: block content of every severity.
    - Detected risks must stop the agent, not only be flagged.

    How should you configure the controls? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. crée un garde-fou personnalisé dans Microsoft Foundry pour un agent créé dans Foundry Agent Service. Le garde-fou doit respecter les exigences suivantes :

    - Violence : bloquer le contenu de gravité moyenne et élevée, mais autoriser le contenu de faible gravité ;
    - Hate : bloquer le contenu de toute gravité ;
    - les risques détectés doivent arrêter l'agent, pas seulement être signalés.

    Comment devez-vous configurer les contrôles ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Violence blocking level: [[violence]]
      Hate blocking level: [[hate]]
      Action of the controls: [[action]]
    fr: |
      Niveau de blocage Violence : [[violence]]
      Niveau de blocage Hate : [[hate]]
      Action des contrôles : [[action]]
  slots:
    - id: violence
      options:
        - { id: low, text: Low }
        - { id: medium, text: Medium }
        - { id: high, text: High }
    - id: hate
      options:
        - { id: low, text: Low }
        - { id: medium, text: Medium }
        - { id: high, text: High }
    - id: action
      options:
        - { id: annotate, text: Annotate }
        - { id: block, text: Annotate and block }
answer:
  values: { violence: medium, hate: high, action: block }
explanation:
  correct:
    en: |
      The blocking level names the lowest severity that is blocked: Low blocks only high-severity content, Medium blocks medium and high, and High blocks low, medium and high, the most restrictive level. Agents support only the Annotate and block action; Annotate alone is available for models.
    fr: |
      Le niveau de blocage indique la gravité la plus faible bloquée : Low ne bloque que le contenu de gravité élevée, Medium bloque les gravités moyenne et élevée, et High bloque les gravités faible, moyenne et élevée, ce qui est le niveau le plus restrictif. Les agents ne prennent en charge que l'action Annotate and block ; Annotate seul est disponible pour les modèles.
  options:
    low:
      en: |
        Low is the least restrictive level: it blocks only high-severity content.
      fr: |
        Low est le niveau le moins restrictif : il ne bloque que le contenu de gravité élevée.
    annotate:
      en: |
        Annotate only flags detections and is not available for agents.
      fr: |
        Annotate ne fait que signaler les détections et n'est pas disponible pour les agents.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
