id: sc500-3c-waf-policy-scope
objective: "3.3.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Application Gateway WAF_v2 named **agw-web** with the following configuration:

    | Listener | Host name | Routing | Associated WAF policy |
    | --- | --- | --- | --- |
    | lst-shop | shop.litware.com | Path-based: `/api/*` to pool-api, default to pool-shop | wafp-shop |
    | lst-blog | blog.litware.com | Basic to pool-blog | None |

    The path-based rule for `/api/*` is associated with a WAF policy named **wafp-api**. A WAF policy named **wafp-global** is associated with agw-web.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une Application Gateway WAF_v2 nommée **agw-web** avec la configuration suivante :

    | Écouteur | Nom d'hôte | Routage | Stratégie WAF associée |
    | --- | --- | --- | --- |
    | lst-shop | shop.litware.com | Basé sur le chemin : `/api/*` vers pool-api, par défaut vers pool-shop | wafp-shop |
    | lst-blog | blog.litware.com | De base vers pool-blog | Aucune |

    La règle basée sur le chemin pour `/api/*` est associée à une stratégie WAF nommée **wafp-api**. Une stratégie WAF nommée **wafp-global** est associée à agw-web.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A request to https://shop.litware.com/api/orders is evaluated against wafp-api, not wafp-shop.", fr: "Une requête vers https://shop.litware.com/api/orders est évaluée par rapport à wafp-api, et non à wafp-shop." } }
    - { id: b, text: { en: "A request to https://shop.litware.com/cart is evaluated against both wafp-shop and wafp-global.", fr: "Une requête vers https://shop.litware.com/cart est évaluée par rapport à wafp-shop et à wafp-global." } }
    - { id: c, text: { en: "A request to https://blog.litware.com/ is evaluated against wafp-global.", fr: "Une requête vers https://blog.litware.com/ est évaluée par rapport à wafp-global." } }
    - { id: d, text: { en: "A request to https://blog.litware.com/ is not inspected by the WAF.", fr: "Une requête vers https://blog.litware.com/ n'est pas inspectée par le WAF." } }
    - { id: e, text: { en: "A request to https://shop.litware.com/api/orders is evaluated against wafp-api, wafp-shop and wafp-global.", fr: "Une requête vers https://shop.litware.com/api/orders est évaluée par rapport à wafp-api, wafp-shop et wafp-global." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "More specific WAF policies override less specific ones. A per-URI policy on a path-based rule overrides the per-site and global policies for those paths, so `/api/orders` uses wafp-api only. lst-blog has no policy of its own, so the global policy associated with the gateway applies to it."
    fr: "Les stratégies WAF plus spécifiques remplacent les moins spécifiques. Une stratégie par URI sur une règle basée sur le chemin remplace les stratégies par site et globale pour ces chemins : `/api/orders` utilise uniquement wafp-api. lst-blog n'a pas de stratégie propre : la stratégie globale associée à la passerelle s'y applique."
  options:
    b:
      en: "The per-site policy wafp-shop overrides wafp-global for lst-shop; the policies are not combined."
      fr: "La stratégie par site wafp-shop remplace wafp-global pour lst-shop ; les stratégies ne se cumulent pas."
    d:
      en: "A global policy protects every listener and path-based rule that has no more specific policy."
      fr: "Une stratégie globale protège tous les écouteurs et toutes les règles basées sur le chemin qui n'ont pas de stratégie plus spécifique."
    e:
      en: "Only the most specific policy applies; wafp-api overrides the other two for `/api/*`."
      fr: "Seule la stratégie la plus spécifique s'applique ; wafp-api remplace les deux autres pour `/api/*`."
references:
  - title: Azure Web Application Firewall (WAF) policy overview
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/policy-overview
