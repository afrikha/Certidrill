id: sc500-cs3c-acr-private
objective: "3.3.3"
type: single
caseStudy: sc500-cs3c-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |-
    You need to meet the requirement for acrclaims. What should you do?
  fr: |-
    Vous devez satisfaire l'exigence relative à acrclaims. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the Standard SKU, create a private endpoint, disable public network access, and allow trusted services.", fr: "Conserver le SKU Standard, créer un point de terminaison privé, désactiver l'accès au réseau public et autoriser les services approuvés." } }
    - { id: b, text: { en: "Upgrade to the Premium SKU, create a private endpoint, disable public network access, and allow trusted services.", fr: "Passer au SKU Premium, créer un point de terminaison privé, désactiver l'accès au réseau public et autoriser les services approuvés." } }
    - { id: c, text: { en: "Upgrade to the Premium SKU, create a private endpoint, disable public network access, and block trusted services.", fr: "Passer au SKU Premium, créer un point de terminaison privé, désactiver l'accès au réseau public et bloquer les services approuvés." } }
    - { id: d, text: { en: "Upgrade to the Premium SKU, allow selected networks only, add the outbound IP address of aks-claims, and allow trusted services.", fr: "Passer au SKU Premium, n'autoriser que les réseaux sélectionnés, ajouter l'adresse IP sortante de aks-claims et autoriser les services approuvés." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Private endpoints for Azure Container Registry require the Premium SKU. With public network access disabled, the registry is reachable only through the private endpoint, and trusted services such as Microsoft Defender for Cloud can reach it only when the trusted services bypass is enabled.
    fr: |-
      Les points de terminaison privés d'Azure Container Registry exigent le SKU Premium. Avec l'accès au réseau public désactivé, le registre n'est joignable que par le point de terminaison privé, et les services approuvés comme Microsoft Defender for Cloud ne peuvent l'atteindre que si le contournement pour les services approuvés est activé.
  options:
    a:
      en: |-
        The Standard SKU does not support private endpoints.
      fr: |-
        Le SKU Standard ne prend pas en charge les points de terminaison privés.
    c:
      en: |-
        Without the trusted services bypass, Defender for Cloud can no longer reach the registry once public access is disabled.
      fr: |-
        Sans le contournement pour les services approuvés, Defender for Cloud ne peut plus atteindre le registre une fois l'accès public désactivé.
    d:
      en: |-
        An IP firewall rule keeps the public endpoint and the pulls use a public IP address, not a private one.
      fr: |-
        Une règle de pare-feu IP conserve le point de terminaison public, et les extractions utilisent une adresse IP publique, pas une adresse privée.
references:
  - title: Set Up Private Endpoint with Private Link for ACR
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-private-link
