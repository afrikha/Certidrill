id: sc500-3c-dfc-gated-order
objective: "3.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an AKS cluster named **aks-pay** that has the OpenID Connect (OIDC) issuer enabled and pulls images from an Azure container registry named **acrpay**. The Defender for Containers plan is enabled on the subscription, but only the **Kubernetes API access** component is turned on.

    You need to prevent deployments of images that have critical vulnerabilities to the **payments** namespace of aks-pay. Before any deployment is blocked, the security team must review for one week which deployments the rule would affect.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin dispose d'un cluster AKS nommé **aks-pay** dont l'émetteur OpenID Connect (OIDC) est activé et qui extrait ses images d'un registre de conteneurs Azure nommé **acrpay**. Le plan Defender for Containers est activé sur l'abonnement, mais seul le composant **Kubernetes API access** est activé.

    Vous devez empêcher le déploiement, dans l'espace de noms **payments** d'aks-pay, d'images qui présentent des vulnérabilités critiques. Avant que le moindre déploiement soit bloqué, l'équipe de sécurité doit examiner pendant une semaine les déploiements que la règle affecterait.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: plan, text: { en: "Turn on **Defender sensor** with **Enable Defender Security Gating**, and **Registry access** with **Security findings**.", fr: "Activer **Defender sensor** avec **Enable Defender Security Gating**, ainsi que **Registry access** avec **Security findings**." } }
    - { id: audit, text: { en: "Under **Security rules** > **Gated deployment** > **Vulnerability assessment**, add a rule scoped to the payments namespace with the **Audit** action.", fr: "Dans **Security rules** > **Gated deployment** > **Vulnerability assessment**, ajouter une règle limitée à l'espace de noms payments avec l'action **Audit**." } }
    - { id: review, text: { en: "Review the admission events in **Admission Monitoring**.", fr: "Examiner les événements d'admission dans **Admission Monitoring**." } }
    - { id: deny, text: { en: "Add a gated deployment rule with the same scope and conditions and the **Deny** action.", fr: "Ajouter une règle de déploiement contrôlé (gated deployment) ayant la même étendue, les mêmes conditions et l'action **Deny**." } }
    - { id: policy, text: { en: "Assign an Azure Policy definition with the **Deny** effect that targets `Microsoft.ContainerService/managedClusters`.", fr: "Attribuer une définition Azure Policy avec l'effet **Deny** qui cible `Microsoft.ContainerService/managedClusters`." } }
    - { id: agentless, text: { en: "Turn on **Agentless scanning for machines** and add an exclusion tag for the payments nodes.", fr: "Activer **Agentless scanning for machines** et ajouter une étiquette d'exclusion pour les nœuds de payments." } }
answer:
  sequence: [plan, audit, review, deny]
explanation:
  correct:
    en: "Gated deployment requires the Defender sensor with Security Gating, which adds the admission controller, and Registry access with Security findings, which links vulnerability findings to images. You then create a rule with the Audit action, which allows deployments but records admission events, review those events in Admission Monitoring, and finally add a Deny rule to block matching deployments."
    fr: "Le déploiement contrôlé nécessite le capteur Defender avec Security Gating, qui ajoute le contrôleur d'admission, ainsi que Registry access avec Security findings, qui associe les résultats de vulnérabilité aux images. Vous créez ensuite une règle avec l'action Audit, qui autorise les déploiements mais enregistre des événements d'admission, vous examinez ces événements dans Admission Monitoring, puis vous ajoutez une règle Deny pour bloquer les déploiements concernés."
  options:
    policy:
      en: "A Deny policy assignment that targets managed clusters can block the Security Gating setup itself with a RequestDisallowedByPolicy error; it does not evaluate image vulnerabilities."
      fr: "Une attribution de stratégie Deny ciblant les clusters managés peut bloquer la configuration de Security Gating elle-même avec une erreur RequestDisallowedByPolicy ; elle n'évalue pas les vulnérabilités des images."
    agentless:
      en: "Agentless scanning for machines scans nodes, not the images admitted to the cluster, and excluding nodes would reduce coverage."
      fr: "Agentless scanning for machines analyse les nœuds, pas les images admises dans le cluster, et exclure des nœuds réduirait la couverture."
references:
  - title: Configure gated deployment rules for Kubernetes container images
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enablement-guide-runtime-gated
  - title: Gated deployment for Kubernetes container images
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/runtime-gated-overview
