id: sc500-3c-apim-okta-jwt
objective: "3.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin publishes an API named **Shipments** through an Azure API Management instance named **apim-tailspin** in the Standard v2 tier. Partner applications obtain OAuth 2.0 access tokens from Okta, a third-party identity provider, and send them in the `Authorization` header.

    You need API Management to reject any request to Shipments that does not carry a valid token issued by Okta for the Shipments audience.

    Which policy should you add to the inbound section of the Shipments API?
  fr: |
    Tailspin publie une API nommée **Shipments** via une instance Azure API Management nommée **apim-tailspin** du niveau Standard v2. Les applications partenaires obtiennent des jetons d'accès OAuth 2.0 auprès d'Okta, un fournisseur d'identité tiers, et les envoient dans l'en-tête `Authorization`.

    Vous devez faire en sorte qu'API Management rejette toute requête adressée à Shipments qui ne porte pas un jeton valide émis par Okta pour l'audience de Shipments.

    Quelle stratégie devez-vous ajouter à la section inbound de l'API Shipments ?
body:
  options:
    - { id: a, text: validate-azure-ad-token }
    - { id: b, text: validate-client-certificate }
    - { id: c, text: authentication-managed-identity }
    - { id: d, text: validate-jwt }
answer: { optionId: d }
explanation:
  correct:
    en: "The `validate-jwt` policy enforces the existence and validity of a JWT from any identity provider; you point it at the provider's OpenID configuration and list the required audiences and claims. It is the policy to use for tokens that Microsoft Entra ID did not issue."
    fr: "La stratégie `validate-jwt` vérifie la présence et la validité d'un jeton JWT émis par n'importe quel fournisseur d'identité ; vous lui indiquez la configuration OpenID du fournisseur et les audiences et revendications requises. C'est la stratégie à utiliser pour les jetons qui ne sont pas émis par Microsoft Entra ID."
  options:
    a:
      en: "`validate-azure-ad-token` validates only tokens issued by Microsoft Entra ID."
      fr: "`validate-azure-ad-token` ne valide que les jetons émis par Microsoft Entra ID."
    b:
      en: "`validate-client-certificate` checks a certificate presented by the client, not an OAuth access token."
      fr: "`validate-client-certificate` vérifie un certificat présenté par le client, pas un jeton d'accès OAuth."
    c:
      en: "`authentication-managed-identity` obtains a token for API Management to call a back end; it does not validate callers."
      fr: "`authentication-managed-identity` obtient un jeton pour qu'API Management appelle un back-end ; elle ne valide pas les appelants."
references:
  - title: Validate Microsoft Entra token
    url: https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy
  - title: Azure API Management policy reference
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-policies
