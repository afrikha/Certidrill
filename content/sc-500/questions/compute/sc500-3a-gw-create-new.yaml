id: sc500-3a-gw-create-new
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Foundry resource named **foundry-dev** that is used only for development and testing. The subscription has no Azure API Management instance.

    In the Foundry portal, you select **Manage** > **AI Gateway** > **Add AI Gateway**, select foundry-dev, and then select **Create new**.

    Which API Management tier does the new instance use?
  fr: |
    Wingtip Toys dispose d'une ressource Microsoft Foundry nommée **foundry-dev**, utilisée uniquement pour le développement et les tests. L'abonnement ne contient aucune instance Gestion des API Azure.

    Dans le portail Foundry, vous sélectionnez **Manage** > **AI Gateway** > **Add AI Gateway**, sélectionnez foundry-dev, puis **Create new**.

    Quel niveau de Gestion des API la nouvelle instance utilise-t-elle ?
body:
  options:
    - { id: a, text: Consumption }
    - { id: b, text: Basic v2 }
    - { id: c, text: Standard v2 }
    - { id: d, text: Premium v2 }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Create new deploys a Basic v2 API Management instance, intended for development and testing. For production or higher throughput, Microsoft recommends selecting Use existing with a Standard v2 or Premium v2 instance.
    fr: |
      Create new déploie une instance Gestion des API Basic v2, destinée au développement et aux tests. Pour la production ou un débit plus élevé, Microsoft recommande de sélectionner Use existing avec une instance Standard v2 ou Premium v2.
  options:
    a:
      en: |
        AI Gateway uses v2 tiers; Consumption is not the tier that Create new deploys.
      fr: |
        AI Gateway utilise des niveaux v2 ; Consumption n'est pas le niveau déployé par Create new.
    c:
      en: |
        Standard v2 is a recommended existing instance for production; it is not what Create new deploys.
      fr: |
        Standard v2 est une instance existante recommandée pour la production ; ce n'est pas ce que déploie Create new.
    d:
      en: |
        Premium v2 is used through Use existing, for example when virtual network injection is needed.
      fr: |
        Premium v2 s'utilise via Use existing, par exemple quand l'injection dans un réseau virtuel est nécessaire.
references:
  - title: Configure AI Gateway in your Foundry resources
    url: https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal
