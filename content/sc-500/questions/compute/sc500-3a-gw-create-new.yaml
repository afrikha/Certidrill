id: sc500-3a-gw-create-new
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Foundry resource named **foundry-dev** that contains a project named **proj-app**. An Azure API Management instance named **apim-wt** already publishes the model deployments of foundry-dev as LLM APIs and enforces token limits on them.

    You need the agents that the developers build in Foundry Agent Service in proj-app to call the models through apim-wt.

    What should you do in the Foundry portal?
  fr: |
    Wingtip Toys dispose d'une ressource Microsoft Foundry nommée **foundry-dev** qui contient un projet nommé **proj-app**. Une instance Gestion des API Azure nommée **apim-wt** publie déjà les déploiements de modèles de foundry-dev sous forme d'API LLM et y applique des limites de jetons.

    Vous devez faire en sorte que les agents créés par les développeurs dans Foundry Agent Service dans proj-app appellent les modèles via apim-wt.

    Que devez-vous faire dans le portail Foundry ?
body:
  options:
    - { id: a, text: { en: "Select Manage > AI Gateway > Add AI Gateway, and then select apim-wt under Use existing.", fr: "Sélectionner Manage > AI Gateway > Add AI Gateway, puis sélectionner apim-wt sous Use existing." } }
    - { id: b, text: { en: "Add a Model connection with the Gateway source, and enter the base URL and authentication of apim-wt.", fr: "Ajouter une connexion Model avec la source Gateway, puis saisir l'URL de base et l'authentification d'apim-wt." } }
    - { id: c, text: { en: "Assign the managed identity of apim-wt the Foundry Owner role on proj-app.", fr: "Attribuer le rôle Foundry Owner sur proj-app à l'identité managée d'apim-wt." } }
    - { id: d, text: { en: "Deploy the models again in proj-app, and then disable key access on the new deployments.", fr: "Redéployer les modèles dans proj-app, puis désactiver l'accès par clé sur les nouveaux déploiements." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Foundry consumes an API Management gateway through a connection: Connections > Add connection > Model, with the Gateway source, the gateway base URL and its authentication. The models then appear in the project as connected models, and agents in Agent Service select the connected model, so their requests go through apim-wt and its token limits.
    fr: |
      Foundry consomme une passerelle API Management par une connexion : Connections > Add connection > Model, avec la source Gateway, l'URL de base de la passerelle et son authentification. Les modèles apparaissent alors dans le projet comme modèles connectés, et les agents d'Agent Service sélectionnent le modèle connecté : leurs requêtes passent donc par apim-wt et ses limites de jetons.
  options:
    a:
      en: |
        New API Management links can no longer be created from Foundry; that earlier preview experience only keeps existing links working.
      fr: |
        On ne peut plus créer de nouveau lien API Management depuis Foundry ; cette ancienne expérience en préversion ne fait que maintenir les liens existants.
    c:
      en: |
        A role for the gateway's identity on the project doesn't route the agents' requests through the gateway; the gateway's identity needs a data plane role on the Foundry resource to call the models.
      fr: |
        Un rôle de l'identité de la passerelle sur le projet ne fait pas passer les requêtes des agents par la passerelle ; l'identité de la passerelle a besoin d'un rôle de plan de données sur la ressource Foundry pour appeler les modèles.
    d:
      en: |
        New deployments in the project are called directly by the agents and bypass apim-wt, so its token limits aren't applied.
      fr: |
        Les nouveaux déploiements du projet sont appelés directement par les agents et contournent apim-wt : ses limites de jetons ne s'appliquent donc pas.
references:
  - title: Configure Azure AI Gateway in your Foundry resources
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/configuration/enable-ai-api-management-gateway-portal
