id: sc500-3c-acr-signing
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Premium tier Azure container registry named **acrprod** that uses Docker Content Trust to sign images. AKS clusters deploy images from acrprod.

    You need to replace the image signing solution before Docker Content Trust is removed from Azure Container Registry. Signatures must be stored in acrprod alongside the images, the signing keys must be managed in Azure Key Vault, and the AKS clusters must verify signatures before deployment.

    What should you implement?
  fr: |
    Adatum dispose d'un registre de conteneurs Azure de niveau Premium nommé **acrprod** qui utilise Docker Content Trust pour signer les images. Des clusters AKS déploient des images à partir d'acrprod.

    Vous devez remplacer la solution de signature des images avant que Docker Content Trust soit supprimé d'Azure Container Registry. Les signatures doivent être stockées dans acrprod avec les images, les clés de signature doivent être gérées dans Azure Key Vault, et les clusters AKS doivent vérifier les signatures avant le déploiement.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Notary Project signing with Notation, verified on AKS by Ratify and Azure Policy", fr: "La signature Notary Project avec Notation, vérifiée sur AKS par Ratify et Azure Policy" } }
    - { id: b, text: { en: "Gated deployment rules in Defender for Containers that use the Deny action", fr: "Des règles de déploiement contrôlé (gated deployment) Defender for Containers avec l'action Deny" } }
    - { id: c, text: { en: "A quarantine policy on acrprod, with AcrQuarantineWriter assigned to the pipeline", fr: "Une stratégie de quarantaine sur acrprod, avec AcrQuarantineWriter attribué au pipeline" } }
    - { id: d, text: { en: "Customer-managed keys on acrprod, stored in Azure Key Vault", fr: "Des clés gérées par le client sur acrprod, stockées dans Azure Key Vault" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Microsoft recommends moving from Docker Content Trust, which is removed from Azure Container Registry on March 31, 2028, to the Notary Project. Notation signs images with keys and certificates kept in Azure Key Vault, stores the signatures as OCI artifacts in the registry, and Ratify with Azure Policy verifies them on AKS."
    fr: "Microsoft recommande de passer de Docker Content Trust, supprimé d'Azure Container Registry le 31 mars 2028, au Notary Project. Notation signe les images avec des clés et des certificats conservés dans Azure Key Vault, stocke les signatures sous forme d'artefacts OCI dans le registre, et Ratify associé à Azure Policy les vérifie sur AKS."
  options:
    b:
      en: "Gated deployment blocks images based on their vulnerability findings; it does not sign images or verify signatures."
      fr: "Le déploiement contrôlé bloque les images en fonction de leurs résultats de vulnérabilité ; il ne signe pas les images et ne vérifie pas de signatures."
    c:
      en: "Quarantine holds images until their status changes; it is not a signing mechanism."
      fr: "La quarantaine retient les images jusqu'à ce que leur statut change ; ce n'est pas un mécanisme de signature."
    d:
      en: "Customer-managed keys encrypt the registry content at rest; they do not prove who produced an image."
      fr: "Les clés gérées par le client chiffrent le contenu du registre au repos ; elles ne prouvent pas qui a produit une image."
references:
  - title: Transition from Docker Content Trust to Notary Project
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-content-trust-deprecation
