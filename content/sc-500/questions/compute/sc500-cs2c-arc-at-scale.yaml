id: sc500-cs2c-arc-at-scale
objective: "3.2.4"
type: ordering
caseStudy: sc500-cs2c-margies-travel
difficulty: 1
status: draft
stem:
  en: |
    You need to connect the on-premises servers to Azure Arc to meet the onboarding requirement.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez connecter les serveurs locaux à Azure Arc pour respecter l'exigence d'intégration.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: sp, text: { en: "Create a service principal and assign it the Azure Connected Machine Onboarding role on rg-arc-lyon.", fr: "Créer un principal de service et lui attribuer le rôle Azure Connected Machine Onboarding sur rg-arc-lyon." } }
    - { id: spcontrib, text: { en: "Create a service principal and assign it the Contributor role on Sub-Travel.", fr: "Créer un principal de service et lui attribuer le rôle Contributor sur Sub-Travel." } }
    - { id: script, text: { en: "Generate an onboarding script for multiple servers that authenticates with the service principal.", fr: "Générer un script d'intégration pour plusieurs serveurs qui s'authentifie avec le principal de service." } }
    - { id: run, text: { en: "Run the script on the servers by using the configuration management tool.", fr: "Exécuter le script sur les serveurs avec l'outil de gestion de la configuration." } }
    - { id: gcext, text: { en: "Install the Azure VM guest configuration extension on each server.", fr: "Installer l'extension de configuration invité de machine virtuelle Azure sur chaque serveur." } }
    - { id: direct, text: { en: "Turn on Direct onboarding in the environment settings of Defender for Cloud.", fr: "Activer Direct onboarding dans les paramètres d'environnement de Defender for Cloud." } }
answer:
  sequence: [ sp, script, run ]
explanation:
  correct:
    en: |
      For onboarding at scale without interactive sign-in, you create a service principal that has the Azure Connected Machine Onboarding role, the minimum permission needed to connect machines with azcmagent. You then generate the installation script that uses this service principal, and deploy it with the configuration management tool.
    fr: |
      Pour une intégration à grande échelle sans connexion interactive, vous créez un principal de service qui dispose du rôle Azure Connected Machine Onboarding, l'autorisation minimale nécessaire pour connecter des machines avec azcmagent. Vous générez ensuite le script d'installation qui utilise ce principal de service, puis vous le déployez avec l'outil de gestion de la configuration.
  options:
    spcontrib: { en: "Contributor on the whole subscription grants far more than onboarding machines to rg-arc-lyon.", fr: "Contributor sur tout l'abonnement accorde bien plus que l'intégration de machines dans rg-arc-lyon." }
    gcext: { en: "Arc-enabled servers don't need this extension: machine configuration is included in the Connected Machine agent.", fr: "Les serveurs avec Arc n'ont pas besoin de cette extension : la configuration machine est incluse dans l'agent Connected Machine." }
    direct: { en: "Direct onboarding associates Defender for Endpoint servers with a subscription without Azure Arc, and doesn't provide Azure Policy or machine configuration.", fr: "Direct onboarding associe des serveurs Defender for Endpoint à un abonnement sans Azure Arc, et ne fournit ni Azure Policy ni la configuration machine." }
references:
  - title: Connect hybrid machines to Azure at scale
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/onboard-service-principal
  - title: Use Direct onboarding for on-premises servers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/onboard-machines-with-defender-for-endpoint
