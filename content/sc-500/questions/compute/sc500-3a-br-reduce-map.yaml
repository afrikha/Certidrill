id: sc500-3a-br-reduce-map
objective: "3.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation reviews the blast radius of an HR agent named **PeopleDesk** in Microsoft Defender XDR. The review shows the following findings:

    - PeopleDesk has the Microsoft Graph application permission `Sites.FullControl.All`, but it only reads documents from one HR SharePoint site.
    - PeopleDesk has `User.Read.All`, but it only displays the names and email addresses of employees.
    - The blueprint of PeopleDesk includes an action that sends email to any external address.

    You need to reduce the blast radius of PeopleDesk while preserving its core function.

    What should you use to replace each item? To answer, drag the appropriate replacements to the correct findings. Each replacement may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation examine le rayon d'impact d'un agent RH nommé **PeopleDesk** dans Microsoft Defender XDR. L'examen montre les constats suivants :

    - PeopleDesk possède l'autorisation d'application Microsoft Graph `Sites.FullControl.All`, mais il ne fait que lire des documents d'un seul site SharePoint RH ;
    - PeopleDesk possède `User.Read.All`, mais il n'affiche que les noms et adresses e-mail des employés ;
    - le blueprint de PeopleDesk inclut une action qui envoie des e-mails à n'importe quelle adresse externe.

    Vous devez réduire le rayon d'impact de PeopleDesk tout en préservant sa fonction principale.

    Par quoi devez-vous remplacer chaque élément ? Pour répondre, faites glisser les remplacements appropriés vers les constats correspondants. Chaque remplacement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: selected, text: "Sites.Selected" }
    - { id: basic, text: "User.ReadBasic.All" }
    - { id: task, text: { en: "A create-task action that queues messages for human review", fr: "Une action de création de tâche qui met les messages en file d'attente pour revue humaine" } }
    - { id: filesall, text: "Files.ReadWrite.All" }
    - { id: dirall, text: "Directory.Read.All" }
  targets:
    - { id: sites, text: "Sites.FullControl.All" }
    - { id: users, text: "User.Read.All" }
    - { id: mail, text: { en: "External send-email action", fr: "Action d'envoi d'e-mails externes" } }
answer:
  mapping: { sites: selected, users: basic, mail: task }
explanation:
  correct:
    en: |
      Blast radius depends on permissions, knowledge sources and the actions in the blueprint. Sites.Selected limits the agent to the sites it is explicitly granted, User.ReadBasic.All is enough to read basic profile properties, and replacing the external send-email action with a create-task action puts a human between the agent and data leaving the organization.
    fr: |
      Le rayon d'impact dépend des autorisations, des sources de connaissances et des actions du blueprint. Sites.Selected limite l'agent aux sites qui lui sont explicitement accordés, User.ReadBasic.All suffit pour lire les propriétés de base des profils, et remplacer l'action d'envoi d'e-mails externes par une action de création de tâche place un humain entre l'agent et les données qui quittent l'organisation.
  options:
    filesall:
      en: |
        Files.ReadWrite.All is a broad, tenant-wide permission that would keep a large blast radius.
      fr: |
        Files.ReadWrite.All est une autorisation large, à l'échelle du locataire, qui maintiendrait un rayon d'impact important.
    dirall:
      en: |
        Directory.Read.All reads far more directory data than names and email addresses.
      fr: |
        Directory.Read.All lit beaucoup plus de données d'annuaire que les noms et adresses e-mail.
references:
  - title: Assess blast radius and attack paths
    url: https://learn.microsoft.com/en-us/training/modules/analyze-ai-identity-risks-defender-xdr/3-assess-blast-radius-attack-paths
