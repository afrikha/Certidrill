seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You enable the Defender CSPM plan on Sub1.
  fr: Vous activez le plan Defender CSPM sur Sub1.
body:
  solution:
    en: In Defender for Cloud, you select **Environment settings** > Sub1 > **Defender plans**, and you set **Defender CSPM** to **On** so that AI security posture management discovers fdy-chat.
    fr: Dans Defender for Cloud, vous sélectionnez **Environment settings** > Sub1 > **Defender plans**, puis vous définissez **Defender CSPM** sur **On** afin que la gestion de la posture de sécurité de l'IA découvre fdy-chat.
answer: { value: false }
explanation:
  correct:
    en: AI security posture management in Defender CSPM discovers AI workloads, builds the AI bill of materials, and produces recommendations and attack paths. It is posture management, not runtime threat detection, so it does not raise alerts for jailbreak or data leakage attempts against the deployments.
    fr: La gestion de la posture de sécurité de l'IA de Defender CSPM découvre les charges de travail d'IA, établit la nomenclature de l'IA (AI BOM) et produit des recommandations et des chemins d'attaque. Il s'agit de gestion de la posture et non de détection des menaces à l'exécution ; elle ne génère donc pas d'alertes pour les tentatives de jailbreak ou de fuite de données visant les déploiements.
references:
  - title: Overview - AI security posture management - Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture
