id: sc500-3a-aid-reenable
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an agent identity named **QuoteBuilder**. The following users are associated with QuoteBuilder:

    | User | Relationship or role |
    | --- | --- |
    | User1 | Sponsor of QuoteBuilder |
    | User2 | Owner of QuoteBuilder |
    | User3 | Manager of the QuoteBuilder agent user account |
    | User4 | Agent ID Administrator role |
    | User5 | Agent ID Developer role |

    During an incident review, User1 disabled QuoteBuilder by mistake from the My Account portal. QuoteBuilder must be re-enabled.

    Which two users can re-enable QuoteBuilder?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'une identité d'agent nommée **QuoteBuilder**. Les utilisateurs suivants sont associés à QuoteBuilder :

    | Utilisateur | Relation ou rôle |
    | --- | --- |
    | User1 | Sponsor de QuoteBuilder |
    | User2 | Propriétaire de QuoteBuilder |
    | User3 | Responsable du compte d'utilisateur d'agent de QuoteBuilder |
    | User4 | Rôle Agent ID Administrator |
    | User5 | Rôle Agent ID Developer |

    Lors d'une revue d'incident, User1 a désactivé QuoteBuilder par erreur depuis le portail My Account. QuoteBuilder doit être réactivé.

    Quels sont les deux utilisateurs qui peuvent réactiver QuoteBuilder ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: u1, text: User1 }
    - { id: u2, text: User2 }
    - { id: u3, text: User3 }
    - { id: u4, text: User4 }
    - { id: u5, text: User5 }
answer: { optionIds: [ u2, u4 ] }
explanation:
  correct:
    en: |
      Owners can re-enable disabled agent identities and restore soft-deleted ones within the scope of the objects they own. Managing agent identities in the tenant, including disabling and re-enabling them, is done by the Agent ID Administrator (or Cloud Application Administrator) role.
    fr: |
      Les propriétaires peuvent réactiver des identités d'agent désactivées et restaurer celles qui sont supprimées de façon réversible, dans l'étendue des objets dont ils sont propriétaires. La gestion des identités d'agent du locataire, y compris leur désactivation et leur réactivation, relève du rôle Agent ID Administrator (ou Cloud Application Administrator).
  options:
    u1:
      en: |
        Sponsors can disable or soft-delete an agent identity but cannot re-enable or restore it; they must contact an owner or an administrator.
      fr: |
        Les sponsors peuvent désactiver ou supprimer de façon réversible une identité d'agent, mais pas la réactiver ni la restaurer ; ils doivent s'adresser à un propriétaire ou à un administrateur.
    u3:
      en: |
        Managers can request access packages for the agent's user account but cannot modify the agent.
      fr: |
        Les responsables peuvent demander des packages d'accès pour le compte d'utilisateur de l'agent, mais ne peuvent pas modifier l'agent.
    u5:
      en: |
        The Agent ID Developer role is used to create agent identity blueprints; it does not grant management of an existing agent identity that the user does not own.
      fr: |
        Le rôle Agent ID Developer sert à créer des blueprints d'identité d'agent ; il ne donne pas la gestion d'une identité d'agent existante dont l'utilisateur n'est pas propriétaire.
references:
  - title: Administrative relationships in Microsoft Entra Agent ID (Owners, sponsors, and managers)
    url: https://learn.microsoft.com/en-us/entra/agent-id/agent-owners-sponsors-managers
  - title: Manage agent identities in your organization
    url: https://learn.microsoft.com/en-us/entra/agent-id/manage-agent-identities-admin
