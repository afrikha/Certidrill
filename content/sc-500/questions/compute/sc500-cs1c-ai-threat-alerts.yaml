id: sc500-cs1c-ai-threat-alerts
objective: "3.1.8"
type: single
caseStudy: sc500-cs1c-adatum-legal
difficulty: 1
status: draft
stem:
  en: |-
    You need to meet the threat detection requirement for adt-foundry. What should you do in Defender for Cloud?
  fr: |-
    Vous devez satisfaire l'exigence de détection des menaces pour adt-foundry. Que devez-vous faire dans Defender for Cloud ?
body:
  options:
    - { id: a, text: { en: "Turn on the AI services plan for Sub-AI and turn on the Enable user prompt evidence setting of the plan", fr: "Activer le plan AI services pour Sub-AI et activer le paramètre Enable user prompt evidence du plan" } }
    - { id: b, text: { en: "Turn on the AI services plan for Sub-AI and turn on the Data security for AI interactions component of the plan", fr: "Activer le plan AI services pour Sub-AI et activer le composant Data security for AI interactions du plan" } }
    - { id: c, text: { en: "Keep the Defender CSPM plan and review the attack paths that involve adt-foundry", fr: "Conserver le plan Defender CSPM et examiner les chemins d'attaque qui impliquent adt-foundry" } }
    - { id: d, text: { en: "Create a diagnostic setting on adt-foundry that sends its request logs to law-adt-soc", fr: "Créer un paramètre de diagnostic sur adt-foundry qui envoie ses journaux de requêtes vers law-adt-soc" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The AI services plan provides threat protection for Foundry workloads, with alerts for threats such as jailbreak, data leakage and credential theft. Its Suspicious prompt evidence component, enabled by the Enable user prompt evidence setting, adds the suspicious parts of prompts and model responses to the alerts, with sensitive data redacted; without it, the prompt content is masked.
    fr: |-
      Le plan AI services fournit la protection contre les menaces pour les charges de travail Foundry, avec des alertes pour des menaces comme le jailbreak, la fuite de données et le vol d'informations d'identification. Son composant Suspicious prompt evidence, activé par le paramètre Enable user prompt evidence, ajoute aux alertes les parties suspectes des prompts et des réponses du modèle, avec masquage des données sensibles ; sans ce paramètre, le contenu des prompts est masqué.
  options:
    b:
      en: |-
        The Data security for AI interactions component lets Microsoft Purview access prompt and response data for compliance scenarios and requires a Purview license; it does not add prompt evidence to the alerts.
      fr: |-
        Le composant Data security for AI interactions permet à Microsoft Purview d'accéder aux prompts et aux réponses pour des scénarios de conformité et exige une licence Purview ; il n'ajoute pas de preuves de prompts aux alertes.
    c:
      en: |-
        Defender CSPM assesses the security posture; it does not generate real-time threat alerts from prompts.
      fr: |-
        Defender CSPM évalue la posture de sécurité ; il ne génère pas d'alertes de menace en temps réel à partir des prompts.
    d:
      en: |-
        A diagnostic setting only routes logs; nothing analyzes the prompts or raises threat alerts.
      fr: |-
        Un paramètre de diagnostic ne fait qu'acheminer des journaux ; rien n'analyse les prompts ni ne déclenche d'alertes de menace.
references:
  - title: Enable threat protection for AI services
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding
  - title: AI threat protection in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
