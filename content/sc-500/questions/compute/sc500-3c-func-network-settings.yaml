id: sc500-3c-func-network-settings
objective: "3.3.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a function app named **func-inventory** in an Elastic Premium plan. No access restriction rule is configured, and the app's other security settings are at their default values.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une application de fonction nommée **func-inventory** dans un plan Premium élastique. Aucune règle de restriction d'accès n'est configurée, et les autres paramètres de sécurité de l'application ont leur valeur par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "func-inventory currently accepts requests from any IP address."
        fr: "func-inventory accepte actuellement les requêtes provenant de n'importe quelle adresse IP."
    - id: s2
      text:
        en: "Setting `functionsRuntimeAdminIsolationEnabled` to `true` disables the `/admin` endpoints of func-inventory."
        fr: "Définir `functionsRuntimeAdminIsolationEnabled` sur `true` désactive les points de terminaison `/admin` de func-inventory."
    - id: s3
      text:
        en: "You can configure different CORS allowed origins for each function in func-inventory."
        fr: "Vous pouvez configurer des origines autorisées CORS différentes pour chaque fonction de func-inventory."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "When no access restriction rule is defined, a function app accepts traffic from any address. The `functionsRuntimeAdminIsolationEnabled` setting disables the `/admin` routes, which otherwise accept the master key; the same operations remain available through Azure Resource Manager with Azure RBAC. CORS is configured at the function app level, so all the functions share the same allowed origins."
    fr: "Lorsqu'aucune règle de restriction d'accès n'est définie, une application de fonction accepte le trafic de n'importe quelle adresse. Le paramètre `functionsRuntimeAdminIsolationEnabled` désactive les routes `/admin`, qui sinon acceptent la clé principale ; les mêmes opérations restent disponibles via Azure Resource Manager avec Azure RBAC. CORS se configure au niveau de l'application de fonction : toutes les fonctions partagent les mêmes origines autorisées."
references:
  - title: Securing Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/security-concepts
