id: sc500-cs1a-onprem-onboarding
objective: "3.2.5"
type: single
caseStudy: sc500-cs1a-wingtip-energy
difficulty: 2
status: draft
stem:
  en: |-
    You need to onboard the on-premises Windows and Linux servers to meet the server protection requirement. What should you do?
  fr: |-
    Vous devez intégrer les serveurs Windows et Linux locaux pour satisfaire l'exigence de protection des serveurs. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on direct onboarding with Defender for Endpoint in Defender for Cloud and designate Sub-OT", fr: "Activer l'intégration directe avec Defender for Endpoint dans Defender for Cloud et désigner Sub-OT" } }
    - { id: b, text: { en: "Install the Azure Monitor Agent on each server and associate it with a data collection rule in Sub-OT", fr: "Installer l'agent Azure Monitor sur chaque serveur et l'associer à une règle de collecte de données dans Sub-OT" } }
    - { id: c, text: { en: "Install the Azure Connected Machine agent on each server and connect the servers to Sub-OT", fr: "Installer l'agent Azure Connected Machine sur chaque serveur et connecter les serveurs à Sub-OT" } }
    - { id: d, text: { en: "Assign the machine configuration prerequisites initiative of Azure Policy to Sub-OT", fr: "Attribuer à Sub-OT l'initiative Azure Policy des prérequis de la configuration machine" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Azure Connected Machine agent makes each server an Azure Arc-enabled server, which is an Azure resource in Sub-OT. Defender for Servers Plan 2, already enabled on the subscription, then covers these machines, and Azure Policy machine configuration can evaluate them because they are Azure resources.
    fr: |-
      L'agent Azure Connected Machine fait de chaque serveur un serveur avec Azure Arc, c'est-à-dire une ressource Azure dans Sub-OT. Defender for Servers Plan 2, déjà activé sur l'abonnement, couvre alors ces machines, et la configuration machine d'Azure Policy peut les évaluer car ce sont des ressources Azure.
  options:
    a:
      en: |-
        Direct onboarding uses the existing Defender for Endpoint sensor, but it supports only Plan 1 and a subset of Plan 2, and it provides no Azure management capabilities such as Azure Policy or machine configuration.
      fr: |-
        L'intégration directe utilise le capteur Defender for Endpoint existant, mais elle ne prend en charge que le Plan 1 et une partie du Plan 2, et n'apporte aucune fonctionnalité de gestion Azure comme Azure Policy ou la configuration machine.
    b:
      en: |-
        The Azure Monitor Agent collects logs; on a non-Azure machine it requires Azure Arc first, and it does not onboard the server to Defender for Servers.
      fr: |-
        L'agent Azure Monitor collecte des journaux ; sur une machine non Azure, il nécessite d'abord Azure Arc, et il n'intègre pas le serveur à Defender for Servers.
    d:
      en: |-
        Policy assignments apply only to Azure resources. Until the servers are connected to Azure Arc, they are not in Sub-OT and no policy can evaluate them.
      fr: |-
        Les attributions de stratégie ne s'appliquent qu'aux ressources Azure. Tant que les serveurs ne sont pas connectés à Azure Arc, ils ne sont pas dans Sub-OT et aucune stratégie ne peut les évaluer.
references:
  - title: Connect your non-Azure machines to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-machines
  - title: Use Direct onboarding for on-premises servers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/onboard-machines-with-defender-for-endpoint
