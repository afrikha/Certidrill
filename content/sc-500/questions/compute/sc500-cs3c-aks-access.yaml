id: sc500-cs3c-aks-access
objective: "3.3.2"
type: dropdown
caseStudy: sc500-cs3c-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to update aks-claims to meet requirements 2 and 3. You run the following commands.

    How should you complete the commands? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez mettre à jour aks-claims pour satisfaire les exigences 2 et 3. Vous exécutez les commandes suivantes.

    Comment devez-vous compléter les commandes ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template:
    en: |
      # Requirement 2: Azure role assignments authorize the Kubernetes API
      az aks update --resource-group rg-claims --name aks-claims [[authz]]

      # Requirement 2: no static cluster administrator credentials
      az aks update --resource-group rg-claims --name aks-claims [[local]]

      # Requirement 3: Microsoft Entra tokens for claims-api
      az aks update --resource-group rg-claims --name aks-claims [[wi]]
    fr: |
      # Exigence 2 : les attributions de rôles Azure autorisent l'API Kubernetes
      az aks update --resource-group rg-claims --name aks-claims [[authz]]

      # Exigence 2 : aucune information d'identification statique d'administrateur
      az aks update --resource-group rg-claims --name aks-claims [[local]]

      # Exigence 3 : jetons Microsoft Entra pour claims-api
      az aks update --resource-group rg-claims --name aks-claims [[wi]]
  slots:
    - id: authz
      options:
        - { id: aad, text: "--enable-aad" }
        - { id: rbac, text: "--enable-azure-rbac" }
        - { id: local, text: "--disable-local-accounts" }
        - { id: wi, text: "--enable-workload-identity" }
    - id: local
      options:
        - { id: aad, text: "--enable-aad" }
        - { id: rbac, text: "--enable-azure-rbac" }
        - { id: local, text: "--disable-local-accounts" }
        - { id: wi, text: "--enable-workload-identity" }
    - id: wi
      options:
        - { id: mi, text: "--enable-managed-identity" }
        - { id: rbac, text: "--enable-azure-rbac" }
        - { id: local, text: "--disable-local-accounts" }
        - { id: wi, text: "--enable-workload-identity" }
answer:
  values: { authz: rbac, local: local, wi: wi }
explanation:
  correct:
    en: |-
      On a cluster that already has Microsoft Entra integration, --enable-azure-rbac makes Azure role assignments (such as Azure Kubernetes Service RBAC Reader or Writer) authorize the Kubernetes API. --disable-local-accounts makes az aks get-credentials --admin fail, so no static administrator credential can be obtained. --enable-workload-identity, with the OIDC issuer that is already enabled, lets claims-api exchange its service account token for a Microsoft Entra token through a federated identity credential on a managed identity.
    fr: |-
      Sur un cluster qui a déjà l'intégration Microsoft Entra, --enable-azure-rbac fait autoriser l'API Kubernetes par des attributions de rôles Azure (comme Azure Kubernetes Service RBAC Reader ou Writer). --disable-local-accounts fait échouer az aks get-credentials --admin : aucune information d'identification statique d'administrateur ne peut être obtenue. --enable-workload-identity, avec l'émetteur OIDC déjà activé, permet à claims-api d'échanger le jeton de son compte de service contre un jeton Microsoft Entra grâce à des informations d'identification fédérées sur une identité managée.
  options:
    aad:
      en: |-
        Microsoft Entra integration is already enabled; it provides authentication, while authorization stays with Kubernetes RBAC until Azure RBAC is enabled.
      fr: |-
        L'intégration Microsoft Entra est déjà activée ; elle fournit l'authentification, tandis que l'autorisation reste au RBAC Kubernetes tant qu'Azure RBAC n'est pas activé.
    mi:
      en: |-
        --enable-managed-identity sets the identity of the cluster itself; it does not give pods Microsoft Entra tokens.
      fr: |-
        --enable-managed-identity définit l'identité du cluster lui-même ; elle ne donne pas de jetons Microsoft Entra aux pods.
references:
  - title: Use Microsoft Entra ID authorization for the Kubernetes API in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/entra-id-authorization
  - title: Manage local accounts with Microsoft Entra integration
    url: https://learn.microsoft.com/en-us/azure/aks/manage-local-accounts-managed-azure-ad
