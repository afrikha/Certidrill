id: sc500-3b-m365-lifecycle-actions
objective: "3.1.11"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are an AI Administrator for Tailspin Toys. You manage agents from the Agent Registry in the Microsoft 365 admin center. You have the following requirements:

    - A shared Copilot Studio agent became ownerless when its creator left the company. A user named Megan must get full edit rights on it.
    - A retired agent must become unavailable to its maker and to users, but you must be able to bring it back with its configuration during the next weeks.
    - A Microsoft Foundry agent deployment must stop consuming Azure compute resources.
    - A user submitted an agent and asked for it to be available to the Sales group from the Agent Store.

    Which action should you use for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes AI Administrator chez Tailspin Toys. Vous gérez les agents depuis le registre des agents (Agent Registry) du Centre d'administration Microsoft 365. Vous avez les exigences suivantes :

    - Un agent Copilot Studio partagé n'a plus de propriétaire depuis le départ de son créateur. Une utilisatrice nommée Megan doit obtenir tous les droits de modification sur cet agent.
    - Un agent retiré doit devenir indisponible pour son créateur et pour les utilisateurs, mais vous devez pouvoir le rétablir avec sa configuration au cours des prochaines semaines.
    - Le déploiement d'un agent Microsoft Foundry doit cesser de consommer des ressources de calcul Azure.
    - Un utilisateur a soumis un agent et a demandé qu'il soit disponible pour le groupe Sales depuis l'Agent Store.

    Quelle action devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: owner, text: Assign new owner }
    - { id: delete, text: Delete }
    - { id: stop, text: Stop }
    - { id: publish, text: Publish to store }
    - { id: block, text: Block }
    - { id: uninstall, text: Uninstall }
  targets:
    - { id: t1, text: { en: "Give Megan full edit rights on the ownerless agent", fr: "Donner à Megan tous les droits de modification sur l'agent sans propriétaire" } }
    - { id: t2, text: { en: "Make the retired agent unavailable while keeping it recoverable", fr: "Rendre l'agent retiré indisponible tout en le gardant récupérable" } }
    - { id: t3, text: { en: "Stop the Foundry agent deployment from consuming compute", fr: "Empêcher le déploiement de l'agent Foundry de consommer du calcul" } }
    - { id: t4, text: { en: "Make the submitted agent available to the Sales group", fr: "Rendre l'agent soumis disponible pour le groupe Sales" } }
answer:
  mapping: { t1: owner, t2: delete, t3: stop, t4: publish }
explanation:
  correct:
    en: |
      Assign new owner reassigns shared Agent Builder and Copilot Studio agents and gives the new owner full edit and delete permissions. Delete is a soft delete that makes the agent unavailable to its maker and users and keeps it restorable for 30 days. Stop deallocates the Azure compute of a Foundry agent deployment (it requires the Azure AI Owner role). Publish to store, from the Requests page, makes a submitted agent installable by the audience you select.
    fr: |
      Assign new owner réattribue les agents partagés Agent Builder et Copilot Studio et donne au nouveau propriétaire tous les droits de modification et de suppression. Delete est une suppression réversible qui rend l'agent indisponible pour son créateur et les utilisateurs et le garde restaurable pendant 30 jours. Stop libère le calcul Azure d'un déploiement d'agent Foundry (il exige le rôle Azure AI Owner). Publish to store, depuis la page Requests, rend un agent soumis installable par l'audience que vous choisissez.
  options:
    block: { en: "Block restricts availability across the organization, but the maker keeps the agent and nothing is deallocated.", fr: "Block restreint la disponibilité dans l'organisation, mais le créateur conserve l'agent et rien n'est libéré." }
    uninstall: { en: "Uninstall removes an installed agent from users; it doesn't publish, reassign or deallocate anything.", fr: "Uninstall retire un agent installé aux utilisateurs ; il ne publie, ne réattribue et ne libère rien." }
references:
  - title: Governance and Lifecycle actions for agents available in Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions
  - title: Manage agent requests in Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-requests
