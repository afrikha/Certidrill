id: sc500-3b-mc-assignment-modes
objective: "3.2.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Azure Machine Configuration on its Azure VMs and Azure Arc-enabled servers. The security team defines three custom configurations with the following requirements:

    - **Config1** (local password policy): only report whether the machines are compliant, without changing them.
    - **Config2** (SSH daemon settings): apply the settings, and bring the machines back into conformance automatically if an administrator changes them.
    - **Config3** (TLS registry settings): apply the settings, and then only report later changes, without reverting them.

    Which mode should you use for each configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Azure Machine Configuration sur ses machines virtuelles Azure et ses serveurs avec Azure Arc. L'équipe de sécurité définit trois configurations personnalisées avec les exigences suivantes :

    - **Config1** (stratégie de mot de passe locale) : uniquement signaler si les machines sont conformes, sans les modifier.
    - **Config2** (paramètres du démon SSH) : appliquer les paramètres, et ramener automatiquement les machines à la conformité si un administrateur les modifie.
    - **Config3** (paramètres de Registre TLS) : appliquer les paramètres, puis uniquement signaler les modifications ultérieures, sans les annuler.

    Quel mode devez-vous utiliser pour chaque configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Config1: [[c1]]

      Config2: [[c2]]

      Config3: [[c3]]
    fr: |
      Config1 : [[c1]]

      Config2 : [[c2]]

      Config3 : [[c3]]
  slots:
    - id: c1
      options:
        - { id: audit, text: Audit }
        - { id: monitor, text: Apply and Monitor }
        - { id: auto, text: Apply and Autocorrect }
    - id: c2
      options:
        - { id: audit, text: Audit }
        - { id: monitor, text: Apply and Monitor }
        - { id: auto, text: Apply and Autocorrect }
    - id: c3
      options:
        - { id: audit, text: Audit }
        - { id: monitor, text: Apply and Monitor }
        - { id: auto, text: Apply and Autocorrect }
answer:
  values: { c1: audit, c2: auto, c3: monitor }
explanation:
  correct:
    en: |
      Audit only reports on the state of the machine. Apply and Monitor applies the configuration and then monitors it for changes without correcting drift. Apply and Autocorrect applies the configuration and brings the machine back into conformance if drift occurs.
    fr: |
      Audit se contente de signaler l'état de la machine. Apply and Monitor applique la configuration puis la surveille pour détecter les modifications, sans corriger la dérive. Apply and Autocorrect applique la configuration et ramène la machine à la conformité en cas de dérive.
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
