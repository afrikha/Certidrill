id: sc500-3c-aca-ingress-env
objective: "3.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind is deploying two container apps to a new Azure Container Apps environment named **env-hr**, which will be integrated into a subnet of a virtual network named **VNet1**. VNet1 is connected to the on-premises network by a site-to-site VPN.

    - **hr-portal** must be reachable by users on the on-premises network, but not from the internet.
    - **hr-api** must be reachable only by hr-portal. Clients in VNet1 and on-premises must not reach hr-api directly.

    How should you configure the environment and the apps? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind déploie deux applications conteneur dans un nouvel environnement Azure Container Apps nommé **env-hr**, qui sera intégré à un sous-réseau d'un réseau virtuel nommé **VNet1**. VNet1 est connecté au réseau local par un VPN site à site.

    - **hr-portal** doit être accessible aux utilisateurs du réseau local, mais pas depuis Internet.
    - **hr-api** ne doit être accessible que par hr-portal. Les clients de VNet1 et du réseau local ne doivent pas joindre hr-api directement.

    Comment devez-vous configurer l'environnement et les applications ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      env-hr: create [[env]].
      hr-portal: set ingress to [[portal]].
      hr-api: set ingress to [[api]].
    fr: |
      env-hr : créer [[env]].
      hr-portal : définir l'entrée (ingress) sur [[portal]].
      hr-api : définir l'entrée (ingress) sur [[api]].
  slots:
    - id: env
      options:
        - { id: internal, text: { en: "an internal environment (--internal-only true)", fr: "un environnement interne (--internal-only true)" } }
        - { id: external, text: { en: "an external environment", fr: "un environnement externe" } }
        - { id: novnet, text: { en: "an environment without a custom virtual network", fr: "un environnement sans réseau virtuel personnalisé" } }
    - id: portal
      options:
        - { id: ext, text: { en: "External", fr: "External (externe)" } }
        - { id: int, text: { en: "Internal", fr: "Internal (interne)" } }
        - { id: off, text: { en: "Disabled", fr: "Désactivée" } }
    - id: api
      options:
        - { id: aext, text: { en: "External", fr: "External (externe)" } }
        - { id: aint, text: { en: "Internal", fr: "Internal (interne)" } }
        - { id: aoff, text: { en: "Disabled", fr: "Désactivée" } }
answer:
  values: { env: internal, portal: ext, api: aint }
explanation:
  correct:
    en: "The environment's accessibility level and each app's ingress are separate settings. In an internal environment, an app with external ingress is published on the environment's internal load balancer, so clients in the connected virtual network (and on-premises through the VPN) can reach it, but the internet cannot. Internal ingress makes hr-api reachable only from apps in the same environment."
    fr: "Le niveau d'accessibilité de l'environnement et l'entrée de chaque application sont des paramètres distincts. Dans un environnement interne, une application dont l'entrée est externe est publiée sur l'équilibreur de charge interne de l'environnement : les clients du réseau virtuel connecté (et du réseau local via le VPN) peuvent la joindre, mais pas Internet. L'entrée interne rend hr-api accessible uniquement depuis les applications du même environnement."
  options:
    external: { en: "In an external environment, an app with external ingress is reachable from the internet.", fr: "Dans un environnement externe, une application dont l'entrée est externe est accessible depuis Internet." }
    novnet: { en: "An internal environment requires a custom virtual network; without one, the environment is external.", fr: "Un environnement interne nécessite un réseau virtuel personnalisé ; sans lui, l'environnement est externe." }
    int: { en: "Internal ingress on hr-portal would make it reachable only from other apps in env-hr, not from on-premises users.", fr: "Une entrée interne sur hr-portal ne la rendrait accessible qu'aux autres applications d'env-hr, pas aux utilisateurs du réseau local." }
    off: { en: "Without ingress, the app receives no HTTP traffic at all.", fr: "Sans entrée, l'application ne reçoit aucun trafic HTTP." }
    aext: { en: "External ingress on hr-api would publish it on the internal load balancer, reachable from VNet1 and on-premises.", fr: "Une entrée externe sur hr-api la publierait sur l'équilibreur de charge interne, accessible depuis VNet1 et le réseau local." }
references:
  - title: Ingress in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/ingress-overview
