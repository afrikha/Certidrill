id: sc500-3c-aci-secure-env
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso deploys a container group named **cg-reports** to Azure Container Instances by using a YAML file and the `az container create --file` command. The container needs a database password at startup.

    You need to pass the password to the container as an environment variable. The value must not be displayed in the Azure portal or in the output of `az container show`.

    What should you do?
  fr: |
    Contoso déploie un groupe de conteneurs nommé **cg-reports** dans Azure Container Instances à l'aide d'un fichier YAML et de la commande `az container create --file`. Le conteneur a besoin d'un mot de passe de base de données au démarrage.

    Vous devez transmettre le mot de passe au conteneur sous forme de variable d'environnement. La valeur ne doit être affichée ni dans le portail Azure ni dans la sortie de `az container show`.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Encode the password in Base64 and set it in the `value` property.", fr: "Encoder le mot de passe en Base64 et le définir dans la propriété `value`." } }
    - { id: b, text: { en: "Set the password in the `secureValue` property instead of `value`.", fr: "Définir le mot de passe dans la propriété `secureValue` au lieu de `value`." } }
    - { id: c, text: { en: "Pass the password as an argument in the `command` property.", fr: "Transmettre le mot de passe comme argument dans la propriété `command`." } }
    - { id: d, text: { en: "Add the password as an Azure tag on the container group.", fr: "Ajouter le mot de passe comme étiquette Azure du groupe de conteneurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An environment variable defined with `secureValue` is available to processes inside the container, but its value is not visible in the container's properties. The portal and `az container show` display only its name."
    fr: "Une variable d'environnement définie avec `secureValue` est disponible pour les processus du conteneur, mais sa valeur n'apparaît pas dans les propriétés du conteneur. Le portail et `az container show` n'affichent que son nom."
  options:
    a:
      en: "Base64 is an encoding, not encryption, and a `value` property is displayed in the container properties."
      fr: "Base64 est un encodage, pas un chiffrement, et une propriété `value` est affichée dans les propriétés du conteneur."
    c:
      en: "The command line is part of the container definition and is visible to anyone who can read the resource."
      fr: "La ligne de commande fait partie de la définition du conteneur et est visible par toute personne qui peut lire la ressource."
    d:
      en: "Tags are metadata visible to anyone who can read the resource, and they are not passed to the container."
      fr: "Les étiquettes sont des métadonnées visibles par toute personne qui peut lire la ressource, et elles ne sont pas transmises au conteneur."
references:
  - title: Set environment variables in container instances
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-environment-variables
