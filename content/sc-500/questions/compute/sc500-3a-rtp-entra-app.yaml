id: sc500-3a-rtp-entra-app
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is connecting a custom runtime threat detection service to its Copilot Studio agents. You decide to create the required Microsoft Entra application manually in the Azure portal instead of using the provided PowerShell script.

    You need to configure the application so that you can save the threat detection configuration in the Power Platform admin center.

    Which two settings should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. connecte un service personnalisé de détection des menaces à l'exécution à ses agents Copilot Studio. Vous décidez de créer manuellement l'application Microsoft Entra requise dans le portail Azure au lieu d'utiliser le script PowerShell fourni.

    Vous devez configurer l'application pour pouvoir enregistrer la configuration de détection des menaces dans le Centre d'administration Power Platform.

    Quels sont les deux paramètres à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Supported account types: multitenant, accounts in any Microsoft Entra tenant", fr: "Supported account types : multilocataire, comptes de n'importe quel locataire Microsoft Entra" } }
    - { id: b, text: { en: "Supported account types: single tenant, accounts in this organizational directory only", fr: "Supported account types : monolocataire, comptes de cet annuaire organisationnel uniquement" } }
    - { id: c, text: { en: "Certificates & secrets: a client secret shared with the provider", fr: "Certificates & secrets : une clé secrète client partagée avec le fournisseur" } }
    - { id: d, text: { en: "Certificates & secrets: a federated credential with the Other issuer scenario and an explicit subject identifier", fr: "Certificates & secrets : des informations d'identification fédérées avec le scénario Other issuer et un identificateur de sujet explicite" } }
    - { id: e, text: { en: "API permissions: the Microsoft Graph application permission Application.ReadWrite.All", fr: "API permissions : l'autorisation d'application Microsoft Graph Application.ReadWrite.All" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The manual procedure registers the application with Accounts in this organizational directory only (Single tenant) and then adds a federated credential: scenario Other issuer, issuer https://login.microsoftonline.com/{tenantId}/v2.0, type Explicit subject identifier, and a subject value built from the encoded tenant ID and endpoint. The App ID is then entered in the Power Platform admin center.
    fr: |
      La procédure manuelle inscrit l'application avec Accounts in this organizational directory only (Single tenant), puis ajoute des informations d'identification fédérées : scénario Other issuer, émetteur https://login.microsoftonline.com/{tenantId}/v2.0, type Explicit subject identifier et une valeur de sujet construite à partir de l'ID de locataire et du point de terminaison encodés. L'App ID est ensuite saisi dans le Centre d'administration Power Platform.
  options:
    a:
      en: |
        The procedure uses a single-tenant application, not a multitenant one.
      fr: |
        La procédure utilise une application monolocataire, pas multilocataire.
    c:
      en: |
        The application authenticates with a federated identity credential; missing federated credentials cause the AADSTS70025 error when you save.
      fr: |
        L'application s'authentifie avec des informations d'identification fédérées ; leur absence provoque l'erreur AADSTS70025 à l'enregistrement.
    e:
      en: |
        No Microsoft Graph application permission is part of the procedure; the application only identifies the trusted connection to the provider.
      fr: |
        Aucune autorisation d'application Microsoft Graph ne fait partie de la procédure ; l'application identifie seulement la connexion approuvée avec le fournisseur.
references:
  - title: Enable external threat detection and protection for Copilot Studio custom agents (preview)
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/external-security-provider
