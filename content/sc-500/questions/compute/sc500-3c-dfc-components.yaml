id: sc500-3c-dfc-components
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure subscription that contains an AKS cluster named **aks-shop** and an Azure container registry named **acrshop**. The Defender for Containers plan is enabled on the subscription. In the plan settings, only **Kubernetes API access** is turned on.

    You need to meet the following requirements:

    - Images pushed to acrshop must be assessed for vulnerabilities.
    - Defender for Cloud must generate Kubernetes data plane hardening recommendations for aks-shop, such as the recommendation that flags privileged containers.

    The solution must not deploy any component that is not required.

    Which two components should you turn on? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un abonnement Azure qui contient un cluster AKS nommé **aks-shop** et un registre de conteneurs Azure nommé **acrshop**. Le plan Defender for Containers est activé sur l'abonnement. Dans les paramètres du plan, seul **Kubernetes API access** est activé.

    Vous devez répondre aux exigences suivantes :

    - Les images envoyées vers acrshop doivent faire l'objet d'une évaluation des vulnérabilités.
    - Defender for Cloud doit générer pour aks-shop les recommandations de renforcement du plan de données Kubernetes, comme la recommandation qui signale les conteneurs privilégiés.

    La solution ne doit déployer aucun composant non nécessaire.

    Quels sont les deux composants à activer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Defender sensor", fr: "Defender sensor" } }
    - { id: b, text: { en: "Registry access", fr: "Registry access" } }
    - { id: c, text: { en: "Agentless scanning for machines", fr: "Agentless scanning for machines" } }
    - { id: d, text: { en: "Azure Policy", fr: "Azure Policy" } }
    - { id: e, text: { en: "Enable Defender Runtime Anti Malware", fr: "Enable Defender Runtime Anti Malware" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: "Registry access enables the agentless vulnerability assessment of images stored in connected registries such as acrshop. The Azure Policy component deploys the Azure Policy for Kubernetes add-on, which evaluates API server requests against hardening best practices and produces the data plane recommendations, including the one about privileged containers."
    fr: "Registry access active l'évaluation des vulnérabilités sans agent des images stockées dans les registres connectés, comme acrshop. Le composant Azure Policy déploie le module complémentaire Azure Policy pour Kubernetes, qui évalue les requêtes adressées au serveur d'API par rapport aux bonnes pratiques de renforcement et produit les recommandations du plan de données, dont celle sur les conteneurs privilégiés."
  options:
    a:
      en: "The Defender sensor provides runtime threat detection on the nodes. Neither requirement needs runtime telemetry."
      fr: "Le capteur Defender fournit la détection des menaces à l'exécution sur les nœuds. Aucune des exigences ne nécessite de télémétrie d'exécution."
    c:
      en: "Agentless scanning for machines scans the cluster nodes, not the images in the registry, and it does not produce hardening recommendations."
      fr: "Agentless scanning for machines analyse les nœuds du cluster, pas les images du registre, et ne produit pas de recommandations de renforcement."
    e:
      en: "Runtime antimalware is an option of the Defender sensor that detects malware at runtime. It is not required here."
      fr: "L'antimalware d'exécution est une option du capteur Defender qui détecte les programmes malveillants à l'exécution. Il n'est pas nécessaire ici."
references:
  - title: Enable Defender for Containers in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-enable-plan
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
