id: sc500-3a-gr-create-order
objective: "3.1.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Microsoft Foundry project that contains an agent named **ResearchAgent**. ResearchAgent currently uses the guardrail of its model deployment. You have the Foundry Account Owner role.

    You need to protect ResearchAgent against prompt injection hidden in the content returned by its Bing grounding tool. The guardrail of the model deployment must not change.

    Which four actions should you perform in sequence in the Foundry portal? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. dispose d'un projet Microsoft Foundry qui contient un agent nommé **ResearchAgent**. ResearchAgent utilise actuellement le garde-fou de son déploiement de modèle. Vous disposez du rôle Foundry Account Owner.

    Vous devez protéger ResearchAgent contre les injections de prompt cachées dans le contenu renvoyé par son outil Bing grounding. Le garde-fou du déploiement de modèle ne doit pas changer.

    Quelles sont les quatre actions à effectuer dans l'ordre dans le portail Foundry ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Select Build, open the Guardrails page, and select Create Guardrail.", fr: "Sélectionner Build, ouvrir la page Guardrails, puis sélectionner Create Guardrail." } }
    - { id: control, text: { en: "Select the Indirect attacks risk, the Tool response intervention point and the Annotate and block action, and then select Add control.", fr: "Sélectionner le risque Indirect attacks, le point d'intervention Tool response et l'action Annotate and block, puis sélectionner Add control." } }
    - { id: assign, text: { en: "Select Next, select Add agents, select ResearchAgent, and then select Save.", fr: "Sélectionner Next, sélectionner Add agents, sélectionner ResearchAgent, puis Save." } }
    - { id: create, text: { en: "Select Next, review the controls and assignments, name the guardrail, and then select Create.", fr: "Sélectionner Next, vérifier les contrôles et les affectations, nommer le garde-fou, puis sélectionner Create." } }
    - { id: upia, text: { en: "Select the User prompt attacks risk at the User input intervention point, and then select Add control.", fr: "Sélectionner le risque User prompt attacks au point d'intervention User input, puis sélectionner Add control." } }
    - { id: models, text: { en: "Select Add models and select the model deployment of ResearchAgent.", fr: "Sélectionner Add models et sélectionner le déploiement de modèle de ResearchAgent." } }
answer:
  sequence: [ open, control, assign, create ]
explanation:
  correct:
    en: |
      The guardrail wizard starts from Build > Guardrails > Create Guardrail. Step 1 adds controls: prompt injection hidden in tool output is the Indirect attacks risk, scanned at the Tool response point, and agents use Annotate and block. Step 2 assigns the guardrail to agents and/or models, and step 3 reviews, names and creates it. Bing grounding supports tool moderation, and the agent's guardrail overrides the model's guardrail for that agent only.
    fr: |
      L'assistant de garde-fou démarre depuis Build > Guardrails > Create Guardrail. L'étape 1 ajoute les contrôles : une injection de prompt cachée dans la sortie d'un outil correspond au risque Indirect attacks, analysé au point Tool response, et les agents utilisent Annotate and block. L'étape 2 affecte le garde-fou à des agents et/ou des modèles, et l'étape 3 permet de vérifier, nommer et créer le garde-fou. Bing grounding prend en charge la modération des outils, et le garde-fou de l'agent remplace celui du modèle pour cet agent uniquement.
  options:
    upia:
      en: |
        User prompt attacks detect jailbreak attempts in the user input, not instructions hidden in tool responses.
      fr: |
        User prompt attacks détecte les tentatives de jailbreak dans l'entrée utilisateur, pas les instructions cachées dans les réponses des outils.
    models:
      en: |
        Assigning the guardrail to the model deployment would change the model's guardrail, which the requirement forbids.
      fr: |
        Affecter le garde-fou au déploiement de modèle modifierait le garde-fou du modèle, ce que l'exigence interdit.
references:
  - title: How to configure guardrails and controls in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/how-to-create-guardrails
  - title: Intervention points
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
