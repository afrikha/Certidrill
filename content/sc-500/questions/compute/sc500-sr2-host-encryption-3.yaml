id: sc500-sr2-host-encryption-3
objective: "3.2.1"
type: series_yesno
series: sc500-sr2-host-encryption
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You enable Azure Disk Encryption on VM1 with key1 as the key encryption key.
  fr: Vous activez Azure Disk Encryption sur VM1 avec key1 comme clé de chiffrement de clé.
body:
  solution:
    en: You enable **Azure Disk Encryption** on VM1 for all the disks, with KV1 as the key vault and key1 as the key encryption key (KEK).
    fr: Vous activez **Azure Disk Encryption** sur VM1 pour tous les disques, avec KV1 comme coffre de clés et key1 comme clé de chiffrement de clé (KEK).
answer: { value: false }
explanation:
  correct:
    en: Azure Disk Encryption encrypts the volumes inside the guest with BitLocker, so it uses the CPU of VM1, which breaks the last requirement. It is also scheduled for retirement on September 15, 2028, and Microsoft recommends encryption at host instead.
    fr: "Azure Disk Encryption chiffre les volumes dans l'invité avec BitLocker : il utilise le processeur de VM1, ce qui enfreint la dernière exigence. Sa mise hors service est en outre prévue le 15 septembre 2028, et Microsoft recommande plutôt le chiffrement sur l'hôte."
references:
  - title: Overview of managed disk encryption options - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
