id: sc500-3c-func-entra-auth
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a function app named **func-hr** that hosts HTTP-triggered functions with the `function` authorization level. Employees call the functions from an internal web application, which embeds a host key.

    You need to ensure that only signed-in users from the Contoso Microsoft Entra tenant can call the functions, and that every call can be tied to the identity of the user. The solution must minimize development effort.

    What should you do?
  fr: |
    Contoso dispose d'une application de fonction nommée **func-hr** qui héberge des fonctions déclenchées par HTTP avec le niveau d'autorisation `function`. Les employés appellent les fonctions depuis une application web interne, qui intègre une clé d'hôte.

    Vous devez vous assurer que seuls les utilisateurs connectés du locataire Microsoft Entra de Contoso peuvent appeler les fonctions, et que chaque appel peut être rattaché à l'identité de l'utilisateur. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the authorization level to `admin` and give the web app the master key.", fr: "Définir le niveau d'autorisation sur `admin` et fournir la clé principale à l'application web." } }
    - { id: b, text: { en: "Store the host key in Azure Key Vault and rotate it every 30 days.", fr: "Stocker la clé d'hôte dans Azure Key Vault et la renouveler tous les 30 jours." } }
    - { id: c, text: { en: "Restrict the CORS allowed origins to the URL of the web application.", fr: "Limiter les origines autorisées CORS à l'URL de l'application web." } }
    - { id: d, text: { en: "Enable App Service authentication with the Microsoft Entra identity provider.", fr: "Activer l'authentification App Service avec le fournisseur d'identité Microsoft Entra." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Access keys are shared secrets that offer only basic protection and say nothing about who is calling. App Service authentication with Microsoft Entra ID authenticates each caller before the request reaches the function code, without code changes, and makes the user's identity available to the app."
    fr: "Les clés d'accès sont des secrets partagés qui n'offrent qu'une protection basique et n'indiquent pas qui appelle. L'authentification App Service avec Microsoft Entra ID authentifie chaque appelant avant que la requête n'atteigne le code de la fonction, sans modifier le code, et met l'identité de l'utilisateur à la disposition de l'application."
  options:
    a:
      en: "The master key grants administrative access to the runtime APIs and must not be distributed; it still identifies no user."
      fr: "La clé principale accorde un accès administratif aux API du runtime et ne doit pas être distribuée ; elle n'identifie toujours aucun utilisateur."
    b:
      en: "Rotation limits the exposure of the key, but a key remains a shared secret that does not identify the caller."
      fr: "Le renouvellement limite l'exposition de la clé, mais une clé reste un secret partagé qui n'identifie pas l'appelant."
    c:
      en: "CORS only tells browsers which origins may call the API; it does not authenticate anyone."
      fr: "CORS indique seulement aux navigateurs quelles origines peuvent appeler l'API ; il n'authentifie personne."
references:
  - title: Securing Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/security-concepts
  - title: Work with access keys in Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/function-keys-how-to
