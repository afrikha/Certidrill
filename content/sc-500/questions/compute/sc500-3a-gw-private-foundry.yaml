id: sc500-3a-gw-private-foundry
objective: "3.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has a Microsoft Foundry resource named **foundry-sec** in the subscription **Sub1**. Public network access is disabled on foundry-sec. You need to add an AI Gateway to foundry-sec by using an existing Azure API Management instance in Sub1.

    Which two API Management configurations can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'une ressource Microsoft Foundry nommée **foundry-sec** dans l'abonnement **Sub1**. L'accès réseau public est désactivé sur foundry-sec. Vous devez ajouter une passerelle AI Gateway à foundry-sec à l'aide d'une instance Gestion des API Azure existante dans Sub1.

    Quelles sont les deux configurations de Gestion des API que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Standard v2 instance with a private endpoint", fr: "Une instance Standard v2 avec un point de terminaison privé" } }
    - { id: b, text: { en: "A Premium v2 instance injected into a virtual network", fr: "Une instance Premium v2 injectée dans un réseau virtuel" } }
    - { id: c, text: { en: "A Basic v2 instance with public network access", fr: "Une instance Basic v2 avec accès réseau public" } }
    - { id: d, text: { en: "A Developer instance injected into a virtual network", fr: "Une instance Developer injectée dans un réseau virtuel" } }
    - { id: e, text: { en: "A Standard v2 instance with public network access", fr: "Une instance Standard v2 avec accès réseau public" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      When public network access is disabled on the Foundry resource, the API Management instance must also be privately accessible: Standard v2 or Premium v2 with a private endpoint, or Premium v2 injected into a virtual network. An existing instance must also use a v2 tier to appear in the Use existing list.
    fr: |
      Quand l'accès réseau public est désactivé sur la ressource Foundry, l'instance Gestion des API doit elle aussi être accessible de façon privée : Standard v2 ou Premium v2 avec un point de terminaison privé, ou Premium v2 injectée dans un réseau virtuel. Une instance existante doit en outre utiliser un niveau v2 pour apparaître dans la liste Use existing.
  options:
    c:
      en: |
        An instance that is only publicly accessible doesn't meet the private access requirement of a Foundry resource without public network access.
      fr: |
        Une instance accessible uniquement de façon publique ne respecte pas l'exigence d'accès privé d'une ressource Foundry sans accès réseau public.
    d:
      en: |
        Developer is a classic tier; only v2 instances appear in the Use existing list.
      fr: |
        Developer est un niveau classique ; seules les instances v2 apparaissent dans la liste Use existing.
    e:
      en: |
        Standard v2 is supported only with a private endpoint when the Foundry resource has no public network access.
      fr: |
        Standard v2 n'est pris en charge qu'avec un point de terminaison privé quand la ressource Foundry n'a pas d'accès réseau public.
references:
  - title: Configure AI Gateway in your Foundry resources
    url: https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal
