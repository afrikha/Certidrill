id: sc500-3a-gw-private-foundry
objective: "3.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has a Microsoft Foundry resource named **foundry-sec**. An Azure API Management instance named **apim-sec** (Standard v2) publishes the model deployments of foundry-sec as LLM APIs. A diagnostic setting on apim-sec sends **Logs related to ApiManagement Gateway** to a Log Analytics workspace.

    You have the following requirements:

    - Prompts that contain a jailbreak attempt must be rejected by apim-sec before they reach foundry-sec.
    - Auditors must find the full text of every prompt and completion in the workspace. Some completions are larger than 20 KB.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'une ressource Microsoft Foundry nommée **foundry-sec**. Une instance Gestion des API Azure nommée **apim-sec** (Standard v2) publie les déploiements de modèles de foundry-sec sous forme d'API LLM. Un paramètre de diagnostic d'apim-sec envoie **Logs related to ApiManagement Gateway** vers un espace de travail Log Analytics.

    Vous avez les exigences suivantes :

    - Les invites qui contiennent une tentative de jailbreak doivent être rejetées par apim-sec avant d'atteindre foundry-sec.
    - Les auditeurs doivent trouver dans l'espace de travail le texte complet de chaque invite et de chaque complétion. Certaines complétions dépassent 20 Ko.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an llm-content-safety policy with shield-prompt set to true to the inbound section of the LLM APIs.", fr: "Ajouter une stratégie llm-content-safety avec shield-prompt à true à la section inbound des API LLM." } }
    - { id: b, text: { en: "Add Logs related to generative AI gateway to the diagnostic setting, and enable message logging on the LLM APIs.", fr: "Ajouter Logs related to generative AI gateway au paramètre de diagnostic, et activer la journalisation des messages sur les API LLM." } }
    - { id: c, text: { en: "Enable request and response body logging on the LLM APIs for the existing gateway log category.", fr: "Activer la journalisation des corps de requête et de réponse sur les API LLM pour la catégorie de journaux de passerelle existante." } }
    - { id: d, text: { en: "Turn on Defender for AI services with user prompt evidence for the subscription of foundry-sec.", fr: "Activer Defender for AI services avec les preuves d'invite utilisateur pour l'abonnement de foundry-sec." } }
    - { id: e, text: { en: "Add an llm-emit-token-metric policy with a dimension for the API ID to the LLM APIs.", fr: "Ajouter une stratégie llm-emit-token-metric avec une dimension pour l'ID d'API aux API LLM." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The llm-content-safety policy sends each prompt to Azure AI Content Safety, and with shield-prompt set to true it also checks for prompt attacks; flagged requests get a 403 response and never reach the backend. The Logs related to generative AI gateway category records LLM requests with token usage and, once message logging is enabled on the APIs, the prompts and completions; messages larger than 32 KB are split into 32 KB chunks with sequence numbers.
    fr: |
      La stratégie llm-content-safety envoie chaque invite à Azure AI Content Safety et, avec shield-prompt à true, détecte aussi les attaques par invite ; les requêtes signalées reçoivent une réponse 403 et n'atteignent jamais le back-end. La catégorie Logs related to generative AI gateway enregistre les requêtes LLM avec leur consommation de jetons et, une fois la journalisation des messages activée sur les API, les invites et les complétions ; les messages de plus de 32 Ko sont découpés en blocs de 32 Ko numérotés.
  options:
    c:
      en: |
        Bodies logged in the gateway log category are limited to 8,192 bytes each, so completions larger than 20 KB would be truncated.
      fr: |
        Les corps journalisés dans la catégorie de journaux de passerelle sont limités à 8 192 octets chacun : les complétions de plus de 20 Ko seraient tronquées.
    d:
      en: |
        Defender for AI services detects jailbreak attempts and raises alerts, but it doesn't reject the request, and prompt evidence only adds the suspicious segments to the alerts.
      fr: |
        Defender for AI services détecte les tentatives de jailbreak et déclenche des alertes, mais ne rejette pas la requête, et les preuves d'invite ajoutent seulement les segments suspects aux alertes.
    e:
      en: |
        llm-emit-token-metric sends token counts to Azure Monitor metrics; it records neither the prompt text nor the completion text.
      fr: |
        llm-emit-token-metric envoie des nombres de jetons vers les métriques Azure Monitor ; elle n'enregistre ni le texte des invites ni celui des complétions.
references:
  - title: Azure API Management policy reference - llm-content-safety
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
  - title: Monitor Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/monitor-api-management
