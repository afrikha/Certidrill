id: sc500-3a-d4ai-coverage
objective: "3.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank enables threat protection for AI services on every subscription and connected cloud account where it is available. The bank runs the generative AI workloads shown in the following table.

    | Workload | Location | Input sent to the model |
    | --- | --- | --- |
    | W1 | Azure OpenAI deployment in a commercial Azure subscription | Text chat prompts |
    | W2 | Amazon Bedrock model in a connected AWS account | Text chat prompts |
    | W3 | Azure AI Model Inference deployment in a commercial Azure subscription | Text chat prompts |
    | W4 | Azure OpenAI deployment in an Azure Government subscription | Text chat prompts |
    | W5 | Azure OpenAI deployment in a commercial Azure subscription | Audio recordings only |

    Which two workloads can generate threat protection alerts for their prompts?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank active la protection contre les menaces pour les services d'IA sur chaque abonnement et chaque compte cloud connecté où elle est disponible. La banque exécute les charges de travail d'IA générative présentées dans le tableau suivant.

    | Charge de travail | Emplacement | Entrée envoyée au modèle |
    | --- | --- | --- |
    | W1 | Déploiement Azure OpenAI dans un abonnement Azure commercial | Prompts de conversation textuels |
    | W2 | Modèle Amazon Bedrock dans un compte AWS connecté | Prompts de conversation textuels |
    | W3 | Déploiement Azure AI Model Inference dans un abonnement Azure commercial | Prompts de conversation textuels |
    | W4 | Déploiement Azure OpenAI dans un abonnement Azure Government | Prompts de conversation textuels |
    | W5 | Déploiement Azure OpenAI dans un abonnement Azure commercial | Enregistrements audio uniquement |

    Quelles sont les deux charges de travail qui peuvent générer des alertes de protection contre les menaces pour leurs prompts ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: w1, text: W1 }
    - { id: w2, text: W2 }
    - { id: w3, text: W3 }
    - { id: w4, text: W4 }
    - { id: w5, text: W5 }
answer: { optionIds: [ w1, w3 ] }
explanation:
  correct:
    en: |
      Threat protection for AI services supports Azure OpenAI models and Azure AI Model Inference service models in commercial clouds, and it scans text tokens. W1 and W3 meet these conditions.
    fr: |
      La protection contre les menaces pour les services d'IA prend en charge les modèles Azure OpenAI et les modèles du service Azure AI Model Inference dans les clouds commerciaux, et elle analyse les jetons texte. W1 et W3 remplissent ces conditions.
  options:
    w2:
      en: |
        Connected AWS accounts aren't supported by threat protection for AI services.
      fr: |
        Les comptes AWS connectés ne sont pas pris en charge par la protection contre les menaces pour les services d'IA.
    w4:
      en: |
        Azure Government isn't supported; the plan is available in commercial clouds.
      fr: |
        Azure Government n'est pas pris en charge ; le plan est disponible dans les clouds commerciaux.
    w5:
      en: |
        Only text tokens are scanned; image and audio tokens aren't.
      fr: |
        Seuls les jetons texte sont analysés ; les jetons image et audio ne le sont pas.
references:
  - title: AI threat protection in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
