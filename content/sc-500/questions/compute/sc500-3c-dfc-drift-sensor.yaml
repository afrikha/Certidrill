id: sc500-3c-dfc-drift-sensor
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure subscription named **Sub1** that contains an Azure Kubernetes Service (AKS) cluster named **aks-prod**. The Defender for Containers plan is enabled on Sub1 with only the **Kubernetes API access** and **Registry access** components turned on.

    You need to receive security alerts when a process that is not part of the original container image starts running in a container on aks-prod.

    Which component should you turn on in the Containers plan settings?
  fr: |
    Contoso dispose d'un abonnement Azure nommé **Sub1** qui contient un cluster Azure Kubernetes Service (AKS) nommé **aks-prod**. Le plan Defender for Containers est activé sur Sub1, avec seulement les composants **Kubernetes API access** et **Registry access**.

    Vous devez recevoir des alertes de sécurité lorsqu'un processus qui ne fait pas partie de l'image conteneur d'origine démarre dans un conteneur d'aks-prod.

    Quel composant devez-vous activer dans les paramètres du plan Containers ?
body:
  options:
    - { id: a, text: { en: "Azure Policy", fr: "Azure Policy" } }
    - { id: b, text: { en: "Agentless scanning for machines", fr: "Agentless scanning for machines" } }
    - { id: c, text: { en: "Defender sensor", fr: "Defender sensor" } }
    - { id: d, text: { en: "Security findings", fr: "Security findings" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The scenario describes binary drift detection, a runtime capability that relies on the Defender sensor deployed to the cluster nodes. The sensor collects runtime telemetry from the nodes and containers, which agentless components cannot observe."
    fr: "Le scénario décrit la détection de dérive binaire, une fonctionnalité d'exécution qui repose sur le capteur Defender déployé sur les nœuds du cluster. Le capteur collecte la télémétrie d'exécution des nœuds et des conteneurs, que les composants sans agent ne peuvent pas observer."
  options:
    a:
      en: "The Azure Policy add-on assesses and enforces data plane hardening rules on API server requests, such as blocking privileged containers. It does not watch processes inside running containers."
      fr: "Le module complémentaire Azure Policy évalue et applique des règles de renforcement du plan de données sur les requêtes adressées au serveur d'API, par exemple le blocage des conteneurs privilégiés. Il ne surveille pas les processus dans les conteneurs en cours d'exécution."
    b:
      en: "Agentless scanning for machines scans the nodes for vulnerabilities and secrets. It does not detect new processes at runtime."
      fr: "Agentless scanning for machines analyse les nœuds pour rechercher des vulnérabilités et des secrets. Il ne détecte pas les nouveaux processus à l'exécution."
    d:
      en: "Security findings is an option of Registry access that links vulnerability findings to images when they are pushed. It concerns images in the registry, not running processes."
      fr: "Security findings est une option de Registry access qui associe les résultats de vulnérabilité aux images lors de leur envoi (push). Elle concerne les images du registre, pas les processus en cours d'exécution."
references:
  - title: Introduction to Microsoft Defender for Containers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
  - title: Enable Defender for Containers in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-enable-plan
