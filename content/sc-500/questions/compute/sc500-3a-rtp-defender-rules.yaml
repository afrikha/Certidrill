id: sc500-3a-rtp-defender-rules
objective: "3.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender real-time protection for its Copilot Studio agents. In **Settings > Security for AI > Policies & rules > Real-time protection**, the built-in Default rule is enabled. You create a custom rule named **Block-Finance** that is scoped to the agent **FinanceAgent** and uses the **Secret exfiltration** and **Unsafe email domain** detection types.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise la protection en temps réel de Microsoft Defender pour ses agents Copilot Studio. Dans **Settings > Security for AI > Policies & rules > Real-time protection**, la règle intégrée Default est activée. Vous créez une règle personnalisée nommée **Block-Finance**, limitée à l'agent **FinanceAgent**, qui utilise les types de détection **Secret exfiltration** et **Unsafe email domain**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          For the agents other than FinanceAgent, risky tool invocations are recorded as behaviors but are allowed to run.
        fr: |
          Pour les agents autres que FinanceAgent, les invocations d'outils à risque sont enregistrées comme comportements, mais peuvent s'exécuter.
    - id: s2
      text:
        en: |
          When Block-Finance blocks an action of FinanceAgent, a near-real-time alert is generated for that action.
        fr: |
          Lorsque Block-Finance bloque une action de FinanceAgent, une alerte quasi en temps réel est générée pour cette action.
    - id: s3
      text:
        en: |
          A user prompt to FinanceAgent that contains an email address in an untrusted domain is blocked by the Unsafe email domain detection, even if no email is sent.
        fr: |
          Un prompt utilisateur adressé à FinanceAgent qui contient une adresse e-mail d'un domaine non approuvé est bloqué par la détection Unsafe email domain, même si aucun e-mail n'est envoyé.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The Default rule audits all agents: matching activity is recorded as a behavior in BehaviorInfo but the action is not stopped. Custom rules block matching actions and record the behavior, but near-real-time detections surface as alerts only in audit mode, so no near-real-time alert is generated for an agent covered by a blocking rule. Unsafe email domain is evaluated only at the tool request step, when a tool call would send email to an unsafe domain; an address in a user request does not trigger it by itself.
    fr: |
      La règle Default audite tous les agents : l'activité correspondante est enregistrée comme comportement dans BehaviorInfo, mais l'action n'est pas arrêtée. Les règles personnalisées bloquent les actions correspondantes et enregistrent le comportement, mais les détections quasi en temps réel ne génèrent des alertes qu'en mode audit : aucune alerte quasi en temps réel n'est donc générée pour un agent couvert par une règle de blocage. Unsafe email domain n'est évaluée qu'à l'étape de la requête d'outil, quand un appel d'outil enverrait un e-mail à un domaine non sûr ; une adresse dans une requête utilisateur ne la déclenche pas à elle seule.
references:
  - title: Protect AI agents in real time using Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-cloud-apps/real-time-agent-protection-during-runtime
