id: sc500-cs2b-front-door-origin
objective: "3.3.7"
type: single
caseStudy: sc500-cs2b-city-power-light
difficulty: 1
status: draft
stem:
  en: |
    You need to configure the access restrictions of app-portal to meet the requirement for the customer portal. Which rule should you add?
  fr: |
    Vous devez configurer les restrictions d'accès d'app-portal pour respecter l'exigence relative au portail clients. Quelle règle devez-vous ajouter ?
body:
  options:
    - { id: a, text: { en: "An Allow rule for the AzureFrontDoor.Backend service tag, with the unmatched rule action set to Deny", fr: "Une règle Allow pour la balise de service AzureFrontDoor.Backend, avec l'action de règle sans correspondance définie sur Deny" } }
    - { id: b, text: { en: "An Allow rule for the AzureFrontDoor.Frontend service tag with the x-azure-fdid header set to the ID of fd-cpl", fr: "Une règle Allow pour la balise de service AzureFrontDoor.Frontend avec l'en-tête x-azure-fdid défini sur l'ID de fd-cpl" } }
    - { id: c, text: { en: "An Allow rule for the AzureFrontDoor.Backend service tag with the x-azure-fdid header set to the ID of fd-cpl", fr: "Une règle Allow pour la balise de service AzureFrontDoor.Backend avec l'en-tête x-azure-fdid défini sur l'ID de fd-cpl" } }
    - { id: d, text: { en: "An Allow rule for the IP addresses that a DNS lookup of the fd-cpl endpoint name returns", fr: "Une règle Allow pour les adresses IP que renvoie une résolution DNS du nom du point de terminaison de fd-cpl" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Traffic from Azure Front Door to the origin comes from the ranges of the AzureFrontDoor.Backend service tag, which every Front Door profile shares. Filtering the x-azure-fdid header on the ID of fd-cpl limits the rule to this profile. Once a rule exists, an implicit deny all blocks every other request, including direct internet traffic.
    fr: |
      Le trafic d'Azure Front Door vers l'origine provient des plages de la balise de service AzureFrontDoor.Backend, que partagent tous les profils Front Door. Le filtrage de l'en-tête x-azure-fdid sur l'ID de fd-cpl limite la règle à ce profil. Dès qu'une règle existe, un refus implicite de tout bloque toutes les autres requêtes, y compris le trafic Internet direct.
  options:
    a: { en: "Denying unmatched requests blocks direct internet traffic, but without the header filter the requests relayed by any other Front Door profile are still allowed.", fr: "Refuser les requêtes sans correspondance bloque le trafic Internet direct, mais sans le filtre d'en-tête les requêtes relayées par n'importe quel autre profil Front Door restent autorisées." }
    b: { en: "AzureFrontDoor.Frontend covers the addresses that clients connect to, not the addresses that Front Door uses to reach origins.", fr: "AzureFrontDoor.Frontend couvre les adresses auxquelles les clients se connectent, pas celles qu'utilise Front Door pour atteindre les origines." }
    d: { en: "The endpoint addresses are the client-facing addresses; requests to the origin come from the AzureFrontDoor.Backend ranges.", fr: "Les adresses du point de terminaison sont celles côté clients ; les requêtes vers l'origine proviennent des plages AzureFrontDoor.Backend." }
references:
  - title: Set up Azure App Service access restrictions
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions
