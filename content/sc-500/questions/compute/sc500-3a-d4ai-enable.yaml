id: sc500-3a-d4ai-enable
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation hosts Azure OpenAI model deployments in the subscription **Sub-AI**. Microsoft Defender for Cloud is enabled on Sub-AI with the foundational CSPM capabilities only.

    You need to receive security alerts for jailbreak attempts and data leakage against the generative AI applications in Sub-AI.

    What should you do?
  fr: |
    Adatum Corporation héberge des déploiements de modèles Azure OpenAI dans l'abonnement **Sub-AI**. Microsoft Defender for Cloud est activé sur Sub-AI avec les fonctionnalités CSPM de base uniquement.

    Vous devez recevoir des alertes de sécurité pour les tentatives de jailbreak et les fuites de données visant les applications d'IA générative de Sub-AI.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Environment settings, select Sub-AI, and on the Defender plans page, set AI services to On.", fr: "Dans Paramètres d'environnement, sélectionner Sub-AI, puis, sur la page Plans Defender, régler AI services sur On." } }
    - { id: b, text: { en: "In Environment settings, select Sub-AI, and on the Defender plans page, set Defender CSPM to On.", fr: "Dans Paramètres d'environnement, sélectionner Sub-AI, puis, sur la page Plans Defender, régler Defender CSPM sur On." } }
    - { id: c, text: { en: "In Environment settings, select Sub-AI, and on the Defender plans page, set Servers to On.", fr: "Dans Paramètres d'environnement, sélectionner Sub-AI, puis, sur la page Plans Defender, régler Servers sur On." } }
    - { id: d, text: { en: "In Environment settings, select Sub-AI, and on the Defender plans page, set APIs to On.", fr: "Dans Paramètres d'environnement, sélectionner Sub-AI, puis, sur la page Plans Defender, régler APIs sur On." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Threat protection for AI services is the Defender for Cloud plan that identifies threats to generative AI applications in real time, such as jailbreak, data leakage, data poisoning and credential theft, using Prompt Shields and Microsoft threat intelligence. It is enabled per subscription by setting AI services to On on the Defender plans page, which requires Owner or Contributor.
    fr: |
      La protection contre les menaces pour les services d'IA est le plan Defender for Cloud qui identifie en temps réel les menaces visant les applications d'IA générative, comme le jailbreak, les fuites de données, l'empoisonnement des données et le vol d'informations d'identification, à l'aide de Prompt Shields et du renseignement sur les menaces de Microsoft. Il s'active par abonnement en réglant AI services sur On dans la page Plans Defender, ce qui exige Owner ou Contributor.
  options:
    b:
      en: |
        Defender CSPM adds AI security posture management (AI BOM, recommendations, attack paths), not runtime alerts on prompts.
      fr: |
        Defender CSPM ajoute la gestion de la posture de sécurité de l'IA (AI BOM, recommandations, chemins d'attaque), pas des alertes à l'exécution sur les prompts.
    c:
      en: |
        Defender for Servers protects virtual machines and servers, not model deployments.
      fr: |
        Defender for Servers protège les machines virtuelles et les serveurs, pas les déploiements de modèles.
    d:
      en: |
        Defender for APIs protects APIs published through API Management; it does not analyze prompts sent to Azure OpenAI.
      fr: |
        Defender for APIs protège les API publiées via Gestion des API ; il n'analyse pas les prompts envoyés à Azure OpenAI.
references:
  - title: Enable threat protection for AI services
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding
  - title: AI threat protection in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
