id: sc500-cs4a-agent-sponsor
objective: "3.1.6"
type: single
caseStudy: sc500-cs4a-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for Lena Roux and ItineraryBuilder. The solution must meet the general requirements. What should you do?
  fr: |
    Vous devez respecter l'exigence concernant Lena Roux et ItineraryBuilder. La solution doit respecter les exigences générales. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Lena Roux as an owner of the ItineraryBuilder agent identity.", fr: "Ajouter Lena Roux comme propriétaire de l'identité d'agent ItineraryBuilder." } }
    - { id: b, text: { en: "Add Lena Roux as a sponsor of the ItineraryBuilder agent identity.", fr: "Ajouter Lena Roux comme sponsor de l'identité d'agent ItineraryBuilder." } }
    - { id: c, text: { en: "Set Lena Roux as the manager of the ItineraryBuilder agent identity.", fr: "Définir Lena Roux comme manager de l'identité d'agent ItineraryBuilder." } }
    - { id: d, text: { en: "Add Lena Roux as an owner of the BP-Trips agent identity blueprint.", fr: "Ajouter Lena Roux comme propriétaire du blueprint d'identité d'agent BP-Trips." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A sponsor is the business representative accountable for an agent. Sponsors can perform nondestructive lifecycle operations, such as disabling the agent identity, and can request access packages on behalf of the agent, but they cannot modify its application settings or credentials.
    fr: |
      Un sponsor est le représentant métier responsable d'un agent. Les sponsors peuvent effectuer des opérations de cycle de vie non destructrices, comme désactiver l'identité d'agent, et demander des packages d'accès pour le compte de l'agent, mais ils ne peuvent pas modifier ses paramètres d'application ni ses informations d'identification.
  options:
    a:
      en: |
        Owners are technical administrators who manage configuration and credentials, which Lena Roux must not be able to change.
      fr: |
        Les propriétaires sont des administrateurs techniques qui gèrent la configuration et les informations d'identification, que Lena Roux ne doit pas pouvoir modifier.
    c:
      en: |
        A manager can request access packages for the agent's user account, but cannot disable or delete the agent.
      fr: |
        Un manager peut demander des packages d'accès pour le compte d'utilisateur de l'agent, mais ne peut ni désactiver ni supprimer l'agent.
    d:
      en: |
        Owning the blueprint grants technical administration, including credential management, and exceeds least privilege.
      fr: |
        Être propriétaire du blueprint accorde l'administration technique, y compris la gestion des informations d'identification, et dépasse le moindre privilège.
references:
  - title: Administrative relationships in Microsoft Entra Agent ID (Owners, sponsors, and managers)
    url: https://learn.microsoft.com/en-us/entra/agent-id/agent-owners-sponsors-managers
