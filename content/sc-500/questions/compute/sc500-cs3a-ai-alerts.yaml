id: sc500-cs3a-ai-alerts
objective: "3.1.8"
type: single
caseStudy: sc500-cs3a-trey-research
difficulty: 1
status: draft
stem:
  en: |-
    You need to meet the requirement of the security analysts for the Defender for Cloud alerts. What should you do in Defender for Cloud?
  fr: |-
    Vous devez satisfaire l'exigence des analystes de sécurité concernant les alertes Defender for Cloud. Que devez-vous faire dans Defender for Cloud ?
body:
  options:
    - { id: a, text: { en: "Turn on the Defender CSPM plan for Sub-AI.", fr: "Activer le plan Defender CSPM pour Sub-AI." } }
    - { id: b, text: { en: "Turn on the AI services plan for Sub-AI and enable data security for AI interactions.", fr: "Activer le plan AI services pour Sub-AI et activer la sécurité des données pour les interactions IA." } }
    - { id: c, text: { en: "Turn on the AI services plan for Sub-AI and enable user prompt evidence.", fr: "Activer le plan AI services pour Sub-AI et activer les preuves des prompts utilisateur." } }
    - { id: d, text: { en: "Turn on the App Service plan for Sub-AI and enable user prompt evidence.", fr: "Activer le plan App Service pour Sub-AI et activer les preuves des prompts utilisateur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The AI services threat protection plan, turned on per subscription under Environment settings, raises alerts for Foundry workloads. Its Enable user prompt evidence setting adds the suspicious segments of prompts and model responses to the alerts; when it is off, the prompts are still analyzed but masked in the alerts.
    fr: |-
      Le plan de protection contre les menaces AI services, activé par abonnement dans Environment settings, génère les alertes des charges de travail Foundry. Son paramètre Enable user prompt evidence ajoute aux alertes les segments suspects des prompts et des réponses du modèle ; quand il est désactivé, les prompts restent analysés mais sont masqués dans les alertes.
  options:
    a:
      en: |-
        Defender CSPM assesses posture and attack paths; it does not raise threat alerts with prompt evidence.
      fr: |-
        Defender CSPM évalue la posture et les chemins d'attaque ; il ne génère pas d'alertes de menace avec des extraits de prompts.
    b:
      en: |-
        Data security for AI interactions lets Microsoft Purview analyze prompts and responses (with a Purview license); it does not add prompt segments to Defender for Cloud alerts.
      fr: |-
        La sécurité des données pour les interactions IA permet à Microsoft Purview d'analyser les prompts et les réponses (avec une licence Purview) ; elle n'ajoute pas de segments de prompts aux alertes Defender for Cloud.
    d:
      en: |-
        Defender for App Service protects web apps; the prompt evidence setting belongs to the AI services plan.
      fr: |-
        Defender for App Service protège les applications web ; le paramètre de preuves des prompts appartient au plan AI services.
references:
  - title: Enable threat protection for AI services
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding
