id: sc500-3b-dash-ai-widget-empty
objective: "3.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure subscription named **Sub1** that contains Microsoft Foundry resources used by several generative AI applications. The `Microsoft.Security` resource provider is registered on Sub1.

    In Microsoft Defender for Cloud, the following plans are enabled on Sub1: Defender CSPM with the sensitive data discovery extension, Defender for Storage, and Defender for Databases.

    In the Data and AI security dashboard, the **AI threat protection** widget shows no scanned prompts and no alerts.

    You need the widget to report the prompts scanned and the alerts detected for the AI resources of Sub1.

    What should you do?
  fr: |
    Contoso dispose d'un abonnement Azure nommé **Sub1** qui contient des ressources Microsoft Foundry utilisées par plusieurs applications d'IA générative. Le fournisseur de ressources `Microsoft.Security` est inscrit sur Sub1.

    Dans Microsoft Defender for Cloud, les plans suivants sont activés sur Sub1 : Defender CSPM avec l'extension de découverte des données sensibles, Defender for Storage et Defender for Databases.

    Dans le tableau de bord de sécurité des données et de l'IA, le widget **AI threat protection** n'affiche aucune invite analysée et aucune alerte.

    Le widget doit indiquer les invites analysées et les alertes détectées pour les ressources d'IA de Sub1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the AI services plan of Defender for Cloud on Sub1", fr: "Activer le plan AI services de Defender for Cloud sur Sub1" } }
    - { id: b, text: { en: "Enable agentless scanning for machines in the Defender CSPM settings of Sub1", fr: "Activer l'analyse sans agent des machines dans les paramètres Defender CSPM de Sub1" } }
    - { id: c, text: { en: "Enable Microsoft Purview Data Security Posture Management for AI in the tenant", fr: "Activer Microsoft Purview Data Security Posture Management pour l'IA dans le locataire" } }
    - { id: d, text: { en: "Enable Defender for App Service on Sub1 for the applications that call the models", fr: "Activer Defender for App Service sur Sub1 pour les applications qui appellent les modèles" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The AI threat protection widget shows the number of prompts scanned and the alerts detected, and that data comes from threat protection for AI services. The dashboard only shows what the plans enabled in the subscription provide, so without the AI services plan the AI threat protection data stays empty.
    fr: |
      Le widget AI threat protection affiche le nombre d'invites analysées et les alertes détectées, et ces données proviennent de la protection contre les menaces pour les services d'IA. Le tableau de bord n'affiche que ce que fournissent les plans activés dans l'abonnement : sans le plan AI services, les données de protection contre les menaces de l'IA restent vides.
  options:
    b: { en: "Agentless scanning snapshots VM disks to find vulnerabilities, secrets and malware; it doesn't scan prompts sent to AI models.", fr: "L'analyse sans agent prend des instantanés des disques des machines virtuelles pour trouver des vulnérabilités, des secrets et des logiciels malveillants ; elle n'analyse pas les invites envoyées aux modèles d'IA." }
    c: { en: "DSPM for AI is a Microsoft Purview solution; it doesn't feed the threat protection widgets of the Defender for Cloud dashboard.", fr: "DSPM pour l'IA est une solution Microsoft Purview ; elle n'alimente pas les widgets de protection contre les menaces du tableau de bord de Defender for Cloud." }
    d: { en: "Defender for App Service protects web apps; it doesn't analyze prompts or raise AI threat protection alerts.", fr: "Defender for App Service protège les applications web ; il n'analyse pas les invites et ne génère pas d'alertes de protection contre les menaces de l'IA." }
references:
  - title: Data and AI security dashboard
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/data-aware-security-dashboard-overview
