id: sc500-cs3a-token-limit
objective: "3.1.7"
type: dropdown
caseStudy: sc500-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to configure apim-trey to meet the token consumption requirement for the research teams. You add a policy to the inbound section of the API that publishes the models.

    How should you complete the policy? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer apim-trey pour satisfaire l'exigence de consommation de jetons des équipes de recherche. Vous ajoutez une stratégie à la section inbound de l'API qui publie les modèles.

    Comment devez-vous compléter la stratégie ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    <inbound>
      <base />
      <[[policy]]
          counter-key="[[key]]"
          tokens-per-minute="20000"
          token-quota="2000000"
          token-quota-period="[[period]]"
          estimate-prompt-tokens="true" />
    </inbound>
  slots:
    - id: policy
      options:
        - { id: llm, text: llm-token-limit }
        - { id: ratekey, text: rate-limit-by-key }
        - { id: quotakey, text: quota-by-key }
        - { id: metric, text: llm-emit-token-metric }
    - id: key
      options:
        - { id: ip, text: "@(context.Request.IpAddress)" }
        - { id: api, text: "@(context.Api.Id)" }
        - { id: sub, text: "@(context.Subscription.Id)" }
    - id: period
      options:
        - { id: daily, text: Daily }
        - { id: monthly, text: Monthly }
        - { id: yearly, text: Yearly }
answer:
  values: { policy: llm, key: sub, period: monthly }
explanation:
  correct:
    en: |-
      The llm-token-limit policy limits the tokens consumed by prompts and completions, per minute and over a quota period. Each research team has its own API Management subscription, so the subscription ID is the counter key that gives each team its own counters. A calendar month maps to the Monthly fixed window, and estimate-prompt-tokens set to true rejects a prompt that already exceeds the limit without calling the model.
    fr: |-
      La stratégie llm-token-limit limite les jetons consommés par les prompts et les complétions, par minute et sur une période de quota. Chaque équipe de recherche a son propre abonnement API Management : l'ID d'abonnement est donc la clé de compteur qui donne à chaque équipe ses propres compteurs. Un mois civil correspond à la fenêtre fixe Monthly, et estimate-prompt-tokens à true rejette un prompt qui dépasse déjà la limite sans appeler le modèle.
  options:
    ratekey:
      en: |-
        rate-limit-by-key and quota-by-key count calls or bandwidth, not the tokens consumed by the model.
      fr: |-
        rate-limit-by-key et quota-by-key comptent des appels ou de la bande passante, pas les jetons consommés par le modèle.
    metric:
      en: |-
        llm-emit-token-metric sends token usage metrics to Application Insights; it does not enforce any limit.
      fr: |-
        llm-emit-token-metric envoie des métriques de consommation de jetons à Application Insights ; elle n'applique aucune limite.
    ip:
      en: |-
        Teams are identified by their subscription; a counter per client IP address would not match the teams.
      fr: |-
        Les équipes sont identifiées par leur abonnement ; un compteur par adresse IP cliente ne correspondrait pas aux équipes.
    api:
      en: |-
        The API ID gives a single counter that all the teams would share.
      fr: |-
        L'ID d'API donne un compteur unique que toutes les équipes partageraient.
references:
  - title: Limit large language model API token usage
    url: https://learn.microsoft.com/en-us/azure/api-management/llm-token-limit-policy
  - title: AI gateway capabilities in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities
