id: sc500-3a-ca-statements
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has Microsoft Agent 365 licenses and Microsoft Entra ID P1 licenses. It has no Microsoft Entra ID P2, Microsoft 365 E5 or Microsoft 365 E7 licenses. Some agents act on behalf of signed-in users, and others have their own agent user account with a mailbox.

    You are planning Conditional Access policies for these agents.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de licences Microsoft Agent 365 et de licences Microsoft Entra ID P1. Elle n'a aucune licence Microsoft Entra ID P2, Microsoft 365 E5 ou Microsoft 365 E7. Certains agents agissent pour le compte d'utilisateurs connectés, d'autres ont leur propre compte d'utilisateur d'agent avec une boîte aux lettres.

    Vous planifiez les stratégies d'accès conditionnel de ces agents.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A policy that includes All users applies to the agents' user accounts.
        fr: |
          Une stratégie qui inclut All users s'applique aux comptes d'utilisateur des agents.
    - id: s2
      text:
        en: |
          When an agent reads a signed-in user's mailbox by using the on-behalf-of flow, the policies that target that user are evaluated.
        fr: |
          Lorsqu'un agent lit la boîte aux lettres d'un utilisateur connecté à l'aide du flux on-behalf-of, les stratégies qui ciblent cet utilisateur sont évaluées.
    - id: s3
      text:
        en: |
          With the current licenses, Woodgrove can enforce a policy that uses the Agent risk (Preview) condition.
        fr: |
          Avec les licences actuelles, Woodgrove peut appliquer une stratégie qui utilise la condition Agent risk (Preview).
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Policies scoped through Users, including All users, groups and directory roles, never apply to agent user accounts; those are targeted under Agents with All agent users or selected agent users. In the on-behalf-of flow the token subject is the signed-in user, so the user's policies apply, including to the OBO token exchange. Agent risk-based Conditional Access requires Microsoft Entra ID P2 or Microsoft 365 E5 in addition to Agent 365; P1 only covers the other agent policies.
    fr: |
      Les stratégies ciblées par Users, y compris All users, les groupes et les rôles d'annuaire, ne s'appliquent jamais aux comptes d'utilisateur d'agent ; ceux-ci se ciblent sous Agents avec All agent users ou des utilisateurs d'agent choisis. Dans le flux on-behalf-of, le sujet du jeton est l'utilisateur connecté : ce sont donc ses stratégies qui s'appliquent, y compris à l'échange de jetons OBO. L'accès conditionnel basé sur le risque d'agent exige Microsoft Entra ID P2 ou Microsoft 365 E5 en plus d'Agent 365 ; P1 ne couvre que les autres stratégies d'agent.
references:
  - title: Conditional Access for agents
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
  - title: Secure autonomous agents with Conditional Access
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-autonomous-agents
