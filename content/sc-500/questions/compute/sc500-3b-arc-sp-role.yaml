id: sc500-3b-arc-sp-role
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has 400 on-premises Windows and Linux servers. You plan to connect the servers to Azure Arc in a resource group named **RG-Arc** by running the onboarding script on each server with your organization's automation tool.

    The script must authenticate without interactive sign-in by using a service principal. The solution must follow the principle of least privilege.

    Which role should you assign to the service principal on RG-Arc?
  fr: |
    Contoso dispose de 400 serveurs Windows et Linux locaux. Vous prévoyez de connecter les serveurs à Azure Arc dans un groupe de ressources nommé **RG-Arc** en exécutant le script d'intégration sur chaque serveur avec l'outil d'automatisation de votre organisation.

    Le script doit s'authentifier sans connexion interactive à l'aide d'un principal de service. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer au principal de service sur RG-Arc ?
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: Azure Connected Machine Onboarding }
    - { id: c, text: User Access Administrator }
    - { id: d, text: Virtual Machine Contributor }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The service principal used to connect machines at scale needs the Azure Connected Machine Onboarding role (or Contributor) on the resource group of the machines. Azure Connected Machine Onboarding is limited to onboarding, so it is the least-privilege choice; the portal assigns it when you create the service principal from Azure Arc.
    fr: |
      Le principal de service utilisé pour connecter des machines à grande échelle a besoin du rôle Azure Connected Machine Onboarding (ou Contributor) sur le groupe de ressources des machines. Azure Connected Machine Onboarding se limite à l'intégration : c'est le choix du moindre privilège ; le portail l'attribue quand vous créez le principal de service depuis Azure Arc.
  options:
    a: { en: "Contributor also works, but it grants full management of every resource in the resource group, which isn't least privilege.", fr: "Contributor fonctionne aussi, mais il accorde la gestion complète de toutes les ressources du groupe de ressources, ce qui ne respecte pas le moindre privilège." }
    c: { en: "User Access Administrator manages role assignments; it can't create Azure Arc-enabled server resources.", fr: "User Access Administrator gère les attributions de rôles ; il ne peut pas créer de ressources de serveurs avec Azure Arc." }
    d: { en: "Virtual Machine Contributor manages Azure virtual machines, not Azure Arc-enabled server resources.", fr: "Virtual Machine Contributor gère des machines virtuelles Azure, pas des ressources de serveurs avec Azure Arc." }
references:
  - title: Connect hybrid machines to Azure at scale
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/onboard-service-principal
