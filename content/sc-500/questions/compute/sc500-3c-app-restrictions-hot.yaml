id: sc500-3c-app-restrictions-hot
objective: "3.3.7"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an App Service web app named **app-portal**. Contoso publishes app-portal through its own Azure Front Door profile, whose ID is `a1b2c3d4-0000-4000-8000-000000000001`. The main site of app-portal has the access restriction rules shown in the following table. The unmatched rule action is not configured.

    Answer each prompt by selecting the rule that determines how App Service handles the request.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une application web App Service nommée **app-portal**. Contoso publie app-portal via son propre profil Azure Front Door, dont l'ID est `a1b2c3d4-0000-4000-8000-000000000001`. Le site principal d'app-portal possède les règles de restriction d'accès indiquées dans le tableau suivant. L'action de la règle sans correspondance n'est pas configurée.

    Répondez à chaque consigne en sélectionnant la règle qui détermine la façon dont App Service traite la requête.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A request sent directly to app-portal from 198.51.100.70", fr: "Une requête envoyée directement à app-portal depuis 198.51.100.70" }
    - id: p2
      text: { en: "A request forwarded to app-portal by a Front Door profile that belongs to another company", fr: "Une requête transférée à app-portal par un profil Front Door appartenant à une autre entreprise" }
  grid:
    header: [{ en: "Priority", fr: "Priorité" }, { en: "Name", fr: "Nom" }, { en: "Source", fr: "Source" }, { en: "HTTP header filter", fr: "Filtre d'en-tête HTTP" }, Action]
    rows:
      - [{ text: "100" }, { text: Deny-Contractors, area: r100 }, { text: "198.51.100.64/26" }, { text: "-" }, { text: Deny }]
      - [{ text: "200" }, { text: Allow-Corp, area: r200 }, { text: "198.51.100.0/24" }, { text: "-" }, { text: Allow }]
      - [{ text: "300" }, { text: Allow-FrontDoor, area: r300 }, { text: { en: "Service tag AzureFrontDoor.Backend", fr: "Étiquette de service AzureFrontDoor.Backend" } }, { text: "X-Azure-FDID: a1b2c3d4-0000-4000-8000-000000000001" }, { text: Allow }]
      - [{ text: "-" }, { text: { en: "Unmatched rule", fr: "Règle sans correspondance" }, area: unmatched }, { text: Any }, { text: "-" }, { text: { en: "Not configured", fr: "Non configurée" } }]
answer:
  values: { p1: r100, p2: unmatched }
explanation:
  correct:
    en: "Rules are evaluated in priority order, lowest number first, and the first match applies. 198.51.100.70 belongs to 198.51.100.64/26, so Deny-Contractors (100) blocks it before Allow-Corp is evaluated. A request from another Front Door profile comes from the AzureFrontDoor.Backend service tag but carries a different X-Azure-FDID value, so it matches no rule; because rules exist and the unmatched rule action is not configured, the unmatched rule denies it."
    fr: "Les règles sont évaluées par ordre de priorité, du plus petit numéro au plus grand, et la première correspondance s'applique. 198.51.100.70 appartient à 198.51.100.64/26 : Deny-Contractors (100) la bloque avant l'évaluation d'Allow-Corp. Une requête provenant d'un autre profil Front Door vient de l'étiquette de service AzureFrontDoor.Backend, mais porte une autre valeur X-Azure-FDID : elle ne correspond à aucune règle. Comme des règles existent et que l'action de la règle sans correspondance n'est pas configurée, la règle sans correspondance la refuse."
references:
  - title: Azure App Service access restrictions
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-access-restrictions
