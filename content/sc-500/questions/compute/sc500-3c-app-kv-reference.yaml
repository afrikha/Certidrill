id: sc500-3c-app-kv-reference
objective: "3.3.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has an existing App Service web app named **app-loans** that has no managed identity. The app reads a database password from an app setting named **DbPassword**, which currently contains the password in clear text. A key vault named **kv-loans** uses the Azure role-based access control permission model and already contains the password as a secret named **db-password**.

    You need to ensure that DbPassword gets its value from kv-loans without any code change. The solution must use the principle of least privilege.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove dispose d'une application web App Service existante nommée **app-loans** qui n'a pas d'identité managée. L'application lit un mot de passe de base de données dans un paramètre d'application nommé **DbPassword**, qui contient actuellement le mot de passe en clair. Un coffre de clés nommé **kv-loans** utilise le modèle d'autorisation de contrôle d'accès en fonction du rôle Azure et contient déjà le mot de passe sous forme de secret nommé **db-password**.

    Vous devez faire en sorte que DbPassword obtienne sa valeur de kv-loans sans modifier le code. La solution doit respecter le principe du moindre privilège.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: mi, text: { en: "Enable the system-assigned managed identity of app-loans.", fr: "Activer l'identité managée affectée par le système d'app-loans." } }
    - { id: role, text: { en: "Assign the identity the **Key Vault Secrets User** role on kv-loans.", fr: "Attribuer à l'identité le rôle **Key Vault Secrets User** sur kv-loans." } }
    - { id: ref, text: { en: "Set DbPassword to `@Microsoft.KeyVault(SecretUri=https://kv-loans.vault.azure.net/secrets/db-password)`.", fr: "Définir DbPassword sur `@Microsoft.KeyVault(SecretUri=https://kv-loans.vault.azure.net/secrets/db-password)`." } }
    - { id: policy, text: { en: "Create an access policy on kv-loans that grants the identity the **Get** secrets permission.", fr: "Créer sur kv-loans une stratégie d'accès qui accorde à l'identité l'autorisation **Get** sur les secrets." } }
    - { id: officer, text: { en: "Assign the identity the **Key Vault Secrets Officer** role on kv-loans.", fr: "Attribuer à l'identité le rôle **Key Vault Secrets Officer** sur kv-loans." } }
    - { id: easyauth, text: { en: "Enable App Service authentication with the Microsoft Entra identity provider.", fr: "Activer l'authentification App Service avec le fournisseur d'identité Microsoft Entra." } }
answer:
  sequence: [mi, role, ref]
explanation:
  correct:
    en: "A Key Vault reference is resolved with the app's managed identity, system-assigned by default, so the identity must exist first. In a vault that uses Azure RBAC, the identity then needs the Key Vault Secrets User role to read secrets. Finally, the app setting value becomes a `@Microsoft.KeyVault(...)` reference; the app keeps reading DbPassword as before."
    fr: "Une référence Key Vault est résolue avec l'identité managée de l'application, affectée par le système par défaut : l'identité doit donc exister d'abord. Dans un coffre qui utilise Azure RBAC, l'identité a ensuite besoin du rôle Key Vault Secrets User pour lire les secrets. Enfin, la valeur du paramètre d'application devient une référence `@Microsoft.KeyVault(...)` ; l'application continue de lire DbPassword comme avant."
  options:
    policy:
      en: "Access policies apply only to vaults that use the vault access policy permission model, not Azure RBAC."
      fr: "Les stratégies d'accès ne s'appliquent qu'aux coffres qui utilisent le modèle d'autorisation par stratégie d'accès au coffre, pas Azure RBAC."
    officer:
      en: "Key Vault Secrets Officer can also create, update and delete secrets, which exceeds read access."
      fr: "Key Vault Secrets Officer peut aussi créer, mettre à jour et supprimer des secrets, ce qui dépasse l'accès en lecture."
    easyauth:
      en: "App Service authentication signs users in to the app; it is not used to read Key Vault references."
      fr: "L'authentification App Service connecte les utilisateurs à l'application ; elle ne sert pas à lire les références Key Vault."
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
