id: sc500-3b-mdfs-statements
objective: "3.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to enable Microsoft Defender for Servers on an Azure subscription named **Sub1** from **Environment settings** in Defender for Cloud. Sub1 contains Azure VMs. Proseware also has on-premises servers that are onboarded to Microsoft Defender for Endpoint but aren't connected to Azure Arc.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'activer Microsoft Defender for Servers sur un abonnement Azure nommé **Sub1** depuis les **paramètres d'environnement** de Defender for Cloud. Sub1 contient des machines virtuelles Azure. Proseware dispose aussi de serveurs locaux intégrés à Microsoft Defender for Endpoint mais non connectés à Azure Arc.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you set the Servers plan to On for Sub1, Plan 2 is selected unless you select Change plans.
        fr: Quand vous passez le plan Servers sur On pour Sub1, le Plan 2 est sélectionné, sauf si vous choisissez Change plans.
    - id: s2
      text:
        en: You can pause the 30-day trial that starts when you enable the plan.
        fr: Vous pouvez suspendre la période d'essai de 30 jours qui démarre lorsque vous activez le plan.
    - id: s3
      text:
        en: With Plan 2, the on-premises servers get file integrity monitoring without being connected to Azure Arc.
        fr: Avec le Plan 2, les serveurs locaux bénéficient de la surveillance de l'intégrité des fichiers sans être connectés à Azure Arc.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Turning the Servers switch on enables Plan 2 by default; Change plans lets you select Plan 1. The 30-day trial can't be stopped, paused or extended. On-premises machines onboarded directly with Defender for Endpoint instead of Azure Arc get only Plan 1 functionality plus the premium Defender Vulnerability Management features, so features such as file integrity monitoring require Azure Arc.
    fr: |
      Activer le commutateur Servers active le Plan 2 par défaut ; Change plans permet de choisir le Plan 1. La période d'essai de 30 jours ne peut être ni arrêtée, ni suspendue, ni prolongée. Les machines locales intégrées directement avec Defender for Endpoint plutôt qu'avec Azure Arc n'obtiennent que les fonctionnalités du Plan 1 et les fonctionnalités premium de Defender Vulnerability Management : des fonctionnalités comme la surveillance de l'intégrité des fichiers exigent Azure Arc.
references:
  - title: Protect your servers with Defender for Servers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-servers-plan
