id: sc500-3c-aca-identity-pull
objective: "3.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin plans to create a container app named **app-orders** in an existing Azure Container Apps environment. The app's image is stored in a private Azure container registry named **acrtailspin**, which allows ARM audience tokens. The admin user of acrtailspin is disabled.

    You need to ensure that app-orders can pull its private image when the app is created. No registry password or token may be stored in the app configuration, and the solution must use the principle of least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin prévoit de créer une application conteneur nommée **app-orders** dans un environnement Azure Container Apps existant. L'image de l'application est stockée dans un registre de conteneurs Azure privé nommé **acrtailspin**, qui autorise les jetons d'audience ARM. L'utilisateur administrateur d'acrtailspin est désactivé.

    Vous devez vous assurer qu'app-orders peut extraire son image privée dès la création de l'application. Aucun mot de passe ni jeton de registre ne doit être stocké dans la configuration de l'application, et la solution doit respecter le principe du moindre privilège.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a user-assigned managed identity and assign it the AcrPull role on acrtailspin.", fr: "Créer une identité managée affectée par l'utilisateur et lui attribuer le rôle AcrPull sur acrtailspin." } }
    - { id: b, text: { en: "Create a user-assigned managed identity and assign it the AcrPush role on acrtailspin.", fr: "Créer une identité managée affectée par l'utilisateur et lui attribuer le rôle AcrPush sur acrtailspin." } }
    - { id: c, text: { en: "Create app-orders with `--user-assigned` and `--registry-identity` set to the identity's resource ID.", fr: "Créer app-orders avec `--user-assigned` et `--registry-identity` définis sur l'ID de ressource de l'identité." } }
    - { id: d, text: { en: "Enable the admin user on acrtailspin and pass `--registry-username` and `--registry-password`.", fr: "Activer l'utilisateur administrateur d'acrtailspin et transmettre `--registry-username` et `--registry-password`." } }
    - { id: e, text: { en: "Assign the Reader role on acrtailspin to the container app environment.", fr: "Attribuer le rôle Reader sur acrtailspin à l'environnement Container Apps." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "A user-assigned identity exists before the app, so it can be granted AcrPull on the registry and used to pull the private image at creation time. You attach it with `--user-assigned` and tell the app to use it for the registry with `--registry-identity`; no credential is stored in the app."
    fr: "Une identité affectée par l'utilisateur existe avant l'application : elle peut recevoir AcrPull sur le registre et servir à extraire l'image privée dès la création. Vous l'attachez avec `--user-assigned` et indiquez à l'application de l'utiliser pour le registre avec `--registry-identity` ; aucune information d'identification n'est stockée dans l'application."
  options:
    b:
      en: "AcrPush also allows pushing images, which exceeds what the app needs."
      fr: "AcrPush permet aussi d'envoyer des images, ce qui dépasse le besoin de l'application."
    d:
      en: "The admin user stores a registry password in the app configuration, which is not allowed."
      fr: "L'utilisateur administrateur oblige à stocker un mot de passe de registre dans la configuration de l'application, ce qui est interdit."
    e:
      en: "Reader is a control plane role that does not allow pulling images, and the environment is not the identity that pulls the image."
      fr: "Reader est un rôle du plan de contrôle qui ne permet pas d'extraire des images, et l'environnement n'est pas l'identité qui extrait l'image."
references:
  - title: Azure Container Apps image pull from Azure Container Registry with managed identity
    url: https://learn.microsoft.com/en-us/azure/container-apps/managed-identity-image-pull
