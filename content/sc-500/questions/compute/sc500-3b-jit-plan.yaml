id: sc500-3b-jit-plan
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure subscription named **Sub1** that contains 30 Azure Resource Manager virtual machines. Each VM is connected to a subnet that has a network security group.

    Microsoft Defender for Servers Plan 1 is enabled on Sub1. Management ports must be closed by default and opened only on request for a limited time. When you open **Just-in-time VM access** in Defender for Cloud, you can't configure any VM.

    What should you do first?
  fr: |
    Contoso dispose d'un abonnement Azure nommé **Sub1** qui contient 30 machines virtuelles Azure Resource Manager. Chaque machine virtuelle est connectée à un sous-réseau doté d'un groupe de sécurité réseau.

    Microsoft Defender for Servers Plan 1 est activé sur Sub1. Les ports de gestion doivent être fermés par défaut et ouverts uniquement sur demande, pour une durée limitée. Quand vous ouvrez **Just-in-time VM access** dans Defender for Cloud, vous ne pouvez configurer aucune machine virtuelle.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable the Defender CSPM plan on Sub1", fr: "Activer le plan Defender CSPM sur Sub1" } }
    - { id: b, text: { en: "Change the Defender for Servers plan of Sub1 to Plan 2", fr: "Passer le plan Defender for Servers de Sub1 au Plan 2" } }
    - { id: c, text: { en: "Turn on agentless scanning for machines on Sub1", fr: "Activer l'analyse sans agent des machines sur Sub1" } }
    - { id: d, text: { en: "Turn on the Endpoint protection setting of Defender for Servers", fr: "Activer le paramètre Endpoint protection de Defender for Servers" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Just-in-time VM access is a Defender for Servers Plan 2 feature, so the subscription must use Plan 2 before you can enable JIT on its VMs. The VMs already meet the other requirements, because they are Resource Manager VMs protected by an NSG.
    fr: |
      L'accès juste-à-temps aux machines virtuelles est une fonctionnalité de Defender for Servers Plan 2 : l'abonnement doit utiliser le Plan 2 avant que vous puissiez activer JIT sur ses machines virtuelles. Les machines virtuelles remplissent déjà les autres exigences, car ce sont des machines virtuelles Resource Manager protégées par un NSG.
  options:
    a: { en: "Defender CSPM provides posture features such as attack paths; it doesn't include just-in-time VM access.", fr: "Defender CSPM fournit des fonctionnalités de posture comme les chemins d'attaque ; il n'inclut pas l'accès juste-à-temps aux machines virtuelles." }
    c: { en: "Agentless scanning analyzes disk snapshots for vulnerabilities and malware; it doesn't control network access to management ports.", fr: "L'analyse sans agent analyse des instantanés de disques à la recherche de vulnérabilités et de logiciels malveillants ; elle ne contrôle pas l'accès réseau aux ports de gestion." }
    d: { en: "Endpoint protection deploys Defender for Endpoint; it doesn't unlock just-in-time VM access, which requires Plan 2.", fr: "Endpoint protection déploie Defender for Endpoint ; il ne débloque pas l'accès juste-à-temps aux machines virtuelles, qui exige le Plan 2." }
references:
  - title: Enable just-in-time access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
