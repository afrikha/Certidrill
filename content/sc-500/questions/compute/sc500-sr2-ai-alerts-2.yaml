id: sc500-sr2-ai-alerts-2
objective: "3.1.8"
type: series_yesno
series: sc500-sr2-ai-alerts
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You assign a guardrail that blocks user prompt attacks to the model deployments.
  fr: Vous attribuez aux déploiements de modèles un garde-fou qui bloque les attaques par invite utilisateur.
body:
  solution:
    en: In the Foundry portal, you create a guardrail that contains a **User prompt attacks** control on the **User input** intervention point with the **Annotate and block** action, and you assign the guardrail to the model deployments of fdy-chat.
    fr: Dans le portail Foundry, vous créez un garde-fou qui contient un contrôle **User prompt attacks** sur le point d'intervention **User input** avec l'action **Annotate and block**, puis vous attribuez ce garde-fou aux déploiements de modèles de fdy-chat.
answer: { value: false }
explanation:
  correct:
    en: The guardrail blocks the detected attacks, and the result is returned to the calling application in the API response. It does not create security alerts in Defender for Cloud or the Defender portal; those alerts come from the Defender for AI Services plan, which combines Prompt Shields signals with Microsoft threat intelligence.
    fr: "Le garde-fou bloque les attaques détectées et le résultat est renvoyé à l'application appelante dans la réponse de l'API. Il ne crée pas d'alertes de sécurité dans Defender for Cloud ni dans le portail Defender : ces alertes proviennent du plan Defender for AI Services, qui combine les signaux de Prompt Shields avec le renseignement sur les menaces de Microsoft."
references:
  - title: Guardrails and controls overview in Microsoft Foundry - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
  - title: AI threat protection in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection
