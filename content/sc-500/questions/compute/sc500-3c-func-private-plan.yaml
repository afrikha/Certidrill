id: sc500-3c-func-private-plan
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a function app named **func-claims** that runs in a Consumption plan. A virtual network named **VNet1** contains the applications that call func-claims.

    You need to ensure that func-claims receives inbound requests only through a private IP address in VNet1. Requests from the internet must be impossible.

    What should you do first?
  fr: |
    Litware dispose d'une application de fonction nommée **func-claims** qui s'exécute dans un plan Consommation. Un réseau virtuel nommé **VNet1** contient les applications qui appellent func-claims.

    Vous devez vous assurer que func-claims ne reçoit les requêtes entrantes que par une adresse IP privée de VNet1. Les requêtes depuis Internet doivent être impossibles.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Create a private endpoint for func-claims in VNet1.", fr: "Créer un point de terminaison privé pour func-claims dans VNet1." } }
    - { id: b, text: { en: "Enable virtual network integration for func-claims with a subnet of VNet1.", fr: "Activer l'intégration au réseau virtuel de func-claims avec un sous-réseau de VNet1." } }
    - { id: c, text: { en: "Move func-claims to an Elastic Premium plan.", fr: "Déplacer func-claims vers un plan Premium élastique." } }
    - { id: d, text: { en: "Add an access restriction rule that allows only the address space of VNet1.", fr: "Ajouter une règle de restriction d'accès qui n'autorise que l'espace d'adressage de VNet1." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Private endpoints for function apps are supported on the Flex Consumption, Elastic Premium and Dedicated (App Service) plans, not on the Consumption plan. You must first move the app to a supported plan such as Elastic Premium, then create the private endpoint and disable public access."
    fr: "Les points de terminaison privés des applications de fonction sont pris en charge dans les plans Consommation flexible, Premium élastique et Dédié (App Service), pas dans le plan Consommation. Vous devez d'abord déplacer l'application vers un plan pris en charge, comme Premium élastique, puis créer le point de terminaison privé et désactiver l'accès public."
  options:
    a:
      en: "The Consumption plan does not support private endpoints, so this step cannot be performed first."
      fr: "Le plan Consommation ne prend pas en charge les points de terminaison privés : cette étape ne peut pas être effectuée en premier."
    b:
      en: "Virtual network integration handles outbound traffic from the app to the virtual network; it does not give the app a private inbound address."
      fr: "L'intégration au réseau virtuel gère le trafic sortant de l'application vers le réseau virtuel ; elle ne donne pas d'adresse entrante privée à l'application."
    d:
      en: "Access restrictions filter callers, but the app keeps its public endpoint and receives requests on a public address."
      fr: "Les restrictions d'accès filtrent les appelants, mais l'application conserve son point de terminaison public et reçoit les requêtes sur une adresse publique."
references:
  - title: Securing Azure Functions
    url: https://learn.microsoft.com/en-us/azure/azure-functions/security-concepts
