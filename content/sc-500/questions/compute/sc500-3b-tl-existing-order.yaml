id: sc500-3b-tl-existing-order
objective: "3.2.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Windows Server VM named **VM2** that was created from an Azure Marketplace image. VM2 is a Generation 2 VM with the Standard security type, a size that supports Trusted launch, and no Azure Backup or Azure Site Recovery protection.

    You need to enable Trusted launch with secure boot and vTPM on VM2 by using the Azure portal, and then enable boot integrity monitoring by Microsoft Defender for Cloud.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'une machine virtuelle Windows Server nommée **VM2** créée à partir d'une image de la Place de marché Azure. VM2 est une machine virtuelle de génération 2 avec le type de sécurité Standard, une taille qui prend en charge le lancement fiable, et aucune protection par la Sauvegarde Azure ni par Azure Site Recovery.

    Vous devez activer le lancement fiable avec le démarrage sécurisé et le vTPM sur VM2 à l'aide du portail Azure, puis activer la surveillance de l'intégrité du démarrage par Microsoft Defender for Cloud.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: stop, text: { en: "Stop VM2.", fr: "Arrêter VM2." } }
    - { id: type, text: { en: "On the Configuration page of VM2, select Trusted launch in the Security type list.", fr: "Dans la page Configuration de VM2, sélectionner Trusted launch dans la liste Security type." } }
    - { id: save, text: { en: "Select the Secure Boot and vTPM check boxes, and then select Save.", fr: "Cocher Secure Boot et vTPM, puis sélectionner Save." } }
    - { id: start, text: { en: "Start VM2.", fr: "Démarrer VM2." } }
    - { id: ga, text: { en: "Install the Guest Attestation extension on VM2.", fr: "Installer l'extension Guest Attestation sur VM2." } }
    - { id: gen, text: { en: "Upgrade VM2 from Generation 1 to Generation 2.", fr: "Mettre à niveau VM2 de la génération 1 vers la génération 2." } }
    - { id: eah, text: { en: "Enable encryption at host on VM2.", fr: "Activer le chiffrement sur l'hôte sur VM2." } }
answer:
  sequence: [ stop, type, save, start, ga ]
explanation:
  correct:
    en: |
      For an existing Gen2 VM, you stop the VM, open the Configuration page, select Trusted launch as the security type, select Secure Boot and vTPM, save, and then start the VM. Boot integrity monitoring then needs the Guest Attestation extension, which you install on the running VM so that Defender for Cloud can attest its boot health.
    fr: |
      Pour une machine virtuelle de génération 2 existante, vous arrêtez la machine virtuelle, ouvrez la page Configuration, sélectionnez Trusted launch comme type de sécurité, cochez Secure Boot et vTPM, enregistrez, puis démarrez la machine virtuelle. La surveillance de l'intégrité du démarrage exige ensuite l'extension Guest Attestation, que vous installez sur la machine virtuelle en cours d'exécution pour que Defender for Cloud puisse attester l'intégrité de son démarrage.
  options:
    gen: { en: "VM2 is already a Generation 2 VM.", fr: "VM2 est déjà une machine virtuelle de génération 2." }
    eah: { en: "Encryption at host concerns disk encryption; it isn't required for Trusted launch or boot integrity monitoring.", fr: "Le chiffrement sur l'hôte concerne le chiffrement des disques ; il n'est exigé ni pour le lancement fiable ni pour la surveillance de l'intégrité du démarrage." }
references:
  - title: Enable Trusted launch on existing Gen2 VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch-existing-vm
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
