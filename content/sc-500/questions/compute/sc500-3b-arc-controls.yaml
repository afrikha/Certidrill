id: sc500-3b-arc-controls
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an on-premises Windows Server named **SRV1** that is connected to Azure Arc in a subscription named **Sub1**. Defender for Servers Plan 2 is enabled on Sub1.

    You need to extend Azure security controls to SRV1.

    Which two controls can you apply to SRV1 as an Azure Arc-enabled server?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un serveur Windows Server local nommé **SRV1** connecté à Azure Arc dans un abonnement nommé **Sub1**. Defender for Servers Plan 2 est activé sur Sub1.

    Vous devez étendre les contrôles de sécurité Azure à SRV1.

    Quels sont les deux contrôles que vous pouvez appliquer à SRV1 en tant que serveur avec Azure Arc ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Audit OS security settings with Azure Machine Configuration baseline policies", fr: "Auditer les paramètres de sécurité du système d'exploitation avec les stratégies de base de référence d'Azure Machine Configuration" } }
    - { id: b, text: { en: "Just-in-time VM access for RDP", fr: "L'accès juste-à-temps aux machines virtuelles pour RDP" } }
    - { id: c, text: { en: "File integrity monitoring from Defender for Servers Plan 2", fr: "La surveillance de l'intégrité des fichiers de Defender for Servers Plan 2" } }
    - { id: d, text: { en: "Agentless scanning for machines", fr: "L'analyse sans agent des machines" } }
    - { id: e, text: { en: "The Trusted launch security type with secure boot and vTPM", fr: "Le type de sécurité Lancement fiable avec démarrage sécurisé et vTPM" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      An Azure Arc-enabled server is an Azure resource, so Azure Policy and Machine Configuration can audit its guest OS settings. Defender for Servers Plan 2 features such as file integrity monitoring require on-premises machines to be onboarded through Azure Arc, which is the case for SRV1.
    fr: |
      Un serveur avec Azure Arc est une ressource Azure : Azure Policy et Machine Configuration peuvent donc auditer les paramètres de son système d'exploitation invité. Les fonctionnalités de Defender for Servers Plan 2, comme la surveillance de l'intégrité des fichiers, exigent que les machines locales soient intégrées via Azure Arc, ce qui est le cas de SRV1.
  options:
    b: { en: "Just-in-time access supports Resource Manager VMs and AWS EC2 instances; it works by changing NSG or Azure Firewall rules, which don't apply to an on-premises server.", fr: "L'accès juste-à-temps prend en charge les machines virtuelles Resource Manager et les instances AWS EC2 ; il modifie des règles de NSG ou de Pare-feu Azure, qui ne s'appliquent pas à un serveur local." }
    d: { en: "Agentless scanning snapshots cloud disks and is available for Azure VMs, AWS EC2 and GCP instances, not on-premises servers.", fr: "L'analyse sans agent prend des instantanés de disques cloud et est disponible pour les machines virtuelles Azure, AWS EC2 et les instances GCP, pas pour les serveurs locaux." }
    e: { en: "Trusted launch is a security type of Azure Generation 2 VMs; it can't be applied to physical or third-party servers.", fr: "Le lancement fiable est un type de sécurité des machines virtuelles Azure de génération 2 ; il ne s'applique pas à des serveurs physiques ou tiers." }
references:
  - title: Protect your servers with Defender for Servers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-servers-plan
  - title: Agentless machine scanning in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-agentless-data-collection
