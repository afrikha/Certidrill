id: sc500-3c-acr-abac-roles
objective: "3.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an Azure container registry named **acrshared**. Its **Role assignment permissions mode** is set to **RBAC Registry + ABAC Repository Permissions**. Several teams store images in repositories whose names start with `team-a/`, `team-b/` or `team-c/`.

    You need to grant the following access by using Microsoft Entra role assignments:

    - The managed identity **mi-build** must push and update images in the `team-a/` repositories only, without being able to delete images.
    - The managed identity **mi-cleanup** must delete old images in the `team-a/` repositories only.
    - The managed identity **mi-inventory** must list the names of all the repositories in the registry.

    The solution must use the principle of least privilege.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un registre de conteneurs Azure nommé **acrshared**. Son **Role assignment permissions mode** est défini sur **RBAC Registry + ABAC Repository Permissions**. Plusieurs équipes stockent des images dans des dépôts dont le nom commence par `team-a/`, `team-b/` ou `team-c/`.

    Vous devez accorder les accès suivants à l'aide d'attributions de rôles Microsoft Entra :

    - L'identité managée **mi-build** doit envoyer et mettre à jour des images dans les dépôts `team-a/` uniquement, sans pouvoir supprimer d'images.
    - L'identité managée **mi-cleanup** doit supprimer les anciennes images des dépôts `team-a/` uniquement.
    - L'identité managée **mi-inventory** doit lister les noms de tous les dépôts du registre.

    La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      mi-build: assign [[build]] with an ABAC condition on the repository name.
      mi-cleanup: assign [[cleanup]] with an ABAC condition on the repository name.
      mi-inventory: assign [[inventory]] at the registry scope.
    fr: |
      mi-build : attribuer [[build]] avec une condition ABAC sur le nom du dépôt.
      mi-cleanup : attribuer [[cleanup]] avec une condition ABAC sur le nom du dépôt.
      mi-inventory : attribuer [[inventory]] à l'étendue du registre.
  slots:
    - id: build
      options:
        - { id: push, text: AcrPush }
        - { id: writer, text: Container Registry Repository Writer }
        - { id: contrib, text: Container Registry Repository Contributor }
        - { id: owner, text: Owner }
    - id: cleanup
      options:
        - { id: delete, text: AcrDelete }
        - { id: writer, text: Container Registry Repository Writer }
        - { id: contrib, text: Container Registry Repository Contributor }
        - { id: cfgadmin, text: Container Registry Contributor and Data Access Configuration Administrator }
    - id: inventory
      options:
        - { id: reader, text: Reader }
        - { id: repreader, text: Container Registry Repository Reader }
        - { id: lister, text: Container Registry Repository Catalog Lister }
        - { id: cfgreader, text: Container Registry Configuration Reader and Data Access Configuration Reader }
answer:
  values: { build: writer, cleanup: contrib, inventory: lister }
explanation:
  correct:
    en: "In an ABAC-enabled registry, data plane access comes from the Container Registry Repository roles, which accept ABAC conditions on the repository. Repository Writer pushes, pulls and updates but cannot delete; Repository Contributor adds delete. Listing repositories requires Container Registry Repository Catalog Lister, which does not support ABAC and therefore applies to the whole registry."
    fr: "Dans un registre où ABAC est activé, l'accès au plan de données provient des rôles Container Registry Repository, qui acceptent des conditions ABAC sur le dépôt. Repository Writer envoie, extrait et met à jour, mais ne supprime pas ; Repository Contributor ajoute la suppression. Lister les dépôts nécessite Container Registry Repository Catalog Lister, qui ne prend pas en charge ABAC et s'applique donc à tout le registre."
  options:
    push: { en: "AcrPush, AcrPull and AcrDelete are not honored in an ABAC-enabled registry.", fr: "AcrPush, AcrPull et AcrDelete ne sont pas pris en compte dans un registre où ABAC est activé." }
    delete: { en: "AcrDelete is not honored in an ABAC-enabled registry; Repository Contributor is its equivalent.", fr: "AcrDelete n'est pas pris en compte dans un registre où ABAC est activé ; Repository Contributor en est l'équivalent." }
    owner: { en: "In this mode, Owner, Contributor and Reader grant only control plane permissions.", fr: "Dans ce mode, Owner, Contributor et Reader n'accordent que des autorisations sur le plan de contrôle." }
    repreader: { en: "The repository roles do not include catalog listing permissions.", fr: "Les rôles de dépôt n'incluent pas l'autorisation de lister le catalogue." }
    cfgreader: { en: "This role reads registry configuration only and has no data plane access.", fr: "Ce rôle lit uniquement la configuration du registre et n'a aucun accès au plan de données." }
references:
  - title: Azure attribute-based access control (Azure ABAC) repository permissions in Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-rbac-abac-repository-permissions
  - title: Azure Container Registry Microsoft Entra permissions and role assignments overview
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-rbac-built-in-roles-overview
