id: sc500-3a-gw-existing-instance
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Foundry resource named **foundry-prod** in the subscription **Sub1**. You plan to add an AI Gateway to foundry-prod by selecting **Use existing**. The subscriptions contain the API Management instances shown in the following table.

    | Instance | Subscription | Tier | Your role on the instance |
    | --- | --- | --- | --- |
    | apim-a | Sub1 | Premium | API Management Service Contributor |
    | apim-b | Sub2 | Standard v2 | API Management Service Contributor |
    | apim-c | Sub1 | Standard v2 | API Management Service Contributor |
    | apim-d | Sub1 | Premium v2 | Reader |

    Which instance appears in the **Use existing** list?
  fr: |
    Contoso, Ltd. dispose d'une ressource Microsoft Foundry nommée **foundry-prod** dans l'abonnement **Sub1**. Vous prévoyez d'ajouter une passerelle AI Gateway à foundry-prod en sélectionnant **Use existing**. Les abonnements contiennent les instances Gestion des API présentées dans le tableau suivant.

    | Instance | Abonnement | Niveau | Votre rôle sur l'instance |
    | --- | --- | --- | --- |
    | apim-a | Sub1 | Premium | API Management Service Contributor |
    | apim-b | Sub2 | Standard v2 | API Management Service Contributor |
    | apim-c | Sub1 | Standard v2 | API Management Service Contributor |
    | apim-d | Sub1 | Premium v2 | Reader |

    Quelle instance apparaît dans la liste **Use existing** ?
body:
  options:
    - { id: a, text: apim-a }
    - { id: b, text: apim-b }
    - { id: c, text: apim-c }
    - { id: d, text: apim-d }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Use existing list only shows API Management instances that are in the same Microsoft Entra tenant and the same subscription as the Foundry resource, that use a v2 tier, and on which you have at least API Management Service Contributor. apim-c is the only instance that meets every condition.
    fr: |
      La liste Use existing n'affiche que les instances Gestion des API situées dans le même locataire Microsoft Entra et le même abonnement que la ressource Foundry, qui utilisent un niveau v2 et sur lesquelles vous disposez au moins du rôle API Management Service Contributor. apim-c est la seule instance qui remplit toutes les conditions.
  options:
    a:
      en: |
        apim-a uses the classic Premium tier, not a v2 tier.
      fr: |
        apim-a utilise le niveau Premium classique, pas un niveau v2.
    b:
      en: |
        apim-b is in another subscription than foundry-prod.
      fr: |
        apim-b se trouve dans un autre abonnement que foundry-prod.
    d:
      en: |
        You only have the Reader role on apim-d; at least API Management Service Contributor (or Owner) is required.
      fr: |
        Vous n'avez que le rôle Reader sur apim-d ; il faut au moins API Management Service Contributor (ou Owner).
references:
  - title: Configure AI Gateway in your Foundry resources
    url: https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal
