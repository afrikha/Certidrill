id: sc500-3a-gw-existing-instance
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Foundry resource named **foundry-prod**. An Azure API Management instance named **apim-c** publishes the model deployments and the MCP tools of foundry-prod, and applies an `llm-token-limit` policy to all its APIs. A resource-scope Gateway connection to apim-c exists in foundry-prod.

    The following workloads call the models or the tools.

    | Workload | Type | How it's configured |
    | --- | --- | --- |
    | App1 | Container app | Sends requests to the runtime endpoint of apim-c |
    | Agent1 | Agent in Foundry Agent Service | Uses the connected model of the apim-c connection |
    | Agent2 | Agent in Foundry Agent Service | Uses the connected model, and an MCP tool registered with the URL of the tool's backend |
    | App2 | Function app | Sends requests to the runtime endpoint of apim-c through a private endpoint |

    Which workload has requests that the token limits and the gateway logs of apim-c don't cover?
  fr: |
    Contoso, Ltd. dispose d'une ressource Microsoft Foundry nommée **foundry-prod**. Une instance Gestion des API Azure nommée **apim-c** publie les déploiements de modèles et les outils MCP de foundry-prod, et applique une stratégie `llm-token-limit` à toutes ses API. Une connexion Gateway à l'étendue de la ressource vers apim-c existe dans foundry-prod.

    Les charges de travail suivantes appellent les modèles ou les outils.

    | Charge de travail | Type | Configuration |
    | --- | --- | --- |
    | App1 | Application de conteneur | Envoie ses requêtes au point de terminaison d'exécution d'apim-c |
    | Agent1 | Agent dans Foundry Agent Service | Utilise le modèle connecté de la connexion apim-c |
    | Agent2 | Agent dans Foundry Agent Service | Utilise le modèle connecté, et un outil MCP inscrit avec l'URL du back-end de l'outil |
    | App2 | Application de fonction | Envoie ses requêtes au point de terminaison d'exécution d'apim-c via un point de terminaison privé |

    Quelle charge de travail a des requêtes que les limites de jetons et les journaux de passerelle d'apim-c ne couvrent pas ?
body:
  options:
    - { id: a, text: App1 }
    - { id: b, text: Agent1 }
    - { id: c, text: Agent2 }
    - { id: d, text: App2 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The gateway enforces its policies only on traffic sent to its endpoint. An MCP tool registered with the direct backend URL is called without going through apim-c, so those tool calls bypass the gateway's policies and produce no gateway telemetry. The tool must be registered with its gateway-routed MCP endpoint.
    fr: |
      La passerelle n'applique ses stratégies qu'au trafic envoyé à son point de terminaison. Un outil MCP inscrit avec l'URL directe de son back-end est appelé sans passer par apim-c : ces appels d'outil contournent les stratégies de la passerelle et ne produisent aucune télémétrie de passerelle. L'outil doit être inscrit avec son point de terminaison MCP routé par la passerelle.
  options:
    a:
      en: |
        App1 uses the gateway runtime endpoint, so its requests go through apim-c and its policies.
      fr: |
        App1 utilise le point de terminaison d'exécution de la passerelle : ses requêtes passent par apim-c et ses stratégies.
    b:
      en: |
        An agent that uses the connected model calls the model through the gateway connection, not through a raw backend endpoint.
      fr: |
        Un agent qui utilise le modèle connecté appelle le modèle via la connexion de passerelle, et non via un point de terminaison de back-end direct.
    d:
      en: |
        A private endpoint only changes the network path to apim-c; the requests still reach the gateway endpoint and its policies apply.
      fr: |
        Un point de terminaison privé ne change que le chemin réseau vers apim-c ; les requêtes atteignent toujours le point de terminaison de la passerelle et ses stratégies s'appliquent.
references:
  - title: Configure Azure AI Gateway in your Foundry resources
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/configuration/enable-ai-api-management-gateway-portal
