id: sc500-3a-gw-existing-project
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Microsoft Foundry resource that contains the projects **proj-legal** and **proj-hr**. Both projects existed before you added an AI Gateway to the resource. Yesterday, you created a third project named **proj-sales**.

    You set tokens-per-minute limits for all three projects in **Token management**. The limits are enforced for proj-sales only. Requests from proj-legal and proj-hr reach the model deployments directly.

    You need the limits to be enforced for proj-legal and proj-hr.

    What should you do?
  fr: |
    Fabrikam, Inc. dispose d'une ressource Microsoft Foundry qui contient les projets **proj-legal** et **proj-hr**. Les deux projets existaient avant que vous n'ajoutiez une passerelle AI Gateway à la ressource. Hier, vous avez créé un troisième projet nommé **proj-sales**.

    Vous définissez des limites de jetons par minute pour les trois projets dans **Token management**. Les limites ne sont appliquées que pour proj-sales. Les requêtes de proj-legal et de proj-hr atteignent directement les déploiements de modèles.

    Vous devez faire en sorte que les limites soient appliquées pour proj-legal et proj-hr.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a second AI Gateway to the Foundry resource for proj-legal and proj-hr.", fr: "Ajouter une seconde passerelle AI Gateway à la ressource Foundry pour proj-legal et proj-hr." } }
    - { id: b, text: { en: "Move proj-legal and proj-hr to a new Foundry resource.", fr: "Déplacer proj-legal et proj-hr vers une nouvelle ressource Foundry." } }
    - { id: c, text: { en: "Replace the tokens-per-minute limits with a total token quota.", fr: "Remplacer les limites de jetons par minute par un quota total de jetons." } }
    - { id: d, text: { en: "Open the gateway and select Add project to gateway for proj-legal and proj-hr.", fr: "Ouvrir la passerelle et sélectionner Add project to gateway pour proj-legal et proj-hr." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AI Gateway is enabled at the Foundry resource level and shared by its projects. New projects are enabled automatically, but projects that existed before the gateway was added must be added manually with Add project to gateway; the Gateway status column then shows Enabled and their traffic goes through API Management, where the limits are enforced.
    fr: |
      AI Gateway s'active au niveau de la ressource Foundry et est partagée par ses projets. Les nouveaux projets sont activés automatiquement, mais les projets qui existaient avant l'ajout de la passerelle doivent être ajoutés manuellement avec Add project to gateway ; la colonne Gateway status affiche alors Enabled et leur trafic passe par Gestion des API, où les limites sont appliquées.
  options:
    a:
      en: |
        A Foundry resource uses one gateway shared by all its projects; the problem is that the two projects are not enabled on it.
      fr: |
        Une ressource Foundry utilise une passerelle partagée par tous ses projets ; le problème est que les deux projets n'y sont pas activés.
    b:
      en: |
        Separate Foundry resources are for strict isolation with separate gateways; moving the projects adds effort and does not enable them on a gateway by itself.
      fr: |
        Des ressources Foundry séparées servent à une isolation stricte avec des passerelles distinctes ; déplacer les projets ajoute du travail et ne les active pas à lui seul sur une passerelle.
    c:
      en: |
        A quota is enforced by the same gateway, so it is not applied either while the projects bypass it.
      fr: |
        Un quota est appliqué par la même passerelle : il ne s'applique donc pas non plus tant que les projets la contournent.
references:
  - title: Configure AI Gateway in your Foundry resources
    url: https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal
