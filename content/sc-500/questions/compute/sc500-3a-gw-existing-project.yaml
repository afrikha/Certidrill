id: sc500-3a-gw-existing-project
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Microsoft Foundry resource that contains the projects **proj-legal**, **proj-hr** and **proj-sales**. An Azure API Management instance named **apim-fab** publishes the models of the resource and enforces token limits.

    Last month, you created a project-scope Gateway connection to apim-fab in proj-sales. The agents of proj-sales use its connected model, and their limits are enforced. The agents of proj-legal and proj-hr must now consume the models through apim-fab too.

    You need to make the gateway available to the three projects. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam, Inc. dispose d'une ressource Microsoft Foundry qui contient les projets **proj-legal**, **proj-hr** et **proj-sales**. Une instance Gestion des API Azure nommée **apim-fab** publie les modèles de la ressource et applique des limites de jetons.

    Le mois dernier, vous avez créé dans proj-sales une connexion Gateway à l'étendue du projet vers apim-fab. Les agents de proj-sales utilisent son modèle connecté, et leurs limites sont appliquées. Les agents de proj-legal et de proj-hr doivent maintenant consommer eux aussi les modèles via apim-fab.

    Vous devez rendre la passerelle disponible pour les trois projets. La solution doit réduire au minimum l'effort administratif.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy a second API Management instance for proj-legal and proj-hr.", fr: "Déployer une seconde instance Gestion des API pour proj-legal et proj-hr." } }
    - { id: b, text: { en: "Create a project-scope Gateway connection in proj-legal and another one in proj-hr.", fr: "Créer une connexion Gateway à l'étendue du projet dans proj-legal et une autre dans proj-hr." } }
    - { id: c, text: { en: "Open apim-fab in Foundry, and then select Add project to gateway.", fr: "Ouvrir apim-fab dans Foundry, puis sélectionner Add project to gateway." } }
    - { id: d, text: { en: "Create the Gateway connection at the scope of the Foundry resource.", fr: "Créer la connexion Gateway à l'étendue de la ressource Foundry." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A project-scope connection is limited to the project that holds it. A resource-scope connection created on the parent Foundry resource can be available across its projects, and you assign it to the projects where project assignment is available, so one connection serves the three projects.
    fr: |
      Une connexion à l'étendue du projet est limitée au projet qui la contient. Une connexion à l'étendue de la ressource, créée sur la ressource Foundry parente, peut être disponible pour tous ses projets, et vous l'attribuez aux projets lorsque l'attribution aux projets est disponible : une seule connexion sert ainsi les trois projets.
  options:
    a:
      en: |
        A second instance adds cost and administration; the existing gateway can serve every project of the resource through one connection.
      fr: |
        Une seconde instance ajoute du coût et de l'administration ; la passerelle existante peut servir tous les projets de la ressource par une seule connexion.
    b:
      en: |
        Two more project-scope connections would work, but they leave three connections to maintain instead of one resource-scope connection.
      fr: |
        Deux connexions supplémentaires à l'étendue du projet fonctionneraient, mais elles laissent trois connexions à maintenir au lieu d'une seule connexion à l'étendue de la ressource.
    c:
      en: |
        Add project to gateway belonged to the earlier preview experience that linked API Management from the Foundry portal; new API Management links can no longer be created there.
      fr: |
        Add project to gateway appartenait à l'ancienne expérience en préversion qui liait API Management depuis le portail Foundry ; on ne peut plus y créer de nouveau lien API Management.
references:
  - title: Configure Azure AI Gateway in your Foundry resources
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/configuration/enable-ai-api-management-gateway-portal
