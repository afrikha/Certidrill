id: sc500-3c-waf-exclusion
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Application Gateway WAF_v2 named **agw-store** with a WAF policy named **wafp-store** in **Prevention** mode. The policy uses the OWASP CRS 3.2 managed rule set.

    After a release, legitimate requests are blocked by the SQL injection rule 942270, because the value of a custom request header named **X-Cart-State** contains special characters. Rule 942270 must keep inspecting the rest of every request, and every other rule must keep inspecting X-Cart-State. Prevention mode must stay enabled.

    What should you configure in wafp-store?
  fr: |
    Northwind dispose d'une Application Gateway WAF_v2 nommée **agw-store** avec une stratégie WAF nommée **wafp-store** en mode **Prevention**. La stratégie utilise l'ensemble de règles managées OWASP CRS 3.2.

    Après une mise en production, des requêtes légitimes sont bloquées par la règle d'injection SQL 942270, car la valeur d'un en-tête de requête personnalisé nommé **X-Cart-State** contient des caractères spéciaux. La règle 942270 doit continuer d'inspecter le reste de chaque requête, et toutes les autres règles doivent continuer d'inspecter X-Cart-State. Le mode Prevention doit rester activé.

    Que devez-vous configurer dans wafp-store ?
body:
  options:
    - { id: a, text: { en: "A global exclusion for the request header value X-Cart-State", fr: "Une exclusion globale pour la valeur de l'en-tête de requête X-Cart-State" } }
    - { id: b, text: { en: "A per-rule exclusion for the request header value X-Cart-State, applied to rule 942270", fr: "Une exclusion par règle pour la valeur de l'en-tête de requête X-Cart-State, appliquée à la règle 942270" } }
    - { id: c, text: { en: "A custom rule that allows requests that contain the X-Cart-State header", fr: "Une règle personnalisée qui autorise les requêtes contenant l'en-tête X-Cart-State" } }
    - { id: d, text: { en: "A managed rule override that disables rule 942270", fr: "Une substitution de règle managée qui désactive la règle 942270" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An exclusion removes one request attribute from WAF evaluation while the rest of the request is still inspected. With CRS 3.2 or later, a per-rule exclusion on `RequestHeaderValues` with the selector X-Cart-State can be limited to rule 942270, so every other rule still inspects the header."
    fr: "Une exclusion retire un attribut de la requête de l'évaluation du WAF, tandis que le reste de la requête est toujours inspecté. Avec CRS 3.2 ou ultérieur, une exclusion par règle sur `RequestHeaderValues` avec le sélecteur X-Cart-State peut être limitée à la règle 942270 : toutes les autres règles inspectent toujours l'en-tête."
  options:
    a:
      en: "A global exclusion stops every managed rule from inspecting the header, not only rule 942270."
      fr: "Une exclusion globale empêche toutes les règles managées d'inspecter l'en-tête, et pas seulement la règle 942270."
    c:
      en: "Custom rules run before managed rules, and a matching Allow rule stops processing, so those requests would skip every managed rule."
      fr: "Les règles personnalisées s'exécutent avant les règles managées, et une règle Allow correspondante arrête le traitement : ces requêtes échapperaient à toutes les règles managées."
    d:
      en: "Disabling rule 942270 would stop it from inspecting the rest of every request."
      fr: "Désactiver la règle 942270 l'empêcherait d'inspecter le reste de chaque requête."
references:
  - title: Web Application Firewall exclusion lists
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-waf-configuration
