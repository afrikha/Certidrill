id: sc500-3c-acr-scope-token
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Standard tier Azure container registry named **acrfactory** that contains the repositories **edge/agent**, **edge/telemetry** and **internal/billing**. Devices on the factory floor must pull images from the edge/agent repository. The devices cannot authenticate with Microsoft Entra ID.

    You need to provide the devices with credentials that allow pulling from edge/agent only.

    What should you do?
  fr: |
    Proseware dispose d'un registre de conteneurs Azure de niveau Standard nommé **acrfactory** qui contient les dépôts **edge/agent**, **edge/telemetry** et **internal/billing**. Des appareils de l'atelier de production doivent extraire des images du dépôt edge/agent. Les appareils ne peuvent pas s'authentifier auprès de Microsoft Entra ID.

    Vous devez fournir aux appareils des informations d'identification qui permettent d'extraire des images du dépôt edge/agent uniquement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the admin user and give its password to the devices.", fr: "Activer l'utilisateur administrateur et fournir son mot de passe aux appareils." } }
    - { id: b, text: { en: "Enable anonymous pull access on the registry.", fr: "Activer l'accès d'extraction anonyme sur le registre." } }
    - { id: c, text: { en: "Create a scope map for edge/agent pulls and a token that uses it.", fr: "Créer un mappage d'étendue (scope map) pour l'extraction depuis edge/agent et un jeton qui l'utilise." } }
    - { id: d, text: { en: "Create a service principal and assign it the AcrPull role on the registry.", fr: "Créer un principal de service et lui attribuer le rôle AcrPull sur le registre." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Non-Microsoft Entra tokens with scope maps grant repository-scoped permissions, which is the documented option for unattended pulls from a repository by a system or external device. Tokens and scope maps are available in every tier, including Standard."
    fr: "Les jetons non Microsoft Entra associés à des mappages d'étendue (scope maps) accordent des autorisations limitées à des dépôts : c'est l'option documentée pour les extractions automatisées depuis un dépôt par un système ou un appareil externe. Les jetons et les mappages d'étendue sont disponibles dans tous les niveaux, y compris Standard."
  options:
    a:
      en: "The admin user always has pull and push access to the whole registry, and it is intended for a single user."
      fr: "L'utilisateur administrateur a toujours accès en extraction et en envoi à tout le registre, et il est destiné à un seul utilisateur."
    b:
      en: "Anonymous pull would expose every repository, including internal/billing, to anyone."
      fr: "L'extraction anonyme exposerait tous les dépôts, y compris internal/billing, à n'importe qui."
    d:
      en: "A service principal is a Microsoft Entra identity, which the devices cannot use, and AcrPull at registry scope covers every repository."
      fr: "Un principal de service est une identité Microsoft Entra, que les appareils ne peuvent pas utiliser, et AcrPull à l'étendue du registre couvre tous les dépôts."
references:
  - title: Authenticate with Azure Container Registry
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-authentication
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
