id: sc500-3b-tl-attestation
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a Windows Server VM named **VM1** that uses the Trusted launch security type with secure boot and vTPM enabled. Defender for Servers Plan 2 is enabled on the subscription.

    You need Microsoft Defender for Cloud to verify the boot integrity of VM1 remotely and to raise an alert if the boot chain is compromised.

    What should you do?
  fr: |
    Adatum dispose d'une machine virtuelle Windows Server nommée **VM1** qui utilise le type de sécurité Lancement fiable avec le démarrage sécurisé et le vTPM activés. Defender for Servers Plan 2 est activé sur l'abonnement.

    Microsoft Defender for Cloud doit vérifier à distance l'intégrité du démarrage de VM1 et générer une alerte si la chaîne de démarrage est compromise.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable encryption at host on VM1", fr: "Activer le chiffrement sur l'hôte sur VM1" } }
    - { id: b, text: { en: "Turn on file integrity monitoring for VM1", fr: "Activer la surveillance de l'intégrité des fichiers pour VM1" } }
    - { id: c, text: { en: "Change the security type of VM1 to Confidential virtual machine", fr: "Changer le type de sécurité de VM1 en machine virtuelle confidentielle" } }
    - { id: d, text: { en: "Install the Guest Attestation extension on VM1", fr: "Installer l'extension Guest Attestation sur VM1" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Boot integrity monitoring requires secure boot, vTPM and the Guest Attestation extension. With the extension installed, Defender for Cloud attests the boot health of the VM remotely and raises a VM attestation failure alert when the boot chain deviates.
    fr: |
      La surveillance de l'intégrité du démarrage exige le démarrage sécurisé, le vTPM et l'extension Guest Attestation. Une fois l'extension installée, Defender for Cloud atteste à distance l'intégrité du démarrage de la machine virtuelle et génère une alerte d'échec d'attestation quand la chaîne de démarrage s'écarte de la normale.
  options:
    a: { en: "Encryption at host protects data at rest and in transit to storage; it doesn't attest the boot chain.", fr: "Le chiffrement sur l'hôte protège les données au repos et en transit vers le stockage ; il n'atteste pas la chaîne de démarrage." }
    b: { en: "File integrity monitoring tracks changes to files and registry keys in the running OS, not the integrity of the boot process.", fr: "La surveillance de l'intégrité des fichiers suit les modifications des fichiers et des clés de Registre du système d'exploitation en cours d'exécution, pas l'intégrité du processus de démarrage." }
    c: { en: "A confidential VM isn't needed; Trusted launch already provides secure boot and vTPM, and the missing piece is the attestation extension.", fr: "Une machine virtuelle confidentielle n'est pas nécessaire : le lancement fiable fournit déjà le démarrage sécurisé et le vTPM, il ne manque que l'extension d'attestation." }
references:
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
