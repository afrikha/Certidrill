id: sc500-sr1-jit-rdp-1
objective: "3.2.3"
type: series_yesno
series: sc500-sr1-jit-rdp
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You enable Defender for Servers Plan 2, delete Allow-RDP and enable JIT.
  fr: Vous activez Defender for Servers Plan 2, supprimez Allow-RDP et activez JIT.
body:
  solution:
    en: |
      You enable **Defender for Servers Plan 2** on Sub1. You delete the Allow-RDP rule from NSG1. You enable just-in-time (JIT) VM access on VM1 to VM10 for port **3389** with a maximum request time of **3 hours**.
    fr: |
      Vous activez **Defender for Servers Plan 2** sur Sub1. Vous supprimez la règle Allow-RDP de NSG1. Vous activez l'accès juste-à-temps (JIT) aux machines virtuelles sur VM1 à VM10 pour le port **3389** avec une durée maximale de demande de **3 heures**.
answer: { value: true }
explanation:
  correct:
    en: |
      JIT VM access requires Defender for Servers Plan 2 and an NSG or an Azure Firewall, and it supports VMs deployed through Azure Resource Manager. Without Allow-RDP, the deny rule that JIT ensures for port 3389 blocks RDP by default. An approved request allows port 3389 from the requested IP address for the requested time, then the NSG returns to its previous state.
    fr: |
      L'accès JIT aux machines virtuelles exige Defender for Servers Plan 2 et un NSG ou un Azure Firewall, et il prend en charge les machines virtuelles déployées via Azure Resource Manager. Sans Allow-RDP, la règle de refus que JIT garantit pour le port 3389 bloque le RDP par défaut. Une demande approuvée autorise le port 3389 depuis l'adresse IP demandée pendant la durée demandée, puis le NSG revient à son état précédent.
references:
  - title: Enable Just-in-Time Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
  - title: Just-in-time machine access in Microsoft Defender for Cloud
