id: sc500-3a-rtp-provider-order
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses a non-Microsoft threat detection service that exposes a REST endpoint for Copilot Studio. You need to enable external threat detection for the custom agents in the Power Platform environment **Prod-Sales**. If the service doesn't answer in time, the agents must not run the tool. No client secret may be created.

    You are a Power Platform Administrator and can create app registrations.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. utilise un service de détection des menaces non Microsoft qui expose un point de terminaison REST pour Copilot Studio. Vous devez activer la détection externe des menaces pour les agents personnalisés de l'environnement Power Platform **Prod-Sales**. Si le service ne répond pas à temps, les agents ne doivent pas exécuter l'outil. Aucune clé secrète client ne doit être créée.

    Vous êtes Power Platform Administrator et pouvez créer des inscriptions d'applications.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: app, text: { en: "Register a single-tenant Microsoft Entra application and add a federated credential for the provider endpoint.", fr: "Inscrire une application Microsoft Entra monolocataire et ajouter des informations d'identification fédérées pour le point de terminaison du fournisseur." } }
    - { id: open, text: { en: "In the Power Platform admin center, go to Security > Threat detection > Additional threat detection, select Prod-Sales, and select Set up.", fr: "Dans le Centre d'administration Power Platform, accéder à Security > Threat detection > Additional threat detection, sélectionner Prod-Sales, puis Set up." } }
    - { id: share, text: { en: "Select Allow Copilot Studio to share data with a threat detection provider, and enter the App ID and the endpoint link.", fr: "Sélectionner Allow Copilot Studio to share data with a threat detection provider, puis saisir l'App ID et le lien du point de terminaison." } }
    - { id: error, text: { en: "Set Set error behavior to Block the query, and select Save.", fr: "Régler Set error behavior sur Block the query, puis sélectionner Save." } }
    - { id: secret, text: { en: "Add a client secret to the application and send it to the provider.", fr: "Ajouter une clé secrète client à l'application et l'envoyer au fournisseur." } }
    - { id: tenant, text: { en: "Configure the provider once at the tenant level so that it applies to all current and future environments.", fr: "Configurer le fournisseur une seule fois au niveau du locataire pour qu'il s'applique à tous les environnements actuels et futurs." } }
answer:
  sequence: [ app, open, share, error ]
explanation:
  correct:
    en: |
      The App ID of a single-tenant Entra application with a federated identity credential is needed before the admin center configuration. In the Power Platform admin center, threat detection is set up per environment under Security > Threat detection > Additional threat detection, where you allow data sharing and enter the App ID and endpoint. Set error behavior defaults to Allow the agent to respond, which lets the tool run when no decision arrives within one second; Block the query meets the requirement.
    fr: |
      L'App ID d'une application Entra monolocataire dotée d'informations d'identification fédérées est nécessaire avant la configuration dans le Centre d'administration. Dans le Centre d'administration Power Platform, la détection des menaces se configure par environnement sous Security > Threat detection > Additional threat detection, où vous autorisez le partage de données et saisissez l'App ID et le point de terminaison. Set error behavior vaut par défaut Allow the agent to respond, qui laisse l'outil s'exécuter si aucune décision n'arrive en une seconde ; Block the query répond à l'exigence.
  options:
    secret:
      en: |
        The application authenticates with a federated identity credential; no client secret is used, and the requirement forbids one.
      fr: |
        L'application s'authentifie avec des informations d'identification fédérées ; aucune clé secrète client n'est utilisée, et l'exigence l'interdit.
    tenant:
      en: |
        There is no tenant-wide setting: threat detection is configured for each environment, including environments created later.
      fr: |
        Il n'existe pas de paramètre à l'échelle du locataire : la détection des menaces se configure pour chaque environnement, y compris pour les environnements créés plus tard.
references:
  - title: Enable external threat detection and protection for Copilot Studio custom agents (preview)
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/external-security-provider
