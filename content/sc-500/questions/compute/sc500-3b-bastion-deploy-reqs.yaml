id: sc500-3b-bastion-deploy-reqs
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a virtual network named **VNet1** with the address space 10.20.0.0/16. VNet1 contains virtual machines that have no public IP addresses.

    You plan to deploy Azure Bastion with the Standard SKU in VNet1 so that administrators can connect to the VMs over RDP and SSH.

    Which two requirements must be met for the deployment? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un réseau virtuel nommé **VNet1** dont l'espace d'adressage est 10.20.0.0/16. VNet1 contient des machines virtuelles qui n'ont pas d'adresse IP publique.

    Vous prévoyez de déployer Azure Bastion avec la SKU Standard dans VNet1 pour que les administrateurs puissent se connecter aux machines virtuelles en RDP et en SSH.

    Quelles sont les deux exigences à respecter pour le déploiement ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A subnet named AzureBastionSubnet with a /26 or larger prefix that contains no other resources", fr: "Un sous-réseau nommé AzureBastionSubnet avec un préfixe /26 ou plus grand, qui ne contient aucune autre ressource" } }
    - { id: b, text: { en: "A network security group associated with AzureBastionSubnet", fr: "Un groupe de sécurité réseau associé à AzureBastionSubnet" } }
    - { id: c, text: { en: "A public IP address with the Standard SKU and static allocation", fr: "Une adresse IP publique avec la SKU Standard et une allocation statique" } }
    - { id: d, text: { en: "A subnet named BastionSubnet with a /27 or larger prefix", fr: "Un sous-réseau nommé BastionSubnet avec un préfixe /27 ou plus grand" } }
    - { id: e, text: { en: "A public IP address on each target virtual machine", fr: "Une adresse IP publique sur chaque machine virtuelle cible" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Every Bastion SKU except Developer needs a dedicated subnet named exactly AzureBastionSubnet, /26 or larger, in the same virtual network, with no other resources. Except for the Developer SKU and Premium private-only deployments, Bastion also needs a public IP address with the Standard SKU and static allocation.
    fr: |
      Toutes les SKU de Bastion sauf Developer exigent un sous-réseau dédié nommé exactement AzureBastionSubnet, /26 ou plus grand, dans le même réseau virtuel, sans aucune autre ressource. Sauf pour la SKU Developer et les déploiements Premium privés uniquement, Bastion exige aussi une adresse IP publique avec la SKU Standard et une allocation statique.
  options:
    b: { en: "An NSG on AzureBastionSubnet is optional; if you apply one, it must contain all the required rules.", fr: "Un NSG sur AzureBastionSubnet est facultatif ; si vous en appliquez un, il doit contenir toutes les règles exigées." }
    d: { en: "The subnet must be named exactly AzureBastionSubnet and be /26 or larger.", fr: "Le sous-réseau doit être nommé exactement AzureBastionSubnet et être /26 ou plus grand." }
    e: { en: "Bastion connects to the VMs over their private IP addresses; the VMs need no public IP address.", fr: "Bastion se connecte aux machines virtuelles par leurs adresses IP privées ; elles n'ont besoin d'aucune adresse IP publique." }
references:
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
