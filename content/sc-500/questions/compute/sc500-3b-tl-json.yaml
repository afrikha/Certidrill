id: sc500-3b-tl-json
objective: "3.2.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware deploys Generation 2 virtual machines by using an ARM template. The VM size and the Marketplace image support Trusted launch.

    You need each VM to start only signed boot components and to have a virtual TPM 2.0.

    How should you complete the `securityProfile` section of the VM resource? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware déploie des machines virtuelles de génération 2 à l'aide d'un modèle ARM. La taille de machine virtuelle et l'image de la Place de marché prennent en charge le lancement fiable.

    Chaque machine virtuelle ne doit démarrer que des composants de démarrage signés et doit disposer d'un TPM 2.0 virtuel.

    Comment devez-vous compléter la section `securityProfile` de la ressource de machine virtuelle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "securityProfile": {
      "securityType": [[type]],
      "uefiSettings": {
        [[boot]]: true,
        [[tpm]]: true
      }
    }
  slots:
    - id: type
      options:
        - { id: std, text: "\"Standard\"" }
        - { id: tl, text: "\"TrustedLaunch\"" }
        - { id: cvm, text: "\"ConfidentialVM\"" }
    - id: boot
      options:
        - { id: secboot, text: "\"secureBootEnabled\"" }
        - { id: host, text: "\"encryptionAtHost\"" }
        - { id: integrity, text: "\"bootDiagnostics\"" }
    - id: tpm
      options:
        - { id: vtpm, text: "\"vTpmEnabled\"" }
        - { id: ultra, text: "\"ultraSSDEnabled\"" }
        - { id: hib, text: "\"hibernationEnabled\"" }
answer:
  values: { type: tl, boot: secboot, tpm: vtpm }
explanation:
  correct:
    en: |
      The `TrustedLaunch` security type enables the Trusted launch features, and the `uefiSettings` object contains `secureBootEnabled`, so that only boot loaders, kernels and drivers signed by trusted publishers start, and `vTpmEnabled`, which provides a TPM 2.0-compliant virtual TPM.
    fr: |
      Le type de sécurité `TrustedLaunch` active les fonctionnalités du lancement fiable, et l'objet `uefiSettings` contient `secureBootEnabled`, pour que seuls des chargeurs de démarrage, noyaux et pilotes signés par des éditeurs approuvés démarrent, et `vTpmEnabled`, qui fournit un TPM virtuel conforme à TPM 2.0.
  options:
    std: { en: "Standard deploys the VM without Trusted launch, so without secure boot and vTPM.", fr: "Standard déploie la machine virtuelle sans lancement fiable, donc sans démarrage sécurisé ni vTPM." }
    cvm: { en: "ConfidentialVM requires confidential VM sizes; the requirement is met by Trusted launch on the selected size.", fr: "ConfidentialVM exige des tailles de machines virtuelles confidentielles ; le lancement fiable sur la taille choisie répond à l'exigence." }
    host: { en: "encryptionAtHost is a property of securityProfile itself, not of uefiSettings, and it concerns disk encryption.", fr: "encryptionAtHost est une propriété de securityProfile lui-même, pas de uefiSettings, et concerne le chiffrement des disques." }
    integrity: { en: "Boot diagnostics is configured in diagnosticsProfile; it doesn't enforce signed boot components.", fr: "Les diagnostics de démarrage se configurent dans diagnosticsProfile ; ils n'imposent pas de composants de démarrage signés." }
    ultra: { en: "ultraSSDEnabled is an additionalCapabilities property that allows Ultra Disks; it doesn't provide a TPM.", fr: "ultraSSDEnabled est une propriété de additionalCapabilities qui autorise les disques Ultra ; elle ne fournit pas de TPM." }
    hib: { en: "hibernationEnabled is an additionalCapabilities property, not a uefiSettings property, and it doesn't provide a TPM.", fr: "hibernationEnabled est une propriété de additionalCapabilities, pas de uefiSettings, et elle ne fournit pas de TPM." }
references:
  - title: Trusted Launch for Azure VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/trusted-launch
