id: sc500-cs3b-jit
objective: "3.2.3"
type: yesno_statements
caseStudy: sc500-cs3b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You plan to use just-in-time (JIT) VM access in Defender for Cloud to meet the RDP requirement.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser l'accès juste-à-temps (JIT) aux machines virtuelles de Defender for Cloud pour satisfaire l'exigence relative au RDP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          You can enable JIT VM access on VM-BOOK1 with the Defender for Servers plan that is currently enabled on Sub-Ops.
        fr: |-
          Vous pouvez activer l'accès JIT sur VM-BOOK1 avec le plan Defender for Servers actuellement activé sur Sub-Ops.
    - id: s2
      text:
        en: |-
          After the required plan is enabled, you can enable JIT VM access on VM-PAY1 without changing its network protection.
        fr: |-
          Une fois le plan requis activé, vous pouvez activer l'accès JIT sur VM-PAY1 sans modifier sa protection réseau.
    - id: s3
      text:
        en: |-
          With the default JIT settings, an access request for VM-BOOK1 opens port 3389 for at most three hours.
        fr: |-
          Avec les paramètres JIT par défaut, une demande d'accès à VM-BOOK1 ouvre le port 3389 pendant trois heures au maximum.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |-
      JIT VM access requires Defender for Servers Plan 2 on the subscription, and Sub-Ops has Plan 1. JIT needs a network security group or a supported Azure Firewall, but VMs protected by a firewall whose rules are managed by Azure Firewall Manager are not supported, and VM-PAY1 has no NSG. By default, JIT for a Windows VM uses port 3389 with a maximum allowed access of three hours.
    fr: |-
      L'accès JIT aux machines virtuelles exige Defender for Servers Plan 2 sur l'abonnement, et Sub-Ops a le Plan 1. JIT a besoin d'un groupe de sécurité réseau ou d'un Azure Firewall pris en charge ; or les machines protégées par un pare-feu dont les règles sont gérées par Azure Firewall Manager ne sont pas prises en charge, et VM-PAY1 n'a pas de groupe de sécurité réseau. Par défaut, JIT pour une machine Windows utilise le port 3389 avec un accès maximal autorisé de trois heures.
  options:
    s1:
      en: |-
        Plan 1 does not include JIT VM access; Plan 2 is required.
      fr: |-
        Le Plan 1 n'inclut pas l'accès JIT aux machines virtuelles ; le Plan 2 est requis.
    s2:
      en: |-
        VM-PAY1 has no NSG and is protected only by a firewall managed by Azure Firewall Manager, a configuration that JIT does not support.
      fr: |-
        VM-PAY1 n'a pas de groupe de sécurité réseau et n'est protégé que par un pare-feu géré par Azure Firewall Manager, configuration que JIT ne prend pas en charge.
references:
  - title: Enable Just-in-Time Access
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usage
