id: sc500-3c-logic-plans-access
objective: "3.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has two logic apps that start with a Request trigger:

    | Name | Hosting option |
    | --- | --- |
    | la-orders | Consumption |
    | la-stock | Standard |

    You need to meet the following requirements:

    - Both logic apps must accept inbound calls only from the partner range 203.0.113.0/24.
    - The operations team must be able to enable, disable and resubmit the workflows of la-stock, without being able to edit workflows or settings.

    The solution must use the principle of least privilege.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose de deux applications logiques qui commencent par un déclencheur Request :

    | Nom | Option d'hébergement |
    | --- | --- |
    | la-orders | Consommation |
    | la-stock | Standard |

    Vous devez répondre aux exigences suivantes :

    - Les deux applications logiques ne doivent accepter les appels entrants que depuis la plage partenaire 203.0.113.0/24.
    - L'équipe d'exploitation doit pouvoir activer, désactiver et resoumettre les workflows de la-stock, sans pouvoir modifier les workflows ni les paramètres.

    La solution doit respecter le principe du moindre privilège.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      la-orders inbound calls: [[orders]]
      la-stock inbound calls: [[stock]]
      Role for the operations team on la-stock: [[role]]
    fr: |
      Appels entrants de la-orders : [[orders]]
      Appels entrants de la-stock : [[stock]]
      Rôle de l'équipe d'exploitation sur la-stock : [[role]]
  slots:
    - id: orders
      options:
        - { id: wfs, text: "Workflow settings > Access control configuration > Specific IP ranges" }
        - { id: ar, text: "Networking > Inbound traffic configuration > Access restrictions" }
        - { id: authz, text: "Settings > Authorization > Add policy" }
    - id: stock
      options:
        - { id: wfs, text: "Workflow settings > Access control configuration > Specific IP ranges" }
        - { id: ar, text: "Networking > Inbound traffic configuration > Access restrictions" }
        - { id: authz, text: "Settings > Authorization > Add policy" }
    - id: role
      options:
        - { id: lao, text: Logic App Operator }
        - { id: stdop, text: Logic Apps Standard Operator }
        - { id: stddev, text: Logic Apps Standard Developer }
        - { id: stdread, text: Logic Apps Standard Reader }
answer:
  values: { orders: wfs, stock: ar, role: stdop }
explanation:
  correct:
    en: "A Consumption logic app restricts its callers in the access control configuration of its workflow settings, where you can enter specific IP ranges. A Standard logic app runs on the App Service platform and uses the access restrictions of its Networking page. Logic Apps Standard Operator can enable, resubmit and disable workflows but cannot edit workflows or settings."
    fr: "Une application logique Consommation limite ses appelants dans la configuration du contrôle d'accès de ses paramètres de workflow, où vous pouvez saisir des plages d'adresses IP précises. Une application logique Standard s'exécute sur la plateforme App Service et utilise les restrictions d'accès de sa page Networking. Logic Apps Standard Operator peut activer, resoumettre et désactiver des workflows, mais ne peut pas modifier les workflows ni les paramètres."
  options:
    authz: { en: "An authorization policy validates OAuth tokens; it does not filter caller IP addresses.", fr: "Une stratégie d'autorisation valide des jetons OAuth ; elle ne filtre pas les adresses IP des appelants." }
    lao: { en: "Logic App Operator is a Consumption role; Standard logic apps have their own Logic Apps Standard roles.", fr: "Logic App Operator est un rôle pour Consommation ; les applications logiques Standard ont leurs propres rôles Logic Apps Standard." }
    stddev: { en: "Logic Apps Standard Developer can create and edit workflows and settings, which exceeds the need.", fr: "Logic Apps Standard Developer peut créer et modifier des workflows et des paramètres, ce qui dépasse le besoin." }
    stdread: { en: "Logic Apps Standard Reader is read-only and cannot resubmit or disable workflows.", fr: "Logic Apps Standard Reader est en lecture seule et ne peut ni resoumettre ni désactiver de workflows." }
references:
  - title: Secure access and data for workflows in Azure Logic Apps
    url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-securing-a-logic-app
