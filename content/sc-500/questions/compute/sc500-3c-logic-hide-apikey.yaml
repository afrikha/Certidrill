id: sc500-3c-logic-hide-apikey
objective: "3.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a Consumption logic app named **la-shipping**. An HTTP action in the workflow calls a carrier API and sends an API key in a custom `x-api-key` request header. The key is currently typed directly in the action.

    You need to meet the following requirements:

    - The API key must not be returned with the workflow definition after deployment.
    - The API key must not be visible in the run history of the HTTP action.
    - Operators must still be able to view the response returned by the carrier API in the run history.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une application logique Consommation nommée **la-shipping**. Une action HTTP du workflow appelle l'API d'un transporteur et envoie une clé API dans un en-tête de requête personnalisé `x-api-key`. La clé est actuellement saisie directement dans l'action.

    Vous devez répondre aux exigences suivantes :

    - La clé API ne doit pas être renvoyée avec la définition du workflow après le déploiement.
    - La clé API ne doit pas être visible dans l'historique des exécutions de l'action HTTP.
    - Les opérateurs doivent toujours pouvoir consulter dans l'historique des exécutions la réponse renvoyée par l'API du transporteur.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable **Secure Outputs** on the HTTP action.", fr: "Activer **Secure Outputs** sur l'action HTTP." } }
    - { id: b, text: { en: "Store the key in a `securestring` workflow parameter and reference it with `@parameters()`.", fr: "Stocker la clé dans un paramètre de workflow `securestring` et la référencer avec `@parameters()`." } }
    - { id: c, text: { en: "Restrict access to the run history to the range `0.0.0.0-0.0.0.0`.", fr: "Limiter l'accès à l'historique des exécutions à la plage `0.0.0.0-0.0.0.0`." } }
    - { id: d, text: { en: "Enable **Secure Inputs** on the HTTP action.", fr: "Activer **Secure Inputs** sur l'action HTTP." } }
    - { id: e, text: { en: "Store the key in a `string` workflow parameter with a default value.", fr: "Stocker la clé dans un paramètre de workflow `string` avec une valeur par défaut." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: "Parameters of type `securestring` are not returned with the resource definition after deployment. A parameter used in a request header can still appear in the run history, so you also enable Secure Inputs on the HTTP action, which hides its inputs while leaving its outputs, including the carrier's response, visible."
    fr: "Les paramètres de type `securestring` ne sont pas renvoyés avec la définition de la ressource après le déploiement. Un paramètre utilisé dans un en-tête de requête peut néanmoins apparaître dans l'historique des exécutions : vous activez donc aussi Secure Inputs sur l'action HTTP, ce qui masque ses entrées tout en laissant visibles ses sorties, dont la réponse du transporteur."
  options:
    a:
      en: "Secure Outputs hides the carrier's response, which operators must still see, and does not hide the key sent in the inputs."
      fr: "Secure Outputs masque la réponse du transporteur, que les opérateurs doivent toujours voir, et ne masque pas la clé envoyée dans les entrées."
    c:
      en: "Blocking all access to run history would also prevent operators from viewing the response."
      fr: "Bloquer tout accès à l'historique des exécutions empêcherait aussi les opérateurs de consulter la réponse."
    e:
      en: "A `string` parameter and its default value are returned with the workflow definition."
      fr: "Un paramètre `string` et sa valeur par défaut sont renvoyés avec la définition du workflow."
references:
  - title: Secure access and data for workflows in Azure Logic Apps
    url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-securing-a-logic-app
