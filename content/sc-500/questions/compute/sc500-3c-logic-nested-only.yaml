id: sc500-3c-logic-nested-only
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Consumption logic app named **la-approve** that starts with a Request trigger. The workflow must be callable only as a nested workflow from other Consumption logic apps in the same subscription by using the built-in Azure Logic Apps action. Calls from any other client, including HTTP actions in other workflows, must be rejected.

    What should you configure?
  fr: |
    Contoso dispose d'une application logique Consommation nommée **la-approve** qui commence par un déclencheur Request. Le workflow ne doit pouvoir être appelé que comme workflow imbriqué, depuis d'autres applications logiques Consommation du même abonnement, à l'aide de l'action intégrée Azure Logic Apps. Les appels de tout autre client, y compris les actions HTTP d'autres workflows, doivent être rejetés.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "In **Workflow settings**, set **Allowed inbound IP addresses** to **Only other Logic Apps**.", fr: "Dans **Workflow settings**, définir **Allowed inbound IP addresses** sur **Only other Logic Apps**." } }
    - { id: b, text: { en: "In **Workflow settings**, set **Allowed inbound IP addresses** to **Specific IP ranges** with the Logic Apps outbound IPs.", fr: "Dans **Workflow settings**, définir **Allowed inbound IP addresses** sur **Specific IP ranges** avec les adresses IP sortantes de Logic Apps." } }
    - { id: c, text: { en: "In **Authorization**, add a policy that requires tokens issued by the Contoso tenant.", fr: "Dans **Authorization**, ajouter une stratégie qui exige des jetons émis par le locataire Contoso." } }
    - { id: d, text: { en: "Call `listCallbackUrl` with `NotAfter` and share the URL with the parent workflows.", fr: "Appeler `listCallbackUrl` avec `NotAfter` et partager l'URL avec les workflows parents." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The **Only other Logic Apps** option of the access control configuration allows only the built-in Azure Logic Apps action to call the workflow. A call from an HTTP action, even one running in another logic app, is rejected with a 401 error."
    fr: "L'option **Only other Logic Apps** de la configuration du contrôle d'accès n'autorise que l'action intégrée Azure Logic Apps à appeler le workflow. Un appel provenant d'une action HTTP, même exécutée dans une autre application logique, est rejeté avec une erreur 401."
  options:
    b:
      en: "An IP range would also accept HTTP actions and any other client that sends traffic from those addresses."
      fr: "Une plage d'adresses IP accepterait aussi les actions HTTP et tout autre client qui envoie du trafic depuis ces adresses."
    c:
      en: "An OAuth authorization policy accepts any caller that presents a valid token, whatever the client type."
      fr: "Une stratégie d'autorisation OAuth accepte tout appelant qui présente un jeton valide, quel que soit le type de client."
    d:
      en: "An expiring callback URL limits how long the SAS URL is valid, not which clients may use it."
      fr: "Une URL de rappel avec expiration limite la durée de validité de l'URL SAS, pas les clients qui peuvent l'utiliser."
references:
  - title: Secure access and data for workflows in Azure Logic Apps
    url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-securing-a-logic-app
