id: sc500-3b-m365-block-agent
objective: "3.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses Microsoft 365 Copilot. Users have installed about 40 agents, including several agents published by Adatum developers.

    The security team reports that an agent named **ExpenseHelper**, built with Copilot Studio and published by your organization, exposes confidential data. All the other agents must remain available to users.

    You need to stop all the users in the organization from using ExpenseHelper until the developers fix it.

    What should you do in the Microsoft 365 admin center?
  fr: |
    Adatum utilise Microsoft 365 Copilot. Les utilisateurs ont installé une quarantaine d'agents, dont plusieurs publiés par des développeurs d'Adatum.

    L'équipe de sécurité signale qu'un agent nommé **ExpenseHelper**, créé avec Copilot Studio et publié par votre organisation, expose des données confidentielles. Tous les autres agents doivent rester disponibles pour les utilisateurs.

    Vous devez empêcher tous les utilisateurs de l'organisation d'utiliser ExpenseHelper jusqu'à ce que les développeurs le corrigent.

    Que devez-vous faire dans le Centre d'administration Microsoft 365 ?
body:
  options:
    - { id: a, text: { en: "In Agents > Settings, turn off Allow agents and plugins built by your organization", fr: "Dans Agents > Settings, désactiver Allow agents and plugins built by your organization" } }
    - { id: b, text: { en: "In Agents > Settings, set User access to No users", fr: "Dans Agents > Settings, définir User access sur No users" } }
    - { id: c, text: { en: "In Agents > All agents, select ExpenseHelper and assign a new owner", fr: "Dans Agents > All agents, sélectionner ExpenseHelper et lui attribuer un nouveau propriétaire" } }
    - { id: d, text: { en: "In Agents > All agents, select ExpenseHelper and block it", fr: "Dans Agents > All agents, sélectionner ExpenseHelper et le bloquer" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Block applies to one agent across the organization; for a Copilot Studio agent it affects its availability in Microsoft Copilot and the other host apps such as Teams and Outlook. You can unblock the agent after the fix, and the other agents aren't affected.
    fr: |
      L'action Block s'applique à un seul agent dans toute l'organisation ; pour un agent Copilot Studio, elle agit sur sa disponibilité dans Microsoft Copilot et dans les autres applications hôtes comme Teams et Outlook. Vous pouvez débloquer l'agent après la correction, et les autres agents ne sont pas affectés.
  options:
    a: { en: "This setting hides every agent built by the organization from the Agent Store, not only ExpenseHelper.", fr: "Ce paramètre masque dans l'Agent Store tous les agents créés par l'organisation, pas seulement ExpenseHelper." }
    b: { en: "No users removes access to all agents and plugins for everyone, which breaks the other agents.", fr: "No users supprime l'accès à tous les agents et plug-ins pour tout le monde, ce qui coupe les autres agents." }
    c: { en: "Assigning a new owner changes who can edit the agent; users can still use it.", fr: "Attribuer un nouveau propriétaire change qui peut modifier l'agent ; les utilisateurs peuvent toujours l'utiliser." }
references:
  - title: Governance and Lifecycle actions for agents available in Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions
  - title: Agent settings in Microsoft 365 admin center
    url: https://learn.microsoft.com/en-us/microsoft-agent-365/admin/agent-settings
