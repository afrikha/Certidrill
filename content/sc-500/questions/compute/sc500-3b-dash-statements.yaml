id: sc500-3b-dash-statements
objective: "3.1.10"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware uses the Data and AI security dashboard in Microsoft Defender for Cloud to monitor an Azure subscription named **Sub1**. Defender CSPM with sensitive data discovery, Defender for Storage, Defender for Databases and the AI services plan are enabled on Sub1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise le tableau de bord de sécurité des données et de l'IA de Microsoft Defender for Cloud pour surveiller un abonnement Azure nommé **Sub1**. Defender CSPM avec la découverte des données sensibles, Defender for Storage, Defender for Databases et le plan AI services sont activés sur Sub1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The dashboard groups the data and AI estate into categories that include hosted databases (IaaS).
        fr: Le tableau de bord regroupe le patrimoine de données et d'IA en catégories qui incluent les bases de données hébergées (IaaS).
    - id: s2
      text:
        en: The settings that you open from **Manage Sensitivity Settings** apply only to Sub1.
        fr: Les paramètres que vous ouvrez depuis **Manage Sensitivity Settings** s'appliquent uniquement à Sub1.
    - id: s3
      text:
        en: The **Top issues** section lists attack paths with critical and high severities.
        fr: La section **Top issues** répertorie les chemins d'attaque de gravité critique et élevée.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The overview groups resources into storage assets, managed databases, hosted databases (IaaS) and AI services. Manage Sensitivity Settings opens the Data Sensitivity page, which customizes sensitivity settings at the tenant level, not per subscription. Top issues shows the highest-severity alerts and the critical and high recommendations and attack paths.
    fr: |
      La vue d'ensemble regroupe les ressources en ressources de stockage, bases de données managées, bases de données hébergées (IaaS) et services d'IA. Manage Sensitivity Settings ouvre la page Data Sensitivity, qui personnalise les paramètres de sensibilité au niveau du locataire, pas par abonnement. Top issues affiche les alertes de gravité la plus élevée ainsi que les recommandations et chemins d'attaque critiques et élevés.
references:
  - title: Data and AI security dashboard
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/data-aware-security-dashboard-overview
