id: sc500-3b-mc-identity
objective: "3.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans to audit the SSH settings of its Azure Linux VMs by using Azure Machine Configuration. You install the **AzurePolicyforLinux** extension on each VM.

    You need to ensure that each VM can authenticate to the Machine Configuration service.

    What else should each VM have?
  fr: |
    Fabrikam prévoit d'auditer les paramètres SSH de ses machines virtuelles Linux Azure à l'aide d'Azure Machine Configuration. Vous installez l'extension **AzurePolicyforLinux** sur chaque machine virtuelle.

    Chaque machine virtuelle doit pouvoir s'authentifier auprès du service Machine Configuration.

    De quoi chaque machine virtuelle doit-elle disposer en plus ?
body:
  options:
    - { id: a, text: { en: "The Azure Connected Machine agent", fr: "L'agent Azure Connected Machine" } }
    - { id: b, text: { en: "The Azure Monitor Agent with a data collection rule", fr: "L'agent Azure Monitor avec une règle de collecte de données" } }
    - { id: c, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
    - { id: d, text: { en: "A registration in Azure Automation State Configuration", fr: "Une inscription dans Azure Automation State Configuration" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      To authenticate to the Machine Configuration service, an Azure VM must have a system-assigned managed identity in addition to the AzurePolicyforWindows or AzurePolicyforLinux extension. The VM also needs outbound HTTPS on TCP 443 or a private network path.
    fr: |
      Pour s'authentifier auprès du service Machine Configuration, une machine virtuelle Azure doit disposer d'une identité managée affectée par le système, en plus de l'extension AzurePolicyforWindows ou AzurePolicyforLinux. La machine virtuelle a aussi besoin d'un accès HTTPS sortant sur TCP 443 ou d'un chemin réseau privé.
  options:
    a: { en: "The Connected Machine agent onboards non-Azure machines to Azure Arc; Azure VMs use the Machine Configuration extension.", fr: "L'agent Connected Machine intègre des machines non Azure à Azure Arc ; les machines virtuelles Azure utilisent l'extension Machine Configuration." }
    b: { en: "The Azure Monitor Agent collects logs and metrics; Machine Configuration doesn't depend on it.", fr: "L'agent Azure Monitor collecte des journaux et des métriques ; Machine Configuration n'en dépend pas." }
    d: { en: "Azure Automation State Configuration is a separate configuration service; Machine Configuration doesn't need it.", fr: "Azure Automation State Configuration est un service de configuration distinct ; Machine Configuration n'en a pas besoin." }
references:
  - title: Azure Machine Configuration (guest configuration)
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/guest-configuration
