id: sc500-3c-aks-controls-match
objective: "3.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware plans to deploy a new AKS cluster named **aks-claims**. The security team lists the following requirements.

    Which control should you use for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de déployer un nouveau cluster AKS nommé **aks-claims**. L'équipe de sécurité a défini les exigences suivantes.

    Quel contrôle devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: private, text: { en: "Private cluster", fr: "Cluster privé" } }
    - { id: netpol, text: { en: "Kubernetes network policies", fr: "Stratégies réseau Kubernetes" } }
    - { id: wi, text: { en: "Microsoft Entra Workload ID", fr: "Microsoft Entra Workload ID" } }
    - { id: kms, text: { en: "KMS etcd encryption with Azure Key Vault", fr: "Chiffrement etcd KMS avec Azure Key Vault" } }
    - { id: authip, text: { en: "API server authorized IP ranges", fr: "Plages d'adresses IP autorisées du serveur d'API" } }
    - { id: nolocal, text: { en: "Disabled local accounts", fr: "Comptes locaux désactivés" } }
  targets:
    - { id: t1, text: { en: "The API server must have no public endpoint.", fr: "Le serveur d'API ne doit avoir aucun point de terminaison public." } }
    - { id: t2, text: { en: "Pods in the frontend namespace may connect only to pods in the api namespace.", fr: "Les pods de l'espace de noms frontend ne peuvent se connecter qu'aux pods de l'espace de noms api." } }
    - { id: t3, text: { en: "A pod must read secrets from Azure Key Vault without any credential stored in the cluster.", fr: "Un pod doit lire des secrets dans Azure Key Vault sans qu'aucune information d'identification soit stockée dans le cluster." } }
    - { id: t4, text: { en: "Kubernetes Secrets stored in etcd must be encrypted with a key that Litware controls.", fr: "Les Secrets Kubernetes stockés dans etcd doivent être chiffrés avec une clé contrôlée par Litware." } }
answer:
  mapping: { t1: private, t2: netpol, t3: wi, t4: kms }
explanation:
  correct:
    en: "A private cluster exposes the API server only through a private IP address in the virtual network. Network policies filter traffic between pods. Microsoft Entra Workload ID federates a Kubernetes service account with a Microsoft Entra identity, so pods get tokens without stored secrets. KMS etcd encryption encrypts Kubernetes Secrets with a key held in Azure Key Vault."
    fr: "Un cluster privé n'expose le serveur d'API que par une adresse IP privée du réseau virtuel. Les stratégies réseau filtrent le trafic entre pods. Microsoft Entra Workload ID fédère un compte de service Kubernetes avec une identité Microsoft Entra : les pods obtiennent des jetons sans secret stocké. Le chiffrement etcd KMS chiffre les Secrets Kubernetes avec une clé conservée dans Azure Key Vault."
  options:
    authip:
      en: "Authorized IP ranges restrict who can reach a public API server endpoint; they do not remove it."
      fr: "Les plages d'adresses IP autorisées limitent qui peut joindre un point de terminaison public du serveur d'API ; elles ne le suppriment pas."
    nolocal:
      en: "Disabling local accounts removes the static admin credential; it addresses none of the listed requirements."
      fr: "La désactivation des comptes locaux supprime les informations d'identification d'administration statiques ; elle ne répond à aucune des exigences listées."
references:
  - title: Security concepts for applications and clusters in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/concepts-security
