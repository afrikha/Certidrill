id: sc500-3a-gr-tool-support
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders builds an agent named **SupplierScout** in Foundry Agent Service. SupplierScout uses the following tools:

    - **Azure AI Search**, to query an index of supplier contracts.
    - A **Code Interpreter** tool, to run Python on uploaded spreadsheets.

    You assign SupplierScout a custom guardrail that contains an **Indirect attacks** control at the **Tool response** intervention point with the **Annotate and block** action.

    Which content does the control scan?
  fr: |
    Northwind Traders crée un agent nommé **SupplierScout** dans Foundry Agent Service. SupplierScout utilise les outils suivants :

    - **Azure AI Search**, pour interroger un index de contrats fournisseurs ;
    - un outil **Code Interpreter**, pour exécuter du Python sur des feuilles de calcul chargées.

    Vous affectez à SupplierScout un garde-fou personnalisé qui contient un contrôle **Indirect attacks** au point d'intervention **Tool response** avec l'action **Annotate and block**.

    Quel contenu le contrôle analyse-t-il ?
body:
  options:
    - { id: a, text: { en: "The responses of Azure AI Search only", fr: "Les réponses d'Azure AI Search uniquement" } }
    - { id: b, text: { en: "The responses of Code Interpreter only", fr: "Les réponses de Code Interpreter uniquement" } }
    - { id: c, text: { en: "The responses of both tools", fr: "Les réponses des deux outils" } }
    - { id: d, text: { en: "Neither tool's responses, only the user input", fr: "Les réponses d'aucun des deux outils, seulement l'entrée utilisateur" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Tool call and tool response controls require moderation support from the tool. Azure AI Search is in the list of supported tools (with Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search and Browser Automation); Code Interpreter is not, so the control doesn't take effect for it.
    fr: |
      Les contrôles aux points Tool call et Tool response exigent que l'outil prenne en charge la modération. Azure AI Search figure dans la liste des outils pris en charge (avec Azure Functions, OpenAPI, SharePoint grounding, Fabric Data Agent, Bing grounding, Bing Custom Search et Browser Automation) ; ce n'est pas le cas de Code Interpreter, pour lequel le contrôle ne prend pas effet.
  options:
    b:
      en: |
        Code Interpreter is not in the list of tools that support moderation, while Azure AI Search is.
      fr: |
        Code Interpreter ne figure pas dans la liste des outils qui prennent en charge la modération, contrairement à Azure AI Search.
    c:
      en: |
        Controls at the tool response point only take effect for tools that support moderation.
      fr: |
        Les contrôles au point Tool response ne prennent effet que pour les outils qui prennent en charge la modération.
    d:
      en: |
        The control is configured at the Tool response point, which agents support, so supported tools are scanned.
      fr: |
        Le contrôle est configuré au point Tool response, que les agents prennent en charge : les outils pris en charge sont donc analysés.
references:
  - title: Intervention points
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
