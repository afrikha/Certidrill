id: sc500-3c-logic-leaked-url
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Consumption logic app named **la-invoices** that starts with a Request trigger. Callers use the trigger's callback URL. The callback URL that was signed with the primary access key was published by mistake in a public code repository.

    You need to make the leaked URL unusable as quickly as possible. Callers that receive a new URL must be able to keep calling the workflow by using SAS.

    What should you do?
  fr: |
    Fabrikam dispose d'une application logique Consommation nommée **la-invoices** qui commence par un déclencheur Request. Les appelants utilisent l'URL de rappel du déclencheur. L'URL de rappel signée avec la clé d'accès primaire a été publiée par erreur dans un dépôt de code public.

    Vous devez rendre l'URL divulguée inutilisable le plus rapidement possible. Les appelants qui reçoivent une nouvelle URL doivent pouvoir continuer à appeler le workflow avec une SAS.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable **Secure Inputs** and **Secure Outputs** on the Request trigger.", fr: "Activer **Secure Inputs** et **Secure Outputs** sur le déclencheur Request." } }
    - { id: b, text: { en: "Regenerate the primary access key of la-invoices.", fr: "Régénérer la clé d'accès primaire de la-invoices." } }
    - { id: c, text: { en: "Set `sasAuthenticationPolicy` to `Disabled` in the workflow's `accessControl`.", fr: "Définir `sasAuthenticationPolicy` sur `Disabled` dans l'élément `accessControl` du workflow." } }
    - { id: d, text: { en: "Restrict access to the run history to the range `0.0.0.0-0.0.0.0`.", fr: "Limiter l'accès à l'historique des exécutions à la plage `0.0.0.0-0.0.0.0`." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The `sig` parameter of the callback URL is a signature generated with the logic app's access key. Regenerating that key immediately invalidates every URL signed with the old key, while URLs retrieved afterward use the new key, so callers can continue with SAS."
    fr: "Le paramètre `sig` de l'URL de rappel est une signature générée avec la clé d'accès de l'application logique. Régénérer cette clé invalide immédiatement toutes les URL signées avec l'ancienne clé, tandis que les URL obtenues ensuite utilisent la nouvelle clé : les appelants peuvent continuer avec une SAS."
  options:
    a:
      en: "Secure Inputs and Secure Outputs hide data in the run history; the trigger URL remains valid."
      fr: "Secure Inputs et Secure Outputs masquent les données dans l'historique des exécutions ; l'URL du déclencheur reste valide."
    c:
      en: "Disabling SAS blocks every SAS URL, including new ones, so callers could no longer use SAS."
      fr: "Désactiver la SAS bloque toutes les URL SAS, y compris les nouvelles : les appelants ne pourraient plus utiliser de SAS."
    d:
      en: "This setting controls who can view run inputs and outputs, not who can call the trigger."
      fr: "Ce paramètre contrôle qui peut consulter les entrées et sorties des exécutions, pas qui peut appeler le déclencheur."
references:
  - title: Secure access and data for workflows in Azure Logic Apps
    url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-securing-a-logic-app
