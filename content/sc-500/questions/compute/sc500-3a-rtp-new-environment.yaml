id: sc500-3a-rtp-new-environment
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. configured external threat detection with a third-party provider for the Power Platform environment **Prod** three months ago. The provider has evaluated the tool invocations of the Prod agents since then.

    Last week, you created a new environment named **Prod-EU** and published custom agents that use generative orchestration in it. The provider receives no requests from the Prod-EU agents.

    You need the Prod-EU agents to be evaluated by the provider.

    What should you do?
  fr: |
    Fabrikam, Inc. a configuré il y a trois mois la détection externe des menaces avec un fournisseur tiers pour l'environnement Power Platform **Prod**. Depuis, le fournisseur évalue les invocations d'outils des agents de Prod.

    La semaine dernière, vous avez créé un nouvel environnement nommé **Prod-EU** et y avez publié des agents personnalisés qui utilisent l'orchestration générative. Le fournisseur ne reçoit aucune requête des agents de Prod-EU.

    Vous devez faire en sorte que les agents de Prod-EU soient évalués par le fournisseur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Republish the agents of Prod-EU from Copilot Studio.", fr: "Republier les agents de Prod-EU depuis Copilot Studio." } }
    - { id: b, text: { en: "Set Set error behavior of Prod to Block the query.", fr: "Régler Set error behavior de Prod sur Block the query." } }
    - { id: c, text: { en: "Disconnect and reconnect the provider for the Prod environment.", fr: "Déconnecter puis reconnecter le fournisseur pour l'environnement Prod." } }
    - { id: d, text: { en: "Set up Additional threat detection for Prod-EU in the Power Platform admin center.", fr: "Configurer Additional threat detection pour Prod-EU dans le Centre d'administration Power Platform." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      External threat detection is configured per environment. There is no tenant-wide setting and no option to propagate it to current or future environments, so each new environment must be set up manually in Security > Threat detection > Additional threat detection.
    fr: |
      La détection externe des menaces se configure par environnement. Il n'existe aucun paramètre à l'échelle du locataire ni aucune option pour la propager aux environnements actuels ou futurs : chaque nouvel environnement doit être configuré manuellement dans Security > Threat detection > Additional threat detection.
  options:
    a:
      en: |
        Republishing does not connect the environment to the provider; the environment itself has no threat detection configuration.
      fr: |
        Republier ne connecte pas l'environnement au fournisseur ; c'est l'environnement lui-même qui n'a pas de configuration de détection des menaces.
    b:
      en: |
        Set error behavior of Prod only applies to the Prod environment when the provider does not answer in time.
      fr: |
        Set error behavior de Prod ne s'applique qu'à l'environnement Prod, quand le fournisseur ne répond pas à temps.
    c:
      en: |
        Reconnecting Prod changes nothing for Prod-EU, because the configuration is not shared across environments.
      fr: |
        Reconnecter Prod ne change rien pour Prod-EU, car la configuration n'est pas partagée entre environnements.
references:
  - title: Enable external threat detection and protection for Copilot Studio custom agents (preview)
    url: https://learn.microsoft.com/en-us/microsoft-copilot-studio/external-security-provider
