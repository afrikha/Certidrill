id: sc500-3a-d4ai-requirements
objective: "3.1.8"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has enabled threat protection for AI services on its Foundry subscription. The security team has the following requirements:

    - Analysts must see the suspicious segments of the prompts in the alerts to triage them faster.
    - The compliance team must be able to run Insider Risk Management and eDiscovery on the Foundry prompts and responses.
    - Models stored in the Azure Machine Learning registries must be scanned for embedded malware before they reach production.

    Which component should you enable for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. a activé la protection contre les menaces pour les services d'IA sur son abonnement Foundry. L'équipe de sécurité a les exigences suivantes :

    - les analystes doivent voir les segments suspects des prompts dans les alertes pour les trier plus vite ;
    - l'équipe de conformité doit pouvoir utiliser Insider Risk Management et eDiscovery sur les prompts et réponses Foundry ;
    - les modèles stockés dans les registres Azure Machine Learning doivent être analysés à la recherche de logiciels malveillants intégrés avant leur mise en production.

    Quel composant devez-vous activer pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Analysts: [[analysts]]
      Compliance team: [[compliance]]
      Model registries: [[models]]
    fr: |
      Analystes : [[analysts]]
      Équipe de conformité : [[compliance]]
      Registres de modèles : [[models]]
  slots:
    - id: analysts
      options:
        - { id: evidence, text: Enable user prompt evidence }
        - { id: purview, text: Enable data security for AI interactions }
        - { id: model, text: AI model security }
    - id: compliance
      options:
        - { id: evidence, text: Enable user prompt evidence }
        - { id: purview, text: Enable data security for AI interactions }
        - { id: model, text: AI model security }
    - id: models
      options:
        - { id: evidence, text: Enable user prompt evidence }
        - { id: purview, text: Enable data security for AI interactions }
        - { id: model, text: AI model security }
answer:
  values: { analysts: evidence, compliance: purview, models: model }
explanation:
  correct:
    en: |
      Enable user prompt evidence adds suspicious segments of prompts or model responses, with sensitive data redacted, to the alerts. Enable data security for AI interactions lets Microsoft Purview access prompts and responses for scenarios such as Insider Risk Management, Communication Compliance, Audit and eDiscovery; it requires a Purview license. AI model security scans models in Azure Machine Learning registries for malware and other risks before production.
    fr: |
      Enable user prompt evidence ajoute aux alertes des segments suspects des prompts ou des réponses du modèle, avec masquage des données sensibles. Enable data security for AI interactions permet à Microsoft Purview d'accéder aux prompts et réponses pour des scénarios comme Insider Risk Management, Communication Compliance, Audit et eDiscovery ; il exige une licence Purview. AI model security analyse les modèles des registres Azure Machine Learning à la recherche de logiciels malveillants et d'autres risques avant la production.
references:
  - title: Enable threat protection for AI services
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding
