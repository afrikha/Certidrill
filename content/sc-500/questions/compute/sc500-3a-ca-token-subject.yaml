id: sc500-3a-ca-token-subject
objective: "3.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an agent named **OpsBot** that was created from the agent identity blueprint **bp-ops**. OpsBot has its own agent identity and a paired agent user account. Microsoft Entra ID Protection currently reports a **High** agent risk for the OpsBot agent identity and a **Medium** agent risk for the OpsBot agent user account.

    The Conditional Access policies shown in the following table are enabled. No other policy applies.

    For each access request, select the policy that is evaluated and enforced.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un agent nommé **OpsBot**, créé à partir du blueprint d'identité d'agent **bp-ops**. OpsBot possède sa propre identité d'agent et un compte d'utilisateur d'agent associé. Microsoft Entra ID Protection signale actuellement un risque d'agent **High** pour l'identité d'agent d'OpsBot et un risque d'agent **Medium** pour le compte d'utilisateur d'agent d'OpsBot.

    Les stratégies d'accès conditionnel présentées dans le tableau suivant sont activées. Aucune autre stratégie ne s'applique.

    Pour chaque demande d'accès, sélectionnez la stratégie qui est évaluée et appliquée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "OpsBot reads the calendar of the signed-in user Ana by using the on-behalf-of flow."
        fr: "OpsBot lit le calendrier de l'utilisatrice connectée Ana à l'aide du flux on-behalf-of."
    - id: p2
      text:
        en: "OpsBot signs in to Exchange Online with its agent user account to send a message from its mailbox."
        fr: "OpsBot se connecte à Exchange Online avec son compte d'utilisateur d'agent pour envoyer un message depuis sa boîte aux lettres."
  grid:
    header: [{ en: Policy, fr: Stratégie }, { en: Assignment, fr: Affectation }, { en: Condition, fr: Condition }, { en: Grant, fr: Octroi }]
    rows:
      - [{ text: CA-Users, area: causers }, { text: "Users: All users" }, { text: { en: "None", fr: "Aucune" } }, { text: Require multifactor authentication }]
      - [{ text: CA-Blueprint, area: cabp }, { text: "Agents: bp-ops (agent blueprint principal)" }, { text: "Agent risk (Preview): High" }, { text: Block access }]
      - [{ text: CA-AgentUsers, area: caau }, { text: "Agents: All agent users (Preview)" }, { text: "Agent risk (Preview): Medium, High" }, { text: Block access }]
answer:
  values: { p1: causers, p2: caau }
explanation:
  correct:
    en: |
      Conditional Access evaluates the policies of the token subject. In the on-behalf-of flow the subject is the signed-in user, so CA-Users applies to Ana even though the OpsBot agent identity is high risk; selecting an agent identity or blueprint does not cover OBO requests. When OpsBot uses its agent user account, the subject is that account: CA-Blueprint covers only agent identities, and CA-Users does not apply to agent user accounts, so CA-AgentUsers blocks the medium-risk account.
    fr: |
      L'accès conditionnel évalue les stratégies du sujet du jeton. Dans le flux on-behalf-of, le sujet est l'utilisatrice connectée : CA-Users s'applique donc à Ana, même si l'identité d'agent d'OpsBot présente un risque élevé ; cibler une identité d'agent ou un blueprint ne couvre pas les requêtes OBO. Quand OpsBot utilise son compte d'utilisateur d'agent, le sujet est ce compte : CA-Blueprint ne couvre que les identités d'agent, et CA-Users ne s'applique pas aux comptes d'utilisateur d'agent, si bien que CA-AgentUsers bloque ce compte à risque moyen.
  options:
    cabp:
      en: |
        A policy that targets a blueprint applies to the agent identities created from it, not to OBO requests made for a user and not to the agent's user account.
      fr: |
        Une stratégie qui cible un blueprint s'applique aux identités d'agent créées à partir de celui-ci, pas aux requêtes OBO faites pour un utilisateur ni au compte d'utilisateur de l'agent.
references:
  - title: Conditional Access for agents
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/agent-id
  - title: Target agent identities in Microsoft Entra Conditional Access policies
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/howto-target-agent-identities
