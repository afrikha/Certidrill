id: sc500-3c-app-pe-scm
objective: "3.3.7"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an App Service web app named **app-erp**. A private endpoint for app-erp is deployed in a virtual network named **VNet1**. The main site of app-erp has a single access restriction rule that allows 203.0.113.0/24, and the unmatched rule action is not configured.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une application web App Service nommée **app-erp**. Un point de terminaison privé pour app-erp est déployé dans un réseau virtuel nommé **VNet1**. Le site principal d'app-erp possède une seule règle de restriction d'accès, qui autorise 203.0.113.0/24, et l'action de la règle sans correspondance n'est pas configurée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A virtual machine in VNet1 with the IP address 10.1.0.4 that connects through the private endpoint is blocked by the access restriction rules."
        fr: "Une machine virtuelle de VNet1, d'adresse IP 10.1.0.4, qui se connecte via le point de terminaison privé est bloquée par les règles de restriction d'accès."
    - id: s2
      text:
        en: "The SCM (advanced tools) site of app-erp can have its own access restriction rules that differ from those of the main site."
        fr: "Le site SCM (outils avancés) d'app-erp peut avoir ses propres règles de restriction d'accès, différentes de celles du site principal."
    - id: s3
      text:
        en: "To block one more address while allowing every other public address, you can add a Deny rule for that address and set the unmatched rule action to Allow."
        fr: "Pour bloquer une adresse supplémentaire tout en autorisant toutes les autres adresses publiques, vous pouvez ajouter une règle Deny pour cette adresse et définir l'action de la règle sans correspondance sur Allow."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Access restrictions do not apply to traffic that enters through a private endpoint; that traffic goes directly to the site and is filtered with network security groups instead. The SCM site has its own rule collection and unmatched rule, unless you choose to reuse the main site's rules. The unmatched rule action can be set explicitly to Allow or Deny, so a Deny rule plus an Allow unmatched action blocks one address and allows all others."
    fr: "Les restrictions d'accès ne s'appliquent pas au trafic qui entre par un point de terminaison privé ; ce trafic va directement au site et se filtre plutôt avec des groupes de sécurité réseau. Le site SCM possède sa propre collection de règles et sa propre règle sans correspondance, sauf si vous choisissez de réutiliser les règles du site principal. L'action de la règle sans correspondance peut être définie explicitement sur Allow ou Deny : une règle Deny associée à une action Allow sans correspondance bloque une adresse et autorise toutes les autres."
references:
  - title: Azure App Service access restrictions
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-access-restrictions
