id: sc500-3a-dspm-fabric-order
objective: "3.1.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Purview DSPM for AI. Copilot in Fabric is being rolled out, and you need DSPM for AI to run data risk assessments on the Fabric data that Copilot can reach.

    You are a Cloud Application Administrator. A colleague holds the Fabric administrator role. You must not store a client secret.

    Which four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders utilise Microsoft Purview DSPM for AI. Copilot dans Fabric est en cours de déploiement, et DSPM for AI doit exécuter des évaluations des risques liés aux données sur les données Fabric auxquelles Copilot peut accéder.

    Vous êtes Cloud Application Administrator. Un collègue détient le rôle d'administrateur Fabric. Vous ne devez stocker aucune clé secrète client.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: reg, text: { en: "Register a Microsoft Entra application for Fabric and add a federated credential to it.", fr: "Inscrire une application Microsoft Entra pour Fabric et lui ajouter des informations d'identification fédérées." } }
    - { id: group, text: { en: "Add the application to a security group as a member.", fr: "Ajouter l'application comme membre d'un groupe de sécurité." } }
    - { id: fabric, text: { en: "In the Fabric tenant settings, allow service principals to access the admin APIs, scoped to the security group.", fr: "Dans les paramètres de locataire Fabric, autoriser les principaux de service à accéder aux API d'administration, limité au groupe de sécurité." } }
    - { id: assess, text: { en: "In DSPM for AI, create the data risk assessment for Fabric.", fr: "Dans DSPM for AI, créer l'évaluation des risques liés aux données pour Fabric." } }
    - { id: secret, text: { en: "Create a client secret for the application and copy its value.", fr: "Créer une clé secrète client pour l'application et copier sa valeur." } }
    - { id: graph, text: { en: "Grant the application the Sites.ReadWrite.All Microsoft Graph application permission with admin consent.", fr: "Accorder à l'application l'autorisation d'application Microsoft Graph Sites.ReadWrite.All avec consentement administrateur." } }
answer:
  sequence: [ reg, group, fabric, assess ]
explanation:
  correct:
    en: |
      Fabric data risk assessments use an Entra application as the service principal for Fabric; federated credentials are the recommended authentication because they avoid stored secrets. The application is then added to a security group, and a Fabric administrator enables the service principal settings of the Admin API settings for that group (read-only admin APIs and admin APIs used for updates). Only then can the assessment read Fabric through the service principal.
    fr: |
      Les évaluations des risques liés aux données Fabric utilisent une application Entra comme principal de service pour Fabric ; les informations d'identification fédérées sont l'authentification recommandée, car elles évitent de stocker des secrets. L'application est ensuite ajoutée à un groupe de sécurité, puis un administrateur Fabric active pour ce groupe les paramètres de principal de service des Admin API settings (API d'administration en lecture seule et API d'administration utilisées pour les mises à jour). L'évaluation peut alors lire Fabric via le principal de service.
  options:
    secret:
      en: |
        A client secret is the alternative authentication method, which the requirement excludes.
      fr: |
        Une clé secrète client est la méthode d'authentification alternative, que l'exigence exclut.
    graph:
      en: |
        Microsoft Graph application permissions such as Sites.ReadWrite.All are prerequisites of Microsoft 365 item-level scanning, not of Fabric assessments.
      fr: |
        Les autorisations d'application Microsoft Graph comme Sites.ReadWrite.All sont des prérequis de l'analyse au niveau des éléments Microsoft 365, pas des évaluations Fabric.
references:
  - title: Considerations for DSPM for AI to manage data security and compliance protections for AI interactions - (classic)
    url: https://learn.microsoft.com/en-us/purview/ai-microsoft-purview-considerations
