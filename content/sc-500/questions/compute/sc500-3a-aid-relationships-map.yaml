id: sc500-3a-aid-relationships-map
objective: "3.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. deploys an agent named **ClaimsHelper** that has an agent identity and a paired agent user account. You need to give the following principals the access they need for ClaimsHelper without assigning any Microsoft Entra role:

    - **Ravi**, a developer, must manage the credentials of ClaimsHelper and restore it if it is soft-deleted.
    - **Elena**, a product manager, is accountable for the business purpose of ClaimsHelper. She must request access packages for the agent identity with a business justification and disable it during incidents.
    - **Tom**, a team lead, must only request access packages for the agent's user account and see ClaimsHelper as reporting to him.
    - **svc-agentops**, the service principal of an automation platform, must modify and delete the agent identity without user intervention.

    Which relationship should you configure for each principal? To answer, drag the appropriate relationships to the correct principals. Each relationship may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. déploie un agent nommé **ClaimsHelper** qui possède une identité d'agent et un compte d'utilisateur d'agent associé. Vous devez donner aux principaux suivants l'accès dont ils ont besoin pour ClaimsHelper sans attribuer de rôle Microsoft Entra :

    - **Ravi**, développeur, doit gérer les informations d'identification de ClaimsHelper et le restaurer s'il est supprimé de façon réversible ;
    - **Elena**, chef de produit, est responsable de la finalité métier de ClaimsHelper. Elle doit demander des packages d'accès pour l'identité d'agent avec une justification métier et la désactiver lors d'incidents ;
    - **Tom**, chef d'équipe, doit uniquement demander des packages d'accès pour le compte d'utilisateur de l'agent et voir ClaimsHelper comme un agent qui lui est rattaché ;
    - **svc-agentops**, le principal de service d'une plateforme d'automatisation, doit modifier et supprimer l'identité d'agent sans intervention d'un utilisateur.

    Quelle relation devez-vous configurer pour chaque principal ? Pour répondre, faites glisser les relations appropriées vers les principaux correspondants. Chaque relation peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: owner, text: { en: "Owner", fr: "Propriétaire (owner)" } }
    - { id: sponsor, text: Sponsor }
    - { id: manager, text: { en: "Manager", fr: "Responsable (manager)" } }
    - { id: aus, text: { en: "Sponsor of the agent user account", fr: "Sponsor du compte d'utilisateur d'agent" } }
  targets:
    - { id: ravi, text: Ravi }
    - { id: elena, text: Elena }
    - { id: tom, text: Tom }
    - { id: svc, text: svc-agentops }
answer:
  mapping: { ravi: owner, elena: sponsor, tom: manager, svc: owner }
explanation:
  correct:
    en: |
      Owners are the technical administrators: they manage credentials, restore soft-deleted identities and delete them, and service principals can be owners when a managing service must act without a user. Sponsors carry business accountability for the agent identity: they request access packages with a justification and can disable the identity, but cannot restore it. Managers are individual users who request access packages for the agent's user account and see the agents that report to them, without modifying them.
    fr: |
      Les propriétaires sont les administrateurs techniques : ils gèrent les informations d'identification, restaurent les identités supprimées de façon réversible et les suppriment, et des principaux de service peuvent être propriétaires quand un service de gestion doit agir sans utilisateur. Les sponsors portent la responsabilité métier de l'identité d'agent : ils demandent des packages d'accès avec une justification et peuvent désactiver l'identité, mais pas la restaurer. Les responsables sont des utilisateurs individuels qui demandent des packages d'accès pour le compte d'utilisateur de l'agent et voient les agents qui leur sont rattachés, sans les modifier.
  options:
    aus:
      en: |
        A sponsor of the agent user account can request access for that account, but the agent does not appear as reporting to that sponsor, and the sponsorship gives no rights on the agent identity. Only the manager relationship meets Tom's requirements.
      fr: |
        Un sponsor du compte d'utilisateur d'agent peut demander des accès pour ce compte, mais l'agent n'apparaît pas comme rattaché à ce sponsor, et ce parrainage ne donne aucun droit sur l'identité d'agent. Seule la relation de responsable répond aux exigences de Tom.
references:
  - title: Administrative relationships in Microsoft Entra Agent ID (Owners, sponsors, and managers)
    url: https://learn.microsoft.com/en-us/entra/agent-id/agent-owners-sponsors-managers
