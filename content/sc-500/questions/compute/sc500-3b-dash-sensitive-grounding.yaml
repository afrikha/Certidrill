id: sc500-3b-dash-sensitive-grounding
objective: "3.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure subscription named **Sub1**. Generative AI agents in Microsoft Foundry use storage accounts in Sub1 as grounding data.

    In Microsoft Defender for Cloud, only the AI services plan and Defender for Storage are enabled on Sub1.

    In the Data and AI security dashboard, the **Sensitive data discovery** widget is empty, and the security explorer query that finds sensitive data resources used for grounding returns no results.

    You need the dashboard to show the sensitive information types and sensitivity labels found in the grounding data.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un abonnement Azure nommé **Sub1**. Des agents d'IA générative de Microsoft Foundry utilisent des comptes de stockage de Sub1 comme données de grounding.

    Dans Microsoft Defender for Cloud, seuls le plan AI services et Defender for Storage sont activés sur Sub1.

    Dans le tableau de bord de sécurité des données et de l'IA, le widget **Sensitive data discovery** est vide, et la requête de l'explorateur de sécurité qui recherche les ressources de données sensibles utilisées pour le grounding ne renvoie aucun résultat.

    Le tableau de bord doit afficher les types d'informations sensibles et les étiquettes de confidentialité trouvés dans les données de grounding.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the Defender CSPM plan on Sub1", fr: "Activer le plan Defender CSPM sur Sub1" } }
    - { id: b, text: { en: "Enable Defender for Servers Plan 2 on Sub1", fr: "Activer Defender for Servers Plan 2 sur Sub1" } }
    - { id: c, text: { en: "Turn on the sensitive data discovery extension of Defender CSPM", fr: "Activer l'extension de découverte des données sensibles de Defender CSPM" } }
    - { id: d, text: { en: "Turn on agentless scanning for machines on Sub1", fr: "Activer l'analyse sans agent des machines sur Sub1" } }
    - { id: e, text: { en: "Enable Defender for Key Vault on Sub1", fr: "Activer Defender for Key Vault sur Sub1" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Sensitive data discovery is an extension of the Defender CSPM plan, so you enable Defender CSPM and turn on that extension. The dashboard then shows the most common sensitive information types and sensitivity labels, and security explorer can correlate sensitive data resources with the AI resources that use them for grounding.
    fr: |
      La découverte des données sensibles est une extension du plan Defender CSPM : vous activez Defender CSPM, puis cette extension. Le tableau de bord affiche alors les types d'informations sensibles et les étiquettes de confidentialité les plus courants, et l'explorateur de sécurité peut relier les ressources de données sensibles aux ressources d'IA qui les utilisent pour le grounding.
  options:
    b: { en: "Defender for Servers protects machines; it doesn't classify the data stored in storage accounts.", fr: "Defender for Servers protège les machines ; il ne classe pas les données stockées dans les comptes de stockage." }
    d: { en: "Agentless scanning for machines analyzes VM disk snapshots, not the content of storage accounts used for grounding.", fr: "L'analyse sans agent des machines analyse des instantanés de disques de machines virtuelles, pas le contenu des comptes de stockage utilisés pour le grounding." }
    e: { en: "Defender for Key Vault detects suspicious access to key vaults; it doesn't discover sensitive data.", fr: "Defender for Key Vault détecte les accès suspects aux coffres de clés ; il ne découvre pas de données sensibles." }
references:
  - title: Data and AI security dashboard
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/data-aware-security-dashboard-overview
