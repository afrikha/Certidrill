id: sc500-3b-mdfs-arc-subscription
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has two Azure subscriptions:

    | Subscription | Content | Defender for Servers |
    | --- | --- | --- |
    | Sub-Prod | 60 Azure virtual machines | Plan 2 |
    | Sub-Hybrid | 80 on-premises servers connected to Azure Arc | Off |

    In Defender for Cloud, the Azure Arc-enabled servers show no Defender for Servers protection.

    You need to protect the on-premises servers with Defender for Servers Plan 2. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin Toys dispose de deux abonnements Azure :

    | Abonnement | Contenu | Defender for Servers |
    | --- | --- | --- |
    | Sub-Prod | 60 machines virtuelles Azure | Plan 2 |
    | Sub-Hybrid | 80 serveurs locaux connectés à Azure Arc | Désactivé |

    Dans Defender for Cloud, les serveurs avec Azure Arc n'affichent aucune protection Defender for Servers.

    Vous devez protéger les serveurs locaux avec Defender for Servers Plan 2. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on the Servers plan with Plan 2 in the Environment settings of Sub-Hybrid", fr: "Activer le plan Servers avec le Plan 2 dans les paramètres d'environnement de Sub-Hybrid" } }
    - { id: b, text: { en: "Reconnect the Azure Arc-enabled servers to a resource group in Sub-Prod", fr: "Reconnecter les serveurs avec Azure Arc à un groupe de ressources de Sub-Prod" } }
    - { id: c, text: { en: "Enable direct onboarding with Defender for Endpoint and designate Sub-Prod", fr: "Activer l'intégration directe avec Defender for Endpoint et désigner Sub-Prod" } }
    - { id: d, text: { en: "Enable the Defender CSPM plan in the Environment settings of Sub-Hybrid", fr: "Activer le plan Defender CSPM dans les paramètres d'environnement de Sub-Hybrid" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Defender for Servers is enabled per subscription (or per AWS account or GCP project), and it covers the Azure VMs and Azure Arc-enabled servers of that subscription. Turning on the Servers plan in Sub-Hybrid selects Plan 2 by default and protects the 80 Arc-enabled servers without touching them.
    fr: |
      Defender for Servers s'active par abonnement (ou par compte AWS ou projet GCP), et il couvre les machines virtuelles Azure et les serveurs avec Azure Arc de cet abonnement. L'activation du plan Servers dans Sub-Hybrid sélectionne le Plan 2 par défaut et protège les 80 serveurs avec Azure Arc sans intervenir sur eux.
  options:
    b: { en: "Reconnecting 80 servers to another subscription works but requires far more effort than enabling the plan where they already are.", fr: "Reconnecter 80 serveurs à un autre abonnement fonctionne, mais demande bien plus d'effort que d'activer le plan là où ils se trouvent déjà." }
    c: { en: "Direct onboarding without Azure Arc gives only Plan 1 functionality plus premium vulnerability management features, not full Plan 2.", fr: "L'intégration directe sans Azure Arc ne fournit que les fonctionnalités du Plan 1 et les fonctionnalités premium de gestion des vulnérabilités, pas tout le Plan 2." }
    d: { en: "Defender CSPM is a posture plan; it doesn't provide Defender for Servers workload protection.", fr: "Defender CSPM est un plan de posture ; il ne fournit pas la protection des charges de travail de Defender for Servers." }
references:
  - title: Protect your servers with Defender for Servers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-servers-plan
