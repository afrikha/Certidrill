id: sc500-1c-op-assignments-hotarea
objective: "1.3.7"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has an Azure subscription named **Sub1** with Microsoft Defender for Cloud enabled. The following table shows the role assignments on Sub1 and on its resource groups.

    Two high-severity identity recommendations are reported for Sub1. For each recommendation, select the role assignment that you must remove to remediate it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'un abonnement Azure nommé **Sub1** dans lequel Microsoft Defender for Cloud est activé. Le tableau suivant présente les attributions de rôles sur Sub1 et sur ses groupes de ressources.

    Deux recommandations d'identité de gravité élevée sont signalées pour Sub1. Pour chaque recommandation, sélectionnez l'attribution de rôle que vous devez supprimer pour la corriger.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: "Guest accounts with owner permissions on Azure resources should be removed"
    - id: p2
      text: "Blocked accounts with owner permissions on Azure resources should be removed"
  grid:
    header: [{ en: "Principal", fr: "Principal" }, { en: "Account", fr: "Compte" }, { en: "Sign-in", fr: "Connexion" }, { en: "Role", fr: "Rôle" }, { en: "Scope", fr: "Étendue" }]
    rows:
      - [{ text: Admin-Lee, area: r1 }, { text: { en: "Member", fr: "Membre" } }, { text: { en: "Allowed", fr: "Autorisée" } }, { text: Owner }, { text: Sub1 }]
      - [{ text: "ana_fabrikam.com#EXT#", area: r2 }, { text: { en: "Guest", fr: "Invité" } }, { text: { en: "Allowed", fr: "Autorisée" } }, { text: Reader }, { text: Sub1 }]
      - [{ text: Old-Ops-Admin, area: r3 }, { text: { en: "Member", fr: "Membre" } }, { text: { en: "Blocked", fr: "Bloquée" } }, { text: Owner }, { text: Sub1 }]
      - [{ text: "tom_tailspin.com#EXT#", area: r4 }, { text: { en: "Guest", fr: "Invité" } }, { text: { en: "Allowed", fr: "Autorisée" } }, { text: Owner }, { text: rg-web }]
      - [{ text: Former-Dev, area: r5 }, { text: { en: "Member", fr: "Membre" } }, { text: { en: "Blocked", fr: "Bloquée" } }, { text: Reader }, { text: rg-web }]
      - [{ text: sp-deploy, area: r6 }, { text: { en: "Service principal", fr: "Principal de service" } }, { text: "-" }, { text: Owner }, { text: Sub1 }]
answer:
  values: { p1: r4, p2: r3 }
explanation:
  correct:
    en: |
      The first recommendation targets guest (external) accounts that hold Owner permissions on Azure resources: tom_tailspin.com#EXT# is a guest with Owner on rg-web, whereas the other guest only has Reader. The second targets accounts that are blocked from signing in but still hold Owner permissions: Old-Ops-Admin. Former-Dev is blocked but only has Reader, and the member and service principal Owners are neither guests nor blocked.
    fr: |
      La première recommandation cible les comptes invités (externes) qui disposent d'autorisations Owner sur des ressources Azure : tom_tailspin.com#EXT# est un invité Owner sur rg-web, tandis que l'autre invité n'a que Reader. La seconde cible les comptes bloqués à la connexion qui disposent encore d'autorisations Owner : Old-Ops-Admin. Former-Dev est bloqué mais n'a que Reader, et les Owner membre et principal de service ne sont ni invités ni bloqués.
references:
  - title: Identity and access security recommendations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/recommendations-reference-identity-access
