id: sc500-1a-am-methods-policy
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. manages authentication methods in Microsoft Entra ID. The migration state of the Authentication methods policy is **Migration Complete**.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. gère les méthodes d'authentification dans Microsoft Entra ID. L'état de migration de la stratégie des méthodes d'authentification est **Migration Complete**.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Methods that are still selected in the legacy MFA and SSPR policies are ignored for sign-in and password reset.", fr: "Les méthodes encore sélectionnées dans les stratégies MFA et SSPR héritées sont ignorées pour la connexion et la réinitialisation du mot de passe." } }
    - { id: b, text: { en: "You can enable a method for specific groups only, instead of all users.", fr: "Vous pouvez activer une méthode pour certains groupes uniquement, au lieu de tous les utilisateurs." } }
    - { id: c, text: { en: "You can target an individual user directly in the settings of a method.", fr: "Vous pouvez cibler directement un utilisateur individuel dans les paramètres d'une méthode." } }
    - { id: d, text: { en: "Security questions are enabled and configured in the Authentication methods policy.", fr: "Les questions de sécurité sont activées et configurées dans la stratégie des méthodes d'authentification." } }
    - { id: e, text: { en: "Editing the policy requires the Authentication Administrator role.", fr: "La modification de la stratégie exige le rôle Authentication Administrator." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      In the Migration Complete state, Microsoft Entra ID follows only the Authentication methods policy and ignores the method settings of the legacy MFA and SSPR policies. The Authentication methods policy can enable each method for all users or for specific groups.
    fr: |
      Dans l'état Migration Complete, Microsoft Entra ID ne suit que la stratégie des méthodes d'authentification et ignore les paramètres de méthodes des stratégies MFA et SSPR héritées. La stratégie des méthodes d'authentification peut activer chaque méthode pour tous les utilisateurs ou pour des groupes précis.
  options:
    c:
      en: |
        The ability to target individual users was removed; Microsoft recommends one group per method.
      fr: |
        La possibilité de cibler des utilisateurs individuels a été supprimée ; Microsoft recommande un groupe par méthode.
    d:
      en: |
        Security questions are still managed in the legacy SSPR policy, which remains editable for them even after migration.
      fr: |
        Les questions de sécurité sont encore gérées dans la stratégie SSPR héritée, qui reste modifiable pour elles même après la migration.
    e:
      en: |
        The policy is edited by an Authentication Policy Administrator; Authentication Administrator manages the methods of individual users.
      fr: |
        La stratégie est modifiée par un Authentication Policy Administrator ; Authentication Administrator gère les méthodes des utilisateurs individuels.
references:
  - title: Manage authentication methods for Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-methods-manage
  - title: How to migrate MFA and SSPR policy settings to the Authentication methods policy for Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-authentication-methods-manage
