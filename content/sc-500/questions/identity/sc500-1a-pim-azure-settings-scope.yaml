id: sc500-1a-pim-azure-settings-scope
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You manage Privileged Identity Management (PIM) for Azure resources in a subscription named **Sub1**. Sub1 contains a resource group named **RG1**.

    The PIM settings of the **Owner** role are configured as follows:

    | Scope | Require approval to activate | Activation maximum duration |
    | --- | --- | --- |
    | Sub1 | Yes (approver: Admin1) | 2 hours |
    | RG1 | No | 8 hours |

    A user named User1 has an eligible assignment of the Owner role scoped to RG1. User1 must remain limited to RG1.

    You need to ensure that every activation of the Owner role by User1 is approved by Admin1.

    What should you do?
  fr: |
    Vous gérez Privileged Identity Management (PIM) pour les ressources Azure dans un abonnement nommé **Sub1**. Sub1 contient un groupe de ressources nommé **RG1**.

    Les paramètres PIM du rôle **Owner** sont configurés comme suit :

    | Étendue | Require approval to activate | Durée maximale d'activation |
    | --- | --- | --- |
    | Sub1 | Oui (approbateur : Admin1) | 2 heures |
    | RG1 | Non | 8 heures |

    Un utilisateur nommé User1 a une attribution éligible du rôle Owner dont l'étendue est RG1. User1 doit rester limité à RG1.

    Vous devez vous assurer que chaque activation du rôle Owner par User1 est approuvée par Admin1.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Nothing, because the Owner role settings of Sub1 apply to activations at RG1.", fr: "Rien, car les paramètres du rôle Owner de Sub1 s'appliquent aux activations sur RG1." }
    - id: b
      text: { en: "Replace User1's eligible assignment on RG1 with an eligible assignment on Sub1.", fr: "Remplacer l'attribution éligible de User1 sur RG1 par une attribution éligible sur Sub1." }
    - id: c
      text: { en: "Configure the Owner role settings on the management group that contains Sub1.", fr: "Configurer les paramètres du rôle Owner sur le groupe d'administration qui contient Sub1." }
    - id: d
      text: { en: "Edit the Owner role settings on RG1 to require approval and select Admin1.", fr: "Modifier les paramètres du rôle Owner sur RG1 pour exiger une approbation et sélectionner Admin1." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In PIM for Azure resources, role settings are defined per role and per resource. Settings at a higher scope, such as a subscription, are not inherited by a lower scope, such as a resource group, so an activation at RG1 uses the Owner settings of RG1, which currently require no approval.
    fr: |
      Dans PIM pour les ressources Azure, les paramètres de rôle sont définis par rôle et par ressource. Les paramètres d'une étendue supérieure, comme un abonnement, ne sont pas hérités par une étendue inférieure, comme un groupe de ressources : une activation sur RG1 utilise les paramètres Owner de RG1, qui n'exigent actuellement aucune approbation.
  options:
    a:
      en: |
        Role settings are not inherited from the subscription; the RG1 settings apply and they do not require approval.
      fr: |
        Les paramètres de rôle ne sont pas hérités de l'abonnement ; ce sont ceux de RG1 qui s'appliquent, et ils n'exigent pas d'approbation.
    b:
      en: |
        This would require approval, but it gives User1 Owner on the whole subscription, which breaks the requirement to stay limited to RG1.
      fr: |
        Cela imposerait l'approbation, mais User1 deviendrait Owner de tout l'abonnement, ce qui viole l'exigence de rester limité à RG1.
    c:
      en: |
        Settings on a management group are not inherited by lower scopes either; activations at RG1 still use the RG1 settings.
      fr: |
        Les paramètres d'un groupe d'administration ne sont pas non plus hérités par les étendues inférieures ; les activations sur RG1 utilisent toujours les paramètres de RG1.
references:
  - title: Configure Azure resource role settings in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-configure-role-settings
