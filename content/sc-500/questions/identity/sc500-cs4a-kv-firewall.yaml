id: sc500-cs4a-kv-firewall
objective: "1.2.4"
type: single
caseStudy: sc500-cs4a-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to configure apim-mt and kv-trips so that apim-mt can create the named value for the fare-pricing API key. The solution must meet the requirements. What should you do?
  fr: |
    Vous devez configurer apim-mt et kv-trips afin qu'apim-mt puisse créer la valeur nommée de la clé API de tarification. La solution doit respecter les exigences. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Key Vault Secrets User role on kv-trips to uai-apim, and enable the trusted Microsoft services exception on kv-trips.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-trips à uai-apim, et activer l'exception des services Microsoft approuvés sur kv-trips." } }
    - { id: b, text: { en: "Enable the system-assigned identity of apim-mt with the Key Vault Secrets User role on kv-trips, and enable the trusted Microsoft services exception on kv-trips.", fr: "Activer l'identité affectée par le système d'apim-mt avec le rôle Key Vault Secrets User sur kv-trips, et activer l'exception des services Microsoft approuvés sur kv-trips." } }
    - { id: c, text: { en: "Enable the system-assigned identity of apim-mt with the Key Vault Reader role on kv-trips, and enable the trusted Microsoft services exception on kv-trips.", fr: "Activer l'identité affectée par le système d'apim-mt avec le rôle Key Vault Reader sur kv-trips, et activer l'exception des services Microsoft approuvés sur kv-trips." } }
    - { id: d, text: { en: "Switch kv-trips to the Vault access policy model, and grant uai-apim the Get and List secret permissions in an access policy.", fr: "Passer kv-trips au modèle Vault access policy, et accorder à uai-apim les autorisations de secret Get et List dans une stratégie d'accès." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the key vault firewall is enabled, API Management must use its system-assigned managed identity, because a user-assigned identity cannot be used to reach a firewalled vault, and the vault must allow trusted Microsoft services to bypass the firewall. With the Azure RBAC permission model, Key Vault Secrets User is the least-privileged role that can read the secret value.
    fr: |
      Quand le pare-feu du coffre de clés est activé, API Management doit utiliser son identité managée affectée par le système, car une identité affectée par l'utilisateur ne peut pas atteindre un coffre protégé par un pare-feu, et le coffre doit autoriser les services Microsoft approuvés à contourner le pare-feu. Avec le modèle d'autorisation Azure RBAC, Key Vault Secrets User est le rôle le moins privilégié qui permet de lire la valeur du secret.
  options:
    a:
      en: |
        The role and the exception are correct, but uai-apim is a user-assigned identity, which API Management cannot use to access a key vault whose firewall is enabled.
      fr: |
        Le rôle et l'exception sont corrects, mais uai-apim est une identité affectée par l'utilisateur, qu'API Management ne peut pas utiliser pour accéder à un coffre de clés dont le pare-feu est activé.
    c:
      en: |
        Key Vault Reader reads only metadata; it cannot read the secret value that the named value needs.
      fr: |
        Key Vault Reader ne lit que les métadonnées ; il ne permet pas de lire la valeur du secret dont la valeur nommée a besoin.
    d:
      en: |
        The permission model is not the problem; the user-assigned identity still cannot pass the firewall, and no firewall exception is enabled.
      fr: |
        Le modèle d'autorisation n'est pas en cause ; l'identité affectée par l'utilisateur ne peut toujours pas franchir le pare-feu, et aucune exception de pare-feu n'est activée.
references:
  - title: Use named values in Azure API Management policies
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-properties
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
