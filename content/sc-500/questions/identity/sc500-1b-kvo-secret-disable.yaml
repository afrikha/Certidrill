id: sc500-1b-kvo-secret-disable
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has a key vault named **kv-fab-api**. A secret named **PartnerApiKey** has two versions: version 1 holds an old API key, and version 2, the current version, holds the new key.

    A legacy application still requests version 1 explicitly. You need to ensure that version 1 can no longer be retrieved, while version 2 stays usable. Version 1 must be kept in the vault for audit purposes.

    What should you do?
  fr: |
    Fabrikam, Inc. dispose d'un coffre de clés nommé **kv-fab-api**. Un secret nommé **PartnerApiKey** a deux versions : la version 1 contient une ancienne clé d'API, et la version 2, la version actuelle, contient la nouvelle clé.

    Une application héritée demande encore explicitement la version 1. Vous devez vous assurer que la version 1 ne peut plus être récupérée, tandis que la version 2 reste utilisable. La version 1 doit être conservée dans le coffre à des fins d'audit.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set an expiration date in the past on version 1.", fr: "Définir une date d'expiration passée sur la version 1." } }
    - { id: b, text: { en: "Delete the PartnerApiKey secret.", fr: "Supprimer le secret PartnerApiKey." } }
    - { id: c, text: { en: "Set the enabled attribute of version 1 to false.", fr: "Définir l'attribut enabled de la version 1 sur false." } }
    - { id: d, text: { en: "Set an activation date in the future on version 1.", fr: "Définir une date d'activation future sur la version 1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The enabled attribute controls whether the secret data can be retrieved, and it is set per version. Disabling version 1 blocks its retrieval while the version stays in the vault, and version 2 is unaffected.
    fr: |
      L'attribut enabled détermine si les données du secret peuvent être récupérées, et il se définit par version. Désactiver la version 1 bloque sa récupération tout en la conservant dans le coffre, et la version 2 n'est pas concernée.
  options:
    a:
      en: "A get operation still returns an expired secret, so the legacy application could keep reading version 1."
      fr: "Une opération get renvoie toujours un secret expiré : l'application héritée pourrait continuer à lire la version 1."
    b:
      en: "Deleting the secret removes all its versions, including version 2, which must stay usable."
      fr: "Supprimer le secret retire toutes ses versions, y compris la version 2, qui doit rester utilisable."
    d:
      en: "A get operation also works on a secret that isn't yet valid, so an activation date doesn't block retrieval."
      fr: "Une opération get fonctionne aussi sur un secret pas encore valide : une date d'activation ne bloque pas la récupération."
references:
  - title: About Azure Key Vault secrets
    url: https://learn.microsoft.com/en-us/azure/key-vault/secrets/about-secrets
