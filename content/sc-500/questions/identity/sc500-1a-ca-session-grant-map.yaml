id: sc500-1a-ca-session-grant-map
objective: "1.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses and Microsoft Defender for Cloud Apps. You are creating four Conditional Access policies.

    Which control should you configure in each policy? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1 et de Microsoft Defender for Cloud Apps. Vous créez quatre stratégies d'accès conditionnel.

    Quel contrôle devez-vous configurer dans chaque stratégie ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sif, text: Sign-in frequency }
    - { id: strength, text: Require authentication strength }
    - { id: casb, text: Use Conditional Access App Control }
    - { id: appenf, text: Use app enforced restrictions }
    - { id: compliant, text: Require device to be marked as compliant }
    - { id: persist, text: Persistent browser session }
  targets:
    - id: t1
      text: { en: "Users of the Azure portal must sign in again every four hours.", fr: "Les utilisateurs du portail Azure doivent se reconnecter toutes les quatre heures." }
    - id: t2
      text: { en: "Administrators must sign in with a FIDO2 security key or Windows Hello for Business.", fr: "Les administrateurs doivent se connecter avec une clé de sécurité FIDO2 ou Windows Hello for Business." }
    - id: t3
      text: { en: "Sessions to a third-party SaaS app must be monitored and controlled in real time by Defender for Cloud Apps session policies.", fr: "Les sessions vers une application SaaS tierce doivent être surveillées et contrôlées en temps réel par des stratégies de session Defender for Cloud Apps." }
    - id: t4
      text: { en: "Users on unmanaged devices must get a limited experience in SharePoint Online, based on device information passed by Microsoft Entra ID.", fr: "Les utilisateurs d'appareils non gérés doivent obtenir une expérience limitée dans SharePoint Online, selon les informations d'appareil transmises par Microsoft Entra ID." }
answer:
  mapping: { t1: sif, t2: strength, t3: casb, t4: appenf }
explanation:
  correct:
    en: |
      Sign-in frequency defines how long a user stays signed in before being prompted again. An authentication strength restricts sign-in to chosen method combinations, here phishing-resistant methods. Conditional Access App Control routes sessions through Defender for Cloud Apps as a reverse proxy for real-time session policies. App enforced restrictions pass device information to apps such as SharePoint Online and Exchange Online, which then give a limited or full experience.
    fr: |
      Sign-in frequency définit combien de temps un utilisateur reste connecté avant d'être à nouveau sollicité. Une force d'authentification limite la connexion aux combinaisons de méthodes choisies, ici des méthodes résistantes au hameçonnage. Conditional Access App Control fait passer les sessions par Defender for Cloud Apps, utilisé comme proxy inverse, pour appliquer des stratégies de session en temps réel. App enforced restrictions transmet les informations d'appareil à des applications comme SharePoint Online et Exchange Online, qui offrent alors une expérience limitée ou complète.
  options:
    compliant:
      en: |
        A compliant device requirement blocks unmanaged devices instead of giving them a limited experience, and it does not choose the authentication method.
      fr: |
        L'exigence d'appareil conforme bloque les appareils non gérés au lieu de leur offrir une expérience limitée, et elle ne choisit pas la méthode d'authentification.
    persist:
      en: |
        Persistent browser session controls whether users stay signed in after closing the browser, not a sign-in interval.
      fr: |
        Persistent browser session détermine si les utilisateurs restent connectés après la fermeture du navigateur, pas un intervalle de connexion.
references:
  - title: "Conditional Access: Session"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-session
  - title: "Conditional Access: Grant"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-grant
