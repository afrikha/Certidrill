id: sc500-1c-std-kql-custom
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation uses Microsoft Defender for Cloud with Defender CSPM enabled on an Azure subscription named **Sub-Ops** and on a GCP project connected through a connector. You have the Owner role on Sub-Ops.

    You need Defender for Cloud to report, as a recommendation with a **High** severity, every virtual machine in Sub-Ops and in the GCP project that has no **CostCenter** tag. The findings for both clouds must appear in the same recommendation.

    What should you create?
  fr: |
    Adatum Corporation utilise Microsoft Defender for Cloud avec Defender CSPM activé sur un abonnement Azure nommé **Sub-Ops** et sur un projet GCP connecté par un connecteur. Vous disposez du rôle Owner sur Sub-Ops.

    Vous devez faire en sorte que Defender for Cloud signale, sous forme de recommandation de gravité **High**, chaque machine virtuelle de Sub-Ops et du projet GCP qui n'a pas d'étiquette **CostCenter**. Les résultats des deux clouds doivent apparaître dans la même recommandation.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "A custom recommendation based on a KQL query, added to a custom standard", fr: "Une recommandation personnalisée fondée sur une requête KQL, ajoutée à une norme personnalisée" }
    - id: b
      text: { en: "A custom Azure Policy definition with the Audit effect, assigned to Sub-Ops", fr: "Une définition Azure Policy personnalisée avec l'effet Audit, attribuée à Sub-Ops" }
    - id: c
      text: { en: "A governance rule with a condition on the CostCenter tag", fr: "Une règle de gouvernance avec une condition sur l'étiquette CostCenter" }
    - id: d
      text: { en: "A cloud security explorer query saved as a template", fr: "Une requête de l'explorateur de sécurité cloud enregistrée comme modèle" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With Defender CSPM, Security policies > Create custom recommendation lets you write a KQL query over the resource metadata of Azure, AWS and GCP, set a severity and remediation text, and assign the recommendation to a standard. One query can return the Azure and GCP virtual machines with a HEALTHY or UNHEALTHY status.
    fr: |
      Avec Defender CSPM, Security policies > Create custom recommendation permet d'écrire une requête KQL sur les métadonnées des ressources Azure, AWS et GCP, de définir une gravité et un texte de correction, puis d'attribuer la recommandation à une norme. Une seule requête peut renvoyer les machines virtuelles Azure et GCP avec un état HEALTHY ou UNHEALTHY.
  options:
    b:
      en: Azure Policy-based custom recommendations only evaluate Azure resources, so the GCP virtual machines would not be reported.
      fr: "Les recommandations personnalisées fondées sur Azure Policy n'évaluent que des ressources Azure : les machines virtuelles GCP ne seraient pas signalées."
    c:
      en: A governance rule assigns owners and due dates to existing recommendations; it does not define a new check.
      fr: Une règle de gouvernance attribue des propriétaires et des échéances à des recommandations existantes ; elle ne définit pas de nouveau contrôle.
    d:
      en: Cloud security explorer runs interactive queries on the security graph; a saved query does not produce a recommendation with a severity.
      fr: L'explorateur de sécurité cloud exécute des requêtes interactives sur le graphe de sécurité ; une requête enregistrée ne produit pas de recommandation avec une gravité.
references:
  - title: Create custom standards and recommendations in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/create-custom-recommendations
