id: sc500-1c-iac-stack-role
objective: "1.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys deploys a landing zone with a deployment stack named **stack-hub** at the scope of a resource group named **rg-hub**. A platform engineer named **Eng1** has the **Contributor** role and the **Azure Deployment Stack Contributor** role on rg-hub.

    Eng1 can update stack-hub when the deny settings mode is `none`. When Eng1 runs `Set-AzResourceGroupDeploymentStack` with `-DenySettingsMode "denyDelete"`, the operation fails with an authorization error.

    You need to allow Eng1 to apply deny settings to stack-hub. The solution must use the principle of least privilege.

    Which role should you assign to Eng1 on rg-hub?
  fr: |
    Wingtip Toys déploie une zone d'atterrissage avec une pile de déploiement nommée **stack-hub** à l'étendue d'un groupe de ressources nommé **rg-hub**. Un ingénieur plateforme nommé **Eng1** dispose des rôles **Contributor** et **Azure Deployment Stack Contributor** sur rg-hub.

    Eng1 peut mettre à jour stack-hub quand le mode des paramètres de refus est `none`. Quand Eng1 exécute `Set-AzResourceGroupDeploymentStack` avec `-DenySettingsMode "denyDelete"`, l'opération échoue avec une erreur d'autorisation.

    Vous devez permettre à Eng1 d'appliquer des paramètres de refus à stack-hub. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Eng1 sur rg-hub ?
body:
  options:
    - id: a
      text: Owner
    - id: b
      text: Resource Policy Contributor
    - id: c
      text: Azure Deployment Stack Owner
    - id: d
      text: Role Based Access Control Administrator
answer: { optionId: c }
explanation:
  correct:
    en: |
      Deny settings are enforced through deny assignments. Azure Deployment Stack Contributor can manage stacks but can't create or delete deny assignments, whereas Azure Deployment Stack Owner can manage stacks including those with deny settings. Eng1 keeps Contributor for the resources themselves.
    fr: |
      Les paramètres de refus sont appliqués par des affectations de refus. Azure Deployment Stack Contributor peut gérer les piles mais ne peut pas créer ni supprimer d'affectations de refus, alors qu'Azure Deployment Stack Owner peut gérer les piles, y compris celles qui ont des paramètres de refus. Eng1 conserve Contributor pour les ressources elles-mêmes.
  options:
    a:
      en: Owner would work but also grants full access management on rg-hub, which is more than needed.
      fr: Owner fonctionnerait, mais accorde aussi la gestion complète des accès sur rg-hub, ce qui dépasse le besoin.
    b:
      en: Resource Policy Contributor manages Azure Policy definitions and assignments, not deployment stack deny settings.
      fr: Resource Policy Contributor gère les définitions et attributions Azure Policy, pas les paramètres de refus des piles de déploiement.
    d:
      en: Role Based Access Control Administrator manages role assignments; it is not the role designed to manage stacks with deny settings.
      fr: Role Based Access Control Administrator gère les attributions de rôles ; ce n'est pas le rôle prévu pour gérer les piles avec des paramètres de refus.
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
