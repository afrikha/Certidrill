id: sc500-1a-ca-policy-hotarea
objective: "1.1.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses. The head office public IP range is defined in a named location that is marked as trusted. The following table shows the configuration of a Conditional Access policy named **CA-Admins-MFA**.

    Administrators report that they are never prompted for MFA. Their sign-in logs show the result **Report-only: User action required** for CA-Admins-MFA.

    Answer each prompt by selecting the setting that you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1. La plage d'adresses IP publiques du siège est définie dans un emplacement nommé marqué comme approuvé. Le tableau suivant présente la configuration d'une stratégie d'accès conditionnel nommée **CA-Admins-MFA**.

    Les administrateurs signalent qu'ils ne sont jamais invités à effectuer la MFA. Leurs journaux de connexion indiquent le résultat **Report-only: User action required** pour CA-Admins-MFA.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Administrators must be prompted for MFA at sign-in.", fr: "Les administrateurs doivent être invités à effectuer la MFA à la connexion." }
    - id: p2
      text: { en: "Once the policy is enforced, administrators must also be prompted when they sign in from the head office.", fr: "Une fois la stratégie appliquée, les administrateurs doivent aussi être sollicités lorsqu'ils se connectent depuis le siège." }
  grid:
    caption: { en: "CA-Admins-MFA", fr: "CA-Admins-MFA" }
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: { en: "Users", fr: "Utilisateurs" } }, { text: { en: "Include: Global Administrator, Security Administrator. Exclude: BreakGlass1", fr: "Inclure : Global Administrator, Security Administrator. Exclure : BreakGlass1" }, area: users }]
      - [{ text: { en: "Target resources", fr: "Ressources cibles" } }, { text: { en: "Include: All resources", fr: "Inclure : All resources" }, area: resources }]
      - [{ text: { en: "Network", fr: "Réseau" } }, { text: { en: "Include: Any network or location. Exclude: All trusted networks and locations", fr: "Inclure : Any network or location. Exclure : All trusted networks and locations" }, area: network }]
      - [{ text: { en: "Grant", fr: "Octroi" } }, { text: Require multifactor authentication, area: grant }]
      - [{ text: { en: "Session", fr: "Session" } }, { text: { en: "Sign-in frequency: 4 hours", fr: "Sign-in frequency : 4 heures" }, area: session }]
      - [{ text: { en: "Enable policy", fr: "Activer la stratégie" } }, { text: Report-only, area: state }]
answer:
  values: { p1: state, p2: network }
explanation:
  correct:
    en: |
      A policy in report-only mode is evaluated but its grant controls are not enforced; User action required means MFA would have been requested if the policy were on, so Enable policy must be set to On. The network condition excludes all trusted locations, so sign-ins from the head office are not in scope; removing that exclusion makes the policy apply everywhere.
    fr: |
      Une stratégie en mode rapport uniquement est évaluée mais ses contrôles d'octroi ne sont pas appliqués ; User action required signifie que la MFA aurait été demandée si la stratégie était activée : il faut régler Enable policy sur On. La condition réseau exclut tous les emplacements approuvés : les connexions depuis le siège sont hors de l'étendue, et supprimer cette exclusion applique la stratégie partout.
references:
  - title: Analyze Conditional Access Policy Impact
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-report-only
  - title: "Conditional Access: Network assignment"
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-assignment-network
