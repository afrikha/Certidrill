id: sc500-1a-mi-keyvault-secrets-user
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a virtual machine named **VM1** with a system-assigned managed identity and a key vault named **KV1** that uses the Azure role-based access control permission model.

    An application on VM1 must read the values of the secrets stored in KV1. It must not be able to create, update or delete secrets.

    You need to grant access by following the principle of least privilege.

    Which role should you assign to the managed identity of VM1 at the scope of KV1?
  fr: |
    Fabrikam, Inc. dispose d'une machine virtuelle nommée **VM1** avec une identité managée affectée par le système et d'un coffre de clés nommé **KV1** qui utilise le modèle d'autorisation contrôle d'accès en fonction du rôle Azure.

    Une application de VM1 doit lire les valeurs des secrets stockés dans KV1. Elle ne doit pas pouvoir créer, mettre à jour ni supprimer de secrets.

    Vous devez accorder l'accès en respectant le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'identité managée de VM1 dans l'étendue de KV1 ?
body:
  options:
    - id: a
      text: Key Vault Reader
    - id: b
      text: Key Vault Secrets Officer
    - id: c
      text: Key Vault Contributor
    - id: d
      text: Key Vault Secrets User
answer: { optionId: d }
explanation:
  correct:
    en: |
      Key Vault Secrets User reads secret contents, and nothing else, on vaults that use the Azure RBAC permission model. Assigned at the scope of KV1 to the principal of VM1's managed identity, it lets the application read secret values without any write permission.
    fr: |
      Key Vault Secrets User lit le contenu des secrets, et rien d'autre, sur les coffres qui utilisent le modèle d'autorisation Azure RBAC. Attribué dans l'étendue de KV1 au principal de l'identité managée de VM1, il permet à l'application de lire les valeurs des secrets sans aucune autorisation d'écriture.
  options:
    a:
      en: |
        Key Vault Reader reads metadata only; it cannot read sensitive values such as secret contents.
      fr: |
        Key Vault Reader ne lit que les métadonnées ; il ne peut pas lire de valeurs sensibles comme le contenu des secrets.
    b:
      en: |
        Key Vault Secrets Officer can perform any action on secrets, including create, update and delete.
      fr: |
        Key Vault Secrets Officer peut effectuer toute action sur les secrets, y compris les créer, les mettre à jour et les supprimer.
    c:
      en: |
        Key Vault Contributor manages the vault resource (control plane) and gives no access to secrets.
      fr: |
        Key Vault Contributor gère la ressource coffre (plan de contrôle) et ne donne aucun accès aux secrets.
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
