id: sc500-1b-kvs-near-expiry-event
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders stores the passwords of service accounts as secrets in a key vault named **kv-nw-svc**. A function app named **func-rotate** can generate a new password, update the service account, and create a new version of the secret.

    You need func-rotate to run automatically for each secret, well before the secret expires, without polling the vault.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders stocke les mots de passe de comptes de service sous forme de secrets dans un coffre de clés nommé **kv-nw-svc**. Une application de fonction nommée **func-rotate** sait générer un nouveau mot de passe, mettre à jour le compte de service et créer une nouvelle version du secret.

    func-rotate doit s'exécuter automatiquement pour chaque secret, bien avant l'expiration du secret, sans interroger le coffre en boucle.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. On each secret of kv-nw-svc, set the [[attr]] attribute.
      2. Create an Event Grid subscription on kv-nw-svc that filters on the [[evt]] event type and uses func-rotate as the endpoint.
      3. The event is raised [[days]] before the date set in step 1.
    fr: |
      1. Sur chaque secret de kv-nw-svc, définissez l'attribut [[attr]].
      2. Créez un abonnement Event Grid sur kv-nw-svc qui filtre le type d'événement [[evt]] et utilise func-rotate comme point de terminaison.
      3. L'événement est déclenché [[days]] avant la date définie à l'étape 1.
  slots:
    - id: attr
      options:
        - { id: exp, text: { en: "expiration date (exp)", fr: "date d'expiration (exp)" } }
        - { id: nbf, text: { en: "activation date (nbf)", fr: "date d'activation (nbf)" } }
        - { id: ctype, text: { en: "content type", fr: "type de contenu" } }
        - { id: enabled, text: { en: "enabled", fr: "enabled" } }
    - id: evt
      options:
        - { id: near, text: Microsoft.KeyVault.SecretNearExpiry }
        - { id: expired, text: Microsoft.KeyVault.SecretExpired }
        - { id: newver, text: Microsoft.KeyVault.SecretNewVersionCreated }
        - { id: policy, text: Microsoft.KeyVault.VaultAccessPolicyChanged }
    - id: days
      options:
        - { id: d7, text: { en: "7 days", fr: "7 jours" } }
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
        - { id: d60, text: { en: "60 days", fr: "60 jours" } }
        - { id: d90, text: { en: "90 days", fr: "90 jours" } }
answer:
  values: { attr: exp, evt: near, days: d30 }
explanation:
  correct:
    en: |
      Secrets have no built-in rotation: the near-expiry event is computed from the expiration date of the current version, so each secret needs an exp attribute. Microsoft.KeyVault.SecretNearExpiry is raised 30 days before that date, which gives func-rotate time to create the new version before the old one expires.
    fr: |
      Les secrets n'ont pas de rotation intégrée : l'événement d'expiration proche est calculé à partir de la date d'expiration de la version actuelle, donc chaque secret doit avoir un attribut exp. Microsoft.KeyVault.SecretNearExpiry est déclenché 30 jours avant cette date, ce qui laisse à func-rotate le temps de créer la nouvelle version avant l'expiration de l'ancienne.
  options:
    expired: { en: "SecretExpired is raised after the secret has expired, too late for the requirement.", fr: "SecretExpired est déclenché après l'expiration du secret, trop tard pour l'exigence." }
    newver: { en: "SecretNewVersionCreated fires when a version is created, which would trigger the function after each rotation.", fr: "SecretNewVersionCreated se déclenche à la création d'une version, ce qui lancerait la fonction après chaque rotation." }
    nbf: { en: "The activation date marks when a secret becomes valid; near-expiry events are based on the expiration date.", fr: "La date d'activation marque le début de validité d'un secret ; les événements d'expiration proche reposent sur la date d'expiration." }
references:
  - title: Azure Key Vault as Event Grid source
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-schema-key-vault
  - title: About Azure Key Vault secrets
    url: https://learn.microsoft.com/en-us/azure/key-vault/secrets/about-secrets
