id: sc500-1c-iac-stack-excluded
objective: "1.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. deploys its hub network (virtual network, Azure Firewall, route tables) from a Bicep file by using a pipeline that runs as a service principal named **sp-netpipe**. Five administrators have the **Owner** role on the subscription.

    You need to meet the following requirements:

    - The administrators must not be able to modify or delete the hub network resources directly.
    - sp-netpipe must still be able to update and redeploy the resources.
    - Firewall rule changes must be made only through the Bicep file.

    What should you do?
  fr: |
    Contoso, Ltd. déploie son réseau hub (réseau virtuel, Pare-feu Azure, tables de routage) à partir d'un fichier Bicep, au moyen d'un pipeline qui s'exécute sous un principal de service nommé **sp-netpipe**. Cinq administrateurs disposent du rôle **Owner** sur l'abonnement.

    Vous devez répondre aux exigences suivantes :

    - Les administrateurs ne doivent pas pouvoir modifier ni supprimer directement les ressources du réseau hub.
    - sp-netpipe doit toujours pouvoir mettre à jour et redéployer les ressources.
    - Les modifications des règles de pare-feu doivent passer uniquement par le fichier Bicep.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Apply a ReadOnly lock to the hub resource group, and grant sp-netpipe the Owner role on it.", fr: "Appliquer un verrou ReadOnly au groupe de ressources hub, et accorder à sp-netpipe le rôle Owner sur celui-ci." }
    - id: b
      text: { en: "Deploy the Bicep file as a deployment stack with `denyWriteAndDelete` and sp-netpipe as an excluded principal.", fr: "Déployer le fichier Bicep sous forme de pile de déploiement avec `denyWriteAndDelete` et sp-netpipe comme principal exclu." }
    - id: c
      text: { en: "Assign an Azure Policy definition with the `denyAction` effect for delete operations on the hub resource group.", fr: "Attribuer une définition Azure Policy avec l'effet `denyAction` pour les opérations de suppression sur le groupe de ressources hub." }
    - id: d
      text: { en: "Deploy the Bicep file as a deployment stack with `denyDelete` and the five administrators as excluded principals.", fr: "Déployer le fichier Bicep sous forme de pile de déploiement avec `denyDelete` et les cinq administrateurs comme principaux exclus." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A deployment stack with `denyWriteAndDelete` creates a deny assignment on the managed resources that blocks write and delete operations for everyone, Owners included, because deny assignments block actions even when a role assignment grants them. Adding sp-netpipe as an excluded principal (up to five are allowed) lets the pipeline keep updating the resources, so changes only go through the Bicep file.
    fr: |
      Une pile de déploiement avec `denyWriteAndDelete` crée sur les ressources gérées une affectation de refus qui bloque les écritures et les suppressions pour tout le monde, Owner compris, car les affectations de refus bloquent les actions même quand une attribution de rôle les accorde. Ajouter sp-netpipe comme principal exclu (cinq au maximum) permet au pipeline de continuer à mettre à jour les ressources : les modifications ne passent que par le fichier Bicep.
  options:
    a:
      en: Locks apply to every principal whatever its role, so a ReadOnly lock would also block sp-netpipe from updating the resources.
      fr: "Les verrous s'appliquent à tous les principaux quel que soit leur rôle : un verrou ReadOnly empêcherait aussi sp-netpipe de mettre à jour les ressources."
    c:
      en: denyAction only blocks delete operations; the administrators could still modify the firewall rules, and the pipeline's deletions would also be blocked.
      fr: denyAction ne bloque que les opérations de suppression ; les administrateurs pourraient encore modifier les règles de pare-feu, et les suppressions du pipeline seraient aussi bloquées.
    d:
      en: denyDelete does not block modifications, and excluding the administrators exempts exactly the people who must be blocked.
      fr: denyDelete ne bloque pas les modifications, et exclure les administrateurs exempte justement les personnes qui doivent être bloquées.
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
  - title: List Azure deny assignments
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/deny-assignments
