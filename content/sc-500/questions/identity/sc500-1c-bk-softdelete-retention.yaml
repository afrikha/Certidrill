id: sc500-1c-bk-softdelete-retention
objective: "1.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation backs up 30 Azure virtual machines to a Recovery Services vault named **rsv-prod**. Soft delete uses the default settings.

    A new security policy states that if backup data is deleted, by mistake or by an attacker, it must remain recoverable for **60 days** after the deletion.

    What should you do?
  fr: |
    Adatum Corporation sauvegarde 30 machines virtuelles Azure dans un coffre Recovery Services nommé **rsv-prod**. La suppression réversible utilise les paramètres par défaut.

    Une nouvelle stratégie de sécurité exige que des données de sauvegarde supprimées, par erreur ou par un attaquant, restent récupérables pendant **60 jours** après la suppression.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Increase the daily retention of the backup policy to 60 days.", fr: "Augmenter à 60 jours la rétention quotidienne de la stratégie de sauvegarde." }
    - id: b
      text: { en: "Enable Cross Region Restore on rsv-prod.", fr: "Activer Cross Region Restore sur rsv-prod." }
    - id: c
      text: { en: "Associate rsv-prod with a Resource Guard.", fr: "Associer rsv-prod à un Resource Guard." }
    - id: d
      text: { en: "Set the soft delete retention period of rsv-prod to 60 days.", fr: "Définir sur 60 jours la période de rétention de la suppression réversible de rsv-prod." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Soft delete keeps deleted backup data for a retention period that defaults to 14 days and can be set between 14 and 180 days. The first 14 days are free; regular backup charges apply to the additional days. During that period the data can be undeleted.
    fr: |
      La suppression réversible conserve les données de sauvegarde supprimées pendant une période de rétention de 14 jours par défaut, réglable entre 14 et 180 jours. Les 14 premiers jours sont gratuits ; les frais de sauvegarde habituels s'appliquent aux jours supplémentaires. Pendant cette période, les données peuvent être restaurées.
  options:
    a:
      en: Policy retention defines how long recovery points are kept while protection runs; once someone deletes the backup data, soft delete retention decides how long it stays recoverable.
      fr: La rétention de la stratégie définit la durée de conservation des points de récupération pendant la protection ; une fois les données de sauvegarde supprimées, c'est la rétention de la suppression réversible qui fixe leur durée de récupération.
    b:
      en: Cross Region Restore lets you restore in the paired region; it does not keep deleted data longer.
      fr: Cross Region Restore permet de restaurer dans la région jumelée ; il ne conserve pas plus longtemps les données supprimées.
    c:
      en: A Resource Guard requires authorization for critical operations but does not set how long deleted data is kept.
      fr: Un Resource Guard exige une autorisation pour les opérations critiques, mais ne fixe pas la durée de conservation des données supprimées.
references:
  - title: Secure by default with soft delete for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-security-feature-cloud
