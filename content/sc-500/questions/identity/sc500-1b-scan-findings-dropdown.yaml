id: sc500-1b-scan-findings-dropdown
objective: "1.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Microsoft Defender for Cloud with the Defender CSPM plan and agentless scanning for machines on an Azure subscription and on a connected Google Cloud project. Both environments contain virtual machines.

    You need to review the secrets findings of each environment, and to find the Azure VMs whose plaintext secrets can authenticate to an Azure SQL database by using a built-in query template.

    How should you complete the review plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. utilise Microsoft Defender for Cloud avec le plan Defender CSPM et l'analyse sans agent des machines sur un abonnement Azure et sur un projet Google Cloud connecté. Les deux environnements contiennent des machines virtuelles.

    Vous devez examiner les résultats de secrets de chaque environnement, et trouver les VM Azure dont les secrets en texte clair permettent de s'authentifier auprès d'une base de données Azure SQL à l'aide d'un modèle de requête intégré.

    Comment devez-vous compléter le plan d'examen ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure virtual machines: open the recommendation [[az]].
      Google Cloud VM instances: open the recommendation [[gcp]].
      VMs with a secret that can authenticate to an Azure SQL database: use [[tool]].
    fr: |
      Machines virtuelles Azure : ouvrez la recommandation [[az]].
      Instances de VM Google Cloud : ouvrez la recommandation [[gcp]].
      VM dont un secret peut s'authentifier auprès d'une base Azure SQL : utilisez [[tool]].
  slots:
    - id: az
      options:
        - { id: machines, text: Machines should have secrets findings resolved }
        - { id: ec2, text: EC2 instances should have secrets findings resolved }
        - { id: vminst, text: VM instances should have secrets findings resolved }
    - id: gcp
      options:
        - { id: machines, text: Machines should have secrets findings resolved }
        - { id: ec2, text: EC2 instances should have secrets findings resolved }
        - { id: vminst, text: VM instances should have secrets findings resolved }
    - id: tool
      options:
        - { id: explorer, text: { en: "cloud security explorer", fr: "l'explorateur de sécurité cloud" } }
        - { id: alerts, text: { en: "the Security alerts page", fr: "la page Security alerts" } }
        - { id: compliance, text: { en: "the Regulatory compliance dashboard", fr: "le tableau de bord Regulatory compliance" } }
        - { id: workbooks, text: { en: "the Workbooks page", fr: "la page Workbooks" } }
answer:
  values: { az: machines, gcp: vminst, tool: explorer }
explanation:
  correct:
    en: |
      Defender for Cloud raises one recommendation per cloud, under the Remediate vulnerabilities control: Machines should have secrets findings resolved for Azure, EC2 instances should have secrets findings resolved for AWS, and VM instances should have secrets findings resolved for GCP. Cloud security explorer queries the cloud security graph and offers built-in templates such as VM with plaintext secret that can authenticate to an SQL database.
    fr: |
      Defender for Cloud génère une recommandation par cloud, sous le contrôle Remediate vulnerabilities : Machines should have secrets findings resolved pour Azure, EC2 instances should have secrets findings resolved pour AWS, et VM instances should have secrets findings resolved pour GCP. L'explorateur de sécurité cloud interroge le graphe de sécurité cloud et propose des modèles intégrés comme VM with plaintext secret that can authenticate to an SQL database.
  options:
    ec2: { en: "This recommendation covers AWS EC2 instances, which Fabrikam doesn't use.", fr: "Cette recommandation couvre les instances EC2 d'AWS, que Fabrikam n'utilise pas." }
    alerts: { en: "Secrets findings are posture findings, not security alerts.", fr: "Les résultats de secrets sont des constats de posture, pas des alertes de sécurité." }
    compliance: { en: "The compliance dashboard maps controls to standards; it doesn't run graph queries.", fr: "Le tableau de bord de conformité associe les contrôles aux normes ; il n'exécute pas de requêtes sur le graphe." }
references:
  - title: Machine secrets scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning-servers
  - title: Protecting secrets in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning
