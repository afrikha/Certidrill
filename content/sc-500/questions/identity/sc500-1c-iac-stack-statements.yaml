id: sc500-1c-iac-stack-statements
objective: "1.3.9"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. runs the following command. The Bicep file deploys a storage account named **stlogs01** and a key vault named **kv-logs01** in **rg-logs**.

    ```powershell
    New-AzResourceGroupDeploymentStack -Name "stack-logs" `
      -ResourceGroupName "rg-logs" -TemplateFile "main.bicep" `
      -ActionOnUnmanage "detachAll" -DenySettingsMode "denyWriteAndDelete"
    ```

    A user named **Admin1** has the **Owner** role on rg-logs and is not excluded from the deny settings. A user named **Data1** has the **Storage Blob Data Contributor** role on stlogs01.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. exécute la commande suivante. Le fichier Bicep déploie un compte de stockage nommé **stlogs01** et un coffre de clés nommé **kv-logs01** dans **rg-logs**.

    ```powershell
    New-AzResourceGroupDeploymentStack -Name "stack-logs" `
      -ResourceGroupName "rg-logs" -TemplateFile "main.bicep" `
      -ActionOnUnmanage "detachAll" -DenySettingsMode "denyWriteAndDelete"
    ```

    Un utilisateur nommé **Admin1** dispose du rôle **Owner** sur rg-logs et n'est pas exclu des paramètres de refus. Un utilisateur nommé **Data1** dispose du rôle **Storage Blob Data Contributor** sur stlogs01.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Admin1 can change the network rules of kv-logs01 in the Azure portal.
        fr: Admin1 peut modifier les règles réseau de kv-logs01 dans le portail Azure.
    - id: s2
      text:
        en: Data1 can upload blobs to an existing container in stlogs01.
        fr: Data1 peut charger des objets blob dans un conteneur existant de stlogs01.
    - id: s3
      text:
        en: If kv-logs01 is removed from main.bicep and the stack is updated with the same parameters, kv-logs01 is deleted.
        fr: Si kv-logs01 est retiré de main.bicep et que la pile est mise à jour avec les mêmes paramètres, kv-logs01 est supprimé.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      `denyWriteAndDelete` creates a deny assignment that blocks control plane writes and deletes on the managed resources for every principal that isn't excluded, Owners included. Deny settings only apply to control plane operations, so Data1 can still write blobs through the data plane. With `-ActionOnUnmanage "detachAll"`, a resource removed from the template is detached from the stack and left in place, not deleted.
    fr: |
      `denyWriteAndDelete` crée une affectation de refus qui bloque les écritures et suppressions du plan de contrôle sur les ressources gérées pour tout principal non exclu, Owner compris. Les paramètres de refus ne s'appliquent qu'aux opérations du plan de contrôle : Data1 peut toujours écrire des objets blob par le plan de données. Avec `-ActionOnUnmanage "detachAll"`, une ressource retirée du modèle est détachée de la pile et conservée, pas supprimée.
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
