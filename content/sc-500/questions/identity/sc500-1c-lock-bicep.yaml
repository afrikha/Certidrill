id: sc500-1c-lock-bicep
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank deploys its Azure resources with Bicep. A key vault named **kv-pay-prod** already exists in the resource group targeted by the deployment.

    You need to add a lock to the Bicep file that meets the following requirements:

    - Nobody can delete kv-pay-prod while the lock exists.
    - Administrators can still update the configuration of kv-pay-prod, such as its firewall rules.
    - The lock applies to kv-pay-prod only, not to the other resources of the resource group.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank déploie ses ressources Azure avec Bicep. Un coffre de clés nommé **kv-pay-prod** existe déjà dans le groupe de ressources ciblé par le déploiement.

    Vous devez ajouter au fichier Bicep un verrou qui répond aux exigences suivantes :

    - Personne ne peut supprimer kv-pay-prod tant que le verrou existe.
    - Les administrateurs peuvent toujours modifier la configuration de kv-pay-prod, par exemple ses règles de pare-feu.
    - Le verrou s'applique uniquement à kv-pay-prod, pas aux autres ressources du groupe de ressources.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource kv 'Microsoft.KeyVault/vaults@2023-07-01' existing = {
      name: 'kv-pay-prod'
    }

    resource kvLock 'Microsoft.Authorization/locks@2020-05-01' = {
      name: 'lock-kv-pay-prod'
      scope: [[scope]]
      properties: {
        level: [[level]]
        notes: 'Production key vault must not be deleted.'
      }
    }
  slots:
    - id: scope
      options:
        - { id: rg, text: resourceGroup() }
        - { id: sym, text: kv }
        - { id: name, text: "'kv-pay-prod'" }
    - id: level
      options:
        - { id: ro, text: "'ReadOnly'" }
        - { id: del, text: "'Delete'" }
        - { id: deny, text: "'DenyDelete'" }
        - { id: cnd, text: "'CanNotDelete'" }
answer:
  values: { scope: sym, level: cnd }
explanation:
  correct:
    en: |
      A lock is an extension resource: setting `scope` to the symbolic name of the existing key vault applies it to that resource only. The `CanNotDelete` level blocks deletion while still allowing authorized users to read and modify the resource.
    fr: |
      Un verrou est une ressource d'extension : définir `scope` avec le nom symbolique du coffre de clés existant l'applique à cette seule ressource. Le niveau `CanNotDelete` bloque la suppression tout en permettant aux utilisateurs autorisés de lire et de modifier la ressource.
  options:
    rg: { en: "Scoping the lock to the resource group would protect every resource of the group, not only the key vault.", fr: "Appliquer le verrou au groupe de ressources protégerait toutes les ressources du groupe, pas seulement le coffre de clés." }
    name: { en: "The scope property expects a resource reference (symbolic name), not a name string.", fr: "La propriété scope attend une référence de ressource (nom symbolique), pas une chaîne contenant un nom." }
    ro: { en: "ReadOnly would also block updates such as firewall rule changes.", fr: "ReadOnly bloquerait aussi les mises à jour, comme la modification des règles de pare-feu." }
    del: { en: "Delete is the name shown in the portal; the API and Bicep value is CanNotDelete.", fr: "Delete est le nom affiché dans le portail ; la valeur de l'API et de Bicep est CanNotDelete." }
    deny: { en: "DenyDelete is a deny settings mode of deployment stacks, not a lock level.", fr: "DenyDelete est un mode des paramètres de refus des piles de déploiement, pas un niveau de verrou." }
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
  - title: Set scope for extension resources in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/scope-extension-resources
