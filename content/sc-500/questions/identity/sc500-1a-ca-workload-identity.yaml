id: sc500-1a-ca-workload-identity
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has a single-tenant application registered in its Microsoft Entra tenant. The application's service principal, **sp-billing**, requests tokens by using the client credentials flow from servers in the head office. The head office public IP range is defined in a named location named **CorpNet**.

    You need to block token requests by sp-billing that come from outside CorpNet.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. a une application monolocataire inscrite dans son locataire Microsoft Entra. Le principal de service de l'application, **sp-billing**, demande des jetons avec le flux d'informations d'identification du client depuis des serveurs du siège. La plage d'adresses IP publiques du siège est définie dans un emplacement nommé appelé **CorpNet**.

    Vous devez bloquer les demandes de jetons de sp-billing qui proviennent de l'extérieur de CorpNet.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Acquire Workload Identities Premium licenses for the tenant.", fr: "Acquérir des licences Workload Identities Premium pour le locataire." } }
    - { id: b, text: { en: "Add sp-billing to a security group and create a policy that targets the group and blocks all locations except CorpNet.", fr: "Ajouter sp-billing à un groupe de sécurité et créer une stratégie qui cible le groupe et bloque tous les emplacements sauf CorpNet." } }
    - { id: c, text: { en: "Create a policy that targets sp-billing directly as a workload identity and blocks all locations except CorpNet.", fr: "Créer une stratégie qui cible directement sp-billing comme identité de charge de travail et bloque tous les emplacements sauf CorpNet." } }
    - { id: d, text: { en: "Create a policy that targets sp-billing and grants access only with Require multifactor authentication outside CorpNet.", fr: "Créer une stratégie qui cible sp-billing et n'accorde l'accès hors de CorpNet qu'avec Require multifactor authentication." } }
    - { id: e, text: { en: "Assign Microsoft Entra ID P2 licenses to the owners of the application.", fr: "Attribuer des licences Microsoft Entra ID P2 aux propriétaires de l'application." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Creating or modifying Conditional Access policies scoped to service principals requires Workload Identities Premium licenses. The service principal must be assigned directly to the policy as a workload identity, with Locations including any location and excluding CorpNet, and Block access as the grant control.
    fr: |
      Créer ou modifier des stratégies d'accès conditionnel qui ciblent des principaux de service exige des licences Workload Identities Premium. Le principal de service doit être affecté directement à la stratégie comme identité de charge de travail, avec la condition Locations qui inclut tous les emplacements et exclut CorpNet, et Block access comme contrôle d'octroi.
  options:
    b:
      en: |
        A policy assigned to a group that contains a service principal is not enforced for that service principal.
      fr: |
        Une stratégie affectée à un groupe qui contient un principal de service n'est pas appliquée à ce principal de service.
    d:
      en: |
        A service principal cannot perform MFA; for workload identities, Block access is the only available grant control.
      fr: |
        Un principal de service ne peut pas effectuer de MFA ; pour les identités de charge de travail, Block access est le seul contrôle d'octroi disponible.
    e:
      en: |
        The feature is licensed with Workload Identities Premium, not with P2 licenses for the application owners.
      fr: |
        La fonctionnalité est couverte par Workload Identities Premium, pas par des licences P2 pour les propriétaires de l'application.
references:
  - title: Conditional Access for workload identities
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/workload-identity
