id: sc500-1c-op-pim-standing
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure subscription named **Sub-Fin**. Microsoft Defender for Cloud reports the recommendation **Privileged roles should not have permanent access at the subscription and resource group level** for four administrators who have active **Owner** assignments on Sub-Fin. All the users have Microsoft Entra ID P2 licenses.

    The administrators need Owner rights about twice a month for a few hours. You need to remediate the recommendation. The administrators must still be able to obtain Owner rights on Sub-Fin after completing multifactor authentication and entering a justification.

    What should you do?
  fr: |
    Fabrikam, Inc. dispose d'un abonnement Azure nommé **Sub-Fin**. Microsoft Defender for Cloud signale la recommandation **Privileged roles should not have permanent access at the subscription and resource group level** pour quatre administrateurs qui ont des attributions actives du rôle **Owner** sur Sub-Fin. Tous les utilisateurs disposent de licences Microsoft Entra ID P2.

    Les administrateurs ont besoin des droits Owner environ deux fois par mois pendant quelques heures. Vous devez corriger la recommandation. Les administrateurs doivent toujours pouvoir obtenir les droits Owner sur Sub-Fin après une authentification multifacteur et la saisie d'une justification.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Convert the Owner assignments to eligible assignments in Privileged Identity Management, with MFA and justification required on activation.", fr: "Convertir les attributions Owner en attributions éligibles dans Privileged Identity Management, avec MFA et justification exigées à l'activation." }
    - id: b
      text: { en: "Keep the Owner assignments and create a Conditional Access policy that requires MFA for Windows Azure Service Management API.", fr: "Conserver les attributions Owner et créer une stratégie d'accès conditionnel qui exige la MFA pour Windows Azure Service Management API." }
    - id: c
      text: { en: "Replace the Owner assignments with permanent Contributor assignments on Sub-Fin.", fr: "Remplacer les attributions Owner par des attributions Contributor permanentes sur Sub-Fin." }
    - id: d
      text: { en: "Create an exemption for the recommendation with the Risk accepted (waiver) category.", fr: "Créer une exemption pour la recommandation avec la catégorie Risk accepted (waiver)." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Eligible assignments in Privileged Identity Management give no standing access: administrators activate Owner only when needed, for a limited duration, and the role settings can require MFA and a justification on activation. This removes the permanent privileged access that the recommendation flags while keeping the occasional Owner rights.
    fr: |
      Les attributions éligibles de Privileged Identity Management ne donnent aucun accès permanent : les administrateurs activent Owner uniquement en cas de besoin, pour une durée limitée, et les paramètres du rôle peuvent exiger la MFA et une justification à l'activation. Cela supprime l'accès privilégié permanent signalé par la recommandation tout en conservant les droits Owner occasionnels.
  options:
    b:
      en: MFA at sign-in strengthens authentication, but the Owner assignments remain permanent, so the recommendation stays unhealthy.
      fr: "La MFA à la connexion renforce l'authentification, mais les attributions Owner restent permanentes : la recommandation reste non saine."
    c:
      en: Contributor is still a privileged administrator role assigned permanently, and it no longer gives the Owner rights the administrators need.
      fr: Contributor reste un rôle d'administrateur privilégié attribué en permanence, et il ne donne plus les droits Owner dont les administrateurs ont besoin.
    d:
      en: A waiver hides the finding without reducing the standing privileges.
      fr: Une exemption waiver masque le résultat sans réduire les privilèges permanents.
references:
  - title: Identity and access security recommendations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/recommendations-reference-identity-access
  - title: Assign Azure resource roles in Privileged Identity Management
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-assign-roles
