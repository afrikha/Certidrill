id: sc500-1c-cr-entra-app-scope
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses for all users. The tenant contains 300 app registrations, including one named **PayrollApi**. The members of a group named **Payroll-Devs** must rotate the client secrets and certificates of PayrollApi.

    You need to grant the permission to Payroll-Devs. The members must not be able to change any other setting of PayrollApi or manage any other application.

    What should you do?
  fr: |
    Proseware, Inc. dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1 pour tous les utilisateurs. Le locataire contient 300 inscriptions d'applications, dont une nommée **PayrollApi**. Les membres d'un groupe nommé **Payroll-Devs** doivent renouveler les secrets client et les certificats de PayrollApi.

    Vous devez accorder cette autorisation à Payroll-Devs. Les membres ne doivent pouvoir modifier aucun autre paramètre de PayrollApi ni gérer aucune autre application.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the Cloud Application Administrator role to Payroll-Devs at the tenant scope.", fr: "Attribuer le rôle Cloud Application Administrator à Payroll-Devs à l'étendue du locataire." }
    - id: b
      text: { en: "Create an Azure custom role that contains the permission to update application credentials, and assign it on the subscription.", fr: "Créer un rôle personnalisé Azure qui contient l'autorisation de mettre à jour les informations d'identification des applications, et l'attribuer sur l'abonnement." }
    - id: c
      text: { en: "Assign the Application Administrator role to Payroll-Devs at the tenant scope.", fr: "Attribuer le rôle Application Administrator à Payroll-Devs à l'étendue du locataire." }
    - id: d
      text: { en: "Create a Microsoft Entra custom role with `microsoft.directory/applications/credentials/update`, and assign it to Payroll-Devs at the scope of PayrollApi.", fr: "Créer un rôle personnalisé Microsoft Entra avec `microsoft.directory/applications/credentials/update`, et l'attribuer à Payroll-Devs à l'étendue de PayrollApi." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Microsoft Entra custom role is built from Microsoft Entra permissions, so it can contain only the credential update permission. Assigning it at the scope of a single app registration limits it to PayrollApi. Custom role assignments require Microsoft Entra ID P1, which the tenant has.
    fr: |
      Un rôle personnalisé Microsoft Entra est composé d'autorisations Microsoft Entra : il peut ne contenir que l'autorisation de mise à jour des informations d'identification. L'attribuer à l'étendue d'une seule inscription d'application le limite à PayrollApi. Les attributions de rôles personnalisés nécessitent Microsoft Entra ID P1, dont dispose le locataire.
  options:
    a:
      en: Cloud Application Administrator at the tenant scope can manage all app registrations and enterprise applications.
      fr: Cloud Application Administrator à l'étendue du locataire peut gérer toutes les inscriptions d'applications et applications d'entreprise.
    b:
      en: Azure custom roles contain Azure Resource Manager operations; Microsoft Entra permissions on app registrations cannot be added to them.
      fr: Les rôles personnalisés Azure contiennent des opérations Azure Resource Manager ; on ne peut pas y ajouter d'autorisations Microsoft Entra sur les inscriptions d'applications.
    c:
      en: Application Administrator at the tenant scope covers every application and many settings beyond credentials.
      fr: Application Administrator à l'étendue du locataire couvre toutes les applications et de nombreux paramètres au-delà des informations d'identification.
references:
  - title: Create a custom role in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-create
