id: sc500-cs2b-key-rotation
objective: "1.2.5"
type: dropdown
caseStudy: sc500-cs2b-city-power-light
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the rotation policy of cmk-upload to meet the key requirement.

    How should you complete the policy? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la stratégie de rotation de cmk-upload pour respecter l'exigence relative à la clé.

    Comment devez-vous compléter la stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "lifetimeActions": [
        {
          "trigger": { "[[trigger]]": "P1Y" },
          "action": { "type": "[[action]]" }
        },
        {
          "trigger": { "timeBeforeExpiry": "P30D" },
          "action": { "type": "Notify" }
        }
      ],
      "attributes": { "expiryTime": "[[expiry]]" }
    }
  slots:
    - id: trigger
      options:
        - { id: after, text: timeAfterCreate }
        - { id: before, text: timeBeforeExpiry }
        - { id: exp, text: expiryTime }
    - id: action
      options:
        - { id: rotate, text: Rotate }
        - { id: notify, text: Notify }
    - id: expiry
      options:
        - { id: p30d, text: P30D }
        - { id: p1y, text: P1Y }
        - { id: p15m, text: P15M }
        - { id: p2y, text: P2Y }
answer:
  values: { trigger: after, action: rotate, expiry: p15m }
explanation:
  correct:
    en: "A lifetime action with the `timeAfterCreate` trigger and the `Rotate` action creates a new key version 12 months (`P1Y`) after the current version was created. `expiryTime` sets the expiration of each newly rotated version, here 15 months (`P15M`). The `Notify` action with `timeBeforeExpiry` raises the near-expiry Event Grid event 30 days before the expiration, and stcplupload picks up new versions because it uses a versionless key URI."
    fr: "Une action de cycle de vie avec le déclencheur `timeAfterCreate` et l'action `Rotate` crée une nouvelle version de la clé 12 mois (`P1Y`) après la création de la version actuelle. `expiryTime` définit l'expiration de chaque nouvelle version issue de la rotation, ici 15 mois (`P15M`). L'action `Notify` avec `timeBeforeExpiry` déclenche l'événement Event Grid d'expiration proche 30 jours avant l'expiration, et stcplupload prend en compte les nouvelles versions parce qu'il utilise un URI de clé sans version."
  options:
    before: { en: "timeBeforeExpiry would rotate the key one year before it expires, which with a 15-month expiry means 3 months after creation.", fr: "timeBeforeExpiry ferait tourner la clé un an avant son expiration, soit 3 mois après sa création avec une expiration à 15 mois." }
    exp: { en: "expiryTime is an attribute of the policy, not a trigger of a lifetime action.", fr: "expiryTime est un attribut de la stratégie, pas un déclencheur d'action de cycle de vie." }
    notify: { en: "Notify only raises an event; it doesn't create a new key version.", fr: "Notify ne fait que déclencher un événement ; il ne crée pas de nouvelle version de la clé." }
    p1y: { en: "P1Y would make each version expire 12 months after creation, not 15.", fr: "P1Y ferait expirer chaque version 12 mois après sa création, pas 15." }
references:
  - title: Configure cryptographic key auto-rotation in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation
