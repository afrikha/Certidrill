id: sc500-1b-scan-devops-iac
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a subscription named **Sub-Prod**. Microsoft Defender for Servers Plan 2 is enabled on Sub-Prod with agentless scanning for machines turned on, and Defender for Cloud already reports plaintext secrets found on virtual machine disks.

    The security team also needs Defender for Cloud to report exposed secrets in the following locations:

    - the Azure DevOps repositories of the company;
    - the infrastructure-as-code deployment resources of Sub-Prod.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un abonnement nommé **Sub-Prod**. Microsoft Defender for Servers Plan 2 est activé sur Sub-Prod avec l'analyse sans agent des machines activée, et Defender for Cloud signale déjà les secrets en texte clair trouvés sur les disques des machines virtuelles.

    L'équipe sécurité a aussi besoin que Defender for Cloud signale les secrets exposés aux emplacements suivants :

    - les référentiels Azure DevOps de l'entreprise ;
    - les ressources de déploiement d'infrastructure en tant que code de Sub-Prod.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the Defender CSPM plan.", fr: "Activer le plan Defender CSPM." } }
    - { id: b, text: { en: "Enable the Defender for Key Vault plan.", fr: "Activer le plan Defender for Key Vault." } }
    - { id: c, text: { en: "Enable file integrity monitoring in Defender for Servers Plan 2.", fr: "Activer la surveillance de l'intégrité des fichiers dans Defender for Servers Plan 2." } }
    - { id: d, text: { en: "Enable the Defender for App Service plan.", fr: "Activer le plan Defender for App Service." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Defender for Servers Plan 2 covers only machine secrets scanning. Scanning cloud deployment resources and discovering exposed secrets in Azure DevOps repositories both require the Defender CSPM plan.
    fr: |
      Defender for Servers Plan 2 ne couvre que l'analyse des secrets des machines. L'analyse des ressources de déploiement cloud et la découverte des secrets exposés dans les référentiels Azure DevOps exigent toutes deux le plan Defender CSPM.
  options:
    b:
      en: "Defender for Key Vault monitors access to key vaults; it doesn't look for secrets outside them."
      fr: "Defender for Key Vault surveille l'accès aux coffres de clés ; il ne recherche pas de secrets en dehors."
    c:
      en: "File integrity monitoring tracks changes to files and registry keys on machines; it doesn't scan repositories or deployments."
      fr: "La surveillance de l'intégrité des fichiers suit les modifications des fichiers et des clés de registre sur les machines ; elle n'analyse ni les référentiels ni les déploiements."
    d:
      en: "Defender for App Service detects attacks against web apps; it doesn't scan repositories or deployment resources for secrets."
      fr: "Defender for App Service détecte les attaques contre les applications web ; il n'analyse pas les référentiels ni les ressources de déploiement à la recherche de secrets."
references:
  - title: Protecting secrets in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning
