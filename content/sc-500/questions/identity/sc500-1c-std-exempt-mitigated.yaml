id: sc500-1c-std-exempt-mitigated
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure subscription named **Sub-Web** that has the Microsoft cloud security benchmark assigned in Microsoft Defender for Cloud. A recommendation flags 12 virtual machines in a resource group named **rg-legacy**. A non-Microsoft security product that Defender for Cloud does not track already mitigates the issue on those 12 virtual machines.

    You need to stop the recommendation from reporting the 12 virtual machines. The virtual machines must count as healthy in the secure score, and the recommendation must keep evaluating the other virtual machines of Sub-Web.

    What should you do?
  fr: |
    Fabrikam, Inc. dispose d'un abonnement Azure nommé **Sub-Web** auquel le Microsoft cloud security benchmark est attribué dans Microsoft Defender for Cloud. Une recommandation signale 12 machines virtuelles dans un groupe de ressources nommé **rg-legacy**. Un produit de sécurité non Microsoft, que Defender for Cloud ne suit pas, atténue déjà le problème sur ces 12 machines virtuelles.

    Vous devez empêcher la recommandation de signaler les 12 machines virtuelles. Celles-ci doivent compter comme saines dans le score de sécurité, et la recommandation doit continuer à évaluer les autres machines virtuelles de Sub-Web.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create an exemption for the 12 virtual machines with the **Risk accepted (waiver)** category.", fr: "Créer une exemption pour les 12 machines virtuelles avec la catégorie **Risk accepted (waiver)**." }
    - id: b
      text: { en: "Create an exemption for the 12 virtual machines with the **Resolved through third-party service (mitigated)** category.", fr: "Créer une exemption pour les 12 machines virtuelles avec la catégorie **Resolved through third-party service (mitigated)**." }
    - id: c
      text: { en: "Set the effect of the recommendation to **Disabled** in the Microsoft cloud security benchmark of Sub-Web.", fr: "Définir l'effet de la recommandation sur **Disabled** dans le Microsoft cloud security benchmark de Sub-Web." }
    - id: d
      text: { en: "Create a governance rule for rg-legacy that sets the security product's team as the owner.", fr: "Créer une règle de gouvernance pour rg-legacy qui désigne l'équipe du produit de sécurité comme propriétaire." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An exemption scoped to selected resources removes only those resources from the recommendation. The **mitigated** category states that a non-Microsoft service handles the issue, and the exempted resources count as healthy for the secure score.
    fr: |
      Une exemption limitée à des ressources sélectionnées ne retire que ces ressources de la recommandation. La catégorie **mitigated** indique qu'un service non Microsoft traite le problème, et les ressources exemptées comptent comme saines pour le score de sécurité.
  options:
    a:
      en: The waiver category means that you accept the risk; the resources are excluded from the secure score calculation instead of counting as healthy.
      fr: La catégorie waiver signifie que vous acceptez le risque ; les ressources sont exclues du calcul du score de sécurité au lieu de compter comme saines.
    c:
      en: Disabling the recommendation stops evaluating every virtual machine of the subscription, not only the 12 covered by the other product.
      fr: Désactiver la recommandation arrête l'évaluation de toutes les machines virtuelles de l'abonnement, pas seulement des 12 couvertes par l'autre produit.
    d:
      en: A governance rule assigns an owner and a due date to fix the recommendation; the virtual machines stay unhealthy.
      fr: Une règle de gouvernance attribue un propriétaire et une échéance pour corriger la recommandation ; les machines virtuelles restent non saines.
references:
  - title: Exempt resources from recommendations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/exempt-resource
