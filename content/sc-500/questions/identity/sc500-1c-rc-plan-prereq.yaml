id: sc500-1c-rc-plan-prereq
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has an Azure subscription named **Sub-Retail**. In Microsoft Defender for Cloud, the only paid plan enabled on Sub-Retail is **Defender for Servers Plan 1**. You have the Owner role on Sub-Retail.

    You need to track the compliance of Sub-Retail with **PCI DSS** on the **Regulatory compliance** dashboard. The **Microsoft cloud security benchmark** must remain assigned.

    What should you do first?
  fr: |
    Tailspin Toys dispose d'un abonnement Azure nommé **Sub-Retail**. Dans Microsoft Defender for Cloud, le seul plan payant activé sur Sub-Retail est **Defender for Servers Plan 1**. Vous disposez du rôle Owner sur Sub-Retail.

    Vous devez suivre la conformité de Sub-Retail à **PCI DSS** dans le tableau de bord **Regulatory compliance**. Le **Microsoft cloud security benchmark** doit rester attribué.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Enable the Defender for APIs Plan 1 plan on Sub-Retail.", fr: "Activer le plan Defender for APIs Plan 1 sur Sub-Retail." }
    - id: b
      text: { en: "Assign the Security Admin role to yourself on Sub-Retail.", fr: "Vous attribuer le rôle Security Admin sur Sub-Retail." }
    - id: c
      text: { en: "Enable the Defender for Storage plan on Sub-Retail.", fr: "Activer le plan Defender for Storage sur Sub-Retail." }
    - id: d
      text: { en: "Create an exemption for the Microsoft cloud security benchmark on Sub-Retail.", fr: "Créer une exemption pour le Microsoft cloud security benchmark sur Sub-Retail." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Standards other than the default Microsoft cloud security benchmark can only be added when at least one paid Defender for Cloud plan is enabled, and Defender for Servers Plan 1 and Defender for APIs Plan 1 do not count. Enabling another paid plan such as Defender for Storage meets the prerequisite; you can then turn on PCI DSS in Security policies.
    fr: |
      Les normes autres que le Microsoft cloud security benchmark par défaut ne peuvent être ajoutées que si au moins un plan payant de Defender for Cloud est activé, et Defender for Servers Plan 1 et Defender for APIs Plan 1 ne comptent pas. Activer un autre plan payant comme Defender for Storage remplit ce prérequis ; vous pouvez ensuite activer PCI DSS dans Security policies.
  options:
    a:
      en: Defender for APIs Plan 1 is one of the two plans that do not unlock additional compliance standards.
      fr: Defender for APIs Plan 1 fait partie des deux plans qui ne donnent pas accès aux normes de conformité supplémentaires.
    b:
      en: You already have Owner, which is enough to add a standard; the missing prerequisite is the plan, not a role.
      fr: Vous disposez déjà du rôle Owner, suffisant pour ajouter une norme ; le prérequis manquant est le plan, pas un rôle.
    d:
      en: An exemption removes resources from a recommendation's evaluation; it does not make new standards available.
      fr: Une exemption retire des ressources de l'évaluation d'une recommandation ; elle ne rend pas de nouvelles normes disponibles.
references:
  - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages
