id: sc500-1c-op-replace-owner
objective: "1.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has an Azure subscription named **Sub-Apps** that contains a key vault named **kv-orders** and a storage account named **storders**, both configured to use Azure RBAC for data access. The system-assigned managed identity of an App Service app named **app-orders** has the **Owner** role on Sub-Apps.

    A review shows that app-orders only reads secret values from kv-orders and uploads, reads and deletes blobs in storders. You need to remove the Owner assignment and grant only the permissions that app-orders needs.

    Which two role assignments should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un abonnement Azure nommé **Sub-Apps** qui contient un coffre de clés nommé **kv-orders** et un compte de stockage nommé **storders**, tous deux configurés pour utiliser Azure RBAC pour l'accès aux données. L'identité managée affectée par le système d'une application App Service nommée **app-orders** dispose du rôle **Owner** sur Sub-Apps.

    Une revue montre qu'app-orders se contente de lire les valeurs des secrets de kv-orders, et de charger, lire et supprimer des objets blob dans storders. Vous devez supprimer l'attribution Owner et n'accorder que les autorisations dont app-orders a besoin.

    Quelles sont les deux attributions de rôles à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Key Vault Secrets User on kv-orders", fr: "Key Vault Secrets User sur kv-orders" } }
    - { id: b, text: { en: "Key Vault Reader on kv-orders", fr: "Key Vault Reader sur kv-orders" } }
    - { id: c, text: { en: "Storage Account Contributor on storders", fr: "Storage Account Contributor sur storders" } }
    - { id: d, text: { en: "Storage Blob Data Contributor on storders", fr: "Storage Blob Data Contributor sur storders" } }
    - { id: e, text: { en: "Key Vault Secrets Officer on kv-orders", fr: "Key Vault Secrets Officer sur kv-orders" } }
    - { id: f, text: { en: "Storage Blob Data Owner on storders", fr: "Storage Blob Data Owner sur storders" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Key Vault Secrets User reads secret contents and nothing else. Storage Blob Data Contributor reads, writes and deletes blobs and containers. Both are data plane roles assigned at the resource scope, which replaces subscription-wide Owner with exactly the access the app uses.
    fr: |
      Key Vault Secrets User lit le contenu des secrets et rien d'autre. Storage Blob Data Contributor lit, écrit et supprime des objets blob et des conteneurs. Ces deux rôles du plan de données, attribués à l'étendue de la ressource, remplacent Owner sur tout l'abonnement par exactement l'accès utilisé par l'application.
  options:
    b:
      en: Key Vault Reader reads vault and object metadata but not secret values.
      fr: Key Vault Reader lit les métadonnées du coffre et des objets, mais pas les valeurs des secrets.
    c:
      en: Storage Account Contributor manages the account on the control plane, including listing the access keys, which grants far more than the app needs.
      fr: Storage Account Contributor gère le compte sur le plan de contrôle, y compris la liste des clés d'accès, ce qui accorde bien plus que ce dont l'application a besoin.
    e:
      en: Key Vault Secrets Officer can also create, update and delete secrets, which the app does not need.
      fr: Key Vault Secrets Officer peut aussi créer, modifier et supprimer des secrets, ce dont l'application n'a pas besoin.
    f:
      en: Storage Blob Data Owner also manages POSIX ACLs and ownership, which exceeds the app's needs.
      fr: Storage Blob Data Owner gère aussi les ACL POSIX et la propriété, ce qui dépasse les besoins de l'application.
references:
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
