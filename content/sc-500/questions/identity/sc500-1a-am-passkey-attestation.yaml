id: sc500-1a-am-passkey-attestation
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank allows only two models of FIDO2 security keys. The **Passkey (FIDO2)** method of the Authentication methods policy is configured as follows:

    | Setting | Value |
    | --- | --- |
    | Allow self-service set up | Yes |
    | Enforce attestation | No |
    | Enforce key restrictions | Yes |
    | Key restriction behavior | Allow |
    | AAGUIDs | AAGUIDs of the two approved models |

    An audit shows that users can still register passkeys whose make and model cannot be verified.

    You need to ensure that, from now on, only authenticators whose make and model are verified as one of the two approved models can be registered.

    What should you do?
  fr: |
    Woodgrove Bank n'autorise que deux modèles de clés de sécurité FIDO2. La méthode **Passkey (FIDO2)** de la stratégie des méthodes d'authentification est configurée comme suit :

    | Paramètre | Valeur |
    | --- | --- |
    | Allow self-service set up | Yes |
    | Enforce attestation | No |
    | Enforce key restrictions | Yes |
    | Comportement de restriction des clés | Allow |
    | AAGUIDs | AAGUID des deux modèles approuvés |

    Un audit montre que des utilisateurs peuvent encore inscrire des clés d'accès dont la marque et le modèle ne peuvent pas être vérifiés.

    Vous devez faire en sorte que, désormais, seuls les authentificateurs dont la marque et le modèle sont vérifiés comme l'un des deux modèles approuvés puissent être inscrits.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set Allow self-service set up to No.", fr: "Régler Allow self-service set up sur No." }
    - id: b
      text: { en: "Set Enforce attestation to Yes.", fr: "Régler Enforce attestation sur Yes." }
    - id: c
      text: { en: "Change the key restriction behavior to Block.", fr: "Changer le comportement de restriction des clés en Block." }
    - id: d
      text: { en: "Run a registration campaign that targets Passkey (FIDO2).", fr: "Lancer une campagne d'inscription qui cible Passkey (FIDO2)." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With attestation enforced, Microsoft Entra ID verifies the make and model of the authenticator against trusted metadata at registration. Without attestation, the AAGUID reported by the authenticator is not verified, so the key restriction list is only a guide rather than a strict control. Attestation applies at registration only; keys registered earlier are not blocked.
    fr: |
      Lorsque l'attestation est appliquée, Microsoft Entra ID vérifie la marque et le modèle de l'authentificateur auprès de métadonnées approuvées au moment de l'inscription. Sans attestation, l'AAGUID déclaré par l'authentificateur n'est pas vérifié : la liste de restriction des clés n'est qu'une indication, pas un contrôle strict. L'attestation ne s'applique qu'à l'inscription ; les clés inscrites auparavant ne sont pas bloquées.
  options:
    a:
      en: |
        Disabling self-service setup prevents users from registering any passkey in Security info, including the approved models.
      fr: |
        Désactiver la configuration en libre-service empêche les utilisateurs d'inscrire toute clé d'accès dans Security info, y compris les modèles approuvés.
    c:
      en: |
        Block would reject the two approved models and allow every other model.
      fr: |
        Block rejetterait les deux modèles approuvés et autoriserait tous les autres modèles.
    d:
      en: |
        A registration campaign nudges users to register a method; it does not verify which authenticator they use.
      fr: |
        Une campagne d'inscription incite les utilisateurs à inscrire une méthode ; elle ne vérifie pas l'authentificateur utilisé.
references:
  - title: How to enable passkeys (FIDO2) in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-enable-passkey-fido2
