id: sc500-1b-kvs-cmk-prereqs
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a key vault named **kv-lw-data** that uses the Azure role-based access control (Azure RBAC) permission model. kv-lw-data was created with the default settings: soft delete is enabled with a 90-day retention period, and purge protection is not enabled. kv-lw-data contains an RSA key named **cmk-st**.

    You need to configure a storage account named **stlwarchive** to encrypt its data with cmk-st as a customer-managed key. stlwarchive has a system-assigned managed identity. The solution must follow the principle of least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'un coffre de clés nommé **kv-lw-data** qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC). kv-lw-data a été créé avec les paramètres par défaut : la suppression réversible est activée avec une période de rétention de 90 jours, et la protection contre le vidage n'est pas activée. kv-lw-data contient une clé RSA nommée **cmk-st**.

    Vous devez configurer un compte de stockage nommé **stlwarchive** pour qu'il chiffre ses données avec cmk-st comme clé gérée par le client. stlwarchive dispose d'une identité managée affectée par le système. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable purge protection on kv-lw-data.", fr: "Activer la protection contre le vidage sur kv-lw-data." } }
    - { id: b, text: { en: "Change the pricing tier of kv-lw-data to Premium.", fr: "Passer kv-lw-data au niveau tarifaire Premium." } }
    - { id: c, text: { en: "Assign the Key Vault Crypto Service Encryption User role to the identity of stlwarchive.", fr: "Attribuer le rôle Key Vault Crypto Service Encryption User à l'identité de stlwarchive." } }
    - { id: d, text: { en: "Assign the Key Vault Secrets User role to the identity of stlwarchive.", fr: "Attribuer le rôle Key Vault Secrets User à l'identité de stlwarchive." } }
    - { id: e, text: { en: "Enable access to Azure Disk Encryption for volume encryption on kv-lw-data.", fr: "Activer l'accès à Azure Disk Encryption pour le chiffrement de volume sur kv-lw-data." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Services that encrypt data with your keys, such as Azure Storage, require purge protection on the key vault, which is off by default. The storage account's managed identity then needs to read the key and perform wrap and unwrap operations, which is exactly what Key Vault Crypto Service Encryption User grants.
    fr: |
      Les services qui chiffrent des données avec vos clés, comme le Stockage Azure, exigent la protection contre le vidage sur le coffre, désactivée par défaut. L'identité managée du compte de stockage doit ensuite lire la clé et effectuer les opérations d'enveloppement et de désenveloppement (wrap et unwrap), ce que permet exactement Key Vault Crypto Service Encryption User.
  options:
    b:
      en: "Premium is needed only for HSM-protected keys; an RSA software-protected key in the Standard tier works as a customer-managed key."
      fr: "Premium n'est nécessaire que pour les clés protégées par HSM ; une clé RSA protégée par logiciel au niveau Standard convient comme clé gérée par le client."
    d:
      en: "Secrets User reads secret values; it grants no wrap or unwrap operation on keys."
      fr: "Secrets User lit les valeurs des secrets ; il n'accorde aucune opération d'enveloppement ou de désenveloppement sur les clés."
    e:
      en: "This setting lets Azure Disk Encryption retrieve secrets and unwrap keys for VM volumes; Azure Storage encryption does not use it."
      fr: "Ce paramètre permet à Azure Disk Encryption de récupérer des secrets et de désenvelopper des clés pour les volumes des VM ; le chiffrement du Stockage Azure ne l'utilise pas."
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
