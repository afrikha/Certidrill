id: sc500-1b-scan-remediate-order
objective: "1.2.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Microsoft Defender for Cloud reports the recommendation **Machines should have secrets findings resolved** for an Azure virtual machine named **VM-Report**. A reporting application on VM-Report reads blobs from a storage account named **streports** by using a connection string that contains an account access key, stored in plaintext in a configuration file on the disk.

    You need to remediate the finding. The application must no longer use any long-lived credential, and it must keep working without interruption.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Microsoft Defender for Cloud signale la recommandation **Machines should have secrets findings resolved** pour une machine virtuelle Azure nommée **VM-Report**. Une application de rapports sur VM-Report lit des objets blob dans un compte de stockage nommé **streports** avec une chaîne de connexion qui contient une clé d'accès du compte, stockée en texte clair dans un fichier de configuration sur le disque.

    Vous devez corriger ce constat. L'application ne doit plus utiliser aucune information d'identification de longue durée, et elle doit continuer à fonctionner sans interruption.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: mi, text: { en: "Enable a system-assigned managed identity on VM-Report.", fr: "Activer une identité managée affectée par le système sur VM-Report." } }
    - { id: role, text: { en: "Assign the Storage Blob Data Reader role on streports to the identity of VM-Report.", fr: "Attribuer le rôle Storage Blob Data Reader sur streports à l'identité de VM-Report." } }
    - { id: switch, text: { en: "Change the application to authenticate with the managed identity, and delete the connection string from the disk.", fr: "Modifier l'application pour qu'elle s'authentifie avec l'identité managée, puis supprimer la chaîne de connexion du disque." } }
    - { id: rotate, text: { en: "Regenerate the storage account access key that was exposed.", fr: "Régénérer la clé d'accès du compte de stockage qui a été exposée." } }
    - { id: kv, text: { en: "Store the connection string as a secret in a key vault, and grant VM-Report the Key Vault Secrets User role.", fr: "Stocker la chaîne de connexion comme secret dans un coffre de clés, puis accorder à VM-Report le rôle Key Vault Secrets User." } }
    - { id: dismiss, text: { en: "Exempt VM-Report from the recommendation.", fr: "Exempter VM-Report de la recommandation." } }
answer:
  sequence: [ mi, role, switch, rotate ]
explanation:
  correct:
    en: |
      The identity must exist before it can receive a role, and the role must be in place before the application switches to it. Once the application no longer uses the key and the connection string is removed from the disk, regenerating the exposed key invalidates the leaked credential without interrupting the application. Defender for Cloud recommends removing plaintext secrets and preferring identities or short-lived credentials.
    fr: |
      L'identité doit exister avant de recevoir un rôle, et le rôle doit être en place avant que l'application ne l'utilise. Une fois que l'application n'utilise plus la clé et que la chaîne de connexion est supprimée du disque, régénérer la clé exposée invalide l'information d'identification divulguée sans interrompre l'application. Defender for Cloud recommande de supprimer les secrets en texte clair et de privilégier les identités ou les informations d'identification de courte durée.
  options:
    kv: { en: "Moving the connection string to Key Vault still leaves the application using a long-lived account key.", fr: "Déplacer la chaîne de connexion dans Key Vault laisse l'application utiliser une clé de compte de longue durée." }
    dismiss: { en: "An exemption hides the finding without removing the exposed secret.", fr: "Une exemption masque le constat sans supprimer le secret exposé." }
references:
  - title: Machine secrets scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning-servers
