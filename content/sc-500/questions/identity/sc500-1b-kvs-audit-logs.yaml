id: sc500-1b-kvs-audit-logs
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has a key vault named **kv-pw-api** and a Log Analytics workspace named **law-sec**.

    The compliance team must be able to run Kusto queries that show which identity read each secret of kv-pw-api, from which IP address and when. The records must be kept for one year.

    What should you configure?
  fr: |
    Proseware, Inc. dispose d'un coffre de clés nommé **kv-pw-api** et d'un espace de travail Log Analytics nommé **law-sec**.

    L'équipe conformité doit pouvoir exécuter des requêtes Kusto qui montrent quelle identité a lu chaque secret de kv-pw-api, depuis quelle adresse IP et à quel moment. Les enregistrements doivent être conservés un an.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A diagnostic setting on kv-pw-api that sends the AuditEvent category to law-sec", fr: "Un paramètre de diagnostic sur kv-pw-api qui envoie la catégorie AuditEvent vers law-sec" } }
    - { id: b, text: { en: "A diagnostic setting on the subscription that sends the activity log to law-sec", fr: "Un paramètre de diagnostic sur l'abonnement qui envoie le journal d'activité vers law-sec" } }
    - { id: c, text: { en: "An Event Grid subscription on kv-pw-api that sends events to law-sec", fr: "Un abonnement Event Grid sur kv-pw-api qui envoie les événements vers law-sec" } }
    - { id: d, text: { en: "The Microsoft Defender for Key Vault plan on the subscription that contains kv-pw-api", fr: "Le plan Microsoft Defender for Key Vault sur l'abonnement qui contient kv-pw-api" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Key Vault logs every operation, such as SecretGet, in the AuditEvent category, with the caller identity, the caller IP address and the time. A diagnostic setting sends these resource logs to a Log Analytics workspace, where they can be queried with Kusto and retained for the period configured on the workspace.
    fr: |
      Key Vault journalise chaque opération, par exemple SecretGet, dans la catégorie AuditEvent, avec l'identité de l'appelant, son adresse IP et l'heure. Un paramètre de diagnostic envoie ces journaux de ressources vers un espace de travail Log Analytics, où ils sont interrogeables en Kusto et conservés pendant la durée configurée sur l'espace de travail.
  options:
    b:
      en: "The activity log records control plane operations on the vault, not data plane reads of secrets."
      fr: "Le journal d'activité enregistre les opérations du plan de contrôle sur le coffre, pas les lectures de secrets dans le plan de données."
    c:
      en: "Key Vault Event Grid events cover object life cycle changes such as new versions or near expiry, not each secret read."
      fr: "Les événements Event Grid de Key Vault couvrent les changements de cycle de vie des objets, comme les nouvelles versions ou l'expiration proche, pas chaque lecture de secret."
    d:
      en: "Defender for Key Vault raises alerts on anomalous access; it does not keep a record of every operation."
      fr: "Defender for Key Vault déclenche des alertes sur les accès anormaux ; il ne conserve pas l'enregistrement de chaque opération."
references:
  - title: Azure Key Vault logging
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/logging
