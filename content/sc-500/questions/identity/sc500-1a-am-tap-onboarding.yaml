id: sc500-1a-am-tap-onboarding
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. is moving all employees to passwordless sign-in. New employees receive a FIDO2 security key on their first day, and they must never be given a password.

    You need to allow each new employee to sign in once and register the security key. The method must be time-limited and issued by an administrator.

    Which authentication method should you enable in the Authentication methods policy?
  fr: |
    Fabrikam, Inc. fait passer tous ses employés à la connexion sans mot de passe. Les nouveaux employés reçoivent une clé de sécurité FIDO2 le premier jour, et aucun mot de passe ne doit leur être communiqué.

    Vous devez permettre à chaque nouvel employé de se connecter une fois et d'inscrire la clé de sécurité. La méthode doit être limitée dans le temps et délivrée par un administrateur.

    Quelle méthode d'authentification devez-vous activer dans la stratégie des méthodes d'authentification ?
body:
  options:
    - id: a
      text: { en: "SMS-based sign-in", fr: "Connexion par SMS" }
    - id: b
      text: { en: "Software OATH tokens", fr: "Jetons OATH logiciels" }
    - id: c
      text: { en: "Microsoft Authenticator push notifications", fr: "Notifications Push de Microsoft Authenticator" }
    - id: d
      text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Temporary Access Pass is a time-limited passcode created by an administrator. It lets a user sign in without a password and register passwordless methods such as passkeys (FIDO2) or Microsoft Authenticator, which makes it the onboarding method for passwordless users.
    fr: |
      Un passe d'accès temporaire est un code secret limité dans le temps créé par un administrateur. Il permet à l'utilisateur de se connecter sans mot de passe et d'inscrire des méthodes sans mot de passe comme les clés d'accès (FIDO2) ou Microsoft Authenticator : c'est la méthode d'intégration des utilisateurs sans mot de passe.
  options:
    a:
      en: |
        SMS sign-in uses a code sent to a phone number that must already be registered; it is not a time-limited credential issued by an administrator.
      fr: |
        La connexion par SMS utilise un code envoyé à un numéro déjà inscrit ; ce n'est pas une information d'identification limitée dans le temps délivrée par un administrateur.
    b:
      en: |
        A software OATH token must be registered by the user, which requires a first sign-in.
      fr: |
        Un jeton OATH logiciel doit être inscrit par l'utilisateur, ce qui exige une première connexion.
    c:
      en: |
        Push notifications require Microsoft Authenticator to be registered first; new employees have nothing registered yet.
      fr: |
        Les notifications Push exigent que Microsoft Authenticator soit déjà inscrit ; les nouveaux employés n'ont encore rien inscrit.
references:
  - title: Configure Temporary Access Pass to register passwordless authentication methods
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-temporary-access-pass
