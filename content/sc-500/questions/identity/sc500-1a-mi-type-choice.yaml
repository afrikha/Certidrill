id: sc500-1a-mi-type-choice
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. runs three Azure App Service web apps that must read blobs from the same storage account with the same permissions. The web apps are deleted and redeployed every week by a pipeline.

    You need to provide an identity for the web apps. Permissions must stay in place when the web apps are redeployed, and no credential must be stored or rotated.

    What should you use?
  fr: |
    Contoso, Ltd. exécute trois applications web Azure App Service qui doivent lire des objets blob du même compte de stockage avec les mêmes autorisations. Les applications web sont supprimées et redéployées chaque semaine par un pipeline.

    Vous devez fournir une identité aux applications web. Les autorisations doivent être conservées lors des redéploiements, et aucune information d'identification ne doit être stockée ni renouvelée.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "A system-assigned managed identity on each web app", fr: "Une identité managée affectée par le système sur chaque application web" }
    - id: b
      text: { en: "An app registration with a client secret stored in the app settings", fr: "Une inscription d'application avec une clé secrète client stockée dans les paramètres de l'application" }
    - id: c
      text: { en: "A user-assigned managed identity shared by the web apps", fr: "Une identité managée affectée par l'utilisateur partagée par les applications web" }
    - id: d
      text: { en: "The storage account access key stored in the app settings", fr: "La clé d'accès du compte de stockage stockée dans les paramètres de l'application" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A user-assigned managed identity is a standalone Azure resource with an independent life cycle, and it can be associated with several resources. Its role assignments survive when the web apps are deleted and recreated, and Azure manages its credentials.
    fr: |
      Une identité managée affectée par l'utilisateur est une ressource Azure autonome au cycle de vie indépendant, qui peut être associée à plusieurs ressources. Ses attributions de rôles survivent à la suppression et à la recréation des applications web, et Azure gère ses informations d'identification.
  options:
    a:
      en: |
        A system-assigned identity is deleted with its web app, so a new identity and new role assignments would be needed after each redeployment.
      fr: |
        Une identité affectée par le système est supprimée avec son application web : il faudrait une nouvelle identité et de nouvelles attributions de rôles après chaque redéploiement.
    b:
      en: |
        A client secret is a stored credential that expires and must be rotated.
      fr: |
        Une clé secrète client est une information d'identification stockée qui expire et doit être renouvelée.
    d:
      en: |
        An access key is a stored credential that grants full access to the account and must be rotated.
      fr: |
        Une clé d'accès est une information d'identification stockée qui donne un accès complet au compte et doit être renouvelée.
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
