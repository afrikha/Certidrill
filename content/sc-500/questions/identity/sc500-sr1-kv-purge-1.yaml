id: sc500-sr1-kv-purge-1
objective: "1.2.2"
type: series_yesno
series: sc500-sr1-kv-purge
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You apply a CanNotDelete lock to KV1.
  fr: Vous appliquez un verrou CanNotDelete à KV1.
body:
  solution:
    en: |
      You apply a resource lock of type **CanNotDelete** (**Delete** in the Azure portal) to KV1. You do not change the properties of KV1.
    fr: |
      Vous appliquez à KV1 un verrou de ressource de type **CanNotDelete** (verrou **Suppression** dans le portail Azure). Vous ne modifiez pas les propriétés de KV1.
answer: { value: false }
explanation:
  correct:
    en: |
      Resource locks apply only to control plane operations sent to Azure Resource Manager. Deleting and purging a secret are data plane operations sent to the vault endpoint, so the lock does not stop them. The lock only prevents the deletion of the KV1 resource itself, and secrets can still be purged because purge protection stays disabled.
    fr: |
      Les verrous de ressource s'appliquent uniquement aux opérations du plan de contrôle envoyées à Azure Resource Manager. La suppression et la purge d'un secret sont des opérations du plan de données envoyées au point de terminaison du coffre : le verrou ne les bloque pas. Il empêche seulement la suppression de la ressource KV1 elle-même, et les secrets peuvent toujours être purgés car la protection contre le vidage reste désactivée.
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
  - title: Azure Key Vault soft-delete
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
