id: sc500-1b-kvf-statements
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a key vault named **kv-fab-cmk**. Its **Allow access from** setting is **Disable public access**, and **Allow trusted Microsoft services to bypass this firewall** is selected. A private endpoint connects kv-fab-cmk to a virtual network named **vnet-hub**. A storage account named **stfabdocs** encrypts its data with a customer-managed key stored in kv-fab-cmk.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'un coffre de clés nommé **kv-fab-cmk**. Son paramètre **Allow access from** a la valeur **Disable public access**, et **Allow trusted Microsoft services to bypass this firewall** est sélectionné. Un point de terminaison privé relie kv-fab-cmk à un réseau virtuel nommé **vnet-hub**. Un compte de stockage nommé **stfabdocs** chiffre ses données avec une clé gérée par le client stockée dans kv-fab-cmk.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An administrator who has the Key Vault Contributor role and connects from the internet is prevented from changing the tags of kv-fab-cmk in the Azure portal."
        fr: "Un administrateur qui a le rôle Key Vault Contributor et se connecte depuis Internet est empêché de modifier les étiquettes de kv-fab-cmk dans le portail Azure."
    - id: s2
      text:
        en: "stfabdocs can wrap and unwrap its key in kv-fab-cmk even though stfabdocs uses no private endpoint."
        fr: "stfabdocs peut envelopper et désenvelopper sa clé dans kv-fab-cmk bien que stfabdocs n'utilise aucun point de terminaison privé."
    - id: s3
      text:
        en: "If kv-fab-cmk is associated with a network security perimeter in Transition mode, requests that no perimeter rule allows are blocked."
        fr: "Si kv-fab-cmk est associé à un périmètre de sécurité réseau en mode Transition, les requêtes qu'aucune règle du périmètre n'autorise sont bloquées."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The Key Vault firewall restricts only the data plane (vault.azure.net); control plane operations through Azure Resource Manager, such as changing tags, aren't affected. Azure Storage is a trusted service for customer-managed keys, and the trusted services exception still applies when public access is disabled, so no private endpoint is needed for it. Transition mode only logs the traffic that would be denied; Enforced mode is the one that blocks it.
    fr: |
      Le pare-feu de Key Vault ne restreint que le plan de données (vault.azure.net) ; les opérations du plan de contrôle via Azure Resource Manager, comme la modification des étiquettes, ne sont pas concernées. Le Stockage Azure est un service approuvé pour les clés gérées par le client, et l'exception des services approuvés s'applique toujours quand l'accès public est désactivé : aucun point de terminaison privé n'est nécessaire pour lui. Le mode Transition se contente de journaliser le trafic qui serait refusé ; c'est le mode Enforced qui le bloque.
references:
  - title: Configure network security for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/network-security
  - title: Virtual network service endpoints for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview-vnet-service-endpoints
