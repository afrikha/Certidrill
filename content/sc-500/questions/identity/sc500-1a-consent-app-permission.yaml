id: sc500-1a-consent-app-permission
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. develops a background service named **MailArchiver** that runs every night and reads the messages of all mailboxes in Exchange Online through Microsoft Graph. No user is signed in when the service runs.

    Which type of Microsoft Graph permission should MailArchiver request, and who can consent to it?
  fr: |
    Fabrikam, Inc. développe un service d'arrière-plan nommé **MailArchiver** qui s'exécute chaque nuit et lit les messages de toutes les boîtes aux lettres d'Exchange Online via Microsoft Graph. Aucun utilisateur n'est connecté lorsque le service s'exécute.

    Quel type d'autorisation Microsoft Graph MailArchiver doit-il demander, et qui peut y consentir ?
body:
  options:
    - id: a
      text: { en: "A delegated permission, consented by each mailbox owner", fr: "Une autorisation déléguée, consentie par chaque propriétaire de boîte aux lettres" }
    - id: b
      text: { en: "A delegated permission, consented by an administrator for all users", fr: "Une autorisation déléguée, consentie par un administrateur pour tous les utilisateurs" }
    - id: c
      text: { en: "An application permission, consented by any user of the tenant", fr: "Une autorisation d'application, consentie par n'importe quel utilisateur du locataire" }
    - id: d
      text: { en: "An application permission, consented by an administrator", fr: "Une autorisation d'application, consentie par un administrateur" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Application permissions (app roles) let an app access data without a signed-in user, and the app can access any data the permission covers. Only an administrator can consent to application permissions.
    fr: |
      Les autorisations d'application (rôles d'application) permettent à une application d'accéder aux données sans utilisateur connecté, et l'application peut accéder à toutes les données couvertes par l'autorisation. Seul un administrateur peut consentir aux autorisations d'application.
  options:
    a:
      en: |
        Delegated permissions act on behalf of a signed-in user; the service runs with no user.
      fr: |
        Les autorisations déléguées agissent au nom d'un utilisateur connecté ; le service s'exécute sans utilisateur.
    b:
      en: |
        Admin consent for all users does not change the nature of delegated permissions: they still need a signed-in user.
      fr: |
        Le consentement administrateur pour tous les utilisateurs ne change pas la nature des autorisations déléguées : elles exigent toujours un utilisateur connecté.
    c:
      en: |
        Users can never consent to application permissions.
      fr: |
        Les utilisateurs ne peuvent jamais consentir aux autorisations d'application.
references:
  - title: Overview of permissions and consent in the Microsoft identity platform
    url: https://learn.microsoft.com/en-us/entra/identity-platform/permissions-consent-overview
