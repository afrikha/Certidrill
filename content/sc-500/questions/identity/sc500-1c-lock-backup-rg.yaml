id: sc500-1c-lock-backup-rg
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has an Azure subscription named **Sub-Prod** that contains 40 virtual machines in four resource groups. The virtual machines are backed up daily to a Recovery Services vault. To protect production, an administrator applied a **CanNotDelete** lock named **ProdLock** at the scope of Sub-Prod.

    Several weeks later, the virtual machine backup jobs start to fail. Investigation shows that the Azure Backup service can no longer clean up restore points in the resource group that it created to store restore point collections.

    You need to resolve the backup failures. The four resource groups that contain the virtual machines must remain protected against deletion.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un abonnement Azure nommé **Sub-Prod** qui contient 40 machines virtuelles réparties dans quatre groupes de ressources. Les machines virtuelles sont sauvegardées chaque jour dans un coffre Recovery Services. Pour protéger la production, un administrateur a appliqué un verrou **CanNotDelete** nommé **ProdLock** à l'étendue de Sub-Prod.

    Plusieurs semaines plus tard, les travaux de sauvegarde des machines virtuelles commencent à échouer. L'analyse montre que le service Sauvegarde Azure ne peut plus nettoyer les points de restauration dans le groupe de ressources qu'il a créé pour stocker les collections de points de restauration.

    Vous devez résoudre les échecs de sauvegarde. Les quatre groupes de ressources qui contiennent les machines virtuelles doivent rester protégés contre la suppression.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change ProdLock from CanNotDelete to ReadOnly.", fr: "Remplacer le niveau de ProdLock CanNotDelete par ReadOnly." }
    - id: b
      text: { en: "Assign the Backup Contributor role on Sub-Prod to the Backup Management Service.", fr: "Attribuer le rôle Backup Contributor sur Sub-Prod au service Backup Management Service." }
    - id: c
      text: { en: "Remove ProdLock, and then apply a CanNotDelete lock to each of the four resource groups.", fr: "Supprimer ProdLock, puis appliquer un verrou CanNotDelete à chacun des quatre groupes de ressources." }
    - id: d
      text: { en: "Enable immutability on the Recovery Services vault.", fr: "Activer l'immuabilité sur le coffre Recovery Services." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A lock applied at a parent scope is inherited by every resource group and resource below it, including the resource group created by Azure Backup, so the service can no longer delete old restore points and the backups fail. Locking only the four workload resource groups keeps them protected while leaving the Azure Backup resource group unlocked.
    fr: |
      Un verrou appliqué à une étendue parente est hérité par tous les groupes de ressources et ressources situés en dessous, y compris le groupe de ressources créé par Sauvegarde Azure : le service ne peut plus supprimer les anciens points de restauration et les sauvegardes échouent. Verrouiller uniquement les quatre groupes de ressources des charges de travail les protège tout en laissant le groupe de ressources de Sauvegarde Azure sans verrou.
  options:
    a:
      en: "A ReadOnly lock is more restrictive: it still blocks deletions and also blocks updates, so the backups would keep failing."
      fr: "Un verrou ReadOnly est plus restrictif : il bloque toujours les suppressions et bloque aussi les mises à jour, donc les sauvegardes continueraient d'échouer."
    b:
      en: Locks apply to every user and service whatever their role, so a role assignment cannot override the inherited lock.
      fr: "Les verrous s'appliquent à tous les utilisateurs et services quel que soit leur rôle : une attribution de rôle ne peut pas contourner le verrou hérité."
    d:
      en: Immutability protects recovery points in the vault from deletion; it does not remove the lock that blocks the restore point cleanup.
      fr: L'immuabilité protège les points de récupération du coffre contre la suppression ; elle ne retire pas le verrou qui bloque le nettoyage des points de restauration.
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
