id: sc500-1a-app-roles-daemon
objective: "1.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has two app registrations in its Microsoft Entra tenant:

    - **InventoryAPI**, a web API that authorizes callers by reading the `roles` claim of access tokens.
    - **SyncDaemon**, a background service that calls InventoryAPI as itself, without a signed-in user. SyncDaemon already has a certificate credential.

    You need SyncDaemon to receive access tokens for InventoryAPI that contain the role **Inventory.ReadWrite**.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. a deux inscriptions d'applications dans son locataire Microsoft Entra :

    - **InventoryAPI**, une API web qui autorise les appelants en lisant la revendication `roles` des jetons d'accès ;
    - **SyncDaemon**, un service d'arrière-plan qui appelle InventoryAPI en son propre nom, sans utilisateur connecté. SyncDaemon possède déjà des informations d'identification par certificat.

    SyncDaemon doit recevoir pour InventoryAPI des jetons d'accès qui contiennent le rôle **Inventory.ReadWrite**.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: approle, text: { en: "In InventoryAPI, create the app role Inventory.ReadWrite with the allowed member type Applications.", fr: "Dans InventoryAPI, créer le rôle d'application Inventory.ReadWrite avec le type de membre autorisé Applications." } }
    - { id: perm, text: { en: "In SyncDaemon, add the Inventory.ReadWrite application permission from My APIs in API permissions.", fr: "Dans SyncDaemon, ajouter l'autorisation d'application Inventory.ReadWrite depuis My APIs dans API permissions." } }
    - { id: consent, text: { en: "Grant admin consent for the tenant on SyncDaemon's API permissions.", fr: "Accorder le consentement administrateur pour le locataire sur les autorisations d'API de SyncDaemon." } }
    - { id: scope, text: { en: "In InventoryAPI, add the scope Inventory.ReadWrite in Expose an API.", fr: "Dans InventoryAPI, ajouter l'étendue Inventory.ReadWrite dans Expose an API." } }
    - { id: secret, text: { en: "In SyncDaemon, add a client secret.", fr: "Dans SyncDaemon, ajouter une clé secrète client." } }
    - { id: userassign, text: { en: "In the InventoryAPI enterprise application, assign Inventory.ReadWrite to the administrators group.", fr: "Dans l'application d'entreprise InventoryAPI, affecter Inventory.ReadWrite au groupe des administrateurs." } }
answer:
  sequence: [ approle, perm, consent ]
explanation:
  correct:
    en: |
      An app role whose allowed member types include applications appears as an application permission under My APIs once it exists, so the role is created first and then added to SyncDaemon. Application permissions always require an administrator to grant consent; after consent, tokens issued to SyncDaemon carry the role in the `roles` claim.
    fr: |
      Un rôle d'application dont les types de membres autorisés incluent les applications apparaît comme autorisation d'application sous My APIs une fois créé : on crée donc d'abord le rôle, puis on l'ajoute à SyncDaemon. Les autorisations d'application exigent toujours le consentement d'un administrateur ; ensuite, les jetons émis pour SyncDaemon contiennent le rôle dans la revendication `roles`.
  options:
    scope:
      en: |
        A scope is a delegated permission used on behalf of a signed-in user and appears in the scp claim, not in roles.
      fr: |
        Une étendue est une autorisation déléguée utilisée au nom d'un utilisateur connecté et apparaît dans la revendication scp, pas dans roles.
    secret:
      en: |
        SyncDaemon already has a certificate credential, and Microsoft recommends certificates over client secrets.
      fr: |
        SyncDaemon possède déjà un certificat, et Microsoft recommande les certificats plutôt que les clés secrètes client.
    userassign:
      en: |
        Assigning the role to users gives it to signed-in users, not to the daemon calling as itself.
      fr: |
        Affecter le rôle à des utilisateurs le donne aux utilisateurs connectés, pas au service qui appelle en son propre nom.
references:
  - title: Add app roles to your application and receive them in the token
    url: https://learn.microsoft.com/en-us/entra/identity-platform/howto-add-app-roles-in-apps
