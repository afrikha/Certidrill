id: sc500-1b-kva-change-model-role
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a subscription named **Sub1** that contains a key vault named **kv-cts-legacy**. kv-cts-legacy uses the vault access policy permission model.

    An administrator named **Admin1** has the following role assignments at the kv-cts-legacy scope:

    - Key Vault Contributor
    - Key Vault Data Access Administrator

    Admin1 already assigned the required Key Vault data roles to every principal of kv-cts-legacy. When Admin1 tries to switch kv-cts-legacy to the Azure role-based access control (Azure RBAC) permission model, the operation fails.

    You need to ensure that Admin1 can switch the permission model. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un abonnement nommé **Sub1** qui contient un coffre de clés nommé **kv-cts-legacy**. kv-cts-legacy utilise le modèle d'autorisation par stratégie d'accès du coffre.

    Un administrateur nommé **Admin1** a les attributions de rôles suivantes dans l'étendue de kv-cts-legacy :

    - Key Vault Contributor
    - Key Vault Data Access Administrator

    Admin1 a déjà attribué les rôles de données Key Vault nécessaires à chaque principal de kv-cts-legacy. Quand Admin1 tente de faire passer kv-cts-legacy au modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC), l'opération échoue.

    Vous devez vous assurer qu'Admin1 peut changer le modèle d'autorisation. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Admin1 the Key Vault Administrator role at the kv-cts-legacy scope.", fr: "Attribuer à Admin1 le rôle Key Vault Administrator dans l'étendue de kv-cts-legacy." } }
    - { id: b, text: { en: "Assign Admin1 the User Access Administrator role at the kv-cts-legacy scope.", fr: "Attribuer à Admin1 le rôle User Access Administrator dans l'étendue de kv-cts-legacy." } }
    - { id: c, text: { en: "Assign Admin1 the Owner role at the Sub1 scope.", fr: "Attribuer à Admin1 le rôle Owner dans l'étendue de Sub1." } }
    - { id: d, text: { en: "Assign Admin1 the Security Admin role at the Sub1 scope.", fr: "Attribuer à Admin1 le rôle Security Admin dans l'étendue de Sub1." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Changing the permission model requires unrestricted Microsoft.Authorization/roleAssignments/write, which Owner and User Access Administrator include, plus Microsoft.KeyVault/vaults/write. Admin1 already has vaults/write through Key Vault Contributor, and Key Vault Data Access Administrator is a constrained role that can't change the permission model. User Access Administrator scoped to the vault adds only the missing permission.
    fr: |
      Changer le modèle d'autorisation exige Microsoft.Authorization/roleAssignments/write sans restriction, inclus dans Owner et User Access Administrator, plus Microsoft.KeyVault/vaults/write. Admin1 a déjà vaults/write grâce à Key Vault Contributor, et Key Vault Data Access Administrator est un rôle restreint qui ne peut pas changer le modèle d'autorisation. User Access Administrator limité au coffre ajoute seulement l'autorisation manquante.
  options:
    a:
      en: "Key Vault Administrator grants data plane operations only; it includes no role assignment permission."
      fr: "Key Vault Administrator accorde seulement des opérations du plan de données ; il ne contient aucune autorisation d'attribution de rôles."
    c:
      en: "Owner on the subscription would work, but it grants far more than needed on every resource of Sub1."
      fr: "Owner sur l'abonnement fonctionnerait, mais accorderait bien plus que nécessaire sur toutes les ressources de Sub1."
    d:
      en: "Security Admin manages Defender for Cloud security settings; it can't create role assignments."
      fr: "Security Admin gère les paramètres de sécurité de Defender for Cloud ; il ne peut pas créer d'attributions de rôles."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
