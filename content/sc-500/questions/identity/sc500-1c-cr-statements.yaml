id: sc500-1c-cr-statements
objective: "1.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to use custom roles. The security team creates the following roles:

    - **Role1**: an Azure custom role whose `Actions` contain `Microsoft.Compute/virtualMachines/*`, assigned on a resource group named **rg-vms**.
    - **Role2**: a Microsoft Entra custom role that lets helpdesk users manage the owners of app registrations.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit d'utiliser des rôles personnalisés. L'équipe de sécurité crée les rôles suivants :

    - **Role1** : un rôle personnalisé Azure dont les `Actions` contiennent `Microsoft.Compute/virtualMachines/*`, attribué sur un groupe de ressources nommé **rg-vms**.
    - **Role2** : un rôle personnalisé Microsoft Entra qui permet aux utilisateurs du support technique de gérer les propriétaires des inscriptions d'applications.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If Microsoft adds a new virtual machine operation to the Microsoft.Compute provider, users assigned Role1 receive it automatically.
        fr: Si Microsoft ajoute une nouvelle opération de machine virtuelle au fournisseur Microsoft.Compute, les utilisateurs disposant de Role1 la reçoivent automatiquement.
    - id: s2
      text:
        en: You can add the `Microsoft.Storage/storageAccounts/read` operation to Role2 so that helpdesk users also see storage accounts.
        fr: Vous pouvez ajouter l'opération `Microsoft.Storage/storageAccounts/read` à Role2 pour que les utilisateurs du support technique voient aussi les comptes de stockage.
    - id: s3
      text:
        en: Each helpdesk user assigned Role2 must have a Microsoft Entra ID P1 license (or a license that includes it).
        fr: Chaque utilisateur du support technique disposant de Role2 doit avoir une licence Microsoft Entra ID P1 (ou une licence qui l'inclut).
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A wildcard in `Actions` grants every matching operation, including operations added to the provider later, which is why Microsoft recommends listing operations explicitly. Microsoft Entra custom roles contain only Microsoft Entra permissions such as `microsoft.directory/applications/owners/update`; Azure Resource Manager operations belong in Azure roles. Using custom roles requires a Microsoft Entra ID P1 license for every user with a custom role assignment.
    fr: |
      Un caractère générique dans `Actions` accorde toutes les opérations correspondantes, y compris celles ajoutées plus tard au fournisseur, d'où la recommandation de Microsoft de lister les opérations explicitement. Les rôles personnalisés Microsoft Entra ne contiennent que des autorisations Microsoft Entra comme `microsoft.directory/applications/owners/update` ; les opérations Azure Resource Manager relèvent des rôles Azure. L'utilisation de rôles personnalisés exige une licence Microsoft Entra ID P1 pour chaque utilisateur disposant d'une attribution de rôle personnalisé.
references:
  - title: Azure custom roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  - title: Overview of role-based access control in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-overview
