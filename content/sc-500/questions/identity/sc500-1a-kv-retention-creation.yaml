id: sc500-1a-kv-retention-creation
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank created a key vault named **kv-wg-pay** last month with the default soft-delete settings and purge protection enabled. The vault stores 40 secrets.

    A new compliance rule requires that deleted secrets of the payment application be permanently removed automatically no later than 30 days after deletion, while still being recoverable during those 30 days. Purge protection must remain enabled.

    What should you do?
  fr: |
    Woodgrove Bank a créé le mois dernier un coffre de clés nommé **kv-wg-pay** avec les paramètres de suppression réversible par défaut et la protection contre le vidage activée. Le coffre stocke 40 secrets.

    Une nouvelle règle de conformité exige que les secrets supprimés de l'application de paiement soient définitivement supprimés automatiquement au plus tard 30 jours après leur suppression, tout en restant récupérables pendant ces 30 jours. La protection contre le vidage doit rester activée.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the soft-delete retention period of kv-wg-pay to 30 days.", fr: "Modifier la période de rétention de la suppression réversible de kv-wg-pay pour la passer à 30 jours." }
    - id: b
      text: { en: "Schedule a runbook that purges deleted secrets of kv-wg-pay 30 days after deletion.", fr: "Planifier un runbook qui vide les secrets supprimés de kv-wg-pay 30 jours après leur suppression." }
    - id: c
      text: { en: "Create a new key vault with a 30-day retention period and purge protection, and move the secrets to it.", fr: "Créer un coffre de clés avec une période de rétention de 30 jours et la protection contre le vidage, puis y déplacer les secrets." }
    - id: d
      text: { en: "Set an expiration date of 30 days on each secret of kv-wg-pay.", fr: "Définir une date d'expiration de 30 jours sur chaque secret de kv-wg-pay." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The soft-delete retention period (7 to 90 days, 90 by default) can only be set when the vault is created and cannot be changed afterward. A new vault created with a 30-day retention keeps deleted secrets recoverable for 30 days and then purges them automatically, even with purge protection on.
    fr: |
      La période de rétention de la suppression réversible (7 à 90 jours, 90 par défaut) ne peut être définie qu'à la création du coffre et ne peut plus être modifiée ensuite. Un nouveau coffre créé avec une rétention de 30 jours garde les secrets supprimés récupérables pendant 30 jours, puis les vide automatiquement, même avec la protection contre le vidage.
  options:
    a:
      en: |
        The retention interval of an existing vault cannot be changed after creation.
      fr: |
        L'intervalle de rétention d'un coffre existant ne peut pas être modifié après sa création.
    b:
      en: |
        With purge protection enabled, nobody can purge deleted objects before the 90-day retention period of kv-wg-pay ends.
      fr: |
        Avec la protection contre le vidage, personne ne peut vider des objets supprimés avant la fin de la période de rétention de 90 jours de kv-wg-pay.
    d:
      en: |
        An expiration date limits when an active secret can be used; it does not change how long a deleted secret is retained.
      fr: |
        Une date d'expiration limite la période d'utilisation d'un secret actif ; elle ne change pas la durée de conservation d'un secret supprimé.
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
