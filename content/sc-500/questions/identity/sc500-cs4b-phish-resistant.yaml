id: sc500-cs4b-phish-resistant
objective: "1.1.3"
type: dropdown
caseStudy: sc500-cs4b-blue-yonder-airlines
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the identity requirements for the operations engineers.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter les exigences d'identité concernant les ingénieurs d'exploitation.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the Authentication methods policy, enable Passkey (FIDO2) and [[onboard]] for GRP-OpsEng.

      Create a Conditional Access policy that targets GRP-OpsEng and the Azure portal, with the grant control [[grant]].
    fr: |
      Dans la stratégie des méthodes d'authentification, activer Passkey (FIDO2) et [[onboard]] pour GRP-OpsEng.

      Créer une stratégie d'accès conditionnel qui cible GRP-OpsEng et le portail Azure, avec le contrôle d'octroi [[grant]].
  slots:
    - id: onboard
      options:
        - { id: tap, text: Temporary Access Pass }
        - { id: sms, text: SMS }
        - { id: email, text: Email OTP }
        - { id: authapp, text: Microsoft Authenticator }
    - id: grant
      options:
        - { id: mfa, text: Require multifactor authentication }
        - { id: pwless, text: "Require authentication strength: Passwordless MFA" }
        - { id: phish, text: "Require authentication strength: Phishing-resistant MFA" }
        - { id: compliant, text: Require device to be marked as compliant }
answer:
  values: { onboard: tap, grant: phish }
explanation:
  correct:
    en: |
      A Temporary Access Pass is a time-limited passcode that lets a new user sign in without a password and register passwordless methods such as a FIDO2 security key. The built-in Phishing-resistant MFA authentication strength accepts only FIDO2 security keys, Windows Hello for Business or platform credentials, and multifactor certificate-based authentication, so the engineers can no longer use the password and push notifications.
    fr: |
      Un Temporary Access Pass est un code secret à durée limitée qui permet à un nouvel utilisateur de se connecter sans mot de passe et d'inscrire des méthodes sans mot de passe comme une clé de sécurité FIDO2. La force d'authentification intégrée Phishing-resistant MFA n'accepte que les clés de sécurité FIDO2, Windows Hello Entreprise ou les informations d'identification de plateforme, et l'authentification multifacteur par certificat : les ingénieurs ne peuvent plus utiliser le mot de passe et les notifications Push.
  options:
    mfa:
      en: |
        Require multifactor authentication is satisfied by a password and a push notification, which is not phishing resistant.
      fr: |
        Require multifactor authentication est satisfait par un mot de passe et une notification Push, ce qui ne résiste pas au hameçonnage.
    pwless:
      en: |
        The Passwordless MFA strength also accepts Microsoft Authenticator phone sign-in, which is not phishing resistant.
      fr: |
        La force Passwordless MFA accepte aussi la connexion par téléphone avec Microsoft Authenticator, qui ne résiste pas au hameçonnage.
references:
  - title: Overview of Conditional Access authentication strengths
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-strengths
  - title: Configure Temporary Access Pass to register passwordless authentication methods
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-temporary-access-pass
