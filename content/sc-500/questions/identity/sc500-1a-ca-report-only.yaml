id: sc500-1a-ca-report-only
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses. You create a Conditional Access policy that requires multifactor authentication for all users when they access all resources.

    Before you enforce the policy, you need to measure its impact on the real sign-ins of all users for two weeks. Users must not be prompted or blocked by the policy during this period.

    What should you do?
  fr: |
    Northwind Traders dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1. Vous créez une stratégie d'accès conditionnel qui exige l'authentification multifacteur pour tous les utilisateurs lorsqu'ils accèdent à toutes les ressources.

    Avant d'appliquer la stratégie, vous devez mesurer son impact sur les connexions réelles de tous les utilisateurs pendant deux semaines. Les utilisateurs ne doivent être ni invités à s'authentifier ni bloqués par la stratégie pendant cette période.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set Enable policy to Report-only and review the Report-only tab of the sign-in logs.", fr: "Régler Enable policy sur Report-only et consulter l'onglet Rapport uniquement des journaux de connexion." }
    - id: b
      text: { en: "Set Enable policy to On for a pilot group and review the Conditional Access tab of the sign-in logs.", fr: "Régler Enable policy sur On pour un groupe pilote et consulter l'onglet Accès conditionnel des journaux de connexion." }
    - id: c
      text: { en: "Set Enable policy to Off and run the What If tool for a sample of users each day.", fr: "Régler Enable policy sur Off et exécuter l'outil What If pour un échantillon d'utilisateurs chaque jour." }
    - id: d
      text: { en: "Turn on security defaults and review the multifactor authentication registration report.", fr: "Activer les paramètres de sécurité par défaut et consulter le rapport d'inscription à l'authentification multifacteur." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In report-only mode, the policy is evaluated at every sign-in but its grant and session controls are not enforced, so users are neither prompted nor blocked. The result of each evaluation (Success, Failure, User action required, Not applied) is logged in the Report-only tab of the sign-in log details.
    fr: |
      En mode rapport uniquement, la stratégie est évaluée à chaque connexion mais ses contrôles d'octroi et de session ne sont pas appliqués : les utilisateurs ne sont ni sollicités ni bloqués. Le résultat de chaque évaluation (Success, Failure, User action required, Not applied) est consigné dans l'onglet Rapport uniquement des détails du journal de connexion.
  options:
    b:
      en: |
        Turning the policy on enforces MFA for the pilot users, and it only measures the impact on that group, not on all users.
      fr: |
        Activer la stratégie impose la MFA aux utilisateurs pilotes, et elle ne mesure l'impact que sur ce groupe, pas sur tous les utilisateurs.
    c:
      en: |
        What If simulates one sign-in for chosen conditions; it does not evaluate the real traffic of all users over time.
      fr: |
        What If simule une connexion pour des conditions choisies ; il n'évalue pas le trafic réel de tous les utilisateurs dans la durée.
    d:
      en: |
        Security defaults enforce MFA registration and MFA prompts for users, which the requirement forbids, and they do not report the impact of your policy.
      fr: |
        Les paramètres de sécurité par défaut imposent l'inscription et des invites MFA aux utilisateurs, ce que l'exigence interdit, et ils ne mesurent pas l'impact de votre stratégie.
references:
  - title: Analyze Conditional Access Policy Impact
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-report-only
