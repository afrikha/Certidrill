id: sc500-1c-rc-weekly-export
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure subscription named **Sub-Payments** that has the **ISO/IEC 27001** standard assigned in Microsoft Defender for Cloud. Auditors want to query the history of the regulatory compliance state of Sub-Payments in a Log Analytics workspace named **law-audit**.

    You need to store a snapshot of the regulatory compliance data in law-audit every week. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Woodgrove Bank dispose d'un abonnement Azure nommé **Sub-Payments** auquel la norme **ISO/IEC 27001** est attribuée dans Microsoft Defender for Cloud. Les auditeurs souhaitent interroger l'historique de l'état de conformité réglementaire de Sub-Payments dans un espace de travail Log Analytics nommé **law-audit**.

    Vous devez stocker chaque semaine un instantané des données de conformité réglementaire dans law-audit. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A workflow automation that runs a logic app when a compliance assessment changes state", fr: "Une automatisation de workflow qui exécute une application logique quand une évaluation de conformité change d'état" }
    - id: b
      text: { en: "A diagnostic setting on Sub-Payments that sends the activity log to law-audit", fr: "Un paramètre de diagnostic sur Sub-Payments qui envoie le journal d'activité vers law-audit" }
    - id: c
      text: { en: "A weekly task that selects Download report on the dashboard and uploads the file", fr: "Une tâche hebdomadaire qui sélectionne Download report dans le tableau de bord et charge le fichier" }
    - id: d
      text: { en: "Continuous export of weekly snapshots of regulatory compliance data to law-audit", fr: "L'exportation continue des instantanés hebdomadaires des données de conformité réglementaire vers law-audit" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Continuous export in Defender for Cloud can send regulatory compliance data to a Log Analytics workspace or an event hub, either as a continuous stream or as weekly snapshots. Choosing weekly snapshots to law-audit gives the auditors a queryable history with no manual work.
    fr: |
      L'exportation continue de Defender for Cloud peut envoyer les données de conformité réglementaire vers un espace de travail Log Analytics ou un hub d'événements, sous forme de flux continu ou d'instantanés hebdomadaires. Choisir les instantanés hebdomadaires vers law-audit fournit aux auditeurs un historique interrogeable sans travail manuel.
  options:
    a:
      en: Workflow automation reacts to state changes, for example by sending an email; it does not store periodic snapshots without custom logic.
      fr: L'automatisation de workflow réagit aux changements d'état, par exemple en envoyant un e-mail ; elle ne stocke pas d'instantanés périodiques sans logique personnalisée.
    b:
      en: The activity log records control plane operations on the subscription, not the compliance state of the standard's controls.
      fr: Le journal d'activité enregistre les opérations du plan de contrôle sur l'abonnement, pas l'état de conformité des contrôles de la norme.
    c:
      en: Download report produces a one-time PDF or CSV report; repeating it by hand every week is not minimal effort and does not land in the workspace.
      fr: Download report produit un rapport ponctuel PDF ou CSV ; le refaire à la main chaque semaine ne réduit pas l'effort et ne l'envoie pas dans l'espace de travail.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
