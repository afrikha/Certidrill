id: sc500-1c-rbac-security-roles-map
objective: "1.3.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has an Azure subscription named **Sub-Core** that uses Microsoft Defender for Cloud and Azure Policy.

    You need to grant the permissions listed in the answer area on Sub-Core. Each team must receive only the permissions it needs.

    Which built-in Azure role should you assign to each team? To answer, drag the appropriate roles to the correct teams. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un abonnement Azure nommé **Sub-Core** qui utilise Microsoft Defender for Cloud et Azure Policy.

    Vous devez accorder sur Sub-Core les autorisations présentées dans la zone de réponse. Chaque équipe ne doit recevoir que les autorisations dont elle a besoin.

    Quel rôle Azure intégré devez-vous attribuer à chaque équipe ? Pour répondre, faites glisser les rôles appropriés vers les équipes correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sreader, text: Security Reader }
    - { id: sadmin, text: Security Admin }
    - { id: rpc, text: Resource Policy Contributor }
    - { id: mio, text: Managed Identity Operator }
    - { id: contrib, text: Contributor }
    - { id: uaa, text: User Access Administrator }
  targets:
    - { id: t1, text: { en: "Auditors: view recommendations, alerts and the secure score without changing anything", fr: "Auditeurs : consulter les recommandations, les alertes et le score de sécurité sans rien modifier" } }
    - { id: t2, text: { en: "SOC analysts: dismiss security alerts and edit security policies in Defender for Cloud", fr: "Analystes SOC : ignorer des alertes de sécurité et modifier les stratégies de sécurité dans Defender for Cloud" } }
    - { id: t3, text: { en: "Governance team: create custom policy definitions and assign them", fr: "Équipe gouvernance : créer des définitions de stratégie personnalisées et les attribuer" } }
    - { id: t4, text: { en: "Deployment team: attach existing user-assigned managed identities to virtual machines it already manages", fr: "Équipe de déploiement : associer des identités managées affectées par l'utilisateur existantes aux machines virtuelles qu'elle gère déjà" } }
answer:
  mapping: { t1: sreader, t2: sadmin, t3: rpc, t4: mio }
explanation:
  correct:
    en: |
      Security Reader views Defender for Cloud data without making changes. Security Admin can also update security policies and dismiss alerts. Resource Policy Contributor creates and manages policy definitions and assignments. Managed Identity Operator can read and assign user-assigned identities, which is the permission needed in addition to the team's existing rights on the virtual machines.
    fr: |
      Security Reader consulte les données de Defender for Cloud sans rien modifier. Security Admin peut en plus mettre à jour les stratégies de sécurité et ignorer les alertes. Resource Policy Contributor crée et gère les définitions et attributions de stratégie. Managed Identity Operator peut lire et affecter des identités affectées par l'utilisateur, l'autorisation nécessaire en plus des droits existants de l'équipe sur les machines virtuelles.
  options:
    contrib:
      en: Contributor manages all resources, far more than any of these teams needs.
      fr: Contributor gère toutes les ressources, bien plus que ce dont chacune de ces équipes a besoin.
    uaa:
      en: User Access Administrator manages role assignments; none of the teams needs to grant access.
      fr: User Access Administrator gère les attributions de rôles ; aucune équipe n'a besoin d'accorder des accès.
references:
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
  - title: User roles and permissions
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions
