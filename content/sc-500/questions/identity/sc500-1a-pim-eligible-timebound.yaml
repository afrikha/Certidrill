id: sc500-1a-pim-eligible-timebound
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Entra tenant with Microsoft Entra ID P2 licenses. Three helpdesk leads must be able to use the **User Administrator** role for the next six months.

    You have the following requirements:

    - The leads must perform an action, such as providing a justification, before they can use the role.
    - Their ability to use the role must end automatically after six months.

    What should you do in Privileged Identity Management (PIM)?
  fr: |
    Contoso, Ltd. dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P2. Trois responsables du support doivent pouvoir utiliser le rôle **User Administrator** pendant les six prochains mois.

    Vous avez les exigences suivantes :

    - les responsables doivent effectuer une action, par exemple fournir une justification, avant de pouvoir utiliser le rôle ;
    - leur possibilité d'utiliser le rôle doit prendre fin automatiquement après six mois.

    Que devez-vous faire dans Privileged Identity Management (PIM) ?
body:
  options:
    - id: a
      text: { en: "Add an active assignment of the User Administrator role that expires after six months.", fr: "Ajouter une attribution active du rôle User Administrator qui expire au bout de six mois." }
    - id: b
      text: { en: "Add an eligible assignment of the User Administrator role that expires after six months.", fr: "Ajouter une attribution éligible du rôle User Administrator qui expire au bout de six mois." }
    - id: c
      text: { en: "Add a permanent eligible assignment and an access review of the role that recurs every six months.", fr: "Ajouter une attribution éligible permanente et une révision d'accès du rôle qui se répète tous les six mois." }
    - id: d
      text: { en: "Add a permanent active assignment and require justification on active assignment.", fr: "Ajouter une attribution active permanente et exiger une justification lors de l'attribution active." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An eligible assignment requires the user to activate the role (MFA, justification or approval) before using it. A time-bound eligible assignment has an end date, so the eligibility disappears automatically after six months without any manual cleanup.
    fr: |
      Une attribution éligible oblige l'utilisateur à activer le rôle (MFA, justification ou approbation) avant de l'utiliser. Une attribution éligible limitée dans le temps a une date de fin : l'éligibilité disparaît automatiquement après six mois, sans nettoyage manuel.
  options:
    a:
      en: |
        An active assignment lets the leads use the role immediately, without any activation step, so the first requirement is not met.
      fr: |
        Une attribution active permet d'utiliser le rôle immédiatement, sans étape d'activation : la première exigence n'est pas respectée.
    c:
      en: |
        An access review asks reviewers to confirm or remove access; it does not end the assignment automatically at a fixed date, and the eligibility stays permanent until a reviewer acts.
      fr: |
        Une révision d'accès demande à des réviseurs de confirmer ou de retirer l'accès ; elle ne met pas fin à l'attribution à une date fixe, et l'éligibilité reste permanente tant qu'aucun réviseur n'agit.
    d:
      en: |
        Justification on active assignment is asked of the administrator who creates the assignment, not of the user; a permanent active assignment never requires activation and never ends.
      fr: |
        La justification lors de l'attribution active est demandée à l'administrateur qui crée l'attribution, pas à l'utilisateur ; une attribution active permanente n'exige jamais d'activation et ne prend jamais fin.
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
