id: sc500-1c-lock-statements
objective: "1.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an Azure subscription that contains the following resources:

    | Resource | Type | Lock |
    | --- | --- | --- |
    | rg-app | Resource group | **AppLock** (CanNotDelete) |
    | rg-jobs | Resource group | **JobsLock** (ReadOnly) |
    | st-app | Storage account in rg-app | None |
    | vm-batch | Virtual machine in rg-jobs | None |

    A user named **Admin1** has the **Owner** role on the subscription. A user named **Dev1** has the **Storage Blob Data Contributor** role on st-app.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'un abonnement Azure qui contient les ressources suivantes :

    | Ressource | Type | Verrou |
    | --- | --- | --- |
    | rg-app | Groupe de ressources | **AppLock** (CanNotDelete) |
    | rg-jobs | Groupe de ressources | **JobsLock** (ReadOnly) |
    | st-app | Compte de stockage dans rg-app | Aucun |
    | vm-batch | Machine virtuelle dans rg-jobs | Aucun |

    Un utilisateur nommé **Admin1** dispose du rôle **Owner** sur l'abonnement. Un utilisateur nommé **Dev1** dispose du rôle **Storage Blob Data Contributor** sur st-app.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Dev1 can delete blobs in st-app.
        fr: Dev1 peut supprimer des objets blob dans st-app.
    - id: s2
      text:
        en: Admin1 can restart vm-batch while JobsLock is in place.
        fr: Admin1 peut redémarrer vm-batch tant que JobsLock est en place.
    - id: s3
      text:
        en: Admin1 can delete st-app after removing AppLock.
        fr: Admin1 peut supprimer st-app après avoir supprimé AppLock.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Locks apply only to control plane operations, so the CanNotDelete lock inherited by st-app doesn't stop Dev1 from deleting blobs through the data plane. A ReadOnly lock on a resource group that contains a virtual machine prevents every user, Owner included, from starting or restarting it. Owners have `Microsoft.Authorization/locks/*`, so Admin1 can remove AppLock, after which nothing prevents deleting st-app.
    fr: |
      Les verrous ne s'appliquent qu'aux opérations du plan de contrôle : le verrou CanNotDelete hérité par st-app n'empêche pas Dev1 de supprimer des objets blob par le plan de données. Un verrou ReadOnly sur un groupe de ressources qui contient une machine virtuelle empêche tout utilisateur, Owner compris, de la démarrer ou de la redémarrer. Les Owner disposent de `Microsoft.Authorization/locks/*` : Admin1 peut supprimer AppLock, après quoi rien n'empêche de supprimer st-app.
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
