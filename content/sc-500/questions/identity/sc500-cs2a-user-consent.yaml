id: sc500-cs2a-user-consent
objective: "1.1.5"
type: multi
caseStudy: sc500-cs2a-nod-publishers
difficulty: 3
status: draft
stem:
  en: |
    You need to configure Microsoft Entra ID to meet the consent requirement.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer Microsoft Entra ID pour respecter l'exigence relative au consentement.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Classify openid, profile, email, offline_access and User.Read as low-impact permissions", fr: "Classifier openid, profile, email, offline_access et User.Read comme autorisations à faible impact" } }
    - { id: b, text: { en: "Set user consent to Allow user consent for apps from verified publishers, for selected permissions", fr: "Définir le consentement de l'utilisateur sur Allow user consent for apps from verified publishers, for selected permissions" } }
    - { id: c, text: { en: "Enable the admin consent workflow and add the security team as reviewers", fr: "Activer le workflow de consentement administrateur et ajouter l'équipe de sécurité comme réviseurs" } }
    - { id: d, text: { en: "Keep user consent set to Allow user consent for apps and enable the admin consent workflow", fr: "Conserver le consentement de l'utilisateur sur Allow user consent for apps et activer le workflow de consentement administrateur" } }
    - { id: e, text: { en: "Assign the Cloud Application Administrator role to the security team and to all users", fr: "Attribuer le rôle Cloud Application Administrator à l'équipe de sécurité et à tous les utilisateurs" } }
    - { id: f, text: { en: "Grant tenant-wide admin consent to every app that a user tries to use", fr: "Accorder le consentement administrateur à l'échelle du locataire à chaque application qu'un utilisateur tente d'utiliser" } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      The built-in policy for apps from verified publishers, for selected permissions, lets users consent only to apps from verified publishers or registered in the tenant, and only for the permissions you classify as low impact, so you must classify the five permissions. The admin consent workflow lets users request a review when they can't consent themselves, and the designated reviewers approve or deny each request. Changing the setting affects only future consent operations.
    fr: |
      La stratégie intégrée pour les applications d'éditeurs vérifiés et les autorisations sélectionnées ne permet aux utilisateurs de donner leur consentement qu'aux applications d'éditeurs vérifiés ou inscrites dans le locataire, et uniquement pour les autorisations que vous classifiez comme à faible impact : vous devez donc classifier les cinq autorisations. Le workflow de consentement administrateur permet aux utilisateurs de demander une révision quand ils ne peuvent pas consentir eux-mêmes, et les réviseurs désignés approuvent ou refusent chaque demande. La modification du paramètre ne s'applique qu'aux futures opérations de consentement.
  options:
    d: { en: "Allow user consent for apps lets users consent to any permission that doesn't require admin consent, for any app, so most requests never reach the security team.", fr: "Allow user consent for apps permet aux utilisateurs de consentir à toute autorisation qui ne nécessite pas le consentement administrateur, pour n'importe quelle application : la plupart des demandes n'atteignent jamais l'équipe de sécurité." }
    e: { en: "Giving every user an administrative role lets them grant consent beyond the allowed permissions and breaks least privilege.", fr: "Donner un rôle d'administration à chaque utilisateur lui permet d'accorder des consentements au-delà des autorisations autorisées et ne respecte pas le privilège minimum." }
    f: { en: "Granting admin consent to every app removes the review by the security team instead of enforcing it.", fr: "Accorder le consentement administrateur à chaque application supprime la révision par l'équipe de sécurité au lieu de l'imposer." }
references:
  - title: Configure how users consent to applications
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-user-consent
