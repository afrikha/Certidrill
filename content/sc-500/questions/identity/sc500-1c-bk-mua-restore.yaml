id: sc500-1c-bk-mua-restore
objective: "1.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Recovery Services vault named **rsv-games** that is associated with a Resource Guard named **rg-guard** in a subscription managed by the security team. rg-guard uses its default protected operations. The backup administrators have the **Backup Contributor** role on rsv-games and the **Reader** role on rg-guard.

    An audit shows that a backup administrator restored a virtual machine disk from rsv-games without any approval from the security team. Modifying a backup policy correctly required approval.

    You need to ensure that restores from rsv-games also require the security team's approval. The solution must not change the roles of the backup administrators.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un coffre Recovery Services nommé **rsv-games** associé à un Resource Guard nommé **rg-guard** dans un abonnement géré par l'équipe de sécurité. rg-guard utilise ses opérations protégées par défaut. Les administrateurs de sauvegarde disposent du rôle **Backup Contributor** sur rsv-games et du rôle **Reader** sur rg-guard.

    Un audit montre qu'un administrateur de sauvegarde a restauré un disque de machine virtuelle depuis rsv-games sans aucune approbation de l'équipe de sécurité. La modification d'une stratégie de sauvegarde a bien exigé une approbation.

    Vous devez faire en sorte que les restaurations depuis rsv-games exigent aussi l'approbation de l'équipe de sécurité. La solution ne doit pas modifier les rôles des administrateurs de sauvegarde.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable immutability on rsv-games and lock it.", fr: "Activer l'immuabilité sur rsv-games et la verrouiller." }
    - id: b
      text: { en: "In the protected operations of rg-guard, select the **Restore** operation.", fr: "Dans les opérations protégées de rg-guard, sélectionner l'opération **Restore**." }
    - id: c
      text: { en: "Move rg-guard to a different Microsoft Entra tenant.", fr: "Déplacer rg-guard vers un autre locataire Microsoft Entra." }
    - id: d
      text: { en: "Increase the soft delete retention period of rsv-games to 180 days.", fr: "Augmenter à 180 jours la période de rétention de la suppression réversible de rsv-games." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Disabling soft delete or security features and removing MUA protection are mandatory protected operations; the others are optional. Most optional operations, such as modifying a policy, are protected by default, but **Restore** is not. Selecting Restore in the Resource Guard's protected operations makes restores require the Backup MUA Operator role that the security team grants temporarily.
    fr: |
      La désactivation de la suppression réversible ou des fonctionnalités de sécurité et le retrait de la protection MUA sont des opérations protégées obligatoires ; les autres sont facultatives. La plupart des opérations facultatives, comme la modification d'une stratégie, sont protégées par défaut, mais **Restore** ne l'est pas. Sélectionner Restore dans les opérations protégées du Resource Guard fait exiger pour les restaurations le rôle Backup MUA Operator que l'équipe de sécurité accorde temporairement.
  options:
    a:
      en: Immutability blocks operations that could lose backups, such as early deletion; it does not gate restores.
      fr: L'immuabilité bloque les opérations susceptibles de faire perdre des sauvegardes, comme la suppression anticipée ; elle ne contrôle pas les restaurations.
    c:
      en: Placing the guard in another tenant improves isolation, but Restore would still not be a protected operation.
      fr: Placer le Resource Guard dans un autre locataire améliore l'isolation, mais Restore ne serait toujours pas une opération protégée.
    d:
      en: Soft delete retention decides how long deleted data stays recoverable; it has no effect on who can restore.
      fr: La rétention de la suppression réversible fixe la durée de récupération des données supprimées ; elle n'a aucun effet sur qui peut restaurer.
references:
  - title: Multiuser authorization using Resource Guard
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
