id: sc500-1c-bk-features-map
objective: "1.3.8"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank protects its Azure virtual machines with a Recovery Services vault named **rsv-core**. The security team lists the requirements shown in the answer area.

    Which Azure Backup feature should you configure for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank protège ses machines virtuelles Azure avec un coffre Recovery Services nommé **rsv-core**. L'équipe de sécurité énumère les exigences présentées dans la zone de réponse.

    Quelle fonctionnalité de Sauvegarde Azure devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: soft, text: { en: "Soft delete retention period", fr: "Période de rétention de la suppression réversible" } }
    - { id: locked, text: { en: "Immutable vault, enabled and locked", fr: "Coffre immuable, activé et verrouillé" } }
    - { id: mua, text: { en: "Multi-user authorization with a Resource Guard", fr: "Autorisation multi-utilisateur avec un Resource Guard" } }
    - { id: cmk, text: { en: "Encryption with customer-managed keys", fr: "Chiffrement avec des clés gérées par le client" } }
    - { id: crr, text: { en: "Cross Region Restore", fr: "Cross Region Restore" } }
    - { id: lock, text: { en: "CanNotDelete lock on the vault", fr: "Verrou CanNotDelete sur le coffre" } }
  targets:
    - { id: t1, text: { en: "Backup data deleted by mistake stays recoverable for 45 days", fr: "Les données de sauvegarde supprimées par erreur restent récupérables pendant 45 jours" } }
    - { id: t2, text: { en: "Nobody, ever, can reduce retention or delete recovery points before they expire, and the setting can't be turned off", fr: "Personne, jamais, ne peut réduire la rétention ni supprimer des points de récupération avant leur expiration, et le paramètre ne peut pas être désactivé" } }
    - { id: t3, text: { en: "Modifying the vault's encryption settings requires approval from a security team that doesn't manage the vault", fr: "La modification des paramètres de chiffrement du coffre exige l'approbation d'une équipe de sécurité qui ne gère pas le coffre" } }
    - { id: t4, text: { en: "Backup data is encrypted with keys that the bank controls in Azure Key Vault", fr: "Les données de sauvegarde sont chiffrées avec des clés que la banque contrôle dans Azure Key Vault" } }
answer:
  mapping: { t1: soft, t2: locked, t3: mua, t4: cmk }
explanation:
  correct:
    en: |
      Soft delete keeps deleted backup data for a configurable period of 14 to 180 days. A locked immutable vault blocks retention reductions and early deletion of recovery points, and locking is irreversible. Multi-user authorization makes critical operations, including modifying encryption settings, depend on a Resource Guard controlled by another team. Customer-managed keys stored in Key Vault encrypt the backup data in a Recovery Services vault.
    fr: |
      La suppression réversible conserve les données de sauvegarde supprimées pendant une période configurable de 14 à 180 jours. Un coffre immuable verrouillé bloque la réduction de la rétention et la suppression anticipée des points de récupération, et le verrouillage est irréversible. L'autorisation multi-utilisateur fait dépendre les opérations critiques, dont la modification des paramètres de chiffrement, d'un Resource Guard contrôlé par une autre équipe. Les clés gérées par le client stockées dans Key Vault chiffrent les données de sauvegarde d'un coffre Recovery Services.
  options:
    crr:
      en: Cross Region Restore allows restoring in the paired region; it protects against a regional outage, not against deletion or tampering.
      fr: Cross Region Restore permet de restaurer dans la région jumelée ; il protège contre une panne régionale, pas contre la suppression ou la falsification.
    lock:
      en: A resource lock only protects the vault resource on the control plane and can be removed by an Owner; it does not protect recovery points or retention settings.
      fr: Un verrou de ressource ne protège que la ressource coffre sur le plan de contrôle et peut être supprimé par un Owner ; il ne protège ni les points de récupération ni les paramètres de rétention.
references:
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
  - title: Multiuser authorization using Resource Guard
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
