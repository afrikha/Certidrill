id: sc500-1a-consent-statements
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation allows users to consent to apps from verified publishers for low-impact permissions. An enterprise application named **PayrollView** has **Assignment required** set to **Yes**. Several users have already consented on their own behalf to a third-party app named **NotesSync**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation permet aux utilisateurs de consentir aux applications d'éditeurs vérifiés pour des autorisations à faible impact. Une application d'entreprise nommée **PayrollView** a **Assignment required** réglé sur **Yes**. Plusieurs utilisateurs ont déjà consenti en leur propre nom à une application tierce nommée **NotesSync**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Users cannot consent to PayrollView, even for low-impact permissions from a verified publisher; an administrator must grant consent.
        fr: |
          Les utilisateurs ne peuvent pas consentir à PayrollView, même pour des autorisations à faible impact d'un éditeur vérifié ; un administrateur doit accorder le consentement.
    - id: s2
      text:
        en: |
          If you grant tenant-wide admin consent to NotesSync, the permissions that users already granted on their own behalf are revoked.
        fr: |
          Si vous accordez le consentement administrateur à l'échelle du locataire à NotesSync, les autorisations que les utilisateurs ont déjà accordées en leur propre nom sont révoquées.
    - id: s3
      text:
        en: |
          You can revoke the permissions that users granted to NotesSync from the User consent tab of the Permissions page in the Microsoft Entra admin center.
        fr: |
          Vous pouvez révoquer les autorisations accordées par les utilisateurs à NotesSync depuis l'onglet User consent de la page Permissions du Centre d'administration Microsoft Entra.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      When an application requires assignment, user consent for it isn't allowed even if the consent settings would allow it, so an administrator must grant tenant-wide consent. Tenant-wide admin consent can revoke earlier tenant-wide grants, but permissions users granted on their own behalf are not affected. The User consent tab only lists those grants: they are revoked with Microsoft Graph API calls or PowerShell, not in the portal.
    fr: |
      Lorsqu'une application exige l'affectation, le consentement des utilisateurs n'est pas autorisé même si les paramètres de consentement le permettraient : un administrateur doit accorder le consentement à l'échelle du locataire. Le consentement administrateur peut révoquer des octrois antérieurs à l'échelle du locataire, mais les autorisations que les utilisateurs ont accordées en leur propre nom ne sont pas affectées. L'onglet User consent ne fait que lister ces octrois : on les révoque avec l'API Microsoft Graph ou PowerShell, pas dans le portail.
references:
  - title: Manage access to an application
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-access-management
  - title: Review permissions granted to enterprise applications
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/manage-application-permissions
