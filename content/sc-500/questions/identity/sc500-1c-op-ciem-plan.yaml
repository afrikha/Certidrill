id: sc500-1c-op-ciem-plan
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Defender for Cloud on 10 Azure subscriptions and on an AWS account connected through a connector. Only foundational CSPM and Defender for Servers Plan 2 are enabled.

    The security team wants Defender for Cloud to generate the recommendations **Permissions of inactive identities in your Azure subscription should be revoked** and **Azure overprovisioned identities should have only the necessary permissions**, and the equivalent recommendations for AWS.

    What should you do?
  fr: |
    Northwind Traders utilise Microsoft Defender for Cloud sur 10 abonnements Azure et sur un compte AWS connecté par un connecteur. Seuls la CSPM fondamentale et Defender for Servers Plan 2 sont activés.

    L'équipe de sécurité veut que Defender for Cloud génère les recommandations **Permissions of inactive identities in your Azure subscription should be revoked** et **Azure overprovisioned identities should have only the necessary permissions**, ainsi que les recommandations équivalentes pour AWS.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the Microsoft cloud security benchmark at the root management group.", fr: "Attribuer le Microsoft cloud security benchmark au groupe d'administration racine." }
    - id: b
      text: { en: "Enable the agentless scanning for machines component of Defender for Servers Plan 2.", fr: "Activer le composant d'analyse sans agent des machines de Defender for Servers Plan 2." }
    - id: c
      text: { en: "Enable the Defender CSPM plan, and then turn on **Permissions Management (CIEM)** in its settings.", fr: "Activer le plan Defender CSPM, puis activer **Permissions Management (CIEM)** dans ses paramètres." }
    - id: d
      text: { en: "Create an access review of the Owner and Contributor role assignments.", fr: "Créer une révision d'accès des attributions des rôles Owner et Contributor." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Cloud infrastructure entitlement management (CIEM) is part of the Defender CSPM plan. It analyzes the permissions and activity of users, groups and service principals in Azure, AWS and GCP, and produces the inactive and overprovisioned identity recommendations.
    fr: |
      La gestion des droits d'utilisation de l'infrastructure cloud (CIEM) fait partie du plan Defender CSPM. Elle analyse les autorisations et l'activité des utilisateurs, groupes et principaux de service dans Azure, AWS et GCP, et produit les recommandations sur les identités inactives et surprovisionnées.
  options:
    a:
      en: The benchmark is already assigned by default; without Defender CSPM, the CIEM recommendations are not generated.
      fr: Le benchmark est déjà attribué par défaut ; sans Defender CSPM, les recommandations CIEM ne sont pas générées.
    b:
      en: Agentless scanning inspects machine disks for vulnerabilities and secrets; it does not analyze identity permissions.
      fr: L'analyse sans agent inspecte les disques des machines à la recherche de vulnérabilités et de secrets ; elle n'analyse pas les autorisations des identités.
    d:
      en: An access review asks reviewers to confirm assignments; it does not create Defender for Cloud recommendations and does not cover AWS.
      fr: Une révision d'accès demande à des réviseurs de confirmer des attributions ; elle ne crée pas de recommandations Defender for Cloud et ne couvre pas AWS.
references:
  - title: Enable cloud infrastructure entitlement management (CIEM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-permissions-management
  - title: Identity and access security recommendations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/recommendations-reference-identity-access
