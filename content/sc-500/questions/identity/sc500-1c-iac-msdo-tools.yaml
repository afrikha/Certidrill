id: sc500-1c-iac-msdo-tools
objective: "1.3.9"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. stores its Azure infrastructure as **Bicep** files in an Azure DevOps repository. The pipeline runs the **Microsoft Security DevOps** task, and the results are sent to Microsoft Defender for Cloud DevOps security.

    You need to ensure that the pipeline reports security misconfigurations in the Bicep files, such as storage accounts that allow public blob access.

    Which two tools included in Microsoft Security DevOps analyze Bicep files? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. stocke son infrastructure Azure sous forme de fichiers **Bicep** dans un dépôt Azure DevOps. Le pipeline exécute la tâche **Microsoft Security DevOps**, et les résultats sont envoyés à la sécurité DevOps de Microsoft Defender for Cloud.

    Vous devez faire en sorte que le pipeline signale les erreurs de configuration de sécurité des fichiers Bicep, comme des comptes de stockage qui autorisent l'accès public aux objets blob.

    Quels sont les deux outils inclus dans Microsoft Security DevOps qui analysent les fichiers Bicep ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Terrascan }
    - { id: b, text: Template Analyzer }
    - { id: c, text: BinSkim }
    - { id: d, text: Checkov }
    - { id: e, text: ESLint }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Template Analyzer scans ARM templates and Bicep files for security and best-practice issues. Checkov scans many IaC formats, including Bicep, ARM templates and Terraform. Both run in the Microsoft Security DevOps task, and their findings appear in Defender for Cloud.
    fr: |
      Template Analyzer analyse les modèles ARM et les fichiers Bicep à la recherche de problèmes de sécurité et de bonnes pratiques. Checkov analyse de nombreux formats IaC, dont Bicep, les modèles ARM et Terraform. Les deux s'exécutent dans la tâche Microsoft Security DevOps, et leurs résultats apparaissent dans Defender for Cloud.
  options:
    a:
      en: Terrascan scans Terraform, Kubernetes, Helm, Kustomize, Dockerfiles and CloudFormation, but not Bicep files.
      fr: Terrascan analyse Terraform, Kubernetes, Helm, Kustomize, les Dockerfiles et CloudFormation, mais pas les fichiers Bicep.
    c:
      en: BinSkim analyzes compiled binaries (Windows and ELF), not templates.
      fr: BinSkim analyse des binaires compilés (Windows et ELF), pas des modèles.
    e:
      en: ESLint analyzes JavaScript code.
      fr: ESLint analyse du code JavaScript.
references:
  - title: Configure the Microsoft Security DevOps Azure DevOps extension
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/azure-devops-extension
