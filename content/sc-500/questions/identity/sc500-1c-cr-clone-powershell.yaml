id: sc500-1c-cr-clone-powershell
objective: "1.3.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has an Azure subscription that contains a resource group named **rg-app**. Operators currently have the **Virtual Machine Contributor** role on rg-app. The security team wants a new role named **VM Operator (custom)** that only allows reading, starting, restarting and deallocating virtual machines, assigned to the group **App-Operators** on rg-app.

    You have the Owner role on the subscription. You decide to use the built-in role as a starting point and Azure PowerShell.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation dispose d'un abonnement Azure qui contient un groupe de ressources nommé **rg-app**. Les opérateurs disposent actuellement du rôle **Virtual Machine Contributor** sur rg-app. L'équipe de sécurité veut un nouveau rôle nommé **VM Operator (custom)** qui permet uniquement de lire, démarrer, redémarrer et libérer les machines virtuelles, attribué au groupe **App-Operators** sur rg-app.

    Vous disposez du rôle Owner sur l'abonnement. Vous décidez de partir du rôle intégré et d'utiliser Azure PowerShell.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: export, text: { en: "Run `Get-AzRoleDefinition -Name \"Virtual Machine Contributor\" | ConvertTo-Json | Out-File vmop.json`.", fr: "Exécuter `Get-AzRoleDefinition -Name \"Virtual Machine Contributor\" | ConvertTo-Json | Out-File vmop.json`." } }
    - { id: edit, text: { en: "Edit vmop.json: set Id to null, set a new name, set IsCustom to true, keep only the required actions, and set AssignableScopes.", fr: "Modifier vmop.json : mettre Id à null, définir un nouveau nom, mettre IsCustom à true, ne garder que les actions nécessaires et définir AssignableScopes." } }
    - { id: create, text: { en: "Run `New-AzRoleDefinition -InputFile vmop.json`.", fr: "Exécuter `New-AzRoleDefinition -InputFile vmop.json`." } }
    - { id: assign, text: { en: "Run `New-AzRoleAssignment` for App-Operators with the VM Operator (custom) role at the scope of rg-app.", fr: "Exécuter `New-AzRoleAssignment` pour App-Operators avec le rôle VM Operator (custom) à l'étendue de rg-app." } }
    - { id: set, text: { en: "Run `Set-AzRoleDefinition -InputFile vmop.json`.", fr: "Exécuter `Set-AzRoleDefinition -InputFile vmop.json`." } }
    - { id: entra, text: { en: "In the Microsoft Entra admin center, create a custom role from **Roles and administrators**.", fr: "Dans le centre d'administration Microsoft Entra, créer un rôle personnalisé depuis **Roles and administrators**." } }
answer:
  sequence: [ export, edit, create, assign ]
explanation:
  correct:
    en: |
      You export the built-in role to a JSON file, edit it into a custom definition (`Id` set to null so that a new ID is generated, new name, `IsCustom` true, the needed actions, the assignable scopes), create the role with `New-AzRoleDefinition`, and only then assign it, because a role must exist before it can be assigned.
    fr: |
      Vous exportez le rôle intégré dans un fichier JSON, le transformez en définition personnalisée (`Id` à null pour qu'un nouvel ID soit généré, nouveau nom, `IsCustom` à true, actions nécessaires, étendues attribuables), créez le rôle avec `New-AzRoleDefinition`, puis seulement l'attribuez, car un rôle doit exister avant de pouvoir être attribué.
  options:
    set:
      en: Set-AzRoleDefinition saves changes to an existing custom role; it does not create a new one, and built-in roles can't be modified.
      fr: Set-AzRoleDefinition met à jour un rôle personnalisé existant ; il n'en crée pas de nouveau, et les rôles intégrés ne peuvent pas être modifiés.
    entra:
      en: Microsoft Entra custom roles contain Microsoft Entra permissions; virtual machine operations require an Azure custom role.
      fr: Les rôles personnalisés Microsoft Entra contiennent des autorisations Microsoft Entra ; les opérations sur les machines virtuelles exigent un rôle personnalisé Azure.
references:
  - title: Create or update Azure custom roles using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles-powershell
