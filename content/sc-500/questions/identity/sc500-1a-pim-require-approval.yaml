id: sc500-1a-pim-require-approval
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Privileged Identity Management (PIM) for Microsoft Entra roles. Five administrators have eligible assignments of the **Exchange Administrator** role.

    Two security leads, Lead1 and Lead2, must approve every activation of the Exchange Administrator role before it takes effect. Activations of other roles must not be affected.

    What should you do?
  fr: |
    Fabrikam, Inc. utilise Privileged Identity Management (PIM) pour les rôles Microsoft Entra. Cinq administrateurs ont des attributions éligibles du rôle **Exchange Administrator**.

    Deux responsables sécurité, Lead1 et Lead2, doivent approuver chaque activation du rôle Exchange Administrator avant qu'elle ne prenne effet. Les activations des autres rôles ne doivent pas être affectées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create an access review of the Exchange Administrator role with Lead1 and Lead2 as reviewers.", fr: "Créer une révision d'accès du rôle Exchange Administrator avec Lead1 et Lead2 comme réviseurs." }
    - id: b
      text: { en: "Assign the Privileged Role Administrator role to Lead1 and Lead2 so that they become the default approvers.", fr: "Attribuer le rôle Privileged Role Administrator à Lead1 et Lead2 pour qu'ils deviennent les approbateurs par défaut." }
    - id: c
      text: { en: "Edit the Exchange Administrator role settings, turn on Require approval to activate and select Lead1 and Lead2.", fr: "Modifier les paramètres du rôle Exchange Administrator, activer Require approval to activate et sélectionner Lead1 et Lead2." }
    - id: d
      text: { en: "Turn on the admin consent workflow and designate Lead1 and Lead2 as reviewers.", fr: "Activer le workflow de consentement administrateur et désigner Lead1 et Lead2 comme réviseurs." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Approval is a role setting in PIM, defined per role and shared by all assignments of that role. Turning on Require approval to activate for Exchange Administrator and selecting Lead1 and Lead2 as approvers puts every activation of that role in a pending state until one of them approves it, without changing other roles.
    fr: |
      L'approbation est un paramètre de rôle dans PIM, défini par rôle et partagé par toutes les attributions de ce rôle. Activer Require approval to activate pour Exchange Administrator et choisir Lead1 et Lead2 comme approbateurs met chaque activation de ce rôle en attente jusqu'à ce que l'un d'eux l'approuve, sans modifier les autres rôles.
  options:
    a:
      en: |
        An access review periodically confirms who should keep an assignment; it does not gate each activation.
      fr: |
        Une révision d'accès confirme périodiquement qui doit conserver une attribution ; elle ne contrôle pas chaque activation.
    b:
      en: |
        Privileged Role Administrators and Global Administrators only act as default approvers when approval is turned on without named approvers; approval still has to be turned on, and this role grants far more than needed.
      fr: |
        Les Privileged Role Administrator et Global Administrator ne sont approbateurs par défaut que si l'approbation est activée sans approbateur désigné ; il faut toujours activer l'approbation, et ce rôle accorde bien plus que nécessaire.
    d:
      en: |
        The admin consent workflow handles requests to consent to applications, not role activations.
      fr: |
        Le workflow de consentement administrateur traite les demandes de consentement à des applications, pas les activations de rôles.
references:
  - title: Configure Microsoft Entra role settings in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings
