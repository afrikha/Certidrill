id: sc500-1c-rbac-delegate-condition
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a resource group named **rg-backup** that contains Recovery Services vaults. The backup team lead, **Lead1**, currently asks the security team to grant access to new backup operators.

    You need to allow Lead1 to assign and remove only the **Backup Operator** and **Backup Reader** roles on rg-backup, and only to users. Lead1 must not be able to grant any other role, to assign roles to groups or service principals, or to manage the vaults.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un groupe de ressources nommé **rg-backup** qui contient des coffres Recovery Services. La responsable de l'équipe sauvegarde, **Lead1**, demande actuellement à l'équipe sécurité d'accorder l'accès aux nouveaux opérateurs de sauvegarde.

    Vous devez permettre à Lead1 d'attribuer et de retirer uniquement les rôles **Backup Operator** et **Backup Reader** sur rg-backup, et uniquement à des utilisateurs. Lead1 ne doit pas pouvoir accorder d'autre rôle, attribuer des rôles à des groupes ou à des principaux de service, ni gérer les coffres.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign Lead1 the Backup Contributor role on rg-backup.", fr: "Attribuer à Lead1 le rôle Backup Contributor sur rg-backup." }
    - id: b
      text: { en: "Assign Lead1 the User Access Administrator role on rg-backup, without a condition.", fr: "Attribuer à Lead1 le rôle User Access Administrator sur rg-backup, sans condition." }
    - id: c
      text: { en: "Assign Lead1 the Role Based Access Control Administrator role on rg-backup, with a condition on roles and principal types.", fr: "Attribuer à Lead1 le rôle Role Based Access Control Administrator sur rg-backup, avec une condition sur les rôles et les types de principaux." }
    - id: d
      text: { en: "Assign Lead1 the Owner role on rg-backup, and apply a CanNotDelete lock to the vaults.", fr: "Attribuer à Lead1 le rôle Owner sur rg-backup, et appliquer un verrou CanNotDelete aux coffres." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Role Based Access Control Administrator only manages role assignments, without managing resources. A condition on the assignment can restrict which roles Lead1 can assign or remove (Backup Operator, Backup Reader) and which principal types can receive them (users), which is the recommended way to delegate role assignment management.
    fr: |
      Role Based Access Control Administrator gère uniquement les attributions de rôles, sans gérer les ressources. Une condition sur l'attribution peut restreindre les rôles que Lead1 peut attribuer ou retirer (Backup Operator, Backup Reader) et les types de principaux qui peuvent les recevoir (utilisateurs) : c'est la méthode recommandée pour déléguer la gestion des attributions de rôles.
  options:
    a:
      en: Backup Contributor manages backups in the vaults but cannot create role assignments.
      fr: Backup Contributor gère les sauvegardes des coffres mais ne peut pas créer d'attributions de rôles.
    b:
      en: Without a condition, User Access Administrator lets Lead1 assign any role, including Owner, to any principal on rg-backup.
      fr: Sans condition, User Access Administrator permet à Lead1 d'attribuer n'importe quel rôle, y compris Owner, à n'importe quel principal sur rg-backup.
    d:
      en: Owner grants full control of the vaults and of access; a lock only prevents deletion and does not limit role assignments.
      fr: Owner accorde le contrôle total des coffres et des accès ; un verrou empêche seulement la suppression et ne limite pas les attributions de rôles.
references:
  - title: Delegate Azure access management to others
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/delegate-role-assignments-overview
