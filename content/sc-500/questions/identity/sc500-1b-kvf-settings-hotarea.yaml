id: sc500-1b-kvf-settings-hotarea
objective: "1.2.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a key vault named **kv-wg-vm**. The **Networking** page of kv-wg-vm shows the settings in the following table.

    Two problems are reported:

    - Azure Backup fails to back up the keys and secrets of an encrypted virtual machine named **VM5**.
    - A build server named **Build1**, which connects from the public IP address 192.0.2.10, can't list the secrets of kv-wg-vm.

    You need to fix each problem by changing one setting. No other network may gain access to kv-wg-vm.

    Which setting should you change for each problem? To answer, select the appropriate setting in the answer area for each prompt.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un coffre de clés nommé **kv-wg-vm**. La page **Networking** de kv-wg-vm affiche les paramètres du tableau suivant.

    Deux problèmes sont signalés :

    - Sauvegarde Azure n'arrive pas à sauvegarder les clés et les secrets d'une machine virtuelle chiffrée nommée **VM5**.
    - Un serveur de build nommé **Build1**, qui se connecte depuis l'adresse IP publique 192.0.2.10, ne peut pas lister les secrets de kv-wg-vm.

    Vous devez résoudre chaque problème en modifiant un seul paramètre. Aucun autre réseau ne doit obtenir l'accès à kv-wg-vm.

    Quel paramètre devez-vous modifier pour chaque problème ? Pour répondre, sélectionnez le paramètre approprié dans la zone de réponse pour chaque consigne.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: { en: "Azure Backup can't back up VM5", fr: "Sauvegarde Azure ne peut pas sauvegarder VM5" } }
    - { id: p2, text: { en: "Build1 can't list the secrets", fr: "Build1 ne peut pas lister les secrets" } }
  grid:
    caption: { en: "kv-wg-vm > Networking > Firewalls and virtual networks", fr: "kv-wg-vm > Networking > Firewalls and virtual networks" }
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Current value", fr: "Valeur actuelle" }]
    rows:
      - [{ text: Allow access from }, { text: Allow public access from specific virtual networks and IP addresses, area: access }]
      - [{ text: Virtual networks }, { text: vnet-core / snet-app (Microsoft.KeyVault service endpoint enabled), area: vnet }]
      - [{ text: Firewall (IPv4 address or CIDR) }, { text: 203.0.113.0/24, area: ip }]
      - [{ text: Allow trusted Microsoft services to bypass this firewall }, { text: { en: "Not selected", fr: "Non sélectionné" }, area: trusted }]
      - [{ text: Private endpoint connections }, { text: { en: "None", fr: "Aucune" }, area: pe }]
answer:
  values: { p1: trusted, p2: ip }
explanation:
  correct:
    en: |
      Azure Backup is a trusted Microsoft service for backing up the keys and secrets of Azure VMs, so selecting the trusted services exception lets it bypass the firewall without opening the vault to anyone else. Build1 connects from a public address that isn't in the IP rules; adding 192.0.2.10 to the firewall admits that address only. Changing Allow access from to all networks would also fix both problems but would expose the vault to every network.
    fr: |
      Sauvegarde Azure est un service Microsoft approuvé pour sauvegarder les clés et les secrets des VM Azure : sélectionner l'exception des services approuvés lui permet de contourner le pare-feu sans ouvrir le coffre à quiconque. Build1 se connecte depuis une adresse publique absente des règles IP ; ajouter 192.0.2.10 au pare-feu admet cette seule adresse. Passer Allow access from à tous les réseaux résoudrait aussi les deux problèmes, mais exposerait le coffre à tous les réseaux.
references:
  - title: Virtual network service endpoints for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview-vnet-service-endpoints
  - title: Configure network security for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/network-security
