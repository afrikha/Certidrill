id: sc500-1a-kv-deploy-options-map
objective: "1.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is planning four key management deployments.

    Which option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys planifie quatre déploiements de gestion de clés.

    Quelle option devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: standard, text: { en: "Key Vault Standard tier", fr: "Key Vault, niveau Standard" } }
    - { id: premium, text: { en: "Key Vault Premium tier", fr: "Key Vault, niveau Premium" } }
    - { id: mhsm, text: Azure Key Vault Managed HSM }
    - { id: purge, text: { en: "Purge protection", fr: "Protection contre le vidage" } }
    - { id: rbac, text: { en: "Azure role-based access control permission model", fr: "Modèle d'autorisation contrôle d'accès en fonction du rôle Azure" } }
    - { id: policies, text: { en: "Vault access policy permission model", fr: "Modèle d'autorisation stratégie d'accès du coffre" } }
  targets:
    - id: t1
      text: { en: "A dedicated, single-tenant HSM cluster whose HSM administrators keep control that subscription administrators cannot override", fr: "Un cluster HSM dédié et monolocataire dont les administrateurs HSM gardent un contrôle que les administrateurs d'abonnement ne peuvent pas contourner" }
    - id: t2
      text: { en: "HSM-protected RSA keys in a multitenant vault", fr: "Des clés RSA protégées par HSM dans un coffre multilocataire" }
    - id: t3
      text: { en: "No one can permanently delete a deleted vault or secret before the retention period ends", fr: "Personne ne peut supprimer définitivement un coffre ou un secret supprimé avant la fin de la période de rétention" }
    - id: t4
      text: { en: "Data-plane permissions granted through role assignments that can be made eligible in Privileged Identity Management", fr: "Des autorisations de plan de données accordées par des attributions de rôles pouvant être rendues éligibles dans Privileged Identity Management" }
answer:
  mapping: { t1: mhsm, t2: premium, t3: purge, t4: rbac }
explanation:
  correct:
    en: |
      Managed HSM is single-tenant, and its local RBAC model gives HSM cluster administrators control that management group, subscription or resource group administrators cannot override. The Premium tier of Key Vault adds HSM-protected keys (RSA-HSM, EC-HSM) to the multitenant vault service. Purge protection blocks purging until the retention period passes. The Azure RBAC model uses Azure role assignments, which PIM can make eligible.
    fr: |
      Managed HSM est monolocataire, et son modèle RBAC local donne aux administrateurs du cluster HSM un contrôle que les administrateurs de groupe d'administration, d'abonnement ou de groupe de ressources ne peuvent pas contourner. Le niveau Premium de Key Vault ajoute les clés protégées par HSM (RSA-HSM, EC-HSM) au service de coffres multilocataire. La protection contre le vidage bloque le vidage jusqu'à la fin de la période de rétention. Le modèle Azure RBAC utilise des attributions de rôles Azure, que PIM peut rendre éligibles.
  options:
    standard:
      en: |
        The Standard tier encrypts with software modules and offers no HSM-protected keys.
      fr: |
        Le niveau Standard chiffre avec des modules logiciels et n'offre pas de clés protégées par HSM.
    policies:
      en: |
        Access policies are a Key Vault-specific model outside Azure role assignments, so PIM cannot make them eligible.
      fr: |
        Les stratégies d'accès sont un modèle propre à Key Vault, en dehors des attributions de rôles Azure : PIM ne peut pas les rendre éligibles.
references:
  - title: About Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
  - title: What is Azure Key Vault Managed HSM?
    url: https://learn.microsoft.com/en-us/azure/key-vault/managed-hsm/overview
