id: sc500-cs1a-pim-scada
objective: "1.1.1"
type: dropdown
caseStudy: sc500-cs1a-wingtip-energy
difficulty: 1
status: draft
stem:
  en: |
    You need to configure Privileged Identity Management (PIM) to meet the access requirement for RG-SCADA. You have already set the activation maximum duration of the Contributor role on RG-SCADA to four hours.

    How should you complete the configuration? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer Privileged Identity Management (PIM) pour satisfaire l'exigence d'accès à RG-SCADA. Vous avez déjà défini à quatre heures la durée maximale d'activation du rôle Contributor sur RG-SCADA.

    Comment devez-vous compléter la configuration ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Assignment of the Contributor role on RG-SCADA to OT-Engineers: [[type]]

      Role setting for the approval: [[approval]]

      Role setting for the change ticket: [[ticket]]
    fr: |
      Attribution du rôle Contributor sur RG-SCADA à OT-Engineers : [[type]]

      Paramètre de rôle pour l'approbation : [[approval]]

      Paramètre de rôle pour le ticket de changement : [[ticket]]
  slots:
    - id: type
      options:
        - { id: eligible, text: { en: "Eligible assignment", fr: "Attribution éligible" } }
        - { id: active, text: { en: "Active assignment that expires after four hours", fr: "Attribution active qui expire au bout de quatre heures" } }
        - { id: permanent, text: { en: "Permanent active assignment", fr: "Attribution active permanente" } }
    - id: approval
      options:
        - { id: approvers, text: { en: "Require approval to activate, with OT-SecLeads selected as approvers", fr: "Exiger une approbation pour l'activation, avec OT-SecLeads sélectionné comme approbateurs" } }
        - { id: noapprover, text: { en: "Require approval to activate, with no approver selected", fr: "Exiger une approbation pour l'activation, sans approbateur sélectionné" } }
        - { id: mfa, text: { en: "Require multifactor authentication on active assignment", fr: "Exiger l'authentification multifacteur lors de l'attribution active" } }
    - id: ticket
      options:
        - { id: ticketinfo, text: { en: "Require ticket information on activation", fr: "Exiger les informations de ticket lors de l'activation" } }
        - { id: justif, text: { en: "Require justification on activation", fr: "Exiger une justification lors de l'activation" } }
        - { id: justifactive, text: { en: "Require justification on active assignment", fr: "Exiger une justification lors de l'attribution active" } }
answer:
  values: { type: eligible, approval: approvers, ticket: ticketinfo }
explanation:
  correct:
    en: |-
      An eligible assignment gives no standing access; the engineers activate the role when needed, for at most the activation maximum duration. Require approval to activate needs at least one approver, because PIM has no default approvers, so OT-SecLeads must be selected. Require ticket information on activation makes the engineers enter a ticket number when they activate the role.
    fr: |-
      Une attribution éligible ne donne aucun accès permanent : les ingénieurs activent le rôle quand ils en ont besoin, pour au plus la durée maximale d'activation. L'approbation pour l'activation exige au moins un approbateur, car PIM n'a pas d'approbateur par défaut : OT-SecLeads doit donc être sélectionné. L'exigence des informations de ticket lors de l'activation oblige les ingénieurs à saisir un numéro de ticket quand ils activent le rôle.
  options:
    active:
      en: |-
        An active assignment grants the role immediately and requires no activation, so no approval or ticket is asked for.
      fr: |-
        Une attribution active accorde le rôle immédiatement, sans activation : aucune approbation ni aucun ticket n'est demandé.
    noapprover:
      en: |-
        There are no default approvers in PIM; at least one approver must be selected.
      fr: |-
        PIM n'a pas d'approbateur par défaut ; au moins un approbateur doit être sélectionné.
    justifactive:
      en: |-
        Settings on active assignment apply when an administrator creates an active assignment, not when an eligible user activates the role.
      fr: |-
        Les paramètres d'attribution active s'appliquent quand un administrateur crée une attribution active, pas quand un utilisateur éligible active le rôle.
references:
  - title: Configure Azure resource role settings in Privileged Identity Management
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-configure-role-settings
