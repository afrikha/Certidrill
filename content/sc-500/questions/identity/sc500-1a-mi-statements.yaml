id: sc500-1a-mi-statements
objective: "1.1.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has a virtual machine named **VM2** with two user-assigned managed identities, **id-read** and **id-write**. A Microsoft Entra security group named **SG-Data** has the Storage Blob Data Contributor role on a storage account, and id-write is a member of SG-Data. An administrator named Admin1 has the Virtual Machine Contributor role on VM2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'une machine virtuelle nommée **VM2** avec deux identités managées affectées par l'utilisateur, **id-read** et **id-write**. Un groupe de sécurité Microsoft Entra nommé **SG-Data** a le rôle Storage Blob Data Contributor sur un compte de stockage, et id-write est membre de SG-Data. Un administrateur nommé Admin1 a le rôle Virtual Machine Contributor sur VM2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After you remove id-write from SG-Data, the change can take several hours to take effect for id-write.
        fr: |
          Après le retrait de id-write de SG-Data, la modification peut mettre plusieurs heures à prendre effet pour id-write.
    - id: s2
      text:
        en: |
          When code on VM2 requests a token from the Instance Metadata Service, it must specify which identity to use, for example with the client_id parameter.
        fr: |
          Lorsque le code de VM2 demande un jeton au service Instance Metadata Service, il doit préciser l'identité à utiliser, par exemple avec le paramètre client_id.
    - id: s3
      text:
        en: |
          With only the Virtual Machine Contributor role, Admin1 can attach a third existing user-assigned managed identity to VM2.
        fr: |
          Avec le seul rôle Virtual Machine Contributor, Admin1 peut associer une troisième identité managée affectée par l'utilisateur existante à VM2.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The managed identity back end caches tokens per resource URI for around 24 hours, so group or role membership changes can take several hours to take effect, and the refresh cannot be forced. When a VM has several user-assigned identities, the token request must include client_id, object_id or msi_res_id. Assigning a user-assigned identity to a VM requires both Virtual Machine Contributor and Managed Identity Operator.
    fr: |
      Le back-end des identités managées met les jetons en cache par URI de ressource pendant environ 24 heures : un changement d'appartenance à un groupe ou à un rôle peut mettre plusieurs heures à s'appliquer, et l'actualisation ne peut pas être forcée. Lorsqu'une machine virtuelle a plusieurs identités affectées par l'utilisateur, la demande de jeton doit inclure client_id, object_id ou msi_res_id. Affecter une identité affectée par l'utilisateur à une machine virtuelle exige à la fois Virtual Machine Contributor et Managed Identity Operator.
references:
  - title: Managed identity best practice recommendations
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/managed-identity-best-practice-recommendations
  - title: Configure managed identities on Azure virtual machines (VMs)
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-configure-managed-identities
