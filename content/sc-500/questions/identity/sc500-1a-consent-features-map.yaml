id: sc500-1a-consent-features-map
objective: "1.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. is reviewing how applications obtain permissions in its Microsoft Entra tenant.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. examine la façon dont les applications obtiennent des autorisations dans son locataire Microsoft Entra.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: usercons, text: { en: "User consent settings", fr: "Paramètres de consentement de l'utilisateur" } }
    - { id: workflow, text: { en: "Admin consent workflow", fr: "Workflow de consentement administrateur" } }
    - { id: classif, text: { en: "Permission classifications", fr: "Classifications des autorisations" } }
    - { id: grant, text: { en: "Grant admin consent on the app's Permissions page", fr: "Accorder le consentement administrateur dans la page Permissions de l'application" } }
    - { id: assign, text: { en: "Assignment required on the enterprise app", fr: "Assignment required sur l'application d'entreprise" } }
    - { id: ca, text: { en: "Conditional Access policy", fr: "Stratégie d'accès conditionnel" } }
  targets:
    - id: t1
      text: { en: "Let users ask for approval of an app that they are not allowed to consent to.", fr: "Permettre aux utilisateurs de demander l'approbation d'une application à laquelle ils ne sont pas autorisés à consentir." }
    - id: t2
      text: { en: "Mark the delegated permissions openid, profile, email and offline_access as low impact.", fr: "Marquer les autorisations déléguées openid, profile, email et offline_access comme à faible impact." }
    - id: t3
      text: { en: "Prevent all users from consenting to any application.", fr: "Empêcher tous les utilisateurs de consentir à quelque application que ce soit." }
    - id: t4
      text: { en: "Consent once, on behalf of all users, for an application that is already in the tenant.", fr: "Consentir une seule fois, au nom de tous les utilisateurs, pour une application déjà présente dans le locataire." }
answer:
  mapping: { t1: workflow, t2: classif, t3: usercons, t4: grant }
explanation:
  correct:
    en: |
      The admin consent workflow lets users request admin consent for apps they can't consent to. Permission classifications mark delegated permissions that don't require admin consent as Low, for use in consent policies. User consent settings can disable user consent for the whole tenant. Grant admin consent, on the app's Permissions page, consents tenant-wide for all users.
    fr: |
      Le workflow de consentement administrateur permet aux utilisateurs de demander le consentement administrateur pour les applications auxquelles ils ne peuvent pas consentir. Les classifications des autorisations marquent comme Low des autorisations déléguées qui ne nécessitent pas le consentement administrateur, pour les stratégies de consentement. Les paramètres de consentement de l'utilisateur peuvent désactiver le consentement des utilisateurs pour tout le locataire. Grant admin consent, dans la page Permissions de l'application, consent à l'échelle du locataire pour tous les utilisateurs.
  options:
    assign:
      en: |
        Assignment required controls who can sign in to one app; it does not apply to all applications.
      fr: |
        Assignment required contrôle qui peut se connecter à une application ; il ne s'applique pas à toutes les applications.
    ca:
      en: |
        Conditional Access controls access at sign-in; it does not grant or classify permissions.
      fr: |
        L'accès conditionnel contrôle l'accès à la connexion ; il n'accorde ni ne classe des autorisations.
references:
  - title: Configure the admin consent workflow
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-admin-consent-workflow
  - title: Configure permission classifications
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-permission-classifications
