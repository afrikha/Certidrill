id: sc500-1b-dkv-enable
objective: "1.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has a subscription named **Sub1** that contains 12 key vaults. Microsoft Defender for Cloud is enabled on Sub1 with the Defender CSPM plan only.

    The security team must be alerted when any key vault in Sub1 is accessed from a TOR exit node or from an IP address that Microsoft threat intelligence identifies as suspicious. The solution must not require custom detection rules.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un abonnement nommé **Sub1** qui contient 12 coffres de clés. Microsoft Defender for Cloud est activé sur Sub1 avec uniquement le plan Defender CSPM.

    L'équipe sécurité doit être alertée quand un coffre de clés de Sub1 est accédé depuis un nœud de sortie TOR ou depuis une adresse IP que le renseignement sur les menaces de Microsoft considère comme suspecte. La solution ne doit pas exiger de règles de détection personnalisées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on the Key Vault plan in the Defender plans of Sub1.", fr: "Activer le plan Key Vault dans les plans Defender de Sub1." } }
    - { id: b, text: { en: "Turn on Agentless scanning for machines in the Defender CSPM plan of Sub1.", fr: "Activer Agentless scanning for machines dans le plan Defender CSPM de Sub1." } }
    - { id: c, text: { en: "Create a diagnostic setting on each key vault that sends AuditEvent logs to a Log Analytics workspace.", fr: "Créer sur chaque coffre de clés un paramètre de diagnostic qui envoie les journaux AuditEvent vers un espace de travail Log Analytics." } }
    - { id: d, text: { en: "Assign the built-in policy Azure Key Vault should have firewall enabled or public network access disabled to Sub1.", fr: "Attribuer à Sub1 la stratégie intégrée Azure Key Vault should have firewall enabled or public network access disabled." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft Defender for Key Vault detects unusual and potentially harmful attempts to access or exploit key vaults and raises alerts such as Access from a TOR exit node to a key vault and Access from a suspicious IP address to a key vault. You enable it in Defender for Cloud > Environment settings > the subscription > Defender plans, where it covers the vaults of the subscription.
    fr: |
      Microsoft Defender for Key Vault détecte les tentatives inhabituelles et potentiellement dangereuses d'accès aux coffres de clés ou d'exploitation de ceux-ci, et déclenche des alertes comme Access from a TOR exit node to a key vault et Access from a suspicious IP address to a key vault. Vous l'activez dans Defender for Cloud > Environment settings > l'abonnement > Defender plans, où il couvre les coffres de l'abonnement.
  options:
    b:
      en: "Agentless scanning for machines finds secrets on VM disks; it doesn't monitor access to key vaults."
      fr: "L'analyse sans agent des machines trouve des secrets sur les disques des VM ; elle ne surveille pas l'accès aux coffres de clés."
    c:
      en: "Resource logs record the operations, but alerting on them would require custom rules and threat intelligence of your own."
      fr: "Les journaux de ressources enregistrent les opérations, mais générer des alertes à partir d'eux exigerait des règles personnalisées et votre propre renseignement sur les menaces."
    d:
      en: "This policy reports or blocks vaults that are open to all networks; it raises no alert on suspicious access."
      fr: "Cette stratégie signale ou bloque les coffres ouverts à tous les réseaux ; elle ne déclenche aucune alerte sur un accès suspect."
references:
  - title: Overview of Microsoft Defender for Key Vault
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-key-vault-introduction
  - title: Protect your key vaults with Defender for Key Vault
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-key-vault-plan
