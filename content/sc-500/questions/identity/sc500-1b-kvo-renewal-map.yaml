id: sc500-1b-kvo-renewal-map
objective: "1.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys stores the following objects in a key vault named **kv-wt-prod**:

    - **cmk-sql**: an RSA key used for transparent data encryption of an Azure SQL database
    - **cert-api**: a TLS certificate issued by DigiCert, an integrated certificate authority
    - **sql-admin-pwd**: a secret that holds the password of a SQL login

    Each object must be renewed or replaced automatically before it expires.

    Which mechanism should you use for each object? To answer, drag the appropriate mechanisms to the correct objects. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys stocke les objets suivants dans un coffre de clés nommé **kv-wt-prod** :

    - **cmk-sql** : une clé RSA utilisée pour le chiffrement transparent des données d'une base de données Azure SQL
    - **cert-api** : un certificat TLS émis par DigiCert, une autorité de certification intégrée
    - **sql-admin-pwd** : un secret qui contient le mot de passe d'une connexion SQL

    Chaque objet doit être renouvelé ou remplacé automatiquement avant son expiration.

    Quel mécanisme devez-vous utiliser pour chaque objet ? Pour répondre, faites glisser les mécanismes appropriés vers les objets correspondants. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rotpol, text: { en: "A key rotation policy with a Rotate action", fr: "Une stratégie de rotation de clé avec une action Rotate" } }
    - { id: autorenew, text: { en: "A lifetime action of type AutoRenew in the certificate policy", fr: "Une action de durée de vie de type AutoRenew dans la stratégie de certificat" } }
    - { id: eventgrid, text: { en: "An Event Grid subscription to the near-expiry event that runs a function", fr: "Un abonnement Event Grid à l'événement d'expiration proche qui exécute une fonction" } }
    - { id: policy, text: { en: "An Azure Policy assignment with the Audit effect", fr: "Une attribution Azure Policy avec l'effet Audit" } }
    - { id: defender, text: { en: "The Microsoft Defender for Key Vault plan", fr: "Le plan Microsoft Defender for Key Vault" } }
  targets:
    - { id: key, text: cmk-sql }
    - { id: cert, text: cert-api }
    - { id: secret, text: sql-admin-pwd }
answer:
  mapping: { key: rotpol, cert: autorenew, secret: eventgrid }
explanation:
  correct:
    en: |
      A key rotation policy creates new key versions on a schedule, and services that use the versionless key URI pick them up. A certificate from an integrated CA is renewed by Key Vault itself when its AutoRenew lifetime action triggers. Secrets have no built-in rotation: a near-expiry Event Grid event can run a function that changes the password in SQL and stores the new version in the vault.
    fr: |
      Une stratégie de rotation de clé crée de nouvelles versions de la clé selon un calendrier, et les services qui utilisent l'URI de clé sans version les prennent en compte. Un certificat d'une autorité intégrée est renouvelé par Key Vault lui-même quand son action de durée de vie AutoRenew se déclenche. Les secrets n'ont pas de rotation intégrée : un événement Event Grid d'expiration proche peut exécuter une fonction qui change le mot de passe dans SQL et stocke la nouvelle version dans le coffre.
  options:
    policy:
      en: "An Audit assignment only reports non-compliant objects; it renews nothing."
      fr: "Une attribution Audit signale seulement les objets non conformes ; elle ne renouvelle rien."
    defender:
      en: "Defender for Key Vault detects suspicious access; it doesn't manage object life cycles."
      fr: "Defender for Key Vault détecte les accès suspects ; il ne gère pas le cycle de vie des objets."
references:
  - title: Configure cryptographic key auto-rotation in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation
  - title: Renew your Azure Key Vault certificates
    url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/overview-renew-certificate
