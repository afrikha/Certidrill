id: sc500-1a-am-auth-strengths
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. creates three Conditional Access policies that use the **Require authentication strength** grant control. The policies must meet the following requirements:

    - **Admins**: only FIDO2 security keys, Windows Hello for Business or multifactor certificate-based authentication are accepted.
    - **Staff**: no password-based sign-in is accepted, but Microsoft Authenticator phone sign-in must be allowed.
    - **Contractors**: any multifactor combination, including a password plus a text message, is accepted.

    Each policy must use a built-in authentication strength.

    Which authentication strength should you select for each policy? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. crée trois stratégies d'accès conditionnel qui utilisent le contrôle d'octroi **Require authentication strength**. Les stratégies doivent respecter les exigences suivantes :

    - **Admins** : seules les clés de sécurité FIDO2, Windows Hello for Business ou l'authentification par certificat multifacteur sont acceptées ;
    - **Staff** : aucune connexion à base de mot de passe n'est acceptée, mais la connexion par téléphone Microsoft Authenticator doit être autorisée ;
    - **Contractors** : toute combinaison multifacteur, y compris un mot de passe suivi d'un SMS, est acceptée.

    Chaque stratégie doit utiliser une force d'authentification intégrée.

    Quelle force d'authentification devez-vous sélectionner pour chaque stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Admins policy: [[admins]]
      Staff policy: [[staff]]
      Contractors policy: [[contractors]]
    fr: |
      Stratégie Admins : [[admins]]
      Stratégie Staff : [[staff]]
      Stratégie Contractors : [[contractors]]
  slots:
    - id: admins
      options:
        - { id: mfa, text: Multifactor authentication strength }
        - { id: pwless, text: Passwordless MFA strength }
        - { id: pr, text: Phishing-resistant MFA strength }
    - id: staff
      options:
        - { id: mfa, text: Multifactor authentication strength }
        - { id: pwless, text: Passwordless MFA strength }
        - { id: pr, text: Phishing-resistant MFA strength }
    - id: contractors
      options:
        - { id: mfa, text: Multifactor authentication strength }
        - { id: pwless, text: Passwordless MFA strength }
        - { id: pr, text: Phishing-resistant MFA strength }
answer:
  values: { admins: pr, staff: pwless, contractors: mfa }
explanation:
  correct:
    en: |
      Phishing-resistant MFA strength accepts only FIDO2 security keys, Windows Hello for Business or platform credentials, and multifactor certificate-based authentication. Passwordless MFA strength adds Microsoft Authenticator phone sign-in but still excludes password-based combinations. Multifactor authentication strength accepts every MFA combination, including a password plus a text message, voice call or push notification.
    fr: |
      Phishing-resistant MFA strength n'accepte que les clés de sécurité FIDO2, Windows Hello for Business ou les informations d'identification de plateforme, et l'authentification par certificat multifacteur. Passwordless MFA strength y ajoute la connexion par téléphone Microsoft Authenticator mais exclut toujours les combinaisons à base de mot de passe. Multifactor authentication strength accepte toutes les combinaisons MFA, y compris un mot de passe suivi d'un SMS, d'un appel vocal ou d'une notification Push.
references:
  - title: Overview of Conditional Access authentication strengths
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-strengths
