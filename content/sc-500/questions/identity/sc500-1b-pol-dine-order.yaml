id: sc500-1b-pol-dine-order
objective: "1.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a subscription named **Sub1** that contains 40 key vaults and a Log Analytics workspace named **law-audit**. None of the key vaults has a diagnostic setting.

    You need every existing and future key vault in Sub1 to send its logs to law-audit. You will use the built-in policy definition **Deploy Diagnostic Settings for Key Vault to Log Analytics workspace** and perform all the steps by using the Azure CLI.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. dispose d'un abonnement nommé **Sub1** qui contient 40 coffres de clés et un espace de travail Log Analytics nommé **law-audit**. Aucun coffre de clés n'a de paramètre de diagnostic.

    Chaque coffre de clés existant et futur de Sub1 doit envoyer ses journaux vers law-audit. Vous utiliserez la définition de stratégie intégrée **Deploy Diagnostic Settings for Key Vault to Log Analytics workspace** et effectuerez toutes les étapes avec Azure CLI.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: assign, text: { en: "Assign the definition to Sub1 with a system-assigned managed identity and the ID of law-audit as a parameter.", fr: "Attribuer la définition à Sub1 avec une identité managée affectée par le système et l'ID de law-audit comme paramètre." } }
    - { id: roles, text: { en: "Assign the identity of the assignment the roles listed in the roleDefinitionIds of the definition.", fr: "Attribuer à l'identité de l'attribution les rôles listés dans les roleDefinitionIds de la définition." } }
    - { id: remediate, text: { en: "Create a remediation task for the assignment.", fr: "Créer une tâche de correction pour l'attribution." } }
    - { id: rpc, text: { en: "Assign the Resource Policy Contributor role to the identity of the assignment.", fr: "Attribuer le rôle Resource Policy Contributor à l'identité de l'attribution." } }
    - { id: dne, text: { en: "Set the enforcement mode of the assignment to DoNotEnforce.", fr: "Définir le mode d'application de l'attribution sur DoNotEnforce." } }
    - { id: exempt, text: { en: "Create an exemption of category Mitigated for the existing key vaults.", fr: "Créer une exemption de catégorie Mitigated pour les coffres de clés existants." } }
answer:
  sequence: [ assign, roles, remediate ]
explanation:
  correct:
    en: |
      A deployIfNotExists assignment needs a managed identity that has the roles listed in the definition's roleDefinitionIds. The portal grants them automatically, but an assignment created through the CLI or an SDK needs a manual role assignment, otherwise the remediation deployment fails. New key vaults are then handled by the assignment, and a remediation task deploys the missing diagnostic settings on the 40 existing vaults.
    fr: |
      Une attribution deployIfNotExists a besoin d'une identité managée qui possède les rôles listés dans les roleDefinitionIds de la définition. Le portail les accorde automatiquement, mais une attribution créée avec la CLI ou un SDK exige une attribution de rôle manuelle, sinon le déploiement de correction échoue. Les nouveaux coffres sont ensuite traités par l'attribution, et une tâche de correction déploie les paramètres de diagnostic manquants sur les 40 coffres existants.
  options:
    rpc: { en: "Resource Policy Contributor manages policies; the identity needs the roles that let it deploy diagnostic settings.", fr: "Resource Policy Contributor gère les stratégies ; l'identité a besoin des rôles qui lui permettent de déployer des paramètres de diagnostic." }
    dne: { en: "DoNotEnforce would stop the automatic deployment for new key vaults.", fr: "DoNotEnforce arrêterait le déploiement automatique pour les nouveaux coffres de clés." }
    exempt: { en: "Exempting the existing vaults would leave them without diagnostic settings.", fr: "Exempter les coffres existants les laisserait sans paramètre de diagnostic." }
references:
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
  - title: Azure Policy built-in definitions for Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/policy-reference
