id: sc500-1b-kvo-rotation-before-expiry
objective: "1.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a key vault named **kv-nw-enc** that contains a key named **cmk-backup**. cmk-backup was created without an expiration date.

    You need cmk-backup to rotate automatically 30 days before each version expires, and each new version must expire two years after it is created. You plan to set a rotation policy with a lifetime action of type Rotate that uses the trigger `timeBeforeExpiry: P30D`.

    Which two configurations are required for the policy to work? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un coffre de clés nommé **kv-nw-enc** qui contient une clé nommée **cmk-backup**. cmk-backup a été créée sans date d'expiration.

    cmk-backup doit pivoter automatiquement 30 jours avant l'expiration de chaque version, et chaque nouvelle version doit expirer deux ans après sa création. Vous prévoyez de définir une stratégie de rotation avec une action de durée de vie de type Rotate qui utilise le déclencheur `timeBeforeExpiry: P30D`.

    Quelles sont les deux configurations nécessaires au fonctionnement de la stratégie ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set expiryTime to P2Y in the attributes of the rotation policy.", fr: "Définir expiryTime sur P2Y dans les attributs de la stratégie de rotation." } }
    - { id: b, text: { en: "Set an expiration date on the current version of cmk-backup.", fr: "Définir une date d'expiration sur la version actuelle de cmk-backup." } }
    - { id: c, text: { en: "Move cmk-backup to a key vault in the Premium tier.", fr: "Déplacer cmk-backup vers un coffre de clés au niveau Premium." } }
    - { id: d, text: { en: "Enable purge protection on kv-nw-enc.", fr: "Activer la protection contre le vidage sur kv-nw-enc." } }
    - { id: e, text: { en: "Add a second lifetime action of type Notify to the rotation policy.", fr: "Ajouter une deuxième action de durée de vie de type Notify à la stratégie de rotation." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      A timeBeforeExpiry trigger needs an expiry time in the rotation policy and an expiration date on the key. The policy's expiryTime (P2Y) sets the expiration of each newly rotated version, and the current version, created without an expiration date, needs one so that the first rotation can be scheduled 30 days before it.
    fr: |
      Un déclencheur timeBeforeExpiry exige une durée d'expiration dans la stratégie de rotation et une date d'expiration sur la clé. L'expiryTime de la stratégie (P2Y) fixe l'expiration de chaque nouvelle version créée par rotation, et la version actuelle, créée sans date d'expiration, doit en recevoir une pour que la première rotation soit planifiée 30 jours avant.
  options:
    c:
      en: "Rotation policies work with software-protected keys in the Standard tier."
      fr: "Les stratégies de rotation fonctionnent avec des clés protégées par logiciel au niveau Standard."
    d:
      en: "Purge protection protects deleted objects; it isn't a prerequisite of automatic rotation."
      fr: "La protection contre le vidage protège les objets supprimés ; ce n'est pas un prérequis de la rotation automatique."
    e:
      en: "A Notify action only raises a near-expiry event; it isn't needed for the Rotate action."
      fr: "Une action Notify déclenche seulement un événement d'expiration proche ; elle n'est pas nécessaire à l'action Rotate."
references:
  - title: Configure cryptographic key auto-rotation in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation
