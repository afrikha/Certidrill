id: sc500-1a-app-assignment-required
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses. An enterprise application named **ExpenseHub** uses OpenID Connect for single sign-on. Any user in the tenant can currently sign in to ExpenseHub.

    You need to ensure that only members of a security group named **Finance** can sign in to ExpenseHub. The solution must be configured in the properties of the enterprise application.

    What should you do?
  fr: |
    Adatum Corporation dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1. Une application d'entreprise nommée **ExpenseHub** utilise OpenID Connect pour l'authentification unique. Actuellement, tout utilisateur du locataire peut se connecter à ExpenseHub.

    Vous devez faire en sorte que seuls les membres d'un groupe de sécurité nommé **Finance** puissent se connecter à ExpenseHub. La solution doit être configurée dans les propriétés de l'application d'entreprise.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set Visible to users to No and assign the Finance group to the application.", fr: "Régler Visible to users sur No et affecter le groupe Finance à l'application." }
    - id: b
      text: { en: "Add the Finance group as an owner of the application.", fr: "Ajouter le groupe Finance comme propriétaire de l'application." }
    - id: c
      text: { en: "Set Assignment required to Yes and assign the Finance group to the application.", fr: "Régler Assignment required sur Yes et affecter le groupe Finance à l'application." }
    - id: d
      text: { en: "Set the user consent setting of the tenant to Do not allow user consent.", fr: "Régler le paramètre de consentement de l'utilisateur du locataire sur Do not allow user consent." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When assignment is required, only users assigned to the application, directly or through a group, can sign in; everyone else is refused. Group-based assignment requires Microsoft Entra ID P1 or P2, which the tenant has, and it applies to direct members only because nested groups are not supported.
    fr: |
      Lorsque l'affectation est requise, seuls les utilisateurs affectés à l'application, directement ou par un groupe, peuvent se connecter ; les autres sont refusés. L'affectation par groupe exige Microsoft Entra ID P1 ou P2, dont dispose le locataire, et ne concerne que les membres directs, car les groupes imbriqués ne sont pas pris en charge.
  options:
    a:
      en: |
        Visibility only controls whether the app tile appears in My Apps; unassigned users can still sign in while assignment is not required.
      fr: |
        La visibilité détermine seulement si la vignette apparaît dans My Apps ; les utilisateurs non affectés peuvent toujours se connecter tant que l'affectation n'est pas requise.
    b:
      en: |
        Owners can manage the application's configuration; ownership does not restrict who can sign in.
      fr: |
        Les propriétaires peuvent gérer la configuration de l'application ; la propriété ne limite pas qui peut se connecter.
    d:
      en: |
        User consent settings control who can grant permissions to apps, not who can sign in to an app that is already consented.
      fr: |
        Les paramètres de consentement contrôlent qui peut accorder des autorisations aux applications, pas qui peut se connecter à une application déjà consentie.
references:
  - title: Manage access to an application
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/what-is-access-management
  - title: Manage users and groups assignment to an application
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/assign-user-or-group-access-portal
