id: sc500-1a-mi-facts
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses managed identities for its Azure workloads. A virtual machine named **VM1** has a system-assigned managed identity. A user-assigned managed identity named **id-batch** is used by several virtual machines. Both identities have Azure role assignments on a storage account.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise des identités managées pour ses charges de travail Azure. Une machine virtuelle nommée **VM1** a une identité managée affectée par le système. Une identité managée affectée par l'utilisateur nommée **id-batch** est utilisée par plusieurs machines virtuelles. Les deux identités ont des attributions de rôles Azure sur un compte de stockage.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "If you delete VM1, its managed identity is deleted as well.", fr: "Si vous supprimez VM1, son identité managée est également supprimée." } }
    - { id: b, text: { en: "If you delete id-batch, its role assignments on the storage account are deleted automatically.", fr: "Si vous supprimez id-batch, ses attributions de rôles sur le compte de stockage sont supprimées automatiquement." } }
    - { id: c, text: { en: "You can associate id-batch with additional virtual machines without creating new role assignments.", fr: "Vous pouvez associer id-batch à d'autres machines virtuelles sans créer de nouvelles attributions de rôles." } }
    - { id: d, text: { en: "You can include VM1's managed identity in a Conditional Access policy for workload identities.", fr: "Vous pouvez inclure l'identité managée de VM1 dans une stratégie d'accès conditionnel pour les identités de charge de travail." } }
    - { id: e, text: { en: "VM1's managed identity is listed in App registrations, where you can add a client secret to it.", fr: "L'identité managée de VM1 figure dans App registrations, où vous pouvez lui ajouter une clé secrète client." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A system-assigned identity shares the life cycle of its resource and is deleted with it. A user-assigned identity can be associated with more than one resource, and its existing role assignments apply wherever it is used.
    fr: |
      Une identité affectée par le système partage le cycle de vie de sa ressource et est supprimée avec elle. Une identité affectée par l'utilisateur peut être associée à plusieurs ressources, et ses attributions de rôles existantes s'appliquent partout où elle est utilisée.
  options:
    b:
      en: |
        Role assignments are not deleted automatically when a managed identity is deleted; orphaned assignments must be removed manually.
      fr: |
        Les attributions de rôles ne sont pas supprimées automatiquement à la suppression d'une identité managée ; les attributions orphelines doivent être supprimées manuellement.
    d:
      en: |
        Conditional Access for workload identities covers single-tenant service principals; managed identities aren't covered.
      fr: |
        L'accès conditionnel pour les identités de charge de travail couvre les principaux de service monolocataires ; les identités managées ne sont pas couvertes.
    e:
      en: |
        A managed identity's service principal has no app object, and its credentials are managed by Azure and are not accessible.
      fr: |
        Le principal de service d'une identité managée n'a pas d'objet application, et ses informations d'identification sont gérées par Azure et ne sont pas accessibles.
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
  - title: Managed identity best practice recommendations
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/managed-identity-best-practice-recommendations
