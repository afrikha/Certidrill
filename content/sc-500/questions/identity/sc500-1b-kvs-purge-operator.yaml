id: sc500-1b-kvs-purge-operator
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a subscription named **Sub-Dev** that is used for test environments. Test pipelines create and delete about 50 key vaults each week. Purge protection is not enabled on these vaults, and their soft-deleted copies keep the vault names reserved.

    A user named **Ops1** must permanently delete soft-deleted vaults in Sub-Dev every Friday. Ops1 must not be able to read or change the objects stored in any vault. The solution must follow the principle of least privilege.

    Which role should you assign to Ops1 at the Sub-Dev scope?
  fr: |
    Tailspin Toys dispose d'un abonnement nommé **Sub-Dev** utilisé pour les environnements de test. Des pipelines de test créent et suppriment environ 50 coffres de clés chaque semaine. La protection contre le vidage n'est pas activée sur ces coffres, et leurs copies supprimées de manière réversible gardent les noms de coffres réservés.

    Un utilisateur nommé **Ops1** doit supprimer définitivement les coffres supprimés de manière réversible de Sub-Dev chaque vendredi. Ops1 ne doit pas pouvoir lire ni modifier les objets stockés dans un coffre. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Ops1 dans l'étendue Sub-Dev ?
body:
  options:
    - { id: a, text: Key Vault Contributor }
    - { id: b, text: Key Vault Administrator }
    - { id: c, text: Key Vault Purge Operator }
    - { id: d, text: Key Vault Data Access Administrator }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Purging a soft-deleted vault is a privileged control plane action. Key Vault Purge Operator allows the permanent deletion of soft-deleted vaults and grants no data plane access to secrets, keys or certificates.
    fr: |
      Vider un coffre supprimé de manière réversible est une action privilégiée du plan de contrôle. Key Vault Purge Operator permet la suppression définitive des coffres supprimés de manière réversible et n'accorde aucun accès aux secrets, clés ou certificats dans le plan de données.
  options:
    a:
      en: "Key Vault Contributor manages vaults, but its definition explicitly excludes the purge action on deleted vaults."
      fr: "Key Vault Contributor gère les coffres, mais sa définition exclut explicitement l'action de vidage des coffres supprimés."
    b:
      en: "Key Vault Administrator grants every data plane operation on the objects, which Ops1 must not have, and does not manage vault resources."
      fr: "Key Vault Administrator accorde toutes les opérations du plan de données sur les objets, ce qu'Ops1 ne doit pas avoir, et ne gère pas les ressources de coffre."
    d:
      en: "Key Vault Data Access Administrator only assigns Key Vault data roles; it cannot purge vaults."
      fr: "Key Vault Data Access Administrator attribue seulement les rôles de données Key Vault ; il ne peut pas vider de coffres."
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  - title: Azure built-in roles for Security
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/security
