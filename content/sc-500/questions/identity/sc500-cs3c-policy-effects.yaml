id: sc500-cs3c-policy-effects
objective: "1.3.1"
type: dragdrop
caseStudy: sc500-cs3c-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to create the Azure Policy definitions that meet requirement 6.

    Which effect should you use in each definition? To answer, drag the appropriate effects to the correct requirements. Each effect may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer les définitions Azure Policy qui satisfont l'exigence 6.

    Quel effet devez-vous utiliser dans chaque définition ? Pour répondre, faites glisser les effets appropriés vers les exigences correspondantes. Chaque effet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: audit, text: Audit }
    - { id: aine, text: AuditIfNotExists }
    - { id: deny, text: Deny }
    - { id: denyaction, text: DenyAction }
    - { id: dine, text: DeployIfNotExists }
    - { id: modify, text: Modify }
  targets:
    - { id: storage, text: { en: "Storage accounts that allow anonymous blob access", fr: "Comptes de stockage qui autorisent l'accès anonyme aux objets blob" } }
    - { id: tag, text: { en: "costCenter tag copied from the resource group", fr: "Étiquette costCenter copiée depuis le groupe de ressources" } }
    - { id: diag, text: { en: "Diagnostic setting on every new key vault", fr: "Paramètre de diagnostic sur chaque nouveau coffre de clés" } }
    - { id: sqlaudit, text: { en: "SQL servers without auditing", fr: "Serveurs SQL sans audit" } }
answer:
  mapping: { storage: deny, tag: modify, diag: dine, sqlaudit: aine }
explanation:
  correct:
    en: |-
      Deny rejects the creation of a non-compliant storage account. Modify adds or replaces tags during creation or update, and a remediation task with a managed identity updates the existing resources. DeployIfNotExists deploys the missing diagnostic setting, a related resource, after the key vault is created. AuditIfNotExists reports a server whose related auditing settings are missing, without changing it.
    fr: |-
      Deny rejette la création d'un compte de stockage non conforme. Modify ajoute ou remplace des étiquettes lors de la création ou de la mise à jour, et une tâche de correction avec une identité managée met à jour les ressources existantes. DeployIfNotExists déploie le paramètre de diagnostic manquant, une ressource associée, après la création du coffre de clés. AuditIfNotExists signale un serveur dont les paramètres d'audit associés sont absents, sans le modifier.
  options:
    audit:
      en: |-
        Audit evaluates the properties of the resource itself; auditing settings are a related resource of the server, which AuditIfNotExists evaluates.
      fr: |-
        Audit évalue les propriétés de la ressource elle-même ; les paramètres d'audit sont une ressource associée au serveur, qu'évalue AuditIfNotExists.
    denyaction:
      en: |-
        DenyAction blocks actions such as delete on existing resources; it does not block the creation of a resource.
      fr: |-
        DenyAction bloque des actions comme la suppression sur des ressources existantes ; il ne bloque pas la création d'une ressource.
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
  - title: Azure Policy definitions modify effect
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-modify
