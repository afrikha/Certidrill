id: sc500-1b-pol-custom-json
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is writing a custom Azure Policy definition for key vaults. The definition must prevent anyone from creating or updating a key vault whose purge protection is disabled, including a vault whose deployment template doesn't set the purge protection property at all.

    How should you complete the definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank rédige une définition Azure Policy personnalisée pour les coffres de clés. La définition doit empêcher quiconque de créer ou de mettre à jour un coffre de clés dont la protection contre le vidage est désactivée, y compris un coffre dont le modèle de déploiement ne définit pas du tout la propriété de protection contre le vidage.

    Comment devez-vous compléter la définition ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "mode": "Indexed",
      "policyRule": {
        "if": {
          "allOf": [
            { "field": "type", "equals": "[[type]]" },
            {
              "anyOf": [
                { "field": "Microsoft.KeyVault/vaults/enablePurgeProtection", "[[op]]": "false" },
                { "field": "Microsoft.KeyVault/vaults/enablePurgeProtection", "equals": "false" }
              ]
            }
          ]
        },
        "then": { "effect": "[[effect]]" }
      }
    }
  slots:
    - id: type
      options:
        - { id: vaults, text: Microsoft.KeyVault/vaults }
        - { id: secrets, text: Microsoft.KeyVault/vaults/secrets }
        - { id: hsm, text: Microsoft.KeyVault/managedHSMs }
        - { id: rg, text: Microsoft.Resources/subscriptions/resourceGroups }
    - id: op
      options:
        - { id: exists, text: exists }
        - { id: notequals, text: notEquals }
        - { id: contains, text: contains }
        - { id: like, text: like }
    - id: effect
      options:
        - { id: deny, text: deny }
        - { id: audit, text: audit }
        - { id: modify, text: modify }
        - { id: denyaction, text: denyAction }
answer:
  values: { type: vaults, op: exists, effect: deny }
explanation:
  correct:
    en: |
      The rule targets the Microsoft.KeyVault/vaults resource type. The anyOf block matches a vault whose enablePurgeProtection property is absent (exists false) or explicitly false. The deny effect rejects the create or update request of such a vault, which prevents the non-compliant configuration.
    fr: |
      La règle cible le type de ressource Microsoft.KeyVault/vaults. Le bloc anyOf correspond à un coffre dont la propriété enablePurgeProtection est absente (exists false) ou explicitement à false. L'effet deny rejette la requête de création ou de mise à jour d'un tel coffre, ce qui empêche la configuration non conforme.
  options:
    secrets: { en: "Purge protection is a property of the vault, not of its secrets.", fr: "La protection contre le vidage est une propriété du coffre, pas de ses secrets." }
    hsm: { en: "Managed HSM is a different resource type; the requirement concerns key vaults.", fr: "Managed HSM est un autre type de ressource ; l'exigence concerne les coffres de clés." }
    notequals: { en: "notEquals false would match vaults whose purge protection is true, the compliant ones.", fr: "notEquals false correspondrait aux coffres dont la protection contre le vidage vaut true, c'est-à-dire les coffres conformes." }
    audit: { en: "Audit reports the vault as non-compliant but doesn't prevent its creation.", fr: "Audit signale le coffre comme non conforme mais n'empêche pas sa création." }
    modify: { en: "The requirement is to prevent the configuration, not to change the request; Modify also needs a details block with operations.", fr: "L'exigence est d'empêcher la configuration, pas de modifier la requête ; Modify exige en outre un bloc details avec des opérations." }
    denyaction: { en: "denyAction blocks actions such as delete on existing resources; it doesn't block creation.", fr: "denyAction bloque des actions comme la suppression sur des ressources existantes ; il ne bloque pas la création." }
references:
  - title: Azure Policy built-in definitions for Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/policy-reference
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
