id: sc500-sr1-pim-approval-2
objective: "1.1.1"
type: series_yesno
series: sc500-sr1-pim-approval
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create eligible assignments and select UserA as the approver.
  fr: Vous créez des attributions éligibles et sélectionnez UserA comme approbateur.
body:
  solution:
    en: |
      In PIM, you assign the Security Administrator role to User1, User2 and User3 as **Eligible** assignments. In the role settings, you set **Activation maximum duration** to **4 hours**, you select **Require approval to activate**, and you select UserA as the approver.
    fr: |
      Dans PIM, vous attribuez le rôle Security Administrator à User1, User2 et User3 sous forme d'attributions **Eligible**. Dans les paramètres de rôle, vous définissez **Activation maximum duration** sur **4 heures**, vous sélectionnez **Require approval to activate** et vous sélectionnez UserA comme approbateur.
answer: { value: true }
explanation:
  correct:
    en: |
      Eligible users must activate the role before they can use it. The activation maximum duration slider accepts 1 to 24 hours, so 4 hours is valid, and with approval required each activation waits for the selected approver. An approver does not need any role, so UserA can approve without being given administrative rights.
    fr: |
      Les utilisateurs éligibles doivent activer le rôle avant de pouvoir l'utiliser. Le curseur de durée maximale d'activation accepte de 1 à 24 heures, donc 4 heures est une valeur valide, et lorsque l'approbation est exigée, chaque activation attend l'approbateur sélectionné. Un approbateur n'a besoin d'aucun rôle : UserA peut approuver sans recevoir de droits d'administration.
references:
  - title: Configure Microsoft Entra role settings in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings
