id: sc500-1c-lock-readonly-storage
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a resource group named **rg-data** that contains a storage account named **stcontosodata**. An administrator applies a **ReadOnly** lock to rg-data.

    A user named **User1** has the **Storage Account Contributor** and **Storage Blob Data Contributor** roles on stcontosodata. User1 signs in with Microsoft Entra ID.

    Which operation fails for User1 because of the lock?
  fr: |
    Contoso, Ltd. dispose d'un groupe de ressources nommé **rg-data** qui contient un compte de stockage nommé **stcontosodata**. Un administrateur applique un verrou **ReadOnly** à rg-data.

    Un utilisateur nommé **User1** dispose des rôles **Storage Account Contributor** et **Storage Blob Data Contributor** sur stcontosodata. User1 se connecte avec Microsoft Entra ID.

    Quelle opération échoue pour User1 à cause du verrou ?
body:
  options:
    - id: a
      text: { en: "Uploading a blob to an existing container by using Microsoft Entra authorization", fr: "Charger un objet blob dans un conteneur existant avec l'autorisation Microsoft Entra" }
    - id: b
      text: { en: "Deleting a blob from an existing container by using Microsoft Entra authorization", fr: "Supprimer un objet blob d'un conteneur existant avec l'autorisation Microsoft Entra" }
    - id: c
      text: { en: "Viewing the properties of the storage account in the Azure portal", fr: "Afficher les propriétés du compte de stockage dans le portail Azure" }
    - id: d
      text: { en: "Listing the access keys of the storage account", fr: "Lister les clés d'accès du compte de stockage" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A ReadOnly lock is inherited by every resource in the group and blocks control plane writes and POST operations for all users, whatever their role. Listing account keys is a POST operation (`listKeys`) on Azure Resource Manager, so it fails.
    fr: |
      Un verrou ReadOnly est hérité par toutes les ressources du groupe et bloque les écritures et les opérations POST du plan de contrôle pour tous les utilisateurs, quel que soit leur rôle. Lister les clés du compte est une opération POST (`listKeys`) sur Azure Resource Manager : elle échoue.
  options:
    a:
      en: Uploading a blob is a data plane operation; locks only apply to control plane operations.
      fr: Charger un objet blob est une opération du plan de données ; les verrous ne s'appliquent qu'aux opérations du plan de contrôle.
    b:
      en: Deleting a blob is a data plane operation, so neither a ReadOnly nor a CanNotDelete lock protects the data.
      fr: "Supprimer un objet blob est une opération du plan de données : ni un verrou ReadOnly ni un verrou CanNotDelete ne protègent les données."
    c:
      en: Reading the resource remains allowed; a ReadOnly lock is similar to restricting everyone to the Reader role's permissions.
      fr: La lecture de la ressource reste permise ; un verrou ReadOnly revient à limiter tout le monde aux autorisations du rôle Reader.
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
