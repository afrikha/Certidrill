id: sc500-1b-pol-exemption-waiver
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders assigned a security initiative to a management group named **MG-Corp**. The initiative includes the definition **Azure Key Vault should disable public network access** and 30 other definitions.

    A key vault named **kv-nw-legacy** must keep public network access for 90 days while a vendor application is migrated. The security officer has formally accepted this risk.

    You need to stop kv-nw-legacy from being reported as non-compliant with that definition only, for 90 days. kv-nw-legacy must remain evaluated against the other definitions of the initiative, and the decision must stay visible in compliance reports.

    What should you do?
  fr: |
    Northwind Traders a attribué une initiative de sécurité à un groupe d'administration nommé **MG-Corp**. L'initiative contient la définition **Azure Key Vault should disable public network access** et 30 autres définitions.

    Un coffre de clés nommé **kv-nw-legacy** doit conserver l'accès réseau public pendant 90 jours, le temps de migrer une application d'un éditeur. Le responsable de la sécurité a formellement accepté ce risque.

    Vous devez faire en sorte que kv-nw-legacy ne soit plus signalé comme non conforme à cette seule définition, pendant 90 jours. kv-nw-legacy doit rester évalué par rapport aux autres définitions de l'initiative, et la décision doit rester visible dans les rapports de conformité.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add kv-nw-legacy to the excluded scopes of the initiative assignment.", fr: "Ajouter kv-nw-legacy aux étendues exclues de l'attribution de l'initiative." } }
    - { id: b, text: { en: "Create an exemption on kv-nw-legacy of category Mitigated for the whole initiative assignment.", fr: "Créer sur kv-nw-legacy une exemption de catégorie Mitigated pour toute l'attribution de l'initiative." } }
    - { id: c, text: { en: "Create an exemption on kv-nw-legacy of category Waiver for that definition, with an expiration date in 90 days.", fr: "Créer sur kv-nw-legacy une exemption de catégorie Waiver pour cette définition, avec une date d'expiration dans 90 jours." } }
    - { id: d, text: { en: "Set the enforcement mode of the initiative assignment to Disabled for 90 days.", fr: "Définir le mode d'application de l'attribution de l'initiative sur Disabled pendant 90 jours." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An exemption of category Waiver records that non-compliance is temporarily accepted. On an initiative assignment, its policyDefinitionReferenceId list limits it to the chosen definition, and expiresOn ends it automatically after 90 days while the exemption object is kept for record-keeping. Exempt resources stay in compliance reports with the Exempt state.
    fr: |
      Une exemption de catégorie Waiver enregistre que la non-conformité est temporairement acceptée. Sur une attribution d'initiative, sa liste policyDefinitionReferenceId la limite à la définition choisie, et expiresOn y met fin automatiquement après 90 jours, l'objet exemption étant conservé pour traçabilité. Les ressources exemptées restent dans les rapports de conformité avec l'état Exempt.
  options:
    a:
      en: "Excluded scopes aren't evaluated at all, for every definition of the initiative, and have no expiration."
      fr: "Les étendues exclues ne sont pas évaluées du tout, pour toutes les définitions de l'initiative, et n'expirent pas."
    b:
      en: "Mitigated means the policy intent is met by another method, which isn't the case; and the exemption would cover all 31 definitions."
      fr: "Mitigated signifie que l'intention de la stratégie est atteinte par une autre méthode, ce qui n'est pas le cas ; de plus, l'exemption couvrirait les 31 définitions."
    d:
      en: "Enforcement mode applies to the whole assignment and doesn't change compliance results; kv-nw-legacy would still be reported as non-compliant."
      fr: "Le mode d'application concerne toute l'attribution et ne change pas les résultats de conformité ; kv-nw-legacy serait toujours signalé comme non conforme."
references:
  - title: Azure Policy exemption structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
  - title: Azure Policy assignment structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure
