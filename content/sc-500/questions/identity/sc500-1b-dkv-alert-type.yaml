id: sc500-1b-dkv-alert-type
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a key vault named **kv-cts-hr** that uses the vault access policy permission model. Microsoft Defender for Key Vault is enabled on the subscription.

    The diagnostic logs of kv-cts-hr show the following sequence for a user named **User7**, who never accessed kv-cts-hr before:

    | Time | Operation |
    | --- | --- |
    | 22:41 | Access policy update: Get and List on secrets granted to User7 |
    | 22:43 | SecretGet (payroll-db-password) |
    | 22:43 | SecretGet (hr-api-key) |
    | 22:44 | SecretGet (sftp-password) |

    Which Defender for Key Vault alert specifically describes this pattern?
  fr: |
    Contoso, Ltd. dispose d'un coffre de clés nommé **kv-cts-hr** qui utilise le modèle d'autorisation par stratégie d'accès du coffre. Microsoft Defender for Key Vault est activé sur l'abonnement.

    Les journaux de diagnostic de kv-cts-hr montrent la séquence suivante pour un utilisateur nommé **User7**, qui n'avait jamais accédé à kv-cts-hr :

    | Heure | Opération |
    | --- | --- |
    | 22:41 | Mise à jour des stratégies d'accès : Get et List sur les secrets accordés à User7 |
    | 22:43 | SecretGet (payroll-db-password) |
    | 22:43 | SecretGet (hr-api-key) |
    | 22:44 | SecretGet (sftp-password) |

    Quelle alerte de Defender for Key Vault décrit spécifiquement ce schéma ?
body:
  options:
    - { id: a, text: Suspicious secret listing and query in a key vault }
    - { id: b, text: Suspicious policy change and secret query in a key vault }
    - { id: c, text: High volume of operations in a key vault }
    - { id: d, text: Unusual access denied - Unusual user accessing key vault denied }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Suspicious policy change and secret query in a key vault fires when a vault policy change (Put) is followed by Secret Get operations, which may indicate an attempt to read secrets that were previously inaccessible. Here User7 granted himself an access policy and immediately read three secrets.
    fr: |
      Suspicious policy change and secret query in a key vault se déclenche quand une modification de stratégie du coffre (Put) est suivie d'opérations Secret Get, ce qui peut indiquer une tentative de lire des secrets auparavant inaccessibles. Ici, User7 s'est accordé une stratégie d'accès puis a immédiatement lu trois secrets.
  options:
    a:
      en: "This alert describes a Secret List operation followed by Secret Get operations, typical of secret dumping; the sequence starts with a policy change, not a list."
      fr: "Cette alerte décrit une opération Secret List suivie d'opérations Secret Get, typique du vidage de secrets ; la séquence commence par une modification de stratégie, pas par un listage."
    c:
      en: "Four operations aren't an anomalous volume; this alert doesn't describe the policy change followed by reads."
      fr: "Quatre opérations ne constituent pas un volume anormal ; cette alerte ne décrit pas la modification de stratégie suivie de lectures."
    d:
      en: "Every operation succeeded; this alert concerns denied access attempts."
      fr: "Toutes les opérations ont réussi ; cette alerte concerne des tentatives d'accès refusées."
references:
  - title: Alerts for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-azure-key-vault
