id: sc500-1b-kvf-cli-rules
objective: "1.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a key vault named **kv-lw-ops** in a resource group named **rg-ops**. Public access is currently allowed from all networks.

    The office network uses the internal range 10.20.0.0/16 and reaches the internet through a NAT device with the public range 198.51.100.0/24.

    You need to configure kv-lw-ops so that:

    - users in the office can use the vault;
    - requests from all other public networks are rejected;
    - Azure Backup keeps backing up the keys and secrets of encrypted VMs.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'un coffre de clés nommé **kv-lw-ops** dans un groupe de ressources nommé **rg-ops**. L'accès public est actuellement autorisé depuis tous les réseaux.

    Le réseau du bureau utilise la plage interne 10.20.0.0/16 et accède à Internet via un équipement NAT dont la plage publique est 198.51.100.0/24.

    Vous devez configurer kv-lw-ops pour que :

    - les utilisateurs du bureau puissent utiliser le coffre ;
    - les requêtes de tous les autres réseaux publics soient rejetées ;
    - Sauvegarde Azure continue à sauvegarder les clés et les secrets des VM chiffrées.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az keyvault network-rule add --name kv-lw-ops --resource-group rg-ops \
      --ip-address [[ip]]

    az keyvault update --name kv-lw-ops --resource-group rg-ops \
      --default-action [[act]] --bypass [[byp]]
  slots:
    - id: ip
      options:
        - { id: nat, text: 198.51.100.0/24 }
        - { id: internal, text: 10.20.0.0/16 }
        - { id: any, text: 0.0.0.0/0 }
    - id: act
      options:
        - { id: allow, text: Allow }
        - { id: deny, text: Deny }
    - id: byp
      options:
        - { id: azure, text: AzureServices }
        - { id: none, text: None }
answer:
  values: { ip: nat, act: deny, byp: azure }
explanation:
  correct:
    en: |
      Key Vault IP rules accept only public IPv4 addresses and ranges, so the office is allowed through its NAT range 198.51.100.0/24; private RFC 1918 ranges such as 10.20.0.0/16 are rejected. The default action Deny turns the firewall on and rejects every other network. The bypass value AzureServices keeps the trusted services exception, which lets Azure Backup reach the vault.
    fr: |
      Les règles IP de Key Vault n'acceptent que des adresses et plages IPv4 publiques : le bureau est autorisé par sa plage NAT 198.51.100.0/24, et les plages privées RFC 1918 comme 10.20.0.0/16 sont refusées. L'action par défaut Deny active le pare-feu et rejette tous les autres réseaux. La valeur de contournement AzureServices conserve l'exception des services approuvés, qui permet à Sauvegarde Azure d'atteindre le coffre.
  options:
    internal: { en: "Private ranges are rejected in Key Vault IP rules; the vault sees the office's public NAT address.", fr: "Les plages privées sont refusées dans les règles IP de Key Vault ; le coffre voit l'adresse NAT publique du bureau." }
    any: { en: "0.0.0.0/0 would admit every public network.", fr: "0.0.0.0/0 admettrait tous les réseaux publics." }
    allow: { en: "With the default action Allow, the rules are not enforced and every network can connect.", fr: "Avec l'action par défaut Allow, les règles ne s'appliquent pas et tous les réseaux peuvent se connecter." }
    none: { en: "None removes the trusted services exception, which would block Azure Backup.", fr: "None supprime l'exception des services approuvés, ce qui bloquerait Sauvegarde Azure." }
references:
  - title: Configure network security for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/network-security
  - title: Virtual network service endpoints for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview-vnet-service-endpoints
