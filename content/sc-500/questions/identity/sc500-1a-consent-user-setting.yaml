id: sc500-1a-consent-user-setting
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. currently allows users to consent to any application for any permission that doesn't require admin consent. After an illicit consent grant attack, the security team sets these requirements:

    - Users can still consent, but only to apps from verified publishers or apps registered in the Contoso tenant.
    - Users can consent only to the delegated permissions `openid`, `profile`, `email` and `offline_access`.
    - Administrative effort must be minimized.

    You classify the four permissions as **Low** in Permission classifications.

    What should you configure next?
  fr: |
    Contoso, Ltd. permet actuellement aux utilisateurs de consentir à n'importe quelle application pour toute autorisation qui ne nécessite pas le consentement administrateur. Après une attaque par octroi de consentement illicite, l'équipe sécurité fixe ces exigences :

    - les utilisateurs peuvent toujours consentir, mais uniquement aux applications d'éditeurs vérifiés ou aux applications inscrites dans le locataire Contoso ;
    - les utilisateurs ne peuvent consentir qu'aux autorisations déléguées `openid`, `profile`, `email` et `offline_access` ;
    - l'effort d'administration doit être réduit au minimum.

    Vous classez les quatre autorisations comme **Low** dans Permission classifications.

    Que devez-vous configurer ensuite ?
body:
  options:
    - id: a
      text: { en: "Set User consent for applications to Do not allow user consent.", fr: "Régler User consent for applications sur Do not allow user consent." }
    - id: b
      text: { en: "Set User consent for applications to Allow user consent for apps from verified publishers, for selected permissions.", fr: "Régler User consent for applications sur Allow user consent for apps from verified publishers, for selected permissions." }
    - id: c
      text: { en: "Keep User consent for applications set to Allow user consent for apps and turn on the admin consent workflow.", fr: "Conserver User consent for applications sur Allow user consent for apps et activer le workflow de consentement administrateur." }
    - id: d
      text: { en: "Set Assignment required to Yes on every enterprise application in the tenant.", fr: "Régler Assignment required sur Yes pour chaque application d'entreprise du locataire." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The built-in consent policy microsoft-user-default-low, shown as Allow user consent for apps from verified publishers, for selected permissions, limits user consent to apps from verified publishers or apps registered in your tenant, and only for permissions classified as low impact. Only delegated permissions that don't require admin consent can be classified.
    fr: |
      La stratégie de consentement intégrée microsoft-user-default-low, affichée comme Allow user consent for apps from verified publishers, for selected permissions, limite le consentement des utilisateurs aux applications d'éditeurs vérifiés ou inscrites dans votre locataire, et uniquement pour les autorisations classées à faible impact. Seules les autorisations déléguées qui ne nécessitent pas le consentement administrateur peuvent être classées.
  options:
    a:
      en: |
        This blocks all user consent, while the requirement is to keep limited user consent.
      fr: |
        Cela bloque tout consentement des utilisateurs, alors que l'exigence est de conserver un consentement limité.
    c:
      en: |
        Allow user consent for apps (microsoft-user-default-legacy) still lets users consent to any app for any permission that doesn't require admin consent.
      fr: |
        Allow user consent for apps (microsoft-user-default-legacy) permet toujours de consentir à n'importe quelle application pour toute autorisation qui ne nécessite pas le consentement administrateur.
    d:
      en: |
        Requiring assignment on every app disables user consent for them entirely and adds heavy administrative effort.
      fr: |
        Exiger l'affectation sur chaque application y supprime totalement le consentement des utilisateurs et alourdit fortement l'administration.
references:
  - title: Configure how users consent to applications
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-user-consent
  - title: Configure permission classifications
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-permission-classifications
