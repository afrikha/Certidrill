id: sc500-1b-kvo-cert-export
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a key vault named **kv-lw-pki** in the Premium tier. Last month, an administrator created a certificate named **cert-intranet** in kv-lw-pki with a certificate policy that uses the key type RSA-HSM.

    The infrastructure team must now install the certificate, with its private key, on an on-premises web server. The team downloads the PFX file from kv-lw-pki, but the file contains no private key.

    You need to provide the team with a PFX file that contains the private key. What should you do?
  fr: |
    Litware, Inc. dispose d'un coffre de clés nommé **kv-lw-pki** au niveau Premium. Le mois dernier, un administrateur a créé un certificat nommé **cert-intranet** dans kv-lw-pki avec une stratégie de certificat qui utilise le type de clé RSA-HSM.

    L'équipe infrastructure doit maintenant installer le certificat, avec sa clé privée, sur un serveur web local. L'équipe télécharge le fichier PFX depuis kv-lw-pki, mais le fichier ne contient aucune clé privée.

    Vous devez fournir à l'équipe un fichier PFX qui contient la clé privée. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Key Vault Certificate User role to the team on cert-intranet, and download the PFX again.", fr: "Attribuer le rôle Key Vault Certificate User à l'équipe sur cert-intranet, puis télécharger de nouveau le PFX." } }
    - { id: b, text: { en: "Back up cert-intranet with az keyvault certificate backup, and give the backup file to the team.", fr: "Sauvegarder cert-intranet avec az keyvault certificate backup, puis remettre le fichier de sauvegarde à l'équipe." } }
    - { id: c, text: { en: "Create a new certificate whose policy uses an exportable RSA key, and download its PFX.", fr: "Créer un nouveau certificat dont la stratégie utilise une clé RSA exportable, puis télécharger son PFX." } }
    - { id: d, text: { en: "Create a new version of cert-intranet with the same policy, and download its PFX.", fr: "Créer une nouvelle version de cert-intranet avec la même stratégie, puis télécharger son PFX." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The certificate policy decides whether the key is exportable, and exportable keys are allowed only with the RSA and EC key types; HSM keys are never exportable. A new certificate created with an exportable RSA key lets the team retrieve the private key from the certificate's secret in PFX format.
    fr: |
      La stratégie de certificat détermine si la clé est exportable, et les clés exportables ne sont permises qu'avec les types RSA et EC ; les clés HSM ne sont jamais exportables. Un nouveau certificat créé avec une clé RSA exportable permet à l'équipe de récupérer la clé privée depuis le secret du certificat au format PFX.
  options:
    a:
      en: "The private key isn't included in the secret of a non-exportable certificate, so no role can download it."
      fr: "La clé privée n'est pas incluse dans le secret d'un certificat non exportable : aucun rôle ne permet de la télécharger."
    b:
      en: "A Key Vault backup blob can only be restored into a key vault; it isn't a PFX file the server can import."
      fr: "Un objet blob de sauvegarde Key Vault ne peut être restauré que dans un coffre de clés ; ce n'est pas un fichier PFX importable par le serveur."
    d:
      en: "A policy is shared by all versions of a certificate, so a new version would still use a non-exportable HSM key."
      fr: "Une stratégie est partagée par toutes les versions d'un certificat : une nouvelle version utiliserait toujours une clé HSM non exportable."
references:
  - title: About Azure Key Vault certificates
    url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
