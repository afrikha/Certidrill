id: sc500-1a-kv-resource-access
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is deploying a new key vault named **kv-contoso-deploy** for its infrastructure team. The vault must support the following:

    - Azure virtual machines must be able to retrieve certificates stored as secrets in the vault when they are deployed.
    - Azure Resource Manager must be able to retrieve secrets from the vault when ARM templates that reference them are deployed.

    Which two vault properties should you set? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. déploie un coffre de clés nommé **kv-contoso-deploy** pour son équipe infrastructure. Le coffre doit prendre en charge les éléments suivants :

    - les machines virtuelles Azure doivent pouvoir récupérer, lors de leur déploiement, des certificats stockés comme secrets dans le coffre ;
    - Azure Resource Manager doit pouvoir récupérer des secrets du coffre lors du déploiement de modèles ARM qui y font référence.

    Quelles sont les deux propriétés du coffre à définir ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "enabledForDeployment" }
    - { id: b, text: "enabledForDiskEncryption" }
    - { id: c, text: "enabledForTemplateDeployment" }
    - { id: d, text: "enablePurgeProtection" }
    - { id: e, text: "publicNetworkAccess: Disabled" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      enabledForDeployment permits Azure Virtual Machines to retrieve certificates stored as secrets from the vault. enabledForTemplateDeployment permits Azure Resource Manager to retrieve secrets from the vault during template deployments.
    fr: |
      enabledForDeployment permet aux machines virtuelles Azure de récupérer des certificats stockés comme secrets dans le coffre. enabledForTemplateDeployment permet à Azure Resource Manager de récupérer des secrets du coffre lors des déploiements de modèles.
  options:
    b:
      en: |
        enabledForDiskEncryption lets Azure Disk Encryption retrieve secrets and unwrap keys; it is not used to deploy certificates or templates.
      fr: |
        enabledForDiskEncryption permet à Azure Disk Encryption de récupérer des secrets et de désencapsuler des clés ; il ne sert pas au déploiement de certificats ou de modèles.
    d:
      en: |
        Purge protection protects deleted objects from permanent deletion; it does not allow any service to read the vault.
      fr: |
        La protection contre le vidage protège les objets supprimés contre une suppression définitive ; elle n'autorise aucun service à lire le coffre.
    e:
      en: |
        Disabling public network access blocks traffic except private endpoint and trusted service traffic; it does not grant either capability.
      fr: |
        Désactiver l'accès réseau public bloque le trafic sauf celui des points de terminaison privés et des services approuvés ; cela n'accorde aucune des deux fonctionnalités.
references:
  - title: Microsoft.KeyVault vaults
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.keyvault/vaults
