id: sc500-1c-std-exempt-role
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has an Azure subscription named **Sub-Games** that has the Microsoft cloud security benchmark assigned in Microsoft Defender for Cloud. An analyst named **Analyst1** has the **Security Reader** role on Sub-Games. When Analyst1 opens a recommendation, the **Exempt** button is not available.

    You need to allow Analyst1 to create exemptions for recommendations on Sub-Games. The solution must use the principle of least privilege.

    Which role should you assign to Analyst1 on Sub-Games?
  fr: |
    Wingtip Toys dispose d'un abonnement Azure nommé **Sub-Games** auquel le Microsoft cloud security benchmark est attribué dans Microsoft Defender for Cloud. Une analyste nommée **Analyst1** dispose du rôle **Security Reader** sur Sub-Games. Quand Analyst1 ouvre une recommandation, le bouton **Exempt** n'est pas disponible.

    Vous devez permettre à Analyst1 de créer des exemptions pour les recommandations de Sub-Games. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Analyst1 sur Sub-Games ?
body:
  options:
    - id: a
      text: Reader
    - id: b
      text: Monitoring Contributor
    - id: c
      text: Owner
    - id: d
      text: Security Admin
answer: { optionId: d }
explanation:
  correct:
    en: |
      Creating an exemption requires the `Microsoft.Authorization/policyExemptions/*` and `policyAssignments/exempt/action` permissions. Security Admin, the role recommended for exemptions, includes them along with the rights to manage security policies and alerts, without the broad resource access of Owner or Contributor.
    fr: |
      Créer une exemption nécessite les autorisations `Microsoft.Authorization/policyExemptions/*` et `policyAssignments/exempt/action`. Security Admin, le rôle recommandé pour les exemptions, les inclut avec les droits de gérer les stratégies de sécurité et les alertes, sans l'accès étendu aux ressources d'Owner ou de Contributor.
  options:
    a:
      en: Reader only grants read access and cannot write policy exemptions.
      fr: Reader n'accorde qu'un accès en lecture et ne permet pas d'écrire des exemptions de stratégie.
    b:
      en: Monitoring Contributor manages monitoring settings such as alerts and diagnostic settings, not policy exemptions.
      fr: Monitoring Contributor gère des paramètres de supervision comme les alertes et les paramètres de diagnostic, pas les exemptions de stratégie.
    c:
      en: Owner can create exemptions but grants full control of every resource and of access, which is far more than needed.
      fr: Owner peut créer des exemptions, mais accorde le contrôle total de toutes les ressources et des accès, bien plus que nécessaire.
references:
  - title: Exempt resources from recommendations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/exempt-resource
