id: sc500-1b-scan-statements
objective: "1.2.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. enables Microsoft Defender for Servers Plan 2, with agentless scanning for machines, on a subscription that contains Azure virtual machines. The virtual machines have no outbound internet access.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. active Microsoft Defender for Servers Plan 2, avec l'analyse sans agent des machines, sur un abonnement qui contient des machines virtuelles Azure. Les machines virtuelles n'ont aucun accès sortant à Internet.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Azure Monitor Agent must be installed on each virtual machine before secrets are discovered."
        fr: "L'agent Azure Monitor doit être installé sur chaque machine virtuelle avant la découverte des secrets."
    - id: s2
      text:
        en: "Secrets are discovered by analyzing snapshots of the virtual machine disks."
        fr: "Les secrets sont découverts en analysant des instantanés des disques des machines virtuelles."
    - id: s3
      text:
        en: "The same plan also discovers secrets exposed in the company's Azure DevOps repositories."
        fr: "Le même plan découvre aussi les secrets exposés dans les référentiels Azure DevOps de l'entreprise."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Machine secrets scanning is agentless: Defender for Cloud captures disk snapshots through cloud APIs and analyzes them, with no agent, no network connectivity to the machine and no performance impact. Discovery of exposed secrets in Azure DevOps repositories requires the Defender CSPM plan, not Defender for Servers Plan 2.
    fr: |
      L'analyse des secrets des machines est sans agent : Defender for Cloud capture des instantanés de disque via les API du cloud et les analyse, sans agent, sans connectivité réseau vers la machine et sans impact sur les performances. La découverte des secrets exposés dans les référentiels Azure DevOps exige le plan Defender CSPM, pas Defender for Servers Plan 2.
references:
  - title: Machine secrets scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning-servers
  - title: Protecting secrets in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning
