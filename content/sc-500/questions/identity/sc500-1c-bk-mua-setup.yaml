id: sc500-1c-bk-mua-setup
objective: "1.3.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Recovery Services vault named **rsv-erp** in a subscription named **Sub-ERP**. A backup administrator named **BackupAdmin1** manages rsv-erp. The security team manages a separate subscription named **Sub-Sec** in the same tenant.

    You need to configure multi-user authorization (MUA) so that BackupAdmin1 can perform a critical operation on rsv-erp, such as reducing retention, only after the security team temporarily allows it. BackupAdmin1 must never be able to delete the protection mechanism.

    Which four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. dispose d'un coffre Recovery Services nommé **rsv-erp** dans un abonnement nommé **Sub-ERP**. Un administrateur de sauvegarde nommé **BackupAdmin1** gère rsv-erp. L'équipe de sécurité gère un abonnement distinct nommé **Sub-Sec** dans le même locataire.

    Vous devez configurer l'autorisation multi-utilisateur (MUA) pour que BackupAdmin1 ne puisse effectuer une opération critique sur rsv-erp, comme réduire la rétention, qu'après une autorisation temporaire de l'équipe de sécurité. BackupAdmin1 ne doit jamais pouvoir supprimer le mécanisme de protection.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: guard, text: { en: "The security team creates a Resource Guard in Sub-Sec.", fr: "L'équipe de sécurité crée un Resource Guard dans Sub-Sec." } }
    - { id: reader, text: { en: "The security team grants BackupAdmin1 the Reader role on the Resource Guard.", fr: "L'équipe de sécurité accorde à BackupAdmin1 le rôle Reader sur le Resource Guard." } }
    - { id: associate, text: { en: "BackupAdmin1 enables MUA on rsv-erp by associating the vault with the Resource Guard.", fr: "BackupAdmin1 active la MUA sur rsv-erp en associant le coffre au Resource Guard." } }
    - { id: operator, text: { en: "For each critical operation, the security team temporarily grants BackupAdmin1 the Backup MUA Operator role on the Resource Guard.", fr: "Pour chaque opération critique, l'équipe de sécurité accorde temporairement à BackupAdmin1 le rôle Backup MUA Operator sur le Resource Guard." } }
    - { id: admin, text: { en: "The security team grants BackupAdmin1 the Backup MUA Admin role on the Resource Guard.", fr: "L'équipe de sécurité accorde à BackupAdmin1 le rôle Backup MUA Admin sur le Resource Guard." } }
    - { id: contrib, text: { en: "The security team grants BackupAdmin1 the Contributor role on Sub-Sec.", fr: "L'équipe de sécurité accorde à BackupAdmin1 le rôle Contributor sur Sub-Sec." } }
answer:
  sequence: [ guard, reader, associate, operator ]
explanation:
  correct:
    en: |
      The security team creates the Resource Guard, ideally in another subscription, and gives the backup administrator Reader on it, which is required to enable MUA on the vault. The backup administrator then associates the vault with the guard. When a critical operation is needed, the security team grants Backup MUA Operator temporarily (for example through PIM); this role allows only the protected operations and not the deletion of the guard.
    fr: |
      L'équipe de sécurité crée le Resource Guard, idéalement dans un autre abonnement, et donne à l'administrateur de sauvegarde le rôle Reader sur celui-ci, nécessaire pour activer la MUA sur le coffre. L'administrateur de sauvegarde associe ensuite le coffre au Resource Guard. Quand une opération critique est nécessaire, l'équipe de sécurité accorde temporairement Backup MUA Operator (par exemple via PIM) ; ce rôle n'autorise que les opérations protégées, pas la suppression du Resource Guard.
  options:
    admin:
      en: Backup MUA Admin includes permissions to delete the Resource Guard, so the backup administrator could remove the protection.
      fr: "Backup MUA Admin inclut des autorisations de suppression du Resource Guard : l'administrateur de sauvegarde pourrait retirer la protection."
    contrib:
      en: Contributor on the subscription that holds the guard would let the backup administrator delete or change the Resource Guard.
      fr: Contributor sur l'abonnement qui contient le Resource Guard permettrait à l'administrateur de sauvegarde de le supprimer ou de le modifier.
references:
  - title: Multiuser authorization using Resource Guard
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
