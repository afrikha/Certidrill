id: sc500-cs1b-identity-roles
objective: "1.1.6"
type: dragdrop
caseStudy: sc500-cs1b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the identity requirements.

    Which role should you assign to each managed identity? To answer, drag the appropriate roles to the correct identities. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences relatives aux identités.

    Quel rôle devez-vous attribuer à chaque identité managée ? Pour répondre, faites glisser les rôles appropriés vers les identités correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: kvreader, text: Key Vault Reader }
    - { id: kvsecrets, text: Key Vault Secrets User }
    - { id: kvcertofficer, text: Key Vault Certificates Officer }
    - { id: blobreader, text: Storage Blob Data Reader }
    - { id: blobcontrib, text: Storage Blob Data Contributor }
    - { id: accountcontrib, text: Storage Account Contributor }
  targets:
    - { id: agw, text: { en: "id-agw-pw, on kv-pw-shop", fr: "id-agw-pw, sur kv-pw-shop" } }
    - { id: web, text: { en: "System-assigned identity of app-pw-shop, on stpwmedia", fr: "Identité affectée par le système de app-pw-shop, sur stpwmedia" } }
    - { id: func, text: { en: "System-assigned identity of func-pw-orders, on stpwuploads", fr: "Identité affectée par le système de func-pw-orders, sur stpwuploads" } }
answer:
  mapping: { agw: kvsecrets, web: blobreader, func: blobcontrib }
explanation:
  correct:
    en: |-
      Application Gateway retrieves the listener certificate, including its private key, as a secret, so its user-assigned identity needs Key Vault Secrets User on a vault that uses the Azure RBAC model. Storage Blob Data Reader lets the web app read blobs and nothing more. The function app must also move and delete blobs, which requires Storage Blob Data Contributor.
    fr: |-
      Application Gateway récupère le certificat de l'écouteur, clé privée comprise, en tant que secret : son identité affectée par l'utilisateur a donc besoin de Key Vault Secrets User sur un coffre qui utilise le modèle RBAC Azure. Storage Blob Data Reader permet à l'application web de lire les objets blob, sans plus. L'application de fonction doit aussi déplacer et supprimer des objets blob, ce qui exige Storage Blob Data Contributor.
  options:
    kvreader:
      en: |-
        Key Vault Reader reads only metadata and cannot read secret contents or the private key of a certificate.
      fr: |-
        Key Vault Reader ne lit que les métadonnées et ne peut lire ni le contenu des secrets ni la clé privée d'un certificat.
    kvcertofficer:
      en: |-
        Key Vault Certificates Officer can perform any action on certificates, which is more than reading the listener certificate.
      fr: |-
        Key Vault Certificates Officer peut effectuer toute action sur les certificats, ce qui dépasse la lecture du certificat de l'écouteur.
    accountcontrib:
      en: |-
        Storage Account Contributor manages the storage account resource, including its access keys; it is not a least privileged data role.
      fr: |-
        Storage Account Contributor gère la ressource compte de stockage, y compris ses clés d'accès ; ce n'est pas un rôle de données de moindre privilège.
references:
  - title: TLS termination with Key Vault certificates
    url: https://learn.microsoft.com/en-us/azure/application-gateway/key-vault-certs
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
