id: sc500-1c-bk-immutable-statements
objective: "1.3.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has two Recovery Services vaults that back up Azure virtual machines with a backup policy that keeps daily recovery points for 30 days:

    | Vault | Immutable vault setting |
    | --- | --- |
    | rsv-dev | Enabled (not locked) |
    | rsv-prod | Enabled and locked |

    Immutability is configured based on the backup policy. No Resource Guard is associated with the vaults.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose de deux coffres Recovery Services qui sauvegardent des machines virtuelles Azure avec une stratégie de sauvegarde qui conserve les points de récupération quotidiens pendant 30 jours :

    | Coffre | Paramètre de coffre immuable |
    | --- | --- |
    | rsv-dev | Enabled (non verrouillé) |
    | rsv-prod | Enabled and locked |

    L'immuabilité est configurée en fonction de la stratégie de sauvegarde. Aucun Resource Guard n'est associé aux coffres.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A backup administrator can disable immutability on rsv-dev.
        fr: Un administrateur de sauvegarde peut désactiver l'immuabilité sur rsv-dev.
    - id: s2
      text:
        en: A backup administrator can change the policy used by rsv-prod to keep daily recovery points for 90 days.
        fr: Un administrateur de sauvegarde peut modifier la stratégie utilisée par rsv-prod pour conserver les points de récupération quotidiens pendant 90 jours.
    - id: s3
      text:
        en: A backup administrator can stop protection of a virtual machine in rsv-prod and delete its recovery points immediately.
        fr: Un administrateur de sauvegarde peut arrêter la protection d'une machine virtuelle dans rsv-prod et supprimer immédiatement ses points de récupération.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      In the Enabled state, immutability blocks operations that could lose backups but can still be disabled; only locking it is irreversible. Even when locked, increasing policy retention is allowed. Stopping protection with deletion of data is blocked because recovery points can't be deleted before they expire; you can only stop protection and retain the data.
    fr: |
      À l'état Enabled, l'immuabilité bloque les opérations susceptibles de faire perdre des sauvegardes, mais peut encore être désactivée ; seul son verrouillage est irréversible. Même verrouillée, l'augmentation de la rétention de la stratégie reste permise. L'arrêt de la protection avec suppression des données est bloqué, car les points de récupération ne peuvent pas être supprimés avant leur expiration ; on peut seulement arrêter la protection en conservant les données.
references:
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
