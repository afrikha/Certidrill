id: sc500-1b-kva-sign-key
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has a key vault named **kv-fab-auth** that uses the Azure role-based access control (Azure RBAC) permission model. kv-fab-auth contains an RSA key named **token-signing**.

    A function app named **func-tokens** has a system-assigned managed identity. func-tokens must sign tokens with token-signing by calling the Key Vault sign operation. It must not create, delete or rotate keys. The solution must follow the principle of least privilege.

    Which role should you assign to the identity of func-tokens on kv-fab-auth?
  fr: |
    Fabrikam, Inc. dispose d'un coffre de clés nommé **kv-fab-auth** qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC). kv-fab-auth contient une clé RSA nommée **token-signing**.

    Une application de fonction nommée **func-tokens** dispose d'une identité managée affectée par le système. func-tokens doit signer des jetons avec token-signing en appelant l'opération de signature de Key Vault. Elle ne doit pas créer, supprimer ni faire pivoter de clés. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'identité de func-tokens sur kv-fab-auth ?
body:
  options:
    - { id: a, text: Key Vault Crypto Officer }
    - { id: b, text: Key Vault Crypto Service Encryption User }
    - { id: c, text: Key Vault Reader }
    - { id: d, text: Key Vault Crypto User }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Key Vault Crypto User performs cryptographic operations with keys, including sign and verify, encrypt and decrypt, and wrap and unwrap. It doesn't allow creating, deleting or rotating keys, so it is the least privileged role that meets the requirement.
    fr: |
      Key Vault Crypto User effectue des opérations de chiffrement avec les clés, dont la signature et la vérification, le chiffrement et le déchiffrement, l'enveloppement et le désenveloppement. Il ne permet pas de créer, supprimer ni faire pivoter des clés : c'est le rôle le moins privilégié qui répond à l'exigence.
  options:
    a:
      en: "Crypto Officer can perform any action on keys, including creating, deleting and rotating them, which exceeds the requirement."
      fr: "Crypto Officer peut effectuer toute action sur les clés, y compris les créer, les supprimer et les faire pivoter, ce qui dépasse l'exigence."
    b:
      en: "Crypto Service Encryption User only reads key metadata and performs wrap and unwrap; it can't sign."
      fr: "Crypto Service Encryption User lit seulement les métadonnées des clés et effectue l'enveloppement et le désenveloppement ; il ne peut pas signer."
    c:
      en: "Key Vault Reader reads metadata only and performs no cryptographic operation."
      fr: "Key Vault Reader lit seulement les métadonnées et n'effectue aucune opération de chiffrement."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
  - title: Azure built-in roles for Security
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/security
