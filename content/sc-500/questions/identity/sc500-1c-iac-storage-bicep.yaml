id: sc500-1c-iac-storage-bicep
objective: "1.3.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders deploys storage accounts with the following Bicep file. A private endpoint is deployed separately for each account.

    You need to complete the file so that every storage account it deploys meets the following requirements:

    - Clients must use TLS 1.2 or later.
    - Requests authorized with the account access keys or with SAS tokens signed by those keys are refused; only Microsoft Entra authorization is allowed.
    - The public endpoint refuses all traffic, even from selected networks.

    How should you complete the file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders déploie des comptes de stockage avec le fichier Bicep suivant. Un point de terminaison privé est déployé séparément pour chaque compte.

    Vous devez compléter le fichier pour que chaque compte de stockage déployé réponde aux exigences suivantes :

    - Les clients doivent utiliser TLS 1.2 ou une version ultérieure.
    - Les requêtes autorisées par les clés d'accès du compte ou par des jetons SAS signés avec ces clés sont refusées ; seule l'autorisation Microsoft Entra est permise.
    - Le point de terminaison public refuse tout le trafic, même depuis des réseaux sélectionnés.

    Comment devez-vous compléter le fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    param name string

    resource st 'Microsoft.Storage/storageAccounts@2023-05-01' = {
      name: name
      location: resourceGroup().location
      sku: { name: 'Standard_ZRS' }
      kind: 'StorageV2'
      properties: {
        minimumTlsVersion: [[tls]]
        supportsHttpsTrafficOnly: true
        allowBlobPublicAccess: false
        [[keyprop]]: false
        publicNetworkAccess: [[pna]]
      }
    }
  slots:
    - id: tls
      options:
        - { id: tls10, text: "'TLS1_0'" }
        - { id: tls11, text: "'TLS1_1'" }
        - { id: tls12, text: "'TLS1_2'" }
    - id: keyprop
      options:
        - { id: oauth, text: defaultToOAuthAuthentication }
        - { id: sharedkey, text: allowSharedKeyAccess }
        - { id: crosstenant, text: allowCrossTenantReplication }
    - id: pna
      options:
        - { id: enabled, text: "'Enabled'" }
        - { id: perimeter, text: "'SecuredByPerimeter'" }
        - { id: disabled, text: "'Disabled'" }
answer:
  values: { tls: tls12, keyprop: sharedkey, pna: disabled }
explanation:
  correct:
    en: |
      `minimumTlsVersion: 'TLS1_2'` rejects older protocol versions. `allowSharedKeyAccess: false` refuses every request authorized with the account keys, including account and service SAS tokens, so only Microsoft Entra ID (and user delegation SAS) remains. `publicNetworkAccess: 'Disabled'` blocks the public endpoint whatever the firewall rules, leaving access through the private endpoint.
    fr: |
      `minimumTlsVersion: 'TLS1_2'` rejette les versions de protocole antérieures. `allowSharedKeyAccess: false` refuse toute requête autorisée par les clés du compte, y compris les jetons SAS de compte et de service : seule Microsoft Entra ID (et la SAS de délégation d'utilisateur) reste possible. `publicNetworkAccess: 'Disabled'` bloque le point de terminaison public quelles que soient les règles de pare-feu, l'accès passant par le point de terminaison privé.
  options:
    tls10: { en: "TLS1_0 would allow TLS 1.0 and later.", fr: "TLS1_0 autoriserait TLS 1.0 et les versions ultérieures." }
    tls11: { en: "TLS1_1 would allow TLS 1.1 and later.", fr: "TLS1_1 autoriserait TLS 1.1 et les versions ultérieures." }
    oauth: { en: "defaultToOAuthAuthentication only makes Microsoft Entra the default in the portal; keys still work.", fr: "defaultToOAuthAuthentication fait seulement de Microsoft Entra l'option par défaut dans le portail ; les clés fonctionnent toujours." }
    crosstenant: { en: "allowCrossTenantReplication controls object replication across tenants, not key-based authorization.", fr: "allowCrossTenantReplication contrôle la réplication d'objets entre locataires, pas l'autorisation par clé." }
    enabled: { en: "Enabled keeps the public endpoint reachable according to the firewall rules.", fr: "Enabled laisse le point de terminaison public accessible selon les règles de pare-feu." }
    perimeter: { en: "SecuredByPerimeter delegates access control to a network security perimeter, which the requirements don't mention.", fr: "SecuredByPerimeter délègue le contrôle d'accès à un périmètre de sécurité réseau, que les exigences ne mentionnent pas." }
references:
  - title: Microsoft.Storage storageAccounts
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.storage/storageaccounts
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
