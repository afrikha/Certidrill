id: sc500-1b-kvf-portal-list
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a key vault named **kv-nw-pay**. The firewall of kv-nw-pay allows access only from a subnet named **snet-pay** and from no IP address.

    An administrator named **Admin1** has the Key Vault Administrator role on kv-nw-pay. When Admin1 works from home, Admin1 can open kv-nw-pay in the Azure portal, but the **Secrets** page doesn't list any secret and shows an access error.

    You need to ensure that Admin1 can manage the secrets from home. Access from other networks must stay blocked.

    What should you do?
  fr: |
    Northwind Traders dispose d'un coffre de clés nommé **kv-nw-pay**. Le pare-feu de kv-nw-pay n'autorise l'accès que depuis un sous-réseau nommé **snet-pay** et depuis aucune adresse IP.

    Un administrateur nommé **Admin1** a le rôle Key Vault Administrator sur kv-nw-pay. Quand Admin1 travaille depuis son domicile, il peut ouvrir kv-nw-pay dans le portail Azure, mais la page **Secrets** n'affiche aucun secret et indique une erreur d'accès.

    Vous devez vous assurer qu'Admin1 peut gérer les secrets depuis son domicile. L'accès depuis les autres réseaux doit rester bloqué.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Admin1 the Key Vault Contributor role on kv-nw-pay.", fr: "Attribuer à Admin1 le rôle Key Vault Contributor sur kv-nw-pay." } }
    - { id: b, text: { en: "Select Allow trusted Microsoft services to bypass this firewall.", fr: "Sélectionner Allow trusted Microsoft services to bypass this firewall." } }
    - { id: c, text: { en: "Add the public IP address of Admin1's home connection to the firewall.", fr: "Ajouter l'adresse IP publique de la connexion du domicile d'Admin1 au pare-feu." } }
    - { id: d, text: { en: "Assign Admin1 the Key Vault Reader role on kv-nw-pay.", fr: "Attribuer à Admin1 le rôle Key Vault Reader sur kv-nw-pay." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The portal is a data plane client of Key Vault: opening the vault uses the control plane, but listing secrets sends requests from the administrator's own machine to vault.azure.net, which the firewall rejects. Adding the public IP address of that connection as an IP rule admits Admin1 without opening the vault to other networks.
    fr: |
      Le portail est un client du plan de données de Key Vault : ouvrir le coffre passe par le plan de contrôle, mais lister les secrets envoie des requêtes depuis la machine de l'administrateur vers vault.azure.net, que le pare-feu rejette. Ajouter l'adresse IP publique de cette connexion comme règle IP admet Admin1 sans ouvrir le coffre aux autres réseaux.
  options:
    a:
      en: "Admin1 is already authorized on the data plane; Key Vault Contributor adds control plane rights and doesn't change the firewall decision."
      fr: "Admin1 est déjà autorisé dans le plan de données ; Key Vault Contributor ajoute des droits du plan de contrôle et ne change pas la décision du pare-feu."
    b:
      en: "The exception applies only to listed Azure services, not to users connecting through the portal."
      fr: "L'exception ne s'applique qu'aux services Azure de la liste, pas aux utilisateurs qui se connectent via le portail."
    d:
      en: "The problem isn't authorization, and Key Vault Reader would grant less than Admin1 already has."
      fr: "Le problème n'est pas l'autorisation, et Key Vault Reader accorderait moins que ce qu'Admin1 possède déjà."
references:
  - title: Configure network security for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/network-security
