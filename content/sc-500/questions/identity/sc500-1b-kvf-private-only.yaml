id: sc500-1b-kvf-private-only
objective: "1.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has a key vault named **kv-adt-core** that currently allows public access from all networks. Virtual machines in a virtual network named **vnet-app** (10.1.0.0/16) use kv-adt-core. Azure Backup backs up encrypted virtual machines whose keys are stored in kv-adt-core.

    You need to meet the following requirements:

    - The virtual machines in vnet-app must reach kv-adt-core by using a private IP address.
    - kv-adt-core must reject every request that comes from a public network.
    - Azure Backup must keep working.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un coffre de clés nommé **kv-adt-core** qui autorise actuellement l'accès public depuis tous les réseaux. Des machines virtuelles d'un réseau virtuel nommé **vnet-app** (10.1.0.0/16) utilisent kv-adt-core. Sauvegarde Azure sauvegarde des machines virtuelles chiffrées dont les clés sont stockées dans kv-adt-core.

    Vous devez répondre aux exigences suivantes :

    - Les machines virtuelles de vnet-app doivent atteindre kv-adt-core par une adresse IP privée.
    - kv-adt-core doit rejeter toute requête provenant d'un réseau public.
    - Sauvegarde Azure doit continuer à fonctionner.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a private endpoint for kv-adt-core in vnet-app.", fr: "Créer un point de terminaison privé pour kv-adt-core dans vnet-app." } }
    - { id: b, text: { en: "Enable the Microsoft.KeyVault service endpoint on the vnet-app subnets and add them as virtual network rules.", fr: "Activer le point de terminaison de service Microsoft.KeyVault sur les sous-réseaux de vnet-app et les ajouter comme règles de réseau virtuel." } }
    - { id: c, text: { en: "Set Allow access from to Disable public access.", fr: "Définir Allow access from sur Disable public access." } }
    - { id: d, text: { en: "Clear Allow trusted Microsoft services to bypass this firewall.", fr: "Désélectionner Allow trusted Microsoft services to bypass this firewall." } }
    - { id: e, text: { en: "Add 10.1.0.0/16 to the IP address rules of kv-adt-core.", fr: "Ajouter 10.1.0.0/16 aux règles d'adresses IP de kv-adt-core." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A private endpoint gives kv-adt-core a private IP address in vnet-app. Disabling public access then allows only private endpoint connections. The trusted services exception, which stays selected, still lets Azure Backup reach the vault without a private endpoint.
    fr: |
      Un point de terminaison privé donne à kv-adt-core une adresse IP privée dans vnet-app. Désactiver l'accès public n'autorise ensuite que les connexions par point de terminaison privé. L'exception des services approuvés, qui reste sélectionnée, permet toujours à Sauvegarde Azure d'atteindre le coffre sans point de terminaison privé.
  options:
    b:
      en: "With a service endpoint, the VMs still connect to the vault's public endpoint, not to a private IP address."
      fr: "Avec un point de terminaison de service, les VM se connectent toujours au point de terminaison public du coffre, pas à une adresse IP privée."
    d:
      en: "Removing the exception would block Azure Backup."
      fr: "Supprimer l'exception bloquerait Sauvegarde Azure."
    e:
      en: "Key Vault IP rules accept only public addresses; private ranges are rejected."
      fr: "Les règles IP de Key Vault n'acceptent que des adresses publiques ; les plages privées sont refusées."
references:
  - title: Configure network security for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/network-security
