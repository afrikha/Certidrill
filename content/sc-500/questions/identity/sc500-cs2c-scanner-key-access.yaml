id: sc500-cs2c-scanner-key-access
objective: "1.2.3"
type: single
caseStudy: sc500-cs2c-margies-travel
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the agentless scanning requirement for vm-pay01 and vm-pay02. What should you do?
  fr: |
    Vous devez respecter l'exigence d'analyse sans agent pour vm-pay01 et vm-pay02. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an access policy to kv-travel that grants Get, Wrap Key and Unwrap Key to Microsoft Defender for Cloud Servers Scanner Resource Provider", fr: "Ajouter à kv-travel une stratégie d'accès qui accorde Get, Wrap Key et Unwrap Key à Microsoft Defender for Cloud Servers Scanner Resource Provider" } }
    - { id: b, text: { en: "Assign the Key Vault Crypto Service Encryption User role on kv-travel to Microsoft Defender for Cloud Servers Scanner Resource Provider", fr: "Attribuer le rôle Key Vault Crypto Service Encryption User sur kv-travel à Microsoft Defender for Cloud Servers Scanner Resource Provider" } }
    - { id: c, text: { en: "Assign the Key Vault Crypto Officer role on kv-travel to Microsoft Defender for Cloud Servers Scanner Resource Provider", fr: "Attribuer le rôle Key Vault Crypto Officer sur kv-travel à Microsoft Defender for Cloud Servers Scanner Resource Provider" } }
    - { id: d, text: { en: "Assign the Key Vault Crypto Service Encryption User role on kv-travel to system-assigned managed identities of vm-pay01 and vm-pay02", fr: "Attribuer le rôle Key Vault Crypto Service Encryption User sur kv-travel à des identités managées affectées par le système de vm-pay01 et vm-pay02" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Agentless scanning copies disk snapshots, so for disks encrypted with customer-managed keys the scanner needs access to the keys. The scanning service is the Microsoft Defender for Cloud Servers Scanner Resource Provider application. Because kv-travel uses the Azure RBAC permission model, you grant it the Key Vault Crypto Service Encryption User role, which reads key metadata and performs wrap and unwrap operations only.
    fr: |
      L'analyse sans agent copie des instantanés de disques : pour les disques chiffrés avec des clés gérées par le client, l'analyseur doit accéder aux clés. Le service d'analyse est l'application Microsoft Defender for Cloud Servers Scanner Resource Provider. Comme kv-travel utilise le modèle d'autorisation RBAC Azure, vous lui attribuez le rôle Key Vault Crypto Service Encryption User, qui lit seulement les métadonnées des clés et effectue les opérations d'encapsulage et de désencapsulage.
  options:
    a: { en: "Access policies are the method for vaults that use the access policy permission model; kv-travel uses Azure RBAC, so access policies don't grant anything.", fr: "Les stratégies d'accès sont la méthode des coffres qui utilisent le modèle d'autorisation par stratégie d'accès ; kv-travel utilise le RBAC Azure, donc les stratégies d'accès n'accordent rien." }
    c: { en: "Key Vault Crypto Officer can perform any action on keys, which is far more than the wrap and unwrap operations the scanner needs.", fr: "Key Vault Crypto Officer peut effectuer toute action sur les clés, ce qui dépasse largement les opérations d'encapsulage et de désencapsulage dont l'analyseur a besoin." }
    d: { en: "The scan is performed by the Defender for Cloud scanner, not from inside the VMs, so the VM identities don't need key access.", fr: "L'analyse est effectuée par l'analyseur de Defender for Cloud, pas depuis l'intérieur des machines virtuelles : les identités des machines virtuelles n'ont pas besoin d'accéder aux clés." }
references:
  - title: Enable agentless machine scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-agentless-scanning-vms
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
