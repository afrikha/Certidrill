seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You use a Resource Guard in North Europe in SubSec.
  fr: Vous utilisez une protection des ressources (Resource Guard) dans North Europe dans SubSec.
body:
  solution:
    en: |
      A member of SecOps performs the following actions:

      - Creates a Resource Guard named **RG-Backup** in SubSec in the **North Europe** region and keeps all the protected operations enabled.
      - Assigns the **Reader** role on RG-Backup to BackupAdmins.
      - In Microsoft Entra Privileged Identity Management (PIM), creates an **Eligible** assignment of the **Backup MUA Operator** role on RG-Backup for BackupAdmins, with SecOps as approvers.

      A member of BackupAdmins then opens RSV1, selects **Properties** > **Multi-User Authorization** > **Update**, and selects RG-Backup.
    fr: |
      Un membre de SecOps effectue les actions suivantes :

      - Il crée une protection des ressources (Resource Guard) nommée **RG-Backup** dans SubSec dans la région **North Europe** et conserve toutes les opérations protégées activées.
      - Il attribue le rôle **Reader** sur RG-Backup à BackupAdmins.
      - Dans Microsoft Entra Privileged Identity Management (PIM), il crée une attribution **Eligible** du rôle **Backup MUA Operator** sur RG-Backup pour BackupAdmins, avec SecOps comme approbateurs.

      Un membre de BackupAdmins ouvre ensuite RSV1, sélectionne **Properties** > **Multi-User Authorization** > **Update** et sélectionne RG-Backup.
answer: { value: true }
explanation:
  correct:
    en: The Resource Guard is in the same region as RSV1, and Reader on it is enough to associate the vault. Disabling soft delete is always protected, and reducing retention or deleting protection stays protected because all operations are kept. A backup administrator must activate the eligible Backup MUA Operator role, SecOps approves it, and PIM removes it when the period ends; Reader and Backup MUA Operator do not allow deleting the Resource Guard.
    fr: "La protection des ressources est dans la même région que RSV1, et le rôle Reader sur celle-ci suffit pour associer le coffre. La désactivation de la suppression réversible est toujours protégée, et la réduction de la rétention ou la suppression de la protection le restent car toutes les opérations sont conservées. Un administrateur de sauvegarde doit activer le rôle éligible Backup MUA Operator, SecOps l'approuve et PIM le retire à la fin de la période ; Reader et Backup MUA Operator ne permettent pas de supprimer la protection des ressources."
