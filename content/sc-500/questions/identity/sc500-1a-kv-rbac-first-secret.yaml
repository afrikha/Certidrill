id: sc500-1a-kv-rbac-first-secret
objective: "1.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a resource group named **RG1**. An administrator named Admin1 has the Owner role on RG1 and no other role assignment.

    Admin1 must deploy a key vault named **kv-adatum-01** in RG1 that uses the Azure role-based access control permission model, and then store a secret named **DbPassword** in it. The solution must follow the principle of least privilege.

    Which three actions should Admin1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation dispose d'un groupe de ressources nommé **RG1**. Un administrateur nommé Admin1 a le rôle Owner sur RG1 et aucune autre attribution de rôle.

    Admin1 doit déployer dans RG1 un coffre de clés nommé **kv-adatum-01** qui utilise le modèle d'autorisation contrôle d'accès en fonction du rôle Azure, puis y stocker un secret nommé **DbPassword**. La solution doit respecter le principe du moindre privilège.

    Quelles sont les trois actions qu'Admin1 doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create kv-adatum-01 with the Azure role-based access control permission model.", fr: "Créer kv-adatum-01 avec le modèle d'autorisation contrôle d'accès en fonction du rôle Azure." } }
    - { id: officer, text: { en: "Assign the Key Vault Secrets Officer role on kv-adatum-01 to Admin1.", fr: "Attribuer le rôle Key Vault Secrets Officer sur kv-adatum-01 à Admin1." } }
    - { id: secret, text: { en: "Create the DbPassword secret.", fr: "Créer le secret DbPassword." } }
    - { id: policy, text: { en: "Add an access policy that grants Admin1 the Set permission on secrets.", fr: "Ajouter une stratégie d'accès qui accorde à Admin1 l'autorisation Set sur les secrets." } }
    - { id: contrib, text: { en: "Assign the Key Vault Contributor role on kv-adatum-01 to Admin1.", fr: "Attribuer le rôle Key Vault Contributor sur kv-adatum-01 à Admin1." } }
    - { id: admin, text: { en: "Assign the Key Vault Administrator role on RG1 to Admin1.", fr: "Attribuer le rôle Key Vault Administrator sur RG1 à Admin1." } }
answer:
  sequence: [ create, officer, secret ]
explanation:
  correct:
    en: |
      The Owner role manages the vault and role assignments but includes no data actions, so Admin1 cannot write secrets until a data-plane role is assigned. Once the vault exists, Admin1 can use the Owner permissions to assign Key Vault Secrets Officer at the vault scope, which allows any action on secrets except managing permissions, and then create the secret.
    fr: |
      Le rôle Owner gère le coffre et les attributions de rôles mais n'inclut aucune action sur les données : Admin1 ne peut pas écrire de secrets tant qu'un rôle de plan de données ne lui est pas attribué. Une fois le coffre créé, Admin1 utilise ses autorisations Owner pour s'attribuer Key Vault Secrets Officer dans l'étendue du coffre, qui permet toute action sur les secrets sauf la gestion des autorisations, puis crée le secret.
  options:
    policy:
      en: |
        Access policies are ignored by vaults that use the Azure RBAC permission model.
      fr: |
        Les stratégies d'accès sont ignorées par les coffres qui utilisent le modèle d'autorisation Azure RBAC.
    contrib:
      en: |
        Key Vault Contributor is a control-plane role and gives no access to secrets.
      fr: |
        Key Vault Contributor est un rôle de plan de contrôle et ne donne aucun accès aux secrets.
    admin:
      en: |
        Key Vault Administrator on RG1 grants all data-plane operations on every vault in the resource group, which exceeds least privilege.
      fr: |
        Key Vault Administrator sur RG1 accorde toutes les opérations de plan de données sur tous les coffres du groupe de ressources, ce qui dépasse le moindre privilège.
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
