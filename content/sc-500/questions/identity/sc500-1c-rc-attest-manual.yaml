id: sc500-1c-rc-attest-manual
objective: "1.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has the **ISO/IEC 27001** standard assigned to an Azure subscription named **Sub-HR** in Microsoft Defender for Cloud. One control of the standard requires a documented incident response procedure. Defender for Cloud cannot assess it automatically.

    The compliance officer gives you the approved procedure as a PDF file. You need to record on the **Regulatory compliance** dashboard that Sub-HR meets this control, with the file as evidence.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation a attribué la norme **ISO/IEC 27001** à un abonnement Azure nommé **Sub-HR** dans Microsoft Defender for Cloud. Un contrôle de la norme exige une procédure documentée de réponse aux incidents. Defender for Cloud ne peut pas l'évaluer automatiquement.

    Le responsable de la conformité vous remet la procédure approuvée sous forme de fichier PDF. Vous devez enregistrer dans le tableau de bord **Regulatory compliance** que Sub-HR satisfait ce contrôle, avec le fichier comme preuve.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open **Regulatory compliance**, select ISO/IEC 27001 and expand the control.", fr: "Ouvrir **Regulatory compliance**, sélectionner ISO/IEC 27001 et développer le contrôle." } }
    - { id: select, text: { en: "Under **Manual attestation and evidence**, select the assessment.", fr: "Sous **Manual attestation and evidence**, sélectionner l'évaluation." } }
    - { id: sub, text: { en: "Select Sub-HR as the subscription to attest, and then select **Attest**.", fr: "Sélectionner Sub-HR comme abonnement à attester, puis sélectionner **Attest**." } }
    - { id: save, text: { en: "Enter the attestation details, attach the PDF file, and then select **Save**.", fr: "Saisir les détails de l'attestation, joindre le fichier PDF, puis sélectionner **Save**." } }
    - { id: exempt, text: { en: "Create an exemption with the **Resolved through third-party service (mitigated)** category.", fr: "Créer une exemption avec la catégorie **Resolved through third-party service (mitigated)**." } }
    - { id: download, text: { en: "Select **Download report** and attach the PDF file to the report.", fr: "Sélectionner **Download report** et joindre le fichier PDF au rapport." } }
answer:
  sequence: [ open, select, sub, save ]
explanation:
  correct:
    en: |
      Controls that need customer input are manual assessments. You expand the control on the Regulatory compliance dashboard, select the assessment under Manual attestation and evidence, choose the subscriptions and select Attest, then fill in the details, attach the evidence and save.
    fr: |
      Les contrôles qui nécessitent une intervention du client sont des évaluations manuelles. Vous développez le contrôle dans le tableau de bord Regulatory compliance, sélectionnez l'évaluation sous Manual attestation and evidence, choisissez les abonnements et sélectionnez Attest, puis saisissez les détails, joignez la preuve et enregistrez.
  options:
    exempt:
      en: An exemption applies to recommendations and their resources; it does not attest a manual compliance control with evidence.
      fr: Une exemption s'applique aux recommandations et à leurs ressources ; elle n'atteste pas un contrôle de conformité manuel avec une preuve.
    download:
      en: Download report generates a summary of the current status; you cannot attach evidence to it to change a control's state.
      fr: Download report génère un résumé de l'état actuel ; vous ne pouvez pas y joindre de preuve pour changer l'état d'un contrôle.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
