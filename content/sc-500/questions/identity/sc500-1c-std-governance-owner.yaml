id: sc500-1c-std-governance-owner
objective: "1.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has an Azure subscription named **Sub-Apps**. Microsoft Defender for Cloud uses foundational CSPM only on Sub-Apps; no paid plan is enabled. Every resource in Sub-Apps has a tag named **SecOwner** that contains the email address of the person responsible for it.

    You need to ensure that each new high-severity recommendation on Sub-Apps is assigned to the person in the SecOwner tag of the affected resource, with a due date 14 days later, and that these people receive a weekly email listing their on-time and overdue tasks.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un abonnement Azure nommé **Sub-Apps**. Microsoft Defender for Cloud n'utilise que la CSPM fondamentale sur Sub-Apps ; aucun plan payant n'est activé. Chaque ressource de Sub-Apps possède une étiquette nommée **SecOwner** qui contient l'adresse e-mail de la personne qui en est responsable.

    Vous devez faire en sorte que chaque nouvelle recommandation de gravité élevée sur Sub-Apps soit attribuée à la personne indiquée dans l'étiquette SecOwner de la ressource concernée, avec une échéance à 14 jours, et que ces personnes reçoivent chaque semaine un e-mail listant leurs tâches dans les délais et en retard.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a workflow automation that runs a logic app for new high-severity recommendations.", fr: "Créer une automatisation de workflow qui exécute une application logique pour les nouvelles recommandations de gravité élevée." } }
    - { id: b, text: { en: "Assign the Security Admin role on Sub-Apps to every person listed in a SecOwner tag.", fr: "Attribuer le rôle Security Admin sur Sub-Apps à chaque personne indiquée dans une étiquette SecOwner." } }
    - { id: c, text: { en: "Enable the Defender CSPM plan on Sub-Apps.", fr: "Activer le plan Defender CSPM sur Sub-Apps." } }
    - { id: d, text: { en: "Create a governance rule that sets the owner by resource tag, using SecOwner, with a 14-day remediation time frame.", fr: "Créer une règle de gouvernance qui définit le propriétaire par étiquette de ressource, avec SecOwner, et un délai de correction de 14 jours." } }
    - { id: e, text: { en: "Create an exemption with an expiration date 14 days later for each high-severity recommendation.", fr: "Créer une exemption expirant 14 jours plus tard pour chaque recommandation de gravité élevée." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Governance rules require the Defender CSPM plan, which foundational CSPM does not include. A governance rule can set the owner by resource tag or by email address, choose a time frame of 7, 14, 30 or 90 days for the due date, and by default sends weekly emails to owners with their on-time and overdue tasks.
    fr: |
      Les règles de gouvernance nécessitent le plan Defender CSPM, que la CSPM fondamentale n'inclut pas. Une règle de gouvernance peut définir le propriétaire par étiquette de ressource ou par adresse e-mail, choisir un délai de 7, 14, 30 ou 90 jours pour l'échéance, et envoie par défaut aux propriétaires des e-mails hebdomadaires listant leurs tâches dans les délais et en retard.
  options:
    a:
      en: A logic app could send messages, but it would need custom code to read tags, track due dates and build weekly digests, which governance rules provide natively.
      fr: Une application logique pourrait envoyer des messages, mais il faudrait du code personnalisé pour lire les étiquettes, suivre les échéances et produire des récapitulatifs hebdomadaires, ce que les règles de gouvernance font nativement.
    b:
      en: A role assignment neither assigns recommendations nor sets due dates; granting Security Admin to all these people also breaks least privilege.
      fr: Une attribution de rôle n'attribue pas les recommandations et ne fixe pas d'échéance ; accorder Security Admin à toutes ces personnes enfreint en outre le principe du moindre privilège.
    e:
      en: An exemption hides the finding instead of assigning it to someone for remediation.
      fr: Une exemption masque le résultat au lieu de l'attribuer à quelqu'un pour correction.
references:
  - title: Drive recommendation remediation by using governance rules
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/governance-rules
