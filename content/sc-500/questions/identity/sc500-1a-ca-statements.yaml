id: sc500-1a-ca-statements
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Entra tenant with Microsoft Entra ID P2 licenses. You are designing the Conditional Access policies of the tenant.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P2. Vous concevez les stratégies d'accès conditionnel du locataire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Conditional Access policies are enforced after the first authentication factor is completed.
        fr: |
          Les stratégies d'accès conditionnel sont appliquées une fois le premier facteur d'authentification effectué.
    - id: s2
      text:
        en: |
          In a single policy, you can select both Require multifactor authentication and Require authentication strength as grant controls.
        fr: |
          Dans une même stratégie, vous pouvez sélectionner à la fois Require multifactor authentication et Require authentication strength comme contrôles d'octroi.
    - id: s3
      text:
        en: |
          A policy that uses the sign-in risk condition relies on Microsoft Entra ID Protection, a Microsoft Entra ID P2 feature.
        fr: |
          Une stratégie qui utilise la condition de risque de connexion s'appuie sur Microsoft Entra ID Protection, une fonctionnalité de Microsoft Entra ID P2.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Conditional Access is evaluated after first-factor authentication, which is why it is not a defense against attacks such as denial of service. The built-in Multifactor authentication strength is equivalent to Require multifactor authentication, so the two grant controls cannot be combined in the same policy. Sign-in risk and user risk policies require ID Protection, which is a P2 feature.
    fr: |
      L'accès conditionnel est évalué après l'authentification du premier facteur ; ce n'est donc pas une défense contre des attaques comme le déni de service. La force intégrée Multifactor authentication équivaut à Require multifactor authentication : les deux contrôles d'octroi ne peuvent pas être combinés dans la même stratégie. Les stratégies de risque de connexion et de risque utilisateur exigent ID Protection, qui est une fonctionnalité P2.
references:
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
  - title: Overview of Conditional Access authentication strengths
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-strengths
