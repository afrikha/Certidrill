id: sc500-1b-kva-statements
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a key vault named **kv-tt-web** that uses the Azure role-based access control (Azure RBAC) permission model. kv-tt-web contains secrets and a TLS certificate named **cert-shop** whose key is exportable.

    The following role assignments exist at the kv-tt-web scope:

    | Principal | Role |
    | --- | --- |
    | User1 | Key Vault Administrator |
    | App1 (managed identity) | Key Vault Secrets User |
    | User2 | Key Vault Contributor |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un coffre de clés nommé **kv-tt-web** qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC). kv-tt-web contient des secrets et un certificat TLS nommé **cert-shop** dont la clé est exportable.

    Les attributions de rôles suivantes existent dans l'étendue de kv-tt-web :

    | Principal | Rôle |
    | --- | --- |
    | User1 | Key Vault Administrator |
    | App1 (identité managée) | Key Vault Secrets User |
    | User2 | Key Vault Contributor |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "User1 can assign the Key Vault Secrets User role on kv-tt-web to another user."
        fr: "User1 peut attribuer le rôle Key Vault Secrets User sur kv-tt-web à un autre utilisateur."
    - id: s2
      text:
        en: "App1 can retrieve cert-shop with its private key from the secret that has the same name as the certificate."
        fr: "App1 peut récupérer cert-shop avec sa clé privée à partir du secret qui porte le même nom que le certificat."
    - id: s3
      text:
        en: "User2 can read the values of the secrets in kv-tt-web from the Azure portal."
        fr: "User2 peut lire les valeurs des secrets de kv-tt-web depuis le portail Azure."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Key Vault Administrator performs all data plane operations but can't manage role assignments. Key Vault Secrets User reads secret contents, including the secret portion of a certificate with a private key, which is how the exportable certificate is retrieved. Key Vault Contributor is a control plane role: it manages the vault resource but grants no access to secret values in a vault that uses Azure RBAC.
    fr: |
      Key Vault Administrator effectue toutes les opérations du plan de données mais ne peut pas gérer les attributions de rôles. Key Vault Secrets User lit le contenu des secrets, y compris la partie secrète d'un certificat avec clé privée, ce qui permet de récupérer le certificat exportable. Key Vault Contributor est un rôle du plan de contrôle : il gère la ressource coffre mais n'accorde aucun accès aux valeurs des secrets dans un coffre qui utilise Azure RBAC.
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
  - title: About Azure Key Vault certificates
    url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
