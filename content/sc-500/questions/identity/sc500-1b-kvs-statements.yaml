id: sc500-1b-kvs-statements
objective: "1.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a key vault named **kv-wt-shop** that was created last month. Soft delete is enabled with a 60-day retention period, and purge protection is enabled. kv-wt-shop contains a secret named **PaymentApiKey**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un coffre de clés nommé **kv-wt-shop** créé le mois dernier. La suppression réversible est activée avec une période de rétention de 60 jours, et la protection contre le vidage est activée. kv-wt-shop contient un secret nommé **PaymentApiKey**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "You can disable soft delete on kv-wt-shop if you first disable purge protection."
        fr: "Vous pouvez désactiver la suppression réversible sur kv-wt-shop si vous désactivez d'abord la protection contre le vidage."
    - id: s2
      text:
        en: "If PaymentApiKey is deleted, a deployment can immediately create a new secret named PaymentApiKey in kv-wt-shop."
        fr: "Si PaymentApiKey est supprimé, un déploiement peut créer immédiatement un nouveau secret nommé PaymentApiKey dans kv-wt-shop."
    - id: s3
      text:
        en: "If PaymentApiKey is deleted, a user with the recover permission can restore it during the 60-day retention period."
        fr: "Si PaymentApiKey est supprimé, un utilisateur disposant de l'autorisation de récupération peut le restaurer pendant la période de rétention de 60 jours."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Soft delete can't be disabled once enabled, and purge protection can't be turned off either. A soft-deleted object keeps its name reserved in the vault until it is recovered or purged, so a new secret with the same name can't be created meanwhile. Purge protection blocks purging, not recovery: the secret stays recoverable until the retention period ends.
    fr: |
      La suppression réversible ne peut plus être désactivée une fois activée, et la protection contre le vidage non plus. Un objet supprimé de manière réversible garde son nom réservé dans le coffre jusqu'à sa récupération ou son vidage : un nouveau secret du même nom ne peut donc pas être créé entre-temps. La protection contre le vidage bloque le vidage, pas la récupération : le secret reste récupérable jusqu'à la fin de la période de rétention.
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
