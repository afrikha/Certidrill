id: sc500-1b-dkv-statements
objective: "1.2.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a subscription named **Sub1** that contains key vaults used by several teams. You turn on the Key Vault plan in the Defender plans of Sub1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un abonnement nommé **Sub1** qui contient des coffres de clés utilisés par plusieurs équipes. Vous activez le plan Key Vault dans les plans Defender de Sub1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A key vault that a team creates in Sub1 next month is protected without any additional configuration."
        fr: "Un coffre de clés qu'une équipe crée dans Sub1 le mois prochain est protégé sans configuration supplémentaire."
    - id: s2
      text:
        en: "You can turn off the plan for a single key vault of Sub1 while it stays on for the other vaults."
        fr: "Vous pouvez désactiver le plan pour un seul coffre de clés de Sub1 tout en le laissant actif pour les autres coffres."
    - id: s3
      text:
        en: "An alert triggered by an application that accessed a vault includes an object ID but no user principal name (UPN)."
        fr: "Une alerte déclenchée par une application qui a accédé à un coffre contient un ID d'objet mais aucun nom d'utilisateur principal (UPN)."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Defender for Key Vault is enabled at the subscription level: existing vaults are covered immediately and vaults created later are protected automatically, and there is no per-vault toggle. An alert identifies the object ID and the UPN or IP address of the source, but some fields can be missing: access by an application has no UPN, and traffic from outside Azure has no object ID.
    fr: |
      Defender for Key Vault s'active au niveau de l'abonnement : les coffres existants sont couverts immédiatement et les coffres créés ensuite sont protégés automatiquement, sans bascule par coffre. Une alerte identifie l'ID d'objet et l'UPN ou l'adresse IP de la source, mais certains champs peuvent manquer : un accès par une application n'a pas d'UPN, et un trafic venant de l'extérieur d'Azure n'a pas d'ID d'objet.
references:
  - title: Overview of Microsoft Defender for Key Vault
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-key-vault-introduction
  - title: Protect your key vaults with Defender for Key Vault
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-key-vault-plan
