id: sc500-1b-kvo-cert-autorenew
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a key vault named **kv-cts-tls**. A publicly trusted TLS certificate named **www-contoso** was purchased from a certificate authority (CA) that isn't integrated with Key Vault, and was imported into kv-cts-tls. Contoso has an account with DigiCert.

    You need to ensure that the certificate for www.contoso.com is renewed automatically before it expires, with no manual step. The certificate must remain publicly trusted.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un coffre de clés nommé **kv-cts-tls**. Un certificat TLS approuvé publiquement nommé **www-contoso** a été acheté auprès d'une autorité de certification (CA) non intégrée à Key Vault, puis importé dans kv-cts-tls. Contoso dispose d'un compte chez DigiCert.

    Vous devez vous assurer que le certificat de www.contoso.com est renouvelé automatiquement avant son expiration, sans aucune étape manuelle. Le certificat doit rester approuvé publiquement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a lifetime action of type AutoRenew, triggered 30 days before expiry, to the policy of www-contoso.", fr: "Ajouter une action de durée de vie de type AutoRenew, déclenchée 30 jours avant l'expiration, à la stratégie de www-contoso." } }
    - { id: b, text: { en: "Create a DigiCert issuer in kv-cts-tls, and create the certificate with that issuer and an AutoRenew lifetime action.", fr: "Créer un émetteur DigiCert dans kv-cts-tls, puis créer le certificat avec cet émetteur et une action de durée de vie AutoRenew." } }
    - { id: c, text: { en: "Create a self-signed certificate for www.contoso.com with an AutoRenew lifetime action.", fr: "Créer un certificat auto-signé pour www.contoso.com avec une action de durée de vie AutoRenew." } }
    - { id: d, text: { en: "Add certificate contacts to kv-cts-tls and an EmailContacts lifetime action to the policy of www-contoso.", fr: "Ajouter des contacts de certificat à kv-cts-tls et une action de durée de vie EmailContacts à la stratégie de www-contoso." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Key Vault renews certificates end to end only when they come from an integrated CA (DigiCert or GlobalSign) or are self-signed. After the organization is onboarded with DigiCert, an issuer object in the vault lets the certificate policy request and renew the publicly trusted certificate automatically when its AutoRenew lifetime action triggers.
    fr: |
      Key Vault ne renouvelle de bout en bout que les certificats émis par une autorité intégrée (DigiCert ou GlobalSign) ou auto-signés. Une fois l'organisation inscrite chez DigiCert, un objet émetteur dans le coffre permet à la stratégie de certificat de demander et de renouveler automatiquement le certificat approuvé publiquement quand son action de durée de vie AutoRenew se déclenche.
  options:
    a:
      en: "Key Vault can't renew a certificate from a non-integrated CA; you must create a new version, send the CSR to the CA and merge the signed request."
      fr: "Key Vault ne peut pas renouveler un certificat d'une autorité non intégrée ; il faut créer une nouvelle version, envoyer la CSR à l'autorité et fusionner la demande signée."
    c:
      en: "A self-signed certificate renews automatically but isn't publicly trusted."
      fr: "Un certificat auto-signé se renouvelle automatiquement mais n'est pas approuvé publiquement."
    d:
      en: "EmailContacts only notifies the contacts; someone must still renew the certificate manually."
      fr: "EmailContacts se contente de prévenir les contacts ; quelqu'un doit encore renouveler le certificat manuellement."
references:
  - title: Renew your Azure Key Vault certificates
    url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/overview-renew-certificate
  - title: About Azure Key Vault certificates
    url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
