id: sc500-1a-pim-azure-managers
objective: "1.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank plans to use Privileged Identity Management (PIM) to make developers eligible for Azure roles on a subscription named **Sub-Dev**.

    You need to identify which roles allow a user to manage PIM assignments of Azure roles for other users on Sub-Dev.

    Which two roles should you identify? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit d'utiliser Privileged Identity Management (PIM) pour rendre des développeurs éligibles à des rôles Azure sur un abonnement nommé **Sub-Dev**.

    Vous devez identifier les rôles qui permettent à un utilisateur de gérer les attributions PIM de rôles Azure pour d'autres utilisateurs sur Sub-Dev.

    Quels sont les deux rôles à identifier ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Owner on Sub-Dev", fr: "Owner sur Sub-Dev" } }
    - { id: b, text: { en: "Privileged Role Administrator (Microsoft Entra role)", fr: "Privileged Role Administrator (rôle Microsoft Entra)" } }
    - { id: c, text: { en: "Security Administrator (Microsoft Entra role)", fr: "Security Administrator (rôle Microsoft Entra)" } }
    - { id: d, text: { en: "User Access Administrator on Sub-Dev", fr: "User Access Administrator sur Sub-Dev" } }
    - { id: e, text: { en: "Contributor on Sub-Dev", fr: "Contributor sur Sub-Dev" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      For Azure resource roles, only a subscription administrator, a resource Owner or a resource User Access Administrator can manage assignments for other users in PIM. Both Owner and User Access Administrator include the permission to write role assignments on the resource.
    fr: |
      Pour les rôles de ressources Azure, seuls un administrateur de l'abonnement, un Owner de la ressource ou un User Access Administrator de la ressource peuvent gérer les attributions d'autres utilisateurs dans PIM. Owner et User Access Administrator incluent tous deux l'autorisation d'écrire des attributions de rôles sur la ressource.
  options:
    b:
      en: |
        Privileged Role Administrator manages PIM for Microsoft Entra roles; by default it does not even see assignments of Azure resource roles.
      fr: |
        Privileged Role Administrator gère PIM pour les rôles Microsoft Entra ; par défaut, il ne voit même pas les attributions de rôles de ressources Azure.
    c:
      en: |
        Security Administrator can view Microsoft Entra role assignments in PIM but has no default access to Azure resource role assignments.
      fr: |
        Security Administrator peut consulter les attributions de rôles Microsoft Entra dans PIM, mais n'a pas d'accès par défaut aux attributions de rôles de ressources Azure.
    e:
      en: |
        Contributor manages resources but cannot create or change role assignments.
      fr: |
        Contributor gère les ressources, mais ne peut ni créer ni modifier d'attributions de rôles.
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
