id: sc500-1b-kvf-app-service-ip
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has a key vault named **kv-pw-orders** with the following networking configuration:

    - **Allow access from**: Allow public access from specific virtual networks and IP addresses
    - **Firewall**: 198.51.100.0/24 (head office)
    - **Exception**: Allow trusted Microsoft services to bypass this firewall is selected

    An Azure App Service web app named **app-orders** isn't integrated with any virtual network. It reads secrets from kv-pw-orders at run time by using its managed identity, which has the Key Vault Secrets User role on the vault. Every read fails with a 403 error that reports that the client address isn't authorized by the firewall.

    You need to ensure that app-orders can read the secrets. kv-pw-orders must remain closed to all other public networks.

    What should you do?
  fr: |
    Proseware, Inc. dispose d'un coffre de clés nommé **kv-pw-orders** avec la configuration réseau suivante :

    - **Allow access from** : Allow public access from specific virtual networks and IP addresses
    - **Firewall** : 198.51.100.0/24 (siège)
    - **Exception** : Allow trusted Microsoft services to bypass this firewall est sélectionné

    Une application web Azure App Service nommée **app-orders** n'est intégrée à aucun réseau virtuel. Elle lit les secrets de kv-pw-orders à l'exécution avec son identité managée, qui a le rôle Key Vault Secrets User sur le coffre. Chaque lecture échoue avec une erreur 403 indiquant que l'adresse du client n'est pas autorisée par le pare-feu.

    Vous devez vous assurer qu'app-orders peut lire les secrets. kv-pw-orders doit rester fermé à tous les autres réseaux publics.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the outbound IP addresses of app-orders to the firewall of kv-pw-orders.", fr: "Ajouter les adresses IP sortantes d'app-orders au pare-feu de kv-pw-orders." } }
    - { id: b, text: { en: "Assign the Key Vault Reader role to the managed identity of app-orders.", fr: "Attribuer le rôle Key Vault Reader à l'identité managée d'app-orders." } }
    - { id: c, text: { en: "Enable access to Azure Resource Manager for template deployment on kv-pw-orders.", fr: "Activer l'accès à Azure Resource Manager pour le déploiement de modèles sur kv-pw-orders." } }
    - { id: d, text: { en: "Create a private endpoint for kv-pw-orders in a new virtual network.", fr: "Créer un point de terminaison privé pour kv-pw-orders dans un nouveau réseau virtuel." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure App Service is a trusted service only for deploying web app certificates from Key Vault. The app's own run-time calls are ordinary client requests, so the firewall must allow them, for example by adding the app's outbound IP addresses (shown in the app's properties) as IP rules.
    fr: |
      Azure App Service n'est un service approuvé que pour déployer des certificats d'application web depuis Key Vault. Les appels de l'application à l'exécution sont des requêtes clientes ordinaires : le pare-feu doit les autoriser, par exemple en ajoutant les adresses IP sortantes de l'application (affichées dans ses propriétés) comme règles IP.
  options:
    b:
      en: "The identity is already authorized to read secrets; the request is rejected by the firewall before authorization matters, and Reader can't read values anyway."
      fr: "L'identité est déjà autorisée à lire les secrets ; la requête est rejetée par le pare-feu avant toute autorisation, et Reader ne lit de toute façon pas les valeurs."
    c:
      en: "This setting lets Resource Manager retrieve secrets during template deployments; it doesn't open the firewall to the app."
      fr: "Ce paramètre permet à Resource Manager de récupérer des secrets pendant les déploiements de modèles ; il n'ouvre pas le pare-feu à l'application."
    d:
      en: "app-orders isn't integrated with any virtual network, so it can't reach a private endpoint."
      fr: "app-orders n'est intégrée à aucun réseau virtuel : elle ne peut pas atteindre un point de terminaison privé."
references:
  - title: Virtual network service endpoints for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview-vnet-service-endpoints
  - title: Configure network security for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/network-security
