id: sc500-1a-app-statements
objective: "1.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys develops line-of-business applications that use the Microsoft identity platform. Some applications are registered in the Microsoft Entra admin center, others by a deployment script that calls the Microsoft Graph API. Several on-premises web apps are published through Microsoft Entra application proxy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys développe des applications métier qui utilisent la plateforme d'identités Microsoft. Certaines applications sont inscrites dans le Centre d'administration Microsoft Entra, d'autres par un script de déploiement qui appelle l'API Microsoft Graph. Plusieurs applications web locales sont publiées par le proxy d'application Microsoft Entra.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When you register an application in the Microsoft Entra admin center, a service principal is also created in your tenant.
        fr: |
          Lorsque vous inscrivez une application dans le Centre d'administration Microsoft Entra, un principal de service est également créé dans votre locataire.
    - id: s2
      text:
        en: |
          When the script creates an application by using the Microsoft Graph API, the service principal is created automatically with the application object.
        fr: |
          Lorsque le script crée une application avec l'API Microsoft Graph, le principal de service est créé automatiquement avec l'objet application.
    - id: s3
      text:
        en: |
          A user who holds the Cloud Application Administrator role can manage the application proxy settings of the published web apps.
        fr: |
          Un utilisateur qui détient le rôle Cloud Application Administrator peut gérer les paramètres de proxy d'application des applications web publiées.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Registering an app in the admin center creates both the application object and a service principal in the home tenant. With the Microsoft Graph API, creating the service principal is a separate step. Cloud Application Administrator can manage all aspects of app registrations and enterprise apps except application proxy; that requires Application Administrator.
    fr: |
      Inscrire une application dans le Centre d'administration crée à la fois l'objet application et un principal de service dans le locataire d'origine. Avec l'API Microsoft Graph, la création du principal de service est une étape distincte. Cloud Application Administrator peut gérer tous les aspects des inscriptions d'applications et des applications d'entreprise, sauf le proxy d'application, qui exige Application Administrator.
references:
  - title: Application and service principal objects in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity-platform/app-objects-and-service-principals
  - title: Microsoft Entra built-in roles
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference
