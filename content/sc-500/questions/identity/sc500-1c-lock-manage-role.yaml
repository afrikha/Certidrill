id: sc500-1c-lock-manage-role
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has an Azure subscription named **Sub-Prod**. A member of the platform team named **Ops1** has the **Contributor** role on Sub-Prod. When Ops1 tries to add a **CanNotDelete** lock to a resource group, the operation fails with an authorization error.

    You need to allow Ops1 to create and delete locks on the resources of Sub-Prod. The solution must use a built-in role.

    Which role should you assign to Ops1 on Sub-Prod?
  fr: |
    Litware, Inc. dispose d'un abonnement Azure nommé **Sub-Prod**. Un membre de l'équipe plateforme nommé **Ops1** dispose du rôle **Contributor** sur Sub-Prod. Quand Ops1 tente d'ajouter un verrou **CanNotDelete** à un groupe de ressources, l'opération échoue avec une erreur d'autorisation.

    Vous devez permettre à Ops1 de créer et de supprimer des verrous sur les ressources de Sub-Prod. La solution doit utiliser un rôle intégré.

    Quel rôle devez-vous attribuer à Ops1 sur Sub-Prod ?
body:
  options:
    - id: a
      text: Resource Policy Contributor
    - id: b
      text: User Access Administrator
    - id: c
      text: Security Admin
    - id: d
      text: Virtual Machine Contributor
answer: { optionId: b }
explanation:
  correct:
    en: |
      Creating or deleting a lock requires `Microsoft.Authorization/*` or `Microsoft.Authorization/locks/*`. Owner and User Access Administrator include these actions. Contributor is excluded from `Microsoft.Authorization/*/Write` and `*/Delete` operations, which is why the request failed.
    fr: |
      Créer ou supprimer un verrou nécessite `Microsoft.Authorization/*` ou `Microsoft.Authorization/locks/*`. Owner et User Access Administrator incluent ces actions. Contributor exclut les opérations `Microsoft.Authorization/*/Write` et `*/Delete`, d'où l'échec de la demande.
  options:
    a:
      en: Resource Policy Contributor manages policy definitions, assignments and exemptions, not management locks.
      fr: Resource Policy Contributor gère les définitions, attributions et exemptions de stratégie, pas les verrous de gestion.
    c:
      en: Security Admin manages policies and security settings in Defender for Cloud but has no permission on locks.
      fr: Security Admin gère les stratégies et les paramètres de sécurité dans Defender for Cloud, mais n'a aucune autorisation sur les verrous.
    d:
      en: Virtual Machine Contributor manages virtual machines and only reads `Microsoft.Authorization` resources; it cannot create locks.
      fr: Virtual Machine Contributor gère les machines virtuelles et ne fait que lire les ressources `Microsoft.Authorization` ; il ne peut pas créer de verrous.
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
  - title: Azure built-in roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
