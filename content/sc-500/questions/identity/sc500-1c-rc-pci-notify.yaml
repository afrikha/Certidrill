id: sc500-1c-rc-pci-notify
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure subscription named **Sub-Card** in which Defender CSPM is enabled. Only the Microsoft cloud security benchmark is assigned. A logic app named **la-notify** that sends an email to the compliance team already exists.

    You need to meet the following requirements:

    - Evaluate the resources of Sub-Card against **PCI DSS**.
    - Notify the compliance team as soon as any PCI DSS assessment changes state.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un abonnement Azure nommé **Sub-Card** dans lequel Defender CSPM est activé. Seul le Microsoft cloud security benchmark est attribué. Une application logique nommée **la-notify**, qui envoie un e-mail à l'équipe conformité, existe déjà.

    Vous devez répondre aux exigences suivantes :

    - Évaluer les ressources de Sub-Card par rapport à **PCI DSS**.
    - Avertir l'équipe conformité dès qu'une évaluation PCI DSS change d'état.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the Security policies of Sub-Card, set the PCI DSS standard to On.", fr: "Dans les Security policies de Sub-Card, mettre la norme PCI DSS sur On." } }
    - { id: b, text: { en: "Configure continuous export of the regulatory compliance data of Sub-Card to an event hub.", fr: "Configurer l'exportation continue des données de conformité réglementaire de Sub-Card vers un hub d'événements." } }
    - { id: c, text: { en: "Create a governance rule on Sub-Card that sets the compliance team's email address as the owner.", fr: "Créer une règle de gouvernance sur Sub-Card qui définit l'adresse e-mail de l'équipe conformité comme propriétaire." } }
    - { id: d, text: { en: "Create a workflow automation on Sub-Card for regulatory compliance changes that runs la-notify.", fr: "Créer une automatisation de workflow sur Sub-Card pour les changements de conformité réglementaire qui exécute la-notify." } }
    - { id: e, text: { en: "Assign the Security Reader role on Sub-Card to the compliance team.", fr: "Attribuer le rôle Security Reader sur Sub-Card à l'équipe conformité." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Additional standards are enabled by toggling them On in **Environment settings > Security policies** (or **Regulatory compliance > Manage compliance policies**) for the scope. Workflow automation can trigger a logic app whenever a regulatory compliance assessment changes state, which sends the email immediately.
    fr: |
      Les normes supplémentaires s'activent en les mettant sur On dans **Environment settings > Security policies** (ou **Regulatory compliance > Manage compliance policies**) pour l'étendue. L'automatisation de workflow peut déclencher une application logique chaque fois qu'une évaluation de conformité réglementaire change d'état, ce qui envoie l'e-mail immédiatement.
  options:
    b:
      en: Continuous export streams the data to an event hub, but nothing notifies the compliance team without extra development.
      fr: L'exportation continue envoie les données vers un hub d'événements, mais rien n'avertit l'équipe conformité sans développement supplémentaire.
    c:
      en: Governance rules assign owners and due dates to recommendations and send weekly digest emails; they do not react to each compliance assessment change.
      fr: Les règles de gouvernance attribuent des propriétaires et des échéances aux recommandations et envoient des e-mails récapitulatifs hebdomadaires ; elles ne réagissent pas à chaque changement d'une évaluation de conformité.
    e:
      en: A read role lets the team view data in the portal; it neither enables the standard nor sends notifications.
      fr: Un rôle de lecture permet à l'équipe de consulter les données dans le portail ; il n'active pas la norme et n'envoie aucune notification.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
  - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages
