id: sc500-1a-am-statements
objective: "1.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is deploying passwordless authentication. Some users connect to the corporate VPN through a RADIUS server that uses the Network Policy Server (NPS) extension for Microsoft Entra multifactor authentication.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders déploie l'authentification sans mot de passe. Certains utilisateurs se connectent au VPN de l'entreprise via un serveur RADIUS qui utilise l'extension NPS (Network Policy Server) pour l'authentification multifacteur Microsoft Entra.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Users can sign in to the VPN with a Temporary Access Pass through the NPS extension.
        fr: |
          Les utilisateurs peuvent se connecter au VPN avec un passe d'accès temporaire via l'extension NPS.
    - id: s2
      text:
        en: |
          A registration campaign can nudge users to register a passkey (FIDO2).
        fr: |
          Une campagne d'inscription peut inciter les utilisateurs à inscrire une clé d'accès (FIDO2).
    - id: s3
      text:
        en: |
          By default, system-preferred authentication is Microsoft managed for all users.
        fr: |
          Par défaut, l'authentification préférée par le système est gérée par Microsoft (Microsoft managed) pour tous les utilisateurs.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A Temporary Access Pass cannot be used with the NPS extension or the AD FS adapter. A registration campaign targets one method at a time, either Passkey (FIDO2) or Microsoft Authenticator. System-preferred authentication, which prompts users for their most secure registered method, is Microsoft managed by default.
    fr: |
      Un passe d'accès temporaire ne peut pas être utilisé avec l'extension NPS ni avec l'adaptateur AD FS. Une campagne d'inscription cible une méthode à la fois, Passkey (FIDO2) ou Microsoft Authenticator. L'authentification préférée par le système, qui propose à l'utilisateur sa méthode inscrite la plus sûre, est gérée par Microsoft par défaut.
references:
  - title: Configure Temporary Access Pass to register passwordless authentication methods
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-temporary-access-pass
  - title: Run a registration campaign to set up a passkey or Microsoft Authenticator
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-mfa-registration-campaign
