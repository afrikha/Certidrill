id: sc500-1b-kvo-versionless-uri
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a key vault named **kv-tt-cmk** that contains a key named **cmk-media**. A rotation policy creates a new version of cmk-media every 12 months.

    A storage account named **sttailmedia** was configured last year to use cmk-media as its customer-managed key. The key URI entered during the configuration was:

    `https://kv-tt-cmk.vault.azure.net/keys/cmk-media/4f2c8a1e9b7d4c6a8e0f1a2b3c4d5e6f`

    The key rotated last week, but sttailmedia still uses the previous key version. You need to ensure that sttailmedia always uses the latest version of cmk-media after each rotation, with no manual step.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un coffre de clés nommé **kv-tt-cmk** qui contient une clé nommée **cmk-media**. Une stratégie de rotation crée une nouvelle version de cmk-media tous les 12 mois.

    Un compte de stockage nommé **sttailmedia** a été configuré l'an dernier pour utiliser cmk-media comme clé gérée par le client. L'URI de clé saisi lors de la configuration était :

    `https://kv-tt-cmk.vault.azure.net/keys/cmk-media/4f2c8a1e9b7d4c6a8e0f1a2b3c4d5e6f`

    La clé a pivoté la semaine dernière, mais sttailmedia utilise toujours la version précédente. Vous devez vous assurer que sttailmedia utilise toujours la dernière version de cmk-media après chaque rotation, sans aucune étape manuelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable the previous version of cmk-media so that sttailmedia switches to the current version.", fr: "Désactiver la version précédente de cmk-media pour que sttailmedia passe à la version actuelle." } }
    - { id: b, text: { en: "Reconfigure the encryption of sttailmedia with the key URI that omits the version.", fr: "Reconfigurer le chiffrement de sttailmedia avec l'URI de clé qui omet la version." } }
    - { id: c, text: { en: "Change the rotation policy of cmk-media to add a Notify action 30 days before expiry.", fr: "Modifier la stratégie de rotation de cmk-media pour ajouter une action Notify 30 jours avant l'expiration." } }
    - { id: d, text: { en: "Assign the Key Vault Crypto Officer role to the managed identity of sttailmedia.", fr: "Attribuer le rôle Key Vault Crypto Officer à l'identité managée de sttailmedia." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Rotation creates a new key version, and an Azure service picks it up automatically only if it is configured with the versionless key URI. sttailmedia was configured with a versioned URI, so it stays pinned to that version; reconfiguring it with `https://kv-tt-cmk.vault.azure.net/keys/cmk-media` makes it follow each rotation, rewrapping its data encryption keys without re-encrypting the data.
    fr: |
      La rotation crée une nouvelle version de clé, et un service Azure ne la prend automatiquement que s'il est configuré avec l'URI de clé sans version. sttailmedia a été configuré avec un URI versionné : il reste attaché à cette version. Le reconfigurer avec `https://kv-tt-cmk.vault.azure.net/keys/cmk-media` lui fait suivre chaque rotation, en réenveloppant ses clés de chiffrement des données sans rechiffrer les données.
  options:
    a:
      en: "The storage account is pinned to the previous version; disabling it would make the account lose access to its key instead of switching versions."
      fr: "Le compte de stockage est attaché à la version précédente ; la désactiver lui ferait perdre l'accès à sa clé au lieu de changer de version."
    c:
      en: "A Notify action only raises a near-expiry event; it doesn't change which version the storage account uses."
      fr: "Une action Notify déclenche seulement un événement d'expiration proche ; elle ne change pas la version utilisée par le compte de stockage."
    d:
      en: "The problem is the pinned URI, not a permission; Crypto Officer would also grant far more than wrap and unwrap."
      fr: "Le problème est l'URI versionné, pas une autorisation ; Crypto Officer accorderait en outre bien plus que l'enveloppement et le désenveloppement."
references:
  - title: Configure cryptographic key auto-rotation in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation
