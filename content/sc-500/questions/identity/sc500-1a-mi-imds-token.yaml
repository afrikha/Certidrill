id: sc500-1a-mi-imds-token
objective: "1.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a virtual machine named **VM1** that has no managed identity. An application on VM1 must read blobs from a storage account named **sttailspin** by using Microsoft Entra authentication, without any stored credential.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'une machine virtuelle nommée **VM1** qui n'a aucune identité managée. Une application de VM1 doit lire des objets blob d'un compte de stockage nommé **sttailspin** avec l'authentification Microsoft Entra, sans aucune information d'identification stockée.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: enable, text: { en: "Enable the system-assigned managed identity of VM1.", fr: "Activer l'identité managée affectée par le système de VM1." } }
    - { id: role, text: { en: "Assign the Storage Blob Data Reader role on sttailspin to the managed identity of VM1.", fr: "Attribuer le rôle Storage Blob Data Reader sur sttailspin à l'identité managée de VM1." } }
    - { id: token, text: { en: "From the application, request a token from http://169.254.169.254/metadata/identity/oauth2/token with the resource https://storage.azure.com/ and the header Metadata: true.", fr: "Depuis l'application, demander un jeton à http://169.254.169.254/metadata/identity/oauth2/token avec la ressource https://storage.azure.com/ et l'en-tête Metadata: true." } }
    - { id: call, text: { en: "Call the Blob service with the token in the Authorization header.", fr: "Appeler le service Blob avec le jeton dans l'en-tête Authorization." } }
    - { id: appreg, text: { en: "Create an app registration for VM1 and add a client secret.", fr: "Créer une inscription d'application pour VM1 et ajouter une clé secrète client." } }
    - { id: miop, text: { en: "Assign the Managed Identity Operator role to VM1.", fr: "Attribuer le rôle Managed Identity Operator à VM1." } }
answer:
  sequence: [ enable, role, token, call ]
explanation:
  correct:
    en: |
      Enabling the system-assigned identity creates its service principal, which can then receive a role assignment on the storage account. The application obtains a token from the Azure Instance Metadata Service endpoint, where the resource parameter sets the token audience and the Metadata: true header is required as an SSRF mitigation, and then presents the token to the Blob service.
    fr: |
      Activer l'identité affectée par le système crée son principal de service, qui peut ensuite recevoir une attribution de rôle sur le compte de stockage. L'application obtient un jeton auprès du point de terminaison Azure Instance Metadata Service, où le paramètre resource fixe l'audience du jeton et où l'en-tête Metadata: true est obligatoire pour contrer les attaques SSRF, puis présente ce jeton au service Blob.
  options:
    appreg:
      en: |
        A client secret is a stored credential, which the requirement forbids; the managed identity needs no app registration.
      fr: |
        Une clé secrète client est une information d'identification stockée, ce que l'exigence interdit ; l'identité managée n'a besoin d'aucune inscription d'application.
    miop:
      en: |
        Managed Identity Operator lets a user assign user-assigned identities to resources; it gives no access to blob data.
      fr: |
        Managed Identity Operator permet à un utilisateur d'affecter des identités affectées par l'utilisateur à des ressources ; il ne donne aucun accès aux données blob.
references:
  - title: How to use managed identities for Azure resources on an Azure VM to acquire an access token
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-use-vm-token
