id: sc500-1b-dkv-email-severity
objective: "1.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders enabled Microsoft Defender for Key Vault on a subscription named **Sub-Ops**. Only the subscription owners currently receive alert emails.

    You need the distribution list secops@northwindtraders.com to receive an email for alerts such as **Access from a TOR exit node to a key vault** and **Suspicious secret listing and query in a key vault**. The list must not receive emails for low-severity alerts, such as **Unusual access denied - Unusual user accessing key vault denied**. The solution must not require deploying any additional resource.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a activé Microsoft Defender for Key Vault sur un abonnement nommé **Sub-Ops**. Actuellement, seuls les propriétaires de l'abonnement reçoivent les e-mails d'alerte.

    La liste de distribution secops@northwindtraders.com doit recevoir un e-mail pour des alertes comme **Access from a TOR exit node to a key vault** et **Suspicious secret listing and query in a key vault**. La liste ne doit pas recevoir d'e-mails pour les alertes de faible gravité, comme **Unusual access denied - Unusual user accessing key vault denied**. La solution ne doit exiger le déploiement d'aucune ressource supplémentaire.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Open [[where]] and add secops@northwindtraders.com as an additional email recipient.
      Set the notification for alerts to the severity [[sev]] or higher.
    fr: |
      Ouvrez [[where]] et ajoutez secops@northwindtraders.com comme destinataire d'e-mail supplémentaire.
      Définissez la notification des alertes sur la gravité [[sev]] ou supérieure.
  slots:
    - id: where
      options:
        - { id: email, text: "Defender for Cloud > Environment settings > Sub-Ops > Email notifications" }
        - { id: diag, text: { en: "the Diagnostic settings page of each key vault", fr: "la page Diagnostic settings de chaque coffre de clés" } }
        - { id: events, text: { en: "the Events page of each key vault", fr: "la page Events de chaque coffre de clés" } }
        - { id: workflow, text: "Defender for Cloud > Workflow automation" }
    - id: sev
      options:
        - { id: high, text: High }
        - { id: medium, text: Medium }
        - { id: low, text: Low }
answer:
  values: { where: email, sev: medium }
explanation:
  correct:
    en: |
      Email notifications are configured per subscription in Defender for Cloud > Environment settings > Email notifications, where you can add any email address and choose to be notified about alerts of a selected severity or higher. The TOR exit node and secret listing alerts are of medium severity, so the threshold Medium includes them and excludes low-severity alerts.
    fr: |
      Les notifications par e-mail se configurent par abonnement dans Defender for Cloud > Environment settings > Email notifications, où vous pouvez ajouter n'importe quelle adresse e-mail et choisir d'être prévenu des alertes d'une gravité donnée ou supérieure. Les alertes de nœud de sortie TOR et de listage de secrets ont une gravité moyenne (Medium) : le seuil Medium les inclut et exclut les alertes de faible gravité.
  options:
    workflow: { en: "Workflow automation runs a Logic App, which is an additional resource to deploy.", fr: "L'automatisation de workflow exécute une application logique, une ressource supplémentaire à déployer." }
    diag: { en: "Diagnostic settings export resource logs; they don't send Defender alert emails.", fr: "Les paramètres de diagnostic exportent les journaux de ressources ; ils n'envoient pas d'e-mails d'alerte Defender." }
    events: { en: "Key Vault events concern object life cycle changes, not security alerts.", fr: "Les événements Key Vault concernent le cycle de vie des objets, pas les alertes de sécurité." }
    high: { en: "With High, the medium-severity Key Vault alerts would send no email.", fr: "Avec High, les alertes Key Vault de gravité moyenne n'enverraient aucun e-mail." }
    low: { en: "With Low, low-severity alerts would also be emailed.", fr: "Avec Low, les alertes de faible gravité seraient aussi envoyées par e-mail." }
references:
  - title: Configure email notifications for alerts and attack paths
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/configure-email-notifications
  - title: Alerts for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-azure-key-vault
