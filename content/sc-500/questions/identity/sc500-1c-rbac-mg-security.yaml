id: sc500-1c-rbac-mg-security
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a management group named **MG-Corp** that contains 15 Azure subscriptions, including one named **Sub-Prod**. Microsoft Defender for Cloud is enabled on all the subscriptions. The members of a Microsoft Entra group named **SOC** must meet the following requirements:

    - View the recommendations, alerts and secure score of all the subscriptions in MG-Corp, including subscriptions added later.
    - Dismiss alerts and edit security policies in Sub-Prod only.

    You need to assign roles to SOC. The solution must use the principle of least privilege.

    Which two role assignments should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'un groupe d'administration nommé **MG-Corp** qui contient 15 abonnements Azure, dont un nommé **Sub-Prod**. Microsoft Defender for Cloud est activé sur tous les abonnements. Les membres d'un groupe Microsoft Entra nommé **SOC** doivent répondre aux exigences suivantes :

    - Consulter les recommandations, les alertes et le score de sécurité de tous les abonnements de MG-Corp, y compris ceux ajoutés plus tard.
    - Ignorer des alertes et modifier les stratégies de sécurité uniquement dans Sub-Prod.

    Vous devez attribuer des rôles à SOC. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux attributions de rôles à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Security Admin at the MG-Corp scope", fr: "Security Admin à l'étendue MG-Corp" } }
    - { id: b, text: { en: "Security Reader at the MG-Corp scope", fr: "Security Reader à l'étendue MG-Corp" } }
    - { id: c, text: { en: "Security Reader at the Sub-Prod scope", fr: "Security Reader à l'étendue Sub-Prod" } }
    - { id: d, text: { en: "The Microsoft Entra Security Administrator role at the tenant scope", fr: "Le rôle Microsoft Entra Security Administrator à l'étendue du locataire" } }
    - { id: e, text: { en: "Security Admin at the Sub-Prod scope", fr: "Security Admin à l'étendue Sub-Prod" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Azure role assignments at a management group are inherited by all its subscriptions, including those added later, so Security Reader at MG-Corp covers the read requirement. Security Admin, which adds the rights to update security policies and dismiss alerts, is limited to Sub-Prod by assigning it at that subscription.
    fr: |
      Les attributions de rôles Azure à un groupe d'administration sont héritées par tous ses abonnements, y compris ceux ajoutés plus tard : Security Reader à MG-Corp couvre l'exigence de lecture. Security Admin, qui ajoute les droits de mettre à jour les stratégies de sécurité et d'ignorer les alertes, est limité à Sub-Prod en l'attribuant à cet abonnement.
  options:
    a:
      en: Security Admin at MG-Corp would let SOC edit policies and dismiss alerts in all 15 subscriptions.
      fr: Security Admin à MG-Corp permettrait à SOC de modifier les stratégies et d'ignorer les alertes dans les 15 abonnements.
    c:
      en: Security Reader at Sub-Prod only covers one subscription, and Security Admin there already includes read access.
      fr: Security Reader à Sub-Prod ne couvre qu'un abonnement, et Security Admin y inclut déjà l'accès en lecture.
    d:
      en: Security Administrator is a Microsoft Entra role assigned at the tenant; it is not an Azure role assignment that can limit the editing rights to Sub-Prod, so it cannot meet least privilege here.
      fr: "Security Administrator est un rôle Microsoft Entra attribué au niveau du locataire ; ce n'est pas une attribution de rôle Azure qui peut limiter les droits de modification à Sub-Prod : il ne respecte pas le moindre privilège ici."
references:
  - title: User roles and permissions
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/permissions
