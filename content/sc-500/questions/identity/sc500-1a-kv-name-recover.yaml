id: sc500-1a-kv-name-recover
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders deleted a key vault named **kv-nw-prod** yesterday. The vault had soft delete with a 90-day retention period and purge protection enabled.

    A deployment pipeline now fails when it tries to create a new key vault named kv-nw-prod in the same subscription. The vault must be available under that name today.

    What should you do?
  fr: |
    Northwind Traders a supprimé hier un coffre de clés nommé **kv-nw-prod**. La suppression réversible était activée avec une période de rétention de 90 jours, ainsi que la protection contre le vidage.

    Un pipeline de déploiement échoue désormais lorsqu'il tente de créer un coffre de clés nommé kv-nw-prod dans le même abonnement. Le coffre doit être disponible sous ce nom aujourd'hui.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Purge the deleted vault, and then rerun the pipeline.", fr: "Vider le coffre supprimé, puis réexécuter le pipeline." }
    - id: b
      text: { en: "Recover the deleted vault.", fr: "Récupérer le coffre supprimé." }
    - id: c
      text: { en: "Change the pipeline to create the vault in another subscription.", fr: "Modifier le pipeline pour créer le coffre dans un autre abonnement." }
    - id: d
      text: { en: "Disable purge protection on the deleted vault, and then purge it.", fr: "Désactiver la protection contre le vidage sur le coffre supprimé, puis le vider." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Key vault names are globally unique, and the name of a soft-deleted vault cannot be reused until the retention period expires. With purge protection enabled, the vault cannot be purged before then, so recovering the deleted vault is the only way to have kv-nw-prod available today.
    fr: |
      Les noms de coffres de clés sont uniques au niveau mondial, et le nom d'un coffre supprimé de manière réversible ne peut pas être réutilisé avant la fin de la période de rétention. Avec la protection contre le vidage, le coffre ne peut pas être vidé avant ce délai : récupérer le coffre supprimé est le seul moyen de disposer de kv-nw-prod aujourd'hui.
  options:
    a:
      en: |
        Purge protection prevents purging the vault until the 90-day retention period has elapsed.
      fr: |
        La protection contre le vidage empêche de vider le coffre tant que la période de rétention de 90 jours n'est pas écoulée.
    c:
      en: |
        Key vault names are globally unique, so the soft-deleted vault still reserves the name in every subscription.
      fr: |
        Les noms de coffres de clés sont uniques au niveau mondial : le coffre supprimé de manière réversible réserve le nom dans tous les abonnements.
    d:
      en: |
        Once enabled, purge protection cannot be disabled or overridden by anyone, including Microsoft.
      fr: |
        Une fois activée, la protection contre le vidage ne peut être ni désactivée ni contournée par quiconque, Microsoft compris.
references:
  - title: Azure Key Vault recovery management with soft delete and purge protection
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/key-vault-recovery
