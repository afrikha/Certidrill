id: sc500-1c-rc-statements
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has two Azure subscriptions in which Defender CSPM is enabled:

    - **Sub1** contains virtual machines, storage accounts and key vaults.
    - **Sub2** was created yesterday and does not contain any resource yet.

    You assign the **NIST SP 800-53** standard to Sub1 and to Sub2 from **Security policies**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de deux abonnements Azure dans lesquels Defender CSPM est activé :

    - **Sub1** contient des machines virtuelles, des comptes de stockage et des coffres de clés.
    - **Sub2** a été créé hier et ne contient encore aucune ressource.

    Vous attribuez la norme **NIST SP 800-53** à Sub1 et à Sub2 depuis **Security policies**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Regulatory compliance dashboard displays NIST SP 800-53 for Sub2 with all its controls marked as compliant.
        fr: Le tableau de bord Regulatory compliance affiche NIST SP 800-53 pour Sub2 avec tous ses contrôles marqués comme conformes.
    - id: s2
      text:
        en: Selecting **Download report** on the dashboard generates a report that summarizes the NIST SP 800-53 status of the resources in Sub1.
        fr: Sélectionner **Download report** dans le tableau de bord génère un rapport qui résume l'état NIST SP 800-53 des ressources de Sub1.
    - id: s3
      text:
        en: After you fix a non-compliant storage account in Sub1, the related NIST SP 800-53 control is updated on the dashboard within a few seconds.
        fr: Après la correction d'un compte de stockage non conforme dans Sub1, le contrôle NIST SP 800-53 associé est mis à jour dans le tableau de bord en quelques secondes.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A standard that has no relevant assessed resources in a subscription is not shown on the dashboard at all, even though it is assigned. **Download report** produces a PDF or CSV summary of your compliance status organized by the standard's controls (unlike **Audit reports**, which are Microsoft's own certification reports). Assessments run roughly every 12 hours, so a fix appears only after the next run.
    fr: |
      Une norme sans ressource évaluée pertinente dans un abonnement n'est pas du tout affichée dans le tableau de bord, même si elle est attribuée. **Download report** produit un résumé PDF ou CSV de votre état de conformité organisé selon les contrôles de la norme (contrairement à **Audit reports**, qui fournit les rapports de certification de Microsoft). Les évaluations s'exécutent environ toutes les 12 heures : une correction n'apparaît qu'après l'exécution suivante.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
  - title: Regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards
