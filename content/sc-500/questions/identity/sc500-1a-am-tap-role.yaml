id: sc500-1a-am-tap-role
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has enabled the Temporary Access Pass method in the Authentication methods policy. Helpdesk staff must create Temporary Access Passes for employees who lost their passkey. The employees hold no administrative role.

    The helpdesk staff must not be able to create Temporary Access Passes for administrators or to change the Authentication methods policy. The solution must follow the principle of least privilege.

    Which Microsoft Entra role should you assign to the helpdesk staff?
  fr: |
    Tailspin Toys a activé la méthode passe d'accès temporaire dans la stratégie des méthodes d'authentification. Le personnel du support doit créer des passes d'accès temporaires pour les employés qui ont perdu leur clé d'accès. Les employés n'ont aucun rôle d'administration.

    Le personnel du support ne doit pas pouvoir créer de passes d'accès temporaires pour des administrateurs ni modifier la stratégie des méthodes d'authentification. La solution doit respecter le principe du moindre privilège.

    Quel rôle Microsoft Entra devez-vous attribuer au personnel du support ?
body:
  options:
    - id: a
      text: Authentication Administrator
    - id: b
      text: Authentication Policy Administrator
    - id: c
      text: Privileged Authentication Administrator
    - id: d
      text: Security Administrator
answer: { optionId: a }
explanation:
  correct:
    en: |
      Authentication Administrator can view, set and reset authentication method information, including creating a Temporary Access Pass, for non-admin users only. It cannot edit the Authentication methods policy.
    fr: |
      Authentication Administrator peut consulter, définir et réinitialiser les informations de méthodes d'authentification, y compris créer un passe d'accès temporaire, pour les utilisateurs non administrateurs uniquement. Il ne peut pas modifier la stratégie des méthodes d'authentification.
  options:
    b:
      en: |
        Authentication Policy Administrator edits the Authentication methods policy (it enables TAP and targets groups) but does not create passes for users.
      fr: |
        Authentication Policy Administrator modifie la stratégie des méthodes d'authentification (il active le TAP et cible des groupes) mais ne crée pas de passes pour les utilisateurs.
    c:
      en: |
        Privileged Authentication Administrator can also create passes for administrators, which is more than required.
      fr: |
        Privileged Authentication Administrator peut aussi créer des passes pour des administrateurs, ce qui dépasse le besoin.
    d:
      en: |
        Security Administrator manages security configuration and reports; it is not the role for managing users' authentication methods.
      fr: |
        Security Administrator gère la configuration et les rapports de sécurité ; ce n'est pas le rôle qui gère les méthodes d'authentification des utilisateurs.
references:
  - title: Configure Temporary Access Pass to register passwordless authentication methods
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-temporary-access-pass
  - title: Microsoft Entra built-in roles
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference
