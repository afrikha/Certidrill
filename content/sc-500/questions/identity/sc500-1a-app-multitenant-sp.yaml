id: sc500-1a-app-multitenant-sp
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. registers an application named **App1** in its Microsoft Entra tenant. App1 is configured for **Multiple Entra ID tenants**.

    An administrator of Fabrikam, Inc. signs in to App1 and grants consent for the Fabrikam organization.

    Which object is created in the Fabrikam tenant?
  fr: |
    Contoso, Ltd. inscrit une application nommée **App1** dans son locataire Microsoft Entra. App1 est configurée pour **Multiple Entra ID tenants**.

    Un administrateur de Fabrikam, Inc. se connecte à App1 et donne son consentement pour l'organisation Fabrikam.

    Quel objet est créé dans le locataire Fabrikam ?
body:
  options:
    - id: a
      text: { en: "An application object, listed in App registrations", fr: "Un objet application, répertorié dans App registrations" }
    - id: b
      text: { en: "A service principal, listed in Enterprise applications", fr: "Un principal de service, répertorié dans Enterprise applications" }
    - id: c
      text: { en: "A guest user account for App1", fr: "Un compte d'utilisateur invité pour App1" }
    - id: d
      text: { en: "A system-assigned managed identity for App1", fr: "Une identité managée affectée par le système pour App1" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An application has one application object, in its home tenant (Contoso). A service principal, the local representation of the app, is created in every tenant where the app is used and consented, and it defines what the app can do and who can access it there. Service principals are managed on the Enterprise applications page.
    fr: |
      Une application possède un seul objet application, dans son locataire d'origine (Contoso). Un principal de service, représentation locale de l'application, est créé dans chaque locataire où l'application est utilisée et consentie ; il définit ce que l'application peut faire et qui peut y accéder dans ce locataire. Les principaux de service se gèrent dans la page Enterprise applications.
  options:
    a:
      en: |
        The application object exists only in the home tenant, Contoso; it is the template used to create service principals.
      fr: |
        L'objet application n'existe que dans le locataire d'origine, Contoso ; c'est le modèle utilisé pour créer les principaux de service.
    c:
      en: |
        Guest accounts represent external users invited for B2B collaboration, not applications.
      fr: |
        Les comptes invités représentent des utilisateurs externes invités pour la collaboration B2B, pas des applications.
    d:
      en: |
        Managed identities are created for Azure resources, not when an organization consents to a multitenant application.
      fr: |
        Les identités managées sont créées pour des ressources Azure, pas lorsqu'une organisation consent à une application multilocataire.
references:
  - title: Application and service principal objects in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity-platform/app-objects-and-service-principals
