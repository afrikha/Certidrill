id: sc500-1a-app-account-types
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. registers two applications in its Microsoft Entra tenant:

    - **HRPortal**: used only by Proseware employees and guests invited to the Proseware tenant.
    - **PartnerHub**: a SaaS application sold to other companies. Users of customer companies sign in with their work accounts from their own Microsoft Entra tenants. Personal Microsoft accounts must be refused.

    The PartnerHub back end authenticates to Microsoft Entra ID as a confidential client in production, and you must use the credential type that Microsoft recommends.

    How should you configure the applications? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. inscrit deux applications dans son locataire Microsoft Entra :

    - **HRPortal** : utilisée uniquement par les employés de Proseware et par les invités du locataire Proseware ;
    - **PartnerHub** : une application SaaS vendue à d'autres entreprises. Les utilisateurs des entreprises clientes se connectent avec leurs comptes professionnels depuis leurs propres locataires Microsoft Entra. Les comptes Microsoft personnels doivent être refusés.

    Le back-end de PartnerHub s'authentifie auprès de Microsoft Entra ID comme client confidentiel en production, et vous devez utiliser le type d'informations d'identification recommandé par Microsoft.

    Comment devez-vous configurer les applications ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      HRPortal, supported account types: [[hr]]
      PartnerHub, supported account types: [[partner]]
      PartnerHub production credential: [[cred]]
    fr: |
      HRPortal, types de comptes pris en charge : [[hr]]
      PartnerHub, types de comptes pris en charge : [[partner]]
      Informations d'identification de PartnerHub en production : [[cred]]
  slots:
    - id: hr
      options:
        - { id: single, text: "Single tenant only - Proseware" }
        - { id: multi, text: "Multiple Entra ID tenants" }
        - { id: multipersonal, text: "Any Entra ID Tenant + Personal Microsoft accounts" }
        - { id: personal, text: "Personal accounts only" }
    - id: partner
      options:
        - { id: single, text: "Single tenant only - Proseware" }
        - { id: multi, text: "Multiple Entra ID tenants" }
        - { id: multipersonal, text: "Any Entra ID Tenant + Personal Microsoft accounts" }
        - { id: personal, text: "Personal accounts only" }
    - id: cred
      options:
        - { id: cert, text: { en: "A certificate signed by a well-known certificate authority", fr: "Un certificat signé par une autorité de certification reconnue" } }
        - { id: secret, text: { en: "A client secret", fr: "Une clé secrète client" } }
        - { id: selfsigned, text: { en: "A self-signed certificate", fr: "Un certificat auto-signé" } }
answer:
  values: { hr: single, partner: multi, cred: cert }
explanation:
  correct:
    en: |
      Single tenant apps are for users and guests of your own tenant. Multiple Entra ID tenants is the SaaS option for users of any Microsoft Entra tenant, without personal Microsoft accounts. Microsoft recommends a certificate rather than a client secret before production, and in production a certificate signed by a well-known certificate authority, managed in Azure Key Vault; self-signed certificates are for testing.
    fr: |
      Les applications monolocataires sont destinées aux utilisateurs et aux invités de votre propre locataire. Multiple Entra ID tenants est l'option SaaS pour les utilisateurs de n'importe quel locataire Microsoft Entra, sans comptes Microsoft personnels. Microsoft recommande un certificat plutôt qu'une clé secrète client avant la production et, en production, un certificat signé par une autorité de certification reconnue, géré dans Azure Key Vault ; les certificats auto-signés sont réservés aux tests.
  options:
    multipersonal:
      en: |
        This option also accepts personal Microsoft accounts, which PartnerHub must refuse.
      fr: |
        Cette option accepte aussi les comptes Microsoft personnels, que PartnerHub doit refuser.
    secret:
      en: |
        Microsoft considers certificates more secure than client secrets and recommends them for production.
      fr: |
        Microsoft considère les certificats comme plus sûrs que les clés secrètes client et les recommande pour la production.
references:
  - title: Register an application in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity-platform/quickstart-register-app
  - title: Add and manage application credentials in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials
