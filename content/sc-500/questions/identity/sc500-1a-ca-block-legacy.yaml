id: sc500-1a-ca-block-legacy
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses. Some users still connect to Exchange Online by using older mail clients that rely on basic authentication, including Exchange ActiveSync clients and IMAP and POP clients.

    You create a Conditional Access policy that includes all users except two emergency access accounts and targets all resources.

    You need to block legacy authentication for those users by using this single policy.

    How should you configure the policy?
  fr: |
    Litware, Inc. dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1. Certains utilisateurs se connectent encore à Exchange Online avec d'anciens clients de messagerie qui utilisent l'authentification de base, notamment des clients Exchange ActiveSync ainsi que des clients IMAP et POP.

    Vous créez une stratégie d'accès conditionnel qui inclut tous les utilisateurs sauf deux comptes d'accès d'urgence et qui cible toutes les ressources.

    Vous devez bloquer l'authentification héritée pour ces utilisateurs avec cette seule stratégie.

    Comment devez-vous configurer la stratégie ?
body:
  options:
    - id: a
      text: { en: "Client apps condition: Browser and Mobile apps and desktop clients. Grant: Block access.", fr: "Condition Client apps : Browser et Mobile apps and desktop clients. Octroi : Block access." }
    - id: b
      text: { en: "Client apps condition: Other clients only. Grant: Block access.", fr: "Condition Client apps : Other clients uniquement. Octroi : Block access." }
    - id: c
      text: { en: "Client apps condition: Exchange ActiveSync clients and Other clients. Grant: Block access.", fr: "Condition Client apps : Exchange ActiveSync clients et Other clients. Octroi : Block access." }
    - id: d
      text: { en: "Authentication flows condition: Device code flow. Grant: Block access.", fr: "Condition Authentication flows : Device code flow. Octroi : Block access." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Legacy authentication clients are matched by the Client apps condition: Exchange ActiveSync clients covers ActiveSync, and Other clients covers older Office clients and mail protocols such as IMAP, POP and SMTP. With Block access as the grant control, both categories are blocked while modern clients are unaffected.
    fr: |
      Les clients d'authentification héritée sont identifiés par la condition Client apps : Exchange ActiveSync clients couvre ActiveSync, et Other clients couvre les anciens clients Office et les protocoles de messagerie comme IMAP, POP et SMTP. Avec Block access comme contrôle d'octroi, les deux catégories sont bloquées sans affecter les clients modernes.
  options:
    a:
      en: |
        Browser and Mobile apps and desktop clients are the modern authentication categories; blocking them would block normal sign-ins and leave legacy clients untouched.
      fr: |
        Browser et Mobile apps and desktop clients sont les catégories d'authentification moderne ; les bloquer bloquerait les connexions normales sans toucher aux clients hérités.
    b:
      en: |
        Other clients alone leaves Exchange ActiveSync clients that use basic authentication allowed.
      fr: |
        Other clients seul laisse passer les clients Exchange ActiveSync qui utilisent l'authentification de base.
    d:
      en: |
        Device code flow is a modern OAuth flow for input-constrained devices; it is not legacy authentication.
      fr: |
        Le flux de code d'appareil est un flux OAuth moderne pour les appareils sans clavier ; ce n'est pas de l'authentification héritée.
references:
  - title: Block legacy authentication with Conditional Access
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-block-legacy-authentication
