id: sc500-1a-app-github-federation
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys Azure resources from a GitHub Actions workflow that runs on GitHub-hosted runners. The workflow signs in to Azure by using an app registration named **gh-deploy** and a client secret stored as a GitHub secret.

    You need to remove all credentials stored in GitHub. The workflow must keep authenticating as gh-deploy, and there must be no credential to rotate.

    What should you configure on gh-deploy?
  fr: |
    Tailspin Toys déploie des ressources Azure depuis un workflow GitHub Actions exécuté sur des exécuteurs hébergés par GitHub. Le workflow se connecte à Azure avec une inscription d'application nommée **gh-deploy** et une clé secrète client stockée comme secret GitHub.

    Vous devez supprimer toutes les informations d'identification stockées dans GitHub. Le workflow doit continuer à s'authentifier en tant que gh-deploy, et aucune information d'identification ne doit être à renouveler.

    Que devez-vous configurer sur gh-deploy ?
body:
  options:
    - id: a
      text: { en: "A certificate credential whose private key is stored as a GitHub secret", fr: "Un certificat dont la clé privée est stockée comme secret GitHub" }
    - id: b
      text: { en: "A system-assigned managed identity for the GitHub-hosted runners", fr: "Une identité managée affectée par le système pour les exécuteurs hébergés par GitHub" }
    - id: c
      text: { en: "A new client secret with a shorter expiration, retrieved from Azure Key Vault", fr: "Une nouvelle clé secrète client à expiration plus courte, récupérée depuis Azure Key Vault" }
    - id: d
      text: { en: "A federated credential that trusts the GitHub issuer for the repository and environment", fr: "Des informations d'identification fédérées qui approuvent l'émetteur GitHub pour le dépôt et l'environnement" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Workload identity federation lets GitHub Actions exchange its own token for a Microsoft Entra access token, so no secret or certificate is stored or rotated. The federated credential's issuer, subject and audience must match the claims of the GitHub token case-sensitively.
    fr: |
      La fédération d'identité de charge de travail permet à GitHub Actions d'échanger son propre jeton contre un jeton d'accès Microsoft Entra : aucune clé secrète ni aucun certificat n'est stocké ni renouvelé. L'émetteur, le sujet et l'audience des informations d'identification fédérées doivent correspondre aux revendications du jeton GitHub, en respectant la casse.
  options:
    a:
      en: |
        The private key would still be a credential stored in GitHub, and the certificate would expire and need rotation.
      fr: |
        La clé privée resterait une information d'identification stockée dans GitHub, et le certificat expirerait et devrait être renouvelé.
    b:
      en: |
        GitHub-hosted runners are not Azure resources, so they cannot have a system-assigned managed identity.
      fr: |
        Les exécuteurs hébergés par GitHub ne sont pas des ressources Azure : ils ne peuvent pas avoir d'identité managée affectée par le système.
    c:
      en: |
        A client secret still has to be rotated, and the workflow would need another credential to reach Key Vault.
      fr: |
        Une clé secrète client doit toujours être renouvelée, et le workflow aurait besoin d'une autre information d'identification pour accéder à Key Vault.
references:
  - title: Workload identity federation concepts
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
