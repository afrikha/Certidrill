id: sc500-1c-rbac-elevate
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Entra tenant that contains 25 Azure subscriptions. The only user who had the Owner role on the subscriptions has left the company, and nobody else has a role assignment on them. You have the **Global Administrator** role in Microsoft Entra ID, but you cannot see the subscriptions in the Azure portal.

    You need to grant yourself the ability to assign Azure roles on all 25 subscriptions.

    What should you do first?
  fr: |
    Northwind Traders dispose d'un locataire Microsoft Entra qui contient 25 abonnements Azure. Le seul utilisateur qui avait le rôle Owner sur ces abonnements a quitté l'entreprise, et personne d'autre n'a d'attribution de rôle sur ceux-ci. Vous disposez du rôle **Global Administrator** dans Microsoft Entra ID, mais vous ne voyez pas les abonnements dans le portail Azure.

    Vous devez vous donner la possibilité d'attribuer des rôles Azure sur les 25 abonnements.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "In the Microsoft Entra ID properties, set **Access management for Azure resources** to **Yes**.", fr: "Dans les propriétés de Microsoft Entra ID, définir **Access management for Azure resources** sur **Yes**." }
    - id: b
      text: { en: "Assign yourself the **Privileged Role Administrator** role in Microsoft Entra ID.", fr: "Vous attribuer le rôle **Privileged Role Administrator** dans Microsoft Entra ID." }
    - id: c
      text: { en: "Activate an eligible assignment of the Owner role for the subscriptions in Privileged Identity Management.", fr: "Activer une attribution éligible du rôle Owner sur les abonnements dans Privileged Identity Management." }
    - id: d
      text: { en: "Create a management group, and then move the 25 subscriptions into it.", fr: "Créer un groupe d'administration, puis y déplacer les 25 abonnements." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Global Administrator has no access to Azure resources by default. Turning on **Access management for Azure resources** (elevate access) assigns the User Access Administrator role at the root scope (`/`), which lets you assign roles on every subscription and management group of the tenant. Remove the elevated access once you have restored the needed assignments.
    fr: |
      Un Global Administrator n'a par défaut aucun accès aux ressources Azure. Activer **Access management for Azure resources** (élévation d'accès) attribue le rôle User Access Administrator à l'étendue racine (`/`), ce qui permet d'attribuer des rôles sur tous les abonnements et groupes d'administration du locataire. Supprimez l'accès élevé une fois les attributions nécessaires rétablies.
  options:
    b:
      en: Privileged Role Administrator manages Microsoft Entra role assignments; it grants no Azure RBAC permission on subscriptions.
      fr: Privileged Role Administrator gère les attributions de rôles Microsoft Entra ; il n'accorde aucune autorisation Azure RBAC sur les abonnements.
    c:
      en: Nobody has an eligible assignment on the subscriptions, and creating one already requires the right to assign roles there.
      fr: Personne n'a d'attribution éligible sur les abonnements, et en créer une exige déjà le droit d'y attribuer des rôles.
    d:
      en: Moving subscriptions into a management group requires permissions on the subscriptions that you do not have.
      fr: Déplacer des abonnements dans un groupe d'administration nécessite sur ces abonnements des autorisations dont vous ne disposez pas.
references:
  - title: Elevate access to manage all Azure subscriptions and management groups
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin
