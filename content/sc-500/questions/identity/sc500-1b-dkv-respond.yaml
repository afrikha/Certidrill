id: sc500-1b-dkv-respond
objective: "1.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. receives the Microsoft Defender for Key Vault alert **Unusual application accessed a key vault** for a key vault named **kv-fab-pay** that uses the Azure role-based access control (Azure RBAC) permission model.

    The investigation shows that a service principal named **sp-legacy-sync**, which isn't approved to use kv-fab-pay, holds the Key Vault Secrets User role on the vault. The Security page of kv-fab-pay lists four secrets that sp-legacy-sync read during the last 24 hours.

    You need to contain the incident and limit its impact. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. reçoit l'alerte Microsoft Defender for Key Vault **Unusual application accessed a key vault** pour un coffre de clés nommé **kv-fab-pay** qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC).

    L'enquête montre qu'un principal de service nommé **sp-legacy-sync**, non approuvé pour utiliser kv-fab-pay, détient le rôle Key Vault Secrets User sur le coffre. La page Security de kv-fab-pay liste quatre secrets lus par sp-legacy-sync au cours des dernières 24 heures.

    Vous devez contenir l'incident et en limiter l'impact. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Remove the role assignment of sp-legacy-sync on kv-fab-pay.", fr: "Supprimer l'attribution de rôle de sp-legacy-sync sur kv-fab-pay." } }
    - { id: b, text: { en: "Create an alert suppression rule for sp-legacy-sync.", fr: "Créer une règle de suppression d'alertes pour sp-legacy-sync." } }
    - { id: c, text: { en: "Rotate the four secrets, and disable their compromised versions.", fr: "Faire pivoter les quatre secrets, puis désactiver leurs versions compromises." } }
    - { id: d, text: { en: "Enable purge protection on kv-fab-pay.", fr: "Activer la protection contre le vidage sur kv-fab-pay." } }
    - { id: e, text: { en: "Move kv-fab-pay to the Premium pricing tier.", fr: "Passer kv-fab-pay au niveau tarifaire Premium." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      For an unauthorized application, the documented response is to remove its access, here the role assignment, or restrict its operations. Because the secrets were read, their values must be considered compromised: rotate them in the target services and disable or delete the exposed versions in the vault.
    fr: |
      Pour une application non autorisée, la réponse documentée consiste à supprimer son accès, ici l'attribution de rôle, ou à restreindre ses opérations. Comme les secrets ont été lus, leurs valeurs doivent être considérées comme compromises : faites-les pivoter dans les services cibles et désactivez ou supprimez les versions exposées dans le coffre.
  options:
    b:
      en: "A suppression rule only hides future alerts for activity that was confirmed as legitimate; this access isn't approved."
      fr: "Une règle de suppression masque seulement les alertes futures pour une activité confirmée comme légitime ; cet accès n'est pas approuvé."
    d:
      en: "Purge protection prevents permanent deletion; it neither blocks the service principal nor protects the leaked values."
      fr: "La protection contre le vidage empêche la suppression définitive ; elle ne bloque pas le principal de service et ne protège pas les valeurs divulguées."
    e:
      en: "The Premium tier adds HSM-protected keys; it has no effect on who can read secrets."
      fr: "Le niveau Premium ajoute les clés protégées par HSM ; il n'a aucun effet sur qui peut lire les secrets."
references:
  - title: Overview of Microsoft Defender for Key Vault
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-key-vault-introduction
