id: sc500-1a-pim-statements
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is deploying Privileged Identity Management (PIM) for Microsoft Entra roles and for Azure resource roles.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation déploie Privileged Identity Management (PIM) pour les rôles Microsoft Entra et pour les rôles de ressources Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Users who have eligible assignments managed by PIM must be covered by Microsoft Entra ID P2 or Microsoft Entra ID Governance licenses.
        fr: |
          Les utilisateurs qui ont des attributions éligibles gérées par PIM doivent être couverts par des licences Microsoft Entra ID P2 ou Microsoft Entra ID Governance.
    - id: s2
      text:
        en: |
          If you turn on Require approval to activate for an Azure resource role and select no approver, the Owners of the resource become the default approvers.
        fr: |
          Si vous activez Require approval to activate pour un rôle de ressource Azure sans sélectionner d'approbateur, les Owner de la ressource deviennent les approbateurs par défaut.
    - id: s3
      text:
        en: |
          For a Microsoft Entra role, the activation maximum duration can be set between 1 and 24 hours.
        fr: |
          Pour un rôle Microsoft Entra, la durée maximale d'activation peut être définie entre 1 et 24 heures.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      PIM requires Microsoft Entra ID P2 or Microsoft Entra ID Governance licenses for users with eligible or time-bound assignments, and for approvers and reviewers. For Azure resource roles, approval requires at least one approver and there are no default approvers (the default approvers fallback exists only for Microsoft Entra roles). The activation maximum duration slider goes from 1 to 24 hours.
    fr: |
      PIM exige des licences Microsoft Entra ID P2 ou Microsoft Entra ID Governance pour les utilisateurs ayant des attributions éligibles ou limitées dans le temps, ainsi que pour les approbateurs et les réviseurs. Pour les rôles de ressources Azure, l'approbation exige au moins un approbateur et il n'existe pas d'approbateur par défaut (ce repli n'existe que pour les rôles Microsoft Entra). Le curseur de durée maximale d'activation va de 1 à 24 heures.
references:
  - title: Microsoft Entra ID Governance licensing fundamentals
    url: https://learn.microsoft.com/en-us/entra/id-governance/licensing-fundamentals
  - title: Configure Azure resource role settings in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-configure-role-settings
