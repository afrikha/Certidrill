id: sc500-sr1-kv-purge-3
objective: "1.2.2"
type: series_yesno
series: sc500-sr1-kv-purge
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You enable purge protection on KV1.
  fr: Vous activez la protection contre le vidage sur KV1.
body:
  solution:
    en: |
      You enable **purge protection** on KV1.
    fr: |
      Vous activez la **protection contre le vidage** (purge protection) sur KV1.
answer: { value: true }
explanation:
  correct:
    en: |
      With purge protection enabled, a vault or an object in the deleted state cannot be purged until its retention period has passed, but it can still be recovered during that period. Once enabled, purge protection cannot be disabled or overridden by anyone, which also covers the owners of Sub1.
    fr: |
      Lorsque la protection contre le vidage est activée, un coffre ou un objet à l'état supprimé ne peut pas être purgé avant la fin de sa période de rétention, mais il peut toujours être récupéré pendant cette période. Une fois activée, la protection contre le vidage ne peut être ni désactivée ni contournée par quiconque, ce qui inclut les propriétaires de Sub1.
references:
  - title: Azure Key Vault soft-delete
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  - title: Azure Key Vault recovery overview
