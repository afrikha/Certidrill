id: sc500-sr1-pim-approval-3
objective: "1.1.1"
type: series_yesno
series: sc500-sr1-pim-approval
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You create eligible assignments and require approval without selecting approvers.
  fr: Vous créez des attributions éligibles et exigez une approbation sans sélectionner d'approbateur.
body:
  solution:
    en: |
      In PIM, you assign the Security Administrator role to User1, User2 and User3 as **Eligible** assignments. In the role settings, you set **Activation maximum duration** to **4 hours** and you select **Require approval to activate** without selecting any approver. You tell UserA to review the pending requests in PIM.
    fr: |
      Dans PIM, vous attribuez le rôle Security Administrator à User1, User2 et User3 sous forme d'attributions **Eligible**. Dans les paramètres de rôle, vous définissez **Activation maximum duration** sur **4 heures** et vous sélectionnez **Require approval to activate** sans sélectionner d'approbateur. Vous demandez à UserA d'examiner les demandes en attente dans PIM.
answer: { value: false }
explanation:
  correct:
    en: |
      When approval is required but no approver is selected, the default approvers are the users who are active Privileged Role Administrators or Global Administrators. UserA has no administrative role, so UserA cannot approve the requests and the second requirement is not met.
    fr: |
      Lorsque l'approbation est exigée mais qu'aucun approbateur n'est sélectionné, les approbateurs par défaut sont les utilisateurs qui ont une attribution active des rôles Privileged Role Administrator ou Global Administrator. UserA n'a aucun rôle d'administration : il ne peut donc pas approuver les demandes et la deuxième exigence n'est pas respectée.
references:
  - title: Configure Microsoft Entra role settings in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings
