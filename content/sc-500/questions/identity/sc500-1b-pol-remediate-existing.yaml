id: sc500-1b-pol-remediate-existing
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a management group named **MG-Prod**. Last week, you assigned the built-in policy definition **Azure Key Vault should have firewall enabled or public network access disabled** to MG-Prod with the Deny effect.

    Since then, deployments of new key vaults that allow public access from all networks are blocked. However, the compliance page still shows 25 existing key vaults that allow public access from all networks as non-compliant.

    You need the existing key vaults to be reconfigured automatically so that they become compliant. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Adatum Corporation dispose d'un groupe d'administration nommé **MG-Prod**. La semaine dernière, vous avez attribué à MG-Prod la définition de stratégie intégrée **Azure Key Vault should have firewall enabled or public network access disabled** avec l'effet Deny.

    Depuis, les déploiements de nouveaux coffres de clés qui autorisent l'accès public depuis tous les réseaux sont bloqués. Cependant, la page de conformité affiche toujours comme non conformes 25 coffres de clés existants qui autorisent l'accès public depuis tous les réseaux.

    Les coffres de clés existants doivent être reconfigurés automatiquement pour devenir conformes. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a remediation task for the existing Deny assignment.", fr: "Créer une tâche de correction pour l'attribution Deny existante." } }
    - { id: b, text: { en: "Run az policy state trigger-scan on each subscription of MG-Prod.", fr: "Exécuter az policy state trigger-scan sur chaque abonnement de MG-Prod." } }
    - { id: c, text: { en: "Assign Configure Azure Key Vaults with private endpoints to MG-Prod, and create a remediation task.", fr: "Attribuer Configure Azure Key Vaults with private endpoints à MG-Prod, puis créer une tâche de correction." } }
    - { id: d, text: { en: "Assign Configure key vaults to enable firewall to MG-Prod, and create a remediation task.", fr: "Attribuer Configure key vaults to enable firewall à MG-Prod, puis créer une tâche de correction." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Deny effect only blocks non-compliant create and update requests; it never changes existing resources. Configure key vaults to enable firewall uses the Modify effect, and a remediation task applies that modification to the existing vaults by using the assignment's managed identity.
    fr: |
      L'effet Deny bloque seulement les requêtes de création et de mise à jour non conformes ; il ne modifie jamais les ressources existantes. Configure key vaults to enable firewall utilise l'effet Modify, et une tâche de correction applique cette modification aux coffres existants à l'aide de l'identité managée de l'attribution.
  options:
    a:
      en: "Remediation tasks apply only to policies with the deployIfNotExists or modify effect, not to Deny."
      fr: "Les tâches de correction ne s'appliquent qu'aux stratégies avec l'effet deployIfNotExists ou modify, pas à Deny."
    b:
      en: "A compliance scan only re-evaluates the resources; it changes nothing."
      fr: "Une analyse de conformité réévalue seulement les ressources ; elle ne modifie rien."
    c:
      en: "Adding private endpoints doesn't enable the firewall or disable public access, so the vaults would remain non-compliant."
      fr: "Ajouter des points de terminaison privés n'active pas le pare-feu et ne désactive pas l'accès public : les coffres resteraient non conformes."
references:
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
  - title: Azure Policy built-in definitions for Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/policy-reference
