id: sc500-1c-cr-notactions
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a resource group named **rg-web** that contains two virtual machines named **vm-web01** and **vm-web02**. A user named **User1** is a member of a group named **Web-Ops**. The following role assignments exist:

    | Principal | Role | Scope |
    | --- | --- | --- |
    | User1 | VM Manager (custom) | rg-web |
    | Web-Ops | Virtual Machine Contributor | vm-web01 |

    The custom role has `Actions` set to `Microsoft.Compute/virtualMachines/*` and `NotActions` set to `Microsoft.Compute/virtualMachines/delete`. No lock or deny assignment exists.

    Which virtual machines can User1 delete?
  fr: |
    Contoso, Ltd. dispose d'un groupe de ressources nommé **rg-web** qui contient deux machines virtuelles nommées **vm-web01** et **vm-web02**. Un utilisateur nommé **User1** est membre d'un groupe nommé **Web-Ops**. Les attributions de rôles suivantes existent :

    | Principal | Rôle | Étendue |
    | --- | --- | --- |
    | User1 | VM Manager (custom) | rg-web |
    | Web-Ops | Virtual Machine Contributor | vm-web01 |

    Le rôle personnalisé a des `Actions` définies sur `Microsoft.Compute/virtualMachines/*` et des `NotActions` définies sur `Microsoft.Compute/virtualMachines/delete`. Il n'existe aucun verrou ni aucune affectation de refus.

    Quelles machines virtuelles User1 peut-il supprimer ?
body:
  options:
    - id: a
      text: { en: "Neither vm-web01 nor vm-web02", fr: "Ni vm-web01 ni vm-web02" }
    - id: b
      text: { en: "vm-web01 only", fr: "vm-web01 uniquement" }
    - id: c
      text: { en: "vm-web02 only", fr: "vm-web02 uniquement" }
    - id: d
      text: { en: "Both vm-web01 and vm-web02", fr: "vm-web01 et vm-web02" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `NotActions` only subtracts operations from the role that contains it; it is not a deny. Effective permissions are the union of all role assignments, so the Virtual Machine Contributor assignment inherited from Web-Ops grants delete on vm-web01. Nothing grants delete on vm-web02.
    fr: |
      `NotActions` ne fait que soustraire des opérations du rôle qui le contient ; ce n'est pas un refus. Les autorisations effectives sont l'union de toutes les attributions de rôles : l'attribution Virtual Machine Contributor obtenue via Web-Ops accorde la suppression sur vm-web01. Rien n'accorde la suppression sur vm-web02.
  options:
    a:
      en: NotActions does not block an operation granted by another role assignment; only a deny assignment would.
      fr: NotActions ne bloque pas une opération accordée par une autre attribution de rôle ; seule une affectation de refus le ferait.
    c:
      en: The custom role excludes delete on every virtual machine of rg-web, and no other role covers vm-web02.
      fr: Le rôle personnalisé exclut la suppression sur toutes les machines virtuelles de rg-web, et aucun autre rôle ne couvre vm-web02.
    d:
      en: The Virtual Machine Contributor assignment is scoped to vm-web01 only, so it does not grant delete on vm-web02.
      fr: "L'attribution Virtual Machine Contributor est limitée à vm-web01 : elle n'accorde pas la suppression sur vm-web02."
references:
  - title: Understand Azure role definitions
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions
