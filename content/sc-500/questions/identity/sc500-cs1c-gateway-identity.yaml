id: sc500-cs1c-gateway-identity
objective: "1.1.6"
type: single
caseStudy: sc500-cs1c-adatum-legal
difficulty: 1
status: draft
stem:
  en: |-
    You configure apim-adt-ai to obtain a token for https://cognitiveservices.azure.com with its managed identity and to send it in the Authorization header. You need to meet the gateway authentication requirement. Which role should you assign to the managed identity of apim-adt-ai on adt-foundry?
  fr: |-
    Vous configurez apim-adt-ai pour qu'il obtienne un jeton pour https://cognitiveservices.azure.com avec son identité managée et l'envoie dans l'en-tête Authorization. Vous devez satisfaire l'exigence d'authentification de la passerelle. Quel rôle devez-vous attribuer à l'identité managée de apim-adt-ai sur adt-foundry ?
body:
  options:
    - { id: a, text: Cognitive Services OpenAI User }
    - { id: b, text: Cognitive Services OpenAI Contributor }
    - { id: c, text: Cognitive Services Contributor }
    - { id: d, text: Reader }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      API Management obtains the token with the authentication-managed-identity policy, and the identity needs the Cognitive Services OpenAI User role on the Foundry resource to call the model deployments. This role grants the data plane access needed for inference without management permissions, so the API key can then be removed from the named value.
    fr: |-
      API Management obtient le jeton avec la stratégie authentication-managed-identity, et l'identité a besoin du rôle Cognitive Services OpenAI User sur la ressource Foundry pour appeler les déploiements de modèles. Ce rôle accorde l'accès au plan de données nécessaire à l'inférence sans autorisation de gestion : la clé API peut ensuite être retirée de la valeur nommée.
  options:
    b:
      en: |-
        Cognitive Services OpenAI Contributor also lets the identity manage deployments and fine-tuning, which is more than calling the models.
      fr: |-
        Cognitive Services OpenAI Contributor permet aussi de gérer les déploiements et l'ajustement des modèles, ce qui dépasse l'appel des modèles.
    c:
      en: |-
        Cognitive Services Contributor manages the resource, including its keys, which is far more than the gateway needs.
      fr: |-
        Cognitive Services Contributor gère la ressource, y compris ses clés, ce qui dépasse largement les besoins de la passerelle.
    d:
      en: |-
        Reader grants read access to the resource configuration only; it grants no data plane permission to call the models.
      fr: |-
        Reader n'accorde que la lecture de la configuration de la ressource ; il n'accorde aucune autorisation du plan de données pour appeler les modèles.
references:
  - title: Authenticate and Authorize to LLM APIs
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-authenticate-authorize-ai-apis
