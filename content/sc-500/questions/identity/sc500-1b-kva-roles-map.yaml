id: sc500-1b-kva-roles-map
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a key vault named **kv-cts-erp** that uses the Azure role-based access control (Azure RBAC) permission model. You must grant access to kv-cts-erp to four principals. Each principal must receive only the permissions it needs.

    Which role should you assign to each principal? To answer, drag the appropriate roles to the correct principals. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un coffre de clés nommé **kv-cts-erp** qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC). Vous devez accorder l'accès à kv-cts-erp à quatre principaux. Chacun ne doit recevoir que les autorisations dont il a besoin.

    Quel rôle devez-vous attribuer à chaque principal ? Pour répondre, faites glisser les rôles appropriés vers les principaux correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: admin, text: Key Vault Administrator }
    - { id: contrib, text: Key Vault Contributor }
    - { id: suser, text: Key Vault Secrets User }
    - { id: sofficer, text: Key Vault Secrets Officer }
    - { id: reader, text: Key Vault Reader }
    - { id: daa, text: Key Vault Data Access Administrator }
  targets:
    - { id: app, text: { en: "Managed identity of the ERP web app: reads the database password at startup", fr: "Identité managée de l'application web ERP : lit le mot de passe de la base de données au démarrage" } }
    - { id: pipeline, text: { en: "Release pipeline: creates secrets and adds new versions after each deployment", fr: "Pipeline de mise en production : crée des secrets et ajoute de nouvelles versions après chaque déploiement" } }
    - { id: auditor, text: { en: "Auditor: lists the secrets and their expiration dates without reading their values", fr: "Auditeur : liste les secrets et leurs dates d'expiration sans lire leurs valeurs" } }
    - { id: lead, text: { en: "Team lead: grants Key Vault data roles to developers, without accessing the data", fr: "Responsable d'équipe : accorde des rôles de données Key Vault aux développeurs, sans accéder aux données" } }
answer:
  mapping: { app: suser, pipeline: sofficer, auditor: reader, lead: daa }
explanation:
  correct:
    en: |
      Secrets User reads secret contents, and Secrets Officer performs any action on secrets except managing permissions. Key Vault Reader reads the metadata of the vault and its objects, such as names and attributes, but never secret values. Key Vault Data Access Administrator only adds or removes assignments of the Key Vault data roles, constrained by a condition, and grants no data access itself.
    fr: |
      Secrets User lit le contenu des secrets, et Secrets Officer effectue toute action sur les secrets sauf la gestion des autorisations. Key Vault Reader lit les métadonnées du coffre et de ses objets, comme les noms et les attributs, mais jamais les valeurs des secrets. Key Vault Data Access Administrator ajoute ou supprime seulement des attributions des rôles de données Key Vault, sous condition, et n'accorde lui-même aucun accès aux données.
  options:
    admin:
      en: "Key Vault Administrator grants every data plane operation on all objects, which is more than any of the four principals needs."
      fr: "Key Vault Administrator accorde toutes les opérations du plan de données sur tous les objets, plus que ce dont chacun des quatre principaux a besoin."
    contrib:
      en: "Key Vault Contributor manages the vault resource on the control plane; it grants no data access and can't assign roles."
      fr: "Key Vault Contributor gère la ressource coffre dans le plan de contrôle ; il n'accorde aucun accès aux données et ne peut pas attribuer de rôles."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
