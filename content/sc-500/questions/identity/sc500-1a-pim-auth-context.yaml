id: sc500-1a-pim-auth-context
objective: "1.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses Privileged Identity Management (PIM). Members of a group named **GA-Eligible** have eligible assignments of the **Global Administrator** role.

    You need to meet the following requirements when a member of GA-Eligible activates the role:

    - The user must authenticate with a phishing-resistant method.
    - The user must reauthenticate at every activation, even if a recent sign-in already satisfied MFA.

    You create an authentication context named **PIM-GA** in Conditional Access.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Privileged Identity Management (PIM). Les membres d'un groupe nommé **GA-Eligible** ont des attributions éligibles du rôle **Global Administrator**.

    Vous devez respecter les exigences suivantes lorsqu'un membre de GA-Eligible active le rôle :

    - l'utilisateur doit s'authentifier avec une méthode résistante au hameçonnage ;
    - l'utilisateur doit se réauthentifier à chaque activation, même si une connexion récente a déjà satisfait la MFA.

    Vous créez un contexte d'authentification nommé **PIM-GA** dans l'accès conditionnel.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Conditional Access policy, users: GA-Eligible. Target resources: [[target]]
      Grant: [[grant]]
      Session: [[session]]
      PIM role settings of Global Administrator: [[pim]]
    fr: |
      Stratégie d'accès conditionnel, utilisateurs : GA-Eligible. Ressources cibles : [[target]]
      Octroi : [[grant]]
      Session : [[session]]
      Paramètres de rôle PIM de Global Administrator : [[pim]]
  slots:
    - id: target
      options:
        - { id: ctx, text: { en: "Authentication context PIM-GA", fr: "Contexte d'authentification PIM-GA" } }
        - { id: arm, text: Windows Azure Service Management API }
        - { id: portals, text: Microsoft Admin Portals }
        - { id: regsec, text: { en: "User action Register security information", fr: "Action utilisateur Register security information" } }
    - id: grant
      options:
        - { id: mfa, text: Require multifactor authentication }
        - { id: pr, text: "Require authentication strength: Phishing-resistant MFA strength" }
        - { id: pwless, text: "Require authentication strength: Passwordless MFA strength" }
        - { id: compliant, text: Require device to be marked as compliant }
    - id: session
      options:
        - { id: every, text: "Sign-in frequency: Every time" }
        - { id: persist, text: "Persistent browser session: Never persistent" }
        - { id: appenf, text: Use app enforced restrictions }
    - id: pim
      options:
        - { id: onctx, text: "On activation, require Microsoft Entra Conditional Access authentication context" }
        - { id: onmfa, text: "On activation, require multifactor authentication" }
        - { id: just, text: Require justification on activation }
answer:
  values: { target: ctx, grant: pr, session: every, pim: onctx }
explanation:
  correct:
    en: |
      PIM enforces a Conditional Access policy at activation through an authentication context, so the policy targets PIM-GA and the role setting requires that authentication context. Only the Phishing-resistant MFA strength excludes phone sign-in, TAP and password-based combinations, and Sign-in frequency set to Every time forces reauthentication at each activation.
    fr: |
      PIM applique une stratégie d'accès conditionnel lors de l'activation au moyen d'un contexte d'authentification : la stratégie cible PIM-GA et le paramètre de rôle exige ce contexte d'authentification. Seule la force Phishing-resistant MFA strength exclut la connexion par téléphone, le TAP et les combinaisons à base de mot de passe, et Sign-in frequency réglé sur Every time impose une réauthentification à chaque activation.
  options:
    arm:
      en: |
        This target applies when users access Azure Resource Manager and the Azure portal, not when they activate a role in PIM.
      fr: |
        Cette cible s'applique lorsque les utilisateurs accèdent à Azure Resource Manager et au portail Azure, pas lorsqu'ils activent un rôle dans PIM.
    portals: { en: "Targeting admin portals applies at sign-in to those portals, not at PIM activation.", fr: "Cibler les portails d'administration s'applique à la connexion à ces portails, pas à l'activation PIM." }
    mfa: { en: "Plain MFA accepts methods such as SMS or voice, which are not phishing-resistant.", fr: "La MFA simple accepte des méthodes comme le SMS ou l'appel vocal, qui ne résistent pas au hameçonnage." }
    pwless: { en: "Passwordless MFA strength also accepts Microsoft Authenticator phone sign-in, which is not phishing-resistant.", fr: "Passwordless MFA strength accepte aussi la connexion par téléphone Microsoft Authenticator, qui ne résiste pas au hameçonnage." }
    onmfa: { en: "The MFA setting can be satisfied by an earlier MFA in the session and cannot require a specific strength.", fr: "Le paramètre MFA peut être satisfait par une MFA antérieure de la session et ne peut pas exiger une force précise." }
references:
  - title: Configure Microsoft Entra role settings in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings
  - title: Overview of Conditional Access authentication strengths
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-strengths
