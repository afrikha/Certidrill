id: sc500-1b-kva-contributor-policy
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a key vault named **kv-wg-loans** that uses the vault access policy permission model. A web app named **app-loans** reads secrets from kv-wg-loans by using a managed identity that has an access policy with the Get and List secret permissions.

    The members of a group named **Ops-Team** have the Contributor role on the resource group that contains kv-wg-loans. They manage the vault's networking settings and tags. An audit found that an Ops-Team member added an access policy for himself and read secrets.

    You need to ensure that Ops-Team members can keep managing the vault's settings but can't obtain secret values. app-loans must keep reading its secrets.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un coffre de clés nommé **kv-wg-loans** qui utilise le modèle d'autorisation par stratégie d'accès du coffre. Une application web nommée **app-loans** lit les secrets de kv-wg-loans avec une identité managée qui dispose d'une stratégie d'accès avec les autorisations de secret Get et List.

    Les membres d'un groupe nommé **Ops-Team** ont le rôle Contributor sur le groupe de ressources qui contient kv-wg-loans. Ils gèrent les paramètres réseau et les étiquettes du coffre. Un audit a révélé qu'un membre d'Ops-Team s'est ajouté une stratégie d'accès et a lu des secrets.

    Vous devez vous assurer que les membres d'Ops-Team peuvent continuer à gérer les paramètres du coffre mais ne peuvent pas obtenir les valeurs des secrets. app-loans doit continuer à lire ses secrets.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the Contributor assignment of Ops-Team with Key Vault Contributor on kv-wg-loans.", fr: "Remplacer l'attribution Contributor d'Ops-Team par Key Vault Contributor sur kv-wg-loans." } }
    - { id: b, text: { en: "Assign Key Vault Secrets User to the identity of app-loans, and then switch kv-wg-loans to the Azure RBAC permission model.", fr: "Attribuer Key Vault Secrets User à l'identité d'app-loans, puis passer kv-wg-loans au modèle d'autorisation Azure RBAC." } }
    - { id: c, text: { en: "Delete the access policy that the Ops-Team member created, and then apply a ReadOnly lock to kv-wg-loans.", fr: "Supprimer la stratégie d'accès créée par le membre d'Ops-Team, puis appliquer un verrou ReadOnly à kv-wg-loans." } }
    - { id: d, text: { en: "Delete the access policy that the Ops-Team member created, and then enable purge protection on kv-wg-loans.", fr: "Supprimer la stratégie d'accès créée par le membre d'Ops-Team, puis activer la protection contre le vidage sur kv-wg-loans." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With access policies, anyone who can write the vault on the control plane, such as a Contributor, can grant himself data plane access. With the Azure RBAC permission model, data access requires a role assignment, and Contributor can't create role assignments, so Ops-Team keeps managing the vault but reads nothing. Switching invalidates every access policy, so app-loans must receive Key Vault Secrets User first.
    fr: |
      Avec les stratégies d'accès, toute personne qui peut écrire le coffre dans le plan de contrôle, comme un Contributor, peut s'accorder l'accès au plan de données. Avec le modèle Azure RBAC, l'accès aux données exige une attribution de rôle, et Contributor ne peut pas créer d'attributions de rôles : Ops-Team continue à gérer le coffre mais ne lit rien. Le changement de modèle invalide toutes les stratégies d'accès, donc app-loans doit d'abord recevoir Key Vault Secrets User.
  options:
    a:
      en: "Key Vault Contributor includes all vault write actions, including access policy changes, so the member could still grant himself access."
      fr: "Key Vault Contributor inclut toutes les actions d'écriture sur le coffre, y compris la modification des stratégies d'accès : le membre pourrait encore s'accorder l'accès."
    c:
      en: "A ReadOnly lock would also block the networking and tag changes that Ops-Team must keep making."
      fr: "Un verrou ReadOnly bloquerait aussi les modifications de réseau et d'étiquettes qu'Ops-Team doit pouvoir continuer à faire."
    d:
      en: "Purge protection prevents permanent deletion; Ops-Team could add a new access policy again."
      fr: "La protection contre le vidage empêche la suppression définitive ; Ops-Team pourrait de nouveau ajouter une stratégie d'accès."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
