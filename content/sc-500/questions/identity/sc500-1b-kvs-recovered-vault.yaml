id: sc500-1b-kvs-recovered-vault
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a key vault named **kv-adt-hr** that uses the Azure role-based access control (Azure RBAC) permission model. A web app named **app-hr** reads secrets from kv-adt-hr by using its managed identity, which had the Key Vault Secrets User role on the vault. An Azure Function subscribed to the vault's Event Grid events.

    An administrator deleted kv-adt-hr by mistake. Two hours later, you recovered it from **Key vaults > Manage deleted vaults**. The secrets are listed in the vault, but app-hr now receives 403 Forbidden errors when it reads them.

    You need to restore the access of app-hr. What should you do?
  fr: |
    Adatum Corporation dispose d'un coffre de clés nommé **kv-adt-hr** qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC). Une application web nommée **app-hr** lit les secrets de kv-adt-hr avec son identité managée, qui avait le rôle Key Vault Secrets User sur le coffre. Une fonction Azure était abonnée aux événements Event Grid du coffre.

    Un administrateur a supprimé kv-adt-hr par erreur. Deux heures plus tard, vous l'avez récupéré depuis **Key vaults > Manage deleted vaults**. Les secrets apparaissent dans le coffre, mais app-hr reçoit désormais des erreurs 403 Forbidden quand elle les lit.

    Vous devez rétablir l'accès d'app-hr. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Recover each secret of kv-adt-hr from the Manage deleted secrets page.", fr: "Récupérer chaque secret de kv-adt-hr depuis la page Manage deleted secrets." } }
    - { id: b, text: { en: "Assign the Key Vault Secrets User role on kv-adt-hr to the identity of app-hr.", fr: "Attribuer le rôle Key Vault Secrets User sur kv-adt-hr à l'identité d'app-hr." } }
    - { id: c, text: { en: "Enable purge protection on kv-adt-hr, and then restart app-hr.", fr: "Activer la protection contre le vidage sur kv-adt-hr, puis redémarrer app-hr." } }
    - { id: d, text: { en: "Switch kv-adt-hr to the vault access policy permission model.", fr: "Passer kv-adt-hr au modèle d'autorisation par stratégie d'accès du coffre." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Recovering a soft-deleted vault brings back the vault and its objects, but not the integrated services: Azure role assignments and Event Grid subscriptions must be recreated. Assigning Key Vault Secrets User to the app's identity again restores its data plane access (and the Event Grid subscription must also be recreated for the function).
    fr: |
      La récupération d'un coffre supprimé de manière réversible restaure le coffre et ses objets, mais pas les services intégrés : les attributions de rôles Azure et les abonnements Event Grid doivent être recréés. Attribuer de nouveau Key Vault Secrets User à l'identité de l'application rétablit son accès au plan de données (et l'abonnement Event Grid de la fonction doit aussi être recréé).
  options:
    a:
      en: "The secrets were recovered with the vault and are listed; the failure is an authorization problem, not missing objects."
      fr: "Les secrets ont été récupérés avec le coffre et apparaissent ; l'échec est un problème d'autorisation, pas d'objets manquants."
    c:
      en: "Purge protection prevents permanent deletion; it does not grant any access."
      fr: "La protection contre le vidage empêche la suppression définitive ; elle n'accorde aucun accès."
    d:
      en: "Switching models would leave the app with no permission at all, because no access policy exists for it."
      fr: "Changer de modèle laisserait l'application sans aucune autorisation, car aucune stratégie d'accès n'existe pour elle."
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
