id: sc500-sr1-kv-purge-2
objective: "1.2.2"
type: series_yesno
series: sc500-sr1-kv-purge
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You assign a built-in policy with the Deny effect to Sub1.
  fr: Vous attribuez à Sub1 une stratégie intégrée avec l'effet Deny.
body:
  solution:
    en: |
      You assign the built-in Azure Policy definition **Key vaults should have deletion protection enabled** to Sub1 with the effect set to **Deny**. You do not change the properties of KV1.
    fr: |
      Vous attribuez à Sub1 la définition Azure Policy intégrée **Key vaults should have deletion protection enabled** avec l'effet **Deny**. Vous ne modifiez pas les propriétés de KV1.
answer: { value: false }
explanation:
  correct:
    en: |
      The Deny effect blocks create and update requests that would produce a non-compliant key vault, but it does not change an existing vault. KV1 is only reported as non-compliant and keeps purge protection disabled, so its deleted secrets can still be purged. This built-in definition supports only the Audit, Deny and Disabled effects, so no remediation task can enable the setting.
    fr: |
      L'effet Deny bloque les demandes de création et de mise à jour qui produiraient un coffre de clés non conforme, mais il ne modifie pas un coffre existant. KV1 est seulement signalé comme non conforme et sa protection contre le vidage reste désactivée : ses secrets supprimés peuvent toujours être purgés. Cette définition intégrée ne prend en charge que les effets Audit, Deny et Disabled, donc aucune tâche de correction ne peut activer le paramètre.
references:
  - title: Azure Policy built-in definitions for Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/policy-reference
  - title: Azure Key Vault soft-delete
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
