stem:
  en: You create active assignments and require approval to activate.
  fr: Vous créez des attributions actives et exigez une approbation pour l'activation.
body:
  solution:
    en: |
      In PIM, you assign the Security Administrator role to User1, User2 and User3 as **Active** assignments that expire after six months. In the role settings, you set **Activation maximum duration** to **4 hours**, you select **Require approval to activate**, and you select UserA as the approver.
    fr: |
      Dans PIM, vous attribuez le rôle Security Administrator à User1, User2 et User3 sous forme d'attributions **Active** qui expirent au bout de six mois. Dans les paramètres de rôle, vous définissez **Activation maximum duration** sur **4 heures**, vous sélectionnez **Require approval to activate** et vous sélectionnez UserA comme approbateur.
answer: { value: false }
explanation:
  correct:
    en: |
      An active assignment gives the role immediately for the whole assignment period: the users never activate it, so the activation settings (approval and maximum duration) never apply. Only eligible assignments must be activated, and only their activation can require approval.
    fr: |
      Une attribution active accorde le rôle immédiatement pour toute la durée de l'attribution : les utilisateurs ne l'activent jamais, donc les paramètres d'activation (approbation et durée maximale) ne s'appliquent pas. Seules les attributions éligibles doivent être activées, et seule leur activation peut exiger une approbation.
references:
  - title: Configure Microsoft Entra role settings in PIM
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings
