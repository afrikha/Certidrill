id: sc500-1c-cr-json-blob
objective: "1.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure subscription that contains a resource group named **rg-finance**. You are creating an Azure custom role for auditors. The role must meet the following requirements:

    - Auditors can list the containers of the storage accounts and read blobs by using their Microsoft Entra identity.
    - Auditors cannot obtain the storage account access keys.
    - The role can be assigned only within rg-finance.

    How should you complete the role definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un abonnement Azure qui contient un groupe de ressources nommé **rg-finance**. Vous créez un rôle personnalisé Azure pour les auditeurs. Le rôle doit répondre aux exigences suivantes :

    - Les auditeurs peuvent lister les conteneurs des comptes de stockage et lire les objets blob avec leur identité Microsoft Entra.
    - Les auditeurs ne peuvent pas obtenir les clés d'accès des comptes de stockage.
    - Le rôle ne peut être attribué qu'à l'intérieur de rg-finance.

    Comment devez-vous compléter la définition de rôle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "Name": "Finance Blob Auditor (custom)",
      "IsCustom": true,
      "Description": "List containers and read blobs in rg-finance.",
      "Actions": [
        [[act]]
      ],
      "NotActions": [],
      [[data]]: [
        "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read"
      ],
      "NotDataActions": [],
      "AssignableScopes": [
        [[scope]]
      ]
    }
  slots:
    - id: act
      options:
        - { id: keys, text: "\"Microsoft.Storage/storageAccounts/listKeys/action\"" }
        - { id: all, text: "\"Microsoft.Storage/storageAccounts/*\"" }
        - { id: cont, text: "\"Microsoft.Storage/storageAccounts/blobServices/containers/read\"" }
    - id: data
      options:
        - { id: dataactions, text: "\"DataActions\"" }
        - { id: notdata, text: "\"NotDataActions\"" }
        - { id: perms, text: "\"Permissions\"" }
    - id: scope
      options:
        - { id: root, text: "\"/\"" }
        - { id: rg, text: "\"/subscriptions/<subscription id>/resourceGroups/rg-finance\"" }
        - { id: sub, text: "\"/subscriptions/<subscription id>\"" }
answer:
  values: { act: cont, data: dataactions, scope: rg }
explanation:
  correct:
    en: |
      Listing containers is a control plane read action, so `containers/read` goes in `Actions`. Reading blob content is a data plane operation, which must be listed in `DataActions`. Setting `AssignableScopes` to the rg-finance resource group ID makes the role available for assignment only at that resource group and below.
    fr: |
      Lister les conteneurs est une action de lecture du plan de contrôle : `containers/read` va dans `Actions`. Lire le contenu des objets blob est une opération du plan de données, qui doit figurer dans `DataActions`. Définir `AssignableScopes` avec l'ID du groupe de ressources rg-finance ne rend le rôle attribuable qu'à ce groupe de ressources et en dessous.
  options:
    keys: { en: "listKeys returns the account keys, which gives full access to the data and breaks the requirement.", fr: "listKeys renvoie les clés du compte, ce qui donne un accès complet aux données et enfreint l'exigence." }
    all: { en: "The wildcard includes listKeys and every write and delete operation on storage accounts.", fr: "Le caractère générique inclut listKeys et toutes les opérations d'écriture et de suppression sur les comptes de stockage." }
    notdata: { en: "NotDataActions subtracts data operations from those granted; it grants nothing.", fr: "NotDataActions soustrait des opérations de données à celles accordées ; il n'accorde rien." }
    perms: { en: "Permissions is not a property of the custom role definition file used by Azure CLI and PowerShell.", fr: "Permissions n'est pas une propriété du fichier de définition de rôle personnalisé utilisé par Azure CLI et PowerShell." }
    root: { en: "The root scope can't be used in the AssignableScopes of a custom role, and it would not restrict the role to rg-finance.", fr: "L'étendue racine ne peut pas figurer dans les AssignableScopes d'un rôle personnalisé, et elle ne limiterait pas le rôle à rg-finance." }
    sub: { en: "The subscription scope would make the role assignable on every resource group of the subscription.", fr: "L'étendue de l'abonnement rendrait le rôle attribuable sur tous les groupes de ressources de l'abonnement." }
references:
  - title: Azure custom roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  - title: Understand Azure role definitions
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions
