id: sc500-1c-std-features-map
objective: "1.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Defender for Cloud with Defender CSPM enabled on its Azure subscriptions and on an AWS account connected through a connector. The Microsoft cloud security benchmark is assigned everywhere.

    You need to meet the requirements listed in the answer area.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Defender for Cloud avec Defender CSPM activé sur ses abonnements Azure et sur un compte AWS connecté par un connecteur. Le Microsoft cloud security benchmark est attribué partout.

    Vous devez répondre aux exigences présentées dans la zone de réponse.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: deny, text: { en: "Set the recommendation's effect to Deny", fr: "Définir l'effet de la recommandation sur Deny" } }
    - { id: enforce, text: { en: "Select Enforce on the recommendation details page", fr: "Sélectionner Enforce dans la page de détails de la recommandation" } }
    - { id: waiver, text: { en: "Exemption with the waiver category", fr: "Exemption avec la catégorie waiver" } }
    - { id: kql, text: { en: "Custom recommendation based on a KQL query", fr: "Recommandation personnalisée fondée sur une requête KQL" } }
    - { id: export, text: { en: "Continuous export to a Log Analytics workspace", fr: "Exportation continue vers un espace de travail Log Analytics" } }
    - { id: workflow, text: { en: "Workflow automation", fr: "Automatisation de workflow" } }
  targets:
    - { id: t1, text: { en: "Block the creation of new Azure storage accounts that don't meet a benchmark recommendation", fr: "Bloquer la création de nouveaux comptes de stockage Azure qui ne respectent pas une recommandation du benchmark" } }
    - { id: t2, text: { en: "Automatically remediate new Azure resources that are non-compliant when they are created, by using DeployIfNotExists", fr: "Corriger automatiquement les nouvelles ressources Azure non conformes dès leur création, à l'aide de DeployIfNotExists" } }
    - { id: t3, text: { en: "Stop flagging a test subscription for a recommendation whose risk the business has accepted", fr: "Ne plus signaler un abonnement de test pour une recommandation dont l'entreprise a accepté le risque" } }
    - { id: t4, text: { en: "Flag Azure and AWS resources that lack a DataOwner tag, with a severity and remediation steps", fr: "Signaler les ressources Azure et AWS dépourvues d'étiquette DataOwner, avec une gravité et des étapes de correction" } }
answer:
  mapping: { t1: deny, t2: enforce, t3: waiver, t4: kql }
explanation:
  correct:
    en: |
      Deny prevents the deployment of Azure resources that don't comply with the recommendation, while Enforce uses DeployIfNotExists to remediate non-compliant resources when they are created; both apply to a subset of Azure recommendations. An exemption with the waiver (risk accepted) category stops the recommendation from flagging the scope. A custom recommendation written in KQL (Defender CSPM) can evaluate Azure, AWS and GCP resources and carries a severity and remediation text.
    fr: |
      Deny empêche le déploiement de ressources Azure qui ne respectent pas la recommandation, tandis qu'Enforce utilise DeployIfNotExists pour corriger les ressources non conformes à leur création ; les deux s'appliquent à un sous-ensemble de recommandations Azure. Une exemption de catégorie waiver (risque accepté) empêche la recommandation de signaler l'étendue. Une recommandation personnalisée écrite en KQL (Defender CSPM) peut évaluer des ressources Azure, AWS et GCP, avec une gravité et un texte de correction.
  options:
    export:
      en: Continuous export copies findings to a workspace; it neither blocks, remediates nor creates recommendations.
      fr: L'exportation continue copie les résultats vers un espace de travail ; elle ne bloque pas, ne corrige pas et ne crée pas de recommandations.
    workflow:
      en: Workflow automation runs a logic app after a finding appears; it does not block deployments or define new checks.
      fr: L'automatisation de workflow exécute une application logique après l'apparition d'un résultat ; elle ne bloque pas les déploiements et ne définit pas de nouveaux contrôles.
references:
  - title: Manage MCSB recommendations in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/prevent-misconfigurations
  - title: Create custom standards and recommendations in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/create-custom-recommendations
