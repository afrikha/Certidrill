id: sc500-cs3b-playbook-identity
objective: "1.1.6"
type: single
caseStudy: sc500-cs3b-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |-
    You need to reconfigure the authentication of pb-close-noise to meet the requirements. What should you do?
  fr: |-
    Vous devez reconfigurer l'authentification de pb-close-noise pour respecter les exigences. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the system-assigned managed identity of pb-close-noise and assign it the Microsoft Sentinel Reader role on law-soc.", fr: "Activer l'identité managée affectée par le système de pb-close-noise et lui attribuer le rôle Microsoft Sentinel Reader sur law-soc." } }
    - { id: b, text: { en: "Enable the system-assigned managed identity of pb-close-noise and assign it the Microsoft Sentinel Responder role on law-soc.", fr: "Activer l'identité managée affectée par le système de pb-close-noise et lui attribuer le rôle Microsoft Sentinel Responder sur law-soc." } }
    - { id: c, text: { en: "Enable the system-assigned managed identity of pb-close-noise and assign it the Microsoft Sentinel Automation Contributor role on law-soc.", fr: "Activer l'identité managée affectée par le système de pb-close-noise et lui attribuer le rôle Microsoft Sentinel Automation Contributor sur law-soc." } }
    - { id: d, text: { en: "Create an app registration with a client secret and assign the service principal the Microsoft Sentinel Responder role on law-soc.", fr: "Créer une inscription d'application avec une clé secrète client et attribuer au principal de service le rôle Microsoft Sentinel Responder sur law-soc." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A managed identity removes the user account and the stored credential, and the Microsoft Sentinel connector can connect with it. Adding comments and closing incidents are write actions on incidents, which Microsoft Sentinel Responder allows on the workspace; Microsoft Sentinel Contributor would also work but grants more than needed.
    fr: |-
      Une identité managée supprime le compte d'utilisateur et les informations d'identification stockées, et le connecteur Microsoft Sentinel peut se connecter avec elle. Ajouter des commentaires et fermer des incidents sont des actions d'écriture sur les incidents, que Microsoft Sentinel Responder autorise sur l'espace de travail ; Microsoft Sentinel Contributor fonctionnerait aussi mais accorde plus que nécessaire.
  options:
    a:
      en: |-
        Microsoft Sentinel Reader lets the playbook receive incidents and read data, but not update incidents or add comments.
      fr: |-
        Microsoft Sentinel Reader permet au playbook de recevoir les incidents et de lire les données, mais pas de mettre à jour des incidents ni d'ajouter des commentaires.
    c:
      en: |-
        Microsoft Sentinel Automation Contributor is the role given to Microsoft Sentinel so that automation rules can run playbooks; it does not let the playbook update incidents.
      fr: |-
        Microsoft Sentinel Automation Contributor est le rôle donné à Microsoft Sentinel pour que les règles d'automatisation puissent exécuter des playbooks ; il ne permet pas au playbook de mettre à jour les incidents.
    d:
      en: |-
        A client secret is a stored credential that must be protected and rotated, which the requirement excludes.
      fr: |-
        Une clé secrète client est une information d'identification stockée qu'il faut protéger et renouveler, ce que l'exigence exclut.
references:
  - title: Authenticate playbooks to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/authenticate-playbooks-to-sentinel
