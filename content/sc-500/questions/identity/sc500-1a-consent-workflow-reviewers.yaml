id: sc500-1a-consent-workflow-reviewers
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders enables the admin consent workflow. The reviewers are configured as follows:

    | Reviewer | Microsoft Entra role |
    | --- | --- |
    | User1 | None |
    | User2 | Cloud Application Administrator |

    Users submit two requests:

    - **AppX** requests delegated Microsoft Graph permissions that require admin consent.
    - **AppY** requests Microsoft Graph application permissions.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders active le workflow de consentement administrateur. Les réviseurs sont configurés comme suit :

    | Réviseur | Rôle Microsoft Entra |
    | --- | --- |
    | User1 | Aucun |
    | User2 | Cloud Application Administrator |

    Des utilisateurs soumettent deux demandes :

    - **AppX** demande des autorisations déléguées Microsoft Graph qui nécessitent le consentement administrateur ;
    - **AppY** demande des autorisations d'application Microsoft Graph.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "User1 can approve the request for AppX.", fr: "User1 peut approuver la demande pour AppX." } }
    - { id: b, text: { en: "User1 can deny the request for AppX.", fr: "User1 peut refuser la demande pour AppX." } }
    - { id: c, text: { en: "User2 can approve the request for AppX.", fr: "User2 peut approuver la demande pour AppX." } }
    - { id: d, text: { en: "User2 can approve the request for AppY.", fr: "User2 peut approuver la demande pour AppY." } }
    - { id: e, text: { en: "The requests remain valid until a reviewer acts on them.", fr: "Les demandes restent valides jusqu'à ce qu'un réviseur les traite." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Any reviewer can view, block or deny requests, but approving one requires the permissions to grant admin consent for that app; being designated as a reviewer does not elevate privileges. Cloud Application Administrator can grant consent for any permission except Microsoft Graph app roles (application permissions), so User2 can approve AppX.
    fr: |
      Tout réviseur peut consulter, bloquer ou refuser des demandes, mais en approuver une exige les autorisations nécessaires pour accorder le consentement administrateur à cette application ; être désigné réviseur n'élève pas les privilèges. Cloud Application Administrator peut consentir à toute autorisation sauf aux rôles d'application Microsoft Graph (autorisations d'application) : User2 peut donc approuver AppX.
  options:
    a:
      en: |
        User1 holds no role that can grant admin consent, so User1 cannot approve.
      fr: |
        User1 ne détient aucun rôle permettant d'accorder le consentement administrateur : il ne peut pas approuver.
    d:
      en: |
        Microsoft Graph application permissions are the exception for Cloud Application Administrator; a more privileged role must approve AppY.
      fr: |
        Les autorisations d'application Microsoft Graph sont l'exception pour Cloud Application Administrator ; un rôle plus privilégié doit approuver AppY.
    e:
      en: |
        The Consent request expires after (days) setting defines how long requests stay valid.
      fr: |
        Le paramètre Consent request expires after (days) définit la durée de validité des demandes.
references:
  - title: Configure the admin consent workflow
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-admin-consent-workflow
  - title: Grant tenant-wide admin consent to an application
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/grant-admin-consent
