id: sc500-1b-kva-migrate-rbac
objective: "1.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a key vault named **kv-adt-crm** that uses the vault access policy permission model. Six applications and two administrators have access policies on kv-adt-crm.

    You are an Owner of kv-adt-crm. You need to move kv-adt-crm to the Azure role-based access control (Azure RBAC) permission model. No application may lose access to the vault at any time.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation dispose d'un coffre de clés nommé **kv-adt-crm** qui utilise le modèle d'autorisation par stratégie d'accès du coffre. Six applications et deux administrateurs ont des stratégies d'accès sur kv-adt-crm.

    Vous êtes Owner de kv-adt-crm. Vous devez faire passer kv-adt-crm au modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC). Aucune application ne doit perdre l'accès au coffre à aucun moment.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: inventory, text: { en: "Record the principals and permissions of each access policy.", fr: "Relever les principaux et les autorisations de chaque stratégie d'accès." } }
    - { id: assign, text: { en: "Assign each principal the Key Vault data role that matches its permissions, at the vault scope.", fr: "Attribuer à chaque principal le rôle de données Key Vault correspondant à ses autorisations, dans l'étendue du coffre." } }
    - { id: switch, text: { en: "In Access configuration, set the permission model to Azure role-based access control.", fr: "Dans Access configuration, définir le modèle d'autorisation sur Azure role-based access control." } }
    - { id: delete, text: { en: "Delete every access policy of kv-adt-crm.", fr: "Supprimer toutes les stratégies d'accès de kv-adt-crm." } }
    - { id: kvc, text: { en: "Assign Key Vault Contributor to each application identity.", fr: "Attribuer Key Vault Contributor à l'identité de chaque application." } }
    - { id: purge, text: { en: "Enable purge protection on kv-adt-crm.", fr: "Activer la protection contre le vidage sur kv-adt-crm." } }
answer:
  sequence: [ inventory, assign, switch ]
explanation:
  correct:
    en: |
      Setting the Azure RBAC permission model invalidates all access policy permissions at once, so the equivalent roles must exist before the switch. You first map each access policy to a data role (for example Get and List on secrets to Key Vault Secrets User), assign those roles at the vault scope, and only then change the permission model.
    fr: |
      Passer au modèle Azure RBAC invalide d'un coup toutes les autorisations des stratégies d'accès : les rôles équivalents doivent donc exister avant le changement. Vous associez d'abord chaque stratégie d'accès à un rôle de données (par exemple Get et List sur les secrets correspondent à Key Vault Secrets User), vous attribuez ces rôles dans l'étendue du coffre, puis seulement vous changez le modèle d'autorisation.
  options:
    delete: { en: "Deleting the access policies before the switch would cut access; after the switch they are ignored anyway.", fr: "Supprimer les stratégies d'accès avant le changement couperait l'accès ; après le changement, elles sont de toute façon ignorées." }
    kvc: { en: "Key Vault Contributor is a control plane role that grants no access to secrets, keys or certificates.", fr: "Key Vault Contributor est un rôle du plan de contrôle qui n'accorde aucun accès aux secrets, clés ou certificats." }
    purge: { en: "Purge protection is unrelated to the permission model.", fr: "La protection contre le vidage n'a aucun rapport avec le modèle d'autorisation." }
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
