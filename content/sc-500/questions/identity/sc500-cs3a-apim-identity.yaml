id: sc500-cs3a-apim-identity
objective: "1.1.6"
type: ordering
caseStudy: sc500-cs3a-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to configure the authentication between apim-trey and fdy-trey. The solution must meet the requirements.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez configurer l'authentification entre apim-trey et fdy-trey. La solution doit respecter les exigences.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: mi, text: { en: "Enable the system-assigned managed identity of apim-trey.", fr: "Activer l'identité managée affectée par le système de apim-trey." } }
    - { id: role, text: { en: "Assign the Cognitive Services OpenAI User role to the identity on fdy-trey.", fr: "Attribuer le rôle Cognitive Services OpenAI User à l'identité sur fdy-trey." } }
    - { id: pol, text: { en: "Add the authentication-managed-identity policy to the inbound section of the API.", fr: "Ajouter la stratégie authentication-managed-identity à la section inbound de l'API." } }
    - { id: contrib, text: { en: "Assign the Cognitive Services Contributor role to the identity on fdy-trey.", fr: "Attribuer le rôle Cognitive Services Contributor à l'identité sur fdy-trey." } }
    - { id: nv, text: { en: "Store the API key of fdy-trey in a Key Vault-backed named value.", fr: "Stocker la clé API de fdy-trey dans une valeur nommée référençant Key Vault." } }
    - { id: app, text: { en: "Create an app registration with a client secret for apim-trey.", fr: "Créer une inscription d'application avec une clé secrète client pour apim-trey." } }
answer:
  sequence: [ mi, role, pol ]
explanation:
  correct:
    en: |-
      The API Management instance first needs a managed identity. The identity is then granted the Cognitive Services OpenAI User role on the Foundry resource, which allows inference calls. Finally, the authentication-managed-identity policy obtains a token for https://cognitiveservices.azure.com and the request sends it in the Authorization header, so no key or secret is used.
    fr: |-
      L'instance API Management a d'abord besoin d'une identité managée. Cette identité reçoit ensuite le rôle Cognitive Services OpenAI User sur la ressource Foundry, qui autorise les appels d'inférence. Enfin, la stratégie authentication-managed-identity obtient un jeton pour https://cognitiveservices.azure.com et la requête l'envoie dans l'en-tête Authorization : aucune clé ni aucun secret n'est utilisé.
  options:
    contrib:
      en: |-
        Cognitive Services Contributor manages the resource (control plane); it is broader than needed and is not the role that the documentation assigns for inference calls.
      fr: |-
        Cognitive Services Contributor gère la ressource (plan de contrôle) ; ce rôle est plus large que nécessaire et n'est pas celui que la documentation attribue pour les appels d'inférence.
    nv:
      en: |-
        A named value that stores the API key still authenticates with a key, which the requirements forbid.
      fr: |-
        Une valeur nommée qui stocke la clé API authentifie toujours par clé, ce que les exigences interdisent.
    app:
      en: |-
        An app registration with a client secret introduces a secret to store and rotate; a managed identity avoids it.
      fr: |-
        Une inscription d'application avec une clé secrète client introduit un secret à stocker et à renouveler ; une identité managée l'évite.
references:
  - title: Authenticate and Authorize to LLM APIs
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-authenticate-authorize-azure-openai
