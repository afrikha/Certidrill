id: sc500-1c-op-cli-owners
objective: "1.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has an Azure subscription whose ID is stored in the `subId` variable. The subscription is in a management group hierarchy, and some Owner assignments are made at management group level.

    You need to write an Azure CLI script that:

    - lists every Owner assignment that applies to the subscription, including the assignments inherited from management groups;
    - removes the Owner assignment of the guest user **tom@tailspintoys.com** at the subscription scope.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'un abonnement Azure dont l'ID est stocké dans la variable `subId`. L'abonnement fait partie d'une hiérarchie de groupes d'administration, et certaines attributions Owner sont faites au niveau des groupes d'administration.

    Vous devez écrire un script Azure CLI qui :

    - liste toutes les attributions Owner qui s'appliquent à l'abonnement, y compris celles héritées des groupes d'administration ;
    - supprime l'attribution Owner de l'utilisateur invité **tom@tailspintoys.com** à l'étendue de l'abonnement.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az role assignment list --role Owner \
      --scope /subscriptions/$subId [[inh]] --output table

    az role assignment [[op]] --assignee tom@tailspintoys.com \
      --role Owner --scope /subscriptions/$subId
  slots:
    - id: inh
      options:
        - { id: all, text: "--all" }
        - { id: inherited, text: "--include-inherited" }
        - { id: groups, text: "--include-groups" }
    - id: op
      options:
        - { id: update, text: update }
        - { id: create, text: create }
        - { id: delete, text: delete }
answer:
  values: { inh: inherited, op: delete }
explanation:
  correct:
    en: |
      `--include-inherited` adds the assignments made at parent scopes (management groups) to those made directly at the subscription scope. `az role assignment delete` with the assignee, role and scope removes the matching assignment.
    fr: |
      `--include-inherited` ajoute les attributions faites aux étendues parentes (groupes d'administration) à celles faites directement à l'étendue de l'abonnement. `az role assignment delete` avec le principal, le rôle et l'étendue supprime l'attribution correspondante.
  options:
    all: { en: "--all lists assignments at and below the subscription (resource groups, resources), not those inherited from management groups.", fr: "--all liste les attributions de l'abonnement et des étendues inférieures (groupes de ressources, ressources), pas celles héritées des groupes d'administration." }
    groups: { en: "--include-groups adds assignments of the groups an assignee belongs to; it is used with --assignee and does not include parent scopes.", fr: "--include-groups ajoute les attributions des groupes dont un principal est membre ; il s'utilise avec --assignee et n'inclut pas les étendues parentes." }
    update: { en: "az role assignment update changes properties such as the description or condition; it does not remove the assignment.", fr: "az role assignment update modifie des propriétés comme la description ou la condition ; il ne supprime pas l'attribution." }
    create: { en: "create adds a new assignment instead of removing one.", fr: "create ajoute une attribution au lieu d'en supprimer une." }
references:
  - title: az role assignment
    url: https://learn.microsoft.com/en-us/cli/azure/role/assignment
