id: sc500-cs1b-vault-purge
objective: "1.2.2"
type: single
caseStudy: sc500-cs1b-proseware
difficulty: 2
status: draft
stem:
  en: |-
    You need to create kv-pw-suppliers to meet the secret requirement. What should you do?
  fr: |-
    Vous devez créer kv-pw-suppliers pour satisfaire l'exigence relative aux secrets. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create the vault with the default soft-delete retention period and enable purge protection", fr: "Créer le coffre avec la période de rétention par défaut de la suppression réversible et activer la protection contre le vidage" } }
    - { id: b, text: { en: "Create the vault with a soft-delete retention period of 30 days and enable purge protection", fr: "Créer le coffre avec une période de rétention de la suppression réversible de 30 jours et activer la protection contre le vidage" } }
    - { id: c, text: { en: "Create the vault with a soft-delete retention period of 30 days and assign the Key Vault Purge Operator role to nobody", fr: "Créer le coffre avec une période de rétention de la suppression réversible de 30 jours et n'attribuer le rôle Key Vault Purge Operator à personne" } }
    - { id: d, text: { en: "Create the vault with a soft-delete retention period of 30 days and apply a CanNotDelete lock to the vault", fr: "Créer le coffre avec une période de rétention de la suppression réversible de 30 jours et appliquer un verrou CanNotDelete au coffre" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The soft-delete retention period, from 7 to 90 days, sets how long deleted secrets stay recoverable before they are purged, and it cannot be changed after it is saved. With purge protection enabled, no role or permission can purge a deleted secret before the retention period elapses, and purge protection cannot be disabled afterwards.
    fr: |-
      La période de rétention de la suppression réversible, de 7 à 90 jours, fixe la durée pendant laquelle les secrets supprimés restent récupérables avant d'être vidés, et elle ne peut plus être modifiée une fois enregistrée. Avec la protection contre le vidage activée, aucun rôle ni aucune autorisation ne permet de vider un secret supprimé avant la fin de la période de rétention, et la protection ne peut plus être désactivée ensuite.
  options:
    a:
      en: |-
        The default retention period is 90 days, so deleted secrets would be kept for 90 days instead of being purged after 30 days.
      fr: |-
        La période de rétention par défaut est de 90 jours : les secrets supprimés seraient conservés 90 jours au lieu d'être vidés au bout de 30 jours.
    c:
      en: |-
        Without purge protection, a subscription Owner can assign itself a role that includes the purge permission, such as Key Vault Administrator, and purge deleted secrets before the retention period ends.
      fr: |-
        Sans protection contre le vidage, un Owner de l'abonnement peut s'attribuer un rôle qui inclut l'autorisation de vidage, comme Key Vault Administrator, et vider des secrets supprimés avant la fin de la période de rétention.
    d:
      en: |-
        A resource lock protects the vault resource against deletion, not the secrets: purging a deleted secret is a data plane operation that the lock does not block.
      fr: |-
        Un verrou de ressource protège la ressource coffre contre la suppression, pas les secrets : vider un secret supprimé est une opération du plan de données que le verrou ne bloque pas.
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  - title: Azure Key Vault recovery management with soft delete and purge protection
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/key-vault-recovery
