id: sc500-1b-dkv-tools-map
objective: "1.2.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. is defining the security controls for the secrets used by its Azure workloads. The security team lists three requirements.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. définit les contrôles de sécurité des secrets utilisés par ses charges de travail Azure. L'équipe sécurité énumère trois exigences.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dkv, text: Microsoft Defender for Key Vault }
    - { id: cspm, text: { en: "Defender CSPM agentless secrets scanning", fr: "Analyse sans agent des secrets de Defender CSPM" } }
    - { id: policy, text: Azure Policy }
    - { id: eventgrid, text: { en: "Event Grid subscriptions on the key vaults", fr: "Abonnements Event Grid sur les coffres de clés" } }
    - { id: dstorage, text: Microsoft Defender for Storage }
  targets:
    - { id: anomaly, text: { en: "Raise an alert when an unusual application suddenly reads secrets from a key vault", fr: "Déclencher une alerte quand une application inhabituelle lit soudain des secrets dans un coffre de clés" } }
    - { id: disks, text: { en: "Find SSH private keys left in plaintext on the disks of virtual machines", fr: "Trouver les clés privées SSH laissées en texte clair sur les disques des machines virtuelles" } }
    - { id: deny, text: { en: "Block the creation of key vaults that don't have deletion protection (purge protection) enabled", fr: "Bloquer la création de coffres de clés dont la protection contre la suppression (protection contre le vidage) n'est pas activée" } }
answer:
  mapping: { anomaly: dkv, disks: cspm, deny: policy }
explanation:
  correct:
    en: |
      Defender for Key Vault raises alerts such as Unusual application accessed a key vault. Defender CSPM, or Defender for Servers Plan 2, scans VM disk snapshots for plaintext secrets such as insecure SSH private keys. Azure Policy blocks non-compliant deployments, for example with the built-in definition Key vaults should have deletion protection enabled assigned with the Deny effect.
    fr: |
      Defender for Key Vault déclenche des alertes comme Unusual application accessed a key vault. Defender CSPM, ou Defender for Servers Plan 2, analyse les instantanés de disque des VM à la recherche de secrets en texte clair comme les clés privées SSH non sécurisées. Azure Policy bloque les déploiements non conformes, par exemple avec la définition intégrée Key vaults should have deletion protection enabled attribuée avec l'effet Deny.
  options:
    eventgrid:
      en: "Key Vault events report life cycle changes such as new versions or near expiry; they don't detect anomalous access or block deployments."
      fr: "Les événements Key Vault signalent les changements de cycle de vie comme les nouvelles versions ou l'expiration proche ; ils ne détectent pas les accès anormaux et ne bloquent pas les déploiements."
    dstorage:
      en: "Defender for Storage protects storage accounts, not key vaults or VM disks."
      fr: "Defender for Storage protège les comptes de stockage, pas les coffres de clés ni les disques des VM."
references:
  - title: Alerts for Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-azure-key-vault
  - title: Azure Policy built-in definitions for Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/policy-reference
