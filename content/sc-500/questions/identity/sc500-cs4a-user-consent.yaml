id: sc500-cs4a-user-consent
objective: "1.1.5"
type: yesno_statements
caseStudy: sc500-cs4a-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You plan to change the user consent setting of the tenant to **Allow user consent for apps from verified publishers, for selected permissions** to meet the consent requirement. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de remplacer le paramètre de consentement de l'utilisateur du locataire par **Allow user consent for apps from verified publishers, for selected permissions** pour respecter l'exigence de consentement. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          After you change the setting, the consents that the travel advisors already granted to apps from unverified publishers are revoked.
        fr: |
          Après la modification du paramètre, les consentements que les conseillers voyage ont déjà accordés à des applications d'éditeurs non vérifiés sont révoqués.
    - id: s2
      text:
        en: |
          A cloud security engineer who has only the Privileged Role Administrator role can change the setting by using Microsoft Graph.
        fr: |
          Un ingénieur de sécurité cloud qui dispose uniquement du rôle Privileged Role Administrator peut modifier le paramètre à l'aide de Microsoft Graph.
    - id: s3
      text:
        en: |
          If an app from a verified publisher requires user assignment, an assigned advisor can consent to its low-impact permissions.
        fr: |
          Si une application d'un éditeur vérifié exige l'affectation des utilisateurs, un conseiller affecté peut donner son consentement à ses autorisations à faible impact.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A change to the user consent setting affects only future consent operations; existing grants remain and must be reviewed and revoked separately. Configuring user consent requires the Privileged Role Administrator role; Global Administrator is needed only to do it in the Microsoft Entra admin center. An application that requires user assignment must have its permissions consented to by an administrator, even when the user consent policy would otherwise allow the user to consent.
    fr: |
      Une modification du paramètre de consentement de l'utilisateur n'affecte que les futures opérations de consentement ; les octrois existants sont conservés et doivent être examinés et révoqués séparément. La configuration du consentement de l'utilisateur demande le rôle Privileged Role Administrator ; Global Administrator n'est nécessaire que pour le faire dans le centre d'administration Microsoft Entra. Une application qui exige l'affectation des utilisateurs doit recevoir le consentement d'un administrateur pour ses autorisations, même quand la stratégie de consentement de l'utilisateur permettrait sinon à l'utilisateur de donner son consentement.
references:
  - title: Configure how users consent to applications
    url: https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-user-consent
