id: sc500-sr2-backup-mua-2
objective: "1.3.8"
type: series_yesno
series: sc500-sr2-backup-mua
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You use a Resource Guard in West Europe in SubSec.
  fr: Vous utilisez une protection des ressources (Resource Guard) dans West Europe dans SubSec.
body:
  solution:
    en: |
      A member of SecOps performs the following actions:

      - Creates a Resource Guard named **RG-Backup** in SubSec in the **West Europe** region and keeps all the protected operations enabled.
      - Assigns the **Reader** role on RG-Backup to BackupAdmins.
      - In Microsoft Entra Privileged Identity Management (PIM), creates an **Eligible** assignment of the **Backup MUA Operator** role on RG-Backup for BackupAdmins, with SecOps as approvers.

      A member of BackupAdmins then opens RSV1, selects **Properties** > **Multi-User Authorization** > **Update**, and selects RG-Backup.
    fr: |
      Un membre de SecOps effectue les actions suivantes :

      - Il crée une protection des ressources (Resource Guard) nommée **RG-Backup** dans SubSec dans la région **West Europe** et conserve toutes les opérations protégées activées.
      - Il attribue le rôle **Reader** sur RG-Backup à BackupAdmins.
      - Dans Microsoft Entra Privileged Identity Management (PIM), il crée une attribution **Eligible** du rôle **Backup MUA Operator** sur RG-Backup pour BackupAdmins, avec SecOps comme approbateurs.

      Un membre de BackupAdmins ouvre ensuite RSV1, sélectionne **Properties** > **Multi-User Authorization** > **Update** et sélectionne RG-Backup.
answer: { value: false }
explanation:
  correct:
    en: The Resource Guard can be in another subscription or tenant, but it must be in the same Azure region as the vault. RG-Backup is in West Europe while RSV1 is in North Europe, so RSV1 cannot be associated with it and multi-user authorization is never enabled.
    fr: "La protection des ressources peut se trouver dans un autre abonnement ou un autre locataire, mais elle doit être dans la même région Azure que le coffre. RG-Backup est dans West Europe alors que RSV1 est dans North Europe : RSV1 ne peut pas lui être associé et l'autorisation multi-utilisateur n'est jamais activée."
references:
  - title: Configure Multi-user authorization using Resource Guard - Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization
