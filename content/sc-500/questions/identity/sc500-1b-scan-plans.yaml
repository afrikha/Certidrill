id: sc500-1b-scan-plans
objective: "1.2.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has an Azure subscription named **Sub1** that contains 80 Azure virtual machines. Microsoft Defender for Cloud is enabled on Sub1 with only the free foundational CSPM capabilities.

    You need Defender for Cloud to find plaintext secrets, such as SSH private keys and storage connection strings, on the disks of the virtual machines, without installing an agent.

    Which two plans can you enable on Sub1? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un abonnement Azure nommé **Sub1** qui contient 80 machines virtuelles Azure. Microsoft Defender for Cloud est activé sur Sub1 avec uniquement les fonctionnalités gratuites de CSPM de base (foundational CSPM).

    Defender for Cloud doit trouver les secrets en texte clair, comme les clés privées SSH et les chaînes de connexion de stockage, sur les disques des machines virtuelles, sans installer d'agent.

    Quels sont les deux plans que vous pouvez activer sur Sub1 ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Defender for Servers Plan 1 }
    - { id: b, text: Defender for Servers Plan 2 }
    - { id: c, text: Defender Cloud Security Posture Management (Defender CSPM) }
    - { id: d, text: Defender for Key Vault }
    - { id: e, text: Defender for Storage }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Agentless machine secrets scanning is included in the Defender CSPM plan and in Defender for Servers Plan 2. The scanner takes disk snapshots through cloud APIs, so no agent or network connectivity to the machines is needed.
    fr: |
      L'analyse sans agent des secrets des machines est incluse dans le plan Defender CSPM et dans Defender for Servers Plan 2. Le scanner prend des instantanés de disque via les API du cloud : aucun agent ni connectivité réseau vers les machines n'est nécessaire.
  options:
    a:
      en: "Defender for Servers Plan 1 doesn't include agentless secrets scanning."
      fr: "Defender for Servers Plan 1 n'inclut pas l'analyse sans agent des secrets."
    d:
      en: "Defender for Key Vault detects suspicious access to key vaults; it doesn't scan machine disks."
      fr: "Defender for Key Vault détecte les accès suspects aux coffres de clés ; il n'analyse pas les disques des machines."
    e:
      en: "Defender for Storage protects storage accounts against threats such as malicious uploads; it doesn't scan VM disks for secrets."
      fr: "Defender for Storage protège les comptes de stockage contre des menaces comme les chargements malveillants ; il n'analyse pas les disques des VM à la recherche de secrets."
references:
  - title: Protecting secrets in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning
  - title: Machine secrets scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secrets-scanning-servers
