id: sc500-1b-pol-enforcement-test
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys created a custom policy definition named **deny-kv-public** whose rule has a fixed deny effect. You plan to assign deny-kv-public to a subscription named **Sub-Prod**.

    Before any deployment is blocked, the security team wants to review for two weeks which key vaults would be non-compliant. After the review, blocking must start by changing only the assignment. The definition must not be modified.

    How should you configure the assignment?
  fr: |
    Tailspin Toys a créé une définition de stratégie personnalisée nommée **deny-kv-public** dont la règle a un effet deny fixe. Vous prévoyez d'attribuer deny-kv-public à un abonnement nommé **Sub-Prod**.

    Avant que tout déploiement ne soit bloqué, l'équipe sécurité veut examiner pendant deux semaines quels coffres de clés seraient non conformes. Après l'examen, le blocage doit commencer en modifiant uniquement l'attribution. La définition ne doit pas être modifiée.

    Comment devez-vous configurer l'attribution ?
body:
  options:
    - { id: a, text: { en: "Set the policy enforcement mode of the assignment to Disabled.", fr: "Définir le mode d'application de la stratégie de l'attribution sur Disabled." } }
    - { id: b, text: { en: "Create an exemption of category Waiver for Sub-Prod that expires in two weeks.", fr: "Créer une exemption de catégorie Waiver pour Sub-Prod qui expire dans deux semaines." } }
    - { id: c, text: { en: "Add every resource group of Sub-Prod to the excluded scopes of the assignment.", fr: "Ajouter chaque groupe de ressources de Sub-Prod aux étendues exclues de l'attribution." } }
    - { id: d, text: { en: "Add a non-compliance message to the assignment.", fr: "Ajouter un message de non-conformité à l'attribution." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With enforcement mode Disabled (DoNotEnforce in JSON), the effect isn't enforced during create or update requests, but the assignment still evaluates compliance, so the team sees which vaults would be non-compliant. Switching the assignment back to Enabled (Default) starts the deny without touching the definition.
    fr: |
      Avec le mode d'application Disabled (DoNotEnforce en JSON), l'effet n'est pas appliqué lors des requêtes de création ou de mise à jour, mais l'attribution évalue toujours la conformité : l'équipe voit quels coffres seraient non conformes. Repasser l'attribution sur Enabled (Default) déclenche le refus sans toucher à la définition.
  options:
    b:
      en: "Exempt resources aren't evaluated as non-compliant; they show the Exempt state, so the review would show nothing useful."
      fr: "Les ressources exemptées ne sont pas évaluées comme non conformes ; elles affichent l'état Exempt, donc l'examen ne montrerait rien d'utile."
    c:
      en: "Excluded scopes aren't evaluated at all, so no compliance result would be available."
      fr: "Les étendues exclues ne sont pas évaluées du tout : aucun résultat de conformité ne serait disponible."
    d:
      en: "A non-compliance message only explains why a request is denied; deployments would still be blocked immediately."
      fr: "Un message de non-conformité explique seulement pourquoi une requête est refusée ; les déploiements seraient toujours bloqués immédiatement."
references:
  - title: Azure Policy assignment structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure
