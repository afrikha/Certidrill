id: sc500-sr2-backup-mua-1
objective: "1.3.8"
type: series_yesno
series: sc500-sr2-backup-mua
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You enable immutability on RSV1 and lock it.
  fr: Vous activez l'immuabilité sur RSV1 et la verrouillez.
body:
  solution:
    en: In the **Properties** of RSV1, you enable **Immutable vault**, and then you lock the immutability setting.
    fr: Dans les **Properties** de RSV1, vous activez **Immutable vault**, puis vous verrouillez le paramètre d'immuabilité.
answer: { value: false }
explanation:
  correct:
    en: A locked immutable vault blocks retention reductions and the deletion of recovery points for everyone, and locking is irreversible. There is no approval step that lets a backup administrator perform these operations for a limited time after SecOps agrees, so the second requirement is not met.
    fr: "Un coffre immuable verrouillé bloque la réduction de la rétention et la suppression des points de récupération pour tout le monde, et le verrouillage est irréversible. Aucune étape d'approbation ne permet à un administrateur de sauvegarde d'effectuer ces opérations pendant une période limitée après l'accord de SecOps : la deuxième exigence n'est pas satisfaite."
references:
  - title: Concept of Immutable Vault for Azure Backup - Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
  - title: Multiuser Authorization Using Resource Guard - Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
