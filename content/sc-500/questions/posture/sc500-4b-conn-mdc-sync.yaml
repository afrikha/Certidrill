id: sc500-4b-conn-mdc-sync
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel in the Azure portal. Microsoft Defender for Cloud alerts from a subscription named Sub-Prod are ingested by the Subscription-based Microsoft Defender for Cloud (Legacy) connector.

    Analysts close Microsoft Sentinel incidents after investigation, but the original alerts stay active in Defender for Cloud. You need the original alerts to be closed automatically when the incidents that contain them are closed.

    What should you configure on the connector page?
  fr: |
    Northwind Traders utilise Microsoft Sentinel dans le portail Azure. Les alertes Microsoft Defender for Cloud d'un abonnement nommé Sub-Prod sont ingérées par le connecteur Subscription-based Microsoft Defender for Cloud (Legacy).

    Les analystes ferment les incidents Microsoft Sentinel après investigation, mais les alertes d'origine restent actives dans Defender for Cloud. Les alertes d'origine doivent être fermées automatiquement lorsque les incidents qui les contiennent sont fermés.

    Que devez-vous configurer dans la page du connecteur ?
body:
  options:
    - { id: a, text: { en: "Set Create incidents to Enabled for Sub-Prod.", fr: "Définir Create incidents sur Enabled pour Sub-Prod." } }
    - { id: b, text: { en: "Set Bi-directional sync to Enabled for Sub-Prod.", fr: "Définir Bi-directional sync sur Enabled pour Sub-Prod." } }
    - { id: c, text: { en: "Select Enable all in the Microsoft Defender plans column for Sub-Prod.", fr: "Sélectionner Enable all dans la colonne Microsoft Defender plans pour Sub-Prod." } }
    - { id: d, text: { en: "Turn the Status toggle of Sub-Prod off and on again.", fr: "Désactiver puis réactiver le bouton Status de Sub-Prod." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default, alert status syncs only from Defender for Cloud to Microsoft Sentinel. With bi-directional sync enabled, closing a Microsoft Sentinel incident automatically closes the original alerts in Defender for Cloud. Enabling it requires Contributor or Security Admin on the subscription.
    fr: |
      Par défaut, le statut des alertes n'est synchronisé que de Defender for Cloud vers Microsoft Sentinel. Avec la synchronisation bidirectionnelle (Bi-directional sync), la fermeture d'un incident Microsoft Sentinel ferme automatiquement les alertes d'origine dans Defender for Cloud. Son activation exige Contributor ou Security Admin sur l'abonnement.
  options:
    a:
      en: |
        Create incidents turns on the analytics rule that creates incidents from the alerts; it doesn't sync their status.
      fr: |
        Create incidents active la règle analytique qui crée des incidents à partir des alertes ; il ne synchronise pas leur statut.
    c:
      en: |
        Enable all opens the Defender for Cloud plans of the subscription; plans don't change how alert status syncs.
      fr: |
        Enable all ouvre les plans Defender for Cloud de l'abonnement ; les plans ne modifient pas la synchronisation du statut des alertes.
    d:
      en: |
        Reconnecting the subscription keeps the default one-way sync.
      fr: |
        Reconnecter l'abonnement conserve la synchronisation unidirectionnelle par défaut.
references:
  - title: Ingest Microsoft Defender for Cloud alerts to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-defender-for-cloud
