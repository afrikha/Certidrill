id: sc500-4c-audit-viewonly-role
objective: "4.2.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft 365 E5 and the Microsoft Defender portal. Audit log ingestion is turned on.

    A security analyst named **Analyst1** must search the unified audit log from the **Audit** page of the Defender portal to review SharePoint and Exchange activity. Analyst1 must not be able to change any audit configuration. The solution must follow the principle of least privilege.

    Which role should you assign to Analyst1?
  fr: |
    Contoso utilise Microsoft 365 E5 et le portail Microsoft Defender. L'ingestion du journal d'audit est activée.

    Une analyste de sécurité nommée **Analyst1** doit effectuer des recherches dans le journal d'audit unifié depuis la page **Audit** du portail Defender pour examiner l'activité SharePoint et Exchange. Analyst1 ne doit pouvoir modifier aucune configuration d'audit. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Analyst1 ?
body:
  options:
    - { id: a, text: { en: "Audit Logs", fr: "Audit Logs" } }
    - { id: b, text: { en: "View-Only Audit Logs", fr: "View-Only Audit Logs" } }
    - { id: c, text: { en: "Compliance Administrator", fr: "Compliance Administrator" } }
    - { id: d, text: { en: "Microsoft Sentinel Reader", fr: "Microsoft Sentinel Reader" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Searching the audit log requires the Audit Logs or View-Only Audit Logs role, and the search in the Defender portal is the same as in the Microsoft Purview portal. View-Only Audit Logs lets the user search and view audit records without managing audit settings, so it is the least-privileged choice.
    fr: |
      La recherche dans le journal d'audit exige le rôle Audit Logs ou View-Only Audit Logs, et la recherche du portail Defender est identique à celle du portail Microsoft Purview. View-Only Audit Logs permet de rechercher et de consulter les enregistrements d'audit sans gérer les paramètres d'audit : c'est le choix le moins privilégié.
  options:
    a: { en: "Audit Logs also allows audit configuration tasks, which exceeds the requirement.", fr: "Audit Logs autorise aussi des tâches de configuration de l'audit, ce qui dépasse l'exigence." }
    c: { en: "Compliance Administrator grants broad compliance management permissions, far beyond searching the audit log.", fr: "Compliance Administrator accorde de larges autorisations de gestion de la conformité, bien au-delà de la recherche dans le journal d'audit." }
    d: { en: "Microsoft Sentinel Reader is an Azure role on a Sentinel workspace; it gives no access to the Purview audit search.", fr: "Microsoft Sentinel Reader est un rôle Azure sur un espace de travail Sentinel ; il ne donne aucun accès à la recherche d'audit Purview." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
  - title: Audit log search in the Microsoft Defender portal
    url: https://learn.microsoft.com/en-us/defender-office-365/audit-log-search-defender-portal
