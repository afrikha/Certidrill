id: sc500-4c-agent-store-roles
objective: "4.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys plans to deploy a partner agent from Microsoft Security Store. The agent reads Microsoft Defender data. An administrator named **Admin1** will purchase the agent and set it up in Microsoft Security Copilot.

    You need to identify the roles required for each stage. The solution must follow the principle of least privilege.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de déployer un agent partenaire depuis Microsoft Security Store. L'agent lit des données Microsoft Defender. Un administrateur nommé **Admin1** achètera l'agent et le configurera dans Microsoft Security Copilot.

    Vous devez identifier les rôles nécessaires à chaque étape. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To purchase and deploy the agent, Admin1 needs the [[buy]] role on the Azure billing subscription.
      To set up the agent in Security Copilot, Admin1 needs the [[setup]] role.
      Before Admin1 can complete the setup, a user who holds the [[approve]] role must approve the agent.
    fr: |
      Pour acheter et déployer l'agent, Admin1 a besoin du rôle [[buy]] sur l'abonnement Azure de facturation.
      Pour configurer l'agent dans Security Copilot, Admin1 a besoin du rôle [[setup]].
      Avant qu'Admin1 puisse terminer la configuration, un utilisateur qui détient le rôle [[approve]] doit approuver l'agent.
  slots:
    - id: buy
      options:
        - { id: reader, text: Reader }
        - { id: billreader, text: Billing Reader }
        - { id: contrib, text: Contributor }
        - { id: uaa, text: User Access Administrator }
    - id: setup
      options:
        - { id: cpcontrib, text: Copilot contributor }
        - { id: cpowner, text: Copilot owner }
        - { id: secreader, text: Security Reader }
        - { id: sentcontrib, text: Microsoft Sentinel Contributor }
    - id: approve
      options:
        - { id: ga, text: Global Administrator }
        - { id: secadm, text: Security Administrator }
        - { id: appadm, text: Application Administrator }
        - { id: owner2, text: Copilot owner }
answer:
  values: { buy: contrib, setup: cpcontrib, approve: ga }
explanation:
  correct:
    en: |
      Buying from Security Store requires Contributor or Owner on the Azure billing subscription, because the purchase creates billing and Azure resources. Setting up the agent requires Copilot owner or contributor, and contributor is the least privileged. A partner agent that accesses data from a Microsoft product such as Defender needs Global Administrator approval.
    fr: |
      L'achat dans Security Store exige Contributor ou Owner sur l'abonnement Azure de facturation, car l'achat crée des ressources de facturation et des ressources Azure. La configuration de l'agent exige Copilot owner ou contributor, contributor étant le moins privilégié. Un agent partenaire qui accède aux données d'un produit Microsoft comme Defender exige l'approbation d'un Global Administrator.
  options:
    reader: { en: "Reader can't create the billing and agent resources.", fr: "Reader ne peut pas créer les ressources de facturation et de l'agent." }
    billreader: { en: "Billing Reader only reads billing data.", fr: "Billing Reader ne fait que lire les données de facturation." }
    uaa: { en: "User Access Administrator manages access, not resources.", fr: "User Access Administrator gère les accès, pas les ressources." }
    cpowner: { en: "Copilot owner also works but grants more than needed.", fr: "Copilot owner fonctionne aussi mais accorde plus que nécessaire." }
    secreader: { en: "Security Reader is a Microsoft Entra role and doesn't give access to the Security Copilot platform.", fr: "Security Reader est un rôle Microsoft Entra et ne donne pas accès à la plateforme Security Copilot." }
    sentcontrib: { en: "Microsoft Sentinel Contributor is an Azure role on a Sentinel workspace, not a Security Copilot role.", fr: "Microsoft Sentinel Contributor est un rôle Azure sur un espace de travail Sentinel, pas un rôle Security Copilot." }
    secadm: { en: "The approval of partner agents that access Microsoft products requires Global Administrator.", fr: "L'approbation des agents partenaires qui accèdent aux produits Microsoft exige Global Administrator." }
    appadm: { en: "Application Administrator isn't the role that approves Security Copilot partner agents.", fr: "Application Administrator n'est pas le rôle qui approuve les agents partenaires Security Copilot." }
    owner2: { en: "Copilot owners face the same consent banner; they can't approve the agent.", fr: "Les Copilot owners voient la même bannière de consentement ; ils ne peuvent pas approuver l'agent." }
references:
  - title: Get agents in Microsoft Security Store
    url: https://learn.microsoft.com/en-us/security/store/customers/get-agents-in-security-store
  - title: Setup and manage Security Copilot agents
    url: https://learn.microsoft.com/en-us/copilot/security/agents-manage
