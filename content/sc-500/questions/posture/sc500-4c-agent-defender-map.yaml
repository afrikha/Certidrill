id: sc500-4c-agent-defender-map
objective: "4.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Defender XDR, Microsoft Sentinel and Microsoft Security Copilot. The SOC has the four requirements listed in the answer area.

    Which Security Copilot agent in Microsoft Defender should you use for each requirement? To answer, drag the appropriate agents to the correct requirements. Each agent may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Defender XDR, Microsoft Sentinel et Microsoft Security Copilot. Le SOC a les quatre exigences listées dans la zone de réponse.

    Quel agent Security Copilot de Microsoft Defender devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les agents appropriés vers les exigences correspondantes. Chaque agent peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: triage, text: Security Alert Triage Agent }
    - { id: tib, text: Threat Intelligence Briefing Agent }
    - { id: hunt, text: Threat Hunting Assistant }
    - { id: dtd, text: Dynamic Threat Detection Agent }
    - { id: analyst, text: Security Analyst Agent }
  targets:
    - id: r1
      text: { en: "Run on-demand anomaly detection, risk scoring and forecasting on Sentinel data lake data without writing queries", fr: "Exécuter à la demande une détection d'anomalies, un calcul de score de risque et des prévisions sur les données du data lake Sentinel sans écrire de requêtes" }
    - id: r2
      text: { en: "Send the SOC a regular summary of the threat intelligence that is relevant to the bank", fr: "Envoyer au SOC une synthèse régulière du renseignement sur les menaces pertinent pour la banque" }
    - id: r3
      text: { en: "Turn analysts' natural-language questions into KQL in advanced hunting and interpret the results", fr: "Transformer les questions des analystes en langage naturel en KQL dans le repérage avancé et interpréter les résultats" }
    - id: r4
      text: { en: "Continuously look for threats that existing detections missed across Defender and Sentinel", fr: "Rechercher en continu, dans Defender et Sentinel, les menaces manquées par les détections existantes" }
answer:
  mapping: { r1: analyst, r2: tib, r3: hunt, r4: dtd }
explanation:
  correct:
    en: |
      The Security Analyst Agent runs ready-to-use or custom analyses on demand, such as anomaly detection, risk scoring or forecasting, on Defender, Sentinel Log Analytics or Sentinel data lake data, without code or queries. The Threat Intelligence Briefing Agent produces scheduled briefings. The Threat Hunting Assistant generates KQL and interprets results in advanced hunting. The Dynamic Threat Detection Agent is an always-on backend service that finds false negatives across Defender and Sentinel. The Security Alert Triage Agent triages each new alert of the configured types, which none of the requirements describe.
    fr: |
      Le Security Analyst Agent effectue à la demande des analyses prêtes à l'emploi ou personnalisées, comme la détection d'anomalies, le calcul de score de risque ou les prévisions, sur les données de Defender, de Sentinel Log Analytics ou du data lake Sentinel, sans code ni requête. Le Threat Intelligence Briefing Agent produit des synthèses planifiées. Le Threat Hunting Assistant génère du KQL et interprète les résultats dans le repérage avancé. Le Dynamic Threat Detection Agent est un service d'arrière-plan toujours actif qui trouve les faux négatifs dans Defender et Sentinel. Le Security Alert Triage Agent trie chaque nouvelle alerte des types configurés, ce qu'aucune exigence ne décrit.
references:
  - title: Deploy AI agents in Microsoft Defender
    url: https://learn.microsoft.com/en-us/defender-xdr/security-copilot-agents-defender
