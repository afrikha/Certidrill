id: sc500-4c-plugin-settings-hotarea
objective: "4.3.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Security Copilot. The **Plugin settings** page of the Owner menu shows the configuration in the following table.

    Answer each prompt by selecting the setting that you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Security Copilot. La page **Plugin settings** du menu Owner présente la configuration du tableau suivant.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Contributors must be able to add custom plugins that only they can use.", fr: "Les contributeurs doivent pouvoir ajouter des plug-ins personnalisés qu'eux seuls peuvent utiliser." }
    - id: p2
      text: { en: "Contributors must stop using the Microsoft Defender XDR and Microsoft Sentinel plugins while a review is in progress.", fr: "Les contributeurs doivent cesser d'utiliser les plug-ins Microsoft Defender XDR et Microsoft Sentinel pendant une revue." }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Current value", fr: "Valeur actuelle" }]
    rows:
      - [{ text: "Who can add and manage their own custom plugins (user scope)?", area: user }, { text: Owners only }]
      - [{ text: "Who can add and manage custom plugins for everyone in the organization (tenant scope)?", area: tenant }, { text: Owners only }]
      - [{ text: "Preinstalled plugin availability", area: pre }, { text: All users }]
answer:
  values: { p1: user, p2: pre }
explanation:
  correct:
    en: |
      Personal custom plugins are governed by the user-scope setting, which must change to Contributors and Owners; the tenant-scope setting would let contributors publish plugins for everyone, which isn't required. Microsoft Defender XDR and Microsoft Sentinel are preinstalled plugins, so setting the preinstalled plugin availability to Owners only removes them from contributors immediately.
    fr: |
      Les plug-ins personnalisés personnels dépendent du paramètre d'étendue utilisateur, qui doit passer à Contributors and Owners ; le paramètre d'étendue locataire permettrait aux contributeurs de publier des plug-ins pour tous, ce qui n'est pas exigé. Microsoft Defender XDR et Microsoft Sentinel sont des plug-ins préinstallés : définir leur disponibilité sur Owners only les retire immédiatement aux contributeurs.
references:
  - title: Manage plugins in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins
