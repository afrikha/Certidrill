id: sc500-cs3b-cef-ama
objective: "4.2.5"
type: ordering
caseStudy: sc500-cs3b-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the ingestion requirement for the CEF messages of the resort firewalls.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez satisfaire l'exigence d'ingestion des messages CEF des pare-feu des stations.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: arc, text: { en: "Install the Azure Connected Machine agent on lnx-fwd01.", fr: "Installer l'agent Azure Connected Machine sur lnx-fwd01." } }
    - { id: dcr, text: { en: "From the Common Event Format (CEF) via AMA connector, create a data collection rule that targets lnx-fwd01.", fr: "Depuis le connecteur Common Event Format (CEF) via AMA, créer une règle de collecte de données qui cible lnx-fwd01." } }
    - { id: script, text: { en: "Run the Forwarder_AMA_installer.py script on lnx-fwd01.", fr: "Exécuter le script Forwarder_AMA_installer.py sur lnx-fwd01." } }
    - { id: mma, text: { en: "Install the Log Analytics agent on lnx-fwd01 with the workspace ID and key of law-soc.", fr: "Installer l'agent Log Analytics sur lnx-fwd01 avec l'ID et la clé de l'espace de travail law-soc." } }
    - { id: table, text: { en: "Create a custom table named CommonSecurityLog_CL in law-soc.", fr: "Créer une table personnalisée nommée CommonSecurityLog_CL dans law-soc." } }
    - { id: syslog, text: { en: "From the Syslog via AMA connector, create a data collection rule that collects all the facilities.", fr: "Depuis le connecteur Syslog via AMA, créer une règle de collecte de données qui collecte toutes les facilités." } }
answer:
  sequence: [ arc, dcr, script ]
explanation:
  correct:
    en: |-
      lnx-fwd01 is not an Azure VM, so it must first be onboarded to Azure Arc with the Connected Machine agent; only then can it be selected as a resource of the data collection rule, which installs the Azure Monitor Agent. After the rule is created, the installation script configures rsyslog to listen on port 514 and forward the messages to the agent. The CEF messages land in the built-in CommonSecurityLog table.
    fr: |-
      lnx-fwd01 n'est pas une machine virtuelle Azure : il doit d'abord être intégré à Azure Arc avec l'agent Connected Machine ; c'est seulement ensuite qu'il peut être sélectionné comme ressource de la règle de collecte de données, qui installe l'agent Azure Monitor. Une fois la règle créée, le script d'installation configure rsyslog pour écouter sur le port 514 et transmettre les messages à l'agent. Les messages CEF arrivent dans la table intégrée CommonSecurityLog.
  options:
    mma:
      en: |-
        The Log Analytics agent is retired; the requirement asks for the Azure Monitor Agent.
      fr: |-
        L'agent Log Analytics est mis hors service ; l'exigence demande l'agent Azure Monitor.
    table:
      en: |-
        CEF messages are stored in the existing CommonSecurityLog table; no custom table is needed.
      fr: |-
        Les messages CEF sont stockés dans la table existante CommonSecurityLog ; aucune table personnalisée n'est nécessaire.
    syslog:
      en: |-
        Collecting the facilities used for CEF in a Syslog rule as well duplicates the data in the Syslog table.
      fr: |-
        Collecter aussi dans une règle Syslog les facilités utilisées pour le CEF duplique les données dans la table Syslog.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
  - title: Syslog and CEF AMA connectors
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
