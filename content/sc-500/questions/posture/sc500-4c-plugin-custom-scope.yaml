id: sc500-4c-plugin-custom-scope
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Security Copilot. The plugin settings are at their defaults.

    Detection engineers who are Copilot contributors must be able to add and test custom plugins for their own use. Only Copilot owners must be able to make a custom plugin available to everyone in the organization.

    How should you configure the plugin settings?
  fr: |
    Fabrikam utilise Microsoft Security Copilot. Les paramètres des plug-ins sont à leurs valeurs par défaut.

    Les ingénieurs de détection, qui sont Copilot contributors, doivent pouvoir ajouter et tester des plug-ins personnalisés pour leur propre usage. Seuls les Copilot owners doivent pouvoir rendre un plug-in personnalisé disponible pour toute l'organisation.

    Comment devez-vous configurer les paramètres des plug-ins ?
body:
  options:
    - { id: a, text: { en: "User scope: Contributors and Owners. Tenant scope: Contributors and Owners.", fr: "Étendue utilisateur : Contributors and Owners. Étendue locataire : Contributors and Owners." } }
    - { id: b, text: { en: "User scope: Owners only. Tenant scope: Contributors and Owners.", fr: "Étendue utilisateur : Owners only. Étendue locataire : Contributors and Owners." } }
    - { id: c, text: { en: "User scope: Contributors and Owners. Tenant scope: Owners only.", fr: "Étendue utilisateur : Contributors and Owners. Étendue locataire : Owners only." } }
    - { id: d, text: { en: "Preinstalled plugin availability: All users. User scope: Owners only.", fr: "Disponibilité des plug-ins préinstallés : All users. Étendue utilisateur : Owners only." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The user-scope setting controls who can add and manage their own custom plugins, and the tenant-scope setting controls who can add custom plugins for everyone in the organization. Contributors and Owners at user scope with Owners only at tenant scope lets contributors test plugins privately while only owners publish them.
    fr: |
      Le paramètre d'étendue utilisateur détermine qui peut ajouter et gérer ses propres plug-ins personnalisés, et le paramètre d'étendue locataire qui peut ajouter des plug-ins personnalisés pour toute l'organisation. Contributors and Owners pour l'étendue utilisateur et Owners only pour l'étendue locataire permettent aux contributeurs de tester des plug-ins en privé, tandis que seuls les propriétaires les publient.
  options:
    a: { en: "Contributors could then publish custom plugins to the whole organization.", fr: "Les contributeurs pourraient alors publier des plug-ins personnalisés pour toute l'organisation." }
    b: { en: "Contributors couldn't add their own plugins, and the tenant-scope option for contributors is enabled only when contributors are allowed at user scope.", fr: "Les contributeurs ne pourraient pas ajouter leurs propres plug-ins, et l'option d'étendue locataire pour les contributeurs n'est activée que si les contributeurs sont autorisés pour l'étendue utilisateur." }
    d: { en: "Preinstalled plugin availability doesn't concern custom plugins, and Owners only at user scope blocks contributors.", fr: "La disponibilité des plug-ins préinstallés ne concerne pas les plug-ins personnalisés, et Owners only pour l'étendue utilisateur bloque les contributeurs." }
references:
  - title: Manage plugins in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins
