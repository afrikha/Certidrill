id: sc500-4a-sen-design
objective: "4.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware is preparing a Microsoft Sentinel deployment. The security architect writes the following deployment notes.

    How should you complete the notes? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prépare un déploiement de Microsoft Sentinel. L'architecte sécurité rédige les notes de déploiement suivantes.

    Comment devez-vous compléter les notes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Microsoft Sentinel stores the data that it ingests and analyzes in [[store]].
      To assign permissions only once, place it in [[rg]].
      Analysts who install content hub solutions need [[role]] on that resource group.
    fr: |
      Microsoft Sentinel stocke les données qu'il ingère et analyse dans [[store]].
      Pour attribuer les autorisations une seule fois, placez-le dans [[rg]].
      Les analystes qui installent des solutions du hub de contenu ont besoin de [[role]] sur ce groupe de ressources.
  slots:
    - id: store
      options:
        - { id: law, text: { en: "a Log Analytics workspace", fr: "un espace de travail Log Analytics" } }
        - { id: st, text: { en: "a storage account", fr: "un compte de stockage" } }
        - { id: adx, text: { en: "an Azure Data Explorer cluster", fr: "un cluster Azure Data Explorer" } }
        - { id: eh, text: { en: "an Event Hubs namespace", fr: "un espace de noms Event Hubs" } }
    - id: rg
      options:
        - { id: dedicated, text: { en: "a dedicated resource group for Sentinel resources", fr: "un groupe de ressources dédié aux ressources Sentinel" } }
        - { id: shared, text: { en: "the resource group of the monitored workloads", fr: "le groupe de ressources des charges de travail surveillées" } }
        - { id: network, text: { en: "the resource group of the hub virtual network", fr: "le groupe de ressources du réseau virtuel hub" } }
    - id: role
      options:
        - { id: contrib, text: Microsoft Sentinel Contributor }
        - { id: reader, text: Microsoft Sentinel Reader }
        - { id: responder, text: Microsoft Sentinel Responder }
        - { id: lar, text: Log Analytics Reader }
answer:
  values: { store: law, rg: dedicated, role: contrib }
explanation:
  correct:
    en: |-
      A Log Analytics workspace houses the data that Microsoft Sentinel ingests and analyzes. Microsoft recommends a dedicated resource group that contains only the resources Sentinel uses, so that permissions assigned at the resource group apply to all of them. Installing or managing content hub solutions requires Microsoft Sentinel Contributor on that resource group.
    fr: |-
      Un espace de travail Log Analytics héberge les données que Microsoft Sentinel ingère et analyse. Microsoft recommande un groupe de ressources dédié qui ne contient que les ressources utilisées par Sentinel, afin que les autorisations attribuées au groupe de ressources s'appliquent à toutes. L'installation ou la gestion des solutions du hub de contenu exige Microsoft Sentinel Contributor sur ce groupe de ressources.
  options:
    shared:
      en: |-
        Mixing Sentinel resources with the workloads forces you to grant Sentinel permissions on unrelated resources.
      fr: |-
        Mélanger les ressources Sentinel et les charges de travail oblige à accorder des autorisations Sentinel sur des ressources sans rapport.
    reader:
      en: |-
        Microsoft Sentinel Reader is read-only and can't install solutions.
      fr: |-
        Microsoft Sentinel Reader est en lecture seule et ne peut pas installer de solutions.
    responder:
      en: |-
        Microsoft Sentinel Responder manages incidents but can't install solutions.
      fr: |-
        Microsoft Sentinel Responder gère les incidents mais ne peut pas installer de solutions.
references:
  - title: Prerequisites to deploy Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/prerequisites
  - title: Onboard Microsoft Sentinel to a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/sentinel/quickstart-onboard
