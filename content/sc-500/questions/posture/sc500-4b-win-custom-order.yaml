id: sc500-4b-win-custom-order
objective: "4.2.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has 25 Windows servers in its on-premises datacenter. The Windows Security Events solution is already installed in Microsoft Sentinel. No agent is installed on the servers.

    You need to collect only the account lockout events (4740) of the servers in the SecurityEvent table.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation dispose de 25 serveurs Windows dans son centre de données local. La solution Windows Security Events est déjà installée dans Microsoft Sentinel. Aucun agent n'est installé sur les serveurs.

    Vous devez collecter uniquement les événements de verrouillage de compte (4740) des serveurs dans la table SecurityEvent.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: arc, text: { en: "Install and enable Azure Arc on the 25 servers.", fr: "Installer et activer Azure Arc sur les 25 serveurs." } }
    - { id: basics, text: { en: "On the Windows Security Events via AMA connector page, select Add data collection rule and enter the rule name, subscription and resource group.", fr: "Dans la page du connecteur Windows Security Events via AMA, sélectionner Add data collection rule et saisir le nom de la règle, l'abonnement et le groupe de ressources." } }
    - { id: resources, text: { en: "On the Resources tab, add the 25 servers.", fr: "Dans l'onglet Resources, ajouter les 25 serveurs." } }
    - { id: collect, text: { en: "On the Collect tab, select Custom and enter Security!*[System[(EventID=4740)]].", fr: "Dans l'onglet Collect, sélectionner Custom et saisir Security!*[System[(EventID=4740)]]." } }
    - { id: wef, text: { en: "Create a Windows Event Forwarding subscription that sends event 4740 to a collector server.", fr: "Créer un abonnement de transfert d'événements Windows qui envoie l'événement 4740 à un serveur collecteur." } }
    - { id: minimal, text: { en: "On the Collect tab, select Minimal.", fr: "Dans l'onglet Collect, sélectionner Minimal." } }
answer:
  sequence: [ arc, basics, resources, collect ]
explanation:
  correct:
    en: |
      Machines that aren't Azure VMs must be Azure Arc-enabled before you enable the connector, otherwise they can't be selected. You then create the DCR from the connector page: Basics (name, subscription, resource group), Resources (the machines, on which the Azure Monitor Agent is installed), and Collect, where a Custom XPath query in the form LogName!XPath restricts the collection to event 4740.
    fr: |
      Les machines qui ne sont pas des machines virtuelles Azure doivent être activées pour Azure Arc avant l'activation du connecteur, sinon elles ne peuvent pas être sélectionnées. Vous créez ensuite la DCR depuis la page du connecteur : Basics (nom, abonnement, groupe de ressources), Resources (les machines, sur lesquelles l'agent Azure Monitor est installé), puis Collect, où une requête XPath Custom de la forme LogName!XPath limite la collecte à l'événement 4740.
  options:
    wef:
      en: |
        Forwarded events are collected by the Windows Forwarded Events connector into WindowsEvent, not SecurityEvent.
      fr: |
        Les événements transférés sont collectés par le connecteur Windows Forwarded Events dans WindowsEvent, pas dans SecurityEvent.
    minimal:
      en: |
        Minimal includes event 4740 but also many other events, such as sign-ins and process creation.
      fr: |
        Minimal inclut l'événement 4740 mais aussi de nombreux autres événements, comme les connexions et la création de processus.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
