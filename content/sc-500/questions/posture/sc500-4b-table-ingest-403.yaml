id: sc500-4b-table-ingest-403
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. creates a DCR-based custom table named BadgeAccess_CL in its Microsoft Sentinel workspace. The Azure portal creates a data collection rule (DCR) named dcr-badge for the table. An on-premises badge system sends records to the Logs Ingestion API by using a Microsoft Entra application named app-badge.

    app-badge has the Log Analytics Contributor role on the workspace. Every call returns an authorization error. The token is valid and the stream name in the request is correct.

    You need to ensure that app-badge can send data. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Litware, Inc. crée une table personnalisée basée sur une DCR nommée BadgeAccess_CL dans son espace de travail Microsoft Sentinel. Le portail Azure crée une règle de collecte de données (DCR) nommée dcr-badge pour la table. Un système de badges local envoie des enregistrements à l'API d'ingestion de journaux à l'aide d'une application Microsoft Entra nommée app-badge.

    app-badge dispose du rôle Log Analytics Contributor sur l'espace de travail. Chaque appel renvoie une erreur d'autorisation. Le jeton est valide et le nom du flux dans la requête est correct.

    Vous devez faire en sorte qu'app-badge puisse envoyer des données. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign app-badge the Monitoring Contributor role on dcr-badge.", fr: "Attribuer à app-badge le rôle Monitoring Contributor sur dcr-badge." } }
    - { id: b, text: { en: "Assign app-badge the Contributor role on the workspace.", fr: "Attribuer à app-badge le rôle Contributor sur l'espace de travail." } }
    - { id: c, text: { en: "Assign app-badge the Monitoring Metrics Publisher role on dcr-badge.", fr: "Attribuer à app-badge le rôle Monitoring Metrics Publisher sur dcr-badge." } }
    - { id: d, text: { en: "Assign app-badge the Microsoft Sentinel Contributor role on the workspace.", fr: "Attribuer à app-badge le rôle Microsoft Sentinel Contributor sur l'espace de travail." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Logs Ingestion API authorizes the call against the DCR named in the request, not against the workspace. The application must be granted the Monitoring Metrics Publisher role on the DCR, from the DCR's Access Control (IAM) page.
    fr: |
      L'API d'ingestion de journaux autorise l'appel par rapport à la DCR indiquée dans la requête, pas par rapport à l'espace de travail. L'application doit recevoir le rôle Monitoring Metrics Publisher sur la DCR, depuis la page Access Control (IAM) de la DCR.
  options:
    a:
      en: |
        Monitoring Contributor lets a user create and edit DCRs; it isn't the role used to send data through a DCR.
      fr: |
        Monitoring Contributor permet de créer et de modifier des DCR ; ce n'est pas le rôle utilisé pour envoyer des données via une DCR.
    b:
      en: |
        Workspace roles, even broader ones, don't authorize the ingestion call, which is checked on the DCR.
      fr: |
        Les rôles sur l'espace de travail, même plus larges, n'autorisent pas l'appel d'ingestion, qui est vérifié sur la DCR.
    d:
      en: |
        Microsoft Sentinel roles manage Sentinel content and incidents; they don't grant ingestion through a DCR.
      fr: |
        Les rôles Microsoft Sentinel gèrent le contenu et les incidents Sentinel ; ils n'accordent pas l'ingestion via une DCR.
references:
  - title: Logs Ingestion API in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-ingestion-api-overview
