id: sc500-sr1-sentinel-disable-3
objective: "4.2.8"
type: series_yesno
series: sc500-sr1-sentinel-disable
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You create an automation rule that assigns the owner and runs PB1.
  fr: Vous créez une règle d'automatisation qui affecte le propriétaire et exécute PB1.
body:
  solution:
    en: |
      You create an automation rule that uses the **When incident is created** trigger and has a condition on the analytics rule name that matches AR1. The rule has two actions: **Assign owner** set to Analyst1, and **Run playbook** set to PB1.
    fr: |
      Vous créez une règle d'automatisation qui utilise le déclencheur **When incident is created** et a une condition sur le nom de la règle d'analyse qui correspond à AR1. La règle a deux actions : **Assign owner** définie sur Analyst1, et **Run playbook** définie sur PB1.
answer: { value: true }
explanation:
  correct:
    en: |
      An incident-trigger automation rule can combine non-playbook actions, such as assigning an owner, with a Run playbook action that calls an incident-trigger playbook. Microsoft Sentinel already has permissions on RG-SOC, so the rule can run PB1, which disables the accounts by using its managed identity.
    fr: |
      Une règle d'automatisation de déclencheur d'incident peut combiner des actions sans playbook, comme l'affectation d'un propriétaire, avec une action Run playbook qui appelle un playbook de déclencheur d'incident. Microsoft Sentinel dispose déjà d'autorisations sur RG-SOC : la règle peut donc exécuter PB1, qui désactive les comptes à l'aide de son identité managée.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
  - title: Automate threat response with playbooks in Microsoft Sentinel
