id: sc500-4a-easm-states
objective: "4.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam reviews the assets that Microsoft Defender External Attack Surface Management (Defender EASM) discovered for the company.

    Which state should you assign to each asset? To answer, drag the appropriate states to the correct assets. Each state may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam examine les ressources que Microsoft Defender External Attack Surface Management (Defender EASM) a découvertes pour l'entreprise.

    Quel état devez-vous attribuer à chaque ressource ? Pour répondre, faites glisser les états appropriés vers les ressources correspondantes. Chaque état peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: approved, text: "Approved Inventory" }
    - { id: dependency, text: "Dependency" }
    - { id: monitor, text: "Monitor Only" }
    - { id: candidate, text: "Candidate" }
    - { id: investigate, text: "Requires Investigation" }
  targets:
    - id: t1
      text: { en: "A domain that Fabrikam registered and that its web team manages", fr: "Un domaine que Fabrikam a enregistré et que son équipe web gère" }
    - id: t2
      text: { en: "A third-party payment service that Fabrikam's online store relies on to process orders", fr: "Un service de paiement tiers dont la boutique en ligne de Fabrikam dépend pour traiter les commandes" }
    - id: t3
      text: { en: "The website of an independent franchisee that uses the Fabrikam brand, but that Fabrikam doesn't control", fr: "Le site web d'un franchisé indépendant qui utilise la marque Fabrikam, mais que Fabrikam ne contrôle pas" }
answer:
  mapping: { t1: approved, t2: dependency, t3: monitor }
explanation:
  correct:
    en: |-
      Approved Inventory is for assets that you own and are directly responsible for. Dependency is for infrastructure owned by a third party that directly supports the operation of your assets. Monitor Only is for assets that are relevant to your attack surface but that you don't directly control and that aren't a technical dependency.
    fr: |-
      Approved Inventory s'applique aux ressources que vous possédez et dont vous êtes directement responsable. Dependency s'applique à une infrastructure détenue par un tiers qui soutient directement le fonctionnement de vos ressources. Monitor Only s'applique aux ressources pertinentes pour votre surface d'attaque, mais que vous ne contrôlez pas directement et qui ne sont pas une dépendance technique.
  options:
    candidate:
      en: |-
        Candidate is the state of assets whose ownership hasn't been reviewed yet; here every asset has been reviewed.
      fr: |-
        Candidate est l'état des ressources dont la propriété n'a pas encore été examinée ; ici, chaque ressource a été examinée.
    investigate:
      en: |-
        Requires Investigation flags assets whose connection to the organization still needs manual validation.
      fr: |-
        Requires Investigation signale les ressources dont le lien avec l'organisation doit encore être validé manuellement.
references:
  - title: Understand inventory assets
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/understanding-inventory-assets
