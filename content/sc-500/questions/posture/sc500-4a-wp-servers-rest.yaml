id: sc500-4a-wp-servers-rest
objective: "4.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure subscription named **Sub1**. Defender for Servers isn't enabled on Sub1. A virtual machine named **VM-Kiosk1** in the resource group **RG-Branch** must be protected by Defender for Servers Plan 1. No other machine of Sub1 must be protected.

    You plan to use the Azure CLI to call the Defender for Cloud REST API.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un abonnement Azure nommé **Sub1**. Defender for Servers n'est pas activé sur Sub1. Une machine virtuelle nommée **VM-Kiosk1** du groupe de ressources **RG-Branch** doit être protégée par Defender for Servers Plan 1. Aucune autre machine de Sub1 ne doit être protégée.

    Vous prévoyez d'utiliser Azure CLI pour appeler l'API REST de Defender for Cloud.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az rest --method [[method]] \
      --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/RG-Branch/providers/Microsoft.Compute/virtualMachines/VM-Kiosk1/providers/[[res]]?api-version=2024-01-01" \
      --body '[[body]]'
  slots:
    - id: method
      options:
        - { id: put, text: put }
        - { id: delete, text: delete }
        - { id: get, text: get }
    - id: res
      options:
        - { id: pricing, text: "Microsoft.Security/pricings/virtualMachines" }
        - { id: va, text: "Microsoft.Security/serverVulnerabilityAssessments/mdetvm" }
        - { id: assess, text: "Microsoft.Security/assessments" }
    - id: body
      options:
        - { id: p1, text: "{\"properties\":{\"pricingTier\":\"Standard\",\"subPlan\":\"P1\"}}" }
        - { id: p2, text: "{\"properties\":{\"pricingTier\":\"Standard\",\"subPlan\":\"P2\"}}" }
        - { id: free, text: "{\"properties\":{\"pricingTier\":\"Free\"}}" }
answer:
  values: { method: put, res: pricing, body: p1 }
explanation:
  correct:
    en: |-
      Resource-level enablement uses a PUT on the `Microsoft.Security/pricings/virtualMachines` resource under the VM, with `pricingTier` set to `Standard` and `subPlan` set to `P1`. Only Plan 1 can be enabled at the resource level, and the subscription stays unprotected for the other machines.
    fr: |-
      L'activation au niveau ressource utilise un PUT sur la ressource `Microsoft.Security/pricings/virtualMachines` sous la machine virtuelle, avec `pricingTier` défini sur `Standard` et `subPlan` sur `P1`. Seul Plan 1 peut être activé au niveau ressource, et l'abonnement reste non protégé pour les autres machines.
  options:
    delete:
      en: |-
        DELETE removes the resource-level configuration so that the VM inherits the subscription setting again.
      fr: |-
        DELETE supprime la configuration au niveau ressource pour que la machine virtuelle hérite de nouveau du paramètre de l'abonnement.
    va:
      en: |-
        This resource turns on Defender Vulnerability Management scanning for a VM; it doesn't set the Defender for Servers plan.
      fr: |-
        Cette ressource active l'analyse Defender Vulnerability Management pour une machine virtuelle ; elle ne définit pas le plan Defender for Servers.
    p2:
      en: |-
        Plan 2 can't be enabled at the resource level.
      fr: |-
        Plan 2 ne peut pas être activé au niveau ressource.
    free:
      en: |-
        The Free tier disables Defender for Servers on the VM.
      fr: |-
        Le niveau Free désactive Defender for Servers sur la machine virtuelle.
references:
  - title: Protect your servers with Defender for Servers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-servers-plan
