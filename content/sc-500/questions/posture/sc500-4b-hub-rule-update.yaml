id: sc500-4b-hub-rule-update
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Sentinel. Six months ago, you installed a content hub solution and created an analytics rule named Rule1 from one of its analytics rule templates.

    Today the content hub shows **Update** for the solution, and you update it. The release notes say that the query of the template used by Rule1 was improved. A detection engineer reports that Rule1 still runs the old query.

    You need the detection to use the improved query. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Wingtip Toys utilise Microsoft Sentinel. Il y a six mois, vous avez installé une solution du hub de contenu et créé une règle analytique nommée Rule1 à partir de l'un de ses modèles de règle analytique.

    Aujourd'hui, le hub de contenu affiche **Update** pour la solution, et vous la mettez à jour. Les notes de publication indiquent que la requête du modèle utilisé par Rule1 a été améliorée. Un ingénieur de détection signale que Rule1 exécute toujours l'ancienne requête.

    La détection doit utiliser la requête améliorée. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the solution, install it again, and wait for Rule1 to be refreshed.", fr: "Supprimer la solution, la réinstaller et attendre que Rule1 soit actualisée." } }
    - { id: b, text: { en: "Create a new rule from the updated template, and then disable Rule1.", fr: "Créer une nouvelle règle à partir du modèle mis à jour, puis désactiver Rule1." } }
    - { id: c, text: { en: "Select the solution in the list view and select Install/Update again.", fr: "Sélectionner la solution dans la vue liste et sélectionner de nouveau Install/Update." } }
    - { id: d, text: { en: "Wait for the next automatic content update, which applies to active rules.", fr: "Attendre la prochaine mise à jour automatique du contenu, qui s'applique aux règles actives." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Updating a solution updates its templates only. Active or custom content that was created from those templates is never changed by an update. To benefit from the new query, base an active rule on the updated template (here, create a new rule from it) and retire the old rule.
    fr: |
      La mise à jour d'une solution ne met à jour que ses modèles. Le contenu actif ou personnalisé créé à partir de ces modèles n'est jamais modifié par une mise à jour. Pour bénéficier de la nouvelle requête, basez une règle active sur le modèle mis à jour (ici, créez une nouvelle règle à partir de celui-ci) et retirez l'ancienne règle.
  options:
    a:
      en: |
        Deleting a solution removes its templates but not active items, and reinstalling it doesn't change Rule1 either.
      fr: |
        Supprimer une solution retire ses modèles mais pas les éléments actifs, et la réinstaller ne modifie pas non plus Rule1.
    c:
      en: |
        The solution is already up to date; Install/Update skips current items and never changes active rules.
      fr: |
        La solution est déjà à jour ; Install/Update ignore les éléments à jour et ne modifie jamais les règles actives.
    d:
      en: |
        Only standalone content updates automatically, and even then active content created from it isn't changed.
      fr: |
        Seul le contenu autonome se met à jour automatiquement, et même dans ce cas le contenu actif qui en est issu n'est pas modifié.
references:
  - title: Discover and manage Microsoft Sentinel out-of-the-box content
    url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions-deploy
