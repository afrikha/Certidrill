id: sc500-4a-mc-aws-role
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to connect an AWS account to Microsoft Defender for Cloud. The connector will be created in an Azure subscription named **Sub-Multi**. Permissions management (CIEM) won't be enabled.

    An engineer named **User1** will create the connector. User1 currently has no role on Sub-Multi.

    You need to assign a role to User1 on Sub-Multi. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Contoso prévoit de connecter un compte AWS à Microsoft Defender for Cloud. Le connecteur sera créé dans un abonnement Azure nommé **Sub-Multi**. La gestion des autorisations (CIEM) ne sera pas activée.

    Un ingénieur nommé **User1** créera le connecteur. User1 ne dispose actuellement d'aucun rôle sur Sub-Multi.

    Vous devez attribuer un rôle à User1 sur Sub-Multi. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: Security Reader }
    - { id: c, text: Reader }
    - { id: d, text: Owner }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Connecting an AWS account requires Contributor-level permission on the Azure subscription that hosts the security connector. The Security Admin role and the Application.ReadWrite.All permission are needed only to enable CIEM, which isn't the case here.
    fr: |-
      La connexion d'un compte AWS exige une autorisation de niveau Contributor sur l'abonnement Azure qui héberge le connecteur de sécurité. Le rôle Security Admin et l'autorisation Application.ReadWrite.All ne sont nécessaires que pour activer CIEM, ce qui n'est pas le cas ici.
  options:
    d:
      en: |-
        Owner can create the connector but also manages access, which is more than required.
      fr: |-
        Owner peut créer le connecteur mais gère aussi les accès, ce qui dépasse le besoin.
    b:
      en: |-
        Security Reader is read-only; it can't create the security connector.
      fr: |-
        Security Reader est en lecture seule ; il ne peut pas créer le connecteur de sécurité.
    c:
      en: |-
        Reader is read-only; it can't create the security connector.
      fr: |-
        Reader est en lecture seule ; il ne peut pas créer le connecteur de sécurité.
references:
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
