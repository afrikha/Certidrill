id: sc500-4a-wp-servers-defaults
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure subscription named **Sub1**. In **Environment settings** > Sub1 > **Defender plans**, you set the **Servers** plan to **On**, keep the default plan selection, and select **Save**. You don't change any other setting.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un abonnement Azure nommé **Sub1**. Dans **Environment settings** > Sub1 > **Defender plans**, vous définissez le plan **Servers** sur **On**, conservez la sélection de plan par défaut et sélectionnez **Save**. Vous ne modifiez aucun autre paramètre.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Sub1 is now protected by Defender for Servers Plan 1.
        fr: |-
          Sub1 est désormais protégé par Defender for Servers Plan 1.
    - id: s2
      text:
        en: |-
          File integrity monitoring is now active on the virtual machines of Sub1.
        fr: |-
          La surveillance de l'intégrité des fichiers est désormais active sur les machines virtuelles de Sub1.
    - id: s3
      text:
        en: |-
          Agentless scanning for machines is now on for Sub1.
        fr: |-
          L'analyse sans agent des machines est désormais activée pour Sub1.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Turning the Servers plan on selects Plan 2 by default; you would need **Change plans** to choose Plan 1. With Plan 2, agentless scanning is on by default, while file integrity monitoring is off by default and must be enabled separately.
    fr: |-
      L'activation du plan Servers sélectionne Plan 2 par défaut ; il faudrait passer par **Change plans** pour choisir Plan 1. Avec Plan 2, l'analyse sans agent est activée par défaut, alors que la surveillance de l'intégrité des fichiers est désactivée par défaut et doit être activée séparément.
  options:
    s1:
      en: |-
        The default selection is Plan 2, not Plan 1.
      fr: |-
        La sélection par défaut est Plan 2, pas Plan 1.
    s2:
      en: |-
        File integrity monitoring is off by default; you enable it after Plan 2 is on.
      fr: |-
        La surveillance de l'intégrité des fichiers est désactivée par défaut ; vous l'activez une fois Plan 2 en place.
references:
  - title: Protect your servers with Defender for Servers
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-servers-plan
  - title: Review and modify Defender for Servers settings
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/configure-servers-coverage
