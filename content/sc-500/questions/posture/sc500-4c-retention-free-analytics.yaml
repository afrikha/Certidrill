id: sc500-4c-retention-free-analytics
objective: "4.2.9"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Fabrikam uses Microsoft Sentinel on a Log Analytics workspace named **law-fab-sec**. The **SecurityEvent** table uses the Analytics tier and the default retention settings of the workspace (30 days).

    The SOC wants SecurityEvent data to stay available to analytics rules and hunting queries for as long as possible, without incurring any analytics retention charge beyond the ingestion price.

    What analytics retention should you configure for SecurityEvent?
  fr: |
    Fabrikam utilise Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-fab-sec**. La table **SecurityEvent** utilise le niveau d'analyse (Analytics) et les paramètres de rétention par défaut de l'espace de travail (30 jours).

    Le SOC souhaite que les données de SecurityEvent restent disponibles pour les règles d'analyse et les requêtes de repérage le plus longtemps possible, sans aucun frais de rétention d'analyse au-delà du prix d'ingestion.

    Quelle rétention d'analyse devez-vous configurer pour SecurityEvent ?
body:
  options:
    - { id: a, text: { en: "30 days", fr: "30 jours" } }
    - { id: b, text: { en: "90 days", fr: "90 jours" } }
    - { id: c, text: { en: "180 days", fr: "180 jours" } }
    - { id: d, text: { en: "730 days", fr: "730 jours" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In a workspace where Microsoft Sentinel is enabled, the first 90 days of analytics retention are free for Sentinel tables. Setting the analytics retention to 90 days therefore gives the longest window for analytics rules and hunting with no extra retention charge.
    fr: |
      Dans un espace de travail où Microsoft Sentinel est activé, les 90 premiers jours de rétention d'analyse sont gratuits pour les tables Sentinel. Une rétention d'analyse de 90 jours donne donc la fenêtre la plus longue pour les règles d'analyse et le repérage, sans frais de rétention supplémentaires.
  options:
    a: { en: "30 days is the default; it is free but shorter than the free period that Sentinel provides.", fr: "30 jours est la valeur par défaut ; elle est gratuite mais plus courte que la période gratuite offerte par Sentinel." }
    c: { en: "Analytics retention beyond 90 days incurs a prorated monthly retention charge.", fr: "Une rétention d'analyse au-delà de 90 jours entraîne des frais de rétention mensuels au prorata." }
    d: { en: "730 days (two years) is the maximum analytics retention, but every day beyond 90 is charged.", fr: "730 jours (deux ans) est la rétention d'analyse maximale, mais chaque jour au-delà de 90 est facturé." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
