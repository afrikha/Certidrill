id: sc500-4c-copilot-default-ws
objective: "4.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has Microsoft 365 E5. Its tenant is eligible and enabled for Security Copilot, so Microsoft auto-provisions a default capacity and a default workspace. The tenant has no other Security Copilot workspace and no Microsoft 365 geo override.

    Which two statements about the auto-provisioned default workspace are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose de Microsoft 365 E5. Son locataire est éligible et activé pour Security Copilot : Microsoft provisionne donc automatiquement une capacité par défaut et un espace de travail par défaut. Le locataire n'a aucun autre espace de travail Security Copilot et aucun remplacement géographique Microsoft 365.

    Quelles sont les deux affirmations vraies sur l'espace de travail par défaut provisionné automatiquement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Both customer data sharing settings are turned off.", fr: "Les deux paramètres de partage des données client sont désactivés." } }
    - { id: b, text: { en: "The data storage location is set to the United States for every tenant.", fr: "L'emplacement de stockage des données est défini sur les États-Unis pour tous les locataires." } }
    - { id: c, text: { en: "Access to Microsoft 365 service data is turned on.", fr: "L'accès aux données des services Microsoft 365 est activé." } }
    - { id: d, text: { en: "Prompts are evaluated globally even when the data storage location is in the EU.", fr: "Les invites sont évaluées dans le monde entier même quand l'emplacement de stockage des données est dans l'UE." } }
    - { id: e, text: { en: "The Everyone group is assigned the Copilot owner role.", fr: "Le groupe Everyone reçoit le rôle Copilot owner." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      In the auto-provisioned default workspace, both settings that let Microsoft capture data for human review are Off, and access to Microsoft 365 service data such as Purview is On. Owners can review and change these settings on the Owner settings page.
    fr: |
      Dans l'espace de travail par défaut provisionné automatiquement, les deux paramètres qui permettent à Microsoft de capturer des données pour une révision humaine sont désactivés, et l'accès aux données des services Microsoft 365, comme Purview, est activé. Les propriétaires peuvent examiner et modifier ces paramètres sur la page Owner settings.
  options:
    b: { en: "The data storage location is preselected as the tenant's Microsoft Entra geography.", fr: "L'emplacement de stockage des données est présélectionné sur la géographie Microsoft Entra du locataire." }
    d: { en: "When the data storage location is in the EU, prompts are processed in the EU.", fr: "Quand l'emplacement de stockage des données est dans l'UE, les invites sont traitées dans l'UE." }
    e: { en: "Owner access is inherited from privileged roles such as Global Administrator and Security Administrator, not given to Everyone.", fr: "L'accès propriétaire est hérité de rôles privilégiés comme Global Administrator et Security Administrator, il n'est pas donné à Everyone." }
references:
  - title: Understand how Security Copilot is auto provisioned for eligible Microsoft 365 E5 and E7 customers
    url: https://learn.microsoft.com/en-us/copilot/security/auto-provisioning-security-copilot
