id: sc500-4c-retention-tier-map
objective: "4.2.9"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Sentinel in the Microsoft Defender portal. The workspace is onboarded to the Microsoft Sentinel data lake. You must configure three tables to meet the following requirements at the lowest cost:

    | Table | Requirement |
    | --- | --- |
    | SecurityEvent | Used by analytics rules on the last 90 days; kept three years for audit |
    | FirewallFlow_CL | High volume; no analytics rules or hunting; queried by monthly KQL jobs; kept one year |
    | SigninLogs | Used by analytics rules and workbooks on the last 180 days; deleted after 180 days |

    Which configuration should you use for each table? To answer, drag the appropriate configurations to the correct tables. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Sentinel dans le portail Microsoft Defender. L'espace de travail est intégré au data lake Microsoft Sentinel. Vous devez configurer trois tables pour répondre aux exigences suivantes au moindre coût :

    | Table | Exigence |
    | --- | --- |
    | SecurityEvent | Utilisée par des règles d'analyse sur les 90 derniers jours ; conservée trois ans pour l'audit |
    | FirewallFlow_CL | Volume élevé ; aucune règle d'analyse ni aucun repérage ; interrogée par des travaux KQL mensuels ; conservée un an |
    | SigninLogs | Utilisée par des règles d'analyse et des classeurs sur les 180 derniers jours ; supprimée après 180 jours |

    Quelle configuration devez-vous utiliser pour chaque table ? Pour répondre, faites glisser les configurations appropriées vers les tables correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: an90lt, text: { en: "Analytics tier: analytics retention 90 days, total retention 3 years", fr: "Niveau d'analyse : rétention d'analyse 90 jours, rétention totale 3 ans" } }
    - { id: an3y, text: { en: "Analytics tier: analytics retention 3 years, total retention 3 years", fr: "Niveau d'analyse : rétention d'analyse 3 ans, rétention totale 3 ans" } }
    - { id: lake1y, text: { en: "Data lake tier: retention 1 year", fr: "Niveau data lake : rétention 1 an" } }
    - { id: an30lt1y, text: { en: "Analytics tier: analytics retention 30 days, total retention 1 year", fr: "Niveau d'analyse : rétention d'analyse 30 jours, rétention totale 1 an" } }
    - { id: an180, text: { en: "Analytics tier: analytics retention 180 days, total retention 180 days", fr: "Niveau d'analyse : rétention d'analyse 180 jours, rétention totale 180 jours" } }
  targets:
    - { id: secevent, text: SecurityEvent }
    - { id: flow, text: FirewallFlow_CL }
    - { id: signin, text: SigninLogs }
answer:
  mapping: { secevent: an90lt, flow: lake1y, signin: an180 }
explanation:
  correct:
    en: |
      SecurityEvent needs only 90 days in the analytics tier (free for Sentinel tables); the rest of the three years is cheap long-term retention in the data lake. FirewallFlow_CL is never used by real-time features, so the data lake tier gives minimal ingestion cost and KQL jobs still work. SigninLogs must be in the analytics tier for 180 days, and total retention equal to analytics retention deletes it afterwards.
    fr: |
      SecurityEvent n'a besoin que de 90 jours dans le niveau d'analyse (gratuits pour les tables Sentinel) ; le reste des trois ans est une rétention à long terme peu coûteuse dans le data lake. FirewallFlow_CL n'est jamais utilisée par les fonctionnalités en temps réel : le niveau data lake offre un coût d'ingestion minimal et les travaux KQL fonctionnent toujours. SigninLogs doit rester 180 jours dans le niveau d'analyse, et une rétention totale égale à la rétention d'analyse la supprime ensuite.
  options:
    an3y: { en: "Analytics retention can't exceed two years, and keeping three years in the analytics tier would be the most expensive option.", fr: "La rétention d'analyse ne peut pas dépasser deux ans, et conserver trois ans dans le niveau d'analyse serait l'option la plus coûteuse." }
    an30lt1y: { en: "This still charges analytics-tier ingestion for a high-volume table that no real-time feature uses.", fr: "Cette option facture toujours l'ingestion au niveau d'analyse pour une table volumineuse qu'aucune fonctionnalité en temps réel n'utilise." }
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
  - title: Configure table settings in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-table-tiers-retention
