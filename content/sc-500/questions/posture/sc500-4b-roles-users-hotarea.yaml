id: sc500-4b-roles-users-hotarea
objective: "4.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses Microsoft Sentinel on a workspace in a resource group named RG-SOC. The playbooks are also in RG-SOC. The following table shows the role assignments of five users. No other roles are assigned.

    Answer each prompt by selecting the user who can perform the task.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise Microsoft Sentinel sur un espace de travail situé dans un groupe de ressources nommé RG-SOC. Les playbooks se trouvent aussi dans RG-SOC. Le tableau suivant présente les attributions de rôles de cinq utilisateurs. Aucun autre rôle n'est attribué.

    Répondez à chaque consigne en sélectionnant l'utilisateur qui peut effectuer la tâche.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Close an incident and set its classification", fr: "Fermer un incident et définir sa classification" }
    - id: p2
      text: { en: "Create a workbook from a workbook template", fr: "Créer un classeur à partir d'un modèle de classeur" }
  grid:
    header: [{ en: "User", fr: "Utilisateur" }, { en: "Role assignments on RG-SOC", fr: "Attributions de rôles sur RG-SOC" }]
    rows:
      - [{ text: User1, area: u1 }, { text: "Microsoft Sentinel Reader, Workbook Contributor" }]
      - [{ text: User2, area: u2 }, { text: "Microsoft Sentinel Responder" }]
      - [{ text: User3, area: u3 }, { text: "Microsoft Sentinel Reader, Logic App Contributor" }]
      - [{ text: User4, area: u4 }, { text: "Microsoft Sentinel Playbook Operator, Logic App Contributor" }]
      - [{ text: User5, area: u5 }, { text: "Log Analytics Reader" }]
answer:
  values: { p1: u2, p2: u1 }
explanation:
  correct:
    en: |
      Closing an incident is incident management, which starts with Microsoft Sentinel Responder: only User2 has it. Creating a workbook requires Workbook Contributor together with a Microsoft Sentinel role that can view Sentinel resources, such as Reader: User1 has both. User3 and User4 can run or edit playbooks but have no incident management or workbook permission, and Log Analytics Reader only reads the workspace.
    fr: |
      Fermer un incident relève de la gestion des incidents, qui commence avec Microsoft Sentinel Responder : seul User2 en dispose. Créer un classeur exige Workbook Contributor avec un rôle Microsoft Sentinel qui permet de consulter les ressources Sentinel, comme Reader : User1 a les deux. User3 et User4 peuvent exécuter ou modifier des playbooks mais n'ont aucune autorisation de gestion des incidents ni des classeurs ; Log Analytics Reader permet seulement de lire l'espace de travail.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
