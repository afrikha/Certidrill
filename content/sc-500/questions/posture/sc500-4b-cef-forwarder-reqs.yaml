id: sc500-4b-cef-forwarder-reqs
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. plans to collect the CEF messages of its proxies in Microsoft Sentinel by using the Common Event Format (CEF) via AMA connector. You deploy an Azure virtual machine named vm-cef1 that runs a supported Linux distribution to act as the log forwarder.

    Which two components must be present on vm-cef1 before you run the forwarder installation script? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. prévoit de collecter les messages CEF de ses proxys dans Microsoft Sentinel à l'aide du connecteur Common Event Format (CEF) via AMA. Vous déployez une machine virtuelle Azure nommée vm-cef1, qui exécute une distribution Linux prise en charge, pour servir de redirecteur de journaux.

    Quels sont les deux composants qui doivent être présents sur vm-cef1 avant d'exécuter le script d'installation du redirecteur ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Python 2.7 or Python 3", fr: "Python 2.7 ou Python 3" } }
    - { id: b, text: { en: "The Log Analytics agent configured with the workspace ID and key", fr: "L'agent Log Analytics configuré avec l'ID et la clé de l'espace de travail" } }
    - { id: c, text: { en: "The rsyslog or syslog-ng daemon", fr: "Le démon rsyslog ou syslog-ng" } }
    - { id: d, text: { en: "The Azure Connected Machine agent", fr: "L'agent Azure Connected Machine" } }
    - { id: e, text: { en: "An inbound NSG rule that allows TCP 28330 from the proxies", fr: "Une règle NSG entrante qui autorise TCP 28330 depuis les proxys" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The forwarder must have Python 2.7 or 3, which runs the installation script, and the rsyslog or syslog-ng daemon, which the script configures to listen on port 514 and to forward messages to the Azure Monitor Agent. The agent itself is installed when you create the DCR from the connector page.
    fr: |
      Le redirecteur doit disposer de Python 2.7 ou 3, qui exécute le script d'installation, et du démon rsyslog ou syslog-ng, que le script configure pour écouter sur le port 514 et transmettre les messages à l'agent Azure Monitor. L'agent lui-même est installé lorsque vous créez la DCR depuis la page du connecteur.
  options:
    b:
      en: |
        The Log Analytics agent is retired; the connector uses the Azure Monitor Agent, deployed by the DCR.
      fr: |
        L'agent Log Analytics est mis hors service ; le connecteur utilise l'agent Azure Monitor, déployé par la DCR.
    d:
      en: |
        The Azure Connected Machine agent (Azure Arc) is required only when the forwarder isn't an Azure VM.
      fr: |
        L'agent Azure Connected Machine (Azure Arc) n'est exigé que si le redirecteur n'est pas une machine virtuelle Azure.
    e:
      en: |
        Sources send to the daemon on port 514; TCP 28330 is the local port on which the daemon hands messages to the agent.
      fr: |
        Les sources envoient au démon sur le port 514 ; TCP 28330 est le port local sur lequel le démon remet les messages à l'agent.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
