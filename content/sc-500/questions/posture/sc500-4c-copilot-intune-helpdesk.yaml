id: sc500-4c-copilot-intune-helpdesk
objective: "4.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Security Copilot and Microsoft Intune. Preinstalled plugins, including Microsoft Intune, are available to all users.

    The members of a security group named **Endpoint-Support** have no Security Copilot role and no Intune role. They must use Security Copilot to ask about device security postures and endpoint security policies in Intune. The solution must follow the principle of least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Security Copilot et Microsoft Intune. Les plug-ins préinstallés, dont Microsoft Intune, sont disponibles pour tous les utilisateurs.

    Les membres d'un groupe de sécurité nommé **Endpoint-Support** n'ont aucun rôle Security Copilot ni aucun rôle Intune. Ils doivent utiliser Security Copilot pour poser des questions sur la posture de sécurité des appareils et sur les stratégies de sécurité des points de terminaison dans Intune. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Intune Administrator role in Microsoft Entra ID to Endpoint-Support.", fr: "Attribuer le rôle Intune Administrator de Microsoft Entra ID à Endpoint-Support." } }
    - { id: b, text: { en: "Add Endpoint-Support to the Copilot contributor role.", fr: "Ajouter Endpoint-Support au rôle Copilot contributor." } }
    - { id: c, text: { en: "Add Endpoint-Support to the Copilot owner role.", fr: "Ajouter Endpoint-Support au rôle Copilot owner." } }
    - { id: d, text: { en: "Assign the Endpoint Security Manager Intune role to Endpoint-Support.", fr: "Attribuer le rôle Intune Endpoint Security Manager à Endpoint-Support." } }
    - { id: e, text: { en: "Set the preinstalled plugin availability to Owners only.", fr: "Définir la disponibilité des plug-ins préinstallés sur Owners only." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Copilot contributor gives access to the Security Copilot platform, but no data. Because plugins act on behalf of the user, the members also need an Intune role such as Endpoint Security Manager to read devices, policies and postures through the Intune plugin.
    fr: |
      Copilot contributor donne accès à la plateforme Security Copilot, mais à aucune donnée. Comme les plug-ins agissent pour le compte de l'utilisateur, les membres ont aussi besoin d'un rôle Intune comme Endpoint Security Manager pour lire les appareils, les stratégies et les postures via le plug-in Intune.
  options:
    a: { en: "Intune Administrator is a privileged Microsoft Entra role that also grants Copilot owner access; it exceeds least privilege.", fr: "Intune Administrator est un rôle Microsoft Entra privilégié qui donne aussi l'accès Copilot owner ; il dépasse le moindre privilège." }
    c: { en: "Copilot owner adds settings and capacity management that the group doesn't need.", fr: "Copilot owner ajoute la gestion des paramètres et de la capacité dont le groupe n'a pas besoin." }
    e: { en: "Restricting preinstalled plugins to owners would hide the Intune plugin from contributors.", fr: "Restreindre les plug-ins préinstallés aux propriétaires masquerait le plug-in Intune aux contributeurs." }
references:
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
