id: sc500-4b-hub-statements
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation manages the Microsoft Sentinel content of its workspace from the content hub. The installed solutions are at version 2.0.0 or later.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation gère le contenu Microsoft Sentinel de son espace de travail depuis le hub de contenu. Les solutions installées sont en version 2.0.0 ou ultérieure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When you delete a solution, the analytics rules that you created from its templates are deleted with it.
        fr: |
          Lorsque vous supprimez une solution, les règles analytiques que vous avez créées à partir de ses modèles sont supprimées avec elle.
    - id: s2
      text:
        en: |
          You can delete individual content items of an installed solution from its Manage page without deleting the whole solution.
        fr: |
          Vous pouvez supprimer des éléments de contenu individuels d'une solution installée depuis sa page Manage sans supprimer toute la solution.
    - id: s3
      text:
        en: |
          A solution that uses the Common Event Format (CEF) via AMA connector can be installed together with its dependencies by selecting Install with dependencies.
        fr: |
          Une solution qui utilise le connecteur Common Event Format (CEF) via AMA peut être installée avec ses dépendances en sélectionnant Install with dependencies.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Deleting a solution removes the solution and its content templates, but active, cloned, saved and custom items stay in the workspace. For solutions at version 2.0.0 or later, Manage lets you select individual content items and delete them; Reinstall restores them. Solutions that use the unified AMA connectors for CEF, syslog or custom logs have dependencies that Install with dependencies installs alongside the solution.
    fr: |
      La suppression d'une solution retire la solution et ses modèles de contenu, mais les éléments actifs, clonés, enregistrés et personnalisés restent dans l'espace de travail. Pour les solutions en version 2.0.0 ou ultérieure, Manage permet de sélectionner des éléments de contenu individuels et de les supprimer ; Reinstall les restaure. Les solutions qui utilisent les connecteurs AMA unifiés pour CEF, syslog ou les journaux personnalisés ont des dépendances qu'Install with dependencies installe avec la solution.
references:
  - title: Delete installed Microsoft Sentinel out-of-the-box content and solutions
    url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions-delete
  - title: Discover and manage Microsoft Sentinel out-of-the-box content
    url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions-deploy
