id: sc500-4a-rc-reporting
objective: "4.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys assesses its Azure subscriptions against PCI DSS in Microsoft Defender for Cloud. The compliance team has four requirements.

    Which Defender for Cloud feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys évalue ses abonnements Azure par rapport à PCI DSS dans Microsoft Defender for Cloud. L'équipe conformité a quatre exigences.

    Quelle fonctionnalité de Defender for Cloud devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: download, text: "Download report" }
    - { id: audit, text: "Audit reports" }
    - { id: export, text: { en: "Continuous export", fr: "Exportation continue" } }
    - { id: wfa, text: { en: "Workflow automation", fr: "Automatisation du workflow" } }
    - { id: score, text: { en: "Secure score", fr: "Degré de sécurisation" } }
    - { id: explorer, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité cloud" } }
  targets:
    - id: t1
      text: { en: "Give an external auditor a PDF summary of the PCI DSS status of the subscriptions, organized by control", fr: "Remettre à un auditeur externe un résumé PDF de l'état PCI DSS des abonnements, organisé par contrôle" }
    - id: t2
      text: { en: "Obtain Microsoft's own PCI certification documents for the Azure platform", fr: "Obtenir les documents de certification PCI de Microsoft pour la plateforme Azure" }
    - id: t3
      text: { en: "Send a weekly snapshot of the compliance data to a Log Analytics workspace", fr: "Envoyer chaque semaine un instantané des données de conformité vers un espace de travail Log Analytics" }
    - id: t4
      text: { en: "Email the control owner as soon as a compliance assessment fails", fr: "Envoyer un e-mail au responsable du contrôle dès qu'une évaluation de conformité échoue" }
answer:
  mapping: { t1: download, t2: audit, t3: export, t4: wfa }
explanation:
  correct:
    en: |-
      Download report produces a PDF summary of one standard organized by its controls. Audit reports provide Azure and Dynamics certification reports, such as the PCI attestation package. Continuous export can stream compliance data or send weekly snapshots to Event Hubs or Log Analytics. Workflow automation runs a logic app when a regulatory compliance assessment changes state.
    fr: |-
      Download report produit un résumé PDF d'une norme organisé par contrôle. Audit reports fournit les rapports de certification d'Azure et de Dynamics, comme le dossier d'attestation PCI. L'exportation continue peut diffuser les données de conformité en continu ou envoyer des instantanés hebdomadaires vers Event Hubs ou Log Analytics. L'automatisation du workflow exécute une application logique lorsqu'une évaluation de conformité réglementaire change d'état.
  options:
    score:
      en: |-
        The secure score measures security posture; it is not a compliance report or a notification.
      fr: |-
        Le degré de sécurisation mesure la posture de sécurité ; ce n'est ni un rapport de conformité ni une notification.
    explorer:
      en: |-
        Cloud security explorer queries the security graph; it doesn't export compliance data.
      fr: |-
        L'explorateur de sécurité cloud interroge le graphe de sécurité ; il n'exporte pas les données de conformité.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
