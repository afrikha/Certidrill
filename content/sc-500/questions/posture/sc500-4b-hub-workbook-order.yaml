id: sc500-4b-hub-workbook-order
objective: "4.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel in the Microsoft Defender portal. You have the Microsoft Sentinel Contributor and Workbook Contributor roles on the resource group of the workspace.

    You need to install a content hub solution that isn't installed yet, and then get a customizable copy of the workbook that the solution provides.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders utilise Microsoft Sentinel dans le portail Microsoft Defender. Vous disposez des rôles Microsoft Sentinel Contributor et Workbook Contributor sur le groupe de ressources de l'espace de travail.

    Vous devez installer une solution du hub de contenu qui n'est pas encore installée, puis obtenir une copie personnalisable du classeur fourni par la solution.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: find, text: { en: "In Microsoft Sentinel > Content management > Content hub, select the solution and select View details.", fr: "Dans Microsoft Sentinel > Content management > Content hub, sélectionner la solution puis View details." } }
    - { id: basics, text: { en: "Select Create, and then select the subscription, resource group and workspace on the Basics tab.", fr: "Sélectionner Create, puis sélectionner l'abonnement, le groupe de ressources et l'espace de travail dans l'onglet Basics." } }
    - { id: review, text: { en: "On the Review + create tab, wait for Validation Passed, and then select Create.", fr: "Dans l'onglet Review + create, attendre Validation Passed, puis sélectionner Create." } }
    - { id: save, text: { en: "Select Manage on the solution, select View template for the workbook, and then select Save.", fr: "Sélectionner Manage sur la solution, sélectionner View template pour le classeur, puis sélectionner Save." } }
    - { id: download, text: { en: "Select Download a template for automation and deploy the file.", fr: "Sélectionner Download a template for automation et déployer le fichier." } }
    - { id: connector, text: { en: "Open the connector page of the solution and wait for the status to become Connected.", fr: "Ouvrir la page du connecteur de la solution et attendre que le statut devienne Connected." } }
answer:
  sequence: [ find, basics, review, save ]
explanation:
  correct:
    en: |
      You open the solution from the content hub with View details, select Create, choose the subscription, resource group and workspace on the Basics tab, and deploy from Review + create once validation passes. The solution installs templates only: to get an editable workbook, open Manage, select View template on the workbook and then Save.
    fr: |
      Vous ouvrez la solution depuis le hub de contenu avec View details, sélectionnez Create, choisissez l'abonnement, le groupe de ressources et l'espace de travail dans l'onglet Basics, puis déployez depuis Review + create une fois la validation réussie. La solution n'installe que des modèles : pour obtenir un classeur modifiable, ouvrez Manage, sélectionnez View template sur le classeur, puis Save.
  options:
    download:
      en: |
        Downloading a template is for deploying the solution as code; the portal deployment already installs it.
      fr: |
        Le téléchargement d'un modèle sert à déployer la solution sous forme de code ; le déploiement dans le portail l'installe déjà.
    connector:
      en: |
        Configuring the data connector is needed to ingest data, not to save a copy of the workbook template.
      fr: |
        La configuration du connecteur de données sert à ingérer des données, pas à enregistrer une copie du modèle de classeur.
references:
  - title: Discover and manage Microsoft Sentinel out-of-the-box content
    url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions-deploy
