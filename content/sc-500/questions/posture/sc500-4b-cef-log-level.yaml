id: sc500-4b-cef-log-level
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys creates a data collection rule from the Syslog via AMA connector of Microsoft Sentinel. On the Collect tab, the administrator sets the minimum log level of the auth facility to LOG_WARNING and sets every other facility to none.

    Which severities of auth messages will be collected?
  fr: |
    Tailspin Toys crée une règle de collecte de données à partir du connecteur Syslog via AMA de Microsoft Sentinel. Dans l'onglet Collect, l'administrateur définit le niveau de journalisation minimal de la facility auth sur LOG_WARNING et définit toutes les autres facilities sur none.

    Quelles gravités de messages auth seront collectées ?
body:
  options:
    - { id: a, text: { en: "LOG_WARNING only", fr: "LOG_WARNING uniquement" } }
    - { id: b, text: { en: "LOG_WARNING, LOG_NOTICE, LOG_INFO and LOG_DEBUG", fr: "LOG_WARNING, LOG_NOTICE, LOG_INFO et LOG_DEBUG" } }
    - { id: c, text: { en: "LOG_WARNING, LOG_ERR, LOG_CRIT, LOG_ALERT and LOG_EMERG", fr: "LOG_WARNING, LOG_ERR, LOG_CRIT, LOG_ALERT et LOG_EMERG" } }
    - { id: d, text: { en: "All severities from LOG_DEBUG to LOG_EMERG", fr: "Toutes les gravités, de LOG_DEBUG à LOG_EMERG" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The level selected on the Collect tab is a minimum: the agent collects that level and every higher-severity level. The syslog order from highest to lowest is LOG_EMERG, LOG_ALERT, LOG_CRIT, LOG_ERR, LOG_WARNING, LOG_NOTICE, LOG_INFO, LOG_DEBUG, so LOG_WARNING collects LOG_WARNING through LOG_EMERG.
    fr: |
      Le niveau sélectionné dans l'onglet Collect est un minimum : l'agent collecte ce niveau et tous les niveaux de gravité supérieure. L'ordre syslog, du plus grave au moins grave, est LOG_EMERG, LOG_ALERT, LOG_CRIT, LOG_ERR, LOG_WARNING, LOG_NOTICE, LOG_INFO, LOG_DEBUG : LOG_WARNING collecte donc de LOG_WARNING à LOG_EMERG.
  options:
    a:
      en: |
        The setting isn't an exact match; higher severities are collected too.
      fr: |
        Le paramètre n'est pas une correspondance exacte ; les gravités supérieures sont aussi collectées.
    b:
      en: |
        This list contains the lower severities, which are the ones excluded by a minimum of LOG_WARNING.
      fr: |
        Cette liste contient les gravités inférieures, justement exclues par un minimum de LOG_WARNING.
    d:
      en: |
        All severities would be collected only with a minimum of LOG_DEBUG.
      fr: |
        Toutes les gravités ne seraient collectées qu'avec un minimum de LOG_DEBUG.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
