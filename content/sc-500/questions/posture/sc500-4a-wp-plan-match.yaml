id: sc500-4a-wp-plan-match
objective: "4.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders wants Microsoft Defender for Cloud to raise alerts for four types of threats in an Azure subscription.

    Which Defender plan should you enable for each threat? To answer, drag the appropriate plans to the correct threats. Each plan may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders souhaite que Microsoft Defender for Cloud déclenche des alertes pour quatre types de menaces dans un abonnement Azure.

    Quel plan Defender devez-vous activer pour chaque menace ? Pour répondre, faites glisser les plans appropriés vers les menaces correspondantes. Chaque plan peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: arm, text: "Defender for Resource Manager" }
    - { id: kv, text: "Defender for Key Vault" }
    - { id: stor, text: "Defender for Storage" }
    - { id: db, text: "Defender for Databases" }
    - { id: app, text: "Defender for App Service" }
    - { id: api, text: "Defender for APIs" }
  targets:
    - id: t1
      text: { en: "Suspicious management operations performed on resources through Azure Resource Manager", fr: "Opérations de gestion suspectes effectuées sur les ressources via Azure Resource Manager" }
    - id: t2
      text: { en: "Unusual attempts to access the secrets of a key vault", fr: "Tentatives inhabituelles d'accès aux secrets d'un coffre de clés" }
    - id: t3
      text: { en: "A malicious file uploaded to a blob container", fr: "Un fichier malveillant chargé dans un conteneur blob" }
    - id: t4
      text: { en: "Suspicious activity against an Azure Cosmos DB account", fr: "Activité suspecte contre un compte Azure Cosmos DB" }
answer:
  mapping: { t1: arm, t2: kv, t3: stor, t4: db }
explanation:
  correct:
    en: |-
      Defender for Resource Manager monitors management operations. Defender for Key Vault detects unusual access to vaults. Defender for Storage provides activity monitoring and on-upload malware scanning for blobs. Defender for Databases covers Azure SQL, SQL servers on machines, open-source relational databases and Azure Cosmos DB.
    fr: |-
      Defender for Resource Manager surveille les opérations de gestion. Defender for Key Vault détecte les accès inhabituels aux coffres. Defender for Storage fournit la surveillance de l'activité et l'analyse des programmes malveillants au chargement des blobs. Defender for Databases couvre Azure SQL, les serveurs SQL sur des machines, les bases de données relationnelles open source et Azure Cosmos DB.
  options:
    app:
      en: |-
        Defender for App Service protects web apps hosted on App Service, which none of these threats target.
      fr: |-
        Defender for App Service protège les applications web hébergées sur App Service, qu'aucune de ces menaces ne vise.
    api:
      en: |-
        Defender for APIs protects APIs published through Azure API Management.
      fr: |-
        Defender for APIs protège les API publiées via Azure API Management.
references:
  - title: Protect your databases with Defender for Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-databases-plan
  - title: What is Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
