id: sc500-4a-rc-take-action
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum assesses its Azure subscriptions against the CIS benchmark in Microsoft Defender for Cloud. On the **Regulatory compliance** dashboard, an automated assessment of one control fails for a virtual machine named **VM3**.

    You open the failing assessment and select VM3.

    You need to go directly to the Azure portal page where you can correct the configuration of VM3.

    What should you select?
  fr: |
    Adatum évalue ses abonnements Azure par rapport au benchmark CIS dans Microsoft Defender for Cloud. Dans le tableau de bord **Regulatory compliance**, une évaluation automatisée d'un contrôle échoue pour une machine virtuelle nommée **VM3**.

    Vous ouvrez l'évaluation en échec et sélectionnez VM3.

    Vous devez accéder directement à la page du portail Azure où vous pouvez corriger la configuration de VM3.

    Que devez-vous sélectionner ?
body:
  options:
    - { id: a, text: "Attest" }
    - { id: b, text: "Take action" }
    - { id: c, text: "Download report" }
    - { id: d, text: "Audit reports" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For an automated assessment, you select the failing resource and then **Take action**, which opens the relevant Azure portal page, for example the Security tab of a virtual machine. The compliance status changes after the next assessment run.
    fr: |-
      Pour une évaluation automatisée, vous sélectionnez la ressource non conforme puis **Take action**, qui ouvre la page appropriée du portail Azure, par exemple l'onglet Security d'une machine virtuelle. L'état de conformité change après la prochaine exécution des évaluations.
  options:
    a:
      en: |-
        Attest is used for manual assessments, to record that a control is met and attach evidence.
      fr: |-
        Attest sert aux évaluations manuelles, pour enregistrer qu'un contrôle est satisfait et joindre une preuve.
    c:
      en: |-
        Download report generates a PDF summary of the standard; it doesn't open the resource.
      fr: |-
        Download report génère un résumé PDF de la norme ; il n'ouvre pas la ressource.
    d:
      en: |-
        Audit reports downloads Microsoft certification reports for Azure; it doesn't fix your resources.
      fr: |-
        Audit reports télécharge les rapports de certification de Microsoft pour Azure ; il ne corrige pas vos ressources.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
