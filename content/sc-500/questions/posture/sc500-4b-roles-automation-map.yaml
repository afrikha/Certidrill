id: sc500-4b-roles-automation-map
objective: "4.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Sentinel. Playbooks are stored in a resource group named RG-Automation. You are preparing the role assignments that the SOC needs for playbooks and workbooks.

    Which role should you use for each requirement? To answer, drag the appropriate roles to the correct requirements. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Sentinel. Les playbooks sont stockés dans un groupe de ressources nommé RG-Automation. Vous préparez les attributions de rôles dont le SOC a besoin pour les playbooks et les classeurs.

    Quel rôle devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les rôles appropriés vers les exigences correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: logic, text: Logic App Contributor }
    - { id: auto, text: Microsoft Sentinel Automation Contributor }
    - { id: owner, text: Owner }
    - { id: workbook, text: Workbook Contributor }
    - { id: operator, text: Microsoft Sentinel Playbook Operator }
    - { id: lacontrib, text: Log Analytics Contributor }
  targets:
    - { id: t1, text: { en: "Users who create and edit the playbooks in RG-Automation", fr: "Utilisateurs qui créent et modifient les playbooks de RG-Automation" } }
    - { id: t2, text: { en: "Role that the Microsoft Sentinel service account needs on RG-Automation so that automation rules can run its playbooks", fr: "Rôle dont le compte de service Microsoft Sentinel a besoin sur RG-Automation pour que les règles d'automatisation puissent exécuter ses playbooks" } }
    - { id: t3, text: { en: "Role of the administrator who grants that permission to the service account", fr: "Rôle de l'administrateur qui accorde cette autorisation au compte de service" } }
    - { id: t4, text: { en: "Role that users need, in addition to a Microsoft Sentinel role, to create and delete workbooks", fr: "Rôle dont les utilisateurs ont besoin, en plus d'un rôle Microsoft Sentinel, pour créer et supprimer des classeurs" } }
answer:
  mapping: { t1: logic, t2: auto, t3: owner, t4: workbook }
explanation:
  correct:
    en: |
      Playbooks are Logic Apps resources, created and edited with Logic App Contributor. Automation rules run playbooks through the Microsoft Sentinel service account, which needs Microsoft Sentinel Automation Contributor on the playbooks' resource group; assigning it requires Owner on that resource group. Workbook Contributor, combined with a Microsoft Sentinel role, lets users create and delete workbooks.
    fr: |
      Les playbooks sont des ressources Logic Apps, créées et modifiées avec Logic App Contributor. Les règles d'automatisation exécutent les playbooks via le compte de service Microsoft Sentinel, qui a besoin de Microsoft Sentinel Automation Contributor sur le groupe de ressources des playbooks ; l'attribuer exige Owner sur ce groupe de ressources. Workbook Contributor, associé à un rôle Microsoft Sentinel, permet de créer et de supprimer des classeurs.
  options:
    operator:
      en: |
        Playbook Operator lets users run playbooks manually; it doesn't allow editing them and isn't the role of the service account.
      fr: |
        Playbook Operator permet aux utilisateurs d'exécuter manuellement les playbooks ; il ne permet pas de les modifier et ce n'est pas le rôle du compte de service.
    lacontrib:
      en: |
        Log Analytics Contributor manages workspaces and their data; it isn't needed for playbooks or workbooks here.
      fr: |
        Log Analytics Contributor gère les espaces de travail et leurs données ; il n'est pas nécessaire ici pour les playbooks ni les classeurs.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
