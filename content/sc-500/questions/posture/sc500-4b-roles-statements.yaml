id: sc500-4b-roles-statements
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel on a workspace that is onboarded to the Microsoft Defender portal, with the Microsoft Sentinel data lake enabled. Roles are assigned at the resource group that contains the workspace.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Sentinel sur un espace de travail intégré au portail Microsoft Defender, avec le data lake de Microsoft Sentinel activé. Les rôles sont attribués sur le groupe de ressources qui contient l'espace de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who is assigned both Microsoft Sentinel Reader and Microsoft Sentinel Contributor can create analytics rules.
        fr: |
          Un utilisateur qui dispose à la fois de Microsoft Sentinel Reader et de Microsoft Sentinel Contributor peut créer des règles analytiques.
    - id: s2
      text:
        en: |
          A user who is assigned only Microsoft Sentinel Responder can save a new workbook from a workbook template.
        fr: |
          Un utilisateur qui dispose uniquement de Microsoft Sentinel Responder peut enregistrer un nouveau classeur à partir d'un modèle de classeur.
    - id: s3
      text:
        en: |
          A user who holds the Security Reader role in Microsoft Entra ID can read the data lake data of all the workspaces.
        fr: |
          Un utilisateur qui dispose du rôle Security Reader dans Microsoft Entra ID peut lire les données du data lake de tous les espaces de travail.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Role assignments are cumulative, so the Contributor assignment applies even though the user is also a Reader. Creating or deleting workbooks requires Workbook Contributor in addition to a Microsoft Sentinel role, so Responder alone isn't enough. Read access to the data lake across all workspaces is granted by Microsoft Entra roles such as Security Reader, Security Operator, Security Administrator or Global Reader.
    fr: |
      Les attributions de rôles sont cumulatives : l'attribution Contributor s'applique même si l'utilisateur est aussi Reader. Créer ou supprimer des classeurs exige Workbook Contributor en plus d'un rôle Microsoft Sentinel : Responder seul ne suffit pas. L'accès en lecture au data lake de tous les espaces de travail est accordé par des rôles Microsoft Entra comme Security Reader, Security Operator, Security Administrator ou Global Reader.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
