id: sc500-4a-cspm-billable
objective: "4.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to enable the Defender CSPM plan on an Azure subscription named **Sub1**. Sub1 contains the following resources:

    | Name | Type | Configuration |
    | --- | --- | --- |
    | VM1 | Virtual machine | Running |
    | VM2 | Virtual machine | Stopped (deallocated) |
    | st1 | Storage account (general-purpose v2) | Two blob containers |
    | st2 | Storage account (general-purpose v2) | No blob container and no file share |
    | kv1 | Key vault | 40 secrets |

    Which two resources will be billed for the Defender CSPM plan?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit d'activer le plan Defender CSPM sur un abonnement Azure nommé **Sub1**. Sub1 contient les ressources suivantes :

    | Nom | Type | Configuration |
    | --- | --- | --- |
    | VM1 | Machine virtuelle | En cours d'exécution |
    | VM2 | Machine virtuelle | Arrêtée (libérée) |
    | st1 | Compte de stockage (usage général v2) | Deux conteneurs blob |
    | st2 | Compte de stockage (usage général v2) | Aucun conteneur blob et aucun partage de fichiers |
    | kv1 | Coffre de clés | 40 secrets |

    Quelles sont les deux ressources qui seront facturées pour le plan Defender CSPM ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: VM1 }
    - { id: b, text: VM2 }
    - { id: c, text: st1 }
    - { id: d, text: st2 }
    - { id: e, text: kv1 }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Defender CSPM is billed per billable resource, not per subscription. Billable Azure resources include virtual machines and storage accounts, but deallocated VMs and storage accounts without blob containers or file shares are excluded. VM1 and st1 are therefore billed.
    fr: |-
      Defender CSPM est facturé par ressource facturable, et non par abonnement. Les ressources Azure facturables incluent les machines virtuelles et les comptes de stockage, mais les machines virtuelles libérées et les comptes de stockage sans conteneur blob ni partage de fichiers sont exclus. VM1 et st1 sont donc facturés.
  options:
    b:
      en: |-
        Deallocated virtual machines are excluded from Defender CSPM billing.
      fr: |-
        Les machines virtuelles libérées sont exclues de la facturation de Defender CSPM.
    d:
      en: |-
        Storage accounts without blob containers or file shares are excluded from Defender CSPM billing.
      fr: |-
        Les comptes de stockage sans conteneur blob ni partage de fichiers sont exclus de la facturation de Defender CSPM.
    e:
      en: |-
        Key vaults are not in the list of Defender CSPM billable resource types.
      fr: |-
        Les coffres de clés ne figurent pas parmi les types de ressources facturables de Defender CSPM.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
