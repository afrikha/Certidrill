id: sc500-4b-cef-agent-role
objective: "4.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank collects CEF messages in Microsoft Sentinel through an Azure virtual machine named vm-fwd1 that runs rsyslog. The resources are deployed as follows:

    | Resource | Resource group |
    | --- | --- |
    | Microsoft Sentinel workspace law-wgb | RG-SOC |
    | Virtual machine vm-fwd1 | RG-Network |

    An engineer named Eng1 has the Microsoft Sentinel Contributor and Monitoring Contributor roles on RG-SOC. Eng1 creates a data collection rule (DCR) from the Common Event Format (CEF) via AMA connector page and selects vm-fwd1 on the Resources tab. The DCR is created, but the deployment fails when it installs the Azure Monitor Agent on vm-fwd1.

    You need Eng1 to be able to complete the configuration. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Woodgrove Bank collecte des messages CEF dans Microsoft Sentinel par l'intermédiaire d'une machine virtuelle Azure nommée vm-fwd1 qui exécute rsyslog. Les ressources sont déployées comme suit :

    | Ressource | Groupe de ressources |
    | --- | --- |
    | Espace de travail Microsoft Sentinel law-wgb | RG-SOC |
    | Machine virtuelle vm-fwd1 | RG-Network |

    Un ingénieur nommé Eng1 dispose des rôles Microsoft Sentinel Contributor et Monitoring Contributor sur RG-SOC. Eng1 crée une règle de collecte de données (DCR) depuis la page du connecteur Common Event Format (CEF) via AMA et sélectionne vm-fwd1 dans l'onglet Resources. La DCR est créée, mais le déploiement échoue lors de l'installation de l'agent Azure Monitor sur vm-fwd1.

    Eng1 doit pouvoir terminer la configuration. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Eng1 the Azure Connected Machine Resource Administrator role on RG-Network.", fr: "Attribuer à Eng1 le rôle Azure Connected Machine Resource Administrator sur RG-Network." } }
    - { id: b, text: { en: "Assign Eng1 the Log Analytics Contributor role on law-wgb.", fr: "Attribuer à Eng1 le rôle Log Analytics Contributor sur law-wgb." } }
    - { id: c, text: { en: "Assign Eng1 the Monitoring Metrics Publisher role on the DCR.", fr: "Attribuer à Eng1 le rôle Monitoring Metrics Publisher sur la DCR." } }
    - { id: d, text: { en: "Assign Eng1 the Virtual Machine Contributor role on vm-fwd1.", fr: "Attribuer à Eng1 le rôle Virtual Machine Contributor sur vm-fwd1." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Creating the DCR requires Monitoring Contributor, which Eng1 has, but deploying the agent requires Virtual Machine Contributor (for Azure VMs) or Azure Connected Machine Resource Administrator (for Azure Arc-enabled servers) on the machines. vm-fwd1 is an Azure VM in another resource group, so Virtual Machine Contributor scoped to vm-fwd1 is the least privileged fix.
    fr: |
      La création de la DCR exige Monitoring Contributor, dont Eng1 dispose, mais le déploiement de l'agent exige Virtual Machine Contributor (machines virtuelles Azure) ou Azure Connected Machine Resource Administrator (serveurs avec Azure Arc) sur les machines. vm-fwd1 est une machine virtuelle Azure située dans un autre groupe de ressources : Virtual Machine Contributor limité à vm-fwd1 est la correction qui accorde le moins de privilèges.
  options:
    a:
      en: |
        Azure Connected Machine Resource Administrator manages Azure Arc-enabled servers; vm-fwd1 is an Azure VM.
      fr: |
        Azure Connected Machine Resource Administrator gère les serveurs avec Azure Arc ; vm-fwd1 est une machine virtuelle Azure.
    b:
      en: |
        Permissions on the workspace don't allow installing an extension on the virtual machine.
      fr: |
        Des autorisations sur l'espace de travail ne permettent pas d'installer une extension sur la machine virtuelle.
    c:
      en: |
        Monitoring Metrics Publisher lets a client send data through the Logs Ingestion API; it doesn't deploy agents.
      fr: |
        Monitoring Metrics Publisher permet à un client d'envoyer des données via l'API d'ingestion de journaux ; il ne déploie pas d'agent.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
