id: sc500-4a-rc-attest
objective: "4.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso assesses its Azure subscriptions against NIST SP 800-53 in Microsoft Defender for Cloud. One control of the standard has a manual assessment that requires proof of a yearly security awareness training.

    You need to record that the control is met for the subscription **Sub-HR** and attach the training report as evidence.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso évalue ses abonnements Azure par rapport à NIST SP 800-53 dans Microsoft Defender for Cloud. Un contrôle de la norme comporte une évaluation manuelle qui exige la preuve d'une formation annuelle de sensibilisation à la sécurité.

    Vous devez enregistrer que le contrôle est satisfait pour l'abonnement **Sub-HR** et joindre le rapport de formation comme preuve.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "Open **Regulatory compliance**, select NIST SP 800-53 and expand the control.", fr: "Ouvrir **Regulatory compliance**, sélectionner NIST SP 800-53 et développer le contrôle." } }
    - { id: assess, text: { en: "Under **Manual attestation and evidence**, select the assessment.", fr: "Sous **Manual attestation and evidence**, sélectionner l'évaluation." } }
    - { id: sub, text: { en: "Select the Sub-HR subscription.", fr: "Sélectionner l'abonnement Sub-HR." } }
    - { id: attest, text: { en: "Select **Attest**, enter the required information and attach the evidence.", fr: "Sélectionner **Attest**, saisir les informations demandées et joindre la preuve." } }
    - { id: save, text: { en: "Select **Save**.", fr: "Sélectionner **Save**." } }
    - { id: take, text: { en: "Select **Take action** to open the resource page.", fr: "Sélectionner **Take action** pour ouvrir la page de la ressource." } }
    - { id: report, text: { en: "Select **Download report** and upload the PDF to the control.", fr: "Sélectionner **Download report** et charger le PDF sur le contrôle." } }
answer:
  sequence: [ open, assess, sub, attest, save ]
explanation:
  correct:
    en: |-
      Manual assessments aren't evaluated from resource configuration. You open the standard and its control, select the assessment under Manual attestation and evidence, select the subscriptions, select Attest to enter the details and attach the evidence, and then save.
    fr: |-
      Les évaluations manuelles ne sont pas calculées à partir de la configuration des ressources. Vous ouvrez la norme et son contrôle, sélectionnez l'évaluation sous Manual attestation and evidence, sélectionnez les abonnements, sélectionnez Attest pour saisir les détails et joindre la preuve, puis enregistrez.
  options:
    take:
      en: |-
        Take action opens the page where you fix a failing resource of an automated assessment; it doesn't record evidence.
      fr: |-
        Take action ouvre la page où corriger une ressource non conforme d'une évaluation automatisée ; il n'enregistre pas de preuve.
    report:
      en: |-
        Download report generates a PDF summary of the standard for stakeholders; it isn't evidence that you attach to a control.
      fr: |-
        Download report génère un résumé PDF de la norme pour les parties prenantes ; ce n'est pas une preuve à joindre à un contrôle.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
