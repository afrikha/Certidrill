id: sc500-4b-cef-transform
objective: "4.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation collects syslog and CEF messages on the same facility through a Linux log forwarder that runs Azure Monitor Agent 1.41. CEF messages are duplicated in the Syslog table. Some appliances send CEF messages whose syslog header doesn't follow RFC 3164 or RFC 5424.

    You need to complete the ingestion-time transformation of the syslog data collection rule so that it drops every CEF message from the Syslog stream.

    How should you complete the transformation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation collecte des messages syslog et CEF sur la même facility par l'intermédiaire d'un redirecteur de journaux Linux qui exécute l'agent Azure Monitor 1.41. Les messages CEF sont dupliqués dans la table Syslog. Certaines appliances envoient des messages CEF dont l'en-tête syslog ne respecte ni la RFC 3164 ni la RFC 5424.

    Vous devez compléter la transformation au moment de l'ingestion de la règle de collecte de données syslog pour qu'elle supprime tous les messages CEF du flux Syslog.

    Comment devez-vous compléter la transformation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "transformKql": "source | where [[col1]] !contains \"CEF\" and [[col2]] [[op]] \"CEF:0\""
  slots:
    - id: col1
      options:
        - { id: process, text: ProcessName }
        - { id: facility, text: Facility }
        - { id: host, text: HostName }
    - id: col2
      options:
        - { id: message, text: SyslogMessage }
        - { id: vendor, text: DeviceVendor }
        - { id: severity, text: SeverityLevel }
    - id: op
      options:
        - { id: notcontains, text: "!contains" }
        - { id: contains, text: contains }
        - { id: equals, text: "==" }
answer:
  values: { col1: process, col2: message, op: notcontains }
explanation:
  correct:
    en: |
      Microsoft's transformation keeps only the records whose ProcessName doesn't contain "CEF" and whose SyslogMessage doesn't contain "CEF:0". From AMA 1.41, ProcessName might not contain "CEF" for vendors with non-compliant headers, so both columns must be checked. A record is kept only if neither test detects CEF, so every CEF message is dropped.
    fr: |
      La transformation de Microsoft ne conserve que les enregistrements dont ProcessName ne contient pas « CEF » et dont SyslogMessage ne contient pas « CEF:0 ». À partir de l'AMA 1.41, ProcessName peut ne pas contenir « CEF » pour les fournisseurs dont les en-têtes ne sont pas conformes : les deux colonnes doivent donc être testées. Un enregistrement n'est conservé que si aucun des deux tests ne détecte CEF : tous les messages CEF sont supprimés.
  options:
    contains:
      en: |
        contains would keep only the CEF messages in the Syslog table and drop the real syslog messages.
      fr: |
        contains ne conserverait dans la table Syslog que les messages CEF et supprimerait les vrais messages syslog.
    vendor:
      en: |
        DeviceVendor is a column of CommonSecurityLog; the Syslog stream has no such column.
      fr: |
        DeviceVendor est une colonne de CommonSecurityLog ; le flux Syslog n'a pas de telle colonne.
    facility:
      en: |
        Syslog and CEF share the same facility here, so the facility can't tell them apart.
      fr: |
        Syslog et CEF partagent ici la même facility : elle ne permet pas de les distinguer.
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
