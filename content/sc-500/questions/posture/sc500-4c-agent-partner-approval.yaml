id: sc500-4c-agent-partner-approval
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Security Copilot. A Copilot contributor named **User5** deploys a partner-built agent that reads Microsoft Defender and Microsoft Sentinel data. On the agent page, a banner states that the agent requires Global Administrator consent, and the **Set up** button is disabled.

    You need to ensure that User5 can finish setting up the agent. The solution must follow the principle of least privilege.

    What should be done first?
  fr: |
    Fabrikam utilise Microsoft Security Copilot. Une Copilot contributor nommée **User5** déploie un agent conçu par un partenaire qui lit des données Microsoft Defender et Microsoft Sentinel. Sur la page de l'agent, une bannière indique que l'agent exige le consentement d'un Global Administrator, et le bouton **Set up** est désactivé.

    Vous devez faire en sorte que User5 puisse terminer la configuration de l'agent. La solution doit respecter le principe du moindre privilège.

    Que faut-il faire en premier ?
body:
  options:
    - { id: a, text: { en: "User5 selects Copy Link and sends the link to a Global Administrator, who selects Start approval.", fr: "User5 sélectionne Copy Link et envoie le lien à un Global Administrator, qui sélectionne Start approval." } }
    - { id: b, text: { en: "A Copilot owner opens the agent page and selects Set up on behalf of User5.", fr: "Un Copilot owner ouvre la page de l'agent et sélectionne Set up à la place de User5." } }
    - { id: c, text: { en: "A Security Administrator opens the link and selects Start approval.", fr: "Un Security Administrator ouvre le lien et sélectionne Start approval." } }
    - { id: d, text: { en: "User5 is assigned the Global Administrator role and approves the agent.", fr: "Le rôle Global Administrator est attribué à User5, qui approuve l'agent." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A partner agent that accesses data from a Microsoft product such as Defender or Sentinel needs Global Administrator approval. The owner or contributor copies the link and sends it to a Global Administrator, who reviews the agent and selects Start approval; then User5 selects Set up and completes the configuration with an existing user account.
    fr: |
      Un agent partenaire qui accède aux données d'un produit Microsoft comme Defender ou Sentinel exige l'approbation d'un Global Administrator. Le propriétaire ou le contributeur copie le lien et l'envoie à un Global Administrator, qui examine l'agent et sélectionne Start approval ; User5 sélectionne ensuite Set up et termine la configuration avec un compte d'utilisateur existant.
  options:
    b: { en: "Owners face the same disabled Set up button until a Global Administrator approves the agent.", fr: "Les propriétaires voient le même bouton Set up désactivé tant qu'un Global Administrator n'a pas approuvé l'agent." }
    c: { en: "The consent banner requires a Global Administrator; Security Administrator can't grant this approval.", fr: "La bannière de consentement exige un Global Administrator ; Security Administrator ne peut pas accorder cette approbation." }
    d: { en: "Giving User5 Global Administrator permanently violates least privilege; an existing Global Administrator approves instead.", fr: "Donner durablement Global Administrator à User5 enfreint le moindre privilège ; c'est un Global Administrator existant qui approuve." }
references:
  - title: Setup and manage Security Copilot agents
    url: https://learn.microsoft.com/en-us/copilot/security/agents-manage
