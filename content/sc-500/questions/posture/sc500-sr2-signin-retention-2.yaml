id: sc500-sr2-signin-retention-2
objective: "4.2.9"
type: series_yesno
series: sc500-sr2-signin-retention
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You set 90 days of analytics retention and 1,095 days of total retention.
  fr: Vous définissez 90 jours de rétention d'analyse et 1 095 jours de rétention totale.
body:
  solution:
    en: In law-sec, you open **Tables**, select **Manage table** for SigninLogs, and in **Data retention settings** you set the analytics retention to **90 days** and the total retention to **1,095 days**.
    fr: Dans law-sec, vous ouvrez **Tables**, sélectionnez **Manage table** pour SigninLogs et, dans **Data retention settings**, vous définissez la rétention d'analyse sur **90 jours** et la rétention totale sur **1 095 jours**.
answer: { value: false }
explanation:
  correct:
    en: This is the cheapest configuration, but after 90 days the data leaves the analytics retention. Long-term data cannot be used by hunting queries or workbooks; it must first be brought back with a search job, a restore, or a KQL job. The 180-day requirement is not met.
    fr: "C'est la configuration la moins coûteuse, mais après 90 jours les données quittent la rétention d'analyse. Les données en rétention à long terme ne sont pas utilisables par les requêtes de chasse proactive ni par les classeurs : il faut d'abord les récupérer par un travail de recherche, une restauration ou un travail KQL. L'exigence de 180 jours n'est pas satisfaite."
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
