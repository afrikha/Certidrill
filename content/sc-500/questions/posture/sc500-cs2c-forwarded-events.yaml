id: sc500-cs2c-forwarded-events
objective: "4.2.6"
type: yesno_statements
caseStudy: sc500-cs2c-margies-travel
difficulty: 2
status: draft
stem:
  en: |
    You plan to use the Windows Forwarded Events connector of Microsoft Sentinel to meet the requirement for the workstation Security events.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser le connecteur Windows Forwarded Events de Microsoft Sentinel pour respecter l'exigence relative aux événements de sécurité des postes de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          wec01 must be connected to Azure Arc before you enable the connector for wec01.
        fr: |
          wec01 doit être connecté à Azure Arc avant que vous activiez le connecteur pour wec01.
    - id: s2
      text:
        en: |
          The Security events that the workstations forward through wec01 are written to the SecurityEvent table of law-travel.
        fr: |
          Les événements de sécurité que les postes de travail transfèrent par wec01 sont écrits dans la table SecurityEvent de law-travel.
    - id: s3
      text:
        en: |
          When you add wec01 as a resource of the data collection rule in the connector wizard, the Azure Monitor Agent is installed on wec01 if it isn't installed yet.
        fr: |
          Quand vous ajoutez wec01 comme ressource de la règle de collecte de données dans l'Assistant du connecteur, l'agent Azure Monitor est installé sur wec01 s'il ne l'est pas encore.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A system that isn't an Azure VM, such as the on-premises wec01, must have Azure Arc installed and enabled before you enable an Azure Monitor Agent-based connector. Events collected through Windows Event Forwarding, including forwarded Security log events, are written to the WindowsEvent table, not to SecurityEvent. The data collection rule wizard installs the Azure Monitor Agent on the selected machines that don't have it yet.
    fr: |
      Un système qui n'est pas une machine virtuelle Azure, comme le serveur local wec01, doit avoir Azure Arc installé et activé avant que vous activiez un connecteur basé sur l'agent Azure Monitor. Les événements collectés par le transfert d'événements Windows, y compris les événements transférés du journal Sécurité, sont écrits dans la table WindowsEvent, pas dans SecurityEvent. L'Assistant de règle de collecte de données installe l'agent Azure Monitor sur les machines sélectionnées qui n'en disposent pas encore.
  options:
    s2: { en: "Built-in rules that query SecurityEvent don't match data stored only in WindowsEvent; they would need to be adapted.", fr: "Les règles intégrées qui interrogent SecurityEvent ne trouvent pas les données stockées uniquement dans WindowsEvent ; il faudrait les adapter." }
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
