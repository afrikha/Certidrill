id: sc500-cs4a-ai-posture
objective: "4.1.1"
type: single
caseStudy: sc500-cs4a-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the requirement of the security team to identify attack paths and generative AI components. What should you do on Sub-AI?
  fr: |
    Vous devez respecter l'exigence de l'équipe de sécurité concernant les chemins d'attaque et les composants d'IA générative. Que devez-vous faire sur Sub-AI ?
body:
  options:
    - { id: a, text: { en: "Enable the AI services plan in Defender for Cloud.", fr: "Activer le plan AI services dans Defender for Cloud." } }
    - { id: b, text: { en: "Enable the Defender CSPM plan in Defender for Cloud.", fr: "Activer le plan Defender CSPM dans Defender for Cloud." } }
    - { id: c, text: { en: "Assign the Microsoft cloud security benchmark to Sub-AI.", fr: "Affecter le Microsoft cloud security benchmark à Sub-AI." } }
    - { id: d, text: { en: "Enable the Defender for Resource Manager plan in Defender for Cloud.", fr: "Activer le plan Defender for Resource Manager dans Defender for Cloud." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AI security posture management is part of the Defender CSPM plan. It discovers the generative AI bill of materials (AI BOM) of an application and uses attack path analysis to show how an attacker could reach resources such as fdy-trips. Foundational CSPM, which Sub-AI already has, includes neither attack path analysis nor AI security posture management.
    fr: |
      La gestion de la posture de sécurité de l'IA fait partie du plan Defender CSPM. Elle découvre la nomenclature d'IA générative (AI BOM) d'une application et utilise l'analyse des chemins d'attaque pour montrer comment un attaquant pourrait atteindre des ressources comme fdy-trips. Le CSPM de base (foundational CSPM), dont Sub-AI dispose déjà, n'inclut ni l'analyse des chemins d'attaque ni la gestion de la posture de sécurité de l'IA.
  options:
    a:
      en: |
        The AI services plan provides threat protection and alerts at run time; it does not provide attack path analysis or the AI BOM.
      fr: |
        Le plan AI services fournit la protection contre les menaces et des alertes à l'exécution ; il ne fournit ni l'analyse des chemins d'attaque ni l'AI BOM.
    c:
      en: |
        The Microsoft cloud security benchmark is already the default standard of foundational CSPM; assessing it does not add attack paths.
      fr: |
        Le Microsoft cloud security benchmark est déjà la norme par défaut du CSPM de base ; l'évaluer n'ajoute pas de chemins d'attaque.
    d:
      en: |
        Defender for Resource Manager detects suspicious management operations; it does not map attack paths or AI components.
      fr: |
        Defender for Resource Manager détecte les opérations de gestion suspectes ; il ne cartographie ni les chemins d'attaque ni les composants d'IA.
references:
  - title: Overview - AI security posture management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-security-posture
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
