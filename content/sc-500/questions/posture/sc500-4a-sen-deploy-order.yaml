id: sc500-4a-sen-deploy-order
objective: "4.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is deploying Microsoft Sentinel for the first time in an Azure subscription named **Sub-Sec**. No Log Analytics workspace exists yet. Microsoft's recommendation for organizing the Sentinel resources must be followed, and the first data source must be the Azure activity log of Sub-Sec.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders déploie Microsoft Sentinel pour la première fois dans un abonnement Azure nommé **Sub-Sec**. Aucun espace de travail Log Analytics n'existe encore. La recommandation de Microsoft sur l'organisation des ressources Sentinel doit être suivie, et la première source de données doit être le journal d'activité Azure de Sub-Sec.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: rg, text: { en: "Create a resource group dedicated to the Sentinel workspace and its related resources.", fr: "Créer un groupe de ressources dédié à l'espace de travail Sentinel et à ses ressources associées." } }
    - { id: ws, text: { en: "Create a Log Analytics workspace in the resource group.", fr: "Créer un espace de travail Log Analytics dans le groupe de ressources." } }
    - { id: add, text: { en: "Add Microsoft Sentinel to the workspace.", fr: "Ajouter Microsoft Sentinel à l'espace de travail." } }
    - { id: hub, text: { en: "Install the Azure Activity solution from the content hub and configure its data connector.", fr: "Installer la solution Azure Activity depuis le hub de contenu et configurer son connecteur de données." } }
    - { id: lock, text: { en: "Apply a CanNotDelete lock to the workspace.", fr: "Appliquer un verrou CanNotDelete à l'espace de travail." } }
    - { id: legacy, text: { en: "Set the workspace pricing tier to Per Node.", fr: "Définir le niveau tarifaire de l'espace de travail sur Per Node." } }
answer:
  sequence: [ rg, ws, add, hub ]
explanation:
  correct:
    en: |-
      Microsoft recommends a dedicated resource group that contains only the workspace and the resources Sentinel uses, so that permissions are assigned once. You create the workspace in it, add Microsoft Sentinel to the workspace, and then install the Azure Activity solution from the content hub and set up its data connector.
    fr: |-
      Microsoft recommande un groupe de ressources dédié qui ne contient que l'espace de travail et les ressources utilisées par Sentinel, afin d'attribuer les autorisations une seule fois. Vous y créez l'espace de travail, ajoutez Microsoft Sentinel à l'espace de travail, puis installez la solution Azure Activity depuis le hub de contenu et configurez son connecteur de données.
  options:
    lock:
      en: |-
        Resource locks aren't supported on a workspace when you enable Microsoft Sentinel.
      fr: |-
        Les verrous de ressource ne sont pas pris en charge sur un espace de travail lors de l'activation de Microsoft Sentinel.
    legacy:
      en: |-
        Legacy pricing tiers aren't supported; the workspace must use pay-as-you-go or a commitment tier.
      fr: |-
        Les niveaux tarifaires hérités ne sont pas pris en charge ; l'espace de travail doit utiliser le paiement à l'utilisation ou un niveau d'engagement.
references:
  - title: Onboard Microsoft Sentinel to a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/sentinel/quickstart-onboard
  - title: Prerequisites to deploy Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/prerequisites
