id: sc500-4c-copilot-ws-eu-prompts
objective: "4.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Security Copilot. You are creating a new Security Copilot workspace for the compliance team in the Security Copilot portal.

    Contoso's policy states that the session data of this workspace must be stored at rest in the European Union and that prompts must be evaluated only in the European Union.

    How should you configure the workspace?
  fr: |
    Contoso utilise Microsoft Security Copilot. Vous créez un nouvel espace de travail Security Copilot pour l'équipe conformité dans le portail Security Copilot.

    La politique de Contoso exige que les données de session de cet espace de travail soient stockées au repos dans l'Union européenne et que les invites soient évaluées uniquement dans l'Union européenne.

    Comment devez-vous configurer l'espace de travail ?
body:
  options:
    - { id: a, text: { en: "Data storage location: Europe. Prompt evaluation: Evaluate anywhere with available capacity.", fr: "Emplacement de stockage des données : Europe. Évaluation des invites : Evaluate anywhere with available capacity." } }
    - { id: b, text: { en: "Data storage location: United Kingdom. Prompt evaluation: the data storage geography.", fr: "Emplacement de stockage des données : Royaume-Uni. Évaluation des invites : la géographie de stockage des données." } }
    - { id: c, text: { en: "Data storage location: Europe. Prompt evaluation: the data storage geography.", fr: "Emplacement de stockage des données : Europe. Évaluation des invites : la géographie de stockage des données." } }
    - { id: d, text: { en: "Data storage location: United States. Data sharing with Microsoft: turned off.", fr: "Emplacement de stockage des données : États-Unis. Partage des données avec Microsoft : désactivé." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The data storage location decides where session data is stored at rest, and the prompt evaluation location decides where prompts are processed. Choosing Europe and keeping prompt evaluation in the data storage geography keeps both inside the EU.
    fr: |
      L'emplacement de stockage des données détermine où les données de session sont stockées au repos, et l'emplacement d'évaluation des invites détermine où les invites sont traitées. Choisir Europe et garder l'évaluation des invites dans la géographie de stockage des données maintient les deux dans l'UE.
  options:
    a: { en: "Evaluate anywhere sends prompts to the datacenter with available capacity worldwide, which can be outside the EU.", fr: "Evaluate anywhere envoie les invites au centre de données qui dispose de capacité dans le monde entier, éventuellement hors de l'UE." }
    b: { en: "The United Kingdom isn't in the European Union.", fr: "Le Royaume-Uni ne fait pas partie de l'Union européenne." }
    d: { en: "Data sharing controls whether Microsoft may capture and review data; it doesn't change where data is stored.", fr: "Le partage des données détermine si Microsoft peut capturer et examiner des données ; il ne change pas l'emplacement de stockage." }
references:
  - title: Understand how Security Copilot is auto provisioned for eligible Microsoft 365 E5 and E7 customers
    url: https://learn.microsoft.com/en-us/copilot/security/auto-provisioning-security-copilot
