id: sc500-4a-mc-connector-settings
objective: "4.1.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is creating a connector for an AWS account in Microsoft Defender for Cloud. The current values of the connector settings are shown in the following table.

    The connector must meet the following requirements:

    - Defender for Cloud must collect the configuration data of the account at least every 6 hours.
    - The connector must receive the permissions needed for current and future capabilities, without later requests for more access.

    Which setting must you change to meet each requirement? To answer, select the appropriate setting for each prompt.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys crée un connecteur pour un compte AWS dans Microsoft Defender for Cloud. Les valeurs actuelles des paramètres du connecteur figurent dans le tableau suivant.

    Le connecteur doit répondre aux exigences suivantes :

    - Defender for Cloud doit collecter les données de configuration du compte au moins toutes les 6 heures.
    - Le connecteur doit recevoir les autorisations nécessaires aux fonctionnalités actuelles et futures, sans demande ultérieure d'accès supplémentaire.

    Quel paramètre devez-vous modifier pour répondre à chaque exigence ? Pour répondre, sélectionnez le paramètre approprié pour chaque consigne.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Collect configuration data at least every 6 hours", fr: "Collecter les données de configuration au moins toutes les 6 heures" }
    - id: p2
      text: { en: "Receive the permissions for current and future capabilities", fr: "Recevoir les autorisations des fonctionnalités actuelles et futures" }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Current value", fr: "Valeur actuelle" }]
    rows:
      - [{ text: "Onboard", area: onboard }, { text: "Single account" }]
      - [{ text: "AWS regions", area: regions }, { text: { en: "All regions", fr: "Toutes les régions" } }]
      - [{ text: "Scan interval", area: interval }, { text: { en: "24 hours", fr: "24 heures" } }]
      - [{ text: "Permissions type", area: perms }, { text: "Least privilege access" }]
      - [{ text: "Deployment method", area: deploy }, { text: "AWS CloudFormation" }]
answer:
  values: { p1: interval, p2: perms }
explanation:
  correct:
    en: |-
      The scan interval can be set to 4, 6, 12 or 24 hours, so you set it to 4 or 6 hours. The Default access permissions type grants the permissions required for current and future capabilities, while Least privilege access grants only what is needed today and may later require more access.
    fr: |-
      L'intervalle d'analyse peut valoir 4, 6, 12 ou 24 heures : vous le définissez sur 4 ou 6 heures. Le type d'autorisations Default access accorde les autorisations nécessaires aux fonctionnalités actuelles et futures, alors que Least privilege access n'accorde que ce qui est nécessaire aujourd'hui et peut exiger plus d'accès par la suite.
references:
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
