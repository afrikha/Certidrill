id: sc500-4b-roles-engineers
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Sentinel. The workspace is in a resource group named RG-Sentinel, and the playbooks (Consumption logic apps) are in a resource group named RG-Playbooks.

    A group named SecEngineers must be able to create and edit analytics rules and to create and edit playbooks. The solution must follow the principle of least privilege.

    Which two role assignments should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise Microsoft Sentinel. L'espace de travail se trouve dans un groupe de ressources nommé RG-Sentinel et les playbooks (applications logiques Consumption) dans un groupe de ressources nommé RG-Playbooks.

    Un groupe nommé SecEngineers doit pouvoir créer et modifier des règles analytiques, et créer et modifier des playbooks. La solution doit respecter le principe du privilège minimum.

    Quelles sont les deux attributions de rôles à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Microsoft Sentinel Playbook Operator on RG-Playbooks", fr: "Microsoft Sentinel Playbook Operator sur RG-Playbooks" } }
    - { id: b, text: { en: "Microsoft Sentinel Contributor on RG-Sentinel", fr: "Microsoft Sentinel Contributor sur RG-Sentinel" } }
    - { id: c, text: { en: "Microsoft Sentinel Automation Contributor on RG-Playbooks", fr: "Microsoft Sentinel Automation Contributor sur RG-Playbooks" } }
    - { id: d, text: { en: "Logic App Contributor on RG-Playbooks", fr: "Logic App Contributor sur RG-Playbooks" } }
    - { id: e, text: { en: "Contributor on RG-Sentinel", fr: "Contributor sur RG-Sentinel" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Microsoft Sentinel Contributor on the resource group of the workspace allows creating and editing analytics rules and other Sentinel resources. Playbooks are separate Azure Logic Apps resources: creating and editing them requires Logic App Contributor on the resource group that holds them. Microsoft lists this pair as the recommended roles for security engineers.
    fr: |
      Microsoft Sentinel Contributor sur le groupe de ressources de l'espace de travail permet de créer et de modifier les règles analytiques et les autres ressources Sentinel. Les playbooks sont des ressources Azure Logic Apps distinctes : les créer et les modifier exige Logic App Contributor sur le groupe de ressources qui les contient. Microsoft recommande cette paire de rôles pour les ingénieurs de sécurité.
  options:
    a:
      en: |
        Playbook Operator can list, view and run playbooks manually, but it can't create or edit them.
      fr: |
        Playbook Operator permet de lister, de consulter et d'exécuter manuellement les playbooks, mais pas de les créer ni de les modifier.
    c:
      en: |
        Automation Contributor is meant for the Microsoft Sentinel service account so that automation rules can run playbooks, not for user accounts.
      fr: |
        Automation Contributor est destiné au compte de service Microsoft Sentinel pour que les règles d'automatisation puissent exécuter des playbooks, pas aux comptes d'utilisateurs.
    e:
      en: |
        Contributor grants write access to every resource of RG-Sentinel, much more than the Sentinel-specific role.
      fr: |
        Contributor donne l'accès en écriture à toutes les ressources de RG-Sentinel, bien plus que le rôle propre à Sentinel.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
