id: sc500-4c-audit-ingestion-check
objective: "4.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Microsoft 365 E5. An administrator connects to Security & Compliance PowerShell and runs the following command:

    ```powershell
    Get-AdminAuditLogConfig | Format-List UnifiedAuditLogIngestionEnabled
    ```

    The output is `UnifiedAuditLogIngestionEnabled : False`. Analysts report that searches on the **Audit** page of the Microsoft Defender portal return results for yesterday's activity.

    You need to determine whether audit log ingestion is turned on before you change any setting.

    What should you do?
  fr: |
    Fabrikam utilise Microsoft 365 E5. Un administrateur se connecte à Security & Compliance PowerShell et exécute la commande suivante :

    ```powershell
    Get-AdminAuditLogConfig | Format-List UnifiedAuditLogIngestionEnabled
    ```

    La sortie est `UnifiedAuditLogIngestionEnabled : False`. Les analystes signalent que les recherches effectuées sur la page **Audit** du portail Microsoft Defender renvoient des résultats pour l'activité de la veille.

    Vous devez déterminer si l'ingestion du journal d'audit est activée avant de modifier un quelconque paramètre.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true in Security & Compliance PowerShell.", fr: "Exécuter Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true dans Security & Compliance PowerShell." } }
    - { id: b, text: { en: "Connect to Exchange Online PowerShell and run the same Get-AdminAuditLogConfig command.", fr: "Se connecter à Exchange Online PowerShell et exécuter la même commande Get-AdminAuditLogConfig." } }
    - { id: c, text: { en: "Create an audit log retention policy with a priority of 1 in the Microsoft Purview portal.", fr: "Créer une stratégie de rétention du journal d'audit de priorité 1 dans le portail Microsoft Purview." } }
    - { id: d, text: { en: "Assign the Audit Logs role to the administrator and run the command again in the same session.", fr: "Attribuer le rôle Audit Logs à l'administrateur et réexécuter la commande dans la même session." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In Security & Compliance PowerShell, UnifiedAuditLogIngestionEnabled always shows False, even when auditing is on. The value is reliable only in Exchange Online PowerShell, where True means that audit log search is turned on.
    fr: |
      Dans Security & Compliance PowerShell, UnifiedAuditLogIngestionEnabled affiche toujours False, même quand l'audit est activé. La valeur n'est fiable que dans Exchange Online PowerShell, où True signifie que la recherche dans le journal d'audit est activée.
  options:
    a: { en: "This changes a setting before checking it, and the False value reported in that module isn't meaningful.", fr: "Cette commande modifie un paramètre avant de le vérifier, et la valeur False affichée dans ce module n'est pas significative." }
    c: { en: "A retention policy controls how long records are kept; it doesn't tell you whether ingestion is on.", fr: "Une stratégie de rétention contrôle la durée de conservation des enregistrements ; elle n'indique pas si l'ingestion est activée." }
    d: { en: "The role doesn't change the value that Security & Compliance PowerShell reports for this property.", fr: "Le rôle ne change pas la valeur que Security & Compliance PowerShell affiche pour cette propriété." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
