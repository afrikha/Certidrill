id: sc500-4a-vm-no-sensor
objective: "4.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure subscription named **Sub-Ops**. In Microsoft Defender for Cloud, Sub-Ops has the following configuration:

    | Plan | Status |
    | --- | --- |
    | Defender CSPM | Off |
    | Defender for Servers | On (Plan 1, Defender for Endpoint integration on) |

    A vendor contract forbids installing the Defender for Endpoint sensor on six Linux virtual machines named **VM-Lab1** to **VM-Lab6**. As a result, Defender for Cloud shows no vulnerability findings for these virtual machines.

    You need to obtain vulnerability findings for VM-Lab1 to VM-Lab6 without installing any agent on them.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un abonnement Azure nommé **Sub-Ops**. Dans Microsoft Defender for Cloud, Sub-Ops a la configuration suivante :

    | Plan | État |
    | --- | --- |
    | Defender CSPM | Off |
    | Defender for Servers | On (Plan 1, intégration de Defender for Endpoint activée) |

    Un contrat fournisseur interdit d'installer le capteur Defender for Endpoint sur six machines virtuelles Linux nommées **VM-Lab1** à **VM-Lab6**. Par conséquent, Defender for Cloud n'affiche aucune vulnérabilité pour ces machines virtuelles.

    Vous devez obtenir les vulnérabilités de VM-Lab1 à VM-Lab6 sans installer d'agent sur ces machines.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the Defender for Servers plan of Sub-Ops to Plan 2.", fr: "Faire passer le plan Defender for Servers de Sub-Ops à Plan 2." } }
    - { id: b, text: { en: "In Vulnerability assessment for machines, select Edit configuration and choose Microsoft Defender Vulnerability Management.", fr: "Dans Vulnerability assessment for machines, sélectionner Edit configuration et choisir Microsoft Defender Vulnerability Management." } }
    - { id: c, text: { en: "Turn on the Defender CSPM plan on Sub-Ops.", fr: "Activer le plan Defender CSPM sur Sub-Ops." } }
    - { id: d, text: { en: "Turn on file integrity monitoring for Sub-Ops.", fr: "Activer la surveillance de l'intégrité des fichiers pour Sub-Ops." } }
    - { id: e, text: { en: "Deploy the Azure Monitor Agent to the six virtual machines by using a data collection rule.", fr: "Déployer l'agent Azure Monitor sur les six machines virtuelles avec une règle de collecte de données." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      With Plan 1, vulnerability findings are agent-based and depend on the Defender for Endpoint sensor. Agentless vulnerability scanning analyzes disk snapshots without any agent, and it is on by default when Defender for Servers Plan 2 or the Defender CSPM plan is enabled. Either change provides findings for the six virtual machines.
    fr: |-
      Avec Plan 1, les vulnérabilités sont détectées par l'agent et dépendent du capteur Defender for Endpoint. L'analyse sans agent des vulnérabilités examine des instantanés de disque sans aucun agent, et elle est activée par défaut lorsque Defender for Servers Plan 2 ou le plan Defender CSPM est activé. Chacune de ces modifications fournit les vulnérabilités des six machines virtuelles.
  options:
    b:
      en: |-
        Defender Vulnerability Management is already the scanner; in agent-based mode it still needs the Defender for Endpoint sensor.
      fr: |-
        Defender Vulnerability Management est déjà le scanneur ; en mode basé sur l'agent, il a toujours besoin du capteur Defender for Endpoint.
    d:
      en: |-
        File integrity monitoring requires Plan 2 and tracks file changes; it doesn't report vulnerabilities.
      fr: |-
        La surveillance de l'intégrité des fichiers exige Plan 2 et suit les modifications de fichiers ; elle ne signale pas de vulnérabilités.
    e:
      en: |-
        Installing the Azure Monitor Agent is installing an agent, and Defender for Servers doesn't use it for vulnerability scanning.
      fr: |-
        Installer l'agent Azure Monitor revient à installer un agent, et Defender for Servers ne l'utilise pas pour l'analyse des vulnérabilités.
references:
  - title: Enable vulnerability scanning with Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management
  - title: Agentless machine scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-agentless-data-collection
