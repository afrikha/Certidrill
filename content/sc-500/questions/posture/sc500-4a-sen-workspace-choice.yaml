id: sc500-4a-sen-workspace-choice
objective: "4.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure subscription that contains the following Log Analytics workspaces:

    | Name | Pricing tier | Resource lock | Created by |
    | --- | --- | --- | --- |
    | law-a | Pay-as-you-go | None | Security team |
    | law-b | Commitment tier (100 GB/day) | CanNotDelete | Security team |
    | law-c | Per Node (legacy) | None | Operations team |
    | law-d | Commitment tier (200 GB/day) | None | Security team |
    | law-e | Pay-as-you-go | None | Microsoft Defender for Cloud (default workspace) |

    You plan to enable Microsoft Sentinel by selecting an existing workspace and **Add**.

    Which two workspaces can you use without changing their configuration?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un abonnement Azure qui contient les espaces de travail Log Analytics suivants :

    | Nom | Niveau tarifaire | Verrou de ressource | Créé par |
    | --- | --- | --- | --- |
    | law-a | Paiement à l'utilisation | Aucun | Équipe sécurité |
    | law-b | Niveau d'engagement (100 Go/jour) | CanNotDelete | Équipe sécurité |
    | law-c | Per Node (hérité) | Aucun | Équipe exploitation |
    | law-d | Niveau d'engagement (200 Go/jour) | Aucun | Équipe sécurité |
    | law-e | Paiement à l'utilisation | Aucun | Microsoft Defender for Cloud (espace de travail par défaut) |

    Vous prévoyez d'activer Microsoft Sentinel en sélectionnant un espace de travail existant puis **Add**.

    Quels sont les deux espaces de travail que vous pouvez utiliser sans modifier leur configuration ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: law-a }
    - { id: b, text: law-b }
    - { id: c, text: law-c }
    - { id: d, text: law-d }
    - { id: e, text: law-e }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      The workspace must use the pay-as-you-go pricing tier or a commitment tier and must not have a resource lock. law-a and law-d meet both conditions.
    fr: |-
      L'espace de travail doit utiliser le niveau tarifaire paiement à l'utilisation ou un niveau d'engagement, et ne doit pas avoir de verrou de ressource. law-a et law-d remplissent les deux conditions.
  options:
    b:
      en: |-
        Resource locks aren't supported when you enable Microsoft Sentinel; the CanNotDelete lock must be removed first.
      fr: |-
        Les verrous de ressource ne sont pas pris en charge lors de l'activation de Microsoft Sentinel ; le verrou CanNotDelete doit d'abord être supprimé.
    c:
      en: |-
        Legacy Log Analytics pricing tiers aren't supported for Microsoft Sentinel.
      fr: |-
        Les niveaux tarifaires hérités de Log Analytics ne sont pas pris en charge par Microsoft Sentinel.
    e:
      en: |-
        The default workspaces created by Defender for Cloud aren't shown in the list, and Microsoft Sentinel can't be installed on them.
      fr: |-
        Les espaces de travail par défaut créés par Defender for Cloud ne figurent pas dans la liste, et Microsoft Sentinel ne peut pas y être installé.
references:
  - title: Prerequisites to deploy Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/prerequisites
  - title: Onboard Microsoft Sentinel to a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/sentinel/quickstart-onboard
