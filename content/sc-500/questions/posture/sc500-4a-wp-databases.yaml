id: sc500-4a-wp-databases
objective: "4.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure subscription named **Sub1** that contains the following resources:

    | Name | Type |
    | --- | --- |
    | cosmos-orders | Azure Cosmos DB account |
    | vm-sql01 | Azure virtual machine that runs SQL Server |
    | redis-cache01 | Azure Cache for Redis |
    | adx-telemetry | Azure Data Explorer cluster |
    | st-tables01 | Storage account used only for Azure Table storage |

    In **Environment settings** > Sub1 > **Defender plans**, you switch the **Databases** plan to **On**.

    Which two resources are protected by the plan?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un abonnement Azure nommé **Sub1** qui contient les ressources suivantes :

    | Nom | Type |
    | --- | --- |
    | cosmos-orders | Compte Azure Cosmos DB |
    | vm-sql01 | Machine virtuelle Azure qui exécute SQL Server |
    | redis-cache01 | Azure Cache for Redis |
    | adx-telemetry | Cluster Azure Data Explorer |
    | st-tables01 | Compte de stockage utilisé uniquement pour le stockage Table Azure |

    Dans **Environment settings** > Sub1 > **Defender plans**, vous passez le plan **Databases** sur **On**.

    Quelles sont les deux ressources protégées par ce plan ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: cosmos-orders }
    - { id: b, text: vm-sql01 }
    - { id: c, text: redis-cache01 }
    - { id: d, text: adx-telemetry }
    - { id: e, text: st-tables01 }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      Switching the Databases plan on activates the four database protection plans of the subscription, which cover Azure SQL databases, SQL servers on machines, open-source relational databases such as PostgreSQL and MySQL, and Azure Cosmos DB.
    fr: |-
      Passer le plan Databases sur On active les quatre plans de protection des bases de données de l'abonnement, qui couvrent les bases de données Azure SQL, les serveurs SQL sur des machines, les bases de données relationnelles open source comme PostgreSQL et MySQL, et Azure Cosmos DB.
  options:
    c:
      en: |-
        Azure Cache for Redis isn't one of the database types covered by Defender for Databases.
      fr: |-
        Azure Cache for Redis ne fait pas partie des types de bases de données couverts par Defender for Databases.
    d:
      en: |-
        Azure Data Explorer isn't one of the database types covered by Defender for Databases.
      fr: |-
        Azure Data Explorer ne fait pas partie des types de bases de données couverts par Defender for Databases.
    e:
      en: |-
        Table storage is part of a storage account; Defender for Storage covers Blob Storage, Azure Files and Data Lake Storage, and the Databases plan doesn't cover it.
      fr: |-
        Le stockage Table fait partie d'un compte de stockage ; Defender for Storage couvre Stockage Blob, Azure Files et Data Lake Storage, et le plan Databases ne le couvre pas.
references:
  - title: Protect your databases with Defender for Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/tutorial-enable-databases-plan
