id: sc500-4b-roles-guest-incidents
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Sentinel on a workspace named law-soc in a resource group named RG-SOC. Contoso hires Fabrikam, Inc. to provide tier 1 incident triage.

    Fabrikam analysts are invited to the Contoso Microsoft Entra tenant as B2B guest users. They must be able to view incidents, change their status and assign them to Contoso analysts. They must not be able to create or edit analytics rules.

    You need to grant the guest users the required permissions. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso, Ltd. utilise Microsoft Sentinel sur un espace de travail nommé law-soc, dans un groupe de ressources nommé RG-SOC. Contoso confie le tri des incidents de niveau 1 à Fabrikam, Inc.

    Les analystes de Fabrikam sont invités dans le locataire Microsoft Entra de Contoso en tant qu'utilisateurs invités B2B. Ils doivent pouvoir consulter les incidents, modifier leur statut et les affecter à des analystes de Contoso. Ils ne doivent pas pouvoir créer ni modifier des règles analytiques.

    Vous devez accorder aux utilisateurs invités les autorisations nécessaires. La solution doit respecter le principe du privilège minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Microsoft Sentinel Responder on RG-SOC only.", fr: "Attribuer uniquement Microsoft Sentinel Responder sur RG-SOC." } }
    - { id: b, text: { en: "Assign Microsoft Sentinel Contributor on RG-SOC only.", fr: "Attribuer uniquement Microsoft Sentinel Contributor sur RG-SOC." } }
    - { id: c, text: { en: "Assign Microsoft Sentinel Responder on RG-SOC and the Directory Readers role in Microsoft Entra ID.", fr: "Attribuer Microsoft Sentinel Responder sur RG-SOC et le rôle Directory Readers dans Microsoft Entra ID." } }
    - { id: d, text: { en: "Assign Microsoft Sentinel Reader on RG-SOC and the Security Operator role in Microsoft Entra ID.", fr: "Attribuer Microsoft Sentinel Reader sur RG-SOC et le rôle Security Operator dans Microsoft Entra ID." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Sentinel Responder adds incident management (status, owner) to the Reader permissions without allowing analytics rules to be created. To assign incidents, a guest user also needs the Directory Readers role in Microsoft Entra ID, which regular member users have by default but guests do not.
    fr: |
      Microsoft Sentinel Responder ajoute la gestion des incidents (statut, propriétaire) aux autorisations de Reader sans permettre de créer des règles analytiques. Pour affecter des incidents, un utilisateur invité a aussi besoin du rôle Directory Readers dans Microsoft Entra ID, que les utilisateurs membres ont par défaut mais pas les invités.
  options:
    a:
      en: |
        Responder alone lets members assign incidents, but guest users can't select an assignee without the Directory Readers role.
      fr: |
        Responder seul permet aux membres d'affecter des incidents, mais les invités ne peuvent pas sélectionner de destinataire sans le rôle Directory Readers.
    b:
      en: |
        Microsoft Sentinel Contributor allows creating and editing analytics rules, which is forbidden, and still lacks the directory read permission for guests.
      fr: |
        Microsoft Sentinel Contributor permet de créer et de modifier des règles analytiques, ce qui est interdit, et ne donne toujours pas aux invités la lecture de l'annuaire.
    d:
      en: |
        Microsoft Sentinel Reader can't change the status of incidents; Security Operator is a Microsoft Entra role that doesn't grant Azure RBAC permissions on the workspace.
      fr: |
        Microsoft Sentinel Reader ne peut pas modifier le statut des incidents ; Security Operator est un rôle Microsoft Entra qui n'accorde aucune autorisation Azure RBAC sur l'espace de travail.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
