id: sc500-4c-copilot-ws-create
objective: "4.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Security Copilot with a default workspace whose data is stored in the United States. You are a Copilot owner, a Security Administrator, and an Owner of an Azure subscription named **Sub1**.

    You need to give a security group named **EU-SOC** access to Security Copilot in a new workspace whose data is stored and evaluated in Europe and that has its own capacity in Sub1.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders utilise Microsoft Security Copilot avec un espace de travail par défaut dont les données sont stockées aux États-Unis. Vous êtes Copilot owner, Security Administrator et Owner d'un abonnement Azure nommé **Sub1**.

    Vous devez donner à un groupe de sécurité nommé **EU-SOC** l'accès à Security Copilot dans un nouvel espace de travail dont les données sont stockées et évaluées en Europe et qui dispose de sa propre capacité dans Sub1.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: new, text: { en: "In the Security Copilot portal, open Manage workspaces and select New workspace.", fr: "Dans le portail Security Copilot, ouvrir Manage workspaces et sélectionner New workspace." } }
    - { id: cap, text: { en: "Enter the workspace name and select Create new capacity in Sub1 with the provisioned and overage SCUs.", fr: "Saisir le nom de l'espace de travail et sélectionner Create new capacity dans Sub1 avec les SCU provisionnées et de dépassement." } }
    - { id: loc, text: { en: "Select Europe as the data storage location, keep prompt evaluation in that geography, and select Create.", fr: "Sélectionner Europe comme emplacement de stockage des données, garder l'évaluation des invites dans cette géographie, puis sélectionner Create." } }
    - { id: role, text: { en: "In the new workspace, add EU-SOC to the Copilot contributor role.", fr: "Dans le nouvel espace de travail, ajouter EU-SOC au rôle Copilot contributor." } }
    - { id: move, text: { en: "Change the data storage location of the default workspace to Europe.", fr: "Changer l'emplacement de stockage des données de l'espace de travail par défaut en Europe." } }
    - { id: secadm, text: { en: "Assign the Security Administrator role to EU-SOC.", fr: "Attribuer le rôle Security Administrator à EU-SOC." } }
answer:
  sequence: [ new, cap, loc, role ]
explanation:
  correct:
    en: |
      A new workspace is created from Manage workspaces > New workspace: you name it and select or create its capacity, then set the data storage location, the prompt evaluation location and data sharing before you select Create. Roles are assigned per workspace, so EU-SOC is added to Copilot contributor in the new workspace once it exists.
    fr: |
      Un nouvel espace de travail se crée depuis Manage workspaces > New workspace : vous le nommez et sélectionnez ou créez sa capacité, puis vous définissez l'emplacement de stockage des données, l'emplacement d'évaluation des invites et le partage des données avant de sélectionner Create. Les rôles s'attribuent par espace de travail : EU-SOC est ajouté à Copilot contributor dans le nouvel espace une fois celui-ci créé.
  options:
    move: { en: "The requirement is a new workspace with its own capacity; the default workspace and its users must stay as they are.", fr: "L'exigence est un nouvel espace de travail avec sa propre capacité ; l'espace par défaut et ses utilisateurs doivent rester tels quels." }
    secadm: { en: "Security Administrator is a privileged Microsoft Entra role; Security Copilot access is given through the Copilot roles.", fr: "Security Administrator est un rôle Microsoft Entra privilégié ; l'accès à Security Copilot se donne par les rôles Copilot." }
references:
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
