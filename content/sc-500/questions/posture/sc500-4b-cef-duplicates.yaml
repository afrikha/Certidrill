id: sc500-4b-cef-duplicates
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. uses a Linux log forwarder named lnx-fwd1 to send data to Microsoft Sentinel. lnx-fwd1 is associated with two data collection rules (DCRs):

    - DCR-Syslog, created from the Syslog via AMA connector, collects the local4 facility from Linux servers.
    - DCR-CEF, created from the Common Event Format (CEF) via AMA connector, collects the CEF messages of a firewall.

    The firewall can send only on the local4 facility. Firewall events now appear in both the CommonSecurityLog and Syslog tables.

    You need to stop the duplicate ingestion. The Linux server messages and the firewall messages must still be collected.

    What should you do?
  fr: |
    Litware, Inc. utilise un redirecteur de journaux Linux nommé lnx-fwd1 pour envoyer des données à Microsoft Sentinel. lnx-fwd1 est associé à deux règles de collecte de données (DCR) :

    - DCR-Syslog, créée à partir du connecteur Syslog via AMA, collecte la facility local4 des serveurs Linux ;
    - DCR-CEF, créée à partir du connecteur Common Event Format (CEF) via AMA, collecte les messages CEF d'un pare-feu.

    Le pare-feu ne peut envoyer que sur la facility local4. Les événements du pare-feu apparaissent désormais à la fois dans les tables CommonSecurityLog et Syslog.

    Vous devez mettre fin à l'ingestion en double. Les messages des serveurs Linux et ceux du pare-feu doivent toujours être collectés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove the local4 facility from DCR-Syslog.", fr: "Retirer la facility local4 de DCR-Syslog." } }
    - { id: b, text: { en: "Add an ingestion-time transformation to DCR-Syslog that filters out the CEF messages.", fr: "Ajouter à DCR-Syslog une transformation au moment de l'ingestion qui exclut les messages CEF." } }
    - { id: c, text: { en: "Add an ingestion-time transformation to DCR-CEF that filters out the syslog messages.", fr: "Ajouter à DCR-CEF une transformation au moment de l'ingestion qui exclut les messages syslog." } }
    - { id: d, text: { en: "Set the minimum log level of local4 in DCR-Syslog to LOG_EMERG.", fr: "Définir le niveau de journalisation minimal de local4 sur LOG_EMERG dans DCR-Syslog." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Using the same facility for syslog and CEF duplicates CEF messages between CommonSecurityLog and Syslog. When the source can't change its facility, Microsoft recommends adding an ingestion-time transformation to the syslog DCR that filters CEF messages out of the Syslog stream, for example on ProcessName and SyslogMessage. Both message types are still collected, each in its own table.
    fr: |
      L'utilisation de la même facility pour syslog et CEF duplique les messages CEF entre CommonSecurityLog et Syslog. Lorsque la source ne peut pas changer de facility, Microsoft recommande d'ajouter à la DCR syslog une transformation au moment de l'ingestion qui exclut les messages CEF du flux Syslog, par exemple sur ProcessName et SyslogMessage. Les deux types de messages restent collectés, chacun dans sa table.
  options:
    a:
      en: |
        The Linux servers also send on local4, so their messages would no longer be collected.
      fr: |
        Les serveurs Linux envoient aussi sur local4 : leurs messages ne seraient plus collectés.
    c:
      en: |
        The duplicates are the CEF messages that land in the Syslog table; they come from DCR-Syslog, not DCR-CEF.
      fr: |
        Les doublons sont les messages CEF qui arrivent dans la table Syslog ; ils proviennent de DCR-Syslog, pas de DCR-CEF.
    d:
      en: |
        A higher minimum level drops most Linux server messages and still lets high-severity CEF messages through to Syslog.
      fr: |
        Un niveau minimal plus élevé supprime la plupart des messages des serveurs Linux et laisse toujours passer vers Syslog les messages CEF de gravité élevée.
references:
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
