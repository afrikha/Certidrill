id: sc500-4a-vm-enable-steps
objective: "4.1.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure subscription named **Sub1** where Defender for Servers Plan 1 is enabled. An administrator turned off vulnerability assessment for machines during a pilot.

    You need to turn vulnerability assessment back on for Sub1 and use Microsoft Defender Vulnerability Management as the assessment solution.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un abonnement Azure nommé **Sub1** sur lequel Defender for Servers Plan 1 est activé. Un administrateur a désactivé l'évaluation des vulnérabilités des machines pendant un projet pilote.

    Vous devez réactiver l'évaluation des vulnérabilités pour Sub1 et utiliser Microsoft Defender Vulnerability Management comme solution d'évaluation.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: env, text: { en: "In Defender for Cloud, open **Environment settings** and select Sub1.", fr: "Dans Defender for Cloud, ouvrir **Environment settings** et sélectionner Sub1." } }
    - { id: settings, text: { en: "Locate the Defender for Servers plan and select **Settings**.", fr: "Rechercher le plan Defender for Servers et sélectionner **Settings**." } }
    - { id: toggle, text: { en: "Turn on **Vulnerability assessment for machines**.", fr: "Activer **Vulnerability assessment for machines**." } }
    - { id: edit, text: { en: "Select **Edit configuration** and choose Microsoft Defender Vulnerability Management.", fr: "Sélectionner **Edit configuration** et choisir Microsoft Defender Vulnerability Management." } }
    - { id: save, text: { en: "Select **Apply**, then select **Save**.", fr: "Sélectionner **Apply**, puis **Save**." } }
    - { id: fim, text: { en: "Turn on **File integrity monitoring**.", fr: "Activer **File integrity monitoring**." } }
    - { id: reco, text: { en: "Open **Recommendations** and select **Vulnerabilities**.", fr: "Ouvrir **Recommendations** et sélectionner **Vulnerabilities**." } }
answer:
  sequence: [ env, settings, toggle, edit, save ]
explanation:
  correct:
    en: |-
      Vulnerability assessment for machines is a component of the Defender for Servers plan. You open the plan settings of the subscription in Environment settings, turn the component on, choose the assessment solution with Edit configuration, and then apply and save.
    fr: |-
      Vulnerability assessment for machines est un composant du plan Defender for Servers. Vous ouvrez les paramètres du plan de l'abonnement dans Environment settings, activez le composant, choisissez la solution d'évaluation avec Edit configuration, puis appliquez et enregistrez.
  options:
    fim:
      en: |-
        File integrity monitoring is a Plan 2 component unrelated to vulnerability assessment.
      fr: |-
        La surveillance de l'intégrité des fichiers est un composant de Plan 2 sans rapport avec l'évaluation des vulnérabilités.
    reco:
      en: |-
        The Vulnerabilities view shows the findings once scanning runs; it doesn't turn scanning on.
      fr: |-
        La vue Vulnerabilities affiche les vulnérabilités une fois l'analyse lancée ; elle n'active pas l'analyse.
references:
  - title: Enable vulnerability scanning with Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management
