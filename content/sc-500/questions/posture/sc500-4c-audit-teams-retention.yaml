id: sc500-4c-audit-teams-retention
objective: "4.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has Microsoft 365 E5 licenses for all users. No custom audit log retention policy exists.

    Investigators search the unified audit log from the **Audit** page of the Microsoft Defender portal. They must be able to search Microsoft Teams activity for one year after it occurs. Exchange, SharePoint and OneDrive activity must also remain searchable for one year.

    You need to meet the requirement. The solution must minimize costs.

    What should you do?
  fr: |
    Litware dispose de licences Microsoft 365 E5 pour tous les utilisateurs. Aucune stratégie personnalisée de rétention du journal d'audit n'existe.

    Les enquêteurs effectuent des recherches dans le journal d'audit unifié depuis la page **Audit** du portail Microsoft Defender. Ils doivent pouvoir rechercher l'activité Microsoft Teams pendant un an après qu'elle s'est produite. L'activité Exchange, SharePoint et OneDrive doit aussi rester consultable pendant un an.

    Vous devez répondre à cette exigence. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Nothing, because the default audit retention policy keeps the records of all workloads for one year.", fr: "Rien, car la stratégie de rétention d'audit par défaut conserve un an les enregistrements de toutes les charges de travail." } }
    - { id: b, text: { en: "Purchase the 10-Year Audit Log Retention add-on and create a policy with a duration of 10 Years.", fr: "Acheter le module complémentaire 10-Year Audit Log Retention et créer une stratégie d'une durée de 10 Years." } }
    - { id: c, text: { en: "Create an audit log retention policy for the Microsoft Teams record types with a duration of 1 Year.", fr: "Créer une stratégie de rétention du journal d'audit pour les types d'enregistrements Microsoft Teams avec une durée de 1 Year." } }
    - { id: d, text: { en: "Run Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true in Exchange Online PowerShell.", fr: "Exécuter Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true dans Exchange Online PowerShell." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With E5 licenses, the default policy keeps Microsoft Entra ID, Exchange, SharePoint and OneDrive records for one year, but other workloads such as Teams keep only 180 days. A custom audit log retention policy for the Teams record types with a 1 Year duration extends them without any add-on.
    fr: |
      Avec des licences E5, la stratégie par défaut conserve un an les enregistrements Microsoft Entra ID, Exchange, SharePoint et OneDrive, mais les autres charges de travail comme Teams ne sont conservées que 180 jours. Une stratégie personnalisée de rétention du journal d'audit pour les types d'enregistrements Teams, d'une durée de 1 Year, les prolonge sans module complémentaire.
  options:
    a: { en: "The default one-year policy covers only Microsoft Entra ID, Exchange, SharePoint and OneDrive; Teams records stay 180 days.", fr: "La stratégie par défaut d'un an ne couvre que Microsoft Entra ID, Exchange, SharePoint et OneDrive ; les enregistrements Teams restent 180 jours." }
    b: { en: "The add-on is needed only beyond one year; it adds cost that the requirement doesn't justify.", fr: "Le module complémentaire n'est nécessaire qu'au-delà d'un an ; il ajoute un coût que l'exigence ne justifie pas." }
    d: { en: "This turns on audit ingestion, which is already working; it doesn't change how long records are kept.", fr: "Cette commande active l'ingestion de l'audit, qui fonctionne déjà ; elle ne change pas la durée de conservation des enregistrements." }
references:
  - title: Manage audit log retention policies
    url: https://learn.microsoft.com/en-us/purview/audit-log-retention-policies
