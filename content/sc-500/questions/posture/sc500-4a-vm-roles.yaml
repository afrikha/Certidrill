id: sc500-4a-vm-roles
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a resource group named **RG-Plant** that contains 25 Azure virtual machines. Defender for Servers Plan 2 is enabled on the subscription.

    An engineer named **User1** must deploy the Microsoft Defender Vulnerability Management scanner to the virtual machines of RG-Plant. An analyst named **User2** must only view the vulnerability findings.

    You need to assign roles to the users. The solution must follow the principle of least privilege.

    Which role should you assign to each user? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un groupe de ressources nommé **RG-Plant** qui contient 25 machines virtuelles Azure. Defender for Servers Plan 2 est activé sur l'abonnement.

    Un ingénieur nommé **User1** doit déployer le scanneur Microsoft Defender Vulnerability Management sur les machines virtuelles de RG-Plant. Une analyste nommée **User2** doit uniquement consulter les vulnérabilités détectées.

    Vous devez attribuer des rôles aux utilisateurs. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à chaque utilisateur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      User1: [[u1]] on RG-Plant
      User2: [[u2]]
    fr: |
      User1 : [[u1]] sur RG-Plant
      User2 : [[u2]]
  slots:
    - id: u1
      options:
        - { id: owner, text: Owner }
        - { id: reader, text: Reader }
        - { id: sr, text: Security Reader }
        - { id: vmal, text: Virtual Machine Administrator Login }
    - id: u2
      options:
        - { id: sr, text: Security Reader }
        - { id: sa, text: Security Admin }
        - { id: contrib, text: Contributor }
        - { id: owner, text: Owner }
answer:
  values: { u1: owner, u2: sr }
explanation:
  correct:
    en: |-
      Deploying the vulnerability assessment scanner requires Owner permissions at the resource group level. Viewing the findings requires Security Reader, which is read-only for security data.
    fr: |-
      Le déploiement du scanneur d'évaluation des vulnérabilités exige des autorisations Owner au niveau du groupe de ressources. La consultation des vulnérabilités exige Security Reader, qui est en lecture seule sur les données de sécurité.
  options:
    reader:
      en: |-
        Reader is read-only; it can't deploy anything to the virtual machines.
      fr: |-
        Reader est en lecture seule ; il ne permet de rien déployer sur les machines virtuelles.
    vmal:
      en: |-
        Virtual Machine Administrator Login only allows signing in to a VM as an administrator.
      fr: |-
        Virtual Machine Administrator Login permet seulement de se connecter à une machine virtuelle en tant qu'administrateur.
    sa:
      en: |-
        Security Admin can change security settings, which is more than viewing findings.
      fr: |-
        Security Admin peut modifier les paramètres de sécurité, ce qui dépasse la consultation des vulnérabilités.
references:
  - title: Enable vulnerability scanning with Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management
