id: sc500-4b-hub-enable-content
objective: "4.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. installs a content hub solution in Microsoft Sentinel. The solution contains an analytics rule template, a hunting query and a parser. You open the solution's Manage page.

    You need to make each content item usable.

    How should you complete the procedure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. installe une solution du hub de contenu dans Microsoft Sentinel. La solution contient un modèle de règle analytique, une requête de chasse et un analyseur. Vous ouvrez la page Manage de la solution.

    Vous devez rendre chaque élément de contenu utilisable.

    Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Analytics rule template: select Open, and then [[rule]].

      Hunting query that must be customized: [[hunt]].

      Parser: [[parser]].
    fr: |
      Modèle de règle analytique : sélectionner Open, puis [[rule]].

      Requête de chasse à personnaliser : [[hunt]].

      Analyseur : [[parser]].
  slots:
    - id: rule
      options:
        - { id: create, text: { en: "select Create rule and complete the wizard", fr: "sélectionner Create rule et terminer l'Assistant" } }
        - { id: run, text: { en: "select Run query", fr: "sélectionner Run query" } }
        - { id: save, text: { en: "select Save to create a copy", fr: "sélectionner Save pour créer une copie" } }
    - id: hunt
      options:
        - { id: clone, text: { en: "open it from Content name and clone the read-only query", fr: "l'ouvrir depuis Content name et cloner la requête en lecture seule" } }
        - { id: edit, text: { en: "edit the query in place and select Save", fr: "modifier la requête sur place et sélectionner Save" } }
        - { id: playbook, text: { en: "select Create playbook", fr: "sélectionner Create playbook" } }
    - id: parser
      options:
        - { id: create, text: { en: "select Create rule", fr: "sélectionner Create rule" } }
        - { id: none, text: { en: "nothing to do: it's added as a workspace function", fr: "rien à faire : il est ajouté en tant que fonction de l'espace de travail" } }
        - { id: deploy, text: { en: "deploy it to an Azure Functions app", fr: "le déployer dans une application Azure Functions" } }
answer:
  values: { rule: create, hunt: clone, parser: none }
explanation:
  correct:
    en: |
      An analytics rule template becomes active only when you select Open and then Create rule; the Created content column then counts the active rules. Hunting queries from a solution are read-only: run them as they are, or open them from Content name and clone them to customize. Parsers are added automatically as workspace functions in Log Analytics.
    fr: |
      Un modèle de règle analytique ne devient actif que lorsque vous sélectionnez Open puis Create rule ; la colonne Created content compte alors les règles actives. Les requêtes de chasse d'une solution sont en lecture seule : exécutez-les telles quelles, ou ouvrez-les depuis Content name et clonez-les pour les personnaliser. Les analyseurs sont ajoutés automatiquement en tant que fonctions de l'espace de travail dans Log Analytics.
  options:
    run:
      en: |
        Run query is the action of hunting queries; it doesn't create an active analytics rule.
      fr: |
        Run query est l'action des requêtes de chasse ; elle ne crée aucune règle analytique active.
    save:
      en: |
        View template and Save is the procedure for workbooks, not for analytics rules.
      fr: |
        View template puis Save est la procédure des classeurs, pas des règles analytiques.
    edit:
      en: |
        Hunting queries installed by a solution are read-only; you must clone them.
      fr: |
        Les requêtes de chasse installées par une solution sont en lecture seule ; vous devez les cloner.
references:
  - title: Discover and manage Microsoft Sentinel out-of-the-box content
    url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions-deploy
