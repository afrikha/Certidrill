id: sc500-4a-cspm-path-fix
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses the Defender CSPM plan and works in the Microsoft Defender portal. An analyst opens an attack path in **Exposure Management** > **Attack surface** > **Attack paths** and selects **Remediation**.

    The analyst must apply only the steps that fully fix the attack path.

    Which list should the analyst use?
  fr: |
    Northwind Traders utilise le plan Defender CSPM et travaille dans le portail Microsoft Defender. Un analyste ouvre un chemin d'attaque dans **Exposure Management** > **Attack surface** > **Attack paths** et sélectionne **Remediation**.

    L'analyste doit appliquer uniquement les étapes qui corrigent entièrement le chemin d'attaque.

    Quelle liste l'analyste doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "The Additional recommendations list", fr: "La liste Additional recommendations" } }
    - { id: b, text: { en: "The Risk factors list of the target node", fr: "La liste Risk factors du nœud cible" } }
    - { id: c, text: { en: "The Recommendations list", fr: "La liste Recommendations" } }
    - { id: d, text: { en: "The Insight list of the entry point node", fr: "La liste Insight du nœud de point d'entrée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      In the remediation view of an attack path, Recommendations are the steps that fix the attack path. Additional recommendations lower the risk but don't fully fix the path.
    fr: |-
      Dans la vue de correction d'un chemin d'attaque, les Recommendations sont les étapes qui corrigent le chemin d'attaque. Les Additional recommendations réduisent le risque sans corriger entièrement le chemin.
  options:
    a:
      en: |-
        Additional recommendations reduce the risk but don't fully fix the attack path.
      fr: |-
        Les Additional recommendations réduisent le risque mais ne corrigent pas entièrement le chemin d'attaque.
    b:
      en: |-
        Risk factors describe the environmental factors that raise the risk of a node; they are not remediation steps.
      fr: |-
        Les Risk factors décrivent les facteurs environnementaux qui augmentent le risque d'un nœud ; ce ne sont pas des étapes de correction.
    d:
      en: |-
        Insight shows details about a node, such as exposure or vulnerabilities; it is not the list of fixes.
      fr: |-
        Insight affiche des détails sur un nœud, comme l'exposition ou les vulnérabilités ; ce n'est pas la liste des corrections.
references:
  - title: Identify and remediate attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path
