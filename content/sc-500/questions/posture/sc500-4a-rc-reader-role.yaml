id: sc500-4a-rc-reader-role
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure subscription named **Sub1** that is assessed against PCI DSS in Microsoft Defender for Cloud. An auditor named **User1** has the Security Reader role on Sub1.

    When User1 opens the **Regulatory compliance** dashboard, the policy compliance data of Sub1 isn't displayed.

    You need to ensure that User1 can review the compliance data of Sub1. The solution must follow the principle of least privilege.

    Which role should you assign to User1 on Sub1?
  fr: |
    Proseware dispose d'un abonnement Azure nommé **Sub1**, évalué par rapport à PCI DSS dans Microsoft Defender for Cloud. Un auditeur nommé **User1** dispose du rôle Security Reader sur Sub1.

    Lorsque User1 ouvre le tableau de bord **Regulatory compliance**, les données de conformité aux stratégies de Sub1 ne s'affichent pas.

    Vous devez faire en sorte que User1 puisse consulter les données de conformité de Sub1. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à User1 sur Sub1 ?
body:
  options:
    - { id: a, text: Reader }
    - { id: b, text: Contributor }
    - { id: c, text: Security Admin }
    - { id: d, text: Owner }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Viewing the regulatory compliance dashboard requires read access to the policy compliance data. The Reader role on the subscription has that access, while Security Reader doesn't. Reader is read-only, so it is the least-privileged choice.
    fr: |-
      La consultation du tableau de bord de conformité réglementaire exige un accès en lecture aux données de conformité aux stratégies. Le rôle Reader sur l'abonnement dispose de cet accès, contrairement à Security Reader. Reader est en lecture seule : c'est le choix du moindre privilège.
  options:
    c:
      en: |-
        Security Admin can change security policies and plans, which is more than an auditor needs.
      fr: |-
        Security Admin peut modifier les stratégies et les plans de sécurité, ce qui dépasse les besoins d'un auditeur.
    b:
      en: |-
        Contributor can modify every resource of the subscription, far more than reading compliance data.
      fr: |-
        Contributor peut modifier toutes les ressources de l'abonnement, bien plus que la lecture des données de conformité.
    d:
      en: |-
        Owner grants full control, including access management; it violates least privilege.
      fr: |-
        Owner accorde un contrôle total, y compris la gestion des accès ; il ne respecte pas le moindre privilège.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
