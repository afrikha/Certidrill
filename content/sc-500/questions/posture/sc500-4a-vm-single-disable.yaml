id: sc500-4a-vm-single-disable
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure subscription where Defender for Servers Plan 1 is enabled and vulnerability assessment for machines uses Microsoft Defender Vulnerability Management.

    A test virtual machine named **VM-Bench** must no longer be scanned for vulnerabilities. The other machines must keep their configuration. You decide to use the Defender for Cloud REST API.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un abonnement Azure sur lequel Defender for Servers Plan 1 est activé et où l'évaluation des vulnérabilités des machines utilise Microsoft Defender Vulnerability Management.

    Une machine virtuelle de test nommée **VM-Bench** ne doit plus faire l'objet d'une analyse des vulnérabilités. Les autres machines doivent conserver leur configuration. Vous décidez d'utiliser l'API REST de Defender for Cloud.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Send a [[method]] request to the URL of VM-Bench followed by /providers/Microsoft.Security/[[res]]/[[name]]?api-version=2015-06-01-preview.
    fr: |
      Envoyer une requête [[method]] à l'URL de VM-Bench suivie de /providers/Microsoft.Security/[[res]]/[[name]]?api-version=2015-06-01-preview.
  slots:
    - id: method
      options:
        - { id: delete, text: DELETE }
        - { id: put, text: PUT }
        - { id: get, text: GET }
    - id: res
      options:
        - { id: sva, text: serverVulnerabilityAssessments }
        - { id: pricings, text: pricings }
        - { id: assessments, text: assessments }
    - id: name
      options:
        - { id: mdetvm, text: mdetvm }
        - { id: vms, text: virtualMachines }
        - { id: default, text: default }
answer:
  values: { method: delete, res: sva, name: mdetvm }
explanation:
  correct:
    en: |-
      Defender Vulnerability Management scanning is enabled or disabled on a single machine through the `serverVulnerabilityAssessments/mdetvm` resource under the VM. A PUT request enables scanning and a DELETE request disables it.
    fr: |-
      L'analyse Defender Vulnerability Management s'active ou se désactive sur une seule machine par la ressource `serverVulnerabilityAssessments/mdetvm` placée sous la machine virtuelle. Une requête PUT active l'analyse et une requête DELETE la désactive.
  options:
    put:
      en: |-
        PUT on this resource enables the scanning instead of disabling it.
      fr: |-
        Un PUT sur cette ressource active l'analyse au lieu de la désactiver.
    pricings:
      en: |-
        The pricings/virtualMachines resource sets the Defender for Servers plan of the VM; deleting it makes the VM inherit the subscription plan.
      fr: |-
        La ressource pricings/virtualMachines définit le plan Defender for Servers de la machine virtuelle ; la supprimer fait hériter la machine virtuelle du plan de l'abonnement.
    default:
      en: |-
        mdetvm is the name of the Defender Vulnerability Management assessment resource.
      fr: |-
        mdetvm est le nom de la ressource d'évaluation Defender Vulnerability Management.
references:
  - title: Enable vulnerability scanning with Microsoft Defender Vulnerability Management
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management
