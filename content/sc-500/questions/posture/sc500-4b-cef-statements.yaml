id: sc500-4b-cef-statements
objective: "4.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. collects syslog and CEF messages in Microsoft Sentinel through Linux log forwarders. One forwarder is an Azure VM; another one is a virtual machine in the on-premises datacenter. All the forwarders run Azure Monitor Agent version 1.28.11 or later.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. collecte des messages syslog et CEF dans Microsoft Sentinel par l'intermédiaire de redirecteurs de journaux Linux. L'un des redirecteurs est une machine virtuelle Azure ; un autre est une machine virtuelle du centre de données local. Tous les redirecteurs exécutent l'agent Azure Monitor en version 1.28.11 ou ultérieure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The forwarder installation script configures the syslog daemon to listen on port 514 for both TCP and UDP.
        fr: |
          Le script d'installation du redirecteur configure le démon syslog pour écouter sur le port 514 en TCP et en UDP.
    - id: s2
      text:
        en: |
          Messages collected by the Syslog via AMA connector are stored in the CommonSecurityLog table.
        fr: |
          Les messages collectés par le connecteur Syslog via AMA sont stockés dans la table CommonSecurityLog.
    - id: s3
      text:
        en: |
          The on-premises forwarder appears on the Resources tab of the data collection rule wizard only if the Azure Connected Machine agent is installed on it.
        fr: |
          Le redirecteur local n'apparaît dans l'onglet Resources de l'Assistant de règle de collecte de données que si l'agent Azure Connected Machine y est installé.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The installation script configures rsyslog or syslog-ng, opens port 514 for UDP and TCP and restarts the daemon. Syslog messages go to the Syslog table; only CEF messages go to CommonSecurityLog. A forwarder that isn't an Azure VM must have the Azure Arc Connected Machine agent; if it's missing, the machine isn't listed on the Resources tab.
    fr: |
      Le script d'installation configure rsyslog ou syslog-ng, ouvre le port 514 en UDP et en TCP et redémarre le démon. Les messages syslog vont dans la table Syslog ; seuls les messages CEF vont dans CommonSecurityLog. Un redirecteur qui n'est pas une machine virtuelle Azure doit disposer de l'agent Azure Arc Connected Machine ; s'il manque, la machine n'est pas listée dans l'onglet Resources.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
  - title: Syslog and Common Event Format (CEF) via AMA connectors for Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-overview
