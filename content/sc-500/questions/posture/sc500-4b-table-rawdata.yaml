id: sc500-4b-table-rawdata
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has an in-house application that writes its security events to text files in C:\AppLogs\ on 20 Azure virtual machines that run Windows Server. You plan to collect the files in Microsoft Sentinel by using the Custom Logs via AMA connector. The logs are read directly on the virtual machines, without a log forwarder.

    You need to create the destination table first.

    Which columns should the table contain?
  fr: |
    Proseware, Inc. dispose d'une application interne qui écrit ses événements de sécurité dans des fichiers texte dans C:\AppLogs\ sur 20 machines virtuelles Azure exécutant Windows Server. Vous prévoyez de collecter ces fichiers dans Microsoft Sentinel à l'aide du connecteur Custom Logs via AMA. Les journaux sont lus directement sur les machines virtuelles, sans redirecteur de journaux.

    Vous devez d'abord créer la table de destination.

    Quelles colonnes la table doit-elle contenir ?
body:
  options:
    - { id: a, text: { en: "TimeGenerated (datetime) and Message (string) only", fr: "TimeGenerated (datetime) et Message (string) uniquement" } }
    - { id: b, text: { en: "TimeGenerated (datetime) and RawData (string) only", fr: "TimeGenerated (datetime) et RawData (string) uniquement" } }
    - { id: c, text: { en: "TimeGenerated (datetime), Computer (string) and RawData (string)", fr: "TimeGenerated (datetime), Computer (string) et RawData (string)" } }
    - { id: d, text: { en: "RawData (string) only; TimeGenerated is added at ingestion", fr: "RawData (string) uniquement ; TimeGenerated est ajoutée à l'ingestion" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Custom Logs via AMA connector requires a table whose name ends with _CL and that contains only TimeGenerated (datetime) and RawData (string), which holds the full log message. The Message column replaces RawData only when the logs are collected from a log forwarder instead of from the device itself.
    fr: |
      Le connecteur Custom Logs via AMA exige une table dont le nom se termine par _CL et qui contient uniquement TimeGenerated (datetime) et RawData (string), qui contient le message de journal complet. La colonne Message remplace RawData uniquement lorsque les journaux sont collectés depuis un redirecteur de journaux plutôt que depuis l'appareil lui-même.
  options:
    a:
      en: |
        Message is used when the logs come through a log forwarder; here they are read on the machines.
      fr: |
        Message s'utilise lorsque les journaux passent par un redirecteur ; ici, ils sont lus sur les machines.
    c:
      en: |
        The table must contain only the two documented fields; extra columns aren't part of the required schema.
      fr: |
        La table ne doit contenir que les deux champs documentés ; des colonnes supplémentaires ne font pas partie du schéma exigé.
    d:
      en: |
        Every Log Analytics table needs TimeGenerated, and the connector's table must include it with RawData.
      fr: |
        Toute table Log Analytics a besoin de TimeGenerated, et la table du connecteur doit l'inclure avec RawData.
references:
  - title: Collect logs from text files with the Azure Monitor Agent and ingest to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-custom-logs-ama
