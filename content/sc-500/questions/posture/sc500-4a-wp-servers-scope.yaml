id: sc500-4a-wp-servers-scope
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure subscription named **Sub-App** that contains 50 virtual machines. Defender for Servers isn't enabled on Sub-App.

    Three virtual machines named **VM-Pay1**, **VM-Pay2** and **VM-Pay3** must have file integrity monitoring and just-in-time VM access. The other virtual machines must not be protected by Defender for Servers.

    You need to configure Defender for Servers to meet the requirements.

    What should you do?
  fr: |
    Contoso dispose d'un abonnement Azure nommé **Sub-App** qui contient 50 machines virtuelles. Defender for Servers n'est pas activé sur Sub-App.

    Trois machines virtuelles nommées **VM-Pay1**, **VM-Pay2** et **VM-Pay3** doivent bénéficier de la surveillance de l'intégrité des fichiers et de l'accès juste-à-temps aux machines virtuelles. Les autres machines virtuelles ne doivent pas être protégées par Defender for Servers.

    Vous devez configurer Defender for Servers pour répondre aux exigences.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Plan 2 on the three VMs at the resource level, with the subPlan value P2.", fr: "Activer Plan 2 sur les trois machines virtuelles au niveau ressource, avec la valeur subPlan P2." } }
    - { id: b, text: { en: "Enable Plan 2 on Sub-App, then disable the plan on the other VMs at the resource level.", fr: "Activer Plan 2 sur Sub-App, puis désactiver le plan sur les autres machines virtuelles au niveau ressource." } }
    - { id: c, text: { en: "Tag the three VMs and assign the Granular Pricing policy that enables the plan by tag.", fr: "Étiqueter les trois machines virtuelles et affecter la stratégie Granular Pricing qui active le plan par étiquette." } }
    - { id: d, text: { en: "Move the three VMs to a new resource group and enable Plan 2 on that resource group.", fr: "Déplacer les trois machines virtuelles dans un nouveau groupe de ressources et activer Plan 2 sur ce groupe." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      File integrity monitoring and just-in-time VM access are Plan 2 features. Plan 2 can be enabled for a subscription and disabled for individual resources, but it can't be enabled at the resource level. You therefore enable Plan 2 on Sub-App and disable it on the 47 other virtual machines.
    fr: |-
      La surveillance de l'intégrité des fichiers et l'accès juste-à-temps aux machines virtuelles sont des fonctionnalités de Plan 2. Plan 2 peut être activé pour un abonnement et désactivé pour des ressources individuelles, mais il ne peut pas être activé au niveau ressource. Vous activez donc Plan 2 sur Sub-App et le désactivez sur les 47 autres machines virtuelles.
  options:
    a:
      en: |-
        Only Plan 1 can be enabled at the resource level; Plan 2 can only be disabled there.
      fr: |-
        Seul Plan 1 peut être activé au niveau ressource ; Plan 2 ne peut qu'y être désactivé.
    c:
      en: |-
        The built-in Granular Pricing policy enables Plan 1 for tagged resources, which provides neither file integrity monitoring nor just-in-time VM access.
      fr: |-
        La stratégie intégrée Granular Pricing active Plan 1 pour les ressources étiquetées, qui ne fournit ni la surveillance de l'intégrité des fichiers ni l'accès juste-à-temps.
    d:
      en: |-
        Defender plans are set on a subscription or on a resource; there is no resource group level.
      fr: |-
        Les plans Defender se définissent sur un abonnement ou sur une ressource ; il n'existe pas de niveau groupe de ressources.
references:
