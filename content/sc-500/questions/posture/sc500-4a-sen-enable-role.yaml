id: sc500-4a-sen-enable-role
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure subscription named **Sub-SOC** that contains a resource group named **RG-Sentinel**. RG-Sentinel contains a Log Analytics workspace named **law-soc** that uses the pay-as-you-go pricing tier.

    An engineer named **User1** must enable Microsoft Sentinel on law-soc. User1 has no role assignment yet.

    You need to assign a role to User1. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Contoso dispose d'un abonnement Azure nommé **Sub-SOC** qui contient un groupe de ressources nommé **RG-Sentinel**. RG-Sentinel contient un espace de travail Log Analytics nommé **law-soc** qui utilise le niveau tarifaire paiement à l'utilisation.

    Un ingénieur nommé **User1** doit activer Microsoft Sentinel sur law-soc. User1 ne dispose encore d'aucune attribution de rôle.

    Vous devez attribuer un rôle à User1. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: { en: "Microsoft Sentinel Contributor on RG-Sentinel", fr: "Microsoft Sentinel Contributor sur RG-Sentinel" } }
    - { id: b, text: { en: "Contributor on Sub-SOC", fr: "Contributor sur Sub-SOC" } }
    - { id: c, text: { en: "Microsoft Sentinel Reader on RG-Sentinel", fr: "Microsoft Sentinel Reader sur RG-Sentinel" } }
    - { id: d, text: { en: "Owner on Sub-SOC", fr: "Owner sur Sub-SOC" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      To enable Microsoft Sentinel, you need Contributor permissions on the subscription in which the Microsoft Sentinel workspace resides. The Microsoft Sentinel roles on the resource group are for using Sentinel once it is enabled.
    fr: |-
      Pour activer Microsoft Sentinel, il faut des autorisations Contributor sur l'abonnement dans lequel se trouve l'espace de travail Microsoft Sentinel. Les rôles Microsoft Sentinel sur le groupe de ressources servent à utiliser Sentinel une fois activé.
  options:
    a:
      en: |-
        Microsoft Sentinel Contributor lets users work with Sentinel and install content hub solutions, but enabling Sentinel requires Contributor on the subscription.
      fr: |-
        Microsoft Sentinel Contributor permet de travailler dans Sentinel et d'installer des solutions du hub de contenu, mais l'activation de Sentinel exige Contributor sur l'abonnement.
    c:
      en: |-
        Microsoft Sentinel Reader only lets users view Sentinel data and resources.
      fr: |-
        Microsoft Sentinel Reader permet seulement de consulter les données et ressources de Sentinel.
    d:
      en: |-
        Owner works but also grants access management, which is more than required.
      fr: |-
        Owner fonctionne mais accorde aussi la gestion des accès, ce qui dépasse le besoin.
references:
  - title: Onboard Microsoft Sentinel to a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/sentinel/quickstart-onboard
