id: sc500-4c-retention-search-job
objective: "4.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses Microsoft Sentinel on a Log Analytics workspace named **law-adt**. The workspace is not onboarded to the Microsoft Sentinel data lake. The **SecurityEvent** table uses the Analytics plan with an analytics retention of 90 days and a total retention of 2 years.

    An investigator needs every SecurityEvent record from the last 12 months in which the **TargetUserName** column equals `svc-backup`. The results must be stored in a table that can be queried with KQL like any other Analytics table.

    What should you use?
  fr: |
    Adatum utilise Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-adt**. L'espace de travail n'est pas intégré au data lake Microsoft Sentinel. La table **SecurityEvent** utilise le plan Analytics avec une rétention d'analyse de 90 jours et une rétention totale de 2 ans.

    Un enquêteur a besoin de tous les enregistrements SecurityEvent des 12 derniers mois dont la colonne **TargetUserName** vaut `svc-backup`. Les résultats doivent être stockés dans une table interrogeable en KQL comme n'importe quelle autre table Analytics.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A restore of SecurityEvent", fr: "Une restauration de SecurityEvent" } }
    - { id: b, text: { en: "A summary rule on SecurityEvent", fr: "Une règle de synthèse sur SecurityEvent" } }
    - { id: c, text: { en: "A search job on SecurityEvent", fr: "Un travail de recherche sur SecurityEvent" } }
    - { id: d, text: { en: "A scheduled analytics rule on SecurityEvent", fr: "Une règle d'analyse planifiée sur SecurityEvent" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A search job runs an asynchronous query on a single table across analytics and long-term retention and writes the matching records to a new Analytics table whose name ends with `_SRCH`. It is the tool for retrieving data that matches specific criteria from long-term retention.
    fr: |
      Un travail de recherche exécute une requête asynchrone sur une seule table, dans la rétention d'analyse et la rétention à long terme, et écrit les enregistrements correspondants dans une nouvelle table Analytics dont le nom se termine par `_SRCH`. C'est l'outil qui récupère les données répondant à des critères précis dans la rétention à long terme.
  options:
    a: { en: "A restore brings a whole time range back into the hot cache, billed at a minimum of 2 TB; it doesn't filter records by criteria.", fr: "Une restauration ramène toute une plage de temps dans le cache à chaud, facturée au minimum 2 To ; elle ne filtre pas les enregistrements selon des critères." }
    b: { en: "A summary rule aggregates new incoming data on a schedule; it doesn't retrieve twelve months of past records.", fr: "Une règle de synthèse agrège les nouvelles données entrantes selon une planification ; elle ne récupère pas douze mois d'enregistrements passés." }
    d: { en: "A scheduled analytics rule creates alerts and only queries data in the analytics retention.", fr: "Une règle d'analyse planifiée crée des alertes et n'interroge que les données de la rétention d'analyse." }
references:
  - title: Run search jobs in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/search-jobs
