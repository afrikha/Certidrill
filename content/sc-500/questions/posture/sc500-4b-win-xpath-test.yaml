id: sc500-4b-win-xpath-test
objective: "4.2.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. plans to collect only two kinds of Windows Security events in Microsoft Sentinel: failed sign-in attempts and the creation of user accounts. You will use the Custom event set of the Windows Security Events via AMA connector.

    Before you add the XPath query to the data collection rule, you need to test it locally on a server.

    How should you complete the PowerShell script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. prévoit de collecter uniquement deux types d'événements de sécurité Windows dans Microsoft Sentinel : les tentatives de connexion ayant échoué et la création de comptes d'utilisateurs. Vous utiliserez le jeu d'événements Custom du connecteur Windows Security Events via AMA.

    Avant d'ajouter la requête XPath à la règle de collecte de données, vous devez la tester localement sur un serveur.

    Comment devez-vous compléter le script PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $XPath = '*[System[([[e1]] or [[e2]])]]'
    Get-WinEvent -LogName '[[log]]' -FilterXPath $XPath -MaxEvents 10
  slots:
    - id: e1
      options:
        - { id: e4624, text: EventID=4624 }
        - { id: e4625, text: EventID=4625 }
        - { id: e4688, text: EventID=4688 }
    - id: e2
      options:
        - { id: e4720, text: EventID=4720 }
        - { id: e4726, text: EventID=4726 }
        - { id: e4740, text: EventID=4740 }
    - id: log
      options:
        - { id: security, text: Security }
        - { id: forwarded, text: ForwardedEvents }
        - { id: system, text: System }
answer:
  values: { e1: e4625, e2: e4720, log: security }
explanation:
  correct:
    en: |
      Event 4625 records an account that failed to sign in and event 4720 records the creation of a user account; both are written to the Security log. Get-WinEvent with -LogName and -FilterXPath tests the filter part of the query; in the DCR, the same filter is prefixed with the log name, in the form Security!*[System[...]].
    fr: |
      L'événement 4625 enregistre l'échec de connexion d'un compte et l'événement 4720 la création d'un compte d'utilisateur ; tous deux sont écrits dans le journal Security. Get-WinEvent avec -LogName et -FilterXPath teste la partie filtre de la requête ; dans la DCR, ce filtre est précédé du nom du journal, sous la forme Security!*[System[...]].
  options:
    e4624:
      en: |
        4624 is a successful sign-in.
      fr: |
        4624 est une connexion réussie.
    e4688:
      en: |
        4688 is the creation of a process.
      fr: |
        4688 est la création d'un processus.
    e4726:
      en: |
        4726 is the deletion of a user account.
      fr: |
        4726 est la suppression d'un compte d'utilisateur.
    e4740:
      en: |
        4740 is a user account lockout.
      fr: |
        4740 est le verrouillage d'un compte d'utilisateur.
    forwarded:
      en: |
        ForwardedEvents holds events received by a Windows Event Collector, not the server's own Security events.
      fr: |
        ForwardedEvents contient les événements reçus par un collecteur d'événements Windows, pas les propres événements de sécurité du serveur.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
