id: sc500-4b-conn-entra-logtypes
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has Microsoft Entra ID P2 licenses and has connected the Microsoft Entra ID data connector to Microsoft Sentinel with only Audit logs and Sign-in logs selected.

    The SOC needs analytics rules that detect suspicious sign-ins performed by applications that authenticate with their own credentials, and by Azure resources that use managed identities. The solution must minimize ingestion costs.

    Which two additional log types should you select in the connector? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose de licences Microsoft Entra ID P2 et a connecté le connecteur de données Microsoft Entra ID à Microsoft Sentinel avec seulement Audit logs et Sign-in logs sélectionnés.

    Le SOC a besoin de règles analytiques qui détectent les connexions suspectes effectuées par des applications qui s'authentifient avec leurs propres informations d'identification, et par des ressources Azure qui utilisent des identités managées. La solution doit réduire au minimum les coûts d'ingestion.

    Quels sont les deux types de journaux supplémentaires à sélectionner dans le connecteur ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Non-interactive user sign-in logs }
    - { id: b, text: Service principal sign-in logs }
    - { id: c, text: Managed Identity sign-in logs }
    - { id: d, text: Provisioning logs }
    - { id: e, text: Microsoft Graph activity logs }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Sign-ins of applications that use their own credentials are recorded in the service principal sign-in logs (AADServicePrincipalSignInLogs table), and sign-ins of managed identities in the managed identity sign-in logs (AADManagedIdentitySignInLogs table). Selecting only these two adds the needed data without other high-volume logs.
    fr: |
      Les connexions des applications qui utilisent leurs propres informations d'identification sont enregistrées dans les journaux de connexion des principaux de service (table AADServicePrincipalSignInLogs), et celles des identités managées dans les journaux de connexion des identités managées (table AADManagedIdentitySignInLogs). Sélectionner uniquement ces deux types ajoute les données nécessaires sans autres journaux volumineux.
  options:
    a:
      en: |
        Non-interactive user sign-in logs record sign-ins that a client performs on behalf of a user, not sign-ins of applications or managed identities.
      fr: |
        Les journaux de connexion non interactive des utilisateurs enregistrent les connexions effectuées par un client au nom d'un utilisateur, pas celles des applications ni des identités managées.
    d:
      en: |
        Provisioning logs record user provisioning to applications, not sign-ins.
      fr: |
        Les journaux d'approvisionnement enregistrent l'approvisionnement des utilisateurs dans les applications, pas les connexions.
    e:
      en: |
        Microsoft Graph activity logs record HTTP requests to Microsoft Graph, not the authentication events of the identities.
      fr: |
        Les journaux d'activité Microsoft Graph enregistrent les requêtes HTTP vers Microsoft Graph, pas les événements d'authentification des identités.
references:
  - title: Send data to Microsoft Sentinel using the Microsoft Entra ID data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-azure-active-directory
