id: sc500-4c-retention-cli-values
objective: "4.2.9"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Litware uses Microsoft Sentinel on a Log Analytics workspace named **law-lit-sec** in a resource group named **rg-sec**. The **Syslog** table uses the Analytics plan.

    You need to configure Syslog so that:

    - the data is available to analytics rules and hunting queries for 120 days after ingestion;
    - the data is deleted three years (1,095 days) after ingestion.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-lit-sec** dans un groupe de ressources nommé **rg-sec**. La table **Syslog** utilise le plan Analytics.

    Vous devez configurer Syslog pour que :

    - les données soient disponibles pour les règles d'analyse et les requêtes de repérage pendant 120 jours après leur ingestion ;
    - les données soient supprimées trois ans (1 095 jours) après leur ingestion.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az monitor log-analytics workspace table update \
      --resource-group rg-sec --workspace-name law-lit-sec \
      --name Syslog \
      --retention-time [[ret]] \
      --total-retention-time [[tot]]
  slots:
    - id: ret
      options:
        - { id: r30, text: "30" }
        - { id: r90, text: "90" }
        - { id: r120, text: "120" }
        - { id: r1095, text: "1095" }
    - id: tot
      options:
        - { id: t975, text: "975" }
        - { id: t1095, text: "1095" }
        - { id: t1215, text: "1215" }
answer:
  values: { ret: r120, tot: t1095 }
explanation:
  correct:
    en: "`--retention-time` sets the analytics retention, the period during which analytics rules and hunting can use the data: 120 days. `--total-retention-time` is the whole lifetime of the data, analytics retention included, so it must be 1,095 days; the long-term part is the difference (975 days)."
    fr: "`--retention-time` définit la rétention d'analyse, la période pendant laquelle les règles d'analyse et le repérage peuvent utiliser les données : 120 jours. `--total-retention-time` correspond à toute la durée de vie des données, rétention d'analyse comprise ; elle doit donc valoir 1 095 jours, la partie à long terme étant la différence (975 jours)."
  options:
    r90: { en: "90 days is free, but the requirement is 120 days of availability to analytics rules.", fr: "90 jours sont gratuits, mais l'exigence est une disponibilité de 120 jours pour les règles d'analyse." }
    r1095: { en: "Analytics retention can't exceed two years, and three years in the analytics tier isn't required.", fr: "La rétention d'analyse ne peut pas dépasser deux ans, et trois ans dans le niveau d'analyse ne sont pas exigés." }
    t975: { en: "Total retention includes the analytics retention; 975 days would delete the data after 975 days.", fr: "La rétention totale inclut la rétention d'analyse ; 975 jours supprimeraient les données après 975 jours." }
    t1215: { en: "Total retention isn't added to analytics retention; 1,215 days would keep the data too long.", fr: "La rétention totale ne s'ajoute pas à la rétention d'analyse ; 1 215 jours conserveraient les données trop longtemps." }
references:
  - title: Manage data retention in a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-retention-configure
