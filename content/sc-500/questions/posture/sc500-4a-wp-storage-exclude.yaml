id: sc500-4a-wp-storage-exclude
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure subscription named **Sub-Data** that contains 120 storage accounts. New storage accounts are created every week by several teams.

    You need to ensure that all the current and future storage accounts of Sub-Data are protected by Defender for Storage, except a storage account named **stpublicdocs** that hosts public product brochures. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Adatum dispose d'un abonnement Azure nommé **Sub-Data** qui contient 120 comptes de stockage. Plusieurs équipes créent de nouveaux comptes de stockage chaque semaine.

    Vous devez faire en sorte que tous les comptes de stockage actuels et futurs de Sub-Data soient protégés par Defender for Storage, à l'exception d'un compte de stockage nommé **stpublicdocs** qui héberge des brochures publiques. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Defender for Storage on Sub-Data and exclude stpublicdocs at the account level.", fr: "Activer Defender for Storage sur Sub-Data et exclure stpublicdocs au niveau du compte." } }
    - { id: b, text: { en: "Enable Defender for Storage on Sub-Data and move stpublicdocs to a separate resource group.", fr: "Activer Defender for Storage sur Sub-Data et déplacer stpublicdocs dans un groupe de ressources distinct." } }
    - { id: c, text: { en: "Enable the Defender CSPM plan on Sub-Data and turn on sensitive data discovery.", fr: "Activer le plan Defender CSPM sur Sub-Data et activer la découverte des données sensibles." } }
    - { id: d, text: { en: "Enable Defender for Storage on each storage account except stpublicdocs.", fr: "Activer Defender for Storage sur chaque compte de stockage sauf stpublicdocs." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Enabling Defender for Storage at the subscription level automatically protects all existing and new storage accounts. You can still exclude a specific account from the subscription-level configuration, which handles stpublicdocs without any per-account work for the others.
    fr: |-
      L'activation de Defender for Storage au niveau de l'abonnement protège automatiquement tous les comptes de stockage existants et nouveaux. Vous pouvez toujours exclure un compte précis de la configuration de l'abonnement, ce qui traite stpublicdocs sans travail compte par compte pour les autres.
  options:
    d:
      en: |-
        Account-level enablement doesn't cover the accounts created later; each new account would need to be enabled.
      fr: |-
        L'activation par compte ne couvre pas les comptes créés ensuite ; chaque nouveau compte devrait être activé.
    b:
      en: |-
        Defender for Storage is enabled per subscription or per storage account; a resource group doesn't change the coverage.
      fr: |-
        Defender for Storage s'active par abonnement ou par compte de stockage ; un groupe de ressources ne modifie pas la couverture.
    c:
      en: |-
        Defender CSPM adds posture and data sensitivity context; it doesn't provide the threat protection of Defender for Storage.
      fr: |-
        Defender CSPM ajoute la posture et le contexte de sensibilité des données ; il ne fournit pas la protection contre les menaces de Defender for Storage.
references:
  - title: What is Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
