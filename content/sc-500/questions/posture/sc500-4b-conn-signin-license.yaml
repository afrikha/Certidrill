id: sc500-4b-conn-signin-license
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses the Free edition of Microsoft Entra ID. A security administrator enables the Microsoft Entra ID data connector of Microsoft Sentinel and selects Audit logs and Sign-in logs.

    After two days, the AuditLogs table contains data, but the SigninLogs table is still empty. The administrator has the Security Administrator role on the tenant and the Microsoft Sentinel Contributor role on the workspace.

    You need to ensure that sign-in logs are ingested.

    What should you do?
  fr: |
    Wingtip Toys utilise l'édition Free de Microsoft Entra ID. Un administrateur de sécurité active le connecteur de données Microsoft Entra ID de Microsoft Sentinel et sélectionne Audit logs et Sign-in logs.

    Après deux jours, la table AuditLogs contient des données, mais la table SigninLogs est toujours vide. L'administrateur dispose du rôle Security Administrator sur le locataire et du rôle Microsoft Sentinel Contributor sur l'espace de travail.

    Vous devez faire en sorte que les journaux de connexion soient ingérés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Global Administrator role to the administrator, and reconnect the connector.", fr: "Attribuer le rôle Global Administrator à l'administrateur, puis reconnecter le connecteur." } }
    - { id: b, text: { en: "Also select Non-interactive user sign-in logs in the connector.", fr: "Sélectionner aussi Non-interactive user sign-in logs dans le connecteur." } }
    - { id: c, text: { en: "Create a data collection rule that sends the sign-in logs to the workspace.", fr: "Créer une règle de collecte de données qui envoie les journaux de connexion à l'espace de travail." } }
    - { id: d, text: { en: "Acquire Microsoft Entra ID P1 or P2 licenses for the tenant.", fr: "Acquérir des licences Microsoft Entra ID P1 ou P2 pour le locataire." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Ingesting sign-in logs into Microsoft Sentinel requires a Microsoft Entra ID P1 or P2 license, while the other log types, such as audit logs, work with any license, including Free. The administrator's roles already meet the connector prerequisites, which is why the audit logs arrive.
    fr: |
      L'ingestion des journaux de connexion dans Microsoft Sentinel exige une licence Microsoft Entra ID P1 ou P2, alors que les autres types de journaux, comme les journaux d'audit, fonctionnent avec n'importe quelle licence, y compris Free. Les rôles de l'administrateur respectent déjà les prérequis du connecteur, ce qui explique l'arrivée des journaux d'audit.
  options:
    a:
      en: |
        Security Administrator on the tenant is already enough to configure the connector; the missing piece is the license.
      fr: |
        Security Administrator sur le locataire suffit déjà pour configurer le connecteur ; c'est la licence qui manque.
    b:
      en: |
        Non-interactive sign-in logs go to another table and are still sign-in data; they don't fill SigninLogs.
      fr: |
        Les journaux de connexion non interactive vont dans une autre table ; ils ne remplissent pas SigninLogs.
    c:
      en: |
        Microsoft Entra ID logs are streamed through the connector's diagnostic settings, not through an agent-based data collection rule.
      fr: |
        Les journaux Microsoft Entra ID sont diffusés par les paramètres de diagnostic du connecteur, pas par une règle de collecte de données d'agent.
references:
  - title: Send data to Microsoft Sentinel using the Microsoft Entra ID data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-azure-active-directory
