id: sc500-4a-mc-aws-steps
objective: "4.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a single AWS account that runs EC2 instances and S3 buckets. You have the required permissions in Azure and in AWS.

    You need to connect the AWS account to Microsoft Defender for Cloud and enable the Defender CSPM plan for it.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'un seul compte AWS qui exécute des instances EC2 et des compartiments S3. Vous disposez des autorisations nécessaires dans Azure et dans AWS.

    Vous devez connecter le compte AWS à Microsoft Defender for Cloud et activer le plan Defender CSPM pour ce compte.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: add, text: { en: "In **Environment settings**, select **Add environment** > **Amazon Web Services** and enter the account details.", fr: "Dans **Environment settings**, sélectionner **Add environment** > **Amazon Web Services** et saisir les détails du compte." } }
    - { id: plans, text: { en: "Select **Next: Select plans** and turn on Defender CSPM.", fr: "Sélectionner **Next: Select plans** et activer Defender CSPM." } }
    - { id: access, text: { en: "Select **Configure access**, choose the permissions type and **AWS CloudFormation**.", fr: "Sélectionner **Configure access**, choisir le type d'autorisations et **AWS CloudFormation**." } }
    - { id: deploy, text: { en: "Deploy the generated CloudFormation template in the AWS account.", fr: "Déployer le modèle CloudFormation généré dans le compte AWS." } }
    - { id: create, text: { en: "Select **Next: Review and generate**, then select **Create**.", fr: "Sélectionner **Next: Review and generate**, puis **Create**." } }
    - { id: arc, text: { en: "Install the Azure Connected Machine agent on every EC2 instance.", fr: "Installer l'agent Azure Connected Machine sur chaque instance EC2." } }
    - { id: key, text: { en: "Create an IAM user access key in AWS and paste it into the connector.", fr: "Créer une clé d'accès d'utilisateur IAM dans AWS et la coller dans le connecteur." } }
answer:
  sequence: [ add, plans, access, deploy, create ]
explanation:
  correct:
    en: |-
      You add the AWS environment and its account details, select the plans, then configure access, where you choose the permissions type and the CloudFormation deployment method. You complete the dependencies in AWS by deploying the generated template, and you finish with Review and generate and Create.
    fr: |-
      Vous ajoutez l'environnement AWS et les détails du compte, sélectionnez les plans, puis configurez l'accès en choisissant le type d'autorisations et la méthode de déploiement CloudFormation. Vous créez les dépendances dans AWS en déployant le modèle généré, puis terminez par Review and generate et Create.
  options:
    arc:
      en: |-
        Defender CSPM collects posture data through the connector; the Connected Machine agent isn't needed.
      fr: |-
        Defender CSPM collecte les données de posture via le connecteur ; l'agent Connected Machine n'est pas nécessaire.
    key:
      en: |-
        The connector relies on the IAM roles created by the CloudFormation template; you don't provide access keys.
      fr: |-
        Le connecteur s'appuie sur les rôles IAM créés par le modèle CloudFormation ; vous ne fournissez pas de clés d'accès.
references:
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
