id: sc500-sr1-sentinel-disable-2
objective: "4.2.8"
type: series_yesno
series: sc500-sr1-sentinel-disable
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You create an automation rule that assigns the owner and adds a tag.
  fr: Vous créez une règle d'automatisation qui affecte le propriétaire et ajoute une balise.
body:
  solution:
    en: |
      You create an automation rule that uses the **When incident is created** trigger and has a condition on the analytics rule name that matches AR1. The rule has three actions: **Assign owner** set to Analyst1, **Change status** set to Active, and **Add tags** with the tag **disable-account**.
    fr: |
      Vous créez une règle d'automatisation qui utilise le déclencheur **When incident is created** et a une condition sur le nom de la règle d'analyse qui correspond à AR1. La règle a trois actions : **Assign owner** définie sur Analyst1, **Change status** définie sur Active et **Add tags** avec la balise **disable-account**.
answer: { value: false }
explanation:
  correct:
    en: |
      The rule assigns the incident to Analyst1, but changing the status and adding a tag only update the incident; no action changes the user accounts in Microsoft Entra ID. Actions on external systems, such as disabling a user, require a playbook, so the rule must also run PB1.
    fr: |
      La règle affecte l'incident à Analyst1, mais changer le statut et ajouter une balise ne font que mettre à jour l'incident ; aucune action ne modifie les comptes d'utilisateur dans Microsoft Entra ID. Les actions sur des systèmes externes, comme la désactivation d'un utilisateur, nécessitent un playbook : la règle doit donc aussi exécuter PB1.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
