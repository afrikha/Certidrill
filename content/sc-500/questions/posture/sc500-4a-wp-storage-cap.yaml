id: sc500-4a-wp-storage-cap
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure subscription named **Sub1**. Defender for Storage is enabled on Sub1 with on-upload malware scanning and the default settings.

    A storage account named **stingest01** receives about 14,000 GB of new blobs each month from partners. Last month, Defender for Cloud raised the alert "Malware scanning stopped: monthly gigabytes scan cap reached" for stingest01.

    You need every blob uploaded to stingest01 to be scanned for malware. The other storage accounts of Sub1 must keep their current settings.

    What should you do?
  fr: |
    Litware dispose d'un abonnement Azure nommé **Sub1**. Defender for Storage est activé sur Sub1 avec l'analyse des programmes malveillants au chargement et les paramètres par défaut.

    Un compte de stockage nommé **stingest01** reçoit chaque mois environ 14 000 Go de nouveaux blobs provenant de partenaires. Le mois dernier, Defender for Cloud a déclenché l'alerte « Malware scanning stopped: monthly gigabytes scan cap reached » pour stingest01.

    Vous devez faire en sorte que chaque blob chargé dans stingest01 soit analysé. Les autres comptes de stockage de Sub1 doivent conserver leurs paramètres actuels.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on sensitive data threat detection for stingest01.", fr: "Activer la détection des menaces sur les données sensibles pour stingest01." } }
    - { id: b, text: { en: "Enable agentless malware scanning in Defender for Servers Plan 2.", fr: "Activer l'analyse sans agent des programmes malveillants dans Defender for Servers Plan 2." } }
    - { id: c, text: { en: "Override the subscription settings on stingest01 and raise its monthly scan cap.", fr: "Remplacer les paramètres de l'abonnement sur stingest01 et augmenter son plafond d'analyse mensuel." } }
    - { id: d, text: { en: "Raise the monthly scan cap in the Defender for Storage settings of Sub1.", fr: "Augmenter le plafond d'analyse mensuel dans les paramètres Defender for Storage de Sub1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      By default, malware scanning stops after 10,000 GB of uploaded data per storage account per month. The cap can be set for the whole subscription or per storage account, and subscription-level settings can be overridden on a specific account. Raising the cap on stingest01 only meets the requirement without changing the other accounts.
    fr: |-
      Par défaut, l'analyse des programmes malveillants s'arrête après 10 000 Go de données chargées par compte de stockage et par mois. Le plafond peut être défini pour tout l'abonnement ou par compte de stockage, et les paramètres de l'abonnement peuvent être remplacés sur un compte précis. Augmenter le plafond de stingest01 seulement répond à l'exigence sans modifier les autres comptes.
  options:
    a:
      en: |-
        Sensitive data threat detection prioritizes alerts by data sensitivity; it doesn't change how many gigabytes are scanned.
      fr: |-
        La détection des menaces sur les données sensibles hiérarchise les alertes selon la sensibilité des données ; elle ne change pas le volume analysé.
    b:
      en: |-
        Agentless malware scanning of Defender for Servers scans virtual machine disks, not blobs in storage accounts.
      fr: |-
        L'analyse sans agent de Defender for Servers analyse les disques des machines virtuelles, pas les blobs des comptes de stockage.
    d:
      en: |-
        Raising the cap at the subscription level changes the settings of every storage account of Sub1.
      fr: |-
        Augmenter le plafond au niveau de l'abonnement modifie les paramètres de tous les comptes de stockage de Sub1.
references:
  - title: What is Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
