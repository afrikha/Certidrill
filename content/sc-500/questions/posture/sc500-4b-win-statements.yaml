id: sc500-4b-win-statements
objective: "4.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. creates data collection rules (DCRs) from the Windows Security Events via AMA connector of Microsoft Sentinel. The monitored servers are Azure VMs in a subscription named Sub-Prod. The Sentinel workspace is in a subscription named Sub-SOC. Both subscriptions are in the same Microsoft Entra tenant.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. crée des règles de collecte de données (DCR) à partir du connecteur Windows Security Events via AMA de Microsoft Sentinel. Les serveurs supervisés sont des machines virtuelles Azure d'un abonnement nommé Sub-Prod. L'espace de travail Sentinel se trouve dans un abonnement nommé Sub-SOC. Les deux abonnements appartiennent au même locataire Microsoft Entra.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can create the DCRs in a resource group of Sub-SOC even though the servers are in Sub-Prod.
        fr: |
          Vous pouvez créer les DCR dans un groupe de ressources de Sub-SOC même si les serveurs se trouvent dans Sub-Prod.
    - id: s2
      text:
        en: |
          In Custom mode, you can use XPath 2.0 functions in the filter expressions.
        fr: |
          En mode Custom, vous pouvez utiliser des fonctions XPath 2.0 dans les expressions de filtre.
    - id: s3
      text:
        en: |
          The events selected by an XPath filter are filtered on the server, so only the matching events are sent to the workspace.
        fr: |
          Les événements sélectionnés par un filtre XPath sont filtrés sur le serveur : seuls les événements correspondants sont envoyés à l'espace de travail.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The subscription and resource group of a DCR don't have to match those of the monitored machines, as long as both are in the same tenant. Custom mode supports XPath 1.0 only, with up to 20 expressions per box. The Azure Monitor Agent applies the DCR filters on the machine, which reduces ingestion costs.
    fr: |
      L'abonnement et le groupe de ressources d'une DCR n'ont pas à correspondre à ceux des machines supervisées, tant qu'ils appartiennent au même locataire. Le mode Custom ne prend en charge que XPath 1.0, avec jusqu'à 20 expressions par zone. L'agent Azure Monitor applique les filtres de la DCR sur la machine, ce qui réduit les coûts d'ingestion.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
