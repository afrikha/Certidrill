id: sc500-4b-auto-actions-map
objective: "4.2.8"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. configures automation rules in Microsoft Sentinel. Each requirement below is met by one automation rule that has a single action.

    Which action should the automation rule use for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. configure des règles d'automatisation dans Microsoft Sentinel. Chaque exigence ci-dessous est satisfaite par une règle d'automatisation qui comporte une seule action.

    Quelle action la règle d'automatisation doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: task, text: Add task }
    - { id: owner, text: Assign owner }
    - { id: playbook, text: Run playbook }
    - { id: tag, text: Add tag }
    - { id: severity, text: Change severity }
    - { id: status, text: Change status }
  targets:
    - { id: t1, text: { en: "Give analysts a checklist of triage steps in every phishing incident", fr: "Donner aux analystes une liste de contrôle des étapes de tri dans chaque incident d'hameçonnage" } }
    - { id: t2, text: { en: "Route every incident from Microsoft Defender for Identity to the identity team lead", fr: "Acheminer chaque incident de Microsoft Defender for Identity vers le responsable de l'équipe d'identité" } }
    - { id: t3, text: { en: "Post a message in a Microsoft Teams channel for every high-severity incident", fr: "Publier un message dans un canal Microsoft Teams pour chaque incident de gravité élevée" } }
    - { id: t4, text: { en: "Label incidents with a free-text value so that reports can group them", fr: "Étiqueter les incidents avec une valeur libre pour que les rapports puissent les regrouper" } }
answer:
  mapping: { t1: task, t2: owner, t3: playbook, t4: tag }
explanation:
  correct:
    en: |
      Add task creates a checklist of steps in the incident. Assign owner routes incidents to a specific analyst. Posting to Microsoft Teams calls an external system, which requires a playbook run by the automation rule. Add tag classifies incidents with free-text tags.
    fr: |
      Add task crée une liste de contrôle d'étapes dans l'incident. Assign owner achemine les incidents vers un analyste précis. La publication dans Microsoft Teams appelle un système externe, ce qui exige un playbook exécuté par la règle d'automatisation. Add tag classe les incidents avec des étiquettes libres.
  options:
    severity:
      en: |
        Change severity raises or lowers the severity; it doesn't notify anyone or classify incidents with a custom value.
      fr: |
        Change severity augmente ou diminue la gravité ; elle n'avertit personne et ne classe pas les incidents avec une valeur personnalisée.
    status:
      en: |
        Change status closes or changes the status of incidents, which none of the requirements asks for.
      fr: |
        Change status ferme les incidents ou modifie leur statut, ce qu'aucune exigence ne demande.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
