id: sc500-4c-agent-store-deploy
objective: "4.3.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Litware uses Microsoft Security Copilot and Microsoft Sentinel. You are a Copilot contributor and a Contributor on the Azure subscription that Litware uses for billing.

    You need to get a partner agent from Microsoft Security Store that runs Microsoft Sentinel data lake notebook jobs, and then configure it in Security Copilot.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware utilise Microsoft Security Copilot et Microsoft Sentinel. Vous êtes Copilot contributor et Contributor sur l'abonnement Azure que Litware utilise pour la facturation.

    Vous devez obtenir dans Microsoft Security Store un agent partenaire qui exécute des travaux de notebook du data lake Microsoft Sentinel, puis le configurer dans Security Copilot.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: explore, text: { en: "Select Explore agents, select the agent, and select Get solution.", fr: "Sélectionner Explore agents, sélectionner l'agent, puis Get solution." } }
    - { id: billing, text: { en: "Select the Azure billing subscription, a resource group and a name for the purchase.", fr: "Sélectionner l'abonnement Azure de facturation, un groupe de ressources et un nom pour l'achat." } }
    - { id: ws, text: { en: "In the deployment resources, select the Microsoft Sentinel workspace.", fr: "Dans les ressources de déploiement, sélectionner l'espace de travail Microsoft Sentinel." } }
    - { id: order, text: { en: "Review the order and select Place order.", fr: "Vérifier la commande et sélectionner Place order." } }
    - { id: open, text: { en: "When deployment completes, select Open Microsoft Security Copilot and set up the agent.", fr: "Une fois le déploiement terminé, sélectionner Open Microsoft Security Copilot et configurer l'agent." } }
    - { id: hub, text: { en: "In the Microsoft Sentinel content hub, install the agent's solution.", fr: "Dans le hub de contenu Microsoft Sentinel, installer la solution de l'agent." } }
    - { id: plugin, text: { en: "In Owner > Plugin settings, set the preinstalled plugin availability to All users.", fr: "Dans Owner > Plugin settings, définir la disponibilité des plug-ins préinstallés sur All users." } }
answer:
  sequence: [ explore, billing, ws, order, open ]
explanation:
  correct:
    en: |
      In Security Store you explore the agents and select Get solution, then enter the billing subscription, resource group and purchase name. The deployment resources step asks for the Sentinel workspace when the agent uses Sentinel data lake resources. Place order creates the billing and agent resources, and Open Microsoft Security Copilot takes you to the agent setup.
    fr: |
      Dans Security Store, vous explorez les agents et sélectionnez Get solution, puis vous saisissez l'abonnement de facturation, le groupe de ressources et le nom de l'achat. L'étape des ressources de déploiement demande l'espace de travail Sentinel quand l'agent utilise des ressources du data lake Sentinel. Place order crée les ressources de facturation et de l'agent, et Open Microsoft Security Copilot mène à la configuration de l'agent.
  options:
    hub: { en: "Security Store agents are purchased and deployed from Security Store, not installed from the Sentinel content hub.", fr: "Les agents du Security Store s'achètent et se déploient depuis le Security Store, pas depuis le hub de contenu Sentinel." }
    plugin: { en: "Plugin availability is an owner setting, and an agent's required plugins are enabled for the agent during its setup.", fr: "La disponibilité des plug-ins est un paramètre de propriétaire, et les plug-ins requis par un agent sont activés pour l'agent pendant sa configuration." }
references:
  - title: Get agents in Microsoft Security Store
    url: https://learn.microsoft.com/en-us/security/store/customers/get-agents-in-security-store
