id: sc500-4c-retention-restore-rst
objective: "4.2.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders uses Microsoft Sentinel on a Log Analytics workspace named **law-nw**. The workspace is not onboarded to the Microsoft Sentinel data lake. The **SecurityEvent** table uses the Analytics plan with an analytics retention of 90 days and a total retention of 2 years.

    During a breach investigation, analysts must run complex KQL queries that use `join` and `summarize` on all the SecurityEvent records of a three-day period that ended 14 months ago. They will query the data repeatedly for two weeks. The solution must minimize costs.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-nw**. L'espace de travail n'est pas intégré au data lake Microsoft Sentinel. La table **SecurityEvent** utilise le plan Analytics avec une rétention d'analyse de 90 jours et une rétention totale de 2 ans.

    Pendant une enquête sur une compromission, les analystes doivent exécuter des requêtes KQL complexes, avec `join` et `summarize`, sur tous les enregistrements SecurityEvent d'une période de trois jours qui s'est terminée il y a 14 mois. Ils interrogeront ces données à plusieurs reprises pendant deux semaines. La solution doit réduire les coûts au minimum.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Restore the three-day period of SecurityEvent to a table whose name ends with _RST.", fr: "Restaurer la période de trois jours de SecurityEvent dans une table dont le nom se termine par _RST." } }
    - { id: b, text: { en: "Run a search job that joins SecurityEvent with SigninLogs for the three-day period.", fr: "Exécuter un travail de recherche qui joint SecurityEvent à SigninLogs sur la période de trois jours." } }
    - { id: c, text: { en: "Increase the analytics retention of SecurityEvent to 730 days.", fr: "Augmenter la rétention d'analyse de SecurityEvent à 730 jours." } }
    - { id: d, text: { en: "Delete the restored table when the investigation ends.", fr: "Supprimer la table restaurée à la fin de l'enquête." } }
    - { id: e, text: { en: "Change the table plan of SecurityEvent to Basic.", fr: "Changer le plan de table de SecurityEvent en Basic." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A restore makes a time range of long-term data available in the hot cache with full KQL, for repeated high-performance queries, in a table that ends with `_RST`. Restore is billed from the moment it starts until you dismiss it, so deleting the restored table at the end of the investigation stops the charge without affecting the source data.
    fr: |
      Une restauration rend une plage de temps de données à long terme disponible dans le cache à chaud avec tout le langage KQL, pour des requêtes performantes répétées, dans une table qui se termine par `_RST`. La restauration est facturée dès son démarrage jusqu'à ce que vous la supprimiez : supprimer la table restaurée à la fin de l'enquête arrête la facturation sans toucher aux données sources.
  options:
    b: { en: "Search jobs query one table at a time and support only a few operators (where, extend, project, parse...); join isn't supported.", fr: "Les travaux de recherche interrogent une seule table à la fois et ne prennent en charge que quelques opérateurs (where, extend, project, parse...) ; join n'est pas pris en charge." }
    c: { en: "Keeping the whole table in the analytics tier for two years adds a retention charge on all its data, far more than a short restore.", fr: "Garder toute la table dans le niveau d'analyse pendant deux ans ajoute des frais de rétention sur toutes ses données, bien plus qu'une restauration courte." }
    e: { en: "The Basic plan has a fixed 30-day query window; it doesn't make 14-month-old data available to interactive queries.", fr: "Le plan Basic a une fenêtre de requête fixe de 30 jours ; il ne rend pas des données vieilles de 14 mois disponibles pour des requêtes interactives." }
references:
  - title: Restore logs in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/restore
  - title: Run search jobs in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/search-jobs
