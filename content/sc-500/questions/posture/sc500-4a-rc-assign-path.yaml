id: sc500-4a-rc-assign-path
objective: "4.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso has 30 Azure subscriptions under a management group named **MG-Prod**. The Defender CSPM plan is enabled on every subscription.

    You need to assess all the subscriptions against NIST SP 800-53 and aggregate the compliance data at the highest applicable scope.

    How should you complete the procedure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de 30 abonnements Azure sous un groupe d'administration nommé **MG-Prod**. Le plan Defender CSPM est activé sur chaque abonnement.

    Vous devez évaluer tous les abonnements par rapport à NIST SP 800-53 et agréger les données de conformité à l'étendue applicable la plus élevée.

    Comment devez-vous compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Microsoft Defender for Cloud, open [[page]] and select **Manage compliance policies**.
      Select [[scope]], select [[blade]], locate NIST SP 800-53 and set its status to **On**.
    fr: |
      Dans Microsoft Defender for Cloud, ouvrez [[page]] et sélectionnez **Manage compliance policies**.
      Sélectionnez [[scope]], sélectionnez [[blade]], recherchez NIST SP 800-53 et définissez son état sur **On**.
  slots:
    - id: page
      options:
        - { id: rc, text: "Regulatory compliance" }
        - { id: reco, text: "Recommendations" }
        - { id: inv, text: "Inventory" }
        - { id: wp, text: "Workload protections" }
    - id: scope
      options:
        - { id: mg, text: { en: "the MG-Prod management group", fr: "le groupe d'administration MG-Prod" } }
        - { id: each, text: { en: "each subscription in turn", fr: "chaque abonnement l'un après l'autre" } }
        - { id: ws, text: { en: "the Log Analytics workspace of Defender for Cloud", fr: "l'espace de travail Log Analytics de Defender for Cloud" } }
    - id: blade
      options:
        - { id: sp, text: "Security policies" }
        - { id: plans, text: "Defender plans" }
        - { id: export, text: "Continuous export" }
        - { id: wfa, text: "Workflow automation" }
answer:
  values: { page: rc, scope: mg, blade: sp }
explanation:
  correct:
    en: |-
      From **Regulatory compliance** > **Manage compliance policies**, you select the scope, which can be an Azure subscription or a management group, then **Security policies**, and turn the standard on. Microsoft recommends the highest scope applicable to the standard so that compliance data is aggregated for all nested resources, here MG-Prod.
    fr: |-
      Depuis **Regulatory compliance** > **Manage compliance policies**, vous sélectionnez l'étendue, qui peut être un abonnement Azure ou un groupe d'administration, puis **Security policies**, et vous activez la norme. Microsoft recommande l'étendue la plus élevée applicable à la norme pour que les données de conformité soient agrégées pour toutes les ressources imbriquées, ici MG-Prod.
  options:
    each:
      en: |-
        Assigning the standard on each subscription works but doesn't aggregate the data at the highest scope and adds work.
      fr: |-
        Affecter la norme sur chaque abonnement fonctionne, mais n'agrège pas les données à l'étendue la plus élevée et ajoute du travail.
    plans:
      en: |-
        Defender plans is where you turn plans on or off, not compliance standards.
      fr: |-
        Defender plans sert à activer ou désactiver les plans, pas les normes de conformité.
references:
  - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages
