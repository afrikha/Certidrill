id: sc500-4a-cspm-tools
objective: "4.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has enabled the Defender CSPM plan on all its Azure subscriptions. The security team has four requirements.

    Which Defender for Cloud feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a activé le plan Defender CSPM sur tous ses abonnements Azure. L'équipe de sécurité a quatre exigences.

    Quelle fonctionnalité de Defender for Cloud devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: explorer, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité cloud" } }
    - { id: paths, text: { en: "Attack path analysis", fr: "Analyse du chemin d'attaque" } }
    - { id: gov, text: { en: "Governance rules", fr: "Règles de gouvernance" } }
    - { id: wfa, text: { en: "Workflow automation", fr: "Automatisation du workflow" } }
    - { id: score, text: { en: "Secure score", fr: "Degré de sécurisation" } }
    - { id: export, text: { en: "Continuous export", fr: "Exportation continue" } }
  targets:
    - id: t1
      text: { en: "Run an ad hoc query that lists the internet-exposed VMs that have high-severity vulnerabilities and can authenticate to a key vault", fr: "Exécuter une requête ad hoc qui liste les machines virtuelles exposées à Internet qui ont des vulnérabilités de gravité élevée et peuvent s'authentifier auprès d'un coffre de clés" }
    - id: t2
      text: { en: "Show the chain of steps from an exposed VM to a storage account that holds sensitive data, with the recommendations that break the chain", fr: "Afficher la chaîne d'étapes qui mène d'une machine virtuelle exposée à un compte de stockage contenant des données sensibles, avec les recommandations qui rompent la chaîne" }
    - id: t3
      text: { en: "Automatically give each new recommendation an owner and a due date, based on its scope", fr: "Attribuer automatiquement un propriétaire et une date d'échéance à chaque nouvelle recommandation, selon son étendue" }
    - id: t4
      text: { en: "Run a logic app that posts a message to Teams when a recommendation changes state", fr: "Exécuter une application logique qui publie un message dans Teams lorsqu'une recommandation change d'état" }
answer:
  mapping: { t1: explorer, t2: paths, t3: gov, t4: wfa }
explanation:
  correct:
    en: |-
      Cloud security explorer builds graph queries across resources, exposure, vulnerabilities and permissions. Attack path analysis computes the exploitable paths from an entry point to a target and lists the recommendations that fix them. Governance rules assign owners and due dates to recommendations at scale. Workflow automation triggers a logic app on recommendation, alert or compliance events.
    fr: |-
      L'explorateur de sécurité cloud construit des requêtes de graphe sur les ressources, l'exposition, les vulnérabilités et les autorisations. L'analyse du chemin d'attaque calcule les chemins exploitables d'un point d'entrée vers une cible et liste les recommandations qui les corrigent. Les règles de gouvernance attribuent des propriétaires et des dates d'échéance aux recommandations à grande échelle. L'automatisation du workflow déclenche une application logique sur des événements de recommandation, d'alerte ou de conformité.
  options:
    score:
      en: |-
        The secure score measures overall posture as a percentage; it does not answer any of these requirements.
      fr: |-
        Le degré de sécurisation mesure la posture globale en pourcentage ; il ne répond à aucune de ces exigences.
    export:
      en: |-
        Continuous export streams Defender for Cloud data to Event Hubs or Log Analytics; it does not run a logic app.
      fr: |-
        L'exportation continue envoie les données de Defender for Cloud vers Event Hubs ou Log Analytics ; elle n'exécute pas d'application logique.
references:
  - title: Build queries with cloud security explorer
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-cloud-security-explorer
  - title: Identify and remediate attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path
