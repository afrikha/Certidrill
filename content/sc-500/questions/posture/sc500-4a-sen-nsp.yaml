id: sc500-4a-sen-nsp
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft Sentinel on a Log Analytics workspace named **law-sec**. Last week, four changes were made to law-sec:

    - The pricing tier was changed from pay-as-you-go to a 100 GB/day commitment tier.
    - The analytics retention of the SecurityEvent table was increased to 180 days.
    - The workspace was associated with a network security perimeter.
    - Two analysts were assigned the Microsoft Sentinel Reader role on the resource group.

    Since then, all the analytics rules of law-sec are disabled.

    Which change caused the analytics rules to be disabled?
  fr: |
    Tailspin Toys utilise Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-sec**. La semaine dernière, quatre modifications ont été apportées à law-sec :

    - Le niveau tarifaire est passé du paiement à l'utilisation à un niveau d'engagement de 100 Go/jour.
    - La rétention d'analyse de la table SecurityEvent a été portée à 180 jours.
    - L'espace de travail a été associé à un périmètre de sécurité réseau.
    - Deux analystes ont reçu le rôle Microsoft Sentinel Reader sur le groupe de ressources.

    Depuis, toutes les règles d'analyse de law-sec sont désactivées.

    Quelle modification a entraîné la désactivation des règles d'analyse ?
body:
  options:
    - { id: a, text: { en: "The change to a commitment tier", fr: "Le passage à un niveau d'engagement" } }
    - { id: b, text: { en: "The longer analytics retention", fr: "L'allongement de la rétention d'analyse" } }
    - { id: c, text: { en: "The Microsoft Sentinel Reader assignments", fr: "Les attributions du rôle Microsoft Sentinel Reader" } }
    - { id: d, text: { en: "The network security perimeter association", fr: "L'association au périmètre de sécurité réseau" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Network security perimeters aren't supported for Log Analytics workspaces enabled for Microsoft Sentinel. If a network security perimeter is enabled on the workspace, analytics rules are disabled automatically.
    fr: |-
      Les périmètres de sécurité réseau ne sont pas pris en charge pour les espaces de travail Log Analytics sur lesquels Microsoft Sentinel est activé. Si un périmètre de sécurité réseau est activé sur l'espace de travail, les règles d'analyse sont désactivées automatiquement.
  options:
    a:
      en: |-
        Commitment tiers are supported pricing tiers for Microsoft Sentinel, like pay-as-you-go.
      fr: |-
        Les niveaux d'engagement sont des niveaux tarifaires pris en charge par Microsoft Sentinel, comme le paiement à l'utilisation.
    b:
      en: |-
        Retention settings change how long data is kept; they don't disable analytics rules.
      fr: |-
        Les paramètres de rétention modifient la durée de conservation des données ; ils ne désactivent pas les règles d'analyse.
    c:
      en: |-
        Granting a read-only role to analysts doesn't change the state of analytics rules.
      fr: |-
        Accorder un rôle en lecture seule à des analystes ne modifie pas l'état des règles d'analyse.
references:
  - title: Prerequisites to deploy Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/prerequisites
