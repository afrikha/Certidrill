id: sc500-cs4b-logs-ingestion
objective: "4.2.7"
type: ordering
caseStudy: sc500-cs4b-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to prepare law-soc to meet the requirement for the crew rostering records. You will use the Azure portal.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez préparer law-soc pour respecter l'exigence relative aux enregistrements de planification des équipages. Vous utiliserez le portail Azure.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: dce, text: { en: "Create a data collection endpoint in France Central.", fr: "Créer un point de terminaison de collecte de données dans France Central." } }
    - { id: table, text: { en: "In law-soc, create a new custom log (DCR based) named CrewRoster with a new data collection rule and a transformation.", fr: "Dans law-soc, créer un nouveau journal personnalisé (basé sur une DCR) nommé CrewRoster, avec une nouvelle règle de collecte de données et une transformation." } }
    - { id: role, text: { en: "Assign the Monitoring Metrics Publisher role on the data collection rule to app-crewlog.", fr: "Attribuer le rôle Monitoring Metrics Publisher sur la règle de collecte de données à app-crewlog." } }
    - { id: lac, text: { en: "Assign the Log Analytics Contributor role on law-soc to app-crewlog.", fr: "Attribuer le rôle Log Analytics Contributor sur law-soc à app-crewlog." } }
    - { id: ama, text: { en: "Install the Azure Monitor Agent on the server that runs the crew rostering application.", fr: "Installer l'agent Azure Monitor sur le serveur qui exécute l'application de planification des équipages." } }
    - { id: dcra, text: { en: "Associate the data collection rule with the server that runs the crew rostering application.", fr: "Associer la règle de collecte de données au serveur qui exécute l'application de planification des équipages." } }
answer:
  sequence: [ dce, table, role ]
explanation:
  correct:
    en: |
      The portal wizard for a DCR-based custom table asks you to select a data collection endpoint, so the endpoint, in the region of the workspace, must exist first. The wizard creates the CrewRoster_CL table (it adds the _CL suffix) and the data collection rule with its transformation. The application then calls the Logs Ingestion API as app-crewlog, which needs the Monitoring Metrics Publisher role on the data collection rule; the role grants the Microsoft.Insights/Telemetry/Write permission.
    fr: |
      L'assistant du portail qui crée une table personnalisée basée sur une DCR demande de sélectionner un point de terminaison de collecte de données : le point de terminaison, dans la région de l'espace de travail, doit donc exister d'abord. L'assistant crée la table CrewRoster_CL (il ajoute le suffixe _CL) et la règle de collecte de données avec sa transformation. L'application appelle ensuite l'API d'ingestion de journaux en tant qu'app-crewlog, qui a besoin du rôle Monitoring Metrics Publisher sur la règle de collecte de données ; ce rôle accorde l'autorisation Microsoft.Insights/Telemetry/Write.
  options:
    lac:
      en: |
        Log Analytics Contributor manages the workspace but does not grant permission to send data through a data collection rule, and it exceeds least privilege.
      fr: |
        Log Analytics Contributor gère l'espace de travail mais n'accorde pas l'autorisation d'envoyer des données par une règle de collecte de données, et il dépasse le moindre privilège.
    ama:
      en: |
        The Logs Ingestion API is called directly by the application over REST; no agent is involved.
      fr: |
        L'API d'ingestion de journaux est appelée directement par l'application en REST ; aucun agent n'intervient.
    dcra:
      en: |
        Data collection rule associations link agent-based collection to machines; the Logs Ingestion API does not use them.
      fr: |
        Les associations de règles de collecte de données lient une collecte par agent à des machines ; l'API d'ingestion de journaux ne les utilise pas.
references:
  - title: "Tutorial: Send data to Azure Monitor Logs by using the Logs ingestion API (Azure portal)"
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/tutorial-logs-ingestion-portal
