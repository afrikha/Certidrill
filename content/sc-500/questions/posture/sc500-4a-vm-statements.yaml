id: sc500-4a-vm-statements
objective: "4.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure subscription named **Sub-Prod** in which Defender for Servers Plan 2 is enabled with the default settings. Sub-Prod contains Windows and Linux virtual machines in the West Europe region.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un abonnement Azure nommé **Sub-Prod** sur lequel Defender for Servers Plan 2 est activé avec les paramètres par défaut. Sub-Prod contient des machines virtuelles Windows et Linux dans la région West Europe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Vulnerability assessment for machines is turned on for Sub-Prod.
        fr: |-
          Vulnerability assessment for machines est activé pour Sub-Prod.
    - id: s2
      text:
        en: |-
          For agentless scanning, Defender for Cloud keeps the disk snapshots of each virtual machine for 30 days so that findings can be rechecked.
        fr: |-
          Pour l'analyse sans agent, Defender for Cloud conserve les instantanés de disque de chaque machine virtuelle pendant 30 jours afin de pouvoir revérifier les résultats.
    - id: s3
      text:
        en: |-
          The disk snapshots that agentless scanning analyzes stay in the West Europe region.
        fr: |-
          Les instantanés de disque analysés par l'analyse sans agent restent dans la région West Europe.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Vulnerability assessment is on by default when Defender for Servers Plan 1 or Plan 2 is enabled, and Plan 2 also turns on agentless scanning. Agentless scanning copies a snapshot of the disks in the same region as the VM, analyzes it out of band, and deletes the copy immediately after collecting the metadata, typically within minutes.
    fr: |-
      L'évaluation des vulnérabilités est activée par défaut avec Defender for Servers Plan 1 ou Plan 2, et Plan 2 active aussi l'analyse sans agent. L'analyse sans agent copie un instantané des disques dans la même région que la machine virtuelle, l'analyse hors bande et supprime la copie dès que les métadonnées sont collectées, généralement en quelques minutes.
  options:
    s2:
      en: |-
        The copied snapshot is deleted immediately after the metadata is collected; it isn't kept for 30 days.
      fr: |-
        L'instantané copié est supprimé dès que les métadonnées sont collectées ; il n'est pas conservé 30 jours.
references:
  - title: Agentless machine scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-agentless-data-collection
  - title: Review and modify Defender for Servers settings
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/configure-servers-coverage
