id: sc500-4c-copilot-everyone-group
objective: "4.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has used Microsoft Security Copilot since its early release. The Copilot contributor role is assigned to the **Everyone** group. Many users who have no security permissions open Security Copilot and get no useful results.

    You need to ensure that Copilot contributor access is limited to users who already have security permissions through their Microsoft Entra roles. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Woodgrove Bank utilise Microsoft Security Copilot depuis ses débuts. Le rôle Copilot contributor est attribué au groupe **Everyone**. De nombreux utilisateurs sans autorisations de sécurité ouvrent Security Copilot et n'obtiennent aucun résultat utile.

    Vous devez faire en sorte que l'accès Copilot contributor soit limité aux utilisateurs qui disposent déjà d'autorisations de sécurité par leurs rôles Microsoft Entra. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the Recommended Microsoft Security roles group to Copilot contributor and keep the Everyone group.", fr: "Ajouter le groupe Recommended Microsoft Security roles à Copilot contributor et conserver le groupe Everyone." } }
    - { id: b, text: { en: "Remove the Everyone group, and then add the Recommended Microsoft Security roles group to Copilot contributor.", fr: "Retirer le groupe Everyone, puis ajouter le groupe Recommended Microsoft Security roles à Copilot contributor." } }
    - { id: c, text: { en: "Remove the Everyone group, and then create a security group that contains each security user and add it to Copilot contributor.", fr: "Retirer le groupe Everyone, puis créer un groupe de sécurité qui contient chaque utilisateur de sécurité et l'ajouter à Copilot contributor." } }
    - { id: d, text: { en: "Remove the Everyone group, and then add the Recommended Microsoft Security roles group to Copilot owner.", fr: "Retirer le groupe Everyone, puis ajouter le groupe Recommended Microsoft Security roles à Copilot owner." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Recommended Microsoft Security roles option gives platform access to users who already have security permissions through Microsoft Entra roles, with no membership to maintain. The Everyone group must be removed before the recommended security roles can be added.
    fr: |
      L'option Recommended Microsoft Security roles donne l'accès à la plateforme aux utilisateurs qui disposent déjà d'autorisations de sécurité par des rôles Microsoft Entra, sans appartenance à maintenir. Le groupe Everyone doit être retiré avant de pouvoir ajouter les rôles de sécurité recommandés.
  options:
    a: { en: "Everyone must be removed before the recommended roles are added; keeping it would still give access to every user.", fr: "Everyone doit être retiré avant d'ajouter les rôles recommandés ; le conserver donnerait toujours l'accès à tous les utilisateurs." }
    c: { en: "A custom group works but must be maintained by hand, which doesn't minimize administrative effort.", fr: "Un groupe personnalisé fonctionne mais doit être tenu à jour manuellement, ce qui ne réduit pas l'effort d'administration." }
    d: { en: "The requirement is contributor access; Copilot owner adds capacity and settings management.", fr: "L'exigence est un accès contributeur ; Copilot owner ajoute la gestion de la capacité et des paramètres." }
references:
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
