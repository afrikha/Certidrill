id: sc500-4c-plugin-preinstalled-owners
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Security Copilot. All preinstalled Microsoft and non-Microsoft plugins are currently available to owners and contributors.

    During a security review, you need to prevent all Copilot contributors from using the preinstalled plugins, both in the Security Copilot portal and in the embedded experiences. Copilot owners must keep using them.

    What should you do?
  fr: |
    Contoso utilise Microsoft Security Copilot. Tous les plug-ins préinstallés, Microsoft et non-Microsoft, sont actuellement disponibles pour les propriétaires et les contributeurs.

    Pendant une revue de sécurité, vous devez empêcher tous les Copilot contributors d'utiliser les plug-ins préinstallés, à la fois dans le portail Security Copilot et dans les expériences intégrées. Les Copilot owners doivent continuer à les utiliser.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Manage plugins, turn off the toggle of each preinstalled plugin.", fr: "Dans Manage plugins, désactiver le bouton bascule de chaque plug-in préinstallé." } }
    - { id: b, text: { en: "In Plugin settings, set who can add and manage their own custom plugins to Owners only.", fr: "Dans Plugin settings, définir qui peut ajouter et gérer ses propres plug-ins personnalisés sur Owners only." } }
    - { id: c, text: { en: "In Plugin settings, set the preinstalled plugin availability to Owners only.", fr: "Dans Plugin settings, définir la disponibilité des plug-ins préinstallés sur Owners only." } }
    - { id: d, text: { en: "In Role assignment, remove the Copilot contributor role from every contributor.", fr: "Dans Role assignment, retirer le rôle Copilot contributor à chaque contributeur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Owners can restrict preinstalled plugins to Owners only in the Plugin settings of the Owner menu. The change takes effect immediately for all users, including the embedded experiences such as Copilot in Defender, and new preinstalled plugins then default to Owners only.
    fr: |
      Les propriétaires peuvent restreindre les plug-ins préinstallés aux seuls propriétaires (Owners only) dans les Plugin settings du menu Owner. La modification prend effet immédiatement pour tous les utilisateurs, y compris dans les expériences intégrées comme Copilot dans Defender, et les nouveaux plug-ins préinstallés sont ensuite réservés par défaut aux propriétaires.
  options:
    a: { en: "The toggles in Manage plugins turn plugins on or off for the person who uses them; they don't restrict contributors.", fr: "Les boutons bascule de Manage plugins activent ou désactivent les plug-ins pour la personne qui les utilise ; ils ne restreignent pas les contributeurs." }
    b: { en: "This setting governs custom plugins, not preinstalled ones.", fr: "Ce paramètre régit les plug-ins personnalisés, pas les plug-ins préinstallés." }
    d: { en: "Removing the role blocks Security Copilot entirely, whereas contributors only need to lose the preinstalled plugins.", fr: "Retirer le rôle bloque complètement Security Copilot, alors que les contributeurs doivent seulement perdre les plug-ins préinstallés." }
references:
  - title: Manage plugins in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins
