id: sc500-4b-win-event-sets
objective: "4.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank collects Windows Security events in Microsoft Sentinel. Different teams have different requirements for different groups of servers.

    Which collection option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank collecte des événements de sécurité Windows dans Microsoft Sentinel. Différentes équipes ont des exigences différentes pour différents groupes de serveurs.

    Quelle option de collecte devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: all, text: { en: "Windows Security Events via AMA, All events", fr: "Windows Security Events via AMA, All events" } }
    - { id: common, text: { en: "Windows Security Events via AMA, Common", fr: "Windows Security Events via AMA, Common" } }
    - { id: minimal, text: { en: "Windows Security Events via AMA, Minimal", fr: "Windows Security Events via AMA, Minimal" } }
    - { id: custom, text: { en: "Windows Security Events via AMA, Custom", fr: "Windows Security Events via AMA, Custom" } }
    - { id: wef, text: { en: "Windows Forwarded Events", fr: "Windows Forwarded Events" } }
  targets:
    - { id: t1, text: { en: "Keep a full user audit trail, including sign-out events, while reducing the volume compared to the whole Security log", fr: "Conserver une piste d'audit complète des utilisateurs, y compris les déconnexions, tout en réduisant le volume par rapport à l'intégralité du journal Security" } }
    - { id: t2, text: { en: "Collect only the low-volume events that might indicate a breach; no full audit trail is needed", fr: "Collecter uniquement les événements à faible volume susceptibles d'indiquer une compromission ; aucune piste d'audit complète n'est nécessaire" } }
    - { id: t3, text: { en: "Collect only events 4726 and 1102", fr: "Collecter uniquement les événements 4726 et 1102" } }
    - { id: t4, text: { en: "Collect events that domain controllers already send to a Windows Event Collector server, without an agent on the domain controllers", fr: "Collecter les événements que les contrôleurs de domaine envoient déjà à un serveur collecteur d'événements Windows, sans agent sur les contrôleurs de domaine" } }
answer:
  mapping: { t1: common, t2: minimal, t3: custom, t4: wef }
explanation:
  correct:
    en: |
      Common is a standard auditing set that reduces volume while keeping a full user audit trail, for example sign-in and sign-out events (4624, 4634). Minimal contains only events that might indicate a breach and other rare important events, without sign-out events. A Custom set with XPath queries collects specific event IDs only. Events forwarded to a Windows Event Collector are collected by the Windows Forwarded Events connector, with the Azure Monitor Agent on the collector only.
    fr: |
      Common est un jeu d'audit standard qui réduit le volume tout en conservant une piste d'audit complète des utilisateurs, par exemple les connexions et déconnexions (4624, 4634). Minimal ne contient que les événements susceptibles d'indiquer une compromission et d'autres événements importants et rares, sans les déconnexions. Un jeu Custom avec des requêtes XPath ne collecte que des ID d'événements précis. Les événements transférés à un collecteur d'événements Windows sont collectés par le connecteur Windows Forwarded Events, avec l'agent Azure Monitor sur le collecteur uniquement.
  options:
    all:
      en: |
        All events collects the whole Security and AppLocker logs, which doesn't reduce the volume.
      fr: |
        All events collecte l'intégralité des journaux Security et AppLocker, ce qui ne réduit pas le volume.
references:
  - title: Windows security event sets that can be sent to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/windows-security-event-id-reference
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
