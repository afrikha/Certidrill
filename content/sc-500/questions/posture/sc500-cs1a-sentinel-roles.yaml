id: sc500-cs1a-sentinel-roles
objective: "4.2.2"
type: dragdrop
caseStudy: sc500-cs1a-wingtip-energy
difficulty: 1
status: draft
stem:
  en: |
    You need to assign roles to the SOC staff to meet the Microsoft Sentinel permission requirements. You assign the roles on RG-SOC and RG-SOC-Automation as needed.

    Which role should you assign to each group of users? To answer, drag the appropriate roles to the correct groups. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles au personnel du SOC pour satisfaire les exigences d'autorisations sur Microsoft Sentinel. Vous attribuez les rôles sur RG-SOC et RG-SOC-Automation selon les besoins.

    Quel rôle devez-vous attribuer à chaque groupe d'utilisateurs ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reader, text: Microsoft Sentinel Reader }
    - { id: responder, text: Microsoft Sentinel Responder }
    - { id: contributor, text: Microsoft Sentinel Contributor }
    - { id: playbook, text: Microsoft Sentinel Playbook Operator }
    - { id: automation, text: Microsoft Sentinel Automation Contributor }
    - { id: logicapp, text: Logic App Contributor }
  targets:
    - { id: tier1, text: { en: "Tier 1 analysts", fr: "Analystes de niveau 1" } }
    - { id: engineers, text: { en: "Detection engineers", fr: "Ingénieurs de détection" } }
    - { id: auditors, text: { en: "Compliance auditors", fr: "Auditeurs de conformité" } }
    - { id: operators, text: { en: "Automation operators", fr: "Opérateurs d'automatisation" } }
answer:
  mapping: { tier1: responder, engineers: contributor, auditors: reader, operators: playbook }
explanation:
  correct:
    en: |-
      Microsoft Sentinel Responder adds incident management to the Reader permissions, which is what tier 1 analysts need. Microsoft Sentinel Contributor adds the installation of solutions and the creation of resources such as analytics rules. Microsoft Sentinel Reader only views data, incidents and workbooks. Microsoft Sentinel Playbook Operator lists, views and manually runs playbooks without letting users edit them.
    fr: |-
      Microsoft Sentinel Responder ajoute la gestion des incidents aux autorisations de Reader, ce dont les analystes de niveau 1 ont besoin. Microsoft Sentinel Contributor ajoute l'installation de solutions et la création de ressources comme les règles analytiques. Microsoft Sentinel Reader permet seulement de consulter les données, les incidents et les classeurs. Microsoft Sentinel Playbook Operator permet de lister, de consulter et d'exécuter manuellement les playbooks sans pouvoir les modifier.
  options:
    automation:
      en: |-
        Microsoft Sentinel Automation Contributor lets Microsoft Sentinel add playbooks to automation rules; it is not meant for user accounts.
      fr: |-
        Microsoft Sentinel Automation Contributor permet à Microsoft Sentinel d'ajouter des playbooks aux règles d'automatisation ; il n'est pas destiné aux comptes d'utilisateurs.
    logicapp:
      en: |-
        Logic App Contributor lets users create and edit playbooks, which is more than the automation operators need.
      fr: |-
        Logic App Contributor permet de créer et de modifier des playbooks, ce qui dépasse les besoins des opérateurs d'automatisation.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
