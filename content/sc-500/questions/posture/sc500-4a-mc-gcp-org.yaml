id: sc500-4a-mc-gcp-org
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Google Cloud Platform (GCP) organization that contains 180 projects. New projects are created every month. The company also has an Azure subscription named **Sub-Sec** where Microsoft Defender for Cloud is enabled.

    You need to connect all the current and future GCP projects to Defender for Cloud. The solution must minimize administrative effort and must not store long-lived GCP credentials in Azure.

    What should you do?
  fr: |
    Fabrikam dispose d'une organisation Google Cloud Platform (GCP) qui contient 180 projets. De nouveaux projets sont créés chaque mois. L'entreprise dispose aussi d'un abonnement Azure nommé **Sub-Sec** sur lequel Microsoft Defender for Cloud est activé.

    Vous devez connecter tous les projets GCP actuels et futurs à Defender for Cloud. La solution doit réduire au minimum l'effort d'administration et ne doit stocker aucune information d'identification GCP de longue durée dans Azure.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create one Single project connector per project, and run the generated gcloud script in each project.", fr: "Créer un connecteur Single project par projet, et exécuter le script gcloud généré dans chaque projet." } }
    - { id: b, text: { en: "Install the Azure Connected Machine agent on the Compute Engine VMs, and onboard them to Azure Arc in Sub-Sec.", fr: "Installer l'agent Azure Connected Machine sur les VM Compute Engine, et les intégrer à Azure Arc dans Sub-Sec." } }
    - { id: c, text: { en: "Create an Organization connector, and run the generated gcloud script in the management project.", fr: "Créer un connecteur Organization, et exécuter le script gcloud généré dans le projet de gestion." } }
    - { id: d, text: { en: "Create an Organization connector, and deploy the generated CloudFormation StackSet from the organization.", fr: "Créer un connecteur Organization, et déployer le StackSet CloudFormation généré depuis l'organisation." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An organization-level GCP connector covers the projects of the organization, with optional project and folder exclusions. The generated gcloud script, run in the management project, creates a workload identity pool and providers and the service accounts that Defender for Cloud impersonates, so no long-lived credentials are stored.
    fr: |-
      Un connecteur GCP au niveau de l'organisation couvre les projets de l'organisation, avec des exclusions facultatives de projets et de dossiers. Le script gcloud généré, exécuté dans le projet de gestion, crée un pool et des fournisseurs d'identités de charge de travail ainsi que les comptes de service dont Defender for Cloud emprunte l'identité : aucune information d'identification de longue durée n'est stockée.
  options:
    a:
      en: |-
        Single project connectors work, but 180 connectors plus one for each new project don't minimize administrative effort.
      fr: |-
        Des connecteurs Single project fonctionnent, mais 180 connecteurs plus un par nouveau projet ne réduisent pas l'effort d'administration.
    b:
      en: |-
        Azure Arc onboards individual machines only; it doesn't connect the GCP projects and their other resources to Defender for Cloud.
      fr: |-
        Azure Arc n'intègre que des machines individuelles ; il ne connecte pas les projets GCP ni leurs autres ressources à Defender for Cloud.
    d:
      en: |-
        CloudFormation StackSets are used to onboard AWS organizations; GCP onboarding uses a gcloud script.
      fr: |-
        Les StackSets CloudFormation servent à intégrer les organisations AWS ; l'intégration GCP utilise un script gcloud.
references:
  - title: Connect your GCP project to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-gcp
