id: sc500-4a-rc-standard-plan
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure subscription named **Sub-Fin**. You are the Owner of Sub-Fin. In Microsoft Defender for Cloud, Sub-Fin has foundational CSPM and the Defender for Servers Plan 1 plan. No other plan is enabled.

    The **Regulatory compliance** dashboard shows only the Microsoft cloud security benchmark. When you try to add the ISO 27001 standard to Sub-Fin, the standard can't be enabled.

    You need to assess Sub-Fin against ISO 27001.

    What should you do first?
  fr: |
    Woodgrove Bank dispose d'un abonnement Azure nommé **Sub-Fin**. Vous êtes Owner de Sub-Fin. Dans Microsoft Defender for Cloud, Sub-Fin dispose du CSPM de base et du plan Defender for Servers Plan 1. Aucun autre plan n'est activé.

    Le tableau de bord **Regulatory compliance** n'affiche que le Microsoft cloud security benchmark. Lorsque vous essayez d'ajouter la norme ISO 27001 à Sub-Fin, la norme ne peut pas être activée.

    Vous devez évaluer Sub-Fin par rapport à ISO 27001.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable the Defender for APIs Plan 1 plan on Sub-Fin.", fr: "Activer le plan Defender for APIs Plan 1 sur Sub-Fin." } }
    - { id: b, text: { en: "Turn on the Defender for Endpoint integration of Defender for Servers.", fr: "Activer l'intégration de Defender for Endpoint dans Defender for Servers." } }
    - { id: c, text: { en: "Enable the Defender for Key Vault plan on Sub-Fin.", fr: "Activer le plan Defender for Key Vault sur Sub-Fin." } }
    - { id: d, text: { en: "Assign yourself the Security Admin role on Sub-Fin.", fr: "Vous attribuer le rôle Security Admin sur Sub-Fin." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Standards other than the default Microsoft cloud security benchmark can be assigned only when a Defender for Cloud plan is onboarded, except Defender for Servers Plan 1 and Defender for APIs Plan 1, which don't qualify. Enabling another plan, such as Defender for Key Vault, meets the prerequisite; you can then enable ISO 27001 in **Security policies**.
    fr: |-
      Les normes autres que le Microsoft cloud security benchmark par défaut ne peuvent être affectées que si un plan Defender for Cloud est activé, à l'exception de Defender for Servers Plan 1 et de Defender for APIs Plan 1, qui ne conviennent pas. Activer un autre plan, comme Defender for Key Vault, remplit le prérequis ; vous pouvez ensuite activer ISO 27001 dans **Security policies**.
  options:
    a:
      en: |-
        Defender for APIs Plan 1 is one of the two plans that don't allow you to assign more compliance standards.
      fr: |-
        Defender for APIs Plan 1 est l'un des deux plans qui ne permettent pas d'affecter d'autres normes de conformité.
    b:
      en: |-
        The Defender for Endpoint integration doesn't change the plan level; Defender for Servers Plan 1 still doesn't qualify.
      fr: |-
        L'intégration de Defender for Endpoint ne change pas le niveau du plan ; Defender for Servers Plan 1 ne convient toujours pas.
    d:
      en: |-
        As Owner you already have the permissions to assign a standard; the blocker is the plan, not your role.
      fr: |-
        En tant qu'Owner, vous avez déjà les autorisations pour affecter une norme ; l'obstacle est le plan, pas votre rôle.
references:
  - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages
