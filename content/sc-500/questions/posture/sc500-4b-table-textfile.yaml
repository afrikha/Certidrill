id: sc500-4b-table-textfile
objective: "4.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. runs a web application firewall product on 30 Azure virtual machines that run Linux. The product writes its logs to /var/log/waf/access-*.log. No content hub solution exists for the product, so you installed the Custom Logs via AMA solution in Microsoft Sentinel.

    You need to collect the log files in a new table named WafAccess_CL.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. exécute un pare-feu d'applications web sur 30 machines virtuelles Azure exécutant Linux. Le produit écrit ses journaux dans /var/log/waf/access-*.log. Aucune solution du hub de contenu n'existe pour ce produit : vous avez donc installé la solution Custom Logs via AMA dans Microsoft Sentinel.

    Vous devez collecter les fichiers journaux dans une nouvelle table nommée WafAccess_CL.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the WafAccess_CL table with the TimeGenerated and RawData columns.", fr: "Créer la table WafAccess_CL avec les colonnes TimeGenerated et RawData." } }
    - { id: b, text: { en: "Register a Microsoft Entra application and grant it Monitoring Metrics Publisher on the DCR.", fr: "Inscrire une application Microsoft Entra et lui accorder Monitoring Metrics Publisher sur la DCR." } }
    - { id: c, text: { en: "From the Custom Logs via AMA connector, create a DCR that targets the VMs with the file pattern /var/log/waf/access-*.log and the table WafAccess_CL.", fr: "À partir du connecteur Custom Logs via AMA, créer une DCR qui cible les machines virtuelles avec le modèle de fichier /var/log/waf/access-*.log et la table WafAccess_CL." } }
    - { id: d, text: { en: "Run the Forwarder_AMA_installer.py script on each VM.", fr: "Exécuter le script Forwarder_AMA_installer.py sur chaque machine virtuelle." } }
    - { id: e, text: { en: "Install the Azure Connected Machine agent on each VM.", fr: "Installer l'agent Azure Connected Machine sur chaque machine virtuelle." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Custom Logs via AMA connector needs an existing table whose name ends with _CL and that contains TimeGenerated and RawData. You then create the DCR from the connector page: the Resources tab selects the VMs (the Azure Monitor Agent is installed if missing), and the Collect tab sets the table name and the file pattern, where wildcards are allowed in the file name.
    fr: |
      Le connecteur Custom Logs via AMA a besoin d'une table existante dont le nom se termine par _CL et qui contient TimeGenerated et RawData. Vous créez ensuite la DCR depuis la page du connecteur : l'onglet Resources sélectionne les machines virtuelles (l'agent Azure Monitor est installé s'il manque) et l'onglet Collect définit le nom de la table et le modèle de fichier, où les caractères génériques sont autorisés dans le nom de fichier.
  options:
    b:
      en: |
        An application with Monitoring Metrics Publisher is needed for the Logs Ingestion API, not for files collected by the agent.
      fr: |
        Une application avec Monitoring Metrics Publisher est nécessaire pour l'API d'ingestion de journaux, pas pour des fichiers collectés par l'agent.
    d:
      en: |
        The installer script configures a syslog log forwarder; the files are read locally by the agent.
      fr: |
        Le script d'installation configure un redirecteur de journaux syslog ; les fichiers sont lus localement par l'agent.
    e:
      en: |
        The Azure Connected Machine agent is needed only for machines that aren't Azure VMs.
      fr: |
        L'agent Azure Connected Machine n'est nécessaire que pour les machines qui ne sont pas des machines virtuelles Azure.
references:
  - title: Collect logs from text files with the Azure Monitor Agent and ingest to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-custom-logs-ama
