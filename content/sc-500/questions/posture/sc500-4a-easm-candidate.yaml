id: sc500-4a-easm-candidate
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has deployed a Microsoft Defender External Attack Surface Management (Defender EASM) resource and ran a discovery from the company's known domains.

    The inventory lists a host named **shop.contoso-store.com** in the **Candidate** state. The web team confirms that Contoso owns and operates this host. The host doesn't appear in the dashboard charts.

    You need the host to appear in the dashboards and to be scanned daily.

    What should you do?
  fr: |
    Contoso a déployé une ressource Microsoft Defender External Attack Surface Management (Defender EASM) et lancé une découverte à partir des domaines connus de l'entreprise.

    L'inventaire indique un hôte nommé **shop.contoso-store.com** à l'état **Candidate**. L'équipe web confirme que Contoso possède et exploite cet hôte. L'hôte n'apparaît pas dans les graphiques des tableaux de bord.

    Vous devez faire en sorte que l'hôte apparaisse dans les tableaux de bord et soit analysé chaque jour.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the state of the host to Monitor Only.", fr: "Passer l'état de l'hôte à Monitor Only." } }
    - { id: b, text: { en: "Change the state of the host to Dependency.", fr: "Passer l'état de l'hôte à Dependency." } }
    - { id: c, text: { en: "Change the state of the host to Requires Investigation.", fr: "Passer l'état de l'hôte à Requires Investigation." } }
    - { id: d, text: { en: "Change the state of the host to Approved Inventory.", fr: "Passer l'état de l'hôte à Approved Inventory." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Candidate assets have some relationship to the discovery seeds and are scanned only during discovery. When you confirm that you own one, you change its state to Approved Inventory; approved assets are always shown in the dashboard charts and are scanned daily.
    fr: |-
      Les ressources Candidate ont un lien avec les seeds de découverte et ne sont analysées que pendant la découverte. Lorsque vous confirmez en être propriétaire, vous passez leur état à Approved Inventory ; les ressources approuvées figurent toujours dans les graphiques des tableaux de bord et sont analysées chaque jour.
  options:
    a:
      en: |-
        Monitor Only is for assets that are relevant but not controlled by you, and they aren't in the dashboard charts by default.
      fr: |-
        Monitor Only s'applique aux ressources pertinentes mais que vous ne contrôlez pas, et elles ne figurent pas par défaut dans les graphiques.
    b:
      en: |-
        Dependency is for third-party infrastructure that supports your assets, not for assets you own.
      fr: |-
        Dependency s'applique à une infrastructure tierce qui soutient vos ressources, pas aux ressources que vous possédez.
    c:
      en: |-
        Requires Investigation marks assets whose ownership still has to be validated; ownership is already confirmed here.
      fr: |-
        Requires Investigation marque les ressources dont la propriété reste à valider ; elle est déjà confirmée ici.
references:
  - title: Understand inventory assets
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/understanding-inventory-assets
