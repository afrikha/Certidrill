id: sc500-4b-auto-closed-sync
objective: "4.2.8"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. synchronizes Microsoft Sentinel incidents with an ITSM tool. A playbook named PB-CloseTicket, which uses the Microsoft Sentinel incident trigger, closes the matching ticket.

    You need to create an automation rule that meets the following requirements:

    - PB-CloseTicket runs once, at the moment an analyst closes an incident.
    - PB-CloseTicket doesn't run when a comment is added to an incident that is already closed.
    - PB-CloseTicket doesn't run when another automation rule closes an incident.

    How should you configure the automation rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. synchronise les incidents Microsoft Sentinel avec un outil ITSM. Un playbook nommé PB-CloseTicket, qui utilise le déclencheur d'incident Microsoft Sentinel, ferme le ticket correspondant.

    Vous devez créer une règle d'automatisation qui respecte les exigences suivantes :

    - PB-CloseTicket s'exécute une fois, au moment où un analyste ferme un incident ;
    - PB-CloseTicket ne s'exécute pas lorsqu'un commentaire est ajouté à un incident déjà fermé ;
    - PB-CloseTicket ne s'exécute pas lorsqu'une autre règle d'automatisation ferme un incident.

    Comment devez-vous configurer la règle d'automatisation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Trigger: [[trigger]]

      Condition 1: Status [[operator]] Closed

      Condition 2: Updated by [[updatedby]]

      Action: Run playbook PB-CloseTicket
    fr: |
      Déclencheur : [[trigger]]

      Condition 1 : Status [[operator]] Closed

      Condition 2 : Updated by [[updatedby]]

      Action : Run playbook PB-CloseTicket
  slots:
    - id: trigger
      options:
        - { id: created, text: When incident is created }
        - { id: updated, text: When incident is updated }
        - { id: alert, text: When alert is created }
    - id: operator
      options:
        - { id: equals, text: Equals }
        - { id: changedto, text: Changed to }
        - { id: changedfrom, text: Changed from }
    - id: updatedby
      options:
        - { id: user, text: A user }
        - { id: rule, text: An automation rule }
        - { id: playbook, text: A playbook }
        - { id: app, text: An application }
answer:
  values: { trigger: updated, operator: changedto, updatedby: user }
explanation:
  correct:
    en: |
      Closing an existing incident is an update, so the rule uses When incident is updated. The Changed to operator matches only the update that sets the status to Closed; Equals would also match later updates of a closed incident, such as a new comment. The Updated by condition set to A user excludes changes made by automation rules, playbooks or applications.
    fr: |
      La fermeture d'un incident existant est une mise à jour : la règle utilise When incident is updated. L'opérateur Changed to ne correspond qu'à la mise à jour qui passe le statut à Closed ; Equals correspondrait aussi aux mises à jour ultérieures d'un incident fermé, comme un nouveau commentaire. La condition Updated by définie sur A user exclut les modifications effectuées par des règles d'automatisation, des playbooks ou des applications.
  options:
    created:
      en: |
        An incident is never closed at creation by an analyst; closing it is an update.
      fr: |
        Un analyste ne ferme jamais un incident au moment de sa création ; la fermeture est une mise à jour.
    alert:
      en: |
        The alert trigger runs alert-trigger playbooks when an alert is created; PB-CloseTicket uses the incident trigger.
      fr: |
        Le déclencheur d'alerte exécute des playbooks à déclencheur d'alerte lors de la création d'une alerte ; PB-CloseTicket utilise le déclencheur d'incident.
    changedfrom:
      en: |
        Changed from Closed matches a reopened incident, not a closed one.
      fr: |
        Changed from Closed correspond à un incident rouvert, pas à un incident fermé.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
