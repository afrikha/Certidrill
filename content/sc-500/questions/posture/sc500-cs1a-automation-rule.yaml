id: sc500-cs1a-automation-rule
objective: "4.2.8"
type: yesno_statements
caseStudy: sc500-cs1a-wingtip-energy
difficulty: 3
status: draft
stem:
  en: |
    You plan to meet the incident handling requirement for OT-Firewall-BruteForce. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de satisfaire l'exigence de traitement des incidents de OT-Firewall-BruteForce. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          An automation rule can assign the incidents to Lena Maes without calling a playbook.
        fr: |-
          Une règle d'automatisation peut attribuer les incidents à Lena Maes sans appeler de playbook.
    - id: s2
      text:
        en: |-
          An automation rule that uses the When alert is created trigger can run pb-block-source-ip.
        fr: |-
          Une règle d'automatisation qui utilise le déclencheur When alert is created peut exécuter pb-block-source-ip.
    - id: s3
      text:
        en: |-
          Before an automation rule can run pb-block-source-ip, Microsoft Sentinel must be granted explicit permissions on RG-SOC-Automation.
        fr: |-
          Avant qu'une règle d'automatisation puisse exécuter pb-block-source-ip, Microsoft Sentinel doit recevoir des autorisations explicites sur RG-SOC-Automation.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Assigning an owner is a native automation rule action, like changing the status or adding tags, so no playbook is needed for it. pb-block-source-ip uses the incident trigger, and only incident-trigger playbooks can run from incident-trigger automation rules; an alert-trigger rule runs only alert-trigger playbooks. For any automation rule to run a playbook, the Microsoft Sentinel service account needs explicit permissions on the resource group that contains the playbook, which an Owner of that resource group grants.
    fr: |-
      L'attribution d'un propriétaire est une action native des règles d'automatisation, comme le changement de statut ou l'ajout d'étiquettes : aucun playbook n'est nécessaire. pb-block-source-ip utilise le déclencheur d'incident, et seuls les playbooks à déclencheur d'incident peuvent s'exécuter à partir de règles d'automatisation à déclencheur d'incident ; une règle à déclencheur d'alerte n'exécute que des playbooks à déclencheur d'alerte. Pour qu'une règle d'automatisation exécute un playbook, le compte de service Microsoft Sentinel a besoin d'autorisations explicites sur le groupe de ressources qui contient le playbook, accordées par un Owner de ce groupe de ressources.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
