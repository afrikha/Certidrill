id: sc500-4c-plugin-sentinel-nodata
objective: "4.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Security Copilot and Microsoft Sentinel. A Copilot contributor named **User3** asks Security Copilot to list the high-severity Sentinel incidents of the last 24 hours. The response contains no Sentinel data, although such incidents exist.

    Which two issues could cause the problem?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Security Copilot et Microsoft Sentinel. Un Copilot contributor nommé **User3** demande à Security Copilot de lister les incidents Sentinel de gravité élevée des dernières 24 heures. La réponse ne contient aucune donnée Sentinel, alors que de tels incidents existent.

    Quels sont les deux problèmes qui peuvent en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Who can add and manage their own custom plugins is set to Owners only.", fr: "Le paramètre qui détermine qui peut ajouter et gérer ses propres plug-ins personnalisés est défini sur Owners only." } }
    - { id: b, text: { en: "User3 has no Microsoft Sentinel role on the workspace.", fr: "User3 n'a aucun rôle Microsoft Sentinel sur l'espace de travail." } }
    - { id: c, text: { en: "The customer data sharing settings of the workspace are turned off.", fr: "Les paramètres de partage des données client de l'espace de travail sont désactivés." } }
    - { id: d, text: { en: "The preinstalled plugin availability is set to Owners only.", fr: "La disponibilité des plug-ins préinstallés est définie sur Owners only." } }
    - { id: e, text: { en: "User3 doesn't hold the Security Administrator role in Microsoft Entra ID.", fr: "User3 ne détient pas le rôle Security Administrator dans Microsoft Entra ID." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The Sentinel plugin acts on behalf of the signed-in user, so without a Sentinel role such as Microsoft Sentinel Reader it returns nothing. Microsoft Sentinel is a preinstalled plugin: if owners restrict preinstalled plugins to Owners only, contributors such as User3 can't use it.
    fr: |
      Le plug-in Sentinel agit pour le compte de l'utilisateur connecté : sans rôle Sentinel comme Microsoft Sentinel Reader, il ne renvoie rien. Microsoft Sentinel est un plug-in préinstallé : si les propriétaires restreignent les plug-ins préinstallés aux seuls propriétaires (Owners only), les contributeurs comme User3 ne peuvent pas l'utiliser.
  options:
    a: { en: "This setting concerns custom plugins only; Microsoft Sentinel is preinstalled.", fr: "Ce paramètre ne concerne que les plug-ins personnalisés ; Microsoft Sentinel est préinstallé." }
    c: { en: "Data sharing controls whether Microsoft may capture data for review; it doesn't affect plugin data access.", fr: "Le partage des données détermine si Microsoft peut capturer des données pour révision ; il n'affecte pas l'accès des plug-ins aux données." }
    e: { en: "Security Administrator isn't needed to use the Sentinel plugin; a Sentinel role on the workspace is.", fr: "Security Administrator n'est pas nécessaire pour utiliser le plug-in Sentinel ; c'est un rôle Sentinel sur l'espace de travail qui l'est." }
references:
  - title: Manage plugins in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
