id: sc500-4c-retention-change-effects
objective: "4.2.9"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank uses Microsoft Sentinel in the Microsoft Defender portal. The workspace is onboarded to the Microsoft Sentinel data lake. The custom table **VpnAudit_CL** uses the Analytics tier with an analytics retention of 180 days and a total retention of 2 years.

    You plan to change the retention settings of VpnAudit_CL.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Microsoft Sentinel dans le portail Microsoft Defender. L'espace de travail est intégré au data lake Microsoft Sentinel. La table personnalisée **VpnAudit_CL** utilise le niveau d'analyse (Analytics) avec une rétention d'analyse de 180 jours et une rétention totale de 2 ans.

    Vous prévoyez de modifier les paramètres de rétention de VpnAudit_CL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If you reduce the analytics retention to 90 days and keep the total retention, events that are 120 days old remain available in the data lake tier.
        fr: |
          Si vous réduisez la rétention d'analyse à 90 jours sans modifier la rétention totale, les événements vieux de 120 jours restent disponibles dans le niveau data lake.
    - id: s2
      text:
        en: |
          If you reduce the total retention to 1 year, events older than 1 year are removed as soon as you save the change.
        fr: |
          Si vous réduisez la rétention totale à 1 an, les événements de plus d'un an sont supprimés dès que vous enregistrez la modification.
    - id: s3
      text:
        en: |
          If you move the table to the Data lake tier, the analytics rules that query VpnAudit_CL keep running.
        fr: |
          Si vous déplacez la table vers le niveau data lake, les règles d'analyse qui interrogent VpnAudit_CL continuent de s'exécuter.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Reducing analytics retention takes effect immediately, and the rest of the total retention becomes long-term retention in the data lake, so 120-day-old events stay queryable there. When total retention is shortened, Microsoft waits 30 days before removing the data, so the change can be reverted. Moving a table to the Data lake tier stops the features that depend on the analytics tier, including analytics rules and hunting.
    fr: |
      La réduction de la rétention d'analyse prend effet immédiatement, et le reste de la rétention totale devient de la rétention à long terme dans le data lake ; les événements vieux de 120 jours y restent donc interrogeables. Quand la rétention totale est raccourcie, Microsoft attend 30 jours avant de supprimer les données, ce qui permet d'annuler la modification. Déplacer une table vers le niveau data lake arrête les fonctionnalités qui dépendent du niveau d'analyse, dont les règles d'analyse et le repérage.
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
  - title: Configure table settings in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-table-tiers-retention
