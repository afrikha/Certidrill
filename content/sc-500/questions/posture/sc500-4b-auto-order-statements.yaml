id: sc500-4b-auto-order-statements
objective: "4.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has the following Microsoft Sentinel automation rules. No other automation rule exists.

    | Order | Name | Trigger | Condition | Action |
    | --- | --- | --- | --- | --- |
    | 1 | AR-Lower | When incident is created | Analytics rule name equals Rule-VPN | Change severity to Low |
    | 2 | AR-Escalate | When incident is created | Severity equals Medium or High | Assign owner Tier2 |
    | 3 | AR-Notify | When incident is updated | Owner changed | Run playbook PB-Notify |

    Rule-VPN creates an incident with the severity Medium.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose des règles d'automatisation Microsoft Sentinel suivantes. Il n'existe aucune autre règle d'automatisation.

    | Ordre | Nom | Déclencheur | Condition | Action |
    | --- | --- | --- | --- | --- |
    | 1 | AR-Lower | When incident is created | Analytics rule name equals Rule-VPN | Change severity to Low |
    | 2 | AR-Escalate | When incident is created | Severity equals Medium or High | Assign owner Tier2 |
    | 3 | AR-Notify | When incident is updated | Owner changed | Run playbook PB-Notify |

    Rule-VPN crée un incident de gravité Medium.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          AR-Escalate assigns the incident to Tier2.
        fr: |
          AR-Escalate affecte l'incident à Tier2.
    - id: s2
      text:
        en: |
          AR-Lower and AR-Escalate can run in parallel because they use the same trigger.
        fr: |
          AR-Lower et AR-Escalate peuvent s'exécuter en parallèle, car elles utilisent le même déclencheur.
    - id: s3
      text:
        en: |
          If an analyst later assigns the incident to an owner, AR-Notify runs PB-Notify.
        fr: |
          Si un analyste affecte ensuite l'incident à un propriétaire, AR-Notify exécute PB-Notify.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Automation rules run sequentially, never in parallel, and each rule evaluates its conditions against the incident as left by the previous rules. AR-Lower changes the severity to Low first, so the condition of AR-Escalate is no longer met. A later owner assignment is an update, so the update-trigger rule AR-Notify runs its playbook.
    fr: |
      Les règles d'automatisation s'exécutent séquentiellement, jamais en parallèle, et chaque règle évalue ses conditions sur l'incident tel que l'ont laissé les règles précédentes. AR-Lower définit d'abord la gravité sur Low : la condition d'AR-Escalate n'est plus remplie. Une affectation ultérieure de propriétaire est une mise à jour : la règle à déclencheur de mise à jour AR-Notify exécute son playbook.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
