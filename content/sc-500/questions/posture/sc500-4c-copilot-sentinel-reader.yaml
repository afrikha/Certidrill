id: sc500-4c-copilot-sentinel-reader
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Security Copilot and Microsoft Sentinel on a workspace named **law-fab** in a resource group named **rg-sec**. The Microsoft Sentinel plugin is turned on and available to all users.

    A user named **User2** is a Copilot contributor. When User2 asks Security Copilot to summarize recent Sentinel incidents, no incident data is returned. Other users get results for the same prompt.

    You need to ensure that User2 gets Sentinel incident data. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Fabrikam utilise Microsoft Security Copilot et Microsoft Sentinel sur un espace de travail nommé **law-fab** dans un groupe de ressources nommé **rg-sec**. Le plug-in Microsoft Sentinel est activé et disponible pour tous les utilisateurs.

    Une utilisatrice nommée **User2** est Copilot contributor. Quand User2 demande à Security Copilot de résumer les incidents Sentinel récents, aucune donnée d'incident n'est renvoyée. D'autres utilisateurs obtiennent des résultats pour la même invite.

    Vous devez faire en sorte que User2 obtienne les données des incidents Sentinel. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign User2 the Microsoft Sentinel Reader role on rg-sec.", fr: "Attribuer à User2 le rôle Microsoft Sentinel Reader sur rg-sec." } }
    - { id: b, text: { en: "Add User2 to the Copilot owner role.", fr: "Ajouter User2 au rôle Copilot owner." } }
    - { id: c, text: { en: "Assign User2 the Microsoft Sentinel Playbook Operator role on rg-sec.", fr: "Attribuer à User2 le rôle Microsoft Sentinel Playbook Operator sur rg-sec." } }
    - { id: d, text: { en: "Assign User2 the Security Administrator role in Microsoft Entra ID.", fr: "Attribuer à User2 le rôle Security Administrator dans Microsoft Entra ID." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Security Copilot uses on-behalf-of authentication: a plugin can return only the data that the signed-in user can access in the service. The Sentinel plugin needs an Azure role such as Microsoft Sentinel Reader to read the incidents of the workspace.
    fr: |
      Security Copilot utilise l'authentification pour le compte de (on-behalf-of) : un plug-in ne peut renvoyer que les données auxquelles l'utilisateur connecté a accès dans le service. Le plug-in Sentinel exige un rôle Azure comme Microsoft Sentinel Reader pour lire les incidents de l'espace de travail.
  options:
    b: { en: "Copilot roles control the Security Copilot platform only; they grant no access to security data.", fr: "Les rôles Copilot ne contrôlent que la plateforme Security Copilot ; ils ne donnent aucun accès aux données de sécurité." }
    c: { en: "Playbook Operator only lets the user list and run playbooks; it doesn't grant read access to incidents.", fr: "Playbook Operator permet seulement de lister et d'exécuter des playbooks ; il ne donne pas d'accès en lecture aux incidents." }
    d: { en: "Security Administrator is a privileged Microsoft Entra role and isn't an Azure role on the Sentinel workspace.", fr: "Security Administrator est un rôle Microsoft Entra privilégié et n'est pas un rôle Azure sur l'espace de travail Sentinel." }
references:
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
