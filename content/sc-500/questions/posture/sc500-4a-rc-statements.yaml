id: sc500-4a-rc-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has connected an Azure subscription and an AWS account to Microsoft Defender for Cloud. The Defender CSPM plan is enabled on both. The compliance team uses the **Regulatory compliance** dashboard.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a connecté un abonnement Azure et un compte AWS à Microsoft Defender for Cloud. Le plan Defender CSPM est activé sur les deux. L'équipe conformité utilise le tableau de bord **Regulatory compliance**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The Microsoft cloud security benchmark was assigned to the AWS account by default when the account was connected.
        fr: |-
          Le Microsoft cloud security benchmark a été affecté par défaut au compte AWS lors de sa connexion.
    - id: s2
      text:
        en: |-
          A standard assigned to the Azure subscription is displayed on the dashboard even if the subscription contains no resource that the standard assesses.
        fr: |-
          Une norme affectée à l'abonnement Azure s'affiche dans le tableau de bord même si l'abonnement ne contient aucune ressource évaluée par cette norme.
    - id: s3
      text:
        en: |-
          After you fix a failing resource, its compliance status is updated at the next assessment run, which occurs about every 12 hours.
        fr: |-
          Après la correction d'une ressource non conforme, son état de conformité est mis à jour lors de la prochaine exécution des évaluations, qui a lieu environ toutes les 12 heures.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Connecting an Azure subscription, AWS account or GCP project enables the Microsoft cloud security benchmark by default. A standard with no relevant assessed resources doesn't appear on the regulatory compliance dashboard. Assessments run approximately every 12 hours, so a fix is reflected only after the next run.
    fr: |-
      La connexion d'un abonnement Azure, d'un compte AWS ou d'un projet GCP active par défaut le Microsoft cloud security benchmark. Une norme sans ressource évaluée pertinente n'apparaît pas dans le tableau de bord de conformité réglementaire. Les évaluations s'exécutent environ toutes les 12 heures : une correction n'est visible qu'après l'exécution suivante.
  options:
    s2:
      en: |-
        If no relevant resource is assessed, the assigned standard doesn't appear on the dashboard.
      fr: |-
        Si aucune ressource pertinente n'est évaluée, la norme affectée n'apparaît pas dans le tableau de bord.
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
  - title: Assign regulatory compliance standards in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages
