id: sc500-4b-conn-statements
objective: "4.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. connects Azure services to Microsoft Sentinel. Some connectors are standalone diagnostic settings-based connectors, and others are managed by Azure Policy. Fabrikam also plans to enable the Microsoft Entra ID connector.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. connecte des services Azure à Microsoft Sentinel. Certains connecteurs sont des connecteurs autonomes basés sur les paramètres de diagnostic, et d'autres sont gérés par Azure Policy. Fabrikam prévoit aussi d'activer le connecteur Microsoft Entra ID.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An Azure Policy-managed connector shows as connected only if data was ingested during the past 14 days.
        fr: |
          Un connecteur géré par Azure Policy n'apparaît comme connecté que si des données ont été ingérées au cours des 14 derniers jours.
    - id: s2
      text:
        en: |
          To configure a standalone diagnostic settings-based connector, you need the Owner role on the subscription of the resource.
        fr: |
          Pour configurer un connecteur autonome basé sur les paramètres de diagnostic, vous avez besoin du rôle Owner sur l'abonnement de la ressource.
    - id: s3
      text:
        en: |
          Streaming the risky service principals logs of the Microsoft Entra ID connector requires Microsoft Entra Workload ID Premium.
        fr: |
          La diffusion des journaux des principaux de service à risque du connecteur Microsoft Entra ID exige Microsoft Entra Workload ID Premium.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The status of a policy-managed connector is green only when data arrived in the past 14 days, and turns to disconnected after 14 days without ingestion. A standalone connector requires read and write permissions on the workspace; Owner at the assignment scope is needed only to assign the log streaming policy of a policy-managed connector. AADRiskyServicePrincipals and AADServicePrincipalRiskEvents require Workload ID Premium.
    fr: |
      L'état d'un connecteur géré par une stratégie n'est vert que si des données sont arrivées au cours des 14 derniers jours, et passe à déconnecté après 14 jours sans ingestion. Un connecteur autonome exige des autorisations de lecture et d'écriture sur l'espace de travail ; Owner sur l'étendue de l'attribution n'est nécessaire que pour attribuer la stratégie de diffusion des journaux d'un connecteur géré par une stratégie. AADRiskyServicePrincipals et AADServicePrincipalRiskEvents exigent Workload ID Premium.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
  - title: Send data to Microsoft Sentinel using the Microsoft Entra ID data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-azure-active-directory
