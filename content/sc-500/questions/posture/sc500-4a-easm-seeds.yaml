id: sc500-4a-easm-seeds
objective: "4.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has deployed a Microsoft Defender External Attack Surface Management (Defender EASM) resource. You prepare a discovery that must find the internet-facing infrastructure of the company.

    Which two items can you use as discovery seeds?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys a déployé une ressource Microsoft Defender External Attack Surface Management (Defender EASM). Vous préparez une découverte qui doit trouver l'infrastructure exposée à Internet de l'entreprise.

    Quels sont les deux éléments que vous pouvez utiliser comme seeds de découverte ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Microsoft Entra tenant ID of the company", fr: "L'ID de locataire Microsoft Entra de l'entreprise" } }
    - { id: b, text: { en: "The domain wingtiptoys.com", fr: "Le domaine wingtiptoys.com" } }
    - { id: c, text: { en: "The ID of an Azure subscription of the company", fr: "L'ID d'un abonnement Azure de l'entreprise" } }
    - { id: d, text: { en: "The autonomous system number (ASN) of the company", fr: "Le numéro de système autonome (ASN) de l'entreprise" } }
    - { id: e, text: { en: "The name of an Azure resource group of the company", fr: "Le nom d'un groupe de ressources Azure de l'entreprise" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Defender EASM discovery starts from known legitimate internet assets, the discovery seeds, such as domains, IP address blocks, hosts, email contacts, autonomous system numbers and Whois organizations. It then infers the related infrastructure from these seeds.
    fr: |-
      La découverte de Defender EASM part de ressources Internet légitimes connues, les seeds de découverte, comme des domaines, des blocs d'adresses IP, des hôtes, des contacts e-mail, des numéros de système autonome et des organisations Whois. Elle en déduit ensuite l'infrastructure associée.
  options:
    a:
      en: |-
        A tenant ID identifies a Microsoft Entra directory; it isn't an internet infrastructure asset that discovery can start from.
      fr: |-
        Un ID de locataire identifie un annuaire Microsoft Entra ; ce n'est pas une ressource d'infrastructure Internet dont la découverte peut partir.
    c:
      en: |-
        Defender EASM works from the outside, like an attacker; Azure subscription IDs aren't discovery seeds.
      fr: |-
        Defender EASM travaille depuis l'extérieur, comme un attaquant ; les ID d'abonnement Azure ne sont pas des seeds de découverte.
    e:
      en: |-
        Resource group names are Azure management constructs, not internet-facing assets.
      fr: |-
        Les noms de groupes de ressources sont des éléments de gestion Azure, pas des ressources exposées à Internet.
references:
  - title: What is discovery?
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/what-is-discovery
