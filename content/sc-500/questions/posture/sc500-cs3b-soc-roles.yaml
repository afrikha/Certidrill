id: sc500-cs3b-soc-roles
objective: "4.2.2"
type: dragdrop
caseStudy: sc500-cs3b-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |
    You need to assign roles on rg-soc to meet the requirements of the SOC.

    Which role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles sur rg-soc pour satisfaire les exigences du SOC.

    Quel rôle devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reader, text: Microsoft Sentinel Reader }
    - { id: responder, text: Microsoft Sentinel Responder }
    - { id: contrib, text: Microsoft Sentinel Contributor }
    - { id: operator, text: Microsoft Sentinel Playbook Operator }
    - { id: automation, text: Microsoft Sentinel Automation Contributor }
    - { id: logic, text: Logic App Contributor }
  targets:
    - { id: auditors, text: { en: "Auditors", fr: "Auditeurs" } }
    - { id: engineers, text: { en: "Detection engineers", fr: "Ingénieurs de détection" } }
    - { id: developers, text: { en: "Automation developers", fr: "Développeurs d'automatisation" } }
    - { id: leads, text: { en: "Shift leads", fr: "Chefs d'équipe" } }
answer:
  mapping: { auditors: reader, engineers: contrib, developers: logic, leads: operator }
explanation:
  correct:
    en: |-
      Microsoft Sentinel Reader views data, incidents and workbooks without changes. Microsoft Sentinel Contributor adds the installation and update of solutions and the creation of resources such as analytics rules. Creating and editing playbooks requires Logic App Contributor, and Microsoft Sentinel Playbook Operator lists, views and manually runs playbooks.
    fr: |-
      Microsoft Sentinel Reader consulte les données, les incidents et les classeurs sans rien modifier. Microsoft Sentinel Contributor ajoute l'installation et la mise à jour des solutions ainsi que la création de ressources comme les règles d'analyse. Créer et modifier des playbooks demande Logic App Contributor, et Microsoft Sentinel Playbook Operator liste, consulte et exécute manuellement les playbooks.
  options:
    responder:
      en: |-
        Microsoft Sentinel Responder manages incidents but cannot install solutions or create analytics rules, and it gives more than the auditors need.
      fr: |-
        Microsoft Sentinel Responder gère les incidents mais ne peut ni installer de solutions ni créer de règles d'analyse, et il donne plus que ce dont les auditeurs ont besoin.
    automation:
      en: |-
        Microsoft Sentinel Automation Contributor lets Microsoft Sentinel itself add playbooks to automation rules; it is not used for user accounts.
      fr: |-
        Microsoft Sentinel Automation Contributor permet à Microsoft Sentinel lui-même d'ajouter des playbooks aux règles d'automatisation ; il n'est pas utilisé pour des comptes d'utilisateur.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
