id: sc500-4a-cspm-foundational
objective: "4.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure subscription named **Sub1**. Microsoft Defender for Cloud is enabled on Sub1 with foundational CSPM only. No paid plan is enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un abonnement Azure nommé **Sub1**. Microsoft Defender for Cloud est activé sur Sub1 avec uniquement le CSPM de base (foundational CSPM). Aucun plan payant n'est activé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          The security team can use attack path analysis to find exploitable paths to the resources of Sub1.
        fr: |-
          L'équipe de sécurité peut utiliser l'analyse du chemin d'attaque pour trouver les chemins exploitables vers les ressources de Sub1.
    - id: s2
      text:
        en: |-
          To assign owners and due dates to recommendations at scale with governance rules, Defender CSPM must be enabled on Sub1.
        fr: |-
          Pour attribuer à grande échelle des propriétaires et des dates d'échéance aux recommandations avec des règles de gouvernance, Defender CSPM doit être activé sur Sub1.
    - id: s3
      text:
        en: |-
          To trigger a logic app when a recommendation changes state, Defender CSPM must be enabled on Sub1.
        fr: |-
          Pour déclencher une application logique lorsqu'une recommandation change d'état, Defender CSPM doit être activé sur Sub1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      Foundational CSPM is free and includes asset inventory, secure score, security recommendations, the Microsoft cloud security benchmark, remediation tools and workflow automation. Attack path analysis and governance to drive remediation at scale are features of the paid Defender CSPM plan.
    fr: |-
      Le CSPM de base est gratuit et inclut l'inventaire des ressources, le degré de sécurisation, les recommandations de sécurité, le Microsoft cloud security benchmark, les outils de correction et l'automatisation du workflow. L'analyse du chemin d'attaque et la gouvernance pour piloter la correction à grande échelle sont des fonctionnalités du plan payant Defender CSPM.
  options:
    s1:
      en: |-
        Attack path analysis is listed only for Defender CSPM.
      fr: |-
        L'analyse du chemin d'attaque n'est proposée qu'avec Defender CSPM.
    s3:
      en: |-
        Workflow automation is included in foundational CSPM.
      fr: |-
        L'automatisation du workflow est incluse dans le CSPM de base.
references:
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
