id: sc500-4a-cspm-path-removal
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses the Defender CSPM plan. Attack path analysis shows a path from an internet-exposed virtual machine named **VM-Web1** to a storage account that contains customer data.

    Three hours ago, you applied every recommendation listed under **Remediation** for the path. The path is still listed on the **Attack path analysis** page.

    You need the path to be removed from the list. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Tailspin Toys utilise le plan Defender CSPM. L'analyse du chemin d'attaque montre un chemin depuis une machine virtuelle exposée à Internet nommée **VM-Web1** vers un compte de stockage qui contient des données clients.

    Il y a trois heures, vous avez appliqué toutes les recommandations listées sous **Remediation** pour ce chemin. Le chemin figure toujours sur la page **Attack path analysis**.

    Vous devez faire en sorte que le chemin disparaisse de la liste. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Wait, because a resolved attack path can take up to 24 hours to be removed.", fr: "Attendre, car un chemin d'attaque résolu peut mettre jusqu'à 24 heures à disparaître." } }
    - { id: b, text: { en: "Create an exemption for each recommendation of the path on VM-Web1.", fr: "Créer une exemption pour chaque recommandation du chemin sur VM-Web1." } }
    - { id: c, text: { en: "Turn the Defender CSPM plan off and on again to force a new assessment.", fr: "Désactiver puis réactiver le plan Defender CSPM pour forcer une nouvelle évaluation." } }
    - { id: d, text: { en: "Apply the recommendations listed under Additional recommendations for the path.", fr: "Appliquer les recommandations listées sous Additional recommendations pour le chemin." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      After you resolve an attack path, it can take up to 24 hours for Defender for Cloud to remove it from the list. Because all the recommendations that fix the path were applied, no further action is needed.
    fr: |-
      Après la résolution d'un chemin d'attaque, Defender for Cloud peut mettre jusqu'à 24 heures pour le retirer de la liste. Toutes les recommandations qui corrigent le chemin ayant été appliquées, aucune autre action n'est nécessaire.
  options:
    b:
      en: |-
        An exemption hides a recommendation without fixing the risk, and it adds work; the path is already fixed.
      fr: |-
        Une exemption masque une recommandation sans corriger le risque, et elle ajoute du travail ; le chemin est déjà corrigé.
    c:
      en: |-
        Turning the plan off removes its protection and does not make the removal faster.
      fr: |-
        Désactiver le plan supprime sa protection et n'accélère pas le retrait du chemin.
    d:
      en: |-
        Additional recommendations lower the risk but do not fix the path; they are not needed for the path to disappear.
      fr: |-
        Les recommandations supplémentaires réduisent le risque mais ne corrigent pas le chemin ; elles ne sont pas nécessaires pour que le chemin disparaisse.
references:
  - title: Identify and remediate attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path
