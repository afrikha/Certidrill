id: sc500-4c-copilot-scu-billing
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Security Copilot workspace named **SOC-WS**. Its capacity has **3 provisioned SCUs** and overage enabled with a maximum of **5 overage SCUs**.

    During two consecutive full billing hours, the workspace consumes the following:

    | Hour | Consumption |
    | --- | --- |
    | 10:00–11:00 | 4.3 SCUs |
    | 11:00–12:00 | 0.4 SCUs |

    What is billed for these two hours?
  fr: |
    Fabrikam dispose d'un espace de travail Microsoft Security Copilot nommé **SOC-WS**. Sa capacité comporte **3 SCU provisionnées** et le dépassement est activé avec un maximum de **5 SCU de dépassement**.

    Pendant deux heures de facturation complètes consécutives, l'espace de travail consomme ce qui suit :

    | Heure | Consommation |
    | --- | --- |
    | 10:00–11:00 | 4,3 SCU |
    | 11:00–12:00 | 0,4 SCU |

    Qu'est-ce qui est facturé pour ces deux heures ?
body:
  options:
    - { id: a, text: { en: "4.7 SCUs in total, at the provisioned rate", fr: "4,7 SCU au total, au tarif provisionné" } }
    - { id: b, text: { en: "3.4 provisioned SCUs and 1.3 overage SCUs", fr: "3,4 SCU provisionnées et 1,3 SCU de dépassement" } }
    - { id: c, text: { en: "6 provisioned SCUs and 2 overage SCUs", fr: "6 SCU provisionnées et 2 SCU de dépassement" } }
    - { id: d, text: { en: "6 provisioned SCUs and 1.3 overage SCUs", fr: "6 SCU provisionnées et 1,3 SCU de dépassement" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Provisioned SCUs are billed every hour whether they are used or not, and unused SCUs expire at the end of the hour: 3 SCUs × 2 hours = 6 provisioned SCUs. Overage SCUs are consumed only after the provisioned SCUs run out and are billed for the exact use, to one decimal: 4.3 − 3 = 1.3 in the first hour, none in the second.
    fr: |
      Les SCU provisionnées sont facturées chaque heure, qu'elles soient utilisées ou non, et les SCU non utilisées expirent à la fin de l'heure : 3 SCU × 2 heures = 6 SCU provisionnées. Les SCU de dépassement ne sont consommées qu'une fois les SCU provisionnées épuisées et sont facturées à l'usage exact, à une décimale près : 4,3 − 3 = 1,3 la première heure, aucune la deuxième.
  options:
    a: { en: "Provisioned capacity is billed per hour regardless of consumption; only overage is billed by actual use.", fr: "La capacité provisionnée est facturée à l'heure quelle que soit la consommation ; seul le dépassement est facturé à l'usage réel." }
    b: { en: "The second hour is billed for its 3 provisioned SCUs, not only for the 0.4 SCUs consumed.", fr: "La deuxième heure est facturée pour ses 3 SCU provisionnées, pas seulement pour les 0,4 SCU consommées." }
    c: { en: "Overage isn't rounded up to whole SCUs; it is billed to one decimal.", fr: "Le dépassement n'est pas arrondi à des SCU entières ; il est facturé à une décimale près." }
references:
  - title: Microsoft Security Copilot Security Compute Units and capacity
    url: https://learn.microsoft.com/en-us/copilot/security/security-compute-units-capacity
