id: sc500-4b-hub-install-role
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. uses Microsoft Sentinel on a workspace in a resource group named RG-SIEM. A security engineer named Engineer1 must install and update solutions from the content hub. Engineer1 currently has no role on RG-SIEM.

    You need to assign a role to Engineer1. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Proseware, Inc. utilise Microsoft Sentinel sur un espace de travail situé dans un groupe de ressources nommé RG-SIEM. Un ingénieur de sécurité nommé Engineer1 doit installer et mettre à jour des solutions du hub de contenu. Engineer1 n'a actuellement aucun rôle sur RG-SIEM.

    Vous devez attribuer un rôle à Engineer1. La solution doit respecter le principe du privilège minimum.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: { en: "Microsoft Sentinel Responder on RG-SIEM", fr: "Microsoft Sentinel Responder sur RG-SIEM" } }
    - { id: b, text: { en: "Microsoft Sentinel Automation Contributor on RG-SIEM", fr: "Microsoft Sentinel Automation Contributor sur RG-SIEM" } }
    - { id: c, text: { en: "Contributor on the subscription that contains RG-SIEM", fr: "Contributor sur l'abonnement qui contient RG-SIEM" } }
    - { id: d, text: { en: "Microsoft Sentinel Contributor on RG-SIEM", fr: "Microsoft Sentinel Contributor sur RG-SIEM" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Installing, updating or deleting solutions and standalone content in the content hub requires the Microsoft Sentinel Contributor role at the resource group level. It's the least privileged built-in role that includes managing the content hub.
    fr: |
      Installer, mettre à jour ou supprimer des solutions et du contenu autonome dans le hub de contenu exige le rôle Microsoft Sentinel Contributor au niveau du groupe de ressources. C'est le rôle intégré le moins privilégié qui inclut la gestion du hub de contenu.
  options:
    a:
      en: |
        Responder manages incidents but can't manage content hub items.
      fr: |
        Responder gère les incidents mais ne peut pas gérer les éléments du hub de contenu.
    b:
      en: |
        Automation Contributor lets the Microsoft Sentinel service account add playbooks to automation rules; it isn't for user accounts.
      fr: |
        Automation Contributor permet au compte de service Microsoft Sentinel d'ajouter des playbooks aux règles d'automatisation ; il n'est pas destiné aux comptes d'utilisateurs.
    c:
      en: |
        Contributor on the subscription would work but grants write access to every resource of the subscription, far more than needed.
      fr: |
        Contributor sur l'abonnement fonctionnerait mais donne l'accès en écriture à toutes les ressources de l'abonnement, bien plus que nécessaire.
references:
  - title: Discover and manage Microsoft Sentinel out-of-the-box content
    url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions-deploy
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
