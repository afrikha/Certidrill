id: sc500-4a-sen-facts
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is a new Microsoft Sentinel customer. The bank will first enable Microsoft Sentinel on a Log Analytics workspace named **law-eu** in a resource group named **RG-SecOps**, and later on a second workspace named **law-us**. The administrator who enables Sentinel is the Owner of the subscription.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank est un nouveau client de Microsoft Sentinel. La banque activera d'abord Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-eu** dans un groupe de ressources nommé **RG-SecOps**, puis sur un second espace de travail nommé **law-us**. L'administrateur qui active Sentinel est Owner de l'abonnement.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The data of law-eu and law-us stays isolated in each workspace.", fr: "Les données de law-eu et de law-us restent isolées dans chaque espace de travail." } }
    - { id: b, text: { en: "After deployment, law-eu can be moved to another resource group of the subscription.", fr: "Après le déploiement, law-eu peut être déplacé vers un autre groupe de ressources de l'abonnement." } }
    - { id: c, text: { en: "law-eu is onboarded to the Microsoft Defender portal automatically.", fr: "law-eu est intégré automatiquement au portail Microsoft Defender." } }
    - { id: d, text: { en: "A CanNotDelete lock can be applied to law-us before Sentinel is enabled.", fr: "Un verrou CanNotDelete peut être appliqué à law-us avant l'activation de Sentinel." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      You can run Microsoft Sentinel on more than one workspace, but data is isolated to a single workspace. A new Microsoft Sentinel customer who has the Owner or User Access Administrator permissions on the subscription has the workspace onboarded to the Defender portal automatically, and users then use Sentinel in the Defender portal only.
    fr: |-
      Vous pouvez exécuter Microsoft Sentinel sur plusieurs espaces de travail, mais les données restent isolées dans un seul espace de travail. Pour un nouveau client Microsoft Sentinel qui dispose des autorisations Owner ou User Access Administrator sur l'abonnement, l'espace de travail est intégré automatiquement au portail Defender, et les utilisateurs utilisent ensuite Sentinel uniquement dans le portail Defender.
  options:
    b:
      en: |-
        Once Microsoft Sentinel is deployed on a workspace, moving that workspace to another resource group or subscription isn't supported.
      fr: |-
        Une fois Microsoft Sentinel déployé sur un espace de travail, le déplacement de cet espace vers un autre groupe de ressources ou abonnement n'est pas pris en charge.
    d:
      en: |-
        Resource locks aren't supported when you enable Microsoft Sentinel on a workspace.
      fr: |-
        Les verrous de ressource ne sont pas pris en charge lors de l'activation de Microsoft Sentinel sur un espace de travail.
references:
  - title: Onboard Microsoft Sentinel to a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/sentinel/quickstart-onboard
  - title: Prerequisites to deploy Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/prerequisites
