id: sc500-cs3b-aws-connector
objective: "4.1.4"
type: single
caseStudy: sc500-cs3b-alpine-ski-house
difficulty: 3
status: draft
stem:
  en: |-
    You need to meet the requirement for the AWS accounts. What should you do?
  fr: |-
    Vous devez satisfaire l'exigence relative aux comptes AWS. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create one connector of the Single account type for each AWS account, and deploy the generated CloudFormation template in each account.", fr: "Créer un connecteur de type Single account pour chaque compte AWS, et déployer le modèle CloudFormation généré dans chaque compte." } }
    - { id: b, text: { en: "Create a connector of the Management account type for the delegated administrator account, and deploy the generated CloudFormation template in that account.", fr: "Créer un connecteur de type Management account pour le compte d'administrateur délégué, et déployer le modèle CloudFormation généré dans ce compte." } }
    - { id: c, text: { en: "Create a connector of the Management account type for the AWS management account, and deploy the generated CloudFormation template in that account.", fr: "Créer un connecteur de type Management account pour le compte de gestion AWS, et déployer le modèle CloudFormation généré dans ce compte." } }
    - { id: d, text: { en: "Install the Azure Connected Machine agent on every EC2 instance, and onboard the instances to Azure Arc in Sub-Ops.", fr: "Installer l'agent Azure Connected Machine sur chaque instance EC2, et intégrer les instances à Azure Arc dans Sub-Ops." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A connector of the Management account type created for the AWS management account automatically creates connectors for the member accounts it discovers and for the accounts created later. The CloudFormation template, including its StackSet for the member accounts, is deployed from the management account.
    fr: |-
      Un connecteur de type Management account créé pour le compte de gestion AWS crée automatiquement des connecteurs pour les comptes membres découverts et pour les comptes créés ensuite. Le modèle CloudFormation, y compris son StackSet pour les comptes membres, est déployé depuis le compte de gestion.
  options:
    a:
      en: |-
        Single account connectors work, but every new resort account would need a new connector, which does not minimize administrative effort.
      fr: |-
        Des connecteurs Single account fonctionnent, mais chaque nouveau compte de station demanderait un nouveau connecteur, ce qui ne réduit pas l'effort d'administration.
    b:
      en: |-
        Management account onboarding must use the AWS management account; delegated administrator accounts are not supported.
      fr: |-
        L'intégration Management account doit utiliser le compte de gestion AWS ; les comptes d'administrateur délégué ne sont pas pris en charge.
    d:
      en: |-
        Azure Arc onboards individual servers only; it does not connect the AWS accounts, their other resources or future accounts to Defender for Cloud.
      fr: |-
        Azure Arc n'intègre que des serveurs individuels ; il ne connecte à Defender for Cloud ni les comptes AWS, ni leurs autres ressources, ni les comptes futurs.
references:
  - title: Connect your AWS Account
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
