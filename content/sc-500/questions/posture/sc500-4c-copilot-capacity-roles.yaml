id: sc500-4c-copilot-capacity-roles
objective: "4.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to provision a Microsoft Security Copilot capacity in an Azure resource group named **rg-copilot** and attach it to a new workspace.

    You need to identify the permissions required by the administrator who provisions the capacity. The solution must follow the principle of least privilege.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de provisionner une capacité Microsoft Security Copilot dans un groupe de ressources Azure nommé **rg-copilot** et de l'associer à un nouvel espace de travail.

    Vous devez identifier les autorisations nécessaires à l'administrateur qui provisionne la capacité. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter la phrase ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The administrator needs the [[az]] Azure role on rg-copilot and the [[entra]] Microsoft Entra role in the tenant.
    fr: |
      L'administrateur a besoin du rôle Azure [[az]] sur rg-copilot et du rôle Microsoft Entra [[entra]] dans le locataire.
  slots:
    - id: az
      options:
        - { id: reader, text: Reader }
        - { id: contrib, text: Contributor }
        - { id: uaa, text: User Access Administrator }
        - { id: secadmaz, text: Security Admin }
    - id: entra
      options:
        - { id: secreader, text: Security Reader }
        - { id: secop, text: Security Operator }
        - { id: secadm, text: Security Administrator }
        - { id: billing, text: Billing Reader }
answer:
  values: { az: contrib, entra: secadm }
explanation:
  correct:
    en: |
      Provisioning capacity requires Contributor or Owner on the subscription or resource group, because the capacity is an Azure resource, and Security Administrator or higher in the tenant to attach it to Security Copilot. Contributor is the least-privileged of the two Azure roles.
    fr: |
      Provisionner une capacité exige Contributor ou Owner sur l'abonnement ou le groupe de ressources, car la capacité est une ressource Azure, et Security Administrator ou plus dans le locataire pour l'associer à Security Copilot. Contributor est le moins privilégié des deux rôles Azure.
  options:
    reader: { en: "Reader can't create resources.", fr: "Reader ne peut pas créer de ressources." }
    uaa: { en: "User Access Administrator manages role assignments, not resources.", fr: "User Access Administrator gère les attributions de rôles, pas les ressources." }
    secadmaz: { en: "Security Admin is a Defender for Cloud role; it can't create a capacity resource.", fr: "Security Admin est un rôle Defender for Cloud ; il ne peut pas créer de ressource de capacité." }
    secreader: { en: "Security Reader is read-only and is below the Security Administrator requirement.", fr: "Security Reader est en lecture seule et inférieur au Security Administrator exigé." }
    secop: { en: "Security Operator doesn't meet the Security Administrator or higher requirement.", fr: "Security Operator ne satisfait pas l'exigence Security Administrator ou plus." }
    billing: { en: "Billing Reader only reads billing information.", fr: "Billing Reader ne fait que lire les informations de facturation." }
references:
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
