id: sc500-4c-copilot-role-facts
objective: "4.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Microsoft Security Copilot. The default owner role settings are unchanged, and the Copilot contributor role is currently assigned to the **Everyone** group. You review the role configuration before you change it.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Microsoft Security Copilot. Les paramètres par défaut du rôle de propriétaire n'ont pas été modifiés, et le rôle Copilot contributor est actuellement attribué au groupe **Everyone**. Vous examinez la configuration des rôles avant de la modifier.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who holds the Security Administrator role in Microsoft Entra ID has Copilot owner access without an explicit Security Copilot role assignment.
        fr: |
          Un utilisateur qui détient le rôle Security Administrator dans Microsoft Entra ID dispose de l'accès Copilot owner sans attribution explicite de rôle Security Copilot.
    - id: s2
      text:
        en: |
          Adding a user to the Copilot owner role gives the user read access to Microsoft Defender XDR incidents.
        fr: |
          Ajouter un utilisateur au rôle Copilot owner lui donne un accès en lecture aux incidents Microsoft Defender XDR.
    - id: s3
      text:
        en: |
          If you remove the Everyone group from the Copilot contributor role, you can assign the role to the Everyone group again later.
        fr: |
          Si vous retirez le groupe Everyone du rôle Copilot contributor, vous pourrez de nouveau attribuer ce rôle au groupe Everyone plus tard.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Members of privileged Microsoft Entra roles such as Global Administrator and Security Administrator inherit Copilot owner access by default. The Copilot roles control the platform only and grant no access to security data; Defender data still requires the user's own Defender permissions. Once the Everyone group is removed, it can't be reassigned.
    fr: |
      Les membres de rôles Microsoft Entra privilégiés comme Global Administrator et Security Administrator héritent par défaut de l'accès Copilot owner. Les rôles Copilot ne contrôlent que la plateforme et ne donnent aucun accès aux données de sécurité ; les données Defender exigent toujours les autorisations Defender de l'utilisateur. Une fois le groupe Everyone retiré, il ne peut plus être réattribué.
references:
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
