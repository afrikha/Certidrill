id: sc500-4b-hub-pipeline
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has three Microsoft Sentinel workspaces: law-dev, law-test and law-prod. The security team installs content hub solutions manually in law-dev.

    You need to deploy the same solutions to law-test and law-prod from an Azure DevOps pipeline that runs ARM template deployments.

    Which two methods can you use to obtain a deployable template of a solution? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose de trois espaces de travail Microsoft Sentinel : law-dev, law-test et law-prod. L'équipe de sécurité installe manuellement les solutions du hub de contenu dans law-dev.

    Vous devez déployer les mêmes solutions dans law-test et law-prod à partir d'un pipeline Azure DevOps qui exécute des déploiements de modèles ARM.

    Quelles sont les deux méthodes qui permettent d'obtenir un modèle déployable d'une solution ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On the Review + create tab of the solution, select Download a template for automation.", fr: "Dans l'onglet Review + create de la solution, sélectionner Download a template for automation." } }
    - { id: b, text: { en: "In the content hub list view, select the solutions and select Install with dependencies.", fr: "Dans la vue liste du hub de contenu, sélectionner les solutions puis Install with dependencies." } }
    - { id: c, text: { en: "Call the Get Product Package API and read the properties.mainTemplate value of the response.", fr: "Appeler l'API Get Product Package et lire la valeur properties.mainTemplate de la réponse." } }
    - { id: d, text: { en: "On the solution details page, select Manage and export the content items to a CSV file.", fr: "Dans la page de détails de la solution, sélectionner Manage et exporter les éléments de contenu dans un fichier CSV." } }
    - { id: e, text: { en: "Export the analytics rules of law-dev to an ARM template from the Analytics page.", fr: "Exporter les règles analytiques de law-dev vers un modèle ARM depuis la page Analytics." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      When you install a solution in the portal, the Review + create tab offers Download a template for automation, which saves the deployment as an ARM template. You can also retrieve the package with the Get Product Package API: its properties.mainTemplate contains the ARM template JSON, which you deploy with the REST API, Azure CLI or PowerShell.
    fr: |
      Lorsque vous installez une solution dans le portail, l'onglet Review + create propose Download a template for automation, qui enregistre le déploiement sous forme de modèle ARM. Vous pouvez aussi récupérer le package avec l'API Get Product Package : sa propriété properties.mainTemplate contient le JSON du modèle ARM, que vous déployez avec l'API REST, Azure CLI ou PowerShell.
  options:
    b:
      en: |
        Install with dependencies installs the solution and its dependencies in the current workspace; it doesn't produce a template.
      fr: |
        Install with dependencies installe la solution et ses dépendances dans l'espace de travail actuel ; il ne produit aucun modèle.
    d:
      en: |
        Manage lists the content items of the solution to configure or delete them; a CSV list isn't a deployable template.
      fr: |
        Manage liste les éléments de contenu de la solution pour les configurer ou les supprimer ; une liste CSV n'est pas un modèle déployable.
    e:
      en: |
        Exporting rules only copies active analytics rules, not the solution with its connectors, workbooks and other content.
      fr: |
        L'exportation des règles ne copie que les règles analytiques actives, pas la solution avec ses connecteurs, classeurs et autres contenus.
references:
  - title: Discover and manage Microsoft Sentinel out-of-the-box content
    url: https://learn.microsoft.com/en-us/azure/sentinel/sentinel-solutions-deploy
