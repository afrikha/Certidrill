id: sc500-4a-mc-aws-update
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware connected an AWS account named **aws-retail** to Microsoft Defender for Cloud six months ago by using a Single account connector with the Defender CSPM plan and AWS CloudFormation.

    Today, you edited the connector, turned on the Defender for Containers plan and saved the change. The Amazon EKS clusters of aws-retail meet the plan prerequisites. Two days later, Defender for Cloud still shows no Defender for Containers data for the clusters, and the **Connectivity status** of the connector reports missing permissions.

    You need to resolve the issue. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Il y a six mois, Litware a connecté un compte AWS nommé **aws-retail** à Microsoft Defender for Cloud avec un connecteur Single account, le plan Defender CSPM et AWS CloudFormation.

    Aujourd'hui, vous avez modifié le connecteur, activé le plan Defender for Containers et enregistré la modification. Les clusters Amazon EKS d'aws-retail respectent les prérequis du plan. Deux jours plus tard, Defender for Cloud n'affiche toujours aucune donnée Defender for Containers pour les clusters, et le **Connectivity status** du connecteur signale des autorisations manquantes.

    Vous devez résoudre le problème. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the scan interval of the connector from 24 hours to 4 hours.", fr: "Faire passer l'intervalle d'analyse du connecteur de 24 heures à 4 heures." } }
    - { id: b, text: { en: "Delete the connector, then create a new Management account connector for aws-retail.", fr: "Supprimer le connecteur, puis créer un nouveau connecteur Management account pour aws-retail." } }
    - { id: c, text: { en: "Change the permissions type of the connector to Least privilege access.", fr: "Faire passer le type d'autorisations du connecteur à Least privilege access." } }
    - { id: d, text: { en: "Update the existing CloudFormation stack with the latest template generated by the connector.", fr: "Mettre à jour la pile CloudFormation existante avec le dernier modèle généré par le connecteur." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When you enable a new plan on an existing AWS connector, you must update the CloudFormation template so that AWS gets the resources and IAM permissions that the plan needs. You generate the latest template from Defender for Cloud and update the existing stack in AWS, keeping its parameters.
    fr: |-
      Lorsque vous activez un nouveau plan sur un connecteur AWS existant, vous devez mettre à jour le modèle CloudFormation pour que AWS dispose des ressources et des autorisations IAM nécessaires au plan. Vous générez le dernier modèle depuis Defender for Cloud et mettez à jour la pile existante dans AWS en conservant ses paramètres.
  options:
    a:
      en: |-
        The scan interval sets how often data is collected; it doesn't grant the missing permissions.
      fr: |-
        L'intervalle d'analyse définit la fréquence de collecte ; il n'accorde pas les autorisations manquantes.
    b:
      en: |-
        Recreating the connector adds work, and aws-retail is a single account, not the management account of an organization.
      fr: |-
        Recréer le connecteur ajoute du travail, et aws-retail est un compte unique, pas le compte de gestion d'une organisation.
    c:
      en: |-
        Least privilege access grants fewer permissions; the template still has to be deployed in AWS to apply any permission change.
      fr: |-
        Least privilege access accorde moins d'autorisations ; le modèle doit de toute façon être déployé dans AWS pour appliquer un changement d'autorisations.
references:
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
