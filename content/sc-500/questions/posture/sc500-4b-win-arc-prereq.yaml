id: sc500-4b-win-arc-prereq
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has 120 Windows servers hosted in a third-party cloud provider. You plan to collect their Security event log in Microsoft Sentinel by using the Windows Security Events via AMA connector. The Windows Security Events solution is already installed from the content hub.

    What should you do first on the servers?
  fr: |
    Proseware, Inc. dispose de 120 serveurs Windows hébergés chez un fournisseur cloud tiers. Vous prévoyez de collecter leur journal de sécurité dans Microsoft Sentinel à l'aide du connecteur Windows Security Events via AMA. La solution Windows Security Events est déjà installée depuis le hub de contenu.

    Que devez-vous faire en premier sur les serveurs ?
body:
  options:
    - { id: a, text: { en: "Install and enable Azure Arc.", fr: "Installer et activer Azure Arc." } }
    - { id: b, text: { en: "Configure a Windows Event Forwarding subscription.", fr: "Configurer un abonnement de transfert d'événements Windows." } }
    - { id: c, text: { en: "Install the Log Analytics agent.", fr: "Installer l'agent Log Analytics." } }
    - { id: d, text: { en: "Join the servers to Microsoft Entra ID.", fr: "Joindre les serveurs à Microsoft Entra ID." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The connector creates a data collection rule that targets Azure VMs or Azure Arc-enabled servers. Any machine that isn't an Azure VM, including servers in other clouds, must have Azure Arc installed and enabled before you enable the connector; the Azure Monitor Agent is then installed on the selected machines when the DCR is created.
    fr: |
      Le connecteur crée une règle de collecte de données qui cible des machines virtuelles Azure ou des serveurs avec Azure Arc. Toute machine qui n'est pas une machine virtuelle Azure, y compris les serveurs d'autres clouds, doit disposer d'Azure Arc installé et activé avant l'activation du connecteur ; l'agent Azure Monitor est ensuite installé sur les machines sélectionnées lors de la création de la DCR.
  options:
    b:
      en: |
        Windows Event Forwarding is used with the Windows Forwarded Events connector and a collector server, not with Windows Security Events via AMA.
      fr: |
        Le transfert d'événements Windows s'utilise avec le connecteur Windows Forwarded Events et un serveur collecteur, pas avec Windows Security Events via AMA.
    c:
      en: |
        The Log Analytics agent is retired; the connector uses the Azure Monitor Agent.
      fr: |
        L'agent Log Analytics est mis hors service ; le connecteur utilise l'agent Azure Monitor.
    d:
      en: |
        Microsoft Entra join doesn't make a server manageable by Azure Resource Manager; Azure Arc does.
      fr: |
        La jonction à Microsoft Entra ne rend pas un serveur gérable par Azure Resource Manager ; Azure Arc le fait.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
