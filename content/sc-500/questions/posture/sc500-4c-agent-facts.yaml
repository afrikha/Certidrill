id: sc500-4c-agent-facts
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Microsoft Security Copilot. Copilot owners and contributors have set up several Microsoft-built agents and one partner-built agent that reads Microsoft Sentinel data.

    Which two statements about these agents are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Microsoft Security Copilot. Des Copilot owners et contributors ont configuré plusieurs agents conçus par Microsoft et un agent conçu par un partenaire qui lit des données Microsoft Sentinel.

    Quelles sont les deux affirmations vraies sur ces agents ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Feedback given to an agent is stored in its memory, and an item can be removed with Reject feedback.", fr: "Les commentaires donnés à un agent sont stockés dans sa mémoire, et un élément peut être retiré avec Reject feedback." } }
    - { id: b, text: { en: "Setting up an agent turns on its required plugins for every user of the organization.", fr: "La configuration d'un agent active ses plug-ins requis pour tous les utilisateurs de l'organisation." } }
    - { id: c, text: { en: "Owners and contributors can change the identity of a configured agent by selecting Edit on its page.", fr: "Les owners et contributors peuvent changer l'identité d'un agent configuré en sélectionnant Edit sur sa page." } }
    - { id: d, text: { en: "The partner-built agent could be set up by a contributor without any administrator approval.", fr: "L'agent conçu par un partenaire a pu être configuré par un contributeur sans aucune approbation d'administrateur." } }
    - { id: e, text: { en: "An agent with an automatic trigger can be stopped temporarily only by deleting its identity.", fr: "Un agent à déclenchement automatique ne peut être arrêté temporairement qu'en supprimant son identité." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Feedback for an agent is kept in the agent's memory and influences its future runs; Manage memory > Reject feedback removes an item. Owners and contributors can select Edit on the agent page to update its identity or other parameters.
    fr: |
      Les commentaires destinés à un agent sont conservés dans sa mémoire et influencent ses exécutions futures ; Manage memory > Reject feedback retire un élément. Les owners et contributors peuvent sélectionner Edit sur la page de l'agent pour mettre à jour son identité ou d'autres paramètres.
  options:
    b: { en: "Required plugins are enabled for that agent only; the organization's plugin availability settings don't change.", fr: "Les plug-ins requis sont activés pour cet agent uniquement ; les paramètres de disponibilité des plug-ins de l'organisation ne changent pas." }
    d: { en: "A partner agent that accesses data from a Microsoft product such as Sentinel needs Global Administrator approval.", fr: "Un agent partenaire qui accède aux données d'un produit Microsoft comme Sentinel exige l'approbation d'un Global Administrator." }
    e: { en: "Pause stops an agent's operations temporarily without changing its identity.", fr: "Pause arrête temporairement le fonctionnement d'un agent sans changer son identité." }
references:
  - title: Setup and manage Security Copilot agents
    url: https://learn.microsoft.com/en-us/copilot/security/agents-manage
  - title: Manage plugins in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins
