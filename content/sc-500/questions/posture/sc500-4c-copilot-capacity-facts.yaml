id: sc500-4c-copilot-capacity-facts
objective: "4.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses Microsoft Security Copilot with two workspaces, **WS-SOC** and **WS-Lab**. WS-SOC is the default workspace, and no workspace is assigned to any product in **Workspaces for Microsoft Security Copilot agents**. A capacity named **Cap1** with 4 provisioned SCUs and no overage is associated with WS-SOC.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise Microsoft Security Copilot avec deux espaces de travail, **WS-SOC** et **WS-Lab**. WS-SOC est l'espace de travail par défaut, et aucun espace de travail n'est affecté à un produit dans **Workspaces for Microsoft Security Copilot agents**. Une capacité nommée **Cap1** avec 4 SCU provisionnées et sans dépassement est associée à WS-SOC.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When WS-SOC has consumed all 4 SCUs before the end of an hour, analysts can't submit prompts in WS-SOC until the next hour starts.
        fr: |
          Quand WS-SOC a consommé ses 4 SCU avant la fin d'une heure, les analystes ne peuvent plus soumettre d'invites dans WS-SOC avant le début de l'heure suivante.
    - id: s2
      text:
        en: |
          The provisioned SCUs that WS-SOC doesn't use during an hour are added to the next hour.
        fr: |
          Les SCU provisionnées que WS-SOC n'utilise pas pendant une heure sont ajoutées à l'heure suivante.
    - id: s3
      text:
        en: |
          Prompts that analysts run from Copilot in the Microsoft Defender portal consume the capacity of WS-SOC.
        fr: |
          Les invites que les analystes exécutent depuis Copilot dans le portail Microsoft Defender consomment la capacité de WS-SOC.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Without overage, Security Copilot requests stop once the provisioned SCUs are used up, and more capacity becomes available in the next hour. Provisioned SCUs refresh every billing hour and unused SCUs expire at the end of the hour. When no workspace is assigned to their product, the embedded experiences of Defender, Microsoft Entra, Purview and Intune use the default workspace, so they consume the capacity of WS-SOC.
    fr: |
      Sans dépassement, les requêtes Security Copilot s'arrêtent une fois les SCU provisionnées épuisées, et de la capacité redevient disponible l'heure suivante. Les SCU provisionnées sont renouvelées à chaque heure de facturation et les SCU non utilisées expirent à la fin de l'heure. Quand aucun espace de travail n'est affecté à leur produit, les expériences intégrées de Defender, Microsoft Entra, Purview et Intune utilisent l'espace de travail par défaut : elles consomment donc la capacité de WS-SOC.
references:
  - title: Microsoft Security Copilot Security Compute Units and capacity
    url: https://learn.microsoft.com/en-us/copilot/security/security-compute-units-capacity
  - title: Understand how Security Copilot is auto provisioned for eligible Microsoft 365 E5 and E7 customers
    url: https://learn.microsoft.com/en-us/copilot/security/auto-provisioning-security-copilot
