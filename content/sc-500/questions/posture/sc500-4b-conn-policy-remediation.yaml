id: sc500-4b-conn-policy-remediation
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a subscription named Sub-Apps that contains 60 existing Azure resources of the same type. You configure a Microsoft Sentinel data connector for that resource type. The connector is managed by Azure Policy.

    On the connector page, you select **Launch Azure Policy Assignment wizard**. On the Basics tab you select Sub-Apps as the scope, on the Parameters tab you select the Sentinel workspace, and then you select **Review + create** and **Create**.

    One week later, only the five resources created after the assignment send logs to the workspace.

    You need the 60 existing resources to send their logs too. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Adatum Corporation dispose d'un abonnement nommé Sub-Apps qui contient 60 ressources Azure existantes du même type. Vous configurez un connecteur de données Microsoft Sentinel pour ce type de ressource. Le connecteur est géré par Azure Policy.

    Dans la page du connecteur, vous sélectionnez **Launch Azure Policy Assignment wizard**. Dans l'onglet Basics, vous sélectionnez Sub-Apps comme étendue ; dans l'onglet Parameters, vous sélectionnez l'espace de travail Sentinel ; puis vous sélectionnez **Review + create** et **Create**.

    Une semaine plus tard, seules les cinq ressources créées après l'attribution envoient des journaux à l'espace de travail.

    Les 60 ressources existantes doivent aussi envoyer leurs journaux. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a remediation task for the policy assignment.", fr: "Créer une tâche de correction pour l'attribution de stratégie." } }
    - { id: b, text: { en: "Add a diagnostic setting manually to each existing resource.", fr: "Ajouter manuellement un paramètre de diagnostic à chaque ressource existante." } }
    - { id: c, text: { en: "Change the scope of the policy assignment to the management group of Sub-Apps.", fr: "Remplacer l'étendue de l'attribution de stratégie par le groupe d'administration de Sub-Apps." } }
    - { id: d, text: { en: "Wait 14 days for the connector to evaluate the existing resources.", fr: "Attendre 14 jours que le connecteur évalue les ressources existantes." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A policy-managed connector applies the diagnostic setting to resources created after the assignment. To configure resources that already exist, you must select Create a remediation task on the Remediation tab of the wizard, or create one afterwards for the assignment. One remediation task covers all 60 resources.
    fr: |
      Un connecteur géré par une stratégie applique le paramètre de diagnostic aux ressources créées après l'attribution. Pour configurer les ressources qui existent déjà, vous devez sélectionner Create a remediation task dans l'onglet Remediation de l'Assistant, ou en créer une ensuite pour l'attribution. Une seule tâche de correction couvre les 60 ressources.
  options:
    b:
      en: |
        Manual diagnostic settings work but require 60 separate configurations, which doesn't minimize effort.
      fr: |
        Des paramètres de diagnostic manuels fonctionnent, mais exigent 60 configurations distinctes, ce qui ne réduit pas l'effort au minimum.
    c:
      en: |
        A wider scope still applies only to new resources unless a remediation task runs.
      fr: |
        Une étendue plus large ne s'applique toujours qu'aux nouvelles ressources si aucune tâche de correction n'est exécutée.
    d:
      en: |
        Fourteen days is the period used for the connector status indicator; it doesn't configure any resource.
      fr: |
        Quatorze jours est la période utilisée par l'indicateur d'état du connecteur ; elle ne configure aucune ressource.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services by using diagnostic settings-based connections
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-diagnostic-setting-based
