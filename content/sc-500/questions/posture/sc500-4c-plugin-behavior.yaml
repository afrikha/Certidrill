id: sc500-4c-plugin-behavior
objective: "4.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses Microsoft Security Copilot and Microsoft Sentinel. Analysts are Copilot contributors. The Microsoft Sentinel plugin is available to all users, and a Copilot owner plans to set up a Microsoft agent that requires two plugins that are currently turned off.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise Microsoft Security Copilot et Microsoft Sentinel. Les analystes sont Copilot contributors. Le plug-in Microsoft Sentinel est disponible pour tous les utilisateurs, et un Copilot owner prévoit de configurer un agent Microsoft qui exige deux plug-ins actuellement désactivés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An analyst who has no role on the Sentinel workspace can retrieve Sentinel incidents through the Microsoft Sentinel plugin.
        fr: |
          Un analyste qui n'a aucun rôle sur l'espace de travail Sentinel peut récupérer des incidents Sentinel via le plug-in Microsoft Sentinel.
    - id: s2
      text:
        en: |
          When the owner sets up the agent, its two required plugins are turned on for the agent only, and the plugin availability settings of the organization stay unchanged.
        fr: |
          Quand le propriétaire configure l'agent, ses deux plug-ins requis sont activés pour l'agent uniquement, et les paramètres de disponibilité des plug-ins de l'organisation restent inchangés.
    - id: s3
      text:
        en: |
          When one analyst completes the setup of the Microsoft Sentinel plugin, the plugin is configured for every analyst.
        fr: |
          Quand un analyste termine la configuration du plug-in Microsoft Sentinel, le plug-in est configuré pour tous les analystes.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Plugins use on-behalf-of authentication, so the analyst also needs a Sentinel role such as Microsoft Sentinel Reader. Required plugins are enabled automatically for an agent, only for that agent, without changing the organization's availability settings. Plugins that show a gear icon or a Set up button, such as Microsoft Sentinel, are configured per user: each user completes the setup.
    fr: |
      Les plug-ins utilisent l'authentification pour le compte de (on-behalf-of) : l'analyste a aussi besoin d'un rôle Sentinel comme Microsoft Sentinel Reader. Les plug-ins requis sont activés automatiquement pour un agent, uniquement pour cet agent, sans modifier les paramètres de disponibilité de l'organisation. Les plug-ins qui affichent une icône d'engrenage ou un bouton Set up, comme Microsoft Sentinel, se configurent par utilisateur : chaque utilisateur effectue la configuration.
references:
  - title: Manage plugins in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
