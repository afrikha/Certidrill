id: sc500-4b-win-wef-rules
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has 40 on-premises Windows servers that are Azure Arc-enabled. The servers forward their Security events by using Windows Event Forwarding to a Windows Event Collector server named srv-wec1. srv-wec1 runs the Azure Monitor Agent and is configured with the Windows Forwarded Events connector of Microsoft Sentinel.

    The forwarded events appear in the workspace, but the analytics rules created from the Windows Security Events solution templates never generate alerts. The analytics rules must be used without modifying their queries. Installing an agent on the servers is allowed.

    What should you do?
  fr: |
    Northwind Traders dispose de 40 serveurs Windows locaux activés pour Azure Arc. Les serveurs transfèrent leurs événements de sécurité à l'aide du transfert d'événements Windows vers un serveur collecteur d'événements Windows nommé srv-wec1. srv-wec1 exécute l'agent Azure Monitor et est configuré avec le connecteur Windows Forwarded Events de Microsoft Sentinel.

    Les événements transférés apparaissent dans l'espace de travail, mais les règles analytiques créées à partir des modèles de la solution Windows Security Events ne génèrent jamais d'alerte. Les règles analytiques doivent être utilisées sans modifier leurs requêtes. L'installation d'un agent sur les serveurs est autorisée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy the ASIM Windows Event parsers to the workspace.", fr: "Déployer les analyseurs ASIM Windows Event dans l'espace de travail." } }
    - { id: b, text: { en: "Install the Log Analytics agent on srv-wec1 and connect it to the workspace.", fr: "Installer l'agent Log Analytics sur srv-wec1 et le connecter à l'espace de travail." } }
    - { id: c, text: { en: "Create a data collection rule from the Windows Security Events via AMA connector that targets the 40 servers.", fr: "Créer une règle de collecte de données à partir du connecteur Windows Security Events via AMA qui cible les 40 serveurs." } }
    - { id: d, text: { en: "Add the 40 servers to the data collection rule of the Windows Forwarded Events connector.", fr: "Ajouter les 40 serveurs à la règle de collecte de données du connecteur Windows Forwarded Events." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Windows Forwarded Events connector writes every forwarded event, including Security events, to the WindowsEvent table. Many built-in Windows Security Events rules query the SecurityEvent table, so they never match. To use these rules unmodified, collect the events with the Windows Security Events via AMA connector, which writes to SecurityEvent; the servers are already Azure Arc-enabled, so the DCR can target them directly.
    fr: |
      Le connecteur Windows Forwarded Events écrit tous les événements transférés, y compris les événements de sécurité, dans la table WindowsEvent. De nombreuses règles intégrées Windows Security Events interrogent la table SecurityEvent : elles ne trouvent donc jamais de correspondance. Pour utiliser ces règles sans les modifier, collectez les événements avec le connecteur Windows Security Events via AMA, qui écrit dans SecurityEvent ; les serveurs étant déjà activés pour Azure Arc, la DCR peut les cibler directement.
  options:
    a:
      en: |
        ASIM parsers normalize WindowsEvent data for rules that use ASIM; rules that query SecurityEvent directly would still need to be modified.
      fr: |
        Les analyseurs ASIM normalisent les données WindowsEvent pour les règles qui utilisent ASIM ; les règles qui interrogent directement SecurityEvent devraient quand même être modifiées.
    b:
      en: |
        The Log Analytics agent is retired; Microsoft Sentinel collects Windows events with the Azure Monitor Agent.
      fr: |
        L'agent Log Analytics est mis hors service ; Microsoft Sentinel collecte les événements Windows avec l'agent Azure Monitor.
    d:
      en: |
        The Windows Forwarded Events connector collects on the collector; its data would still land in WindowsEvent.
      fr: |
        Le connecteur Windows Forwarded Events collecte sur le collecteur ; ses données arriveraient toujours dans WindowsEvent.
references:
  - title: Connect Microsoft Sentinel to other Microsoft services with a Windows agent-based data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-services-windows-based
