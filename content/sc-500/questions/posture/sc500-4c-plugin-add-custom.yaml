id: sc500-4c-plugin-add-custom
objective: "4.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Microsoft Security Copilot. Contributors are allowed to add and manage their own custom plugins. A contributor named **User4** has written a Security Copilot plugin that queries an internal threat intelligence API, and must add it for personal use.

    How should User4 complete the procedure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Microsoft Security Copilot. Les contributeurs sont autorisés à ajouter et à gérer leurs propres plug-ins personnalisés. Une contributrice nommée **User4** a écrit un plug-in Security Copilot qui interroge une API interne de renseignement sur les menaces, et doit l'ajouter pour son usage personnel.

    Comment User4 doit-elle compléter la procédure ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. Select [[where]], and then select Manage plugins.
      2. Add a Security Copilot plugin by uploading, or linking to, a [[fmt]] file.
      3. Enter the values of the plugin's settings fields and select Setup. The plugin then appears in the [[sec]] section, where it can be turned on or off.
    fr: |
      1. Sélectionner [[where]], puis Manage plugins.
      2. Ajouter un Security Copilot plugin en chargeant un fichier [[fmt]] ou en indiquant un lien vers celui-ci.
      3. Saisir les valeurs des champs de paramètres du plug-in et sélectionner Setup. Le plug-in apparaît alors dans la section [[sec]], où il peut être activé ou désactivé.
  slots:
    - id: where
      options:
        - { id: sources, text: { en: "the Security Copilot sources icon", fr: "l'icône Security Copilot sources" } }
        - { id: owner, text: { en: "Owner > Plugin settings", fr: "Owner > Plugin settings" } }
        - { id: roles, text: { en: "Role assignment", fr: "Role assignment" } }
    - id: fmt
      options:
        - { id: yaml, text: { en: "YAML or JSON", fr: "YAML ou JSON" } }
        - { id: bicep, text: Bicep }
        - { id: xml, text: XML }
        - { id: csv, text: CSV }
    - id: sec
      options:
        - { id: custom, text: Custom }
        - { id: ms, text: Microsoft }
        - { id: nonms, text: Non-Microsoft }
answer:
  values: { where: sources, fmt: yaml, sec: custom }
explanation:
  correct:
    en: |
      Custom plugins are added from the Security Copilot sources icon > Manage plugins. A Security Copilot plugin is uploaded as a file, or linked by URL, in YAML or JSON format. After the settings values are entered and Setup is selected, the plugin appears in the Custom section and can be toggled.
    fr: |
      Les plug-ins personnalisés s'ajoutent depuis l'icône Security Copilot sources > Manage plugins. Un Security Copilot plugin se charge sous forme de fichier, ou se référence par une URL, au format YAML ou JSON. Une fois les valeurs des paramètres saisies et Setup sélectionné, le plug-in apparaît dans la section Custom et peut être activé ou désactivé.
  options:
    owner: { en: "Plugin settings is where owners decide who can add plugins; it isn't where plugins are added.", fr: "Plugin settings est l'endroit où les propriétaires décident qui peut ajouter des plug-ins ; on n'y ajoute pas de plug-ins." }
    roles: { en: "Role assignment manages Copilot owners and contributors.", fr: "Role assignment gère les Copilot owners et contributors." }
    ms: { en: "The Microsoft section lists the preinstalled Microsoft plugins.", fr: "La section Microsoft liste les plug-ins Microsoft préinstallés." }
    nonms: { en: "The Non-Microsoft section lists preinstalled third-party plugins.", fr: "La section Non-Microsoft liste les plug-ins tiers préinstallés." }
references:
  - title: Manage plugins in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/manage-plugins
