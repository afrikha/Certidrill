id: sc500-4c-copilot-contributor-group
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Security Copilot. The members of a security group named **Tier1-Analysts** already have the Defender and Microsoft Sentinel roles they need to view incidents.

    The analysts must be able to create Security Copilot sessions and run promptbooks. They must not be able to manage capacity or change the data sharing options. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Contoso utilise Microsoft Security Copilot. Les membres d'un groupe de sécurité nommé **Tier1-Analysts** disposent déjà des rôles Defender et Microsoft Sentinel nécessaires pour consulter les incidents.

    Les analystes doivent pouvoir créer des sessions Security Copilot et exécuter des promptbooks. Ils ne doivent pas pouvoir gérer la capacité ni modifier les options de partage des données. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add Tier1-Analysts to the Copilot owner role.", fr: "Ajouter Tier1-Analysts au rôle Copilot owner." } }
    - { id: b, text: { en: "Assign the Security Administrator role to Tier1-Analysts.", fr: "Attribuer le rôle Security Administrator à Tier1-Analysts." } }
    - { id: c, text: { en: "Assign the Billing Administrator role to Tier1-Analysts.", fr: "Attribuer le rôle Billing Administrator à Tier1-Analysts." } }
    - { id: d, text: { en: "Add Tier1-Analysts to the Copilot contributor role.", fr: "Ajouter Tier1-Analysts au rôle Copilot contributor." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Copilot contributor lets users create sessions and run promptbooks, while capacity management and data sharing options are reserved for Copilot owners. Microsoft recommends assigning the Security Copilot roles to security groups rather than to individual users.
    fr: |
      Copilot contributor permet de créer des sessions et d'exécuter des promptbooks, alors que la gestion de la capacité et les options de partage des données sont réservées aux Copilot owners. Microsoft recommande d'attribuer les rôles Security Copilot à des groupes de sécurité plutôt qu'à des utilisateurs individuels.
  options:
    a: { en: "Copilot owner includes capacity management and data sharing options, which the analysts must not have.", fr: "Copilot owner inclut la gestion de la capacité et les options de partage des données, que les analystes ne doivent pas avoir." }
    b: { en: "Security Administrator is a privileged Microsoft Entra role that also makes its members Copilot owners.", fr: "Security Administrator est un rôle Microsoft Entra privilégié qui fait aussi de ses membres des Copilot owners." }
    c: { en: "Billing Administrator is a Microsoft Entra role whose members inherit Copilot owner access, which includes capacity management.", fr: "Billing Administrator est un rôle Microsoft Entra dont les membres héritent de l'accès Copilot owner, qui inclut la gestion de la capacité." }
references:
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
