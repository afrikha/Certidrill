id: sc500-sr2-signin-retention-3
objective: "4.2.9"
type: series_yesno
series: sc500-sr2-signin-retention
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You set 730 days of analytics retention and 1,095 days of total retention.
  fr: Vous définissez 730 jours de rétention d'analyse et 1 095 jours de rétention totale.
body:
  solution:
    en: In law-sec, you open **Tables**, select **Manage table** for SigninLogs, and in **Data retention settings** you set the analytics retention to **730 days** and the total retention to **1,095 days**.
    fr: Dans law-sec, vous ouvrez **Tables**, sélectionnez **Manage table** pour SigninLogs et, dans **Data retention settings**, vous définissez la rétention d'analyse sur **730 jours** et la rétention totale sur **1 095 jours**.
answer: { value: false }
explanation:
  correct:
    en: The data is available for 180 days and deleted after three years, but analytics retention beyond the 90 free days of a Sentinel table is charged, and it costs more than long-term retention. Keeping 730 days in analytics retention instead of 180 does not minimize storage costs.
    fr: Les données sont disponibles pendant 180 jours et supprimées après trois ans, mais la rétention d'analyse au-delà des 90 jours gratuits d'une table Sentinel est facturée et coûte plus cher que la rétention à long terme. Conserver 730 jours en rétention d'analyse au lieu de 180 ne réduit pas les coûts de stockage au minimum.
references:
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
  - title: Manage Data Retention in a Log Analytics Workspace - Azure Monitor
