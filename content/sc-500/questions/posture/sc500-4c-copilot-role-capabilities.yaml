id: sc500-4c-copilot-role-capabilities
objective: "4.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Microsoft Security Copilot. Plugin and file upload settings are left at their defaults. Four teams need the capabilities listed in the answer area. No team needs anything else, and no team must receive a Microsoft Entra role.

    Which role should you assign to each team? To answer, drag the appropriate roles to the correct teams. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Microsoft Security Copilot. Les paramètres des plug-ins et du chargement de fichiers sont laissés à leurs valeurs par défaut. Quatre équipes ont besoin des fonctionnalités listées dans la zone de réponse. Aucune équipe n'a besoin d'autre chose, et aucune équipe ne doit recevoir de rôle Microsoft Entra.

    Quel rôle devez-vous attribuer à chaque équipe ? Pour répondre, faites glisser les rôles appropriés vers les équipes correspondantes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: owner, text: Copilot owner }
    - { id: contrib, text: Copilot contributor }
    - { id: secadm, text: Security Administrator }
    - { id: secread, text: Security Reader }
  targets:
    - id: finops
      text: { en: "FinOps: view the usage dashboard and adjust the provisioned SCUs", fr: "FinOps : consulter le tableau de bord d'utilisation et ajuster les SCU provisionnées" }
    - id: soc
      text: { en: "SOC: run promptbooks and share them with the tenant", fr: "SOC : exécuter des promptbooks et les partager avec le locataire" }
    - id: plat
      text: { en: "Platform: make preinstalled plugins available to owners only", fr: "Plateforme : rendre les plug-ins préinstallés disponibles pour les seuls propriétaires" }
    - id: ir
      text: { en: "Incident response: upload files to sessions", fr: "Réponse aux incidents : charger des fichiers dans les sessions" }
answer:
  mapping: { finops: owner, soc: contrib, plat: owner, ir: contrib }
explanation:
  correct:
    en: |
      Capacity management, the usage dashboard and the availability of preinstalled plugins are owner capabilities. Running and sharing promptbooks are contributor capabilities, and contributors can upload files by default. Security Administrator and Security Reader are Microsoft Entra roles, which the teams must not receive.
    fr: |
      La gestion de la capacité, le tableau de bord d'utilisation et la disponibilité des plug-ins préinstallés sont des fonctionnalités de propriétaire. Exécuter et partager des promptbooks sont des fonctionnalités de contributeur, et les contributeurs peuvent charger des fichiers par défaut. Security Administrator et Security Reader sont des rôles Microsoft Entra, que les équipes ne doivent pas recevoir.
references:
  - title: Understand authentication in Microsoft Security Copilot
    url: https://learn.microsoft.com/en-us/copilot/security/authentication
