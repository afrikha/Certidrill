id: sc500-4c-audit-search-export
objective: "4.2.10"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses Microsoft 365 E5 and the Microsoft Defender portal. Audit log ingestion is turned on. A security analyst named **Analyst2** has no Microsoft Purview role.

    Analyst2 must provide a CSV file that lists the SharePoint files that a user named **User1** downloaded during the last 30 days. The solution must follow the principle of least privilege.

    Which three actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys utilise Microsoft 365 E5 et le portail Microsoft Defender. L'ingestion du journal d'audit est activée. Un analyste de sécurité nommé **Analyst2** n'a aucun rôle Microsoft Purview.

    Analyst2 doit fournir un fichier CSV qui liste les fichiers SharePoint téléchargés par un utilisateur nommé **User1** au cours des 30 derniers jours. La solution doit respecter le principe du moindre privilège.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: role, text: { en: "Assign the View-Only Audit Logs role to Analyst2.", fr: "Attribuer le rôle View-Only Audit Logs à Analyst2." } }
    - { id: search, text: { en: "On the Audit page of the Defender portal, set the date range, the FileDownloaded activity and User1, and then select Search.", fr: "Sur la page Audit du portail Defender, définir la plage de dates, l'activité FileDownloaded et User1, puis sélectionner Search." } }
    - { id: export, text: { en: "When the search job shows Completed, open it and export the results.", fr: "Quand le travail de recherche affiche Completed, l'ouvrir et exporter les résultats." } }
    - { id: policy, text: { en: "Create an audit log retention policy for SharePoint with a duration of 1 Year.", fr: "Créer une stratégie de rétention du journal d'audit pour SharePoint d'une durée de 1 Year." } }
    - { id: ingest, text: { en: "Run Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true.", fr: "Exécuter Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true." } }
    - { id: ga, text: { en: "Assign the Compliance Administrator role to Analyst2.", fr: "Attribuer le rôle Compliance Administrator à Analyst2." } }
answer:
  sequence: [ role, search, export ]
explanation:
  correct:
    en: |
      Analyst2 first needs View-Only Audit Logs, the least-privileged role that allows audit searches. The search runs as a background job with the date range, activity and user criteria; when its status is Completed, the results can be exported to a CSV file.
    fr: |
      Analyst2 a d'abord besoin de View-Only Audit Logs, le rôle le moins privilégié qui permet les recherches d'audit. La recherche s'exécute comme un travail en arrière-plan avec les critères de plage de dates, d'activité et d'utilisateur ; quand son statut est Completed, les résultats peuvent être exportés dans un fichier CSV.
  options:
    policy: { en: "30 days of SharePoint activity is already within the default retention; no policy is needed.", fr: "30 jours d'activité SharePoint sont déjà couverts par la rétention par défaut ; aucune stratégie n'est nécessaire." }
    ingest: { en: "Audit log ingestion is already turned on.", fr: "L'ingestion du journal d'audit est déjà activée." }
    ga: { en: "Compliance Administrator grants far more than audit search, which violates least privilege.", fr: "Compliance Administrator accorde bien plus que la recherche d'audit, ce qui enfreint le moindre privilège." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
