id: sc500-4a-mc-statements
objective: "4.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to connect its AWS organization and a GCP project to Microsoft Defender for Cloud. One of the AWS member accounts, **aws-legacy**, is already connected to Microsoft Sentinel by using the Amazon Web Services data connector.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de connecter son organisation AWS et un projet GCP à Microsoft Defender for Cloud. L'un des comptes membres AWS, **aws-legacy**, est déjà connecté à Microsoft Sentinel avec le connecteur de données Amazon Web Services.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          When you create the AWS connector for the management account, you can enter the IDs of the AWS accounts to exclude from onboarding.
        fr: |-
          Lors de la création du connecteur AWS pour le compte de gestion, vous pouvez saisir les ID des comptes AWS à exclure de l'intégration.
    - id: s2
      text:
        en: |-
          aws-legacy can be connected to Defender for Cloud by the standard connector procedure, without any additional steps.
        fr: |-
          aws-legacy peut être connecté à Defender for Cloud avec la procédure standard du connecteur, sans aucune étape supplémentaire.
    - id: s3
      text:
        en: |-
          The GCP connector accesses the project through workload identity federation and service account impersonation.
        fr: |-
          Le connecteur GCP accède au projet par la fédération d'identités de charge de travail et l'emprunt d'identité de comptes de service.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      A Management account connector accepts a comma-separated list of AWS account IDs to exclude. An AWS account that is connected to Microsoft Sentinel can't be connected with the standard procedure; a dedicated procedure exists for Sentinel-connected accounts. The GCP connector uses workload identity federation and service account impersonation, so no long-lived credentials are stored.
    fr: |-
      Un connecteur Management account accepte une liste d'ID de comptes AWS à exclure, séparés par des virgules. Un compte AWS connecté à Microsoft Sentinel ne peut pas être connecté avec la procédure standard ; une procédure dédiée existe pour les comptes connectés à Sentinel. Le connecteur GCP utilise la fédération d'identités de charge de travail et l'emprunt d'identité de comptes de service, sans stocker d'informations d'identification de longue durée.
  options:
    s2:
      en: |-
        The AWS connector page lists Sentinel-connected accounts as a limitation and points to a separate procedure.
      fr: |-
        La page du connecteur AWS indique les comptes connectés à Sentinel comme une limitation et renvoie à une procédure distincte.
references:
  - title: Connect AWS accounts to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws
  - title: Connect your GCP project to Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-gcp
