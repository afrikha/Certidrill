id: sc500-4a-easm-standalone
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has Azure subscriptions protected by the Defender CSPM plan. Litware also acquired several small companies whose websites, mail servers and IP ranges are hosted by external providers. These assets aren't in Azure, AWS or GCP, and Litware has no inventory of them. Litware knows the domain names of the acquired companies.

    You need to discover the internet-facing assets of the acquired companies, starting from their domain names, and keep an inventory of the confirmed assets that is rescanned daily.

    What should you do?
  fr: |
    Litware dispose d'abonnements Azure protégés par le plan Defender CSPM. Litware a aussi racheté plusieurs petites entreprises dont les sites web, les serveurs de messagerie et les plages IP sont hébergés par des fournisseurs externes. Ces ressources ne sont ni dans Azure, ni dans AWS, ni dans GCP, et Litware n'en possède aucun inventaire. Litware connaît les noms de domaine des entreprises rachetées.

    Vous devez découvrir les ressources exposées à Internet des entreprises rachetées, à partir de leurs noms de domaine, et tenir un inventaire des ressources confirmées qui est analysé de nouveau chaque jour.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run a cloud security explorer query for internet-exposed resources in the Defender CSPM plan.", fr: "Exécuter une requête de l'explorateur de sécurité cloud sur les ressources exposées à Internet dans le plan Defender CSPM." } }
    - { id: b, text: { en: "Deploy a Defender EASM resource and run a discovery that uses the domain names as seeds.", fr: "Déployer une ressource Defender EASM et lancer une découverte qui utilise les noms de domaine comme seeds." } }
    - { id: c, text: { en: "Onboard the servers of the acquired companies to Azure Arc and enable Defender for Servers.", fr: "Intégrer les serveurs des entreprises rachetées à Azure Arc et activer Defender for Servers." } }
    - { id: d, text: { en: "Review the attack paths that start from internet-exposed IP addresses in Defender CSPM.", fr: "Examiner les chemins d'attaque qui partent d'adresses IP exposées à Internet dans Defender CSPM." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Defender EASM resource starts from discovery seeds such as domains and recursively discovers the related internet-facing infrastructure, wherever it is hosted. Assets that you confirm as owned are set to Approved Inventory, which is rescanned daily.
    fr: |-
      Une ressource Defender EASM part de seeds de découverte comme des domaines et découvre de manière récursive l'infrastructure exposée à Internet qui leur est liée, où qu'elle soit hébergée. Les ressources dont vous confirmez la propriété passent à l'état Approved Inventory, analysé de nouveau chaque jour.
  options:
    a:
      en: |-
        The EASM data in Defender CSPM covers the internet-facing cloud resources of the connected environments, not assets hosted by external providers.
      fr: |-
        Les données EASM de Defender CSPM couvrent les ressources cloud exposées à Internet des environnements connectés, pas les ressources hébergées par des fournisseurs externes.
    c:
      en: |-
        Azure Arc requires installing an agent on each known server; it doesn't discover unknown assets, domains or IP ranges.
      fr: |-
        Azure Arc exige l'installation d'un agent sur chaque serveur connu ; il ne découvre pas les ressources, domaines ou plages IP inconnus.
    d:
      en: |-
        Attack paths in Defender CSPM start from exposed IP addresses of cloud resources in the connected environments, not from external providers' assets.
      fr: |-
        Les chemins d'attaque de Defender CSPM partent d'adresses IP exposées de ressources cloud des environnements connectés, pas des ressources de fournisseurs externes.
references:
  - title: External attack surface management in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-easm
  - title: Understand inventory assets
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/understanding-inventory-assets
