id: sc500-sr2-signin-retention-1
objective: "4.2.9"
type: series_yesno
series: sc500-sr2-signin-retention
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You set 180 days of analytics retention and 1,095 days of total retention by using the Azure CLI.
  fr: Vous définissez 180 jours de rétention d'analyse et 1 095 jours de rétention totale à l'aide d'Azure CLI.
body:
  solution:
    en: |
      You run the following command.

      ```bash
      az monitor log-analytics workspace table update \
        --resource-group rg-sec \
        --workspace-name law-sec \
        --name SigninLogs \
        --retention-time 180 \
        --total-retention-time 1095
      ```
    fr: |
      Vous exécutez la commande suivante.

      ```bash
      az monitor log-analytics workspace table update \
        --resource-group rg-sec \
        --workspace-name law-sec \
        --name SigninLogs \
        --retention-time 180 \
        --total-retention-time 1095
      ```
answer: { value: true }
explanation:
  correct:
    en: "`--retention-time` sets the analytics retention (4 to 730 days), during which the data stays available to hunting queries and workbooks. `--total-retention-time` sets the total retention (up to 2,556 days with the CLI); the 915 days after the analytics period are kept in low-cost long-term retention and the data is deleted after 1,095 days, which minimizes cost."
    fr: "`--retention-time` définit la rétention d'analyse (de 4 à 730 jours), pendant laquelle les données restent disponibles pour les requêtes de chasse proactive et les classeurs. `--total-retention-time` définit la rétention totale (jusqu'à 2 556 jours avec l'interface CLI) ; les 915 jours qui suivent la période d'analyse sont conservés en rétention à long terme peu coûteuse et les données sont supprimées après 1 095 jours, ce qui réduit les coûts au minimum."
references:
  - title: Manage Data Retention in a Log Analytics Workspace - Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-retention-configure
  - title: Manage data tiers and retention in Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/manage-data-overview
