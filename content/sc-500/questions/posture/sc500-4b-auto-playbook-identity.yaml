id: sc500-4b-auto-playbook-identity
objective: "4.2.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Sentinel workspace named law-tt. A Consumption logic app named PB-Enrich is used as a playbook. PB-Enrich must add comments to incidents and change their severity.

    The Microsoft Sentinel connector of PB-Enrich must authenticate by using a managed identity. No user account or client secret may be used. The solution must follow the principle of least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un espace de travail Microsoft Sentinel nommé law-tt. Une application logique Consumption nommée PB-Enrich est utilisée comme playbook. PB-Enrich doit ajouter des commentaires aux incidents et modifier leur gravité.

    Le connecteur Microsoft Sentinel de PB-Enrich doit s'authentifier à l'aide d'une identité managée. Aucun compte d'utilisateur ni secret client ne doit être utilisé. La solution doit respecter le principe du privilège minimum.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on the system-assigned managed identity of PB-Enrich.", fr: "Activer l'identité managée affectée par le système de PB-Enrich." } }
    - { id: b, text: { en: "On law-tt, assign Microsoft Sentinel Reader to the managed identity of PB-Enrich.", fr: "Sur law-tt, attribuer Microsoft Sentinel Reader à l'identité managée de PB-Enrich." } }
    - { id: c, text: { en: "On law-tt, assign Microsoft Sentinel Responder to the managed identity of PB-Enrich.", fr: "Sur law-tt, attribuer Microsoft Sentinel Responder à l'identité managée de PB-Enrich." } }
    - { id: d, text: { en: "On the resource group of PB-Enrich, assign Microsoft Sentinel Automation Contributor to the managed identity of PB-Enrich.", fr: "Sur le groupe de ressources de PB-Enrich, attribuer Microsoft Sentinel Automation Contributor à l'identité managée de PB-Enrich." } }
    - { id: e, text: { en: "Register an application in Microsoft Entra ID and assign it Microsoft Sentinel Responder on law-tt.", fr: "Inscrire une application dans Microsoft Entra ID et lui attribuer Microsoft Sentinel Responder sur law-tt." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      To use a managed identity, you turn on the system-assigned identity of the logic app, assign it a Microsoft Sentinel role on the workspace (Access control (IAM), Assign access to Logic App), and create the connection with Connect with managed identity. Microsoft Sentinel Responder is the role for playbooks that update incidents or watchlists; Reader only covers triggers and read actions.
    fr: |
      Pour utiliser une identité managée, vous activez l'identité affectée par le système de l'application logique, vous lui attribuez un rôle Microsoft Sentinel sur l'espace de travail (Access control (IAM), Assign access to Logic App), puis vous créez la connexion avec Connect with managed identity. Microsoft Sentinel Responder est le rôle des playbooks qui mettent à jour des incidents ou des listes de surveillance ; Reader ne couvre que les déclencheurs et les actions de lecture.
  options:
    b:
      en: |
        Reader is enough for a playbook that only receives incidents, not for one that adds comments and changes severity.
      fr: |
        Reader suffit pour un playbook qui reçoit seulement des incidents, pas pour un playbook qui ajoute des commentaires et modifie la gravité.
    d:
      en: |
        Automation Contributor is granted to the Microsoft Sentinel service account so that automation rules can run playbooks; it doesn't let the playbook update incidents.
      fr: |
        Automation Contributor est accordé au compte de service Microsoft Sentinel pour que les règles d'automatisation puissent exécuter les playbooks ; il ne permet pas au playbook de mettre à jour les incidents.
    e:
      en: |
        A registered application is the service principal method, which requires a client secret; the requirement is a managed identity.
      fr: |
        Une application inscrite correspond à la méthode du principal de service, qui exige un secret client ; l'exigence porte sur une identité managée.
references:
  - title: Authenticate playbooks to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/automation/authenticate-playbooks-to-sentinel
