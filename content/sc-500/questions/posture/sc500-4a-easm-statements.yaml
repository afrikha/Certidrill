id: sc500-4a-easm-statements
objective: "4.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses a Microsoft Defender External Attack Surface Management (Defender EASM) resource. The inventory contains assets in the Approved Inventory, Candidate and Dependency states. Nobody has changed the inventory filters of the dashboards.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys utilise une ressource Microsoft Defender External Attack Surface Management (Defender EASM). L'inventaire contient des ressources aux états Approved Inventory, Candidate et Dependency. Personne n'a modifié les filtres d'inventaire des tableaux de bord.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Assets in the Approved Inventory state are scanned daily.
        fr: |-
          Les ressources à l'état Approved Inventory sont analysées chaque jour.
    - id: s2
      text:
        en: |-
          Assets in the Candidate state are scanned daily, like the approved assets.
        fr: |-
          Les ressources à l'état Candidate sont analysées chaque jour, comme les ressources approuvées.
    - id: s3
      text:
        en: |-
          Assets in the Dependency state are included in the dashboard charts.
        fr: |-
          Les ressources à l'état Dependency sont incluses dans les graphiques des tableaux de bord.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      Approved Inventory assets are always represented in the dashboard charts and are scanned daily. Candidate assets are scanned only during the discovery process. Assets in the other states aren't included in the dashboard charts by default, although you can adjust the inventory filters to view them.
    fr: |-
      Les ressources Approved Inventory figurent toujours dans les graphiques des tableaux de bord et sont analysées chaque jour. Les ressources Candidate ne sont analysées que pendant le processus de découverte. Les ressources des autres états ne sont pas incluses par défaut dans les graphiques, mais vous pouvez ajuster les filtres d'inventaire pour les afficher.
  options:
    s2:
      en: |-
        Candidate assets are scanned only during discovery.
      fr: |-
        Les ressources Candidate ne sont analysées que pendant la découverte.
    s3:
      en: |-
        Only Approved Inventory assets are in the dashboard charts by default.
      fr: |-
        Seules les ressources Approved Inventory figurent par défaut dans les graphiques.
references:
  - title: Understand inventory assets
    url: https://learn.microsoft.com/en-us/azure/external-attack-surface-management/understanding-inventory-assets
