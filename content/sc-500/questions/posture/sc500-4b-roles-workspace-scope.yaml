id: sc500-4b-roles-workspace-scope
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a resource group named RG-Shared that contains a Log Analytics workspace named law-adatum, on which Microsoft Sentinel is enabled. RG-Shared also contains virtual machines and storage accounts that the security analysts must not be able to read.

    You need to give the analysts read access to Microsoft Sentinel incidents, data and workbooks of law-adatum. You decide to assign the Microsoft Sentinel Reader role at the workspace scope instead of the resource group scope.

    What else should you do so that the analysts get the expected access?
  fr: |
    Adatum Corporation dispose d'un groupe de ressources nommé RG-Shared qui contient un espace de travail Log Analytics nommé law-adatum, sur lequel Microsoft Sentinel est activé. RG-Shared contient aussi des machines virtuelles et des comptes de stockage que les analystes de sécurité ne doivent pas pouvoir lire.

    Vous devez donner aux analystes l'accès en lecture aux incidents, aux données et aux classeurs Microsoft Sentinel de law-adatum. Vous décidez d'attribuer le rôle Microsoft Sentinel Reader à l'étendue de l'espace de travail plutôt qu'à celle du groupe de ressources.

    Que devez-vous faire d'autre pour que les analystes obtiennent l'accès attendu ?
body:
  options:
    - { id: a, text: { en: "Assign Microsoft Sentinel Reader on the SecurityInsights solution resource of law-adatum.", fr: "Attribuer Microsoft Sentinel Reader sur la ressource de solution SecurityInsights de law-adatum." } }
    - { id: b, text: { en: "Assign Log Analytics Reader on the subscription that contains law-adatum.", fr: "Attribuer Log Analytics Reader sur l'abonnement qui contient law-adatum." } }
    - { id: c, text: { en: "Assign the Security Reader role in Microsoft Entra ID to the analysts.", fr: "Attribuer le rôle Security Reader dans Microsoft Entra ID aux analystes." } }
    - { id: d, text: { en: "Register the Microsoft.SecurityInsights resource provider in the subscription.", fr: "Inscrire le fournisseur de ressources Microsoft.SecurityInsights dans l'abonnement." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft recommends assigning Microsoft Sentinel roles at the resource group that contains the workspace. When you assign them directly on the workspace instead, you must also assign the same roles on the SecurityInsights solution resource of that workspace. This keeps the analysts away from the other resources of RG-Shared.
    fr: |
      Microsoft recommande d'attribuer les rôles Microsoft Sentinel sur le groupe de ressources qui contient l'espace de travail. Si vous les attribuez directement sur l'espace de travail, vous devez aussi attribuer les mêmes rôles sur la ressource de solution SecurityInsights de cet espace de travail. Les analystes restent ainsi tenus à l'écart des autres ressources de RG-Shared.
  options:
    b:
      en: |
        Log Analytics Reader at the subscription grants read access to every workspace of the subscription, which is broader than needed, and doesn't replace the assignment on the solution resource.
      fr: |
        Log Analytics Reader sur l'abonnement donne la lecture de tous les espaces de travail de l'abonnement, ce qui est trop large, et ne remplace pas l'attribution sur la ressource de solution.
    c:
      en: |
        Security Reader is a Microsoft Entra role; it gives read access to the Sentinel data lake, not the Azure RBAC permissions of the SIEM workspace.
      fr: |
        Security Reader est un rôle Microsoft Entra ; il donne la lecture du data lake de Sentinel, pas les autorisations Azure RBAC de l'espace de travail SIEM.
    d:
      en: |
        The resource provider is already registered because Microsoft Sentinel is enabled; registration doesn't grant permissions to users.
      fr: |
        Le fournisseur de ressources est déjà inscrit puisque Microsoft Sentinel est activé ; l'inscription n'accorde aucune autorisation aux utilisateurs.
references:
  - title: Roles and permissions in the Microsoft Sentinel platform
    url: https://learn.microsoft.com/en-us/azure/sentinel/roles
