id: sc500-4b-conn-tables-kql
objective: "4.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has connected the following data connectors to Microsoft Sentinel:

    - Subscription-based Microsoft Defender for Cloud (Legacy)
    - Microsoft Entra ID, with Non-interactive user sign-in logs and Microsoft Graph activity logs selected

    You need to write three queries to check that each type of data arrives in the workspace.

    How should you complete the queries? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys a connecté les connecteurs de données suivants à Microsoft Sentinel :

    - Subscription-based Microsoft Defender for Cloud (Legacy) ;
    - Microsoft Entra ID, avec Non-interactive user sign-in logs et Microsoft Graph activity logs sélectionnés.

    Vous devez écrire trois requêtes pour vérifier que chaque type de données arrive dans l'espace de travail.

    Comment devez-vous compléter les requêtes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    // Alerts from Microsoft Defender for Cloud
    [[t1]]
    | where ProductName == "Azure Security Center"

    // Sign-ins that a client performed on behalf of a user
    [[t2]]
    | where TimeGenerated > ago(1d)

    // HTTP requests sent to the Microsoft Graph API
    [[t3]]
    | where TimeGenerated > ago(1d)
  slots:
    - id: t1
      options:
        - { id: alert, text: SecurityAlert }
        - { id: incident, text: SecurityIncident }
        - { id: activity, text: AzureActivity }
    - id: t2
      options:
        - { id: signin, text: SigninLogs }
        - { id: noninter, text: AADNonInteractiveUserSignInLogs }
        - { id: sp, text: AADServicePrincipalSignInLogs }
    - id: t3
      options:
        - { id: audit, text: AuditLogs }
        - { id: prov, text: AADProvisioningLogs }
        - { id: graph, text: MicrosoftGraphActivityLogs }
answer:
  values: { t1: alert, t2: noninter, t3: graph }
explanation:
  correct:
    en: |
      Defender for Cloud alerts are stored in the SecurityAlert table, where ProductName is "Azure Security Center". Non-interactive user sign-ins, performed by a client on a user's behalf, go to AADNonInteractiveUserSignInLogs, and HTTP requests to Microsoft Graph go to MicrosoftGraphActivityLogs.
    fr: |
      Les alertes Defender for Cloud sont stockées dans la table SecurityAlert, où ProductName vaut « Azure Security Center ». Les connexions non interactives des utilisateurs, effectuées par un client en leur nom, vont dans AADNonInteractiveUserSignInLogs, et les requêtes HTTP vers Microsoft Graph dans MicrosoftGraphActivityLogs.
  options:
    incident:
      en: |
        SecurityIncident holds Microsoft Sentinel incidents, not the alerts ingested from Defender for Cloud.
      fr: |
        SecurityIncident contient les incidents Microsoft Sentinel, pas les alertes ingérées depuis Defender for Cloud.
    signin:
      en: |
        SigninLogs holds interactive user sign-ins.
      fr: |
        SigninLogs contient les connexions interactives des utilisateurs.
    audit:
      en: |
        AuditLogs records changes made in the directory, not Microsoft Graph HTTP requests.
      fr: |
        AuditLogs enregistre les modifications apportées à l'annuaire, pas les requêtes HTTP Microsoft Graph.
references:
  - title: Ingest Microsoft Defender for Cloud alerts to Microsoft Sentinel
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-defender-for-cloud
  - title: Send data to Microsoft Sentinel using the Microsoft Entra ID data connector
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-azure-active-directory
