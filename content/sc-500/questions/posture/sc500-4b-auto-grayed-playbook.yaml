id: sc500-4b-auto-grayed-playbook
objective: "4.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses Microsoft Sentinel. The workspace is in a resource group named RG-SOC. A playbook named PB-Isolate, which uses the Microsoft Sentinel incident trigger, was deployed to a resource group named RG-Playbooks.

    You have the Owner role on RG-SOC and RG-Playbooks. You create an automation rule with the trigger **When incident is created** and add the **Run playbook** action. PB-Isolate appears grayed out in the list of playbooks.

    You need the automation rule to be able to run PB-Isolate.

    What should you do?
  fr: |
    Contoso, Ltd. utilise Microsoft Sentinel. L'espace de travail se trouve dans un groupe de ressources nommé RG-SOC. Un playbook nommé PB-Isolate, qui utilise le déclencheur d'incident Microsoft Sentinel, a été déployé dans un groupe de ressources nommé RG-Playbooks.

    Vous disposez du rôle Owner sur RG-SOC et RG-Playbooks. Vous créez une règle d'automatisation avec le déclencheur **When incident is created** et ajoutez l'action **Run playbook**. PB-Isolate apparaît grisé dans la liste des playbooks.

    La règle d'automatisation doit pouvoir exécuter PB-Isolate.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign yourself the Microsoft Sentinel Playbook Operator role on RG-Playbooks.", fr: "Vous attribuer le rôle Microsoft Sentinel Playbook Operator sur RG-Playbooks." } }
    - { id: b, text: { en: "Enable the system-assigned managed identity of PB-Isolate and assign it Microsoft Sentinel Responder.", fr: "Activer l'identité managée affectée par le système de PB-Isolate et lui attribuer Microsoft Sentinel Responder." } }
    - { id: c, text: { en: "Select Manage playbook permissions and grant Microsoft Sentinel permissions on RG-Playbooks.", fr: "Sélectionner Manage playbook permissions et accorder à Microsoft Sentinel des autorisations sur RG-Playbooks." } }
    - { id: d, text: { en: "Change the trigger of PB-Isolate from the incident trigger to the alert trigger.", fr: "Remplacer le déclencheur d'incident de PB-Isolate par le déclencheur d'alerte." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Automation rules run playbooks through a Microsoft Sentinel service account, not through your user account. That account needs explicit permissions (Microsoft Sentinel Automation Contributor) on the playbook's resource group, which you grant from Manage playbook permissions with Owner rights. Until then, the playbook is grayed out; afterwards any automation rule can run any playbook of RG-Playbooks.
    fr: |
      Les règles d'automatisation exécutent les playbooks via un compte de service Microsoft Sentinel, pas via votre compte d'utilisateur. Ce compte a besoin d'autorisations explicites (Microsoft Sentinel Automation Contributor) sur le groupe de ressources du playbook, que vous accordez depuis Manage playbook permissions avec des droits Owner. En attendant, le playbook est grisé ; ensuite, toute règle d'automatisation peut exécuter tout playbook de RG-Playbooks.
  options:
    a:
      en: |
        Playbook Operator lets a user run playbooks manually; automation rules don't use the user's permissions.
      fr: |
        Playbook Operator permet à un utilisateur d'exécuter manuellement des playbooks ; les règles d'automatisation n'utilisent pas les autorisations de l'utilisateur.
    b:
      en: |
        The managed identity lets the playbook act on incidents once it runs; it doesn't let Microsoft Sentinel start the playbook.
      fr: |
        L'identité managée permet au playbook d'agir sur les incidents une fois lancé ; elle ne permet pas à Microsoft Sentinel de démarrer le playbook.
    d:
      en: |
        An incident-trigger rule can run only incident-trigger playbooks; changing the trigger would make the playbook unusable from this rule.
      fr: |
        Une règle à déclencheur d'incident ne peut exécuter que des playbooks à déclencheur d'incident ; changer le déclencheur rendrait le playbook inutilisable depuis cette règle.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
