id: sc500-4c-audit-search-limits
objective: "4.2.10"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses Microsoft 365 E3 (Audit (Standard)). Analysts search the unified audit log from the **Audit** page of the Microsoft Defender portal.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise Microsoft 365 E3 (Audit (Standard)). Les analystes effectuent des recherches dans le journal d'audit unifié depuis la page **Audit** du portail Microsoft Defender.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A single audit search can cover a date range of the last 365 days.
        fr: |
          Une seule recherche d'audit peut couvrir une plage de dates correspondant aux 365 derniers jours.
    - id: s2
      text:
        en: |
          An analyst can run several audit search jobs at the same time, and the jobs keep running after the browser is closed.
        fr: |
          Un analyste peut exécuter plusieurs travaux de recherche d'audit en même temps, et les travaux continuent après la fermeture du navigateur.
    - id: s3
      text:
        en: |
          An export of audit search results is limited to 50,000 rows.
        fr: |
          Une exportation des résultats d'une recherche d'audit est limitée à 50 000 lignes.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The date range of an audit search is limited to 180 days; a longer range returns an error. Search jobs run in the background, up to 10 at the same time per user account, and are kept for 30 days. With Audit (Standard), an export is limited to 50,000 rows (1,000,000 rows with Audit (Premium)).
    fr: |
      La plage de dates d'une recherche d'audit est limitée à 180 jours ; une plage plus longue renvoie une erreur. Les travaux de recherche s'exécutent en arrière-plan, jusqu'à 10 simultanément par compte d'utilisateur, et sont conservés 30 jours. Avec Audit (Standard), une exportation est limitée à 50 000 lignes (1 000 000 de lignes avec Audit (Premium)).
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
