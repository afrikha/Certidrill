id: sc500-4a-easm-cspm
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has Azure subscriptions and AWS accounts connected to Microsoft Defender for Cloud. The Defender CSPM plan was enabled on all of them last month.

    The security team needs to find the internet-exposed IP addresses of these cloud resources by using an outside-in scan, and to review the attack paths that start from those IP addresses. The solution must minimize cost and administrative effort.

    What should you do?
  fr: |
    Adatum dispose d'abonnements Azure et de comptes AWS connectés à Microsoft Defender for Cloud. Le plan Defender CSPM a été activé sur tous le mois dernier.

    L'équipe de sécurité doit trouver les adresses IP exposées à Internet de ces ressources cloud grâce à une analyse de l'extérieur vers l'intérieur, et examiner les chemins d'attaque qui partent de ces adresses IP. La solution doit réduire au minimum les coûts et l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy a Defender EASM resource and add the public IP ranges of the resources as discovery seeds.", fr: "Déployer une ressource Defender EASM et ajouter les plages d'adresses IP publiques des ressources comme seeds de découverte." } }
    - { id: b, text: { en: "Enable Defender for Servers Plan 2 on every subscription and AWS account to get the network map.", fr: "Activer Defender for Servers Plan 2 sur chaque abonnement et compte AWS pour obtenir la carte réseau." } }
    - { id: c, text: { en: "Use attack path analysis and cloud security explorer, with no additional plan or licence.", fr: "Utiliser l'analyse du chemin d'attaque et l'explorateur de sécurité cloud, sans plan ni licence supplémentaire." } }
    - { id: d, text: { en: "Purchase a Defender EASM licence for the subscriptions before you review the attack paths.", fr: "Acheter une licence Defender EASM pour les abonnements avant d'examiner les chemins d'attaque." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Defender EASM integration is included in the Defender CSPM plan by default and requires no Defender EASM licence or special configuration. It discovers the internet-facing cloud resources with an outside-in scan, feeds attack paths that start from internet-exposed IPs, and lets you query those IPs in cloud security explorer.
    fr: |-
      L'intégration de Defender EASM est incluse par défaut dans le plan Defender CSPM et n'exige ni licence Defender EASM ni configuration particulière. Elle découvre les ressources cloud exposées à Internet par une analyse de l'extérieur vers l'intérieur, alimente les chemins d'attaque qui partent d'adresses IP exposées et permet d'interroger ces adresses dans l'explorateur de sécurité cloud.
  options:
    a:
      en: |-
        A separate Defender EASM resource adds cost and work; Defender CSPM already provides this data for the connected cloud resources.
      fr: |-
        Une ressource Defender EASM distincte ajoute des coûts et du travail ; Defender CSPM fournit déjà ces données pour les ressources cloud connectées.
    b:
      en: |-
        The network map of Defender for Servers Plan 2 doesn't provide outside-in discovery or attack paths, and it adds cost.
      fr: |-
        La carte réseau de Defender for Servers Plan 2 ne fournit ni découverte de l'extérieur ni chemins d'attaque, et elle ajoute des coûts.
    d:
      en: |-
        The integration doesn't require a Defender EASM licence; buying one adds cost without being needed.
      fr: |-
        L'intégration n'exige pas de licence Defender EASM ; en acheter une ajoute un coût inutile.
references:
  - title: External attack surface management in Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-easm
