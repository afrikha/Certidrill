id: sc500-cs1a-cef-forwarder
objective: "4.2.5"
type: ordering
caseStudy: sc500-cs1a-wingtip-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the firewall log requirement.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez satisfaire l'exigence relative aux journaux des pare-feu.

    Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans l'ordre correct.
body:
  count: 4
  actions:
    - { id: arc, text: { en: "Install the Azure Connected Machine agent on LNX-FWD1", fr: "Installer l'agent Azure Connected Machine sur LNX-FWD1" } }
    - { id: dcr, text: { en: "From the Common Event Format (CEF) via AMA connector, create a data collection rule that targets LNX-FWD1", fr: "À partir du connecteur Common Event Format (CEF) via AMA, créer une règle de collecte de données qui cible LNX-FWD1" } }
    - { id: script, text: { en: "Run the Forwarder_AMA_installer.py script on LNX-FWD1", fr: "Exécuter le script Forwarder_AMA_installer.py sur LNX-FWD1" } }
    - { id: devices, text: { en: "Configure FW-OT1 to FW-OT6 to send their CEF messages to LNX-FWD1", fr: "Configurer FW-OT1 à FW-OT6 pour qu'ils envoient leurs messages CEF à LNX-FWD1" } }
    - { id: mma, text: { en: "Install the Log Analytics agent on LNX-FWD1", fr: "Installer l'agent Log Analytics sur LNX-FWD1" } }
    - { id: table, text: { en: "Create a custom table named CommonSecurityLog_CL in law-wingtip-soc", fr: "Créer une table personnalisée nommée CommonSecurityLog_CL dans law-wingtip-soc" } }
    - { id: syslog, text: { en: "From the Syslog via AMA connector, create a second data collection rule with the same facilities", fr: "À partir du connecteur Syslog via AMA, créer une seconde règle de collecte de données avec les mêmes facilities syslog" } }
answer:
  sequence: [arc, dcr, script, devices]
explanation:
  correct:
    en: |-
      LNX-FWD1 is not an Azure VM, so it must first run the Azure Connected Machine agent; otherwise it does not appear in the resource list of the data collection rule. Creating the rule from the CEF via AMA connector installs the Azure Monitor Agent on LNX-FWD1. The installer script then configures rsyslog and opens port 514, and finally the firewalls are configured to send their messages to the forwarder.
    fr: |-
      LNX-FWD1 n'est pas une machine virtuelle Azure : il doit d'abord exécuter l'agent Azure Connected Machine, sinon il n'apparaît pas dans la liste des ressources de la règle de collecte de données. La création de la règle à partir du connecteur CEF via AMA installe l'agent Azure Monitor sur LNX-FWD1. Le script d'installation configure ensuite rsyslog et ouvre le port 514, puis les pare-feu sont configurés pour envoyer leurs messages au redirecteur.
  options:
    mma:
      en: |-
        The Log Analytics agent is retired; the CEF via AMA connector uses the Azure Monitor Agent, which the data collection rule deploys.
      fr: |-
        L'agent Log Analytics est mis hors service ; le connecteur CEF via AMA utilise l'agent Azure Monitor, que la règle de collecte de données déploie.
    table:
      en: |-
        CEF messages land in the standard CommonSecurityLog table; no custom table is needed.
      fr: |-
        Les messages CEF arrivent dans la table standard CommonSecurityLog ; aucune table personnalisée n'est nécessaire.
    syslog:
      en: |-
        Using the same facility for both syslog and CEF collection can duplicate the ingested data.
      fr: |-
        Utiliser la même facility syslog pour la collecte syslog et la collecte CEF peut dupliquer les données ingérées.
references:
  - title: Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent
    url: https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama
