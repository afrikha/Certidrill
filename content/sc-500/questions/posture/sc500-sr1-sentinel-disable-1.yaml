id: sc500-sr1-sentinel-disable-1
objective: "4.2.8"
type: series_yesno
series: sc500-sr1-sentinel-disable
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You run PB1 from an automation rule that uses the alert trigger.
  fr: Vous exécutez PB1 depuis une règle d'automatisation qui utilise le déclencheur d'alerte.
body:
  solution:
    en: |
      You create two automation rules. **Rule1** uses the **When incident is created** trigger, has a condition on the analytics rule name that matches AR1, and has the action **Assign owner** set to Analyst1. **Rule2** uses the **When alert is created** trigger, has the same condition, and has the action **Run playbook** set to PB1.
    fr: |
      Vous créez deux règles d'automatisation. **Rule1** utilise le déclencheur **When incident is created**, a une condition sur le nom de la règle d'analyse qui correspond à AR1 et a l'action **Assign owner** définie sur Analyst1. **Rule2** utilise le déclencheur **When alert is created**, a la même condition et a l'action **Run playbook** définie sur PB1.
answer: { value: false }
explanation:
  correct:
    en: |
      Rule1 assigns the incident correctly, but PB1 uses the incident trigger. Only incident-trigger playbooks can run from incident-trigger automation rules, and only alert-trigger playbooks can run from alert-trigger automation rules, so Rule2 cannot run PB1 and the accounts are not disabled.
    fr: |
      Rule1 affecte correctement l'incident, mais PB1 utilise le déclencheur d'incident. Seuls les playbooks de déclencheur d'incident peuvent être exécutés à partir de règles d'automatisation de déclencheur d'incident, et seuls les playbooks de déclencheur d'alerte à partir de règles de déclencheur d'alerte : Rule2 ne peut donc pas exécuter PB1 et les comptes ne sont pas désactivés.
references:
  - title: Automate threat response in Microsoft Sentinel with automation rules
    url: https://learn.microsoft.com/en-us/azure/sentinel/automate-incident-handling-with-automation-rules
