id: sc500-4b-table-column-name
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is defining the schema of a new DCR-based custom table named VpnSessions_CL in its Microsoft Sentinel workspace. The table needs a column that stores the source IP address of each session.

    Which column name can you use?
  fr: |
    Woodgrove Bank définit le schéma d'une nouvelle table personnalisée basée sur une DCR nommée VpnSessions_CL dans son espace de travail Microsoft Sentinel. La table a besoin d'une colonne qui stocke l'adresse IP source de chaque session.

    Quel nom de colonne pouvez-vous utiliser ?
body:
  options:
    - { id: a, text: Source-IP }
    - { id: b, text: 1stSourceIp }
    - { id: c, text: SourceIp }
    - { id: d, text: _ResourceId }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A column name must start with a letter, contain only letters, digits and underscores after the first character, and be 2 to 45 characters long. It also can't be one of the reserved names, such as id, TenantId, Type, Title, UniqueId, _ResourceId or _SubscriptionId. SourceIp meets every rule.
    fr: |
      Un nom de colonne doit commencer par une lettre, ne contenir que des lettres, des chiffres et des traits de soulignement après le premier caractère, et compter de 2 à 45 caractères. Il ne doit pas non plus être un nom réservé, comme id, TenantId, Type, Title, UniqueId, _ResourceId ou _SubscriptionId. SourceIp respecte toutes les règles.
  options:
    a:
      en: |
        A hyphen isn't allowed; only letters, digits and underscores are.
      fr: |
        Le trait d'union n'est pas autorisé ; seuls les lettres, les chiffres et les traits de soulignement le sont.
    b:
      en: |
        A column name must start with a letter, not a digit.
      fr: |
        Un nom de colonne doit commencer par une lettre, pas par un chiffre.
    d:
      en: |
        _ResourceId is a reserved column name.
      fr: |
        _ResourceId est un nom de colonne réservé.
references:
  - title: Add or delete tables and columns in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
