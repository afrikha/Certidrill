id: sc500-4a-cspm-explorer-plan
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure subscription named **Sub-Prod**. In Microsoft Defender for Cloud, Sub-Prod has the following configuration:

    | Plan | Status |
    | --- | --- |
    | Foundational CSPM | On |
    | Defender CSPM | Off |
    | Defender for Servers | On (Plan 2, agentless scanning on) |

    The security team can already use cloud security explorer to find virtual machines that store keys and secrets. The team now needs to build queries that correlate internet exposure, vulnerabilities and lateral movement paths between the resources of Sub-Prod.

    What should you do?
  fr: |
    Litware dispose d'un abonnement Azure nommé **Sub-Prod**. Dans Microsoft Defender for Cloud, Sub-Prod a la configuration suivante :

    | Plan | État |
    | --- | --- |
    | Foundational CSPM | On |
    | Defender CSPM | Off |
    | Defender for Servers | On (Plan 2, analyse sans agent activée) |

    L'équipe de sécurité peut déjà utiliser l'explorateur de sécurité cloud pour trouver les machines virtuelles qui stockent des clés et des secrets. Elle doit maintenant créer des requêtes qui corrèlent l'exposition à Internet, les vulnérabilités et les chemins de mouvement latéral entre les ressources de Sub-Prod.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on the Defender for Endpoint integration in the Defender for Servers settings.", fr: "Activer l'intégration de Defender for Endpoint dans les paramètres de Defender for Servers." } }
    - { id: b, text: { en: "Turn on file integrity monitoring in the Defender for Servers settings.", fr: "Activer la surveillance de l'intégrité des fichiers dans les paramètres de Defender for Servers." } }
    - { id: c, text: { en: "Assign the Security Admin role to the security team on Sub-Prod.", fr: "Attribuer le rôle Security Admin à l'équipe de sécurité sur Sub-Prod." } }
    - { id: d, text: { en: "Turn on the Defender CSPM plan on Sub-Prod.", fr: "Activer le plan Defender CSPM sur Sub-Prod." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With Defender for Servers Plan 2 alone, cloud security explorer can only query keys and secrets. The full explorer, including internet exposure and lateral movement between resources, requires the Defender CSPM plan together with agentless scanning, which is already on.
    fr: |-
      Avec Defender for Servers Plan 2 seul, l'explorateur de sécurité cloud ne permet d'interroger que les clés et les secrets. L'explorateur complet, y compris l'exposition à Internet et le mouvement latéral entre ressources, exige le plan Defender CSPM avec l'analyse sans agent, déjà activée ici.
  options:
    a:
      en: |-
        Defender for Endpoint integration adds EDR and agent-based vulnerability data; it does not unlock the cloud security explorer queries.
      fr: |-
        L'intégration de Defender for Endpoint ajoute l'EDR et les données de vulnérabilité basées sur l'agent ; elle ne débloque pas les requêtes de l'explorateur de sécurité cloud.
    b:
      en: |-
        File integrity monitoring tracks changes to files and registry keys; it does not provide exposure or lateral movement context.
      fr: |-
        La surveillance de l'intégrité des fichiers suit les modifications de fichiers et de clés de registre ; elle ne fournit pas de contexte d'exposition ou de mouvement latéral.
    c:
      en: |-
        Security Reader is already enough to use cloud security explorer; the missing piece is the plan, not a role.
      fr: |-
        Security Reader suffit déjà pour utiliser l'explorateur de sécurité cloud ; ce qui manque est le plan, pas un rôle.
references:
  - title: Build queries with cloud security explorer
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-cloud-security-explorer
