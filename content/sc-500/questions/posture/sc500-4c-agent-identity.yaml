id: sc500-4c-agent-identity
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses Microsoft Security Copilot. A Copilot owner is setting up a Microsoft-built agent from the **Agents** page of the Security Copilot portal.

    The agent must not run under the account of any employee, and the identity choice must follow Microsoft's recommendation.

    Which identity option should the owner select during setup?
  fr: |
    Contoso utilise Microsoft Security Copilot. Un Copilot owner configure un agent conçu par Microsoft depuis la page **Agents** du portail Security Copilot.

    L'agent ne doit s'exécuter sous le compte d'aucun employé, et le choix de l'identité doit suivre la recommandation de Microsoft.

    Quelle option d'identité le propriétaire doit-il sélectionner pendant la configuration ?
body:
  options:
    - { id: a, text: { en: "Assign an existing user account", fr: "Assign an existing user account" } }
    - { id: b, text: { en: "Create an agent identity", fr: "Create an agent identity" } }
    - { id: c, text: { en: "An app registration with a client secret", fr: "Une inscription d'application avec une clé secrète client" } }
    - { id: d, text: { en: "The managed identity of the Security Copilot capacity", fr: "L'identité managée de la capacité Security Copilot" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When you set up a Microsoft-built agent, you choose between creating an agent identity, which Microsoft recommends, and assigning an existing user account. An agent identity is dedicated to the agent instead of borrowing a person's account and access.
    fr: |
      Lors de la configuration d'un agent conçu par Microsoft, vous choisissez entre créer une identité d'agent, ce que Microsoft recommande, et attribuer un compte d'utilisateur existant. Une identité d'agent est dédiée à l'agent au lieu d'emprunter le compte et les accès d'une personne.
  options:
    a: { en: "The agent would run under an employee's account and inherit that user's access, which the requirement forbids.", fr: "L'agent s'exécuterait sous le compte d'un employé et hériterait de ses accès, ce que l'exigence interdit." }
    c: { en: "The agent setup doesn't offer an app registration as an identity option.", fr: "La configuration de l'agent ne propose pas d'inscription d'application comme option d'identité." }
    d: { en: "The agent setup doesn't offer the capacity's managed identity; the capacity only provides SCUs.", fr: "La configuration de l'agent ne propose pas l'identité managée de la capacité ; la capacité ne fournit que des SCU." }
references:
  - title: Setup and manage Security Copilot agents
    url: https://learn.microsoft.com/en-us/copilot/security/agents-manage
