id: sc500-4b-table-portal-order
objective: "4.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders needs a new custom table in the Log Analytics workspace that Microsoft Sentinel uses. The data is JSON exported by a point-of-sale system. The system will send the data through the Logs Ingestion API. Before ingestion, a column named CardHolder must be removed from every record. You use the Azure portal and have the Log Analytics Contributor and Monitoring Contributor roles.

    Which four actions should you perform in sequence after you open the Tables page of the workspace? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders a besoin d'une nouvelle table personnalisée dans l'espace de travail Log Analytics utilisé par Microsoft Sentinel. Les données sont du JSON exporté par un système de point de vente. Le système enverra les données via l'API d'ingestion de journaux. Avant l'ingestion, une colonne nommée CardHolder doit être retirée de chaque enregistrement. Vous utilisez le portail Azure et disposez des rôles Log Analytics Contributor et Monitoring Contributor.

    Quelles sont les quatre actions à effectuer dans l'ordre après avoir ouvert la page Tables de l'espace de travail ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Select Create, enter the table name, and choose the table plan.", fr: "Sélectionner Create, saisir le nom de la table et choisir le plan de table." } }
    - { id: dcr, text: { en: "Create a new data collection rule and select a data collection endpoint.", fr: "Créer une nouvelle règle de collecte de données et sélectionner un point de terminaison de collecte de données." } }
    - { id: sample, text: { en: "Select Browse for files and upload a JSON sample of the data.", fr: "Sélectionner Browse for files et charger un exemple JSON des données." } }
    - { id: transform, text: { en: "Open the Transformation editor, add project-away CardHolder to the query, select Run, and then select Apply.", fr: "Ouvrir le Transformation editor, ajouter project-away CardHolder à la requête, sélectionner Run, puis Apply." } }
    - { id: schema, text: { en: "Select Edit schema on the table and add a custom column named CardHolder_CF.", fr: "Sélectionner Edit schema sur la table et ajouter une colonne personnalisée nommée CardHolder_CF." } }
    - { id: ama, text: { en: "Associate the data collection rule with the point-of-sale servers.", fr: "Associer la règle de collecte de données aux serveurs de point de vente." } }
answer:
  sequence: [ create, dcr, sample, transform ]
explanation:
  correct:
    en: |
      From Tables > Create, you enter the name (the portal adds _CL) and the plan, then select or create the DCR and its data collection endpoint. Next you upload a JSON sample so that the portal can infer the schema, and you use the Transformation editor to write the KQL transformation that drops CardHolder before you review the schema and create the table.
    fr: |
      Depuis Tables > Create, vous saisissez le nom (le portail ajoute _CL) et le plan, puis vous sélectionnez ou créez la DCR et son point de terminaison de collecte de données. Vous chargez ensuite un exemple JSON pour que le portail déduise le schéma, et vous utilisez le Transformation editor pour écrire la transformation KQL qui supprime CardHolder avant de vérifier le schéma et de créer la table.
  options:
    schema:
      en: |
        Edit schema adds custom columns to an existing table; it doesn't remove data before ingestion.
      fr: |
        Edit schema ajoute des colonnes personnalisées à une table existante ; il ne supprime pas de données avant l'ingestion.
    ama:
      en: |
        Associating a DCR with machines is for agent-based collection; the exported JSON is sent through the DCR by the Logs Ingestion API.
      fr: |
        L'association d'une DCR à des machines concerne la collecte par agent ; le JSON exporté est envoyé via la DCR par l'API d'ingestion de journaux.
references:
  - title: Add or delete tables and columns in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/create-custom-table
