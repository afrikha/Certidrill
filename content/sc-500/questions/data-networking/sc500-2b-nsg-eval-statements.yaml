id: sc500-2b-nsg-eval-statements
objective: "2.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    A subnet named Subnet1 contains two virtual machines, VM1 and VM2. A network security group named NSG1 is associated with Subnet1. A network security group named NSG2 is associated with the network interface of VM1. The network interface of VM2 has no NSG. NSG1 and NSG2 contain only their default rules, plus the custom rules described in the statements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un sous-réseau nommé Subnet1 contient deux machines virtuelles, VM1 et VM2. Un groupe de sécurité réseau nommé NSG1 est associé à Subnet1. Un groupe de sécurité réseau nommé NSG2 est associé à la carte réseau de VM1. La carte réseau de VM2 n'a pas de NSG. NSG1 et NSG2 ne contiennent que leurs règles par défaut, plus les règles personnalisées décrites dans les affirmations.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If NSG2 has an outbound rule that denies TCP 80 to Internet, NSG1 never evaluates that HTTP traffic from VM1.
        fr: Si NSG2 a une règle sortante qui refuse TCP 80 vers Internet, NSG1 n'évalue jamais ce trafic HTTP issu de VM1.
    - id: s2
      text:
        en: If NSG1 has an inbound rule that allows TCP 80 from Internet, VM1 accepts HTTP connections from the internet.
        fr: Si NSG1 a une règle entrante qui autorise TCP 80 depuis Internet, VM1 accepte les connexions HTTP depuis Internet.
    - id: s3
      text:
        en: If NSG1 has inbound and outbound rules that deny all traffic, VM1 and VM2 can't communicate with each other.
        fr: Si NSG1 a des règles entrantes et sortantes qui refusent tout le trafic, VM1 et VM2 ne peuvent pas communiquer entre elles.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Outbound traffic is evaluated by the network interface NSG first, so a deny in NSG2 drops the traffic before NSG1 sees it. Inbound traffic must be allowed by both NSG1 and NSG2; without an allow rule in NSG2, DenyAllInbound blocks internet HTTP to VM1. Subnet NSG rules also apply to traffic between virtual machines of the same subnet, so deny-all rules in NSG1 stop VM1 and VM2 from communicating.
    fr: |-
      Le trafic sortant est d'abord évalué par le NSG de la carte réseau : un refus dans NSG2 bloque le trafic avant que NSG1 ne le voie. Le trafic entrant doit être autorisé par NSG1 et par NSG2 ; sans règle d'autorisation dans NSG2, DenyAllInbound bloque le HTTP venant d'Internet vers VM1. Les règles du NSG du sous-réseau s'appliquent aussi au trafic entre machines virtuelles du même sous-réseau : des règles qui refusent tout dans NSG1 empêchent VM1 et VM2 de communiquer.
references:
  - title: How network security groups filter network traffic
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
