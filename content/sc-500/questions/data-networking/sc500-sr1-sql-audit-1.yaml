id: sc500-sr1-sql-audit-1
objective: "2.2.2"
type: series_yesno
series: sc500-sr1-sql-audit
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You enable server-level auditing on SQL1 to LAW1.
  fr: Vous activez l'audit au niveau du serveur sur SQL1 vers LAW1.
body:
  solution:
    en: |
      On the **Auditing** page of SQL1, you enable **Azure SQL Auditing** and select **Log Analytics** with LAW1 as the destination.
    fr: |
      Dans la page **Auditing** de SQL1, vous activez **Azure SQL Auditing** et sélectionnez **Log Analytics** avec LAW1 comme destination.
answer: { value: true }
explanation:
  correct:
    en: |
      A server auditing policy applies to all the existing databases of the server and to the databases created on it later, so one configuration covers the weekly new databases. Log Analytics is a supported audit destination; when you select it, a diagnostic setting with the SQLSecurityAuditEvents category is created for you.
    fr: |
      Une stratégie d'audit de serveur s'applique à toutes les bases de données existantes du serveur et aux bases de données créées ultérieurement : une seule configuration couvre les nouvelles bases de données hebdomadaires. Log Analytics est une destination d'audit prise en charge ; lorsque vous la sélectionnez, un paramètre de diagnostic avec la catégorie SQLSecurityAuditEvents est créé automatiquement.
references:
  - title: Set up Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-setup
