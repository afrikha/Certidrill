id: sc500-sr2-avnm-deny-1
objective: "2.3.2"
type: series_yesno
series: sc500-sr2-avnm-deny
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You deploy a Deny security admin rule to a network group that has dynamic membership.
  fr: Vous déployez une règle d'administration de sécurité Deny sur un groupe réseau à appartenance dynamique.
body:
  solution:
    en: |
      In AVNM1, you perform the following actions:

      1. You create a network group named **NG-Prod** and define its membership dynamically by using Azure Policy, with a condition that matches the virtual networks whose tag **env** equals **prod**.
      2. You create a security admin configuration that contains a rule collection targeting NG-Prod, with one rule: **Action** Deny, **Direction** Inbound, **Priority** 100, **Protocol** TCP, **Source** the **Internet** service tag, **Destination port** 22, 3389.
      3. You deploy the security admin configuration to West Europe.
    fr: |
      Dans AVNM1, vous effectuez les actions suivantes :

      1. Vous créez un groupe réseau nommé **NG-Prod** et définissez son appartenance de façon dynamique à l'aide d'Azure Policy, avec une condition qui sélectionne les réseaux virtuels dont l'étiquette **env** est égale à **prod**.
      2. Vous créez une configuration d'administration de sécurité qui contient un regroupement de règles ciblant NG-Prod, avec une règle : **Action** Deny, **Direction** Inbound, **Priority** 100, **Protocol** TCP, **Source** la balise de service **Internet**, **Destination port** 22, 3389.
      3. Vous déployez la configuration d'administration de sécurité dans West Europe.
answer: { value: true }
explanation:
  correct:
    en: Azure Policy adds every virtual network that meets the tag condition to NG-Prod, including the networks created later, and the deployed configuration then applies to them. Security admin rules are evaluated before NSG rules, and a Deny rule ends the evaluation, so no NSG rule written by an application team can allow the blocked ports.
    fr: "Azure Policy ajoute à NG-Prod chaque réseau virtuel qui remplit la condition sur l'étiquette, y compris les réseaux créés ultérieurement, et la configuration déployée s'applique alors à eux. Les règles d'administration de sécurité sont évaluées avant les règles NSG et une règle Deny met fin à l'évaluation : aucune règle NSG écrite par une équipe applicative ne peut autoriser les ports bloqués."
references:
