id: sc500-2b-nsg-nic-subnet
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named VM1 runs a web application on TCP 443 and has a Standard SKU public IP address. VM1 is connected to Subnet1.

    | NSG | Associated with | Custom inbound rules |
    | --- | --- | --- |
    | NSG-Subnet1 | Subnet1 | Priority 100: allow TCP 443 from Internet |
    | NSG-VM1 | Network interface of VM1 | Priority 200: allow TCP 3389 from 10.10.0.0/24 |

    Users on the internet can't reach the application on VM1. You must restore access while keeping both NSGs associated.

    What should you do?
  fr: |
    Une machine virtuelle nommée VM1 exécute une application web sur le port TCP 443 et possède une adresse IP publique de référence SKU Standard. VM1 est connectée à Subnet1.

    | NSG | Associé à | Règles de trafic entrant personnalisées |
    | --- | --- | --- |
    | NSG-Subnet1 | Subnet1 | Priorité 100 : autoriser TCP 443 depuis Internet |
    | NSG-VM1 | Carte réseau de VM1 | Priorité 200 : autoriser TCP 3389 depuis 10.10.0.0/24 |

    Les utilisateurs sur Internet ne peuvent pas atteindre l'application de VM1. Vous devez rétablir l'accès en conservant les deux NSG associés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an outbound rule to NSG-VM1 that allows TCP 443 to Internet.", fr: "Ajouter à NSG-VM1 une règle sortante qui autorise TCP 443 vers Internet." } }
    - { id: b, text: { en: "Add an inbound rule to NSG-VM1 that allows TCP 443 from Internet.", fr: "Ajouter à NSG-VM1 une règle entrante qui autorise TCP 443 depuis Internet." } }
    - { id: c, text: { en: "Change the priority of the NSG-Subnet1 rule from 100 to 4096.", fr: "Changer la priorité de la règle de NSG-Subnet1 de 100 à 4096." } }
    - { id: d, text: { en: "Add an inbound rule to NSG-Subnet1 that allows TCP 443 from VirtualNetwork.", fr: "Ajouter à NSG-Subnet1 une règle entrante qui autorise TCP 443 depuis VirtualNetwork." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      For inbound traffic, Azure evaluates the subnet NSG first and then the network interface NSG, and traffic must be allowed by both. NSG-Subnet1 allows TCP 443, but in NSG-VM1 no rule matches internet HTTPS, so the default DenyAllInbound rule drops it. An inbound allow rule for TCP 443 in NSG-VM1 fixes the issue.
    fr: |-
      Pour le trafic entrant, Azure évalue d'abord le NSG du sous-réseau, puis celui de la carte réseau, et le trafic doit être autorisé par les deux. NSG-Subnet1 autorise TCP 443, mais dans NSG-VM1 aucune règle ne correspond au trafic HTTPS venant d'Internet : la règle par défaut DenyAllInbound le bloque. Une règle entrante d'autorisation pour TCP 443 dans NSG-VM1 résout le problème.
  options:
    a: { en: "NSGs are stateful: the responses of an allowed inbound flow are allowed without an outbound rule.", fr: "Les NSG sont avec état : les réponses d'un flux entrant autorisé sont autorisées sans règle sortante." }
    c: { en: "The subnet rule already allows the traffic; changing its priority doesn't affect the deny in NSG-VM1.", fr: "La règle du sous-réseau autorise déjà le trafic ; changer sa priorité n'a aucun effet sur le refus de NSG-VM1." }
    d: { en: "Internet clients don't match the VirtualNetwork tag, and the traffic is blocked in NSG-VM1, not in NSG-Subnet1.", fr: "Les clients Internet ne correspondent pas à l'étiquette VirtualNetwork, et le trafic est bloqué dans NSG-VM1, pas dans NSG-Subnet1." }
references:
  - title: How network security groups filter network traffic
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
