id: sc500-2a-sql-tde-key-loss
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure SQL Database logical server named **sql-wg-core**. Transparent data encryption (TDE) uses a customer-managed TDE protector stored in a key vault named **kv-wg-tde**. The server's managed identity has the Key Vault Crypto Service Encryption User role on the key.

    During a cleanup, an administrator removes that role assignment.

    What is the effect on the databases of sql-wg-core?
  fr: |
    Woodgrove Bank dispose d'un serveur logique Azure SQL Database nommé **sql-wg-core**. Le chiffrement transparent des données (TDE) utilise un protecteur TDE géré par le client, stocké dans un coffre de clés nommé **kv-wg-tde**. L'identité managée du serveur dispose du rôle Key Vault Crypto Service Encryption User sur la clé.

    Lors d'un nettoyage, un administrateur supprime cette attribution de rôle.

    Quel est l'effet sur les bases de données de sql-wg-core ?
body:
  options:
    - { id: a, text: { en: "The databases stay online, and only columns protected with Always Encrypted become unreadable.", fr: "Les bases de données restent en ligne, et seules les colonnes protégées par Always Encrypted deviennent illisibles." } }
    - { id: b, text: { en: "The server falls back to a service-managed TDE protector, and the databases stay online.", fr: "Le serveur revient à un protecteur TDE géré par le service, et les bases de données restent en ligne." } }
    - { id: c, text: { en: "The databases stay online, but new data is written unencrypted until the role is restored.", fr: "Les bases de données restent en ligne, mais les nouvelles données sont écrites sans chiffrement jusqu'au rétablissement du rôle." } }
    - { id: d, text: { en: "The databases become inaccessible until the server regains access to the TDE protector.", fr: "Les bases de données deviennent inaccessibles jusqu'à ce que le serveur récupère l'accès au protecteur TDE." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When the server loses access to the customer-managed TDE protector, the database encryption keys can no longer be unwrapped: the databases deny all connections and move to the Inaccessible state. If access is restored within 30 minutes, the databases heal automatically; after that, recovery needs manual steps.
    fr: |
      Quand le serveur perd l'accès au protecteur TDE géré par le client, les clés de chiffrement des bases de données ne peuvent plus être désencapsulées : les bases refusent toutes les connexions et passent à l'état Inaccessible. Si l'accès est rétabli dans les 30 minutes, les bases de données se rétablissent automatiquement ; au-delà, la récupération exige des étapes manuelles.
  options:
    a:
      en: |
        TDE protects the whole database at rest; Always Encrypted uses its own column keys and is unrelated to the TDE protector.
      fr: |
        TDE protège toute la base de données au repos ; Always Encrypted utilise ses propres clés de colonne et n'a aucun rapport avec le protecteur TDE.
    b:
      en: |
        There is no automatic fallback to a service-managed key; losing the key is designed to act as a kill switch.
      fr: |
        Il n'existe pas de retour automatique à une clé gérée par le service ; la perte de la clé est conçue pour agir comme un coupe-circuit.
    c:
      en: |
        TDE never writes unencrypted data; without the protector the database can't be opened at all.
      fr: |
        TDE n'écrit jamais de données non chiffrées ; sans le protecteur, la base de données ne peut pas du tout être ouverte.
references:
  - title: Azure SQL Transparent Data Encryption with customer-managed key
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
