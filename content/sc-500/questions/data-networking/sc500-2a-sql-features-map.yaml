id: sc500-2a-sql-features-map
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys hosts a customer database named **db-loyalty** in Azure SQL Database. The security team has four requirements for db-loyalty.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys héberge une base de données clients nommée **db-loyalty** dans Azure SQL Database. L'équipe de sécurité a quatre exigences pour db-loyalty.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tde, text: { en: "Transparent data encryption (TDE)", fr: "Chiffrement transparent des données (TDE)" } }
    - { id: ae, text: Always Encrypted }
    - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
    - { id: rls, text: { en: "Row-level security", fr: "Sécurité au niveau des lignes" } }
    - { id: entra, text: { en: "Microsoft Entra-only authentication", fr: "Authentification Microsoft Entra uniquement" } }
  targets:
    - id: t1
      text: { en: "Encrypt the data files, log files and backups at rest.", fr: "Chiffrer au repos les fichiers de données, les fichiers journaux et les sauvegardes." }
    - id: t2
      text: { en: "Keep the card number column encrypted so that even database administrators can't read the plaintext.", fr: "Garder la colonne des numéros de carte chiffrée afin que même les administrateurs de base de données ne puissent pas lire le texte en clair." }
    - id: t3
      text: { en: "Show support agents only the last four digits of phone numbers in query results.", fr: "N'afficher aux agents du support que les quatre derniers chiffres des numéros de téléphone dans les résultats des requêtes." }
    - id: t4
      text: { en: "Return to each store manager only the rows of their own store.", fr: "Ne renvoyer à chaque responsable de magasin que les lignes de son propre magasin." }
answer:
  mapping: { t1: tde, t2: ae, t3: ddm, t4: rls }
explanation:
  correct:
    en: |
      TDE encrypts data files, logs and backups at rest. Always Encrypted keeps sensitive columns encrypted from the database engine and its administrators, because the keys stay on the client side. Dynamic data masking hides part of a value in query results for non-privileged users without encrypting it. Row-level security filters the rows that each user can see.
    fr: |
      TDE chiffre au repos les fichiers de données, les journaux et les sauvegardes. Always Encrypted garde les colonnes sensibles chiffrées vis-à-vis du moteur de base de données et de ses administrateurs, car les clés restent côté client. Le masquage dynamique des données masque une partie d'une valeur dans les résultats des requêtes pour les utilisateurs non privilégiés, sans la chiffrer. La sécurité au niveau des lignes filtre les lignes que chaque utilisateur peut voir.
  options:
    entra: { en: "Microsoft Entra-only authentication disables SQL authentication; it doesn't protect or filter data.", fr: "L'authentification Microsoft Entra uniquement désactive l'authentification SQL ; elle ne protège ni ne filtre les données." }
references:
  - title: An overview of Azure SQL Database and SQL Managed Instance security capabilities
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-overview
