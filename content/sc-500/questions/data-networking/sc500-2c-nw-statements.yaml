id: sc500-2c-nw-statements
objective: "2.3.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet1** in the West Europe region of a subscription named Sub1 contains a virtual machine named **VM1** and a private endpoint named **pe-sql**. NSGs are associated with the subnets and with the network interface of VM1. An Azure Virtual Network Manager security admin configuration is deployed to VNet1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet1**, dans la région West Europe d'un abonnement nommé Sub1, contient une machine virtuelle nommée **VM1** et un point de terminaison privé nommé **pe-sql**. Des NSG sont associés aux sous-réseaux et à la carte réseau de VM1. Une configuration d'administration de la sécurité d'Azure Virtual Network Manager est déployée sur VNet1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The effective security rules of the network interface of VM1 include the security admin rules applied to VNet1.
        fr: Les règles de sécurité effectives de la carte réseau de VM1 incluent les règles d'administration de la sécurité appliquées à VNet1.
    - id: s2
      text:
        en: To run IP flow verify for VM1, you need a Network Watcher instance in the West Europe region of Sub1.
        fr: Pour exécuter la vérification des flux IP pour VM1, il faut une instance Network Watcher dans la région West Europe de Sub1.
    - id: s3
      text:
        en: In the Azure portal, you can display the effective security rules of the network interface of pe-sql.
        fr: Dans le portail Azure, vous pouvez afficher les règles de sécurité effectives de la carte réseau de pe-sql.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: The effective security rules of a network interface aggregate the NSG of the network interface, the NSG of its subnet and the admin rules applied by Azure Virtual Network Manager. IP flow verify requires a Network Watcher instance in the subscription and region of the virtual machine. Effective routes and security rules are not displayed for the network interface of a private endpoint in the Azure portal.
    fr: Les règles de sécurité effectives d'une carte réseau regroupent le NSG de la carte réseau, le NSG de son sous-réseau et les règles d'administration appliquées par Azure Virtual Network Manager. La vérification des flux IP exige une instance Network Watcher dans l'abonnement et la région de la machine virtuelle. Les itinéraires et règles de sécurité effectifs ne sont pas affichés pour la carte réseau d'un point de terminaison privé dans le portail Azure.
references:
  - title: Effective security rules overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/effective-security-rules-overview
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
