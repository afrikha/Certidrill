id: sc500-2a-sql-vnet-rule
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure SQL Database logical server named **sql-contoso-crm** in the West Europe region. Public network access is set to **Selected networks**, and **Allow Azure services and resources to access this server** is selected. A web app integrated with a subnet named **snet-web** of a virtual network named **VNet-CRM** connects to the server.

    A security review requires that only resources in snet-web can connect to sql-contoso-crm. Private endpoints must not be used.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un serveur logique Azure SQL Database nommé **sql-contoso-crm** dans la région West Europe. L'accès réseau public est défini sur **Selected networks**, et **Allow Azure services and resources to access this server** est sélectionné. Une application web intégrée à un sous-réseau nommé **snet-web** du réseau virtuel **VNet-CRM** se connecte au serveur.

    Une revue de sécurité exige que seules les ressources de snet-web puissent se connecter à sql-contoso-crm. Les points de terminaison privés ne doivent pas être utilisés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep Allow Azure services selected and add a server-level IP firewall rule for the outbound IP addresses of the web app.", fr: "Laisser Allow Azure services sélectionné et ajouter une règle de pare-feu IP au niveau du serveur pour les adresses IP sortantes de l'application web." } }
    - { id: b, text: { en: "Enable the Microsoft.Sql service endpoint on snet-web, add a virtual network rule for snet-web, and clear Allow Azure services.", fr: "Activer le point de terminaison de service Microsoft.Sql sur snet-web, ajouter une règle de réseau virtuel pour snet-web et désélectionner Allow Azure services." } }
    - { id: c, text: { en: "Add a database-level IP firewall rule for the address range of snet-web, and clear Allow Azure services.", fr: "Ajouter une règle de pare-feu IP au niveau de la base de données pour la plage d'adresses de snet-web et désélectionner Allow Azure services." } }
    - { id: d, text: { en: "Set the connection policy of sql-contoso-crm to Redirect and clear Allow Azure services.", fr: "Définir la stratégie de connexion de sql-contoso-crm sur Redirect et désélectionner Allow Azure services." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Allow Azure services and resources to access this server admits connections from any Azure service, including other customers' subscriptions, so it must be cleared. A virtual network rule, which requires the Microsoft.Sql service endpoint on the subnet, then admits only the traffic from snet-web.
    fr: |
      Allow Azure services and resources to access this server admet les connexions de n'importe quel service Azure, y compris depuis les abonnements d'autres clients : il faut donc le désélectionner. Une règle de réseau virtuel, qui exige le point de terminaison de service Microsoft.Sql sur le sous-réseau, n'admet ensuite que le trafic de snet-web.
  options:
    a:
      en: |
        As long as Allow Azure services stays selected, every Azure resource can still reach the server.
      fr: |
        Tant qu'Allow Azure services reste sélectionné, toute ressource Azure peut encore joindre le serveur.
    c:
      en: |
        IP firewall rules match the public source address; traffic from a subnet isn't matched by its private range.
      fr: |
        Les règles de pare-feu IP correspondent à l'adresse source publique ; le trafic d'un sous-réseau n'est pas reconnu par sa plage privée.
    d:
      en: |
        The connection policy only changes how connections are routed to the database; it doesn't admit or block any network.
      fr: |
        La stratégie de connexion ne change que la manière dont les connexions sont acheminées vers la base de données ; elle n'admet ni ne bloque aucun réseau.
references:
  - title: Use virtual network service endpoints and rules for servers in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
