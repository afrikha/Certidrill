id: sc500-2b-nsg-behavior-multi
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You manage network security groups (NSGs) for virtual machines in an Azure subscription. An administrator is connected to VM1 over SSH through an inbound allow rule in the NSG of VM1's subnet.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez des groupes de sécurité réseau (NSG) pour des machines virtuelles d'un abonnement Azure. Un administrateur est connecté à VM1 en SSH grâce à une règle entrante d'autorisation du NSG du sous-réseau de VM1.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "If you delete the SSH allow rule, the current SSH session stays connected, but new SSH connections are blocked.", fr: "Si vous supprimez la règle d'autorisation SSH, la session SSH en cours reste connectée, mais les nouvelles connexions SSH sont bloquées." } }
    - { id: b, text: { en: "The response traffic of the SSH session needs an outbound allow rule in the same NSG.", fr: "Le trafic de réponse de la session SSH exige une règle sortante d'autorisation dans le même NSG." } }
    - { id: c, text: { en: "You can delete the default DenyAllInbound rule if a custom rule with priority 4096 denies all traffic.", fr: "Vous pouvez supprimer la règle par défaut DenyAllInbound si une règle personnalisée de priorité 4096 refuse tout le trafic." } }
    - { id: d, text: { en: "Two inbound rules in the same NSG can't have the same priority.", fr: "Deux règles entrantes du même NSG ne peuvent pas avoir la même priorité." } }
    - { id: e, text: { en: "You can select the ESP and AH protocols for a rule in the Azure portal.", fr: "Vous pouvez sélectionner les protocoles ESP et AH pour une règle dans le portail Azure." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |-
      Rule changes apply only to new connections: removing a rule doesn't interrupt existing flows, which keep their flow record. Two rules with the same priority and direction can't coexist in one NSG, because processing order would be ambiguous.
    fr: |-
      Les changements de règles ne s'appliquent qu'aux nouvelles connexions : supprimer une règle n'interrompt pas les flux existants, qui conservent leur enregistrement de flux. Deux règles de même priorité et de même direction ne peuvent pas coexister dans un NSG, car l'ordre de traitement serait ambigu.
  options:
    b: { en: "NSGs are stateful: an inbound allow rule also covers the response traffic of the flow.", fr: "Les NSG sont avec état : une règle entrante d'autorisation couvre aussi le trafic de réponse du flux." }
    c: { en: "Default rules can't be removed; they can only be overridden by rules with a lower priority number.", fr: "Les règles par défaut ne peuvent pas être supprimées ; elles peuvent seulement être remplacées par des règles de numéro de priorité plus petit." }
    e: { en: "ESP and AH are valid NSG protocols, but they aren't available in the portal; you set them through ARM templates.", fr: "ESP et AH sont des protocoles de NSG valides, mais ils ne sont pas disponibles dans le portail ; ils se définissent par des modèles ARM." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
