id: sc500-2a-acct-cmk-access-policy
objective: "2.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has an existing storage account named **stproseware** and a key vault named **kv-proseware**. kv-proseware uses the **Vault access policy** permission model. Soft delete is enabled on kv-proseware, and purge protection is not enabled. kv-proseware contains an RSA 2048-bit key named **key-stor**.

    You enable the system-assigned managed identity of stproseware. You need to configure stproseware to encrypt its data with key-stor.

    Which two actions should you perform before you select the key in the encryption settings of stproseware? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un compte de stockage existant nommé **stproseware** et d'un coffre de clés nommé **kv-proseware**. kv-proseware utilise le modèle d'autorisation **Vault access policy**. La suppression réversible est activée sur kv-proseware, mais pas la protection contre le vidage. kv-proseware contient une clé RSA de 2 048 bits nommée **key-stor**.

    Vous activez l'identité managée affectée par le système de stproseware. Vous devez configurer stproseware pour qu'il chiffre ses données avec key-stor.

    Quelles sont les deux actions à effectuer avant de sélectionner la clé dans les paramètres de chiffrement de stproseware ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Key Vault Crypto Service Encryption User role on key-stor to the identity of stproseware.", fr: "Attribuer le rôle Key Vault Crypto Service Encryption User sur key-stor à l'identité de stproseware." } }
    - { id: b, text: { en: "Enable purge protection on kv-proseware.", fr: "Activer la protection contre le vidage sur kv-proseware." } }
    - { id: c, text: { en: "Add an access policy that grants the get, wrapkey and unwrapkey key permissions to the identity of stproseware.", fr: "Ajouter une stratégie d'accès qui accorde les autorisations de clé get, wrapkey et unwrapkey à l'identité de stproseware." } }
    - { id: d, text: { en: "Enable infrastructure encryption on stproseware.", fr: "Activer le chiffrement d'infrastructure sur stproseware." } }
    - { id: e, text: { en: "Add an access policy that grants the get and list secret permissions to the identity of stproseware.", fr: "Ajouter une stratégie d'accès qui accorde les autorisations de secret get et list à l'identité de stproseware." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Azure Storage accepts a customer-managed key only from a vault that has both soft delete and purge protection enabled, so purge protection must be turned on first. Because kv-proseware uses the access policy model, the identity of the account gets its key permissions (get, wrapkey and unwrapkey) through an access policy, not through an Azure role.
    fr: |
      Le Stockage Azure n'accepte une clé gérée par le client que d'un coffre où la suppression réversible et la protection contre le vidage sont activées : il faut donc d'abord activer la protection contre le vidage. Comme kv-proseware utilise le modèle de stratégie d'accès, l'identité du compte reçoit ses autorisations de clé (get, wrapkey et unwrapkey) par une stratégie d'accès, et non par un rôle Azure.
  options:
    a:
      en: |
        Azure RBAC roles for Key Vault data are evaluated only when the vault uses the Azure role-based access control permission model.
      fr: |
        Les rôles Azure RBAC pour les données de Key Vault ne sont évalués que si le coffre utilise le modèle d'autorisation Azure RBAC.
    d:
      en: |
        Infrastructure encryption is unrelated to customer-managed keys and can be enabled only when an account is created.
      fr: |
        Le chiffrement d'infrastructure est indépendant des clés gérées par le client et ne peut être activé qu'à la création d'un compte.
    e:
      en: |
        The account wraps and unwraps its encryption key with a key, so it needs key permissions, not secret permissions.
      fr: |
        Le compte encapsule et désencapsule sa clé de chiffrement avec une clé : il a besoin d'autorisations de clé, pas d'autorisations de secret.
references:
  - title: Customer-managed keys for Azure Storage encryption
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
