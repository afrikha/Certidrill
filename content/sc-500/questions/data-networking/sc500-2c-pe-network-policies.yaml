id: sc500-2c-pe-network-policies
objective: "2.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet-Data** in a resource group named RG-Data contains a subnet named **snet-pe** that hosts private endpoints for Azure SQL Database and Azure Storage. A network security group named nsg-pe and a route table named rt-pe are associated with snet-pe. Network policies for private endpoints are disabled on snet-pe.

    You need the rules of nsg-pe to filter the traffic to the private endpoints. The routes of rt-pe must not apply to the private endpoints.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet-Data**, dans un groupe de ressources nommé RG-Data, contient un sous-réseau nommé **snet-pe** qui héberge des points de terminaison privés pour Azure SQL Database et Stockage Azure. Un groupe de sécurité réseau nommé nsg-pe et une table de routage nommée rt-pe sont associés à snet-pe. Les stratégies réseau des points de terminaison privés sont désactivées sur snet-pe.

    Les règles de nsg-pe doivent filtrer le trafic vers les points de terminaison privés. Les itinéraires de rt-pe ne doivent pas s'appliquer aux points de terminaison privés.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network [[cmd]] \
      --resource-group RG-Data \
      --vnet-name VNet-Data \
      --name snet-pe \
      --private-endpoint-network-policies [[val]]
  slots:
    - id: cmd
      options:
        - { id: subnet, text: vnet subnet update }
        - { id: pe, text: private-endpoint update }
        - { id: nsg, text: nsg update }
        - { id: vnet, text: vnet update }
    - id: val
      options:
        - { id: enabled, text: Enabled }
        - { id: disabled, text: Disabled }
        - { id: nsgonly, text: NetworkSecurityGroupEnabled }
        - { id: rtonly, text: RouteTableEnabled }
answer:
  values: { cmd: subnet, val: nsgonly }
explanation:
  correct:
    en: Network policies for private endpoints are a property of the subnet, so you change them with `az network vnet subnet update`. The value `NetworkSecurityGroupEnabled` applies NSG rules to the private endpoints of the subnet while user-defined routes keep not applying to them.
    fr: "Les stratégies réseau des points de terminaison privés sont une propriété du sous-réseau : vous les modifiez avec `az network vnet subnet update`. La valeur `NetworkSecurityGroupEnabled` applique les règles NSG aux points de terminaison privés du sous-réseau, tandis que les itinéraires définis par l'utilisateur continuent de ne pas s'y appliquer."
  options:
    pe: { en: "The setting is defined on the subnet, not on each private endpoint.", fr: "Le paramètre est défini sur le sous-réseau, pas sur chaque point de terminaison privé." }
    nsg: { en: "The NSG is already associated; the setting that makes it apply to private endpoints belongs to the subnet.", fr: "Le NSG est déjà associé ; le paramètre qui le fait s'appliquer aux points de terminaison privés appartient au sous-réseau." }
    enabled: { en: "Enabled applies both NSGs and route tables, so the routes of rt-pe would apply too.", fr: "Enabled applique à la fois les NSG et les tables de routage : les itinéraires de rt-pe s'appliqueraient aussi." }
    rtonly: { en: "RouteTableEnabled applies the route table but not the NSG.", fr: "RouteTableEnabled applique la table de routage mais pas le NSG." }
references:
  - title: Manage network policies for private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
  - title: az network vnet subnet
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/subnet
