id: sc500-2c-pe-public-access
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a key vault named **kv-fabrikam**. You create a private endpoint for kv-fabrikam in a subnet named **snet-pe** of a virtual network named VNet1, and you integrate it with the `privatelink.vaultcore.azure.net` private DNS zone. Virtual machines in VNet1 now resolve kv-fabrikam to a private IP address.

    A security review shows that clients on the internet can still connect to kv-fabrikam.

    You need to ensure that kv-fabrikam accepts connections only through the private endpoint.

    What should you do?
  fr: |
    Vous disposez d'un coffre de clés nommé **kv-fabrikam**. Vous créez un point de terminaison privé pour kv-fabrikam dans un sous-réseau nommé **snet-pe** d'un réseau virtuel nommé VNet1, et vous l'intégrez à la zone DNS privée `privatelink.vaultcore.azure.net`. Les machines virtuelles de VNet1 résolvent désormais kv-fabrikam en adresse IP privée.

    Une revue de sécurité montre que des clients sur Internet peuvent toujours se connecter à kv-fabrikam.

    Vous devez faire en sorte que kv-fabrikam n'accepte les connexions que par le point de terminaison privé.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable private endpoint network policies on snet-pe.", fr: "Activer les stratégies réseau des points de terminaison privés sur snet-pe." }
    - id: b
      text: { en: "Set the public network access of kv-fabrikam to Disabled.", fr: "Régler l'accès au réseau public de kv-fabrikam sur Disabled." }
    - id: c
      text: { en: "Associate an NSG that denies Internet traffic with snet-pe.", fr: "Associer à snet-pe un NSG qui refuse le trafic Internet." }
    - id: d
      text: { en: "Enable a Microsoft.KeyVault service endpoint on snet-pe.", fr: "Activer un point de terminaison de service Microsoft.KeyVault sur snet-pe." }
answer: { optionId: b }
explanation:
  correct:
    en: A private endpoint adds a private IP address for the key vault but does not restrict its public endpoint. Disabling public network access on kv-fabrikam makes the service reject connections that do not arrive through a private endpoint, whatever the DNS resolution.
    fr: Un point de terminaison privé ajoute une adresse IP privée pour le coffre de clés mais ne restreint pas son point de terminaison public. Désactiver l'accès au réseau public de kv-fabrikam fait rejeter par le service les connexions qui n'arrivent pas par un point de terminaison privé, quelle que soit la résolution DNS.
  options:
    a:
      en: Network policies let NSGs and route tables apply to private endpoints in the subnet; they do not affect the public endpoint of the key vault.
      fr: Les stratégies réseau permettent aux NSG et aux tables de routage de s'appliquer aux points de terminaison privés du sous-réseau ; elles n'ont aucun effet sur le point de terminaison public du coffre de clés.
    c:
      en: Internet clients connect to the public endpoint of the key vault, not to snet-pe, so an NSG on snet-pe does not stop them.
      fr: "Les clients Internet se connectent au point de terminaison public du coffre de clés, pas à snet-pe : un NSG sur snet-pe ne les arrête pas."
    d:
      en: A service endpoint identifies a subnet to the service firewall; it does not block other public clients by itself.
      fr: Un point de terminaison de service identifie un sous-réseau auprès du pare-feu du service ; il ne bloque pas à lui seul les autres clients publics.
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
