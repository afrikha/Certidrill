id: sc500-2b-vwan-statements
objective: "2.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Standard Azure Virtual WAN with one secured virtual hub named Hub1. Hub1 connects 15 branch offices by site-to-site VPN and 20 spoke virtual networks. Hub1 contains an Azure Firewall.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un Azure Virtual WAN Standard avec un hub virtuel sécurisé nommé Hub1. Hub1 connecte 15 succursales par VPN site à site et 20 réseaux virtuels spoke. Hub1 contient un Pare-feu Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To inspect branch-to-branch traffic within Hub1, you must configure routing intent.
        fr: Pour inspecter le trafic de branche à branche au sein de Hub1, vous devez configurer l'intention de routage.
    - id: s2
      text:
        en: The spokes need user-defined routes that point to the firewall for their traffic to be inspected.
        fr: Les spokes ont besoin d'itinéraires définis par l'utilisateur pointant vers le pare-feu pour que leur trafic soit inspecté.
    - id: s3
      text:
        en: Hub1 can use Azure Firewall as the next hop of its Private traffic policy and a SaaS firewall as the next hop of its Internet traffic policy.
        fr: Hub1 peut utiliser le Pare-feu Azure comme tronçon suivant de sa stratégie Trafic privé et un pare-feu SaaS comme tronçon suivant de sa stratégie Trafic Internet.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      Routing intent is required to secure inter-hub and branch-to-branch traffic, even within a single hub. In a secured virtual hub, routing to the security solution is automated, so spokes don't need their own user-defined routes. Private and Internet traffic policies can use different next hops, for example Azure Firewall for private traffic and a SaaS solution for internet traffic.
    fr: |-
      L'intention de routage est nécessaire pour sécuriser le trafic entre hubs et de branche à branche, même au sein d'un seul hub. Dans un hub virtuel sécurisé, le routage vers la solution de sécurité est automatisé : les spokes n'ont pas besoin de leurs propres itinéraires définis par l'utilisateur. Les stratégies Trafic privé et Trafic Internet peuvent utiliser des tronçons suivants différents, par exemple le Pare-feu Azure pour le trafic privé et une solution SaaS pour le trafic Internet.
references:
  - title: What is a secured virtual hub?
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/secured-virtual-hub
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
