id: sc500-2a-rbac-listkeys
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a storage account named **stadatumfin** that allows Shared Key authorization. During an access review, you find that several users downloaded blobs from stadatumfin by using connection strings that contain the account keys. None of these users has a Storage Blob Data role.

    Which two built-in roles assigned on stadatumfin could have let these users retrieve the account keys?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un compte de stockage nommé **stadatumfin** qui autorise l'autorisation par clé partagée. Lors d'une revue d'accès, vous constatez que plusieurs utilisateurs ont téléchargé des objets blob de stadatumfin avec des chaînes de connexion contenant les clés du compte. Aucun de ces utilisateurs ne dispose d'un rôle Storage Blob Data.

    Quels sont les deux rôles intégrés, attribués sur stadatumfin, qui ont pu permettre à ces utilisateurs de récupérer les clés du compte ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Reader }
    - { id: b, text: Storage Account Contributor }
    - { id: c, text: Storage Blob Delegator }
    - { id: d, text: Reader and Data Access }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Both Storage Account Contributor and Reader and Data Access include the Microsoft.Storage/storageAccounts/listkeys/action permission. A user who can list the keys can read and write all data in the account through Shared Key, even without any data role.
    fr: |
      Storage Account Contributor et Reader and Data Access incluent tous deux l'autorisation Microsoft.Storage/storageAccounts/listkeys/action. Un utilisateur capable de lister les clés peut lire et écrire toutes les données du compte par clé partagée, même sans rôle de données.
  options:
    a:
      en: |
        Reader can view the account but can't list its keys.
      fr: |
        Reader peut consulter le compte mais ne peut pas lister ses clés.
    c:
      en: |
        Storage Blob Delegator only allows requesting a user delegation key; it doesn't expose the account keys.
      fr: |
        Storage Blob Delegator permet seulement de demander une clé de délégation d'utilisateur ; il n'expose pas les clés du compte.
references:
  - title: Choose how to authorize access to blob data in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-data-operations-portal
