id: sc500-2b-vwan-pe-symmetry
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a secured virtual hub named Hub1 with a routing intent Private traffic policy whose next hop is Azure Firewall. A spoke virtual network named VNet-Data is connected to Hub1. VNet-Data contains a subnet named snet-pe that hosts private endpoints for Azure Storage and Azure Key Vault.

    Connections from the on-premises network, which reaches Hub1 over ExpressRoute, to the private endpoints fail intermittently. The firewall logs show only one direction of these flows. All the traffic to the private endpoints must be inspected by the firewall.

    What should you do?
  fr: |
    Contoso dispose d'un hub virtuel sécurisé nommé Hub1 avec une stratégie d'intention de routage Trafic privé dont le tronçon suivant est le Pare-feu Azure. Un réseau virtuel spoke nommé VNet-Data est connecté à Hub1. VNet-Data contient un sous-réseau nommé snet-pe qui héberge des points de terminaison privés pour Stockage Azure et Azure Key Vault.

    Les connexions depuis le réseau local, qui atteint Hub1 par ExpressRoute, vers les points de terminaison privés échouent par intermittence. Les journaux du pare-feu ne montrent qu'un sens de ces flux. Tout le trafic vers les points de terminaison privés doit être inspecté par le pare-feu.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the /32 address of each private endpoint to the Private Traffic Prefixes of Hub1.", fr: "Ajouter l'adresse /32 de chaque point de terminaison privé aux préfixes de trafic privé de Hub1." } }
    - { id: b, text: { en: "Enable Route Table network policies for private endpoints on snet-pe.", fr: "Activer les stratégies réseau de table de routage pour les points de terminaison privés sur snet-pe." } }
    - { id: c, text: { en: "Add an Internet traffic policy to Hub1 with Azure Firewall as next hop.", fr: "Ajouter à Hub1 une stratégie Trafic Internet avec le Pare-feu Azure comme tronçon suivant." } }
    - { id: d, text: { en: "Enable ExpressRoute Global Reach on the circuit that connects the on-premises network.", fr: "Activer ExpressRoute Global Reach sur le circuit qui connecte le réseau local." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      By default, on-premises traffic to private endpoints in connected virtual networks bypasses the routing intent next hop, which causes asymmetric routing that the stateful firewall drops. Enabling Route Table network policies for private endpoints on the subnets that host them makes the return traffic follow the firewall path too.
    fr: |-
      Par défaut, le trafic local vers des points de terminaison privés situés dans des réseaux virtuels connectés contourne le tronçon suivant de l'intention de routage, ce qui crée un routage asymétrique que le pare-feu avec état rejette. Activer les stratégies réseau de table de routage pour les points de terminaison privés sur les sous-réseaux qui les hébergent fait aussi passer le trafic de retour par le pare-feu.
  options:
    a: { en: "Microsoft states that /32 routes in the Private Traffic prefixes don't ensure symmetric routing for private endpoints.", fr: "Microsoft indique que des itinéraires /32 dans les préfixes de trafic privé ne garantissent pas un routage symétrique pour les points de terminaison privés." }
    c: { en: "An Internet traffic policy handles internet-bound traffic; this traffic stays private.", fr: "Une stratégie Trafic Internet traite le trafic à destination d'Internet ; ce trafic reste privé." }
    d: { en: "Global Reach connects ExpressRoute circuits to each other; it doesn't change the path to private endpoints.", fr: "Global Reach relie des circuits ExpressRoute entre eux ; il ne change pas le chemin vers les points de terminaison privés." }
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
