id: sc500-2c-pls-visibility
objective: "2.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You publish a billing service through a Private Link service named **pls-billing**. Two partners will consume it:

    - Fabrikam, from a subscription named Sub-Fab in the Fabrikam tenant
    - Northwind, from a subscription named Sub-NW in the Northwind tenant

    Users of both partners have no accounts or role assignments in your tenant. You have the following requirements:

    - Only Sub-Fab and Sub-NW must be able to request a connection to pls-billing.
    - Connection requests from Sub-Fab must be approved without any action by your team.
    - Connection requests from Sub-NW must be reviewed and approved manually.

    How should you configure pls-billing? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous publiez un service de facturation par un service Private Link nommé **pls-billing**. Deux partenaires vont le consommer :

    - Fabrikam, depuis un abonnement nommé Sub-Fab dans le locataire Fabrikam
    - Northwind, depuis un abonnement nommé Sub-NW dans le locataire Northwind

    Les utilisateurs des deux partenaires n'ont ni compte ni attribution de rôle dans votre locataire. Vous avez les exigences suivantes :

    - Seuls Sub-Fab et Sub-NW doivent pouvoir demander une connexion à pls-billing.
    - Les demandes de connexion de Sub-Fab doivent être approuvées sans aucune action de votre équipe.
    - Les demandes de connexion de Sub-NW doivent être examinées et approuvées manuellement.

    Comment devez-vous configurer pls-billing ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Visibility: [[vis]]

      Auto-approval: [[auto]]
    fr: |
      Visibilité : [[vis]]

      Approbation automatique : [[auto]]
  slots:
    - id: vis
      options:
        - { id: rbac, text: Role-based access control only }
        - { id: both, text: "Restricted by subscription: Sub-Fab and Sub-NW" }
        - { id: fab, text: "Restricted by subscription: Sub-Fab only" }
        - { id: alias, text: Anyone with your alias }
    - id: auto
      options:
        - { id: afab, text: Sub-Fab }
        - { id: aboth, text: Sub-Fab and Sub-NW }
        - { id: anw, text: Sub-NW }
        - { id: anone, text: { en: "No subscription", fr: "Aucun abonnement" } }
answer:
  values: { vis: both, auto: afab }
explanation:
  correct:
    en: Visibility controls who can see the service and request a connection, so it must list both partner subscriptions; Restricted by subscription is the option designed for consumers in other tenants. Auto-approval controls approval and is a subset of the visibility list, so it contains only Sub-Fab, and requests from Sub-NW stay Pending until you approve them.
    fr: "La visibilité contrôle qui peut voir le service et demander une connexion : elle doit donc lister les deux abonnements partenaires, et Restricted by subscription est l'option prévue pour des consommateurs d'autres locataires. L'approbation automatique contrôle l'approbation et constitue un sous-ensemble de la liste de visibilité : elle ne contient que Sub-Fab, et les demandes de Sub-NW restent En attente jusqu'à ce que vous les approuviez."
  options:
    rbac: { en: "This option relies on role-based access control for users, and the partners have no role assignments in your tenant.", fr: "Cette option repose sur le contrôle d'accès en fonction du rôle des utilisateurs, et les partenaires n'ont aucune attribution de rôle dans votre locataire." }
    fab: { en: "Sub-NW would not be able to request a connection at all.", fr: "Sub-NW ne pourrait pas du tout demander de connexion." }
    alias: { en: "Anyone with the alias could request a connection, not only the two partners.", fr: "N'importe qui disposant de l'alias pourrait demander une connexion, pas seulement les deux partenaires." }
    aboth: { en: "Requests from Sub-NW would be approved automatically instead of being reviewed.", fr: "Les demandes de Sub-NW seraient approuvées automatiquement au lieu d'être examinées." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
