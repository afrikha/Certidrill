id: sc500-2a-fw-onprem-vpn
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a storage account named **stfabrikamdata**. Public network access of stfabrikamdata is set to **Enabled from selected networks**.

    On-premises application servers in the 192.168.10.0/24 range connect to a hub virtual network named **VNet-Hub** through a site-to-site VPN. The servers have no direct internet access.

    You need the on-premises servers to reach the blob endpoint of stfabrikamdata through the VPN.

    What should you do?
  fr: |
    Fabrikam dispose d'un compte de stockage nommé **stfabrikamdata**. L'accès réseau public de stfabrikamdata est défini sur **Enabled from selected networks**.

    Des serveurs d'applications locaux de la plage 192.168.10.0/24 se connectent à un réseau virtuel hub nommé **VNet-Hub** par un VPN de site à site. Les serveurs n'ont aucun accès direct à Internet.

    Vous devez permettre aux serveurs locaux de joindre le point de terminaison blob de stfabrikamdata par le VPN.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an IP network rule for 192.168.10.0/24 to stfabrikamdata.", fr: "Ajouter une règle de réseau IP pour 192.168.10.0/24 à stfabrikamdata." } }
    - { id: b, text: { en: "Enable a Microsoft.Storage service endpoint on GatewaySubnet and add a virtual network rule for it.", fr: "Activer un point de terminaison de service Microsoft.Storage sur GatewaySubnet et ajouter une règle de réseau virtuel pour ce sous-réseau." } }
    - { id: c, text: { en: "Add a resource instance rule for the VPN gateway of VNet-Hub to stfabrikamdata.", fr: "Ajouter une règle d'instance de ressource pour la passerelle VPN de VNet-Hub à stfabrikamdata." } }
    - { id: d, text: { en: "Create a private endpoint for the blob sub-resource in VNet-Hub and make on-premises DNS resolve it.", fr: "Créer un point de terminaison privé pour la sous-ressource blob dans VNet-Hub et faire résoudre son nom par le DNS local." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A private endpoint gives the account a private IP address in VNet-Hub, which the on-premises servers reach through the VPN like any other address in the virtual network. On-premises DNS must resolve the account name to that private address (zone privatelink.blob.core.windows.net), for example through a DNS forwarder.
    fr: |
      Un point de terminaison privé donne au compte une adresse IP privée dans VNet-Hub, que les serveurs locaux joignent par le VPN comme toute autre adresse du réseau virtuel. Le DNS local doit résoudre le nom du compte vers cette adresse privée (zone privatelink.blob.core.windows.net), par exemple au moyen d'un redirecteur DNS.
  options:
    a:
      en: |
        IP network rules accept only public internet addresses; RFC 1918 ranges such as 192.168.0.0/16 aren't allowed.
      fr: |
        Les règles de réseau IP n'acceptent que des adresses Internet publiques ; les plages RFC 1918 comme 192.168.0.0/16 ne sont pas autorisées.
    b:
      en: |
        A service endpoint optimizes traffic that leaves the subnet's own resources toward the service's public endpoint; it doesn't give on-premises clients a path to the account over the VPN.
      fr: |
        Un point de terminaison de service optimise le trafic émis par les ressources du sous-réseau vers le point de terminaison public du service ; il ne donne pas aux clients locaux un chemin vers le compte par le VPN.
    c:
      en: |
        Resource instance rules admit specific Azure resource instances, such as an Azure Synapse workspace, by their identity; a VPN gateway isn't a client of the account.
      fr: |
        Les règles d'instance de ressource admettent certaines instances de ressources Azure, comme un espace de travail Azure Synapse, par leur identité ; une passerelle VPN n'est pas un client du compte.
references:
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
  - title: Guidelines and limitations for the Azure Storage firewall
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
