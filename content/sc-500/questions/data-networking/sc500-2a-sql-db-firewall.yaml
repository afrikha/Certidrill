id: sc500-2a-sql-db-firewall
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has an Azure SQL Database logical server named **sql-litware** that hosts ten databases. A database named **db-partner** is geo-replicated to a secondary server.

    A partner that uses the public IP range 198.51.100.0/24 must be able to connect to db-partner only. The firewall setting must move with the database to the secondary server so that it still works after a failover.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un serveur logique Azure SQL Database nommé **sql-litware** qui héberge dix bases de données. Une base de données nommée **db-partner** est géorépliquée vers un serveur secondaire.

    Un partenaire qui utilise la plage IP publique 198.51.100.0/24 doit pouvoir se connecter uniquement à db-partner. Le paramètre de pare-feu doit suivre la base de données sur le serveur secondaire pour continuer à fonctionner après un basculement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run sp_set_firewall_rule in the master database of sql-litware.", fr: "Exécuter sp_set_firewall_rule dans la base de données master de sql-litware." } }
    - { id: b, text: { en: "Run az sql server firewall-rule create for sql-litware.", fr: "Exécuter az sql server firewall-rule create pour sql-litware." } }
    - { id: c, text: { en: "Run sp_set_database_firewall_rule in db-partner.", fr: "Exécuter sp_set_database_firewall_rule dans db-partner." } }
    - { id: d, text: { en: "Add a virtual network rule to sql-litware for the partner's range.", fr: "Ajouter à sql-litware une règle de réseau virtuel pour la plage du partenaire." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A database-level IP firewall rule applies to one database and is stored in that database, so it is replicated with it and keeps working after a failover. Database-level rules can be created only with T-SQL, by running sp_set_database_firewall_rule in the user database.
    fr: |
      Une règle de pare-feu IP au niveau de la base de données s'applique à une seule base et est stockée dans cette base : elle est répliquée avec elle et continue de fonctionner après un basculement. Les règles au niveau de la base de données ne peuvent être créées qu'en T-SQL, en exécutant sp_set_database_firewall_rule dans la base de données utilisateur.
  options:
    a:
      en: |
        sp_set_firewall_rule in master creates a server-level rule, which admits the range to all ten databases and isn't stored in db-partner.
      fr: |
        sp_set_firewall_rule dans master crée une règle au niveau du serveur, qui admet la plage sur les dix bases de données et n'est pas stockée dans db-partner.
    b:
      en: |
        The Azure CLI creates server-level rules only, which apply to every database of the server.
      fr: |
        Azure CLI crée uniquement des règles au niveau du serveur, qui s'appliquent à toutes les bases de données du serveur.
    d:
      en: |
        Virtual network rules admit subnets of Azure virtual networks, not a partner's public IP range, and they apply to the whole server.
      fr: |
        Les règles de réseau virtuel admettent des sous-réseaux de réseaux virtuels Azure, pas la plage IP publique d'un partenaire, et elles s'appliquent à tout le serveur.
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
