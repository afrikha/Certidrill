id: sc500-2a-acct-settings-map
objective: "2.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is creating a storage account named **stwingtipdocs**. The security team lists four requirements for the account.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys crée un compte de stockage nommé **stwingtipdocs**. L'équipe de sécurité liste quatre exigences pour le compte.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: secure, text: Secure transfer required }
    - { id: infra, text: Infrastructure encryption }
    - { id: oauth, text: Default to Microsoft Entra authorization in the Azure portal }
    - { id: sharedkey, text: Allow storage account key access }
    - { id: anon, text: Allow Blob anonymous access }
    - { id: tls, text: Minimum TLS version }
  targets:
    - id: t1
      text: { en: "Reject every request that is sent over HTTP.", fr: "Rejeter toute requête envoyée en HTTP." }
    - id: t2
      text: { en: "Add a second layer of encryption at rest that uses a different key.", fr: "Ajouter une seconde couche de chiffrement au repos qui utilise une autre clé." }
    - id: t3
      text: { en: "Make the portal use the signed-in user's identity instead of the account key when users browse blob data.", fr: "Faire en sorte que le portail utilise l'identité de l'utilisateur connecté plutôt que la clé de compte quand les utilisateurs consultent les données blob." } 
    - id: t4
      text: { en: "Deny requests signed with an account key, including service SAS and account SAS.", fr: "Refuser les requêtes signées avec une clé de compte, y compris les SAS de service et les SAS de compte." }
answer:
  mapping: { t1: secure, t2: infra, t3: oauth, t4: sharedkey }
explanation:
  correct:
    en: |
      Secure transfer required rejects HTTP requests. Infrastructure encryption adds a second AES-256 layer with a different Microsoft-managed key and must be chosen at creation. Default to Microsoft Entra authorization in the Azure portal makes the portal authorize data access with the user's identity by default. Disabling Allow storage account key access denies every request authorized with Shared Key, which includes service and account SAS.
    fr: |
      Secure transfer required rejette les requêtes HTTP. Le chiffrement d'infrastructure ajoute une seconde couche AES-256 avec une autre clé gérée par Microsoft et doit être choisi à la création. Default to Microsoft Entra authorization in the Azure portal fait autoriser par défaut l'accès aux données dans le portail avec l'identité de l'utilisateur. Désactiver Allow storage account key access refuse toute requête autorisée par clé partagée, ce qui inclut les SAS de service et de compte.
  options:
    anon: { en: "Anonymous access concerns requests without any credential, not HTTP, keys or portal authorization.", fr: "L'accès anonyme concerne les requêtes sans aucune information d'identification, pas HTTP, les clés ni l'autorisation dans le portail." }
    tls: { en: "The minimum TLS version filters the TLS protocol version of HTTPS requests; it doesn't reject plain HTTP by itself.", fr: "La version TLS minimale filtre la version du protocole TLS des requêtes HTTPS ; elle ne rejette pas à elle seule le HTTP simple." }
references:
  - title: Security recommendations for Blob storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/security-recommendations
