id: sc500-2c-pls-subnet-policy
objective: "2.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet-Svc** in a resource group named RG-Svc contains the following subnets.

    | Subnet | Content |
    | --- | --- |
    | snet-app | Backend virtual machines and the frontend IP configuration of the internal Standard Load Balancer lb-api |
    | snet-pls | Subnet that you selected for the NAT IP configuration of a Private Link service named pls-api |
    | snet-mgmt | Management jump box |

    You plan to create pls-api by using the Azure CLI. You need to prepare the virtual network before you run `az network private-link-service create`.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet-Svc**, dans un groupe de ressources nommé RG-Svc, contient les sous-réseaux suivants.

    | Sous-réseau | Contenu |
    | --- | --- |
    | snet-app | Machines virtuelles du back-end et configuration IP frontale du Standard Load Balancer interne lb-api |
    | snet-pls | Sous-réseau choisi pour la configuration IP NAT d'un service Private Link nommé pls-api |
    | snet-mgmt | Serveur de rebond d'administration |

    Vous prévoyez de créer pls-api avec Azure CLI. Vous devez préparer le réseau virtuel avant d'exécuter `az network private-link-service create`.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network vnet subnet update \
      --resource-group RG-Svc \
      --vnet-name VNet-Svc \
      --name [[sub]] \
      --[[param]] [[val]]
  slots:
    - id: sub
      options:
        - { id: pls, text: snet-pls }
        - { id: app, text: snet-app }
        - { id: mgmt, text: snet-mgmt }
    - id: param
      options:
        - { id: plsnp, text: private-link-service-network-policies }
        - { id: penp, text: private-endpoint-network-policies }
        - { id: deleg, text: delegations }
    - id: val
      options:
        - { id: disabled, text: Disabled }
        - { id: enabled, text: Enabled }
        - { id: nsgen, text: NetworkSecurityGroupEnabled }
answer:
  values: { sub: pls, param: plsnp, val: disabled }
explanation:
  correct:
    en: The source IP addresses of a Private Link service come from the subnet of its NAT IP configuration, and that subnet must have `privateLinkServiceNetworkPolicies` set to Disabled. The portal changes this setting automatically when it creates the service, but with the Azure CLI, PowerShell or a template it is an extra step. The setting affects only the Private Link service; other resources of the subnet stay governed by their NSG rules.
    fr: Les adresses IP sources d'un service Private Link proviennent du sous-réseau de sa configuration IP NAT, et ce sous-réseau doit avoir `privateLinkServiceNetworkPolicies` réglé sur Disabled. Le portail modifie ce paramètre automatiquement quand il crée le service, mais avec Azure CLI, PowerShell ou un modèle, c'est une étape supplémentaire. Le paramètre ne concerne que le service Private Link ; les autres ressources du sous-réseau restent soumises à leurs règles NSG.
  options:
    app: { en: "The frontend and backend subnet is not where the Private Link service takes its NAT IP addresses.", fr: "Le sous-réseau du front-end et du back-end n'est pas celui où le service Private Link prend ses adresses IP NAT." }
    penp: { en: "This parameter controls NSG and route support for private endpoints, not the source IP of a Private Link service.", fr: "Ce paramètre contrôle la prise en charge des NSG et des itinéraires pour les points de terminaison privés, pas l'adresse IP source d'un service Private Link." }
    deleg: { en: "Subnet delegation dedicates a subnet to a service such as Azure Container Instances; it is not required here.", fr: "La délégation de sous-réseau dédie un sous-réseau à un service tel qu'Azure Container Instances ; elle n'est pas nécessaire ici." }
    nsgen: { en: "NetworkSecurityGroupEnabled is a value of the private endpoint parameter only.", fr: "NetworkSecurityGroupEnabled est une valeur du seul paramètre des points de terminaison privés." }
references:
  - title: Disable network policies for Azure Private Link service source IP address
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-link-service-network-policy
  - title: az network vnet subnet
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/subnet
