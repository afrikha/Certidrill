id: sc500-2b-vwan-basic-type
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Virtual WAN named VWAN-Adatum of type **Basic**. It contains one hub that terminates site-to-site VPN connections from 12 branch offices. The hub has no routes in its Routing section.

    You need to convert the hub to a secured virtual hub that uses Azure Firewall, so that branch-to-internet traffic is inspected. Existing branch connections must be kept.

    What should you do first?
  fr: |
    Adatum dispose d'un Azure Virtual WAN nommé VWAN-Adatum de type **Basic**. Il contient un hub qui termine les connexions VPN site à site de 12 succursales. Le hub n'a aucun itinéraire dans sa section Routage.

    Vous devez convertir le hub en hub virtuel sécurisé utilisant le Pare-feu Azure, pour que le trafic des branches vers Internet soit inspecté. Les connexions des succursales existantes doivent être conservées.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Convert the hub in Azure Firewall Manager and select Azure Firewall as the security provider.", fr: "Convertir le hub dans Azure Firewall Manager et sélectionner le Pare-feu Azure comme fournisseur de sécurité." } }
    - { id: b, text: { en: "Deploy Azure Firewall in a spoke virtual network and connect it to the hub.", fr: "Déployer le Pare-feu Azure dans un réseau virtuel spoke et le connecter au hub." } }
    - { id: c, text: { en: "Upgrade VWAN-Adatum from the Basic type to the Standard type.", fr: "Mettre à niveau VWAN-Adatum du type Basic vers le type Standard." } }
    - { id: d, text: { en: "Create a second virtual WAN of type Standard and move the hub into it.", fr: "Créer un second Virtual WAN de type Standard et y déplacer le hub." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Basic virtual WAN supports only site-to-site VPN; Azure Firewall and NVAs in the hub require the Standard type. You can upgrade a virtual WAN from Basic to Standard in place, which keeps the existing site-to-site connections, but you can't downgrade it later. Then you can convert the hub with Azure Firewall Manager.
    fr: |-
      Un Virtual WAN Basic ne prend en charge que le VPN site à site ; le Pare-feu Azure et les NVA dans le hub exigent le type Standard. Vous pouvez mettre à niveau un Virtual WAN de Basic vers Standard sur place, ce qui conserve les connexions site à site existantes, mais vous ne pouvez pas revenir à Basic ensuite. Vous pouvez alors convertir le hub avec Azure Firewall Manager.
  options:
    a: { en: "Conversion requires Azure Firewall in the hub, which a Basic virtual WAN doesn't support.", fr: "La conversion exige le Pare-feu Azure dans le hub, ce qu'un Virtual WAN Basic ne prend pas en charge." }
    b: { en: "A Basic hub provides no transit between connections, and a firewall in a spoke doesn't make the hub a secured virtual hub.", fr: "Un hub Basic n'assure aucun transit entre connexions, et un pare-feu dans un spoke ne fait pas du hub un hub virtuel sécurisé." }
    d: { en: "Hubs aren't moved between virtual WANs; upgrading the existing virtual WAN keeps the branch connections.", fr: "Les hubs ne se déplacent pas d'un Virtual WAN à un autre ; la mise à niveau du Virtual WAN existant conserve les connexions des succursales." }
references:
  - title: "Azure Virtual WAN Types: Basic and Standard"
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
  - title: What is a secured virtual hub?
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/secured-virtual-hub
