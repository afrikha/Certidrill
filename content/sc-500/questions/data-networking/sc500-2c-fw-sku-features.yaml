id: sc500-2c-fw-sku-features
objective: "2.3.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso is comparing the Azure Firewall SKUs for its web filtering requirements.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso compare les références SKU du Pare-feu Azure pour ses exigences de filtrage web.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure Firewall Basic supports DNS proxy, so you can use FQDNs in its network rules.", fr: "Le Pare-feu Azure Basic prend en charge le proxy DNS : vous pouvez utiliser des FQDN dans ses règles de réseau." } }
    - { id: b, text: { en: "Azure Firewall Standard classifies web categories by examining only the FQDN of a request.", fr: "Le Pare-feu Azure Standard classe les catégories web en examinant uniquement le FQDN d'une requête." } }
    - { id: c, text: { en: "Azure Firewall Premium decrypts inbound HTTPS connections from the internet to published web apps.", fr: "Le Pare-feu Azure Premium déchiffre les connexions HTTPS entrantes d'Internet vers des applications web publiées." } }
    - { id: d, text: { en: "Azure Firewall Premium can filter HTTPS by full URL path when TLS inspection is enabled on the application rule.", fr: "Le Pare-feu Azure Premium peut filtrer le HTTPS par chemin d'URL complet quand l'inspection TLS est activée sur la règle d'application." } }
    - { id: e, text: { en: "Azure Firewall Standard includes IDPS in alert-only mode.", fr: "Le Pare-feu Azure Standard inclut l'IDPS en mode alerte uniquement." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Standard web categories look at the FQDN only, while Premium examines the complete URL. Premium URL filtering considers the entire URL, such as a path under a site, for HTTPS once TLS inspection is enabled at the application rule level.
    fr: Les catégories web de Standard n'examinent que le FQDN, alors que Premium examine l'URL complète. Le filtrage d'URL de Premium prend en compte l'URL entière, par exemple un chemin sous un site, pour le HTTPS dès que l'inspection TLS est activée au niveau de la règle d'application.
  options:
    a: { en: "DNS proxy, custom DNS and FQDN filtering in network rules are available in Standard and Premium, not in Basic.", fr: "Le proxy DNS, le DNS personnalisé et le filtrage par FQDN dans les règles de réseau sont disponibles dans Standard et Premium, pas dans Basic." }
    c: { en: "Inbound TLS inspection is done by the Web Application Firewall on Application Gateway; Premium inspects outbound and east-west TLS.", fr: "L'inspection TLS entrante est assurée par le Web Application Firewall d'Application Gateway ; Premium inspecte le TLS sortant et est-ouest." }
    e: { en: "IDPS is available only in the Premium SKU.", fr: "L'IDPS n'est disponible que dans la référence SKU Premium." }
references:
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
  - title: Azure Firewall Premium features implementation guide
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-features
