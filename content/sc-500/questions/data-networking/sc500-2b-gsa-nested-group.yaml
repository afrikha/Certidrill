id: sc500-2b-gsa-nested-group
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You configure Quick Access in Microsoft Entra Private Access and assign the group **GRP-Remote** to the Quick Access app. GRP-Remote contains the group **GRP-Sales** as a member, and the users of the sales department are members of GRP-Sales only. The Private access traffic forwarding profile is enabled.

    Sales users can't reach the private resources, while users who are direct members of GRP-Remote can. You need to give the sales users access.

    What should you do?
  fr: |
    Vous configurez Quick Access dans Microsoft Entra Private Access et attribuez le groupe **GRP-Remote** à l'application Quick Access. GRP-Remote contient le groupe **GRP-Sales** comme membre, et les utilisateurs du service commercial ne sont membres que de GRP-Sales. Le profil de transfert du trafic Private Access est activé.

    Les commerciaux ne peuvent pas atteindre les ressources privées, alors que les membres directs de GRP-Remote le peuvent. Vous devez donner l'accès aux commerciaux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign GRP-Sales directly to the Quick Access app.", fr: "Attribuer directement GRP-Sales à l'application Quick Access." } }
    - { id: b, text: { en: "Change GRP-Remote to a dynamic membership group.", fr: "Faire de GRP-Remote un groupe à appartenance dynamique." } }
    - { id: c, text: { en: "Add a second connector to the connector group.", fr: "Ajouter un second connecteur au groupe de connecteurs." } }
    - { id: d, text: { en: "Exclude GRP-Sales from the Conditional Access policies.", fr: "Exclure GRP-Sales des stratégies d'accès conditionnel." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Users must be assigned directly to the Quick Access app or be direct members of a group assigned to it; nested groups aren't supported. Assigning GRP-Sales to the app gives its members access.
    fr: |-
      Les utilisateurs doivent être attribués directement à l'application Quick Access ou être membres directs d'un groupe qui lui est attribué ; les groupes imbriqués ne sont pas pris en charge. Attribuer GRP-Sales à l'application donne l'accès à ses membres.
  options:
    b: { en: "The issue is nesting, not the membership type; the sales users would still be members of GRP-Sales only.", fr: "Le problème vient de l'imbrication, pas du type d'appartenance ; les commerciaux resteraient membres de GRP-Sales uniquement." }
    c: { en: "Connectors work, since direct members of GRP-Remote can connect; adding one doesn't change assignments.", fr: "Les connecteurs fonctionnent, puisque les membres directs de GRP-Remote se connectent ; en ajouter un ne change pas les attributions." }
    d: { en: "Excluding users from Conditional Access weakens security and doesn't create the missing app assignment.", fr: "Exclure des utilisateurs de l'accès conditionnel affaiblit la sécurité et ne crée pas l'attribution manquante." }
references:
  - title: How to configure Quick Access for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-quick-access
