id: sc500-2a-fw-cross-region
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a storage account named **stwingtipwest** in the West US region. Public network access is set to **Enabled from selected networks**, and no rules are defined yet.

    Virtual machines in a subnet named **snet-batch** of a virtual network named **VNet-East** in the East US region must access stwingtipwest. snet-batch has no service endpoints. The solution must not use private endpoints.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un compte de stockage nommé **stwingtipwest** dans la région West US. L'accès réseau public est défini sur **Enabled from selected networks**, et aucune règle n'est encore définie.

    Les machines virtuelles d'un sous-réseau nommé **snet-batch** du réseau virtuel **VNet-East**, dans la région East US, doivent accéder à stwingtipwest. snet-batch n'a aucun point de terminaison de service. La solution ne doit pas utiliser de points de terminaison privés.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the Microsoft.Storage service endpoint on snet-batch.", fr: "Activer le point de terminaison de service Microsoft.Storage sur snet-batch." } }
    - { id: b, text: { en: "Enable the Microsoft.Storage.Global service endpoint on snet-batch.", fr: "Activer le point de terminaison de service Microsoft.Storage.Global sur snet-batch." } }
    - { id: c, text: { en: "Add a virtual network rule for snet-batch to stwingtipwest.", fr: "Ajouter une règle de réseau virtuel pour snet-batch à stwingtipwest." } }
    - { id: d, text: { en: "Add an IP network rule for the address space of VNet-East to stwingtipwest.", fr: "Ajouter une règle de réseau IP pour l'espace d'adressage de VNet-East à stwingtipwest." } }
    - { id: e, text: { en: "Select the exception Allow Azure services on the trusted services list to access this storage account.", fr: "Sélectionner l'exception Allow Azure services on the trusted services list to access this storage account." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      The Microsoft.Storage.Global service endpoint provides connectivity to storage accounts in any region, whereas Microsoft.Storage covers accounts in the same region as the virtual network. With the endpoint in place, a virtual network rule for snet-batch admits the subnet's traffic through the firewall.
    fr: |
      Le point de terminaison de service Microsoft.Storage.Global assure la connectivité vers des comptes de stockage de n'importe quelle région, alors que Microsoft.Storage couvre les comptes de la même région que le réseau virtuel. Une fois le point de terminaison en place, une règle de réseau virtuel pour snet-batch admet le trafic du sous-réseau à travers le pare-feu.
  options:
    a:
      en: |
        Microsoft.Storage connects the subnet to storage accounts in its own region (East US), not to an account in West US.
      fr: |
        Microsoft.Storage relie le sous-réseau aux comptes de stockage de sa propre région (East US), pas à un compte en West US.
    d:
      en: |
        IP network rules accept only public addresses; the private address space of a virtual network can't be added.
      fr: |
        Les règles de réseau IP n'acceptent que des adresses publiques ; l'espace d'adressage privé d'un réseau virtuel ne peut pas être ajouté.
    e:
      en: |
        Trusted services are specific Azure services, not virtual machines in your virtual networks.
      fr: |
        Les services approuvés sont certains services Azure, pas des machines virtuelles de vos réseaux virtuels.
references:
  - title: Firewall rules and network access control for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
