id: sc500-2b-nsg-asg-purpose
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a virtual network named VNet1 that contains a subnet named Subnet-App. Subnet-App hosts web servers and API servers, and virtual machines are added and removed every week. A network security group named NSG-App is associated with Subnet-App.

    You need NSG-App to allow TCP 8443 from the web servers to the API servers only. The rule must keep working when virtual machines are added or removed, without editing IP addresses in the rule.

    What should you use as the source and destination of the rule?
  fr: |
    Vous disposez d'un réseau virtuel nommé VNet1 qui contient un sous-réseau nommé Subnet-App. Subnet-App héberge des serveurs web et des serveurs d'API, et des machines virtuelles sont ajoutées et supprimées chaque semaine. Un groupe de sécurité réseau nommé NSG-App est associé à Subnet-App.

    NSG-App doit autoriser le port TCP 8443 des serveurs web vers les serveurs d'API uniquement. La règle doit continuer à fonctionner quand des machines virtuelles sont ajoutées ou supprimées, sans modifier d'adresses IP dans la règle.

    Que devez-vous utiliser comme source et destination de la règle ?
body:
  options:
    - { id: a, text: { en: "Two application security groups", fr: "Deux groupes de sécurité d'application" } }
    - { id: b, text: { en: "Two service tags", fr: "Deux étiquettes de service" } }
    - { id: c, text: { en: "Two Azure Firewall IP groups", fr: "Deux groupes IP du Pare-feu Azure" } }
    - { id: d, text: { en: "Two Virtual Network Manager network groups", fr: "Deux groupes réseau de Virtual Network Manager" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Application security groups group network interfaces by application role, so an NSG rule can use asg-web as the source and asg-api as the destination. A new virtual machine is covered as soon as its network interface joins the group, and the rule never lists IP addresses.
    fr: |-
      Les groupes de sécurité d'application regroupent les cartes réseau par rôle applicatif : une règle de NSG peut donc utiliser asg-web comme source et asg-api comme destination. Une nouvelle machine virtuelle est couverte dès que sa carte réseau rejoint le groupe, et la règle ne liste jamais d'adresses IP.
  options:
    b: { en: "Service tags represent the IP prefixes of Azure services, not groups of your own virtual machines.", fr: "Les étiquettes de service représentent les préfixes IP de services Azure, pas des groupes de vos propres machines virtuelles." }
    c: { en: "IP groups are used in Azure Firewall rules, not as the source or destination of an NSG rule, and they still list IP addresses.", fr: "Les groupes IP s'utilisent dans les règles du Pare-feu Azure, pas comme source ou destination d'une règle de NSG, et ils listent toujours des adresses IP." }
    d: { en: "Network groups contain virtual networks and are targets of Virtual Network Manager configurations, not NSG rule endpoints.", fr: "Les groupes réseau contiennent des réseaux virtuels et sont la cible des configurations de Virtual Network Manager, pas des extrémités de règles de NSG." }
references:
  - title: Application security groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
