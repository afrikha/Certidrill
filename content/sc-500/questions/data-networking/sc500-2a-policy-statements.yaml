id: sc500-2a-policy-statements
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. plans to use stored access policies on a container named **invoices** in a storage account named **stproseinv** to control the SAS tokens given to its accounting partners.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. prévoit d'utiliser des stratégies d'accès stockées sur un conteneur nommé **invoices** d'un compte de stockage nommé **stproseinv** pour contrôler les jetons SAS remis à ses partenaires comptables.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can define up to five stored access policies on the invoices container.
        fr: |
          Vous pouvez définir jusqu'à cinq stratégies d'accès stockées sur le conteneur invoices.
    - id: s2
      text:
        en: |
          If a stored access policy defines an expiry time, a service SAS that references it can set its own, later expiry time to override the policy.
        fr: |
          Si une stratégie d'accès stockée définit une heure d'expiration, une SAS de service qui la référence peut définir sa propre heure d'expiration, plus tardive, pour remplacer celle de la stratégie.
    - id: s3
      text:
        en: |
          A user delegation SAS for the invoices container can reference a stored access policy so that it can be revoked by deleting the policy.
        fr: |
          Une SAS de délégation d'utilisateur pour le conteneur invoices peut référencer une stratégie d'accès stockée afin d'être révoquée par la suppression de la stratégie.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A container, file share, queue or table supports up to five stored access policies. Each constraint (start time, expiry, permissions) is set either in the policy or in the SAS, never in both, so a SAS can't override a value the policy defines. Only service SAS tokens can reference a stored access policy; a user delegation SAS is revoked through its user delegation key.
    fr: |
      Un conteneur, un partage de fichiers, une file d'attente ou une table prend en charge jusqu'à cinq stratégies d'accès stockées. Chaque contrainte (heure de début, expiration, autorisations) est définie soit dans la stratégie, soit dans la SAS, jamais dans les deux : une SAS ne peut donc pas remplacer une valeur définie par la stratégie. Seules les SAS de service peuvent référencer une stratégie d'accès stockée ; une SAS de délégation d'utilisateur se révoque par sa clé de délégation d'utilisateur.
references:
  - title: Define a stored access policy
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
