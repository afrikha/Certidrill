id: sc500-2a-def-cap
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a storage account named **stingest** that receives about 15,000 GB of new blobs each month. Defender for Storage is enabled at the subscription level with on-upload malware scanning and the default settings.

    Around the 20th of each month, the security team receives an alert, and blobs uploaded after that date are no longer scanned until the next month.

    You need every blob uploaded to stingest to be scanned.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un compte de stockage nommé **stingest** qui reçoit environ 15 000 Go de nouveaux objets blob chaque mois. Defender for Storage est activé au niveau de l'abonnement avec l'analyse des programmes malveillants au chargement et les paramètres par défaut.

    Vers le 20 de chaque mois, l'équipe de sécurité reçoit une alerte, et les objets blob chargés après cette date ne sont plus analysés jusqu'au mois suivant.

    Vous devez faire en sorte que chaque objet blob chargé dans stingest soit analysé.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the monthly malware scanning cap of stingest above 15,000 GB.", fr: "Relever le plafond mensuel d'analyse des programmes malveillants de stingest au-delà de 15 000 Go." } }
    - { id: b, text: { en: "Turn on sensitive data threat detection for stingest.", fr: "Activer la détection des menaces sur les données sensibles pour stingest." } }
    - { id: c, text: { en: "Send the scan results of stingest to an Event Grid custom topic.", fr: "Envoyer les résultats d'analyse de stingest vers une rubrique personnalisée Event Grid." } }
    - { id: d, text: { en: "Turn off the blob index tags that store the scan results of stingest.", fr: "Désactiver les balises d'index de blob qui stockent les résultats d'analyse de stingest." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Malware scanning has a monthly cap per storage account, 10,000 GB by default. When the cap is reached, scanning stops for the rest of the month, with alerts at 75 % and 100 %. Raising the cap at the account or subscription level above the monthly volume keeps every upload scanned.
    fr: |
      L'analyse des programmes malveillants a un plafond mensuel par compte de stockage, de 10 000 Go par défaut. Quand le plafond est atteint, l'analyse s'arrête pour le reste du mois, avec des alertes à 75 % et 100 %. Relever le plafond au niveau du compte ou de l'abonnement au-delà du volume mensuel permet d'analyser chaque chargement.
  options:
    b:
      en: |
        Sensitive data threat detection helps prioritize alerts on accounts that hold sensitive data; it doesn't change the scanning cap.
      fr: |
        La détection des menaces sur les données sensibles aide à prioriser les alertes sur les comptes contenant des données sensibles ; elle ne modifie pas le plafond d'analyse.
    c:
      en: |
        Event Grid only delivers the scan results; it doesn't increase the volume that is scanned.
      fr: |
        Event Grid ne fait que livrer les résultats d'analyse ; il n'augmente pas le volume analysé.
    d:
      en: |
        Index tags only record results on each blob; turning them off doesn't affect the cap.
      fr: |
        Les balises d'index ne font qu'enregistrer les résultats sur chaque objet blob ; les désactiver n'a aucun effet sur le plafond.
references:
  - title: Introduction to malware scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-malware-scan
