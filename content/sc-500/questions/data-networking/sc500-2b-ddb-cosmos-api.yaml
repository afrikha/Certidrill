id: sc500-2b-ddb-cosmos-api
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription named Sub1 that contains the following Azure Cosmos DB accounts.

    | Name | API |
    | --- | --- |
    | cosmos-orders | NoSQL |
    | cosmos-catalog | MongoDB |
    | cosmos-telemetry | Apache Cassandra |
    | cosmos-sessions | Table |

    You turn on Microsoft Defender for Azure Cosmos DB for Sub1.

    Which accounts will Defender for Azure Cosmos DB monitor for potential SQL injection and anomalous access?
  fr: |
    Vous disposez d'un abonnement Azure nommé Sub1 qui contient les comptes Azure Cosmos DB suivants.

    | Nom | API |
    | --- | --- |
    | cosmos-orders | NoSQL |
    | cosmos-catalog | MongoDB |
    | cosmos-telemetry | Apache Cassandra |
    | cosmos-sessions | Table |

    Vous activez Microsoft Defender for Azure Cosmos DB pour Sub1.

    Quels comptes Defender for Azure Cosmos DB surveillera-t-il pour détecter les injections SQL potentielles et les accès anormaux ?
body:
  options:
    - { id: a, text: { en: "cosmos-orders only", fr: "cosmos-orders uniquement" } }
    - { id: b, text: { en: "cosmos-orders and cosmos-catalog only", fr: "cosmos-orders et cosmos-catalog uniquement" } }
    - { id: c, text: { en: "cosmos-orders and cosmos-sessions only", fr: "cosmos-orders et cosmos-sessions uniquement" } }
    - { id: d, text: { en: "All four accounts", fr: "Les quatre comptes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Defender for Azure Cosmos DB supports only Azure Cosmos DB for NoSQL accounts. Accounts that use the MongoDB, Apache Cassandra, Table or Apache Gremlin APIs are not protected by the plan, even when it is turned on for the whole subscription.
    fr: |-
      Defender for Azure Cosmos DB ne prend en charge que les comptes Azure Cosmos DB for NoSQL. Les comptes qui utilisent les API MongoDB, Apache Cassandra, Table ou Apache Gremlin ne sont pas protégés par le plan, même s'il est activé pour tout l'abonnement.
  options:
    b: { en: "Azure Cosmos DB for MongoDB isn't supported by Defender for Azure Cosmos DB.", fr: "Azure Cosmos DB for MongoDB n'est pas pris en charge par Defender for Azure Cosmos DB." }
    c: { en: "Azure Cosmos DB for Table isn't supported by Defender for Azure Cosmos DB.", fr: "Azure Cosmos DB for Table n'est pas pris en charge par Defender for Azure Cosmos DB." }
    d: { en: "Enabling the plan at the subscription level doesn't extend it to the MongoDB, Cassandra or Table APIs; only NoSQL is supported.", fr: "L'activation du plan au niveau de l'abonnement ne l'étend pas aux API MongoDB, Cassandra ou Table ; seule l'API NoSQL est prise en charge." }
references:
  - title: Overview of Microsoft Defender for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-defender-for-cosmos
