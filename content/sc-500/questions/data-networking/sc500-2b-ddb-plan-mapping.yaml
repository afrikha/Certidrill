id: sc500-2b-ddb-plan-mapping
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is enabling Microsoft Defender for Databases plan by plan, to control costs. Each workload must be protected by the Defender plan that supports it.

    Which plan should you enable for each workload? To answer, drag the appropriate plans to the correct workloads. Each plan may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso active Microsoft Defender for Databases plan par plan, pour maîtriser les coûts. Chaque charge de travail doit être protégée par le plan Defender qui la prend en charge.

    Quel plan devez-vous activer pour chaque charge de travail ? Pour répondre, faites glisser les plans appropriés vers les charges de travail correspondantes. Chaque plan peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sqldb, text: Defender for Azure SQL Databases }
    - { id: sqlvm, text: Defender for SQL Servers on Machines }
    - { id: oss, text: Defender for open-source relational databases }
    - { id: cosmos, text: Defender for Azure Cosmos DB }
    - { id: servers, text: Defender for Servers Plan 2 }
    - { id: storage, text: Defender for Storage }
  targets:
    - id: t1
      text: { en: "An Azure SQL managed instance", fr: "Une instance managée Azure SQL" }
    - id: t2
      text: { en: "SQL Server 2022 running on an Azure virtual machine", fr: "SQL Server 2022 exécuté sur une machine virtuelle Azure" }
    - id: t3
      text: { en: "An Azure Database for PostgreSQL flexible server", fr: "Un serveur flexible Azure Database for PostgreSQL" }
    - id: t4
      text: { en: "An Azure Cosmos DB for NoSQL account", fr: "Un compte Azure Cosmos DB for NoSQL" }
answer:
  mapping: { t1: sqldb, t2: sqlvm, t3: oss, t4: cosmos }
explanation:
  correct:
    en: |-
      Defender for Azure SQL Databases covers Azure SQL Database, Azure SQL Managed Instance and Azure Synapse dedicated SQL pools. SQL Server on Azure virtual machines (and SQL Server enabled by Azure Arc) is protected by Defender for SQL Servers on Machines. Azure Database for PostgreSQL and MySQL flexible servers use the open-source relational databases plan, and Cosmos DB for NoSQL accounts use Defender for Azure Cosmos DB.
    fr: |-
      Defender for Azure SQL Databases couvre Azure SQL Database, Azure SQL Managed Instance et les pools SQL dédiés Azure Synapse. SQL Server sur des machines virtuelles Azure (et SQL Server activé par Azure Arc) est protégé par Defender for SQL Servers on Machines. Les serveurs flexibles Azure Database for PostgreSQL et MySQL relèvent du plan des bases de données relationnelles open source, et les comptes Cosmos DB for NoSQL de Defender for Azure Cosmos DB.
  options:
    servers: { en: "Defender for Servers protects the virtual machine, not the SQL Server engine and its databases.", fr: "Defender for Servers protège la machine virtuelle, pas le moteur SQL Server ni ses bases de données." }
    storage: { en: "Defender for Storage protects storage accounts, not database services.", fr: "Defender for Storage protège les comptes de stockage, pas les services de base de données." }
references:
  - title: Protect your databases with Defender for Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-enable-database-protections
  - title: Enable Defender for SQL Servers on Machines
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-usage
