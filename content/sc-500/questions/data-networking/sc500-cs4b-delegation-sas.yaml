id: sc500-cs4b-delegation-sas
objective: "2.1.4"
type: yesno_statements
caseStudy: sc500-cs4b-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You set **Allow storage account key access** to **Disabled** on stbyadocs. You plan how app-booking will grant the baggage claims partner access to the claims container. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez **Allow storage account key access** sur **Disabled** pour stbyadocs. Vous planifiez la façon dont app-booking accordera au partenaire de gestion des bagages l'accès au conteneur claims. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A service SAS that is associated with a stored access policy on the claims container meets the requirement for the partner.
        fr: |
          Une SAS de service associée à une stratégie d'accès stockée sur le conteneur claims répond à l'exigence concernant le partenaire.
    - id: s2
      text:
        en: |
          If the managed identity of app-booking has the Storage Blob Data Contributor role on stbyadocs, app-booking can request the user delegation key that signs the SAS.
        fr: |
          Si l'identité managée d'app-booking dispose du rôle Storage Blob Data Contributor sur stbyadocs, app-booking peut demander la clé de délégation d'utilisateur qui signe la SAS.
    - id: s3
      text:
        en: |
          If app-booking requests a user delegation key that is valid for one day, a SAS signed with that key stays usable for the five days of its own validity.
        fr: |
          Si app-booking demande une clé de délégation d'utilisateur valide un jour, une SAS signée avec cette clé reste utilisable pendant les cinq jours de sa propre validité.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A service SAS is signed with the account key, so it is denied when Shared Key authorization is disallowed; a user delegation SAS is authorized with Microsoft Entra ID and still works. Requesting a user delegation key requires the generateUserDelegationKey action at the storage account scope or higher, which Storage Blob Data Contributor includes. A SAS fails when its user delegation key expires, even if the SAS itself is still valid, so the key must be valid for the five days (the maximum is seven days).
    fr: |
      Une SAS de service est signée avec la clé de compte : elle est refusée quand l'autorisation par clé partagée est interdite ; une SAS de délégation d'utilisateur est autorisée avec Microsoft Entra ID et fonctionne toujours. La demande d'une clé de délégation d'utilisateur exige l'action generateUserDelegationKey à l'étendue du compte de stockage ou au-dessus, que Storage Blob Data Contributor inclut. Une SAS échoue quand sa clé de délégation d'utilisateur expire, même si la SAS est encore valide : la clé doit donc être valide pendant les cinq jours (sept jours au maximum).
references:
  - title: Create a user delegation SAS
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
