id: sc500-2a-key-rotation
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a storage account named **stwgbatch**. Two batch apps authorize with **key1** of the account by using connection strings stored in Azure Key Vault. key1 may have been exposed in a build log.

    You need to rotate key1 without interrupting the batch apps. When you finish, the apps must use the new value of key1.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'un compte de stockage nommé **stwgbatch**. Deux applications de traitement par lots s'autorisent avec **key1** du compte au moyen de chaînes de connexion stockées dans Azure Key Vault. key1 a peut-être été exposée dans un journal de build.

    Vous devez effectuer la rotation de key1 sans interrompre les applications. À la fin, les applications doivent utiliser la nouvelle valeur de key1.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: to2, text: { en: "Update the connection strings of the apps to use key2.", fr: "Mettre à jour les chaînes de connexion des applications pour utiliser key2." } }
    - { id: regen1, text: { en: "Regenerate key1.", fr: "Régénérer key1." } }
    - { id: to1, text: { en: "Update the connection strings of the apps to use the new key1.", fr: "Mettre à jour les chaînes de connexion des applications pour utiliser la nouvelle key1." } }
    - { id: regen2, text: { en: "Regenerate key2.", fr: "Régénérer key2." } }
    - { id: revoke, text: { en: "Revoke the user delegation keys of stwgbatch.", fr: "Révoquer les clés de délégation d'utilisateur de stwgbatch." } }
    - { id: disable, text: { en: "Set Allow storage account key access to Disabled on stwgbatch.", fr: "Définir Allow storage account key access sur Disabled sur stwgbatch." } }
answer:
  sequence: [ to2, regen1, to1 ]
explanation:
  correct:
    en: |
      The two account keys exist so that you can rotate one while clients use the other. Move the apps to key2 first, regenerate key1 so that the exposed value stops working, and then move the apps to the new key1, as the requirement asks.
    fr: |
      Les deux clés de compte existent pour permettre la rotation de l'une pendant que les clients utilisent l'autre. Basculez d'abord les applications sur key2, régénérez key1 pour que la valeur exposée cesse de fonctionner, puis basculez les applications sur la nouvelle key1, comme l'exige l'énoncé.
  options:
    regen2: { en: "key2 wasn't exposed, and regenerating it while the apps use it would interrupt them.", fr: "key2 n'a pas été exposée, et la régénérer pendant que les applications l'utilisent les interromprait." }
    revoke: { en: "User delegation keys sign user delegation SAS, not Shared Key requests.", fr: "Les clés de délégation d'utilisateur signent les SAS de délégation d'utilisateur, pas les requêtes par clé partagée." }
    disable: { en: "Disallowing Shared Key would stop the apps, which authorize with an account key.", fr: "Interdire la clé partagée arrêterait les applications, qui s'autorisent avec une clé de compte." }
references:
  - title: Manage storage account access keys
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
