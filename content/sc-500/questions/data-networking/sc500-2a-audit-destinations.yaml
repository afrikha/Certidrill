id: sc500-2a-audit-destinations
objective: "2.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys plans auditing for three Azure SQL Database logical servers. Each server has a different requirement for its audit logs.

    | Server | Requirement |
    | --- | --- |
    | sql-wt-hr | Keep the logs for seven years at the lowest cost and read them with T-SQL when needed. |
    | sql-wt-web | Query the logs with KQL and correlate them in Microsoft Sentinel analytics rules. |
    | sql-wt-pos | Stream the logs in near real time to a third-party SIEM. |

    Which audit destination should you configure for each server? To answer, drag the appropriate destinations to the correct servers. Each destination may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys planifie l'audit de trois serveurs logiques Azure SQL Database. Chaque serveur a une exigence différente pour ses journaux d'audit.

    | Serveur | Exigence |
    | --- | --- |
    | sql-wt-hr | Conserver les journaux sept ans au coût le plus bas et les lire en T-SQL au besoin. |
    | sql-wt-web | Interroger les journaux en KQL et les corréler dans des règles d'analyse Microsoft Sentinel. |
    | sql-wt-pos | Transmettre les journaux en temps quasi réel à un SIEM tiers. |

    Quelle destination d'audit devez-vous configurer pour chaque serveur ? Pour répondre, faites glisser les destinations appropriées vers les serveurs correspondants. Chaque destination peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: storage, text: { en: "Azure Storage account", fr: "Compte de stockage Azure" } }
    - { id: law, text: { en: "Log Analytics workspace", fr: "Espace de travail Log Analytics" } }
    - { id: eh, text: Event Hubs }
    - { id: metrics, text: { en: "Azure Monitor metrics", fr: "Métriques Azure Monitor" } }
  targets:
    - { id: hr, text: sql-wt-hr }
    - { id: web, text: sql-wt-web }
    - { id: pos, text: sql-wt-pos }
answer:
  mapping: { hr: storage, web: law, pos: eh }
explanation:
  correct:
    en: |
      A storage account keeps the .xel audit files at low cost for as long as the retention allows, and sys.fn_get_audit_file reads them with T-SQL. A Log Analytics workspace makes the events queryable with KQL and usable by Microsoft Sentinel. Event Hubs streams the events to external systems such as a third-party SIEM.
    fr: |
      Un compte de stockage conserve à faible coût les fichiers d'audit .xel aussi longtemps que la rétention le permet, et sys.fn_get_audit_file les lit en T-SQL. Un espace de travail Log Analytics rend les événements interrogeables en KQL et exploitables par Microsoft Sentinel. Event Hubs transmet les événements à des systèmes externes comme un SIEM tiers.
  options:
    metrics: { en: "Azure Monitor metrics isn't an audit destination; auditing writes to storage, Log Analytics or Event Hubs.", fr: "Les métriques Azure Monitor ne sont pas une destination d'audit ; l'audit écrit vers le stockage, Log Analytics ou Event Hubs." }
references:
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
