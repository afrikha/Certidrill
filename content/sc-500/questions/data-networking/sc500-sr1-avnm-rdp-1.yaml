id: sc500-sr1-avnm-rdp-1
objective: "2.3.2"
type: series_yesno
series: sc500-sr1-avnm-rdp
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You associate a central NSG with every subnet.
  fr: Vous associez un NSG central à chaque sous-réseau.
body:
  solution:
    en: |
      You create an NSG named **NSG-Base** that contains an inbound rule with priority **100** that denies TCP port 3389 from the **Internet** service tag. You associate NSG-Base with every subnet of the 40 virtual networks.
    fr: |
      Vous créez un NSG nommé **NSG-Base** qui contient une règle de trafic entrant de priorité **100** qui refuse le port TCP 3389 depuis la balise de service **Internet**. Vous associez NSG-Base à chaque sous-réseau des 40 réseaux virtuels.
answer: { value: false }
explanation:
  correct:
    en: |
      A subnet can have only one NSG, and the application teams have Network Contributor on their resources: they can change the rules or the association of the NSG and allow port 3389 again. The NSG is also not associated with the subnets of the virtual networks created later. A security admin rule deployed by Virtual Network Manager is evaluated before NSG rules and is outside the teams' control.
    fr: |
      Un sous-réseau ne peut avoir qu'un seul NSG, et les équipes applicatives disposent du rôle Network Contributor sur leurs ressources : elles peuvent modifier les règles ou l'association du NSG et autoriser de nouveau le port 3389. Le NSG n'est pas non plus associé aux sous-réseaux des réseaux virtuels créés ultérieurement. Une règle d'administrateur de la sécurité déployée par Virtual Network Manager est évaluée avant les règles des NSG et échappe au contrôle des équipes.
references:
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
