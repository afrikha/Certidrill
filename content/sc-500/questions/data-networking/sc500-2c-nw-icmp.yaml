id: sc500-2c-nw-icmp
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Users report that ping requests from a virtual machine named **VM-A** (10.1.1.4) to a virtual machine named **VM-B** (10.1.2.5) fail. Both VMs are in the same virtual network, and network security groups are associated with their subnets and network interfaces.

    You need to determine, without sending any test traffic, whether the security rules allow ICMP from VM-A to VM-B and which rule decides.

    Which Network Watcher feature should you use?
  fr: |
    Des utilisateurs signalent que les requêtes ping d'une machine virtuelle nommée **VM-A** (10.1.1.4) vers une machine virtuelle nommée **VM-B** (10.1.2.5) échouent. Les deux machines virtuelles se trouvent dans le même réseau virtuel, et des groupes de sécurité réseau sont associés à leurs sous-réseaux et à leurs cartes réseau.

    Vous devez déterminer, sans envoyer de trafic de test, si les règles de sécurité autorisent l'ICMP de VM-A vers VM-B et quelle règle en décide.

    Quelle fonctionnalité de Network Watcher devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "IP flow verify", fr: "Vérification des flux IP" }
    - id: b
      text: { en: "Next hop", fr: "Tronçon suivant" }
    - id: c
      text: { en: "NSG diagnostics", fr: "Diagnostics NSG" }
    - id: d
      text: { en: "Connection troubleshoot", fr: "Résolution des problèmes de connexion" }
answer: { optionId: c }
explanation:
  correct:
    en: NSG diagnostics simulates a flow from the source and destination that you provide, for TCP, UDP, ICMP or any protocol, and returns whether it is allowed or denied with the rule that decides, for each set of rules evaluated.
    fr: Les diagnostics NSG simulent un flux à partir de la source et de la destination fournies, en TCP, UDP, ICMP ou pour tout protocole, et indiquent s'il est autorisé ou refusé avec la règle qui en décide, pour chaque ensemble de règles évalué.
  options:
    a: { en: "IP flow verify tests only TCP and UDP rules; for ICMP you must use NSG diagnostics.", fr: "La vérification des flux IP ne teste que les règles TCP et UDP ; pour l'ICMP, il faut utiliser les diagnostics NSG." }
    b: { en: "Next hop shows the routing decision, not the security rules.", fr: "Le tronçon suivant montre la décision de routage, pas les règles de sécurité." }
    d: { en: "Connection troubleshoot sends real test traffic from the source, which the requirement excludes.", fr: "La résolution des problèmes de connexion envoie du vrai trafic de test depuis la source, ce que l'exigence exclut." }
references:
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
  - title: Diagnose network security rules
    url: https://learn.microsoft.com/en-us/azure/network-watcher/diagnose-network-security-rules
