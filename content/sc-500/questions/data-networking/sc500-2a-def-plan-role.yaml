id: sc500-2a-def-plan-role
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a subscription named **Sub-Dev**. You plan to enable the Defender for Storage plan on Sub-Dev with activity monitoring only: malware scanning and sensitive data threat detection will stay turned off.

    A user named **SecOps1** must perform the change. The solution must follow the principle of least privilege.

    Which role should you assign to SecOps1 on Sub-Dev?
  fr: |
    Contoso, Ltd. dispose d'un abonnement nommé **Sub-Dev**. Vous prévoyez d'activer le plan Defender for Storage sur Sub-Dev avec uniquement la surveillance de l'activité : l'analyse des programmes malveillants et la détection des menaces sur les données sensibles resteront désactivées.

    Un utilisateur nommé **SecOps1** doit effectuer la modification. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à SecOps1 sur Sub-Dev ?
body:
  options:
    - { id: a, text: Security Reader }
    - { id: b, text: Security Admin }
    - { id: c, text: Owner }
    - { id: d, text: Storage Account Contributor }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Enabling the Defender for Storage plan without the extra features requires read and write permissions on Microsoft.Security/pricings, which Security Admin includes. Owner is needed only to turn on malware scanning or sensitive data threat detection, because those features create role assignments.
    fr: |
      Activer le plan Defender for Storage sans les fonctionnalités supplémentaires exige les autorisations de lecture et d'écriture sur Microsoft.Security/pricings, que Security Admin inclut. Owner n'est nécessaire que pour activer l'analyse des programmes malveillants ou la détection des menaces sur les données sensibles, car ces fonctionnalités créent des attributions de rôles.
  options:
    a:
      en: |
        Security Reader can view plans and alerts but can't change plan settings.
      fr: |
        Security Reader peut consulter les plans et les alertes mais ne peut pas modifier les paramètres des plans.
    c:
      en: |
        Owner works but grants far more than needed for enabling the plan alone.
      fr: |
        Owner fonctionne, mais accorde bien plus que nécessaire pour activer le plan seul.
    d:
      en: |
        Storage Account Contributor manages storage accounts but has no permission on Defender for Cloud pricing settings.
      fr: |
        Storage Account Contributor gère les comptes de stockage mais n'a aucune autorisation sur les paramètres de tarification de Defender for Cloud.
references:
  - title: Prerequisites for Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/support-matrix-defender-for-storage
