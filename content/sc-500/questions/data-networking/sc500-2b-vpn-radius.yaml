id: sc500-2b-vpn-radius
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an on-premises Active Directory Domain Services (AD DS) domain that isn't synchronized to Microsoft Entra ID. An on-premises Network Policy Server (NPS) already authenticates the remote users. Adatum has a VPN gateway named VPNGW1 of SKU VpnGw1AZ that has a site-to-site connection to the datacenter.

    You need to configure point-to-site VPN on VPNGW1 so that users sign in with their AD DS domain credentials. You must not deploy client certificates.

    Which authentication type should you configure?
  fr: |
    Adatum dispose d'un domaine Active Directory Domain Services (AD DS) local qui n'est pas synchronisé avec Microsoft Entra ID. Un serveur NPS (Network Policy Server) local authentifie déjà les utilisateurs distants. Adatum dispose d'une passerelle VPN nommée VPNGW1 de référence SKU VpnGw1AZ, dotée d'une connexion site à site vers le centre de données.

    Vous devez configurer le VPN point à site sur VPNGW1 pour que les utilisateurs se connectent avec leurs informations d'identification de domaine AD DS. Vous ne devez pas déployer de certificats clients.

    Quel type d'authentification devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Azure certificate", fr: "Certificat Azure" } }
    - { id: b, text: { en: "Microsoft Entra ID", fr: "Microsoft Entra ID" } }
    - { id: c, text: { en: "RADIUS", fr: "RADIUS" } }
    - { id: d, text: { en: "Pre-shared key", fr: "Clé prépartagée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      RADIUS authentication lets users sign in with their organization's domain credentials: the gateway forwards the authentication messages to a RADIUS server, such as NPS, that integrates with AD DS. An on-premises RADIUS server must be reachable from the gateway, which the existing site-to-site connection provides.
    fr: |-
      L'authentification RADIUS permet aux utilisateurs de se connecter avec les informations d'identification de domaine de l'organisation : la passerelle transmet les messages d'authentification à un serveur RADIUS, comme NPS, intégré à AD DS. Un serveur RADIUS local doit être joignable depuis la passerelle, ce que fournit la connexion site à site existante.
  options:
    a: { en: "Certificate authentication requires a client certificate on every device, which is excluded.", fr: "L'authentification par certificat exige un certificat client sur chaque appareil, ce qui est exclu." }
    b: { en: "Microsoft Entra ID authentication needs the users in Microsoft Entra ID; the domain isn't synchronized.", fr: "L'authentification Microsoft Entra ID exige que les utilisateurs soient dans Microsoft Entra ID ; le domaine n'est pas synchronisé." }
    d: { en: "A pre-shared key authenticates site-to-site connections, not point-to-site users.", fr: "Une clé prépartagée authentifie les connexions site à site, pas les utilisateurs point à site." }
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
