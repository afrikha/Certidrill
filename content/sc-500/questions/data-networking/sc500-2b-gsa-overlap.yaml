id: sc500-2b-gsa-overlap
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso uses Microsoft Entra Private Access. The configuration is the following:

    | App | Segments | Assigned groups | Conditional Access |
    | --- | --- | --- | --- |
    | Quick Access | 10.1.0.0/16, TCP 3389 and 445 | GRP-AllStaff, GRP-Helpdesk | Require MFA |
    | App-FinanceSrv (Global Secure Access app) | 10.1.5.10, TCP 3389 | GRP-FinanceAdmins | Require MFA and a compliant device |

    Since App-FinanceSrv was created, helpdesk technicians can't connect by RDP to 10.1.5.10. They must regain access, and every RDP connection to 10.1.5.10 must require a compliant device.

    What should you do?
  fr: |
    Contoso utilise Microsoft Entra Private Access. La configuration est la suivante :

    | Application | Segments | Groupes attribués | Accès conditionnel |
    | --- | --- | --- | --- |
    | Quick Access | 10.1.0.0/16, TCP 3389 et 445 | GRP-AllStaff, GRP-Helpdesk | Exiger la MFA |
    | App-FinanceSrv (application Global Secure Access) | 10.1.5.10, TCP 3389 | GRP-FinanceAdmins | Exiger la MFA et un appareil conforme |

    Depuis la création d'App-FinanceSrv, les techniciens du support ne peuvent plus se connecter en RDP à 10.1.5.10. Ils doivent retrouver l'accès, et chaque connexion RDP vers 10.1.5.10 doit exiger un appareil conforme.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a 10.1.5.10 TCP 3389 segment to Quick Access.", fr: "Ajouter un segment 10.1.5.10 TCP 3389 à Quick Access." } }
    - { id: b, text: { en: "Add the compliant device control to the Quick Access policy.", fr: "Ajouter le contrôle d'appareil conforme à la stratégie de Quick Access." } }
    - { id: c, text: { en: "Remove the 10.1.5.10 segment from App-FinanceSrv.", fr: "Supprimer le segment 10.1.5.10 d'App-FinanceSrv." } }
    - { id: d, text: { en: "Assign GRP-Helpdesk to App-FinanceSrv.", fr: "Attribuer GRP-Helpdesk à App-FinanceSrv." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A segment of a Global Secure Access app can overlap a Quick Access segment, and the app segment wins: traffic to 10.1.5.10 on TCP 3389 is evaluated only against App-FinanceSrv's assignments and Conditional Access policies. Assignments aren't copied from Quick Access, so assigning GRP-Helpdesk to App-FinanceSrv restores access and keeps the compliant device requirement.
    fr: |-
      Un segment d'une application Global Secure Access peut chevaucher un segment Quick Access, et le segment de l'application l'emporte : le trafic vers 10.1.5.10 en TCP 3389 n'est évalué qu'au regard des attributions et des stratégies d'accès conditionnel d'App-FinanceSrv. Les attributions ne sont pas copiées depuis Quick Access : attribuer GRP-Helpdesk à App-FinanceSrv rétablit l'accès en conservant l'exigence d'appareil conforme.
  options:
    a: { en: "The App-FinanceSrv segment still takes priority, so the new Quick Access segment would never process this traffic.", fr: "Le segment d'App-FinanceSrv reste prioritaire : le nouveau segment Quick Access ne traiterait jamais ce trafic." }
    c: { en: "Traffic would fall back to Quick Access, which doesn't require a compliant device.", fr: "Le trafic reviendrait à Quick Access, qui n'exige pas d'appareil conforme." }
    b: { en: "Quick Access policies don't apply to traffic handled by App-FinanceSrv, and helpdesk users still aren't assigned to that app.", fr: "Les stratégies de Quick Access ne s'appliquent pas au trafic traité par App-FinanceSrv, et les techniciens ne sont toujours pas attribués à cette application." }
references:
  - title: How to configure per-app access using Global Secure Access applications
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-per-app-access
