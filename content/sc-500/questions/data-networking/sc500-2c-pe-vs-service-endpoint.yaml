id: sc500-2c-pe-vs-service-endpoint
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum connects its on-premises datacenter to a virtual network named **VNet1** by using ExpressRoute private peering. Microsoft peering is not configured.

    A storage account named **stadatumdocs** must be reachable from the on-premises servers and from the virtual machines in VNet1. The public network access of stadatumdocs will be set to Disabled, and the traffic must never use a public IP address of the storage account.

    What should you implement?
  fr: |
    Adatum connecte son centre de données local à un réseau virtuel nommé **VNet1** par le peering privé ExpressRoute. Le peering Microsoft n'est pas configuré.

    Un compte de stockage nommé **stadatumdocs** doit être joignable depuis les serveurs locaux et depuis les machines virtuelles de VNet1. L'accès au réseau public de stadatumdocs sera réglé sur Disabled, et le trafic ne doit jamais utiliser une adresse IP publique du compte de stockage.

    Que devez-vous implémenter ?
body:
  options:
    - id: a
      text: { en: "A Microsoft.Storage service endpoint on a subnet of VNet1", fr: "Un point de terminaison de service Microsoft.Storage sur un sous-réseau de VNet1" }
    - id: b
      text: { en: "A Private Link service in VNet1 that targets stadatumdocs", fr: "Un service Private Link dans VNet1 qui cible stadatumdocs" }
    - id: c
      text: { en: "A storage firewall rule for the on-premises public IP range", fr: "Une règle de pare-feu de stockage pour la plage IP publique locale" }
    - id: d
      text: { en: "A private endpoint for the blob sub-resource in VNet1", fr: "Un point de terminaison privé pour la sous-ressource blob dans VNet1" }
answer: { optionId: d }
explanation:
  correct:
    en: A private endpoint gives the storage account a private IP address in VNet1, reachable from VNet1, from peered networks and from on-premises over ExpressRoute private peering or VPN. It keeps working when public network access is disabled.
    fr: Un point de terminaison privé donne au compte de stockage une adresse IP privée dans VNet1, joignable depuis VNet1, depuis les réseaux reliés par peering et depuis le site local par le peering privé ExpressRoute ou un VPN. Il continue de fonctionner quand l'accès au réseau public est désactivé.
  options:
    a: { en: "A service endpoint keeps the public IP address of the service and does not extend to on-premises clients.", fr: "Un point de terminaison de service conserve l'adresse IP publique du service et ne s'étend pas aux clients locaux." }
    b: { en: "A Private Link service exposes your own service behind a Standard Load Balancer; it cannot target a storage account.", fr: "Un service Private Link expose votre propre service derrière un Standard Load Balancer ; il ne peut pas cibler un compte de stockage." }
    c: { en: "A firewall rule still uses the public endpoint, which will be disabled.", fr: "Une règle de pare-feu utilise toujours le point de terminaison public, qui sera désactivé." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
