id: sc500-2c-fw-spoke-udr
objective: "2.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Azure Firewall named **fw-hub** is deployed in a hub virtual network. Its private IP address is 10.0.1.4 and its public IP address is 203.0.113.10.

    A spoke virtual network named VNet-Spoke1 is peered with the hub and contains a subnet named **snet-web**. A route table named rt-web is associated with snet-web.

    You need the internet-bound traffic from snet-web to be filtered by fw-hub.

    Which route should you add to rt-web?
  fr: |
    Un Pare-feu Azure nommé **fw-hub** est déployé dans un réseau virtuel hub. Son adresse IP privée est 10.0.1.4 et son adresse IP publique 203.0.113.10.

    Un réseau virtuel spoke nommé VNet-Spoke1, relié au hub par peering, contient un sous-réseau nommé **snet-web**. Une table de routage nommée rt-web est associée à snet-web.

    Le trafic à destination d'Internet issu de snet-web doit être filtré par fw-hub.

    Quel itinéraire devez-vous ajouter à rt-web ?
body:
  options:
    - id: a
      text: { en: "0.0.0.0/0, next hop type Virtual appliance, address 203.0.113.10", fr: "0.0.0.0/0, type de tronçon suivant Appliance virtuelle, adresse 203.0.113.10" }
    - id: b
      text: { en: "0.0.0.0/0, next hop type Virtual appliance, address 10.0.1.4", fr: "0.0.0.0/0, type de tronçon suivant Appliance virtuelle, adresse 10.0.1.4" }
    - id: c
      text: { en: "0.0.0.0/0, next hop type Virtual network gateway", fr: "0.0.0.0/0, type de tronçon suivant Passerelle de réseau virtuel" }
    - id: d
      text: { en: "0.0.0.0/0, next hop type Internet", fr: "0.0.0.0/0, type de tronçon suivant Internet" }
answer: { optionId: b }
explanation:
  correct:
    en: Spoke subnets send traffic to Azure Firewall with a user-defined default route whose next hop type is Virtual appliance and whose next hop address is the private IP address of the firewall, reachable over the peering.
    fr: Les sous-réseaux spoke envoient le trafic au Pare-feu Azure avec un itinéraire par défaut défini par l'utilisateur dont le type de tronçon suivant est Appliance virtuelle et l'adresse de tronçon suivant l'adresse IP privée du pare-feu, joignable par le peering.
  options:
    a: { en: "The next hop address of a Virtual appliance route must be a private IP address that is reachable inside the virtual network, not the public IP address of the firewall.", fr: "L'adresse de tronçon suivant d'un itinéraire Appliance virtuelle doit être une adresse IP privée joignable dans le réseau virtuel, pas l'adresse IP publique du pare-feu." }
    c: { en: "This next hop sends traffic to a VPN or ExpressRoute gateway, not to the firewall.", fr: "Ce tronçon suivant envoie le trafic vers une passerelle VPN ou ExpressRoute, pas vers le pare-feu." }
    d: { en: "This route sends traffic straight to the internet and bypasses fw-hub.", fr: "Cet itinéraire envoie le trafic directement vers Internet et contourne fw-hub." }
references:
  - title: "Tutorial: Deploy and configure Azure Firewall and policy by using the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/firewall/tutorial-firewall-deploy-portal-policy
