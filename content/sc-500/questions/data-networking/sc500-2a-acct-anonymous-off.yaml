id: sc500-2a-acct-anonymous-off
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a general-purpose v2 storage account named **stwoodgrovemedia** that contains 40 blob containers. Some containers have the anonymous access level set to **Blob** or **Container**. Developers create new containers every week.

    A new security requirement states that no blob in stwoodgrovemedia can be read anonymously, including blobs in containers created later. Applications that use Microsoft Entra ID or shared access signatures (SAS) must keep working.

    You need to meet the requirement and minimize administrative effort.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un compte de stockage v2 universel nommé **stwoodgrovemedia** qui contient 40 conteneurs d'objets blob. Certains conteneurs ont le niveau d'accès anonyme **Blob** ou **Container**. Les développeurs créent de nouveaux conteneurs chaque semaine.

    Une nouvelle exigence de sécurité impose qu'aucun objet blob de stwoodgrovemedia ne puisse être lu de manière anonyme, y compris dans les conteneurs créés ultérieurement. Les applications qui utilisent Microsoft Entra ID ou des signatures d'accès partagé (SAS) doivent continuer à fonctionner.

    Vous devez répondre à l'exigence en réduisant au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the access level of each existing container to Private.", fr: "Définir le niveau d'accès de chaque conteneur existant sur Private." } }
    - { id: b, text: { en: "Set Allow Blob anonymous access to Disabled on stwoodgrovemedia.", fr: "Définir Allow Blob anonymous access sur Disabled sur stwoodgrovemedia." } }
    - { id: c, text: { en: "Set Allow storage account key access to Disabled on stwoodgrovemedia.", fr: "Définir Allow storage account key access sur Disabled sur stwoodgrovemedia." } }
    - { id: d, text: { en: "Enable Default to Microsoft Entra authorization in the Azure portal on stwoodgrovemedia.", fr: "Activer Default to Microsoft Entra authorization in the Azure portal sur stwoodgrovemedia." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Disallowing blob anonymous access at the account level overrides the access level of every container, existing or future, so anonymous requests are rejected without touching each container. Requests authorized with Microsoft Entra ID or a SAS are not anonymous and keep working.
    fr: |
      Interdire l'accès anonyme aux objets blob au niveau du compte remplace le niveau d'accès de chaque conteneur, existant ou futur : les requêtes anonymes sont rejetées sans modifier chaque conteneur. Les requêtes autorisées avec Microsoft Entra ID ou une SAS ne sont pas anonymes et continuent de fonctionner.
  options:
    a:
      en: |
        Changing each container fixes only the existing ones; a developer can still create a new container with anonymous access, and the task must be repeated.
      fr: |
        Modifier chaque conteneur ne corrige que les conteneurs existants ; un développeur peut encore créer un conteneur avec accès anonyme, et la tâche est à refaire.
    c:
      en: |
        Disabling Shared Key access blocks requests signed with the account key, including service and account SAS, which breaks the SAS applications; it does not target anonymous access.
      fr: |
        Désactiver l'accès par clé partagée bloque les requêtes signées avec la clé de compte, y compris les SAS de service et de compte, ce qui casse les applications SAS ; ce paramètre ne vise pas l'accès anonyme.
    d:
      en: |
        This setting only changes how the portal authorizes data browsing for signed-in users; anonymous requests are unaffected.
      fr: |
        Ce paramètre change uniquement la manière dont le portail autorise la consultation des données par les utilisateurs connectés ; les requêtes anonymes ne sont pas concernées.
references:
  - title: Remediate anonymous read access to blob data (Azure Resource Manager deployments)
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-prevent
