id: sc500-cs3c-sql-tde
objective: "2.2.1"
type: multi
caseStudy: sc500-cs3c-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You create an RSA 3072-bit key in kv-claims. You need to configure the key as the TDE protector of sql-claims to meet the encryption requirement.

    Which two actions should you perform first? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une clé RSA de 3 072 bits dans kv-claims. Vous devez configurer cette clé comme protecteur TDE de sql-claims pour satisfaire l'exigence de chiffrement.

    Quelles sont les deux actions à effectuer d'abord ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable purge protection on kv-claims.", fr: "Activer la protection contre le vidage sur kv-claims." } }
    - { id: b, text: { en: "Assign the Key Vault Crypto Service Encryption User role to the identity of sql-claims.", fr: "Attribuer le rôle Key Vault Crypto Service Encryption User à l'identité de sql-claims." } }
    - { id: c, text: { en: "Add an access policy with the get, wrapKey and unwrapKey permissions for sql-claims.", fr: "Ajouter une stratégie d'accès avec les autorisations get, wrapKey et unwrapKey pour sql-claims." } }
    - { id: d, text: { en: "Assign the Key Vault Crypto Officer role to the identity of sql-claims.", fr: "Attribuer le rôle Key Vault Crypto Officer à l'identité de sql-claims." } }
    - { id: e, text: { en: "Enable Microsoft Entra-only authentication on sql-claims.", fr: "Activer l'authentification Microsoft Entra uniquement sur sql-claims." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      Setting up a customer-managed TDE protector fails unless both soft delete and purge protection are enabled on the key vault, and kv-claims has purge protection disabled. Because kv-claims uses the Azure RBAC permission model, the server's managed identity needs the Key Vault Crypto Service Encryption User role to wrap and unwrap the database encryption key. The trusted services bypass is already enabled on the firewall.
    fr: |-
      La configuration d'un protecteur TDE géré par le client échoue si la suppression réversible et la protection contre le vidage ne sont pas toutes deux activées sur le coffre de clés, et la protection contre le vidage de kv-claims est désactivée. Comme kv-claims utilise le modèle d'autorisation Azure RBAC, l'identité managée du serveur a besoin du rôle Key Vault Crypto Service Encryption User pour encapsuler et désencapsuler la clé de chiffrement de la base de données. Le contournement pour les services approuvés est déjà activé sur le pare-feu.
  options:
    c:
      en: |-
        Access policies are ignored when the vault uses the Azure RBAC permission model.
      fr: |-
        Les stratégies d'accès sont ignorées quand le coffre utilise le modèle d'autorisation Azure RBAC.
    d:
      en: |-
        Key Vault Crypto Officer can manage all the keys of the vault, which exceeds least privilege for wrap and unwrap operations.
      fr: |-
        Key Vault Crypto Officer peut gérer toutes les clés du coffre, ce qui dépasse le moindre privilège pour des opérations d'encapsulation et de désencapsulation.
    e:
      en: |-
        Microsoft Entra-only authentication controls how users sign in to the server; it is not a prerequisite for a customer-managed TDE protector.
      fr: |-
        L'authentification Microsoft Entra uniquement contrôle la façon dont les utilisateurs se connectent au serveur ; ce n'est pas un prérequis d'un protecteur TDE géré par le client.
references:
  - title: Customer-Managed Transparent Data Encryption (TDE)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
