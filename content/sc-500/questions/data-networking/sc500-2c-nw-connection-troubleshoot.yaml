id: sc500-2c-nw-connection-troubleshoot
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A virtual machine named **VM-App3** must connect to `sql-proseware.database.windows.net` on TCP 1433, and the connection fails.

    You need to run a single test from VM-App3 to the FQDN that checks the connection end to end and reports whether the fault comes from DNS resolution, the guest operating system firewall, a network security rule or a user-defined route.

    Which Network Watcher feature should you use?
  fr: |
    Une machine virtuelle nommée **VM-App3** doit se connecter à `sql-proseware.database.windows.net` sur le TCP 1433, et la connexion échoue.

    Vous devez exécuter un seul test de VM-App3 vers le FQDN qui vérifie la connexion de bout en bout et indique si l'erreur vient de la résolution DNS, du pare-feu du système d'exploitation invité, d'une règle de sécurité réseau ou d'un itinéraire défini par l'utilisateur.

    Quelle fonctionnalité de Network Watcher devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Connection troubleshoot", fr: "Résolution des problèmes de connexion" }
    - id: b
      text: { en: "IP flow verify", fr: "Vérification des flux IP" }
    - id: c
      text: { en: "NSG diagnostics", fr: "Diagnostics NSG" }
    - id: d
      text: { en: "Next hop", fr: "Tronçon suivant" }
answer: { optionId: a }
explanation:
  correct:
    en: Connection troubleshoot tests a TCP or ICMP connection from a source such as a VM to a VM, FQDN, URI or IP address. It reports the fault types it detects, including DNS resolution, guest firewall, network security rule and user-defined route issues.
    fr: La résolution des problèmes de connexion teste une connexion TCP ou ICMP depuis une source telle qu'une machine virtuelle vers une machine virtuelle, un FQDN, un URI ou une adresse IP. Elle signale les types d'erreur détectés, notamment les problèmes de résolution DNS, de pare-feu invité, de règle de sécurité réseau et d'itinéraire défini par l'utilisateur.
  options:
    b: { en: "IP flow verify evaluates only the security rules for one flow defined by IP addresses; it neither resolves the FQDN nor checks the guest OS.", fr: "La vérification des flux IP n'évalue que les règles de sécurité pour un flux défini par des adresses IP ; elle ne résout pas le FQDN et ne vérifie pas le système d'exploitation invité." }
    c: { en: "NSG diagnostics simulates a flow against the security rules only.", fr: "Les diagnostics NSG simulent un flux par rapport aux seules règles de sécurité." }
    d: { en: "Next hop shows only the routing decision for a destination IP address.", fr: "Le tronçon suivant ne montre que la décision de routage pour une adresse IP de destination." }
references:
  - title: Connection troubleshoot overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-troubleshoot-overview
