id: sc500-2b-vwan-intent-multi
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to configure routing intent on the secured virtual hubs of a Standard Azure Virtual WAN. Some spoke virtual networks use the address space 100.64.0.0/16.

    Which two statements about routing intent are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de configurer l'intention de routage sur les hubs virtuels sécurisés d'un Azure Virtual WAN Standard. Certains réseaux virtuels spoke utilisent l'espace d'adressage 100.64.0.0/16.

    Quelles sont les deux affirmations vraies concernant l'intention de routage ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each hub can have at most one Internet traffic policy and one Private traffic policy, each with a single next hop.", fr: "Chaque hub peut avoir au plus une stratégie Trafic Internet et une stratégie Trafic privé, chacune avec un seul tronçon suivant." } }
    - { id: b, text: { en: "100.64.0.0/16 must be added as an additional private traffic prefix on every hub that has a Private traffic policy.", fr: "100.64.0.0/16 doit être ajouté comme préfixe de trafic privé supplémentaire sur chaque hub doté d'une stratégie Trafic privé." } }
    - { id: c, text: { en: "Routing intent can be combined with a custom route table for spokes that must bypass the firewall.", fr: "L'intention de routage peut être combinée avec une table de routage personnalisée pour les spokes qui doivent contourner le pare-feu." } }
    - { id: d, text: { en: "Azure Firewall Manager can set a third-party NGFW network virtual appliance as the next hop of a routing policy.", fr: "Azure Firewall Manager peut définir une appliance virtuelle réseau NGFW tierce comme tronçon suivant d'une stratégie de routage." } }
    - { id: e, text: { en: "The default route of an Internet traffic policy propagates to every hub, so one firewall can handle the internet egress of all hubs.", fr: "L'itinéraire par défaut d'une stratégie Trafic Internet se propage à tous les hubs : un seul pare-feu peut assurer la sortie Internet de tous les hubs." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |-
      A hub supports at most one policy of each type, each with one next hop resource. The Private traffic policy covers the RFC 1918 supernets by default; other prefixes such as 100.64.0.0/16 must be added as additional prefixes, and because they don't propagate between hubs, you add them on every hub with a Private traffic policy.
    fr: |-
      Un hub prend en charge au plus une stratégie de chaque type, chacune avec une seule ressource de tronçon suivant. La stratégie Trafic privé couvre par défaut les super-réseaux RFC 1918 ; les autres préfixes comme 100.64.0.0/16 doivent être ajoutés comme préfixes supplémentaires et, comme ils ne se propagent pas entre hubs, vous les ajoutez sur chaque hub doté d'une stratégie Trafic privé.
  options:
    c: { en: "Routing intent manages all associations and propagations; custom route tables aren't supported with it.", fr: "L'intention de routage gère toutes les associations et propagations ; les tables de routage personnalisées ne sont pas prises en charge avec elle." }
    d: { en: "Azure Firewall Manager supports only Azure Firewall as next hop; NVA and SaaS next hops are set from the Virtual WAN hub's routing policies.", fr: "Azure Firewall Manager ne prend en charge que le Pare-feu Azure comme tronçon suivant ; les NVA et solutions SaaS se définissent dans les stratégies de routage du hub Virtual WAN." }
    e: { en: "0.0.0.0/0 isn't advertised across hubs; internet traffic exits through the local hub's security solution.", fr: "0.0.0.0/0 n'est pas annoncé d'un hub à l'autre ; le trafic Internet sort par la solution de sécurité du hub local." }
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
