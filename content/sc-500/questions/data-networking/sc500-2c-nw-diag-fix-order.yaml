id: sc500-2c-nw-diag-fix-order
objective: "2.3.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Administrators connect to a virtual machine named **VM-Ops1** (10.0.0.4) through Azure Bastion, which is deployed in AzureBastionSubnet (10.0.1.0/26). The connections fail. NSGs are associated with the subnet and the network interface of VM-Ops1.

    You need to use Network Watcher to identify the rule that blocks the traffic, fix it with the least administrative effort, and confirm that the traffic is allowed.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Des administrateurs se connectent à une machine virtuelle nommée **VM-Ops1** (10.0.0.4) par Azure Bastion, déployé dans AzureBastionSubnet (10.0.1.0/26). Les connexions échouent. Des NSG sont associés au sous-réseau et à la carte réseau de VM-Ops1.

    Vous devez utiliser Network Watcher pour identifier la règle qui bloque le trafic, la corriger avec le moindre effort d'administration et confirmer que le trafic est autorisé.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: run, text: { en: "Run NSG diagnostics for VM-Ops1, inbound TCP, with the source 10.0.1.0/26.", fr: "Exécuter les diagnostics NSG pour VM-Ops1, en TCP entrant, avec la source 10.0.1.0/26." } }
    - { id: details, text: { en: "Open View details for the NSG whose result is Denied and note the blocking rule and its priority.", fr: "Ouvrir View details pour le NSG dont le résultat est Denied et noter la règle bloquante et sa priorité." } }
    - { id: add, text: { en: "Select Add security rule and create an Allow rule for 10.0.1.0/26 with a lower priority number than the blocking rule.", fr: "Sélectionner Add security rule et créer une règle Allow pour 10.0.1.0/26 avec un numéro de priorité inférieur à celui de la règle bloquante." } }
    - { id: recheck, text: { en: "Select Recheck to run the diagnostic session again.", fr: "Sélectionner Recheck pour réexécuter la session de diagnostic." } }
    - { id: nexthop, text: { en: "Run next hop from VM-Ops1 to 10.0.1.4.", fr: "Exécuter le tronçon suivant de VM-Ops1 vers 10.0.1.4." } }
    - { id: deletedefault, text: { en: "Delete the DenyAllInBound default rule of the NSG of VM-Ops1.", fr: "Supprimer la règle par défaut DenyAllInBound du NSG de VM-Ops1." } }
answer:
  sequence: [ run, details, add, recheck ]
explanation:
  correct:
    en: |
      NSG diagnostics evaluates the flow from the Bastion subnet against every set of security rules and shows which one denies it; View details shows the rule and its priority. You can add a security rule directly from the result, with a priority number lower than the blocking rule so that it is evaluated first, and then select Recheck to confirm that the traffic is now allowed.
    fr: |
      Les diagnostics NSG évaluent le flux issu du sous-réseau Bastion par rapport à chaque ensemble de règles de sécurité et montrent celui qui le refuse ; View details affiche la règle et sa priorité. Vous pouvez ajouter une règle de sécurité directement depuis le résultat, avec un numéro de priorité inférieur à celui de la règle bloquante pour qu'elle soit évaluée en premier, puis sélectionner Recheck pour confirmer que le trafic est désormais autorisé.
  options:
    nexthop: { en: "Next hop checks routing, not the security rules that block the flow.", fr: "Le tronçon suivant vérifie le routage, pas les règles de sécurité qui bloquent le flux." }
    deletedefault: { en: "Default security rules cannot be deleted; you override them with higher-priority rules.", fr: "Les règles de sécurité par défaut ne peuvent pas être supprimées ; vous les remplacez par des règles de priorité plus élevée." }
references:
  - title: Diagnose network security rules
    url: https://learn.microsoft.com/en-us/azure/network-watcher/diagnose-network-security-rules
