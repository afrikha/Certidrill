id: sc500-2a-fw-bicep-acls
objective: "2.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are writing a Bicep file that deploys a storage account named **stproseware** for Proseware, Inc. The storage firewall must meet the following requirements:

    - Requests that match no rule must be denied.
    - Read access to the storage logs and metrics must be allowed from any network; no other exception is needed.
    - The head office, which uses the public range 203.0.113.0/24, must be allowed.
    - An Azure Synapse workspace whose resource ID is stored in the `synapseId` variable must be allowed.

    How should you complete the networkAcls section? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un fichier Bicep qui déploie un compte de stockage nommé **stproseware** pour Proseware, Inc. Le pare-feu de stockage doit répondre aux exigences suivantes :

    - les requêtes qui ne correspondent à aucune règle doivent être refusées ;
    - la lecture des journaux et des métriques de stockage doit être autorisée depuis n'importe quel réseau ; aucune autre exception n'est nécessaire ;
    - le siège, qui utilise la plage publique 203.0.113.0/24, doit être autorisé ;
    - un espace de travail Azure Synapse dont l'ID de ressource est stocké dans la variable `synapseId` doit être autorisé.

    Comment devez-vous compléter la section networkAcls ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    networkAcls: {
      defaultAction: [[def]]
      bypass: [[byp]]
      ipRules: [
        { action: 'Allow', value: '203.0.113.0/24' }
      ]
      [[rules]]: [
        { tenantId: tenant().tenantId, resourceId: synapseId }
      ]
    }
  slots:
    - id: def
      options:
        - { id: allow, text: "'Allow'" }
        - { id: deny, text: "'Deny'" }
    - id: byp
      options:
        - { id: azure, text: "'AzureServices'" }
        - { id: logmet, text: "'Logging, Metrics'" }
        - { id: all, text: "'AzureServices, Logging, Metrics'" }
        - { id: none, text: "'None'" }
    - id: rules
      options:
        - { id: res, text: resourceAccessRules }
        - { id: vnet, text: virtualNetworkRules }
        - { id: ipv6, text: ipv6Rules }
answer:
  values: { def: deny, byp: logmet, rules: res }
explanation:
  correct:
    en: |
      `defaultAction: 'Deny'` makes the rules effective. `bypass` takes a comma-separated combination of AzureServices, Logging and Metrics; 'Logging, Metrics' allows reading logs and metrics without adding the trusted services exception. A Synapse workspace instance is admitted by an entry of `resourceAccessRules`, which takes a tenant ID and a resource ID.
    fr: |
      `defaultAction: 'Deny'` rend les règles effectives. `bypass` accepte une combinaison séparée par des virgules d'AzureServices, Logging et Metrics ; 'Logging, Metrics' autorise la lecture des journaux et des métriques sans ajouter l'exception des services approuvés. Une instance d'espace de travail Synapse est admise par une entrée de `resourceAccessRules`, qui prend un ID de locataire et un ID de ressource.
  options:
    azure: { en: "AzureServices adds the trusted services exception, which the requirements exclude, and doesn't allow logs and metrics.", fr: "AzureServices ajoute l'exception des services approuvés, que les exigences excluent, et n'autorise pas les journaux et métriques." }
    all: { en: "This value also enables the trusted services exception, which isn't needed.", fr: "Cette valeur active aussi l'exception des services approuvés, qui n'est pas nécessaire." }
    vnet: { en: "virtualNetworkRules entries reference subnet IDs, not a tenant and resource ID.", fr: "Les entrées de virtualNetworkRules référencent des ID de sous-réseau, pas un locataire et un ID de ressource." }
    ipv6: { en: "ipv6Rules holds IPv6 address rules, not resource instances.", fr: "ipv6Rules contient des règles d'adresses IPv6, pas des instances de ressources." }
references:
  - title: Microsoft.Storage storageAccounts
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.storage/storageaccounts
