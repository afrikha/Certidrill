id: sc500-sr1-sql-audit-2
objective: "2.2.2"
type: series_yesno
series: sc500-sr1-sql-audit
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You enable database-level auditing on each database to LAW1.
  fr: Vous activez l'audit au niveau de chaque base de données vers LAW1.
body:
  solution:
    en: |
      On the **Auditing** page of each of the five databases, you enable **Azure SQL Auditing** and select **Log Analytics** with LAW1 as the destination. You do not configure auditing on SQL1.
    fr: |
      Dans la page **Auditing** de chacune des cinq bases de données, vous activez **Azure SQL Auditing** et sélectionnez **Log Analytics** avec LAW1 comme destination. Vous ne configurez pas l'audit sur SQL1.
answer: { value: false }
explanation:
  correct:
    en: |
      A database-level audit applies only to the database on which it is configured. The databases created every week would not be audited until someone configures each of them, which fails the first requirement and does not minimize administrative effort. A server-level policy is needed to cover future databases automatically.
    fr: |
      Un audit au niveau de la base de données ne s'applique qu'à la base de données sur laquelle il est configuré. Les bases de données créées chaque semaine ne seraient pas auditées tant que personne ne les configure une par une, ce qui ne respecte pas la première exigence et ne réduit pas l'effort d'administration. Une stratégie au niveau du serveur est nécessaire pour couvrir automatiquement les futures bases de données.
references:
  - title: Set up Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-setup
