id: sc500-cs2b-scan-results
objective: "2.1.3"
type: multi
caseStudy: sc500-cs2b-city-power-light
difficulty: 2
status: draft
stem:
  en: |
    You need to configure how the malware scanning results of stcplupload are delivered to meet the processing and audit requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la façon dont les résultats de l'analyse des programmes malveillants de stcplupload sont transmis afin de respecter les exigences de traitement et d'audit.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Send the scan results to egt-cpl and subscribe func-meter to the topic", fr: "Envoyer les résultats d'analyse à egt-cpl et abonner func-meter à la rubrique" } }
    - { id: b, text: { en: "Write the scan results to law-cpl by enabling Log Analytics in the malware scanning settings", fr: "Écrire les résultats d'analyse dans law-cpl en activant Log Analytics dans les paramètres d'analyse" } }
    - { id: c, text: { en: "Trigger func-meter when the Scan result blob index tag of a blob changes", fr: "Déclencher func-meter quand la balise d'index de blob Scan result d'un objet blob change" } }
    - { id: d, text: { en: "Trigger func-meter from the Defender for Cloud security alerts of stcplupload", fr: "Déclencher func-meter à partir des alertes de sécurité Defender for Cloud de stcplupload" } }
    - { id: e, text: { en: "Enable automated malware remediation so that malicious blobs are soft-deleted", fr: "Activer la correction automatisée des programmes malveillants pour que les objets blob malveillants soient supprimés de manière réversible" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Event Grid events deliver a scan result for every scanned blob, clean or malicious, and func-meter can subscribe to the custom topic. Event Grid delivery doesn't support topics without public network access, and egt-cpl has public network access enabled. When Log Analytics is enabled, every scan result is written to the StorageMalwareScanningResults table, which keeps the history for the auditors.
    fr: |
      Les événements Event Grid transmettent un résultat d'analyse pour chaque objet blob analysé, sain ou malveillant, et func-meter peut s'abonner à la rubrique personnalisée. La transmission vers Event Grid ne prend pas en charge les rubriques sans accès réseau public, et egt-cpl a l'accès réseau public activé. Quand Log Analytics est activé, chaque résultat d'analyse est écrit dans la table StorageMalwareScanningResults, qui conserve l'historique pour les auditeurs.
  options:
    c: { en: "Blob index tags aren't tamper-resistant: a user who can modify tags can change the scan result, which the processing requirement forbids.", fr: "Les balises d'index de blob ne sont pas inviolables : un utilisateur qui peut modifier les balises peut changer le résultat d'analyse, ce que l'exigence de traitement interdit." }
    d: { en: "Security alerts are raised for malicious files only, so clean photos would never be processed.", fr: "Les alertes de sécurité ne concernent que les fichiers malveillants : les photos saines ne seraient jamais traitées." }
    e: { en: "Soft-deleting malicious blobs is a remediation; it neither triggers the processing of clean files nor keeps the scan history.", fr: "La suppression réversible des objets blob malveillants est une correction ; elle ne déclenche pas le traitement des fichiers sains et ne conserve pas l'historique des analyses." }
references:
  - title: Introduction to malware scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-malware-scan
  - title: On-upload malware scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/on-upload-malware-scanning
