id: sc500-cs1b-sql-lockdown
objective: "2.2.1"
type: multi
caseStudy: sc500-cs1b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the database requirement for sql-pw-orders.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence relative à la base de données sql-pw-orders.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a virtual network rule for the VNet-Shop subnet that has a Microsoft.Sql service endpoint", fr: "Ajouter une règle de réseau virtuel pour le sous-réseau de VNet-Shop doté d'un point de terminaison de service Microsoft.Sql" } }
    - { id: b, text: { en: "Enable Microsoft Entra-only authentication on sql-pw-orders", fr: "Activer l'authentification Microsoft Entra uniquement sur sql-pw-orders" } }
    - { id: c, text: { en: "Set the connection policy of sql-pw-orders to Redirect", fr: "Définir la stratégie de connexion de sql-pw-orders sur Redirect" } }
    - { id: d, text: { en: "Reset the password of the pwadmin SQL administrator", fr: "Réinitialiser le mot de passe de l'administrateur SQL pwadmin" } }
    - { id: e, text: { en: "Set the public network access of sql-pw-orders to Disable", fr: "Définir l'accès réseau public de sql-pw-orders sur Disable" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      Microsoft Entra-only authentication disables SQL authentication on the logical server, including the pwadmin server administrator; it can be enabled because a Microsoft Entra admin is already set. Setting public network access to Disable denies every connection through the public endpoint, so only connections through private endpoints such as pe-sql are accepted.
    fr: |-
      L'authentification Microsoft Entra uniquement désactive l'authentification SQL sur le serveur logique, y compris l'administrateur de serveur pwadmin ; elle peut être activée car un administrateur Microsoft Entra est déjà défini. Définir l'accès réseau public sur Disable refuse toute connexion par le point de terminaison public : seules les connexions par des points de terminaison privés comme pe-sql sont acceptées.
  options:
    a:
      en: |-
        A virtual network rule allows traffic to the public endpoint from a subnet with a service endpoint; it adds a public path instead of removing one.
      fr: |-
        Une règle de réseau virtuel autorise le trafic vers le point de terminaison public depuis un sous-réseau doté d'un point de terminaison de service ; elle ajoute un chemin public au lieu d'en supprimer un.
    c:
      en: |-
        The connection policy changes how clients reach the database nodes (Redirect or Proxy); it does not restrict which networks or identities can connect.
      fr: |-
        La stratégie de connexion change la façon dont les clients atteignent les nœuds de base de données (Redirect ou Proxy) ; elle ne restreint ni les réseaux ni les identités autorisés.
    d:
      en: |-
        A new password keeps SQL authentication enabled; the requirement is to accept Microsoft Entra identities only.
      fr: |-
        Un nouveau mot de passe laisse l'authentification SQL activée ; l'exigence est de n'accepter que des identités Microsoft Entra.
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
