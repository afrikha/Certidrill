id: sc500-2b-ddb-plan-scope
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription named Sub1 that contains Azure SQL databases, Azure Database for PostgreSQL flexible servers and an Azure Cosmos DB for NoSQL account. Microsoft Defender for Cloud is enabled on Sub1, and no Defender for Databases plan is on.

    In **Defender for Cloud** > **Environment settings** > **Sub1** > **Defender plans**, you switch the **Databases** plan to **On** without changing the plan types, and you save the change.

    What is the result?
  fr: |
    Vous disposez d'un abonnement Azure nommé Sub1 qui contient des bases de données Azure SQL, des serveurs flexibles Azure Database for PostgreSQL et un compte Azure Cosmos DB for NoSQL. Microsoft Defender for Cloud est activé sur Sub1, et aucun plan Defender for Databases n'est activé.

    Dans **Defender for Cloud** > **Paramètres d'environnement** > **Sub1** > **Plans Defender**, vous passez le plan **Bases de données** sur **Activé** sans modifier les types de plans, puis vous enregistrez.

    Quel est le résultat ?
body:
  options:
    - { id: a, text: { en: "Only the Azure SQL databases are protected, because the other plans must be added one by one.", fr: "Seules les bases de données Azure SQL sont protégées, car les autres plans doivent être ajoutés un par un." } }
    - { id: b, text: { en: "The four database plans are enabled and protect the existing and future supported databases of Sub1.", fr: "Les quatre plans de bases de données sont activés et protègent les bases de données prises en charge, existantes et futures, de Sub1." } }
    - { id: c, text: { en: "The four database plans are enabled, but they protect only the databases that exist when you save.", fr: "Les quatre plans de bases de données sont activés, mais ils ne protègent que les bases qui existent au moment de l'enregistrement." } }
    - { id: d, text: { en: "The four database plans are enabled, and each database must then be enabled from its own Defender for Cloud page.", fr: "Les quatre plans de bases de données sont activés, puis chaque base doit être activée depuis sa propre page Defender for Cloud." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Turning on the Databases plan enables its four plans (Azure SQL Databases, SQL Servers on Machines, open-source relational databases and Azure Cosmos DB) for the subscription. Each plan then protects all the supported resources of the subscription, including resources created later. Each plan is billed separately.
    fr: |-
      L'activation du plan Bases de données active ses quatre plans (Azure SQL Databases, SQL Servers on Machines, bases de données relationnelles open source et Azure Cosmos DB) pour l'abonnement. Chaque plan protège ensuite toutes les ressources prises en charge de l'abonnement, y compris celles créées par la suite. Chaque plan est facturé séparément.
  options:
    a: { en: "The Databases plan enables all four plans at once; Select types is only needed to choose a subset.", fr: "Le plan Bases de données active les quatre plans d'un coup ; Sélectionner des types ne sert qu'à en choisir une partie." }
    c: { en: "Subscription-level plans also cover resources created after you enable them.", fr: "Les plans activés au niveau de l'abonnement couvrent aussi les ressources créées après leur activation." }
    d: { en: "Resource-level enablement is an alternative to subscription-level enablement, not an extra step after it.", fr: "L'activation au niveau de la ressource est une alternative à l'activation au niveau de l'abonnement, pas une étape supplémentaire." }
references:
  - title: Protect your databases with Defender for Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-enable-database-protections
