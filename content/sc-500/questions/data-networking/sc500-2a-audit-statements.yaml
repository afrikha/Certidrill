id: sc500-2a-audit-statements
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has an Azure SQL Database logical server named **sql-adatum-web** that hosts a database named **db-shop**. You enable server-level auditing on sql-adatum-web to a storage account with the default audit action groups. A developer also enables database-level auditing on db-shop to the same storage account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un serveur logique Azure SQL Database nommé **sql-adatum-web** qui héberge une base de données nommée **db-shop**. Vous activez l'audit au niveau du serveur sur sql-adatum-web vers un compte de stockage avec les groupes d'actions d'audit par défaut. Un développeur active aussi l'audit au niveau de la base de données sur db-shop vers le même compte de stockage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The server audit records failed authentication attempts on the databases of sql-adatum-web.
        fr: |
          L'audit du serveur enregistre les tentatives d'authentification ayant échoué sur les bases de données de sql-adatum-web.
    - id: s2
      text:
        en: |
          Because db-shop has its own audit policy, the server audit policy no longer applies to db-shop.
        fr: |
          Comme db-shop a sa propre stratégie d'audit, la stratégie d'audit du serveur ne s'applique plus à db-shop.
    - id: s3
      text:
        en: |
          The audit logs are written to the storage account as blobs in the .xel format.
        fr: |
          Les journaux d'audit sont écrits dans le compte de stockage sous forme d'objets blob au format .xel.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The default action groups are BATCH_COMPLETED_GROUP, SUCCESSFUL_DATABASE_AUTHENTICATION_GROUP and FAILED_DATABASE_AUTHENTICATION_GROUP. A database policy doesn't replace the server policy: both run, and db-shop is audited twice. Audit logs in storage are written as append blobs in the .xel format.
    fr: |
      Les groupes d'actions par défaut sont BATCH_COMPLETED_GROUP, SUCCESSFUL_DATABASE_AUTHENTICATION_GROUP et FAILED_DATABASE_AUTHENTICATION_GROUP. Une stratégie de base de données ne remplace pas celle du serveur : les deux s'exécutent, et db-shop est auditée deux fois. Dans le stockage, les journaux d'audit sont écrits comme objets blob d'ajout au format .xel.
references:
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
