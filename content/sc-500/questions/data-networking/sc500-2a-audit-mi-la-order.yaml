id: sc500-2a-audit-mi-la-order
objective: "2.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure SQL Managed Instance named **sqlmi-contoso** and a Log Analytics workspace named **law-sec**. Auditing isn't configured on sqlmi-contoso.

    You need the server audit events of sqlmi-contoso to be sent to law-sec.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. dispose d'une instance Azure SQL Managed Instance nommée **sqlmi-contoso** et d'un espace de travail Log Analytics nommé **law-sec**. L'audit n'est pas configuré sur sqlmi-contoso.

    Vous devez faire en sorte que les événements d'audit du serveur sqlmi-contoso soient envoyés à law-sec.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: diag, text: { en: "Add a diagnostic setting to sqlmi-contoso that sends the SQLSecurityAuditEvents category to law-sec.", fr: "Ajouter à sqlmi-contoso un paramètre de diagnostic qui envoie la catégorie SQLSecurityAuditEvents à law-sec." } }
    - { id: audit, text: { en: "Run CREATE SERVER AUDIT with TO EXTERNAL_MONITOR.", fr: "Exécuter CREATE SERVER AUDIT avec TO EXTERNAL_MONITOR." } }
    - { id: spec, text: { en: "Create a server audit specification for the audit, and then enable the audit and the specification.", fr: "Créer une spécification d'audit du serveur pour l'audit, puis activer l'audit et la spécification." } }
    - { id: cred, text: { en: "Create a credential that contains a SAS token for a blob container.", fr: "Créer des informations d'identification contenant un jeton SAS pour un conteneur d'objets blob." } }
    - { id: url, text: { en: "Run CREATE SERVER AUDIT with TO URL and the path of a blob container.", fr: "Exécuter CREATE SERVER AUDIT avec TO URL et le chemin d'un conteneur d'objets blob." } }
    - { id: eh, text: { en: "Create an Event Hubs namespace and stream the audit events to it.", fr: "Créer un espace de noms Event Hubs et y transmettre les événements d'audit." } }
answer:
  sequence: [ diag, audit, spec ]
explanation:
  correct:
    en: |
      For SQL Managed Instance, events reach Log Analytics through a diagnostic setting with the SQLSecurityAuditEvents category, which you add first. You then create the server audit with TO EXTERNAL_MONITOR, which sends its events to that diagnostic setting, and finally create the server audit specification that lists the action groups and turn the audit on.
    fr: |
      Pour SQL Managed Instance, les événements parviennent à Log Analytics par un paramètre de diagnostic avec la catégorie SQLSecurityAuditEvents, que vous ajoutez en premier. Vous créez ensuite l'audit du serveur avec TO EXTERNAL_MONITOR, qui envoie ses événements à ce paramètre de diagnostic, puis vous créez la spécification d'audit du serveur qui liste les groupes d'actions et vous activez l'audit.
  options:
    cred: { en: "A SAS credential is needed only for an audit written to blob storage with TO URL.", fr: "Des informations d'identification SAS ne sont nécessaires que pour un audit écrit dans le stockage blob avec TO URL." }
    url: { en: "TO URL writes .xel files to blob storage, not to Log Analytics.", fr: "TO URL écrit des fichiers .xel dans le stockage blob, pas dans Log Analytics." }
    eh: { en: "Log Analytics is a direct destination of the diagnostic setting; Event Hubs isn't needed.", fr: "Log Analytics est une destination directe du paramètre de diagnostic ; Event Hubs n'est pas nécessaire." }
references:
  - title: Get started with Azure SQL Managed Instance auditing
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/auditing-configure
