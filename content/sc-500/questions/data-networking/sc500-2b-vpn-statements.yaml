id: sc500-2b-vpn-statements
objective: "2.3.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank secures VPN connections on several VPN gateways of SKU VpnGw2AZ. GW-Hub and GW-DR are connected by a VNet-to-VNet connection made of two connection resources, Hub-to-DR and DR-to-Hub. GW-Users uses point-to-site VPN with Azure certificate authentication and Microsoft Entra ID authentication.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank sécurise des connexions VPN sur plusieurs passerelles VPN de référence SKU VpnGw2AZ. GW-Hub et GW-DR sont reliées par une connexion de réseau virtuel à réseau virtuel composée de deux ressources de connexion, Hub-to-DR et DR-to-Hub. GW-Users utilise le VPN point à site avec l'authentification par certificat Azure et l'authentification Microsoft Entra ID.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Applying a custom IPsec/IKE policy to Hub-to-DR only is enough for the VNet-to-VNet tunnel to use that policy.
        fr: Appliquer une stratégie IPsec/IKE personnalisée à Hub-to-DR uniquement suffit pour que le tunnel de réseau virtuel à réseau virtuel utilise cette stratégie.
    - id: s2
      text:
        en: Removing a trusted root certificate from GW-Users revokes access for every client certificate signed by that root.
        fr: Supprimer un certificat racine approuvé de GW-Users révoque l'accès de tous les certificats clients signés par cette racine.
    - id: s3
      text:
        en: To use the Microsoft-registered Azure VPN Client app ID as the Audience, you must first register an application and grant admin consent in your tenant.
        fr: Pour utiliser l'ID d'application Azure VPN Client inscrit par Microsoft comme Audience, vous devez d'abord inscrire une application et accorder le consentement administrateur dans votre locataire.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      A VNet-to-VNet connection has two connection resources, and both must carry identical policies; a mismatch prevents the tunnel from connecting. Removing a trusted root revokes all the client certificates generated from it. The Microsoft-registered app ID can be used without manual app registration, and you don't grant administrator consent for it.
    fr: |-
      Une connexion de réseau virtuel à réseau virtuel comporte deux ressources de connexion, qui doivent porter des stratégies identiques ; une différence empêche le tunnel de se connecter. Supprimer une racine approuvée révoque tous les certificats clients générés à partir d'elle. L'ID d'application inscrit par Microsoft s'utilise sans inscription manuelle d'application, et vous n'accordez pas de consentement administrateur pour lui.
references:
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
  - title: Configure P2S VPN Gateway for Microsoft Entra ID Authentication
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway
