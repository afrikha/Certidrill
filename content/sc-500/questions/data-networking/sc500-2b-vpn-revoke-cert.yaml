id: sc500-2b-vpn-revoke-cert
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses point-to-site VPN with Azure certificate authentication on a VPN gateway named VPNGW1. All the client certificates are issued from one trusted root certificate named TailspinRoot that is uploaded to VPNGW1.

    A laptop that holds the client certificate of a user named User7 is stolen. You need to prevent this certificate from connecting, while every other user keeps connecting without changes.

    What should you do?
  fr: |
    Tailspin Toys utilise le VPN point à site avec l'authentification par certificat Azure sur une passerelle VPN nommée VPNGW1. Tous les certificats clients sont émis à partir d'un même certificat racine approuvé nommé TailspinRoot, chargé sur VPNGW1.

    Un ordinateur portable qui contient le certificat client d'un utilisateur nommé User7 est volé. Vous devez empêcher ce certificat de se connecter, tandis que tous les autres utilisateurs continuent à se connecter sans changement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove TailspinRoot from the Root certificate section of VPNGW1.", fr: "Supprimer TailspinRoot de la section Certificat racine de VPNGW1." } }
    - { id: b, text: { en: "Add the thumbprint of User7's client certificate to the Revoked certificates section of VPNGW1.", fr: "Ajouter l'empreinte du certificat client de User7 à la section Certificats révoqués de VPNGW1." } }
    - { id: c, text: { en: "Disable the User7 account in Microsoft Entra ID and revoke its sessions.", fr: "Désactiver le compte User7 dans Microsoft Entra ID et révoquer ses sessions." } }
    - { id: d, text: { en: "Reset VPNGW1, and then download and distribute a new VPN client profile.", fr: "Réinitialiser VPNGW1, puis télécharger et distribuer un nouveau profil de client VPN." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Adding a client certificate's thumbprint to the Revoked certificates list blocks that certificate as soon as the update completes, while the other certificates issued from the same root keep working. Removing the trusted root would revoke every client certificate signed by it.
    fr: |-
      Ajouter l'empreinte d'un certificat client à la liste des certificats révoqués bloque ce certificat dès la fin de la mise à jour, tandis que les autres certificats émis à partir de la même racine continuent de fonctionner. Supprimer la racine approuvée révoquerait tous les certificats clients qu'elle a signés.
  options:
    a: { en: "Removing the root certificate revokes access for all client certificates generated from it, so every user loses access.", fr: "Supprimer le certificat racine révoque l'accès de tous les certificats clients générés à partir de celui-ci : tous les utilisateurs perdent l'accès." }
    c: { en: "With certificate authentication, the gateway validates the certificate, not a Microsoft Entra account.", fr: "Avec l'authentification par certificat, la passerelle valide le certificat, pas un compte Microsoft Entra." }
    d: { en: "Resetting the gateway and the client profile doesn't invalidate a certificate that chains to the trusted root.", fr: "Réinitialiser la passerelle et le profil client n'invalide pas un certificat chaîné à la racine approuvée." }
references:
  - title: Configure server settings for P2S VPN Gateway certificate authentication
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-certificate-gateway
