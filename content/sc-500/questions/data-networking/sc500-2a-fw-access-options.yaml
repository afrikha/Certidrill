id: sc500-2a-fw-access-options
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has three storage accounts that have different network requirements:

    | Account | Requirement |
    | --- | --- |
    | stwgpay | Only private endpoints can connect. The public endpoint must reject all traffic. |
    | stwgreports | Only two subnets and the public IP range of a branch office can reach the public endpoint. |
    | stwgshared | Public access must be governed by the network security perimeter that already protects other PaaS resources of the team. |

    Which public network access option should you select for each account? To answer, drag the appropriate options to the correct accounts. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose de trois comptes de stockage qui ont des exigences réseau différentes :

    | Compte | Exigence |
    | --- | --- |
    | stwgpay | Seuls des points de terminaison privés peuvent se connecter. Le point de terminaison public doit rejeter tout le trafic. |
    | stwgreports | Seuls deux sous-réseaux et la plage d'adresses IP publiques d'une agence peuvent joindre le point de terminaison public. |
    | stwgshared | L'accès public doit être régi par le périmètre de sécurité réseau qui protège déjà les autres ressources PaaS de l'équipe. |

    Quelle option d'accès réseau public devez-vous sélectionner pour chaque compte ? Pour répondre, faites glisser les options appropriées vers les comptes correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: all, text: Enabled from all networks }
    - { id: selected, text: Enabled from selected networks }
    - { id: disabled, text: Disabled }
    - { id: perimeter, text: Secured by perimeter }
  targets:
    - { id: pay, text: stwgpay }
    - { id: reports, text: stwgreports }
    - { id: shared, text: stwgshared }
answer:
  mapping: { pay: disabled, reports: selected, shared: perimeter }
explanation:
  correct:
    en: |
      Disabled blocks traffic from all networks on the public endpoint, leaving private endpoints as the only path. Enabled from selected networks admits only the listed virtual networks, IP ranges and resource instances. Secured by perimeter hands public access control to a network security perimeter.
    fr: |
      Disabled bloque le trafic de tous les réseaux sur le point de terminaison public : seuls les points de terminaison privés restent utilisables. Enabled from selected networks n'admet que les réseaux virtuels, plages IP et instances de ressources listés. Secured by perimeter confie le contrôle de l'accès public à un périmètre de sécurité réseau.
  options:
    all: { en: "Enabled from all networks admits traffic from any network, which meets none of the requirements.", fr: "Enabled from all networks admet le trafic de tous les réseaux, ce qui ne répond à aucune des exigences." }
references:
  - title: Set the default public network access rule for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-set-default-access
