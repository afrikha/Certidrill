id: sc500-2a-sql-cli-firewall
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has an Azure SQL Database logical server named **sql-adatum** in a resource group named **RG-Sql**. Public network access is set to **Selected networks**.

    Users at the head office, which uses the public range 131.107.10.0/24, must be able to connect to every database on sql-adatum. No other address must be added.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un serveur logique Azure SQL Database nommé **sql-adatum** dans un groupe de ressources nommé **RG-Sql**. L'accès réseau public est défini sur **Selected networks**.

    Les utilisateurs du siège, qui utilise la plage publique 131.107.10.0/24, doivent pouvoir se connecter à toutes les bases de données de sql-adatum. Aucune autre adresse ne doit être ajoutée.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az sql server [[grp]] create --resource-group RG-Sql --server sql-adatum \
      --name HeadOffice --start-ip-address [[start]] --end-ip-address [[end]]
  slots:
    - id: grp
      options:
        - { id: fw, text: firewall-rule }
        - { id: vnet, text: vnet-rule }
        - { id: admin, text: ad-admin }
    - id: start
      options:
        - { id: s10, text: "131.107.10.0" }
        - { id: s0, text: "0.0.0.0" }
        - { id: s107, text: "131.107.0.0" }
    - id: end
      options:
        - { id: e10, text: "131.107.10.255" }
        - { id: e0, text: "0.0.0.0" }
        - { id: e107, text: "131.107.255.255" }
answer:
  values: { grp: fw, start: s10, end: e10 }
explanation:
  correct:
    en: |
      `az sql server firewall-rule create` creates a server-level IP firewall rule, which applies to every database of the server. The rule is defined by a start and an end address, so the /24 range is 131.107.10.0 to 131.107.10.255.
    fr: |
      `az sql server firewall-rule create` crée une règle de pare-feu IP au niveau du serveur, qui s'applique à toutes les bases de données du serveur. La règle est définie par une adresse de début et une adresse de fin : la plage /24 va donc de 131.107.10.0 à 131.107.10.255.
  options:
    vnet: { en: "A virtual network rule admits an Azure subnet with a service endpoint, not a public IP range.", fr: "Une règle de réseau virtuel admet un sous-réseau Azure doté d'un point de terminaison de service, pas une plage IP publique." }
    admin: { en: "ad-admin sets the Microsoft Entra admin of the server; it creates no firewall rule.", fr: "ad-admin définit l'administrateur Microsoft Entra du serveur ; il ne crée aucune règle de pare-feu." }
    s0: { en: "A rule from 0.0.0.0 to 0.0.0.0 is the Allow Azure services rule, which admits every Azure resource.", fr: "Une règle de 0.0.0.0 à 0.0.0.0 est la règle Allow Azure services, qui admet toutes les ressources Azure." }
    e107: { en: "Ending at 131.107.255.255 admits addresses outside the head office range.", fr: "Finir à 131.107.255.255 admet des adresses hors de la plage du siège." }
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
