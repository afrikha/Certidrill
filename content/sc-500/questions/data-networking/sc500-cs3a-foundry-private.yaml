id: sc500-cs3a-foundry-private
objective: "2.3.6"
type: multi
caseStudy: sc500-cs3a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the network requirement for fdy-trey. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence réseau concernant fdy-trey. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a private endpoint for fdy-trey in snet-pe with the target sub-resource account.", fr: "Créer un point de terminaison privé pour fdy-trey dans snet-pe avec la sous-ressource cible account." } }
    - { id: b, text: { en: "Set the public network access of fdy-trey to Disabled.", fr: "Définir l'accès au réseau public de fdy-trey sur Disabled." } }
    - { id: c, text: { en: "Enable the Microsoft.CognitiveServices service endpoint on snet-apim.", fr: "Activer le point de terminaison de service Microsoft.CognitiveServices sur snet-apim." } }
    - { id: d, text: { en: "Create a Private Link service in snet-pe in front of fdy-trey.", fr: "Créer un service Private Link dans snet-pe devant fdy-trey." } }
    - { id: e, text: { en: "Add a network rule exception for trusted Azure services on fdy-trey.", fr: "Ajouter une exception de règle réseau pour les services Azure approuvés sur fdy-trey." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      A private endpoint gives fdy-trey a private IP address in snet-pe, which apim-trey reaches from its subnet in the same virtual network; in the portal, the target of the private endpoint is the account sub-resource. Setting public network access to Disabled then rejects all traffic on the public endpoint.
    fr: |-
      Un point de terminaison privé donne à fdy-trey une adresse IP privée dans snet-pe, que apim-trey joint depuis son sous-réseau du même réseau virtuel ; dans le portail, la cible du point de terminaison privé est la sous-ressource account. Définir l'accès au réseau public sur Disabled rejette ensuite tout le trafic sur le point de terminaison public.
  options:
    c:
      en: |-
        A service endpoint restricts access to the public endpoint by source subnet; the traffic still targets the public endpoint, not a private IP address.
      fr: |-
        Un point de terminaison de service restreint l'accès au point de terminaison public selon le sous-réseau source ; le trafic vise toujours le point de terminaison public, pas une adresse IP privée.
    d:
      en: |-
        A Private Link service publishes your own service behind a Standard load balancer to consumers; it is not used to reach a PaaS resource.
      fr: |-
        Un service Private Link publie votre propre service derrière un équilibreur de charge Standard pour des consommateurs ; il ne sert pas à joindre une ressource PaaS.
    e:
      en: |-
        The trusted services exception lets some Azure services bypass the network rules; it does not give apim-trey a private path or close the public endpoint.
      fr: |-
        L'exception pour les services approuvés permet à certains services Azure de contourner les règles réseau ; elle ne donne pas à apim-trey de chemin privé et ne ferme pas le point de terminaison public.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/configure-private-link
