id: sc500-2c-fw-rule-types
objective: "2.3.8"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    An Azure Firewall Standard named **fw-hub** filters the traffic of a hub-and-spoke network. You need to add rules to its firewall policy to meet the following requirements.

    Which type of rule or setting should you use for each requirement? To answer, drag the appropriate items to the correct requirements. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Pare-feu Azure Standard nommé **fw-hub** filtre le trafic d'un réseau hub-and-spoke. Vous devez ajouter des règles à sa stratégie de pare-feu pour répondre aux exigences suivantes.

    Quel type de règle ou de paramètre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dnat, text: { en: "DNAT rule", fr: "Règle DNAT" } }
    - { id: net, text: { en: "Network rule", fr: "Règle de réseau" } }
    - { id: app, text: { en: "Application rule", fr: "Règle d'application" } }
    - { id: tiallow, text: { en: "Threat intelligence allowlist entry", fr: "Entrée de la liste d'autorisation du renseignement sur les menaces" } }
    - { id: dns, text: { en: "DNS proxy setting", fr: "Paramètre de proxy DNS" } }
  targets:
    - id: t-publish
      text: { en: "Publish TCP 443 of the web VM 10.1.2.10 on the public IP address of fw-hub.", fr: "Publier le TCP 443 de la machine virtuelle web 10.1.2.10 sur l'adresse IP publique de fw-hub." } 
    - id: t-update
      text: { en: "Allow the VMs to reach Windows Update by using the WindowsUpdate FQDN tag.", fr: "Autoriser les machines virtuelles à joindre Windows Update avec la balise FQDN WindowsUpdate." }
    - id: t-ntp
      text: { en: "Allow UDP 123 from the spokes to the NTP server 203.0.113.20.", fr: "Autoriser l'UDP 123 depuis les spokes vers le serveur NTP 203.0.113.20." }
answer:
  mapping: { t-publish: dnat, t-update: app, t-ntp: net }
explanation:
  correct:
    en: A DNAT rule translates inbound traffic on the firewall public IP address to a private address and port. FQDN tags, such as WindowsUpdate, are used in application rules to allow outbound traffic to well-known Microsoft services. Non-HTTP traffic to an IP address and port, such as NTP over UDP, is allowed with a network rule.
    fr: Une règle DNAT traduit le trafic entrant sur l'adresse IP publique du pare-feu vers une adresse et un port privés. Les balises FQDN, comme WindowsUpdate, s'utilisent dans les règles d'application pour autoriser le trafic sortant vers des services Microsoft connus. Le trafic non HTTP vers une adresse IP et un port, comme le NTP en UDP, s'autorise avec une règle de réseau.
  options:
    tiallow: { en: "An allowlist exempts addresses from threat intelligence filtering; it does not allow traffic that no rule allows.", fr: "Une liste d'autorisation exempte des adresses du filtrage par renseignement sur les menaces ; elle n'autorise pas un trafic qu'aucune règle n'autorise." }
    dns: { en: "DNS proxy forwards DNS queries; it does not allow or translate traffic.", fr: "Le proxy DNS transfère les requêtes DNS ; il n'autorise ni ne traduit de trafic." }
references:
  - title: FQDN tags overview
    url: https://learn.microsoft.com/en-us/azure/firewall/fqdn-tags
  - title: Azure Firewall rule processing logic
    url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing
