id: sc500-sr1-sql-audit-3
objective: "2.2.2"
type: series_yesno
series: sc500-sr1-sql-audit
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You enable Microsoft Defender for SQL on SQL1.
  fr: Vous activez Microsoft Defender for SQL sur SQL1.
body:
  solution:
    en: |
      On the **Microsoft Defender for Cloud** page of SQL1, you enable **Microsoft Defender for SQL** at the server level so that it protects all the existing and future databases of SQL1. You connect the Defender for Cloud alerts to LAW1.
    fr: |
      Dans la page **Microsoft Defender for Cloud** de SQL1, vous activez **Microsoft Defender for SQL** au niveau du serveur afin qu'il protège toutes les bases de données existantes et futures de SQL1. Vous connectez les alertes de Defender for Cloud à LAW1.
answer: { value: false }
explanation:
  correct:
    en: |
      Microsoft Defender for SQL provides vulnerability assessment and threat protection alerts; it does not enable auditing and does not write the database audit logs. Sending its alerts to LAW1 provides security alerts, not the audited database events, so the first two requirements are not met. Auditing must be enabled on SQL1 itself.
    fr: |
      Microsoft Defender for SQL fournit l'évaluation des vulnérabilités et des alertes de protection contre les menaces ; il n'active pas l'audit et n'écrit pas les journaux d'audit des bases de données. Envoyer ses alertes vers LAW1 fournit des alertes de sécurité, pas les événements audités des bases de données : les deux premières exigences ne sont pas respectées. L'audit doit être activé sur SQL1 lui-même.
references:
  - title: Overview of Microsoft Defender for Azure SQL Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-introduction
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
