id: sc500-2c-nw-ip-flow-result
objective: "2.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A virtual machine named **VM-Web2** has a public IP address and a network interface with the private IP address 10.3.1.4 in a subnet named snet-web. The following security rules apply. Only the default rules exist in addition to the rules shown.

    | Level | Name | Priority | Port | Source | Action |
    | --- | --- | --- | --- | --- | --- |
    | Security admin rule (Virtual Network Manager) | Allow-Web | 10 | TCP 443 | Any | Allow |
    | nsg-snet (subnet snet-web) | Allow-HTTPS-Inet | 100 | TCP 443 | Internet | Allow |
    | nsg-nic (network interface of VM-Web2) | Allow-SSH-Admin | 200 | TCP 22 | 198.51.100.0/24 | Allow |

    You run IP flow verify for VM-Web2 with the direction Inbound, the protocol TCP, the local address 10.3.1.4:443 and the remote address 203.0.113.80:60000.

    Which result does IP flow verify return?
  fr: |
    Une machine virtuelle nommée **VM-Web2** a une adresse IP publique et une carte réseau d'adresse IP privée 10.3.1.4 dans un sous-réseau nommé snet-web. Les règles de sécurité suivantes s'appliquent. Seules les règles par défaut existent en plus des règles indiquées.

    | Niveau | Nom | Priorité | Port | Source | Action |
    | --- | --- | --- | --- | --- | --- |
    | Règle d'administration de la sécurité (Virtual Network Manager) | Allow-Web | 10 | TCP 443 | Any | Allow |
    | nsg-snet (sous-réseau snet-web) | Allow-HTTPS-Inet | 100 | TCP 443 | Internet | Allow |
    | nsg-nic (carte réseau de VM-Web2) | Allow-SSH-Admin | 200 | TCP 22 | 198.51.100.0/24 | Allow |

    Vous exécutez la vérification des flux IP pour VM-Web2 avec la direction Inbound, le protocole TCP, l'adresse locale 10.3.1.4:443 et l'adresse distante 203.0.113.80:60000.

    Quel résultat la vérification des flux IP renvoie-t-elle ?
body:
  options:
    - id: a
      text: { en: "Access allowed, by the Allow-Web security admin rule", fr: "Accès autorisé, par la règle d'administration de la sécurité Allow-Web" }
    - id: b
      text: { en: "Access allowed, by the Allow-HTTPS-Inet rule of nsg-snet", fr: "Accès autorisé, par la règle Allow-HTTPS-Inet de nsg-snet" }
    - id: c
      text: { en: "Access denied, by the DenyAllInBound default rule of nsg-snet", fr: "Accès refusé, par la règle par défaut DenyAllInBound de nsg-snet" }
    - id: d
      text: { en: "Access denied, by the DenyAllInBound default rule of nsg-nic", fr: "Accès refusé, par la règle par défaut DenyAllInBound de nsg-nic" }
answer: { optionId: d }
explanation:
  correct:
    en: A security admin rule with the Allow action lets the traffic continue to the NSGs instead of ending the evaluation. Inbound traffic is evaluated by the subnet NSG and then by the network interface NSG, and both must allow it. nsg-snet allows HTTPS from the internet, but nsg-nic has no rule for TCP 443, so its DenyAllInBound default rule denies the flow.
    fr: "Une règle d'administration de la sécurité avec l'action Allow laisse le trafic continuer vers les NSG au lieu de mettre fin à l'évaluation. Le trafic entrant est évalué par le NSG du sous-réseau puis par celui de la carte réseau, et les deux doivent l'autoriser. nsg-snet autorise le HTTPS depuis Internet, mais nsg-nic n'a aucune règle pour le TCP 443 : sa règle par défaut DenyAllInBound refuse le flux."
  options:
    a: { en: "Allow is not a terminating action for security admin rules; only Deny and Always Allow end the evaluation.", fr: "Allow n'est pas une action terminale pour les règles d'administration de la sécurité ; seules Deny et Always Allow mettent fin à l'évaluation." }
    b: { en: "The subnet NSG allows the flow, but the network interface NSG must allow it too.", fr: "Le NSG du sous-réseau autorise le flux, mais le NSG de la carte réseau doit aussi l'autoriser." }
    c: { en: "Allow-HTTPS-Inet matches before the default rules of nsg-snet.", fr: "Allow-HTTPS-Inet correspond avant les règles par défaut de nsg-snet." }
references:
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
