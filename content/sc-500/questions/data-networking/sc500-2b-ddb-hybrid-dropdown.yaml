id: sc500-2b-ddb-hybrid-dropdown
objective: "2.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Defender for Cloud. It has the following database workloads outside Azure:

    - Amazon RDS for PostgreSQL instances in an AWS account that is connected to Defender for Cloud by a connector.
    - SQL Server 2019 running on a physical Windows Server 2019 host in the Paris datacenter. The host isn't connected to Azure.

    You need to get Defender for Databases threat protection for both workloads.

    How should you complete the plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Microsoft Defender for Cloud. Elle dispose des charges de travail de base de données suivantes hors d'Azure :

    - Des instances Amazon RDS for PostgreSQL dans un compte AWS connecté à Defender for Cloud par un connecteur.
    - SQL Server 2019 exécuté sur un hôte physique Windows Server 2019 dans le centre de données de Paris. L'hôte n'est pas connecté à Azure.

    Vous devez obtenir la protection contre les menaces de Defender for Databases pour les deux charges de travail.

    Comment devez-vous compléter le plan ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Amazon RDS for PostgreSQL: turn on the Databases plan in the Defender plans of [[aws]].

      SQL Server 2019 host: first [[onprem]], then turn on [[plan]] for the subscription that contains its Azure resource.
    fr: |
      Amazon RDS for PostgreSQL : activer le plan Bases de données dans les plans Defender de [[aws]].

      Hôte SQL Server 2019 : d'abord [[onprem]], puis activer [[plan]] pour l'abonnement qui contient sa ressource Azure.
  slots:
    - id: aws
      options:
        - { id: conn, text: { en: "the AWS connector in Environment settings", fr: "le connecteur AWS dans les paramètres d'environnement" } }
        - { id: sub, text: { en: "the Azure subscription that contains the connector", fr: "l'abonnement Azure qui contient le connecteur" } }
        - { id: law, text: { en: "the Log Analytics workspace of Defender for Cloud", fr: "l'espace de travail Log Analytics de Defender for Cloud" } }
    - id: onprem
      options:
        - { id: arc, text: { en: "onboard the host to Azure Arc", fr: "intégrer l'hôte à Azure Arc" } }
        - { id: ama, text: { en: "install the Azure Monitor Agent with a data collection rule", fr: "installer l'Agent Azure Monitor avec une règle de collecte de données" } }
        - { id: s2s, text: { en: "connect the datacenter to Azure with a site-to-site VPN", fr: "connecter le centre de données à Azure par un VPN site à site" } }
    - id: plan
      options:
        - { id: sqlvm, text: Defender for SQL Servers on Machines }
        - { id: sqldb, text: Defender for Azure SQL Databases }
        - { id: srv, text: Defender for Servers Plan 2 }
answer:
  values: { aws: conn, onprem: arc, plan: sqlvm }
explanation:
  correct:
    en: |-
      For AWS, Defender plans are set on the AWS connector (Environment settings, then the AWS account), where the Databases plan covers supported Amazon RDS engines. An on-premises SQL Server must first be onboarded to Azure Arc and registered as a SQL Server instance enabled by Azure Arc; the Defender for SQL Servers on Machines plan then protects it.
    fr: |-
      Pour AWS, les plans Defender se définissent sur le connecteur AWS (paramètres d'environnement, puis le compte AWS), où le plan Bases de données couvre les moteurs Amazon RDS pris en charge. Un SQL Server local doit d'abord être intégré à Azure Arc et inscrit comme instance SQL Server activée par Azure Arc ; le plan Defender for SQL Servers on Machines le protège ensuite.
  options:
    sub: { en: "The Azure subscription's plans protect Azure resources; AWS resources follow the plans of their connector.", fr: "Les plans de l'abonnement Azure protègent les ressources Azure ; les ressources AWS suivent les plans de leur connecteur." }
    ama: { en: "The agent alone doesn't create an Azure resource for the SQL Server instance; Azure Arc is the prerequisite for non-Azure machines.", fr: "L'agent seul ne crée pas de ressource Azure pour l'instance SQL Server ; Azure Arc est le prérequis pour les machines hors Azure." }
    s2s: { en: "Network connectivity doesn't make the host an Azure resource that Defender for Cloud can protect.", fr: "La connectivité réseau ne fait pas de l'hôte une ressource Azure que Defender for Cloud peut protéger." }
    sqldb: { en: "Defender for Azure SQL Databases covers PaaS Azure SQL services, not SQL Server installed on a machine.", fr: "Defender for Azure SQL Databases couvre les services PaaS Azure SQL, pas SQL Server installé sur une machine." }
    srv: { en: "Defender for Servers protects the operating system, not the SQL Server databases.", fr: "Defender for Servers protège le système d'exploitation, pas les bases de données SQL Server." }
references:
  - title: Enable Defender for SQL Servers on Machines
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-usage
  - title: Overview of Microsoft Defender for Open-Source Relational Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-databases-introduction
