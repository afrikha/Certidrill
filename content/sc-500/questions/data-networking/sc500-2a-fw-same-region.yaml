id: sc500-2a-fw-same-region
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a storage account named **stcontosoapp** in the West Europe region. Public network access of stcontosoapp is set to **Enabled from selected networks**.

    Three virtual machines in a subnet named **snet-app** of a virtual network named **VNet-App**, also in West Europe, must access blob data in stcontosoapp. Each VM has a Standard SKU public IP address. An administrator added an IP network rule for each of the three public IP addresses, but the VMs still receive 403 errors.

    You need the VMs to access stcontosoapp. The solution must not use private endpoints.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un compte de stockage nommé **stcontosoapp** dans la région West Europe. L'accès réseau public de stcontosoapp est défini sur **Enabled from selected networks**.

    Trois machines virtuelles d'un sous-réseau nommé **snet-app** du réseau virtuel **VNet-App**, également situé en West Europe, doivent accéder aux données blob de stcontosoapp. Chaque machine virtuelle possède une adresse IP publique de référence SKU Standard. Un administrateur a ajouté une règle de réseau IP pour chacune des trois adresses IP publiques, mais les machines virtuelles reçoivent toujours des erreurs 403.

    Vous devez permettre aux machines virtuelles d'accéder à stcontosoapp. La solution ne doit pas utiliser de points de terminaison privés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the Microsoft.Storage service endpoint on snet-app and add a virtual network rule for snet-app.", fr: "Activer le point de terminaison de service Microsoft.Storage sur snet-app et ajouter une règle de réseau virtuel pour snet-app." } }
    - { id: b, text: { en: "Add an IP network rule for the address space of VNet-App and keep the existing IP network rules.", fr: "Ajouter une règle de réseau IP pour l'espace d'adressage de VNet-App et conserver les règles de réseau IP existantes." } }
    - { id: c, text: { en: "Select the exception Allow Azure services on the trusted services list to access this storage account.", fr: "Sélectionner l'exception Allow Azure services on the trusted services list to access this storage account." } }
    - { id: d, text: { en: "Replace the three IP network rules with one IP network rule that uses a /32 prefix for each address.", fr: "Remplacer les trois règles de réseau IP par une règle de réseau IP utilisant un préfixe /32 pour chaque adresse." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      IP network rules have no effect on requests that originate from the same Azure region as the storage account, so the public IP rules never match. Same-region clients are allowed with a virtual network rule, which requires a Microsoft.Storage (or Microsoft.Storage.Global) service endpoint on the subnet.
    fr: |
      Les règles de réseau IP n'ont aucun effet sur les requêtes provenant de la même région Azure que le compte de stockage : les règles pour les adresses IP publiques ne correspondent donc jamais. Les clients de la même région sont autorisés par une règle de réseau virtuel, qui exige un point de terminaison de service Microsoft.Storage (ou Microsoft.Storage.Global) sur le sous-réseau.
  options:
    b:
      en: |
        IP network rules accept only public internet addresses; private ranges such as 10.0.0.0/8 aren't allowed.
      fr: |
        Les règles de réseau IP n'acceptent que des adresses Internet publiques ; les plages privées comme 10.0.0.0/8 ne sont pas autorisées.
    c:
      en: |
        The trusted services exception applies to specific Azure services that authenticate strongly, not to your own virtual machines.
      fr: |
        L'exception des services approuvés s'applique à certains services Azure qui s'authentifient de manière forte, pas à vos propres machines virtuelles.
    d:
      en: |
        /31 and /32 prefixes aren't supported (single addresses are entered without a prefix), and IP rules still wouldn't apply to same-region clients.
      fr: |
        Les préfixes /31 et /32 ne sont pas pris en charge (une adresse unique est saisie sans préfixe), et les règles IP ne s'appliqueraient toujours pas aux clients de la même région.
