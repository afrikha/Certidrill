id: sc500-2b-gsa-connector
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is replacing its VPN with Microsoft Entra Private Access. Remote users run the Global Secure Access client on their devices. The internal file servers and line-of-business apps are in the Lyon datacenter, which accepts no inbound connections from the internet.

    Which component should you install on a Windows Server in the Lyon datacenter so that Private Access can reach the internal apps?
  fr: |
    Proseware remplace son VPN par Microsoft Entra Private Access. Les utilisateurs distants exécutent le client Global Secure Access sur leurs appareils. Les serveurs de fichiers internes et les applications métier se trouvent dans le centre de données de Lyon, qui n'accepte aucune connexion entrante depuis Internet.

    Quel composant devez-vous installer sur un serveur Windows Server du centre de données de Lyon pour que Private Access puisse atteindre les applications internes ?
body:
  options:
    - { id: a, text: { en: "The Global Secure Access client", fr: "Le client Global Secure Access" } }
    - { id: b, text: { en: "The Microsoft Entra private network connector", fr: "Le connecteur de réseau privé Microsoft Entra" } }
    - { id: c, text: { en: "Microsoft Entra Connect Sync", fr: "Microsoft Entra Connect Sync" } }
    - { id: d, text: { en: "The Azure Connected Machine agent", fr: "L'agent Azure Connected Machine" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The private network connector is a lightweight agent installed on a Windows Server close to the apps. It makes only outbound connections to the Global Secure Access service and brokers the traffic between the service and the internal resources, so the datacenter needs no inbound firewall rule.
    fr: |-
      Le connecteur de réseau privé est un agent léger installé sur un serveur Windows Server proche des applications. Il n'établit que des connexions sortantes vers le service Global Secure Access et relaie le trafic entre le service et les ressources internes : le centre de données n'a besoin d'aucune règle de pare-feu entrante.
  options:
    a: { en: "The client runs on user devices and tunnels their traffic to the service; it doesn't publish the datacenter apps.", fr: "Le client s'exécute sur les appareils des utilisateurs et fait passer leur trafic dans le tunnel vers le service ; il ne publie pas les applications du centre de données." }
    c: { en: "Microsoft Entra Connect Sync synchronizes identities; it doesn't carry application traffic.", fr: "Microsoft Entra Connect Sync synchronise les identités ; il ne transporte pas le trafic applicatif." }
    d: { en: "The Connected Machine agent onboards a server to Azure Arc; it isn't part of Private Access.", fr: "L'agent Connected Machine intègre un serveur à Azure Arc ; il ne fait pas partie de Private Access." }
references:
  - title: How to configure private network connectors for Microsoft Entra Private Access and Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-connectors
