id: sc500-2c-pls-idle-timeout
objective: "2.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders publishes a database proxy through a Private Link service named **pls-db**. pls-db uses a Standard Load Balancer named lb-db whose load-balancing rule has an idle timeout of 30 minutes.

    Consumer applications keep pooled TCP connections open. When a pooled connection stays idle for about five minutes, the next query on it fails. The same applications have no failures when they connect to the frontend of lb-db directly from inside the provider virtual network.

    You need to prevent the failures for the consumers that connect through pls-db.

    What should you do?
  fr: |
    Northwind Traders publie un proxy de base de données par un service Private Link nommé **pls-db**. pls-db utilise un Standard Load Balancer nommé lb-db dont la règle d'équilibrage de charge a un délai d'inactivité de 30 minutes.

    Les applications des consommateurs maintiennent ouvertes des connexions TCP regroupées. Quand une connexion regroupée reste inactive pendant environ cinq minutes, la requête suivante sur cette connexion échoue. Les mêmes applications n'ont aucun échec quand elles se connectent directement au front-end de lb-db depuis le réseau virtuel du fournisseur.

    Vous devez éviter les échecs pour les consommateurs qui se connectent par pls-db.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Increase the idle timeout of the load-balancing rule of lb-db.", fr: "Augmenter le délai d'inactivité de la règle d'équilibrage de charge de lb-db." }
    - id: b
      text: { en: "Configure the consumers to send TCP keepalives more often than every 300 seconds.", fr: "Configurer les consommateurs pour envoyer des keepalives TCP plus souvent que toutes les 300 secondes." }
    - id: c
      text: { en: "Enable TCP reset on idle on the load-balancing rule of lb-db.", fr: "Activer TCP reset on idle sur la règle d'équilibrage de charge de lb-db." }
    - id: d
      text: { en: "Add NAT IP configurations to pls-db to spread the connections.", fr: "Ajouter des configurations IP NAT à pls-db pour répartir les connexions." }
answer: { optionId: b }
explanation:
  correct:
    en: A Private Link service has its own idle timeout of about five minutes (300 seconds), independent of the load balancer setting. Applications that connect through it must use TCP keepalives with an interval shorter than that timeout so that idle pooled connections are not dropped.
    fr: Un service Private Link a son propre délai d'inactivité d'environ cinq minutes (300 secondes), indépendant du paramètre de l'équilibreur de charge. Les applications qui s'y connectent doivent utiliser des keepalives TCP d'intervalle inférieur à ce délai pour que les connexions regroupées inactives ne soient pas coupées.
  options:
    a: { en: "The load balancer timeout is already 30 minutes and works for direct connections; the five-minute limit belongs to the Private Link service.", fr: "Le délai de l'équilibreur de charge est déjà de 30 minutes et fonctionne pour les connexions directes ; la limite de cinq minutes appartient au service Private Link." }
    c: { en: "TCP reset only notifies the endpoints when a flow times out; the idle connections would still be closed.", fr: "TCP reset ne fait que prévenir les extrémités quand un flux expire ; les connexions inactives seraient toujours fermées." }
    d: { en: "Additional NAT IP addresses do not change the idle timeout of the Private Link service.", fr: "Des adresses IP NAT supplémentaires ne changent pas le délai d'inactivité du service Private Link." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
