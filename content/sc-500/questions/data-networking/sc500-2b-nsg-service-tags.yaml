id: sc500-2b-nsg-service-tags
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a network security group named NSG-Data that is associated with a subnet of batch-processing virtual machines in the West Europe region.

    The virtual machines must reach Azure Storage and Azure SQL Database in West Europe on TCP 443 and TCP 1433. All other outbound internet traffic must be denied by a lower-priority rule that you already created. You try to create one outbound rule whose destination lists the **Storage.WestEurope** and **Sql.WestEurope** service tags, and the rule is rejected.

    What should you do?
  fr: |
    Vous disposez d'un groupe de sécurité réseau nommé NSG-Data associé à un sous-réseau de machines virtuelles de traitement par lots dans la région West Europe.

    Les machines virtuelles doivent atteindre Stockage Azure et Azure SQL Database en West Europe sur les ports TCP 443 et TCP 1433. Tout autre trafic Internet sortant doit être refusé par une règle de priorité inférieure que vous avez déjà créée. Vous essayez de créer une règle sortante dont la destination liste les étiquettes de service **Storage.WestEurope** et **Sql.WestEurope**, et la règle est refusée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create two outbound rules, one with the Storage.WestEurope tag and one with the Sql.WestEurope tag.", fr: "Créer deux règles sortantes, l'une avec l'étiquette Storage.WestEurope et l'autre avec l'étiquette Sql.WestEurope." } }
    - { id: b, text: { en: "Create one outbound rule that uses the Internet service tag as the destination for TCP 443 and 1433.", fr: "Créer une règle sortante qui utilise l'étiquette de service Internet comme destination pour TCP 443 et 1433." } }
    - { id: c, text: { en: "Create an application security group that contains both service tags, and use it as the destination.", fr: "Créer un groupe de sécurité d'application qui contient les deux étiquettes de service, et l'utiliser comme destination." } }
    - { id: d, text: { en: "Create one outbound rule that uses the regionless Storage and Sql service tags in the destination.", fr: "Créer une règle sortante qui utilise les étiquettes de service Storage et Sql sans région dans la destination." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Augmented security rules can combine several IP addresses, ranges and ports, but not several service tags or application security groups in the same source or destination. You therefore need one outbound allow rule per service tag, both with a higher priority (lower number) than the rule that denies the internet.
    fr: |-
      Les règles de sécurité augmentées peuvent combiner plusieurs adresses IP, plages et ports, mais pas plusieurs étiquettes de service ni plusieurs groupes de sécurité d'application dans la même source ou destination. Il faut donc une règle sortante d'autorisation par étiquette de service, toutes deux avec une priorité plus élevée (numéro plus petit) que la règle qui refuse Internet.
  options:
    b: { en: "The Internet tag would allow every public destination on those ports, which defeats the deny rule.", fr: "L'étiquette Internet autoriserait toutes les destinations publiques sur ces ports, ce qui annule la règle de refus." }
    c: { en: "Application security groups contain network interfaces of your virtual machines, not service tags.", fr: "Les groupes de sécurité d'application contiennent des cartes réseau de vos machines virtuelles, pas des étiquettes de service." }
    d: { en: "Two service tags still can't share one destination, and the regionless tags would also open every region.", fr: "Deux étiquettes de service ne peuvent toujours pas partager une destination, et les étiquettes sans région ouvriraient en plus toutes les régions." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
