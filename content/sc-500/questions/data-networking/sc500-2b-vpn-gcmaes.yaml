id: sc500-2b-vpn-gcmaes
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are configuring a custom IPsec/IKE policy on a site-to-site connection named Conn-Paris of a VPN gateway that uses the VpnGw2AZ SKU. The security team requires AES-GCM for the IPsec (Quick Mode) phase. You enter the following values.

    | Setting | Value |
    | --- | --- |
    | IKE encryption | AES256 |
    | IKE integrity | SHA384 |
    | DH group | DHGroup24 |
    | IPsec encryption | GCMAES256 |
    | IPsec integrity | SHA256 |
    | PFS group | PFS24 |

    The configuration is rejected. You need to correct it while keeping AES-GCM for IPsec.

    What should you do?
  fr: |
    Vous configurez une stratégie IPsec/IKE personnalisée sur une connexion site à site nommée Conn-Paris d'une passerelle VPN de référence SKU VpnGw2AZ. L'équipe de sécurité exige AES-GCM pour la phase IPsec (mode rapide). Vous saisissez les valeurs suivantes.

    | Paramètre | Valeur |
    | --- | --- |
    | Chiffrement IKE | AES256 |
    | Intégrité IKE | SHA384 |
    | Groupe DH | DHGroup24 |
    | Chiffrement IPsec | GCMAES256 |
    | Intégrité IPsec | SHA256 |
    | Groupe PFS | PFS24 |

    La configuration est refusée. Vous devez la corriger en conservant AES-GCM pour IPsec.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change IPsec integrity to GCMAES256.", fr: "Changer l'intégrité IPsec en GCMAES256." } }
    - { id: b, text: { en: "Change IKE encryption to GCMAES256.", fr: "Changer le chiffrement IKE en GCMAES256." } }
    - { id: c, text: { en: "Change PFS group to None.", fr: "Changer le groupe PFS en None." } }
    - { id: d, text: { en: "Change IPsec integrity to GCMAES128.", fr: "Changer l'intégrité IPsec en GCMAES128." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      When IPsec encryption uses GCMAES, IPsec integrity must use the same GCMAES algorithm and key length. With GCMAES256 for encryption, integrity must also be GCMAES256. The IKE settings and the PFS group are independent of this rule.
    fr: |-
      Quand le chiffrement IPsec utilise GCMAES, l'intégrité IPsec doit utiliser le même algorithme GCMAES avec la même longueur de clé. Avec GCMAES256 pour le chiffrement, l'intégrité doit aussi être GCMAES256. Les paramètres IKE et le groupe PFS ne sont pas concernés par cette règle.
  options:
    b: { en: "The IKE phase isn't the problem; the mismatch is between IPsec encryption and IPsec integrity.", fr: "La phase IKE n'est pas en cause ; l'incohérence se situe entre le chiffrement IPsec et l'intégrité IPsec." }
    c: { en: "The PFS group is valid; removing PFS weakens the policy without fixing the integrity mismatch.", fr: "Le groupe PFS est valide ; supprimer PFS affaiblit la stratégie sans corriger l'incohérence d'intégrité." }
    d: { en: "The key length must match too: GCMAES256 encryption requires GCMAES256 integrity.", fr: "La longueur de clé doit aussi correspondre : un chiffrement GCMAES256 exige une intégrité GCMAES256." }
references:
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
