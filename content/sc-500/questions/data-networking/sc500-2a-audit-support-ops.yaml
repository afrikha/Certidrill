id: sc500-2a-audit-support-ops
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure SQL Database logical server named **sql-wg-ledger**. Server-level auditing to a Log Analytics workspace is already enabled.

    Regulators require Woodgrove to keep a record of the operations that Microsoft support engineers perform on the server during support requests.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un serveur logique Azure SQL Database nommé **sql-wg-ledger**. L'audit au niveau du serveur vers un espace de travail Log Analytics est déjà activé.

    Les régulateurs exigent que Woodgrove conserve une trace des opérations effectuées sur le serveur par les ingénieurs du support Microsoft pendant les demandes de support.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Microsoft Defender for Azure SQL on sql-wg-ledger.", fr: "Activer Microsoft Defender for Azure SQL sur sql-wg-ledger." } }
    - { id: b, text: { en: "Enable Auditing of Microsoft support operations on sql-wg-ledger.", fr: "Activer Auditing of Microsoft support operations sur sql-wg-ledger." } }
    - { id: c, text: { en: "Enable database-level auditing on the master database of sql-wg-ledger.", fr: "Activer l'audit au niveau de la base de données sur la base master de sql-wg-ledger." } }
    - { id: d, text: { en: "Add BATCH_COMPLETED_GROUP to the server audit of sql-wg-ledger.", fr: "Ajouter BATCH_COMPLETED_GROUP à l'audit du serveur sql-wg-ledger." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Enable Auditing of Microsoft support operations, on the Auditing page of the SQL server, records the operations that Microsoft support engineers run on the server during a support request, and sends them to a storage account, a Log Analytics workspace or Event Hubs. Regular auditing records the activity of your own users.
    fr: |
      Enable Auditing of Microsoft support operations, dans la page Auditing du serveur SQL, enregistre les opérations exécutées sur le serveur par les ingénieurs du support Microsoft pendant une demande de support, et les envoie vers un compte de stockage, un espace de travail Log Analytics ou Event Hubs. L'audit classique enregistre l'activité de vos propres utilisateurs.
  options:
    a:
      en: |
        Defender for Azure SQL detects threats and vulnerabilities; it doesn't record support engineers' operations.
      fr: |
        Defender for Azure SQL détecte les menaces et les vulnérabilités ; il n'enregistre pas les opérations des ingénieurs du support.
    c:
      en: |
        Server-level auditing already covers the databases; an audit on master doesn't capture support operations.
      fr: |
        L'audit au niveau du serveur couvre déjà les bases de données ; un audit sur master ne capture pas les opérations du support.
    d:
      en: |
        BATCH_COMPLETED_GROUP is already one of the default action groups and records user batches, not support operations.
      fr: |
        BATCH_COMPLETED_GROUP fait déjà partie des groupes d'actions par défaut et enregistre les lots des utilisateurs, pas les opérations du support.
references:
  - title: Auditing Microsoft support operations
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-microsoft-support-operations
