id: sc500-2a-acct-sharedkey-order
objective: "2.1.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has 60 storage accounts in a subscription named **Sub-Data**. Some applications still authorize requests with account keys or SAS tokens signed with account keys.

    You need to disallow Shared Key authorization on every storage account in Sub-Data and prevent new accounts from allowing it. The solution must avoid breaking applications.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation dispose de 60 comptes de stockage dans un abonnement nommé **Sub-Data**. Certaines applications autorisent encore leurs requêtes avec des clés de compte ou des jetons SAS signés avec des clés de compte.

    Vous devez interdire l'autorisation par clé partagée sur chaque compte de stockage de Sub-Data et empêcher les nouveaux comptes de l'autoriser. La solution ne doit pas casser d'applications.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: audit, text: { en: "Assign the built-in policy Storage accounts should prevent shared key access to Sub-Data with the Audit effect.", fr: "Attribuer à Sub-Data la stratégie intégrée Storage accounts should prevent shared key access avec l'effet Audit." } }
    - { id: detect, text: { en: "Use Azure Monitor metrics and logs to identify the clients that send requests authorized with an account key or a SAS.", fr: "Utiliser les métriques et journaux Azure Monitor pour identifier les clients qui envoient des requêtes autorisées avec une clé de compte ou une SAS." } }
    - { id: migrate, text: { en: "Update those clients to authorize with Microsoft Entra ID.", fr: "Mettre à jour ces clients pour qu'ils s'autorisent avec Microsoft Entra ID." } }
    - { id: disable, text: { en: "Set Allow storage account key access to Disabled on the noncompliant accounts.", fr: "Définir Allow storage account key access sur Disabled sur les comptes non conformes." } }
    - { id: deny, text: { en: "Change the effect of the policy assignment to Deny.", fr: "Changer l'effet de l'attribution de stratégie en Deny." } }
    - { id: rotate, text: { en: "Regenerate both access keys of each storage account.", fr: "Régénérer les deux clés d'accès de chaque compte de stockage." } }
    - { id: denyfirst, text: { en: "Assign the built-in policy Storage accounts should prevent shared key access to Sub-Data with the Deny effect.", fr: "Attribuer à Sub-Data la stratégie intégrée Storage accounts should prevent shared key access avec l'effet Deny." } }
answer:
  sequence: [ audit, detect, migrate, disable, deny ]
explanation:
  correct:
    en: |
      Microsoft's sequence is to find the accounts that still allow Shared Key with the policy in Audit mode, detect the clients that use account keys or SAS from metrics (Authentication filter) and logs, move them to Microsoft Entra ID, and only then disallow Shared Key. Once the accounts are compliant, switching the assignment to Deny blocks new or changed accounts that would allow Shared Key.
    fr: |
      L'ordre préconisé par Microsoft est de trouver les comptes qui autorisent encore la clé partagée avec la stratégie en mode Audit, de détecter les clients qui utilisent des clés de compte ou des SAS à partir des métriques (filtre Authentication) et des journaux, de les migrer vers Microsoft Entra ID, puis seulement d'interdire la clé partagée. Une fois les comptes conformes, passer l'attribution en Deny bloque les comptes créés ou modifiés qui autoriseraient la clé partagée.
  options:
    rotate: { en: "Rotating the keys invalidates existing key-based clients without moving them to Microsoft Entra ID; it isn't part of the procedure.", fr: "Régénérer les clés invalide les clients existants basés sur les clés sans les migrer vers Microsoft Entra ID ; cela ne fait pas partie de la procédure." }
    denyfirst: { en: "Starting with Deny blocks changes to existing accounts before you know which clients depend on Shared Key.", fr: "Commencer par Deny bloque les modifications des comptes existants avant de savoir quels clients dépendent de la clé partagée." }
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
