id: sc500-2c-fw-idps
objective: "2.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An Azure Firewall Premium named **fw-core** uses a firewall policy named fwp-core. You have the following requirements:

    - Traffic that matches IDPS signatures must be logged and blocked.
    - A nightly backup between the subnet 10.2.0.0/24 and an on-premises range must be excluded from IDPS filtering.
    - One signature wrongly blocks a legitimate request of an internal application. That signature must stop generating alerts and blocks, and all the other signatures must keep their mode.

    How should you configure fwp-core? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Pare-feu Azure Premium nommé **fw-core** utilise une stratégie de pare-feu nommée fwp-core. Vous avez les exigences suivantes :

    - Le trafic qui correspond à des signatures IDPS doit être journalisé et bloqué.
    - Une sauvegarde nocturne entre le sous-réseau 10.2.0.0/24 et une plage locale doit être exclue du filtrage IDPS.
    - Une signature bloque à tort une requête légitime d'une application interne. Cette signature ne doit plus générer d'alertes ni de blocages, et toutes les autres signatures doivent conserver leur mode.

    Comment devez-vous configurer fwp-core ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      IDPS mode of fwp-core: [[mode]]

      Exclude the backup traffic by using: [[excl]]

      For the faulty signature: [[sig]]
    fr: |
      Mode IDPS de fwp-core : [[mode]]

      Exclure le trafic de sauvegarde avec : [[excl]]

      Pour la signature défaillante : [[sig]]
  slots:
    - id: mode
      options:
        - { id: alert, text: Alert }
        - { id: deny, text: Alert and Deny }
        - { id: off, text: Disabled }
    - id: excl
      options:
        - { id: bypass, text: { en: "The IDPS bypass list", fr: "La liste de contournement IDPS" } }
        - { id: private, text: { en: "The IDPS private IP ranges", fr: "Les plages d'adresses IP privées IDPS" } }
        - { id: tiallow, text: { en: "The threat intelligence allowlist", fr: "La liste d'autorisation du renseignement sur les menaces" } }
    - id: sig
      options:
        - { id: sdisabled, text: { en: "Override its mode to Disabled", fr: "Remplacer son mode par Disabled" } }
        - { id: salert, text: { en: "Override its mode to Alert", fr: "Remplacer son mode par Alert" } }
        - { id: spolicy, text: { en: "Set the policy IDPS mode to Alert", fr: "Régler le mode IDPS de la stratégie sur Alert" } }
answer:
  values: { mode: deny, excl: bypass, sig: sdisabled }
explanation:
  correct:
    en: The Alert and Deny mode alerts on and blocks traffic that matches signatures. The IDPS bypass list excludes specific IP addresses, ranges and subnets from IDPS filtering. You can override the mode of an individual signature, found by its ID in the logs, to Disabled, which stops both alerts and blocks for that signature only.
    fr: Le mode Alert and Deny génère des alertes et bloque le trafic qui correspond aux signatures. La liste de contournement IDPS exclut du filtrage IDPS des adresses IP, plages et sous-réseaux précis. Vous pouvez remplacer le mode d'une signature individuelle, identifiée par son ID dans les journaux, par Disabled, ce qui arrête les alertes et les blocages pour cette seule signature.
  options:
    alert: { en: "Alert only logs suspicious traffic; it does not block it.", fr: "Alert ne fait que journaliser le trafic suspect ; il ne le bloque pas." }
    private: { en: "Private IP ranges define which traffic IDPS treats as internal; they do not exclude traffic from inspection.", fr: "Les plages d'adresses IP privées définissent le trafic que l'IDPS considère comme interne ; elles n'excluent pas de trafic de l'inspection." }
    tiallow: { en: "The threat intelligence allowlist exempts addresses from threat intelligence filtering, not from IDPS.", fr: "La liste d'autorisation du renseignement sur les menaces exempte des adresses du filtrage par renseignement sur les menaces, pas de l'IDPS." }
    salert: { en: "Alert stops the block but keeps generating alerts for the signature.", fr: "Alert arrête le blocage mais continue de générer des alertes pour la signature." }
    spolicy: { en: "Changing the policy mode would stop blocking for every signature.", fr: "Changer le mode de la stratégie arrêterait le blocage pour toutes les signatures." }
references:
  - title: Azure Firewall Premium features implementation guide
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-features
