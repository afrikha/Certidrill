id: sc500-cs2b-contractor-sas
objective: "2.1.4"
type: dropdown
caseStudy: sc500-cs2b-city-power-light
difficulty: 3
status: draft
stem:
  en: |
    Ops1 sets the `EXPIRY` variable to a date and time 72 hours from now. You need to complete the command that Ops1 runs to create the link for a contractor.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Ops1 définit la variable `EXPIRY` sur une date et une heure situées 72 heures plus tard. Vous devez compléter la commande qu'Ops1 exécute pour créer le lien destiné à un sous-traitant.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az storage container generate-sas \
      --account-name stcplupload \
      --name meter-photos \
      --permissions [[perm]] \
      --expiry $EXPIRY \
      --auth-mode [[auth]] \
      [[sas]]
  slots:
    - id: perm
      options:
        - { id: rl, text: rl }
        - { id: cw, text: cw }
        - { id: dl, text: dl }
        - { id: all, text: acdlrw }
    - id: auth
      options:
        - { id: key, text: key }
        - { id: login, text: login }
    - id: sas
      options:
        - { id: https, text: --https-only }
        - { id: policy, text: --policy-name sap-photos }
        - { id: asuser, text: --as-user }
answer:
  values: { perm: cw, auth: login, sas: asuser }
explanation:
  correct:
    en: "Shared Key authorization is disallowed on stcplupload, so the link must be a user delegation SAS: `--auth-mode login` authorizes the request with Ops1's Microsoft Entra credentials and `--as-user` returns a user delegation SAS. Ops1's Storage Blob Data Contributor role, assigned at the storage account scope, includes the generateUserDelegationKey action. The `cw` permissions allow only creating and writing blobs, and 72 hours is within the seven-day maximum validity of the user delegation key."
    fr: "L'autorisation par clé partagée est interdite sur stcplupload : le lien doit donc être une SAS de délégation d'utilisateur. `--auth-mode login` autorise la requête avec les informations d'identification Microsoft Entra d'Ops1 et `--as-user` renvoie une SAS de délégation d'utilisateur. Le rôle Storage Blob Data Contributor d'Ops1, attribué à l'étendue du compte de stockage, inclut l'action generateUserDelegationKey. Les autorisations `cw` permettent uniquement de créer et d'écrire des objets blob, et 72 heures restent dans la validité maximale de sept jours de la clé de délégation d'utilisateur."
  options:
    rl: { en: "Read and list would let contractors browse the container but not upload photos.", fr: "Lecture et liste permettraient aux sous-traitants de parcourir le conteneur, mais pas de charger des photos." }
    all: { en: "acdlrw also grants read, list and delete, which the requirement forbids.", fr: "acdlrw accorde aussi la lecture, la liste et la suppression, ce que l'exigence interdit." }
    key: { en: "key signs the SAS with an account key, which is disallowed on stcplupload and forbidden by the requirement.", fr: "key signe la SAS avec une clé de compte, ce qui est interdit sur stcplupload et par l'exigence." }
    policy: { en: "Stored access policies aren't supported for a user delegation SAS.", fr: "Les stratégies d'accès stockées ne sont pas prises en charge pour une SAS de délégation d'utilisateur." }
    https: { en: "--https-only restricts the protocol but doesn't make the SAS a user delegation SAS.", fr: "--https-only restreint le protocole, mais ne fait pas de la SAS une SAS de délégation d'utilisateur." }
references:
  - title: Create a user delegation SAS for a container or blob with the Azure CLI
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blob-user-delegation-sas-create-cli
  - title: Create a user delegation SAS
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas
