id: sc500-2c-fw-dns-proxy
objective: "2.3.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An Azure Firewall Standard named **fw-hub** is managed by a firewall policy named fwp-hub. The virtual machines in a spoke virtual network named **VNet-Spoke** send all their traffic to fw-hub and use the Azure-provided DNS.

    You plan to add to fwp-hub a network rule that allows TCP 1433 to the FQDN sql01.northwind.com. You need to prepare the environment so that FQDN filtering in network rules resolves names consistently for the firewall and the VMs, without interrupting name resolution.

    Which three actions should you perform in sequence before you add the rule? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un Pare-feu Azure Standard nommé **fw-hub** est géré par une stratégie de pare-feu nommée fwp-hub. Les machines virtuelles d'un réseau virtuel spoke nommé **VNet-Spoke** envoient tout leur trafic à fw-hub et utilisent le DNS fourni par Azure.

    Vous prévoyez d'ajouter à fwp-hub une règle de réseau qui autorise le TCP 1433 vers le FQDN sql01.northwind.com. Vous devez préparer l'environnement pour que le filtrage par FQDN dans les règles de réseau résolve les noms de la même façon pour le pare-feu et pour les machines virtuelles, sans interrompre la résolution de noms.

    Quelles sont les trois actions à effectuer dans l'ordre avant d'ajouter la règle ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: proxy, text: { en: "Enable DNS proxy in the DNS settings of fwp-hub.", fr: "Activer le proxy DNS dans les paramètres DNS de fwp-hub." } }
    - { id: vnetdns, text: { en: "Set the DNS servers of VNet-Spoke to Custom with the private IP address of fw-hub.", fr: "Régler les serveurs DNS de VNet-Spoke sur Custom avec l'adresse IP privée de fw-hub." } }
    - { id: restart, text: { en: "Restart the virtual machines in VNet-Spoke.", fr: "Redémarrer les machines virtuelles de VNet-Spoke." } }
    - { id: zone, text: { en: "Create a private DNS zone named northwind.com and link it to VNet-Spoke.", fr: "Créer une zone DNS privée nommée northwind.com et la lier à VNet-Spoke." } }
    - { id: ti, text: { en: "Set threat intelligence in fwp-hub to Alert and deny.", fr: "Régler le renseignement sur les menaces de fwp-hub sur Alert and deny." } }
    - { id: premium, text: { en: "Upgrade fw-hub and fwp-hub to the Premium SKU.", fr: "Mettre à niveau fw-hub et fwp-hub vers la référence SKU Premium." } }
answer:
  sequence: [ proxy, vnetdns, restart ]
explanation:
  correct:
    en: |
      FQDNs in network rules require DNS proxy, and the clients must use the firewall as their DNS server so that they and the firewall resolve names the same way. You enable DNS proxy first, so that the firewall listens on port 53 before the VMs point to it, then set the custom DNS server of the virtual network. The VMs keep their current DNS settings until they restart.
    fr: |
      Les FQDN dans les règles de réseau exigent le proxy DNS, et les clients doivent utiliser le pare-feu comme serveur DNS pour résoudre les noms de la même façon que lui. Vous activez d'abord le proxy DNS, pour que le pare-feu écoute sur le port 53 avant que les machines virtuelles ne pointent vers lui, puis vous définissez le serveur DNS personnalisé du réseau virtuel. Les machines virtuelles conservent leurs paramètres DNS actuels jusqu'à leur redémarrage.
  options:
    zone: { en: "sql01.northwind.com is resolved by public DNS; a private zone would hide the public records.", fr: "sql01.northwind.com est résolu par le DNS public ; une zone privée masquerait les enregistrements publics." }
    ti: { en: "Threat intelligence filtering is unrelated to FQDN resolution in network rules.", fr: "Le filtrage par renseignement sur les menaces n'a aucun rapport avec la résolution des FQDN dans les règles de réseau." }
    premium: { en: "DNS proxy and FQDN filtering in network rules are available in the Standard SKU.", fr: "Le proxy DNS et le filtrage par FQDN dans les règles de réseau sont disponibles dans la référence SKU Standard." }
references:
  - title: Azure Firewall DNS settings
    url: https://learn.microsoft.com/en-us/azure/firewall/dns-settings
