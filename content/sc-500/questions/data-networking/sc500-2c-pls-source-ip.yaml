id: sc500-2c-pls-source-ip
objective: "2.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam publishes an order API through a Private Link service named **pls-orders**, which uses a Standard Load Balancer named lb-orders. The NAT IP configuration of pls-orders uses a subnet named snet-pls. Consumers connect from private endpoints in other tenants.

    A compliance requirement states that the API must log, for each connection, the original source IP address of the consumer and the private endpoint that the connection came through. Today, the API logs show only addresses from snet-pls.

    What should you do?
  fr: |
    Fabrikam publie une API de commandes par un service Private Link nommé **pls-orders**, qui utilise un Standard Load Balancer nommé lb-orders. La configuration IP NAT de pls-orders utilise un sous-réseau nommé snet-pls. Les consommateurs se connectent depuis des points de terminaison privés d'autres locataires.

    Une exigence de conformité impose que l'API journalise, pour chaque connexion, l'adresse IP source d'origine du consommateur et le point de terminaison privé par lequel la connexion est arrivée. Aujourd'hui, les journaux de l'API ne montrent que des adresses de snet-pls.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add NAT IP configurations to pls-orders and log the NAT IP addresses.", fr: "Ajouter des configurations IP NAT à pls-orders et journaliser les adresses IP NAT." }
    - id: b
      text: { en: "Enable Floating IP on the load-balancing rule of lb-orders.", fr: "Activer Floating IP sur la règle d'équilibrage de charge de lb-orders." }
    - id: c
      text: { en: "Set the visibility of pls-orders to Restricted by subscription.", fr: "Régler la visibilité de pls-orders sur Restricted by subscription." }
    - id: d
      text: { en: "Enable TCP Proxy v2 on pls-orders and have the API parse the header.", fr: "Activer TCP Proxy v2 sur pls-orders et faire analyser l'en-tête par l'API." }
answer: { optionId: d }
explanation:
  correct:
    en: A Private Link service applies NAT, so the application sees a NAT IP address of the provider subnet as the source. With TCP Proxy v2 enabled, the service adds a PROXY protocol v2 header that carries the consumer's source IP and the link ID of the private endpoint; the application must be configured to parse that header.
    fr: "Un service Private Link applique une NAT : l'application voit comme source une adresse IP NAT du sous-réseau du fournisseur. Avec TCP Proxy v2 activé, le service ajoute un en-tête PROXY protocol v2 qui contient l'adresse IP source du consommateur et l'ID de liaison du point de terminaison privé ; l'application doit être configurée pour analyser cet en-tête."
  options:
    a: { en: "More NAT IP addresses are still provider addresses; they never reveal the consumer's IP address.", fr: "Des adresses IP NAT supplémentaires restent des adresses du fournisseur ; elles ne révèlent jamais l'adresse IP du consommateur." }
    b: { en: "Floating IP changes how the backend receives the frontend address; it does not remove the Private Link NAT.", fr: "Floating IP change la façon dont le back-end reçoit l'adresse du front-end ; il ne supprime pas la NAT de Private Link." }
    c: { en: "Visibility controls who can request a connection, not what the application sees.", fr: "La visibilité contrôle qui peut demander une connexion, pas ce que voit l'application." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
