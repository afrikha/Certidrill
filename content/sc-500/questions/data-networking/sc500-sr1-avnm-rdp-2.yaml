id: sc500-sr1-avnm-rdp-2
objective: "2.3.2"
type: series_yesno
series: sc500-sr1-avnm-rdp
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You deploy a Deny security admin rule to a network group with dynamic membership.
  fr: Vous déployez une règle d'administrateur de la sécurité Deny sur un groupe réseau à appartenance dynamique.
body:
  solution:
    en: |
      In NM1, you create a network group named **NG1** with **dynamic** membership defined by an Azure Policy condition that matches every virtual network in MG1. You create a security admin configuration with a rule collection that targets NG1 and contains an inbound rule with the action **Deny** for TCP port 3389 from the **Internet** service tag. You deploy the configuration to East US and West Europe.
    fr: |
      Dans NM1, vous créez un groupe réseau nommé **NG1** avec une appartenance **dynamique** définie par une condition Azure Policy qui correspond à chaque réseau virtuel de MG1. Vous créez une configuration d'administrateur de sécurité avec un regroupement de règles qui cible NG1 et contient une règle de trafic entrant avec l'action **Deny** pour le port TCP 3389 depuis la balise de service **Internet**. Vous déployez la configuration dans East US et West Europe.
answer: { value: true }
explanation:
  correct:
    en: |
      Security admin rules are evaluated before NSG rules, and a Deny rule stops the traffic without any NSG rule being evaluated, so the teams cannot allow port 3389 with their NSGs. Dynamic membership uses Azure Policy to add the virtual networks that match the condition, including the ones created later, and the deployed rules then apply to them. The configuration is deployed to both regions that contain virtual networks.
    fr: |
      Les règles d'administrateur de la sécurité sont évaluées avant les règles des NSG, et une règle Deny arrête le trafic sans qu'aucune règle de NSG soit évaluée : les équipes ne peuvent pas autoriser le port 3389 avec leurs NSG. L'appartenance dynamique utilise Azure Policy pour ajouter les réseaux virtuels qui correspondent à la condition, y compris ceux créés ultérieurement, et les règles déployées s'y appliquent ensuite. La configuration est déployée dans les deux régions qui contiennent des réseaux virtuels.
references:
