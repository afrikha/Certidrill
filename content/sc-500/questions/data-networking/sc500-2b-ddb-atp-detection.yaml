id: sc500-2b-ddb-atp-detection
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **db-orders** that is used by a public web application. Microsoft Defender for Azure SQL Databases is on for the subscription.

    The security team needs to be alerted when the application sends faulty SQL statements that might indicate a SQL injection attempt, or when many sign-ins with different credentials are attempted against the server.

    Which capability raises these alerts?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **db-orders** utilisée par une application web publique. Microsoft Defender for Azure SQL Databases est activé pour l'abonnement.

    L'équipe de sécurité doit être alertée quand l'application envoie des instructions SQL erronées pouvant indiquer une tentative d'injection SQL, ou quand de nombreuses connexions avec des informations d'identification différentes sont tentées sur le serveur.

    Quelle fonctionnalité génère ces alertes ?
body:
  options:
    - { id: a, text: { en: "SQL vulnerability assessment", fr: "L'évaluation des vulnérabilités SQL" } }
    - { id: b, text: { en: "Dynamic data masking", fr: "Le masquage dynamique des données" } }
    - { id: c, text: { en: "Azure SQL auditing", fr: "L'audit Azure SQL" } }
    - { id: d, text: { en: "Advanced Threat Protection", fr: "Advanced Threat Protection" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Advanced Threat Protection, part of Defender for Azure SQL Databases, continuously monitors for potential SQL injection, anomalous access and query patterns such as brute-force sign-ins, and suspicious activity. Its alerts appear in Defender for Cloud with mitigation steps and can be investigated further in Microsoft Sentinel.
    fr: |-
      Advanced Threat Protection, qui fait partie de Defender for Azure SQL Databases, surveille en continu les injections SQL potentielles, les modèles d'accès et de requête anormaux comme les connexions par force brute, et les activités suspectes. Ses alertes apparaissent dans Defender for Cloud avec des étapes d'atténuation et peuvent être examinées dans Microsoft Sentinel.
  options:
    a: { en: "Vulnerability assessment scans for misconfigurations and excessive permissions; it doesn't detect attacks in progress.", fr: "L'évaluation des vulnérabilités recherche les erreurs de configuration et les autorisations excessives ; elle ne détecte pas les attaques en cours." }
    c: { en: "Auditing records events to a destination but raises no threat alerts by itself.", fr: "L'audit enregistre des événements vers une destination, mais ne génère aucune alerte de menace par lui-même." }
    b: { en: "Dynamic data masking hides parts of values in query results; it doesn't detect attacks.", fr: "Le masquage dynamique des données masque une partie des valeurs dans les résultats de requête ; il ne détecte pas les attaques." }
references:
  - title: Overview of Microsoft Defender for Azure SQL Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-introduction
