id: sc500-2b-ddb-va-express
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription that contains Azure SQL databases and Azure SQL managed instances. You plan to use SQL vulnerability assessment with the **express configuration** for all of them.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un abonnement Azure qui contient des bases de données Azure SQL et des instances managées Azure SQL. Vous prévoyez d'utiliser l'évaluation des vulnérabilités SQL avec la **configuration express** pour toutes ces ressources.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You must provide a storage account in each region to hold the scan results.
        fr: Vous devez fournir un compte de stockage dans chaque région pour contenir les résultats d'analyse.
    - id: s2
      text:
        en: A baseline that you set on a rule takes effect without running a new scan.
        fr: Une ligne de base définie sur une règle prend effet sans lancer de nouvelle analyse.
    - id: s3
      text:
        en: You can turn off recurring scans for a server and run scans only on demand.
        fr: Vous pouvez désactiver les analyses récurrentes d'un serveur et ne lancer des analyses qu'à la demande.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      In the express configuration, Defender for Cloud manages the storage of scan results in the region of the logical server, so no customer storage account is needed. Baselines can be set for one rule or in batch and take effect without a rescan. Recurring scans are always active in the express configuration; only the classic configuration lets you turn them on or off.
    fr: |-
      Dans la configuration express, Defender for Cloud gère le stockage des résultats d'analyse dans la région du serveur logique : aucun compte de stockage client n'est nécessaire. Les lignes de base peuvent être définies pour une règle ou par lot et prennent effet sans nouvelle analyse. Les analyses récurrentes sont toujours actives dans la configuration express ; seule la configuration classique permet de les activer ou de les désactiver.
references:
  - title: Scan your Azure SQL databases for vulnerabilities
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/sql-azure-vulnerability-assessment-overview
