id: sc500-2c-nw-allowed-but-fails
objective: "2.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Two spoke virtual networks, VNet-Spoke1 and VNet-Spoke2, are peered with a hub virtual network that contains an Azure Firewall named **fw-hub** (10.0.1.4). A virtual machine named **VM-App1** in VNet-Spoke1 cannot connect to TCP 443 of a virtual machine named **VM-Api1** (10.2.0.10) in VNet-Spoke2.

    IP flow verify returns **Access allowed** for the outbound flow from VM-App1 and for the inbound flow to VM-Api1.

    You need to determine whether the packets from VM-App1 to 10.2.0.10 are sent to fw-hub, and which route table causes it.

    What should you use?
  fr: |
    Deux réseaux virtuels spoke, VNet-Spoke1 et VNet-Spoke2, sont reliés par peering à un réseau virtuel hub qui contient un Pare-feu Azure nommé **fw-hub** (10.0.1.4). Une machine virtuelle nommée **VM-App1** de VNet-Spoke1 ne peut pas se connecter au TCP 443 d'une machine virtuelle nommée **VM-Api1** (10.2.0.10) de VNet-Spoke2.

    La vérification des flux IP renvoie **Accès autorisé** pour le flux sortant de VM-App1 et pour le flux entrant vers VM-Api1.

    Vous devez déterminer si les paquets de VM-App1 vers 10.2.0.10 sont envoyés à fw-hub, et quelle table de routage en est la cause.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Network Watcher next hop for VM-App1", fr: "Le tronçon suivant Network Watcher de VM-App1" }
    - id: b
      text: { en: "Network Watcher NSG diagnostics for VM-Api1", fr: "Les diagnostics NSG Network Watcher de VM-Api1" }
    - id: c
      text: { en: "Network Watcher effective security rules for VM-App1", fr: "Les règles de sécurité effectives Network Watcher de VM-App1" }
    - id: d
      text: { en: "Virtual network flow logs for VNet-Spoke2", fr: "Les journaux de flux de réseau virtuel de VNet-Spoke2" }
answer: { optionId: a }
explanation:
  correct:
    en: When IP flow verify allows the flow, the NSGs are not the cause. Next hop returns, for a destination IP address, the next hop type (for example VirtualAppliance), its IP address and the ID of the route table that contains the user-defined route, or System Route. A result of VirtualAppliance 10.0.1.4 shows that the firewall rules must be checked next.
    fr: Quand la vérification des flux IP autorise le flux, les NSG ne sont pas en cause. Le tronçon suivant renvoie, pour une adresse IP de destination, le type de tronçon suivant (par exemple VirtualAppliance), son adresse IP et l'ID de la table de routage qui contient l'itinéraire défini par l'utilisateur, ou System Route. Un résultat VirtualAppliance 10.0.1.4 montre qu'il faut ensuite vérifier les règles du pare-feu.
  options:
    c: { en: "Effective security rules list NSG and admin rules; they do not show routing.", fr: "Les règles de sécurité effectives listent les règles NSG et d'administration ; elles ne montrent pas le routage." }
    b: { en: "NSG diagnostics evaluates security rules, which IP flow verify already found to allow the flow.", fr: "Les diagnostics NSG évaluent les règles de sécurité, dont la vérification des flux IP a déjà montré qu'elles autorisent le flux." }
    d: { en: "Flow logs record the flows seen by the virtual network; they do not identify the route table that sends traffic to a next hop.", fr: "Les journaux de flux enregistrent les flux vus par le réseau virtuel ; ils n'identifient pas la table de routage qui envoie le trafic vers un tronçon suivant." }
references:
  - title: Next hop overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/next-hop-overview
