id: sc500-2b-vwan-normal-hub
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a Standard Azure Virtual WAN with two hubs:

    | Hub | Region | Security | Routing policies |
    | --- | --- | --- | --- |
    | Hub-East | East US | Azure Firewall | Internet traffic and Private traffic, next hop Azure Firewall |
    | Hub-West | West US | None | None |

    Spoke virtual networks in West US are connected to Hub-West. Their internet-bound traffic must be inspected by Azure Firewall. Spokes must stay connected to Hub-West.

    What should you do?
  fr: |
    Northwind Traders dispose d'un Azure Virtual WAN Standard avec deux hubs :

    | Hub | Région | Sécurité | Stratégies de routage |
    | --- | --- | --- | --- |
    | Hub-East | East US | Pare-feu Azure | Trafic Internet et Trafic privé, tronçon suivant Pare-feu Azure |
    | Hub-West | West US | Aucune | Aucune |

    Des réseaux virtuels spoke de West US sont connectés à Hub-West. Leur trafic à destination d'Internet doit être inspecté par le Pare-feu Azure. Les spokes doivent rester connectés à Hub-West.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Propagate default route on the Hub-West spoke connections so that they learn 0.0.0.0/0 from Hub-East.", fr: "Activer Propagate default route sur les connexions des spokes de Hub-West pour qu'elles apprennent 0.0.0.0/0 depuis Hub-East." } }
    - { id: b, text: { en: "Add a static route for 0.0.0.0/0 to the defaultRouteTable of Hub-West with the Hub-East firewall as next hop.", fr: "Ajouter à la defaultRouteTable de Hub-West un itinéraire statique 0.0.0.0/0 avec le pare-feu de Hub-East comme tronçon suivant." } }
    - { id: c, text: { en: "Deploy Azure Firewall in Hub-West, and configure an Internet traffic policy on Hub-West with it as next hop.", fr: "Déployer le Pare-feu Azure dans Hub-West, puis configurer sur Hub-West une stratégie Trafic Internet avec ce pare-feu comme tronçon suivant." } }
    - { id: d, text: { en: "Add the Hub-West spoke prefixes to the Private Traffic Prefixes of Hub-East.", fr: "Ajouter les préfixes des spokes de Hub-West aux préfixes de trafic privé de Hub-East." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The default route 0.0.0.0/0 advertised by an Internet traffic policy doesn't propagate across hubs, so internet traffic must exit through the security solution of the local hub. Branches and virtual networks connected to a normal hub can't use the secured hub's firewall for internet access. Hub-West needs its own firewall and Internet traffic policy.
    fr: |-
      L'itinéraire par défaut 0.0.0.0/0 annoncé par une stratégie Trafic Internet ne se propage pas d'un hub à l'autre : le trafic Internet doit sortir par la solution de sécurité du hub local. Les branches et les réseaux virtuels connectés à un hub normal ne peuvent pas utiliser le pare-feu du hub sécurisé pour accéder à Internet. Hub-West a besoin de son propre pare-feu et de sa propre stratégie Trafic Internet.
  options:
    a: { en: "Propagate default route only matters for routes the local hub has; Hub-West never receives 0.0.0.0/0 from Hub-East.", fr: "Propagate default route ne concerne que les itinéraires dont dispose le hub local ; Hub-West ne reçoit jamais 0.0.0.0/0 de Hub-East." }
    b: { en: "Connections of a normal hub can't reach the internet through the security solution of a secured hub; internet egress must use a local security solution.", fr: "Les connexions d'un hub normal ne peuvent pas accéder à Internet par la solution de sécurité d'un hub sécurisé ; la sortie Internet doit passer par une solution de sécurité locale." }
    d: { en: "Private Traffic Prefixes affect private traffic, not internet-bound traffic.", fr: "Les préfixes de trafic privé concernent le trafic privé, pas le trafic à destination d'Internet." }
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
