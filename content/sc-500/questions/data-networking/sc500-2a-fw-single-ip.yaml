id: sc500-2a-fw-single-ip
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a storage account named **sttailspinpartner** in the East US region. Public network access is set to **Enabled from selected networks**.

    A partner company, outside Azure, sends all its requests from a single public IP address: **131.107.20.15**. You need to allow requests from this address only.

    What should you enter in the address range of the new IP network rule?
  fr: |
    Tailspin Toys dispose d'un compte de stockage nommé **sttailspinpartner** dans la région East US. L'accès réseau public est défini sur **Enabled from selected networks**.

    Une entreprise partenaire, en dehors d'Azure, envoie toutes ses requêtes depuis une seule adresse IP publique : **131.107.20.15**. Vous devez autoriser les requêtes de cette seule adresse.

    Que devez-vous saisir comme plage d'adresses de la nouvelle règle de réseau IP ?
body:
  options:
    - { id: a, text: "131.107.20.15" }
    - { id: b, text: "131.107.20.15/32" }
    - { id: c, text: "131.107.20.14/31" }
    - { id: d, text: "131.107.20.0/24" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Storage firewall IP rules take CIDR ranges or individual addresses, but /31 and /32 prefixes aren't supported: a single address is entered as is. A /24 range would admit 255 other addresses.
    fr: |
      Les règles IP du pare-feu de stockage acceptent des plages CIDR ou des adresses individuelles, mais les préfixes /31 et /32 ne sont pas pris en charge : une adresse unique est saisie telle quelle. Une plage /24 admettrait 255 autres adresses.
  options:
    b: { en: "/32 prefixes aren't supported; enter the address without a prefix.", fr: "Les préfixes /32 ne sont pas pris en charge ; saisissez l'adresse sans préfixe." }
    c: { en: "/31 prefixes aren't supported, and this range also includes 131.107.20.14.", fr: "Les préfixes /31 ne sont pas pris en charge, et cette plage inclut aussi 131.107.20.14." }
    d: { en: "The /24 range admits the whole 131.107.20.0 network, not only the partner's address.", fr: "La plage /24 admet tout le réseau 131.107.20.0, pas seulement l'adresse du partenaire." }
references:
  - title: Guidelines and limitations for the Azure Storage firewall
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
