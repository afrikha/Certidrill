id: sc500-2b-avnm-rule-collections
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Network Manager instance named NM1 with two network groups: **NG-All**, which contains every virtual network, and **NG-PCI**, which contains the payment virtual networks. All the virtual networks are in West Europe. A security admin configuration named SAC-Baseline, which blocks high-risk ports for NG-All, is deployed to West Europe.

    You need NG-PCI to also receive stricter rules that block outbound TCP 21 and TCP 445, while the baseline stays in effect for every virtual network.

    What should you do?
  fr: |
    Vous disposez d'une instance Azure Virtual Network Manager nommée NM1 avec deux groupes réseau : **NG-All**, qui contient tous les réseaux virtuels, et **NG-PCI**, qui contient les réseaux virtuels de paiement. Tous les réseaux virtuels sont en West Europe. Une configuration d'administration de la sécurité nommée SAC-Baseline, qui bloque les ports à haut risque pour NG-All, est déployée en West Europe.

    NG-PCI doit aussi recevoir des règles plus strictes qui bloquent TCP 21 et TCP 445 en sortie, tandis que la ligne de base reste en vigueur pour tous les réseaux virtuels.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a security admin configuration named SAC-PCI that targets NG-PCI, and deploy it to West Europe with SAC-Baseline.", fr: "Créer une configuration d'administration de la sécurité nommée SAC-PCI qui cible NG-PCI, et la déployer en West Europe avec SAC-Baseline." } }
    - { id: b, text: { en: "Add a rule collection that targets NG-PCI to SAC-Baseline, and then deploy SAC-Baseline to West Europe again.", fr: "Ajouter à SAC-Baseline une collection de règles qui cible NG-PCI, puis déployer à nouveau SAC-Baseline en West Europe." } }
    - { id: c, text: { en: "Create a connectivity configuration that targets NG-PCI with the rules, and deploy it to West Europe.", fr: "Créer une configuration de connectivité qui cible NG-PCI avec les règles, et la déployer en West Europe." } }
    - { id: d, text: { en: "Add NG-PCI as a member of NG-All, and then add the rules to the existing rule collection of SAC-Baseline.", fr: "Ajouter NG-PCI comme membre de NG-All, puis ajouter les règles à la collection de règles existante de SAC-Baseline." } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A network manager can deploy only one security admin configuration per region. To apply several rule sets in the same region, you create several rule collections inside that configuration, each associated with its own network groups, and you redeploy the configuration so that the new goal state takes effect.
    fr: |-
      Un gestionnaire de réseau ne peut déployer qu'une seule configuration d'administration de la sécurité par région. Pour appliquer plusieurs ensembles de règles dans la même région, vous créez plusieurs collections de règles dans cette configuration, chacune associée à ses propres groupes réseau, puis vous redéployez la configuration pour que le nouvel état cible prenne effet.
  options:
    a: { en: "Two security admin configurations can't be deployed to the same region from one network manager.", fr: "Deux configurations d'administration de la sécurité ne peuvent pas être déployées dans la même région depuis un même gestionnaire de réseau." }
    c: { en: "Connectivity configurations define topologies such as hub and spoke or mesh; they don't contain security rules.", fr: "Les configurations de connectivité définissent des topologies comme hub and spoke ou maillage ; elles ne contiennent pas de règles de sécurité." }
    d: { en: "Network groups contain virtual networks, not other network groups, and the existing collection would apply the PCI rules to every virtual network.", fr: "Les groupes réseau contiennent des réseaux virtuels, pas d'autres groupes réseau, et la collection existante appliquerait les règles PCI à tous les réseaux virtuels." }
references:
  - title: Manage configuration deployments in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-deployments
