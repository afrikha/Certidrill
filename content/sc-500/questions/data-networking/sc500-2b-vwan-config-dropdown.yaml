id: sc500-2b-vwan-config-dropdown
objective: "2.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a Standard Azure Virtual WAN hub named Hub1 that contains an Azure Firewall. Hub1 currently has a custom route table named RT-Prod. The spoke virtual network VNet-Lab uses the address space 100.70.0.0/16.

    You need to inspect all private and internet-bound traffic of the spokes with the firewall. VNet-Lab must send its internet traffic through the firewall too.

    How should you complete the plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un hub Azure Virtual WAN Standard nommé Hub1 qui contient un Pare-feu Azure. Hub1 a actuellement une table de routage personnalisée nommée RT-Prod. Le réseau virtuel spoke VNet-Lab utilise l'espace d'adressage 100.70.0.0/16.

    Vous devez inspecter avec le pare-feu tout le trafic privé et à destination d'Internet des spokes. VNet-Lab doit lui aussi envoyer son trafic Internet par le pare-feu.

    Comment devez-vous compléter le plan ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. Before configuring routing intent: [[pre]].

      2. Configure Internet and Private traffic policies, and add 100.70.0.0/16 to [[pfx]].

      3. On the VNet-Lab connection, make sure that [[flag]] is enabled.
    fr: |
      1. Avant de configurer l'intention de routage : [[pre]].

      2. Configurer les stratégies Trafic Internet et Trafic privé, et ajouter 100.70.0.0/16 à [[pfx]].

      3. Sur la connexion de VNet-Lab, vérifier que [[flag]] est activé.
  slots:
    - id: pre
      options:
        - { id: rmrt, text: { en: "back up and remove RT-Prod", fr: "sauvegarder puis supprimer RT-Prod" } }
        - { id: bgp, text: { en: "enable BGP peering on every spoke connection", fr: "activer le peering BGP sur chaque connexion de spoke" } }
        - { id: prem, text: { en: "upgrade the firewall to the Premium tier", fr: "faire passer le pare-feu au niveau Premium" } }
    - id: pfx
      options:
        - { id: ptp, text: { en: "the Private Traffic Prefixes (additional prefixes)", fr: "les préfixes de trafic privé (préfixes supplémentaires)" } }
        - { id: none, text: { en: "the noneRouteTable", fr: "la noneRouteTable" } }
        - { id: static, text: { en: "a static route whose next hop is the VNet-Lab connection", fr: "un itinéraire statique dont le tronçon suivant est la connexion de VNet-Lab" } }
    - id: flag
      options:
        - { id: pdr, text: { en: "Propagate default route (Enable internet security)", fr: "Propagate default route (Enable internet security)" } }
        - { id: psr, text: { en: "Propagate static routes", fr: "Propagate static routes" } }
        - { id: bypass, text: { en: "Bypass next hop IP for workloads", fr: "Bypass next hop IP for workloads" } }
answer:
  values: { pre: rmrt, pfx: ptp, flag: pdr }
explanation:
  correct:
    en: |-
      Routing intent requires a hub without custom route tables, and it doesn't keep the previous configuration, so you back up and remove RT-Prod first. The Private traffic policy covers RFC 1918 by default, so a non-RFC 1918 range such as 100.70.0.0/16 is added as a private traffic prefix. The hub advertises 0.0.0.0/0 only to connections where Propagate default route (Enable internet security) is true.
    fr: |-
      L'intention de routage exige un hub sans table de routage personnalisée et ne conserve pas la configuration précédente : vous sauvegardez puis supprimez d'abord RT-Prod. La stratégie Trafic privé couvre par défaut les plages RFC 1918 : une plage hors RFC 1918 comme 100.70.0.0/16 s'ajoute comme préfixe de trafic privé. Le hub n'annonce 0.0.0.0/0 qu'aux connexions dont Propagate default route (Enable internet security) est activé.
  options:
    bgp: { en: "BGP peering is an alternative to static routes to a VNet connection, not a prerequisite of routing intent.", fr: "Le peering BGP est une alternative aux itinéraires statiques vers une connexion de réseau virtuel, pas un prérequis de l'intention de routage." }
    prem: { en: "The firewall tier doesn't affect routing intent.", fr: "Le niveau du pare-feu n'a pas d'effet sur l'intention de routage." }
    none: { en: "With routing intent, connections propagate to the noneRouteTable; adding prefixes there doesn't send traffic to the firewall.", fr: "Avec l'intention de routage, les connexions se propagent vers la noneRouteTable ; y ajouter des préfixes n'envoie pas le trafic au pare-feu." }
    static: { en: "Static routes with a virtual network connection as next hop are incompatible with routing intent.", fr: "Les itinéraires statiques ayant une connexion de réseau virtuel comme tronçon suivant sont incompatibles avec l'intention de routage." }
    psr: { en: "Propagate static routes concerns static routes defined on the connection, not the default route.", fr: "Propagate static routes concerne les itinéraires statiques définis sur la connexion, pas l'itinéraire par défaut." }
    bypass: { en: "This setting concerns static routes on the connection; it doesn't control whether the spoke learns 0.0.0.0/0.", fr: "Ce paramètre concerne les itinéraires statiques de la connexion ; il ne contrôle pas si le spoke apprend 0.0.0.0/0." }
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
