id: sc500-cs1c-foundry-private
objective: "2.3.6"
type: multi
caseStudy: sc500-cs1c-adatum-legal
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the network requirement for adt-foundry.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence réseau pour adt-foundry.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a private endpoint in snet-pe for adt-foundry with the target sub-resource account", fr: "Créer un point de terminaison privé dans snet-pe pour adt-foundry avec la sous-ressource cible account" } }
    - { id: b, text: { en: "Enable the Microsoft.CognitiveServices service endpoint on snet-apim and add a virtual network rule on adt-foundry", fr: "Activer le point de terminaison de service Microsoft.CognitiveServices sur snet-apim et ajouter une règle de réseau virtuel sur adt-foundry" } }
    - { id: c, text: { en: "Set the public network access of adt-foundry to Disabled", fr: "Définir l'accès réseau public de adt-foundry sur Disabled" } }
    - { id: d, text: { en: "Set the public network access of adt-foundry to Enabled from selected IP addresses and add the outbound IP address of apim-adt-ai", fr: "Définir l'accès réseau public de adt-foundry sur Enabled from selected IP addresses et ajouter l'adresse IP sortante de apim-adt-ai" } }
    - { id: e, text: { en: "Create a Private Link service in VNet-AI that publishes adt-foundry", fr: "Créer un service Private Link dans VNet-AI qui publie adt-foundry" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      A private endpoint for a Foundry resource uses the account sub-resource and gives adt-foundry a private IP address in snet-pe; its private DNS zones resolve the resource endpoints to that address for VNet-AI. Setting public network access to Disabled then blocks every connection through the public endpoint, so only the private endpoint remains.
    fr: |-
      Un point de terminaison privé pour une ressource Foundry utilise la sous-ressource account et donne à adt-foundry une adresse IP privée dans snet-pe ; ses zones DNS privées résolvent les points de terminaison de la ressource vers cette adresse pour VNet-AI. Définir ensuite l'accès réseau public sur Disabled bloque toute connexion par le point de terminaison public : seul le point de terminaison privé subsiste.
  options:
    b:
      en: |-
        A service endpoint and a virtual network rule still use the public endpoint of adt-foundry; they do not provide a private endpoint.
      fr: |-
        Un point de terminaison de service et une règle de réseau virtuel utilisent toujours le point de terminaison public de adt-foundry ; ils ne fournissent pas de point de terminaison privé.
    d:
      en: |-
        Selected IP addresses keeps the public endpoint open to those addresses, which does not meet the private endpoint requirement.
      fr: |-
        Les adresses IP sélectionnées laissent le point de terminaison public ouvert à ces adresses, ce qui ne respecte pas l'exigence de point de terminaison privé.
    e:
      en: |-
        A Private Link service publishes your own service that runs behind a Standard load balancer; it is not used to reach a Microsoft PaaS resource such as Foundry.
      fr: |-
        Un service Private Link publie votre propre service exécuté derrière un équilibreur de charge Standard ; il ne sert pas à atteindre une ressource PaaS Microsoft comme Foundry.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
