id: sc500-2b-nsg-asg-vnet
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have the following resources in an Azure subscription.

    | Name | Type | Details |
    | --- | --- | --- |
    | VNet1 | Virtual network | Peered with VNet2 |
    | VNet2 | Virtual network | Peered with VNet1 |
    | asg-web | Application security group | Contains the network interfaces of VM1 and VM2, which are in VNet1 |
    | VM3 | Virtual machine | Web server connected to VNet2 |

    You try to add the network interface of VM3 to asg-web, and the operation fails. VM3 must be filtered by NSG rules based on its web role, without using its IP address.

    What should you do?
  fr: |
    Vous disposez des ressources suivantes dans un abonnement Azure.

    | Nom | Type | Détails |
    | --- | --- | --- |
    | VNet1 | Réseau virtuel | Peering avec VNet2 |
    | VNet2 | Réseau virtuel | Peering avec VNet1 |
    | asg-web | Groupe de sécurité d'application | Contient les cartes réseau de VM1 et VM2, qui sont dans VNet1 |
    | VM3 | Machine virtuelle | Serveur web connecté à VNet2 |

    Vous essayez d'ajouter la carte réseau de VM3 à asg-web, et l'opération échoue. VM3 doit être filtrée par des règles de NSG selon son rôle web, sans utiliser son adresse IP.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable gateway transit on the peering between VNet1 and VNet2, and then add VM3 to asg-web.", fr: "Activer le transit par passerelle sur le peering entre VNet1 et VNet2, puis ajouter VM3 à asg-web." } }
    - { id: b, text: { en: "Move asg-web to the resource group that contains VNet2, and then add VM3 to asg-web.", fr: "Déplacer asg-web vers le groupe de ressources qui contient VNet2, puis ajouter VM3 à asg-web." } }
    - { id: c, text: { en: "Create a second application security group for VM3, and reference it in the NSG rules for VNet2.", fr: "Créer un second groupe de sécurité d'application pour VM3, et le référencer dans les règles de NSG de VNet2." } }
    - { id: d, text: { en: "Associate the NSG of VNet1 with the subnet of VM3, and then add VM3 to asg-web.", fr: "Associer le NSG de VNet1 au sous-réseau de VM3, puis ajouter VM3 à asg-web." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      All the network interfaces of an application security group must be in the same virtual network as the first interface added to it. asg-web is bound to VNet1, and peering doesn't change that, so VM3 in VNet2 needs its own application security group, used in the rules that filter VNet2 traffic.
    fr: |-
      Toutes les cartes réseau d'un groupe de sécurité d'application doivent être dans le même réseau virtuel que la première carte ajoutée. asg-web est lié à VNet1, et le peering n'y change rien : VM3, dans VNet2, a besoin de son propre groupe de sécurité d'application, utilisé dans les règles qui filtrent le trafic de VNet2.
  options:
    a: { en: "Gateway transit shares a VPN gateway across a peering; it doesn't let an application security group span two virtual networks.", fr: "Le transit par passerelle partage une passerelle VPN à travers un peering ; il ne permet pas à un groupe de sécurité d'application de couvrir deux réseaux virtuels." }
    b: { en: "The constraint is the virtual network of the first member, not the resource group of the application security group.", fr: "La contrainte porte sur le réseau virtuel du premier membre, pas sur le groupe de ressources du groupe de sécurité d'application." }
    d: { en: "Associating an NSG with another subnet doesn't remove the rule that all members of an application security group share one virtual network.", fr: "Associer un NSG à un autre sous-réseau ne lève pas la règle selon laquelle tous les membres d'un groupe de sécurité d'application partagent un même réseau virtuel." }
references:
  - title: Application security groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
