id: sc500-2b-vpn-sku
objective: "2.3.4"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Contoso is deploying a new route-based VPN gateway for a production virtual network. The gateway must meet the following requirements:

    - Use a custom IPsec/IKE policy on the site-to-site connection to the head office.
    - Support up to 400 concurrent point-to-site connections that use OpenVPN.
    - Minimize cost.

    Which gateway SKU should you choose?
  fr: |
    Contoso déploie une nouvelle passerelle VPN basée sur des itinéraires pour un réseau virtuel de production. La passerelle doit répondre aux exigences suivantes :

    - Utiliser une stratégie IPsec/IKE personnalisée sur la connexion site à site vers le siège.
    - Prendre en charge jusqu'à 400 connexions point à site simultanées utilisant OpenVPN.
    - Minimiser les coûts.

    Quelle référence SKU de passerelle devez-vous choisir ?
body:
  options:
    - { id: a, text: Basic }
    - { id: b, text: VpnGw1AZ }
    - { id: c, text: VpnGw2AZ }
    - { id: d, text: VpnGw3AZ }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Custom IPsec/IKE policies are supported on the VpnGw SKUs but not on Basic, which also doesn't support OpenVPN and is meant for dev-test. VpnGw1AZ supports at most 250 IKEv2/OpenVPN point-to-site connections and VpnGw2AZ at most 500, so VpnGw2AZ is the smallest SKU that meets the requirements.
    fr: |-
      Les stratégies IPsec/IKE personnalisées sont prises en charge sur les SKU VpnGw, mais pas sur Basic, qui ne prend pas non plus en charge OpenVPN et est destiné au développement et aux tests. VpnGw1AZ prend en charge au plus 250 connexions point à site IKEv2/OpenVPN et VpnGw2AZ au plus 500 : VpnGw2AZ est donc la plus petite référence SKU qui répond aux exigences.
  options:
    a: { en: "Basic supports neither custom IPsec/IKE policies nor OpenVPN, and isn't intended for production.", fr: "Basic ne prend en charge ni les stratégies IPsec/IKE personnalisées ni OpenVPN, et n'est pas destiné à la production." }
    b: { en: "VpnGw1AZ is limited to 250 IKEv2/OpenVPN point-to-site connections.", fr: "VpnGw1AZ est limité à 250 connexions point à site IKEv2/OpenVPN." }
    d: { en: "VpnGw3AZ meets the requirements but costs more than VpnGw2AZ.", fr: "VpnGw3AZ répond aux exigences mais coûte plus cher que VpnGw2AZ." }
references:
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
