id: sc500-2c-pe-dns-zones
objective: "2.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank creates private endpoints for several PaaS resources in a virtual network named VNet-Core. You need to create the private DNS zones that the private endpoints use, by following the recommended zone names.

    Which private DNS zone should you use for each target sub-resource? To answer, drag the appropriate DNS zones to the correct sub-resources. Each DNS zone may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank crée des points de terminaison privés pour plusieurs ressources PaaS dans un réseau virtuel nommé VNet-Core. Vous devez créer les zones DNS privées utilisées par les points de terminaison privés, en suivant les noms de zone recommandés.

    Quelle zone DNS privée devez-vous utiliser pour chaque sous-ressource cible ? Pour répondre, faites glisser les zones DNS appropriées vers les sous-ressources correspondantes. Chaque zone DNS peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vault, text: privatelink.vaultcore.azure.net }
    - { id: sql, text: privatelink.database.windows.net }
    - { id: sites, text: privatelink.azurewebsites.net }
    - { id: dfs, text: privatelink.dfs.core.windows.net }
    - { id: blob, text: privatelink.blob.core.windows.net }
    - { id: cosmos, text: privatelink.documents.azure.com }
  targets:
    - id: t-kv
      text: { en: "Azure Key Vault: vault", fr: "Azure Key Vault : vault" }
    - id: t-sql
      text: { en: "Azure SQL Database: sqlServer", fr: "Azure SQL Database : sqlServer" }
    - id: t-app
      text: { en: "Azure App Service: sites", fr: "Azure App Service : sites" }
    - id: t-adls
      text: { en: "Storage account with Data Lake Storage: dfs", fr: "Compte de stockage avec Data Lake Storage : dfs" }
answer:
  mapping: { t-kv: vault, t-sql: sql, t-app: sites, t-adls: dfs }
explanation:
  correct:
    en: Each sub-resource has its own recommended private DNS zone. Key Vault uses `privatelink.vaultcore.azure.net`, Azure SQL Database uses `privatelink.database.windows.net`, App Service uses `privatelink.azurewebsites.net`, and the dfs sub-resource of a storage account uses `privatelink.dfs.core.windows.net`, distinct from the blob zone.
    fr: Chaque sous-ressource a sa propre zone DNS privée recommandée. Key Vault utilise `privatelink.vaultcore.azure.net`, Azure SQL Database `privatelink.database.windows.net`, App Service `privatelink.azurewebsites.net`, et la sous-ressource dfs d'un compte de stockage `privatelink.dfs.core.windows.net`, distincte de la zone blob.
  options:
    blob: { en: "The blob zone serves the blob sub-resource; dfs has its own zone and needs its own private endpoint.", fr: "La zone blob sert la sous-ressource blob ; dfs a sa propre zone et nécessite son propre point de terminaison privé." }
    cosmos: { en: "privatelink.documents.azure.com is the zone for the Sql sub-resource of Azure Cosmos DB.", fr: "privatelink.documents.azure.com est la zone de la sous-ressource Sql d'Azure Cosmos DB." }
references:
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
