id: sc500-sr2-avnm-deny-3
objective: "2.3.2"
type: series_yesno
series: sc500-sr2-avnm-deny
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You associate an NSG that denies the ports with every production subnet.
  fr: Vous associez à chaque sous-réseau de production un NSG qui refuse les ports.
body:
  solution:
    en: You create an NSG named **NSG-Block** that contains an inbound rule with **Priority** 100 that denies TCP ports 22 and 3389 from the **Internet** service tag. You associate NSG-Block with every subnet of the production virtual networks.
    fr: Vous créez un NSG nommé **NSG-Block** qui contient une règle de trafic entrant de **Priority** 100 qui refuse les ports TCP 22 et 3389 depuis la balise de service **Internet**. Vous associez NSG-Block à chaque sous-réseau des réseaux virtuels de production.
answer: { value: false }
explanation:
  correct:
    en: The application teams manage the NSGs of their subnets with Network Contributor, so they can add a higher-priority Allow rule or replace NSG-Block. The new production virtual networks would also need manual associations. Only a security admin rule with the Deny action cannot be overridden by NSG rules.
    fr: Les équipes applicatives gèrent les NSG de leurs sous-réseaux avec Network Contributor ; elles peuvent donc ajouter une règle Allow de priorité plus élevée ou remplacer NSG-Block. Les nouveaux réseaux virtuels de production nécessiteraient aussi des associations manuelles. Seule une règle d'administration de sécurité avec l'action Deny ne peut pas être contournée par les règles NSG.
references:
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
