id: sc500-2a-sas-revoke-udk
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a storage account named **stcontosomedia**. An app named **App1** uses its managed identity to issue user delegation SAS tokens that are valid for seven days. Shared Key access is disallowed on stcontosomedia.

    One of the tokens was published on a public forum. You need to invalidate every user delegation SAS issued for stcontosomedia as quickly as possible.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un compte de stockage nommé **stcontosomedia**. Une application nommée **App1** utilise son identité managée pour émettre des jetons SAS de délégation d'utilisateur valides sept jours. L'accès par clé partagée est interdit sur stcontosomedia.

    L'un des jetons a été publié sur un forum public. Vous devez invalider le plus rapidement possible toutes les SAS de délégation d'utilisateur émises pour stcontosomedia.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Regenerate both access keys of stcontosomedia.", fr: "Régénérer les deux clés d'accès de stcontosomedia." } }
    - { id: b, text: { en: "Delete the stored access policies of the containers in stcontosomedia.", fr: "Supprimer les stratégies d'accès stockées des conteneurs de stcontosomedia." } }
    - { id: c, text: { en: "Revoke the user delegation keys of stcontosomedia.", fr: "Révoquer les clés de délégation d'utilisateur de stcontosomedia." } }
    - { id: d, text: { en: "Set the SAS expiration policy of stcontosomedia to one day.", fr: "Définir la stratégie d'expiration SAS de stcontosomedia sur un jour." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A user delegation SAS is signed with a user delegation key. Revoking the user delegation keys of the account invalidates every SAS signed with them, which is the quickest option; removing the role assignment of the identity that requested the keys also works but takes longer to propagate.
    fr: |
      Une SAS de délégation d'utilisateur est signée avec une clé de délégation d'utilisateur. Révoquer les clés de délégation d'utilisateur du compte invalide toutes les SAS signées avec elles : c'est l'option la plus rapide ; supprimer l'attribution de rôle de l'identité qui a demandé les clés fonctionne aussi, mais met plus de temps à se propager.
  options:
    a:
      en: |
        Account keys sign service and account SAS; user delegation SAS tokens don't depend on them.
      fr: |
        Les clés de compte signent les SAS de service et de compte ; les jetons SAS de délégation d'utilisateur n'en dépendent pas.
    b:
      en: |
        A user delegation SAS can't reference a stored access policy, so deleting policies has no effect on it.
      fr: |
        Une SAS de délégation d'utilisateur ne peut pas référencer de stratégie d'accès stockée : supprimer des stratégies n'a aucun effet sur elle.
    d:
      en: |
        The SAS expiration policy is a recommended maximum for service and account SAS; it doesn't revoke tokens already issued.
      fr: |
        La stratégie d'expiration SAS est un maximum recommandé pour les SAS de service et de compte ; elle ne révoque pas les jetons déjà émis.
references:
  - title: Create a user delegation SAS
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas
