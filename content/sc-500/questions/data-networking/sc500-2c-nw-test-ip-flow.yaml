id: sc500-2c-nw-test-ip-flow
objective: "2.3.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM-Web1** in a resource group named RG-Web has a single network interface with the private IP address 10.1.2.4 and a public IP address.

    You need to check, by using the Azure CLI, whether the security rules allow SSH connections from an administration workstation whose public IP address is 203.0.113.50 to VM-Web1, and which rule decides.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM-Web1**, dans un groupe de ressources nommé RG-Web, a une seule carte réseau avec l'adresse IP privée 10.1.2.4 et une adresse IP publique.

    Vous devez vérifier avec Azure CLI si les règles de sécurité autorisent les connexions SSH d'un poste d'administration dont l'adresse IP publique est 203.0.113.50 vers VM-Web1, et quelle règle en décide.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network watcher [[cmd]] \
      --resource-group RG-Web --vm VM-Web1 \
      --direction Inbound --protocol TCP \
      --local [[local]] \
      --remote [[remote]]
  slots:
    - id: cmd
      options:
        - { id: ipflow, text: test-ip-flow }
        - { id: nexthop, text: show-next-hop }
        - { id: conn, text: test-connectivity }
        - { id: config, text: run-configuration-diagnostic }
    - id: local
      options:
        - { id: l-vm22, text: "10.1.2.4:22" }
        - { id: l-ws22, text: "203.0.113.50:22" }
        - { id: l-vmany, text: "10.1.2.4:*" }
    - id: remote
      options:
        - { id: r-wsany, text: "203.0.113.50:*" }
        - { id: r-vm22, text: "10.1.2.4:22" }
        - { id: r-vmany, text: "10.1.2.4:*" }
answer:
  values: { cmd: ipflow, local: l-vm22, remote: r-wsany }
explanation:
  correct:
    en: "`az network watcher test-ip-flow` tests a TCP or UDP flow against the security rules of the VM and returns Allow or Deny with the rule name. `--local` is the private IP address of the VM's network interface with the packet's port, here SSH port 22, and `--remote` is the other side; for an inbound test, `*` can be used for the remote port."
    fr: "`az network watcher test-ip-flow` teste un flux TCP ou UDP par rapport aux règles de sécurité de la machine virtuelle et renvoie Allow ou Deny avec le nom de la règle. `--local` est l'adresse IP privée de la carte réseau de la machine virtuelle avec le port du paquet, ici le port SSH 22, et `--remote` l'autre extrémité ; pour un test entrant, `*` peut servir de port distant."
  options:
    nexthop: { en: "show-next-hop returns the routing decision and takes source and destination IP addresses, not security rules.", fr: "show-next-hop renvoie la décision de routage et attend des adresses IP source et destination, pas des règles de sécurité." }
    conn: { en: "test-connectivity runs connection troubleshoot with real traffic toward a destination; it does not take --local and --remote.", fr: "test-connectivity lance une résolution des problèmes de connexion avec du vrai trafic vers une destination ; il n'accepte pas --local et --remote." }
    config: { en: "run-configuration-diagnostic runs NSG diagnostics with its own query parameters, not --local and --remote.", fr: "run-configuration-diagnostic lance les diagnostics NSG avec ses propres paramètres de requête, pas --local et --remote." }
    l-ws22: { en: "--local must be the private IP address of the VM's network interface.", fr: "--local doit être l'adresse IP privée de la carte réseau de la machine virtuelle." }
    l-vmany: { en: "For an inbound test, the local port is the destination port and must be specified; * is allowed for the local port only on outbound tests.", fr: "Pour un test entrant, le port local est le port de destination et doit être précisé ; * n'est autorisé pour le port local que dans les tests sortants." }
    r-vm22: { en: "The remote side is the workstation, not the VM.", fr: "L'extrémité distante est le poste d'administration, pas la machine virtuelle." }
    r-vmany: { en: "The remote side is the workstation, not the VM.", fr: "L'extrémité distante est le poste d'administration, pas la machine virtuelle." }
references:
  - title: az network watcher
    url: https://learn.microsoft.com/en-us/cli/azure/network/watcher
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
