id: sc500-2a-def-sub-scope
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a subscription named **Sub-Prod** that contains 120 storage accounts. Teams create new storage accounts every week. One account, **stnwtest**, is used only for load tests.

    You need to enable Microsoft Defender for Storage so that every existing and future storage account in Sub-Prod is protected, except stnwtest. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Northwind Traders dispose d'un abonnement nommé **Sub-Prod** qui contient 120 comptes de stockage. Les équipes créent de nouveaux comptes de stockage chaque semaine. Un compte, **stnwtest**, sert uniquement aux tests de charge.

    Vous devez activer Microsoft Defender for Storage pour que chaque compte de stockage existant et futur de Sub-Prod soit protégé, sauf stnwtest. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Defender for Storage on each storage account, except stnwtest, from the account's Microsoft Defender for Cloud page.", fr: "Activer Defender for Storage sur chaque compte de stockage, sauf stnwtest, depuis la page Microsoft Defender for Cloud du compte." } }
    - { id: b, text: { en: "Enable the Defender CSPM plan on Sub-Prod and exclude stnwtest from the plan.", fr: "Activer le plan Defender CSPM sur Sub-Prod et en exclure stnwtest." } }
    - { id: c, text: { en: "Create a diagnostic setting on each storage account that sends StorageBlobLogs to a Log Analytics workspace.", fr: "Créer sur chaque compte de stockage un paramètre de diagnostic qui envoie StorageBlobLogs vers un espace de travail Log Analytics." } }
    - { id: d, text: { en: "Enable Defender for Storage on Sub-Prod, and then turn it off for stnwtest with an account-level override.", fr: "Activer Defender for Storage sur Sub-Prod, puis le désactiver pour stnwtest avec un remplacement au niveau du compte." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Enabling Defender for Storage at the subscription level, the recommended approach, protects all existing accounts and every account created later. A storage account can override the subscription settings with its own configuration, which is how you exclude stnwtest.
    fr: |
      Activer Defender for Storage au niveau de l'abonnement, l'approche recommandée, protège tous les comptes existants et tous ceux créés ensuite. Un compte de stockage peut remplacer les paramètres de l'abonnement par sa propre configuration : c'est ainsi que vous excluez stnwtest.
  options:
    a:
      en: |
        Per-account enablement covers only the current accounts; every new account would have to be enabled by hand.
      fr: |
        L'activation par compte ne couvre que les comptes actuels ; chaque nouveau compte devrait être activé manuellement.
    b:
      en: |
        Defender CSPM is the posture management plan; threat protection for storage accounts is the Defender for Storage plan.
      fr: |
        Defender CSPM est le plan de gestion de la posture ; la protection contre les menaces des comptes de stockage relève du plan Defender for Storage.
    c:
      en: |
        Resource logs only collect telemetry; Defender for Storage doesn't need them and they raise no threat alerts by themselves.
      fr: |
        Les journaux de ressources ne font que collecter des données de télémétrie ; Defender for Storage n'en a pas besoin et ils ne déclenchent à eux seuls aucune alerte de menace.
references:
  - title: What is Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
