id: sc500-2a-sas-udsas-migrate
objective: "2.1.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a storage account named **sttailspinshare**. An app named **App1** creates service SAS tokens signed with an account key so that customers can download invoices from a container named **invoices**. App1 runs on Azure App Service and has a system-assigned managed identity. No other client uses the account keys.

    You need App1 to issue user delegation SAS tokens instead, and then to disallow Shared Key authorization on sttailspinshare. Customers must not experience any outage.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'un compte de stockage nommé **sttailspinshare**. Une application nommée **App1** crée des jetons SAS de service signés avec une clé de compte pour que des clients téléchargent des factures depuis un conteneur nommé **invoices**. App1 s'exécute sur Azure App Service et dispose d'une identité managée affectée par le système. Aucun autre client n'utilise les clés du compte.

    Vous devez faire en sorte qu'App1 émette à la place des jetons SAS de délégation d'utilisateur, puis interdire l'autorisation par clé partagée sur sttailspinshare. Les clients ne doivent subir aucune interruption.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: role, text: { en: "Assign the Storage Blob Data Reader role at the scope of sttailspinshare to the managed identity of App1.", fr: "Attribuer le rôle Storage Blob Data Reader à l'étendue de sttailspinshare à l'identité managée d'App1." } }
    - { id: rolecont, text: { en: "Assign the Storage Blob Data Reader role at the scope of the invoices container to the managed identity of App1.", fr: "Attribuer le rôle Storage Blob Data Reader à l'étendue du conteneur invoices à l'identité managée d'App1." } }
    - { id: code, text: { en: "Update App1 to request a user delegation key with its managed identity and to sign the SAS tokens with it.", fr: "Mettre à jour App1 pour qu'elle demande une clé de délégation d'utilisateur avec son identité managée et signe les jetons SAS avec elle." } }
    - { id: disable, text: { en: "Set Allow storage account key access to Disabled on sttailspinshare.", fr: "Définir Allow storage account key access sur Disabled sur sttailspinshare." } }
    - { id: policy, text: { en: "Create a stored access policy on the invoices container and reference it in the SAS tokens.", fr: "Créer une stratégie d'accès stockée sur le conteneur invoices et la référencer dans les jetons SAS." } }
    - { id: rotate, text: { en: "Regenerate both access keys of sttailspinshare.", fr: "Régénérer les deux clés d'accès de sttailspinshare." } }
answer:
  sequence: [ role, code, disable ]
explanation:
  correct:
    en: |
      Requesting a user delegation key requires the generateUserDelegationKey action at the storage account scope or above, and the SAS can't grant more than the identity's own data permissions, so Storage Blob Data Reader at the account scope comes first. App1 then signs its SAS tokens with the user delegation key. Only when no client depends on Shared Key do you disallow it; user delegation SAS tokens keep working.
    fr: |
      La demande d'une clé de délégation d'utilisateur exige l'action generateUserDelegationKey à l'étendue du compte de stockage ou au-dessus, et la SAS ne peut pas accorder plus que les autorisations de données de l'identité : Storage Blob Data Reader à l'étendue du compte vient donc en premier. App1 signe ensuite ses jetons SAS avec la clé de délégation d'utilisateur. Ce n'est que lorsque plus aucun client ne dépend de la clé partagée que vous l'interdisez ; les jetons SAS de délégation d'utilisateur continuent de fonctionner.
  options:
    rolecont: { en: "generateUserDelegationKey must be granted at the storage account scope or above, so a role assigned only on the container doesn't let App1 request the key.", fr: "generateUserDelegationKey doit être accordée à l'étendue du compte de stockage ou au-dessus : un rôle attribué uniquement sur le conteneur ne permet pas à App1 de demander la clé." }
    policy: { en: "A user delegation SAS can't reference a stored access policy.", fr: "Une SAS de délégation d'utilisateur ne peut pas référencer de stratégie d'accès stockée." }
    rotate: { en: "Rotating the keys isn't needed once Shared Key is disallowed, and doing it earlier would break the existing service SAS tokens.", fr: "Régénérer les clés n'est pas nécessaire une fois la clé partagée interdite, et le faire plus tôt casserait les jetons SAS de service existants." }
references:
  - title: Create a user delegation SAS
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/create-user-delegation-sas
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
