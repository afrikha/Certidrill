id: sc500-2a-sql-entra-only-role
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL Database logical server named **sql-fab-billing**. A Microsoft Entra admin is already configured on the server.

    A database security engineer named **Eng1** must be able to enable and disable Microsoft Entra-only authentication on sql-fab-billing. Eng1 must not be able to manage other resources in the resource group. The solution must follow the principle of least privilege.

    Which role should you assign to Eng1 on sql-fab-billing?
  fr: |
    Fabrikam dispose d'un serveur logique Azure SQL Database nommé **sql-fab-billing**. Un administrateur Microsoft Entra est déjà configuré sur le serveur.

    Un ingénieur sécurité des bases de données nommé **Eng1** doit pouvoir activer et désactiver l'authentification Microsoft Entra uniquement sur sql-fab-billing. Eng1 ne doit pas pouvoir gérer les autres ressources du groupe de ressources. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Eng1 sur sql-fab-billing ?
body:
  options:
    - { id: a, text: SQL Server Contributor }
    - { id: b, text: SQL Security Manager }
    - { id: c, text: SQL DB Contributor }
    - { id: d, text: Owner }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SQL Security Manager can manage the security-related settings of the server, including enabling and disabling Microsoft Entra-only authentication. Owner and Contributor can also do it, but they grant much broader permissions.
    fr: |
      SQL Security Manager peut gérer les paramètres de sécurité du serveur, notamment activer et désactiver l'authentification Microsoft Entra uniquement. Owner et Contributor le peuvent aussi, mais accordent des autorisations bien plus larges.
  options:
    a:
      en: |
        SQL Server Contributor manages servers and databases but explicitly can't enable or disable Microsoft Entra-only authentication.
      fr: |
        SQL Server Contributor gère les serveurs et bases de données, mais ne peut justement pas activer ni désactiver l'authentification Microsoft Entra uniquement.
    c:
      en: |
        SQL DB Contributor manages databases, not the security settings of the server.
      fr: |
        SQL DB Contributor gère les bases de données, pas les paramètres de sécurité du serveur.
    d:
      en: |
        Owner works but includes full control and role assignment rights, which exceeds least privilege.
      fr: |
        Owner fonctionne, mais inclut le contrôle total et le droit d'attribuer des rôles, ce qui dépasse le moindre privilège.
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
