id: sc500-2a-def-eventgrid
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a storage account named **stfabuploads** in the North Europe region. Defender for Storage malware scanning is enabled on stfabuploads. A function app must move every malicious blob to a quarantine container in near real time.

    You plan to send the scan results to an Event Grid custom topic named **egt-scan** and to subscribe the function app to it.

    How should you configure the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un compte de stockage nommé **stfabuploads** dans la région North Europe. L'analyse des programmes malveillants de Defender for Storage est activée sur stfabuploads. Une application de fonction doit déplacer chaque objet blob malveillant vers un conteneur de quarantaine en temps quasi réel.

    Vous prévoyez d'envoyer les résultats d'analyse vers une rubrique personnalisée Event Grid nommée **egt-scan** et d'y abonner l'application de fonction.

    Comment devez-vous configurer la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Region of egt-scan: [[region]]

      Network access of egt-scan: [[net]]

      Event type to filter in the event subscription: [[evt]]
    fr: |
      Région de egt-scan : [[region]]

      Accès réseau de egt-scan : [[net]]

      Type d'événement à filtrer dans l'abonnement aux événements : [[evt]]
  slots:
    - id: region
      options:
        - { id: same, text: { en: "North Europe, the region of stfabuploads", fr: "North Europe, la région de stfabuploads" } }
        - { id: paired, text: { en: "West Europe, the paired region of North Europe", fr: "West Europe, la région jumelée de North Europe" } }
        - { id: func, text: { en: "Any region, as long as the function app is in the same region", fr: "N'importe quelle région, si l'application de fonction est dans la même région" } }
    - id: net
      options:
        - { id: public, text: { en: "Public network access allowed", fr: "Accès réseau public autorisé" } }
        - { id: private, text: { en: "Private endpoints only", fr: "Points de terminaison privés uniquement" } }
    - id: evt
      options:
        - { id: scan, text: Microsoft.Security.MalwareScanningResult }
        - { id: created, text: Microsoft.Storage.BlobCreated }
        - { id: tier, text: Microsoft.Storage.BlobTierChanged }
answer:
  values: { region: same, net: public, evt: scan }
explanation:
  correct:
    en: |
      The custom topic must be in the same region as the storage account; cross-region delivery of malware scanning events isn't supported. The topic must allow access from public IP addresses, because a topic reachable only through private endpoints can't receive events from Defender for Storage. Scan results are published with the event type Microsoft.Security.MalwareScanningResult, whose data includes the scanResultType (for example Malicious).
    fr: |
      La rubrique personnalisée doit être dans la même région que le compte de stockage ; la livraison interrégion des événements d'analyse n'est pas prise en charge. La rubrique doit autoriser l'accès depuis des adresses IP publiques, car une rubrique joignable uniquement par des points de terminaison privés ne peut pas recevoir d'événements de Defender for Storage. Les résultats d'analyse sont publiés avec le type d'événement Microsoft.Security.MalwareScanningResult, dont les données incluent scanResultType (par exemple Malicious).
  options:
    paired: { en: "Cross-region delivery isn't supported, even to the paired region.", fr: "La livraison interrégion n'est pas prise en charge, même vers la région jumelée." }
    private: { en: "Private endpoint-only topics can't receive the scan events.", fr: "Les rubriques limitées aux points de terminaison privés ne peuvent pas recevoir les événements d'analyse." }
    created: { en: "BlobCreated fires on every upload, before any scan verdict exists.", fr: "BlobCreated se déclenche à chaque chargement, avant qu'un verdict d'analyse existe." }
references:
  - title: Set up automated remediation for malware detection
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-configure-malware-scan
