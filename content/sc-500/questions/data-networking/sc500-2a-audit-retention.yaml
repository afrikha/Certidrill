id: sc500-2a-audit-retention
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure SQL Database logical server named **sql-nw-retail**. Auditing isn't enabled yet. The compliance team has the following requirements:

    - Audit logs of every database must be kept for three years and then deleted automatically, at the lowest storage cost.
    - Analysts must be able to query the audit events of the last 90 days with KQL.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un serveur logique Azure SQL Database nommé **sql-nw-retail**. L'audit n'est pas encore activé. L'équipe de conformité a les exigences suivantes :

    - les journaux d'audit de chaque base de données doivent être conservés trois ans puis supprimés automatiquement, au coût de stockage le plus bas ;
    - les analystes doivent pouvoir interroger en KQL les événements d'audit des 90 derniers jours.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable server-level auditing to a storage account with a retention of 1,095 days.", fr: "Activer l'audit au niveau du serveur vers un compte de stockage avec une rétention de 1 095 jours." } }
    - { id: b, text: { en: "Enable server-level auditing to a storage account with a retention of 0 days.", fr: "Activer l'audit au niveau du serveur vers un compte de stockage avec une rétention de 0 jour." } }
    - { id: c, text: { en: "Add a Log Analytics workspace destination to the server-level auditing and keep 90 days of data in the workspace.", fr: "Ajouter une destination espace de travail Log Analytics à l'audit au niveau du serveur et conserver 90 jours de données dans l'espace de travail." } }
    - { id: d, text: { en: "Add an Event Hubs destination to the server-level auditing.", fr: "Ajouter une destination Event Hubs à l'audit au niveau du serveur." } }
    - { id: e, text: { en: "Enable database-level auditing to a storage account on each database.", fr: "Activer l'audit au niveau de la base de données vers un compte de stockage sur chaque base." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A server-level audit to Azure Storage with 1,095 retention days keeps every database's logs for three years and deletes older logs, which is the cheapest destination for long retention. A second destination, a Log Analytics workspace, makes the recent events queryable with KQL; the workspace keeps 90 days of data.
    fr: |
      Un audit au niveau du serveur vers le Stockage Azure avec une rétention de 1 095 jours conserve les journaux de chaque base pendant trois ans et supprime les plus anciens : c'est la destination la moins chère pour une longue rétention. Une seconde destination, un espace de travail Log Analytics, rend les événements récents interrogeables en KQL ; l'espace de travail conserve 90 jours de données.
  options:
    b:
      en: |
        A retention of 0 days means unlimited retention, so the logs would never be deleted.
      fr: |
        Une rétention de 0 jour signifie une rétention illimitée : les journaux ne seraient jamais supprimés.
    d:
      en: |
        Event Hubs streams events to other systems; it neither stores logs for three years nor supports KQL queries.
      fr: |
        Event Hubs transmet les événements à d'autres systèmes ; il ne conserve pas les journaux trois ans et ne prend pas en charge les requêtes KQL.
    e:
      en: |
        Database policies on each database add effort and don't cover databases created later; the server policy covers them all.
      fr: |
        Des stratégies sur chaque base augmentent l'effort et ne couvrent pas les bases créées ensuite ; la stratégie du serveur les couvre toutes.
references:
  - title: Set up Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-setup
