id: sc500-2b-ddb-server-level
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription named Sub1 that contains 12 Azure SQL Database logical servers. The Defender for Azure SQL Databases plan is off for Sub1.

    For organizational reasons, only the logical server named **sql-payments** must get SQL vulnerability assessment and Advanced Threat Protection. The other 11 servers must not be protected or billed by Defender for Azure SQL Databases.

    What should you do?
  fr: |
    Vous disposez d'un abonnement Azure nommé Sub1 qui contient 12 serveurs logiques Azure SQL Database. Le plan Defender for Azure SQL Databases est désactivé pour Sub1.

    Pour des raisons organisationnelles, seul le serveur logique nommé **sql-payments** doit bénéficier de l'évaluation des vulnérabilités SQL et d'Advanced Threat Protection. Les 11 autres serveurs ne doivent être ni protégés ni facturés par Defender for Azure SQL Databases.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On sql-payments, open Security > Defender for Cloud and select Enable Microsoft Defender for SQL.", fr: "Sur sql-payments, ouvrir Sécurité > Defender for Cloud et sélectionner Enable Microsoft Defender for SQL." } }
    - { id: b, text: { en: "In Environment settings for Sub1, switch the Defender for Azure SQL Databases plan to On.", fr: "Dans les paramètres d'environnement de Sub1, passer le plan Defender for Azure SQL Databases sur Activé." } }
    - { id: c, text: { en: "On sql-payments, enable auditing to a Log Analytics workspace that has Microsoft Sentinel.", fr: "Sur sql-payments, activer l'audit vers un espace de travail Log Analytics doté de Microsoft Sentinel." } }
    - { id: d, text: { en: "In Environment settings for Sub1, switch the Defender CSPM plan to On.", fr: "Dans les paramètres d'environnement de Sub1, passer le plan Defender CSPM sur Activé." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Microsoft Defender for SQL can be enabled at the resource level from the Defender for Cloud page under Security of a logical server or managed instance. One selection covers all the databases of that server, and billing is per server. Subscription-level enablement is recommended in general, but resource-level enablement is the supported option when only specific servers must be protected.
    fr: |-
      Microsoft Defender for SQL peut être activé au niveau de la ressource depuis la page Defender for Cloud, sous Sécurité, d'un serveur logique ou d'une instance managée. Une seule sélection couvre toutes les bases de ce serveur, et la facturation se fait par serveur. L'activation au niveau de l'abonnement est recommandée en général, mais l'activation au niveau de la ressource est l'option prise en charge quand seuls certains serveurs doivent être protégés.
  options:
    b: { en: "The subscription-level plan protects and bills all 12 servers, which the requirement forbids.", fr: "Le plan au niveau de l'abonnement protège et facture les 12 serveurs, ce que l'exigence interdit." }
    c: { en: "Auditing records database events; it provides neither vulnerability assessment nor Advanced Threat Protection.", fr: "L'audit enregistre les événements de base de données ; il ne fournit ni évaluation des vulnérabilités ni Advanced Threat Protection." }
    d: { en: "Defender CSPM is a posture management plan; it doesn't enable SQL vulnerability assessment or Advanced Threat Protection on a server.", fr: "Defender CSPM est un plan de gestion de la posture ; il n'active ni l'évaluation des vulnérabilités SQL ni Advanced Threat Protection sur un serveur." }
references:
  - title: Microsoft Defender for SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/azure-defender-for-sql
