id: sc500-2b-avnm-deploy-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Network Manager instance named NM1. A security admin configuration named SAC1 targets a network group named NG1 that uses dynamic membership, and SAC1 is deployed to East US. NG1 currently contains ten virtual networks in East US.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance Azure Virtual Network Manager nommée NM1. Une configuration d'administration de la sécurité nommée SAC1 cible un groupe réseau nommé NG1 à appartenance dynamique, et SAC1 est déployée dans East US. NG1 contient actuellement dix réseaux virtuels dans East US.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a new virtual network in East US matches the condition of NG1, you must redeploy SAC1 before its rules apply to that virtual network.
        fr: Quand un nouveau réseau virtuel d'East US correspond à la condition de NG1, vous devez redéployer SAC1 avant que ses règles s'appliquent à ce réseau virtuel.
    - id: s2
      text:
        en: To remove every configuration that NM1 deployed to East US, you can deploy None to East US.
        fr: Pour supprimer toutes les configurations que NM1 a déployées dans East US, vous pouvez déployer None dans East US.
    - id: s3
      text:
        en: The Deny rules of SAC1 are applied to the AzureBastionSubnet of the member virtual networks.
        fr: Les règles Deny de SAC1 sont appliquées au sous-réseau AzureBastionSubnet des réseaux virtuels membres.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |-
      Network group membership changes take effect without redeploying: a virtual network that joins a group with an active configuration in its region receives that configuration automatically. Each deployment defines the complete goal state of a region, and deploying None removes all configurations from it. Security admin rules aren't applied to subnets that contain Azure Bastion, Azure Firewall, VPN or ExpressRoute gateways, Azure Route Server or Virtual WAN; the other subnets still receive them.
    fr: |-
      Les changements d'appartenance à un groupe réseau prennent effet sans redéploiement : un réseau virtuel qui rejoint un groupe doté d'une configuration active dans sa région reçoit automatiquement cette configuration. Chaque déploiement définit l'état cible complet d'une région, et déployer None en supprime toutes les configurations. Les règles d'administration de la sécurité ne sont pas appliquées aux sous-réseaux qui contiennent Azure Bastion, le Pare-feu Azure, des passerelles VPN ou ExpressRoute, Azure Route Server ou Virtual WAN ; les autres sous-réseaux les reçoivent toujours.
references:
  - title: Manage configuration deployments in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-deployments
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
