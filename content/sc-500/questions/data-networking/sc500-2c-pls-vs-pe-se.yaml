id: sc500-2c-pls-vs-pe-se
objective: "2.3.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware provides a TCP-based reporting service to customers and also consumes Azure services. You need to choose the network feature for each requirement.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware fournit à ses clients un service de rapports basé sur TCP et consomme aussi des services Azure. Vous devez choisir la fonctionnalité réseau adaptée à chaque exigence.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pls, text: { en: "Private Link service", fr: "Service Private Link" } }
    - { id: pe, text: { en: "Private endpoint", fr: "Point de terminaison privé" } }
    - { id: se, text: { en: "Service endpoint", fr: "Point de terminaison de service" } }
    - { id: peer, text: { en: "Virtual network peering", fr: "Peering de réseaux virtuels" } }
    - { id: dnat, text: { en: "Azure Firewall DNAT rule", fr: "Règle DNAT du Pare-feu Azure" } }
  targets:
    - id: t-publish
      text: { en: "Proseware publishes the reporting service, which runs on VMs behind a Standard Load Balancer, to customer virtual networks in other tenants.", fr: "Proseware publie le service de rapports, exécuté sur des machines virtuelles derrière un Standard Load Balancer, vers des réseaux virtuels clients d'autres locataires." }
    - id: t-consume
      text: { en: "A customer reaches the published reporting service through a private IP address in its own virtual network.", fr: "Un client joint le service de rapports publié par une adresse IP privée de son propre réseau virtuel." }
    - id: t-storage
      text: { en: "A Proseware subnet reaches a storage account through the storage firewall, and the account keeps only its public endpoint.", fr: "Un sous-réseau de Proseware joint un compte de stockage par le pare-feu du stockage, et le compte ne conserve que son point de terminaison public." }
answer:
  mapping: { t-publish: pls, t-consume: pe, t-storage: se }
explanation:
  correct:
    en: The provider creates a Private Link service on the frontend of its Standard Load Balancer, and each consumer connects to it with a private endpoint in its own virtual network. A service endpoint keeps the public IP address of an Azure service and lets its firewall allow traffic from the subnet.
    fr: Le fournisseur crée un service Private Link sur le front-end de son Standard Load Balancer, et chaque consommateur s'y connecte avec un point de terminaison privé dans son propre réseau virtuel. Un point de terminaison de service conserve l'adresse IP publique d'un service Azure et permet à son pare-feu d'autoriser le trafic du sous-réseau.
  options:
    peer: { en: "Peering connects whole virtual networks, requires non-overlapping address spaces and does not publish a single service.", fr: "Le peering relie des réseaux virtuels entiers, exige des espaces d'adressage sans chevauchement et ne publie pas un service unique." }
    dnat: { en: "A DNAT rule publishes a service on a public IP address of the firewall, which is not private access.", fr: "Une règle DNAT publie un service sur une adresse IP publique du pare-feu, ce qui n'est pas un accès privé." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
