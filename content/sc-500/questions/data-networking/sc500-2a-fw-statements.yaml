id: sc500-2a-fw-statements
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a storage account named **stadatumlogs**. Public network access is set to **Enabled from selected networks**. The firewall has a virtual network rule for a subnet named **snet-ops**, and the exception **Allow Azure services on the trusted services list to access this storage account** is selected.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un compte de stockage nommé **stadatumlogs**. L'accès réseau public est défini sur **Enabled from selected networks**. Le pare-feu comporte une règle de réseau virtuel pour un sous-réseau nommé **snet-ops**, et l'exception **Allow Azure services on the trusted services list to access this storage account** est sélectionnée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If snet-ops is deleted and a new subnet named snet-ops is created in the same virtual network, the new subnet can access stadatumlogs without any change to the firewall.
        fr: |
          Si snet-ops est supprimé puis qu'un nouveau sous-réseau nommé snet-ops est créé dans le même réseau virtuel, le nouveau sous-réseau peut accéder à stadatumlogs sans aucune modification du pare-feu.
    - id: s2
      text:
        en: |
          If you set public network access to Disabled, the trusted services exception remains in effect.
        fr: |
          Si vous définissez l'accès réseau public sur Disabled, l'exception des services approuvés reste en vigueur.
    - id: s3
      text:
        en: |
          A SAS that specifies an allowed IP range lets its holder reach stadatumlogs from that range even if no firewall rule allows it.
        fr: |
          Une SAS qui spécifie une plage IP autorisée permet à son détenteur de joindre stadatumlogs depuis cette plage même si aucune règle de pare-feu ne l'autorise.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Deleting a subnet removes its virtual network rule, and a new subnet with the same name must be authorized again. When public network access is changed to Disabled, previously configured resource instances and exceptions, including trusted services, stay in effect because trusted service access takes precedence. An IP range in a SAS only restricts the token holder; it doesn't grant access beyond the network rules.
    fr: |
      Supprimer un sous-réseau supprime sa règle de réseau virtuel, et un nouveau sous-réseau du même nom doit être autorisé à nouveau. Quand l'accès réseau public passe à Disabled, les instances de ressources et exceptions configurées auparavant, y compris les services approuvés, restent en vigueur, car l'accès des services approuvés est prioritaire. Une plage IP dans une SAS ne fait que restreindre le détenteur du jeton ; elle n'accorde pas d'accès au-delà des règles réseau.
references:
  - title: Guidelines and limitations for the Azure Storage firewall
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
  - title: Firewall rules and network access control for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
