id: sc500-2b-ddb-classic-va-roles
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL Database logical server named **sql-hr**. SQL vulnerability assessment on sql-hr uses the **classic configuration** and stores its scan results in a storage account named **stvahr**.

    A user named Admin1 has the **SQL Security Manager** role on sql-hr. Admin1 must be able to change the vulnerability assessment settings of sql-hr. Admin1 has no role on stvahr.

    Which two additional role assignments should you grant Admin1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un serveur logique Azure SQL Database nommé **sql-hr**. L'évaluation des vulnérabilités SQL de sql-hr utilise la **configuration classique** et stocke ses résultats d'analyse dans un compte de stockage nommé **stvahr**.

    Un utilisateur nommé Admin1 dispose du rôle **SQL Security Manager** sur sql-hr. Admin1 doit pouvoir modifier les paramètres d'évaluation des vulnérabilités de sql-hr. Admin1 n'a aucun rôle sur stvahr.

    Quelles sont les deux attributions de rôle supplémentaires que vous devez accorder à Admin1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Storage Blob Data Reader on stvahr", fr: "Storage Blob Data Reader sur stvahr" } }
    - { id: b, text: { en: "Security Admin on the subscription", fr: "Security Admin sur l'abonnement" } }
    - { id: c, text: { en: "Owner on stvahr", fr: "Owner sur stvahr" } }
    - { id: d, text: { en: "Storage Account Key Operator Service Role on stvahr", fr: "Storage Account Key Operator Service Role sur stvahr" } }
    - { id: e, text: { en: "SQL Server Contributor on sql-hr", fr: "SQL Server Contributor sur sql-hr" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      With the classic configuration, scan results live in a storage account that you manage, so changing vulnerability assessment settings requires SQL Security Manager on the server, Storage Blob Data Reader on the storage account and Owner on the storage account. The express configuration removes the storage dependency and needs only SQL Security Manager or Security Admin.
    fr: |-
      Avec la configuration classique, les résultats d'analyse se trouvent dans un compte de stockage que vous gérez ; modifier les paramètres de l'évaluation des vulnérabilités exige donc SQL Security Manager sur le serveur, Storage Blob Data Reader sur le compte de stockage et Owner sur le compte de stockage. La configuration express supprime la dépendance au stockage et n'exige que SQL Security Manager ou Security Admin.
  options:
    b: { en: "Security Admin is enough for the express configuration, not for the classic configuration, which also needs rights on the storage account.", fr: "Security Admin suffit pour la configuration express, pas pour la configuration classique, qui exige aussi des droits sur le compte de stockage." }
    d: { en: "This role lets a principal list and regenerate account keys; it isn't one of the roles the classic configuration requires.", fr: "Ce rôle permet de lister et régénérer les clés du compte ; il ne fait pas partie des rôles exigés par la configuration classique." }
    e: { en: "SQL Server Contributor manages servers but doesn't give access to the storage account that holds the scan results.", fr: "SQL Server Contributor gère les serveurs mais ne donne pas accès au compte de stockage qui contient les résultats d'analyse." }
references:
  - title: Scan your Azure SQL databases for vulnerabilities
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/sql-azure-vulnerability-assessment-overview
