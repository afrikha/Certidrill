id: sc500-2a-sql-firewall-statements
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure SQL Database logical server named **sql-nw-sales** that hosts a database named **db-orders**. Public network access is set to **Selected networks**. The server has server-level IP firewall rules, and db-orders has database-level IP firewall rules.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un serveur logique Azure SQL Database nommé **sql-nw-sales** qui héberge une base de données nommée **db-orders**. L'accès réseau public est défini sur **Selected networks**. Le serveur comporte des règles de pare-feu IP au niveau du serveur, et db-orders comporte des règles de pare-feu IP au niveau de la base de données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          For a connection to db-orders, the database-level rules of db-orders are checked before the server-level rules.
        fr: |
          Pour une connexion à db-orders, les règles au niveau de la base de données de db-orders sont vérifiées avant les règles au niveau du serveur.
    - id: s2
      text:
        en: |
          After you set public network access to Disable, you can still create server-level IP firewall rules, and they take effect on the public endpoint.
        fr: |
          Après avoir défini l'accès réseau public sur Disable, vous pouvez toujours créer des règles de pare-feu IP au niveau du serveur, et elles prennent effet sur le point de terminaison public.
    - id: s3
      text:
        en: |
          If you select Allow Azure services and resources to access this server, resources in other customers' Azure subscriptions can reach the server through the firewall.
        fr: |
          Si vous sélectionnez Allow Azure services and resources to access this server, des ressources situées dans les abonnements Azure d'autres clients peuvent joindre le serveur à travers le pare-feu.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The firewall first checks the database-level rules of the target database, then the server-level rules; a connection that matches neither fails. With public network access disabled, only private endpoints can connect, and firewall rules can't be created or modified. Allowing Azure services creates the 0.0.0.0 rule, which admits connections from any Azure resource, including resources in other customers' subscriptions, so it must be combined with strong authentication or avoided.
    fr: |
      Le pare-feu vérifie d'abord les règles au niveau de la base de données cible, puis les règles au niveau du serveur ; une connexion qui ne correspond à aucune échoue. Avec l'accès réseau public désactivé, seuls les points de terminaison privés peuvent se connecter, et les règles de pare-feu ne peuvent être ni créées ni modifiées. Autoriser les services Azure crée la règle 0.0.0.0, qui admet les connexions de n'importe quelle ressource Azure, y compris dans les abonnements d'autres clients : il faut la combiner à une authentification forte ou l'éviter.
references:
  - title: Azure SQL Database IP firewall rules
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/firewall-configure
