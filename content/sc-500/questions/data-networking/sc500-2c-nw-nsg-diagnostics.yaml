id: sc500-2c-nw-nsg-diagnostics
objective: "2.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure Network Watcher to evaluate the security rules that apply to its workloads. You are reviewing the capabilities of NSG diagnostics.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Azure Network Watcher pour évaluer les règles de sécurité qui s'appliquent à ses charges de travail. Vous examinez les capacités des diagnostics NSG.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "NSG diagnostics evaluates only TCP and UDP flows.", fr: "Les diagnostics NSG n'évaluent que les flux TCP et UDP." } }
    - { id: b, text: { en: "NSG diagnostics can evaluate a flow whose source is a service tag.", fr: "Les diagnostics NSG peuvent évaluer un flux dont la source est une étiquette de service." } }
    - { id: c, text: { en: "NSG diagnostics ignores the security admin rules of Azure Virtual Network Manager.", fr: "Les diagnostics NSG ignorent les règles d'administration de la sécurité d'Azure Virtual Network Manager." } }
    - { id: d, text: { en: "NSG diagnostics can evaluate flows to the network interfaces of a virtual machine scale set.", fr: "Les diagnostics NSG peuvent évaluer des flux vers les cartes réseau d'un groupe de machines virtuelles identiques." } }
    - { id: e, text: { en: "NSG diagnostics supports Application Gateway v1 but not Application Gateway v2.", fr: "Les diagnostics NSG prennent en charge Application Gateway v1 mais pas Application Gateway v2." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: NSG diagnostics accepts an IPv4 address, a CIDR range or a service tag as the source, and supports virtual machines, network interfaces, virtual machine scale set network interfaces and Application Gateway v2. It returns a result for each set of rules, including the Virtual Network Manager security admin rules, and lets you add a security rule from the result.
    fr: Les diagnostics NSG acceptent comme source une adresse IPv4, une plage CIDR ou une étiquette de service, et prennent en charge les machines virtuelles, les cartes réseau, les cartes réseau de groupes de machines virtuelles identiques et Application Gateway v2. Ils renvoient un résultat pour chaque ensemble de règles, y compris les règles d'administration de la sécurité de Virtual Network Manager, et permettent d'ajouter une règle de sécurité à partir du résultat.
  options:
    a: { en: "NSG diagnostics also supports ICMP and Any; the TCP and UDP limit applies to IP flow verify.", fr: "Les diagnostics NSG prennent aussi en charge l'ICMP et Any ; la limite TCP et UDP s'applique à la vérification des flux IP." }
    c: { en: "The results include the security admin rules (GlobalRules) next to the NSGs.", fr: "Les résultats incluent les règles d'administration de la sécurité (GlobalRules) à côté des NSG." }
    e: { en: "NSG diagnostics supports Application Gateway v2, except private deployments.", fr: "Les diagnostics NSG prennent en charge Application Gateway v2, sauf les déploiements privés." }
references:
  - title: NSG diagnostics overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-diagnostics-overview
  - title: Diagnose network security rules
    url: https://learn.microsoft.com/en-us/azure/network-watcher/diagnose-network-security-rules
