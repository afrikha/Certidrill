id: sc500-2a-policy-revoke
objective: "2.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a storage account named **stwingtipcat**. Partners read blobs in a container named **catalog** by using service SAS tokens that reference a stored access policy named **partners-read** on the container. Internal apps use the account keys.

    The partnership ends today. You need to revoke every SAS token associated with partners-read. The solution must not affect the internal apps.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un compte de stockage nommé **stwingtipcat**. Des partenaires lisent les objets blob d'un conteneur nommé **catalog** avec des jetons SAS de service qui référencent une stratégie d'accès stockée nommée **partners-read** sur le conteneur. Les applications internes utilisent les clés du compte.

    Le partenariat prend fin aujourd'hui. Vous devez révoquer tous les jetons SAS associés à partners-read. La solution ne doit pas affecter les applications internes.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Delete the partners-read stored access policy.", fr: "Supprimer la stratégie d'accès stockée partners-read." } }
    - { id: b, text: { en: "Revoke the user delegation keys of stwingtipcat.", fr: "Révoquer les clés de délégation d'utilisateur de stwingtipcat." } }
    - { id: c, text: { en: "Set the expiry time of partners-read to a time in the past.", fr: "Définir l'heure d'expiration de partners-read sur une date passée." } }
    - { id: d, text: { en: "Set Allow storage account key access to Disabled on stwingtipcat.", fr: "Définir Allow storage account key access sur Disabled sur stwingtipcat." } }
    - { id: e, text: { en: "Change the access level of the catalog container to Private.", fr: "Changer le niveau d'accès du conteneur catalog en Private." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A service SAS that references a stored access policy inherits its start time, expiry and permissions. Deleting the policy, or setting its expiry in the past, revokes every SAS associated with it without touching the account keys; the change takes effect within about 30 seconds.
    fr: |
      Une SAS de service qui référence une stratégie d'accès stockée en hérite l'heure de début, l'expiration et les autorisations. Supprimer la stratégie, ou définir son expiration dans le passé, révoque toutes les SAS associées sans toucher aux clés du compte ; la modification s'applique en 30 secondes environ.
  options:
    b:
      en: |
        User delegation keys sign user delegation SAS, not service SAS.
      fr: |
        Les clés de délégation d'utilisateur signent les SAS de délégation d'utilisateur, pas les SAS de service.
    d:
      en: |
        Disallowing Shared Key would block the partners, but also the internal apps that use the account keys.
      fr: |
        Interdire la clé partagée bloquerait les partenaires, mais aussi les applications internes qui utilisent les clés du compte.
    e:
      en: |
        The container access level controls anonymous access only; SAS requests are authorized and aren't affected.
      fr: |
        Le niveau d'accès du conteneur ne contrôle que l'accès anonyme ; les requêtes SAS sont autorisées et ne sont pas affectées.
references:
  - title: Define a stored access policy
    url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
