id: sc500-2a-sas-account-leak
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a storage account named **stfabops**. A script created an account SAS for the Blob and Queue services that is valid for 30 days. The SAS was signed with **key1**. Production apps use connection strings that contain **key2**.

    The SAS was leaked. You need to revoke it without interrupting the production apps.

    What should you do?
  fr: |
    Fabrikam dispose d'un compte de stockage nommé **stfabops**. Un script a créé une SAS de compte pour les services Blob et Queue, valide 30 jours. La SAS a été signée avec **key1**. Les applications de production utilisent des chaînes de connexion qui contiennent **key2**.

    La SAS a fuité. Vous devez la révoquer sans interrompre les applications de production.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the stored access policy that the account SAS references.", fr: "Supprimer la stratégie d'accès stockée référencée par la SAS de compte." } }
    - { id: b, text: { en: "Regenerate key1 of stfabops.", fr: "Régénérer key1 de stfabops." } }
    - { id: c, text: { en: "Regenerate key2 of stfabops.", fr: "Régénérer key2 de stfabops." } }
    - { id: d, text: { en: "Revoke the user delegation keys of stfabops.", fr: "Révoquer les clés de délégation d'utilisateur de stfabops." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An account SAS can't be associated with a stored access policy, so the only way to revoke it before it expires is to regenerate the account key that signed it. Regenerating key1 invalidates the leaked SAS, and the apps that use key2 keep working.
    fr: |
      Une SAS de compte ne peut pas être associée à une stratégie d'accès stockée : le seul moyen de la révoquer avant son expiration est de régénérer la clé de compte qui l'a signée. Régénérer key1 invalide la SAS divulguée, et les applications qui utilisent key2 continuent de fonctionner.
  options:
    a:
      en: |
        Stored access policies work only with service SAS; an account SAS can't reference one.
      fr: |
        Les stratégies d'accès stockées ne fonctionnent qu'avec les SAS de service ; une SAS de compte ne peut pas en référencer.
    c:
      en: |
        key2 didn't sign the SAS, and regenerating it would break the production apps.
      fr: |
        key2 n'a pas signé la SAS, et la régénérer casserait les applications de production.
    d:
      en: |
        User delegation keys sign user delegation SAS only; an account SAS is signed with an account key.
      fr: |
        Les clés de délégation d'utilisateur ne signent que les SAS de délégation d'utilisateur ; une SAS de compte est signée avec une clé de compte.
references:
  - title: Grant limited access to Azure Storage resources using shared access signatures (SAS)
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
