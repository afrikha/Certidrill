id: sc500-2a-def-statements
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. enables the current Defender for Storage plan at the subscription level with malware scanning and sensitive data threat detection turned on. No diagnostic settings exist on the storage accounts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. active le plan Defender for Storage actuel au niveau de l'abonnement, avec l'analyse des programmes malveillants et la détection des menaces sur les données sensibles activées. Aucun paramètre de diagnostic n'existe sur les comptes de stockage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Activity monitoring raises alerts on suspicious access only after you create a diagnostic setting on each storage account.
        fr: |
          La surveillance de l'activité ne déclenche des alertes sur les accès suspects qu'après la création d'un paramètre de diagnostic sur chaque compte de stockage.
    - id: s2
      text:
        en: |
          Sensitive data threat detection adds no charge on top of the plan.
        fr: |
          La détection des menaces sur les données sensibles n'ajoute aucun coût au plan.
    - id: s3
      text:
        en: |
          The blob index tags written by malware scanning can't be changed by a user who has write access to the blob.
        fr: |
          Les balises d'index de blob écrites par l'analyse des programmes malveillants ne peuvent pas être modifiées par un utilisateur disposant d'un accès en écriture à l'objet blob.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Activity monitoring is agentless and analyzes data plane and control plane telemetry without requiring resource logs. Sensitive data threat detection is included at no additional cost and can be turned off. Index tags aren't tamper-resistant, so they shouldn't be the only control that decides whether a blob is safe.
    fr: |
      La surveillance de l'activité est sans agent et analyse la télémétrie du plan de données et du plan de contrôle sans exiger de journaux de ressources. La détection des menaces sur les données sensibles est incluse sans coût supplémentaire et peut être désactivée. Les balises d'index ne résistent pas à la falsification : elles ne doivent pas être le seul contrôle qui décide si un objet blob est sûr.
references:
  - title: What is Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
  - title: Introduction to malware scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-malware-scan
