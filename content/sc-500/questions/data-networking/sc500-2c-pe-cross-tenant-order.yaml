id: sc500-2c-pe-cross-tenant-order
objective: "2.3.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso owns a storage account named **stcontososhare** in its Microsoft Entra tenant. An application of Fabrikam, a partner with its own tenant, runs in a virtual network named **VNet-Fab** and reads blobs from stcontososhare through the public endpoint. Fabrikam administrators have no permissions on stcontososhare.

    VNet-Fab uses Azure-provided DNS, no private DNS zone is linked to it, and the application uses no other storage account.

    Contoso must disable public network access to stcontososhare. The Fabrikam application must keep its access without any interruption.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso possède un compte de stockage nommé **stcontososhare** dans son locataire Microsoft Entra. Une application de Fabrikam, un partenaire qui a son propre locataire, s'exécute dans un réseau virtuel nommé **VNet-Fab** et lit des objets blob de stcontososhare par le point de terminaison public. Les administrateurs de Fabrikam n'ont aucune autorisation sur stcontososhare.

    VNet-Fab utilise le DNS fourni par Azure, aucune zone DNS privée ne lui est liée, et l'application n'utilise aucun autre compte de stockage.

    Contoso doit désactiver l'accès au réseau public de stcontososhare. L'application de Fabrikam doit conserver son accès sans aucune interruption.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: pe, text: { en: "A Fabrikam administrator creates in VNet-Fab a private endpoint for the blob sub-resource of stcontososhare by using its resource ID, without DNS integration.", fr: "Un administrateur de Fabrikam crée dans VNet-Fab un point de terminaison privé pour la sous-ressource blob de stcontososhare à l'aide de son ID de ressource, sans intégration DNS." } }
    - { id: approve, text: { en: "A Contoso administrator approves the pending private endpoint connection on stcontososhare.", fr: "Un administrateur de Contoso approuve la connexion de point de terminaison privé en attente sur stcontososhare." } }
    - { id: dns, text: { en: "A Fabrikam administrator creates the privatelink.blob.core.windows.net zone with an A record for stcontososhare and links it to VNet-Fab.", fr: "Un administrateur de Fabrikam crée la zone privatelink.blob.core.windows.net avec un enregistrement A pour stcontososhare et la lie à VNet-Fab." } }
    - { id: disable, text: { en: "A Contoso administrator sets the public network access of stcontososhare to Disabled.", fr: "Un administrateur de Contoso règle l'accès au réseau public de stcontososhare sur Disabled." } }
    - { id: auto, text: { en: "A Contoso administrator adds the Fabrikam subscription to the auto-approval list of stcontososhare.", fr: "Un administrateur de Contoso ajoute l'abonnement de Fabrikam à la liste d'approbation automatique de stcontososhare." } }
    - { id: pls, text: { en: "A Contoso administrator creates a Private Link service for stcontososhare and sends its alias to Fabrikam.", fr: "Un administrateur de Contoso crée un service Private Link pour stcontososhare et envoie son alias à Fabrikam." } }
answer:
  sequence: [ pe, approve, dns, disable ]
explanation:
  correct:
    en: |
      Without permissions on the resource, Fabrikam creates the private endpoint with a manual request, and the connection stays Pending until Contoso approves it; only Approved connections carry traffic. Fabrikam switches name resolution to the private IP address only after approval, otherwise the application would resolve to an endpoint that does not carry traffic yet. Contoso disables public network access last, when the application already uses the private endpoint.
    fr: |
      Sans autorisation sur la ressource, Fabrikam crée le point de terminaison privé avec une demande manuelle, et la connexion reste En attente jusqu'à ce que Contoso l'approuve ; seules les connexions approuvées transportent du trafic. Fabrikam ne bascule la résolution de noms vers l'adresse IP privée qu'après l'approbation, sinon l'application résoudrait vers un point de terminaison qui ne transporte pas encore de trafic. Contoso désactive l'accès au réseau public en dernier, quand l'application utilise déjà le point de terminaison privé.
  options:
    auto: { en: "Auto-approval lists are a setting of a Private Link service, not of an Azure Storage account.", fr: "Les listes d'approbation automatique sont un paramètre d'un service Private Link, pas d'un compte Stockage Azure." }
    pls: { en: "A Private Link service publishes a service behind a Standard Load Balancer; a storage account already supports private endpoints directly.", fr: "Un service Private Link publie un service derrière un Standard Load Balancer ; un compte de stockage prend déjà directement en charge les points de terminaison privés." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
