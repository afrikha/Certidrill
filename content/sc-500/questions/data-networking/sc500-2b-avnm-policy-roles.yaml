id: sc500-2b-avnm-policy-roles
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Virtual Network Manager instance named NM1 whose scope is the management group MG1. NM1 contains a network group named NG-Prod.

    A user named NetAdmin1 must define the dynamic membership of NG-Prod so that every virtual network tagged `env=prod` under MG1 joins NG-Prod automatically. You must follow the principle of least privilege and use built-in roles.

    Which two role assignments should you grant NetAdmin1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance Azure Virtual Network Manager nommée NM1 dont l'étendue est le groupe d'administration MG1. NM1 contient un groupe réseau nommé NG-Prod.

    Un utilisateur nommé NetAdmin1 doit définir l'appartenance dynamique de NG-Prod pour que chaque réseau virtuel portant l'étiquette `env=prod` sous MG1 rejoigne automatiquement NG-Prod. Vous devez respecter le principe du moindre privilège et utiliser des rôles intégrés.

    Quelles sont les deux attributions de rôle que vous devez accorder à NetAdmin1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Network Contributor on NG-Prod", fr: "Network Contributor sur NG-Prod" } }
    - { id: b, text: { en: "Security Admin on MG1", fr: "Security Admin sur MG1" } }
    - { id: c, text: { en: "Resource Policy Contributor on MG1", fr: "Resource Policy Contributor sur MG1" } }
    - { id: d, text: { en: "Reader on NM1", fr: "Reader sur NM1" } }
    - { id: e, text: { en: "User Access Administrator on MG1", fr: "User Access Administrator sur MG1" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      Dynamic membership is implemented by an Azure Policy definition and assignment with the addToNetworkGroup effect. The user needs the join action on the target network group, which Network Contributor provides, and permission to write policy definitions and assignments at the target scope, which Resource Policy Contributor provides.
    fr: |-
      L'appartenance dynamique est implémentée par une définition et une attribution Azure Policy avec l'effet addToNetworkGroup. L'utilisateur a besoin de l'action join sur le groupe réseau cible, que fournit Network Contributor, et du droit d'écrire des définitions et des attributions de stratégie sur l'étendue cible, que fournit Resource Policy Contributor.
  options:
    b: { en: "Security Admin manages Defender for Cloud security policies and alerts; it doesn't grant the network group join action.", fr: "Security Admin gère les stratégies de sécurité et les alertes de Defender for Cloud ; il n'accorde pas l'action join sur le groupe réseau." }
    d: { en: "Reader can view NM1 but can't add members to a network group.", fr: "Reader peut consulter NM1 mais ne peut pas ajouter de membres à un groupe réseau." }
    e: { en: "User Access Administrator manages role assignments, not policy definitions or network groups.", fr: "User Access Administrator gère les attributions de rôle, pas les définitions de stratégie ni les groupes réseau." }
references:
  - title: Configuring network groups with Azure Policy in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-azure-policy-integration
