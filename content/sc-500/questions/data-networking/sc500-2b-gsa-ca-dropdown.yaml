id: sc500-2b-gsa-ca-dropdown
objective: "2.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has published an internal trading app through a Global Secure Access app named **App-Trading** in Microsoft Entra Private Access. Users are assigned to App-Trading, and the connector group is active.

    Access to App-Trading must require multifactor authentication and a compliant device, and remote users' devices must tunnel the traffic to the app.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a publié une application interne de trading par une application Global Secure Access nommée **App-Trading** dans Microsoft Entra Private Access. Des utilisateurs sont attribués à App-Trading, et le groupe de connecteurs est actif.

    L'accès à App-Trading doit exiger l'authentification multifacteur et un appareil conforme, et les appareils des utilisateurs distants doivent faire passer le trafic vers l'application dans le tunnel.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create the Conditional Access policy as a user with the role [[role]], from Global Secure Access > Applications > Enterprise applications > App-Trading > Conditional Access, so that App-Trading is the [[target]].

      In Global Secure Access > Connect > Traffic forwarding, turn on [[profile]].
    fr: |
      Créer la stratégie d'accès conditionnel avec un utilisateur doté du rôle [[role]], depuis Global Secure Access > Applications > Enterprise applications > App-Trading > Conditional Access, pour qu'App-Trading soit [[target]].

      Dans Global Secure Access > Connect > Traffic forwarding, activer [[profile]].
  slots:
    - id: role
      options:
        - { id: caa, text: Conditional Access Administrator }
        - { id: appadm, text: Application Administrator }
        - { id: secread, text: Security Reader }
    - id: target
      options:
        - { id: res, text: { en: "target resource of the policy", fr: "la ressource cible de la stratégie" } }
        - { id: cond, text: { en: "client app condition of the policy", fr: "la condition d'application cliente de la stratégie" } }
        - { id: sess, text: { en: "session control of the policy", fr: "le contrôle de session de la stratégie" } }
    - id: profile
      options:
        - { id: priv, text: { en: "the Private access profile", fr: "le profil Private access" } }
        - { id: m365, text: { en: "the Microsoft traffic profile", fr: "le profil de trafic Microsoft" } }
        - { id: inet, text: { en: "the Internet access profile", fr: "le profil Internet access" } }
answer:
  values: { role: caa, target: res, profile: priv }
explanation:
  correct:
    en: |-
      Conditional Access policies for Private Access are created by at least a Conditional Access Administrator. Starting from the app's Conditional Access page adds App-Trading automatically as the policy's target resource, and you then set the grant controls (MFA, compliant device). The Private access traffic forwarding profile must be on for the Global Secure Access client to tunnel private traffic.
    fr: |-
      Les stratégies d'accès conditionnel pour Private Access sont créées au minimum par un Conditional Access Administrator. Partir de la page Conditional Access de l'application ajoute automatiquement App-Trading comme ressource cible de la stratégie ; vous définissez ensuite les contrôles d'octroi (MFA, appareil conforme). Le profil de transfert du trafic Private access doit être activé pour que le client Global Secure Access fasse passer le trafic privé dans le tunnel.
  options:
    appadm: { en: "Application Administrator manages the Private Access apps, not Conditional Access policies.", fr: "Application Administrator gère les applications Private Access, pas les stratégies d'accès conditionnel." }
    secread: { en: "Security Reader can only read; it can't create policies.", fr: "Security Reader ne peut que lire ; il ne peut pas créer de stratégies." }
    cond: { en: "Client apps describe the kind of client software; the app is selected as a target resource.", fr: "Les applications clientes décrivent le type de logiciel client ; l'application se sélectionne comme ressource cible." }
    sess: { en: "Session controls shape the session after sign-in; MFA and device compliance are grant controls on the targeted app.", fr: "Les contrôles de session agissent sur la session après connexion ; la MFA et la conformité de l'appareil sont des contrôles d'octroi sur l'application ciblée." }
    m365: { en: "The Microsoft traffic profile forwards Microsoft 365 traffic, not private apps.", fr: "Le profil de trafic Microsoft transfère le trafic Microsoft 365, pas les applications privées." }
    inet: { en: "The Internet access profile forwards internet traffic for Internet Access, not private apps.", fr: "Le profil Internet access transfère le trafic Internet d'Internet Access, pas les applications privées." }
references:
  - title: Apply Conditional Access policies to Private Access apps
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-target-resource-private-access-apps
  - title: Manage Private Access traffic forwarding profiles
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-manage-private-access-profile
