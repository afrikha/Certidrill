id: sc500-2b-vwan-policy-dragdrop
objective: "2.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware has two secured virtual hubs in a Standard Azure Virtual WAN. Each hub has an Azure Firewall, site-to-site VPN branches, point-to-site VPN users and spoke virtual networks. You are configuring routing intent on both hubs.

    Which routing policy inspects each traffic flow? To answer, drag the appropriate policies to the correct traffic flows. Each policy may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose de deux hubs virtuels sécurisés dans un Azure Virtual WAN Standard. Chaque hub a un Pare-feu Azure, des branches VPN site à site, des utilisateurs VPN point à site et des réseaux virtuels spoke. Vous configurez l'intention de routage sur les deux hubs.

    Quelle stratégie de routage inspecte chaque flux de trafic ? Pour répondre, faites glisser les stratégies appropriées vers les flux de trafic correspondants. Chaque stratégie peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: priv, text: { en: "Private traffic policy", fr: "Stratégie Trafic privé" } }
    - { id: inet, text: { en: "Internet traffic policy", fr: "Stratégie Trafic Internet" } }
    - { id: crt, text: { en: "Custom route table", fr: "Table de routage personnalisée" } }
  targets:
    - id: t1
      text: { en: "A branch office to another branch office", fr: "D'une succursale vers une autre succursale" }
    - id: t2
      text: { en: "A spoke virtual network to a SaaS website on the internet", fr: "D'un réseau virtuel spoke vers un site web SaaS sur Internet" }
    - id: t3
      text: { en: "A spoke of the first hub to a spoke of the second hub", fr: "D'un spoke du premier hub vers un spoke du second hub" }
    - id: t4
      text: { en: "A point-to-site VPN user to the internet", fr: "D'un utilisateur VPN point à site vers Internet" }
answer:
  mapping: { t1: priv, t2: inet, t3: priv, t4: inet }
explanation:
  correct:
    en: |-
      The Private traffic policy applies to branch-to-branch, branch-to-virtual network, virtual network-to-virtual network and inter-hub traffic. The Internet traffic policy applies to internet-bound traffic from branches, including point-to-site and site-to-site VPN and ExpressRoute, and from virtual networks. Custom route tables can't be used with routing intent.
    fr: |-
      La stratégie Trafic privé s'applique au trafic de branche à branche, de branche à réseau virtuel, de réseau virtuel à réseau virtuel et entre hubs. La stratégie Trafic Internet s'applique au trafic à destination d'Internet des branches, y compris le VPN point à site, le VPN site à site et ExpressRoute, ainsi que des réseaux virtuels. Les tables de routage personnalisées ne peuvent pas être utilisées avec l'intention de routage.
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
