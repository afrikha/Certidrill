id: sc500-2c-fw-forced-tunnel
objective: "2.3.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An Azure Firewall Standard named **fw-core** is deployed in a virtual network named VNet-Hub. fw-core was deployed without the Firewall Management NIC. VNet-Hub also contains a VPN gateway connected to the on-premises network.

    Security requires all the internet-bound traffic that leaves fw-core to be sent to an on-premises network virtual appliance for inspection. The on-premises network does not advertise a default route through BGP. You can stop fw-core during a maintenance window, but you must not delete and redeploy it.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Pare-feu Azure Standard nommé **fw-core** est déployé dans un réseau virtuel nommé VNet-Hub. fw-core a été déployé sans la carte réseau de gestion du pare-feu (Firewall Management NIC). VNet-Hub contient aussi une passerelle VPN connectée au réseau local.

    La sécurité exige que tout le trafic à destination d'Internet qui sort de fw-core soit envoyé à une appliance virtuelle réseau locale pour inspection. Le réseau local n'annonce pas d'itinéraire par défaut par BGP. Vous pouvez arrêter fw-core pendant une fenêtre de maintenance, mais vous ne devez pas le supprimer ni le redéployer.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create a subnet named AzureFirewallManagementSubnet with a /26 prefix in VNet-Hub.", fr: "Créer dans VNet-Hub un sous-réseau nommé AzureFirewallManagementSubnet avec un préfixe /26." } }
    - { id: b, text: { en: "Associate with AzureFirewallManagementSubnet a route for 0.0.0.0/0 to the virtual network gateway.", fr: "Associer à AzureFirewallManagementSubnet un itinéraire 0.0.0.0/0 vers la passerelle de réseau virtuel." } }
    - { id: c, text: { en: "Stop fw-core, and then start it with a management public IP address.", fr: "Arrêter fw-core, puis le démarrer avec une adresse IP publique de gestion." } }
    - { id: d, text: { en: "Associate with AzureFirewallSubnet a route for 0.0.0.0/0 to the virtual network gateway.", fr: "Associer à AzureFirewallSubnet un itinéraire 0.0.0.0/0 vers la passerelle de réseau virtuel." } }
    - { id: e, text: { en: "Upgrade fw-core to the Premium SKU.", fr: "Mettre à niveau fw-core vers la référence SKU Premium." } }
    - { id: f, text: { en: "Enable DNS proxy in the firewall policy of fw-core.", fr: "Activer le proxy DNS dans la stratégie de pare-feu de fw-core." } }
answer: { optionIds: [ a, c, d ] }
explanation:
  correct:
    en: Forced tunneling requires the Firewall Management NIC, which uses AzureFirewallManagementSubnet (at least /26) and a dedicated management public IP address. For an existing Standard firewall, you stop it and start it again with the management public IP address instead of redeploying it. A default route on AzureFirewallSubnet with the VPN gateway as next hop then sends the internet-bound traffic to the on-premises appliance.
    fr: Le tunneling forcé exige la carte réseau de gestion du pare-feu, qui utilise AzureFirewallManagementSubnet (au moins /26) et une adresse IP publique de gestion dédiée. Pour un pare-feu Standard existant, vous l'arrêtez puis le redémarrez avec l'adresse IP publique de gestion au lieu de le redéployer. Un itinéraire par défaut sur AzureFirewallSubnet avec la passerelle VPN comme tronçon suivant envoie ensuite le trafic à destination d'Internet vers l'appliance locale.
  options:
    b: { en: "The management subnet must keep a default route to the internet, with gateway route propagation disabled; redirecting it would disrupt the service.", fr: "Le sous-réseau de gestion doit conserver un itinéraire par défaut vers Internet, avec la propagation des itinéraires de passerelle désactivée ; le rediriger perturberait le service." }
    e: { en: "Forced tunneling does not require the Premium SKU.", fr: "Le tunneling forcé n'exige pas la référence SKU Premium." }
    f: { en: "DNS proxy is used for FQDN filtering in network rules, not for forced tunneling.", fr: "Le proxy DNS sert au filtrage par FQDN dans les règles de réseau, pas au tunneling forcé." }
references:
  - title: Azure Firewall Management NIC
    url: https://learn.microsoft.com/en-us/azure/firewall/management-nic
  - title: Azure Firewall forced tunneling
    url: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling
