id: sc500-2b-ddb-oss-coverage
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has the following databases.

    | Name | Service | Location |
    | --- | --- | --- |
    | mysql-web | Azure Database for MySQL flexible server | Azure subscription Sub1 |
    | pg-legacy | PostgreSQL 15 installed on a Windows server enabled by Azure Arc | On-premises datacenter |
    | rds-billing | Amazon RDS for MariaDB | AWS account connected to Defender for Cloud |

    You turn on Microsoft Defender for open-source relational databases for Sub1, for the Azure Arc resources, and for the AWS connector.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose des bases de données suivantes.

    | Nom | Service | Emplacement |
    | --- | --- | --- |
    | mysql-web | Serveur flexible Azure Database for MySQL | Abonnement Azure Sub1 |
    | pg-legacy | PostgreSQL 15 installé sur un serveur Windows activé par Azure Arc | Centre de données local |
    | rds-billing | Amazon RDS for MariaDB | Compte AWS connecté à Defender for Cloud |

    Vous activez Microsoft Defender for open-source relational databases pour Sub1, pour les ressources Azure Arc et pour le connecteur AWS.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Defender for Cloud can raise brute-force alerts for mysql-web.
        fr: Defender for Cloud peut générer des alertes de force brute pour mysql-web.
    - id: s2
      text:
        en: Defender for Cloud can raise brute-force alerts for pg-legacy.
        fr: Defender for Cloud peut générer des alertes de force brute pour pg-legacy.
    - id: s3
      text:
        en: Defender for Cloud can raise brute-force alerts for rds-billing.
        fr: Defender for Cloud peut générer des alertes de force brute pour rds-billing.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |-
      The open-source relational databases plan supports Azure Database for PostgreSQL and MySQL flexible servers (all pricing tiers) and, in AWS, Amazon RDS for PostgreSQL, MySQL and MariaDB plus Aurora PostgreSQL and MySQL. It is supported only on PaaS environments in Azure and AWS, not on Azure Arc-enabled machines, so a PostgreSQL engine installed on an Arc-enabled server gets no alerts from this plan.
    fr: |-
      Le plan des bases de données relationnelles open source prend en charge les serveurs flexibles Azure Database for PostgreSQL et MySQL (tous les niveaux tarifaires) et, dans AWS, Amazon RDS for PostgreSQL, MySQL et MariaDB ainsi qu'Aurora PostgreSQL et MySQL. Il n'est pris en charge que sur les environnements PaaS d'Azure et d'AWS, pas sur les machines activées par Azure Arc ; un moteur PostgreSQL installé sur un serveur activé par Arc ne reçoit donc aucune alerte de ce plan.
references:
  - title: Overview of Microsoft Defender for Open-Source Relational Databases
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-databases-introduction
