id: sc500-2b-avnm-actions-exhibit
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A virtual network named VNet1 is a member of a network group targeted by a deployed security admin configuration that contains the following inbound rules.

    | Priority | Action | Protocol and port | Source |
    | --- | --- | --- | --- |
    | 100 | Deny | TCP 3389 | Internet |
    | 200 | Always Allow | TCP 22 | 10.20.0.0/16 |
    | 300 | Allow | TCP 443 | Any |

    A virtual machine named VM1 in VNet1 has a public IP address. The NSG of its subnet contains these custom inbound rules: priority 100 denies TCP 22 from 10.20.0.0/16, priority 110 denies TCP 443 from Internet, and priority 120 allows TCP 3389 from Internet. The network 10.20.0.0/16 is connected to VNet1 through a VPN gateway.

    Which connection to VM1 succeeds?
  fr: |
    Un réseau virtuel nommé VNet1 est membre d'un groupe réseau ciblé par une configuration d'administration de la sécurité déployée qui contient les règles de trafic entrant suivantes.

    | Priorité | Action | Protocole et port | Source |
    | --- | --- | --- | --- |
    | 100 | Deny | TCP 3389 | Internet |
    | 200 | Always Allow | TCP 22 | 10.20.0.0/16 |
    | 300 | Allow | TCP 443 | Any |

    Une machine virtuelle nommée VM1 dans VNet1 possède une adresse IP publique. Le NSG de son sous-réseau contient ces règles de trafic entrant personnalisées : la priorité 100 refuse TCP 22 depuis 10.20.0.0/16, la priorité 110 refuse TCP 443 depuis Internet, et la priorité 120 autorise TCP 3389 depuis Internet. Le réseau 10.20.0.0/16 est connecté à VNet1 par une passerelle VPN.

    Quelle connexion vers VM1 aboutit ?
body:
  options:
    - { id: a, text: { en: "SSH from 10.20.4.15", fr: "SSH depuis 10.20.4.15" } }
    - { id: b, text: { en: "HTTPS from 203.0.113.10", fr: "HTTPS depuis 203.0.113.10" } }
    - { id: c, text: { en: "RDP from 203.0.113.10", fr: "RDP depuis 203.0.113.10" } }
    - { id: d, text: { en: "SSH from 203.0.113.10", fr: "SSH depuis 203.0.113.10" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Security admin rules are evaluated before NSGs. Always Allow delivers SSH from 10.20.0.0/16 directly and stops evaluation, so the NSG deny at priority 100 never applies. Allow for HTTPS passes the traffic on to the NSG, which denies it from Internet. Deny for RDP ends evaluation before the NSG allow rule is reached.
    fr: |-
      Les règles d'administration de la sécurité sont évaluées avant les NSG. Always Allow livre directement le SSH depuis 10.20.0.0/16 et arrête l'évaluation : le refus du NSG de priorité 100 ne s'applique jamais. Allow pour HTTPS transmet le trafic au NSG, qui le refuse depuis Internet. Deny pour RDP met fin à l'évaluation avant la règle d'autorisation du NSG.
  options:
    b: { en: "An Allow security admin rule hands the traffic to the NSG, and the NSG rule at priority 110 denies HTTPS from Internet.", fr: "Une règle d'administration de la sécurité Allow transmet le trafic au NSG, et la règle de priorité 110 du NSG refuse HTTPS depuis Internet." }
    c: { en: "The Deny security admin rule blocks the traffic; NSG rules are not evaluated, so the NSG allow rule has no effect.", fr: "La règle d'administration de la sécurité Deny bloque le trafic ; les règles du NSG ne sont pas évaluées, donc la règle d'autorisation du NSG n'a aucun effet." }
    d: { en: "No security admin rule matches, and in the NSG no custom rule allows SSH from Internet, so DenyAllInbound blocks it.", fr: "Aucune règle d'administration de la sécurité ne correspond, et dans le NSG aucune règle personnalisée n'autorise SSH depuis Internet : DenyAllInbound le bloque." }
references:
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
