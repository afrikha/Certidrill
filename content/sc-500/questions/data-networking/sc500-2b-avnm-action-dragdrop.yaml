id: sc500-2b-avnm-action-dragdrop
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Azure Virtual Network Manager to enforce network access policies on all its spoke virtual networks. Application teams manage the NSGs of their own subnets.

    Which security admin rule action should you use for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise Azure Virtual Network Manager pour imposer des stratégies d'accès réseau à tous ses réseaux virtuels spoke. Les équipes applicatives gèrent les NSG de leurs propres sous-réseaux.

    Quelle action de règle d'administration de la sécurité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: allow, text: Allow }
    - { id: always, text: Always Allow }
    - { id: deny, text: Deny }
  targets:
    - id: t1
      text: { en: "Block inbound TCP 445 from Internet; no application team can reopen it", fr: "Bloquer TCP 445 en entrée depuis Internet ; aucune équipe applicative ne peut le rouvrir" }
    - id: t2
      text: { en: "Let the security scanners in 10.50.0.0/24 reach every VM, even if an NSG denies them", fr: "Permettre aux scanners de sécurité de 10.50.0.0/24 d'atteindre toutes les machines virtuelles, même si un NSG les refuse" }
    - id: t3
      text: { en: "Permit TCP 443 from the corporate range, but let application teams restrict it further in their NSGs", fr: "Permettre TCP 443 depuis la plage d'entreprise, tout en laissant les équipes applicatives le restreindre davantage dans leurs NSG" }
answer:
  mapping: { t1: deny, t2: always, t3: allow }
explanation:
  correct:
    en: |-
      Deny stops the traffic before any NSG is evaluated, so local NSG rules can't reopen the port. Always Allow delivers the traffic and ends evaluation, so NSG deny rules can't block the scanners. Allow permits the traffic at the virtual network level and then passes it to the NSGs, which can still deny it.
    fr: |-
      Deny arrête le trafic avant l'évaluation de tout NSG : les règles locales des NSG ne peuvent pas rouvrir le port. Always Allow livre le trafic et met fin à l'évaluation : les règles de refus des NSG ne peuvent pas bloquer les scanners. Allow autorise le trafic au niveau du réseau virtuel puis le transmet aux NSG, qui peuvent encore le refuser.
references:
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
