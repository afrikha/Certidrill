id: sc500-2a-audit-mi-tsql
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has an Azure SQL Managed Instance named **sqlmi-prose**. You created a container named **sqlmi-audit** in a storage account named **stproseaudit** and a credential for the container URL that contains a SAS token.

    You need to audit the failed sign-in attempts on sqlmi-prose and write the audit files to the container.

    How should you complete the T-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'une instance Azure SQL Managed Instance nommée **sqlmi-prose**. Vous avez créé un conteneur nommé **sqlmi-audit** dans un compte de stockage nommé **stproseaudit** et des informations d'identification pour l'URL du conteneur contenant un jeton SAS.

    Vous devez auditer les tentatives de connexion ayant échoué sur sqlmi-prose et écrire les fichiers d'audit dans le conteneur.

    Comment devez-vous compléter les instructions T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  template: |
    CREATE SERVER AUDIT [Audit-FailedLogins]
    TO [[dest]] (PATH = 'https://stproseaudit.blob.core.windows.net/sqlmi-audit', RETENTION_DAYS = 365);

    CREATE SERVER AUDIT SPECIFICATION [Spec-FailedLogins]
    FOR SERVER AUDIT [Audit-FailedLogins]
    ADD ([[grp]])
    WITH (STATE = ON);

    ALTER SERVER AUDIT [Audit-FailedLogins] WITH (STATE = ON);
  slots:
    - id: dest
      options:
        - { id: url, text: URL }
        - { id: ext, text: EXTERNAL_MONITOR }
        - { id: file, text: FILE }
    - id: grp
      options:
        - { id: failed, text: FAILED_LOGIN_GROUP }
        - { id: batch, text: BATCH_COMPLETED_GROUP }
        - { id: schema, text: SCHEMA_OBJECT_ACCESS_GROUP }
answer:
  values: { dest: url, grp: failed }
explanation:
  correct:
    en: |
      On SQL Managed Instance, an audit that writes to Azure Blob Storage uses TO URL with the container path, authenticated by the credential created for that URL. FAILED_LOGIN_GROUP records failed sign-in attempts to the instance.
    fr: |
      Sur SQL Managed Instance, un audit qui écrit dans Stockage Blob Azure utilise TO URL avec le chemin du conteneur, authentifié par les informations d'identification créées pour cette URL. FAILED_LOGIN_GROUP enregistre les tentatives de connexion ayant échoué à l'instance.
  options:
    ext: { en: "EXTERNAL_MONITOR sends events through a diagnostic setting to Log Analytics or Event Hubs, and it takes no PATH.", fr: "EXTERNAL_MONITOR envoie les événements par un paramètre de diagnostic vers Log Analytics ou Event Hubs, et il ne prend pas de PATH." }
    file: { en: "SQL Managed Instance writes audit files to Azure Blob Storage with TO URL; a local file target isn't available.", fr: "SQL Managed Instance écrit les fichiers d'audit dans Stockage Blob Azure avec TO URL ; une cible de fichier local n'est pas disponible." }
    batch: { en: "BATCH_COMPLETED_GROUP records completed batches, not failed sign-ins.", fr: "BATCH_COMPLETED_GROUP enregistre les lots terminés, pas les connexions ayant échoué." }
    schema: { en: "SCHEMA_OBJECT_ACCESS_GROUP records access to schema objects, not sign-in attempts.", fr: "SCHEMA_OBJECT_ACCESS_GROUP enregistre les accès aux objets de schéma, pas les tentatives de connexion." }
references:
  - title: Get started with Azure SQL Managed Instance auditing
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/auditing-configure
