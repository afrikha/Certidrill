id: sc500-2a-audit-mi-statements
objective: "2.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has an Azure SQL Managed Instance named **sqlmi-tailspin**. You plan to audit sign-in activity on sqlmi-tailspin by using T-SQL.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une instance Azure SQL Managed Instance nommée **sqlmi-tailspin**. Vous prévoyez d'auditer l'activité de connexion sur sqlmi-tailspin en T-SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          To write the audit to a blob container with TO URL, you first create a credential whose secret is a SAS token for the container.
        fr: |
          Pour écrire l'audit dans un conteneur d'objets blob avec TO URL, vous créez d'abord des informations d'identification dont le secret est un jeton SAS pour le conteneur.
    - id: s2
      text:
        en: |
          To send the audit events to a Log Analytics workspace, you must first stream them to Event Hubs.
        fr: |
          Pour envoyer les événements d'audit vers un espace de travail Log Analytics, vous devez d'abord les transmettre à Event Hubs.
    - id: s3
      text:
        en: |
          Setting RETENTION_DAYS = 0 in CREATE SERVER AUDIT keeps the audit files without a time limit.
        fr: |
          Définir RETENTION_DAYS = 0 dans CREATE SERVER AUDIT conserve les fichiers d'audit sans limite de durée.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      An audit TO URL authenticates to the container through a credential named after the container URL, with IDENTITY = 'SHARED ACCESS SIGNATURE' and the SAS token as the secret. For Log Analytics or Event Hubs, you add a diagnostic setting with the SQLSecurityAuditEvents category to the chosen destination and create the audit with TO EXTERNAL_MONITOR; Log Analytics doesn't require Event Hubs. RETENTION_DAYS = 0 means unlimited retention.
    fr: |
      Un audit TO URL s'authentifie auprès du conteneur par des informations d'identification nommées d'après l'URL du conteneur, avec IDENTITY = 'SHARED ACCESS SIGNATURE' et le jeton SAS comme secret. Pour Log Analytics ou Event Hubs, vous ajoutez un paramètre de diagnostic avec la catégorie SQLSecurityAuditEvents vers la destination choisie et créez l'audit avec TO EXTERNAL_MONITOR ; Log Analytics n'exige pas Event Hubs. RETENTION_DAYS = 0 signifie une rétention illimitée.
references:
  - title: Get started with Azure SQL Managed Instance auditing
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/auditing-configure
