id: sc500-2b-vwan-interhub
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Standard Azure Virtual WAN named VWAN1 with two hubs, Hub-WE in West Europe and Hub-NE in North Europe. Each hub is a secured virtual hub with an Azure Firewall, and each hub has spoke virtual networks connected to it. The hubs use only the default route tables.

    You need traffic between a spoke of Hub-WE and a spoke of Hub-NE to be inspected by the firewalls, with the least administrative effort.

    What should you do?
  fr: |
    Fabrikam dispose d'un Azure Virtual WAN Standard nommé VWAN1 avec deux hubs, Hub-WE en West Europe et Hub-NE en North Europe. Chaque hub est un hub virtuel sécurisé doté d'un Pare-feu Azure, et des réseaux virtuels spoke sont connectés à chaque hub. Les hubs n'utilisent que les tables de routage par défaut.

    Le trafic entre un spoke de Hub-WE et un spoke de Hub-NE doit être inspecté par les pare-feu, avec le moins d'effort d'administration possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure a routing intent Private traffic policy with Azure Firewall as next hop on both hubs.", fr: "Configurer une stratégie d'intention de routage Trafic privé avec le Pare-feu Azure comme tronçon suivant sur les deux hubs." } }
    - { id: b, text: { en: "Configure a routing intent Internet traffic policy with Azure Firewall as next hop on both hubs.", fr: "Configurer une stratégie d'intention de routage Trafic Internet avec le Pare-feu Azure comme tronçon suivant sur les deux hubs." } }
    - { id: c, text: { en: "Create a custom route table in each hub that sends the remote spoke prefixes to the local firewall.", fr: "Créer dans chaque hub une table de routage personnalisée qui envoie les préfixes des spokes distants au pare-feu local." } }
    - { id: d, text: { en: "Associate a route table with each spoke subnet that sends the remote prefixes to the local firewall.", fr: "Associer à chaque sous-réseau spoke une table de routage qui envoie les préfixes distants au pare-feu local." } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Private traffic routing policy sends branch, virtual network and inter-hub traffic to the hub's security solution. Inter-hub inspection is available only through routing intent, and it must be enabled on every hub so that traffic stays symmetric across both firewalls.
    fr: |-
      Une stratégie de routage Trafic privé envoie le trafic des branches, des réseaux virtuels et entre hubs vers la solution de sécurité du hub. L'inspection entre hubs n'est possible qu'avec l'intention de routage, et elle doit être activée sur chaque hub pour que le trafic reste symétrique entre les deux pare-feu.
  options:
    b: { en: "An Internet traffic policy covers internet-bound traffic only, not traffic between spokes of different hubs.", fr: "Une stratégie Trafic Internet ne couvre que le trafic à destination d'Internet, pas le trafic entre spokes de hubs différents." }
    c: { en: "Custom route tables can't make inter-hub traffic go through a firewall, and they are incompatible with routing intent.", fr: "Les tables de routage personnalisées ne peuvent pas faire passer le trafic entre hubs par un pare-feu, et elles sont incompatibles avec l'intention de routage." }
    d: { en: "Spoke route tables don't control how the hub routers forward traffic between hubs, and they add effort on every subnet.", fr: "Les tables de routage des spokes ne contrôlent pas la façon dont les routeurs des hubs transfèrent le trafic entre hubs, et elles ajoutent du travail sur chaque sous-réseau." }
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
