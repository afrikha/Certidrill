id: sc500-2b-avnm-scope
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Virtual Network Manager instance named NM1. The scope of NM1 is the management group **MG-Prod**, which contains the subscriptions Sub1 and Sub2. NM1 has a network group named NG-Baseline that is the target of a deployed security admin configuration.

    Contoso acquires a subscription named Sub3 that isn't under MG-Prod and contains a virtual network named VNet-Acq. VNet-Acq must receive the security admin rules of NG-Baseline. You must not create another network manager.

    What should you do first?
  fr: |
    Contoso dispose d'une instance Azure Virtual Network Manager nommée NM1. L'étendue de NM1 est le groupe d'administration **MG-Prod**, qui contient les abonnements Sub1 et Sub2. NM1 a un groupe réseau nommé NG-Baseline, cible d'une configuration d'administration de la sécurité déployée.

    Contoso acquiert un abonnement nommé Sub3 qui n'est pas sous MG-Prod et qui contient un réseau virtuel nommé VNet-Acq. VNet-Acq doit recevoir les règles d'administration de la sécurité de NG-Baseline. Vous ne devez pas créer d'autre gestionnaire de réseau.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Peer VNet-Acq with a virtual network that is already a member of NG-Baseline.", fr: "Créer un peering entre VNet-Acq et un réseau virtuel déjà membre de NG-Baseline." } }
    - { id: b, text: { en: "Deploy the security admin configuration of NM1 again, to the region of VNet-Acq.", fr: "Déployer à nouveau la configuration d'administration de la sécurité de NM1 dans la région de VNet-Acq." } }
    - { id: c, text: { en: "Associate the network security groups of Sub1 with the subnets of VNet-Acq.", fr: "Associer les groupes de sécurité réseau de Sub1 aux sous-réseaux de VNet-Acq." } }
    - { id: d, text: { en: "Bring Sub3 into the scope of NM1, for example by moving it under MG-Prod.", fr: "Faire entrer Sub3 dans l'étendue de NM1, par exemple en le déplaçant sous MG-Prod." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Security admin rules apply only to virtual networks within the scope of the network manager, and network group members are chosen from that scope (management groups or subscriptions). Once Sub3 is in scope, VNet-Acq can be added to NG-Baseline statically or by its dynamic membership condition, and it receives the deployed configuration.
    fr: |-
      Les règles d'administration de la sécurité ne s'appliquent qu'aux réseaux virtuels situés dans l'étendue du gestionnaire de réseau, et les membres d'un groupe réseau sont choisis dans cette étendue (groupes d'administration ou abonnements). Une fois Sub3 dans l'étendue, VNet-Acq peut être ajouté à NG-Baseline de façon statique ou par sa condition d'appartenance dynamique, et il reçoit la configuration déployée.
  options:
    a: { en: "Peering connects networks but doesn't make VNet-Acq a member of a network group or bring it into the manager's scope.", fr: "Le peering connecte des réseaux mais ne rend pas VNet-Acq membre d'un groupe réseau et ne le place pas dans l'étendue du gestionnaire." }
    c: { en: "NSGs are separate resources managed per subnet; they don't deliver security admin rules.", fr: "Les NSG sont des ressources distinctes gérées par sous-réseau ; ils n'apportent pas les règles d'administration de la sécurité." }
    b: { en: "Redeploying doesn't help while VNet-Acq is outside the scope of NM1 and isn't a group member.", fr: "Redéployer n'aide pas tant que VNet-Acq est hors de l'étendue de NM1 et n'est pas membre du groupe." }
references:
  - title: What is a network group in Azure Virtual Network Manager?
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-network-groups
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
