id: sc500-2b-nsg-outbound-order
objective: "2.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named VNet1 belongs to a network group that has a deployed Azure Virtual Network Manager security admin configuration. A virtual machine named VM1 is connected to Subnet1 of VNet1. A network security group named NSG-S1 is associated with Subnet1, and a network security group named NSG-VM1 is associated with the network interface of VM1. No user-defined route is configured.

    VM1 opens an outbound connection to a server on the internet.

    In which order are the rule sets evaluated for this traffic? To answer, move the appropriate rule sets from the list to the answer area and arrange them in the correct order.
  fr: |
    Un réseau virtuel nommé VNet1 fait partie d'un groupe réseau qui a une configuration d'administration de la sécurité Azure Virtual Network Manager déployée. Une machine virtuelle nommée VM1 est connectée à Subnet1 de VNet1. Un groupe de sécurité réseau nommé NSG-S1 est associé à Subnet1, et un groupe de sécurité réseau nommé NSG-VM1 est associé à la carte réseau de VM1. Aucun itinéraire défini par l'utilisateur n'est configuré.

    VM1 ouvre une connexion sortante vers un serveur sur Internet.

    Dans quel ordre les ensembles de règles sont-ils évalués pour ce trafic ? Pour répondre, déplacez les ensembles de règles appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: sar, text: { en: "Security admin rules of the Virtual Network Manager configuration", fr: "Règles d'administration de la sécurité de la configuration Virtual Network Manager" } }
    - { id: nic, text: { en: "Rules of NSG-VM1", fr: "Règles de NSG-VM1" } }
    - { id: subnet, text: { en: "Rules of NSG-S1", fr: "Règles de NSG-S1" } }
    - { id: fw, text: { en: "Network rules of an Azure Firewall policy", fr: "Règles réseau d'une stratégie de Pare-feu Azure" } }
    - { id: pol, text: { en: "Azure Policy assignments on the subscription", fr: "Attributions Azure Policy sur l'abonnement" } }
answer:
  sequence: [sar, nic, subnet]
explanation:
  correct:
    en: |-
      Security admin rules apply at the virtual network level and are always evaluated before NSG rules, in both directions. For outbound traffic, Azure then processes the network interface NSG and then the subnet NSG; for inbound traffic the two NSGs are processed in the opposite order.
    fr: |-
      Les règles d'administration de la sécurité s'appliquent au niveau du réseau virtuel et sont toujours évaluées avant les règles de NSG, dans les deux directions. Pour le trafic sortant, Azure traite ensuite le NSG de la carte réseau, puis celui du sous-réseau ; pour le trafic entrant, les deux NSG sont traités dans l'ordre inverse.
  options:
    fw: { en: "Without a user-defined route to a firewall, the traffic never reaches an Azure Firewall.", fr: "Sans itinéraire défini par l'utilisateur vers un pare-feu, le trafic n'atteint jamais de Pare-feu Azure." }
    pol: { en: "Azure Policy evaluates resource configurations, not packets.", fr: "Azure Policy évalue la configuration des ressources, pas les paquets." }
references:
  - title: How network security groups filter network traffic
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
