id: sc500-2c-pls-limits
objective: "2.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to publish an application through a Private Link service named **pls-app** in the West Europe region. The application runs on virtual machines behind a Standard Load Balancer named lb-app in the same region.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de publier une application par un service Private Link nommé **pls-app** dans la région West Europe. L'application s'exécute sur des machines virtuelles derrière un Standard Load Balancer nommé lb-app dans la même région.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A consumer can connect to pls-app from a private endpoint in a virtual network in the East US region.
        fr: Un consommateur peut se connecter à pls-app depuis un point de terminaison privé d'un réseau virtuel de la région East US.
    - id: s2
      text:
        en: pls-app can use lb-app if the backend pool of lb-app is configured by IP address.
        fr: pls-app peut utiliser lb-app si le pool principal de lb-app est configuré par adresse IP.
    - id: s3
      text:
        en: pls-app can publish an application that uses UDP.
        fr: pls-app peut publier une application qui utilise UDP.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The Private Link service must be in the same region as its load balancer and virtual network, but approved private endpoints can connect from any public region. It requires a Standard Load Balancer whose backend pool is configured by network interface, not by IP address. It supports IPv4 traffic over TCP and UDP.
    fr: Le service Private Link doit se trouver dans la même région que son équilibreur de charge et son réseau virtuel, mais des points de terminaison privés approuvés peuvent se connecter depuis n'importe quelle région publique. Il exige un Standard Load Balancer dont le pool principal est configuré par carte réseau, et non par adresse IP. Il prend en charge le trafic IPv4 en TCP et en UDP.
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
