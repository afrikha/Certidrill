id: sc500-2a-audit-storage-firewall
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has an Azure SQL Database logical server named **sql-contoso-hr** and a general-purpose v2 storage account named **stcontosoaudit** in the same region. Public network access of stcontosoaudit is set to **Enabled from selected networks**, and the trusted Microsoft services exception is selected. sql-contoso-hr has a system-assigned managed identity.

    An administrator enabled server-level auditing to stcontosoaudit with a script that uses the storage access keys for authentication. No audit logs are written.

    You need audit logs to be written to stcontosoaudit. The firewall settings of stcontosoaudit must not be relaxed.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un serveur logique Azure SQL Database nommé **sql-contoso-hr** et d'un compte de stockage v2 universel nommé **stcontosoaudit** dans la même région. L'accès réseau public de stcontosoaudit est défini sur **Enabled from selected networks**, et l'exception des services Microsoft approuvés est sélectionnée. sql-contoso-hr dispose d'une identité managée affectée par le système.

    Un administrateur a activé l'audit au niveau du serveur vers stcontosoaudit avec un script qui utilise les clés d'accès du stockage pour l'authentification. Aucun journal d'audit n'est écrit.

    Vous devez faire en sorte que les journaux d'audit soient écrits dans stcontosoaudit. Les paramètres de pare-feu de stcontosoaudit ne doivent pas être assouplis.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an IP network rule to stcontosoaudit for the outbound IP addresses that sql-contoso-hr uses in the region.", fr: "Ajouter à stcontosoaudit une règle de réseau IP pour les adresses IP sortantes utilisées par sql-contoso-hr dans la région." } }
    - { id: b, text: { en: "Regenerate the access keys of stcontosoaudit and run the auditing script again with the new key.", fr: "Régénérer les clés d'accès de stcontosoaudit et réexécuter le script d'audit avec la nouvelle clé." } }
    - { id: c, text: { en: "Grant the server's identity Storage Blob Data Contributor on stcontosoaudit and use managed identity authentication.", fr: "Accorder Storage Blob Data Contributor sur stcontosoaudit à l'identité du serveur et utiliser l'authentification par identité managée." } }
    - { id: d, text: { en: "Set the audit retention of sql-contoso-hr to 0 days and run the script again with the same key.", fr: "Définir la rétention de l'audit de sql-contoso-hr sur 0 jour et réexécuter le script avec la même clé." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      To write audit logs to a storage account behind a firewall or virtual network rules, the account must be general-purpose v2 and the server must authenticate with its managed identity, which needs the Storage Blob Data Contributor role on the account. The trusted services exception then lets the server through the firewall.
    fr: |
      Pour écrire des journaux d'audit dans un compte de stockage protégé par un pare-feu ou des règles de réseau virtuel, le compte doit être v2 universel et le serveur doit s'authentifier avec son identité managée, qui a besoin du rôle Storage Blob Data Contributor sur le compte. L'exception des services approuvés laisse alors passer le serveur à travers le pare-feu.
  options:
    a:
      en: |
        IP network rules have no effect on Azure services in the same region as the storage account, and the requirement forbids relaxing the firewall.
      fr: |
        Les règles de réseau IP n'ont aucun effet sur les services Azure de la même région que le compte de stockage, et l'exigence interdit d'assouplir le pare-feu.
    b:
      en: |
        The key itself isn't the problem: behind a firewall, the server must use managed identity authentication.
      fr: |
        La clé elle-même n'est pas en cause : derrière un pare-feu, le serveur doit utiliser l'authentification par identité managée.
    d:
      en: |
        Retention only controls how long logs are kept (0 means unlimited); it doesn't affect whether they can be written.
      fr: |
        La rétention ne contrôle que la durée de conservation des journaux (0 signifie illimitée) ; elle n'influe pas sur leur écriture.
references:
  - title: Write audit to a storage account behind VNet and firewall
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/audit-write-storage-account-behind-vnet-firewall
