id: sc500-2c-pe-onprem-dns
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an on-premises network that connects to an Azure virtual network named **VNet-Hub** by using a site-to-site VPN.

    An Azure SQL Database logical server named **sql-contoso** has a private endpoint in VNet-Hub. The private DNS zone `privatelink.database.windows.net` is linked to VNet-Hub, and an Azure DNS Private Resolver with an inbound endpoint is deployed in VNet-Hub. On-premises clients use the on-premises DNS servers.

    You need on-premises clients to resolve `sql-contoso.database.windows.net` to the private IP address of the private endpoint. The solution must minimize administrative effort.

    What should you configure on the on-premises DNS servers?
  fr: |
    Contoso dispose d'un réseau local connecté à un réseau virtuel Azure nommé **VNet-Hub** par un VPN de site à site.

    Un serveur logique Azure SQL Database nommé **sql-contoso** dispose d'un point de terminaison privé dans VNet-Hub. La zone DNS privée `privatelink.database.windows.net` est liée à VNet-Hub, et un Azure DNS Private Resolver doté d'un point de terminaison entrant est déployé dans VNet-Hub. Les clients locaux utilisent les serveurs DNS locaux.

    Les clients locaux doivent résoudre `sql-contoso.database.windows.net` en adresse IP privée du point de terminaison privé. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer sur les serveurs DNS locaux ?
body:
  options:
    - id: a
      text: { en: "A conditional forwarder for database.windows.net that points to 168.63.129.16", fr: "Un redirecteur conditionnel pour database.windows.net qui pointe vers 168.63.129.16" }
    - id: b
      text: { en: "A hosts file entry on each client for sql-contoso.database.windows.net", fr: "Une entrée de fichier hosts sur chaque client pour sql-contoso.database.windows.net" }
    - id: c
      text: { en: "A conditional forwarder for database.windows.net that points to the inbound endpoint", fr: "Un redirecteur conditionnel pour database.windows.net qui pointe vers le point de terminaison entrant" }
    - id: d
      text: { en: "A secondary zone for privatelink.database.windows.net transferred from Azure", fr: "Une zone secondaire pour privatelink.database.windows.net transférée depuis Azure" }
answer: { optionId: c }
explanation:
  correct:
    en: The on-premises DNS servers must forward queries to a resolver inside Azure that can read the private DNS zone linked to VNet-Hub; the inbound endpoint of Azure DNS Private Resolver provides that IP address without a forwarder VM. Microsoft recommends forwarding the public zone (`database.windows.net`), not the `privatelink` zone, so the public CNAME chain leads to the private record.
    fr: Les serveurs DNS locaux doivent transférer les requêtes vers un résolveur situé dans Azure qui peut lire la zone DNS privée liée à VNet-Hub ; le point de terminaison entrant d'Azure DNS Private Resolver fournit cette adresse IP sans machine virtuelle de redirection. Microsoft recommande de transférer la zone publique (`database.windows.net`), et non la zone `privatelink`, pour que la chaîne CNAME publique mène à l'enregistrement privé.
  options:
    a:
      en: 168.63.129.16 is the Azure-provided DNS address, reachable only from inside Azure virtual networks, not from on-premises servers.
      fr: 168.63.129.16 est l'adresse du DNS fourni par Azure, joignable uniquement depuis les réseaux virtuels Azure, pas depuis des serveurs locaux.
    b:
      en: A hosts file works for testing only; maintaining it on every client does not minimize administrative effort.
      fr: Un fichier hosts ne convient qu'aux tests ; le maintenir sur chaque client ne réduit pas l'effort d'administration.
    d:
      en: Azure private DNS zones do not support zone transfers to external DNS servers.
      fr: Les zones DNS privées Azure ne prennent pas en charge les transferts de zone vers des serveurs DNS externes.
references:
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
