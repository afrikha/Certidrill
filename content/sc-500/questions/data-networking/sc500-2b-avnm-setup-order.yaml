id: sc500-2b-avnm-setup-order
objective: "2.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has 60 virtual networks in subscriptions under the management group MG-Tailspin. No Azure Virtual Network Manager instance exists.

    You need to block inbound TCP 23 from Internet on every virtual network that has the tag `tier=web`, including virtual networks created later, in a way that NSG owners can't override.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose de 60 réseaux virtuels dans des abonnements situés sous le groupe d'administration MG-Tailspin. Aucune instance Azure Virtual Network Manager n'existe.

    Vous devez bloquer TCP 23 en entrée depuis Internet sur chaque réseau virtuel portant l'étiquette `tier=web`, y compris les réseaux virtuels créés plus tard, d'une façon que les propriétaires des NSG ne peuvent pas contourner.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: nm, text: { en: "Create a network manager whose scope is MG-Tailspin.", fr: "Créer un gestionnaire de réseau dont l'étendue est MG-Tailspin." } }
    - { id: ng, text: { en: "Create a network group with a dynamic membership condition on the tag tier=web.", fr: "Créer un groupe réseau avec une condition d'appartenance dynamique sur l'étiquette tier=web." } }
    - { id: sac, text: { en: "Create a security admin configuration with a rule collection that targets the group and a Deny rule for TCP 23.", fr: "Créer une configuration d'administration de la sécurité avec une collection de règles qui cible le groupe et une règle Deny pour TCP 23." } }
    - { id: deploy, text: { en: "Deploy the security admin configuration to the regions of the virtual networks.", fr: "Déployer la configuration d'administration de la sécurité dans les régions des réseaux virtuels." } }
    - { id: conn, text: { en: "Create a connectivity configuration that targets the group.", fr: "Créer une configuration de connectivité qui cible le groupe." } }
    - { id: nsg, text: { en: "Associate an NSG that denies TCP 23 with every subnet.", fr: "Associer à chaque sous-réseau un NSG qui refuse TCP 23." } }
answer:
  sequence: [nm, ng, sac, deploy]
explanation:
  correct:
    en: |-
      The network manager defines the scope in which virtual networks can be managed. A dynamic network group uses an Azure Policy condition to include current and future virtual networks with the tag. The security admin configuration holds the rule collection that targets the group, and it takes effect only after you deploy it to the regions.
    fr: |-
      Le gestionnaire de réseau définit l'étendue dans laquelle les réseaux virtuels peuvent être gérés. Un groupe réseau dynamique utilise une condition Azure Policy pour inclure les réseaux virtuels actuels et futurs qui portent l'étiquette. La configuration d'administration de la sécurité contient la collection de règles qui cible le groupe, et elle ne prend effet qu'une fois déployée dans les régions.
  options:
    conn: { en: "A connectivity configuration creates topologies such as hub and spoke or mesh; it doesn't block ports.", fr: "Une configuration de connectivité crée des topologies comme hub and spoke ou maillage ; elle ne bloque pas de ports." }
    nsg: { en: "NSG owners can edit their NSGs, and future virtual networks wouldn't be covered automatically.", fr: "Les propriétaires des NSG peuvent les modifier, et les futurs réseaux virtuels ne seraient pas couverts automatiquement." }
references:
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
  - title: Manage configuration deployments in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-deployments
