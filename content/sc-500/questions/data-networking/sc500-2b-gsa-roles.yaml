id: sc500-2b-gsa-roles
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has Microsoft Entra ID P1 licenses and Microsoft Entra Private Access licenses. An administrator named Admin1 must create a connector group, configure Quick Access with its application segments, and assign users to the Quick Access app. Conditional Access policies are managed by another team.

    You must follow the principle of least privilege.

    Which two Microsoft Entra roles should you assign to Admin1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de licences Microsoft Entra ID P1 et de licences Microsoft Entra Private Access. Un administrateur nommé Admin1 doit créer un groupe de connecteurs, configurer Quick Access avec ses segments d'application et attribuer des utilisateurs à l'application Quick Access. Les stratégies d'accès conditionnel sont gérées par une autre équipe.

    Vous devez respecter le principe du moindre privilège.

    Quels sont les deux rôles Microsoft Entra que vous devez attribuer à Admin1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Global Secure Access Administrator }
    - { id: b, text: Conditional Access Administrator }
    - { id: c, text: Application Administrator }
    - { id: d, text: Security Administrator }
    - { id: e, text: Hybrid Identity Administrator }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      Configuring Quick Access requires the Global Secure Access Administrator and Application Administrator roles. Application Administrator is also the role required to manage private network connector groups, together with Microsoft Entra ID P1 or P2.
    fr: |-
      La configuration de Quick Access exige les rôles Global Secure Access Administrator et Application Administrator. Application Administrator est aussi le rôle nécessaire pour gérer les groupes de connecteurs de réseau privé, avec Microsoft Entra ID P1 ou P2.
  options:
    b: { en: "Conditional Access Administrator is needed only to create the Conditional Access policies, which another team manages.", fr: "Conditional Access Administrator n'est nécessaire que pour créer les stratégies d'accès conditionnel, gérées par une autre équipe." }
    d: { en: "Security Administrator isn't one of the documented roles for configuring Quick Access or connector groups.", fr: "Security Administrator ne fait pas partie des rôles documentés pour configurer Quick Access ou les groupes de connecteurs." }
    e: { en: "Hybrid Identity Administrator manages synchronization and federation, not Private Access apps.", fr: "Hybrid Identity Administrator gère la synchronisation et la fédération, pas les applications Private Access." }
references:
  - title: How to configure Quick Access for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-quick-access
