id: sc500-2a-rbac-container-upload
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has a storage account named **stlitwareimg** that contains the containers **raw**, **processed** and **archive**. Members of a Microsoft Entra group named **Ingest-Team** must upload and overwrite blobs in the raw container by using their Microsoft Entra identities.

    You need to grant the required access. The solution must follow the principle of least privilege.

    Which role assignment should you create for Ingest-Team?
  fr: |
    Litware, Inc. dispose d'un compte de stockage nommé **stlitwareimg** qui contient les conteneurs **raw**, **processed** et **archive**. Les membres d'un groupe Microsoft Entra nommé **Ingest-Team** doivent charger et remplacer des objets blob dans le conteneur raw avec leurs identités Microsoft Entra.

    Vous devez accorder l'accès nécessaire. La solution doit respecter le principe du moindre privilège.

    Quelle attribution de rôle devez-vous créer pour Ingest-Team ?
body:
  options:
    - { id: a, text: { en: "Storage Blob Data Contributor at the scope of the raw container", fr: "Storage Blob Data Contributor à l'étendue du conteneur raw" } }
    - { id: b, text: { en: "Storage Blob Data Contributor at the scope of stlitwareimg", fr: "Storage Blob Data Contributor à l'étendue de stlitwareimg" } }
    - { id: c, text: { en: "Storage Blob Data Owner at the scope of the raw container", fr: "Storage Blob Data Owner à l'étendue du conteneur raw" } }
    - { id: d, text: { en: "Storage Account Contributor at the scope of stlitwareimg", fr: "Storage Account Contributor à l'étendue de stlitwareimg" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Storage Blob Data Contributor grants read, write and delete access to blob data, and assigning it at the container scope limits it to the raw container. That is the narrowest role and scope that let the group upload and overwrite blobs with Microsoft Entra ID.
    fr: |
      Storage Blob Data Contributor accorde l'accès en lecture, écriture et suppression aux données blob, et l'attribuer à l'étendue du conteneur le limite au conteneur raw. C'est le rôle et l'étendue les plus restreints qui permettent au groupe de charger et de remplacer des objets blob avec Microsoft Entra ID.
  options:
    b:
      en: |
        At the account scope, the role also covers the processed and archive containers.
      fr: |
        À l'étendue du compte, le rôle couvre aussi les conteneurs processed et archive.
    c:
      en: |
        Storage Blob Data Owner adds full control, including POSIX access control management in Data Lake Storage, which isn't needed.
      fr: |
        Storage Blob Data Owner ajoute le contrôle total, y compris la gestion du contrôle d'accès POSIX dans Data Lake Storage, ce qui n'est pas nécessaire.
    d:
      en: |
        Storage Account Contributor manages the account and can list its keys, which grants access to all data through Shared Key.
      fr: |
        Storage Account Contributor gère le compte et peut lister ses clés, ce qui donne accès à toutes les données par clé partagée.
references:
  - title: Assign an Azure role for access to blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/assign-azure-role-data-access
