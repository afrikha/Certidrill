id: sc500-2c-pls-publish
objective: "2.3.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An application runs on two virtual machines in a subnet named **snet-app** of a virtual network named VNet-App. No load balancer is deployed.

    Woodgrove Bank, which has its own Microsoft Entra tenant, must reach the application privately through Azure Private Link. The Woodgrove subscription must not be added to any auto-approval list.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une application s'exécute sur deux machines virtuelles d'un sous-réseau nommé **snet-app** d'un réseau virtuel nommé VNet-App. Aucun équilibreur de charge n'est déployé.

    Woodgrove Bank, qui a son propre locataire Microsoft Entra, doit joindre l'application de manière privée par Azure Private Link. L'abonnement de Woodgrove ne doit être ajouté à aucune liste d'approbation automatique.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: lb, text: { en: "Deploy an internal Standard Load Balancer whose backend pool contains the network interfaces of the two VMs.", fr: "Déployer un Standard Load Balancer interne dont le pool principal contient les cartes réseau des deux machines virtuelles." } }
    - { id: pls, text: { en: "Create a Private Link service on the frontend IP configuration of the load balancer.", fr: "Créer un service Private Link sur la configuration IP frontale de l'équilibreur de charge." } }
    - { id: alias, text: { en: "Send the alias of the Private Link service to Woodgrove.", fr: "Envoyer l'alias du service Private Link à Woodgrove." } }
    - { id: approve, text: { en: "Approve the pending private endpoint connection from Woodgrove.", fr: "Approuver la connexion de point de terminaison privé en attente de Woodgrove." } }
    - { id: pe, text: { en: "Create a private endpoint in snet-app that targets the load balancer.", fr: "Créer dans snet-app un point de terminaison privé qui cible l'équilibreur de charge." } }
    - { id: peer, text: { en: "Create a peering between VNet-App and the Woodgrove virtual network.", fr: "Créer un peering entre VNet-App et le réseau virtuel de Woodgrove." } }
answer:
  sequence: [ lb, pls, alias, approve ]
explanation:
  correct:
    en: |
      A Private Link service needs a Standard Load Balancer whose backend pool is configured by network interface, so you deploy the load balancer first and then create the service on its frontend IP configuration. Woodgrove uses the alias to request a private endpoint connection, which stays Pending until you approve it because its subscription is not auto-approved.
    fr: |
      Un service Private Link nécessite un Standard Load Balancer dont le pool principal est configuré par carte réseau : vous déployez d'abord l'équilibreur de charge, puis vous créez le service sur sa configuration IP frontale. Woodgrove utilise l'alias pour demander une connexion de point de terminaison privé, qui reste En attente jusqu'à votre approbation puisque son abonnement n'est pas approuvé automatiquement.
  options:
    pe: { en: "The private endpoint is created by the consumer in its own virtual network, not by the provider.", fr: "Le point de terminaison privé est créé par le consommateur dans son propre réseau virtuel, pas par le fournisseur." }
    peer: { en: "Peering is not part of Private Link and would expose the whole virtual network.", fr: "Le peering ne fait pas partie de Private Link et exposerait tout le réseau virtuel." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
