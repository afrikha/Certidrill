id: sc500-2a-rbac-portal-roles
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a storage account named **stnwreports**. **Default to Microsoft Entra authorization in the Azure portal** is enabled on the account.

    An analyst named **User1** must browse and download the blobs of a container named **monthly** in the Azure portal by using her Microsoft Entra identity. User1 must not be able to access data in the account through the account keys. The solution must follow the principle of least privilege.

    Which roles should you assign to User1? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un compte de stockage nommé **stnwreports**. **Default to Microsoft Entra authorization in the Azure portal** est activé sur le compte.

    Une analyste nommée **User1** doit parcourir et télécharger les objets blob d'un conteneur nommé **monthly** dans le portail Azure avec son identité Microsoft Entra. User1 ne doit pas pouvoir accéder aux données du compte par les clés du compte. La solution doit respecter le principe du moindre privilège.

    Quels rôles devez-vous attribuer à User1 ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Role on the monthly container: [[data]]

      Role on stnwreports: [[mgmt]]
    fr: |
      Rôle sur le conteneur monthly : [[data]]

      Rôle sur stnwreports : [[mgmt]]
  slots:
    - id: data
      options:
        - { id: reader, text: Storage Blob Data Reader }
        - { id: contrib, text: Storage Blob Data Contributor }
        - { id: rda, text: Reader and Data Access }
    - id: mgmt
      options:
        - { id: reader, text: Reader }
        - { id: sac, text: Storage Account Contributor }
        - { id: none, text: { en: "No role", fr: "Aucun rôle" } }
answer:
  values: { data: reader, mgmt: reader }
explanation:
  correct:
    en: |
      Storage Blob Data Reader on the container lets User1 read and list its blobs with Microsoft Entra ID. To navigate to the account and its containers in the portal, User1 also needs at least the Reader role on the storage account, which doesn't allow listing the keys.
    fr: |
      Storage Blob Data Reader sur le conteneur permet à User1 de lire et lister ses objets blob avec Microsoft Entra ID. Pour accéder au compte et à ses conteneurs dans le portail, User1 a aussi besoin au minimum du rôle Reader sur le compte de stockage, qui ne permet pas de lister les clés.
  options:
    contrib: { en: "Contributor adds write and delete permissions that User1 doesn't need.", fr: "Contributor ajoute des autorisations d'écriture et de suppression dont User1 n'a pas besoin." }
    rda: { en: "Reader and Data Access lets the user list the account keys, which breaks the requirement.", fr: "Reader and Data Access permet à l'utilisateur de lister les clés du compte, ce qui enfreint l'exigence." }
    sac: { en: "Storage Account Contributor can list the account keys.", fr: "Storage Account Contributor peut lister les clés du compte." }
    none: { en: "Without a role on the account, User1 can't navigate to the container in the portal.", fr: "Sans rôle sur le compte, User1 ne peut pas accéder au conteneur dans le portail." }
references:
  - title: Choose how to authorize access to blob data in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-data-operations-portal
