id: sc500-2a-audit-db-level
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has an Azure SQL Database logical server named **sql-litware-fin** that hosts 15 databases. Server-level auditing sends the audit logs of every database to a Log Analytics workspace.

    A new requirement states that the audit logs of a database named **db-payments** must also be streamed to an event hub that a third-party SIEM reads. The SIEM must not receive the logs of any other database. All databases must stay audited in the workspace.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un serveur logique Azure SQL Database nommé **sql-litware-fin** qui héberge 15 bases de données. L'audit au niveau du serveur envoie les journaux d'audit de chaque base de données vers un espace de travail Log Analytics.

    Une nouvelle exigence impose que les journaux d'audit d'une base de données nommée **db-payments** soient aussi transmis à un hub d'événements lu par un SIEM tiers. Le SIEM ne doit recevoir les journaux d'aucune autre base de données. Toutes les bases de données doivent rester auditées dans l'espace de travail.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an Event Hubs destination to the server-level auditing of sql-litware-fin.", fr: "Ajouter une destination Event Hubs à l'audit au niveau du serveur de sql-litware-fin." } }
    - { id: b, text: { en: "Disable server-level auditing and enable database-level auditing on each database.", fr: "Désactiver l'audit au niveau du serveur et activer l'audit au niveau de la base de données sur chaque base." } }
    - { id: c, text: { en: "Enable database-level auditing on db-payments with an Event Hubs destination.", fr: "Activer l'audit au niveau de la base de données sur db-payments avec une destination Event Hubs." } }
    - { id: d, text: { en: "Create an export rule in the Log Analytics workspace for the audit records of all databases.", fr: "Créer une règle d'exportation dans l'espace de travail Log Analytics pour les enregistrements d'audit de toutes les bases." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A database-level audit policy exists side by side with the server policy: db-payments keeps being audited to the workspace by the server policy, and its own database policy streams its events to Event Hubs. Use a database policy only for a different destination or event set, as here.
    fr: |
      Une stratégie d'audit au niveau de la base de données coexiste avec la stratégie du serveur : db-payments continue d'être auditée vers l'espace de travail par la stratégie du serveur, et sa propre stratégie de base de données transmet ses événements à Event Hubs. Une stratégie de base de données ne s'utilise que pour une autre destination ou un autre ensemble d'événements, comme ici.
  options:
    a:
      en: |
        A server-level destination receives the events of every database on the server, which breaks the SIEM requirement.
      fr: |
        Une destination au niveau du serveur reçoit les événements de toutes les bases du serveur, ce qui enfreint l'exigence relative au SIEM.
    b:
      en: |
        Replacing the server policy with 15 database policies adds administrative effort and leaves future databases unaudited.
      fr: |
        Remplacer la stratégie du serveur par 15 stratégies de base de données augmente l'effort d'administration et laisse les futures bases non auditées.
    d:
      en: |
        Exporting all audit records would send the logs of every database to the SIEM.
      fr: |
        Exporter tous les enregistrements d'audit enverrait les journaux de toutes les bases au SIEM.
references:
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
