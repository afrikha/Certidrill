id: sc500-cs4a-foundry-dns
objective: "2.3.6"
type: multi
caseStudy: sc500-cs4a-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You create a private endpoint for fdy-trips in snet-pe with the target sub-resource **account**, and you set public network access of fdy-trips to **Disabled**.

    You need to configure name resolution for the private endpoint to meet the network requirement. Which three private DNS zones should you link to VNet-AI? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un point de terminaison privé pour fdy-trips dans snet-pe avec la sous-ressource cible **account**, et vous définissez l'accès réseau public de fdy-trips sur **Disabled**.

    Vous devez configurer la résolution de noms du point de terminaison privé pour respecter l'exigence réseau. Quelles sont les trois zones DNS privées à lier à VNet-AI ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: privatelink.cognitiveservices.azure.com }
    - { id: b, text: privatelink.azure-api.net }
    - { id: c, text: privatelink.openai.azure.com }
    - { id: d, text: privatelink.api.azureml.ms }
    - { id: e, text: privatelink.services.ai.azure.com }
    - { id: f, text: privatelink.vaultcore.azure.net }
answer: { optionIds: [a, c, e] }
explanation:
  correct:
    en: |
      The account sub-resource of a Microsoft Foundry resource is served on three endpoints, so its private endpoint needs the privatelink.cognitiveservices.azure.com, privatelink.openai.azure.com and privatelink.services.ai.azure.com zones. Linking them to VNet-AI makes the Foundry host names resolve to the private IP address in snet-pe.
    fr: |
      La sous-ressource account d'une ressource Microsoft Foundry est servie sur trois points de terminaison : son point de terminaison privé a besoin des zones privatelink.cognitiveservices.azure.com, privatelink.openai.azure.com et privatelink.services.ai.azure.com. Les lier à VNet-AI permet aux noms d'hôte Foundry de se résoudre vers l'adresse IP privée dans snet-pe.
  options:
    b:
      en: |
        privatelink.azure-api.net is the zone of an API Management private endpoint, not of a Foundry resource.
      fr: |
        privatelink.azure-api.net est la zone d'un point de terminaison privé API Management, pas d'une ressource Foundry.
    d:
      en: |
        privatelink.api.azureml.ms is used by Azure Machine Learning workspaces, not by the Foundry account sub-resource.
      fr: |
        privatelink.api.azureml.ms est utilisée par les espaces de travail Azure Machine Learning, pas par la sous-ressource account de Foundry.
    f:
      en: |
        privatelink.vaultcore.azure.net is the zone of a Key Vault private endpoint.
      fr: |
        privatelink.vaultcore.azure.net est la zone d'un point de terminaison privé Key Vault.
references:
  - title: Set up private networking for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/configure-private-link
