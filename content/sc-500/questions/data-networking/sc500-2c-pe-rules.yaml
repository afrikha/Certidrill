id: sc500-2c-pe-rules
objective: "2.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has the following resources. Both subscriptions are in the same Microsoft Entra tenant and are registered with the Microsoft.Network resource provider.

    | Resource | Type | Subscription | Region |
    | --- | --- | --- | --- |
    | VNet1 | Virtual network | Sub1 | West Europe |
    | stadatum | Storage account (general-purpose v2) | Sub2 | North Europe |

    A user named User1 has the Network Contributor role on Sub1 and no role assignment on Sub2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose des ressources suivantes. Les deux abonnements se trouvent dans le même locataire Microsoft Entra et sont inscrits auprès du fournisseur de ressources Microsoft.Network.

    | Ressource | Type | Abonnement | Région |
    | --- | --- | --- | --- |
    | VNet1 | Réseau virtuel | Sub1 | West Europe |
    | stadatum | Compte de stockage (usage général v2) | Sub2 | North Europe |

    Un utilisateur nommé User1 dispose du rôle Network Contributor sur Sub1 et d'aucune attribution de rôle sur Sub2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: User1 can create a private endpoint in VNet1 that targets the blob sub-resource of stadatum, even though stadatum is in another region.
        fr: User1 peut créer dans VNet1 un point de terminaison privé qui cible la sous-ressource blob de stadatum, même si stadatum se trouve dans une autre région.
    - id: s2
      text:
        en: The private endpoint created by User1 carries traffic to stadatum as soon as its DNS record exists.
        fr: Le point de terminaison privé créé par User1 transporte du trafic vers stadatum dès que son enregistrement DNS existe.
    - id: s3
      text:
        en: An administrator who is Owner of both subscriptions can create the private endpoint resource in Sub2 and connect it to a subnet of VNet1.
        fr: Un administrateur Owner des deux abonnements peut créer la ressource de point de terminaison privé dans Sub2 et la connecter à un sous-réseau de VNet1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: The private-link resource can be in a different region from the private endpoint, and a user without permissions on the resource can still request the connection, which is created with manual approval. Such a connection stays Pending until the owner of stadatum approves it, and only Approved connections carry traffic. The private endpoint itself must be in the same region and subscription as its virtual network.
    fr: La ressource de liaison privée peut se trouver dans une autre région que le point de terminaison privé, et un utilisateur sans autorisation sur la ressource peut quand même demander la connexion, créée avec une approbation manuelle. Cette connexion reste En attente (Pending) jusqu'à ce que le propriétaire de stadatum l'approuve, et seules les connexions approuvées transportent du trafic. Le point de terminaison privé lui-même doit se trouver dans la même région et le même abonnement que son réseau virtuel.
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
