id: sc500-2b-avnm-policy-json
objective: "2.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Network Manager instance with a network group named **ng-prod**. You are writing a custom Azure Policy definition so that every virtual network whose name contains `-prod` becomes a member of ng-prod automatically.

    How should you complete the policy definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une instance Azure Virtual Network Manager avec un groupe réseau nommé **ng-prod**. Vous écrivez une définition Azure Policy personnalisée pour que chaque réseau virtuel dont le nom contient `-prod` devienne automatiquement membre de ng-prod.

    Comment devez-vous compléter la définition de stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "properties": {
        "policyType": "Custom",
        "mode": "[[mode]]",
        "policyRule": {
          "if": {
            "allOf": [
              { "field": "type", "equals": "[[type]]" },
              { "field": "Name", "contains": "-prod" }
            ]
          },
          "then": {
            "effect": "[[effect]]",
            "details": {
              "networkGroupId": "/subscriptions/.../networkManagers/nm1/networkGroups/ng-prod"
            }
          }
        }
      }
    }
  slots:
    - id: mode
      options:
        - { id: all, text: All }
        - { id: indexed, text: Indexed }
        - { id: netdata, text: Microsoft.Network.Data }
    - id: type
      options:
        - { id: vnet, text: Microsoft.Network/virtualNetworks }
        - { id: ng, text: Microsoft.Network/networkManagers/networkGroups }
        - { id: nsg, text: Microsoft.Network/networkSecurityGroups }
    - id: effect
      options:
        - { id: modify, text: modify }
        - { id: add, text: addToNetworkGroup }
        - { id: dine, text: deployIfNotExists }
        - { id: append, text: append }
answer:
  values: { mode: netdata, type: vnet, effect: add }
explanation:
  correct:
    en: |-
      Policy definitions for Virtual Network Manager network groups must use the mode Microsoft.Network.Data and the effect addToNetworkGroup, with the full resource ID of the target group in networkGroupId. Azure Policy adds only virtual networks to network groups, and a type condition on Microsoft.Network/virtualNetworks scopes the evaluation to them.
    fr: |-
      Les définitions de stratégie pour les groupes réseau de Virtual Network Manager doivent utiliser le mode Microsoft.Network.Data et l'effet addToNetworkGroup, avec l'ID de ressource complet du groupe cible dans networkGroupId. Azure Policy n'ajoute que des réseaux virtuels aux groupes réseau, et une condition de type sur Microsoft.Network/virtualNetworks limite l'évaluation à ces derniers.
  options:
    all: { en: "All is a Resource Manager mode; network group membership policies require the Microsoft.Network.Data mode.", fr: "All est un mode Resource Manager ; les stratégies d'appartenance aux groupes réseau exigent le mode Microsoft.Network.Data." }
    indexed: { en: "Indexed is a Resource Manager mode for resources that support tags and location, not the network group provider mode.", fr: "Indexed est un mode Resource Manager pour les ressources qui prennent en charge étiquettes et emplacement, pas le mode du fournisseur des groupes réseau." }
    ng: { en: "The policy evaluates the candidate members, which are virtual networks, not the network group itself.", fr: "La stratégie évalue les membres candidats, qui sont des réseaux virtuels, pas le groupe réseau lui-même." }
    nsg: { en: "NSGs can't be members of a network group.", fr: "Les NSG ne peuvent pas être membres d'un groupe réseau." }
    modify: { en: "modify changes properties or tags of resources; it doesn't add them to a network group.", fr: "modify change des propriétés ou des étiquettes de ressources ; il ne les ajoute pas à un groupe réseau." }
    dine: { en: "deployIfNotExists deploys a related resource; membership uses addToNetworkGroup.", fr: "deployIfNotExists déploie une ressource associée ; l'appartenance utilise addToNetworkGroup." }
    append: { en: "append adds fields to a resource request; it doesn't manage group membership.", fr: "append ajoute des champs à une requête de ressource ; il ne gère pas l'appartenance à un groupe." }
references:
  - title: Configuring network groups with Azure Policy in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-azure-policy-integration
