id: sc500-2b-vwan-prereq
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Standard Azure Virtual WAN hub named Hub1 with an Azure Firewall whose provisioning state is **Succeeded**. Hub1 contains the defaultRouteTable, the noneRouteTable and a custom route table named RT-Isolated that two spoke connections are associated with.

    In the Virtual WAN portal, the option to configure routing intent and routing policies on Hub1 is greyed out.

    What should you do before you can configure routing intent?
  fr: |
    Vous disposez d'un hub Azure Virtual WAN Standard nommé Hub1 avec un Pare-feu Azure dont l'état de provisionnement est **Succeeded**. Hub1 contient la defaultRouteTable, la noneRouteTable et une table de routage personnalisée nommée RT-Isolated à laquelle deux connexions de spoke sont associées.

    Dans le portail Virtual WAN, l'option de configuration de l'intention de routage et des stratégies de routage de Hub1 est grisée.

    Que devez-vous faire avant de pouvoir configurer l'intention de routage ?
body:
  options:
    - { id: a, text: { en: "Upgrade the Azure Firewall of Hub1 from the Standard tier to the Premium tier.", fr: "Faire passer le Pare-feu Azure de Hub1 du niveau Standard au niveau Premium." } }
    - { id: b, text: { en: "Enable Propagate default route on every virtual network connection of Hub1.", fr: "Activer Propagate default route sur chaque connexion de réseau virtuel de Hub1." } }
    - { id: c, text: { en: "Add a static route for 0.0.0.0/0 to the defaultRouteTable with a spoke connection as next hop.", fr: "Ajouter à la defaultRouteTable un itinéraire statique 0.0.0.0/0 avec une connexion de spoke comme tronçon suivant." } }
    - { id: d, text: { en: "Back up the routing configuration, and then remove RT-Isolated and its associations.", fr: "Sauvegarder la configuration de routage, puis supprimer RT-Isolated et ses associations." } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Routing intent manages the associations and propagations of all connections itself, so the hub can contain only the defaultRouteTable and the noneRouteTable, with no static route that points to a virtual network connection. The portal greys out the option until these prerequisites are met. Routing intent doesn't save the previous configuration, so you back it up first.
    fr: |-
      L'intention de routage gère elle-même les associations et propagations de toutes les connexions : le hub ne peut contenir que la defaultRouteTable et la noneRouteTable, sans itinéraire statique pointant vers une connexion de réseau virtuel. Le portail grise l'option tant que ces prérequis ne sont pas remplis. L'intention de routage n'enregistre pas la configuration précédente : vous la sauvegardez d'abord.
  options:
    a: { en: "The firewall tier isn't a routing intent prerequisite; the custom route table is what blocks the option.", fr: "Le niveau du pare-feu n'est pas un prérequis de l'intention de routage ; c'est la table de routage personnalisée qui bloque l'option." }
    c: { en: "Static routes with a virtual network connection as next hop are themselves incompatible with routing intent.", fr: "Les itinéraires statiques ayant une connexion de réseau virtuel comme tronçon suivant sont eux-mêmes incompatibles avec l'intention de routage." }
    b: { en: "This flag controls which connections learn 0.0.0.0/0; it doesn't remove the custom route table.", fr: "Ce paramètre contrôle quelles connexions apprennent 0.0.0.0/0 ; il ne supprime pas la table de routage personnalisée." }
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
