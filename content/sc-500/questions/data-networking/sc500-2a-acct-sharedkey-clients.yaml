id: sc500-2a-acct-sharedkey-clients
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a storage account named **stnorthwind** that stores blob data. The following clients access stnorthwind:

    | Client | Authorization |
    | --- | --- |
    | App1 | Account SAS |
    | App2 | Managed identity that has the Storage Blob Data Contributor role |
    | Partner1 | Service SAS |
    | Partner2 | User delegation SAS |

    You set **Allow storage account key access** to **Disabled** on stnorthwind.

    Which two clients will have their requests denied?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un compte de stockage nommé **stnorthwind** qui stocke des données blob. Les clients suivants accèdent à stnorthwind :

    | Client | Autorisation |
    | --- | --- |
    | App1 | SAS de compte |
    | App2 | Identité managée disposant du rôle Storage Blob Data Contributor |
    | Partner1 | SAS de service |
    | Partner2 | SAS de délégation d'utilisateur |

    Vous définissez **Allow storage account key access** sur **Disabled** sur stnorthwind.

    Quels sont les deux clients dont les requêtes seront refusées ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: App1 }
    - { id: b, text: App2 }
    - { id: c, text: Partner1 }
    - { id: d, text: Partner2 }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Account SAS and service SAS tokens are signed with an account key, so they are authorized with Shared Key and are denied with 403 once Shared Key access is disallowed. Requests authorized with Microsoft Entra ID, including a user delegation SAS, are still permitted.
    fr: |
      Les jetons SAS de compte et SAS de service sont signés avec une clé de compte : ils sont autorisés par clé partagée et refusés avec une erreur 403 dès que l'accès par clé partagée est interdit. Les requêtes autorisées avec Microsoft Entra ID, y compris une SAS de délégation d'utilisateur, restent permises.
  options:
    b:
      en: |
        A managed identity with an Azure RBAC data role uses Microsoft Entra authorization, which isn't affected by the setting.
      fr: |
        Une identité managée dotée d'un rôle de données Azure RBAC utilise l'autorisation Microsoft Entra, que ce paramètre ne concerne pas.
    d:
      en: |
        A user delegation SAS is signed with a user delegation key obtained with Microsoft Entra credentials, so it keeps working.
      fr: |
        Une SAS de délégation d'utilisateur est signée avec une clé de délégation d'utilisateur obtenue avec des informations d'identification Microsoft Entra : elle continue de fonctionner.
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
