id: sc500-2a-sql-networking-hotarea
objective: "2.2.1"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has an Azure SQL Database logical server named **sql-wingtip**. A private endpoint for sql-wingtip already exists in a virtual network named **VNet-Data**, and name resolution is configured. Public network access is currently set to Selected networks, with server-level IP firewall rules for two branch offices. All clients support TLS 1.3.

    The **Security > Networking** page of sql-wingtip shows the options in the following table. Each prompt is independent.

    Answer each prompt by selecting the option to choose.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un serveur logique Azure SQL Database nommé **sql-wingtip**. Un point de terminaison privé pour sql-wingtip existe déjà dans un réseau virtuel nommé **VNet-Data**, et la résolution de noms est configurée. L'accès réseau public est actuellement défini sur Selected networks, avec des règles de pare-feu IP au niveau du serveur pour deux agences. Tous les clients prennent en charge TLS 1.3.

    La page **Security > Networking** de sql-wingtip présente les options du tableau suivant. Chaque consigne est indépendante.

    Répondez à chaque consigne en sélectionnant l'option à choisir.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Clients must be able to connect only through the private endpoint.", fr: "Les clients ne doivent pouvoir se connecter que par le point de terminaison privé." }
    - id: p2
      text: { en: "Connections that negotiate TLS 1.2 must be rejected.", fr: "Les connexions qui négocient TLS 1.2 doivent être rejetées." }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Option 1", fr: "Option 1" }, { en: "Option 2", fr: "Option 2" }]
    rows:
      - [{ text: Public network access }, { text: Disable, area: pnadis }, { text: Selected networks, area: pnasel }]
      - [{ text: Allow Azure services and resources to access this server }, { text: { en: "Selected", fr: "Sélectionné" }, area: azsel }, { text: { en: "Cleared", fr: "Désélectionné" }, area: azclr }]
      - [{ text: Minimum TLS version }, { text: "1.2", area: tls12 }, { text: "1.3", area: tls13 }]
answer:
  values: { p1: pnadis, p2: tls13 }
explanation:
  correct:
    en: |
      With public network access set to Disable, connections through the public endpoint fail and only private endpoints can connect. Setting the minimum TLS version to 1.3 rejects clients that use a lower version; 1.2 is the lowest minimum that can be set.
    fr: |
      Avec l'accès réseau public défini sur Disable, les connexions par le point de terminaison public échouent et seuls les points de terminaison privés peuvent se connecter. Définir la version TLS minimale sur 1.3 rejette les clients qui utilisent une version inférieure ; 1.2 est le minimum le plus bas qu'on puisse définir.
references:
  - title: Connectivity settings for Azure SQL Database and Azure Synapse Analytics
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/connectivity-settings
