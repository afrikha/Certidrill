id: sc500-2a-sql-tde-statements
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has an Azure SQL Database logical server named **sql-adatum-erp** whose databases use transparent data encryption (TDE) with the default service-managed protector. You plan to switch the server to a customer-managed TDE protector stored in Azure Key Vault.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un serveur logique Azure SQL Database nommé **sql-adatum-erp** dont les bases de données utilisent le chiffrement transparent des données (TDE) avec le protecteur par défaut géré par le service. Vous prévoyez de passer le serveur à un protecteur TDE géré par le client stocké dans Azure Key Vault.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The switch re-encrypts only the database encryption keys and doesn't take the databases offline.", fr: "Le changement ne rechiffre que les clés de chiffrement des bases de données et ne met pas les bases hors ligne." } }
    - { id: b, text: { en: "Automatic rotation to the latest key version is enabled by default.", fr: "La rotation automatique vers la dernière version de la clé est activée par défaut." } }
    - { id: c, text: { en: "The protector can be an RSA or RSA-HSM key of 2048 or 3072 bits.", fr: "Le protecteur peut être une clé RSA ou RSA-HSM de 2 048 ou 3 072 bits." } }
    - { id: d, text: { en: "The protector can be an elliptic curve (EC) key.", fr: "Le protecteur peut être une clé à courbe elliptique (EC)." } }
    - { id: e, text: { en: "After a rotation, the previous key versions can be deleted immediately because existing backups are re-encrypted.", fr: "Après une rotation, les versions précédentes de la clé peuvent être supprimées immédiatement, car les sauvegardes sont rechiffrées." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Moving from a service-managed to a customer-managed protector only re-wraps the database encryption key, so the operation is online with no downtime. The TDE protector must be an RSA or RSA-HSM key of 2048 or 3072 bits that is enabled and not expired.
    fr: |
      Passer d'un protecteur géré par le service à un protecteur géré par le client ne fait que réencapsuler la clé de chiffrement de la base de données : l'opération se fait en ligne, sans interruption. Le protecteur TDE doit être une clé RSA ou RSA-HSM de 2 048 ou 3 072 bits, activée et non expirée.
  options:
    b:
      en: |
        Automatic rotation of the TDE protector is off by default; when you turn it on, the server moves to the latest key version within 24 hours.
      fr: |
        La rotation automatique du protecteur TDE est désactivée par défaut ; une fois activée, le serveur passe à la dernière version de la clé en 24 heures.
    d:
      en: |
        Elliptic curve keys aren't supported: the TDE protector is an RSA or RSA-HSM key (symmetric AES keys are only in preview for SQL Database).
      fr: |
        Les clés à courbe elliptique ne sont pas prises en charge : le protecteur TDE est une clé RSA ou RSA-HSM (les clés symétriques AES ne sont qu'en préversion pour SQL Database).
    e:
      en: |
        Changing the protector doesn't update existing backups: each backup needs the key version it was encrypted with, so old versions must be kept until those backups expire.
      fr: |
        Changer de protecteur ne met pas à jour les sauvegardes existantes : chaque sauvegarde a besoin de la version de clé qui l'a chiffrée, et les anciennes versions doivent être conservées jusqu'à l'expiration de ces sauvegardes.
references:
  - title: Azure SQL Transparent Data Encryption with customer-managed key
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
