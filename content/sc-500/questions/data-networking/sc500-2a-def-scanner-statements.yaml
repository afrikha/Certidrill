id: sc500-2a-def-scanner-statements
objective: "2.1.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a storage account named **stcontosoup**. Public network access is set to **Enabled from selected networks** with two virtual network rules. Blob soft delete is turned off.

    You enable Defender for Storage on stcontosoup with on-upload malware scanning, and you turn on the soft delete malicious blobs option.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un compte de stockage nommé **stcontosoup**. L'accès réseau public est défini sur **Enabled from selected networks** avec deux règles de réseau virtuel. La suppression réversible des objets blob est désactivée.

    Vous activez Defender for Storage sur stcontosoup avec l'analyse des programmes malveillants au chargement, et vous activez l'option soft delete malicious blobs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You must add a virtual network rule or an IP network rule for the malware scanning service before uploads can be scanned.
        fr: |
          Vous devez ajouter une règle de réseau virtuel ou une règle de réseau IP pour le service d'analyse des programmes malveillants avant que les chargements puissent être analysés.
    - id: s2
      text:
        en: |
          Turning on soft delete malicious blobs enables blob soft delete on stcontosoup.
        fr: |
          L'activation de soft delete malicious blobs active la suppression réversible des objets blob sur stcontosoup.
    - id: s3
      text:
        en: |
          If someone deletes the StorageDataScanner resource, Defender for Storage recreates it automatically at the next upload.
        fr: |
          Si quelqu'un supprime la ressource StorageDataScanner, Defender for Storage la recrée automatiquement au chargement suivant.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      When public network access is restricted to selected networks, the StorageDataScanner resource is added automatically to the Resource instances list of the account, so scanning keeps working without a manual rule. If blob soft delete is off, turning on soft delete malicious blobs enables it (7 days by default). If the scanner resource is deleted or modified, scanning can stop; you disable and re-enable malware scanning to recreate it.
    fr: |
      Quand l'accès réseau public est limité aux réseaux sélectionnés, la ressource StorageDataScanner est ajoutée automatiquement à la liste Resource instances du compte : l'analyse continue de fonctionner sans règle manuelle. Si la suppression réversible des objets blob est désactivée, l'activation de soft delete malicious blobs l'active (7 jours par défaut). Si la ressource d'analyse est supprimée ou modifiée, l'analyse peut s'arrêter ; il faut désactiver puis réactiver l'analyse des programmes malveillants pour la recréer.
references:
  - title: Introduction to malware scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-malware-scan
  - title: Set up automated remediation for malware detection
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-configure-malware-scan
