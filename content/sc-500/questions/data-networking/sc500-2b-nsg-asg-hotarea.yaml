id: sc500-2b-nsg-asg-hotarea
objective: "2.3.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A virtual network named VNet1 contains two subnets that are both associated with a network security group named NSG1. No network interface has its own NSG. The application security group memberships are the following:

    - asg-web: VM-Web1, VM-Web2
    - asg-api: VM-Api1
    - asg-db: VM-Db1

    VM-Jump1 is in VNet1 and isn't a member of any application security group. The inbound rules of NSG1 are shown in the answer area.

    For each connection, select the rule that decides the traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé VNet1 contient deux sous-réseaux, tous deux associés à un groupe de sécurité réseau nommé NSG1. Aucune carte réseau n'a son propre NSG. Les appartenances aux groupes de sécurité d'application sont les suivantes :

    - asg-web : VM-Web1, VM-Web2
    - asg-api : VM-Api1
    - asg-db : VM-Db1

    VM-Jump1 se trouve dans VNet1 et n'est membre d'aucun groupe de sécurité d'application. Les règles de trafic entrant de NSG1 figurent dans la zone de réponse.

    Pour chaque connexion, sélectionnez la règle qui décide du sort du trafic.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "VM-Web1 to VM-Db1 on TCP 1433", fr: "De VM-Web1 vers VM-Db1 sur TCP 1433" }
    - id: p2
      text: { en: "VM-Jump1 to VM-Api1 on TCP 22", fr: "De VM-Jump1 vers VM-Api1 sur TCP 22" }
  grid:
    header: [{ en: "Priority", fr: "Priorité" }, { en: Name, fr: Nom }, { en: Source, fr: Source }, Destination, Port, Action]
    rows:
      - [{ text: "100" }, { text: Allow-Api-To-Db, area: r100 }, { text: asg-api }, { text: asg-db }, { text: "1433" }, { text: Allow }]
      - [{ text: "110" }, { text: Deny-Any-To-Db, area: r110 }, { text: Any }, { text: asg-db }, { text: "1433" }, { text: Deny }]
      - [{ text: "120" }, { text: Deny-Internet-Ssh, area: r120 }, { text: Internet }, { text: asg-api }, { text: "22" }, { text: Deny }]
      - [{ text: "130" }, { text: Allow-Web-Https, area: r130 }, { text: Internet }, { text: asg-web }, { text: "443" }, { text: Allow }]
      - [{ text: "65000" }, { text: AllowVNetInBound, area: r65000 }, { text: VirtualNetwork }, { text: VirtualNetwork }, { text: Any }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllInbound, area: r65500 }, { text: Any }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r110, p2: r65000 }
explanation:
  correct:
    en: |-
      VM-Web1 is in asg-web, not asg-api, so rule 100 doesn't match and rule 110 denies its SQL traffic to asg-db. VM-Jump1's SSH traffic comes from inside VNet1, so it doesn't match the Internet source of rule 120; no custom rule matches, and the default AllowVNetInBound rule (65000) allows it.
    fr: |-
      VM-Web1 est membre d'asg-web, pas d'asg-api : la règle 100 ne correspond pas et la règle 110 refuse son trafic SQL vers asg-db. Le trafic SSH de VM-Jump1 vient de l'intérieur de VNet1 et ne correspond donc pas à la source Internet de la règle 120 ; aucune règle personnalisée ne correspond, et la règle par défaut AllowVNetInBound (65000) l'autorise.
references:
  - title: Application security groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
