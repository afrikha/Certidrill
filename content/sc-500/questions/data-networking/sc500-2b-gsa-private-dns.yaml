id: sc500-2b-gsa-private-dns
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses Microsoft Entra Private Access. The Quick Access app contains an application segment for the IP range 10.8.0.0 to 10.8.255.255 on TCP 443. Internal web apps in that range are registered in the on-premises DNS zone **corp.fabrikam.local**.

    Remote users must be able to open the apps by typing short names such as `https://benefits`, as they did on the corporate network. You must not add a segment for each app.

    What should you do?
  fr: |
    Fabrikam utilise Microsoft Entra Private Access. L'application Quick Access contient un segment d'application pour la plage IP 10.8.0.0 à 10.8.255.255 sur TCP 443. Les applications web internes de cette plage sont inscrites dans la zone DNS locale **corp.fabrikam.local**.

    Les utilisateurs distants doivent pouvoir ouvrir les applications en tapant des noms courts comme `https://benefits`, comme sur le réseau de l'entreprise. Vous ne devez pas ajouter de segment pour chaque application.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the wildcard FQDN segment *.corp.fabrikam.local on TCP 443 to Quick Access.", fr: "Ajouter à Quick Access le segment FQDN générique *.corp.fabrikam.local sur TCP 443." } }
    - { id: b, text: { en: "Create an Azure private DNS zone named corp.fabrikam.local and add a record for each app.", fr: "Créer une zone DNS privée Azure nommée corp.fabrikam.local et ajouter un enregistrement pour chaque application." } }
    - { id: c, text: { en: "On the Private DNS tab of Quick Access, enable private DNS and add the DNS suffix corp.fabrikam.local.", fr: "Dans l'onglet Private DNS de Quick Access, activer le DNS privé et ajouter le suffixe DNS corp.fabrikam.local." } }
    - { id: d, text: { en: "Enable the Microsoft traffic forwarding profile for the remote users.", fr: "Activer le profil de transfert du trafic Microsoft pour les utilisateurs distants." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Private DNS in Quick Access sends queries for the configured DNS suffixes to the internal DNS servers through the connectors. With the suffix corp.fabrikam.local, a user who types `https://benefits` gets the internal address of benefits.corp.fabrikam.local, which is inside the existing 10.8.0.0 range segment.
    fr: |-
      Le DNS privé de Quick Access envoie les requêtes portant sur les suffixes DNS configurés aux serveurs DNS internes via les connecteurs. Avec le suffixe corp.fabrikam.local, un utilisateur qui tape `https://benefits` obtient l'adresse interne de benefits.corp.fabrikam.local, comprise dans le segment de plage 10.8.0.0 existant.
  options:
    a: { en: "A wildcard FQDN segment tunnels traffic for full names, but doesn't make short names such as benefits resolvable.", fr: "Un segment FQDN générique fait passer dans le tunnel le trafic des noms complets, mais ne rend pas résolubles les noms courts comme benefits." }
    b: { en: "An Azure private DNS zone serves Azure virtual networks, not Global Secure Access clients, and needs a record per app.", fr: "Une zone DNS privée Azure sert les réseaux virtuels Azure, pas les clients Global Secure Access, et exige un enregistrement par application." }
    d: { en: "The Microsoft traffic profile handles Microsoft 365 traffic, not private apps.", fr: "Le profil de trafic Microsoft traite le trafic Microsoft 365, pas les applications privées." }
references:
  - title: How to configure Quick Access for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-quick-access
