id: sc500-2b-gsa-statements
objective: "2.3.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware plans to deploy Microsoft Entra Private Access to replace its VPN. Two Windows Server 2022 machines in the datacenter will host private network connectors, and all private resources will first be published through Quick Access.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de déployer Microsoft Entra Private Access pour remplacer son VPN. Deux serveurs Windows Server 2022 du centre de données hébergeront des connecteurs de réseau privé, et toutes les ressources privées seront d'abord publiées par Quick Access.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The datacenter firewall must allow inbound TCP 443 from the internet to the connector servers.
        fr: Le pare-feu du centre de données doit autoriser TCP 443 entrant depuis Internet vers les serveurs de connecteurs.
    - id: s2
      text:
        en: The Quick Access app can contain up to 500 application segments.
        fr: L'application Quick Access peut contenir jusqu'à 500 segments d'application.
    - id: s3
      text:
        en: An application segment can use a wildcard FQDN in the format *.litware.com.
        fr: Un segment d'application peut utiliser un FQDN générique au format *.litware.com.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      Connectors make only outbound connections (TCP 443, plus TCP 80 for certificate revocation lists) to the service, so no inbound rule is needed. Quick Access supports up to 500 application segments, and a segment can be an IP address, an IP range or an FQDN, including wildcard FQDNs written as *.domain.
    fr: |-
      Les connecteurs n'établissent que des connexions sortantes (TCP 443, plus TCP 80 pour les listes de révocation de certificats) vers le service : aucune règle entrante n'est nécessaire. Quick Access prend en charge jusqu'à 500 segments d'application, et un segment peut être une adresse IP, une plage IP ou un FQDN, y compris un FQDN générique écrit *.domaine.
references:
  - title: How to configure private network connectors for Microsoft Entra Private Access and Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-connectors
  - title: How to configure Quick Access for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-quick-access
