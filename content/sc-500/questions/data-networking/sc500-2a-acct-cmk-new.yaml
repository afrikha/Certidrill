id: sc500-2a-acct-cmk-new
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a key vault named **kv-adatum-hr** that has soft delete and purge protection enabled and contains an RSA 3072-bit key named **key-hr**.

    You need to create a storage account named **stadatumhr** that encrypts its data with key-hr from the moment the account is created.

    Which identity should the storage account use to access key-hr?
  fr: |
    Adatum Corporation dispose d'un coffre de clés nommé **kv-adatum-hr** dont la suppression réversible et la protection contre le vidage sont activées, et qui contient une clé RSA de 3 072 bits nommée **key-hr**.

    Vous devez créer un compte de stockage nommé **stadatumhr** qui chiffre ses données avec key-hr dès la création du compte.

    Quelle identité le compte de stockage doit-il utiliser pour accéder à key-hr ?
body:
  options:
    - { id: a, text: { en: "The system-assigned managed identity of stadatumhr, enabled during account creation", fr: "L'identité managée affectée par le système de stadatumhr, activée pendant la création du compte" } }
    - { id: b, text: { en: "A user-assigned managed identity that has the get, wrapkey and unwrapkey permissions on key-hr", fr: "Une identité managée affectée par l'utilisateur qui dispose des autorisations get, wrapkey et unwrapkey sur key-hr" } }
    - { id: c, text: { en: "An app registration with a client secret that has the get, wrapkey and unwrapkey permissions on key-hr", fr: "Une inscription d'application avec une clé secrète client qui dispose des autorisations get, wrapkey et unwrapkey sur key-hr" } }
    - { id: d, text: { en: "The Microsoft Entra account of the administrator who creates stadatumhr", fr: "Le compte Microsoft Entra de l'administrateur qui crée stadatumhr" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When you configure customer-managed keys while creating a storage account, you must use a user-assigned managed identity, because a system-assigned identity exists only after the account exists. The identity needs at least the get, wrapkey and unwrapkey permissions on the key.
    fr: |
      Quand vous configurez des clés gérées par le client pendant la création d'un compte de stockage, vous devez utiliser une identité managée affectée par l'utilisateur, car une identité affectée par le système n'existe qu'une fois le compte créé. L'identité a besoin au minimum des autorisations get, wrapkey et unwrapkey sur la clé.
  options:
    a:
      en: |
        A system-assigned identity can be used only for an existing account, not to configure customer-managed keys at creation.
      fr: |
        Une identité affectée par le système n'est utilisable que pour un compte existant, pas pour configurer des clés gérées par le client à la création.
    c:
      en: |
        Azure Storage accesses the key vault with a managed identity of the account, not with an app registration and a secret.
      fr: |
        Le Stockage Azure accède au coffre de clés avec une identité managée du compte, pas avec une inscription d'application et une clé secrète.
    d:
      en: |
        The administrator's identity is not used by the service to wrap and unwrap the account encryption key.
      fr: |
        L'identité de l'administrateur n'est pas utilisée par le service pour encapsuler et désencapsuler la clé de chiffrement du compte.
references:
  - title: Customer-managed keys for Azure Storage encryption
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
