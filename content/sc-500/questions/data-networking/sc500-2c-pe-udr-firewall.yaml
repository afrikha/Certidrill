id: sc500-2c-pe-udr-firewall
objective: "2.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has the following virtual networks, which are peered with each other.

    | Virtual network | Subnet | Prefix | Content |
    | --- | --- | --- | --- |
    | VNet-Hub (10.0.0.0/16) | AzureFirewallSubnet | 10.0.1.0/26 | Azure Firewall FW1, private IP 10.0.1.4 |
    | VNet-Hub (10.0.0.0/16) | snet-pe | 10.0.2.0/24 | Private endpoint of the SQL server sql-tailspin, IP 10.0.2.5 |
    | VNet-App (10.1.0.0/16) | snet-app | 10.1.1.0/24 | Application VMs |

    A route table named rt-app is associated with snet-app and contains a route for 0.0.0.0/0 with the next hop type **Virtual appliance** and the address 10.0.1.4. Network policies for private endpoints are disabled on snet-pe. The rules of FW1 already allow and SNAT the traffic from snet-app to sql-tailspin.

    The effective routes of the application VMs show that the traffic to 10.0.2.5 bypasses FW1.

    You need to ensure that the traffic from snet-app to the private endpoint goes through FW1.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose des réseaux virtuels suivants, reliés entre eux par peering.

    | Réseau virtuel | Sous-réseau | Préfixe | Contenu |
    | --- | --- | --- | --- |
    | VNet-Hub (10.0.0.0/16) | AzureFirewallSubnet | 10.0.1.0/26 | Pare-feu Azure FW1, adresse IP privée 10.0.1.4 |
    | VNet-Hub (10.0.0.0/16) | snet-pe | 10.0.2.0/24 | Point de terminaison privé du serveur SQL sql-tailspin, adresse IP 10.0.2.5 |
    | VNet-App (10.1.0.0/16) | snet-app | 10.1.1.0/24 | Machines virtuelles de l'application |

    Une table de routage nommée rt-app est associée à snet-app et contient un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant **Appliance virtuelle** et l'adresse 10.0.1.4. Les stratégies réseau des points de terminaison privés sont désactivées sur snet-pe. Les règles de FW1 autorisent déjà le trafic de snet-app vers sql-tailspin et lui appliquent la SNAT.

    Les itinéraires effectifs des machines virtuelles de l'application montrent que le trafic vers 10.0.2.5 contourne FW1.

    Le trafic de snet-app vers le point de terminaison privé doit passer par FW1.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the private endpoint network policies of snet-pe to RouteTableEnabled.", fr: "Régler les stratégies réseau des points de terminaison privés de snet-pe sur RouteTableEnabled." } }
    - { id: b, text: { en: "Add to rt-app a route for 10.0.2.0/24 with the next hop Virtual appliance 10.0.1.4.", fr: "Ajouter à rt-app un itinéraire pour 10.0.2.0/24 avec le tronçon suivant Appliance virtuelle 10.0.1.4." } }
    - { id: c, text: { en: "Associate with snet-pe a route table with a route for 0.0.0.0/0 to 10.0.1.4.", fr: "Associer à snet-pe une table de routage avec un itinéraire 0.0.0.0/0 vers 10.0.1.4." } }
    - { id: d, text: { en: "Set the private endpoint network policies of snet-app to Enabled.", fr: "Régler les stratégies réseau des points de terminaison privés de snet-app sur Enabled." } }
    - { id: e, text: { en: "Enable Use remote gateways on the peering from VNet-App to VNet-Hub.", fr: "Activer Use remote gateways sur le peering de VNet-App vers VNet-Hub." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: A private endpoint propagates a /32 route, which wins over 0.0.0.0/0 by longest prefix match, so the default route of rt-app never applies to 10.0.2.5. A user-defined route can override the private endpoint route only when network policies for route tables are enabled on the subnet that hosts the private endpoint, and the route must cover the private endpoint with a prefix at least as specific as the virtual network range, such as 10.0.2.0/24 in rt-app.
    fr: "Un point de terminaison privé propage un itinéraire /32, qui l'emporte sur 0.0.0.0/0 par correspondance du préfixe le plus long : l'itinéraire par défaut de rt-app ne s'applique donc jamais à 10.0.2.5. Un itinéraire défini par l'utilisateur ne peut remplacer l'itinéraire du point de terminaison privé que si les stratégies réseau pour les tables de routage sont activées sur le sous-réseau qui héberge le point de terminaison privé, et l'itinéraire doit couvrir le point de terminaison avec un préfixe au moins aussi spécifique que la plage du réseau virtuel, par exemple 10.0.2.0/24 dans rt-app."
  options:
    c: { en: "The traffic to redirect leaves snet-app; a route table on snet-pe does not change the path chosen by the application VMs.", fr: "Le trafic à rediriger part de snet-app ; une table de routage sur snet-pe ne change pas le chemin choisi par les machines virtuelles de l'application." }
    d: { en: "The setting must be enabled on the subnet that hosts the private endpoint, not on the client subnet.", fr: "Le paramètre doit être activé sur le sous-réseau qui héberge le point de terminaison privé, pas sur le sous-réseau client." }
    e: { en: "Use remote gateways concerns VPN or ExpressRoute gateways in the hub; it does not route traffic through FW1.", fr: "Use remote gateways concerne les passerelles VPN ou ExpressRoute du hub ; il ne fait pas passer le trafic par FW1." }
references:
  - title: Manage network policies for private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
