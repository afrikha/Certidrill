id: sc500-2c-fw-processing
objective: "2.3.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An Azure Firewall Standard named **fw-edge** uses a firewall policy named **fwp-child**, which inherits from a parent policy named **fwp-parent**. Threat intelligence in fwp-child is set to **Alert and deny**. fwp-child contains a DNAT rule that publishes TCP 443 of a web server on the public IP address of fw-edge.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Pare-feu Azure Standard nommé **fw-edge** utilise une stratégie de pare-feu nommée **fwp-child**, qui hérite d'une stratégie parente nommée **fwp-parent**. Le renseignement sur les menaces de fwp-child est réglé sur **Alert and deny**. fwp-child contient une règle DNAT qui publie le TCP 443 d'un serveur web sur l'adresse IP publique de fw-edge.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Internet traffic that matches the DNAT rule also needs a matching network rule to reach the web server.
        fr: Le trafic Internet qui correspond à la règle DNAT a aussi besoin d'une règle de réseau correspondante pour atteindre le serveur web.
    - id: s2
      text:
        en: A rule collection group of fwp-parent with priority 500 is processed before a rule collection group of fwp-child with priority 100.
        fr: Un groupe de collections de règles de fwp-parent de priorité 500 est traité avant un groupe de collections de règles de fwp-child de priorité 100.
    - id: s3
      text:
        en: Inbound traffic from an IP address flagged by threat intelligence is denied before the DNAT rule is evaluated.
        fr: Le trafic entrant issu d'une adresse IP signalée par le renseignement sur les menaces est refusé avant l'évaluation de la règle DNAT.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: When traffic matches a DNAT rule, the firewall translates and allows it, and the traffic is not subject to further processing by network rules. Rule collection groups of a parent policy always take precedence over those of the child policy, regardless of priority. Threat intelligence-based filtering is evaluated before NAT, network and application rules, so in Alert and deny mode it blocks flagged traffic first.
    fr: "Quand le trafic correspond à une règle DNAT, le pare-feu le traduit et l'autorise, et le trafic n'est plus traité par les règles de réseau. Les groupes de collections de règles d'une stratégie parente sont toujours prioritaires sur ceux de la stratégie enfant, quelle que soit la priorité. Le filtrage par renseignement sur les menaces est évalué avant les règles NAT, de réseau et d'application : en mode Alert and deny, il bloque d'abord le trafic signalé."
references:
  - title: Azure Firewall rule processing logic
    url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing
  - title: Azure Firewall threat intelligence-based filtering
    url: https://learn.microsoft.com/en-us/azure/firewall/threat-intel
