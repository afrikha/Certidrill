id: sc500-2b-avnm-allowrulesonly
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure Virtual Network Manager instance named NM1. A deployed security admin configuration named SAC1 targets a network group that contains 25 virtual networks. SAC1 contains an **Allow** rule for TCP 443 from the corporate range 10.200.0.0/16 and a **Deny** rule for TCP 3389 from Internet.

    One member, VNet-Data, contains an Azure SQL managed instance. You discover that no rule of SAC1 is applied to VNet-Data. The Allow rules of SAC1 must apply to VNet-Data, and the managed instance must keep working.

    What should you do?
  fr: |
    Vous disposez d'une instance Azure Virtual Network Manager nommée NM1. Une configuration d'administration de la sécurité déployée nommée SAC1 cible un groupe réseau qui contient 25 réseaux virtuels. SAC1 contient une règle **Allow** pour TCP 443 depuis la plage d'entreprise 10.200.0.0/16 et une règle **Deny** pour TCP 3389 depuis Internet.

    Un des membres, VNet-Data, contient une instance managée Azure SQL. Vous constatez qu'aucune règle de SAC1 n'est appliquée à VNet-Data. Les règles Allow de SAC1 doivent s'appliquer à VNet-Data, et l'instance managée doit continuer à fonctionner.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the priority of the Allow rule to 1 so that it is processed before the managed instance policies.", fr: "Changer la priorité de la règle Allow en 1 pour qu'elle soit traitée avant les stratégies de l'instance managée." } }
    - { id: b, text: { en: "Create a second security admin configuration for VNet-Data and deploy it to the same region.", fr: "Créer une seconde configuration d'administration de la sécurité pour VNet-Data et la déployer dans la même région." } }
    - { id: c, text: { en: "Set applyOnNetworkIntentPolicyBasedServices to AllowRulesOnly on SAC1, and then deploy SAC1 again.", fr: "Définir applyOnNetworkIntentPolicyBasedServices sur AllowRulesOnly dans SAC1, puis déployer à nouveau SAC1." } }
    - { id: d, text: { en: "Change VNet-Data from dynamic to static membership in the network group, and then deploy SAC1 again.", fr: "Faire passer VNet-Data d'une appartenance dynamique à une appartenance statique dans le groupe réseau, puis déployer à nouveau SAC1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      By default, security admin rules aren't applied to virtual networks that contain Azure SQL Managed Instance or Azure Databricks, because these services rely on network intent policies. Setting the security configuration property applyOnNetworkIntentPolicyBasedServices to AllowRulesOnly applies only the Allow rules to such virtual networks; Deny rules still aren't applied there, while other virtual networks keep both.
    fr: |-
      Par défaut, les règles d'administration de la sécurité ne sont pas appliquées aux réseaux virtuels qui contiennent Azure SQL Managed Instance ou Azure Databricks, car ces services s'appuient sur des stratégies d'intention réseau. Définir la propriété applyOnNetworkIntentPolicyBasedServices de la configuration sur AllowRulesOnly n'applique que les règles Allow à ces réseaux virtuels ; les règles Deny n'y sont toujours pas appliquées, tandis que les autres réseaux virtuels conservent les deux.
  options:
    a: { en: "Priority orders security admin rules among themselves; it doesn't lift the exclusion of virtual networks with network intent policies.", fr: "La priorité ordonne les règles d'administration de la sécurité entre elles ; elle ne lève pas l'exclusion des réseaux virtuels dotés de stratégies d'intention réseau." }
    b: { en: "Only one security admin configuration can be deployed per region, and a new one would face the same exclusion.", fr: "Une seule configuration d'administration de la sécurité peut être déployée par région, et une nouvelle configuration subirait la même exclusion." }
    d: { en: "The membership type doesn't matter; the exclusion comes from the managed instance in the virtual network.", fr: "Le type d'appartenance n'a pas d'importance ; l'exclusion vient de l'instance managée présente dans le réseau virtuel." }
references:
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
