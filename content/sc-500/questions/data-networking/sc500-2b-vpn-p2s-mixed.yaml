id: sc500-2b-vpn-p2s-mixed
objective: "2.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a VPN gateway named VPNGW1 of SKU VpnGw2AZ. Its point-to-site configuration is the following:

    | Setting | Value |
    | --- | --- |
    | Tunnel type | IKEv2 and OpenVPN (SSL) |
    | Authentication type | Microsoft Entra ID and Azure certificate |

    A Conditional Access policy requires multifactor authentication for the Azure VPN app.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une passerelle VPN nommée VPNGW1 de référence SKU VpnGw2AZ. Sa configuration point à site est la suivante :

    | Paramètre | Valeur |
    | --- | --- |
    | Type de tunnel | IKEv2 et OpenVPN (SSL) |
    | Type d'authentification | Microsoft Entra ID et certificat Azure |

    Une stratégie d'accès conditionnel exige l'authentification multifacteur pour l'application Azure VPN.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Users who authenticate with Microsoft Entra ID connect over OpenVPN by using the Azure VPN Client.", fr: "Les utilisateurs qui s'authentifient avec Microsoft Entra ID se connectent en OpenVPN avec Azure VPN Client." } }
    - { id: b, text: { en: "Users who authenticate with Microsoft Entra ID can connect over IKEv2 with the native VPN client.", fr: "Les utilisateurs qui s'authentifient avec Microsoft Entra ID peuvent se connecter en IKEv2 avec le client VPN natif." } }
    - { id: c, text: { en: "A macOS device with a client certificate issued from the uploaded root can connect over IKEv2.", fr: "Un appareil macOS doté d'un certificat client émis par la racine chargée peut se connecter en IKEv2." } }
    - { id: d, text: { en: "A Windows device with a client certificate can connect over SSTP.", fr: "Un appareil Windows doté d'un certificat client peut se connecter en SSTP." } }
    - { id: e, text: { en: "Users who connect with a client certificate are also prompted for multifactor authentication.", fr: "Les utilisateurs qui se connectent avec un certificat client sont aussi invités à effectuer l'authentification multifacteur." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      Microsoft Entra ID authentication is supported only with OpenVPN and the Azure VPN Client, so with IKEv2 and OpenVPN configured, Entra users connect over OpenVPN. Certificate authentication works with both configured tunnel types, and IKEv2 is supported on macOS 13.0 and later. SSTP isn't one of the configured tunnel types.
    fr: |-
      L'authentification Microsoft Entra ID n'est prise en charge qu'avec OpenVPN et Azure VPN Client : avec IKEv2 et OpenVPN configurés, les utilisateurs Entra se connectent en OpenVPN. L'authentification par certificat fonctionne avec les deux types de tunnel configurés, et IKEv2 est pris en charge sur macOS 13.0 et versions ultérieures. SSTP ne fait pas partie des types de tunnel configurés.
  options:
    b: { en: "IKEv2 doesn't support Microsoft Entra ID authentication; Entra users must use OpenVPN.", fr: "IKEv2 ne prend pas en charge l'authentification Microsoft Entra ID ; les utilisateurs Entra doivent utiliser OpenVPN." }
    d: { en: "The gateway is configured for IKEv2 and OpenVPN only, so SSTP connections aren't accepted.", fr: "La passerelle n'est configurée que pour IKEv2 et OpenVPN : les connexions SSTP ne sont pas acceptées." }
    e: { en: "Certificate authentication is validated by the gateway and doesn't go through Microsoft Entra ID, so Conditional Access doesn't apply to it.", fr: "L'authentification par certificat est validée par la passerelle et ne passe pas par Microsoft Entra ID : l'accès conditionnel ne s'y applique pas." }
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
