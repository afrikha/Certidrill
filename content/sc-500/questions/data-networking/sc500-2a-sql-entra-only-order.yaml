id: sc500-2a-sql-entra-only-order
objective: "2.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has an Azure SQL Database logical server named **sql-prose-hr**. All apps connect with SQL authentication, and no Microsoft Entra admin is configured. Each app runs on Azure App Service and has a system-assigned managed identity.

    You need to enforce Microsoft Entra-only authentication on sql-prose-hr. The apps must keep working.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. dispose d'un serveur logique Azure SQL Database nommé **sql-prose-hr**. Toutes les applications se connectent avec l'authentification SQL, et aucun administrateur Microsoft Entra n'est configuré. Chaque application s'exécute sur Azure App Service et dispose d'une identité managée affectée par le système.

    Vous devez imposer l'authentification Microsoft Entra uniquement sur sql-prose-hr. Les applications doivent continuer à fonctionner.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: admin, text: { en: "Set a Microsoft Entra group as the Microsoft Entra admin of sql-prose-hr.", fr: "Définir un groupe Microsoft Entra comme administrateur Microsoft Entra de sql-prose-hr." } }
    - { id: users, text: { en: "Create database users from the external provider for the managed identities, grant them roles, and update the apps' connection strings.", fr: "Créer des utilisateurs de base de données à partir du fournisseur externe pour les identités managées, leur accorder des rôles et mettre à jour les chaînes de connexion des applications." } }
    - { id: enable, text: { en: "Enable Microsoft Entra-only authentication on sql-prose-hr.", fr: "Activer l'authentification Microsoft Entra uniquement sur sql-prose-hr." } }
    - { id: drop, text: { en: "Drop the SQL logins of the apps from the master database.", fr: "Supprimer les connexions SQL des applications de la base de données master." } }
    - { id: pna, text: { en: "Set public network access of sql-prose-hr to Disable.", fr: "Définir l'accès réseau public de sql-prose-hr sur Disable." } }
    - { id: contrib, text: { en: "Assign the SQL Server Contributor role on sql-prose-hr to the managed identities.", fr: "Attribuer le rôle SQL Server Contributor sur sql-prose-hr aux identités managées." } }
answer:
  sequence: [ admin, users, enable ]
explanation:
  correct:
    en: |
      Microsoft Entra-only authentication can't be enabled until a Microsoft Entra admin is set, and that admin is also needed to create database users mapped to the managed identities. Once the apps authenticate with their managed identities, you enable Microsoft Entra-only authentication, which blocks SQL authentication without deleting the SQL logins.
    fr: |
      L'authentification Microsoft Entra uniquement ne peut pas être activée tant qu'aucun administrateur Microsoft Entra n'est défini, et cet administrateur est aussi nécessaire pour créer les utilisateurs de base de données associés aux identités managées. Une fois que les applications s'authentifient avec leurs identités managées, vous activez l'authentification Microsoft Entra uniquement, qui bloque l'authentification SQL sans supprimer les connexions SQL.
  options:
    drop: { en: "Dropping the logins isn't required: Microsoft Entra-only authentication already blocks them.", fr: "Supprimer les connexions n'est pas nécessaire : l'authentification Microsoft Entra uniquement les bloque déjà." }
    pna: { en: "Disabling public network access controls the network path, not the authentication method, and could cut the apps off.", fr: "Désactiver l'accès réseau public contrôle le chemin réseau, pas la méthode d'authentification, et pourrait couper les applications." }
    contrib: { en: "SQL Server Contributor is an Azure control plane role; it doesn't let an identity sign in to a database.", fr: "SQL Server Contributor est un rôle Azure du plan de contrôle ; il ne permet pas à une identité de se connecter à une base de données." }
references:
  - title: Microsoft Entra-only authentication with Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
