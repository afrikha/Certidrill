id: sc500-2a-def-unscanned
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a general-purpose v2 storage account named **stadatumdrop**. Defender for Storage is enabled on stadatumdrop with on-upload malware scanning. The monthly cap is far from being reached.

    Users and applications perform the following uploads:

    - A 2 GB block blob uploaded to a blob container
    - A 40 GB block blob uploaded to a blob container
    - A file uploaded to an Azure file share of stadatumdrop
    - An append blob written by a logging application
    - A block blob that overwrites an existing blob of the same name

    Which two uploads will NOT be scanned on upload?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un compte de stockage v2 universel nommé **stadatumdrop**. Defender for Storage est activé sur stadatumdrop avec l'analyse des programmes malveillants au chargement. Le plafond mensuel est loin d'être atteint.

    Des utilisateurs et des applications effectuent les chargements suivants :

    - un objet blob de blocs de 2 Go chargé dans un conteneur d'objets blob ;
    - un objet blob de blocs de 40 Go chargé dans un conteneur d'objets blob ;
    - un fichier chargé dans un partage de fichiers Azure de stadatumdrop ;
    - un objet blob d'ajout écrit par une application de journalisation ;
    - un objet blob de blocs qui remplace un objet blob existant du même nom.

    Quels sont les deux chargements qui ne seront PAS analysés au chargement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The 2 GB block blob", fr: "L'objet blob de blocs de 2 Go" } }
    - { id: b, text: { en: "The 40 GB block blob", fr: "L'objet blob de blocs de 40 Go" } }
    - { id: c, text: { en: "The file in the Azure file share", fr: "Le fichier du partage de fichiers Azure" } }
    - { id: d, text: { en: "The append blob", fr: "L'objet blob d'ajout" } }
    - { id: e, text: { en: "The block blob that overwrites an existing blob", fr: "L'objet blob de blocs qui remplace un objet blob existant" } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Malware scanning doesn't support Azure Files (neither on upload nor on demand), and append blobs and page blobs aren't supported either. Block blobs up to 50 GB are scanned when they are uploaded or modified, including when an upload overwrites an existing blob.
    fr: |
      L'analyse des programmes malveillants ne prend pas en charge Azure Files (ni au chargement ni à la demande), et les objets blob d'ajout et de pages ne sont pas pris en charge non plus. Les objets blob de blocs jusqu'à 50 Go sont analysés lors de leur chargement ou de leur modification, y compris quand un chargement remplace un objet blob existant.
  options:
    a:
      en: |
        A 2 GB block blob is well within the supported size and is scanned.
      fr: |
        Un objet blob de blocs de 2 Go est largement dans la taille prise en charge et il est analysé.
    b:
      en: |
        Blobs up to 50 GB can be scanned, so the 40 GB blob is scanned.
      fr: |
        Les objets blob jusqu'à 50 Go peuvent être analysés : l'objet blob de 40 Go est donc analysé.
    e:
      en: |
        On-upload scanning covers blobs that are uploaded or modified, so overwriting a blob triggers a new scan.
      fr: |
        L'analyse au chargement couvre les objets blob chargés ou modifiés : remplacer un objet blob déclenche une nouvelle analyse.
references:
  - title: Introduction to malware scanning
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-malware-scan
  - title: Prerequisites for Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/support-matrix-defender-for-storage
