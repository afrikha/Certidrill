id: sc500-2a-acct-cli-hardening
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a storage account named **sttailspin**. Several line-of-business apps access sttailspin by using connection strings that contain an account key. All clients support TLS 1.2.

    You need to update sttailspin to meet the following requirements:

    - Requests sent over HTTP must be rejected.
    - The minimum TLS version of sttailspin must be set to the version that Microsoft recommends.
    - Blobs must not be readable anonymously.
    - The line-of-business apps must keep working.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un compte de stockage nommé **sttailspin**. Plusieurs applications métier accèdent à sttailspin avec des chaînes de connexion qui contiennent une clé de compte. Tous les clients prennent en charge TLS 1.2.

    Vous devez mettre à jour sttailspin pour répondre aux exigences suivantes :

    - les requêtes envoyées en HTTP doivent être rejetées ;
    - la version TLS minimale de sttailspin doit être définie sur la version recommandée par Microsoft ;
    - les objets blob ne doivent pas pouvoir être lus de manière anonyme ;
    - les applications métier doivent continuer à fonctionner.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az storage account update --resource-group RG-Data --name sttailspin \
      [[https]] \
      --min-tls-version [[tls]] \
      [[anon]]
  slots:
    - id: https
      options:
        - { id: hon, text: "--https-only true" }
        - { id: hoff, text: "--https-only false" }
        - { id: deny, text: "--default-action Deny" }
    - id: tls
      options:
        - { id: t10, text: TLS1_0 }
        - { id: t11, text: TLS1_1 }
        - { id: t12, text: TLS1_2 }
    - id: anon
      options:
        - { id: blob, text: "--allow-blob-public-access false" }
        - { id: key, text: "--allow-shared-key-access false" }
        - { id: xrep, text: "--allow-cross-tenant-replication false" }
answer:
  values: { https: hon, tls: t12, anon: blob }
explanation:
  correct:
    en: |
      `--https-only true` enables Secure transfer required, so HTTP requests fail. `--min-tls-version TLS1_2` sets the recommended minimum, and TLS 1.2 clients keep working; Azure Storage no longer supports TLS 1.0 and 1.1 since February 3, 2026, and TLS 1.3 can't be enforced as the minimum. `--allow-blob-public-access false` disallows anonymous access for every container of the account.
    fr: |
      `--https-only true` active Secure transfer required : les requêtes HTTP échouent. `--min-tls-version TLS1_2` définit le minimum recommandé, et les clients TLS 1.2 continuent de fonctionner ; le Stockage Azure ne prend plus en charge TLS 1.0 et 1.1 depuis le 3 février 2026, et TLS 1.3 ne peut pas être imposé comme minimum. `--allow-blob-public-access false` interdit l'accès anonyme pour tous les conteneurs du compte.
  options:
    deny: { en: "The default action of the storage firewall controls network access, not the protocol of requests.", fr: "L'action par défaut du pare-feu de stockage contrôle l'accès réseau, pas le protocole des requêtes." }
    t11: { en: "TLS 1.1 isn't the recommended minimum, and Azure Storage no longer supports it.", fr: "TLS 1.1 n'est pas le minimum recommandé, et le Stockage Azure ne le prend plus en charge." }
    key: { en: "Disallowing Shared Key access would break the apps that use an account key.", fr: "Interdire l'accès par clé partagée casserait les applications qui utilisent une clé de compte." }
    xrep: { en: "Cross-tenant object replication is unrelated to anonymous read access.", fr: "La réplication d'objets entre locataires n'a aucun rapport avec l'accès anonyme en lecture." }
references:
  - title: Enforce a minimum required version of Transport Layer Security (TLS) for requests to a storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/transport-layer-security-configure-minimum-version
  - title: Migrate to Transport Layer Security (TLS) 1.2 for Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/transport-layer-security-configure-migrate-to-tls2
