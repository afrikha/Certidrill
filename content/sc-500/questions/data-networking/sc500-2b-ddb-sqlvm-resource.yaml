id: sc500-2b-ddb-sqlvm-resource
objective: "2.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure subscription named Sub1 that contains 30 SQL virtual machines. The **SQL Servers on Machines** plan of Defender for Databases is currently **On** for Sub1.

    To reduce costs, only the SQL virtual machine named **SQLVM-Finance** must remain protected by Defender for SQL servers on machines.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un abonnement Azure nommé Sub1 qui contient 30 machines virtuelles SQL. Le plan **SQL Servers on Machines** de Defender for Databases est actuellement **Activé** pour Sub1.

    Pour réduire les coûts, seule la machine virtuelle SQL nommée **SQLVM-Finance** doit rester protégée par Defender for SQL servers on machines.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: off, text: { en: "In Defender for Cloud, turn off the SQL Servers on Machines plan for Sub1.", fr: "Dans Defender for Cloud, désactiver le plan SQL Servers on Machines pour Sub1." } }
    - { id: open, text: { en: "In the Azure portal, open SQL virtual machines and select SQLVM-Finance.", fr: "Dans le portail Azure, ouvrir Machines virtuelles SQL et sélectionner SQLVM-Finance." } }
    - { id: page, text: { en: "Under the security menu, select Microsoft Defender for Cloud.", fr: "Dans le menu de sécurité, sélectionner Microsoft Defender for Cloud." } }
    - { id: enable, text: { en: "Select Enable Microsoft Defender for SQL servers on Machines.", fr: "Sélectionner Enable Microsoft Defender for SQL servers on Machines." } }
    - { id: sqldb, text: { en: "Turn on the Defender for Azure SQL Databases plan for Sub1.", fr: "Activer le plan Defender for Azure SQL Databases pour Sub1." } }
    - { id: srv, text: { en: "Turn on Defender for Servers Plan 1 for Sub1.", fr: "Activer Defender for Servers Plan 1 pour Sub1." } }
answer:
  sequence: [off, open, page, enable]
explanation:
  correct:
    en: |-
      To protect specific machines only, you first disable the plan at the subscription level, otherwise every SQL machine stays covered. You then open the SQL virtual machine (or the SQL Server instance enabled by Azure Arc), select Microsoft Defender for Cloud under its security menu and enable Defender for SQL servers on machines for that resource.
    fr: |-
      Pour ne protéger que certaines machines, il faut d'abord désactiver le plan au niveau de l'abonnement, sinon toutes les machines SQL restent couvertes. Ensuite, vous ouvrez la machine virtuelle SQL (ou l'instance SQL Server activée par Azure Arc), sélectionnez Microsoft Defender for Cloud dans son menu de sécurité et activez Defender for SQL servers on machines pour cette ressource.
  options:
    sqldb: { en: "Defender for Azure SQL Databases protects PaaS Azure SQL services; it would add cost without restricting the SQL machine plan.", fr: "Defender for Azure SQL Databases protège les services PaaS Azure SQL ; il ajouterait un coût sans restreindre le plan des machines SQL." }
    srv: { en: "Defender for Servers protects the operating system and doesn't replace the SQL plan.", fr: "Defender for Servers protège le système d'exploitation et ne remplace pas le plan SQL." }
references:
  - title: Enable Defender for SQL Servers on Machines
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-sql-usage
