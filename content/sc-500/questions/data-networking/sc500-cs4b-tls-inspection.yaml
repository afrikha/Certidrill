id: sc500-cs4b-tls-inspection
objective: "2.3.8"
type: multi
caseStudy: sc500-cs4b-blue-yonder-airlines
difficulty: 3
status: draft
stem:
  en: |
    You need to configure fw-hub to meet the requirement for the HTTPS traffic from VNet-App.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer fw-hub pour respecter l'exigence relative au trafic HTTPS de VNet-App.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create a user-assigned managed identity and grant it the Get and List secret permissions in a kv-netsec access policy.", fr: "Créer une identité managée affectée par l'utilisateur et lui accorder les autorisations de secret Get et List dans une stratégie d'accès de kv-netsec." } }
    - { id: b, text: { en: "Create a user-assigned managed identity and grant it the Get and List certificate permissions in a kv-netsec access policy.", fr: "Créer une identité managée affectée par l'utilisateur et lui accorder les autorisations de certificat Get et List dans une stratégie d'accès de kv-netsec." } }
    - { id: c, text: { en: "In fwp-hub, enable TLS inspection and select the managed identity and BYA-TLS-CA from kv-netsec.", fr: "Dans fwp-hub, activer l'inspection TLS et sélectionner l'identité managée et BYA-TLS-CA dans kv-netsec." } }
    - { id: d, text: { en: "In fwp-hub, enable TLS inspection on the application rules that allow HTTPS traffic from VNet-App.", fr: "Dans fwp-hub, activer l'inspection TLS sur les règles d'application qui autorisent le trafic HTTPS de VNet-App." } }
    - { id: e, text: { en: "In fwp-hub, set the IDPS mode to Alert and deny for the HTTPS traffic from VNet-App.", fr: "Dans fwp-hub, définir le mode IDPS sur Alert and deny pour le trafic HTTPS de VNet-App." } }
    - { id: f, text: { en: "Export the root CA certificate of BYA-TLS-CA and import it into kv-netsec as a secret.", fr: "Exporter le certificat d'autorité racine de BYA-TLS-CA et l'importer dans kv-netsec en tant que secret." } }
answer: { optionIds: [a, c, d] }
explanation:
  correct:
    en: |
      Azure Firewall Premium reads the intermediate CA certificate from Key Vault with a user-assigned managed identity, and only through the Secrets interface, so the identity needs Get and List secret permissions. The certificate imported as a certificate already has a matching secret. You then enable TLS inspection in the Premium firewall policy with that identity and certificate, and turn on TLS inspection on the application rules that must decrypt traffic.
    fr: |
      Azure Firewall Premium lit le certificat d'autorité intermédiaire dans Key Vault avec une identité managée affectée par l'utilisateur, et uniquement par l'interface des secrets : l'identité a besoin des autorisations de secret Get et List. Le certificat importé en tant que certificat dispose déjà d'un secret correspondant. Vous activez ensuite l'inspection TLS dans la stratégie de pare-feu Premium avec cette identité et ce certificat, puis l'inspection TLS sur les règles d'application qui doivent déchiffrer le trafic.
  options:
    b:
      en: |
        Azure Firewall accesses the certificate only through the Key Vault Secrets interface, so certificate permissions are not enough.
      fr: |
        Azure Firewall accède au certificat uniquement par l'interface des secrets de Key Vault : les autorisations de certificat ne suffisent pas.
    e:
      en: |
        IDPS detects attacks but does not decrypt traffic; it can inspect HTTPS payloads only after TLS inspection decrypts them.
      fr: |
        L'IDPS détecte les attaques mais ne déchiffre pas le trafic ; il ne peut inspecter le contenu HTTPS qu'après son déchiffrement par l'inspection TLS.
    f:
      en: |
        The firewall needs the intermediate CA certificate with its private key, which BYA-TLS-CA already provides; the root CA only has to be trusted by the clients, which is already the case.
      fr: |
        Le pare-feu a besoin du certificat d'autorité intermédiaire avec sa clé privée, que BYA-TLS-CA fournit déjà ; l'autorité racine doit seulement être approuvée par les clients, ce qui est déjà le cas.
references:
  - title: Azure Firewall Premium certificates
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-certificates
  - title: Azure Firewall Premium features implementation guide
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-features
