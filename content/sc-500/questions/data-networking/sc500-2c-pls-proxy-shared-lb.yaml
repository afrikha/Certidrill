id: sc500-2c-pls-proxy-shared-lb
objective: "2.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Standard Load Balancer named **lb-shared** has two frontend IP configurations. A Private Link service named **pls-a** uses the first frontend and a Private Link service named **pls-b** uses the second one. Both load-balancing rules use the same backend pool, named bp-web, and a TCP health probe.

    You need the application on the backend VMs to receive the source IP address of the consumers that connect through pls-a. The application can parse PROXY protocol v2 headers on every connection. The health probes of lb-shared must keep succeeding.

    What should you do?
  fr: |
    Un Standard Load Balancer nommé **lb-shared** a deux configurations IP frontales. Un service Private Link nommé **pls-a** utilise le premier front-end, et un service Private Link nommé **pls-b** le second. Les deux règles d'équilibrage de charge utilisent le même pool principal, nommé bp-web, et une sonde d'intégrité TCP.

    L'application des machines virtuelles du back-end doit recevoir l'adresse IP source des consommateurs qui se connectent par pls-a. L'application sait analyser les en-têtes PROXY protocol v2 sur toutes les connexions. Les sondes d'intégrité de lb-shared doivent continuer de réussir.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable TCP Proxy v2 on pls-a and on pls-b.", fr: "Activer TCP Proxy v2 sur pls-a et sur pls-b." }
    - id: b
      text: { en: "Enable TCP Proxy v2 on pls-a and replace the TCP probe with an HTTP probe.", fr: "Activer TCP Proxy v2 sur pls-a et remplacer la sonde TCP par une sonde HTTP." }
    - id: c
      text: { en: "Enable TCP Proxy v2 on pls-a only.", fr: "Activer TCP Proxy v2 uniquement sur pls-a." }
    - id: d
      text: { en: "Enable TCP Proxy v2 on pls-a and move pls-b to a new backend pool of lb-shared.", fr: "Activer TCP Proxy v2 sur pls-a et déplacer pls-b vers un nouveau pool principal de lb-shared." }
answer: { optionId: a }
explanation:
  correct:
    en: TCP Proxy v2 on a Private Link service applies to the load balancer and its backend VMs, and the PROXY header is also added to the health probes. When several Private Link services share the same load balancer or backend pool, you must configure TCP Proxy v2 on all of them, otherwise the health probes fail.
    fr: TCP Proxy v2 sur un service Private Link s'applique à l'équilibreur de charge et à ses machines virtuelles de back-end, et l'en-tête PROXY est aussi ajouté aux sondes d'intégrité. Quand plusieurs services Private Link partagent le même équilibreur de charge ou le même pool principal, vous devez configurer TCP Proxy v2 sur chacun d'eux, sinon les sondes d'intégrité échouent.
  options:
    c: { en: "With TCP Proxy v2 on only one of the services that share lb-shared, the health probes fail.", fr: "Avec TCP Proxy v2 sur un seul des services qui partagent lb-shared, les sondes d'intégrité échouent." }
    b: { en: "The PROXY header is included in both HTTP and TCP health probes, so changing the probe type does not help.", fr: "L'en-tête PROXY est inclus dans les sondes d'intégrité HTTP comme TCP : changer le type de sonde n'aide pas." }
    d: { en: "The requirement applies to services that share the same load balancer, not only the same backend pool.", fr: "L'exigence s'applique aux services qui partagent le même équilibreur de charge, pas seulement le même pool principal." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
