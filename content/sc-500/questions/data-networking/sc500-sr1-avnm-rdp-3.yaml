id: sc500-sr1-avnm-rdp-3
objective: "2.3.2"
type: series_yesno
series: sc500-sr1-avnm-rdp
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You deploy a Deny security admin rule to a network group with static membership.
  fr: Vous déployez une règle d'administrateur de la sécurité Deny sur un groupe réseau à appartenance statique.
body:
  solution:
    en: |
      In NM1, you create a network group named **NG1** with **static** membership, and you add the 40 virtual networks to NG1. You create a security admin configuration with a rule collection that targets NG1 and contains an inbound rule with the action **Deny** for TCP port 3389 from the **Internet** service tag. You deploy the configuration to East US and West Europe.
    fr: |
      Dans NM1, vous créez un groupe réseau nommé **NG1** avec une appartenance **statique**, et vous ajoutez les 40 réseaux virtuels à NG1. Vous créez une configuration d'administrateur de sécurité avec un regroupement de règles qui cible NG1 et contient une règle de trafic entrant avec l'action **Deny** pour le port TCP 3389 depuis la balise de service **Internet**. Vous déployez la configuration dans East US et West Europe.
answer: { value: false }
explanation:
  correct:
    en: |
      The Deny rule does block port 3389 for the 40 virtual networks, whatever their NSGs contain. However, static members are virtual networks that you select manually: the virtual networks created later are not added to NG1, so the rule does not apply to them and the first requirement is not met. Dynamic membership based on an Azure Policy condition is needed.
    fr: |
      La règle Deny bloque bien le port 3389 pour les 40 réseaux virtuels, quel que soit le contenu de leurs NSG. Cependant, les membres statiques sont des réseaux virtuels que vous sélectionnez manuellement : les réseaux virtuels créés ultérieurement ne sont pas ajoutés à NG1, donc la règle ne s'y applique pas et la première exigence n'est pas respectée. Une appartenance dynamique basée sur une condition Azure Policy est nécessaire.
references:
  - title: What is a network group in Azure Virtual Network Manager?
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-network-groups
