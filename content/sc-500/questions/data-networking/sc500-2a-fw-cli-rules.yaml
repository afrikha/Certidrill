id: sc500-2a-fw-cli-rules
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a storage account named **stlitwareweb** in a resource group named **RG-Data**. A subnet named **snet-web** of a virtual network named **VNet-App** has the Microsoft.Storage service endpoint enabled.

    You need to configure the storage firewall to meet the following requirements:

    - Requests that match no rule must be denied.
    - Azure services on the trusted services list must keep access.
    - Resources in snet-web must be allowed.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'un compte de stockage nommé **stlitwareweb** dans un groupe de ressources nommé **RG-Data**. Un sous-réseau nommé **snet-web** du réseau virtuel **VNet-App** a le point de terminaison de service Microsoft.Storage activé.

    Vous devez configurer le pare-feu de stockage pour répondre aux exigences suivantes :

    - les requêtes qui ne correspondent à aucune règle doivent être refusées ;
    - les services Azure de la liste des services approuvés doivent conserver leur accès ;
    - les ressources de snet-web doivent être autorisées.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az storage account update --resource-group RG-Data --name stlitwareweb \
      --default-action [[def]] --bypass [[byp]]

    az storage account network-rule add --resource-group RG-Data \
      --account-name stlitwareweb --vnet-name VNet-App [[rule]]
  slots:
    - id: def
      options:
        - { id: allow, text: Allow }
        - { id: deny, text: Deny }
    - id: byp
      options:
        - { id: azure, text: AzureServices }
        - { id: logmet, text: Logging Metrics }
        - { id: none, text: None }
    - id: rule
      options:
        - { id: subnet, text: "--subnet snet-web" }
        - { id: ip, text: "--ip-address 10.20.1.0/24" }
        - { id: tenant, text: "--tenant-id $tenantId" }
answer:
  values: { def: deny, byp: azure, rule: subnet }
explanation:
  correct:
    en: |
      `--default-action Deny` denies every request that no rule allows. `--bypass AzureServices` keeps the trusted services exception. `az storage account network-rule add --vnet-name VNet-App --subnet snet-web` adds the virtual network rule for the subnet, which already has the service endpoint.
    fr: |
      `--default-action Deny` refuse toute requête qu'aucune règle n'autorise. `--bypass AzureServices` conserve l'exception des services approuvés. `az storage account network-rule add --vnet-name VNet-App --subnet snet-web` ajoute la règle de réseau virtuel pour le sous-réseau, qui dispose déjà du point de terminaison de service.
  options:
    allow: { en: "With Allow, the rules have no effect because every network is admitted.", fr: "Avec Allow, les règles n'ont aucun effet, car tous les réseaux sont admis." }
    logmet: { en: "Logging and Metrics only allow read access to logs and metrics, not trusted services.", fr: "Logging et Metrics n'autorisent que la lecture des journaux et des métriques, pas les services approuvés." }
    none: { en: "None removes every exception, including trusted services.", fr: "None supprime toutes les exceptions, y compris les services approuvés." }
    ip: { en: "IP network rules don't accept private ranges, and subnet traffic with a service endpoint uses private addresses.", fr: "Les règles de réseau IP n'acceptent pas les plages privées, et le trafic d'un sous-réseau doté d'un point de terminaison de service utilise des adresses privées." }
    tenant: { en: "--tenant-id belongs to resource instance rules, used with --resource-id.", fr: "--tenant-id appartient aux règles d'instance de ressource, utilisé avec --resource-id." }
references:
  - title: az storage account network-rule
    url: https://learn.microsoft.com/en-us/cli/azure/storage/account/network-rule
