id: sc500-2a-acct-immutable-worm
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. stores regulatory audit exports in a container named **audit-exports** in a storage account named **stlitwarereg**.

    The exports must meet the following requirements:

    - For seven years after they are written, no user, including subscription owners, can modify or delete them.
    - The retention period might have to be extended later.

    What should you configure on audit-exports?
  fr: |
    Litware, Inc. stocke des exports d'audit réglementaire dans un conteneur nommé **audit-exports** d'un compte de stockage nommé **stlitwarereg**.

    Les exports doivent répondre aux exigences suivantes :

    - pendant sept ans après leur écriture, aucun utilisateur, y compris les propriétaires de l'abonnement, ne peut les modifier ni les supprimer ;
    - la période de rétention devra peut-être être prolongée ultérieurement.

    Que devez-vous configurer sur audit-exports ?
body:
  options:
    - { id: a, text: { en: "A time-based retention policy of seven years that is left unlocked", fr: "Une stratégie de rétention limitée dans le temps de sept ans laissée déverrouillée" } }
    - { id: b, text: { en: "A legal hold with a tag that identifies the audit period", fr: "Une conservation légale avec une balise qui identifie la période d'audit" } }
    - { id: c, text: { en: "A time-based retention policy of seven years that is locked", fr: "Une stratégie de rétention limitée dans le temps de sept ans verrouillée" } }
    - { id: d, text: { en: "A CanNotDelete resource lock on stlitwarereg", fr: "Un verrou Suppression (CanNotDelete) sur stlitwarereg" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A locked time-based retention policy keeps blobs in a WORM state for the retention interval: nobody can modify or delete them, and the policy itself can't be deleted or shortened. A locked policy can still be extended, which meets the second requirement.
    fr: |
      Une stratégie de rétention limitée dans le temps verrouillée maintient les objets blob en état WORM pendant l'intervalle de rétention : personne ne peut les modifier ni les supprimer, et la stratégie elle-même ne peut être ni supprimée ni raccourcie. Une stratégie verrouillée peut toutefois être prolongée, ce qui répond à la seconde exigence.
  options:
    a:
      en: |
        An unlocked policy can be shortened or deleted by a user with sufficient permissions, so it doesn't guarantee seven years of protection; use it only for testing.
      fr: |
        Une stratégie déverrouillée peut être raccourcie ou supprimée par un utilisateur disposant des autorisations nécessaires : elle ne garantit pas sept ans de protection et ne sert qu'aux tests.
    b:
      en: |
        A legal hold has no retention period: an authorized user can clear it at any time, after which the data can be deleted.
      fr: |
        Une conservation légale n'a pas de période de rétention : un utilisateur autorisé peut la lever à tout moment, après quoi les données peuvent être supprimées.
    d:
      en: |
        A resource lock protects the storage account resource and its configuration, not the blobs inside it.
      fr: |
        Un verrou de ressource protège la ressource compte de stockage et sa configuration, pas les objets blob qu'elle contient.
references:
  - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
