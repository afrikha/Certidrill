id: sc500-2a-def-soft-delete
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a storage account named **stwgclaims** where customers upload documents. Defender for Storage is enabled with on-upload malware scanning.

    You need to ensure that a blob identified as malicious is removed from the view of downstream applications automatically, while the security team can still restore it for analysis for 14 days. The solution must minimize development effort.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un compte de stockage nommé **stwgclaims** dans lequel des clients chargent des documents. Defender for Storage est activé avec l'analyse des programmes malveillants au chargement.

    Vous devez faire en sorte qu'un objet blob identifié comme malveillant soit automatiquement retiré de la vue des applications en aval, tout en permettant à l'équipe de sécurité de le restaurer pour analyse pendant 14 jours. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable blob versioning on stwgclaims and set the version retention to 14 days.", fr: "Activer le contrôle de version des objets blob sur stwgclaims et définir la rétention des versions sur 14 jours." } }
    - { id: b, text: { en: "Turn on soft delete malicious blobs and set the blob soft delete retention to 14 days.", fr: "Activer soft delete malicious blobs et définir la rétention de la suppression réversible des objets blob sur 14 jours." } }
    - { id: c, text: { en: "Enable container soft delete on stwgclaims with a retention of 14 days.", fr: "Activer la suppression réversible des conteneurs sur stwgclaims avec une rétention de 14 jours." } }
    - { id: d, text: { en: "Turn on sensitive data threat detection and set the alert severity to High.", fr: "Activer la détection des menaces sur les données sensibles et définir la gravité des alertes sur High." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The built-in soft delete malicious blobs option, off by default, soft-deletes every blob that on-upload or on-demand scanning finds malicious, and it enables blob soft delete if needed (7 days by default, adjustable from 1 to 365 days). Soft-deleted blobs can be restored, and no code is required.
    fr: |
      L'option intégrée soft delete malicious blobs, désactivée par défaut, supprime de manière réversible chaque objet blob que l'analyse au chargement ou à la demande juge malveillant, et elle active la suppression réversible des objets blob si nécessaire (7 jours par défaut, réglable de 1 à 365 jours). Les objets blob supprimés de manière réversible peuvent être restaurés, et aucun code n'est nécessaire.
  options:
    a:
      en: |
        Versioning keeps previous versions when a blob changes; it doesn't remove a malicious blob by itself.
      fr: |
        Le contrôle de version conserve les versions précédentes quand un objet blob change ; il ne retire pas à lui seul un objet blob malveillant.
    c:
      en: |
        Container soft delete protects deleted containers; nothing deletes the malicious blobs in the first place.
      fr: |
        La suppression réversible des conteneurs protège les conteneurs supprimés ; rien ne supprime au départ les objets blob malveillants.
    d:
      en: |
        Sensitive data threat detection affects alert prioritization; it takes no action on blobs.
      fr: |
        La détection des menaces sur les données sensibles influe sur la priorisation des alertes ; elle n'agit pas sur les objets blob.
references:
  - title: Set up automated remediation for malware detection
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-configure-malware-scan
