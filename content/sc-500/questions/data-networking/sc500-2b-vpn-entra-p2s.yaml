id: sc500-2b-vpn-entra-p2s
objective: "2.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a VPN gateway named VPNGW1 of SKU VpnGw1AZ in Azure Public. Remote employees use Windows 11 devices and Microsoft Entra accounts. Their point-to-site VPN sign-ins must be subject to a Conditional Access policy that requires multifactor authentication. You want to use the Microsoft-registered Azure VPN Client app.

    How should you complete the point-to-site configuration of VPNGW1? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une passerelle VPN nommée VPNGW1 de référence SKU VpnGw1AZ dans Azure Public. Les employés distants utilisent des appareils Windows 11 et des comptes Microsoft Entra. Leurs connexions VPN point à site doivent être soumises à une stratégie d'accès conditionnel qui exige l'authentification multifacteur. Vous voulez utiliser l'application Azure VPN Client inscrite par Microsoft.

    Comment devez-vous compléter la configuration point à site de VPNGW1 ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Tunnel type: [[tunnel]]

      Authentication type: [[auth]]

      Issuer: [[issuer]]
    fr: |
      Type de tunnel : [[tunnel]]

      Type d'authentification : [[auth]]

      Émetteur (Issuer) : [[issuer]]
  slots:
    - id: tunnel
      options:
        - { id: ikev2, text: IKEv2 }
        - { id: openvpn, text: OpenVPN (SSL) }
        - { id: sstp, text: SSTP (SSL) }
    - id: auth
      options:
        - { id: cert, text: { en: "Azure certificate", fr: "Certificat Azure" } }
        - { id: radius, text: RADIUS }
        - { id: entra, text: Microsoft Entra ID }
    - id: issuer
      options:
        - { id: sts, text: "https://sts.windows.net/{TenantID}/" }
        - { id: login, text: "https://login.microsoftonline.com/{TenantID}" }
        - { id: appid, text: "c632b3df-fb67-4d84-bdcf-b95ad541b5c8" }
answer:
  values: { tunnel: openvpn, auth: entra, issuer: sts }
explanation:
  correct:
    en: |-
      Conditional Access and MFA require Microsoft Entra ID authentication, which is supported only with the OpenVPN tunnel type and the Azure VPN Client. The Issuer is https://sts.windows.net/{TenantID}/ with a trailing slash; the login.microsoftonline.com URL is the Tenant value, and the Microsoft-registered app ID is the Audience value.
    fr: |-
      L'accès conditionnel et la MFA exigent l'authentification Microsoft Entra ID, qui n'est prise en charge qu'avec le type de tunnel OpenVPN et Azure VPN Client. L'émetteur est https://sts.windows.net/{TenantID}/ avec une barre oblique finale ; l'URL login.microsoftonline.com est la valeur Tenant, et l'ID d'application inscrit par Microsoft est la valeur Audience.
  options:
    ikev2: { en: "IKEv2 doesn't support Microsoft Entra ID authentication.", fr: "IKEv2 ne prend pas en charge l'authentification Microsoft Entra ID." }
    sstp: { en: "SSTP supports only RADIUS or certificate authentication.", fr: "SSTP ne prend en charge que l'authentification RADIUS ou par certificat." }
    cert: { en: "Certificate authentication is validated by the gateway and can't enforce Conditional Access.", fr: "L'authentification par certificat est validée par la passerelle et ne peut pas imposer l'accès conditionnel." }
    radius: { en: "RADIUS uses domain credentials through a RADIUS server, not Microsoft Entra Conditional Access.", fr: "RADIUS utilise des informations d'identification de domaine via un serveur RADIUS, pas l'accès conditionnel Microsoft Entra." }
    login: { en: "This URL is the format of the Tenant field.", fr: "Cette URL est le format du champ Tenant." }
    appid: { en: "This GUID is the Audience value of the Microsoft-registered Azure VPN Client app.", fr: "Ce GUID est la valeur Audience de l'application Azure VPN Client inscrite par Microsoft." }
references:
  - title: Configure P2S VPN Gateway for Microsoft Entra ID Authentication
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway
