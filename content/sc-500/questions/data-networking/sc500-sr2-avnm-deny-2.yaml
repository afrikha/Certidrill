id: sc500-sr2-avnm-deny-2
objective: "2.3.2"
type: series_yesno
series: sc500-sr2-avnm-deny
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You deploy a Deny security admin rule to a network group that has static membership.
  fr: Vous déployez une règle d'administration de sécurité Deny sur un groupe réseau à appartenance statique.
body:
  solution:
    en: |
      In AVNM1, you perform the following actions:

      1. You create a network group named **NG-Prod** and manually add all the existing virtual networks that have the tag **env: prod** as static members.
      2. You create a security admin configuration that contains a rule collection targeting NG-Prod, with one rule: **Action** Deny, **Direction** Inbound, **Priority** 100, **Protocol** TCP, **Source** the **Internet** service tag, **Destination port** 22, 3389.
      3. You deploy the security admin configuration to West Europe.
    fr: |
      Dans AVNM1, vous effectuez les actions suivantes :

      1. Vous créez un groupe réseau nommé **NG-Prod** et y ajoutez manuellement, comme membres statiques, tous les réseaux virtuels existants qui portent l'étiquette **env: prod**.
      2. Vous créez une configuration d'administration de sécurité qui contient un regroupement de règles ciblant NG-Prod, avec une règle : **Action** Deny, **Direction** Inbound, **Priority** 100, **Protocol** TCP, **Source** la balise de service **Internet**, **Destination port** 22, 3389.
      3. Vous déployez la configuration d'administration de sécurité dans West Europe.
answer: { value: false }
explanation:
  correct:
    en: The Deny rule protects the current members, but static membership contains only the virtual networks that you selected. The production networks created every month stay outside NG-Prod until someone adds them by hand, so they are not protected and the effort is not minimal.
    fr: "La règle Deny protège les membres actuels, mais une appartenance statique ne contient que les réseaux virtuels que vous avez sélectionnés. Les réseaux de production créés chaque mois restent hors de NG-Prod tant que quelqu'un ne les ajoute pas manuellement : ils ne sont pas protégés et l'effort n'est pas minimal."
references:
  - title: What is a network group in Azure Virtual Network Manager?
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-network-groups
