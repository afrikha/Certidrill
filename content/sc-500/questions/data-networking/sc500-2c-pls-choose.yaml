id: sc500-2c-pls-choose
objective: "2.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs a SaaS API on virtual machines behind an internal Standard Load Balancer in a virtual network named **VNet-Svc** (10.0.0.0/16).

    Several customers, each with its own Microsoft Entra tenant, must reach the API privately from their own virtual networks. Some customer virtual networks also use the 10.0.0.0/16 address space. The traffic must not cross the internet.

    What should Litware create?
  fr: |
    Litware exécute une API SaaS sur des machines virtuelles derrière un Standard Load Balancer interne dans un réseau virtuel nommé **VNet-Svc** (10.0.0.0/16).

    Plusieurs clients, chacun avec son propre locataire Microsoft Entra, doivent joindre l'API de manière privée depuis leurs propres réseaux virtuels. Certains réseaux virtuels clients utilisent aussi l'espace d'adressage 10.0.0.0/16. Le trafic ne doit pas passer par Internet.

    Que doit créer Litware ?
body:
  options:
    - id: a
      text: { en: "A Private Link service on the load balancer frontend", fr: "Un service Private Link sur le front-end de l'équilibreur de charge" }
    - id: b
      text: { en: "A private endpoint in VNet-Svc for each customer", fr: "Un point de terminaison privé dans VNet-Svc pour chaque client" }
    - id: c
      text: { en: "A virtual network peering with each customer virtual network", fr: "Un peering de réseaux virtuels avec chaque réseau virtuel client" }
    - id: d
      text: { en: "A service endpoint on the subnet of the backend pool", fr: "Un point de terminaison de service sur le sous-réseau du pool principal" }
answer: { optionId: a }
explanation:
  correct:
    en: A Private Link service publishes a service that runs behind a Standard Load Balancer. Each customer creates a private endpoint in its own virtual network, in any tenant, and the service applies NAT so overlapping address spaces are not a problem.
    fr: "Un service Private Link publie un service exécuté derrière un Standard Load Balancer. Chaque client crée un point de terminaison privé dans son propre réseau virtuel, quel que soit le locataire, et le service applique une NAT : le chevauchement des espaces d'adressage ne pose pas de problème."
  options:
    c: { en: "Peering requires non-overlapping address spaces and exposes the whole virtual network instead of one service.", fr: "Le peering exige des espaces d'adressage qui ne se chevauchent pas et expose tout le réseau virtuel au lieu d'un seul service." }
    b: { en: "Private endpoints are created by the consumers in their own networks; a private endpoint in VNet-Svc would serve VNet-Svc clients.", fr: "Les points de terminaison privés sont créés par les consommateurs dans leurs propres réseaux ; un point de terminaison privé dans VNet-Svc servirait les clients de VNet-Svc." }
    d: { en: "Service endpoints secure access to Azure PaaS services from a subnet; they do not publish a customer service.", fr: "Les points de terminaison de service sécurisent l'accès aux services PaaS Azure depuis un sous-réseau ; ils ne publient pas un service client." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
