id: sc500-2a-def-components
objective: "2.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. plans to enable Defender for Storage on a storage account named **stproseshare** that already contains two million blobs. The security team has four requirements.

    Which Defender for Storage capability meets each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. prévoit d'activer Defender for Storage sur un compte de stockage nommé **stproseshare** qui contient déjà deux millions d'objets blob. L'équipe de sécurité a quatre exigences.

    Quelle fonctionnalité de Defender for Storage répond à chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: activity, text: { en: "Activity monitoring", fr: "Surveillance de l'activité" } }
    - { id: onupload, text: { en: "On-upload malware scanning", fr: "Analyse des programmes malveillants au chargement" } }
    - { id: ondemand, text: { en: "On-demand malware scanning", fr: "Analyse des programmes malveillants à la demande" } }
    - { id: sensitive, text: { en: "Sensitive data threat detection", fr: "Détection des menaces sur les données sensibles" } }
    - { id: tags, text: { en: "Blob index tags of scan results", fr: "Balises d'index de blob des résultats d'analyse" } }
  targets:
    - id: t1
      text: { en: "Raise an alert when an unusual amount of data is extracted from a container.", fr: "Déclencher une alerte quand une quantité inhabituelle de données est extraite d'un conteneur." }
    - id: t2
      text: { en: "Scan each blob as soon as it is written.", fr: "Analyser chaque objet blob dès qu'il est écrit." }
    - id: t3
      text: { en: "Check the blobs that were stored before the plan was enabled.", fr: "Vérifier les objets blob stockés avant l'activation du plan." }
    - id: t4
      text: { en: "Help prioritize the alerts of accounts that hold credit card numbers.", fr: "Aider à prioriser les alertes des comptes qui contiennent des numéros de carte bancaire." }
answer:
  mapping: { t1: activity, t2: onupload, t3: ondemand, t4: sensitive }
explanation:
  correct:
    en: |
      Activity monitoring analyzes data plane and control plane telemetry and alerts on suspicious behavior such as unusual data extraction. On-upload scanning checks blobs when they are uploaded or modified, while on-demand scanning checks existing blobs in the whole account, a container, a path prefix or a single blob. Sensitive data threat detection identifies sensitive information types with smart sampling so that alerts on those accounts can be prioritized.
    fr: |
      La surveillance de l'activité analyse la télémétrie du plan de données et du plan de contrôle et alerte sur les comportements suspects comme une extraction inhabituelle de données. L'analyse au chargement vérifie les objets blob lors de leur chargement ou de leur modification, tandis que l'analyse à la demande vérifie les objets blob existants de tout le compte, d'un conteneur, d'un préfixe de chemin ou d'un seul objet blob. La détection des menaces sur les données sensibles identifie les types d'informations sensibles par échantillonnage intelligent pour prioriser les alertes de ces comptes.
  options:
    tags: { en: "Index tags only store each blob's scan verdict; they don't detect anything by themselves.", fr: "Les balises d'index ne stockent que le verdict d'analyse de chaque objet blob ; elles ne détectent rien par elles-mêmes." }
references:
  - title: What is Microsoft Defender for Storage
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction
