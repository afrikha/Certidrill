id: sc500-2b-vpn-match-multi
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You configure a custom IPsec/IKE policy on a site-to-site connection between an Azure VPN gateway and a third-party VPN device at a branch office. The tunnel must establish with this policy.

    Which two sets of values must the branch VPN device match or contain?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez une stratégie IPsec/IKE personnalisée sur une connexion site à site entre une passerelle VPN Azure et un équipement VPN tiers d'une succursale. Le tunnel doit s'établir avec cette stratégie.

    Quels sont les deux ensembles de valeurs que l'équipement VPN de la succursale doit reproduire ou inclure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "IKE encryption, IKE integrity and DH group", fr: "Chiffrement IKE, intégrité IKE et groupe DH" } }
    - { id: b, text: { en: "Quick Mode SA lifetime in seconds and in kilobytes", fr: "Durée de vie de l'association de sécurité en mode rapide, en secondes et en kilo-octets" } }
    - { id: c, text: { en: "IPsec encryption, IPsec integrity and PFS group", fr: "Chiffrement IPsec, intégrité IPsec et groupe PFS" } }
    - { id: d, text: { en: "SKU and generation of the Azure VPN gateway", fr: "Référence SKU et génération de la passerelle VPN Azure" } }
    - { id: e, text: { en: "Address pool of the point-to-site configuration", fr: "Pool d'adresses de la configuration point à site" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |-
      The on-premises device must match or contain the Main Mode (phase 1) values, IKE encryption, IKE integrity and DH group, and the Quick Mode (phase 2) values, IPsec encryption, IPsec integrity and PFS group. Once a custom policy is set, the Azure gateway sends and accepts only that exact proposal on the connection.
    fr: |-
      L'équipement local doit reproduire ou inclure les valeurs du mode principal (phase 1), chiffrement IKE, intégrité IKE et groupe DH, et celles du mode rapide (phase 2), chiffrement IPsec, intégrité IPsec et groupe PFS. Une fois la stratégie personnalisée définie, la passerelle Azure n'envoie et n'accepte que cette proposition exacte sur la connexion.
  options:
    b: { en: "SA lifetimes are local settings and don't need to match the remote device.", fr: "Les durées de vie des associations de sécurité sont des paramètres locaux et n'ont pas besoin de correspondre à l'équipement distant." }
    d: { en: "The gateway SKU decides whether custom policies are supported, but it isn't negotiated with the branch device.", fr: "La référence SKU de la passerelle détermine si les stratégies personnalisées sont prises en charge, mais elle n'est pas négociée avec l'équipement de la succursale." }
    e: { en: "The point-to-site address pool concerns client connections, not the site-to-site tunnel.", fr: "Le pool d'adresses point à site concerne les connexions clientes, pas le tunnel site à site." }
references:
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
