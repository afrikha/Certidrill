id: sc500-2b-gsa-objects-dragdrop
objective: "2.3.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is designing its Microsoft Entra Private Access deployment.

    Which object should you use for each requirement? To answer, drag the appropriate objects to the correct requirements. Each object may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit son déploiement de Microsoft Entra Private Access.

    Quel objet devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les objets appropriés vers les exigences correspondantes. Chaque objet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: qa, text: Quick Access }
    - { id: gsaapp, text: { en: "Global Secure Access app (per-app access)", fr: "Application Global Secure Access (accès par application)" } }
    - { id: cg, text: { en: "Connector group", fr: "Groupe de connecteurs" } }
    - { id: profile, text: { en: "Private access traffic forwarding profile", fr: "Profil de transfert du trafic Private access" } }
    - { id: appproxy, text: { en: "Application Proxy app with pre-authentication", fr: "Application Application Proxy avec préauthentification" } }
  targets:
    - id: t1
      text: { en: "Publish the broad set of private IP ranges that replaces the VPN", fr: "Publier l'ensemble étendu de plages IP privées qui remplace le VPN" }
    - id: t2
      text: { en: "Give three servers their own user assignments and stricter Conditional Access policies", fr: "Donner à trois serveurs leurs propres attributions d'utilisateurs et des stratégies d'accès conditionnel plus strictes" }
    - id: t3
      text: { en: "Choose which connectors serve the apps of the Singapore site", fr: "Choisir les connecteurs qui desservent les applications du site de Singapour" }
    - id: t4
      text: { en: "Make the client on users' devices tunnel traffic to private resources", fr: "Faire en sorte que le client des appareils des utilisateurs fasse passer le trafic vers les ressources privées dans le tunnel" }
answer:
  mapping: { t1: qa, t2: gsaapp, t3: cg, t4: profile }
explanation:
  correct:
    en: |-
      Quick Access is the primary group of FQDNs, IP addresses and ranges always tunneled through the service, used to replace the VPN. A Global Secure Access app gives a subset of resources its own assignments and Conditional Access policies. Each app is served by a connector group, and the Private access traffic forwarding profile routes the client's private traffic to the service.
    fr: |-
      Quick Access est le groupe principal de FQDN, d'adresses IP et de plages toujours acheminés par le service, utilisé pour remplacer le VPN. Une application Global Secure Access donne à un sous-ensemble de ressources ses propres attributions et stratégies d'accès conditionnel. Chaque application est desservie par un groupe de connecteurs, et le profil de transfert du trafic Private access achemine le trafic privé du client vers le service.
  options:
    appproxy: { en: "Application Proxy publishes web apps through a URL; Private Access apps cover IP, FQDN and port segments for the Global Secure Access client.", fr: "Application Proxy publie des applications web par une URL ; les applications Private Access couvrent des segments IP, FQDN et ports pour le client Global Secure Access." }
references:
  - title: Learn about Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access
  - title: Manage Private Access traffic forwarding profiles
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-manage-private-access-profile
