id: sc500-2b-gsa-setup-order
objective: "2.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is deploying Microsoft Entra Private Access for the first time. No private network connector is installed yet. The licenses and administrator roles are in place.

    You need to give the group GRP-Engineering access to the subnet 10.20.0.0/16 on TCP 22 through Quick Access.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys déploie Microsoft Entra Private Access pour la première fois. Aucun connecteur de réseau privé n'est encore installé. Les licences et les rôles d'administrateur sont en place.

    Vous devez donner au groupe GRP-Engineering l'accès au sous-réseau 10.20.0.0/16 sur TCP 22 par Quick Access.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: install, text: { en: "Install and register the private network connector on a Windows Server that can reach 10.20.0.0/16.", fr: "Installer et inscrire le connecteur de réseau privé sur un serveur Windows Server qui peut atteindre 10.20.0.0/16." } }
    - { id: group, text: { en: "Create a connector group that contains the connector.", fr: "Créer un groupe de connecteurs qui contient le connecteur." } }
    - { id: qa, text: { en: "Configure Quick Access with the connector group and a segment for 10.20.0.0/16 on TCP 22.", fr: "Configurer Quick Access avec le groupe de connecteurs et un segment pour 10.20.0.0/16 sur TCP 22." } }
    - { id: assign, text: { en: "Assign GRP-Engineering to the Quick Access app.", fr: "Attribuer GRP-Engineering à l'application Quick Access." } }
    - { id: inbound, text: { en: "Allow inbound TCP 443 from the internet to the connector server.", fr: "Autoriser TCP 443 entrant depuis Internet vers le serveur de connecteur." } }
    - { id: vpngw, text: { en: "Create a point-to-site VPN gateway for the engineering users.", fr: "Créer une passerelle VPN point à site pour les ingénieurs." } }
answer:
  sequence: [install, group, qa, assign]
explanation:
  correct:
    en: |-
      A connector group is created by selecting existing connectors, so the connector is installed and registered first. Quick Access requires a connector group with at least one active connector, and assigning users requires the Quick Access enterprise app to exist. Conditional Access policies and the Private access traffic forwarding profile then complete the setup.
    fr: |-
      Un groupe de connecteurs se crée en sélectionnant des connecteurs existants : le connecteur est donc installé et inscrit en premier. Quick Access exige un groupe de connecteurs avec au moins un connecteur actif, et l'attribution d'utilisateurs exige que l'application d'entreprise Quick Access existe. Les stratégies d'accès conditionnel et le profil de transfert du trafic Private access complètent ensuite la configuration.
  options:
    inbound: { en: "Connectors use outbound connections only; no inbound rule is needed.", fr: "Les connecteurs n'utilisent que des connexions sortantes ; aucune règle entrante n'est nécessaire." }
    vpngw: { en: "Private Access replaces the VPN; no VPN gateway is needed.", fr: "Private Access remplace le VPN ; aucune passerelle VPN n'est nécessaire." }
references:
  - title: How to configure private network connectors for Microsoft Entra Private Access and Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-connectors
  - title: How to configure Quick Access for Global Secure Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-quick-access
