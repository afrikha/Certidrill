id: sc500-2a-audit-read-xel
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL Database logical server named **sql-fab-claims**. Server-level auditing writes to a storage account named **stfabaudit**. An auditor wants to query the audit records of the last week with T-SQL from SQL Server Management Studio, without exporting them to another service.

    Which function or view should the auditor use?
  fr: |
    Fabrikam dispose d'un serveur logique Azure SQL Database nommé **sql-fab-claims**. L'audit au niveau du serveur écrit dans un compte de stockage nommé **stfabaudit**. Un auditeur souhaite interroger en T-SQL, depuis SQL Server Management Studio, les enregistrements d'audit de la semaine passée sans les exporter vers un autre service.

    Quelle fonction ou vue l'auditeur doit-il utiliser ?
body:
  options:
    - { id: a, text: sys.fn_get_audit_file }
    - { id: b, text: sys.dm_audit_actions }
    - { id: c, text: sys.database_audit_specifications }
    - { id: d, text: sys.dm_exec_sessions }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Audit logs written to storage are .xel files stored as blobs. The sys.fn_get_audit_file function reads those files from the storage URL and returns the audit records as a table that can be filtered with T-SQL.
    fr: |
      Les journaux d'audit écrits dans le stockage sont des fichiers .xel stockés comme objets blob. La fonction sys.fn_get_audit_file lit ces fichiers à partir de l'URL du stockage et renvoie les enregistrements d'audit sous forme de table filtrable en T-SQL.
  options:
    b:
      en: |
        sys.dm_audit_actions lists the audit actions and action groups that exist, not recorded events.
      fr: |
        sys.dm_audit_actions liste les actions et groupes d'actions d'audit existants, pas les événements enregistrés.
    c:
      en: |
        sys.database_audit_specifications describes audit specifications, not the events they produced.
      fr: |
        sys.database_audit_specifications décrit des spécifications d'audit, pas les événements qu'elles ont produits.
    d:
      en: |
        sys.dm_exec_sessions shows current sessions only, with no history.
      fr: |
        sys.dm_exec_sessions affiche uniquement les sessions en cours, sans historique.
references:
  - title: Use Auditing to analyze audit logs and reports
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-analyze-audit-logs
