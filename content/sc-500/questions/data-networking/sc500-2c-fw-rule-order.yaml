id: sc500-2c-fw-rule-order
objective: "2.3.8"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    An Azure Firewall named **fw-hub** uses a firewall policy named fwp-hub that contains the rule collection groups and rules shown in the following table. Threat intelligence is in Alert only mode, and no other rule exists. The source of every rule is 10.1.0.0/16.

    Answer each prompt by selecting the rule that processes the traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Pare-feu Azure nommé **fw-hub** utilise une stratégie de pare-feu nommée fwp-hub qui contient les groupes de collections de règles et les règles du tableau suivant. Le renseignement sur les menaces est en mode Alert only, et il n'existe aucune autre règle. La source de chaque règle est 10.1.0.0/16.

    Répondez à chaque consigne en sélectionnant la règle qui traite le trafic.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "HTTPS from 10.1.1.4 to games.tailspintoys.com", fr: "HTTPS de 10.1.1.4 vers games.tailspintoys.com" }
    - id: p2
      text: { en: "HTTP from 10.1.1.4 to www.fabrikam.com", fr: "HTTP de 10.1.1.4 vers www.fabrikam.com" }
  grid:
    header:
      - { en: "Rule collection group (priority)", fr: "Groupe de collections de règles (priorité)" }
      - { en: "Rule collection (type, priority, action)", fr: "Collection de règles (type, priorité, action)" }
      - { en: "Rule", fr: "Règle" }
      - { en: "Protocol and port", fr: "Protocole et port" }
      - { en: "Destination", fr: "Destination" }
    rows:
      - [{ text: "RCG-Apps (200)" }, { text: "RC-DenyGames (Application, 100, Deny)" }, { text: deny-games, area: r-games }, { text: "HTTPS:443" }, { text: games.tailspintoys.com }]
      - [{ text: "RCG-Apps (200)" }, { text: "RC-AllowWeb (Application, 200, Allow)" }, { text: allow-fabrikam, area: r-fab }, { text: "HTTP:80, HTTPS:443" }, { text: "*.fabrikam.com" }]
      - [{ text: "RCG-Apps (200)" }, { text: "RC-DenyHttp (Application, 300, Deny)" }, { text: deny-http, area: r-http }, { text: "HTTP:80" }, { text: "*" }]
      - [{ text: "RCG-Net (300)" }, { text: "RC-Net (Network, 100, Allow)" }, { text: allow-https-any, area: r-net }, { text: "TCP 443" }, { text: Any }]
answer:
  values: { p1: r-net, p2: r-fab }
explanation:
  correct:
    en: Azure Firewall processes DNAT rules, then network rules, then application rules, whatever the priorities of the rule collection groups, and stops at the first match. HTTPS to games.tailspintoys.com matches the network rule allow-https-any first, so deny-games is never evaluated. HTTP on port 80 matches no network rule, so application rule collections are evaluated by priority, and RC-AllowWeb (200) matches before RC-DenyHttp (300).
    fr: "Le Pare-feu Azure traite les règles DNAT, puis les règles de réseau, puis les règles d'application, quelles que soient les priorités des groupes de collections de règles, et s'arrête à la première correspondance. Le HTTPS vers games.tailspintoys.com correspond d'abord à la règle de réseau allow-https-any : deny-games n'est jamais évaluée. Le HTTP sur le port 80 ne correspond à aucune règle de réseau : les collections de règles d'application sont évaluées par priorité, et RC-AllowWeb (200) correspond avant RC-DenyHttp (300)."
references:
  - title: Azure Firewall rule processing logic
    url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing
