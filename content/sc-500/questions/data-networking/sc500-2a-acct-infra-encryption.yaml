id: sc500-2a-acct-infra-encryption
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a general-purpose v2 storage account named **stfabfinance** that was created last year with Microsoft-managed keys and default encryption settings. It stores 3 TB of blob data.

    A new compliance requirement states that the data must be encrypted at rest twice: once at the service level and once at the infrastructure level.

    You need to meet the requirement.

    What should you do?
  fr: |
    Fabrikam dispose d'un compte de stockage v2 universel nommé **stfabfinance**, créé l'année dernière avec des clés gérées par Microsoft et les paramètres de chiffrement par défaut. Il stocke 3 To de données blob.

    Une nouvelle exigence de conformité impose que les données soient chiffrées deux fois au repos : une fois au niveau du service et une fois au niveau de l'infrastructure.

    Vous devez répondre à cette exigence.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable infrastructure encryption on the Encryption page of stfabfinance.", fr: "Activer le chiffrement d'infrastructure dans la page Encryption de stfabfinance." } }
    - { id: b, text: { en: "Configure customer-managed keys for stfabfinance in a key vault.", fr: "Configurer des clés gérées par le client pour stfabfinance dans un coffre de clés." } }
    - { id: c, text: { en: "Create a storage account with infrastructure encryption enabled and copy the data to it.", fr: "Créer un compte de stockage avec le chiffrement d'infrastructure activé et y copier les données." } }
    - { id: d, text: { en: "Assign the built-in policy that audits infrastructure encryption to the subscription.", fr: "Attribuer à l'abonnement la stratégie intégrée qui audite le chiffrement d'infrastructure." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Infrastructure encryption adds a second AES-256 layer with a different, Microsoft-managed key, but it can be enabled only when the storage account is created. For an existing account, you create a new account with infrastructure encryption enabled and move the data to it.
    fr: |
      Le chiffrement d'infrastructure ajoute une seconde couche AES-256 avec une autre clé, gérée par Microsoft, mais il ne peut être activé qu'à la création du compte de stockage. Pour un compte existant, vous créez un compte avec le chiffrement d'infrastructure activé et vous y déplacez les données.
  options:
    a:
      en: |
        The setting can't be turned on for an existing account; it is available only at account creation.
      fr: |
        Le paramètre ne peut pas être activé sur un compte existant ; il n'est disponible qu'à la création du compte.
    b:
      en: |
        Customer-managed keys change who controls the key of the service-level encryption; they don't add a second, infrastructure-level layer.
      fr: |
        Les clés gérées par le client changent qui contrôle la clé du chiffrement au niveau du service ; elles n'ajoutent pas de seconde couche au niveau de l'infrastructure.
    d:
      en: |
        An audit policy reports noncompliant accounts but doesn't encrypt any data.
      fr: |
        Une stratégie d'audit signale les comptes non conformes mais ne chiffre aucune donnée.
references:
  - title: Enable infrastructure encryption for double encryption of data
    url: https://learn.microsoft.com/en-us/azure/storage/common/infrastructure-encryption-enable
