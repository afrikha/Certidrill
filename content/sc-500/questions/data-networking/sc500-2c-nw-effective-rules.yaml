id: sc500-2c-nw-effective-rules
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An auditor asks for the complete list of inbound and outbound security rules that apply to the network interface of a virtual machine named **VM-Fin1**. The list must combine the NSG of the network interface, the NSG of its subnet and the Azure Virtual Network Manager admin rules applied to the virtual network, and it must be provided as a CSV file.

    What should you use?
  fr: |
    Un auditeur demande la liste complète des règles de sécurité entrantes et sortantes qui s'appliquent à la carte réseau d'une machine virtuelle nommée **VM-Fin1**. La liste doit combiner le NSG de la carte réseau, le NSG de son sous-réseau et les règles d'administration d'Azure Virtual Network Manager appliquées au réseau virtuel, et elle doit être fournie sous forme de fichier CSV.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "IP flow verify", fr: "Vérification des flux IP" }
    - id: b
      text: { en: "Effective security rules", fr: "Règles de sécurité effectives" }
    - id: c
      text: { en: "Virtual network flow logs", fr: "Journaux de flux de réseau virtuel" }
    - id: d
      text: { en: "NSG diagnostics", fr: "Diagnostics NSG" }
answer: { optionId: b }
explanation:
  correct:
    en: The effective security rules view shows the aggregated inbound and outbound rules applied to a network interface, from the NSGs of the network interface and its subnet plus the Virtual Network Manager admin rules. A download button exports all the rules to a CSV file.
    fr: La vue des règles de sécurité effectives montre les règles entrantes et sortantes agrégées appliquées à une carte réseau, issues des NSG de la carte réseau et de son sous-réseau ainsi que des règles d'administration de Virtual Network Manager. Un bouton de téléchargement exporte toutes les règles dans un fichier CSV.
  options:
    a: { en: "IP flow verify tests one flow and returns the single rule that decides it, not the full rule set.", fr: "La vérification des flux IP teste un flux et renvoie la seule règle qui en décide, pas l'ensemble des règles." }
    d: { en: "NSG diagnostics evaluates one simulated flow; it does not export the complete list of rules.", fr: "Les diagnostics NSG évaluent un flux simulé ; ils n'exportent pas la liste complète des règles." }
    c: { en: "Flow logs record traffic over time, not the configured rules.", fr: "Les journaux de flux enregistrent le trafic dans le temps, pas les règles configurées." }
references:
  - title: Effective security rules overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/effective-security-rules-overview
