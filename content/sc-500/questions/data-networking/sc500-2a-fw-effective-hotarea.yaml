id: sc500-2a-fw-effective-hotarea
objective: "2.1.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a storage account named **stcontosoweu** in the West Europe region. Public network access is set to **Enabled from selected networks** with the following rules:

    - A virtual network rule for the subnet **VNet1/snet-app**. snet-app has the Microsoft.Storage service endpoint.
    - IP network rules for the addresses **20.50.1.10** and **20.60.2.15**.
    - No exceptions.

    Every client in the following table uses a valid Microsoft Entra identity with the Storage Blob Data Reader role and reaches the public endpoint of stcontosoweu. VM2 and VM3 send their requests from their Standard SKU public IP addresses.

    Answer each prompt by selecting the client in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un compte de stockage nommé **stcontosoweu** dans la région West Europe. L'accès réseau public est défini sur **Enabled from selected networks** avec les règles suivantes :

    - une règle de réseau virtuel pour le sous-réseau **VNet1/snet-app**, qui dispose du point de terminaison de service Microsoft.Storage ;
    - des règles de réseau IP pour les adresses **20.50.1.10** et **20.60.2.15** ;
    - aucune exception.

    Chaque client du tableau suivant utilise une identité Microsoft Entra valide disposant du rôle Storage Blob Data Reader et joint le point de terminaison public de stcontosoweu. VM2 et VM3 envoient leurs requêtes depuis leurs adresses IP publiques de référence SKU Standard.

    Répondez à chaque consigne en sélectionnant le client dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The virtual machine whose requests are denied", fr: "La machine virtuelle dont les requêtes sont refusées" }
    - id: p2
      text: { en: "The client whose requests are allowed by an IP network rule", fr: "Le client dont les requêtes sont autorisées par une règle de réseau IP" }
  grid:
    header: [{ en: "Client", fr: "Client" }, { en: "Location", fr: "Emplacement" }, { en: "Network", fr: "Réseau" }, { en: "Source address", fr: "Adresse source" }]
    rows:
      - [{ text: VM1, area: vm1 }, { text: West Europe }, { text: VNet1/snet-app }, { text: "10.1.1.4" }]
      - [{ text: VM2, area: vm2 }, { text: West Europe }, { text: { en: "VNet2/snet-db, no service endpoint", fr: "VNet2/snet-db, sans point de terminaison de service" } }, { text: "20.50.1.10" }]
      - [{ text: VM3, area: vm3 }, { text: North Europe }, { text: { en: "VNet3/snet-jobs, no service endpoint", fr: "VNet3/snet-jobs, sans point de terminaison de service" } }, { text: "20.60.2.15" }]
      - [{ text: Laptop1, area: laptop1 }, { text: { en: "Home office", fr: "Domicile" } }, { text: Internet }, { text: "198.51.100.7" }]
answer:
  values: { p1: vm2, p2: vm3 }
explanation:
  correct:
    en: |
      VM1 is allowed by the virtual network rule: with the service endpoint, its traffic arrives with its private address from snet-app. VM2 is denied: IP network rules have no effect on requests from the same Azure region as the account, so its rule never matches. VM3 is in another region, so its public address matches the IP network rule. Laptop1 matches no rule and is denied too, but it isn't a virtual machine.
    fr: |
      VM1 est autorisée par la règle de réseau virtuel : grâce au point de terminaison de service, son trafic arrive avec son adresse privée depuis snet-app. VM2 est refusée : les règles de réseau IP n'ont aucun effet sur les requêtes provenant de la même région Azure que le compte, donc sa règle ne correspond jamais. VM3 est dans une autre région : son adresse publique correspond à la règle de réseau IP. Laptop1 ne correspond à aucune règle et est aussi refusé, mais ce n'est pas une machine virtuelle.
references:
  - title: Guidelines and limitations for the Azure Storage firewall
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
