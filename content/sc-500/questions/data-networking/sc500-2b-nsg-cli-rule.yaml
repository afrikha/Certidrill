id: sc500-2b-nsg-cli-rule
objective: "2.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A network security group named **nsg-data** is associated with the data subnet of a three-tier application. nsg-data already contains an inbound rule named **Deny-All-Sql** with priority **300** that denies TCP 1433 from any source.

    You need to add a rule that allows TCP 1433 only from the virtual machines in the application security group **asg-api** to the virtual machines in the application security group **asg-db**. The new rule must be processed before Deny-All-Sql.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe de sécurité réseau nommé **nsg-data** est associé au sous-réseau de données d'une application à trois niveaux. nsg-data contient déjà une règle entrante nommée **Deny-All-Sql** de priorité **300** qui refuse TCP 1433 depuis toute source.

    Vous devez ajouter une règle qui autorise TCP 1433 uniquement depuis les machines virtuelles du groupe de sécurité d'application **asg-api** vers les machines virtuelles du groupe de sécurité d'application **asg-db**. La nouvelle règle doit être traitée avant Deny-All-Sql.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network nsg rule create --resource-group RG-App --nsg-name nsg-data \
      --name Allow-Api-To-Sql --priority [[prio]] --direction Inbound \
      --access Allow --protocol Tcp \
      [[src]] asg-api [[dst]] asg-db \
      --destination-port-ranges 1433
  slots:
    - id: prio
      options:
        - { id: p50, text: "50" }
        - { id: p250, text: "250" }
        - { id: p350, text: "350" }
        - { id: p4096, text: "4096" }
    - id: src
      options:
        - { id: srcpfx, text: "--source-address-prefixes" }
        - { id: srcasg, text: "--source-asgs" }
        - { id: srcport, text: "--source-port-ranges" }
    - id: dst
      options:
        - { id: dstpfx, text: "--destination-address-prefixes" }
        - { id: dstport, text: "--destination-port-ranges" }
        - { id: dstasg, text: "--destination-asgs" }
shuffle: false
answer:
  values: { prio: p250, src: srcasg, dst: dstasg }
explanation:
  correct:
    en: |-
      NSG priorities range from 100 to 4096 and lower numbers are processed first, so 250 is the only listed value that is valid and lower than 300. Application security groups are passed with `--source-asgs` and `--destination-asgs`; the address-prefix parameters take IP ranges or service tags.
    fr: |-
      Les priorités de NSG vont de 100 à 4096 et les plus petits numéros sont traités en premier : 250 est la seule valeur proposée valide et inférieure à 300. Les groupes de sécurité d'application se passent avec `--source-asgs` et `--destination-asgs` ; les paramètres de préfixes d'adresse attendent des plages IP ou des étiquettes de service.
  options:
    p50: { en: "50 is below the minimum NSG priority of 100.", fr: "50 est inférieur à la priorité minimale de NSG, qui est 100." }
    p350: { en: "350 is processed after Deny-All-Sql (300), which would deny the traffic first.", fr: "350 est traitée après Deny-All-Sql (300), qui refuserait d'abord le trafic." }
    p4096: { en: "4096 is valid but processed after Deny-All-Sql.", fr: "4096 est valide mais traitée après Deny-All-Sql." }
    srcpfx: { en: "Address prefixes accept IP ranges or service tags, not application security groups.", fr: "Les préfixes d'adresse acceptent des plages IP ou des étiquettes de service, pas des groupes de sécurité d'application." }
    srcport: { en: "This parameter sets source ports, not the source group.", fr: "Ce paramètre définit des ports sources, pas le groupe source." }
    dstpfx: { en: "Address prefixes accept IP ranges or service tags, not application security groups.", fr: "Les préfixes d'adresse acceptent des plages IP ou des étiquettes de service, pas des groupes de sécurité d'application." }
    dstport: { en: "The destination port is already set at the end of the command; this slot needs the destination group.", fr: "Le port de destination est déjà défini à la fin de la commande ; cet emplacement attend le groupe de destination." }
references:
  - title: az network nsg rule
    url: https://learn.microsoft.com/en-us/cli/azure/network/nsg/rule
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
