id: sc500-2a-acct-cmk-statements
objective: "2.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a general-purpose v2 storage account named **stcontosoarch** that was created with the default settings for Blob, Azure Files, Queue and Table encryption. After creation, you configured stcontosoarch to use a customer-managed key named **key-arch** in a key vault. You omitted the key version so that the account always uses the latest version.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un compte de stockage v2 universel nommé **stcontosoarch**, créé avec les paramètres par défaut pour le chiffrement de Blob, Azure Files, Queue et Table. Après la création, vous avez configuré stcontosoarch pour utiliser une clé gérée par le client nommée **key-arch** dans un coffre de clés. Vous avez omis la version de la clé pour que le compte utilise toujours la dernière version.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When a new version of key-arch is created, stcontosoarch starts using it within a day without any change to its encryption settings.
        fr: |
          Quand une nouvelle version de key-arch est créée, stcontosoarch commence à l'utiliser dans la journée sans aucune modification de ses paramètres de chiffrement.
    - id: s2
      text:
        en: |
          The queue data in stcontosoarch is encrypted with key-arch.
        fr: |
          Les données de file d'attente de stcontosoarch sont chiffrées avec key-arch.
    - id: s3
      text:
        en: |
          If you disable key-arch in the key vault, clients that authorize with an account key can still read blobs in stcontosoarch.
        fr: |
          Si vous désactivez key-arch dans le coffre de clés, les clients qui s'autorisent avec une clé de compte peuvent toujours lire les objets blob de stcontosoarch.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      When the key version is omitted, Azure Storage checks the key vault daily and moves to the latest version automatically. Blob Storage and Azure Files are always covered by customer-managed keys, but Queue and Table data is covered only if you chose that option when the account was created. Disabling the key revokes access: read and write operations fail with 403 for every caller, whatever the authorization method.
    fr: |
      Quand la version de la clé est omise, le Stockage Azure vérifie le coffre de clés chaque jour et passe automatiquement à la dernière version. Stockage Blob et Azure Files sont toujours couverts par les clés gérées par le client, mais les données Queue et Table ne le sont que si cette option a été choisie à la création du compte. Désactiver la clé révoque l'accès : les opérations de lecture et d'écriture échouent avec une erreur 403 pour tous les appelants, quelle que soit la méthode d'autorisation.
references:
  - title: Customer-managed keys for Azure Storage encryption
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
