id: sc500-2c-pe-storage-subresources
objective: "2.3.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a general-purpose v2 storage account named **stnorthwind** that does not have a hierarchical namespace. An application that runs on virtual machines in a virtual network named VNet1 reads and writes block blobs by using the Blob service REST API, and mounts an Azure file share over SMB.

    You plan to set the public network access of stnorthwind to Disabled. You need to ensure that the application keeps working through private endpoints in VNet1. The solution must minimize the number of private endpoints.

    Which two target sub-resources should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un compte de stockage usage général v2 nommé **stnorthwind** qui n'a pas d'espace de noms hiérarchique. Une application exécutée sur des machines virtuelles d'un réseau virtuel nommé VNet1 lit et écrit des objets blob de blocs avec l'API REST du service Blob, et monte un partage de fichiers Azure en SMB.

    Vous prévoyez de régler l'accès au réseau public de stnorthwind sur Disabled. Vous devez faire en sorte que l'application continue de fonctionner par des points de terminaison privés dans VNet1. La solution doit réduire au minimum le nombre de points de terminaison privés.

    Quelles sont les deux sous-ressources cibles à utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: dfs }
    - { id: b, text: blob }
    - { id: c, text: web }
    - { id: d, text: file }
    - { id: e, text: queue }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A private endpoint maps to one sub-resource of a storage account, so each storage service that the application uses needs its own private endpoint. The Blob REST API uses the blob sub-resource, and SMB access to Azure Files uses the file sub-resource.
    fr: "Un point de terminaison privé correspond à une seule sous-ressource d'un compte de stockage : chaque service de stockage utilisé par l'application a besoin de son propre point de terminaison privé. L'API REST Blob utilise la sous-ressource blob, et l'accès SMB à Azure Files la sous-ressource file."
  options:
    a: { en: "dfs is the Data Lake Storage endpoint; the application uses the Blob service API on an account without a hierarchical namespace.", fr: "dfs est le point de terminaison Data Lake Storage ; l'application utilise l'API du service Blob sur un compte sans espace de noms hiérarchique." }
    c: { en: "web is the static website endpoint, which the application does not use.", fr: "web est le point de terminaison du site web statique, que l'application n'utilise pas." }
    e: { en: "The application does not use Queue Storage.", fr: "L'application n'utilise pas le Stockage File d'attente." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
