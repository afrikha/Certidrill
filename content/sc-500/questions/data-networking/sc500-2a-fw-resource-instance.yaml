id: sc500-2a-fw-resource-instance
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a storage account named **stlitwarelake** and an Azure Synapse Analytics workspace named **syn-litware** in the same Microsoft Entra tenant. Public network access of stlitwarelake is set to **Enabled from selected networks**. The managed identity of syn-litware already has the Storage Blob Data Reader role on stlitwarelake.

    Pipelines in syn-litware fail with authorization errors that are caused by the storage firewall.

    You need to allow syn-litware to reach stlitwarelake. No other instance of any Azure service must be granted network access.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un compte de stockage nommé **stlitwarelake** et d'un espace de travail Azure Synapse Analytics nommé **syn-litware** dans le même locataire Microsoft Entra. L'accès réseau public de stlitwarelake est défini sur **Enabled from selected networks**. L'identité managée de syn-litware dispose déjà du rôle Storage Blob Data Reader sur stlitwarelake.

    Les pipelines de syn-litware échouent avec des erreurs d'autorisation dues au pare-feu de stockage.

    Vous devez permettre à syn-litware de joindre stlitwarelake. Aucune autre instance d'un service Azure ne doit obtenir d'accès réseau.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a resource instance rule for syn-litware to stlitwarelake.", fr: "Ajouter une règle d'instance de ressource pour syn-litware à stlitwarelake." } }
    - { id: b, text: { en: "Select the exception Allow Azure services on the trusted services list to access this storage account.", fr: "Sélectionner l'exception Allow Azure services on the trusted services list to access this storage account." } }
    - { id: c, text: { en: "Assign the Storage Blob Data Contributor role on stlitwarelake to the managed identity of syn-litware.", fr: "Attribuer le rôle Storage Blob Data Contributor sur stlitwarelake à l'identité managée de syn-litware." } }
    - { id: d, text: { en: "Add an IP network rule for the public IP addresses that Azure Synapse uses in the region.", fr: "Ajouter une règle de réseau IP pour les adresses IP publiques utilisées par Azure Synapse dans la région." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A resource instance rule admits one specific resource instance from the same tenant as the account, and that instance can then perform the operations its role assignments allow. It is the narrowest way to let syn-litware through the firewall.
    fr: |
      Une règle d'instance de ressource admet une instance de ressource précise du même locataire que le compte, qui peut ensuite effectuer les opérations permises par ses attributions de rôles. C'est la manière la plus restreinte de laisser passer syn-litware à travers le pare-feu.
  options:
    b:
      en: |
        The trusted services exception admits a whole list of Azure services rather than one instance, which breaks the requirement.
      fr: |
        L'exception des services approuvés admet toute une liste de services Azure plutôt qu'une instance, ce qui enfreint l'exigence.
    c:
      en: |
        The workspace already has a data role; the failure is the network check, which a role assignment doesn't change.
      fr: |
        L'espace de travail dispose déjà d'un rôle de données ; l'échec vient du contrôle réseau, qu'une attribution de rôle ne modifie pas.
    d:
      en: |
        IP network rules have no effect on Azure services deployed in the same region, and a range of service addresses would admit other customers' workspaces too.
      fr: |
        Les règles de réseau IP n'ont aucun effet sur les services Azure déployés dans la même région, et une plage d'adresses de service admettrait aussi les espaces de travail d'autres clients.
references:
  - title: Firewall rules and network access control for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
