id: sc500-2c-fw-threat-intel-sku
objective: "2.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys plans to deploy Azure Firewall in a small branch virtual network. The expected throughput is below 200 Mbps.

    The firewall must deny traffic to and from known malicious IP addresses and domains. The solution must minimize costs.

    What should you deploy?
  fr: |
    Wingtip Toys prévoit de déployer le Pare-feu Azure dans un petit réseau virtuel de succursale. Le débit attendu est inférieur à 200 Mbit/s.

    Le pare-feu doit refuser le trafic vers et depuis des adresses IP et des domaines malveillants connus. La solution doit réduire les coûts au minimum.

    Que devez-vous déployer ?
body:
  options:
    - id: a
      text: { en: "Azure Firewall Basic with threat intelligence in Alert and deny mode", fr: "Pare-feu Azure Basic avec le renseignement sur les menaces en mode Alert and deny" }
    - id: b
      text: { en: "Azure Firewall Basic with IDPS in Alert and Deny mode", fr: "Pare-feu Azure Basic avec l'IDPS en mode Alert and Deny" }
    - id: c
      text: { en: "Azure Firewall Premium with threat intelligence in Alert and deny mode", fr: "Pare-feu Azure Premium avec le renseignement sur les menaces en mode Alert and deny" }
    - id: d
      text: { en: "Azure Firewall Standard with threat intelligence in Alert and deny mode", fr: "Pare-feu Azure Standard avec le renseignement sur les menaces en mode Alert and deny" }
answer: { optionId: d }
explanation:
  correct:
    en: Threat intelligence-based filtering in Azure Firewall Basic can only alert. Azure Firewall Standard supports the Alert and deny mode, which blocks traffic to and from known malicious IP addresses and domains, and it costs less than Premium.
    fr: Le filtrage par renseignement sur les menaces du Pare-feu Azure Basic ne peut que générer des alertes. Le Pare-feu Azure Standard prend en charge le mode Alert and deny, qui bloque le trafic vers et depuis des adresses IP et des domaines malveillants connus, et il coûte moins cher que Premium.
  options:
    a: { en: "Basic supports threat intelligence in alert mode only.", fr: "Basic ne prend en charge le renseignement sur les menaces qu'en mode alerte." }
    b: { en: "IDPS is a Premium feature; Basic does not include it.", fr: "L'IDPS est une fonctionnalité Premium ; Basic ne l'inclut pas." }
    c: { en: "Premium meets the requirement but costs more than Standard, which already supports Alert and deny.", fr: "Premium répond à l'exigence mais coûte plus cher que Standard, qui prend déjà en charge Alert and deny." }
references:
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
