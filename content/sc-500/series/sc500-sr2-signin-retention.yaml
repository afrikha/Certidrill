id: sc500-sr2-signin-retention
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation uses Microsoft Sentinel on a Log Analytics workspace named **law-sec** in a resource group named **rg-sec**. The Microsoft Entra ID data connector sends sign-in logs to the **SigninLogs** table, which uses the Analytics plan and the default retention settings.

    You need to configure retention for SigninLogs. The solution must meet the following requirements:

    - Sign-in data must be available to hunting queries and workbooks for 180 days after ingestion.
    - Sign-in data must be kept for three years (1,095 days) for compliance and then deleted.
    - Storage costs must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation utilise Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-sec** dans un groupe de ressources nommé **rg-sec**. Le connecteur de données Microsoft Entra ID envoie les journaux de connexion vers la table **SigninLogs**, qui utilise le plan Analytics et les paramètres de rétention par défaut.

    Vous devez configurer la rétention de SigninLogs. La solution doit répondre aux exigences suivantes :

    - Les données de connexion doivent être disponibles pour les requêtes de chasse proactive et les classeurs pendant 180 jours après leur ingestion.
    - Les données de connexion doivent être conservées pendant trois ans (1 095 jours) pour des raisons de conformité, puis supprimées.
    - Les coûts de stockage doivent être réduits au minimum.
