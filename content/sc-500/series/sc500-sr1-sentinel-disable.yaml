id: sc500-sr1-sentinel-disable
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation uses Microsoft Sentinel. A scheduled analytics rule named **AR1** detects successful sign-ins after a password spray attack and creates an incident for each detection.

    A playbook named **PB1** is in a resource group named **RG-SOC**. PB1 uses the **Microsoft Sentinel incident** trigger and disables in Microsoft Entra ID the user accounts that are entities of the incident. The managed identity of PB1 has the permissions required to disable users, and Microsoft Sentinel has the permissions required to run the playbooks in RG-SOC.

    You need to ensure that when AR1 creates an incident, the following actions are performed automatically, without analyst intervention:

    - The user accounts of the incident are disabled.
    - The incident is assigned to an analyst named **Analyst1**.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation utilise Microsoft Sentinel. Une règle d'analyse planifiée nommée **AR1** détecte les connexions réussies après une attaque par pulvérisation de mots de passe et crée un incident pour chaque détection.

    Un playbook nommé **PB1** se trouve dans un groupe de ressources nommé **RG-SOC**. PB1 utilise le déclencheur **Microsoft Sentinel incident** et désactive dans Microsoft Entra ID les comptes d'utilisateur qui sont des entités de l'incident. L'identité managée de PB1 dispose des autorisations nécessaires pour désactiver des utilisateurs, et Microsoft Sentinel dispose des autorisations nécessaires pour exécuter les playbooks de RG-SOC.

    Vous devez vous assurer que, lorsque AR1 crée un incident, les actions suivantes sont effectuées automatiquement, sans intervention d'un analyste :

    - Les comptes d'utilisateur de l'incident sont désactivés.
    - L'incident est affecté à un analyste nommé **Analyst1**.
