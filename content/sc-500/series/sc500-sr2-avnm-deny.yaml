id: sc500-sr2-avnm-deny
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. has a management group named **MG-Prod** that contains two Azure subscriptions. You deploy an Azure Virtual Network Manager instance named **AVNM1** whose scope is MG-Prod and that has the **Security Admin** feature enabled. All the virtual networks are in the **West Europe** region. Production virtual networks have the tag **env: prod**, and application teams create new production virtual networks every month.

    Each application team has the **Network Contributor** role on its own resource groups and manages the network security groups (NSGs) of its subnets.

    You need to block inbound TCP traffic on ports 22 and 3389 from the internet to all the production virtual networks, including those created later. The application teams must not be able to allow this traffic by changing their NSG rules. The solution must minimize administrative effort.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. dispose d'un groupe d'administration nommé **MG-Prod** qui contient deux abonnements Azure. Vous déployez une instance Azure Virtual Network Manager nommée **AVNM1** dont l'étendue est MG-Prod et dont la fonctionnalité **Security Admin** est activée. Tous les réseaux virtuels se trouvent dans la région **West Europe**. Les réseaux virtuels de production portent l'étiquette **env: prod**, et les équipes applicatives créent de nouveaux réseaux virtuels de production chaque mois.

    Chaque équipe applicative dispose du rôle **Network Contributor** sur ses propres groupes de ressources et gère les groupes de sécurité réseau (NSG) de ses sous-réseaux.

    Vous devez bloquer le trafic TCP entrant sur les ports 22 et 3389 en provenance d'Internet vers tous les réseaux virtuels de production, y compris ceux créés ultérieurement. Les équipes applicatives ne doivent pas pouvoir autoriser ce trafic en modifiant les règles de leurs NSG. La solution doit réduire au minimum l'effort d'administration.
