id: sc500-sr2-ai-alerts
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an Azure subscription named **Sub1** that contains a Microsoft Foundry resource named **fdy-chat**. A customer chat application calls the Azure OpenAI model deployments of fdy-chat. In Microsoft Defender for Cloud, only the foundational CSPM capabilities are enabled for Sub1. You have the Owner role on Sub1.

    You need to ensure that the security operations team receives security alerts in the Microsoft Defender portal when a jailbreak attempt or a data leakage attempt targets the model deployments of fdy-chat. Each alert must show the suspicious segments of the user prompt and of the model response.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un abonnement Azure nommé **Sub1** qui contient une ressource Microsoft Foundry nommée **fdy-chat**. Une application de conversation destinée aux clients appelle les déploiements de modèles Azure OpenAI de fdy-chat. Dans Microsoft Defender for Cloud, seules les fonctionnalités CSPM de base sont activées pour Sub1. Vous disposez du rôle Owner sur Sub1.

    Vous devez vous assurer que l'équipe des opérations de sécurité reçoit des alertes de sécurité dans le portail Microsoft Defender lorsqu'une tentative de jailbreak ou de fuite de données cible les déploiements de modèles de fdy-chat. Chaque alerte doit afficher les segments suspects de l'invite utilisateur et de la réponse du modèle.
