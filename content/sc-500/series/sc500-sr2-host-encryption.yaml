id: sc500-sr2-host-encryption
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure subscription named **Sub1** that contains the resources shown in the following table.

    | Name | Type | Configuration |
    | --- | --- | --- |
    | VM1 | Windows Server virtual machine | Size that supports encryption at host, one OS disk, two data disks, a temporary disk. Azure Disk Encryption has never been enabled. |
    | KV1 | Key vault | Same region as VM1, soft delete and purge protection enabled, contains an RSA key named **key1** |

    The **EncryptionAtHost** feature is not registered in Sub1.

    You need to configure encryption for VM1. The solution must meet the following requirements:

    - The temporary disk and the OS and data disk caches must be encrypted at rest.
    - Data must flow encrypted from the host to the storage service.
    - The OS and data disks must be encrypted by using key1.
    - The encryption must not consume the CPU resources of VM1.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un abonnement Azure nommé **Sub1** qui contient les ressources présentées dans le tableau suivant.

    | Nom | Type | Configuration |
    | --- | --- | --- |
    | VM1 | Machine virtuelle Windows Server | Taille qui prend en charge le chiffrement sur l'hôte, un disque de système d'exploitation, deux disques de données, un disque temporaire. Azure Disk Encryption n'a jamais été activé. |
    | KV1 | Coffre de clés | Même région que VM1, suppression réversible et protection contre le vidage activées, contient une clé RSA nommée **key1** |

    La fonctionnalité **EncryptionAtHost** n'est pas inscrite dans Sub1.

    Vous devez configurer le chiffrement de VM1. La solution doit répondre aux exigences suivantes :

    - Le disque temporaire et les caches des disques de système d'exploitation et de données doivent être chiffrés au repos.
    - Les données doivent circuler chiffrées de l'hôte jusqu'au service de stockage.
    - Les disques de système d'exploitation et de données doivent être chiffrés à l'aide de key1.
    - Le chiffrement ne doit pas consommer les ressources processeur de VM1.
