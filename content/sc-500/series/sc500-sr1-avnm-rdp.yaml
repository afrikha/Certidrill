id: sc500-sr1-avnm-rdp
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. has a management group named **MG1** that contains three Azure subscriptions. The subscriptions contain 40 virtual networks in the East US and West Europe regions. Application teams create new virtual networks in these two regions every month. Each application team has the Network Contributor role on its own resource groups and manages the network security groups (NSGs) of its subnets.

    An Azure Virtual Network Manager instance named **NM1** has its scope set to MG1. NM1 is in a resource group that only the central network team manages.

    You need to meet the following requirements:

    - Inbound traffic on TCP port 3389 from the Internet must be blocked for all the virtual networks in MG1, including the virtual networks created later.
    - The application teams must not be able to allow this traffic by changing their NSGs.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. dispose d'un groupe d'administration nommé **MG1** qui contient trois abonnements Azure. Les abonnements contiennent 40 réseaux virtuels dans les régions East US et West Europe. Les équipes applicatives créent de nouveaux réseaux virtuels dans ces deux régions chaque mois. Chaque équipe applicative dispose du rôle Network Contributor sur ses propres groupes de ressources et gère les groupes de sécurité réseau (NSG) de ses sous-réseaux.

    Une instance Azure Virtual Network Manager nommée **NM1** a son étendue définie sur MG1. NM1 se trouve dans un groupe de ressources géré uniquement par l'équipe réseau centrale.

    Vous devez répondre aux exigences suivantes :

    - Le trafic entrant sur le port TCP 3389 en provenance d'Internet doit être bloqué pour tous les réseaux virtuels de MG1, y compris les réseaux virtuels créés ultérieurement.
    - Les équipes applicatives ne doivent pas pouvoir autoriser ce trafic en modifiant leurs NSG.
