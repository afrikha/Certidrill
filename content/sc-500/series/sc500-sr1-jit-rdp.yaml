id: sc500-sr1-jit-rdp
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has an Azure subscription named **Sub1**. Microsoft Defender for Cloud provides only the free foundational CSPM capabilities on Sub1; no Defender plan is enabled. Sub1 contains 10 Windows Server virtual machines named **VM1** to **VM10** that were deployed by using Azure Resource Manager. Each VM has a Standard SKU public IP address. The network interface of each VM is associated with an NSG named **NSG1**. NSG1 contains an inbound rule named **Allow-RDP** with priority 300 that allows TCP port 3389 from any source. No Azure Firewall protects the VMs.

    You need to meet the following requirements:

    - RDP access to VM1 to VM10 must be blocked by default.
    - An administrator must be able to request RDP access to a VM from the administrator's current public IP address for a maximum of 3 hours.
    - The access must be closed automatically when the requested period ends.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un abonnement Azure nommé **Sub1**. Microsoft Defender for Cloud fournit uniquement les fonctionnalités gratuites de CSPM de base (foundational CSPM) sur Sub1 ; aucun plan Defender n'est activé. Sub1 contient 10 machines virtuelles Windows Server nommées **VM1** à **VM10** qui ont été déployées à l'aide d'Azure Resource Manager. Chaque machine virtuelle dispose d'une adresse IP publique de référence SKU Standard. L'interface réseau de chaque machine virtuelle est associée à un NSG nommé **NSG1**. NSG1 contient une règle de trafic entrant nommée **Allow-RDP**, de priorité 300, qui autorise le port TCP 3389 depuis n'importe quelle source. Aucun Azure Firewall ne protège les machines virtuelles.

    Vous devez répondre aux exigences suivantes :

    - L'accès RDP à VM1 à VM10 doit être bloqué par défaut.
    - Un administrateur doit pouvoir demander l'accès RDP à une machine virtuelle depuis son adresse IP publique actuelle pour une durée maximale de 3 heures.
    - L'accès doit être fermé automatiquement à la fin de la période demandée.
