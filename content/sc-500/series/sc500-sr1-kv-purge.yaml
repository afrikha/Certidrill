id: sc500-sr1-kv-purge
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an Azure subscription named **Sub1** that contains a key vault named **KV1**. KV1 was created last year with the default settings: soft delete is enabled with a retention period of 90 days, and purge protection is not enabled. KV1 uses the Azure role-based access control (Azure RBAC) permission model and stores the secrets of a payment application.

    An auditor reports that a user who holds the Owner role on Sub1 could delete a secret in KV1 and then purge it immediately.

    You need to ensure that every deleted secret in KV1 can be recovered until the end of its retention period, and that nobody, including the owners of Sub1, can permanently delete a secret of KV1 before that.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un abonnement Azure nommé **Sub1** qui contient un coffre de clés nommé **KV1**. KV1 a été créé l'an dernier avec les paramètres par défaut : la suppression réversible est activée avec une période de rétention de 90 jours, et la protection contre le vidage n'est pas activée. KV1 utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure (Azure RBAC) et stocke les secrets d'une application de paiement.

    Un auditeur signale qu'un utilisateur qui détient le rôle Owner sur Sub1 pourrait supprimer un secret de KV1 puis le purger immédiatement.

    Vous devez vous assurer que chaque secret supprimé de KV1 peut être récupéré jusqu'à la fin de sa période de rétention, et que personne, y compris les propriétaires de Sub1, ne peut supprimer définitivement un secret de KV1 avant cette échéance.
