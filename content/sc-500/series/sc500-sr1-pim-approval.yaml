id: sc500-sr1-pim-approval
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. has a Microsoft Entra tenant licensed with Microsoft Entra ID P2. Three users named **User1**, **User2** and **User3** currently have no Microsoft Entra role. A security manager named **UserA** has no administrative role. The Security Administrator role uses the default Privileged Identity Management (PIM) role settings.

    You need to configure access for User1, User2 and User3 to meet the following requirements:

    - The users must be able to use the **Security Administrator** role only after they activate it.
    - Every activation must be approved by **UserA**.
    - An activation must not last more than **4 hours**.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. dispose d'un locataire Microsoft Entra sous licence Microsoft Entra ID P2. Trois utilisateurs nommés **User1**, **User2** et **User3** n'ont actuellement aucun rôle Microsoft Entra. Un responsable sécurité nommé **UserA** n'a aucun rôle d'administration. Le rôle Security Administrator utilise les paramètres de rôle Privileged Identity Management (PIM) par défaut.

    Vous devez configurer l'accès de User1, User2 et User3 pour répondre aux exigences suivantes :

    - Les utilisateurs ne doivent pouvoir utiliser le rôle **Security Administrator** qu'après l'avoir activé.
    - Chaque activation doit être approuvée par **UserA**.
    - Une activation ne doit pas durer plus de **4 heures**.
