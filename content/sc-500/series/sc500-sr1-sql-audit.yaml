id: sc500-sr1-sql-audit
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has an Azure SQL Database logical server named **SQL1** that hosts five databases. The development team creates new databases on SQL1 every week. Auditing is not enabled on SQL1 or on any of its databases. The security team uses a Log Analytics workspace named **LAW1**.

    You need to meet the following requirements:

    - The events of every database on SQL1 must be audited, including the databases created later.
    - The audit logs must be sent to LAW1.
    - Administrative effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un serveur logique Azure SQL Database nommé **SQL1** qui héberge cinq bases de données. L'équipe de développement crée de nouvelles bases de données sur SQL1 chaque semaine. L'audit n'est activé ni sur SQL1 ni sur aucune de ses bases de données. L'équipe de sécurité utilise un espace de travail Log Analytics nommé **LAW1**.

    Vous devez répondre aux exigences suivantes :

    - Les événements de chaque base de données de SQL1 doivent être audités, y compris ceux des bases de données créées ultérieurement.
    - Les journaux d'audit doivent être envoyés à LAW1.
    - L'effort d'administration doit être réduit au minimum.
