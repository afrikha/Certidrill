id: sc500-sr2-backup-mua
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. has an Azure subscription named **Sub1** that contains a Recovery Services vault named **RSV1** in the **North Europe** region. RSV1 backs up 60 production VMs. The members of a Microsoft Entra group named **BackupAdmins** have the **Backup Contributor** role on RSV1. The security team, **SecOps**, manages a separate subscription named **SubSec** in the same Microsoft Entra tenant.

    You need to protect RSV1 against a compromised backup administrator account. The solution must meet the following requirements:

    - A member of BackupAdmins must not be able to disable soft delete, reduce the retention of a backup policy, or stop protection and delete backup data on RSV1 without the approval of a member of SecOps.
    - After a member of SecOps approves a request, the requester must be able to perform the operation during a limited time window.
    - BackupAdmins must not be able to delete or modify the protection mechanism.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. dispose d'un abonnement Azure nommé **Sub1** qui contient un coffre Recovery Services nommé **RSV1** dans la région **North Europe**. RSV1 sauvegarde 60 machines virtuelles de production. Les membres d'un groupe Microsoft Entra nommé **BackupAdmins** disposent du rôle **Backup Contributor** sur RSV1. L'équipe de sécurité, **SecOps**, gère un abonnement distinct nommé **SubSec** dans le même locataire Microsoft Entra.

    Vous devez protéger RSV1 contre la compromission d'un compte d'administrateur de sauvegarde. La solution doit répondre aux exigences suivantes :

    - Un membre de BackupAdmins ne doit pas pouvoir désactiver la suppression réversible, réduire la rétention d'une stratégie de sauvegarde, ni arrêter la protection en supprimant les données de sauvegarde de RSV1 sans l'approbation d'un membre de SecOps.
    - Après l'approbation d'une demande par un membre de SecOps, le demandeur doit pouvoir effectuer l'opération pendant une période limitée.
    - BackupAdmins ne doit pas pouvoir supprimer ni modifier le mécanisme de protection.
