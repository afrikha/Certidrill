# AIF-C01 — AWS Certified AI Practitioner
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-19):
#   - AWS Certified AI Practitioner (AIF-C01) Exam Guide, version 1.2, published October 29, 2026
#     (1.0: March 26, 2026; 1.1: April 30, 2026), English PDF:
#     https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01.pdf
#     French PDF: same path under /fr_fr/ (change history up to 1.1). The HTML guide page
#     (/userguide/ai-practitioner-01.html) could not be read; the PDFs were.
#   - Certification page: https://aws.amazon.com/certification/certified-ai-practitioner/
#     (foundational, 90 minutes, 65 questions, 100 USD; no successor version announced; only the
#     Italian and German versions retire after October 15, 2026).
# Exam facts: 65 questions = 50 scored + 15 unscored (not identified); scaled score 100–1,000,
# pass at 700, compensatory scoring (no per-domain pass); unanswered = incorrect, no penalty for
# guessing. The guide itself does not state the duration (90 minutes from the certification page).
# Response types (guide): multiple choice (1 correct of 4), multiple response (2 or more correct
# of 5 or more), ordering (3–5 responses to select and put in order), matching (a list of
# responses matched with 3–7 prompts); every type is scored all or nothing. The guide does not
# mention case studies, so none are modelled (no caseStudies, no series).
# typeMix: AWS publishes no share per type. single 72–82 %, multi 10–16 %, ordering 3–7 %,
# dragdrop (= matching) 4–8 %: the factory's estimate (multiple choice dominant, a few ordering
# and matching items per form); the guide says nothing against it.
# Unscored questions are not modelled: the mock exam scores all 65 questions.
# Domain weights: share of scored content as published (20 / 24 / 28 / 14 / 14 %).
# Readiness and progression rules are those of AZ-900 / AZ-104.
# active: false until the bank and the course are reviewed and published.
certification:
  code: aif-c01
  title: AWS Certified AI Practitioner
  vendor: AWS
  active: false
blueprint:
  version: '2026-10-29'
  durationMin: 90
  questionCount:
    min: 65
    max: 65
  passScore: 700
  maxScore: 1000
  # AWS gives no partial credit on multiple-response questions (see docs/SPECS-AWS.md §3.3), nor on
  # matching questions (dragdrop); ordering questions are always scored all or nothing.
  scoring:
    multi: all_or_nothing
    dragdrop: all_or_nothing
  # AIF-C01 has four response types: multiple choice (single), multiple response (multi),
  # ordering (ordering) and matching (modelled as dragdrop). Shares: see the header comment.
  typeMix:
    single:
      min: 0.72
      max: 0.82
    multi:
      min: 0.1
      max: 0.16
    ordering:
      min: 0.03
      max: 0.07
    dragdrop:
      min: 0.04
      max: 0.08
  difficultyMix:
    easy: 0.4
    medium: 0.45
    hard: 0.15
  structure:
    caseStudies:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
      placement: end
    series:
      count:
        min: 0
        max: 0
      questionsEach:
        min: 0
        max: 0
    maxPerObjective: 2
    warningsMin:
    - 10
    - 5
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale:
        from: 600
        to: 850
      weights:
        level: 0.5
        consistency: 0.2
        domains: 0.2
        freshness: 0.1
      bands:
        progressing: 50
        almost: 70
        ready: 85
      freshness:
        staleDays: 30
        zeroDays: 90
        minNewShare: 0.5
    progression:
      xp:
        base: 50
        scoreFrom: 400
        perPoint: 0.5
        knownShare: 0.5
        passBonus: 100
        bestBonus: 75
        domainBonus: 50
        domainGain: 50
      levels:
      - xp: 0
        title:
          en: AI curious
          fr: Curieux de l'IA
      - xp: 150
        title:
          en: Prompt apprentice
          fr: Apprenti des invites
      - xp: 400
        title:
          en: Model spotter
          fr: Repéreur de modèles
      - xp: 750
        title:
          en: Token counter
          fr: Compteur de jetons
      - xp: 1200
        title:
          en: Embedding explorer
          fr: Explorateur des vecteurs
      - xp: 1750
        title:
          en: Guardrail keeper
          fr: Gardien des garde-fous
      - xp: 2400
        title:
          en: Responsible builder
          fr: Bâtisseur responsable
      - xp: 3150
        title:
          en: Foundation model navigator
          fr: Navigateur des modèles de fondation
      - xp: 4000
        title:
          en: AI practitioner
          fr: Praticien de l'IA
      - xp: 5000
        title:
          en: AI legend
          fr: Légende de l'IA
      mastery:
        bronze: 650
        silver: 700
        gold: 850
      badges:
        hatTrick:
          count: 3
          min: 800
        regular:
          weeks: 4
        comeback:
          gain: 150
