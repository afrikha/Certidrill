# AIF-C01 objectives — AWS Certified AI Practitioner (AIF-C01) Exam Guide, version 1.2
# (October 29, 2026), English PDF, and French (fr_fr) PDF (change history up to 1.1, April 30,
# 2026, but same bullets as the English 1.2), checked on 2026-11-19.
# One group per task statement (title without the "Task Statement n.n:" prefix and final period).
# Since guide 1.0 (2026) each task statement has a single "Objectives:" list (no "Knowledge of" /
# "Skills in" split): objectives = every bullet of that list, in the guide's order.
# Codes <domain>.<task>.<n>. `code` is the stable key referenced by question files and course sections.
# English: verbatim, final periods removed, except 3.4.2 "LLM-as-ajudge" (typo in the PDF) ->
# "LLM-as-a-judge". 3.4.3 keeps the guide's "task engineering"; 2.3.4 keeps "provision throughput".
# French: from the fr_fr guide (good quality), typographic apostrophes straightened, first letter of
# group titles capitalised, final periods removed, except these edits (BRIEF-AWS §6):
#   - AWS feature names put back in English: 3.1.3 "les bases de connaissances Amazon Bedrock" ->
#     "Amazon Bedrock Knowledge Bases"; 4.1.2, 5.1.1 "barrières de protection pour Amazon Bedrock"
#     -> "Amazon Bedrock Guardrails"; 3.4.1 "évaluation des modèles dans Amazon Bedrock" ->
#     "Amazon Bedrock Model Evaluation"; 4.2.2 -> "Amazon Bedrock Model Evaluations";
#     2.1.6 "protocole de contextualisation des modèles [MCP]" -> "Model Context Protocol [MCP]";
#     3.4.2 "LLM-juge" -> "LLM-as-a-judge"; 5.2.3 English name of the Generative AI Security
#     Scoping Matrix added in brackets;
#   - English term added at first use: 1.1.1 "ajustement [fit]"; 2.1.1 "découpage [chunking]",
#     "intégrations [embeddings]", "ingénierie de requête [prompt engineering]"; 2.1.3
#     "peaufinage [fine-tuning]"; 3.1.4 "intégrations (embeddings)"; 3.2.4 "débridage [jailbreaking]";
#   - machine-like or wrong bullets rewritten: 1.3.2 "modèles d'entraînement personnalisés" ->
#     "entraînement de modèles personnalisés" (training custom models); 2.1.5 "ingénierie
#     contextuelle" -> "ingénierie du contexte (context engineering)"; 2.3.4 "débit de mise en
#     service" -> "débit provisionné [Provisioned Throughput]"; 3.2.2 "des modèles de chaîne de
#     pensée, zero-shot, single-shot, few-shot, d'invites" -> "chaîne de pensée [chain-of-thought],
#     zero-shot, single-shot, few-shot, modèles d'invites [prompt templates]"; 3.3.2 "réglage des
#     instructions" -> "réglage par instructions [instruction tuning]"; 5.1.4 "journal d'activité
#     d'audit et exigences de consignation" -> "piste d'audit et exigences de journalisation";
#     5.1.5 "ancrage de la génération..." -> "ancrage par génération...";
#   - accuracy vs precision: 1.3.6 "exactitude [accuracy]" added (missing in the French bullet);
#     2.2.4 and 5.1.5 "précision" (accuracy) -> "exactitude";
#   - safety: 4.1.1 "partialité" -> "biais" (as in 1.1.1), "sécurité" (safety) -> "sûreté"
#     (as in 2.3.3); 4.2.3 "sécurité" (safety) -> "sûreté";
#   - 2.1.6 "multiagents" -> "multi-agents" (one spelling); 3.2.5 "gestion d'invites" -> "gestion
#     des invites"; 4.1.2 "fonctionnalités" (features) -> "caractéristiques" (as in 4.1.1).
aiml:
- group:
    en: Explain basic AI concepts and terminologies
    fr: Expliquer les concepts et terminologies de base de l'IA
  objectives:
  - code: 1.1.1
    en: Define basic AI terms (for example, AI, ML, deep learning, neural networks, computer vision, natural language processing [NLP], model, algorithm, training and inferencing, bias, fairness, fit, large language model [LLM], generative AI [GenAI], agentic AI)
    fr: Définir les termes de base de l'IA (par exemple, IA, ML, deep learning, réseaux neuronaux, vision par ordinateur, traitement du langage naturel [NLP], modèle, algorithme, entraînement et inférence, biais, équité, ajustement [fit], grand modèle de langage [LLM], IA générative, IA agentique)
  - code: 1.1.2
    en: Describe the similarities and differences between AI, ML, GenAI, deep learning, and agentic AI
    fr: Décrire les similitudes et les différences entre l'IA, le ML, l'IA générative, le deep learning et l'IA agentique
  - code: 1.1.3
    en: Describe various types of inferencing (for example, batch, real-time, asynchronous, serverless)
    fr: Décrire les différents types d'inférence (par exemple, par lots, en temps réel, asynchrone, sans serveur)
  - code: 1.1.4
    en: Describe the different types of data in AI models (for example, labeled and unlabeled, tabular, time-series, image, text, structured and unstructured)
    fr: Décrire les différents types de données dans les modèles d'IA (par exemple, étiquetées et non étiquetées, tabulaires, séries chronologiques, images, textes, structurées et non structurées)
  - code: 1.1.5
    en: Describe different types of AI/ML learning (for example, supervised learning, unsupervised learning, reinforcement learning methods)
    fr: Décrire les différents types d'apprentissage de l'IA/du ML (par exemple, apprentissage supervisé, apprentissage non supervisé, méthodes d'apprentissage par renforcement)
- group:
    en: Identify practical use cases for AI
    fr: Identifier des cas d'utilisation pratiques de l'IA
  objectives:
  - code: 1.2.1
    en: Recognize applications where AI/ML can provide value (for example, assist human decision making, solution scalability, automation)
    fr: Identifier les applications dans lesquelles l'IA/le ML peut apporter de la valeur (par exemple, aide à la prise de décision humaine, capacité de mise à l'échelle des solutions, automatisation)
  - code: 1.2.2
    en: Determine when AI/ML solutions are not appropriate (for example, cost-benefit analyses, situations when a specific outcome is needed instead of a prediction)
    fr: Déterminer quand les solutions d'IA/de ML ne sont pas appropriées (par exemple, analyses coûts-avantages, situations dans lesquelles un résultat spécifique est nécessaire au lieu d'une prédiction)
  - code: 1.2.3
    en: Select the appropriate AI/ML techniques for specific use cases (for example, regression, classification, clustering)
    fr: Sélectionner les techniques d'IA/de ML appropriées pour des cas d'utilisation spécifiques (par exemple, régression, classification, clustering)
  - code: 1.2.4
    en: Identify examples of real-world AI applications (for example, computer vision, NLP, speech recognition, recommendation systems, fraud detection, forecasting, knowledge bases, agentic AI)
    fr: Identifier des exemples d'applications d'IA dans le monde réel (par exemple, la vision par ordinateur, le NLP, la reconnaissance vocale, les systèmes de recommandation, la détection de fraude, les prévisions, les bases de connaissances, l'IA agentique)
  - code: 1.2.5
    en: Explain the capabilities of AWS managed AI/ML services (for example, Amazon SageMaker AI, Amazon Transcribe, Amazon Translate, Amazon Comprehend, Amazon Lex, Amazon Polly)
    fr: Expliquer les fonctionnalités des services d'IA/de ML gérés par AWS (par exemple, Amazon SageMaker AI, Amazon Transcribe, Amazon Translate, Amazon Comprehend, Amazon Lex, Amazon Polly)
  - code: 1.2.6
    en: Identify when traditional ML models or foundation models (FMs) are appropriate for a specific use case (for example, based on regulatory concerns, explainability requirements, operational constraints)
    fr: Identifier les situations dans lesquelles les modèles de ML traditionnels ou les modèles de fondation (FM) sont appropriés pour un cas d'utilisation spécifique (par exemple, en fonction de préoccupations réglementaires, d'exigences d'explicabilité ou de contraintes opérationnelles)
- group:
    en: Describe the AI/ML development lifecycle
    fr: Décrire le cycle de vie du développement de l'IA/du ML
  objectives:
  - code: 1.3.1
    en: Describe and differentiate components of an AI/ML pipeline
    fr: Décrire et différencier les composants d'un pipeline d'IA/de ML
  - code: 1.3.2
    en: Describe sources of FM models (for example, open source pre-trained models, training custom models)
    fr: Décrire les sources des modèles FM (par exemple, modèles open source préentraînés, entraînement de modèles personnalisés)
  - code: 1.3.3
    en: Describe methods to use a model in production (for example, managed API service, self-hosted API)
    fr: Décrire les méthodes permettant d'utiliser un modèle en production (par exemple, un service d'API géré, une API autohébergée)
  - code: 1.3.4
    en: Identify relevant AWS services and features for each stage of an AI/ML pipeline (for example, Amazon Bedrock, Amazon Quick, Kiro, SageMaker AI)
    fr: Identifier les services et fonctionnalités AWS pertinents pour chaque étape d'un pipeline d'IA/de ML (par exemple, Amazon Bedrock, Amazon Quick, Kiro, SageMaker AI)
  - code: 1.3.5
    en: Describe fundamental concepts of ML operations (MLOps) (for example, experimentation, repeatable processes, scalable systems, managing technical debt, achieving production readiness, model monitoring, model re-training)
    fr: Décrire les concepts fondamentaux des opérations de ML (MLOps) (par exemple, expérimentation, processus reproductibles, systèmes pouvant être mis à l'échelle, gestion de la dette technique, préparation à la production, surveillance des modèles, réentraînement des modèles)
  - code: 1.3.6
    en: Describe model performance metrics (for example, accuracy, precision, recall, F1 score) and business metrics (for example, cost per user, development costs, customer feedback, return on investment [ROI]) to evaluate ML models
    fr: Décrire les métriques de performance des modèles (par exemple, exactitude [accuracy], précision, rappel, score F1) et les métriques métier (par exemple, coût par utilisateur, coûts de développement, commentaires des clients, retour sur investissement [ROI]) pour évaluer les modèles ML
genai:
- group:
    en: Explain the basic concepts of generative AI (GenAI)
    fr: Expliquer les concepts de base de l'IA générative
  objectives:
  - code: 2.1.1
    en: Define foundational GenAI concepts (for example, tokens, chunking, embeddings, vectors, prompt engineering, transformer-based large language models [LLMs], foundation models [FMs], multi-modal models, diffusion models)
    fr: Définir les concepts fondamentaux de l'IA générative (par exemple, jetons, découpage [chunking], intégrations [embeddings], vecteurs, ingénierie de requête [prompt engineering], grands modèles de langage [LLM] basés sur des transformateurs, modèles de fondation [FM], modèles multimodaux, modèles de diffusion)
  - code: 2.1.2
    en: Identify potential use cases for GenAI models (for example, image, video, and audio generation; summarization; AI assistants; translation; code generation; customer service agents; search; recommendation engines)
    fr: Identifier les cas d'utilisation potentiels des modèles d'IA générative (par exemple, génération d'images, de vidéos et de sons ; synthèse ; assistants d'IA ; traduction ; génération de code ; agents du service client ; recherche ; moteurs de recommandation)
  - code: 2.1.3
    en: Describe the FM lifecycle (for example, data selection, model selection, pre-training, fine-tuning, evaluation, deployment, feedback)
    fr: Décrire le cycle de vie du FM (par exemple, sélection des données, sélection du modèle, préentraînement, peaufinage [fine-tuning], évaluation, déploiement, commentaires)
  - code: 2.1.4
    en: Describe the token-based pricing model and its effect on cost and performance for inference
    fr: Décrire le modèle de tarification basé sur des jetons et son effet sur les coûts et les performances pour l'inférence
  - code: 2.1.5
    en: Describe the role of context engineering in FM applications
    fr: Décrire le rôle de l'ingénierie du contexte (context engineering) dans les applications de FM
  - code: 2.1.6
    en: Define foundational agentic AI concepts (for example, multi-agent system patterns for complex AI applications, Model Context Protocol [MCP] and its role in connecting agents to external systems, multi-agent communication patterns, memory management, tool usage, and workflow orchestration)
    fr: Définir les concepts fondamentaux de l'IA agentique (par exemple, les modèles de systèmes multi-agents pour les applications d'IA complexes, le Model Context Protocol [MCP] et son rôle dans la connexion des agents à des systèmes externes, les modèles de communication multi-agents, la gestion de la mémoire, l'utilisation des outils et l'orchestration des flux de travail)
- group:
    en: Understand the capabilities and limitations of GenAI for solving business problems
    fr: Comprendre les capacités et les limites de l'IA générative pour résoudre les problèmes métier
  objectives:
  - code: 2.2.1
    en: Describe the advantages of GenAI (for example, adaptability, responsiveness, conversational capabilities, ability to generate content)
    fr: Décrire les avantages de l'IA générative (par exemple, adaptabilité, réactivité, capacités conversationnelles, capacité à générer du contenu)
  - code: 2.2.2
    en: Identify disadvantages of GenAI solutions (for example, hallucinations, interpretability, inaccuracy, nondeterminism)
    fr: Identifier les inconvénients des solutions d'IA générative (par exemple, hallucinations, interprétabilité, inexactitude, non-déterminisme)
  - code: 2.2.3
    en: Identify factors to consider when selecting GenAI models (for example, model types, performance requirements, capabilities, constraints, compliance, cost, latency, model complexity)
    fr: Identifier les facteurs à prendre en compte lors de la sélection des modèles d'IA générative (par exemple, les types de modèles, les exigences de performance, les capacités, les contraintes, la conformité, le coût, la latence, la complexité du modèle)
  - code: 2.2.4
    en: Determine business value and metrics for GenAI applications (for example, cross-domain performance, ROI, efficiency, conversion rate, average revenue per user, accuracy, customer lifetime value)
    fr: Déterminer la valeur métier et les métriques des applications d'IA générative (par exemple, performances interdomaines, ROI, efficacité, taux de conversion, revenus moyens par utilisateur, exactitude, valeur du cycle de vie du client)
- group:
    en: Describe AWS infrastructure and technologies for building GenAI applications
    fr: Décrire l'infrastructure et les technologies AWS permettant de créer des applications d'IA générative
  objectives:
  - code: 2.3.1
    en: Identify AWS services and features to develop GenAI applications (for example, Amazon Bedrock, Amazon SageMaker AI, SageMaker JumpStart, Amazon Quick, Kiro, Strands Agents, Amazon Bedrock AgentCore)
    fr: Identifier les services et fonctionnalités AWS permettant de développer des applications d'IA générative (par exemple, Amazon Bedrock, Amazon SageMaker AI, SageMaker JumpStart, Amazon Quick, Kiro, Strands Agents, Amazon Bedrock AgentCore)
  - code: 2.3.2
    en: Describe the advantages of using AWS GenAI services to build applications (for example, accessibility, lower barrier to entry, efficiency, cost-effectiveness, speed to market, ability to meet business objectives)
    fr: Décrire les avantages de l'utilisation des services AWS d'IA générative pour créer des applications (par exemple, accessibilité, réduction des obstacles à l'entrée, efficacité, rentabilité, rapidité de mise sur le marché, capacité à atteindre les objectifs de l'entreprise)
  - code: 2.3.3
    en: Describe the benefits of AWS infrastructure for GenAI applications (for example, security, compliance, responsibility, safety)
    fr: Décrire les avantages de l'infrastructure AWS pour les applications d'IA générative (par exemple, sécurité, conformité, responsabilité, sûreté)
  - code: 2.3.4
    en: Describe cost tradeoffs of AWS GenAI services (for example, responsiveness, availability, redundancy, performance, regional coverage, token-based pricing, provision throughput, custom models)
    fr: Décrire les compromis en matière de coûts des services AWS d'IA générative (par exemple, réactivité, disponibilité, redondance, performances, couverture régionale, tarification basée sur des jetons, débit provisionné [Provisioned Throughput], modèles personnalisés)
foundation:
- group:
    en: Describe design considerations for applications that use foundation models (FMs)
    fr: Décrire les considérations de conception pour les applications qui utilisent des modèles de fondation (FM)
  objectives:
  - code: 3.1.1
    en: Identify selection criteria to choose FMs (for example, cost, modality, latency, multi-lingual, model size, model complexity, customization, input/output length, prompt caching)
    fr: Identifier les critères de sélection pour choisir des FM (par exemple, coût, modalité, latence, multilingue, taille du modèle, complexité du modèle, personnalisation, longueur d'entrée/de sortie, mise en cache des invites)
  - code: 3.1.2
    en: Describe the effect of inference parameters on model responses (for example, temperature, input/output length)
    fr: Décrire l'effet des paramètres d'inférence sur les réponses du modèle (par exemple, température, longueur d'entrée/de sortie)
  - code: 3.1.3
    en: Define Retrieval Augmented Generation (RAG) and describe its business applications (for example, Amazon Bedrock Knowledge Bases)
    fr: Définir la génération à enrichissement contextuel (RAG) et décrire ses applications métier (par exemple, Amazon Bedrock Knowledge Bases)
  - code: 3.1.4
    en: Identify AWS services that help store embeddings within vector databases (for example, Amazon OpenSearch Service, Amazon Aurora, Amazon Neptune, Amazon RDS for PostgreSQL)
    fr: Identifier les services AWS qui permettent de stocker les intégrations (embeddings) dans des bases de données vectorielles (par exemple, Amazon OpenSearch Service, Amazon Aurora, Amazon Neptune, Amazon RDS for PostgreSQL)
  - code: 3.1.5
    en: Explain the cost tradeoffs of various approaches to FM customization (for example, pre-training, fine-tuning, in-context learning, RAG, model distillation)
    fr: Expliquer les compromis en matière de coûts des différentes approches de personnalisation du modèle de fondation (par exemple, préentraînement, peaufinage, apprentissage en contexte, RAG, distillation de modèles)
  - code: 3.1.6
    en: Define the role of AI agents and describe AI agents' business applications
    fr: Définir le rôle des agents d'IA et décrire les applications métier des agents d'IA
- group:
    en: Choose effective prompt engineering techniques
    fr: Choisir des techniques d'ingénierie de requête efficaces
  objectives:
  - code: 3.2.1
    en: Define the concepts and constructs of prompt engineering (for example, context, instruction, negative prompts)
    fr: Définir les concepts et les constructions de l'ingénierie de requête (par exemple, contexte, instruction, invites négatives)
  - code: 3.2.2
    en: Define techniques for prompt engineering (for example, chain-of-thought, zero-shot, single-shot, few-shot, prompt templates)
    fr: Définir des techniques d'ingénierie de requête (par exemple, chaîne de pensée [chain-of-thought], zero-shot, single-shot, few-shot, modèles d'invites [prompt templates])
  - code: 3.2.3
    en: Identify and describe the benefits and best practices for prompt engineering (for example, response quality improvement, experimentation, guardrails, discovery, specificity and concision, using multiple comments)
    fr: Identifier et décrire les avantages et les bonnes pratiques d'une ingénierie de requête (par exemple, amélioration de la qualité des réponses, expérimentation, barrières de protection, découverte, spécificité et concision, utilisation de plusieurs commentaires)
  - code: 3.2.4
    en: Define potential risks and limitations of prompt engineering (for example, exposure, poisoning, hijacking, jailbreaking)
    fr: Définir les risques potentiels et les limites de l'ingénierie de requête (par exemple, exposition, empoisonnement, détournement, débridage [jailbreaking])
  - code: 3.2.5
    en: Describe prompt versioning and management strategies that use Amazon Bedrock Prompt Management
    fr: Décrire les stratégies de gestion des versions et de gestion des invites qui utilisent Amazon Bedrock Prompt Management
- group:
    en: Describe the training and fine-tuning process for FMs
    fr: Décrire le processus d'entraînement et de peaufinage des modèles de fondation
  objectives:
  - code: 3.3.1
    en: Describe the key elements of training an FM (for example, pre-training, fine-tuning, continuous pre-training, distillation)
    fr: Décrire les éléments clés de l'entraînement d'un modèle de fondation (par exemple, préentraînement, peaufinage, préentraînement continu, distillation)
  - code: 3.3.2
    en: Define methods for fine-tuning an FM (for example, instruction tuning, adapting models for specific domains, transfer learning, continuous pre-training)
    fr: Définir des méthodes pour peaufiner un modèle de fondation (par exemple, réglage par instructions [instruction tuning], adaptation de modèles pour des domaines spécifiques, apprentissage par transfert, préentraînement continu)
  - code: 3.3.3
    en: Describe how to prepare data to fine-tune an FM (for example, data curation, governance, size, labeling, representativeness, reinforcement learning from human feedback [RLHF])
    fr: Décrire comment préparer les données pour peaufiner un modèle de fondation (par exemple, curation des données, gouvernance, taille, étiquetage, représentativité, apprentissage par renforcement à partir des commentaires humains [RLHF])
- group:
    en: Describe methods to evaluate FM performance
    fr: Décrire les méthodes d'évaluation des performances du modèle de fondation
  objectives:
  - code: 3.4.1
    en: Determine approaches to evaluate FM performance (for example, human-in-the-loop evaluation, benchmark datasets, Amazon Bedrock Model Evaluation)
    fr: Déterminer des approches pour évaluer les performances des FM (par exemple, évaluation avec intervention humaine, jeux de données de référence, Amazon Bedrock Model Evaluation)
  - code: 3.4.2
    en: Identify relevant metrics to assess FM performance (for example, Recall-Oriented Understudy for Gisting Evaluation [ROUGE], Bilingual Evaluation Understudy [BLEU], BERTScore, LLM-as-a-judge)
    fr: Identifier les métriques pertinentes pour évaluer les performances des FM (par exemple, ROUGE [Recall-Oriented Understudy for Gisting Evaluation], BLEU [Bilingual Evaluation Understudy], BERTScore, LLM-as-a-judge)
  - code: 3.4.3
    en: Determine whether an FM effectively meets business objectives (for example, productivity, user engagement, task engineering)
    fr: Déterminer si un FM répond efficacement aux objectifs métier (par exemple, productivité, engagement des utilisateurs, ingénierie des tâches)
  - code: 3.4.4
    en: Identify approaches to evaluate the performance of applications built with FM (for example, RAG, agents, workflows)
    fr: Identifier des approches permettant d'évaluer les performances des applications créées à l'aide de FM (par exemple, RAG, agents, flux de travail)
  - code: 3.4.5
    en: Identify business objective alignment metrics for AI applications (for example, task completion rate, user satisfaction, cost per interaction)
    fr: Identifier les métriques d'alignement des objectifs commerciaux pour les applications d'IA (par exemple, taux d'achèvement des tâches, satisfaction des utilisateurs, coût par interaction)
responsible:
- group:
    en: Explain the development of AI systems that are responsible
    fr: Expliquer le développement de systèmes d'IA responsable
  objectives:
  - code: 4.1.1
    en: Identify features of responsible AI (for example, bias, fairness, inclusivity, robustness, safety, veracity)
    fr: Identifier les caractéristiques d'une IA responsable (par exemple, biais, équité, inclusivité, robustesse, sûreté, véracité)
  - code: 4.1.2
    en: Explain how to use tools to identify features of responsible AI (for example, Amazon Bedrock Guardrails)
    fr: Expliquer comment utiliser des outils pour identifier les caractéristiques d'une IA responsable (par exemple, Amazon Bedrock Guardrails)
  - code: 4.1.3
    en: Define responsible practices to select a model (for example, environmental considerations, sustainability)
    fr: Définir des pratiques responsables pour sélectionner un modèle (par exemple, considérations environnementales, durabilité)
  - code: 4.1.4
    en: Identify legal risks of working with generative AI (GenAI) (for example, intellectual property infringement claims, biased model outputs, loss of customer trust, end user risk, hallucinations)
    fr: Identifier les risques juridiques liés à l'utilisation de l'IA générative (par exemple, les plaintes pour violation de propriété intellectuelle, les résultats biaisés des modèles, la perte de confiance des clients, les risques liés à l'utilisateur final, les hallucinations)
  - code: 4.1.5
    en: Identify characteristics of datasets (for example, inclusivity, diversity, curated data sources, balanced datasets)
    fr: Identifier les caractéristiques des jeux de données (par exemple, inclusivité, diversité, sources de données sélectionnées, jeux de données équilibrés)
  - code: 4.1.6
    en: Describe effects of bias and variance (for example, effects on demographic groups, inaccuracy, overfitting, underfitting)
    fr: Décrire les effets du biais et de la variance (par exemple, effets sur les groupes démographiques, imprécision, surajustement, sous-ajustement)
  - code: 4.1.7
    en: Describe tools to detect and monitor bias, trustworthiness, and truthfulness (for example, analyzing label quality, human audits, subgroup analysis)
    fr: Décrire les outils permettant de détecter et de contrôler les biais, la fiabilité et la véracité (par exemple, analyse de la qualité des étiquettes, audits humains, analyse de sous-groupes)
- group:
    en: Recognize the importance of transparent and explainable models
    fr: Reconnaître l'importance de modèles transparents et explicables
  objectives:
  - code: 4.2.1
    en: Describe the differences between models that are transparent and explainable and models that are not transparent and explainable
    fr: Décrire les différences entre les modèles transparents et explicables, et ceux qui ne le sont pas
  - code: 4.2.2
    en: Describe tools to identify transparent and explainable models (for example, Amazon SageMaker Model Cards, Amazon Bedrock Model Evaluations, open source models, data, licensing)
    fr: Décrire les outils permettant d'identifier les modèles transparents et explicables (par exemple, Amazon SageMaker Model Cards, Amazon Bedrock Model Evaluations, modèles open source, données, licences)
  - code: 4.2.3
    en: Identify tradeoffs between model safety and transparency (for example, measure interpretability and performance)
    fr: Identifier les compromis entre la sûreté et la transparence du modèle (par exemple, mesurer l'interprétabilité et les performances)
  - code: 4.2.4
    en: Describe principles of human-centered design for explainable AI (for example, user-feedback mechanisms, AI decision transparency)
    fr: Décrire les principes de la conception centrée sur l'humain pour une IA explicable (par exemple, mécanismes de commentaires des utilisateurs, transparence des décisions en matière d'IA)
governance:
- group:
    en: Explain methods to secure AI systems
    fr: Expliquer les méthodes permettant de sécuriser les systèmes d'IA
  objectives:
  - code: 5.1.1
    en: Identify AWS services and features to secure AI systems (for example, IAM roles, policies, and permissions; encryption; Amazon Macie; AWS PrivateLink; AWS shared responsibility model; Amazon Bedrock AgentCore Identity; Policy in AgentCore; Amazon Bedrock Guardrails)
    fr: Identifier les services et fonctionnalités AWS permettant de sécuriser les systèmes d'IA (par exemple, rôles, politiques et autorisations IAM ; chiffrement ; Amazon Macie ; AWS PrivateLink ; modèle de responsabilité partagée AWS ; Amazon Bedrock AgentCore Identity ; Policy dans AgentCore ; Amazon Bedrock Guardrails)
  - code: 5.1.2
    en: Describe the concept of source citation and documenting data origins (for example, data lineage, data cataloging, Amazon SageMaker Model Cards)
    fr: Décrire le concept de citation de la source et de documentation de l'origine des données (par exemple, traçabilité des données, catalogage des données, Amazon SageMaker Model Cards)
  - code: 5.1.3
    en: Describe best practices for secure data engineering (for example, assessing data quality, implementing privacy-enhancing technologies, data access control, data integrity)
    fr: Décrire les bonnes pratiques en matière d'ingénierie sécurisée des données (par exemple, évaluation de la qualité des données, mise en œuvre de technologies améliorant la confidentialité, contrôle de l'accès aux données, intégrité des données)
  - code: 5.1.4
    en: Describe security and privacy considerations for AI systems (for example, application security, threat detection, vulnerability management, infrastructure protection, prompt injection, encryption at rest and in transit, data leakage prevention, output filtering and validation, audit trail and logging requirements for AI interactions, toxicity)
    fr: Décrire les considérations relatives à la sécurité et à la confidentialité des systèmes d'IA (par exemple, sécurité des applications, détection des menaces, gestion des vulnérabilités, protection de l'infrastructure, injection d'invite, chiffrement au repos et en transit, prévention de la fuite de données, filtrage et validation des résultats, piste d'audit et exigences de journalisation pour les interactions d'IA, toxicité)
  - code: 5.1.5
    en: Describe hallucination detection methods and grounding techniques to improve output accuracy (for example, Retrieval Augmented Generation [RAG] grounding, output validation, confidence scoring)
    fr: Décrire les méthodes de détection des hallucinations et les techniques d'ancrage pour améliorer l'exactitude des résultats (par exemple, ancrage par génération à enrichissement contextuel [RAG], validation des résultats, score de confiance)
- group:
    en: Recognize governance and compliance regulations for AI systems
    fr: Reconnaître les réglementations en matière de gouvernance et de conformité pour les systèmes d'IA
  objectives:
  - code: 5.2.1
    en: Identify AWS services and features to assist with governance and regulation compliance (for example, AWS Config, Amazon Inspector, AWS Artifact, AWS CloudTrail, AWS Trusted Advisor)
    fr: Identifier les services et fonctionnalités AWS qui contribuent à la gouvernance et à la conformité aux réglementations (par exemple, AWS Config, Amazon Inspector, AWS Artifact, AWS CloudTrail, AWS Trusted Advisor)
  - code: 5.2.2
    en: Describe data governance strategies (for example, data lifecycles, logging, residency, monitoring, observation, retention)
    fr: Décrire les stratégies de gouvernance des données (par exemple, les cycles de vie des données, la journalisation, la résidence, la surveillance, l'observation, la conservation)
  - code: 5.2.3
    en: Describe processes to follow governance protocols (for example, policies, review cadence, review strategies, governance frameworks such as the Generative AI Security Scoping Matrix, transparency standards, team training requirements)
    fr: Décrire les processus permettant de suivre les protocoles de gouvernance (par exemple, les politiques, la cadence des examens, les stratégies de révision, les cadres de gouvernance tels que la matrice de cadrage de la sécurité de l'IA générative [Generative AI Security Scoping Matrix], les normes de transparence, les exigences en matière de formation des équipes)
