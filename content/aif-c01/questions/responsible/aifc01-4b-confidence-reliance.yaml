id: aifc01-4b-confidence-reliance
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A medical imaging company provides an AI system that flags possible anomalies in X-rays for radiologists. The radiologists need to know when they can rely on a result and when they should seek additional verification.

    Which design follows human-centered design principles for explainable AI?
  fr: |
    Une entreprise d'imagerie médicale fournit un système d'IA qui signale aux radiologues des anomalies possibles sur des radiographies. Les radiologues doivent savoir quand ils peuvent se fier à un résultat et quand ils doivent demander une vérification supplémentaire.

    Quelle conception suit les principes de la conception centrée sur l'humain pour une IA explicable ?
body:
  options:
    - { id: a, text: { en: "Show only the final result, so that the radiologists are not distracted by technical details", fr: "Afficher uniquement le résultat final, pour que les radiologues ne soient pas distraits par des détails techniques" } }
    - { id: b, text: { en: "Show a confidence indicator with each result and define when a result must go to expert review", fr: "Afficher un indicateur de confiance avec chaque résultat et définir quand un résultat doit passer en revue par un expert" } }
    - { id: c, text: { en: "Approve every result automatically when the system flags no anomaly", fr: "Approuver automatiquement chaque résultat lorsque le système ne signale aucune anomalie" } }
    - { id: d, text: { en: "Show the radiologists the raw weights of the model for each result", fr: "Montrer aux radiologues les poids bruts du modèle pour chaque résultat" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Human-centered guidance helps users identify when to trust outputs, when to seek additional verification, and when to override recommendations. A simple confidence indicator and clear criteria, such as thresholds that send a result to expert review, support that decision."
    fr: "Des conseils centrés sur l'humain aident les utilisateurs à savoir quand se fier aux sorties, quand demander une vérification supplémentaire et quand passer outre les recommandations. Un indicateur de confiance simple et des critères clairs, comme des seuils qui envoient un résultat en revue par un expert, facilitent cette décision."
  options:
    a:
      en: "Without any indication of confidence, the radiologists cannot tell a reliable result from an uncertain one."
      fr: "Sans aucune indication de confiance, les radiologues ne peuvent pas distinguer un résultat fiable d'un résultat incertain."
    c:
      en: "Automatic approval removes human judgment precisely where an error, such as a missed anomaly, has serious consequences."
      fr: "L'approbation automatique supprime le jugement humain justement là où une erreur, comme une anomalie manquée, a de graves conséquences."
    d:
      en: "Raw model weights are not understandable to clinicians; guidance should match the expertise of its users."
      fr: "Les poids bruts d'un modèle ne sont pas compréhensibles pour des cliniciens ; les conseils doivent correspondre à l'expertise des utilisateurs."
references:
  - title: "RAIGT01-BP04 Guide users on how to understand system outputs"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raigt01-bp04.html
