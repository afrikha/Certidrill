id: aifc01-4a-sel-multi-sustainable-dev
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data science team is developing a new ML model on Amazon SageMaker AI. The team wants to reduce the environmental impact of its development work.

    Which two practices will meet this requirement? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe de data science développe un nouveau modèle de ML sur Amazon SageMaker AI. Elle veut réduire l'impact environnemental de son travail de développement.

    Quelles sont les deux pratiques qui répondent à cette exigence ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Run a grid search over a large hyperparameter space for every experiment.", fr: "Effectuer une recherche par grille sur un vaste espace d'hyperparamètres pour chaque expérience." }
    - id: b
      text: { en: "Start experiments with a small subset of the training data.", fr: "Commencer les expériences avec un petit sous-ensemble des données d'entraînement." }
    - id: c
      text: { en: "Keep a copy of every dataset in every AWS Region.", fr: "Conserver une copie de chaque jeu de données dans chaque Région AWS." }
    - id: d
      text: { en: "Train a new model from scratch for each experiment.", fr: "Entraîner un nouveau modèle à partir de zéro pour chaque expérience." }
    - id: e
      text: { en: "Stop idle notebook instances and use managed training jobs that shut down when they complete.", fr: "Arrêter les instances de notebook inactives et utiliser des tâches d'entraînement gérées qui s'arrêtent à la fin." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "The sustainability best practices of the Machine Learning Lens recommend starting training with small datasets during development, and stopping resources when they are not in use. Managed training jobs shut down their instances when the job completes, and idle notebooks can be stopped automatically."
    fr: "Les bonnes pratiques de durabilité du Machine Learning Lens recommandent de commencer l'entraînement avec de petits jeux de données pendant le développement et d'arrêter les ressources inutilisées. Les tâches d'entraînement gérées arrêtent leurs instances à la fin de la tâche, et les notebooks inactifs peuvent être arrêtés automatiquement."
  options:
    a:
      en: "A grid search over a large space runs many training jobs; AWS recommends Bayesian search and a small search space to reduce the number of jobs."
      fr: "Une recherche par grille sur un vaste espace exécute de nombreuses tâches d'entraînement ; AWS recommande la recherche bayésienne et un espace de recherche réduit pour limiter le nombre de tâches."
    c:
      en: "Copies in every Region multiply storage and data transfer without need."
      fr: "Des copies dans chaque Région multiplient inutilement le stockage et le transfert de données."
    d:
      en: "Reusing existing models and artifacts, for example with transfer learning, uses fewer resources than training from scratch each time."
      fr: "Réutiliser des modèles et des artefacts existants, par exemple avec l'apprentissage par transfert, consomme moins de ressources que de tout réentraîner à chaque fois."
references:
  - title: "Sustainability pillar – Best practices"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/sustainability-pillar-best-practices-3.html
