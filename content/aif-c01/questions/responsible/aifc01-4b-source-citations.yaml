id: aifc01-4b-source-citations
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm builds a retrieval augmented generation (RAG) assistant that answers lawyers' questions from internal case files. The lawyers must be able to check where each piece of information in an answer comes from.

    Which design will meet this requirement?
  fr: |
    Un cabinet d'avocats développe un assistant de génération à enrichissement contextuel (RAG) qui répond aux questions des avocats à partir des dossiers internes. Les avocats doivent pouvoir vérifier d'où vient chaque information d'une réponse.

    Quelle conception répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Display citations with document identifiers and page numbers next to each answer", fr: "Afficher à côté de chaque réponse des citations avec les identifiants des documents et les numéros de page" } }
    - { id: b, text: { en: "Increase the maximum length of the answers so that they include more details", fr: "Augmenter la longueur maximale des réponses pour qu'elles contiennent plus de détails" } }
    - { id: c, text: { en: "Use a larger foundation model so that the answers are more accurate", fr: "Utiliser un modèle de fondation plus grand pour que les réponses soient plus exactes" } }
    - { id: d, text: { en: "Instruct the model in the prompt to answer only from the content of the case files", fr: "Demander au modèle, dans l'invite, de répondre uniquement à partir du contenu des dossiers" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Source attribution links retrieved information to its origin with specific citations, page numbers, and document identifiers. Displaying them alongside the generated content lets users verify independently where the information came from."
    fr: "L'attribution des sources relie les informations récupérées à leur origine avec des citations précises, des numéros de page et des identifiants de documents. Les afficher à côté du contenu généré permet aux utilisateurs de vérifier par eux-mêmes d'où viennent les informations."
  options:
    b:
      en: "Longer answers do not show where the information comes from; they can even make verification harder."
      fr: "Des réponses plus longues ne montrent pas d'où viennent les informations ; elles peuvent même compliquer la vérification."
    c:
      en: "A larger model might be more accurate, but users still cannot check the origin of each statement."
      fr: "Un modèle plus grand pourrait être plus exact, mais les utilisateurs ne peuvent toujours pas vérifier l'origine de chaque affirmation."
    d:
      en: "Restricting the model to the case files can reduce unsupported content, but the lawyers still cannot see which document each statement comes from."
      fr: "Limiter le modèle aux dossiers peut réduire le contenu non étayé, mais les avocats ne voient toujours pas de quel document provient chaque affirmation."
references:
  - title: "RAISP02-BP07 Incorporate explainability mechanisms into the core AI system"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp02-bp07.html
