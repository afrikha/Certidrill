id: aifc01-4a-legal-ip-images
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing team plans to publish images that it creates with an image generation model in a commercial advertising campaign. The legal team is concerned about intellectual property (IP) infringement claims.

    Which practice will reduce this risk?
  fr: |
    Une équipe marketing prévoit de publier, dans une campagne publicitaire commerciale, des images qu'elle crée avec un modèle de génération d'images. L'équipe juridique s'inquiète des réclamations pour violation de propriété intellectuelle (PI).

    Quelle pratique réduit ce risque ?
body:
  options:
    - { id: a, text: { en: "Generate more images for each prompt, and publish the image that the team likes best.", fr: "Générer davantage d'images pour chaque invite, et publier celle que l'équipe préfère." } }
    - { id: b, text: { en: "Write prompts that name famous characters and brands, so that the images are more recognizable.", fr: "Rédiger des invites qui nomment des personnages et des marques célèbres, pour que les images soient plus reconnaissables." } }
    - { id: c, text: { en: "Store the generated images in Amazon S3 Glacier, and keep them for the duration of the campaign.", fr: "Stocker les images générées dans Amazon S3 Glacier, et les conserver pendant toute la durée de la campagne." } }
    - { id: d, text: { en: "Check that the model terms allow commercial use, and review each image for similarity to protected works before publication.", fr: "Vérifier que les conditions du modèle autorisent l'usage commercial, et examiner chaque image pour détecter une ressemblance avec des œuvres protégées avant publication." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Generated content can resemble copyrighted or trademarked works, which exposes the company to IP infringement claims. Checking the license and terms of the model for commercial use, and having a person review each output before it is published, reduces this risk."
    fr: "Un contenu généré peut ressembler à des œuvres protégées par le droit d'auteur ou à des marques, ce qui expose l'entreprise à des réclamations pour violation de PI. Vérifier que la licence et les conditions du modèle autorisent l'usage commercial, et faire examiner chaque sortie par une personne avant publication, réduit ce risque."
  options:
    a:
      en: "Generating more images does not check them for infringement before they are published."
      fr: "Générer davantage d'images ne permet pas de vérifier l'absence de violation avant leur publication."
    b:
      en: "Prompts that name protected characters increase the chance of infringing output."
      fr: "Des invites qui nomment des personnages protégés augmentent le risque de sorties contrefaisantes."
    c:
      en: "The storage class of the images has no effect on whether their content infringes IP."
      fr: "La classe de stockage des images n'a aucun effet sur le fait que leur contenu viole ou non une PI."
references:
  - title: "Responsible use"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/responsible-use.html
