id: aifc01-4a-data-representative-use
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank wants to build a model that predicts the default risk of small-business loans in Europe. The only dataset that the team has contains the repayment history of consumer credit cards in another country.

    What is the MAIN concern with using this dataset?
  fr: |
    Une banque veut créer un modèle qui prédit le risque de défaut des prêts aux petites entreprises en Europe. Le seul jeu de données dont dispose l'équipe contient l'historique de remboursement de cartes de crédit de particuliers dans un autre pays.

    Quel est le PRINCIPAL problème posé par l'utilisation de ce jeu de données ?
body:
  options:
    - { id: a, text: { en: "The dataset is too large to train a model efficiently.", fr: "Le jeu de données est trop volumineux pour entraîner efficacement un modèle." } }
    - { id: b, text: { en: "The dataset must first be converted to unstructured data.", fr: "Le jeu de données doit d'abord être converti en données non structurées." } }
    - { id: c, text: { en: "The dataset contains labels, so only unsupervised learning can use it.", fr: "Le jeu de données contient des étiquettes : seul l'apprentissage non supervisé peut donc l'utiliser." } }
    - { id: d, text: { en: "The dataset does not represent the borrowers and the use case of the model.", fr: "Le jeu de données ne représente pas les emprunteurs ni le cas d'utilisation du modèle." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A dataset must reflect the real-world conditions in which the model will be used. Consumer credit cards in another country do not represent European small-business borrowers, so the model would learn patterns that do not apply, and its evaluation would be misleading."
    fr: "Un jeu de données doit refléter les conditions réelles dans lesquelles le modèle sera utilisé. Les cartes de crédit de particuliers d'un autre pays ne représentent pas les petites entreprises emprunteuses européennes : le modèle apprendrait des tendances qui ne s'appliquent pas, et son évaluation serait trompeuse."
  options:
    a:
      en: "Nothing indicates that the size is a problem; the content does not match the use case."
      fr: "Rien n'indique que la taille pose problème ; c'est le contenu qui ne correspond pas au cas d'utilisation."
    b:
      en: "Tabular repayment data is suitable for this type of prediction; converting it would not help."
      fr: "Des données tabulaires de remboursement conviennent à ce type de prédiction ; les convertir n'aiderait pas."
    c:
      en: "Labeled data is used for supervised learning, which suits default prediction."
      fr: "Les données étiquetées servent à l'apprentissage supervisé, qui convient à la prédiction de défaut."
references:
  - title: "RAIDP02-BP01 Validate the representativeness of datasets for the use case"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp01.html
