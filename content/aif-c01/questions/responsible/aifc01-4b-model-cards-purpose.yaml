id: aifc01-4b-model-cards-purpose
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank trains credit risk models in Amazon SageMaker AI. Its governance team wants a single place to document each model's intended uses, risk rating, training details, and evaluation results for audits.

    Which AWS feature will meet these requirements?
  fr: |
    Une banque entraîne des modèles de risque de crédit dans Amazon SageMaker AI. Son équipe de gouvernance veut un emplacement unique pour documenter, pour les audits, les utilisations prévues de chaque modèle, sa notation de risque, les détails de son entraînement et ses résultats d'évaluation.

    Quelle fonctionnalité AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS CloudTrail" }
    - { id: b, text: "Amazon SageMaker Model Cards" }
    - { id: c, text: "Amazon Bedrock Guardrails" }
    - { id: d, text: "AWS Trusted Advisor" }
answer: { optionId: b }
explanation:
  correct:
    en: "SageMaker Model Cards document critical details about ML models in a single place for governance and reporting: intended use, risk rating, training details and metrics, evaluation results and observations, and other considerations. This documentation makes the model more transparent to auditors and other stakeholders."
    fr: "SageMaker Model Cards documente en un seul endroit les informations essentielles sur les modèles de ML, à des fins de gouvernance et de reporting : utilisation prévue, notation de risque, détails et métriques d'entraînement, résultats et observations d'évaluation, et autres considérations. Cette documentation rend le modèle plus transparent pour les auditeurs et les autres parties prenantes."
  options:
    a:
      en: "CloudTrail records API activity in the account; it does not document a model's intended use or evaluation results."
      fr: "CloudTrail enregistre l'activité des API dans le compte ; il ne documente pas l'utilisation prévue ni les résultats d'évaluation d'un modèle."
    c:
      en: "Bedrock Guardrails filter the inputs and outputs of generative AI applications; they are not a model documentation tool."
      fr: "Bedrock Guardrails filtre les entrées et les sorties des applications d'IA générative ; ce n'est pas un outil de documentation des modèles."
    d:
      en: "Trusted Advisor checks the account against best practices for cost, security, and performance; it does not document ML models."
      fr: "Trusted Advisor compare le compte aux bonnes pratiques de coût, de sécurité et de performance ; il ne documente pas les modèles de ML."
references:
  - title: "Amazon SageMaker Model Cards"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
