id: aifc01-4b-calibrated-trust
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company gives loan officers AI recommendations with explanations and confidence scores. Satisfaction surveys show that the officers like the explanations. However, reviews show that the officers accept almost every recommendation, including incorrect ones that had low confidence.

    What should the company measure next?
  fr: |
    Une entreprise fournit à ses chargés de prêts des recommandations d'IA avec des explications et des scores de confiance. Les enquêtes de satisfaction montrent que les chargés apprécient les explications. Cependant, des revues montrent qu'ils acceptent presque toutes les recommandations, y compris des recommandations incorrectes à faible confiance.

    Que doit mesurer l'entreprise ensuite ?
body:
  options:
    - { id: a, text: { en: "Whether the officers rely on or override recommendations appropriately in scenarios where the system should and should not be trusted", fr: "Si les chargés se fient aux recommandations ou les écartent à bon escient dans des scénarios où le système doit ou ne doit pas être cru" } }
    - { id: b, text: { en: "How satisfied the officers are with the explanations, by using a larger survey with more questions", fr: "La satisfaction des chargés envers les explications, au moyen d'une enquête plus large avec davantage de questions" } }
    - { id: c, text: { en: "The area under the ROC curve (AUC) of the model on a new test dataset", fr: "L'aire sous la courbe ROC (AUC) du modèle sur un nouveau jeu de données de test" } }
    - { id: d, text: { en: "How many explanations the system generates each day, compared with the previous month", fr: "Le nombre d'explications générées chaque jour par le système, par rapport au mois précédent" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Calibrated trust testing creates scenarios where the system should and should not be trusted and checks whether users distinguish high-confidence from low-confidence situations. It reveals over-trust, which subjective satisfaction scores cannot detect, and shows whether the explanations actually help users decide when to question the system."
    fr: "Les tests de confiance calibrée créent des scénarios où le système doit ou ne doit pas être cru, et vérifient si les utilisateurs distinguent les situations de confiance élevée et faible. Ils révèlent l'excès de confiance, que les scores de satisfaction subjectifs ne détectent pas, et montrent si les explications aident vraiment les utilisateurs à savoir quand remettre en question le système."
  options:
    b:
      en: "The surveys already show satisfaction; the problem is over-reliance, which a subjective measure does not capture."
      fr: "Les enquêtes montrent déjà la satisfaction ; le problème est l'excès de confiance, qu'une mesure subjective ne saisit pas."
    c:
      en: "AUC measures the model's performance, not how the officers use its recommendations and explanations."
      fr: "L'AUC mesure la performance du modèle, et non la façon dont les chargés utilisent ses recommandations et ses explications."
    d:
      en: "The volume of explanations says nothing about whether users understand them or rely on them appropriately."
      fr: "Le volume d'explications n'indique pas si les utilisateurs les comprennent ni s'ils s'y fient à bon escient."
references:
  - title: "RAIRC03-BP08 Measure explainability of system behavior"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp08.html
