id: aifc01-4a-rai-dd-dimensions
objective: "4.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A financial services company is reviewing its AI lending application against the dimensions of responsible AI.

    Match each practice to the dimension of responsible AI that it supports. To answer, drag the appropriate dimension to each practice. Each dimension may be used once or not at all.
  fr: |
    Une entreprise de services financiers évalue son application de prêt basée sur l'IA au regard des dimensions de l'IA responsable.

    Associez chaque pratique à la dimension de l'IA responsable qu'elle soutient. Pour répondre, faites glisser la dimension appropriée vers chaque pratique. Chaque dimension peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: fair, text: { en: "Fairness", fr: "Équité" } }
    - { id: expl, text: { en: "Explainability", fr: "Explicabilité" } }
    - { id: priv, text: { en: "Privacy and security", fr: "Confidentialité et sécurité" } }
    - { id: gov, text: { en: "Governance", fr: "Gouvernance" } }
    - { id: ctrl, text: { en: "Controllability", fr: "Contrôlabilité" } }
  targets:
    - { id: t1, text: { en: "Show a loan officer which factors led the model to recommend rejecting an application.", fr: "Montrer à un chargé de prêts quels facteurs ont conduit le modèle à recommander le rejet d'une demande." } }
    - { id: t2, text: { en: "Encrypt the training data and give each team access only to the data that it needs.", fr: "Chiffrer les données d'entraînement et ne donner à chaque équipe accès qu'aux données dont elle a besoin." } }
    - { id: t3, text: { en: "Check that approval rates are consistent across age groups for comparable applicants.", fr: "Vérifier que les taux d'approbation sont cohérents entre tranches d'âge pour des demandeurs comparables." } }
    - { id: t4, text: { en: "Define who approves each model release and apply the same rules to model providers and deployers.", fr: "Définir qui approuve chaque mise en production de modèle et appliquer les mêmes règles aux fournisseurs et aux utilisateurs de modèles." } }
answer:
  mapping: { t1: expl, t2: priv, t3: fair, t4: gov }
explanation:
  correct:
    en: "Explaining which factors drove a recommendation supports explainability (understanding and evaluating outputs). Encryption and least-privilege access support privacy and security (appropriately obtaining, using and protecting data). Comparing outcomes across groups supports fairness. Release approvals applied across providers and deployers are governance practices across the AI supply chain. Controllability (monitoring and steering the system) is not described."
    fr: "Expliquer quels facteurs ont motivé une recommandation relève de l'explicabilité (comprendre et évaluer les sorties). Le chiffrement et l'accès selon le moindre privilège relèvent de la confidentialité et de la sécurité (obtenir, utiliser et protéger les données de façon appropriée). Comparer les résultats entre groupes relève de l'équité. Les approbations de mise en production appliquées aux fournisseurs comme aux utilisateurs sont des pratiques de gouvernance de la chaîne d'approvisionnement de l'IA. La contrôlabilité (surveiller et orienter le système) n'est pas décrite."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
