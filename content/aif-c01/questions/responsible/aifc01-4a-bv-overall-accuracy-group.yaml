id: aifc01-4a-bv-overall-accuracy-group
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's fraud detection model has 95% overall accuracy on the test set. Customers who use a regional payment method make up 4% of the test set, and the model misclassifies most of their transactions.

    Which statement about this model is correct?
  fr: |
    Le modèle de détection de fraude d'une entreprise atteint une exactitude globale de 95 % sur le jeu de test. Les clients qui utilisent un moyen de paiement régional représentent 4 % du jeu de test, et le modèle classe mal la plupart de leurs transactions.

    Quelle affirmation sur ce modèle est correcte ?
body:
  options:
    - { id: a, text: { en: "The overall accuracy hides a large error for a small group, so the company must measure performance for each group.", fr: "L'exactitude globale masque une erreur importante pour un petit groupe : l'entreprise doit donc mesurer les performances pour chaque groupe." } }
    - { id: b, text: { en: "The model is fair, because an overall accuracy of 95% is above the usual acceptance threshold for fraud models.", fr: "Le modèle est équitable, car une exactitude globale de 95 % dépasse le seuil d'acceptation habituel des modèles de fraude." } }
    - { id: c, text: { en: "The model underfits all customers, because an accuracy below 100% shows that it is too simple.", fr: "Le modèle est en sous-ajustement pour tous les clients, car une exactitude inférieure à 100 % montre qu'il est trop simple." } }
    - { id: d, text: { en: "The errors are acceptable, because the group is less than 5% of the test set and barely changes the score.", fr: "Les erreurs sont acceptables, car le groupe représente moins de 5 % du jeu de test et modifie à peine le score." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An aggregate metric is dominated by the largest groups, so a small group can have very poor results while the overall score stays high. Comparing metrics such as accuracy, precision and recall for each group reveals the inaccuracy and the unfair effect on that group."
    fr: "Une métrique agrégée est dominée par les groupes les plus nombreux : un petit groupe peut avoir de très mauvais résultats alors que le score global reste élevé. Comparer des métriques comme l'exactitude, la précision et le rappel pour chaque groupe révèle l'inexactitude et l'effet injuste sur ce groupe."
  options:
    b:
      en: "Overall accuracy says nothing about the performance gaps between groups, which define group fairness."
      fr: "L'exactitude globale ne dit rien des écarts de performance entre groupes, qui définissent l'équité entre groupes."
    c:
      en: "The model performs well for most customers; the problem is specific to one group, not underfitting of all data."
      fr: "Le modèle est performant pour la plupart des clients ; le problème est propre à un groupe, ce n'est pas un sous-ajustement de toutes les données."
    d:
      en: "A small group still has customers who are harmed by systematic errors."
      fr: "Un petit groupe compte quand même des clients lésés par des erreurs systématiques."
references:
  - title: "RAIRC03-BP02 Measure fairness as unwanted bias across stakeholder groups"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp02.html
