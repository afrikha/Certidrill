id: aifc01-4a-rai-safety-harmful
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An education company is building a homework assistant for teenagers. The company must prevent the assistant from producing harmful content and from being misused to obtain dangerous instructions.

    Which dimension of responsible AI does this requirement address?
  fr: |
    Une entreprise du secteur de l'éducation crée un assistant d'aide aux devoirs pour des adolescents. Elle doit empêcher l'assistant de produire du contenu nuisible et d'être détourné pour obtenir des instructions dangereuses.

    Quelle dimension de l'IA responsable cette exigence concerne-t-elle ?
body:
  options:
    - { id: a, text: { en: "Fairness", fr: "Équité" } }
    - { id: b, text: { en: "Safety", fr: "Sûreté" } }
    - { id: c, text: { en: "Explainability", fr: "Explicabilité" } }
    - { id: d, text: { en: "Governance", fr: "Gouvernance" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS describes safety as reducing harmful system output and misuse. Blocking harmful content and preventing the assistant from being used to obtain dangerous instructions is a safety requirement."
    fr: "AWS décrit la sûreté comme la réduction des sorties nuisibles et des usages abusifs du système. Bloquer le contenu nuisible et empêcher que l'assistant serve à obtenir des instructions dangereuses est une exigence de sûreté."
  options:
    a:
      en: "Fairness is about the impact of the system on different groups of stakeholders."
      fr: "L'équité concerne l'impact du système sur les différents groupes de parties prenantes."
    c:
      en: "Explainability is about understanding and evaluating why the system produces its outputs."
      fr: "L'explicabilité consiste à comprendre et évaluer pourquoi le système produit ses sorties."
    d:
      en: "Governance is about best practices across the AI supply chain, such as approvals and documentation, not about the content that the assistant produces."
      fr: "La gouvernance concerne les bonnes pratiques dans la chaîne d'approvisionnement de l'IA, comme les approbations et la documentation, pas le contenu produit par l'assistant."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
