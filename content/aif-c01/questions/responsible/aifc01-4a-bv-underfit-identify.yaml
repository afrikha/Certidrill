id: aifc01-4a-bv-underfit-identify
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team uses a very simple model to predict delivery times from many interacting factors. The model makes large errors on the training data and similar large errors on the validation data.

    Which condition does the model have?
  fr: |
    Une équipe utilise un modèle très simple pour prédire des délais de livraison à partir de nombreux facteurs qui interagissent. Le modèle commet de grandes erreurs sur les données d'entraînement et des erreurs aussi grandes sur les données de validation.

    Quel est l'état du modèle ?
body:
  options:
    - { id: a, text: { en: "Overfitting, with high variance", fr: "Surajustement, avec une variance élevée" } }
    - { id: b, text: { en: "A good fit, with low bias", fr: "Un bon ajustement, avec un biais faible" } }
    - { id: c, text: { en: "Overfitting, with low bias", fr: "Surajustement, avec un biais faible" } }
    - { id: d, text: { en: "Underfitting, with high bias", fr: "Sous-ajustement, avec un biais élevé" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Poor performance on the training data means that the model cannot capture the relationship between the inputs and the target, often because it is too simple. This is underfitting, and underfit models exhibit high bias."
    fr: "De mauvaises performances sur les données d'entraînement signifient que le modèle ne parvient pas à capturer la relation entre les entrées et la cible, souvent parce qu'il est trop simple. C'est un sous-ajustement, et les modèles en sous-ajustement présentent un biais élevé."
  options:
    a:
      en: "An overfit model performs well on the training data and poorly on new data; this model is poor on both."
      fr: "Un modèle en surajustement est performant sur les données d'entraînement et peu performant sur de nouvelles données ; ce modèle est mauvais sur les deux."
    b:
      en: "Large errors on the training data rule out a good fit."
      fr: "De grandes erreurs sur les données d'entraînement excluent un bon ajustement."
    c:
      en: "The model is not overfitting, because it does not fit the training data well."
      fr: "Le modèle n'est pas en surajustement, car il ne s'ajuste pas bien aux données d'entraînement."
references:
  - title: "Model Fit: Underfitting vs. Overfitting"
    url: https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html
