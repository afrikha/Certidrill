id: aifc01-4b-match-detection
objective: "4.1.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A financial services company is preparing the release of a credit scoring model. Match each requirement to the technique that meets it. To answer, drag the appropriate technique to each requirement. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une société de services financiers prépare la mise en production d'un modèle de notation de crédit. Associez chaque exigence à la technique qui y répond. Pour répondre, faites glisser la technique appropriée vers chaque exigence. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - id: label
      text: { en: "Label quality analysis", fr: "Analyse de la qualité des étiquettes" }
    - id: subgroup
      text: { en: "Subgroup analysis", fr: "Analyse de sous-groupes" }
    - id: audit
      text: { en: "Human audit", fr: "Audit humain" }
    - id: hpo
      text: { en: "Hyperparameter tuning", fr: "Réglage des hyperparamètres" }
    - id: augment
      text: { en: "Data augmentation", fr: "Augmentation des données" }
  targets:
    - id: t1
      text: { en: "Find out whether the historical decisions used as training labels were recorded consistently by different analysts.", fr: "Savoir si les décisions historiques utilisées comme étiquettes d'entraînement ont été enregistrées de façon cohérente par les différents analystes." }
    - id: t2
      text: { en: "Find out whether the model's recall is lower for applicants who live in rural areas.", fr: "Savoir si le rappel du modèle est plus faible pour les demandeurs qui vivent en zone rurale." }
    - id: t3
      text: { en: "Have people outside the development team review a sample of scores and the reasons behind them.", fr: "Faire examiner un échantillon de notes et leurs motifs par des personnes extérieures à l'équipe de développement." }
answer:
  mapping: { t1: label, t2: subgroup, t3: audit }
explanation:
  correct:
    en: "Label quality analysis checks whether the labels are consistent and correct, for example by measuring the agreement between annotators. Subgroup analysis computes metrics such as recall for each group and compares them. A human audit has independent people review a sample of outputs to corroborate automated evaluations."
    fr: "L'analyse de la qualité des étiquettes vérifie que les étiquettes sont cohérentes et correctes, par exemple en mesurant l'accord entre annotateurs. L'analyse de sous-groupes calcule des métriques comme le rappel pour chaque groupe et les compare. Un audit humain fait examiner un échantillon de sorties par des personnes indépendantes pour corroborer les évaluations automatisées."
  options:
    hpo: { en: "Hyperparameter tuning optimizes model performance; it does not detect bias or check labels.", fr: "Le réglage des hyperparamètres optimise la performance du modèle ; il ne détecte pas les biais et ne vérifie pas les étiquettes." }
    augment: { en: "Data augmentation creates additional training examples; it is a mitigation, not a detection technique.", fr: "L'augmentation des données crée des exemples d'entraînement supplémentaires ; c'est une atténuation, pas une technique de détection." }
references:
  - title: "RAIDP02-BP03 Validate the quality of human and generated labels and features in your dataset"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp03.html
  - title: "RAIER01-BP02 Independently corroborate more critical and subjective evaluations"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raier01-bp02.html
