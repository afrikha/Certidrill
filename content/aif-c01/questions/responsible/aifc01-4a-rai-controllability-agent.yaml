id: aifc01-4a-rai-controllability-agent
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company deploys an AI agent that processes customer refunds. The company requires operators to track the actions of the agent in real time and to be able to adjust or disable the agent quickly if it starts to behave unexpectedly.

    Which dimension of responsible AI does this requirement address?
  fr: |
    Une entreprise de distribution déploie un agent d'IA qui traite les remboursements des clients. Elle exige que les opérateurs suivent les actions de l'agent en temps réel et puissent l'ajuster ou le désactiver rapidement s'il commence à se comporter de façon inattendue.

    Quelle dimension de l'IA responsable cette exigence concerne-t-elle ?
body:
  options:
    - { id: a, text: { en: "Transparency", fr: "Transparence" } }
    - { id: b, text: { en: "Veracity and robustness", fr: "Véracité et robustesse" } }
    - { id: c, text: { en: "Fairness", fr: "Équité" } }
    - { id: d, text: { en: "Controllability", fr: "Contrôlabilité" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Controllability means having mechanisms to monitor and steer the behavior of an AI system. Monitoring the agent and having clear procedures to adjust or disable it, with effective human oversight, is a controllability requirement."
    fr: "La contrôlabilité consiste à disposer de mécanismes pour surveiller et orienter le comportement d'un système d'IA. Surveiller l'agent et disposer de procédures claires pour l'ajuster ou le désactiver, avec une supervision humaine efficace, est une exigence de contrôlabilité."
  options:
    a:
      en: "Transparency informs stakeholders about the system so that they can make informed choices; it does not give operators a way to steer or stop it."
      fr: "La transparence informe les parties prenantes sur le système pour qu'elles fassent des choix éclairés ; elle ne donne pas aux opérateurs un moyen de l'orienter ou de l'arrêter."
    b:
      en: "Veracity and robustness is about correct outputs, even with unexpected or adversarial inputs, not about the ability to intervene on the system."
      fr: "La véracité et la robustesse concernent l'exactitude des sorties, même avec des entrées inattendues ou malveillantes, pas la capacité d'intervenir sur le système."
    c:
      en: "Fairness is about the impact of the system on different groups of stakeholders."
      fr: "L'équité concerne l'impact du système sur les différents groupes de parties prenantes."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
