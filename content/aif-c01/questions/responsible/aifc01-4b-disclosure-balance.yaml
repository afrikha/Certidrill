id: aifc01-4b-disclosure-balance
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An online marketplace uses an AI system to detect fake seller accounts. The company wants to be transparent with sellers and regulators about the system. However, detailed information about the system's design and detection thresholds could help fraudsters avoid detection.

    Which approach balances transparency and safety?
  fr: |
    Une place de marché en ligne utilise un système d'IA pour détecter les faux comptes vendeurs. L'entreprise veut être transparente sur ce système envers les vendeurs et les régulateurs. Cependant, des informations détaillées sur la conception et les seuils de détection du système pourraient aider des fraudeurs à échapper à la détection.

    Quelle approche équilibre transparence et sûreté ?
body:
  options:
    - { id: a, text: { en: "Publish the full design, the features, and the detection thresholds so that every stakeholder can audit the system", fr: "Publier la conception complète, les caractéristiques et les seuils de détection pour que chaque partie prenante puisse auditer le système" } }
    - { id: b, text: { en: "Publish no information about the system, so that fraudsters cannot learn anything about it", fr: "Ne publier aucune information sur le système, pour que les fraudeurs ne puissent rien en apprendre" } }
    - { id: c, text: { en: "Publish only the overall accuracy of the system and keep all other information internal", fr: "Publier uniquement l'exactitude globale du système et garder toutes les autres informations en interne" } }
    - { id: d, text: { en: "Decide through a review process what each stakeholder group receives, and restrict sensitive design details to internal audiences", fr: "Décider par un processus de revue ce que reçoit chaque groupe de parties prenantes, et réserver les détails de conception sensibles à des publics internes" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A transparency strategy tailors the content to each stakeholder group: capabilities, limitations, risks, and guidance. Leadership identifies what is appropriate for public sharing and what stays restricted to internal audiences, and a publication review safeguards sensitive design and performance information while keeping appropriate transparency."
    fr: "Une stratégie de transparence adapte le contenu à chaque groupe de parties prenantes : capacités, limites, risques et conseils. La direction identifie ce qui peut être partagé publiquement et ce qui reste réservé à des publics internes, et une revue avant publication protège les informations sensibles de conception et de performance tout en maintenant une transparence appropriée."
  options:
    a:
      en: "Publishing the thresholds and features gives fraudsters what they need to evade the system, which harms safety."
      fr: "Publier les seuils et les caractéristiques donne aux fraudeurs ce dont ils ont besoin pour contourner le système, ce qui nuit à la sûreté."
    b:
      en: "Publishing nothing prevents sellers and regulators from making informed choices about the system, so it fails the transparency goal."
      fr: "Ne rien publier empêche les vendeurs et les régulateurs de faire des choix éclairés au sujet du système : l'objectif de transparence n'est pas atteint."
    c:
      en: "An overall accuracy figure alone does not explain capabilities, limitations, or how decisions affect sellers, and it is not tailored to each group."
      fr: "Un chiffre d'exactitude globale ne suffit pas à expliquer les capacités, les limites ou l'effet des décisions sur les vendeurs, et il n'est pas adapté à chaque groupe."
references:
  - title: "RAIGT01-BP01 Develop a transparency strategy"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raigt01-bp01.html
