id: aifc01-4b-decision-tree-rules
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hospital wants to predict which patients need a follow-up call after discharge. Clinicians require a model whose predictions follow a set of if-then rules that they can read and check themselves.

    Which type of model should the hospital use?
  fr: |
    Un hôpital veut prédire quels patients ont besoin d'un appel de suivi après leur sortie. Les cliniciens exigent un modèle dont les prédictions suivent un ensemble de règles « si-alors » qu'ils peuvent lire et vérifier eux-mêmes.

    Quel type de modèle l'hôpital doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "A decision tree", fr: "Un arbre de décision" } }
    - { id: b, text: { en: "A k-means clustering model", fr: "Un modèle de clustering k-means" } }
    - { id: c, text: { en: "A deep neural network", fr: "Un réseau neuronal profond" } }
    - { id: d, text: { en: "A foundation model with prompt engineering", fr: "Un modèle de fondation avec de l'ingénierie de requête" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A decision tree bases each prediction on a set of if-then rules, so the path that leads to a prediction can be read and checked. This simple relationship between the inputs and the output gives the model high interpretability."
    fr: "Un arbre de décision fonde chaque prédiction sur un ensemble de règles « si-alors » : le chemin qui mène à une prédiction peut donc être lu et vérifié. Cette relation simple entre les entrées et la sortie donne au modèle une forte interprétabilité."
  options:
    b:
      en: "K-means is an unsupervised algorithm that groups similar records; it does not predict a labeled outcome such as the need for a call."
      fr: "K-means est un algorithme non supervisé qui regroupe des enregistrements similaires ; il ne prédit pas un résultat étiqueté comme le besoin d'un appel."
    c:
      en: "A deep neural network can capture complex interactions, but its predictions are not expressed as readable rules."
      fr: "Un réseau neuronal profond peut capturer des interactions complexes, mais ses prédictions ne s'expriment pas sous forme de règles lisibles."
    d:
      en: "A foundation model generates outputs from billions of parameters; prompt engineering changes its inputs but does not turn its reasoning into checkable rules."
      fr: "Un modèle de fondation génère ses sorties à partir de milliards de paramètres ; l'ingénierie de requête modifie ses entrées mais ne transforme pas son raisonnement en règles vérifiables."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
