id: aifc01-4a-gr-multi-statements
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company plans to add a guardrail from Amazon Bedrock Guardrails to the Converse API calls of its chatbot.

    Which two statements about the guardrail are correct? (Choose two.)
  fr: |
    Une entreprise prévoit d'ajouter une barrière de protection Amazon Bedrock Guardrails aux appels de l'API Converse de son chatbot.

    Quelles sont les deux affirmations correctes sur la barrière de protection ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "The guardrail evaluates both the user input and the model response against its policies.", fr: "La barrière de protection évalue l'entrée de l'utilisateur et la réponse du modèle au regard de ses politiques." }
    - id: b
      text: { en: "The guardrail retrains the foundation model to remove the content that its policies block.", fr: "La barrière de protection réentraîne le modèle de fondation pour supprimer le contenu que ses politiques bloquent." }
    - id: c
      text: { en: "The guardrail can be used only with Amazon Nova models.", fr: "La barrière de protection ne peut être utilisée qu'avec les modèles Amazon Nova." }
    - id: d
      text: { en: "When the guardrail blocks the user input, no foundation model inference is charged.", fr: "Lorsque la barrière de protection bloque l'entrée de l'utilisateur, aucune inférence du modèle de fondation n'est facturée." }
    - id: e
      text: { en: "The guardrail removes the need to evaluate the accuracy of the model responses.", fr: "La barrière de protection rend inutile l'évaluation de l'exactitude des réponses du modèle." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A guardrail checks the user input first; if the input passes, it checks the model response with the same policies. When the input is blocked, the configured blocked message is returned, and the company pays only for the guardrail evaluation, with no foundation model inference charge."
    fr: "Une barrière de protection vérifie d'abord l'entrée de l'utilisateur ; si elle est acceptée, elle vérifie la réponse du modèle avec les mêmes politiques. Lorsque l'entrée est bloquée, le message de blocage configuré est renvoyé et l'entreprise ne paie que l'évaluation de la barrière de protection, sans frais d'inférence du modèle de fondation."
  options:
    b:
      en: "A guardrail filters inputs and outputs at inference time; it does not change the weights of the model."
      fr: "Une barrière de protection filtre les entrées et les sorties au moment de l'inférence ; elle ne modifie pas les pondérations du modèle."
    c:
      en: "Guardrails work with the foundation models of Amazon Bedrock, and the ApplyGuardrail API can even check text from models hosted elsewhere."
      fr: "Les barrières de protection fonctionnent avec les modèles de fondation d'Amazon Bedrock, et l'API ApplyGuardrail peut même vérifier du texte issu de modèles hébergés ailleurs."
    e:
      en: "Guardrails are one safeguard among others; the outputs of the model still need to be evaluated for accuracy and appropriateness for the use case."
      fr: "Les barrières de protection sont une protection parmi d'autres ; les sorties du modèle doivent toujours être évaluées pour leur exactitude et leur adéquation au cas d'utilisation."
references:
  - title: "How Amazon Bedrock Guardrails works"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-how.html
