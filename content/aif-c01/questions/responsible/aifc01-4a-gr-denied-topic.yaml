id: aifc01-4a-gr-denied-topic
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank is building a generative AI assistant on Amazon Bedrock that answers questions about its accounts and cards. The assistant must refuse any request for investment advice, however the user words the request.

    Which Amazon Bedrock Guardrails policy will meet this requirement?
  fr: |
    Une banque crée sur Amazon Bedrock un assistant d'IA générative qui répond aux questions sur ses comptes et ses cartes. L'assistant doit refuser toute demande de conseil en investissement, quelle que soit la formulation de l'utilisateur.

    Quelle politique d'Amazon Bedrock Guardrails répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Word filters", fr: "Filtres de mots (word filters)" } }
    - { id: b, text: { en: "Denied topics", fr: "Sujets refusés" } }
    - { id: c, text: { en: "Sensitive information filters", fr: "Filtres d'informations sensibles (sensitive information filters)" } }
    - { id: d, text: { en: "Contextual grounding checks", fr: "Vérifications de l'ancrage contextuel (contextual grounding checks)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A denied topic describes a subject that is undesirable for the application, with a name, a definition and optional sample phrases. The guardrail detects the topic in prompts and responses whatever the wording, and returns the blocked message. Investment advice is the example that AWS uses for this policy."
    fr: "Un sujet refusé décrit un thème indésirable pour l'application, avec un nom, une définition et des exemples de phrases facultatifs. La barrière de protection détecte le sujet dans les invites et les réponses quelle que soit la formulation, et renvoie le message de blocage. Le conseil en investissement est l'exemple qu'AWS utilise pour cette politique."
  options:
    a:
      en: "Word filters block exact words or phrases. They cannot catch the many ways to ask for investment advice."
      fr: "Les filtres de mots bloquent des mots ou des expressions exacts. Ils ne peuvent pas détecter toutes les façons de demander un conseil en investissement."
    c:
      en: "Sensitive information filters detect personally identifiable information (PII) and custom regex patterns, not subjects of conversation."
      fr: "Les filtres d'informations sensibles détectent les informations d'identification personnelle (PII) et des motifs regex personnalisés, pas des sujets de conversation."
    d:
      en: "Contextual grounding checks detect responses that are not grounded in a source or not relevant to the query; they do not block a subject."
      fr: "Les vérifications de l'ancrage contextuel détectent les réponses non ancrées dans une source ou non pertinentes pour la question ; elles ne bloquent pas un sujet."
references:
  - title: "Block denied topics to help remove harmful content"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
