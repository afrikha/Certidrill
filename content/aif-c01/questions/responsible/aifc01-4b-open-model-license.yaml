id: aifc01-4b-open-model-license
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company wants to deploy a publicly available foundation model from Amazon SageMaker JumpStart in a commercial product. The legal team must confirm that the product's intended use of the model is permitted.

    What should the legal team review?
  fr: |
    Un éditeur de logiciels veut déployer, dans un produit commercial, un modèle de fondation publiquement disponible d'Amazon SageMaker JumpStart. L'équipe juridique doit confirmer que l'utilisation prévue du modèle par le produit est autorisée.

    Que doit examiner l'équipe juridique ?
body:
  options:
    - { id: a, text: { en: "The AWS SOC 2 report that is available in AWS Artifact", fr: "Le rapport SOC 2 d'AWS disponible dans AWS Artifact" } }
    - { id: b, text: { en: "The benchmark scores published for the model", fr: "Les scores de benchmark publiés pour le modèle" } }
    - { id: c, text: { en: "The license of the model and its end-user license agreement (EULA), if one applies", fr: "La licence du modèle et son contrat de licence utilisateur final (EULA), s'il en existe un" } }
    - { id: d, text: { en: "The service quotas for SageMaker AI endpoints in the target Region", fr: "Les quotas de service des points de terminaison SageMaker AI dans la Région cible" } }
answer: { optionId: c }
explanation:
  correct:
    en: "JumpStart models are released under different licenses designated by the model source, such as Apache 2.0 or responsible AI licenses, and some models require explicit acceptance of a EULA before use. The license defines what uses are permitted, so it is the document to review."
    fr: "Les modèles JumpStart sont publiés sous différentes licences désignées par leur source, comme Apache 2.0 ou des licences d'IA responsable, et certains modèles exigent l'acceptation explicite d'un EULA avant utilisation. C'est la licence qui définit les utilisations autorisées : c'est donc le document à examiner."
  options:
    a:
      en: "AWS compliance reports describe the controls of AWS, not the terms under which a third-party model can be used."
      fr: "Les rapports de conformité d'AWS décrivent les contrôles d'AWS, et non les conditions d'utilisation d'un modèle tiers."
    b:
      en: "Benchmark scores describe the performance of the model; they say nothing about the uses that its license permits."
      fr: "Les scores de benchmark décrivent la performance du modèle ; ils n'indiquent rien sur les utilisations autorisées par sa licence."
    d:
      en: "Service quotas limit resources in an account; they are unrelated to the legal terms of the model."
      fr: "Les quotas de service limitent les ressources d'un compte ; ils n'ont aucun rapport avec les conditions juridiques du modèle."
references:
  - title: "Model sources and license agreements"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-choose.html
