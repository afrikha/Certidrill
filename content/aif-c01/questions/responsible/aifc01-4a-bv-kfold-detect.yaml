id: aifc01-4a-bv-kfold-detect
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team wants to check whether its model is overfitting. The team plans to split the training data into several equal subsets, train the model several times with a different subset held out each time, and average the scores on the held-out subsets.

    Which technique is the team planning to use?
  fr: |
    Une équipe veut vérifier si son modèle est en surajustement. Elle prévoit de diviser les données d'entraînement en plusieurs sous-ensembles égaux, d'entraîner le modèle plusieurs fois en mettant de côté un sous-ensemble différent à chaque fois, puis de faire la moyenne des scores obtenus sur les sous-ensembles mis de côté.

    Quelle technique l'équipe prévoit-elle d'utiliser ?
body:
  options:
    - { id: a, text: { en: "Data augmentation", fr: "Augmentation des données" } }
    - { id: b, text: { en: "Early stopping", fr: "Arrêt anticipé (early stopping)" } }
    - { id: c, text: { en: "K-fold cross-validation", fr: "Validation croisée à k blocs (k-fold)" } }
    - { id: d, text: { en: "Feature pruning", fr: "Élagage des variables (pruning)" } }
answer: { optionId: c }
explanation:
  correct:
    en: "K-fold cross-validation splits the training set into K subsets (folds). Each fold serves once as validation data while the model trains on the other folds, and the scores are averaged. A high error on the held-out folds compared with the training error signals overfitting."
    fr: "La validation croisée à k blocs divise le jeu d'entraînement en K sous-ensembles (blocs). Chaque bloc sert une fois de données de validation pendant que le modèle s'entraîne sur les autres, puis les scores sont moyennés. Une erreur élevée sur les blocs mis de côté par rapport à l'erreur d'entraînement signale un surajustement."
  options:
    a:
      en: "Data augmentation modifies training samples to prevent overfitting; it does not measure it."
      fr: "L'augmentation des données modifie les échantillons d'entraînement pour éviter le surajustement ; elle ne le mesure pas."
    b:
      en: "Early stopping halts training before the model learns noise; it is a prevention technique."
      fr: "L'arrêt anticipé interrompt l'entraînement avant que le modèle n'apprenne le bruit ; c'est une technique de prévention."
    d:
      en: "Pruning removes irrelevant features to prevent overfitting; it does not rotate held-out subsets."
      fr: "L'élagage supprime les variables non pertinentes pour éviter le surajustement ; il ne fait pas tourner des sous-ensembles mis de côté."
references:
  - title: "What is Overfitting?"
    url: https://aws.amazon.com/what-is/overfitting/
