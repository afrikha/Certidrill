id: aifc01-4a-bv-overfit-identify
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company trains a classification model to predict customer churn. The model reaches 99% accuracy on the training data but only 70% accuracy on new test data.

    Which condition does the model have?
  fr: |
    Une entreprise entraîne un modèle de classification pour prédire l'attrition des clients. Le modèle atteint une exactitude de 99 % sur les données d'entraînement, mais de seulement 70 % sur de nouvelles données de test.

    Quel est l'état du modèle ?
body:
  options:
    - { id: a, text: { en: "Underfitting, with high bias", fr: "Sous-ajustement, avec un biais élevé" } }
    - { id: b, text: { en: "Overfitting, with high variance", fr: "Surajustement, avec une variance élevée" } }
    - { id: c, text: { en: "A good fit, with low bias and low variance", fr: "Un bon ajustement, avec un biais et une variance faibles" } }
    - { id: d, text: { en: "Underfitting, with low variance", fr: "Sous-ajustement, avec une variance faible" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A model that performs well on the training data but poorly on new data is overfitting: it has memorized the training examples, including noise, instead of learning patterns that generalize. Overfit models exhibit high variance."
    fr: "Un modèle performant sur les données d'entraînement mais peu performant sur de nouvelles données est en surajustement : il a mémorisé les exemples d'entraînement, bruit compris, au lieu d'apprendre des tendances qui se généralisent. Les modèles en surajustement présentent une variance élevée."
  options:
    a:
      en: "An underfit model performs poorly on the training data too; this model is almost perfect on the training data."
      fr: "Un modèle en sous-ajustement est aussi peu performant sur les données d'entraînement ; ce modèle y est presque parfait."
    c:
      en: "A good fit performs similarly well on training data and new data; a 29-point gap is not a good fit."
      fr: "Un bon ajustement donne des performances comparables sur les données d'entraînement et les nouvelles données ; un écart de 29 points n'est pas un bon ajustement."
    d:
      en: "The model does not underfit, and the large gap between training and test results indicates high variance, not low variance."
      fr: "Le modèle n'est pas en sous-ajustement, et le grand écart entre les résultats d'entraînement et de test indique une variance élevée, pas faible."
references:
  - title: "What is Overfitting?"
    url: https://aws.amazon.com/what-is/overfitting/
