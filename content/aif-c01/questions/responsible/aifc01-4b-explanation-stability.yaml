id: aifc01-4b-explanation-stability
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment company uses a complex fraud detection model and shows post hoc explanations of its decisions to fraud analysts. Fraudsters often submit transactions that are slightly modified to test the model.

    What should the company validate before it relies on the explanations?
  fr: |
    Une société de paiement utilise un modèle complexe de détection de fraude et présente à ses analystes des explications post hoc de ses décisions. Les fraudeurs soumettent souvent des transactions légèrement modifiées pour tester le modèle.

    Que doit valider l'entreprise avant de se fier aux explications ?
body:
  options:
    - { id: a, text: { en: "That the explanations are generated in less than one second for each transaction", fr: "Que les explications sont générées en moins d'une seconde pour chaque transaction" } }
    - { id: b, text: { en: "That the explanations stay stable when the inputs change slightly", fr: "Que les explications restent stables lorsque les entrées changent légèrement" } }
    - { id: c, text: { en: "That the explanations use the same words for every transaction", fr: "Que les explications utilisent les mêmes mots pour chaque transaction" } }
    - { id: d, text: { en: "That the explanations list every feature of the model, even unused ones", fr: "Que les explications listent toutes les caractéristiques du modèle, même celles qui ne servent pas" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Post hoc analysis methods are susceptible to adversarial attacks: small perturbations of an input can cause large changes in the prediction and therefore in the explanation. The stability of the explanations must be validated, especially when users actively try to manipulate the model."
    fr: "Les méthodes d'analyse post hoc sont sensibles aux attaques adverses : de petites perturbations d'une entrée peuvent entraîner de grands changements dans la prédiction, et donc dans l'explication. La stabilité des explications doit être validée, surtout lorsque des utilisateurs cherchent activement à manipuler le modèle."
  options:
    a:
      en: "Latency can matter, but fast explanations are useless if small input changes make them unreliable."
      fr: "La latence peut compter, mais des explications rapides sont inutiles si de petits changements des entrées les rendent peu fiables."
    c:
      en: "Explanations are expected to differ between transactions, because each prediction is driven by different inputs."
      fr: "Les explications doivent différer d'une transaction à l'autre, car chaque prédiction dépend d'entrées différentes."
    d:
      en: "Listing unused features adds noise and does not show whether the explanations can be trusted."
      fr: "Lister des caractéristiques inutilisées ajoute du bruit et ne montre pas si les explications sont fiables."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
