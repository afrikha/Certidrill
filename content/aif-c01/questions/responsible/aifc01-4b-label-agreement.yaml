id: aifc01-4b-label-agreement
objective: "4.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company asks several employees to label customer emails as "complaint" or "request" to train a classification model. Before training, the company wants to find out whether the employees label the same kind of email consistently.

    Which approach will meet this requirement?
  fr: |
    Une compagnie d'assurance demande à plusieurs employés d'étiqueter des e-mails de clients comme « réclamation » ou « demande » pour entraîner un modèle de classification. Avant l'entraînement, l'entreprise veut savoir si les employés étiquettent le même type d'e-mail de façon cohérente.

    Quelle approche répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Calculate the ROUGE score between each label and the text of its email", fr: "Calculer le score ROUGE entre chaque étiquette et le texte de son e-mail" } }
    - { id: b, text: { en: "Train the model for more epochs on the labeled emails", fr: "Entraîner le modèle pendant davantage d'époques sur les e-mails étiquetés" } }
    - { id: c, text: { en: "Have several employees label the same emails and measure how often they agree", fr: "Faire étiqueter les mêmes e-mails par plusieurs employés et mesurer la fréquence de leur accord" } }
    - { id: d, text: { en: "Remove the longest emails from the dataset before labeling starts", fr: "Retirer les e-mails les plus longs du jeu de données avant le début de l'étiquetage" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Measuring inter-annotator (inter-rater) agreement is a label quality analysis: when several annotators label the same items, a low agreement rate shows that the labels are inconsistent. The company can then improve its guidelines or train the annotators before the inconsistent labels affect the model."
    fr: "Mesurer l'accord inter-annotateurs est une analyse de la qualité des étiquettes : lorsque plusieurs annotateurs étiquettent les mêmes éléments, un faible taux d'accord révèle des étiquettes incohérentes. L'entreprise peut alors améliorer ses consignes ou former les annotateurs avant que ces étiquettes n'affectent le modèle."
  options:
    a:
      en: "ROUGE compares a generated summary with reference summaries; it does not measure whether annotators agree with each other."
      fr: "ROUGE compare un résumé généré avec des résumés de référence ; il ne mesure pas si les annotateurs sont d'accord entre eux."
    b:
      en: "More training epochs make the model learn the existing labels more closely, including the inconsistent ones; they do not reveal labeling problems."
      fr: "Davantage d'époques font apprendre plus fidèlement les étiquettes existantes au modèle, y compris les incohérentes ; elles ne révèlent pas les problèmes d'étiquetage."
    d:
      en: "Removing long emails changes the dataset but gives no information about the consistency of the labels."
      fr: "Retirer les e-mails longs modifie le jeu de données mais ne donne aucune information sur la cohérence des étiquettes."
references:
  - title: "RAIDP02-BP03 Validate the quality of human and generated labels and features in your dataset"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp03.html
