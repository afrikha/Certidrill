id: aifc01-4a-rai-inclusivity-voice
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's voice assistant works well for speakers of the standard dialect. Users with regional accents and users with speech impairments report that the assistant often misunderstands them. The company wants the assistant to serve all its intended users.

    Which characteristic of responsible AI should the company improve?
  fr: |
    L'assistant vocal d'une entreprise fonctionne bien pour les locuteurs du dialecte standard. Les utilisateurs ayant un accent régional et ceux qui ont des troubles de la parole signalent que l'assistant les comprend souvent mal. L'entreprise veut que l'assistant serve tous les utilisateurs auxquels il est destiné.

    Quelle caractéristique de l'IA responsable l'entreprise doit-elle améliorer ?
body:
  options:
    - { id: a, text: { en: "Inclusivity", fr: "Inclusivité" } }
    - { id: b, text: { en: "Explainability", fr: "Explicabilité" } }
    - { id: c, text: { en: "Governance", fr: "Gouvernance" } }
    - { id: d, text: { en: "Transparency", fr: "Transparence" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Inclusivity means that the AI system works for the full range of people who will use it, including underrepresented accents, languages and abilities. The assistant excludes users with regional accents and speech impairments, so the company must improve inclusivity, for example with more diverse training and test data."
    fr: "L'inclusivité signifie que le système d'IA fonctionne pour toute la diversité des personnes qui l'utiliseront, y compris les accents, les langues et les capacités sous-représentés. L'assistant exclut les utilisateurs ayant un accent régional ou des troubles de la parole : l'entreprise doit donc améliorer l'inclusivité, par exemple avec des données d'entraînement et de test plus diversifiées."
  options:
    b:
      en: "Explainability helps understand why the assistant produced an output; it does not make the assistant work for more users."
      fr: "L'explicabilité aide à comprendre pourquoi l'assistant a produit une sortie ; elle ne le fait pas fonctionner pour davantage d'utilisateurs."
    c:
      en: "Governance covers best practices and oversight across the AI supply chain; it does not directly address users who are left out."
      fr: "La gouvernance couvre les bonnes pratiques et la supervision dans la chaîne d'approvisionnement de l'IA ; elle ne traite pas directement le cas des utilisateurs laissés de côté."
    d:
      en: "Transparency informs users about the system and its limitations; telling users about the problem does not solve it."
      fr: "La transparence informe les utilisateurs sur le système et ses limites ; informer les utilisateurs du problème ne le résout pas."
references:
  - title: "RAIDP01-BP02 Identify the datasets needed for training and customizing your system"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp01-bp02.html
