id: aifc01-4a-rai-bias-history
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company trains a model on 10 years of its own hiring decisions to rank job applications. Most people hired during that period were men. The model now ranks equally qualified women lower than men.

    Which statement describes this situation?
  fr: |
    Une entreprise entraîne un modèle sur 10 ans de ses propres décisions de recrutement pour classer des candidatures. La plupart des personnes recrutées pendant cette période étaient des hommes. Le modèle classe désormais des femmes à qualifications égales en dessous des hommes.

    Quelle affirmation décrit cette situation ?
body:
  options:
    - { id: a, text: { en: "The model hallucinates information that is not in the applications.", fr: "Le modèle hallucine des informations absentes des candidatures." } }
    - { id: b, text: { en: "The model reproduces a bias that is present in its historical training data.", fr: "Le modèle reproduit un biais présent dans ses données d'entraînement historiques." } }
    - { id: c, text: { en: "The model underfits because ten years of data is too little to learn from.", fr: "Le modèle est en sous-ajustement, car dix ans de données sont trop peu pour apprendre." } }
    - { id: d, text: { en: "The model output was changed by a prompt injection in the applications.", fr: "La sortie du modèle a été modifiée par une injection d'invite dans les candidatures." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A model learns the patterns of its training data, including past unfair decisions. Because the historical hires were mostly men, the model learned to favor men, which is a bias that leads to unfair outcomes for women."
    fr: "Un modèle apprend les tendances de ses données d'entraînement, y compris les décisions injustes du passé. Comme les recrutements historiques concernaient surtout des hommes, le modèle a appris à favoriser les hommes : c'est un biais qui produit des résultats injustes pour les femmes."
  options:
    a:
      en: "A hallucination is content that is not supported by the source or facts; here the model consistently applies a learned preference."
      fr: "Une hallucination est un contenu non étayé par la source ou les faits ; ici, le modèle applique de façon systématique une préférence apprise."
    c:
      en: "An underfit model performs poorly on all data; this model performs systematically worse for one group."
      fr: "Un modèle en sous-ajustement est peu performant sur toutes les données ; ce modèle est systématiquement moins bon pour un seul groupe."
    d:
      en: "Prompt injection is an input that overrides the instructions of a generative AI application; nothing indicates manipulated inputs here."
      fr: "L'injection d'invite est une entrée qui contourne les instructions d'une application d'IA générative ; rien n'indique ici des entrées manipulées."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
