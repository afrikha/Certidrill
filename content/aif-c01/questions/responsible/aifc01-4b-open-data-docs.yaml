id: aifc01-4b-open-data-docs
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research institute will select a foundation model for a public health project. Its review board requires that the team can inspect the model weights and review the sources of the data that the model was trained on.

    Which model meets these requirements?
  fr: |
    Un institut de recherche va sélectionner un modèle de fondation pour un projet de santé publique. Son comité d'examen exige que l'équipe puisse inspecter les poids du modèle et examiner les sources des données sur lesquelles il a été entraîné.

    Quel modèle répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An open-weight model whose provider publishes the weights but does not document the training data", fr: "Un modèle à poids ouverts dont le fournisseur publie les poids mais ne documente pas les données d'entraînement" } }
    - { id: b, text: { en: "An open-source model whose provider publishes the weights and documents the training data sources", fr: "Un modèle open source dont le fournisseur publie les poids et documente les sources des données d'entraînement" } }
    - { id: c, text: { en: "A proprietary model whose provider publishes a service card with intended uses and limitations", fr: "Un modèle propriétaire dont le fournisseur publie une fiche de service avec les utilisations prévues et les limites" } }
    - { id: d, text: { en: "A proprietary model that the institute can fine-tune with its own data in Amazon Bedrock", fr: "Un modèle propriétaire que l'institut peut affiner avec ses propres données dans Amazon Bedrock" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Only a model that publishes both its weights and documentation of its training data, such as a datasheet that lists data sources and collection methods, meets both requirements. Open models with full documentation are the most transparent option, because the team can inspect the model and assess what shaped it."
    fr: "Seul un modèle qui publie à la fois ses poids et une documentation de ses données d'entraînement, par exemple une fiche technique (datasheet) qui indique les sources et les méthodes de collecte des données, répond aux deux exigences. Les modèles ouverts entièrement documentés sont l'option la plus transparente, car l'équipe peut inspecter le modèle et évaluer ce qui l'a façonné."
  options:
    a:
      en: "Published weights allow the inspection of the model, but without documentation of the training data the review board cannot check the data sources."
      fr: "Des poids publiés permettent d'inspecter le modèle, mais sans documentation des données d'entraînement, le comité ne peut pas vérifier les sources des données."
    c:
      en: "A service card improves transparency about intended uses and limitations, but the weights of a proprietary model cannot be inspected."
      fr: "Une fiche de service améliore la transparence sur les utilisations prévues et les limites, mais les poids d'un modèle propriétaire ne peuvent pas être inspectés."
    d:
      en: "Fine-tuning adapts the model to new data but does not give access to its weights or to the data of its original training."
      fr: "L'affinage adapte le modèle à de nouvelles données mais ne donne accès ni à ses poids ni aux données de son entraînement d'origine."
references:
  - title: "RAIDP04-BP05 Document the characteristics of each dataset using a datasheet"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp04-bp05.html
  - title: "Model sources and license agreements"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-choose.html
