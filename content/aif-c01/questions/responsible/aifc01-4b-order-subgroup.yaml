id: aifc01-4b-order-subgroup
objective: "4.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A health insurance company wants to check whether its claim approval model is biased against some groups of customers before it releases a new version.

    Which three steps should the company perform in sequence? To answer, select the appropriate steps from the list and arrange them in the correct order.
  fr: |
    Une mutuelle santé veut vérifier si son modèle d'approbation des demandes de remboursement présente un biais envers certains groupes de clients avant de publier une nouvelle version.

    Quelles sont les trois étapes à effectuer dans l'ordre ? Pour répondre, sélectionnez les étapes appropriées dans la liste et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: remove
      text: { en: "Remove the group attributes from the evaluation dataset.", fr: "Supprimer les attributs de groupe du jeu de données d'évaluation." }
    - id: groups
      text: { en: "Identify the customer groups that could be harmed by the model.", fr: "Identifier les groupes de clients que le modèle pourrait léser." }
    - id: overall
      text: { en: "Calculate a single accuracy value for the whole evaluation dataset.", fr: "Calculer une valeur d'exactitude unique pour l'ensemble du jeu de données d'évaluation." }
    - id: compare
      text: { en: "Compare the differences between the groups with the accepted threshold.", fr: "Comparer les écarts entre les groupes au seuil accepté." }
    - id: metrics
      text: { en: "Calculate precision and recall for each group on the evaluation dataset.", fr: "Calculer la précision et le rappel de chaque groupe sur le jeu de données d'évaluation." }
answer:
  sequence: [groups, metrics, compare]
explanation:
  correct:
    en: "The company first identifies the groups that the risk assessment shows could be harmed. It then computes the performance metrics separately for each group on the evaluation dataset. Finally, it calculates the differences between groups and compares them with the acceptable threshold to decide whether the bias is acceptable."
    fr: "L'entreprise identifie d'abord les groupes que l'évaluation des risques désigne comme susceptibles d'être lésés. Elle calcule ensuite les métriques de performance séparément pour chaque groupe sur le jeu de données d'évaluation. Enfin, elle calcule les écarts entre les groupes et les compare au seuil acceptable pour décider si le biais est acceptable."
  options:
    remove: { en: "Without group attributes, the company cannot assign examples to groups, so it cannot measure differences between them.", fr: "Sans attributs de groupe, l'entreprise ne peut pas affecter les exemples aux groupes : elle ne peut donc pas mesurer les écarts entre eux." }
    overall: { en: "A single overall value hides the differences between groups that the company wants to find.", fr: "Une valeur globale unique masque les écarts entre groupes que l'entreprise cherche à trouver." }
references:
  - title: "RAIRC03-BP02 Measure fairness as unwanted bias across stakeholder groups"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp02.html
