id: aifc01-4b-model-card-fields
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company is preparing documentation for a demand forecasting model that it trained in Amazon SageMaker AI. The documentation must help stakeholders judge how the model should be used and how well it performs.

    Which two types of information can the company record in an Amazon SageMaker Model Card? (Choose two.)
  fr: |
    Une entreprise de distribution prépare la documentation d'un modèle de prévision de la demande qu'elle a entraîné dans Amazon SageMaker AI. La documentation doit aider les parties prenantes à juger comment le modèle doit être utilisé et à quel point il est performant.

    Quels sont les deux types d'informations que l'entreprise peut consigner dans une fiche Amazon SageMaker Model Card ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The intended uses and the risk rating of the model", fr: "Les utilisations prévues et la notation de risque du modèle" } }
    - { id: b, text: { en: "The real-time invocation logs of the model endpoint", fr: "Les journaux d'appel en temps réel du point de terminaison du modèle" } }
    - { id: c, text: { en: "The evaluation results and observations of the model", fr: "Les résultats et observations d'évaluation du modèle" } }
    - { id: d, text: { en: "The IAM credentials of the data scientists who trained the model", fr: "Les informations d'identification IAM des data scientists qui ont entraîné le modèle" } }
    - { id: e, text: { en: "The network traffic between the endpoint and the application", fr: "Le trafic réseau entre le point de terminaison et l'application" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A model card catalogs details such as the intended use and risk rating of a model, its training details and metrics, its evaluation results and observations, and additional considerations and recommendations. Together, they tell stakeholders how the model should be used and how well it performs."
    fr: "Une fiche de modèle répertorie des informations comme l'utilisation prévue et la notation de risque d'un modèle, les détails et métriques d'entraînement, les résultats et observations d'évaluation, ainsi que des considérations et recommandations supplémentaires. Ensemble, elles indiquent aux parties prenantes comment utiliser le modèle et quelle est sa performance."
  options:
    b:
      en: "Invocation logs are operational data collected by logging services, not documentation stored in a model card."
      fr: "Les journaux d'appel sont des données opérationnelles collectées par des services de journalisation, et non une documentation stockée dans une fiche de modèle."
    d:
      en: "Credentials are secrets that must never be written into documentation; a model card does not hold them."
      fr: "Les informations d'identification sont des secrets qui ne doivent jamais figurer dans une documentation ; une fiche de modèle ne les contient pas."
    e:
      en: "Network traffic is monitored with networking tools; it is not part of a model's documentation."
      fr: "Le trafic réseau se surveille avec des outils réseau ; il ne fait pas partie de la documentation d'un modèle."
references:
  - title: "Amazon SageMaker Model Cards"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
