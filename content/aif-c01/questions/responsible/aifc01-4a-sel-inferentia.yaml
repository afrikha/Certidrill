id: aifc01-4a-sel-inferentia
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs high-volume deep learning inference on Amazon EC2. As part of its sustainability goals, the company wants to improve the performance per watt of its inference infrastructure.

    Which EC2 instances should the company use?
  fr: |
    Une entreprise exécute des inférences de deep learning à fort volume sur Amazon EC2. Dans le cadre de ses objectifs de durabilité, elle veut améliorer les performances par watt de son infrastructure d'inférence.

    Quelles instances EC2 l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Larger general purpose instances with more vCPUs", fr: "Des instances à usage général plus grandes avec plus de vCPU" } }
    - { id: b, text: { en: "Memory optimized instances that keep the whole model in memory", fr: "Des instances à mémoire optimisée qui gardent tout le modèle en mémoire" } }
    - { id: c, text: { en: "Additional instances that run at low utilization to keep spare capacity", fr: "Des instances supplémentaires qui tournent à faible utilisation pour garder de la capacité en réserve" } }
    - { id: d, text: { en: "Inf2 instances that are powered by AWS Inferentia2 chips", fr: "Des instances Inf2 équipées de puces AWS Inferentia2" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Inferentia chips are purpose-built for deep learning and generative AI inference. AWS states that Inf2 instances offer up to 50% better performance per watt than comparable EC2 instances, so they reduce the energy used for the same inference workload."
    fr: "Les puces AWS Inferentia sont conçues spécifiquement pour l'inférence de deep learning et d'IA générative. AWS indique que les instances Inf2 offrent jusqu'à 50 % de performances par watt en plus que des instances EC2 comparables : elles réduisent donc l'énergie consommée pour la même charge d'inférence."
  options:
    a:
      en: "More general purpose vCPUs add capacity but are not designed to improve the energy efficiency of deep learning inference."
      fr: "Davantage de vCPU à usage général ajoutent de la capacité mais ne sont pas conçus pour améliorer l'efficacité énergétique de l'inférence de deep learning."
    b:
      en: "Memory optimized instances suit memory-intensive workloads; they are not the purpose-built option for inference efficiency."
      fr: "Les instances à mémoire optimisée conviennent aux charges gourmandes en mémoire ; ce n'est pas l'option conçue pour l'efficacité de l'inférence."
    c:
      en: "Instances that run at low utilization consume energy without doing useful work, which goes against sustainability goals."
      fr: "Des instances peu utilisées consomment de l'énergie sans effectuer de travail utile, ce qui va à l'encontre des objectifs de durabilité."
references:
  - title: "AWS Inferentia"
    url: https://aws.amazon.com/ai/machine-learning/inferentia/
