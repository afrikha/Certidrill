id: aifc01-4a-sel-managed-service
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to detect the sentiment of customer reviews written in English. A data science team proposes to train a new deep learning model from scratch on a large GPU cluster. The company wants the solution with the lowest environmental impact.

    Which solution will meet these requirements?
  fr: |
    Une entreprise veut détecter le sentiment d'avis clients rédigés en anglais. Une équipe de data science propose d'entraîner un nouveau modèle de deep learning à partir de zéro sur un grand cluster de GPU. L'entreprise veut la solution qui a le plus faible impact environnemental.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use the sentiment analysis of Amazon Comprehend.", fr: "Utiliser l'analyse des sentiments d'Amazon Comprehend." } }
    - { id: b, text: { en: "Train the model from scratch on a larger GPU cluster to finish faster.", fr: "Entraîner le modèle à partir de zéro sur un cluster de GPU plus grand pour terminer plus vite." } }
    - { id: c, text: { en: "Collect more reviews and train a larger model from scratch.", fr: "Collecter davantage d'avis et entraîner un modèle plus grand à partir de zéro." } }
    - { id: d, text: { en: "Train several models from scratch in parallel and keep the best one.", fr: "Entraîner plusieurs modèles à partir de zéro en parallèle et garder le meilleur." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Well-Architected Machine Learning Lens recommends using a managed AI service when it fits the use case, or reusing a pretrained model, instead of training a custom model. Amazon Comprehend already provides sentiment analysis, so the company avoids the data preparation and training resources of a new model."
    fr: "Le Machine Learning Lens du Well-Architected Framework recommande d'utiliser un service d'IA géré lorsqu'il convient au cas d'utilisation, ou de réutiliser un modèle préentraîné, au lieu d'entraîner un modèle personnalisé. Amazon Comprehend fournit déjà l'analyse des sentiments : l'entreprise évite ainsi les ressources de préparation des données et d'entraînement d'un nouveau modèle."
  options:
    b:
      en: "A larger cluster may finish sooner, but training from scratch still consumes far more resources than using an existing service."
      fr: "Un cluster plus grand peut terminer plus tôt, mais l'entraînement à partir de zéro consomme toujours bien plus de ressources que l'utilisation d'un service existant."
    c:
      en: "More data and a larger model increase the compute and energy needed for training."
      fr: "Plus de données et un modèle plus grand augmentent le calcul et l'énergie nécessaires à l'entraînement."
    d:
      en: "Training several models multiplies the training resources and their environmental impact."
      fr: "Entraîner plusieurs modèles multiplie les ressources d'entraînement et leur impact environnemental."
references:
  - title: "Sustainability pillar – Best practices"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/sustainability-pillar-best-practices-3.html
