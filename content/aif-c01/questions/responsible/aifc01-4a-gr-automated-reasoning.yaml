id: aifc01-4a-gr-automated-reasoning
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An HR department uses a generative AI assistant to answer employee questions about leave eligibility. The leave rules are written in a policy document. The department needs to verify each answer against these rules by using formal logic, with an explanation of which rules make an answer valid or invalid.

    Which Amazon Bedrock feature will meet these requirements?
  fr: |
    Un service RH utilise un assistant d'IA générative pour répondre aux questions des employés sur l'éligibilité aux congés. Les règles de congé sont rédigées dans un document de politique. Le service doit vérifier chaque réponse par rapport à ces règles à l'aide de la logique formelle, avec une explication des règles qui rendent une réponse valide ou non valide.

    Quelle fonctionnalité d'Amazon Bedrock répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Contextual grounding checks in Amazon Bedrock Guardrails", fr: "Vérifications de l'ancrage contextuel dans Amazon Bedrock Guardrails" } }
    - { id: b, text: { en: "A denied topic in Amazon Bedrock Guardrails", fr: "Un sujet refusé dans Amazon Bedrock Guardrails" } }
    - { id: c, text: { en: "Automated Reasoning checks in Amazon Bedrock Guardrails", fr: "Vérifications par raisonnement automatisé dans Amazon Bedrock Guardrails" } }
    - { id: d, text: { en: "A model evaluation job that uses LLM-as-a-judge", fr: "Une tâche d'évaluation de modèles qui utilise LLM-as-a-judge" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Automated Reasoning checks extract formal logic rules and variables from a source document into a policy. They then validate responses mathematically against that policy, return findings such as VALID or INVALID, and cite the rules that support or contradict each answer."
    fr: "Les vérifications par raisonnement automatisé extraient d'un document source des règles de logique formelle et des variables, qui forment une politique. Elles valident ensuite mathématiquement les réponses par rapport à cette politique, renvoient des résultats tels que VALID ou INVALID et citent les règles qui confirment ou contredisent chaque réponse."
  options:
    a:
      en: "Contextual grounding checks give a grounding score and a relevance score against a reference source; they do not apply formal logic or explain which rules apply."
      fr: "Les vérifications de l'ancrage contextuel donnent un score d'ancrage et un score de pertinence par rapport à une source de référence ; elles n'appliquent pas de logique formelle et n'expliquent pas quelles règles s'appliquent."
    b:
      en: "A denied topic blocks a subject; it does not check that an answer is consistent with rules."
      fr: "Un sujet refusé bloque un thème ; il ne vérifie pas qu'une réponse est cohérente avec des règles."
    d:
      en: "LLM-as-a-judge scores responses in an evaluation job with another model; it is not a formal verification of each answer in production."
      fr: "LLM-as-a-judge note des réponses dans une tâche d'évaluation à l'aide d'un autre modèle ; ce n'est pas une vérification formelle de chaque réponse en production."
references:
  - title: "What are Automated Reasoning checks in Amazon Bedrock Guardrails?"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
