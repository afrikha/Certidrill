id: aifc01-4a-rai-veracity-robustness
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company's AI assistant answers questions about bookings. The company requires the assistant to keep giving correct answers when customers submit prompts with typos, unusual wording, or deliberately misleading statements.

    Which dimension of responsible AI does this requirement address?
  fr: |
    L'assistant d'IA d'une agence de voyages répond aux questions sur les réservations. L'entreprise exige que l'assistant continue de donner des réponses correctes lorsque les clients soumettent des invites contenant des fautes de frappe, des formulations inhabituelles ou des affirmations volontairement trompeuses.

    Quelle dimension de l'IA responsable cette exigence concerne-t-elle ?
body:
  options:
    - { id: a, text: { en: "Fairness", fr: "Équité" } }
    - { id: b, text: { en: "Controllability", fr: "Contrôlabilité" } }
    - { id: c, text: { en: "Veracity and robustness", fr: "Véracité et robustesse" } }
    - { id: d, text: { en: "Transparency", fr: "Transparence" } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS defines veracity and robustness as achieving correct system outputs, even with unexpected or adversarial inputs. Typos, unusual wording and misleading prompts are exactly such inputs, so the requirement is about veracity and robustness."
    fr: "AWS définit la véracité et la robustesse comme le fait d'obtenir des sorties correctes, même avec des entrées inattendues ou malveillantes. Les fautes de frappe, les formulations inhabituelles et les invites trompeuses sont précisément de telles entrées : l'exigence relève donc de la véracité et de la robustesse."
  options:
    a:
      en: "Fairness is about the impact of the system on different groups of stakeholders, not about correct answers under unexpected inputs."
      fr: "L'équité concerne l'impact du système sur les différents groupes de parties prenantes, pas l'exactitude des réponses face à des entrées inattendues."
    b:
      en: "Controllability means having mechanisms to monitor and steer the behavior of the system, for example to adjust or disable it."
      fr: "La contrôlabilité consiste à disposer de mécanismes pour surveiller et orienter le comportement du système, par exemple pour l'ajuster ou le désactiver."
    d:
      en: "Transparency lets stakeholders make informed choices about their engagement with the system; it does not make answers correct."
      fr: "La transparence permet aux parties prenantes de faire des choix éclairés sur leur utilisation du système ; elle ne rend pas les réponses correctes."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
