id: aifc01-4a-bv-multi-reduce-overfit
objective: "4.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An image classification model is accurate on its training images but much less accurate on new images. The ML team wants to reduce this overfitting.

    Which two techniques will meet this requirement? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un modèle de classification d'images est exact sur ses images d'entraînement mais beaucoup moins sur de nouvelles images. L'équipe de ML veut réduire ce surajustement.

    Quelles sont les deux techniques qui répondent à cette exigence ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Add more layers and neurons to the neural network.", fr: "Ajouter des couches et des neurones au réseau neuronal." }
    - id: b
      text: { en: "Use data augmentation, such as flips and rotations of the training images.", fr: "Utiliser l'augmentation des données, par exemple des retournements et des rotations des images d'entraînement." }
    - id: c
      text: { en: "Train the model for more epochs on the same training images.", fr: "Entraîner le modèle pendant davantage d'époques sur les mêmes images d'entraînement." }
    - id: d
      text: { en: "Apply regularization, such as dropout.", fr: "Appliquer une régularisation, par exemple le dropout." }
    - id: e
      text: { en: "Evaluate the model on the training images only, without any new images.", fr: "Évaluer le modèle uniquement sur les images d'entraînement, sans nouvelles images." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Data augmentation slightly modifies the training samples, so the model does not learn overly specific traits of each image. Regularization penalizes unimportant features, and dropout randomly deactivates neurons during training. Both help the model generalize to new images."
    fr: "L'augmentation des données modifie légèrement les échantillons d'entraînement, ce qui empêche le modèle d'apprendre des traits trop spécifiques de chaque image. La régularisation pénalise les caractéristiques peu importantes, et le dropout désactive aléatoirement des neurones pendant l'entraînement. Les deux aident le modèle à se généraliser à de nouvelles images."
  options:
    a:
      en: "More layers increase the complexity of the model, which makes overfitting more likely."
      fr: "Davantage de couches augmentent la complexité du modèle, ce qui rend le surajustement plus probable."
    c:
      en: "More epochs let the model memorize the training data even more; early stopping does the opposite."
      fr: "Davantage d'époques permettent au modèle de mémoriser encore plus les données d'entraînement ; l'arrêt anticipé fait l'inverse."
    e:
      en: "Evaluating only on training images hides overfitting instead of reducing it."
      fr: "Évaluer uniquement sur les images d'entraînement masque le surajustement au lieu de le réduire."
references:
  - title: "What is Overfitting?"
    url: https://aws.amazon.com/what-is/overfitting/
