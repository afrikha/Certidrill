id: aifc01-4a-gr-multi-content-word
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A gaming company adds an AI assistant to its online game. The assistant must block player messages that contain insults or hate speech. The assistant must also block any message that mentions a list of 200 banned product names.

    Which two Amazon Bedrock Guardrails policies should the company configure? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une société de jeux vidéo ajoute un assistant d'IA à son jeu en ligne. L'assistant doit bloquer les messages des joueurs qui contiennent des insultes ou des propos haineux. Il doit aussi bloquer tout message qui mentionne une liste de 200 noms de produits interdits.

    Quelles sont les deux politiques d'Amazon Bedrock Guardrails que l'entreprise doit configurer ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Contextual grounding checks", fr: "Vérifications de l'ancrage contextuel" } }
    - { id: b, text: { en: "Content filters", fr: "Filtres de contenu" } }
    - { id: c, text: { en: "Sensitive information filters", fr: "Filtres d'informations sensibles" } }
    - { id: d, text: { en: "Automated Reasoning checks", fr: "Vérifications par raisonnement automatisé" } }
    - { id: e, text: { en: "Word filters", fr: "Filtres de mots" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Content filters detect harmful categories such as Hate and Insults, with a configurable strength. Word filters block custom words and phrases (up to 10,000 items) with case-insensitive whole-word matching, which fits a list of banned product names."
    fr: "Les filtres de contenu détectent des catégories nuisibles comme Hate (haine) et Insults (insultes), avec un niveau de rigueur réglable. Les filtres de mots bloquent des mots et des expressions personnalisés (jusqu'à 10 000 éléments) avec une correspondance de mots entiers insensible à la casse, ce qui convient à une liste de noms de produits interdits."
  options:
    a:
      en: "Contextual grounding checks detect responses that are not grounded in a source; they do not detect insults or specific names."
      fr: "Les vérifications de l'ancrage contextuel détectent les réponses non ancrées dans une source ; elles ne détectent ni les insultes ni des noms précis."
    c:
      en: "Sensitive information filters detect PII and regex patterns; product names are not personal information, and a word list is simpler."
      fr: "Les filtres d'informations sensibles détectent les PII et des motifs regex ; des noms de produits ne sont pas des données personnelles, et une liste de mots est plus simple."
    d:
      en: "Automated Reasoning checks validate responses against logical rules and only detect; they do not block insults or names."
      fr: "Les vérifications par raisonnement automatisé valident les réponses par rapport à des règles logiques et se limitent à la détection ; elles ne bloquent ni insultes ni noms."
references:
  - title: "Block harmful words and conversations with content filters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
  - title: "Remove a specific list of words and phrases from conversations with word filters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-word-filters.html
