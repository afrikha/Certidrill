id: aifc01-4a-gr-apply-self-hosted
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company already uses a guardrail in Amazon Bedrock Guardrails with its Amazon Bedrock applications. The company also runs an open source LLM that it hosts on Amazon EC2. The company wants to check the prompts and responses of the self-hosted LLM against the same guardrail policies, without invoking a foundation model on Amazon Bedrock.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise déjà une barrière de protection (guardrail) Amazon Bedrock Guardrails avec ses applications Amazon Bedrock. Elle exécute aussi un LLM open source qu'elle héberge sur Amazon EC2. L'entreprise veut vérifier les invites et les réponses du LLM auto-hébergé avec les mêmes politiques de barrière de protection, sans appeler de modèle de fondation sur Amazon Bedrock.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Call the ApplyGuardrail API with each prompt and each response of the self-hosted LLM.", fr: "Appeler l'API ApplyGuardrail avec chaque invite et chaque réponse du LLM auto-hébergé." } }
    - { id: b, text: { en: "Add the guardrail ID to Converse API calls that send the prompts to an Amazon Bedrock FM.", fr: "Ajouter l'ID de la barrière de protection aux appels de l'API Converse qui envoient les invites à un FM Amazon Bedrock." } }
    - { id: c, text: { en: "Enable model invocation logging and review the prompts and responses in Amazon CloudWatch.", fr: "Activer la journalisation des appels de modèles et examiner les invites et les réponses dans Amazon CloudWatch." } }
    - { id: d, text: { en: "Create a knowledge base that stores the guardrail policies and connect it to the EC2 instance.", fr: "Créer une base de connaissances qui stocke les politiques de la barrière de protection et la connecter à l'instance EC2." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The ApplyGuardrail API assesses any text against a preconfigured guardrail without invoking a foundation model. The application sends the prompt with the source INPUT and the response with the source OUTPUT, so the same policies apply to a model hosted outside Amazon Bedrock."
    fr: "L'API ApplyGuardrail évalue n'importe quel texte avec une barrière de protection préconfigurée, sans appeler de modèle de fondation. L'application envoie l'invite avec la source INPUT et la réponse avec la source OUTPUT : les mêmes politiques s'appliquent ainsi à un modèle hébergé en dehors d'Amazon Bedrock."
  options:
    b:
      en: "Converse calls invoke an Amazon Bedrock FM, which the company wants to avoid; they do not check the output of the self-hosted LLM."
      fr: "Les appels Converse appellent un FM Amazon Bedrock, ce que l'entreprise veut éviter ; ils ne vérifient pas la sortie du LLM auto-hébergé."
    c:
      en: "Invocation logging records Amazon Bedrock model calls for review; it does not evaluate content against guardrail policies."
      fr: "La journalisation des appels enregistre les appels de modèles Amazon Bedrock pour examen ; elle n'évalue pas le contenu au regard des politiques de la barrière de protection."
    d:
      en: "A knowledge base retrieves documents for RAG; it does not enforce guardrail policies."
      fr: "Une base de connaissances récupère des documents pour le RAG ; elle n'applique pas les politiques d'une barrière de protection."
references:
  - title: "Use the ApplyGuardrail API in your application"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
  - title: "Amazon Bedrock Guardrails"
    url: https://aws.amazon.com/bedrock/guardrails/
