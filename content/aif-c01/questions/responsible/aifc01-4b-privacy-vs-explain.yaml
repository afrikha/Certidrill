id: aifc01-4b-privacy-vs-explain
objective: "4.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank defines release criteria for a credit model, including minimum thresholds for privacy protection and for explainability. After the team adds a stronger privacy protection, the explainability score falls below its threshold, while privacy is well above its own.

    What should the team do?
  fr: |
    Une banque définit des critères de mise en production pour un modèle de crédit, dont des seuils minimaux de protection de la confidentialité et d'explicabilité. Après l'ajout d'une protection de la confidentialité plus forte par l'équipe, le score d'explicabilité passe sous son seuil, alors que la confidentialité dépasse largement le sien.

    Que doit faire l'équipe ?
body:
  options:
    - { id: a, text: { en: "Remove the explainability criterion so that the model can be released with the stronger privacy protection", fr: "Supprimer le critère d'explicabilité pour que le modèle puisse être mis en production avec la protection plus forte" } }
    - { id: b, text: { en: "Keep the protection, because privacy matters most, and release the model below the explainability threshold", fr: "Garder la protection, car la confidentialité compte le plus, et mettre le modèle en production sous le seuil d'explicabilité" } }
    - { id: c, text: { en: "Adjust the design to meet the minimum thresholds of both criteria, and document the trade-off decision with stakeholders", fr: "Ajuster la conception pour atteindre les seuils minimaux des deux critères, et documenter la décision de compromis avec les parties prenantes" } }
    - { id: d, text: { en: "Remove the privacy protection to obtain the highest possible explainability score", fr: "Retirer la protection de la confidentialité pour obtenir le score d'explicabilité le plus élevé possible" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Stronger privacy protections can make it harder to explain how decisions are made. AWS recommends priority rules that favor meeting the minimum requirements of all criteria over excelling at one, agreed with legal and business stakeholders, and documenting the thresholds, conflicts, and justification for auditing."
    fr: "Des protections de la confidentialité plus fortes peuvent rendre plus difficile l'explication des décisions. AWS recommande des règles de priorité qui privilégient l'atteinte des exigences minimales de tous les critères plutôt que l'excellence sur un seul, convenues avec les parties prenantes juridiques et métier, et la documentation des seuils, des conflits et de leur justification pour les audits."
  options:
    a:
      en: "Removing a criterion without justification hides the harm that it measured instead of managing the trade-off."
      fr: "Supprimer un critère sans justification masque le préjudice qu'il mesurait au lieu de gérer le compromis."
    b:
      en: "Releasing below a minimum threshold fails a release criterion; exceeding the privacy threshold does not compensate for it."
      fr: "Mettre en production sous un seuil minimal fait échouer un critère de mise en production ; dépasser le seuil de confidentialité ne le compense pas."
    d:
      en: "Maximizing one criterion at the expense of another is the opposite of the recommended approach and would put privacy at risk."
      fr: "Maximiser un critère au détriment d'un autre est l'inverse de l'approche recommandée et mettrait la confidentialité en danger."
references:
  - title: "RAISP01-BP02 Consider design trade-offs across competing objectives"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp01-bp02.html
  - title: "RAIRC04-BP02 Consider trade-offs between release criteria"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc04-bp02.html
