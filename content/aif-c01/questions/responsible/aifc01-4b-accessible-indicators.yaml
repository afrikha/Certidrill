id: aifc01-4b-accessible-indicators
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A public agency's AI assistant shows the confidence of each answer only as a colored icon. Some citizens who use the assistant have visual impairments and use screen readers.

    What should the agency do?
  fr: |
    L'assistant d'IA d'une administration publique indique la confiance de chaque réponse uniquement par une icône de couleur. Certains citoyens qui utilisent l'assistant ont une déficience visuelle et utilisent des lecteurs d'écran.

    Que doit faire l'administration ?
body:
  options:
    - { id: a, text: { en: "Remove the confidence indicator, because some users cannot see it", fr: "Supprimer l'indicateur de confiance, car certains utilisateurs ne peuvent pas le voir" } }
    - { id: b, text: { en: "Provide the confidence as text that screen readers can read, and offer voice output", fr: "Fournir la confiance sous forme de texte lisible par les lecteurs d'écran, et proposer une sortie vocale" } }
    - { id: c, text: { en: "Use brighter colors for the icons so that they are easier to notice", fr: "Utiliser des couleurs plus vives pour les icônes afin qu'elles se remarquent davantage" } }
    - { id: d, text: { en: "Publish a separate page that explains the meaning of each icon color", fr: "Publier une page séparée qui explique la signification de chaque couleur d'icône" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Explanations, confidence indicators, and status information should be available in formats that are accessible to users with different abilities, such as screen reader compatible content. Offering several input and output modes, such as text and voice, also lets more people use the system."
    fr: "Les explications, les indicateurs de confiance et les informations d'état doivent être disponibles dans des formats accessibles aux utilisateurs ayant des capacités différentes, comme un contenu compatible avec les lecteurs d'écran. Proposer plusieurs modes d'entrée et de sortie, comme le texte et la voix, permet aussi à davantage de personnes d'utiliser le système."
  options:
    a:
      en: "Removing the indicator takes the information away from every user instead of making it accessible."
      fr: "Supprimer l'indicateur retire l'information à tous les utilisateurs au lieu de la rendre accessible."
    c:
      en: "Brighter colors do not help users who rely on a screen reader."
      fr: "Des couleurs plus vives n'aident pas les utilisateurs qui dépendent d'un lecteur d'écran."
    d:
      en: "A legend of colors is still useless to a user who cannot perceive the icon next to each answer."
      fr: "Une légende des couleurs reste inutile pour un utilisateur qui ne perçoit pas l'icône à côté de chaque réponse."
references:
  - title: "RAIUC04-BP03 Identify accessibility requirements for different user groups"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raiuc04-bp03.html
