id: aifc01-4b-order-model-tradeoff
objective: "4.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An insurance company must choose between an interpretable model and a more complex model for pricing policies. It wants a decision that balances interpretability and performance and that auditors can review later.

    Which three steps should the company perform in sequence? To answer, select the appropriate steps from the list and arrange them in the correct order.
  fr: |
    Une compagnie d'assurance doit choisir entre un modèle interprétable et un modèle plus complexe pour la tarification de ses contrats. Elle veut une décision qui équilibre interprétabilité et performance, et que les auditeurs pourront examiner plus tard.

    Quelles sont les trois étapes à effectuer dans l'ordre ? Pour répondre, sélectionnez les étapes appropriées dans la liste et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: deploy
      text: { en: "Deploy both models and let each customer choose which model prices their policy.", fr: "Déployer les deux modèles et laisser chaque client choisir le modèle qui tarifie son contrat." }
    - id: measure
      text: { en: "Measure the performance and the interpretability of both models on the same evaluation dataset.", fr: "Mesurer la performance et l'interprétabilité des deux modèles sur le même jeu de données d'évaluation." }
    - id: select
      text: { en: "Select the model that meets every threshold, and document the trade-off decision.", fr: "Sélectionner le modèle qui atteint tous les seuils, et documenter la décision de compromis." }
    - id: highest
      text: { en: "Select the model that has the highest accuracy, whatever its interpretability.", fr: "Sélectionner le modèle qui a la meilleure exactitude, quelle que soit son interprétabilité." }
    - id: criteria
      text: { en: "Define minimum thresholds for performance and for interpretability.", fr: "Définir des seuils minimaux de performance et d'interprétabilité." }
answer:
  sequence: [criteria, measure, select]
explanation:
  correct:
    en: "The company first turns its requirements into release criteria with minimum thresholds. It then measures both candidates on the same evaluation dataset, to see whether the benefits of the explanations justify any accuracy cost. Finally, it selects the model that meets the minimums of all criteria and records the thresholds, conflicts, and justification for auditors."
    fr: "L'entreprise traduit d'abord ses exigences en critères de mise en production avec des seuils minimaux. Elle mesure ensuite les deux candidats sur le même jeu de données d'évaluation, pour voir si les bénéfices des explications justifient un éventuel coût en exactitude. Enfin, elle sélectionne le modèle qui atteint les minimums de tous les critères et consigne les seuils, les conflits et leur justification pour les auditeurs."
  options:
    deploy: { en: "Letting customers choose the pricing model does not make a balanced, documented decision.", fr: "Laisser les clients choisir le modèle de tarification ne constitue pas une décision équilibrée et documentée." }
    highest: { en: "Choosing on accuracy alone ignores the interpretability requirement instead of balancing it.", fr: "Choisir sur la seule exactitude ignore l'exigence d'interprétabilité au lieu de l'équilibrer." }
references:
  - title: "RAISP02-BP07 Incorporate explainability mechanisms into the core AI system"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp02-bp07.html
  - title: "RAIRC04-BP02 Consider trade-offs between release criteria"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc04-bp02.html
