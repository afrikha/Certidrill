id: aifc01-4a-rai-veracity-practices
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company uses a foundation model (FM) on Amazon Bedrock to answer customer questions about insurance policies. Some answers contain details that are not in the company's policy documents. The company wants to improve the veracity of the answers.

    Which two actions will meet this requirement? (Choose two.)

    Each correct answer presents a complete solution.
  fr: |
    Une compagnie d'assurance utilise un modèle de fondation (FM) sur Amazon Bedrock pour répondre aux questions des clients sur les contrats. Certaines réponses contiennent des détails absents des documents contractuels de l'entreprise. L'entreprise veut améliorer la véracité des réponses.

    Quelles sont les deux actions qui répondent à cette exigence ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Ground the answers in the approved policy documents by using Retrieval Augmented Generation (RAG).", fr: "Ancrer les réponses dans les documents contractuels approuvés grâce à la génération à enrichissement contextuel (RAG)." }
    - id: b
      text: { en: "Increase the temperature of the model so that it produces more varied answers.", fr: "Augmenter la température du modèle pour qu'il produise des réponses plus variées." }
    - id: c
      text: { en: "Add a word filter in Amazon Bedrock Guardrails that blocks the names of competitors.", fr: "Ajouter un filtre de mots dans Amazon Bedrock Guardrails qui bloque les noms des concurrents." }
    - id: d
      text: { en: "Filter out answers that are not supported by the source documents by using contextual grounding checks.", fr: "Filtrer les réponses non étayées par les documents sources grâce aux vérifications de l'ancrage contextuel." }
    - id: e
      text: { en: "Remove the system prompt so that the model receives shorter inputs.", fr: "Supprimer l'invite système pour que le modèle reçoive des entrées plus courtes." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Veracity is about correct outputs. RAG gives the model the relevant passages of the approved documents to base its answer on, and the contextual grounding checks of Amazon Bedrock Guardrails detect and filter responses that are not grounded in the source or add new information."
    fr: "La véracité concerne l'exactitude des sorties. Le RAG fournit au modèle les passages pertinents des documents approuvés sur lesquels baser sa réponse, et les vérifications de l'ancrage contextuel d'Amazon Bedrock Guardrails détectent et filtrent les réponses qui ne sont pas ancrées dans la source ou qui ajoutent des informations."
  options:
    b:
      en: "A higher temperature makes outputs more random, which tends to increase unsupported content, not reduce it."
      fr: "Une température plus élevée rend les sorties plus aléatoires, ce qui tend à augmenter le contenu non étayé au lieu de le réduire."
    c:
      en: "A word filter blocks specific words or phrases; it does not check that answers match the policy documents."
      fr: "Un filtre de mots bloque des mots ou des expressions précis ; il ne vérifie pas que les réponses correspondent aux documents contractuels."
    e:
      en: "The system prompt carries the instructions of the application; removing it does not make the answers more accurate."
      fr: "L'invite système porte les instructions de l'application ; la supprimer ne rend pas les réponses plus exactes."
references:
  - title: "Use contextual grounding check to filter hallucinations in responses"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
