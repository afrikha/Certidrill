id: aifc01-4b-subgroup-age
objective: "4.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank's loan approval model has an accuracy of 92% on its test dataset. The bank wants to find out whether the model performs worse for applicants in some age groups.

    What should the bank do?
  fr: |
    Le modèle d'approbation de prêts d'une banque a une exactitude de 92 % sur son jeu de données de test. La banque veut savoir si le modèle est moins performant pour les demandeurs de certaines tranches d'âge.

    Que doit faire la banque ?
body:
  options:
    - { id: a, text: { en: "Calculate the F1 score of the model on the whole test dataset", fr: "Calculer le score F1 du modèle sur l'ensemble du jeu de données de test" } }
    - { id: b, text: { en: "Calculate accuracy, precision, and recall separately for each age group and compare them", fr: "Calculer l'exactitude, la précision et le rappel séparément pour chaque tranche d'âge et les comparer" } }
    - { id: c, text: { en: "Remove the age attribute from the test dataset and evaluate the model again", fr: "Supprimer l'attribut d'âge du jeu de données de test et évaluer de nouveau le modèle" } }
    - { id: d, text: { en: "Calculate the area under the ROC curve (AUC) on the whole test dataset", fr: "Calculer l'aire sous la courbe ROC (AUC) sur l'ensemble du jeu de données de test" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Subgroup analysis computes the performance metrics for each group of stakeholders and compares the differences with an acceptable threshold. A good overall accuracy can hide a much lower accuracy or recall for one age group."
    fr: "L'analyse de sous-groupes calcule les métriques de performance pour chaque groupe de parties prenantes et compare les écarts à un seuil acceptable. Une bonne exactitude globale peut masquer une exactitude ou un rappel bien plus faibles pour une tranche d'âge."
  options:
    a:
      en: "An F1 score on the whole dataset is still a single overall value: it cannot show a difference between age groups."
      fr: "Un score F1 sur l'ensemble du jeu de données reste une valeur globale unique : il ne peut pas montrer d'écart entre tranches d'âge."
    c:
      en: "Without the age attribute, the bank can no longer tell which age group each applicant belongs to, so it cannot compare the groups."
      fr: "Sans l'attribut d'âge, la banque ne sait plus à quelle tranche d'âge appartient chaque demandeur : elle ne peut donc pas comparer les groupes."
    d:
      en: "AUC computed on the whole dataset is an overall measure; like accuracy, it can hide poor performance for one group."
      fr: "L'AUC calculée sur l'ensemble du jeu de données est une mesure globale ; comme l'exactitude, elle peut masquer une mauvaise performance pour un groupe."
references:
  - title: "RAIRC03-BP02 Measure fairness as unwanted bias across stakeholder groups"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp02.html
