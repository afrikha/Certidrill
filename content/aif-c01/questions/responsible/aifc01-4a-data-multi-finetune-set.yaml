id: aifc01-4a-data-multi-finetune-set
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building a dataset to fine-tune a foundation model for its customer support assistant. The assistant will serve customers in several countries and languages.

    Which two characteristics should the fine-tuning dataset have? (Choose two.)
  fr: |
    Une entreprise constitue un jeu de données pour le réglage précis (fine-tuning) d'un modèle de fondation destiné à son assistant de support client. L'assistant servira des clients dans plusieurs pays et plusieurs langues.

    Quelles sont les deux caractéristiques que le jeu de données de réglage précis doit présenter ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "It contains many duplicate examples of the most common request.", fr: "Il contient de nombreux exemples en double de la demande la plus fréquente." }
    - id: b
      text: { en: "It includes the examples of the evaluation dataset so that the model learns them.", fr: "Il inclut les exemples du jeu de données d'évaluation pour que le modèle les apprenne." }
    - id: c
      text: { en: "It covers the countries, languages, and request types that the assistant will handle.", fr: "Il couvre les pays, les langues et les types de demandes que l'assistant traitera." }
    - id: d
      text: { en: "It contains only conversations from the largest customer segment.", fr: "Il ne contient que des conversations du segment de clients le plus important." }
    - id: e
      text: { en: "It comes from vetted sources, with accurate labels that experts reviewed.", fr: "Il provient de sources vérifiées, avec des étiquettes exactes relues par des experts." }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "A responsible fine-tuning dataset is representative and diverse: it covers the user groups, languages and interaction types of the use case. It is also curated, with reliable sources and accurate labels, so that the model learns correct behavior."
    fr: "Un jeu de données de réglage précis responsable est représentatif et diversifié : il couvre les groupes d'utilisateurs, les langues et les types d'interactions du cas d'utilisation. Il est aussi sélectionné, avec des sources fiables et des étiquettes exactes, pour que le modèle apprenne un comportement correct."
  options:
    a:
      en: "Many duplicates of one request unbalance the dataset and add no diversity."
      fr: "De nombreux doublons d'une même demande déséquilibrent le jeu de données et n'apportent aucune diversité."
    b:
      en: "Training and evaluation data must stay completely separate; overlap makes the evaluation results unreliable."
      fr: "Les données d'entraînement et d'évaluation doivent rester totalement séparées ; un chevauchement rend les résultats d'évaluation peu fiables."
    d:
      en: "Data from one segment leaves the other customers underrepresented."
      fr: "Des données d'un seul segment laissent les autres clients sous-représentés."
references:
  - title: "RAIDP01-BP02 Identify the datasets needed for training and customizing your system"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp01-bp02.html
