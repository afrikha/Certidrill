id: aifc01-4b-tailor-explanations
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank uses an ML model to make credit decisions. It must explain these decisions both to customers and to its internal risk analysts.

    Which approach follows human-centered design principles for explainable AI?
  fr: |
    Une banque utilise un modèle de ML pour prendre des décisions de crédit. Elle doit expliquer ces décisions à la fois aux clients et à ses analystes des risques internes.

    Quelle approche suit les principes de la conception centrée sur l'humain pour une IA explicable ?
body:
  options:
    - { id: a, text: { en: "Send the same detailed technical report, with all feature attributions, to customers and analysts", fr: "Envoyer le même rapport technique détaillé, avec toutes les attributions des caractéristiques, aux clients et aux analystes" } }
    - { id: b, text: { en: "Explain the decisions only to the analysts, because customers do not need explanations", fr: "N'expliquer les décisions qu'aux analystes, car les clients n'ont pas besoin d'explications" } }
    - { id: c, text: { en: "Give customers a plain-language summary of the main factors, and give analysts detailed technical information", fr: "Donner aux clients un résumé en langage clair des principaux facteurs, et donner aux analystes des informations techniques détaillées" } }
    - { id: d, text: { en: "Give customers the model's overall accuracy instead of an explanation of their own decision", fr: "Donner aux clients l'exactitude globale du modèle au lieu d'une explication de leur propre décision" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Guidance on how to interpret outputs should match the expertise of each audience, with high-level summaries and detailed technical information as appropriate. Customers get the main factors behind their decision in plain language, and analysts get the depth that they need to review the model."
    fr: "Les conseils pour interpréter les sorties doivent correspondre à l'expertise de chaque public, avec des résumés de haut niveau ou des informations techniques détaillées selon le cas. Les clients reçoivent en langage clair les principaux facteurs de leur décision, et les analystes le niveau de détail dont ils ont besoin pour examiner le modèle."
  options:
    a:
      en: "A technical report with every feature attribution is hard for most customers to understand, so it does not serve them."
      fr: "Un rapport technique avec toutes les attributions des caractéristiques est difficile à comprendre pour la plupart des clients : il ne les sert donc pas."
    b:
      en: "Customers are affected by the decisions and need to understand them; leaving them out ignores a key stakeholder group."
      fr: "Les clients sont concernés par les décisions et doivent les comprendre ; les exclure ignore un groupe essentiel de parties prenantes."
    d:
      en: "Overall accuracy describes the model in general, not the reasons for one customer's decision."
      fr: "L'exactitude globale décrit le modèle en général, et non les raisons de la décision d'un client."
references:
  - title: "RAIGT01-BP04 Guide users on how to understand system outputs"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raigt01-bp04.html
