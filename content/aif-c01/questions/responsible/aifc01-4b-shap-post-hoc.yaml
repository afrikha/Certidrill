id: aifc01-4b-shap-post-hoc
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company predicts delivery delays with a deep neural network. After training, the team applies SHAP to show how much each input feature contributed to each prediction.

    Which statement is correct?
  fr: |
    Une entreprise de logistique prédit les retards de livraison avec un réseau neuronal profond. Après l'entraînement, l'équipe applique SHAP pour montrer la contribution de chaque caractéristique d'entrée à chaque prédiction.

    Quelle affirmation est correcte ?
body:
  options:
    - { id: a, text: { en: "SHAP turns the neural network into a decision tree, so the model becomes inherently interpretable", fr: "SHAP transforme le réseau neuronal en arbre de décision : le modèle devient donc intrinsèquement interprétable" } }
    - { id: b, text: { en: "The model stays complex, and SHAP gives a post hoc explanation of its predictions", fr: "Le modèle reste complexe, et SHAP fournit une explication post hoc de ses prédictions" } }
    - { id: c, text: { en: "SHAP shows the training records that the model memorized for each prediction", fr: "SHAP montre les enregistrements d'entraînement que le modèle a mémorisés pour chaque prédiction" } }
    - { id: d, text: { en: "SHAP can be used only with linear models, so the team must retrain the model", fr: "SHAP ne s'utilise qu'avec des modèles linéaires : l'équipe doit donc réentraîner le modèle" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A deep neural network is not inherently interpretable. SHAP is a model-agnostic post hoc method: it is applied to the trained model and attributes a share of each prediction to each input feature, which explains the prediction without changing the model."
    fr: "Un réseau neuronal profond n'est pas intrinsèquement interprétable. SHAP est une méthode post hoc indépendante du modèle : elle s'applique au modèle entraîné et attribue à chaque caractéristique d'entrée une part de chaque prédiction, ce qui explique la prédiction sans modifier le modèle."
  options:
    a:
      en: "SHAP does not change the model; it explains the existing model from its inputs and outputs."
      fr: "SHAP ne modifie pas le modèle ; il explique le modèle existant à partir de ses entrées et de ses sorties."
    c:
      en: "SHAP attributes the prediction to input features; it does not retrieve training records."
      fr: "SHAP attribue la prédiction aux caractéristiques d'entrée ; il ne récupère pas d'enregistrements d'entraînement."
    d:
      en: "Post hoc methods such as SHAP are often model-agnostic and are used precisely for complex models such as neural networks."
      fr: "Les méthodes post hoc comme SHAP sont souvent indépendantes du modèle et servent justement pour des modèles complexes comme les réseaux neuronaux."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
  - title: "Overview"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html
