id: aifc01-4a-data-balanced-skin
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company is building an image classification model that detects skin conditions. In the training dataset, 90% of the images show light skin tones. The model will be used for patients with all skin tones.

    Which problem does this dataset have?
  fr: |
    Une entreprise de santé crée un modèle de classification d'images qui détecte des affections cutanées. Dans le jeu de données d'entraînement, 90 % des images montrent des peaux claires. Le modèle sera utilisé pour des patients de toutes les carnations.

    Quel problème ce jeu de données présente-t-il ?
body:
  options:
    - { id: a, text: { en: "The dataset is not balanced across the groups that the model will serve.", fr: "Le jeu de données n'est pas équilibré entre les groupes que le modèle servira." } }
    - { id: b, text: { en: "The dataset contains unlabeled data that the model cannot use.", fr: "Le jeu de données contient des données non étiquetées que le modèle ne peut pas utiliser." } }
    - { id: c, text: { en: "The dataset is time-series data instead of image data.", fr: "Le jeu de données est une série chronologique et non un ensemble d'images." } }
    - { id: d, text: { en: "The dataset comes from too many curated sources.", fr: "Le jeu de données provient de trop de sources sélectionnées." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A balanced and diverse dataset represents all the groups that the model will serve. With 90% light skin tones, the model sees few examples of darker skin tones and is likely to be less accurate for those patients."
    fr: "Un jeu de données équilibré et diversifié représente tous les groupes que le modèle servira. Avec 90 % de peaux claires, le modèle voit peu d'exemples de peaux plus foncées et risque d'être moins exact pour ces patients."
  options:
    b:
      en: "Nothing indicates that the images lack labels; the problem is the distribution of skin tones."
      fr: "Rien n'indique que les images n'ont pas d'étiquettes ; le problème est la répartition des carnations."
    c:
      en: "The dataset contains images; the type of data is appropriate for the task."
      fr: "Le jeu de données contient des images ; le type de données convient à la tâche."
    d:
      en: "Curated sources improve quality; they are not the cause of the imbalance."
      fr: "Des sources sélectionnées améliorent la qualité ; elles ne sont pas la cause du déséquilibre."
references:
  - title: "RAIDP02-BP01 Validate the representativeness of datasets for the use case"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp01.html
