id: aifc01-4a-sel-evaluate-candidates
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is choosing between three foundation models (FMs) on Amazon Bedrock for a customer-facing summarization assistant. The company wants to follow responsible practices when it selects the model.

    Which approach should the company use?
  fr: |
    Une entreprise choisit entre trois modèles de fondation (FM) sur Amazon Bedrock pour un assistant de synthèse destiné aux clients. Elle veut suivre des pratiques responsables pour sélectionner le modèle.

    Quelle approche l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Choose the FM that has the highest score on a public leaderboard of general knowledge benchmarks.", fr: "Choisir le FM qui a le meilleur score dans un classement public de bancs d'essai de culture générale." } }
    - { id: b, text: { en: "Choose the most recent FM, because newer models are always safer and more accurate than older ones.", fr: "Choisir le FM le plus récent, car les modèles récents sont toujours plus sûrs et plus exacts que les anciens." } }
    - { id: c, text: { en: "Run model evaluation jobs in Amazon Bedrock that measure accuracy, robustness, and toxicity on representative prompts.", fr: "Exécuter dans Amazon Bedrock des tâches d'évaluation de modèles qui mesurent l'exactitude, la robustesse et la toxicité sur des invites représentatives." } }
    - { id: d, text: { en: "Choose the FM that has the largest number of parameters, because it can handle the most tasks.", fr: "Choisir le FM qui compte le plus grand nombre de paramètres, car il peut traiter le plus de tâches." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock model evaluation compares candidate models on a task with built-in or custom prompt datasets. For text summarization, automatic evaluation measures accuracy, robustness and toxicity, so the company selects the model on evidence that matches its use case and its responsible AI requirements."
    fr: "L'évaluation de modèles d'Amazon Bedrock compare des modèles candidats sur une tâche avec des jeux de données d'invites intégrés ou personnalisés. Pour la synthèse de texte, l'évaluation automatique mesure l'exactitude, la robustesse et la toxicité : l'entreprise choisit ainsi le modèle sur des éléments qui correspondent à son cas d'utilisation et à ses exigences d'IA responsable."
  options:
    a:
      en: "A public leaderboard does not use the company's data or measure toxicity and robustness for its use case."
      fr: "Un classement public n'utilise pas les données de l'entreprise et ne mesure pas la toxicité et la robustesse pour son cas d'utilisation."
    b:
      en: "Being newer does not guarantee that a model is safer or better suited; it must be evaluated."
      fr: "Être plus récent ne garantit pas qu'un modèle soit plus sûr ou mieux adapté ; il faut l'évaluer."
    d:
      en: "The largest model uses more resources and is not necessarily more accurate or less toxic for the task."
      fr: "Le plus grand modèle consomme plus de ressources et n'est pas forcément plus exact ou moins toxique pour la tâche."
references:
  - title: "Model evaluation task types in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
