id: aifc01-4a-data-inclusive-speech
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is collecting speech recordings to train a speech recognition model for a voice assistant that will be sold nationwide. So far, all recordings come from young adult speakers in one city who share the same accent.

    Which action will make the dataset more inclusive?
  fr: |
    Une entreprise collecte des enregistrements vocaux pour entraîner un modèle de reconnaissance vocale destiné à un assistant vocal vendu dans tout le pays. Pour l'instant, tous les enregistrements proviennent de jeunes adultes d'une seule ville qui ont le même accent.

    Quelle action rendra le jeu de données plus inclusif ?
body:
  options:
    - { id: a, text: { en: "Duplicate the existing recordings to double the size of the dataset.", fr: "Dupliquer les enregistrements existants pour doubler la taille du jeu de données." } }
    - { id: b, text: { en: "Add recordings from speakers of different ages, regions, accents, and speech patterns.", fr: "Ajouter des enregistrements de locuteurs d'âges, de régions, d'accents et de façons de parler différents." } }
    - { id: c, text: { en: "Keep only the recordings that were made in a quiet studio.", fr: "Ne garder que les enregistrements réalisés dans un studio silencieux." } }
    - { id: d, text: { en: "Increase the sample rate of the existing recordings.", fr: "Augmenter la fréquence d'échantillonnage des enregistrements existants." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An inclusive dataset covers the full range of people who will use the system. Recordings from speakers of different ages, regions, accents and speech patterns fill the gaps of underrepresented user groups, so the model can work for all users across the country."
    fr: "Un jeu de données inclusif couvre toute la diversité des personnes qui utiliseront le système. Des enregistrements de locuteurs d'âges, de régions, d'accents et de façons de parler différents comblent les lacunes des groupes d'utilisateurs sous-représentés : le modèle peut ainsi fonctionner pour tous les utilisateurs du pays."
  options:
    a:
      en: "Duplicates add volume but no new speakers, so the same groups remain missing."
      fr: "Des doublons ajoutent du volume mais aucun nouveau locuteur : les mêmes groupes restent absents."
    c:
      en: "Studio-only recordings make the data less representative of the real conditions in which the assistant will be used."
      fr: "Des enregistrements uniquement en studio rendent les données moins représentatives des conditions réelles d'utilisation de l'assistant."
    d:
      en: "A higher sample rate changes audio quality, not the diversity of the speakers."
      fr: "Une fréquence d'échantillonnage plus élevée change la qualité audio, pas la diversité des locuteurs."
references:
  - title: "RAIDP01-BP02 Identify the datasets needed for training and customizing your system"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp01-bp02.html
