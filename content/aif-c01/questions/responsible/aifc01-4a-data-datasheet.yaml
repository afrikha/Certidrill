id: aifc01-4a-data-datasheet
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to record, for each of its training datasets, the intended and prohibited uses, the data sources, the collection process, the known limitations, and the potential biases.

    What should the company create for each dataset?
  fr: |
    Une entreprise veut consigner, pour chacun de ses jeux de données d'entraînement, les usages prévus et interdits, les sources de données, le processus de collecte, les limites connues et les biais potentiels.

    Que doit-elle créer pour chaque jeu de données ?
body:
  options:
    - { id: a, text: { en: "A confusion matrix", fr: "Une matrice de confusion" } }
    - { id: b, text: { en: "A datasheet", fr: "Une fiche technique (datasheet)" } }
    - { id: c, text: { en: "A prompt template", fr: "Un modèle d'invite" } }
    - { id: d, text: { en: "A denied topic", fr: "Un sujet refusé" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Responsible AI Lens recommends documenting each dataset with a datasheet that covers its intended and inappropriate uses, composition, sources, collection process, labels, known limitations and potential biases. The datasheet is kept current as the dataset changes."
    fr: "Le Responsible AI Lens recommande de documenter chaque jeu de données avec une fiche technique (datasheet) qui couvre ses usages prévus et inappropriés, sa composition, ses sources, son processus de collecte, ses étiquettes, ses limites connues et ses biais potentiels. La fiche est tenue à jour lorsque le jeu de données évolue."
  options:
    a:
      en: "A confusion matrix summarizes the predictions of a classification model; it does not document a dataset."
      fr: "Une matrice de confusion résume les prédictions d'un modèle de classification ; elle ne documente pas un jeu de données."
    c:
      en: "A prompt template structures the inputs sent to a model."
      fr: "Un modèle d'invite structure les entrées envoyées à un modèle."
    d:
      en: "A denied topic is a policy of Amazon Bedrock Guardrails that blocks a subject."
      fr: "Un sujet refusé est une politique d'Amazon Bedrock Guardrails qui bloque un thème."
references:
  - title: "RAIDP04-BP05 Document the characteristics of each dataset using a datasheet"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp04-bp05.html
