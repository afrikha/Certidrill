id: aifc01-4a-bv-order-diagnose
objective: "4.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An ML team wants to find out whether a new model overfits and to correct it if it does.

    Which four steps should the team perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une équipe de ML veut savoir si un nouveau modèle est en surajustement et le corriger si c'est le cas.

    Quelles sont les quatre étapes que l'équipe doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: train, text: { en: "Train the model on the training set only.", fr: "Entraîner le modèle sur le seul jeu d'entraînement." } }
    - { id: features, text: { en: "Add more features and decrease regularization.", fr: "Ajouter des variables et réduire la régularisation." } }
    - { id: split, text: { en: "Split the labeled data into a training set and a validation set.", fr: "Diviser les données étiquetées en un jeu d'entraînement et un jeu de validation." } }
    - { id: remedy, text: { en: "If the validation error is much higher, increase regularization or add training data, and then retrain.", fr: "Si l'erreur de validation est bien plus élevée, augmenter la régularisation ou ajouter des données d'entraînement, puis réentraîner." } }
    - { id: compare, text: { en: "Compare the training error with the validation error.", fr: "Comparer l'erreur d'entraînement à l'erreur de validation." } }
    - { id: merge, text: { en: "Add the validation set to the training set to get more data.", fr: "Ajouter le jeu de validation au jeu d'entraînement pour obtenir plus de données." } }
answer:
  sequence: [ split, train, compare, remedy ]
explanation:
  correct:
    en: "Overfitting is detected by comparing the error on the training data with the error on data that the model did not see during training. The team therefore holds out a validation set, trains on the rest, compares the two errors and, if the validation error is much higher, reduces the flexibility of the model (more regularization) or adds training examples before retraining."
    fr: "Le surajustement se détecte en comparant l'erreur sur les données d'entraînement à l'erreur sur des données que le modèle n'a pas vues pendant l'entraînement. L'équipe met donc de côté un jeu de validation, entraîne sur le reste, compare les deux erreurs et, si l'erreur de validation est bien plus élevée, réduit la flexibilité du modèle (plus de régularisation) ou ajoute des exemples d'entraînement avant de réentraîner."
  options:
    features:
      en: "More features and less regularization increase flexibility, which remedies underfitting and worsens overfitting."
      fr: "Plus de variables et moins de régularisation augmentent la flexibilité, ce qui corrige le sous-ajustement et aggrave le surajustement."
    merge:
      en: "Without held-out data, the team can no longer measure how the model generalizes."
      fr: "Sans données mises de côté, l'équipe ne peut plus mesurer la capacité de généralisation du modèle."
references:
  - title: "Model Fit: Underfitting vs. Overfitting"
    url: https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html
