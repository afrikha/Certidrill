id: aifc01-4b-post-interaction
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is designing what users see after its AI system returns a result. It wants to follow human-centered design principles for explainable AI.

    Which two capabilities should the company provide at this stage? (Choose two.)
  fr: |
    Une entreprise conçoit ce que voient les utilisateurs après que son système d'IA a renvoyé un résultat. Elle veut suivre les principes de la conception centrée sur l'humain pour une IA explicable.

    Quelles sont les deux fonctionnalités que l'entreprise doit fournir à cette étape ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A way for users to challenge the result and submit feedback about it", fr: "Un moyen pour les utilisateurs de contester le résultat et d'envoyer un commentaire à son sujet" } }
    - { id: b, text: { en: "A design that hides the fact that the result was generated by AI", fr: "Une conception qui masque le fait que le résultat a été généré par l'IA" } }
    - { id: c, text: { en: "A confidence indicator and an explanation of the result", fr: "Un indicateur de confiance et une explication du résultat" } }
    - { id: d, text: { en: "A lock that prevents users from changing their input after the first result", fr: "Un verrou qui empêche les utilisateurs de modifier leur saisie après le premier résultat" } }
    - { id: e, text: { en: "A separate page that lists only the aggregate accuracy of the system", fr: "Une page séparée qui indique uniquement l'exactitude globale du système" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "After an interaction, users should be able to understand, challenge, and provide feedback on AI outputs, which keeps the system accountable and improvable. Confidence indicators, explanation features, and guidance on the appropriate use of results help users understand each output."
    fr: "Après une interaction, les utilisateurs doivent pouvoir comprendre et contester les sorties de l'IA, et donner leur avis à leur sujet, ce qui rend le système responsable et améliorable. Les indicateurs de confiance, les fonctions d'explication et les conseils sur l'usage approprié des résultats aident les utilisateurs à comprendre chaque sortie."
  options:
    b:
      en: "Hiding AI involvement prevents users from making informed choices, which is the opposite of transparency."
      fr: "Masquer l'intervention de l'IA empêche les utilisateurs de faire des choix éclairés : c'est l'inverse de la transparence."
    d:
      en: "Locking the input reduces user control and does not help users understand the result."
      fr: "Verrouiller la saisie réduit le contrôle de l'utilisateur et ne l'aide pas à comprendre le résultat."
    e:
      en: "An aggregate accuracy figure on another page does not explain the result that the user is looking at."
      fr: "Un chiffre d'exactitude globale sur une autre page n'explique pas le résultat que l'utilisateur a sous les yeux."
references:
  - title: "RAIUC04-BP01 Map the user journey to identify AI interaction requirements"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raiuc04-bp01.html
