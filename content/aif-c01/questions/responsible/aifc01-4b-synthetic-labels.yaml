id: aifc01-4b-synthetic-labels
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company uses a large language model (LLM) to label 200,000 product reviews as positive, negative, or neutral. The labels will be used to train a sentiment model. The company wants to confirm that the generated labels are trustworthy, including for reviews written in regional dialects that are rare in the dataset.

    Which approach will meet these requirements?
  fr: |
    Une entreprise de distribution utilise un grand modèle de langage (LLM) pour étiqueter 200 000 avis sur des produits comme positifs, négatifs ou neutres. Les étiquettes serviront à entraîner un modèle de sentiment. L'entreprise veut confirmer que les étiquettes générées sont fiables, y compris pour les avis rédigés dans des dialectes régionaux rares dans le jeu de données.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Have human reviewers label a sample of reviews, including dialect reviews, and compare their labels with the LLM labels", fr: "Faire étiqueter par des réviseurs humains un échantillon d'avis, y compris en dialecte, et comparer leurs étiquettes à celles du LLM" } }
    - { id: b, text: { en: "Set the temperature of the LLM to 0 so that it returns the same label every time for the same review", fr: "Régler la température du LLM sur 0 pour qu'il renvoie toujours la même étiquette pour un même avis" } }
    - { id: c, text: { en: "Ask the same LLM to give a confidence rating for each label and keep only the labels rated as highly confident", fr: "Demander au même LLM une note de confiance pour chaque étiquette et ne garder que les étiquettes jugées très sûres" } }
    - { id: d, text: { en: "Generate twice as many labels with the LLM so that the rare dialects are better represented", fr: "Générer deux fois plus d'étiquettes avec le LLM pour que les dialectes rares soient mieux représentés" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Model-generated labels should be validated against human judgment: reviewers label a sample and the team measures how often the generated labels are wrong. The sample must include underrepresented groups and edge cases, such as rare dialects, where automated labeling is most likely to fail, and the limitations found are documented."
    fr: "Les étiquettes générées par un modèle doivent être validées par rapport au jugement humain : des réviseurs étiquettent un échantillon et l'équipe mesure la fréquence des erreurs des étiquettes générées. L'échantillon doit inclure les groupes sous-représentés et les cas limites, comme les dialectes rares, où l'étiquetage automatique échoue le plus souvent, et les limites constatées sont documentées."
  options:
    b:
      en: "A temperature of 0 makes the output more deterministic, but a consistent label can still be consistently wrong."
      fr: "Une température de 0 rend la sortie plus déterministe, mais une étiquette constante peut être constamment fausse."
    c:
      en: "A self-assessment by the model that produced the labels is not an independent check, and the confidence that an LLM states does not prove that a label is correct."
      fr: "Une autoévaluation par le modèle qui a produit les étiquettes n'est pas un contrôle indépendant, et la confiance annoncée par un LLM ne prouve pas qu'une étiquette est correcte."
    d:
      en: "More generated labels do not tell the company whether they are correct; errors on rare dialects would simply be repeated."
      fr: "Davantage d'étiquettes générées n'indiquent pas si elles sont correctes ; les erreurs sur les dialectes rares seraient simplement répétées."
references:
  - title: "RAIDP02-BP03 Validate the quality of human and generated labels and features in your dataset"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp03.html
