id: aifc01-4a-bv-group-underrepresented
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A utility company's model predicts which customers will miss a payment. Most of the training data comes from customers in cities. The model is accurate for city customers, but its error rate is much higher for rural customers.

    What is the MOST likely cause of this result?
  fr: |
    Le modèle d'une entreprise de services publics prédit les clients qui manqueront un paiement. La plupart des données d'entraînement proviennent de clients urbains. Le modèle est exact pour les clients urbains, mais son taux d'erreur est bien plus élevé pour les clients ruraux.

    Quelle est la cause la PLUS probable de ce résultat ?
body:
  options:
    - { id: a, text: { en: "The model is too simple to capture the payment patterns of any customer group.", fr: "Le modèle est trop simple pour capturer les habitudes de paiement de tous les groupes de clients." } }
    - { id: b, text: { en: "The test dataset is too large to give a reliable error rate for each group of customers.", fr: "Le jeu de données de test est trop volumineux pour donner un taux d'erreur fiable par groupe de clients." } }
    - { id: c, text: { en: "Rural customers are underrepresented in the training data, so the model learned patterns of city customers.", fr: "Les clients ruraux sont sous-représentés dans les données d'entraînement : le modèle a donc appris les tendances des clients urbains." } }
    - { id: d, text: { en: "The temperature of the model is set too high, so its predictions vary randomly.", fr: "La température du modèle est trop élevée : ses prédictions varient donc de façon aléatoire." } }
answer: { optionId: c }
explanation:
  correct:
    en: "When a group has few training samples, the model fits the larger group better and makes more errors for the smaller group. This bias affects a demographic group: the predictions are inaccurate, and potentially unfair, for rural customers."
    fr: "Lorsqu'un groupe a peu d'échantillons d'entraînement, le modèle s'ajuste mieux au groupe le plus nombreux et commet plus d'erreurs pour le plus petit. Ce biais touche un groupe démographique : les prédictions sont inexactes, voire injustes, pour les clients ruraux."
  options:
    a:
      en: "A model that is too simple would also be inaccurate for city customers; here only one group is affected."
      fr: "Un modèle trop simple serait aussi inexact pour les clients urbains ; ici, un seul groupe est touché."
    b:
      en: "A larger test set gives more reliable measurements; it does not cause errors for one group."
      fr: "Un jeu de test plus grand donne des mesures plus fiables ; il ne cause pas d'erreurs pour un groupe."
    d:
      en: "Temperature is an inference parameter of generative models; it does not explain group-specific errors of a prediction model."
      fr: "La température est un paramètre d'inférence des modèles génératifs ; elle n'explique pas les erreurs propres à un groupe d'un modèle de prédiction."
references:
  - title: "Class Imbalance (CI)"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-bias-metric-class-imbalance.html
