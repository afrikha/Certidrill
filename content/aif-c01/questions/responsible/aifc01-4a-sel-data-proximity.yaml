id: aifc01-4a-sel-data-proximity
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores 80 TB of training data in Amazon S3 in one AWS Region. The company wants to reduce the carbon footprint of the network data transfer for its next training job.

    Where should the company run the training job?
  fr: |
    Une entreprise stocke 80 To de données d'entraînement dans Amazon S3 dans une Région AWS. Elle veut réduire l'empreinte carbone du transfert de données sur le réseau pour sa prochaine tâche d'entraînement.

    Où l'entreprise doit-elle exécuter la tâche d'entraînement ?
body:
  options:
    - { id: a, text: { en: "In another Region, after copying the data to that Region", fr: "Dans une autre Région, après y avoir copié les données" } }
    - { id: b, text: { en: "On premises, after downloading the data from Amazon S3", fr: "Sur site, après avoir téléchargé les données depuis Amazon S3" } }
    - { id: c, text: { en: "In the same Region where the data is stored", fr: "Dans la Région où les données sont stockées" } }
    - { id: d, text: { en: "In several Regions in parallel, with a copy of the data in each Region", fr: "Dans plusieurs Régions en parallèle, avec une copie des données dans chaque Région" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Machine Learning Lens recommends data and compute proximity: train models close to the data and minimize data movement. Training in the Region that already holds the data avoids moving 80 TB across the network."
    fr: "Le Machine Learning Lens recommande la proximité entre données et calcul : entraîner les modèles près des données et limiter les déplacements de données. S'entraîner dans la Région qui contient déjà les données évite de faire transiter 80 To sur le réseau."
  options:
    a:
      en: "Copying the data to another Region adds network transfer and a second copy of the data."
      fr: "Copier les données dans une autre Région ajoute un transfert sur le réseau et une seconde copie des données."
    b:
      en: "Downloading 80 TB to on-premises servers moves all the data across the network."
      fr: "Télécharger 80 To vers des serveurs sur site fait transiter toutes les données sur le réseau."
    d:
      en: "Copying the data to several Regions multiplies the data movement and storage."
      fr: "Copier les données dans plusieurs Régions multiplie les déplacements et le stockage des données."
references:
  - title: "Sustainability pillar - Best practices"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/sustainability-pillar-best-practices-2.html
