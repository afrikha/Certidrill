id: aifc01-4b-local-explanation
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecommunications company uses a model to decide which customers receive a retention offer. A customer who did not receive an offer asks why the model made that decision about them.

    Which type of explanation will answer the customer's question?
  fr: |
    Un opérateur de télécommunications utilise un modèle pour décider quels clients reçoivent une offre de fidélisation. Un client qui n'a pas reçu d'offre demande pourquoi le modèle a pris cette décision le concernant.

    Quel type d'explication répond à la question du client ?
body:
  options:
    - { id: a, text: { en: "The global feature importance scores of the model across all customers", fr: "Les scores d'importance globale des caractéristiques du modèle sur l'ensemble des clients" } }
    - { id: b, text: { en: "The confusion matrix of the model on the test dataset", fr: "La matrice de confusion du modèle sur le jeu de données de test" } }
    - { id: c, text: { en: "The overall accuracy of the model on the most recent month of data", fr: "L'exactitude globale du modèle sur le mois de données le plus récent" } }
    - { id: d, text: { en: "The local feature attributions for the prediction made about this customer", fr: "Les attributions locales des caractéristiques pour la prédiction faite sur ce client" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A local explanation applies to a single model output: feature attributions show how each input of this customer contributed to the decision. Local methods zoom in on one data point, which is what an individual who is affected by a decision needs."
    fr: "Une explication locale s'applique à une seule sortie du modèle : les attributions des caractéristiques montrent comment chaque donnée de ce client a contribué à la décision. Les méthodes locales se concentrent sur un seul point de données, ce dont a besoin une personne concernée par une décision."
  options:
    a:
      en: "Global importance scores describe the overall behavior of the model across all inputs, not the reasons for one customer's result."
      fr: "Les scores d'importance globale décrivent le comportement général du modèle sur toutes les entrées, et non les raisons du résultat d'un client."
    b:
      en: "A confusion matrix summarizes correct and incorrect predictions over a dataset; it does not explain an individual decision."
      fr: "Une matrice de confusion résume les prédictions correctes et incorrectes sur un jeu de données ; elle n'explique pas une décision individuelle."
    c:
      en: "Overall accuracy measures performance, not the reasons for any specific prediction."
      fr: "L'exactitude globale mesure la performance, et non les raisons d'une prédiction particulière."
references:
  - title: "Overview"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
