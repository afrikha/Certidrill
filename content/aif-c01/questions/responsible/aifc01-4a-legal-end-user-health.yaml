id: aifc01-4a-legal-end-user-health
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A wellness company offers an app with a generative AI assistant on Amazon Bedrock. Some users ask the assistant to diagnose their symptoms and to recommend medication doses. The company is concerned that users could be harmed if they act on incorrect answers.

    Which action will reduce this risk?
  fr: |
    Une entreprise de bien-être propose une application avec un assistant d'IA générative sur Amazon Bedrock. Certains utilisateurs demandent à l'assistant de diagnostiquer leurs symptômes et de recommander des doses de médicaments. L'entreprise craint que des utilisateurs subissent un préjudice s'ils suivent des réponses incorrectes.

    Quelle action réduit ce risque ?
body:
  options:
    - { id: a, text: { en: "Increase the temperature of the model so that the answers cover more possible diagnoses.", fr: "Augmenter la température du modèle pour que les réponses couvrent davantage de diagnostics possibles." } }
    - { id: b, text: { en: "Enable model invocation logging to keep a record of every answer that the assistant gives to users.", fr: "Activer la journalisation des appels de modèles pour garder une trace de chaque réponse donnée aux utilisateurs." } }
    - { id: c, text: { en: "Configure a denied topic for diagnoses and medication advice, with a message that refers users to a healthcare professional.", fr: "Configurer un sujet refusé pour les diagnostics et les conseils de médication, avec un message qui oriente les utilisateurs vers un professionnel de santé." } }
    - { id: d, text: { en: "Choose a model with a larger context window so that users can describe all their symptoms in one prompt.", fr: "Choisir un modèle avec une fenêtre de contexte plus grande pour que les utilisateurs décrivent tous leurs symptômes dans une seule invite." } }
answer: { optionId: c }
explanation:
  correct:
    en: "End user risk is the harm that users can suffer when they act on AI outputs. A denied topic in Amazon Bedrock Guardrails blocks diagnosis and medication requests and returns a configured message, which can refer users to a professional. AWS service terms also state that AI services must not be used by themselves for clinical decision-making."
    fr: "Le risque lié à l'utilisateur final est le préjudice que les utilisateurs peuvent subir s'ils agissent sur la base des sorties de l'IA. Un sujet refusé dans Amazon Bedrock Guardrails bloque les demandes de diagnostic et de médication et renvoie un message configuré, qui peut orienter les utilisateurs vers un professionnel. Les conditions de service d'AWS précisent aussi que les services d'IA ne doivent pas être utilisés seuls pour des décisions cliniques."
  options:
    a:
      en: "A higher temperature makes answers more random; it does not make them safer."
      fr: "Une température plus élevée rend les réponses plus aléatoires ; elle ne les rend pas plus sûres."
    b:
      en: "Logging records the answers after they are given; it does not prevent users from acting on harmful advice."
      fr: "La journalisation enregistre les réponses après coup ; elle n'empêche pas les utilisateurs de suivre un conseil dangereux."
    d:
      en: "A larger context window lets users send longer inputs but does not stop the assistant from giving medical advice."
      fr: "Une fenêtre de contexte plus grande permet d'envoyer des entrées plus longues mais n'empêche pas l'assistant de donner des conseils médicaux."
references:
  - title: "Block denied topics to help remove harmful content"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
  - title: "AWS Service Terms"
    url: https://aws.amazon.com/service-terms/
