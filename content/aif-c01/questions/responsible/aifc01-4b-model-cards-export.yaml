id: aifc01-4b-model-cards-export
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company has documented a fraud detection model in Amazon SageMaker Model Cards. An external auditor who has no access to the company's AWS account must review the model card.

    Which solution will meet this requirement with the LEAST operational overhead?
  fr: |
    Une compagnie d'assurance a documenté un modèle de détection de fraude dans Amazon SageMaker Model Cards. Un auditeur externe qui n'a pas accès au compte AWS de l'entreprise doit examiner la fiche de modèle.

    Quelle solution répond à cette exigence avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an IAM user for the auditor with permissions to open SageMaker AI", fr: "Créer un utilisateur IAM pour l'auditeur avec des autorisations pour ouvrir SageMaker AI" } }
    - { id: b, text: { en: "Build an Amazon CloudWatch dashboard that displays the model card fields", fr: "Créer un tableau de bord Amazon CloudWatch qui affiche les champs de la fiche de modèle" } }
    - { id: c, text: { en: "Copy each field of the model card into a document by hand", fr: "Recopier à la main chaque champ de la fiche de modèle dans un document" } }
    - { id: d, text: { en: "Export the model card to a PDF file and send the file to the auditor", fr: "Exporter la fiche de modèle dans un fichier PDF et envoyer le fichier à l'auditeur" } }
answer: { optionId: d }
explanation:
  correct:
    en: "After a model card is created, it can be exported to a PDF or downloaded to share with relevant stakeholders. The auditor receives the documentation without any access to the AWS account."
    fr: "Une fois créée, une fiche de modèle peut être exportée au format PDF ou téléchargée pour être partagée avec les parties prenantes concernées. L'auditeur reçoit la documentation sans aucun accès au compte AWS."
  options:
    a:
      en: "Creating and managing an IAM user for an external person adds work and gives access to the account, which the requirement avoids."
      fr: "Créer et gérer un utilisateur IAM pour une personne externe ajoute du travail et donne accès au compte, ce que l'exigence évite."
    b:
      en: "CloudWatch dashboards display metrics and logs; rebuilding a model card in a dashboard adds work and still requires account access."
      fr: "Les tableaux de bord CloudWatch affichent des métriques et des journaux ; reconstruire une fiche de modèle dans un tableau de bord ajoute du travail et exige toujours un accès au compte."
    c:
      en: "Copying the fields by hand is slow and error-prone, while the export is built in."
      fr: "Recopier les champs à la main est lent et source d'erreurs, alors que l'export est intégré."
references:
  - title: "Amazon SageMaker Model Cards"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
