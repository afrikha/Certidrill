id: aifc01-4a-legal-bedrock-data-use
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to send customer support transcripts in prompts to a foundation model on Amazon Bedrock. The company is concerned that it will lose customer trust if the transcripts are used to train models for other users.

    Which statement about Amazon Bedrock is correct?
  fr: |
    Une entreprise veut envoyer des transcriptions du support client dans des invites à un modèle de fondation sur Amazon Bedrock. Elle craint de perdre la confiance de ses clients si les transcriptions servent à entraîner des modèles pour d'autres utilisateurs.

    Quelle affirmation sur Amazon Bedrock est correcte ?
body:
  options:
    - { id: a, text: { en: "Amazon Bedrock shares prompts with the model providers so that they can improve their models, unless the company opts out.", fr: "Amazon Bedrock partage les invites avec les fournisseurs de modèles pour qu'ils améliorent leurs modèles, sauf si l'entreprise s'y oppose." } }
    - { id: b, text: { en: "AWS does not use the inputs or outputs of Amazon Bedrock to train its models, and prompts are not shared with model providers.", fr: "AWS n'utilise pas les entrées ni les sorties d'Amazon Bedrock pour entraîner ses modèles, et les invites ne sont pas partagées avec les fournisseurs de modèles." } }
    - { id: c, text: { en: "Amazon Bedrock stores every prompt and completion so that AWS staff can review them for safety and quality.", fr: "Amazon Bedrock stocke chaque invite et chaque complétion pour que le personnel d'AWS les examine à des fins de sûreté et de qualité." } }
    - { id: d, text: { en: "The company must fine-tune its own copy of the model, because prompts sent to base models are used for training.", fr: "L'entreprise doit peaufiner sa propre copie du modèle, car les invites envoyées aux modèles de base servent à l'entraînement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Bedrock does not store or review customer prompts and completions, and they are never shared between customers or with Amazon Bedrock partners. AWS does not use inputs or outputs of Amazon Bedrock to train Amazon Bedrock models, including Amazon Nova."
    fr: "Amazon Bedrock ne stocke ni n'examine les invites et les complétions des clients, qui ne sont jamais partagées entre clients ni avec les partenaires d'Amazon Bedrock. AWS n'utilise pas les entrées ni les sorties d'Amazon Bedrock pour entraîner les modèles d'Amazon Bedrock, y compris Amazon Nova."
  options:
    a:
      en: "Prompts and completions are never shared with Amazon Bedrock partners, which include the model providers."
      fr: "Les invites et les complétions ne sont jamais partagées avec les partenaires d'Amazon Bedrock, dont font partie les fournisseurs de modèles."
    c:
      en: "Amazon Bedrock does not store or review customer prompts and completions."
      fr: "Amazon Bedrock ne stocke ni n'examine les invites et les complétions des clients."
    d:
      en: "Fine-tuning is not needed for privacy: prompts sent to the base model are already not used for training."
      fr: "Le peaufinage n'est pas nécessaire pour la confidentialité : les invites envoyées au modèle de base ne servent déjà pas à l'entraînement."
references:
  - title: "Responsible use"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/responsible-use.html
