id: aifc01-4b-simple-lower-accuracy
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company tests two models to predict the remaining useful life of machines from hundreds of sensor readings. The linear regression model is easy to interpret, but it is less accurate than a neural network.

    What is the MOST likely reason for the lower accuracy of the linear regression model?
  fr: |
    Un industriel teste deux modèles pour prédire la durée de vie restante de machines à partir de centaines de mesures de capteurs. Le modèle de régression linéaire est facile à interpréter, mais il est moins exact qu'un réseau neuronal.

    Quelle est la raison la PLUS probable de la moindre exactitude du modèle de régression linéaire ?
body:
  options:
    - { id: a, text: { en: "Its simple structure cannot capture complex non-linear interactions between the sensor readings", fr: "Sa structure simple ne peut pas capturer les interactions non linéaires complexes entre les mesures des capteurs" } }
    - { id: b, text: { en: "Interpretable models must be trained on fewer records than neural networks", fr: "Les modèles interprétables doivent être entraînés sur moins d'enregistrements que les réseaux neuronaux" } }
    - { id: c, text: { en: "Linear regression models can be used only for classification tasks", fr: "Les modèles de régression linéaire ne s'utilisent que pour des tâches de classification" } }
    - { id: d, text: { en: "Explaining the predictions of a model always lowers its accuracy", fr: "Expliquer les prédictions d'un modèle diminue toujours son exactitude" } }
answer: { optionId: a }
explanation:
  correct:
    en: "There is a trade-off between model performance and model interpretability. The simple relationship between inputs and output that makes a linear model interpretable often leads to lower performance, because the algorithm cannot capture complex non-linear interactions that a neural network can learn."
    fr: "Il existe un compromis entre la performance et l'interprétabilité d'un modèle. La relation simple entre les entrées et la sortie qui rend un modèle linéaire interprétable entraîne souvent une performance moindre, car l'algorithme ne peut pas capturer les interactions non linéaires complexes qu'un réseau neuronal sait apprendre."
  options:
    b:
      en: "Interpretable models are not limited to smaller training datasets; the difference comes from the complexity of the model."
      fr: "Les modèles interprétables ne sont pas limités à de plus petits jeux d'entraînement ; la différence vient de la complexité du modèle."
    c:
      en: "Linear regression predicts numeric values; it is a regression algorithm, not a classification-only algorithm."
      fr: "La régression linéaire prédit des valeurs numériques ; c'est un algorithme de régression, et non un algorithme réservé à la classification."
    d:
      en: "Post hoc explanation methods are applied to a trained model and do not change its accuracy."
      fr: "Les méthodes d'explication post hoc s'appliquent à un modèle entraîné et ne modifient pas son exactitude."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
