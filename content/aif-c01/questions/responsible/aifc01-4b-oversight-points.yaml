id: aifc01-4b-oversight-points
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company uses an AI system to triage thousands of claims each day. Some claims involve large amounts or unusual situations, where an error would have significant consequences for the customer.

    Which design follows human-centered design principles?
  fr: |
    Une compagnie d'assurance utilise un système d'IA pour trier chaque jour des milliers de sinistres. Certains sinistres portent sur des montants élevés ou des situations inhabituelles, où une erreur aurait des conséquences importantes pour le client.

    Quelle conception suit les principes de la conception centrée sur l'humain ?
body:
  options:
    - { id: a, text: { en: "Let the AI system decide every claim, and log the decisions for a yearly review", fr: "Laisser le système d'IA décider de chaque sinistre, et journaliser les décisions pour une revue annuelle" } }
    - { id: b, text: { en: "Have employees review every claim without showing them the AI system's analysis", fr: "Faire examiner chaque sinistre par des employés sans leur montrer l'analyse du système d'IA" } }
    - { id: c, text: { en: "Show reviewers only the AI system's final decision, so that the explanation does not influence them", fr: "Ne montrer aux réviseurs que la décision finale du système d'IA, pour que l'explication ne les influence pas" } }
    - { id: d, text: { en: "Route high-impact claims to employees, and show them the explanation, the confidence score, and similar past cases", fr: "Envoyer les sinistres à fort impact à des employés, et leur montrer l'explication, le score de confiance et des cas passés similaires" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Human review is placed at the points where errors could have significant consequences or where output quality is hard to judge. Reviewers are given what they need for an informed decision, such as output explanations and contributing factors, confidence scores, and similar case examples."
    fr: "La revue humaine est placée aux points où les erreurs pourraient avoir des conséquences importantes ou où la qualité des sorties est difficile à juger. Les réviseurs reçoivent ce dont ils ont besoin pour une décision éclairée, comme les explications et les facteurs déterminants des sorties, les scores de confiance et des exemples de cas similaires."
  options:
    a:
      en: "A yearly review of logs comes far too late to prevent a harmful decision on a high-impact claim."
      fr: "Une revue annuelle des journaux arrive bien trop tard pour empêcher une décision préjudiciable sur un sinistre à fort impact."
    b:
      en: "Reviewing every claim without the AI analysis wastes effort on low-impact claims and gives reviewers less information."
      fr: "Examiner chaque sinistre sans l'analyse de l'IA gaspille des efforts sur les sinistres à faible impact et donne moins d'informations aux réviseurs."
    c:
      en: "A decision without its explanation and confidence leaves reviewers unable to judge whether it is correct."
      fr: "Une décision sans explication ni niveau de confiance empêche les réviseurs de juger si elle est correcte."
references:
  - title: "RAIUC04-BP02 Identify human oversight opportunities"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raiuc04-bp02.html
