id: aifc01-4b-match-transparency
objective: "4.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company uses three models. Match each model to the description of its transparency. To answer, drag the appropriate description to each model. Each description may be used once or not at all.
  fr: |
    Une entreprise utilise trois modèles. Associez chaque modèle à la description de sa transparence. Pour répondre, faites glisser la description appropriée vers chaque modèle. Chaque description peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - id: intrinsic
      text: { en: "Inherently interpretable", fr: "Intrinsèquement interprétable" }
    - id: posthoc
      text: { en: "Not interpretable, explained with post hoc methods", fr: "Non interprétable, expliqué avec des méthodes post hoc" }
    - id: opaque
      text: { en: "Not transparent and not explained", fr: "Ni transparent ni expliqué" }
    - id: unsup
      text: { en: "Unsupervised and therefore transparent", fr: "Non supervisé et donc transparent" }
  targets:
    - id: t1
      text: { en: "A logistic regression model whose coefficients the risk team reviews", fr: "Un modèle de régression logistique dont l'équipe des risques examine les coefficients" }
    - id: t2
      text: { en: "A neural network whose predictions are accompanied by SHAP attributions", fr: "Un réseau neuronal dont les prédictions sont accompagnées d'attributions SHAP" }
    - id: t3
      text: { en: "A proprietary model behind an API that returns only a score, with no documentation or explanation", fr: "Un modèle propriétaire derrière une API qui renvoie uniquement un score, sans documentation ni explication" }
answer:
  mapping: { t1: intrinsic, t2: posthoc, t3: opaque }
explanation:
  correct:
    en: "A logistic regression model is a low-complexity model whose coefficients show the effect of each feature, so it is interpretable by itself. A neural network captures complex non-linear interactions and needs a post hoc method such as SHAP to explain its predictions. A proprietary model that returns only a score, without documentation or explanations, gives stakeholders no way to understand its behavior."
    fr: "Un modèle de régression logistique est un modèle peu complexe dont les coefficients montrent l'effet de chaque caractéristique : il est interprétable par lui-même. Un réseau neuronal capture des interactions non linéaires complexes et a besoin d'une méthode post hoc comme SHAP pour expliquer ses prédictions. Un modèle propriétaire qui renvoie uniquement un score, sans documentation ni explication, ne donne aux parties prenantes aucun moyen de comprendre son comportement."
  options:
    unsup: { en: "Whether a model is trained with or without labels does not make it transparent.", fr: "Le fait qu'un modèle soit entraîné avec ou sans étiquettes ne le rend pas transparent." }
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
