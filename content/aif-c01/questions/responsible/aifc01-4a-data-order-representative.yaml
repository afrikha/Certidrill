id: aifc01-4a-data-order-representative
objective: "4.1.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A company wants to make sure that the dataset it will use to fine-tune a model is representative of how the model will be used.

    Which four steps should the company perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise veut s'assurer que le jeu de données qu'elle utilisera pour peaufiner un modèle est représentatif de l'usage qui sera fait du modèle.

    Quelles sont les quatre étapes que l'entreprise doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: compare, text: { en: "Compare the dataset with the expected usage to find missing user groups and unrelated scenarios.", fr: "Comparer le jeu de données à l'usage prévu pour repérer les groupes d'utilisateurs absents et les scénarios hors sujet." } }
    - { id: merge, text: { en: "Merge the evaluation dataset into the fine-tuning dataset.", fr: "Fusionner le jeu de données d'évaluation avec le jeu de données de peaufinage." } }
    - { id: define, text: { en: "Define who will use the model, how they will use it, and which inputs they will provide.", fr: "Définir qui utilisera le modèle, comment et avec quelles entrées." } }
    - { id: document, text: { en: "Document what was included and excluded, and which groups remain poorly covered.", fr: "Documenter ce qui a été inclus et exclu, et les groupes qui restent mal couverts." } }
    - { id: fix, text: { en: "Remove the examples that do not fit the use case and add examples that fill the gaps.", fr: "Supprimer les exemples qui ne correspondent pas au cas d'utilisation et ajouter des exemples qui comblent les lacunes." } }
    - { id: dedupe, text: { en: "Duplicate the examples of the largest user group to increase the dataset size.", fr: "Dupliquer les exemples du groupe d'utilisateurs le plus nombreux pour augmenter la taille du jeu de données." } }
answer:
  sequence: [ define, compare, fix, document ]
explanation:
  correct:
    en: "The deployment scenario defines what representative means, so it comes first. The dataset is then compared with real usage to find gaps, cleaned and completed, and the inclusions, exclusions and remaining gaps are documented so that the limits of the dataset are explicit."
    fr: "Le scénario de déploiement définit ce que représentatif signifie : il vient donc en premier. Le jeu de données est ensuite comparé à l'usage réel pour repérer les lacunes, nettoyé et complété, puis les inclusions, les exclusions et les lacunes restantes sont documentées pour que les limites du jeu de données soient explicites."
  options:
    merge:
      en: "Training and evaluation data must remain separate to keep the measurements reliable."
      fr: "Les données d'entraînement et d'évaluation doivent rester séparées pour que les mesures restent fiables."
    dedupe:
      en: "Duplicating the largest group makes the dataset less balanced, not more representative."
      fr: "Dupliquer le groupe le plus nombreux rend le jeu de données moins équilibré, pas plus représentatif."
references:
  - title: "RAIDP02-BP01 Validate the representativeness of datasets for the use case"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp01.html
