id: aifc01-4a-sel-region-carbon
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company plans a large model training job. Three AWS Regions meet its data sovereignty, service availability, latency, and budget requirements. The company also wants to reduce the carbon footprint of the training job.

    Which criterion should the company use to choose among the three Regions?
  fr: |
    Une entreprise prévoit une tâche d'entraînement de modèle de grande ampleur. Trois Régions AWS répondent à ses exigences de souveraineté des données, de disponibilité des services, de latence et de budget. L'entreprise veut aussi réduire l'empreinte carbone de la tâche d'entraînement.

    Quel critère l'entreprise doit-elle utiliser pour choisir parmi les trois Régions ?
body:
  options:
    - { id: a, text: { en: "The Region that is closest to the company's headquarters and to its data science team", fr: "La Région la plus proche du siège de l'entreprise et de son équipe de data science" } }
    - { id: b, text: { en: "The Region that is near Amazon renewable energy projects or that has a lower grid carbon intensity", fr: "La Région proche de projets d'énergie renouvelable d'Amazon ou dont le réseau électrique a une intensité carbone plus faible" } }
    - { id: c, text: { en: "The Region where the company already runs all its other workloads and stores its backups", fr: "La Région où l'entreprise exécute déjà toutes ses autres charges de travail et stocke ses sauvegardes" } }
    - { id: d, text: { en: "The Region that offers the largest number of Availability Zones for the training instances", fr: "La Région qui offre le plus grand nombre de zones de disponibilité pour les instances d'entraînement" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Once the business requirements are met, the Sustainability Pillar recommends choosing Regions near Amazon renewable energy projects or Regions where the grid has a lower published carbon intensity. This reduces the carbon footprint of the workload."
    fr: "Une fois les exigences métier satisfaites, le pilier Durabilité recommande de choisir des Régions proches de projets d'énergie renouvelable d'Amazon ou des Régions dont le réseau électrique a une intensité carbone publiée plus faible. Cela réduit l'empreinte carbone de la charge de travail."
  options:
    a:
      en: "Choosing a Region based only on the company's own location is an anti-pattern of this best practice."
      fr: "Choisir une Région uniquement en fonction de l'emplacement de l'entreprise est un anti-modèle de cette bonne pratique."
    c:
      en: "Consolidating all resources in one geographic area is also listed as an anti-pattern; it does not consider carbon intensity."
      fr: "Regrouper toutes les ressources dans une seule zone géographique est aussi cité comme anti-modèle ; cela ne tient pas compte de l'intensité carbone."
    d:
      en: "The number of Availability Zones affects resilience, not the carbon footprint of the training job."
      fr: "Le nombre de zones de disponibilité influe sur la résilience, pas sur l'empreinte carbone de la tâche d'entraînement."
references:
  - title: "SUS01-BP01 Choose Region based on both business requirements and sustainability goals"
    url: https://docs.aws.amazon.com/wellarchitected/latest/sustainability-pillar/sus_sus_region_a2.html
