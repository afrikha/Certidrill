id: aifc01-4b-model-cards-versions
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company documents its models in Amazon SageMaker Model Cards. Auditors require a record of every change that was made to the documented details of a model over time.

    What happens when a data scientist edits the training details in an existing model card?
  fr: |
    Un laboratoire pharmaceutique documente ses modèles dans Amazon SageMaker Model Cards. Les auditeurs exigent un historique de chaque modification apportée au fil du temps aux informations documentées d'un modèle.

    Que se passe-t-il lorsqu'un data scientist modifie les détails d'entraînement d'une fiche de modèle existante ?
body:
  options:
    - { id: a, text: { en: "The edit overwrites the previous content, and the change is recorded only in AWS CloudTrail", fr: "La modification remplace le contenu précédent, et le changement n'est enregistré que dans AWS CloudTrail" } }
    - { id: b, text: { en: "The edit is rejected, because a model card cannot be changed after it is created", fr: "La modification est refusée, car une fiche de modèle ne peut plus être modifiée après sa création" } }
    - { id: c, text: { en: "The edit creates a new version of the model card, which keeps an immutable record of changes", fr: "La modification crée une nouvelle version de la fiche de modèle, ce qui conserve un historique immuable des changements" } }
    - { id: d, text: { en: "The edit deletes the model card, which must be created again with the new details", fr: "La modification supprime la fiche de modèle, qui doit être recréée avec les nouveaux détails" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Any edit to a model card other than an update of its approval status creates an additional model card version. The versions form an immutable record of the changes made to the model's documentation, which supports audits."
    fr: "Toute modification d'une fiche de modèle autre qu'une mise à jour de son statut d'approbation crée une version supplémentaire de la fiche. Les versions forment un historique immuable des changements apportés à la documentation du modèle, ce qui facilite les audits."
  options:
    a:
      en: "Model cards do not overwrite earlier content: each edit produces a new version that can be reviewed."
      fr: "Les fiches de modèle n'écrasent pas le contenu antérieur : chaque modification produit une nouvelle version consultable."
    b:
      en: "Model cards can be edited; the edits are kept as versions rather than blocked."
      fr: "Les fiches de modèle sont modifiables ; les modifications sont conservées sous forme de versions au lieu d'être bloquées."
    d:
      en: "Editing a model card never deletes it; the card keeps its history of versions."
      fr: "Modifier une fiche de modèle ne la supprime jamais ; la fiche conserve son historique de versions."
references:
  - title: "Amazon SageMaker Model Cards"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
