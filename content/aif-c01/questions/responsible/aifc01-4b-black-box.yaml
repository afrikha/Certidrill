id: aifc01-4b-black-box
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data science team describes one of its models as a "black box".

    Which statement describes this model?
  fr: |
    Une équipe de science des données qualifie l'un de ses modèles de « boîte noire ».

    Quelle affirmation décrit ce modèle ?
body:
  options:
    - { id: a, text: { en: "It always makes less accurate predictions than an interpretable model", fr: "Il fait toujours des prédictions moins exactes qu'un modèle interprétable" } }
    - { id: b, text: { en: "It cannot be deployed to production in a regulated industry", fr: "Il ne peut pas être déployé en production dans un secteur réglementé" } }
    - { id: c, text: { en: "Its internal logic is too complex to trace, so explaining a prediction requires post hoc methods", fr: "Sa logique interne est trop complexe à suivre : expliquer une prédiction nécessite donc des méthodes post hoc" } }
    - { id: d, text: { en: "It was trained on data that has no labels, so its outputs have no meaning", fr: "Il a été entraîné sur des données sans étiquettes : ses sorties n'ont donc pas de sens" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A model that is not transparent, such as a deep neural network, has internal workings that people cannot follow from input to output. Post hoc methods such as SHAP or LIME are applied after training to explain which inputs drove its predictions."
    fr: "Un modèle non transparent, comme un réseau neuronal profond, a un fonctionnement interne que l'on ne peut pas suivre de l'entrée à la sortie. Des méthodes post hoc comme SHAP ou LIME sont appliquées après l'entraînement pour expliquer quelles entrées ont déterminé ses prédictions."
  options:
    a:
      en: "Complex models are often more accurate than simple interpretable models, because they capture non-linear interactions."
      fr: "Les modèles complexes sont souvent plus exacts que les modèles interprétables simples, car ils capturent des interactions non linéaires."
    b:
      en: "Regulated industries often require explanations, but a complex model can be used with post hoc explanation methods."
      fr: "Les secteurs réglementés exigent souvent des explications, mais un modèle complexe peut être utilisé avec des méthodes d'explication post hoc."
    d:
      en: "Training without labels is unsupervised learning; it is unrelated to whether a model's internal logic can be understood."
      fr: "L'entraînement sans étiquettes relève de l'apprentissage non supervisé ; cela n'a aucun rapport avec la compréhension de la logique interne d'un modèle."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
