id: aifc01-4b-why-explainable
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A lending company must choose a model to approve or reject loan applications. The regulator in its country requires lenders to use models that are transparent and explainable.

    What is the main benefit of a transparent and explainable model in this scenario?
  fr: |
    Un organisme de crédit doit choisir un modèle pour accepter ou refuser des demandes de prêt. Le régulateur de son pays exige des prêteurs qu'ils utilisent des modèles transparents et explicables.

    Quel est le principal avantage d'un modèle transparent et explicable dans ce scénario ?
body:
  options:
    - { id: a, text: { en: "The company can justify each decision to applicants and auditors and detect unfair factors", fr: "L'entreprise peut justifier chaque décision auprès des demandeurs et des auditeurs, et détecter les facteurs injustes" } }
    - { id: b, text: { en: "The model needs no training data because its rules are written by hand", fr: "Le modèle n'a besoin d'aucune donnée d'entraînement, car ses règles sont écrites à la main" } }
    - { id: c, text: { en: "The model is guaranteed to be more accurate than any complex model", fr: "Le modèle est forcément plus exact que n'importe quel modèle complexe" } }
    - { id: d, text: { en: "The model can no longer produce biased decisions", fr: "Le modèle ne peut plus produire de décisions biaisées" } }
answer: { optionId: a }
explanation:
  correct:
    en: "When stakeholders understand why a model makes a prediction, the company can justify important decisions that affect customers, which regulations in industries such as finance can require. Understanding the model also helps find inaccuracies and unfair factors in its decisions."
    fr: "Lorsque les parties prenantes comprennent pourquoi un modèle fait une prédiction, l'entreprise peut justifier les décisions importantes qui touchent les clients, ce que la réglementation de secteurs comme la finance peut exiger. Comprendre le modèle aide aussi à repérer les imprécisions et les facteurs injustes dans ses décisions."
  options:
    b:
      en: "Interpretable ML models such as linear models or decision trees are still trained on data; they are not hand-written rules."
      fr: "Les modèles de ML interprétables comme les modèles linéaires ou les arbres de décision sont bien entraînés sur des données ; ce ne sont pas des règles écrites à la main."
    c:
      en: "Simple interpretable models often perform worse than complex models on complex data; transparency does not guarantee accuracy."
      fr: "Les modèles interprétables simples sont souvent moins performants que les modèles complexes sur des données complexes ; la transparence ne garantit pas l'exactitude."
    d:
      en: "A transparent model trained on biased data can still make biased decisions; transparency makes the bias easier to find, not impossible."
      fr: "Un modèle transparent entraîné sur des données biaisées peut toujours prendre des décisions biaisées ; la transparence rend le biais plus facile à trouver, pas impossible."
references:
  - title: "Machine learning model interpretability with AWS"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/welcome.html
