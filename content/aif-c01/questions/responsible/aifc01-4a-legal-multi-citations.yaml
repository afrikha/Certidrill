id: aifc01-4a-legal-multi-citations
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A law firm uses a large language model (LLM) to draft summaries of case law for its clients. Some drafts cite court decisions that do not exist. The firm wants to reduce the legal risk from these hallucinations.

    Which two actions will meet this requirement? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un cabinet d'avocats utilise un grand modèle de langage (LLM) pour rédiger des synthèses de jurisprudence pour ses clients. Certains brouillons citent des décisions de justice qui n'existent pas. Le cabinet veut réduire le risque juridique lié à ces hallucinations.

    Quelles sont les deux actions qui répondent à cette exigence ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Increase the temperature of the LLM so that it explores more possible citations.", fr: "Augmenter la température du LLM pour qu'il explore davantage de citations possibles." }
    - id: b
      text: { en: "Add a word filter in Amazon Bedrock Guardrails that blocks the word \"court\".", fr: "Ajouter dans Amazon Bedrock Guardrails un filtre de mots qui bloque le mot « tribunal »." }
    - id: c
      text: { en: "Require a qualified lawyer to review every draft before it is sent to a client.", fr: "Exiger qu'un avocat qualifié relise chaque brouillon avant son envoi à un client." }
    - id: d
      text: { en: "Remove the instructions from the system prompt so that the LLM answers more freely.", fr: "Supprimer les instructions de l'invite système pour que le LLM réponde plus librement." }
    - id: e
      text: { en: "Ground the drafts in the firm's verified case-law database and apply contextual grounding checks.", fr: "Ancrer les brouillons dans la base de jurisprudence vérifiée du cabinet et appliquer des vérifications de l'ancrage contextuel." }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Human review by a qualified person catches invented citations before they reach clients, which AWS recommends for consequential uses. Grounding the model in verified sources with RAG, and filtering responses that are not grounded in the source with contextual grounding checks, reduces hallucinations."
    fr: "La relecture par une personne qualifiée détecte les citations inventées avant qu'elles n'atteignent les clients, ce qu'AWS recommande pour les usages à fort enjeu. Ancrer le modèle dans des sources vérifiées grâce au RAG, et filtrer les réponses non ancrées dans la source avec les vérifications de l'ancrage contextuel, réduit les hallucinations."
  options:
    a:
      en: "A higher temperature makes outputs more random and can increase hallucinations."
      fr: "Une température plus élevée rend les sorties plus aléatoires et peut augmenter les hallucinations."
    b:
      en: "Blocking a word would block legitimate summaries and does not check that citations exist."
      fr: "Bloquer un mot bloquerait des synthèses légitimes et ne vérifie pas que les citations existent."
    d:
      en: "The system prompt guides the model; removing its instructions does not make citations more accurate."
      fr: "L'invite système guide le modèle ; en supprimer les instructions ne rend pas les citations plus exactes."
references:
  - title: "Use contextual grounding check to filter hallucinations in responses"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: "Responsible use"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/responsible-use.html
