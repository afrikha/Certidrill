id: aifc01-4b-tradeoff-statements
objective: "4.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A team is designing an AI system that must be accurate, explainable, and protective of personal data.

    Which two statements about the trade-offs that the team must consider are correct? (Choose two.)
  fr: |
    Une équipe conçoit un système d'IA qui doit être exact, explicable et protecteur des données personnelles.

    Quelles sont les deux affirmations correctes sur les compromis que l'équipe doit prendre en compte ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An interpretable model always outperforms a complex model", fr: "Un modèle interprétable est toujours plus performant qu'un modèle complexe" } }
    - { id: b, text: { en: "Making decisions more explainable can slow down the system", fr: "Rendre les décisions plus explicables peut ralentir le système" } }
    - { id: c, text: { en: "Post hoc explanation methods cannot be affected by adversarial inputs", fr: "Les méthodes d'explication post hoc ne peuvent pas être affectées par des entrées adverses" } }
    - { id: d, text: { en: "Stronger privacy protections can make decisions harder to explain", fr: "Des protections de la confidentialité plus fortes peuvent rendre les décisions plus difficiles à expliquer" } }
    - { id: e, text: { en: "Explainability requirements apply only to generative AI systems", fr: "Les exigences d'explicabilité ne s'appliquent qu'aux systèmes d'IA générative" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Release criteria often compete: making decisions more explainable might slow the system down, and adding stronger privacy protections can make it harder to explain how decisions are made. The team identifies these conflicts and sets priority rules in advance."
    fr: "Les critères de mise en production entrent souvent en concurrence : rendre les décisions plus explicables peut ralentir le système, et ajouter des protections de la confidentialité plus fortes peut rendre plus difficile l'explication des décisions. L'équipe identifie ces conflits et fixe des règles de priorité à l'avance."
  options:
    a:
      en: "Simple interpretable models often have lower performance on complex data, which is the core of the interpretability trade-off."
      fr: "Les modèles interprétables simples sont souvent moins performants sur des données complexes, ce qui est au cœur du compromis d'interprétabilité."
    c:
      en: "Post hoc methods are susceptible to adversarial attacks, so the stability of their explanations must be validated."
      fr: "Les méthodes post hoc sont sensibles aux attaques adverses : la stabilité de leurs explications doit donc être validée."
    e:
      en: "Explainability applies to traditional ML models, such as credit or diagnosis models, as well as to generative AI."
      fr: "L'explicabilité concerne les modèles de ML traditionnels, comme les modèles de crédit ou de diagnostic, autant que l'IA générative."
references:
  - title: "RAISP01-BP02 Consider design trade-offs across competing objectives"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp01-bp02.html
