id: aifc01-4b-truthfulness-tools
objective: "4.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an internal assistant that uses Amazon Bedrock Knowledge Bases to answer employee questions from HR documents. The company wants to detect responses that contain information that is not supported by the retrieved documents.

    Which two solutions will meet this requirement? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    Une entreprise exploite un assistant interne qui utilise Amazon Bedrock Knowledge Bases pour répondre aux questions des employés à partir de documents RH. L'entreprise veut détecter les réponses qui contiennent des informations non étayées par les documents récupérés.

    Quelles sont les deux solutions qui répondent à cette exigence ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable AWS CloudTrail data events for the knowledge base", fr: "Activer les événements de données AWS CloudTrail pour la base de connaissances" } }
    - { id: b, text: { en: "Add a contextual grounding check to an Amazon Bedrock guardrail", fr: "Ajouter une vérification de l'ancrage contextuel à un garde-fou Amazon Bedrock" } }
    - { id: c, text: { en: "Purchase Provisioned Throughput for the model that generates the responses", fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle qui génère les réponses" } }
    - { id: d, text: { en: "Use Amazon Macie to scan the HR documents in the Amazon S3 bucket", fr: "Utiliser Amazon Macie pour analyser les documents RH du compartiment Amazon S3" } }
    - { id: e, text: { en: "Run an Amazon Bedrock RAG evaluation job that includes the faithfulness metric", fr: "Exécuter une tâche d'évaluation RAG Amazon Bedrock qui inclut la métrique de fidélité (faithfulness)" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A contextual grounding check scores each response against the grounding source and detects and blocks responses that introduce information not found in the source. A retrieve-and-generate RAG evaluation job measures faithfulness, which shows how well the responses avoid hallucination with respect to the retrieved texts."
    fr: "Une vérification de l'ancrage contextuel note chaque réponse par rapport à la source d'ancrage, et détecte et bloque les réponses qui introduisent des informations absentes de la source. Une tâche d'évaluation RAG de type récupération et génération mesure la fidélité (faithfulness), qui indique dans quelle mesure les réponses évitent les hallucinations par rapport aux textes récupérés."
  options:
    a:
      en: "CloudTrail data events record API activity; they do not compare the content of a response with the documents."
      fr: "Les événements de données CloudTrail enregistrent l'activité des API ; ils ne comparent pas le contenu d'une réponse aux documents."
    c:
      en: "Provisioned Throughput reserves inference capacity for a model; it does not check the truthfulness of the responses."
      fr: "Le débit provisionné réserve une capacité d'inférence pour un modèle ; il ne vérifie pas la véracité des réponses."
    d:
      en: "Macie discovers sensitive data such as personal information in Amazon S3; it does not evaluate the responses of the assistant."
      fr: "Macie découvre des données sensibles, comme des informations personnelles, dans Amazon S3 ; il n'évalue pas les réponses de l'assistant."
references:
  - title: "Use contextual grounding check to filter hallucinations in responses"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: "Use metrics to understand RAG system performance"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
