id: aifc01-4b-transparent-still-biased
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company replaces a deep neural network with a decision tree for its job application screening because its HR team must understand every decision. The decision tree was trained on the same historical hiring decisions as the neural network.

    Which statement about the new model is correct?
  fr: |
    Une entreprise remplace un réseau neuronal profond par un arbre de décision pour présélectionner les candidatures, car son équipe RH doit comprendre chaque décision. L'arbre de décision a été entraîné sur les mêmes décisions d'embauche historiques que le réseau neuronal.

    Quelle affirmation sur le nouveau modèle est correcte ?
body:
  options:
    - { id: a, text: { en: "It removes the bias of the historical decisions, because a decision tree cannot learn biased rules", fr: "Il supprime le biais des décisions historiques, car un arbre de décision ne peut pas apprendre de règles biaisées" } }
    - { id: b, text: { en: "It can still reproduce bias from the historical decisions, but its rules let the HR team find that bias", fr: "Il peut encore reproduire le biais des décisions historiques, mais ses règles permettent à l'équipe RH de repérer ce biais" } }
    - { id: c, text: { en: "It needs SHAP or LIME before the HR team can understand any of its decisions", fr: "Il a besoin de SHAP ou de LIME avant que l'équipe RH puisse comprendre l'une de ses décisions" } }
    - { id: d, text: { en: "It is guaranteed to be at least as accurate as the neural network, because it uses the same data", fr: "Il est forcément au moins aussi exact que le réseau neuronal, car il utilise les mêmes données" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Transparency means that people can understand how the model reaches its outputs; it does not remove bias that is present in the training data. Because the if-then rules of a decision tree can be read, the HR team can see when a rule depends on an unfair factor and correct it."
    fr: "La transparence signifie que l'on peut comprendre comment le modèle produit ses sorties ; elle ne supprime pas le biais présent dans les données d'entraînement. Comme les règles « si-alors » d'un arbre de décision sont lisibles, l'équipe RH peut voir quand une règle dépend d'un facteur injuste et la corriger."
  options:
    a:
      en: "A decision tree learns its rules from the data; if the historical decisions are biased, the rules can be biased too."
      fr: "Un arbre de décision apprend ses règles à partir des données ; si les décisions historiques sont biaisées, les règles peuvent l'être aussi."
    c:
      en: "A decision tree is inherently interpretable; post hoc methods are needed for complex models, not to read the rules of a tree."
      fr: "Un arbre de décision est intrinsèquement interprétable ; les méthodes post hoc servent pour les modèles complexes, pas pour lire les règles d'un arbre."
    d:
      en: "Simpler models often have lower performance because they cannot capture complex non-linear interactions, even on the same data."
      fr: "Les modèles plus simples ont souvent une performance moindre, car ils ne capturent pas les interactions non linéaires complexes, même avec les mêmes données."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
  - title: "Machine learning model interpretability with AWS"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/welcome.html
