id: aifc01-4a-bv-fix-underfit
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A model that predicts house prices performs poorly on both the training data and the evaluation data. The data scientist confirms that the dataset is large enough and that its labels are correct.

    Which action will MOST likely improve the model?
  fr: |
    Un modèle qui prédit le prix des maisons est peu performant sur les données d'entraînement comme sur les données d'évaluation. Le data scientist confirme que le jeu de données est suffisamment volumineux et que ses étiquettes sont correctes.

    Quelle action est la PLUS susceptible d'améliorer le modèle ?
body:
  options:
    - { id: a, text: { en: "Add relevant features and reduce the amount of regularization.", fr: "Ajouter des variables pertinentes et réduire la régularisation." } }
    - { id: b, text: { en: "Increase the amount of regularization to penalize large weights.", fr: "Augmenter la régularisation pour pénaliser les pondérations élevées." } }
    - { id: c, text: { en: "Remove features so that the model becomes simpler to train.", fr: "Supprimer des variables pour que le modèle soit plus simple à entraîner." } }
    - { id: d, text: { en: "Stop the training earlier by using early stopping.", fr: "Arrêter l'entraînement plus tôt grâce à l'arrêt anticipé." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Poor performance on both training and evaluation data, with enough correct data, indicates underfitting: the model is not flexible enough. Adding domain-specific features and decreasing regularization increase the flexibility of the model so that it can capture the relationship in the data."
    fr: "De mauvaises performances sur les données d'entraînement et d'évaluation, avec suffisamment de données correctes, indiquent un sous-ajustement : le modèle n'est pas assez flexible. Ajouter des variables propres au domaine et réduire la régularisation augmentent la flexibilité du modèle pour qu'il capture la relation présente dans les données."
  options:
    b:
      en: "More regularization reduces flexibility; it is a remedy for overfitting, not underfitting."
      fr: "Plus de régularisation réduit la flexibilité ; c'est un remède au surajustement, pas au sous-ajustement."
    c:
      en: "Removing features makes the model even simpler and increases bias."
      fr: "Supprimer des variables rend le modèle encore plus simple et augmente le biais."
    d:
      en: "Early stopping prevents overfitting; stopping earlier gives an underfit model even less training."
      fr: "L'arrêt anticipé évite le surajustement ; arrêter plus tôt entraîne encore moins un modèle déjà en sous-ajustement."
references:
  - title: "Model Fit: Underfitting vs. Overfitting"
    url: https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html
