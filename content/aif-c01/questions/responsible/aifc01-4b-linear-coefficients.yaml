id: aifc01-4b-linear-coefficients
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A real estate company needs a model that predicts house prices. Its analysts must be able to see directly, from the model itself, how much each input feature increases or decreases the predicted price.

    Which type of model will meet this requirement?
  fr: |
    Une agence immobilière a besoin d'un modèle qui prédit le prix des maisons. Ses analystes doivent pouvoir voir directement, à partir du modèle lui-même, dans quelle mesure chaque caractéristique d'entrée augmente ou diminue le prix prédit.

    Quel type de modèle répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "A deep neural network with many hidden layers", fr: "Un réseau neuronal profond comportant de nombreuses couches cachées" } }
    - { id: b, text: { en: "A large language model that is accessed through an API", fr: "Un grand modèle de langage accessible par une API" } }
    - { id: c, text: { en: "A convolutional neural network trained on photos of the houses", fr: "Un réseau neuronal convolutif entraîné sur des photos des maisons" } }
    - { id: d, text: { en: "A linear regression model", fr: "Un modèle de régression linéaire" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A linear regression model is inherently interpretable: its prediction is a weighted sum of the inputs, and the magnitude of each coefficient shows how strongly a feature affects the output. Simple models like this are considered transparent because the effect of each feature is easy to understand."
    fr: "Un modèle de régression linéaire est intrinsèquement interprétable : sa prédiction est une somme pondérée des entrées, et l'amplitude de chaque coefficient indique l'influence d'une caractéristique sur la sortie. Les modèles simples de ce type sont considérés comme transparents, car l'effet de chaque caractéristique est facile à comprendre."
  options:
    a:
      en: "A deep neural network captures complex non-linear interactions, but its internal logic cannot be read directly; it needs post hoc methods to be explained."
      fr: "Un réseau neuronal profond capture des interactions non linéaires complexes, mais sa logique interne ne peut pas être lue directement ; il faut des méthodes post hoc pour l'expliquer."
    b:
      en: "A large language model accessed through an API has billions of parameters that the analysts cannot inspect, so it does not show the effect of each feature."
      fr: "Un grand modèle de langage accessible par une API possède des milliards de paramètres que les analystes ne peuvent pas inspecter : il ne montre donc pas l'effet de chaque caractéristique."
    c:
      en: "A convolutional neural network is a complex model whose predictions require post hoc analysis to be interpreted."
      fr: "Un réseau neuronal convolutif est un modèle complexe dont les prédictions nécessitent une analyse post hoc pour être interprétées."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
  - title: "Overview"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html
