id: aifc01-4a-legal-nova-indemnity
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A publishing company will use a foundation model to generate text for books that it sells. The company wants contractual protection from AWS against third-party claims that the generated text infringes intellectual property (IP).

    Which approach will meet this requirement?
  fr: |
    Une maison d'édition va utiliser un modèle de fondation pour générer du texte destiné aux livres qu'elle vend. Elle veut une protection contractuelle d'AWS contre les réclamations de tiers affirmant que le texte généré viole une propriété intellectuelle (PI).

    Quelle approche répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Use a generally available Amazon Nova model on Amazon Bedrock and keep the available filters enabled.", fr: "Utiliser un modèle Amazon Nova en disponibilité générale sur Amazon Bedrock et garder activés les filtres disponibles." } }
    - { id: b, text: { en: "Use a generally available Amazon Nova model on Amazon Bedrock and turn off the available filters to avoid blocked responses.", fr: "Utiliser un modèle Amazon Nova en disponibilité générale sur Amazon Bedrock et désactiver les filtres disponibles pour éviter les réponses bloquées." } }
    - { id: c, text: { en: "Download an open source model and host it on Amazon EC2 instances.", fr: "Télécharger un modèle open source et l'héberger sur des instances Amazon EC2." } }
    - { id: d, text: { en: "Add a notice to each book that states that AI generated parts of the text.", fr: "Ajouter dans chaque livre une mention indiquant qu'une IA a généré une partie du texte." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS offers uncapped IP indemnity coverage for outputs of generally available Amazon Nova models: AWS defends customers against third-party claims that these outputs infringe IP. The indemnity excludes cases where the customer interferes with or fails to enable the available filters and tools, so the company must keep them enabled."
    fr: "AWS propose une indemnisation PI non plafonnée pour les sorties des modèles Amazon Nova en disponibilité générale : AWS défend ses clients contre les réclamations de tiers affirmant que ces sorties violent une PI. L'indemnisation exclut les cas où le client contourne ou n'active pas les filtres et outils disponibles : l'entreprise doit donc les garder activés."
  options:
    b:
      en: "Turning off the available filters is one of the exclusions of the AWS indemnity, so the company would lose the protection."
      fr: "Désactiver les filtres disponibles fait partie des exclusions de l'indemnisation d'AWS : l'entreprise perdrait la protection."
    c:
      en: "AWS does not provide the model in this case; hosting an open source model on EC2 gives no AWS indemnity for its outputs."
      fr: "AWS ne fournit pas le modèle dans ce cas ; héberger un modèle open source sur EC2 n'apporte aucune indemnisation d'AWS pour ses sorties."
    d:
      en: "Disclosing AI use supports transparency but gives no protection against infringement claims."
      fr: "Indiquer l'usage de l'IA favorise la transparence mais ne protège pas contre les réclamations pour violation."
references:
  - title: "Responsible use"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/responsible-use.html
