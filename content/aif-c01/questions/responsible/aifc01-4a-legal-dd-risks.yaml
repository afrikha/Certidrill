id: aifc01-4a-legal-dd-risks
objective: "4.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company's risk team reviews incidents caused by its generative AI applications.

    Match each incident to the legal risk that it represents. To answer, drag the appropriate risk to each incident. Each risk may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de gestion des risques d'une entreprise examine des incidents causés par ses applications d'IA générative.

    Associez chaque incident au risque juridique qu'il représente. Pour répondre, faites glisser le risque approprié vers chaque incident. Chaque risque peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ip, text: { en: "Intellectual property infringement claim", fr: "Réclamation pour violation de propriété intellectuelle" } }
    - { id: bias, text: { en: "Biased model output", fr: "Sortie biaisée du modèle" } }
    - { id: enduser, text: { en: "End user risk", fr: "Risque lié à l'utilisateur final" } }
    - { id: halluc, text: { en: "Hallucination", fr: "Hallucination" } }
    - { id: trust, text: { en: "Loss of customer trust", fr: "Perte de confiance des clients" } }
  targets:
    - { id: t1, text: { en: "A coding assistant inserts the source code of a licensed library, word for word, into a product that the company sells.", fr: "Un assistant de codage insère mot pour mot le code source d'une bibliothèque sous licence dans un produit que l'entreprise vend." } }
    - { id: t2, text: { en: "A tenant screening assistant gives lower scores to applicants who live in certain neighborhoods.", fr: "Un assistant de sélection des locataires attribue des scores plus faibles aux candidats qui habitent certains quartiers." } }
    - { id: t3, text: { en: "A fitness assistant recommends an extreme diet, and a user who follows it becomes ill.", fr: "Un assistant de remise en forme recommande un régime extrême, et un utilisateur qui le suit tombe malade." } }
answer:
  mapping: { t1: ip, t2: bias, t3: enduser }
explanation:
  correct:
    en: "Reproducing licensed code in a commercial product exposes the company to IP infringement claims. Lower scores for applicants from certain neighborhoods are biased outputs that can lead to discrimination claims. Harm to a user who acts on an output is an end user risk. The incidents do not describe an invented fact or a public loss of trust."
    fr: "Reproduire du code sous licence dans un produit commercial expose l'entreprise à des réclamations pour violation de PI. Des scores plus faibles pour les candidats de certains quartiers sont des sorties biaisées qui peuvent entraîner des plaintes pour discrimination. Le préjudice subi par un utilisateur qui suit une sortie est un risque lié à l'utilisateur final. Les incidents ne décrivent ni un fait inventé ni une perte de confiance publique."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
