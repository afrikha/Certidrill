id: aifc01-4b-transparent-traits
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is comparing a transparent and explainable model with a model that is not transparent.

    Which two characteristics apply to the transparent and explainable model? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise compare un modèle transparent et explicable avec un modèle qui n'est pas transparent.

    Quelles sont les deux caractéristiques qui s'appliquent au modèle transparent et explicable ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Stakeholders can understand how the inputs influence its outputs", fr: "Les parties prenantes peuvent comprendre comment les entrées influencent ses sorties" } }
    - { id: b, text: { en: "It has more parameters than the model that is not transparent", fr: "Il possède plus de paramètres que le modèle non transparent" } }
    - { id: c, text: { en: "It no longer needs any human oversight once it is deployed", fr: "Il n'a plus besoin d'aucune supervision humaine une fois déployé" } }
    - { id: d, text: { en: "Its decisions can be justified to the people that they affect", fr: "Ses décisions peuvent être justifiées auprès des personnes qu'elles concernent" } }
    - { id: e, text: { en: "It always produces more accurate predictions on complex data", fr: "Il produit toujours des prédictions plus exactes sur des données complexes" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A transparent and explainable model lets people understand why it makes a specific prediction. This understanding is what makes it possible to justify decisions that affect people, for example in healthcare and finance."
    fr: "Un modèle transparent et explicable permet de comprendre pourquoi il fait une prédiction donnée. C'est cette compréhension qui permet de justifier les décisions qui touchent des personnes, par exemple dans la santé et la finance."
  options:
    b:
      en: "More parameters usually make a model more complex and harder to interpret, not more transparent."
      fr: "Davantage de paramètres rendent généralement un modèle plus complexe et plus difficile à interpréter, et non plus transparent."
    c:
      en: "Explainability supports human oversight; it does not replace it, especially for consequential decisions."
      fr: "L'explicabilité facilite la supervision humaine ; elle ne la remplace pas, surtout pour les décisions lourdes de conséquences."
    e:
      en: "Simple interpretable models often perform worse on complex data than complex models; that is the trade-off between interpretability and performance."
      fr: "Les modèles interprétables simples sont souvent moins performants que les modèles complexes sur des données complexes ; c'est le compromis entre interprétabilité et performance."
references:
  - title: "Machine learning model interpretability with AWS"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/welcome.html
