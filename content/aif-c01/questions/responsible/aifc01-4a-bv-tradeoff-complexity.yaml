id: aifc01-4a-bv-tradeoff-complexity
objective: "4.1.6"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A data scientist trains five versions of a model with increasing complexity. The training error decreases with each version. The validation error decreases from version 1 to version 3, and then increases for versions 4 and 5.

    Which version gives the BEST balance between bias and variance?
  fr: |
    Un data scientist entraîne cinq versions d'un modèle de complexité croissante. L'erreur d'entraînement diminue à chaque version. L'erreur de validation diminue de la version 1 à la version 3, puis augmente pour les versions 4 et 5.

    Quelle version offre le MEILLEUR équilibre entre biais et variance ?
body:
  options:
    - { id: a, text: { en: "Version 1, because it is the simplest model", fr: "La version 1, car c'est le modèle le plus simple" } }
    - { id: b, text: { en: "Version 3, because it has the lowest validation error", fr: "La version 3, car elle a l'erreur de validation la plus faible" } }
    - { id: c, text: { en: "Version 4, because its training error is lower than version 3", fr: "La version 4, car son erreur d'entraînement est plus faible que celle de la version 3" } }
    - { id: d, text: { en: "Version 5, because it has the lowest training error", fr: "La version 5, car elle a l'erreur d'entraînement la plus faible" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Simple models have high bias (underfitting), and complex models have high variance (overfitting). Validation error measures how the model generalizes: it is lowest at version 3, after which the extra complexity only fits noise in the training data."
    fr: "Les modèles simples ont un biais élevé (sous-ajustement), et les modèles complexes une variance élevée (surajustement). L'erreur de validation mesure la capacité de généralisation du modèle : elle est minimale pour la version 3, après quoi la complexité supplémentaire ne fait que s'ajuster au bruit des données d'entraînement."
  options:
    a:
      en: "Version 1 has a higher validation error than version 3: it underfits."
      fr: "La version 1 a une erreur de validation plus élevée que la version 3 : elle est en sous-ajustement."
    c:
      en: "A lower training error with a higher validation error shows that version 4 starts to overfit."
      fr: "Une erreur d'entraînement plus faible avec une erreur de validation plus élevée montre que la version 4 commence à surajuster."
    d:
      en: "The lowest training error with a rising validation error is the clearest sign of overfitting."
      fr: "L'erreur d'entraînement la plus faible avec une erreur de validation en hausse est le signe le plus net de surajustement."
references:
  - title: "What is Overfitting?"
    url: https://aws.amazon.com/what-is/overfitting/
