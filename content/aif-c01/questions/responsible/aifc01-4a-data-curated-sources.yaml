id: aifc01-4a-data-curated-sources
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is preparing data to fine-tune a model that answers medical questions. Instead of scraping anonymous forum posts from the internet, the team uses only clinical guidelines from vetted medical publishers, reviewed by its own experts.

    Which characteristic of datasets does this choice represent?
  fr: |
    Une entreprise prépare des données pour peaufiner un modèle qui répond à des questions médicales. Au lieu de collecter des messages anonymes de forums sur internet, l'équipe utilise uniquement des recommandations cliniques d'éditeurs médicaux reconnus, relues par ses propres experts.

    Quelle caractéristique des jeux de données ce choix représente-t-il ?
body:
  options:
    - { id: a, text: { en: "Data augmentation", fr: "Augmentation des données" } }
    - { id: b, text: { en: "Unlabeled data", fr: "Données non étiquetées" } }
    - { id: c, text: { en: "Curated data sources", fr: "Sources de données sélectionnées" } }
    - { id: d, text: { en: "Synthetic data", fr: "Données synthétiques" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Curated data sources are selected and reviewed for quality, accuracy and relevance to the use case. Using vetted clinical guidelines reviewed by experts, instead of unverified web content, gives the model reliable data and reduces the risk of learning incorrect or harmful information."
    fr: "Des sources de données sélectionnées sont choisies et vérifiées pour leur qualité, leur exactitude et leur pertinence pour le cas d'utilisation. Utiliser des recommandations cliniques reconnues et relues par des experts, plutôt que du contenu web non vérifié, fournit au modèle des données fiables et réduit le risque d'apprendre des informations fausses ou dangereuses."
  options:
    a:
      en: "Data augmentation creates modified copies of existing samples; it does not describe how the sources are chosen."
      fr: "L'augmentation des données crée des copies modifiées d'échantillons existants ; elle ne décrit pas la façon dont les sources sont choisies."
    b:
      en: "The choice is about the origin and quality of the data, not about whether it has labels."
      fr: "Le choix porte sur l'origine et la qualité des données, pas sur la présence d'étiquettes."
    d:
      en: "Synthetic data is generated artificially; the team uses real documents from vetted publishers."
      fr: "Les données synthétiques sont générées artificiellement ; l'équipe utilise de vrais documents d'éditeurs reconnus."
references:
  - title: "RAIDP04-BP05 Document the characteristics of each dataset using a datasheet"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp04-bp05.html
