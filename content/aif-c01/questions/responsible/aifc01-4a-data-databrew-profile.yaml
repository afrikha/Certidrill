id: aifc01-4a-data-databrew-profile
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A business analyst must examine a training dataset that is stored in Amazon S3 before it is used. The analyst wants to see value distributions, find missing values and skewed categories, and fix them without writing code.

    Which AWS service will meet these requirements?
  fr: |
    Un analyste métier doit examiner un jeu de données d'entraînement stocké dans Amazon S3 avant son utilisation. Il veut voir les distributions des valeurs, repérer les valeurs manquantes et les catégories surreprésentées, et les corriger sans écrire de code.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Glue DataBrew" }
    - { id: b, text: "AWS Lake Formation" }
    - { id: c, text: "Amazon Macie" }
    - { id: d, text: "Amazon Rekognition" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Glue DataBrew is a visual data preparation tool. Users explore the profile of the data with value distributions and charts, get suggestions about data quality issues, and clean and normalize the data with more than 250 ready-made transformations, without writing code."
    fr: "AWS Glue DataBrew est un outil visuel de préparation des données. Les utilisateurs explorent le profil des données avec des distributions de valeurs et des graphiques, reçoivent des suggestions sur les problèmes de qualité des données, et nettoient et normalisent les données avec plus de 250 transformations prêtes à l'emploi, sans écrire de code."
  options:
    b:
      en: "Lake Formation manages permissions and governance of a data lake; it does not profile or fix data values."
      fr: "Lake Formation gère les autorisations et la gouvernance d'un lac de données ; il ne profile ni ne corrige les valeurs des données."
    c:
      en: "Macie discovers sensitive data such as PII in Amazon S3; it does not profile distributions or fix data."
      fr: "Macie découvre les données sensibles comme les PII dans Amazon S3 ; il ne profile pas les distributions et ne corrige pas les données."
    d:
      en: "Rekognition analyzes images and videos; it does not prepare tabular data."
      fr: "Rekognition analyse des images et des vidéos ; il ne prépare pas de données tabulaires."
references:
  - title: "What is AWS Glue DataBrew?"
    url: https://docs.aws.amazon.com/databrew/latest/dg/what-is.html
