id: aifc01-4b-bedrock-auto-eval
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company is selecting a foundation model in Amazon Bedrock to summarize customer reviews. It wants computed scores for the accuracy, robustness, and toxicity of each candidate model on its own prompt dataset. The company does not want to set up a team of reviewers.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une agence de voyages sélectionne un modèle de fondation dans Amazon Bedrock pour résumer les avis clients. Elle veut des scores calculés d'exactitude, de robustesse et de toxicité pour chaque modèle candidat sur son propre jeu d'invites. L'entreprise ne veut pas constituer d'équipe de réviseurs.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Bedrock model evaluation job that uses human workers for each model", fr: "Créer pour chaque modèle une tâche d'évaluation de modèle Amazon Bedrock qui fait appel à des travailleurs humains" } }
    - { id: b, text: { en: "Create an automatic Amazon Bedrock model evaluation job with the text summarization task type for each model", fr: "Créer pour chaque modèle une tâche d'évaluation automatique de modèle Amazon Bedrock avec le type de tâche de résumé de texte" } }
    - { id: c, text: { en: "Configure an Amazon Bedrock guardrail with content filters and compare the number of blocked responses", fr: "Configurer un garde-fou Amazon Bedrock avec des filtres de contenu et comparer le nombre de réponses bloquées" } }
    - { id: d, text: { en: "Write scripts on Amazon EC2 instances that call each model and calculate the metrics", fr: "Écrire sur des instances Amazon EC2 des scripts qui appellent chaque modèle et calculent les métriques" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An automatic (programmatic) model evaluation job computes metrics for a task type on a custom or built-in prompt dataset. For text summarization, it reports accuracy (BERTScore), robustness, and toxicity, so the company can compare the candidate models without human evaluators or custom code."
    fr: "Une tâche d'évaluation de modèle automatique (programmatique) calcule des métriques pour un type de tâche sur un jeu d'invites personnalisé ou intégré. Pour le résumé de texte, elle indique l'exactitude (BERTScore), la robustesse et la toxicité : l'entreprise peut ainsi comparer les modèles candidats sans évaluateurs humains ni code personnalisé."
  options:
    a:
      en: "A human-based evaluation job requires a work team of reviewers, which the company does not want to set up."
      fr: "Une tâche d'évaluation humaine exige une équipe de travail de réviseurs, que l'entreprise ne veut pas constituer."
    c:
      en: "Guardrails filter harmful content at run time; the number of blocked responses does not measure accuracy or robustness."
      fr: "Les garde-fous filtrent le contenu préjudiciable à l'exécution ; le nombre de réponses bloquées ne mesure ni l'exactitude ni la robustesse."
    d:
      en: "Custom scripts on EC2 could compute the metrics, but they require building and maintaining code, which adds operational overhead."
      fr: "Des scripts sur EC2 pourraient calculer les métriques, mais il faut développer et maintenir le code, ce qui ajoute de la charge opérationnelle."
references:
  - title: "Model evaluation task types in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
  - title: "Evaluate the performance of Amazon Bedrock resources"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
