id: aifc01-4b-high-cost-errors
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building several ML models. For one of them, it will accept a small loss of performance to get a model that is easier to interpret.

    For which use case is this trade-off MOST justified?
  fr: |
    Une entreprise développe plusieurs modèles de ML. Pour l'un d'eux, elle acceptera une légère perte de performance afin d'obtenir un modèle plus facile à interpréter.

    Pour quel cas d'utilisation ce compromis est-il le PLUS justifié ?
body:
  options:
    - { id: a, text: { en: "Suggesting songs for a music streaming playlist", fr: "Suggérer des morceaux pour une playlist de streaming musical" } }
    - { id: b, text: { en: "Supporting doctors who decide on a cancer treatment", fr: "Aider des médecins qui décident d'un traitement contre le cancer" } }
    - { id: c, text: { en: "Tagging the photos of an internal image library", fr: "Étiqueter les photos d'une photothèque interne" } }
    - { id: d, text: { en: "Ordering the products on the home page of a retail website", fr: "Ordonner les produits de la page d'accueil d'un site de vente en ligne" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The demand for interpretability increases when incorrect predictions have a large cost, especially in high-risk applications such as healthcare. Doctors need to understand and justify a recommendation before they act on it, which is worth a small loss of performance."
    fr: "Le besoin d'interprétabilité augmente lorsque les prédictions incorrectes ont un coût élevé, en particulier dans les applications à haut risque comme la santé. Les médecins doivent comprendre et justifier une recommandation avant d'agir, ce qui vaut bien une légère perte de performance."
  options:
    a:
      en: "A poor song suggestion has a low cost, so performance usually matters more than interpretability."
      fr: "Une mauvaise suggestion de morceau a un faible coût : la performance compte généralement plus que l'interprétabilité."
    c:
      en: "An incorrect tag in an internal library has little impact on people, so interpretability is a lower priority."
      fr: "Une étiquette incorrecte dans une photothèque interne a peu d'impact sur les personnes : l'interprétabilité y est moins prioritaire."
    d:
      en: "Product ordering errors have a low cost for each customer; a more accurate model is usually preferred."
      fr: "Les erreurs d'ordre des produits ont un faible coût pour chaque client ; on préfère généralement un modèle plus exact."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
