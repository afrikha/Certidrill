id: aifc01-4a-legal-deployer-responsibility
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company plans to use a foundation model (FM) from a third-party provider to screen job applicants. The legal team asks who is responsible if the screening produces discriminatory outcomes.

    Which statement is correct?
  fr: |
    Une entreprise prévoit d'utiliser un modèle de fondation (FM) d'un fournisseur tiers pour présélectionner des candidats. L'équipe juridique demande qui est responsable si la présélection produit des résultats discriminatoires.

    Quelle affirmation est correcte ?
body:
  options:
    - { id: a, text: { en: "Only the model provider is liable for the outcomes, because the provider chose the data and trained the model.", fr: "Seul le fournisseur du modèle est responsable des résultats, car c'est lui qui a choisi les données et entraîné le modèle." } }
    - { id: b, text: { en: "The company that uses the model remains responsible for its use, so it must test the outputs for bias and keep human oversight.", fr: "L'entreprise qui utilise le modèle reste responsable de son usage : elle doit donc tester les sorties pour détecter les biais et maintenir une supervision humaine." } }
    - { id: c, text: { en: "An FM from a large provider is already tested for bias, so the company does not need to test its outputs.", fr: "Un FM d'un grand fournisseur est déjà testé contre les biais : l'entreprise n'a donc pas besoin de tester ses sorties." } }
    - { id: d, text: { en: "The risk of biased outputs exists only if the company fine-tunes the model with its own hiring data.", fr: "Le risque de sorties biaisées n'existe que si l'entreprise peaufine le modèle avec ses propres données de recrutement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The deployer of an AI system is responsible for how it uses the outputs, including compliance with anti-discrimination laws. AWS guidance asks customers who use a model in consequential decisions to evaluate the risks of their use case and to implement human oversight, testing and other safeguards."
    fr: "L'entreprise qui déploie un système d'IA est responsable de l'usage qu'elle fait de ses sorties, y compris du respect des lois contre la discrimination. Les recommandations d'AWS demandent aux clients qui utilisent un modèle pour des décisions importantes d'évaluer les risques de leur cas d'utilisation et de mettre en place une supervision humaine, des tests et d'autres protections."
  options:
    a:
      en: "Using a third-party model does not transfer the responsibility for the decisions that the company makes with it."
      fr: "Utiliser un modèle tiers ne transfère pas la responsabilité des décisions que l'entreprise prend avec lui."
    c:
      en: "Any model can learn biases from its training data; outputs must be tested for the specific use case."
      fr: "Tout modèle peut apprendre des biais à partir de ses données d'entraînement ; les sorties doivent être testées pour le cas d'utilisation précis."
    d:
      en: "A pretrained model can already produce biased outputs without any customization."
      fr: "Un modèle préentraîné peut déjà produire des sorties biaisées sans aucune personnalisation."
references:
  - title: "Responsible use"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/responsible-use.html
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
