id: aifc01-4a-gr-dd-pii-actions
objective: "4.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A company configures the sensitive information filters of a guardrail in Amazon Bedrock Guardrails for its customer support assistant.

    Match each requirement to the filter action that meets it. To answer, drag the appropriate action to each requirement. Each action may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise configure les filtres d'informations sensibles d'un garde-fou Amazon Bedrock Guardrails pour son assistant de support client.

    Associez chaque exigence à l'action de filtre qui y répond. Pour répondre, faites glisser l'action appropriée vers chaque exigence. Chaque action peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: block, text: "Block" }
    - { id: mask, text: "Mask" }
    - { id: detect, text: { en: "Detect (no action)", fr: "Detect (aucune action)" } }
  targets:
    - { id: t1, text: { en: "Return the response with each email address replaced by a placeholder.", fr: "Renvoyer la réponse en remplaçant chaque adresse e-mail par un espace réservé." } }
    - { id: t2, text: { en: "Reject the whole response if it contains a credit card number.", fr: "Rejeter toute la réponse si elle contient un numéro de carte bancaire." } }
    - { id: t3, text: { en: "Measure how often names appear in responses without changing the responses.", fr: "Mesurer la fréquence des noms dans les réponses sans modifier les réponses." } }
answer:
  mapping: { t1: mask, t2: block, t3: detect }
explanation:
  correct:
    en: "Mask (API value ANONYMIZE) replaces each detected value with its PII type, such as {EMAIL}, and returns the rest of the content. Block rejects the entire request or response and returns the configured message. Detect (API value NONE) takes no action but returns detection information, which lets the company measure occurrences."
    fr: "Mask (valeur d'API ANONYMIZE) remplace chaque valeur détectée par son type de PII, par exemple {EMAIL}, et renvoie le reste du contenu. Block rejette toute la requête ou la réponse et renvoie le message configuré. Detect (valeur d'API NONE) n'effectue aucune action mais renvoie les informations de détection, ce qui permet à l'entreprise de mesurer les occurrences."
references:
  - title: "Remove PII from conversations by using sensitive information filters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
