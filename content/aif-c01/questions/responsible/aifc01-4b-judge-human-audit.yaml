id: aifc01-4b-judge-human-audit
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company uses an Amazon Bedrock evaluation job with a judge model (LLM-as-a-judge) to score thousands of chatbot responses for stereotyping. Because the chatbot is used in a high-risk context, the company must confirm that the judge's scores are trustworthy before it releases the chatbot.

    Which approach will meet this requirement?
  fr: |
    Une entreprise de santé utilise une tâche d'évaluation Amazon Bedrock avec un modèle juge (LLM-as-a-judge) pour noter des milliers de réponses d'un chatbot sur le critère des stéréotypes. Comme le chatbot est utilisé dans un contexte à haut risque, l'entreprise doit confirmer que les notes du juge sont fiables avant de mettre le chatbot en production.

    Quelle approche répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Run the same evaluation job a second time and keep the average of the two scores", fr: "Exécuter une seconde fois la même tâche d'évaluation et garder la moyenne des deux notes" } }
    - { id: b, text: { en: "Replace the stereotyping metric with the relevance metric, which is easier for a judge model to score", fr: "Remplacer la métrique des stéréotypes par la métrique de pertinence, plus facile à noter pour un modèle juge" } }
    - { id: c, text: { en: "Increase the temperature of the judge model so that it explores more possible scores", fr: "Augmenter la température du modèle juge pour qu'il explore davantage de notes possibles" } }
    - { id: d, text: { en: "Have independent human reviewers rate a sample of the same responses and compare their ratings with the judge's scores", fr: "Faire noter un échantillon des mêmes réponses par des réviseurs humains indépendants et comparer leurs notes à celles du juge" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A human audit corroborates an automated evaluation: independent reviewers rate a sample and the team investigates significant disagreements before the release decision. Second opinions are recommended for critical or subjective criteria such as bias and safety, and model-generated judgments should be validated against human judgment."
    fr: "Un audit humain corrobore une évaluation automatisée : des réviseurs indépendants notent un échantillon et l'équipe analyse les désaccords importants avant la décision de mise en production. Un second avis est recommandé pour les critères critiques ou subjectifs comme les biais et la sûreté, et les jugements produits par un modèle doivent être validés par rapport au jugement humain."
  options:
    a:
      en: "Repeating the job with the same judge can reduce random variation, but it does not check the judge against an independent reference."
      fr: "Répéter la tâche avec le même juge peut réduire la variation aléatoire, mais ne compare pas le juge à une référence indépendante."
    b:
      en: "Relevance measures whether the answer addresses the prompt; dropping the stereotyping metric removes the bias check that the company needs."
      fr: "La pertinence mesure si la réponse traite l'invite ; abandonner la métrique des stéréotypes supprime le contrôle des biais dont l'entreprise a besoin."
    c:
      en: "A higher temperature makes the judge's output more random, which makes its scores less reliable, not more."
      fr: "Une température plus élevée rend la sortie du juge plus aléatoire, ce qui rend ses notes moins fiables, et non plus fiables."
references:
  - title: "RAIER01-BP02 Independently corroborate more critical and subjective evaluations"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raier01-bp02.html
  - title: "Use metrics to understand model performance"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
