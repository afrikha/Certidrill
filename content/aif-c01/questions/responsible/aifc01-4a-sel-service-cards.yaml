id: aifc01-4a-sel-service-cards
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before a team selects an Amazon Nova model, it wants to review the intended use cases, the limitations, and the responsible AI design choices of the model, as published by AWS.

    Which resource should the team review?
  fr: |
    Avant de sélectionner un modèle Amazon Nova, une équipe veut examiner les cas d'utilisation prévus, les limites et les choix de conception d'IA responsable du modèle, tels que publiés par AWS.

    Quelle ressource l'équipe doit-elle consulter ?
body:
  options:
    - { id: a, text: "AWS AI Service Cards" }
    - { id: b, text: "AWS Artifact" }
    - { id: c, text: "AWS Trusted Advisor" }
    - { id: d, text: { en: "Amazon Bedrock model invocation logs", fr: "Journaux d'appels de modèles Amazon Bedrock" } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS AI Service Cards are a transparency resource. Each card gives, in one place, the intended use cases and limitations, the responsible AI design choices, and performance optimization best practices of an AWS AI service or model, including Amazon Nova models."
    fr: "Les AWS AI Service Cards sont une ressource de transparence. Chaque carte regroupe les cas d'utilisation prévus et les limites, les choix de conception d'IA responsable et les bonnes pratiques d'optimisation des performances d'un service ou d'un modèle d'IA AWS, y compris les modèles Amazon Nova."
  options:
    b:
      en: "AWS Artifact provides AWS compliance reports and agreements, not model use cases and limitations."
      fr: "AWS Artifact fournit des rapports de conformité et des accords AWS, pas les cas d'utilisation et les limites des modèles."
    c:
      en: "Trusted Advisor checks an account for cost, security, performance and resilience recommendations."
      fr: "Trusted Advisor analyse un compte pour proposer des recommandations de coût, de sécurité, de performance et de résilience."
    d:
      en: "Invocation logs record the requests and responses of the company's own calls; they do not document the model."
      fr: "Les journaux d'appels enregistrent les requêtes et les réponses des appels de l'entreprise ; ils ne documentent pas le modèle."
references:
  - title: "Responsible AI Tools and Resources"
    url: https://aws.amazon.com/ai/responsible-ai/resources/
