id: aifc01-4a-rai-transparency-disclose
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An energy company is launching a generative AI assistant on its website. Before customers start a conversation, the company wants to tell them that they are talking to an AI system, what data the assistant uses, and what its known limitations are, so that customers can decide whether to use it.

    Which dimension of responsible AI does this requirement address?
  fr: |
    Une entreprise d'énergie lance un assistant d'IA générative sur son site web. Avant que les clients ne commencent une conversation, elle veut leur indiquer qu'ils échangent avec un système d'IA, quelles données l'assistant utilise et quelles sont ses limites connues, afin qu'ils puissent décider de l'utiliser ou non.

    Quelle dimension de l'IA responsable cette exigence concerne-t-elle ?
body:
  options:
    - { id: a, text: { en: "Explainability", fr: "Explicabilité" } }
    - { id: b, text: { en: "Controllability", fr: "Contrôlabilité" } }
    - { id: c, text: { en: "Veracity and robustness", fr: "Véracité et robustesse" } }
    - { id: d, text: { en: "Transparency", fr: "Transparence" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Transparency means enabling stakeholders to make informed choices about their engagement with an AI system. Disclosing that the assistant is an AI, what data informs it and its limitations, before customers decide to use it, is a transparency practice."
    fr: "La transparence consiste à permettre aux parties prenantes de faire des choix éclairés sur leur utilisation d'un système d'IA. Indiquer qu'il s'agit d'une IA, quelles données l'alimentent et quelles sont ses limites, avant que les clients ne décident de l'utiliser, est une pratique de transparence."
  options:
    a:
      en: "Explainability is about understanding and evaluating the outputs of the system, for example why it gave a specific answer, not about informing users before they engage with it."
      fr: "L'explicabilité consiste à comprendre et évaluer les sorties du système, par exemple pourquoi il a donné une réponse précise, pas à informer les utilisateurs avant qu'ils ne l'utilisent."
    b:
      en: "Controllability is about mechanisms that monitor and steer the behavior of the system."
      fr: "La contrôlabilité concerne les mécanismes qui surveillent et orientent le comportement du système."
    c:
      en: "Veracity and robustness is about producing correct outputs, even with unexpected or adversarial inputs."
      fr: "La véracité et la robustesse consistent à produire des sorties correctes, même avec des entrées inattendues ou malveillantes."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
