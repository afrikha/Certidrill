id: aifc01-4a-sel-distillation
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses a large foundation model (FM) on Amazon Bedrock for one narrow, high-volume task: extracting fields from invoices. Model invocation logging is enabled. The company wants a smaller, faster model that uses fewer resources per request while keeping performance close to the large FM for this task.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un grand modèle de fondation (FM) sur Amazon Bedrock pour une seule tâche ciblée à fort volume : extraire des champs de factures. La journalisation des appels de modèles est activée. L'entreprise veut un modèle plus petit et plus rapide, qui consomme moins de ressources par requête, tout en gardant des performances proches de celles du grand FM pour cette tâche.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run continued pre-training of the large FM on a corpus of invoices.", fr: "Effectuer un préentraînement continu du grand FM sur un corpus de factures." } }
    - { id: b, text: { en: "Use Amazon Bedrock Model Distillation with the large FM as the teacher and a smaller FM as the student.", fr: "Utiliser Amazon Bedrock Model Distillation avec le grand FM comme enseignant et un FM plus petit comme élève." } }
    - { id: c, text: { en: "Switch to the next larger version of the FM from the same provider.", fr: "Passer à la version plus grande suivante du FM du même fournisseur." } }
    - { id: d, text: { en: "Increase the maximum output length so that the large FM extracts all fields in one request.", fr: "Augmenter la longueur maximale de sortie pour que le grand FM extraie tous les champs en une seule requête." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Model distillation transfers knowledge from a larger teacher model to a smaller, faster and more cost-efficient student model. Amazon Bedrock generates training data from the teacher, and it can use the teacher responses already captured in invocation logs, so the student performs better on this specific use case."
    fr: "La distillation de modèles transfère les connaissances d'un modèle enseignant plus grand vers un modèle élève plus petit, plus rapide et plus économique. Amazon Bedrock génère des données d'entraînement à partir de l'enseignant et peut utiliser les réponses de l'enseignant déjà enregistrées dans les journaux d'appels : l'élève devient plus performant sur ce cas d'utilisation précis."
  options:
    a:
      en: "Continued pre-training adapts the large FM to a domain but keeps its size, so each request still uses the same resources."
      fr: "Le préentraînement continu adapte le grand FM à un domaine mais conserve sa taille : chaque requête consomme toujours les mêmes ressources."
    c:
      en: "A larger model uses more resources per request, the opposite of the requirement."
      fr: "Un modèle plus grand consomme plus de ressources par requête, à l'inverse de l'exigence."
    d:
      en: "The maximum output length controls how many tokens the model can generate; the model stays as large as before."
      fr: "La longueur maximale de sortie contrôle le nombre de jetons que le modèle peut générer ; le modèle reste aussi grand qu'avant."
references:
  - title: "Customize a model with distillation in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
