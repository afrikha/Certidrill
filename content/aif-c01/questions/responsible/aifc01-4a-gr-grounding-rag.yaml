id: aifc01-4a-gr-grounding-rag
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses Amazon Bedrock Knowledge Bases to answer employee questions from internal HR documents. Some responses add facts that are not in the retrieved documents. The company wants to detect and block these responses.

    Which Amazon Bedrock Guardrails feature will meet this requirement?
  fr: |
    Une entreprise utilise Amazon Bedrock Knowledge Bases pour répondre aux questions des employés à partir de documents RH internes. Certaines réponses ajoutent des faits absents des documents récupérés. L'entreprise veut détecter et bloquer ces réponses.

    Quelle fonctionnalité d'Amazon Bedrock Guardrails répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Content filters set to High strength", fr: "Filtres de contenu avec le niveau High" } }
    - { id: b, text: { en: "A denied topic for HR policies", fr: "Un sujet refusé pour les politiques RH" } }
    - { id: c, text: { en: "Word filters with the profanity list", fr: "Filtres de mots avec la liste de grossièretés" } }
    - { id: d, text: { en: "Contextual grounding checks", fr: "Vérifications de l'ancrage contextuel" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Contextual grounding checks score each response for grounding (is it supported by the source?) and relevance (does it answer the query?). Any new information that is not in the source is ungrounded, and responses that score below the configured threshold are blocked. This fits RAG applications."
    fr: "Les vérifications de l'ancrage contextuel notent chaque réponse sur l'ancrage (est-elle étayée par la source ?) et la pertinence (répond-elle à la question ?). Toute information nouvelle absente de la source est considérée comme non ancrée, et les réponses dont le score est inférieur au seuil configuré sont bloquées. Cela convient aux applications RAG."
  options:
    a:
      en: "Content filters detect harmful categories such as hate, insults, sexual content, violence and misconduct; they do not compare the response with the source documents."
      fr: "Les filtres de contenu détectent des catégories nuisibles comme la haine, les insultes, le contenu sexuel, la violence et les comportements répréhensibles ; ils ne comparent pas la réponse aux documents sources."
    b:
      en: "A denied topic for HR policies would block the questions the application is built to answer."
      fr: "Un sujet refusé pour les politiques RH bloquerait les questions auxquelles l'application est censée répondre."
    c:
      en: "The profanity list blocks profane words; it does not detect unsupported facts."
      fr: "La liste de grossièretés bloque les mots grossiers ; elle ne détecte pas les faits non étayés."
references:
  - title: "Use contextual grounding check to filter hallucinations in responses"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
