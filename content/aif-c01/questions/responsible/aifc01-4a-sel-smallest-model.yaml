id: aifc01-4a-sel-smallest-model
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company needs a foundation model (FM) on Amazon Bedrock to sort short support emails into five categories. During evaluation, several FMs of different sizes meet the accuracy requirement. The company wants to reduce the environmental impact of the solution.

    Which FM should the company choose?
  fr: |
    Une entreprise a besoin d'un modèle de fondation (FM) sur Amazon Bedrock pour classer de courts e-mails de support en cinq catégories. Lors de l'évaluation, plusieurs FM de tailles différentes atteignent l'exactitude exigée. L'entreprise veut réduire l'impact environnemental de la solution.

    Quel FM l'entreprise doit-elle choisir ?
body:
  options:
    - { id: a, text: { en: "The largest FM, because it has the most parameters", fr: "Le plus grand FM, car il compte le plus de paramètres" } }
    - { id: b, text: { en: "The FM with the largest context window", fr: "Le FM qui a la plus grande fenêtre de contexte" } }
    - { id: c, text: { en: "The smallest FM that meets the accuracy requirement", fr: "Le plus petit FM qui atteint l'exactitude exigée" } }
    - { id: d, text: { en: "The FM that supports the most languages", fr: "Le FM qui prend en charge le plus de langues" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A smaller model needs less compute, and therefore less energy, for each request. When several models meet the business requirement, the responsible and sustainable choice is the simplest model that is good enough for the task."
    fr: "Un modèle plus petit nécessite moins de calcul, donc moins d'énergie, pour chaque requête. Lorsque plusieurs modèles répondent à l'exigence métier, le choix responsable et durable est le modèle le plus simple qui suffit pour la tâche."
  options:
    a:
      en: "More parameters mean more compute and energy per request, with no benefit when a smaller model already meets the requirement."
      fr: "Plus de paramètres signifie plus de calcul et d'énergie par requête, sans bénéfice lorsqu'un modèle plus petit répond déjà à l'exigence."
    b:
      en: "Short emails do not need a large context window, and the context window does not reduce the environmental impact."
      fr: "De courts e-mails ne nécessitent pas une grande fenêtre de contexte, et la fenêtre de contexte ne réduit pas l'impact environnemental."
    d:
      en: "The number of supported languages is a selection criterion only when the use case needs it; it does not reduce energy use."
      fr: "Le nombre de langues prises en charge n'est un critère de sélection que si le cas d'utilisation l'exige ; il ne réduit pas la consommation d'énergie."
references:
  - title: "Sustainability pillar – Best practices"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/sustainability-pillar-best-practices-3.html
