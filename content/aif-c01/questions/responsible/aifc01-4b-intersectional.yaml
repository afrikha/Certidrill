id: aifc01-4b-intersectional
objective: "4.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A recruitment company evaluates its candidate screening model. The recall of the model is within the accepted threshold for every gender and for every age group taken one at a time. However, the company receives complaints that qualified women over 50 are rarely shortlisted.

    What should the company do next to detect the bias?
  fr: |
    Une société de recrutement évalue son modèle de présélection des candidats. Le rappel du modèle respecte le seuil accepté pour chaque genre et pour chaque tranche d'âge pris un par un. Pourtant, l'entreprise reçoit des plaintes indiquant que des femmes qualifiées de plus de 50 ans sont rarement présélectionnées.

    Que doit faire l'entreprise ensuite pour détecter le biais ?
body:
  options:
    - { id: a, text: { en: "Measure the demographic parity of the model again for each gender", fr: "Mesurer de nouveau la parité démographique du modèle pour chaque genre" } }
    - { id: b, text: { en: "Measure the overall recall of the model on a larger test dataset", fr: "Mesurer le rappel global du modèle sur un jeu de données de test plus grand" } }
    - { id: c, text: { en: "Measure the recall of the model for groups that combine gender and age", fr: "Mesurer le rappel du modèle pour des groupes qui combinent genre et âge" } }
    - { id: d, text: { en: "Retrain the model on a dataset that has more candidates of every gender", fr: "Réentraîner le modèle sur un jeu de données comptant plus de candidats de chaque genre" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Intersectional analysis applies the same metrics to groups that combine several characteristics, such as women over 50. A bias can be hidden when each attribute is analyzed alone, because the good results of the larger groups mask the result of the smaller combined group."
    fr: "L'analyse intersectionnelle applique les mêmes métriques à des groupes qui combinent plusieurs caractéristiques, comme les femmes de plus de 50 ans. Un biais peut rester caché lorsque chaque attribut est analysé seul, car les bons résultats des groupes plus larges masquent celui du petit groupe combiné."
  options:
    a:
      en: "Demographic parity per gender is still a single-attribute analysis, which is exactly what failed to reveal the problem."
      fr: "La parité démographique par genre reste une analyse sur un seul attribut, celle-là même qui n'a pas révélé le problème."
    b:
      en: "An overall recall, even on more data, mixes every group together and cannot isolate the affected subgroup."
      fr: "Un rappel global, même sur davantage de données, mélange tous les groupes et ne peut pas isoler le sous-groupe concerné."
    d:
      en: "Retraining is a possible mitigation, but it does not detect or measure the bias; the company must first confirm which subgroup is affected."
      fr: "Le réentraînement est une atténuation possible, mais il ne détecte ni ne mesure le biais ; l'entreprise doit d'abord confirmer quel sous-groupe est concerné."
references:
  - title: "RAIRC03-BP02 Measure fairness as unwanted bias across stakeholder groups"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp02.html
