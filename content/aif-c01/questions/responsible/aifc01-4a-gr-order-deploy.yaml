id: aifc01-4a-gr-order-deploy
objective: "4.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company wants to protect its production chatbot on Amazon Bedrock with Amazon Bedrock Guardrails. The application must always use a tested, fixed configuration of the guardrail.

    Which four steps should the company perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise veut protéger son chatbot de production sur Amazon Bedrock avec Amazon Bedrock Guardrails. L'application doit toujours utiliser une configuration du garde-fou testée et figée.

    Quelles sont les quatre étapes que l'entreprise doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: version, text: { en: "Create a version of the guardrail.", fr: "Créer une version du garde-fou." } }
    - { id: finetune, text: { en: "Fine-tune the foundation model with the denied topics of the guardrail.", fr: "Peaufiner le modèle de fondation avec les sujets refusés du garde-fou." } }
    - { id: create, text: { en: "Create the guardrail and configure its policies in the working draft.", fr: "Créer le garde-fou et configurer ses politiques dans le brouillon de travail." } }
    - { id: invoke, text: { en: "Reference the guardrail ID and version number in the Converse API calls of the application.", fr: "Référencer l'ID du garde-fou et le numéro de version dans les appels de l'API Converse de l'application." } }
    - { id: kb, text: { en: "Create a knowledge base to store the guardrail policies.", fr: "Créer une base de connaissances pour stocker les politiques du garde-fou." } }
    - { id: test, text: { en: "Test the guardrail with sample prompts and responses in the test window.", fr: "Tester le garde-fou avec des exemples d'invites et de réponses dans la fenêtre de test." } }
answer:
  sequence: [ create, test, version, invoke ]
explanation:
  correct:
    en: "The policies are configured in the working draft of the guardrail and evaluated in the test window. When the configuration is satisfactory, the company creates a version, which is a snapshot of the guardrail at that point. The application then references the guardrail ID and that version number, so later edits of the draft do not change production."
    fr: "Les politiques sont configurées dans le brouillon de travail du garde-fou et évaluées dans la fenêtre de test. Lorsque la configuration est satisfaisante, l'entreprise crée une version, qui est un instantané du garde-fou à ce moment. L'application référence ensuite l'ID du garde-fou et ce numéro de version : les modifications ultérieures du brouillon ne changent pas la production."
  options:
    finetune:
      en: "A guardrail filters inputs and outputs at inference time; it does not require any change to the model."
      fr: "Un garde-fou filtre les entrées et les sorties au moment de l'inférence ; il n'exige aucune modification du modèle."
    kb:
      en: "Guardrail policies are stored in the guardrail itself; knowledge bases hold documents for RAG."
      fr: "Les politiques d'un garde-fou sont stockées dans le garde-fou lui-même ; les bases de connaissances contiennent des documents pour le RAG."
references:
  - title: "Deploy your guardrail"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-deploy.html
