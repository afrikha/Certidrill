id: aifc01-4a-legal-hallucination-refund
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An airline's generative AI chatbot tells a customer that a refund is available for a canceled trip. The airline has no such refund policy. The customer relies on the answer and files a legal claim when the refund is refused.

    Which risk of generative AI caused this situation?
  fr: |
    Le chatbot d'IA générative d'une compagnie aérienne indique à un client qu'un remboursement est possible pour un voyage annulé. La compagnie n'a aucune politique de remboursement de ce type. Le client se fie à la réponse et engage une action en justice lorsque le remboursement lui est refusé.

    Quel risque de l'IA générative a provoqué cette situation ?
body:
  options:
    - { id: a, text: { en: "Hallucination", fr: "Hallucination" } }
    - { id: b, text: { en: "Intellectual property infringement", fr: "Violation de propriété intellectuelle" } }
    - { id: c, text: { en: "Data poisoning", fr: "Empoisonnement des données" } }
    - { id: d, text: { en: "Underfitting", fr: "Sous-ajustement" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A hallucination is a confident output that is not supported by facts or by the company's sources. When customers rely on hallucinated information, such as a policy that does not exist, the company can face legal claims and a loss of customer trust."
    fr: "Une hallucination est une sortie affirmée avec assurance mais qui n'est étayée ni par les faits ni par les sources de l'entreprise. Lorsque des clients se fient à une information hallucinée, comme une politique qui n'existe pas, l'entreprise peut faire face à des actions en justice et à une perte de confiance des clients."
  options:
    b:
      en: "IP infringement concerns outputs that reproduce protected works, not invented facts."
      fr: "La violation de PI concerne des sorties qui reproduisent des œuvres protégées, pas des faits inventés."
    c:
      en: "Data poisoning is the deliberate manipulation of training data by an attacker; nothing indicates an attack here."
      fr: "L'empoisonnement des données est la manipulation délibérée des données d'entraînement par un attaquant ; rien n'indique une attaque ici."
    d:
      en: "Underfitting describes a model that performs poorly on all data because it is too simple; it does not describe an invented policy."
      fr: "Le sous-ajustement décrit un modèle trop simple, peu performant sur toutes les données ; il ne décrit pas une politique inventée."
references:
  - title: "Use contextual grounding check to filter hallucinations in responses"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
