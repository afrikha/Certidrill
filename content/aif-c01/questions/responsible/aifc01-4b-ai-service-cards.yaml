id: aifc01-4b-ai-service-cards
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company plans to use Amazon Polly in a new product. Before it commits, the company wants information from AWS about the intended use cases and limitations of the service and the responsible AI design choices behind it.

    Which resource should the company review?
  fr: |
    Une entreprise de médias prévoit d'utiliser Amazon Polly dans un nouveau produit. Avant de s'engager, elle veut des informations d'AWS sur les cas d'utilisation prévus et les limites du service, ainsi que sur les choix de conception d'IA responsable qui le sous-tendent.

    Quelle ressource l'entreprise doit-elle consulter ?
body:
  options:
    - { id: a, text: "AWS AI Service Cards" }
    - { id: b, text: "AWS Artifact" }
    - { id: c, text: "Amazon SageMaker Model Cards" }
    - { id: d, text: "AWS Trusted Advisor" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS AI Service Cards are a transparency resource that gives, in a single place, the intended use cases and limitations of an AWS AI service or model, its responsible AI design choices, and best practices to optimize performance. A card is published for Amazon Polly, among other services and models."
    fr: "Les AWS AI Service Cards sont une ressource de transparence qui réunit en un seul endroit les cas d'utilisation prévus et les limites d'un service ou d'un modèle d'IA AWS, ses choix de conception d'IA responsable et les bonnes pratiques pour optimiser ses performances. Une fiche est publiée pour Amazon Polly, parmi d'autres services et modèles."
  options:
    b:
      en: "AWS Artifact provides AWS security and compliance reports and agreements, not the intended uses and limitations of an AI service."
      fr: "AWS Artifact fournit les rapports et accords de sécurité et de conformité d'AWS, et non les utilisations prévues et les limites d'un service d'IA."
    c:
      en: "SageMaker Model Cards document the models that a company builds itself; they do not describe AWS managed AI services."
      fr: "SageMaker Model Cards documente les modèles qu'une entreprise construit elle-même ; il ne décrit pas les services d'IA gérés d'AWS."
    d:
      en: "Trusted Advisor checks an account against best practices; it does not describe the design of AI services."
      fr: "Trusted Advisor compare un compte aux bonnes pratiques ; il ne décrit pas la conception des services d'IA."
references:
  - title: "Responsible AI Tools and Resources"
    url: https://aws.amazon.com/ai/responsible-ai/resources/
  - title: "RAIGT01-BP02 Create a system card that communicates intended usage and limitations"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raigt01-bp02.html
