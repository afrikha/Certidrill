id: aifc01-4b-feedback-thumbs
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company has launched a generative AI assistant that answers customer questions on its website. The company wants customers to be able to flag unhelpful or incorrect answers so that the team can improve the assistant.

    Which solution will meet this requirement?
  fr: |
    Une agence de voyages a lancé sur son site web un assistant d'IA générative qui répond aux questions des clients. L'entreprise veut que les clients puissent signaler les réponses inutiles ou incorrectes afin que l'équipe puisse améliorer l'assistant.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Increase the temperature of the model so that customers get more varied answers", fr: "Augmenter la température du modèle pour que les clients obtiennent des réponses plus variées" } }
    - { id: b, text: { en: "Add more instructions to the system prompt that ask the model to be helpful", fr: "Ajouter à l'invite système des instructions supplémentaires qui demandent au modèle d'être utile" } }
    - { id: c, text: { en: "Add a thumbs up/down control and a comment box to each answer, and review the feedback regularly", fr: "Ajouter à chaque réponse un contrôle pouce levé/baissé et une zone de commentaire, et examiner régulièrement les commentaires" } }
    - { id: d, text: { en: "Hide the assistant's answers from customers until an employee approves each one", fr: "Masquer les réponses de l'assistant aux clients jusqu'à ce qu'un employé approuve chacune d'elles" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A user-feedback mechanism lets people challenge outputs and provide feedback after an interaction, which keeps the system accountable and improvable. The team reviews the feedback and uses it to refine the assistant over time."
    fr: "Un mécanisme de commentaires des utilisateurs permet de contester les sorties et de donner un avis après une interaction, ce qui rend le système responsable et améliorable. L'équipe examine les commentaires et s'en sert pour affiner l'assistant au fil du temps."
  options:
    a:
      en: "A higher temperature makes the answers more random; it gives customers no way to report a problem."
      fr: "Une température plus élevée rend les réponses plus aléatoires ; elle ne donne aux clients aucun moyen de signaler un problème."
    b:
      en: "Changing the system prompt can change the answers, but it does not collect any information from customers."
      fr: "Modifier l'invite système peut changer les réponses, mais ne recueille aucune information auprès des clients."
    d:
      en: "Approving every answer by hand removes the value of the assistant and still does not let customers give feedback."
      fr: "Approuver chaque réponse à la main supprime l'intérêt de l'assistant et ne permet toujours pas aux clients de donner leur avis."
references:
  - title: "RAIUC04-BP01 Map the user journey to identify AI interaction requirements"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raiuc04-bp01.html
