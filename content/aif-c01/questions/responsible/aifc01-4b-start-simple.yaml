id: aifc01-4b-start-simple
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hospital is starting its first ML project to predict patient readmissions. Clinicians must understand the predictions, and the model must reach a minimum level of performance that the hospital has defined.

    Which approach follows AWS recommendations?
  fr: |
    Un hôpital lance son premier projet de ML pour prédire les réadmissions de patients. Les cliniciens doivent comprendre les prédictions, et le modèle doit atteindre un niveau de performance minimal défini par l'hôpital.

    Quelle approche suit les recommandations d'AWS ?
body:
  options:
    - { id: a, text: { en: "Start with the most complex model available, and add explanations only if the regulator asks for them", fr: "Commencer par le modèle le plus complexe disponible, et n'ajouter des explications que si le régulateur les demande" } }
    - { id: b, text: { en: "Start with a foundation model, and ask it to explain each prediction in natural language", fr: "Commencer par un modèle de fondation, et lui demander d'expliquer chaque prédiction en langage naturel" } }
    - { id: c, text: { en: "Start with a complex model, and replace it with a simple model if clinicians complain", fr: "Commencer par un modèle complexe, et le remplacer par un modèle simple si les cliniciens se plaignent" } }
    - { id: d, text: { en: "Start with an interpretable model, and move to a complex model with post hoc analysis only if performance is not sufficient", fr: "Commencer par un modèle interprétable, et passer à un modèle complexe avec une analyse post hoc uniquement si la performance est insuffisante" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS recommends starting with a simple model that is inherently interpretable and provides sufficient performance. If later iterations need better performance, the team increases the model complexity and uses post hoc analysis methods to interpret the results."
    fr: "AWS recommande de commencer par un modèle simple, intrinsèquement interprétable et suffisamment performant. Si des itérations ultérieures nécessitent une meilleure performance, l'équipe augmente la complexité du modèle et utilise des méthodes d'analyse post hoc pour interpréter les résultats."
  options:
    a:
      en: "Clinicians must understand the predictions from the start; adding explanations only on request ignores that requirement."
      fr: "Les cliniciens doivent comprendre les prédictions dès le départ ; n'ajouter des explications qu'à la demande ignore cette exigence."
    b:
      en: "A text explanation generated by a foundation model is not a verified account of how the prediction was made, and an FM is not the starting point for a tabular prediction."
      fr: "Une explication textuelle générée par un modèle de fondation n'est pas un compte rendu vérifié de la façon dont la prédiction a été faite, et un FM n'est pas le point de départ d'une prédiction sur données tabulaires."
    c:
      en: "Starting with a complex model reverses the recommended order and makes interpretability an afterthought."
      fr: "Commencer par un modèle complexe inverse l'ordre recommandé et relègue l'interprétabilité au second plan."
references:
  - title: "Model interpretability"
    url: https://docs.aws.amazon.com/whitepapers/latest/ml-best-practices-healthcare-life-sciences/model-interpretability.html
