id: aifc01-4a-data-rebalance-groups
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company trains a claims model on a dataset with 9,000 records from customers under 40 years old and 1,000 records from customers aged 40 or older. Testing shows a much higher error rate for customers aged 40 or older. The company wants to reduce this gap.

    Which action should the company take FIRST?
  fr: |
    Une compagnie d'assurance entraîne un modèle de sinistres sur un jeu de données contenant 9 000 enregistrements de clients de moins de 40 ans et 1 000 enregistrements de clients de 40 ans ou plus. Les tests montrent un taux d'erreur bien plus élevé pour les clients de 40 ans ou plus. L'entreprise veut réduire cet écart.

    Quelle action l'entreprise doit-elle effectuer EN PREMIER ?
body:
  options:
    - { id: a, text: { en: "Remove the age column from the dataset and retrain the model on the same records.", fr: "Supprimer la colonne d'âge du jeu de données et réentraîner le modèle sur les mêmes enregistrements." } }
    - { id: b, text: { en: "Train the model for more epochs on the same dataset.", fr: "Entraîner le modèle pendant davantage d'époques sur le même jeu de données." } }
    - { id: c, text: { en: "Rebalance the training data by adding records for customers aged 40 or older, or by oversampling them.", fr: "Rééquilibrer les données d'entraînement en ajoutant des enregistrements de clients de 40 ans ou plus, ou en les suréchantillonnant." } }
    - { id: d, text: { en: "Replace the model with a larger model that has more parameters.", fr: "Remplacer le modèle par un modèle plus grand qui compte plus de paramètres." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The dataset has a class imbalance between the two age groups: a model fits the larger group better and can show higher error for the smaller one. When the imbalance is significant, the sample should be rebalanced before training, for example by collecting more records of the underrepresented group or by oversampling it."
    fr: "Le jeu de données présente un déséquilibre entre les deux tranches d'âge : un modèle s'ajuste mieux au groupe le plus nombreux et peut afficher une erreur plus élevée pour le plus petit. Lorsque le déséquilibre est important, l'échantillon doit être rééquilibré avant l'entraînement, par exemple en collectant davantage d'enregistrements du groupe sous-représenté ou en le suréchantillonnant."
  options:
    a:
      en: "Removing the age column does not add examples for the smaller group, so the model still learns mostly from customers under 40; other features can also act as proxies for age."
      fr: "Supprimer la colonne d'âge n'ajoute aucun exemple pour le petit groupe : le modèle apprend toujours surtout des clients de moins de 40 ans, et d'autres variables peuvent servir d'indicateurs indirects de l'âge."
    b:
      en: "More epochs on the same imbalanced data can lead to overfitting and does not add information about the smaller group."
      fr: "Davantage d'époques sur les mêmes données déséquilibrées peuvent entraîner un surajustement et n'apportent aucune information sur le petit groupe."
    d:
      en: "A larger model trained on the same imbalanced data still sees few examples of the smaller group."
      fr: "Un modèle plus grand entraîné sur les mêmes données déséquilibrées voit toujours peu d'exemples du petit groupe."
references:
  - title: "Class Imbalance (CI)"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-bias-metric-class-imbalance.html
