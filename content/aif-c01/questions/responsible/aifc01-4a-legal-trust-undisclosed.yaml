id: aifc01-4a-legal-trust-undisclosed
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer publishes product reviews that a generative AI model wrote, without telling readers. Customers discover this and post complaints on social media, and sales decline.

    Which risk of generative AI did the retailer experience?
  fr: |
    Un commerçant en ligne publie des avis sur des produits rédigés par un modèle d'IA générative, sans en informer les lecteurs. Les clients le découvrent et publient des plaintes sur les réseaux sociaux, et les ventes baissent.

    Quel risque de l'IA générative le commerçant a-t-il subi ?
body:
  options:
    - { id: a, text: { en: "Model overfitting", fr: "Surajustement du modèle" } }
    - { id: b, text: { en: "Prompt injection", fr: "Injection d'invite" } }
    - { id: c, text: { en: "Intellectual property infringement", fr: "Violation de propriété intellectuelle" } }
    - { id: d, text: { en: "Loss of customer trust", fr: "Perte de confiance des clients" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Customers lost trust in the retailer because AI-generated content was presented as genuine reviews. Loss of customer trust is a business and legal risk of generative AI; transparency about the use of AI helps prevent it."
    fr: "Les clients ont perdu confiance dans le commerçant, car du contenu généré par l'IA était présenté comme de vrais avis. La perte de confiance des clients est un risque commercial et juridique de l'IA générative ; la transparence sur l'usage de l'IA aide à l'éviter."
  options:
    a:
      en: "Overfitting is a model training problem; it does not describe the customers' reaction."
      fr: "Le surajustement est un problème d'entraînement de modèle ; il ne décrit pas la réaction des clients."
    b:
      en: "Prompt injection is an attack on the instructions of an application; no attack took place."
      fr: "L'injection d'invite est une attaque contre les instructions d'une application ; aucune attaque n'a eu lieu."
    c:
      en: "Nothing indicates that the reviews reproduce protected works."
      fr: "Rien n'indique que les avis reproduisent des œuvres protégées."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
