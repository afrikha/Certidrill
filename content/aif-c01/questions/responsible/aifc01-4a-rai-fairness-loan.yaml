id: aifc01-4a-rai-fairness-loan
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank uses an ML model to approve personal loans. An internal review finds that applicants with similar incomes and credit histories are approved at very different rates depending on their gender.

    Which dimension of responsible AI does this finding concern?
  fr: |
    Une banque utilise un modèle de ML pour approuver des prêts personnels. Un audit interne constate que des demandeurs aux revenus et aux historiques de crédit similaires sont approuvés à des taux très différents selon leur genre.

    Quelle dimension de l'IA responsable ce constat concerne-t-il ?
body:
  options:
    - { id: a, text: { en: "Fairness", fr: "Équité" } }
    - { id: b, text: { en: "Explainability", fr: "Explicabilité" } }
    - { id: c, text: { en: "Safety", fr: "Sûreté" } }
    - { id: d, text: { en: "Governance", fr: "Gouvernance" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Fairness means considering the impacts of the system on different groups of stakeholders. Different approval rates for comparable applicants of different genders show an unwanted bias against a group, which is a fairness issue."
    fr: "L'équité consiste à prendre en compte les impacts du système sur les différents groupes de parties prenantes. Des taux d'approbation différents pour des demandeurs comparables de genres différents révèlent un biais indésirable envers un groupe : c'est un problème d'équité."
  options:
    b:
      en: "Explainability is about understanding why the model produced an output. It can help investigate the problem, but the finding itself is unequal treatment of groups."
      fr: "L'explicabilité consiste à comprendre pourquoi le modèle a produit une sortie. Elle peut aider à analyser le problème, mais le constat lui-même est un traitement inégal des groupes."
    c:
      en: "Safety is about reducing harmful system output and misuse, such as toxic content or dangerous instructions."
      fr: "La sûreté consiste à réduire les sorties nuisibles et les usages abusifs, comme le contenu toxique ou les instructions dangereuses."
    d:
      en: "Governance is about incorporating best practices across the AI supply chain; it is not the dimension that describes unequal outcomes between groups."
      fr: "La gouvernance consiste à intégrer les bonnes pratiques dans toute la chaîne d'approvisionnement de l'IA ; ce n'est pas la dimension qui décrit des résultats inégaux entre groupes."
references:
  - title: "Responsible AI - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/responsible-ai.html
  - title: "RAIRC03-BP02 Measure fairness as unwanted bias across stakeholder groups"
    url: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp02.html
