id: aifc01-3b-pc-delimiters
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A law firm asks a foundation model to list the termination clauses of contracts. The prompt contains the instructions followed by the full contract text. The model sometimes treats sentences of the contract as instructions to follow.

    Which prompt change will reduce this problem?
  fr: |
    Un cabinet d'avocats demande à un modèle de fondation de lister les clauses de résiliation de contrats. L'invite contient les instructions suivies du texte complet du contrat. Le modèle traite parfois des phrases du contrat comme des instructions à suivre.

    Quelle modification de l'invite réduira ce problème ?
body:
  options:
    - { id: a, text: { en: "Add an instruction that asks the model to think step by step before answering", fr: "Ajouter une instruction qui demande au modèle de réfléchir étape par étape avant de répondre" } }
    - { id: b, text: { en: "Enclose the contract in labeled delimiters and state that it is data to analyze", fr: "Encadrer le contrat par des délimiteurs nommés et préciser qu'il s'agit de données à analyser" } }
    - { id: c, text: { en: "Increase the maximum length so that the model reads the whole contract", fr: "Augmenter la longueur maximale pour que le modèle lise tout le contrat" } }
    - { id: d, text: { en: "Raise the temperature so that the model interprets the text more freely", fr: "Augmenter la température pour que le modèle interprète le texte plus librement" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Delimiters such as labeled sections or tags separate the parts of a prompt, so the model can tell the instructions from the input data. Clear sectioning reduces ambiguity and improves accuracy."
    fr: "Les délimiteurs, comme des sections nommées ou des balises, séparent les parties d'une invite pour que le modèle distingue les instructions des données d'entrée. Un découpage clair réduit l'ambiguïté et améliore l'exactitude."
  options:
    a:
      en: "Chain-of-thought helps with multi-step reasoning, but it does not mark which text is data and which text is an instruction."
      fr: "La chaîne de pensée aide au raisonnement en plusieurs étapes, mais elle n'indique pas quel texte est une donnée et quel texte est une instruction."
    c:
      en: "Maximum length limits the generated response, not the amount of input the model reads."
      fr: "La longueur maximale limite la réponse générée, pas la quantité d'entrée que lit le modèle."
    d:
      en: "A higher temperature makes the output more random, which does not help the model separate data from instructions."
      fr: "Une température plus élevée rend la sortie plus aléatoire, ce qui n'aide pas le modèle à séparer les données des instructions."
references:
  - title: Creating precise prompts
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-precision.html
