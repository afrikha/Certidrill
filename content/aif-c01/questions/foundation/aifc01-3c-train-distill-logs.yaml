id: aifc01-3c-train-distill-logs
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has enabled model invocation logging in Amazon Bedrock for an application that uses a large model. The logs in Amazon S3 contain several months of prompts and responses. The company wants Amazon Bedrock Model Distillation to reuse these logged responses instead of generating new teacher responses.

    Which condition must the distillation job meet?
  fr: |
    Une entreprise a activé la journalisation des appels de modèle dans Amazon Bedrock pour une application qui utilise un grand modèle. Les journaux stockés dans Amazon S3 contiennent plusieurs mois d'invites et de réponses. L'entreprise veut qu'Amazon Bedrock Model Distillation réutilise ces réponses journalisées au lieu de générer de nouvelles réponses du modèle enseignant.

    Quelle condition la tâche de distillation doit-elle respecter ?
body:
  options:
    - { id: a, text: { en: "The teacher model of the job must be the model that produced the logged responses.", fr: "Le modèle enseignant de la tâche doit être le modèle qui a produit les réponses journalisées." } }
    - { id: b, text: { en: "Each logged prompt must have a human-written label added before the job starts.", fr: "Chaque invite journalisée doit recevoir une étiquette rédigée par un humain avant le début de la tâche." } }
    - { id: c, text: { en: "The student model of the job must be larger than the model in the logs.", fr: "Le modèle élève de la tâche doit être plus grand que le modèle présent dans les journaux." } }
    - { id: d, text: { en: "The logs must be converted to unlabeled text files for continued pre-training.", fr: "Les journaux doivent être convertis en fichiers texte non étiquetés pour le préentraînement continu." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Model Distillation can use prompt-response pairs from invocation logs as existing teacher responses. The teacher model specified in the job must match the model in the invocation logs; otherwise the logs are not used. Request metadata added to the original calls can filter the logs to the relevant use case."
    fr: "Model Distillation peut utiliser les paires invite-réponse des journaux d'appels comme réponses existantes du modèle enseignant. Le modèle enseignant indiqué dans la tâche doit correspondre au modèle présent dans les journaux d'appels ; sinon, les journaux ne sont pas utilisés. Des métadonnées de requête ajoutées aux appels d'origine permettent de filtrer les journaux sur le cas d'usage concerné."
  options:
    b:
      en: "Labeled prompt-response pairs are optional for distillation; the logged teacher responses already serve as the training targets."
      fr: "Les paires invite-réponse étiquetées sont facultatives pour la distillation ; les réponses journalisées de l'enseignant servent déjà de cibles d'entraînement."
    c:
      en: "Distillation goes the other way: the student is a smaller, faster model that learns from a larger teacher."
      fr: "La distillation va dans l'autre sens : l'élève est un modèle plus petit et plus rapide qui apprend d'un enseignant plus grand."
    d:
      en: "Continued pre-training is a different customization method; distillation reads the prompt-response pairs from the logs."
      fr: "Le préentraînement continu est une autre méthode de personnalisation ; la distillation lit les paires invite-réponse dans les journaux."
references:
  - title: Customize a model with distillation in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
