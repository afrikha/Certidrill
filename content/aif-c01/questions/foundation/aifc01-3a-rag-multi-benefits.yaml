id: aifc01-3a-rag-multi-benefits
objective: "3.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is comparing Retrieval Augmented Generation (RAG) with fine-tuning for an assistant that answers questions about its internal documents.

    Which two benefits does RAG provide? (Choose two.)
  fr: |
    Une entreprise compare la génération à enrichissement contextuel (RAG) et le réglage précis pour un assistant qui répond aux questions sur ses documents internes.

    Quels sont les deux avantages qu'offre le RAG ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The model permanently learns the writing style of the company.", fr: "Le modèle apprend définitivement le style rédactionnel de l'entreprise." } }
    - { id: b, text: { en: "Each request uses fewer input tokens because no context is added to the prompt.", fr: "Chaque requête utilise moins de jetons d'entrée, car aucun contexte n'est ajouté à l'invite." } }
    - { id: c, text: { en: "New or updated documents can be used without retraining the model.", fr: "Les documents nouveaux ou mis à jour peuvent être utilisés sans réentraîner le modèle." } }
    - { id: d, text: { en: "The solution does not need an embeddings model or a vector store.", fr: "La solution n'a besoin ni d'un modèle d'intégration ni d'un magasin de vecteurs." } }
    - { id: e, text: { en: "Answers can include references to the source documents.", fr: "Les réponses peuvent inclure des références aux documents sources." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "RAG retrieves information from the documents at query time, so new or updated documents can be used within minutes of ingestion, without training. Because the answer is based on retrieved passages, the response can cite its sources, which lets users verify it and reduces the risk of hallucination; fine-tuned models do not provide source references."
    fr: "Le RAG récupère les informations dans les documents au moment de la requête : les documents nouveaux ou mis à jour peuvent donc être utilisés quelques minutes après leur ingestion, sans entraînement. Comme la réponse repose sur des passages récupérés, elle peut citer ses sources, ce qui permet aux utilisateurs de la vérifier et réduit le risque d'hallucination ; les modèles peaufinés ne fournissent pas de références aux sources."
  options:
    a:
      en: "Teaching the model a writing style changes its weights, which is what fine-tuning does; RAG leaves the model unchanged."
      fr: "Apprendre un style rédactionnel au modèle modifie ses pondérations, ce que fait le réglage précis ; le RAG ne modifie pas le modèle."
    b:
      en: "RAG adds the retrieved passages to the prompt, so each request uses more input tokens, not fewer."
      fr: "Le RAG ajoute les passages récupérés à l'invite : chaque requête utilise donc plus de jetons d'entrée, pas moins."
    d:
      en: "A typical RAG solution embeds the documents with an embeddings model and stores the vectors in a vector store for similarity search."
      fr: "Une solution RAG classique vectorise les documents avec un modèle d'intégration et stocke les vecteurs dans un magasin de vecteurs pour la recherche par similarité."
references:
  - title: Comparing Retrieval Augmented Generation and fine-tuning
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-vs-fine-tuning.html
