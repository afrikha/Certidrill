id: aifc01-3c-pm-rollback
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company manages a prompt in Amazon Bedrock Prompt Management. The prompt has versions 1, 2, and 3. The production application invokes version 3. Users report that answers became worse after the release of version 3. The company must restore the previous behavior as quickly as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise gère une invite dans Amazon Bedrock Prompt Management. L'invite possède les versions 1, 2 et 3. L'application de production appelle la version 3. Les utilisateurs signalent que les réponses se sont dégradées depuis la mise en service de la version 3. L'entreprise doit rétablir le comportement précédent le plus rapidement possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Edit the prompt draft to undo the changes and save it.", fr: "Modifier le brouillon de l'invite pour annuler les changements, puis l'enregistrer." } }
    - { id: b, text: { en: "Delete version 3 so that the application falls back to version 2.", fr: "Supprimer la version 3 pour que l'application revienne à la version 2." } }
    - { id: c, text: { en: "Add a guardrail to the application to block the lower-quality answers.", fr: "Ajouter une barrière de protection (guardrail) à l'application pour bloquer les réponses de moindre qualité." } }
    - { id: d, text: { en: "Change the application to invoke the ARN of version 2 of the prompt.", fr: "Modifier l'application pour qu'elle appelle l'ARN de la version 2 de l'invite." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Versions let you switch between prompt configurations and update the application with the most appropriate one. Version 2 is a snapshot of the configuration that worked, so pointing the application to its ARN restores the previous behavior immediately."
    fr: "Les versions permettent de basculer entre des configurations d'invite et de mettre à jour l'application avec la plus appropriée. La version 2 est un instantané de la configuration qui fonctionnait : faire pointer l'application vers son ARN rétablit immédiatement le comportement précédent."
  options:
    a:
      en: "Saving the draft does not change version 3, which production still invokes; the team would also have to rebuild the old configuration by hand."
      fr: "Enregistrer le brouillon ne modifie pas la version 3, que la production appelle toujours ; l'équipe devrait en outre reconstruire l'ancienne configuration à la main."
    b:
      en: "Deleting a version does not redirect callers to another version; resources that use a deleted prompt can get runtime errors."
      fr: "Supprimer une version ne redirige pas les appelants vers une autre version ; les ressources qui utilisent une invite supprimée peuvent subir des erreurs d'exécution."
    c:
      en: "Guardrails filter harmful or unwanted content; they cannot judge or restore the quality of the previous prompt configuration."
      fr: "Les barrières de protection filtrent le contenu nuisible ou indésirable ; elles ne peuvent ni juger ni rétablir la qualité de la configuration d'invite précédente."
references:
  - title: Deploy a prompt to your application using versions in Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html
  - title: Delete a prompt in Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-delete.html
