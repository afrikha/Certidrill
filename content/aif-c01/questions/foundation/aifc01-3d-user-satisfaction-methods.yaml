id: aifc01-3d-user-satisfaction-methods
objective: "3.4.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A hotel chain wants to measure user satisfaction with its generative AI booking assistant, based on data that comes directly from the guests.

    Which two methods will meet this requirement? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    Une chaîne hôtelière veut mesurer la satisfaction des utilisateurs de son assistant de réservation d'IA générative, à partir de données qui viennent directement des clients.

    Quelles sont les deux méthodes qui répondent à cette exigence ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Track the InputTokenCount metric in Amazon CloudWatch.", fr: "Suivre la métrique InputTokenCount dans Amazon CloudWatch." } }
    - { id: b, text: { en: "Add thumbs-up and thumbs-down buttons to each response.", fr: "Ajouter des boutons pouce levé et pouce baissé à chaque réponse." } }
    - { id: c, text: { en: "Compute the BERTScore of the responses against reference answers.", fr: "Calculer le BERTScore des réponses par rapport à des réponses de référence." } }
    - { id: d, text: { en: "Run the Goal success rate evaluator on the conversation sessions.", fr: "Exécuter l'évaluateur Goal success rate sur les sessions de conversation." } }
    - { id: e, text: { en: "Send a short satisfaction survey after each conversation.", fr: "Envoyer un court questionnaire de satisfaction après chaque conversation." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "User satisfaction is measured from ratings that users give: thumbs-up and thumbs-down ratings on responses and a post-conversation satisfaction survey both collect the guests' own opinion of the assistant."
    fr: "La satisfaction des utilisateurs se mesure à partir des notes que donnent les utilisateurs : les évaluations pouce levé et pouce baissé sur les réponses et un questionnaire de satisfaction après la conversation recueillent tous deux l'avis des clients eux-mêmes sur l'assistant."
  options:
    a:
      en: "Input token counts measure usage and cost, not satisfaction."
      fr: "Le nombre de jetons d'entrée mesure l'utilisation et le coût, pas la satisfaction."
    c:
      en: "BERTScore is a technical similarity metric computed without the users."
      fr: "BERTScore est une métrique technique de similarité calculée sans les utilisateurs."
    d:
      en: "Goal success rate is an LLM-as-a-judge evaluator; its score comes from a model, not from the guests."
      fr: "Goal success rate est un évaluateur LLM-as-a-judge ; son score vient d'un modèle, pas des clients."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
