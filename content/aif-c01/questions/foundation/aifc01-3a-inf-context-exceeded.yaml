id: aifc01-3a-inf-context-exceeded
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company sends complete call transcripts to a foundation model (FM) for summarization. For the longest calls, the prompt is larger than the context window of the model.

    What should the company do?
  fr: |
    Une entreprise envoie des transcriptions d'appels complètes à un modèle de fondation (FM) pour les résumer. Pour les appels les plus longs, l'invite est plus grande que la fenêtre de contexte du modèle.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Increase the maxTokens value so that the model accepts the larger prompt.", fr: "Augmenter la valeur de maxTokens pour que le modèle accepte l'invite plus grande." } }
    - { id: b, text: { en: "Shorten or split the transcripts, or choose a model that has a larger context window.", fr: "Raccourcir ou découper les transcriptions, ou choisir un modèle qui a une plus grande fenêtre de contexte." } }
    - { id: c, text: { en: "Lower the temperature so that the model reads fewer tokens of the prompt.", fr: "Baisser la température pour que le modèle lise moins de jetons de l'invite." } }
    - { id: d, text: { en: "Add a stop sequence so that the model stops reading the prompt at the limit.", fr: "Ajouter une séquence d'arrêt pour que le modèle arrête de lire l'invite à la limite." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The context window is the maximum number of tokens that the model can process in a request, and inference parameters cannot raise it. The input must fit: the company can send shorter or split transcripts (for example, summarize each part and then combine the summaries), or select a model with a larger context window."
    fr: "La fenêtre de contexte est le nombre maximal de jetons que le modèle peut traiter dans une requête, et aucun paramètre d'inférence ne permet de l'augmenter. L'entrée doit tenir dans cette fenêtre : l'entreprise peut envoyer des transcriptions plus courtes ou découpées (par exemple, résumer chaque partie puis combiner les résumés), ou sélectionner un modèle à plus grande fenêtre de contexte."
  options:
    a:
      en: "maxTokens limits the number of tokens in the generated response; it does not let the model accept a longer input."
      fr: "maxTokens limite le nombre de jetons de la réponse générée ; il ne permet pas au modèle d'accepter une entrée plus longue."
    c:
      en: "Temperature only changes how the next token is chosen; the whole prompt is still processed."
      fr: "La température ne change que la façon dont le jeton suivant est choisi ; toute l'invite est toujours traitée."
    d:
      en: "Stop sequences apply to the generated output, not to the prompt that the model receives."
      fr: "Les séquences d'arrêt s'appliquent à la sortie générée, pas à l'invite que reçoit le modèle."
references:
  - title: InferenceConfiguration
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InferenceConfiguration.html
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
