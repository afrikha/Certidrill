id: aifc01-3c-pm-invoke-arn
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores a prompt in Amazon Bedrock Prompt Management. Version 4 of the prompt defines the system prompt, the messages, the inference parameters, and two variables. An application calls the Converse API with the ARN of version 4 as the model ID.

    What must the application send in each request?
  fr: |
    Une entreprise stocke une invite dans Amazon Bedrock Prompt Management. La version 4 de l'invite définit l'invite système, les messages, les paramètres d'inférence et deux variables. Une application appelle l'API Converse avec l'ARN de la version 4 comme ID de modèle.

    Que doit envoyer l'application dans chaque requête ?
body:
  options:
    - { id: a, text: { en: "The system prompt and all the messages, because the stored version only keeps the variables.", fr: "L'invite système et tous les messages, car la version stockée ne conserve que les variables." } }
    - { id: b, text: { en: "The values of the two variables in promptVariables, and nothing that the version already defines.", fr: "Les valeurs des deux variables dans promptVariables, et rien de ce que la version définit déjà." } }
    - { id: c, text: { en: "An inferenceConfig block, because inference parameters cannot be stored in a prompt version.", fr: "Un bloc inferenceConfig, car les paramètres d'inférence ne peuvent pas être stockés dans une version d'invite." } }
    - { id: d, text: { en: "An UpdatePrompt call before each request to write the variable values into version 4.", fr: "Un appel UpdatePrompt avant chaque requête pour écrire les valeurs des variables dans la version 4." } }
answer: { optionId: b }
explanation:
  correct:
    en: "When the prompt ARN with its version is the model ID, the stored prompt supplies the messages, system prompt and inference configuration. The application only passes the values of the prompt's variables in promptVariables. With Converse, fields such as inferenceConfig, system and toolConfig cannot be included, and extra messages would be appended after the stored ones."
    fr: "Quand l'ARN de l'invite avec sa version sert d'ID de modèle, l'invite stockée fournit les messages, l'invite système et la configuration d'inférence. L'application transmet seulement les valeurs des variables de l'invite dans promptVariables. Avec Converse, des champs comme inferenceConfig, system et toolConfig ne peuvent pas être inclus, et des messages supplémentaires seraient ajoutés après ceux qui sont stockés."
  options:
    a:
      en: "The version stores the messages and the system prompt; the request must not include system, and extra messages would be appended after the stored ones."
      fr: "La version stocke les messages et l'invite système ; la requête ne doit pas inclure system, et des messages supplémentaires seraient ajoutés après ceux qui sont stockés."
    c:
      en: "Inference parameters such as temperature and maxTokens are part of the stored prompt, and inferenceConfig is not allowed in such a Converse request."
      fr: "Les paramètres d'inférence comme temperature et maxTokens font partie de l'invite stockée, et inferenceConfig n'est pas autorisé dans une telle requête Converse."
    d:
      en: "UpdatePrompt modifies the DRAFT, not version 4, and variable values are supplied at runtime instead of being saved in the prompt."
      fr: "UpdatePrompt modifie le brouillon (DRAFT), pas la version 4, et les valeurs des variables sont fournies à l'exécution au lieu d'être enregistrées dans l'invite."
references:
  - title: Test a prompt using Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-test.html
