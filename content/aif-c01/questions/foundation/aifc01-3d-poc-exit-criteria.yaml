id: aifc01-3d-poc-exit-criteria
objective: "3.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Before a proof of concept (PoC), a marketing company set these exit criteria for an FM that drafts articles: an expert quality rating of at least 4 out of 5, a p90 latency under 5 seconds, and a cost of at most USD 0.05 per draft. The PoC results are a rating of 4.3, a p90 latency of 3 seconds, and a cost of USD 0.18 per draft.

    What should the company do?
  fr: |
    Avant une preuve de concept (PoC), une agence marketing a fixé ces critères de sortie pour un FM qui rédige des articles : une note de qualité des experts d'au moins 4 sur 5, une latence p90 inférieure à 5 secondes et un coût d'au plus 0,05 USD par brouillon. Les résultats de la PoC sont une note de 4,3, une latence p90 de 3 secondes et un coût de 0,18 USD par brouillon.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Treat the PoC as failing its criteria, and then pivot to a cheaper design or stop the project.", fr: "Considérer que la PoC ne remplit pas ses critères, puis passer à une conception moins coûteuse ou arrêter le projet." } }
    - { id: b, text: { en: "Move to production, because the quality and latency criteria are met.", fr: "Passer en production, car les critères de qualité et de latence sont remplis." } }
    - { id: c, text: { en: "Raise the cost threshold to USD 0.20 per draft so that the PoC meets every criterion.", fr: "Relever le seuil de coût à 0,20 USD par brouillon pour que la PoC remplisse tous les critères." } }
    - { id: d, text: { en: "Move to production, and then measure the cost per draft again after one year.", fr: "Passer en production, puis mesurer de nouveau le coût par brouillon au bout d'un an." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Exit criteria are defined up front so that the decision is data-driven: if results miss a threshold, the team pivots or stops to avoid sunk costs. Unit economics decide whether the application is viable at scale, so missing the cost criterion by more than three times means that the FM does not meet the business objective yet; the results then update the business case."
    fr: "Les critères de sortie sont fixés dès le départ pour que la décision repose sur les données : si un seuil n'est pas atteint, l'équipe change d'approche ou arrête pour éviter les coûts irrécupérables. L'économie unitaire décide de la viabilité de l'application à grande échelle : manquer le critère de coût d'un facteur supérieur à trois signifie que le FM ne répond pas encore à l'objectif métier ; les résultats servent ensuite à mettre à jour l'analyse de rentabilité."
  options:
    b:
      en: "All exit criteria count; at more than three times the target cost per draft, the solution is not financially viable at scale."
      fr: "Tous les critères de sortie comptent ; à plus de trois fois le coût visé par brouillon, la solution n'est pas viable financièrement à grande échelle."
    c:
      en: "Moving the threshold after seeing the results defeats the purpose of exit criteria set up front."
      fr: "Déplacer le seuil après avoir vu les résultats annule l'intérêt de critères de sortie fixés dès le départ."
    d:
      en: "Going to production with a known cost problem is the sunk-cost decision that exit criteria are meant to prevent."
      fr: "Passer en production avec un problème de coût connu est précisément la décision dictée par les coûts engagés que les critères de sortie doivent empêcher."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
