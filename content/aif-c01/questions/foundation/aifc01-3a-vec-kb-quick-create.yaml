id: aifc01-3a-vec-kb-quick-create
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is creating its first Amazon Bedrock knowledge base. The company does not have a vector database yet and wants to set one up with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise crée sa première base de connaissances Amazon Bedrock. Elle ne dispose pas encore de base de données vectorielle et veut en mettre une en place avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Install an open-source vector database on Amazon EC2 instances, and connect it to the knowledge base.", fr: "Installer une base de données vectorielle open source sur des instances Amazon EC2, et la connecter à la base de connaissances." } }
    - { id: b, text: { en: "Create an Amazon OpenSearch Service domain, and define the index and its fields manually.", fr: "Créer un domaine Amazon OpenSearch Service, et définir manuellement l'index et ses champs." } }
    - { id: c, text: { en: "Choose the quick create option so that Amazon Bedrock creates and configures the vector store.", fr: "Choisir l'option de création rapide pour qu'Amazon Bedrock crée et configure le magasin de vecteurs." } }
    - { id: d, text: { en: "Save the embeddings as JSON files in the S3 bucket that holds the source documents.", fr: "Enregistrer les intégrations sous forme de fichiers JSON dans le compartiment S3 qui contient les documents sources." } }
answer: { optionId: c }
explanation:
  correct:
    en: "When it creates a knowledge base, Amazon Bedrock can quick create a vector store for the company, for example an Amazon OpenSearch Serverless vector search collection and index, an Aurora PostgreSQL Serverless vector store, a Neptune Analytics graph, or an S3 vector bucket and index. Bedrock configures the required fields and metadata placement, so the company manages no database setup."
    fr: "Quand il crée une base de connaissances, Amazon Bedrock peut créer rapidement un magasin de vecteurs pour l'entreprise, par exemple une collection et un index de recherche vectorielle Amazon OpenSearch Serverless, un magasin de vecteurs Aurora PostgreSQL Serverless, un graphe Neptune Analytics, ou un compartiment et un index de vecteurs S3. Bedrock configure les champs requis et l'emplacement des métadonnées : l'entreprise n'a donc aucune configuration de base de données à gérer."
  options:
    a:
      en: "A self-managed database on EC2 must be installed, patched, and scaled by the company, which is the most operational overhead."
      fr: "Une base de données autogérée sur EC2 doit être installée, corrigée et mise à l'échelle par l'entreprise, ce qui représente le plus de charge opérationnelle."
    b:
      en: "An OpenSearch Service managed cluster can be used, but the company must create the domain, permissions, and index fields itself, which is more work than quick create."
      fr: "Un cluster géré OpenSearch Service peut être utilisé, mais l'entreprise doit créer elle-même le domaine, les autorisations et les champs de l'index, ce qui demande plus de travail que la création rapide."
    d:
      en: "JSON files in a general purpose S3 bucket are not a vector index and cannot answer similarity searches."
      fr: "Des fichiers JSON dans un compartiment S3 à usage général ne forment pas un index vectoriel et ne permettent pas de recherches de similarité."
references:
  - title: Create a knowledge base by connecting to a data source in Amazon Bedrock Knowledge Bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-create.html
