id: aifc01-3c-pm-dd-concepts
objective: "3.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A team is learning the concepts of Amazon Bedrock Prompt Management.

    Select the correct concept from the following list for each description. Each concept should be selected one time or not at all.
  fr: |
    Une équipe découvre les concepts d'Amazon Bedrock Prompt Management.

    Sélectionnez le concept correct dans la liste suivante pour chaque description. Chaque concept doit être sélectionné une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: var, text: { en: "Variable", fr: "Variable" } }
    - { id: variant, text: { en: "Prompt variant", fr: "Variante d'invite" } }
    - { id: version, text: { en: "Numbered version", fr: "Version numérotée" } }
    - { id: draft, text: { en: "DRAFT", fr: "Brouillon (DRAFT)" } }
    - { id: node, text: { en: "Knowledge base node", fr: "Nœud de base de connaissances" } }
  targets:
    - id: t1
      text: { en: "A placeholder whose value is supplied when the prompt is tested or invoked", fr: "Un espace réservé dont la valeur est fournie quand l'invite est testée ou appelée" }
    - id: t2
      text: { en: "An alternative message, model, or inference configuration compared during testing", fr: "Un autre message, modèle ou configuration d'inférence comparé pendant les tests" }
    - id: t3
      text: { en: "A point-in-time snapshot that an application references for production", fr: "Un instantané à un instant donné qu'une application référence pour la production" }
    - id: t4
      text: { en: "The working copy that is updated each time the prompt is saved", fr: "La copie de travail mise à jour chaque fois que l'invite est enregistrée" }
answer:
  mapping: { t1: var, t2: variant, t3: version, t4: draft }
explanation:
  correct:
    en: "A variable, written in double curly braces, is filled in at test time or at runtime. A prompt variant is an alternative configuration that you compare with others. Saving a prompt updates its DRAFT, and a numbered version is a snapshot of that draft that applications reference for production. A knowledge base node belongs to Amazon Bedrock Flows and queries a knowledge base; it is not a Prompt Management concept."
    fr: "Une variable, écrite entre doubles accolades, est renseignée au moment du test ou à l'exécution. Une variante d'invite est une autre configuration que vous comparez avec d'autres. Enregistrer une invite met à jour son brouillon (DRAFT), et une version numérotée est un instantané de ce brouillon que les applications référencent pour la production. Un nœud de base de connaissances appartient à Amazon Bedrock Flows et interroge une base de connaissances ; ce n'est pas un concept de Prompt Management."
references:
  - title: Construct and store reusable prompts with Prompt management in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
  - title: Deploy a prompt to your application using versions in Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html
