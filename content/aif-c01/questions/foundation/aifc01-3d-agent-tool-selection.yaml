id: aifc01-3d-agent-tool-selection
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company's AI agent has three tools: one checks the status of an order, one processes refunds, and one updates the delivery address. Traces show that the agent sometimes calls the refund tool when the customer only asked for the status of an order. The company uses Amazon Bedrock AgentCore Evaluations.

    Which built-in evaluator measures this problem?
  fr: |
    L'agent d'IA d'une enseigne de distribution dispose de trois outils : l'un vérifie l'état d'une commande, un autre traite les remboursements et le dernier met à jour l'adresse de livraison. Les traces montrent que l'agent appelle parfois l'outil de remboursement alors que le client a seulement demandé l'état d'une commande. L'entreprise utilise Amazon Bedrock AgentCore Evaluations.

    Quel évaluateur intégré mesure ce problème ?
body:
  options:
    - { id: a, text: "Tool selection accuracy" }
    - { id: b, text: "Tool parameter accuracy" }
    - { id: c, text: "Goal success rate" }
    - { id: d, text: "Instruction following" }
answer: { optionId: a }
explanation:
  correct:
    en: "Tool selection accuracy is evaluated at the tool call level: it determines whether the agent chose the appropriate tool, and whether that call was justified at that point in the conversation. Calling the refund tool for a status request is a wrong tool choice."
    fr: "Tool selection accuracy s'évalue au niveau de l'appel d'outil : il détermine si l'agent a choisi l'outil approprié et si cet appel était justifié à ce moment de la conversation. Appeler l'outil de remboursement pour une demande d'état est un mauvais choix d'outil."
  options:
    b:
      en: "Tool parameter accuracy checks whether the parameters of a tool call come from the conversation context; here the problem is the tool itself."
      fr: "Tool parameter accuracy vérifie si les paramètres d'un appel d'outil proviennent du contexte de la conversation ; ici, le problème est l'outil lui-même."
    c:
      en: "Goal success rate judges whether the session achieved the user's goals; it does not identify which tool call was wrong."
      fr: "Goal success rate juge si la session a atteint les objectifs de l'utilisateur ; il n'identifie pas l'appel d'outil erroné."
    d:
      en: "Instruction following is a trace-level evaluator that checks whether a response follows the explicit instructions of the user's input."
      fr: "Instruction following est un évaluateur de niveau trace qui vérifie si une réponse respecte les consignes explicites de l'entrée de l'utilisateur."
references:
  - title: Prompt templates
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/prompt-templates-builtin.html
