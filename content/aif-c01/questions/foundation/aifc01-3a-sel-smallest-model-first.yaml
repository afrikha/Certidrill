id: aifc01-3a-sel-smallest-model-first
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has defined the minimum quality that its text summarization application needs. Several models of different sizes from the same model family meet the functional requirements. The company wants the lowest inference cost that still meets the quality bar.

    Which approach should the company take?
  fr: |
    Une entreprise a défini la qualité minimale dont son application de résumé de texte a besoin. Plusieurs modèles de tailles différentes d'une même famille de modèles répondent aux exigences fonctionnelles. L'entreprise veut le coût d'inférence le plus faible qui atteint encore le niveau de qualité requis.

    Quelle approche l'entreprise doit-elle adopter ?
body:
  options:
    - { id: a, text: { en: "Select the largest model of the family, and switch to a smaller model only if users report slow responses.", fr: "Sélectionner le plus grand modèle de la famille, et passer à un modèle plus petit seulement si les utilisateurs signalent des réponses lentes." } }
    - { id: b, text: { en: "Select the model with the largest context window, because it always has the lowest price per token.", fr: "Sélectionner le modèle qui a la plus grande fenêtre de contexte, car il a toujours le prix par jeton le plus bas." } }
    - { id: c, text: { en: "Test the smallest model first, and move to larger models only until one meets the quality bar.", fr: "Tester d'abord le plus petit modèle, et ne passer à des modèles plus grands que jusqu'à ce que l'un d'eux atteigne le niveau de qualité." } }
    - { id: d, text: { en: "Select the newest model of the family, because newer models always cost less per token.", fr: "Sélectionner le modèle le plus récent de la famille, car les modèles récents coûtent toujours moins cher par jeton." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Well-Architected Generative AI Lens recommends testing a smaller model first and increasing model size and capability only until an acceptable model is found. Larger models usually cost more per token, so the smallest model that meets the defined quality bar gives the lowest inference cost."
    fr: "Le Generative AI Lens d'AWS Well-Architected recommande de tester d'abord un modèle plus petit et de n'augmenter la taille et les capacités du modèle que jusqu'à trouver un modèle acceptable. Les grands modèles coûtent généralement plus cher par jeton : le plus petit modèle qui atteint le niveau de qualité défini donne donc le coût d'inférence le plus faible."
  options:
    a:
      en: "Starting with the largest model pays for capability that the task may not need; the guidance is to start small and scale up."
      fr: "Commencer par le plus grand modèle fait payer des capacités dont la tâche n'a peut-être pas besoin ; la recommandation est de commencer petit et d'augmenter."
    b:
      en: "A larger context window does not imply a lower price per token; models with large context windows are often the larger, more expensive ones."
      fr: "Une plus grande fenêtre de contexte n'implique pas un prix par jeton plus bas ; les modèles à grande fenêtre de contexte sont souvent les plus grands et les plus chers."
    d:
      en: "Newer and larger models often cost more per token, so the release date does not decide the cost."
      fr: "Les modèles récents et plus grands coûtent souvent plus cher par jeton : la date de sortie ne détermine donc pas le coût."
references:
  - title: GENCOST01-BP01 Right-size model selection to optimize inference costs
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html
