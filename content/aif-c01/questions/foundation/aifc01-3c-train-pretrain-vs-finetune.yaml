id: aifc01-3c-train-pretrain-vs-finetune
objective: "3.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is comparing the pre-training of a foundation model (FM) with the fine-tuning of an existing FM.

    Which statements are correct? (Choose two.)
  fr: |
    Une entreprise compare le préentraînement d'un modèle de fondation (FM) avec le réglage précis d'un FM existant.

    Quelles affirmations sont correctes ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Pre-training uses a massive unlabeled dataset and is the most expensive stage.", fr: "Le préentraînement utilise un immense jeu de données non étiqueté et constitue l'étape la plus coûteuse." } }
    - { id: b, text: { en: "Pre-training requires labeled prompt-response pairs written by domain experts.", fr: "Le préentraînement nécessite des paires invite-réponse étiquetées rédigées par des experts du domaine." } }
    - { id: c, text: { en: "Fine-tuning leaves the weights unchanged and only adds examples to the prompt.", fr: "Le réglage précis laisse les pondérations inchangées et ajoute seulement des exemples à l'invite." } }
    - { id: d, text: { en: "Fine-tuning needs more data and compute than pre-training the same model.", fr: "Le réglage précis nécessite plus de données et de calcul que le préentraînement du même modèle." } }
    - { id: e, text: { en: "Fine-tuning further trains a pre-trained model on a smaller task-specific dataset.", fr: "Le réglage précis poursuit l'entraînement d'un modèle préentraîné sur un jeu de données plus petit, propre à une tâche." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Pre-training builds the FM from a very large unlabeled corpus with self-supervised learning, and developing an FM from scratch costs millions of dollars. Fine-tuning is a more affordable customization: it further trains the pre-trained model on a smaller corpus of your own and changes the model's weights."
    fr: "Le préentraînement construit le FM à partir d'un très grand corpus non étiqueté par apprentissage autosupervisé, et développer un FM à partir de zéro coûte des millions de dollars. Le réglage précis est une personnalisation plus abordable : il poursuit l'entraînement du modèle préentraîné sur un corpus plus petit qui vous appartient et modifie les pondérations du modèle."
  options:
    b:
      en: "Pre-training is self-supervised: the labels come from the data itself, not from experts."
      fr: "Le préentraînement est autosupervisé : les étiquettes viennent des données elles-mêmes, pas d'experts."
    c:
      en: "Adding examples to the prompt is few-shot prompting; fine-tuning is further training that changes the weights."
      fr: "Ajouter des exemples à l'invite relève de l'invite few-shot ; le réglage précis est un entraînement supplémentaire qui modifie les pondérations."
    d:
      en: "It is the opposite: fine-tuning reuses the pre-trained model and needs far less data and compute."
      fr: "C'est l'inverse : le réglage précis réutilise le modèle préentraîné et nécessite beaucoup moins de données et de calcul."
references:
  - title: Foundation models and hyperparameters for fine-tuning
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html
  - title: What are Foundation Models? - Foundation Models in Generative AI Explained - AWS
    url: https://aws.amazon.com/what-is/foundation-models/
