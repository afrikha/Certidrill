id: aifc01-3c-ft-unlabeled-methods
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An energy company wants to adapt a foundation model (FM) to the vocabulary of its industry. The company has a large collection of technical reports but no labeled examples, and it does not want to create labels.

    Which methods can the company use? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise du secteur de l'énergie veut adapter un modèle de fondation (FM) au vocabulaire de son secteur. Elle dispose d'une grande collection de rapports techniques, mais d'aucun exemple étiqueté, et elle ne veut pas créer d'étiquettes.

    Quelles méthodes l'entreprise peut-elle utiliser ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Instruction tuning", fr: "Réglage par instructions (instruction tuning)" } }
    - { id: b, text: { en: "Continued pre-training", fr: "Préentraînement continu" } }
    - { id: c, text: { en: "Reward model training from human rankings", fr: "Entraînement d'un modèle de récompense à partir de classements humains" } }
    - { id: d, text: { en: "Domain adaptation fine-tuning", fr: "Peaufinage par adaptation au domaine" } }
    - { id: e, text: { en: "Supervised fine-tuning with prompt-completion records", fr: "Peaufinage supervisé avec des enregistrements prompt-completion" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Continued pre-training trains the model further on large amounts of unlabeled domain text with the original self-supervised objective. Domain adaptation fine-tuning in SageMaker JumpStart also trains on plain domain text (CSV, JSON, or TXT) to handle industry jargon and technical terms. Neither method needs labels."
    fr: "Le préentraînement continu poursuit l'entraînement du modèle sur de grandes quantités de texte de domaine non étiqueté avec l'objectif autosupervisé d'origine. Le peaufinage par adaptation au domaine de SageMaker JumpStart s'entraîne lui aussi sur du texte brut du domaine (CSV, JSON ou TXT) pour gérer le jargon sectoriel et les termes techniques. Aucune de ces méthodes ne nécessite d'étiquettes."
  options:
    a:
      en: "Instruction tuning needs labeled prompt-response pairs phrased as instructions."
      fr: "Le réglage par instructions nécessite des paires invite-réponse étiquetées formulées comme des instructions."
    c:
      en: "A reward model is trained on human rankings of responses, which are labels the company would have to create."
      fr: "Un modèle de récompense est entraîné sur des classements humains de réponses, qui sont des étiquettes que l'entreprise devrait créer."
    e:
      en: "Prompt-completion records are labeled input-output examples."
      fr: "Les enregistrements prompt-completion sont des exemples étiquetés d'entrée et de sortie."
references:
  - title: Fine-tune a large language model (LLM) using domain adaptation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning-domain-adaptation.html
  - title: Continued pre-training (CPT)
    url: https://docs.aws.amazon.com/nova/latest/userguide/customize-fine-tune-hyperpod-cpt.html
