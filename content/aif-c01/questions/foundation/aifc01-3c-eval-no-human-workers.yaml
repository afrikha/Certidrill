id: aifc01-3c-eval-no-human-workers
objective: "3.4.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A small company wants to evaluate a foundation model (FM) in Amazon Bedrock. The company has no staff available to review model responses.

    Which evaluation approaches can the company use? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une petite entreprise veut évaluer un modèle de fondation (FM) dans Amazon Bedrock. Elle ne dispose d'aucun personnel pour examiner les réponses du modèle.

    Quelles approches d'évaluation l'entreprise peut-elle utiliser ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Human-based model evaluation with a work team", fr: "Évaluation humaine de modèle avec une équipe de travail" } }
    - { id: b, text: { en: "Automatic (programmatic) model evaluation", fr: "Évaluation automatique (programmatique) de modèle" } }
    - { id: c, text: { en: "Expert review with a Likert scale rating", fr: "Revue par des experts avec une notation sur une échelle de Likert" } }
    - { id: d, text: { en: "LLM-as-a-judge model evaluation", fr: "Évaluation de modèle LLM-as-a-judge" } }
    - { id: e, text: { en: "Side-by-side comparison choice by employees", fr: "Choix comparatif côte à côte par des employés" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An automatic model evaluation job computes metrics such as accuracy, robustness, and toxicity on a built-in or custom dataset. An LLM-as-a-judge job uses a second model to score each response and explain the score. Neither needs human reviewers."
    fr: "Une tâche d'évaluation automatique de modèle calcule des métriques comme l'exactitude, la robustesse et la toxicité sur un jeu de données intégré ou personnalisé. Une tâche LLM-as-a-judge utilise un second modèle pour noter chaque réponse et expliquer la note. Aucune des deux ne nécessite d'évaluateurs humains."
  options:
    a:
      en: "A human-based job needs workers in a work team to rate the responses."
      fr: "Une tâche d'évaluation humaine nécessite des évaluateurs regroupés dans une équipe de travail pour noter les réponses."
    c:
      en: "A Likert scale is a rating method that human evaluators use."
      fr: "L'échelle de Likert est une méthode de notation utilisée par des évaluateurs humains."
    e:
      en: "A comparison choice is a rating method in which human workers pick the better of two responses."
      fr: "Le choix comparatif est une méthode de notation dans laquelle des évaluateurs humains choisissent la meilleure de deux réponses."
references:
  - title: Evaluate the performance of Amazon Bedrock resources
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
