id: aifc01-3a-inf-multi-randomness
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer wants to control how random or diverse the text generated by a foundation model (FM) is, without changing the maximum length of the responses.

    Which two inference parameters can the developer adjust? (Choose two.)
  fr: |
    Un développeur veut contrôler le caractère aléatoire ou la diversité du texte généré par un modèle de fondation (FM), sans modifier la longueur maximale des réponses.

    Quels sont les deux paramètres d'inférence que le développeur peut ajuster ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Temperature", fr: "Température" } }
    - { id: b, text: { en: "Maximum tokens", fr: "Nombre maximal de jetons" } }
    - { id: c, text: { en: "Stop sequences", fr: "Séquences d'arrêt" } }
    - { id: d, text: { en: "Top P", fr: "Top P" } }
    - { id: e, text: { en: "Embedding dimensions", fr: "Dimensions des intégrations" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Temperature changes the shape of the probability distribution: lower values favor the most probable tokens, higher values make less probable tokens more likely. Top P limits the candidates to the tokens in the top share of the cumulative probability. Both control how random or diverse the output is."
    fr: "La température modifie la forme de la distribution de probabilité : des valeurs basses favorisent les jetons les plus probables, des valeurs élevées rendent plus probables les jetons moins probables. Top P limite les candidats aux jetons situés dans la part supérieure de la probabilité cumulée. Les deux contrôlent le caractère aléatoire ou la diversité de la sortie."
  options:
    b:
      en: "Maximum tokens controls the length of the response, which the developer does not want to change."
      fr: "Le nombre maximal de jetons contrôle la longueur de la réponse, que le développeur ne veut pas modifier."
    c:
      en: "Stop sequences end the response when a given string appears; they control where the output stops, not how varied it is."
      fr: "Les séquences d'arrêt terminent la réponse quand une chaîne donnée apparaît ; elles contrôlent l'endroit où la sortie s'arrête, pas sa diversité."
    e:
      en: "Embedding dimensions are a setting of embeddings models for vector search, not an inference parameter of text generation."
      fr: "Les dimensions des intégrations sont un réglage des modèles d'intégration pour la recherche vectorielle, pas un paramètre d'inférence de la génération de texte."
references:
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
