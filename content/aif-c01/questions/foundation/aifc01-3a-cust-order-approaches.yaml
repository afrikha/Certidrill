id: aifc01-3a-cust-order-approaches
objective: "3.1.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A company follows AWS guidance to customize a foundation model (FM): it starts with the least resource-intensive approach and moves to more advanced approaches only when needed.

    Which four approaches should the company consider, in order from the LEAST to the MOST resource-intensive? To answer, select the correct approaches from the following list and place them in the correct order. Each approach should be selected one time or not at all.
  fr: |
    Une entreprise suit les recommandations d'AWS pour personnaliser un modèle de fondation (FM) : elle commence par l'approche la moins gourmande en ressources et ne passe à des approches plus avancées que si nécessaire.

    Quelles sont les quatre approches que l'entreprise doit envisager, dans l'ordre, de la MOINS à la PLUS gourmande en ressources ? Pour répondre, sélectionnez les approches appropriées dans la liste suivante et placez-les dans le bon ordre. Chaque approche peut être sélectionnée une fois ou pas du tout.
body:
  count: 4
  actions:
    - { id: ft, text: { en: "Fine-tune the FM with labeled task data.", fr: "Peaufiner le FM avec des données de tâche étiquetées." } }
    - { id: pe, text: { en: "Improve the prompts with prompt engineering.", fr: "Améliorer les invites par l'ingénierie de requête." } }
    - { id: temp, text: { en: "Increase the temperature of the FM.", fr: "Augmenter la température du FM." } }
    - { id: pt, text: { en: "Build a custom FM by pre-training it on proprietary data.", fr: "Créer un FM personnalisé en le préentraînant sur des données propriétaires." } }
    - { id: rag, text: { en: "Add Retrieval Augmented Generation (RAG) with a knowledge base.", fr: "Ajouter la génération à enrichissement contextuel (RAG) avec une base de connaissances." } }
    - { id: cache, text: { en: "Enable prompt caching for the FM.", fr: "Activer la mise en cache des invites pour le FM." } }
answer:
  sequence: [ pe, rag, ft, pt ]
explanation:
  correct:
    en: "The AWS Generative AI Lens recommends starting with prompt engineering, which changes nothing in the model. RAG comes next: it adds external knowledge through retrieval without retraining. Fine-tuning (or continued pre-training) requires training data and training jobs. Building a custom FM from scratch is typically the option with the highest resources and cost."
    fr: "Le Generative AI Lens d'AWS recommande de commencer par l'ingénierie de requête, qui ne modifie rien dans le modèle. Le RAG vient ensuite : il apporte des connaissances externes par récupération, sans réentraînement. Le peaufinage (ou le préentraînement continu) exige des données et des tâches d'entraînement. Créer un FM personnalisé à partir de zéro est généralement l'option qui demande le plus de ressources et de coût."
  options:
    temp:
      en: "Temperature is an inference parameter that changes randomness; it is not a way to customize a model."
      fr: "La température est un paramètre d'inférence qui modifie le caractère aléatoire ; ce n'est pas un moyen de personnaliser un modèle."
    cache:
      en: "Prompt caching lowers the cost and latency of repeated prompt prefixes; it does not customize the model's behavior."
      fr: "La mise en cache des invites réduit le coût et la latence des préfixes d'invite répétés ; elle ne personnalise pas le comportement du modèle."
references:
  - title: GENOPS05-BP01 Learn when to customize models
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/genops05-bp01.html
