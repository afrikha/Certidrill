id: aifc01-3c-train-self-supervised
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A student asks how a foundation model (FM) learns from billions of documents during pre-training, even though nobody labels those documents.

    Which answer is correct?
  fr: |
    Un étudiant demande comment un modèle de fondation (FM) apprend à partir de milliards de documents pendant le préentraînement, alors que personne n'étiquette ces documents.

    Quelle réponse est correcte ?
body:
  options:
    - { id: a, text: { en: "Human annotators rank several responses for each document to train the model.", fr: "Des annotateurs humains classent plusieurs réponses pour chaque document afin d'entraîner le modèle." } }
    - { id: b, text: { en: "The model retrieves the documents from a vector database each time it answers.", fr: "Le modèle récupère les documents dans une base de données vectorielle chaque fois qu'il répond." } }
    - { id: c, text: { en: "Self-supervised learning creates the labels from the input data, such as the next token.", fr: "L'apprentissage autosupervisé crée les étiquettes à partir des données d'entrée, par exemple le jeton suivant." } }
    - { id: d, text: { en: "Reinforcement learning rewards the model each time a user accepts an answer.", fr: "L'apprentissage par renforcement récompense le modèle chaque fois qu'un utilisateur accepte une réponse." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Foundation models are pre-trained on massive unlabeled datasets with self-supervised learning: the training signal comes from the data itself, for example by predicting the next token of a text. This is why pre-training does not need a human-labeled training set."
    fr: "Les modèles de fondation sont préentraînés sur d'immenses jeux de données non étiquetés par apprentissage autosupervisé : le signal d'entraînement vient des données elles-mêmes, par exemple en prédisant le jeton suivant d'un texte. C'est pourquoi le préentraînement n'a pas besoin d'un jeu d'entraînement étiqueté par des humains."
  options:
    a:
      en: "Ranking responses is human feedback used in RLHF after pre-training, not the way the model learns from the raw documents."
      fr: "Classer des réponses est une rétroaction humaine utilisée par le RLHF après le préentraînement, pas la façon dont le modèle apprend à partir des documents bruts."
    b:
      en: "Retrieving documents at answer time is Retrieval Augmented Generation (RAG); it does not train the model."
      fr: "Récupérer des documents au moment de répondre relève de la génération augmentée par récupération (RAG) ; cela n'entraîne pas le modèle."
    d:
      en: "Rewards based on user acceptance are not how pre-training works; pre-training uses the unlabeled corpus itself."
      fr: "Des récompenses fondées sur l'acceptation par les utilisateurs ne correspondent pas au préentraînement, qui utilise le corpus non étiqueté lui-même."
references:
  - title: What are Foundation Models? - Foundation Models in Generative AI Explained - AWS
    url: https://aws.amazon.com/what-is/foundation-models/
