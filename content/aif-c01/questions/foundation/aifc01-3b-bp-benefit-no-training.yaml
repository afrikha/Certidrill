id: aifc01-3b-bp-benefit-no-training
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup wants to improve the answers of a foundation model on Amazon Bedrock. Its manager compares prompt engineering with model customization.

    Which benefit does prompt engineering provide?
  fr: |
    Une start-up veut améliorer les réponses d'un modèle de fondation sur Amazon Bedrock. Son responsable compare l'ingénierie de requête à la personnalisation de modèle.

    Quel avantage l'ingénierie de requête apporte-t-elle ?
body:
  options:
    - { id: a, text: { en: "It adds the startup's private data permanently to the model's weights.", fr: "Elle ajoute définitivement les données privées de la start-up aux pondérations du modèle." } }
    - { id: b, text: { en: "It removes the token-based charges of each model invocation.", fr: "Elle supprime la facturation au jeton de chaque invocation du modèle." } }
    - { id: c, text: { en: "It improves response quality quickly, without training or changing the model.", fr: "Elle améliore rapidement la qualité des réponses, sans entraîner ni modifier le modèle." } }
    - { id: d, text: { en: "It guarantees that the model never produces a wrong answer.", fr: "Elle garantit que le modèle ne produit jamais de réponse fausse." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Prompt engineering improves the quality and relevance of responses by changing only the input: instructions, context, examples, and format. It needs no training data, training job, or custom model, so it is the fastest and cheapest way to start."
    fr: "L'ingénierie de requête améliore la qualité et la pertinence des réponses en ne modifiant que l'entrée : instructions, contexte, exemples et format. Elle ne demande ni données d'entraînement, ni tâche d'entraînement, ni modèle personnalisé : c'est la manière la plus rapide et la moins chère de commencer."
  options:
    a:
      en: "Changing the weights is what fine-tuning or continued pre-training does; a prompt is not stored in the model."
      fr: "Modifier les pondérations est le rôle du peaufinage ou du pré-entraînement continu ; une invite n'est pas stockée dans le modèle."
    b:
      en: "On-demand invocations are still billed by input and output tokens; a longer prompt even adds input tokens."
      fr: "Les invocations à la demande restent facturées aux jetons d'entrée et de sortie ; une invite plus longue ajoute même des jetons d'entrée."
    d:
      en: "Better prompts reduce errors and hallucinations but cannot eliminate them."
      fr: "De meilleures invites réduisent les erreurs et les hallucinations, mais ne peuvent pas les éliminer."
references:
  - title: What is prompt engineering?
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-prompt-engineering.html
