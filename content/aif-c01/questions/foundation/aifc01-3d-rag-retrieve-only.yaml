id: aifc01-3d-rag-retrieve-only
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company built a retrieval augmented generation (RAG) application with Amazon Bedrock Knowledge Bases. Before it looks at the generated answers, the company wants to check whether the knowledge base returns passages that are relevant to user questions.

    Which solution will meet this requirement?
  fr: |
    Un groupe de santé a créé une application de génération à enrichissement contextuel (RAG) avec Amazon Bedrock Knowledge Bases. Avant d'examiner les réponses générées, l'entreprise veut vérifier si la base de connaissances renvoie des passages pertinents pour les questions des utilisateurs.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Run an Amazon Bedrock automatic model evaluation job of the text summarization task type.", fr: "Exécuter une tâche d'évaluation de modèle automatique Amazon Bedrock du type résumé de texte." } }
    - { id: b, text: { en: "Run an Amazon Bedrock RAG evaluation job of the retrieve-only type.", fr: "Exécuter une tâche d'évaluation RAG Amazon Bedrock du type récupération seule (retrieve only)." } }
    - { id: c, text: { en: "Monitor the InvocationLatency metric of the knowledge base in Amazon CloudWatch.", fr: "Surveiller la métrique InvocationLatency de la base de connaissances dans Amazon CloudWatch." } }
    - { id: d, text: { en: "Review the AWS CloudTrail events of the calls to the knowledge base.", fr: "Examiner les événements AWS CloudTrail des appels à la base de connaissances." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Bedrock RAG evaluations offer two types: retrieve only, based only on the data retrieved from the RAG source, and retrieve and generate. A retrieve-only job reports metrics such as context relevance, which measures how relevant the retrieved texts are to the questions."
    fr: "Les évaluations RAG d'Amazon Bedrock proposent deux types : récupération seule (retrieve only), fondée uniquement sur les données récupérées de la source RAG, et récupération et génération (retrieve and generate). Une tâche de récupération seule produit des métriques comme Context relevance, qui mesure la pertinence des textes récupérés par rapport aux questions."
  options:
    a:
      en: "An automatic model evaluation job evaluates a model's outputs for a task type; it does not evaluate what a knowledge base retrieves."
      fr: "Une tâche d'évaluation de modèle automatique évalue les sorties d'un modèle pour un type de tâche ; elle n'évalue pas ce que récupère une base de connaissances."
    c:
      en: "Latency tells how fast the model responds, not whether the retrieved passages are relevant."
      fr: "La latence indique la vitesse de réponse du modèle, pas la pertinence des passages récupérés."
    d:
      en: "CloudTrail records API calls for auditing; it does not score the relevance of results."
      fr: "CloudTrail enregistre les appels d'API à des fins d'audit ; il ne note pas la pertinence des résultats."
references:
  - title: Evaluate the performance of RAG sources using Amazon Bedrock evaluations
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
  - title: Use metrics to understand RAG system performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
