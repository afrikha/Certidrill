id: aifc01-3a-cust-multi-weights
objective: "3.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is comparing foundation model (FM) customization approaches by their costs. It wants to know which approaches change model parameters and therefore involve a training job and a custom model to pay for.

    Which two approaches change model parameters? (Choose two.)
  fr: |
    Une entreprise compare les approches de personnalisation des modèles de fondation (FM) selon leurs coûts. Elle veut savoir quelles approches modifient les paramètres du modèle et impliquent donc une tâche d'entraînement et un modèle personnalisé à payer.

    Quelles sont les deux approches qui modifient les paramètres du modèle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Retrieval Augmented Generation (RAG)", fr: "Génération à enrichissement contextuel (RAG)" } }
    - { id: b, text: { en: "Fine-tuning", fr: "Peaufinage (fine-tuning)" } }
    - { id: c, text: { en: "In-context learning", fr: "Apprentissage en contexte" } }
    - { id: d, text: { en: "Prompt templates", fr: "Modèles d'invites" } }
    - { id: e, text: { en: "Model distillation", fr: "Distillation de modèles" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Fine-tuning uses training data to adjust the parameters of a base model and creates a custom model. Distillation also creates a custom model: Amazon Bedrock generates responses from a larger teacher model and uses them to fine-tune a smaller student model. Both involve training charges and the storage and hosting of a custom model."
    fr: "Le peaufinage utilise des données d'entraînement pour ajuster les paramètres d'un modèle de base et crée un modèle personnalisé. La distillation crée aussi un modèle personnalisé : Amazon Bedrock génère des réponses à partir d'un modèle enseignant plus grand et les utilise pour peaufiner un modèle élève plus petit. Les deux impliquent des frais d'entraînement ainsi que le stockage et l'hébergement d'un modèle personnalisé."
  options:
    a:
      en: "RAG adds retrieved information to the prompt; the model parameters do not change."
      fr: "Le RAG ajoute des informations récupérées à l'invite ; les paramètres du modèle ne changent pas."
    c:
      en: "In-context learning puts examples in the prompt; there is no training job."
      fr: "L'apprentissage en contexte place des exemples dans l'invite ; il n'y a aucune tâche d'entraînement."
    d:
      en: "Prompt templates are reusable prompt structures; they do not modify the model."
      fr: "Les modèles d'invites sont des structures d'invite réutilisables ; ils ne modifient pas le modèle."
references:
  - title: Customize your model to improve its performance for your use case
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
  - title: Key terminology
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
