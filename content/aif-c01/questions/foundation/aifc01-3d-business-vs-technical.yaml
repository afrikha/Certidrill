id: aifc01-3d-business-vs-technical
objective: "3.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A telecommunications company ran a pilot of an FM-based assistant for its support agents. The steering committee will decide whether to roll out the assistant based on business metrics, not on technical metrics.

    Which two metrics are business metrics? (Choose two.)
  fr: |
    Un opérateur de télécommunications a mené un pilote d'un assistant basé sur un FM pour ses agents de support. Le comité de pilotage décidera du déploiement de l'assistant à partir de métriques métier, et non de métriques techniques.

    Quelles sont les deux métriques métier ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Reduction in average handle time per ticket", fr: "Réduction du temps de traitement moyen par ticket" } }
    - { id: b, text: { en: "Context relevance of the retrieved passages", fr: "Pertinence du contexte (context relevance) des passages récupérés" } }
    - { id: c, text: { en: "Tokens generated per second", fr: "Jetons générés par seconde" } }
    - { id: d, text: { en: "ROUGE-L score against reference answers", fr: "Score ROUGE-L par rapport à des réponses de référence" } }
    - { id: e, text: { en: "First-contact resolution rate", fr: "Taux de résolution au premier contact" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Business metrics are tied to the business goal: the reduction in handle time and the share of issues resolved without follow-up (first-contact resolution) show whether the support organization actually improves. Technical metrics help engineers optimize the system but do not prove business value on their own."
    fr: "Les métriques métier sont liées à l'objectif métier : la réduction du temps de traitement et la part des problèmes résolus sans relance (résolution au premier contact) montrent si l'organisation du support s'améliore réellement. Les métriques techniques aident les ingénieurs à optimiser le système mais ne prouvent pas à elles seules une valeur métier."
  options:
    b:
      en: "Context relevance is a technical RAG metric that tells whether the right information was retrieved."
      fr: "La pertinence du contexte est une métrique technique de RAG qui indique si la bonne information a été récupérée."
    c:
      en: "Tokens per second is a technical latency and throughput metric."
      fr: "Les jetons par seconde sont une métrique technique de latence et de débit."
    d:
      en: "ROUGE-L is a technical similarity metric against human-written samples."
      fr: "ROUGE-L est une métrique technique de similarité par rapport à des exemples rédigés par des humains."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
