id: aifc01-3c-train-distillation
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company uses a large foundation model (FM) in Amazon Bedrock to classify customer emails. The accuracy is good, but the inference cost and latency are too high. The company has a set of representative email prompts but no labeled responses. The company wants a smaller, faster model that keeps most of the large model's accuracy for this use case.

    Which solution will meet these requirements?
  fr: |
    Une agence de voyages utilise un grand modèle de fondation (FM) dans Amazon Bedrock pour classer les e-mails des clients. L'exactitude est bonne, mais le coût et la latence de l'inférence sont trop élevés. L'entreprise dispose d'un ensemble d'invites représentatives d'e-mails, mais d'aucune réponse étiquetée. Elle veut un modèle plus petit et plus rapide qui conserve l'essentiel de l'exactitude du grand modèle pour ce cas d'usage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run continued pre-training of the large model on the email prompts.", fr: "Exécuter un préentraînement continu du grand modèle sur les invites d'e-mails." } }
    - { id: b, text: { en: "Purchase Provisioned Throughput for the large model.", fr: "Acheter du Provisioned Throughput pour le grand modèle." } }
    - { id: c, text: { en: "Use Amazon Bedrock Model Distillation with the large model as the teacher.", fr: "Utiliser Amazon Bedrock Model Distillation avec le grand modèle comme modèle enseignant." } }
    - { id: d, text: { en: "Run supervised fine-tuning of the large model on the email prompts.", fr: "Exécuter un réglage précis supervisé du grand modèle sur les invites d'e-mails." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Model distillation transfers knowledge from a larger teacher model to a smaller, faster and more cost-efficient student model. Amazon Bedrock generates responses from the teacher for the company's prompts and uses them to fine-tune the student, so labeled responses are optional."
    fr: "La distillation de modèle transfère la connaissance d'un modèle enseignant plus grand vers un modèle élève plus petit, plus rapide et plus économique. Amazon Bedrock génère les réponses de l'enseignant pour les invites de l'entreprise et les utilise pour peaufiner l'élève : les réponses étiquetées sont donc facultatives."
  options:
    a:
      en: "Continued pre-training keeps the same large model, so cost and latency do not decrease, and it needs a large unlabeled corpus."
      fr: "Le préentraînement continu conserve le même grand modèle, donc le coût et la latence ne baissent pas, et il nécessite un grand corpus non étiqueté."
    b:
      en: "Provisioned Throughput reserves capacity for the same large model; it does not produce a smaller, faster model."
      fr: "Provisioned Throughput réserve de la capacité pour le même grand modèle ; il ne produit pas de modèle plus petit et plus rapide."
    d:
      en: "Supervised fine-tuning needs labeled responses and leaves the model as large as before."
      fr: "Le réglage précis supervisé nécessite des réponses étiquetées et laisse le modèle aussi grand qu'avant."
references:
  - title: Customize a model with distillation in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
