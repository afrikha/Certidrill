id: aifc01-3d-rag-context-coverage
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company evaluates the retrieval step of its RAG application with Amazon Bedrock evaluations. Its prompt dataset contains, for each question, ground truth texts that hold the information a good answer needs. The company wants to measure how much of the information in the ground truth texts the retrieved passages contain.

    Which metric should the company use?
  fr: |
    Une société de services financiers évalue l'étape de récupération de son application RAG avec les évaluations Amazon Bedrock. Son jeu de données d'invites contient, pour chaque question, des textes de vérité terrain (ground truth) qui renferment les informations nécessaires à une bonne réponse. L'entreprise veut mesurer quelle part des informations des textes de vérité terrain se trouve dans les passages récupérés.

    Quelle métrique l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Context coverage" }
    - { id: b, text: "Context relevance" }
    - { id: c, text: "Citation coverage" }
    - { id: d, text: "Completeness" }
answer: { optionId: a }
explanation:
  correct:
    en: "Context coverage is a retrieve-only metric that measures how much the retrieved texts cover all the information in the ground truth texts. It is the RAG metric that requires ground truth in the prompt dataset."
    fr: "Context coverage est une métrique de récupération seule qui mesure dans quelle mesure les textes récupérés couvrent toutes les informations des textes de vérité terrain. C'est la métrique RAG qui exige une vérité terrain dans le jeu de données d'invites."
  options:
    b:
      en: "Context relevance measures how relevant the retrieved texts are to the questions, not how much of the expected information they contain."
      fr: "Context relevance mesure la pertinence des textes récupérés par rapport aux questions, pas la part des informations attendues qu'ils contiennent."
    c:
      en: "Citation coverage is a retrieve-and-generate metric about how well a generated response is supported by its cited passages."
      fr: "Citation coverage est une métrique de récupération et génération qui porte sur la façon dont une réponse générée est étayée par ses passages cités."
    d:
      en: "Completeness evaluates whether generated responses resolve all aspects of the questions; it evaluates generation, not retrieval."
      fr: "Completeness évalue si les réponses générées traitent tous les aspects des questions ; elle évalue la génération, pas la récupération."
references:
  - title: Use metrics to understand RAG system performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
