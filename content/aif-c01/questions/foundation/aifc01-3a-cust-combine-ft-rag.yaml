id: aifc01-3a-cust-combine-ft-rag
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company wants an assistant whose answers follow its strict regulatory writing format and use the latest policy documents, which change every week. The company has thousands of labeled examples in the required format. The format must be followed consistently, prompts must stay short to control the cost of each request, and the company wants to avoid repeated training jobs and the cost of building a model from scratch.

    Which approach will meet these requirements?
  fr: |
    Une compagnie d'assurance veut un assistant dont les réponses respectent son format rédactionnel réglementaire strict et utilisent les documents de police les plus récents, qui changent chaque semaine. L'entreprise dispose de milliers d'exemples étiquetés au format requis. Le format doit être respecté de façon constante, les invites doivent rester courtes pour maîtriser le coût de chaque requête, et l'entreprise veut éviter des tâches d'entraînement répétées et le coût de création d'un modèle à partir de zéro.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the FM every week on the latest policy documents and the labeled examples.", fr: "Peaufiner le FM chaque semaine sur les documents de police les plus récents et les exemples étiquetés." } }
    - { id: b, text: { en: "Use RAG with a knowledge base of the policy documents, and add a few format examples to each prompt.", fr: "Utiliser le RAG avec une base de connaissances des documents de police, et ajouter quelques exemples de format à chaque invite." } }
    - { id: c, text: { en: "Fine-tune the FM once on the format examples, and use RAG to retrieve the policy documents.", fr: "Peaufiner le FM une seule fois sur les exemples de format, et utiliser le RAG pour récupérer les documents de police." } }
    - { id: d, text: { en: "Pre-train a new FM on the policy documents, and retrain it each time the documents change.", fr: "Préentraîner un nouveau FM sur les documents de police, et le réentraîner chaque fois que les documents changent." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Fine-tuning helps a model follow an organization's style and its regulatory standards, while RAG brings in the latest documents in minutes without retraining. AWS guidance notes that both can be combined: the RAG architecture stays the same, and the model that generates the answer is fine-tuned. A single training job covers the stable format, and weekly document changes only need a data source sync."
    fr: "Le peaufinage aide un modèle à respecter le style d'une organisation et ses normes réglementaires, tandis que le RAG intègre les documents les plus récents en quelques minutes, sans réentraînement. Les recommandations d'AWS indiquent que les deux peuvent être combinés : l'architecture RAG reste la même, et le modèle qui génère la réponse est peaufiné. Une seule tâche d'entraînement couvre le format stable, et les changements hebdomadaires des documents ne demandent qu'une synchronisation de la source de données."
  options:
    a:
      en: "Weekly fine-tuning means repeated training jobs, which the company wants to avoid, and fine-tuned answers give no source references."
      fr: "Un peaufinage hebdomadaire implique des tâches d'entraînement répétées, que l'entreprise veut éviter, et les réponses d'un modèle peaufiné ne donnent pas de références aux sources."
    b:
      en: "Examples in every prompt make the prompts longer and add input tokens to each request, and a few examples are less reliable than fine-tuning on thousands of labeled examples for a strict format."
      fr: "Des exemples dans chaque invite allongent les invites et ajoutent des jetons d'entrée à chaque requête, et quelques exemples sont moins fiables qu'un peaufinage sur des milliers d'exemples étiquetés pour un format strict."
    d:
      en: "Pre-training from scratch is the most expensive approach, and retraining at each change multiplies that cost."
      fr: "Le préentraînement à partir de zéro est l'approche la plus coûteuse, et réentraîner à chaque changement multiplie ce coût."
references:
  - title: Comparing Retrieval Augmented Generation and fine-tuning
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-vs-fine-tuning.html
  - title: GENOPS05-BP01 Learn when to customize models
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/genops05-bp01.html
