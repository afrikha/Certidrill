id: aifc01-3a-inf-maxtokens-limit
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A voice assistant uses a foundation model (FM) on Amazon Bedrock with on-demand pricing. Users want short answers, and the company wants to cap the output token cost and the generation time of every response.

    Which inference parameter change will meet these requirements?
  fr: |
    Un assistant vocal utilise un modèle de fondation (FM) sur Amazon Bedrock avec une tarification à la demande. Les utilisateurs veulent des réponses courtes, et l'entreprise veut plafonner le coût des jetons de sortie et le temps de génération de chaque réponse.

    Quelle modification des paramètres d'inférence répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set a higher top P value.", fr: "Définir une valeur de top P plus élevée." } }
    - { id: b, text: { en: "Set a higher temperature value.", fr: "Définir une valeur de température plus élevée." } }
    - { id: c, text: { en: "Set a higher top K value.", fr: "Définir une valeur de top K plus élevée." } }
    - { id: d, text: { en: "Set a lower maximum tokens value.", fr: "Définir un nombre maximal de jetons plus faible." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The maximum tokens (response length) parameter sets the largest number of tokens that the model can generate in a response. With on-demand pricing, output tokens are billed, so a lower limit caps both the output cost and the time spent generating each answer."
    fr: "Le paramètre de nombre maximal de jetons (longueur de la réponse) fixe le plus grand nombre de jetons que le modèle peut générer dans une réponse. Avec la tarification à la demande, les jetons de sortie sont facturés : une limite plus basse plafonne donc à la fois le coût de sortie et le temps passé à générer chaque réponse."
  options:
    a:
      en: "A higher top P widens the set of candidate tokens; it does not limit the length of the response."
      fr: "Un top P plus élevé élargit l'ensemble des jetons candidats ; il ne limite pas la longueur de la réponse."
    b:
      en: "A higher temperature makes the output more random; it does not shorten it."
      fr: "Une température plus élevée rend la sortie plus aléatoire ; elle ne la raccourcit pas."
    c:
      en: "A higher top K lets the model consider more candidate tokens; it does not cap the number of tokens generated."
      fr: "Un top K plus élevé permet au modèle d'envisager plus de jetons candidats ; il ne plafonne pas le nombre de jetons générés."
references:
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
  - title: InferenceConfiguration
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InferenceConfiguration.html
