id: aifc01-3b-tech-few-shot-no-training
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank uses a foundation model to route customer emails to four internal queues with unusual names, such as "Tier-B review". With a zero-shot prompt that lists the queue names, the model often picks the wrong queue. The bank has eight correctly routed emails. The bank wants better routing this week, without training jobs or custom model costs.

    Which solution will meet these requirements?
  fr: |
    Une banque utilise un modèle de fondation pour orienter les e-mails des clients vers quatre files internes aux noms inhabituels, comme « Tier-B review ». Avec une invite zero-shot qui liste les noms des files, le modèle choisit souvent la mauvaise file. La banque dispose de huit e-mails correctement orientés. Elle veut un meilleur routage dès cette semaine, sans tâche d'entraînement ni coût de modèle personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the eight routed emails to the prompt as examples, each followed by its queue.", fr: "Ajouter à l'invite les huit e-mails orientés comme exemples, chacun suivi de sa file." } }
    - { id: b, text: { en: "Fine-tune the model with the eight routed emails as the training dataset.", fr: "Peaufiner le modèle avec les huit e-mails orientés comme jeu de données d'entraînement." } }
    - { id: c, text: { en: "Keep the zero-shot prompt and repeat the list of queue names twice.", fr: "Conserver l'invite zero-shot et répéter deux fois la liste des noms de files." } }
    - { id: d, text: { en: "Run continued pre-training on the bank's unlabeled email archive.", fr: "Effectuer un pré-entraînement continu sur l'archive d'e-mails non étiquetés de la banque." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Few-shot prompting puts labeled examples in the prompt so that the model learns the mapping in context, without changing its weights. Diverse, relevant examples reduce misinterpretation of company-specific labels, and the change takes effect on the next request."
    fr: "L'invite few-shot place des exemples étiquetés dans l'invite pour que le modèle apprenne la correspondance en contexte, sans modifier ses pondérations. Des exemples variés et pertinents réduisent les erreurs d'interprétation des étiquettes propres à l'entreprise, et le changement prend effet dès la requête suivante."
  options:
    b:
      en: "Fine-tuning is a training job that creates a custom model, which the bank wants to avoid; eight records are also far too few for useful fine-tuning."
      fr: "Le peaufinage est une tâche d'entraînement qui crée un modèle personnalisé, ce que la banque veut éviter ; huit enregistrements sont en outre bien trop peu pour un peaufinage utile."
    c:
      en: "Repeating the names adds no information about which emails belong to which queue, so the zero-shot errors remain."
      fr: "Répéter les noms n'apporte aucune information sur les e-mails qui relèvent de chaque file : les erreurs du zero-shot persistent."
    d:
      en: "Continued pre-training is a training job on unlabeled data; it does not teach the queue mapping and adds custom model costs."
      fr: "Le pré-entraînement continu est une tâche d'entraînement sur des données non étiquetées ; il n'apprend pas la correspondance des files et ajoute des coûts de modèle personnalisé."
references:
  - title: Provide examples (few-shot prompting)
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-examples.html
