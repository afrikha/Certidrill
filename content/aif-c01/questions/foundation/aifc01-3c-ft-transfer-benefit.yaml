id: aifc01-3c-ft-transfer-benefit
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company wants an image model that detects defects in a new product line. The company has only a few hundred labeled images. A data scientist proposes to start from a model that is already trained on a large image dataset instead of training a new model.

    What is the main benefit of this approach?
  fr: |
    Une entreprise industrielle veut un modèle d'images qui détecte les défauts d'une nouvelle gamme de produits. Elle ne dispose que de quelques centaines d'images étiquetées. Un scientifique des données propose de partir d'un modèle déjà entraîné sur un grand jeu de données d'images plutôt que d'entraîner un nouveau modèle.

    Quel est le principal avantage de cette approche ?
body:
  options:
    - { id: a, text: { en: "The model no longer needs to be evaluated before it is deployed.", fr: "Le modèle n'a plus besoin d'être évalué avant d'être déployé." } }
    - { id: b, text: { en: "The model learns from new production images automatically after deployment.", fr: "Le modèle apprend automatiquement à partir des nouvelles images de production après le déploiement." } }
    - { id: c, text: { en: "The model needs a much smaller dataset and less training time and compute.", fr: "Le modèle nécessite un jeu de données beaucoup plus petit, ainsi que moins de temps d'entraînement et de calcul." } }
    - { id: d, text: { en: "The model can no longer produce wrong predictions on the new product line.", fr: "Le modèle ne peut plus produire de prédictions erronées sur la nouvelle gamme de produits." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Transfer learning adapts a pre-trained model to a related task. Because the model already learned general features, the adaptation needs a much smaller dataset than training from scratch, with fewer computing resources and less training time."
    fr: "L'apprentissage par transfert adapte un modèle préentraîné à une tâche apparentée. Comme le modèle a déjà appris des caractéristiques générales, l'adaptation nécessite un jeu de données beaucoup plus petit qu'un entraînement à partir de zéro, avec moins de ressources de calcul et moins de temps d'entraînement."
  options:
    a:
      en: "An adapted model still has to be evaluated on the new task before deployment."
      fr: "Un modèle adapté doit toujours être évalué sur la nouvelle tâche avant le déploiement."
    b:
      en: "A deployed model does not retrain itself; new images require another training run."
      fr: "Un modèle déployé ne se réentraîne pas lui-même ; de nouvelles images nécessitent un nouvel entraînement."
    d:
      en: "Transfer learning improves results with little data, but no technique guarantees that predictions are never wrong."
      fr: "L'apprentissage par transfert améliore les résultats avec peu de données, mais aucune technique ne garantit des prédictions toujours justes."
references:
  - title: What is Transfer Learning? - Transfer Learning in Machine Learning Explained - AWS
    url: https://aws.amazon.com/what-is/transfer-learning/
