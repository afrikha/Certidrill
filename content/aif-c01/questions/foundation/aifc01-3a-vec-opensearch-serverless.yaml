id: aifc01-3a-vec-opensearch-serverless
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company needs to store the embeddings of its documents and run k-nearest neighbor (k-NN) similarity searches on them for a generative AI application. The company does not want to manage clusters or servers.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise doit stocker les intégrations (embeddings) de ses documents et y exécuter des recherches de similarité k plus proches voisins (k-NN) pour une application d'IA générative. L'entreprise ne veut gérer ni clusters ni serveurs.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon S3 Glacier Deep Archive" }
    - { id: b, text: "AWS Glue DataBrew" }
    - { id: c, text: "Amazon OpenSearch Serverless" }
    - { id: d, text: "Amazon Comprehend" }
answer: { optionId: c }
explanation:
  correct:
    en: "The vector search collection type of Amazon OpenSearch Serverless performs scalable similarity searches with the k-NN feature of OpenSearch, without managing the underlying vector database infrastructure. It supports Euclidean distance, cosine similarity, and dot product, and Amazon Bedrock Knowledge Bases can create such a collection for a knowledge base."
    fr: "Le type de collection de recherche vectorielle d'Amazon OpenSearch Serverless exécute des recherches de similarité évolutives avec la fonctionnalité k-NN d'OpenSearch, sans gérer l'infrastructure de base de données vectorielle sous-jacente. Il prend en charge la distance euclidienne, la similarité cosinus et le produit scalaire, et Amazon Bedrock Knowledge Bases peut créer une telle collection pour une base de connaissances."
  options:
    a:
      en: "S3 Glacier Deep Archive is a storage class for long-term archives with retrieval times of hours; it does not run similarity searches."
      fr: "S3 Glacier Deep Archive est une classe de stockage pour l'archivage à long terme, avec des délais de récupération de plusieurs heures ; elle n'exécute pas de recherches de similarité."
    b:
      en: "AWS Glue DataBrew is a visual tool to clean and normalize data; it does not store or search vectors."
      fr: "AWS Glue DataBrew est un outil visuel de nettoyage et de normalisation des données ; il ne stocke ni ne recherche de vecteurs."
    d:
      en: "Amazon Comprehend extracts insights such as entities and sentiment from text; it is not a vector store."
      fr: "Amazon Comprehend extrait des informations comme les entités et le sentiment à partir de texte ; ce n'est pas un magasin de vecteurs."
references:
  - title: Working with vector search collections
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vector-search.html
