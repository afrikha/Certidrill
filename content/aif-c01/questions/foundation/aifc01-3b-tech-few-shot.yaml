id: aifc01-3b-tech-few-shot
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A support team wants a foundation model to assign each ticket to a category. The prompt lists three tickets, each followed by its correct category, and then the new ticket to classify.

    Which prompt engineering technique does the team use?
  fr: |
    Une équipe de support veut qu'un modèle de fondation affecte chaque ticket à une catégorie. L'invite liste trois tickets, chacun suivi de sa catégorie correcte, puis le nouveau ticket à classer.

    Quelle technique d'ingénierie de requête l'équipe utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Zero-shot prompting", fr: "Invite zero-shot" } }
    - { id: b, text: { en: "Prompt template", fr: "Modèle d'invite" } }
    - { id: c, text: { en: "Chain-of-thought prompting", fr: "Invite à chaîne de pensée (chain-of-thought)" } }
    - { id: d, text: { en: "Few-shot prompting", fr: "Invite few-shot" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Few-shot prompting, also called in-context learning, places a few example inputs with their expected outputs in the prompt. The model follows the pattern of the examples to produce the output for the new input."
    fr: "L'invite few-shot, aussi appelée apprentissage en contexte, place dans l'invite quelques exemples d'entrées avec leurs sorties attendues. Le modèle suit le schéma des exemples pour produire la sortie de la nouvelle entrée."
  options:
    a:
      en: "A zero-shot prompt contains no examples."
      fr: "Une invite zero-shot ne contient aucun exemple."
    b:
      en: "A prompt template is a reusable prompt with placeholders filled at run time; using examples is a different technique."
      fr: "Un modèle d'invite est une invite réutilisable avec des espaces réservés remplis à l'exécution ; l'utilisation d'exemples est une autre technique."
    c:
      en: "Chain-of-thought asks the model to show intermediate reasoning steps; the prompt only shows labeled tickets."
      fr: "La chaîne de pensée demande au modèle de montrer des étapes de raisonnement intermédiaires ; l'invite montre seulement des tickets étiquetés."
references:
  - title: Provide examples (few-shot prompting)
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-examples.html
