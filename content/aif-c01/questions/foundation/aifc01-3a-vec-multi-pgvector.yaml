id: aifc01-3a-vec-multi-pgvector
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A database team wants to use the open-source pgvector extension to store embeddings and run similarity searches in a managed AWS database.

    Which two AWS services support the pgvector extension? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe de bases de données veut utiliser l'extension open source pgvector pour stocker des intégrations et exécuter des recherches de similarité dans une base de données AWS gérée.

    Quels sont les deux services AWS qui prennent en charge l'extension pgvector ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Amazon RDS for PostgreSQL" }
    - { id: b, text: "Amazon Neptune Analytics" }
    - { id: c, text: "Amazon DocumentDB (with MongoDB compatibility)" }
    - { id: d, text: "Amazon Aurora PostgreSQL-Compatible Edition" }
    - { id: e, text: "Amazon S3 Vectors" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "pgvector is a PostgreSQL extension, so it runs on the PostgreSQL engines: Amazon RDS for PostgreSQL and Amazon Aurora PostgreSQL-Compatible Edition. Both can then store embeddings next to relational data and run vector similarity searches with SQL."
    fr: "pgvector est une extension PostgreSQL : elle fonctionne donc sur les moteurs PostgreSQL, Amazon RDS for PostgreSQL et Amazon Aurora PostgreSQL-Compatible Edition. Les deux peuvent alors stocker des intégrations à côté des données relationnelles et exécuter des recherches de similarité vectorielle en SQL."
  options:
    b:
      en: "Neptune Analytics has its own native vector index for graphs; it is not a PostgreSQL engine and does not use pgvector."
      fr: "Neptune Analytics dispose de son propre index vectoriel natif pour les graphes ; ce n'est pas un moteur PostgreSQL et il n'utilise pas pgvector."
    c:
      en: "DocumentDB offers native vector search through its MongoDB-compatible API, not through the pgvector extension."
      fr: "DocumentDB offre une recherche vectorielle native par son API compatible avec MongoDB, pas par l'extension pgvector."
    e:
      en: "S3 Vectors stores vectors in vector buckets and indexes; it is not a PostgreSQL database."
      fr: "S3 Vectors stocke des vecteurs dans des compartiments et des index vectoriels ; ce n'est pas une base de données PostgreSQL."
references:
  - title: Vector database options
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/choosing-an-aws-vector-database-for-rag-use-cases/vector-db-options.html
