id: aifc01-3a-inf-temp-high
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing team uses a foundation model (FM) to brainstorm slogans for a new product. The slogans that the model generates are very similar to each other. The team wants more varied and creative suggestions.

    Which inference parameter change will meet this requirement?
  fr: |
    Une équipe marketing utilise un modèle de fondation (FM) pour trouver des slogans pour un nouveau produit. Les slogans générés par le modèle se ressemblent beaucoup. L'équipe veut des suggestions plus variées et plus créatives.

    Quelle modification des paramètres d'inférence répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Decrease the top P value to 0.1.", fr: "Diminuer la valeur de top P à 0,1." } }
    - { id: b, text: { en: "Decrease the maximum tokens value.", fr: "Diminuer le nombre maximal de jetons." } }
    - { id: c, text: { en: "Increase the temperature value.", fr: "Augmenter la valeur de la température." } }
    - { id: d, text: { en: "Add more stop sequences.", fr: "Ajouter des séquences d'arrêt." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A higher temperature flattens the probability distribution of the next token, so the model becomes more likely to select lower-probability tokens. The responses become more random and diverse, which suits creative tasks such as brainstorming."
    fr: "Une température plus élevée aplatit la distribution de probabilité du jeton suivant : le modèle devient plus susceptible de sélectionner des jetons moins probables. Les réponses deviennent plus aléatoires et plus diverses, ce qui convient aux tâches créatives comme la recherche d'idées."
  options:
    a:
      en: "A top P of 0.1 restricts the choice to the few most probable tokens, which makes the output less varied."
      fr: "Un top P de 0,1 limite le choix aux quelques jetons les plus probables, ce qui rend la sortie moins variée."
    b:
      en: "A lower maximum tokens value only shortens the responses; it does not make them more diverse."
      fr: "Un nombre maximal de jetons plus faible ne fait que raccourcir les réponses ; il ne les rend pas plus diverses."
    d:
      en: "Stop sequences end generation at given strings; they do not change how the model chooses tokens."
      fr: "Les séquences d'arrêt mettent fin à la génération à des chaînes données ; elles ne changent pas la façon dont le modèle choisit les jetons."
references:
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
