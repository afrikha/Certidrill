id: aifc01-3c-pm-variables
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company stores a prompt in Amazon Bedrock Prompt Management to generate product descriptions. The application must supply a different product name and target audience for each request without creating a separate prompt for every product.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vente au détail stocke une invite dans Amazon Bedrock Prompt Management pour générer des descriptions de produits. L'application doit fournir un nom de produit et un public cible différents à chaque requête, sans créer une invite distincte pour chaque produit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a prompt variant for each product and audience combination.", fr: "Créer une variante d'invite pour chaque combinaison de produit et de public." } }
    - { id: b, text: { en: "Create a new prompt version each time a product is added to the catalog.", fr: "Créer une nouvelle version de l'invite chaque fois qu'un produit est ajouté au catalogue." } }
    - { id: c, text: { en: "Add variables in double curly braces to the prompt and pass their values at runtime.", fr: "Ajouter des variables entre doubles accolades dans l'invite et transmettre leurs valeurs à l'exécution." } }
    - { id: d, text: { en: "Attach a knowledge base that contains the product catalog to the prompt.", fr: "Associer à l'invite une base de connaissances qui contient le catalogue de produits." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A variable is a placeholder written in double curly braces, such as {{product_name}}. You fill in the variable values when you test the prompt or when the application invokes the prompt, so one stored prompt serves every product and audience."
    fr: "Une variable est un espace réservé écrit entre doubles accolades, par exemple {{product_name}}. Vous renseignez les valeurs des variables quand vous testez l'invite ou quand l'application l'appelle : une seule invite stockée sert alors pour tous les produits et tous les publics."
  options:
    a:
      en: "A variant is an alternative configuration (message, model or inference settings) compared during testing; one variant per product would not scale and does not insert values at runtime."
      fr: "Une variante est une autre configuration (message, modèle ou paramètres d'inférence) comparée pendant les tests ; une variante par produit ne passe pas à l'échelle et n'insère pas de valeurs à l'exécution."
    b:
      en: "A version is a snapshot of the prompt for deployment; creating one per product multiplies prompts instead of parameterizing a single one."
      fr: "Une version est un instantané de l'invite destiné au déploiement ; en créer une par produit multiplie les invites au lieu d'en paramétrer une seule."
    d:
      en: "A knowledge base retrieves documents for RAG; it does not replace placeholders in a prompt template with values supplied by the application."
      fr: "Une base de connaissances récupère des documents pour le RAG ; elle ne remplace pas les espaces réservés d'un modèle d'invite par des valeurs fournies par l'application."
references:
  - title: Create a prompt using Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-create.html
