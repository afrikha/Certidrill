id: aifc01-3d-poc-define-goals
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company plans a proof of concept (PoC) in which an FM drafts product descriptions. The company wants the PoC to show clearly whether the FM meets its business objective.

    What should the company do before it builds the PoC?
  fr: |
    Une enseigne de distribution prévoit une preuve de concept (PoC) dans laquelle un FM rédige des descriptions de produits. L'entreprise veut que la PoC montre clairement si le FM répond à son objectif métier.

    Que doit faire l'entreprise avant de créer la PoC ?
body:
  options:
    - { id: a, text: { en: "Select the FM that has the highest score on public benchmarks.", fr: "Sélectionner le FM qui obtient le meilleur score sur des bancs d'essai publics." } }
    - { id: b, text: { en: "Define a measurable goal tied to the objective and the thresholds that decide go or no-go.", fr: "Définir un objectif mesurable lié à l'objectif métier et les seuils qui décident de la poursuite ou de l'arrêt." } }
    - { id: c, text: { en: "Fine-tune the FM on the full product catalog to get the best possible results.", fr: "Affiner le FM sur tout le catalogue de produits pour obtenir les meilleurs résultats possibles." } }
    - { id: d, text: { en: "Complete the PoC first, and then choose the metrics that reflect its results.", fr: "Terminer d'abord la PoC, puis choisir les métriques qui reflètent ses résultats." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS guidance treats a PoC as an experiment that validates business value. Each measurement must trace back to a business outcome through a quantifiable goal (for example, a target reduction in time per description), and the exit criteria for quality, latency and cost are set up front."
    fr: "Les recommandations AWS traitent une PoC comme une expérience qui valide une valeur métier. Chaque mesure doit se rattacher à un résultat métier par un objectif chiffré (par exemple, une réduction visée du temps par description), et les critères de sortie de qualité, de latence et de coût sont fixés dès le départ."
  options:
    a:
      en: "A public benchmark score does not show whether the FM helps this company reach its own goal."
      fr: "Un score sur un banc d'essai public ne montre pas si le FM aide cette entreprise à atteindre son propre objectif."
    c:
      en: "Fine-tuning before defining success adds cost and effort without a way to know whether the result is good enough."
      fr: "Affiner le modèle avant de définir le succès ajoute du coût et de l'effort sans moyen de savoir si le résultat est suffisant."
    d:
      en: "Choosing metrics after the results makes the PoC unable to prove business value and invites sunk-cost decisions."
      fr: "Choisir les métriques après les résultats empêche la PoC de prouver une valeur métier et favorise les décisions dictées par les coûts déjà engagés."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
