id: aifc01-3b-pc-system-prompt
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank is building a conversational assistant. In every turn of every conversation, the assistant must keep a formal tone, discuss only the bank's credit card products, and answer in no more than five sentences. Users must not have to repeat these rules.

    Where should the bank define these rules?
  fr: |
    Une banque crée un assistant conversationnel. À chaque tour de chaque conversation, l'assistant doit garder un ton formel, ne parler que des cartes de crédit de la banque et répondre en cinq phrases au maximum. Les utilisateurs ne doivent pas avoir à répéter ces règles.

    Où la banque doit-elle définir ces règles ?
body:
  options:
    - { id: a, text: { en: "In a negative prompt that lists every topic the assistant must avoid", fr: "Dans une invite négative qui liste tous les sujets que l'assistant doit éviter" } }
    - { id: b, text: { en: "In few-shot examples added to the first user message of each session", fr: "Dans des exemples few-shot ajoutés au premier message utilisateur de chaque session" } }
    - { id: c, text: { en: "In the system prompt that the application sends with every request", fr: "Dans l'invite système que l'application envoie avec chaque requête" } }
    - { id: d, text: { en: "In the inference parameters of each model invocation", fr: "Dans les paramètres d'inférence de chaque invocation du modèle" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The system prompt holds standing instructions that define the model's persona, scope, rules, and response format. It applies across all user turns and takes precedence over conflicting instructions in user prompts."
    fr: "L'invite système contient les instructions permanentes qui définissent la persona, le périmètre, les règles et le format de réponse du modèle. Elle s'applique à tous les tours de l'utilisateur et prévaut sur les instructions contradictoires des invites utilisateur."
  options:
    a:
      en: "A list of topics to avoid covers only part of the rules (scope), not the tone or the length, and an exhaustive list of excluded topics is impractical."
      fr: "Une liste de sujets à éviter ne couvre qu'une partie des règles (le périmètre), ni le ton ni la longueur, et une liste exhaustive de sujets exclus est irréaliste."
    b:
      en: "Examples in the first message show a style but do not state the rules, and they apply to that message rather than to the whole conversation."
      fr: "Des exemples dans le premier message montrent un style mais n'énoncent pas les règles, et ils s'appliquent à ce message plutôt qu'à toute la conversation."
    d:
      en: "Inference parameters such as temperature or maximum length tune generation; they cannot express the tone or the allowed topics."
      fr: "Les paramètres d'inférence comme la température ou la longueur maximale règlent la génération ; ils ne peuvent pas exprimer le ton ni les sujets autorisés."
references:
  - title: Using the system role
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-system-role.html
