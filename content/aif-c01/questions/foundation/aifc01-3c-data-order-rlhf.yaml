id: aifc01-3c-data-order-rlhf
objective: "3.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company wants to align a pre-trained language model with human preferences by using reinforcement learning from human feedback (RLHF).

    Select and order the FOUR steps of the RLHF process from the following list. Each step should be selected one time or not at all.
  fr: |
    Une entreprise veut aligner un modèle de langage préentraîné sur les préférences humaines à l'aide de l'apprentissage par renforcement à partir des commentaires humains (RLHF).

    Sélectionnez les QUATRE étapes du processus RLHF dans la liste suivante et classez-les dans l'ordre. Chaque étape doit être sélectionnée une fois ou pas du tout.
body:
  count: 4
  actions:
    - { id: reward, text: { en: "Have humans rank several responses to the same prompt and train a reward model.", fr: "Faire classer par des humains plusieurs réponses à la même invite et entraîner un modèle de récompense." } }
    - { id: collect, text: { en: "Collect prompts and human-written reference responses.", fr: "Collecter des invites et des réponses de référence rédigées par des humains." } }
    - { id: policy, text: { en: "Optimize the language model so that it maximizes the reward model's score.", fr: "Optimiser le modèle de langage pour qu'il maximise le score du modèle de récompense." } }
    - { id: web, text: { en: "Pre-train the reward model on unlabeled web text only.", fr: "Préentraîner le modèle de récompense uniquement sur du texte web non étiqueté." } }
    - { id: sft, text: { en: "Fine-tune the model on the prompts and reference responses.", fr: "Peaufiner le modèle sur les invites et les réponses de référence." } }
    - { id: temp, text: { en: "Lower the temperature so that the model follows human preferences.", fr: "Baisser la température pour que le modèle suive les préférences humaines." } }
answer:
  sequence: [ collect, sft, reward, policy ]
explanation:
  correct:
    en: "RLHF starts with data collection: humans write prompts and reference responses. The model is then fine-tuned on them. Next, humans rank several responses to the same prompt, and these rankings train a reward model. Finally, the language model is optimized to produce the responses that the reward model scores highest."
    fr: "Le RLHF commence par la collecte de données : des humains rédigent des invites et des réponses de référence. Le modèle est ensuite peaufiné sur ces données. Puis des humains classent plusieurs réponses à la même invite, et ces classements entraînent un modèle de récompense. Enfin, le modèle de langage est optimisé pour produire les réponses auxquelles le modèle de récompense attribue les meilleurs scores."
  options:
    web:
      en: "The reward model learns from human comparison and ranking data; unlabeled web text carries no human preference."
      fr: "Le modèle de récompense apprend à partir de données humaines de comparaison et de classement ; du texte web non étiqueté ne contient aucune préférence humaine."
    temp:
      en: "Temperature only changes the randomness of the output at inference; it does not align the model with preferences."
      fr: "La température change seulement le caractère aléatoire de la sortie à l'inférence ; elle n'aligne pas le modèle sur des préférences."
references:
  - title: What is RLHF? - Reinforcement Learning from Human Feedback Explained - AWS
    url: https://aws.amazon.com/what-is/reinforcement-learning-from-human-feedback/
