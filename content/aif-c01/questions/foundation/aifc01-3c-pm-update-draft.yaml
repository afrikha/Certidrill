id: aifc01-3c-pm-update-draft
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A prompt in Amazon Bedrock Prompt Management has versions 1 and 2. The production application invokes the ARN of version 2. A developer sends an UpdatePrompt request that changes the prompt message and the temperature.

    What is the result of the request?
  fr: |
    Une invite d'Amazon Bedrock Prompt Management possède les versions 1 et 2. L'application de production appelle l'ARN de la version 2. Un développeur envoie une requête UpdatePrompt qui modifie le message de l'invite et la température.

    Quel est le résultat de la requête ?
body:
  options:
    - { id: a, text: { en: "Version 2 is modified in place, and production uses the new message immediately.", fr: "La version 2 est modifiée sur place, et la production utilise immédiatement le nouveau message." } }
    - { id: b, text: { en: "Amazon Bedrock creates version 3 automatically and redirects production to it.", fr: "Amazon Bedrock crée automatiquement la version 3 et y redirige la production." } }
    - { id: c, text: { en: "The request fails, because a prompt that has versions cannot be modified.", fr: "La requête échoue, car une invite qui possède des versions ne peut pas être modifiée." } }
    - { id: d, text: { en: "The DRAFT is modified, and production keeps using version 2 unchanged.", fr: "Le brouillon (DRAFT) est modifié, et la production continue d'utiliser la version 2 inchangée." } }
answer: { optionId: d }
explanation:
  correct:
    en: "UpdatePrompt modifies the DRAFT version of the prompt. Numbered versions are snapshots of the draft taken with CreatePromptVersion, so version 2 and the production application are not affected. To release the change, the team creates version 3 from the draft and points the application to it."
    fr: "UpdatePrompt modifie la version DRAFT de l'invite. Les versions numérotées sont des instantanés du brouillon pris avec CreatePromptVersion : la version 2 et l'application de production ne sont donc pas affectées. Pour publier le changement, l'équipe crée la version 3 à partir du brouillon et y fait pointer l'application."
  options:
    a:
      en: "A version is a point-in-time snapshot; UpdatePrompt writes to the DRAFT, not to version 2."
      fr: "Une version est un instantané à un instant donné ; UpdatePrompt écrit dans le brouillon, pas dans la version 2."
    b:
      en: "Versions are created only when someone calls CreatePromptVersion or chooses Create version, and the application keeps the ARN it was given."
      fr: "Les versions ne sont créées que lorsque quelqu'un appelle CreatePromptVersion ou choisit Create version, et l'application conserve l'ARN qui lui a été fourni."
    c:
      en: "A prompt with versions can still be modified: the changes go to its draft."
      fr: "Une invite qui possède des versions peut toujours être modifiée : les changements vont dans son brouillon."
references:
  - title: UpdatePrompt
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_UpdatePrompt.html
  - title: Create a version of a prompt in Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-version-create.html
