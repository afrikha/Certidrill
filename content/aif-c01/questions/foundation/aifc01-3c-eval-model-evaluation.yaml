id: aifc01-3c-eval-model-evaluation
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must choose between two foundation models (FMs) in Amazon Bedrock for a question answering application. The company wants to run both models on the same prompts and compare scores for accuracy, robustness, and toxicity in a managed way.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit choisir entre deux modèles de fondation (FM) d'Amazon Bedrock pour une application de questions-réponses. Elle veut exécuter les deux modèles sur les mêmes invites et comparer des scores d'exactitude, de robustesse et de toxicité de manière gérée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Bedrock Model Evaluation" }
    - { id: b, text: "Amazon Bedrock Guardrails" }
    - { id: c, text: "Amazon Bedrock Prompt Management" }
    - { id: d, text: "Amazon CloudWatch" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock evaluations measure the performance of models. An automatic model evaluation job runs a model on a built-in or custom prompt dataset for a task type, such as question and answer, and computes metrics for accuracy, robustness, and toxicity, so the company can compare the two models."
    fr: "Les évaluations d'Amazon Bedrock mesurent les performances des modèles. Une tâche d'évaluation automatique de modèle exécute un modèle sur un jeu de données d'invites intégré ou personnalisé pour un type de tâche, comme les questions-réponses, et calcule des métriques d'exactitude, de robustesse et de toxicité : l'entreprise peut ainsi comparer les deux modèles."
  options:
    b:
      en: "Guardrails filter content in prompts and responses at run time; they do not score and compare models."
      fr: "Guardrails filtre le contenu des invites et des réponses à l'exécution ; il ne note pas et ne compare pas des modèles."
    c:
      en: "Prompt Management can compare prompt variants by showing their outputs, but it does not compute accuracy, robustness, or toxicity scores."
      fr: "Prompt Management peut comparer des variantes d'invite en affichant leurs sorties, mais il ne calcule pas de scores d'exactitude, de robustesse ou de toxicité."
    d:
      en: "CloudWatch monitors operational metrics such as invocations and latency, not the quality of the responses."
      fr: "CloudWatch surveille des métriques opérationnelles comme les appels et la latence, pas la qualité des réponses."
references:
  - title: Evaluate the performance of Amazon Bedrock resources
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
  - title: Model evaluation task types in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
