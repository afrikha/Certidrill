id: aifc01-3a-rag-reranking
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon Bedrock knowledge base often returns the passages that answer a question, but ranks them below less relevant passages. Only the three highest-ranked passages fit in the prompt that the company sends to the foundation model. The company wants to improve the answers without re-ingesting its documents.

    Which solution will meet these requirements?
  fr: |
    La base de connaissances Amazon Bedrock d'une entreprise renvoie souvent les passages qui répondent à une question, mais les classe derrière des passages moins pertinents. Seuls les trois passages les mieux classés tiennent dans l'invite que l'entreprise envoie au modèle de fondation. L'entreprise veut améliorer les réponses sans réingérer ses documents.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use a reranking model to reorder the retrieved results by relevance to the question.", fr: "Utiliser un modèle de reclassement (reranking) pour réordonner les résultats récupérés selon leur pertinence pour la question." } }
    - { id: b, text: { en: "Pass more of the retrieved results to the foundation model in each prompt.", fr: "Transmettre davantage de résultats récupérés au modèle de fondation dans chaque invite." } }
    - { id: c, text: { en: "Change the chunking strategy of the data source to semantic chunking.", fr: "Changer la stratégie de découpage de la source de données pour le découpage sémantique." } }
    - { id: d, text: { en: "Switch to an embeddings model that produces vectors with more dimensions.", fr: "Passer à un modèle d'intégration qui produit des vecteurs de plus grande dimension." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock Knowledge Bases can use reranking models to influence the results retrieved from the data source. A reranker scores the retrieved passages against the query and reorders them, so the relevant passages move into the top three that fit in the prompt. It works at query time, so the documents do not need to be ingested again."
    fr: "Amazon Bedrock Knowledge Bases peut utiliser des modèles de reclassement pour influencer les résultats récupérés dans la source de données. Un modèle de reclassement note les passages récupérés au regard de la requête et les réordonne : les passages pertinents remontent ainsi parmi les trois qui tiennent dans l'invite. Il agit au moment de la requête : les documents n'ont donc pas besoin d'être ingérés à nouveau."
  options:
    b:
      en: "Only three passages fit in the prompt, so passing more results is not possible."
      fr: "Seuls trois passages tiennent dans l'invite : transmettre davantage de résultats n'est donc pas possible."
    c:
      en: "A new chunking strategy applies only when the documents are parsed, chunked, and embedded again, which the company wants to avoid."
      fr: "Une nouvelle stratégie de découpage ne s'applique que si les documents sont de nouveau analysés, découpés et vectorisés, ce que l'entreprise veut éviter."
    d:
      en: "New embeddings require every document to be embedded and indexed again, which is a re-ingestion."
      fr: "De nouvelles intégrations exigent que chaque document soit de nouveau vectorisé et indexé, ce qui est une réingestion."
references:
  - title: Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
  - title: Sync your data with your Amazon Bedrock knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-ingest.html
