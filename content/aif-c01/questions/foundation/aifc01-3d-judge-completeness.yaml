id: aifc01-3d-judge-completeness
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A utility company's customers often ask several questions in one chat message. The company runs an Amazon Bedrock model evaluation job that uses an LLM as a judge. It wants a built-in metric that measures how well each response answers every question in the prompt.

    Which metric should the company select?
  fr: |
    Les clients d'un fournisseur d'énergie posent souvent plusieurs questions dans un même message de chat. L'entreprise exécute une tâche d'évaluation de modèle Amazon Bedrock qui utilise un LLM comme juge. Elle veut une métrique intégrée qui mesure dans quelle mesure chaque réponse répond à toutes les questions de l'invite.

    Quelle métrique l'entreprise doit-elle sélectionner ?
body:
  options:
    - { id: a, text: "Relevance" }
    - { id: b, text: "Following instructions" }
    - { id: c, text: "Logical coherence" }
    - { id: d, text: "Completeness" }
answer: { optionId: d }
explanation:
  correct:
    en: "The Completeness metric measures how well the model's response answers every question in the prompt. If the prompt dataset contains a reference response, the evaluator model also takes it into account."
    fr: "La métrique Completeness mesure dans quelle mesure la réponse du modèle répond à chaque question de l'invite. Si le jeu de données d'invites contient une réponse de référence, le modèle évaluateur en tient aussi compte."
  options:
    a:
      en: "Relevance measures how relevant the answer is to the prompt; a relevant answer can still skip one of the questions."
      fr: "Relevance mesure la pertinence de la réponse par rapport à l'invite ; une réponse pertinente peut tout de même ignorer l'une des questions."
    b:
      en: "Following instructions measures whether the response respects the exact directions in the prompt, such as a format, not whether every question is answered."
      fr: "Following instructions mesure si la réponse respecte les consignes exactes de l'invite, comme un format, pas si chaque question reçoit une réponse."
    c:
      en: "Logical coherence looks for logical gaps, inconsistencies and contradictions in the response."
      fr: "Logical coherence recherche les lacunes logiques, incohérences et contradictions dans la réponse."
references:
  - title: Use metrics to understand model performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
