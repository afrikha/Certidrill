id: aifc01-3b-pc-negative-define
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A design agency is learning prompt engineering terms. A team member asks what a negative prompt is.

    Which description is correct?
  fr: |
    Une agence de design apprend le vocabulaire de l'ingénierie de requête. Un membre de l'équipe demande ce qu'est une invite négative.

    Quelle description est correcte ?
body:
  options:
    - { id: a, text: { en: "A prompt that asks the model to give a critical or pessimistic opinion", fr: "Une invite qui demande au modèle de donner un avis critique ou pessimiste" } }
    - { id: b, text: { en: "A prompt that an attacker writes to make the model ignore its instructions", fr: "Une invite qu'un attaquant rédige pour que le modèle ignore ses instructions" } }
    - { id: c, text: { en: "A prompt that contains no examples of the expected output", fr: "Une invite qui ne contient aucun exemple de la sortie attendue" } }
    - { id: d, text: { en: "A prompt that states what the model must exclude or avoid in its output", fr: "Une invite qui indique ce que le modèle doit exclure ou éviter dans sa sortie" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A negative prompt tells the model what not to produce, such as objects to leave out of an image (the negativeText parameter of Amazon Nova Canvas) or content and topics to avoid in a text response."
    fr: "Une invite négative indique au modèle ce qu'il ne doit pas produire, par exemple des objets à exclure d'une image (le paramètre negativeText d'Amazon Nova Canvas) ou du contenu et des sujets à éviter dans une réponse textuelle."
  options:
    a:
      en: "The tone of the requested opinion has nothing to do with negative prompts."
      fr: "Le ton de l'avis demandé n'a rien à voir avec les invites négatives."
    b:
      en: "This describes prompt injection, an attack, not a prompt engineering construct."
      fr: "Cela décrit l'injection d'invite, une attaque, et non une construction de l'ingénierie de requête."
    c:
      en: "A prompt without examples is a zero-shot prompt."
      fr: "Une invite sans exemple est une invite zero-shot."
references:
  - title: Amazon Nova Canvas prompting best practices
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-image-generation.html
