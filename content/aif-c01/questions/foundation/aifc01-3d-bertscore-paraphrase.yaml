id: aifc01-3d-bertscore-paraphrase
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company evaluates the answers of its FM-based help assistant against reference answers by using ROUGE. Reviewers notice that many correct answers receive low scores because they use different words than the reference answers.

    Which metric will BEST score the answers by their meaning instead of their exact wording?
  fr: |
    Un éditeur de logiciels évalue les réponses de son assistant d'aide basé sur un FM par rapport à des réponses de référence à l'aide de ROUGE. Les relecteurs constatent que de nombreuses réponses correctes obtiennent des scores faibles parce qu'elles emploient d'autres mots que les réponses de référence.

    Quelle métrique notera le MIEUX les réponses selon leur sens plutôt que selon leur formulation exacte ?
body:
  options:
    - { id: a, text: "BLEU" }
    - { id: b, text: "ROUGE-L" }
    - { id: c, text: { en: "Exact match", fr: "Correspondance exacte (exact match)" } }
    - { id: d, text: "BERTScore" }
answer: { optionId: d }
explanation:
  correct:
    en: "BERTScore computes the similarity between the token embeddings of the generated text and of the reference text. Because embeddings represent meaning, it captures semantic similarity better than n-gram overlap and does not penalize a correct paraphrase as much."
    fr: "BERTScore calcule la similarité entre les vectorisations (embeddings) des jetons du texte généré et ceux du texte de référence. Comme les vectorisations représentent le sens, il mesure mieux la similarité sémantique que le recouvrement de n-grammes et pénalise beaucoup moins une reformulation correcte."
  options:
    a:
      en: "BLEU also counts n-gram overlap with the reference, so a correct answer worded differently still scores low."
      fr: "BLEU compte lui aussi le recouvrement de n-grammes avec la référence : une réponse correcte formulée autrement obtient toujours un score faible."
    b:
      en: "ROUGE-L is a ROUGE variant based on word sequences; it keeps the same weakness with rephrased answers."
      fr: "ROUGE-L est une variante de ROUGE fondée sur des séquences de mots ; elle garde la même faiblesse face aux réponses reformulées."
    c:
      en: "Exact match is even stricter: any difference in wording makes the answer count as wrong."
      fr: "La correspondance exacte est encore plus stricte : toute différence de formulation fait compter la réponse comme fausse."
references:
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
