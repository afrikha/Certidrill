id: aifc01-3a-inf-temp-low
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank uses a foundation model (FM) on Amazon Bedrock to answer customer questions from approved text. The answers to the same question vary from one request to the next. The bank wants more consistent and predictable answers.

    Which inference parameter change will meet this requirement?
  fr: |
    Une banque utilise un modèle de fondation (FM) sur Amazon Bedrock pour répondre aux questions des clients à partir de textes approuvés. Les réponses à une même question varient d'une requête à l'autre. La banque veut des réponses plus cohérentes et plus prévisibles.

    Quelle modification des paramètres d'inférence répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Increase the temperature.", fr: "Augmenter la température." } }
    - { id: b, text: { en: "Increase the maximum tokens.", fr: "Augmenter le nombre maximal de jetons." } }
    - { id: c, text: { en: "Add a stop sequence.", fr: "Ajouter une séquence d'arrêt." } }
    - { id: d, text: { en: "Decrease the temperature.", fr: "Diminuer la température." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Temperature changes the shape of the probability distribution from which the model picks each next token. A lower temperature favors higher-probability tokens and makes responses more deterministic, so the same question produces more consistent answers."
    fr: "La température modifie la forme de la distribution de probabilité dans laquelle le modèle choisit chaque jeton suivant. Une température plus basse favorise les jetons les plus probables et rend les réponses plus déterministes : une même question produit donc des réponses plus cohérentes."
  options:
    a:
      en: "A higher temperature flattens the distribution and makes the model more likely to choose lower-probability tokens, so answers vary more."
      fr: "Une température plus élevée aplatit la distribution et rend le modèle plus susceptible de choisir des jetons moins probables : les réponses varient donc davantage."
    b:
      en: "The maximum tokens value limits the length of the response; it does not make the content more consistent."
      fr: "Le nombre maximal de jetons limite la longueur de la réponse ; il ne rend pas le contenu plus cohérent."
    c:
      en: "A stop sequence ends generation when a given string appears; it does not reduce the randomness of the tokens chosen before it."
      fr: "Une séquence d'arrêt met fin à la génération quand une chaîne donnée apparaît ; elle ne réduit pas le caractère aléatoire des jetons choisis avant elle."
references:
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
