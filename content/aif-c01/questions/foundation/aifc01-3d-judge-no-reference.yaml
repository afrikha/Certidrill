id: aifc01-3d-judge-no-reference
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company wants to rate 20,000 chatbot responses for helpfulness and professional tone each week. No reference answers exist for these conversations, and review by employees is too slow for this volume.

    Which evaluation approach will meet these requirements?
  fr: |
    Une entreprise de commerce en ligne veut noter chaque semaine 20 000 réponses de son chatbot selon leur utilité et leur ton professionnel. Il n'existe aucune réponse de référence pour ces conversations, et une revue par des employés est trop lente pour ce volume.

    Quelle approche d'évaluation répond à ces exigences ?
body:
  options:
    - { id: a, text: "ROUGE" }
    - { id: b, text: "LLM-as-a-judge" }
    - { id: c, text: "BLEU" }
    - { id: d, text: "BERTScore" }
answer: { optionId: b }
explanation:
  correct:
    en: "With LLM-as-a-judge, an evaluator model scores each response against criteria such as helpfulness, relevance or style and tone, and explains its score. It does not always need ground truth, and it scales to large volumes at a lower cost than human review."
    fr: "Avec LLM-as-a-judge, un modèle évaluateur note chaque réponse selon des critères comme l'utilité, la pertinence ou le style et le ton, et explique sa note. Il n'a pas toujours besoin de vérité terrain (ground truth) et s'adapte à de gros volumes à un coût inférieur à celui d'une revue humaine."
  options:
    a:
      en: "ROUGE compares the response with a reference text, and no reference exists here; it also does not judge tone."
      fr: "ROUGE compare la réponse à un texte de référence, et il n'en existe pas ici ; il ne juge pas non plus le ton."
    c:
      en: "BLEU requires reference texts and is designed for translation, not for helpfulness or tone."
      fr: "BLEU nécessite des textes de référence et est conçu pour la traduction, pas pour l'utilité ou le ton."
    d:
      en: "BERTScore measures semantic similarity to a reference text, which does not exist for these conversations."
      fr: "BERTScore mesure la similarité sémantique avec un texte de référence, qui n'existe pas pour ces conversations."
references:
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
  - title: Evaluate model performance using another LLM as a judge
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
