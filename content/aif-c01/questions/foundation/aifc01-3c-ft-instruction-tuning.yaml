id: aifc01-3c-ft-instruction-tuning
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to improve how a pre-trained foundation model (FM) performs a specific task. The company will train the model on labeled examples formatted as prompt-response pairs that are phrased as instructions.

    Which fine-tuning method is the company using?
  fr: |
    Une entreprise veut améliorer la façon dont un modèle de fondation (FM) préentraîné exécute une tâche précise. Elle va entraîner le modèle sur des exemples étiquetés présentés sous forme de paires invite-réponse formulées comme des instructions.

    Quelle méthode de peaufinage l'entreprise utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Instruction tuning", fr: "Réglage par instructions (instruction tuning)" } }
    - { id: b, text: { en: "Domain adaptation fine-tuning", fr: "Peaufinage par adaptation au domaine" } }
    - { id: c, text: { en: "Continued pre-training", fr: "Préentraînement continu" } }
    - { id: d, text: { en: "Model distillation", fr: "Distillation de modèle" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Instruction-based fine-tuning uses labeled examples, formatted as prompt-response pairs phrased as instructions, to improve a pre-trained model on a specific task. The process modifies the model's weights. FLAN models are an example of instruction-tuned models."
    fr: "Le peaufinage fondé sur des instructions utilise des exemples étiquetés, présentés sous forme de paires invite-réponse formulées comme des instructions, pour améliorer un modèle préentraîné sur une tâche précise. Le processus modifie les pondérations du modèle. Les modèles FLAN sont un exemple de modèles réglés par instructions."
  options:
    b:
      en: "Domain adaptation fine-tuning trains on unlabeled domain text, such as reports, to learn specialized language, not on instruction pairs."
      fr: "Le peaufinage par adaptation au domaine s'entraîne sur du texte de domaine non étiqueté, comme des rapports, pour apprendre un langage spécialisé, pas sur des paires d'instructions."
    c:
      en: "Continued pre-training uses large volumes of unlabeled text with the original self-supervised objective."
      fr: "Le préentraînement continu utilise de grands volumes de texte non étiqueté avec l'objectif autosupervisé d'origine."
    d:
      en: "Distillation trains a smaller student model on the responses of a larger teacher model."
      fr: "La distillation entraîne un modèle élève plus petit sur les réponses d'un modèle enseignant plus grand."
references:
  - title: Fine-tune a large language model (LLM) using prompt instructions
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning-instruction-based.html
