id: aifc01-3d-order-business-evaluation
objective: "3.4.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A logistics company wants to determine whether an FM-based assistant that answers carrier emails meets its business objective of faster email handling.

    Which four actions should the company perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise de logistique veut déterminer si un assistant basé sur un FM qui répond aux e-mails des transporteurs répond à son objectif métier d'un traitement plus rapide des e-mails.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: tune
      text: { en: "Fine-tune the FM on all past carrier emails.", fr: "Affiner le FM sur tous les anciens e-mails des transporteurs." }
    - id: metric
      text: { en: "Define the business metric that reflects the objective, such as average handling time per email.", fr: "Définir la métrique métier qui reflète l'objectif, comme le temps moyen de traitement par e-mail." }
    - id: pilot
      text: { en: "Run a pilot of the assistant with a group of real users.", fr: "Mener un pilote de l'assistant avec un groupe d'utilisateurs réels." }
    - id: bench
      text: { en: "Select the FM that has the highest public benchmark score as the final model.", fr: "Sélectionner comme modèle définitif le FM qui obtient le meilleur score sur un banc d'essai public." }
    - id: base
      text: { en: "Measure the current value of that metric to establish a baseline.", fr: "Mesurer la valeur actuelle de cette métrique pour établir une référence." }
    - id: decide
      text: { en: "Compare the pilot results with the baseline and the target, and then decide to continue, pivot, or stop.", fr: "Comparer les résultats du pilote à la référence et à la cible, puis décider de poursuivre, de changer d'approche ou d'arrêter." }
answer:
  sequence: [metric, base, pilot, decide]
explanation:
  correct:
    en: "The business metric must be defined first, because a baseline can only be measured for a defined metric. The baseline is captured before the pilot, so that the pilot results can be compared with it and with the target. The final decision (continue, pivot or stop) is based on that comparison."
    fr: "La métrique métier doit être définie en premier, car on ne peut mesurer une référence que pour une métrique définie. La référence est mesurée avant le pilote, afin de pouvoir comparer les résultats du pilote avec elle et avec la cible. La décision finale (poursuivre, changer d'approche ou arrêter) repose sur cette comparaison."
  options:
    tune:
      en: "Fine-tuning is a customization choice; it is not needed to measure whether the FM meets the objective."
      fr: "L'affinage est un choix de personnalisation ; il n'est pas nécessaire pour mesurer si le FM répond à l'objectif."
    bench:
      en: "A public benchmark score does not measure the company's business objective."
      fr: "Un score sur un banc d'essai public ne mesure pas l'objectif métier de l'entreprise."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
  - title: Measuring the success of generative AI in software development
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-accelerate-software-dev-lifecycle-gen-ai/measuring-success.html
