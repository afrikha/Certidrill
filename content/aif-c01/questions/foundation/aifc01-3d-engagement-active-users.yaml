id: aifc01-3d-engagement-active-users
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company gives 2,000 employees access to an FM-based internal knowledge assistant. After three months, leadership asks whether employees are engaging with the assistant.

    Which metric will answer this question?
  fr: |
    Une entreprise industrielle donne à 2 000 employés l'accès à un assistant de connaissances interne basé sur un FM. Au bout de trois mois, la direction demande si les employés s'approprient l'assistant.

    Quelle métrique répond à cette question ?
body:
  options:
    - { id: a, text: { en: "The average InvocationLatency of the model calls", fr: "La valeur moyenne d'InvocationLatency des appels au modèle" } }
    - { id: b, text: { en: "The ROUGE score of the answers against reference answers", fr: "Le score ROUGE des réponses par rapport à des réponses de référence" } }
    - { id: c, text: { en: "The weekly active users as a share of the employees who have access", fr: "Les utilisateurs actifs par semaine, en proportion des employés qui ont accès" } }
    - { id: d, text: { en: "The number of documents in the knowledge base", fr: "Le nombre de documents de la base de connaissances" } }
answer: { optionId: c }
explanation:
  correct:
    en: "User engagement is measured by how many of the intended users actually use the solution and keep coming back, for example the adoption rate or the weekly active users. A technically good FM that people do not use does not meet the business objective."
    fr: "L'engagement des utilisateurs se mesure par le nombre d'utilisateurs visés qui utilisent réellement la solution et y reviennent, par exemple le taux d'adoption ou les utilisateurs actifs par semaine. Un FM techniquement bon que personne n'utilise ne répond pas à l'objectif métier."
  options:
    a:
      en: "Latency is a technical performance metric; it does not show whether employees use the assistant."
      fr: "La latence est une métrique de performance technique ; elle ne montre pas si les employés utilisent l'assistant."
    b:
      en: "ROUGE measures answer quality against references, not how many people use the assistant."
      fr: "ROUGE mesure la qualité des réponses par rapport à des références, pas le nombre de personnes qui utilisent l'assistant."
    d:
      en: "The size of the knowledge base is an input of the solution, not a measure of engagement."
      fr: "La taille de la base de connaissances est une entrée de la solution, pas une mesure de l'engagement."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
