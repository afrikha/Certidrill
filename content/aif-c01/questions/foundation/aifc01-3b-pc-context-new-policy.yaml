id: aifc01-3b-pc-context-new-policy
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes a two-page travel expense policy that took effect last week. Employees ask a foundation model questions about the policy, and the model invents rules because the policy did not exist when the model was trained. The company wants accurate answers immediately, without training a model.

    Which solution will meet these requirements?
  fr: |
    Une entreprise publie une politique de frais de déplacement de deux pages entrée en vigueur la semaine dernière. Les salariés posent des questions sur cette politique à un modèle de fondation, qui invente des règles parce que la politique n'existait pas lors de l'entraînement du modèle. L'entreprise veut des réponses exactes immédiatement, sans entraîner de modèle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the instruction \"Answer only with accurate information\" to the prompt.", fr: "Ajouter l'instruction « Réponds uniquement avec des informations exactes » à l'invite." } }
    - { id: b, text: { en: "Fine-tune the model on a set of questions and answers about the policy.", fr: "Peaufiner le modèle sur un ensemble de questions et de réponses sur la politique." } }
    - { id: c, text: { en: "Lower the temperature so that the model gives more predictable answers.", fr: "Baisser la température pour que le modèle donne des réponses plus prévisibles." } }
    - { id: d, text: { en: "Include the policy text in the prompt as context and ask the model to answer from it.", fr: "Inclure le texte de la politique dans l'invite comme contexte et demander au modèle d'y puiser ses réponses." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A model cannot know a document that appeared after its training. Supplying the short policy in the prompt as context gives the model the facts it needs, and instructing it to answer from that text grounds the response. This works immediately and requires no training."
    fr: "Un modèle ne peut pas connaître un document paru après son entraînement. Fournir la courte politique dans l'invite comme contexte donne au modèle les faits nécessaires, et lui demander de répondre à partir de ce texte ancre la réponse. Cela fonctionne immédiatement et ne demande aucun entraînement."
  options:
    a:
      en: "An instruction to be accurate does not give the model the missing facts, so it can still invent rules."
      fr: "Une instruction d'exactitude ne donne pas au modèle les faits manquants : il peut toujours inventer des règles."
    b:
      en: "Fine-tuning is a training job, which the company wants to avoid, and it takes longer than changing the prompt."
      fr: "Le réglage précis est une tâche d'entraînement, ce que l'entreprise veut éviter, et il prend plus de temps qu'une modification de l'invite."
    c:
      en: "A lower temperature makes answers more consistent, but the model still lacks the policy content."
      fr: "Une température plus basse rend les réponses plus constantes, mais le modèle ne dispose toujours pas du contenu de la politique."
references:
  - title: Provide supporting text
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-support-text.html
