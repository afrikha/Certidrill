id: aifc01-3b-risk-guardrail-filter
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs a customer chatbot on Amazon Bedrock. The company wants to detect and block jailbreak and prompt injection attempts in user inputs before they reach the model, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers exploite un chatbot client sur Amazon Bedrock. Elle veut détecter et bloquer les tentatives de débridage et d'injection d'invite dans les entrées des utilisateurs avant qu'elles n'atteignent le modèle, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on Amazon Macie to scan the chatbot's conversations.", fr: "Activer Amazon Macie pour analyser les conversations du chatbot." } }
    - { id: b, text: { en: "Turn on AWS CloudTrail logging for all Amazon Bedrock API calls.", fr: "Activer la journalisation AWS CloudTrail pour tous les appels d'API Amazon Bedrock." } }
    - { id: c, text: { en: "Turn on Amazon Inspector to scan the chatbot's code.", fr: "Activer Amazon Inspector pour analyser le code du chatbot." } }
    - { id: d, text: { en: "Turn on the prompt attack filter in Amazon Bedrock Guardrails.", fr: "Activer le filtre d'attaques d'invite dans Amazon Bedrock Guardrails." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The prompt attack category of the Amazon Bedrock Guardrails content filters detects jailbreaks and prompt injection in user inputs and can block them, with a configurable filter strength. It is a managed feature that is attached to model invocations, so there is no custom detection code to maintain."
    fr: "La catégorie d'attaques d'invite des filtres de contenu d'Amazon Bedrock Guardrails détecte les débridages et les injections d'invite dans les entrées des utilisateurs et peut les bloquer, avec une intensité de filtre réglable. C'est une fonctionnalité gérée associée aux invocations du modèle : aucun code de détection personnalisé n'est à maintenir."
  options:
    a:
      en: "Macie discovers sensitive data such as PII in Amazon S3; it does not inspect prompts or block attacks."
      fr: "Macie découvre des données sensibles comme les PII dans Amazon S3 ; il n'inspecte pas les invites et ne bloque pas les attaques."
    b:
      en: "CloudTrail records API activity for auditing; it does not analyze or block the content of prompts."
      fr: "CloudTrail enregistre l'activité des API à des fins d'audit ; il n'analyse ni ne bloque le contenu des invites."
    c:
      en: "Inspector scans workloads for software vulnerabilities and unintended network exposure, not prompts sent to a model."
      fr: "Inspector analyse les charges de travail à la recherche de vulnérabilités logicielles et d'exposition réseau involontaire, pas les invites envoyées à un modèle."
references:
  - title: Detect prompt attacks with Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
