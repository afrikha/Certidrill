id: aifc01-3d-rag-retrieval-metrics
objective: "3.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An energy company's RAG assistant often gives incorrect answers. The team wants to use Amazon Bedrock RAG evaluations to determine whether the retrieval step is the cause.

    Which two metrics evaluate the retrieval step? (Choose two.)
  fr: |
    L'assistant RAG d'un fournisseur d'énergie donne souvent des réponses incorrectes. L'équipe veut utiliser les évaluations RAG d'Amazon Bedrock pour déterminer si l'étape de récupération en est la cause.

    Quelles sont les deux métriques qui évaluent l'étape de récupération ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "Context relevance" }
    - { id: b, text: "Logical coherence" }
    - { id: c, text: "Refusal" }
    - { id: d, text: "Context coverage" }
    - { id: e, text: "Stereotyping" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Context relevance and Context coverage are the metrics of a retrieve-only RAG evaluation. Context relevance measures how relevant the retrieved texts are to the questions; Context coverage measures how much of the ground truth information the retrieved texts cover. Low scores point to the retrieval step rather than to generation."
    fr: "Context relevance et Context coverage sont les métriques d'une évaluation RAG de récupération seule. Context relevance mesure la pertinence des textes récupérés par rapport aux questions ; Context coverage mesure la part des informations de la vérité terrain que couvrent les textes récupérés. Des scores faibles désignent l'étape de récupération plutôt que la génération."
  options:
    b:
      en: "Logical coherence evaluates generated responses for logical gaps and contradictions."
      fr: "Logical coherence évalue les réponses générées à la recherche de lacunes logiques et de contradictions."
    c:
      en: "Refusal measures how evasive the generated responses are."
      fr: "Refusal mesure à quel point les réponses générées sont évasives."
    e:
      en: "Stereotyping is a responsible AI metric applied to generated responses."
      fr: "Stereotyping est une métrique d'IA responsable appliquée aux réponses générées."
references:
  - title: Use metrics to understand RAG system performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
