id: aifc01-3d-task-completion-rate
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A telecommunications company launched a generative AI assistant that helps customers change their mobile plan. The business owner wants a metric that shows the share of conversations in which customers successfully finish the plan change that they started.

    Which metric should the company track?
  fr: |
    Un opérateur de télécommunications a lancé un assistant d'IA générative qui aide les clients à changer de forfait mobile. Le responsable métier veut une métrique qui indique la part des conversations dans lesquelles les clients mènent à bien le changement de forfait qu'ils ont commencé.

    Quelle métrique l'entreprise doit-elle suivre ?
body:
  options:
    - { id: a, text: { en: "Cost per interaction", fr: "Coût par interaction" } }
    - { id: b, text: { en: "Task completion rate", fr: "Taux d'achèvement des tâches" } }
    - { id: c, text: { en: "User satisfaction score", fr: "Score de satisfaction des utilisateurs" } }
    - { id: d, text: "TimeToFirstToken" }
answer: { optionId: b }
explanation:
  correct:
    en: "The task completion rate measures whether users finish their workflow with the help of the AI application. It directly shows whether the assistant achieves its purpose of completing plan changes."
    fr: "Le taux d'achèvement des tâches mesure si les utilisateurs mènent leur parcours à terme avec l'aide de l'application d'IA. Il montre directement si l'assistant remplit sa mission de mener à bien les changements de forfait."
  options:
    a:
      en: "Cost per interaction measures what each conversation costs, not whether it succeeded."
      fr: "Le coût par interaction mesure ce que coûte chaque conversation, pas si elle a abouti."
    c:
      en: "User satisfaction reflects how users rate their experience; a satisfied user may still not have finished the change."
      fr: "La satisfaction des utilisateurs reflète la façon dont ils notent leur expérience ; un utilisateur satisfait peut ne pas avoir terminé le changement."
    d:
      en: "TimeToFirstToken is a technical latency metric of Amazon Bedrock streaming calls."
      fr: "TimeToFirstToken est une métrique technique de latence des appels en streaming d'Amazon Bedrock."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
