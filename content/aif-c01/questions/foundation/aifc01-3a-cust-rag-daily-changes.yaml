id: aifc01-3a-cust-rag-daily-changes
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer wants a foundation model (FM) to answer customer questions about product prices and stock levels. This information changes every day. The retailer wants the MOST cost-effective way to keep the answers current.

    Which approach will meet these requirements?
  fr: |
    Un commerçant en ligne veut qu'un modèle de fondation (FM) réponde aux questions des clients sur les prix et les niveaux de stock des produits. Ces informations changent chaque jour. Le commerçant veut la manière la PLUS rentable de garder les réponses à jour.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the FM every day with the latest product data.", fr: "Peaufiner le FM chaque jour avec les dernières données produits." } }
    - { id: b, text: { en: "Pre-train a new FM every week on the product catalog.", fr: "Préentraîner un nouveau FM chaque semaine sur le catalogue de produits." } }
    - { id: c, text: { en: "Use RAG to retrieve the current product data at query time.", fr: "Utiliser le RAG pour récupérer les données produits actuelles au moment de la requête." } }
    - { id: d, text: { en: "Distill the FM every day into a smaller model trained on the catalog.", fr: "Distiller chaque jour le FM en un modèle plus petit entraîné sur le catalogue." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With RAG, the data source is updated and synced while the model stays unchanged, so there is no training cost each time the data changes. RAG can incorporate the latest documents in minutes, whereas fine-tuning takes hours to days for each run, which makes RAG the cost-effective choice for data that changes daily."
    fr: "Avec le RAG, la source de données est mise à jour et synchronisée tandis que le modèle reste inchangé : il n'y a donc aucun coût d'entraînement à chaque changement des données. Le RAG peut intégrer les documents les plus récents en quelques minutes, alors que chaque peaufinage prend de quelques heures à quelques jours, ce qui fait du RAG le choix rentable pour des données qui changent chaque jour."
  options:
    a:
      en: "A daily fine-tuning job adds a training charge every day, and the model is out of date again as soon as prices change."
      fr: "Une tâche de peaufinage quotidienne ajoute des frais d'entraînement chaque jour, et le modèle est de nouveau obsolète dès que les prix changent."
    b:
      en: "Pre-training a new FM is the most expensive approach in data, compute, and time, and a weekly model is still out of date."
      fr: "Préentraîner un nouveau FM est l'approche la plus coûteuse en données, en calcul et en temps, et un modèle hebdomadaire reste obsolète."
    d:
      en: "Distillation produces a cheaper model to run, but each daily distillation job adds training and teacher inference costs."
      fr: "La distillation produit un modèle moins cher à exécuter, mais chaque tâche de distillation quotidienne ajoute des coûts d'entraînement et d'inférence du modèle enseignant."
references:
  - title: Comparing Retrieval Augmented Generation and fine-tuning
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-vs-fine-tuning.html
