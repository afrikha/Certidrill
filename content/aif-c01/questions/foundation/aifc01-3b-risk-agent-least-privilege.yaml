id: aifc01-3b-risk-agent-least-privilege
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's AI agent reads customer orders through an internal API to answer order-status questions. The agent's IAM role currently allows every action on the order system, including deleting orders. The security team worries that a hijacked prompt could make the agent delete orders.

    Which solution will MOST effectively limit the impact of a successful hijacking?
  fr: |
    L'agent d'IA d'une entreprise lit les commandes des clients au moyen d'une API interne pour répondre aux questions sur leur statut. Le rôle IAM de l'agent autorise actuellement toutes les actions sur le système de commandes, y compris la suppression. L'équipe de sécurité craint qu'une invite détournée pousse l'agent à supprimer des commandes.

    Quelle solution limitera le PLUS efficacement l'impact d'un détournement réussi ?
body:
  options:
    - { id: a, text: { en: "Add a system prompt instruction that forbids the agent from deleting orders.", fr: "Ajouter dans l'invite système une instruction qui interdit à l'agent de supprimer des commandes." } }
    - { id: b, text: { en: "Turn on AWS CloudTrail to record every call that the agent makes.", fr: "Activer AWS CloudTrail pour enregistrer chaque appel effectué par l'agent." } }
    - { id: c, text: { en: "Grant the agent's IAM role only the read permissions that it needs.", fr: "N'accorder au rôle IAM de l'agent que les autorisations de lecture dont il a besoin." } }
    - { id: d, text: { en: "Encrypt the order database with an AWS KMS customer managed key.", fr: "Chiffrer la base de données des commandes avec une clé gérée par le client AWS KMS." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Least privilege limits what a model can do even when an attacker controls its instructions. If the agent's role can only read orders, a hijacked prompt cannot delete anything, whatever the model is persuaded to try. AWS recommends limiting LLM access to specific authorizations and avoiding actions with wide operational impact."
    fr: "Le moindre privilège limite ce qu'un modèle peut faire même quand un attaquant contrôle ses instructions. Si le rôle de l'agent ne peut que lire les commandes, une invite détournée ne peut rien supprimer, quoi que le modèle soit amené à tenter. AWS recommande de limiter l'accès des LLM à des autorisations précises et d'éviter les actions à fort impact opérationnel."
  options:
    a:
      en: "Prompt instructions are exactly what a hijacking overrides, so they cannot be the main control."
      fr: "Les instructions de l'invite sont précisément ce qu'un détournement remplace : elles ne peuvent pas être le contrôle principal."
    b:
      en: "CloudTrail records the deletion after it happens; it does not prevent it."
      fr: "CloudTrail enregistre la suppression après coup ; il ne l'empêche pas."
    d:
      en: "Encryption at rest protects stored data from unauthorized reading; the agent's role would still be allowed to delete orders."
      fr: "Le chiffrement au repos protège les données stockées contre la lecture non autorisée ; le rôle de l'agent serait toujours autorisé à supprimer des commandes."
references:
  - title: "Security perspective: Compliance and assurance of AI systems"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-caf-for-ai/security-perspective-compliance-and-assurance-of-aiml-systems.html
