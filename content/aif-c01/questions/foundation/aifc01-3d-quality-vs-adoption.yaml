id: aifc01-3d-quality-vs-adoption
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software vendor built an FM-based assistant that drafts sales emails. The business goal is to cut the time that sales representatives spend writing emails by 30 %. After a two-month pilot, the drafts receive high scores from an LLM-as-a-judge evaluation, but only 10 % of the sales representatives use the assistant.

    What should the company conclude?
  fr: |
    Un éditeur de logiciels a créé un assistant basé sur un FM qui rédige des e-mails commerciaux. L'objectif métier est de réduire de 30 % le temps que les commerciaux passent à écrire des e-mails. Après un pilote de deux mois, les brouillons obtiennent des notes élevées dans une évaluation LLM-as-a-judge, mais seuls 10 % des commerciaux utilisent l'assistant.

    Que doit conclure l'entreprise ?
body:
  options:
    - { id: a, text: { en: "The assistant meets the business goal because its quality scores are high.", fr: "L'assistant répond à l'objectif métier, car ses notes de qualité sont élevées." } }
    - { id: b, text: { en: "The FM must be replaced by a larger FM to raise the quality scores further.", fr: "Le FM doit être remplacé par un FM plus grand pour augmenter encore les notes de qualité." } }
    - { id: c, text: { en: "The assistant meets the business goal as long as the cost per email stays low.", fr: "L'assistant répond à l'objectif métier tant que le coût par e-mail reste faible." } }
    - { id: d, text: { en: "The assistant does not meet the goal yet; the company should collect feedback on low adoption.", fr: "L'assistant ne répond pas encore à l'objectif ; l'entreprise doit recueillir des retours sur la faible adoption." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Whether an FM meets a business objective is judged on business outcomes such as time saved and adoption, not only on technical quality. With 10 % adoption, the time-saving goal cannot be reached, so the company should gather structured feedback from the sales representatives to find out why they do not use the assistant."
    fr: "On juge si un FM répond à un objectif métier sur des résultats métier comme le temps gagné et l'adoption, pas seulement sur la qualité technique. Avec 10 % d'adoption, l'objectif de gain de temps ne peut pas être atteint : l'entreprise doit donc recueillir des retours structurés des commerciaux pour comprendre pourquoi ils n'utilisent pas l'assistant."
  options:
    a:
      en: "High quality scores are technical results; they do not show that sales representatives save time."
      fr: "Des notes de qualité élevées sont des résultats techniques ; elles ne montrent pas que les commerciaux gagnent du temps."
    b:
      en: "Quality is already high; a larger FM would add cost without addressing the adoption problem."
      fr: "La qualité est déjà élevée ; un FM plus grand ajouterait du coût sans traiter le problème d'adoption."
    c:
      en: "A low unit cost does not compensate for the fact that most users do not use the assistant."
      fr: "Un faible coût unitaire ne compense pas le fait que la plupart des utilisateurs n'utilisent pas l'assistant."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
