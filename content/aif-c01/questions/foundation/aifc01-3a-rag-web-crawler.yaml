id: aifc01-3a-rag-web-crawler
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company wants its support assistant to answer customer questions from the public documentation pages of its own website. The documentation changes often, and the company does not want to export the pages manually.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un éditeur de logiciels veut que son assistant de support réponde aux questions des clients à partir des pages de documentation publiques de son propre site web. La documentation change souvent, et l'entreprise ne veut pas exporter les pages manuellement.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Fine-tune a foundation model on a copy of the website after each documentation release.", fr: "Peaufiner un modèle de fondation sur une copie du site web après chaque publication de la documentation." } }
    - { id: b, text: { en: "Paste the full text of every documentation page into the system prompt of each request.", fr: "Coller le texte complet de chaque page de documentation dans l'invite système de chaque requête." } }
    - { id: c, text: { en: "Create an Amazon Bedrock knowledge base with a Web Crawler data source for the website.", fr: "Créer une base de connaissances Amazon Bedrock avec une source de données Web Crawler pour le site web." } }
    - { id: d, text: { en: "Create an Amazon Bedrock guardrail that allows only questions about the documentation.", fr: "Créer un garde-fou Amazon Bedrock qui n'autorise que les questions sur la documentation." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock Knowledge Bases offers data source connectors, including a Web Crawler, so the knowledge base ingests the website pages without a manual export. At query time, the relevant passages are retrieved and added to the prompt, and syncing the data source picks up the documentation changes without retraining any model."
    fr: "Amazon Bedrock Knowledge Bases propose des connecteurs de sources de données, dont un Web Crawler : la base de connaissances ingère donc les pages du site sans export manuel. Au moment de la requête, les passages pertinents sont récupérés et ajoutés à l'invite, et la synchronisation de la source de données prend en compte les modifications de la documentation sans réentraîner de modèle."
  options:
    a:
      en: "Fine-tuning after each release requires repeated training jobs and still needs a manual copy of the website, which is the most overhead."
      fr: "Peaufiner après chaque publication exige des tâches d'entraînement répétées et demande toujours une copie manuelle du site, ce qui représente le plus de charge."
    b:
      en: "Pasting every page into each prompt is a manual export, makes every request expensive, and may exceed the context window."
      fr: "Coller chaque page dans chaque invite revient à un export manuel, rend chaque requête coûteuse et peut dépasser la fenêtre de contexte."
    d:
      en: "A guardrail filters prompts and responses; it does not give the model access to the content of the documentation."
      fr: "Un garde-fou filtre les invites et les réponses ; il ne donne pas au modèle accès au contenu de la documentation."
references:
  - title: Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
