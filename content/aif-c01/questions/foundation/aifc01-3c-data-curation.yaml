id: aifc01-3c-data-curation
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a dataset of prompt-response pairs to fine-tune a foundation model (FM) for its help desk. The raw export from the ticketing system contains duplicate tickets, answers with factual errors, and tickets that are unrelated to the products.

    Which data preparation practice should the company apply before training?
  fr: |
    Une entreprise constitue un jeu de données de paires invite-réponse pour peaufiner un modèle de fondation (FM) destiné à son service d'assistance. L'export brut du système de tickets contient des tickets en double, des réponses comportant des erreurs factuelles et des tickets sans rapport avec les produits.

    Quelle pratique de préparation des données l'entreprise doit-elle appliquer avant l'entraînement ?
body:
  options:
    - { id: a, text: { en: "Curate the data by removing duplicate, inaccurate, and off-topic examples.", fr: "Organiser les données en supprimant les exemples en double, inexacts et hors sujet." } }
    - { id: b, text: { en: "Keep all the examples, because a larger dataset always gives a better model.", fr: "Conserver tous les exemples, car un jeu de données plus grand donne toujours un meilleur modèle." } }
    - { id: c, text: { en: "Keep the inaccurate answers so that the model becomes robust to errors.", fr: "Conserver les réponses inexactes pour que le modèle devienne robuste aux erreurs." } }
    - { id: d, text: { en: "Increase the number of epochs so that the model learns to ignore bad examples.", fr: "Augmenter le nombre d'époques pour que le modèle apprenne à ignorer les mauvais exemples." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Data curation selects and cleans the examples used to fine-tune the model. Fine-tuning teaches the model to reproduce its training examples, so duplicates, factual errors and off-topic tickets must be removed to get accurate, relevant responses."
    fr: "La curation des données sélectionne et nettoie les exemples utilisés pour peaufiner le modèle. Le réglage précis apprend au modèle à reproduire ses exemples d'entraînement : il faut donc supprimer les doublons, les erreurs factuelles et les tickets hors sujet pour obtenir des réponses exactes et pertinentes."
  options:
    b:
      en: "Size helps only when the examples are of good quality; low-quality examples teach the model wrong behavior."
      fr: "La taille n'aide que si les exemples sont de bonne qualité ; des exemples de mauvaise qualité enseignent au modèle un mauvais comportement."
    c:
      en: "The model learns to reproduce the answers it is trained on, including their factual errors."
      fr: "Le modèle apprend à reproduire les réponses sur lesquelles il est entraîné, y compris leurs erreurs factuelles."
    d:
      en: "More epochs make the model fit the training data more closely, including the bad examples; they do not filter data."
      fr: "Plus d'époques font coller davantage le modèle aux données d'entraînement, mauvais exemples compris ; elles ne filtrent pas les données."
references:
  - title: Prepare data for fine-tuning your models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
  - title: Foundation models and hyperparameters for fine-tuning
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html
