id: aifc01-3d-bleu-translation
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company uses a foundation model (FM) to translate hotel descriptions from English to German. Professional translators have produced reference translations for a test set of descriptions. The company wants a standard automatic metric that is commonly used to score machine translations against reference translations.

    Which metric will meet this requirement?
  fr: |
    Une agence de voyages utilise un modèle de fondation (FM) pour traduire des descriptions d'hôtels de l'anglais vers l'allemand. Des traducteurs professionnels ont produit des traductions de référence pour un jeu de test de descriptions. L'entreprise veut une métrique automatique standard, couramment utilisée pour noter des traductions automatiques par rapport à des traductions de référence.

    Quelle métrique répond à cette exigence ?
body:
  options:
    - { id: a, text: "ROUGE" }
    - { id: b, text: "BERTScore" }
    - { id: c, text: "BLEU" }
    - { id: d, text: { en: "Classification accuracy", fr: "Exactitude de classification (classification accuracy)" } }
answer: { optionId: c }
explanation:
  correct:
    en: "BLEU (Bilingual Evaluation Understudy) measures the n-gram overlap between a generated text and a reference text, with a focus on precision and a penalty for outputs that are too short. It is the typical metric for machine translation and correlates well with human judgment for that task."
    fr: "BLEU (Bilingual Evaluation Understudy) mesure le recouvrement de n-grammes entre un texte généré et un texte de référence, en mettant l'accent sur la précision et en pénalisant les sorties trop courtes. C'est la métrique typique de la traduction automatique, et elle est bien corrélée au jugement humain pour cette tâche."
  options:
    a:
      en: "ROUGE also compares n-grams with a reference, but it is recall-oriented and is typically used for summarization, not translation."
      fr: "ROUGE compare aussi des n-grammes à une référence, mais il est orienté rappel et s'utilise typiquement pour le résumé, pas pour la traduction."
    b:
      en: "BERTScore compares embeddings to capture semantic similarity; it is used for general text generation rather than as the standard translation metric."
      fr: "BERTScore compare des vectorisations (embeddings) pour mesurer la similarité sémantique ; il sert à la génération de texte en général plutôt que de métrique standard de traduction."
    d:
      en: "Classification accuracy scores predicted labels against true labels; a translation is not a label."
      fr: "L'exactitude de classification compare des étiquettes prédites à des étiquettes réelles ; une traduction n'est pas une étiquette."
references:
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
