id: aifc01-3d-agent-goal-success
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An airline built an AI agent that handles multi-turn conversations in which customers change seats, add bags and update contact details. The airline uses Amazon Bedrock AgentCore Evaluations and wants to know whether the agent completed all of the user's goals in each conversation session.

    Which built-in evaluator should the airline use?
  fr: |
    Une compagnie aérienne a créé un agent d'IA qui gère des conversations à plusieurs tours dans lesquelles les clients changent de siège, ajoutent des bagages et mettent à jour leurs coordonnées. La compagnie utilise Amazon Bedrock AgentCore Evaluations et veut savoir si l'agent a atteint tous les objectifs de l'utilisateur dans chaque session de conversation.

    Quel évaluateur intégré la compagnie doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Helpfulness" }
    - { id: b, text: "Conciseness" }
    - { id: c, text: "Response relevance" }
    - { id: d, text: "Goal success rate" }
answer: { optionId: d }
explanation:
  correct:
    en: "Goal success rate is a session-level evaluator that assesses whether the assistant successfully completed all user goals within a conversation session. It measures end-to-end task completion, which is what the airline wants to know."
    fr: "Goal success rate est un évaluateur de niveau session qui détermine si l'assistant a atteint tous les objectifs de l'utilisateur au cours d'une session de conversation. Il mesure l'achèvement de la tâche de bout en bout, ce que la compagnie veut savoir."
  options:
    a:
      en: "Helpfulness is a trace-level evaluator that rates how much one response moves the user closer to their goals; it does not judge the whole session."
      fr: "Helpfulness est un évaluateur de niveau trace qui note à quel point une réponse rapproche l'utilisateur de ses objectifs ; il ne juge pas la session entière."
    b:
      en: "Conciseness measures whether a response avoids unnecessary wording."
      fr: "Conciseness mesure si une réponse évite les formulations superflues."
    c:
      en: "Response relevance assesses how focused one response is on the question asked."
      fr: "Response relevance évalue à quel point une réponse reste centrée sur la question posée."
references:
  - title: Prompt templates
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/prompt-templates-builtin.html
  - title: How it works
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/how-it-works-evaluations.html
