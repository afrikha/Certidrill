id: aifc01-3c-eval-robustness
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's customers often type questions with spelling mistakes and unusual capitalization. Before choosing a foundation model (FM), the bank wants an automatic evaluation in Amazon Bedrock to measure how much each model's answers change when the prompts contain such small perturbations.

    Which metric should the bank select in the evaluation job?
  fr: |
    Les clients d'une banque saisissent souvent leurs questions avec des fautes d'orthographe et des majuscules inhabituelles. Avant de choisir un modèle de fondation (FM), la banque veut une évaluation automatique dans Amazon Bedrock pour mesurer à quel point les réponses de chaque modèle changent quand les invites contiennent de telles petites perturbations.

    Quelle métrique la banque doit-elle sélectionner dans la tâche d'évaluation ?
body:
  options:
    - { id: a, text: { en: "Accuracy", fr: "Exactitude (Accuracy)" } }
    - { id: b, text: { en: "Robustness", fr: "Robustesse (Robustness)" } }
    - { id: c, text: { en: "Toxicity", fr: "Toxicité (Toxicity)" } }
    - { id: d, text: { en: "Coherence", fr: "Cohérence (Coherence)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "In automatic model evaluation, the robustness metric measures how much a model's output changes when the input is slightly perturbed. Amazon Bedrock computes it with scores such as word error rate, delta F1 for question and answer, or deltaBERTScore for summarization, depending on the task type."
    fr: "Dans l'évaluation automatique de modèle, la métrique de robustesse mesure à quel point la sortie d'un modèle change quand l'entrée est légèrement perturbée. Amazon Bedrock la calcule avec des scores comme le taux d'erreur de mots, le delta F1 pour les questions-réponses ou le deltaBERTScore pour la synthèse, selon le type de tâche."
  options:
    a:
      en: "Accuracy compares the model's output with the expected answers; it does not measure sensitivity to perturbed prompts."
      fr: "L'exactitude compare la sortie du modèle aux réponses attendues ; elle ne mesure pas la sensibilité aux invites perturbées."
    c:
      en: "Toxicity measures harmful content in the responses."
      fr: "La toxicité mesure le contenu nuisible dans les réponses."
    d:
      en: "Coherence is a quality metric of LLM-as-a-judge and human evaluations, not the automatic metric for perturbed inputs."
      fr: "La cohérence est une métrique de qualité des évaluations LLM-as-a-judge et humaines, pas la métrique automatique pour les entrées perturbées."
references:
  - title: Model evaluation task types in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
