id: aifc01-3a-sel-multi-translation
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company wants to use a foundation model (FM) to translate live chat messages between its customers and its agents. The messages are short texts in English, Japanese, and Portuguese, and each translated message must appear in less than one second. The company will use the model as it is, without customization, and the chats contain no images.

    Which two selection criteria are MOST important when the company chooses the FM? (Choose two.)
  fr: |
    Une agence de voyages veut utiliser un modèle de fondation (FM) pour traduire les messages de chat en direct entre ses clients et ses agents. Les messages sont de courts textes en anglais, en japonais et en portugais, et chaque message traduit doit s'afficher en moins d'une seconde. L'entreprise utilisera le modèle tel quel, sans personnalisation, et les chats ne contiennent aucune image.

    Quels sont les deux critères de sélection les PLUS importants quand l'entreprise choisit le FM ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Support for fine-tuning", fr: "Prise en charge du réglage précis" } }
    - { id: b, text: { en: "Latency", fr: "Latence" } }
    - { id: c, text: { en: "Image generation", fr: "Génération d'images" } }
    - { id: d, text: { en: "Context window of more than 1 million tokens", fr: "Fenêtre contextuelle de plus de 1 million de jetons" } }
    - { id: e, text: { en: "Multilingual support", fr: "Prise en charge multilingue" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "The one-second requirement makes latency a deciding criterion: smaller, faster models usually respond more quickly. The model must also understand and produce English, Japanese, and Portuguese, so multilingual support is required."
    fr: "L'exigence d'une seconde fait de la latence un critère décisif : les modèles plus petits et plus rapides répondent généralement plus vite. Le modèle doit aussi comprendre et produire de l'anglais, du japonais et du portugais : la prise en charge multilingue est donc indispensable."
  options:
    a:
      en: "The company will use the model as it is, so fine-tuning support does not matter."
      fr: "L'entreprise utilisera le modèle tel quel : la prise en charge du réglage précis n'a donc pas d'importance."
    c:
      en: "The chats are text only; the model does not need to generate images."
      fr: "Les chats ne contiennent que du texte ; le modèle n'a pas besoin de générer des images."
    d:
      en: "The messages are short, so a very large context window adds nothing and usually comes with larger, slower models."
      fr: "Les messages sont courts : une très grande fenêtre contextuelle n'apporte rien et va généralement de pair avec des modèles plus grands et plus lents."
references:
  - title: GENCOST01-BP01 Right-size model selection to optimize inference costs
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
