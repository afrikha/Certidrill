id: aifc01-3c-ft-dd-methods
objective: "3.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is planning several projects that adapt foundation models (FMs) or other pre-trained models.

    Select the correct method from the following list for each project. Each method may be selected one time, more than one time, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise prévoit plusieurs projets qui adaptent des modèles de fondation (FM) ou d'autres modèles préentraînés.

    Sélectionnez la méthode correcte dans la liste suivante pour chaque projet. Chaque méthode peut être sélectionnée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: it, text: { en: "Instruction tuning", fr: "Réglage par instructions (instruction tuning)" } }
    - { id: cpt, text: { en: "Continued pre-training", fr: "Préentraînement continu" } }
    - { id: tl, text: { en: "Transfer learning", fr: "Apprentissage par transfert" } }
    - { id: dist, text: { en: "Distillation", fr: "Distillation" } }
  targets:
    - id: t1
      text: { en: "Train an FM on 20,000 customer emails, each paired with the approved reply", fr: "Entraîner un FM sur 20 000 e-mails de clients, chacun associé à la réponse approuvée" }
    - id: t2
      text: { en: "Extend an FM's knowledge with two million unlabeled engineering documents", fr: "Enrichir la connaissance d'un FM avec deux millions de documents d'ingénierie non étiquetés" }
    - id: t3
      text: { en: "Reuse a defect detection model for a similar product line with few labeled images", fr: "Réutiliser un modèle de détection de défauts pour une gamme de produits similaire avec peu d'images étiquetées" }
    - id: t4
      text: { en: "Teach an FM to return extracted fields in a set format from instruction-answer examples", fr: "Apprendre à un FM à renvoyer des champs extraits dans un format défini à partir d'exemples instruction-réponse" }
answer:
  mapping: { t1: it, t2: cpt, t3: tl, t4: it }
explanation:
  correct:
    en: "Email-reply pairs and instruction-answer examples are labeled prompt-response pairs: instruction tuning. Two million unlabeled documents extend an FM's knowledge through continued pre-training. Reusing a trained model for a related task with a small labeled dataset is transfer learning. Distillation, which trains a smaller model from a larger one, fits none of the projects."
    fr: "Des paires e-mail-réponse et des exemples instruction-réponse sont des paires invite-réponse étiquetées : réglage par instructions. Deux millions de documents non étiquetés enrichissent la connaissance d'un FM par préentraînement continu. Réutiliser un modèle entraîné pour une tâche apparentée avec un petit jeu de données étiqueté relève de l'apprentissage par transfert. La distillation, qui entraîne un modèle plus petit à partir d'un plus grand, ne correspond à aucun projet."
references:
  - title: Fine-tune a large language model (LLM) using prompt instructions
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning-instruction-based.html
  - title: What is Transfer Learning? - Transfer Learning in Machine Learning Explained - AWS
    url: https://aws.amazon.com/what-is/transfer-learning/
