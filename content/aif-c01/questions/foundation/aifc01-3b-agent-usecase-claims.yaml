id: aifc01-3b-agent-usecase-claims
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is reviewing four AI projects. It wants to use an AI agent for the project where an agent adds the most value.

    Which project is the BEST use case for an AI agent?
  fr: |
    Une compagnie d'assurance examine quatre projets d'IA. Elle veut utiliser un agent d'IA pour le projet où un agent apporte le plus de valeur.

    Quel projet est le MEILLEUR cas d'utilisation pour un agent d'IA ?
body:
  options:
    - { id: a, text: { en: "Predict the total number of claims for the next quarter from historical data", fr: "Prédire le nombre total de sinistres du prochain trimestre à partir des données historiques" } }
    - { id: b, text: { en: "Translate the company's policy documents from English into Spanish", fr: "Traduire les documents de police de l'entreprise de l'anglais vers l'espagnol" } }
    - { id: c, text: { en: "Label photos of damaged vehicles with one of five damage categories", fr: "Étiqueter des photos de véhicules endommagés avec l'une de cinq catégories de dommages" } }
    - { id: d, text: { en: "Process a claim by checking coverage, requesting missing documents, and updating the claims system", fr: "Traiter un sinistre en vérifiant la couverture, en demandant les pièces manquantes et en mettant à jour le système de sinistres" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Claims processing is a multi-step workflow: the agent looks up the policy, decides what is missing, asks the customer, and updates another system. Agents add value when a goal needs reasoning, several actions in external systems, and adaptation to each case."
    fr: "Le traitement d'un sinistre est un flux de travail en plusieurs étapes : l'agent consulte la police, détermine ce qui manque, sollicite le client et met à jour un autre système. Les agents apportent de la valeur quand un objectif demande du raisonnement, plusieurs actions dans des systèmes externes et une adaptation à chaque cas."
  options:
    a:
      en: "Forecasting a number from historical data is a regression or forecasting task for a traditional ML model, with no actions to take."
      fr: "Prévoir un nombre à partir de données historiques est une tâche de régression ou de prévision pour un modèle de ML classique, sans action à effectuer."
    b:
      en: "Translation is a single task that a managed service such as Amazon Translate handles directly."
      fr: "La traduction est une tâche unique qu'un service géré comme Amazon Translate effectue directement."
    c:
      en: "Assigning one of five categories to an image is an image classification task, not a multi-step workflow."
      fr: "Affecter l'une de cinq catégories à une image est une tâche de classification d'images, pas un flux de travail en plusieurs étapes."
references:
  - title: What are AI Agents?
    url: https://aws.amazon.com/what-is/ai-agents/
