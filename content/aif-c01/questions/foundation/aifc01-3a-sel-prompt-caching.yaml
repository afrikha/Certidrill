id: aifc01-3a-sel-prompt-caching
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's chatbot on Amazon Bedrock sends the same 30-page product manual at the start of every prompt, followed by a short customer question. The company wants to reduce response latency and input token costs without changing the model or the manual.

    Which solution will meet these requirements?
  fr: |
    Le chatbot d'une entreprise sur Amazon Bedrock envoie le même manuel produit de 30 pages au début de chaque invite, suivi d'une courte question du client. L'entreprise veut réduire la latence des réponses et le coût des jetons d'entrée sans changer de modèle ni modifier le manuel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable prompt caching, with a cache checkpoint after the manual.", fr: "Activer la mise en cache des invites, avec un point de contrôle de cache après le manuel." } }
    - { id: b, text: { en: "Purchase Provisioned Throughput for the model that the chatbot uses.", fr: "Acheter du Provisioned Throughput pour le modèle utilisé par le chatbot." } }
    - { id: c, text: { en: "Submit the customer questions as a batch inference job.", fr: "Soumettre les questions des clients sous forme de tâche d'inférence par lots." } }
    - { id: d, text: { en: "Increase the maximum tokens value of each request.", fr: "Augmenter la valeur du nombre maximal de jetons de chaque requête." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Prompt caching lets Amazon Bedrock reuse a prompt prefix that repeats across requests instead of reprocessing it each time. Cached input tokens are billed at a discounted cache-read rate and responses come back faster, which suits a long, unchanging document followed by a short variable question."
    fr: "La mise en cache des invites permet à Amazon Bedrock de réutiliser un préfixe d'invite répété d'une requête à l'autre au lieu de le retraiter à chaque fois. Les jetons d'entrée mis en cache sont facturés à un tarif réduit de lecture du cache et les réponses arrivent plus vite, ce qui convient à un long document qui ne change pas, suivi d'une courte question variable."
  options:
    b:
      en: "Provisioned Throughput buys dedicated capacity at an hourly price; the manual is still processed on every request."
      fr: "Le Provisioned Throughput achète une capacité dédiée à un prix horaire ; le manuel est toujours traité à chaque requête."
    c:
      en: "Batch inference returns results later in Amazon S3, which does not suit a chatbot, and prompt caching is not available for batch inference."
      fr: "L'inférence par lots renvoie les résultats plus tard dans Amazon S3, ce qui ne convient pas à un chatbot, et la mise en cache des invites n'est pas disponible pour l'inférence par lots."
    d:
      en: "The maximum tokens value limits the length of the response; it does not reduce the cost or latency of processing the input."
      fr: "Le nombre maximal de jetons limite la longueur de la réponse ; il ne réduit ni le coût ni la latence du traitement de l'entrée."
references:
  - title: Prompt caching for faster model inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
