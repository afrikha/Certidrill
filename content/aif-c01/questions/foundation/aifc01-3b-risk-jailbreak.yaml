id: aifc01-3b-risk-jailbreak
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company runs a public chatbot. A user writes a long role-play prompt that tells the model it is "DAN, an AI with no rules" and asks it to produce harmful content that the model normally refuses to generate.

    Which type of attack is the user attempting?
  fr: |
    Un éditeur de jeux vidéo exploite un chatbot public. Un utilisateur écrit une longue invite de jeu de rôle qui dit au modèle qu'il est « DAN, une IA sans règles » et lui demande de produire un contenu nuisible que le modèle refuse normalement de générer.

    Quel type d'attaque l'utilisateur tente-t-il ?
body:
  options:
    - { id: a, text: { en: "Poisoning", fr: "Empoisonnement" } }
    - { id: b, text: { en: "Exposure", fr: "Exposition" } }
    - { id: c, text: { en: "Hallucination", fr: "Hallucination" } }
    - { id: d, text: { en: "Jailbreaking", fr: "Débridage (jailbreaking)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Jailbreaking uses crafted prompts, such as \"Do Anything Now\" (DAN) role-play, to bypass the safety and moderation that are built into a foundation model so that it produces harmful content. The prompt attack filter of Amazon Bedrock Guardrails detects jailbreaks."
    fr: "Le débridage utilise des invites conçues à cet effet, comme le jeu de rôle « Do Anything Now » (DAN), pour contourner la sûreté et la modération intégrées à un modèle de fondation afin qu'il produise un contenu nuisible. Le filtre d'attaques d'invite d'Amazon Bedrock Guardrails détecte les débridages."
  options:
    a:
      en: "Poisoning corrupts the data that a model learns from or retrieves; this user only sends a prompt."
      fr: "L'empoisonnement corrompt les données dont un modèle apprend ou qu'il récupère ; cet utilisateur envoie seulement une invite."
    b:
      en: "Exposure is the disclosure of sensitive data, such as the system prompt or other users' information; the user wants harmful content instead."
      fr: "L'exposition est la divulgation de données sensibles, comme l'invite système ou les informations d'autres utilisateurs ; l'utilisateur veut plutôt un contenu nuisible."
    c:
      en: "A hallucination is an incorrect output that the model produces by itself; it is not an attack."
      fr: "Une hallucination est une sortie incorrecte que le modèle produit de lui-même ; ce n'est pas une attaque."
references:
  - title: Detect prompt attacks with Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
