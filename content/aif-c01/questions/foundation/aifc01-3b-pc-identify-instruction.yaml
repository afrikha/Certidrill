id: aifc01-3b-pc-identify-instruction
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A telecom company sends the following prompt to a foundation model:

    "You are a support assistant for a telecom company. The customer below has a premium plan and has called three times this month. Summarize the customer's email in two sentences. Email: [customer email text]"

    Which part of the prompt is the instruction?
  fr: |
    Une entreprise de télécommunications envoie l'invite suivante à un modèle de fondation :

    « Tu es un assistant de support pour une entreprise de télécommunications. Le client ci-dessous a un forfait premium et a appelé trois fois ce mois-ci. Résume l'e-mail du client en deux phrases. E-mail : [texte de l'e-mail du client] »

    Quelle partie de l'invite est l'instruction ?
body:
  options:
    - { id: a, text: { en: "\"You are a support assistant for a telecom company.\"", fr: "« Tu es un assistant de support pour une entreprise de télécommunications. »" } }
    - { id: b, text: { en: "\"The customer below has a premium plan and has called three times this month.\"", fr: "« Le client ci-dessous a un forfait premium et a appelé trois fois ce mois-ci. »" } }
    - { id: c, text: { en: "\"Summarize the customer's email in two sentences.\"", fr: "« Résume l'e-mail du client en deux phrases. »" } }
    - { id: d, text: { en: "\"Email: [customer email text]\"", fr: "« E-mail : [texte de l'e-mail du client] »" } }
answer: { optionId: c }
shuffle: false
explanation:
  correct:
    en: "The instruction is the part of a prompt that states the task the model must perform, here summarizing the email in two sentences. The other parts give the model a role, context, and the input data to work on."
    fr: "L'instruction est la partie d'une invite qui indique la tâche que le modèle doit effectuer, ici résumer l'e-mail en deux phrases. Les autres parties donnent au modèle un rôle, du contexte et les données d'entrée à traiter."
  options:
    a:
      en: "This sentence assigns a role (persona) to the model; it does not say what task to perform."
      fr: "Cette phrase attribue un rôle (persona) au modèle ; elle n'indique pas la tâche à effectuer."
    b:
      en: "This sentence is context: background information that helps the model produce a relevant answer."
      fr: "Cette phrase est du contexte : des informations de fond qui aident le modèle à produire une réponse pertinente."
    d:
      en: "The email text is the input data that the instruction applies to."
      fr: "Le texte de l'e-mail est la donnée d'entrée à laquelle s'applique l'instruction."
references:
  - title: Prompt engineering concepts
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
