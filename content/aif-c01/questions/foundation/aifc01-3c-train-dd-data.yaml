id: aifc01-3c-train-dd-data
objective: "3.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A data science team is listing the data that each element of foundation model (FM) training uses.

    Select the correct training element from the following list for each type of data. Each training element should be selected one time or not at all.
  fr: |
    Une équipe de science des données recense les données qu'utilise chaque élément de l'entraînement d'un modèle de fondation (FM).

    Sélectionnez l'élément d'entraînement correct dans la liste suivante pour chaque type de données. Chaque élément d'entraînement doit être sélectionné une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: pre, text: { en: "Pre-training", fr: "Préentraînement" } }
    - { id: ft, text: { en: "Supervised fine-tuning", fr: "Peaufinage supervisé" } }
    - { id: cpt, text: { en: "Continued pre-training", fr: "Préentraînement continu" } }
    - { id: dist, text: { en: "Distillation", fr: "Distillation" } }
    - { id: rag, text: { en: "Retrieval Augmented Generation (RAG)", fr: "Génération augmentée par récupération (RAG)" } }
  targets:
    - id: t1
      text: { en: "A massive, general unlabeled corpus used to build a new model", fr: "Un immense corpus général non étiqueté, utilisé pour construire un nouveau modèle" }
    - id: t2
      text: { en: "Labeled input-output pairs for a specific task", fr: "Des paires entrée-sortie étiquetées pour une tâche précise" }
    - id: t3
      text: { en: "A large unlabeled corpus from one industry, used to extend an existing model", fr: "Un grand corpus non étiqueté d'un secteur, utilisé pour enrichir un modèle existant" }
    - id: t4
      text: { en: "Prompts answered by a larger model to train a smaller model", fr: "Des invites auxquelles répond un modèle plus grand pour entraîner un modèle plus petit" }
answer:
  mapping: { t1: pre, t2: ft, t3: cpt, t4: dist }
explanation:
  correct:
    en: "Pre-training builds a model from a massive unlabeled corpus with self-supervised learning. Supervised fine-tuning uses labeled input-output examples. Continued pre-training extends an existing model with large amounts of unlabeled domain text. Distillation uses a teacher model's responses to prompts to fine-tune a smaller student. RAG retrieves documents at inference time and does not train the model."
    fr: "Le préentraînement construit un modèle à partir d'un immense corpus non étiqueté par apprentissage autosupervisé. Le peaufinage supervisé utilise des exemples étiquetés d'entrée et de sortie. Le préentraînement continu enrichit un modèle existant avec de grandes quantités de texte de domaine non étiqueté. La distillation utilise les réponses d'un modèle enseignant à des invites pour peaufiner un modèle élève plus petit. Le RAG récupère des documents au moment de l'inférence et n'entraîne pas le modèle."
references:
  - title: Customize your model to improve its performance for your use case
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
  - title: Continued pre-training (CPT)
    url: https://docs.aws.amazon.com/nova/latest/userguide/customize-fine-tune-hyperpod-cpt.html
