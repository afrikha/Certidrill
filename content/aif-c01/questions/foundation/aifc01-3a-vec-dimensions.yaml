id: aifc01-3a-vec-dimensions
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company prepares a table in Amazon Aurora PostgreSQL to store the embeddings of an Amazon Bedrock knowledge base. The knowledge base will use Amazon Titan Text Embeddings V2 configured to produce vectors with 1,024 dimensions.

    What must the company make sure of when it defines the embedding column?
  fr: |
    Une entreprise prépare une table dans Amazon Aurora PostgreSQL pour stocker les vectorisations (embeddings) d'une base de connaissances Amazon Bedrock. La base de connaissances utilisera Amazon Titan Text Embeddings V2, configuré pour produire des vecteurs de 1 024 dimensions.

    De quoi l'entreprise doit-elle s'assurer quand elle définit la colonne d'intégration ?
body:
  options:
    - { id: a, text: { en: "The size of the column equals the chunk size in tokens.", fr: "La taille de la colonne est égale à la taille des fragments en jetons." } }
    - { id: b, text: { en: "The size of the column equals the context window of the foundation model.", fr: "La taille de la colonne est égale à la fenêtre contextuelle du modèle de fondation." } }
    - { id: c, text: { en: "The column stores the embeddings as JSON text.", fr: "La colonne stocke les vectorisations sous forme de texte JSON." } }
    - { id: d, text: { en: "The vector dimension of the column equals 1,024.", fr: "La dimension vectorielle de la colonne est égale à 1 024." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Each embedding has the number of dimensions that the embeddings model produces, so the vector column (vector(n) with pgvector) must use the same dimension: vector(1024) for Titan Text Embeddings V2 at 1,024 dimensions. The choice of embeddings model and vector dimensions therefore constrains how the vector store is defined."
    fr: "Chaque vectorisation a le nombre de dimensions produit par le modèle de vectorisation : la colonne vectorielle (vector(n) avec pgvector) doit donc utiliser la même dimension, soit vector(1024) pour Titan Text Embeddings V2 à 1 024 dimensions. Le choix du modèle de vectorisation et des dimensions des vecteurs conditionne donc la définition du magasin de vecteurs."
  options:
    a:
      en: "Chunk size is the number of tokens of text in a chunk; every chunk is embedded into a vector of the same fixed dimension whatever its length."
      fr: "La taille des fragments est le nombre de jetons de texte d'un fragment ; chaque fragment est converti en un vecteur de même dimension fixe, quelle que soit sa longueur."
    b:
      en: "The context window of the generation model limits prompt length; it has no relation to the dimension of the stored vectors."
      fr: "La fenêtre contextuelle du modèle de génération limite la longueur de l'invite ; elle n'a aucun rapport avec la dimension des vecteurs stockés."
    c:
      en: "The embeddings go in a pgvector vector column with an HNSW index for similarity search, not in a JSON text column."
      fr: "Les intégrations vont dans une colonne vectorielle pgvector avec un index HNSW pour la recherche de similarité, pas dans une colonne de texte JSON."
references:
  - title: Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
  - title: Prerequisites for using a vector store you created for a knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
