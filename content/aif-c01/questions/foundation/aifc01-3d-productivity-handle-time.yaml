id: aifc01-3d-productivity-handle-time
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company deploys a generative AI assistant that drafts replies for its claims handlers. Management wants to know whether the assistant improves the productivity of the claims handlers.

    Which approach will meet this requirement?
  fr: |
    Une compagnie d'assurance déploie un assistant d'IA générative qui rédige des brouillons de réponses pour ses gestionnaires de sinistres. La direction veut savoir si l'assistant améliore la productivité des gestionnaires de sinistres.

    Quelle approche répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Compare the average time to handle a claim with a baseline measured before the deployment.", fr: "Comparer le temps moyen de traitement d'un sinistre à une référence mesurée avant le déploiement." } }
    - { id: b, text: { en: "Compare the BERTScore of the drafts with reference replies written by experts.", fr: "Comparer le BERTScore des brouillons à des réponses de référence rédigées par des experts." } }
    - { id: c, text: { en: "Track the number of input tokens per draft in Amazon CloudWatch.", fr: "Suivre le nombre de jetons d'entrée par brouillon dans Amazon CloudWatch." } }
    - { id: d, text: { en: "Compare the parameter count of the FM with the parameter counts of other FMs.", fr: "Comparer le nombre de paramètres du FM à celui d'autres FM." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Productivity is a business outcome: it is measured by the time or effort that a task takes, such as the reduction in handle time. A baseline of the current process, captured before the deployment, is needed to show the improvement."
    fr: "La productivité est un résultat métier : elle se mesure par le temps ou l'effort qu'exige une tâche, par exemple la réduction du temps de traitement. Une référence du processus actuel, mesurée avant le déploiement, est nécessaire pour montrer l'amélioration."
  options:
    b:
      en: "BERTScore is a technical quality metric; good drafts do not prove that the handlers work faster."
      fr: "BERTScore est une métrique technique de qualité ; de bons brouillons ne prouvent pas que les gestionnaires travaillent plus vite."
    c:
      en: "Input token counts describe usage and cost, not the productivity of the employees."
      fr: "Le nombre de jetons d'entrée décrit l'utilisation et le coût, pas la productivité des employés."
    d:
      en: "Model size is a selection criterion of the FM; it says nothing about the business impact of the assistant."
      fr: "La taille du modèle est un critère de sélection du FM ; elle ne dit rien de l'impact métier de l'assistant."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
