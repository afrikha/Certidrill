id: aifc01-3b-agent-agentcore-runtime
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company built an AI agent with the open-source LangGraph framework. The company wants to run the agent on AWS in a secure, serverless environment that isolates each user session and scales automatically. The company does not want to manage servers.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise de logistique a créé un agent d'IA avec le framework open source LangGraph. Elle veut exécuter l'agent sur AWS dans un environnement sécurisé et sans serveur, qui isole chaque session utilisateur et se met à l'échelle automatiquement. L'entreprise ne veut pas gérer de serveurs.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Bedrock Knowledge Bases" }
    - { id: b, text: "Amazon Bedrock AgentCore Runtime" }
    - { id: c, text: "Amazon SageMaker JumpStart" }
    - { id: d, text: "Amazon Bedrock Guardrails" }
answer: { optionId: b }
explanation:
  correct:
    en: "AgentCore Runtime is a secure, serverless environment for deploying and scaling agents and tools, with session isolation. It works with any framework, including LangGraph, CrewAI, LlamaIndex, and Strands Agents, and with models inside or outside Amazon Bedrock."
    fr: "AgentCore Runtime est un environnement sécurisé et sans serveur pour déployer et mettre à l'échelle des agents et des outils, avec isolation des sessions. Il fonctionne avec n'importe quel framework, dont LangGraph, CrewAI, LlamaIndex et Strands Agents, et avec des modèles d'Amazon Bedrock ou d'ailleurs."
  options:
    a:
      en: "Knowledge Bases connect a model to company data for retrieval augmented generation (RAG); they do not host agent code."
      fr: "Knowledge Bases relie un modèle aux données de l'entreprise pour la génération à enrichissement contextuel (RAG) ; il n'héberge pas le code d'un agent."
    c:
      en: "SageMaker JumpStart provides pretrained models and solutions to deploy; it is not a runtime for agents built with agent frameworks."
      fr: "SageMaker JumpStart fournit des modèles pré-entraînés et des solutions à déployer ; ce n'est pas un environnement d'exécution pour des agents créés avec des frameworks d'agents."
    d:
      en: "Guardrails filter harmful content in inputs and outputs; they do not run agents."
      fr: "Guardrails filtre le contenu nuisible des entrées et des sorties ; il n'exécute pas d'agents."
references:
  - title: Overview
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
