id: aifc01-3c-eval-human-brand
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A cosmetics company uses a foundation model (FM) in Amazon Bedrock to write product descriptions. The company wants its own marketing experts to judge whether the descriptions match the brand's voice and style before the model goes into production.

    Which evaluation approach will meet these requirements?
  fr: |
    Une entreprise de cosmétiques utilise un modèle de fondation (FM) d'Amazon Bedrock pour rédiger des descriptions de produits. Elle veut que ses propres experts marketing jugent si les descriptions correspondent au ton et au style de la marque avant la mise en production du modèle.

    Quelle approche d'évaluation répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An automatic model evaluation job with a built-in dataset", fr: "Une tâche d'évaluation automatique de modèle avec un jeu de données intégré" } }
    - { id: b, text: { en: "A human-based model evaluation job with a work team of the experts", fr: "Une tâche d'évaluation humaine de modèle avec une équipe de travail composée des experts" } }
    - { id: c, text: { en: "A benchmark comparison on a public question answering dataset", fr: "Une comparaison sur un jeu de données de référence public de questions-réponses" } }
    - { id: d, text: { en: "A contextual grounding check in a guardrail for the model", fr: "Un contrôle d'ancrage contextuel dans une barrière de protection pour le modèle" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A human-based model evaluation job uses human workers, such as employees or subject-matter experts, to rate responses on metrics that you define. Brand voice is subjective, so the marketing experts form the work team and rate each description, for example with a Likert scale or thumbs up/down."
    fr: "Une tâche d'évaluation humaine de modèle fait appel à des évaluateurs humains, comme des employés ou des experts du domaine, pour noter les réponses selon des métriques que vous définissez. Le ton de la marque est subjectif : les experts marketing forment l'équipe de travail et notent chaque description, par exemple avec une échelle de Likert ou un pouce levé ou baissé."
  options:
    a:
      en: "Built-in datasets and automatic metrics cannot judge the company's brand voice, and no expert takes part."
      fr: "Les jeux de données intégrés et les métriques automatiques ne peuvent pas juger le ton de la marque, et aucun expert n'intervient."
    c:
      en: "A public benchmark compares general capabilities; it does not reflect this brand's style or involve the company's experts."
      fr: "Un jeu de données de référence public compare des capacités générales ; il ne reflète pas le style de cette marque et n'implique pas les experts de l'entreprise."
    d:
      en: "A contextual grounding check filters ungrounded responses at run time; it does not evaluate style."
      fr: "Un contrôle d'ancrage contextuel filtre à l'exécution les réponses non ancrées ; il n'évalue pas le style."
references:
  - title: Evaluate the performance of Amazon Bedrock resources
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
  - title: Create a human-based model evaluation job
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-jobs-management-create-human.html
