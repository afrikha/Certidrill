id: aifc01-3c-data-validation-split
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team fine-tunes a foundation model (FM) in Amazon SageMaker JumpStart with instruction-based fine-tuning. The team uploads a training folder with .jsonl files to Amazon S3 but does not provide a validation folder.

    What happens to the validation of the fine-tuned model?
  fr: |
    Une équipe peaufine un modèle de fondation (FM) dans Amazon SageMaker JumpStart avec un peaufinage fondé sur des instructions. Elle charge dans Amazon S3 un dossier d'entraînement contenant des fichiers .jsonl, mais ne fournit pas de dossier de validation.

    Qu'advient-il de la validation du modèle peaufiné ?
body:
  options:
    - { id: a, text: { en: "The training job fails, because a validation folder is required.", fr: "La tâche d'entraînement échoue, car un dossier de validation est obligatoire." } }
    - { id: b, text: { en: "The model is validated on the same examples that are used for training.", fr: "Le modèle est validé sur les mêmes exemples que ceux utilisés pour l'entraînement." } }
    - { id: c, text: { en: "A set portion of the training data is held out and used for validation.", fr: "Une partie définie des données d'entraînement est mise de côté et utilisée pour la validation." } }
    - { id: d, text: { en: "Validation is skipped, and no validation metrics are reported for the job.", fr: "La validation est ignorée, et aucune métrique de validation n'est fournie pour la tâche." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A validation folder is optional. If the team does not provide validation data, JumpStart holds out a set amount of the training data for validation. The validation_split_ratio hyperparameter sets that proportion, and train_data_split_seed makes the random split reproducible."
    fr: "Le dossier de validation est facultatif. Si l'équipe ne fournit pas de données de validation, JumpStart met de côté une quantité définie des données d'entraînement pour la validation. L'hyperparamètre validation_split_ratio fixe cette proportion, et train_data_split_seed rend la répartition aléatoire reproductible."
  options:
    a:
      en: "The validation folder is optional for JumpStart fine-tuning."
      fr: "Le dossier de validation est facultatif pour le peaufinage dans JumpStart."
    b:
      en: "Validating on the training examples would not measure performance on unseen data; JumpStart holds out part of the data instead."
      fr: "Valider sur les exemples d'entraînement ne mesurerait pas les performances sur des données inédites ; JumpStart met plutôt une partie des données de côté."
    d:
      en: "Validation still takes place, on the portion of training data that is held out."
      fr: "La validation a bien lieu, sur la partie des données d'entraînement mise de côté."
references:
  - title: Fine-tune a large language model (LLM) using prompt instructions
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning-instruction-based.html
  - title: Foundation models and hyperparameters for fine-tuning
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html
