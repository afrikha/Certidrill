id: aifc01-3a-cust-multi-custom-charges
objective: "3.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a fine-tuning job in Amazon Bedrock and keeps the resulting custom model. The company is estimating the costs that apply before it sends any inference request to the custom model.

    Which two charges apply? (Choose two.)
  fr: |
    Une entreprise exécute une tâche de réglage précis dans Amazon Bedrock et conserve le modèle personnalisé obtenu. L'entreprise estime les coûts qui s'appliquent avant d'envoyer la moindre requête d'inférence au modèle personnalisé.

    Quels sont les deux frais qui s'appliquent ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A charge for each training example that AWS reviews", fr: "Des frais pour chaque exemple d'entraînement examiné par AWS" } }
    - { id: b, text: { en: "A training charge based on the training tokens multiplied by the number of epochs", fr: "Des frais d'entraînement basés sur les jetons d'entraînement multipliés par le nombre d'époques" } }
    - { id: c, text: { en: "A charge per GB of vector index storage", fr: "Des frais par Go de stockage d'index vectoriel" } }
    - { id: d, text: { en: "A monthly storage charge for the custom model", fr: "Des frais mensuels de stockage du modèle personnalisé" } }
    - { id: e, text: { en: "A per-user license fee for the people who use the model", fr: "Des frais de licence par utilisateur pour les personnes qui utilisent le modèle" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Amazon Bedrock charges model training based on the number of tokens processed, that is, the tokens in the training data multiplied by the number of epochs, and charges model storage per month for each custom model. Inference with the custom model, through Provisioned Throughput or an on-demand custom model deployment, is a separate cost that starts when the company uses the model."
    fr: "Amazon Bedrock facture l'entraînement du modèle selon le nombre de jetons traités, c'est-à-dire les jetons des données d'entraînement multipliés par le nombre d'époques, et facture chaque mois le stockage de chaque modèle personnalisé. L'inférence avec le modèle personnalisé, par Provisioned Throughput ou par un déploiement de modèle personnalisé à la demande, est un coût distinct qui commence quand l'entreprise utilise le modèle."
  options:
    a:
      en: "AWS does not review or bill training examples one by one; training is billed by tokens processed."
      fr: "AWS n'examine pas et ne facture pas les exemples d'entraînement un par un ; l'entraînement est facturé selon les jetons traités."
    c:
      en: "Vector index storage is a cost of RAG vector stores, not of a fine-tuning job."
      fr: "Le stockage d'un index vectoriel est un coût des magasins de vecteurs du RAG, pas d'une tâche de réglage précis."
    e:
      en: "Amazon Bedrock does not charge a per-user license for custom models; costs are based on training, storage, and inference."
      fr: "Amazon Bedrock ne facture pas de licence par utilisateur pour les modèles personnalisés ; les coûts reposent sur l'entraînement, le stockage et l'inférence."
references:
  - title: Customize your model to improve its performance for your use case
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
  - title: Set up inference for a custom model
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-use.html
