id: aifc01-3b-agent-order-workflow
objective: "3.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A customer tells an airline's AI agent: "My flight was cancelled. Rebook me on the next flight to Lisbon."

    Which four steps does the agent perform, in order, to complete the request? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Un client dit à l'agent d'IA d'une compagnie aérienne : « Mon vol a été annulé. Réservez-moi sur le prochain vol pour Lisbonne. »

    Quelles sont les quatre étapes que l'agent effectue, dans l'ordre, pour traiter la demande ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: act, text: { en: "Call the booking API to reserve a seat on the selected flight.", fr: "Appeler l'API de réservation pour réserver un siège sur le vol choisi." } }
    - { id: tune, text: { en: "Fine-tune the foundation model on the customer's booking history.", fr: "Peaufiner le modèle de fondation sur l'historique de réservation du client." } }
    - { id: plan, text: { en: "Interpret the request and break the goal into smaller tasks.", fr: "Interpréter la demande et décomposer l'objectif en tâches plus petites." } }
    - { id: check, text: { en: "Verify that the new booking meets the goal and confirm it to the customer.", fr: "Vérifier que la nouvelle réservation atteint l'objectif et la confirmer au client." } }
    - { id: get, text: { en: "Query the flight schedule tool for the next available flights to Lisbon.", fr: "Interroger l'outil des horaires de vol pour obtenir les prochains vols disponibles vers Lisbonne." } }
    - { id: retrain, text: { en: "Retrain the model from scratch with the latest flight schedules.", fr: "Réentraîner le modèle de zéro avec les derniers horaires de vol." } }
answer:
  sequence: [ plan, get, act, check ]
explanation:
  correct:
    en: "An agent first determines the goal and splits it into tasks, then acquires the information it needs (available flights), then performs the actions (the booking), and finally checks progress against the goal before answering. This is the plan, gather, act, and evaluate loop that AWS describes for AI agents."
    fr: "Un agent détermine d'abord l'objectif et le divise en tâches, puis obtient les informations nécessaires (les vols disponibles), effectue ensuite les actions (la réservation) et vérifie enfin l'avancement par rapport à l'objectif avant de répondre. C'est la boucle planifier, collecter, agir et évaluer qu'AWS décrit pour les agents d'IA."
  options:
    tune:
      en: "An agent uses an existing foundation model at run time; fine-tuning is a separate, offline customization step."
      fr: "Un agent utilise un modèle de fondation existant à l'exécution ; le peaufinage est une étape de personnalisation distincte, hors ligne."
    retrain:
      en: "Current flight data comes from a tool call, not from retraining the model."
      fr: "Les données de vol à jour viennent d'un appel d'outil, pas d'un réentraînement du modèle."
references:
  - title: What are AI Agents?
    url: https://aws.amazon.com/what-is/ai-agents/
