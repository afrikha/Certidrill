id: aifc01-3d-ab-test-engagement
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A streaming media company built a new version of its FM-based chat feature that recommends shows. The company wants to know whether the new version increases user engagement compared with the current version, under real usage.

    Which approach will meet this requirement?
  fr: |
    Une plateforme de streaming a créé une nouvelle version de sa fonction de chat basée sur un FM qui recommande des séries. L'entreprise veut savoir si la nouvelle version augmente l'engagement des utilisateurs par rapport à la version actuelle, en conditions réelles d'utilisation.

    Quelle approche répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Run both versions on a public benchmark dataset and compare their scores.", fr: "Exécuter les deux versions sur un jeu de données de référence public et comparer leurs scores." } }
    - { id: b, text: { en: "Run an A/B test that sends a share of users to each version and compares engagement.", fr: "Mener un test A/B qui envoie une partie des utilisateurs vers chaque version et compare l'engagement." } }
    - { id: c, text: { en: "Compute the BLEU score of both versions against reference recommendations.", fr: "Calculer le score BLEU des deux versions par rapport à des recommandations de référence." } }
    - { id: d, text: { en: "Run a load test that measures the maximum requests per second of each version.", fr: "Mener un test de charge qui mesure le nombre maximal de requêtes par seconde de chaque version." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An A/B test splits real users between the two versions and compares engagement measures such as usage, session length and return visits. It is the only option that measures the behavior of real users, which is what user engagement means."
    fr: "Un test A/B répartit de vrais utilisateurs entre les deux versions et compare des mesures d'engagement comme l'utilisation, la durée des sessions et les visites répétées. C'est la seule option qui mesure le comportement de vrais utilisateurs, ce qui est le sens même de l'engagement."
  options:
    a:
      en: "A benchmark dataset measures model capability offline, not how real users engage."
      fr: "Un jeu de données de référence mesure la capacité du modèle hors ligne, pas l'engagement réel des utilisateurs."
    c:
      en: "BLEU is a translation metric that compares text with references; it says nothing about engagement."
      fr: "BLEU est une métrique de traduction qui compare un texte à des références ; il ne dit rien de l'engagement."
    d:
      en: "A load test measures throughput, a technical metric, not user engagement."
      fr: "Un test de charge mesure le débit, une métrique technique, pas l'engagement des utilisateurs."
references:
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
