id: aifc01-3b-risk-match-attacks
objective: "3.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A security team reviews incidents that affected the company's generative AI applications.

    Match each incident with the risk that it represents. To answer, drag the appropriate risks to the correct incidents. Each risk may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe de sécurité examine des incidents qui ont touché les applications d'IA générative de l'entreprise.

    Associez chaque incident au risque qu'il représente. Pour répondre, faites glisser les risques appropriés vers les incidents correspondants. Chaque risque peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: exp, text: { en: "Exposure", fr: "Exposition" } }
    - { id: poi, text: { en: "Poisoning", fr: "Empoisonnement" } }
    - { id: hij, text: { en: "Hijacking", fr: "Détournement" } }
    - { id: jb, text: { en: "Jailbreaking", fr: "Débridage (jailbreaking)" } }
    - { id: hal, text: { en: "Hallucination", fr: "Hallucination" } }
  targets:
    - { id: t1, text: { en: "A user tells a recipe assistant to ignore its task and write phishing emails for a campaign instead", fr: "Un utilisateur demande à un assistant de recettes d'ignorer sa tâche et de rédiger plutôt des e-mails d'hameçonnage pour une campagne" } }
    - { id: t2, text: { en: "An attacker adds documents with false facts to the data source that a knowledge base syncs from", fr: "Un attaquant ajoute des documents aux faits erronés dans la source de données que synchronise une base de connaissances" } }
    - { id: t3, text: { en: "A user persuades a model through role-play to bypass its safety rules and produce violent content", fr: "Un utilisateur persuade un modèle par un jeu de rôle de contourner ses règles de sûreté et de produire un contenu violent" } }
    - { id: t4, text: { en: "A model's answer reveals the email addresses that other customers shared earlier", fr: "La réponse d'un modèle révèle les adresses e-mail que d'autres clients ont communiquées auparavant" } }
answer:
  mapping: { t1: hij, t2: poi, t3: jb, t4: exp }
explanation:
  correct:
    en: |
      Redirecting an application away from its intended task is hijacking (prompt injection that overrides the developer's instructions). Planting false content in data that a model learns from or retrieves is poisoning. Bypassing the model's built-in safety controls to get harmful content is jailbreaking. Revealing other users' data in an output is exposure. No incident is a hallucination, because each one is caused by an attacker or by data leakage rather than by the model inventing facts on its own.
    fr: |
      Détourner une application de sa tâche prévue est un détournement (injection d'invite qui remplace les instructions du développeur). Placer du contenu faux dans les données dont un modèle apprend ou qu'il récupère est un empoisonnement. Contourner les contrôles de sûreté intégrés du modèle pour obtenir un contenu nuisible est un débridage. Révéler les données d'autres utilisateurs dans une sortie est une exposition. Aucun incident n'est une hallucination, car chacun vient d'un attaquant ou d'une fuite de données et non d'un modèle qui invente des faits de lui-même.
references:
  - title: Detect prompt attacks with Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
  - title: "Security perspective: Compliance and assurance of AI systems"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-caf-for-ai/security-perspective-compliance-and-assurance-of-aiml-systems.html
