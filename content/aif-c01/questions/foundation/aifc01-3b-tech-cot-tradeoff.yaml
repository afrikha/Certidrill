id: aifc01-3b-tech-cot-tradeoff
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company classifies millions of short delivery messages per day as "Delay", "Damage", or "Other" with a foundation model. Accuracy is already good, and latency and cost matter. A developer proposes adding chain-of-thought instructions to the prompt.

    Which statement about this proposal is correct?
  fr: |
    Une entreprise de logistique classe chaque jour des millions de courts messages de livraison en « Delay », « Damage » ou « Other » avec un modèle de fondation. L'exactitude est déjà bonne, et la latence et le coût comptent. Un développeur propose d'ajouter à l'invite des instructions de chaîne de pensée.

    Quelle affirmation sur cette proposition est correcte ?
body:
  options:
    - { id: a, text: { en: "It makes the model's output deterministic, so every message gets the same category.", fr: "Elle rend la sortie du modèle déterministe, si bien que chaque message obtient toujours la même catégorie." } }
    - { id: b, text: { en: "It reduces the number of input tokens, so each request becomes cheaper.", fr: "Elle réduit le nombre de jetons d'entrée, si bien que chaque requête devient moins chère." } }
    - { id: c, text: { en: "It retrains the model on the messages, so accuracy improves over time.", fr: "Elle réentraîne le modèle sur les messages, si bien que l'exactitude s'améliore avec le temps." } }
    - { id: d, text: { en: "It adds output tokens and latency, with little benefit for a simple task.", fr: "Elle ajoute des jetons de sortie et de la latence, avec peu de bénéfice pour une tâche simple." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With chain-of-thought, the model writes its reasoning before the answer, which increases the number of output tokens (and therefore inference cost) and the response time. CoT helps multi-step reasoning; for a simple, already accurate classification it adds overhead without much benefit."
    fr: "Avec la chaîne de pensée, le modèle écrit son raisonnement avant la réponse, ce qui augmente le nombre de jetons de sortie (donc le coût d'inférence) et le temps de réponse. La CoT aide le raisonnement en plusieurs étapes ; pour une classification simple et déjà exacte, elle ajoute une surcharge sans grand bénéfice."
  options:
    a:
      en: "Chain-of-thought does not make generation deterministic; sampling parameters such as temperature control randomness."
      fr: "La chaîne de pensée ne rend pas la génération déterministe ; ce sont des paramètres d'échantillonnage comme la température qui règlent le caractère aléatoire."
    b:
      en: "CoT instructions add text to the prompt, so input tokens increase slightly rather than decrease."
      fr: "Les instructions CoT ajoutent du texte à l'invite : les jetons d'entrée augmentent légèrement au lieu de diminuer."
    c:
      en: "Prompt engineering never changes the model's weights; nothing is retrained."
      fr: "L'ingénierie de requête ne modifie jamais les pondérations du modèle ; rien n'est réentraîné."
references:
  - title: Give Amazon Nova time to think (chain-of-thought)
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-chain-of-thought.html
