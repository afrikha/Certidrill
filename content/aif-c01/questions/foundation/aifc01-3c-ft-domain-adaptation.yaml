id: aifc01-3c-ft-domain-adaptation
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm uses a foundation model (FM) from Amazon SageMaker JumpStart. The model often misunderstands legal jargon, and prompt engineering has not solved the problem. The firm has a limited set of unlabeled legal documents in text files.

    Which fine-tuning method should the firm use?
  fr: |
    Un cabinet d'avocats utilise un modèle de fondation (FM) d'Amazon SageMaker JumpStart. Le modèle comprend souvent mal le jargon juridique, et l'ingénierie de requête n'a pas résolu le problème. Le cabinet dispose d'un ensemble limité de documents juridiques non étiquetés dans des fichiers texte.

    Quelle méthode de réglage précis le cabinet doit-il utiliser ?
body:
  options:
    - { id: a, text: { en: "Instruction-based fine-tuning", fr: "Réglage précis fondé sur des instructions" } }
    - { id: b, text: { en: "Reinforcement learning from human feedback", fr: "Apprentissage par renforcement à partir des commentaires humains" } }
    - { id: c, text: { en: "Model distillation", fr: "Distillation de modèle" } }
    - { id: d, text: { en: "Domain adaptation fine-tuning", fr: "Réglage précis par adaptation au domaine" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Domain adaptation fine-tuning adapts a pre-trained FM to a specific domain with limited domain-specific data. AWS recommends it when prompt engineering does not customize the model enough, for example to handle industry jargon or technical terms. The training data is plain domain text (CSV, JSON, or TXT), so no labels are needed."
    fr: "Le réglage précis par adaptation au domaine adapte un FM préentraîné à un domaine précis avec des données limitées propres à ce domaine. AWS le recommande quand l'ingénierie de requête ne personnalise pas suffisamment le modèle, par exemple pour gérer un jargon sectoriel ou des termes techniques. Les données d'entraînement sont du texte brut du domaine (CSV, JSON ou TXT) : aucune étiquette n'est nécessaire."
  options:
    a:
      en: "Instruction-based fine-tuning needs labeled prompt-response pairs, which the firm does not have."
      fr: "Le réglage précis fondé sur des instructions nécessite des paires invite-réponse étiquetées, dont le cabinet ne dispose pas."
    b:
      en: "RLHF needs humans to rank model responses; it aligns behavior with preferences instead of teaching domain vocabulary from documents."
      fr: "Le RLHF nécessite que des humains classent des réponses du modèle ; il aligne le comportement sur des préférences au lieu d'enseigner le vocabulaire du domaine à partir de documents."
    c:
      en: "Distillation copies a larger model's behavior into a smaller model; it does not add the legal vocabulary of the firm's documents."
      fr: "La distillation reproduit le comportement d'un modèle plus grand dans un modèle plus petit ; elle n'ajoute pas le vocabulaire juridique des documents du cabinet."
references:
  - title: Fine-tune a large language model (LLM) using domain adaptation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning-domain-adaptation.html
