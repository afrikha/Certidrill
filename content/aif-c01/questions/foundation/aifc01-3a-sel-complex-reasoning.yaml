id: aifc01-3a-sel-complex-reasoning
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting company wants a foundation model (FM) to analyze long, complex documents that combine text, tables, and images, and to answer multi-step questions about them. For this application, the quality of the answers is more important than latency and cost.

    Which Amazon Nova model is MOST suitable?
  fr: |
    Un cabinet de conseil veut qu'un modèle de fondation (FM) analyse des documents longs et complexes qui combinent du texte, des tableaux et des images, et réponde à des questions en plusieurs étapes à leur sujet. Pour cette application, la qualité des réponses compte davantage que la latence et le coût.

    Quel modèle Amazon Nova est le PLUS adapté ?
body:
  options:
    - { id: a, text: "Amazon Nova Micro" }
    - { id: b, text: "Amazon Nova Lite" }
    - { id: c, text: "Amazon Nova Premier" }
    - { id: d, text: "Amazon Nova Sonic" }
answer: { optionId: c }
explanation:
  correct:
    en: "Model size and complexity are selection criteria: larger models are usually more capable but slower and more expensive. Amazon Nova Premier is the most capable Nova multimodal model for complex tasks, accepts text, images, and video, and has a 1M-token context window, so it fits a workload where answer quality comes before latency and cost."
    fr: "La taille et la complexité du modèle sont des critères de sélection : les grands modèles sont généralement plus performants, mais plus lents et plus chers. Amazon Nova Premier est le modèle multimodal Nova le plus performant pour les tâches complexes ; il accepte du texte, des images et des vidéos et a une fenêtre contextuelle de 1 million de jetons : il convient donc à une charge de travail où la qualité des réponses passe avant la latence et le coût."
  options:
    a:
      en: "Nova Micro is text-only and optimized for the lowest latency and cost, so it cannot read the images in the documents."
      fr: "Nova Micro est texte uniquement et optimisé pour la latence et le coût les plus faibles : il ne peut donc pas lire les images des documents."
    b:
      en: "Nova Lite is multimodal but positioned as a very low-cost, fast model; the scenario favors the most capable model."
      fr: "Nova Lite est multimodal, mais il est présenté comme un modèle rapide à très faible coût ; le scénario privilégie le modèle le plus performant."
    d:
      en: "Nova Sonic is a speech-to-speech model for spoken conversations; it does not analyze documents with tables and images."
      fr: "Nova Sonic est un modèle parole-parole destiné aux conversations orales ; il n'analyse pas de documents contenant des tableaux et des images."
references:
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
