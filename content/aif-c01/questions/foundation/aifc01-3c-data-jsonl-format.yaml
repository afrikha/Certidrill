id: aifc01-3c-data-jsonl-format
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company will fine-tune a text model in Amazon Bedrock. The company has 3,000 questions about its products, each with an approved answer. The data must be prepared in the format that Amazon Bedrock expects for this customization job.

    How should the company prepare the training data?
  fr: |
    Une entreprise va peaufiner un modèle de texte dans Amazon Bedrock. Elle dispose de 3 000 questions sur ses produits, chacune avec une réponse approuvée. Les données doivent être préparées dans le format qu'Amazon Bedrock attend pour cette tâche de personnalisation.

    Comment l'entreprise doit-elle préparer les données d'entraînement ?
body:
  options:
    - { id: a, text: { en: "Store the questions and answers as items in an Amazon DynamoDB table.", fr: "Stocker les questions et les réponses sous forme d'éléments dans une table Amazon DynamoDB." } }
    - { id: b, text: { en: "Upload the product manuals as PDF files to a knowledge base.", fr: "Charger les manuels des produits sous forme de fichiers PDF dans une base de connaissances." } }
    - { id: c, text: { en: "Write a JSON Lines file with one prompt-completion pair per line in Amazon S3.", fr: "Écrire dans Amazon S3 un fichier JSON Lines avec une paire `prompt`-`completion` par ligne." } }
    - { id: d, text: { en: "Save each question as a prompt variant in Amazon Bedrock Prompt Management.", fr: "Enregistrer chaque question comme variante d'invite dans Amazon Bedrock Prompt Management." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock fine-tuning reads .jsonl files from Amazon S3, with one JSON object per line. For non-conversational text, each line has a prompt and a completion field, such as the question and its approved answer; conversational data uses the Converse API format with messages."
    fr: "Le réglage précis d'Amazon Bedrock lit des fichiers .jsonl dans Amazon S3, avec un objet JSON par ligne. Pour du texte non conversationnel, chaque ligne comporte un champ `prompt` et un champ `completion`, par exemple la question et sa réponse approuvée ; les données conversationnelles utilisent le format de l'API Converse avec des messages."
  options:
    a:
      en: "Amazon Bedrock reads training and validation files from Amazon S3, not from a DynamoDB table."
      fr: "Amazon Bedrock lit les fichiers d'entraînement et de validation dans Amazon S3, pas dans une table DynamoDB."
    b:
      en: "A knowledge base serves documents for RAG at inference time; it is not training data, and the manuals are not the labeled pairs."
      fr: "Une base de connaissances fournit des documents pour le RAG au moment de l'inférence ; ce ne sont pas des données d'entraînement, et les manuels ne sont pas les paires étiquetées."
    d:
      en: "Prompt variants are alternative prompt configurations for testing; they are not a training dataset."
      fr: "Les variantes d'invite sont d'autres configurations d'invite destinées aux tests ; elles ne constituent pas un jeu de données d'entraînement."
references:
  - title: Prepare data for fine-tuning your models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
