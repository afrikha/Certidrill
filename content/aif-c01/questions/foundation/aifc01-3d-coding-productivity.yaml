id: aifc01-3d-coding-productivity
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company gives its development teams an AI coding assistant. The CTO wants to measure the impact of the assistant on team productivity.

    Which metric will meet this requirement?
  fr: |
    Un éditeur de logiciels fournit un assistant de codage IA à ses équipes de développement. Le directeur technique veut mesurer l'impact de l'assistant sur la productivité des équipes.

    Quelle métrique répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "The number of developers who installed the assistant", fr: "Le nombre de développeurs qui ont installé l'assistant" } }
    - { id: b, text: { en: "The average number of output tokens per code suggestion", fr: "Le nombre moyen de jetons de sortie par suggestion de code" } }
    - { id: c, text: { en: "The size of the context window of the FM", fr: "La taille de la fenêtre de contexte du FM" } }
    - { id: d, text: { en: "The change in pull request resolution time compared with a baseline", fr: "L'évolution du délai de résolution des pull requests par rapport à une référence" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS guidance measures the success of generative AI in software development with metrics such as pull request resolution time, time to market and productivity improvement per task. Baselines are established before the rollout so that the change can be measured."
    fr: "Les recommandations AWS mesurent le succès de l'IA générative dans le développement logiciel avec des métriques comme le délai de résolution des pull requests, le délai de mise sur le marché et le gain de productivité par tâche. Des références sont établies avant le déploiement pour pouvoir mesurer l'évolution."
  options:
    a:
      en: "Installations show adoption at best; they do not show that work gets done faster."
      fr: "Les installations montrent au mieux l'adoption ; elles ne montrent pas que le travail est fait plus vite."
    b:
      en: "Output tokens per suggestion describe usage and cost, not productivity."
      fr: "Les jetons de sortie par suggestion décrivent l'utilisation et le coût, pas la productivité."
    c:
      en: "The context window is a characteristic of the model, not a measure of its business impact."
      fr: "La fenêtre de contexte est une caractéristique du modèle, pas une mesure de son impact métier."
references:
  - title: Measuring the success of generative AI in software development
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-accelerate-software-dev-lifecycle-gen-ai/measuring-success.html
