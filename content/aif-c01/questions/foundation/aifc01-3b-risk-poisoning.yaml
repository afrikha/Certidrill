id: aifc01-3b-risk-poisoning
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company fine-tunes a foundation model with product reviews collected from a public website. A competitor posts hundreds of fake reviews that contain false claims about the company's products. After the next fine-tuning run, the model repeats these false claims.

    Which risk does this scenario describe?
  fr: |
    Une entreprise de distribution peaufine un modèle de fondation avec des avis produits collectés sur un site web public. Un concurrent publie des centaines de faux avis contenant des affirmations fausses sur les produits de l'entreprise. Après le réglage précis suivant, le modèle répète ces affirmations fausses.

    Quel risque ce scénario décrit-il ?
body:
  options:
    - { id: a, text: { en: "Jailbreaking", fr: "Débridage (jailbreaking)" } }
    - { id: b, text: { en: "Hijacking", fr: "Détournement" } }
    - { id: c, text: { en: "Poisoning", fr: "Empoisonnement" } }
    - { id: d, text: { en: "Exposure", fr: "Exposition" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Poisoning is the deliberate introduction of malicious or false data into the datasets that a model learns from or retrieves content from. The attacker never talks to the model; the corrupted data changes its behavior. Verifiable data sources, data lineage, and data quality checks reduce this risk."
    fr: "L'empoisonnement est l'introduction délibérée de données malveillantes ou fausses dans les jeux de données dont un modèle apprend ou dans lesquels il récupère du contenu. L'attaquant ne s'adresse jamais au modèle : ce sont les données corrompues qui modifient son comportement. Des sources de données vérifiables, la traçabilité des données et des contrôles de qualité réduisent ce risque."
  options:
    a:
      en: "Jailbreaking is a prompt that bypasses safety controls at inference time; here the attack happens in the training data."
      fr: "Le débridage est une invite qui contourne les contrôles de sûreté au moment de l'inférence ; ici, l'attaque a lieu dans les données d'entraînement."
    b:
      en: "Hijacking overrides the application's instructions through a prompt; no prompt is involved here."
      fr: "Le détournement remplace les instructions de l'application au moyen d'une invite ; aucune invite n'intervient ici."
    d:
      en: "Exposure is the disclosure of confidential data; the problem here is false data that the model learned."
      fr: "L'exposition est la divulgation de données confidentielles ; le problème ici vient de données fausses que le modèle a apprises."
references:
  - title: "Security perspective: Compliance and assurance of AI systems"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-caf-for-ai/security-perspective-compliance-and-assurance-of-aiml-systems.html
