id: aifc01-3a-cust-rag-vs-long-prompt
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's assistant answers about 50,000 employee questions each day. Today, the full 300-page employee handbook is added to every prompt so that the foundation model (FM) can answer, and each answer needs only a few paragraphs of the handbook. The company wants to reduce inference costs without training a model.

    Which solution will meet these requirements?
  fr: |
    L'assistant d'une entreprise répond à environ 50 000 questions d'employés par jour. Aujourd'hui, le manuel des employés complet de 300 pages est ajouté à chaque invite pour que le modèle de fondation (FM) puisse répondre, et chaque réponse n'a besoin que de quelques paragraphes du manuel. L'entreprise veut réduire les coûts d'inférence sans entraîner de modèle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Choose an FM with a larger context window, and keep the full handbook in every prompt.", fr: "Choisir un FM qui a une plus grande fenêtre de contexte, et garder le manuel complet dans chaque invite." } }
    - { id: b, text: { en: "Use RAG so that each prompt contains only the handbook passages relevant to the question.", fr: "Utiliser le RAG pour que chaque invite ne contienne que les passages du manuel pertinents pour la question." } }
    - { id: c, text: { en: "Add more examples of good answers to every prompt, together with the full handbook.", fr: "Ajouter à chaque invite davantage d'exemples de bonnes réponses, en plus du manuel complet." } }
    - { id: d, text: { en: "Raise the maximum tokens value so that the FM can read the whole handbook at once.", fr: "Augmenter le nombre maximal de jetons pour que le FM puisse lire tout le manuel d'un coup." } }
answer: { optionId: b }
explanation:
  correct:
    en: "On-demand inference is billed per input and output token, so sending a 300-page handbook with each of 50,000 daily questions is costly. With RAG, the handbook is chunked and embedded once; each question then retrieves only the relevant chunks, so each prompt is much shorter. RAG adds vector store costs but needs no training."
    fr: "L'inférence à la demande est facturée par jeton d'entrée et de sortie : envoyer un manuel de 300 pages avec chacune des 50 000 questions quotidiennes coûte donc cher. Avec le RAG, le manuel est découpé et vectorisé une seule fois ; chaque question ne récupère ensuite que les fragments pertinents, ce qui raccourcit fortement chaque invite. Le RAG ajoute des coûts de magasin de vecteurs, mais ne nécessite aucun entraînement."
  options:
    a:
      en: "A larger context window still processes and bills the whole handbook in every request."
      fr: "Une plus grande fenêtre de contexte traite et facture toujours le manuel complet à chaque requête."
    c:
      en: "More examples add even more input tokens to every request and raise the cost."
      fr: "Davantage d'exemples ajoutent encore plus de jetons d'entrée à chaque requête et augmentent le coût."
    d:
      en: "maxTokens limits the length of the response; it does not change how many input tokens are billed."
      fr: "maxTokens limite la longueur de la réponse ; il ne change pas le nombre de jetons d'entrée facturés."
references:
  - title: How Amazon Bedrock knowledge bases work
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
  - title: GENCOST01-BP01 Right-size model selection to optimize inference costs
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html
