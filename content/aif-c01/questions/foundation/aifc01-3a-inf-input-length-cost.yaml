id: aifc01-3a-inf-input-length-cost
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    For every request, a company sends a 12,000-token prompt to a foundation model (FM) on Amazon Bedrock with on-demand pricing and receives an answer of about 300 tokens. Most of the prompt is reference text that is not relevant to the question.

    Which change will reduce the cost of each request the MOST?
  fr: |
    Pour chaque requête, une entreprise envoie une invite de 12 000 jetons à un modèle de fondation (FM) sur Amazon Bedrock avec une tarification à la demande et reçoit une réponse d'environ 300 jetons. L'essentiel de l'invite est un texte de référence sans rapport avec la question.

    Quelle modification réduira le PLUS le coût de chaque requête ?
body:
  options:
    - { id: a, text: { en: "Increase the temperature of the model.", fr: "Augmenter la température du modèle." } }
    - { id: b, text: { en: "Increase the top K value of the model.", fr: "Augmenter la valeur de top K du modèle." } }
    - { id: c, text: { en: "Add more examples to the prompt.", fr: "Ajouter d'autres exemples à l'invite." } }
    - { id: d, text: { en: "Remove the irrelevant text from the prompt.", fr: "Retirer le texte sans rapport de l'invite." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With on-demand pricing, Amazon Bedrock charges for input tokens and output tokens. Here the input is about 40 times longer than the output, so removing the irrelevant reference text cuts most of the billable tokens of each request; a shorter input also reduces processing time."
    fr: "Avec la tarification à la demande, Amazon Bedrock facture les jetons d'entrée et les jetons de sortie. Ici, l'entrée est environ 40 fois plus longue que la sortie : retirer le texte de référence sans rapport supprime donc l'essentiel des jetons facturables de chaque requête, et une entrée plus courte réduit aussi le temps de traitement."
  options:
    a:
      en: "Temperature changes how random the output is; it does not change the number of tokens billed."
      fr: "La température modifie le caractère aléatoire de la sortie ; elle ne change pas le nombre de jetons facturés."
    b:
      en: "Top K changes how many candidate tokens are considered; the prompt keeps the same length."
      fr: "Top K change le nombre de jetons candidats envisagés ; l'invite garde la même longueur."
    c:
      en: "More examples add input tokens and increase the cost of each request."
      fr: "Davantage d'exemples ajoutent des jetons d'entrée et augmentent le coût de chaque requête."
references:
  - title: GENCOST01-BP01 Right-size model selection to optimize inference costs
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html
