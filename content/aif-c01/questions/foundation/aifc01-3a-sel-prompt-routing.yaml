id: aifc01-3a-sel-prompt-routing
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's English-language assistant receives a mix of simple and complex prompts. The company uses two models of the same model family on Amazon Bedrock. It wants each prompt to go to the less expensive model, unless the larger model is predicted to give a significantly better response. The company does not want to write its own routing logic.

    Which solution will meet these requirements?
  fr: |
    L'assistant en anglais d'une entreprise reçoit un mélange d'invites simples et complexes. L'entreprise utilise deux modèles d'une même famille de modèles sur Amazon Bedrock. Elle veut que chaque invite soit envoyée au modèle le moins cher, sauf si le modèle le plus grand doit donner, selon la prédiction, une réponse nettement meilleure. L'entreprise ne veut pas écrire sa propre logique de routage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Call the models through a global cross-Region inference profile.", fr: "Appeler les modèles par l'intermédiaire d'un profil d'inférence interrégional global." } }
    - { id: b, text: { en: "Use Amazon Bedrock intelligent prompt routing with the two models.", fr: "Utiliser le routage intelligent des invites d'Amazon Bedrock avec les deux modèles." } }
    - { id: c, text: { en: "Enable prompt caching for the two models of the family.", fr: "Activer la mise en cache des invites pour les deux modèles de la famille." } }
    - { id: d, text: { en: "Purchase Provisioned Throughput for the larger model.", fr: "Acheter du Provisioned Throughput pour le modèle le plus grand." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Intelligent prompt routing gives a single serverless endpoint that routes each request between models of the same family. It predicts the response quality of each model and switches from the fallback model only when the predicted quality difference exceeds the threshold that the company sets, which optimizes both quality and cost. It is optimized for English prompts, which matches this assistant."
    fr: "Le routage intelligent des invites fournit un point de terminaison sans serveur unique qui achemine chaque requête entre des modèles d'une même famille. Il prédit la qualité de réponse de chaque modèle et ne quitte le modèle de repli que si l'écart de qualité prévu dépasse le seuil défini par l'entreprise, ce qui optimise à la fois la qualité et le coût. Il est optimisé pour les invites en anglais, ce qui correspond à cet assistant."
  options:
    a:
      en: "Cross-Region inference chooses the AWS Region that processes a request; it does not choose between two models."
      fr: "L'inférence interrégionale choisit la Région AWS qui traite une requête ; elle ne choisit pas entre deux modèles."
    c:
      en: "Prompt caching reuses repeated prompt prefixes to lower latency and cost; it does not route prompts to a different model."
      fr: "La mise en cache des invites réutilise les préfixes d'invite répétés pour réduire la latence et le coût ; elle n'achemine pas les invites vers un autre modèle."
    d:
      en: "Provisioned Throughput reserves capacity for one model at an hourly price; it does not send simple prompts to the cheaper model."
      fr: "Le Provisioned Throughput réserve de la capacité pour un modèle à un prix horaire ; il n'envoie pas les invites simples vers le modèle le moins cher."
references:
  - title: Understanding intelligent prompt routing in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
