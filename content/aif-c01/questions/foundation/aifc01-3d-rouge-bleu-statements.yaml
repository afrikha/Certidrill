id: aifc01-3d-rouge-bleu-statements
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data science team is comparing automatic metrics to evaluate the outputs of an FM against reference texts.

    Which two statements about these metrics are true? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe de science des données compare des métriques automatiques pour évaluer les sorties d'un FM par rapport à des textes de référence.

    Quelles sont les deux affirmations exactes au sujet de ces métriques ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "BLEU compares the meaning of two texts by using embeddings from a language model.", fr: "BLEU compare le sens de deux textes à l'aide d'embeddings issus d'un modèle de langage." } }
    - { id: b, text: { en: "ROUGE measures n-gram overlap with the reference text, with a focus on recall.", fr: "ROUGE mesure le recouvrement de n-grammes avec le texte de référence, en mettant l'accent sur le rappel." } }
    - { id: c, text: { en: "BERTScore can score a response when no reference text is available.", fr: "BERTScore peut noter une réponse lorsqu'aucun texte de référence n'est disponible." } }
    - { id: d, text: { en: "BLEU focuses on n-gram precision and penalizes outputs that are too short.", fr: "BLEU met l'accent sur la précision des n-grammes et pénalise les sorties trop courtes." } }
    - { id: e, text: { en: "ROUGE gives a high score to a valid paraphrase that uses other words than the reference.", fr: "ROUGE donne un score élevé à une reformulation valide qui emploie d'autres mots que la référence." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "ROUGE and BLEU both measure n-gram overlap between the generated text and a reference text. ROUGE focuses on recall and is typical for summarization; BLEU focuses on precision, penalizes outputs that are too short, and is typical for machine translation."
    fr: "ROUGE et BLEU mesurent tous deux le recouvrement de n-grammes entre le texte généré et un texte de référence. ROUGE met l'accent sur le rappel et s'utilise typiquement pour le résumé ; BLEU met l'accent sur la précision, pénalise les sorties trop courtes et s'utilise typiquement pour la traduction automatique."
  options:
    a:
      en: "Comparing embeddings is what BERTScore does; BLEU counts n-grams."
      fr: "Comparer des embeddings, c'est ce que fait BERTScore ; BLEU compte des n-grammes."
    c:
      en: "BERTScore compares the generated text with a reference text, so it needs one; scoring without a reference calls for LLM-as-a-judge."
      fr: "BERTScore compare le texte généré à un texte de référence : il en faut donc un ; noter sans référence nécessite LLM-as-a-judge."
    e:
      en: "Because ROUGE counts shared n-grams, it penalizes valid rephrasing; that is its main limitation."
      fr: "Comme ROUGE compte les n-grammes communs, il pénalise les reformulations valides ; c'est sa principale limite."
references:
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
