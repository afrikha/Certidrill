id: aifc01-3c-eval-llm-judge
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must evaluate 900 responses from a model in Amazon Bedrock for qualities such as correctness and helpfulness. The company wants a score and a written explanation for each response. No employees are available to review the responses.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit évaluer 900 réponses d'un modèle d'Amazon Bedrock selon des qualités comme l'exactitude et l'utilité. Elle veut un score et une explication écrite pour chaque réponse. Aucun employé n'est disponible pour examiner les réponses.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a human-based model evaluation job with a new work team.", fr: "Créer une tâche d'évaluation humaine de modèle avec une nouvelle équipe de travail." } }
    - { id: b, text: { en: "Create an automatic evaluation job for the robustness metric only.", fr: "Créer une tâche d'évaluation automatique pour la seule métrique de robustesse." } }
    - { id: c, text: { en: "Create a model evaluation job that uses an LLM as a judge.", fr: "Créer une tâche d'évaluation de modèle qui utilise un LLM comme juge." } }
    - { id: d, text: { en: "Create a guardrail that blocks incorrect and unhelpful answers.", fr: "Créer une barrière de protection qui bloque les réponses inexactes et inutiles." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In an LLM-as-a-judge evaluation job, a generator model responds to the prompts and an evaluator model scores each prompt-response pair with the selected metrics, such as correctness and helpfulness, and explains its score. No human workers are needed."
    fr: "Dans une tâche d'évaluation LLM-as-a-judge, un modèle générateur répond aux invites et un modèle évaluateur note chaque paire invite-réponse selon les métriques choisies, comme l'exactitude et l'utilité, et explique sa note. Aucun évaluateur humain n'est nécessaire."
  options:
    a:
      en: "A human-based job needs workers to rate the responses, and no employees are available."
      fr: "Une tâche d'évaluation humaine nécessite des évaluateurs pour noter les réponses, et aucun employé n'est disponible."
    b:
      en: "Robustness measures how the output changes when prompts are perturbed; it gives neither correctness and helpfulness scores nor explanations."
      fr: "La robustesse mesure comment la sortie change quand les invites sont perturbées ; elle ne donne ni scores d'exactitude et d'utilité ni explications."
    d:
      en: "Guardrails filter harmful or unwanted content at run time; they do not score responses or explain a score."
      fr: "Les barrières de protection filtrent le contenu nuisible ou indésirable à l'exécution ; elles ne notent pas les réponses et n'expliquent pas de note."
references:
  - title: Evaluate model performance using another LLM as a judge
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
