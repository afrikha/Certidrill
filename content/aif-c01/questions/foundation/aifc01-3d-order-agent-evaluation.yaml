id: aifc01-3d-order-agent-evaluation
objective: "3.4.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An insurance company wants to evaluate the quality of its production AI agent continuously by using Amazon Bedrock AgentCore Evaluations.

    Which three actions should the company perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une compagnie d'assurance veut évaluer en continu la qualité de son agent d'IA de production à l'aide d'Amazon Bedrock AgentCore Evaluations.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: review
      text: { en: "Review the aggregated scores and investigate the low-scoring sessions.", fr: "Examiner les scores agrégés et analyser les sessions mal notées." }
    - id: tune
      text: { en: "Fine-tune the FM of the agent on its own traces.", fr: "Affiner le FM de l'agent sur ses propres traces." }
    - id: instr
      text: { en: "Instrument the agent so that it emits OpenTelemetry traces of its sessions and tool calls.", fr: "Instrumenter l'agent pour qu'il émette des traces OpenTelemetry de ses sessions et de ses appels d'outils." }
    - id: rag
      text: { en: "Run an Amazon Bedrock retrieve-only RAG evaluation job on the agent's tools.", fr: "Exécuter une tâche d'évaluation RAG Amazon Bedrock de récupération seule sur les outils de l'agent." }
    - id: online
      text: { en: "Configure an online evaluation with the evaluators to apply and a sampling rate.", fr: "Configurer une évaluation en ligne avec les évaluateurs à appliquer et un taux d'échantillonnage." }
answer:
  sequence: [instr, online, review]
explanation:
  correct:
    en: "AgentCore Evaluations scores telemetry, so the agent must first be instrumented (for example with AWS Distro for OpenTelemetry) to record traces, spans and tool calls. An online evaluation then applies built-in or custom evaluators to a sample of live sessions. Finally, the team reviews the aggregated scores on the dashboards and drills into low-scoring sessions."
    fr: "AgentCore Evaluations note des données de télémétrie : l'agent doit donc d'abord être instrumenté (par exemple avec AWS Distro for OpenTelemetry) pour enregistrer les traces, les spans et les appels d'outils. Une évaluation en ligne applique ensuite des évaluateurs intégrés ou personnalisés à un échantillon de sessions réelles. Enfin, l'équipe examine les scores agrégés dans les tableaux de bord et analyse en détail les sessions mal notées."
  options:
    tune:
      en: "Fine-tuning changes the model; it is not a step of an evaluation."
      fr: "L'affinage modifie le modèle ; ce n'est pas une étape d'évaluation."
    rag:
      en: "A retrieve-only RAG evaluation scores the retrieval from a RAG source, not the sessions and tool calls of an agent."
      fr: "Une évaluation RAG de récupération seule note la récupération depuis une source RAG, pas les sessions et les appels d'outils d'un agent."
references:
  - title: Evaluation terminology
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations-terminology.html
  - title: Evaluation types
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations-types.html
