id: aifc01-3b-pc-negative-canvas
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A grocery chain generates marketing images with Amazon Nova Canvas. The prompt "a fruit basket on a wooden table, no bananas" keeps producing images that contain bananas.

    How should the team change the request?
  fr: |
    Une chaîne d'épiceries génère des images marketing avec Amazon Nova Canvas. L'invite « a fruit basket on a wooden table, no bananas » produit sans cesse des images qui contiennent des bananes.

    Comment l'équipe doit-elle modifier la requête ?
body:
  options:
    - { id: a, text: { en: "Keep the prompt and set the negative prompt (negativeText) to \"no bananas\".", fr: "Conserver l'invite et définir l'invite négative (negativeText) sur « no bananas »." } }
    - { id: b, text: { en: "Change the prompt to \"a fruit basket on a wooden table, NOT bananas\".", fr: "Remplacer l'invite par « a fruit basket on a wooden table, NOT bananas »." } }
    - { id: c, text: { en: "Change the prompt to \"a fruit basket on a wooden table\" and set negativeText to \"bananas\".", fr: "Remplacer l'invite par « a fruit basket on a wooden table » et définir negativeText sur « bananas »." } }
    - { id: d, text: { en: "Change the prompt to \"a fruit basket on a wooden table without any bananas\".", fr: "Remplacer l'invite par « a fruit basket on a wooden table without any bananas »." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Image generation models do not understand negation: words such as \"no\", \"not\", or \"without\" in the prompt make the model include the object. Elements to exclude go in the negative prompt (negativeText), written as plain nouns without negation words."
    fr: "Les modèles de génération d'images ne comprennent pas la négation : des mots comme « no », « not » ou « without » dans l'invite poussent le modèle à inclure l'objet. Les éléments à exclure se placent dans l'invite négative (negativeText), sous forme de simples noms sans mots de négation."
  options:
    a:
      en: "The negative prompt is the right place, but it must not contain negation words, and the prompt itself still mentions bananas."
      fr: "L'invite négative est le bon endroit, mais elle ne doit pas contenir de mots de négation, et l'invite elle-même mentionne toujours les bananes."
    b:
      en: "Capital letters do not help an image model understand negation; it still reads bananas as something to include."
      fr: "Les majuscules n'aident pas un modèle d'images à comprendre la négation ; il lit toujours les bananes comme un élément à inclure."
    d:
      en: "\"Without\" is a negation word; the model still reads bananas as part of the image to draw."
      fr: "« Without » est un mot de négation ; le modèle lit toujours les bananes comme une partie de l'image à dessiner."
references:
  - title: Amazon Nova Canvas prompting best practices
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-image-generation.html
