id: aifc01-3c-eval-byo-responses
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants its legal experts to compare the answers of two models side by side. One model is in Amazon Bedrock. The other model runs in the company's own data center, and the company already has its responses to the evaluation prompts. The company wants to use a single evaluation job.

    Which solution will meet these requirements?
  fr: |
    Une entreprise veut que ses experts juridiques comparent côte à côte les réponses de deux modèles. Un modèle se trouve dans Amazon Bedrock. L'autre s'exécute dans le centre de données de l'entreprise, qui dispose déjà de ses réponses aux invites d'évaluation. L'entreprise veut utiliser une seule tâche d'évaluation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Import the on-premises model's responses into Prompt Management as variants and compare them.", fr: "Importer les réponses du modèle sur site dans Prompt Management sous forme de variantes et les comparer." } }
    - { id: b, text: { en: "Create an automatic evaluation job with a built-in dataset for both models.", fr: "Créer une tâche d'évaluation automatique avec un jeu de données intégré pour les deux modèles." } }
    - { id: c, text: { en: "Create a human-based evaluation job with the Bedrock model and the company's own inference responses.", fr: "Créer une tâche d'évaluation humaine avec le modèle Bedrock et les réponses d'inférence de l'entreprise." } }
    - { id: d, text: { en: "Create two human-based evaluation jobs, because a job supports only Bedrock models.", fr: "Créer deux tâches d'évaluation humaine, car une tâche ne prend en charge que des modèles Bedrock." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A human-based model evaluation job accepts one or two inference sources, and each source can be an Amazon Bedrock model or your own inference responses. The two sources do not have to be of the same type, so one job can compare the Bedrock model with the on-premises responses. The source name must match the modelIdentifier in the prompt dataset."
    fr: "Une tâche d'évaluation humaine de modèle accepte une ou deux sources d'inférence, et chaque source peut être un modèle Amazon Bedrock ou vos propres réponses d'inférence. Les deux sources ne sont pas obligatoirement du même type : une seule tâche peut donc comparer le modèle Bedrock avec les réponses sur site. Le nom de la source doit correspondre au modelIdentifier du jeu de données d'invites."
  options:
    a:
      en: "Prompt variants are prompt configurations, not stored model responses, and Prompt Management does not collect expert ratings."
      fr: "Les variantes d'invite sont des configurations d'invite, pas des réponses de modèle stockées, et Prompt Management ne recueille pas de notes d'experts."
    b:
      en: "An automatic job computes metrics without the legal experts, and built-in datasets do not contain the company's evaluation prompts."
      fr: "Une tâche automatique calcule des métriques sans les experts juridiques, et les jeux de données intégrés ne contiennent pas les invites d'évaluation de l'entreprise."
    d:
      en: "Human-based jobs also accept your own inference responses as a source, so one job is enough."
      fr: "Les tâches d'évaluation humaine acceptent aussi vos propres réponses d'inférence comme source : une seule tâche suffit."
references:
  - title: Create a human-based model evaluation job
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-jobs-management-create-human.html
