id: aifc01-3d-rag-citation-coverage
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A law firm's RAG assistant adds citations to its answers. Reviewers find answers that contain statements without any citation. The firm runs an Amazon Bedrock retrieve-and-generate RAG evaluation job and wants a metric that measures how well each response is supported by its cited passages and whether citations are missing.

    Which metric should the firm select?
  fr: |
    L'assistant RAG d'un cabinet d'avocats ajoute des citations à ses réponses. Les relecteurs trouvent des réponses qui contiennent des affirmations sans aucune citation. Le cabinet exécute une tâche d'évaluation RAG Amazon Bedrock de type récupération et génération, et veut une métrique qui mesure dans quelle mesure chaque réponse est étayée par ses passages cités et si des citations manquent.

    Quelle métrique le cabinet doit-il sélectionner ?
body:
  options:
    - { id: a, text: "Citation precision" }
    - { id: b, text: "Context coverage" }
    - { id: c, text: "Citation coverage" }
    - { id: d, text: "Context relevance" }
answer: { optionId: c }
explanation:
  correct:
    en: "Citation coverage measures how well the response is supported by the cited passages and whether there are missing citations. Statements without a citation lower this score."
    fr: "Citation coverage mesure dans quelle mesure la réponse est étayée par les passages cités et s'il manque des citations. Les affirmations sans citation font baisser ce score."
  options:
    a:
      en: "Citation precision measures how many of the cited passages were correctly cited; it looks at the citations that exist, so it does not reveal missing ones."
      fr: "Citation precision mesure combien de passages cités l'ont été à bon escient ; elle porte sur les citations présentes et ne révèle donc pas celles qui manquent."
    b:
      en: "Context coverage is a retrieval metric that compares the retrieved texts with ground truth; it does not examine the citations of a response."
      fr: "Context coverage est une métrique de récupération qui compare les textes récupérés à la vérité terrain ; elle n'examine pas les citations d'une réponse."
    d:
      en: "Context relevance measures whether the retrieved texts are relevant to the question, not how the response cites them."
      fr: "Context relevance mesure si les textes récupérés sont pertinents pour la question, pas la façon dont la réponse les cite."
references:
  - title: Use metrics to understand RAG system performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
