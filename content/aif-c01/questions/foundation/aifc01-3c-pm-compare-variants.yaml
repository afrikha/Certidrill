id: aifc01-3c-pm-compare-variants
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A prompt engineer is writing a prompt in the prompt builder of Amazon Bedrock Prompt Management. The engineer wants to run the same prompt with two different models and different temperature settings, and to view the outputs side by side before choosing a configuration.

    Which solution will meet these requirements?
  fr: |
    Un ingénieur des invites rédige une invite dans le Prompt builder d'Amazon Bedrock Prompt Management. Il veut exécuter la même invite avec deux modèles différents et des réglages de température différents, puis afficher les sorties côte à côte avant de choisir une configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a version of the prompt for each model and invoke each version.", fr: "Créer une version de l'invite pour chaque modèle et appeler chaque version." } }
    - { id: b, text: { en: "Create prompt variants with each configuration and compare them.", fr: "Créer des variantes d'invite avec chaque configuration et les comparer." } }
    - { id: c, text: { en: "Use the Optimize option to rewrite the prompt for the target model.", fr: "Utiliser l'option Optimize pour réécrire l'invite pour le modèle cible." } }
    - { id: d, text: { en: "Create a guardrail with a contextual grounding check for each model.", fr: "Créer une barrière de protection avec un contrôle d'ancrage contextuel pour chaque modèle." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A prompt variant is an alternative configuration of the prompt, such as a different message, model or inference configuration. In the prompt builder you can create variants, compare up to three of them side by side, and keep the one that works best."
    fr: "Une variante d'invite est une autre configuration de l'invite, par exemple un message, un modèle ou une configuration d'inférence différents. Dans le Prompt builder, vous pouvez créer des variantes, en comparer jusqu'à trois côte à côte et conserver celle qui fonctionne le mieux."
  options:
    a:
      en: "Versions are snapshots for deployment; they are not shown side by side while the engineer is still choosing a configuration."
      fr: "Les versions sont des instantanés destinés au déploiement ; elles ne s'affichent pas côte à côte pendant que l'ingénieur choisit encore une configuration."
    c:
      en: "Prompt optimization rewrites one prompt for one chosen model; it does not run two models with different temperature settings."
      fr: "L'optimisation d'invite réécrit une invite pour un seul modèle choisi ; elle n'exécute pas deux modèles avec des réglages de température différents."
    d:
      en: "A contextual grounding check filters ungrounded or irrelevant responses at run time; it does not compare prompt configurations."
      fr: "Un contrôle d'ancrage contextuel filtre à l'exécution les réponses non ancrées ou hors sujet ; il ne compare pas des configurations d'invite."
references:
  - title: Construct and store reusable prompts with Prompt management in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
  - title: Create a prompt using Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-create.html
