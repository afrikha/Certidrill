id: aifc01-3b-risk-injection-measures
objective: "3.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is building a generative AI application on Amazon Bedrock. Under the shared responsibility model, the company must protect the application against prompt injection.

    Which two measures should the company take? (Choose two.)
  fr: |
    Une entreprise crée une application d'IA générative sur Amazon Bedrock. Selon le modèle de responsabilité partagée, l'entreprise doit protéger l'application contre l'injection d'invite.

    Quelles sont les deux mesures que l'entreprise doit prendre ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Validate and sanitize user input before sending it to the model", fr: "Valider et assainir l'entrée de l'utilisateur avant de l'envoyer au modèle" } }
    - { id: b, text: { en: "Concatenate raw user input directly into the system prompt", fr: "Concaténer l'entrée brute de l'utilisateur directement dans l'invite système" } }
    - { id: c, text: { en: "Increase the temperature so that attacks produce random output", fr: "Augmenter la température pour que les attaques produisent une sortie aléatoire" } }
    - { id: d, text: { en: "Associate an Amazon Bedrock guardrail with prompt attack detection", fr: "Associer une barrière de protection Amazon Bedrock avec détection des attaques d'invite" } }
    - { id: e, text: { en: "Rely on AWS to block prompt injection in the application's code", fr: "Compter sur AWS pour bloquer l'injection d'invite dans le code de l'application" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS secures the infrastructure and the Amazon Bedrock service; the customer secures its application. AWS recommends validating and sanitizing all user input before it reaches the model and using Amazon Bedrock Guardrails to help detect and block prompt attacks."
    fr: "AWS sécurise l'infrastructure et le service Amazon Bedrock ; le client sécurise son application. AWS recommande de valider et d'assainir toute entrée de l'utilisateur avant qu'elle n'atteigne le modèle et d'utiliser Amazon Bedrock Guardrails pour aider à détecter et bloquer les attaques d'invite."
  options:
    b:
      en: "Concatenating raw input into instructions is the insecure pattern that makes injection possible, much like SQL injection."
      fr: "Concaténer une entrée brute dans les instructions est la pratique non sécurisée qui rend l'injection possible, comme pour l'injection SQL."
    c:
      en: "Temperature controls randomness; a higher value does not stop injected instructions from being followed."
      fr: "La température règle le caractère aléatoire ; une valeur plus élevée n'empêche pas que des instructions injectées soient suivies."
    e:
      en: "Preventing prompt injection in the application is the customer's responsibility, not AWS's."
      fr: "Empêcher l'injection d'invite dans l'application relève de la responsabilité du client, pas d'AWS."
references:
  - title: Prompt injection security
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-injection.html
