id: aifc01-3b-agent-memory-longterm
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An airline runs a booking agent on Amazon Bedrock AgentCore. Customers state preferences such as "I always want a window seat." The airline wants the agent to apply these preferences automatically in future conversations, days or weeks later, without customers repeating them.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Une compagnie aérienne exécute un agent de réservation sur Amazon Bedrock AgentCore. Les clients indiquent des préférences comme « Je veux toujours un siège côté hublot ». La compagnie veut que l'agent applique automatiquement ces préférences lors de conversations futures, des jours ou des semaines plus tard, sans que les clients les répètent.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Use AgentCore Memory with short-term memory for each session.", fr: "Utiliser AgentCore Memory avec la mémoire à court terme de chaque session." } }
    - { id: b, text: { en: "Increase the maximum length of the model's responses.", fr: "Augmenter la longueur maximale des réponses du modèle." } }
    - { id: c, text: { en: "Expose the booking API to the agent through AgentCore Gateway.", fr: "Exposer l'API de réservation à l'agent au moyen d'AgentCore Gateway." } }
    - { id: d, text: { en: "Use AgentCore Memory with long-term memory across sessions.", fr: "Utiliser AgentCore Memory avec la mémoire à long terme entre les sessions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AgentCore Memory provides two kinds of memory. Long-term memory automatically extracts and stores insights such as user preferences and important facts across sessions, so the agent can offer a window seat in a later booking. It is a managed capability, so the airline does not build its own preference store."
    fr: "AgentCore Memory fournit deux types de mémoire. La mémoire à long terme extrait et stocke automatiquement des informations comme les préférences des utilisateurs et les faits importants d'une session à l'autre, si bien que l'agent peut proposer un siège côté hublot lors d'une réservation ultérieure. C'est une fonctionnalité gérée : la compagnie ne crée pas son propre stockage de préférences."
  options:
    a:
      en: "Short-term memory keeps turn-by-turn context within a single session only; the preference would be lost in the next conversation."
      fr: "La mémoire à court terme conserve le contexte tour par tour au sein d'une seule session ; la préférence serait perdue lors de la conversation suivante."
    b:
      en: "The maximum length limits the size of a response; it does not make the model remember anything between sessions."
      fr: "La longueur maximale limite la taille d'une réponse ; elle ne fait rien mémoriser au modèle d'une session à l'autre."
    c:
      en: "Gateway turns APIs and Lambda functions into tools that the agent can call; it does not store user preferences."
      fr: "Gateway transforme des API et des fonctions Lambda en outils que l'agent peut appeler ; il ne stocke pas les préférences des utilisateurs."
references:
  - title: Add memory to your Amazon Bedrock AgentCore agent
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html
