id: aifc01-3d-bedrock-summary-metric
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A legal services company runs an Amazon Bedrock automatic model evaluation job with the text summarization task type. The company selects the accuracy metric.

    Which metric does Amazon Bedrock compute for accuracy in this job?
  fr: |
    Un cabinet de services juridiques exécute une tâche d'évaluation de modèle automatique Amazon Bedrock avec le type de tâche de résumé de texte. L'entreprise sélectionne la métrique d'exactitude (accuracy).

    Quelle métrique Amazon Bedrock calcule-t-il pour l'exactitude dans cette tâche ?
body:
  options:
    - { id: a, text: "BERTScore" }
    - { id: b, text: { en: "Real world knowledge (RWK) score", fr: "Score RWK (Real world knowledge)" } }
    - { id: c, text: { en: "F1 score", fr: "Score F1" } }
    - { id: d, text: { en: "Detoxify algorithm score", fr: "Score de l'algorithme Detoxify" } }
answer: { optionId: a }
explanation:
  correct:
    en: "For the text summarization task type, Amazon Bedrock measures accuracy with BERTScore, which compares the generated summary with the reference summary by semantic similarity. Robustness for this task type is reported as the relative change in BERTScore when the prompts are perturbed."
    fr: "Pour le type de tâche de résumé de texte, Amazon Bedrock mesure l'exactitude avec BERTScore, qui compare le résumé généré au résumé de référence par similarité sémantique. La robustesse de ce type de tâche est indiquée sous la forme de la variation relative du BERTScore lorsque les invites sont perturbées."
  options:
    b:
      en: "The real world knowledge (RWK) score is the accuracy metric of the general text generation task type."
      fr: "Le score RWK (Real world knowledge) est la métrique d'exactitude du type de tâche de génération de texte générale."
    c:
      en: "The F1 score is the accuracy metric of the question and answer task type."
      fr: "Le score F1 est la métrique d'exactitude du type de tâche de questions-réponses."
    d:
      en: "The Detoxify algorithm measures toxicity, not accuracy."
      fr: "L'algorithme Detoxify mesure la toxicité, pas l'exactitude."
references:
  - title: Review metrics for an automated model evaluation job in Amazon Bedrock (console)
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-report-programmatic.html
