id: aifc01-3b-agent-strands-sdk
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A development team wants to write AI agents in Python. The team wants an open-source SDK from AWS that takes a model-driven approach, supports multi-agent patterns and the Model Context Protocol (MCP), and works with models on Amazon Bedrock.

    Which option will meet these requirements?
  fr: |
    Une équipe de développement veut écrire des agents d'IA en Python. L'équipe veut un SDK open source d'AWS qui adopte une approche pilotée par le modèle, prend en charge les modèles multi-agents et le Model Context Protocol (MCP), et fonctionne avec les modèles d'Amazon Bedrock.

    Quelle option répond à ces exigences ?
body:
  options:
    - { id: a, text: "Strands Agents" }
    - { id: b, text: "Kiro" }
    - { id: c, text: "AWS Transform" }
    - { id: d, text: "Amazon SageMaker JumpStart" }
answer: { optionId: a }
explanation:
  correct:
    en: "Strands Agents is an open-source SDK from AWS for building agents with a model-first design: the foundation model drives the agent loop and decides which tools to call. It includes multi-agent patterns (swarm, graph, workflow), native MCP support, and integration with Amazon Bedrock and other providers."
    fr: "Strands Agents est un SDK open source d'AWS pour créer des agents selon une conception centrée sur le modèle : le modèle de fondation pilote la boucle de l'agent et décide des outils à appeler. Il propose des modèles multi-agents (swarm, graph, workflow), la prise en charge native de MCP et l'intégration avec Amazon Bedrock et d'autres fournisseurs."
  options:
    b:
      en: "Kiro is an AI-powered development environment that helps developers write software; it is not an SDK for building agents into an application."
      fr: "Kiro est un environnement de développement doté d'IA qui aide les développeurs à écrire du logiciel ; ce n'est pas un SDK pour intégrer des agents à une application."
    c:
      en: "AWS Transform uses its own agents to migrate and modernize workloads such as VMware, mainframe, and .NET; it is not an SDK for custom agents."
      fr: "AWS Transform utilise ses propres agents pour migrer et moderniser des charges de travail comme VMware, le mainframe et .NET ; ce n'est pas un SDK pour des agents personnalisés."
    d:
      en: "SageMaker JumpStart offers pretrained models and solution templates, not an agent SDK."
      fr: "SageMaker JumpStart propose des modèles pré-entraînés et des modèles de solutions, pas un SDK d'agents."
references:
  - title: Strands Agents
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
  - title: What is AWS Transform?
    url: https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html
