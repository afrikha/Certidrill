id: aifc01-3d-token-metrics-cost
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company's assistant calls an Amazon Bedrock model with on-demand, token-based pricing. The company wants to estimate the model cost per interaction from Amazon CloudWatch metrics, the model's prices, and the number of interactions.

    Which CloudWatch metrics should the company use?
  fr: |
    L'assistant d'un groupe de médias appelle un modèle Amazon Bedrock avec une tarification à la demande basée sur les jetons. L'entreprise veut estimer le coût du modèle par interaction à partir de métriques Amazon CloudWatch, des prix du modèle et du nombre d'interactions.

    Quelles métriques CloudWatch l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "InputTokenCount and OutputTokenCount" }
    - { id: b, text: "InvocationLatency and TimeToFirstToken" }
    - { id: c, text: "InvocationThrottles and InvocationClientErrors" }
    - { id: d, text: "EstimatedTPMQuotaUsage only" }
answer: { optionId: a }
explanation:
  correct:
    en: "With on-demand token-based pricing, the model cost depends on the number of input and output tokens. The AWS/Bedrock namespace publishes InputTokenCount and OutputTokenCount; multiplied by the model's per-token prices and divided by the number of interactions, they give the model cost per interaction."
    fr: "Avec une tarification à la demande basée sur les jetons, le coût du modèle dépend du nombre de jetons d'entrée et de sortie. L'espace de noms AWS/Bedrock publie InputTokenCount et OutputTokenCount : multipliés par les prix par jeton du modèle et divisés par le nombre d'interactions, ils donnent le coût du modèle par interaction."
  options:
    b:
      en: "These metrics measure latency, which affects user experience but not the token-based cost."
      fr: "Ces métriques mesurent la latence, qui influe sur l'expérience utilisateur mais pas sur le coût basé sur les jetons."
    c:
      en: "These metrics count throttled and failed requests; they are reliability signals, not cost inputs."
      fr: "Ces métriques comptent les requêtes limitées et en échec ; ce sont des signaux de fiabilité, pas des données de coût."
    d:
      en: "EstimatedTPMQuotaUsage approximates quota consumption and is not meant for billing; it does not separate input and output tokens, which have different prices."
      fr: "EstimatedTPMQuotaUsage donne une approximation de la consommation de quota et n'est pas destiné à la facturation ; il ne distingue pas les jetons d'entrée et de sortie, qui ont des prix différents."
references:
  - title: Monitor bedrock-runtime inference using CloudWatch metrics
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-cw.html
