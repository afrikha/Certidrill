id: aifc01-3b-bp-discovery-playground
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A publishing company is new to generative AI. Before building an application, the editors want to discover which tasks a foundation model on Amazon Bedrock handles well, such as summarizing chapters or suggesting titles, by trying prompts themselves.

    Which approach will meet these requirements with the LEAST effort?
  fr: |
    Une maison d'édition découvre l'IA générative. Avant de créer une application, les éditeurs veulent découvrir les tâches qu'un modèle de fondation sur Amazon Bedrock traite bien, comme résumer des chapitres ou suggérer des titres, en essayant eux-mêmes des invites.

    Quelle approche répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the model on the company's books, then test the custom model.", fr: "Peaufiner le modèle sur les livres de l'entreprise, puis tester le modèle personnalisé." } }
    - { id: b, text: { en: "Try different prompts in the playgrounds of the Amazon Bedrock console.", fr: "Essayer différentes invites dans les terrains de jeu (playgrounds) de la console Amazon Bedrock." } }
    - { id: c, text: { en: "Build a production application and collect feedback from readers.", fr: "Créer une application de production et recueillir les commentaires des lecteurs." } }
    - { id: d, text: { en: "Train a new model in Amazon SageMaker AI on the company's catalog.", fr: "Entraîner un nouveau modèle dans Amazon SageMaker AI sur le catalogue de l'entreprise." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Discovery means exploring what a model can and cannot do by experimenting with prompts. The playgrounds in the Amazon Bedrock console let users send prompts to foundation models and compare results without writing code or training anything."
    fr: "La découverte consiste à explorer ce qu'un modèle sait faire ou non en expérimentant des invites. Les terrains de jeu de la console Amazon Bedrock permettent d'envoyer des invites à des modèles de fondation et de comparer les résultats sans écrire de code ni rien entraîner."
  options:
    a:
      en: "Fine-tuning is a customization step that comes after the team knows what the base model can do; it requires data preparation and a training job."
      fr: "Le peaufinage est une étape de personnalisation qui intervient une fois que l'équipe sait ce dont le modèle de base est capable ; il demande une préparation des données et une tâche d'entraînement."
    c:
      en: "Building a production application before exploring the model is the most effort and the most risk."
      fr: "Créer une application de production avant d'explorer le modèle représente le plus d'effort et le plus de risque."
    d:
      en: "Training a new model requires ML expertise and large datasets, which the editors do not need for exploration."
      fr: "Entraîner un nouveau modèle demande une expertise en ML et de grands jeux de données, inutiles aux éditeurs pour une exploration."
references:
  - title: Generate responses in the console using playgrounds
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/playgrounds.html
