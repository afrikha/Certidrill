id: aifc01-3b-pc-add-context
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company uses a foundation model to write release notes. The notes are accurate but generic. The team adds a paragraph to the prompt that describes the target readers (hospital IT administrators), the product's main features, and the purpose of the notes.

    Which prompt element did the team add?
  fr: |
    Un éditeur de logiciels utilise un modèle de fondation pour rédiger des notes de version. Les notes sont exactes mais génériques. L'équipe ajoute à l'invite un paragraphe qui décrit les lecteurs cibles (administrateurs informatiques d'hôpitaux), les principales fonctionnalités du produit et l'objectif des notes.

    Quel élément d'invite l'équipe a-t-elle ajouté ?
body:
  options:
    - { id: a, text: { en: "Negative prompt", fr: "Invite négative" } }
    - { id: b, text: { en: "Context", fr: "Contexte" } }
    - { id: c, text: { en: "Output indicator", fr: "Indicateur de sortie" } }
    - { id: d, text: { en: "Few-shot examples", fr: "Exemples few-shot" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Context is the background information in a prompt, such as the audience, the purpose, and domain facts. It situates the model in the target scenario, so responses become more relevant and less generic."
    fr: "Le contexte désigne les informations de fond d'une invite, comme le public, l'objectif et les faits du domaine. Il situe le modèle dans le scénario cible, si bien que les réponses deviennent plus pertinentes et moins génériques."
  options:
    a:
      en: "A negative prompt states what the output must avoid or exclude; the paragraph describes the audience and the product instead."
      fr: "Une invite négative indique ce que la sortie doit éviter ou exclure ; le paragraphe décrit plutôt le public et le produit."
    c:
      en: "An output indicator specifies the expected type or format of the output, such as a list or JSON."
      fr: "Un indicateur de sortie précise le type ou le format attendu de la sortie, comme une liste ou du JSON."
    d:
      en: "Few-shot examples are sample inputs with their expected outputs; the paragraph contains no examples."
      fr: "Les exemples few-shot sont des exemples d'entrées avec leurs sorties attendues ; le paragraphe ne contient aucun exemple."
references:
  - title: Creating precise prompts
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-precision.html
