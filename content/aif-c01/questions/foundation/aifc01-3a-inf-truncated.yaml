id: aifc01-3a-inf-truncated
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer uses the Amazon Bedrock Converse API to generate product descriptions. Many responses end in the middle of a sentence, and the API response reports a stop reason of max_tokens.

    Which change will fix this issue?
  fr: |
    Un développeur utilise l'API Converse d'Amazon Bedrock pour générer des descriptions de produits. De nombreuses réponses s'arrêtent au milieu d'une phrase, et la réponse de l'API indique le motif d'arrêt max_tokens.

    Quelle modification résout ce problème ?
body:
  options:
    - { id: a, text: { en: "Increase the temperature value.", fr: "Augmenter la valeur de la température." } }
    - { id: b, text: { en: "Add a stop sequence to the request.", fr: "Ajouter une séquence d'arrêt à la requête." } }
    - { id: c, text: { en: "Increase the maxTokens value.", fr: "Augmenter la valeur de maxTokens." } }
    - { id: d, text: { en: "Decrease the top P value.", fr: "Diminuer la valeur de top P." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The maxTokens inference parameter sets the maximum number of tokens allowed in the generated response. A stop reason of max_tokens means that the model reached this limit before it finished, so the text is cut off. Raising maxTokens lets the model complete its descriptions, at the cost of more output tokens."
    fr: "Le paramètre d'inférence maxTokens définit le nombre maximal de jetons autorisé dans la réponse générée. Le motif d'arrêt max_tokens signifie que le modèle a atteint cette limite avant d'avoir terminé : le texte est donc coupé. Augmenter maxTokens permet au modèle de terminer ses descriptions, au prix de jetons de sortie supplémentaires."
  options:
    a:
      en: "Temperature changes how random the token choice is; it does not change where the response is cut off."
      fr: "La température change le caractère aléatoire du choix des jetons ; elle ne change pas l'endroit où la réponse est coupée."
    b:
      en: "A stop sequence makes the model stop earlier, when it generates a given string; it cannot make the response longer."
      fr: "Une séquence d'arrêt fait s'arrêter le modèle plus tôt, quand il génère une chaîne donnée ; elle ne peut pas allonger la réponse."
    d:
      en: "Top P limits the set of candidate tokens; it does not raise the length limit that the responses reach."
      fr: "Top P limite l'ensemble des jetons candidats ; il ne relève pas la limite de longueur atteinte par les réponses."
references:
  - title: InferenceConfiguration
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InferenceConfiguration.html
  - title: Converse
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
