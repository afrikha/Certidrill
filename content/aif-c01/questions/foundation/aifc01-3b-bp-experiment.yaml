id: aifc01-3b-bp-experiment
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team writes its first prompt for a contract summarization feature. The first results are acceptable but not as good as the team expects.

    Which approach does AWS recommend for improving the prompt?
  fr: |
    Une équipe rédige sa première invite pour une fonction de résumé de contrats. Les premiers résultats sont acceptables, mais pas aussi bons que l'équipe l'espère.

    Quelle approche AWS recommande-t-il pour améliorer l'invite ?
body:
  options:
    - { id: a, text: { en: "Test variations of the prompt, review the outputs, and refine it in iterations.", fr: "Tester des variantes de l'invite, examiner les sorties et l'affiner par itérations." } }
    - { id: b, text: { en: "Keep the first prompt, because a model always follows fixed prompt rules.", fr: "Garder la première invite, car un modèle suit toujours des règles d'invite fixes." } }
    - { id: c, text: { en: "Fine-tune the model before changing any word of the prompt.", fr: "Peaufiner le modèle avant de modifier le moindre mot de l'invite." } }
    - { id: d, text: { en: "Copy a prompt written for a different task and a different model.", fr: "Copier une invite rédigée pour une autre tâche et un autre modèle." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Prompt engineering is an iterative process: there are no fixed rules for how a model produces output, so teams experiment with wording, structure, context, and examples, review the results, and refine the prompt until it meets the success criteria."
    fr: "L'ingénierie de requête est un processus itératif : il n'existe pas de règles fixes sur la manière dont un modèle produit sa sortie. Les équipes expérimentent donc la formulation, la structure, le contexte et les exemples, examinent les résultats et affinent l'invite jusqu'à atteindre les critères de réussite."
  options:
    b:
      en: "Small changes in wording, structure, or examples can change model output significantly, so the first prompt is rarely the best."
      fr: "De petits changements de formulation, de structure ou d'exemples peuvent modifier sensiblement la sortie du modèle : la première invite est rarement la meilleure."
    c:
      en: "Prompt refinement is cheaper and faster than fine-tuning, so it comes first; fine-tuning is considered only when prompting is not enough."
      fr: "Affiner l'invite est moins cher et plus rapide que le réglage précis, donc cela passe en premier ; le réglage précis n'est envisagé que si l'invite ne suffit pas."
    d:
      en: "Prompts depend on the task and on the model; a prompt designed for another task and model is unlikely to fit."
      fr: "Les invites dépendent de la tâche et du modèle ; une invite conçue pour une autre tâche et un autre modèle a peu de chances de convenir."
references:
  - title: What is Prompt Engineering?
    url: https://aws.amazon.com/what-is/prompt-engineering/
