id: aifc01-3b-risk-input-tags
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company calls the InvokeModel API of Amazon Bedrock with a guardrail that has the prompt attack filter turned on. Each prompt combines the developer's system instructions with the user's text. The system instructions, such as "You are a banking assistant...", resemble role-change attacks. The company wants the filter to detect attacks in the user's text without treating its own system instructions as attacks.

    What should the company do?
  fr: |
    Une entreprise appelle l'API InvokeModel d'Amazon Bedrock avec une barrière de protection dont le filtre d'attaques d'invite est activé. Chaque invite combine les instructions système du développeur et le texte de l'utilisateur. Les instructions système, comme « You are a banking assistant... », ressemblent à des attaques de changement de rôle. L'entreprise veut que le filtre détecte les attaques dans le texte de l'utilisateur sans traiter ses propres instructions système comme des attaques.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Set the input strength of the prompt attack filter to NONE.", fr: "Régler l'intensité d'entrée du filtre d'attaques d'invite sur NONE." } }
    - { id: b, text: { en: "Wrap the user's text in guardrail input tags inside the prompt.", fr: "Encadrer le texte de l'utilisateur par des balises d'entrée de la barrière de protection dans l'invite." } }
    - { id: c, text: { en: "Move the system instructions to the end of the user's text.", fr: "Déplacer les instructions système à la fin du texte de l'utilisateur." } }
    - { id: d, text: { en: "Add a denied topic that lists the wording of the system instructions.", fr: "Ajouter un sujet refusé qui reprend la formulation des instructions système." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Because a system instruction can look like an injected instruction, Amazon Bedrock Guardrails lets developers wrap the user input in guardrail input tags. The prompt attack filter then evaluates only the tagged content and excludes the developer's system prompt. With InvokeModel and InvokeModelWithResponseStream, prompt attacks are filtered only when input tags are used."
    fr: "Comme une instruction système peut ressembler à une instruction injectée, Amazon Bedrock Guardrails permet d'encadrer l'entrée de l'utilisateur par des balises d'entrée. Le filtre d'attaques d'invite n'évalue alors que le contenu balisé et exclut l'invite système du développeur. Avec InvokeModel et InvokeModelWithResponseStream, les attaques d'invite ne sont filtrées que si des balises d'entrée sont utilisées."
  options:
    a:
      en: "Strength NONE turns off the protection, so real attacks in the user's text would no longer be blocked."
      fr: "L'intensité NONE désactive la protection : les véritables attaques présentes dans le texte de l'utilisateur ne seraient plus bloquées."
    c:
      en: "Changing the position of the instructions does not tell the guardrail which part of the prompt is the user's input."
      fr: "Changer la position des instructions n'indique pas à la barrière de protection quelle partie de l'invite est l'entrée de l'utilisateur."
    d:
      en: "A denied topic would block more requests that contain this wording, not fewer."
      fr: "Un sujet refusé bloquerait davantage de requêtes contenant cette formulation, et non moins."
references:
  - title: Detect prompt attacks with Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
