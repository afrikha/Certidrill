id: aifc01-3c-eval-rag-knowledge-base
objective: "3.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has built an assistant on an Amazon Bedrock knowledge base. Before launch, the company wants to measure whether the knowledge base retrieves highly relevant passages and whether the generated answers are useful and appropriate. The company has a set of queries with the expected retrieved texts and expected answers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a créé un assistant sur une base de connaissances Amazon Bedrock. Avant le lancement, elle veut mesurer si la base de connaissances récupère des passages très pertinents et si les réponses générées sont utiles et appropriées. Elle dispose d'un ensemble de requêtes avec les textes récupérés attendus et les réponses attendues.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an automatic model evaluation job on the FM with the built-in TREX dataset.", fr: "Exécuter une tâche d'évaluation automatique de modèle sur le FM avec le jeu de données intégré TREX." } }
    - { id: b, text: { en: "Add a contextual grounding check to a guardrail and count the blocked answers.", fr: "Ajouter un contrôle d'ancrage contextuel à une barrière de protection et compter les réponses bloquées." } }
    - { id: c, text: { en: "Create a human-based evaluation job that rates the FM's answers without retrieval.", fr: "Créer une tâche d'évaluation humaine qui note les réponses du FM sans récupération." } }
    - { id: d, text: { en: "Run an Amazon Bedrock RAG evaluation job on the knowledge base with the queries.", fr: "Exécuter une tâche d'évaluation RAG d'Amazon Bedrock sur la base de connaissances avec les requêtes." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A RAG evaluation job in Amazon Bedrock evaluations computes LLM-based metrics that show whether a knowledge base or another RAG source retrieves highly relevant information and generates useful, appropriate responses. Its dataset contains the prompts or queries with ground-truth expected retrieved texts and responses, which the company already has."
    fr: "Une tâche d'évaluation RAG des évaluations Amazon Bedrock calcule des métriques fondées sur un LLM qui montrent si une base de connaissances ou une autre source RAG récupère des informations très pertinentes et génère des réponses utiles et appropriées. Son jeu de données contient les invites ou requêtes avec les textes récupérés et les réponses attendus de vérité terrain, dont l'entreprise dispose déjà."
  options:
    a:
      en: "A model evaluation job tests the FM alone; it does not measure the retrieval of the knowledge base, and TREX is not the company's data."
      fr: "Une tâche d'évaluation de modèle teste le FM seul ; elle ne mesure pas la récupération de la base de connaissances, et TREX ne contient pas les données de l'entreprise."
    b:
      en: "A contextual grounding check filters responses at run time; it is not a pre-launch measurement of retrieval quality."
      fr: "Un contrôle d'ancrage contextuel filtre les réponses à l'exécution ; ce n'est pas une mesure de la qualité de récupération avant le lancement."
    c:
      en: "Rating answers produced without retrieval does not evaluate the knowledge base at all."
      fr: "Noter des réponses produites sans récupération n'évalue pas du tout la base de connaissances."
references:
  - title: Evaluate the performance of Amazon Bedrock resources
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
