id: aifc01-3b-bp-success-criteria
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A support team has changed its ticket summarization prompt many times. Reviewers disagree about whether each new version is better, because every reviewer tries a different ticket and judges the output by personal preference.

    What should the team do so that it can tell whether a prompt change improves quality?
  fr: |
    Une équipe de support a modifié de nombreuses fois son invite de résumé de tickets. Les relecteurs ne s'accordent pas sur l'amélioration apportée par chaque nouvelle version, car chacun essaie un ticket différent et juge la sortie selon ses préférences.

    Que doit faire l'équipe pour savoir si une modification de l'invite améliore la qualité ?
body:
  options:
    - { id: a, text: { en: "Raise the temperature so that each version produces a wider range of outputs to compare.", fr: "Augmenter la température pour que chaque version produise un éventail plus large de sorties à comparer." } }
    - { id: b, text: { en: "Keep the version that the most senior reviewer prefers after trying a few tickets.", fr: "Garder la version que le relecteur le plus expérimenté préfère après avoir essayé quelques tickets." } }
    - { id: c, text: { en: "Switch to the largest available model so that prompt versions matter less.", fr: "Passer au plus grand modèle disponible pour que les versions de l'invite comptent moins." } }
    - { id: d, text: { en: "Define measurable success criteria and compare each version on the same set of test tickets.", fr: "Définir des critères de réussite mesurables et comparer chaque version sur le même ensemble de tickets de test." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS recommends defining the use case and success criteria before refining a prompt, as bullet points or measurable metrics such as length checks, format compliance, factuality, or ROUGE. Running every prompt version on the same representative inputs makes experiments comparable, so the team can see which change helps."
    fr: "AWS recommande de définir le cas d'utilisation et les critères de réussite avant d'affiner une invite, sous forme de points ou de métriques mesurables comme des contrôles de longueur, le respect du format, la factualité ou ROUGE. Exécuter chaque version de l'invite sur les mêmes entrées représentatives rend les essais comparables : l'équipe voit quelle modification aide."
  options:
    a:
      en: "More random outputs make comparisons harder, not easier, and give no criteria for judging quality."
      fr: "Des sorties plus aléatoires compliquent les comparaisons au lieu de les faciliter, et ne donnent aucun critère pour juger la qualité."
    b:
      en: "One person's preference on a few different tickets is still subjective and not repeatable."
      fr: "La préférence d'une seule personne sur quelques tickets différents reste subjective et non reproductible."
    c:
      en: "A larger model costs more and does not remove the need to measure whether a prompt meets the requirements."
      fr: "Un modèle plus grand coûte plus cher et ne dispense pas de mesurer si une invite répond aux exigences."
references:
  - title: Prompting best practices for Amazon Nova understanding models
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting.html
