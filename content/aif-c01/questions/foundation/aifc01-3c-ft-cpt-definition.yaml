id: aifc01-3c-ft-cpt-definition
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare analytics company plans to use continued pre-training to adapt a foundation model (FM) to medical language.

    Which statement describes continued pre-training?
  fr: |
    Une entreprise d'analyse de données de santé prévoit d'utiliser le préentraînement continu pour adapter un modèle de fondation (FM) au langage médical.

    Quelle affirmation décrit le préentraînement continu ?
body:
  options:
    - { id: a, text: { en: "It trains a separate reward model from human rankings of the FM's responses.", fr: "Il entraîne un modèle de récompense distinct à partir de classements humains des réponses du FM." } }
    - { id: b, text: { en: "It adds new layers to the architecture of the FM for the medical domain.", fr: "Il ajoute de nouvelles couches à l'architecture du FM pour le domaine médical." } }
    - { id: c, text: { en: "It trains the FM on medical prompt-response pairs phrased as instructions.", fr: "Il entraîne le FM sur des paires invite-réponse médicales formulées comme des instructions." } }
    - { id: d, text: { en: "It trains the FM further on unlabeled medical text with the original objective.", fr: "Il poursuit l'entraînement du FM sur du texte médical non étiqueté avec l'objectif d'origine." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Continued pre-training extends a pre-trained model with new domain-specific data. It uses the same unsupervised objectives as the original pre-training, works with large amounts of unlabeled text, and does not modify the model's architecture. It improves zero-shot and few-shot performance in the target domain."
    fr: "Le préentraînement continu enrichit un modèle préentraîné avec de nouvelles données propres à un domaine. Il utilise les mêmes objectifs non supervisés que le préentraînement initial, fonctionne avec de grandes quantités de texte non étiqueté et ne modifie pas l'architecture du modèle. Il améliore les performances zero-shot et few-shot dans le domaine ciblé."
  options:
    a:
      en: "Training a reward model from human rankings is a step of RLHF."
      fr: "Entraîner un modèle de récompense à partir de classements humains est une étape du RLHF."
    b:
      en: "Continued pre-training does not change the architecture of the model."
      fr: "Le préentraînement continu ne modifie pas l'architecture du modèle."
    c:
      en: "Prompt-response pairs phrased as instructions describe instruction tuning, which uses labeled data."
      fr: "Des paires invite-réponse formulées comme des instructions décrivent le réglage par instructions, qui utilise des données étiquetées."
references:
  - title: Continued pre-training (CPT)
    url: https://docs.aws.amazon.com/nova/latest/userguide/customize-fine-tune-hyperpod-cpt.html
