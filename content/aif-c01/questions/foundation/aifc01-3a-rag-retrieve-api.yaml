id: aifc01-3a-rag-retrieve-api
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an application that builds its own prompts and calls a foundation model (FM). The company wants to use an Amazon Bedrock knowledge base only to obtain the most relevant passages from its documents. The application will then insert those passages into its existing prompts.

    Which knowledge base operation should the application call?
  fr: |
    Une entreprise dispose d'une application qui construit ses propres invites et appelle un modèle de fondation (FM). L'entreprise veut utiliser une base de connaissances Amazon Bedrock uniquement pour obtenir les passages les plus pertinents de ses documents. L'application insérera ensuite ces passages dans ses invites existantes.

    Quelle opération de la base de connaissances l'application doit-elle appeler ?
body:
  options:
    - { id: a, text: "RetrieveAndGenerate" }
    - { id: b, text: "GenerateQuery" }
    - { id: c, text: "Retrieve" }
    - { id: d, text: "StartIngestionJob" }
answer: { optionId: c }
explanation:
  correct:
    en: "Retrieve queries the knowledge base and returns the matching results (the relevant chunks with their sources) without generating an answer. The application keeps control of prompt construction and of the call to its FM, which is what the company wants."
    fr: "Retrieve interroge la base de connaissances et renvoie les résultats correspondants (les fragments pertinents avec leurs sources) sans générer de réponse. L'application garde la maîtrise de la construction des invites et de l'appel à son FM, ce que veut l'entreprise."
  options:
    a:
      en: "RetrieveAndGenerate also sends the retrieved results to an FM and returns a generated response with citations, which the application does not want."
      fr: "RetrieveAndGenerate envoie aussi les résultats récupérés à un FM et renvoie une réponse générée avec des citations, ce que l'application ne veut pas."
    b:
      en: "GenerateQuery converts a natural language question into a SQL query for a structured data store; it does not return document passages."
      fr: "GenerateQuery convertit une question en langage naturel en requête SQL pour un magasin de données structurées ; elle ne renvoie pas de passages de documents."
    d:
      en: "StartIngestionJob syncs a data source into the knowledge base; it does not answer queries."
      fr: "StartIngestionJob synchronise une source de données dans la base de connaissances ; elle ne répond pas aux requêtes."
references:
  - title: Retrieve
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_Retrieve.html
  - title: RetrieveAndGenerate
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_RetrieveAndGenerate.html
