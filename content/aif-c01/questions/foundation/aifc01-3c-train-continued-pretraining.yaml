id: aifc01-3c-train-continued-pretraining
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company has millions of internal policy documents that use specialized vocabulary. The documents are not labeled, and the company has no question-answer pairs. The company wants a foundation model (FM) to gain knowledge of its domain while keeping its general language capabilities.

    Which approach will meet these requirements?
  fr: |
    Une compagnie d'assurance dispose de millions de documents internes sur ses contrats, qui utilisent un vocabulaire spécialisé. Les documents ne sont pas étiquetés, et l'entreprise n'a aucune paire question-réponse. L'entreprise veut qu'un modèle de fondation (FM) acquière la connaissance de son domaine tout en conservant ses capacités linguistiques générales.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Supervised fine-tuning on the documents", fr: "Réglage précis supervisé sur les documents" } }
    - { id: b, text: { en: "Continued pre-training on the documents", fr: "Préentraînement continu sur les documents" } }
    - { id: c, text: { en: "Distillation of the FM into a smaller model", fr: "Distillation du FM vers un modèle plus petit" } }
    - { id: d, text: { en: "Reinforcement learning from human feedback", fr: "Apprentissage par renforcement à partir des commentaires humains" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Continued pre-training trains an existing model further on large amounts of unlabeled domain-specific text, with the same self-supervised objective as the original pre-training. It improves performance in the specialized domain while preserving general language understanding, and it does not need labeled data."
    fr: "Le préentraînement continu poursuit l'entraînement d'un modèle existant sur de grandes quantités de texte non étiqueté propre au domaine, avec le même objectif autosupervisé que le préentraînement initial. Il améliore les performances dans le domaine spécialisé tout en préservant la compréhension générale du langage, et il ne nécessite pas de données étiquetées."
  options:
    a:
      en: "Supervised fine-tuning needs labeled input-output examples, which the company does not have."
      fr: "Le réglage précis supervisé nécessite des exemples étiquetés d'entrée et de sortie, dont l'entreprise ne dispose pas."
    c:
      en: "Distillation makes a smaller model imitate a larger one for a use case; it does not add the knowledge contained in the documents."
      fr: "La distillation fait imiter un modèle plus grand par un modèle plus petit pour un cas d'usage ; elle n'ajoute pas la connaissance contenue dans les documents."
    d:
      en: "RLHF aligns responses with human preferences by using rankings of model responses; it does not teach the content of a document corpus."
      fr: "Le RLHF aligne les réponses sur les préférences humaines à l'aide de classements de réponses du modèle ; il n'enseigne pas le contenu d'un corpus de documents."
references:
  - title: Continued pre-training (CPT)
    url: https://docs.aws.amazon.com/nova/latest/userguide/customize-fine-tune-hyperpod-cpt.html
