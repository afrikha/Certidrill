id: aifc01-3a-vec-aurora-relational
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores its product data in an Amazon Aurora PostgreSQL-Compatible Edition database. The company wants to add vector similarity search on product descriptions and combine it with SQL queries on the same tables, without moving the data to another database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke ses données produits dans une base de données Amazon Aurora PostgreSQL-Compatible Edition. L'entreprise veut ajouter une recherche de similarité vectorielle sur les descriptions de produits et la combiner avec des requêtes SQL sur les mêmes tables, sans déplacer les données vers une autre base de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Copy the product data to Amazon Neptune Analytics, and query its vector index.", fr: "Copier les données produits dans Amazon Neptune Analytics, et interroger son index vectoriel." } }
    - { id: b, text: { en: "Enable the pgvector extension, and store the embeddings in the existing tables.", fr: "Activer l'extension pgvector, et stocker les intégrations dans les tables existantes." } }
    - { id: c, text: { en: "Export the product data to Amazon S3 Vectors, and query a vector index.", fr: "Exporter les données produits vers Amazon S3 Vectors, et interroger un index vectoriel." } }
    - { id: d, text: { en: "Migrate the product data to Amazon DocumentDB, and create a vector index.", fr: "Migrer les données produits vers Amazon DocumentDB, et créer un index vectoriel." } }
answer: { optionId: b }
explanation:
  correct:
    en: "pgvector is an open-source PostgreSQL extension that stores ML-generated embeddings and searches them by similarity. With Aurora PostgreSQL and pgvector, the embeddings live in the same tables as the product data, so one database serves both traditional SQL operations and vector similarity searches."
    fr: "pgvector est une extension PostgreSQL open source qui stocke des intégrations générées par le ML et les recherche par similarité. Avec Aurora PostgreSQL et pgvector, les intégrations se trouvent dans les mêmes tables que les données produits : une seule base de données sert donc à la fois aux opérations SQL traditionnelles et aux recherches de similarité vectorielle."
  options:
    a:
      en: "Neptune Analytics is a graph analytics engine; copying the data there moves it out of the existing database."
      fr: "Neptune Analytics est un moteur d'analytique de graphes ; y copier les données les fait sortir de la base de données existante."
    c:
      en: "S3 Vectors is an object store for vectors; exporting the data there separates the vectors from the SQL tables."
      fr: "S3 Vectors est un stockage d'objets pour vecteurs ; y exporter les données sépare les vecteurs des tables SQL."
    d:
      en: "DocumentDB is a document database with MongoDB compatibility; migrating to it moves the data and drops the SQL model."
      fr: "DocumentDB est une base de données de documents compatible avec MongoDB ; y migrer déplace les données et abandonne le modèle SQL."
references:
  - title: Vector database options
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/choosing-an-aws-vector-database-for-rag-use-cases/vector-db-options.html
  - title: Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
