id: aifc01-3c-pm-reusable-prompts
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing company uses foundation models (FMs) in Amazon Bedrock. Several teams write similar prompts for product descriptions. The company wants to store the prompts centrally, reuse them across applications, test them with different models, and save versions while the teams iterate.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de marketing utilise des modèles de fondation (FM) dans Amazon Bedrock. Plusieurs équipes rédigent des invites similaires pour des descriptions de produits. L'entreprise veut stocker les invites de manière centralisée, les réutiliser dans plusieurs applications, les tester avec différents modèles et enregistrer des versions pendant que les équipes les améliorent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Bedrock Guardrails" }
    - { id: b, text: "Amazon Bedrock Prompt Management" }
    - { id: c, text: "Amazon Bedrock Knowledge Bases" }
    - { id: d, text: "Amazon Bedrock Model Evaluation" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Bedrock Prompt Management lets you create, edit and save prompts so that the same prompt can be reused in different workflows. You select a model and its inference parameters, compare prompt variants while testing, and save versions of the prompt as you iterate."
    fr: "Amazon Bedrock Prompt Management permet de créer, de modifier et d'enregistrer des invites afin de réutiliser la même invite dans différents flux de travail. Vous choisissez un modèle et ses paramètres d'inférence, vous comparez des variantes d'invite pendant les tests et vous enregistrez des versions de l'invite au fil des itérations."
  options:
    a:
      en: "Guardrails filter harmful content, denied topics and sensitive information in prompts and responses; they do not store or version prompts."
      fr: "Guardrails filtre le contenu nuisible, les sujets refusés et les informations sensibles dans les invites et les réponses ; il ne stocke ni ne versionne les invites."
    c:
      en: "Knowledge Bases store company documents for Retrieval Augmented Generation (RAG); they are not a library of reusable prompts."
      fr: "Knowledge Bases stocke les documents de l'entreprise pour la génération à enrichissement contextuel (RAG) ; ce n'est pas une bibliothèque d'invites réutilisables."
    d:
      en: "Model Evaluation measures the performance of models with evaluation jobs; it does not store prompts for reuse in applications."
      fr: "Model Evaluation mesure les performances des modèles au moyen de tâches d'évaluation ; il ne stocke pas d'invites à réutiliser dans des applications."
references:
  - title: Construct and store reusable prompts with Prompt management in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
