id: aifc01-3b-tech-few-shot-facts
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A healthcare software company plans to use few-shot prompting to extract medication names from clinical notes.

    Which two statements about few-shot prompting are correct? (Choose two.)
  fr: |
    Un éditeur de logiciels de santé prévoit d'utiliser des invites few-shot pour extraire les noms de médicaments de notes cliniques.

    Quelles sont les deux affirmations correctes sur les invites few-shot ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The examples permanently update the model's weights after the first request.", fr: "Les exemples mettent à jour définitivement les pondérations du modèle après la première requête." } }
    - { id: b, text: { en: "The examples guide the output format and style without changing the model.", fr: "Les exemples guident le format et le style de la sortie sans modifier le modèle." } }
    - { id: c, text: { en: "The examples add input tokens, which increases the cost of each request.", fr: "Les exemples ajoutent des jetons d'entrée, ce qui augmente le coût de chaque requête." } }
    - { id: d, text: { en: "The technique requires a labeled dataset of thousands of clinical notes.", fr: "La technique exige un jeu de données étiqueté de milliers de notes cliniques." } }
    - { id: e, text: { en: "The examples work best when they all show the same simple case.", fr: "Les exemples fonctionnent mieux quand ils montrent tous le même cas simple." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Few-shot examples are part of the prompt: they calibrate the format and style of the response in context, and the model itself is unchanged. Because the examples are sent with every request, they add input tokens and therefore cost under token-based pricing."
    fr: "Les exemples few-shot font partie de l'invite : ils calibrent en contexte le format et le style de la réponse, et le modèle lui-même reste inchangé. Comme les exemples sont envoyés avec chaque requête, ils ajoutent des jetons d'entrée, donc du coût avec une tarification au jeton."
  options:
    a:
      en: "Models do not learn from earlier requests; each request is processed independently and the weights never change."
      fr: "Les modèles n'apprennent pas des requêtes précédentes ; chaque requête est traitée indépendamment et les pondérations ne changent jamais."
    d:
      en: "Few-shot prompting uses only a handful of examples; large labeled datasets are needed for fine-tuning."
      fr: "Les invites few-shot n'utilisent qu'une poignée d'exemples ; de grands jeux de données étiquetés servent au réglage précis."
    e:
      en: "AWS recommends diverse examples that cover common and edge cases and match the complexity of the real task."
      fr: "AWS recommande des exemples variés qui couvrent les cas courants et les cas limites et correspondent à la complexité de la tâche réelle."
references:
  - title: Provide examples (few-shot prompting)
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-examples.html
