id: aifc01-3a-cust-in-context-tradeoff
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team adapts a foundation model (FM) to its task with in-context learning: it adds many examples to every prompt instead of customizing the model.

    Which statement describes the cost tradeoff of this approach?
  fr: |
    Une équipe adapte un modèle de fondation (FM) à sa tâche par apprentissage en contexte (in-context learning) : elle ajoute de nombreux exemples à chaque invite au lieu de personnaliser le modèle.

    Quelle affirmation décrit le compromis de coût de cette approche ?
body:
  options:
    - { id: a, text: { en: "It has an upfront training charge, but each request then costs less.", fr: "Elle entraîne des frais d'entraînement initiaux, mais chaque requête coûte ensuite moins cher." } }
    - { id: b, text: { en: "It has no training cost, but the examples add input tokens to every request.", fr: "Elle n'a aucun coût d'entraînement, mais les exemples ajoutent des jetons d'entrée à chaque requête." } }
    - { id: c, text: { en: "It requires Provisioned Throughput because the model is customized.", fr: "Elle exige du Provisioned Throughput, car le modèle est personnalisé." } }
    - { id: d, text: { en: "It changes the model weights, so the model has a monthly storage fee.", fr: "Elle modifie les pondérations du modèle : le modèle a donc des frais de stockage mensuels." } }
answer: { optionId: b }
explanation:
  correct:
    en: "In-context learning only changes the prompt, so there is no training job, custom model, or model storage to pay for. The tradeoff is that the examples are input tokens sent and billed with every request, which raises the per-request cost and latency and uses part of the context window."
    fr: "L'apprentissage en contexte ne modifie que l'invite : il n'y a donc ni tâche d'entraînement, ni modèle personnalisé, ni stockage de modèle à payer. En contrepartie, les exemples sont des jetons d'entrée envoyés et facturés à chaque requête, ce qui augmente le coût et la latence de chaque requête et occupe une partie de la fenêtre de contexte."
  options:
    a:
      en: "An upfront training charge followed by shorter prompts describes fine-tuning, not in-context learning."
      fr: "Des frais d'entraînement initiaux suivis d'invites plus courtes décrivent le peaufinage, pas l'apprentissage en contexte."
    c:
      en: "The base model is not customized, so it runs with on-demand inference like any other prompt."
      fr: "Le modèle de base n'est pas personnalisé : il s'exécute donc avec l'inférence à la demande comme n'importe quelle autre invite."
    d:
      en: "In-context learning does not change the model weights, so no custom model is created or stored."
      fr: "L'apprentissage en contexte ne modifie pas les pondérations du modèle : aucun modèle personnalisé n'est donc créé ni stocké."
references:
