id: aifc01-3b-bp-specificity
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A property management company asks a foundation model to "Write something about our new building." The responses vary widely in length, tone, and content, and most are unusable.

    Which prompt engineering practice will MOST improve the responses?
  fr: |
    Une société de gestion immobilière demande à un modèle de fondation « Écris quelque chose sur notre nouvel immeuble ». Les réponses varient beaucoup en longueur, en ton et en contenu, et la plupart sont inutilisables.

    Quelle pratique d'ingénierie de requête améliorera le PLUS les réponses ?
body:
  options:
    - { id: a, text: { en: "Keep the prompt short and vague so that the model can be creative.", fr: "Garder l'invite courte et vague pour que le modèle puisse être créatif." } }
    - { id: b, text: { en: "State the task, the audience, the key facts, and the expected length.", fr: "Énoncer la tâche, le public, les faits clés et la longueur attendue." } }
    - { id: c, text: { en: "Send the same prompt several times and keep the longest response.", fr: "Envoyer plusieurs fois la même invite et garder la réponse la plus longue." } }
    - { id: d, text: { en: "Switch to a larger model and keep the prompt unchanged.", fr: "Passer à un modèle plus grand et garder l'invite inchangée." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Specific prompts give the model what it needs: the task (for example a listing for prospective tenants), the audience, the facts to include, and the format and length. Clear, specific instructions produce relevant, consistent responses on the first attempt."
    fr: "Une invite précise donne au modèle ce dont il a besoin : la tâche (par exemple une annonce pour de futurs locataires), le public, les faits à inclure, ainsi que le format et la longueur. Des instructions claires et précises produisent des réponses pertinentes et cohérentes dès la première tentative."
  options:
    a:
      en: "A vague prompt is the cause of the problem; the model has to guess the purpose, the audience, and the format."
      fr: "Une invite vague est la cause du problème : le modèle doit deviner l'objectif, le public et le format."
    c:
      en: "Retrying an unclear prompt does not make the responses relevant, and length is not a measure of quality."
      fr: "Relancer une invite floue ne rend pas les réponses pertinentes, et la longueur n'est pas une mesure de la qualité."
    d:
      en: "A larger model still has to guess what an unclear prompt means, and it usually costs more per token."
      fr: "Un modèle plus grand doit toujours deviner le sens d'une invite floue, et il coûte généralement plus cher par jeton."
references:
  - title: Creating precise prompts
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-precision.html
