id: aifc01-3c-train-custom-inference
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has fine-tuned a model in Amazon Bedrock. The custom model will receive a small and irregular number of requests. The company wants to pay only for what it uses and does not want to reserve dedicated capacity.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a peaufiné un modèle dans Amazon Bedrock. Le modèle personnalisé recevra un nombre de requêtes faible et irrégulier. L'entreprise veut payer uniquement ce qu'elle utilise et ne veut pas réserver de capacité dédiée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Purchase Provisioned Throughput for the custom model and invoke it.", fr: "Acheter du Provisioned Throughput pour le modèle personnalisé et l'appeler." } }
    - { id: b, text: { en: "Invoke the base model ID, because the custom weights are applied automatically.", fr: "Appeler l'ID du modèle de base, car les pondérations personnalisées sont appliquées automatiquement." } }
    - { id: c, text: { en: "Run a distillation job to turn the custom model into an on-demand model.", fr: "Exécuter une tâche de distillation pour transformer le modèle personnalisé en modèle à la demande." } }
    - { id: d, text: { en: "Create a custom model deployment and invoke the ARN of the deployment.", fr: "Créer un déploiement de modèle personnalisé et appeler l'ARN de ce déploiement." } }
answer: { optionId: d }
explanation:
  correct:
    en: "After customization, Amazon Bedrock offers two ways to run inference: buy Provisioned Throughput, or deploy the custom model for on-demand inference. With an on-demand custom model deployment, the application invokes the deployment ARN and the company pays only for what it uses, without provisioned compute."
    fr: "Après la personnalisation, Amazon Bedrock propose deux façons d'exécuter l'inférence : acheter du Provisioned Throughput ou déployer le modèle personnalisé pour l'inférence à la demande. Avec un déploiement à la demande du modèle personnalisé, l'application appelle l'ARN du déploiement et l'entreprise paie uniquement ce qu'elle utilise, sans capacité provisionnée."
  options:
    a:
      en: "Provisioned Throughput reserves dedicated capacity with guaranteed throughput, which the company does not want for a small, irregular load."
      fr: "Provisioned Throughput réserve une capacité dédiée avec un débit garanti, ce que l'entreprise ne veut pas pour une charge faible et irrégulière."
    b:
      en: "Invoking the base model ID runs the base model, not the fine-tuned custom model."
      fr: "Appeler l'ID du modèle de base exécute le modèle de base, pas le modèle personnalisé peaufiné."
    c:
      en: "Distillation creates another, smaller model from a teacher; it is not a way to set up inference for an existing custom model."
      fr: "La distillation crée un autre modèle, plus petit, à partir d'un enseignant ; ce n'est pas une façon de configurer l'inférence d'un modèle personnalisé existant."
references:
  - title: Set up inference for a custom model
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-use.html
