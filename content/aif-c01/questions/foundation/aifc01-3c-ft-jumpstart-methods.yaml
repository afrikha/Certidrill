id: aifc01-3c-ft-jumpstart-methods
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data scientist wants to fine-tune a publicly available foundation model (FM) from Amazon SageMaker JumpStart.

    Which two fine-tuning methods does SageMaker JumpStart offer for its FMs?
  fr: |
    Un scientifique des données veut peaufiner un modèle de fondation (FM) public d'Amazon SageMaker JumpStart.

    Quelles sont les deux méthodes de peaufinage que SageMaker JumpStart propose pour ses FM ?
body:
  options:
    - { id: a, text: { en: "Prompt variants and prompt versions", fr: "Variantes d'invite et versions d'invite" } }
    - { id: b, text: { en: "Model distillation and reinforcement fine-tuning", fr: "Distillation de modèle et peaufinage par renforcement" } }
    - { id: c, text: { en: "Retrieval Augmented Generation and few-shot prompting", fr: "Génération augmentée par récupération et invites few-shot" } }
    - { id: d, text: { en: "Domain adaptation and instruction-based fine-tuning", fr: "Adaptation au domaine et peaufinage fondé sur des instructions" } }
answer: { optionId: d }
explanation:
  correct:
    en: "SageMaker JumpStart documents two fine-tuning methods for its foundation models: domain adaptation, which fine-tunes on domain-specific data, and instruction-based fine-tuning, which uses prompt and response examples. Both further train the model and change its weights."
    fr: "SageMaker JumpStart documente deux méthodes de peaufinage pour ses modèles de fondation : l'adaptation au domaine, qui peaufine sur des données propres à un domaine, et le peaufinage fondé sur des instructions, qui utilise des exemples d'invites et de réponses. Les deux poursuivent l'entraînement du modèle et modifient ses pondérations."
  options:
    a:
      en: "Prompt variants and versions are features of Amazon Bedrock Prompt Management; they do not train a model."
      fr: "Les variantes et les versions d'invite sont des fonctionnalités d'Amazon Bedrock Prompt Management ; elles n'entraînent pas de modèle."
    b:
      en: "Distillation and reinforcement fine-tuning are customization methods documented for Amazon Bedrock, not the JumpStart fine-tuning methods."
      fr: "La distillation et le peaufinage par renforcement sont des méthodes de personnalisation documentées pour Amazon Bedrock, pas les méthodes de peaufinage de JumpStart."
    c:
      en: "RAG and few-shot prompting improve responses without changing the model's weights, so they are not fine-tuning."
      fr: "Le RAG et les invites few-shot améliorent les réponses sans modifier les pondérations du modèle : ce n'est pas du peaufinage."
references:
  - title: Foundation models and hyperparameters for fine-tuning
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html
