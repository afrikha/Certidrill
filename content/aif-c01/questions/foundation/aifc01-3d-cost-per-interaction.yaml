id: aifc01-3d-cost-per-interaction
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail bank uses a generative AI chat assistant alongside human agents. The finance team wants a unit metric that compares the cost of a chat handled by the assistant with the cost of a chat handled by a human agent.

    Which metric will meet this requirement?
  fr: |
    Une banque de détail utilise un assistant de chat d'IA générative en complément de ses conseillers humains. L'équipe financière veut une métrique unitaire qui compare le coût d'un chat traité par l'assistant au coût d'un chat traité par un conseiller humain.

    Quelle métrique répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Task completion rate", fr: "Taux d'achèvement des tâches" } }
    - { id: b, text: { en: "Total monthly AWS bill of the assistant", fr: "Facture AWS mensuelle totale de l'assistant" } }
    - { id: c, text: { en: "Average number of output tokens per response", fr: "Nombre moyen de jetons de sortie par réponse" } }
    - { id: d, text: { en: "Cost per interaction", fr: "Coût par interaction" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Cost per interaction divides the cost of the assistant by the number of conversations it handles. As a unit cost, it can be compared directly with the cost of a human-handled chat, and it shows whether the application stays financially viable as volume grows."
    fr: "Le coût par interaction divise le coût de l'assistant par le nombre de conversations qu'il traite. En tant que coût unitaire, il se compare directement au coût d'un chat traité par un humain et montre si l'application reste viable financièrement lorsque le volume augmente."
  options:
    a:
      en: "Task completion rate measures success, not cost."
      fr: "Le taux d'achèvement des tâches mesure le succès, pas le coût."
    b:
      en: "A monthly total depends on volume, so it cannot be compared with the cost of one human-handled chat."
      fr: "Un total mensuel dépend du volume : il ne peut pas être comparé au coût d'un seul chat traité par un humain."
    c:
      en: "Output tokens are one input of the cost, but they are not a cost and ignore input tokens and other charges."
      fr: "Les jetons de sortie sont l'une des composantes du coût, mais ils ne sont pas un coût et ignorent les jetons d'entrée et les autres frais."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
