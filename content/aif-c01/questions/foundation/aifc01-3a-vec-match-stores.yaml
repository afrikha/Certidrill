id: aifc01-3a-vec-match-stores
objective: "3.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is choosing vector stores for three generative AI applications. Match each requirement with the AWS service that meets it. Select the correct service from the following list for each requirement. Each service should be selected one time or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise choisit des magasins de vecteurs pour trois applications d'IA générative. Associez chaque exigence au service AWS qui y répond. Sélectionnez dans la liste suivante le service qui convient à chaque exigence. Chaque service peut être sélectionné une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: neptune, text: "Amazon Neptune Analytics" }
    - { id: docdb, text: "Amazon DocumentDB" }
    - { id: opensearch, text: "Amazon OpenSearch Service" }
    - { id: s3v, text: "Amazon S3 Vectors" }
    - { id: aurora, text: "Amazon Aurora PostgreSQL" }
  targets:
    - { id: t1, text: { en: "Answer questions by following the relationships between entities across documents (GraphRAG).", fr: "Répondre aux questions en suivant les relations entre entités d'un document à l'autre (GraphRAG)." } }
    - { id: t2, text: { en: "Add vector search to an application that already uses MongoDB APIs on JSON documents.", fr: "Ajouter la recherche vectorielle à une application qui utilise déjà les API MongoDB sur des documents JSON." } }
    - { id: t3, text: { en: "Combine full-text keyword search and vector search in one distributed search and analytics engine.", fr: "Combiner la recherche plein texte par mots-clés et la recherche vectorielle dans un même moteur distribué de recherche et d'analytique." } }
answer:
  mapping: { t1: neptune, t2: docdb, t3: opensearch }
explanation:
  correct:
    en: "Neptune Analytics combines vector similarity search with graph traversals and integrates with Amazon Bedrock Knowledge Bases for managed GraphRAG. DocumentDB, with MongoDB compatibility, offers native vector search for applications that already use MongoDB APIs. OpenSearch Service is a search and analytics engine that provides full-text and vector search in one platform. S3 Vectors (low-cost storage for rarely queried vectors) and Aurora PostgreSQL (SQL plus vectors with pgvector) match none of these requirements."
    fr: "Neptune Analytics combine la recherche de similarité vectorielle et les parcours de graphe, et s'intègre à Amazon Bedrock Knowledge Bases pour un GraphRAG géré. DocumentDB, compatible avec MongoDB, offre une recherche vectorielle native pour les applications qui utilisent déjà les API MongoDB. OpenSearch Service est un moteur de recherche et d'analytique qui fournit la recherche plein texte et la recherche vectorielle sur une même plateforme. S3 Vectors (stockage peu coûteux de vecteurs rarement interrogés) et Aurora PostgreSQL (SQL et vecteurs avec pgvector) ne correspondent à aucune de ces exigences."
references:
  - title: Vector database options
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/choosing-an-aws-vector-database-for-rag-use-cases/vector-db-options.html
  - title: Build a knowledge base with Amazon Neptune Analytics graphs
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-build-graphs.html
