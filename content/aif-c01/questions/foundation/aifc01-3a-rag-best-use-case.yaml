id: aifc01-3a-rag-best-use-case
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is reviewing four generative AI projects and wants to start with the one that benefits the most from Retrieval Augmented Generation (RAG).

    Which project is the BEST fit for RAG?
  fr: |
    Une entreprise étudie quatre projets d'IA générative et veut commencer par celui qui tire le plus parti de la génération à enrichissement contextuel (RAG).

    Quel projet convient le MIEUX au RAG ?
body:
  options:
    - { id: a, text: { en: "Generate original illustrations for a children's book from short text descriptions.", fr: "Générer des illustrations originales pour un livre pour enfants à partir de courtes descriptions textuelles." } }
    - { id: b, text: { en: "Write creative product slogans that do not depend on any company document.", fr: "Écrire des slogans créatifs pour des produits, qui ne dépendent d'aucun document de l'entreprise." } }
    - { id: c, text: { en: "Translate short, general-purpose chat messages between English and Spanish.", fr: "Traduire de courts messages de chat généraux entre l'anglais et l'espagnol." } }
    - { id: d, text: { en: "Answer technician questions from maintenance manuals that the company updates every week.", fr: "Répondre aux questions des techniciens à partir de manuels de maintenance que l'entreprise met à jour chaque semaine." } }
answer: { optionId: d }
explanation:
  correct:
    en: "RAG grounds the answers of an FM in the company's own, current data: at query time, relevant passages of the manuals are retrieved and added to the prompt. Weekly updates are used as soon as they are ingested, without retraining the model, and answers can cite the source manuals."
    fr: "Le RAG ancre les réponses d'un FM dans les données propres et à jour de l'entreprise : au moment de la requête, les passages pertinents des manuels sont récupérés et ajoutés à l'invite. Les mises à jour hebdomadaires sont utilisées dès qu'elles sont ingérées, sans réentraîner le modèle, et les réponses peuvent citer les manuels sources."
  options:
    a:
      en: "Image generation from a description does not need facts retrieved from company documents; an image generation model is enough."
      fr: "La génération d'images à partir d'une description n'a pas besoin de faits récupérés dans des documents de l'entreprise ; un modèle de génération d'images suffit."
    b:
      en: "The slogans do not depend on company documents, so there is nothing useful to retrieve; prompt engineering is enough."
      fr: "Les slogans ne dépendent d'aucun document de l'entreprise : il n'y a donc rien d'utile à récupérer ; l'ingénierie de requête suffit."
    c:
      en: "General-purpose translation relies on the model's language skills, not on private documents to retrieve."
      fr: "La traduction générale repose sur les compétences linguistiques du modèle, pas sur des documents privés à récupérer."
references:
  - title: How Amazon Bedrock knowledge bases work
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
  - title: Comparing Retrieval Augmented Generation and fine-tuning
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-vs-fine-tuning.html
