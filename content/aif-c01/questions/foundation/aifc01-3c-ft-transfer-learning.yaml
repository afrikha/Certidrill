id: aifc01-3c-ft-transfer-learning
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company has a model that was trained to analyze the sentiment of product reviews. The company adapts this model to analyze the sentiment of movie reviews by training it on a small set of labeled movie reviews.

    Which machine learning technique is the company using?
  fr: |
    Une entreprise de médias dispose d'un modèle entraîné pour analyser le sentiment d'avis sur des produits. Elle adapte ce modèle à l'analyse du sentiment d'avis sur des films en l'entraînant sur un petit ensemble d'avis de films étiquetés.

    Quelle technique de machine learning l'entreprise utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Unsupervised clustering", fr: "Partitionnement non supervisé (clustering)" } }
    - { id: b, text: { en: "Transfer learning", fr: "Apprentissage par transfert" } }
    - { id: c, text: { en: "Reinforcement learning", fr: "Apprentissage par renforcement" } }
    - { id: d, text: { en: "Pre-training from scratch", fr: "Préentraînement à partir de zéro" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Transfer learning reuses a model trained on one task and fine-tunes it for a new, related task. Adapting a sentiment model from product reviews to movie reviews with a small labeled dataset is a typical example."
    fr: "L'apprentissage par transfert réutilise un modèle entraîné sur une tâche et le peaufine pour une nouvelle tâche apparentée. Adapter un modèle de sentiment des avis de produits aux avis de films avec un petit jeu de données étiqueté en est un exemple typique."
  options:
    a:
      en: "Clustering groups unlabeled data by similarity; it does not adapt an existing model to a new labeled task."
      fr: "Le clustering regroupe des données non étiquetées par similarité ; il n'adapte pas un modèle existant à une nouvelle tâche étiquetée."
    c:
      en: "Reinforcement learning learns from rewards through trial and error, not from a small set of labeled reviews."
      fr: "L'apprentissage par renforcement apprend à partir de récompenses par essais et erreurs, pas à partir d'un petit ensemble d'avis étiquetés."
    d:
      en: "The company starts from an existing trained model, which is the opposite of training from scratch."
      fr: "L'entreprise part d'un modèle déjà entraîné, ce qui est l'inverse d'un entraînement à partir de zéro."
references:
  - title: What is Transfer Learning? - Transfer Learning in Machine Learning Explained - AWS
    url: https://aws.amazon.com/what-is/transfer-learning/
