id: aifc01-3a-vec-s3-vectors
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company wants to store the embeddings of 500 million archived articles for a Retrieval Augmented Generation (RAG) application. Queries are infrequent, and a query latency of under one second is acceptable. The company wants the LOWEST storage cost.

    Which vector store should the company use?
  fr: |
    Une entreprise de médias veut stocker les intégrations de 500 millions d'articles archivés pour une application de génération à enrichissement contextuel (RAG). Les requêtes sont peu fréquentes, et une latence de requête inférieure à une seconde est acceptable. L'entreprise veut le coût de stockage le plus FAIBLE.

    Quel magasin de vecteurs l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon OpenSearch Service" }
    - { id: b, text: "Amazon Neptune Analytics" }
    - { id: c, text: "Amazon Aurora PostgreSQL with pgvector" }
    - { id: d, text: "Amazon S3 Vectors" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon S3 Vectors stores vectors in vector buckets with pay-for-what-you-use pricing and is cost-optimized for large vector datasets that are queried less frequently, with subsecond latency for infrequent queries. AWS guidance positions it for billions of vectors at minimal cost and for RAG with infrequent retrieval, and it can be the vector store of a Bedrock knowledge base."
    fr: "Amazon S3 Vectors stocke les vecteurs dans des compartiments de vecteurs avec une tarification à l'usage et est optimisé en coût pour de grands jeux de vecteurs interrogés moins fréquemment, avec une latence inférieure à la seconde pour les requêtes peu fréquentes. Les recommandations d'AWS le positionnent pour des milliards de vecteurs à coût minimal et pour le RAG à récupération peu fréquente, et il peut servir de magasin de vecteurs à une base de connaissances Bedrock."
  options:
    a:
      en: "OpenSearch Service suits high-throughput, low-latency queries; for rarely queried archives it costs more than S3 Vectors."
      fr: "OpenSearch Service convient aux requêtes à haut débit et à faible latence ; pour des archives rarement interrogées, il coûte plus cher que S3 Vectors."
    b:
      en: "Neptune Analytics combines vector search with graph traversal; the scenario needs no graph relationships, only low-cost storage."
      fr: "Neptune Analytics combine la recherche vectorielle et le parcours de graphes ; le scénario n'a besoin d'aucune relation de graphe, seulement d'un stockage peu coûteux."
    c:
      en: "Aurora PostgreSQL with pgvector suits relational data combined with vector search; it is not the lowest-cost option for hundreds of millions of rarely queried vectors."
      fr: "Aurora PostgreSQL avec pgvector convient aux données relationnelles combinées à la recherche vectorielle ; ce n'est pas l'option la moins chère pour des centaines de millions de vecteurs rarement interrogés."
references:
  - title: Working with S3 Vectors and vector buckets
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html
  - title: Vector database options
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/choosing-an-aws-vector-database-for-rag-use-cases/vector-db-options.html
