id: aifc01-3d-match-business-metrics
objective: "3.4.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A furniture retailer has defined business goals for its generative AI shopping assistant.

    Match each business goal to the metric that measures it. To answer, drag the appropriate metric to each business goal. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un distributeur de meubles a défini des objectifs métier pour son assistant d'achat d'IA générative.

    Associez chaque objectif métier à la métrique qui le mesure. Pour répondre, faites glisser la métrique appropriée vers chaque objectif métier. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tcr, text: { en: "Task completion rate", fr: "Taux d'achèvement des tâches" } }
    - { id: csat, text: { en: "User satisfaction score", fr: "Score de satisfaction des utilisateurs" } }
    - { id: cpi, text: { en: "Cost per interaction", fr: "Coût par interaction" } }
    - { id: adopt, text: { en: "Adoption rate", fr: "Taux d'adoption" } }
    - { id: bert, text: "BERTScore" }
  targets:
    - id: t1
      text: { en: "Customers finish the delivery booking that they start with the assistant.", fr: "Les clients mènent à bien la réservation de livraison qu'ils commencent avec l'assistant." }
    - id: t2
      text: { en: "Customers rate their experience with the assistant highly.", fr: "Les clients donnent une note élevée à leur expérience avec l'assistant." }
    - id: t3
      text: { en: "Serving each conversation costs less than a chat handled by an employee.", fr: "Chaque conversation coûte moins cher qu'un chat traité par un employé." }
    - id: t4
      text: { en: "Most store employees use the assistant every week.", fr: "La plupart des employés des magasins utilisent l'assistant chaque semaine." }
answer:
  mapping: { t1: tcr, t2: csat, t3: cpi, t4: adopt }
explanation:
  correct:
    en: "The task completion rate shows whether users finish their workflow with the AI's help. The user satisfaction score comes from user ratings. Cost per interaction is the unit cost to compare with a human-handled chat. The adoption rate measures how many of the intended users use the tool. BERTScore is a technical similarity metric, not a business alignment metric."
    fr: "Le taux d'achèvement des tâches montre si les utilisateurs mènent leur parcours à terme avec l'aide de l'IA. Le score de satisfaction des utilisateurs provient de leurs notes. Le coût par interaction est le coût unitaire à comparer à celui d'un chat traité par un humain. Le taux d'adoption mesure combien d'utilisateurs visés utilisent l'outil. BERTScore est une métrique technique de similarité, pas une métrique d'alignement sur les objectifs métier."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
