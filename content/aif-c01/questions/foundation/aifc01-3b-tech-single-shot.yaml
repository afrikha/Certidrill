id: aifc01-3b-tech-single-shot
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing team asks a foundation model to write product taglines. The prompt contains one example of a product description with the tagline that the team likes, followed by the new product description.

    Which prompt engineering technique does the team use?
  fr: |
    Une équipe marketing demande à un modèle de fondation d'écrire des slogans de produits. L'invite contient un exemple de description de produit avec le slogan que l'équipe apprécie, suivi de la description du nouveau produit.

    Quelle technique d'ingénierie de requête l'équipe utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Single-shot prompting", fr: "Invite single-shot" } }
    - { id: b, text: { en: "Zero-shot prompting", fr: "Invite zero-shot" } }
    - { id: c, text: { en: "Negative prompting", fr: "Invite négative" } }
    - { id: d, text: { en: "Chain-of-thought prompting", fr: "Invite à chaîne de pensée (chain-of-thought)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Single-shot (one-shot) prompting gives the model exactly one example of the input and the desired output before the actual input. It shows the expected style without the cost of many examples."
    fr: "L'invite single-shot (one-shot) donne au modèle exactement un exemple de l'entrée et de la sortie souhaitée avant l'entrée réelle. Elle montre le style attendu sans le coût de nombreux exemples."
  options:
    b:
      en: "Zero-shot prompting gives no example; this prompt includes one."
      fr: "L'invite zero-shot ne donne aucun exemple ; cette invite en contient un."
    c:
      en: "A negative prompt says what the output must avoid; it is not an example of the desired output."
      fr: "Une invite négative indique ce que la sortie doit éviter ; ce n'est pas un exemple de la sortie souhaitée."
    d:
      en: "Chain-of-thought prompting asks for step-by-step reasoning, which taglines do not need."
      fr: "L'invite à chaîne de pensée demande un raisonnement étape par étape, dont les slogans n'ont pas besoin."
references:
  - title: Provide examples (few-shot prompting)
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-examples.html
