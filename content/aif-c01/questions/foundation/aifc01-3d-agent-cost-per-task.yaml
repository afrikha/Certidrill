id: aifc01-3d-agent-cost-per-task
objective: "3.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AI agent handles each customer request with several model calls and tool calls. The engineering team reports the average cost per model invocation, which looks low. The finance team wants a cost metric that reflects what the business pays for each customer request that the agent resolves.

    Which metric should the company report?
  fr: |
    Un agent d'IA traite chaque demande client avec plusieurs appels au modèle et plusieurs appels d'outils. L'équipe d'ingénierie communique le coût moyen par invocation du modèle, qui semble faible. L'équipe financière veut une métrique de coût qui reflète ce que l'entreprise paie pour chaque demande client que l'agent résout.

    Quelle métrique l'entreprise doit-elle communiquer ?
body:
  options:
    - { id: a, text: { en: "The average cost per model invocation, measured over a full month", fr: "Le coût moyen par invocation du modèle, mesuré sur un mois complet" } }
    - { id: b, text: { en: "The average number of input tokens per model invocation", fr: "Le nombre moyen de jetons d'entrée par invocation du modèle" } }
    - { id: c, text: { en: "The output tokens per second of the model", fr: "Les jetons de sortie par seconde du modèle" } }
    - { id: d, text: { en: "The cost of all model and tool calls divided by the number of completed tasks", fr: "Le coût de tous les appels au modèle et aux outils divisé par le nombre de tâches achevées" } }
answer: { optionId: d }
explanation:
  correct:
    en: "One agent request can trigger several inference calls, tool invocations and memory retrievals, each with its own cost. A cost per completed task (cost per completion) adds up all of those costs and divides by the tasks that the agent actually completes, so it reflects the business cost of each resolved request."
    fr: "Une seule demande à un agent peut déclencher plusieurs appels d'inférence, appels d'outils et récupérations en mémoire, chacun avec son propre coût. Un coût par tâche achevée (cost per completion) additionne tous ces coûts et les divise par le nombre de tâches réellement achevées par l'agent : il reflète donc le coût métier de chaque demande résolue."
  options:
    a:
      en: "A per-invocation cost hides that one request needs several invocations and ignores failed requests, whatever the period."
      fr: "Un coût par invocation masque le fait qu'une demande nécessite plusieurs invocations et ignore les demandes en échec, quelle que soit la période."
    b:
      en: "Input tokens per invocation are one technical input of the cost, not the cost of a resolved request."
      fr: "Les jetons d'entrée par invocation sont l'une des composantes techniques du coût, pas le coût d'une demande résolue."
    c:
      en: "Output tokens per second measure speed, not cost."
      fr: "Les jetons de sortie par seconde mesurent la vitesse, pas le coût."
references:
  - title: AGENTPERF01-BP01 Define performance-aligned success criteria for agent workloads
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentperf01-bp01.html
