id: aifc01-3d-match-metrics
objective: "3.4.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A company is choosing a metric for each of its FM evaluation needs.

    Match each evaluation need to the appropriate metric. To answer, drag the appropriate metric to each evaluation need. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise choisit une métrique pour chacun de ses besoins d'évaluation de FM.

    Associez chaque besoin d'évaluation à la métrique appropriée. Pour répondre, faites glisser la métrique appropriée vers chaque besoin d'évaluation. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rouge, text: "ROUGE" }
    - { id: bleu, text: "BLEU" }
    - { id: bert, text: "BERTScore" }
    - { id: judge, text: "LLM-as-a-judge" }
    - { id: acc, text: { en: "Classification accuracy", fr: "Exactitude de classification (classification accuracy)" } }
  targets:
    - id: t1
      text: { en: "Score machine translations of product manuals against translations by professional translators.", fr: "Noter des traductions automatiques de manuels produits par rapport à des traductions de traducteurs professionnels." }
    - id: t2
      text: { en: "Measure how much of the wording of editor-written summaries appears in generated summaries.", fr: "Mesurer dans quelle proportion la formulation de résumés écrits par des rédacteurs se retrouve dans les résumés générés." }
    - id: t3
      text: { en: "Score answers by their semantic similarity to reference answers, even when the wording differs.", fr: "Noter des réponses selon leur similarité sémantique avec des réponses de référence, même lorsque la formulation diffère." }
    - id: t4
      text: { en: "Rate the helpfulness of chatbot responses against a rubric when no reference answers exist.", fr: "Noter l'utilité des réponses d'un chatbot selon une grille lorsqu'il n'existe aucune réponse de référence." }
answer:
  mapping: { t1: bleu, t2: rouge, t3: bert, t4: judge }
explanation:
  correct:
    en: "BLEU is the typical metric for machine translation (n-gram precision). ROUGE measures recall-oriented n-gram overlap and is typical for summarization. BERTScore compares embeddings, so it captures meaning when the wording differs. LLM-as-a-judge uses an evaluator model and a rubric, and does not always need reference answers. Classification accuracy applies to predicted labels, not to generated text."
    fr: "BLEU est la métrique typique de la traduction automatique (précision des n-grammes). ROUGE mesure un recouvrement de n-grammes orienté rappel et s'utilise typiquement pour le résumé. BERTScore compare des embeddings : il mesure le sens lorsque la formulation diffère. LLM-as-a-judge utilise un modèle évaluateur et une grille, et n'a pas toujours besoin de réponses de référence. L'exactitude de classification s'applique à des étiquettes prédites, pas à du texte généré."
references:
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
