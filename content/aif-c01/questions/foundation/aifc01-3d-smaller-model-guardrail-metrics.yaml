id: aifc01-3d-smaller-model-guardrail-metrics
objective: "3.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An online travel agency replaces the FM of its customer assistant with a smaller, cheaper FM to lower its cost per interaction. The agency must confirm that the change does not hurt the business outcomes of the assistant.

    Which two metrics should the agency monitor together with the cost per interaction? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une agence de voyages en ligne remplace le FM de son assistant client par un FM plus petit et moins cher afin de réduire son coût par interaction. L'agence doit confirmer que ce changement ne nuit pas aux résultats métier de l'assistant.

    Quelles sont les deux métriques que l'agence doit surveiller avec le coût par interaction ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Parameter count of the new FM", fr: "Nombre de paramètres du nouveau FM" } }
    - { id: b, text: "InvocationThrottles" }
    - { id: c, text: { en: "Task completion rate", fr: "Taux d'achèvement des tâches" } }
    - { id: d, text: { en: "User satisfaction score", fr: "Score de satisfaction des utilisateurs" } }
    - { id: e, text: { en: "Length of the system prompt", fr: "Longueur de l'invite système" } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "A lower cost per interaction is only a gain if the assistant still achieves its purpose. The task completion rate shows whether customers still finish what they came to do, and the user satisfaction score shows whether they are still happy with the experience."
    fr: "Un coût par interaction plus faible n'est un gain que si l'assistant remplit toujours sa mission. Le taux d'achèvement des tâches montre si les clients terminent toujours ce qu'ils sont venus faire, et le score de satisfaction des utilisateurs montre s'ils restent satisfaits de l'expérience."
  options:
    a:
      en: "The parameter count is a known property of the model, not an outcome to monitor."
      fr: "Le nombre de paramètres est une propriété connue du modèle, pas un résultat à surveiller."
    b:
      en: "InvocationThrottles is a technical reliability metric of Amazon Bedrock, not a business outcome."
      fr: "InvocationThrottles est une métrique technique de fiabilité d'Amazon Bedrock, pas un résultat métier."
    e:
      en: "The system prompt length is a design input that affects cost, not a measure of business outcomes."
      fr: "La longueur de l'invite système est un paramètre de conception qui influe sur le coût, pas une mesure des résultats métier."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
