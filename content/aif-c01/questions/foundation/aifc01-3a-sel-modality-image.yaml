id: aifc01-3a-sel-modality-image
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A furniture retailer wants to generate catalog pictures of new products from short text descriptions written by its designers. The company is comparing several foundation models (FMs) on Amazon Bedrock.

    Which selection criterion must the company check FIRST to make sure that a model can perform this task?
  fr: |
    Un détaillant de meubles veut générer des images de catalogue de nouveaux produits à partir de courtes descriptions textuelles rédigées par ses designers. L'entreprise compare plusieurs modèles de fondation (FM) sur Amazon Bedrock.

    Quel critère de sélection l'entreprise doit-elle vérifier EN PREMIER pour s'assurer qu'un modèle peut effectuer cette tâche ?
body:
  options:
    - { id: a, text: { en: "Prompt caching (reuse of repeated prompt prefixes)", fr: "Mise en cache des invites (réutilisation des préfixes d'invite répétés)" } }
    - { id: b, text: { en: "Multilingual support (languages that the model understands)", fr: "Prise en charge multilingue (langues que le modèle comprend)" } }
    - { id: c, text: { en: "Modality (types of input and output that the model supports)", fr: "Modalité (types d'entrée et de sortie que le modèle prend en charge)" } }
    - { id: d, text: { en: "Customization (support for fine-tuning the model)", fr: "Personnalisation (prise en charge du peaufinage du modèle)" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Modality describes the types of data that a model accepts and produces. This task needs a model that takes text as input and returns images, so a model that returns only text cannot be used whatever its other qualities. For example, Amazon Nova Micro and Nova Pro return text, whereas Amazon Nova Canvas takes text and images and generates images."
    fr: "La modalité décrit les types de données qu'un modèle accepte et produit. Cette tâche exige un modèle qui prend du texte en entrée et renvoie des images : un modèle qui ne renvoie que du texte ne convient donc pas, quelles que soient ses autres qualités. Par exemple, Amazon Nova Micro et Nova Pro renvoient du texte, alors qu'Amazon Nova Canvas prend du texte et des images et génère des images."
  options:
    a:
      en: "Prompt caching lowers the latency and cost of prompts that repeat a long prefix; it does not decide whether the model can generate images."
      fr: "La mise en cache des invites réduit la latence et le coût des invites qui répètent un long préfixe ; elle ne détermine pas si le modèle peut générer des images."
    b:
      en: "The scenario has no language requirement; multilingual support does not make a model produce images."
      fr: "Le scénario ne contient aucune exigence de langue ; la prise en charge multilingue ne permet pas à un modèle de produire des images."
    d:
      en: "Fine-tuning support matters only if the company plans to customize the model, and it does not add an output modality that the model lacks."
      fr: "La prise en charge du peaufinage n'importe que si l'entreprise prévoit de personnaliser le modèle, et elle n'ajoute pas une modalité de sortie absente du modèle."
references:
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
