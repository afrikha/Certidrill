id: aifc01-3c-pm-version-production
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a prompt from Amazon Bedrock Prompt Management in a production chatbot. The prompt engineering team continues to edit and save the prompt every day. Production must keep using the last tested configuration until the team approves a change, and the company does not want to copy prompt text into the application code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise une invite d'Amazon Bedrock Prompt Management dans un chatbot de production. L'équipe d'ingénierie des invites continue de modifier et d'enregistrer l'invite chaque jour. La production doit continuer d'utiliser la dernière configuration testée jusqu'à ce que l'équipe approuve un changement, et l'entreprise ne veut pas copier le texte de l'invite dans le code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a version of the prompt and invoke that version's ARN from the chatbot.", fr: "Créer une version de l'invite et appeler l'ARN de cette version depuis le chatbot." } }
    - { id: b, text: { en: "Invoke the prompt ARN without a version so that the chatbot uses the saved draft.", fr: "Appeler l'ARN de l'invite sans version pour que le chatbot utilise le brouillon enregistré." } }
    - { id: c, text: { en: "Create a prompt variant for production and set it as the default variant of the draft.", fr: "Créer une variante d'invite pour la production et la définir comme variante par défaut du brouillon." } }
    - { id: d, text: { en: "Store the approved prompt text in the chatbot source code and redeploy it for each change.", fr: "Stocker le texte de l'invite approuvée dans le code source du chatbot et le redéployer à chaque changement." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Saving a prompt updates its draft, while a version is a point-in-time snapshot of the draft created when you are ready to deploy. The chatbot invokes the version ARN, so daily edits to the draft do not reach production until the team creates a new version and switches the chatbot to it."
    fr: "Enregistrer une invite met à jour son brouillon, alors qu'une version est un instantané du brouillon créé quand vous êtes prêt à déployer. Le chatbot appelle l'ARN de la version : les modifications quotidiennes du brouillon n'atteignent pas la production tant que l'équipe ne crée pas de nouvelle version et n'y bascule pas le chatbot."
  options:
    b:
      en: "The draft changes every time the team saves the prompt, so production would receive untested edits."
      fr: "Le brouillon change chaque fois que l'équipe enregistre l'invite : la production recevrait des modifications non testées."
    c:
      en: "Variants belong to the draft that the team keeps editing; a default variant does not freeze the configuration used by production."
      fr: "Les variantes appartiennent au brouillon que l'équipe continue de modifier ; une variante par défaut ne fige pas la configuration utilisée en production."
    d:
      en: "Copying the prompt text into the code is exactly what the company wants to avoid, and it loses the prompt library."
      fr: "Copier le texte de l'invite dans le code est précisément ce que l'entreprise veut éviter, et cela fait perdre la bibliothèque d'invites."
references:
  - title: Deploy a prompt to your application using versions in Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html
  - title: Test a prompt using Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-test.html
