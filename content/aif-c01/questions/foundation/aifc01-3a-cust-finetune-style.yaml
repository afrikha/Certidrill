id: aifc01-3a-cust-finetune-style
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company adds 20 examples of its brand writing style to every prompt so that a foundation model (FM) follows that style. The application sends millions of requests each month, and the long prompts make the input token cost high. The company has 10,000 labeled prompt-response pairs written in its style and wants to lower the long-term cost of each request.

    Which approach will meet these requirements?
  fr: |
    Une entreprise ajoute 20 exemples de son style rédactionnel de marque à chaque invite pour qu'un modèle de fondation (FM) respecte ce style. L'application envoie des millions de requêtes par mois, et les longues invites rendent le coût des jetons d'entrée élevé. L'entreprise dispose de 10 000 paires invite-réponse étiquetées, rédigées dans son style, et veut réduire le coût à long terme de chaque requête.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the FM with the labeled pairs, and remove the style examples from the prompts.", fr: "Peaufiner le FM avec les paires étiquetées, et retirer les exemples de style des invites." } }
    - { id: b, text: { en: "Store the style examples in a knowledge base, and retrieve them for each request.", fr: "Stocker les exemples de style dans une base de connaissances, et les récupérer pour chaque requête." } }
    - { id: c, text: { en: "Add more style examples to each prompt to make the style more consistent.", fr: "Ajouter davantage d'exemples de style à chaque invite pour rendre le style plus cohérent." } }
    - { id: d, text: { en: "Pre-train a new FM on all the marketing content of the company.", fr: "Préentraîner un nouveau FM sur tout le contenu marketing de l'entreprise." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Fine-tuning with labeled examples teaches the model the company's style, which fine-tuning handles better than retrieval. The job has a one-time training cost plus custom model storage and hosting, but the 20 examples no longer travel with every prompt. At millions of requests per month, the shorter prompts lower the long-term per-request cost."
    fr: "Le réglage précis avec des exemples étiquetés apprend au modèle le style de l'entreprise, ce que le réglage précis gère mieux que la récupération. La tâche a un coût d'entraînement ponctuel, plus le stockage et l'hébergement du modèle personnalisé, mais les 20 exemples ne voyagent plus avec chaque invite. À des millions de requêtes par mois, les invites plus courtes réduisent le coût à long terme de chaque requête."
  options:
    b:
      en: "Retrieved examples are still added to every prompt as input tokens, so the per-request cost stays high."
      fr: "Les exemples récupérés sont toujours ajoutés à chaque invite comme jetons d'entrée : le coût par requête reste donc élevé."
    c:
      en: "More examples make every prompt longer and the input token cost even higher."
      fr: "Davantage d'exemples allongent chaque invite et augmentent encore le coût des jetons d'entrée."
    d:
      en: "Pre-training a new FM is the most expensive option in data, compute, and cost; it is not justified to learn a writing style."
      fr: "Préentraîner un nouveau FM est l'option la plus coûteuse en données, en calcul et en argent ; elle n'est pas justifiée pour apprendre un style rédactionnel."
references:
  - title: Comparing Retrieval Augmented Generation and fine-tuning
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-vs-fine-tuning.html
  - title: Customize your model to improve its performance for your use case
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
