id: aifc01-3a-vec-neptune-index
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an Amazon Neptune Analytics graph that was created without a vector search index. The company now wants to store document embeddings in Neptune Analytics so that it can combine vector similarity search with graph traversals. The embeddings model produces vectors with 1,024 dimensions.

    What should the company do?
  fr: |
    Une entreprise dispose d'un graphe Amazon Neptune Analytics créé sans index de recherche vectorielle. L'entreprise veut maintenant stocker des intégrations de documents dans Neptune Analytics afin de combiner la recherche de similarité vectorielle et les parcours de graphe. Le modèle d'intégration produit des vecteurs de 1 024 dimensions.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Add a vector search index with 1,024 dimensions to the existing graph.", fr: "Ajouter un index de recherche vectorielle de 1 024 dimensions au graphe existant." } }
    - { id: b, text: { en: "Create a new graph with a vector search index of 1,024 dimensions, and load the data into it.", fr: "Créer un nouveau graphe avec un index de recherche vectorielle de 1 024 dimensions, et y charger les données." } }
    - { id: c, text: { en: "Create one vector index for each document type in the existing graph.", fr: "Créer un index vectoriel pour chaque type de document dans le graphe existant." } }
    - { id: d, text: { en: "Load the embeddings into the existing graph without any index, and set the dimension at query time.", fr: "Charger les intégrations dans le graphe existant sans aucun index, et définir la dimension au moment de la requête." } }
answer: { optionId: b }
explanation:
  correct:
    en: "In Neptune Analytics, a vector search index can be created only when the graph is created, and each graph has exactly one vector index with a fixed dimension. The company must create a new graph whose vector index dimension matches the 1,024-dimension embeddings model, then load its graph data and embeddings."
    fr: "Dans Neptune Analytics, un index de recherche vectorielle ne peut être créé qu'au moment de la création du graphe, et chaque graphe possède un seul index vectoriel de dimension fixe. L'entreprise doit créer un nouveau graphe dont la dimension de l'index vectoriel correspond au modèle d'intégration de 1 024 dimensions, puis y charger ses données de graphe et ses intégrations."
  options:
    a:
      en: "A vector index cannot be added to a graph after the graph is created."
      fr: "Un index vectoriel ne peut pas être ajouté à un graphe après sa création."
    c:
      en: "A Neptune Analytics graph supports only one vector index, and it cannot be added to an existing graph."
      fr: "Un graphe Neptune Analytics ne prend en charge qu'un seul index vectoriel, qui ne peut pas être ajouté à un graphe existant."
    d:
      en: "Without a vector index, embeddings in the loaded files are ignored, and the dimension is fixed when the index is created, not at query time."
      fr: "Sans index vectoriel, les intégrations des fichiers chargés sont ignorées, et la dimension est fixée à la création de l'index, pas au moment de la requête."
references:
  - title: Vector indexing in Neptune Analytics
    url: https://docs.aws.amazon.com/neptune-analytics/latest/userguide/vector-index.html
