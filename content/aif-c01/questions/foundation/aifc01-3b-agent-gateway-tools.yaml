id: aifc01-3b-agent-gateway-tools
objective: "3.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturing company is building AI agents on Amazon Bedrock AgentCore. The agents must use the company's existing internal REST APIs and AWS Lambda functions as tools. The company wants these APIs and functions to become Model Context Protocol (MCP)-compatible tools without rewriting them.

    Which AgentCore service will meet these requirements?
  fr: |
    Une entreprise industrielle crée des agents d'IA sur Amazon Bedrock AgentCore. Les agents doivent utiliser comme outils les API REST internes et les fonctions AWS Lambda existantes de l'entreprise. L'entreprise veut que ces API et ces fonctions deviennent des outils compatibles Model Context Protocol (MCP) sans les réécrire.

    Quel service AgentCore répond à ces exigences ?
body:
  options:
    - { id: a, text: "AgentCore Identity" }
    - { id: b, text: "AgentCore Code Interpreter" }
    - { id: c, text: "AgentCore Gateway" }
    - { id: d, text: "AgentCore Observability" }
answer: { optionId: c }
explanation:
  correct:
    en: "AgentCore Gateway converts APIs, Lambda functions, and existing services into MCP-compatible tools that agents can call, and it can also connect to existing MCP servers. The company keeps its APIs as they are."
    fr: "AgentCore Gateway convertit des API, des fonctions Lambda et des services existants en outils compatibles MCP que les agents peuvent appeler, et peut aussi se connecter à des serveurs MCP existants. L'entreprise conserve ses API telles quelles."
  options:
    a:
      en: "AgentCore Identity manages agent identity, access, and authentication with existing identity providers; it does not turn APIs into tools."
      fr: "AgentCore Identity gère l'identité, l'accès et l'authentification des agents avec les fournisseurs d'identité existants ; il ne transforme pas des API en outils."
    b:
      en: "Code Interpreter is an isolated sandbox in which an agent runs code that it writes; it does not expose existing APIs."
      fr: "Code Interpreter est un bac à sable isolé dans lequel un agent exécute le code qu'il écrit ; il n'expose pas des API existantes."
    d:
      en: "Observability traces and monitors agent behavior; it does not create tools."
      fr: "Observability trace et surveille le comportement des agents ; il ne crée pas d'outils."
references:
  - title: Overview
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
