id: aifc01-3a-sel-match-criteria
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A company is choosing foundation models (FMs) for four projects. Match each project requirement with the FM selection criterion that it depends on. Select the correct criterion from the following list for each requirement. Each criterion should be selected one time or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise choisit des modèles de fondation (FM) pour quatre projets. Associez chaque exigence de projet au critère de sélection de FM dont elle dépend. Sélectionnez dans la liste suivante le critère qui convient à chaque exigence. Chaque critère peut être sélectionné une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: modality, text: { en: "Modality", fr: "Modalité" } }
    - { id: latency, text: { en: "Latency", fr: "Latence" } }
    - { id: caching, text: { en: "Prompt caching", fr: "Mise en cache des invites" } }
    - { id: length, text: { en: "Input/output length", fr: "Longueur d'entrée/de sortie" } }
    - { id: custom, text: { en: "Customization", fr: "Personnalisation" } }
    - { id: multi, text: { en: "Multilingual support", fr: "Prise en charge multilingue" } }
  targets:
    - { id: t1, text: { en: "The model must read photos of receipts and return the totals as text.", fr: "Le modèle doit lire des photos de reçus et renvoyer les totaux sous forme de texte." } }
    - { id: t2, text: { en: "Every request starts with the same long system prompt, and input token costs must drop.", fr: "Chaque requête commence par la même longue invite système, et le coût des jetons d'entrée doit baisser." } }
    - { id: t3, text: { en: "The model must summarize a 500-page report in a single request.", fr: "Le modèle doit résumer un rapport de 500 pages en une seule requête." } }
    - { id: t4, text: { en: "The company will adapt the model with its own labeled examples.", fr: "L'entreprise adaptera le modèle avec ses propres exemples étiquetés." } }
answer:
  mapping: { t1: modality, t2: caching, t3: length, t4: custom }
explanation:
  correct:
    en: "Reading photos and returning text is a question of modality (image input, text output). A long prefix that repeats in every request is the case that prompt caching addresses, with cached tokens billed at a lower rate. A 500-page report in one request depends on the maximum input length, that is, the context window. Adapting the model with labeled examples is fine-tuning, which only some models support. Latency and multilingual support are not stated requirements here."
    fr: "Lire des photos et renvoyer du texte relève de la modalité (entrée image, sortie texte). Un long préfixe répété dans chaque requête est le cas que traite la mise en cache des invites, les jetons mis en cache étant facturés à un tarif inférieur. Un rapport de 500 pages en une requête dépend de la longueur d'entrée maximale, c'est-à-dire de la fenêtre de contexte. Adapter le modèle avec des exemples étiquetés est du peaufinage, que seuls certains modèles prennent en charge. La latence et la prise en charge multilingue ne sont pas des exigences énoncées ici."
references:
  - title: Prompt caching for faster model inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
