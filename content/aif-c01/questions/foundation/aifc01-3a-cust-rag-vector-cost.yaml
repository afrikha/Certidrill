id: aifc01-3a-cust-rag-vector-cost
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company plans to customize the answers of a foundation model (FM) with Retrieval Augmented Generation (RAG) instead of fine-tuning.

    Which cost must the company plan for with RAG that fine-tuning alone does not have?
  fr: |
    Une entreprise prévoit de personnaliser les réponses d'un modèle de fondation (FM) avec la génération à enrichissement contextuel (RAG) au lieu du réglage précis.

    Quel coût l'entreprise doit-elle prévoir avec le RAG, que le réglage précis seul n'entraîne pas ?
body:
  options:
    - { id: a, text: { en: "A training charge for each epoch over the documents", fr: "Des frais d'entraînement pour chaque époque sur les documents" } }
    - { id: b, text: { en: "A monthly storage charge for a custom model", fr: "Des frais mensuels de stockage d'un modèle personnalisé" } }
    - { id: c, text: { en: "The labeling of prompt-response pairs", fr: "L'étiquetage de paires invite-réponse" } }
    - { id: d, text: { en: "The storage and querying of embeddings in a vector store", fr: "Le stockage et l'interrogation des intégrations dans un magasin de vecteurs" } }
answer: { optionId: d }
explanation:
  correct:
    en: "RAG does not train the model, but it needs infrastructure that fine-tuning alone does not: the documents are embedded with an embeddings model, the vectors are stored in a vector store, and every question runs a similarity search. Vector stores, such as S3 Vectors or OpenSearch Service, charge for storing and querying these vectors."
    fr: "Le RAG n'entraîne pas le modèle, mais il nécessite une infrastructure dont le réglage précis seul n'a pas besoin : les documents sont vectorisés avec un modèle d'intégration, les vecteurs sont stockés dans un magasin de vecteurs et chaque question lance une recherche de similarité. Les magasins de vecteurs, comme S3 Vectors ou OpenSearch Service, facturent le stockage et l'interrogation de ces vecteurs."
  options:
    a:
      en: "Training charges based on tokens and epochs apply to fine-tuning, not to RAG."
      fr: "Les frais d'entraînement calculés selon les jetons et les époques s'appliquent au réglage précis, pas au RAG."
    b:
      en: "A monthly storage charge applies to the custom model that fine-tuning creates; RAG uses the base model unchanged."
      fr: "Des frais mensuels de stockage s'appliquent au modèle personnalisé créé par le réglage précis ; le RAG utilise le modèle de base sans le modifier."
    c:
      en: "Labeled prompt-response pairs are the training data of supervised fine-tuning; RAG works from unlabeled documents."
      fr: "Les paires invite-réponse étiquetées sont les données d'entraînement du réglage précis supervisé ; le RAG fonctionne à partir de documents non étiquetés."
references:
  - title: How Amazon Bedrock knowledge bases work
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
  - title: Working with S3 Vectors and vector buckets
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html
