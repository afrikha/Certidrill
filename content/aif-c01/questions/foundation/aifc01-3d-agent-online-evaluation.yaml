id: aifc01-3d-agent-online-evaluation
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company deployed an AI agent on Amazon Bedrock AgentCore Runtime. The company wants quality scores to be computed continuously on 10 % of live production sessions, with quality trends shown on a dashboard.

    Which solution will meet these requirements?
  fr: |
    Une agence de voyages a déployé un agent d'IA sur Amazon Bedrock AgentCore Runtime. L'entreprise veut que des scores de qualité soient calculés en continu sur 10 % des sessions de production réelles, avec les tendances de qualité affichées dans un tableau de bord.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "On-demand evaluation in AgentCore Evaluations with a list of trace IDs", fr: "L'évaluation à la demande (on-demand) d'AgentCore Evaluations avec une liste d'ID de traces" } }
    - { id: b, text: { en: "An Amazon Bedrock automatic model evaluation job run once before launch", fr: "Une tâche d'évaluation de modèle automatique Amazon Bedrock exécutée une fois avant le lancement" } }
    - { id: c, text: { en: "Online evaluation in AgentCore Evaluations with a sampling rate", fr: "L'évaluation en ligne (online) d'AgentCore Evaluations avec un taux d'échantillonnage" } }
    - { id: d, text: { en: "AWS CloudTrail logging of the AgentCore API calls", fr: "La journalisation AWS CloudTrail des appels d'API AgentCore" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Online evaluation continuously monitors deployed agents on live production traffic. It supports percentage-based sampling, such as 10 % of sessions, and shows aggregated scores in dashboards to track quality trends and investigate low-scoring sessions."
    fr: "L'évaluation en ligne surveille en continu les agents déployés sur le trafic de production réel. Elle prend en charge un échantillonnage en pourcentage, par exemple 10 % des sessions, et affiche des scores agrégés dans des tableaux de bord pour suivre les tendances de qualité et examiner les sessions mal notées."
  options:
    a:
      en: "On-demand evaluation processes only the spans or traces whose IDs you provide; it suits targeted investigation and development, not continuous monitoring."
      fr: "L'évaluation à la demande ne traite que les spans ou traces dont vous fournissez les ID ; elle convient aux investigations ciblées et au développement, pas à la surveillance continue."
    b:
      en: "A one-time model evaluation before launch does not score live production sessions."
      fr: "Une évaluation de modèle ponctuelle avant le lancement ne note pas les sessions de production réelles."
    d:
      en: "CloudTrail records API activity for auditing; it does not compute quality scores."
      fr: "CloudTrail enregistre l'activité des API à des fins d'audit ; il ne calcule pas de scores de qualité."
references:
  - title: Evaluation types
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations-types.html
