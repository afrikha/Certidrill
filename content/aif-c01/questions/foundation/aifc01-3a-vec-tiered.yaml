id: aifc01-3a-vec-tiered
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has two sets of embeddings. The first set contains 2 billion embeddings of archived records and is queried a few times each day. The second set contains 5 million product embeddings that are queried thousands of times each second and must return results in less than 10 milliseconds.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise dispose de deux ensembles d'intégrations. Le premier contient 2 milliards d'intégrations d'enregistrements archivés et est interrogé quelques fois par jour. Le second contient 5 millions d'intégrations de produits, interrogées des milliers de fois par seconde, et doit renvoyer des résultats en moins de 10 millisecondes.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Store both sets of embeddings in Amazon OpenSearch Service.", fr: "Stocker les deux ensembles d'intégrations dans Amazon OpenSearch Service." } }
    - { id: b, text: { en: "Store the archived set in Amazon S3 Vectors and the product set in Amazon OpenSearch Service.", fr: "Stocker l'ensemble archivé dans Amazon S3 Vectors et l'ensemble de produits dans Amazon OpenSearch Service." } }
    - { id: c, text: { en: "Store both sets of embeddings in Amazon S3 Vectors.", fr: "Stocker les deux ensembles d'intégrations dans Amazon S3 Vectors." } }
    - { id: d, text: { en: "Store the archived set in Amazon OpenSearch Service and the product set in Amazon S3 Vectors.", fr: "Stocker l'ensemble archivé dans Amazon OpenSearch Service et l'ensemble de produits dans Amazon S3 Vectors." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS guidance describes a tiered design: S3 Vectors for large, rarely queried vector sets at minimal cost, and OpenSearch Service for hot, high-frequency queries with latency under 10 milliseconds. The archived set fits S3 Vectors, whose query latency of about 100 milliseconds is acceptable a few times a day, and the product set needs OpenSearch Service."
    fr: "Les recommandations d'AWS décrivent une conception à plusieurs niveaux : S3 Vectors pour de grands ensembles de vecteurs rarement interrogés à coût minimal, et OpenSearch Service pour les requêtes fréquentes à chaud avec une latence inférieure à 10 millisecondes. L'ensemble archivé convient à S3 Vectors, dont la latence d'environ 100 millisecondes est acceptable quelques fois par jour, et l'ensemble de produits exige OpenSearch Service."
  options:
    a:
      en: "OpenSearch Service meets the latency target for both sets, but keeping 2 billion rarely queried vectors there costs much more than S3 Vectors."
      fr: "OpenSearch Service atteint l'objectif de latence pour les deux ensembles, mais y conserver 2 milliards de vecteurs rarement interrogés coûte beaucoup plus cher que S3 Vectors."
    c:
      en: "S3 Vectors returns frequent queries in about 100 milliseconds, which fails the 10-millisecond requirement of the product set."
      fr: "S3 Vectors renvoie les requêtes fréquentes en environ 100 millisecondes, ce qui ne respecte pas l'exigence de 10 millisecondes de l'ensemble de produits."
    d:
      en: "This reverses the tiers: the hot product set misses its latency target and the archive is stored on the more expensive service."
      fr: "Cette solution inverse les niveaux : l'ensemble de produits fréquemment interrogé manque son objectif de latence et l'archive est stockée sur le service le plus cher."
