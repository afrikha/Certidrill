id: aifc01-3b-pc-task-and-data
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A restaurant group wants a foundation model to summarize each customer review in one sentence. A developer sends the model only the text "Make it shorter." and gets an unusable answer.

    Which two prompt components must the prompt contain for the model to perform this task? (Choose two.)
  fr: |
    Un groupe de restaurants veut qu'un modèle de fondation résume chaque avis client en une phrase. Un développeur envoie au modèle seulement le texte « Fais plus court. » et obtient une réponse inutilisable.

    Quels sont les deux composants que l'invite doit contenir pour que le modèle effectue cette tâche ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The temperature value for the request", fr: "La valeur de température de la requête" } }
    - { id: b, text: { en: "A clear instruction that states the task", fr: "Une instruction claire qui énonce la tâche" } }
    - { id: c, text: { en: "The dataset that was used to train the model", fr: "Le jeu de données utilisé pour entraîner le modèle" } }
    - { id: d, text: { en: "The input text of the review to summarize", fr: "Le texte d'entrée de l'avis à résumer" } }
    - { id: e, text: { en: "A negative prompt that lists forbidden words", fr: "Une invite négative qui liste les mots interdits" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The model needs an instruction that states the task (\"Summarize the following review in one sentence\") and the input text to work on (the review). AWS's example of a restaurant review summary shows that both are needed to get a sensible result."
    fr: "Le modèle a besoin d'une instruction qui énonce la tâche (« Résume l'avis suivant en une phrase ») et du texte d'entrée à traiter (l'avis). L'exemple d'AWS d'un résumé d'avis de restaurant montre que les deux sont nécessaires pour obtenir un résultat cohérent."
  options:
    a:
      en: "Temperature is an inference parameter set in the API request, not a component of the prompt text, and it does not define the task."
      fr: "La température est un paramètre d'inférence défini dans la requête d'API, pas un composant du texte de l'invite, et elle ne définit pas la tâche."
    c:
      en: "The training dataset is not sent with a prompt; the model already learned from it."
      fr: "Le jeu de données d'entraînement n'est pas envoyé avec une invite ; le modèle en a déjà appris."
    e:
      en: "A negative prompt is optional; it does not tell the model what task to perform or which text to summarize."
      fr: "Une invite négative est facultative ; elle n'indique au modèle ni la tâche à effectuer ni le texte à résumer."
references:
  - title: Prompt engineering concepts
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
