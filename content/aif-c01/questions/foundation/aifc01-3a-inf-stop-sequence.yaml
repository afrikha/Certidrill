id: aifc01-3a-inf-stop-sequence
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application asks a foundation model (FM) to write one answer followed by the marker ###. The model sometimes continues after the marker and invents another question and answer, which wastes output tokens. The developer wants the model to stop generating as soon as it produces the marker.

    Which inference parameter should the developer set?
  fr: |
    Une application demande à un modèle de fondation (FM) d'écrire une réponse suivie du marqueur ###. Le modèle continue parfois après le marqueur et invente une autre question et sa réponse, ce qui gaspille des jetons de sortie. Le développeur veut que le modèle arrête de générer dès qu'il produit le marqueur.

    Quel paramètre d'inférence le développeur doit-il définir ?
body:
  options:
    - { id: a, text: { en: "Stop sequences", fr: "Séquences d'arrêt" } }
    - { id: b, text: { en: "Top K", fr: "Top K" } }
    - { id: c, text: { en: "Temperature", fr: "Température" } }
    - { id: d, text: { en: "Top P", fr: "Top P" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A stop sequence is a sequence of characters that stops the model from generating further tokens. If ### is set as a stop sequence, the model stops right after it generates the marker, so no extra question and answer are produced or billed."
    fr: "Une séquence d'arrêt est une suite de caractères qui empêche le modèle de générer d'autres jetons. Si ### est défini comme séquence d'arrêt, le modèle s'arrête juste après avoir généré le marqueur : aucune question ni réponse supplémentaire n'est donc produite ni facturée."
  options:
    b:
      en: "Top K sets how many of the most probable candidate tokens the model considers; it does not stop generation at a marker."
      fr: "Top K définit combien des jetons candidats les plus probables le modèle prend en compte ; il n'arrête pas la génération à un marqueur."
    c:
      en: "Temperature changes how random the output is; the model can still continue after the marker."
      fr: "La température modifie le caractère aléatoire de la sortie ; le modèle peut toujours continuer après le marqueur."
    d:
      en: "Top P limits the candidates to a share of the cumulative probability; it does not end the response at a given string."
      fr: "Top P limite les candidats à une part de la probabilité cumulée ; il ne termine pas la réponse à une chaîne donnée."
references:
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
