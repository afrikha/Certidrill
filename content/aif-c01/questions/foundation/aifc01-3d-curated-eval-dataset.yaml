id: aifc01-3d-curated-eval-dataset
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company wants to determine whether an FM can extract the required data from claim files and draft claim decisions as well as its claims experts do.

    Which evaluation dataset will give the MOST reliable view of whether the FM meets this objective?
  fr: |
    Une compagnie d'assurance veut déterminer si un FM peut extraire les données requises des dossiers de sinistres et rédiger des décisions sur les sinistres aussi bien que ses experts.

    Quel jeu de données d'évaluation donnera la vue la PLUS fiable de la capacité du FM à répondre à cet objectif ?
body:
  options:
    - { id: a, text: { en: "A public benchmark dataset of general knowledge questions", fr: "Un jeu de données de référence public de questions de culture générale" } }
    - { id: b, text: { en: "A set of prompts that the FM generated itself, without reference answers", fr: "Un ensemble d'invites générées par le FM lui-même, sans réponses de référence" } }
    - { id: c, text: { en: "A curated set of historical claims with reference answers validated by claims experts", fr: "Un ensemble organisé de sinistres passés avec des réponses de référence validées par des experts" } }
    - { id: d, text: { en: "The dataset that the FM provider used to pre-train the model", fr: "Le jeu de données utilisé par le fournisseur du FM pour pré-entraîner le modèle" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Metrics need a reference point. AWS guidance calls for a curated evaluation dataset built from historical workflow data and expert-annotated examples, with reference answers validated by subject matter experts. It reflects the company's real task, so the results show whether the FM does that task as well as the experts."
    fr: "Les métriques ont besoin d'un point de référence. Les recommandations AWS préconisent un jeu de données d'évaluation organisé, construit à partir de données historiques du processus et d'exemples annotés par des experts, avec des réponses de référence validées par des experts métier. Il reflète la tâche réelle de l'entreprise : les résultats montrent donc si le FM accomplit cette tâche aussi bien que les experts."
  options:
    a:
      en: "General knowledge questions do not represent the company's claims task."
      fr: "Des questions de culture générale ne représentent pas la tâche de gestion des sinistres de l'entreprise."
    b:
      en: "Without reference answers there is nothing to compare the outputs with, and self-generated prompts may not match real claims."
      fr: "Sans réponses de référence, il n'y a rien à quoi comparer les sorties, et des invites autogénérées peuvent ne pas correspondre à de vrais sinistres."
    d:
      en: "Pre-training data is generally not available and does not contain the company's claims or expert decisions."
      fr: "Les données de pré-entraînement ne sont généralement pas disponibles et ne contiennent ni les sinistres de l'entreprise ni les décisions de ses experts."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
