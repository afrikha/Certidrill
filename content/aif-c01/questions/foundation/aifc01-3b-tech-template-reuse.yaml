id: aifc01-3b-tech-template-reuse
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A furniture retailer generates thousands of product descriptions with a foundation model. Every prompt has the same structure and rules; only the product name, the materials, and the dimensions change. Several teams must use the same prompt consistently.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un vendeur de meubles génère des milliers de descriptions de produits avec un modèle de fondation. Toutes les invites ont la même structure et les mêmes règles ; seuls le nom du produit, les matériaux et les dimensions changent. Plusieurs équipes doivent utiliser la même invite de manière cohérente.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the model on existing descriptions so that each team can send short prompts.", fr: "Peaufiner le modèle sur les descriptions existantes pour que chaque équipe puisse envoyer des invites courtes." } }
    - { id: b, text: { en: "Create a prompt template with placeholders for the name, the materials, and the dimensions.", fr: "Créer un modèle d'invite avec des espaces réservés pour le nom, les matériaux et les dimensions." } }
    - { id: c, text: { en: "Let each team write its own zero-shot prompt for each product description.", fr: "Laisser chaque équipe rédiger sa propre invite zero-shot pour chaque description de produit." } }
    - { id: d, text: { en: "Add chain-of-thought instructions so that the model explains each description.", fr: "Ajouter des instructions de chaîne de pensée pour que le modèle explique chaque description." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A prompt template defines the fixed structure, instructions, and rules of a prompt and marks the variable parts with placeholders (for example {{product_name}}) that are filled in at run time. Every team reuses the same template, so prompts stay consistent with no training."
    fr: "Un modèle d'invite définit la structure, les instructions et les règles fixes d'une invite et marque les parties variables par des espaces réservés (par exemple {{product_name}}) remplis à l'exécution. Toutes les équipes réutilisent le même modèle : les invites restent cohérentes, sans entraînement."
  options:
    a:
      en: "Fine-tuning requires training data, a training job, and custom model costs, which is more effort than a reusable prompt."
      fr: "Le peaufinage demande des données d'entraînement, une tâche d'entraînement et des coûts de modèle personnalisé, ce qui représente plus d'effort qu'une invite réutilisable."
    c:
      en: "Prompts written separately by each team are not consistent and must be rewritten for every product."
      fr: "Des invites rédigées séparément par chaque équipe ne sont pas cohérentes et doivent être réécrites pour chaque produit."
    d:
      en: "Chain-of-thought adds reasoning to the output; it does not make the prompt reusable or consistent across teams."
      fr: "La chaîne de pensée ajoute du raisonnement à la sortie ; elle ne rend pas l'invite réutilisable ni cohérente entre les équipes."
references:
  - title: Prompt engineering concepts
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
