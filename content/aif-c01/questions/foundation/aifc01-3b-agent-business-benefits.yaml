id: aifc01-3b-agent-business-benefits
objective: "3.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    The leadership team of a bank is building a business case for AI agents in its back office.

    Which two benefits can AI agents provide? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de direction d'une banque prépare une analyse de rentabilité pour des agents d'IA dans ses services administratifs.

    Quels sont les deux avantages que peuvent apporter les agents d'IA ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Guarantee error-free results so that human review is no longer needed", fr: "Garantir des résultats sans erreur pour que la vérification humaine ne soit plus nécessaire" } }
    - { id: b, text: { en: "Increase productivity by handling repetitive multi-step tasks", fr: "Augmenter la productivité en prenant en charge des tâches répétitives en plusieurs étapes" } }
    - { id: c, text: { en: "Remove the need to protect the data that the agents process", fr: "Supprimer la nécessité de protéger les données que traitent les agents" } }
    - { id: d, text: { en: "Run without consuming any compute resources or inference costs", fr: "Fonctionner sans consommer de ressources de calcul ni de coûts d'inférence" } }
    - { id: e, text: { en: "Respond to customer requests faster with personalized actions", fr: "Répondre plus vite aux demandes des clients avec des actions personnalisées" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS lists higher productivity, because staff can delegate repetitive work, and a better customer experience, through faster and personalized responses, among the business benefits of AI agents. Lower costs from fewer manual errors and better data-driven decisions are other benefits."
    fr: "AWS cite parmi les avantages métier des agents d'IA une productivité accrue, car le personnel peut déléguer le travail répétitif, et une meilleure expérience client, grâce à des réponses plus rapides et personnalisées. La baisse des coûts due à moins d'erreurs manuelles et de meilleures décisions fondées sur les données sont d'autres avantages."
  options:
    a:
      en: "Agents can produce biased or inaccurate results; human review remains a recommended control."
      fr: "Les agents peuvent produire des résultats biaisés ou inexacts ; la vérification humaine reste un contrôle recommandé."
    c:
      en: "Agents process large volumes of data, which makes data privacy and protection more important, not less."
      fr: "Les agents traitent de grands volumes de données, ce qui rend la confidentialité et la protection des données plus importantes, pas moins."
    d:
      en: "Agents call foundation models and tools, which consume compute and incur inference costs."
      fr: "Les agents appellent des modèles de fondation et des outils, qui consomment des ressources de calcul et entraînent des coûts d'inférence."
references:
  - title: What are AI Agents?
    url: https://aws.amazon.com/what-is/ai-agents/
