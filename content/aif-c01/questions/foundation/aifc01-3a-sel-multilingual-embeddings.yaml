id: aifc01-3a-sel-multilingual-embeddings
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building a Retrieval Augmented Generation (RAG) application on Amazon Bedrock. Its documents and the questions of its users are written in German, Japanese, and Spanish. The company must choose the embeddings model for its knowledge base.

    Which model is MOST suitable?
  fr: |
    Une entreprise crée une application de génération à enrichissement contextuel (RAG) sur Amazon Bedrock. Ses documents et les questions de ses utilisateurs sont rédigés en allemand, en japonais et en espagnol. L'entreprise doit choisir le modèle d'intégration (embeddings) de sa base de connaissances.

    Quel modèle est le PLUS adapté ?
body:
  options:
    - { id: a, text: "Cohere Embed English" }
    - { id: b, text: "Cohere Embed Multilingual" }
    - { id: c, text: "Amazon Nova Micro" }
    - { id: d, text: "Amazon Nova Canvas" }
answer: { optionId: b }
explanation:
  correct:
    en: "A knowledge base needs an embeddings model, and multilingual support is a selection criterion when the content is not only in English. Cohere Embed Multilingual is one of the embeddings models that Amazon Bedrock Knowledge Bases supports, and it is designed for text in many languages."
    fr: "Une base de connaissances a besoin d'un modèle d'intégration, et la prise en charge multilingue est un critère de sélection quand le contenu n'est pas uniquement en anglais. Cohere Embed Multilingual fait partie des modèles d'intégration pris en charge par Amazon Bedrock Knowledge Bases, et il est conçu pour du texte en de nombreuses langues."
  options:
    a:
      en: "Cohere Embed English is an embeddings model for English text; the documents and questions here are in other languages."
      fr: "Cohere Embed English est un modèle d'intégration pour du texte en anglais ; ici, les documents et les questions sont dans d'autres langues."
    c:
      en: "Amazon Nova Micro is a text generation model; it does not produce the embeddings that a knowledge base stores."
      fr: "Amazon Nova Micro est un modèle de génération de texte ; il ne produit pas les intégrations stockées par une base de connaissances."
    d:
      en: "Amazon Nova Canvas generates images; it is not an embeddings model for text retrieval."
      fr: "Amazon Nova Canvas génère des images ; ce n'est pas un modèle d'intégration pour la recherche de texte."
references:
  - title: Prerequisites for using a vector store you created for a knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
