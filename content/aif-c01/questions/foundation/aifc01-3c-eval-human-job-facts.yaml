id: aifc01-3c-eval-human-job-facts
objective: "3.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is planning a human-in-the-loop evaluation of foundation models (FMs) with a human-based model evaluation job in Amazon Bedrock.

    Which statements about this type of job are correct? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise prévoit une évaluation de modèles de fondation (FM) avec intervention humaine au moyen d'une tâche d'évaluation humaine de modèle dans Amazon Bedrock.

    Quelles affirmations sur ce type de tâche sont correctes ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The job can only use the built-in benchmark datasets of Amazon Bedrock.", fr: "La tâche ne peut utiliser que les jeux de données de référence intégrés d'Amazon Bedrock." } }
    - { id: b, text: { en: "The company defines custom metrics, each with a rating method such as thumbs up/down.", fr: "L'entreprise définit des métriques personnalisées, chacune avec une méthode de notation comme le pouce levé ou baissé." } }
    - { id: c, text: { en: "The workers must be AWS employees who are assigned to the company's account.", fr: "Les évaluateurs doivent être des employés d'AWS affectés au compte de l'entreprise." } }
    - { id: d, text: { en: "The job can evaluate one or two inference sources on the same prompts.", fr: "La tâche peut évaluer une ou deux sources d'inférence sur les mêmes invites." } }
    - { id: e, text: { en: "The job accepts an unlimited number of prompts in the custom prompt dataset.", fr: "La tâche accepte un nombre illimité d'invites dans le jeu de données d'invites personnalisé." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "In a human-based job, you select one or two inference sources (Amazon Bedrock models or your own responses) and define custom metrics with a rating method, such as thumbs up/down, Likert scale, comparison choice, or ordinal rank. The workers are employees or subject-matter experts in a work team that you create or select."
    fr: "Dans une tâche d'évaluation humaine, vous sélectionnez une ou deux sources d'inférence (modèles Amazon Bedrock ou vos propres réponses) et vous définissez des métriques personnalisées avec une méthode de notation, comme le pouce levé ou baissé, l'échelle de Likert, le choix comparatif ou le rang ordinal. Les évaluateurs sont des employés ou des experts du domaine regroupés dans une équipe de travail que vous créez ou sélectionnez."
  options:
    a:
      en: "Human-based jobs use a custom prompt dataset that you store in Amazon S3."
      fr: "Les tâches d'évaluation humaine utilisent un jeu de données d'invites personnalisé que vous stockez dans Amazon S3."
    c:
      en: "The work team is made of the company's own workers, such as employees or industry subject-matter experts, added by email address."
      fr: "L'équipe de travail est composée des évaluateurs de l'entreprise, comme des employés ou des experts du secteur, ajoutés par adresse e-mail."
    e:
      en: "A custom prompt dataset for a human-based job can contain a maximum of 1,000 prompts."
      fr: "Un jeu de données d'invites personnalisé pour une tâche d'évaluation humaine peut contenir au maximum 1 000 invites."
references:
  - title: Create a human-based model evaluation job
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-jobs-management-create-human.html
  - title: Evaluate the performance of Amazon Bedrock resources
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
