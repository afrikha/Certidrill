id: aifc01-3b-tech-match-techniques
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A retail company prepares several prompts for a foundation model.

    Match each prompt with the prompt engineering technique that it uses. To answer, drag the appropriate techniques to the correct prompts. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de distribution prépare plusieurs invites pour un modèle de fondation.

    Associez chaque invite à la technique d'ingénierie de requête qu'elle utilise. Pour répondre, faites glisser les techniques appropriées vers les invites correspondantes. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: zero, text: { en: "Zero-shot prompting", fr: "Invite zero-shot" } }
    - { id: one, text: { en: "Single-shot prompting", fr: "Invite single-shot" } }
    - { id: few, text: { en: "Few-shot prompting", fr: "Invite few-shot" } }
    - { id: cot, text: { en: "Chain-of-thought prompting", fr: "Invite à chaîne de pensée (chain-of-thought)" } }
    - { id: tpl, text: { en: "Prompt template", fr: "Modèle d'invite" } }
    - { id: neg, text: { en: "Negative prompt", fr: "Invite négative" } }
  targets:
    - { id: t1, text: { en: "Four customer reviews with their star ratings, then a new review to rate", fr: "Quatre avis clients avec leur nombre d'étoiles, puis un nouvel avis à noter" } }
    - { id: t2, text: { en: "\"Write a description of {{product}} for {{audience}}\", filled in by the application", fr: "« Rédige une description de {{product}} pour {{audience}} », complété par l'application" } }
    - { id: t3, text: { en: "\"Translate this return policy into German.\" with no example", fr: "« Traduis cette politique de retour en allemand. » sans exemple" } }
    - { id: t4, text: { en: "\"Work out the discount in steps, then give the final price.\"", fr: "« Calcule la remise par étapes, puis donne le prix final. »" } }
    - { id: t5, text: { en: "One sample question with its ideal answer, then the customer's question", fr: "Une question type avec sa réponse idéale, puis la question du client" } }
answer:
  mapping: { t1: few, t2: tpl, t3: zero, t4: cot, t5: one }
explanation:
  correct:
    en: |
      Several labeled examples before the input is few-shot prompting; exactly one example is single-shot prompting; no example at all is zero-shot prompting. A reusable prompt with placeholders that the application fills is a prompt template. Asking the model to reason in steps before the answer is chain-of-thought. None of the prompts states what to exclude, so the negative prompt is not used.
    fr: |
      Plusieurs exemples étiquetés avant l'entrée correspondent à une invite few-shot ; exactement un exemple, à une invite single-shot ; aucun exemple, à une invite zero-shot. Une invite réutilisable avec des espaces réservés que l'application remplit est un modèle d'invite. Demander au modèle de raisonner par étapes avant la réponse relève de la chaîne de pensée. Aucune invite n'indique ce qu'il faut exclure : l'invite négative n'est pas utilisée.
references:
  - title: Prompt engineering concepts
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
