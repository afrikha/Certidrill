id: aifc01-3a-inf-topp-low
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer lowers the top P value of a foundation model (FM) from 0.9 to 0.2 and keeps the other inference parameters unchanged.

    How does this change affect the way the model selects each next token?
  fr: |
    Un développeur abaisse la valeur de top P d'un modèle de fondation (FM) de 0,9 à 0,2 et ne modifie pas les autres paramètres d'inférence.

    Comment cette modification affecte-t-elle la façon dont le modèle sélectionne chaque jeton suivant ?
body:
  options:
    - { id: a, text: { en: "The model selects only from the 20 most probable next tokens.", fr: "Le modèle ne sélectionne que parmi les 20 jetons suivants les plus probables." } }
    - { id: b, text: { en: "The model can generate only 20% of its maximum response length.", fr: "Le modèle ne peut générer que 20 % de sa longueur de réponse maximale." } }
    - { id: c, text: { en: "The model selects only from the tokens in the top 20% of the cumulative probability.", fr: "Le modèle ne sélectionne que parmi les jetons des 20 % supérieurs de la probabilité cumulée." } }
    - { id: d, text: { en: "The model becomes more likely to select low-probability tokens.", fr: "Le modèle devient plus susceptible de sélectionner des jetons peu probables." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Top P is the percentage of most-likely candidates that the model considers: it keeps only the tokens in the top P of the cumulative probability distribution. With 0.2, the model chooses among the few most probable tokens that make up the top 20% of that distribution, so the output becomes more focused and less diverse."
    fr: "Top P est le pourcentage des candidats les plus probables que le modèle prend en compte : il ne conserve que les jetons situés dans les P supérieurs de la distribution de probabilité cumulée. Avec 0,2, le modèle choisit parmi les quelques jetons les plus probables qui forment les 20 % supérieurs de cette distribution : la sortie devient donc plus ciblée et moins diverse."
  options:
    a:
      en: "Limiting the choice to a fixed number of candidates, such as 20, is what top K does; top P works on a share of the cumulative probability."
      fr: "Limiter le choix à un nombre fixe de candidats, comme 20, est le rôle de top K ; top P porte sur une part de la probabilité cumulée."
    b:
      en: "Top P does not control the length of the response; the maximum tokens parameter does."
      fr: "Top P ne contrôle pas la longueur de la réponse ; c'est le rôle du paramètre de nombre maximal de jetons."
    d:
      en: "Lowering top P removes low-probability tokens from the candidates, which has the opposite effect."
      fr: "Abaisser top P retire les jetons peu probables des candidats, ce qui a l'effet inverse."
references:
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
