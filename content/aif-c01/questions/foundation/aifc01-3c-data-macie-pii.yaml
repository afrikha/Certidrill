id: aifc01-3c-data-macie-pii
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company stores thousands of customer chat transcripts in an Amazon S3 bucket. The company plans to use the transcripts to fine-tune a foundation model (FM). Before training, the company must find which objects contain personally identifiable information (PII).

    Which AWS service will meet this requirement?
  fr: |
    Une entreprise de services financiers stocke des milliers de transcriptions de conversations avec des clients dans un compartiment Amazon S3. Elle prévoit d'utiliser ces transcriptions pour peaufiner un modèle de fondation (FM). Avant l'entraînement, elle doit trouver quels objets contiennent des informations personnelles identifiables (PII).

    Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "Amazon Inspector" }
    - { id: b, text: "Amazon Macie" }
    - { id: c, text: "AWS CloudTrail" }
    - { id: d, text: "AWS Lake Formation" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Macie uses machine learning and pattern matching to discover sensitive data, such as PII and financial information, in Amazon S3. It produces sensitive data findings for the objects that contain such data, so the company can remove or mask it before fine-tuning."
    fr: "Amazon Macie utilise le machine learning et la correspondance de modèles pour découvrir des données sensibles, comme des PII et des informations financières, dans Amazon S3. Il produit des résultats de données sensibles pour les objets qui en contiennent, afin que l'entreprise puisse les supprimer ou les masquer avant le réglage précis."
  options:
    a:
      en: "Amazon Inspector scans workloads such as EC2 instances and container images for software vulnerabilities, not S3 objects for PII."
      fr: "Amazon Inspector analyse des charges de travail comme les instances EC2 et les images de conteneurs à la recherche de vulnérabilités logicielles, pas les objets S3 à la recherche de PII."
    c:
      en: "CloudTrail records API activity in the account; it does not inspect the content of objects."
      fr: "CloudTrail enregistre l'activité des API dans le compte ; il n'examine pas le contenu des objets."
    d:
      en: "Lake Formation controls fine-grained access to data lake data; it does not discover which objects contain PII."
      fr: "Lake Formation contrôle l'accès précis aux données d'un lac de données ; il ne découvre pas quels objets contiennent des PII."
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
