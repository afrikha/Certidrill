id: aifc01-3c-data-labeling-consistency
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company asked two teams to write the ideal responses for a fine-tuning dataset. One team wrote short bullet lists, and the other team wrote long paragraphs with a different tone. After fine-tuning, the model's response format is unpredictable.

    What should the company do to improve the next version of the dataset?
  fr: |
    Une compagnie d'assurance a demandé à deux équipes de rédiger les réponses idéales d'un jeu de données de réglage précis. Une équipe a écrit de courtes listes à puces, l'autre de longs paragraphes avec un ton différent. Après le réglage précis, le format des réponses du modèle est imprévisible.

    Que doit faire l'entreprise pour améliorer la prochaine version du jeu de données ?
body:
  options:
    - { id: a, text: { en: "Increase the number of epochs so that the model learns both styles.", fr: "Augmenter le nombre d'époques pour que le modèle apprenne les deux styles." } }
    - { id: b, text: { en: "Raise the temperature at inference so that the model picks a style.", fr: "Augmenter la température à l'inférence pour que le modèle choisisse un style." } }
    - { id: c, text: { en: "Remove the validation dataset so that more examples are used for training.", fr: "Supprimer le jeu de données de validation pour utiliser davantage d'exemples à l'entraînement." } }
    - { id: d, text: { en: "Write labeling guidelines and review samples so that responses are consistent.", fr: "Rédiger des consignes d'étiquetage et vérifier des échantillons pour que les réponses soient cohérentes." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Fine-tuning teaches the model to produce the expected output for each type of input, so the labels must be consistent. Shared labeling guidelines (format, length, tone) and a review of labeled samples give the model one clear target instead of two conflicting ones."
    fr: "Le réglage précis apprend au modèle à produire la sortie attendue pour chaque type d'entrée : les étiquettes doivent donc être cohérentes. Des consignes d'étiquetage communes (format, longueur, ton) et la vérification d'échantillons étiquetés donnent au modèle une cible claire au lieu de deux cibles contradictoires."
  options:
    a:
      en: "More epochs make the model fit the conflicting examples more closely; the inconsistency stays in the data."
      fr: "Plus d'époques font coller davantage le modèle aux exemples contradictoires ; l'incohérence reste dans les données."
    b:
      en: "A higher temperature makes the output more random, which makes the format even less predictable."
      fr: "Une température plus élevée rend la sortie plus aléatoire, ce qui rend le format encore moins prévisible."
    c:
      en: "The validation set measures the model on held-out data; removing it hides problems and does not fix inconsistent labels."
      fr: "Le jeu de validation mesure le modèle sur des données mises de côté ; le supprimer masque les problèmes et ne corrige pas des étiquettes incohérentes."
references:
  - title: Customize your model to improve its performance for your use case
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
