id: aifc01-3d-rouge-high-contradictions
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A publishing company evaluates FM-generated article summaries with ROUGE against editor-written reference summaries, and the scores are high. However, editors find that some summaries contradict themselves or contain claims that are not in the source article. The source article is included in each prompt.

    What should the company add to its evaluation to detect these problems?
  fr: |
    Une maison d'édition évalue avec ROUGE des résumés d'articles générés par un FM par rapport à des résumés de référence écrits par des rédacteurs, et les scores sont élevés. Pourtant, les rédacteurs constatent que certains résumés se contredisent ou contiennent des affirmations absentes de l'article source. L'article source figure dans chaque invite.

    Que doit ajouter l'entreprise à son évaluation pour détecter ces problèmes ?
body:
  options:
    - { id: a, text: { en: "A BLEU evaluation against the same reference summaries", fr: "Une évaluation BLEU par rapport aux mêmes résumés de référence" } }
    - { id: b, text: { en: "An LLM-as-a-judge evaluation with the Logical coherence and Faithfulness metrics", fr: "Une évaluation LLM-as-a-judge avec les métriques Logical coherence et Faithfulness" } }
    - { id: c, text: { en: "A ROUGE evaluation that uses more reference summaries per article", fr: "Une évaluation ROUGE qui utilise davantage de résumés de référence par article" } }
    - { id: d, text: { en: "A BERTScore evaluation against the same reference summaries", fr: "Une évaluation BERTScore par rapport aux mêmes résumés de référence" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Overlap and similarity metrics compare a summary with a reference; they do not check its internal logic or whether its claims come from the source. With an LLM as a judge, Logical coherence finds contradictions and logical gaps, and Faithfulness identifies information that is not found in the prompt, which contains the source article."
    fr: "Les métriques de recouvrement et de similarité comparent un résumé à une référence ; elles ne vérifient ni sa logique interne ni la provenance de ses affirmations. Avec un LLM comme juge, Logical coherence détecte les contradictions et les lacunes logiques, et Faithfulness repère les informations absentes de l'invite, qui contient l'article source."
  options:
    a:
      en: "BLEU is another n-gram overlap metric against the same references, so it has the same blind spots as ROUGE."
      fr: "BLEU est une autre métrique de recouvrement de n-grammes par rapport aux mêmes références : il a les mêmes angles morts que ROUGE."
    c:
      en: "More references make ROUGE more stable, but it still measures overlap, not contradictions or unsupported claims."
      fr: "Davantage de références rendent ROUGE plus stable, mais il mesure toujours un recouvrement, pas des contradictions ni des affirmations sans fondement."
    d:
      en: "BERTScore measures semantic similarity to the reference; a summary can be similar to it and still add a claim that is not in the article."
      fr: "BERTScore mesure la similarité sémantique avec la référence ; un résumé peut lui ressembler et ajouter tout de même une affirmation absente de l'article."
references:
  - title: Use metrics to understand model performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
