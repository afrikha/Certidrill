id: aifc01-3c-eval-benchmark-builtin
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup wants a quick, objective comparison of several foundation models (FMs) in Amazon Bedrock on general text generation. The startup has not created any prompt dataset of its own and wants to use standard, widely used datasets.

    Which approach will meet these requirements with the LEAST effort?
  fr: |
    Une start-up veut une comparaison rapide et objective de plusieurs modèles de fondation (FM) d'Amazon Bedrock pour la génération de texte générale. Elle n'a créé aucun jeu de données d'invites et veut utiliser des jeux de données standard et largement utilisés.

    Quelle approche répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Write 1,000 prompts and ask employees to rate each model's responses.", fr: "Rédiger 1 000 invites et demander à des employés de noter les réponses de chaque modèle." } }
    - { id: b, text: { en: "Fine-tune each model on the same data and compare the training loss.", fr: "Peaufiner chaque modèle sur les mêmes données et comparer la perte d'entraînement." } }
    - { id: c, text: { en: "Deploy each model to production and compare customer satisfaction.", fr: "Déployer chaque modèle en production et comparer la satisfaction des clients." } }
    - { id: d, text: { en: "Run automatic evaluation jobs that use the built-in benchmark datasets.", fr: "Exécuter des tâches d'évaluation automatique qui utilisent les jeux de données de référence intégrés." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Automatic model evaluation jobs can use built-in prompt datasets derived from open-source benchmarks, such as TREX, BOLD, WikiText2, and RealToxicityPrompts for general text generation. Amazon Bedrock recommends matching datasets for the task type, so the startup gets an objective comparison without creating data or recruiting evaluators."
    fr: "Les tâches d'évaluation automatique de modèle peuvent utiliser des jeux de données d'invites intégrés issus de bancs d'essai open source, comme TREX, BOLD, WikiText2 et RealToxicityPrompts pour la génération de texte générale. Amazon Bedrock recommande les jeux de données adaptés au type de tâche : la start-up obtient une comparaison objective sans créer de données ni recruter d'évaluateurs."
  options:
    a:
      en: "Writing prompts and organizing human ratings is far more effort, and the startup wants standard datasets."
      fr: "Rédiger des invites et organiser des notations humaines demande beaucoup plus d'effort, et la start-up veut des jeux de données standard."
    b:
      en: "Fine-tuning changes the models and costs time and money; training loss is not a standard comparison of the base models."
      fr: "Le réglage précis modifie les modèles et coûte du temps et de l'argent ; la perte d'entraînement n'est pas une comparaison standard des modèles de base."
    c:
      en: "Testing in production exposes customers to models that were not evaluated and is not a quick, objective benchmark."
      fr: "Tester en production expose les clients à des modèles non évalués et ne constitue pas un banc d'essai rapide et objectif."
references:
  - title: Use prompt datasets for model evaluation in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets.html
  - title: Model evaluation task types in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
