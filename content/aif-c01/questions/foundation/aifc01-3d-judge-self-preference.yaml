id: aifc01-3d-judge-self-preference
objective: "3.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank evaluates the responses of its FM-based assistant with LLM-as-a-judge. The same FM generates the responses and acts as the judge. On a sample of responses, the judge's scores are consistently higher than the ratings that human reviewers give.

    Which action will address the MOST likely cause of this gap?
  fr: |
    Une banque évalue les réponses de son assistant basé sur un FM avec LLM-as-a-judge. Le même FM génère les réponses et joue le rôle de juge. Sur un échantillon de réponses, les notes du juge sont systématiquement plus élevées que celles des relecteurs humains.

    Quelle action traitera la cause la PLUS probable de cet écart ?
body:
  options:
    - { id: a, text: { en: "Raise the temperature of the judge model so that its scores vary more.", fr: "Augmenter la température du modèle juge pour que ses notes varient davantage." } }
    - { id: b, text: { en: "Replace the judge with BLEU computed on the same responses.", fr: "Remplacer le juge par BLEU calculé sur les mêmes réponses." } }
    - { id: c, text: { en: "Use a judge model from another model family and validate its scores against human ratings.", fr: "Utiliser un modèle juge d'une autre famille de modèles et valider ses notes par rapport aux notes humaines." } }
    - { id: d, text: { en: "Ask the judge for scores from 1 to 100 instead of defined categories.", fr: "Demander au juge des notes de 1 à 100 au lieu de catégories définies." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A model that judges its own outputs tends to favor them (self-preference bias). AWS guidance recommends a judge from a different model family and validating the judge against human judgments, looking at the correlation of scores."
    fr: "Un modèle qui juge ses propres sorties a tendance à les favoriser (biais d'autopréférence, self-preference bias). Les recommandations AWS conseillent un juge d'une autre famille de modèles et la validation du juge par rapport aux jugements humains, en examinant la corrélation des notes."
  options:
    a:
      en: "A higher temperature makes the judge less consistent; it does not remove its bias toward its own outputs."
      fr: "Une température plus élevée rend le juge moins constant ; elle ne supprime pas son biais en faveur de ses propres sorties."
    b:
      en: "BLEU needs reference texts and is a translation metric; it cannot rate an assistant's responses the way the judge does."
      fr: "BLEU nécessite des textes de référence et c'est une métrique de traduction ; il ne peut pas noter les réponses d'un assistant comme le fait le juge."
    d:
      en: "AWS guidance recommends defined categories or yes-or-no questions with explanations; a wider numeric scale does not fix the bias."
      fr: "Les recommandations AWS conseillent des catégories définies ou des questions fermées avec explications ; une échelle numérique plus large ne corrige pas le biais."
references:
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
