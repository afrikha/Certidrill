id: aifc01-3d-lex-conversation-outcomes
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank uses an Amazon Lex V2 bot to let customers order a replacement card. The bank wants to see the share of conversations that end in success, that fail, or that customers drop, without building a custom solution.

    Which solution will meet this requirement?
  fr: |
    Une banque utilise un bot Amazon Lex V2 qui permet aux clients de commander une carte de remplacement. La banque veut voir la part des conversations qui aboutissent, qui échouent ou que les clients abandonnent, sans créer de solution personnalisée.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: "AWS Trusted Advisor" }
    - { id: b, text: { en: "Amazon Lex V2 Analytics", fr: "Analytics d'Amazon Lex V2" } }
    - { id: c, text: "AWS Config" }
    - { id: d, text: "Amazon Bedrock Guardrails" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Lex V2 Analytics measures the business performance of a bot with success and failure metrics and a conversation dashboard. A conversation is categorized as success, failed or dropped, which gives the share of conversations in which customers complete their task."
    fr: "Analytics d'Amazon Lex V2 mesure la performance métier d'un bot avec des métriques de réussite et d'échec et un tableau de bord des conversations. Une conversation est classée comme réussie (success), en échec (failed) ou abandonnée (dropped), ce qui donne la part des conversations dans lesquelles les clients accomplissent leur tâche."
  options:
    a:
      en: "Trusted Advisor gives best-practice recommendations about cost, security and resilience of AWS resources, not bot outcomes."
      fr: "Trusted Advisor donne des recommandations de bonnes pratiques sur le coût, la sécurité et la résilience des ressources AWS, pas sur les résultats d'un bot."
    c:
      en: "AWS Config records and evaluates resource configurations, not conversation outcomes."
      fr: "AWS Config enregistre et évalue les configurations des ressources, pas les résultats des conversations."
    d:
      en: "Bedrock Guardrails filters undesirable content in generative AI applications; it does not report conversation outcomes."
      fr: "Bedrock Guardrails filtre les contenus indésirables des applications d'IA générative ; il ne rend pas compte des résultats des conversations."
references:
  - title: Measuring business performance with Analytics
    url: https://docs.aws.amazon.com/lexv2/latest/dg/analytics.html
  - title: Key definitions
    url: https://docs.aws.amazon.com/lexv2/latest/dg/analytics-key-definitions.html
