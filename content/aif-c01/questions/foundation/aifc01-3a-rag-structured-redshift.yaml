    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-build-structured.html
  - title: Set up your query engine and permissions for creating a knowledge base with structured data store
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-prereq-structured.html
