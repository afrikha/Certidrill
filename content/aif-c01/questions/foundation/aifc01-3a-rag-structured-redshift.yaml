id: aifc01-3a-rag-structured-redshift
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company stores its sales data in tables in an Amazon Redshift data warehouse. Business users want to ask questions in natural language, such as which store had the highest sales last quarter, without writing SQL. The company wants a managed solution on Amazon Bedrock.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution stocke ses données de ventes dans des tables d'un entrepôt de données Amazon Redshift. Les utilisateurs métier veulent poser des questions en langage naturel, par exemple quel magasin a réalisé les ventes les plus élevées au dernier trimestre, sans écrire de SQL. L'entreprise veut une solution gérée sur Amazon Bedrock.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Export the tables as text files to Amazon S3 every night, and fine-tune a foundation model on the files.", fr: "Exporter chaque nuit les tables sous forme de fichiers texte vers Amazon S3, et peaufiner un modèle de fondation sur ces fichiers." } }
    - { id: b, text: { en: "Create an Amazon Bedrock knowledge base that connects to the structured data store, with Amazon Redshift as the query engine.", fr: "Créer une base de connaissances Amazon Bedrock connectée au magasin de données structurées, avec Amazon Redshift comme moteur de requête." } }
    - { id: c, text: { en: "Convert every table row into an embedding in Amazon OpenSearch Serverless, and run a semantic search for each question.", fr: "Convertir chaque ligne de table en intégration dans Amazon OpenSearch Serverless, et exécuter une recherche sémantique pour chaque question." } }
    - { id: d, text: { en: "Enable prompt caching, and include the content of all the tables in the prompt of every question.", fr: "Activer la mise en cache des invites, et inclure le contenu de toutes les tables dans l'invite de chaque question." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Bedrock Knowledge Bases can connect to structured data stores such as Amazon Redshift. It converts the user's natural language question into a SQL query, runs it with Amazon Redshift as the query engine, and uses the results to generate the answer, so the data is used where it is, without conversion and without users writing SQL."
    fr: "Amazon Bedrock Knowledge Bases peut se connecter à des magasins de données structurées comme Amazon Redshift. Le service convertit la question en langage naturel de l'utilisateur en requête SQL, l'exécute avec Amazon Redshift comme moteur de requête et utilise les résultats pour générer la réponse : les données sont donc utilisées là où elles se trouvent, sans conversion et sans que les utilisateurs écrivent de SQL."
  options:
    a:
      en: "Fine-tuning does not make a model compute exact aggregates over changing data, and nightly training is costly and always out of date."
      fr: "Le réglage précis ne permet pas à un modèle de calculer des agrégats exacts sur des données qui changent, et un entraînement chaque nuit est coûteux et toujours en retard."
    c:
      en: "Semantic search returns similar rows; it does not compute totals or rankings such as the highest sales of a quarter."
      fr: "La recherche sémantique renvoie des lignes similaires ; elle ne calcule pas de totaux ni de classements comme les ventes les plus élevées d'un trimestre."
    d:
      en: "A whole data warehouse does not fit in a prompt, and the model would still have to compute the aggregates itself."
      fr: "Un entrepôt de données entier ne tient pas dans une invite, et le modèle devrait toujours calculer lui-même les agrégats."
references:
