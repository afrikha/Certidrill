id: aifc01-3a-rag-sync
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company added 200 new documents to the Amazon S3 bucket that is the data source of its Amazon Bedrock knowledge base. No sync schedule is configured for the data source. A day later, the assistant that uses the knowledge base still cannot answer questions about the new documents.

    What should the company do?
  fr: |
    Une entreprise a ajouté 200 nouveaux documents au compartiment Amazon S3 qui est la source de données de sa base de connaissances Amazon Bedrock. Aucune planification de synchronisation n'est configurée pour la source de données. Un jour plus tard, l'assistant qui utilise la base de connaissances ne peut toujours pas répondre aux questions sur les nouveaux documents.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Increase the maximum tokens value of the foundation model.", fr: "Augmenter le nombre maximal de jetons du modèle de fondation." } }
    - { id: b, text: { en: "Fine-tune the embeddings model on the new documents.", fr: "Peaufiner le modèle d'intégration sur les nouveaux documents." } }
    - { id: c, text: { en: "Switch to a foundation model with a larger context window.", fr: "Passer à un modèle de fondation qui a une plus grande fenêtre contextuelle." } }
    - { id: d, text: { en: "Sync the data source of the knowledge base.", fr: "Synchroniser la source de données de la base de connaissances." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Each time files are added, modified, or removed in a data source, the data source must be synced so that the knowledge base re-indexes them. Syncing is incremental: Amazon Bedrock parses, chunks, embeds, and indexes only the documents that changed since the last sync, after which the new content can be retrieved."
    fr: "Chaque fois que des fichiers sont ajoutés, modifiés ou supprimés dans une source de données, celle-ci doit être synchronisée pour que la base de connaissances les réindexe. La synchronisation est incrémentielle : Amazon Bedrock analyse, découpe, vectorise et indexe uniquement les documents modifiés depuis la dernière synchronisation, après quoi le nouveau contenu peut être récupéré."
  options:
    a:
      en: "The maximum tokens value limits the length of the answer; the new documents are still missing from the vector index."
      fr: "Le nombre maximal de jetons limite la longueur de la réponse ; les nouveaux documents restent absents de l'index vectoriel."
    b:
      en: "The embeddings model does not need training to embed new documents; the documents have simply not been ingested yet."
      fr: "Le modèle d'intégration n'a pas besoin d'entraînement pour vectoriser de nouveaux documents ; les documents n'ont simplement pas encore été ingérés."
    c:
      en: "A larger context window does not help when the relevant passages are never retrieved from the knowledge base."
      fr: "Une plus grande fenêtre contextuelle n'aide pas quand les passages pertinents ne sont jamais récupérés dans la base de connaissances."
references:
  - title: Sync your data with your Amazon Bedrock knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-ingest.html
