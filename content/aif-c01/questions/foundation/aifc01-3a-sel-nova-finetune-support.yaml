id: aifc01-3a-sel-nova-finetune-support
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants to fine-tune an Amazon Nova model with its own labeled examples. The model must summarize reports that contain text and chart images. The company will run the resulting custom model with Provisioned Throughput.

    Which model should the company choose?
  fr: |
    Une entreprise veut peaufiner (fine-tuning) un modèle Amazon Nova avec ses propres exemples étiquetés. Le modèle doit résumer des rapports qui contiennent du texte et des images de graphiques. L'entreprise exécutera le modèle personnalisé obtenu avec du Provisioned Throughput.

    Quel modèle l'entreprise doit-elle choisir ?
body:
  options:
    - { id: a, text: "Amazon Nova Premier" }
    - { id: b, text: "Amazon Nova Micro" }
    - { id: c, text: "Amazon Nova Canvas" }
    - { id: d, text: "Amazon Nova Pro" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Nova Pro accepts text, image, and video input and returns text, so it can summarize reports that include chart images. It also supports fine-tuning in Amazon Bedrock and Provisioned Throughput. Customization support is a selection criterion: not every model of a family can be fine-tuned."
    fr: "Amazon Nova Pro accepte du texte, des images et des vidéos en entrée et renvoie du texte : il peut donc résumer des rapports qui contiennent des images de graphiques. Il prend aussi en charge le peaufinage dans Amazon Bedrock et le Provisioned Throughput. La prise en charge de la personnalisation est un critère de sélection : tous les modèles d'une famille ne peuvent pas être peaufinés."
  options:
    a:
      en: "Nova Premier is multimodal, but it does not support fine-tuning or Provisioned Throughput."
      fr: "Nova Premier est multimodal, mais il ne prend en charge ni le peaufinage ni le Provisioned Throughput."
    b:
      en: "Nova Micro can be fine-tuned, but it accepts only text input, so it cannot read the chart images."
      fr: "Nova Micro peut être peaufiné, mais il n'accepte que du texte en entrée : il ne peut donc pas lire les images de graphiques."
    c:
      en: "Nova Canvas can be fine-tuned, but it generates images; it does not produce text summaries."
      fr: "Nova Canvas peut être peaufiné, mais il génère des images ; il ne produit pas de résumés textuels."
references:
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
  - title: Customize a model with fine-tuning in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-model-fine-tuning.html
