id: aifc01-3a-rag-order-runtime
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A user asks a question to an assistant that uses Retrieval Augmented Generation (RAG) with an Amazon Bedrock knowledge base. The documents were ingested earlier.

    Which four steps happen, in order, to produce the answer? To answer, select the correct steps from the following list and place them in the correct order. Each step should be selected one time or not at all.
  fr: |
    Un utilisateur pose une question à un assistant qui utilise la génération à enrichissement contextuel (RAG) avec une base de connaissances Amazon Bedrock. Les documents ont été ingérés auparavant.

    Quelles sont les quatre étapes qui ont lieu, dans l'ordre, pour produire la réponse ? Pour répondre, sélectionnez les étapes appropriées dans la liste suivante et placez-les dans le bon ordre. Chaque étape peut être sélectionnée une fois ou pas du tout.
body:
  count: 4
  actions:
    - { id: search, text: { en: "Search the vector index for chunks that are similar to the question vector.", fr: "Rechercher dans l'index vectoriel les fragments similaires au vecteur de la question." } }
    - { id: weights, text: { en: "Update the weights of the foundation model with the retrieved chunks.", fr: "Mettre à jour les pondérations du modèle de fondation avec les fragments récupérés." } }
    - { id: gen, text: { en: "Send the augmented prompt to the foundation model to generate the response.", fr: "Envoyer l'invite enrichie au modèle de fondation pour générer la réponse." } }
    - { id: qvec, text: { en: "Convert the question into a vector by using the embeddings model.", fr: "Convertir la question en vecteur à l'aide du modèle d'intégration." } }
    - { id: split, text: { en: "Split the source documents into chunks of about 300 tokens.", fr: "Découper les documents sources en fragments d'environ 300 jetons." } }
    - { id: augment, text: { en: "Add the retrieved chunks to the prompt as context.", fr: "Ajouter les fragments récupérés à l'invite comme contexte." } }
answer:
  sequence: [ qvec, search, augment, gen ]
explanation:
  correct:
    en: "At query time, the embeddings model converts the question into a vector. The vector index is queried for chunks that are semantically similar to that vector. The prompt is augmented with the retrieved chunks, and the augmented prompt is sent to the foundation model, which generates the response."
    fr: "Au moment de la requête, le modèle d'intégration convertit la question en vecteur. L'index vectoriel est interrogé pour trouver les fragments sémantiquement similaires à ce vecteur. L'invite est enrichie avec les fragments récupérés, puis l'invite enrichie est envoyée au modèle de fondation, qui génère la réponse."
  options:
    weights:
      en: "RAG does not change the model weights; the retrieved chunks are only added to the prompt."
      fr: "Le RAG ne modifie pas les pondérations du modèle ; les fragments récupérés sont seulement ajoutés à l'invite."
    split:
      en: "Chunking the documents is an ingestion step that happened before the question was asked."
      fr: "Le découpage des documents est une étape d'ingestion qui a eu lieu avant que la question soit posée."
references:
  - title: How Amazon Bedrock knowledge bases work
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
