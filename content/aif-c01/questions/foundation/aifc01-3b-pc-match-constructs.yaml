id: aifc01-3b-pc-match-constructs
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    An HR department writes a prompt for a foundation model. The prompt contains the following sentences.

    Match each sentence with the prompt construct that it represents. To answer, drag the appropriate constructs to the correct sentences. Each construct may be used once or not at all.
  fr: |
    Un service RH rédige une invite pour un modèle de fondation. L'invite contient les phrases suivantes.

    Associez chaque phrase à la construction d'invite qu'elle représente. Pour répondre, faites glisser les constructions appropriées vers les phrases correspondantes. Chaque construction peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: role, text: { en: "Role (persona)", fr: "Rôle (persona)" } }
    - { id: ctx, text: { en: "Context", fr: "Contexte" } }
    - { id: ins, text: { en: "Instruction", fr: "Instruction" } }
    - { id: neg, text: { en: "Negative prompt", fr: "Invite négative" } }
    - { id: out, text: { en: "Output indicator", fr: "Indicateur de sortie" } }
    - { id: shot, text: { en: "Few-shot example", fr: "Exemple few-shot" } }
  targets:
    - { id: t1, text: { en: "\"Our company has 2,000 employees in France and Belgium.\"", fr: "« Notre entreprise compte 2 000 salariés en France et en Belgique. »" } }
    - { id: t2, text: { en: "\"Write a reminder email about the annual performance review.\"", fr: "« Rédige un e-mail de rappel sur l'entretien annuel d'évaluation. »" } }
    - { id: t3, text: { en: "\"Do not mention salaries or bonuses.\"", fr: "« Ne mentionne ni les salaires ni les primes. »" } }
    - { id: t4, text: { en: "\"Return only the email body, as plain text, in under 120 words.\"", fr: "« Renvoie uniquement le corps de l'e-mail, en texte brut, en moins de 120 mots. »" } }
    - { id: t5, text: { en: "\"You are an experienced HR communication specialist.\"", fr: "« Tu es un spécialiste expérimenté de la communication RH. »" } }
answer:
  mapping: { t1: ctx, t2: ins, t3: neg, t4: out, t5: role }
explanation:
  correct:
    en: |
      The number and location of employees is background information: context. "Write a reminder email" states the task: the instruction. "Do not mention salaries" says what to exclude: a negative prompt. The required format and length of the answer is the output indicator. "You are an experienced specialist" gives the model a role. The prompt contains no example of input and expected output, so no sentence is a few-shot example.
    fr: |
      Le nombre et la localisation des salariés sont des informations de fond : le contexte. « Rédige un e-mail de rappel » énonce la tâche : l'instruction. « Ne mentionne ni les salaires » indique ce qu'il faut exclure : une invite négative. Le format et la longueur attendus de la réponse constituent l'indicateur de sortie. « Tu es un spécialiste expérimenté » donne un rôle au modèle. L'invite ne contient aucun exemple d'entrée et de sortie attendue : aucune phrase n'est un exemple few-shot.
references:
  - title: Prompt engineering concepts
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
  - title: Using the system role
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-system-role.html
