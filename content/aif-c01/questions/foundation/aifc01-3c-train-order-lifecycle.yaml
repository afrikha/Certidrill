id: aifc01-3c-train-order-lifecycle
objective: "3.3.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A model provider builds a foundation model (FM) and then adapts it into an assistant for a specific task.

    Select and order the FOUR steps of this process from the following list. Each step should be selected one time or not at all.
  fr: |
    Un fournisseur de modèles construit un modèle de fondation (FM), puis l'adapte en assistant pour une tâche précise.

    Sélectionnez les QUATRE étapes de ce processus dans la liste suivante et classez-les dans l'ordre. Chaque étape doit être sélectionnée une fois ou pas du tout.
body:
  count: 4
  actions:
    - { id: eval, text: { en: "Evaluate the adapted model against the task requirements.", fr: "Évaluer le modèle adapté par rapport aux exigences de la tâche." } }
    - { id: pre, text: { en: "Pre-train the model on a massive unlabeled corpus.", fr: "Préentraîner le modèle sur un immense corpus non étiqueté." } }
    - { id: label, text: { en: "Have humans label every document of the pre-training corpus.", fr: "Faire étiqueter par des humains chaque document du corpus de préentraînement." } }
    - { id: deploy, text: { en: "Deploy the model and run inference for users.", fr: "Déployer le modèle et exécuter l'inférence pour les utilisateurs." } }
    - { id: ft, text: { en: "Fine-tune the model on labeled task examples.", fr: "Peaufiner le modèle sur des exemples étiquetés de la tâche." } }
    - { id: temp, text: { en: "Raise the temperature to update the model weights.", fr: "Augmenter la température pour mettre à jour les pondérations du modèle." } }
answer:
  sequence: [ pre, ft, eval, deploy ]
explanation:
  correct:
    en: "The FM is first pre-trained on a massive unlabeled corpus, then fine-tuned on a smaller set of labeled task examples. The adapted model is evaluated against the requirements before it is deployed for inference."
    fr: "Le FM est d'abord préentraîné sur un immense corpus non étiqueté, puis peaufiné sur un ensemble plus petit d'exemples étiquetés de la tâche. Le modèle adapté est évalué par rapport aux exigences avant d'être déployé pour l'inférence."
  options:
    label:
      en: "Pre-training is self-supervised: nobody labels the pre-training corpus."
      fr: "Le préentraînement est autosupervisé : personne n'étiquette le corpus de préentraînement."
    temp:
      en: "Temperature is an inference parameter that controls randomness; it never changes the weights."
      fr: "La température est un paramètre d'inférence qui contrôle le caractère aléatoire ; elle ne modifie jamais les pondérations."
references:
  - title: What are Foundation Models? - Foundation Models in Generative AI Explained - AWS
    url: https://aws.amazon.com/what-is/foundation-models/
  - title: Foundation models and hyperparameters for fine-tuning
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html
