id: aifc01-3b-pc-output-format
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company uses a foundation model to extract the product name, size, and color from customer messages. A downstream application parses the result, but the model returns free-form sentences in a different structure each time.

    Which prompt change will MOST directly solve this problem?
  fr: |
    Une entreprise de commerce en ligne utilise un modèle de fondation pour extraire le nom du produit, la taille et la couleur des messages des clients. Une application en aval analyse le résultat, mais le modèle renvoie des phrases libres dont la structure change à chaque fois.

    Quelle modification de l'invite résout le PLUS directement ce problème ?
body:
  options:
    - { id: a, text: { en: "Specify that the output must be JSON with the keys name, size, and color", fr: "Préciser que la sortie doit être du JSON avec les clés name, size et color" } }
    - { id: b, text: { en: "Add background information about the company's product catalog", fr: "Ajouter des informations de fond sur le catalogue de produits de l'entreprise" } }
    - { id: c, text: { en: "Increase the maximum length so that the model can write complete sentences", fr: "Augmenter la longueur maximale pour que le modèle puisse écrire des phrases complètes" } }
    - { id: d, text: { en: "Ask the model to explain its reasoning step by step before answering", fr: "Demander au modèle d'expliquer son raisonnement étape par étape avant de répondre" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Stating the output format (an output indicator) tells the model exactly how to structure its answer. Requiring JSON with named keys makes the response consistent and easy for the application to parse."
    fr: "Indiquer le format de sortie (un indicateur de sortie) dit au modèle exactement comment structurer sa réponse. Exiger du JSON avec des clés nommées rend la réponse cohérente et facile à analyser pour l'application."
  options:
    b:
      en: "More context can improve relevance, but it does not define the structure of the output."
      fr: "Davantage de contexte peut améliorer la pertinence, mais ne définit pas la structure de la sortie."
    c:
      en: "Maximum length only caps the number of generated tokens; it does not impose a structure."
      fr: "La longueur maximale plafonne seulement le nombre de jetons générés ; elle n'impose pas de structure."
    d:
      en: "Step-by-step reasoning adds text before the answer and helps with complex reasoning, not with a fixed output structure."
      fr: "Un raisonnement étape par étape ajoute du texte avant la réponse et aide pour le raisonnement complexe, pas pour une structure de sortie fixe."
references:
  - title: Creating precise prompts
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-precision.html
