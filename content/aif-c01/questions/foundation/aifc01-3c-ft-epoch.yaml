id: aifc01-3c-ft-epoch
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team is fine-tuning a foundation model (FM) in Amazon SageMaker JumpStart. The team wants the training job to go through the complete fine-tuning dataset three times.

    Which hyperparameter should the team set?
  fr: |
    Une équipe peaufine un modèle de fondation (FM) dans Amazon SageMaker JumpStart. Elle veut que la tâche d'entraînement parcoure trois fois l'ensemble du jeu de données de peaufinage.

    Quel hyperparamètre l'équipe doit-elle définir ?
body:
  options:
    - { id: a, text: "epoch" }
    - { id: b, text: "learning_rate" }
    - { id: c, text: "per_device_train_batch_size" }
    - { id: d, text: "max_input_length" }
answer: { optionId: a }
explanation:
  correct:
    en: "The epoch hyperparameter sets the number of passes that the fine-tuning algorithm takes through the training dataset. Setting it to 3 makes the job go through the complete dataset three times."
    fr: "L'hyperparamètre epoch définit le nombre de passages que l'algorithme de peaufinage effectue sur le jeu de données d'entraînement. Le définir sur 3 fait parcourir trois fois l'ensemble du jeu de données."
  options:
    b:
      en: "learning_rate controls how much the weights are updated after each batch, not how many passes are made."
      fr: "learning_rate contrôle l'ampleur de la mise à jour des pondérations après chaque lot, pas le nombre de passages."
    c:
      en: "per_device_train_batch_size sets how many examples are processed together on each GPU core or CPU."
      fr: "per_device_train_batch_size définit le nombre d'exemples traités ensemble sur chaque cœur GPU ou processeur."
    d:
      en: "max_input_length truncates tokenized input sequences that are longer than the given length."
      fr: "max_input_length tronque les séquences d'entrée tokenisées plus longues que la longueur indiquée."
references:
  - title: Foundation models and hyperparameters for fine-tuning
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html
