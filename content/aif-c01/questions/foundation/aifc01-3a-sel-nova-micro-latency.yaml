id: aifc01-3a-sel-nova-micro-latency
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A support team wants to classify short customer emails into five categories. The emails contain only text, with no images or video. The application must return each result with the lowest possible latency and at very low cost.

    Which Amazon Nova model is MOST suitable?
  fr: |
    Une équipe de support veut classer de courts e-mails de clients dans cinq catégories. Les e-mails ne contiennent que du texte, sans images ni vidéos. L'application doit renvoyer chaque résultat avec la latence la plus faible possible et à très faible coût.

    Quel modèle Amazon Nova est le PLUS adapté ?
body:
  options:
    - { id: a, text: "Amazon Nova Premier" }
    - { id: b, text: "Amazon Nova Micro" }
    - { id: c, text: "Amazon Nova Canvas" }
    - { id: d, text: "Amazon Nova Lite" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Nova Micro is a text-only model that AWS positions for the lowest latency responses at very low cost. Short text classification needs neither image nor video input, so the smallest text model meets the requirement without paying for capabilities that the task does not use."
    fr: "Amazon Nova Micro est un modèle texte uniquement qu'AWS présente comme celui qui offre les réponses à la latence la plus faible, à très faible coût. La classification de textes courts n'a besoin ni d'images ni de vidéos en entrée : le plus petit modèle texte répond donc à l'exigence sans payer des capacités que la tâche n'utilise pas."
  options:
    a:
      en: "Nova Premier is the most capable model for complex tasks; it is larger and does not target the lowest latency and cost."
      fr: "Nova Premier est le modèle le plus performant pour les tâches complexes ; il est plus grand et ne vise pas la latence et le coût les plus faibles."
    c:
      en: "Nova Canvas generates images from text and images; it does not classify text into categories."
      fr: "Nova Canvas génère des images à partir de texte et d'images ; il ne classe pas du texte en catégories."
    d:
      en: "Nova Lite is a very low-cost multimodal model, but its image and video support is not needed here, and Nova Micro is the model positioned for the lowest latency."
      fr: "Nova Lite est un modèle multimodal à très faible coût, mais sa prise en charge des images et des vidéos est inutile ici, et c'est Nova Micro qui est présenté comme le modèle à la latence la plus faible."
references:
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
