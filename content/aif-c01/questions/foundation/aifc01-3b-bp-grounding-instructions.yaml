id: aifc01-3b-bp-grounding-instructions
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An energy company's assistant sends the user's question and several reference documents to a foundation model in one prompt. The assistant sometimes adds facts that do not appear in the reference documents.

    Which two prompt changes will reduce this behavior? (Choose two.)
  fr: |
    L'assistant d'une entreprise d'énergie envoie à un modèle de fondation, dans une même invite, la question de l'utilisateur et plusieurs documents de référence. L'assistant ajoute parfois des faits qui ne figurent pas dans les documents de référence.

    Quelles sont les deux modifications de l'invite qui réduiront ce comportement ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Instruct the model explicitly not to use information that is not in the reference texts", fr: "Demander explicitement au modèle de ne pas utiliser d'informations absentes des textes de référence" } }
    - { id: b, text: { en: "Remove the reference documents so that the prompt is shorter", fr: "Supprimer les documents de référence pour raccourcir l'invite" } }
    - { id: c, text: { en: "Ask the model to add helpful background facts from its general knowledge", fr: "Demander au modèle d'ajouter des faits de contexte utiles tirés de ses connaissances générales" } }
    - { id: d, text: { en: "Add few-shot examples whose answers include facts from outside the documents", fr: "Ajouter des exemples few-shot dont les réponses contiennent des faits extérieurs aux documents" } }
    - { id: e, text: { en: "Mark the reference documents with clear labels that separate them from the question", fr: "Signaler les documents de référence par des libellés clairs qui les séparent de la question" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "AWS recommends grounding the response in the supplied text with an explicit instruction such as \"DO NOT USE INFORMATION THAT IS NOT IN REFERENCE TEXTS!\". Labeling the reference texts (for example \"Resource: Search Results:\") separates them from the question, so the model knows which content to rely on."
    fr: "AWS recommande d'ancrer la réponse dans le texte fourni avec une instruction explicite comme « DO NOT USE INFORMATION THAT IS NOT IN REFERENCE TEXTS! ». Libeller les textes de référence (par exemple « Resource: Search Results: ») les sépare de la question : le modèle sait sur quel contenu s'appuyer."
  options:
    b:
      en: "Without the reference documents, the model can rely only on its training data, which increases hallucinations."
      fr: "Sans les documents de référence, le modèle ne peut s'appuyer que sur ses données d'entraînement, ce qui augmente les hallucinations."
    c:
      en: "Asking for outside facts encourages exactly the behavior the company wants to stop."
      fr: "Demander des faits extérieurs encourage précisément le comportement que l'entreprise veut faire cesser."
    d:
      en: "Examples that use outside facts teach the model to do the same."
      fr: "Des exemples qui utilisent des faits extérieurs apprennent au modèle à faire de même."
references:
  - title: Provide supporting text
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-support-text.html
