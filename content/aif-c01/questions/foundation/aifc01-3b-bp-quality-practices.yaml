id: aifc01-3b-bp-quality-practices
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A human resources team uses a foundation model to draft job descriptions. The team wants to follow prompt engineering best practices to improve the quality of the drafts.

    Which two practices should the team follow? (Choose two.)
  fr: |
    Une équipe des ressources humaines utilise un modèle de fondation pour rédiger des descriptions de poste. L'équipe veut suivre les bonnes pratiques d'ingénierie de requête pour améliorer la qualité des brouillons.

    Quelles sont les deux pratiques que l'équipe doit suivre ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Describe the role, the team, and the target candidates as context", fr: "Décrire le poste, l'équipe et les candidats ciblés comme contexte" } }
    - { id: b, text: { en: "Combine several unrelated tasks, such as salary analysis and translation, in the same prompt", fr: "Combiner plusieurs tâches sans rapport, comme une analyse des salaires et une traduction, dans la même invite" } }
    - { id: c, text: { en: "Use ambiguous wording so that the model chooses the structure", fr: "Employer une formulation ambiguë pour que le modèle choisisse la structure" } }
    - { id: d, text: { en: "Specify the sections, the length, and the format of the description", fr: "Préciser les sections, la longueur et le format de la description" } }
    - { id: e, text: { en: "Paste every past job description into each prompt", fr: "Coller toutes les anciennes descriptions de poste dans chaque invite" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Adequate context (who the role is for, the team, the audience) and explicit output requirements (sections, length, format) are core best practices. They make the request unambiguous, so the model returns relevant, consistent drafts."
    fr: "Un contexte suffisant (à qui s'adresse le poste, l'équipe, le public) et des exigences de sortie explicites (sections, longueur, format) sont des bonnes pratiques essentielles. Elles rendent la demande non ambiguë : le modèle renvoie des brouillons pertinents et cohérents."
  options:
    b:
      en: "Mixing unrelated tasks makes the prompt complex and confusing; separate prompts keep each task clear."
      fr: "Mélanger des tâches sans rapport rend l'invite complexe et confuse ; des invites séparées gardent chaque tâche claire."
    c:
      en: "Ambiguous prompts force the model to guess and lead to inconsistent results."
      fr: "Une invite ambiguë oblige le modèle à deviner et conduit à des résultats incohérents."
    e:
      en: "Pasting every past description wastes input tokens and can exceed the context window; a few relevant examples are enough."
      fr: "Coller toutes les anciennes descriptions gaspille des jetons d'entrée et peut dépasser la fenêtre de contexte ; quelques exemples pertinents suffisent."
references:
  - title: What is Prompt Engineering?
    url: https://aws.amazon.com/what-is/prompt-engineering/
  - title: Creating precise prompts
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-precision.html
