id: aifc01-3b-agent-define-multistep
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company wants an assistant that receives a request such as "Move my trip to next Friday." The assistant must break the request into steps, check availability in the booking system, change the reservation through an API, and confirm the change to the customer.

    Which type of solution will meet these requirements?
  fr: |
    Une agence de voyages veut un assistant qui reçoit une demande comme « Décale mon voyage à vendredi prochain ». L'assistant doit décomposer la demande en étapes, vérifier les disponibilités dans le système de réservation, modifier la réservation par une API et confirmer le changement au client.

    Quel type de solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A prompt template that formats the customer's request for a foundation model", fr: "Un modèle d'invite qui met en forme la demande du client pour un modèle de fondation" } }
    - { id: b, text: { en: "A fine-tuned foundation model trained on past booking conversations", fr: "Un modèle de fondation peaufiné sur d'anciennes conversations de réservation" } }
    - { id: c, text: { en: "An AI agent that plans the steps and acts through tool and API calls", fr: "Un agent d'IA qui planifie les étapes et agit par des appels d'outils et d'API" } }
    - { id: d, text: { en: "A classification model that assigns each request to a booking category", fr: "Un modèle de classification qui affecte chaque demande à une catégorie de réservation" } }
answer: { optionId: c }
explanation:
  correct:
    en: "An AI agent uses a foundation model to reason about a goal, breaks it into smaller tasks, and acts by calling tools and APIs, then checks the result against the goal. Planning, calling the booking API, and confirming the outcome is exactly this autonomous, multi-step behavior."
    fr: "Un agent d'IA utilise un modèle de fondation pour raisonner sur un objectif, le décompose en tâches plus petites et agit en appelant des outils et des API, puis vérifie le résultat par rapport à l'objectif. Planifier, appeler l'API de réservation et confirmer le résultat correspond exactement à ce comportement autonome en plusieurs étapes."
  options:
    a:
      en: "A prompt template only structures the text sent to a model; it cannot call the booking system or change a reservation."
      fr: "Un modèle d'invite structure seulement le texte envoyé à un modèle ; il ne peut ni appeler le système de réservation ni modifier une réservation."
    b:
      en: "Fine-tuning changes how a model writes or what it knows, but a model alone does not take actions in external systems."
      fr: "Le réglage précis change la manière dont un modèle écrit ou ce qu'il sait, mais un modèle seul n'agit pas dans des systèmes externes."
    d:
      en: "A classification model only predicts a label for each request; it does not plan or perform the change."
      fr: "Un modèle de classification prédit seulement une étiquette pour chaque demande ; il ne planifie pas et n'effectue pas le changement."
references:
  - title: What are AI Agents?
    url: https://aws.amazon.com/what-is/ai-agents/
