id: aifc01-3d-rouge-summaries
objective: "3.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A news company uses an FM to summarize articles. Editors have written reference summaries for 500 articles. The company wants an automatic, recall-oriented metric that measures how much of the wording of the reference summaries appears in the generated summaries.

    Which metric should the company use?
  fr: |
    Un groupe de presse utilise un FM pour résumer des articles. Des rédacteurs ont écrit des résumés de référence pour 500 articles. L'entreprise veut une métrique automatique orientée rappel, qui mesure dans quelle proportion la formulation des résumés de référence se retrouve dans les résumés générés.

    Quelle métrique l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "ROUGE" }
    - { id: b, text: "BLEU" }
    - { id: c, text: { en: "Word error rate", fr: "Taux d'erreur sur les mots (word error rate)" } }
    - { id: d, text: { en: "Classification accuracy", fr: "Exactitude de classification (classification accuracy)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "ROUGE (Recall-Oriented Understudy for Gisting Evaluation) measures the n-gram overlap between the generated text and the reference text, with a focus on recall. It is typically used for summarization; its limitation is that it misses semantic similarity and penalizes valid rephrasing."
    fr: "ROUGE (Recall-Oriented Understudy for Gisting Evaluation) mesure le recouvrement de n-grammes entre le texte généré et le texte de référence, en mettant l'accent sur le rappel. Il s'utilise typiquement pour le résumé ; sa limite est qu'il ignore la similarité sémantique et pénalise les reformulations valides."
  options:
    b:
      en: "BLEU is precision-oriented and is the typical metric for machine translation, not the recall-oriented summarization metric."
      fr: "BLEU est orienté précision et c'est la métrique typique de la traduction automatique, pas la métrique de résumé orientée rappel."
    c:
      en: "Word error rate counts word-level differences between two texts; Amazon Bedrock uses it to measure robustness to perturbed prompts, not summary quality against references."
      fr: "Le taux d'erreur sur les mots compte les différences mot à mot entre deux textes ; Amazon Bedrock l'utilise pour mesurer la robustesse face à des invites perturbées, pas la qualité d'un résumé par rapport à des références."
    d:
      en: "Classification accuracy applies to predicted labels, not to generated summaries."
      fr: "L'exactitude de classification s'applique à des étiquettes prédites, pas à des résumés générés."
references:
  - title: Evaluating quality and reliability in generated outputs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
  - title: Review metrics for an automated model evaluation job in Amazon Bedrock (console)
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-report-programmatic.html
