id: aifc01-3c-data-databrew
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A business analyst must clean a raw dataset before it is used to fine-tune a model. The analyst needs to remove null values, fix inconsistent formats, and preview the changes on a sample. The analyst does not write code.

    Which AWS service will meet these requirements?
  fr: |
    Un analyste métier doit nettoyer un jeu de données brut avant qu'il soit utilisé pour peaufiner un modèle. Il doit supprimer les valeurs nulles, corriger des formats incohérents et prévisualiser les changements sur un échantillon. L'analyste n'écrit pas de code.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon EMR" }
    - { id: b, text: "AWS Glue DataBrew" }
    - { id: c, text: "AWS Lambda" }
    - { id: d, text: "Amazon Redshift" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Glue DataBrew is a visual data preparation tool for cleaning and normalizing data without writing code. It offers more than 250 point-and-click transformations, such as removing nulls and converting data to standard formats, and shows before-and-after previews on a sample before the recipe runs on the full dataset."
    fr: "AWS Glue DataBrew est un outil visuel de préparation des données qui permet de nettoyer et de normaliser des données sans écrire de code. Il propose plus de 250 transformations en pointer-cliquer, comme la suppression des valeurs nulles et la conversion vers des formats standard, et affiche des aperçus avant-après sur un échantillon avant d'appliquer la recette au jeu de données complet."
  options:
    a:
      en: "Amazon EMR runs big data frameworks such as Apache Spark on clusters; data preparation there means writing jobs."
      fr: "Amazon EMR exécute des frameworks de big data comme Apache Spark sur des clusters ; y préparer des données signifie écrire des tâches."
    c:
      en: "Lambda runs code that you write; it has no visual transformations for an analyst."
      fr: "Lambda exécute du code que vous écrivez ; il n'offre pas de transformations visuelles pour un analyste."
    d:
      en: "Amazon Redshift is a data warehouse queried with SQL; it is not a no-code data cleaning tool."
      fr: "Amazon Redshift est un entrepôt de données interrogé en SQL ; ce n'est pas un outil de nettoyage de données sans code."
references:
  - title: What is AWS Glue DataBrew?
    url: https://docs.aws.amazon.com/databrew/latest/dg/what-is.html
