id: aifc01-3c-data-rlhf-rankings
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses reinforcement learning from human feedback (RLHF) to make a chatbot's answers more helpful and natural. The company needs data to train the reward model.

    Which data should the company collect?
  fr: |
    Une entreprise utilise l'apprentissage par renforcement à partir des commentaires humains (RLHF) pour rendre les réponses d'un chatbot plus utiles et plus naturelles. Elle a besoin de données pour entraîner le modèle de récompense.

    Quelles données l'entreprise doit-elle collecter ?
body:
  options:
    - { id: a, text: { en: "Human rankings of several model responses to the same prompt", fr: "Des classements humains de plusieurs réponses du modèle à la même invite" } }
    - { id: b, text: { en: "A large corpus of unlabeled documents from the company's domain", fr: "Un grand corpus de documents non étiquetés du domaine de l'entreprise" } }
    - { id: c, text: { en: "Model responses generated by a larger teacher model only", fr: "Uniquement des réponses générées par un modèle enseignant plus grand" } }
    - { id: d, text: { en: "Usage logs that record the latency of each model invocation", fr: "Des journaux d'utilisation qui enregistrent la latence de chaque appel du modèle" } }
answer: { optionId: a }
explanation:
  correct:
    en: "In RLHF, humans rate or rank multiple responses that the model gives to the same prompt. These comparison and ranking data train a separate reward model that estimates how a person would score a response, and the language model is then optimized to get high rewards."
    fr: "Dans le RLHF, des humains notent ou classent plusieurs réponses que le modèle donne à la même invite. Ces données de comparaison et de classement entraînent un modèle de récompense distinct qui estime la note qu'une personne donnerait à une réponse, puis le modèle de langage est optimisé pour obtenir des récompenses élevées."
  options:
    b:
      en: "Unlabeled domain documents are the data of continued pre-training; they carry no human preference."
      fr: "Des documents de domaine non étiquetés sont les données du préentraînement continu ; ils ne contiennent aucune préférence humaine."
    c:
      en: "Teacher responses are the data of distillation; RLHF needs human feedback on responses."
      fr: "Les réponses d'un enseignant sont les données de la distillation ; le RLHF a besoin de commentaires humains sur les réponses."
    d:
      en: "Latency logs measure performance, not whether people prefer one response to another."
      fr: "Les journaux de latence mesurent les performances, pas la préférence des personnes pour une réponse plutôt qu'une autre."
references:
  - title: What is RLHF? - Reinforcement Learning from Human Feedback Explained - AWS
    url: https://aws.amazon.com/what-is/reinforcement-learning-from-human-feedback/
