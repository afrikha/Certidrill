id: aifc01-3c-ft-freeze-layers
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A logistics company has an image model that was pre-trained on a large set of vehicle images. The company wants to adapt the model to recognize its own types of delivery vans by using a small labeled dataset. The adaptation must keep the general visual knowledge that the model learned during pre-training.

    Which approach will meet these requirements?
  fr: |
    Une entreprise de logistique dispose d'un modèle d'images préentraîné sur un grand ensemble d'images de véhicules. Elle veut adapter le modèle pour qu'il reconnaisse ses propres types de camionnettes de livraison à l'aide d'un petit jeu de données étiqueté. L'adaptation doit conserver les connaissances visuelles générales que le modèle a acquises pendant le préentraînement.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Reset all the weights to random values and train every layer on the small dataset.", fr: "Réinitialiser toutes les pondérations à des valeurs aléatoires et entraîner toutes les couches sur le petit jeu de données." } }
    - { id: b, text: { en: "Keep only the final task layers and remove the pre-trained layers before training.", fr: "Conserver uniquement les couches finales de la tâche et supprimer les couches préentraînées avant l'entraînement." } }
    - { id: c, text: { en: "Freeze the pre-trained layers, replace the final task layers, and train them on the new data.", fr: "Figer les couches préentraînées, remplacer les couches finales de la tâche et les entraîner sur les nouvelles données." } }
    - { id: d, text: { en: "Add the van images to the prompt as examples without changing the model.", fr: "Ajouter les images de camionnettes à l'invite comme exemples sans modifier le modèle." } }
answer: { optionId: c }
explanation:
  correct:
    en: "In transfer learning, the weights of the pre-trained layers are frozen to preserve what they learned. The final task-specific layers are removed and replaced by new layers suited to the new task, and these layers are trained on the target data, which works with a small dataset."
    fr: "En apprentissage par transfert, les pondérations des couches préentraînées sont figées pour préserver ce qu'elles ont appris. Les couches finales propres à l'ancienne tâche sont supprimées et remplacées par de nouvelles couches adaptées à la nouvelle tâche, puis ces couches sont entraînées sur les données cibles, ce qui fonctionne avec un petit jeu de données."
  options:
    a:
      en: "Resetting the weights discards the pre-trained knowledge and amounts to training from scratch, which a small dataset cannot support."
      fr: "Réinitialiser les pondérations efface les connaissances préentraînées et revient à entraîner à partir de zéro, ce qu'un petit jeu de données ne permet pas."
    b:
      en: "The pre-trained layers hold the general visual knowledge; removing them loses exactly what the company wants to keep."
      fr: "Les couches préentraînées contiennent les connaissances visuelles générales ; les supprimer fait perdre précisément ce que l'entreprise veut conserver."
    d:
      en: "Adding examples to a prompt is not an adaptation of an image classification model, and the model would not learn the new van types."
      fr: "Ajouter des exemples à une invite n'est pas une adaptation d'un modèle de classification d'images, et le modèle n'apprendrait pas les nouveaux types de camionnettes."
references:
  - title: What is Transfer Learning? - Transfer Learning in Machine Learning Explained - AWS
    url: https://aws.amazon.com/what-is/transfer-learning/
