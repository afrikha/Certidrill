id: aifc01-3c-eval-reference-response
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company creates a custom prompt dataset in Amazon S3 for an automatic model evaluation job in Amazon Bedrock. The job will measure the accuracy of a model on the question and answer task type.

    What must each record of the dataset contain?
  fr: |
    Une entreprise crée dans Amazon S3 un jeu de données d'invites personnalisé pour une tâche d'évaluation automatique de modèle dans Amazon Bedrock. La tâche mesurera l'exactitude d'un modèle pour le type de tâche questions-réponses.

    Que doit contenir chaque enregistrement du jeu de données ?
body:
  options:
    - { id: a, text: { en: "A prompt key with the question and a referenceResponse key with the expected answer", fr: "Une clé `prompt` avec la question et une clé `referenceResponse` avec la réponse attendue" } }
    - { id: b, text: { en: "A prompt key with the question only, because the judge model writes the answer", fr: "Une clé `prompt` avec la question uniquement, car le modèle juge rédige la réponse" } }
    - { id: c, text: { en: "A category key only, because Amazon Bedrock generates the questions", fr: "Une clé `category` uniquement, car Amazon Bedrock génère les questions" } }
    - { id: d, text: { en: "A rating key with a human score for the model's answer", fr: "Une clé `rating` avec une note humaine pour la réponse du modèle" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A custom prompt dataset is a JSON Lines file in Amazon S3 with up to 1,000 prompts. The prompt key is required, and referenceResponse, the ground-truth answer that the model's response is compared against, is required for question and answer, accuracy, and robustness evaluations. The category key is optional and groups the results."
    fr: "Un jeu de données d'invites personnalisé est un fichier JSON Lines stocké dans Amazon S3, avec jusqu'à 1 000 invites. La clé `prompt` est obligatoire, et `referenceResponse`, la réponse de vérité terrain à laquelle la réponse du modèle est comparée, est obligatoire pour les évaluations de questions-réponses, d'exactitude et de robustesse. La clé `category` est facultative et regroupe les résultats."
  options:
    b:
      en: "An automatic job has no judge model, and accuracy cannot be computed without a reference answer."
      fr: "Une tâche automatique n'a pas de modèle juge, et l'exactitude ne peut pas être calculée sans réponse de référence."
    c:
      en: "The category key is optional and only groups results; the dataset must provide the prompts."
      fr: "La clé `category` est facultative et ne fait que regrouper les résultats ; le jeu de données doit fournir les invites."
    d:
      en: "Automatic jobs compute metrics without human ratings; ratings are collected in human-based jobs."
      fr: "Les tâches automatiques calculent les métriques sans notes humaines ; les notes sont recueillies dans les tâches d'évaluation humaine."
references:
  - title: Use prompt datasets for model evaluation in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets.html
