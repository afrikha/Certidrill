id: aifc01-3a-rag-order-ingestion
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company connects an Amazon S3 data source of text documents to an Amazon Bedrock knowledge base and starts the first sync.

    Which three ingestion steps happen, in order, so that the knowledge base can later retrieve passages? To answer, select the correct steps from the following list and place them in the correct order. Each step should be selected one time or not at all.
  fr: |
    Une entreprise connecte une source de données Amazon S3 contenant des documents texte à une base de connaissances Amazon Bedrock et lance la première synchronisation.

    Quelles sont les trois étapes d'ingestion qui ont lieu, dans l'ordre, pour que la base de connaissances puisse ensuite récupérer des passages ? Pour répondre, sélectionnez les étapes appropriées dans la liste suivante et placez-les dans le bon ordre. Chaque étape peut être sélectionnée une fois ou pas du tout.
body:
  count: 3
  actions:
    - { id: embed, text: { en: "Convert each chunk into a vector by using the embeddings model.", fr: "Convertir chaque fragment en vecteur à l'aide du modèle d'intégration." } }
    - { id: tune, text: { en: "Fine-tune the foundation model on the chunks.", fr: "Peaufiner le modèle de fondation sur les fragments." } }
    - { id: chunk, text: { en: "Split the documents into chunks.", fr: "Découper les documents en fragments." } }
    - { id: query, text: { en: "Convert the user's question into a vector.", fr: "Convertir la question de l'utilisateur en vecteur." } }
    - { id: index, text: { en: "Write the vectors to a vector index, with a mapping to the source documents.", fr: "Écrire les vecteurs dans un index vectoriel, avec une correspondance vers les documents sources." } }
    - { id: guard, text: { en: "Apply a guardrail to the documents.", fr: "Appliquer un garde-fou aux documents." } }
answer:
  sequence: [ chunk, embed, index ]
explanation:
  correct:
    en: "During ingestion, Amazon Bedrock splits the documents into manageable chunks, converts each chunk into a vector with the embeddings model, and writes the vectors to a vector index while keeping a mapping to the original documents. Retrieval then compares the vector of a question with these stored vectors."
    fr: "Pendant l'ingestion, Amazon Bedrock découpe les documents en fragments gérables, convertit chaque fragment en vecteur avec le modèle d'intégration et écrit les vecteurs dans un index vectoriel en conservant une correspondance avec les documents d'origine. La récupération compare ensuite le vecteur d'une question à ces vecteurs stockés."
  options:
    tune:
      en: "A knowledge base does not train the foundation model; it adds retrieved passages to the prompt at query time."
      fr: "Une base de connaissances n'entraîne pas le modèle de fondation ; elle ajoute des passages récupérés à l'invite au moment de la requête."
    query:
      en: "Converting the user's question into a vector happens at query time, not during ingestion."
      fr: "La conversion de la question de l'utilisateur en vecteur a lieu au moment de la requête, pas pendant l'ingestion."
    guard:
      en: "Guardrails evaluate prompts and model responses; they are not an ingestion step of a knowledge base."
      fr: "Les garde-fous évaluent les invites et les réponses du modèle ; ils ne sont pas une étape d'ingestion d'une base de connaissances."
references:
  - title: How Amazon Bedrock knowledge bases work
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
  - title: How content chunking works for knowledge bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
