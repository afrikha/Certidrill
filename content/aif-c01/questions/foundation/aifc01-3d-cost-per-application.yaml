id: aifc01-3d-cost-per-application
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs three generative AI applications that call the same Amazon Bedrock model with on-demand pricing. The finance team wants to report the cost per interaction of each application separately. The company does not want to change its pricing model.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute trois applications d'IA générative qui appellent le même modèle Amazon Bedrock avec une tarification à la demande. L'équipe financière veut indiquer séparément le coût par interaction de chaque application. L'entreprise ne veut pas changer de modèle de tarification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the requests of the three applications through one cross-Region (system-defined) inference profile.", fr: "Envoyer les requêtes des trois applications via un même profil d'inférence interrégional (défini par le système)." } }
    - { id: b, text: { en: "Purchase Provisioned Throughput for each application, and then compare the monthly charges.", fr: "Acheter du Provisioned Throughput pour chaque application, puis comparer les frais mensuels." } }
    - { id: c, text: { en: "Create a tagged application inference profile per application, and send its requests through it.", fr: "Créer un profil d'inférence d'application balisé par application, et y faire passer ses requêtes." } }
    - { id: d, text: { en: "Enable AWS CloudTrail, and then count the model invocation API calls of each application.", fr: "Activer AWS CloudTrail, puis compter les appels d'API d'invocation du modèle de chaque application." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An application inference profile is a resource that you create to track costs and model usage. You attach cost allocation tags to it to track the cost of on-demand requests, and its usage metrics are collected separately. One profile per application separates the costs of the three applications without changing the pricing model."
    fr: "Un profil d'inférence d'application est une ressource que vous créez pour suivre les coûts et l'utilisation du modèle. Vous lui associez des balises de répartition des coûts (cost allocation tags) pour suivre le coût des requêtes à la demande, et ses métriques d'utilisation sont collectées séparément. Un profil par application sépare les coûts des trois applications sans changer de modèle de tarification."
  options:
    a:
      en: "A single shared system-defined profile mixes the usage of the three applications."
      fr: "Un profil unique défini par le système et partagé mélange l'utilisation des trois applications."
    b:
      en: "Provisioned Throughput replaces on-demand pricing with a commitment, which the company does not want."
      fr: "Provisioned Throughput remplace la tarification à la demande par un engagement, ce que l'entreprise ne veut pas."
    d:
      en: "CloudTrail records API calls for auditing; a count of calls ignores the number of tokens, which drives the cost."
      fr: "CloudTrail enregistre les appels d'API à des fins d'audit ; un décompte d'appels ignore le nombre de jetons, qui détermine le coût."
references:
  - title: Set up a model invocation resource using inference profiles
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles.html
