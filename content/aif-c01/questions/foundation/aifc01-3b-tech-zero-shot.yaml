id: aifc01-3b-tech-zero-shot
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A news website sends the following prompt to a foundation model:

    "Classify the sentiment of this headline as Positive or Negative: Local bakery wins national award."

    The prompt contains no example of a classified headline. Which prompt engineering technique does the website use?
  fr: |
    Un site d'actualités envoie l'invite suivante à un modèle de fondation :

    « Classe le sentiment de ce titre comme Positive ou Negative : Une boulangerie locale remporte un prix national. »

    L'invite ne contient aucun exemple de titre classé. Quelle technique d'ingénierie de requête le site utilise-t-il ?
body:
  options:
    - { id: a, text: { en: "Few-shot prompting", fr: "Invite few-shot" } }
    - { id: b, text: { en: "Zero-shot prompting", fr: "Invite zero-shot" } }
    - { id: c, text: { en: "Single-shot prompting", fr: "Invite single-shot" } }
    - { id: d, text: { en: "Chain-of-thought prompting", fr: "Invite à chaîne de pensée (chain-of-thought)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A zero-shot prompt describes the task and gives the input, without any example input and output pair. The model relies only on what it learned during training to perform the classification."
    fr: "Une invite zero-shot décrit la tâche et fournit l'entrée, sans aucune paire d'exemple d'entrée et de sortie. Le modèle s'appuie uniquement sur ce qu'il a appris pendant l'entraînement pour effectuer la classification."
  options:
    a:
      en: "Few-shot prompting includes several labeled examples before the input."
      fr: "Une invite few-shot inclut plusieurs exemples étiquetés avant l'entrée."
    c:
      en: "Single-shot (one-shot) prompting includes exactly one example."
      fr: "Une invite single-shot (one-shot) inclut exactement un exemple."
    d:
      en: "Chain-of-thought prompting asks the model to reason step by step; this prompt does not."
      fr: "Une invite à chaîne de pensée demande au modèle de raisonner étape par étape ; ce n'est pas le cas ici."
references:
  - title: Prompt engineering concepts
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
