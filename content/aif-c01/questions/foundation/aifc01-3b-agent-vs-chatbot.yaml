id: aifc01-3b-agent-vs-chatbot
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company already uses a chatbot that answers product questions by sending each question to a foundation model. The company is evaluating AI agents for the next version.

    Which capability distinguishes an AI agent from this chatbot?
  fr: |
    Une entreprise de distribution utilise déjà un chatbot qui répond aux questions sur les produits en envoyant chaque question à un modèle de fondation. L'entreprise évalue des agents d'IA pour la prochaine version.

    Quelle fonctionnalité distingue un agent d'IA de ce chatbot ?
body:
  options:
    - { id: a, text: { en: "The agent pursues a goal by planning steps and taking actions through tools and APIs.", fr: "L'agent poursuit un objectif en planifiant des étapes et en agissant au moyen d'outils et d'API." } }
    - { id: b, text: { en: "The agent returns the same answer every time it receives the same question.", fr: "L'agent renvoie la même réponse chaque fois qu'il reçoit la même question." } }
    - { id: c, text: { en: "The agent generates text without using a foundation model or any other model.", fr: "L'agent génère du texte sans utiliser de modèle de fondation ni aucun autre modèle." } }
    - { id: d, text: { en: "The agent must be trained from scratch on the company's own product data.", fr: "L'agent doit être entraîné de zéro sur les données produits de l'entreprise." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A chatbot of this kind answers one question at a time. An AI agent is goal-oriented: it uses a foundation model to reason, splits the goal into tasks, and acts autonomously by calling tools, APIs, or other agents until the goal is reached."
    fr: "Un chatbot de ce type répond à une question à la fois. Un agent d'IA est orienté objectif : il utilise un modèle de fondation pour raisonner, divise l'objectif en tâches et agit de manière autonome en appelant des outils, des API ou d'autres agents jusqu'à atteindre l'objectif."
  options:
    b:
      en: "Agents built on foundation models are not deterministic; they choose their next action from the current context."
      fr: "Les agents construits sur des modèles de fondation ne sont pas déterministes ; ils choisissent leur prochaine action selon le contexte du moment."
    c:
      en: "Modern AI agents use a foundation model as their reasoning engine."
      fr: "Les agents d'IA modernes utilisent un modèle de fondation comme moteur de raisonnement."
    d:
      en: "Agents typically use existing foundation models; no training from scratch is needed."
      fr: "Les agents utilisent généralement des modèles de fondation existants ; aucun entraînement de zéro n'est nécessaire."
references:
  - title: What are AI Agents?
    url: https://aws.amazon.com/what-is/ai-agents/
  - title: Foundations of agentic AI on AWS
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-foundations/introduction.html
