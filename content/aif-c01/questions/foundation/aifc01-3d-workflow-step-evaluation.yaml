id: aifc01-3d-workflow-step-evaluation
objective: "3.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a three-step generative AI workflow: an FM classifies each incoming email, a second step extracts the shipment fields, and a third step drafts a reply. Many final replies are wrong, and the team cannot tell which step causes the errors.

    Which evaluation approach will help the team find the cause?
  fr: |
    Une entreprise de logistique exécute un flux de travail d'IA générative en trois étapes : un FM classe chaque e-mail entrant, une deuxième étape extrait les champs de l'expédition et une troisième rédige une réponse. De nombreuses réponses finales sont erronées, et l'équipe ne sait pas quelle étape cause les erreurs.

    Quelle approche d'évaluation aidera l'équipe à trouver la cause ?
body:
  options:
    - { id: a, text: { en: "Evaluate only the final replies, with a larger test dataset.", fr: "Évaluer uniquement les réponses finales, avec un jeu de test plus grand." } }
    - { id: b, text: { en: "Evaluate each step with its own test data and metrics, and also evaluate the final replies.", fr: "Évaluer chaque étape avec ses propres données de test et métriques, et évaluer aussi les réponses finales." } }
    - { id: c, text: { en: "Replace the three steps with one prompt, and then evaluate the replies of that prompt.", fr: "Remplacer les trois étapes par une seule invite, puis évaluer les réponses de cette invite." } }
    - { id: d, text: { en: "Increase the temperature of each step, and then evaluate the final replies again.", fr: "Augmenter la température de chaque étape, puis évaluer de nouveau les réponses finales." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An end-to-end score shows that the workflow fails but not where. Evaluating each component separately (classification accuracy, extraction accuracy, reply quality) isolates the faulty step, and the end-to-end evaluation confirms how the whole application performs. AWS guidance recommends validating core components before full integration and collecting application-level flow metrics and traces."
    fr: "Un score de bout en bout montre que le flux échoue, mais pas à quel endroit. Évaluer chaque composant séparément (exactitude de la classification, exactitude de l'extraction, qualité de la réponse) isole l'étape défaillante, et l'évaluation de bout en bout confirme les performances de l'application entière. Les recommandations AWS conseillent de valider les composants essentiels avant l'intégration complète et de collecter des métriques et des traces du flux au niveau de l'application."
  options:
    a:
      en: "More final replies give a more precise end-to-end score, but still do not show which step fails."
      fr: "Davantage de réponses finales donnent un score de bout en bout plus précis, mais ne montrent toujours pas quelle étape échoue."
    c:
      en: "Merging the steps changes the application and removes the possibility of locating the error."
      fr: "Fusionner les étapes modifie l'application et supprime toute possibilité de localiser l'erreur."
    d:
      en: "A higher temperature makes outputs more random; it is not an evaluation approach and makes errors harder to reproduce."
      fr: "Une température plus élevée rend les sorties plus aléatoires ; ce n'est pas une approche d'évaluation, et les erreurs deviennent plus difficiles à reproduire."
references:
  - title: Architecting a successful generative AI proof of concept
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
  - title: GENPERF01-BP02 Collect performance metrics from generative AI workloads
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/genperf01-bp02.html
