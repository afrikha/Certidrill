id: aifc01-3b-bp-order-refinement
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is creating a prompt that drafts replies to customer complaints. The company wants to follow AWS prompt engineering best practices.

    Which four steps should the company perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une compagnie d'assurance crée une invite qui rédige des réponses aux réclamations des clients. Elle veut suivre les bonnes pratiques d'ingénierie de requête d'AWS.

    Quelles sont les quatre étapes que la compagnie doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: test, text: { en: "Run the prompt on representative complaints and evaluate the outputs.", fr: "Exécuter l'invite sur des réclamations représentatives et évaluer les sorties." } }
    - { id: define, text: { en: "Define the task, the role, and measurable success criteria.", fr: "Définir la tâche, le rôle et des critères de réussite mesurables." } }
    - { id: tune, text: { en: "Fine-tune the model before writing any prompt.", fr: "Peaufiner le modèle avant d'écrire la moindre invite." } }
    - { id: refine, text: { en: "Refine the prompt based on the results and test it again.", fr: "Affiner l'invite selon les résultats et la tester de nouveau." } }
    - { id: draft, text: { en: "Write a draft prompt with instructions, context, and the output format.", fr: "Rédiger une ébauche d'invite avec les instructions, le contexte et le format de sortie." } }
    - { id: deploy, text: { en: "Deploy the draft prompt to production to collect the first results.", fr: "Déployer l'ébauche d'invite en production pour recueillir les premiers résultats." } }
answer:
  sequence: [ define, draft, test, refine ]
explanation:
  correct:
    en: "AWS recommends defining the use case (task, role, response style, instructions) and success criteria first, then writing a draft prompt that starts an iterative cycle: test it on representative inputs, evaluate the outputs against the criteria, and refine until the criteria are met."
    fr: "AWS recommande de définir d'abord le cas d'utilisation (tâche, rôle, style de réponse, instructions) et les critères de réussite, puis de rédiger une ébauche d'invite qui lance un cycle itératif : la tester sur des entrées représentatives, évaluer les sorties au regard des critères et l'affiner jusqu'à les atteindre."
  options:
    tune:
      en: "Fine-tuning is considered only if prompt engineering does not meet the criteria; it is not a first step."
      fr: "Le peaufinage n'est envisagé que si l'ingénierie de requête ne permet pas d'atteindre les critères ; ce n'est pas une première étape."
    deploy:
      en: "Deploying an untested prompt exposes customers to poor replies; testing comes before production."
      fr: "Déployer une invite non testée expose les clients à de mauvaises réponses ; les tests précèdent la production."
references:
  - title: Prompting best practices for Amazon Nova understanding models
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting.html
