id: aifc01-3c-train-fine-tune-labeled
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company has 5,000 support requests, each paired with the ideal answer written by its best support engineers. The company wants a foundation model (FM) to answer new requests in the same way.

    Which training approach should the company use?
  fr: |
    Un éditeur de logiciels dispose de 5 000 demandes de support, chacune associée à la réponse idéale rédigée par ses meilleurs ingénieurs de support. L'entreprise veut qu'un modèle de fondation (FM) réponde aux nouvelles demandes de la même manière.

    Quelle approche d'entraînement l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Continued pre-training", fr: "Préentraînement continu" } }
    - { id: b, text: { en: "Pre-training a new model from scratch", fr: "Préentraînement d'un nouveau modèle à partir de zéro" } }
    - { id: c, text: { en: "Model distillation", fr: "Distillation de modèle" } }
    - { id: d, text: { en: "Supervised fine-tuning", fr: "Peaufinage supervisé (supervised fine-tuning)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Supervised fine-tuning uses labeled input-output examples: the model adjusts its parameters to produce the expected output for each type of input. Request-answer pairs are exactly this kind of labeled data."
    fr: "Le peaufinage supervisé utilise des exemples étiquetés d'entrée et de sortie : le modèle ajuste ses paramètres pour produire la sortie attendue pour chaque type d'entrée. Des paires demande-réponse sont exactement ce type de données étiquetées."
  options:
    a:
      en: "Continued pre-training uses large volumes of unlabeled domain text; it does not learn from request-answer pairs."
      fr: "Le préentraînement continu utilise de grands volumes de texte de domaine non étiqueté ; il n'apprend pas à partir de paires demande-réponse."
    b:
      en: "Pre-training from scratch needs massive datasets and costs millions of dollars; 5,000 examples are far too few and an existing FM already has the language skills."
      fr: "Le préentraînement à partir de zéro nécessite des jeux de données immenses et coûte des millions de dollars ; 5 000 exemples sont bien trop peu, et un FM existant possède déjà les compétences linguistiques."
    c:
      en: "Distillation transfers a larger teacher model's behavior to a smaller student model; it is not the way to learn from the company's own labeled answers."
      fr: "La distillation transfère le comportement d'un modèle enseignant plus grand vers un modèle élève plus petit ; ce n'est pas la façon d'apprendre à partir des réponses étiquetées de l'entreprise."
references:
  - title: Customize your model to improve its performance for your use case
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
