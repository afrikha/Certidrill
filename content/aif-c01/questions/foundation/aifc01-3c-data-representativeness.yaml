id: aifc01-3c-data-representativeness
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An electronics retailer fine-tuned a foundation model (FM) with support conversations about its smartphones only. In production, the assistant also answers questions about laptops and smart home devices, and its answers for those products are poor. The training examples were accurate and well formatted.

    Which data preparation issue is the MOST likely cause?
  fr: |
    Un distributeur d'électronique a peaufiné un modèle de fondation (FM) uniquement avec des conversations de support sur ses smartphones. En production, l'assistant répond aussi à des questions sur des ordinateurs portables et des appareils domotiques, et ses réponses pour ces produits sont médiocres. Les exemples d'entraînement étaient exacts et bien formatés.

    Quel problème de préparation des données en est la cause la PLUS probable ?
body:
  options:
    - { id: a, text: { en: "The training data was not representative of the requests the model receives.", fr: "Les données d'entraînement n'étaient pas représentatives des requêtes que reçoit le modèle." } }
    - { id: b, text: { en: "The training data was labeled with too many different response formats.", fr: "Les données d'entraînement étaient étiquetées avec trop de formats de réponse différents." } }
    - { id: c, text: { en: "The training data contained personal information that should have been removed.", fr: "Les données d'entraînement contenaient des informations personnelles qui auraient dû être supprimées." } }
    - { id: d, text: { en: "The training data was stored in Amazon S3 instead of a database.", fr: "Les données d'entraînement étaient stockées dans Amazon S3 au lieu d'une base de données." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A fine-tuning dataset must represent the range of inputs the model will see in production. Training only on smartphone conversations leaves laptops and smart home devices uncovered, so the model performs poorly on them even though the examples themselves were good."
    fr: "Un jeu de données de réglage précis doit représenter l'éventail des entrées que le modèle rencontrera en production. S'entraîner uniquement sur des conversations sur les smartphones laisse les ordinateurs portables et les appareils domotiques sans couverture : le modèle est donc médiocre sur ces produits, même si les exemples eux-mêmes étaient bons."
  options:
    b:
      en: "The stem says the examples were accurate and well formatted, and inconsistent formats would not explain poor answers on specific product lines only."
      fr: "L'énoncé indique que les exemples étaient exacts et bien formatés, et des formats incohérents n'expliqueraient pas des réponses médiocres uniquement sur certaines gammes de produits."
    c:
      en: "Personal information is a privacy and governance problem; it does not explain poor answers about products that are missing from the data."
      fr: "Les informations personnelles posent un problème de confidentialité et de gouvernance ; elles n'expliquent pas des réponses médiocres sur des produits absents des données."
    d:
      en: "Amazon S3 is where Amazon Bedrock and SageMaker AI read training data; the storage location does not affect what the model learns."
      fr: "Amazon S3 est l'emplacement où Amazon Bedrock et SageMaker AI lisent les données d'entraînement ; l'emplacement de stockage n'influe pas sur ce que le modèle apprend."
references:
  - title: Prepare data for fine-tuning your models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
