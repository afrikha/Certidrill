id: aifc01-3c-pm-versioning-strategy
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank uses Amazon Bedrock Prompt Management for the prompts of its customer service assistant. Production must use only prompt configurations that the compliance team has approved. The bank must also be able to return to an earlier approved configuration if a new one causes problems.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une banque utilise Amazon Bedrock Prompt Management pour les invites de son assistant de service client. La production doit utiliser uniquement des configurations d'invite approuvées par l'équipe de conformité. La banque doit aussi pouvoir revenir à une configuration approuvée antérieure si une nouvelle configuration pose problème.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the assistant to invoke the prompt DRAFT so that it always gets the latest changes.", fr: "Configurer l'assistant pour qu'il appelle le brouillon (DRAFT) de l'invite afin d'obtenir toujours les derniers changements." } }
    - { id: b, text: { en: "Create a numbered version of the prompt each time the compliance team approves a configuration.", fr: "Créer une version numérotée de l'invite chaque fois que l'équipe de conformité approuve une configuration." } }
    - { id: c, text: { en: "Delete the previous prompt versions each time a new approved version is released.", fr: "Supprimer les versions précédentes de l'invite chaque fois qu'une nouvelle version approuvée est publiée." } }
    - { id: d, text: { en: "Configure the assistant to invoke the ARN of a specific approved version of the prompt.", fr: "Configurer l'assistant pour qu'il appelle l'ARN d'une version approuvée précise de l'invite." } }
    - { id: e, text: { en: "Turn on prompt caching for the prompt so that approved responses are reused.", fr: "Activer la mise en cache des invites pour réutiliser les réponses approuvées." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A version is a snapshot of the draft that you create when a configuration is ready for production. Creating a version for each approved configuration keeps a history of approved snapshots, and invoking a specific version ARN means production changes only when the bank switches the ARN, including back to an earlier version."
    fr: "Une version est un instantané du brouillon que vous créez quand une configuration est prête pour la production. Créer une version pour chaque configuration approuvée conserve un historique d'instantanés approuvés, et appeler l'ARN d'une version précise fait que la production ne change que lorsque la banque change d'ARN, y compris pour revenir à une version antérieure."
  options:
    a:
      en: "The draft contains unapproved work in progress, so production would use configurations that compliance has not approved."
      fr: "Le brouillon contient du travail en cours non approuvé : la production utiliserait des configurations que la conformité n'a pas approuvées."
    c:
      en: "Deleting earlier versions removes the approved snapshots that the bank needs to roll back to."
      fr: "Supprimer les versions antérieures retire les instantanés approuvés vers lesquels la banque doit pouvoir revenir."
    e:
      en: "Prompt caching reuses a processed prompt prefix to reduce latency and cost; it does not control which configuration is approved or allow a rollback."
      fr: "La mise en cache des invites réutilise un préfixe d'invite déjà traité pour réduire la latence et le coût ; elle ne contrôle pas quelle configuration est approuvée et ne permet pas de revenir en arrière."
references:
  - title: Deploy a prompt to your application using versions in Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-deploy.html
  - title: Create a version of a prompt in Prompt management
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-version-create.html
