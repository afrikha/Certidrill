id: aifc01-3a-rag-definition
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is evaluating Retrieval Augmented Generation (RAG) for an internal assistant that is based on a foundation model (FM).

    Which statement describes RAG?
  fr: |
    Une entreprise évalue la génération à enrichissement contextuel (RAG) pour un assistant interne basé sur un modèle de fondation (FM).

    Quelle affirmation décrit le RAG ?
body:
  options:
    - { id: a, text: { en: "The FM is retrained on the company's documents so that their content is stored in the model weights.", fr: "Le FM est réentraîné sur les documents de l'entreprise pour que leur contenu soit stocké dans les pondérations du modèle." } }
    - { id: b, text: { en: "Relevant information is retrieved from a data source and added to the prompt before the FM generates a response.", fr: "Des informations pertinentes sont récupérées dans une source de données et ajoutées à l'invite avant que le FM ne génère une réponse." } }
    - { id: c, text: { en: "The knowledge of a large FM is transferred to a smaller FM that is faster and less expensive to run.", fr: "Les connaissances d'un grand FM sont transférées à un FM plus petit, plus rapide et moins cher à exécuter." } }
    - { id: d, text: { en: "Prompts and responses that violate the company's content policies are filtered before they reach users.", fr: "Les invites et les réponses qui enfreignent les politiques de contenu de l'entreprise sont filtrées avant d'atteindre les utilisateurs." } }
answer: { optionId: b }
explanation:
  correct:
    en: "RAG queries and retrieves information from a data source, augments the prompt with this information to give the FM better context, and then obtains a better response from the FM. The model itself is not changed, so the data source can be updated without retraining."
    fr: "Le RAG interroge une source de données et en récupère des informations, enrichit l'invite avec ces informations pour donner un meilleur contexte au FM, puis obtient une meilleure réponse du FM. Le modèle lui-même n'est pas modifié : la source de données peut donc être mise à jour sans réentraînement."
  options:
    a:
      en: "Changing the model weights with company data is model customization, such as fine-tuning, not RAG."
      fr: "Modifier les pondérations du modèle avec les données de l'entreprise relève de la personnalisation de modèle, comme le réglage précis, pas du RAG."
    c:
      en: "Transferring knowledge from a large teacher model to a smaller student model is model distillation."
      fr: "Transférer les connaissances d'un grand modèle enseignant vers un modèle élève plus petit relève de la distillation de modèles."
    d:
      en: "Filtering prompts and responses against content policies is the role of Amazon Bedrock Guardrails."
      fr: "Filtrer les invites et les réponses selon des politiques de contenu est le rôle d'Amazon Bedrock Guardrails."
references:
  - title: Key terminology
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
  - title: How Amazon Bedrock knowledge bases work
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
