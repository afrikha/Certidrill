id: aifc01-3d-agent-tool-parameters
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's AI agent correctly chooses its account lookup tool when customers ask about a transaction. However, traces show that the agent sometimes passes an account number that the customer never provided in the conversation. The bank uses Amazon Bedrock AgentCore Evaluations.

    Which built-in evaluator measures this problem?
  fr: |
    L'agent d'IA d'une banque choisit correctement son outil de consultation de compte lorsque les clients posent une question sur une transaction. Pourtant, les traces montrent que l'agent transmet parfois un numéro de compte que le client n'a jamais fourni dans la conversation. La banque utilise Amazon Bedrock AgentCore Evaluations.

    Quel évaluateur intégré mesure ce problème ?
body:
  options:
    - { id: a, text: "Tool selection accuracy" }
    - { id: b, text: "Tool parameter accuracy" }
    - { id: c, text: "Faithfulness" }
    - { id: d, text: "Correctness" }
answer: { optionId: b }
explanation:
  correct:
    en: "Tool parameter accuracy is a tool call level evaluator that verifies whether the parameters of a tool call are derived from the conversation context rather than fabricated. An account number that the customer never gave is a fabricated parameter."
    fr: "Tool parameter accuracy est un évaluateur de niveau appel d'outil qui vérifie si les paramètres d'un appel d'outil sont tirés du contexte de la conversation plutôt qu'inventés. Un numéro de compte que le client n'a jamais donné est un paramètre inventé."
  options:
    a:
      en: "The agent chooses the right tool, so Tool selection accuracy would not reveal the problem."
      fr: "L'agent choisit le bon outil : Tool selection accuracy ne révélerait donc pas le problème."
    c:
      en: "Faithfulness is a trace-level evaluator that checks whether a response conflicts with the conversation history; it evaluates responses, not the parameters of tool calls."
      fr: "Faithfulness est un évaluateur de niveau trace qui vérifie si une réponse contredit l'historique de la conversation ; il évalue les réponses, pas les paramètres des appels d'outils."
    d:
      en: "Correctness assesses the factual accuracy of the claims in a response, not the inputs of a tool call."
      fr: "Correctness évalue l'exactitude factuelle des affirmations d'une réponse, pas les entrées d'un appel d'outil."
references:
  - title: Prompt templates
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/prompt-templates-builtin.html
  - title: Evaluation terminology
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations-terminology.html
