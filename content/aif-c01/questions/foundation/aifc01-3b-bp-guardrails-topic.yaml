id: aifc01-3b-bp-guardrails-topic
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's assistant runs on Amazon Bedrock and uses two different foundation models. The bank instructed the models in their prompts not to give investment advice, but some responses still recommend stocks. The bank wants one configuration that blocks investment advice in both user inputs and model responses for both models.

    Which solution will meet these requirements?
  fr: |
    L'assistant d'une banque fonctionne sur Amazon Bedrock et utilise deux modèles de fondation différents. La banque a demandé aux modèles dans leurs invites de ne pas donner de conseils en investissement, mais certaines réponses recommandent encore des actions. La banque veut une seule configuration qui bloque les conseils en investissement dans les entrées des utilisateurs et dans les réponses des modèles, pour les deux modèles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a guardrail in Amazon Bedrock Guardrails with a denied topic for investment advice.", fr: "Créer une barrière de protection dans Amazon Bedrock Guardrails avec un sujet refusé pour les conseils en investissement." } }
    - { id: b, text: { en: "Store the bank's banned topics in an Amazon Bedrock knowledge base that both models query.", fr: "Stocker les sujets interdits de la banque dans une base de connaissances Amazon Bedrock que les deux modèles interrogent." } }
    - { id: c, text: { en: "Repeat the instruction against investment advice three times in each prompt.", fr: "Répéter trois fois dans chaque invite l'instruction contre les conseils en investissement." } }
    - { id: d, text: { en: "Lower the temperature of both models to reduce unexpected responses.", fr: "Baisser la température des deux modèles pour réduire les réponses inattendues." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Prompt instructions are a first guardrail, but models can still ignore them. Amazon Bedrock Guardrails evaluates both the input prompt and the model completion, and a denied topic blocks queries and responses about a topic that the bank defines. The same guardrail can be applied to different models."
    fr: "Les instructions de l'invite sont une première barrière, mais les modèles peuvent encore les ignorer. Amazon Bedrock Guardrails évalue l'invite d'entrée et la complétion du modèle, et un sujet refusé bloque les requêtes et les réponses sur un sujet que la banque définit. La même barrière de protection peut s'appliquer à des modèles différents."
  options:
    b:
      en: "A knowledge base supplies documents for retrieval augmented generation; it does not block topics in inputs or outputs."
      fr: "Une base de connaissances fournit des documents pour la génération augmentée par récupération ; elle ne bloque pas de sujets dans les entrées ou les sorties."
    c:
      en: "Repeated instructions remain prompt-level guidance that the models can still fail to follow; they do not filter outputs."
      fr: "Des instructions répétées restent des consignes au niveau de l'invite que les modèles peuvent encore ne pas suivre ; elles ne filtrent pas les sorties."
    d:
      en: "Temperature controls randomness; a low temperature does not prevent a topic from appearing."
      fr: "La température règle le caractère aléatoire ; une température basse n'empêche pas un sujet d'apparaître."
references:
  - title: Detect and filter harmful content by using Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
