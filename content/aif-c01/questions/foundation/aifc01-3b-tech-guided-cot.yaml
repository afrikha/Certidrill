id: aifc01-3b-tech-guided-cot
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A consulting firm uses a foundation model to assess supplier risk. The firm has its own four-step method: check financial health, check delivery history, check regulatory issues, then give a rating. The firm wants the model to reason through exactly these steps, in this order, before it gives its rating.

    Which prompt will meet these requirements?
  fr: |
    Un cabinet de conseil utilise un modèle de fondation pour évaluer le risque fournisseur. Le cabinet a sa propre méthode en quatre étapes : vérifier la santé financière, vérifier l'historique de livraison, vérifier les problèmes réglementaires, puis attribuer une note. Il veut que le modèle raisonne en suivant exactement ces étapes, dans cet ordre, avant de donner sa note.

    Quelle invite répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Append \"Think step-by-step.\" to the supplier data and the request for a rating.", fr: "Ajouter « Réfléchis étape par étape. » aux données du fournisseur et à la demande de note." } }
    - { id: b, text: { en: "Add three examples of supplier ratings, each without the reasoning that led to it.", fr: "Ajouter trois exemples de notes de fournisseurs, chacun sans le raisonnement qui y a conduit." } }
    - { id: c, text: { en: "List the four steps of the method in the prompt and ask the model to follow them in order.", fr: "Lister les quatre étapes de la méthode dans l'invite et demander au modèle de les suivre dans l'ordre." } }
    - { id: d, text: { en: "Ask for the rating directly, with a negative prompt that forbids explanations.", fr: "Demander directement la note, avec une invite négative qui interdit les explications." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Guided chain-of-thought specifies the reasoning steps in the prompt, so the model works through the firm's own method in the required order before giving the final answer. The response is then organized around those exact steps."
    fr: "La chaîne de pensée guidée précise les étapes de raisonnement dans l'invite : le modèle suit la méthode du cabinet dans l'ordre exigé avant de donner la réponse finale. La réponse est alors organisée autour de ces étapes précises."
  options:
    a:
      en: "Open-ended chain-of-thought makes the model reason step by step, but the model chooses its own steps, which may not match the firm's method or order."
      fr: "La chaîne de pensée ouverte fait raisonner le modèle étape par étape, mais il choisit ses propres étapes, qui peuvent ne pas correspondre à la méthode ni à l'ordre du cabinet."
    b:
      en: "Examples of final ratings without reasoning show the output format, not the method the model must follow."
      fr: "Des exemples de notes finales sans raisonnement montrent le format de sortie, pas la méthode que le modèle doit suivre."
    d:
      en: "Forbidding explanations removes the step-by-step reasoning that the firm requires."
      fr: "Interdire les explications supprime le raisonnement étape par étape que le cabinet exige."
references:
  - title: Give Amazon Nova time to think (chain-of-thought)
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-chain-of-thought.html
