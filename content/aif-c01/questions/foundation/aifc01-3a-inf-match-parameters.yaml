id: aifc01-3a-inf-match-parameters
objective: "3.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A developer configures the inference parameters of a foundation model (FM) on Amazon Bedrock. Match each requirement with the inference parameter that meets it. Select the correct parameter from the following list for each requirement. Each parameter should be selected one time or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur configure les paramètres d'inférence d'un modèle de fondation (FM) sur Amazon Bedrock. Associez chaque exigence au paramètre d'inférence qui y répond. Sélectionnez dans la liste suivante le paramètre qui convient à chaque exigence. Chaque paramètre peut être sélectionné une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: temp, text: { en: "Temperature", fr: "Température" } }
    - { id: topp, text: { en: "Top P", fr: "Top P" } }
    - { id: topk, text: { en: "Top K", fr: "Top K" } }
    - { id: max, text: { en: "Maximum tokens", fr: "Nombre maximal de jetons" } }
    - { id: stop, text: { en: "Stop sequences", fr: "Séquences d'arrêt" } }
  targets:
    - { id: t1, text: { en: "Consider only the 50 most probable candidates for each next token.", fr: "Ne prendre en compte que les 50 candidats les plus probables pour chaque jeton suivant." } }
    - { id: t2, text: { en: "Consider only the tokens that make up the top 80% of the cumulative probability.", fr: "Ne prendre en compte que les jetons qui forment les 80 % supérieurs de la probabilité cumulée." } }
    - { id: t3, text: { en: "Stop generating as soon as the model writes the string END.", fr: "Arrêter la génération dès que le modèle écrit la chaîne END." } }
    - { id: t4, text: { en: "Limit each response to 200 tokens.", fr: "Limiter chaque réponse à 200 jetons." } }
answer:
  mapping: { t1: topk, t2: topp, t3: stop, t4: max }
explanation:
  correct:
    en: "Top K is the number of most-likely candidates that the model considers for the next token (50 here). Top P is the share of the cumulative probability distribution that the model considers (0.8 here). A stop sequence stops generation after the model produces the given string. Maximum tokens sets the largest number of tokens in the response. Temperature, which changes how random the choice is, matches none of the requirements."
    fr: "Top K est le nombre de candidats les plus probables que le modèle envisage pour le jeton suivant (50 ici). Top P est la part de la distribution de probabilité cumulée que le modèle prend en compte (0,8 ici). Une séquence d'arrêt interrompt la génération après que le modèle a produit la chaîne indiquée. Le nombre maximal de jetons fixe le plus grand nombre de jetons de la réponse. La température, qui modifie le caractère aléatoire du choix, ne correspond à aucune des exigences."
references:
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
