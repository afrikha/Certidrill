id: aifc01-3c-pm-optimize
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer has written a short prompt in Amazon Bedrock Prompt Management for an Anthropic Claude model. The developer wants Amazon Bedrock to analyze the prompt and rewrite it so that it is better suited to that model, and then to review the rewritten prompt next to the original before deciding which one to keep.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un développeur a rédigé une invite courte dans Amazon Bedrock Prompt Management pour un modèle Anthropic Claude. Il veut qu'Amazon Bedrock analyse l'invite et la réécrive pour qu'elle soit mieux adaptée à ce modèle, puis examiner l'invite réécrite à côté de l'originale avant de décider laquelle conserver.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Create a prompt variant with a higher temperature and compare the outputs.", fr: "Créer une variante d'invite avec une température plus élevée et comparer les sorties." } }
    - { id: b, text: { en: "Run a model distillation job that uses the prompt as training data.", fr: "Exécuter une tâche de distillation de modèle qui utilise l'invite comme données d'entraînement." } }
    - { id: c, text: { en: "Choose Optimize in the prompt builder and compare the two prompts.", fr: "Choisir Optimize dans le Prompt builder et comparer les deux invites." } }
    - { id: d, text: { en: "Create a human-based evaluation job to rate several prompt rewrites.", fr: "Créer une tâche d'évaluation humaine pour noter plusieurs réécritures de l'invite." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Prompt optimization analyzes the components of a prompt and rewrites it for the selected target model. In Prompt Management, the optimized prompt appears as a variant next to the original; you can replace the original or exit the comparison and keep it. Nothing is replaced automatically."
    fr: "L'optimisation d'invite analyse les composants d'une invite et la réécrit pour le modèle cible sélectionné. Dans Prompt Management, l'invite optimisée apparaît comme une variante à côté de l'originale ; vous pouvez remplacer l'originale ou quitter la comparaison et la conserver. Rien n'est remplacé automatiquement."
  options:
    a:
      en: "Changing the temperature changes the randomness of the output, not the wording of the prompt, and Amazon Bedrock does not rewrite anything."
      fr: "Modifier la température change le caractère aléatoire de la sortie, pas la formulation de l'invite, et Amazon Bedrock ne réécrit rien."
    b:
      en: "Distillation trains a smaller student model from a teacher model's responses; it does not rewrite a prompt."
      fr: "La distillation entraîne un modèle élève plus petit à partir des réponses d'un modèle enseignant ; elle ne réécrit pas une invite."
    d:
      en: "A human evaluation job needs a work team and written rewrites to rate; it takes far more effort and does not produce the rewrite."
      fr: "Une tâche d'évaluation humaine nécessite une équipe de travail et des réécritures déjà rédigées à noter ; elle demande beaucoup plus d'effort et ne produit pas la réécriture."
references:
  - title: Optimize a prompt
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management-optimize.html
