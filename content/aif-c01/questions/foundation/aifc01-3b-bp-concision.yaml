id: aifc01-3b-bp-concision
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Over several months, a team added rules to a prompt until it reached three pages. Some rules repeat each other and two rules contradict each other. Responses are now inconsistent, and the input token cost of each request has grown.

    What should the team do FIRST?
  fr: |
    En plusieurs mois, une équipe a ajouté des règles à une invite jusqu'à atteindre trois pages. Certaines règles se répètent et deux règles se contredisent. Les réponses sont désormais incohérentes, et le coût en jetons d'entrée de chaque requête a augmenté.

    Que doit faire l'équipe EN PREMIER ?
body:
  options:
    - { id: a, text: { en: "Add more examples so that the model can infer which rules matter.", fr: "Ajouter des exemples pour que le modèle déduise les règles qui comptent." } }
    - { id: b, text: { en: "Raise the maximum length so that the model can address every rule.", fr: "Augmenter la longueur maximale pour que le modèle puisse traiter chaque règle." } }
    - { id: c, text: { en: "Move the whole prompt into a fine-tuning dataset.", fr: "Déplacer toute l'invite dans un jeu de données de peaufinage." } }
    - { id: d, text: { en: "Rewrite the prompt concisely: remove duplicates and resolve conflicts.", fr: "Réécrire l'invite de façon concise : supprimer les doublons et résoudre les contradictions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Effective prompts are specific and concise. Overly complex prompts with redundant or contradictory instructions confuse the model and can reduce accuracy, and every extra word adds input tokens that are billed on each request."
    fr: "Une invite efficace est précise et concise. Une invite trop complexe, aux instructions redondantes ou contradictoires, embrouille le modèle et peut réduire l'exactitude, et chaque mot superflu ajoute des jetons d'entrée facturés à chaque requête."
  options:
    a:
      en: "More examples make the prompt longer and costlier, and they do not resolve contradictory rules."
      fr: "Davantage d'exemples allongent l'invite et la rendent plus coûteuse, sans résoudre les règles contradictoires."
    b:
      en: "Maximum length limits the response; it does not fix inconsistent instructions in the input."
      fr: "La longueur maximale limite la réponse ; elle ne corrige pas les instructions incohérentes de l'entrée."
    c:
      en: "Fine-tuning needs input and output examples and a training job; it is not the first step for a prompt that simply needs cleaning up."
      fr: "Le peaufinage demande des exemples d'entrées et de sorties et une tâche d'entraînement ; ce n'est pas la première étape pour une invite qu'il suffit de nettoyer."
references:
  - title: What is Prompt Engineering?
    url: https://aws.amazon.com/what-is/prompt-engineering/
  - title: Best practices to avoid prompt injection attacks
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/llm-prompt-engineering-best-practices/best-practices.html
