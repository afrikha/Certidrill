id: aifc01-3c-data-governance
objective: "3.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company is preparing a curated dataset in its Amazon S3 data lake to fine-tune a foundation model (FM). The company's data governance policy requires that only the ML team can read specific columns of the dataset and that every access to the data is recorded.

    Which combination of AWS services will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de santé prépare un jeu de données organisé dans son lac de données Amazon S3 pour peaufiner un modèle de fondation (FM). Sa politique de gouvernance des données exige que seule l'équipe ML puisse lire certaines colonnes du jeu de données et que chaque accès aux données soit enregistré.

    Quelle combinaison de services AWS répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "AWS Lake Formation" }
    - { id: b, text: "AWS Glue DataBrew" }
    - { id: c, text: "AWS CloudTrail" }
    - { id: d, text: "Amazon Inspector" }
    - { id: e, text: "AWS Artifact" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AWS Lake Formation centrally governs data lake data in Amazon S3 with fine-grained permissions at the database, table, column, row, and cell levels. Lake Formation integrates with AWS CloudTrail, which records which users or roles accessed which data, through which services, and when."
    fr: "AWS Lake Formation gouverne de façon centralisée les données d'un lac de données Amazon S3 avec des autorisations précises au niveau de la base de données, de la table, de la colonne, de la ligne et de la cellule. Lake Formation s'intègre à AWS CloudTrail, qui enregistre quels utilisateurs ou rôles ont accédé à quelles données, par quels services et à quel moment."
  options:
    b:
      en: "DataBrew cleans and normalizes data visually; it does not enforce column-level access permissions."
      fr: "DataBrew nettoie et normalise visuellement les données ; il n'applique pas d'autorisations d'accès au niveau des colonnes."
    d:
      en: "Amazon Inspector finds software vulnerabilities in workloads; it neither controls nor records data access."
      fr: "Amazon Inspector détecte des vulnérabilités logicielles dans des charges de travail ; il ne contrôle ni n'enregistre l'accès aux données."
    e:
      en: "AWS Artifact provides AWS compliance reports and agreements; it does not govern the company's datasets."
      fr: "AWS Artifact fournit les rapports et accords de conformité d'AWS ; il ne gouverne pas les jeux de données de l'entreprise."
references:
  - title: What is AWS Lake Formation?
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html
