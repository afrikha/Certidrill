id: aifc01-3b-agent-quick-nocode
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The operations team of a media company has no developers. The team wants to use AI agents in a chat interface to answer questions from the company's documents and to automate repetitive tasks across its connected business applications.

    Which AWS service will meet these requirements with the LEAST development effort?
  fr: |
    L'équipe des opérations d'une entreprise de médias n'a pas de développeurs. L'équipe veut utiliser des agents d'IA dans une interface de conversation pour répondre à des questions à partir des documents de l'entreprise et pour automatiser des tâches répétitives dans ses applications métier connectées.

    Quel service AWS répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: "Amazon Bedrock AgentCore" }
    - { id: b, text: "Amazon Lex" }
    - { id: c, text: "Amazon SageMaker AI" }
    - { id: d, text: "Amazon Quick" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Quick (named AWS Quick in the current AWS documentation) is a ready-to-use service in which business users chat with AI agents grounded in their connected data and automate tasks across applications with flows and automations. No code is required."
    fr: "Amazon Quick (nommé AWS Quick dans la documentation AWS actuelle) est un service prêt à l'emploi dans lequel les utilisateurs métier conversent avec des agents d'IA ancrés dans leurs données connectées et automatisent des tâches dans leurs applications avec des flux et des automatisations. Aucun code n'est nécessaire."
  options:
    a:
      en: "AgentCore is a platform for developers who build, deploy, and operate their own agents in code."
      fr: "AgentCore est une plateforme destinée aux développeurs qui créent, déploient et exploitent leurs propres agents en code."
    b:
      en: "Amazon Lex builds conversational interfaces around intents that developers configure; it does not provide agents over company documents and applications out of the box."
      fr: "Amazon Lex crée des interfaces conversationnelles autour d'intentions que des développeurs configurent ; il ne fournit pas d'emblée des agents sur les documents et les applications de l'entreprise."
    c:
      en: "SageMaker AI is used to build, train, and host ML models, which requires ML and development skills."
      fr: "SageMaker AI sert à créer, entraîner et héberger des modèles de ML, ce qui demande des compétences en ML et en développement."
references:
  - title: What is AWS Quick?
    url: https://docs.aws.amazon.com/quick/latest/userguide/what-is.html
