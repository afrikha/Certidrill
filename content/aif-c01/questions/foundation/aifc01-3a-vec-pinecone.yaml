id: aifc01-3a-vec-pinecone
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company already stores the embeddings of its documents in a Pinecone index. The company wants to create an Amazon Bedrock knowledge base that uses this index, without migrating the vectors.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke déjà les intégrations de ses documents dans un index Pinecone. L'entreprise veut créer une base de connaissances Amazon Bedrock qui utilise cet index, sans migrer les vecteurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Connect the knowledge base to the Pinecone index, and store the Pinecone API key in AWS Secrets Manager.", fr: "Connecter la base de connaissances à l'index Pinecone, et stocker la clé d'API Pinecone dans AWS Secrets Manager." } }
    - { id: b, text: { en: "Migrate the vectors to Amazon S3 Vectors, because knowledge bases support only AWS vector stores.", fr: "Migrer les vecteurs vers Amazon S3 Vectors, car les bases de connaissances ne prennent en charge que des magasins de vecteurs AWS." } }
    - { id: c, text: { en: "Connect the knowledge base to the Pinecone index, and store the Pinecone API key in an AWS KMS key.", fr: "Connecter la base de connaissances à l'index Pinecone, et stocker la clé d'API Pinecone dans une clé AWS KMS." } }
    - { id: d, text: { en: "Load the vectors into Amazon DocumentDB, because knowledge bases cannot read third-party indexes.", fr: "Charger les vecteurs dans Amazon DocumentDB, car les bases de connaissances ne peuvent pas lire des index tiers." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock Knowledge Bases supports third-party vector stores, including Pinecone, Redis Enterprise Cloud, and MongoDB Atlas. For Pinecone, the company stores the API key in an AWS Secrets Manager secret that the knowledge base uses, and authorizes AWS to access the index on its behalf."
    fr: "Amazon Bedrock Knowledge Bases prend en charge des magasins de vecteurs tiers, dont Pinecone, Redis Enterprise Cloud et MongoDB Atlas. Pour Pinecone, l'entreprise stocke la clé d'API dans un secret AWS Secrets Manager utilisé par la base de connaissances, et autorise AWS à accéder à l'index en son nom."
  options:
    b:
      en: "Knowledge bases are not limited to AWS vector stores; Pinecone is supported, so no migration is needed."
      fr: "Les bases de connaissances ne sont pas limitées aux magasins de vecteurs AWS ; Pinecone est pris en charge : aucune migration n'est donc nécessaire."
    c:
      en: "AWS KMS manages encryption keys; it does not store application secrets such as an API key. The knowledge base reads the key from a Secrets Manager secret."
      fr: "AWS KMS gère des clés de chiffrement ; il ne stocke pas de secrets d'application comme une clé d'API. La base de connaissances lit la clé dans un secret Secrets Manager."
    d:
      en: "Knowledge bases can use some third-party indexes, including Pinecone, and the requirement is to avoid migrating the vectors."
      fr: "Les bases de connaissances peuvent utiliser certains index tiers, dont Pinecone, et l'exigence est d'éviter de migrer les vecteurs."
references:
  - title: Prerequisites for using a vector store you created for a knowledge base
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup.html
