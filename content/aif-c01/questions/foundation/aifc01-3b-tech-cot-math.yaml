id: aifc01-3b-tech-cot-math
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An education company uses a foundation model to solve multi-step math word problems for students. The model often gives a wrong final answer. The company wants the model to work through intermediate steps and to show its reasoning before it gives the answer.

    Which prompt engineering technique will meet these requirements?
  fr: |
    Une entreprise d'enseignement utilise un modèle de fondation pour résoudre des problèmes mathématiques en plusieurs étapes pour des élèves. Le modèle donne souvent une réponse finale fausse. L'entreprise veut que le modèle passe par des étapes intermédiaires et montre son raisonnement avant de donner la réponse.

    Quelle technique d'ingénierie de requête répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Zero-shot prompting", fr: "Invite zero-shot" } }
    - { id: b, text: { en: "Prompt template", fr: "Modèle d'invite" } }
    - { id: c, text: { en: "Chain-of-thought prompting", fr: "Invite à chaîne de pensée (chain-of-thought)" } }
    - { id: d, text: { en: "Negative prompting", fr: "Invite négative" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Chain-of-thought (CoT) prompting asks the model to break a problem into intermediate steps and reason through them before the final answer, for example by adding \"Think step-by-step\". It improves accuracy on multi-step analysis, math, and complex reasoning, and makes the reasoning easy to review."
    fr: "L'invite à chaîne de pensée (CoT) demande au modèle de décomposer un problème en étapes intermédiaires et de les raisonner avant la réponse finale, par exemple en ajoutant « Réfléchis étape par étape ». Elle améliore l'exactitude pour l'analyse en plusieurs étapes, les mathématiques et le raisonnement complexe, et rend le raisonnement facile à vérifier."
  options:
    a:
      en: "Zero-shot only means that the prompt has no examples; it does not ask for intermediate reasoning."
      fr: "Zero-shot signifie seulement que l'invite ne contient pas d'exemple ; elle ne demande pas de raisonnement intermédiaire."
    b:
      en: "A prompt template makes a prompt reusable with placeholders; it does not by itself make the model reason step by step."
      fr: "Un modèle d'invite rend une invite réutilisable avec des espaces réservés ; il ne fait pas à lui seul raisonner le modèle étape par étape."
    d:
      en: "A negative prompt lists what to avoid; it does not improve multi-step reasoning."
      fr: "Une invite négative liste ce qu'il faut éviter ; elle n'améliore pas le raisonnement en plusieurs étapes."
references:
  - title: Give Amazon Nova time to think (chain-of-thought)
    url: https://docs.aws.amazon.com/nova/latest/userguide/prompting-chain-of-thought.html
