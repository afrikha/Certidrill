id: aifc01-3c-train-cost-epochs
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company fine-tunes a model in Amazon Bedrock with a training dataset of 10 million tokens and 2 epochs. To improve quality, the data science team proposes to keep the same dataset and increase the number of epochs to 4.

    How will this change affect the training charge of the customization job?
  fr: |
    Une entreprise peaufine un modèle dans Amazon Bedrock avec un jeu de données d'entraînement de 10 millions de jetons et 2 époques. Pour améliorer la qualité, l'équipe de science des données propose de garder le même jeu de données et de passer à 4 époques.

    Quel effet ce changement aura-t-il sur le coût d'entraînement de la tâche de personnalisation ?
body:
  options:
    - { id: a, text: { en: "The charge stays the same, because training is billed per customization job.", fr: "Le coût reste le même, car l'entraînement est facturé par tâche de personnalisation." } }
    - { id: b, text: { en: "The charge roughly doubles, because training is billed by the number of tokens processed.", fr: "Le coût double à peu près, car l'entraînement est facturé selon le nombre de jetons traités." } }
    - { id: c, text: { en: "The charge stays the same, because only the monthly storage of the custom model is billed.", fr: "Le coût reste le même, car seul le stockage mensuel du modèle personnalisé est facturé." } }
    - { id: d, text: { en: "The charge depends only on the Provisioned Throughput purchased for the base model.", fr: "Le coût dépend uniquement du Provisioned Throughput acheté pour le modèle de base." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Model customization training is charged by the tokens processed, which is the number of tokens in the training corpus multiplied by the number of epochs. Going from 2 to 4 epochs on the same 10 million tokens doubles the tokens processed (from 20 to 40 million). Storage of the custom model is a separate monthly charge."
    fr: "L'entraînement de la personnalisation de modèle est facturé selon les jetons traités, c'est-à-dire le nombre de jetons du corpus d'entraînement multiplié par le nombre d'époques. Passer de 2 à 4 époques sur les mêmes 10 millions de jetons double les jetons traités (de 20 à 40 millions). Le stockage du modèle personnalisé est un coût mensuel distinct."
  options:
    a:
      en: "There is no flat price per job; the training charge grows with the tokens processed."
      fr: "Il n'existe pas de prix forfaitaire par tâche ; le coût d'entraînement augmente avec les jetons traités."
    c:
      en: "Model storage is billed per model per month in addition to training, not instead of it."
      fr: "Le stockage du modèle est facturé par modèle et par mois en plus de l'entraînement, pas à sa place."
    d:
      en: "Provisioned Throughput is one way to run inference on a custom model; it is not how training is charged."
      fr: "Provisioned Throughput est une façon d'exécuter l'inférence sur un modèle personnalisé ; ce n'est pas le mode de facturation de l'entraînement."
references:
  - title: Customize your model to improve its performance for your use case
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
