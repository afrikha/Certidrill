id: aifc01-3a-cust-distill-tradeoff
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is considering Amazon Bedrock Model Distillation to replace a large foundation model (FM) in a high-volume application with a smaller student model.

    Which statement describes the cost tradeoff of distillation?
  fr: |
    Une entreprise envisage Amazon Bedrock Model Distillation pour remplacer un grand modèle de fondation (FM) d'une application à fort volume par un modèle élève plus petit.

    Quelle affirmation décrit le compromis de coût de la distillation ?
body:
  options:
    - { id: a, text: { en: "It has no upfront cost, but every request costs more because the teacher model answers it.", fr: "Elle n'a aucun coût initial, mais chaque requête coûte plus cher, car le modèle enseignant y répond." } }
    - { id: b, text: { en: "It has no training cost, because the student model only receives the teacher's prompts.", fr: "Elle n'a aucun coût d'entraînement, car le modèle élève reçoit seulement les invites de l'enseignant." } }
    - { id: c, text: { en: "It raises the cost of each request, because the student model is larger than the teacher.", fr: "Elle augmente le coût de chaque requête, car le modèle élève est plus grand que l'enseignant." } }
    - { id: d, text: { en: "It adds a one-time data generation and training cost, then lowers the cost of each request.", fr: "Elle ajoute un coût ponctuel de génération de données et d'entraînement, puis réduit le coût de chaque requête." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Distillation generates responses from the teacher model, billed at the teacher's on-demand inference rates, and fine-tunes the student model on them, which has a training charge. The resulting student is smaller, faster, and more cost-efficient, so a high-volume application recovers the one-time cost through cheaper inference."
    fr: "La distillation génère des réponses du modèle enseignant, facturées au tarif d'inférence à la demande de l'enseignant, et peaufine le modèle élève sur ces réponses, ce qui entraîne des frais d'entraînement. Le modèle élève obtenu est plus petit, plus rapide et plus économique : une application à fort volume amortit donc ce coût ponctuel grâce à une inférence moins chère."
  options:
    a:
      en: "The teacher is used only to create training data; after distillation, the application calls the smaller student model."
      fr: "L'enseignant ne sert qu'à créer les données d'entraînement ; après la distillation, l'application appelle le modèle élève plus petit."
    b:
      en: "The student model is fine-tuned on the teacher's responses, so there is a training charge, plus the teacher inference used to create the data."
      fr: "Le modèle élève est peaufiné sur les réponses de l'enseignant : il y a donc des frais d'entraînement, plus l'inférence de l'enseignant utilisée pour créer les données."
    c:
      en: "In distillation, the student is the smaller model; that is why each request costs less."
      fr: "Dans la distillation, l'élève est le modèle le plus petit ; c'est pourquoi chaque requête coûte moins cher."
references:
  - title: Customize a model with distillation in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
