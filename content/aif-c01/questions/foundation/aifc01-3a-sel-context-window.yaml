id: aifc01-3a-sel-context-window
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm wants a foundation model (FM) to summarize contracts that contain up to 250,000 tokens. Each contract must be sent to the model in a single request, without splitting it.

    Which model characteristic should the law firm compare FIRST?
  fr: |
    Un cabinet d'avocats veut qu'un modèle de fondation (FM) résume des contrats qui contiennent jusqu'à 250 000 jetons. Chaque contrat doit être envoyé au modèle en une seule requête, sans être découpé.

    Quelle caractéristique du modèle le cabinet doit-il comparer EN PREMIER ?
body:
  options:
    - { id: a, text: { en: "The default temperature of the model", fr: "La température par défaut du modèle" } }
    - { id: b, text: { en: "The embedding dimensions of the model", fr: "Les dimensions des intégrations du modèle" } }
    - { id: c, text: { en: "The image output support of the model", fr: "La prise en charge de la sortie d'images par le modèle" } }
    - { id: d, text: { en: "The context window of the model", fr: "La fenêtre contextuelle du modèle" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The context window is the maximum number of tokens that a model can process in one request, so it limits the input length. Models differ widely: for example, Amazon Nova Micro has a 128K-token context window, Nova Pro 300K, and Nova Premier 1M. A model whose context window is smaller than the contract cannot receive it in a single request."
    fr: "La fenêtre contextuelle est le nombre maximal de jetons qu'un modèle peut traiter en une requête : elle limite donc la longueur de l'entrée. Les modèles diffèrent beaucoup : par exemple, Amazon Nova Micro a une fenêtre contextuelle de 128 000 jetons, Nova Pro de 300 000 et Nova Premier de 1 million. Un modèle dont la fenêtre contextuelle est plus petite que le contrat ne peut pas le recevoir en une seule requête."
  options:
    a:
      en: "Temperature changes how random the output is; it does not change how many tokens the model can receive."
      fr: "La température modifie le caractère aléatoire de la sortie ; elle ne change pas le nombre de jetons que le modèle peut recevoir."
    b:
      en: "Embedding dimensions describe the vectors of an embeddings model; they do not limit the length of a summarization prompt."
      fr: "Les dimensions des intégrations décrivent les vecteurs d'un modèle d'intégration ; elles ne limitent pas la longueur d'une invite de résumé."
    c:
      en: "A summary is text output; image output support is not needed for this task."
      fr: "Un résumé est une sortie textuelle ; la prise en charge de la sortie d'images n'est pas nécessaire pour cette tâche."
references:
  - title: What is Amazon Nova?
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
  - title: Key terminology
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
