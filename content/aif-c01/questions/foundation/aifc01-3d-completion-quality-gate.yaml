id: aifc01-3d-completion-quality-gate
objective: "3.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company releases new versions of its AI support agent every two weeks. Each new version must be released only if its task completion rate on a curated evaluation set is at least 85 %.

    Which solution will meet this requirement?
  fr: |
    Un éditeur de logiciels publie une nouvelle version de son agent de support IA toutes les deux semaines. Chaque nouvelle version ne doit être publiée que si son taux d'achèvement des tâches sur un jeu d'évaluation organisé atteint au moins 85 %.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Enforce the 85 % target as a quality gate in the CI/CD pipeline that runs the evaluation set.", fr: "Appliquer la cible de 85 % comme contrôle qualité dans le pipeline CI/CD qui exécute le jeu d'évaluation." } }
    - { id: b, text: { en: "Check the task completion rate in production each quarter after the new versions are released.", fr: "Vérifier le taux d'achèvement des tâches en production chaque trimestre après la publication des nouvelles versions." } }
    - { id: c, text: { en: "Run the evaluation set once a month, and email the task completion rate to the team.", fr: "Exécuter le jeu d'évaluation une fois par mois, et envoyer le taux d'achèvement des tâches à l'équipe par e-mail." } }
    - { id: d, text: { en: "Set an Amazon CloudWatch alarm on the InvocationLatency metric of each new version.", fr: "Définir une alarme Amazon CloudWatch sur la métrique InvocationLatency de chaque nouvelle version." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS guidance recommends defining measurable success criteria, such as a task completion rate target, and enforcing them as CI/CD quality gates: the pipeline runs the curated evaluation set against the quality target and blocks releases that fail."
    fr: "Les recommandations AWS conseillent de définir des critères de succès mesurables, comme une cible de taux d'achèvement des tâches, et de les appliquer comme contrôles qualité CI/CD : le pipeline exécute le jeu d'évaluation organisé par rapport à la cible de qualité et bloque les publications qui échouent."
  options:
    b:
      en: "A quarterly check happens after the release, so it cannot stop a version that misses the target."
      fr: "Une vérification trimestrielle intervient après la publication : elle ne peut pas bloquer une version qui manque la cible."
    c:
      en: "A monthly report is not tied to each release and blocks nothing; versions ship every two weeks."
      fr: "Un rapport mensuel n'est pas lié à chaque publication et ne bloque rien ; les versions sortent toutes les deux semaines."
    d:
      en: "InvocationLatency is a technical latency metric; it does not measure task completion."
      fr: "InvocationLatency est une métrique technique de latence ; elle ne mesure pas l'achèvement des tâches."
references:
  - title: AGENTPERF01-BP01 Define performance-aligned success criteria for agent workloads
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentperf01-bp01.html
