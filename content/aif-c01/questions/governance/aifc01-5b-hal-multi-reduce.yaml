id: aifc01-5b-hal-multi-reduce
objective: "5.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company's internal assistant on Amazon Bedrock gives confident but incorrect answers about the company's products. The product documentation is stored in Amazon S3.

    Which actions will reduce these hallucinations? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant interne d'une entreprise, sur Amazon Bedrock, donne avec assurance des réponses incorrectes sur les produits de l'entreprise. La documentation des produits est stockée dans Amazon S3.

    Quelles actions réduiront ces hallucinations ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Ground the prompts with passages that Amazon Bedrock Knowledge Bases retrieves from the documentation.", fr: "Ancrer les invites avec des passages qu'Amazon Bedrock Knowledge Bases récupère dans la documentation." }
    - id: b
      text: { en: "Increase the temperature value of the requests.", fr: "Augmenter la valeur de temperature des requêtes." }
    - id: c
      text: { en: "Instruct the model to answer only from the supplied passages and to say when it does not know.", fr: "Demander au modèle de répondre uniquement à partir des passages fournis et de dire quand il ne sait pas." }
    - id: d
      text: { en: "Increase the top K value of the requests.", fr: "Augmenter la valeur de top K des requêtes." }
    - id: e
      text: { en: "Increase the maximum length value of the requests.", fr: "Augmenter la longueur maximale des requêtes." }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "Retrieval Augmented Generation (RAG) supplies the relevant documentation in each prompt, so the model answers from the company's facts instead of its training data. A clear instruction to answer only from that text, with a default \"I don't know\" output, keeps the model from producing plausible answers when it has low confidence."
    fr: "La génération à enrichissement contextuel (RAG) fournit la documentation pertinente dans chaque invite : le modèle répond ainsi à partir des faits de l'entreprise plutôt que de ses données d'entraînement. Une consigne claire de répondre uniquement à partir de ce texte, avec une sortie par défaut « Je ne sais pas », évite que le modèle produise des réponses plausibles quand sa confiance est faible."
  options:
    b:
      en: "A higher temperature makes the output more random, which does not reduce invented content."
      fr: "Une température plus élevée rend la sortie plus aléatoire, ce qui ne réduit pas le contenu inventé."
    d:
      en: "A higher top K lets the model choose among more, less likely tokens; it does not add knowledge."
      fr: "Un top K plus élevé laisse le modèle choisir parmi davantage de jetons moins probables ; il n'apporte aucune connaissance."
    e:
      en: "A longer maximum length only allows longer answers; it does not make them more accurate."
      fr: "Une longueur maximale plus grande permet seulement des réponses plus longues ; elle ne les rend pas plus exactes."
references:
  - title: Query a knowledge base and generate responses based off the retrieved data
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-retrieve-generate.html
  - title: Design a prompt
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/design-a-prompt.html
