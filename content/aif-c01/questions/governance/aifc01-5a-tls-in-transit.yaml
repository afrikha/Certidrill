id: aifc01-5a-tls-in-transit
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on Amazon EC2 sends customer questions to the Amazon Bedrock API and receives the model's answers.

    Which mechanism protects the prompts and responses while they travel between the application and the Amazon Bedrock endpoint?
  fr: |
    Une application sur Amazon EC2 envoie des questions de clients à l'API Amazon Bedrock et reçoit les réponses du modèle.

    Quel mécanisme protège les invites et les réponses pendant leur transit entre l'application et le point de terminaison Amazon Bedrock ?
body:
  options:
    - { id: a, text: { en: "Server-side encryption with AWS KMS keys (SSE-KMS)", fr: "Le chiffrement côté serveur avec des clés AWS KMS (SSE-KMS)" } }
    - { id: b, text: { en: "S3 Object Lock in compliance mode", fr: "S3 Object Lock en mode conformité (compliance)" } }
    - { id: c, text: { en: "An Amazon Macie sensitive data discovery job", fr: "Une tâche de découverte des données sensibles Amazon Macie" } }
    - { id: d, text: { en: "Transport Layer Security (TLS) encryption", fr: "Le chiffrement TLS (Transport Layer Security)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Data in transit to AWS service endpoints is protected with SSL/TLS. AWS requires TLS 1.2 and recommends TLS 1.3 for communication with AWS resources, including the Amazon Bedrock API."
    fr: "Les données en transit vers les points de terminaison des services AWS sont protégées par SSL/TLS. AWS exige TLS 1.2 et recommande TLS 1.3 pour communiquer avec les ressources AWS, y compris l'API Amazon Bedrock."
  options:
    a:
      en: "SSE-KMS encrypts data at rest in a service such as Amazon S3, not data moving over the network."
      fr: "SSE-KMS chiffre les données au repos dans un service comme Amazon S3, pas les données qui circulent sur le réseau."
    b:
      en: "Object Lock prevents stored objects from being deleted or overwritten; it does not encrypt network traffic."
      fr: "Object Lock empêche la suppression ou l'écrasement des objets stockés ; il ne chiffre pas le trafic réseau."
    c:
      en: "Macie finds sensitive data in S3 objects; it does not protect API traffic."
      fr: "Macie trouve des données sensibles dans les objets S3 ; il ne protège pas le trafic des API."
references:
  - title: Data protection
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
