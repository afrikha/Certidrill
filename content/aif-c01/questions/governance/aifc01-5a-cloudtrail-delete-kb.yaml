id: aifc01-5a-cloudtrail-delete-kb
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon Bedrock knowledge base was deleted in a company's AWS account last week. The security team must find out which IAM principal deleted it, at what time, and from which IP address.

    Which AWS service provides this information?
  fr: |
    Une base de connaissances Amazon Bedrock a été supprimée la semaine dernière dans le compte AWS d'une entreprise. L'équipe de sécurité doit savoir quel principal IAM l'a supprimée, à quelle heure et depuis quelle adresse IP.

    Quel service AWS fournit ces informations ?
body:
  options:
    - { id: a, text: "AWS CloudTrail" }
    - { id: b, text: { en: "Amazon Bedrock model invocation logging", fr: "La journalisation des invocations de modèle Amazon Bedrock" } }
    - { id: c, text: "Amazon Inspector" }
    - { id: d, text: "Amazon Macie" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS CloudTrail captures Amazon Bedrock API calls as events. Each event records who made the request (userIdentity), when (eventTime), the source IP address and the request parameters. Most Bedrock operations, such as deleting a knowledge base, are management events that CloudTrail logs by default, and recent events can be searched in Event history without a trail."
    fr: "AWS CloudTrail enregistre les appels d'API Amazon Bedrock sous forme d'événements. Chaque événement indique qui a fait la requête (userIdentity), quand (eventTime), l'adresse IP source et les paramètres de la requête. La plupart des opérations Bedrock, comme la suppression d'une base de connaissances, sont des événements de gestion que CloudTrail journalise par défaut, et les événements récents peuvent être recherchés dans l'historique des événements (Event history) sans journal de suivi."
  options:
    b:
      en: "Model invocation logging records the requests and responses of model calls such as InvokeModel and Converse, not management operations such as deleting a knowledge base."
      fr: "La journalisation des invocations de modèle enregistre les requêtes et les réponses des appels de modèle comme InvokeModel et Converse, pas les opérations de gestion comme la suppression d'une base de connaissances."
    c:
      en: "Inspector scans workloads for software vulnerabilities; it does not record API activity."
      fr: "Inspector analyse les charges de travail à la recherche de vulnérabilités logicielles ; il n'enregistre pas l'activité des API."
    d:
      en: "Macie discovers sensitive data in Amazon S3; it does not record who called which API."
      fr: "Macie découvre des données sensibles dans Amazon S3 ; il n'enregistre pas qui a appelé quelle API."
references:
  - title: Monitor Amazon Bedrock API calls using CloudTrail
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
