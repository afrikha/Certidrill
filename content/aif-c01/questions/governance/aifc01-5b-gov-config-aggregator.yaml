id: aifc01-5b-gov-config-aggregator
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs AI workloads in 12 AWS accounts and three AWS Regions. AWS Config rules are already deployed in every account. The governance team wants to view the configuration and compliance data of all the accounts and Regions from a single account.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des charges de travail d'IA dans 12 comptes AWS et trois Régions AWS. Des règles AWS Config sont déjà déployées dans chaque compte. L'équipe de gouvernance veut consulter les données de configuration et de conformité de tous les comptes et de toutes les Régions depuis un seul compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Download the AWS compliance reports from AWS Artifact in each of the accounts.", fr: "Télécharger les rapports de conformité AWS depuis AWS Artifact dans chacun des comptes." }
    - id: b
      text: { en: "Create an AWS Config aggregator in the account of the governance team.", fr: "Créer un agrégateur AWS Config dans le compte de l'équipe de gouvernance." }
    - id: c
      text: { en: "Create an AWS CloudTrail Lake event data store in each of the accounts.", fr: "Créer un magasin de données d'événements AWS CloudTrail Lake dans chacun des comptes." }
    - id: d
      text: { en: "Run the AWS Trusted Advisor checks in each account and compare the results.", fr: "Exécuter les vérifications AWS Trusted Advisor dans chaque compte et comparer les résultats." }
answer: { optionId: b }
explanation:
  correct:
    en: "An AWS Config aggregator collects configuration and compliance data from multiple accounts and Regions into a single account and Region. The governance team can then review the compliance status of all the rules in one place."
    fr: "Un agrégateur AWS Config collecte les données de configuration et de conformité de plusieurs comptes et Régions dans un seul compte et une seule Région. L'équipe de gouvernance peut ensuite examiner l'état de conformité de toutes les règles en un seul endroit."
  options:
    a:
      en: "Artifact reports describe AWS's own controls, not the compliance status of the company's resources."
      fr: "Les rapports d'Artifact décrivent les contrôles d'AWS, pas l'état de conformité des ressources de l'entreprise."
    c:
      en: "CloudTrail Lake stores API activity; a separate data store per account also gives no central view of rule compliance."
      fr: "CloudTrail Lake stocke l'activité des API ; un magasin distinct par compte ne donne pas non plus de vue centrale de la conformité aux règles."
    d:
      en: "Trusted Advisor runs AWS best-practice checks, not the company's Config rules, and comparing accounts by hand is no single view."
      fr: "Trusted Advisor exécute des vérifications de bonnes pratiques AWS, pas les règles Config de l'entreprise, et comparer les comptes à la main ne constitue pas une vue unique."
references:
  - title: What Is AWS Config?
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
