id: aifc01-5a-ord-catalog-dataset
objective: "5.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A retail company stores sales data as CSV files in Amazon S3. Data scientists must find the dataset and its schema in a central catalog and query it with SQL before they use it for model training.

    Which three steps should the company perform in sequence? To answer, select the appropriate steps from the list and arrange them in the correct order.
  fr: |
    Une entreprise de distribution stocke des données de ventes sous forme de fichiers CSV dans Amazon S3. Les scientifiques des données doivent trouver le jeu de données et son schéma dans un catalogue central, puis l'interroger en SQL avant de l'utiliser pour entraîner un modèle.

    Quelles sont les trois étapes que l'entreprise doit effectuer dans l'ordre ? Pour répondre, sélectionnez les étapes appropriées dans la liste et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: macie
      text: { en: "Create an Amazon Macie job that infers the schema of the CSV files.", fr: "Créer une tâche Amazon Macie qui déduit le schéma des fichiers CSV." }
    - id: query
      text: { en: "Query the cataloged table with Amazon Athena.", fr: "Interroger la table cataloguée avec Amazon Athena." }
    - id: create
      text: { en: "Create an AWS Glue crawler that points to the S3 location of the data.", fr: "Créer un crawler AWS Glue qui pointe vers l'emplacement S3 des données." }
    - id: card
      text: { en: "Record the dataset schema in an Amazon SageMaker model card.", fr: "Consigner le schéma du jeu de données dans une carte de modèle Amazon SageMaker." }
    - id: run
      text: { en: "Run the crawler so that it creates a table with the inferred schema in the AWS Glue Data Catalog.", fr: "Exécuter le crawler pour qu'il crée une table avec le schéma déduit dans le catalogue de données AWS Glue." }
answer:
  sequence: [create, run, query]
explanation:
  correct:
    en: "A crawler is first defined on the S3 location of the data. When it runs, it scans the files, extracts their metadata and creates a table with the schema in the AWS Glue Data Catalog. Amazon Athena then uses the catalog's table metadata to query the S3 data with SQL."
    fr: "Un crawler est d'abord défini sur l'emplacement S3 des données. Lorsqu'il s'exécute, il analyse les fichiers, extrait leurs métadonnées et crée une table avec le schéma dans le catalogue de données AWS Glue. Amazon Athena utilise ensuite les métadonnées de la table du catalogue pour interroger les données S3 en SQL."
  options:
    macie:
      en: "Macie discovers sensitive data in S3 objects; it does not infer schemas or create catalog tables."
      fr: "Macie découvre des données sensibles dans les objets S3 ; il ne déduit pas de schémas et ne crée pas de tables de catalogue."
    card:
      en: "Model cards document models; they are not a data catalog and Athena cannot query them."
      fr: "Les cartes de modèle documentent des modèles ; elles ne constituent pas un catalogue de données et Athena ne peut pas les interroger."
references:
  - title: Data discovery and cataloging in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
