id: aifc01-5b-hal-cg-low-relevance
objective: "5.1.5"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    An online retailer uses Amazon Bedrock Guardrails contextual grounding checks in its support assistant. For one request, the grounding source says: "Refunds are issued within 14 days. Standard delivery takes 5 days." The customer asks: "How long does a refund take?" The model responds: "Standard delivery takes 5 days."

    How will the contextual grounding check most likely score this response?
  fr: |
    Un détaillant en ligne utilise les vérifications de l'ancrage contextuel (contextual grounding checks) d'Amazon Bedrock Guardrails dans son assistant de support. Pour une requête, la source d'ancrage indique : « Les remboursements sont effectués sous 14 jours. La livraison standard prend 5 jours. » Le client demande : « Combien de temps prend un remboursement ? » Le modèle répond : « La livraison standard prend 5 jours. »

    Comment la vérification de l'ancrage contextuel notera-t-elle très probablement cette réponse ?
body:
  options:
    - id: a
      text: { en: "High grounding score and high relevance score", fr: "Score d'ancrage élevé et score de pertinence élevé" }
    - id: b
      text: { en: "Low grounding score and high relevance score", fr: "Score d'ancrage faible et score de pertinence élevé" }
    - id: c
      text: { en: "High grounding score and low relevance score", fr: "Score d'ancrage élevé et score de pertinence faible" }
    - id: d
      text: { en: "Low grounding score and low relevance score", fr: "Score d'ancrage faible et score de pertinence faible" }
answer: { optionId: c }
explanation:
  correct:
    en: "The grounding score measures whether the response is based on the source, and the relevance score measures whether it answers the query. The response repeats a fact that is in the source, so it is grounded, but it does not answer the question about refunds, so its relevance score is low."
    fr: "Le score d'ancrage mesure si la réponse s'appuie sur la source, et le score de pertinence mesure si elle répond à la requête. La réponse reprend un fait présent dans la source : elle est donc ancrée. Mais elle ne répond pas à la question sur les remboursements : son score de pertinence est donc faible."
  options:
    a:
      en: "A high relevance score would mean that the response answers the refund question, which it does not."
      fr: "Un score de pertinence élevé signifierait que la réponse traite la question sur les remboursements, ce qui n'est pas le cas."
    b:
      en: "This pattern fits a response that answers the question with a fact that is not in the source, such as \"Refunds take 30 days.\""
      fr: "Ce profil correspond à une réponse qui traite la question avec un fait absent de la source, comme « Les remboursements prennent 30 jours. »"
    d:
      en: "The delivery time is stated in the source, so the response is not ungrounded."
      fr: "Le délai de livraison figure dans la source : la réponse n'est donc pas dépourvue d'ancrage."
references:
  - title: Use contextual grounding check to filter hallucinations in responses
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
