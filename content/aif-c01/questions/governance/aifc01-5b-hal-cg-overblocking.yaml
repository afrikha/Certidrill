id: aifc01-5b-hal-cg-overblocking
objective: "5.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank configured an Amazon Bedrock guardrail with a contextual grounding check. The grounding filter uses the BLOCK action with a threshold of 0.95. Testers report that many correct answers that paraphrase the source documents are blocked. The bank wants fewer correct answers to be blocked while clearly ungrounded answers are still blocked.

    What should the bank do?
  fr: |
    Une banque a configuré un garde-fou (guardrail) Amazon Bedrock avec une vérification de l'ancrage contextuel. Le filtre d'ancrage utilise l'action BLOCK avec un seuil de 0,95. Les testeurs signalent que de nombreuses réponses correctes qui reformulent les documents sources sont bloquées. La banque veut que moins de réponses correctes soient bloquées, tout en continuant à bloquer les réponses clairement non ancrées.

    Que doit faire la banque ?
body:
  options:
    - id: a
      text: { en: "Lower the grounding threshold and retest the guardrail with representative questions.", fr: "Abaisser le seuil d'ancrage et tester de nouveau le garde-fou avec des questions représentatives." }
    - id: b
      text: { en: "Raise the grounding threshold to 1 so that only fully grounded answers are allowed.", fr: "Relever le seuil d'ancrage à 1 pour n'autoriser que les réponses entièrement ancrées." }
    - id: c
      text: { en: "Change the grounding filter action to NONE so that all responses reach users with detection data.", fr: "Passer l'action du filtre d'ancrage à NONE pour que toutes les réponses parviennent aux utilisateurs avec les données de détection." }
    - id: d
      text: { en: "Raise the relevance threshold so that the grounding filter evaluates fewer responses.", fr: "Relever le seuil de pertinence pour que le filtre d'ancrage évalue moins de réponses." }
answer: { optionId: a }
explanation:
  correct:
    en: "Grounding thresholds range from 0 to 0.99. A higher threshold blocks more ungrounded content but also increases the chance of over-blocking. Lowering the threshold reduces false blocks, and retesting confirms that clearly ungrounded answers are still blocked."
    fr: "Les seuils d'ancrage vont de 0 à 0,99. Un seuil plus élevé bloque davantage de contenu non ancré, mais augmente aussi le risque de blocage excessif. Abaisser le seuil réduit les blocages injustifiés, et un nouveau test confirme que les réponses clairement non ancrées restent bloquées."
  options:
    b:
      en: "A threshold of 1 is invalid because it would block all content."
      fr: "Un seuil de 1 n'est pas valide, car il bloquerait tout le contenu."
    c:
      en: "With the NONE action, no response is blocked, so clearly ungrounded answers would reach users."
      fr: "Avec l'action NONE, aucune réponse n'est bloquée : des réponses clairement non ancrées parviendraient donc aux utilisateurs."
    d:
      en: "Relevance and grounding are separate filters; a stricter relevance threshold blocks more responses, not fewer."
      fr: "Pertinence et ancrage sont des filtres distincts ; un seuil de pertinence plus strict bloque davantage de réponses, pas moins."
references:
  - title: Use contextual grounding check to filter hallucinations in responses
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
