id: aifc01-5b-gp-ai-service-cards
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A development team plans to use an AWS AI service in a customer-facing application. To meet the company's transparency standard, the team must document the service's intended use cases, limitations, and responsible AI design choices by using information that AWS publishes.

    Which resource should the team use?
  fr: |
    Une équipe de développement prévoit d'utiliser un service d'IA AWS dans une application destinée aux clients. Pour respecter la norme de transparence de l'entreprise, l'équipe doit documenter les cas d'usage prévus du service, ses limites et ses choix de conception en matière d'IA responsable, à partir d'informations publiées par AWS.

    Quelle ressource l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "AWS Artifact reports", fr: "Rapports AWS Artifact" } }
    - { id: b, text: "AWS AI Service Cards" }
    - { id: c, text: "Amazon SageMaker Model Cards" }
    - { id: d, text: { en: "AWS Trusted Advisor checks", fr: "Vérifications AWS Trusted Advisor" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS AI Service Cards are a transparency resource: they give one place to find the intended use cases and limitations, the responsible AI design choices, and the performance optimization best practices of AWS AI services and models."
    fr: "Les AWS AI Service Cards sont une ressource de transparence : elles réunissent en un seul endroit les cas d'usage prévus et les limites, les choix de conception en matière d'IA responsable et les bonnes pratiques d'optimisation des performances des services et modèles d'IA d'AWS."
  options:
    a:
      en: "Artifact reports document AWS security and compliance controls, not the intended uses and limitations of an AI service."
      fr: "Les rapports d'Artifact documentent les contrôles de sécurité et de conformité d'AWS, pas les usages prévus ni les limites d'un service d'IA."
    c:
      en: "SageMaker Model Cards are documents that the company creates for its own models; they are not information that AWS publishes about its services."
      fr: "Les SageMaker Model Cards sont des documents que l'entreprise crée pour ses propres modèles ; ce ne sont pas des informations publiées par AWS sur ses services."
    d:
      en: "Trusted Advisor checks the account against best practices; it does not describe AI services."
      fr: "Trusted Advisor vérifie le compte par rapport aux bonnes pratiques ; il ne décrit pas les services d'IA."
references:
  - title: Responsible AI Tools and Resources
    url: https://aws.amazon.com/ai/responsible-ai/resources/
  - title: Amazon SageMaker Model Cards
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
