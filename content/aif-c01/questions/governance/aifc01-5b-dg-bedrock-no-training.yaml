id: aifc01-5b-dg-bedrock-no-training
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before employees send confidential contracts in prompts to a third-party foundation model on Amazon Bedrock, a company's legal team reviews how Amazon Bedrock handles this data.

    Which statement about the company's prompts and model responses is correct?
  fr: |
    Avant que des employés envoient des contrats confidentiels dans des invites à un modèle de fondation tiers sur Amazon Bedrock, l'équipe juridique d'une entreprise examine la façon dont Amazon Bedrock traite ces données.

    Quelle affirmation sur les invites et les réponses du modèle de l'entreprise est correcte ?
body:
  options:
    - id: a
      text: { en: "They are shared with the model provider so that it can improve its model.", fr: "Elles sont partagées avec le fournisseur du modèle pour qu'il puisse améliorer son modèle." }
    - id: b
      text: { en: "They are not used to train the base models and are not shared with model providers.", fr: "Elles ne servent pas à entraîner les modèles de base et ne sont pas partagées avec les fournisseurs de modèles." }
    - id: c
      text: { en: "They are used to train Amazon Nova models unless the company opts out.", fr: "Elles servent à entraîner les modèles Amazon Nova, sauf si l'entreprise s'y oppose (opt-out)." }
    - id: d
      text: { en: "They are stored in the model provider's AWS account so that it can audit usage.", fr: "Elles sont stockées dans le compte AWS du fournisseur du modèle pour qu'il puisse auditer l'utilisation." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS and third-party model providers do not use the inputs to or outputs from Amazon Bedrock to train their models, and inputs and outputs are not shared with model providers. Models run in deployment accounts that the Amazon Bedrock service team owns, and model providers have no access to them. Content is stored at rest in the Region where the company uses Amazon Bedrock."
    fr: "AWS et les fournisseurs de modèles tiers n'utilisent pas les entrées ni les sorties d'Amazon Bedrock pour entraîner leurs modèles, et les entrées et sorties ne sont pas partagées avec les fournisseurs de modèles. Les modèles s'exécutent dans des comptes de déploiement qui appartiennent à l'équipe du service Amazon Bedrock, et les fournisseurs de modèles n'y ont pas accès. Le contenu est stocké au repos dans la Région où l'entreprise utilise Amazon Bedrock."
  options:
    a:
      en: "Model providers have no access to customer prompts and completions."
      fr: "Les fournisseurs de modèles n'ont pas accès aux invites ni aux réponses des clients."
    c:
      en: "Amazon Bedrock inputs and outputs are not used to train Amazon Nova or any other base model; no opt-out is needed."
      fr: "Les entrées et sorties d'Amazon Bedrock ne servent à entraîner ni Amazon Nova ni aucun autre modèle de base ; aucune opposition n'est nécessaire."
    d:
      en: "Model deployment accounts are owned and operated by the Amazon Bedrock service team, not by model providers."
      fr: "Les comptes de déploiement des modèles appartiennent à l'équipe du service Amazon Bedrock, qui les exploite, et non aux fournisseurs de modèles."
references:
  - title: Amazon Bedrock FAQs
    url: https://aws.amazon.com/bedrock/faqs/
  - title: Data protection
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
