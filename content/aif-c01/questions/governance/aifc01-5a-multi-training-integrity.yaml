id: aifc01-5a-multi-training-integrity
objective: "5.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company fine-tunes a model every week with data that comes from several internal systems. The company wants to protect the integrity of the training data against accidental corruption and against poisoning.

    Which practices will meet this requirement? (Choose two.)
  fr: |
    Une entreprise effectue chaque semaine un réglage précis (fine-tuning) d'un modèle avec des données provenant de plusieurs systèmes internes. Elle veut protéger l'intégrité des données d'entraînement contre une corruption accidentelle et contre l'empoisonnement.

    Quelles pratiques répondent à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Validate incoming data against data quality rules before adding it to the training dataset.", fr: "Valider les données entrantes par rapport à des règles de qualité avant de les ajouter au jeu de données d'entraînement." } }
    - { id: b, text: { en: "Let every team write directly to the training data bucket to speed up updates.", fr: "Permettre à chaque équipe d'écrire directement dans le compartiment des données d'entraînement pour accélérer les mises à jour." } }
    - { id: c, text: { en: "Deliver the data through a pipeline and allow only the pipeline's IAM role to write it.", fr: "Livrer les données par un pipeline et n'autoriser que le rôle IAM du pipeline à les écrire." } }
    - { id: d, text: { en: "Increase the number of training epochs so that bad records have less influence.", fr: "Augmenter le nombre d'époques d'entraînement pour que les mauvais enregistrements aient moins d'influence." } }
    - { id: e, text: { en: "Raise the model's temperature at inference time to compensate for bad records.", fr: "Augmenter la température du modèle au moment de l'inférence pour compenser les mauvais enregistrements." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Unvetted data from other systems can enable poisoning or misinformation attacks, so AWS recommends data quality measures and validation before data is used for training. Delivering fine-tuning data through a pipeline and removing human write access limits who can change the data."
    fr: "Des données non vérifiées provenant d'autres systèmes peuvent permettre des attaques par empoisonnement ou par désinformation : AWS recommande donc des mesures de qualité des données et une validation avant l'utilisation des données pour l'entraînement. Livrer les données de réglage précis par un pipeline et supprimer l'accès en écriture des humains limite qui peut modifier les données."
  options:
    b:
      en: "Broad write access increases the number of people and systems that can corrupt or poison the data."
      fr: "Un large accès en écriture augmente le nombre de personnes et de systèmes qui peuvent corrompre ou empoisonner les données."
    d:
      en: "More epochs make the model learn the training data, including bad records, more closely; they do not remove the bad records."
      fr: "Davantage d'époques font apprendre plus fidèlement les données d'entraînement au modèle, y compris les mauvais enregistrements ; elles ne les suppriment pas."
    e:
      en: "Temperature only changes the randomness of generated output; it has no effect on the training data."
      fr: "La température ne modifie que le caractère aléatoire de la sortie générée ; elle n'a aucun effet sur les données d'entraînement."
references:
  - title: 5. Data security and governance for agentic AI systems on AWS
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/best-practices-data.html
  - title: MLSEC05-BP01 Protect against adversarial and malicious activities
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlsec05-bp01.html
