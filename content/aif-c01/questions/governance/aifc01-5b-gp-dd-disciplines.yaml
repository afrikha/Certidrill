id: aifc01-5b-gp-dd-disciplines
objective: "5.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company builds an application on a third-party foundation model, which is Scope 3 of the Generative AI Security Scoping Matrix.

    Which security discipline of the matrix does each activity belong to? To answer, drag the appropriate disciplines to the correct activities. Each discipline may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise crée une application sur un modèle de fondation tiers, ce qui correspond au scope 3 de la matrice de cadrage de la sécurité de l'IA générative (Generative AI Security Scoping Matrix).

    À quelle discipline de sécurité de la matrice chaque activité appartient-elle ? Pour répondre, faites glisser les disciplines appropriées vers les activités correspondantes. Chaque discipline peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gov, text: { en: "Governance and compliance", fr: "Gouvernance et conformité" } }
    - { id: legal, text: { en: "Legal and privacy", fr: "Juridique et confidentialité" } }
    - { id: risk, text: { en: "Risk management", fr: "Gestion des risques" } }
    - { id: ctl, text: { en: "Controls", fr: "Contrôles" } }
    - { id: res, text: { en: "Resilience", fr: "Résilience" } }
    - { id: cost, text: { en: "Cost optimization", fr: "Optimisation des coûts" } }
  targets:
    - id: t1
      text: { en: "Review the end-user license agreement and terms of both the service provider and the model provider", fr: "Examiner le contrat de licence utilisateur final et les conditions du fournisseur de service comme du fournisseur du modèle" }
    - id: t2
      text: { en: "Threat model the application for prompt injection", fr: "Modéliser les menaces d'injection d'invite sur l'application" }
    - id: t3
      text: { en: "Apply least-privilege access to data before it is added to an inference request", fr: "Appliquer le moindre privilège aux données avant leur ajout à une requête d'inférence" }
    - id: t4
      text: { en: "Use backoff and retry, and plan high availability for the vector database", fr: "Utiliser des tentatives avec temporisation (backoff and retry) et prévoir la haute disponibilité de la base de données vectorielle" }
    - id: t5
      text: { en: "Create the policies, procedures, and reporting that enable the business while limiting risk", fr: "Créer les politiques, procédures et rapports qui permettent l'activité tout en limitant les risques" }
answer:
  mapping: { t1: legal, t2: risk, t3: ctl, t4: res, t5: gov }
explanation:
  correct:
    en: "The matrix has five security disciplines. Legal and privacy covers the EULA and terms of the service and model providers. Risk management identifies threats, such as prompt injection, through risk assessments and threat modeling. Controls enforce requirements, such as least-privilege access to data before it reaches the model. Resilience covers availability: timeouts, backoff and retry, and high availability for vector databases. Governance and compliance covers policies, procedures, and reporting. Cost optimization is a Well-Architected pillar, not a discipline of the matrix."
    fr: "La matrice comporte cinq disciplines de sécurité. Juridique et confidentialité couvre le contrat de licence utilisateur final et les conditions des fournisseurs de service et de modèle. La gestion des risques identifie les menaces, comme l'injection d'invite, par des évaluations des risques et une modélisation des menaces. Les contrôles appliquent les exigences, comme l'accès aux données selon le moindre privilège avant qu'elles n'atteignent le modèle. La résilience couvre la disponibilité : délais d'expiration, tentatives avec temporisation et haute disponibilité des bases de données vectorielles. Gouvernance et conformité couvre les politiques, procédures et rapports. L'optimisation des coûts est un pilier du Well-Architected Framework, pas une discipline de la matrice."
references:
  - title: "Securing Generative AI: The Generative AI Security Scoping Matrix"
    url: https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/
