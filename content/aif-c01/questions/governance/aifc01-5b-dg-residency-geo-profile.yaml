id: aifc01-5b-dg-residency-geo-profile
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A European company calls Amazon Bedrock from the eu-central-1 Region, and some requests are throttled during peaks. Regulations require inference requests to be processed only in AWS Regions within the EU. The company wants Amazon Bedrock to route requests across several Regions to absorb the peaks.

    Which solution will meet these requirements?
  fr: |
    Une entreprise européenne appelle Amazon Bedrock depuis la Région eu-central-1, et certaines requêtes sont limitées (throttling) pendant les pics. La réglementation exige que les requêtes d'inférence soient traitées uniquement dans des Régions AWS situées dans l'UE. L'entreprise veut qu'Amazon Bedrock répartisse les requêtes sur plusieurs Régions pour absorber les pics.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Call the model through a global cross-Region inference profile.", fr: "Appeler le modèle via un profil d'inférence entre Régions (cross-Region inference) global." }
    - id: b
      text: { en: "Send the overflow requests directly to the model in the us-east-1 Region.", fr: "Envoyer les requêtes excédentaires directement au modèle dans la Région us-east-1." }
    - id: c
      text: { en: "Call the model through an EU geographic cross-Region inference profile.", fr: "Appeler le modèle via un profil d'inférence entre Régions géographique UE." }
    - id: d
      text: { en: "Use an EU geographic profile during peaks and a global profile at other times.", fr: "Utiliser un profil géographique UE pendant les pics et un profil global le reste du temps." }
answer: { optionId: c }
explanation:
  correct:
    en: "A geographic cross-Region inference profile lets Amazon Bedrock route each request to a Region within the chosen geography, such as the EU, so data processing stays within those boundaries. Data moved between Regions stays on the AWS network and is encrypted in transit, and CloudTrail logs the request in the source Region."
    fr: "Un profil d'inférence entre Régions géographique permet à Amazon Bedrock d'acheminer chaque requête vers une Région de la zone choisie, comme l'UE : le traitement des données reste dans ces limites. Les données transférées entre Régions restent sur le réseau AWS et sont chiffrées en transit, et CloudTrail journalise la requête dans la Région source."
  options:
    a:
      en: "A global profile can process requests in any supported commercial Region worldwide, which breaks the EU-only rule."
      fr: "Un profil global peut traiter les requêtes dans n'importe quelle Région commerciale prise en charge dans le monde, ce qui enfreint la règle UE uniquement."
    b:
      en: "us-east-1 is outside the EU, so these requests would break the regulation."
      fr: "us-east-1 est hors de l'UE : ces requêtes enfreindraient la réglementation."
    d:
      en: "Outside the peaks, the global profile could still send requests to Regions outside the EU."
      fr: "En dehors des pics, le profil global pourrait encore envoyer des requêtes vers des Régions hors de l'UE."
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
