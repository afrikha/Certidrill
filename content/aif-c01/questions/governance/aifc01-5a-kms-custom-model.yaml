id: aifc01-5a-kms-custom-model
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company will fine-tune a foundation model in Amazon Bedrock with proprietary data. The security team requires that the company manage the key that encrypts the resulting custom model, audit every use of that key, and be able to revoke Amazon Bedrock's access to the custom model at any time.

    Which solution will meet these requirements?
  fr: |
    Une entreprise va peaufiner (fine-tuning) un modèle de fondation dans Amazon Bedrock avec des données propriétaires. L'équipe de sécurité exige que l'entreprise gère la clé qui chiffre le modèle personnalisé obtenu, qu'elle audite chaque utilisation de cette clé et qu'elle puisse révoquer à tout moment l'accès d'Amazon Bedrock au modèle personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the default encryption of the custom model, which uses an AWS owned key.", fr: "Conserver le chiffrement par défaut du modèle personnalisé, qui utilise une clé détenue par AWS." } }
    - { id: b, text: { en: "Encrypt the training data in Amazon S3 with SSE-KMS and keep the default encryption of the custom model.", fr: "Chiffrer les données d'entraînement dans Amazon S3 avec SSE-KMS et conserver le chiffrement par défaut du modèle personnalisé." } }
    - { id: c, text: { en: "Specify a customer managed AWS KMS key when the company creates the model customization job.", fr: "Spécifier une clé AWS KMS gérée par le client lors de la création de la tâche de personnalisation du modèle." } }
    - { id: d, text: { en: "Store the custom model's encryption key in AWS Secrets Manager with automatic rotation.", fr: "Stocker la clé de chiffrement du modèle personnalisé dans AWS Secrets Manager avec rotation automatique." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock encrypts custom models with AWS owned keys by default. When the company specifies a customer managed KMS key for the customization job, it controls the key policy, can track the KMS requests that Bedrock sends with AWS CloudTrail, and can remove Bedrock's access by changing the key policy, after which Bedrock cannot use the custom model."
    fr: "Amazon Bedrock chiffre par défaut les modèles personnalisés avec des clés détenues par AWS. Lorsque l'entreprise spécifie une clé KMS gérée par le client pour la tâche de personnalisation, elle contrôle la politique de clé, peut suivre avec AWS CloudTrail les requêtes KMS envoyées par Bedrock et peut retirer l'accès de Bedrock en modifiant la politique de clé ; Bedrock ne peut alors plus utiliser le modèle personnalisé."
  options:
    a:
      en: "The company cannot view, manage or audit the use of an AWS owned key, so it cannot meet any of the three requirements."
      fr: "L'entreprise ne peut ni voir, ni gérer, ni auditer l'utilisation d'une clé détenue par AWS : aucune des trois exigences n'est satisfaite."
    b:
      en: "SSE-KMS protects the training data in the bucket, but the custom model itself would still be encrypted with an AWS owned key."
      fr: "SSE-KMS protège les données d'entraînement dans le compartiment, mais le modèle personnalisé lui-même resterait chiffré avec une clé détenue par AWS."
    d:
      en: "Secrets Manager stores secrets such as credentials and API keys; AWS recommends AWS KMS for encryption keys, and Bedrock takes a KMS key for custom model encryption."
      fr: "Secrets Manager stocke des secrets comme des identifiants et des clés d'API ; AWS recommande AWS KMS pour les clés de chiffrement, et Bedrock attend une clé KMS pour chiffrer un modèle personnalisé."
references:
  - title: Encryption of custom models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/encryption-custom-job.html
  - title: Data encryption
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-encryption.html
