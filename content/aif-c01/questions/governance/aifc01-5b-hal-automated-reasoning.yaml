id: aifc01-5b-hal-automated-reasoning
objective: "5.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A health insurance company has a chatbot on Amazon Bedrock that answers questions about coverage eligibility. The eligibility rules are written in a policy document. For each answer, the company needs a verifiable explanation, based on formal logic, that shows which rules make the answer valid or invalid.

    Which solution will meet these requirements?
  fr: |
    Une mutuelle santé dispose d'un chatbot sur Amazon Bedrock qui répond à des questions sur l'éligibilité aux garanties. Les règles d'éligibilité sont rédigées dans un document de politique. Pour chaque réponse, l'entreprise a besoin d'une explication vérifiable, fondée sur la logique formelle, qui montre quelles règles rendent la réponse valide ou non valide.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add Automated Reasoning checks, built from the policy document, to an Amazon Bedrock guardrail.", fr: "Ajouter à une barrière de protection (guardrail) Amazon Bedrock des vérifications par raisonnement automatisé (Automated Reasoning checks) créées à partir du document de politique." }
    - id: b
      text: { en: "Add a contextual grounding check to an Amazon Bedrock guardrail, with the policy document as the grounding source.", fr: "Ajouter à une barrière de protection Amazon Bedrock une vérification de l'ancrage contextuel, avec le document de politique comme source d'ancrage." }
    - id: c
      text: { en: "Add the policy document to a knowledge base in Amazon Bedrock Knowledge Bases and display the citations.", fr: "Ajouter le document de politique à une base de connaissances Amazon Bedrock Knowledge Bases et afficher les citations." }
    - id: d
      text: { en: "Add a denied topic to an Amazon Bedrock guardrail for the questions that the policy document does not cover.", fr: "Ajouter à une barrière de protection Amazon Bedrock un sujet refusé pour les questions que le document de politique ne couvre pas." }
answer: { optionId: a }
explanation:
  correct:
    en: "Automated Reasoning checks turn a source document into a policy of formal logic rules and validate responses against it with mathematical techniques. They return findings such as VALID or INVALID with explanations that cite the rules and variable assignments behind the result. They only detect: the application decides whether to serve, rewrite, or reject the response."
    fr: "Les vérifications par raisonnement automatisé transforment un document source en une politique de règles de logique formelle et valident les réponses par rapport à elle avec des techniques mathématiques. Elles renvoient des résultats comme VALID ou INVALID, avec des explications qui citent les règles et les affectations de variables à l'origine du résultat. Elles se contentent de détecter : l'application décide de servir, de réécrire ou de rejeter la réponse."
  options:
    b:
      en: "A contextual grounding check returns grounding and relevance scores, not a logical explanation of which rules make an answer valid."
      fr: "Une vérification de l'ancrage contextuel renvoie des scores d'ancrage et de pertinence, pas une explication logique des règles qui rendent une réponse valide."
    c:
      en: "Citations show which passages were retrieved; they do not prove that the answer follows the eligibility rules."
      fr: "Les citations indiquent quels passages ont été récupérés ; elles ne prouvent pas que la réponse respecte les règles d'éligibilité."
    d:
      en: "Denied topics block subjects; they do not validate answers against rules."
      fr: "Les sujets refusés bloquent des sujets ; ils ne valident pas les réponses par rapport à des règles."
references:
  - title: What are Automated Reasoning checks in Amazon Bedrock Guardrails?
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
  - title: Create your guardrail
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-components.html
