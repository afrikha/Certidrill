id: aifc01-5b-gov-cloudtrail-kb-data-events
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Amazon Bedrock Knowledge Bases. Its compliance rules require an audit record of every Retrieve and RetrieveAndGenerate call, including the caller identity. The company has an AWS CloudTrail trail that logs management events only, and the audit team cannot find these calls.

    What should the company do?
  fr: |
    Une entreprise utilise Amazon Bedrock Knowledge Bases. Ses règles de conformité exigent un enregistrement d'audit de chaque appel Retrieve et RetrieveAndGenerate, avec l'identité de l'appelant. L'entreprise dispose d'un journal de suivi (trail) AWS CloudTrail qui ne journalise que les événements de gestion, et l'équipe d'audit ne trouve pas ces appels.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Search the CloudTrail event history, which records every Amazon Bedrock call by default.", fr: "Rechercher dans l'historique des événements CloudTrail, qui enregistre par défaut chaque appel Amazon Bedrock." }
    - id: b
      text: { en: "Enable Amazon Bedrock model invocation logging with an Amazon S3 destination.", fr: "Activer la journalisation des appels de modèle Amazon Bedrock avec une destination Amazon S3." }
    - id: c
      text: { en: "Add advanced event selectors to the trail to log data events for the AWS::Bedrock::KnowledgeBase resource type.", fr: "Ajouter au journal de suivi des sélecteurs d'événements avancés pour journaliser les événements de données du type de ressource AWS::Bedrock::KnowledgeBase." }
    - id: d
      text: { en: "Create an AWS Config rule that records each call made to the knowledge base.", fr: "Créer une règle AWS Config qui enregistre chaque appel adressé à la base de connaissances." }
answer: { optionId: c }
explanation:
  correct:
    en: "Retrieve and RetrieveAndGenerate are CloudTrail data events for the AWS::Bedrock::KnowledgeBase resource type. Data events are not logged by default: they must be enabled with advanced event selectors, and they incur additional CloudTrail charges. Each event then records the identity, time, and source of the call."
    fr: "Retrieve et RetrieveAndGenerate sont des événements de données CloudTrail du type de ressource AWS::Bedrock::KnowledgeBase. Les événements de données ne sont pas journalisés par défaut : il faut les activer avec des sélecteurs d'événements avancés, et ils entraînent des frais CloudTrail supplémentaires. Chaque événement enregistre ensuite l'identité, l'heure et l'origine de l'appel."
  options:
    a:
      en: "Event history contains management events only, and these knowledge base calls are data events."
      fr: "L'historique des événements ne contient que des événements de gestion, et ces appels à la base de connaissances sont des événements de données."
    b:
      en: "Invocation logging captures model invocations such as InvokeModel and Converse; it is not the audit record of knowledge base API calls."
      fr: "La journalisation des appels capture les appels de modèle comme InvokeModel et Converse ; ce n'est pas l'enregistrement d'audit des appels d'API de la base de connaissances."
    d:
      en: "Config records and evaluates resource configurations; it does not record API calls."
      fr: "Config enregistre et évalue les configurations des ressources ; il n'enregistre pas les appels d'API."
references:
  - title: Monitor Amazon Bedrock API calls using CloudTrail
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
