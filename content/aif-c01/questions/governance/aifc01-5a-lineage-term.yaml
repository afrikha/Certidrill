id: aifc01-5a-lineage-term
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AI governance policy requires the team to record where each piece of training data comes from and every transformation that it goes through before it reaches the model.

    Which term describes this practice?
  fr: |
    La politique de gouvernance de l'IA d'une entreprise impose à l'équipe d'enregistrer d'où provient chaque donnée d'entraînement et chaque transformation qu'elle subit avant d'atteindre le modèle.

    Quel terme désigne cette pratique ?
body:
  options:
    - { id: a, text: { en: "Data cataloging", fr: "Catalogage des données" } }
    - { id: b, text: { en: "Data lineage", fr: "Traçabilité des données (data lineage)" } }
    - { id: c, text: { en: "Data augmentation", fr: "Augmentation des données" } }
    - { id: d, text: { en: "Data drift", fr: "Dérive des données" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Data lineage traces the origin of data and the chain of transformations and connections between assets. It lets a team explain and reproduce how a dataset was built, and find which models used a given source."
    fr: "La traçabilité des données retrace l'origine des données et la chaîne de transformations et de liens entre les ressources. Elle permet à une équipe d'expliquer et de reproduire la construction d'un jeu de données, et de retrouver les modèles qui ont utilisé une source donnée."
  options:
    a:
      en: "Data cataloging builds an inventory of datasets with their location and schema; it does not follow each transformation from the source to the model."
      fr: "Le catalogage des données constitue un inventaire des jeux de données avec leur emplacement et leur schéma ; il ne suit pas chaque transformation de la source jusqu'au modèle."
    c:
      en: "Data augmentation creates additional training examples, for example by modifying existing images; it does not record origins."
      fr: "L'augmentation des données crée des exemples d'entraînement supplémentaires, par exemple en modifiant des images existantes ; elle n'enregistre pas les origines."
    d:
      en: "Data drift is a change in the distribution of production data compared with the training data, not a documentation practice."
      fr: "La dérive des données est une évolution de la distribution des données de production par rapport aux données d'entraînement, pas une pratique de documentation."
references:
  - title: Data lineage in Amazon SageMaker Unified Studio
    url: https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/datazone-data-lineage.html
