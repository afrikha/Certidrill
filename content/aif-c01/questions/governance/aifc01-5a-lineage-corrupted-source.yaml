id: aifc01-5a-lineage-corrupted-source
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company retrains several models every month with data from many sources. The company discovers that one source sent corrupted records during the last three months. The company must quickly identify every model that was trained with data from that source.

    Which practice makes this possible?
  fr: |
    Une entreprise réentraîne plusieurs modèles chaque mois avec des données provenant de nombreuses sources. Elle découvre qu'une source a envoyé des enregistrements corrompus au cours des trois derniers mois. Elle doit identifier rapidement chaque modèle qui a été entraîné avec des données de cette source.

    Quelle pratique le permet ?
body:
  options:
    - { id: a, text: { en: "Assigning a risk rating to each model in its model card", fr: "Attribuer un niveau de risque à chaque modèle dans sa carte de modèle" } }
    - { id: b, text: { en: "Maintaining data lineage from each source to the models trained with it", fr: "Maintenir la traçabilité des données de chaque source jusqu'aux modèles entraînés avec elle" } }
    - { id: c, text: { en: "Keeping the current schema of each dataset in a central data catalog", fr: "Conserver le schéma actuel de chaque jeu de données dans un catalogue de données central" } }
    - { id: d, text: { en: "Encrypting each dataset with a separate customer managed AWS KMS key", fr: "Chiffrer chaque jeu de données avec une clé AWS KMS gérée par le client distincte" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Data lineage records the chain from each data source through its transformations to the datasets, training jobs and models that consumed it. Following that chain from the corrupted source shows every affected model, which can then be retrained on clean data."
    fr: "La traçabilité des données enregistre la chaîne qui va de chaque source de données, à travers ses transformations, jusqu'aux jeux de données, aux tâches d'entraînement et aux modèles qui l'ont utilisée. Suivre cette chaîne depuis la source corrompue révèle chaque modèle concerné, qui peut ensuite être réentraîné sur des données saines."
  options:
    a:
      en: "A risk rating describes how risky a model is; it does not record which data sources fed each training run."
      fr: "Un niveau de risque indique le degré de risque d'un modèle ; il n'enregistre pas les sources de données de chaque entraînement."
    c:
      en: "A data catalog shows what datasets exist and their current schema, but not which models were trained with which versions of them."
      fr: "Un catalogue de données montre quels jeux de données existent et leur schéma actuel, mais pas quels modèles ont été entraînés avec quelles versions de ces jeux."
    d:
      en: "Separate keys protect the data at rest but do not show how the data flowed into the models."
      fr: "Des clés distinctes protègent les données au repos, mais ne montrent pas comment les données ont été utilisées par les modèles."
references:
  - title: Amazon SageMaker ML Lineage Tracking
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html
  - title: 5. Data security and governance for agentic AI systems on AWS
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/best-practices-data.html
