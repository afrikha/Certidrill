id: aifc01-5b-gov-artifact-soc-report
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company plans to use Amazon Bedrock. Its auditors ask for the latest AWS System and Organization Controls (SOC) reports so that they can review the AWS controls that apply to the service.

    Which AWS service should the company use to obtain these reports?
  fr: |
    Une entreprise de services financiers prévoit d'utiliser Amazon Bedrock. Ses auditeurs demandent les derniers rapports SOC (System and Organization Controls) d'AWS pour examiner les contrôles AWS qui s'appliquent au service.

    Quel service AWS l'entreprise doit-elle utiliser pour obtenir ces rapports ?
body:
  options:
    - { id: a, text: "AWS Config" }
    - { id: b, text: "AWS Artifact" }
    - { id: c, text: "AWS CloudTrail" }
    - { id: d, text: "AWS Trusted Advisor" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Artifact provides on-demand downloads of AWS security and compliance documents, such as SOC, ISO, and PCI reports, free of charge. The company can submit these documents to its auditors. Amazon Bedrock is in the scope of the AWS SOC 1, 2, and 3 reports."
    fr: "AWS Artifact permet de télécharger à la demande, gratuitement, les documents de sécurité et de conformité d'AWS, comme les rapports SOC, ISO et PCI. L'entreprise peut remettre ces documents à ses auditeurs. Amazon Bedrock fait partie du périmètre des rapports SOC 1, 2 et 3 d'AWS."
  options:
    a:
      en: "AWS Config records and evaluates the configuration of the company's own resources; it does not provide AWS audit reports."
      fr: "AWS Config enregistre et évalue la configuration des ressources de l'entreprise ; il ne fournit pas les rapports d'audit d'AWS."
    c:
      en: "CloudTrail records API activity in the company's account, not third-party audit reports about AWS."
      fr: "CloudTrail enregistre l'activité des API dans le compte de l'entreprise, pas des rapports d'audit tiers sur AWS."
    d:
      en: "Trusted Advisor gives best-practice recommendations for the account; it does not provide compliance reports."
      fr: "Trusted Advisor fournit des recommandations de bonnes pratiques pour le compte ; il ne fournit pas de rapports de conformité."
references:
  - title: What is AWS Artifact?
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
  - title: Amazon Bedrock FAQs
    url: https://aws.amazon.com/bedrock/faqs/
