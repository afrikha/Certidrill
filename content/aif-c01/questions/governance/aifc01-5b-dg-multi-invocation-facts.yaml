id: aifc01-5b-dg-multi-invocation-facts
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company plans to enable Amazon Bedrock model invocation logging to meet its data governance requirements.

    Which statements about model invocation logging are correct? (Choose two.)
  fr: |
    Une entreprise prévoit d'activer la journalisation des appels de modèle Amazon Bedrock pour répondre à ses exigences de gouvernance des données.

    Quelles affirmations sur la journalisation des appels de modèle sont correctes ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "It is disabled by default, so the company must enable it.", fr: "Elle est désactivée par défaut : l'entreprise doit donc l'activer." }
    - id: b
      text: { en: "It logs only metadata, such as the model ID and token counts.", fr: "Elle ne journalise que des métadonnées, comme l'ID du modèle et le nombre de jetons." }
    - id: c
      text: { en: "Its destinations must be in the same account and Region as the logging configuration.", fr: "Ses destinations doivent se trouver dans le même compte et la même Région que la configuration de journalisation." }
    - id: d
      text: { en: "It is enabled by default and keeps the logs for 90 days.", fr: "Elle est activée par défaut et conserve les journaux pendant 90 jours." }
    - id: e
      text: { en: "It can deliver the logs to an S3 bucket in any AWS Region.", fr: "Elle peut livrer les journaux dans un compartiment S3 de n'importe quelle Région AWS." }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "Model invocation logging is disabled by default and must be enabled in the Amazon Bedrock settings or through the API. Only Amazon S3 and CloudWatch Logs destinations in the same account and Region as the logging configuration are supported."
    fr: "La journalisation des appels de modèle est désactivée par défaut et doit être activée dans les paramètres d'Amazon Bedrock ou par l'API. Seules des destinations Amazon S3 et CloudWatch Logs situées dans le même compte et la même Région que la configuration de journalisation sont prises en charge."
  options:
    b:
      en: "It records the full request and response data in addition to the metadata."
      fr: "Elle enregistre l'intégralité des données de requête et de réponse, en plus des métadonnées."
    d:
      en: "It is disabled by default, and it sets no 90-day limit: how long logs are kept depends on the destination, such as the log group retention setting."
      fr: "Elle est désactivée par défaut et n'impose aucune limite de 90 jours : la durée de conservation dépend de la destination, comme le paramètre de conservation du groupe de journaux."
    e:
      en: "The S3 bucket must be in the same account and Region as the logging configuration."
      fr: "Le compartiment S3 doit se trouver dans le même compte et la même Région que la configuration de journalisation."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
