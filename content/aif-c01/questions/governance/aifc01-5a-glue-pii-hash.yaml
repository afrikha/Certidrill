id: aifc01-5a-glue-pii-hash
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An ecommerce company prepares a training dataset with an AWS Glue Studio ETL job. The data scientists must not be able to read the customers' email addresses. However, each customer must keep the same value in every table so that the data scientists can still join the tables on the email column.

    Which action of the Detect PII transform should the company use for the email column?
  fr: |
    Une entreprise de commerce en ligne prépare un jeu de données d'entraînement avec une tâche ETL AWS Glue Studio. Les scientifiques des données ne doivent pas pouvoir lire les adresses e-mail des clients. Cependant, chaque client doit conserver la même valeur dans toutes les tables pour que les scientifiques des données puissent toujours joindre les tables sur la colonne d'e-mail.

    Quelle action de la transformation Detect PII l'entreprise doit-elle utiliser pour la colonne d'e-mail ?
body:
  options:
    - { id: a, text: { en: "Apply cryptographic hash", fr: "Apply cryptographic hash (hachage cryptographique)" } }
    - { id: b, text: { en: "Redact detected text", fr: "Redact detected text (masquage du texte détecté)" } }
    - { id: c, text: { en: "Enrich data with detection results", fr: "Enrich data with detection results (enrichissement avec les résultats de détection)" } }
    - { id: d, text: { en: "Partially redact detected text", fr: "Partially redact detected text (masquage partiel du texte détecté)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Apply cryptographic hash action replaces each detected value with its SHA-256 hash. The same email address always produces the same hash, so the tables can still be joined, while the original address cannot be read. This is a form of pseudonymization that keeps the data useful for machine learning."
    fr: "L'action Apply cryptographic hash remplace chaque valeur détectée par son hachage SHA-256. La même adresse e-mail produit toujours le même hachage : les tables peuvent donc toujours être jointes, alors que l'adresse d'origine ne peut pas être lue. C'est une forme de pseudonymisation qui conserve l'utilité des données pour le machine learning."
  options:
    b:
      en: "Redaction replaces every detected value with the same string (******* by default), so different customers get identical values and the joins no longer work."
      fr: "Le masquage remplace chaque valeur détectée par la même chaîne (******* par défaut) : des clients différents obtiennent des valeurs identiques et les jointures ne fonctionnent plus."
    c:
      en: "Enriching the data adds a column with the detection results but leaves the email addresses readable."
      fr: "L'enrichissement ajoute une colonne avec les résultats de détection, mais laisse les adresses e-mail lisibles."
    d:
      en: "Partial redaction leaves the ends of each value unmasked, so parts of the addresses stay readable and different addresses can end up with the same masked value."
      fr: "Le masquage partiel laisse les extrémités de chaque valeur visibles : une partie des adresses reste lisible et des adresses différentes peuvent aboutir à la même valeur masquée."
references:
  - title: Detect and process sensitive data
    url: https://docs.aws.amazon.com/glue/latest/dg/detect-PII.html
  - title: MLSEC02-BP01 Design data encryption and obfuscation
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlsec02-bp01.html
