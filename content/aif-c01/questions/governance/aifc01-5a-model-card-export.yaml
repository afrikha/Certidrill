id: aifc01-5a-model-card-export
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company documents its models in Amazon SageMaker model cards. External regulators must review the model cards, but the company does not want to give the regulators any access to its AWS accounts.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une compagnie d'assurance documente ses modèles dans des cartes de modèle Amazon SageMaker. Des régulateurs externes doivent examiner ces cartes, mais la compagnie ne veut leur donner aucun accès à ses comptes AWS.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create IAM users with read-only SageMaker AI permissions for the regulators.", fr: "Créer pour les régulateurs des utilisateurs IAM avec des autorisations SageMaker AI en lecture seule." } }
    - { id: b, text: { en: "Copy the content of each card into the table descriptions of the AWS Glue Data Catalog.", fr: "Copier le contenu de chaque carte dans les descriptions de tables du catalogue de données AWS Glue." } }
    - { id: c, text: { en: "Download the AWS CloudTrail events for each card and send them to the regulators.", fr: "Télécharger les événements AWS CloudTrail de chaque carte et les envoyer aux régulateurs." } }
    - { id: d, text: { en: "Export each model card to a PDF file and share the files with the regulators.", fr: "Exporter chaque carte de modèle dans un fichier PDF et partager ces fichiers avec les régulateurs." } }
answer: { optionId: d }
explanation:
  correct:
    en: "After a model card is created, it can be exported to PDF or downloaded to share with stakeholders. Sharing the exported files gives the regulators the full documentation without granting them access to the company's AWS accounts."
    fr: "Une fois créée, une carte de modèle peut être exportée en PDF ou téléchargée pour être partagée avec les parties prenantes. Partager les fichiers exportés donne aux régulateurs toute la documentation sans leur accorder d'accès aux comptes AWS de la compagnie."
  options:
    a:
      en: "IAM users give the regulators access to the AWS accounts, which the company does not want."
      fr: "Des utilisateurs IAM donnent aux régulateurs un accès aux comptes AWS, ce que la compagnie ne veut pas."
    b:
      en: "Copying content into the Data Catalog is manual work, and the regulators would still need AWS access to read it."
      fr: "Copier le contenu dans le catalogue de données est un travail manuel, et les régulateurs auraient toujours besoin d'un accès AWS pour le lire."
    c:
      en: "CloudTrail events show who called which API, not the documented intended uses, risk rating and evaluation results."
      fr: "Les événements CloudTrail montrent qui a appelé quelle API, pas les utilisations prévues, le niveau de risque et les résultats d'évaluation documentés."
references:
  - title: Amazon SageMaker Model Cards
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
