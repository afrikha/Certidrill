id: aifc01-5b-gp-scope-model-classification
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A hospital fine-tunes a foundation model with patient records that are classified as highly confidential. Several internal teams will use the resulting model. The hospital follows the governance guidance of the Generative AI Security Scoping Matrix.

    How should the hospital classify the fine-tuned model?
  fr: |
    Un hôpital peaufine (fine-tuning) un modèle de fondation avec des dossiers de patients classés hautement confidentiels. Plusieurs équipes internes utiliseront le modèle obtenu. L'hôpital suit les recommandations de gouvernance de la matrice de cadrage de la sécurité de l'IA générative (Generative AI Security Scoping Matrix).

    Comment l'hôpital doit-il classer le modèle peaufiné ?
body:
  options:
    - id: a
      text: { en: "At the sensitivity level of the base model, because the provider trained it on its own data.", fr: "Au niveau de sensibilité du modèle de base, car le fournisseur l'a entraîné sur ses propres données." }
    - id: b
      text: { en: "At the lowest sensitivity level of its users, so that every internal team can use it.", fr: "Au niveau de sensibilité le plus bas de ses utilisateurs, pour que toutes les équipes internes puissent l'utiliser." }
    - id: c
      text: { en: "At the highest sensitivity level of its training data, with inference access restricted accordingly.", fr: "Au niveau de sensibilité le plus élevé de ses données d'entraînement, avec un accès à l'inférence restreint en conséquence." }
    - id: d
      text: { en: "Without any classification, because Amazon Bedrock trains a private copy of the model.", fr: "Sans aucune classification, car Amazon Bedrock entraîne une copie privée du modèle." }
answer: { optionId: c }
explanation:
  correct:
    en: "For fine-tuned and self-trained models (Scopes 4 and 5), the matrix says that the resulting model should be classified at the highest sensitivity level of its training data, and that access to inference should be restricted accordingly. Sensitive data that only some users may see is better supplied at inference time, for example through RAG with access controls."
    fr: "Pour les modèles peaufinés et entraînés par l'organisation (scopes 4 et 5), la matrice indique que le modèle obtenu doit être classé au niveau de sensibilité le plus élevé de ses données d'entraînement, et que l'accès à l'inférence doit être restreint en conséquence. Les données sensibles que seuls certains utilisateurs peuvent voir sont mieux fournies au moment de l'inférence, par exemple via un RAG doté de contrôles d'accès."
  options:
    a:
      en: "The fine-tuned model has learned from the confidential records, so the base model's level no longer applies."
      fr: "Le modèle peaufiné a appris à partir des dossiers confidentiels : le niveau du modèle de base ne s'applique donc plus."
    b:
      en: "Classifying by the users' level would expose confidential data to teams that are not allowed to see it."
      fr: "Classer selon le niveau des utilisateurs exposerait des données confidentielles à des équipes qui n'ont pas le droit de les voir."
    d:
      en: "A private copy keeps the model away from the provider, but internal access still has to match the sensitivity of the training data."
      fr: "Une copie privée tient le modèle à l'écart du fournisseur, mais l'accès interne doit toujours correspondre à la sensibilité des données d'entraînement."
references:
  - title: "Securing Generative AI: The Generative AI Security Scoping Matrix"
    url: https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/
