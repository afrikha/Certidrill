id: aifc01-5b-dg-invocation-logging-large
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A marketing company enabled Amazon Bedrock model invocation logging with an Amazon CloudWatch Logs destination only. The company generates images and sends long documents in its prompts. Its retention policy requires the complete input and output of every call, including image outputs and JSON bodies larger than 100 KB.

    What should the company do?
  fr: |
    Une entreprise de marketing a activé la journalisation des appels de modèle Amazon Bedrock avec une seule destination Amazon CloudWatch Logs. L'entreprise génère des images et envoie de longs documents dans ses invites. Sa politique de conservation exige l'entrée et la sortie complètes de chaque appel, y compris les images produites et les corps JSON de plus de 100 Ko.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Increase the retention period of the CloudWatch Logs log group.", fr: "Augmenter la période de conservation du groupe de journaux CloudWatch Logs." }
    - id: b
      text: { en: "Add an Amazon S3 destination in another AWS Region for a second copy.", fr: "Ajouter une destination Amazon S3 dans une autre Région AWS pour une seconde copie." }
    - id: c
      text: { en: "Enable AWS CloudTrail data events for the Amazon Bedrock calls.", fr: "Activer les événements de données AWS CloudTrail pour les appels Amazon Bedrock." }
    - id: d
      text: { en: "Add an Amazon S3 destination in the same AWS account and Region.", fr: "Ajouter une destination Amazon S3 dans le même compte et la même Région AWS." }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudWatch Logs receives JSON bodies of up to 100 KB. Larger bodies and binary data, such as images, are stored as separate objects in the S3 bucket, so an S3 destination is required for them. Invocation logging supports only destinations in the same account and Region as the logging configuration."
    fr: "CloudWatch Logs reçoit des corps JSON de 100 Ko au maximum. Les corps plus volumineux et les données binaires, comme les images, sont stockés sous forme d'objets distincts dans le compartiment S3 : une destination S3 est donc nécessaire pour eux. La journalisation des appels ne prend en charge que des destinations situées dans le même compte et la même Région que la configuration de journalisation."
  options:
    a:
      en: "Retention controls how long the log events are kept, not which data is captured."
      fr: "La conservation détermine combien de temps les événements de journal sont gardés, pas quelles données sont capturées."
    b:
      en: "Invocation logging does not support destinations in another Region."
      fr: "La journalisation des appels ne prend pas en charge les destinations situées dans une autre Région."
    c:
      en: "CloudTrail events record metadata about the calls, not the full input and output bodies."
      fr: "Les événements CloudTrail enregistrent des métadonnées sur les appels, pas l'intégralité des corps d'entrée et de sortie."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
