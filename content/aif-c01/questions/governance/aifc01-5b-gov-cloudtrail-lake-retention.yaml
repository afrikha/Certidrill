id: aifc01-5b-gov-cloudtrail-lake-retention
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must keep an immutable record of all API activity related to its AI workloads for 7 years. Auditors must be able to run queries on this activity without the company building its own data pipeline.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit conserver pendant 7 ans un enregistrement immuable de toute l'activité des API liée à ses charges de travail d'IA. Les auditeurs doivent pouvoir exécuter des requêtes sur cette activité sans que l'entreprise crée son propre pipeline de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use the CloudTrail event history that AWS provides automatically in each account.", fr: "Utiliser l'historique des événements CloudTrail qu'AWS fournit automatiquement dans chaque compte." }
    - id: b
      text: { en: "Create an AWS Config aggregator and run advanced queries on the resource configurations.", fr: "Créer un agrégateur AWS Config et exécuter des requêtes avancées sur les configurations des ressources." }
    - id: c
      text: { en: "Create an AWS CloudTrail Lake event data store with a 7-year retention period.", fr: "Créer un magasin de données d'événements AWS CloudTrail Lake avec une période de conservation de 7 ans." }
    - id: d
      text: { en: "Turn on all AWS Trusted Advisor checks and export the results every month.", fr: "Activer toutes les vérifications AWS Trusted Advisor et exporter les résultats chaque mois." }
answer: { optionId: c }
explanation:
  correct:
    en: "CloudTrail Lake is a managed data lake that stores events in immutable event data stores and lets auditors query them directly. Depending on the pricing option, retention can reach 2,557 days (about 7 years) or 3,653 days (about 10 years)."
    fr: "CloudTrail Lake est un lac de données géré qui stocke les événements dans des magasins de données d'événements immuables et permet aux auditeurs de les interroger directement. Selon l'option tarifaire, la conservation peut atteindre 2 557 jours (environ 7 ans) ou 3 653 jours (environ 10 ans)."
  options:
    a:
      en: "Event history covers only the past 90 days of management events."
      fr: "L'historique des événements ne couvre que les 90 derniers jours d'événements de gestion."
    b:
      en: "Config advanced queries return the configuration state of resources, not the history of API activity."
      fr: "Les requêtes avancées de Config renvoient l'état de configuration des ressources, pas l'historique de l'activité des API."
    d:
      en: "Trusted Advisor results are best-practice recommendations, not a record of API activity."
      fr: "Les résultats de Trusted Advisor sont des recommandations de bonnes pratiques, pas un enregistrement de l'activité des API."
references:
  - title: What Is AWS CloudTrail?
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html
