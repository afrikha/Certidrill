id: aifc01-5b-gov-artifact-customer-evidence
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an AI application on Amazon Bedrock and downloads the AWS ISO certification reports from AWS Artifact. A regulator then asks the company to demonstrate that its own application meets the regulation.

    Which statement is correct?
  fr: |
    Une entreprise exécute une application d'IA sur Amazon Bedrock et télécharge les rapports de certification ISO d'AWS depuis AWS Artifact. Un régulateur demande ensuite à l'entreprise de démontrer que sa propre application respecte la réglementation.

    Quelle affirmation est correcte ?
body:
  options:
    - id: a
      text: { en: "The company must develop or obtain its own documents that demonstrate the compliance of its application.", fr: "L'entreprise doit élaborer ou obtenir ses propres documents qui démontrent la conformité de son application." }
    - id: b
      text: { en: "The AWS reports demonstrate the compliance of every application that runs on the AWS services in scope.", fr: "Les rapports AWS démontrent la conformité de toute application qui s'exécute sur les services AWS du périmètre." }
    - id: c
      text: { en: "AWS Artifact generates a compliance report for the company's application after it accepts an agreement.", fr: "AWS Artifact génère un rapport de conformité pour l'application de l'entreprise une fois qu'elle a accepté un accord." }
    - id: d
      text: { en: "AWS Trusted Advisor issues a compliance certificate for the application when all its checks pass.", fr: "AWS Trusted Advisor délivre un certificat de conformité pour l'application quand toutes ses vérifications réussissent." }
answer: { optionId: a }
explanation:
  correct:
    en: "Artifact documents cover the AWS controls and can be submitted to auditors or regulators as audit artifacts. Under the shared responsibility model, customers remain responsible for developing or obtaining the documents that demonstrate the security and compliance of their own workloads."
    fr: "Les documents d'Artifact couvrent les contrôles d'AWS et peuvent être remis aux auditeurs ou aux régulateurs comme pièces d'audit. Selon le modèle de responsabilité partagée, les clients restent responsables d'élaborer ou d'obtenir les documents qui démontrent la sécurité et la conformité de leurs propres charges de travail."
  options:
    b:
      en: "AWS reports cover the AWS side of the shared responsibility model, not how each customer configures and uses the services."
      fr: "Les rapports AWS couvrent la part d'AWS dans le modèle de responsabilité partagée, pas la façon dont chaque client configure et utilise les services."
    c:
      en: "Artifact lets customers review and accept agreements with AWS and download AWS documents; it does not certify customer applications."
      fr: "Artifact permet d'examiner et d'accepter des accords avec AWS et de télécharger des documents AWS ; il ne certifie pas les applications des clients."
    d:
      en: "Trusted Advisor gives best-practice recommendations; it issues no compliance certificate."
      fr: "Trusted Advisor fournit des recommandations de bonnes pratiques ; il ne délivre aucun certificat de conformité."
references:
  - title: What is AWS Artifact?
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
