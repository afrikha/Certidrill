id: aifc01-5b-dg-agentcore-observability
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs AI agents on Amazon Bedrock AgentCore in production. The operations team must inspect each step of an agent's workflow to find failures and bottlenecks, and must track latency, token usage, and error rates on dashboards.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des agents d'IA sur Amazon Bedrock AgentCore en production. L'équipe d'exploitation doit inspecter chaque étape du flux de travail d'un agent pour trouver les échecs et les goulets d'étranglement, et doit suivre la latence, la consommation de jetons et les taux d'erreur dans des tableaux de bord.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use AgentCore Observability, which sends the traces and metrics to Amazon CloudWatch.", fr: "Utiliser AgentCore Observability, qui envoie les traces et les métriques vers Amazon CloudWatch." }
    - id: b
      text: { en: "Use the AWS CloudTrail event history to review the AgentCore API calls.", fr: "Utiliser l'historique des événements AWS CloudTrail pour examiner les appels d'API AgentCore." }
    - id: c
      text: { en: "Use AWS Config to record the configuration history of the agents.", fr: "Utiliser AWS Config pour enregistrer l'historique de configuration des agents." }
    - id: d
      text: { en: "Use the AWS Trusted Advisor performance checks for the account.", fr: "Utiliser les vérifications de performances AWS Trusted Advisor du compte." }
answer: { optionId: a }
explanation:
  correct:
    en: "AgentCore Observability traces each step of an agent's workflow, with OpenTelemetry-compatible telemetry, so teams can inspect the execution path and find bottlenecks and failures. Its CloudWatch dashboards track session count, latency, duration, token usage, and error rates, and all metrics, spans, and logs are stored in Amazon CloudWatch."
    fr: "AgentCore Observability trace chaque étape du flux de travail d'un agent, avec une télémétrie compatible OpenTelemetry : les équipes peuvent inspecter le chemin d'exécution et trouver les goulets d'étranglement et les échecs. Ses tableaux de bord CloudWatch suivent le nombre de sessions, la latence, la durée, la consommation de jetons et les taux d'erreur, et toutes les métriques, étendues (spans) et journaux sont stockés dans Amazon CloudWatch."
  options:
    b:
      en: "CloudTrail shows who performed API actions and when, not the internal steps or token usage of an agent's workflow."
      fr: "CloudTrail indique qui a effectué des actions d'API et quand, pas les étapes internes ni la consommation de jetons du flux de travail d'un agent."
    c:
      en: "Config records resource configurations, not the run-time behavior of agents."
      fr: "Config enregistre les configurations des ressources, pas le comportement des agents à l'exécution."
    d:
      en: "Trusted Advisor performance checks review account resources against best practices; they do not trace agent workflows."
      fr: "Les vérifications de performances de Trusted Advisor comparent les ressources du compte aux bonnes pratiques ; elles ne tracent pas les flux de travail des agents."
references:
  - title: Observability, audit logging, and tracing for your agents
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability.html
