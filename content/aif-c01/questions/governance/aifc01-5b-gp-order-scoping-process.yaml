id: aifc01-5b-gp-order-scoping-process
objective: "5.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company wants to apply the Generative AI Security Scoping Matrix to a new generative AI use case.

    Which four steps should the company perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise veut appliquer la matrice de cadrage de la sécurité de l'IA générative (Generative AI Security Scoping Matrix) à un nouveau cas d'usage d'IA générative.

    Quelles sont les quatre étapes que l'entreprise doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: impl
      text: { en: "Implement the controls that the prioritized disciplines require, such as least-privilege access to data.", fr: "Mettre en œuvre les contrôles exigés par les disciplines prioritaires, comme l'accès aux données selon le principe du moindre privilège." }
    - id: same
      text: { en: "Apply the same set of controls to every use case without classifying it.", fr: "Appliquer le même ensemble de contrôles à chaque cas d'usage sans le classer." }
    - id: scope
      text: { en: "Determine which scope of the matrix the use case fits into.", fr: "Déterminer à quel niveau (scope) de la matrice correspond le cas d'usage." }
    - id: rev
      text: { en: "Reassess the controls as threats and data sensitivity change.", fr: "Réévaluer les contrôles à mesure que les menaces et la sensibilité des données évoluent." }
    - id: ft
      text: { en: "Fine-tune the model before deciding which scope applies.", fr: "Peaufiner (fine-tuning) le modèle avant de décider quel niveau s'applique." }
    - id: prio
      text: { en: "Set priorities across the security disciplines for that scope, such as governance, legal, risk, controls, and resilience.", fr: "Fixer les priorités entre les disciplines de sécurité pour ce niveau, comme la gouvernance, le juridique, le risque, les contrôles et la résilience." }
answer:
  sequence: [scope, prio, impl, rev]
explanation:
  correct:
    en: "The first step of the matrix is to determine which scope the use case fits into, from consumer app to self-trained model. The scope then sets priorities across the security disciplines. The company implements the resulting controls and reassesses them as threats and data sensitivity change."
    fr: "La première étape de la matrice consiste à déterminer à quel niveau correspond le cas d'usage, de l'application grand public au modèle entraîné par l'organisation. Le niveau fixe ensuite les priorités entre les disciplines de sécurité. L'entreprise met en œuvre les contrôles qui en découlent et les réévalue quand les menaces et la sensibilité des données évoluent."
  options:
    same:
      en: "Responsibilities differ by scope: consumer apps rely on the provider, while built applications need the company's own threat modeling and controls."
      fr: "Les responsabilités diffèrent selon le niveau : les applications grand public reposent sur le fournisseur, alors que les applications développées exigent une modélisation des menaces et des contrôles propres à l'entreprise."
    ft:
      en: "Fine-tuning is a design choice that places the use case in Scope 4; scoping comes first."
      fr: "Le peaufinage est un choix de conception qui place le cas d'usage dans le scope 4 ; le cadrage vient en premier."
references:
  - title: "Securing Generative AI: The Generative AI Security Scoping Matrix"
    url: https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/
