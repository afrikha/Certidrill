id: aifc01-5a-shared-resp-bedrock
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company uses Amazon Bedrock to build a customer chatbot.

    According to the AWS shared responsibility model, which task is the company's responsibility?
  fr: |
    Une entreprise de distribution utilise Amazon Bedrock pour créer un chatbot destiné à ses clients.

    Selon le modèle de responsabilité partagée AWS, quelle tâche relève de la responsabilité de l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Patching the servers and operating systems that host the foundation models", fr: "Appliquer les correctifs aux serveurs et aux systèmes d'exploitation qui hébergent les modèles de fondation" } }
    - { id: b, text: { en: "Controlling which IAM principals can invoke models and protecting the data sent in prompts", fr: "Contrôler les principaux IAM qui peuvent invoquer les modèles et protéger les données envoyées dans les invites" } }
    - { id: c, text: { en: "Securing the physical data centers where Amazon Bedrock runs", fr: "Sécuriser les centres de données physiques dans lesquels s'exécute Amazon Bedrock" } }
    - { id: d, text: { en: "Maintaining the network hardware that connects the Availability Zones", fr: "Maintenir le matériel réseau qui relie les zones de disponibilité" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS is responsible for security of the cloud: the hardware, software, networking and facilities that run its services. The customer is responsible for security in the cloud, which for a managed service such as Amazon Bedrock includes its data, the IAM permissions that it grants and its encryption choices."
    fr: "AWS est responsable de la sécurité du cloud : le matériel, les logiciels, le réseau et les installations qui exécutent ses services. Le client est responsable de la sécurité dans le cloud, ce qui comprend, pour un service géré comme Amazon Bedrock, ses données, les autorisations IAM qu'il accorde et ses choix de chiffrement."
  options:
    a:
      en: "Amazon Bedrock is a managed service: AWS runs and patches the infrastructure and operating systems that host the models."
      fr: "Amazon Bedrock est un service géré : AWS exploite l'infrastructure et les systèmes d'exploitation qui hébergent les modèles et leur applique les correctifs."
    c:
      en: "Physical security of the facilities is part of the security of the cloud, which AWS handles."
      fr: "La sécurité physique des installations fait partie de la sécurité du cloud, prise en charge par AWS."
    d:
      en: "The network infrastructure between Availability Zones is managed by AWS, not by the customer."
      fr: "L'infrastructure réseau entre les zones de disponibilité est gérée par AWS, pas par le client."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
  - title: Security, Guardrails, and Observability in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security.html
