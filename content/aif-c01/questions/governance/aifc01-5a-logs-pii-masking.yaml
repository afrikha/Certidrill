id: aifc01-5a-logs-pii-masking
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's Amazon Bedrock application uses a guardrail whose sensitive information filter masks PII in prompts and responses. Model invocation logging sends the logs to Amazon CloudWatch Logs. An audit finds customer names and email addresses in the log events. The operators who read the logs must not see this data, but the security team must still be able to view it during investigations.

    Which solution will meet these requirements?
  fr: |
    L'application Amazon Bedrock d'une entreprise utilise une barrière de protection dont le filtre d'informations sensibles masque les PII dans les invites et les réponses. La journalisation des invocations de modèle envoie les journaux vers Amazon CloudWatch Logs. Un audit trouve des noms et des adresses e-mail de clients dans les événements de journal. Les opérateurs qui lisent les journaux ne doivent pas voir ces données, mais l'équipe de sécurité doit toujours pouvoir les consulter lors de ses enquêtes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the action of the guardrail's sensitive information filter from Mask to Block.", fr: "Remplacer l'action Mask du filtre d'informations sensibles de la barrière de protection par Block." } }
    - { id: b, text: { en: "Delete the model invocation logging configuration of Amazon Bedrock.", fr: "Supprimer la configuration de journalisation des invocations de modèle d'Amazon Bedrock." } }
    - { id: c, text: { en: "Encrypt the log group with a customer managed AWS KMS key.", fr: "Chiffrer le groupe de journaux avec une clé AWS KMS gérée par le client." } }
    - { id: d, text: { en: "Add a CloudWatch Logs data protection policy to the log group, and grant logs:Unmask only to the security team.", fr: "Ajouter une politique de protection des données CloudWatch Logs au groupe de journaux et n'accorder logs:Unmask qu'à l'équipe de sécurité." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Guardrail masking applies to the prompts and responses of the application, but model invocation logs in CloudWatch Logs keep the original input. A CloudWatch Logs data protection policy detects sensitive data with managed data identifiers at ingestion and masks it at all egress points; only principals with the logs:Unmask permission can view the unmasked data."
    fr: "Le masquage de la barrière de protection s'applique aux invites et aux réponses de l'application, mais les journaux d'invocation de modèle dans CloudWatch Logs conservent l'entrée d'origine. Une politique de protection des données CloudWatch Logs détecte les données sensibles à l'ingestion avec des identifiants de données gérés et les masque à tous les points de sortie ; seuls les principaux qui disposent de l'autorisation logs:Unmask peuvent voir les données non masquées."
  options:
    a:
      en: "The invocation logs keep the original input whatever the guardrail action is, and Block would also stop the application from answering."
      fr: "Les journaux d'invocation conservent l'entrée d'origine quelle que soit l'action de la barrière de protection, et Block empêcherait aussi l'application de répondre."
    b:
      en: "Deleting the logging configuration removes the logs that the security team needs for its investigations."
      fr: "Supprimer la configuration de journalisation supprime les journaux dont l'équipe de sécurité a besoin pour ses enquêtes."
    c:
      en: "Encryption protects the logs at rest, but every principal allowed to read the log group still sees the log events, including the PII, in clear text."
      fr: "Le chiffrement protège les journaux au repos, mais chaque principal autorisé à lire le groupe de journaux voit toujours les événements en clair, PII compris."
references:
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
