id: aifc01-5b-gov-cloudtrail-invoke-trail
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must keep, for 1 year, a record of which IAM principal invoked which Amazon Bedrock model and when, through the InvokeModel and Converse APIs. For privacy reasons, the content of prompts and responses must not be stored.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Une entreprise doit conserver pendant 1 an un enregistrement indiquant quel principal IAM a appelé quel modèle Amazon Bedrock et quand, via les API InvokeModel et Converse. Pour des raisons de confidentialité, le contenu des invites et des réponses ne doit pas être stocké.

    Quelle solution répond à ces exigences avec le MOINS d'effort ?
body:
  options:
    - id: a
      text: { en: "Enable Amazon Bedrock model invocation logging with an Amazon CloudWatch Logs destination.", fr: "Activer la journalisation des appels de modèle Amazon Bedrock avec une destination Amazon CloudWatch Logs." }
    - id: b
      text: { en: "Create an AWS CloudTrail trail that delivers management events to an Amazon S3 bucket.", fr: "Créer un journal de suivi (trail) AWS CloudTrail qui livre les événements de gestion dans un compartiment Amazon S3." }
    - id: c
      text: { en: "Use the CloudTrail event history and download the events when auditors ask for them.", fr: "Utiliser l'historique des événements CloudTrail et télécharger les événements quand les auditeurs les demandent." }
    - id: d
      text: { en: "Create AWS Config rules that evaluate the Amazon Bedrock models used in the account.", fr: "Créer des règles AWS Config qui évaluent les modèles Amazon Bedrock utilisés dans le compte." }
answer: { optionId: b }
explanation:
  correct:
    en: "InvokeModel and Converse are CloudTrail management events, which are logged by default. Each event records the identity, time, source IP address, and model ID, but the request parameters do not include the prompt. A trail delivers the events to Amazon S3, where they can be kept longer than the 90 days of event history."
    fr: "InvokeModel et Converse sont des événements de gestion CloudTrail, journalisés par défaut. Chaque événement enregistre l'identité, l'heure, l'adresse IP source et l'ID du modèle, mais ses paramètres de requête n'incluent pas l'invite. Un journal de suivi livre les événements dans Amazon S3, où ils peuvent être conservés au-delà des 90 jours de l'historique des événements."
  options:
    a:
      en: "Invocation logging records the full request and response data, which the company must not store."
      fr: "La journalisation des appels enregistre l'intégralité des données de requête et de réponse, que l'entreprise ne doit pas stocker."
    c:
      en: "Event history keeps only the past 90 days of management events, not 1 year."
      fr: "L'historique des événements ne conserve que les 90 derniers jours d'événements de gestion, pas 1 an."
    d:
      en: "Config evaluates resource configurations; it does not record who invoked a model."
      fr: "Config évalue les configurations des ressources ; il n'enregistre pas qui a appelé un modèle."
references:
  - title: Monitor Amazon Bedrock API calls using CloudTrail
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
  - title: What Is AWS CloudTrail?
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html
