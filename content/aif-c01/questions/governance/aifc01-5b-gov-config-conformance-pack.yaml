id: aifc01-5b-gov-config-conformance-pack
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has defined a set of AWS Config rules for its AI workloads, such as encryption of training data buckets and logging requirements. The company wants to deploy and monitor these rules together as a single entity in each account, and to remediate noncompliant resources.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a défini un ensemble de règles AWS Config pour ses charges de travail d'IA, par exemple le chiffrement des compartiments de données d'entraînement et des exigences de journalisation. L'entreprise veut déployer et surveiller ces règles ensemble, comme une seule entité dans chaque compte, et corriger les ressources non conformes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Config aggregator that collects compliance data from all the accounts.", fr: "Créer un agrégateur AWS Config qui collecte les données de conformité de tous les comptes." }
    - id: b
      text: { en: "Create an AWS CloudTrail trail that applies to all the accounts in the organization.", fr: "Créer un journal de suivi (trail) AWS CloudTrail qui s'applique à tous les comptes de l'organisation." }
    - id: c
      text: { en: "Activate the AWS Trusted Advisor security checks in each of the accounts.", fr: "Activer les vérifications de sécurité AWS Trusted Advisor dans chacun des comptes." }
    - id: d
      text: { en: "Package the rules in an AWS Config conformance pack and deploy it to each account.", fr: "Regrouper les règles dans un pack de conformité AWS Config et le déployer dans chaque compte." }
answer: { optionId: d }
explanation:
  correct:
    en: "A conformance pack is a collection of AWS Config rules that is deployed and monitored as a single entity in an account. Config evaluates the resources continuously against the rules, and noncompliant resources can be remediated."
    fr: "Un pack de conformité est un ensemble de règles AWS Config déployé et surveillé comme une seule entité dans un compte. Config évalue les ressources en continu par rapport aux règles, et les ressources non conformes peuvent être corrigées."
  options:
    a:
      en: "An aggregator collects configuration and compliance data from several accounts and Regions into one account; it does not deploy rules."
      fr: "Un agrégateur collecte les données de configuration et de conformité de plusieurs comptes et Régions dans un seul compte ; il ne déploie pas de règles."
    b:
      en: "A trail records API activity; it does not evaluate resources against rules."
      fr: "Un journal de suivi enregistre l'activité des API ; il n'évalue pas les ressources par rapport à des règles."
    c:
      en: "Trusted Advisor checks are defined by AWS; they cannot package and enforce the company's own rules."
      fr: "Les vérifications Trusted Advisor sont définies par AWS ; elles ne peuvent pas regrouper ni appliquer les règles de l'entreprise."
references:
  - title: What Is AWS Config?
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
