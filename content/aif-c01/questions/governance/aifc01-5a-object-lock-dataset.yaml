id: aifc01-5a-object-lock-dataset
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank must keep the approved version of each training dataset in Amazon S3 for 5 years so that regulators can verify which data trained each credit model. During that period, no user, including the root user, can be able to overwrite or delete the approved version.

    Which solution will meet these requirements?
  fr: |
    Une banque doit conserver pendant 5 ans dans Amazon S3 la version approuvée de chaque jeu de données d'entraînement, afin que les régulateurs puissent vérifier quelles données ont entraîné chaque modèle de crédit. Pendant cette période, aucun utilisateur, y compris l'utilisateur root, ne doit pouvoir écraser ou supprimer la version approuvée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Protect the objects with S3 Object Lock in compliance mode and a 5-year retention period.", fr: "Protéger les objets avec S3 Object Lock en mode conformité (compliance) et une période de conservation de 5 ans." } }
    - { id: b, text: { en: "Enable S3 Versioning on the bucket so that every change creates a new object version.", fr: "Activer S3 Versioning sur le compartiment pour que chaque modification crée une nouvelle version d'objet." } }
    - { id: c, text: { en: "Encrypt the objects with SSE-KMS by using a customer managed key with automatic rotation.", fr: "Chiffrer les objets avec SSE-KMS à l'aide d'une clé gérée par le client avec rotation automatique." } }
    - { id: d, text: { en: "Run a weekly Amazon Macie job that reports any change to the bucket's objects.", fr: "Exécuter chaque semaine une tâche Amazon Macie qui signale toute modification des objets du compartiment." } }
answer: { optionId: a }
explanation:
  correct:
    en: "S3 Object Lock stores objects with a write-once-read-many (WORM) model. In compliance mode, no user, including the root user, can overwrite or delete a protected object version or shorten its retention period before it expires. Object Lock requires S3 Versioning on the bucket."
    fr: "S3 Object Lock stocke les objets selon un modèle WORM (write-once-read-many). En mode conformité, aucun utilisateur, y compris l'utilisateur root, ne peut écraser ou supprimer une version d'objet protégée, ni raccourcir sa période de conservation avant son expiration. Object Lock nécessite que S3 Versioning soit activé sur le compartiment."
  options:
    b:
      en: "Versioning keeps previous versions, but a user with the right permissions can still delete any version."
      fr: "La gestion des versions conserve les versions précédentes, mais un utilisateur disposant des autorisations nécessaires peut toujours supprimer n'importe quelle version."
    c:
      en: "Encryption protects confidentiality at rest; it does not stop an authorized user from deleting or overwriting objects."
      fr: "Le chiffrement protège la confidentialité au repos ; il n'empêche pas un utilisateur autorisé de supprimer ou d'écraser des objets."
    d:
      en: "Macie discovers sensitive data and bucket security issues; it neither prevents nor tracks changes to objects."
      fr: "Macie découvre des données sensibles et des problèmes de sécurité des compartiments ; il n'empêche ni ne suit les modifications des objets."
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
