id: aifc01-5b-dg-multi-macie-lf
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building a data lake in Amazon S3 to train ML models. The data governance team must find which objects contain personally identifiable information (PII), and then restrict the analysts' access to the sensitive columns of the cataloged tables.

    Which combination of AWS services will meet these requirements? (Choose two.)
  fr: |
    Une entreprise crée un lac de données dans Amazon S3 pour entraîner des modèles de ML. L'équipe de gouvernance des données doit trouver quels objets contiennent des informations personnelles identifiables (PII), puis restreindre l'accès des analystes aux colonnes sensibles des tables cataloguées.

    Quelle combinaison de services AWS répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: "Amazon Inspector" }
    - { id: b, text: "AWS Artifact" }
    - { id: c, text: "AWS Lake Formation" }
    - { id: d, text: "AWS Trusted Advisor" }
    - { id: e, text: "Amazon Macie" }
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: "Amazon Macie uses machine learning and pattern matching to discover sensitive data, such as PII, in Amazon S3. AWS Lake Formation manages fine-grained permissions on data lake tables in the AWS Glue Data Catalog, down to the column, row, and cell level."
    fr: "Amazon Macie utilise le machine learning et la correspondance de modèles pour découvrir des données sensibles, comme des PII, dans Amazon S3. AWS Lake Formation gère des autorisations précises sur les tables du lac de données dans le AWS Glue Data Catalog, jusqu'au niveau des colonnes, des lignes et des cellules."
  options:
    a:
      en: "Inspector scans compute resources for software vulnerabilities, not data for PII."
      fr: "Inspector analyse les ressources de calcul à la recherche de vulnérabilités logicielles, pas les données à la recherche de PII."
    b:
      en: "Artifact provides AWS compliance reports and agreements; it neither classifies nor protects the company's data."
      fr: "Artifact fournit les rapports de conformité et les accords d'AWS ; il ne classe ni ne protège les données de l'entreprise."
    d:
      en: "Trusted Advisor gives account-level recommendations; it does not find PII or grant column-level access."
      fr: "Trusted Advisor fournit des recommandations au niveau du compte ; il ne trouve pas de PII et n'accorde pas d'accès au niveau des colonnes."
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
  - title: What is AWS Lake Formation?
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html
