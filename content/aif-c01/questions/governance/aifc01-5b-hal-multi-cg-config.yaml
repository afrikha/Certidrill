id: aifc01-5b-hal-multi-cg-config
objective: "5.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank's assistant on Amazon Bedrock answers questions about account fees. Every response must be checked against the official fee schedule, and responses that the fee schedule does not support must never reach customers. The bank calls the ApplyGuardrail API with a guardrail that has a contextual grounding check.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    L'assistant d'une banque, sur Amazon Bedrock, répond à des questions sur les frais bancaires. Chaque réponse doit être vérifiée par rapport à la grille tarifaire officielle, et les réponses que la grille tarifaire n'étaye pas ne doivent jamais parvenir aux clients. La banque appelle l'API ApplyGuardrail avec une barrière de protection (guardrail) dotée d'une vérification de l'ancrage contextuel.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Pass the fee schedule as the grounding source and the customer's question as the query.", fr: "Transmettre la grille tarifaire comme source d'ancrage et la question du client comme requête." }
    - id: b
      text: { en: "Set the action of the grounding filter to BLOCK.", fr: "Définir l'action du filtre d'ancrage sur BLOCK." }
    - id: c
      text: { en: "Set the action of the grounding filter to NONE.", fr: "Définir l'action du filtre d'ancrage sur NONE." }
    - id: d
      text: { en: "Set the grounding threshold to 1.", fr: "Définir le seuil d'ancrage sur 1." }
    - id: e
      text: { en: "Add the fee schedule to a denied topic of the guardrail.", fr: "Ajouter la grille tarifaire à un sujet refusé de la barrière de protection." }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: "A contextual grounding check needs a grounding source, a query, and the content to guard; with ApplyGuardrail, the source and query are marked with the grounding_source and query qualifiers. With the BLOCK action, a response that scores below the threshold is replaced by the blocked-response message, so it never reaches the customer."
    fr: "Une vérification de l'ancrage contextuel nécessite une source d'ancrage, une requête et le contenu à protéger ; avec ApplyGuardrail, la source et la requête sont signalées par les qualificateurs grounding_source et query. Avec l'action BLOCK, une réponse dont le score est inférieur au seuil est remplacée par le message de réponse bloquée : elle ne parvient donc jamais au client."
  options:
    c:
      en: "With NONE, the guardrail returns detection information but lets the ungrounded response through."
      fr: "Avec NONE, la barrière de protection renvoie les informations de détection mais laisse passer la réponse non ancrée."
    d:
      en: "A threshold of 1 is invalid because it would block all content; the range is 0 to 0.99."
      fr: "Un seuil de 1 n'est pas valide, car il bloquerait tout le contenu ; la plage va de 0 à 0,99."
    e:
      en: "A denied topic blocks a subject; adding the fee schedule would block fee questions instead of checking answers against it."
      fr: "Un sujet refusé bloque un sujet ; y ajouter la grille tarifaire bloquerait les questions sur les frais au lieu de vérifier les réponses par rapport à elle."
references:
  - title: Use contextual grounding check to filter hallucinations in responses
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
