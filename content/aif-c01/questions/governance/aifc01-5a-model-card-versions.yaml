id: aifc01-5a-model-card-versions
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A data science team documents a model in an Amazon SageMaker model card. After the model is retrained, the team updates the evaluation results in the card. Auditors must later be able to see what the card contained before the update.

    Which statement describes how SageMaker Model Cards support this requirement?
  fr: |
    Une équipe de science des données documente un modèle dans une carte de modèle Amazon SageMaker. Après le réentraînement du modèle, l'équipe met à jour les résultats d'évaluation dans la carte. Les auditeurs doivent pouvoir consulter plus tard le contenu de la carte avant cette mise à jour.

    Quelle affirmation décrit comment SageMaker Model Cards répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Each edit to the card's content creates a new version of the model card, which gives an immutable record of the changes.", fr: "Chaque modification du contenu de la carte crée une nouvelle version de la carte de modèle, ce qui fournit un historique immuable des changements." } }
    - { id: b, text: { en: "A model card cannot be edited after it is created, so the team must create a new model card after each retraining.", fr: "Une carte de modèle ne peut pas être modifiée après sa création : l'équipe doit donc créer une nouvelle carte après chaque réentraînement." } }
    - { id: c, text: { en: "The update overwrites the card, so only the AWS CloudTrail event history can show the previous evaluation results.", fr: "La mise à jour écrase la carte : seul l'historique des événements AWS CloudTrail peut donc montrer les résultats d'évaluation précédents." } }
    - { id: d, text: { en: "Only a change to the card's approval status creates a new version; content edits replace the current version.", fr: "Seul un changement du statut d'approbation de la carte crée une nouvelle version ; les modifications du contenu remplacent la version actuelle." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Edits to a model card other than an approval status update create a new model card version. The earlier versions remain available, so the team keeps an immutable record of what the card said before each change, which auditors can review."
    fr: "Les modifications d'une carte de modèle autres qu'une mise à jour du statut d'approbation créent une nouvelle version de la carte. Les versions antérieures restent disponibles : l'équipe conserve ainsi un historique immuable du contenu de la carte avant chaque changement, que les auditeurs peuvent examiner."
  options:
    b:
      en: "Model cards can be edited; the edits are kept as new versions of the same card."
      fr: "Les cartes de modèle peuvent être modifiées ; les modifications sont conservées sous forme de nouvelles versions de la même carte."
    c:
      en: "Content edits do not overwrite the card, because they create a new version; CloudTrail records API calls, not the previous content of a card."
      fr: "Les modifications du contenu n'écrasent pas la carte, car elles créent une nouvelle version ; CloudTrail enregistre les appels d'API, pas le contenu précédent d'une carte."
    d:
      en: "This reverses the behavior: content edits create a new version, while an approval status update does not."
      fr: "Cette affirmation inverse le fonctionnement : les modifications du contenu créent une nouvelle version, alors qu'une mise à jour du statut d'approbation n'en crée pas."
references:
  - title: Amazon SageMaker Model Cards
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
