id: aifc01-5a-dd-secure-services
objective: "5.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is securing a generative AI solution on AWS. Match each requirement with the AWS service or feature that meets it. Each service or feature may be used once or not at all.
  fr: |
    Une entreprise sécurise une solution d'IA générative sur AWS. Associez chaque exigence au service ou à la fonctionnalité AWS qui y répond. Chaque service ou fonctionnalité peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: macie, text: "Amazon Macie" }
    - { id: kms, text: "AWS KMS" }
    - { id: guard, text: "Amazon Bedrock Guardrails" }
    - { id: policy, text: { en: "Policy in Amazon Bedrock AgentCore", fr: "Policy dans Amazon Bedrock AgentCore" } }
    - { id: pl, text: "AWS PrivateLink" }
    - { id: ident, text: "Amazon Bedrock AgentCore Identity" }
  targets:
    - { id: t1, text: { en: "Find training documents in Amazon S3 that contain personal data", fr: "Trouver les documents d'entraînement dans Amazon S3 qui contiennent des données personnelles" } }
    - { id: t2, text: { en: "Create and control the keys that encrypt a fine-tuned model", fr: "Créer et contrôler les clés qui chiffrent un modèle peaufiné" } }
    - { id: t3, text: { en: "Filter hateful or violent content in prompts and responses", fr: "Filtrer les contenus haineux ou violents dans les invites et les réponses" } }
    - { id: t4, text: { en: "Allow an agent's tool calls only when their parameters meet business rules", fr: "N'autoriser les appels d'outils d'un agent que si leurs paramètres respectent des règles métier" } }
answer:
  mapping: { t1: macie, t2: kms, t3: guard, t4: policy }
explanation:
  correct:
    en: "Amazon Macie discovers sensitive data such as PII in S3 objects. AWS KMS creates and controls the keys that encrypt resources such as Bedrock custom models. Guardrails content filters detect hate, insults, sexual content, violence and misconduct in prompts and responses. Policy in AgentCore evaluates each tool call that goes through AgentCore Gateway against Cedar policies, including conditions on tool input parameters."
    fr: "Amazon Macie découvre des données sensibles comme les PII dans les objets S3. AWS KMS crée et contrôle les clés qui chiffrent des ressources comme les modèles personnalisés Bedrock. Les filtres de contenu des barrières de protection détectent la haine, les insultes, le contenu sexuel, la violence et les comportements répréhensibles dans les invites et les réponses. Policy dans AgentCore évalue chaque appel d'outil qui passe par AgentCore Gateway par rapport à des politiques Cedar, y compris des conditions sur les paramètres d'entrée de l'outil."
  options:
    pl:
      en: "AWS PrivateLink provides private connectivity from a VPC to Amazon Bedrock; none of the requirements is about the network path."
      fr: "AWS PrivateLink fournit une connectivité privée d'un VPC vers Amazon Bedrock ; aucune exigence ne porte sur le chemin réseau."
    ident:
      en: "AgentCore Identity manages agent identities and credentials such as OAuth tokens; it does not evaluate tool parameters against business rules."
      fr: "AgentCore Identity gère les identités et les identifiants des agents, comme les jetons OAuth ; il n'évalue pas les paramètres des outils par rapport à des règles métier."
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
  - title: "Policy in Amazon Bedrock AgentCore: Control Agent Interactions"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
