id: aifc01-5b-dg-s3-lifecycle-archive
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores the raw data that it uses to train ML models in Amazon S3. Its data governance policy says: keep the data in S3 Standard for 90 days, then archive it to S3 Glacier Flexible Retrieval, and delete it 3 years after creation. These actions must happen automatically.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke dans Amazon S3 les données brutes qu'elle utilise pour entraîner des modèles de ML. Sa politique de gouvernance des données prévoit : conserver les données dans S3 Standard pendant 90 jours, puis les archiver dans S3 Glacier Flexible Retrieval, et les supprimer 3 ans après leur création. Ces actions doivent être automatiques.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable S3 Object Lock in compliance mode with a 3-year retention period.", fr: "Activer S3 Object Lock en mode conformité avec une période de conservation de 3 ans." }
    - id: b
      text: { en: "Create an S3 Lifecycle configuration with a transition action and an expiration action.", fr: "Créer une configuration S3 Lifecycle avec une action de transition et une action d'expiration." }
    - id: c
      text: { en: "Enable S3 Versioning on the bucket and delete the old versions every 90 days.", fr: "Activer S3 Versioning sur le compartiment et supprimer les anciennes versions tous les 90 jours." }
    - id: d
      text: { en: "Use Amazon Macie to find the old objects and delete them every month.", fr: "Utiliser Amazon Macie pour trouver les anciens objets et les supprimer chaque mois." }
answer: { optionId: b }
explanation:
  correct:
    en: "An S3 Lifecycle configuration automates the data lifecycle: a transition action moves objects to another storage class, such as S3 Glacier Flexible Retrieval after 90 days, and an expiration action deletes them after a set period, such as 3 years after creation."
    fr: "Une configuration S3 Lifecycle automatise le cycle de vie des données : une action de transition déplace les objets vers une autre classe de stockage, comme S3 Glacier Flexible Retrieval après 90 jours, et une action d'expiration les supprime après une durée définie, comme 3 ans après leur création."
  options:
    a:
      en: "Object Lock prevents deletion during the retention period; it neither archives nor deletes objects."
      fr: "Object Lock empêche la suppression pendant la période de conservation ; il n'archive ni ne supprime les objets."
    c:
      en: "Versioning keeps object versions; deleting them by hand is not automatic and does not archive data."
      fr: "Versioning conserve des versions d'objets ; les supprimer à la main n'est pas automatique et n'archive pas les données."
    d:
      en: "Macie discovers sensitive data; it does not manage storage classes or object expiration."
      fr: "Macie découvre les données sensibles ; il ne gère ni les classes de stockage ni l'expiration des objets."
references:
  - title: Managing the lifecycle of objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html
