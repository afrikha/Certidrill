id: aifc01-5a-toxicity-content-filters
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online gaming company adds a chat assistant built on Amazon Bedrock to its community forum. The assistant must block hateful and insulting messages from players, and the model must not produce such content in its responses.

    Which Amazon Bedrock Guardrails policy will meet these requirements?
  fr: |
    Une entreprise de jeux en ligne ajoute à son forum communautaire un assistant de discussion créé sur Amazon Bedrock. L'assistant doit bloquer les messages haineux et insultants des joueurs, et le modèle ne doit pas produire de tels contenus dans ses réponses.

    Quelle politique d'Amazon Bedrock Guardrails répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Sensitive information filters", fr: "Filtres d'informations sensibles" } }
    - { id: b, text: { en: "Content filters for the Hate and Insults categories", fr: "Filtres de contenu pour les catégories Hate et Insults" } }
    - { id: c, text: { en: "Contextual grounding checks", fr: "Vérifications d'ancrage contextuel" } }
    - { id: d, text: { en: "Automated Reasoning checks", fr: "Vérifications Automated Reasoning" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Content filters detect toxic content in the Hate, Insults, Sexual, Violence and Misconduct categories. Each category has its own strength for prompts and for responses, so the guardrail can block toxic messages from players and toxic content generated by the model."
    fr: "Les filtres de contenu détectent les contenus toxiques des catégories Hate, Insults, Sexual, Violence et Misconduct. Chaque catégorie a sa propre force pour les invites et pour les réponses : la barrière de protection peut ainsi bloquer les messages toxiques des joueurs et les contenus toxiques générés par le modèle."
  options:
    a:
      en: "Sensitive information filters detect PII and custom patterns, not hateful or insulting language."
      fr: "Les filtres d'informations sensibles détectent les PII et des motifs personnalisés, pas les propos haineux ou insultants."
    c:
      en: "Contextual grounding checks detect responses that are not grounded in the source or not relevant to the query; they apply only to responses and do not detect toxicity."
      fr: "Les vérifications d'ancrage contextuel détectent les réponses non ancrées dans la source ou sans rapport avec la question ; elles ne s'appliquent qu'aux réponses et ne détectent pas la toxicité."
    d:
      en: "Automated Reasoning checks validate responses against logical rules to detect hallucinations; they are not toxicity filters."
      fr: "Les vérifications Automated Reasoning valident les réponses par rapport à des règles logiques pour détecter les hallucinations ; ce ne sont pas des filtres de toxicité."
references:
  - title: Block harmful words and conversations with content filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
