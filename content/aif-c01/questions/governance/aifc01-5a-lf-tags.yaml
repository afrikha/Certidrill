id: aifc01-5a-lf-tags
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's data lake contains hundreds of tables in the AWS Glue Data Catalog. The data governance team wants to grant data scientists access to every table and column classified as non-confidential. The team wants to manage these permissions with a few classification labels instead of one grant for each table.

    Which solution will meet these requirements?
  fr: |
    Le lac de données d'une entreprise contient des centaines de tables dans le catalogue de données AWS Glue. L'équipe de gouvernance des données veut accorder aux scientifiques des données l'accès à toutes les tables et colonnes classées non confidentielles. Elle veut gérer ces autorisations avec quelques étiquettes de classification plutôt qu'avec une autorisation par table.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Write one IAM policy for each table and attach the policies to the data scientists' role.", fr: "Rédiger une politique IAM pour chaque table et attacher ces politiques au rôle des scientifiques des données." } }
    - { id: b, text: { en: "Run Amazon Macie jobs that label each table as confidential or non-confidential.", fr: "Exécuter des tâches Amazon Macie qui étiquettent chaque table comme confidentielle ou non confidentielle." } }
    - { id: c, text: { en: "Assign LF-Tags to the databases, tables, and columns, and grant Lake Formation permissions on the tags.", fr: "Attribuer des LF-Tags aux bases de données, aux tables et aux colonnes, et accorder des autorisations Lake Formation sur ces balises." } }
    - { id: d, text: { en: "Create one AWS Glue crawler for each classification level.", fr: "Créer un crawler AWS Glue pour chaque niveau de classification." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Lake Formation tag-based access control uses custom labels called LF-Tags that are attached to databases, tables or columns. Granting permissions on a tag value gives access to every resource that carries it, so thousands of permissions are managed with a few logical tags instead of per-resource grants."
    fr: "Le contrôle d'accès basé sur les balises de Lake Formation utilise des étiquettes personnalisées, appelées LF-Tags, attachées aux bases de données, aux tables ou aux colonnes. Accorder des autorisations sur une valeur de balise donne accès à toutes les ressources qui la portent : des milliers d'autorisations sont ainsi gérées avec quelques balises logiques au lieu d'autorisations par ressource."
  options:
    a:
      en: "One policy per table is exactly the per-resource management that the team wants to avoid, and IAM alone cannot grant column-level access."
      fr: "Une politique par table correspond exactement à la gestion par ressource que l'équipe veut éviter, et IAM seul ne peut pas accorder d'accès au niveau des colonnes."
    b:
      en: "Macie reports sensitive data in S3 objects; it does not grant permissions on catalog tables."
      fr: "Macie signale des données sensibles dans les objets S3 ; il n'accorde pas d'autorisations sur les tables du catalogue."
    d:
      en: "Crawlers discover schemas and populate the catalog; they do not control who can access the tables."
      fr: "Les crawlers découvrent les schémas et alimentent le catalogue ; ils ne contrôlent pas qui peut accéder aux tables."
references:
  - title: What is AWS Lake Formation?
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html
