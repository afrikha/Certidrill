id: aifc01-5a-multi-audit-trail
objective: "5.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A regulated insurance company must keep an audit trail for its generative AI application on Amazon Bedrock. The audit trail must show which principal called each Amazon Bedrock API and when. It must also contain the full prompts and responses of the model invocations. The company must be able to prove that the API activity log files were not modified after delivery.

    Which combination of actions will meet these requirements? (Choose three.)
  fr: |
    Une compagnie d'assurance réglementée doit conserver une piste d'audit pour son application d'IA générative sur Amazon Bedrock. Cette piste d'audit doit montrer quel principal a appelé chaque API Amazon Bedrock et à quel moment. Elle doit aussi contenir les invites et les réponses complètes des invocations de modèle. La compagnie doit pouvoir prouver que les fichiers journaux de l'activité des API n'ont pas été modifiés après leur livraison.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create an AWS CloudTrail trail that delivers the Amazon Bedrock API events to an S3 bucket.", fr: "Créer un journal de suivi AWS CloudTrail qui livre les événements des API Amazon Bedrock dans un compartiment S3." } }
    - { id: b, text: { en: "Activate Amazon Inspector scanning for the application's compute resources.", fr: "Activer l'analyse Amazon Inspector pour les ressources de calcul de l'application." } }
    - { id: c, text: { en: "Enable log file integrity validation on the CloudTrail trail.", fr: "Activer la validation de l'intégrité des fichiers journaux sur le journal de suivi CloudTrail." } }
    - { id: d, text: { en: "Run an Amazon Macie sensitive data discovery job on the log bucket.", fr: "Exécuter une tâche de découverte des données sensibles Amazon Macie sur le compartiment des journaux." } }
    - { id: e, text: { en: "Enable model invocation logging in Amazon Bedrock.", fr: "Activer la journalisation des invocations de modèle dans Amazon Bedrock." } }
    - { id: f, text: { en: "Attach a guardrail with all filters in Detect mode to every model call.", fr: "Associer à chaque appel de modèle une barrière de protection dont tous les filtres sont en mode Detect." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "A CloudTrail trail keeps an ongoing record of Amazon Bedrock API calls, with the identity of the caller and the time of each call. Log file integrity validation adds signed digest files that let the company prove whether log files were modified or deleted after delivery. Model invocation logging captures the full input and output data of model invocations."
    fr: "Un journal de suivi CloudTrail conserve un enregistrement continu des appels d'API Amazon Bedrock, avec l'identité de l'appelant et l'heure de chaque appel. La validation de l'intégrité des fichiers journaux ajoute des fichiers de résumé (digest) signés qui permettent à la compagnie de prouver si des fichiers journaux ont été modifiés ou supprimés après leur livraison. La journalisation des invocations de modèle capture l'intégralité des données d'entrée et de sortie des invocations de modèle."
  options:
    b:
      en: "Inspector finds software vulnerabilities; it does not record API calls or model interactions."
      fr: "Inspector trouve des vulnérabilités logicielles ; il n'enregistre ni les appels d'API ni les interactions avec le modèle."
    d:
      en: "Macie reports sensitive data in the log bucket but proves nothing about who called the APIs or whether logs were changed."
      fr: "Macie signale des données sensibles dans le compartiment des journaux, mais ne prouve rien sur les auteurs des appels d'API ni sur la modification des journaux."
    f:
      en: "A guardrail in Detect mode returns detection information but does not store any audit record."
      fr: "Une barrière de protection en mode Detect renvoie des informations de détection, mais ne stocke aucun enregistrement d'audit."
references:
  - title: Validating CloudTrail log file integrity
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
