id: aifc01-5a-agentcore-policy-refund
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company's customer service agent calls tools through Amazon Bedrock AgentCore Gateway. One tool issues refunds. The company must ensure that the agent can issue a refund only when the amount is 200 USD or less. The control must be enforced outside the agent's code and must hold even if a user manipulates the agent with a crafted prompt.

    Which solution will meet these requirements?
  fr: |
    L'agent de service client d'une entreprise de distribution appelle des outils via Amazon Bedrock AgentCore Gateway. L'un de ces outils effectue des remboursements. L'entreprise doit s'assurer que l'agent ne peut effectuer un remboursement que si le montant est inférieur ou égal à 200 USD. Le contrôle doit être appliqué en dehors du code de l'agent et doit tenir même si un utilisateur manipule l'agent avec une invite malveillante.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a policy engine with a Cedar policy on the refund tool's amount parameter, and associate it with the gateway.", fr: "Créer un moteur de politiques avec une politique Cedar sur le paramètre de montant de l'outil de remboursement, et l'associer à la passerelle." } }
    - { id: b, text: { en: "Add an instruction to the agent's system prompt that forbids refunds of more than 200 USD.", fr: "Ajouter dans l'invite système de l'agent une instruction qui interdit les remboursements de plus de 200 USD." } }
    - { id: c, text: { en: "Configure an Amazon Bedrock guardrail with a denied topic for refunds of more than 200 USD.", fr: "Configurer une barrière de protection Amazon Bedrock avec un sujet refusé pour les remboursements de plus de 200 USD." } }
    - { id: d, text: { en: "Configure AgentCore Identity so that the agent receives an OAuth token for the refund API.", fr: "Configurer AgentCore Identity pour que l'agent reçoive un jeton OAuth pour l'API de remboursement." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Policy in AgentCore stores deterministic Cedar policies in a policy engine that is associated with one or more gateways. The gateway intercepts every tool call and evaluates it against the policies, including conditions on tool input parameters, before it allows access. The control is outside the agent's code, so a manipulated agent cannot bypass it."
    fr: "Policy dans AgentCore stocke des politiques Cedar déterministes dans un moteur de politiques associé à une ou plusieurs passerelles. La passerelle intercepte chaque appel d'outil et l'évalue par rapport aux politiques, y compris des conditions sur les paramètres d'entrée de l'outil, avant d'autoriser l'accès. Le contrôle se trouve en dehors du code de l'agent : un agent manipulé ne peut donc pas le contourner."
  options:
    b:
      en: "A system prompt instruction lives inside the agent and is exactly what a crafted prompt tries to override; it is not a deterministic control."
      fr: "Une instruction d'invite système se trouve dans l'agent et c'est justement ce qu'une invite malveillante tente de contourner ; ce n'est pas un contrôle déterministe."
    c:
      en: "A denied topic evaluates the text of the conversation probabilistically; it does not check the amount parameter of a tool call."
      fr: "Un sujet refusé évalue le texte de la conversation de façon probabiliste ; il ne vérifie pas le paramètre de montant d'un appel d'outil."
    d:
      en: "AgentCore Identity gives the agent credentials to call the refund API but does not limit which amounts the agent may refund."
      fr: "AgentCore Identity donne à l'agent des identifiants pour appeler l'API de remboursement, mais ne limite pas les montants que l'agent peut rembourser."
references:
  - title: "Policy in Amazon Bedrock AgentCore: Control Agent Interactions"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
