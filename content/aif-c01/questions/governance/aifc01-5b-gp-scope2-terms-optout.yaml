id: aifc01-5b-gp-scope2-terms-optout
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's employees use a third-party enterprise scheduling application that includes a generative AI feature for drafting meeting agendas. The company has signed an enterprise agreement with the vendor. The company wants to apply the governance and compliance guidance of the Generative AI Security Scoping Matrix to this use case.

    Which action should the company take?
  fr: |
    Les employés d'une entreprise utilisent une application d'agenda d'entreprise tierce qui comprend une fonction d'IA générative pour rédiger des ordres du jour de réunion. L'entreprise a signé un contrat d'entreprise avec l'éditeur. Elle veut appliquer à ce cas d'usage les recommandations de gouvernance et de conformité de la matrice de cadrage de la sécurité de l'IA générative (Generative AI Security Scoping Matrix).

    Quelle action l'entreprise doit-elle mener ?
body:
  options:
    - id: a
      text: { en: "Threat model the vendor's model weights and patch them when vulnerabilities are found.", fr: "Modéliser les menaces sur les poids du modèle de l'éditeur et les corriger quand des vulnérabilités sont trouvées." }
    - id: b
      text: { en: "Attach an Amazon Bedrock guardrail to the vendor's model to filter its responses.", fr: "Associer un garde-fou (guardrail) Amazon Bedrock au modèle de l'éditeur pour filtrer ses réponses." }
    - id: c
      text: { en: "Fine-tune the vendor's model with the company's meeting data to improve the agendas.", fr: "Peaufiner (fine-tuning) le modèle de l'éditeur avec les données de réunion de l'entreprise pour améliorer les ordres du jour." }
    - id: d
      text: { en: "Review the vendor's terms on data use, and opt out of the use of company data for training.", fr: "Examiner les conditions de l'éditeur sur l'utilisation des données, et refuser (opt-out) l'utilisation des données de l'entreprise pour l'entraînement." }
answer: { optionId: d }
explanation:
  correct:
    en: "This is Scope 2: an enterprise application with embedded generative AI under a business relationship. For Scopes 1 and 2, governance means complying with the terms of service, licenses, and data sovereignty rules, and using opt-out options so that proprietary data is not used for training. The company relies on the vendor's protections for the model itself."
    fr: "Il s'agit du scope 2 : une application d'entreprise avec de l'IA générative intégrée, encadrée par une relation commerciale. Pour les scopes 1 et 2, la gouvernance consiste à respecter les conditions d'utilisation, les licences et les règles de souveraineté des données, et à utiliser les options de refus (opt-out) pour que les données propriétaires ne servent pas à l'entraînement. L'entreprise s'appuie sur les protections de l'éditeur pour le modèle lui-même."
  options:
    a:
      en: "In Scope 2, the company does not own or access the vendor's model, so it cannot threat model or patch its weights."
      fr: "Dans le scope 2, l'entreprise ne possède pas le modèle de l'éditeur et n'y a pas accès : elle ne peut ni modéliser les menaces sur ses poids ni les corriger."
    b:
      en: "The company does not control the vendor application's calls to its model, so it cannot attach its own guardrail to them."
      fr: "L'entreprise ne contrôle pas les appels de l'application de l'éditeur à son modèle : elle ne peut donc pas y associer son propre garde-fou."
    c:
      en: "The company cannot customize the vendor's model; fine-tuning a model is a Scope 4 activity."
      fr: "L'entreprise ne peut pas personnaliser le modèle de l'éditeur ; peaufiner un modèle relève du scope 4."
references:
  - title: "Securing Generative AI: The Generative AI Security Scoping Matrix"
    url: https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/
