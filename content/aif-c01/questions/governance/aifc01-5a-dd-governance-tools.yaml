id: aifc01-5a-dd-governance-tools
objective: "5.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is defining how it documents the data and models of its AI solutions. Match each requirement with the AWS feature that meets it. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise définit la façon dont elle documente les données et les modèles de ses solutions d'IA. Associez chaque exigence à la fonctionnalité AWS qui y répond. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cards, text: "Amazon SageMaker Model Cards" }
    - { id: lineage, text: "Amazon SageMaker ML Lineage Tracking" }
    - { id: catalog, text: "AWS Glue Data Catalog" }
    - { id: kb, text: { en: "Citations in Amazon Bedrock Knowledge Bases responses", fr: "Citations dans les réponses d'Amazon Bedrock Knowledge Bases" } }
    - { id: trail, text: "AWS CloudTrail" }
  targets:
    - { id: t1, text: { en: "Document a model's intended uses and risk rating for reviewers", fr: "Documenter les utilisations prévues et le niveau de risque d'un modèle pour les réviseurs" } }
    - { id: t2, text: { en: "Find the exact datasets and training job that produced a deployed model", fr: "Trouver les jeux de données et la tâche d'entraînement exacts qui ont produit un modèle déployé" } }
    - { id: t3, text: { en: "Keep a central, searchable inventory of dataset locations and schemas", fr: "Conserver un inventaire central et consultable des emplacements et des schémas des jeux de données" } }
    - { id: t4, text: { en: "Show users which document supports a generated answer", fr: "Montrer aux utilisateurs quel document étaye une réponse générée" } }
answer:
  mapping: { t1: cards, t2: lineage, t3: catalog, t4: kb }
explanation:
  correct:
    en: "Model cards document intended uses, risk rating, training and evaluation details. ML Lineage Tracking records the artifacts and steps of each workflow, so the team can find what was used to train a model. The Glue Data Catalog is the central metadata repository for dataset location and schema. Knowledge Bases can include citations so users can check the source of an answer."
    fr: "Les cartes de modèle documentent les utilisations prévues, le niveau de risque ainsi que les détails d'entraînement et d'évaluation. ML Lineage Tracking enregistre les artefacts et les étapes de chaque flux de travail : l'équipe peut ainsi retrouver ce qui a servi à entraîner un modèle. Le catalogue de données Glue est le référentiel central de métadonnées sur l'emplacement et le schéma des jeux de données. Knowledge Bases peut inclure des citations pour que les utilisateurs vérifient la source d'une réponse."
  options:
    trail:
      en: "CloudTrail records API activity, such as who created or deleted a resource; it documents neither models nor data origins."
      fr: "CloudTrail enregistre l'activité des API, par exemple qui a créé ou supprimé une ressource ; il ne documente ni les modèles ni l'origine des données."
references:
  - title: Amazon SageMaker Model Cards
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
  - title: Amazon SageMaker ML Lineage Tracking
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html
