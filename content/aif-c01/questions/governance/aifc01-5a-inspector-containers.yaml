id: aifc01-5a-inspector-containers
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts custom model inference containers whose images are stored in Amazon ECR. The company also runs preprocessing code in AWS Lambda functions. The security team must continuously scan these resources for known software vulnerabilities (CVEs) without scheduling the scans manually.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise héberge des conteneurs d'inférence de modèles personnalisés dont les images sont stockées dans Amazon ECR. Elle exécute aussi du code de prétraitement dans des fonctions AWS Lambda. L'équipe de sécurité doit analyser en continu ces ressources à la recherche de vulnérabilités logicielles connues (CVE), sans planifier les analyses manuellement.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Macie" }
    - { id: b, text: "AWS CloudTrail" }
    - { id: c, text: "Amazon Inspector" }
    - { id: d, text: "Amazon Bedrock Guardrails" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Inspector is a vulnerability management service that automatically discovers Amazon EC2 instances, container images in Amazon ECR and Lambda functions, and continually scans them for software vulnerabilities and unintended network exposure. It rescans when a new CVE is published and creates findings with remediation recommendations."
    fr: "Amazon Inspector est un service de gestion des vulnérabilités qui découvre automatiquement les instances Amazon EC2, les images de conteneur dans Amazon ECR et les fonctions Lambda, et les analyse en continu à la recherche de vulnérabilités logicielles et d'expositions réseau involontaires. Il relance une analyse lorsqu'une nouvelle CVE est publiée et crée des résultats (findings) avec des recommandations de correction."
  options:
    a:
      en: "Macie discovers sensitive data in Amazon S3; it does not scan software for vulnerabilities."
      fr: "Macie découvre des données sensibles dans Amazon S3 ; il n'analyse pas les logiciels à la recherche de vulnérabilités."
    b:
      en: "CloudTrail records API activity for auditing; it does not check software packages for CVEs."
      fr: "CloudTrail enregistre l'activité des API pour l'audit ; il ne vérifie pas les paquets logiciels à la recherche de CVE."
    d:
      en: "Guardrails filter the content of prompts and responses; they do not scan container images or functions."
      fr: "Les barrières de protection filtrent le contenu des invites et des réponses ; elles n'analysent pas les images de conteneur ni les fonctions."
references:
  - title: What is Amazon Inspector?
    url: https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html
