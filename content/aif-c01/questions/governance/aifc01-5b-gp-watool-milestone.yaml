id: aifc01-5b-gp-watool-milestone
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company reviews its Amazon Bedrock workload in the AWS Well-Architected Tool by using the Generative AI Lens. After each review, the team fixes items from the improvement plan. The governance team wants to record the state of the workload after each round of improvements and measure progress over time.

    What should the team do?
  fr: |
    Une entreprise examine sa charge de travail Amazon Bedrock dans AWS Well-Architected Tool avec le Generative AI Lens. Après chaque examen, l'équipe corrige des éléments du plan d'amélioration. L'équipe de gouvernance veut enregistrer l'état de la charge de travail après chaque série d'améliorations et mesurer les progrès dans le temps.

    Que doit faire l'équipe ?
body:
  options:
    - id: a
      text: { en: "Create a new custom lens in the AWS Well-Architected Tool for each review.", fr: "Créer un nouvel objectif personnalisé (custom lens) dans AWS Well-Architected Tool pour chaque examen." }
    - id: b
      text: { en: "Define a new workload in the AWS Well-Architected Tool for each review.", fr: "Définir une nouvelle charge de travail dans AWS Well-Architected Tool pour chaque examen." }
    - id: c
      text: { en: "Save a milestone in the AWS Well-Architected Tool after each round of improvements.", fr: "Enregistrer un jalon (milestone) dans AWS Well-Architected Tool après chaque série d'améliorations." }
    - id: d
      text: { en: "Download an AWS Artifact report after each round of improvements.", fr: "Télécharger un rapport AWS Artifact après chaque série d'améliorations." }
answer: { optionId: c }
explanation:
  correct:
    en: "A milestone records the state of a workload at a point in time. AWS recommends saving one after the first complete review and each time the workload is improved, then comparing milestones to measure progress."
    fr: "Un jalon (milestone) enregistre l'état d'une charge de travail à un instant donné. AWS recommande d'en enregistrer un après le premier examen complet et à chaque amélioration de la charge de travail, puis de comparer les jalons pour mesurer les progrès."
  options:
    a:
      en: "A custom lens defines review questions and best practices; creating a new one does not record the workload's progress."
      fr: "Un objectif personnalisé définit des questions d'examen et des bonnes pratiques ; en créer un nouveau n'enregistre pas les progrès de la charge de travail."
    b:
      en: "A new workload for each review loses the link with earlier answers, so progress cannot be compared."
      fr: "Une nouvelle charge de travail à chaque examen perd le lien avec les réponses précédentes : les progrès ne peuvent pas être comparés."
    d:
      en: "Artifact reports describe AWS's own controls, not the state of the company's workload."
      fr: "Les rapports d'Artifact décrivent les contrôles d'AWS, pas l'état de la charge de travail de l'entreprise."
references:
  - title: Milestones
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/milestones.html
  - title: Generative AI Lens
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html
