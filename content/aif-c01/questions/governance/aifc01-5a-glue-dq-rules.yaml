id: aifc01-5a-glue-dq-rules
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company retrains a model every night with data from its data lake in Amazon S3. Before each training run, the company must check rules such as "the customer_id column has no missing values" and "the row count is close to the average of the recent runs". The company does not want to manage any servers.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise réentraîne un modèle chaque nuit avec les données de son lac de données dans Amazon S3. Avant chaque entraînement, elle doit vérifier des règles comme « la colonne customer_id n'a aucune valeur manquante » et « le nombre de lignes est proche de la moyenne des dernières exécutions ». L'entreprise ne veut gérer aucun serveur.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Macie" }
    - { id: b, text: "AWS Lake Formation" }
    - { id: c, text: "AWS Glue Data Quality" }
    - { id: d, text: "Amazon Inspector" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Glue Data Quality is a serverless feature that evaluates datasets against rules written in Data Quality Definition Language (DQDL), such as completeness checks or dynamic rules that compare the row count with previous runs. It returns a data quality score and can run in ETL jobs to filter bad data before it is loaded."
    fr: "AWS Glue Data Quality est une fonctionnalité sans serveur qui évalue les jeux de données par rapport à des règles écrites en DQDL (Data Quality Definition Language), comme des contrôles d'exhaustivité ou des règles dynamiques qui comparent le nombre de lignes aux exécutions précédentes. Elle renvoie un score de qualité des données et peut s'exécuter dans des tâches ETL pour écarter les données incorrectes avant leur chargement."
  options:
    a:
      en: "Macie discovers sensitive data such as PII in S3 objects; it does not evaluate data quality rules."
      fr: "Macie découvre des données sensibles comme les PII dans les objets S3 ; il n'évalue pas de règles de qualité des données."
    b:
      en: "Lake Formation governs who can access data lake tables and columns; it does not check completeness or row counts."
      fr: "Lake Formation contrôle qui peut accéder aux tables et aux colonnes du lac de données ; il ne vérifie pas l'exhaustivité ni le nombre de lignes."
    d:
      en: "Inspector scans compute resources for software vulnerabilities, not datasets for quality issues."
      fr: "Inspector analyse les ressources de calcul à la recherche de vulnérabilités logicielles, pas les jeux de données à la recherche de problèmes de qualité."
references:
  - title: AWS Glue Data Quality
    url: https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html
