id: aifc01-5b-hal-kb-citations
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm builds a question-answering application with Amazon Bedrock Knowledge Bases. Lawyers must be able to check which source document supports each part of every generated answer.

    Which solution will meet these requirements?
  fr: |
    Un cabinet d'avocats crée une application de questions-réponses avec Amazon Bedrock Knowledge Bases. Les avocats doivent pouvoir vérifier quel document source étaye chaque partie de chaque réponse générée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable Amazon Bedrock model invocation logging and send the logs to Amazon S3.", fr: "Activer la journalisation des appels de modèle Amazon Bedrock et envoyer les journaux vers Amazon S3." }
    - id: b
      text: { en: "Configure an Amazon Bedrock guardrail with a word filter that lists the document names.", fr: "Configurer un garde-fou (guardrail) Amazon Bedrock avec un filtre de mots qui liste les noms des documents." }
    - id: c
      text: { en: "Turn on AWS CloudTrail data events for the knowledge base resource.", fr: "Activer les événements de données AWS CloudTrail pour la ressource de base de connaissances." }
    - id: d
      text: { en: "Display the citations that the RetrieveAndGenerate API returns with each answer.", fr: "Afficher les citations que l'API RetrieveAndGenerate renvoie avec chaque réponse." }
answer: { optionId: d }
explanation:
  correct:
    en: "RetrieveAndGenerate returns citations that link parts of the generated text to the retrieved references, including the source chunk and the document location. Showing them lets lawyers verify each statement against its source and spot unsupported content."
    fr: "RetrieveAndGenerate renvoie des citations qui relient des parties du texte généré aux références récupérées, avec le segment source et l'emplacement du document. Les afficher permet aux avocats de vérifier chaque affirmation par rapport à sa source et de repérer le contenu non étayé."
  options:
    a:
      en: "Invocation logging stores model requests and responses for audit; it does not show lawyers which document supports each statement."
      fr: "La journalisation des appels conserve les requêtes et réponses du modèle pour l'audit ; elle ne montre pas aux avocats quel document étaye chaque affirmation."
    b:
      en: "Word filters block exact words or phrases; they do not attribute sources."
      fr: "Les filtres de mots bloquent des mots ou expressions exacts ; ils n'attribuent pas de sources."
    c:
      en: "CloudTrail data events record who called the API and when, not the sources of the answer text."
      fr: "Les événements de données CloudTrail enregistrent qui a appelé l'API et quand, pas les sources du texte de la réponse."
references:
  - title: Query a knowledge base and generate responses based off the retrieved data
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-retrieve-generate.html
