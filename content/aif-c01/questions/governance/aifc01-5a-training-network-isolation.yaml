id: aifc01-5a-training-network-isolation
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company trains a model on Amazon SageMaker AI with a training container from a third-party vendor. The company must ensure that the code in the container cannot make any outbound network call, including calls to other AWS services. The training job must still read the training data from Amazon S3 and write the model artifacts back to Amazon S3.

    Which solution will meet these requirements?
  fr: |
    Une entreprise entraîne un modèle sur Amazon SageMaker AI avec un conteneur d'entraînement fourni par un éditeur tiers. Elle doit s'assurer que le code du conteneur ne peut effectuer aucun appel réseau sortant, y compris vers d'autres services AWS. La tâche d'entraînement doit toujours lire les données d'entraînement dans Amazon S3 et y réécrire les artefacts du modèle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the training job in VPC subnets that route outbound traffic through a NAT gateway.", fr: "Exécuter la tâche d'entraînement dans des sous-réseaux de VPC qui acheminent le trafic sortant par une passerelle NAT." } }
    - { id: b, text: { en: "Give the job's execution role read-only access to the training data prefix.", fr: "Donner au rôle d'exécution de la tâche un accès en lecture seule au préfixe des données d'entraînement." } }
    - { id: c, text: { en: "Enable network isolation for the training job.", fr: "Activer l'isolement réseau pour la tâche d'entraînement." } }
    - { id: d, text: { en: "Run the training job in private subnets that have an S3 gateway endpoint and no NAT gateway.", fr: "Exécuter la tâche d'entraînement dans des sous-réseaux privés qui ont un point de terminaison de passerelle S3 et aucune passerelle NAT." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With network isolation (EnableNetworkIsolation), the training container cannot make outbound network calls to any service, including Amazon S3, and no AWS credentials are made available to it. SageMaker AI itself downloads the training data and uploads the model artifacts with the execution role, outside the container."
    fr: "Avec l'isolement réseau (EnableNetworkIsolation), le conteneur d'entraînement ne peut effectuer aucun appel réseau sortant vers aucun service, y compris Amazon S3, et aucun identifiant AWS ne lui est fourni. SageMaker AI télécharge lui-même les données d'entraînement et charge les artefacts du modèle avec le rôle d'exécution, en dehors du conteneur."
  options:
    a:
      en: "A NAT gateway gives the container outbound internet access, which the company wants to prevent."
      fr: "Une passerelle NAT donne au conteneur un accès sortant à Internet, ce que l'entreprise veut empêcher."
    b:
      en: "Limiting the role's permissions does not stop the container from sending data over the network to an outside host."
      fr: "Limiter les autorisations du rôle n'empêche pas le conteneur d'envoyer des données par le réseau vers un hôte extérieur."
    d:
      en: "Without isolation, the container can still reach Amazon S3 through the gateway endpoint and other resources in the VPC, so outbound calls to AWS services remain possible."
      fr: "Sans isolement, le conteneur peut toujours atteindre Amazon S3 par le point de terminaison de passerelle ainsi que d'autres ressources du VPC : des appels sortants vers des services AWS restent donc possibles."
references:
  - title: Run Training and Inference Containers in Internet-Free Mode
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/mkt-algo-model-internet-free.html
