id: aifc01-5b-gov-config-encryption-rule
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company trains ML models on Amazon EC2 instances. Its governance policy requires every Amazon EBS volume of these instances to be encrypted. The company wants to evaluate the volumes continuously against this requirement, flag noncompliant volumes, and see how each volume's configuration changed over time.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise entraîne des modèles de ML sur des instances Amazon EC2. Sa politique de gouvernance exige que chaque volume Amazon EBS de ces instances soit chiffré. L'entreprise veut évaluer les volumes en continu par rapport à cette exigence, signaler les volumes non conformes et voir comment la configuration de chaque volume a évolué dans le temps.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Config" }
    - { id: b, text: "Amazon Inspector" }
    - { id: c, text: "AWS Artifact" }
    - { id: d, text: "AWS CloudTrail" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Config records resource configurations and their history, and evaluates them continuously against rules as resources are created, changed, or deleted. A resource that violates a rule is flagged as noncompliant, and Config can send notifications and remediate it."
    fr: "AWS Config enregistre les configurations des ressources et leur historique, et les évalue en continu par rapport à des règles à mesure que les ressources sont créées, modifiées ou supprimées. Une ressource qui enfreint une règle est signalée comme non conforme, et Config peut envoyer des notifications et la corriger."
  options:
    b:
      en: "Inspector scans EC2 instances, container images, and Lambda functions for software vulnerabilities; it does not evaluate resource settings against the company's rules."
      fr: "Inspector analyse les instances EC2, les images de conteneur et les fonctions Lambda à la recherche de vulnérabilités logicielles ; il n'évalue pas les paramètres des ressources par rapport aux règles de l'entreprise."
    c:
      en: "Artifact provides AWS compliance reports and agreements; it does not evaluate the company's resources."
      fr: "Artifact fournit les rapports de conformité et les accords d'AWS ; il n'évalue pas les ressources de l'entreprise."
    d:
      en: "CloudTrail records API calls, such as who created a volume, but it does not evaluate compliance with rules."
      fr: "CloudTrail enregistre les appels d'API, par exemple qui a créé un volume, mais il n'évalue pas la conformité à des règles."
references:
  - title: What Is AWS Config?
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
