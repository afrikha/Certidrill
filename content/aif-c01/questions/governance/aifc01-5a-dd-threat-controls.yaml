id: aifc01-5a-dd-threat-controls
objective: "5.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is reviewing the security risks of its generative AI application on AWS. Match each risk with the AWS service or feature that addresses it. Each service or feature may be used once or not at all.
  fr: |
    Une entreprise examine les risques de sécurité de son application d'IA générative sur AWS. Associez chaque risque au service ou à la fonctionnalité AWS qui y répond. Chaque service ou fonctionnalité peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: insp, text: "Amazon Inspector" }
    - { id: trail, text: "AWS CloudTrail" }
    - { id: pa, text: { en: "Prompt attack filter of Amazon Bedrock Guardrails", fr: "Filtre d'attaques par invite d'Amazon Bedrock Guardrails" } }
    - { id: pl, text: "AWS PrivateLink" }
    - { id: mask, text: { en: "CloudWatch Logs data protection policy", fr: "Politique de protection des données CloudWatch Logs" } }
    - { id: lock, text: "S3 Object Lock" }
  targets:
    - { id: t1, text: { en: "Known software vulnerabilities in the inference container images", fr: "Des vulnérabilités logicielles connues dans les images de conteneur d'inférence" } }
    - { id: t2, text: { en: "Users who try to make the assistant ignore its instructions", fr: "Des utilisateurs qui tentent de faire ignorer ses instructions à l'assistant" } }
    - { id: t3, text: { en: "No record of which principal deleted a guardrail", fr: "Aucun enregistrement du principal qui a supprimé une barrière de protection" } }
    - { id: t4, text: { en: "Model API traffic from the VPC that crosses the public internet", fr: "Du trafic d'API de modèle provenant du VPC qui traverse l'Internet public" } }
answer:
  mapping: { t1: insp, t2: pa, t3: trail, t4: pl }
explanation:
  correct:
    en: "Amazon Inspector continually scans container images in Amazon ECR for CVEs. The prompt attack filter of a guardrail detects prompt injection and jailbreak attempts. CloudTrail records each Amazon Bedrock API call with the identity of the caller. An interface VPC endpoint powered by AWS PrivateLink keeps traffic between the VPC and Amazon Bedrock off the internet."
    fr: "Amazon Inspector analyse en continu les images de conteneur d'Amazon ECR à la recherche de CVE. Le filtre d'attaques par invite d'une barrière de protection détecte les tentatives d'injection d'invite et de débridage. CloudTrail enregistre chaque appel d'API Amazon Bedrock avec l'identité de l'appelant. Un point de terminaison de VPC d'interface basé sur AWS PrivateLink maintient le trafic entre le VPC et Amazon Bedrock à l'écart d'Internet."
  options:
    mask:
      en: "A data protection policy masks sensitive data in log events; none of the risks concerns PII in logs."
      fr: "Une politique de protection des données masque les données sensibles dans les événements de journal ; aucun des risques ne concerne des PII dans les journaux."
    lock:
      en: "Object Lock prevents stored objects from being deleted or overwritten; it does not record who deleted a guardrail."
      fr: "Object Lock empêche la suppression ou l'écrasement des objets stockés ; il n'enregistre pas qui a supprimé une barrière de protection."
references:
  - title: What is Amazon Inspector?
    url: https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html
  - title: Detect prompt attacks with Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
