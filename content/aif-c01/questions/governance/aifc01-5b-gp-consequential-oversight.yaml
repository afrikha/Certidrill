id: aifc01-5b-gp-consequential-oversight
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank uses a foundation model on Amazon Bedrock to recommend whether to approve personal loans.

    According to the AWS Responsible AI Policy, what must the bank do for this use case?
  fr: |
    Une banque utilise un modèle de fondation sur Amazon Bedrock pour recommander l'acceptation ou le refus de prêts personnels.

    Selon la politique d'IA responsable d'AWS (AWS Responsible AI Policy), que doit faire la banque pour ce cas d'usage ?
body:
  options:
    - id: a
      text: { en: "Ask AWS to approve each loan recommendation before the bank uses it.", fr: "Demander à AWS d'approuver chaque recommandation de prêt avant que la banque ne l'utilise." }
    - id: b
      text: { en: "Nothing more, because AWS is responsible for decisions made with its AI services.", fr: "Rien de plus, car AWS est responsable des décisions prises avec ses services d'IA." }
    - id: c
      text: { en: "Assess the risks and implement human oversight, testing, and use-case-specific safeguards.", fr: "Évaluer les risques et mettre en place une supervision humaine, des tests et des protections propres au cas d'usage." }
    - id: d
      text: { en: "Publish the model weights so that each applicant can audit the recommendation.", fr: "Publier les poids du modèle pour que chaque demandeur puisse auditer la recommandation." }
answer: { optionId: c }
explanation:
  correct:
    en: "Lending is a consequential decision that can affect people's rights. For such uses, the AWS Responsible AI Policy requires customers to assess the risks and implement human oversight, testing, and safeguards specific to the use case. Customers are responsible for the decisions that they make based on AI output."
    fr: "L'octroi de prêts est une décision lourde de conséquences qui peut affecter les droits des personnes. Pour ces usages, la politique d'IA responsable d'AWS exige que les clients évaluent les risques et mettent en place une supervision humaine, des tests et des protections propres au cas d'usage. Les clients sont responsables des décisions qu'ils prennent à partir des résultats de l'IA."
  options:
    a:
      en: "AWS does not approve individual decisions; the customer keeps responsibility for them."
      fr: "AWS n'approuve pas les décisions individuelles ; le client en conserve la responsabilité."
    b:
      en: "Customers and their end users are responsible for decisions based on AI output, which can be inaccurate."
      fr: "Les clients et leurs utilisateurs finaux sont responsables des décisions fondées sur les résultats de l'IA, qui peuvent être inexacts."
    d:
      en: "The policy does not require publishing model weights, and the bank cannot publish a third-party model's weights."
      fr: "La politique n'exige pas de publier les poids du modèle, et la banque ne peut pas publier les poids d'un modèle tiers."
references:
  - title: AWS Responsible AI Policy
    url: https://aws.amazon.com/ai/responsible-ai/policy/
