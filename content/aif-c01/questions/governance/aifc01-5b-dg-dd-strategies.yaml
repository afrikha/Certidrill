id: aifc01-5b-dg-dd-strategies
objective: "5.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A company is writing the data governance strategy for its generative AI applications.

    Which data governance concept matches each description? To answer, drag the appropriate concepts to the correct descriptions. Each concept may be used once or not at all.
  fr: |
    Une entreprise rédige la stratégie de gouvernance des données de ses applications d'IA générative.

    Quel concept de gouvernance des données correspond à chaque description ? Pour répondre, faites glisser les concepts appropriés vers les descriptions correspondantes. Chaque concept peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: ret, text: { en: "Data retention", fr: "Conservation des données" } }
    - { id: res, text: { en: "Data residency", fr: "Résidence des données" } }
    - { id: log, text: { en: "Logging", fr: "Journalisation" } }
    - { id: mon, text: { en: "Monitoring", fr: "Surveillance" } }
    - { id: lc, text: { en: "Data lifecycle management", fr: "Gestion du cycle de vie des données" } }
    - { id: lin, text: { en: "Data lineage", fr: "Traçabilité des données" } }
  targets:
    - id: t1
      text: { en: "Requires data to be stored and processed in a specific geography", fr: "Exige que les données soient stockées et traitées dans une zone géographique précise" }
    - id: t2
      text: { en: "Defines how long records must be kept before they can be deleted", fr: "Définit combien de temps les enregistrements doivent être gardés avant de pouvoir être supprimés" }
    - id: t3
      text: { en: "Records each request made to the AI system, who made it, and when", fr: "Enregistre chaque requête adressée au système d'IA, son auteur et sa date" }
    - id: t4
      text: { en: "Tracks metrics continuously and raises alerts when values are abnormal", fr: "Suit des métriques en continu et déclenche des alertes quand des valeurs sont anormales" }
    - id: t5
      text: { en: "Manages data from collection through use and archiving to deletion", fr: "Gère les données de leur collecte à leur suppression, en passant par leur utilisation et leur archivage" }
answer:
  mapping: { t1: res, t2: ret, t3: log, t4: mon, t5: lc }
explanation:
  correct:
    en: "Data residency keeps data in a chosen geography, for example with Amazon Bedrock geographic cross-Region inference profiles. Retention sets how long records are kept, for example with a CloudWatch Logs retention setting or S3 Object Lock. Logging records each request and its caller, as model invocation logging and CloudTrail do. Monitoring tracks metrics and alerts. Lifecycle management covers data from creation to deletion, for example with S3 Lifecycle. Data lineage, which tracks where data comes from and how it was transformed, matches no description."
    fr: "La résidence des données maintient les données dans une zone choisie, par exemple avec les profils d'inférence entre Régions géographiques d'Amazon Bedrock. La conservation fixe la durée de garde des enregistrements, par exemple avec le paramètre de conservation de CloudWatch Logs ou S3 Object Lock. La journalisation enregistre chaque requête et son auteur, comme le font la journalisation des appels de modèle et CloudTrail. La surveillance suit des métriques et alerte. La gestion du cycle de vie couvre les données de leur création à leur suppression, par exemple avec S3 Lifecycle. La traçabilité des données, qui suit leur origine et leurs transformations, ne correspond à aucune description."
references:
  - title: Data security, lifecycle, and strategy for generative AI applications
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-data-considerations-gen-ai/introduction.html
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
