id: aifc01-5a-macie-training-pii
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company stores thousands of documents in Amazon S3 buckets. The company plans to use the documents to customize a foundation model. Before that, the company must find which objects contain personally identifiable information (PII), such as names and health insurance numbers.

    Which AWS service should the company use?
  fr: |
    Une entreprise de santé stocke des milliers de documents dans des compartiments Amazon S3. Elle prévoit d'utiliser ces documents pour personnaliser un modèle de fondation. Avant cela, elle doit trouver les objets qui contiennent des informations personnelles identifiables (PII), comme des noms et des numéros d'assurance maladie.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon Macie" }
    - { id: b, text: "Amazon Inspector" }
    - { id: c, text: "AWS Config" }
    - { id: d, text: "Amazon Bedrock Guardrails" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Macie uses machine learning and pattern matching to discover sensitive data, such as PII, financial information and credentials, in Amazon S3 objects. Automated sensitive data discovery or a sensitive data discovery job reports the objects that contain this data before it is used for model customization."
    fr: "Amazon Macie utilise le machine learning et la correspondance de modèles pour découvrir des données sensibles, comme des PII, des informations financières et des identifiants, dans les objets Amazon S3. La découverte automatisée des données sensibles ou une tâche de découverte des données sensibles signale les objets qui contiennent ces données avant leur utilisation pour la personnalisation du modèle."
  options:
    b:
      en: "Amazon Inspector scans EC2 instances, container images and Lambda functions for software vulnerabilities; it does not inspect the content of S3 objects."
      fr: "Amazon Inspector analyse les instances EC2, les images de conteneur et les fonctions Lambda à la recherche de vulnérabilités logicielles ; il n'inspecte pas le contenu des objets S3."
    c:
      en: "AWS Config records and evaluates resource configurations; it does not look for PII inside documents."
      fr: "AWS Config enregistre et évalue les configurations des ressources ; il ne recherche pas de PII dans les documents."
    d:
      en: "Guardrails filter prompts and model responses at inference time; they do not scan the documents stored in S3 buckets."
      fr: "Les barrières de protection filtrent les invites et les réponses du modèle au moment de l'inférence ; elles n'analysent pas les documents stockés dans les compartiments S3."
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
