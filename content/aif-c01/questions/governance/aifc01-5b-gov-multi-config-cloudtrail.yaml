id: aifc01-5b-gov-multi-config-cloudtrail
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores fine-tuning data in an Amazon S3 bucket. The company must be alerted when the bucket's encryption setting no longer meets its policy, and it must identify the IAM principal who made the change.

    Which combination of AWS services will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise stocke des données de peaufinage (fine-tuning) dans un compartiment Amazon S3. L'entreprise doit être alertée quand le paramètre de chiffrement du compartiment ne respecte plus sa politique, et elle doit identifier le principal IAM qui a effectué la modification.

    Quelle combinaison de services AWS répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "AWS Artifact" }
    - { id: b, text: "AWS Config" }
    - { id: c, text: "Amazon Inspector" }
    - { id: d, text: "AWS CloudTrail" }
    - { id: e, text: "AWS Trusted Advisor" }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: "AWS Config evaluates the bucket continuously against a rule, flags it as noncompliant when the setting changes, and sends a notification. AWS CloudTrail records the API call that changed the setting, with the identity that made it, so the company can tell who made the change."
    fr: "AWS Config évalue le compartiment en continu par rapport à une règle, le signale comme non conforme quand le paramètre change et envoie une notification. AWS CloudTrail enregistre l'appel d'API qui a modifié le paramètre, avec l'identité qui l'a effectué : l'entreprise sait ainsi qui a fait la modification."
  options:
    a:
      en: "Artifact provides AWS compliance reports and agreements; it does not monitor the company's resources."
      fr: "Artifact fournit les rapports de conformité et les accords d'AWS ; il ne surveille pas les ressources de l'entreprise."
    c:
      en: "Inspector scans compute resources for software vulnerabilities; it does not track S3 bucket settings or callers."
      fr: "Inspector analyse les ressources de calcul à la recherche de vulnérabilités logicielles ; il ne suit ni les paramètres des compartiments S3 ni les appelants."
    e:
      en: "Trusted Advisor runs AWS best-practice checks; it does not evaluate the company's policy or identify who made a change."
      fr: "Trusted Advisor exécute des vérifications de bonnes pratiques AWS ; il n'évalue pas la politique de l'entreprise et n'identifie pas l'auteur d'une modification."
references:
  - title: What Is AWS Config?
    url: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html
  - title: What Is AWS CloudTrail?
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html
