id: aifc01-5b-gp-scope-pretrained
objective: "5.2.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A retail company builds its own product question-answering application. The application calls a third-party foundation model on Amazon Bedrock through the API and adds product data that Amazon Bedrock Knowledge Bases retrieves. The company does not train or customize the model.

    Which scope of the Generative AI Security Scoping Matrix applies to this application?
  fr: |
    Une entreprise de distribution crée sa propre application de questions-réponses sur ses produits. L'application appelle un modèle de fondation tiers sur Amazon Bedrock via l'API et ajoute des données produits qu'Amazon Bedrock Knowledge Bases récupère. L'entreprise n'entraîne ni ne personnalise le modèle.

    Quel niveau (scope) de la matrice de cadrage de la sécurité de l'IA générative (Generative AI Security Scoping Matrix) s'applique à cette application ?
body:
  options:
    - { id: a, text: { en: "Scope 2: Enterprise app", fr: "Scope 2 : application d'entreprise (Enterprise app)" } }
    - { id: b, text: { en: "Scope 3: Pre-trained models", fr: "Scope 3 : modèles pré-entraînés (Pre-trained models)" } }
    - { id: c, text: { en: "Scope 4: Fine-tuned models", fr: "Scope 4 : modèles peaufinés (Fine-tuned models)" } }
    - { id: d, text: { en: "Scope 5: Self-trained models", fr: "Scope 5 : modèles entraînés par l'organisation (Self-trained models)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "In Scope 3, the organization builds its own application on an existing third-party foundation model that it calls through an API. Retrieval Augmented Generation (RAG) with Knowledge Bases supplies company data at inference time without training the model, so the use case stays in Scope 3."
    fr: "Dans le scope 3, l'organisation crée sa propre application sur un modèle de fondation tiers existant qu'elle appelle via une API. La génération à enrichissement contextuel (RAG) avec Knowledge Bases fournit les données de l'entreprise au moment de l'inférence, sans entraîner le modèle : le cas d'usage reste donc dans le scope 3."
  options:
    a:
      en: "Scope 2 means using a vendor's enterprise application with embedded generative AI; this company builds its own application."
      fr: "Le scope 2 consiste à utiliser l'application d'entreprise d'un éditeur avec de l'IA générative intégrée ; cette entreprise crée sa propre application."
    c:
      en: "Scope 4 requires training an existing model with business data; adding retrieved data to prompts does not change the model."
      fr: "Le scope 4 suppose d'entraîner un modèle existant avec des données métier ; ajouter des données récupérées aux invites ne modifie pas le modèle."
    d:
      en: "Scope 5 means building and training a model from scratch."
      fr: "Le scope 5 consiste à créer et entraîner un modèle à partir de zéro."
references:
  - title: "Securing Generative AI: The Generative AI Security Scoping Matrix"
    url: https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/
