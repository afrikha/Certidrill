id: aifc01-5a-ord-pii-before-training
objective: "5.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An insurance company stores claim records in several Amazon S3 buckets. The company wants to use the records to train a model. The model must never be trained on personally identifiable information (PII), and the company does not yet know which buckets contain PII.

    Which three steps should the company perform in sequence? To answer, select the appropriate steps from the list and arrange them in the correct order.
  fr: |
    Une compagnie d'assurance stocke des dossiers de sinistres dans plusieurs compartiments Amazon S3. Elle veut utiliser ces dossiers pour entraîner un modèle. Le modèle ne doit jamais être entraîné sur des informations personnelles identifiables (PII), et la compagnie ne sait pas encore quels compartiments contiennent des PII.

    Quelles sont les trois étapes que la compagnie doit effectuer dans l'ordre ? Pour répondre, sélectionnez les étapes appropriées dans la liste et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: train
      text: { en: "Grant the training job's role read access only to the redacted data, and start the training job.", fr: "Accorder au rôle de la tâche d'entraînement un accès en lecture aux seules données masquées, puis démarrer la tâche d'entraînement." }
    - id: guardrail
      text: { en: "Create an Amazon Bedrock guardrail with a sensitive information filter to mask the PII in the S3 objects.", fr: "Créer une barrière de protection Amazon Bedrock avec un filtre d'informations sensibles pour masquer les PII dans les objets S3." }
    - id: macie
      text: { en: "Run an Amazon Macie sensitive data discovery job to find the objects that contain PII.", fr: "Exécuter une tâche de découverte des données sensibles Amazon Macie pour trouver les objets qui contiennent des PII." }
    - id: rawtrain
      text: { en: "Train the model on the original objects, and then delete the objects that contain PII.", fr: "Entraîner le modèle sur les objets d'origine, puis supprimer les objets qui contiennent des PII." }
    - id: glue
      text: { en: "Run an AWS Glue job with the Detect PII transform that redacts the PII and writes the output to a new prefix.", fr: "Exécuter une tâche AWS Glue avec la transformation Detect PII qui masque les PII et écrit le résultat dans un nouveau préfixe." }
answer:
  sequence: [macie, glue, train]
explanation:
  correct:
    en: "Macie first discovers which S3 objects contain sensitive data such as PII. A Glue job with the Detect PII transform then redacts the detected values and writes a clean copy. Finally, the training job's role is limited to the redacted copy, so the model is trained only on data without PII."
    fr: "Macie découvre d'abord les objets S3 qui contiennent des données sensibles comme des PII. Une tâche Glue avec la transformation Detect PII masque ensuite les valeurs détectées et écrit une copie nettoyée. Enfin, le rôle de la tâche d'entraînement est limité à cette copie masquée : le modèle n'est ainsi entraîné que sur des données sans PII."
  options:
    guardrail:
      en: "Guardrails filter prompts and model responses at inference time; they do not transform objects stored in S3."
      fr: "Les barrières de protection filtrent les invites et les réponses du modèle au moment de l'inférence ; elles ne transforment pas les objets stockés dans S3."
    rawtrain:
      en: "Deleting the objects after training is too late: the model has already learned from the PII."
      fr: "Supprimer les objets après l'entraînement est trop tard : le modèle a déjà appris à partir des PII."
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
  - title: Detect and process sensitive data
    url: https://docs.aws.amazon.com/glue/latest/dg/detect-PII.html
