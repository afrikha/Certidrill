id: aifc01-5b-dg-legal-hold
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company keeps the datasets that it used to train a credit-scoring model in an Amazon S3 bucket that has S3 Object Lock enabled. A regulator opens an investigation, and the company must prevent the deletion of these dataset objects until the investigation ends. The end date is unknown.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conserve les jeux de données qui ont servi à entraîner un modèle de notation de crédit dans un compartiment Amazon S3 où S3 Object Lock est activé. Un régulateur ouvre une enquête, et l'entreprise doit empêcher la suppression de ces objets jusqu'à la fin de l'enquête. La date de fin est inconnue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Apply a compliance-mode retention period of 10 years to the dataset objects.", fr: "Appliquer aux objets une période de conservation de 10 ans en mode conformité." }
    - id: b
      text: { en: "Apply a governance-mode retention period of 1 year and extend it when needed.", fr: "Appliquer une période de conservation d'un an en mode gouvernance et la prolonger si nécessaire." }
    - id: c
      text: { en: "Add an S3 Lifecycle expiration rule that stays disabled until the investigation ends.", fr: "Ajouter une règle d'expiration S3 Lifecycle qui reste désactivée jusqu'à la fin de l'enquête." }
    - id: d
      text: { en: "Place a legal hold on the dataset objects and remove it when the investigation ends.", fr: "Placer une conservation légale (legal hold) sur les objets et la retirer à la fin de l'enquête." }
answer: { optionId: d }
explanation:
  correct:
    en: "A legal hold protects an object version from being overwritten or deleted, has no expiration date, and stays in place until someone with the s3:PutObjectLegalHold permission removes it. AWS recommends a legal hold when the end date is unknown, such as during an audit or an investigation."
    fr: "Une conservation légale protège une version d'objet contre l'écrasement et la suppression, n'a pas de date d'expiration et reste en place jusqu'à ce qu'une personne disposant de l'autorisation s3:PutObjectLegalHold la retire. AWS recommande la conservation légale quand la date de fin est inconnue, comme pendant un audit ou une enquête."
  options:
    a:
      en: "A compliance-mode period cannot be shortened, so the objects would stay locked for 10 years even after the investigation ends."
      fr: "Une période en mode conformité ne peut pas être réduite : les objets resteraient verrouillés 10 ans, même après la fin de l'enquête."
    b:
      en: "Users with the s3:BypassGovernanceRetention permission can still delete objects in governance mode, and the period must be extended by hand."
      fr: "Les utilisateurs disposant de l'autorisation s3:BypassGovernanceRetention peuvent encore supprimer des objets en mode gouvernance, et la période doit être prolongée à la main."
    c:
      en: "A Lifecycle rule automates expiration; it does not stop users from deleting objects."
      fr: "Une règle Lifecycle automatise l'expiration ; elle n'empêche pas les utilisateurs de supprimer des objets."
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
