id: aifc01-5a-data-quality-reason
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data engineering team is preparing a dataset that will be used to train a machine learning model.

    Why should the team assess the quality of the dataset before training?
  fr: |
    Une équipe d'ingénierie des données prépare un jeu de données qui servira à entraîner un modèle de machine learning.

    Pourquoi l'équipe doit-elle évaluer la qualité du jeu de données avant l'entraînement ?
body:
  options:
    - { id: a, text: { en: "Missing, duplicated, or incorrect records can produce an inaccurate or biased model.", fr: "Des enregistrements manquants, dupliqués ou incorrects peuvent produire un modèle inexact ou biaisé." } }
    - { id: b, text: { en: "A data quality assessment encrypts the dataset at rest before training.", fr: "Une évaluation de la qualité des données chiffre le jeu de données au repos avant l'entraînement." } }
    - { id: c, text: { en: "Assessing data quality reduces the inference latency of the deployed model.", fr: "L'évaluation de la qualité des données réduit la latence d'inférence du modèle déployé." } }
    - { id: d, text: { en: "A data quality assessment removes the need to evaluate the trained model.", fr: "Une évaluation de la qualité des données évite d'avoir à évaluer le modèle entraîné." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A model learns from its training data, so incomplete, duplicated, incorrect or unvetted records lead to wrong or biased predictions, and unvetted data can even carry poisoning. Quality rules, such as those of AWS Glue Data Quality, catch these problems before the data is used."
    fr: "Un modèle apprend à partir de ses données d'entraînement : des enregistrements incomplets, dupliqués, incorrects ou non vérifiés conduisent à des prédictions fausses ou biaisées, et des données non vérifiées peuvent même servir à un empoisonnement. Des règles de qualité, comme celles d'AWS Glue Data Quality, détectent ces problèmes avant l'utilisation des données."
  options:
    b:
      en: "Quality checks evaluate the content of the data; encryption is a separate control, for example SSE-KMS."
      fr: "Les contrôles de qualité évaluent le contenu des données ; le chiffrement est un contrôle distinct, par exemple SSE-KMS."
    c:
      en: "Inference latency depends on the model and the hosting configuration, not on a quality check of the training data."
      fr: "La latence d'inférence dépend du modèle et de la configuration d'hébergement, pas d'un contrôle de qualité des données d'entraînement."
    d:
      en: "Good data does not replace model evaluation; the trained model must still be tested against its metrics."
      fr: "De bonnes données ne remplacent pas l'évaluation du modèle ; le modèle entraîné doit toujours être testé par rapport à ses métriques."
references:
  - title: AWS Glue Data Quality
    url: https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html
  - title: 5. Data security and governance for agentic AI systems on AWS
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/best-practices-data.html
