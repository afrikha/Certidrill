id: aifc01-5a-kb-citations
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm builds an assistant with Amazon Bedrock Knowledge Bases over its internal case documents. The lawyers must be able to check which documents support each answer that the assistant gives.

    What should the law firm do?
  fr: |
    Un cabinet d'avocats crée un assistant avec Amazon Bedrock Knowledge Bases à partir de ses documents de dossiers internes. Les avocats doivent pouvoir vérifier quels documents étayent chaque réponse de l'assistant.

    Que doit faire le cabinet d'avocats ?
body:
  options:
    - { id: a, text: { en: "Display the citations that the knowledge base includes in each generated response.", fr: "Afficher les citations que la base de connaissances inclut dans chaque réponse générée." } }
    - { id: b, text: { en: "Fine-tune the foundation model on the case documents instead of using the knowledge base.", fr: "Peaufiner le modèle de fondation sur les documents de dossiers au lieu d'utiliser la base de connaissances." } }
    - { id: c, text: { en: "Lower the temperature so that the answers repeat the documents word for word.", fr: "Réduire la température pour que les réponses reprennent les documents mot pour mot." } }
    - { id: d, text: { en: "Enable model invocation logging and send the log files to the lawyers.", fr: "Activer la journalisation des invocations de modèle et envoyer les fichiers journaux aux avocats." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock Knowledge Bases can include citations in the generated response, so that the original data source can be referenced and the accuracy of the answer can be checked. Showing these citations next to each answer lets the lawyers open the supporting documents."
    fr: "Amazon Bedrock Knowledge Bases peut inclure des citations dans la réponse générée, afin que la source de données d'origine puisse être référencée et que l'exactitude de la réponse puisse être vérifiée. Afficher ces citations à côté de chaque réponse permet aux avocats d'ouvrir les documents qui l'étayent."
  options:
    b:
      en: "A fine-tuned model absorbs the documents into its weights and cannot point to the document behind an answer."
      fr: "Un modèle peaufiné intègre les documents dans ses poids et ne peut pas indiquer le document à l'origine d'une réponse."
    c:
      en: "Temperature only changes how random the output is; it does not identify any source."
      fr: "La température ne modifie que le caractère aléatoire de la sortie ; elle n'identifie aucune source."
    d:
      en: "Invocation logs record requests and responses for administrators; they are not a way for users to see the source of each answer."
      fr: "Les journaux d'invocation enregistrent les requêtes et les réponses pour les administrateurs ; ce n'est pas un moyen pour les utilisateurs de voir la source de chaque réponse."
references:
  - title: Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
