id: aifc01-5b-gp-acceptable-use-training
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An internal audit at a software company finds that developers paste confidential source code into a public generative AI chat website. The company wants to address the root cause in all its teams.

    Which governance process will meet this requirement?
  fr: |
    Un audit interne dans un éditeur de logiciels révèle que des développeurs collent du code source confidentiel dans un site web public de conversation par IA générative. L'entreprise veut traiter la cause profonde dans toutes ses équipes.

    Quel processus de gouvernance répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Enable Amazon Macie on the Amazon S3 buckets that store the source code.", fr: "Activer Amazon Macie sur les compartiments Amazon S3 qui stockent le code source." }
    - id: b
      text: { en: "Run Amazon Inspector scans on the Amazon EC2 instances of the developers.", fr: "Exécuter des analyses Amazon Inspector sur les instances Amazon EC2 des développeurs." }
    - id: c
      text: { en: "Configure Amazon Bedrock Guardrails in the company's AWS accounts.", fr: "Configurer Amazon Bedrock Guardrails dans les comptes AWS de l'entreprise." }
    - id: d
      text: { en: "Publish an acceptable-use policy for generative AI tools and train every team on it.", fr: "Publier une politique d'utilisation acceptable des outils d'IA générative et y former chaque équipe." }
answer: { optionId: d }
explanation:
  correct:
    en: "The root cause is a people and process gap. AWS guidance says that users should understand acceptable AI use according to the organization's policy and recommends security awareness training for teams that work with generative AI. The Scoping Matrix adds that Scope 1 consumer tools should receive only public, non-proprietary data."
    fr: "La cause profonde est une lacune humaine et organisationnelle. Les recommandations d'AWS indiquent que les utilisateurs doivent connaître l'utilisation acceptable de l'IA définie par la politique de l'organisation, et préconisent une formation de sensibilisation à la sécurité pour les équipes qui travaillent avec l'IA générative. La matrice de cadrage ajoute que les outils grand public du scope 1 ne doivent recevoir que des données publiques et non propriétaires."
  options:
    a:
      en: "Macie finds sensitive data stored in Amazon S3; it cannot see what developers paste into a public website."
      fr: "Macie trouve les données sensibles stockées dans Amazon S3 ; il ne voit pas ce que les développeurs collent dans un site web public."
    b:
      en: "Inspector scans for software vulnerabilities; it does not change how employees use external tools."
      fr: "Inspector recherche des vulnérabilités logicielles ; il ne change pas la façon dont les employés utilisent des outils externes."
    c:
      en: "Guardrails apply to the company's own Amazon Bedrock calls, not to a third-party public website."
      fr: "Les barrières de protection s'appliquent aux appels Amazon Bedrock de l'entreprise, pas à un site web public tiers."
references:
  - title: "Security perspective: Compliance and assurance of AI systems"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-caf-for-ai/security-perspective-compliance-and-assurance-of-aiml-systems.html
  - title: "Layer 3: Security and governance for generative AI platforms on AWS"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-enterprise-ready-gen-ai-platform/security.html
