id: aifc01-5b-dg-invocation-logging-audit
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company uses Amazon Bedrock. Its data governance policy requires the company to keep the full text of every prompt and model response, together with the caller identity, for later audits.

    Which solution will meet these requirements?
  fr: |
    Un établissement de santé utilise Amazon Bedrock. Sa politique de gouvernance des données l'oblige à conserver le texte intégral de chaque invite et de chaque réponse du modèle, avec l'identité de l'appelant, pour des audits ultérieurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable Amazon Bedrock model invocation logging with an Amazon S3 destination.", fr: "Activer la journalisation des appels de modèle Amazon Bedrock (model invocation logging) avec une destination Amazon S3." }
    - id: b
      text: { en: "Rely on the AWS CloudTrail management events that Amazon Bedrock logs by default.", fr: "S'appuyer sur les événements de gestion AWS CloudTrail qu'Amazon Bedrock journalise par défaut." }
    - id: c
      text: { en: "Monitor the Amazon Bedrock runtime metrics in Amazon CloudWatch.", fr: "Surveiller les métriques d'exécution d'Amazon Bedrock dans Amazon CloudWatch." }
    - id: d
      text: { en: "Record the Amazon Bedrock resources with AWS Config.", fr: "Enregistrer les ressources Amazon Bedrock avec AWS Config." }
answer: { optionId: a }
explanation:
  correct:
    en: "Model invocation logging records the full request data, response data, and metadata of supported calls, including the caller's identity ARN. It is disabled by default, and it delivers logs to Amazon S3, Amazon CloudWatch Logs, or both."
    fr: "La journalisation des appels de modèle enregistre l'intégralité des données de requête, des données de réponse et des métadonnées des appels pris en charge, dont l'ARN de l'identité de l'appelant. Elle est désactivée par défaut et livre les journaux dans Amazon S3, dans Amazon CloudWatch Logs, ou dans les deux."
  options:
    b:
      en: "CloudTrail records who called which model and when, but its events do not contain the prompt and response text."
      fr: "CloudTrail enregistre qui a appelé quel modèle et quand, mais ses événements ne contiennent pas le texte des invites et des réponses."
    c:
      en: "CloudWatch metrics give counts and latencies, not the content of the calls."
      fr: "Les métriques CloudWatch donnent des nombres et des latences, pas le contenu des appels."
    d:
      en: "Config records resource configurations, not model requests and responses."
      fr: "Config enregistre les configurations des ressources, pas les requêtes et réponses des modèles."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
