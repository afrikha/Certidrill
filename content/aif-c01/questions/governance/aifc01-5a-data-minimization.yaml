id: aifc01-5a-data-minimization
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A telecommunications company is building a churn prediction model. The customer dataset includes full names and phone numbers. The model does not need these fields as features.

    What should the company do with these fields?
  fr: |
    Une entreprise de télécommunications crée un modèle de prédiction de l'attrition. Le jeu de données clients contient les noms complets et les numéros de téléphone. Le modèle n'a pas besoin de ces champs comme caractéristiques.

    Que doit faire l'entreprise de ces champs ?
body:
  options:
    - { id: a, text: { en: "Keep the fields so that the model has more features to learn from.", fr: "Conserver les champs pour que le modèle dispose de plus de caractéristiques pour apprendre." } }
    - { id: b, text: { en: "Remove the fields from the training dataset before training.", fr: "Supprimer les champs du jeu de données d'entraînement avant l'entraînement." } }
    - { id: c, text: { en: "Keep the fields and encrypt the dataset with a customer managed AWS KMS key.", fr: "Conserver les champs et chiffrer le jeu de données avec une clé AWS KMS gérée par le client." } }
    - { id: d, text: { en: "Keep the fields and run an Amazon Macie job on the dataset every month.", fr: "Conserver les champs et exécuter une tâche Amazon Macie sur le jeu de données chaque mois." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Personal data that the use case does not need only adds risk: it can be exposed through access to the dataset or, for some models, through what the model memorizes. Auditing the data for such attributes and removing them before training is the simplest way to protect it."
    fr: "Des données personnelles dont le cas d'utilisation n'a pas besoin ne font qu'ajouter un risque : elles peuvent être exposées par l'accès au jeu de données ou, pour certains modèles, par ce que le modèle mémorise. Auditer les données pour repérer ces attributs et les supprimer avant l'entraînement est le moyen le plus simple de les protéger."
  options:
    a:
      en: "Names and phone numbers do not help predict churn and can make the model memorize personal data."
      fr: "Les noms et les numéros de téléphone n'aident pas à prédire l'attrition et peuvent amener le modèle à mémoriser des données personnelles."
    c:
      en: "Encryption protects the data at rest, but the unneeded personal data is still processed and can still reach the model."
      fr: "Le chiffrement protège les données au repos, mais les données personnelles inutiles sont toujours traitées et peuvent toujours atteindre le modèle."
    d:
      en: "Macie would only report the PII that the company already knows about; it does not remove it."
      fr: "Macie ne ferait que signaler les PII que l'entreprise connaît déjà ; il ne les supprime pas."
references:
  - title: MLSEC02-BP01 Design data encryption and obfuscation
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlsec02-bp01.html
  - title: 5. Data security and governance for agentic AI systems on AWS
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-security/best-practices-data.html
