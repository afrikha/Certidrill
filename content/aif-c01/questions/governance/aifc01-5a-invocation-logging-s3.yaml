id: aifc01-5a-invocation-logging-s3
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company uses Amazon Bedrock with the default settings. The compliance team must keep the full text of every prompt and every model response of the Converse and InvokeModel calls in an Amazon S3 bucket for later review.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers utilise Amazon Bedrock avec les paramètres par défaut. L'équipe de conformité doit conserver dans un compartiment Amazon S3, pour un examen ultérieur, le texte complet de chaque invite et de chaque réponse du modèle des appels Converse et InvokeModel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS CloudTrail trail that delivers the management events to the bucket.", fr: "Créer un journal de suivi AWS CloudTrail qui livre les événements de gestion dans le compartiment." } }
    - { id: b, text: { en: "Enable model invocation logging in Amazon Bedrock with the bucket as the destination.", fr: "Activer la journalisation des invocations de modèle dans Amazon Bedrock avec le compartiment comme destination." } }
    - { id: c, text: { en: "Attach a guardrail whose filters all use the Detect mode to every model call.", fr: "Associer à chaque appel de modèle une barrière de protection dont tous les filtres utilisent le mode Detect." } }
    - { id: d, text: { en: "Turn on Amazon Macie automated sensitive data discovery for the bucket.", fr: "Activer la découverte automatisée des données sensibles d'Amazon Macie pour le compartiment." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Model invocation logging collects the input and output data and the metadata of Converse, ConverseStream, InvokeModel and InvokeModelWithResponseStream calls in the account and Region. It is disabled by default and can deliver to Amazon CloudWatch Logs, Amazon S3 or both; large bodies are supported only in S3."
    fr: "La journalisation des invocations de modèle collecte les données d'entrée et de sortie ainsi que les métadonnées des appels Converse, ConverseStream, InvokeModel et InvokeModelWithResponseStream du compte et de la Région. Elle est désactivée par défaut et peut écrire dans Amazon CloudWatch Logs, dans Amazon S3 ou dans les deux ; les corps volumineux ne sont pris en charge que dans S3."
  options:
    a:
      en: "CloudTrail is designed to record who called which API and when; capturing the full content of prompts and responses is the purpose of model invocation logging."
      fr: "CloudTrail est conçu pour enregistrer qui a appelé quelle API et quand ; capturer le contenu complet des invites et des réponses est le rôle de la journalisation des invocations de modèle."
    c:
      en: "In Detect mode a guardrail returns detection information in the response, but it does not keep a record of the prompts and responses."
      fr: "En mode Detect, une barrière de protection renvoie des informations de détection dans la réponse, mais elle ne conserve aucun enregistrement des invites et des réponses."
    d:
      en: "Macie analyzes objects that are already in the bucket; it does not capture model traffic."
      fr: "Macie analyse les objets déjà présents dans le compartiment ; il ne capture pas le trafic du modèle."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
