id: aifc01-5b-hal-order-rag-guard
objective: "5.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A retail company builds a support assistant. The application calls the Amazon Bedrock Knowledge Bases Retrieve API, a foundation model (FM), and the ApplyGuardrail API separately. Answers that are not grounded in the retrieved content must be blocked.

    Which four steps should the application perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise de distribution crée un assistant de support. L'application appelle séparément l'API Retrieve d'Amazon Bedrock Knowledge Bases, un modèle de fondation (FM) et l'API ApplyGuardrail. Les réponses qui ne sont pas ancrées dans le contenu récupéré doivent être bloquées.

    Quelles sont les quatre étapes que l'application doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: pre
      text: { en: "Run the contextual grounding check on the customer's question before the retrieval.", fr: "Exécuter la vérification de l'ancrage contextuel sur la question du client avant la récupération." }
    - id: gen
      text: { en: "Send the question and the retrieved passages to the FM to generate a response.", fr: "Envoyer la question et les passages récupérés au FM pour générer une réponse." }
    - id: out
      text: { en: "Return the response if it passes the check, or the blocked-response message if it fails.", fr: "Renvoyer la réponse si elle passe la vérification, ou le message de réponse bloquée si elle échoue." }
    - id: ret
      text: { en: "Retrieve the passages that are relevant to the customer's question from the knowledge base.", fr: "Récupérer dans la base de connaissances les passages pertinents pour la question du client." }
    - id: ft
      text: { en: "Fine-tune the FM on the retrieved passages for each new question.", fr: "Peaufiner (fine-tuning) le FM sur les passages récupérés pour chaque nouvelle question." }
    - id: chk
      text: { en: "Call ApplyGuardrail with the passages as the grounding source, the question as the query, and the response as the content to guard.", fr: "Appeler ApplyGuardrail avec les passages comme source d'ancrage, la question comme requête et la réponse comme contenu à protéger." }
answer:
  sequence: [ret, gen, chk, out]
explanation:
  correct:
    en: "The application first retrieves the relevant passages, then sends them with the question to the FM. The contextual grounding check needs a model response, so ApplyGuardrail runs after generation, with the passages as grounding source and the question as query. A response below the threshold is replaced by the blocked-response message."
    fr: "L'application récupère d'abord les passages pertinents, puis les envoie avec la question au FM. La vérification de l'ancrage contextuel a besoin d'une réponse du modèle : ApplyGuardrail s'exécute donc après la génération, avec les passages comme source d'ancrage et la question comme requête. Une réponse inférieure au seuil est remplacée par le message de réponse bloquée."
  options:
    pre:
      en: "Contextual grounding checks run on model output, not on the prompt, because they need a response to score."
      fr: "Les vérifications de l'ancrage contextuel portent sur la sortie du modèle, pas sur l'invite, car il leur faut une réponse à noter."
    ft:
      en: "RAG grounds each answer at inference time; fine-tuning for every question is neither needed nor practical."
      fr: "Le RAG ancre chaque réponse au moment de l'inférence ; un peaufinage pour chaque question n'est ni nécessaire ni réaliste."
references:
  - title: Use contextual grounding check to filter hallucinations in responses
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: Query a knowledge base and generate responses based off the retrieved data
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-retrieve-generate.html
