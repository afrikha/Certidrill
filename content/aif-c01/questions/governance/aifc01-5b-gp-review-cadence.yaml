id: aifc01-5b-gp-review-cadence
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has launched a generative AI assistant on AWS. Its governance team must decide when the security controls and policies of the assistant are reviewed.

    Which review approach follows AWS guidance?
  fr: |
    Une entreprise a lancé un assistant d'IA générative sur AWS. Son équipe de gouvernance doit décider quand les contrôles de sécurité et les politiques de l'assistant sont examinés.

    Quelle approche d'examen suit les recommandations d'AWS ?
body:
  options:
    - id: a
      text: { en: "Review the controls once before launch, and keep them unchanged afterward.", fr: "Examiner les contrôles une seule fois avant le lancement, puis les conserver tels quels." }
    - id: b
      text: { en: "Review the controls regularly, and reassess them when threats or data sensitivity change.", fr: "Examiner les contrôles régulièrement, et les réévaluer quand les menaces ou la sensibilité des données changent." }
    - id: c
      text: { en: "Review the controls after each security incident that affects the assistant.", fr: "Examiner les contrôles après chaque incident de sécurité touchant l'assistant." }
    - id: d
      text: { en: "Review the controls each time the model provider releases a new model version.", fr: "Examiner les contrôles à chaque nouvelle version publiée par le fournisseur du modèle." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS guidance recommends regular security assessments and compliance audits, and regular reviews and updates of the controls as threats evolve. The Generative AI Security Scoping Matrix also says to reassess controls as threats and data sensitivity change, so reviews are both periodic and event-driven."
    fr: "Les recommandations d'AWS préconisent des évaluations de sécurité et des audits de conformité réguliers, ainsi qu'un examen et une mise à jour réguliers des contrôles à mesure que les menaces évoluent. La matrice de cadrage de la sécurité de l'IA générative indique aussi de réévaluer les contrôles quand les menaces et la sensibilité des données changent : les examens sont donc à la fois périodiques et déclenchés par des événements."
  options:
    a:
      en: "Threats and data change after launch, so a single review leaves the controls out of date."
      fr: "Les menaces et les données évoluent après le lancement : un examen unique laisse les contrôles obsolètes."
    c:
      en: "Waiting for an incident makes the review reactive; regular reviews aim to find gaps before they are exploited."
      fr: "Attendre un incident rend l'examen réactif ; des examens réguliers visent à trouver les lacunes avant qu'elles ne soient exploitées."
    d:
      en: "A new model version is one possible trigger, but threats and data sensitivity also change between releases."
      fr: "Une nouvelle version du modèle est un déclencheur possible, mais les menaces et la sensibilité des données évoluent aussi entre deux versions."
references:
  - title: "Layer 3: Security and governance for generative AI platforms on AWS"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-enterprise-ready-gen-ai-platform/security.html
  - title: "Securing Generative AI: The Generative AI Security Scoping Matrix"
    url: https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/
