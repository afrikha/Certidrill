id: aifc01-5b-gp-multi-policy-content
objective: "5.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is writing its first governance policy for generative AI on AWS.

    Which elements should the policy include, according to AWS guidance? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise rédige sa première politique de gouvernance de l'IA générative sur AWS.

    Quels éléments la politique doit-elle inclure, selon les recommandations d'AWS ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Rules on which foundation models may be used and how data may be used with them", fr: "Des règles sur les modèles de fondation autorisés et sur l'utilisation des données avec eux" }
    - id: b
      text: { en: "A rule that every team may subscribe to any model without review to speed up projects", fr: "Une règle selon laquelle chaque équipe peut s'abonner à n'importe quel modèle sans examen, pour accélérer les projets" }
    - id: c
      text: { en: "Separate author, approver, and publisher roles for creating and releasing models", fr: "Des rôles distincts d'auteur, d'approbateur et d'éditeur pour la création et la publication des modèles" }
    - id: d
      text: { en: "A rule that the model provider classifies the company's data before each request", fr: "Une règle selon laquelle le fournisseur du modèle classe les données de l'entreprise avant chaque requête" }
    - id: e
      text: { en: "A rule that internal applications need no documentation of their security controls", fr: "Une règle selon laquelle les applications internes n'ont besoin d'aucune documentation de leurs contrôles de sécurité" }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "AWS Prescriptive Guidance recommends clear policies and procedures for model access and usage that cover model selection, data usage, and output validation. The AWS Cloud Adoption Framework for AI also recommends roles for model creation and release that follow an author, approver, and publisher approach."
    fr: "AWS Prescriptive Guidance recommande des politiques et procédures claires pour l'accès aux modèles et leur utilisation, couvrant le choix des modèles, l'utilisation des données et la validation des résultats. Le Cloud Adoption Framework d'AWS pour l'IA recommande aussi des rôles pour la création et la publication des modèles selon une approche auteur, approbateur et éditeur."
  options:
    b:
      en: "Access to models should be governed, for example with IAM roles and coordination with legal and procurement teams before broader subscriptions."
      fr: "L'accès aux modèles doit être encadré, par exemple avec des rôles IAM et une coordination avec les équipes juridique et achats avant des abonnements plus larges."
    d:
      en: "Data classification stays the company's responsibility; foundation models have no built-in access control over data."
      fr: "La classification des données reste de la responsabilité de l'entreprise ; les modèles de fondation n'ont pas de contrôle d'accès intégré aux données."
    e:
      en: "AWS guidance recommends detailed documentation of security measures and controls to meet compliance needs."
      fr: "Les recommandations d'AWS préconisent une documentation détaillée des mesures et contrôles de sécurité pour répondre aux besoins de conformité."
references:
  - title: "Layer 3: Security and governance for generative AI platforms on AWS"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-enterprise-ready-gen-ai-platform/security.html
  - title: "Security perspective: Compliance and assurance of AI systems"
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-caf-for-ai/security-perspective-compliance-and-assurance-of-aiml-systems.html
