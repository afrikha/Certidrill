id: aifc01-5b-gov-trusted-advisor-basic
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup has the AWS Basic Support plan. Before it launches a generative AI application, it wants to check its account at no additional cost for common issues, such as Amazon S3 bucket permissions and whether multi-factor authentication (MFA) is enabled on the root user.

    Which AWS service will meet these requirements?
  fr: |
    Une start-up dispose du plan AWS Basic Support. Avant de lancer une application d'IA générative, elle veut vérifier son compte, sans coût supplémentaire, pour détecter des problèmes courants comme les autorisations des compartiments Amazon S3 et l'activation ou non de l'authentification multifacteur (MFA) sur l'utilisateur racine.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Inspector" }
    - { id: b, text: "AWS Trusted Advisor" }
    - { id: c, text: "AWS Artifact" }
    - { id: d, text: "AWS CloudTrail" }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Trusted Advisor inspects the account and recommends actions to save money, improve availability and performance, or close security gaps. With Basic Support, the Trusted Advisor console gives access to all service limits checks and selected security checks, such as Amazon S3 bucket permissions and MFA on the root account."
    fr: "AWS Trusted Advisor inspecte le compte et recommande des actions pour réduire les coûts, améliorer la disponibilité et les performances, ou combler des failles de sécurité. Avec Basic Support, la console Trusted Advisor donne accès à toutes les vérifications des quotas de service et à une sélection de vérifications de sécurité, comme les autorisations des compartiments Amazon S3 et la MFA sur le compte racine."
  options:
    a:
      en: "Inspector finds software vulnerabilities and network exposure in compute resources; it does not check root MFA or bucket permissions."
      fr: "Inspector détecte les vulnérabilités logicielles et l'exposition réseau des ressources de calcul ; il ne vérifie ni la MFA de l'utilisateur racine ni les autorisations des compartiments."
    c:
      en: "Artifact provides AWS compliance reports and agreements; it does not check the startup's account."
      fr: "Artifact fournit les rapports de conformité et les accords d'AWS ; il ne vérifie pas le compte de la start-up."
    d:
      en: "CloudTrail records API activity; it does not recommend fixes for configuration issues."
      fr: "CloudTrail enregistre l'activité des API ; il ne recommande pas de corrections pour les problèmes de configuration."
references:
  - title: AWS Trusted Advisor
    url: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html
  - title: AWS Trusted Advisor check reference
    url: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor-check-reference.html
