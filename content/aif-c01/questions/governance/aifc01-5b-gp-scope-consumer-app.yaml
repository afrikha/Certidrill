id: aifc01-5b-gp-scope-consumer-app
objective: "5.2.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Employees of an engineering firm use a free, public generative AI chat website to rephrase press releases that are already public. The firm does not own or see the model or its training data, and it uses the website under the provider's terms of service.

    According to the Generative AI Security Scoping Matrix, which scope does this use case belong to?
  fr: |
    Les employés d'un bureau d'ingénierie utilisent un site web public et gratuit de conversation par IA générative pour reformuler des communiqués de presse déjà publics. Le bureau ne possède pas le modèle ni ses données d'entraînement et ne les voit pas, et il utilise le site selon les conditions d'utilisation du fournisseur.

    Selon la matrice de cadrage de la sécurité de l'IA générative (Generative AI Security Scoping Matrix), à quel niveau (scope) appartient ce cas d'usage ?
body:
  options:
    - { id: a, text: { en: "Scope 1: Consumer app", fr: "Scope 1 : application grand public (Consumer app)" } }
    - { id: b, text: { en: "Scope 2: Enterprise app", fr: "Scope 2 : application d'entreprise (Enterprise app)" } }
    - { id: c, text: { en: "Scope 3: Pre-trained models", fr: "Scope 3 : modèles pré-entraînés (Pre-trained models)" } }
    - { id: d, text: { en: "Scope 4: Fine-tuned models", fr: "Scope 4 : modèles peaufinés (Fine-tuned models)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Scope 1 covers the use of a public third-party generative AI service, free or paid, often consumer-grade. The organization does not own or see the model or its training data, cannot modify it, and uses it under the provider's terms. Such tools should receive only public, non-proprietary data, as in this case."
    fr: "Le scope 1 couvre l'utilisation d'un service public d'IA générative tiers, gratuit ou payant, souvent grand public. L'organisation ne possède pas le modèle ni ses données d'entraînement et ne les voit pas, ne peut pas le modifier et l'utilise selon les conditions du fournisseur. Ces outils ne doivent recevoir que des données publiques et non propriétaires, comme dans ce cas."
  options:
    b:
      en: "Scope 2 is a third-party enterprise application with embedded generative AI features, backed by a business relationship and enterprise terms."
      fr: "Le scope 2 est une application d'entreprise tierce dotée de fonctions d'IA générative intégrées, encadrée par une relation commerciale et des conditions d'entreprise."
    c:
      en: "In Scope 3, the organization builds its own application on a third-party foundation model through an API."
      fr: "Dans le scope 3, l'organisation crée sa propre application sur un modèle de fondation tiers, via une API."
    d:
      en: "In Scope 4, the organization refines an existing foundation model with its own business data."
      fr: "Dans le scope 4, l'organisation affine un modèle de fondation existant avec ses propres données métier."
references:
  - title: "Securing Generative AI: The Generative AI Security Scoping Matrix"
    url: https://aws.amazon.com/ai/security/generative-ai-scoping-matrix/
