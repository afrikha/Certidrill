id: aifc01-5a-glue-catalog-crawlers
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company stores hundreds of datasets in Amazon S3. Its data scientists cannot find which datasets exist, where they are stored, and what their schemas are. The company wants to discover the datasets automatically and keep a central inventory of their metadata.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias stocke des centaines de jeux de données dans Amazon S3. Ses scientifiques des données ne parviennent pas à savoir quels jeux de données existent, où ils sont stockés et quels sont leurs schémas. L'entreprise souhaite découvrir automatiquement les jeux de données et conserver un inventaire central de leurs métadonnées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon SageMaker model card for each dataset.", fr: "Créer une carte de modèle Amazon SageMaker pour chaque jeu de données." } }
    - { id: b, text: { en: "Turn on Amazon Macie automated sensitive data discovery for the buckets.", fr: "Activer la découverte automatisée des données sensibles d'Amazon Macie pour les compartiments." } }
    - { id: c, text: { en: "Enable AWS CloudTrail data events for the buckets that hold the datasets.", fr: "Activer les événements de données AWS CloudTrail pour les compartiments qui contiennent les jeux de données." } }
    - { id: d, text: { en: "Run AWS Glue crawlers that populate the AWS Glue Data Catalog.", fr: "Exécuter des crawlers AWS Glue qui alimentent le catalogue de données AWS Glue (Data Catalog)." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The AWS Glue Data Catalog is a central repository of metadata that works as an index to the location, schema and runtime metrics of data sources. Crawlers scan the data sources, extract their metadata and create or update the tables in the catalog, which Athena, Amazon EMR and SageMaker AI can then use."
    fr: "Le catalogue de données AWS Glue est un référentiel central de métadonnées qui sert d'index de l'emplacement, du schéma et des métriques d'exécution des sources de données. Les crawlers analysent les sources de données, extraient leurs métadonnées et créent ou mettent à jour les tables du catalogue, que peuvent ensuite utiliser Athena, Amazon EMR et SageMaker AI."
  options:
    a:
      en: "Model cards document models, not datasets, and they are written by hand rather than discovered automatically."
      fr: "Les cartes de modèle documentent des modèles, pas des jeux de données, et elles sont rédigées manuellement plutôt que découvertes automatiquement."
    b:
      en: "Macie reports sensitive data and bucket security issues; it does not build a catalog of dataset schemas."
      fr: "Macie signale les données sensibles et les problèmes de sécurité des compartiments ; il ne crée pas de catalogue des schémas des jeux de données."
    c:
      en: "CloudTrail data events record object-level API activity, not the location and schema of datasets."
      fr: "Les événements de données CloudTrail enregistrent l'activité des API au niveau des objets, pas l'emplacement et le schéma des jeux de données."
references:
  - title: Data discovery and cataloging in AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
