id: aifc01-5b-dg-cwl-retention
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company sends Amazon Bedrock model invocation logs to an Amazon CloudWatch Logs log group. Its data retention policy requires these logs to be deleted after 1 year. Nobody has changed the settings of the log group since it was created.

    What should the company do?
  fr: |
    Une entreprise envoie les journaux des appels de modèle Amazon Bedrock vers un groupe de journaux Amazon CloudWatch Logs. Sa politique de conservation des données exige que ces journaux soient supprimés après 1 an. Personne n'a modifié les paramètres du groupe de journaux depuis sa création.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Nothing, because CloudWatch Logs deletes log events after 1 year by default.", fr: "Rien, car CloudWatch Logs supprime par défaut les événements de journal après 1 an." }
    - id: b
      text: { en: "Create an S3 Lifecycle rule that expires the log group after 1 year.", fr: "Créer une règle S3 Lifecycle qui fait expirer le groupe de journaux après 1 an." }
    - id: c
      text: { en: "Create an AWS Config rule that deletes the log events older than 1 year.", fr: "Créer une règle AWS Config qui supprime les événements de journal de plus d'un an." }
    - id: d
      text: { en: "Set the retention setting of the log group to 1 year (365 days).", fr: "Définir le paramètre de conservation du groupe de journaux sur 1 an (365 jours)." }
answer: { optionId: d }
explanation:
  correct:
    en: "By default, CloudWatch Logs keeps log data indefinitely (Never Expire). Setting a retention period on the log group makes CloudWatch Logs delete events older than the setting, typically within 72 hours after they reach it."
    fr: "Par défaut, CloudWatch Logs conserve les données de journal indéfiniment (Never Expire). Définir une période de conservation sur le groupe de journaux amène CloudWatch Logs à supprimer les événements plus anciens que ce paramètre, généralement dans les 72 heures après l'avoir atteint."
  options:
    a:
      en: "The default retention of a log group is Never Expire, so the logs would be kept forever."
      fr: "La conservation par défaut d'un groupe de journaux est Never Expire : les journaux seraient donc gardés indéfiniment."
    b:
      en: "S3 Lifecycle rules apply to objects in S3 buckets, not to CloudWatch Logs log groups."
      fr: "Les règles S3 Lifecycle s'appliquent aux objets des compartiments S3, pas aux groupes de journaux CloudWatch Logs."
    c:
      en: "Config evaluates resource configurations; it does not delete log data."
      fr: "Config évalue les configurations des ressources ; il ne supprime pas de données de journal."
references:
  - title: Working with log groups and log streams
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html
