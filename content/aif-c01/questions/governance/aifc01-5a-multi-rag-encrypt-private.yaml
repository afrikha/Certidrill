id: aifc01-5a-multi-rag-encrypt-private
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building a generative AI application on Amazon Bedrock. The application runs in private subnets of a VPC and retrieves documents from an Amazon S3 bucket. The documents must be encrypted at rest with keys that the company controls, and the application's requests to Amazon Bedrock must not traverse the public internet.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise crée une application d'IA générative sur Amazon Bedrock. L'application s'exécute dans des sous-réseaux privés d'un VPC et récupère des documents dans un compartiment Amazon S3. Les documents doivent être chiffrés au repos avec des clés que l'entreprise contrôle, et les requêtes de l'application vers Amazon Bedrock ne doivent pas transiter par l'Internet public.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Encrypt the bucket with SSE-KMS by using a customer managed key.", fr: "Chiffrer le compartiment avec SSE-KMS à l'aide d'une clé gérée par le client." } }
    - { id: b, text: { en: "Run an Amazon Macie sensitive data discovery job on the bucket.", fr: "Exécuter une tâche de découverte des données sensibles Amazon Macie sur le compartiment." } }
    - { id: c, text: { en: "Create an interface VPC endpoint (AWS PrivateLink) for Amazon Bedrock.", fr: "Créer un point de terminaison de VPC d'interface (AWS PrivateLink) pour Amazon Bedrock." } }
    - { id: d, text: { en: "Attach an Amazon Bedrock guardrail to every model invocation.", fr: "Associer une barrière de protection Amazon Bedrock à chaque invocation de modèle." } }
    - { id: e, text: { en: "Create an AWS CloudTrail trail that logs the Amazon Bedrock API calls.", fr: "Créer un journal de suivi AWS CloudTrail qui enregistre les appels d'API Amazon Bedrock." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "SSE-KMS with a customer managed key encrypts the documents at rest with a key whose policy and use the company controls; Amazon Bedrock knowledge base data sources in S3 can use SSE-KMS. An interface VPC endpoint powered by AWS PrivateLink gives the private subnets a private path to Amazon Bedrock without an internet gateway or NAT device."
    fr: "SSE-KMS avec une clé gérée par le client chiffre les documents au repos avec une clé dont l'entreprise contrôle la politique et l'utilisation ; les sources de données S3 des bases de connaissances Amazon Bedrock peuvent utiliser SSE-KMS. Un point de terminaison de VPC d'interface basé sur AWS PrivateLink offre aux sous-réseaux privés un chemin privé vers Amazon Bedrock, sans passerelle Internet ni périphérique NAT."
  options:
    b:
      en: "Macie discovers sensitive data in S3 objects; it does not encrypt them or change the network path."
      fr: "Macie découvre des données sensibles dans les objets S3 ; il ne les chiffre pas et ne modifie pas le chemin réseau."
    d:
      en: "A guardrail filters the content of prompts and responses; it provides neither encryption at rest nor private connectivity."
      fr: "Une barrière de protection filtre le contenu des invites et des réponses ; elle n'apporte ni chiffrement au repos ni connectivité privée."
    e:
      en: "A trail records who called the APIs, which helps auditing, but it does not encrypt the documents or keep traffic off the internet."
      fr: "Un journal de suivi enregistre qui a appelé les API, ce qui aide à l'audit, mais il ne chiffre pas les documents et ne tient pas le trafic à l'écart d'Internet."
references:
  - title: Data encryption
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-encryption.html
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
