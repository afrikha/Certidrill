id: aifc01-5a-training-role-prefix
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon SageMaker AI training job must read training data from one prefix of an Amazon S3 bucket. The bucket also contains other data. The security team requires least privilege.

    How should the company grant the training job access to the data?
  fr: |
    Une tâche d'entraînement Amazon SageMaker AI doit lire des données d'entraînement dans un préfixe d'un compartiment Amazon S3. Le compartiment contient aussi d'autres données. L'équipe de sécurité exige le moindre privilège.

    Comment l'entreprise doit-elle accorder à la tâche d'entraînement l'accès aux données ?
body:
  options:
    - { id: a, text: { en: "Embed the access keys of an IAM user in the training script.", fr: "Intégrer les clés d'accès d'un utilisateur IAM dans le script d'entraînement." } }
    - { id: b, text: { en: "Attach the AmazonS3FullAccess policy to the job's execution role.", fr: "Attacher la politique AmazonS3FullAccess au rôle d'exécution de la tâche." } }
    - { id: c, text: { en: "Use an execution role whose policy allows reading only that prefix.", fr: "Utiliser un rôle d'exécution dont la politique autorise uniquement la lecture de ce préfixe." } }
    - { id: d, text: { en: "Make the prefix publicly readable so that no credentials are needed.", fr: "Rendre le préfixe lisible publiquement pour qu'aucun identifiant ne soit nécessaire." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An IAM role provides temporary credentials and has no long-term password or access keys. Giving the training job an execution role whose permissions policy allows reading only the required prefix applies least privilege to the training data."
    fr: "Un rôle IAM fournit des identifiants temporaires et n'a ni mot de passe ni clés d'accès à long terme. Donner à la tâche d'entraînement un rôle d'exécution dont la politique d'autorisations permet uniquement la lecture du préfixe nécessaire applique le moindre privilège aux données d'entraînement."
  options:
    a:
      en: "Long-term access keys in code can leak and are hard to rotate; workloads should use roles with temporary credentials."
      fr: "Des clés d'accès à long terme dans le code peuvent fuiter et sont difficiles à renouveler ; les charges de travail doivent utiliser des rôles avec des identifiants temporaires."
    b:
      en: "Full S3 access lets the job read and change every bucket in the account, far more than it needs."
      fr: "Un accès complet à S3 permet à la tâche de lire et de modifier tous les compartiments du compte, bien plus que nécessaire."
    d:
      en: "Public access exposes the training data to anyone on the internet."
      fr: "Un accès public expose les données d'entraînement à n'importe qui sur Internet."
references:
  - title: IAM roles
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html
