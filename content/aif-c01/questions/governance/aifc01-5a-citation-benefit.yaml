id: aifc01-5a-citation-benefit
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A health information portal uses a foundation model with Retrieval Augmented Generation (RAG) to answer patient questions from a set of medical articles. The portal displays source citations with each answer.

    What is the main benefit of displaying the citations?
  fr: |
    Un portail d'information santé utilise un modèle de fondation avec la génération à enrichissement contextuel (RAG) pour répondre aux questions des patients à partir d'un ensemble d'articles médicaux. Le portail affiche les citations des sources avec chaque réponse.

    Quel est le principal avantage de l'affichage des citations ?
body:
  options:
    - { id: a, text: { en: "The citations reduce the number of input tokens in each request.", fr: "Les citations réduisent le nombre de jetons d'entrée de chaque requête." } }
    - { id: b, text: { en: "The citations guarantee that the model never produces a hallucination.", fr: "Les citations garantissent que le modèle ne produit jamais d'hallucination." } }
    - { id: c, text: { en: "Users can check each answer against the original source document.", fr: "Les utilisateurs peuvent vérifier chaque réponse par rapport au document source d'origine." } }
    - { id: d, text: { en: "The portal no longer needs to evaluate the application before launch.", fr: "Le portail n'a plus besoin d'évaluer l'application avant son lancement." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Source citation attributes each generated answer to the documents that it was based on. Users and reviewers can open the original source and check the accuracy of the answer, which supports transparency and trust in the application."
    fr: "La citation des sources attribue chaque réponse générée aux documents sur lesquels elle s'appuie. Les utilisateurs et les réviseurs peuvent ouvrir la source d'origine et vérifier l'exactitude de la réponse, ce qui favorise la transparence et la confiance dans l'application."
  options:
    a:
      en: "Citations are added to the response; they do not reduce the tokens sent to the model."
      fr: "Les citations s'ajoutent à la réponse ; elles ne réduisent pas les jetons envoyés au modèle."
    b:
      en: "Citations make an answer verifiable, but the model can still produce statements that the sources do not support."
      fr: "Les citations rendent une réponse vérifiable, mais le modèle peut toujours produire des affirmations que les sources n'étayent pas."
    d:
      en: "Citations complement evaluation; they do not replace testing the application before it is released."
      fr: "Les citations complètent l'évaluation ; elles ne remplacent pas les tests de l'application avant sa mise en service."
references:
  - title: Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
