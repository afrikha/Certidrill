id: aifc01-5b-hal-textract-confidence
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company uses Amazon Textract to extract claim amounts from scanned forms. The extracted amounts trigger payments automatically. The company wants to reduce the risk of paying a wrong amount because of an extraction error.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance utilise Amazon Textract pour extraire les montants des sinistres de formulaires numérisés. Les montants extraits déclenchent automatiquement des paiements. L'entreprise veut réduire le risque de payer un montant erroné à cause d'une erreur d'extraction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Accept every extracted value, because Amazon Textract returns only values that it has verified.", fr: "Accepter toutes les valeurs extraites, car Amazon Textract ne renvoie que des valeurs qu'il a vérifiées." }
    - id: b
      text: { en: "Compare each value's confidence score with a high threshold, and send lower-scoring values to an employee for review.", fr: "Comparer le score de confiance de chaque valeur à un seuil élevé, et envoyer les valeurs moins bien notées à un employé pour vérification." }
    - id: c
      text: { en: "Set a low confidence threshold, such as 50 %, so that most values are paid without any review.", fr: "Définir un seuil de confiance bas, par exemple 50 %, pour que la plupart des valeurs soient payées sans aucune vérification." }
    - id: d
      text: { en: "Ask a foundation model to rewrite each extracted value before the payment is made.", fr: "Demander à un modèle de fondation de réécrire chaque valeur extraite avant le paiement." }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Textract returns a confidence score from 0 to 100 that indicates the probability that a prediction is correct. For applications that are sensitive to errors, AWS recommends a minimum threshold: results below it are discarded or flagged for human review. Business processes with financial decisions might require 90 % or higher."
    fr: "Amazon Textract renvoie un score de confiance de 0 à 100 qui indique la probabilité qu'une prédiction soit correcte. Pour les applications sensibles aux erreurs, AWS recommande un seuil minimal : les résultats inférieurs sont écartés ou signalés pour une vérification humaine. Les processus métier comportant des décisions financières peuvent exiger 90 % ou plus."
  options:
    a:
      en: "Textract results are predictions with a confidence score, not verified values."
      fr: "Les résultats de Textract sont des prédictions accompagnées d'un score de confiance, pas des valeurs vérifiées."
    c:
      en: "A threshold as low as 50 % suits low-stakes uses such as archiving notes, not payments."
      fr: "Un seuil aussi bas que 50 % convient à des usages à faible enjeu, comme l'archivage de notes, pas à des paiements."
    d:
      en: "Rewriting by a foundation model adds another source of errors and does not check the extracted value."
      fr: "Une réécriture par un modèle de fondation ajoute une autre source d'erreurs et ne vérifie pas la valeur extraite."
references:
  - title: Best Practices
    url: https://docs.aws.amazon.com/textract/latest/dg/textract-best-practices.html
