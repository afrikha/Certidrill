id: aifc01-5a-multi-prompt-injection-defense
objective: "5.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is launching a public chat application that sends user messages to a foundation model in Amazon Bedrock with the InvokeModel API. The security team is concerned that users will try to override the application's instructions with crafted messages.

    Which actions will reduce this risk? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise lance une application de discussion publique qui envoie les messages des utilisateurs à un modèle de fondation dans Amazon Bedrock avec l'API InvokeModel. L'équipe de sécurité craint que des utilisateurs tentent de contourner les instructions de l'application avec des messages malveillants.

    Quelles actions réduisent ce risque ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable the prompt attack filter in a guardrail and tag the user input for evaluation.", fr: "Activer le filtre d'attaques par invite dans une barrière de protection et baliser l'entrée utilisateur pour son évaluation." } }
    - { id: b, text: { en: "Increase the maximum number of output tokens that the model can generate.", fr: "Augmenter le nombre maximal de jetons de sortie que le modèle peut générer." } }
    - { id: c, text: { en: "Validate and sanitize the user input before the application passes it to the model.", fr: "Valider et assainir l'entrée utilisateur avant que l'application ne la transmette au modèle." } }
    - { id: d, text: { en: "Encrypt the prompts with a customer managed AWS KMS key before sending them.", fr: "Chiffrer les invites avec une clé AWS KMS gérée par le client avant de les envoyer." } }
    - { id: e, text: { en: "Purchase Provisioned Throughput for the foundation model.", fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle de fondation." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The prompt attack filter of Amazon Bedrock Guardrails detects prompt injection and jailbreak attempts; with InvokeModel, the user input must be wrapped in the guardrail's input tags, otherwise prompt attacks are not filtered. AWS also recommends validating and sanitizing user input at the application layer before it reaches the model."
    fr: "Le filtre d'attaques par invite d'Amazon Bedrock Guardrails détecte les tentatives d'injection d'invite et de débridage ; avec InvokeModel, l'entrée utilisateur doit être encadrée par les balises d'entrée de la barrière de protection, sinon les attaques par invite ne sont pas filtrées. AWS recommande aussi de valider et d'assainir l'entrée utilisateur au niveau de l'application avant qu'elle n'atteigne le modèle."
  options:
    b:
      en: "The maximum output length controls how long a response can be; it does not detect or stop instructions hidden in user input."
      fr: "La longueur maximale de sortie contrôle la taille d'une réponse ; elle ne détecte ni n'arrête les instructions cachées dans l'entrée utilisateur."
    d:
      en: "Encryption protects the confidentiality of the prompt; the model still receives and follows the same malicious text."
      fr: "Le chiffrement protège la confidentialité de l'invite ; le modèle reçoit et suit toujours le même texte malveillant."
    e:
      en: "Provisioned Throughput reserves inference capacity; it has no effect on prompt attacks."
      fr: "Le débit provisionné réserve de la capacité d'inférence ; il n'a aucun effet sur les attaques par invite."
references:
  - title: Detect prompt attacks with Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
  - title: GENSEC04-BP02 Sanitize and validate user inputs to foundation models
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gensec04-bp02.html
