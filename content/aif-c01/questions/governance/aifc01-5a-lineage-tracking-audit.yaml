id: aifc01-5a-lineage-tracking-audit
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company trains and deploys models with Amazon SageMaker AI. An auditor asks which datasets and which training job produced the model behind a production endpoint. The company wants records that SageMaker AI creates automatically for each workflow step and that the company can query at any time.

    Which feature should the company use?
  fr: |
    Une entreprise entraîne et déploie des modèles avec Amazon SageMaker AI. Un auditeur demande quels jeux de données et quelle tâche d'entraînement ont produit le modèle d'un point de terminaison de production. L'entreprise veut des enregistrements que SageMaker AI crée automatiquement pour chaque étape du flux de travail et qu'elle peut interroger à tout moment.

    Quelle fonctionnalité l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon SageMaker Model Cards" }
    - { id: b, text: "AWS Glue Data Catalog" }
    - { id: c, text: "Amazon SageMaker ML Lineage Tracking" }
    - { id: d, text: { en: "Amazon CloudWatch metrics for the endpoint", fr: "Les métriques Amazon CloudWatch du point de terminaison" } }
answer: { optionId: c }
explanation:
  correct:
    en: "SageMaker ML Lineage Tracking works in the background and creates tracking entities for training jobs, datasets, pipelines, endpoints and models. The company can query the lineage to find the exact artifacts used to train a model, which supports reproducibility, model governance and audits."
    fr: "SageMaker ML Lineage Tracking fonctionne en arrière-plan et crée des entités de suivi pour les tâches d'entraînement, les jeux de données, les pipelines, les points de terminaison et les modèles. L'entreprise peut interroger la traçabilité pour trouver les artefacts exacts utilisés pour entraîner un modèle, ce qui facilite la reproductibilité, la gouvernance des modèles et les audits."
  options:
    a:
      en: "Model cards are documentation that the team writes and maintains; they are not records created automatically for each workflow step."
      fr: "Les cartes de modèle sont une documentation que l'équipe rédige et maintient ; ce ne sont pas des enregistrements créés automatiquement à chaque étape du flux de travail."
    b:
      en: "The Data Catalog describes datasets but does not link them to the training jobs and models that used them."
      fr: "Le catalogue de données décrit les jeux de données, mais ne les relie pas aux tâches d'entraînement et aux modèles qui les ont utilisés."
    d:
      en: "Endpoint metrics show operational behavior such as invocations and latency, not where the model came from."
      fr: "Les métriques du point de terminaison montrent le comportement opérationnel, comme les invocations et la latence, pas l'origine du modèle."
references:
  - title: Amazon SageMaker ML Lineage Tracking
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html
