id: aifc01-5a-guardrail-denied-topic
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank deploys a generative AI assistant on Amazon Bedrock to answer questions about its accounts and cards. For regulatory reasons, the assistant must refuse any request for investment advice, both in user prompts and in model responses.

    Which solution will meet this requirement?
  fr: |
    Une banque déploie un assistant d'IA générative sur Amazon Bedrock pour répondre aux questions sur ses comptes et ses cartes. Pour des raisons réglementaires, l'assistant doit refuser toute demande de conseil en investissement, aussi bien dans les invites des utilisateurs que dans les réponses du modèle.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "An Amazon Bedrock knowledge base that contains only the bank's product documents", fr: "Une base de connaissances Amazon Bedrock qui ne contient que les documents produits de la banque" } }
    - { id: b, text: { en: "An IAM policy that denies bedrock:InvokeModel to the assistant's role", fr: "Une politique IAM qui refuse bedrock:InvokeModel au rôle de l'assistant" } }
    - { id: c, text: { en: "An Amazon Macie custom data identifier for this subject", fr: "Un identifiant de données personnalisé Amazon Macie pour ce sujet" } }
    - { id: d, text: { en: "An Amazon Bedrock guardrail that has a denied topic configured", fr: "Une barrière de protection Amazon Bedrock avec un sujet refusé configuré" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Denied topics in Amazon Bedrock Guardrails block user-defined subjects that are undesirable for an application. The guardrail evaluates both the user prompts and the model responses, and returns the configured blocked message when the topic is detected."
    fr: "Les sujets refusés d'Amazon Bedrock Guardrails bloquent des thèmes définis par l'utilisateur et indésirables pour une application. La barrière de protection évalue à la fois les invites des utilisateurs et les réponses du modèle, et renvoie le message de blocage configuré lorsque le sujet est détecté."
  options:
    a:
      en: "A knowledge base grounds answers in documents but does not stop the model from answering an investment question."
      fr: "Une base de connaissances ancre les réponses dans des documents, mais n'empêche pas le modèle de répondre à une question d'investissement."
    b:
      en: "Denying InvokeModel stops the assistant from working at all instead of refusing one topic."
      fr: "Refuser InvokeModel empêche totalement l'assistant de fonctionner au lieu de refuser un seul sujet."
    c:
      en: "Macie custom data identifiers find text patterns in Amazon S3 objects; they do not filter a conversation."
      fr: "Les identifiants de données personnalisés de Macie trouvent des motifs de texte dans les objets Amazon S3 ; ils ne filtrent pas une conversation."
references:
  - title: Detect and filter harmful content by using Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
