id: aifc01-5a-differential-privacy
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research company wants to train a model on patient records. The company must protect each patient's privacy while keeping the overall patterns of the data useful for training.

    Which privacy-enhancing technique adds statistical noise to the data to meet these requirements?
  fr: |
    Une société de recherche veut entraîner un modèle sur des dossiers de patients. Elle doit protéger la confidentialité de chaque patient tout en conservant l'utilité des tendances globales des données pour l'entraînement.

    Quelle technique d'amélioration de la confidentialité ajoute un bruit statistique aux données pour répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Data augmentation", fr: "Augmentation des données" } }
    - { id: b, text: { en: "Differential privacy", fr: "Confidentialité différentielle" } }
    - { id: c, text: { en: "Feature scaling", fr: "Mise à l'échelle des caractéristiques" } }
    - { id: d, text: { en: "Oversampling", fr: "Suréchantillonnage" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Differential privacy adds calibrated statistical noise so that the contribution of any single individual cannot be singled out, while aggregate patterns stay useful. AWS recommends considering it, along with masking, tokenization and anonymization, to protect individual privacy in ML training data."
    fr: "La confidentialité différentielle ajoute un bruit statistique calibré pour que la contribution d'un individu ne puisse pas être isolée, tout en conservant l'utilité des tendances globales. AWS recommande de l'envisager, avec le masquage, la tokenisation et l'anonymisation, pour protéger la vie privée des individus dans les données d'entraînement de ML."
  options:
    a:
      en: "Data augmentation creates extra training examples to improve a model; it is not designed to protect individuals."
      fr: "L'augmentation des données crée des exemples d'entraînement supplémentaires pour améliorer un modèle ; elle n'est pas conçue pour protéger les individus."
    c:
      en: "Feature scaling changes the range of numeric values for training; each record stays as identifiable as before."
      fr: "La mise à l'échelle des caractéristiques modifie la plage des valeurs numériques pour l'entraînement ; chaque enregistrement reste aussi identifiable qu'avant."
    d:
      en: "Oversampling repeats records of a minority class to balance a dataset; it adds no privacy protection."
      fr: "Le suréchantillonnage répète des enregistrements d'une classe minoritaire pour équilibrer un jeu de données ; il n'apporte aucune protection de la confidentialité."
references:
  - title: MLSEC02-BP01 Design data encryption and obfuscation
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlsec02-bp01.html
