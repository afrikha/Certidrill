id: aifc01-5b-hal-prompt-dont-know
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research company uses a foundation model (FM) on Amazon Bedrock to answer questions about scientific papers that are included in the prompt. When a paper does not contain the answer, the FM returns fluent answers that sound correct but are invented. The company wants to fix this problem with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de recherche utilise un modèle de fondation (FM) sur Amazon Bedrock pour répondre à des questions sur des articles scientifiques inclus dans l'invite. Lorsqu'un article ne contient pas la réponse, le FM renvoie des réponses fluides qui semblent correctes mais sont inventées. L'entreprise veut corriger ce problème avec le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Raise the temperature value so that the FM considers less likely tokens.", fr: "Augmenter la valeur de temperature pour que le FM envisage des jetons moins probables." }
    - id: b
      text: { en: "Raise the top P value so that the FM considers a larger share of tokens.", fr: "Augmenter la valeur de top P pour que le FM envisage une plus grande part des jetons." }
    - id: c
      text: { en: "Raise the maximum length value so that the FM explains its reasoning in detail.", fr: "Augmenter la longueur maximale pour que le FM explique son raisonnement en détail." }
    - id: d
      text: { en: "Instruct the FM to reply \"I don't know\" when the paper lacks the answer.", fr: "Demander au FM de répondre « Je ne sais pas » quand l'article ne contient pas la réponse." }
answer: { optionId: d }
explanation:
  correct:
    en: "Prompt engineering is the lowest-effort fix. A default output such as \"I don't know\" prevents the model from returning answers that sound correct when it has low confidence, and the paper already in the prompt gives the model the only text it should answer from."
    fr: "L'ingénierie de requête est la correction la moins coûteuse. Une sortie par défaut comme « Je ne sais pas » évite que le modèle renvoie des réponses qui semblent correctes alors que sa confiance est faible, et l'article déjà présent dans l'invite fournit le seul texte à partir duquel il doit répondre."
  options:
    a:
      en: "A higher temperature makes responses more random and can increase invented content."
      fr: "Une température plus élevée rend les réponses plus aléatoires et peut augmenter le contenu inventé."
    b:
      en: "A higher top P lets less likely tokens be chosen; it does not stop invented answers."
      fr: "Un top P plus élevé laisse choisir des jetons moins probables ; il n'empêche pas les réponses inventées."
    c:
      en: "More output tokens do not give the model knowledge that the paper lacks."
      fr: "Davantage de jetons de sortie n'apportent pas au modèle les connaissances absentes de l'article."
references:
  - title: Design a prompt
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/design-a-prompt.html
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
