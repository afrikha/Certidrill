id: aifc01-5a-guardrail-pii-mask
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecommunications company's support assistant on Amazon Bedrock sometimes includes customers' email addresses and phone numbers in its answers. The assistant must keep answering these questions, but the email addresses and phone numbers must be replaced with placeholders in the responses.

    Which guardrail configuration will meet these requirements?
  fr: |
    L'assistant de support d'une entreprise de télécommunications sur Amazon Bedrock inclut parfois les adresses e-mail et les numéros de téléphone des clients dans ses réponses. L'assistant doit continuer à répondre à ces questions, mais les adresses e-mail et les numéros de téléphone doivent être remplacés par des espaces réservés dans les réponses.

    Quelle configuration de barrière de protection répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A sensitive information filter with the Block action for the EMAIL and PHONE types", fr: "Un filtre d'informations sensibles avec l'action Block pour les types EMAIL et PHONE" } }
    - { id: b, text: { en: "A content filter with HIGH strength for the Insults category", fr: "Un filtre de contenu de force HIGH pour la catégorie Insults" } }
    - { id: c, text: { en: "A sensitive information filter with the Mask action for the EMAIL and PHONE types", fr: "Un filtre d'informations sensibles avec l'action Mask pour les types EMAIL et PHONE" } }
    - { id: d, text: { en: "A word filter with the managed profanity list enabled", fr: "Un filtre de mots avec la liste gérée de grossièretés activée" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Sensitive information filters detect PII types such as EMAIL and PHONE in prompts and responses. With the Mask (ANONYMIZE) action, the guardrail redacts the detected values and replaces them with the PII type, such as {EMAIL}, while the rest of the response is still returned."
    fr: "Les filtres d'informations sensibles détectent des types de PII comme EMAIL et PHONE dans les invites et les réponses. Avec l'action Mask (ANONYMIZE), la barrière de protection masque les valeurs détectées et les remplace par le type de PII, par exemple {EMAIL}, tandis que le reste de la réponse est toujours renvoyé."
  options:
    a:
      en: "The Block action blocks the whole response and returns the blocked message, so the assistant would stop answering these questions."
      fr: "L'action Block bloque toute la réponse et renvoie le message de blocage : l'assistant cesserait donc de répondre à ces questions."
    b:
      en: "Content filters detect harmful categories such as hate or insults; they do not detect email addresses or phone numbers."
      fr: "Les filtres de contenu détectent des catégories nuisibles comme la haine ou les insultes ; ils ne détectent pas les adresses e-mail ni les numéros de téléphone."
    d:
      en: "Word filters block listed words and profanity; they do not recognize personal data or replace it with placeholders."
      fr: "Les filtres de mots bloquent des mots listés et les grossièretés ; ils ne reconnaissent pas les données personnelles et ne les remplacent pas par des espaces réservés."
references:
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
