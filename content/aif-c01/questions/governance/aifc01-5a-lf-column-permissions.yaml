id: aifc01-5a-lf-column-permissions
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores customer data in a data lake in Amazon S3. The tables are cataloged in the AWS Glue Data Catalog. Data scientists query the customer table with Amazon Athena to build features. They must not see the national_id column, while the fraud team must see every column of the same table.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des données clients dans un lac de données Amazon S3. Les tables sont cataloguées dans le catalogue de données AWS Glue. Les scientifiques des données interrogent la table des clients avec Amazon Athena pour créer des caractéristiques. Ils ne doivent pas voir la colonne national_id, alors que l'équipe antifraude doit voir toutes les colonnes de la même table.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an S3 bucket policy that denies the data scientists access to the table's objects.", fr: "Ajouter une politique de compartiment S3 qui refuse aux scientifiques des données l'accès aux objets de la table." } }
    - { id: b, text: { en: "Run an Amazon Macie job that reports the national_id column as sensitive data.", fr: "Exécuter une tâche Amazon Macie qui signale la colonne national_id comme donnée sensible." } }
    - { id: c, text: { en: "Encrypt the table's files with an AWS KMS key that only the fraud team can use.", fr: "Chiffrer les fichiers de la table avec une clé AWS KMS que seule l'équipe antifraude peut utiliser." } }
    - { id: d, text: { en: "Grant the data scientists AWS Lake Formation permissions on the table that exclude the national_id column.", fr: "Accorder aux scientifiques des données des autorisations AWS Lake Formation sur la table qui excluent la colonne national_id." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Lake Formation manages fine-grained access to data lake tables at the database, table, column, row and cell levels, and Athena enforces these permissions. Granting the data scientists access to the table without the national_id column hides that column from them, while the fraud team keeps a grant on all columns."
    fr: "AWS Lake Formation gère un accès précis aux tables du lac de données au niveau de la base de données, de la table, de la colonne, de la ligne et de la cellule, et Athena applique ces autorisations. Accorder aux scientifiques des données l'accès à la table sans la colonne national_id leur masque cette colonne, tandis que l'équipe antifraude conserve une autorisation sur toutes les colonnes."
  options:
    a:
      en: "A bucket policy works on whole objects, so the data scientists would lose access to the entire table instead of one column."
      fr: "Une politique de compartiment s'applique à des objets entiers : les scientifiques des données perdraient l'accès à toute la table au lieu d'une seule colonne."
    b:
      en: "Macie only reports where sensitive data is; it does not restrict who can query it."
      fr: "Macie signale seulement où se trouvent les données sensibles ; il ne restreint pas qui peut les interroger."
    c:
      en: "A key that only the fraud team can use makes the whole table unreadable for the data scientists, not just one column."
      fr: "Une clé utilisable seulement par l'équipe antifraude rend toute la table illisible pour les scientifiques des données, pas seulement une colonne."
references:
  - title: What is AWS Lake Formation?
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html
