id: aifc01-5b-gov-dd-match-services
objective: "5.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A company is preparing a governance review of its generative AI platform on AWS.

    Which AWS service meets each requirement? To answer, drag the appropriate services to the correct requirements. Each service may be used once or not at all.
  fr: |
    Une entreprise prépare une revue de gouvernance de sa plateforme d'IA générative sur AWS.

    Quel service AWS répond à chaque exigence ? Pour répondre, faites glisser les services appropriés vers les exigences correspondantes. Chaque service peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: art, text: "AWS Artifact" }
    - { id: cfg, text: "AWS Config" }
    - { id: ct, text: "AWS CloudTrail" }
    - { id: ins, text: "Amazon Inspector" }
    - { id: ta, text: "AWS Trusted Advisor" }
    - { id: mac, text: "Amazon Macie" }
  targets:
    - id: t1
      text: { en: "Download the AWS PCI and ISO reports for the auditors", fr: "Télécharger les rapports PCI et ISO d'AWS pour les auditeurs" }
    - id: t2
      text: { en: "Find which IAM role deleted an Amazon Bedrock guardrail", fr: "Trouver quel rôle IAM a supprimé un garde-fou (guardrail) Amazon Bedrock" }
    - id: t3
      text: { en: "Scan the Lambda functions continuously for software vulnerabilities", fr: "Analyser en continu les fonctions Lambda à la recherche de vulnérabilités logicielles" }
    - id: t4
      text: { en: "Flag the resources that do not comply with the company's configuration rules", fr: "Signaler les ressources qui ne respectent pas les règles de configuration de l'entreprise" }
    - id: t5
      text: { en: "Get recommendations on cost optimization, security, fault tolerance, and service limits", fr: "Obtenir des recommandations sur l'optimisation des coûts, la sécurité, la tolérance aux pannes et les quotas de service" }
answer:
  mapping: { t1: art, t2: ct, t3: ins, t4: cfg, t5: ta }
explanation:
  correct:
    en: "AWS Artifact provides AWS compliance reports such as PCI and ISO. CloudTrail records API calls, such as the deletion of a guardrail, with the identity of the caller. Inspector continuously scans Lambda functions, EC2 instances, and ECR images for vulnerabilities. Config evaluates resources against rules and flags noncompliant ones. Trusted Advisor recommends improvements across cost optimization, performance, security, fault tolerance, service limits, and operational excellence. Macie, which discovers sensitive data in Amazon S3, is not needed."
    fr: "AWS Artifact fournit les rapports de conformité d'AWS, comme PCI et ISO. CloudTrail enregistre les appels d'API, comme la suppression d'un garde-fou, avec l'identité de l'appelant. Inspector analyse en continu les fonctions Lambda, les instances EC2 et les images ECR à la recherche de vulnérabilités. Config évalue les ressources par rapport à des règles et signale celles qui ne sont pas conformes. Trusted Advisor recommande des améliorations en matière d'optimisation des coûts, de performances, de sécurité, de tolérance aux pannes, de quotas de service et d'excellence opérationnelle. Macie, qui découvre les données sensibles dans Amazon S3, n'est pas utile ici."
references:
  - title: What is AWS Artifact?
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
  - title: AWS Trusted Advisor check reference
    url: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor-check-reference.html
