id: aifc01-5a-multi-guardrails-capabilities
objective: "5.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is reviewing the AWS services that it can use to secure a new generative AI application.

    Which capabilities does Amazon Bedrock Guardrails provide? (Choose two.)
  fr: |
    Une entreprise étudie les services AWS qu'elle peut utiliser pour sécuriser une nouvelle application d'IA générative.

    Quelles fonctions Amazon Bedrock Guardrails offre-t-il ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Discover sensitive data that is stored in Amazon S3 buckets", fr: "Découvrir les données sensibles stockées dans des compartiments Amazon S3" } }
    - { id: b, text: { en: "Block user-defined denied topics in prompts and responses", fr: "Bloquer des sujets refusés définis par l'utilisateur dans les invites et les réponses" } }
    - { id: c, text: { en: "Encrypt a custom model with a customer managed key", fr: "Chiffrer un modèle personnalisé avec une clé gérée par le client" } }
    - { id: d, text: { en: "Obtain OAuth tokens for agents that call third-party APIs", fr: "Obtenir des jetons OAuth pour les agents qui appellent des API tierces" } }
    - { id: e, text: { en: "Mask personally identifiable information in model responses", fr: "Masquer les informations personnelles identifiables dans les réponses du modèle" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Amazon Bedrock Guardrails evaluates prompts and model responses with configurable policies: content filters, denied topics, word filters, sensitive information filters that block or mask PII, contextual grounding checks and Automated Reasoning checks. Denied topics and PII masking are therefore both guardrail capabilities."
    fr: "Amazon Bedrock Guardrails évalue les invites et les réponses du modèle avec des politiques configurables : filtres de contenu, sujets refusés, filtres de mots, filtres d'informations sensibles qui bloquent ou masquent les PII, vérifications d'ancrage contextuel et vérifications Automated Reasoning. Les sujets refusés et le masquage des PII sont donc tous deux des fonctions des barrières de protection."
  options:
    a:
      en: "Discovering sensitive data in S3 buckets is the role of Amazon Macie."
      fr: "Découvrir les données sensibles dans les compartiments S3 est le rôle d'Amazon Macie."
    c:
      en: "Custom models are encrypted with AWS KMS keys that are set on the model customization job, not by a guardrail."
      fr: "Les modèles personnalisés sont chiffrés avec des clés AWS KMS définies sur la tâche de personnalisation, pas par une barrière de protection."
    d:
      en: "Obtaining and storing OAuth tokens for agents is a capability of Amazon Bedrock AgentCore Identity."
      fr: "Obtenir et stocker des jetons OAuth pour les agents est une fonction d'Amazon Bedrock AgentCore Identity."
references:
  - title: Detect and filter harmful content by using Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
