id: aifc01-5a-privatelink-bedrock
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company runs an application on Amazon EC2 instances in private subnets of a VPC. The subnets have no internet gateway and no NAT gateway. The application must call Amazon Bedrock, and the traffic must not traverse the public internet.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers exécute une application sur des instances Amazon EC2 situées dans des sous-réseaux privés d'un VPC. Ces sous-réseaux n'ont ni passerelle Internet ni passerelle NAT. L'application doit appeler Amazon Bedrock, et le trafic ne doit pas transiter par l'Internet public.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a NAT gateway to the VPC and route the Amazon Bedrock traffic through it.", fr: "Ajouter une passerelle NAT au VPC et y faire passer le trafic vers Amazon Bedrock." } }
    - { id: b, text: { en: "Encrypt each request with an AWS KMS key before sending it to the public Amazon Bedrock endpoint.", fr: "Chiffrer chaque requête avec une clé AWS KMS avant de l'envoyer au point de terminaison public d'Amazon Bedrock." } }
    - { id: c, text: { en: "Create an interface VPC endpoint (AWS PrivateLink) for the Amazon Bedrock runtime API.", fr: "Créer un point de terminaison de VPC d'interface (AWS PrivateLink) pour l'API d'exécution d'Amazon Bedrock." } }
    - { id: d, text: { en: "Attach an Amazon Bedrock guardrail that blocks requests coming from outside the VPC.", fr: "Associer une barrière de protection (guardrail) Amazon Bedrock qui bloque les requêtes venant de l'extérieur du VPC." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS PrivateLink lets resources in a VPC reach Amazon Bedrock through an interface VPC endpoint, without an internet gateway, a NAT device or public IP addresses. The endpoint for runtime calls such as InvokeModel and Converse is bedrock-runtime. With private DNS enabled, the application keeps using the standard Bedrock host name."
    fr: "AWS PrivateLink permet aux ressources d'un VPC d'atteindre Amazon Bedrock via un point de terminaison de VPC d'interface, sans passerelle Internet, sans périphérique NAT et sans adresse IP publique. Le point de terminaison des appels d'exécution comme InvokeModel et Converse est bedrock-runtime. Avec le DNS privé activé, l'application continue d'utiliser le nom d'hôte standard de Bedrock."
  options:
    a:
      en: "A NAT gateway sends the traffic to the public Bedrock endpoint over the internet, which the requirement forbids."
      fr: "Une passerelle NAT envoie le trafic vers le point de terminaison public de Bedrock par Internet, ce que l'exigence interdit."
    b:
      en: "Encrypting the request protects its content, but the traffic still has to reach the public endpoint, and the subnets have no route to the internet."
      fr: "Chiffrer la requête protège son contenu, mais le trafic doit toujours atteindre le point de terminaison public, et les sous-réseaux n'ont aucune route vers Internet."
    d:
      en: "Guardrails evaluate the content of prompts and responses; they do not provide network connectivity or filter requests by network origin."
      fr: "Les barrières de protection évaluent le contenu des invites et des réponses ; elles ne fournissent pas de connectivité réseau et ne filtrent pas les requêtes selon leur origine réseau."
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
