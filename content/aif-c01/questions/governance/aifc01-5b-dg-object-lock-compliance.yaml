id: aifc01-5b-dg-object-lock-compliance
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A lending company stores the records of the decisions made by its AI credit model in Amazon S3. A regulation requires that no user, including the root user, can overwrite or delete these records for 7 years.

    Which solution will meet these requirements?
  fr: |
    Une société de crédit stocke dans Amazon S3 les enregistrements des décisions prises par son modèle d'IA d'octroi de crédit. Une réglementation exige qu'aucun utilisateur, y compris l'utilisateur racine, ne puisse écraser ni supprimer ces enregistrements pendant 7 ans.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable S3 Object Lock and apply a 7-year retention period in governance mode.", fr: "Activer S3 Object Lock et appliquer une période de conservation de 7 ans en mode gouvernance." }
    - id: b
      text: { en: "Create an S3 Lifecycle rule that expires the records after 7 years.", fr: "Créer une règle S3 Lifecycle qui fait expirer les enregistrements après 7 ans." }
    - id: c
      text: { en: "Enable S3 Object Lock and apply a 7-year retention period in compliance mode.", fr: "Activer S3 Object Lock et appliquer une période de conservation de 7 ans en mode conformité." }
    - id: d
      text: { en: "Enable S3 Object Lock and place a legal hold on the records.", fr: "Activer S3 Object Lock et placer une conservation légale (legal hold) sur les enregistrements." }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 Object Lock uses a write-once-read-many (WORM) model. In compliance mode, no user, including the root user, can overwrite or delete a protected object version until its retention period ends, and the mode and period cannot be shortened."
    fr: "S3 Object Lock utilise un modèle WORM (write-once-read-many). En mode conformité, aucun utilisateur, y compris l'utilisateur racine, ne peut écraser ni supprimer une version d'objet protégée avant la fin de sa période de conservation, et le mode comme la période ne peuvent pas être réduits."
  options:
    a:
      en: "In governance mode, users with the s3:BypassGovernanceRetention permission can still delete objects."
      fr: "En mode gouvernance, les utilisateurs disposant de l'autorisation s3:BypassGovernanceRetention peuvent encore supprimer des objets."
    b:
      en: "A Lifecycle rule deletes the records after 7 years but does not stop anyone from deleting them earlier."
      fr: "Une règle Lifecycle supprime les enregistrements après 7 ans, mais n'empêche personne de les supprimer avant."
    d:
      en: "A legal hold has no end date, and any user with s3:PutObjectLegalHold can remove it."
      fr: "Une conservation légale n'a pas de date de fin, et tout utilisateur disposant de s3:PutObjectLegalHold peut la retirer."
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
