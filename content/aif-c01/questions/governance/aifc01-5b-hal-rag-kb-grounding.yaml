id: aifc01-5b-hal-rag-kb-grounding
objective: "5.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A human resources company uses a foundation model (FM) on Amazon Bedrock to answer employee questions. The FM often invents answers about the company's internal leave policies, which are stored as documents in Amazon S3. The company wants the answers to be based on these documents without training or modifying the FM.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de ressources humaines utilise un modèle de fondation (FM) sur Amazon Bedrock pour répondre aux questions des employés. Le FM invente souvent des réponses sur les règles internes de congés de l'entreprise, stockées sous forme de documents dans Amazon S3. L'entreprise veut que les réponses s'appuient sur ces documents, sans entraîner ni modifier le FM.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the temperature inference parameter so that the FM explores more possible answers.", fr: "Augmenter le paramètre d'inférence temperature pour que le FM explore davantage de réponses possibles." }
    - id: b
      text: { en: "Fine-tune the FM on the policy documents by using an Amazon Bedrock model customization job.", fr: "Peaufiner (fine-tuning) le FM sur les documents de règles avec une tâche de personnalisation de modèle Amazon Bedrock." }
    - id: c
      text: { en: "Use Amazon Bedrock Knowledge Bases to retrieve relevant passages from the documents and add them to each prompt.", fr: "Utiliser Amazon Bedrock Knowledge Bases pour récupérer les passages pertinents des documents et les ajouter à chaque invite." }
    - id: d
      text: { en: "Increase the maximum length inference parameter so that the FM can write more complete answers.", fr: "Augmenter le paramètre d'inférence de longueur maximale pour que le FM rédige des réponses plus complètes." }
answer: { optionId: c }
explanation:
  correct:
    en: "Retrieval Augmented Generation (RAG) grounds the answers in the company's own data: Amazon Bedrock Knowledge Bases retrieves the relevant chunks from the documents in Amazon S3 and adds them to the prompt sent to the FM. The model itself is not trained or modified."
    fr: "La génération à enrichissement contextuel (RAG) ancre les réponses dans les données de l'entreprise : Amazon Bedrock Knowledge Bases récupère les segments pertinents des documents stockés dans Amazon S3 et les ajoute à l'invite envoyée au FM. Le modèle lui-même n'est ni entraîné ni modifié."
  options:
    a:
      en: "A higher temperature makes responses more random, which tends to increase invented content rather than reduce it."
      fr: "Une température plus élevée rend les réponses plus aléatoires, ce qui tend à augmenter le contenu inventé au lieu de le réduire."
    b:
      en: "Fine-tuning trains a private copy of the model, which the company wants to avoid. It also does not tie each answer to the current documents."
      fr: "Le peaufinage entraîne une copie privée du modèle, ce que l'entreprise veut éviter. Il ne relie pas non plus chaque réponse aux documents actuels."
    d:
      en: "The maximum length only limits how many tokens the model generates; it adds no company knowledge."
      fr: "La longueur maximale limite seulement le nombre de jetons générés ; elle n'apporte aucune connaissance de l'entreprise."
references:
  - title: Query a knowledge base and generate responses based off the retrieved data
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-retrieve-generate.html
  - title: Influence response generation with inference parameters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
