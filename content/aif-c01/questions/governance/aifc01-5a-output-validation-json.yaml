id: aifc01-5a-output-validation-json
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company uses a foundation model in Amazon Bedrock to turn customer emails into JSON orders. The application sends the orders directly to the company's order management system. Sometimes the model returns malformed JSON or values that the order system does not expect.

    What should the company do to protect the order management system?
  fr: |
    Une entreprise de logistique utilise un modèle de fondation dans Amazon Bedrock pour transformer les e-mails des clients en commandes au format JSON. L'application envoie les commandes directement au système de gestion des commandes de l'entreprise. Le modèle renvoie parfois un JSON mal formé ou des valeurs que le système de commandes n'attend pas.

    Que doit faire l'entreprise pour protéger le système de gestion des commandes ?
body:
  options:
    - { id: a, text: { en: "Validate each output against the expected JSON schema and values before sending it.", fr: "Valider chaque sortie par rapport au schéma JSON et aux valeurs attendus avant de l'envoyer." } }
    - { id: b, text: { en: "Increase the temperature so that the model produces more varied outputs.", fr: "Augmenter la température pour que le modèle produise des sorties plus variées." } }
    - { id: c, text: { en: "Encrypt each model output with an AWS KMS key before sending it.", fr: "Chiffrer chaque sortie du modèle avec une clé AWS KMS avant de l'envoyer." } }
    - { id: d, text: { en: "Enable model invocation logging so that every output is recorded.", fr: "Activer la journalisation des invocations de modèle pour que chaque sortie soit enregistrée." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Model output is not guaranteed to be correct, so the application should treat it as untrusted and validate it before another system acts on it. Checking the structure and the allowed values, and defining a fallback such as rejecting the order or sending it for human review, stops bad outputs from reaching the order system."
    fr: "La sortie d'un modèle n'est pas garantie correcte : l'application doit donc la traiter comme non fiable et la valider avant qu'un autre système n'agisse sur elle. Vérifier la structure et les valeurs autorisées, et définir un comportement de repli comme le rejet de la commande ou son envoi en revue humaine, empêche les sorties incorrectes d'atteindre le système de commandes."
  options:
    b:
      en: "A higher temperature makes the output more random, which increases the risk of malformed results."
      fr: "Une température plus élevée rend la sortie plus aléatoire, ce qui augmente le risque de résultats mal formés."
    c:
      en: "Encryption protects confidentiality; a malformed order is still malformed after decryption."
      fr: "Le chiffrement protège la confidentialité ; une commande mal formée l'est toujours après déchiffrement."
    d:
      en: "Logging records the outputs for later review but does nothing to stop a bad output from reaching the order system."
      fr: "La journalisation enregistre les sorties pour un examen ultérieur, mais n'empêche pas une sortie incorrecte d'atteindre le système de commandes."
references:
  - title: GENSEC02-BP01 Implement guardrails to mitigate harmful or incorrect model responses
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gensec02-bp01.html
