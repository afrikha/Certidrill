id: aifc01-5a-multi-model-card-content
objective: "5.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company starts to document its machine learning models with Amazon SageMaker Model Cards.

    Which types of information can the company record in a model card? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise commence à documenter ses modèles de machine learning avec Amazon SageMaker Model Cards.

    Quels types d'informations l'entreprise peut-elle enregistrer dans une carte de modèle ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The intended uses of the model and its risk rating", fr: "Les utilisations prévues du modèle et son niveau de risque" } }
    - { id: b, text: { en: "The list of Amazon S3 objects that contain PII, found by automatic scanning", fr: "La liste des objets Amazon S3 qui contiennent des PII, trouvés par analyse automatique" } }
    - { id: c, text: { en: "Rules that block inference requests outside the intended uses", fr: "Des règles qui bloquent les requêtes d'inférence en dehors des utilisations prévues" } }
    - { id: d, text: { en: "Evaluation results, such as the metrics observed on test datasets", fr: "Les résultats d'évaluation, comme les métriques observées sur des jeux de données de test" } }
    - { id: e, text: { en: "The key material of the AWS KMS key that encrypts the model artifacts", fr: "Le matériel de clé de la clé AWS KMS qui chiffre les artefacts du modèle" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A model card documents a model's overview, intended uses, risk rating, business details, training details, evaluation results and additional information such as ethical considerations and caveats. It is documentation for governance and reporting."
    fr: "Une carte de modèle documente la présentation d'un modèle, ses utilisations prévues, son niveau de risque, ses informations métier, les détails de son entraînement, ses résultats d'évaluation et des informations complémentaires comme les considérations éthiques et les mises en garde. C'est une documentation destinée à la gouvernance et au reporting."
  options:
    b:
      en: "Scanning S3 objects for PII is done by Amazon Macie; a model card does not scan data."
      fr: "L'analyse des objets S3 à la recherche de PII est effectuée par Amazon Macie ; une carte de modèle n'analyse pas de données."
    c:
      en: "A model card describes intended uses but does not enforce anything at inference time."
      fr: "Une carte de modèle décrit les utilisations prévues, mais n'applique aucun contrôle au moment de l'inférence."
    e:
      en: "KMS key material never leaves AWS KMS unencrypted; it is not something that a model card can hold."
      fr: "Le matériel de clé KMS ne quitte jamais AWS KMS en clair ; une carte de modèle ne peut pas le contenir."
references:
  - title: Amazon SageMaker Model Cards
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
