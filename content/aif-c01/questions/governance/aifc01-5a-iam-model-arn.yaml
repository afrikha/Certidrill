id: aifc01-5a-iam-model-arn
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company lets several teams use Amazon Bedrock. A security policy states that the IAM role of one team's application can invoke only one approved foundation model and no other model.

    Which solution will meet this requirement?
  fr: |
    Une entreprise permet à plusieurs équipes d'utiliser Amazon Bedrock. Une règle de sécurité impose que le rôle IAM de l'application d'une équipe puisse invoquer un seul modèle de fondation approuvé et aucun autre.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Attach the AmazonBedrockFullAccess AWS managed policy to the application's IAM role.", fr: "Attacher la politique gérée par AWS AmazonBedrockFullAccess au rôle IAM de l'application." } }
    - { id: b, text: { en: "Create a guardrail with a denied topic for the name of every other foundation model.", fr: "Créer une barrière de protection avec un sujet refusé pour le nom de chacun des autres modèles de fondation." } }
    - { id: c, text: { en: "Create an interface VPC endpoint for Amazon Bedrock that keeps the default endpoint policy.", fr: "Créer un point de terminaison de VPC d'interface pour Amazon Bedrock qui conserve la politique de point de terminaison par défaut." } }
    - { id: d, text: { en: "Attach an IAM policy to the role that allows bedrock:InvokeModel only on the approved model's ARN.", fr: "Attacher au rôle une politique IAM qui autorise bedrock:InvokeModel uniquement sur l'ARN du modèle approuvé." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Identity-based policies control which Amazon Bedrock actions a principal can perform on which resources. Allowing the inference actions only on the ARN of the approved foundation model applies least privilege: any other model is implicitly denied to the role."
    fr: "Les politiques basées sur l'identité contrôlent les actions Amazon Bedrock qu'un principal peut effectuer sur quelles ressources. Autoriser les actions d'inférence uniquement sur l'ARN du modèle de fondation approuvé applique le moindre privilège : tout autre modèle est implicitement refusé au rôle."
  options:
    a:
      en: "The full-access managed policy grants access to every model and to the management actions, which is the opposite of least privilege."
      fr: "La politique gérée d'accès complet donne accès à tous les modèles et aux actions de gestion, à l'opposé du moindre privilège."
    b:
      en: "Denied topics block subjects in the conversation content; they do not control which model an IAM role is allowed to invoke."
      fr: "Les sujets refusés bloquent des thèmes dans le contenu de la conversation ; ils ne contrôlent pas le modèle qu'un rôle IAM est autorisé à invoquer."
    c:
      en: "The default endpoint policy allows full access to Amazon Bedrock through the endpoint, so it does not restrict the models."
      fr: "La politique de point de terminaison par défaut autorise un accès complet à Amazon Bedrock via le point de terminaison : elle ne restreint donc pas les modèles."
references:
  - title: Identity-based policy examples for Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html
