id: aifc01-5b-hal-cg-block-ungrounded
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company runs a Retrieval Augmented Generation (RAG) assistant on Amazon Bedrock that answers questions from retrieved booking-policy documents. The company must automatically detect responses that contain information not found in the retrieved documents and block them before they reach customers.

    Which Amazon Bedrock Guardrails feature will meet these requirements?
  fr: |
    Une entreprise de voyages exécute sur Amazon Bedrock un assistant de génération à enrichissement contextuel (RAG) qui répond aux questions à partir de documents récupérés sur ses conditions de réservation. L'entreprise doit détecter automatiquement les réponses qui contiennent des informations absentes des documents récupérés et les bloquer avant qu'elles n'atteignent les clients.

    Quelle fonctionnalité d'Amazon Bedrock Guardrails répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Contextual grounding checks", fr: "Vérifications de l'ancrage contextuel (contextual grounding checks)" }
    - id: b
      text: { en: "Content filters", fr: "Filtres de contenu (content filters)" }
    - id: c
      text: { en: "Denied topics", fr: "Sujets refusés" }
    - id: d
      text: { en: "Sensitive information filters", fr: "Filtres d'informations sensibles (sensitive information filters)" }
answer: { optionId: a }
explanation:
  correct:
    en: "Contextual grounding checks compare the model response with a reference source and the user query, and give a grounding score and a relevance score. A response that scores below the configured threshold is treated as a hallucination and, with the BLOCK action, is replaced by the blocked-response message."
    fr: "Les vérifications de l'ancrage contextuel comparent la réponse du modèle à une source de référence et à la requête de l'utilisateur, et attribuent un score d'ancrage et un score de pertinence. Une réponse dont le score est inférieur au seuil configuré est traitée comme une hallucination et, avec l'action BLOCK, est remplacée par le message de réponse bloquée."
  options:
    b:
      en: "Content filters detect harmful categories such as hate, insults, violence, and prompt attacks; they do not compare a response with source documents."
      fr: "Les filtres de contenu détectent des catégories nuisibles comme la haine, les insultes, la violence et les attaques par invite ; ils ne comparent pas une réponse à des documents sources."
    c:
      en: "Denied topics block subjects that the company defines; they cannot tell whether a response is supported by the retrieved documents."
      fr: "Les sujets refusés bloquent des sujets définis par l'entreprise ; ils ne peuvent pas dire si une réponse est étayée par les documents récupérés."
    d:
      en: "Sensitive information filters detect or mask personally identifiable information (PII); they do not measure grounding."
      fr: "Les filtres d'informations sensibles détectent ou masquent les informations personnelles identifiables (PII) ; ils ne mesurent pas l'ancrage."
references:
  - title: Use contextual grounding check to filter hallucinations in responses
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: Create your guardrail
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-components.html
