id: aifc01-5a-s3-batch-checksum
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company stores several billion image files in Amazon S3 to train computer vision models. The company must periodically confirm that the stored files are intact, without downloading or restoring them.

    Which solution will meet these requirements?
  fr: |
    Une société de recherche stocke plusieurs milliards de fichiers image dans Amazon S3 pour entraîner des modèles de vision par ordinateur. Elle doit confirmer régulièrement que les fichiers stockés sont intacts, sans les télécharger ni les restaurer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable log file integrity validation on an AWS CloudTrail trail for the bucket.", fr: "Activer la validation de l'intégrité des fichiers journaux sur un journal de suivi AWS CloudTrail pour le compartiment." } }
    - { id: b, text: { en: "Turn on Amazon Macie automated sensitive data discovery for the bucket.", fr: "Activer la découverte automatisée des données sensibles d'Amazon Macie pour le compartiment." } }
    - { id: c, text: { en: "Run an AWS Glue crawler on the bucket and review the inferred schema.", fr: "Exécuter un crawler AWS Glue sur le compartiment et examiner le schéma déduit." } }
    - { id: d, text: { en: "Run an S3 Batch Operations job that uses the Compute checksum operation.", fr: "Exécuter une tâche S3 Batch Operations qui utilise l'opération Compute checksum." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon S3 uses checksums to verify data integrity. The Compute checksum operation of S3 Batch Operations calculates checksums for a list of objects in place, without downloading or restoring them, and can process billions of objects in one job. The completion report can be used to confirm that the dataset is intact."
    fr: "Amazon S3 utilise des sommes de contrôle pour vérifier l'intégrité des données. L'opération Compute checksum de S3 Batch Operations calcule sur place les sommes de contrôle d'une liste d'objets, sans les télécharger ni les restaurer, et peut traiter des milliards d'objets en une seule tâche. Le rapport d'achèvement permet de confirmer que le jeu de données est intact."
  options:
    a:
      en: "CloudTrail log file integrity validation proves that CloudTrail's own log files were not changed; it does not check the training images."
      fr: "La validation de l'intégrité des fichiers journaux CloudTrail prouve que les fichiers journaux de CloudTrail n'ont pas été modifiés ; elle ne vérifie pas les images d'entraînement."
    b:
      en: "Macie samples objects to find sensitive data; it does not verify that objects are uncorrupted."
      fr: "Macie échantillonne des objets pour trouver des données sensibles ; il ne vérifie pas que les objets ne sont pas corrompus."
    c:
      en: "A crawler extracts metadata such as schema; it does not detect corrupted content."
      fr: "Un crawler extrait des métadonnées comme le schéma ; il ne détecte pas les contenus corrompus."
references:
  - title: Checking object integrity in Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html
