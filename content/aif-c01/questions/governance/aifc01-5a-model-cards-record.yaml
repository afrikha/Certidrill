id: aifc01-5a-model-cards-record
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank's model risk management team needs a single record for each machine learning model built on Amazon SageMaker AI. The record must describe the model's intended uses, its risk rating, its training details, and its evaluation results.

    Which AWS feature should the bank use?
  fr: |
    L'équipe de gestion du risque de modèle d'une banque a besoin d'un enregistrement unique pour chaque modèle de machine learning créé sur Amazon SageMaker AI. Cet enregistrement doit décrire les utilisations prévues du modèle, son niveau de risque, les détails de son entraînement et ses résultats d'évaluation.

    Quelle fonctionnalité AWS la banque doit-elle utiliser ?
body:
  options:
    - { id: a, text: "Amazon SageMaker ML Lineage Tracking" }
    - { id: b, text: "Amazon SageMaker Model Cards" }
    - { id: c, text: "AWS Glue Data Catalog" }
    - { id: d, text: "AWS CloudTrail" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon SageMaker Model Cards document the key details of a model in one place for governance and reporting: intended uses, a risk rating (unknown, low, medium or high), training details, evaluation results and additional information such as ethical considerations. A card can be exported to PDF for stakeholders."
    fr: "Amazon SageMaker Model Cards documentent en un seul endroit les informations clés d'un modèle pour la gouvernance et le reporting : utilisations prévues, niveau de risque (unknown, low, medium ou high), détails de l'entraînement, résultats d'évaluation et informations complémentaires comme les considérations éthiques. Une carte de modèle peut être exportée en PDF pour les parties prenantes."
  options:
    a:
      en: "ML Lineage Tracking records the steps and artifacts of ML workflows; it does not hold intended uses or a risk rating."
      fr: "ML Lineage Tracking enregistre les étapes et les artefacts des flux de travail de ML ; il ne contient ni les utilisations prévues ni le niveau de risque."
    c:
      en: "The Glue Data Catalog stores metadata about datasets, such as location and schema, not documentation about models."
      fr: "Le catalogue de données Glue stocke des métadonnées sur les jeux de données, comme leur emplacement et leur schéma, pas la documentation des modèles."
    d:
      en: "CloudTrail records API activity in the account; it does not document a model's purpose or evaluation."
      fr: "CloudTrail enregistre l'activité des API dans le compte ; il ne documente pas l'objectif ni l'évaluation d'un modèle."
references:
  - title: Amazon SageMaker Model Cards
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
