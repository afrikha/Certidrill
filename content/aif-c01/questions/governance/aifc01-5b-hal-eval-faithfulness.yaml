id: aifc01-5b-hal-eval-faithfulness
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Before launch, a media company evaluates its Retrieval Augmented Generation (RAG) application with an Amazon Bedrock retrieve-and-generate evaluation job. The company wants to measure how well the generated responses avoid hallucination with respect to the retrieved texts.

    Which metric should the company review?
  fr: |
    Avant le lancement, une entreprise de médias évalue son application de génération à enrichissement contextuel (RAG) avec une tâche d'évaluation Amazon Bedrock de type récupération et génération (retrieve and generate). L'entreprise veut mesurer dans quelle mesure les réponses générées évitent les hallucinations par rapport aux textes récupérés.

    Quelle métrique l'entreprise doit-elle examiner ?
body:
  options:
    - id: a
      text: { en: "Context relevance", fr: "Pertinence du contexte (context relevance)" }
    - id: b
      text: { en: "Faithfulness", fr: "Fidélité (faithfulness)" }
    - id: c
      text: { en: "Context coverage", fr: "Couverture du contexte (context coverage)" }
    - id: d
      text: { en: "Helpfulness", fr: "Utilité (helpfulness)" }
answer: { optionId: b }
explanation:
  correct:
    en: "The faithfulness metric measures how well responses avoid hallucination with respect to the retrieved texts. Amazon Bedrock RAG evaluations compute their metrics with an evaluator model, an LLM-as-a-judge approach."
    fr: "La métrique de fidélité (faithfulness) mesure dans quelle mesure les réponses évitent les hallucinations par rapport aux textes récupérés. Les évaluations RAG d'Amazon Bedrock calculent leurs métriques avec un modèle évaluateur, selon l'approche LLM-as-a-judge."
  options:
    a:
      en: "Context relevance is a retrieval metric: it measures whether the retrieved texts are relevant to the questions, not whether the response stays faithful to them."
      fr: "La pertinence du contexte est une métrique de récupération : elle mesure si les textes récupérés sont pertinents pour les questions, pas si la réponse leur reste fidèle."
    c:
      en: "Context coverage measures how much of the ground truth the retrieved texts cover; it evaluates retrieval, not the generated response."
      fr: "La couverture du contexte mesure quelle part de la vérité terrain (ground truth) les textes récupérés couvrent ; elle évalue la récupération, pas la réponse générée."
    d:
      en: "Helpfulness judges how useful a response is overall; a helpful-sounding response can still contain invented facts."
      fr: "L'utilité juge l'intérêt global d'une réponse ; une réponse qui semble utile peut encore contenir des faits inventés."
references:
  - title: Use metrics to understand RAG system performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
  - title: Evaluate RAG sources using Amazon Bedrock evaluations
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
