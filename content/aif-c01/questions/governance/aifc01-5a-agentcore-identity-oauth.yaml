id: aifc01-5a-agentcore-identity-oauth
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building an AI agent that runs on Amazon Bedrock AgentCore Runtime. The agent must read each employee's calendar in a third-party SaaS application that supports OAuth 2.0. Each employee must give consent before the agent acts on their behalf, and the OAuth tokens must not be stored in the agent's code.

    Which AWS feature should the company use?
  fr: |
    Une entreprise crée un agent d'IA qui s'exécute sur Amazon Bedrock AgentCore Runtime. L'agent doit lire l'agenda de chaque employé dans une application SaaS tierce qui prend en charge OAuth 2.0. Chaque employé doit donner son consentement avant que l'agent n'agisse en son nom, et les jetons OAuth ne doivent pas être stockés dans le code de l'agent.

    Quelle fonctionnalité AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "An IAM role, attached to the agent runtime, that grants read permissions", fr: "Un rôle IAM, attaché à l'environnement d'exécution de l'agent, qui accorde des autorisations de lecture" } }
    - { id: b, text: { en: "Amazon Bedrock AgentCore Identity with an OAuth credential provider", fr: "Amazon Bedrock AgentCore Identity avec un fournisseur d'identifiants OAuth" } }
    - { id: c, text: { en: "Policy in Amazon Bedrock AgentCore with a Cedar policy for the calendar tool", fr: "Policy dans Amazon Bedrock AgentCore avec une politique Cedar pour l'outil d'agenda" } }
    - { id: d, text: { en: "An Amazon Bedrock guardrail with a sensitive information filter for tokens", fr: "Une barrière de protection Amazon Bedrock avec un filtre d'informations sensibles pour les jetons" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AgentCore Identity manages identities and credentials for agents. Its credential providers support the OAuth 2.0 authorization code grant, in which the user gives explicit consent, and its token vault stores the OAuth tokens encrypted with AWS KMS, so the agent retrieves them at run time instead of keeping them in its code."
    fr: "AgentCore Identity gère les identités et les identifiants des agents. Ses fournisseurs d'identifiants prennent en charge l'octroi par code d'autorisation OAuth 2.0, dans lequel l'utilisateur donne un consentement explicite, et son coffre de jetons stocke les jetons OAuth chiffrés avec AWS KMS : l'agent les récupère à l'exécution au lieu de les conserver dans son code."
  options:
    a:
      en: "An IAM role grants permissions on AWS resources; it cannot obtain user-delegated OAuth tokens for a third-party application."
      fr: "Un rôle IAM accorde des autorisations sur des ressources AWS ; il ne peut pas obtenir de jetons OAuth délégués par l'utilisateur pour une application tierce."
    c:
      en: "Policy in AgentCore decides which tool calls an agent may make through AgentCore Gateway; it does not obtain or store credentials."
      fr: "Policy dans AgentCore décide des appels d'outils qu'un agent peut effectuer via AgentCore Gateway ; il n'obtient ni ne stocke d'identifiants."
    d:
      en: "A sensitive information filter detects and masks sensitive data in prompts and responses; it does not manage OAuth consent or tokens."
      fr: "Un filtre d'informations sensibles détecte et masque des données sensibles dans les invites et les réponses ; il ne gère ni le consentement OAuth ni les jetons."
references:
  - title: Provide identity and credential management for agent applications with Amazon Bedrock AgentCore Identity
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
  - title: Features of AgentCore Identity
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/key-features-and-benefits.html
