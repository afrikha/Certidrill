id: aifc01-1b-notml-cost-benefit
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A small online shop receives about 20 refund requests each month. An employee reviews each request in about 5 minutes. A consultant proposes a custom ML model to approve refunds. The project would require labeling past requests, training the model, hosting a real-time endpoint, and retraining the model regularly. What should the shop do FIRST to decide whether to proceed?
  fr: |
    Une petite boutique en ligne reçoit environ 20 demandes de remboursement par mois. Un employé examine chaque demande en 5 minutes environ. Un consultant propose un modèle de ML personnalisé pour approuver les remboursements. Le projet exigerait d'étiqueter les anciennes demandes, d'entraîner le modèle, d'héberger un point de terminaison en temps réel et de réentraîner régulièrement le modèle. Que doit faire la boutique EN PREMIER pour décider si elle poursuit ?
body:
  options:
    - id: a
      text: { en: "Compare the cost of building and running the model with the value of the time it saves.", fr: "Comparer le coût de création et d'exploitation du modèle à la valeur du temps qu'il fait gagner." }
    - id: b
      text: { en: "Choose the endpoint instance type that gives the lowest prediction latency.", fr: "Choisir le type d'instance du point de terminaison qui donne la latence de prédiction la plus faible." }
    - id: c
      text: { en: "Label all past refund requests so that the model can reach high accuracy.", fr: "Étiqueter toutes les anciennes demandes de remboursement pour que le modèle atteigne une haute exactitude." }
    - id: d
      text: { en: "Select the algorithm that gives the highest accuracy on a sample of requests.", fr: "Sélectionner l'algorithme qui donne la meilleure exactitude sur un échantillon de demandes." }
answer: { optionId: a }
explanation:
  correct:
    en: "The manual process costs less than two hours of work each month. A cost-benefit analysis compares this value with the cost of data labeling, training, inference hosting, retraining, and wrong predictions. Here the costs are likely to exceed the benefit, so ML is probably not justified."
    fr: "Le processus manuel représente moins de deux heures de travail par mois. Une analyse coûts-avantages compare cette valeur au coût de l'étiquetage des données, de l'entraînement, de l'hébergement de l'inférence, du réentraînement et des prédictions erronées. Ici, les coûts risquent de dépasser le bénéfice : le ML n'est probablement pas justifié."
  options:
    b:
      en: "Choosing infrastructure assumes that the project goes ahead; it does not answer whether the model is worth building."
      fr: "Choisir l'infrastructure suppose que le projet est lancé ; cela ne dit pas si le modèle vaut la peine d'être créé."
    c:
      en: "Labeling is an expensive step of the project itself; doing it first spends money before the value is confirmed."
      fr: "L'étiquetage est une étape coûteuse du projet lui-même ; le faire d'abord engage des dépenses avant d'avoir confirmé la valeur."
    d:
      en: "Algorithm selection is part of model development; high accuracy does not make a project worthwhile if its costs exceed its benefits."
      fr: "La sélection d'un algorithme fait partie du développement du modèle ; une haute exactitude ne rend pas un projet rentable si ses coûts dépassent ses bénéfices."
references:
  - title: "Business goal identification - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/business-goal-identification.html
