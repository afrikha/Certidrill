id: aifc01-1b-pipe-eda-charts
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before choosing features for a model, data scientists create histograms, scatter plots, and correlation charts of a new dataset. Their goal is to understand the distributions, find patterns, and check data quality. Which activity are they performing?
  fr: |
    Avant de choisir les caractéristiques d'un modèle, des data scientists créent des histogrammes, des nuages de points et des graphiques de corrélation d'un nouveau jeu de données. Leur objectif est de comprendre les distributions, de trouver des tendances et de vérifier la qualité des données. Quelle activité réalisent-ils ?
body:
  options:
    - id: a
      text: { en: "Model monitoring", fr: "Surveillance du modèle" }
    - id: b
      text: { en: "Exploratory data analysis (EDA)", fr: "Analyse exploratoire des données (EDA)" }
    - id: c
      text: { en: "Hyperparameter tuning", fr: "Réglage des hyperparamètres" }
    - id: d
      text: { en: "Model deployment", fr: "Déploiement du modèle" }
answer: { optionId: b }
explanation:
  correct:
    en: "Exploratory data analysis uses visualization to understand the data, spot patterns that are not evident in tables, and run sanity checks on data quality. It is part of data preparation and guides preprocessing and feature engineering."
    fr: "L'analyse exploratoire des données utilise la visualisation pour comprendre les données, repérer des tendances peu visibles dans les tableaux et effectuer des contrôles de cohérence sur la qualité des données. Elle fait partie de la préparation des données et oriente le prétraitement et l'ingénierie des caractéristiques."
  options:
    a:
      en: "Model monitoring tracks a model that is already in production; no model exists yet here."
      fr: "La surveillance du modèle suit un modèle déjà en production ; ici, aucun modèle n'existe encore."
    c:
      en: "Hyperparameter tuning happens during training to find the best algorithm settings."
      fr: "Le réglage des hyperparamètres a lieu pendant l'entraînement pour trouver les meilleurs paramètres de l'algorithme."
    d:
      en: "Deployment makes a trained model available for inference; it comes much later in the pipeline."
      fr: "Le déploiement rend un modèle entraîné disponible pour l'inférence ; il intervient bien plus tard dans le pipeline."
references:
  - title: "Data preparation - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/data-preparation.html
  - title: "Data processing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/data-processing.html
