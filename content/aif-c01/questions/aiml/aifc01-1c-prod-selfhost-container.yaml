id: aifc01-1c-prod-selfhost-container
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company trained its own claims-scoring model. The model needs custom inference code packaged in the company's own container. The company must choose the instance type, and wants AWS to manage the hosting infrastructure behind a low-latency HTTPS endpoint.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance a entraîné son propre modèle d'évaluation des sinistres. Le modèle a besoin d'un code d'inférence personnalisé empaqueté dans le conteneur de l'entreprise. L'entreprise doit choisir le type d'instance et veut qu'AWS gère l'infrastructure d'hébergement derrière un point de terminaison HTTPS à faible latence.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Invoke a foundation model through Amazon Bedrock on-demand inference.", fr: "Appeler un modèle de fondation par l'inférence à la demande d'Amazon Bedrock." } }
    - { id: b, text: { en: "Create an Amazon SageMaker AI batch transform job for each request.", fr: "Créer une tâche de transformation par lots Amazon SageMaker AI pour chaque requête." } }
    - { id: c, text: { en: "Use an Amazon Comprehend custom classification model.", fr: "Utiliser un modèle de classification personnalisée Amazon Comprehend." } }
    - { id: d, text: { en: "Deploy the model and container to an Amazon SageMaker AI real-time endpoint.", fr: "Déployer le modèle et le conteneur sur un point de terminaison en temps réel Amazon SageMaker AI." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A SageMaker AI real-time endpoint is a self-hosted API on fully managed hosting: the company brings its model and container and selects the instance type, and SageMaker AI runs the endpoint. Real-time endpoints are designed for interactive, low-latency requests and support automatic scaling."
    fr: "Un point de terminaison en temps réel SageMaker AI est une API autohébergée sur un hébergement entièrement géré : l'entreprise apporte son modèle et son conteneur et choisit le type d'instance, et SageMaker AI exécute le point de terminaison. Les points de terminaison en temps réel sont conçus pour des requêtes interactives à faible latence et prennent en charge la mise à l'échelle automatique."
  options:
    a:
      en: "Bedrock runs the models it offers; it does not run the company's own model with custom inference code in its container."
      fr: "Bedrock exécute les modèles qu'il propose ; il n'exécute pas le modèle de l'entreprise avec un code d'inférence personnalisé dans son conteneur."
    b:
      en: "Batch transform processes whole datasets without a persistent endpoint; it does not answer individual low-latency requests."
      fr: "La transformation par lots traite des jeux de données entiers sans point de terminaison persistant ; elle ne répond pas à des requêtes individuelles à faible latence."
    c:
      en: "Comprehend trains its own text classifiers; it cannot host the company's model or container."
      fr: "Comprehend entraîne ses propres classifieurs de texte ; il ne peut pas héberger le modèle ou le conteneur de l'entreprise."
references:
  - title: Real-time inference
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html
  - title: Deploy models for inference
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model.html
