id: aifc01-1a-term-neural-network
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team that is new to AI is learning how neural networks work.

    Which two statements about neural networks are correct? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe qui découvre l'IA apprend le fonctionnement des réseaux neuronaux.

    Quelles sont les deux affirmations correctes sur les réseaux neuronaux ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A neural network needs a developer to write an explicit rule for each prediction it makes.", fr: "Un réseau neuronal a besoin qu'un développeur écrive une règle explicite pour chaque prédiction qu'il fait." } }
    - { id: b, text: { en: "A neural network is made of connected nodes organized in an input layer, hidden layers, and an output layer.", fr: "Un réseau neuronal est constitué de nœuds connectés, organisés en une couche d'entrée, des couches cachées et une couche de sortie." } }
    - { id: c, text: { en: "A deep neural network with many hidden layers usually needs less training data than a simple linear model.", fr: "Un réseau neuronal profond avec de nombreuses couches cachées a généralement besoin de moins de données d'entraînement qu'un modèle linéaire simple." } }
    - { id: d, text: { en: "Each connection between nodes has a numeric weight that training adjusts to improve the outputs.", fr: "Chaque connexion entre nœuds a un poids numérique que l'entraînement ajuste pour améliorer les sorties." } }
    - { id: e, text: { en: "A neural network can process only structured data that is stored in rows and columns.", fr: "Un réseau neuronal ne peut traiter que des données structurées stockées en lignes et en colonnes." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A neural network is a set of artificial neurons (nodes) arranged in an input layer, one or more hidden layers, and an output layer. Each connection has a weight; during training, a feedback loop adjusts the weights so that paths that lead to correct outputs are strengthened."
    fr: "Un réseau neuronal est un ensemble de neurones artificiels (nœuds) organisés en une couche d'entrée, une ou plusieurs couches cachées et une couche de sortie. Chaque connexion a un poids ; pendant l'entraînement, une boucle de rétroaction ajuste les poids pour renforcer les chemins qui mènent à des sorties correctes."
  options:
    a:
      en: "Neural networks learn from data; they are not programmed with explicit rules for each prediction."
      fr: "Les réseaux neuronaux apprennent à partir des données ; ils ne sont pas programmés avec des règles explicites pour chaque prédiction."
    c:
      en: "Deep neural networks need far more training data than simpler ML methods."
      fr: "Les réseaux neuronaux profonds ont besoin de beaucoup plus de données d'entraînement que les méthodes de ML plus simples."
    e:
      en: "Neural networks are widely used for unstructured data, such as images, audio, and free text."
      fr: "Les réseaux neuronaux sont largement utilisés pour les données non structurées, comme les images, l'audio et le texte libre."
references:
  - title: "What is a Neural Network? - Artificial Neural Network Explained - AWS"
    url: https://aws.amazon.com/what-is/neural-network/
