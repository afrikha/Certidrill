id: aifc01-1a-term-bias-groups
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank reviews a loan approval model. The model approves applicants from one age group at a much lower rate than applicants from other age groups who have similar income, debt, and repayment history. The training data contains few examples from that age group.

    Which term describes this problem?
  fr: |
    Une banque examine un modèle d'approbation de prêts. Le modèle approuve les demandeurs d'une tranche d'âge à un taux bien plus faible que les demandeurs des autres tranches d'âge qui ont des revenus, des dettes et un historique de remboursement similaires. Les données d'entraînement contiennent peu d'exemples de cette tranche d'âge.

    Quel terme décrit ce problème ?
body:
  options:
    - { id: a, text: { en: "Hallucination", fr: "Hallucination" } }
    - { id: b, text: { en: "Underfitting", fr: "Sous-ajustement (underfitting)" } }
    - { id: c, text: { en: "Data labeling", fr: "Étiquetage des données" } }
    - { id: d, text: { en: "Bias", fr: "Biais" } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS describes bias as imbalances in data or disparities in the performance of a model across different groups. Here an under-represented age group receives systematically different outcomes for similar profiles, which is a fairness problem caused by biased data."
    fr: "AWS décrit les biais comme des déséquilibres dans les données ou des écarts de performance d'un modèle entre différents groupes. Ici, une tranche d'âge sous-représentée obtient systématiquement des résultats différents pour des profils similaires : c'est un problème d'équité causé par des données biaisées."
  options:
    a:
      en: "A hallucination is a generative AI output that sounds plausible but is false or unsupported; this model returns approval decisions, not generated content."
      fr: "Une hallucination est une sortie d'IA générative qui semble plausible mais qui est fausse ou non étayée ; ce modèle renvoie des décisions d'approbation, pas du contenu généré."
    b:
      en: "Underfitting means the model performs poorly on all data; the problem here is a difference in outcomes between groups."
      fr: "Le sous-ajustement signifie que le modèle donne de mauvais résultats sur toutes les données ; le problème ici est une différence de résultats entre groupes."
    c:
      en: "Data labeling is the process of tagging raw data for training; it is a preparation step, not a description of unequal outcomes."
      fr: "L'étiquetage des données est le processus qui consiste à baliser les données brutes pour l'entraînement ; c'est une étape de préparation, pas la description de résultats inégaux."
references:
  - title: "Responsible AI – Building AI Responsibly – AWS"
    url: https://aws.amazon.com/ai/responsible-ai/
