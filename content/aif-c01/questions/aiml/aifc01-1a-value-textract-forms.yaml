id: aifc01-1a-value-textract-forms
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A mortgage company's employees spend hours each day typing data from scanned loan application forms, which contain typed and handwritten text and tables, into the loan system. The company wants to automate this data capture.

    Which AWS service meets this requirement?
  fr: |
    Les employés d'une société de crédit immobilier passent des heures chaque jour à saisir dans le système de prêts les données de formulaires de demande de prêt numérisés, qui contiennent du texte dactylographié et manuscrit ainsi que des tableaux. L'entreprise veut automatiser cette saisie de données.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "Amazon Rekognition" }
    - { id: b, text: "Amazon Polly" }
    - { id: c, text: "Amazon Comprehend" }
    - { id: d, text: "Amazon Textract" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Textract detects typed and handwritten text and extracts structured data such as forms and tables from scanned documents and PDF files. Automating form data capture, for example in loan application processing, is a typical use case, and it requires no ML expertise."
    fr: "Amazon Textract détecte le texte dactylographié et manuscrit et extrait des données structurées, comme des formulaires et des tableaux, à partir de documents numérisés et de fichiers PDF. L'automatisation de la saisie des données de formulaires, par exemple pour le traitement des demandes de prêt, est un cas d'utilisation typique, et elle ne nécessite aucune expertise en ML."
  options:
    a:
      en: "Amazon Rekognition analyzes images and videos, for example to detect objects or moderate content; it is not designed to extract form fields and tables from documents."
      fr: "Amazon Rekognition analyse des images et des vidéos, par exemple pour détecter des objets ou modérer du contenu ; il n'est pas conçu pour extraire les champs et les tableaux de formulaires."
    b:
      en: "Amazon Polly converts text to speech; it does not read documents."
      fr: "Amazon Polly convertit du texte en parole ; il ne lit pas de documents."
    c:
      en: "Amazon Comprehend extracts insights such as entities and sentiment from text that is already available; it does not read scanned images."
      fr: "Amazon Comprehend extrait des informations comme les entités et le sentiment d'un texte déjà disponible ; il ne lit pas d'images numérisées."
references:
  - title: "What is Amazon Textract? - Amazon Textract"
    url: https://docs.aws.amazon.com/textract/latest/dg/what-is.html
