id: aifc01-1c-mlops-pipelines-repeat
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An ML team wants its data processing, training, evaluation and model registration steps to run the same way every time new data arrives. The team does not want to manage servers for the orchestration.

    Which AWS service or feature will meet these requirements?
  fr: |
    Une équipe ML veut que ses étapes de traitement des données, d'entraînement, d'évaluation et d'enregistrement du modèle s'exécutent de la même façon à chaque arrivée de nouvelles données. L'équipe ne veut pas gérer de serveurs pour l'orchestration.

    Quel service ou quelle fonctionnalité AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A cron job on an Amazon EC2 instance that runs the team's notebooks", fr: "Une tâche cron sur une instance Amazon EC2 qui exécute les notebooks de l'équipe" } }
    - { id: b, text: "Amazon SageMaker Pipelines" }
    - { id: c, text: "Amazon SageMaker JumpStart" }
    - { id: d, text: { en: "An AWS Glue DataBrew recipe job", fr: "Une tâche de recette AWS Glue DataBrew" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Repeatable processes are a core MLOps concept. SageMaker Pipelines is a serverless workflow orchestration service that automates data processing, training, evaluation, registration and deployment steps, with versioning and lineage of each execution."
    fr: "Les processus reproductibles sont un concept central du MLOps. SageMaker Pipelines est un service sans serveur d'orchestration de flux de travail qui automatise les étapes de traitement des données, d'entraînement, d'évaluation, d'enregistrement et de déploiement, avec le versionnement et la traçabilité (lineage) de chaque exécution."
  options:
    a:
      en: "A cron job on EC2 means managing a server and fragile notebook scripts, which the team wants to avoid."
      fr: "Une tâche cron sur EC2 implique de gérer un serveur et des scripts de notebooks fragiles, ce que l'équipe veut éviter."
    c:
      en: "JumpStart offers pretrained models and templates; it does not orchestrate the team's workflow on each data arrival."
      fr: "JumpStart propose des modèles préentraînés et des modèles de solution ; il n'orchestre pas le flux de travail de l'équipe à chaque arrivée de données."
    d:
      en: "A DataBrew job repeats data preparation only, not training, evaluation and registration."
      fr: "Une tâche DataBrew ne répète que la préparation des données, pas l'entraînement, l'évaluation et l'enregistrement."
references:
  - title: Pipelines
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html
