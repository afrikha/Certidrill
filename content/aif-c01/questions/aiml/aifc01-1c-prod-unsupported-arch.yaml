id: aifc01-1c-prod-unsupported-arch
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An energy company is choosing between a managed API service (Amazon Bedrock) and a self-hosted API (a model hosted on Amazon SageMaker AI) for a new model in production.

    Which requirement can be met only by the self-hosted API?
  fr: |
    Une entreprise du secteur de l'énergie hésite entre un service d'API géré (Amazon Bedrock) et une API autohébergée (un modèle hébergé sur Amazon SageMaker AI) pour un nouveau modèle en production.

    Quelle exigence ne peut être satisfaite que par l'API autohébergée ?
body:
  options:
    - { id: a, text: { en: "Keep prompts and completions out of the training of the provider's models.", fr: "Exclure les invites et les complétions de l'entraînement des modèles du fournisseur." } }
    - { id: b, text: { en: "Reach the model from a VPC over private connectivity instead of the internet.", fr: "Accéder au modèle depuis un VPC par une connectivité privée plutôt que par internet." } }
    - { id: c, text: { en: "Run a model with a custom architecture that Bedrock does not support.", fr: "Exécuter un modèle d'architecture personnalisée que Bedrock ne prend pas en charge." } }
    - { id: d, text: { en: "Pay for the model per input and output token without an hourly commitment.", fr: "Payer le modèle par jeton d'entrée et de sortie sans engagement horaire." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Bedrock runs the models in its catalog and imported models of supported architectures only. A model with another architecture, or one that needs custom inference code, must be self-hosted, for example in the company's container on a SageMaker AI endpoint."
    fr: "Bedrock exécute uniquement les modèles de son catalogue et les modèles importés d'architectures prises en charge. Un modèle d'une autre architecture, ou qui demande un code d'inférence personnalisé, doit être autohébergé, par exemple dans le conteneur de l'entreprise sur un point de terminaison SageMaker AI."
  options:
    a:
      en: "Bedrock already meets this: inputs and outputs are not used to train AWS or third-party models."
      fr: "Bedrock y répond déjà : les entrées et les sorties ne servent pas à entraîner les modèles d'AWS ou des tiers."
    b:
      en: "Bedrock supports AWS PrivateLink, which gives private connectivity from a VPC without internet traffic."
      fr: "Bedrock prend en charge AWS PrivateLink, qui fournit une connectivité privée depuis un VPC sans trafic internet."
    d:
      en: "Per-token pricing is how Bedrock on-demand is billed; a self-hosted endpoint is billed for instance time instead."
      fr: "La tarification par jeton est celle de Bedrock à la demande ; un point de terminaison autohébergé est facturé au temps d'instance."
references:
  - title: Use Custom model import to import a customized open-source model into Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
  - title: Amazon Bedrock FAQs
    url: https://aws.amazon.com/bedrock/faqs/
