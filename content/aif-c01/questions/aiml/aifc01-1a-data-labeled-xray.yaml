id: aifc01-1a-data-labeled-xray
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hospital has 50,000 X-ray images. Radiologists have tagged each image as "fracture" or "no fracture".

    Which term describes this dataset?
  fr: |
    Un hôpital dispose de 50 000 images radiographiques. Des radiologues ont balisé chaque image comme « fracture » ou « pas de fracture ».

    Quel terme décrit ce jeu de données ?
body:
  options:
    - { id: a, text: { en: "Unlabeled data", fr: "Données non étiquetées" } }
    - { id: b, text: { en: "Time-series data", fr: "Données de séries chronologiques" } }
    - { id: c, text: { en: "Labeled data", fr: "Données étiquetées" } }
    - { id: d, text: { en: "Structured tabular data", fr: "Données tabulaires structurées" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Labeled data is raw data, such as images, text, or audio, with tags that describe what it contains. Each X-ray carries the correct answer (fracture or no fracture), so the dataset can train a supervised classification model."
    fr: "Les données étiquetées sont des données brutes, comme des images, du texte ou de l'audio, accompagnées de balises qui décrivent leur contenu. Chaque radiographie porte la bonne réponse (fracture ou pas de fracture) : le jeu de données peut entraîner un modèle de classification supervisé."
  options:
    a:
      en: "Unlabeled data has no tags; here every image has a tag from a radiologist."
      fr: "Les données non étiquetées n'ont pas de balises ; ici, chaque image a une balise posée par un radiologue."
    b:
      en: "Time-series data is a sequence of values recorded over time; independent X-ray images are not ordered in time."
      fr: "Les données de séries chronologiques sont une suite de valeurs enregistrées dans le temps ; des radiographies indépendantes ne sont pas ordonnées dans le temps."
    d:
      en: "Images are unstructured data; they are not stored as rows and columns with a fixed schema."
      fr: "Les images sont des données non structurées ; elles ne sont pas stockées en lignes et en colonnes avec un schéma fixe."
references:
  - title: "What is Data Labeling? - Data Labeling Explained - AWS"
    url: https://aws.amazon.com/what-is/data-labeling/
