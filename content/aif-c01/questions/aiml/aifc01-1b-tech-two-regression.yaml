id: aifc01-1b-tech-two-regression
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has labeled historical data for several prediction projects.

    Which two projects are regression problems? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise dispose de données historiques étiquetées pour plusieurs projets de prédiction.

    Quels sont les deux projets qui relèvent d'un problème de régression ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Predict whether a loan applicant will default", fr: "Prédire si un demandeur de prêt fera défaut" } }
    - { id: b, text: { en: "Estimate the resale price of a used car", fr: "Estimer le prix de revente d'une voiture d'occasion" } }
    - { id: c, text: { en: "Identify the language of a customer email", fr: "Identifier la langue d'un e-mail client" } }
    - { id: d, text: { en: "Estimate a building's monthly energy use in kWh", fr: "Estimer la consommation énergétique mensuelle d'un bâtiment en kWh" } }
    - { id: e, text: { en: "Assign a product review to one of five topics", fr: "Affecter un avis produit à l'un de cinq sujets" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Regression predicts a continuous numeric value. A resale price and an energy consumption in kWh are both numeric quantities learned from labeled examples."
    fr: "La régression prédit une valeur numérique continue. Un prix de revente et une consommation énergétique en kWh sont deux quantités numériques apprises à partir d'exemples étiquetés."
  options:
    a:
      en: "Default or no default is a yes-or-no outcome: binary classification."
      fr: "Défaut ou absence de défaut est un résultat oui ou non : classification binaire."
    c:
      en: "The language is a category chosen from a list of languages: classification."
      fr: "La langue est une catégorie choisie dans une liste de langues : classification."
    e:
      en: "One of five predefined topics is a category: multi-class classification."
      fr: "L'un de cinq sujets prédéfinis est une catégorie : classification multiclasse."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
