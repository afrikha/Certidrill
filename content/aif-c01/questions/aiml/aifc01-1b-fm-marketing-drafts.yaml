id: aifc01-1b-fm-marketing-drafts
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing team wants to generate first drafts of product announcements, social media posts, and email campaigns in different tones from short natural-language instructions. The company has no labeled training data and no data scientists. Which approach is MOST appropriate?
  fr: |
    Une équipe marketing souhaite générer des premières versions d'annonces de produits, de publications pour les réseaux sociaux et de campagnes d'e-mails dans différents tons, à partir de courtes instructions en langage naturel. L'entreprise ne dispose d'aucune donnée d'entraînement étiquetée ni d'aucun data scientist. Quelle approche est la PLUS appropriée ?
body:
  options:
    - id: a
      text: { en: "Train a text classification model on past marketing content.", fr: "Entraîner un modèle de classification de texte sur d'anciens contenus marketing." }
    - id: b
      text: { en: "Use a pretrained foundation model through Amazon Bedrock.", fr: "Utiliser un modèle de fondation préentraîné par l'intermédiaire d'Amazon Bedrock." }
    - id: c
      text: { en: "Train a regression model that scores the quality of each draft.", fr: "Entraîner un modèle de régression qui note la qualité de chaque brouillon." }
    - id: d
      text: { en: "Train a clustering model that groups past campaigns by topic.", fr: "Entraîner un modèle de clustering qui regroupe les anciennes campagnes par sujet." }
answer: { optionId: b }
explanation:
  correct:
    en: "Generating new content in many formats from instructions is a generative task. A foundation model is pretrained on large amounts of unlabeled data and adapts to many tasks through prompts, so the team needs no labeled data or ML expertise. Amazon Bedrock gives access to FMs from several providers as a fully managed service."
    fr: "Générer du contenu nouveau dans de nombreux formats à partir d'instructions est une tâche générative. Un modèle de fondation est préentraîné sur de grandes quantités de données non étiquetées et s'adapte à de nombreuses tâches grâce aux invites : l'équipe n'a besoin ni de données étiquetées ni d'expertise en ML. Amazon Bedrock donne accès à des FM de plusieurs fournisseurs sous forme de service entièrement géré."
  options:
    a:
      en: "A classification model assigns existing text to categories; it does not write new content, and it needs labeled data."
      fr: "Un modèle de classification affecte un texte existant à des catégories ; il ne rédige pas de nouveau contenu et exige des données étiquetées."
    c:
      en: "A regression model predicts a number, such as a score; it does not generate drafts."
      fr: "Un modèle de régression prédit un nombre, comme un score ; il ne génère pas de brouillons."
    d:
      en: "Clustering groups existing content; it does not create new text."
      fr: "Le clustering regroupe du contenu existant ; il ne crée pas de nouveau texte."
references:
  - title: "Data differences between generative AI and traditional ML"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-data-considerations-gen-ai/differences.html
  - title: "Overview - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
