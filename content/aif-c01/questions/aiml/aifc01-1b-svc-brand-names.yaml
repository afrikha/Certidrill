id: aifc01-1b-svc-brand-names
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company uses Amazon Translate to translate its product documentation from English into French and German. Reviewers report that some product names, such as "Cloud Notes", are translated into ordinary words instead of being kept as brand names. Which solution will meet this requirement with the LEAST effort?
  fr: |
    Un éditeur de logiciels utilise Amazon Translate pour traduire sa documentation produit de l'anglais vers le français et l'allemand. Les relecteurs signalent que certains noms de produits, comme « Cloud Notes », sont traduits en mots ordinaires au lieu d'être conservés comme noms de marque. Quelle solution répond à cette exigence avec le MOINS d'efforts ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon Transcribe custom vocabulary that lists the product names.", fr: "Créer un vocabulaire personnalisé Amazon Transcribe qui liste les noms de produits." }
    - id: b
      text: { en: "Train an Amazon Comprehend custom entity recognizer for the product names.", fr: "Entraîner un outil de reconnaissance d'entités personnalisées Amazon Comprehend pour les noms de produits." }
    - id: c
      text: { en: "Train a custom translation model in Amazon SageMaker AI on the documentation.", fr: "Entraîner un modèle de traduction personnalisé dans Amazon SageMaker AI sur la documentation." }
    - id: d
      text: { en: "Create an Amazon Translate custom terminology that maps each product name.", fr: "Créer une terminologie personnalisée Amazon Translate qui associe chaque nom de produit." }
answer: { optionId: d }
explanation:
  correct:
    en: "Custom terminology lets you define how specific source terms, such as brand and product names, are translated. When Amazon Translate finds a match in the terminology file, it uses the translation from the file, for example to keep Cloud Notes unchanged. Amazon Translate considers the context when it applies a term, so reviewers should still check the output."
    fr: "La terminologie personnalisée permet de définir comment des termes sources précis, comme les noms de marques et de produits, sont traduits. Quand Amazon Translate trouve une correspondance dans le fichier de terminologie, il utilise la traduction du fichier, par exemple pour conserver Cloud Notes tel quel. Amazon Translate tient compte du contexte pour appliquer un terme : les relecteurs doivent donc toujours vérifier le résultat."
  options:
    a:
      en: "A Transcribe custom vocabulary improves speech recognition of specific words in audio; it has no effect on text translation."
      fr: "Un vocabulaire personnalisé Transcribe améliore la reconnaissance vocale de mots précis dans l'audio ; il n'a aucun effet sur la traduction de texte."
    b:
      en: "A custom entity recognizer can find the product names in text, but it does not change how Amazon Translate translates them."
      fr: "Un outil de reconnaissance d'entités personnalisées peut trouver les noms de produits dans le texte, mais il ne change pas la façon dont Amazon Translate les traduit."
    c:
      en: "Training and hosting a custom translation model needs ML expertise and data, which is far more effort than a terminology file."
      fr: "Entraîner et héberger un modèle de traduction personnalisé exige une expertise en ML et des données, soit bien plus d'efforts qu'un fichier de terminologie."
references:
  - title: "Customizing your translations with custom terminology"
    url: https://docs.aws.amazon.com/translate/latest/dg/how-custom-terminology.html
