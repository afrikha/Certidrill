id: aifc01-1a-inf-order-async
objective: "1.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company has trained a model in Amazon SageMaker AI that analyzes large audio files. The application must not keep a connection open while a file is processed, and it must be notified when each result is ready.

    Which four steps should the company perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise a entraîné dans Amazon SageMaker AI un modèle qui analyse des fichiers audio volumineux. L'application ne doit pas garder de connexion ouverte pendant le traitement d'un fichier, et elle doit être notifiée lorsque chaque résultat est prêt.

    Quelles sont les quatre étapes que l'entreprise doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: sync
      text: { en: "Call InvokeEndpoint and wait on the open connection for the prediction.", fr: "Appeler InvokeEndpoint et attendre la prédiction sur la connexion ouverte." }
    - id: upload
      text: { en: "Upload the audio file to an Amazon S3 bucket.", fr: "Charger le fichier audio dans un compartiment Amazon S3." }
    - id: config
      text: { en: "Create an endpoint configuration that includes an asynchronous inference configuration, and deploy the endpoint.", fr: "Créer une configuration de point de terminaison qui inclut une configuration d'inférence asynchrone, puis déployer le point de terminaison." }
    - id: read
      text: { en: "After the Amazon SNS success notification, read the result from the output location in Amazon S3.", fr: "Après la notification de réussite Amazon SNS, lire le résultat dans l'emplacement de sortie Amazon S3." }
    - id: batch
      text: { en: "Create a batch transform job that processes every file in the bucket.", fr: "Créer une tâche de transformation par lots (batch transform) qui traite tous les fichiers du compartiment." }
    - id: invoke
      text: { en: "Call InvokeEndpointAsync with the Amazon S3 location of the audio file.", fr: "Appeler InvokeEndpointAsync avec l'emplacement Amazon S3 du fichier audio." }
answer:
  sequence: [config, upload, invoke, read]
explanation:
  correct:
    en: "An asynchronous endpoint is created by adding an asynchronous inference configuration to the endpoint configuration. The payload is placed in Amazon S3 and referenced in an InvokeEndpointAsync call; SageMaker AI queues the request and returns an output location. When processing finishes, the result is written to Amazon S3 and an optional Amazon SNS notification tells the application that it is ready."
    fr: "Un point de terminaison asynchrone se crée en ajoutant une configuration d'inférence asynchrone à la configuration du point de terminaison. La charge utile est placée dans Amazon S3 et référencée dans un appel InvokeEndpointAsync ; SageMaker AI met la requête en file d'attente et renvoie un emplacement de sortie. À la fin du traitement, le résultat est écrit dans Amazon S3 et une notification Amazon SNS facultative indique à l'application qu'il est prêt."
  options:
    sync:
      en: "InvokeEndpoint is a synchronous call that keeps the connection open, and an asynchronous endpoint accepts only asynchronous invocations."
      fr: "InvokeEndpoint est un appel synchrone qui garde la connexion ouverte, et un point de terminaison asynchrone n'accepte que des appels asynchrones."
    batch:
      en: "Batch transform processes a dataset as a job; it does not use the asynchronous endpoint or notify per request."
      fr: "La transformation par lots traite un jeu de données sous forme de tâche ; elle n'utilise pas le point de terminaison asynchrone et ne notifie pas chaque requête."
references:
  - title: "Asynchronous inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
