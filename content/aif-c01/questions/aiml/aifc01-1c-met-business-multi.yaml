id: aifc01-1c-met-business-multi
objective: "1.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company launched an ML-based hotel recommendation feature. The product manager must report on the feature to the executive team by using business metrics instead of model performance metrics.

    Which two metrics should the product manager report? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de voyages a lancé une fonction de recommandation d'hôtels fondée sur le ML. Le chef de produit doit en rendre compte à la direction avec des métriques métier plutôt qu'avec des métriques de performance du modèle.

    Quelles sont les deux métriques que le chef de produit doit présenter ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Customer feedback ratings on the recommendations", fr: "Les notes de satisfaction des clients sur les recommandations" }
    - id: b
      text: { en: "Recall of the model on the test dataset", fr: "Le rappel du modèle sur le jeu de données de test" }
    - id: c
      text: { en: "Area under the ROC curve (AUC)", fr: "L'aire sous la courbe ROC (AUC)" }
    - id: d
      text: { en: "Precision of the model on the validation dataset", fr: "La précision du modèle sur le jeu de données de validation" }
    - id: e
      text: { en: "Cost per user of running the feature", fr: "Le coût par utilisateur de l'exploitation de la fonction" }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Business metrics measure the effect of the ML solution on the business: customer feedback shows how users perceive the recommendations, and cost per user shows what the feature costs for each customer served. Other business metrics include development costs and ROI."
    fr: "Les métriques métier mesurent l'effet de la solution de ML sur l'entreprise : les commentaires des clients montrent comment les utilisateurs perçoivent les recommandations, et le coût par utilisateur indique ce que coûte la fonction pour chaque client servi. D'autres métriques métier sont les coûts de développement et le ROI."
  options:
    b:
      en: "Recall is a model performance metric computed on labeled test data."
      fr: "Le rappel est une métrique de performance du modèle calculée sur des données de test étiquetées."
    c:
      en: "AUC measures classification performance across thresholds; it is a model metric."
      fr: "L'AUC mesure la performance de classification sur l'ensemble des seuils ; c'est une métrique du modèle."
    d:
      en: "Precision is a model performance metric, not a measure of business impact."
      fr: "La précision est une métrique de performance du modèle, pas une mesure de l'impact métier."
references:
  - title: Business goal identification
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/business-goal-identification.html
  - title: Metrics and validation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
