id: aifc01-1a-inf-batch-transform
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company has a trained model in Amazon SageMaker AI. Once a month, it must score all 10 million policy records stored in Amazon S3 and save the predictions to Amazon S3. No application needs to call the model between these monthly runs.

    Which inference option meets these requirements with the LEAST operational overhead?
  fr: |
    Une compagnie d'assurance dispose d'un modèle entraîné dans Amazon SageMaker AI. Une fois par mois, elle doit noter les 10 millions d'enregistrements de polices stockés dans Amazon S3 et enregistrer les prédictions dans Amazon S3. Aucune application n'a besoin d'appeler le modèle entre ces exécutions mensuelles.

    Quelle option d'inférence répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "A real-time endpoint that runs continuously", fr: "Un point de terminaison en temps réel qui s'exécute en permanence" } }
    - { id: b, text: { en: "A batch transform job", fr: "Une tâche de transformation par lots (batch transform)" } }
    - { id: c, text: { en: "A real-time endpoint with automatic scaling", fr: "Un point de terminaison en temps réel avec mise à l'échelle automatique" } }
    - { id: d, text: { en: "A serverless endpoint called once per record", fr: "Un point de terminaison sans serveur appelé une fois par enregistrement" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Batch transform gets inferences for an entire dataset when no persistent endpoint is needed. The job starts compute instances, distributes the records stored in Amazon S3 between them, and writes the predictions to an S3 output location."
    fr: "La transformation par lots fournit des inférences pour un jeu de données complet lorsqu'aucun point de terminaison permanent n'est nécessaire. La tâche démarre des instances de calcul, répartit entre elles les enregistrements stockés dans Amazon S3 et écrit les prédictions dans un emplacement de sortie S3."
  options:
    a:
      en: "A continuously running endpoint is managed and paid for all month although it is used only once, and the company would still need code to send 10 million individual requests."
      fr: "Un point de terminaison qui s'exécute en permanence est géré et payé tout le mois alors qu'il n'est utilisé qu'une fois, et l'entreprise aurait encore besoin de code pour envoyer 10 millions de requêtes individuelles."
    c:
      en: "Automatic scaling adjusts capacity for live traffic, but the endpoint still serves individual requests, so the company would have to write and run code that calls it for every record."
      fr: "La mise à l'échelle automatique ajuste la capacité au trafic en direct, mais le point de terminaison sert toujours des requêtes individuelles : l'entreprise devrait écrire et exécuter du code qui l'appelle pour chaque enregistrement."
    d:
      en: "Sending 10 million individual requests requires custom code to read the records, call the endpoint, and store results; a batch job does this for the whole dataset."
      fr: "Envoyer 10 millions de requêtes individuelles exige du code personnalisé pour lire les enregistrements, appeler le point de terminaison et stocker les résultats ; une tâche par lots fait cela pour tout le jeu de données."
references:
  - title: "Batch transform for inference with Amazon SageMaker AI - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform.html
