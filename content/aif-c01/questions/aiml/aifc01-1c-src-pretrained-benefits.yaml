id: aifc01-1c-src-pretrained-benefits
objective: "1.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A retail company plans a generative AI assistant. The company compares two approaches: start from an existing pretrained foundation model (FM), or train its own FM from scratch.

    Which two are advantages of starting from a pretrained FM? (Choose two.)
  fr: |
    Une entreprise de distribution prévoit un assistant d'IA générative. Elle compare deux approches : partir d'un modèle de fondation (FM) préentraîné existant, ou entraîner son propre FM de zéro.

    Quels sont les deux avantages de partir d'un FM préentraîné ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "The model's outputs are guaranteed to be free of bias.", fr: "Les sorties du modèle sont garanties sans biais." }
    - id: b
      text: { en: "The company avoids the compute cost and time of pre-training on a massive dataset.", fr: "L'entreprise évite le coût de calcul et le temps d'un préentraînement sur un jeu de données massif." }
    - id: c
      text: { en: "The company no longer needs to evaluate the model for its use case.", fr: "L'entreprise n'a plus besoin d'évaluer le modèle pour son cas d'utilisation." }
    - id: d
      text: { en: "The model can be adapted with a much smaller company dataset, for example by fine-tuning.", fr: "Le modèle peut être adapté avec un jeu de données de l'entreprise bien plus petit, par exemple par peaufinage (fine-tuning)." }
    - id: e
      text: { en: "The company no longer needs to review the license terms of the model.", fr: "L'entreprise n'a plus besoin d'examiner les conditions de licence du modèle." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Pre-training an FM from scratch needs a massive dataset, large clusters of accelerators and a long training time. A pretrained FM already has general capabilities, so the company can use it directly or adapt it with a small, task-specific dataset through fine-tuning."
    fr: "Préentraîner un FM de zéro demande un jeu de données massif, de grands clusters d'accélérateurs et un long temps d'entraînement. Un FM préentraîné possède déjà des capacités générales : l'entreprise peut l'utiliser directement ou l'adapter avec un petit jeu de données propre à la tâche par peaufinage."
  options:
    a:
      en: "A pretrained model can carry biases from its training data; the company must still evaluate it for bias and fairness."
      fr: "Un modèle préentraîné peut porter les biais de ses données d'entraînement ; l'entreprise doit toujours l'évaluer sur le plan du biais et de l'équité."
    c:
      en: "A general-purpose model must still be evaluated on the company's own task and data before production."
      fr: "Un modèle généraliste doit toujours être évalué sur la tâche et les données de l'entreprise avant la production."
    e:
      en: "Third-party and open-source models come with license terms that the customer is responsible for reviewing and following."
      fr: "Les modèles tiers et open source ont des conditions de licence que le client doit examiner et respecter."
references:
  - title: SageMaker JumpStart pretrained models
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html
  - title: Amazon SageMaker HyperPod
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod.html
