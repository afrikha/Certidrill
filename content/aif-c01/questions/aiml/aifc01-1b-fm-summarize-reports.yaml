id: aifc01-1b-fm-summarize-reports
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consulting firm wants to produce one-paragraph summaries of long client reports written in free-form text. The firm has no example summaries to train a model and wants to start within days. Which approach will meet these requirements?
  fr: |
    Un cabinet de conseil souhaite produire des résumés d'un paragraphe de longs rapports clients rédigés en texte libre. Le cabinet ne dispose d'aucun exemple de résumé pour entraîner un modèle et veut démarrer en quelques jours. Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Train a custom summarization model on the reports in Amazon SageMaker AI.", fr: "Entraîner un modèle de résumé personnalisé sur les rapports dans Amazon SageMaker AI." }
    - id: b
      text: { en: "Train a clustering model that groups similar sentences of each report.", fr: "Entraîner un modèle de clustering qui regroupe les phrases similaires de chaque rapport." }
    - id: c
      text: { en: "Train a classification model that labels each report by industry.", fr: "Entraîner un modèle de classification qui étiquette chaque rapport par secteur." }
    - id: d
      text: { en: "Prompt a pretrained foundation model on Amazon Bedrock to summarize each report.", fr: "Demander, par une invite, à un modèle de fondation préentraîné sur Amazon Bedrock de résumer chaque rapport." }
answer: { optionId: d }
explanation:
  correct:
    en: "Foundation models learn general language understanding during pre-training on large unlabeled datasets, so they can summarize unstructured text from a prompt without task-specific training data. Calling an FM through Amazon Bedrock avoids building, training and hosting a model."
    fr: "Les modèles de fondation acquièrent une compréhension générale du langage pendant le préentraînement sur de grands jeux de données non étiquetées : ils peuvent résumer un texte non structuré à partir d'une invite, sans données d'entraînement propres à la tâche. Appeler un FM par Amazon Bedrock évite de créer, d'entraîner et d'héberger un modèle."
  options:
    a:
      en: "Training a summarization model needs example summaries as labels, and the firm has none; it would also take far longer than days."
      fr: "Entraîner un modèle de résumé exige des exemples de résumés comme étiquettes, et le cabinet n'en a aucun ; cela prendrait aussi bien plus que quelques jours."
    b:
      en: "Grouping sentences does not write a summary paragraph."
      fr: "Regrouper des phrases ne rédige pas de paragraphe de résumé."
    c:
      en: "Labeling reports by industry is classification; it does not summarize their content."
      fr: "Étiqueter les rapports par secteur relève de la classification ; cela ne résume pas leur contenu."
references:
  - title: "Data differences between generative AI and traditional ML"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-data-considerations-gen-ai/differences.html
