id: aifc01-1a-value-best-fit
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company is reviewing four automation projects.

    Which project is the BEST candidate for an ML solution?
  fr: |
    Une entreprise de services financiers examine quatre projets d'automatisation.

    Quel projet est le MEILLEUR candidat pour une solution de ML ?
body:
  options:
    - { id: a, text: { en: "Calculating sales tax by applying the rates that the law defines", fr: "Calculer la taxe sur les ventes en appliquant les taux définis par la loi" } }
    - { id: b, text: { en: "Detecting unusual patterns in millions of card transactions that change over time", fr: "Détecter des schémas inhabituels dans des millions de transactions par carte qui évoluent dans le temps" } }
    - { id: c, text: { en: "Sorting monthly statements by account number and date", fr: "Trier les relevés mensuels par numéro de compte et par date" } }
    - { id: d, text: { en: "Applying a fixed fee to every international wire transfer", fr: "Appliquer des frais fixes à chaque virement international" } }
answer: { optionId: b }
explanation:
  correct:
    en: "ML provides value when it must find patterns in large volumes of data that are too complex or change too fast for hand-written rules, such as classifying transactions as fraudulent or genuine. The model can be retrained as fraud patterns evolve."
    fr: "Le ML apporte de la valeur lorsqu'il faut trouver des schémas dans de grands volumes de données, trop complexes ou trop changeants pour des règles écrites à la main, comme classer des transactions en frauduleuses ou authentiques. Le modèle peut être réentraîné à mesure que les schémas de fraude évoluent."
  options:
    a:
      en: "Tax rates defined by law give an exact, deterministic result; a simple calculation is more reliable and cheaper than a prediction."
      fr: "Des taux de taxe définis par la loi donnent un résultat exact et déterministe ; un simple calcul est plus fiable et moins coûteux qu'une prédiction."
    c:
      en: "Sorting by fixed fields is a deterministic operation that does not need learning from data."
      fr: "Trier selon des champs fixes est une opération déterministe qui ne nécessite pas d'apprentissage à partir des données."
    d:
      en: "A fixed fee is a business rule with one exact outcome; ML would only add cost and uncertainty."
      fr: "Des frais fixes sont une règle métier au résultat unique et exact ; le ML n'ajouterait que du coût et de l'incertitude."
references:
  - title: "What is Machine Learning? - ML Technology Explained - AWS"
    url: https://aws.amazon.com/what-is/machine-learning/
