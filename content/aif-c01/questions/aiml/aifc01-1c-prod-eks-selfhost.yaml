id: aifc01-1c-prod-eks-selfhost
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs all of its applications on Amazon EKS and has a platform team experienced with Kubernetes. The company wants to self-host an open-source language model and reuse its existing Kubernetes deployment, scaling and monitoring tooling.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute toutes ses applications sur Amazon EKS et dispose d'une équipe plateforme expérimentée sur Kubernetes. L'entreprise veut autohéberger un modèle de langage open source et réutiliser ses outils Kubernetes existants de déploiement, de mise à l'échelle et de supervision.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Call a comparable model through Amazon Bedrock on-demand inference.", fr: "Appeler un modèle comparable par l'inférence à la demande d'Amazon Bedrock." } }
    - { id: b, text: { en: "Package the model in an AWS Lambda function behind a function URL.", fr: "Empaqueter le modèle dans une fonction AWS Lambda derrière une URL de fonction." } }
    - { id: c, text: { en: "Deploy the model with SageMaker Canvas ready-to-use models.", fr: "Déployer le modèle avec les modèles prêts à l'emploi de SageMaker Canvas." } }
    - { id: d, text: { en: "Run the model in containers on GPU nodes added to the existing EKS cluster.", fr: "Exécuter le modèle dans des conteneurs sur des nœuds GPU ajoutés au cluster EKS existant." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A self-hosted API gives the company control of where and how the model runs. Running the model as containers on GPU nodes of the existing EKS cluster lets the platform team reuse its Kubernetes tooling for deployment, scaling and monitoring."
    fr: "Une API autohébergée donne à l'entreprise le contrôle de l'endroit et de la façon dont le modèle s'exécute. Exécuter le modèle en conteneurs sur des nœuds GPU du cluster EKS existant permet à l'équipe plateforme de réutiliser ses outils Kubernetes de déploiement, de mise à l'échelle et de supervision."
  options:
    a:
      en: "A managed API removes the infrastructure, but the company wants to self-host the open-source model with its Kubernetes tooling."
      fr: "Une API gérée supprime l'infrastructure, mais l'entreprise veut autohéberger le modèle open source avec ses outils Kubernetes."
    b:
      en: "Lambda functions do not provide GPUs and do not use the company's Kubernetes tooling."
      fr: "Les fonctions Lambda ne fournissent pas de GPU et n'utilisent pas les outils Kubernetes de l'entreprise."
    c:
      en: "Canvas ready-to-use models are prebuilt AWS models; they do not host the company's chosen open-source model on Kubernetes."
      fr: "Les modèles prêts à l'emploi de Canvas sont des modèles AWS prédéfinis ; ils n'hébergent pas le modèle open source choisi sur Kubernetes."
references:
  - title: What is Amazon EKS?
    url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
