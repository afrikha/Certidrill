id: aifc01-1c-mlops-experiments
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Data scientists at an insurance company run dozens of training runs with different hyperparameters. They need to record the parameters and metrics of each run and compare the runs to choose the best model.

    Which AWS service or feature will meet these requirements?
  fr: |
    Les scientifiques des données d'une compagnie d'assurance exécutent des dizaines d'entraînements avec des hyperparamètres différents. Ils doivent enregistrer les paramètres et les métriques de chaque exécution et comparer les exécutions pour choisir le meilleur modèle.

    Quel service ou quelle fonctionnalité AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS CloudTrail" }
    - { id: b, text: "Amazon SageMaker Feature Store" }
    - { id: c, text: "Managed MLflow on Amazon SageMaker AI" }
    - { id: d, text: "Amazon SageMaker JumpStart" }
answer: { optionId: c }
explanation:
  correct:
    en: "Experimentation is a core MLOps practice: each run must be tracked so that results can be compared and reproduced. Managed MLflow on SageMaker AI tracks, organizes and compares training runs, and records their parameters and metrics in a metadata store that SageMaker AI manages."
    fr: "L'expérimentation est une pratique centrale du MLOps : chaque exécution doit être suivie pour que les résultats soient comparables et reproductibles. MLflow géré sur SageMaker AI suit, organise et compare les exécutions d'entraînement, et enregistre leurs paramètres et métriques dans un magasin de métadonnées géré par SageMaker AI."
  options:
    a:
      en: "CloudTrail records API activity for auditing; it does not store hyperparameters and metrics of training runs."
      fr: "CloudTrail enregistre l'activité des API pour l'audit ; il ne stocke pas les hyperparamètres et les métriques des exécutions d'entraînement."
    b:
      en: "Feature Store manages the input features of models, not the results of experiments."
      fr: "Feature Store gère les caractéristiques d'entrée des modèles, pas les résultats des expériences."
    d:
      en: "JumpStart provides pretrained models and solution templates; it does not compare the team's training runs."
      fr: "JumpStart fournit des modèles préentraînés et des modèles de solution ; il ne compare pas les exécutions d'entraînement de l'équipe."
references:
  - title: Accelerate generative AI development using managed MLflow on Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow.html
