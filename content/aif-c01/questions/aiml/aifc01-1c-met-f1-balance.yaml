id: aifc01-1c-met-f1-balance
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data science team compares two binary classification models for a loan application review tool. One model has higher precision and the other has higher recall. The team wants one metric that balances precision and recall to rank the two models.

    Which metric should the team use?
  fr: |
    Une équipe de science des données compare deux modèles de classification binaire pour un outil d'examen des demandes de prêt. L'un a une meilleure précision et l'autre un meilleur rappel. L'équipe veut une seule métrique qui équilibre précision et rappel pour classer les deux modèles.

    Quelle métrique l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Accuracy", fr: "Exactitude (accuracy)" } }
    - { id: b, text: { en: "Mean squared error (MSE)", fr: "Erreur quadratique moyenne (MSE)" } }
    - { id: c, text: { en: "F1 score", fr: "Score F1" } }
    - { id: d, text: { en: "Recall", fr: "Rappel" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The F1 score is the harmonic mean of precision and recall: 2 × (precision × recall) / (precision + recall). It ranges from 0 to 1 and is high only when both precision and recall are high."
    fr: "Le score F1 est la moyenne harmonique de la précision et du rappel : 2 × (précision × rappel) / (précision + rappel). Il va de 0 à 1 et n'est élevé que si la précision et le rappel le sont tous les deux."
  options:
    a:
      en: "Accuracy is the share of all correct predictions; it does not combine precision and recall and can mislead on imbalanced data."
      fr: "L'exactitude est la part de toutes les prédictions correctes ; elle ne combine pas précision et rappel et peut tromper sur des données déséquilibrées."
    b:
      en: "MSE is a regression metric for numeric predictions."
      fr: "La MSE est une métrique de régression pour des prédictions numériques."
    d:
      en: "Recall alone favors one of the two models and ignores precision."
      fr: "Le rappel seul favorise l'un des deux modèles et ignore la précision."
references:
  - title: Metrics and validation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
