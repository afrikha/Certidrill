id: aifc01-1c-mlops-reproducible-multi
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An auditor asks a healthcare company to show exactly how a production model was built and to rebuild it with the same results.

    Which two MLOps practices make this possible? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un auditeur demande à une entreprise de santé de montrer exactement comment un modèle de production a été créé et de le recréer avec les mêmes résultats.

    Quelles sont les deux pratiques MLOps qui le permettent ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Each data scientist configures a personal environment by hand.", fr: "Chaque scientifique des données configure à la main un environnement personnel." }
    - id: b
      text: { en: "Only the final model artifact is kept, and experiment records are deleted.", fr: "Seul l'artefact final du modèle est conservé, et les enregistrements d'expériences sont supprimés." }
    - id: c
      text: { en: "The training data and code are versioned together with each model version.", fr: "Les données et le code d'entraînement sont versionnés avec chaque version du modèle." }
    - id: d
      text: { en: "The model is retrained only when a user reports a wrong prediction.", fr: "Le modèle n'est réentraîné que lorsqu'un utilisateur signale une prédiction erronée." }
    - id: e
      text: { en: "The infrastructure and the training pipeline are defined as code.", fr: "L'infrastructure et le pipeline d'entraînement sont définis sous forme de code." }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Reproducibility needs versioned inputs and outputs: the data and code used for each model version must be tracked to show how it was built. Defining infrastructure, configuration and pipelines as code lets the team rerun the same steps in the same environment and get the same results."
    fr: "La reproductibilité exige des entrées et des sorties versionnées : les données et le code utilisés pour chaque version du modèle doivent être suivis pour montrer comment il a été créé. Définir l'infrastructure, la configuration et les pipelines sous forme de code permet de réexécuter les mêmes étapes dans le même environnement et d'obtenir les mêmes résultats."
  options:
    a:
      en: "Hand-built personal environments differ from one another and cannot be recreated reliably."
      fr: "Des environnements personnels configurés à la main diffèrent les uns des autres et ne peuvent pas être recréés de façon fiable."
    b:
      en: "Without experiment records, the team cannot show which data, parameters and code produced the model."
      fr: "Sans enregistrements d'expériences, l'équipe ne peut pas montrer quelles données, quels paramètres et quel code ont produit le modèle."
    d:
      en: "Retraining on user complaints is reactive and says nothing about how the current model was built."
      fr: "Réentraîner sur plainte d'utilisateurs est réactif et n'indique pas comment le modèle actuel a été créé."
references:
  - title: Why Should You Use MLOps?
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-projects-why.html
  - title: What is MLOps?
    url: https://aws.amazon.com/what-is/mlops/
