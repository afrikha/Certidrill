id: aifc01-1b-pipe-order-steps
objective: "1.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company is building its first supervised ML model from raw records in several databases.

    Which five steps should the team perform to go from raw data to a model in production? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise crée son premier modèle de ML supervisé à partir d'enregistrements bruts répartis dans plusieurs bases de données.

    Quelles sont les cinq étapes que l'équipe doit réaliser pour passer des données brutes à un modèle en production ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: eval, text: { en: "Evaluate the model on the held-out test set.", fr: "Évaluer le modèle sur le jeu de test mis de côté." } }
    - { id: collect, text: { en: "Collect, aggregate, and label the data.", fr: "Collecter, agréger et étiqueter les données." } }
    - { id: retest, text: { en: "Add the test set to the training data to tune the hyperparameters.", fr: "Ajouter le jeu de test aux données d'entraînement pour régler les hyperparamètres." } }
    - { id: deploy, text: { en: "Deploy the model to an endpoint for inference.", fr: "Déployer le modèle sur un point de terminaison pour l'inférence." } }
    - { id: prep, text: { en: "Clean the data and split it into training, validation, and test sets.", fr: "Nettoyer les données et les diviser en jeux d'entraînement, de validation et de test." } }
    - { id: train, text: { en: "Train the model and tune it by using the validation set.", fr: "Entraîner le modèle et le régler à l'aide du jeu de validation." } }
answer:
  sequence: [ collect, prep, train, eval, deploy ]
explanation:
  correct:
    en: "Data processing comes first: collect, aggregate and label the data, then clean and partition it. Model development follows: train the model and tune it with the validation set, then evaluate it on the held-out test set. Only a model that meets the success criteria is deployed to serve inferences."
    fr: "Le traitement des données vient en premier : collecter, agréger et étiqueter les données, puis les nettoyer et les partitionner. Le développement du modèle suit : entraîner le modèle et le régler avec le jeu de validation, puis l'évaluer sur le jeu de test mis de côté. Seul un modèle qui atteint les critères de réussite est déployé pour servir des inférences."
  options:
    retest:
      en: "The test set must never be used for training or tuning; otherwise, it no longer gives an unbiased estimate of performance on new data."
      fr: "Le jeu de test ne doit jamais servir à l'entraînement ni au réglage ; sinon, il ne donne plus d'estimation non biaisée des performances sur de nouvelles données."
references:
  - title: "Well-Architected machine learning lifecycle - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/machine-learning-lifecycle.html
  - title: "Model evaluation - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/model-evaluation.html
