id: aifc01-1b-app-match-categories
objective: "1.2.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    A city transportation department is planning four AI applications.

    Match each application with the type of AI application that it represents.

    To answer, drag the appropriate type to each application. Each type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service des transports d'une ville prévoit quatre applications d'IA.

    Associez chaque application au type d'application d'IA qu'elle représente.

    Pour répondre, faites glisser le type approprié vers chaque application. Chaque type peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cv, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
    - { id: nlp, text: { en: "Natural language processing (NLP)", fr: "Traitement du langage naturel (NLP)" } }
    - { id: asr, text: { en: "Speech recognition", fr: "Reconnaissance vocale" } }
    - { id: fc, text: { en: "Forecasting", fr: "Prévision" } }
    - { id: rec, text: { en: "Recommendation system", fr: "Système de recommandation" } }
    - { id: agent, text: { en: "Agentic AI", fr: "IA agentique" } }
  targets:
    - id: t1
      text: { en: "Read the license plate numbers of vehicles in parking garage camera images.", fr: "Lire les numéros de plaque d'immatriculation des véhicules sur les images des caméras d'un parking." }
    - id: t2
      text: { en: "Produce live captions of the mayor's spoken remarks during a press conference.", fr: "Produire des sous-titres en direct des propos tenus oralement par le maire pendant une conférence de presse." }
    - id: t3
      text: { en: "Estimate the number of bus passengers for each hour of next week from past ridership.", fr: "Estimer le nombre de passagers de bus pour chaque heure de la semaine prochaine à partir de la fréquentation passée." }
    - id: t4
      text: { en: "Sort written complaints that residents submit online by topic, such as noise or road damage.", fr: "Trier par sujet, comme le bruit ou la dégradation des routes, les réclamations écrites que les habitants soumettent en ligne." }
answer:
  mapping: { t1: cv, t2: asr, t3: fc, t4: nlp }
explanation:
  correct:
    en: "Reading text that appears in an image is a computer vision task, because the input is pixels, even though the output is text. Live captions convert speech to text: speech recognition. Hourly ridership for next week is predicted from a time series: forecasting. Classifying written complaints by topic analyzes human language in text: NLP."
    fr: "Lire un texte présent dans une image est une tâche de vision par ordinateur, car l'entrée est constituée de pixels, même si la sortie est du texte. Des sous-titres en direct convertissent la parole en texte : reconnaissance vocale. La fréquentation horaire de la semaine prochaine se prédit à partir d'une série chronologique : prévision. Classer des réclamations écrites par sujet analyse du langage humain sous forme de texte : NLP."
  options:
    rec:
      en: "A recommendation system suggests items to users from their behavior; no application here personalizes suggestions."
      fr: "Un système de recommandation suggère des éléments aux utilisateurs selon leur comportement ; aucune application ici ne personnalise des suggestions."
    agent:
      en: "Agentic AI plans and performs multi-step actions with tools; each application here is a single perception or prediction task."
      fr: "L'IA agentique planifie et réalise des actions en plusieurs étapes avec des outils ; chaque application ici est une seule tâche de perception ou de prédiction."
references:
  - title: "What is Amazon Rekognition?"
    url: https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
