id: aifc01-1a-data-unstructured-pick
objective: "1.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An insurance company plans to use the following data sources in an AI project.

    Which two data sources contain unstructured data? (Choose two.)
  fr: |
    Une compagnie d'assurance prévoit d'utiliser les sources de données suivantes dans un projet d'IA.

    Quelles sont les deux sources de données qui contiennent des données non structurées ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A relational table of policies with fixed columns", fr: "Une table relationnelle de polices avec des colonnes fixes" } }
    - { id: b, text: { en: "Photos of damaged vehicles sent with claims", fr: "Des photos de véhicules endommagés envoyées avec les déclarations de sinistre" } }
    - { id: c, text: { en: "A spreadsheet of agents with their region and sales totals", fr: "Une feuille de calcul des agents avec leur région et leurs totaux de ventes" } }
    - { id: d, text: { en: "Transcripts of chats between customers and agents", fr: "Des transcriptions de conversations entre clients et agents" } }
    - { id: e, text: { en: "A table of payments with amount, date, and policy ID", fr: "Une table de paiements avec le montant, la date et l'ID de police" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Unstructured data has no predefined data model. Images, such as photos of damaged vehicles, and free text, such as chat transcripts, are unstructured and usually need preprocessing before an ML model can use them."
    fr: "Les données non structurées n'ont pas de modèle de données prédéfini. Les images, comme les photos de véhicules endommagés, et le texte libre, comme les transcriptions de conversations, sont non structurés et nécessitent généralement un prétraitement avant qu'un modèle de ML puisse les utiliser."
  options:
    a:
      en: "A relational table with fixed columns is structured data."
      fr: "Une table relationnelle avec des colonnes fixes constitue des données structurées."
    c:
      en: "A spreadsheet organized in rows and columns is structured, tabular data."
      fr: "Une feuille de calcul organisée en lignes et en colonnes constitue des données structurées et tabulaires."
    e:
      en: "A payments table with defined fields is structured data."
      fr: "Une table de paiements avec des champs définis constitue des données structurées."
references:
  - title: "Structured Data vs Unstructured Data - Difference Between Collectible Data - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/
