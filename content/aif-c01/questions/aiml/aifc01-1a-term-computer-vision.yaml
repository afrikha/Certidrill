id: aifc01-1a-term-computer-vision
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company wants to analyze photos of products on its assembly line to find scratches and dents automatically.

    Which field of AI addresses this requirement?
  fr: |
    Une entreprise de fabrication veut analyser des photos des produits de sa chaîne d'assemblage pour détecter automatiquement les rayures et les bosses.

    Quel domaine de l'IA répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
    - { id: b, text: { en: "Natural language processing (NLP)", fr: "Traitement du langage naturel (NLP)" } }
    - { id: c, text: { en: "Speech recognition", fr: "Reconnaissance vocale" } }
    - { id: d, text: { en: "Time-series forecasting", fr: "Prévision de séries chronologiques" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Computer vision extracts meaningful information from images and videos, for example by detecting and locating objects or defects in a photo. Inspecting product photos for scratches and dents is a computer vision task."
    fr: "La vision par ordinateur extrait des informations utiles d'images et de vidéos, par exemple en détectant et en localisant des objets ou des défauts sur une photo. L'inspection de photos de produits pour y trouver des rayures et des bosses est une tâche de vision par ordinateur."
  options:
    b:
      en: "NLP interprets and generates human language in text; it does not analyze photos."
      fr: "Le NLP interprète et génère du langage humain sous forme de texte ; il n'analyse pas de photos."
    c:
      en: "Speech recognition converts spoken audio to text; the input here is images."
      fr: "La reconnaissance vocale convertit l'audio parlé en texte ; l'entrée ici est constituée d'images."
    d:
      en: "Time-series forecasting predicts future values from data ordered in time, such as daily sales; it does not inspect images."
      fr: "La prévision de séries chronologiques prédit des valeurs futures à partir de données ordonnées dans le temps, comme des ventes quotidiennes ; elle n'inspecte pas d'images."
references:
  - title: "What is Computer Vision? - Image recognition AI/ML Explained - AWS"
    url: https://aws.amazon.com/what-is/computer-vision/
