id: aifc01-1c-prod-billing-models
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company compares two ways to run the same open-weight model in production: on-demand inference in Amazon Bedrock, or hosting the model on an Amazon SageMaker AI real-time endpoint.

    Which statement correctly describes how each option is billed?
  fr: |
    Une entreprise compare deux façons d'exécuter le même modèle à pondérations ouvertes en production : l'inférence à la demande dans Amazon Bedrock, ou l'hébergement du modèle sur un point de terminaison en temps réel Amazon SageMaker AI.

    Quelle affirmation décrit correctement la facturation de chaque option ?
body:
  options:
    - { id: a, text: { en: "Both options are billed per input and output token.", fr: "Les deux options sont facturées par jeton d'entrée et de sortie." } }
    - { id: b, text: { en: "Bedrock bills for each hour the model runs; the endpoint bills per token.", fr: "Bedrock facture chaque heure d'exécution du modèle ; le point de terminaison facture par jeton." } }
    - { id: c, text: { en: "Bedrock bills per token processed; the endpoint bills for instance time while it runs.", fr: "Bedrock facture les jetons traités ; le point de terminaison facture le temps d'instance tant qu'il fonctionne." } }
    - { id: d, text: { en: "Both options are billed for instance time, even when no requests arrive.", fr: "Les deux options sont facturées au temps d'instance, même en l'absence de requêtes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Bedrock on-demand inference is charged per input and output token, so cost follows usage. A SageMaker AI real-time endpoint is charged for the instances that the company chooses, for as long as they run, even when traffic is low."
    fr: "L'inférence à la demande de Bedrock est facturée par jeton d'entrée et de sortie : le coût suit l'usage. Un point de terminaison en temps réel SageMaker AI est facturé pour les instances choisies par l'entreprise, tant qu'elles fonctionnent, même quand le trafic est faible."
  options:
    a:
      en: "Token-based pricing applies to Bedrock on-demand, not to a SageMaker AI endpoint, which is billed by instance usage."
      fr: "La tarification par jeton s'applique à Bedrock à la demande, pas à un point de terminaison SageMaker AI, facturé à l'usage des instances."
    b:
      en: "This reverses the two models: hourly billing applies to the endpoint instances, and per-token billing to Bedrock on-demand."
      fr: "Cette réponse inverse les deux modèles : la facturation horaire s'applique aux instances du point de terminaison, et la facturation par jeton à Bedrock à la demande."
    d:
      en: "Bedrock on-demand has no instances to pay for; idle time is not charged."
      fr: "Bedrock à la demande n'a pas d'instances à payer ; le temps d'inactivité n'est pas facturé."
references:
  - title: Amazon Bedrock Pricing
    url: https://aws.amazon.com/bedrock/pricing/
  - title: Amazon SageMaker AI pricing
    url: https://aws.amazon.com/sagemaker/ai/pricing/
