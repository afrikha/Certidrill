id: aifc01-1c-mlops-autoscaling
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A streaming company hosts a recommendation model on an Amazon SageMaker AI real-time endpoint. The endpoint receives ten times more requests during evening peaks than at night. The company must keep latency low during peaks and avoid paying for unused instances at night.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de streaming héberge un modèle de recommandation sur un point de terminaison en temps réel Amazon SageMaker AI. Le point de terminaison reçoit dix fois plus de requêtes aux pics du soir que la nuit. L'entreprise doit garder une faible latence pendant les pics et éviter de payer des instances inutilisées la nuit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Provision a fixed number of instances sized for the evening peak.", fr: "Provisionner un nombre fixe d'instances dimensionné pour le pic du soir." } }
    - { id: b, text: { en: "Replace the endpoint with a nightly batch transform job.", fr: "Remplacer le point de terminaison par une tâche de transformation par lots chaque nuit." } }
    - { id: c, text: { en: "Configure automatic scaling of the endpoint's instance count.", fr: "Configurer la mise à l'échelle automatique du nombre d'instances du point de terminaison." } }
    - { id: d, text: { en: "Retrain the model more often with the latest data.", fr: "Réentraîner le modèle plus souvent avec les données les plus récentes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Scalable systems are a core MLOps concept. Automatic scaling of a SageMaker AI model adds instances when the workload rises and removes them when it falls, so the endpoint keeps up with peaks and the company does not pay for idle capacity at night."
    fr: "Les systèmes pouvant être mis à l'échelle sont un concept central du MLOps. La mise à l'échelle automatique d'un modèle SageMaker AI ajoute des instances quand la charge augmente et les retire quand elle baisse : le point de terminaison suit les pics et l'entreprise ne paie pas de capacité inactive la nuit."
  options:
    a:
      en: "A fixed fleet sized for the peak keeps latency low, but the company pays for unused instances at night."
      fr: "Une flotte fixe dimensionnée pour le pic garde une faible latence, mais l'entreprise paie des instances inutilisées la nuit."
    b:
      en: "A nightly batch job cannot answer live requests from viewers during the evening."
      fr: "Une tâche par lots nocturne ne peut pas répondre aux requêtes en direct des spectateurs le soir."
    d:
      en: "Retraining changes the model's quality, not the capacity available for traffic peaks."
      fr: "Le réentraînement change la qualité du modèle, pas la capacité disponible pour les pics de trafic."
references:
  - title: Automatic scaling of Amazon SageMaker AI models
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/endpoint-auto-scaling.html
