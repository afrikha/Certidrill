id: aifc01-1b-notml-no-history
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bakery chain will launch a new seasonal cake next week. It has never sold this product or a similar one, and it has no sales data for it. The operations manager asks for an ML model that predicts how many cakes each store will sell during the launch week. Why is ML NOT appropriate for this request at this time?
  fr: |
    Une chaîne de boulangeries lancera un nouveau gâteau saisonnier la semaine prochaine. Elle n'a jamais vendu ce produit ni un produit similaire, et ne dispose d'aucune donnée de vente le concernant. Le responsable des opérations demande un modèle de ML qui prédit combien de gâteaux chaque magasin vendra pendant la semaine de lancement. Pourquoi le ML n'est-il PAS approprié pour cette demande pour le moment ?
body:
  options:
    - id: a
      text: { en: "There is no relevant historical data from which a model could learn sales patterns.", fr: "Il n'existe aucune donnée historique pertinente à partir de laquelle un modèle pourrait apprendre les tendances de vente." }
    - id: b
      text: { en: "Sales quantities are numeric values, and ML models can predict only categories.", fr: "Les quantités vendues sont des valeurs numériques, et les modèles de ML ne prédisent que des catégories." }
    - id: c
      text: { en: "Demand prediction requires unsupervised learning, which needs unstructured data.", fr: "La prédiction de la demande exige un apprentissage non supervisé, qui nécessite des données non structurées." }
    - id: d
      text: { en: "Store-level predictions require a separate foundation model for each store.", fr: "Des prédictions par magasin exigent un modèle de fondation distinct pour chaque magasin." }
answer: { optionId: a }
explanation:
  correct:
    en: "An ML model learns patterns from enough relevant, high-quality training data. With no sales history for the product or a comparable one, there is nothing to learn from, so a model would not be better than a planner's estimate. ML becomes an option after the company collects sales data."
    fr: "Un modèle de ML apprend des tendances à partir de données d'entraînement pertinentes, de qualité et en quantité suffisante. Sans historique de ventes pour ce produit ou un produit comparable, il n'y a rien à apprendre : un modèle ne ferait pas mieux que l'estimation d'un planificateur. Le ML deviendra une option quand l'entreprise aura collecté des données de vente."
  options:
    b:
      en: "Regression models predict numeric values such as quantities; the problem is the lack of data, not the type of output."
      fr: "Les modèles de régression prédisent des valeurs numériques comme des quantités ; le problème est le manque de données, pas le type de sortie."
    c:
      en: "Predicting a quantity from labeled history is supervised learning, and sales data is structured; neither point explains the issue."
      fr: "Prédire une quantité à partir d'un historique étiqueté relève de l'apprentissage supervisé, et les données de vente sont structurées ; aucun de ces points n'explique le problème."
    d:
      en: "One model can make predictions for many stores; foundation models are not needed for numeric demand prediction."
      fr: "Un seul modèle peut faire des prédictions pour de nombreux magasins ; les modèles de fondation ne sont pas nécessaires pour une prédiction numérique de la demande."
references:
  - title: "Business goal identification - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/business-goal-identification.html
