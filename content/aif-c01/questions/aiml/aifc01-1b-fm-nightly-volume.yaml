id: aifc01-1b-fm-nightly-volume
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketplace must assign each of 50 million new product listings to one of 40 categories every night. The categories never change, the company has millions of correctly categorized past listings, and the main constraint is a low cost per prediction. Which approach is MOST cost-effective?
  fr: |
    Une place de marché doit affecter chaque nuit chacune de 50 millions de nouvelles annonces produits à l'une de 40 catégories. Les catégories ne changent jamais, l'entreprise dispose de millions d'anciennes annonces correctement catégorisées, et la principale contrainte est un faible coût par prédiction. Quelle approche est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Send each listing to a large foundation model on demand and ask it to choose a category.", fr: "Envoyer chaque annonce à un grand modèle de fondation à la demande et lui demander de choisir une catégorie." }
    - id: b
      text: { en: "Train a traditional text classification model on the past listings and run it in batch.", fr: "Entraîner un modèle de classification de texte traditionnel sur les anciennes annonces et l'exécuter par lots." }
    - id: c
      text: { en: "Fine-tune a large foundation model on the past listings and call it for each listing.", fr: "Effectuer un réglage précis (fine-tuning) d'un grand modèle de fondation sur les anciennes annonces et l'appeler pour chaque annonce." }
    - id: d
      text: { en: "Use a knowledge base that retrieves similar listings for a foundation model to compare.", fr: "Utiliser une base de connaissances qui récupère des annonces similaires qu'un modèle de fondation compare." }
answer: { optionId: b }
explanation:
  correct:
    en: "The task is a fixed, narrow classification with abundant labeled data, which is what traditional ML models are built for. A trained classifier is small and fast, so running it in batch on 50 million listings costs far less than paying for the input and output tokens of an FM call for every listing."
    fr: "La tâche est une classification fixe et ciblée, avec de nombreuses données étiquetées : c'est précisément ce pour quoi les modèles de ML traditionnels sont conçus. Un classifieur entraîné est petit et rapide : l'exécuter par lots sur 50 millions d'annonces coûte bien moins cher que de payer les jetons d'entrée et de sortie d'un appel de FM pour chaque annonce."
  options:
    a:
      en: "An FM can classify text from a prompt, but token-based charges for 50 million calls every night make it far more expensive than a small classifier."
      fr: "Un FM peut classer du texte à partir d'une invite, mais la facturation au jeton de 50 millions d'appels chaque nuit le rend bien plus coûteux qu'un petit classifieur."
    c:
      en: "Fine-tuning improves an FM for the task, but it adds training cost and every prediction still runs on a large model."
      fr: "Le réglage précis améliore un FM pour la tâche, mais il ajoute un coût d'entraînement et chaque prédiction s'exécute toujours sur un grand modèle."
    d:
      en: "Retrieval adds a search step and longer prompts to every FM call, which increases the cost per prediction."
      fr: "La récupération ajoute une étape de recherche et des invites plus longues à chaque appel de FM, ce qui augmente le coût par prédiction."
references:
  - title: "Data differences between generative AI and traditional ML"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-data-considerations-gen-ai/differences.html
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
