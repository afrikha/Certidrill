id: aifc01-1a-value-moderation-scale
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A social media company receives about 5 million uploaded images each day, and its human moderators cannot review them quickly enough. The company plans to use Amazon Rekognition content moderation to flag inappropriate images so that moderators review only the flagged images.

    What is the MAIN benefit of using ML in this solution?
  fr: |
    Une entreprise de réseaux sociaux reçoit environ 5 millions d'images chargées chaque jour, et ses modérateurs humains ne peuvent pas les examiner assez vite. L'entreprise prévoit d'utiliser la modération de contenu d'Amazon Rekognition pour signaler les images inappropriées, afin que les modérateurs n'examinent que les images signalées.

    Quel est le PRINCIPAL avantage de l'utilisation du ML dans cette solution ?
body:
  options:
    - { id: a, text: { en: "Review covers the full upload volume, and people check only a small flagged share.", fr: "L'examen couvre tout le volume chargé, et les personnes ne vérifient qu'une petite part signalée." } }
    - { id: b, text: { en: "Every image is reviewed by a person before it is published on the platform.", fr: "Chaque image est examinée par une personne avant d'être publiée sur la plateforme." } }
    - { id: c, text: { en: "The model writes the moderation policy, so the company no longer needs one.", fr: "Le modèle rédige la politique de modération : l'entreprise n'en a plus besoin." } }
    - { id: d, text: { en: "The uploaded images take less storage space after they are analyzed.", fr: "Les images chargées occupent moins d'espace de stockage une fois analysées." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Human moderators alone cannot scale to millions of images at sufficient speed and quality. With ML moderation, every image is analyzed automatically and humans review a much smaller set of flagged content (AWS cites typically 1–5% of the volume), which makes the solution scalable at a fraction of the cost."
    fr: "Les modérateurs humains seuls ne peuvent pas traiter des millions d'images avec une rapidité et une qualité suffisantes. Avec la modération par ML, chaque image est analysée automatiquement et les humains examinent un ensemble bien plus petit de contenus signalés (AWS cite généralement 1 à 5 % du volume) : la solution devient évolutive pour une fraction du coût."
  options:
    b:
      en: "In this design, people review only the flagged images, not every upload."
      fr: "Dans cette conception, les personnes n'examinent que les images signalées, pas chaque chargement."
    c:
      en: "The company still defines what content is acceptable; the model detects content that matches moderation labels."
      fr: "L'entreprise définit toujours le contenu acceptable ; le modèle détecte le contenu qui correspond aux étiquettes de modération."
    d:
      en: "Content moderation analyzes images; it does not compress them or reduce storage."
      fr: "La modération de contenu analyse les images ; elle ne les compresse pas et ne réduit pas le stockage."
references:
  - title: "Moderating content - Amazon Rekognition"
    url: https://docs.aws.amazon.com/rekognition/latest/dg/moderation.html
