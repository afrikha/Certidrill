id: aifc01-1c-src-bedrock-marketplace
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company needs a specialized foundation model (FM) that is not among the serverless models of Amazon Bedrock. The company has not customized the model. Its application must call the model through the Amazon Bedrock Converse API and apply Amazon Bedrock Guardrails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias a besoin d'un modèle de fondation (FM) spécialisé qui ne fait pas partie des modèles sans serveur d'Amazon Bedrock. L'entreprise n'a pas personnalisé ce modèle. Son application doit appeler le modèle avec l'API Converse d'Amazon Bedrock et appliquer Amazon Bedrock Guardrails.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Subscribe to the model in Amazon Bedrock Marketplace and deploy it to a SageMaker AI managed endpoint.", fr: "S'abonner au modèle dans Amazon Bedrock Marketplace et le déployer sur un point de terminaison géré par SageMaker AI." } }
    - { id: b, text: { en: "Purchase Provisioned Throughput for the model in Amazon Bedrock with a one-month commitment.", fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle dans Amazon Bedrock avec un engagement d'un mois." } }
    - { id: c, text: { en: "Deploy the model from SageMaker JumpStart and invoke the SageMaker AI endpoint directly.", fr: "Déployer le modèle depuis SageMaker JumpStart et appeler directement le point de terminaison SageMaker AI." } }
    - { id: d, text: { en: "Upload the model weights to an Amazon Bedrock knowledge base as a data source.", fr: "Charger les pondérations du modèle dans une base de connaissances Amazon Bedrock comme source de données." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock Marketplace is a catalog of more than 100 additional FMs. The company subscribes to a model, deploys it to an endpoint managed by SageMaker AI, then calls it through the Bedrock InvokeModel or Converse operations, so it works with Bedrock tools such as Guardrails and Knowledge Bases."
    fr: "Amazon Bedrock Marketplace est un catalogue de plus de 100 FM supplémentaires. L'entreprise s'abonne à un modèle, le déploie sur un point de terminaison géré par SageMaker AI, puis l'appelle avec les opérations InvokeModel ou Converse de Bedrock : il fonctionne alors avec les outils de Bedrock comme Guardrails et Knowledge Bases."
  options:
    b:
      en: "Provisioned Throughput buys capacity for models that Bedrock already offers or for custom models; it does not add a model that Bedrock does not offer."
      fr: "Le débit provisionné achète de la capacité pour des modèles que Bedrock propose déjà ou pour des modèles personnalisés ; il n'ajoute pas un modèle que Bedrock ne propose pas."
    c:
      en: "A JumpStart endpoint is called through the SageMaker AI runtime, not through the Bedrock Converse API that the application must use."
      fr: "Un point de terminaison JumpStart est appelé par le runtime SageMaker AI, et non par l'API Converse de Bedrock que l'application doit utiliser."
    d:
      en: "A knowledge base stores documents for retrieval-augmented generation; it cannot host or run a model."
      fr: "Une base de connaissances stocke des documents pour la génération augmentée par récupération ; elle ne peut ni héberger ni exécuter un modèle."
references:
  - title: Amazon Bedrock Marketplace
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/amazon-bedrock-marketplace.html
