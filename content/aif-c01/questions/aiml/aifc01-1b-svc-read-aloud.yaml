id: aifc01-1b-svc-read-aloud
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A news publisher wants to add a "Listen to this article" button to its website. When a reader selects the button, the article text must be read aloud in a natural-sounding voice. Which AWS service will meet this requirement?
  fr: |
    Un éditeur de presse souhaite ajouter un bouton « Écouter cet article » à son site web. Quand un lecteur sélectionne le bouton, le texte de l'article doit être lu à voix haute avec une voix naturelle. Quel service AWS répond à cette exigence ?
body:
  options:
    - id: a
      text: "Amazon Polly"
    - id: b
      text: "Amazon Transcribe"
    - id: c
      text: "Amazon Lex"
    - id: d
      text: "Amazon Rekognition"
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Polly is a text-to-speech service that converts text into lifelike speech, with generative, long-form, neural and standard voices. Newsreader and accessibility applications are typical Polly use cases, and the publisher pays only for the text that it synthesizes."
    fr: "Amazon Polly est un service de synthèse vocale qui convertit du texte en parole naturelle, avec des voix generative, long-form, neural et standard. Les lecteurs d'actualités et les applications d'accessibilité sont des cas d'usage typiques de Polly, et l'éditeur ne paie que pour le texte qu'il synthétise."
  options:
    b:
      en: "Amazon Transcribe converts speech to text; the requirement is to turn text into speech."
      fr: "Amazon Transcribe convertit la parole en texte ; l'exigence est de transformer du texte en parole."
    c:
      en: "Amazon Lex builds conversational bots that understand user intents; reading an article aloud needs no conversation."
      fr: "Amazon Lex crée des bots conversationnels qui comprennent les intentions des utilisateurs ; lire un article à voix haute ne demande aucune conversation."
    d:
      en: "Amazon Rekognition analyzes images and videos; it does not generate speech."
      fr: "Amazon Rekognition analyse des images et des vidéos ; il ne génère pas de parole."
references:
  - title: "What Is Amazon Polly?"
    url: https://docs.aws.amazon.com/polly/latest/dg/what-is.html
