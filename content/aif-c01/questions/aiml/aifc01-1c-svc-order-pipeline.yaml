id: aifc01-1c-svc-order-pipeline
objective: "1.3.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company is building its first ML pipeline on AWS for a model that predicts machine failures from sensor data.

    Select the five steps the company should perform and arrange them in the correct order.
  fr: |
    Une entreprise industrielle crée son premier pipeline de ML sur AWS pour un modèle qui prédit les pannes de machines à partir de données de capteurs.

    Sélectionnez les cinq étapes que l'entreprise doit réaliser et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: train, text: { en: "Train the model with an Amazon SageMaker AI training job.", fr: "Entraîner le modèle avec une tâche d'entraînement Amazon SageMaker AI." } }
    - { id: store, text: { en: "Collect the raw sensor data in an Amazon S3 bucket.", fr: "Collecter les données brutes des capteurs dans un compartiment Amazon S3." } }
    - { id: pt, text: { en: "Purchase Provisioned Throughput for the model in Amazon Bedrock.", fr: "Acheter du débit provisionné pour le modèle dans Amazon Bedrock." } }
    - { id: monitor, text: { en: "Monitor the endpoint metrics in Amazon CloudWatch.", fr: "Superviser les métriques du point de terminaison dans Amazon CloudWatch." } }
    - { id: prep, text: { en: "Clean and normalize the data with AWS Glue DataBrew.", fr: "Nettoyer et normaliser les données avec AWS Glue DataBrew." } }
    - { id: guard, text: { en: "Apply Amazon Bedrock Guardrails to the sensor data.", fr: "Appliquer Amazon Bedrock Guardrails aux données des capteurs." } }
    - { id: deploy, text: { en: "Deploy the model to an Amazon SageMaker AI real-time endpoint.", fr: "Déployer le modèle sur un point de terminaison en temps réel Amazon SageMaker AI." } }
answer:
  sequence: [ store, prep, train, deploy, monitor ]
explanation:
  correct:
    en: "The pipeline starts by collecting data in Amazon S3, then prepares it with DataBrew. SageMaker AI trains the model on the prepared data and hosts it on an endpoint, and CloudWatch monitors the endpoint once it serves predictions."
    fr: "Le pipeline commence par la collecte des données dans Amazon S3, puis les prépare avec DataBrew. SageMaker AI entraîne le modèle sur les données préparées et l'héberge sur un point de terminaison, et CloudWatch supervise le point de terminaison dès qu'il sert des prédictions."
  options:
    pt:
      en: "Provisioned Throughput reserves capacity for models in Amazon Bedrock; this custom model is hosted on SageMaker AI."
      fr: "Le débit provisionné réserve de la capacité pour des modèles d'Amazon Bedrock ; ce modèle personnalisé est hébergé sur SageMaker AI."
    guard:
      en: "Guardrails filter the prompts and responses of generative AI applications; they do not prepare sensor data for training."
      fr: "Guardrails filtre les invites et les réponses des applications d'IA générative ; il ne prépare pas les données de capteurs pour l'entraînement."
references:
  - title: What is AWS Glue DataBrew?
    url: https://docs.aws.amazon.com/databrew/latest/dg/what-is.html
  - title: Deploy models for inference
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model.html
