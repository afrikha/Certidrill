id: aifc01-1a-learn-supervised-examples
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A consulting company is classifying its clients' ML projects by type of learning.

    Which two projects use supervised learning? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une société de conseil classe les projets de ML de ses clients par type d'apprentissage.

    Quels sont les deux projets qui utilisent l'apprentissage supervisé ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grouping news articles by topic when no topics have been defined", fr: "Regrouper des articles d'actualité par sujet alors qu'aucun sujet n'a été défini" } }
    - { id: b, text: { en: "Estimating house prices from past sales with their final sale prices", fr: "Estimer le prix des maisons à partir des ventes passées et de leur prix de vente final" } }
    - { id: c, text: { en: "Finding products that customers often buy together in shopping baskets", fr: "Trouver les produits que les clients achètent souvent ensemble dans leurs paniers" } }
    - { id: d, text: { en: "Teaching a robot arm to grasp objects through rewards for each attempt", fr: "Apprendre à un bras robotisé à saisir des objets grâce à des récompenses pour chaque tentative" } }
    - { id: e, text: { en: "Routing support tickets to teams by using tickets already tagged with a team", fr: "Acheminer les tickets de support vers les équipes à l'aide de tickets déjà balisés avec une équipe" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Supervised learning trains on labeled data in which each input has a known output. Past sales with their final prices are labeled data for regression, and tickets already tagged with a team are labeled data for classification."
    fr: "L'apprentissage supervisé s'entraîne sur des données étiquetées dans lesquelles chaque entrée a une sortie connue. Les ventes passées avec leur prix final sont des données étiquetées pour une régression, et les tickets déjà balisés avec une équipe sont des données étiquetées pour une classification."
  options:
    a:
      en: "Grouping articles without predefined topics is clustering, an unsupervised technique."
      fr: "Regrouper des articles sans sujets prédéfinis relève du clustering, une technique non supervisée."
    c:
      en: "Finding items bought together uses association rules, an unsupervised technique."
      fr: "Trouver les articles achetés ensemble utilise des règles d'association, une technique non supervisée."
    d:
      en: "Learning from rewards for each attempt is reinforcement learning."
      fr: "Apprendre à partir de récompenses pour chaque tentative relève de l'apprentissage par renforcement."
references:
  - title: "Supervised vs Unsupervised Learning - Difference Between Machine Learning Algorithms - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-machine-learning-supervised-and-unsupervised/
