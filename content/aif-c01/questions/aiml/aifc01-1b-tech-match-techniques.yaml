id: aifc01-1b-tech-match-techniques
objective: "1.2.3"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    A manufacturing company is planning four ML projects.

    Match each project with the ML technique that it requires.

    To answer, drag the appropriate technique to each project. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise industrielle prévoit quatre projets de ML.

    Associez chaque projet à la technique de ML qu'il nécessite.

    Pour répondre, faites glisser la technique appropriée vers chaque projet. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reg, text: { en: "Regression", fr: "Régression" } }
    - { id: cls, text: { en: "Classification", fr: "Classification" } }
    - { id: clu, text: { en: "Clustering", fr: "Clustering" } }
    - { id: fc, text: { en: "Time-series forecasting", fr: "Prévision de séries chronologiques" } }
    - { id: rl, text: { en: "Reinforcement learning", fr: "Apprentissage par renforcement" } }
    - { id: dr, text: { en: "Dimensionality reduction", fr: "Réduction de dimensionnalité" } }
  targets:
    - id: t1
      text: { en: "Estimate the remaining useful life, in operating hours, of each motor from its labeled maintenance records.", fr: "Estimer la durée de vie restante, en heures de fonctionnement, de chaque moteur à partir de ses dossiers de maintenance étiquetés." }
    - id: t2
      text: { en: "Decide whether each part on the line is defective, using photos that inspectors labeled as defective or good.", fr: "Déterminer si chaque pièce de la ligne est défectueuse, à l'aide de photos que des inspecteurs ont étiquetées comme défectueuses ou bonnes." }
    - id: t3
      text: { en: "Discover groups of suppliers with similar delivery behavior when no supplier categories exist yet.", fr: "Découvrir des groupes de fournisseurs au comportement de livraison similaire alors qu'aucune catégorie de fournisseurs n'existe encore." }
    - id: t4
      text: { en: "Predict the weekly demand for spare parts over the next quarter from five years of weekly orders.", fr: "Prédire la demande hebdomadaire de pièces détachées sur le prochain trimestre à partir de cinq ans de commandes hebdomadaires." }
answer:
  mapping: { t1: reg, t2: cls, t3: clu, t4: fc }
explanation:
  correct:
    en: "A number of operating hours is a continuous value learned from labeled records: regression. Defective or good is a category learned from labeled photos: classification. Finding groups without predefined categories is unsupervised clustering. Predicting future values of a series from its history, with its trends and seasonality, is time-series forecasting."
    fr: "Un nombre d'heures de fonctionnement est une valeur continue apprise à partir de dossiers étiquetés : régression. Défectueuse ou bonne est une catégorie apprise à partir de photos étiquetées : classification. Trouver des groupes sans catégories prédéfinies relève du clustering non supervisé. Prédire les valeurs futures d'une série à partir de son historique, avec ses tendances et sa saisonnalité, relève de la prévision de séries chronologiques."
  options:
    rl:
      en: "Reinforcement learning trains an agent through rewards for actions in an environment; none of the projects learns from rewards."
      fr: "L'apprentissage par renforcement entraîne un agent grâce à des récompenses pour ses actions dans un environnement ; aucun des projets n'apprend à partir de récompenses."
    dr:
      en: "Dimensionality reduction reduces the number of features during data preparation; it does not produce any of the required predictions."
      fr: "La réduction de dimensionnalité réduit le nombre de caractéristiques pendant la préparation des données ; elle ne produit aucune des prédictions demandées."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
