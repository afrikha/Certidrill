id: aifc01-1c-svc-stage-match
objective: "1.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is mapping the stages of its AI/ML pipeline to AWS services.

    Match each pipeline task with the correct AWS service. Each service can be used once or not at all.
  fr: |
    Une entreprise associe les étapes de son pipeline d'IA/de ML à des services AWS.

    Associez chaque tâche du pipeline au service AWS correct. Chaque service peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: s3, text: "Amazon S3" }
    - { id: sm, text: "Amazon SageMaker AI" }
    - { id: br, text: "Amazon Bedrock" }
    - { id: cw, text: "Amazon CloudWatch" }
    - { id: db, text: "AWS Glue DataBrew" }
    - { id: kiro, text: "Kiro" }
  targets:
    - id: t1
      text: { en: "Store the raw training data durably at low cost", fr: "Stocker durablement et à faible coût les données d'entraînement brutes" }
    - id: t2
      text: { en: "Train and host a custom model on labeled data", fr: "Entraîner et héberger un modèle personnalisé sur des données étiquetées" }
    - id: t3
      text: { en: "Generate text with a foundation model through a managed API", fr: "Générer du texte avec un modèle de fondation par une API gérée" }
    - id: t4
      text: { en: "Track endpoint latency and invocation errors and raise alarms", fr: "Suivre la latence et les erreurs d'appel d'un point de terminaison et déclencher des alarmes" }
answer:
  mapping: { t1: s3, t2: sm, t3: br, t4: cw }
explanation:
  correct:
    en: "Amazon S3 is the usual store for raw training data and model artifacts. SageMaker AI builds, trains and deploys custom models. Amazon Bedrock gives managed API access to foundation models. CloudWatch collects endpoint metrics such as ModelLatency and Invocation5XXErrors and can raise alarms."
    fr: "Amazon S3 est le stockage habituel des données d'entraînement brutes et des artefacts de modèle. SageMaker AI crée, entraîne et déploie des modèles personnalisés. Amazon Bedrock donne un accès par API gérée aux modèles de fondation. CloudWatch collecte des métriques de point de terminaison comme ModelLatency et Invocation5XXErrors et peut déclencher des alarmes."
  options:
    db:
      en: "DataBrew belongs to data preparation (cleaning and normalizing), which none of the tasks describe."
      fr: "DataBrew relève de la préparation des données (nettoyage et normalisation), qu'aucune tâche ne décrit."
    kiro:
      en: "Kiro helps developers write code and tests; it does not store, train, generate or monitor in the pipeline."
      fr: "Kiro aide les développeurs à écrire du code et des tests ; il ne stocke, n'entraîne, ne génère ni ne supervise dans le pipeline."
references:
  - title: What is Amazon SageMaker AI?
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html
  - title: Amazon SageMaker AI metrics in Amazon CloudWatch
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/monitoring-cloudwatch.html
