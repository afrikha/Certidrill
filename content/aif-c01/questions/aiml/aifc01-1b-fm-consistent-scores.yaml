id: aifc01-1b-fm-consistent-scores
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurer wants to score the risk of each property insurance application from 30 structured fields. Underwriters must get the same score every time they score the same application, and the insurer has 10 years of labeled policies and claims. A team member suggests sending the fields to a foundation model in a prompt and asking for a score. Which approach should the insurer choose?
  fr: |
    Un assureur souhaite attribuer un score de risque à chaque demande d'assurance habitation à partir de 30 champs structurés. Les souscripteurs doivent obtenir le même score chaque fois qu'ils évaluent la même demande, et l'assureur dispose de 10 ans de polices et de sinistres étiquetés. Un membre de l'équipe propose d'envoyer les champs à un modèle de fondation dans une invite et de lui demander un score. Quelle approche l'assureur doit-il choisir ?
body:
  options:
    - id: a
      text: { en: "Send the fields to the foundation model with a longer prompt that explains the scoring rules.", fr: "Envoyer les champs au modèle de fondation avec une invite plus longue qui explique les règles de notation." }
    - id: b
      text: { en: "Send the fields to the foundation model several times and keep the average of the scores.", fr: "Envoyer les champs au modèle de fondation plusieurs fois et conserver la moyenne des scores." }
    - id: c
      text: { en: "Train a traditional supervised model on the labeled policies and use it to score applications.", fr: "Entraîner un modèle supervisé traditionnel sur les polices étiquetées et l'utiliser pour noter les demandes." }
    - id: d
      text: { en: "Use a knowledge base so that the foundation model retrieves similar policies before scoring.", fr: "Utiliser une base de connaissances pour que le modèle de fondation récupère des polices similaires avant de noter." }
answer: { optionId: c }
explanation:
  correct:
    en: "Foundation models generate responses by sampling, so the same prompt can produce different outputs; nondeterminism is a known limitation of generative AI. A traditional model trained on the labeled history returns the same score for the same input, learns directly from the insurer's outcomes, and is cheaper to run on structured data."
    fr: "Les modèles de fondation génèrent leurs réponses par échantillonnage : la même invite peut produire des sorties différentes ; le non-déterminisme est une limite connue de l'IA générative. Un modèle traditionnel entraîné sur l'historique étiqueté renvoie le même score pour la même entrée, apprend directement des résultats de l'assureur et coûte moins cher à exécuter sur des données structurées."
  options:
    a:
      en: "A longer prompt can improve the answer, but it does not make the generated score repeatable or based on the labeled history."
      fr: "Une invite plus longue peut améliorer la réponse, mais elle ne rend pas le score généré reproductible ni fondé sur l'historique étiqueté."
    b:
      en: "Averaging several calls multiplies the cost and still does not guarantee an identical score for each request."
      fr: "Faire la moyenne de plusieurs appels multiplie le coût et ne garantit toujours pas un score identique à chaque demande."
    d:
      en: "Retrieving similar policies adds context, but the score is still generated by the FM and can vary; it does not use the labeled data as training data."
      fr: "Récupérer des polices similaires ajoute du contexte, mais le score reste généré par le FM et peut varier ; les données étiquetées ne servent pas de données d'entraînement."
references:
  - title: "Data differences between generative AI and traditional ML"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-data-considerations-gen-ai/differences.html
