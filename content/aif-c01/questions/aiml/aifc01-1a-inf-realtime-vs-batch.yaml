id: aifc01-1a-inf-realtime-vs-batch
objective: "1.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A retail company is deciding between real-time inference and batch inference for several ML workloads.

    Which two statements correctly describe these inference types? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de vente au détail hésite entre l'inférence en temps réel et l'inférence par lots pour plusieurs charges de travail de ML.

    Quelles sont les deux affirmations qui décrivent correctement ces types d'inférence ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Batch inference requires an endpoint that runs continuously between jobs.", fr: "L'inférence par lots exige un point de terminaison qui s'exécute en permanence entre les tâches." } }
    - { id: b, text: { en: "Real-time inference is the best choice when results are needed only the next day.", fr: "L'inférence en temps réel est le meilleur choix lorsque les résultats ne sont nécessaires que le lendemain." } }
    - { id: c, text: { en: "Real-time inference returns a prediction for each request as the request arrives.", fr: "L'inférence en temps réel renvoie une prédiction pour chaque requête dès son arrivée." } }
    - { id: d, text: { en: "Batch inference trains the model, and real-time inference runs the trained model.", fr: "L'inférence par lots entraîne le modèle, et l'inférence en temps réel exécute le modèle entraîné." } }
    - { id: e, text: { en: "Batch inference processes a whole set of records as a job and stores the results.", fr: "L'inférence par lots traite un ensemble complet d'enregistrements sous forme de tâche et stocke les résultats." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Real-time inference serves interactive requests with low latency: each request gets its prediction immediately. Batch inference runs a job over a full dataset, such as files in Amazon S3, and writes the predictions to storage, without a persistent endpoint."
    fr: "L'inférence en temps réel sert des requêtes interactives à faible latence : chaque requête reçoit sa prédiction immédiatement. L'inférence par lots exécute une tâche sur un jeu de données complet, comme des fichiers dans Amazon S3, et écrit les prédictions dans un stockage, sans point de terminaison permanent."
  options:
    a:
      en: "Batch inference is used when no persistent endpoint is needed; compute runs only for the duration of the job."
      fr: "L'inférence par lots s'utilise lorsqu'aucun point de terminaison permanent n'est nécessaire ; la capacité de calcul ne s'exécute que pendant la durée de la tâche."
    b:
      en: "When results can wait until the next day, a batch job avoids paying for an endpoint that runs all the time."
      fr: "Lorsque les résultats peuvent attendre le lendemain, une tâche par lots évite de payer un point de terminaison qui s'exécute en permanence."
    d:
      en: "Both are types of inference: they run an already trained model; neither one trains the model."
      fr: "Les deux sont des types d'inférence : ils exécutent un modèle déjà entraîné ; aucun des deux n'entraîne le modèle."
references:
  - title: "Batch transform for inference with Amazon SageMaker AI - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform.html
  - title: "Real-time inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html
