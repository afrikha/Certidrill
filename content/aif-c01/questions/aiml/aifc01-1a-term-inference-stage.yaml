id: aifc01-1a-term-inference-stage
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A payment company has finished training a fraud detection model. Each time a customer makes a purchase, the application sends the transaction details to the model and receives a fraud risk score.

    What is this use of the model called?
  fr: |
    Une entreprise de paiement a terminé l'entraînement d'un modèle de détection de fraude. Chaque fois qu'un client effectue un achat, l'application envoie les détails de la transaction au modèle et reçoit un score de risque de fraude.

    Comment appelle-t-on cette utilisation du modèle ?
body:
  options:
    - { id: a, text: { en: "Training", fr: "Entraînement" } }
    - { id: b, text: { en: "Data labeling", fr: "Étiquetage des données" } }
    - { id: c, text: { en: "Feature engineering", fr: "Ingénierie des caractéristiques" } }
    - { id: d, text: { en: "Inference", fr: "Inférence" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Inference is the use of a trained model to make predictions on new data. After training, the model is integrated into the application, which sends new inputs (here each transaction) and receives predictions (the fraud risk score)."
    fr: "L'inférence est l'utilisation d'un modèle entraîné pour faire des prédictions sur de nouvelles données. Après l'entraînement, le modèle est intégré à l'application, qui envoie de nouvelles entrées (ici chaque transaction) et reçoit des prédictions (le score de risque de fraude)."
  options:
    a:
      en: "Training is the earlier stage that learns patterns from historical data; the model is already trained."
      fr: "L'entraînement est l'étape antérieure qui apprend des schémas à partir de données historiques ; le modèle est déjà entraîné."
    b:
      en: "Data labeling tags training data with correct answers before training; it does not score live transactions."
      fr: "L'étiquetage des données associe les bonnes réponses aux données d'entraînement avant l'entraînement ; il ne note pas les transactions en direct."
    c:
      en: "Feature engineering selects and transforms input variables to prepare data for training; it does not return predictions."
      fr: "L'ingénierie des caractéristiques sélectionne et transforme les variables d'entrée pour préparer les données d'entraînement ; elle ne renvoie pas de prédictions."
references:
  - title: "Overview of machine learning with Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-mlconcepts.html
