id: aifc01-1a-value-genai-manuals
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Field technicians at an industrial company spend a long time searching 3,000 pages of equipment manuals. The company deploys a generative AI assistant that answers the technicians' questions from the manuals and cites the source pages.

    Which business value does this solution provide?
  fr: |
    Les techniciens de terrain d'une entreprise industrielle passent beaucoup de temps à chercher dans 3 000 pages de manuels d'équipement. L'entreprise déploie un assistant d'IA générative qui répond aux questions des techniciens à partir des manuels et cite les pages sources.

    Quelle valeur métier cette solution apporte-t-elle ?
body:
  options:
    - { id: a, text: { en: "Faster access to relevant information, so technicians spend more time on repairs", fr: "Un accès plus rapide aux informations pertinentes : les techniciens consacrent plus de temps aux réparations" } }
    - { id: b, text: { en: "Manuals that no longer need updates, because the model learns new procedures alone", fr: "Des manuels qui n'ont plus besoin de mises à jour, car le modèle apprend seul les nouvelles procédures" } }
    - { id: c, text: { en: "Answers that are always correct, so technicians never need to check the sources", fr: "Des réponses toujours correctes : les techniciens n'ont jamais besoin de vérifier les sources" } }
    - { id: d, text: { en: "Lower storage costs, because the manuals can be deleted after the model reads them", fr: "Des coûts de stockage réduits, car les manuels peuvent être supprimés une fois lus par le modèle" } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS describes this kind of productivity gain: AI gives knowledge workers fast, contextual access to information so that they can focus on higher-value work. The assistant finds the relevant passages for the technicians instead of making them search thousands of pages."
    fr: "AWS décrit ce type de gain de productivité : l'IA donne aux travailleurs du savoir un accès rapide et contextuel à l'information, afin qu'ils se concentrent sur un travail à plus forte valeur. L'assistant trouve les passages pertinents pour les techniciens au lieu de les obliger à chercher dans des milliers de pages."
  options:
    b:
      en: "The assistant answers from the manuals it is given; when procedures change, the manuals still need to be updated."
      fr: "L'assistant répond à partir des manuels qui lui sont fournis ; lorsque les procédures changent, les manuels doivent toujours être mis à jour."
    c:
      en: "Generative AI outputs can be wrong; citing the source pages lets technicians verify the answers."
      fr: "Les sorties de l'IA générative peuvent être fausses ; citer les pages sources permet aux techniciens de vérifier les réponses."
    d:
      en: "The assistant answers from the manuals and cites their pages, so the manuals must remain available."
      fr: "L'assistant répond à partir des manuels et cite leurs pages : les manuels doivent rester disponibles."
references:
  - title: "What is AI? - Artificial Intelligence Explained - AWS"
    url: https://aws.amazon.com/what-is/artificial-intelligence/
