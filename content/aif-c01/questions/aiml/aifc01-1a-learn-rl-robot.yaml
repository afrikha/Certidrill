id: aifc01-1a-learn-rl-robot
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A warehouse company wants a robot to learn the fastest routes between shelves. The robot tries different routes, receives positive points for fast deliveries and negative points for collisions, and improves its choices over time. No labeled dataset of correct routes exists.

    Which type of learning is this?
  fr: |
    Une entreprise d'entrepôts veut qu'un robot apprenne les itinéraires les plus rapides entre les rayonnages. Le robot essaie différents itinéraires, reçoit des points positifs pour les livraisons rapides et des points négatifs pour les collisions, et améliore ses choix au fil du temps. Il n'existe aucun jeu de données étiqueté d'itinéraires corrects.

    De quel type d'apprentissage s'agit-il ?
body:
  options:
    - { id: a, text: { en: "Supervised learning", fr: "Apprentissage supervisé" } }
    - { id: b, text: { en: "Reinforcement learning", fr: "Apprentissage par renforcement" } }
    - { id: c, text: { en: "Unsupervised learning", fr: "Apprentissage non supervisé" } }
    - { id: d, text: { en: "Self-supervised learning", fr: "Apprentissage autosupervisé" } }
answer: { optionId: b }
explanation:
  correct:
    en: "In reinforcement learning, an agent learns by trial and error in an environment. Each action receives a positive, negative, or zero reward, and the agent learns a policy that maximizes the cumulative reward, without a labeled dataset."
    fr: "Dans l'apprentissage par renforcement, un agent apprend par essais et erreurs dans un environnement. Chaque action reçoit une récompense positive, négative ou nulle, et l'agent apprend une politique qui maximise la récompense cumulée, sans jeu de données étiqueté."
  options:
    a:
      en: "Supervised learning needs labeled input-output pairs, such as known correct routes, which do not exist here."
      fr: "L'apprentissage supervisé a besoin de paires entrée-sortie étiquetées, comme des itinéraires corrects connus, qui n'existent pas ici."
    c:
      en: "Unsupervised learning finds hidden patterns in unlabeled data; it does not learn from rewards for actions."
      fr: "L'apprentissage non supervisé trouve des schémas cachés dans des données non étiquetées ; il n'apprend pas à partir de récompenses attribuées à des actions."
    d:
      en: "Self-supervised learning creates labels from the data itself, as in next-token prediction; the robot learns from rewards instead."
      fr: "L'apprentissage autosupervisé crée des étiquettes à partir des données elles-mêmes, comme dans la prédiction du jeton suivant ; le robot apprend plutôt à partir de récompenses."
references:
  - title: "What is Reinforcement Learning? - Reinforcement Learning Explained - AWS"
    url: https://aws.amazon.com/what-is/reinforcement-learning/
