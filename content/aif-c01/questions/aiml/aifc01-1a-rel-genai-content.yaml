id: aifc01-1a-rel-genai-content
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing team wants a solution that writes first drafts of product descriptions from a short list of product features.

    Which type of AI meets this requirement?
  fr: |
    Une équipe marketing veut une solution qui rédige des premières versions de descriptions de produits à partir d'une courte liste de caractéristiques des produits.

    Quel type d'IA répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "A traditional ML classification model", fr: "Un modèle de classification de ML traditionnel" } }
    - { id: b, text: { en: "Generative AI that uses a foundation model", fr: "L'IA générative qui utilise un modèle de fondation" } }
    - { id: c, text: { en: "An unsupervised clustering model", fr: "Un modèle de clustering non supervisé" } }
    - { id: d, text: { en: "A regression model", fr: "Un modèle de régression" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Generative AI creates new content, such as text, images, audio, or code, from a prompt. A foundation model such as an LLM can write a product description from a list of features."
    fr: "L'IA générative crée du nouveau contenu, comme du texte, des images, de l'audio ou du code, à partir d'une invite. Un modèle de fondation comme un LLM peut rédiger une description de produit à partir d'une liste de caractéristiques."
  options:
    a:
      en: "A classification model assigns an input to a predefined category; it does not write new text."
      fr: "Un modèle de classification affecte une entrée à une catégorie prédéfinie ; il ne rédige pas de nouveau texte."
    c:
      en: "Clustering groups similar items in unlabeled data; it does not generate descriptions."
      fr: "Le clustering regroupe des éléments similaires dans des données non étiquetées ; il ne génère pas de descriptions."
    d:
      en: "Regression predicts a numeric value, such as a price; it does not produce text."
      fr: "La régression prédit une valeur numérique, comme un prix ; elle ne produit pas de texte."
references:
  - title: "What is Generative AI? - Gen AI Explained - AWS"
    url: https://aws.amazon.com/what-is/generative-ai/
