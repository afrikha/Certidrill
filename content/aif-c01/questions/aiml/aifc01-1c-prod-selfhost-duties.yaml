id: aifc01-1c-prod-selfhost-duties
objective: "1.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company decides to self-host an open-source large language model on Amazon EC2 instances instead of calling a model through Amazon Bedrock.

    Which two tasks become the company's responsibility because of this decision? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise décide d'autohéberger un grand modèle de langage open source sur des instances Amazon EC2 au lieu d'appeler un modèle par Amazon Bedrock.

    Quelles sont les deux tâches qui deviennent la responsabilité de l'entreprise du fait de cette décision ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Patching the operating system and the model-serving software.", fr: "Appliquer les correctifs au système d'exploitation et au logiciel de service du modèle." }
    - id: b
      text: { en: "Writing the prompts that the application sends to the model.", fr: "Rédiger les invites que l'application envoie au modèle." }
    - id: c
      text: { en: "Granting IAM permissions to the application that calls the model.", fr: "Accorder des autorisations IAM à l'application qui appelle le modèle." }
    - id: d
      text: { en: "Deciding which business use cases the model supports.", fr: "Décider des cas d'utilisation métier pris en charge par le modèle." }
    - id: e
      text: { en: "Sizing and scaling the GPU instances to match the request volume.", fr: "Dimensionner et mettre à l'échelle les instances GPU selon le volume de requêtes." }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "With a self-hosted API, the company runs the infrastructure: it patches the instances and the serving stack, and it chooses, sizes and scales the GPU instances. With a managed API service such as Bedrock, AWS runs and scales that infrastructure."
    fr: "Avec une API autohébergée, l'entreprise exploite l'infrastructure : elle applique les correctifs aux instances et à la pile de service, et elle choisit, dimensionne et met à l'échelle les instances GPU. Avec un service d'API géré comme Bedrock, AWS exploite et met à l'échelle cette infrastructure."
  options:
    b:
      en: "The company writes its prompts with either option; this is not a consequence of self-hosting."
      fr: "L'entreprise rédige ses invites avec l'une ou l'autre option ; ce n'est pas une conséquence de l'autohébergement."
    c:
      en: "Controlling who can call the model with IAM is the customer's task with a managed API as well."
      fr: "Contrôler avec IAM qui peut appeler le modèle est aussi la tâche du client avec une API gérée."
    d:
      en: "Choosing the use cases is a business decision the company makes whatever the hosting method."
      fr: "Choisir les cas d'utilisation est une décision métier que l'entreprise prend quelle que soit la méthode d'hébergement."
references:
  - title: Amazon Bedrock FAQs
    url: https://aws.amazon.com/bedrock/faqs/
