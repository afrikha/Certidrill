id: aifc01-1c-met-rmse-large-errors
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A real estate company trains a regression model that predicts sale prices of houses. A few very large prediction errors are much more harmful to the business than many small ones. The team wants an evaluation metric that penalizes large errors more heavily than small errors.

    Which metric should the team use?
  fr: |
    Une agence immobilière entraîne un modèle de régression qui prédit le prix de vente des maisons. Quelques très grandes erreurs de prédiction nuisent bien plus à l'entreprise que de nombreuses petites erreurs. L'équipe veut une métrique d'évaluation qui pénalise davantage les grandes erreurs que les petites.

    Quelle métrique l'équipe doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Mean absolute error (MAE)", fr: "Erreur absolue moyenne (MAE)" } }
    - { id: b, text: { en: "Root mean squared error (RMSE)", fr: "Racine de l'erreur quadratique moyenne (RMSE)" } }
    - { id: c, text: { en: "F1 score", fr: "Score F1" } }
    - { id: d, text: { en: "Accuracy", fr: "Exactitude (accuracy)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "RMSE squares the differences between predicted and actual values before averaging them and taking the square root, so large errors and outliers weigh much more than small ones. Smaller RMSE is better."
    fr: "La RMSE élève au carré les écarts entre valeurs prédites et réelles avant d'en faire la moyenne et d'en prendre la racine : les grandes erreurs et les valeurs aberrantes pèsent bien plus que les petites. Plus la RMSE est faible, mieux c'est."
  options:
    a:
      en: "MAE is also a regression metric, but it averages absolute errors, so each error counts in proportion to its size, without extra weight on large errors."
      fr: "La MAE est aussi une métrique de régression, mais elle fait la moyenne des erreurs absolues : chaque erreur compte en proportion de sa taille, sans poids supplémentaire pour les grandes erreurs."
    c:
      en: "The F1 score evaluates classification models, not numeric price predictions."
      fr: "Le score F1 évalue des modèles de classification, pas des prédictions numériques de prix."
    d:
      en: "Accuracy counts correct class labels; it does not apply to continuous price predictions."
      fr: "L'exactitude compte les étiquettes de classe correctes ; elle ne s'applique pas à des prédictions de prix continues."
references:
  - title: Metrics and validation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
