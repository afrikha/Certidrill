id: aifc01-1b-tech-ticket-forecast
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company records the number of support tickets that it receives each day. It has three years of daily counts, which show weekly and seasonal patterns. The support manager wants to predict the daily ticket volume for each day of next month to plan staffing. Which ML technique is MOST appropriate?
  fr: |
    Un éditeur de logiciels enregistre le nombre de tickets de support qu'il reçoit chaque jour. Il dispose de trois ans de décomptes quotidiens, qui présentent des tendances hebdomadaires et saisonnières. Le responsable du support souhaite prédire le volume quotidien de tickets pour chaque jour du mois prochain afin de planifier les effectifs. Quelle technique de ML est la PLUS appropriée ?
body:
  options:
    - id: a
      text: { en: "Anomaly detection", fr: "Détection d'anomalies" }
    - id: b
      text: { en: "Time-series forecasting", fr: "Prévision de séries chronologiques" }
    - id: c
      text: { en: "Clustering", fr: "Clustering" }
    - id: d
      text: { en: "Binary classification", fr: "Classification binaire" }
answer: { optionId: b }
explanation:
  correct:
    en: "Time-series forecasting uses historical values ordered in time, with their trends and seasonality, to predict future values of the same series. Predicting daily ticket counts for the coming month from three years of daily counts is a forecasting problem."
    fr: "La prévision de séries chronologiques utilise des valeurs historiques ordonnées dans le temps, avec leurs tendances et leur saisonnalité, pour prédire les valeurs futures de la même série. Prédire le nombre quotidien de tickets du mois à venir à partir de trois ans de décomptes quotidiens est un problème de prévision."
  options:
    a:
      en: "Anomaly detection flags unusual values, such as an unexpected spike; it does not predict future volumes."
      fr: "La détection d'anomalies signale des valeurs inhabituelles, comme un pic inattendu ; elle ne prédit pas les volumes futurs."
    c:
      en: "Clustering groups similar items; it does not produce a value for each future day."
      fr: "Le clustering regroupe des éléments similaires ; il ne produit pas de valeur pour chaque jour futur."
    d:
      en: "Binary classification predicts one of two categories, not a count of tickets."
      fr: "La classification binaire prédit l'une de deux catégories, pas un nombre de tickets."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
