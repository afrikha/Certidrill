id: aifc01-1b-tech-risk-bands
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A lender has 200,000 historical loan applications. Each application was labeled by an underwriter with one of three risk bands: low, medium, or high. The lender wants a model that assigns one of these three bands to each new application. Which ML technique should the lender use?
  fr: |
    Un organisme de crédit dispose de 200 000 demandes de prêt historiques. Chaque demande a été étiquetée par un souscripteur avec l'une de trois catégories de risque : faible, moyen ou élevé. L'organisme souhaite un modèle qui affecte l'une de ces trois catégories à chaque nouvelle demande. Quelle technique de ML l'organisme doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Multi-class classification", fr: "Classification multiclasse" }
    - id: b
      text: { en: "Clustering with three clusters", fr: "Clustering avec trois clusters" }
    - id: c
      text: { en: "Regression", fr: "Régression" }
    - id: d
      text: { en: "Binary classification", fr: "Classification binaire" }
answer: { optionId: a }
explanation:
  correct:
    en: "The output is one of three predefined categories, and every training example carries one of these labels. Multi-class classification is the supervised technique that predicts which of three or more classes an item belongs to."
    fr: "La sortie est l'une de trois catégories prédéfinies, et chaque exemple d'entraînement porte l'une de ces étiquettes. La classification multiclasse est la technique supervisée qui prédit à laquelle de trois classes ou plus appartient un élément."
  options:
    b:
      en: "Clustering finds its own groups in unlabeled data; the three groups it forms would not match the underwriters' risk bands, and the labels would be ignored."
      fr: "Le clustering trouve ses propres groupes dans des données non étiquetées ; les trois groupes formés ne correspondraient pas aux catégories des souscripteurs, et les étiquettes seraient ignorées."
    c:
      en: "Although the bands are ordered, they are categories, not a continuous numeric value; regression would predict a number that still needs to be mapped to a band."
      fr: "Même si les catégories sont ordonnées, ce sont des catégories et non une valeur numérique continue ; la régression prédirait un nombre qu'il faudrait encore convertir en catégorie."
    d:
      en: "Binary classification predicts one of two classes; the lender needs three."
      fr: "La classification binaire prédit l'une de deux classes ; l'organisme en a besoin de trois."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
  - title: "Amazon SageMaker Canvas"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/canvas.html
