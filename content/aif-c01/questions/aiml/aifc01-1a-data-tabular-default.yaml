id: aifc01-1a-data-tabular-default
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank has a table of past loan applications. Each row is one applicant, with columns for income, debt, and years of employment, and a final column that records whether the applicant defaulted (yes or no). The bank wants to predict whether new applicants will default.

    Which description of the data and the approach is correct?
  fr: |
    Une banque dispose d'une table des demandes de prêt passées. Chaque ligne correspond à un demandeur, avec des colonnes pour les revenus, les dettes et les années d'emploi, et une dernière colonne qui indique si le demandeur a fait défaut (oui ou non). La banque veut prédire si les nouveaux demandeurs feront défaut.

    Quelle description des données et de l'approche est correcte ?
body:
  options:
    - { id: a, text: { en: "Unlabeled tabular data, used with a clustering algorithm such as K-Means", fr: "Des données tabulaires non étiquetées, utilisées avec un algorithme de clustering comme K-Means" } }
    - { id: b, text: { en: "Labeled tabular data, used with a classification algorithm such as XGBoost", fr: "Des données tabulaires étiquetées, utilisées avec un algorithme de classification comme XGBoost" } }
    - { id: c, text: { en: "Labeled time-series data, used with a forecasting algorithm such as DeepAR", fr: "Des données de séries chronologiques étiquetées, utilisées avec un algorithme de prévision comme DeepAR" } }
    - { id: d, text: { en: "Unlabeled text data, used with a topic modeling algorithm such as LDA", fr: "Des données textuelles non étiquetées, utilisées avec un algorithme de modélisation de sujets comme LDA" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The rows and columns make this tabular data, and the default column is a label: the known outcome for each past applicant. Predicting a yes or no outcome from labeled tabular data is supervised classification, which SageMaker AI algorithms such as XGBoost support."
    fr: "Les lignes et les colonnes en font des données tabulaires, et la colonne de défaut est une étiquette : le résultat connu de chaque demandeur passé. Prédire un résultat oui ou non à partir de données tabulaires étiquetées relève de la classification supervisée, que prennent en charge des algorithmes de SageMaker AI comme XGBoost."
  options:
    a:
      en: "The default column is a label, so the data is labeled; clustering would group applicants without predicting default."
      fr: "La colonne de défaut est une étiquette : les données sont donc étiquetées ; le clustering regrouperait les demandeurs sans prédire le défaut."
    c:
      en: "Each row is an independent applicant, not a sequence of values over time, and the goal is a yes or no prediction, not a forecast."
      fr: "Chaque ligne est un demandeur indépendant, pas une suite de valeurs dans le temps, et l'objectif est une prédiction oui ou non, pas une prévision."
    d:
      en: "The columns are numeric fields with a label, not free text; topic modeling discovers themes in documents."
      fr: "Les colonnes sont des champs numériques avec une étiquette, pas du texte libre ; la modélisation de sujets découvre des thèmes dans des documents."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
  - title: "Supervised vs Unsupervised Learning - Difference Between Machine Learning Algorithms - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-machine-learning-supervised-and-unsupervised/
