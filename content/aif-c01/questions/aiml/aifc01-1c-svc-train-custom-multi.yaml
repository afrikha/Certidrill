id: aifc01-1c-svc-train-custom-multi
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A telecommunications company wants to train a custom binary classification model that predicts customer churn from its own tabular data in Amazon S3.

    Which two AWS services or features can the company use to train the model? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de télécommunications veut entraîner un modèle personnalisé de classification binaire qui prédit l'attrition des clients à partir de ses propres données tabulaires dans Amazon S3.

    Quels sont les deux services ou fonctionnalités AWS que l'entreprise peut utiliser pour entraîner le modèle ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Amazon Quick" }
    - { id: b, text: "Amazon SageMaker Canvas" }
    - { id: c, text: "AWS Glue DataBrew" }
    - { id: d, text: "Amazon SageMaker AI training jobs" }
    - { id: e, text: "Amazon Polly" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "SageMaker Canvas builds custom models without code, including categorical (binary) prediction from tabular data. SageMaker AI training jobs run managed training with built-in algorithms such as XGBoost, framework scripts or custom containers. Both cover the training stage of the pipeline."
    fr: "SageMaker Canvas crée des modèles personnalisés sans code, dont la prédiction catégorielle (binaire) à partir de données tabulaires. Les tâches d'entraînement SageMaker AI exécutent un entraînement géré avec des algorithmes intégrés comme XGBoost, des scripts de frameworks ou des conteneurs personnalisés. Les deux couvrent l'étape d'entraînement du pipeline."
  options:
    a:
      en: "Amazon Quick visualizes and analyzes data and results; it does not train a churn model."
      fr: "Amazon Quick visualise et analyse les données et les résultats ; il n'entraîne pas de modèle d'attrition."
    c:
      en: "DataBrew prepares the data before training but does not train models."
      fr: "DataBrew prépare les données avant l'entraînement mais n'entraîne pas de modèles."
    e:
      en: "Polly is a pretrained text-to-speech service; it does not train classification models."
      fr: "Polly est un service préentraîné de synthèse vocale ; il n'entraîne pas de modèles de classification."
references:
  - title: Amazon SageMaker Canvas
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/canvas.html
  - title: What is Amazon SageMaker AI?
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html
