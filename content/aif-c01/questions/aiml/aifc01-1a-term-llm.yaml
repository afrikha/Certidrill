id: aifc01-1a-term-llm
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company evaluates a model that has billions of parameters, was pretrained on a very large amount of text, uses a transformer architecture, and can summarize documents, answer questions, and write new text.

    Which type of model is this?
  fr: |
    Une entreprise évalue un modèle qui possède des milliards de paramètres, a été pré-entraîné sur une très grande quantité de texte, utilise une architecture de transformeur et peut résumer des documents, répondre à des questions et rédiger de nouveaux textes.

    De quel type de modèle s'agit-il ?
body:
  options:
    - { id: a, text: { en: "A linear regression model", fr: "Un modèle de régression linéaire" } }
    - { id: b, text: { en: "A large language model (LLM)", fr: "Un grand modèle de langage (LLM)" } }
    - { id: c, text: { en: "A k-means clustering model", fr: "Un modèle de clustering k-means" } }
    - { id: d, text: { en: "An image classification model", fr: "Un modèle de classification d'images" } }
answer: { optionId: b }
explanation:
  correct:
    en: "LLMs are very large deep learning models that are pretrained on vast amounts of text and can have billions of parameters. They use transformer neural networks with self-attention, and a single LLM can perform many language tasks such as summarization, question answering, and text generation."
    fr: "Les LLM sont de très grands modèles de deep learning pré-entraînés sur de vastes quantités de texte, qui peuvent compter des milliards de paramètres. Ils utilisent des réseaux neuronaux de type transformeur avec un mécanisme d'auto-attention, et un même LLM peut effectuer de nombreuses tâches linguistiques comme le résumé, la réponse aux questions et la génération de texte."
  options:
    a:
      en: "Linear regression predicts a continuous number from input features; it cannot generate or summarize text."
      fr: "La régression linéaire prédit un nombre continu à partir de caractéristiques d'entrée ; elle ne peut pas générer ni résumer de texte."
    c:
      en: "K-means groups similar data points into clusters; it does not produce new text."
      fr: "K-means regroupe des points de données similaires en clusters ; il ne produit pas de nouveau texte."
    d:
      en: "An image classification model assigns labels to images; it is not trained on text to write or summarize documents."
      fr: "Un modèle de classification d'images attribue des étiquettes à des images ; il n'est pas entraîné sur du texte pour rédiger ou résumer des documents."
references:
  - title: "What is LLM? - Large Language Models Explained - AWS"
    url: https://aws.amazon.com/what-is/large-language-model/
