id: aifc01-1a-value-personalize-scale
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A video streaming company has 8 million subscribers. Editors currently choose one list of featured titles that every subscriber sees. The company wants each subscriber's home page to show recommendations based on that subscriber's viewing history.

    Which AWS service meets this requirement?
  fr: |
    Une entreprise de streaming vidéo compte 8 millions d'abonnés. Des éditeurs choisissent actuellement une seule liste de titres mis en avant que voient tous les abonnés. L'entreprise veut que la page d'accueil de chaque abonné affiche des recommandations fondées sur l'historique de visionnage de cet abonné.

    Quel service AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "Amazon Comprehend" }
    - { id: b, text: "Amazon Lex" }
    - { id: c, text: "Amazon Personalize" }
    - { id: d, text: "Amazon Transcribe" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Personalize is a fully managed ML service that generates item recommendations for each user, mainly from item interaction data such as viewing history. It scales individual recommendations, such as 'Top picks for you', to millions of users, which editors cannot do by hand."
    fr: "Amazon Personalize est un service de ML entièrement géré qui génère des recommandations d'éléments pour chaque utilisateur, principalement à partir des données d'interaction avec les éléments, comme l'historique de visionnage. Il met à l'échelle des recommandations individuelles, comme « Top picks for you », pour des millions d'utilisateurs, ce que des éditeurs ne peuvent pas faire à la main."
  options:
    a:
      en: "Amazon Comprehend extracts insights such as entities and sentiment from text; it does not recommend items to users."
      fr: "Amazon Comprehend extrait des informations comme les entités et le sentiment d'un texte ; il ne recommande pas d'éléments aux utilisateurs."
    b:
      en: "Amazon Lex builds chatbots and voice interfaces; it does not generate recommendations from viewing history."
      fr: "Amazon Lex permet de créer des chatbots et des interfaces vocales ; il ne génère pas de recommandations à partir de l'historique de visionnage."
    d:
      en: "Amazon Transcribe converts speech to text; it does not recommend content."
      fr: "Amazon Transcribe convertit la parole en texte ; il ne recommande pas de contenu."
references:
  - title: "What is Amazon Personalize? - Amazon Personalize"
    url: https://docs.aws.amazon.com/personalize/latest/dg/what-is-personalize.html
