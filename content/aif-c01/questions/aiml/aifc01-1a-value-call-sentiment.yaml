id: aifc01-1a-value-call-sentiment
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A contact center records 30,000 customer calls each day. Supervisors listen to a random 2% of the calls to find unhappy customers. The company wants to measure customer sentiment in every call without hiring more supervisors.

    Which combination of AWS services meets these requirements?
  fr: |
    Un centre de contact enregistre 30 000 appels clients par jour. Les superviseurs écoutent 2 % des appels choisis au hasard pour repérer les clients mécontents. L'entreprise veut mesurer le sentiment des clients dans chaque appel sans embaucher davantage de superviseurs.

    Quelle combinaison de services AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon Polly to convert the recordings, and then Amazon Comprehend to detect sentiment", fr: "Amazon Polly pour convertir les enregistrements, puis Amazon Comprehend pour détecter le sentiment" } }
    - { id: b, text: { en: "Amazon Transcribe to convert the recordings to text, and then Amazon Comprehend to detect sentiment", fr: "Amazon Transcribe pour convertir les enregistrements en texte, puis Amazon Comprehend pour détecter le sentiment" } }
    - { id: c, text: { en: "Amazon Transcribe to convert the recordings to text, and then Amazon Translate to detect sentiment", fr: "Amazon Transcribe pour convertir les enregistrements en texte, puis Amazon Translate pour détecter le sentiment" } }
    - { id: d, text: { en: "Amazon Lex to convert the recordings to text, and then Amazon Rekognition to detect sentiment", fr: "Amazon Lex pour convertir les enregistrements en texte, puis Amazon Rekognition pour détecter le sentiment" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Transcribe is an automatic speech recognition service that converts recorded audio to text. Amazon Comprehend then determines the dominant sentiment (positive, negative, neutral, or mixed) of each transcript. Together they scale the analysis from a 2% sample to every call without more supervisors."
    fr: "Amazon Transcribe est un service de reconnaissance vocale automatique qui convertit de l'audio enregistré en texte. Amazon Comprehend détermine ensuite le sentiment dominant (positif, négatif, neutre ou mitigé) de chaque transcription. Ensemble, ils font passer l'analyse d'un échantillon de 2 % à la totalité des appels, sans superviseurs supplémentaires."
  options:
    a:
      en: "Amazon Polly converts text to speech, the opposite of what is needed; the recordings must become text first."
      fr: "Amazon Polly convertit du texte en parole, l'inverse de ce qui est nécessaire ; les enregistrements doivent d'abord devenir du texte."
    c:
      en: "Amazon Translate translates text between languages; it does not detect sentiment."
      fr: "Amazon Translate traduit du texte d'une langue à une autre ; il ne détecte pas le sentiment."
    d:
      en: "Amazon Lex builds conversational interfaces, not transcriptions of recorded calls, and Amazon Rekognition analyzes images and videos, not text sentiment."
      fr: "Amazon Lex permet de créer des interfaces conversationnelles, pas de transcrire des appels enregistrés, et Amazon Rekognition analyse des images et des vidéos, pas le sentiment d'un texte."
references:
  - title: "What is Amazon Transcribe? - Amazon Transcribe"
    url: https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html
  - title: "What is Amazon Comprehend? - Amazon Comprehend"
    url: https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html
