id: aifc01-1a-learn-unsupervised-segments
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company wants to divide its customers into groups that have similar purchasing behavior. The company has not defined the groups in advance and has no labels for its customers.

    Which type of learning meets this requirement?
  fr: |
    Une entreprise de vente au détail veut répartir ses clients en groupes au comportement d'achat similaire. L'entreprise n'a pas défini les groupes à l'avance et ne dispose d'aucune étiquette pour ses clients.

    Quel type d'apprentissage répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Supervised learning with a classification algorithm", fr: "L'apprentissage supervisé avec un algorithme de classification" } }
    - { id: b, text: { en: "Supervised learning with a regression algorithm", fr: "L'apprentissage supervisé avec un algorithme de régression" } }
    - { id: c, text: { en: "Reinforcement learning with a reward function", fr: "L'apprentissage par renforcement avec une fonction de récompense" } }
    - { id: d, text: { en: "Unsupervised learning with a clustering algorithm", fr: "L'apprentissage non supervisé avec un algorithme de clustering" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Unsupervised learning finds patterns in unlabeled data. A clustering algorithm such as K-Means groups customers so that members of a group are as similar as possible to each other, which is customer segmentation without predefined groups."
    fr: "L'apprentissage non supervisé trouve des schémas dans des données non étiquetées. Un algorithme de clustering comme K-Means regroupe les clients de sorte que les membres d'un groupe soient aussi similaires que possible entre eux : c'est une segmentation de la clientèle sans groupes prédéfinis."
  options:
    a:
      en: "Classification assigns inputs to categories that are known in advance and needs labeled examples; the groups are not defined."
      fr: "La classification affecte des entrées à des catégories connues à l'avance et a besoin d'exemples étiquetés ; les groupes ne sont pas définis."
    b:
      en: "Regression predicts a continuous value, such as a sales amount, from labeled data; it does not create groups."
      fr: "La régression prédit une valeur continue, comme un montant de ventes, à partir de données étiquetées ; elle ne crée pas de groupes."
    c:
      en: "Reinforcement learning trains an agent to choose actions through rewards; it does not segment existing customers."
      fr: "L'apprentissage par renforcement entraîne un agent à choisir des actions grâce à des récompenses ; il ne segmente pas des clients existants."
references:
  - title: "Supervised vs Unsupervised Learning - Difference Between Machine Learning Algorithms - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-machine-learning-supervised-and-unsupervised/
  - title: "K-Means Algorithm - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/k-means.html
