id: aifc01-1a-rel-hierarchy
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is training its employees on AI terminology.

    Which statement correctly describes the relationship between AI, machine learning (ML), and deep learning?
  fr: |
    Une entreprise forme ses employés à la terminologie de l'IA.

    Quelle affirmation décrit correctement la relation entre l'IA, le machine learning (ML) et le deep learning ?
body:
  options:
    - { id: a, text: { en: "ML is a subset of deep learning, and deep learning is a subset of AI.", fr: "Le ML est un sous-ensemble du deep learning, et le deep learning est un sous-ensemble de l'IA." } }
    - { id: b, text: { en: "AI is a subset of ML, and ML is a subset of deep learning.", fr: "L'IA est un sous-ensemble du ML, et le ML est un sous-ensemble du deep learning." } }
    - { id: c, text: { en: "Deep learning is a subset of ML, and ML is a subset of AI.", fr: "Le deep learning est un sous-ensemble du ML, et le ML est un sous-ensemble de l'IA." } }
    - { id: d, text: { en: "AI, ML, and deep learning are separate fields that do not overlap.", fr: "L'IA, le ML et le deep learning sont des domaines distincts qui ne se recoupent pas." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AI is the umbrella term for techniques that make machines perform tasks that resemble human problem solving. ML is a branch of AI that learns patterns from data, and deep learning is a more advanced form of ML that uses neural networks with many layers."
    fr: "L'IA est le terme général qui désigne les techniques permettant aux machines d'effectuer des tâches proches de la résolution de problèmes humaine. Le ML est une branche de l'IA qui apprend des schémas à partir des données, et le deep learning est une forme plus avancée de ML qui utilise des réseaux neuronaux à nombreuses couches."
  options:
    a:
      en: "The nesting is reversed for ML and deep learning: deep learning is a form of ML, not the other way around."
      fr: "L'imbrication est inversée pour le ML et le deep learning : le deep learning est une forme de ML, et non l'inverse."
    b:
      en: "AI is the broadest field; it contains ML, not the opposite."
      fr: "L'IA est le domaine le plus large ; elle contient le ML, et non l'inverse."
    d:
      en: "The three fields are nested: every deep learning model is an ML model, and every ML model is a form of AI."
      fr: "Les trois domaines sont imbriqués : tout modèle de deep learning est un modèle de ML, et tout modèle de ML est une forme d'IA."
references:
  - title: "What is AI? - Artificial Intelligence Explained - AWS"
    url: https://aws.amazon.com/what-is/artificial-intelligence/
