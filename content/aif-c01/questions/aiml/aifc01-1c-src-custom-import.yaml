id: aifc01-1c-src-custom-import
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company fine-tuned an open-source Llama model in Amazon SageMaker AI and saved the weights in Hugging Face format in an Amazon S3 bucket. The company now wants to run inference on this model through Amazon Bedrock with on-demand throughput.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé a peaufiné un modèle open source Llama dans Amazon SageMaker AI et a enregistré les pondérations au format Hugging Face dans un compartiment Amazon S3. L'entreprise veut maintenant exécuter l'inférence de ce modèle avec Amazon Bedrock en débit à la demande.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Subscribe to the same Llama model in Amazon Bedrock Marketplace.", fr: "S'abonner au même modèle Llama dans Amazon Bedrock Marketplace." } }
    - { id: b, text: { en: "Run a fine-tuning job on the base Llama model in Amazon Bedrock.", fr: "Exécuter une tâche de réglage précis du modèle Llama de base dans Amazon Bedrock." } }
    - { id: c, text: { en: "Create a model import job in Amazon Bedrock Custom Model Import.", fr: "Créer une tâche d'importation de modèle dans Amazon Bedrock Custom Model Import." } }
    - { id: d, text: { en: "Register the weights in SageMaker Model Registry.", fr: "Enregistrer les pondérations dans SageMaker Model Registry." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Custom Model Import brings a model customized elsewhere, such as in SageMaker AI, into Amazon Bedrock. The company points a model import job at the S3 location of the Hugging Face files; Llama is a supported architecture, and imported models can use on-demand throughput."
    fr: "Custom Model Import importe dans Amazon Bedrock un modèle personnalisé ailleurs, par exemple dans SageMaker AI. L'entreprise indique dans une tâche d'importation l'emplacement S3 des fichiers Hugging Face ; Llama est une architecture prise en charge, et les modèles importés peuvent utiliser le débit à la demande."
  options:
    a:
      en: "A Marketplace subscription gives the provider's model, not the weights that the company fine-tuned."
      fr: "Un abonnement Marketplace donne le modèle du fournisseur, et non les pondérations que l'entreprise a peaufinées."
    b:
      en: "Fine-tuning again in Bedrock repeats work the company already did and does not use its existing weights."
      fr: "Refaire un réglage précis dans Bedrock répète un travail déjà fait et n'utilise pas les pondérations existantes."
    d:
      en: "Model Registry catalogs and versions models for SageMaker AI deployments; it does not make a model available in Bedrock."
      fr: "Model Registry catalogue et versionne des modèles pour les déploiements SageMaker AI ; il ne rend pas un modèle disponible dans Bedrock."
references:
  - title: Use Custom model import to import a customized open-source model into Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
