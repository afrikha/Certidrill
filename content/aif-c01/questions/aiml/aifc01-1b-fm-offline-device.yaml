id: aifc01-1b-fm-offline-device
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A mining company installs vibration sensors on drilling equipment in remote sites that have no network connection. A small controller on each machine, with limited memory, must classify each reading as normal or abnormal within a few milliseconds. The company has a large set of readings labeled by engineers. Which approach will meet these requirements?
  fr: |
    Une société minière installe des capteurs de vibrations sur des équipements de forage situés sur des sites isolés sans connexion réseau. Un petit contrôleur sur chaque machine, à la mémoire limitée, doit classer chaque mesure comme normale ou anormale en quelques millisecondes. L'entreprise dispose d'un grand ensemble de mesures étiquetées par des ingénieurs. Quelle approche répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Invoke a foundation model on Amazon Bedrock from each controller for every reading.", fr: "Appeler un modèle de fondation sur Amazon Bedrock depuis chaque contrôleur pour chaque mesure." }
    - id: b
      text: { en: "Deploy a large language model on each controller and prompt it with each reading.", fr: "Déployer un grand modèle de langage sur chaque contrôleur et lui soumettre chaque mesure dans une invite." }
    - id: c
      text: { en: "Host a fine-tuned foundation model on an Amazon SageMaker AI real-time endpoint.", fr: "Héberger un modèle de fondation ayant fait l'objet d'un réglage fin sur un point de terminaison en temps réel Amazon SageMaker AI." }
    - id: d
      text: { en: "Train a small classification model on the labeled readings and run it locally.", fr: "Entraîner un petit modèle de classification sur les mesures étiquetées et l'exécuter localement." }
answer: { optionId: d }
explanation:
  correct:
    en: "The operational constraints decide the answer: no network, limited memory, and millisecond latency. A small traditional classifier trained on the labeled readings fits on the controller and runs locally and quickly. Foundation models are large and compute-intensive, and the managed APIs and endpoints that serve them need network access."
    fr: "Les contraintes opérationnelles déterminent la réponse : pas de réseau, une mémoire limitée et une latence de quelques millisecondes. Un petit classifieur traditionnel entraîné sur les mesures étiquetées tient sur le contrôleur et s'exécute localement et rapidement. Les modèles de fondation sont volumineux et gourmands en calcul, et les API et points de terminaison gérés qui les servent exigent un accès réseau."
  options:
    a:
      en: "Amazon Bedrock is a cloud API; the controllers have no network connection, and each remote call would also add latency."
      fr: "Amazon Bedrock est une API cloud ; les contrôleurs n'ont aucune connexion réseau, et chaque appel distant ajouterait aussi de la latence."
    b:
      en: "An LLM needs far more memory and compute than a small controller provides and could not answer within milliseconds."
      fr: "Un LLM exige bien plus de mémoire et de calcul qu'un petit contrôleur n'en offre et ne pourrait pas répondre en quelques millisecondes."
    c:
      en: "A SageMaker AI endpoint runs in AWS and must be reached over the network, which the remote sites do not have."
      fr: "Un point de terminaison SageMaker AI s'exécute dans AWS et doit être joint par le réseau, dont les sites isolés ne disposent pas."
references:
  - title: "Data differences between generative AI and traditional ML"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-data-considerations-gen-ai/differences.html
