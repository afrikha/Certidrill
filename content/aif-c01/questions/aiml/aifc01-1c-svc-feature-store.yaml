id: aifc01-1c-svc-feature-store
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company computes customer features, such as purchase frequency, for a recommendation model. The same features must be available as historical records for training and as the latest values with millisecond latency for real-time inference, to avoid differences between training and serving.

    Which AWS service or feature will meet these requirements?
  fr: |
    Une entreprise de commerce électronique calcule des caractéristiques (features) des clients, comme la fréquence d'achat, pour un modèle de recommandation. Les mêmes caractéristiques doivent être disponibles sous forme d'historique pour l'entraînement et sous forme de dernières valeurs, avec une latence de l'ordre de la milliseconde, pour l'inférence en temps réel, afin d'éviter les écarts entre l'entraînement et le service.

    Quel service ou quelle fonctionnalité AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Glue DataBrew" }
    - { id: b, text: "Amazon SageMaker Feature Store" }
    - { id: c, text: "Amazon SageMaker Model Registry" }
    - { id: d, text: "Amazon S3 Glacier" }
answer: { optionId: b }
explanation:
  correct:
    en: "SageMaker Feature Store keeps features in feature groups with an offline store of historical records for training and an online store of the latest values for low-latency inference. Sharing the same features across training and inference reduces training-serving skew."
    fr: "SageMaker Feature Store conserve les caractéristiques dans des groupes de caractéristiques, avec un magasin hors ligne de l'historique pour l'entraînement et un magasin en ligne des dernières valeurs pour l'inférence à faible latence. Partager les mêmes caractéristiques entre l'entraînement et l'inférence réduit l'écart entre entraînement et service (training-serving skew)."
  options:
    a:
      en: "DataBrew transforms datasets and writes them to S3; it does not serve the latest feature values at millisecond latency."
      fr: "DataBrew transforme des jeux de données et les écrit dans S3 ; il ne sert pas les dernières valeurs des caractéristiques à la milliseconde."
    c:
      en: "Model Registry stores model versions and their approval status, not the input features of the model."
      fr: "Model Registry stocke les versions des modèles et leur statut d'approbation, pas les caractéristiques d'entrée du modèle."
    d:
      en: "S3 Glacier is archive storage with retrieval delays, unsuitable for real-time inference."
      fr: "S3 Glacier est un stockage d'archivage avec des délais de récupération, inadapté à l'inférence en temps réel."
references:
  - title: Create, store, and share features with Feature Store
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store.html
