id: aifc01-1b-svc-chat-pii
objective: "1.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank exports its customer support chat conversations as English text files. Before the files are shared with an analytics team, names, phone numbers, and account numbers must be masked in the text. The bank wants to use a pretrained AWS service. Which solution will meet these requirements?
  fr: |
    Une banque exporte les conversations de son chat de support client sous forme de fichiers texte en anglais. Avant que les fichiers soient partagés avec une équipe d'analyse, les noms, numéros de téléphone et numéros de compte doivent être masqués dans le texte. La banque souhaite utiliser un service AWS préentraîné. Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run an Amazon Transcribe job with PII redaction enabled on the chat files.", fr: "Exécuter une tâche Amazon Transcribe avec le masquage des PII (redaction) activé sur les fichiers de chat." }
    - id: b
      text: { en: "Run an Amazon Comprehend PII redaction job on the chat files.", fr: "Exécuter une tâche de masquage des PII Amazon Comprehend sur les fichiers de chat." }
    - id: c
      text: { en: "Run Amazon Textract on the chat files to find the key-value pairs to mask.", fr: "Exécuter Amazon Textract sur les fichiers de chat pour trouver les paires clé-valeur à masquer." }
    - id: d
      text: { en: "Run an Amazon Translate batch job on the chat files with a custom terminology.", fr: "Exécuter une tâche par lots Amazon Translate sur les fichiers de chat avec une terminologie personnalisée." }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Comprehend detects PII entities, such as NAME, PHONE and bank account numbers, in English or Spanish text. An asynchronous redaction job returns a copy of each document in which every detected PII entity is masked, with no model to train."
    fr: "Amazon Comprehend détecte les entités PII, comme NAME, PHONE et les numéros de compte bancaire, dans des textes en anglais ou en espagnol. Une tâche asynchrone de masquage renvoie une copie de chaque document dans laquelle chaque entité PII détectée est masquée, sans modèle à entraîner."
  options:
    a:
      en: "Amazon Transcribe redacts PII in transcripts that it produces from audio; the chats are already text, so there is no audio to transcribe."
      fr: "Amazon Transcribe masque les PII dans les transcriptions qu'il produit à partir d'audio ; les chats sont déjà du texte, il n'y a donc aucun audio à transcrire."
    c:
      en: "Amazon Textract extracts text, forms and tables from scanned documents and images; it does not detect or mask PII in plain text files."
      fr: "Amazon Textract extrait le texte, les formulaires et les tableaux de documents numérisés et d'images ; il ne détecte ni ne masque les PII dans des fichiers texte brut."
    d:
      en: "Amazon Translate translates text, and custom terminology controls how specific terms are translated; neither masks personal data."
      fr: "Amazon Translate traduit du texte, et la terminologie personnalisée contrôle la traduction de termes précis ; ni l'un ni l'autre ne masque les données personnelles."
references:
  - title: "Detecting PII entities"
    url: https://docs.aws.amazon.com/comprehend/latest/dg/how-pii.html
