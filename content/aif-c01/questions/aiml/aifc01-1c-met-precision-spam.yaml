id: aifc01-1c-met-precision-spam
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An email provider trains a model that moves messages it classifies as spam to a junk folder. Moving a legitimate business email to the junk folder is very costly, while letting a few spam messages reach the inbox is acceptable.

    Which metric should the provider prioritize?
  fr: |
    Un fournisseur de messagerie entraîne un modèle qui déplace dans un dossier de courrier indésirable les messages qu'il classe comme spam. Déplacer un e-mail professionnel légitime dans ce dossier coûte très cher, alors que laisser quelques spams arriver dans la boîte de réception est acceptable.

    Quelle métrique le fournisseur doit-il privilégier ?
body:
  options:
    - { id: a, text: { en: "Precision", fr: "Précision" } }
    - { id: b, text: { en: "Recall", fr: "Rappel" } }
    - { id: c, text: { en: "Root mean squared error (RMSE)", fr: "Racine de l'erreur quadratique moyenne (RMSE)" } }
    - { id: d, text: { en: "R squared (R2)", fr: "Coefficient de détermination (R2)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Precision is TP / (TP + FP): the share of messages flagged as spam that really are spam. A legitimate email sent to the junk folder is a false positive, and precision is the metric to prioritize when false positives are costly."
    fr: "La précision vaut TP / (TP + FP) : la part des messages signalés comme spam qui en sont vraiment. Un e-mail légitime envoyé dans le courrier indésirable est un faux positif, et la précision est la métrique à privilégier quand les faux positifs coûtent cher."
  options:
    b:
      en: "Recall measures how many spam messages are caught; maximizing it would flag more legitimate emails."
      fr: "Le rappel mesure combien de spams sont détectés ; le maximiser signalerait davantage d'e-mails légitimes."
    c:
      en: "RMSE evaluates regression models that predict numeric values."
      fr: "La RMSE évalue des modèles de régression qui prédisent des valeurs numériques."
    d:
      en: "R2 measures how much variance a regression model explains; it does not apply to spam classification."
      fr: "Le R2 mesure la part de variance expliquée par un modèle de régression ; il ne s'applique pas à la classification des spams."
references:
  - title: Metrics and validation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
