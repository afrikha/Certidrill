id: aifc01-1a-learn-semi-supervised
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal services company wants to classify contracts by type. Lawyers have labeled 1,000 contracts, but labeling more is expensive. The company also has 500,000 unlabeled contracts that it wants to use during training.

    Which type of learning uses both datasets?
  fr: |
    Une entreprise de services juridiques veut classer des contrats par type. Des juristes ont étiqueté 1 000 contrats, mais en étiqueter davantage coûte cher. L'entreprise dispose aussi de 500 000 contrats non étiquetés qu'elle veut utiliser pendant l'entraînement.

    Quel type d'apprentissage utilise les deux jeux de données ?
body:
  options:
    - { id: a, text: { en: "Reinforcement learning", fr: "Apprentissage par renforcement" } }
    - { id: b, text: { en: "Unsupervised learning", fr: "Apprentissage non supervisé" } }
    - { id: c, text: { en: "Semi-supervised learning", fr: "Apprentissage semi-supervisé" } }
    - { id: d, text: { en: "Supervised learning", fr: "Apprentissage supervisé" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Semi-supervised learning combines a small labeled dataset with a large unlabeled one, which is useful when labels are costly. The model uses the labeled contracts to assign labels to unlabeled ones (pseudo-labeling) and then trains on the combined data."
    fr: "L'apprentissage semi-supervisé combine un petit jeu de données étiqueté et un grand jeu non étiqueté, ce qui est utile lorsque les étiquettes coûtent cher. Le modèle utilise les contrats étiquetés pour attribuer des étiquettes aux contrats non étiquetés (pseudo-étiquetage), puis s'entraîne sur l'ensemble des données."
  options:
    a:
      en: "Reinforcement learning learns from rewards for actions in an environment, not from a mix of labeled and unlabeled documents."
      fr: "L'apprentissage par renforcement apprend à partir de récompenses attribuées à des actions dans un environnement, pas d'un mélange de documents étiquetés et non étiquetés."
    b:
      en: "Unsupervised learning ignores labels and could not learn the contract types that the lawyers defined."
      fr: "L'apprentissage non supervisé ignore les étiquettes et ne pourrait pas apprendre les types de contrats définis par les juristes."
    d:
      en: "Supervised learning trains only on labeled examples, so it would use only the 1,000 labeled contracts."
      fr: "L'apprentissage supervisé ne s'entraîne que sur des exemples étiquetés : il n'utiliserait que les 1 000 contrats étiquetés."
references:
  - title: "What is Machine Learning? - ML Technology Explained - AWS"
    url: https://aws.amazon.com/what-is/machine-learning/
  - title: "Supervised vs Unsupervised Learning - Difference Between Machine Learning Algorithms - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-machine-learning-supervised-and-unsupervised/
