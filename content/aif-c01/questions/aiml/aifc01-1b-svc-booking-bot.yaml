id: aifc01-1b-svc-booking-bot
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A dental clinic wants a chatbot on its website and phone line. The chatbot must understand requests such as "I need a cleaning next Tuesday", ask for any missing details such as the preferred time, and then book the appointment. Which AWS service should the clinic use to build the chatbot?
  fr: |
    Un cabinet dentaire souhaite un chatbot sur son site web et sa ligne téléphonique. Le chatbot doit comprendre des demandes comme « J'ai besoin d'un détartrage mardi prochain », demander les informations manquantes comme l'heure souhaitée, puis réserver le rendez-vous. Quel service AWS le cabinet doit-il utiliser pour créer le chatbot ?
body:
  options:
    - id: a
      text: "Amazon Comprehend"
    - id: b
      text: "Amazon Lex"
    - id: c
      text: "Amazon Polly"
    - id: d
      text: "Amazon Personalize"
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Lex builds conversational interfaces for voice and text by combining automatic speech recognition and natural language understanding. An intent such as BookAppointment has slots, such as date and time, that Lex asks the user to fill, and a Lambda function can fulfill the intent by creating the booking."
    fr: "Amazon Lex crée des interfaces conversationnelles vocales et textuelles en combinant la reconnaissance automatique de la parole et la compréhension du langage naturel. Une intention comme BookAppointment comporte des slots, comme la date et l'heure, que Lex demande à l'utilisateur de renseigner, et une fonction Lambda peut traiter l'intention en créant la réservation."
  options:
    a:
      en: "Amazon Comprehend extracts insights such as entities and sentiment from text; it does not manage a conversation."
      fr: "Amazon Comprehend extrait des informations comme les entités et le sentiment d'un texte ; il ne gère pas de conversation."
    c:
      en: "Amazon Polly can voice responses, but it does not understand requests or manage the dialog."
      fr: "Amazon Polly peut vocaliser des réponses, mais il ne comprend pas les demandes et ne gère pas le dialogue."
    d:
      en: "Amazon Personalize generates recommendations from user interactions; it does not build chatbots."
      fr: "Amazon Personalize génère des recommandations à partir des interactions des utilisateurs ; il ne crée pas de chatbots."
references:
  - title: "What is Amazon Lex V2?"
    url: https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html
  - title: "Amazon Lex V2 core concepts"
    url: https://docs.aws.amazon.com/lexv2/latest/dg/how-it-works.html
