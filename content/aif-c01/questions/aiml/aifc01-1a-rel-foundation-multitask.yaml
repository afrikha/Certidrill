id: aifc01-1a-rel-foundation-multitask
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company maintains three separate ML models: one for sentiment analysis, one for document summarization, and one for answering questions. Each model was trained for its single task. The company wants to replace them with one model that can perform all three tasks when it receives different instructions in a prompt.

    Which type of model meets this requirement?
  fr: |
    Une entreprise gère trois modèles de ML distincts : un pour l'analyse des sentiments, un pour le résumé de documents et un pour répondre à des questions. Chaque modèle a été entraîné pour sa seule tâche. L'entreprise veut les remplacer par un modèle unique capable d'effectuer les trois tâches lorsqu'il reçoit des instructions différentes dans une invite.

    Quel type de modèle répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "A logistic regression model trained on labeled reviews", fr: "Un modèle de régression logistique entraîné sur des avis étiquetés" } }
    - { id: b, text: { en: "A k-means model that groups documents by similarity", fr: "Un modèle k-means qui regroupe les documents par similarité" } }
    - { id: c, text: { en: "A reinforcement learning model that learns from rewards", fr: "Un modèle d'apprentissage par renforcement qui apprend à partir de récompenses" } }
    - { id: d, text: { en: "A foundation model, such as a large language model (LLM)", fr: "Un modèle de fondation, comme un grand modèle de langage (LLM)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Traditional ML models are usually built for one narrow task. Foundation models are large, general-purpose models pretrained on broad data, and a single foundation model can perform many tasks, such as sentiment analysis, summarization, and question answering, when guided by prompts."
    fr: "Les modèles de ML traditionnels sont généralement conçus pour une seule tâche précise. Les modèles de fondation sont de grands modèles polyvalents pré-entraînés sur des données variées, et un même modèle de fondation peut effectuer de nombreuses tâches, comme l'analyse des sentiments, le résumé et la réponse aux questions, lorsqu'il est guidé par des invites."
  options:
    a:
      en: "A logistic regression model is a task-specific classifier; it could detect sentiment but cannot summarize documents or answer questions."
      fr: "Un modèle de régression logistique est un classifieur propre à une tâche ; il pourrait détecter le sentiment mais ne peut ni résumer des documents ni répondre à des questions."
    b:
      en: "K-means only groups similar items; it cannot follow instructions or generate summaries and answers."
      fr: "K-means se contente de regrouper des éléments similaires ; il ne peut ni suivre des instructions ni générer des résumés et des réponses."
    c:
      en: "Reinforcement learning trains an agent to choose actions that maximize a reward; it does not provide a general-purpose language model."
      fr: "L'apprentissage par renforcement entraîne un agent à choisir des actions qui maximisent une récompense ; il ne fournit pas un modèle de langage polyvalent."
references:
  - title: "What are Foundation Models? - Foundation Models in Generative AI Explained - AWS"
    url: https://aws.amazon.com/what-is/foundation-models/
