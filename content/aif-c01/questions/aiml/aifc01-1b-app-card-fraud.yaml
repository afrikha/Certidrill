id: aifc01-1b-app-card-fraud
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment processor wants to score every card transaction in real time. The score must show how likely it is that the transaction is not authorized by the cardholder, so that risky transactions can be blocked or sent for review. The processor has several years of transactions labeled as legitimate or fraudulent. Which type of AI application meets these requirements?
  fr: |
    Un processeur de paiement souhaite attribuer un score à chaque transaction par carte en temps réel. Le score doit indiquer la probabilité que la transaction ne soit pas autorisée par le titulaire de la carte, afin de bloquer les transactions à risque ou de les envoyer en vérification. Le processeur dispose de plusieurs années de transactions étiquetées comme légitimes ou frauduleuses. Quel type d'application d'IA répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Demand forecasting", fr: "Prévision de la demande" }
    - id: b
      text: { en: "Customer segmentation", fr: "Segmentation de la clientèle" }
    - id: c
      text: { en: "Recommendation system", fr: "Système de recommandation" }
    - id: d
      text: { en: "Fraud detection", fr: "Détection de fraude" }
answer: { optionId: d }
explanation:
  correct:
    en: "Fraud detection models learn from labeled legitimate and fraudulent transactions and return, for each new transaction, the likelihood that it is fraudulent. This is a binary classification use case that is often combined with anomaly detection, and the score drives the block-or-review decision."
    fr: "Les modèles de détection de fraude apprennent à partir de transactions légitimes et frauduleuses étiquetées et renvoient, pour chaque nouvelle transaction, la probabilité qu'elle soit frauduleuse. C'est un cas d'usage de classification binaire, souvent combiné à la détection d'anomalies, et le score pilote la décision de blocage ou de vérification."
  options:
    a:
      en: "Demand forecasting predicts future volumes, such as next month's transaction count, not the risk of each transaction."
      fr: "La prévision de la demande prédit des volumes futurs, comme le nombre de transactions du mois prochain, pas le risque de chaque transaction."
    b:
      en: "Customer segmentation groups customers with similar behavior; it does not score individual transactions."
      fr: "La segmentation de la clientèle regroupe des clients au comportement similaire ; elle n'attribue pas de score à chaque transaction."
    c:
      en: "A recommendation system suggests items to users; it does not assess whether a payment is authorized."
      fr: "Un système de recommandation suggère des articles aux utilisateurs ; il n'évalue pas si un paiement est autorisé."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
