id: aifc01-1b-svc-dub-videos
objective: "1.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An online training company has hundreds of English video courses. It wants to produce a Spanish audio track for each course automatically. The pipeline must convert the English narration to text, translate the text into Spanish, and generate Spanish speech from the translated text.

    Which three AWS services should the company use? (Choose three.)
  fr: |
    Une entreprise de formation en ligne propose des centaines de cours vidéo en anglais. Elle souhaite produire automatiquement une piste audio en espagnol pour chaque cours. Le pipeline doit convertir la narration anglaise en texte, traduire le texte en espagnol et générer de la parole en espagnol à partir du texte traduit.

    Quels sont les trois services AWS que l'entreprise doit utiliser ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: "Amazon Transcribe" }
    - { id: b, text: "Amazon Comprehend" }
    - { id: c, text: "Amazon Translate" }
    - { id: d, text: "Amazon Lex" }
    - { id: e, text: "Amazon Polly" }
    - { id: f, text: "Amazon Textract" }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "Amazon Transcribe converts the English narration into text (speech to text). Amazon Translate translates that text into Spanish. Amazon Polly converts the Spanish text into lifelike speech for the new audio track. Each step uses a pretrained managed service, so no model needs to be built."
    fr: "Amazon Transcribe convertit la narration anglaise en texte (parole vers texte). Amazon Translate traduit ce texte en espagnol. Amazon Polly convertit le texte espagnol en parole naturelle pour la nouvelle piste audio. Chaque étape utilise un service géré préentraîné : aucun modèle n'est à créer."
  options:
    b:
      en: "Amazon Comprehend extracts insights such as sentiment and entities from text; the pipeline does not need text analysis."
      fr: "Amazon Comprehend extrait des informations comme le sentiment et les entités d'un texte ; le pipeline n'a pas besoin d'analyse de texte."
    d:
      en: "Amazon Lex builds conversational bots; there is no conversation with a user in this pipeline."
      fr: "Amazon Lex crée des bots conversationnels ; ce pipeline ne comporte aucune conversation avec un utilisateur."
    f:
      en: "Amazon Textract extracts text from scanned documents and images, not from the audio of a video."
      fr: "Amazon Textract extrait le texte de documents numérisés et d'images, pas de l'audio d'une vidéo."
references:
  - title: "What is Amazon Transcribe?"
    url: https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html
  - title: "What Is Amazon Polly?"
    url: https://docs.aws.amazon.com/polly/latest/dg/what-is.html
