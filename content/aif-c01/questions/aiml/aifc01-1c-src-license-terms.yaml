id: aifc01-1c-src-license-terms
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company plans to deploy a third-party open-weight model from SageMaker JumpStart in a commercial product.

    Which statement about the license of the model is correct?
  fr: |
    Une société de services financiers prévoit de déployer un modèle tiers à pondérations ouvertes (open-weight) de SageMaker JumpStart dans un produit commercial.

    Quelle affirmation sur la licence du modèle est correcte ?
body:
  options:
    - { id: a, text: { en: "AWS reviews the license and takes responsibility for the company's compliance.", fr: "AWS examine la licence et prend la responsabilité de la conformité de l'entreprise." } }
    - { id: b, text: { en: "Open-weight models carry no restrictions, so any commercial use is allowed.", fr: "Les modèles à pondérations ouvertes n'ont aucune restriction : tout usage commercial est autorisé." } }
    - { id: c, text: { en: "The company must review the license terms and comply with them before use.", fr: "L'entreprise doit examiner les conditions de licence et les respecter avant l'utilisation." } }
    - { id: d, text: { en: "License terms apply only after the company fine-tunes the model.", fr: "Les conditions de licence ne s'appliquent qu'après le réglage précis du modèle par l'entreprise." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Third-party models in JumpStart come with their own license terms. The customer is responsible for reviewing those terms and complying with them before downloading or using the model, including for commercial use."
    fr: "Les modèles tiers de JumpStart ont leurs propres conditions de licence. Le client doit examiner ces conditions et les respecter avant de télécharger ou d'utiliser le modèle, y compris pour un usage commercial."
  options:
    a:
      en: "AWS makes the models available, but compliance with third-party license terms stays the customer's responsibility."
      fr: "AWS met les modèles à disposition, mais le respect des conditions de licence tierces reste de la responsabilité du client."
    b:
      en: "Open-weight licenses differ from model to model, and some restrict commercial use; they must be read."
      fr: "Les licences des modèles à pondérations ouvertes varient d'un modèle à l'autre et certaines restreignent l'usage commercial ; il faut les lire."
    d:
      en: "The license governs any download or use of the model, not only use of a customized version."
      fr: "La licence régit tout téléchargement ou toute utilisation du modèle, pas seulement l'utilisation d'une version personnalisée."
references:
  - title: SageMaker JumpStart pretrained models
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html
