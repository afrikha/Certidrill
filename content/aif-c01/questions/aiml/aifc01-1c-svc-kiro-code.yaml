id: aifc01-1c-svc-kiro-code
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer must write the data processing and model training scripts for a new ML pipeline. The developer wants an AI agent that turns a prompt into a structured specification, then into code, documentation and tests, and that follows the team's conventions stored in steering files.

    Which AWS service or tool will meet these requirements?
  fr: |
    Un développeur doit écrire les scripts de traitement des données et d'entraînement du modèle d'un nouveau pipeline de ML. Il veut un agent d'IA qui transforme une invite en spécification structurée, puis en code, en documentation et en tests, et qui suit les conventions de l'équipe enregistrées dans des fichiers de pilotage (steering files).

    Quel service ou quel outil AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Bedrock Knowledge Bases" }
    - { id: b, text: "Amazon SageMaker Canvas" }
    - { id: c, text: "Amazon Quick" }
    - { id: d, text: "Kiro" }
answer: { optionId: d }
explanation:
  correct:
    en: "Kiro is an agentic coding service built on Amazon Bedrock. It turns prompts into specs and then into code, docs and tests, uses steering files for persistent project knowledge, and can run agent hooks on file events. It supports the development work of every pipeline stage."
    fr: "Kiro est un service de codage agentique fondé sur Amazon Bedrock. Il transforme des invites en spécifications puis en code, en documentation et en tests, utilise des fichiers de pilotage pour conserver la connaissance du projet et peut exécuter des hooks d'agent sur des événements de fichiers. Il soutient le travail de développement de chaque étape du pipeline."
  options:
    a:
      en: "Knowledge Bases retrieve company documents for retrieval-augmented generation; they do not write and test code from specs."
      fr: "Knowledge Bases récupère des documents de l'entreprise pour la génération augmentée par récupération ; il n'écrit ni ne teste de code à partir de spécifications."
    b:
      en: "Canvas builds models without code; it does not generate pipeline scripts, docs and tests for a developer."
      fr: "Canvas crée des modèles sans code ; il ne génère pas de scripts de pipeline, de documentation ni de tests pour un développeur."
    c:
      en: "Amazon Quick is for business intelligence, research and workflow automation, not for writing ML pipeline code."
      fr: "Amazon Quick sert à l'informatique décisionnelle, à la recherche et à l'automatisation de flux de travail, pas à l'écriture du code d'un pipeline de ML."
references:
  - title: Kiro Documentation
    url: https://aws.amazon.com/documentation-overview/kiro
