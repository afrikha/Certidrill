id: aifc01-1a-inf-async-large
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company uses a model in Amazon SageMaker AI to analyze video files of about 800 MB. Requests arrive one at a time throughout the day, and processing each file takes about 20 minutes. Users must receive each result soon after its processing finishes, and the company does not want to pay for instances when there are no requests.

    Which inference option meets these requirements?
  fr: |
    Une entreprise de médias utilise un modèle dans Amazon SageMaker AI pour analyser des fichiers vidéo d'environ 800 Mo. Les requêtes arrivent une par une tout au long de la journée, et le traitement de chaque fichier prend environ 20 minutes. Les utilisateurs doivent recevoir chaque résultat peu après la fin de son traitement, et l'entreprise ne veut pas payer d'instances lorsqu'il n'y a aucune requête.

    Quelle option d'inférence répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Asynchronous Inference", fr: "Asynchronous Inference (inférence asynchrone)" } }
    - { id: b, text: { en: "Real-time inference", fr: "Inférence en temps réel (real-time inference)" } }
    - { id: c, text: { en: "A monthly batch transform job", fr: "Une tâche mensuelle de transformation par lots (batch transform)" } }
    - { id: d, text: { en: "Serverless Inference", fr: "Serverless Inference (inférence sans serveur)" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Asynchronous Inference queues incoming requests and is designed for large payloads (up to 1 GB), long processing times (up to one hour), and near real-time latency. The endpoint can scale its instance count to zero when there are no requests, and it can send an Amazon SNS notification when each result is written to Amazon S3."
    fr: "Asynchronous Inference met en file d'attente les requêtes entrantes et est conçue pour les charges utiles volumineuses (jusqu'à 1 Go), les temps de traitement longs (jusqu'à une heure) et une latence proche du temps réel. Le point de terminaison peut réduire son nombre d'instances à zéro en l'absence de requêtes et envoyer une notification Amazon SNS lorsque chaque résultat est écrit dans Amazon S3."
  options:
    b:
      en: "Real-time inference serves interactive, low-latency requests that wait for an immediate response; it is not designed for 800 MB files that take 20 minutes, and its instances keep running when idle."
      fr: "L'inférence en temps réel sert des requêtes interactives à faible latence qui attendent une réponse immédiate ; elle n'est pas conçue pour des fichiers de 800 Mo traités en 20 minutes, et ses instances continuent de tourner pendant l'inactivité."
    c:
      en: "A monthly batch job would make users wait until the next run instead of receiving each result soon after processing."
      fr: "Une tâche mensuelle par lots ferait attendre les utilisateurs jusqu'à la prochaine exécution au lieu de leur fournir chaque résultat peu après le traitement."
    d:
      en: "Serverless Inference returns the prediction in the same request for short, sporadic requests; queueing large payloads with long processing times is the purpose of Asynchronous Inference."
      fr: "Serverless Inference renvoie la prédiction dans la même requête pour des requêtes courtes et sporadiques ; la mise en file d'attente de charges utiles volumineuses aux traitements longs est le rôle d'Asynchronous Inference."
references:
  - title: "Asynchronous inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
