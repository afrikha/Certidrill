id: aifc01-1b-pipe-holdout-set
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team split its labeled data into training, validation, and test sets. It trained several models on the training set and used the validation set to choose the best hyperparameters. The team now needs an unbiased estimate of how the final model will perform on new data. Which data should the team use?
  fr: |
    Une équipe a divisé ses données étiquetées en jeux d'entraînement, de validation et de test. Elle a entraîné plusieurs modèles sur le jeu d'entraînement et utilisé le jeu de validation pour choisir les meilleurs hyperparamètres. L'équipe a maintenant besoin d'une estimation non biaisée des performances du modèle final sur de nouvelles données. Quelles données l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "The validation set, because the model was never trained on it", fr: "Le jeu de validation, car le modèle n'a jamais été entraîné dessus" }
    - id: b
      text: { en: "The training set, because it is the largest of the three sets", fr: "Le jeu d'entraînement, car c'est le plus grand des trois jeux" }
    - id: c
      text: { en: "The test set, because it was not used for training or for tuning", fr: "Le jeu de test, car il n'a servi ni à l'entraînement ni au réglage" }
    - id: d
      text: { en: "All three sets combined, because more data gives a more stable score", fr: "Les trois jeux réunis, car davantage de données donne un score plus stable" }
answer: { optionId: c }
explanation:
  correct:
    en: "The test set is the holdout data: it is never used for training or validation, so it measures the errors of the final model on data it has not influenced. The validation set was used to choose hyperparameters, so a score on it is optimistic. Removing duplicates before splitting helps prevent data leakage into the test set."
    fr: "Le jeu de test constitue les données d'exclusion (holdout) : il n'est jamais utilisé pour l'entraînement ni pour la validation, et mesure donc les erreurs du modèle final sur des données qui ne l'ont pas influencé. Le jeu de validation a servi à choisir les hyperparamètres : un score obtenu sur ce jeu est optimiste. Supprimer les doublons avant la division aide à éviter les fuites de données vers le jeu de test."
  options:
    a:
      en: "The model was not trained on the validation set, but the team chose the hyperparameters to maximize its score, so that score overestimates performance."
      fr: "Le modèle n'a pas été entraîné sur le jeu de validation, mais l'équipe a choisi les hyperparamètres pour maximiser son score : ce score surestime les performances."
    b:
      en: "The model learned from the training set, so its score there hides overfitting and says little about new data."
      fr: "Le modèle a appris à partir du jeu d'entraînement : son score sur ce jeu masque le surapprentissage et en dit peu sur de nouvelles données."
    d:
      en: "Combining the sets mixes data that the model already learned from or was tuned on, which inflates the score."
      fr: "Réunir les jeux mélange des données dont le modèle a appris ou sur lesquelles il a été réglé, ce qui gonfle le score."
references:
