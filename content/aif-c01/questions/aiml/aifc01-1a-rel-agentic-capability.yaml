id: aifc01-1a-rel-agentic-capability
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company has a generative AI chatbot that answers questions about its booking rules. The company now wants an assistant that receives a goal such as "rebook my canceled flight", checks seat availability through airline APIs, chooses an option, books it, and sends a confirmation with little human supervision.

    Which capability distinguishes the new assistant from the existing chatbot?
  fr: |
    Une entreprise de voyages dispose d'un chatbot d'IA générative qui répond aux questions sur ses règles de réservation. Elle veut maintenant un assistant qui reçoit un objectif comme « réserver à nouveau mon vol annulé », vérifie les places disponibles via les API des compagnies aériennes, choisit une option, la réserve et envoie une confirmation, avec peu de supervision humaine.

    Quelle capacité distingue le nouvel assistant du chatbot existant ?
body:
  options:
    - { id: a, text: { en: "It generates natural language responses from the user's prompt.", fr: "Il génère des réponses en langage naturel à partir de l'invite de l'utilisateur." } }
    - { id: b, text: { en: "It plans steps and calls external tools to act toward a goal on its own.", fr: "Il planifie des étapes et appelle des outils externes pour agir de lui-même vers un objectif." } }
    - { id: c, text: { en: "It uses a foundation model that was pretrained on a large amount of data.", fr: "Il utilise un modèle de fondation pré-entraîné sur une grande quantité de données." } }
    - { id: d, text: { en: "It classifies each request into one of several predefined categories.", fr: "Il classe chaque demande dans l'une de plusieurs catégories prédéfinies." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Agentic AI is an autonomous system that acts toward a goal with limited supervision. An LLM reasons about the goal and builds a plan, and the agent then acts by calling tools and external systems, such as the airline APIs. A generative AI chatbot only produces content in response to each prompt."
    fr: "L'IA agentique est un système autonome qui agit vers un objectif avec une supervision limitée. Un LLM raisonne sur l'objectif et construit un plan, puis l'agent agit en appelant des outils et des systèmes externes, comme les API des compagnies aériennes. Un chatbot d'IA générative se contente de produire du contenu en réponse à chaque invite."
  options:
    a:
      en: "Both the existing chatbot and the new assistant generate natural language; this does not distinguish them."
      fr: "Le chatbot existant et le nouvel assistant génèrent tous deux du langage naturel ; cela ne les distingue pas."
    c:
      en: "Both solutions can be built on a foundation model; the difference is the ability to plan and take actions."
      fr: "Les deux solutions peuvent reposer sur un modèle de fondation ; la différence est la capacité à planifier et à agir."
    d:
      en: "Classifying requests is a traditional ML task; it does not book flights or act toward a goal."
      fr: "Classer des demandes est une tâche de ML traditionnel ; elle ne réserve pas de vols et n'agit pas vers un objectif."
references:
  - title: "What is Agentic AI? - Agentic AI Explained - AWS"
    url: https://aws.amazon.com/what-is/agentic-ai/
  - title: "Overview - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
