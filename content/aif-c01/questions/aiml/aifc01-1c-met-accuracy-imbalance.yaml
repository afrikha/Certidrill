id: aifc01-1c-met-accuracy-imbalance
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment company tests a fraud detection model on 1,000 transactions, of which 10 are fraudulent. The model labels every transaction as legitimate.

    Which statement about this result is correct?
  fr: |
    Une société de paiement teste un modèle de détection de fraude sur 1 000 transactions, dont 10 sont frauduleuses. Le modèle classe toutes les transactions comme légitimes.

    Quelle affirmation sur ce résultat est correcte ?
body:
  options:
    - { id: a, text: { en: "Accuracy is 99%, which shows that the model is ready for production.", fr: "L'exactitude est de 99 %, ce qui montre que le modèle est prêt pour la production." } }
    - { id: b, text: { en: "Accuracy is 99%, but fraud recall is 0, so the model detects no fraud.", fr: "L'exactitude est de 99 %, mais le rappel de la fraude est de 0 : le modèle ne détecte aucune fraude." } }
    - { id: c, text: { en: "Fraud precision is 99%, which shows that false positives are rare.", fr: "La précision de la fraude est de 99 %, ce qui montre que les faux positifs sont rares." } }
    - { id: d, text: { en: "The F1 score is 99%, which shows a good balance of precision and recall.", fr: "Le score F1 est de 99 %, ce qui montre un bon équilibre entre précision et rappel." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The model is right on 990 of 1,000 transactions, so accuracy is 99%. It finds none of the 10 frauds, so recall for the fraud class is 0 / 10 = 0. On imbalanced data, accuracy hides this failure; recall, F1 or balanced accuracy reveal it."
    fr: "Le modèle a raison sur 990 des 1 000 transactions : l'exactitude est de 99 %. Il ne trouve aucune des 10 fraudes : le rappel de la classe fraude est de 0 / 10 = 0. Sur des données déséquilibrées, l'exactitude masque cet échec ; le rappel, le score F1 ou l'exactitude équilibrée le révèlent."
  options:
    a:
      en: "High accuracy on imbalanced data can come from always predicting the majority class; the model catches no fraud."
      fr: "Une exactitude élevée sur des données déséquilibrées peut venir de la prédiction systématique de la classe majoritaire ; le modèle ne détecte aucune fraude."
    c:
      en: "The model makes no positive (fraud) predictions, so precision for fraud cannot be 99%; it is undefined or 0."
      fr: "Le modèle ne fait aucune prédiction positive (fraude) : la précision de la fraude ne peut pas être de 99 % ; elle est indéfinie ou nulle."
    d:
      en: "With a recall of 0, the F1 score for fraud is 0, not 99%."
      fr: "Avec un rappel de 0, le score F1 de la fraude est de 0, pas de 99 %."
references:
  - title: Metrics and validation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
