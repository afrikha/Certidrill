id: aifc01-1a-term-nlp-reviews
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer receives thousands of written product reviews each day. It wants to determine automatically whether each review expresses a positive, negative, or neutral opinion.

    Which field of AI addresses this requirement?
  fr: |
    Un détaillant en ligne reçoit chaque jour des milliers d'avis écrits sur ses produits. Il veut déterminer automatiquement si chaque avis exprime une opinion positive, négative ou neutre.

    Quel domaine de l'IA répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Computer vision", fr: "Vision par ordinateur" } }
    - { id: b, text: { en: "Reinforcement learning", fr: "Apprentissage par renforcement" } }
    - { id: c, text: { en: "Natural language processing (NLP)", fr: "Traitement du langage naturel (NLP)" } }
    - { id: d, text: { en: "Speech synthesis", fr: "Synthèse vocale" } }
answer: { optionId: c }
explanation:
  correct:
    en: "NLP lets computers interpret and extract meaning from human language. Sentiment analysis, which detects whether a text expresses a positive, negative, neutral, or mixed opinion, is a classic NLP task."
    fr: "Le NLP permet aux ordinateurs d'interpréter le langage humain et d'en extraire le sens. L'analyse des sentiments, qui détecte si un texte exprime une opinion positive, négative, neutre ou mitigée, est une tâche classique de NLP."
  options:
    a:
      en: "Computer vision analyzes images and videos, not written text."
      fr: "La vision par ordinateur analyse des images et des vidéos, pas du texte écrit."
    b:
      en: "Reinforcement learning trains an agent to choose actions through rewards; it is not the field that interprets the meaning of text."
      fr: "L'apprentissage par renforcement entraîne un agent à choisir des actions grâce à des récompenses ; ce n'est pas le domaine qui interprète le sens d'un texte."
    d:
      en: "Speech synthesis converts text into spoken audio; it does not analyze the opinion that a text expresses."
      fr: "La synthèse vocale convertit du texte en audio parlé ; elle n'analyse pas l'opinion exprimée par un texte."
references:
  - title: "What is Natural Language Processing? - NLP Explained - AWS"
    url: https://aws.amazon.com/what-is/nlp/
