id: aifc01-1a-term-overfitting
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company trains a model to predict late deliveries. The model is 98% accurate on the training data but only 61% accurate on new data that it did not see during training.

    Which term describes this situation?
  fr: |
    Une entreprise de logistique entraîne un modèle pour prédire les livraisons en retard. Le modèle a une exactitude de 98 % sur les données d'entraînement, mais de seulement 61 % sur de nouvelles données qu'il n'a pas vues pendant l'entraînement.

    Quel terme décrit cette situation ?
body:
  options:
    - { id: a, text: { en: "Underfitting", fr: "Sous-ajustement (underfitting)" } }
    - { id: b, text: { en: "Overfitting", fr: "Surajustement (overfitting)" } }
    - { id: c, text: { en: "Good fit", fr: "Bon ajustement (good fit)" } }
    - { id: d, text: { en: "High bias", fr: "Biais élevé (high bias)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An overfitted model predicts the training data accurately but performs poorly on new data, because it has learned noise and details that are specific to the training set. A large gap between training accuracy and test accuracy is the typical sign of overfitting, which corresponds to high variance."
    fr: "Un modèle surajusté prédit avec exactitude les données d'entraînement, mais donne de mauvais résultats sur de nouvelles données, car il a appris du bruit et des détails propres au jeu d'entraînement. Un grand écart entre l'exactitude sur l'entraînement et l'exactitude sur le test est le signe typique du surajustement, qui correspond à une variance élevée."
  options:
    a:
      en: "An underfitted model performs poorly on both the training data and new data; here the training accuracy is very high."
      fr: "Un modèle sous-ajusté donne de mauvais résultats à la fois sur les données d'entraînement et sur de nouvelles données ; ici, l'exactitude sur l'entraînement est très élevée."
    c:
      en: "A good fit captures the main trend in both seen and unseen data, so training and test accuracy would be close."
      fr: "Un bon ajustement capture la tendance principale des données vues et non vues : l'exactitude sur l'entraînement et sur le test serait proche."
    d:
      en: "High bias is the characteristic of underfitting: the model is too simple and is inaccurate even on the training data."
      fr: "Un biais élevé caractérise le sous-ajustement : le modèle est trop simple et manque d'exactitude même sur les données d'entraînement."
references:
  - title: "What is Overfitting? - Overfitting in Machine Learning Explained - AWS"
    url: https://aws.amazon.com/what-is/overfitting/
