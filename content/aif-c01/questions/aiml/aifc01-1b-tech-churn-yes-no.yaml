id: aifc01-1b-tech-churn-yes-no
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A streaming service has three years of customer records. Each record shows whether the customer canceled the subscription. The service wants to predict whether each current customer will cancel in the next 30 days. Which ML technique should the service use?
  fr: |
    Un service de streaming dispose de trois ans d'enregistrements clients. Chaque enregistrement indique si le client a résilié son abonnement. Le service souhaite prédire si chaque client actuel résiliera dans les 30 prochains jours. Quelle technique de ML le service doit-il utiliser ?
body:
  options:
    - id: a
      text: { en: "Binary classification", fr: "Classification binaire" }
    - id: b
      text: { en: "Regression", fr: "Régression" }
    - id: c
      text: { en: "Clustering", fr: "Clustering" }
    - id: d
      text: { en: "Anomaly detection", fr: "Détection d'anomalies" }
answer: { optionId: a }
explanation:
  correct:
    en: "The output has two possible values, cancel or stay, and the historical records are labeled with that outcome. Binary classification is the supervised technique that predicts which of two categories an item belongs to."
    fr: "La sortie a deux valeurs possibles, résilier ou rester, et les enregistrements historiques sont étiquetés avec ce résultat. La classification binaire est la technique supervisée qui prédit à laquelle de deux catégories appartient un élément."
  options:
    b:
      en: "Regression predicts a continuous number, such as monthly spend, not a yes-or-no outcome."
      fr: "La régression prédit un nombre continu, comme la dépense mensuelle, pas un résultat oui ou non."
    c:
      en: "Clustering finds groups in unlabeled data; it does not use the known cancel outcome to make predictions."
      fr: "Le clustering trouve des groupes dans des données non étiquetées ; il n'utilise pas le résultat de résiliation connu pour prédire."
    d:
      en: "Anomaly detection flags unusual records; canceling a subscription is a common, labeled outcome, not a rare abnormality."
      fr: "La détection d'anomalies signale des enregistrements inhabituels ; résilier un abonnement est un résultat courant et étiqueté, pas une anomalie rare."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
