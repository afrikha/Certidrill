id: aifc01-1a-data-semi-structured
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company stores thousands of video files. Each video has metadata tags with fixed fields for recording date, location, and topic.

    How does AWS classify this video collection?
  fr: |
    Une entreprise de médias stocke des milliers de fichiers vidéo. Chaque vidéo possède des balises de métadonnées avec des champs fixes pour la date d'enregistrement, le lieu et le sujet.

    Comment AWS classe-t-il cette collection de vidéos ?
body:
  options:
    - { id: a, text: { en: "Structured data", fr: "Données structurées" } }
    - { id: b, text: { en: "Semi-structured data", fr: "Données semi-structurées" } }
    - { id: c, text: { en: "Time-series data", fr: "Données de séries chronologiques" } }
    - { id: d, text: { en: "Labeled tabular data", fr: "Données tabulaires étiquetées" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Semi-structured data blends structured and unstructured elements. AWS gives this exact example: a video collection, which is unstructured content, with structured tags for date, location, and topic."
    fr: "Les données semi-structurées combinent des éléments structurés et non structurés. AWS donne précisément cet exemple : une collection de vidéos, contenu non structuré, accompagnée de balises structurées pour la date, le lieu et le sujet."
  options:
    a:
      en: "Only the tags have a fixed schema; the videos themselves do not fit into rows and columns."
      fr: "Seules les balises ont un schéma fixe ; les vidéos elles-mêmes ne tiennent pas en lignes et en colonnes."
    c:
      en: "A recording date in the metadata does not make the collection a sequence of measurements over time."
      fr: "Une date d'enregistrement dans les métadonnées ne fait pas de la collection une suite de mesures dans le temps."
    d:
      en: "The collection is mainly video content, not a table, and the tags describe the files rather than a target to predict."
      fr: "La collection est surtout un contenu vidéo, pas une table, et les balises décrivent les fichiers plutôt qu'une cible à prédire."
references:
  - title: "Structured Data vs Unstructured Data - Difference Between Collectible Data - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/
