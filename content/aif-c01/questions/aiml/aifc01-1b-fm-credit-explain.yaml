id: aifc01-1b-fm-credit-explain
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank wants to automate credit-limit decisions from structured applicant data, such as income, existing debt, and payment history. Regulators require the bank to explain, for each decision, which input factors influenced the result and how. Which approach BEST meets the regulatory requirement?
  fr: |
    Une banque souhaite automatiser les décisions de plafond de crédit à partir de données structurées sur les demandeurs, comme le revenu, l'endettement existant et l'historique de paiement. Les régulateurs exigent que la banque explique, pour chaque décision, quels facteurs d'entrée ont influencé le résultat et de quelle manière. Quelle approche répond le MIEUX à l'exigence réglementaire ?
body:
  options:
    - id: a
      text: { en: "An interpretable traditional ML model trained on labeled past decisions", fr: "Un modèle de ML traditionnel interprétable entraîné sur des décisions passées étiquetées" }
    - id: b
      text: { en: "A large language model that receives each application in a prompt", fr: "Un grand modèle de langage qui reçoit chaque demande dans une invite" }
    - id: c
      text: { en: "A foundation model that writes a justification after each decision", fr: "Un modèle de fondation qui rédige une justification après chaque décision" }
    - id: d
      text: { en: "A clustering model that groups applicants with similar profiles", fr: "Un modèle de clustering qui regroupe les demandeurs aux profils similaires" }
answer: { optionId: a }
explanation:
  correct:
    en: "Regulations in industries such as finance and healthcare can require model interpretability. A traditional model trained on structured data, especially a simple and interpretable one, makes it possible to show how each input feature contributed to a prediction. Foundation models are very large neural networks whose individual outputs are hard to explain."
    fr: "Dans des secteurs comme la finance et la santé, la réglementation peut exiger l'interprétabilité des modèles. Un modèle traditionnel entraîné sur des données structurées, surtout s'il est simple et interprétable, permet de montrer comment chaque caractéristique d'entrée a contribué à une prédiction. Les modèles de fondation sont de très grands réseaux neuronaux dont les sorties individuelles sont difficiles à expliquer."
  options:
    b:
      en: "An LLM's decision cannot be traced reliably to specific input factors, and its answers can vary between calls for the same input."
      fr: "La décision d'un LLM ne peut pas être reliée de façon fiable à des facteurs d'entrée précis, et ses réponses peuvent varier d'un appel à l'autre pour la même entrée."
    c:
      en: "A generated justification is new text produced after the fact; it does not prove which factors actually drove the decision, and it can be inaccurate."
      fr: "Une justification générée est un nouveau texte produit après coup ; elle ne prouve pas quels facteurs ont réellement déterminé la décision et peut être inexacte."
    d:
      en: "Clustering finds groups without labels; it does not make a credit-limit decision."
      fr: "Le clustering trouve des groupes sans étiquettes ; il ne prend pas de décision de plafond de crédit."
references:
  - title: "Machine learning model interpretability with AWS"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/welcome.html
