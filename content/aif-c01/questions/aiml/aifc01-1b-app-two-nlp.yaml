id: aifc01-1b-app-two-nlp
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is listing the AI applications that it runs.

    Which two applications are natural language processing (NLP) applications? (Choose two.)
  fr: |
    Une entreprise dresse la liste des applications d'IA qu'elle exploite.

    Quelles sont les deux applications de traitement du langage naturel (NLP) ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Detecting people who are not wearing helmets in site photos", fr: "Détecter les personnes sans casque sur les photos de chantier" } }
    - { id: b, text: { en: "Determining the sentiment of written product reviews", fr: "Déterminer le sentiment des avis produits écrits" } }
    - { id: c, text: { en: "Predicting next week's electricity demand for a city", fr: "Prédire la demande d'électricité d'une ville pour la semaine prochaine" } }
    - { id: d, text: { en: "Extracting company and person names from news articles", fr: "Extraire les noms d'entreprises et de personnes des articles de presse" } }
    - { id: e, text: { en: "Suggesting songs based on each listener's history", fr: "Suggérer des morceaux selon l'historique de chaque auditeur" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "NLP extracts meaning from human language in text. Sentiment analysis and entity recognition (names of people, organizations and places) are classic NLP tasks; on AWS, Amazon Comprehend provides both as pretrained insights."
    fr: "Le NLP extrait le sens du langage humain dans les textes. L'analyse des sentiments et la reconnaissance d'entités (noms de personnes, d'organisations et de lieux) sont des tâches classiques de NLP ; sur AWS, Amazon Comprehend fournit les deux sous forme d'analyses préentraînées."
  options:
    a:
      en: "Detecting helmets in photos is computer vision (personal protective equipment detection)."
      fr: "Détecter des casques sur des photos relève de la vision par ordinateur (détection des équipements de protection individuelle)."
    c:
      en: "Predicting demand from historical consumption is time-series forecasting."
      fr: "Prédire la demande à partir de la consommation historique relève de la prévision de séries chronologiques."
    e:
      en: "Suggesting songs from listening history is a recommendation system."
      fr: "Suggérer des morceaux à partir de l'historique d'écoute relève d'un système de recommandation."
references:
  - title: "What is Amazon Comprehend?"
    url: https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html
