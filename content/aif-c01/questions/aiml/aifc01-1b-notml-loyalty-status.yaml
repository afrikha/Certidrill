id: aifc01-1b-notml-loyalty-status
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An airline grants Gold status to every member who takes 50 or more flights in a calendar year. The rule is written in the program's terms and conditions, and auditors check that every member receives the status they are entitled to. A data scientist proposes a classification model, trained on past member data, to decide who receives Gold status. Why is an ML model a poor choice for this decision?
  fr: |
    Une compagnie aérienne accorde le statut Gold à chaque membre qui effectue au moins 50 vols au cours d'une année civile. La règle figure dans les conditions générales du programme, et des auditeurs vérifient que chaque membre reçoit le statut auquel il a droit. Un data scientist propose un modèle de classification, entraîné sur les données des anciens membres, pour décider qui reçoit le statut Gold. Pourquoi un modèle de ML est-il un mauvais choix pour cette décision ?
body:
  options:
    - id: a
      text: { en: "Classification models cannot use numeric inputs such as a count of flights.", fr: "Les modèles de classification ne peuvent pas utiliser d'entrées numériques comme un nombre de vols." }
    - id: b
      text: { en: "The decision needs a specific, guaranteed outcome, and a model returns predictions that can be wrong.", fr: "La décision exige un résultat précis et garanti, et un modèle renvoie des prédictions qui peuvent être fausses." }
    - id: c
      text: { en: "Member data is structured, and ML models can learn only from unstructured data.", fr: "Les données des membres sont structurées, et les modèles de ML n'apprennent qu'à partir de données non structurées." }
    - id: d
      text: { en: "A yes-or-no decision requires a regression model instead of a classification model.", fr: "Une décision oui ou non exige un modèle de régression plutôt qu'un modèle de classification." }
answer: { optionId: b }
explanation:
  correct:
    en: "The entitlement is defined by a fixed, contractual rule: 50 flights or more. ML outputs are probabilistic, so even an accurate model would misclassify some members, which the audit would flag. A simple rule that counts flights gives the exact, explainable result every time."
    fr: "Le droit au statut est défini par une règle fixe et contractuelle : au moins 50 vols. Les sorties du ML sont probabilistes : même un modèle exact se tromperait pour certains membres, ce que l'audit relèverait. Une simple règle qui compte les vols donne le résultat exact et explicable à chaque fois."
  options:
    a:
      en: "Classification models commonly use numeric features; the issue is that the outcome is already defined by a rule."
      fr: "Les modèles de classification utilisent couramment des caractéristiques numériques ; le problème est que le résultat est déjà défini par une règle."
    c:
      en: "Many ML models are trained on structured, tabular data; the type of data is not the issue."
      fr: "De nombreux modèles de ML sont entraînés sur des données tabulaires structurées ; le type de données n'est pas en cause."
    d:
      en: "A yes-or-no decision is a binary classification task, not a regression task; in any case, no model is needed."
      fr: "Une décision oui ou non est une tâche de classification binaire, pas de régression ; de toute façon, aucun modèle n'est nécessaire."
references:
  - title: "ML problem framing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/ml-problem-framing.html
