id: aifc01-1b-notml-shipping-table
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company is reviewing four automation projects. Which project is the BEST fit for a rules-based solution instead of an ML solution?
  fr: |
    Une entreprise de vente au détail étudie quatre projets d'automatisation. Quel projet se prête le MIEUX à une solution à base de règles plutôt qu'à une solution de ML ?
body:
  options:
    - id: a
      text: { en: "Recommend products to each customer based on browsing history", fr: "Recommander des produits à chaque client en fonction de son historique de navigation" }
    - id: b
      text: { en: "Forecast next month's demand for each product from past sales", fr: "Prévoir la demande du mois prochain pour chaque produit à partir des ventes passées" }
    - id: c
      text: { en: "Detect damaged items in photos taken at the returns desk", fr: "Détecter les articles endommagés sur les photos prises au comptoir des retours" }
    - id: d
      text: { en: "Apply the carrier's published rate table to set each shipping fee", fr: "Appliquer la grille tarifaire publiée par le transporteur pour fixer chaque frais de port" }
answer: { optionId: d }
explanation:
  correct:
    en: "The shipping fee is fully defined by a published table (for example, by weight and destination zone), so a lookup in code returns the exact fee every time. ML adds data, training and hosting costs, and its predictions could differ from the table."
    fr: "Les frais de port sont entièrement définis par une grille publiée (par exemple selon le poids et la zone de destination) : une recherche dans le code renvoie le montant exact à chaque fois. Le ML ajouterait des coûts de données, d'entraînement et d'hébergement, et ses prédictions pourraient s'écarter de la grille."
  options:
    a:
      en: "Recommendations depend on patterns in user behavior that are hard to write as rules; this is a typical ML use case."
      fr: "Les recommandations dépendent de tendances du comportement des utilisateurs difficiles à écrire sous forme de règles ; c'est un cas d'usage typique du ML."
    b:
      en: "Demand forecasting learns patterns such as seasonality from historical data; no fixed rule gives the answer."
      fr: "La prévision de la demande apprend des tendances comme la saisonnalité à partir de l'historique ; aucune règle fixe ne donne la réponse."
    c:
      en: "Recognizing damage in images is a computer vision task that rules cannot describe reliably."
      fr: "Reconnaître des dommages sur des images est une tâche de vision par ordinateur que des règles ne peuvent pas décrire de façon fiable."
references:
  - title: "ML problem framing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/ml-problem-framing.html
