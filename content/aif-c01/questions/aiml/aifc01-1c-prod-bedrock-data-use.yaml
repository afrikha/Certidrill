id: aifc01-1c-prod-bedrock-data-use
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A law firm wants to use a third-party foundation model through Amazon Bedrock. The firm's compliance team is concerned that client documents in prompts could be used to train models or be shared with the model provider.

    Which statement addresses this concern?
  fr: |
    Un cabinet d'avocats veut utiliser un modèle de fondation tiers par Amazon Bedrock. L'équipe de conformité craint que les documents des clients contenus dans les invites servent à entraîner des modèles ou soient partagés avec le fournisseur du modèle.

    Quelle affirmation répond à cette inquiétude ?
body:
  options:
    - { id: a, text: { en: "Bedrock does not share inputs and outputs with model providers or use them to train the models.", fr: "Bedrock ne partage pas les entrées et les sorties avec les fournisseurs de modèles et ne les utilise pas pour entraîner les modèles." } }
    - { id: b, text: { en: "The firm must self-host the model on Amazon EC2, because a managed API always shares prompts.", fr: "Le cabinet doit autohéberger le modèle sur Amazon EC2, car une API gérée partage toujours les invites." } }
    - { id: c, text: { en: "The firm must opt out of model training in the Bedrock console before sending prompts.", fr: "Le cabinet doit désactiver l'entraînement des modèles dans la console Bedrock avant d'envoyer des invites." } }
    - { id: d, text: { en: "Prompts are shared with the provider only when the firm uses Provisioned Throughput.", fr: "Les invites ne sont partagées avec le fournisseur que si le cabinet utilise le débit provisionné." } }
answer: { optionId: a }
explanation:
  correct:
    en: "With Amazon Bedrock, inputs and model outputs are not shared with model providers, and neither AWS nor the third-party providers use them to train their models. Models run in deployment accounts operated by the Bedrock service team, which providers cannot access."
    fr: "Avec Amazon Bedrock, les entrées et les sorties des modèles ne sont pas partagées avec les fournisseurs de modèles, et ni AWS ni les fournisseurs tiers ne les utilisent pour entraîner leurs modèles. Les modèles s'exécutent dans des comptes de déploiement gérés par l'équipe du service Bedrock, auxquels les fournisseurs n'ont pas accès."
  options:
    b:
      en: "Self-hosting is not required for this concern: the managed service already keeps prompts away from providers and out of training."
      fr: "L'autohébergement n'est pas nécessaire pour cette inquiétude : le service géré tient déjà les invites à l'écart des fournisseurs et de l'entraînement."
    c:
      en: "There is no opt-out to set: Bedrock does not use customer inputs and outputs for training by default."
      fr: "Il n'y a pas de désactivation à configurer : Bedrock n'utilise pas par défaut les entrées et les sorties des clients pour l'entraînement."
    d:
      en: "The throughput option changes capacity and billing, not data handling; prompts are not shared with providers in any mode."
      fr: "L'option de débit change la capacité et la facturation, pas le traitement des données ; les invites ne sont partagées avec les fournisseurs dans aucun mode."
references:
  - title: Amazon Bedrock FAQs
    url: https://aws.amazon.com/bedrock/faqs/
  - title: Data protection
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
