id: aifc01-1b-pipe-tune-settings
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team has prepared its training data and selected an algorithm. It now runs many training jobs with different learning rates, numbers of epochs, and numbers of hidden layers, and it keeps the combination that gives the best score on the validation data. Which component of the ML pipeline is the team performing?
  fr: |
    Une équipe a préparé ses données d'entraînement et choisi un algorithme. Elle exécute maintenant de nombreuses tâches d'entraînement avec différents taux d'apprentissage, nombres d'époques et nombres de couches cachées, et conserve la combinaison qui donne le meilleur score sur les données de validation. Quel composant du pipeline ML l'équipe réalise-t-elle ?
body:
  options:
    - id: a
      text: { en: "Feature engineering", fr: "Ingénierie des caractéristiques (feature engineering)" }
    - id: b
      text: { en: "Data augmentation", fr: "Augmentation des données" }
    - id: c
      text: { en: "Model monitoring", fr: "Surveillance du modèle" }
    - id: d
      text: { en: "Hyperparameter tuning", fr: "Réglage des hyperparamètres" }
answer: { optionId: d }
explanation:
  correct:
    en: "Hyperparameters are settings that control the training process, such as the learning rate, the number of epochs, and the number of hidden layers. Hyperparameter tuning is the part of model development that searches for the values that give the best validation metric."
    fr: "Les hyperparamètres sont des paramètres qui contrôlent le processus d'entraînement, comme le taux d'apprentissage, le nombre d'époques et le nombre de couches cachées. Le réglage des hyperparamètres est la partie du développement du modèle qui recherche les valeurs donnant la meilleure métrique de validation."
  options:
    a:
      en: "Feature engineering changes the input variables of the model; the team changes training settings, not features."
      fr: "L'ingénierie des caractéristiques modifie les variables d'entrée du modèle ; l'équipe modifie des paramètres d'entraînement, pas des caractéristiques."
    b:
      en: "Data augmentation synthesizes new training data from existing data; the data is unchanged here."
      fr: "L'augmentation des données synthétise de nouvelles données d'entraînement à partir des données existantes ; ici, les données ne changent pas."
    c:
      en: "Model monitoring tracks a deployed model in production; the model is still being trained."
      fr: "La surveillance du modèle suit un modèle déployé en production ; le modèle est encore en cours d'entraînement."
references:
  - title: "Model training and tuning - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/model-training-and-tuning.html
