id: aifc01-1c-mlops-tech-debt
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's credit model is built from notebooks that team members copy and edit by hand. The feature code differs between training and production, and nobody can reproduce the model that was deployed last quarter.

    Which practice will reduce this technical debt?
  fr: |
    Le modèle de crédit d'une banque est créé à partir de notebooks que les membres de l'équipe copient et modifient à la main. Le code des caractéristiques diffère entre l'entraînement et la production, et personne ne peut reproduire le modèle déployé le trimestre dernier.

    Quelle pratique réduira cette dette technique ?
body:
  options:
    - { id: a, text: { en: "Version the code, data and models, and replace manual notebook steps with an automated pipeline.", fr: "Versionner le code, les données et les modèles, et remplacer les étapes manuelles des notebooks par un pipeline automatisé." } }
    - { id: b, text: { en: "Keep every step in one shared notebook that a single expert maintains and runs.", fr: "Garder toutes les étapes dans un seul notebook partagé, maintenu et exécuté par un seul expert." } }
    - { id: c, text: { en: "Retrain the model by hand every month from the most recent copy of the notebook.", fr: "Réentraîner le modèle à la main chaque mois à partir de la copie la plus récente du notebook." } }
    - { id: d, text: { en: "Add more input features to the model to raise its accuracy before the next release.", fr: "Ajouter des caractéristiques d'entrée au modèle pour augmenter son exactitude avant la prochaine version." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Technical debt in ML comes from manual, undocumented and unversioned steps. Treating everything as code, versioning data, code and models, and automating each step in a pipeline makes training reproducible and keeps feature code consistent between training and production."
    fr: "La dette technique en ML vient d'étapes manuelles, non documentées et non versionnées. Tout traiter comme du code, versionner les données, le code et les modèles, et automatiser chaque étape dans un pipeline rend l'entraînement reproductible et garde un code de caractéristiques cohérent entre l'entraînement et la production."
  options:
    b:
      en: "A single notebook owned by one person is still manual and unversioned, and it creates a dependency on that person."
      fr: "Un seul notebook détenu par une personne reste manuel et non versionné, et crée une dépendance envers cette personne."
    c:
      en: "Manual monthly retraining from copied notebooks keeps the same reproducibility problem."
      fr: "Un réentraînement manuel mensuel à partir de notebooks copiés garde le même problème de reproductibilité."
    d:
      en: "More features add complexity without fixing the manual process or the mismatch between training and production."
      fr: "Plus de caractéristiques ajoutent de la complexité sans corriger le processus manuel ni l'écart entre l'entraînement et la production."
references:
  - title: Why Should You Use MLOps?
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-projects-why.html
