id: aifc01-1a-rel-tabular-traditional-ml
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecommunications company wants to predict which customers will cancel their subscription. It has a table of 5,000 customer records with 12 columns. Business analysts must be able to understand how the model reaches each prediction.

    Which approach is MOST suitable?
  fr: |
    Une entreprise de télécommunications veut prédire quels clients vont résilier leur abonnement. Elle dispose d'une table de 5 000 enregistrements clients avec 12 colonnes. Les analystes métier doivent pouvoir comprendre comment le modèle parvient à chaque prédiction.

    Quelle approche est la PLUS adaptée ?
body:
  options:
    - { id: a, text: { en: "A traditional ML model, such as a decision tree, trained on the customer table", fr: "Un modèle de ML traditionnel, comme un arbre de décision, entraîné sur la table des clients" } }
    - { id: b, text: { en: "A deep learning model with many hidden layers trained on the customer table", fr: "Un modèle de deep learning à nombreuses couches cachées entraîné sur la table des clients" } }
    - { id: c, text: { en: "A generative AI model that writes a description of each customer", fr: "Un modèle d'IA générative qui rédige une description de chaque client" } }
    - { id: d, text: { en: "An image generation model that creates charts of customer behavior", fr: "Un modèle de génération d'images qui crée des graphiques du comportement des clients" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Traditional ML suits structured data such as a customer table and needs far less data than deep learning. Models such as decision trees are easier to interpret, so analysts can follow how a churn prediction is reached."
    fr: "Le ML traditionnel convient aux données structurées comme une table de clients et nécessite bien moins de données que le deep learning. Des modèles comme les arbres de décision sont plus faciles à interpréter : les analystes peuvent suivre comment une prédiction de résiliation est obtenue."
  options:
    b:
      en: "Deep learning needs much more data than 5,000 records and is mathematically complex, so its predictions are harder to interpret."
      fr: "Le deep learning a besoin de bien plus de données que 5 000 enregistrements et il est mathématiquement complexe : ses prédictions sont plus difficiles à interpréter."
    c:
      en: "Generating text about each customer does not predict who will cancel; churn prediction is a classification task."
      fr: "Générer du texte sur chaque client ne prédit pas qui va résilier ; la prédiction de résiliation est une tâche de classification."
    d:
      en: "Creating images does not produce a churn prediction; the requirement is to predict an outcome from tabular data."
      fr: "Créer des images ne produit pas de prédiction de résiliation ; l'exigence est de prédire un résultat à partir de données tabulaires."
references:
  - title: "Deep Learning vs Machine Learning - Difference Between Data Technologies - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-machine-learning-and-deep-learning/
