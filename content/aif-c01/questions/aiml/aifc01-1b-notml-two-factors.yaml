id: aifc01-1b-notml-two-factors
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is assessing whether to use ML for several back-office processes.

    Which two characteristics of a process indicate that an ML solution is NOT appropriate? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une compagnie d'assurance évalue l'utilisation du ML pour plusieurs processus administratifs.

    Quelles sont les deux caractéristiques d'un processus qui indiquent qu'une solution de ML n'est PAS appropriée ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The process handles several million records each day.", fr: "Le processus traite plusieurs millions d'enregistrements chaque jour." } }
    - { id: b, text: { en: "The result must follow a regulatory formula exactly.", fr: "Le résultat doit suivre exactement une formule réglementaire." } }
    - { id: c, text: { en: "The patterns in the data change from month to month.", fr: "Les tendances des données changent d'un mois à l'autre." } }
    - { id: d, text: { en: "Only a few dozen historical examples are available.", fr: "Seules quelques dizaines d'exemples historiques sont disponibles." } }
    - { id: e, text: { en: "The input data is free-form text written by customers.", fr: "Les données d'entrée sont des textes libres rédigés par les clients." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "When the result is fully defined by a formula or rule, deterministic code gives the exact outcome and a probabilistic prediction adds only risk and cost. When only a few examples exist, there is not enough relevant data for a model to learn and generalize. Both point to a non-ML solution."
    fr: "Quand le résultat est entièrement défini par une formule ou une règle, du code déterministe donne le résultat exact, et une prédiction probabiliste n'ajoute que du risque et des coûts. Quand seuls quelques exemples existent, il n'y a pas assez de données pertinentes pour qu'un modèle apprenne et généralise. Les deux orientent vers une solution sans ML."
  options:
    a:
      en: "High volume is a reason to automate, and ML scales to millions of records; volume alone does not rule ML out."
      fr: "Un volume élevé est une raison d'automatiser, et le ML passe à l'échelle de millions d'enregistrements ; le volume seul n'exclut pas le ML."
    c:
      en: "Changing patterns are hard to maintain as hand-written rules; a model can be retrained on new data, so this often favors ML."
      fr: "Des tendances changeantes sont difficiles à maintenir sous forme de règles écrites à la main ; un modèle peut être réentraîné sur de nouvelles données, ce qui favorise souvent le ML."
    e:
      en: "Free-form text is handled well by NLP models; unstructured input is not a reason to avoid ML."
      fr: "Les textes libres sont bien traités par les modèles de NLP ; des entrées non structurées ne sont pas une raison d'éviter le ML."
references:
  - title: "ML problem framing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/ml-problem-framing.html
  - title: "Business goal identification - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/business-goal-identification.html
