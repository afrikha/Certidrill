id: aifc01-1b-tech-house-price
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A real estate company has a dataset of past home sales. Each record contains the floor area, the number of rooms, the location, and the final sale price. The company wants to estimate the sale price of new listings. Which ML technique should the company use?
  fr: |
    Une agence immobilière dispose d'un jeu de données de ventes de logements passées. Chaque enregistrement contient la surface, le nombre de pièces, l'emplacement et le prix de vente final. L'agence souhaite estimer le prix de vente des nouvelles annonces. Quelle technique de ML l'agence doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Clustering", fr: "Clustering" }
    - id: b
      text: { en: "Binary classification", fr: "Classification binaire" }
    - id: c
      text: { en: "Regression", fr: "Régression" }
    - id: d
      text: { en: "Dimensionality reduction", fr: "Réduction de dimensionnalité" }
answer: { optionId: c }
explanation:
  correct:
    en: "Regression is a supervised learning technique that predicts a numeric, continuous value from labeled examples. The past sale prices are the labels, and the model learns to estimate the price of a new home from its features."
    fr: "La régression est une technique d'apprentissage supervisé qui prédit une valeur numérique continue à partir d'exemples étiquetés. Les prix de vente passés sont les étiquettes, et le modèle apprend à estimer le prix d'un nouveau logement à partir de ses caractéristiques."
  options:
    a:
      en: "Clustering groups similar records without labels; it does not predict a price."
      fr: "Le clustering regroupe des enregistrements similaires sans étiquettes ; il ne prédit pas de prix."
    b:
      en: "Binary classification predicts one of two categories, such as sold or not sold, not a numeric amount."
      fr: "La classification binaire prédit l'une de deux catégories, comme vendu ou non vendu, pas un montant numérique."
    d:
      en: "Dimensionality reduction removes or combines features during data preparation; it does not make the price prediction."
      fr: "La réduction de dimensionnalité supprime ou combine des caractéristiques pendant la préparation des données ; elle ne produit pas la prédiction de prix."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
