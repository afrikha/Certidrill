id: aifc01-1b-app-also-bought
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An ecommerce company wants to show a "Frequently bought together" section on each product page. The items shown must be based on the past purchases and clicks of all its shoppers. Which type of AI application meets this requirement?
  fr: |
    Une entreprise d'e-commerce souhaite afficher une section « Souvent achetés ensemble » sur chaque page produit. Les articles affichés doivent être fondés sur les achats et les clics passés de l'ensemble de ses clients. Quel type d'application d'IA répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Recommendation system", fr: "Système de recommandation" }
    - id: b
      text: { en: "Fraud detection", fr: "Détection de fraude" }
    - id: c
      text: { en: "Demand forecasting", fr: "Prévision de la demande" }
    - id: d
      text: { en: "Computer vision", fr: "Vision par ordinateur" }
answer: { optionId: a }
explanation:
  correct:
    en: "A recommendation system learns from interaction data, such as purchases and clicks, to suggest relevant items to users. Amazon Personalize is the AWS managed service for this use case, with recommenders such as Frequently bought together for ecommerce."
    fr: "Un système de recommandation apprend à partir des données d'interaction, comme les achats et les clics, pour suggérer des articles pertinents aux utilisateurs. Amazon Personalize est le service géré AWS pour ce cas d'usage, avec des recommandations comme « Frequently bought together » pour l'e-commerce."
  options:
    b:
      en: "Fraud detection identifies suspicious transactions or accounts; it does not suggest products."
      fr: "La détection de fraude identifie les transactions ou comptes suspects ; elle ne suggère pas de produits."
    c:
      en: "Demand forecasting predicts future sales volumes; it does not choose which items to show to a shopper."
      fr: "La prévision de la demande prédit les volumes de ventes futurs ; elle ne choisit pas les articles à montrer à un client."
    d:
      en: "Computer vision analyzes images; the input here is purchase and click history."
      fr: "La vision par ordinateur analyse des images ; ici, l'entrée est l'historique des achats et des clics."
references:
  - title: "What is Amazon Personalize?"
    url: https://docs.aws.amazon.com/personalize/latest/dg/what-is-personalize.html
