id: aifc01-1b-tech-segments-unlabeled
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company wants to divide its customers into groups that have similar purchasing behavior so that it can design a campaign for each group. The company has transaction histories but no predefined groups or labels. Which ML technique should the company use?
  fr: |
    Une entreprise de vente au détail souhaite répartir ses clients en groupes ayant un comportement d'achat similaire afin de concevoir une campagne pour chaque groupe. L'entreprise dispose d'historiques de transactions, mais d'aucun groupe prédéfini ni d'aucune étiquette. Quelle technique de ML l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Multi-class classification", fr: "Classification multiclasse" }
    - id: b
      text: { en: "Regression", fr: "Régression" }
    - id: c
      text: { en: "Time-series forecasting", fr: "Prévision de séries chronologiques" }
    - id: d
      text: { en: "Clustering", fr: "Clustering" }
answer: { optionId: d }
explanation:
  correct:
    en: "Clustering is an unsupervised learning technique that groups similar records together without labels, for example high-, medium- and low-spending customers found from their transaction histories."
    fr: "Le clustering est une technique d'apprentissage non supervisé qui regroupe des enregistrements similaires sans étiquettes, par exemple des clients à forte, moyenne et faible dépense identifiés à partir de leurs historiques de transactions."
  options:
    a:
      en: "Multi-class classification needs predefined categories and labeled examples, which the company does not have."
      fr: "La classification multiclasse exige des catégories prédéfinies et des exemples étiquetés, dont l'entreprise ne dispose pas."
    b:
      en: "Regression predicts a numeric value for each customer; it does not form groups."
      fr: "La régression prédit une valeur numérique pour chaque client ; elle ne forme pas de groupes."
    c:
      en: "Forecasting predicts future values of a series over time, such as sales next month, not customer segments."
      fr: "La prévision prédit les valeurs futures d'une série dans le temps, comme les ventes du mois prochain, pas des segments de clients."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
