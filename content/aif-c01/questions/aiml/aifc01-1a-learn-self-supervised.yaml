id: aifc01-1a-learn-self-supervised
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A model provider pretrains a foundation model on billions of sentences of unlabeled text. During pretraining, the model learns by predicting the next token of each sentence, so the training data provides its own labels and no human annotation is needed.

    Which type of learning is this?
  fr: |
    Un fournisseur de modèles pré-entraîne un modèle de fondation sur des milliards de phrases de texte non étiqueté. Pendant le pré-entraînement, le modèle apprend en prédisant le jeton suivant de chaque phrase : les données d'entraînement fournissent leurs propres étiquettes et aucune annotation humaine n'est nécessaire.

    De quel type d'apprentissage s'agit-il ?
body:
  options:
    - { id: a, text: { en: "Self-supervised learning", fr: "Apprentissage autosupervisé" } }
    - { id: b, text: { en: "Supervised learning", fr: "Apprentissage supervisé" } }
    - { id: c, text: { en: "Reinforcement learning", fr: "Apprentissage par renforcement" } }
    - { id: d, text: { en: "Semi-supervised learning", fr: "Apprentissage semi-supervisé" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Foundation models are pretrained with self-supervised learning: they generate their own labels from the input data, for example the next token in a sentence. This lets them learn from very large amounts of unlabeled data without human-labeled training sets."
    fr: "Les modèles de fondation sont pré-entraînés par apprentissage autosupervisé : ils génèrent leurs propres étiquettes à partir des données d'entrée, par exemple le jeton suivant d'une phrase. Cela leur permet d'apprendre à partir de très grandes quantités de données non étiquetées, sans jeux d'entraînement étiquetés par des humains."
  options:
    b:
      en: "Supervised learning uses examples that people labeled with the correct output; here no human annotation is used."
      fr: "L'apprentissage supervisé utilise des exemples que des personnes ont étiquetés avec la sortie correcte ; ici, aucune annotation humaine n'est utilisée."
    c:
      en: "Reinforcement learning trains an agent through rewards for its actions in an environment; next-token prediction does not use rewards."
      fr: "L'apprentissage par renforcement entraîne un agent grâce aux récompenses de ses actions dans un environnement ; la prédiction du jeton suivant n'utilise pas de récompenses."
    d:
      en: "Semi-supervised learning combines a small set of human-labeled data with unlabeled data; no human-labeled data is used here."
      fr: "L'apprentissage semi-supervisé combine un petit ensemble de données étiquetées par des humains et des données non étiquetées ; aucune donnée étiquetée par des humains n'est utilisée ici."
references:
  - title: "What are Foundation Models? - Foundation Models in Generative AI Explained - AWS"
    url: https://aws.amazon.com/what-is/foundation-models/
