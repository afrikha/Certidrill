id: aifc01-1c-src-jumpstart-catalog
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data science team wants to browse a catalog of open-source pretrained models, select one, and deploy it to an endpoint in its own AWS account from Amazon SageMaker Studio. The team also wants the option to fine-tune the selected model later.

    Which AWS service or feature will meet these requirements?
  fr: |
    Une équipe de science des données veut parcourir un catalogue de modèles open source préentraînés, en choisir un et le déployer sur un point de terminaison de son propre compte AWS depuis Amazon SageMaker Studio. L'équipe veut aussi pouvoir peaufiner (fine-tuning) le modèle choisi plus tard.

    Quel service ou quelle fonctionnalité AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon SageMaker Feature Store" }
    - { id: b, text: "Amazon SageMaker JumpStart" }
    - { id: c, text: "Amazon SageMaker HyperPod" }
    - { id: d, text: "Amazon SageMaker Model Registry" }
answer: { optionId: b }
explanation:
  correct:
    en: "SageMaker JumpStart provides pretrained open-source and other publicly available models for many problem types. From Studio, the team can deploy, fine-tune and evaluate a selected model without building it from scratch."
    fr: "SageMaker JumpStart fournit des modèles préentraînés open source et d'autres modèles publics pour de nombreux types de problèmes. Depuis Studio, l'équipe peut déployer, peaufiner et évaluer un modèle choisi sans le créer de zéro."
  options:
    a:
      en: "Feature Store stores and shares ML features for training and inference; it is not a catalog of pretrained models."
      fr: "Feature Store stocke et partage des caractéristiques (features) de ML pour l'entraînement et l'inférence ; ce n'est pas un catalogue de modèles préentraînés."
    c:
      en: "HyperPod provisions resilient clusters for large-scale training of foundation models; it does not offer a catalog of ready-to-deploy models."
      fr: "HyperPod provisionne des clusters résilients pour l'entraînement à grande échelle de modèles de fondation ; il ne propose pas de catalogue de modèles prêts à déployer."
    d:
      en: "Model Registry catalogs the versions of models the team has already trained; it does not provide third-party pretrained models."
      fr: "Model Registry catalogue les versions des modèles que l'équipe a déjà entraînés ; il ne fournit pas de modèles préentraînés tiers."
references:
  - title: SageMaker JumpStart pretrained models
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html
