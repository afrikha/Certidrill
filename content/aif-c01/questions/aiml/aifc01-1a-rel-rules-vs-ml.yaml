id: aifc01-1a-rel-rules-vs-ml
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Bank A flags suspicious transactions by using if-then rules that fraud experts wrote by hand. Bank B flags suspicious transactions by using a model that learned patterns from millions of historical transactions that were labeled as fraudulent or genuine.

    Which statement is correct?
  fr: |
    La banque A signale les transactions suspectes à l'aide de règles si-alors écrites à la main par des experts de la fraude. La banque B signale les transactions suspectes à l'aide d'un modèle qui a appris des schémas à partir de millions de transactions historiques étiquetées comme frauduleuses ou authentiques.

    Quelle affirmation est correcte ?
body:
  options:
    - { id: a, text: { en: "Both systems are ML, because both make decisions about transactions.", fr: "Les deux systèmes relèvent du ML, car tous deux prennent des décisions sur des transactions." } }
    - { id: b, text: { en: "Only Bank A uses AI, because ML is a separate field from AI.", fr: "Seule la banque A utilise l'IA, car le ML est un domaine distinct de l'IA." } }
    - { id: c, text: { en: "Both systems can be described as AI, but only Bank B uses ML.", fr: "Les deux systèmes peuvent être qualifiés d'IA, mais seule la banque B utilise le ML." } }
    - { id: d, text: { en: "Neither system is AI, because neither generates new content.", fr: "Aucun des deux systèmes n'est de l'IA, car aucun ne génère de nouveau contenu." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AI is an umbrella term, and not all AI is ML: a system that follows rules written by experts is a form of AI without learning from data. ML is the branch of AI that learns patterns from historical data, which is what Bank B's model does."
    fr: "L'IA est un terme général, et toute l'IA n'est pas du ML : un système qui suit des règles écrites par des experts est une forme d'IA qui n'apprend pas à partir des données. Le ML est la branche de l'IA qui apprend des schémas à partir de données historiques, ce que fait le modèle de la banque B."
  options:
    a:
      en: "Bank A's rules are written by people and do not learn from data, so they are not ML."
      fr: "Les règles de la banque A sont écrites par des personnes et n'apprennent pas à partir des données : ce n'est pas du ML."
    b:
      en: "ML is a branch of AI, so Bank B's model is also AI."
      fr: "Le ML est une branche de l'IA : le modèle de la banque B relève donc aussi de l'IA."
    d:
      en: "Generating content is what generative AI does; AI also includes systems that classify or flag data."
      fr: "Générer du contenu est le rôle de l'IA générative ; l'IA comprend aussi des systèmes qui classent ou signalent des données."
references:
  - title: "What is AI? - Artificial Intelligence Explained - AWS"
    url: https://aws.amazon.com/what-is/artificial-intelligence/
  - title: "What is Machine Learning? - ML Technology Explained - AWS"
    url: https://aws.amazon.com/what-is/machine-learning/
