id: aifc01-1a-value-assist-radiology
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hospital deploys a model that analyzes each new scan and highlights areas that might show a tumor. Radiologists review the highlighted areas first, and a radiologist still makes every diagnosis.

    Which statement describes how AI provides value in this solution?
  fr: |
    Un hôpital déploie un modèle qui analyse chaque nouvel examen d'imagerie et met en évidence les zones susceptibles de montrer une tumeur. Les radiologues examinent d'abord les zones mises en évidence, et c'est toujours un radiologue qui pose chaque diagnostic.

    Quelle affirmation décrit la manière dont l'IA apporte de la valeur dans cette solution ?
body:
  options:
    - { id: a, text: { en: "It automates the diagnosis, so radiologists no longer review scans.", fr: "Elle automatise le diagnostic : les radiologues n'examinent plus les images." } }
    - { id: b, text: { en: "It removes the need for labeled scans to train the model.", fr: "Elle supprime le besoin d'images étiquetées pour entraîner le modèle." } }
    - { id: c, text: { en: "It assists the radiologists, who keep the final decision.", fr: "Elle assiste les radiologues, qui gardent la décision finale." } }
    - { id: d, text: { en: "It reduces the cost of storing scans in the hospital.", fr: "Elle réduit le coût de stockage des images à l'hôpital." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The model assists human decision making: it analyzes every scan and points the radiologists to the areas that most need attention, while the diagnosis stays with a human expert. AWS cites medical image analysis for early disease detection as an example of this kind of value."
    fr: "Le modèle aide à la prise de décision humaine : il analyse chaque examen et oriente les radiologues vers les zones qui demandent le plus d'attention, tandis que le diagnostic reste du ressort d'un expert humain. AWS cite l'analyse d'images médicales pour la détection précoce de maladies comme exemple de ce type de valeur."
  options:
    a:
      en: "A radiologist still makes every diagnosis, so the decision is not automated."
      fr: "C'est toujours un radiologue qui pose chaque diagnostic : la décision n'est pas automatisée."
    b:
      en: "A model that detects tumors is typically trained on scans labeled by experts; the solution does not remove that need."
      fr: "Un modèle qui détecte des tumeurs est généralement entraîné sur des images étiquetées par des experts ; la solution ne supprime pas ce besoin."
    d:
      en: "The model analyzes scans; it does not change how or where they are stored."
      fr: "Le modèle analyse les images ; il ne change ni la manière ni l'endroit où elles sont stockées."
references:
  - title: "What is AI? - Artificial Intelligence Explained - AWS"
    url: https://aws.amazon.com/what-is/artificial-intelligence/
