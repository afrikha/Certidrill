id: aifc01-1a-rel-deep-learning-features
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company compares traditional machine learning (ML) with deep learning for a project that analyzes millions of photos.

    Which characteristic distinguishes deep learning from traditional ML?
  fr: |
    Une entreprise de médias compare le machine learning (ML) traditionnel et le deep learning pour un projet qui analyse des millions de photos.

    Quelle caractéristique distingue le deep learning du ML traditionnel ?
body:
  options:
    - { id: a, text: { en: "It needs fewer training examples per feature than traditional ML.", fr: "Il a besoin de moins d'exemples d'entraînement par caractéristique que le ML traditionnel." } }
    - { id: b, text: { en: "It is easier to interpret than a decision tree model.", fr: "Il est plus facile à interpréter qu'un modèle d'arbre de décision." } }
    - { id: c, text: { en: "It needs less compute and storage than traditional ML.", fr: "Il a besoin de moins de capacité de calcul et de stockage que le ML traditionnel." } }
    - { id: d, text: { en: "It learns relevant features from raw data with minimal manual feature engineering.", fr: "Il apprend les caractéristiques pertinentes à partir des données brutes, avec une ingénierie manuelle des caractéristiques minimale." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Traditional ML relies on people to select and extract features. Deep learning uses neural networks with many layers that learn relevant features directly from raw, often unstructured, data such as images, audio, and text."
    fr: "Le ML traditionnel repose sur des personnes qui sélectionnent et extraient les caractéristiques. Le deep learning utilise des réseaux neuronaux à nombreuses couches qui apprennent les caractéristiques pertinentes directement à partir de données brutes, souvent non structurées, comme des images, de l'audio et du texte."
  options:
    a:
      en: "Deep learning needs much more data, typically thousands of data points per feature."
      fr: "Le deep learning a besoin de beaucoup plus de données, généralement des milliers de points de données par caractéristique."
    b:
      en: "Deep learning models are mathematically complex and harder to interpret than simpler models such as decision trees."
      fr: "Les modèles de deep learning sont mathématiquement complexes et plus difficiles à interpréter que des modèles plus simples comme les arbres de décision."
    c:
      en: "Deep learning demands more storage and computational power than traditional ML."
      fr: "Le deep learning exige plus de stockage et de puissance de calcul que le ML traditionnel."
references:
  - title: "Deep Learning vs Machine Learning - Difference Between Data Technologies - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-machine-learning-and-deep-learning/
  - title: "What is Deep Learning? - Deep Learning AI Explained - AWS"
    url: https://aws.amazon.com/what-is/deep-learning/
