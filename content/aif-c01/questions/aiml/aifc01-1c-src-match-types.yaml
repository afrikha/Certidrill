id: aifc01-1c-src-match-types
objective: "1.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company's AI team is classifying the foundation models (FMs) it might use.

    Match each description with the correct type of model source. Each source can be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe IA d'une entreprise classe les modèles de fondation (FM) qu'elle pourrait utiliser.

    Associez chaque description au type de source de modèle correct. Chaque source peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: open, text: { en: "Open-source pretrained model", fr: "Modèle open source préentraîné" } }
    - { id: prop, text: { en: "Proprietary pretrained model", fr: "Modèle propriétaire préentraîné" } }
    - { id: scratch, text: { en: "Custom model trained from scratch", fr: "Modèle personnalisé entraîné de zéro" } }
    - { id: tuned, text: { en: "Fine-tuned model", fr: "Modèle peaufiné (fine-tuned)" } }
    - { id: rules, text: { en: "Rule-based system", fr: "Système à base de règles" } }
  targets:
    - id: t1
      text: { en: "Its weights are published under a license and can be downloaded from a public model hub.", fr: "Ses pondérations sont publiées sous licence et peuvent être téléchargées depuis un hub public de modèles." }
    - id: t2
      text: { en: "It is offered only through its provider's API, and its weights are not shared.", fr: "Il est proposé uniquement par l'API de son fournisseur, et ses pondérations ne sont pas partagées." }
    - id: t3
      text: { en: "The company defines its architecture and vocabulary and trains all of its weights on its own data.", fr: "L'entreprise définit son architecture et son vocabulaire et entraîne toutes ses pondérations sur ses propres données." }
    - id: t4
      text: { en: "An existing pretrained model whose weights were adjusted with labeled company examples.", fr: "Un modèle préentraîné existant dont les pondérations ont été ajustées avec des exemples étiquetés de l'entreprise." }
answer:
  mapping: { t1: open, t2: prop, t3: scratch, t4: tuned }
explanation:
  correct:
    en: "Open-source (open-weight) models publish their weights under a license, often on a hub such as Hugging Face. Proprietary models are used through the provider's API without access to the weights. A model trained from scratch has an architecture, vocabulary and weights defined by the company. A fine-tuned model starts from pretrained weights and adjusts them with labeled input-output examples."
    fr: "Les modèles open source (à pondérations ouvertes) publient leurs pondérations sous licence, souvent sur un hub comme Hugging Face. Les modèles propriétaires s'utilisent par l'API du fournisseur, sans accès aux pondérations. Un modèle entraîné de zéro a une architecture, un vocabulaire et des pondérations définis par l'entreprise. Un modèle peaufiné part de pondérations préentraînées et les ajuste avec des exemples d'entrée-sortie étiquetés."
  options:
    rules:
      en: "A rule-based system follows rules written by people; it is not a model that learns weights from data."
      fr: "Un système à base de règles suit des règles écrites par des personnes ; ce n'est pas un modèle qui apprend des pondérations à partir de données."
references:
  - title: Customize your model to improve its performance for your use case
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
  - title: Use Custom model import to import a customized open-source model into Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html
