id: aifc01-1c-svc-registry-approval
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A training pipeline in Amazon SageMaker AI produces a new version of a fraud model every week. The ML team must catalog every version with its training metrics, and a reviewer must set each version as approved before the CI/CD process deploys it to production.

    Which AWS service or feature will meet these requirements?
  fr: |
    Un pipeline d'entraînement d'Amazon SageMaker AI produit chaque semaine une nouvelle version d'un modèle de détection de fraude. L'équipe ML doit cataloguer chaque version avec ses métriques d'entraînement, et un réviseur doit marquer chaque version comme approuvée avant que le processus CI/CD ne la déploie en production.

    Quel service ou quelle fonctionnalité AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon SageMaker Pipelines" }
    - { id: b, text: "Amazon S3 Versioning" }
    - { id: c, text: "Amazon SageMaker Model Registry" }
    - { id: d, text: "Amazon SageMaker Feature Store" }
answer: { optionId: c }
explanation:
  correct:
    en: "SageMaker Model Registry catalogs models for production in model groups, adds a version for each pipeline run, associates metadata such as training metrics, and manages the approval status of each version. CI/CD can deploy only the versions marked as approved."
    fr: "SageMaker Model Registry catalogue les modèles destinés à la production dans des groupes de modèles, ajoute une version à chaque exécution du pipeline, associe des métadonnées comme les métriques d'entraînement et gère le statut d'approbation de chaque version. Le CI/CD peut ne déployer que les versions approuvées."
  options:
    a:
      en: "Pipelines orchestrates the steps that train and register the model, but the catalog of versions and their approval status live in Model Registry."
      fr: "Pipelines orchestre les étapes qui entraînent et enregistrent le modèle, mais le catalogue des versions et leur statut d'approbation se trouvent dans Model Registry."
    b:
      en: "S3 Versioning keeps object versions of the model files, but it has no training metrics catalog or approval status."
      fr: "S3 Versioning conserve des versions d'objets des fichiers du modèle, mais n'a ni catalogue de métriques d'entraînement ni statut d'approbation."
    d:
      en: "Feature Store manages input features for training and inference, not trained model versions."
      fr: "Feature Store gère les caractéristiques d'entrée pour l'entraînement et l'inférence, pas les versions de modèles entraînés."
references:
  - title: Model Registration Deployment with Model Registry
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html
