id: aifc01-1b-fm-delivery-tabular
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A delivery company has two million past orders in a table. Each row contains the distance, the vehicle type, the time of day, and the actual delivery time in minutes. The company wants to predict the delivery time of new orders. Which approach is MOST appropriate?
  fr: |
    Une entreprise de livraison dispose de deux millions de commandes passées dans une table. Chaque ligne contient la distance, le type de véhicule, l'heure de la journée et la durée de livraison réelle en minutes. L'entreprise souhaite prédire la durée de livraison des nouvelles commandes. Quelle approche est la PLUS appropriée ?
body:
  options:
    - id: a
      text: { en: "Prompt a large language model with each order and ask it for an estimate.", fr: "Soumettre chaque commande à un grand modèle de langage dans une invite et lui demander une estimation." }
    - id: b
      text: { en: "Use an image generation model to visualize the delivery routes.", fr: "Utiliser un modèle de génération d'images pour visualiser les itinéraires de livraison." }
    - id: c
      text: { en: "Train a traditional regression model on the labeled historical orders.", fr: "Entraîner un modèle de régression traditionnel sur les commandes historiques étiquetées." }
    - id: d
      text: { en: "Fine-tune a foundation model on the company's delivery driver manuals.", fr: "Effectuer un réglage précis (fine-tuning) d'un modèle de fondation sur les manuels des chauffeurs-livreurs de l'entreprise." }
answer: { optionId: c }
explanation:
  correct:
    en: "This is a narrow, well-defined prediction on structured data, and plenty of labeled examples exist. A traditional supervised regression model, such as XGBoost, is built for this kind of task: it learns from the labeled rows and predicts a numeric value quickly and at a low cost per prediction."
    fr: "Il s'agit d'une prédiction précise et bien définie sur des données structurées, avec de nombreux exemples étiquetés. Un modèle de régression supervisé traditionnel, comme XGBoost, est conçu pour ce type de tâche : il apprend à partir des lignes étiquetées et prédit une valeur numérique rapidement et pour un faible coût par prédiction."
  options:
    a:
      en: "An LLM has not learned the company's delivery patterns; its estimate would be unreliable and more expensive than a model trained on the data."
      fr: "Un LLM n'a pas appris les tendances de livraison de l'entreprise ; son estimation serait peu fiable et plus coûteuse qu'un modèle entraîné sur les données."
    b:
      en: "Visualizing routes does not predict a delivery time."
      fr: "Visualiser les itinéraires ne prédit pas de durée de livraison."
    d:
      en: "Driver manuals do not contain the delivery times to learn from; fine-tuning an FM adds cost and does not suit numeric tabular prediction."
      fr: "Les manuels des chauffeurs ne contiennent pas les durées de livraison à apprendre ; le réglage précis d'un FM ajoute des coûts et ne convient pas à une prédiction numérique tabulaire."
references:
  - title: "Data differences between generative AI and traditional ML"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-data-considerations-gen-ai/differences.html
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
