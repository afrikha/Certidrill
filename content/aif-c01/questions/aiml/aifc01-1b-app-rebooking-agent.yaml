id: aifc01-1b-app-rebooking-agent
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company wants an AI assistant that handles a request such as "My flight was canceled, get me on the next flight to Chicago." The assistant must check seat availability, choose a suitable flight, book it through the booking API, and email the new itinerary to the traveler without a human completing each step. Which type of AI application meets these requirements?
  fr: |
    Une agence de voyages souhaite un assistant IA qui traite une demande comme « Mon vol a été annulé, trouvez-moi une place sur le prochain vol pour Chicago. » L'assistant doit vérifier les places disponibles, choisir un vol adapté, le réserver par l'API de réservation et envoyer le nouvel itinéraire par e-mail au voyageur, sans qu'un humain réalise chaque étape. Quel type d'application d'IA répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An agentic AI application that plans the steps and calls tools to complete them", fr: "Une application d'IA agentique qui planifie les étapes et appelle des outils pour les réaliser" }
    - id: b
      text: { en: "A knowledge base that answers questions from the airline's travel policies", fr: "Une base de connaissances qui répond aux questions à partir des politiques de voyage de la compagnie" }
    - id: c
      text: { en: "A recommendation system that ranks flights from past customer bookings", fr: "Un système de recommandation qui classe les vols à partir des réservations passées des clients" }
    - id: d
      text: { en: "A speech recognition system that converts the traveler's request into text", fr: "Un système de reconnaissance vocale qui convertit la demande du voyageur en texte" }
answer: { optionId: a }
explanation:
  correct:
    en: "Agentic AI systems reason about a goal, break it into steps, and take actions by calling tools and APIs, keeping context across the steps. Completing a rebooking end to end through APIs is an agentic use case; Amazon Bedrock AgentCore is the AWS platform to build, deploy and operate such agents."
    fr: "Les systèmes d'IA agentique raisonnent sur un objectif, le décomposent en étapes et agissent en appelant des outils et des API, en conservant le contexte d'une étape à l'autre. Réaliser une nouvelle réservation de bout en bout par des API est un cas d'usage agentique ; Amazon Bedrock AgentCore est la plateforme AWS pour créer, déployer et exploiter de tels agents."
  options:
    b:
      en: "A knowledge base retrieves information to answer questions; on its own, it does not book flights or send emails."
      fr: "Une base de connaissances récupère des informations pour répondre à des questions ; seule, elle ne réserve pas de vols et n'envoie pas d'e-mails."
    c:
      en: "A recommendation system can rank flights, but it does not perform the booking and notification actions."
      fr: "Un système de recommandation peut classer des vols, mais il ne réalise pas les actions de réservation et de notification."
    d:
      en: "Speech recognition only turns audio into text; the request may already be text, and the actions remain to be done."
      fr: "La reconnaissance vocale ne fait que transformer l'audio en texte ; la demande est peut-être déjà textuelle, et les actions restent à réaliser."
references:
  - title: "Overview - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
