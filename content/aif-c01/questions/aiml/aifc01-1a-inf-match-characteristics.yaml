id: aifc01-1a-inf-match-characteristics
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A data science team is comparing the inference options of Amazon SageMaker AI.

    Match each description to the inference option that it describes.

    To answer, drag the appropriate inference option to each description. Each inference option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe de science des données compare les options d'inférence d'Amazon SageMaker AI.

    Associez chaque description à l'option d'inférence qu'elle décrit.

    Pour répondre, faites glisser l'option d'inférence appropriée vers chaque description. Chaque option d'inférence peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rt, text: { en: "Real-time inference", fr: "Inférence en temps réel (real-time inference)" } }
    - { id: sl, text: { en: "Serverless Inference", fr: "Serverless Inference (inférence sans serveur)" } }
    - { id: as, text: { en: "Asynchronous Inference", fr: "Asynchronous Inference (inférence asynchrone)" } }
    - { id: bt, text: { en: "Batch transform", fr: "Transformation par lots (batch transform)" } }
  targets:
    - id: t1
      text: { en: "Queues each request, reads the payload from Amazon S3, and can scale the instance count to zero when there are no requests", fr: "Met chaque requête en file d'attente, lit la charge utile dans Amazon S3 et peut réduire le nombre d'instances à zéro en l'absence de requêtes" }
    - id: t2
      text: { en: "Runs a job over an entire dataset and writes the predictions to output files, without a persistent endpoint", fr: "Exécute une tâche sur un jeu de données complet et écrit les prédictions dans des fichiers de sortie, sans point de terminaison permanent" }
    - id: t3
      text: { en: "Provisions compute without instance types, scales to zero when idle, and can have cold starts", fr: "Provisionne la capacité de calcul sans types d'instances, se réduit à zéro pendant l'inactivité et peut subir des démarrages à froid" }
answer:
  mapping: { t1: as, t2: bt, t3: sl }
explanation:
  correct:
    en: "Asynchronous Inference queues requests whose payloads are referenced in Amazon S3 and can autoscale to zero instances. Batch transform processes a whole dataset as a job and writes .out files to Amazon S3 when no persistent endpoint is needed. Serverless Inference manages compute for you, scales to zero, and can have cold starts after idle periods."
    fr: "Asynchronous Inference met en file d'attente des requêtes dont les charges utiles sont référencées dans Amazon S3 et peut se réduire automatiquement à zéro instance. La transformation par lots traite un jeu de données complet sous forme de tâche et écrit des fichiers .out dans Amazon S3 lorsqu'aucun point de terminaison permanent n'est nécessaire. Serverless Inference gère la capacité de calcul pour vous, se réduit à zéro et peut subir des démarrages à froid après des périodes d'inactivité."
  options:
    rt:
      en: "Real-time inference serves interactive, low-latency requests on instances that you choose; it does not match any description."
      fr: "L'inférence en temps réel sert des requêtes interactives à faible latence sur des instances que vous choisissez ; elle ne correspond à aucune description."
references:
  - title: "Asynchronous inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
  - title: "Deploy models with Amazon SageMaker Serverless Inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html
