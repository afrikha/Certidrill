id: aifc01-1c-met-roi-business
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company deployed an ML demand forecasting model one year ago. The CFO asks whether the financial gains from better inventory planning exceeded the total cost of building and running the model.

    Which metric answers the CFO's question?
  fr: |
    Une entreprise de distribution a déployé un modèle de ML de prévision de la demande il y a un an. Le directeur financier demande si les gains financiers d'une meilleure planification des stocks ont dépassé le coût total de création et d'exploitation du modèle.

    Quelle métrique répond à la question du directeur financier ?
body:
  options:
    - { id: a, text: { en: "Development costs", fr: "Coûts de développement" } }
    - { id: b, text: { en: "Cost per user", fr: "Coût par utilisateur" } }
    - { id: c, text: { en: "F1 score", fr: "Score F1" } }
    - { id: d, text: { en: "Return on investment (ROI)", fr: "Retour sur investissement (ROI)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "ROI compares the value a project brings with what it costs. It is a business metric: it answers whether the model was worth its total cost of development and operation, which model performance metrics cannot tell."
    fr: "Le ROI compare la valeur qu'apporte un projet à ce qu'il coûte. C'est une métrique métier : il indique si le modèle valait son coût total de développement et d'exploitation, ce que les métriques de performance du modèle ne peuvent pas dire."
  options:
    a:
      en: "Development costs are only the cost side of the question; they do not include the gains or the running costs."
      fr: "Les coûts de développement ne sont que le côté coût de la question ; ils n'incluent ni les gains ni les coûts d'exploitation."
    b:
      en: "Cost per user divides cost by users served; it does not compare gains with total cost."
      fr: "Le coût par utilisateur divise le coût par le nombre d'utilisateurs servis ; il ne compare pas les gains au coût total."
    c:
      en: "The F1 score measures classification quality, not financial value."
      fr: "Le score F1 mesure la qualité d'une classification, pas la valeur financière."
references:
  - title: Business goal identification
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/business-goal-identification.html
