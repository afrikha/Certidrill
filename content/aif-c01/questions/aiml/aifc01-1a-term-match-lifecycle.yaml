id: aifc01-1a-term-match-lifecycle
objective: "1.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A data analyst at a retail company is preparing a glossary for a new machine learning (ML) project.

    Match each description to the correct term.

    To answer, drag the appropriate term to each description. Each term may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un analyste de données d'une entreprise de vente au détail prépare un glossaire pour un nouveau projet de machine learning (ML).

    Associez chaque description au terme correct.

    Pour répondre, faites glisser le terme approprié vers chaque description. Chaque terme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: algo, text: { en: "Algorithm", fr: "Algorithme" } }
    - { id: model, text: { en: "Model", fr: "Modèle" } }
    - { id: train, text: { en: "Training", fr: "Entraînement" } }
    - { id: infer, text: { en: "Inference", fr: "Inférence" } }
    - { id: label, text: { en: "Data labeling", fr: "Étiquetage des données" } }
  targets:
    - id: t1
      text: { en: "The method or procedure that learns patterns from example data", fr: "La méthode ou la procédure qui apprend des schémas à partir de données d'exemple" }
    - id: t2
      text: { en: "The process of adjusting parameters by repeatedly comparing predictions with the expected outputs in historical data", fr: "Le processus qui ajuste des paramètres en comparant de manière répétée les prédictions avec les sorties attendues des données historiques" }
    - id: t3
      text: { en: "The artifact produced by training that an application calls to get predictions", fr: "L'artefact produit par l'entraînement qu'une application appelle pour obtenir des prédictions" }
    - id: t4
      text: { en: "The use of a trained model to generate a prediction for new input data", fr: "L'utilisation d'un modèle entraîné pour générer une prédiction sur de nouvelles données d'entrée" }
answer:
  mapping: { t1: algo, t2: train, t3: model, t4: infer }
explanation:
  correct:
    en: "An algorithm is the method used to learn from data; training applies the algorithm to example data and adjusts parameters to reduce prediction error. The result of training is a model, which the application integrates or calls. Inference is the use of that model to produce predictions on new data."
    fr: "Un algorithme est la méthode utilisée pour apprendre à partir des données ; l'entraînement applique l'algorithme à des données d'exemple et ajuste des paramètres pour réduire l'erreur de prédiction. Le résultat de l'entraînement est un modèle, que l'application intègre ou appelle. L'inférence est l'utilisation de ce modèle pour produire des prédictions sur de nouvelles données."
  options:
    label:
      en: "Data labeling adds tags, such as the correct category, to raw data before training; it does not learn patterns or produce predictions."
      fr: "L'étiquetage des données ajoute des balises, comme la catégorie correcte, aux données brutes avant l'entraînement ; il n'apprend pas de modèles récurrents et ne produit pas de prédictions."
references:
  - title: "Overview of machine learning with Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-mlconcepts.html
  - title: "What is Machine Learning? - ML Technology Explained - AWS"
    url: https://aws.amazon.com/what-is/machine-learning/
