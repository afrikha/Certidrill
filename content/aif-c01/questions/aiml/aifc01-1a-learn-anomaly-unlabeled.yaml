id: aifc01-1a-learn-anomaly-unlabeled
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hosting company wants to detect unusual patterns in the network traffic records of its servers. The records are stored as tabular data, and the company has no examples labeled as normal or abnormal.

    Which approach meets this requirement?
  fr: |
    Un hébergeur veut détecter des schémas inhabituels dans les enregistrements du trafic réseau de ses serveurs. Les enregistrements sont stockés sous forme de données tabulaires, et l'entreprise ne dispose d'aucun exemple étiqueté comme normal ou anormal.

    Quelle approche répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Supervised learning with the Linear Learner algorithm", fr: "L'apprentissage supervisé avec l'algorithme Linear Learner" } }
    - { id: b, text: { en: "Reinforcement learning with a reward for each blocked connection", fr: "L'apprentissage par renforcement avec une récompense pour chaque connexion bloquée" } }
    - { id: c, text: { en: "Supervised learning with the Image Classification algorithm", fr: "L'apprentissage supervisé avec l'algorithme Image Classification" } }
    - { id: d, text: { en: "Unsupervised learning with the Random Cut Forest algorithm", fr: "L'apprentissage non supervisé avec l'algorithme Random Cut Forest" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Without labeled examples, the company needs unsupervised learning, which finds patterns and anomalies in unlabeled data. Random Cut Forest is the SageMaker AI built-in unsupervised algorithm for anomaly detection in tabular data."
    fr: "Sans exemples étiquetés, l'entreprise a besoin de l'apprentissage non supervisé, qui trouve des schémas et des anomalies dans des données non étiquetées. Random Cut Forest est l'algorithme non supervisé intégré de SageMaker AI pour la détection d'anomalies dans des données tabulaires."
  options:
    a:
      en: "Linear Learner is a supervised algorithm for classification and regression; it needs labeled examples, which the company does not have."
      fr: "Linear Learner est un algorithme supervisé de classification et de régression ; il a besoin d'exemples étiquetés, dont l'entreprise ne dispose pas."
    b:
      en: "Reinforcement learning trains an agent to take actions in an environment; the requirement is to find unusual records in existing data."
      fr: "L'apprentissage par renforcement entraîne un agent à agir dans un environnement ; l'exigence est de trouver des enregistrements inhabituels dans des données existantes."
    c:
      en: "Image Classification is a supervised algorithm for image data; the records are tabular and unlabeled."
      fr: "Image Classification est un algorithme supervisé pour les données d'images ; les enregistrements sont tabulaires et non étiquetés."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
