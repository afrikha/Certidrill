id: aifc01-1c-src-scratch-hyperpod
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company has a very large proprietary corpus in a language with its own script that no available foundation model (FM) supports. The company must define its own vocabulary and model architecture, and it has the budget for training across thousands of accelerators.

    Which approach will meet these requirements?
  fr: |
    Une société de recherche dispose d'un très grand corpus propriétaire dans une langue à l'écriture propre qu'aucun modèle de fondation (FM) disponible ne prend en charge. La société doit définir son propre vocabulaire et sa propre architecture de modèle, et elle a le budget pour un entraînement sur des milliers d'accélérateurs.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send few-shot prompts in that language to an FM in Amazon Bedrock.", fr: "Envoyer des invites few-shot dans cette langue à un FM d'Amazon Bedrock." } }
    - { id: b, text: { en: "Connect the corpus to an FM through Amazon Bedrock Knowledge Bases.", fr: "Connecter le corpus à un FM au moyen d'Amazon Bedrock Knowledge Bases." } }
    - { id: c, text: { en: "Deploy an open-source FM from SageMaker JumpStart without changes.", fr: "Déployer sans modification un FM open source de SageMaker JumpStart." } }
    - { id: d, text: { en: "Pre-train a custom model from scratch on Amazon SageMaker HyperPod.", fr: "Préentraîner un modèle personnalisé de zéro sur Amazon SageMaker HyperPod." } }
answer: { optionId: d }
explanation:
  correct:
    en: "When no existing model covers the data and the company must control the vocabulary and architecture, it trains a custom model from scratch. SageMaker HyperPod provides resilient clusters of thousands of accelerators for training large language models and other FMs."
    fr: "Quand aucun modèle existant ne couvre les données et que l'entreprise doit contrôler le vocabulaire et l'architecture, elle entraîne un modèle personnalisé de zéro. SageMaker HyperPod fournit des clusters résilients de milliers d'accélérateurs pour entraîner de grands modèles de langage et d'autres FM."
  options:
    a:
      en: "Prompting cannot add a language or a vocabulary that the model never learned, and it does not let the company define the architecture."
      fr: "Les invites ne peuvent pas ajouter une langue ou un vocabulaire que le modèle n'a jamais appris, et elles ne permettent pas de définir l'architecture."
    b:
      en: "Retrieval adds documents to the prompt, but the FM still cannot understand a script it does not support, and the architecture stays the provider's."
      fr: "La récupération ajoute des documents à l'invite, mais le FM ne comprend toujours pas une écriture qu'il ne prend pas en charge, et l'architecture reste celle du fournisseur."
    c:
      en: "An existing open-source FM keeps its own vocabulary and architecture, and none supports the language."
      fr: "Un FM open source existant garde son propre vocabulaire et sa propre architecture, et aucun ne prend en charge la langue."
references:
  - title: Amazon SageMaker HyperPod
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod.html
