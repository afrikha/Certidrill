id: aifc01-1b-pipe-order-phases
objective: "1.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A retail company is starting a new ML project to reduce inventory waste. The project follows the ML lifecycle described in the AWS Well-Architected Machine Learning Lens.

    Which four phases come first in the lifecycle? To answer, move the appropriate phases from the list of phases to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise de vente au détail lance un nouveau projet de ML pour réduire le gaspillage de stocks. Le projet suit le cycle de vie ML décrit dans le Machine Learning Lens d'AWS Well-Architected.

    Quelles sont les quatre premières phases du cycle de vie ? Pour répondre, déplacez les phases appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: data, text: { en: "Data processing", fr: "Traitement des données" } }
    - { id: monitor, text: { en: "Model monitoring", fr: "Surveillance du modèle" } }
    - { id: goal, text: { en: "Business goal identification", fr: "Identification de l'objectif métier" } }
    - { id: dev, text: { en: "Model development", fr: "Développement du modèle" } }
    - { id: frame, text: { en: "ML problem framing", fr: "Formulation du problème de ML" } }
    - { id: deploy, text: { en: "Model deployment", fr: "Déploiement du modèle" } }
answer:
  sequence: [ goal, frame, data, dev ]
explanation:
  correct:
    en: "The lifecycle starts with business goal identification, which defines the problem and how business value is measured. ML problem framing then defines what is observed and what must be predicted. Data processing (collection, preprocessing, feature engineering) prepares the data, and model development trains, tunes and evaluates the model. Deployment and monitoring follow, with feedback loops between phases."
    fr: "Le cycle de vie commence par l'identification de l'objectif métier, qui définit le problème et la mesure de la valeur métier. Le cadrage du problème ML définit ensuite ce qui est observé et ce qui doit être prédit. Le traitement des données (collecte, prétraitement, ingénierie des caractéristiques) prépare les données, et le développement du modèle entraîne, règle et évalue le modèle. Le déploiement et la surveillance suivent, avec des boucles de rétroaction entre les phases."
  options:
    deploy:
      en: "Deployment comes after the model has been trained, tuned and evaluated, so it is the fifth phase."
      fr: "Le déploiement intervient après l'entraînement, le réglage et l'évaluation du modèle : c'est la cinquième phase."
    monitor:
      en: "Monitoring checks the model in production; it is the last phase of the lifecycle."
      fr: "La surveillance vérifie le modèle en production ; c'est la dernière phase du cycle de vie."
references:
  - title: "Well-Architected machine learning lifecycle - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/machine-learning-lifecycle.html
