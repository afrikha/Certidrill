id: aifc01-1b-notml-rules-meet-target
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank uses a rules-based system to reject incomplete or invalid loan application forms. A data science team proposes to replace the rules with an ML model. In which situation should the bank keep the rules-based system?
  fr: |
    Une banque utilise un système à base de règles pour rejeter les formulaires de demande de prêt incomplets ou invalides. Une équipe de data science propose de remplacer les règles par un modèle de ML. Dans quelle situation la banque doit-elle conserver le système à base de règles ?
body:
  options:
    - id: a
      text: { en: "The types of invalid forms change every few weeks, and the team cannot update the rules quickly enough.", fr: "Les types de formulaires invalides changent toutes les quelques semaines, et l'équipe ne parvient pas à mettre à jour les règles assez vite." }
    - id: b
      text: { en: "The bank has millions of past forms that reviewers labeled as valid or invalid over several years.", fr: "La banque dispose de millions d'anciens formulaires que des examinateurs ont étiquetés comme valides ou invalides pendant plusieurs années." }
    - id: c
      text: { en: "The rules already meet the accuracy target, and the model would add training and hosting costs for no measurable gain.", fr: "Les règles atteignent déjà l'objectif d'exactitude, et le modèle ajouterait des coûts d'entraînement et d'hébergement sans gain mesurable." }
    - id: d
      text: { en: "The number of applications grows faster than the team can write new rules for the new cases that appear.", fr: "Le nombre de demandes augmente plus vite que l'équipe ne peut écrire de nouvelles règles pour les nouveaux cas qui apparaissent." }
answer: { optionId: c }
explanation:
  correct:
    en: "Some business problems are handled better by simple business rules. When the rules already reach the target, an ML model adds data, training, inference and maintenance costs without improving the business outcome, so the cost-benefit analysis favors keeping the rules."
    fr: "Certains problèmes métier sont mieux traités par de simples règles métier. Quand les règles atteignent déjà l'objectif, un modèle de ML ajoute des coûts de données, d'entraînement, d'inférence et de maintenance sans améliorer le résultat métier : l'analyse coûts-avantages plaide pour conserver les règles."
  options:
    a:
      en: "Patterns that change faster than rules can be updated are a typical reason to adopt ML, because a model can be retrained on new data."
      fr: "Des tendances qui changent plus vite que les règles ne peuvent être mises à jour sont une raison typique d'adopter le ML, car un modèle peut être réentraîné sur de nouvelles données."
    b:
      en: "A large labeled dataset makes supervised learning feasible; it is an argument for ML, not against it."
      fr: "Un grand jeu de données étiquetées rend l'apprentissage supervisé possible ; c'est un argument en faveur du ML, pas contre."
    d:
      en: "When rule maintenance cannot keep up with new cases, a model that learns from examples can scale better than hand-written rules."
      fr: "Quand la maintenance des règles ne suit plus les nouveaux cas, un modèle qui apprend à partir d'exemples passe mieux à l'échelle que des règles écrites à la main."
references:
  - title: "ML problem framing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/ml-problem-framing.html
  - title: "Business goal identification - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/business-goal-identification.html
