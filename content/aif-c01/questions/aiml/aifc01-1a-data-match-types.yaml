id: aifc01-1a-data-match-types
objective: "1.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    An energy company collects several datasets for future ML projects.

    Match each dataset to its type of data.

    To answer, drag the appropriate data type to each dataset. Each data type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise d'énergie collecte plusieurs jeux de données pour de futurs projets de ML.

    Associez chaque jeu de données à son type de données.

    Pour répondre, faites glisser le type de données approprié vers chaque jeu de données. Chaque type de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ts, text: { en: "Time-series data", fr: "Données de séries chronologiques" } }
    - { id: tab, text: { en: "Tabular data", fr: "Données tabulaires" } }
    - { id: img, text: { en: "Image data", fr: "Données d'images" } }
    - { id: txt, text: { en: "Text data", fr: "Données textuelles" } }
    - { id: aud, text: { en: "Audio data", fr: "Données audio" } }
  targets:
    - id: t1
      text: { en: "Electricity consumption recorded every 15 minutes by each smart meter over three years", fr: "La consommation d'électricité enregistrée toutes les 15 minutes par chaque compteur intelligent sur trois ans" }
    - id: t2
      text: { en: "A customer table with one row per customer and columns for contract type, region, and monthly bill", fr: "Une table clients avec une ligne par client et des colonnes pour le type de contrat, la région et la facture mensuelle" }
    - id: t3
      text: { en: "Drone photos of power lines taken during inspections", fr: "Des photos de lignes électriques prises par drone lors des inspections" }
    - id: t4
      text: { en: "Free-form complaints that customers write in the company's contact form", fr: "Les réclamations en texte libre que les clients rédigent dans le formulaire de contact de l'entreprise" }
answer:
  mapping: { t1: ts, t2: tab, t3: img, t4: txt }
explanation:
  correct:
    en: "Measurements recorded at regular time intervals, where the order in time matters, are time-series data. Rows and columns with a fixed schema are tabular (structured) data. Photos are image data, and free-form written complaints are text data; both are unstructured."
    fr: "Des mesures enregistrées à intervalles de temps réguliers, dont l'ordre chronologique compte, sont des données de séries chronologiques. Des lignes et des colonnes avec un schéma fixe sont des données tabulaires (structurées). Les photos sont des données d'images, et les réclamations rédigées en texte libre sont des données textuelles ; les deux sont non structurées."
  options:
    aud:
      en: "No dataset contains recordings of speech or sound."
      fr: "Aucun jeu de données ne contient d'enregistrements de voix ou de sons."
references:
  - title: "Structured Data vs Unstructured Data - Difference Between Collectible Data - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/
  - title: "Use the SageMaker AI DeepAR forecasting algorithm - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deepar.html
