id: aifc01-1c-mlops-monitor-cloudwatch
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    In November 2026, a company that has never used Amazon SageMaker AI deploys its first model to a SageMaker AI real-time endpoint. The company must track the endpoint's model latency and invocation errors and receive an alert when errors increase.

    Which solution will meet these requirements?
  fr: |
    En novembre 2026, une entreprise qui n'a jamais utilisé Amazon SageMaker AI déploie son premier modèle sur un point de terminaison en temps réel SageMaker AI. L'entreprise doit suivre la latence du modèle et les erreurs d'appel du point de terminaison et recevoir une alerte quand les erreurs augmentent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a data quality monitoring schedule in Amazon SageMaker Model Monitor.", fr: "Créer une planification de surveillance de la qualité des données dans Amazon SageMaker Model Monitor." } }
    - { id: b, text: { en: "Create Amazon CloudWatch alarms on the endpoint's invocation metrics.", fr: "Créer des alarmes Amazon CloudWatch sur les métriques d'appel du point de terminaison." } }
    - { id: c, text: { en: "Turn on AWS CloudTrail logging for the SageMaker AI API calls.", fr: "Activer la journalisation AWS CloudTrail des appels d'API SageMaker AI." } }
    - { id: d, text: { en: "Create AWS Config rules that evaluate the endpoint configuration.", fr: "Créer des règles AWS Config qui évaluent la configuration du point de terminaison." } }
answer: { optionId: b }
explanation:
  correct:
    en: "SageMaker AI publishes endpoint invocation metrics such as ModelLatency, Invocation4XXErrors and Invocation5XXErrors to Amazon CloudWatch every minute. A CloudWatch alarm on these metrics alerts the company when errors increase. AWS recommends CloudWatch for endpoint-level metrics."
    fr: "SageMaker AI publie chaque minute dans Amazon CloudWatch des métriques d'appel du point de terminaison comme ModelLatency, Invocation4XXErrors et Invocation5XXErrors. Une alarme CloudWatch sur ces métriques alerte l'entreprise quand les erreurs augmentent. AWS recommande CloudWatch pour les métriques au niveau du point de terminaison."
  options:
    a:
      en: "SageMaker Model Monitor is no longer open to new customers, and its data quality schedules detect input drift, not latency and errors."
      fr: "SageMaker Model Monitor n'est plus ouvert aux nouveaux clients, et ses planifications de qualité des données détectent la dérive des entrées, pas la latence et les erreurs."
    c:
      en: "CloudTrail records who made which API call for auditing; it does not measure model latency or alert on error rates."
      fr: "CloudTrail enregistre qui a fait quel appel d'API pour l'audit ; il ne mesure pas la latence du modèle et n'alerte pas sur le taux d'erreurs."
    d:
      en: "AWS Config evaluates resource configurations against rules; it does not track runtime metrics of an endpoint."
      fr: "AWS Config évalue la configuration des ressources par rapport à des règles ; il ne suit pas les métriques d'exécution d'un point de terminaison."
references:
  - title: Amazon SageMaker AI metrics in Amazon CloudWatch
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/monitoring-cloudwatch.html
  - title: Amazon SageMaker Model Monitor availability change
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-availability-change.html
