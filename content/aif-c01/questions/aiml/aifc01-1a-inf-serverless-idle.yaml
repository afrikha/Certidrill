id: aifc01-1a-inf-serverless-idle
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's HR team uses an internal tool that calls a small text classification model hosted in Amazon SageMaker AI. The tool is used a few times a day at unpredictable times and is idle for hours between uses. Each request has a small payload, and the tool waits for the prediction in the same request. Users accept a short extra delay on the first request after an idle period. The company wants to minimize cost and avoid choosing instance types.

    Which inference option meets these requirements?
  fr: |
    L'équipe RH d'une entreprise utilise un outil interne qui appelle un petit modèle de classification de texte hébergé dans Amazon SageMaker AI. L'outil est utilisé quelques fois par jour à des moments imprévisibles et reste inactif pendant des heures entre deux utilisations. Chaque requête a une petite charge utile, et l'outil attend la prédiction dans la même requête. Les utilisateurs acceptent un court délai supplémentaire sur la première requête après une période d'inactivité. L'entreprise veut réduire les coûts au minimum et ne pas avoir à choisir de types d'instances.

    Quelle option d'inférence répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Real-time inference on an instance-based endpoint", fr: "L'inférence en temps réel sur un point de terminaison basé sur des instances" } }
    - { id: b, text: { en: "Asynchronous Inference with scaling to zero", fr: "Asynchronous Inference avec réduction à zéro instance" } }
    - { id: c, text: { en: "A batch transform job for each request", fr: "Une tâche de transformation par lots (batch transform) pour chaque requête" } }
    - { id: d, text: { en: "Serverless Inference", fr: "Serverless Inference (inférence sans serveur)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Serverless Inference provisions and scales compute automatically, so the company does not choose instance types, and it scales the endpoint down to zero when there are no requests. It is designed for infrequent or unpredictable traffic with idle periods that can tolerate cold starts, which is the short delay users accept."
    fr: "Serverless Inference provisionne et met à l'échelle la capacité de calcul automatiquement : l'entreprise n'a pas à choisir de types d'instances, et le point de terminaison est réduit à zéro en l'absence de requêtes. Elle est conçue pour un trafic peu fréquent ou imprévisible, avec des périodes d'inactivité, qui tolère les démarrages à froid : c'est le court délai que les utilisateurs acceptent."
  options:
    a:
      en: "An instance-based real-time endpoint requires choosing an instance type and is billed while it sits idle for hours."
      fr: "Un point de terminaison en temps réel basé sur des instances exige de choisir un type d'instance et il est facturé pendant ses heures d'inactivité."
    b:
      en: "Asynchronous Inference queues the request and returns an output location instead of the prediction; the tool waits for the prediction in the same request, and you still choose instance types."
      fr: "Asynchronous Inference met la requête en file d'attente et renvoie un emplacement de sortie au lieu de la prédiction ; l'outil attend la prédiction dans la même requête, et il faut toujours choisir des types d'instances."
    c:
      en: "Batch transform is a job that processes a dataset and writes files to Amazon S3; it does not answer an interactive request."
      fr: "La transformation par lots est une tâche qui traite un jeu de données et écrit des fichiers dans Amazon S3 ; elle ne répond pas à une requête interactive."
references:
  - title: "Deploy models with Amazon SageMaker Serverless Inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html
  - title: "Asynchronous inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
