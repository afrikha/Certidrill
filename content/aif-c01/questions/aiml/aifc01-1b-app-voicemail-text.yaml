id: aifc01-1b-app-voicemail-text
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A medical clinic receives hundreds of voicemail messages each day. Staff members want to read the messages as text in the scheduling system instead of listening to each recording. Which type of AI application meets this requirement?
  fr: |
    Une clinique reçoit chaque jour des centaines de messages vocaux. Le personnel souhaite lire les messages sous forme de texte dans le système de planification au lieu d'écouter chaque enregistrement. Quel type d'application d'IA répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Text-to-speech synthesis", fr: "Synthèse vocale (text-to-speech)" }
    - id: b
      text: { en: "Speech recognition", fr: "Reconnaissance vocale" }
    - id: c
      text: { en: "Machine translation", fr: "Traduction automatique" }
    - id: d
      text: { en: "Image classification", fr: "Classification d'images" }
answer: { optionId: b }
explanation:
  correct:
    en: "Speech recognition, also called speech-to-text, converts spoken audio into written text. Amazon Transcribe is the AWS automatic speech recognition service that converts audio to text, in batch for recorded files or in real time for streams."
    fr: "La reconnaissance vocale, ou speech-to-text, convertit l'audio parlé en texte écrit. Amazon Transcribe est le service AWS de reconnaissance automatique de la parole qui convertit l'audio en texte, par lots pour des fichiers enregistrés ou en temps réel pour des flux."
  options:
    a:
      en: "Text-to-speech does the opposite: it turns text into spoken audio."
      fr: "La synthèse vocale fait l'inverse : elle transforme du texte en audio parlé."
    c:
      en: "Machine translation converts text from one language to another; the messages first need to become text."
      fr: "La traduction automatique convertit un texte d'une langue à une autre ; les messages doivent d'abord devenir du texte."
    d:
      en: "Image classification labels images; voicemail messages are audio."
      fr: "La classification d'images étiquette des images ; les messages vocaux sont de l'audio."
references:
  - title: "What is Amazon Transcribe?"
    url: https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html
