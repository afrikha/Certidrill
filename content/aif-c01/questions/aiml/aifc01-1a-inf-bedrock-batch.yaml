id: aifc01-1a-inf-bedrock-batch
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an on-demand foundation model (FM) in Amazon Bedrock. It wants the FM to summarize 200,000 archived support tickets. The summaries are needed within a week, not in real time.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise un modèle de fondation (FM) à la demande dans Amazon Bedrock. Elle veut que le FM résume 200 000 tickets de support archivés. Les résumés sont nécessaires dans un délai d'une semaine, pas en temps réel.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Run a script on an Amazon EC2 instance that sends one on-demand InvokeModel request per ticket and retries failures.", fr: "Exécuter sur une instance Amazon EC2 un script qui envoie une requête InvokeModel à la demande par ticket et relance les échecs." } }
    - { id: b, text: { en: "Deploy an open-source model to an Amazon SageMaker AI real-time endpoint and invoke it once per ticket.", fr: "Déployer un modèle open source sur un point de terminaison en temps réel Amazon SageMaker AI et l'appeler une fois par ticket." } }
    - { id: c, text: { en: "Upload the prompts in files to Amazon S3 and submit an Amazon Bedrock batch inference job.", fr: "Charger les invites dans des fichiers sur Amazon S3 et soumettre une tâche d'inférence par lots Amazon Bedrock." } }
    - { id: d, text: { en: "Purchase Provisioned Throughput and submit a batch inference job that uses the provisioned model.", fr: "Acheter du débit provisionné (Provisioned Throughput) et soumettre une tâche d'inférence par lots qui utilise le modèle provisionné." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock batch inference processes a large number of prompts asynchronously. The company puts the model inputs in files in an S3 bucket, submits one batch inference job, and retrieves the output files from Amazon S3 when the job completes, without managing individual calls."
    fr: "L'inférence par lots d'Amazon Bedrock traite un grand nombre d'invites de manière asynchrone. L'entreprise place les entrées du modèle dans des fichiers d'un compartiment S3, soumet une seule tâche d'inférence par lots et récupère les fichiers de sortie dans Amazon S3 à la fin de la tâche, sans gérer d'appels individuels."
  options:
    a:
      en: "A custom script works, but the company must run an instance and write code to send, track, and retry 200,000 requests."
      fr: "Un script personnalisé fonctionne, mais l'entreprise doit exécuter une instance et écrire du code pour envoyer, suivre et relancer 200 000 requêtes."
    b:
      en: "Hosting a model on a real-time endpoint adds infrastructure to manage and still requires one call per ticket; the workload is not real time."
      fr: "Héberger un modèle sur un point de terminaison en temps réel ajoute une infrastructure à gérer et exige toujours un appel par ticket ; la charge de travail n'est pas en temps réel."
    d:
      en: "Amazon Bedrock does not support batch inference for provisioned models, and Provisioned Throughput is a capacity commitment that this one-time job does not need."
      fr: "Amazon Bedrock ne prend pas en charge l'inférence par lots pour les modèles provisionnés, et le débit provisionné est un engagement de capacité dont cette tâche ponctuelle n'a pas besoin."
references:
  - title: "Process multiple prompts with batch inference - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
