id: aifc01-1b-svc-match-services
objective: "1.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A retail company has four AI requirements.

    Match each requirement with the AWS service that meets it.

    To answer, drag the appropriate service to each requirement. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de vente au détail a quatre exigences en matière d'IA.

    Associez chaque exigence au service AWS qui y répond.

    Pour répondre, faites glisser le service approprié vers chaque exigence. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sm, text: "Amazon SageMaker AI" }
    - { id: comp, text: "Amazon Comprehend" }
    - { id: tr, text: "Amazon Translate" }
    - { id: tx, text: "Amazon Textract" }
    - { id: ts, text: "Amazon Transcribe" }
    - { id: po, text: "Amazon Polly" }
  targets:
    - id: t1
      text: { en: "Build, train, and deploy a custom demand model with the data science team's own algorithm.", fr: "Créer, entraîner et déployer un modèle de demande personnalisé avec l'algorithme propre à l'équipe de data science." }
    - id: t2
      text: { en: "Determine whether each written product review is positive, negative, neutral, or mixed.", fr: "Déterminer si chaque avis produit écrit est positif, négatif, neutre ou mitigé." }
    - id: t3
      text: { en: "Localize the text of the online store into Japanese and Korean.", fr: "Localiser le texte de la boutique en ligne en japonais et en coréen." }
    - id: t4
      text: { en: "Extract line items and totals from scanned supplier invoices.", fr: "Extraire les lignes d'articles et les totaux des factures fournisseurs numérisées." }
answer:
  mapping: { t1: sm, t2: comp, t3: tr, t4: tx }
explanation:
  correct:
    en: "Amazon SageMaker AI is the fully managed service to build, train and deploy custom ML models, including with your own algorithms and frameworks. Amazon Comprehend returns the dominant sentiment of a document: positive, neutral, negative or mixed. Amazon Translate translates text between languages. Amazon Textract extracts text, forms and tables from documents, and its AnalyzeExpense operation processes invoices and receipts."
    fr: "Amazon SageMaker AI est le service entièrement géré qui permet de créer, d'entraîner et de déployer des modèles de ML personnalisés, y compris avec vos propres algorithmes et frameworks. Amazon Comprehend renvoie le sentiment dominant d'un document : positif, neutre, négatif ou mitigé. Amazon Translate traduit du texte d'une langue à une autre. Amazon Textract extrait le texte, les formulaires et les tableaux des documents, et son opération AnalyzeExpense traite les factures et les reçus."
  options:
    ts:
      en: "Amazon Transcribe converts speech to text; none of the requirements has audio input."
      fr: "Amazon Transcribe convertit la parole en texte ; aucune exigence ne comporte d'entrée audio."
    po:
      en: "Amazon Polly converts text to speech; none of the requirements needs audio output."
      fr: "Amazon Polly convertit du texte en parole ; aucune exigence ne demande de sortie audio."
references:
  - title: "What is Amazon SageMaker AI?"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html
  - title: "What is Amazon Textract?"
    url: https://docs.aws.amazon.com/textract/latest/dg/what-is.html
