id: aifc01-1a-data-timeseries-deepar
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A utility company has five years of hourly electricity demand readings for 300 substations. It wants to use an Amazon SageMaker AI built-in algorithm to forecast the demand of each substation for the next week.

    Which algorithm should the company use?
  fr: |
    Une entreprise de services publics dispose de cinq ans de relevés horaires de la demande d'électricité pour 300 postes électriques. Elle veut utiliser un algorithme intégré d'Amazon SageMaker AI pour prévoir la demande de chaque poste pour la semaine suivante.

    Quel algorithme l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "K-Means" }
    - { id: b, text: "BlazingText" }
    - { id: c, text: "DeepAR" }
    - { id: d, text: "Object Detection" }
answer: { optionId: c }
explanation:
  correct:
    en: "The readings are time-series data: values recorded at regular intervals where order matters. DeepAR is a supervised SageMaker AI algorithm that forecasts time series by training one model across many related series, such as the demand of 300 substations."
    fr: "Les relevés sont des données de séries chronologiques : des valeurs enregistrées à intervalles réguliers dont l'ordre compte. DeepAR est un algorithme supervisé de SageMaker AI qui prévoit des séries chronologiques en entraînant un seul modèle sur de nombreuses séries apparentées, comme la demande de 300 postes électriques."
  options:
    a:
      en: "K-Means is an unsupervised algorithm that groups similar records into clusters; it does not forecast future values."
      fr: "K-Means est un algorithme non supervisé qui regroupe des enregistrements similaires en clusters ; il ne prévoit pas de valeurs futures."
    b:
      en: "BlazingText works on text data, for example for text classification."
      fr: "BlazingText traite des données textuelles, par exemple pour la classification de texte."
    d:
      en: "Object Detection works on image data to locate and classify objects."
      fr: "Object Detection traite des données d'images pour localiser et classer des objets."
references:
  - title: "Use the SageMaker AI DeepAR forecasting algorithm - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deepar.html
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
