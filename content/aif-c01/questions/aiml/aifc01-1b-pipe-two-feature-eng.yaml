id: aifc01-1b-pipe-two-feature-eng
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A data scientist is listing the tasks of a project's ML pipeline.

    Which two tasks are part of feature engineering? (Choose two.)
  fr: |
    Un data scientist dresse la liste des tâches du pipeline ML d'un projet.

    Quelles sont les deux tâches qui font partie de l'ingénierie des caractéristiques (feature engineering) ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Splitting the data into training, validation, and test sets", fr: "Diviser les données en jeux d'entraînement, de validation et de test" } }
    - { id: b, text: { en: "One-hot encoding a categorical column such as the country", fr: "Appliquer un encodage one-hot à une colonne catégorielle comme le pays" } }
    - { id: c, text: { en: "Comparing the deployed model's live predictions with outcomes", fr: "Comparer les prédictions en production du modèle déployé avec les résultats réels" } }
    - { id: d, text: { en: "Reducing many correlated columns to a few components with PCA", fr: "Réduire de nombreuses colonnes corrélées à quelques composantes avec la PCA" } }
    - { id: e, text: { en: "Ingesting sales records from several databases into a data lake", fr: "Ingérer les enregistrements de ventes de plusieurs bases de données dans un lac de données" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Feature engineering includes feature creation, transformation, extraction, and selection. One-hot encoding creates new features from a categorical column (feature creation). Principal Component Analysis (PCA) is a dimensionality reduction technique used for feature extraction, which reduces the data to process while keeping its main characteristics."
    fr: "L'ingénierie des caractéristiques comprend la création, la transformation, l'extraction et la sélection de caractéristiques. L'encodage one-hot crée de nouvelles caractéristiques à partir d'une colonne catégorielle (création de caractéristiques). L'analyse en composantes principales (PCA) est une technique de réduction de dimensionnalité utilisée pour l'extraction de caractéristiques, qui réduit les données à traiter tout en conservant leurs principales caractéristiques."
  options:
    a:
      en: "Partitioning the data into training, validation, and test sets is a data preprocessing step."
      fr: "Partitionner les données en jeux d'entraînement, de validation et de test est une étape du prétraitement des données."
    c:
      en: "Comparing live predictions with outcomes is model monitoring, after deployment."
      fr: "Comparer les prédictions en production avec les résultats réels relève de la surveillance du modèle, après le déploiement."
    e:
      en: "Ingesting and aggregating data from several sources is data collection."
      fr: "Ingérer et agréger des données provenant de plusieurs sources relève de la collecte des données."
references:
  - title: "Feature engineering - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/feature-engineering.html
  - title: "Data preprocessing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/data-preprocessing.html
