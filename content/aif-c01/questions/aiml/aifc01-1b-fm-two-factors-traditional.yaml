id: aifc01-1b-fm-two-factors-traditional
objective: "1.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is choosing between a traditional ML model and a foundation model (FM) for a new project.

    Which two project characteristics favor a traditional ML model? (Choose two.)
  fr: |
    Une entreprise hésite entre un modèle de ML traditionnel et un modèle de fondation (FM) pour un nouveau projet.

    Quelles sont les deux caractéristiques du projet qui plaident en faveur d'un modèle de ML traditionnel ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each prediction must be explained to an auditor.", fr: "Chaque prédiction doit être expliquée à un auditeur." } }
    - { id: b, text: { en: "The model must handle many tasks from text instructions.", fr: "Le modèle doit traiter de nombreuses tâches à partir d'instructions textuelles." } }
    - { id: c, text: { en: "No labeled examples exist for the task.", fr: "Aucun exemple étiqueté n'existe pour la tâche." } }
    - { id: d, text: { en: "The task is one narrow prediction on labeled tabular data.", fr: "La tâche est une prédiction ciblée sur des données tabulaires étiquetées." } }
    - { id: e, text: { en: "The output must be new images created from descriptions.", fr: "La sortie doit être de nouvelles images créées à partir de descriptions." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Traditional ML models are trained for a specific task, such as classifying or forecasting from structured, labeled data, and simpler models can be interpreted to explain each prediction. These traits suit narrow, regulated predictions. FMs are general-purpose models that adapt to many tasks through prompts but are harder to explain."
    fr: "Les modèles de ML traditionnels sont entraînés pour une tâche précise, comme classer ou prévoir à partir de données structurées et étiquetées, et les modèles plus simples peuvent être interprétés pour expliquer chaque prédiction. Ces caractéristiques conviennent aux prédictions ciblées et réglementées. Les FM sont des modèles polyvalents qui s'adaptent à de nombreuses tâches grâce aux invites, mais sont plus difficiles à expliquer."
  options:
    b:
      en: "Handling many different tasks from instructions is the strength of an FM, not of a task-specific model."
      fr: "Traiter de nombreuses tâches différentes à partir d'instructions est la force d'un FM, pas d'un modèle spécialisé."
    c:
      en: "Supervised traditional models need labeled data; FMs are pretrained on unlabeled data and can work from prompts without labels."
      fr: "Les modèles traditionnels supervisés exigent des données étiquetées ; les FM sont préentraînés sur des données non étiquetées et fonctionnent à partir d'invites, sans étiquettes."
    e:
      en: "Creating new images is a generative task that calls for an image generation FM."
      fr: "Créer de nouvelles images est une tâche générative qui demande un FM de génération d'images."
references:
  - title: "Data differences between generative AI and traditional ML"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-data-considerations-gen-ai/differences.html
  - title: "Machine learning model interpretability with AWS"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/welcome.html
