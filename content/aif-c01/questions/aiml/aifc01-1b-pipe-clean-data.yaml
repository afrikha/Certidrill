id: aifc01-1b-pipe-clean-data
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data science team is building a model from customer records. Before training, the team removes duplicate records, replaces missing ages with the median age, and removes obviously wrong values such as negative prices. Which component of the ML pipeline do these tasks belong to?
  fr: |
    Une équipe de data science crée un modèle à partir d'enregistrements clients. Avant l'entraînement, l'équipe supprime les enregistrements en double, remplace les âges manquants par l'âge médian et supprime les valeurs manifestement fausses comme les prix négatifs. À quel composant du pipeline ML ces tâches appartiennent-elles ?
body:
  options:
    - id: a
      text: { en: "Data preprocessing", fr: "Prétraitement des données" }
    - id: b
      text: { en: "Model evaluation", fr: "Évaluation du modèle" }
    - id: c
      text: { en: "Model deployment", fr: "Déploiement du modèle" }
    - id: d
      text: { en: "Hyperparameter tuning", fr: "Réglage des hyperparamètres" }
answer: { optionId: a }
explanation:
  correct:
    en: "Data preprocessing is part of data preparation. Its cleaning step removes outliers and duplicates, replaces inaccurate or irrelevant data, and fills missing values by imputation. Other preprocessing steps are partitioning the data, scaling it, and detecting and mitigating bias."
    fr: "Le prétraitement des données fait partie de la préparation des données. Son étape de nettoyage supprime les valeurs aberrantes et les doublons, remplace les données inexactes ou non pertinentes et complète les valeurs manquantes par imputation. Les autres étapes du prétraitement sont le partitionnement des données, leur mise à l'échelle, ainsi que la détection et l'atténuation des biais."
  options:
    b:
      en: "Model evaluation measures a trained model's performance; it happens after training."
      fr: "L'évaluation du modèle mesure les performances d'un modèle entraîné ; elle a lieu après l'entraînement."
    c:
      en: "Deployment puts a trained model into production to serve predictions."
      fr: "Le déploiement met un modèle entraîné en production pour servir des prédictions."
    d:
      en: "Hyperparameter tuning searches for the settings of the training algorithm, such as the learning rate; it does not fix the data."
      fr: "Le réglage des hyperparamètres recherche les paramètres de l'algorithme d'entraînement, comme le taux d'apprentissage ; il ne corrige pas les données."
references:
  - title: "Data preprocessing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/data-preprocessing.html
