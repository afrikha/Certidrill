id: aifc01-1b-svc-who-said-what
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A market research firm uses Amazon Transcribe to transcribe recorded focus group sessions. Each session has four participants who share one microphone, and the recordings are single-channel audio files. The transcripts must show which participant said each part of the conversation. Which Amazon Transcribe feature should the firm enable?
  fr: |
    Un cabinet d'études de marché utilise Amazon Transcribe pour transcrire des sessions de groupes de discussion enregistrées. Chaque session compte quatre participants qui partagent un seul microphone, et les enregistrements sont des fichiers audio à un seul canal. Les transcriptions doivent indiquer quel participant a prononcé chaque partie de la conversation. Quelle fonctionnalité d'Amazon Transcribe le cabinet doit-il activer ?
body:
  options:
    - id: a
      text: { en: "Custom vocabulary", fr: "Vocabulaire personnalisé" }
    - id: b
      text: { en: "PII redaction", fr: "Masquage des PII (redaction)" }
    - id: c
      text: { en: "Speaker partitioning (diarization)", fr: "Partitionnement des locuteurs (diarisation)" }
    - id: d
      text: { en: "Vocabulary filtering", fr: "Filtrage du vocabulaire" }
answer: { optionId: c }
explanation:
  correct:
    en: "Speaker partitioning, also called diarization, distinguishes between the different speakers in the transcription output and labels the text of each speaker (spk_0, spk_1, and so on), up to 30 speakers. It works on single-channel audio in which several people share one microphone."
    fr: "Le partitionnement des locuteurs, ou diarisation, distingue les différents locuteurs dans la transcription et étiquette le texte de chacun (spk_0, spk_1, etc.), jusqu'à 30 locuteurs. Il fonctionne sur un audio à un seul canal dans lequel plusieurs personnes partagent un microphone."
  options:
    a:
      en: "A custom vocabulary improves the recognition of specific words, such as brand names, but does not identify speakers."
      fr: "Un vocabulaire personnalisé améliore la reconnaissance de mots précis, comme les noms de marques, mais n'identifie pas les locuteurs."
    b:
      en: "PII redaction masks personal information in the transcript; it does not attribute text to speakers."
      fr: "Le masquage des PII masque les informations personnelles dans la transcription ; il n'attribue pas le texte aux locuteurs."
    d:
      en: "Vocabulary filtering masks or removes unwanted words from the transcript; it does not separate speakers."
      fr: "Le filtrage du vocabulaire masque ou supprime les mots indésirables de la transcription ; il ne sépare pas les locuteurs."
references:
  - title: "Partitioning speakers (diarization)"
    url: https://docs.aws.amazon.com/transcribe/latest/dg/diarization.html
