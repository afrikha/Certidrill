id: aifc01-1b-app-shelf-images
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A grocery chain installs cameras above its shelves. It wants an AI application that analyzes the images and identifies which products are missing from the shelves. Which type of AI application meets this requirement?
  fr: |
    Une chaîne de supermarchés installe des caméras au-dessus de ses rayons. Elle souhaite une application d'IA qui analyse les images et identifie les produits manquants dans les rayons. Quel type d'application d'IA répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Natural language processing (NLP)", fr: "Traitement du langage naturel (NLP)" }
    - id: b
      text: { en: "Speech recognition", fr: "Reconnaissance vocale" }
    - id: c
      text: { en: "Recommendation system", fr: "Système de recommandation" }
    - id: d
      text: { en: "Computer vision", fr: "Vision par ordinateur" }
answer: { optionId: d }
explanation:
  correct:
    en: "Computer vision lets a system interpret images and video, for example to detect and locate objects or to find empty spaces on a shelf. On AWS, Amazon Rekognition provides image analysis such as object detection, and Custom Labels can detect objects specific to a business, such as its products."
    fr: "La vision par ordinateur permet à un système d'interpréter des images et des vidéos, par exemple pour détecter et localiser des objets ou repérer des espaces vides dans un rayon. Sur AWS, Amazon Rekognition fournit l'analyse d'images comme la détection d'objets, et Custom Labels peut détecter des objets propres à une entreprise, comme ses produits."
  options:
    a:
      en: "NLP analyzes and generates human language in text; the input here is images."
      fr: "Le NLP analyse et génère du langage humain sous forme de texte ; ici, l'entrée est constituée d'images."
    b:
      en: "Speech recognition converts spoken audio to text; there is no audio in this scenario."
      fr: "La reconnaissance vocale convertit l'audio parlé en texte ; il n'y a pas d'audio dans ce scénario."
    c:
      en: "A recommendation system suggests items to users based on their behavior; it does not inspect shelf images."
      fr: "Un système de recommandation suggère des articles aux utilisateurs en fonction de leur comportement ; il n'examine pas d'images de rayons."
references:
  - title: "What is Amazon Rekognition?"
    url: https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html
