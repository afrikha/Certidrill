id: aifc01-1c-mlops-drift-retrain
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A subscription company deployed a churn prediction model one year ago. Customer behavior has changed since then, the production input data no longer looks like the training data, and the model's accuracy has slowly dropped.

    Which MLOps practice addresses this problem?
  fr: |
    Une entreprise d'abonnements a déployé un modèle de prédiction de l'attrition il y a un an. Le comportement des clients a changé depuis, les données d'entrée en production ne ressemblent plus aux données d'entraînement, et l'exactitude du modèle a lentement baissé.

    Quelle pratique MLOps répond à ce problème ?
body:
  options:
    - { id: a, text: { en: "Move the model to a larger instance type so that it computes predictions faster.", fr: "Déplacer le modèle vers un type d'instance plus grand pour qu'il calcule les prédictions plus vite." } }
    - { id: b, text: { en: "Add an approval step in the model registry before each new deployment.", fr: "Ajouter une étape d'approbation dans le registre de modèles avant chaque nouveau déploiement." } }
    - { id: c, text: { en: "Train the original model for more epochs on the original training dataset.", fr: "Entraîner le modèle d'origine sur plus d'époques avec le jeu de données d'entraînement d'origine." } }
    - { id: d, text: { en: "Track production data and model quality, and retrain on recent data when metrics drop.", fr: "Suivre les données de production et la qualité du modèle, et réentraîner sur des données récentes quand les métriques baissent." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The model suffers from drift: production data has moved away from the training data. MLOps answers this with continuous monitoring of data and model metrics and with continuous training, where monitoring results or data changes trigger retraining on fresh data before redeployment."
    fr: "Le modèle subit une dérive : les données de production se sont éloignées des données d'entraînement. Le MLOps y répond par la surveillance continue des données et des métriques du modèle et par l'entraînement continu, où les résultats de la surveillance ou les changements de données déclenchent un réentraînement sur des données récentes avant le redéploiement."
  options:
    a:
      en: "A larger instance changes latency and capacity, not the quality of predictions on changed data."
      fr: "Une instance plus grande change la latence et la capacité, pas la qualité des prédictions sur des données qui ont changé."
    b:
      en: "An approval step improves governance, but it does not detect drift or update the model with recent data."
      fr: "Une étape d'approbation améliore la gouvernance, mais elle ne détecte pas la dérive et ne met pas à jour le modèle avec des données récentes."
    c:
      en: "More epochs on old data cannot teach the model the new behavior and can cause overfitting."
      fr: "Plus d'époques sur d'anciennes données ne peuvent pas apprendre au modèle le nouveau comportement et peuvent provoquer un surajustement."
references:
  - title: What is MLOps?
    url: https://aws.amazon.com/what-is/mlops/
