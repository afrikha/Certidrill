id: aifc01-1c-svc-quick-dashboards
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company stores the weekly demand forecasts of its ML model in Amazon Redshift. Store managers need interactive business intelligence dashboards that show the forecasts by region.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise de distribution stocke dans Amazon Redshift les prévisions hebdomadaires de la demande produites par son modèle de ML. Les responsables de magasin ont besoin de tableaux de bord interactifs d'informatique décisionnelle (BI) qui affichent les prévisions par région.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Quick" }
    - { id: b, text: "Kiro" }
    - { id: c, text: "AWS Glue DataBrew" }
    - { id: d, text: "Amazon SageMaker Feature Store" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Quick (named AWS Quick in the AWS documentation, formerly Amazon QuickSight) includes Quick Sight for interactive data visualization and business intelligence. It connects to data sources such as Amazon Redshift and builds dashboards that business users can explore."
    fr: "Amazon Quick (nommé AWS Quick dans la documentation AWS, anciennement Amazon QuickSight) inclut Quick Sight pour la visualisation interactive des données et l'informatique décisionnelle (BI). Il se connecte à des sources de données comme Amazon Redshift et crée des tableaux de bord que les utilisateurs métier peuvent explorer."
  options:
    b:
      en: "Kiro is an agentic coding service that helps developers turn prompts into specs, code and tests; it does not build dashboards."
      fr: "Kiro est un service de codage agentique qui aide les développeurs à transformer des invites en spécifications, en code et en tests ; il ne crée pas de tableaux de bord."
    c:
      en: "DataBrew prepares and cleans data before training; it does not publish dashboards to business users."
      fr: "DataBrew prépare et nettoie les données avant l'entraînement ; il ne publie pas de tableaux de bord pour les utilisateurs métier."
    d:
      en: "Feature Store stores features for training and inference; it has no business intelligence dashboards."
      fr: "Feature Store stocke des caractéristiques pour l'entraînement et l'inférence ; il n'a pas de tableaux de bord d'informatique décisionnelle."
references:
  - title: What is AWS Quick?
    url: https://docs.aws.amazon.com/quick/latest/userguide/what-is.html
