id: aifc01-1c-prod-managed-least-ops
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup wants to add text generation to its web application by using a foundation model (FM). The startup has no team to manage servers, GPUs or scaling.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une start-up veut ajouter de la génération de texte à son application web en utilisant un modèle de fondation (FM). Elle n'a pas d'équipe pour gérer des serveurs, des GPU ou la mise à l'échelle.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Host an open-source FM on Amazon EC2 GPU instances in an Auto Scaling group.", fr: "Héberger un FM open source sur des instances GPU Amazon EC2 dans un Auto Scaling group." } }
    - { id: b, text: { en: "Call an FM through the Amazon Bedrock API with on-demand pricing.", fr: "Appeler un FM par l'API Amazon Bedrock avec la tarification à la demande." } }
    - { id: c, text: { en: "Run an open-source FM in containers on an Amazon EKS cluster with GPU nodes.", fr: "Exécuter un FM open source dans des conteneurs sur un cluster Amazon EKS avec des nœuds GPU." } }
    - { id: d, text: { en: "Deploy an FM from SageMaker JumpStart to a SageMaker AI real-time endpoint.", fr: "Déployer un FM de SageMaker JumpStart sur un point de terminaison en temps réel SageMaker AI." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Bedrock is a managed API service: the application sends requests to the model and AWS runs and scales the infrastructure behind it. With on-demand pricing the startup pays for the tokens it uses and has no instances to choose, patch or scale."
    fr: "Amazon Bedrock est un service d'API géré : l'application envoie des requêtes au modèle et AWS exécute et met à l'échelle l'infrastructure sous-jacente. Avec la tarification à la demande, la start-up paie les jetons utilisés et n'a aucune instance à choisir, corriger ou mettre à l'échelle."
  options:
    a:
      en: "A self-hosted model on EC2 leaves the startup to manage instances, GPU drivers, the model server and scaling."
      fr: "Un modèle autohébergé sur EC2 laisse la start-up gérer les instances, les pilotes GPU, le serveur de modèle et la mise à l'échelle."
    c:
      en: "An EKS cluster requires managing nodes, containers and Kubernetes scaling, which is more operational work."
      fr: "Un cluster EKS demande de gérer des nœuds, des conteneurs et la mise à l'échelle Kubernetes, soit plus de travail opérationnel."
    d:
      en: "A SageMaker AI endpoint is managed hosting, but the startup still chooses instance types and counts and configures scaling."
      fr: "Un point de terminaison SageMaker AI est un hébergement géré, mais la start-up choisit toujours les types et le nombre d'instances et configure la mise à l'échelle."
references:
  - title: Amazon Bedrock FAQs
    url: https://aws.amazon.com/bedrock/faqs/
  - title: Amazon Bedrock Pricing
    url: https://aws.amazon.com/bedrock/pricing/
