id: aifc01-1c-prod-provisioned-steady
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A customer service company uses a foundation model in Amazon Bedrock for a chat assistant that receives a high and steady volume of requests all day. The company needs a fixed, guaranteed level of throughput for the model and accepts a commitment to lower the hourly price.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de service client utilise un modèle de fondation d'Amazon Bedrock pour un assistant conversationnel qui reçoit un volume de requêtes élevé et régulier toute la journée. L'entreprise a besoin d'un niveau de débit fixe et garanti pour le modèle et accepte un engagement pour réduire le prix horaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep using on-demand inference and pay per input and output token.", fr: "Continuer avec l'inférence à la demande et payer par jeton d'entrée et de sortie." } }
    - { id: b, text: { en: "Purchase Provisioned Throughput model units with a six-month term.", fr: "Acheter des unités de modèle de débit provisionné (Provisioned Throughput) pour une durée de six mois." } }
    - { id: c, text: { en: "Send the chat requests as Amazon Bedrock batch inference jobs.", fr: "Envoyer les requêtes de conversation sous forme de tâches d'inférence par lots Amazon Bedrock." } }
    - { id: d, text: { en: "Move the model to an Amazon SageMaker AI Serverless Inference endpoint.", fr: "Déplacer le modèle vers un point de terminaison SageMaker AI Serverless Inference." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Provisioned Throughput buys a fixed level of throughput, measured in model units of input and output tokens per minute, for an hourly price. A one-month or six-month commitment lowers the hourly price compared with no commitment."
    fr: "Le débit provisionné achète un niveau de débit fixe, mesuré en unités de modèle de jetons d'entrée et de sortie par minute, pour un prix horaire. Un engagement d'un mois ou de six mois réduit le prix horaire par rapport à l'absence d'engagement."
  options:
    a:
      en: "On-demand inference bills per token but does not reserve a fixed level of throughput for the company."
      fr: "L'inférence à la demande facture par jeton mais ne réserve pas un niveau de débit fixe pour l'entreprise."
    c:
      en: "Batch inference processes requests asynchronously at a lower price; it does not serve live chat conversations."
      fr: "L'inférence par lots traite les requêtes de façon asynchrone à un prix réduit ; elle ne sert pas des conversations en direct."
    d:
      en: "Serverless Inference runs on CPU only and scales with traffic; it does not provide guaranteed throughput for a Bedrock model."
      fr: "Serverless Inference s'exécute uniquement sur processeur et suit le trafic ; il ne fournit pas de débit garanti pour un modèle Bedrock."
references:
  - title: Provisioned Throughput in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
  - title: Amazon Bedrock Pricing
    url: https://aws.amazon.com/bedrock/pricing/
