id: aifc01-1b-app-policy-questions
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants employees to ask questions in natural language, such as "How many vacation days do I get?", and receive answers that come from the company's own HR policy documents, with a citation to the source document. Which type of AI application meets this requirement?
  fr: |
    Une entreprise souhaite que ses employés posent des questions en langage naturel, comme « Combien de jours de congé ai-je ? », et reçoivent des réponses issues des propres documents de politique RH de l'entreprise, avec une citation du document source. Quel type d'application d'IA répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "A recommendation system trained on employee activity", fr: "Un système de recommandation entraîné sur l'activité des employés" }
    - id: b
      text: { en: "A sentiment analysis model applied to the documents", fr: "Un modèle d'analyse des sentiments appliqué aux documents" }
    - id: c
      text: { en: "A knowledge base that grounds a generative model in the documents", fr: "Une base de connaissances qui ancre un modèle génératif dans les documents" }
    - id: d
      text: { en: "A clustering model that groups the documents by topic", fr: "Un modèle de clustering qui regroupe les documents par sujet" }
answer: { optionId: c }
explanation:
  correct:
    en: "A knowledge base retrieves the passages of company documents that are relevant to a question and passes them to a generative model, which answers from that content (Retrieval Augmented Generation, RAG). Amazon Bedrock Knowledge Bases can also include citations so that users can check the source."
    fr: "Une base de connaissances récupère les passages des documents de l'entreprise pertinents pour une question et les transmet à un modèle génératif, qui répond à partir de ce contenu (génération à enrichissement contextuel, RAG). Amazon Bedrock Knowledge Bases peut aussi inclure des citations pour que les utilisateurs vérifient la source."
  options:
    a:
      en: "A recommendation system suggests items based on behavior; it does not answer questions from documents."
      fr: "Un système de recommandation suggère des éléments selon le comportement ; il ne répond pas à des questions à partir de documents."
    b:
      en: "Sentiment analysis detects whether text is positive, negative, neutral or mixed; it does not produce answers."
      fr: "L'analyse des sentiments détecte si un texte est positif, négatif, neutre ou mitigé ; elle ne produit pas de réponses."
    d:
      en: "Clustering organizes documents into groups but does not answer an employee's question."
      fr: "Le clustering organise les documents en groupes mais ne répond pas à la question d'un employé."
references:
  - title: "Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
