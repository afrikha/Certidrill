id: aifc01-1b-notml-evaluate-first
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company wants to automate a manual approval step. A project team proposes an ML solution. Before the team collects data or chooses an algorithm, what should the team determine according to AWS ML best practices?
  fr: |
    Une entreprise de logistique souhaite automatiser une étape d'approbation manuelle. Une équipe projet propose une solution de ML. Avant de collecter des données ou de choisir un algorithme, que doit déterminer l'équipe selon les bonnes pratiques ML d'AWS ?
body:
  options:
    - id: a
      text: { en: "Which instance type gives the shortest training time for the model", fr: "Quel type d'instance donne le temps d'entraînement le plus court pour le modèle" }
    - id: b
      text: { en: "Which metric will detect data drift after the model is deployed", fr: "Quelle métrique détectera la dérive des données après le déploiement du modèle" }
    - id: c
      text: { en: "Whether ML is the right approach compared with simpler options such as business rules", fr: "Si le ML est la bonne approche par rapport à des options plus simples comme des règles métier" }
    - id: d
      text: { en: "Which hyperparameter values give the highest accuracy on the validation data", fr: "Quelles valeurs d'hyperparamètres donnent la meilleure exactitude sur les données de validation" }
answer: { optionId: c }
explanation:
  correct:
    en: "The first phases of the ML lifecycle are business goal identification and problem framing. In these phases the team evaluates whether ML is the appropriate approach, because some business problems are solved better by simple business rules, and others lack the data that ML needs."
    fr: "Les premières phases du cycle de vie ML sont l'identification de l'objectif métier et la formulation du problème de ML. Dans ces phases, l'équipe évalue si le ML est l'approche appropriée, car certains problèmes métier sont mieux résolus par de simples règles métier, et d'autres n'ont pas les données dont le ML a besoin."
  options:
    a:
      en: "Training infrastructure is chosen during model development, after the team has decided that ML is appropriate."
      fr: "L'infrastructure d'entraînement est choisie pendant le développement du modèle, après avoir décidé que le ML est approprié."
    b:
      en: "Drift detection belongs to the model monitoring phase, which comes after deployment."
      fr: "La détection de la dérive relève de la phase de surveillance du modèle, qui vient après le déploiement."
    d:
      en: "Hyperparameter tuning happens during model development; it is pointless if ML is not the right approach."
      fr: "Le réglage des hyperparamètres a lieu pendant le développement du modèle ; il est inutile si le ML n'est pas la bonne approche."
references:
  - title: "Business goal identification - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/business-goal-identification.html
  - title: "ML problem framing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/ml-problem-framing.html
