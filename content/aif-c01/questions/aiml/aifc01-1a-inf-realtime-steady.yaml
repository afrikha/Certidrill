id: aifc01-1a-inf-realtime-steady
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company hosts a product recommendation model in Amazon SageMaker AI. The website calls the model while customers browse, traffic is steady and high throughout the day, and each request must return with consistently low latency. The application cannot tolerate cold-start delays.

    Which inference option meets these requirements?
  fr: |
    Une entreprise d'e-commerce héberge un modèle de recommandation de produits dans Amazon SageMaker AI. Le site web appelle le modèle pendant que les clients naviguent, le trafic est régulier et élevé tout au long de la journée, et chaque requête doit répondre avec une latence faible et constante. L'application ne peut pas tolérer les délais de démarrage à froid.

    Quelle option d'inférence répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Asynchronous Inference", fr: "Asynchronous Inference (inférence asynchrone)" } }
    - { id: b, text: { en: "Batch transform", fr: "Transformation par lots (batch transform)" } }
    - { id: c, text: { en: "Real-time inference", fr: "Inférence en temps réel (real-time inference)" } }
    - { id: d, text: { en: "Serverless Inference", fr: "Serverless Inference (inférence sans serveur)" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Real-time inference is designed for interactive workloads with low latency requirements. The model runs on a fully managed endpoint that supports automatic scaling, so steady traffic is served without cold starts."
    fr: "L'inférence en temps réel est conçue pour les charges de travail interactives à faible latence. Le modèle s'exécute sur un point de terminaison entièrement géré qui prend en charge la mise à l'échelle automatique : un trafic régulier est servi sans démarrage à froid."
  options:
    a:
      en: "Asynchronous Inference queues requests and returns the result later in Amazon S3; it targets large payloads and long processing, not immediate responses while a customer browses."
      fr: "Asynchronous Inference met les requêtes en file d'attente et renvoie le résultat plus tard dans Amazon S3 ; elle vise les charges utiles volumineuses et les traitements longs, pas les réponses immédiates pendant la navigation d'un client."
    b:
      en: "Batch transform processes a whole dataset as a job; it does not answer individual requests from a website."
      fr: "La transformation par lots traite un jeu de données complet sous forme de tâche ; elle ne répond pas aux requêtes individuelles d'un site web."
    d:
      en: "Serverless Inference suits workloads with idle periods that can tolerate cold starts; the application cannot tolerate them."
      fr: "Serverless Inference convient aux charges de travail avec des périodes d'inactivité qui tolèrent les démarrages à froid ; l'application ne peut pas les tolérer."
references:
  - title: "Real-time inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html
  - title: "Deploy models for inference - Amazon SageMaker AI"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model.html
