id: aifc01-1a-data-structured-example
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is classifying its data sources before an ML project.

    Which data source is an example of structured data?
  fr: |
    Une entreprise classe ses sources de données avant un projet de ML.

    Quelle source de données est un exemple de données structurées ?
body:
  options:
    - { id: a, text: { en: "A collection of scanned PDF contracts", fr: "Une collection de contrats PDF numérisés" } }
    - { id: b, text: { en: "Recordings of customer support calls", fr: "Des enregistrements d'appels au support client" } }
    - { id: c, text: { en: "Posts that customers publish on social media", fr: "Des publications de clients sur les réseaux sociaux" } }
    - { id: d, text: { en: "An orders table in a relational database", fr: "Une table de commandes dans une base de données relationnelle" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Structured data follows a fixed schema and fits into rows and columns, such as a table in a relational database. Each order has the same columns, which makes the data easy to search and to use as tabular input for ML."
    fr: "Les données structurées suivent un schéma fixe et tiennent en lignes et en colonnes, comme une table d'une base de données relationnelle. Chaque commande a les mêmes colonnes, ce qui rend les données faciles à interroger et à utiliser comme entrée tabulaire pour le ML."
  options:
    a:
      en: "Scanned documents are unstructured: they have no predefined data model and need processing, such as text extraction, before analysis."
      fr: "Les documents numérisés sont non structurés : ils n'ont pas de modèle de données prédéfini et nécessitent un traitement, comme l'extraction de texte, avant l'analyse."
    b:
      en: "Audio recordings are unstructured data."
      fr: "Les enregistrements audio sont des données non structurées."
    c:
      en: "Social media posts are free text, which is unstructured data."
      fr: "Les publications sur les réseaux sociaux sont du texte libre, c'est-à-dire des données non structurées."
references:
  - title: "Structured Data vs Unstructured Data - Difference Between Collectible Data - AWS"
    url: https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/
