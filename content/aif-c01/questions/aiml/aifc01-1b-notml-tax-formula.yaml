id: aifc01-1b-notml-tax-formula
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A payroll company must calculate a statutory deduction for each payslip. The tax authority publishes the exact formula, and every result must match that formula to the cent. Which solution will meet these requirements?
  fr: |
    Une entreprise de gestion de la paie doit calculer une retenue légale pour chaque bulletin de salaire. L'administration fiscale publie la formule exacte, et chaque résultat doit correspondre à cette formule au centime près. Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Train a regression model on past payslips to predict the deduction.", fr: "Entraîner un modèle de régression sur les anciens bulletins pour prédire la retenue." }
    - id: b
      text: { en: "Implement the published formula as deterministic rules in the payroll code.", fr: "Implémenter la formule publiée sous forme de règles déterministes dans le code de paie." }
    - id: c
      text: { en: "Send each payslip to a foundation model and ask it to compute the deduction.", fr: "Envoyer chaque bulletin à un modèle de fondation et lui demander de calculer la retenue." }
    - id: d
      text: { en: "Train a classification model that assigns each payslip to a deduction bracket.", fr: "Entraîner un modèle de classification qui affecte chaque bulletin à une tranche de retenue." }
answer: { optionId: b }
explanation:
  correct:
    en: "The outcome is fully specified by a known formula and must be exact, so simple business rules do the job better than ML. A model learns an approximation from examples and returns a prediction that can differ from the formula, while code that applies the formula always returns the required result at almost no cost."
    fr: "Le résultat est entièrement défini par une formule connue et doit être exact : de simples règles métier font mieux que le ML. Un modèle apprend une approximation à partir d'exemples et renvoie une prédiction qui peut s'écarter de la formule, alors que le code qui applique la formule renvoie toujours le résultat exigé, pour un coût quasi nul."
  options:
    a:
      en: "A regression model only approximates the formula from past data; some predictions would not match the exact amount that the law requires."
      fr: "Un modèle de régression ne fait qu'approcher la formule à partir des données passées ; certaines prédictions ne correspondraient pas au montant exact imposé par la loi."
    c:
      en: "A foundation model generates a probable answer and can make arithmetic errors; it cannot guarantee a result that is correct to the cent."
      fr: "Un modèle de fondation génère une réponse probable et peut commettre des erreurs de calcul ; il ne peut pas garantir un résultat exact au centime près."
    d:
      en: "Predicting a bracket does not produce the exact amount, and the bracket itself is already defined by the formula, so no model is needed."
      fr: "Prédire une tranche ne donne pas le montant exact, et la tranche est déjà définie par la formule : aucun modèle n'est nécessaire."
references:
  - title: "ML problem framing - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/ml-problem-framing.html
