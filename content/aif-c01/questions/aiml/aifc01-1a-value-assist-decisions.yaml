id: aifc01-1a-value-assist-decisions
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A consulting firm is cataloging how its clients use AI.

    Which two applications use AI to assist human decision making rather than to fully automate a task? (Choose two.)
  fr: |
    Un cabinet de conseil répertorie la manière dont ses clients utilisent l'IA.

    Quelles sont les deux applications qui utilisent l'IA pour aider à la prise de décision humaine plutôt que pour automatiser entièrement une tâche ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A model scores each loan application, and a loan officer decides by using the score.", fr: "Un modèle note chaque demande de prêt, et un conseiller décide à l'aide de cette note." } }
    - { id: b, text: { en: "A system extracts invoice fields and posts them to accounting with no human review.", fr: "Un système extrait les champs des factures et les enregistre en comptabilité sans revue humaine." } }
    - { id: c, text: { en: "A chatbot resets customer passwords from start to finish without an agent.", fr: "Un chatbot réinitialise les mots de passe des clients de bout en bout sans agent." } }
    - { id: d, text: { en: "A model flags claims with a high fraud risk for an investigator to examine.", fr: "Un modèle signale les sinistres à risque de fraude élevé pour qu'un enquêteur les examine." } }
    - { id: e, text: { en: "A thermostat follows a fixed heating schedule that a technician programmed.", fr: "Un thermostat suit un programme de chauffage fixe qu'un technicien a configuré." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "In both applications, the model turns large volumes of data into a score or a flag, and a person makes the final decision: the loan officer approves or rejects, and the investigator decides whether a claim is fraudulent. This is AI that assists human decision making."
    fr: "Dans les deux applications, le modèle transforme de grands volumes de données en une note ou un signalement, et une personne prend la décision finale : le conseiller approuve ou refuse, et l'enquêteur décide si un sinistre est frauduleux. C'est une IA qui aide à la prise de décision humaine."
  options:
    b:
      en: "Posting extracted fields with no human review is end-to-end automation."
      fr: "Enregistrer les champs extraits sans revue humaine relève de l'automatisation de bout en bout."
    c:
      en: "A chatbot that completes password resets without an agent automates the task."
      fr: "Un chatbot qui effectue les réinitialisations de mots de passe sans agent automatise la tâche."
    e:
      en: "A fixed, programmed schedule follows rules and does not learn from data; it does not inform a human decision."
      fr: "Un programme fixe configuré suit des règles et n'apprend pas à partir des données ; il n'éclaire pas une décision humaine."
references:
  - title: "What is AI? - Artificial Intelligence Explained - AWS"
    url: https://aws.amazon.com/what-is/artificial-intelligence/
