id: aifc01-1b-pipe-calculated-feature
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A subscription company is preparing data for a churn prediction model. The raw data contains the date of each customer's purchases. A data scientist adds a new column, "days since last purchase", calculated from these dates because it is expected to improve predictions. Which component of the ML pipeline does this task belong to?
  fr: |
    Une entreprise d'abonnements prépare des données pour un modèle de prédiction de l'attrition. Les données brutes contiennent la date de chaque achat des clients. Un data scientist ajoute une nouvelle colonne, « jours depuis le dernier achat », calculée à partir de ces dates, car elle devrait améliorer les prédictions. À quel composant du pipeline ML cette tâche appartient-elle ?
body:
  options:
    - id: a
      text: { en: "Data collection", fr: "Collecte des données" }
    - id: b
      text: { en: "Model monitoring", fr: "Surveillance du modèle" }
    - id: c
      text: { en: "Feature engineering", fr: "Ingénierie des caractéristiques (feature engineering)" }
    - id: d
      text: { en: "Model evaluation", fr: "Évaluation du modèle" }
answer: { optionId: c }
explanation:
  correct:
    en: "Feature engineering selects and transforms the variables that a model uses. Feature creation, one of its steps, builds new features from existing data, such as calculated features, one-hot encoding, binning, or splitting, to help the model make better predictions."
    fr: "L'ingénierie des caractéristiques sélectionne et transforme les variables qu'un modèle utilise. La création de caractéristiques, l'une de ses étapes, construit de nouvelles caractéristiques à partir des données existantes, comme des caractéristiques calculées, l'encodage one-hot, la discrétisation (binning) ou le fractionnement, pour aider le modèle à mieux prédire."
  options:
    a:
      en: "Data collection identifies, labels, ingests and aggregates the data; the purchase dates were already collected."
      fr: "La collecte des données identifie, étiquette, ingère et agrège les données ; les dates d'achat ont déjà été collectées."
    b:
      en: "Model monitoring checks a deployed model's performance in production; it does not create training features."
      fr: "La surveillance du modèle vérifie les performances d'un modèle déployé en production ; elle ne crée pas de caractéristiques d'entraînement."
    d:
      en: "Model evaluation measures the trained model against success metrics; it does not change the input columns."
      fr: "L'évaluation du modèle mesure le modèle entraîné par rapport aux métriques de réussite ; elle ne modifie pas les colonnes d'entrée."
references:
  - title: "Feature engineering - Machine Learning Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/feature-engineering.html
