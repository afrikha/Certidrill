id: aifc01-1b-svc-call-recordings
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company stores thousands of recorded customer calls as audio files in Amazon S3. The company needs a text version of each call so that analysts can search the conversations. The company has no ML expertise. Which AWS service will meet these requirements?
  fr: |
    Une compagnie d'assurance stocke des milliers d'appels clients enregistrés sous forme de fichiers audio dans Amazon S3. Elle a besoin d'une version texte de chaque appel pour que les analystes puissent faire des recherches dans les conversations. L'entreprise n'a aucune expertise en ML. Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: "Amazon Polly"
    - id: b
      text: "Amazon Comprehend"
    - id: c
      text: "Amazon Transcribe"
    - id: d
      text: "Amazon Translate"
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Transcribe is an automatic speech recognition service that converts audio to text. It can transcribe media files stored in an S3 bucket in batch, or audio streams in real time, without any model to build."
    fr: "Amazon Transcribe est un service de reconnaissance automatique de la parole qui convertit l'audio en texte. Il peut transcrire par lots des fichiers multimédias stockés dans un compartiment S3, ou des flux audio en temps réel, sans aucun modèle à créer."
  options:
    a:
      en: "Amazon Polly converts text into lifelike speech, the opposite direction."
      fr: "Amazon Polly convertit du texte en parole naturelle, dans le sens inverse."
    b:
      en: "Amazon Comprehend analyzes text that already exists; it does not convert audio to text."
      fr: "Amazon Comprehend analyse un texte qui existe déjà ; il ne convertit pas l'audio en texte."
    d:
      en: "Amazon Translate translates text between languages; it does not accept audio input."
      fr: "Amazon Translate traduit du texte d'une langue à une autre ; il n'accepte pas d'entrée audio."
references:
  - title: "What is Amazon Transcribe?"
    url: https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html
