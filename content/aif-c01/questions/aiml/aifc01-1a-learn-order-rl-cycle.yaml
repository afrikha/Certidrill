id: aifc01-1a-learn-order-rl-cycle
objective: "1.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A gaming company trains a reinforcement learning agent to play a racing game.

    Which four steps make up one learning cycle of the agent, in order? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise de jeux vidéo entraîne un agent d'apprentissage par renforcement à jouer à un jeu de course.

    Quelles sont les quatre étapes qui composent un cycle d'apprentissage de l'agent, dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: update
      text: { en: "The agent updates its policy to maximize the cumulative reward.", fr: "L'agent met à jour sa politique pour maximiser la récompense cumulée." }
    - id: label
      text: { en: "A person labels the correct action for every state of the game.", fr: "Une personne étiquette l'action correcte pour chaque état du jeu." }
    - id: observe
      text: { en: "The agent observes the current state of the environment.", fr: "L'agent observe l'état actuel de l'environnement." }
    - id: reward
      text: { en: "The environment returns a reward and a new state.", fr: "L'environnement renvoie une récompense et un nouvel état." }
    - id: cluster
      text: { en: "The agent groups similar game states into clusters.", fr: "L'agent regroupe les états de jeu similaires en clusters." }
    - id: act
      text: { en: "The agent chooses and performs an action according to its policy.", fr: "L'agent choisit et effectue une action selon sa politique." }
answer:
  sequence: [observe, act, reward, update]
explanation:
  correct:
    en: "A reinforcement learning agent observes the state of its environment, chooses an action according to its policy, and receives a reward (positive, negative, or zero) along with the new state. It then refines its policy to maximize the cumulative reward, and the cycle repeats by trial and error."
    fr: "Un agent d'apprentissage par renforcement observe l'état de son environnement, choisit une action selon sa politique et reçoit une récompense (positive, négative ou nulle) ainsi que le nouvel état. Il affine ensuite sa politique pour maximiser la récompense cumulée, et le cycle se répète par essais et erreurs."
  options:
    label:
      en: "Reinforcement learning does not need a labeled dataset of correct actions; that describes supervised learning."
      fr: "L'apprentissage par renforcement n'a pas besoin d'un jeu de données étiqueté d'actions correctes ; cela décrit l'apprentissage supervisé."
    cluster:
      en: "Grouping states into clusters is an unsupervised learning task, not a step of the reward cycle."
      fr: "Regrouper des états en clusters est une tâche d'apprentissage non supervisé, pas une étape du cycle de récompense."
references:
  - title: "What is Reinforcement Learning? - Reinforcement Learning Explained - AWS"
    url: https://aws.amazon.com/what-is/reinforcement-learning/
