id: aifc01-1a-rel-ml-genai-common
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A product manager compares a traditional ML model that predicts customer churn with a generative AI model that writes marketing emails.

    Which two statements are true for BOTH models? (Choose two.)
  fr: |
    Un chef de produit compare un modèle de ML traditionnel qui prédit la résiliation des clients et un modèle d'IA générative qui rédige des e-mails marketing.

    Quelles sont les deux affirmations vraies pour LES DEUX modèles ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The model learns patterns from training data instead of following rules that a developer wrote.", fr: "Le modèle apprend des schémas à partir des données d'entraînement au lieu de suivre des règles écrites par un développeur." } }
    - { id: b, text: { en: "The model was trained only on data that people labeled for its specific task.", fr: "Le modèle a été entraîné uniquement sur des données que des personnes ont étiquetées pour sa tâche précise." } }
    - { id: c, text: { en: "The model is designed mainly to create new content, such as text or images.", fr: "Le modèle est conçu principalement pour créer du nouveau contenu, comme du texte ou des images." } }
    - { id: d, text: { en: "The model's outputs are probabilistic and can be wrong, so they must be evaluated.", fr: "Les sorties du modèle sont probabilistes et peuvent être fausses : elles doivent être évaluées." } }
    - { id: e, text: { en: "The model can perform many unrelated tasks when it receives instructions in a prompt.", fr: "Le modèle peut effectuer de nombreuses tâches sans rapport entre elles lorsqu'il reçoit des instructions dans une invite." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Generative AI models are very large ML models, so both models learn patterns from data rather than from hand-written rules. Both produce outputs based on learned probabilities, so both can make mistakes and need evaluation before and after deployment."
    fr: "Les modèles d'IA générative sont de très grands modèles de ML : les deux modèles apprennent donc des schémas à partir des données plutôt que de règles écrites à la main. Tous deux produisent des sorties fondées sur des probabilités apprises : ils peuvent se tromper et doivent être évalués avant et après le déploiement."
  options:
    b:
      en: "Foundation models behind generative AI are pretrained mostly on large amounts of unlabeled data; only the churn model needs task-specific labels."
      fr: "Les modèles de fondation de l'IA générative sont pré-entraînés surtout sur de grandes quantités de données non étiquetées ; seul le modèle de résiliation a besoin d'étiquettes propres à sa tâche."
    c:
      en: "Creating new content is specific to generative AI; the churn model predicts an outcome."
      fr: "Créer du nouveau contenu est propre à l'IA générative ; le modèle de résiliation prédit un résultat."
    e:
      en: "Performing many tasks from prompts is a property of foundation models; a traditional churn model is built for one task."
      fr: "Effectuer de nombreuses tâches à partir d'invites est une propriété des modèles de fondation ; un modèle de résiliation traditionnel est conçu pour une seule tâche."
references:
  - title: "What is Generative AI? - Gen AI Explained - AWS"
    url: https://aws.amazon.com/what-is/generative-ai/
