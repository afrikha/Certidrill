id: aifc01-1b-tech-sensor-anomaly
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A water utility collects pressure readings from thousands of pipeline sensors. Failures are rare, and the historical readings are not labeled as normal or faulty. The utility wants to be alerted when a sensor starts to send readings that differ from its usual behavior. Which ML technique should the utility use?
  fr: |
    Une société de distribution d'eau collecte les mesures de pression de milliers de capteurs de canalisations. Les pannes sont rares, et les mesures historiques ne sont pas étiquetées comme normales ou défectueuses. La société souhaite être alertée quand un capteur commence à envoyer des mesures qui s'écartent de son comportement habituel. Quelle technique de ML la société doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Regression", fr: "Régression" }
    - id: b
      text: { en: "Multi-class classification", fr: "Classification multiclasse" }
    - id: c
      text: { en: "Anomaly detection", fr: "Détection d'anomalies" }
    - id: d
      text: { en: "Time-series forecasting", fr: "Prévision de séries chronologiques" }
answer: { optionId: c }
explanation:
  correct:
    en: "Anomaly detection learns what normal data looks like and flags data points that deviate from it. It works without labeled failures, which suits a case where failures are rare and readings are unlabeled, for example spotting a sensor that sends abnormal readings."
    fr: "La détection d'anomalies apprend à quoi ressemblent les données normales et signale les points qui s'en écartent. Elle fonctionne sans pannes étiquetées, ce qui convient à un cas où les pannes sont rares et les mesures non étiquetées, par exemple pour repérer un capteur qui envoie des mesures anormales."
  options:
    a:
      en: "Regression predicts a numeric value from labeled examples; it does not flag readings as unusual by itself."
      fr: "La régression prédit une valeur numérique à partir d'exemples étiquetés ; elle ne signale pas d'elle-même les mesures inhabituelles."
    b:
      en: "Classification needs labeled examples of each class, such as normal and faulty, and the readings are not labeled."
      fr: "La classification exige des exemples étiquetés de chaque classe, comme normal et défectueux, or les mesures ne sont pas étiquetées."
    d:
      en: "Forecasting predicts future values of a series; the requirement is to detect readings that are abnormal now."
      fr: "La prévision prédit les valeurs futures d'une série ; l'exigence est de détecter les mesures anormales dès maintenant."
references:
  - title: "Built-in algorithms and pretrained models in Amazon SageMaker"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html
