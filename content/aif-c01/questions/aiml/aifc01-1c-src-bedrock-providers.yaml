id: aifc01-1c-src-bedrock-providers
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company wants to compare foundation models (FMs) from several providers, including Amazon Nova models, for a text summarization feature. The company does not want to deploy or manage any model infrastructure.

    Which AWS service will meet these requirements?
  fr: |
    Un éditeur de logiciels veut comparer des modèles de fondation (FM) de plusieurs fournisseurs, dont les modèles Amazon Nova, pour une fonction de synthèse de texte. L'entreprise ne veut déployer ni gérer aucune infrastructure de modèle.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Bedrock" }
    - { id: b, text: "Amazon SageMaker HyperPod" }
    - { id: c, text: "Amazon EC2 with GPU instances" }
    - { id: d, text: "Amazon Comprehend" }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock is a fully managed service that gives access to FMs from Amazon and other leading AI companies through its APIs. The company calls the models it wants to compare without deploying or managing servers."
    fr: "Amazon Bedrock est un service entièrement géré qui donne accès, par ses API, à des FM d'Amazon et d'autres grandes entreprises d'IA. L'entreprise appelle les modèles à comparer sans déployer ni gérer de serveurs."
  options:
    b:
      en: "HyperPod provides clusters to train large models; the company would manage training workloads instead of calling existing FMs."
      fr: "HyperPod fournit des clusters pour entraîner de grands modèles ; l'entreprise gérerait des charges d'entraînement au lieu d'appeler des FM existants."
    c:
      en: "Running models on EC2 instances means deploying and managing the model infrastructure, which the company wants to avoid."
      fr: "Exécuter des modèles sur des instances EC2 revient à déployer et gérer l'infrastructure des modèles, ce que l'entreprise veut éviter."
    d:
      en: "Comprehend is a pretrained natural language processing service; it does not offer a choice of FMs from several providers."
      fr: "Comprehend est un service de traitement du langage naturel préentraîné ; il ne propose pas de choix de FM de plusieurs fournisseurs."
references:
  - title: Amazon Bedrock FAQs
    url: https://aws.amazon.com/bedrock/faqs/
