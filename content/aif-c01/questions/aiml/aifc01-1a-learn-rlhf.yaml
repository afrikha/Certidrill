id: aifc01-1a-learn-rlhf
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants the responses of its large language model (LLM) to better match what users find helpful. Human reviewers compare several responses to the same prompt and rank them. A separate model learns from these rankings to score any response, and the LLM is then optimized to produce responses that receive high scores.

    Which technique does the company use?
  fr: |
    Une entreprise veut que les réponses de son grand modèle de langage (LLM) correspondent mieux à ce que les utilisateurs jugent utile. Des réviseurs humains comparent plusieurs réponses à une même invite et les classent. Un modèle distinct apprend à partir de ces classements à noter n'importe quelle réponse, puis le LLM est optimisé pour produire des réponses qui obtiennent des notes élevées.

    Quelle technique l'entreprise utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Reinforcement learning from human feedback (RLHF)", fr: "L'apprentissage par renforcement à partir de commentaires humains (RLHF)" } }
    - { id: b, text: { en: "Supervised learning on prompts paired with one correct answer each", fr: "L'apprentissage supervisé sur des invites associées chacune à une seule réponse correcte" } }
    - { id: c, text: { en: "Unsupervised clustering of the responses by topic", fr: "Le clustering non supervisé des réponses par sujet" } }
    - { id: d, text: { en: "Self-supervised pretraining on more unlabeled text", fr: "Le pré-entraînement autosupervisé sur davantage de texte non étiqueté" } }
answer: { optionId: a }
explanation:
  correct:
    en: "RLHF adds human feedback to the reward function. Humans rank model responses, a reward model learns to predict those preferences, and the LLM is optimized with reinforcement learning to choose responses that the reward model scores highly."
    fr: "Le RLHF ajoute des commentaires humains à la fonction de récompense. Des humains classent les réponses du modèle, un modèle de récompense apprend à prédire ces préférences, et le LLM est optimisé par apprentissage par renforcement pour choisir les réponses que le modèle de récompense note le mieux."
  options:
    b:
      en: "Supervised fine-tuning learns from one reference answer per prompt; it does not train a reward model from rankings and optimize against it."
      fr: "Le fine-tuning supervisé apprend à partir d'une réponse de référence par invite ; il n'entraîne pas de modèle de récompense à partir de classements pour optimiser le LLM selon ce modèle."
    c:
      en: "Clustering groups similar responses without any human preference, so it cannot steer the model toward helpful answers."
      fr: "Le clustering regroupe des réponses similaires sans aucune préférence humaine : il ne peut pas orienter le modèle vers des réponses utiles."
    d:
      en: "Self-supervised pretraining learns language patterns from unlabeled text; it does not use human rankings of responses."
      fr: "Le pré-entraînement autosupervisé apprend des schémas linguistiques à partir de texte non étiqueté ; il n'utilise pas de classements humains des réponses."
references:
  - title: "What is RLHF? - Reinforcement Learning from Human Feedback Explained - AWS"
    url: https://aws.amazon.com/what-is/reinforcement-learning-from-human-feedback/
