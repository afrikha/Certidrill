id: aifc01-1c-met-recall-screening
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hospital uses a binary classification model to screen medical scans for a serious disease. Missing a sick patient is far more costly than sending a healthy patient for an extra test.

    Which metric should the hospital prioritize when it evaluates the model?
  fr: |
    Un hôpital utilise un modèle de classification binaire pour dépister une maladie grave sur des images médicales. Manquer un patient malade coûte bien plus cher qu'envoyer un patient en bonne santé faire un examen supplémentaire.

    Quelle métrique l'hôpital doit-il privilégier pour évaluer le modèle ?
body:
  options:
    - { id: a, text: { en: "Precision", fr: "Précision" } }
    - { id: b, text: { en: "Accuracy", fr: "Exactitude (accuracy)" } }
    - { id: c, text: { en: "Mean absolute error (MAE)", fr: "Erreur absolue moyenne (MAE)" } }
    - { id: d, text: { en: "Recall", fr: "Rappel" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Recall is TP / (TP + FN): the share of actual positives that the model finds. A missed sick patient is a false negative, so the hospital maximizes recall to find as many true positives as possible."
    fr: "Le rappel vaut TP / (TP + FN) : la part des positifs réels que le modèle trouve. Un patient malade manqué est un faux négatif ; l'hôpital maximise donc le rappel pour trouver le plus possible de vrais positifs."
  options:
    a:
      en: "Precision matters when false positives are costly; here the costly error is the false negative."
      fr: "La précision compte quand les faux positifs sont coûteux ; ici, l'erreur coûteuse est le faux négatif."
    b:
      en: "Accuracy counts all correct predictions and can stay high even when many sick patients are missed, because the disease is rare."
      fr: "L'exactitude compte toutes les prédictions correctes et peut rester élevée même si beaucoup de malades sont manqués, car la maladie est rare."
    c:
      en: "MAE evaluates regression models that predict numbers, not binary classifications."
      fr: "La MAE évalue des modèles de régression qui prédisent des nombres, pas des classifications binaires."
references:
  - title: Metrics and validation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
