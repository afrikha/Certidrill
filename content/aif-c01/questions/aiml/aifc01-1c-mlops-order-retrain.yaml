id: aifc01-1c-mlops-order-retrain
objective: "1.3.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    A logistics company automates the retraining of its delivery-time prediction model as part of its MLOps process.

    Select the four steps of the retraining cycle and arrange them in the correct order.
  fr: |
    Une entreprise de logistique automatise le réentraînement de son modèle de prédiction des délais de livraison dans le cadre de son processus MLOps.

    Sélectionnez les quatre étapes du cycle de réentraînement et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: eval, text: { en: "Evaluate the new model against the current production model.", fr: "Évaluer le nouveau modèle par rapport au modèle de production actuel." } }
    - { id: del, text: { en: "Delete the training data of the current model version.", fr: "Supprimer les données d'entraînement de la version actuelle du modèle." } }
    - { id: detect, text: { en: "Detect that the model quality in production fell below its threshold.", fr: "Détecter que la qualité du modèle en production est passée sous son seuil." } }
    - { id: deploy, text: { en: "Deploy the new model version after it is approved.", fr: "Déployer la nouvelle version du modèle après son approbation." } }
    - { id: scale, text: { en: "Increase the endpoint instance count to restore accuracy.", fr: "Augmenter le nombre d'instances du point de terminaison pour rétablir l'exactitude." } }
    - { id: retrain, text: { en: "Retrain the model on recent labeled data.", fr: "Réentraîner le modèle sur des données étiquetées récentes." } }
answer:
  sequence: [ detect, retrain, eval, deploy ]
explanation:
  correct:
    en: "Monitoring detects the drop in model quality and triggers the pipeline. The pipeline retrains the model on recent data, evaluates the new version against the model in production, and deploys it only once it is approved, so a worse model never replaces a better one."
    fr: "La surveillance détecte la baisse de qualité du modèle et déclenche le pipeline. Le pipeline réentraîne le modèle sur des données récentes, évalue la nouvelle version par rapport au modèle en production, et ne la déploie qu'après approbation : un modèle moins bon ne remplace jamais un meilleur."
  options:
    del:
      en: "Deleting the previous training data breaks reproducibility and the ability to roll back."
      fr: "Supprimer les données d'entraînement précédentes casse la reproductibilité et la possibilité de revenir en arrière."
    scale:
      en: "More instances add capacity; they do not improve the accuracy of a model whose data has drifted."
      fr: "Plus d'instances ajoutent de la capacité ; elles n'améliorent pas l'exactitude d'un modèle dont les données ont dérivé."
references:
  - title: What is MLOps?
    url: https://aws.amazon.com/what-is/mlops/
