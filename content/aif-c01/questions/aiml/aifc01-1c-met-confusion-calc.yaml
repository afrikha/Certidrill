id: aifc01-1c-met-confusion-calc
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturing company tests a model that flags defective parts on 1,000 parts. The results are:

    - Defective parts flagged as defective (true positives): 80
    - Good parts flagged as defective (false positives): 20
    - Defective parts not flagged (false negatives): 40
    - Good parts not flagged (true negatives): 860

    Which statement about the model's metrics is correct?
  fr: |
    Une entreprise industrielle teste sur 1 000 pièces un modèle qui signale les pièces défectueuses. Les résultats sont les suivants :

    - Pièces défectueuses signalées comme défectueuses (vrais positifs) : 80
    - Pièces bonnes signalées comme défectueuses (faux positifs) : 20
    - Pièces défectueuses non signalées (faux négatifs) : 40
    - Pièces bonnes non signalées (vrais négatifs) : 860

    Quelle affirmation sur les métriques du modèle est correcte ?
body:
  options:
    - { id: a, text: { en: "Precision is 0.80 and recall is about 0.67.", fr: "La précision est de 0,80 et le rappel d'environ 0,67." } }
    - { id: b, text: { en: "Precision is about 0.67 and recall is 0.80.", fr: "La précision est d'environ 0,67 et le rappel de 0,80." } }
    - { id: c, text: { en: "Accuracy is 0.80 and precision is 0.94.", fr: "L'exactitude est de 0,80 et la précision de 0,94." } }
    - { id: d, text: { en: "Recall is 0.94 and the F1 score is 0.80.", fr: "Le rappel est de 0,94 et le score F1 de 0,80." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Precision = TP / (TP + FP) = 80 / 100 = 0.80. Recall = TP / (TP + FN) = 80 / 120 ≈ 0.67. Accuracy = (80 + 860) / 1,000 = 0.94, and F1 = 2 × 0.80 × 0.67 / (0.80 + 0.67) ≈ 0.73."
    fr: "Précision = TP / (TP + FP) = 80 / 100 = 0,80. Rappel = TP / (TP + FN) = 80 / 120 ≈ 0,67. Exactitude = (80 + 860) / 1 000 = 0,94, et F1 = 2 × 0,80 × 0,67 / (0,80 + 0,67) ≈ 0,73."
  options:
    b:
      en: "This swaps the two formulas: false positives lower precision, and false negatives lower recall."
      fr: "Cette réponse inverse les deux formules : les faux positifs font baisser la précision, et les faux négatifs le rappel."
    c:
      en: "0.94 is the accuracy, (80 + 860) / 1,000, and 0.80 is the precision; the values are swapped."
      fr: "0,94 est l'exactitude, (80 + 860) / 1 000, et 0,80 la précision ; les valeurs sont inversées."
    d:
      en: "Recall is 80 / 120 ≈ 0.67, not 0.94, and the F1 score is about 0.73."
      fr: "Le rappel vaut 80 / 120 ≈ 0,67, pas 0,94, et le score F1 environ 0,73."
references:
  - title: Metrics and validation
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
