id: aifc01-1a-term-underfitting-fix
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A real estate company trains a simple model to estimate house prices from two features. The model has a high error rate on the training data and a similar high error rate on the test data.

    Which action is MOST likely to improve the model?
  fr: |
    Une entreprise immobilière entraîne un modèle simple pour estimer le prix des maisons à partir de deux caractéristiques. Le modèle a un taux d'erreur élevé sur les données d'entraînement et un taux d'erreur élevé similaire sur les données de test.

    Quelle action est la PLUS susceptible d'améliorer le modèle ?
body:
  options:
    - { id: a, text: { en: "Apply stronger regularization to reduce the influence of the features.", fr: "Appliquer une régularisation plus forte pour réduire l'influence des caractéristiques." } }
    - { id: b, text: { en: "Stop the training earlier so that the model learns less noise.", fr: "Arrêter l'entraînement plus tôt pour que le modèle apprenne moins de bruit." } }
    - { id: c, text: { en: "Add more relevant features or use a more complex model.", fr: "Ajouter des caractéristiques plus pertinentes ou utiliser un modèle plus complexe." } }
    - { id: d, text: { en: "Remove one of the two features to simplify the model.", fr: "Supprimer l'une des deux caractéristiques pour simplifier le modèle." } }
answer: { optionId: c }
explanation:
  correct:
    en: "High error on both training and test data means the model is underfitting: it is too simple or has too few features to capture the relationship between inputs and price. Adding relevant features, using a more complex model, or training longer reduces this high bias."
    fr: "Une erreur élevée à la fois sur les données d'entraînement et de test signifie que le modèle est sous-ajusté (underfitting) : il est trop simple ou dispose de trop peu de caractéristiques pour capturer la relation entre les entrées et le prix. Ajouter des caractéristiques pertinentes, utiliser un modèle plus complexe ou entraîner plus longtemps réduit ce biais élevé."
  options:
    a:
      en: "Regularization limits model flexibility to fight overfitting; it would make an underfitted model even simpler."
      fr: "La régularisation limite la souplesse du modèle pour lutter contre le surajustement ; elle rendrait un modèle sous-ajusté encore plus simple."
    b:
      en: "Early stopping prevents overfitting; stopping earlier gives an underfitted model even less training."
      fr: "L'arrêt anticipé (early stopping) évite le surajustement ; arrêter plus tôt réduit encore l'entraînement d'un modèle déjà sous-ajusté."
    d:
      en: "Removing features is a remedy for overfitting; with only one feature the model would capture even less of the relationship."
      fr: "Supprimer des caractéristiques est un remède au surajustement ; avec une seule caractéristique, le modèle capturerait encore moins la relation."
references:
  - title: "What is Overfitting? - Overfitting in Machine Learning Explained - AWS"
    url: https://aws.amazon.com/what-is/overfitting/
