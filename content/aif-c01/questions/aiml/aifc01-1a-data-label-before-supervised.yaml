id: aifc01-1a-data-label-before-supervised
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A furniture retailer has 2 million product photos with no tags. It wants to train a supervised model that classifies each new photo into one of its 20 existing product categories.

    What must the company do before it trains the model?
  fr: |
    Un détaillant de meubles dispose de 2 millions de photos de produits sans balises. Il veut entraîner un modèle supervisé qui classe chaque nouvelle photo dans l'une de ses 20 catégories de produits existantes.

    Que doit faire l'entreprise avant d'entraîner le modèle ?
body:
  options:
    - { id: a, text: { en: "Label a representative set of photos with their correct product category.", fr: "Étiqueter un ensemble représentatif de photos avec leur catégorie de produit correcte." } }
    - { id: b, text: { en: "Run a clustering algorithm and use the cluster numbers as the category names.", fr: "Exécuter un algorithme de clustering et utiliser les numéros de clusters comme noms de catégories." } }
    - { id: c, text: { en: "Convert the photos into time-series data ordered by upload date.", fr: "Convertir les photos en données de séries chronologiques triées par date de chargement." } }
    - { id: d, text: { en: "Remove the photos and keep only the product descriptions.", fr: "Supprimer les photos et ne conserver que les descriptions de produits." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Supervised learning maps inputs to known outputs, so it needs labeled examples. The company must first tag a representative set of photos with the correct category; that ground truth is used to train and evaluate the classifier."
    fr: "L'apprentissage supervisé associe des entrées à des sorties connues : il a besoin d'exemples étiquetés. L'entreprise doit d'abord baliser un ensemble représentatif de photos avec la catégorie correcte ; cette vérité terrain (ground truth) sert à entraîner et à évaluer le classifieur."
  options:
    b:
      en: "Clustering finds its own groups in unlabeled data; those groups do not necessarily match the 20 existing categories."
      fr: "Le clustering trouve ses propres groupes dans des données non étiquetées ; ces groupes ne correspondent pas forcément aux 20 catégories existantes."
    c:
      en: "Ordering photos by date does not tell the model which category each photo belongs to."
      fr: "Trier les photos par date n'indique pas au modèle à quelle catégorie appartient chaque photo."
    d:
      en: "The requirement is to classify photos, so the model must be trained on photos with their categories."
      fr: "L'exigence est de classer des photos : le modèle doit donc être entraîné sur des photos accompagnées de leur catégorie."
references:
  - title: "What is Data Labeling? - Data Labeling Explained - AWS"
    url: https://aws.amazon.com/what-is/data-labeling/
