id: aifc01-1c-svc-databrew-prep
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank's business analysts must clean and normalize customer data in Amazon S3 before data scientists train an ML model on it. The analysts do not write code and want to profile the data and apply ready-made transformations in a visual interface.

    Which AWS service will meet these requirements?
  fr: |
    Les analystes métier d'une banque doivent nettoyer et normaliser des données clients dans Amazon S3 avant que les scientifiques des données n'entraînent un modèle de ML dessus. Les analystes n'écrivent pas de code et veulent profiler les données et appliquer des transformations prêtes à l'emploi dans une interface visuelle.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon SageMaker Model Registry" }
    - { id: b, text: "Amazon SageMaker JumpStart" }
    - { id: c, text: "AWS Glue DataBrew" }
    - { id: d, text: "Amazon CloudWatch" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Glue DataBrew is a serverless visual data preparation tool for cleaning and normalizing data without writing code. It offers more than 250 ready-made transformations and data profiling, and writes the prepared data to Amazon S3 for the training stage."
    fr: "AWS Glue DataBrew est un outil sans serveur de préparation visuelle des données qui nettoie et normalise les données sans écrire de code. Il propose plus de 250 transformations prêtes à l'emploi et le profilage des données, et écrit les données préparées dans Amazon S3 pour l'étape d'entraînement."
  options:
    a:
      en: "Model Registry belongs to the deployment stage: it catalogs and approves trained model versions."
      fr: "Model Registry relève de l'étape de déploiement : il catalogue et approuve des versions de modèles entraînés."
    b:
      en: "JumpStart provides pretrained models and solution templates; it does not prepare the bank's data."
      fr: "JumpStart fournit des modèles préentraînés et des modèles de solution ; il ne prépare pas les données de la banque."
    d:
      en: "CloudWatch collects metrics and logs for monitoring; it does not transform data."
      fr: "CloudWatch collecte des métriques et des journaux pour la supervision ; il ne transforme pas les données."
references:
  - title: What is AWS Glue DataBrew?
    url: https://docs.aws.amazon.com/databrew/latest/dg/what-is.html
