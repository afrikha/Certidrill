id: aifc01-2a-tokens-provisioned-custom
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has customized a model on Amazon Bedrock. An internal application sends steady, high traffic to the model 24 hours a day. The company wants a fixed hourly cost and is willing to commit for 6 months to get a lower price.

    Which option will meet these requirements?
  fr: |
    Une entreprise a personnalisé un modèle sur Amazon Bedrock. Une application interne envoie au modèle un trafic élevé et régulier 24 heures sur 24. L'entreprise veut un coût horaire fixe et accepte un engagement de 6 mois pour obtenir un prix plus bas.

    Quelle option répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Batch inference jobs submitted every hour", fr: "Des tâches d'inférence par lots soumises toutes les heures" } }
    - { id: b, text: { en: "Provisioned Throughput with a 6-month commitment", fr: "Du Provisioned Throughput avec un engagement de 6 mois" } }
    - { id: c, text: { en: "On-demand inference with the Flex service tier", fr: "L'inférence à la demande avec le niveau de service Flex" } }
    - { id: d, text: { en: "Intelligent prompt routing between two models", fr: "Le routage intelligent des invites entre deux modèles" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Provisioned Throughput buys a fixed level of throughput, measured in model units, for a base or custom model and is billed hourly. A 1-month or 6-month commitment gives a lower hourly price than no commitment, which fits steady, high traffic."
    fr: "Le Provisioned Throughput achète un niveau de débit fixe, mesuré en unités de modèle, pour un modèle de base ou personnalisé, et il est facturé à l'heure. Un engagement de 1 mois ou de 6 mois donne un prix horaire plus bas que sans engagement, ce qui convient à un trafic élevé et régulier."
  options:
    a:
      en: "Batch inference is asynchronous and billed per token, not at a fixed hourly cost, and it is not supported for provisioned models."
      fr: "L'inférence par lots est asynchrone et facturée au jeton, pas à un coût horaire fixe, et elle n'est pas prise en charge pour les modèles provisionnés."
    c:
      en: "The Flex tier gives a per-token discount for workloads that tolerate longer processing; it is not a fixed hourly price."
      fr: "Le niveau Flex accorde une remise par jeton pour les charges qui tolèrent un traitement plus long ; ce n'est pas un prix horaire fixe."
    d:
      en: "Intelligent prompt routing chooses between models of the same family for each request; it does not provide a fixed cost or capacity."
      fr: "Le routage intelligent des invites choisit pour chaque requête entre des modèles d'une même famille ; il ne fournit ni coût fixe ni capacité."
references:
  - title: "Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
