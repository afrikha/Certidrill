id: aifc01-2a-usecase-synthetic-data
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company needs realistic patient records to test a new scheduling application. The test records must not contain information about real patients.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé a besoin de dossiers de patients réalistes pour tester une nouvelle application de planification. Les dossiers de test ne doivent contenir aucune information sur de vrais patients.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use an FM to generate fictitious records that follow the structure of real records.", fr: "Utiliser un FM pour générer des dossiers fictifs qui suivent la structure des dossiers réels." } }
    - { id: b, text: { en: "Use Amazon Macie to generate new records from the production database.", fr: "Utiliser Amazon Macie pour générer de nouveaux dossiers à partir de la base de production." } }
    - { id: c, text: { en: "Copy the production records to the test environment with S3 replication.", fr: "Copier les dossiers de production vers l'environnement de test avec la réplication S3." } }
    - { id: d, text: { en: "Use Amazon Comprehend to translate the production records into another language.", fr: "Utiliser Amazon Comprehend pour traduire les dossiers de production dans une autre langue." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Generating synthetic data is a common generative AI use case: an FM creates new, fictitious records that look realistic, for example to test applications or to simulate rare cases, without exposing real patient data."
    fr: "La génération de données synthétiques est un cas d'utilisation courant de l'IA générative : un FM crée de nouveaux dossiers fictifs d'apparence réaliste, par exemple pour tester des applications ou simuler des cas rares, sans exposer de vraies données de patients."
  options:
    b:
      en: "Amazon Macie discovers and reports sensitive data in Amazon S3; it does not generate records."
      fr: "Amazon Macie découvre et signale les données sensibles dans Amazon S3 ; il ne génère pas de dossiers."
    c:
      en: "Copying production records puts real patient information in the test environment, which the requirement forbids."
      fr: "Copier les dossiers de production place de vraies informations de patients dans l'environnement de test, ce que l'exigence interdit."
    d:
      en: "Amazon Comprehend analyzes text, it does not translate it, and translated records would still describe real patients."
      fr: "Amazon Comprehend analyse le texte sans le traduire, et des dossiers traduits décriraient toujours de vrais patients."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
