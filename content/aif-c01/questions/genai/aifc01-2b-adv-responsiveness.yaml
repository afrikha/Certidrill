id: aifc01-2b-adv-responsiveness
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company's customers used to wait up to 6 hours for a reply to their questions. After the company deploys a generative AI assistant, customers get a relevant answer within seconds, at any time of day.

    Which advantage of generative AI does this improvement MOST directly illustrate?
  fr: |
    Les clients d'une compagnie d'assurance attendaient jusqu'à 6 heures une réponse à leurs questions. Depuis que l'entreprise a déployé un assistant d'IA générative, les clients obtiennent une réponse pertinente en quelques secondes, à toute heure.

    Quel avantage de l'IA générative cette amélioration illustre-t-elle le PLUS directement ?
body:
  options:
    - { id: a, text: { en: "Responsiveness", fr: "Réactivité" } }
    - { id: b, text: { en: "Determinism", fr: "Déterminisme" } }
    - { id: c, text: { en: "Interpretability", fr: "Interprétabilité" } }
    - { id: d, text: { en: "Adaptability", fr: "Adaptabilité" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Responsiveness is the ability of a generative AI application to answer immediately and at any hour. Replacing a 6-hour wait with an answer in seconds improves the customer experience, one of the main benefits of generative AI assistants."
    fr: "La réactivité est la capacité d'une application d'IA générative à répondre immédiatement et à toute heure. Remplacer une attente de 6 heures par une réponse en quelques secondes améliore l'expérience client, l'un des principaux avantages des assistants d'IA générative."
  options:
    b:
      en: "Generative AI is nondeterministic: the same question can get different answers. Determinism is not one of its advantages."
      fr: "L'IA générative est non déterministe : une même question peut recevoir des réponses différentes. Le déterminisme ne fait pas partie de ses avantages."
    c:
      en: "Interpretability is a limitation of generative AI, whose models are often black boxes."
      fr: "L'interprétabilité est une limite de l'IA générative, dont les modèles sont souvent des boîtes noires."
    d:
      en: "Adaptability is about one model handling many different tasks; the improvement described is the speed and availability of answers."
      fr: "L'adaptabilité concerne un modèle capable de traiter de nombreuses tâches différentes ; l'amélioration décrite porte sur la rapidité et la disponibilité des réponses."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
