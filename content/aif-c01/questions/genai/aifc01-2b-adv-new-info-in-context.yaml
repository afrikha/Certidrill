id: aifc01-2b-adv-new-info-in-context
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online store's generative AI assistant answers questions about a product catalog that changes every day. The company does not want to retrain or customize any model when the catalog changes.

    Which characteristic of foundation models (FMs) makes this possible?
  fr: |
    L'assistant d'IA générative d'une boutique en ligne répond aux questions sur un catalogue de produits qui change chaque jour. L'entreprise ne veut réentraîner ni personnaliser aucun modèle quand le catalogue change.

    Quelle caractéristique des modèles de fondation (FM) rend cela possible ?
body:
  options:
    - { id: a, text: { en: "The FM updates its weights automatically after each conversation.", fr: "Le FM met à jour automatiquement ses pondérations après chaque conversation." } }
    - { id: b, text: { en: "The FM has built-in access to every database of the company.", fr: "Le FM dispose d'un accès intégré à toutes les bases de données de l'entreprise." } }
    - { id: c, text: { en: "The FM can use current information that the application adds to the prompt at inference time.", fr: "Le FM peut utiliser des informations à jour que l'application ajoute à l'invite au moment de l'inférence." } }
    - { id: d, text: { en: "The FM permanently memorizes the catalog the first time it reads it.", fr: "Le FM mémorise définitivement le catalogue la première fois qu'il le lit." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An FM generates its answer from the content of the prompt as well as from what it learned in training. When the application retrieves the current catalog entries and adds them to the prompt, as in Retrieval Augmented Generation (RAG), the assistant adapts to new information without any retraining."
    fr: "Un FM génère sa réponse à partir du contenu de l'invite et de ce qu'il a appris pendant l'entraînement. Quand l'application récupère les entrées actuelles du catalogue et les ajoute à l'invite, comme dans la génération augmentée par récupération (RAG), l'assistant s'adapte aux nouvelles informations sans aucun réentraînement."
  options:
    a:
      en: "A deployed FM does not change its weights during inference; weights change only through training or customization."
      fr: "Un FM déployé ne modifie pas ses pondérations pendant l'inférence ; elles ne changent que par l'entraînement ou la personnalisation."
    b:
      en: "An FM has no built-in access to company systems; the application must retrieve the data or give the model tools."
      fr: "Un FM n'a aucun accès intégré aux systèmes de l'entreprise ; l'application doit récupérer les données ou fournir des outils au modèle."
    d:
      en: "Content in a prompt is used only for that request; the model does not retain it afterward."
      fr: "Le contenu d'une invite ne sert qu'à cette requête ; le modèle ne le conserve pas ensuite."
references:
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
