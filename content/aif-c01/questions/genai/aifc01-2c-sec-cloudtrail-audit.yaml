id: aifc01-2c-sec-cloudtrail-audit
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A knowledge base in Amazon Bedrock was deleted last night. The security team must find out which IAM identity made the deletion request, at what time and from which source IP address.

    Which AWS service will provide this information?
  fr: |
    Une base de connaissances Amazon Bedrock a été supprimée la nuit dernière. L'équipe de sécurité doit savoir quelle identité IAM a envoyé la demande de suppression, à quelle heure et depuis quelle adresse IP source.

    Quel service AWS fournit ces informations ?
body:
  options:
    - { id: a, text: "Amazon CloudWatch metrics" }
    - { id: b, text: "Amazon Bedrock model invocation logging" }
    - { id: c, text: "AWS CloudTrail" }
    - { id: d, text: "Amazon Inspector" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS CloudTrail records Amazon Bedrock API calls as events. Each event shows the identity that made the request (userIdentity), the time (eventTime) and the source IP address. Control-plane operations such as deleting a knowledge base are management events, which CloudTrail logs by default."
    fr: "AWS CloudTrail enregistre les appels d'API Amazon Bedrock sous forme d'événements. Chaque événement indique l'identité qui a fait la demande (userIdentity), l'heure (eventTime) et l'adresse IP source. Les opérations du plan de contrôle, comme la suppression d'une base de connaissances, sont des événements de gestion que CloudTrail journalise par défaut."
  options:
    a:
      en: "CloudWatch metrics give numeric measurements such as invocation counts and latency; they do not identify who made an API call."
      fr: "Les métriques CloudWatch donnent des mesures numériques comme le nombre d'invocations et la latence ; elles n'identifient pas l'auteur d'un appel d'API."
    b:
      en: "Model invocation logging captures model inference calls such as InvokeModel and Converse; it does not record the deletion of a knowledge base, and it is disabled by default."
      fr: "La journalisation des invocations de modèles capture les appels d'inférence comme InvokeModel et Converse ; elle n'enregistre pas la suppression d'une base de connaissances et elle est désactivée par défaut."
    d:
      en: "Amazon Inspector scans for software vulnerabilities; it does not record API activity."
      fr: "Amazon Inspector recherche des vulnérabilités logicielles ; il n'enregistre pas l'activité des API."
references:
  - title: "Monitor Amazon Bedrock API calls using CloudTrail"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
