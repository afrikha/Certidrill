id: aifc01-2b-agent-order-tool-use
objective: "2.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company's application uses client-side tool use with an Amazon Bedrock model so that the model can look up order status in the company's order system.

    Which five steps happen in sequence when a user asks about an order? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    L'application d'une entreprise utilise l'utilisation d'outils côté client avec un modèle Amazon Bedrock pour que le modèle puisse consulter l'état des commandes dans le système de commandes de l'entreprise.

    Quelles sont les cinq étapes qui se déroulent dans l'ordre quand un utilisateur pose une question sur une commande ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: result, text: { en: "The application sends the tool result back to the model.", fr: "L'application renvoie le résultat de l'outil au modèle." } }
    - { id: request, text: { en: "The model returns a request that names the tool and its input values.", fr: "Le modèle renvoie une demande qui nomme l'outil et ses valeurs d'entrée." } }
    - { id: retrain, text: { en: "The model is retrained on the order system's data.", fr: "Le modèle est réentraîné sur les données du système de commandes." } }
    - { id: send, text: { en: "The application sends the user's message and the tool definitions to the model.", fr: "L'application envoie au modèle le message de l'utilisateur et les définitions des outils." } }
    - { id: final, text: { en: "The model uses the result to generate the final response.", fr: "Le modèle utilise le résultat pour générer la réponse finale." } }
    - { id: modelrun, text: { en: "The model connects to the order database and runs the query itself.", fr: "Le modèle se connecte à la base de données des commandes et exécute lui-même la requête." } }
    - { id: run, text: { en: "The application runs the tool to get the order status.", fr: "L'application exécute l'outil pour obtenir l'état de la commande." } }
answer:
  sequence: [ send, request, run, result, final ]
explanation:
  correct:
    en: "The application sends the message with the tool definitions. The model decides that a tool is needed and returns a tool request with its inputs, but it does not call the tool directly. In client-side tool use, the application runs the tool and returns the result to the model, which then uses it in its final response."
    fr: "L'application envoie le message avec les définitions des outils. Le modèle décide qu'un outil est nécessaire et renvoie une demande d'outil avec ses entrées, mais il n'appelle pas l'outil directement. Dans l'utilisation d'outils côté client, l'application exécute l'outil et renvoie le résultat au modèle, qui l'utilise ensuite dans sa réponse finale."
  options:
    modelrun:
      en: "The model never calls the tool directly; in client-side tool use, the application runs it."
      fr: "Le modèle n'appelle jamais l'outil directement ; dans l'utilisation d'outils côté client, c'est l'application qui l'exécute."
    retrain:
      en: "Tool use gives the model live data at inference time; no retraining is involved."
      fr: "L'utilisation d'outils fournit au modèle des données en direct au moment de l'inférence ; aucun réentraînement n'intervient."
references:
  - title: "Use a tool to complete an Amazon Bedrock model response"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html
