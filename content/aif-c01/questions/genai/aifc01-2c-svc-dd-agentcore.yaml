id: aifc01-2c-svc-dd-agentcore
objective: "2.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is building an AI agent on Amazon Bedrock AgentCore. Match each requirement to the AgentCore service that meets it. To answer, drag the appropriate service to each requirement. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise crée un agent d'IA sur Amazon Bedrock AgentCore. Associez chaque exigence au service AgentCore qui y répond. Pour répondre, faites glisser le service approprié vers chaque exigence. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: browser, text: "AgentCore Browser" }
    - { id: code, text: "AgentCore Code Interpreter" }
    - { id: identity, text: "AgentCore Identity" }
    - { id: obs, text: "AgentCore Observability" }
    - { id: memory, text: "AgentCore Memory" }
  targets:
    - { id: t1, text: { en: "Run Python code that the agent generates in an isolated sandbox.", fr: "Exécuter dans un bac à sable isolé le code Python que l'agent génère." } }
    - { id: t2, text: { en: "Navigate websites and fill in web forms on behalf of the user.", fr: "Naviguer sur des sites web et remplir des formulaires web pour le compte de l'utilisateur." } }
    - { id: t3, text: { en: "Authenticate users through the company's existing identity provider, such as Okta.", fr: "Authentifier les utilisateurs au moyen du fournisseur d'identité existant de l'entreprise, par exemple Okta." } }
    - { id: t4, text: { en: "Trace each step of the agent's execution in production.", fr: "Tracer chaque étape de l'exécution de l'agent en production." } }
answer:
  mapping: { t1: code, t2: browser, t3: identity, t4: obs }
explanation:
  correct:
    en: "Code Interpreter runs agent code (Python, JavaScript, TypeScript) in an isolated sandbox. Browser is a managed cloud browser that navigates websites and fills forms. Identity manages agent identity and authentication with providers such as Amazon Cognito, Okta and Microsoft Entra ID. Observability traces and visualizes agent execution with OpenTelemetry-compatible telemetry."
    fr: "Code Interpreter exécute le code de l'agent (Python, JavaScript, TypeScript) dans un bac à sable isolé. Browser est un navigateur cloud géré qui parcourt des sites web et remplit des formulaires. Identity gère l'identité et l'authentification des agents avec des fournisseurs tels qu'Amazon Cognito, Okta et Microsoft Entra ID. Observability trace et visualise l'exécution des agents avec une télémétrie compatible OpenTelemetry."
  options:
    memory:
      en: "Memory stores short-term conversation context and long-term memory across sessions; none of the requirements asks for it."
      fr: "Memory stocke le contexte de conversation à court terme et une mémoire à long terme entre les sessions ; aucune exigence ne le demande."
references:
  - title: "Overview - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
