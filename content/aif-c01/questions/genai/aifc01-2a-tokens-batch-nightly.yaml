id: aifc01-2a-tokens-batch-nightly
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every night, a retail company must summarize one million product reviews with a text model on Amazon Bedrock. The summaries are needed the next morning.

    Which inference option is the MOST cost-effective?
  fr: |
    Chaque nuit, une entreprise de distribution doit synthétiser un million d'avis produits avec un modèle de texte sur Amazon Bedrock. Les synthèses sont nécessaires le lendemain matin.

    Quelle option d'inférence est la PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "On-demand inference with the Priority service tier", fr: "Inférence à la demande avec le niveau de service Priority" } }
    - { id: b, text: { en: "Provisioned Throughput with no commitment", fr: "Provisioned Throughput sans engagement" } }
    - { id: c, text: { en: "Batch inference", fr: "Inférence par lots" } }
    - { id: d, text: { en: "Real-time on-demand requests sent one review at a time", fr: "Requêtes à la demande en temps réel, un avis à la fois" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Batch inference processes many prompts asynchronously: the company uploads the input files to Amazon S3, submits one job and retrieves the outputs from S3. For supported models, batch pricing is lower than on-demand pricing, which suits large workloads that do not need immediate responses."
    fr: "L'inférence par lots traite de nombreuses invites de façon asynchrone : l'entreprise charge les fichiers d'entrée dans Amazon S3, soumet une tâche et récupère les sorties dans S3. Pour les modèles pris en charge, le tarif par lots est inférieur au tarif à la demande, ce qui convient aux gros volumes qui ne nécessitent pas de réponse immédiate."
  options:
    a:
      en: "The Priority tier charges a premium for faster responses, which a next-morning deadline does not need."
      fr: "Le niveau Priority facture un supplément pour des réponses plus rapides, inutiles avec une échéance au lendemain matin."
    b:
      en: "Provisioned Throughput is billed every hour that it exists, and it is meant for sustained real-time throughput, not a nightly batch."
      fr: "Le Provisioned Throughput est facturé pour chaque heure d'existence et vise un débit soutenu en temps réel, pas un traitement nocturne par lots."
    d:
      en: "Real-time on-demand requests are billed at the standard on-demand rate, which is higher than the batch rate."
      fr: "Les requêtes à la demande en temps réel sont facturées au tarif à la demande standard, plus élevé que le tarif par lots."
references:
  - title: "Process multiple prompts with batch inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
