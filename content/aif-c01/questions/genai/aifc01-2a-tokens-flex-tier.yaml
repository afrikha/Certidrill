id: aifc01-2a-tokens-flex-tier
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs model evaluations and agentic workflows that call an Amazon Bedrock model through the Converse API. These workloads can tolerate longer processing times. The company wants to lower the cost per token without changing the workflows to submit input files in Amazon S3.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des évaluations de modèles et des flux de travail agentiques qui appellent un modèle Amazon Bedrock via l'API Converse. Ces charges de travail tolèrent des temps de traitement plus longs. L'entreprise veut réduire le coût par jeton sans modifier les flux de travail pour soumettre des fichiers d'entrée dans Amazon S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the requests to the Flex service tier.", fr: "Envoyer les requêtes au niveau de service Flex." } }
    - { id: b, text: { en: "Send the requests to the Priority service tier.", fr: "Envoyer les requêtes au niveau de service Priority." } }
    - { id: c, text: { en: "Convert the requests into batch inference jobs.", fr: "Convertir les requêtes en tâches d'inférence par lots." } }
    - { id: d, text: { en: "Purchase Provisioned Throughput with no commitment.", fr: "Acheter du Provisioned Throughput sans engagement." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock service tiers trade cost against performance on the same inference API. The Flex tier is selected per request and gives a price discount compared with the Standard tier for workloads that accept longer processing times, such as model evaluations, summarization and agentic workflows."
    fr: "Les niveaux de service d'Amazon Bedrock arbitrent entre coût et performance sur la même API d'inférence. Le niveau Flex se choisit par requête et offre une remise par rapport au niveau Standard pour les charges qui acceptent des temps de traitement plus longs, comme les évaluations de modèles, la synthèse et les flux de travail agentiques."
  options:
    b:
      en: "The Priority tier gives the fastest responses at a price premium, so it raises the cost."
      fr: "Le niveau Priority donne les réponses les plus rapides moyennant un supplément de prix : il augmente le coût."
    c:
      en: "Batch inference also lowers the price, but it requires input files in Amazon S3 and an asynchronous job, which the company does not want."
      fr: "L'inférence par lots réduit aussi le prix, mais elle exige des fichiers d'entrée dans Amazon S3 et une tâche asynchrone, ce que l'entreprise ne veut pas."
    d:
      en: "Provisioned Throughput is billed per hour of capacity, even when the workloads are idle; it does not lower the per-token price of occasional jobs."
      fr: "Le Provisioned Throughput est facturé par heure de capacité, même quand les charges sont inactives ; il ne réduit pas le prix par jeton de tâches occasionnelles."
references:
  - title: "Service tiers for optimizing performance and cost"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
