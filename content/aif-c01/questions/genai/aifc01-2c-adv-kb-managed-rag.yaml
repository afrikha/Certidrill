id: aifc01-2c-adv-kb-managed-rag
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An HR department wants an assistant that answers employee questions from internal policy documents stored in Amazon S3. Answers must include citations to the source documents. The team wants the solution with the LEAST operational overhead and does not want to run its own ingestion, indexing and retrieval infrastructure.

    Which solution will meet these requirements?
  fr: |
    Un service RH veut un assistant qui répond aux questions des employés à partir des documents de politique interne stockés dans Amazon S3. Les réponses doivent inclure des citations des documents sources. L'équipe veut la solution qui présente le MOINS de charge opérationnelle et ne veut pas exploiter sa propre infrastructure d'ingestion, d'indexation et de récupération.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Fine-tune a foundation model in Amazon Bedrock on the policy documents and query the custom model.", fr: "Affiner un modèle de fondation dans Amazon Bedrock sur les documents de politique et interroger le modèle personnalisé." } }
    - { id: b, text: { en: "Build a custom pipeline that embeds the documents into Amazon OpenSearch Service and calls a model on a SageMaker AI endpoint.", fr: "Créer un pipeline personnalisé qui vectorise les documents dans Amazon OpenSearch Service et appelle un modèle sur un point de terminaison SageMaker AI." } }
    - { id: c, text: { en: "Paste the full text of every policy document into the system prompt of each request.", fr: "Coller le texte complet de chaque document de politique dans l'invite système de chaque requête." } }
    - { id: d, text: { en: "Create a managed knowledge base in Amazon Bedrock Knowledge Bases with the S3 bucket as its data source.", fr: "Créer une base de connaissances gérée dans Amazon Bedrock Knowledge Bases avec le compartiment S3 comme source de données." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A managed knowledge base implements retrieval augmented generation (RAG): Amazon Bedrock manages data ingestion, indexing, storage and retrieval, and generated responses can include citations to the source documents. This gives grounded answers without building or operating a RAG pipeline."
    fr: "Une base de connaissances gérée implémente la génération à enrichissement contextuel (RAG) : Amazon Bedrock gère l'ingestion, l'indexation, le stockage et la récupération des données, et les réponses générées peuvent inclure des citations des documents sources. On obtient des réponses ancrées sans créer ni exploiter de pipeline RAG."
  options:
    a:
      en: "Fine-tuning adds training work and cost, must be repeated when policies change, and does not return citations to source documents."
      fr: "Le réglage précis ajoute un travail et un coût d'entraînement, doit être refait quand les politiques changent et ne renvoie pas de citations des documents sources."
    b:
      en: "A custom RAG pipeline works, but the team would build and operate the ingestion, indexing and retrieval itself, which fails the LEAST operational overhead requirement."
      fr: "Un pipeline RAG personnalisé fonctionne, mais l'équipe devrait créer et exploiter elle-même l'ingestion, l'indexation et la récupération, ce qui ne respecte pas l'exigence de MOINS de charge opérationnelle."
    c:
      en: "Sending every document in every prompt is limited by the context window, raises token costs and does not provide citations."
      fr: "Envoyer tous les documents dans chaque invite est limité par la fenêtre contextuelle, augmente le coût en jetons et ne fournit pas de citations."
references:
  - title: "Retrieve data and generate AI responses with Amazon Bedrock Knowledge Bases"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
