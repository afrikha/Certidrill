id: aifc01-2b-dis-hallucination
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retailer's generative AI chatbot confidently tells a customer that purchases can be returned within 60 days. The retailer's actual return policy allows 30 days, and no document of the retailer mentions 60 days.

    Which limitation of generative AI does this response show?
  fr: |
    Le chatbot d'IA générative d'un détaillant affirme avec assurance à un client que les achats peuvent être retournés sous 60 jours. La politique de retour réelle du détaillant prévoit 30 jours, et aucun document du détaillant ne mentionne 60 jours.

    Quelle limite de l'IA générative cette réponse montre-t-elle ?
body:
  options:
    - { id: a, text: { en: "Nondeterminism", fr: "Non-déterminisme" } }
    - { id: b, text: { en: "Hallucination", fr: "Hallucination" } }
    - { id: c, text: { en: "Lack of interpretability", fr: "Manque d'interprétabilité" } }
    - { id: d, text: { en: "Underfitting", fr: "Sous-ajustement (underfitting)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "A hallucination is an output that is factually incorrect, inconsistent, or unrelated to the input, often presented fluently and confidently. Inventing a 60-day return policy that no source supports is a hallucination."
    fr: "Une hallucination est une sortie factuellement incorrecte, incohérente ou sans rapport avec l'entrée, souvent présentée de façon fluide et assurée. Inventer une politique de retour de 60 jours qu'aucune source n'étaye est une hallucination."
  options:
    a:
      en: "Nondeterminism means that answers vary between runs; the problem here is that the answer is false."
      fr: "Le non-déterminisme signifie que les réponses varient d'une exécution à l'autre ; le problème ici est que la réponse est fausse."
    c:
      en: "Lack of interpretability means that it is hard to explain how the model produced an output; it does not describe an invented fact."
      fr: "Le manque d'interprétabilité signifie qu'il est difficile d'expliquer comment le modèle a produit une sortie ; il ne décrit pas un fait inventé."
    d:
      en: "Underfitting is a training problem in which a model fails to learn the patterns of its training data; it is not the term for an invented answer."
      fr: "Le sous-ajustement est un problème d'entraînement dans lequel un modèle n'apprend pas les schémas de ses données ; ce n'est pas le terme désignant une réponse inventée."
references:
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
