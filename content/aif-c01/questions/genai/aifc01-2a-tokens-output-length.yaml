id: aifc01-2a-tokens-output-length
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's application uses an Amazon Bedrock text model with on-demand inference. The model often writes several paragraphs when a short answer would satisfy users, and the monthly bill is higher than planned.

    Which change will reduce the inference cost with the LEAST impact on answer quality?
  fr: |
    L'application d'une entreprise utilise un modèle de texte Amazon Bedrock avec l'inférence à la demande. Le modèle rédige souvent plusieurs paragraphes alors qu'une réponse courte satisferait les utilisateurs, et la facture mensuelle dépasse les prévisions.

    Quelle modification réduira le coût d'inférence avec le MOINS d'impact sur la qualité des réponses ?
body:
  options:
    - { id: a, text: { en: "Increase the temperature so that the responses are more varied.", fr: "Augmenter la température pour que les réponses soient plus variées." } }
    - { id: b, text: { en: "Switch to a larger model in the same model family.", fr: "Passer à un modèle plus grand de la même famille de modèles." } }
    - { id: c, text: { en: "Add more few-shot examples of long answers to each prompt.", fr: "Ajouter à chaque invite davantage d'exemples few-shot de réponses longues." } }
    - { id: d, text: { en: "Set a maximum response length and instruct the model to answer concisely.", fr: "Définir une longueur de réponse maximale et demander au modèle de répondre de façon concise." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Output tokens are billed, so shorter responses cost less. A response length parameter (maximum tokens) sets an upper limit on the output, and an instruction to be succinct shortens responses while the model keeps a high level of performance."
    fr: "Les jetons de sortie sont facturés : des réponses plus courtes coûtent moins cher. Un paramètre de longueur de réponse (nombre maximal de jetons) fixe une limite haute à la sortie, et une instruction de concision raccourcit les réponses tout en préservant un bon niveau de performance du modèle."
  options:
    a:
      en: "Temperature changes the randomness of token choices, not the length of the response."
      fr: "La température modifie le caractère aléatoire du choix des jetons, pas la longueur de la réponse."
    b:
      en: "Larger models usually cost more per token, which raises the bill."
      fr: "Les modèles plus grands coûtent généralement plus cher par jeton, ce qui augmente la facture."
    c:
      en: "More examples add input tokens, and examples of long answers encourage longer outputs."
      fr: "Davantage d'exemples ajoutent des jetons d'entrée, et des exemples de réponses longues encouragent des sorties plus longues."
references:
  - title: "GENCOST03-BP02 Control model response length"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost03-bp02.html
