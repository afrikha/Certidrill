id: aifc01-2c-sec-grounding-check
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank uses retrieval augmented generation (RAG) with Amazon Bedrock to answer customer questions from its product brochures. The bank has found that some responses contain claims that do not appear in the retrieved brochure passages. The bank wants Amazon Bedrock Guardrails to detect and block such responses.

    Which guardrail policy should the bank configure?
  fr: |
    Une banque utilise la génération à enrichissement contextuel (RAG) avec Amazon Bedrock pour répondre aux questions des clients à partir de ses brochures de produits. La banque a constaté que certaines réponses contiennent des affirmations qui n'apparaissent pas dans les passages de brochures récupérés. La banque veut qu'Amazon Bedrock Guardrails détecte et bloque ces réponses.

    Quelle politique de barrière de protection la banque doit-elle configurer ?
body:
  options:
    - { id: a, text: { en: "Denied topics", fr: "Sujets refusés" } }
    - { id: b, text: { en: "Content filters", fr: "Filtres de contenu" } }
    - { id: c, text: { en: "Sensitive information filters", fr: "Filtres d'informations sensibles" } }
    - { id: d, text: { en: "Contextual grounding checks", fr: "Contrôles contextuels de l'ancrage (contextual grounding checks)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Contextual grounding checks detect hallucinations in model responses: responses that are not grounded in the source information or that are irrelevant to the user's query. They are designed for RAG applications, where the retrieved passages are the reference source."
    fr: "Les contrôles contextuels de l'ancrage détectent les hallucinations dans les réponses des modèles : les réponses qui ne sont pas ancrées dans les informations sources ou qui ne sont pas pertinentes pour la requête de l'utilisateur. Elles sont conçues pour les applications RAG, dans lesquelles les passages récupérés constituent la source de référence."
  options:
    a:
      en: "Denied topics block subjects that the bank defines as undesirable; they do not compare a response with the retrieved passages."
      fr: "Les sujets refusés bloquent des thèmes que la banque définit comme indésirables ; ils ne comparent pas une réponse avec les passages récupérés."
    b:
      en: "Content filters detect harmful categories such as hate or violence and prompt attacks, not unsupported claims."
      fr: "Les filtres de contenu détectent des catégories préjudiciables comme la haine ou la violence et les attaques d'invite, pas les affirmations non étayées."
    c:
      en: "Sensitive information filters block or mask PII; they do not check whether a response is supported by the source."
      fr: "Les filtres d'informations sensibles bloquent ou masquent les PII ; ils ne vérifient pas si une réponse est étayée par la source."
references:
  - title: "Detect and filter harmful content by using Amazon Bedrock Guardrails"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
