id: aifc01-2a-tokens-model-size
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses the largest model of a model family on Amazon Bedrock to classify support tickets. Most tickets are simple, and a few are complex. The company wants to reduce the token cost while keeping acceptable accuracy for all tickets.

    Which actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise le plus grand modèle d'une famille de modèles sur Amazon Bedrock pour classer des tickets de support. La plupart des tickets sont simples et quelques-uns sont complexes. L'entreprise veut réduire le coût en jetons tout en gardant une exactitude acceptable pour tous les tickets.

    Quelles actions répondent à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Test smaller models of the family and keep the smallest one that meets the accuracy target.", fr: "Tester des modèles plus petits de la famille et garder le plus petit qui atteint l'objectif d'exactitude." } }
    - { id: b, text: { en: "Increase the temperature of the current model.", fr: "Augmenter la température du modèle actuel." } }
    - { id: c, text: { en: "Use intelligent prompt routing between a smaller and a larger model of the family.", fr: "Utiliser le routage intelligent des invites entre un modèle plus petit et un modèle plus grand de la famille." } }
    - { id: d, text: { en: "Add the full ticket history of each customer to every prompt.", fr: "Ajouter l'historique complet des tickets de chaque client à chaque invite." } }
    - { id: e, text: { en: "Raise the maximum response length of the current model.", fr: "Augmenter la longueur maximale de réponse du modèle actuel." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Smaller models usually have a lower token cost, so the company should start with the smallest model that meets its minimum performance requirements. Intelligent prompt routing provides one endpoint that predicts the response quality of each model for each request and routes it, which sends simple tickets to the smaller model and keeps quality for complex ones."
    fr: "Les modèles plus petits ont généralement un coût par jeton plus faible : l'entreprise doit partir du plus petit modèle qui atteint ses exigences minimales de performance. Le routage intelligent des invites fournit un point de terminaison unique qui prédit la qualité de réponse de chaque modèle pour chaque requête et l'achemine en conséquence : les tickets simples vont au petit modèle et la qualité est préservée pour les tickets complexes."
  options:
    b:
      en: "Temperature changes the randomness of the output, not the price per token."
      fr: "La température modifie le caractère aléatoire de la sortie, pas le prix par jeton."
    d:
      en: "Adding the full history increases the input tokens of every request and therefore the cost."
      fr: "Ajouter l'historique complet augmente les jetons d'entrée de chaque requête, donc le coût."
    e:
      en: "A higher response length limit allows more output tokens, which can only increase the cost."
      fr: "Une limite de longueur de réponse plus élevée autorise davantage de jetons de sortie, ce qui ne peut qu'augmenter le coût."
references:
  - title: "GENCOST01-BP01 Right-size model selection to optimize inference costs"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html
  - title: "Understanding intelligent prompt routing in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
