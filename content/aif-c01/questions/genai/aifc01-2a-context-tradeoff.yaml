id: aifc01-2a-context-tradeoff
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AI team is deciding how much retrieved information and history to place in each prompt of its FM application.

    Which statement describes the trade-off that the team must manage?
  fr: |
    Une équipe d'IA décide de la quantité d'informations récupérées et d'historique à placer dans chaque invite de son application de FM.

    Quelle affirmation décrit le compromis que l'équipe doit gérer ?
body:
  options:
    - { id: a, text: { en: "Too much context raises cost and latency, and too little context leads to poor reasoning and hallucinations.", fr: "Trop de contexte augmente le coût et la latence, et trop peu de contexte entraîne un raisonnement faible et des hallucinations." } }
    - { id: b, text: { en: "More context always improves the answers, and it has no effect on cost because input tokens are free.", fr: "Plus de contexte améliore toujours les réponses, sans effet sur le coût puisque les jetons d'entrée sont gratuits." } }
    - { id: c, text: { en: "Less context always improves the answers, because the model already knows the company's data.", fr: "Moins de contexte améliore toujours les réponses, car le modèle connaît déjà les données de l'entreprise." } }
    - { id: d, text: { en: "The amount of context changes only the output length, not the quality of the answers.", fr: "La quantité de contexte ne modifie que la longueur de la sortie, pas la qualité des réponses." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Context size trades off against latency, cost and quality. Overstuffing the context window increases inference latency and cost, while insufficient context leads to poor reasoning and hallucination, so the goal is the highest information density within the token limits."
    fr: "La taille du contexte est un compromis entre latence, coût et qualité. Surcharger la fenêtre contextuelle augmente la latence et le coût de l'inférence, tandis qu'un contexte insuffisant entraîne un raisonnement faible et des hallucinations : l'objectif est la plus forte densité d'information dans les limites de jetons."
  options:
    b:
      en: "Input tokens are billed, and irrelevant context can dilute the answers."
      fr: "Les jetons d'entrée sont facturés, et un contexte non pertinent peut diluer les réponses."
    c:
      en: "A foundation model does not know a company's private data unless that data is provided in the context or through customization."
      fr: "Un modèle de fondation ne connaît pas les données privées d'une entreprise, sauf si elles sont fournies dans le contexte ou par personnalisation."
    d:
      en: "The context directly affects the quality of the answers, because the model reasons from what it receives."
      fr: "Le contexte agit directement sur la qualité des réponses, car le modèle raisonne à partir de ce qu'il reçoit."
references:
  - title: "Memory, context, and RAG optimization"
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentperf03.html
