id: aifc01-2c-cost-pt-no-commit
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A sports broadcaster will run a generative AI feature during a three-week tournament. During the tournament, the feature needs a guaranteed level of throughput for one Amazon Bedrock model. The broadcaster must be able to delete the capacity, and stop paying for it, as soon as the tournament ends.

    Which option will meet these requirements?
  fr: |
    Un diffuseur sportif va proposer une fonctionnalité d'IA générative pendant un tournoi de trois semaines. Pendant le tournoi, la fonctionnalité a besoin d'un niveau de débit garanti pour un modèle Amazon Bedrock. Le diffuseur doit pouvoir supprimer la capacité, et cesser de la payer, dès la fin du tournoi.

    Quelle option répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Provisioned Throughput with a 6-month commitment", fr: "Provisioned Throughput avec un engagement de 6 mois" } }
    - { id: b, text: { en: "Provisioned Throughput with a 1-month commitment", fr: "Provisioned Throughput avec un engagement de 1 mois" } }
    - { id: c, text: { en: "Provisioned Throughput with no commitment", fr: "Provisioned Throughput sans engagement" } }
    - { id: d, text: { en: "Batch inference jobs submitted every hour", fr: "Des tâches d'inférence par lots soumises toutes les heures" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Provisioned Throughput is billed hourly per model unit until it is deleted. A no-commitment purchase can be deleted at any time, so the broadcaster stops paying when the tournament ends. Commitment terms lower the hourly price but cannot be deleted before the term ends."
    fr: "Provisioned Throughput est facturé à l'heure par unité de modèle jusqu'à sa suppression. Un achat sans engagement peut être supprimé à tout moment ; le diffuseur cesse donc de payer à la fin du tournoi. Les durées d'engagement réduisent le prix horaire, mais ne peuvent pas être supprimées avant la fin de la durée."
  options:
    a:
      en: "A 6-month commitment cannot be deleted until the term ends, so the broadcaster would keep paying for months after the tournament."
      fr: "Un engagement de 6 mois ne peut pas être supprimé avant la fin de la durée ; le diffuseur paierait donc pendant des mois après le tournoi."
    b:
      en: "A 1-month commitment cannot be deleted before the month ends, which is after the three-week tournament."
      fr: "Un engagement de 1 mois ne peut pas être supprimé avant la fin du mois, c'est-à-dire après le tournoi de trois semaines."
    d:
      en: "Batch inference is asynchronous and does not provide guaranteed throughput for an interactive feature; it is not supported for provisioned models either."
      fr: "L'inférence par lots est asynchrone et ne fournit pas de débit garanti pour une fonctionnalité interactive ; elle n'est pas non plus prise en charge pour les modèles provisionnés."
references:
  - title: "Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
