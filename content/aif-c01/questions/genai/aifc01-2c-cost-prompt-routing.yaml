id: aifc01-2c-cost-prompt-routing
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A telecom company's English-language support assistant uses Amazon Nova Pro in Amazon Bedrock for every request. Most questions are simple and could be answered well by a smaller, cheaper model in the same family. The company wants to lower costs without degrading response quality and without writing its own logic to choose a model for each request.

    Which solution will meet these requirements?
  fr: |
    L'assistant d'assistance en anglais d'un opérateur télécom utilise Amazon Nova Pro dans Amazon Bedrock pour chaque requête. La plupart des questions sont simples et pourraient être bien traitées par un modèle plus petit et moins cher de la même famille. L'entreprise veut réduire les coûts sans dégrader la qualité des réponses et sans écrire sa propre logique de choix du modèle pour chaque requête.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Purchase Provisioned Throughput for Amazon Nova Pro.", fr: "Acheter du Provisioned Throughput pour Amazon Nova Pro." } }
    - { id: b, text: { en: "Send every request to the smallest Amazon Nova model.", fr: "Envoyer chaque requête au plus petit modèle Amazon Nova." } }
    - { id: c, text: { en: "Use Amazon Bedrock Intelligent Prompt Routing with a router for the Amazon Nova family.", fr: "Utiliser Amazon Bedrock Intelligent Prompt Routing avec un routeur pour la famille Amazon Nova." } }
    - { id: d, text: { en: "Move the assistant's requests to batch inference jobs.", fr: "Déplacer les requêtes de l'assistant vers des tâches d'inférence par lots." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Intelligent Prompt Routing provides a single serverless endpoint that routes requests between models of the same family. It predicts the response quality of each model for each request and sends the request to the cheaper model unless the other model is predicted to be better by more than a set margin, which optimizes quality and cost without custom orchestration logic. It is optimized for English prompts."
    fr: "Intelligent Prompt Routing fournit un point de terminaison sans serveur unique qui achemine les requêtes entre des modèles d'une même famille. Il prédit la qualité de réponse de chaque modèle pour chaque requête et envoie la requête au modèle le moins cher, sauf si l'autre modèle est jugé meilleur au-delà d'un écart défini, ce qui optimise la qualité et le coût sans logique d'orchestration personnalisée. Il est optimisé pour les invites en anglais."
  options:
    a:
      en: "Provisioned Throughput buys dedicated capacity for Nova Pro; it does not send simple requests to a cheaper model."
      fr: "Provisioned Throughput achète une capacité dédiée pour Nova Pro ; il n'envoie pas les requêtes simples vers un modèle moins cher."
    b:
      en: "Sending complex questions to the smallest model would degrade response quality."
      fr: "Envoyer les questions complexes au plus petit modèle dégraderait la qualité des réponses."
    d:
      en: "Batch inference is asynchronous and does not suit an interactive support assistant."
      fr: "L'inférence par lots est asynchrone et ne convient pas à un assistant d'assistance interactif."
references:
  - title: "Understanding intelligent prompt routing in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
