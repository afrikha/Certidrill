id: aifc01-2a-concepts-prompt-examples
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants a text model on Amazon Bedrock to classify customer reviews as POSITIVE or NEGATIVE in a fixed output format. The company adds two example reviews with their expected labels to each prompt. The model's parameters are not changed.

    Which technique is the company using?
  fr: |
    Une entreprise veut qu'un modèle de texte sur Amazon Bedrock classe les avis clients en POSITIVE ou NEGATIVE dans un format de sortie fixe. L'entreprise ajoute à chaque invite deux exemples d'avis avec leur étiquette attendue. Les paramètres du modèle ne sont pas modifiés.

    Quelle technique l'entreprise utilise-t-elle ?
body:
  options:
    - { id: a, text: { en: "Fine-tuning", fr: "Fine-tuning" } }
    - { id: b, text: { en: "Continued pre-training", fr: "Préentraînement continu (continued pre-training)" } }
    - { id: c, text: { en: "Model distillation", fr: "Distillation de modèle" } }
    - { id: d, text: { en: "Prompt engineering", fr: "Ingénierie des invites (prompt engineering)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Prompt engineering optimizes the text input to an LLM to obtain the desired response. Adding example input-output pairs to the prompt is few-shot prompting, also called in-context learning: it calibrates the output without changing the model's parameters."
    fr: "L'ingénierie des invites optimise l'entrée textuelle d'un LLM pour obtenir la réponse souhaitée. Ajouter à l'invite des exemples de paires entrée-sortie est l'invite few-shot, aussi appelée apprentissage en contexte : elle calibre la sortie sans modifier les paramètres du modèle."
  options:
    a:
      en: "Fine-tuning trains the model on labeled examples and changes its parameters, which the scenario excludes."
      fr: "Le fine-tuning entraîne le modèle sur des exemples étiquetés et modifie ses paramètres, ce que le scénario exclut."
    b:
      en: "Continued pre-training trains the model on unlabeled domain data and changes its parameters."
      fr: "Le préentraînement continu entraîne le modèle sur des données de domaine non étiquetées et modifie ses paramètres."
    c:
      en: "Distillation trains a smaller student model from the responses of a larger teacher model."
      fr: "La distillation entraîne un modèle élève plus petit à partir des réponses d'un modèle enseignant plus grand."
references:
  - title: "Prompt engineering concepts"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
