id: aifc01-2b-agent-a2a-delegation
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company has a trip-planning agent. The agent must hand off hotel bookings to an autonomous booking agent that another team built with a different framework. The booking agent advertises what it can do, but it does not expose its internal tools or memory.

    Which approach should the company use to connect the two agents?
  fr: |
    Une agence de voyages dispose d'un agent de planification de voyages. Cet agent doit confier les réservations d'hôtel à un agent de réservation autonome qu'une autre équipe a créé avec un framework différent. L'agent de réservation annonce ce qu'il sait faire, mais il n'expose ni ses outils internes ni sa mémoire.

    Quelle approche l'entreprise doit-elle utiliser pour connecter les deux agents ?
body:
  options:
    - { id: a, text: { en: "Store the booking agent's results in the long-term memory of the trip-planning agent.", fr: "Stocker les résultats de l'agent de réservation dans la mémoire à long terme de l'agent de planification." } }
    - { id: b, text: { en: "Merge both agents into one agent that has a single, longer system prompt.", fr: "Fusionner les deux agents en un seul agent doté d'une invite système unique et plus longue." } }
    - { id: c, text: { en: "Fine-tune the trip-planning agent's model on past hotel bookings.", fr: "Effectuer le réglage précis du modèle de l'agent de planification sur d'anciennes réservations d'hôtel." } }
    - { id: d, text: { en: "Use an agent-to-agent (A2A) protocol so that one agent delegates tasks to the other.", fr: "Utiliser un protocole agent-à-agent (A2A) pour qu'un agent délègue des tâches à l'autre." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Agent-to-agent protocols such as A2A let independent agents, possibly built on different platforms, discover each other's capabilities and delegate tasks without sharing their internals. MCP connects an agent to tools and data; A2A connects agents to other agents. Amazon Bedrock AgentCore Runtime supports both protocols."
    fr: "Les protocoles agent-à-agent comme A2A permettent à des agents indépendants, éventuellement créés sur des plateformes différentes, de découvrir leurs capacités respectives et de se déléguer des tâches sans partager leur fonctionnement interne. MCP connecte un agent à des outils et à des données ; A2A connecte des agents entre eux. Amazon Bedrock AgentCore Runtime prend en charge les deux protocoles."
  options:
    a:
      en: "Memory keeps context for an agent; it is not a communication channel that lets one agent ask another to perform a task."
      fr: "La mémoire conserve le contexte d'un agent ; ce n'est pas un canal de communication qui permet à un agent de demander une tâche à un autre."
    b:
      en: "The booking agent belongs to another team and framework; merging them removes the independence that the scenario requires."
      fr: "L'agent de réservation appartient à une autre équipe et à un autre framework ; les fusionner supprime l'indépendance que le scénario exige."
    c:
      en: "Fine-tuning on past bookings does not give the agent the ability to make new bookings through the other agent."
      fr: "Le réglage précis sur d'anciennes réservations ne donne pas à l'agent la capacité de faire de nouvelles réservations par l'intermédiaire de l'autre agent."
references:
  - title: "Agent-to-agent protocols"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/agent-to-agent-protocols.html
  - title: "Overview - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
