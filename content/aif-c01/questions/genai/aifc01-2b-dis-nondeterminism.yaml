id: aifc01-2b-dis-nondeterminism
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Two support agents send exactly the same prompt to the same generative AI model a few minutes apart. Both answers are accurate, but they are worded differently and list the steps in a different order.

    Which characteristic of generative AI explains this behavior?
  fr: |
    Deux agents du support envoient exactement la même invite au même modèle d'IA générative à quelques minutes d'intervalle. Les deux réponses sont exactes, mais elles sont formulées différemment et présentent les étapes dans un ordre différent.

    Quelle caractéristique de l'IA générative explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "Hallucination", fr: "Hallucination" } }
    - { id: b, text: { en: "Lack of interpretability", fr: "Manque d'interprétabilité" } }
    - { id: c, text: { en: "Bias", fr: "Biais" } }
    - { id: d, text: { en: "Nondeterminism", fr: "Non-déterminisme" } }
answer: { optionId: d }
explanation:
  correct:
    en: "To generate each token, the model samples from a probability distribution of possible next tokens. Because of this sampling, generative AI is nondeterministic: the same prompt can produce different outputs from one run to the next."
    fr: "Pour générer chaque jeton, le modèle effectue un échantillonnage dans une distribution de probabilités des jetons suivants possibles. En raison de cet échantillonnage, l'IA générative est non déterministe : une même invite peut produire des sorties différentes d'une exécution à l'autre."
  options:
    a:
      en: "Both answers are accurate, so nothing was invented."
      fr: "Les deux réponses sont exactes : rien n'a été inventé."
    b:
      en: "Interpretability is about explaining how an output was produced; it does not explain why outputs vary."
      fr: "L'interprétabilité concerne l'explication de la manière dont une sortie a été produite ; elle n'explique pas pourquoi les sorties varient."
    c:
      en: "Bias is a systematic unfair skew in outputs, such as for a group of people; different wording of accurate answers is not bias."
      fr: "Le biais est une distorsion systématique et injuste des sorties, par exemple envers un groupe de personnes ; une formulation différente de réponses exactes n'est pas un biais."
references:
  - title: "Influence response generation with inference parameters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
