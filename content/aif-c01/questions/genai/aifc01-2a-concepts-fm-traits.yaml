id: aifc01-2a-concepts-fm-traits
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manager asks how a foundation model (FM) differs from the traditional ML models that the company built in the past for single tasks, such as sentiment analysis.

    Which statement describes an FM?
  fr: |
    Un responsable demande en quoi un modèle de fondation (FM) diffère des modèles de ML traditionnels que l'entreprise a créés par le passé pour des tâches uniques, comme l'analyse des sentiments.

    Quelle affirmation décrit un FM ?
body:
  options:
    - { id: a, text: { en: "It is pre-trained on a broad set of unlabeled data and can be adapted to many tasks.", fr: "Il est préentraîné sur un large ensemble de données non étiquetées et peut être adapté à de nombreuses tâches." } }
    - { id: b, text: { en: "It is trained on a small labeled dataset and can perform only the task it was trained for.", fr: "Il est entraîné sur un petit jeu de données étiqueté et ne peut effectuer que la tâche apprise." } }
    - { id: c, text: { en: "It follows rules written by developers and does not learn from data.", fr: "Il suit des règles écrites par des développeurs et n'apprend pas à partir des données." } }
    - { id: d, text: { en: "It must be fine-tuned with labeled data before it can respond to any prompt.", fr: "Il doit être peaufiné avec des données étiquetées avant de pouvoir répondre à une invite." } }
answer: { optionId: a }
explanation:
  correct:
    en: "FMs are large deep learning neural networks pre-trained on a broad spectrum of generalized, unlabeled data, using self-supervised learning. Their size and general-purpose nature let them perform many different tasks from prompts, such as answering questions, summarizing or writing, and they serve as a starting point for more specialized applications."
    fr: "Les FM sont de grands réseaux neuronaux de deep learning préentraînés sur un large éventail de données générales non étiquetées, par apprentissage autosupervisé. Leur taille et leur caractère généraliste leur permettent d'effectuer de nombreuses tâches à partir d'invites (répondre à des questions, synthétiser, rédiger) et de servir de point de départ à des applications plus spécialisées."
  options:
    b:
      en: "A small labeled dataset and a single task describe a traditional, task-specific ML model."
      fr: "Un petit jeu de données étiqueté et une tâche unique décrivent un modèle de ML traditionnel spécialisé."
    c:
      en: "Rule-based systems are not ML models; an FM learns patterns from its training data."
      fr: "Les systèmes à base de règles ne sont pas des modèles de ML ; un FM apprend des schémas à partir de ses données d'entraînement."
    d:
      en: "A base FM responds to prompts as it is; fine-tuning is optional and only improves performance for specific tasks."
      fr: "Un FM de base répond aux invites tel quel ; le réglage précis est facultatif et améliore seulement les performances sur des tâches précises."
references:
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
