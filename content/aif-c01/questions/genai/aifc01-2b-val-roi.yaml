id: aifc01-2b-val-roi
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company runs a generative AI claims assistant. The CFO asks whether the financial gains of the assistant, such as employee hours saved and faster claim processing, exceed its total costs, including development, token usage, and maintenance.

    Which metric answers the CFO's question?
  fr: |
    Une compagnie d'assurance exploite un assistant d'IA générative pour les sinistres. Le directeur financier demande si les gains financiers de l'assistant, comme les heures de travail économisées et le traitement plus rapide des sinistres, dépassent ses coûts totaux, y compris le développement, la consommation de jetons et la maintenance.

    Quelle métrique répond à la question du directeur financier ?
body:
  options:
    - { id: a, text: { en: "Accuracy", fr: "Exactitude" } }
    - { id: b, text: { en: "Latency", fr: "Latence" } }
    - { id: c, text: { en: "Return on investment (ROI)", fr: "Retour sur investissement (ROI)" } }
    - { id: d, text: { en: "Conversion rate", fr: "Taux de conversion" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Return on investment (ROI) compares the net financial benefit of a solution with its total cost. It combines the gains (hours saved, faster processing) and the costs (development, per-request token and compute costs, maintenance) into one figure that shows whether the investment pays off."
    fr: "Le retour sur investissement (ROI) compare le bénéfice financier net d'une solution à son coût total. Il combine les gains (heures économisées, traitement plus rapide) et les coûts (développement, coûts de jetons et de calcul par requête, maintenance) en un seul chiffre qui montre si l'investissement est rentable."
  options:
    a:
      en: "Accuracy shows how often outputs are correct, not whether gains exceed costs."
      fr: "L'exactitude indique la fréquence des sorties correctes, pas si les gains dépassent les coûts."
    b:
      en: "Latency is a performance metric; it does not compare gains with costs."
      fr: "La latence est une métrique de performance ; elle ne compare pas les gains aux coûts."
    d:
      en: "Conversion rate measures the share of users who complete an action; it says nothing about the cost of the solution."
      fr: "Le taux de conversion mesure la part des utilisateurs qui effectuent une action ; il ne dit rien du coût de la solution."
references:
  - title: "Architecting a successful generative AI proof of concept"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
  - title: "MLPERF01-BP01 Determine key performance indicators"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlperf01-bp01.html
