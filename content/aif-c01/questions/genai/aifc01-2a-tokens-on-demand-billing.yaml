id: aifc01-2a-tokens-on-demand-billing
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company starts to use a text model on Amazon Bedrock with on-demand inference. The finance team asks how the company will be charged.

    How are on-demand text model requests billed?
  fr: |
    Une entreprise commence à utiliser un modèle de texte sur Amazon Bedrock avec l'inférence à la demande. L'équipe financière demande comment l'entreprise sera facturée.

    Comment les requêtes à la demande vers un modèle de texte sont-elles facturées ?
body:
  options:
    - { id: a, text: { en: "By the number of input tokens and output tokens processed", fr: "Selon le nombre de jetons d'entrée et de jetons de sortie traités" } }
    - { id: b, text: { en: "By the number of hours that the model is deployed", fr: "Selon le nombre d'heures pendant lesquelles le modèle est déployé" } }
    - { id: c, text: { en: "By a fixed price for each API request, whatever its length", fr: "Selon un prix fixe par requête d'API, quelle que soit sa longueur" } }
    - { id: d, text: { en: "By the number of gigabytes of training data of the model", fr: "Selon le nombre de gigaoctets de données d'entraînement du modèle" } }
answer: { optionId: a }
explanation:
  correct:
    en: "With on-demand inference, text models on Amazon Bedrock are billed per input token and per output token, with no upfront commitment. Longer prompts and longer responses therefore cost more."
    fr: "Avec l'inférence à la demande, les modèles de texte d'Amazon Bedrock sont facturés par jeton d'entrée et par jeton de sortie, sans engagement initial. Des invites et des réponses plus longues coûtent donc plus cher."
  options:
    b:
      en: "Hourly billing applies to Provisioned Throughput or to self-hosted models, not to on-demand inference."
      fr: "La facturation horaire s'applique au Provisioned Throughput ou aux modèles autohébergés, pas à l'inférence à la demande."
    c:
      en: "The charge depends on the tokens of each request, not on a fixed price per request."
      fr: "Le coût dépend des jetons de chaque requête, pas d'un prix fixe par requête."
    d:
      en: "The size of the provider's training data does not determine the inference charge."
      fr: "La taille des données d'entraînement du fournisseur ne détermine pas le coût de l'inférence."
references:
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
