id: aifc01-2c-adv-agentcore-framework
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company has prototyped several AI agents with different open-source frameworks, including CrewAI and LangGraph, and with models from different providers. The company wants to move the agents to production quickly without rewriting them or building its own hosting, memory and authentication components.

    Which advantage of Amazon Bedrock AgentCore meets this business objective?
  fr: |
    Une entreprise de commerce en ligne a prototypé plusieurs agents d'IA avec différents frameworks open source, dont CrewAI et LangGraph, et avec des modèles de différents fournisseurs. L'entreprise veut mettre rapidement les agents en production sans les réécrire ni créer ses propres composants d'hébergement, de mémoire et d'authentification.

    Quel avantage d'Amazon Bedrock AgentCore répond à cet objectif métier ?
body:
  options:
    - { id: a, text: { en: "AgentCore works with any framework and any foundation model and provides managed runtime, memory and identity services.", fr: "AgentCore fonctionne avec n'importe quel framework et n'importe quel modèle de fondation et fournit des services gérés d'exécution, de mémoire et d'identité." } }
    - { id: b, text: { en: "AgentCore converts each agent into an Amazon Lex bot with predefined intents and slots.", fr: "AgentCore convertit chaque agent en bot Amazon Lex avec des intentions et des emplacements prédéfinis." } }
    - { id: c, text: { en: "AgentCore requires a fixed monthly commitment that includes unlimited agent sessions.", fr: "AgentCore exige un engagement mensuel fixe qui inclut un nombre illimité de sessions d'agents." } }
    - { id: d, text: { en: "AgentCore runs only agents that are written with the Amazon Bedrock Agents Classic console.", fr: "AgentCore n'exécute que des agents écrits avec la console Amazon Bedrock Agents Classic." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AgentCore is framework- and model-agnostic: it works with open-source frameworks such as CrewAI, LangGraph, LlamaIndex and Strands Agents and with any foundation model. Its managed services (Runtime, Memory, Gateway, Identity, Observability and others) replace the infrastructure that the company would otherwise build, which shortens the path to production."
    fr: "AgentCore est indépendant des frameworks et des modèles : il fonctionne avec des frameworks open source comme CrewAI, LangGraph, LlamaIndex et Strands Agents et avec n'importe quel modèle de fondation. Ses services gérés (Runtime, Memory, Gateway, Identity, Observability, etc.) remplacent l'infrastructure que l'entreprise devrait sinon créer, ce qui raccourcit le chemin vers la production."
  options:
    b:
      en: "AgentCore does not convert agents into Lex bots; it runs the agents with their existing framework code."
      fr: "AgentCore ne convertit pas les agents en bots Lex ; il exécute les agents avec le code de leur framework existant."
    c:
      en: "AgentCore pricing is consumption-based, with no upfront commitment or minimum fee."
      fr: "La tarification d'AgentCore est basée sur la consommation, sans engagement initial ni frais minimum."
    d:
      en: "AgentCore is the successor of Bedrock Agents Classic and is not limited to agents created in that console."
      fr: "AgentCore succède à Bedrock Agents Classic et n'est pas limité aux agents créés dans cette console."
references:
  - title: "Overview - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
