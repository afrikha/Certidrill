id: aifc01-2b-dis-interpretability
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank uses a large language model (LLM) to write a recommendation for each loan application. A regulator asks the bank to explain the reasoning behind each recommendation. The bank's team cannot trace how the LLM arrived at its output.

    Which limitation of generative AI does this situation show?
  fr: |
    Une banque utilise un grand modèle de langage (LLM) pour rédiger une recommandation pour chaque demande de prêt. Un régulateur demande à la banque d'expliquer le raisonnement derrière chaque recommandation. L'équipe de la banque ne parvient pas à retracer comment le LLM est arrivé à sa sortie.

    Quelle limite de l'IA générative cette situation montre-t-elle ?
body:
  options:
    - { id: a, text: { en: "Interpretability", fr: "Interprétabilité" } }
    - { id: b, text: { en: "Responsiveness", fr: "Réactivité" } }
    - { id: c, text: { en: "Hallucination", fr: "Hallucination" } }
    - { id: d, text: { en: "Latency", fr: "Latence" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Model interpretability is the ability to understand and explain the reasoning behind a model's outputs. Large generative models are often black boxes, which makes this difficult and is a concern for regulated decisions such as lending."
    fr: "L'interprétabilité d'un modèle est la capacité à comprendre et expliquer le raisonnement derrière ses sorties. Les grands modèles génératifs sont souvent des boîtes noires, ce qui rend cela difficile et pose problème pour les décisions réglementées comme l'octroi de prêts."
  options:
    b:
      en: "Responsiveness is an advantage of generative AI (fast answers), not a limitation."
      fr: "La réactivité est un avantage de l'IA générative (des réponses rapides), pas une limite."
    c:
      en: "The scenario does not say that the recommendations are false; the problem is explaining how they were produced."
      fr: "Le scénario n'indique pas que les recommandations sont fausses ; le problème est d'expliquer comment elles ont été produites."
    d:
      en: "Latency is the time taken to respond; it is unrelated to explaining the reasoning."
      fr: "La latence est le temps de réponse ; elle est sans rapport avec l'explication du raisonnement."
references:
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
