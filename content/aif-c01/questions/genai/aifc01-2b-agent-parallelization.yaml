id: aifc01-2b-agent-parallelization
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company must review 500 supplier contracts to flag risky clauses. Each contract can be analyzed independently of the others. The company wants to reduce the total processing time and then combine the findings into a single report.

    Which agentic workflow pattern meets these requirements?
  fr: |
    Une entreprise industrielle doit examiner 500 contrats fournisseurs pour signaler les clauses à risque. Chaque contrat peut être analysé indépendamment des autres. L'entreprise veut réduire la durée totale de traitement, puis combiner les résultats dans un rapport unique.

    Quel modèle de flux de travail agentique répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Parallelization, with an aggregation step that combines the results", fr: "La parallélisation, avec une étape d'agrégation qui combine les résultats" } }
    - { id: b, text: { en: "Prompt chaining, with each contract analyzed after the previous one", fr: "L'enchaînement d'invites, chaque contrat étant analysé après le précédent" } }
    - { id: c, text: { en: "Routing, with each contract sent to one of several specialized agents", fr: "Le routage, chaque contrat étant envoyé à l'un de plusieurs agents spécialisés" } }
    - { id: d, text: { en: "An evaluator loop, with each analysis revised until a critic approves it", fr: "Une boucle évaluateur, chaque analyse étant révisée jusqu'à l'approbation d'un critique" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The parallelization workflow splits a task into independent subtasks that run concurrently across several LLM calls or agents, then aggregates and synthesizes the outputs. It suits repeating the same reasoning over many items when subtasks do not depend on each other and latency must be reduced."
    fr: "Le flux de travail de parallélisation découpe une tâche en sous-tâches indépendantes exécutées simultanément par plusieurs appels LLM ou agents, puis agrège et synthétise les sorties. Il convient pour répéter le même raisonnement sur de nombreux éléments quand les sous-tâches ne dépendent pas les unes des autres et qu'il faut réduire la latence."
  options:
    b:
      en: "Prompt chaining runs dependent steps in sequence; processing 500 independent contracts one after another does not reduce the total time."
      fr: "L'enchaînement d'invites exécute des étapes dépendantes en séquence ; traiter 500 contrats indépendants l'un après l'autre ne réduit pas la durée totale."
    c:
      en: "Routing chooses a handler for each input by category; all the contracts need the same analysis, and routing alone does not run them concurrently or combine the results."
      fr: "Le routage choisit un gestionnaire pour chaque entrée selon sa catégorie ; tous les contrats demandent la même analyse, et le routage seul ne les traite pas simultanément et ne combine pas les résultats."
    d:
      en: "An evaluator loop improves the quality of an output through critique and revision; it does not reduce processing time."
      fr: "Une boucle évaluateur améliore la qualité d'une sortie par critique et révision ; elle ne réduit pas la durée de traitement."
references:
  - title: "Workflow for parallelization"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-for-parallelization.html
