id: aifc01-2b-val-accuracy
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurer uses generative AI to extract fields from claim forms. The business case assumes that no more than 2% of the extracted fields will need manual correction.

    Which metric should the insurer monitor to confirm this assumption?
  fr: |
    Un assureur utilise l'IA générative pour extraire des champs de formulaires de sinistre. L'analyse de rentabilité suppose qu'au plus 2 % des champs extraits nécessiteront une correction manuelle.

    Quelle métrique l'assureur doit-il surveiller pour confirmer cette hypothèse ?
body:
  options:
    - { id: a, text: { en: "Average revenue per user", fr: "Revenus moyens par utilisateur" } }
    - { id: b, text: { en: "Accuracy of the extracted fields", fr: "Exactitude des champs extraits" } }
    - { id: c, text: { en: "Conversion rate", fr: "Taux de conversion" } }
    - { id: d, text: { en: "Customer lifetime value", fr: "Valeur du cycle de vie du client" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Accuracy is the share of outputs that are correct. Each incorrect field means manual rework, so the business sets a minimum acceptable accuracy (here 98%) and monitors it to confirm that the expected savings hold."
    fr: "L'exactitude est la part des sorties correctes. Chaque champ incorrect implique une reprise manuelle : l'entreprise fixe donc une exactitude minimale acceptable (ici 98 %) et la surveille pour confirmer que les économies prévues se concrétisent."
  options:
    a:
      en: "Average revenue per user measures revenue per user, not the quality of extracted fields."
      fr: "Les revenus moyens par utilisateur mesurent le revenu par utilisateur, pas la qualité des champs extraits."
    c:
      en: "Conversion rate measures the share of users who complete an action, such as a purchase."
      fr: "Le taux de conversion mesure la part des utilisateurs qui effectuent une action, comme un achat."
    d:
      en: "Customer lifetime value measures long-term revenue per customer, not extraction errors."
      fr: "La valeur du cycle de vie du client mesure le revenu à long terme par client, pas les erreurs d'extraction."
references:
  - title: "MLPERF01-BP01 Determine key performance indicators"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlperf01-bp01.html
