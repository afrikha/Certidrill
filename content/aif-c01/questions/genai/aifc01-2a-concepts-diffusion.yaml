id: aifc01-2a-concepts-diffusion
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A design agency needs a model that creates new images from text prompts. The model starts from random noise and removes the noise step by step until an image that matches the prompt appears.

    Which type of model does this describe?
  fr: |
    Une agence de design a besoin d'un modèle qui crée de nouvelles images à partir d'invites textuelles. Le modèle part d'un bruit aléatoire et retire le bruit étape par étape jusqu'à obtenir une image qui correspond à l'invite.

    À quel type de modèle cette description correspond-elle ?
body:
  options:
    - { id: a, text: { en: "Diffusion model", fr: "Modèle de diffusion" } }
    - { id: b, text: { en: "Embedding model", fr: "Modèle de vectorisation" } }
    - { id: c, text: { en: "Text-only LLM", fr: "LLM texte uniquement" } }
    - { id: d, text: { en: "Linear regression model", fr: "Modèle de régression linéaire" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A diffusion model is trained by gradually adding noise to data and learning to reverse that process. To generate, it starts from random noise and denoises it step by step, guided by inputs such as a text prompt. Diffusion models generate images, audio and video."
    fr: "Un modèle de diffusion est entraîné en ajoutant progressivement du bruit aux données et en apprenant à inverser ce processus. Pour générer, il part d'un bruit aléatoire et le débruite étape par étape, guidé par des entrées comme une invite textuelle. Les modèles de diffusion génèrent des images, du son et de la vidéo."
  options:
    b:
      en: "An embedding model converts input into numeric vectors for similarity comparisons; it does not generate images."
      fr: "Un modèle de vectorisation (embedding) convertit une entrée en vecteurs numériques pour des comparaisons de similarité ; il ne génère pas d'images."
    c:
      en: "A text-only LLM predicts the next token of a text sequence; it produces text, not images."
      fr: "Un LLM texte uniquement prédit le jeton suivant d'une séquence de texte ; il produit du texte, pas des images."
    d:
      en: "Linear regression is a traditional ML model that predicts a numeric value; it is not generative."
      fr: "La régression linéaire est un modèle de ML traditionnel qui prédit une valeur numérique ; elle n'est pas générative."
references:
  - title: "What is a Diffusion Model?"
    url: https://aws.amazon.com/what-is/diffusion-model/
