id: aifc01-2b-adv-conversational
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    On a travel website, a user types "Find flights to Lisbon in May," then "Only direct flights," and then "What about the week after?" The generative AI assistant understands each follow-up in plain language and refines the results without any form or keyword syntax.

    Which advantage of generative AI does this scenario illustrate?
  fr: |
    Sur un site de voyages, un utilisateur tape « Trouve des vols pour Lisbonne en mai », puis « Seulement des vols directs », puis « Et la semaine suivante ? ». L'assistant d'IA générative comprend chaque demande de suivi en langage courant et affine les résultats sans formulaire ni syntaxe de mots-clés.

    Quel avantage de l'IA générative ce scénario illustre-t-il ?
body:
  options:
    - { id: a, text: { en: "Determinism", fr: "Déterminisme" } }
    - { id: b, text: { en: "Interpretability", fr: "Interprétabilité" } }
    - { id: c, text: { en: "Lower compute requirements", fr: "Des besoins de calcul plus faibles" } }
    - { id: d, text: { en: "Conversational capabilities", fr: "Capacités conversationnelles" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Generative AI models understand and produce natural language and can follow a multi-turn dialogue, so users can refine a request step by step as they would with a person. This conversational capability powers chatbots, voice bots, and virtual assistants."
    fr: "Les modèles d'IA générative comprennent et produisent le langage naturel et peuvent suivre un dialogue en plusieurs échanges : les utilisateurs affinent leur demande pas à pas comme avec une personne. Cette capacité conversationnelle alimente les chatbots, les assistants vocaux et les assistants virtuels."
  options:
    a:
      en: "Generative AI is nondeterministic; determinism is not the advantage shown by a natural dialogue."
      fr: "L'IA générative est non déterministe ; le déterminisme n'est pas l'avantage qu'illustre un dialogue naturel."
    b:
      en: "Interpretability is a limitation of generative AI models, which are hard to explain."
      fr: "L'interprétabilité est une limite des modèles d'IA générative, difficiles à expliquer."
    c:
      en: "Training and running generative AI models requires substantial compute resources; low compute is not one of their advantages."
      fr: "L'entraînement et l'exécution des modèles d'IA générative demandent d'importantes ressources de calcul ; un faible besoin de calcul ne fait pas partie de leurs avantages."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
