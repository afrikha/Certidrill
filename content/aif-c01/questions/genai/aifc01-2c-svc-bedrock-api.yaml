id: aifc01-2c-svc-bedrock-api
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company wants to add a feature that generates trip descriptions in its web application. The developers want to call foundation models (FMs) from several providers through an API. The company does not want to provision or manage any servers to host the models.

    Which AWS service will meet these requirements?
  fr: |
    Une agence de voyages veut ajouter à son application web une fonctionnalité qui génère des descriptions de séjours. Les développeurs veulent appeler des modèles de fondation (FM) de plusieurs fournisseurs au moyen d'une API. L'entreprise ne veut provisionner ni gérer aucun serveur pour héberger les modèles.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon SageMaker AI" }
    - { id: b, text: "Amazon Bedrock" }
    - { id: c, text: "Amazon Comprehend" }
    - { id: d, text: "Amazon EC2" }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Bedrock is a fully managed, serverless service that gives access to foundation models from many providers (Amazon, Anthropic, Meta, Mistral AI and others) through a single API. There is no infrastructure to provision: the application sends a prompt and receives the generated text."
    fr: "Amazon Bedrock est un service entièrement géré et sans serveur qui donne accès à des modèles de fondation de nombreux fournisseurs (Amazon, Anthropic, Meta, Mistral AI, etc.) au moyen d'une seule API. Il n'y a aucune infrastructure à provisionner : l'application envoie une invite et reçoit le texte généré."
  options:
    a:
      en: "SageMaker AI is used to build, train and host models; hosting a model on SageMaker AI means choosing and paying for instances, which the company wants to avoid."
      fr: "SageMaker AI sert à créer, entraîner et héberger des modèles ; héberger un modèle sur SageMaker AI implique de choisir des instances et de les payer, ce que l'entreprise veut éviter."
    c:
      en: "Amazon Comprehend extracts insights such as entities and sentiment from text; it does not give access to generative FMs from several providers."
      fr: "Amazon Comprehend extrait des informations telles que des entités et le sentiment d'un texte ; il ne donne pas accès à des FM génératifs de plusieurs fournisseurs."
    d:
      en: "Running models on Amazon EC2 instances requires the company to provision and manage the servers."
      fr: "Exécuter des modèles sur des instances Amazon EC2 oblige l'entreprise à provisionner et à gérer les serveurs."
references:
  - title: "Overview - Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
  - title: "Amazon Bedrock FAQs"
    url: https://aws.amazon.com/bedrock/faqs/
