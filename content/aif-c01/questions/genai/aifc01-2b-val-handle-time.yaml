id: aifc01-2b-val-handle-time
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A contact center deploys generative AI to summarize each call automatically, so that agents no longer write call notes by hand.

    Which business metric BEST shows the efficiency gain of this solution?
  fr: |
    Un centre de contact déploie l'IA générative pour résumer automatiquement chaque appel, afin que les agents n'aient plus à rédiger leurs notes d'appel à la main.

    Quelle métrique métier montre le MIEUX le gain d'efficacité de cette solution ?
body:
  options:
    - { id: a, text: { en: "ROUGE score of the summaries", fr: "Score ROUGE des résumés" } }
    - { id: b, text: { en: "Customer lifetime value", fr: "Valeur du cycle de vie du client" } }
    - { id: c, text: { en: "Conversion rate", fr: "Taux de conversion" } }
    - { id: d, text: { en: "Average handle time per call", fr: "Durée moyenne de traitement par appel" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Efficiency metrics measure time or effort saved. When agents stop writing notes by hand, the average handle time per call should drop; comparing it with the baseline before deployment shows the efficiency gain in business terms."
    fr: "Les métriques d'efficacité mesurent le temps ou l'effort économisés. Quand les agents cessent de rédiger leurs notes à la main, la durée moyenne de traitement par appel doit baisser ; la comparer à la référence d'avant le déploiement montre le gain d'efficacité en termes métier."
  options:
    a:
      en: "ROUGE measures summary quality against reference summaries; it is a model metric, not a measure of time saved."
      fr: "ROUGE mesure la qualité des résumés par rapport à des résumés de référence ; c'est une métrique de modèle, pas une mesure du temps gagné."
    b:
      en: "Customer lifetime value measures long-term revenue per customer, not agent efficiency."
      fr: "La valeur du cycle de vie du client mesure le revenu à long terme par client, pas l'efficacité des agents."
    c:
      en: "Conversion rate measures completed actions such as purchases, not the time spent on each call."
      fr: "Le taux de conversion mesure des actions réalisées comme des achats, pas le temps passé sur chaque appel."
references:
  - title: "Architecting a successful generative AI proof of concept"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
