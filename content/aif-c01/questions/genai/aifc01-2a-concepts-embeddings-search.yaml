id: aifc01-2a-concepts-embeddings-search
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer wants its search feature to return products whose descriptions have the same meaning as a customer's query, even when the query and the description share no keywords.

    Which approach will meet this requirement?
  fr: |
    Un détaillant en ligne veut que sa fonctionnalité de recherche renvoie les produits dont la description a le même sens que la requête du client, même si la requête et la description n'ont aucun mot-clé en commun.

    Quelle approche répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Convert the descriptions and the query into embeddings and compare the vectors.", fr: "Convertir les descriptions et la requête en embeddings et comparer les vecteurs." } }
    - { id: b, text: { en: "Split the descriptions into tokens and count the tokens shared with the query.", fr: "Découper les descriptions en jetons et compter les jetons communs avec la requête." } }
    - { id: c, text: { en: "Raise the temperature of a text model that rewrites each customer query.", fr: "Augmenter la température d'un modèle de texte qui réécrit chaque requête client." } }
    - { id: d, text: { en: "Add stop sequences to the prompt of a text model that reads the catalog.", fr: "Ajouter des séquences d'arrêt à l'invite d'un modèle de texte qui lit le catalogue." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An embedding model transforms text into a vector of numbers so that objects can be compared for similarity. Texts with similar meanings get vectors that are close to each other, even when they use different words. Comparing the query vector with the description vectors gives a semantic search."
    fr: "Un modèle d'embeddings transforme le texte en un vecteur de nombres afin de pouvoir comparer la similarité des objets. Des textes de sens proche obtiennent des vecteurs proches les uns des autres, même s'ils emploient des mots différents. Comparer le vecteur de la requête à ceux des descriptions donne une recherche sémantique."
  options:
    b:
      en: "Counting shared tokens is a keyword match, which fails when the query and the description use different words."
      fr: "Compter les jetons communs revient à comparer des mots-clés, ce qui échoue quand la requête et la description emploient des mots différents."
    c:
      en: "Temperature controls the randomness of generated text; it does not measure how similar two texts are."
      fr: "La température contrôle le caractère aléatoire du texte généré ; elle ne mesure pas la similarité entre deux textes."
    d:
      en: "Stop sequences only tell the model where to stop generating; they do not match meanings."
      fr: "Les séquences d'arrêt indiquent seulement au modèle où arrêter la génération ; elles ne comparent pas les sens."
references:
  - title: "Key terminology"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
  - title: "Using Amazon Nova embeddings"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/embeddings.html
