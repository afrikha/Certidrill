id: aifc01-2b-sel-region-availability
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    For regulatory reasons, a company must run all inference in the Asia Pacific (Sydney) Region, without routing requests to other Regions. Two foundation models on Amazon Bedrock meet the company's quality requirements.

    Which factor must the company verify before it selects one of the models?
  fr: |
    Pour des raisons réglementaires, une entreprise doit exécuter toute l'inférence dans la Région Asie-Pacifique (Sydney), sans acheminer de requêtes vers d'autres Régions. Deux modèles de fondation sur Amazon Bedrock répondent aux exigences de qualité de l'entreprise.

    Quel facteur l'entreprise doit-elle vérifier avant de choisir l'un des modèles ?
body:
  options:
    - { id: a, text: { en: "Whether the model can generate images", fr: "La capacité du modèle à générer des images" } }
    - { id: b, text: { en: "The model's ranking on a public benchmark", fr: "Le classement du modèle sur un benchmark public" } }
    - { id: c, text: { en: "Whether the model is available in the Sydney Region", fr: "La disponibilité du modèle dans la Région de Sydney" } }
    - { id: d, text: { en: "Whether the model accepts a temperature of 0", fr: "L'acceptation d'une température de 0 par le modèle" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Model availability differs by AWS Region, and Amazon Bedrock documents the supported Regions of each model. Because the company cannot use cross-Region routing, the selected model must be offered in the Sydney Region itself; this constraint comes before other comparisons."
    fr: "La disponibilité des modèles diffère selon la Région AWS, et Amazon Bedrock documente les Régions prises en charge pour chaque modèle. Comme l'entreprise ne peut pas utiliser le routage interrégional, le modèle choisi doit être proposé dans la Région de Sydney elle-même ; cette contrainte passe avant les autres comparaisons."
  options:
    a:
      en: "Image generation is not a requirement, and it does not address where inference runs."
      fr: "La génération d'images n'est pas une exigence et ne dit rien du lieu d'exécution de l'inférence."
    b:
      en: "Both models already meet the quality requirements; a public ranking does not show whether the model can run in Sydney."
      fr: "Les deux modèles répondent déjà aux exigences de qualité ; un classement public n'indique pas si le modèle peut s'exécuter à Sydney."
    d:
      en: "Temperature support affects response randomness, not the regulatory location constraint."
      fr: "La prise en charge de la température influe sur le caractère aléatoire des réponses, pas sur la contrainte réglementaire de localisation."
references:
  - title: "Supported foundation models in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
  - title: "Route model inference requests across AWS Regions with cross-Region inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
