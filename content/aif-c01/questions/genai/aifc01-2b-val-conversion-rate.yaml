id: aifc01-2b-val-conversion-rate
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online furniture retailer adds a generative AI shopping assistant to its website. The retailer wants to know whether visitors who use the assistant are more likely to complete a purchase.

    Which metric should the retailer measure?
  fr: |
    Un détaillant de meubles en ligne ajoute un assistant d'achat d'IA générative à son site web. Le détaillant veut savoir si les visiteurs qui utilisent l'assistant sont plus enclins à finaliser un achat.

    Quelle métrique le détaillant doit-il mesurer ?
body:
  options:
    - { id: a, text: { en: "Average revenue per user", fr: "Revenus moyens par utilisateur" } }
    - { id: b, text: { en: "Conversion rate", fr: "Taux de conversion" } }
    - { id: c, text: { en: "Customer lifetime value", fr: "Valeur du cycle de vie du client" } }
    - { id: d, text: { en: "ROUGE score", fr: "Score ROUGE" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Conversion rate is the share of visitors who complete a desired action, such as a purchase. Comparing the conversion rate of visitors who use the assistant with that of visitors who do not shows whether the assistant drives sales."
    fr: "Le taux de conversion est la part des visiteurs qui effectuent une action souhaitée, comme un achat. Comparer le taux de conversion des visiteurs qui utilisent l'assistant à celui des autres visiteurs montre si l'assistant génère des ventes."
  options:
    a:
      en: "Average revenue per user measures how much revenue each user brings on average, not whether a visit ends in a purchase."
      fr: "Les revenus moyens par utilisateur mesurent le revenu moyen apporté par chaque utilisateur, pas si une visite aboutit à un achat."
    c:
      en: "Customer lifetime value estimates the total revenue from a customer over the whole relationship, not the purchase rate of visits."
      fr: "La valeur du cycle de vie du client estime le revenu total d'un client sur toute la relation, pas le taux d'achat des visites."
    d:
      en: "ROUGE is a model metric for the quality of summaries, not a business metric of purchases."
      fr: "ROUGE est une métrique de modèle pour la qualité des résumés, pas une métrique métier liée aux achats."
references:
  - title: "MLPERF01-BP01 Determine key performance indicators"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlperf01-bp01.html
