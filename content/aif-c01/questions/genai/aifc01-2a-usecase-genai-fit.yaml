id: aifc01-2a-usecase-genai-fit
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has several AI projects.

    Which project is the BEST fit for a generative AI foundation model?
  fr: |
    Une entreprise de distribution mène plusieurs projets d'IA.

    Quel projet convient le MIEUX à un modèle de fondation d'IA générative ?
body:
  options:
    - { id: a, text: { en: "Forecast next quarter's sales from five years of sales figures", fr: "Prévoir les ventes du trimestre suivant à partir de cinq ans de chiffres de ventes" } }
    - { id: b, text: { en: "Flag fraudulent card payments from transaction features in real time", fr: "Signaler en temps réel les paiements par carte frauduleux à partir des caractéristiques des transactions" } }
    - { id: c, text: { en: "Draft personalized replies to customer emails in the brand's tone", fr: "Rédiger des réponses personnalisées aux e-mails des clients dans le ton de la marque" } }
    - { id: d, text: { en: "Group customers into segments by their purchase behavior", fr: "Regrouper les clients en segments selon leur comportement d'achat" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Generative AI creates new content such as text, images, audio or code. Drafting personalized email replies in a given tone is content generation, a typical use case for a text FM."
    fr: "L'IA générative crée du contenu nouveau, comme du texte, des images, du son ou du code. Rédiger des réponses personnalisées à des e-mails dans un ton donné est de la génération de contenu, un cas d'utilisation typique d'un FM de texte."
  options:
    a:
      en: "Forecasting a numeric value from historical data is a time-series regression task for a traditional ML model."
      fr: "Prévoir une valeur numérique à partir de données historiques est une tâche de régression sur séries chronologiques pour un modèle de ML traditionnel."
    b:
      en: "Fraud detection from transaction features is a classification task that traditional ML models handle with low latency and cost."
      fr: "La détection de fraude à partir des caractéristiques des transactions est une tâche de classification que les modèles de ML traditionnels traitent avec une latence et un coût faibles."
    d:
      en: "Customer segmentation is a clustering task (unsupervised learning), not content generation."
      fr: "La segmentation des clients est une tâche de clustering (apprentissage non supervisé), pas de la génération de contenu."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
