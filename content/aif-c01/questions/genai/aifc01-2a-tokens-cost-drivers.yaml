id: aifc01-2a-tokens-cost-drivers
objective: "2.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company calls a text model on Amazon Bedrock with on-demand inference.

    Which factors directly increase the cost of a single request? (Choose two.)
  fr: |
    Une entreprise appelle un modèle de texte sur Amazon Bedrock avec l'inférence à la demande.

    Quels facteurs augmentent directement le coût d'une requête ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A higher temperature value", fr: "Une valeur de température plus élevée" } }
    - { id: b, text: { en: "A longer prompt", fr: "Une invite plus longue" } }
    - { id: c, text: { en: "A higher top P value", fr: "Une valeur de top P plus élevée" } }
    - { id: d, text: { en: "A larger number of IAM roles in the account", fr: "Un plus grand nombre de rôles IAM dans le compte" } }
    - { id: e, text: { en: "A longer generated response", fr: "Une réponse générée plus longue" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "On-demand text inference is billed per input token and per output token. A longer prompt has more input tokens, and a longer response has more output tokens, so both increase the cost of the request."
    fr: "L'inférence de texte à la demande est facturée par jeton d'entrée et par jeton de sortie. Une invite plus longue contient plus de jetons d'entrée et une réponse plus longue plus de jetons de sortie : les deux augmentent le coût de la requête."
  options:
    a:
      en: "Temperature changes how random the token choices are; it is not a pricing dimension."
      fr: "La température modifie le caractère aléatoire du choix des jetons ; ce n'est pas une dimension de la tarification."
    c:
      en: "Top P limits the share of candidate tokens the model considers; it is not billed."
      fr: "Le top P limite la part des jetons candidats que le modèle considère ; il n'est pas facturé."
    d:
      en: "IAM roles are free and do not affect the cost of inference."
      fr: "Les rôles IAM sont gratuits et n'ont aucun effet sur le coût de l'inférence."
references:
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
  - title: "Influence response generation with inference parameters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
