id: aifc01-2b-val-order-measurement
objective: "2.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A software company introduces a generative AI coding assistant and wants to measure its impact on the development teams.

    Which five steps should the company perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Un éditeur de logiciels introduit un assistant de codage d'IA générative et veut mesurer son impact sur les équipes de développement.

    Quelles sont les cinq étapes que l'entreprise doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: mon, text: { en: "Monitor the metrics continuously with automated tools.", fr: "Surveiller les métriques en continu avec des outils automatisés." } }
    - { id: iter, text: { en: "Iterate on the implementation and adjust the targets.", fr: "Faire évoluer la mise en œuvre et ajuster les objectifs." } }
    - { id: base, text: { en: "Establish baseline metrics before introducing the assistant.", fr: "Établir des métriques de référence avant d'introduire l'assistant." } }
    - { id: nometric, text: { en: "Deploy the assistant to every team before choosing any metric.", fr: "Déployer l'assistant dans toutes les équipes avant de choisir la moindre métrique." } }
    - { id: rev, text: { en: "Review progress every quarter or twice a year.", fr: "Examiner les progrès chaque trimestre ou deux fois par an." } }
    - { id: drop, text: { en: "Stop tracking any metric that does not improve in the first week.", fr: "Cesser de suivre toute métrique qui ne s'améliore pas dès la première semaine." } }
    - { id: tgt, text: { en: "Set realistic, incremental improvement targets.", fr: "Fixer des objectifs d'amélioration réalistes et progressifs." } }
answer:
  sequence: [ base, tgt, mon, rev, iter ]
explanation:
  correct:
    en: "AWS guidance first establishes baselines before the AI tooling is introduced, so that improvement can be demonstrated. The company then sets realistic, incremental targets, monitors the metrics continuously, reviews progress quarterly or twice a year, and iterates on the implementation and the targets."
    fr: "Les recommandations AWS établissent d'abord des références avant l'introduction de l'outil d'IA, afin de pouvoir démontrer l'amélioration. L'entreprise fixe ensuite des objectifs réalistes et progressifs, surveille les métriques en continu, examine les progrès chaque trimestre ou deux fois par an, puis fait évoluer la mise en œuvre et les objectifs."
  options:
    nometric:
      en: "Without metrics chosen and measured before deployment, there is no baseline to compare with."
      fr: "Sans métriques choisies et mesurées avant le déploiement, il n'existe aucune référence de comparaison."
    drop:
      en: "Gains take time to appear; dropping metrics after one week removes the evidence needed for periodic reviews."
      fr: "Les gains mettent du temps à apparaître ; abandonner des métriques après une semaine supprime les éléments nécessaires aux revues périodiques."
references:
  - title: "Measuring the success of generative AI in software development"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-accelerate-software-dev-lifecycle-gen-ai/measuring-success.html
