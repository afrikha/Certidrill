id: aifc01-2a-concepts-match-terms
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A company's developers are learning the vocabulary of generative AI applications.

    Select the correct term from the following list for each description. Each term should be selected one time or not at all. (Select FOUR.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les développeurs d'une entreprise apprennent le vocabulaire des applications d'IA générative.

    Sélectionnez dans la liste suivante le terme correct pour chaque description. Chaque terme doit être sélectionné une fois ou pas du tout. (Sélectionnez-en QUATRE.)

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: token, text: { en: "Token", fr: "Jeton" } }
    - { id: chunk, text: { en: "Chunk", fr: "Fragment (chunk)" } }
    - { id: emb, text: { en: "Embedding", fr: "Embedding" } }
    - { id: prompt, text: { en: "Prompt", fr: "Invite" } }
    - { id: hyper, text: { en: "Hyperparameter", fr: "Hyperparamètre" } }
    - { id: stop, text: { en: "Stop sequence", fr: "Séquence d'arrêt" } }
  targets:
    - { id: t1, text: { en: "Unit of text, such as a word or part of a word, that a model processes and bills", fr: "Unité de texte, comme un mot ou une partie de mot, que le modèle traite et facture" } }
    - { id: t2, text: { en: "Piece of a source document that is created before the document is indexed", fr: "Morceau d'un document source créé avant l'indexation du document" } }
    - { id: t3, text: { en: "Numeric vector that represents the meaning of an input", fr: "Vecteur numérique qui représente le sens d'une entrée" } }
    - { id: t4, text: { en: "Input that guides the model toward the expected response", fr: "Entrée qui guide le modèle vers la réponse attendue" } }
answer:
  mapping: { t1: token, t2: chunk, t3: emb, t4: prompt }
explanation:
  correct:
    en: "A token is a sequence of characters that the model treats as one unit and that token-based pricing counts. Chunking splits source documents into chunks before they are converted into embeddings, which are numeric vectors used to compare meanings. A prompt is the input that guides the model toward an appropriate response."
    fr: "Un jeton est une séquence de caractères que le modèle traite comme une unité et que la tarification par jeton comptabilise. Le découpage divise les documents sources en fragments avant leur conversion en embeddings, des vecteurs numériques qui servent à comparer les sens. Une invite est l'entrée qui guide le modèle vers une réponse appropriée."
  options:
    hyper:
      en: "A hyperparameter controls a model customization (training) job, such as the number of epochs."
      fr: "Un hyperparamètre contrôle une tâche de personnalisation (entraînement) du modèle, comme le nombre d'époques."
    stop:
      en: "A stop sequence is an inference parameter that makes the model stop generating when it produces that sequence."
      fr: "Une séquence d'arrêt est un paramètre d'inférence qui arrête la génération quand le modèle produit cette séquence."
references:
  - title: "Key terminology"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
  - title: "How Amazon Bedrock knowledge bases work"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
