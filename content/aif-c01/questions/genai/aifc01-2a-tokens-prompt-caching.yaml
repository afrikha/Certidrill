id: aifc01-2a-tokens-prompt-caching
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A support application sends the same 30-page product manual at the beginning of every prompt to an Amazon Bedrock model, followed by a different customer question. Users ask questions throughout the day and expect answers in real time.

    Which solution will MOST reduce the input token cost and the latency?
  fr: |
    Une application de support envoie le même manuel produit de 30 pages au début de chaque invite à un modèle Amazon Bedrock, suivi d'une question client différente. Les utilisateurs posent des questions tout au long de la journée et attendent des réponses en temps réel.

    Quelle solution réduira le PLUS le coût des jetons d'entrée et la latence ?
body:
  options:
    - { id: a, text: { en: "Use prompt caching with a cache checkpoint after the manual.", fr: "Utiliser la mise en cache des invites avec un point de contrôle de cache après le manuel." } }
    - { id: b, text: { en: "Submit the questions together in a nightly batch inference job.", fr: "Soumettre les questions ensemble dans une tâche d'inférence par lots nocturne." } }
    - { id: c, text: { en: "Purchase Provisioned Throughput with no commitment for the model.", fr: "Acheter du Provisioned Throughput sans engagement pour le modèle." } }
    - { id: d, text: { en: "Increase the maximum response length of the model for each answer.", fr: "Augmenter la longueur maximale de réponse du modèle pour chaque réponse." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Prompt caching reduces inference latency and input token costs for prompts with long, repeated context. The static manual is placed first, a cache checkpoint marks the end of the cached prefix, and later requests read the prefix from the cache at a discounted rate instead of processing it again."
    fr: "La mise en cache des invites réduit la latence d'inférence et le coût des jetons d'entrée pour les invites dont un long contexte se répète. Le manuel statique est placé en premier, un point de contrôle de cache marque la fin du préfixe mis en cache, et les requêtes suivantes lisent ce préfixe dans le cache à un tarif réduit au lieu de le traiter à nouveau."
  options:
    b:
      en: "Batch inference returns results asynchronously, which does not meet the real-time requirement, and prompt caching is not available for batch inference."
      fr: "L'inférence par lots renvoie les résultats de façon asynchrone, ce qui ne répond pas à l'exigence de temps réel, et la mise en cache des invites n'est pas disponible pour l'inférence par lots."
    c:
      en: "Provisioned Throughput buys capacity at a fixed hourly cost; it does not avoid reprocessing the repeated manual."
      fr: "Le Provisioned Throughput achète de la capacité pour un coût horaire fixe ; il n'évite pas de retraiter le manuel répété."
    d:
      en: "The response length limit affects output tokens, not the cost of the repeated input."
      fr: "La limite de longueur de réponse agit sur les jetons de sortie, pas sur le coût de l'entrée répétée."
references:
  - title: "Prompt caching for faster model inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
