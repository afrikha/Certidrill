id: aifc01-2b-adv-code-expectations
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company gives its developers a generative AI assistant that suggests code. Developers currently spend much of their time writing repetitive code and unit tests.

    Which outcome is a realistic advantage that the company can expect?
  fr: |
    Un éditeur de logiciels fournit à ses développeurs un assistant d'IA générative qui suggère du code. Les développeurs passent actuellement une grande partie de leur temps à écrire du code répétitif et des tests unitaires.

    Quel résultat constitue un avantage réaliste que l'entreprise peut attendre ?
body:
  options:
    - { id: a, text: { en: "The generated code no longer needs to be reviewed or tested.", fr: "Le code généré n'a plus besoin d'être relu ni testé." } }
    - { id: b, text: { en: "Developers spend less time on repetitive code and can focus on design work.", fr: "Les développeurs passent moins de temps sur le code répétitif et peuvent se concentrer sur la conception." } }
    - { id: c, text: { en: "Every generated suggestion compiles and is free of defects.", fr: "Chaque suggestion générée compile et ne comporte aucun défaut." } }
    - { id: d, text: { en: "Developers no longer need to understand the code base.", fr: "Les développeurs n'ont plus besoin de comprendre la base de code." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Generative AI boosts employee productivity, for example with code suggestions, which reduces the time spent on repetitive work. Outputs can still be wrong, so developers keep reviewing and testing the generated code."
    fr: "L'IA générative accroît la productivité des employés, par exemple grâce aux suggestions de code, ce qui réduit le temps consacré au travail répétitif. Les sorties peuvent toujours être fausses : les développeurs continuent donc de relire et tester le code généré."
  options:
    a:
      en: "Generative AI can produce incorrect output, so review and testing remain necessary."
      fr: "L'IA générative peut produire des sorties incorrectes : la relecture et les tests restent nécessaires."
    c:
      en: "No model guarantees defect-free code; suggestions can contain errors."
      fr: "Aucun modèle ne garantit un code sans défaut ; les suggestions peuvent contenir des erreurs."
    d:
      en: "Developers must understand the code base to judge and integrate the suggestions."
      fr: "Les développeurs doivent comprendre la base de code pour juger et intégrer les suggestions."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
  - title: "Measuring the success of generative AI in software development"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-accelerate-software-dev-lifecycle-gen-ai/measuring-success.html
