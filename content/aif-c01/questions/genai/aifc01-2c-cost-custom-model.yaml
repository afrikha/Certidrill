id: aifc01-2c-cost-custom-model
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company uses a base foundation model in Amazon Bedrock with on-demand inference. The company is considering fine-tuning the model to match its brand style and wants to understand the cost impact before it decides.

    Which statement correctly describes the additional costs of a fine-tuned custom model?
  fr: |
    Une agence de voyages utilise un modèle de fondation de base dans Amazon Bedrock avec l'inférence à la demande. L'entreprise envisage d'affiner le modèle pour qu'il respecte le style de sa marque et veut comprendre l'impact sur les coûts avant de décider.

    Quelle affirmation décrit correctement les coûts supplémentaires d'un modèle personnalisé affiné ?
body:
  options:
    - { id: a, text: { en: "There are no additional costs: the custom model is billed exactly like the base model, per token.", fr: "Il n'y a aucun coût supplémentaire : le modèle personnalisé est facturé exactement comme le modèle de base, par jeton." } }
    - { id: b, text: { en: "The company pays for the training job and a monthly storage fee, and must set up inference for the custom model.", fr: "L'entreprise paie la tâche d'entraînement et des frais de stockage mensuels, et doit configurer l'inférence du modèle personnalisé." } }
    - { id: c, text: { en: "Training is free, but the custom model can be used only through batch inference jobs.", fr: "L'entraînement est gratuit, mais le modèle personnalisé ne peut être utilisé qu'au moyen de tâches d'inférence par lots." } }
    - { id: d, text: { en: "The company pays a single upfront license fee to the model provider and nothing afterward.", fr: "L'entreprise paie une licence unique initiale au fournisseur du modèle et rien ensuite." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Customizing a model adds a training charge and a monthly storage charge for each custom model. To use the model, the company must set up inference, either with Provisioned Throughput (hourly billing for dedicated capacity) or with an on-demand custom model deployment where supported. Prompt engineering or RAG can be cheaper when they meet the requirement."
    fr: "La personnalisation d'un modèle ajoute des frais d'entraînement et des frais de stockage mensuels pour chaque modèle personnalisé. Pour utiliser le modèle, l'entreprise doit configurer l'inférence, soit avec Provisioned Throughput (facturation horaire d'une capacité dédiée), soit avec un déploiement de modèle personnalisé à la demande quand il est pris en charge. L'ingénierie des invites ou le RAG peuvent coûter moins cher quand ils répondent au besoin."
  options:
    a:
      en: "Fine-tuning adds training and storage charges, and the custom model needs its own inference setup."
      fr: "Le fine-tuning ajoute des frais d'entraînement et de stockage, et le modèle personnalisé nécessite sa propre configuration d'inférence."
    c:
      en: "Training is billed, and a custom model is used through Provisioned Throughput or an on-demand custom model deployment, not only batch jobs."
      fr: "L'entraînement est facturé, et un modèle personnalisé s'utilise avec Provisioned Throughput ou un déploiement de modèle personnalisé à la demande, pas uniquement par lots."
    d:
      en: "Bedrock bills training, storage and inference through AWS; there is no one-time license that covers all usage."
      fr: "Bedrock facture l'entraînement, le stockage et l'inférence par l'intermédiaire d'AWS ; aucune licence unique ne couvre toute l'utilisation."
references:
  - title: "Set up inference for a custom model"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-use.html
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
