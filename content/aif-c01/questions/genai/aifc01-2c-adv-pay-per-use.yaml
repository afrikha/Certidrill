id: aifc01-2c-adv-pay-per-use
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A nonprofit organization wants to launch a pilot chatbot for volunteers. The budget is small, usage is expected to be low, and the organization does not want to buy hardware or make a long-term commitment before it knows whether the pilot succeeds.

    Which advantage of Amazon Bedrock on-demand inference makes it cost-effective for this pilot?
  fr: |
    Une association veut lancer un chatbot pilote pour ses bénévoles. Le budget est réduit, l'utilisation devrait être faible et l'association ne veut ni acheter de matériel ni prendre d'engagement à long terme avant de savoir si le pilote réussit.

    Quel avantage de l'inférence à la demande d'Amazon Bedrock la rend rentable pour ce pilote ?
body:
  options:
    - { id: a, text: { en: "The organization pays a fixed monthly fee for unlimited tokens on any model.", fr: "L'association paie un forfait mensuel fixe pour un nombre illimité de jetons sur n'importe quel modèle." } }
    - { id: b, text: { en: "The organization pays only for the tokens that it processes, with no upfront commitment.", fr: "L'association ne paie que les jetons qu'elle traite, sans engagement initial." } }
    - { id: c, text: { en: "The organization pays for model units by the hour, whether or not it sends requests.", fr: "L'association paie des unités de modèle à l'heure, qu'elle envoie des requêtes ou non." } }
    - { id: d, text: { en: "The organization pays for the GPU instances that it keeps running for the chatbot.", fr: "L'association paie les instances GPU qu'elle maintient en fonctionnement pour le chatbot." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With on-demand inference, Bedrock bills per input and output token processed, at a rate that depends on the model and Region. There is no hardware to buy and no commitment, so a low-volume pilot costs little and can be stopped at any time."
    fr: "Avec l'inférence à la demande, Bedrock facture chaque jeton d'entrée et de sortie traité, à un tarif qui dépend du modèle et de la Région. Il n'y a ni matériel à acheter ni engagement : un pilote à faible volume coûte peu et peut être arrêté à tout moment."
  options:
    a:
      en: "Bedrock on-demand pricing is per token, not a flat fee for unlimited usage."
      fr: "La tarification à la demande de Bedrock est par jeton, pas un forfait pour une utilisation illimitée."
    c:
      en: "Hourly billing per model unit describes Provisioned Throughput, which is billed even when no requests are sent and does not suit a low-volume pilot."
      fr: "La facturation horaire par unité de modèle correspond à Provisioned Throughput, facturé même sans requête, ce qui ne convient pas à un pilote à faible volume."
    d:
      en: "Bedrock is serverless; the organization does not run or pay for its own GPU instances."
      fr: "Bedrock est sans serveur ; l'association n'exécute pas et ne paie pas ses propres instances GPU."
references:
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
