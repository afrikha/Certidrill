id: aifc01-2c-svc-transform-dotnet
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company has dozens of legacy .NET Framework applications that run on Windows servers. The company wants AI agents to do most of the work of modernizing the applications to cross-platform .NET that runs on Linux.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise industrielle possède des dizaines d'anciennes applications .NET Framework qui s'exécutent sur des serveurs Windows. L'entreprise veut que des agents d'IA effectuent l'essentiel du travail de modernisation des applications vers un .NET multiplateforme qui s'exécute sous Linux.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon SageMaker AI" }
    - { id: b, text: "Amazon Bedrock Guardrails" }
    - { id: c, text: "AWS Transform" }
    - { id: d, text: "AWS Glue DataBrew" }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Transform accelerates the transformation of infrastructure, applications and code with an agentic AI experience. Its AI agents modernize .NET applications to Linux-ready cross-platform .NET, and also handle mainframe modernization and VMware migrations."
    fr: "AWS Transform accélère la transformation de l'infrastructure, des applications et du code grâce à une expérience d'IA agentique. Ses agents d'IA modernisent les applications .NET vers un .NET multiplateforme compatible Linux et prennent aussi en charge la modernisation des mainframes et les migrations VMware."
  options:
    a:
      en: "SageMaker AI builds, trains and hosts ML models; it does not modernize application code."
      fr: "SageMaker AI crée, entraîne et héberge des modèles de ML ; il ne modernise pas le code des applications."
    b:
      en: "Bedrock Guardrails filter the prompts and responses of generative AI applications; they do not transform code."
      fr: "Bedrock Guardrails filtre les invites et les réponses des applications d'IA générative ; il ne transforme pas de code."
    d:
      en: "Glue DataBrew is a visual tool to clean and normalize data, not to modernize applications."
      fr: "Glue DataBrew est un outil visuel pour nettoyer et normaliser des données, pas pour moderniser des applications."
references:
  - title: "What is AWS Transform?"
    url: https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html
