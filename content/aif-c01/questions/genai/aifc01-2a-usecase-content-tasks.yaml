id: aifc01-2a-usecase-content-tasks
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A marketing department is listing tasks that it could hand to generative AI.

    Which tasks are generative AI use cases? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un service marketing liste des tâches qu'il pourrait confier à l'IA générative.

    Quelles tâches sont des cas d'utilisation de l'IA générative ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Write first drafts of blog posts about new products", fr: "Rédiger les premières versions d'articles de blog sur les nouveaux produits" } }
    - { id: b, text: { en: "Archive old campaign files at the lowest storage cost", fr: "Archiver les anciens fichiers de campagne au coût de stockage le plus bas" } }
    - { id: c, text: { en: "Encrypt the customer mailing list at rest", fr: "Chiffrer la liste de diffusion des clients au repos" } }
    - { id: d, text: { en: "Create short promotional video clips from text descriptions", fr: "Créer de courts clips vidéo promotionnels à partir de descriptions textuelles" } }
    - { id: e, text: { en: "Send campaign emails at a scheduled time", fr: "Envoyer les e-mails de campagne à une heure planifiée" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Generative AI creates new content. Writing draft blog posts is text generation, and creating video clips from text descriptions is video generation, for example with Amazon Nova Reel on Amazon Bedrock."
    fr: "L'IA générative crée du contenu nouveau. Rédiger des brouillons d'articles de blog relève de la génération de texte, et créer des clips vidéo à partir de descriptions textuelles relève de la génération de vidéo, par exemple avec Amazon Nova Reel sur Amazon Bedrock."
  options:
    b:
      en: "Archiving files at low cost is a storage task, for example with Amazon S3 Glacier storage classes."
      fr: "Archiver des fichiers à faible coût est une tâche de stockage, par exemple avec les classes de stockage Amazon S3 Glacier."
    c:
      en: "Encryption at rest is a security control, for example with AWS KMS keys."
      fr: "Le chiffrement au repos est un contrôle de sécurité, par exemple avec des clés AWS KMS."
    e:
      en: "Sending emails on a schedule is automation; it creates no new content."
      fr: "Envoyer des e-mails selon un planning relève de l'automatisation ; aucun contenu nouveau n'est créé."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
  - title: "Generating videos with Amazon Nova Reel"
    url: https://docs.aws.amazon.com/nova/latest/userguide/video-generation.html
