id: aifc01-2c-svc-quick-business
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company wants its business analysts to ask questions in natural language about sales data, build dashboards and get cited research reports that combine company documents and web sources. The analysts have no ML expertise, and the company does not want to build or host an application.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise de distribution veut que ses analystes métier posent des questions en langage naturel sur les données de ventes, créent des tableaux de bord et obtiennent des rapports de recherche avec citations qui combinent les documents de l'entreprise et des sources web. Les analystes n'ont aucune expertise en ML et l'entreprise ne veut ni créer ni héberger d'application.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Bedrock AgentCore" }
    - { id: b, text: "Amazon SageMaker JumpStart" }
    - { id: c, text: "Kiro" }
    - { id: d, text: "Amazon Quick" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Quick (named AWS Quick in the current AWS documentation) is a fully managed, AI-powered service used through natural language chat. It includes business intelligence dashboards (Quick Sight, formerly Amazon QuickSight) and Quick Research, which produces cited reports across the web and company data, with no models to host."
    fr: "Amazon Quick (nommé AWS Quick dans la documentation AWS actuelle) est un service entièrement géré, basé sur l'IA, qui s'utilise par conversation en langage naturel. Il comprend des tableaux de bord de business intelligence (Quick Sight, anciennement Amazon QuickSight) et Quick Research, qui produit des rapports avec citations à partir du web et des données de l'entreprise, sans modèle à héberger."
  options:
    a:
      en: "AgentCore is for developers who build, deploy and operate their own agents; the company does not want to build an application."
      fr: "AgentCore s'adresse aux développeurs qui créent, déploient et exploitent leurs propres agents ; l'entreprise ne veut pas créer d'application."
    b:
      en: "JumpStart provides pretrained models to deploy on SageMaker AI endpoints, which requires ML skills and hosting."
      fr: "JumpStart fournit des modèles préentraînés à déployer sur des points de terminaison SageMaker AI, ce qui exige des compétences en ML et un hébergement."
    c:
      en: "Kiro is an AI development environment for software developers, not a business intelligence tool for analysts."
      fr: "Kiro est un environnement de développement basé sur l'IA pour les développeurs de logiciels, pas un outil de business intelligence pour les analystes."
references:
  - title: "What is AWS Quick?"
    url: https://docs.aws.amazon.com/quick/latest/userguide/what-is.html
