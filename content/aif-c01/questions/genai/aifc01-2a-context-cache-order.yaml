id: aifc01-2a-context-cache-order
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application uses prompt caching on Amazon Bedrock. Each prompt contains, in this order, the user's question, a 40-page policy document that never changes, and fixed instructions. A cache checkpoint is placed at the end of the prompt. The cache is almost never hit.

    Which change will increase the cache hits?
  fr: |
    Une application utilise la mise en cache des invites sur Amazon Bedrock. Chaque invite contient, dans cet ordre, la question de l'utilisateur, un document de politique de 40 pages qui ne change jamais et des instructions fixes. Un point de contrôle de cache est placé à la fin de l'invite. Le cache n'est presque jamais utilisé.

    Quelle modification augmentera les accès au cache ?
body:
  options:
    - { id: a, text: { en: "Set the cache TTL to 1 hour and keep the question at the start of each prompt.", fr: "Définir la durée de vie (TTL) du cache à 1 heure et garder la question au début de chaque invite." } }
    - { id: b, text: { en: "Add a second cache checkpoint directly after the user's question at the start.", fr: "Ajouter un second point de contrôle de cache juste après la question de l'utilisateur, au début." } }
    - { id: c, text: { en: "Place the static content first and the question last, with the checkpoint after the document.", fr: "Placer le contenu statique en premier et la question en dernier, avec le point de contrôle après le document." } }
    - { id: d, text: { en: "Send the prompts through batch inference jobs instead of on-demand requests.", fr: "Envoyer les invites dans des tâches d'inférence par lots au lieu de requêtes à la demande." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A cache checkpoint caches the prefix that comes before it, and any change in that prefix causes a cache miss. Because the question changes on every request and comes first, the prefix is never identical. Static content must come first, with the checkpoint after it, and the variable question last."
    fr: "Un point de contrôle de cache met en cache le préfixe qui le précède, et toute modification de ce préfixe entraîne un échec d'accès au cache. Comme la question change à chaque requête et vient en premier, le préfixe n'est jamais identique. Le contenu statique doit venir en premier, suivi du point de contrôle, et la question variable en dernier."
  options:
    a:
      en: "A longer TTL keeps entries longer, but the prefix still changes with every question, so it never matches."
      fr: "Une durée de vie plus longue conserve les entrées plus longtemps, mais le préfixe change toujours à chaque question : il ne correspond jamais."
    b:
      en: "A checkpoint after the question caches a prefix that contains the changing question, so later requests still miss."
      fr: "Un point de contrôle après la question met en cache un préfixe qui contient la question variable : les requêtes suivantes échouent toujours."
    d:
      en: "Prompt caching is available only for on-demand inference, not for batch inference."
      fr: "La mise en cache des invites n'est disponible que pour l'inférence à la demande, pas pour l'inférence par lots."
references:
  - title: "Prompt caching for faster model inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
