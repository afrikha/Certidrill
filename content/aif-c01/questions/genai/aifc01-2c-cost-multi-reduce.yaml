id: aifc01-2c-cost-multi-reduce
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An online marketplace uses a large foundation model in Amazon Bedrock with on-demand inference. The model classifies the sentiment of customer reviews in real time and also generates weekly summaries of all reviews, which are not time sensitive. The company wants to reduce its inference costs while keeping acceptable quality.

    Which two actions will reduce costs? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    Une place de marché en ligne utilise un grand modèle de fondation dans Amazon Bedrock avec l'inférence à la demande. Le modèle classe en temps réel le sentiment des avis clients et génère aussi des résumés hebdomadaires de tous les avis, qui ne sont pas urgents. L'entreprise veut réduire ses coûts d'inférence tout en conservant une qualité acceptable.

    Quelles sont les deux actions qui réduiront les coûts ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Generate the weekly summaries with batch inference jobs instead of on-demand calls.", fr: "Générer les résumés hebdomadaires avec des tâches d'inférence par lots au lieu d'appels à la demande." } }
    - { id: b, text: { en: "Raise the maximum number of output tokens for the sentiment requests.", fr: "Augmenter le nombre maximal de jetons de sortie des requêtes de sentiment." } }
    - { id: c, text: { en: "Send the sentiment requests with the Priority service tier.", fr: "Envoyer les requêtes de sentiment avec le niveau de service Priority." } }
    - { id: d, text: { en: "Use model distillation to create a smaller model for the sentiment classification task.", fr: "Utiliser la distillation de modèle pour créer un modèle plus petit pour la tâche de classification du sentiment." } }
    - { id: e, text: { en: "Buy Provisioned Throughput with a 6-month commitment for the weekly summaries.", fr: "Acheter Provisioned Throughput avec un engagement de 6 mois pour les résumés hebdomadaires." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Batch inference processes non-urgent prompts asynchronously, and supported models cost 50% less than on-demand inference. Model distillation transfers knowledge from a large teacher model to a smaller, faster and more cost-efficient student model for a specific use case, such as sentiment classification."
    fr: "L'inférence par lots traite de façon asynchrone les invites non urgentes, et les modèles pris en charge coûtent 50 % moins cher qu'en inférence à la demande. La distillation de modèle transfère les connaissances d'un grand modèle enseignant vers un modèle élève plus petit, plus rapide et plus économique pour un cas d'utilisation précis, comme la classification du sentiment."
  options:
    b:
      en: "More output tokens can only increase the token count, and therefore the cost."
      fr: "Davantage de jetons de sortie ne peut qu'augmenter le nombre de jetons, et donc le coût."
    c:
      en: "The Priority tier gives faster responses at a premium over Standard pricing; it increases costs."
      fr: "Le niveau Priority offre des réponses plus rapides moyennant un supplément par rapport au tarif Standard ; il augmente les coûts."
    e:
      en: "Hourly capacity committed for 6 months is paid even when idle, which is wasteful for a job that runs once a week; batch inference is also not supported for provisioned models."
      fr: "Une capacité horaire engagée pour 6 mois est payée même inutilisée, ce qui est un gaspillage pour une tâche hebdomadaire ; l'inférence par lots n'est pas non plus prise en charge pour les modèles provisionnés."
references:
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
  - title: "Customize a model with distillation in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
