id: aifc01-2a-context-system-prompt
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's assistant on Amazon Bedrock must always answer in a formal tone, stay on the topic of the company's products, and adopt the persona of a product expert for the whole conversation.

    Where should the company place these instructions?
  fr: |
    L'assistant d'une entreprise sur Amazon Bedrock doit toujours répondre sur un ton formel, rester sur le sujet des produits de l'entreprise et adopter le rôle d'un expert produit pendant toute la conversation.

    Où l'entreprise doit-elle placer ces instructions ?
body:
  options:
    - { id: a, text: { en: "In a stop sequence", fr: "Dans une séquence d'arrêt" } }
    - { id: b, text: { en: "In the top P inference parameter", fr: "Dans le paramètre d'inférence top P" } }
    - { id: c, text: { en: "In the first user message only", fr: "Dans le premier message de l'utilisateur uniquement" } }
    - { id: d, text: { en: "In the system prompt", fr: "Dans l'invite système" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A system prompt provides instructions or context to the model about the task it should perform or the persona it should adopt during the conversation. In the Converse API, it is set in the system field of each request, separately from the user and assistant messages."
    fr: "Une invite système fournit au modèle des instructions ou du contexte sur la tâche à effectuer ou le rôle à adopter pendant la conversation. Dans l'API Converse, elle se définit dans le champ system de chaque requête, séparément des messages de l'utilisateur et de l'assistant."
  options:
    a:
      en: "A stop sequence only tells the model where to stop generating."
      fr: "Une séquence d'arrêt indique seulement au modèle où arrêter la génération."
    b:
      en: "Top P is a numeric value that limits candidate tokens; it cannot carry instructions."
      fr: "Le top P est une valeur numérique qui limite les jetons candidats ; il ne peut pas contenir d'instructions."
    c:
      en: "Instructions placed only in a user message are mixed with user content and are not set apart as the model's role for every request."
      fr: "Des instructions placées uniquement dans un message utilisateur se mêlent au contenu de l'utilisateur et ne sont pas définies à part comme le rôle du modèle pour chaque requête."
references:
  - title: "Inference using Converse API"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
