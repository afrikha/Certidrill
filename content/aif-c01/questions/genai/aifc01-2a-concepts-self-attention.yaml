id: aifc01-2a-concepts-self-attention
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team is learning how transformer-based large language models (LLMs) process text.

    Which mechanism lets a transformer weigh the importance of the different parts of an input sequence?
  fr: |
    Une équipe apprend comment les grands modèles de langage (LLM) basés sur des transformateurs traitent le texte.

    Quel mécanisme permet à un transformateur de pondérer l'importance des différentes parties d'une séquence d'entrée ?
body:
  options:
    - { id: a, text: { en: "A generator and a discriminator that are trained in competition", fr: "Un générateur et un discriminateur entraînés en compétition" } }
    - { id: b, text: { en: "Self-attention", fr: "L'auto-attention (self-attention)" } }
    - { id: c, text: { en: "A step-by-step denoising process", fr: "Un processus de débruitage étape par étape" } }
    - { id: d, text: { en: "An encoder that compresses the input into a latent space for reconstruction", fr: "Un encodeur qui compresse l'entrée dans un espace latent en vue de sa reconstruction" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Transformer-based models use a self-attention mechanism that weighs how much each part of the input sequence matters for the others. Transformers also process whole sequences in parallel, which is why they are the architecture of modern LLMs."
    fr: "Les modèles basés sur des transformateurs utilisent un mécanisme d'auto-attention qui pondère l'importance de chaque partie de la séquence d'entrée pour les autres. Les transformateurs traitent aussi des séquences entières en parallèle : c'est pourquoi ils sont l'architecture des LLM modernes."
  options:
    a:
      en: "A generator and a discriminator in competition describe a generative adversarial network (GAN)."
      fr: "Un générateur et un discriminateur en compétition décrivent un réseau antagoniste génératif (GAN)."
    c:
      en: "Step-by-step denoising is how diffusion models generate data."
      fr: "Le débruitage étape par étape est la façon dont les modèles de diffusion génèrent des données."
    d:
      en: "Compressing data into a latent space for reconstruction describes a variational autoencoder (VAE)."
      fr: "Compresser les données dans un espace latent pour les reconstruire décrit un auto-encodeur variationnel (VAE)."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
  - title: "What is LLM?"
    url: https://aws.amazon.com/what-is/large-language-model/
