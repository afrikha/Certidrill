id: aifc01-2a-usecase-product-images
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A furniture retailer wants to create many product images for its catalog from text descriptions. The retailer also wants to replace the background of existing product photos.

    Which model on Amazon Bedrock will meet these requirements?
  fr: |
    Un vendeur de meubles veut créer de nombreuses images de produits pour son catalogue à partir de descriptions textuelles. Il veut aussi remplacer l'arrière-plan de photos de produits existantes.

    Quel modèle d'Amazon Bedrock répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Nova Micro" }
    - { id: b, text: "Amazon Nova Multimodal Embeddings" }
    - { id: c, text: "Amazon Nova 2 Sonic" }
    - { id: d, text: "Amazon Nova Canvas" }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Nova Canvas is an image generation model. It generates images from text prompts and edits existing images, for example with outpainting, which replaces the background, inpainting and background removal."
    fr: "Amazon Nova Canvas est un modèle de génération d'images. Il génère des images à partir d'invites textuelles et modifie des images existantes, par exemple par outpainting, qui remplace l'arrière-plan, par inpainting ou par suppression de l'arrière-plan."
  options:
    a:
      en: "Amazon Nova Micro accepts text and generates only text."
      fr: "Amazon Nova Micro accepte du texte et ne génère que du texte."
    b:
      en: "Amazon Nova Multimodal Embeddings returns vectors for search and retrieval; it does not generate images."
      fr: "Amazon Nova Multimodal Embeddings renvoie des vecteurs pour la recherche et la récupération ; il ne génère pas d'images."
    c:
      en: "Amazon Nova 2 Sonic is a speech-to-speech model for voice conversations."
      fr: "Amazon Nova 2 Sonic est un modèle parole-parole pour les conversations vocales."
references:
  - title: "Generating images with Amazon Nova Canvas"
    url: https://docs.aws.amazon.com/nova/latest/userguide/image-generation.html
