id: aifc01-2b-agent-routing
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An internet service provider builds a support assistant. An LLM first reads each customer message and decides whether it is a billing, technical, or general question. The message is then sent to a specialized billing agent, technical-support agent, or FAQ agent.

    Which agentic workflow pattern does this describe?
  fr: |
    Un fournisseur d'accès à internet crée un assistant de support. Un LLM lit d'abord chaque message client et détermine s'il s'agit d'une question de facturation, technique ou générale. Le message est ensuite envoyé à un agent spécialisé de facturation, de support technique ou de FAQ.

    Quel modèle de flux de travail agentique cela décrit-il ?
body:
  options:
    - { id: a, text: { en: "Parallelization", fr: "Parallélisation" } }
    - { id: b, text: { en: "Routing", fr: "Routage (routing)" } }
    - { id: c, text: { en: "Evaluator and reflect-refine loop", fr: "Boucle évaluateur et réflexion-amélioration (reflect-refine)" } }
    - { id: d, text: { en: "Retrieval Augmented Generation (RAG)", fr: "Génération augmentée par récupération (RAG)" } }
answer: { optionId: b }
explanation:
  correct:
    en: "In the routing workflow, a router uses an LLM to classify the intent or category of each input and dispatches it to a specialized downstream task, tool, or agent. Triage of support requests across billing and technical agents is a typical example."
    fr: "Dans le flux de travail de routage, un routeur utilise un LLM pour classer l'intention ou la catégorie de chaque entrée et la transmet à une tâche, un outil ou un agent spécialisé en aval. Le tri des demandes de support entre agents de facturation et agents techniques en est un exemple typique."
  options:
    a:
      en: "Parallelization sends independent subtasks to several LLM calls at the same time; here each message goes to one handler chosen by its category."
      fr: "La parallélisation envoie des sous-tâches indépendantes à plusieurs appels LLM en même temps ; ici, chaque message va à un seul gestionnaire choisi selon sa catégorie."
    c:
      en: "An evaluator loop critiques and revises a generated output; it does not dispatch requests to specialized agents."
      fr: "Une boucle évaluateur critique et révise une sortie générée ; elle ne répartit pas les demandes entre agents spécialisés."
    d:
      en: "RAG adds retrieved documents to the prompt to ground a response; it does not classify and dispatch requests."
      fr: "La RAG ajoute des documents récupérés à l'invite pour ancrer une réponse ; elle ne classe pas et ne répartit pas les demandes."
references:
  - title: "Workflow for routing"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-for-routing.html
