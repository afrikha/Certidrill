id: aifc01-2b-sel-order-selection
objective: "2.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company follows AWS Well-Architected guidance to select a foundation model for a new question answering workload.

    Which five steps should the company perform in sequence? To answer, move the appropriate steps from the list of steps to the answer area and arrange them in the correct order.
  fr: |
    Une entreprise suit les recommandations AWS Well-Architected pour choisir un modèle de fondation destiné à une nouvelle charge de travail de questions-réponses.

    Quelles sont les cinq étapes que l'entreprise doit effectuer dans l'ordre ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: run, text: { en: "Run each candidate against a ground truth dataset of prompts and responses.", fr: "Exécuter chaque candidat sur un jeu de données de référence d'invites et de réponses." } }
    - { id: deploy, text: { en: "Deploy the largest available model to production before any testing.", fr: "Déployer en production le plus grand modèle disponible avant tout test." } }
    - { id: thr, text: { en: "Define minimum performance and response quality thresholds.", fr: "Définir des seuils minimaux de performance et de qualité des réponses." } }
    - { id: doc, text: { en: "Document the decision and re-test when new models become available.", fr: "Documenter la décision et refaire les tests quand de nouveaux modèles sont disponibles." } }
    - { id: cand, text: { en: "Select candidate models from several providers.", fr: "Sélectionner des modèles candidats de plusieurs fournisseurs." } }
    - { id: tuneall, text: { en: "Fine-tune every candidate before defining the requirements.", fr: "Effectuer le réglage précis de chaque candidat avant de définir les exigences." } }
    - { id: pick, text: { en: "Choose the best performer among the models that meet the thresholds.", fr: "Choisir le plus performant parmi les modèles qui atteignent les seuils." } }
answer:
  sequence: [ thr, cand, run, pick, doc ]
explanation:
  correct:
    en: "The company first defines thresholds for performance and response quality, then selects candidate models from several providers. It runs each candidate against a ground truth dataset that mirrors the real task, chooses the best performer among the models that meet the thresholds, and documents the decision so that it can re-test when new models appear."
    fr: "L'entreprise définit d'abord des seuils de performance et de qualité des réponses, puis sélectionne des modèles candidats de plusieurs fournisseurs. Elle exécute chaque candidat sur un jeu de données de référence qui reflète la tâche réelle, choisit le plus performant parmi les modèles qui atteignent les seuils, et documente la décision afin de refaire les tests quand de nouveaux modèles apparaissent."
  options:
    deploy:
      en: "The largest model is not always the best choice, and deploying without testing skips the evaluation."
      fr: "Le plus grand modèle n'est pas toujours le meilleur choix, et déployer sans tester saute l'évaluation."
    tuneall:
      en: "Customization comes after candidates are narrowed down, and only where needed; requirements come first."
      fr: "La personnalisation intervient après avoir restreint les candidats, et seulement si nécessaire ; les exigences passent en premier."
references:
  - title: "GENPERF02-BP03 Select and customize the appropriate model for your use case"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/genperf02-bp03.html
