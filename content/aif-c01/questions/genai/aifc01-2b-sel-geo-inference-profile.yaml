id: aifc01-2b-sel-geo-inference-profile
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A European insurer uses a foundation model on Amazon Bedrock. Regulations require that all inference requests be processed only in AWS Regions in the EU. The insurer also wants to absorb traffic bursts by distributing requests across several Regions.

    Which solution will meet these requirements?
  fr: |
    Un assureur européen utilise un modèle de fondation sur Amazon Bedrock. La réglementation exige que toutes les requêtes d'inférence soient traitées uniquement dans des Régions AWS de l'UE. L'assureur veut aussi absorber les pics de trafic en répartissant les requêtes sur plusieurs Régions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Call the model through a geographic (EU) cross-Region inference profile.", fr: "Appeler le modèle par un profil d'inférence interrégionale géographique (UE)." } }
    - { id: b, text: { en: "Call the model through a global cross-Region inference profile.", fr: "Appeler le modèle par un profil d'inférence interrégionale global." } }
    - { id: c, text: { en: "Call the model directly in a single EU Region without an inference profile.", fr: "Appeler le modèle directement dans une seule Région de l'UE sans profil d'inférence." } }
    - { id: d, text: { en: "Call the model in a US Region that has higher quotas.", fr: "Appeler le modèle dans une Région des États-Unis qui dispose de quotas plus élevés." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A geographic cross-Region inference profile routes requests only among the Regions of one geography, such as the EU, so data residency requirements are met while traffic is distributed across several Regions. Geographic profiles are the choice for data residency regulations."
    fr: "Un profil d'inférence interrégionale géographique n'achemine les requêtes qu'entre les Régions d'une même zone géographique, comme l'UE : les exigences de résidence des données sont respectées tout en répartissant le trafic sur plusieurs Régions. Les profils géographiques sont le choix adapté aux réglementations de résidence des données."
  options:
    b:
      en: "A global profile can route requests to any supported commercial Region worldwide; it saves cost but breaks the EU-only requirement."
      fr: "Un profil global peut acheminer les requêtes vers n'importe quelle Région commerciale prise en charge dans le monde ; il réduit le coût mais enfreint l'exigence de traitement dans l'UE uniquement."
    c:
      en: "A single Region keeps data in the EU but does not distribute bursts across several Regions."
      fr: "Une seule Région garde les données dans l'UE, mais ne répartit pas les pics sur plusieurs Régions."
    d:
      en: "Processing in a US Region violates the requirement to process requests only in the EU."
      fr: "Le traitement dans une Région des États-Unis enfreint l'exigence de traiter les requêtes uniquement dans l'UE."
references:
  - title: "Route model inference requests across AWS Regions with cross-Region inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
