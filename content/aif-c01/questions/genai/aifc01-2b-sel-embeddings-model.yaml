id: aifc01-2b-sel-embeddings-model
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A publisher wants to build semantic search over its article archive. Each article and each user query must be converted into a numeric vector so that the application can find articles whose meaning is close to the query.

    Which type of model should the publisher select for this step?
  fr: |
    Un éditeur veut créer une recherche sémantique sur ses archives d'articles. Chaque article et chaque requête d'utilisateur doivent être convertis en un vecteur numérique pour que l'application trouve les articles dont le sens est proche de la requête.

    Quel type de modèle l'éditeur doit-il choisir pour cette étape ?
body:
  options:
    - { id: a, text: { en: "An image generation model", fr: "Un modèle de génération d'images" } }
    - { id: b, text: { en: "A text generation model with a large context window", fr: "Un modèle de génération de texte doté d'une grande fenêtre de contexte" } }
    - { id: c, text: { en: "A speech-to-speech model", fr: "Un modèle parole-parole" } }
    - { id: d, text: { en: "A text embeddings model", fr: "Un modèle d'embeddings de texte" } }
answer: { optionId: d }
explanation:
  correct:
    en: "An embeddings model outputs vector representations of its input. Texts with similar meanings get vectors that are close to each other, which is the basis of semantic search and of the retrieval step of Retrieval Augmented Generation (RAG)."
    fr: "Un modèle d'embeddings produit des représentations vectorielles de son entrée. Des textes de sens proche obtiennent des vecteurs proches les uns des autres, ce qui est la base de la recherche sémantique et de l'étape de récupération de la génération augmentée par récupération (RAG)."
  options:
    a:
      en: "An image generation model outputs images, not vectors for search."
      fr: "Un modèle de génération d'images produit des images, pas des vecteurs pour la recherche."
    b:
      en: "A text generation model outputs text; a large context window does not turn it into a vector encoder."
      fr: "Un modèle de génération de texte produit du texte ; une grande fenêtre de contexte n'en fait pas un encodeur vectoriel."
    c:
      en: "A speech-to-speech model handles spoken conversations, not vector representations of articles."
      fr: "Un modèle parole-parole gère des conversations orales, pas des représentations vectorielles d'articles."
references:
  - title: "Memory-augmented agents"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/memory-augmented-agents.html
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
