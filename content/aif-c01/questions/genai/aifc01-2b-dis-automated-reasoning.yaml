id: aifc01-2b-dis-automated-reasoning
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A mortgage company's assistant on Amazon Bedrock answers questions about loan eligibility. The company must verify that each answer is logically consistent with a complex set of written eligibility rules. For each statement, the company needs an explanation of which rules make it valid or invalid.

    Which solution will meet these requirements?
  fr: |
    L'assistant d'une société de crédit immobilier sur Amazon Bedrock répond aux questions sur l'éligibilité aux prêts. L'entreprise doit vérifier que chaque réponse est logiquement cohérente avec un ensemble complexe de règles d'éligibilité écrites. Pour chaque affirmation, l'entreprise a besoin d'une explication des règles qui la rendent valide ou non valide.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Automated Reasoning checks in Amazon Bedrock Guardrails with a policy created from the eligibility rules", fr: "Les contrôles Automated Reasoning d'Amazon Bedrock Guardrails avec une politique créée à partir des règles d'éligibilité" } }
    - { id: b, text: { en: "A contextual grounding check in Amazon Bedrock Guardrails with the eligibility rules as the grounding source", fr: "Un contrôle d'ancrage contextuel d'Amazon Bedrock Guardrails avec les règles d'éligibilité comme source d'ancrage" } }
    - { id: c, text: { en: "Content filters in Amazon Bedrock Guardrails set to the highest strength", fr: "Les filtres de contenu d'Amazon Bedrock Guardrails réglés sur l'intensité la plus élevée" } }
    - { id: d, text: { en: "Denied topics in Amazon Bedrock Guardrails that block questions about eligibility", fr: "Des sujets refusés d'Amazon Bedrock Guardrails qui bloquent les questions sur l'éligibilité" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Automated Reasoning checks use formal logic to validate content against a policy built from a source document, such as eligibility rules. They detect statements that contradict the rules and return feedback that explains why a statement is valid or invalid, which suits complex rule sets in regulated industries."
    fr: "Les contrôles Automated Reasoning utilisent la logique formelle pour valider le contenu par rapport à une politique construite à partir d'un document source, comme des règles d'éligibilité. Ils détectent les affirmations qui contredisent les règles et renvoient un retour qui explique pourquoi une affirmation est valide ou non, ce qui convient aux ensembles de règles complexes des secteurs réglementés."
  options:
    b:
      en: "A contextual grounding check scores whether a response is supported by a source and relevant to the query, and filters it below a threshold; it does not prove logical consistency with rules or explain which rules apply."
      fr: "Un contrôle d'ancrage contextuel attribue un score indiquant si une réponse est étayée par une source et pertinente pour la requête, et la filtre sous un seuil ; il ne prouve pas la cohérence logique avec des règles et n'explique pas quelles règles s'appliquent."
    c:
      en: "Content filters detect harmful categories such as hate or violence; they do not check answers against eligibility rules."
      fr: "Les filtres de contenu détectent des catégories nuisibles comme la haine ou la violence ; ils ne vérifient pas les réponses par rapport à des règles d'éligibilité."
    d:
      en: "Denied topics would block the very questions that the assistant must answer."
      fr: "Des sujets refusés bloqueraient justement les questions auxquelles l'assistant doit répondre."
references:
  - title: "What are Automated Reasoning checks in Amazon Bedrock Guardrails?"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
  - title: "Use contextual grounding check to filter hallucinations in responses"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
