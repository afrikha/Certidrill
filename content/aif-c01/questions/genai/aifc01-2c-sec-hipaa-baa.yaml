id: aifc01-2c-sec-hipaa-baa
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A US hospital group that is subject to the Health Insurance Portability and Accountability Act (HIPAA) wants to process protected health information (PHI) with Amazon Bedrock to summarize clinical notes. The compliance officer asks what the hospital group must do on the AWS side before it processes PHI.

    Which action should the hospital group take?
  fr: |
    Un groupe hospitalier américain soumis à la loi HIPAA (Health Insurance Portability and Accountability Act) veut traiter des informations de santé protégées (PHI) avec Amazon Bedrock pour résumer des notes cliniques. Le responsable de la conformité demande ce que le groupe hospitalier doit faire côté AWS avant de traiter des PHI.

    Quelle action le groupe hospitalier doit-il effectuer ?
body:
  options:
    - { id: a, text: { en: "Review and accept the Business Associate Addendum (BAA) in AWS Artifact for the accounts that process PHI.", fr: "Examiner et accepter l'avenant BAA (Business Associate Addendum) dans AWS Artifact pour les comptes qui traitent des PHI." } }
    - { id: b, text: { en: "Attach a guardrail to every request, because guardrails make the application HIPAA compliant.", fr: "Associer une barrière de protection à chaque requête, car les barrières de protection rendent l'application conforme à HIPAA." } }
    - { id: c, text: { en: "Request a HIPAA certificate from each model provider whose models the hospital group uses.", fr: "Demander un certificat HIPAA à chaque fournisseur dont le groupe hospitalier utilise les modèles." } }
    - { id: d, text: { en: "Take no action, because AWS is responsible for the HIPAA compliance of applications built on Bedrock.", fr: "Ne rien faire, car AWS est responsable de la conformité HIPAA des applications créées sur Bedrock." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock is HIPAA eligible. Companies subject to HIPAA typically need a Business Associate Addendum (BAA) with AWS to safeguard PHI; in the AWS Artifact console they review and accept it and designate the AWS accounts that can process PHI. The hospital group stays responsible for the compliance of its own application."
    fr: "Amazon Bedrock est éligible HIPAA. Les entreprises soumises à HIPAA ont généralement besoin d'un avenant BAA (Business Associate Addendum) avec AWS pour protéger les PHI ; dans la console AWS Artifact, elles l'examinent, l'acceptent et désignent les comptes AWS autorisés à traiter des PHI. Le groupe hospitalier reste responsable de la conformité de sa propre application."
  options:
    b:
      en: "Guardrails filter content; they are a useful control but do not by themselves make an application HIPAA compliant or replace the BAA."
      fr: "Les barrières de protection filtrent le contenu ; ce sont des contrôles utiles, mais elles ne rendent pas à elles seules une application conforme à HIPAA et ne remplacent pas le BAA."
    c:
      en: "Model providers have no access to Bedrock prompts or completions; the agreement that covers PHI is the BAA with AWS."
      fr: "Les fournisseurs de modèles n'ont pas accès aux invites ni aux complétions de Bedrock ; l'accord qui couvre les PHI est le BAA avec AWS."
    d:
      en: "Under the shared responsibility model, the customer is responsible for compliance of its data and application with applicable laws."
      fr: "Selon le modèle de responsabilité partagée, le client est responsable de la conformité de ses données et de son application aux lois applicables."
references:
  - title: "Managing agreements in AWS Artifact"
    url: https://docs.aws.amazon.com/artifact/latest/ug/managing-agreements.html
  - title: "Amazon Bedrock FAQs"
    url: https://aws.amazon.com/bedrock/faqs/
