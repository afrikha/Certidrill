id: aifc01-2b-sel-robustness-test
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank has shortlisted two foundation models that score almost the same on its ground truth dataset of customer questions. The assistant will be public, and the bank expects some users to send unusual or manipulative prompts.

    Which additional test should the bank run before it selects a model?
  fr: |
    Une banque a présélectionné deux modèles de fondation qui obtiennent presque le même score sur son jeu de données de référence de questions de clients. L'assistant sera public, et la banque s'attend à ce que certains utilisateurs envoient des invites inhabituelles ou malveillantes.

    Quel test supplémentaire la banque doit-elle effectuer avant de choisir un modèle ?
body:
  options:
    - { id: a, text: { en: "Test both models with challenging prompts, including prompts with questionable or unconventional intent.", fr: "Tester les deux modèles avec des invites difficiles, y compris des invites à l'intention douteuse ou inhabituelle." } }
    - { id: b, text: { en: "Compare the number of parameters of the two models.", fr: "Comparer le nombre de paramètres des deux modèles." } }
    - { id: c, text: { en: "Compare the release dates of the two models.", fr: "Comparer les dates de sortie des deux modèles." } }
    - { id: d, text: { en: "Run the same ground truth dataset again with a higher temperature.", fr: "Exécuter à nouveau le même jeu de données de référence avec une température plus élevée." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS recommends testing the robustness of candidate models with challenging prompts, including ones with questionable or unconventional intent, before selecting a model. Two models with similar scores on normal questions can behave very differently on adversarial input, which matters for a public assistant."
    fr: "AWS recommande de tester la robustesse des modèles candidats avec des invites difficiles, y compris des invites à l'intention douteuse ou inhabituelle, avant de choisir un modèle. Deux modèles aux scores proches sur des questions normales peuvent se comporter très différemment face à des entrées malveillantes, ce qui compte pour un assistant public."
  options:
    b:
      en: "Model size says nothing about how the model handles manipulative prompts."
      fr: "La taille du modèle ne dit rien de la manière dont il gère les invites malveillantes."
    c:
      en: "A newer model is not necessarily more robust; it must be tested."
      fr: "Un modèle plus récent n'est pas forcément plus robuste ; il doit être testé."
    d:
      en: "Changing the temperature on normal questions does not test the behavior on unusual or manipulative prompts."
      fr: "Changer la température sur des questions normales ne teste pas le comportement face à des invites inhabituelles ou malveillantes."
references:
  - title: "GENPERF02-BP03 Select and customize the appropriate model for your use case"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/genperf02-bp03.html
