id: aifc01-2b-agent-mcp-purpose
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is building several AI agents with different agent frameworks. Each agent must use the company's ticketing system, customer database, and document store. The developers want to expose each system once, through an open standard, so that any agent can discover and call it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise crée plusieurs agents d'IA avec différents frameworks d'agents. Chaque agent doit utiliser le système de tickets, la base de données clients et le magasin de documents de l'entreprise. Les développeurs veulent exposer chaque système une seule fois, au moyen d'une norme ouverte, afin que n'importe quel agent puisse le découvrir et l'appeler.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the foundation model of each agent on the data of the three systems.", fr: "Effectuer le réglage précis (fine-tuning) du modèle de fondation de chaque agent sur les données des trois systèmes." } }
    - { id: b, text: { en: "Expose each system as a Model Context Protocol (MCP) server that agents connect to.", fr: "Exposer chaque système comme un serveur Model Context Protocol (MCP) auquel les agents se connectent." } }
    - { id: c, text: { en: "Chain prompts so that each agent passes its output to the next agent.", fr: "Enchaîner les invites pour que chaque agent transmette sa sortie à l'agent suivant." } }
    - { id: d, text: { en: "Copy the content of the three systems into the system prompt of each agent.", fr: "Copier le contenu des trois systèmes dans l'invite système de chaque agent." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Model Context Protocol (MCP) is an open protocol that standardizes how agents connect to tools and data sources. A system exposed once as an MCP server can be discovered and used by any MCP-compatible agent, whatever its framework, instead of writing one integration per agent."
    fr: "Le Model Context Protocol (MCP) est un protocole ouvert qui normalise la connexion des agents aux outils et aux sources de données. Un système exposé une seule fois comme serveur MCP peut être découvert et utilisé par tout agent compatible MCP, quel que soit son framework, au lieu d'écrire une intégration par agent."
  options:
    a:
      en: "Fine-tuning changes the model's behavior from training data; it does not let the agent call the live systems or take actions in them."
      fr: "Le réglage précis modifie le comportement du modèle à partir de données d'entraînement ; il ne permet pas à l'agent d'appeler les systèmes en direct ni d'y agir."
    c:
      en: "Prompt chaining splits a task into sequential LLM calls; it is not a way to connect agents to external systems."
      fr: "L'enchaînement d'invites découpe une tâche en appels LLM successifs ; ce n'est pas un moyen de connecter des agents à des systèmes externes."
    d:
      en: "Copying data into prompts gives static, quickly outdated context, consumes tokens, and does not let the agent act on the systems."
      fr: "Copier des données dans les invites fournit un contexte statique vite obsolète, consomme des jetons et ne permet pas à l'agent d'agir sur les systèmes."
references:
  - title: "Protocol-based tools"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/protocol-based-tools-detailed.html
