id: aifc01-2c-cost-dd-pricing
objective: "2.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs three generative AI workloads on Amazon Bedrock. Match each workload to the most suitable inference option. To answer, drag the appropriate option to each workload. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de distribution exécute trois charges de travail d'IA générative sur Amazon Bedrock. Associez chaque charge de travail à l'option d'inférence la plus adaptée. Pour répondre, faites glisser l'option appropriée vers chaque charge de travail. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: od, text: { en: "On-demand inference", fr: "Inférence à la demande" } }
    - { id: batch, text: { en: "Batch inference", fr: "Inférence par lots" } }
    - { id: pt, text: "Provisioned Throughput" }
    - { id: distill, text: { en: "Model distillation", fr: "Distillation de modèle" } }
  targets:
    - { id: t1, text: { en: "A prototype chatbot with low and unpredictable traffic and no commitment.", fr: "Un chatbot prototype avec un trafic faible et imprévisible, sans engagement." } }
    - { id: t2, text: { en: "A production assistant with steady high traffic that needs a guaranteed level of throughput for one model.", fr: "Un assistant en production avec un trafic élevé et régulier qui a besoin d'un niveau de débit garanti pour un modèle." } }
    - { id: t3, text: { en: "A monthly job that rewrites two million product descriptions stored in Amazon S3, with results needed the next day at the lowest cost.", fr: "Une tâche mensuelle qui réécrit deux millions de descriptions de produits stockées dans Amazon S3, avec des résultats attendus le lendemain au coût le plus bas." } }
answer:
  mapping: { t1: od, t2: pt, t3: batch }
explanation:
  correct:
    en: "On-demand inference bills per token with no commitment, which suits low and unpredictable traffic. Provisioned Throughput buys model units that deliver a fixed level of throughput, billed hourly, for steady high-volume production. Batch inference processes files of prompts from Amazon S3 asynchronously, and supported models are priced 50% lower than on-demand inference."
    fr: "L'inférence à la demande est facturée par jeton sans engagement, ce qui convient à un trafic faible et imprévisible. Provisioned Throughput achète des unités de modèle qui fournissent un niveau de débit fixe, facturé à l'heure, pour une production régulière à fort volume. L'inférence par lots traite de façon asynchrone des fichiers d'invites provenant d'Amazon S3, et les modèles pris en charge sont facturés 50 % moins cher que l'inférence à la demande."
  options:
    distill:
      en: "Distillation creates a smaller custom model from a larger teacher model; it is a customization technique, not an inference option for these workloads."
      fr: "La distillation crée un modèle personnalisé plus petit à partir d'un modèle enseignant plus grand ; c'est une technique de personnalisation, pas une option d'inférence pour ces charges de travail."
references:
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
  - title: "Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
