id: aifc01-2b-dis-data-privacy
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Employees of a consulting firm paste confidential client financial data into a public generative AI chatbot to get quick summaries. The firm has no agreement with the chatbot provider about how the data is stored or used.

    Which challenge of generative AI does this situation illustrate?
  fr: |
    Les employés d'un cabinet de conseil collent des données financières confidentielles de clients dans un chatbot public d'IA générative pour obtenir rapidement des résumés. Le cabinet n'a conclu aucun accord avec le fournisseur du chatbot sur la manière dont les données sont stockées ou utilisées.

    Quel défi de l'IA générative cette situation illustre-t-elle ?
body:
  options:
    - { id: a, text: { en: "Nondeterminism of the responses", fr: "Le non-déterminisme des réponses" } }
    - { id: b, text: { en: "Limited originality of the generated content", fr: "L'originalité limitée du contenu généré" } }
    - { id: c, text: { en: "High latency of the responses", fr: "La latence élevée des réponses" } }
    - { id: d, text: { en: "Security and privacy of proprietary data", fr: "La sécurité et la confidentialité des données propriétaires" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Using proprietary or confidential data with generative AI raises security and privacy concerns, such as unauthorized access to the data and unclear accountability for how it is used. Companies address this with services whose data handling is defined, for example services that do not share prompts with model providers or use them for training."
    fr: "Utiliser des données propriétaires ou confidentielles avec l'IA générative soulève des préoccupations de sécurité et de confidentialité, comme l'accès non autorisé aux données et une responsabilité floue quant à leur utilisation. Les entreprises y répondent avec des services dont le traitement des données est défini, par exemple des services qui ne partagent pas les invites avec les fournisseurs de modèles et ne les utilisent pas pour l'entraînement."
  options:
    a:
      en: "Nondeterminism means that answers vary between runs; the problem here is where confidential data goes."
      fr: "Le non-déterminisme signifie que les réponses varient d'une exécution à l'autre ; le problème ici est la destination des données confidentielles."
    b:
      en: "Limited originality concerns derivative outputs, not the exposure of client data."
      fr: "L'originalité limitée concerne les sorties dérivées, pas l'exposition des données des clients."
    c:
      en: "The scenario says nothing about response times."
      fr: "Le scénario ne dit rien des temps de réponse."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
  - title: "Amazon Bedrock FAQs"
    url: https://aws.amazon.com/bedrock/faqs/
