id: aifc01-2a-usecase-call-summaries
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A contact center records long transcripts of customer calls. Supervisors want a short paragraph for each call that states the customer's issue and how it was resolved.

    Which generative AI use case does this requirement describe?
  fr: |
    Un centre de contact enregistre de longues transcriptions des appels clients. Les superviseurs veulent un court paragraphe par appel qui indique le problème du client et la façon dont il a été résolu.

    Quel cas d'utilisation de l'IA générative cette exigence décrit-elle ?
body:
  options:
    - { id: a, text: { en: "Translation", fr: "Traduction" } }
    - { id: b, text: { en: "Summarization", fr: "Synthèse" } }
    - { id: c, text: { en: "Image generation", fr: "Génération d'images" } }
    - { id: d, text: { en: "Code generation", fr: "Génération de code" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Summarization condenses a long text into a shorter one that keeps the key points. A text FM can read each transcript and generate a paragraph that states the issue and its resolution."
    fr: "La synthèse condense un texte long en un texte plus court qui en conserve les points clés. Un FM de texte peut lire chaque transcription et générer un paragraphe qui indique le problème et sa résolution."
  options:
    a:
      en: "Translation converts text from one language to another; the requirement asks for a shorter text in the same language."
      fr: "La traduction convertit un texte d'une langue à une autre ; l'exigence demande un texte plus court dans la même langue."
    c:
      en: "Image generation creates pictures; the expected output is a paragraph of text."
      fr: "La génération d'images crée des images ; la sortie attendue est un paragraphe de texte."
    d:
      en: "Code generation produces software code, not a description of a call."
      fr: "La génération de code produit du code logiciel, pas la description d'un appel."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
