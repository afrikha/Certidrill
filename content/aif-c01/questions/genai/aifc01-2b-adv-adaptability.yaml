id: aifc01-2b-adv-adaptability
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses one foundation model (FM) to summarize reports, answer employee questions, and translate emails. To support a new task, employees only change the instructions in the prompt. The company does not build a new model for each task.

    Which advantage of generative AI does this scenario illustrate?
  fr: |
    Une entreprise utilise un seul modèle de fondation (FM) pour résumer des rapports, répondre aux questions des employés et traduire des e-mails. Pour prendre en charge une nouvelle tâche, les employés modifient seulement les instructions de l'invite. L'entreprise ne crée pas de nouveau modèle pour chaque tâche.

    Quel avantage de l'IA générative ce scénario illustre-t-il ?
body:
  options:
    - { id: a, text: { en: "Responsiveness", fr: "Réactivité" } }
    - { id: b, text: { en: "Conversational capabilities", fr: "Capacités conversationnelles" } }
    - { id: c, text: { en: "Adaptability", fr: "Adaptabilité" } }
    - { id: d, text: { en: "Interpretability", fr: "Interprétabilité" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Unlike a traditional ML model built for one narrow task, an FM is general purpose: the same model can perform very different tasks, such as summarization, question answering, and translation, depending on the prompt. Switching to a new task by changing the instructions is the adaptability of generative AI."
    fr: "Contrairement à un modèle de ML traditionnel conçu pour une tâche précise, un FM est polyvalent : le même modèle peut effectuer des tâches très différentes, comme la synthèse, la réponse aux questions et la traduction, selon l'invite. Passer à une nouvelle tâche en modifiant les instructions relève de l'adaptabilité de l'IA générative."
  options:
    a:
      en: "Responsiveness is about answering quickly and at any time; the scenario is about one model serving many tasks."
      fr: "La réactivité consiste à répondre rapidement et à tout moment ; le scénario porte sur un seul modèle au service de nombreuses tâches."
    b:
      en: "Conversational capabilities are about natural, multi-turn dialogue; the scenario does not describe a conversation."
      fr: "Les capacités conversationnelles concernent le dialogue naturel en plusieurs échanges ; le scénario ne décrit pas de conversation."
    d:
      en: "Interpretability is a known limitation of FMs, which are often hard to explain; it is not what the scenario shows."
      fr: "L'interprétabilité est une limite connue des FM, souvent difficiles à expliquer ; ce n'est pas ce que montre le scénario."
references:
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
  - title: "What is LLM? - Large Language Models Explained"
    url: https://aws.amazon.com/what-is/large-language-model/
