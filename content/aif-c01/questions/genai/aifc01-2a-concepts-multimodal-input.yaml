id: aifc01-2a-concepts-multimodal-input
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company is building a claims assistant. A customer uploads a photo of a damaged car with the question "What parts look damaged?" The assistant must answer in text.

    Which type of model will meet this requirement?
  fr: |
    Une compagnie d'assurance crée un assistant de déclaration de sinistres. Un client charge la photo d'une voiture endommagée avec la question « Quelles pièces semblent endommagées ? ». L'assistant doit répondre par du texte.

    Quel type de modèle répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "A diffusion model that generates images from text", fr: "Un modèle de diffusion qui génère des images à partir de texte" } }
    - { id: b, text: { en: "An embedding model that converts text into vectors", fr: "Un modèle de vectorisation qui convertit du texte en vecteurs" } }
    - { id: c, text: { en: "A multimodal model that accepts images and text", fr: "Un modèle multimodal qui accepte des images et du texte" } }
    - { id: d, text: { en: "A language model that accepts and generates only text", fr: "Un modèle de langage qui n'accepte et ne génère que du texte" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A multimodal model accepts more than one type of input, such as an image together with a text question, and can answer in text. For example, Amazon Nova 2 Lite accepts text, images, video and documents and generates text."
    fr: "Un modèle multimodal accepte plusieurs types d'entrée, comme une image accompagnée d'une question textuelle, et peut répondre par du texte. Par exemple, Amazon Nova 2 Lite accepte du texte, des images, de la vidéo et des documents, et génère du texte."
  options:
    a:
      en: "A text-to-image model generates images from text; it does not describe the content of a photo in text."
      fr: "Un modèle texte-image génère des images à partir de texte ; il ne décrit pas le contenu d'une photo par du texte."
    b:
      en: "A text embedding model returns vectors, not an answer, and it does not accept images."
      fr: "Un modèle de vectorisation de texte renvoie des vecteurs, pas une réponse, et il n'accepte pas d'images."
    d:
      en: "A text-only model cannot process the photo."
      fr: "Un modèle texte uniquement ne peut pas traiter la photo."
references:
  - title: "What is Amazon Nova 2?"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html
