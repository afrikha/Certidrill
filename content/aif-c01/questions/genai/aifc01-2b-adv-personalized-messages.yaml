id: aifc01-2b-adv-personalized-messages
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank must explain an upcoming fee change to its 2 million customers. Each message must explain the change in plain language and in terms of the customer's own account type and usage. Writing the messages by hand is not possible, and a sample of the messages will be reviewed before sending.

    Which approach uses an advantage of generative AI to meet these requirements?
  fr: |
    Une banque doit expliquer une prochaine modification de frais à ses 2 millions de clients. Chaque message doit expliquer la modification en langage simple et en fonction du type de compte et de l'utilisation propres au client. Rédiger les messages à la main est impossible, et un échantillon des messages sera relu avant l'envoi.

    Quelle approche utilise un avantage de l'IA générative pour répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the same generic letter that explains the fee change to all customers.", fr: "Envoyer à tous les clients la même lettre générique qui explique la modification de frais." } }
    - { id: b, text: { en: "Train a classification model that sorts customers into account types.", fr: "Entraîner un modèle de classification qui trie les clients par type de compte." } }
    - { id: c, text: { en: "Use a foundation model to generate each message from a prompt that includes the customer's account details.", fr: "Utiliser un modèle de fondation pour générer chaque message à partir d'une invite qui inclut les détails du compte du client." } }
    - { id: d, text: { en: "Ask a translation service to convert the generic letter into several languages.", fr: "Demander à un service de traduction de convertir la lettre générique en plusieurs langues." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Generative AI can create new content at scale and adapt it to the context supplied in the prompt. Including each customer's account type and usage in the prompt produces a plain-language explanation for each customer, which is impossible to write by hand for millions of people. Reviewing a sample before sending manages the risk of inaccurate output."
    fr: "L'IA générative peut créer du contenu nouveau à grande échelle et l'adapter au contexte fourni dans l'invite. Inclure le type de compte et l'utilisation de chaque client dans l'invite produit une explication en langage simple pour chaque client, impossible à rédiger à la main pour des millions de personnes. Relire un échantillon avant l'envoi permet de gérer le risque de sorties inexactes."
  options:
    a:
      en: "A generic letter does not explain the change in terms of each customer's account and usage."
      fr: "Une lettre générique n'explique pas la modification en fonction du compte et de l'utilisation de chaque client."
    b:
      en: "A classifier only groups customers; it does not write the explanations."
      fr: "Un classifieur ne fait que regrouper les clients ; il ne rédige pas les explications."
    d:
      en: "Translation changes the language of one generic text but does not personalize it."
      fr: "La traduction change la langue d'un texte générique sans le personnaliser."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
