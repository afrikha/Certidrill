id: aifc01-2a-context-stateless-history
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company builds a chatbot with the Amazon Bedrock Converse API. When a user asks a follow-up question such as "What about tomorrow?", the model does not know what the earlier messages were about.

    What should the company do?
  fr: |
    Une entreprise crée un chatbot avec l'API Converse d'Amazon Bedrock. Quand un utilisateur pose une question de suivi comme « Et demain ? », le modèle ne sait pas de quoi parlaient les messages précédents.

    Que doit faire l'entreprise ?
body:
  options:
    - { id: a, text: { en: "Include the previous messages of the conversation in each new request.", fr: "Inclure les messages précédents de la conversation dans chaque nouvelle requête." } }
    - { id: b, text: { en: "Fine-tune the model on each conversation after the conversation ends.", fr: "Peaufiner le modèle sur chaque conversation, une fois la conversation terminée." } }
    - { id: c, text: { en: "Increase the temperature of the model for the follow-up questions.", fr: "Augmenter la température du modèle pour les questions de suivi." } }
    - { id: d, text: { en: "Send the whole conversation in a batch inference job each night.", fr: "Envoyer toute la conversation dans une tâche d'inférence par lots chaque nuit." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Models do not recall previous requests unless the earlier interaction is included in the current prompt. With the Converse API, the application keeps the conversation context by sending all the messages of the conversation, with their user or assistant roles, in each request."
    fr: "Les modèles ne se souviennent pas des requêtes précédentes tant que l'interaction antérieure n'est pas incluse dans l'invite actuelle. Avec l'API Converse, l'application conserve le contexte de la conversation en envoyant tous les messages de la conversation, avec leur rôle utilisateur ou assistant, dans chaque requête."
  options:
    b:
      en: "Fine-tuning after a conversation cannot help the current conversation, and it is a costly way to handle context."
      fr: "Un fine-tuning après la conversation ne peut pas aider la conversation en cours, et c'est une façon coûteuse de gérer le contexte."
    c:
      en: "Temperature changes the randomness of the response; it does not give the model the earlier messages."
      fr: "La température modifie le caractère aléatoire de la réponse ; elle ne fournit pas au modèle les messages précédents."
    d:
      en: "Batch inference processes prompts asynchronously and does not keep a conversation state."
      fr: "L'inférence par lots traite les invites de façon asynchrone et ne conserve pas d'état de conversation."
references:
  - title: "Inference using Converse API"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
  - title: "Prompt engineering concepts"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
