id: aifc01-2c-sec-privatelink
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company runs an application on Amazon EC2 instances in private subnets of a VPC. The application calls Amazon Bedrock. Security policy states that the traffic between the VPC and Amazon Bedrock must not traverse the public internet.

    Which solution will meet this requirement?
  fr: |
    Une entreprise de santé exécute une application sur des instances Amazon EC2 dans des sous-réseaux privés d'un VPC. L'application appelle Amazon Bedrock. La politique de sécurité exige que le trafic entre le VPC et Amazon Bedrock ne traverse pas l'internet public.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Route the traffic to Amazon Bedrock through a NAT gateway in a public subnet.", fr: "Acheminer le trafic vers Amazon Bedrock au moyen d'une passerelle NAT dans un sous-réseau public." } }
    - { id: b, text: { en: "Place an Amazon CloudFront distribution in front of the Amazon Bedrock endpoint.", fr: "Placer une distribution Amazon CloudFront devant le point de terminaison Amazon Bedrock." } }
    - { id: c, text: { en: "Attach a restrictive security group to the instances and use an internet gateway.", fr: "Associer un groupe de sécurité restrictif aux instances et utiliser une passerelle internet." } }
    - { id: d, text: { en: "Create an interface VPC endpoint for Amazon Bedrock by using AWS PrivateLink.", fr: "Créer un point de terminaison d'interface VPC pour Amazon Bedrock au moyen d'AWS PrivateLink." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An interface VPC endpoint powered by AWS PrivateLink creates a private connection between the VPC and Amazon Bedrock. The application reaches Bedrock without an internet gateway or NAT gateway, so the traffic does not traverse the public internet."
    fr: "Un point de terminaison d'interface VPC basé sur AWS PrivateLink crée une connexion privée entre le VPC et Amazon Bedrock. L'application atteint Bedrock sans passerelle internet ni passerelle NAT ; le trafic ne traverse donc pas l'internet public."
  options:
    a:
      en: "A NAT gateway sends the traffic out through an internet gateway to the public Bedrock endpoint, which the policy forbids."
      fr: "Une passerelle NAT fait sortir le trafic par une passerelle internet vers le point de terminaison public de Bedrock, ce que la politique interdit."
    b:
      en: "CloudFront is a content delivery network for serving content to users; it does not provide private connectivity from a VPC to an AWS API."
      fr: "CloudFront est un réseau de diffusion de contenu destiné aux utilisateurs ; il ne fournit pas de connectivité privée d'un VPC vers une API AWS."
    c:
      en: "A security group filters traffic but the traffic still goes through the internet gateway to a public endpoint."
      fr: "Un groupe de sécurité filtre le trafic, mais celui-ci passe toujours par la passerelle internet vers un point de terminaison public."
references:
  - title: "Protect your data using Amazon VPC and AWS PrivateLink"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/usingVPC.html
