id: aifc01-2c-sec-kms-custom-model
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company will fine-tune a foundation model in Amazon Bedrock on proprietary data. Compliance rules require the company to control the key policy of the encryption key that protects the resulting custom model and to be able to disable that key at any time.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers va affiner un modèle de fondation dans Amazon Bedrock sur des données propriétaires. Les règles de conformité exigent que l'entreprise contrôle la politique de clé de la clé de chiffrement qui protège le modèle personnalisé obtenu et qu'elle puisse désactiver cette clé à tout moment.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the encryption key as a secret in AWS Secrets Manager and reference it in the application.", fr: "Stocker la clé de chiffrement comme secret dans AWS Secrets Manager et la référencer dans l'application." } }
    - { id: b, text: { en: "Specify a customer managed AWS KMS key when the company creates the model customization job.", fr: "Spécifier une clé AWS KMS gérée par le client lors de la création de la tâche de personnalisation de modèle." } }
    - { id: c, text: { en: "Keep the default encryption, which uses a key that AWS owns and manages.", fr: "Conserver le chiffrement par défaut, qui utilise une clé détenue et gérée par AWS." } }
    - { id: d, text: { en: "Enable Amazon Macie on the bucket that stores the training data.", fr: "Activer Amazon Macie sur le compartiment qui stocke les données d'entraînement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Bedrock lets the company specify an AWS KMS key for model customization jobs and the custom models they produce. With a customer managed key, the company owns the key policy and can disable or schedule deletion of the key, which blocks use of the encrypted model."
    fr: "Amazon Bedrock permet à l'entreprise de spécifier une clé AWS KMS pour les tâches de personnalisation de modèle et les modèles personnalisés qu'elles produisent. Avec une clé gérée par le client, l'entreprise contrôle la politique de clé et peut désactiver la clé ou planifier sa suppression, ce qui bloque l'utilisation du modèle chiffré."
  options:
    a:
      en: "Secrets Manager stores credentials and secrets; Bedrock encrypts custom models with AWS KMS keys, not with a secret."
      fr: "Secrets Manager stocke des informations d'identification et des secrets ; Bedrock chiffre les modèles personnalisés avec des clés AWS KMS, pas avec un secret."
    c:
      en: "With a key that AWS owns, the company can neither view nor change the key policy nor disable the key, which fails the compliance rule."
      fr: "Avec une clé détenue par AWS, l'entreprise ne peut ni consulter ni modifier la politique de clé, ni désactiver la clé, ce qui ne respecte pas la règle de conformité."
    d:
      en: "Macie discovers sensitive data in Amazon S3; it does not encrypt the custom model."
      fr: "Macie détecte les données sensibles dans Amazon S3 ; il ne chiffre pas le modèle personnalisé."
references:
  - title: "Data encryption"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-encryption.html
