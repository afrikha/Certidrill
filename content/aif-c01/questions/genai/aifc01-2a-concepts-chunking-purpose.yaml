id: aifc01-2a-concepts-chunking-purpose
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A law firm is creating an Amazon Bedrock knowledge base from contracts that are each several hundred pages long. During ingestion, the knowledge base splits each contract into chunks before it creates embeddings.

    What is the main benefit of chunking the contracts?
  fr: |
    Un cabinet d'avocats crée une base de connaissances Amazon Bedrock à partir de contrats de plusieurs centaines de pages chacun. Pendant l'ingestion, la base de connaissances découpe chaque contrat en fragments avant de créer les vectorisations (embeddings).

    Quel est le principal avantage du découpage (chunking) des contrats ?
body:
  options:
    - { id: a, text: { en: "Each chunk is encrypted with its own key, which protects the confidential clauses.", fr: "Chaque fragment est chiffré avec sa propre clé, ce qui protège les clauses confidentielles." } }
    - { id: b, text: { en: "Each chunk is used to retrain the FM, which teaches the model the content of the contracts.", fr: "Chaque fragment sert à réentraîner le FM, ce qui apprend au modèle le contenu des contrats." } }
    - { id: c, text: { en: "Each chunk shortens the responses of the FM, which lowers the cost of the output tokens.", fr: "Chaque fragment raccourcit les réponses du FM, ce qui réduit le coût des jetons de sortie." } }
    - { id: d, text: { en: "Each chunk gets its own embedding, so retrieval returns only the passages relevant to a query.", fr: "Chaque fragment obtient sa propre vectorisation : la récupération ne renvoie que les passages pertinents pour une requête." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A knowledge base converts documents into text, splits them into manageable chunks, converts each chunk into an embedding and writes it to a vector index. At query time, only the chunks that are semantically similar to the query are retrieved and added to the prompt, instead of a whole contract that would not fit in the context window."
    fr: "Une base de connaissances convertit les documents en texte, les découpe en fragments maniables, convertit chaque fragment en vectorisation et l'écrit dans un index vectoriel. Au moment de la requête, seuls les fragments sémantiquement proches de la requête sont récupérés et ajoutés à l'invite, au lieu d'un contrat entier qui ne tiendrait pas dans la fenêtre contextuelle."
  options:
    a:
      en: "Chunking prepares text for embeddings and retrieval; encryption is a separate function of the storage services."
      fr: "Le découpage prépare le texte pour la vectorisation et la récupération ; le chiffrement est une fonction distincte des services de stockage."
    b:
      en: "A knowledge base does not change the parameters of the FM; it adds retrieved passages to the prompt at inference time."
      fr: "Une base de connaissances ne modifie pas les paramètres du FM ; elle ajoute des passages récupérés à l'invite au moment de l'inférence."
    c:
      en: "Chunking affects the context added to the prompt (input), not the length of the generated response."
      fr: "Le découpage agit sur le contexte ajouté à l'invite (entrée), pas sur la longueur de la réponse générée."
references:
  - title: "How Amazon Bedrock knowledge bases work"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
