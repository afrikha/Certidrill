id: aifc01-2a-usecase-service-agent
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company wants a customer service agent that converses with travelers, calls the company's booking APIs to change reservations, and runs in a secure, serverless environment that AWS manages.

    Which AWS service should the company use to build and run the agent?
  fr: |
    Une agence de voyages veut un agent du service client qui converse avec les voyageurs, appelle les API de réservation de l'entreprise pour modifier les réservations et s'exécute dans un environnement sans serveur sécurisé géré par AWS.

    Quel service AWS l'entreprise doit-elle utiliser pour créer et exécuter l'agent ?
body:
  options:
    - { id: a, text: "Amazon Bedrock Knowledge Bases" }
    - { id: b, text: "Amazon Translate" }
    - { id: c, text: "Amazon Bedrock AgentCore" }
    - { id: d, text: "Amazon Personalize" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock AgentCore is an agentic platform to build, deploy and operate agents. AgentCore Runtime is a secure, serverless runtime for agents, and AgentCore Gateway converts APIs and Lambda functions into tools that the agent can call, such as a booking API."
    fr: "Amazon Bedrock AgentCore est une plateforme agentique pour créer, déployer et exploiter des agents. AgentCore Runtime est un environnement d'exécution sans serveur sécurisé pour les agents, et AgentCore Gateway convertit des API et des fonctions Lambda en outils que l'agent peut appeler, comme une API de réservation."
  options:
    a:
      en: "A knowledge base retrieves information from data sources for RAG; on its own it does not take actions such as changing a reservation."
      fr: "Une base de connaissances récupère des informations dans des sources de données pour le RAG ; seule, elle n'effectue pas d'actions comme la modification d'une réservation."
    b:
      en: "Amazon Translate translates text between languages; it does not converse or call APIs."
      fr: "Amazon Translate traduit du texte d'une langue à une autre ; il ne converse pas et n'appelle pas d'API."
    d:
      en: "Amazon Personalize generates recommendations from interaction data; it is not an agent platform."
      fr: "Amazon Personalize génère des recommandations à partir de données d'interaction ; ce n'est pas une plateforme d'agents."
references:
  - title: "Overview - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
