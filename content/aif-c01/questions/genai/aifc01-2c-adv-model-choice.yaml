id: aifc01-2c-adv-model-choice
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company is not sure which foundation model will give the best results for its article summaries. The company wants to compare models from several providers and to switch models later without rewriting its application code.

    Which feature of Amazon Bedrock supports this requirement?
  fr: |
    Une société de médias ne sait pas quel modèle de fondation donnera les meilleurs résultats pour ses résumés d'articles. L'entreprise veut comparer des modèles de plusieurs fournisseurs et pouvoir changer de modèle plus tard sans réécrire le code de son application.

    Quelle fonctionnalité d'Amazon Bedrock répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Provisioned Throughput, which reserves model units for one model.", fr: "Provisioned Throughput, qui réserve des unités de modèle pour un modèle." } }
    - { id: b, text: { en: "Model invocation logging, which records the requests sent to a model.", fr: "La journalisation des invocations de modèles, qui enregistre les requêtes envoyées à un modèle." } }
    - { id: c, text: { en: "The Converse API, which uses the same request format for every model that supports messages.", fr: "L'API Converse, qui utilise le même format de requête pour tous les modèles qui prennent en charge les messages." } }
    - { id: d, text: { en: "Amazon Bedrock Guardrails, which filter the prompts and responses of a model.", fr: "Amazon Bedrock Guardrails, qui filtre les invites et les réponses d'un modèle." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Bedrock offers models from many providers behind one service. The Converse API provides a consistent interface for all Bedrock models that support messages, so the company writes the code once and mainly changes the model ID to try or adopt another model."
    fr: "Bedrock propose des modèles de nombreux fournisseurs au sein d'un même service. L'API Converse fournit une interface cohérente pour tous les modèles Bedrock qui prennent en charge les messages ; l'entreprise écrit donc le code une fois et change principalement l'ID du modèle pour essayer ou adopter un autre modèle."
  options:
    a:
      en: "Provisioned Throughput buys dedicated throughput for a single model; it does not help compare or switch models."
      fr: "Provisioned Throughput achète un débit dédié pour un seul modèle ; il n'aide pas à comparer ni à changer de modèle."
    b:
      en: "Invocation logging records requests and responses for auditing; it does not make the code portable across models."
      fr: "La journalisation des invocations enregistre les requêtes et les réponses pour l'audit ; elle ne rend pas le code portable d'un modèle à l'autre."
    d:
      en: "Guardrails apply safety policies to prompts and responses; they do not provide a common interface to models."
      fr: "Guardrails applique des politiques de sécurité aux invites et aux réponses ; il ne fournit pas d'interface commune aux modèles."
references:
  - title: "Inference using Converse API"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
