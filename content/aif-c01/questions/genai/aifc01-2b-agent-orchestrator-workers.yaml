id: aifc01-2b-agent-orchestrator-workers
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company automates feature delivery with AI agents. Each feature request must be split into planning, coding, and testing subtasks that are handled by specialized agents, and their results must be combined. The process is well defined, and managers require centralized control so that the behavior of the system is predictable and explainable.

    Which multi-agent pattern should the company use?
  fr: |
    Un éditeur de logiciels automatise la livraison de fonctionnalités avec des agents d'IA. Chaque demande de fonctionnalité doit être découpée en sous-tâches de planification, de codage et de test traitées par des agents spécialisés, et leurs résultats doivent être combinés. Le processus est bien défini, et les responsables exigent un contrôle centralisé pour que le comportement du système soit prévisible et explicable.

    Quel modèle multi-agents l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Peer-to-peer collaboration in which agents self-assign roles and coordinate through shared memory", fr: "Une collaboration pair à pair dans laquelle les agents s'attribuent eux-mêmes leurs rôles et se coordonnent par une mémoire partagée" } }
    - { id: b, text: { en: "Parallelization in which identical agents process copies of the request and their answers are aggregated", fr: "Une parallélisation dans laquelle des agents identiques traitent des copies de la demande et leurs réponses sont agrégées" } }
    - { id: c, text: { en: "Orchestration in which a central agent decomposes the task, delegates to worker agents, and synthesizes their results", fr: "Une orchestration dans laquelle un agent central décompose la tâche, délègue à des agents exécutants et synthétise leurs résultats" } }
    - { id: d, text: { en: "Routing in which a classifier sends each feature request to a single agent that handles the whole request", fr: "Un routage dans lequel un classifieur envoie chaque demande de fonctionnalité à un seul agent qui traite toute la demande" } }
answer: { optionId: c }
explanation:
  correct:
    en: "In the orchestration (orchestrator-workers) workflow, a central agent uses an LLM to plan and decompose a task, delegates subtasks that need different skills to specialized worker agents, monitors progress, and synthesizes the results. Centralized task breakdown with distributed execution makes the behavior more explainable, which suits a well-defined enterprise process."
    fr: "Dans le flux de travail d'orchestration (orchestrateur-exécutants), un agent central utilise un LLM pour planifier et décomposer une tâche, délègue les sous-tâches qui demandent des compétences différentes à des agents exécutants spécialisés, suit l'avancement et synthétise les résultats. La décomposition centralisée et l'exécution distribuée rendent le comportement plus explicable, ce qui convient à un processus d'entreprise bien défini."
  options:
    a:
      en: "Peer-to-peer collaboration relies on emergent coordination and suits open-ended problems; AWS guidance recommends centralized orchestration for well-defined, predictable processes."
      fr: "La collaboration pair à pair repose sur une coordination émergente et convient aux problèmes ouverts ; les recommandations AWS préconisent l'orchestration centralisée pour les processus bien définis et prévisibles."
    b:
      en: "Parallelization runs similar or independent subtasks concurrently; it does not assign different roles such as planner, coder, and tester."
      fr: "La parallélisation exécute en même temps des sous-tâches similaires ou indépendantes ; elle n'attribue pas des rôles différents comme planificateur, développeur et testeur."
    d:
      en: "Routing dispatches each request to one handler; the requirement is to split one request into subtasks for several specialized agents."
      fr: "Le routage transmet chaque demande à un seul gestionnaire ; l'exigence est de découper une demande en sous-tâches pour plusieurs agents spécialisés."
references:
  - title: "Workflow for orchestration"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-for-orchestration.html
  - title: "Multi-agent collaboration"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/multi-agent-collaboration.html
