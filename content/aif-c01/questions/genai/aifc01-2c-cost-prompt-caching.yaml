id: aifc01-2c-cost-prompt-caching
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An engineering firm has a chat application on Amazon Bedrock that answers employee questions about a 200-page technical manual. Every request sends the same long system prompt and the full manual, followed by a short question. Employees ask several questions per minute. The firm wants to reduce both response latency and input token costs without changing models or accepting delayed responses.

    Which solution will meet these requirements?
  fr: |
    Un bureau d'ingénierie dispose d'une application de conversation sur Amazon Bedrock qui répond aux questions des employés sur un manuel technique de 200 pages. Chaque requête envoie la même longue invite système et le manuel complet, suivis d'une courte question. Les employés posent plusieurs questions par minute. L'entreprise veut réduire à la fois la latence des réponses et le coût des jetons d'entrée, sans changer de modèle ni accepter de réponses différées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Process the questions with batch inference jobs.", fr: "Traiter les questions avec des tâches d'inférence par lots." } }
    - { id: b, text: { en: "Enable prompt caching with a cache checkpoint after the system prompt and the manual.", fr: "Activer la mise en cache des invites avec un point de contrôle de cache après l'invite système et le manuel." } }
    - { id: c, text: { en: "Purchase Provisioned Throughput with a 1-month commitment.", fr: "Acheter du Provisioned Throughput avec un engagement de 1 mois." } }
    - { id: d, text: { en: "Raise the temperature inference parameter of the model.", fr: "Augmenter le paramètre d'inférence temperature du modèle." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Prompt caching reuses a long, repeated prompt prefix across requests, so the cached part is not reprocessed. This lowers latency, and cache reads are billed at a discounted rate. Static content goes first, before a cache checkpoint, and the variable question goes last; for many models the cache time to live is 5 minutes and resets on each cache hit, which suits several questions per minute."
    fr: "La mise en cache des invites réutilise d'une requête à l'autre un long préfixe d'invite répété ; la partie mise en cache n'est donc pas retraitée. Cela réduit la latence, et les lectures du cache sont facturées à un tarif réduit. Le contenu statique se place en premier, avant un point de contrôle de cache, et la question variable en dernier ; pour de nombreux modèles, la durée de vie du cache est de 5 minutes et se réinitialise à chaque accès réussi au cache, ce qui convient à plusieurs questions par minute."
  options:
    a:
      en: "Batch inference is asynchronous, so employees would wait for delayed responses; prompt caching is also not available for batch inference."
      fr: "L'inférence par lots est asynchrone : les employés attendraient des réponses différées ; la mise en cache des invites n'est d'ailleurs pas disponible pour l'inférence par lots."
    c:
      en: "Provisioned Throughput reserves capacity billed hourly; the manual would still be reprocessed and its tokens counted on every request."
      fr: "Provisioned Throughput réserve une capacité facturée à l'heure ; le manuel serait toujours retraité et ses jetons comptés à chaque requête."
    d:
      en: "Temperature controls the randomness of the output; it has no effect on latency or input token cost."
      fr: "La température contrôle le caractère aléatoire de la sortie ; elle n'a aucun effet sur la latence ni sur le coût des jetons d'entrée."
references:
  - title: "Prompt caching for faster model inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
