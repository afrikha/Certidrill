id: aifc01-2a-context-long-term-memory
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An airline is building a booking agent with Amazon Bedrock AgentCore. When a traveler says in one session that they prefer window seats, the agent must offer window seats in the traveler's future sessions, weeks later.

    Which capability should the airline use?
  fr: |
    Une compagnie aérienne crée un agent de réservation avec Amazon Bedrock AgentCore. Quand un voyageur indique lors d'une session qu'il préfère les places côté hublot, l'agent doit proposer des places côté hublot lors des sessions futures du voyageur, des semaines plus tard.

    Quelle fonctionnalité la compagnie doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "AgentCore Memory short-term memory", fr: "La mémoire à court terme d'AgentCore Memory" } }
    - { id: b, text: { en: "AgentCore Memory long-term memory", fr: "La mémoire à long terme d'AgentCore Memory" } }
    - { id: c, text: { en: "Prompt caching with a 1-hour TTL", fr: "La mise en cache des invites avec une durée de vie (TTL) de 1 heure" } }
    - { id: d, text: { en: "A model with a larger context window", fr: "Un modèle à fenêtre de contexte plus grande" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AgentCore Memory long-term memory extracts key insights, such as user preferences, facts and session summaries, from interactions and keeps them across sessions. The agent retrieves the relevant records later to personalize its responses, for example by offering a window seat."
    fr: "La mémoire à long terme d'AgentCore Memory extrait des informations clés, comme les préférences des utilisateurs, des faits et des résumés de session, à partir des interactions, et les conserve d'une session à l'autre. L'agent récupère ensuite les enregistrements pertinents pour personnaliser ses réponses, par exemple en proposant une place côté hublot."
  options:
    a:
      en: "Short-term memory stores the raw turns of a single session; it does not carry the preference into future sessions."
      fr: "La mémoire à court terme stocke les tours bruts d'une seule session ; elle ne reporte pas la préférence dans les sessions futures."
    c:
      en: "A cached prompt prefix expires after its TTL and reuses identical prompt text; it does not store what a user said weeks ago."
      fr: "Un préfixe d'invite mis en cache expire après sa durée de vie et réutilise un texte d'invite identique ; il ne stocke pas ce qu'un utilisateur a dit il y a des semaines."
    d:
      en: "A context window holds the input of one request; it keeps nothing between sessions."
      fr: "Une fenêtre de contexte contient l'entrée d'une requête ; elle ne conserve rien d'une session à l'autre."
references:
  - title: "Add memory to your Amazon Bedrock AgentCore agent"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html
  - title: "Memory types"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-types.html
