id: aifc01-2b-val-arpu
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A music streaming service uses generative AI to create personalized playlists and upgrade offers. The service wants to measure whether the average monthly revenue that it earns from each subscriber increases.

    Which metric should the service track?
  fr: |
    Un service de streaming musical utilise l'IA générative pour créer des playlists personnalisées et des offres de montée en gamme. Le service veut mesurer si le revenu mensuel moyen qu'il tire de chaque abonné augmente.

    Quelle métrique le service doit-il suivre ?
body:
  options:
    - { id: a, text: { en: "Conversion rate", fr: "Taux de conversion" } }
    - { id: b, text: { en: "BLEU score", fr: "Score BLEU" } }
    - { id: c, text: { en: "Customer lifetime value", fr: "Valeur du cycle de vie du client" } }
    - { id: d, text: { en: "Average revenue per user (ARPU)", fr: "Revenus moyens par utilisateur (ARPU)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Average revenue per user (ARPU) is the revenue for a period, such as a month, divided by the number of users. A rising ARPU after the launch of personalized offers shows that the generative AI feature increases the revenue earned from each subscriber."
    fr: "Les revenus moyens par utilisateur (ARPU) correspondent au revenu d'une période, par exemple un mois, divisé par le nombre d'utilisateurs. Une hausse de l'ARPU après le lancement des offres personnalisées montre que la fonctionnalité d'IA générative augmente le revenu tiré de chaque abonné."
  options:
    a:
      en: "Conversion rate measures the share of users who complete an action, not the average revenue per subscriber."
      fr: "Le taux de conversion mesure la part des utilisateurs qui effectuent une action, pas le revenu moyen par abonné."
    b:
      en: "BLEU is a model metric for translation quality, not a business metric."
      fr: "BLEU est une métrique de modèle pour la qualité de traduction, pas une métrique métier."
    c:
      en: "Customer lifetime value covers the whole customer relationship; the requirement is the average monthly revenue per subscriber."
      fr: "La valeur du cycle de vie du client couvre toute la relation client ; l'exigence porte sur le revenu mensuel moyen par abonné."
references:
  - title: "MLPERF01-BP01 Determine key performance indicators"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlperf01-bp01.html
