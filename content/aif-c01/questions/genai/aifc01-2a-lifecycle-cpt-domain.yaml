id: aifc01-2a-lifecycle-cpt-domain
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company has millions of unlabeled research documents. The company wants a foundation model to learn the vocabulary and knowledge of its domain in the model's parameters. The company does not have the budget to label the documents.

    Which customization method will meet these requirements?
  fr: |
    Une entreprise pharmaceutique dispose de millions de documents de recherche non étiquetés. Elle veut qu'un modèle de fondation apprenne le vocabulaire et les connaissances de son domaine dans ses paramètres. L'entreprise n'a pas le budget pour étiqueter les documents.

    Quelle méthode de personnalisation répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Supervised fine-tuning", fr: "Fine-tuning supervisé" } }
    - { id: b, text: { en: "Continued pre-training", fr: "Préentraînement continu (continued pre-training)" } }
    - { id: c, text: { en: "Few-shot prompting", fr: "Invite few-shot" } }
    - { id: d, text: { en: "Model distillation", fr: "Distillation de modèle" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Continued pre-training trains a pre-trained model further on large amounts of unlabeled domain-specific data, with the same self-supervised objectives as the original pre-training. It adds domain knowledge to the model's parameters while preserving its general language understanding."
    fr: "Le préentraînement continu poursuit l'entraînement d'un modèle préentraîné sur de grandes quantités de données de domaine non étiquetées, avec les mêmes objectifs autosupervisés que le préentraînement initial. Il ajoute des connaissances du domaine aux paramètres du modèle tout en préservant sa compréhension générale du langage."
  options:
    a:
      en: "Supervised fine-tuning requires labeled input-output examples, which the company cannot produce."
      fr: "Le fine-tuning supervisé nécessite des exemples entrée-sortie étiquetés, que l'entreprise ne peut pas produire."
    c:
      en: "Few-shot prompting adds examples to the prompt and does not change the model's parameters."
      fr: "L'invite few-shot ajoute des exemples à l'invite et ne modifie pas les paramètres du modèle."
    d:
      en: "Distillation transfers knowledge from a teacher model to a smaller student model; it does not learn from raw domain documents."
      fr: "La distillation transfère les connaissances d'un modèle enseignant vers un modèle élève plus petit ; elle n'apprend pas à partir de documents bruts du domaine."
references:
  - title: "Continued pre-training (CPT)"
    url: https://docs.aws.amazon.com/nova/latest/userguide/customize-fine-tune-hyperpod-cpt.html
