id: aifc01-2c-cost-sagemaker-idle
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup hosts an open-source text-generation model on an Amazon SageMaker AI real-time endpoint. The model receives only a few requests each day, but the monthly bill is much higher than the team expected.

    What is the MOST likely reason for the high cost?
  fr: |
    Une start-up héberge un modèle open source de génération de texte sur un point de terminaison en temps réel Amazon SageMaker AI. Le modèle ne reçoit que quelques requêtes par jour, mais la facture mensuelle est bien plus élevée que prévu.

    Quelle est la raison la PLUS probable de ce coût élevé ?
body:
  options:
    - { id: a, text: { en: "The endpoint is billed per token, and open-source models generate more tokens.", fr: "Le point de terminaison est facturé par jeton, et les modèles open source génèrent davantage de jetons." } }
    - { id: b, text: { en: "SageMaker AI charges a license fee for each open-source model that it hosts.", fr: "SageMaker AI facture des frais de licence pour chaque modèle open source qu'il héberge." } }
    - { id: c, text: { en: "The endpoint's instances are billed for every hour that they run, even when no requests arrive.", fr: "Les instances du point de terminaison sont facturées pour chaque heure de fonctionnement, même en l'absence de requêtes." } }
    - { id: d, text: { en: "SageMaker AI charges for each user who is allowed to invoke the endpoint.", fr: "SageMaker AI facture chaque utilisateur autorisé à appeler le point de terminaison." } }
answer: { optionId: c }
explanation:
  correct:
    en: "SageMaker AI real-time inference is billed per instance-hour for the instance type that the team chooses, for as long as the endpoint runs, regardless of the number of requests. For low, sporadic traffic, per-token on-demand inference in Amazon Bedrock or SageMaker AI Serverless Inference, billed for the compute used, can cost less."
    fr: "L'inférence en temps réel de SageMaker AI est facturée à l'heure d'instance pour le type d'instance choisi par l'équipe, tant que le point de terminaison fonctionne, quel que soit le nombre de requêtes. Pour un trafic faible et sporadique, l'inférence à la demande par jeton d'Amazon Bedrock ou SageMaker AI Serverless Inference, facturée pour le calcul utilisé, peut coûter moins cher."
  options:
    a:
      en: "Per-token billing applies to Bedrock on-demand inference, not to SageMaker AI real-time endpoints."
      fr: "La facturation par jeton s'applique à l'inférence à la demande de Bedrock, pas aux points de terminaison en temps réel de SageMaker AI."
    b:
      en: "SageMaker AI bills for the infrastructure used, not a license fee per open-source model."
      fr: "SageMaker AI facture l'infrastructure utilisée, pas des frais de licence par modèle open source."
    d:
      en: "SageMaker AI pricing is based on usage, not on the number of authorized users."
      fr: "La tarification de SageMaker AI est basée sur l'utilisation, pas sur le nombre d'utilisateurs autorisés."
references:
  - title: "SageMaker Pricing"
    url: https://aws.amazon.com/sagemaker/ai/pricing/
