id: aifc01-2c-svc-order-customize
objective: "2.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A legal services company wants to fine-tune a foundation model in Amazon Bedrock on examples of its own contract summaries and then use the custom model in its application.

    Which four actions should the company perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un cabinet de services juridiques veut affiner (fine-tuning) un modèle de fondation dans Amazon Bedrock sur des exemples de ses propres résumés de contrats, puis utiliser le modèle personnalisé dans son application.

    Quelles sont les quatre actions que l'entreprise doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: infer, text: { en: "Set up inference for the custom model by purchasing Provisioned Throughput or by deploying it for on-demand inference.", fr: "Configurer l'inférence du modèle personnalisé en achetant du Provisioned Throughput ou en le déployant pour l'inférence à la demande." } }
    - { id: data, text: { en: "Upload labeled prompt and response examples to an Amazon S3 bucket.", fr: "Charger des exemples étiquetés d'invites et de réponses dans un compartiment Amazon S3." } }
    - { id: sm, text: { en: "Deploy the base model to an Amazon SageMaker AI real-time endpoint.", fr: "Déployer le modèle de base sur un point de terminaison en temps réel Amazon SageMaker AI." } }
    - { id: invoke, text: { en: "Invoke the custom model from the application.", fr: "Appeler le modèle personnalisé depuis l'application." } }
    - { id: vector, text: { en: "Index the examples in a vector store in Amazon OpenSearch Service.", fr: "Indexer les exemples dans un magasin de vecteurs Amazon OpenSearch Service." } }
    - { id: job, text: { en: "Create a model customization job that uses the base model and the training data.", fr: "Créer une tâche de personnalisation de modèle qui utilise le modèle de base et les données d'entraînement." } }
answer:
  sequence: [ data, job, infer, invoke ]
explanation:
  correct:
    en: "Fine-tuning in Bedrock uses labeled data (inputs with their expected outputs) stored in Amazon S3. A model customization job adjusts the parameters of the base model and produces a custom model. Before the application can invoke the custom model, the company must set up inference for it, either with Provisioned Throughput or with an on-demand custom model deployment."
    fr: "Le fine-tuning dans Bedrock utilise des données étiquetées (des entrées avec leurs sorties attendues) stockées dans Amazon S3. Une tâche de personnalisation de modèle ajuste les paramètres du modèle de base et produit un modèle personnalisé. Avant que l'application puisse appeler le modèle personnalisé, l'entreprise doit en configurer l'inférence, avec du Provisioned Throughput ou avec un déploiement de modèle personnalisé à la demande."
  options:
    sm:
      en: "The base model is customized and served by Bedrock; deploying it to a SageMaker AI endpoint is not part of a Bedrock fine-tuning workflow."
      fr: "Le modèle de base est personnalisé et servi par Bedrock ; le déployer sur un point de terminaison SageMaker AI ne fait pas partie d'un flux de fine-tuning Bedrock."
    vector:
      en: "A vector index is used for retrieval augmented generation (RAG), not for fine-tuning a model."
      fr: "Un index vectoriel sert à la génération augmentée par extraction (RAG), pas au fine-tuning d'un modèle."
references:
  - title: "Set up inference for a custom model"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-use.html
  - title: "Key terminology"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
