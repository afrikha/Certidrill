id: aifc01-2b-dis-pretraining-cost
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup plans to train its own foundation model from scratch to power a customer support assistant.

    Which statement about this plan is correct?
  fr: |
    Une start-up prévoit d'entraîner son propre modèle de fondation à partir de zéro pour alimenter un assistant de support client.

    Quelle affirmation sur ce projet est correcte ?
body:
  options:
    - { id: a, text: { en: "Pre-training is quick and inexpensive because it uses unlabeled data.", fr: "Le pré-entraînement est rapide et peu coûteux, car il utilise des données non étiquetées." } }
    - { id: b, text: { en: "A model trained from scratch does not produce hallucinations.", fr: "Un modèle entraîné à partir de zéro ne produit pas d'hallucinations." } }
    - { id: c, text: { en: "Pre-training requires large datasets and costly compute, can take months, and running the model also needs substantial resources.", fr: "Le pré-entraînement exige de grands jeux de données et une puissance de calcul coûteuse, peut prendre des mois, et l'exécution du modèle demande aussi d'importantes ressources." } }
    - { id: d, text: { en: "Using an existing pre-trained model requires the same investment as training one from scratch.", fr: "Utiliser un modèle pré-entraîné existant exige le même investissement qu'en entraîner un à partir de zéro." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Cost is a known disadvantage of generative AI: building a foundation model from scratch is expensive and resource intensive, training can take months, and running large models also needs substantial compute. Most companies instead start from an existing pre-trained model."
    fr: "Le coût est un inconvénient connu de l'IA générative : créer un modèle de fondation à partir de zéro est coûteux et gourmand en ressources, l'entraînement peut prendre des mois, et l'exécution de grands modèles demande aussi une puissance de calcul importante. La plupart des entreprises partent plutôt d'un modèle pré-entraîné existant."
  options:
    a:
      en: "Unlabeled data avoids labeling costs, but pre-training on massive datasets still needs expensive compute for a long time."
      fr: "Les données non étiquetées évitent les coûts d'étiquetage, mais le pré-entraînement sur des jeux de données massifs nécessite toujours une puissance de calcul coûteuse pendant longtemps."
    b:
      en: "Any generative model can hallucinate, whether it is trained from scratch or not."
      fr: "Tout modèle génératif peut halluciner, qu'il soit entraîné à partir de zéro ou non."
    d:
      en: "Using an existing pre-trained model avoids the cost and time of pre-training."
      fr: "Utiliser un modèle pré-entraîné existant évite le coût et la durée du pré-entraînement."
references:
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
