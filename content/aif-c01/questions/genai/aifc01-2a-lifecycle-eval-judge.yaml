id: aifc01-2a-lifecycle-eval-judge
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Before deployment, a company wants to compare two candidate foundation models on 500 of its own prompts. Each response must be scored on qualities such as correctness and helpfulness, with an explanation of each score. The company does not want to use human reviewers.

    Which type of Amazon Bedrock evaluation will meet these requirements?
  fr: |
    Avant le déploiement, une entreprise veut comparer deux modèles de fondation candidats sur 500 de ses propres invites. Chaque réponse doit être notée sur des qualités comme l'exactitude et l'utilité, avec une explication de chaque note. L'entreprise ne veut pas faire appel à des évaluateurs humains.

    Quel type d'évaluation Amazon Bedrock répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A model evaluation that uses human workers", fr: "Une évaluation de modèle qui fait appel à des évaluateurs humains" } }
    - { id: b, text: { en: "A model evaluation that uses an LLM as a judge", fr: "Une évaluation de modèle qui utilise un LLM comme juge (LLM-as-a-judge)" } }
    - { id: c, text: { en: "A programmatic model evaluation with a built-in dataset", fr: "Une évaluation de modèle programmatique avec un jeu de données intégré" } }
    - { id: d, text: { en: "A RAG evaluation of a knowledge base", fr: "Une évaluation RAG d'une base de connaissances" } }
answer: { optionId: b }
explanation:
  correct:
    en: "In an LLM-as-a-judge evaluation, a second LLM scores each response of the evaluated model and explains its score. The company can use its own prompt dataset, and no human reviewers are needed."
    fr: "Dans une évaluation LLM-as-a-judge, un second LLM note chaque réponse du modèle évalué et explique sa note. L'entreprise peut utiliser son propre jeu de données d'invites, et aucun évaluateur humain n'est nécessaire."
  options:
    a:
      en: "Human-based evaluation relies on employees or subject-matter experts, which the company does not want."
      fr: "L'évaluation humaine repose sur des employés ou des experts du domaine, ce que l'entreprise ne veut pas."
    c:
      en: "A programmatic evaluation computes metric scores without explaining each score, and a built-in dataset would not use the company's 500 prompts."
      fr: "Une évaluation programmatique calcule des scores de métriques sans expliquer chaque note, et un jeu de données intégré n'utiliserait pas les 500 invites de l'entreprise."
    d:
      en: "A RAG evaluation measures the retrieval and generation of a knowledge base or RAG source, not a comparison of two models."
      fr: "Une évaluation RAG mesure la récupération et la génération d'une base de connaissances ou d'une source RAG, pas la comparaison de deux modèles."
references:
  - title: "Evaluate the performance of Amazon Bedrock resources"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
