id: aifc01-2b-val-unit-economics
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company runs a proof of concept (PoC) for a generative AI article-drafting tool. Leadership asks whether the tool will still be financially viable when it scales to 1 million requests each month.

    What should the team track from the start of the PoC to answer this question?
  fr: |
    Une société de médias mène une preuve de concept (PoC) pour un outil d'IA générative de rédaction d'articles. La direction demande si l'outil restera financièrement viable lorsqu'il passera à 1 million de requêtes par mois.

    Que doit suivre l'équipe dès le début de la PoC pour répondre à cette question ?
body:
  options:
    - { id: a, text: { en: "The ROUGE score of each generated article", fr: "Le score ROUGE de chaque article généré" } }
    - { id: b, text: { en: "The cost per request, including token usage, compute, and storage", fr: "Le coût par requête, y compris la consommation de jetons, le calcul et le stockage" } }
    - { id: c, text: { en: "The number of models that the team has tested", fr: "Le nombre de modèles testés par l'équipe" } }
    - { id: d, text: { en: "The size of the context window of the model", fr: "La taille de la fenêtre de contexte du modèle" } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS recommends tracking unit economics early in a generative AI PoC: the cost of each request, including token usage, compute, and storage. Multiplied by the expected volume, the cost per request determines whether the solution is financially viable at scale and feeds the business case."
    fr: "AWS recommande de suivre l'économie unitaire dès le début d'une PoC d'IA générative : le coût de chaque requête, y compris la consommation de jetons, le calcul et le stockage. Multiplié par le volume attendu, le coût par requête détermine si la solution est financièrement viable à grande échelle et alimente l'analyse de rentabilité."
  options:
    a:
      en: "ROUGE measures the quality of generated text; it does not show whether the tool is affordable at scale."
      fr: "ROUGE mesure la qualité du texte généré ; il ne montre pas si l'outil reste abordable à grande échelle."
    c:
      en: "The number of models tested describes the PoC effort, not the cost of running the tool in production."
      fr: "Le nombre de modèles testés décrit l'effort de la PoC, pas le coût d'exploitation de l'outil en production."
    d:
      en: "The context window is a model constraint; on its own it does not give the cost of each request."
      fr: "La fenêtre de contexte est une contrainte du modèle ; à elle seule, elle ne donne pas le coût de chaque requête."
references:
  - title: "Architecting a successful generative AI proof of concept"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
