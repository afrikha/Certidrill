id: aifc01-2c-sec-invocation-logging
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's compliance team must keep the full text of every prompt sent to Amazon Bedrock and of every model response, so that reviewers can audit the conversations later. The records must be stored in an Amazon S3 bucket in the same account and Region.

    Which solution will meet these requirements?
  fr: |
    L'équipe conformité d'une banque doit conserver le texte complet de chaque invite envoyée à Amazon Bedrock et de chaque réponse des modèles, afin que des réviseurs puissent auditer les conversations plus tard. Les enregistrements doivent être stockés dans un compartiment Amazon S3 du même compte et de la même Région.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable Amazon Bedrock model invocation logging with the S3 bucket as the destination.", fr: "Activer la journalisation des invocations de modèles Amazon Bedrock avec le compartiment S3 comme destination." } }
    - { id: b, text: { en: "Create an Amazon Bedrock guardrail that blocks prompts containing sensitive information.", fr: "Créer une barrière de protection Amazon Bedrock qui bloque les invites contenant des informations sensibles." } }
    - { id: c, text: { en: "Create an Amazon CloudWatch dashboard with the Bedrock invocation metrics.", fr: "Créer un tableau de bord Amazon CloudWatch avec les métriques d'invocation de Bedrock." } }
    - { id: d, text: { en: "Turn on AWS Config recording for all Amazon Bedrock resources.", fr: "Activer l'enregistrement AWS Config pour toutes les ressources Amazon Bedrock." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Model invocation logging collects the full request data, response data and metadata of model invocations in the account and Region, and sends them to Amazon CloudWatch Logs, Amazon S3 or both (same account and Region). It is disabled by default, so the bank must enable it."
    fr: "La journalisation des invocations de modèles collecte les données complètes des requêtes, les données des réponses et les métadonnées des invocations de modèles du compte et de la Région, et les envoie vers Amazon CloudWatch Logs, Amazon S3 ou les deux (même compte et même Région). Elle est désactivée par défaut ; la banque doit donc l'activer."
  options:
    b:
      en: "A guardrail filters content; it does not keep a record of prompts and responses for audit."
      fr: "Une barrière de protection filtre le contenu ; elle ne conserve pas d'enregistrement des invites et des réponses pour l'audit."
    c:
      en: "Invocation metrics are counts and durations; they do not contain the text of prompts or responses."
      fr: "Les métriques d'invocation sont des comptages et des durées ; elles ne contiennent pas le texte des invites ni des réponses."
    d:
      en: "AWS Config records resource configurations, not the content of model requests and responses."
      fr: "AWS Config enregistre la configuration des ressources, pas le contenu des requêtes et des réponses des modèles."
references:
  - title: "Monitor model invocation using CloudWatch Logs and Amazon S3"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
