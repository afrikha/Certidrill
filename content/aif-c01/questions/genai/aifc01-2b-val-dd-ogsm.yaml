id: aifc01-2b-val-dd-ogsm
objective: "2.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A retail company uses the Objectives, Goals, Strategies, and Measures (OGSM) framework to link a generative AI project to business value.

    Match each statement to the OGSM element that it represents. To answer, drag the appropriate element to each statement. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une enseigne de distribution utilise le cadre OGSM (Objectives, Goals, Strategies, and Measures) pour relier un projet d'IA générative à la valeur métier.

    Associez chaque énoncé à l'élément OGSM qu'il représente. Pour répondre, faites glisser l'élément approprié vers chaque énoncé. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: obj, text: { en: "Objective", fr: "Objectif (Objective)" } }
    - { id: goal, text: { en: "Goal", fr: "But (Goal)" } }
    - { id: strat, text: { en: "Strategy", fr: "Stratégie (Strategy)" } }
    - { id: meas, text: { en: "Measure", fr: "Mesure (Measure)" } }
    - { id: cons, text: { en: "Constraint", fr: "Contrainte" } }
  targets:
    - { id: t1, text: { en: "Improve the efficiency of customer support.", fr: "Améliorer l'efficacité du support client." } }
    - { id: t2, text: { en: "Reduce average handle time by 30% within six months.", fr: "Réduire de 30 % la durée moyenne de traitement en six mois." } }
    - { id: t3, text: { en: "Summarize incoming customer emails with generative AI.", fr: "Résumer les e-mails entrants des clients avec l'IA générative." } }
    - { id: t4, text: { en: "Average handle time per ticket, tracked every week.", fr: "Durée moyenne de traitement par ticket, suivie chaque semaine." } }
answer:
  mapping: { t1: obj, t2: goal, t3: strat, t4: meas }
explanation:
  correct:
    en: "In OGSM, the objective is the business intent (improve support efficiency), the goal is a quantifiable target (reduce average handle time by 30%), the strategy is the approach (AI-driven email summarization), and the measure is the metric used to track progress (weekly average handle time per ticket)."
    fr: "Dans OGSM, l'objectif est l'intention métier (améliorer l'efficacité du support), le but est une cible quantifiée (réduire de 30 % la durée moyenne de traitement), la stratégie est l'approche (synthèse des e-mails par l'IA) et la mesure est la métrique qui suit les progrès (durée moyenne de traitement hebdomadaire par ticket)."
  options:
    cons:
      en: "Constraint is not an element of OGSM, and none of the statements is a limit on the project."
      fr: "Contrainte n'est pas un élément d'OGSM, et aucun énoncé n'est une limite imposée au projet."
references:
  - title: "Architecting a successful generative AI proof of concept"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
