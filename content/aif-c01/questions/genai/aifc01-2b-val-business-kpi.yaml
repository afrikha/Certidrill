id: aifc01-2b-val-business-kpi
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A support team's generative AI proof of concept (PoC) improved answer relevancy and reduced the hallucination rate. The business sponsor asks whether the project will matter to the business and wants a success criterion for the go or no-go decision.

    Which success criterion should the team define?
  fr: |
    La preuve de concept (PoC) d'IA générative d'une équipe de support a amélioré la pertinence des réponses et réduit le taux d'hallucinations. Le sponsor métier demande si le projet comptera pour l'entreprise et veut un critère de réussite pour la décision de poursuivre ou non.

    Quel critère de réussite l'équipe doit-elle définir ?
body:
  options:
    - { id: a, text: { en: "Reach a higher answer relevancy score in the next round of tests", fr: "Atteindre un score de pertinence des réponses plus élevé lors de la prochaine série de tests" } }
    - { id: b, text: { en: "Reduce the number of tokens used for each answer by 20%", fr: "Réduire de 20 % le nombre de jetons utilisés pour chaque réponse" } }
    - { id: c, text: { en: "Raise the first-contact resolution rate of support requests from 60% to 75%", fr: "Faire passer le taux de résolution au premier contact des demandes de support de 60 % à 75 %" } }
    - { id: d, text: { en: "Reach a top-five position for the model on a public benchmark", fr: "Placer le modèle parmi les cinq premiers d'un benchmark public" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A PoC must show business value: AWS recommends translating the business objective into a specific, measurable goal, such as a target first-contact resolution rate. Model metrics such as relevancy and hallucination rate remain useful measures, but they do not tell the sponsor whether the business is better off."
    fr: "Une PoC doit démontrer une valeur métier : AWS recommande de traduire l'objectif métier en un but précis et mesurable, comme un taux cible de résolution au premier contact. Les métriques de modèle comme la pertinence et le taux d'hallucinations restent des mesures utiles, mais elles ne disent pas au sponsor si l'entreprise s'en porte mieux."
  options:
    a:
      en: "A relevancy score is a model metric; improving it does not show impact on the business."
      fr: "Un score de pertinence est une métrique de modèle ; l'améliorer ne montre pas d'impact sur l'activité."
    b:
      en: "Fewer tokens lower the cost per answer, but cost alone does not show that the project delivers value."
      fr: "Moins de jetons réduisent le coût par réponse, mais le coût seul ne montre pas que le projet apporte de la valeur."
    d:
      en: "Public benchmarks are general and do not reflect the company's business outcomes."
      fr: "Les benchmarks publics sont généraux et ne reflètent pas les résultats métier de l'entreprise."
references:
  - title: "Architecting a successful generative AI proof of concept"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-architecting.html
  - title: "MLPERF01-BP01 Determine key performance indicators"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlperf01-bp01.html
