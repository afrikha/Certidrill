id: aifc01-2b-dis-least-suitable
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company reviews candidate projects for a generative AI model that it will use without additional controls.

    Which project is the LEAST suitable for this model?
  fr: |
    Une entreprise examine des projets candidats pour un modèle d'IA générative qu'elle utilisera sans contrôle supplémentaire.

    Quel projet est le MOINS adapté à ce modèle ?
body:
  options:
    - { id: a, text: { en: "Drafting slogans for a campaign that the marketing team will review", fr: "Rédiger des slogans pour une campagne que l'équipe marketing relira" } }
    - { id: b, text: { en: "Summarizing internal meeting notes for the attendees", fr: "Résumer des notes de réunion internes pour les participants" } }
    - { id: c, text: { en: "Calculating each employee's payroll tax, which must be exact and identical every time", fr: "Calculer l'impôt sur le salaire de chaque employé, qui doit être exact et identique à chaque calcul" } }
    - { id: d, text: { en: "Brainstorming names for a new product line", fr: "Trouver des idées de noms pour une nouvelle gamme de produits" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Generative AI outputs are nondeterministic and can be inaccurate. A calculation that must be exact, repeatable, and auditable every time is better served by deterministic rules or code than by a generative model used without controls."
    fr: "Les sorties de l'IA générative sont non déterministes et peuvent être inexactes. Un calcul qui doit être exact, reproductible et auditable à chaque fois est mieux servi par des règles ou du code déterministes que par un modèle génératif utilisé sans contrôle."
  options:
    a:
      en: "Creative drafts benefit from variety, and a human reviews them before use."
      fr: "Les brouillons créatifs profitent de la variété, et une personne les relit avant usage."
    b:
      en: "Summarization is a strong use case, and attendees can spot errors in notes of their own meetings."
      fr: "La synthèse est un cas d'utilisation adapté, et les participants peuvent repérer les erreurs dans les notes de leurs propres réunions."
    d:
      en: "Brainstorming benefits from varied outputs and has no single correct answer."
      fr: "La recherche d'idées profite de sorties variées et n'a pas de réponse unique correcte."
references:
  - title: "Influence response generation with inference parameters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
