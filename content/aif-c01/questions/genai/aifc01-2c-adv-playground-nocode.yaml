id: aifc01-2c-adv-playground-nocode
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing manager with no programming skills wants to try several foundation models and inference parameters on sample prompts before the company decides to fund a generative AI project.

    Which Amazon Bedrock feature should the manager use?
  fr: |
    Une responsable marketing sans compétences en programmation veut essayer plusieurs modèles de fondation et paramètres d'inférence sur des exemples d'invites avant que l'entreprise décide de financer un projet d'IA générative.

    Quelle fonctionnalité d'Amazon Bedrock la responsable doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Batch inference jobs", fr: "Les tâches d'inférence par lots" } }
    - { id: b, text: { en: "Model customization jobs", fr: "Les tâches de personnalisation de modèle" } }
    - { id: c, text: { en: "Provisioned Throughput", fr: "Provisioned Throughput" } }
    - { id: d, text: { en: "The playgrounds in the Amazon Bedrock console", fr: "Les terrains de jeu (playgrounds) de la console Amazon Bedrock" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A playground is a graphical interface in the AWS Management Console where users run model inference without code. It lets the manager test the effect of different models, configurations and inference parameters on the responses to the prompts that she enters."
    fr: "Un terrain de jeu (playground) est une interface graphique de l'AWS Management Console dans laquelle les utilisateurs exécutent l'inférence de modèles sans code. Il permet à la responsable de tester l'effet de différents modèles, configurations et paramètres d'inférence sur les réponses aux invites qu'elle saisit."
  options:
    a:
      en: "Batch inference processes files of prompts stored in Amazon S3 asynchronously; it is not an interactive, no-code way to experiment."
      fr: "L'inférence par lots traite de façon asynchrone des fichiers d'invites stockés dans Amazon S3 ; ce n'est pas un moyen interactif et sans code d'expérimenter."
    b:
      en: "Model customization trains a custom model on labeled data, which is premature and costly for a first trial."
      fr: "La personnalisation de modèle entraîne un modèle personnalisé sur des données étiquetées, ce qui est prématuré et coûteux pour un premier essai."
    c:
      en: "Provisioned Throughput buys dedicated capacity for production traffic; it is not a tool to experiment with models."
      fr: "Provisioned Throughput achète une capacité dédiée pour le trafic de production ; ce n'est pas un outil pour expérimenter des modèles."
references:
  - title: "Key terminology"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
