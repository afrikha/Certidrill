id: aifc01-2c-adv-serverless
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small startup has two developers and no ML engineers. The startup wants to add generative AI features to its mobile app as soon as possible by using Amazon Bedrock.

    Which advantage of Amazon Bedrock lowers the barrier to entry for this startup?
  fr: |
    Une petite start-up compte deux développeurs et aucun ingénieur ML. La start-up veut ajouter le plus tôt possible des fonctionnalités d'IA générative à son application mobile en utilisant Amazon Bedrock.

    Quel avantage d'Amazon Bedrock réduit les obstacles à l'entrée pour cette start-up ?
body:
  options:
    - { id: a, text: { en: "The developers call pretrained foundation models through an API, without training models or managing infrastructure.", fr: "Les développeurs appellent des modèles de fondation préentraînés au moyen d'une API, sans entraîner de modèles ni gérer d'infrastructure." } }
    - { id: b, text: { en: "The developers receive a dedicated GPU instance that they configure and patch for each model they use.", fr: "Les développeurs reçoivent une instance GPU dédiée qu'ils configurent et corrigent pour chaque modèle qu'ils utilisent." } }
    - { id: c, text: { en: "The developers get model responses that are guaranteed to be free of factual errors for any prompt.", fr: "Les développeurs obtiennent des réponses de modèle garanties sans erreur factuelle pour n'importe quelle invite." } }
    - { id: d, text: { en: "The developers receive the full source code and training data of every model in the catalog.", fr: "Les développeurs reçoivent le code source complet et les données d'entraînement de chaque modèle du catalogue." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock is fully managed and serverless: developers access high-performing foundation models through an API and do not manage infrastructure or train models. Developers without ML expertise can therefore add generative AI features quickly."
    fr: "Amazon Bedrock est entièrement géré et sans serveur : les développeurs accèdent à des modèles de fondation performants au moyen d'une API et ne gèrent ni infrastructure ni entraînement de modèles. Des développeurs sans expertise en ML peuvent donc ajouter rapidement des fonctionnalités d'IA générative."
  options:
    b:
      en: "Bedrock is serverless: customers do not configure or patch the instances that run the models."
      fr: "Bedrock est sans serveur : les clients ne configurent ni ne corrigent les instances qui exécutent les modèles."
    c:
      en: "No service guarantees error-free responses; foundation models can hallucinate, and techniques such as RAG and guardrails only reduce the risk."
      fr: "Aucun service ne garantit des réponses sans erreur ; les modèles de fondation peuvent halluciner, et des techniques comme le RAG et les barrières de protection ne font que réduire le risque."
    d:
      en: "Bedrock gives API access to models; it does not hand over the source code or training data of the providers' models."
      fr: "Bedrock donne un accès par API aux modèles ; il ne fournit ni le code source ni les données d'entraînement des modèles des fournisseurs."
references:
  - title: "Amazon Bedrock FAQs"
    url: https://aws.amazon.com/bedrock/faqs/
