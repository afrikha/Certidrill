id: aifc01-2c-cost-order-pt
objective: "2.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An airline wants dedicated capacity for an Amazon Bedrock model that powers its customer-service assistant. The capacity is needed for a defined period, and the airline wants to stop the charges when the period is over.

    Which four actions should the airline perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une compagnie aérienne veut une capacité dédiée pour un modèle Amazon Bedrock qui alimente son assistant de service client. La capacité est nécessaire pendant une période définie, et la compagnie veut arrêter les frais à la fin de cette période.

    Quelles sont les quatre actions que la compagnie aérienne doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: buy, text: { en: "Purchase Provisioned Throughput for the model.", fr: "Acheter du Provisioned Throughput pour le modèle." } }
    - { id: profile, text: { en: "Add the provisioned model to a global cross-Region inference profile.", fr: "Ajouter le modèle provisionné à un profil d'inférence global entre Régions." } }
    - { id: size, text: { en: "Determine the number of model units and the commitment term.", fr: "Déterminer le nombre d'unités de modèle et la durée d'engagement." } }
    - { id: delete, text: { en: "Delete the Provisioned Throughput when the period and any commitment term are over.", fr: "Supprimer le Provisioned Throughput à la fin de la période et de toute durée d'engagement." } }
    - { id: batch, text: { en: "Submit a batch inference job that targets the provisioned model.", fr: "Soumettre une tâche d'inférence par lots qui cible le modèle provisionné." } }
    - { id: invoke, text: { en: "Run inference by using the provisioned model.", fr: "Exécuter l'inférence en utilisant le modèle provisionné." } }
answer:
  sequence: [ size, buy, invoke, delete ]
explanation:
  correct:
    en: "The airline first determines how many model units it needs and the commitment duration (none, 1 month or 6 months), then purchases Provisioned Throughput, which creates a provisioned model used for inference. Billing is hourly and continues until the Provisioned Throughput is deleted, which is possible at any time without commitment or after the term ends."
    fr: "La compagnie détermine d'abord le nombre d'unités de modèle nécessaires et la durée d'engagement (aucune, 1 mois ou 6 mois), puis achète du Provisioned Throughput, ce qui crée un modèle provisionné utilisé pour l'inférence. La facturation est horaire et continue jusqu'à la suppression du Provisioned Throughput, possible à tout moment sans engagement ou après la fin de la durée."
  options:
    profile:
      en: "Inference profiles, which are used by cross-Region inference, do not support Provisioned Throughput."
      fr: "Les profils d'inférence, utilisés par l'inférence entre Régions, ne prennent pas en charge Provisioned Throughput."
    batch:
      en: "Batch inference is not supported for provisioned models, and the assistant needs interactive responses."
      fr: "L'inférence par lots n'est pas prise en charge pour les modèles provisionnés, et l'assistant a besoin de réponses interactives."
references:
  - title: "Increase model invocation capacity with Provisioned Throughput in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
