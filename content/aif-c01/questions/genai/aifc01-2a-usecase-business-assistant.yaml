id: aifc01-2a-usecase-business-assistant
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's business analysts want an AI assistant that answers natural-language questions about the company's data and dashboards, conducts research, and automates repetitive tasks. The company does not want to write code, host models, or manage infrastructure.

    Which AWS service will meet these requirements?
  fr: |
    Les analystes métier d'une entreprise veulent un assistant d'IA qui répond à des questions en langage naturel sur les données et les tableaux de bord de l'entreprise, mène des recherches et automatise des tâches répétitives. L'entreprise ne veut ni écrire de code, ni héberger de modèles, ni gérer d'infrastructure.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon SageMaker AI" }
    - { id: b, text: "Amazon Bedrock AgentCore" }
    - { id: c, text: "Amazon Quick" }
    - { id: d, text: "Amazon SageMaker JumpStart" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Quick (named AWS Quick in the current AWS documentation, formerly Amazon QuickSight) is a fully managed, AI-powered service: users chat in natural language, and AI agents analyze connected data, build dashboards, conduct research and automate tasks. No infrastructure, model hosting or ML expertise is required."
    fr: "Amazon Quick (nommé AWS Quick dans la documentation AWS actuelle, anciennement Amazon QuickSight) est un service entièrement géré doté d'IA : les utilisateurs conversent en langage naturel, et des agents d'IA analysent les données connectées, créent des tableaux de bord, mènent des recherches et automatisent des tâches. Aucune infrastructure, aucun hébergement de modèle ni aucune expertise en ML n'est nécessaire."
  options:
    a:
      en: "SageMaker AI is used to build, train and host ML models, which requires ML and coding work."
      fr: "SageMaker AI sert à créer, entraîner et héberger des modèles de ML, ce qui demande un travail de ML et de code."
    b:
      en: "AgentCore is a platform for developers who build and deploy their own agents in code."
      fr: "AgentCore est une plateforme destinée aux développeurs qui créent et déploient leurs propres agents en code."
    d:
      en: "SageMaker JumpStart provides pretrained models to deploy on SageMaker AI endpoints that the company manages."
      fr: "SageMaker JumpStart fournit des modèles préentraînés à déployer sur des points de terminaison SageMaker AI que l'entreprise gère."
references:
  - title: "What is AWS Quick?"
    url: https://docs.aws.amazon.com/quick/latest/userguide/what-is.html
