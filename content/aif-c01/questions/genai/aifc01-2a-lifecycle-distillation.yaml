id: aifc01-2a-lifecycle-distillation
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's application uses a large foundation model on Amazon Bedrock. The responses are accurate for the company's use case, but the model is too slow and too expensive at the expected volume. The company wants a smaller model that keeps the large model's quality on this use case.

    Which solution will meet these requirements?
  fr: |
    L'application d'une entreprise utilise un grand modèle de fondation sur Amazon Bedrock. Les réponses sont exactes pour son cas d'utilisation, mais le modèle est trop lent et trop coûteux au volume prévu. L'entreprise veut un modèle plus petit qui conserve la qualité du grand modèle sur ce cas d'utilisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the large model with labeled examples of the use case.", fr: "Peaufiner le grand modèle avec des exemples étiquetés du cas d'utilisation." } }
    - { id: b, text: { en: "Run continued pre-training of a smaller model on the company's unlabeled documents.", fr: "Exécuter un préentraînement continu d'un modèle plus petit sur les documents non étiquetés de l'entreprise." } }
    - { id: c, text: { en: "Purchase Provisioned Throughput for the large model.", fr: "Acheter du Provisioned Throughput (débit provisionné) pour le grand modèle." } }
    - { id: d, text: { en: "Create a distillation job with the large model as teacher and a smaller model as student.", fr: "Créer une tâche de distillation avec le grand modèle comme enseignant et un modèle plus petit comme élève." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Model distillation transfers knowledge from a larger, more capable model (the teacher) to a smaller, faster and more cost-efficient model (the student). Amazon Bedrock generates responses from the teacher for the company's prompts and uses them to fine-tune the student, which improves the student's performance on that use case."
    fr: "La distillation de modèle transfère les connaissances d'un modèle plus grand et plus performant (l'enseignant) vers un modèle plus petit, plus rapide et plus économique (l'élève). Amazon Bedrock génère les réponses de l'enseignant pour les invites de l'entreprise et s'en sert pour peaufiner l'élève, ce qui améliore ses performances sur ce cas d'utilisation."
  options:
    a:
      en: "Fine-tuning the large model keeps a large model, so it stays slow and expensive."
      fr: "Peaufiner le grand modèle conserve un grand modèle : il reste lent et coûteux."
    b:
      en: "Continued pre-training on raw documents adds domain knowledge but does not transfer the large model's behavior on the use case."
      fr: "Le préentraînement continu sur des documents bruts ajoute des connaissances du domaine, mais il ne transfère pas le comportement du grand modèle sur le cas d'utilisation."
    c:
      en: "Provisioned Throughput increases the capacity of the same large model at a fixed hourly cost; it does not make the model smaller or cheaper per request."
      fr: "Le Provisioned Throughput augmente la capacité du même grand modèle pour un coût horaire fixe ; il ne rend pas le modèle plus petit ni moins cher par requête."
references:
  - title: "Customize a model with distillation in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
