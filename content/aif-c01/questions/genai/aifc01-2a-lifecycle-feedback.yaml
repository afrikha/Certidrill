id: aifc01-2a-lifecycle-feedback
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has deployed a generative AI writing assistant. Users rate each response with a thumbs-up or thumbs-down button, and the team uses the ratings to update the prompts and the training data.

    Which phase of the foundation model lifecycle does this activity represent?
  fr: |
    Une entreprise a déployé un assistant de rédaction d'IA générative. Les utilisateurs notent chaque réponse avec un bouton pouce levé ou pouce baissé, et l'équipe utilise ces notes pour mettre à jour les invites et les données d'entraînement.

    Quelle phase du cycle de vie du modèle de fondation cette activité représente-t-elle ?
body:
  options:
    - { id: a, text: { en: "Feedback", fr: "Commentaires (feedback)" } }
    - { id: b, text: { en: "Pre-training", fr: "Préentraînement" } }
    - { id: c, text: { en: "Data selection", fr: "Sélection des données" } }
    - { id: d, text: { en: "Model selection", fr: "Sélection du modèle" } }
answer: { optionId: a }
explanation:
  correct:
    en: "After deployment, the lifecycle continues with feedback and continuous improvement: teams monitor the application, gather user feedback and use it to refine prompts, update training data and improve the model."
    fr: "Après le déploiement, le cycle de vie se poursuit par les commentaires et l'amélioration continue : les équipes surveillent l'application, recueillent les commentaires des utilisateurs et s'en servent pour affiner les invites, mettre à jour les données d'entraînement et améliorer le modèle."
  options:
    b:
      en: "Pre-training happens before the model exists for users; it learns general patterns from a large corpus."
      fr: "Le préentraînement a lieu avant que le modèle ne soit disponible pour les utilisateurs ; il apprend des schémas généraux à partir d'un vaste corpus."
    c:
      en: "Data selection happens before training; here the ratings come from users of a deployed application."
      fr: "La sélection des données a lieu avant l'entraînement ; ici, les notes viennent des utilisateurs d'une application déployée."
    d:
      en: "Model selection compares candidate models before customization and deployment."
      fr: "La sélection du modèle compare les modèles candidats avant la personnalisation et le déploiement."
references:
  - title: "Generative AI lifecycle"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lifecycle.html
