id: aifc01-2a-usecase-bank-assistant
objective: "2.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank wants a generative AI assistant on its website. The assistant must answer questions from the bank's product brochures, which are updated every week, and must refuse to give investment advice.

    Which combination of Amazon Bedrock features will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une banque veut un assistant d'IA générative sur son site web. L'assistant doit répondre aux questions à partir des brochures de produits de la banque, mises à jour chaque semaine, et doit refuser de donner des conseils en investissement.

    Quelle combinaison de fonctionnalités d'Amazon Bedrock répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A knowledge base that uses the brochures as its data source", fr: "Une base de connaissances qui utilise les brochures comme source de données" } }
    - { id: b, text: { en: "A model fine-tuned once each quarter on the brochures", fr: "Un modèle peaufiné une fois par trimestre sur les brochures" } }
    - { id: c, text: { en: "A batch inference job that processes the questions every night", fr: "Une tâche d'inférence par lots qui traite les questions chaque nuit" } }
    - { id: d, text: { en: "A guardrail with a denied topic for investment advice", fr: "Une barrière de protection (guardrail) avec un sujet refusé pour les conseils en investissement" } }
    - { id: e, text: { en: "A model distilled from a larger model to answer faster", fr: "Un modèle distillé à partir d'un modèle plus grand pour répondre plus vite" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A knowledge base retrieves the current brochure passages at query time, so answers follow each weekly update after the data source is synced. Amazon Bedrock Guardrails can define denied topics, such as investment advice, so that the assistant refuses those requests."
    fr: "Une base de connaissances récupère les passages actuels des brochures au moment de la requête : les réponses suivent chaque mise à jour hebdomadaire après la synchronisation de la source de données. Amazon Bedrock Guardrails permet de définir des sujets refusés, comme les conseils en investissement, afin que l'assistant refuse ces demandes."
  options:
    b:
      en: "A model fine-tuned each quarter would not know the weekly brochure updates, and fine-tuning does not block a topic."
      fr: "Un modèle peaufiné chaque trimestre ignorerait les mises à jour hebdomadaires des brochures, et le fine-tuning ne bloque pas un sujet."
    c:
      en: "Batch inference processes prompts asynchronously; website visitors need answers during the conversation."
      fr: "L'inférence par lots traite les invites de façon asynchrone ; les visiteurs du site ont besoin de réponses pendant la conversation."
    e:
      en: "Distillation produces a smaller, faster model but does not add the brochure content or block investment advice."
      fr: "La distillation produit un modèle plus petit et plus rapide, mais elle n'apporte pas le contenu des brochures et ne bloque pas les conseils en investissement."
references:
  - title: "How Amazon Bedrock knowledge bases work"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
  - title: "Detect and filter harmful content by using Amazon Bedrock Guardrails"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
