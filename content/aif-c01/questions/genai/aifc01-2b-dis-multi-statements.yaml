id: aifc01-2b-dis-multi-statements
objective: "2.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's AI governance team prepares training material about the limitations of generative AI.

    Which two statements should the team include? (Choose two.)
  fr: |
    L'équipe de gouvernance de l'IA d'une entreprise prépare un support de formation sur les limites de l'IA générative.

    Quelles sont les deux affirmations que l'équipe doit inclure ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A lower temperature makes responses more deterministic but does not guarantee that they are factually correct.", fr: "Une température plus basse rend les réponses plus déterministes, mais ne garantit pas qu'elles soient factuellement correctes." } }
    - { id: b, text: { en: "Hallucinations occur only when the temperature is set to its maximum value.", fr: "Les hallucinations ne se produisent que lorsque la température est réglée sur sa valeur maximale." } }
    - { id: c, text: { en: "Retrieval Augmented Generation (RAG) eliminates hallucinations completely.", fr: "La génération augmentée par récupération (RAG) élimine complètement les hallucinations." } }
    - { id: d, text: { en: "A fluent and confident answer can still be a hallucination.", fr: "Une réponse fluide et assurée peut tout de même être une hallucination." } }
    - { id: e, text: { en: "Foundation models report which training documents produced each answer.", fr: "Les modèles de fondation indiquent quels documents d'entraînement ont produit chaque réponse." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A lower temperature steepens the probability distribution and makes responses more deterministic, but a consistent answer can still be wrong. Hallucinations are outputs that are inconsistent or factually incorrect, and models often state them fluently and confidently, so fluency is not evidence of accuracy."
    fr: "Une température plus basse accentue la distribution de probabilités et rend les réponses plus déterministes, mais une réponse constante peut tout de même être fausse. Les hallucinations sont des sorties incohérentes ou factuellement incorrectes, que les modèles énoncent souvent de façon fluide et assurée : la fluidité ne prouve pas l'exactitude."
  options:
    b:
      en: "Hallucinations can happen at any temperature, including low values."
      fr: "Les hallucinations peuvent se produire à n'importe quelle température, y compris à des valeurs basses."
    c:
      en: "RAG grounds responses in retrieved documents and reduces hallucinations, but it does not eliminate them."
      fr: "La RAG ancre les réponses dans des documents récupérés et réduit les hallucinations, mais ne les élimine pas."
    e:
      en: "Foundation models are often black boxes and do not trace their answers to training documents; this lack of interpretability is a limitation."
      fr: "Les modèles de fondation sont souvent des boîtes noires et ne relient pas leurs réponses à des documents d'entraînement ; ce manque d'interprétabilité est une limite."
references:
  - title: "Influence response generation with inference parameters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
