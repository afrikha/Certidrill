id: aifc01-2a-context-rerank
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A RAG application adds the top 20 chunks returned by an Amazon Bedrock knowledge base to each prompt. Many of these chunks are only loosely related to the question, the answers are diluted, and the input token cost is high.

    Which solution will improve the answers and reduce the cost?
  fr: |
    Une application RAG ajoute à chaque invite les 20 premiers fragments renvoyés par une base de connaissances Amazon Bedrock. Beaucoup de ces fragments n'ont qu'un rapport lointain avec la question, les réponses sont diluées et le coût des jetons d'entrée est élevé.

    Quelle solution améliorera les réponses et réduira le coût ?
body:
  options:
    - { id: a, text: { en: "Increase the number of chunks retrieved for each question to 50.", fr: "Augmenter à 50 le nombre de fragments récupérés pour chaque question." } }
    - { id: b, text: { en: "Change the chunking strategy of the knowledge base to no chunking.", fr: "Passer la stratégie de découpage de la base de connaissances à aucun découpage." } }
    - { id: c, text: { en: "Increase the temperature of the model that generates the answers.", fr: "Augmenter la température du modèle qui génère les réponses." } }
    - { id: d, text: { en: "Use a reranker model and pass only the most relevant chunks.", fr: "Utiliser un modèle de reclassement (reranker) et ne transmettre que les fragments les plus pertinents." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A reranker model calculates the relevance of each retrieved chunk to the query and reorders the results. The application can then pass fewer but more relevant chunks to the foundation model, which gives more pertinent answers and decreases cost and latency."
    fr: "Un modèle de reclassement calcule la pertinence de chaque fragment récupéré par rapport à la requête et réordonne les résultats. L'application peut alors transmettre au modèle de fondation moins de fragments, mais plus pertinents, ce qui donne des réponses plus pertinentes et réduit le coût et la latence."
  options:
    a:
      en: "More chunks add more loosely related text, which increases the cost and dilutes the answers further."
      fr: "Davantage de fragments ajoutent davantage de texte peu pertinent, ce qui augmente le coût et dilue encore les réponses."
    b:
      en: "With no chunking, each whole document becomes one chunk, so far more irrelevant text reaches the prompt."
      fr: "Sans découpage, chaque document entier devient un fragment : beaucoup plus de texte non pertinent arrive dans l'invite."
    c:
      en: "Temperature affects the randomness of the generated text, not the relevance or the number of chunks in the prompt."
      fr: "La température agit sur le caractère aléatoire du texte généré, pas sur la pertinence ni sur le nombre de fragments dans l'invite."
references:
  - title: "Improve the relevance of query responses with a reranker model in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/rerank.html
