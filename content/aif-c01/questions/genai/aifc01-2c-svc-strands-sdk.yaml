id: aifc01-2c-svc-strands-sdk
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company's developers want to write an AI agent in Python with an open-source toolkit. The agent must use foundation models from Amazon Bedrock and connect to tools through the Model Context Protocol (MCP). The team wants to deploy the agent later on AWS Lambda or Amazon EKS.

    Which AWS offering should the developers use to build the agent?
  fr: |
    Les développeurs d'une entreprise de logistique veulent écrire un agent d'IA en Python avec une boîte à outils open source. L'agent doit utiliser des modèles de fondation d'Amazon Bedrock et se connecter à des outils au moyen du protocole MCP (Model Context Protocol). L'équipe veut déployer l'agent plus tard sur AWS Lambda ou Amazon EKS.

    Quelle offre AWS les développeurs doivent-ils utiliser pour créer l'agent ?
body:
  options:
    - { id: a, text: "Strands Agents" }
    - { id: b, text: "Amazon Bedrock Knowledge Bases" }
    - { id: c, text: "AWS Transform" }
    - { id: d, text: "Amazon Lex" }
answer: { optionId: a }
explanation:
  correct:
    en: "Strands Agents is an open-source toolkit (Apache license) for building AI agents in Python and TypeScript. It supports many model providers, including Amazon Bedrock, can use MCP tools and servers, and agents built with it can run on Lambda, Fargate, Amazon EKS, Amazon EC2 or Amazon Bedrock AgentCore."
    fr: "Strands Agents est une boîte à outils open source (licence Apache) qui permet de créer des agents d'IA en Python et en TypeScript. Il prend en charge de nombreux fournisseurs de modèles, dont Amazon Bedrock, peut utiliser des outils et serveurs MCP, et les agents créés peuvent s'exécuter sur Lambda, Fargate, Amazon EKS, Amazon EC2 ou Amazon Bedrock AgentCore."
  options:
    b:
      en: "Knowledge Bases implement retrieval augmented generation (RAG) over company data; they are not a toolkit for writing agent code."
      fr: "Les bases de connaissances implémentent la génération augmentée par extraction (RAG) sur les données de l'entreprise ; ce n'est pas une boîte à outils pour écrire le code d'un agent."
    c:
      en: "AWS Transform is a managed service whose AI agents migrate and modernize existing workloads; it is not an open-source SDK."
      fr: "AWS Transform est un service géré dont les agents d'IA migrent et modernisent des charges de travail existantes ; ce n'est pas un SDK open source."
    d:
      en: "Amazon Lex is a managed service for building conversational bots with intents and slots; it is not an open-source agent SDK."
      fr: "Amazon Lex est un service géré pour créer des bots conversationnels avec des intentions et des emplacements ; ce n'est pas un SDK d'agents open source."
references:
  - title: "Strands Agents"
    url: https://strandsagents.com/latest/
