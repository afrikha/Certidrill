id: aifc01-2b-sel-human-evaluation
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A cosmetics brand has shortlisted two foundation models on Amazon Bedrock to write product copy. The deciding criteria are subjective: brand voice and emotional appeal, as judged by the brand's own copywriters.

    Which solution should the brand use to compare the models?
  fr: |
    Une marque de cosmétiques a présélectionné deux modèles de fondation sur Amazon Bedrock pour rédiger ses textes produits. Les critères décisifs sont subjectifs : la voix de la marque et l'attrait émotionnel, tels que les jugent les rédacteurs de la marque.

    Quelle solution la marque doit-elle utiliser pour comparer les modèles ?
body:
  options:
    - { id: a, text: { en: "A model evaluation job that uses human workers from the brand's copywriting team", fr: "Une tâche d'évaluation de modèles qui fait appel à des évaluateurs humains de l'équipe de rédaction de la marque" } }
    - { id: b, text: { en: "An automatic model evaluation job that uses a built-in dataset", fr: "Une tâche d'évaluation automatique de modèles qui utilise un jeu de données intégré" } }
    - { id: c, text: { en: "Amazon CloudWatch metrics that compare the latency of the two models", fr: "Des métriques Amazon CloudWatch qui comparent la latence des deux modèles" } }
    - { id: d, text: { en: "A comparison of the price per token of the two models", fr: "Une comparaison du prix par jeton des deux modèles" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon Bedrock evaluations can bring human judgment into the process: reviewers can be the company's own employees or subject-matter experts who rate responses against defined metrics. Subjective criteria judged by the brand's copywriters call for a human-based evaluation."
    fr: "Les évaluations Amazon Bedrock peuvent intégrer le jugement humain : les évaluateurs peuvent être des employés de l'entreprise ou des experts du domaine qui notent les réponses selon des métriques définies. Des critères subjectifs jugés par les rédacteurs de la marque appellent une évaluation humaine."
  options:
    b:
      en: "A built-in dataset and computed metrics do not capture the brand's own judgment of its voice."
      fr: "Un jeu de données intégré et des métriques calculées ne reflètent pas le jugement propre de la marque sur sa voix."
    c:
      en: "Latency measures speed, not brand voice or emotional appeal."
      fr: "La latence mesure la rapidité, pas la voix de la marque ni l'attrait émotionnel."
    d:
      en: "Price per token measures cost, not the quality criteria that decide the choice."
      fr: "Le prix par jeton mesure le coût, pas les critères de qualité qui décident du choix."
references:
  - title: "Evaluate the performance of Amazon Bedrock resources"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
