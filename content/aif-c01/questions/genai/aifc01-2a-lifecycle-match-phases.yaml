id: aifc01-2a-lifecycle-match-phases
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company's AI team lists activities of its generative AI project.

    Select the correct foundation model lifecycle phase from the following list for each activity. Each phase should be selected one time or not at all. (Select FOUR.)
  fr: |
    L'équipe d'IA d'une entreprise liste les activités de son projet d'IA générative.

    Sélectionnez dans la liste suivante la phase correcte du cycle de vie du modèle de fondation pour chaque activité. Chaque phase doit être sélectionnée une fois ou pas du tout. (Sélectionnez-en QUATRE.)
body:
  reuse: false
  items:
    - { id: data, text: { en: "Data selection", fr: "Sélection des données" } }
    - { id: model, text: { en: "Model selection", fr: "Sélection du modèle" } }
    - { id: pretrain, text: { en: "Pre-training", fr: "Préentraînement" } }
    - { id: tune, text: { en: "Fine-tuning", fr: "Fine-tuning" } }
    - { id: eval, text: { en: "Evaluation", fr: "Évaluation" } }
    - { id: deploy, text: { en: "Deployment", fr: "Déploiement" } }
    - { id: feedback, text: { en: "Feedback", fr: "Commentaires (feedback)" } }
  targets:
    - { id: t1, text: { en: "Compare the modalities, context windows and prices of candidate FMs", fr: "Comparer les modalités, les fenêtres de contexte et les prix des FM candidats" } }
    - { id: t2, text: { en: "Train the chosen FM on labeled prompt-completion pairs", fr: "Entraîner le FM choisi sur des paires invite-complétion étiquetées" } }
    - { id: t3, text: { en: "Measure the customized model's scores on a held-out test set", fr: "Mesurer les scores du modèle personnalisé sur un jeu de test mis de côté" } }
    - { id: t4, text: { en: "Roll out the model with CI/CD, versioning and the ability to roll back", fr: "Mettre en production le modèle avec CI/CD, gestion des versions et possibilité de restauration" } }
answer:
  mapping: { t1: model, t2: tune, t3: eval, t4: deploy }
explanation:
  correct:
    en: "Model selection compares candidates on modality, context window, latency and pricing. Fine-tuning adjusts the chosen model with labeled examples. Evaluation measures the customized model on data it was not trained on. Deployment rolls the solution out in a controlled way with CI/CD pipelines, versioning and quick rollbacks."
    fr: "La sélection du modèle compare les candidats sur la modalité, la fenêtre de contexte, la latence et la tarification. Le fine-tuning ajuste le modèle choisi avec des exemples étiquetés. L'évaluation mesure le modèle personnalisé sur des données qui n'ont pas servi à l'entraînement. Le déploiement met la solution en production de façon contrôlée, avec des pipelines CI/CD, la gestion des versions et des restaurations rapides."
  options:
    data:
      en: "Data selection chooses and curates the training data before any training."
      fr: "La sélection des données choisit et organise les données d'entraînement avant tout entraînement."
    pretrain:
      en: "Pre-training builds a model from scratch on unlabeled data, which none of the activities describes."
      fr: "Le préentraînement crée un modèle à partir de zéro sur des données non étiquetées, ce qu'aucune activité ne décrit."
    feedback:
      en: "Feedback collects user input after deployment to improve the model."
      fr: "Les commentaires recueillent l'avis des utilisateurs après le déploiement pour améliorer le modèle."
references:
  - title: "Generative AI lifecycle"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lifecycle.html
