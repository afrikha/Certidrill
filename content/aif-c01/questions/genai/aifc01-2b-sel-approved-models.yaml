id: aifc01-2b-sel-approved-models
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A large enterprise lets many teams build generative AI applications on Amazon Bedrock. Compliance rules require that teams use only the foundation models that the company's model governance committee has evaluated and approved.

    Which solution will meet these requirements?
  fr: |
    Une grande entreprise permet à de nombreuses équipes de créer des applications d'IA générative sur Amazon Bedrock. Les règles de conformité exigent que les équipes n'utilisent que les modèles de fondation que le comité de gouvernance des modèles de l'entreprise a évalués et approuvés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Let each team choose any model and review the choices once a year.", fr: "Laisser chaque équipe choisir n'importe quel modèle et examiner les choix une fois par an." } }
    - { id: b, text: { en: "Publish the list of approved models on the intranet and ask the teams to follow it.", fr: "Publier la liste des modèles approuvés sur l'intranet et demander aux équipes de la respecter." } }
    - { id: c, text: { en: "Approve only the largest model of each model provider.", fr: "N'approuver que le plus grand modèle de chaque fournisseur." } }
    - { id: d, text: { en: "Maintain an approved set of models and use IAM policies to allow access only to those models.", fr: "Maintenir un ensemble de modèles approuvés et utiliser des politiques IAM pour n'autoriser l'accès qu'à ces modèles." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS recommends an approved set of foundation models, evaluated by a governance committee with defined criteria before the models are made available. With Amazon Bedrock, IAM controls which users can enable and access specific models, so the compliance rule is enforced rather than only documented."
    fr: "AWS recommande un ensemble approuvé de modèles de fondation, évalués par un comité de gouvernance selon des critères définis avant leur mise à disposition. Avec Amazon Bedrock, IAM contrôle quels utilisateurs peuvent activer et utiliser des modèles précis : la règle de conformité est appliquée, et pas seulement documentée."
  options:
    a:
      en: "A yearly review lets teams use unapproved models for months, which breaks the rule."
      fr: "Une revue annuelle laisse les équipes utiliser des modèles non approuvés pendant des mois, ce qui enfreint la règle."
    b:
      en: "A published list is not enforced; nothing prevents a team from calling an unapproved model."
      fr: "Une liste publiée n'est pas appliquée ; rien n'empêche une équipe d'appeler un modèle non approuvé."
    c:
      en: "Model size is not an approval criterion, and the largest model is not always the best choice."
      fr: "La taille du modèle n'est pas un critère d'approbation, et le plus grand modèle n'est pas toujours le meilleur choix."
references:
  - title: "Layer 2: Approved set of foundation models and tools"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-enterprise-ready-gen-ai-platform/model.html
