id: aifc01-2c-sec-multi-data-protection
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A government contractor is assessing how Amazon Bedrock protects the prompts and completions of its applications.

    Which two statements are true? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un sous-traitant gouvernemental évalue la façon dont Amazon Bedrock protège les invites et les complétions de ses applications.

    Quelles sont les deux affirmations vraies ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Model invocation logging is enabled by default and sends the prompts to the model provider.", fr: "La journalisation des invocations de modèles est activée par défaut et envoie les invites au fournisseur du modèle." } }
    - { id: b, text: { en: "Data that cross-Region inference sends between Regions travels over the public internet.", fr: "Les données que l'inférence entre Régions envoie entre les Régions transitent par l'internet public." } }
    - { id: c, text: { en: "Models run in deployment accounts that model providers cannot access, so the providers cannot see prompts or completions.", fr: "Les modèles s'exécutent dans des comptes de déploiement auxquels les fournisseurs de modèles n'ont pas accès ; les fournisseurs ne peuvent donc pas voir les invites ni les complétions." } }
    - { id: d, text: { en: "Model providers receive a copy of the prompts to review the quality of their models.", fr: "Les fournisseurs de modèles reçoivent une copie des invites pour contrôler la qualité de leurs modèles." } }
    - { id: e, text: { en: "Communication with Amazon Bedrock is encrypted in transit with TLS, with TLS 1.2 as the minimum version.", fr: "Les communications avec Amazon Bedrock sont chiffrées en transit avec TLS, avec TLS 1.2 comme version minimale." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "In each Region, Bedrock uses one model deployment account per model provider, owned and operated by the Bedrock service team; providers have no access to these accounts, to Bedrock logs or to customer prompts and completions. Bedrock requires TLS 1.2 and recommends TLS 1.3 for communication with the service."
    fr: "Dans chaque Région, Bedrock utilise un compte de déploiement de modèles par fournisseur, détenu et exploité par l'équipe du service Bedrock ; les fournisseurs n'ont accès ni à ces comptes, ni aux journaux de Bedrock, ni aux invites et complétions des clients. Bedrock exige TLS 1.2 et recommande TLS 1.3 pour communiquer avec le service."
  options:
    a:
      en: "Invocation logging is disabled by default, and its destinations are CloudWatch Logs or Amazon S3 in the customer's own account and Region."
      fr: "La journalisation des invocations est désactivée par défaut, et ses destinations sont CloudWatch Logs ou Amazon S3 dans le propre compte et la propre Région du client."
    b:
      en: "Cross-Region inference traffic stays on the AWS network and is encrypted in transit between Regions."
      fr: "Le trafic de l'inférence entre Régions reste sur le réseau AWS et est chiffré en transit entre les Régions."
    d:
      en: "Inputs and outputs are not shared with model providers."
      fr: "Les entrées et les sorties ne sont pas partagées avec les fournisseurs de modèles."
references:
  - title: "Data protection"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
  - title: "Route model inference requests across AWS Regions with cross-Region inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
