id: aifc01-2a-lifecycle-finetune-labeled
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 5,000 records, each with a prompt and the expected completion, that show how its support answers must be written. The company wants a foundation model on Amazon Bedrock to learn this task.

    Which customization method should the company use?
  fr: |
    Une entreprise dispose de 5 000 enregistrements, chacun avec une invite et la complétion attendue, qui montrent comment ses réponses de support doivent être rédigées. Elle veut qu'un modèle de fondation sur Amazon Bedrock apprenne cette tâche.

    Quelle méthode de personnalisation l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Continued pre-training", fr: "Préentraînement continu (continued pre-training)" } }
    - { id: b, text: { en: "Prompt caching", fr: "Mise en cache des invites (prompt caching)" } }
    - { id: c, text: { en: "Fine-tuning", fr: "Fine-tuning" } }
    - { id: d, text: { en: "Batch inference", fr: "Inférence par lots" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Fine-tuning uses a labeled dataset of prompt and completion pairs to adjust the model's parameters, so that the model learns to produce the expected type of output for each type of input."
    fr: "Le fine-tuning utilise un jeu de données étiqueté de paires invite-complétion pour ajuster les paramètres du modèle, afin qu'il apprenne à produire le type de sortie attendu pour chaque type d'entrée."
  options:
    a:
      en: "Continued pre-training uses unlabeled data to add domain knowledge; it does not use expected completions."
      fr: "Le préentraînement continu utilise des données non étiquetées pour ajouter des connaissances du domaine ; il n'utilise pas de complétions attendues."
    b:
      en: "Prompt caching reuses a repeated prompt prefix to reduce cost and latency; it does not teach the model a task."
      fr: "La mise en cache des invites réutilise un préfixe d'invite répété pour réduire le coût et la latence ; elle n'apprend pas de tâche au modèle."
    d:
      en: "Batch inference runs many prompts asynchronously; it does not change the model."
      fr: "L'inférence par lots exécute de nombreuses invites de façon asynchrone ; elle ne modifie pas le modèle."
references:
  - title: "Prepare data for fine-tuning your models"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
  - title: "Customize your model to improve its performance for your use case"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
