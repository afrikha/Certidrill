id: aifc01-2c-adv-jumpstart-speed
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company's ML team planned to collect data and train a text-generation model from scratch on Amazon SageMaker AI. The team now wants to reduce the time to market of the project by starting from Amazon SageMaker JumpStart.

    How does SageMaker JumpStart help the team reach this goal?
  fr: |
    L'équipe ML d'un laboratoire pharmaceutique prévoyait de collecter des données et d'entraîner à partir de zéro un modèle de génération de texte sur Amazon SageMaker AI. L'équipe veut maintenant réduire le délai de mise sur le marché du projet en partant d'Amazon SageMaker JumpStart.

    Comment SageMaker JumpStart aide-t-il l'équipe à atteindre cet objectif ?
body:
  options:
    - { id: a, text: { en: "It automatically labels the team's training data with human reviewers.", fr: "Il étiquette automatiquement les données d'entraînement de l'équipe avec des réviseurs humains." } }
    - { id: b, text: { en: "It turns the team's notebooks into dashboards for business users.", fr: "Il transforme les notebooks de l'équipe en tableaux de bord pour les utilisateurs métier." } }
    - { id: c, text: { en: "It provides pretrained models that the team can deploy or fine-tune, and solution templates for common use cases.", fr: "Il fournit des modèles préentraînés que l'équipe peut déployer ou affiner, et des modèles de solutions pour des cas d'utilisation courants." } }
    - { id: d, text: { en: "It removes the need to evaluate whether a model's output fits the use case.", fr: "Il supprime la nécessité d'évaluer si les résultats d'un modèle conviennent au cas d'utilisation." } }
answer: { optionId: c }
explanation:
  correct:
    en: "SageMaker JumpStart offers pretrained, publicly available and proprietary models that can be deployed in a few steps or fine-tuned on the team's data, plus solution templates and example notebooks. Starting from a pretrained model avoids the long and costly work of training from scratch."
    fr: "SageMaker JumpStart propose des modèles préentraînés, publics et propriétaires, que l'on peut déployer en quelques étapes ou affiner sur les données de l'équipe, ainsi que des modèles de solutions et des notebooks d'exemple. Partir d'un modèle préentraîné évite le travail long et coûteux d'un entraînement à partir de zéro."
  options:
    a:
      en: "JumpStart does not label data; human labeling was the role of SageMaker Ground Truth, which is closed to new customers."
      fr: "JumpStart n'étiquette pas de données ; l'étiquetage humain était le rôle de SageMaker Ground Truth, fermé aux nouveaux clients."
    b:
      en: "Dashboards for business users are built with Amazon Quick (Quick Sight), not JumpStart."
      fr: "Les tableaux de bord pour les utilisateurs métier se créent avec Amazon Quick (Quick Sight), pas avec JumpStart."
    d:
      en: "Pretrained models still need evaluation; JumpStart even offers evaluation for some models."
      fr: "Les modèles préentraînés doivent toujours être évalués ; JumpStart propose d'ailleurs l'évaluation pour certains modèles."
references:
  - title: "SageMaker JumpStart pretrained models"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html
