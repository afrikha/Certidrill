id: aifc01-2b-adv-multi-customer-service
objective: "2.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A telecommunications company plans to use generative AI for its customer service assistant.

    Which two are advantages of generative AI for this assistant? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un opérateur de télécommunications prévoit d'utiliser l'IA générative pour son assistant de service client.

    Quels sont les deux avantages de l'IA générative pour cet assistant ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It answers customers in natural language at any time of day.", fr: "Il répond aux clients en langage naturel à toute heure." } }
    - { id: b, text: { en: "It guarantees the same answer every time the same question is asked.", fr: "Il garantit la même réponse chaque fois que la même question est posée." } }
    - { id: c, text: { en: "It removes the risk of incorrect answers.", fr: "Il supprime le risque de réponses incorrectes." } }
    - { id: d, text: { en: "It handles many kinds of questions without a separate model for each kind.", fr: "Il traite de nombreux types de questions sans modèle distinct pour chaque type." } }
    - { id: e, text: { en: "It shows exactly which training data produced each answer.", fr: "Il montre précisément quelles données d'entraînement ont produit chaque réponse." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Generative AI assistants converse in natural language and respond immediately at any hour, which improves the customer experience. Because a foundation model is general purpose, the same model handles a broad range of questions without one model per question type."
    fr: "Les assistants d'IA générative dialoguent en langage naturel et répondent immédiatement à toute heure, ce qui améliore l'expérience client. Comme un modèle de fondation est polyvalent, le même modèle traite un large éventail de questions sans un modèle par type de question."
  options:
    b:
      en: "Generative AI is nondeterministic: the same question can produce different answers."
      fr: "L'IA générative est non déterministe : une même question peut produire des réponses différentes."
    c:
      en: "Generative AI can produce inaccurate or misleading answers (hallucinations); the risk must be mitigated, not assumed away."
      fr: "L'IA générative peut produire des réponses inexactes ou trompeuses (hallucinations) ; le risque doit être atténué, pas ignoré."
    e:
      en: "Foundation models are often black boxes; tracing an answer to specific training data is a limitation, not an advantage."
      fr: "Les modèles de fondation sont souvent des boîtes noires ; relier une réponse à des données d'entraînement précises est une limite, pas un avantage."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
