id: aifc01-2c-sec-multi-shared-resp
objective: "2.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An insurance company is building a claims assistant on Amazon Bedrock. The security officer is documenting the split of duties under the AWS shared responsibility model.

    Which two tasks are the responsibility of the insurance company? (Choose two.)
  fr: |
    Une compagnie d'assurance crée un assistant de gestion des sinistres sur Amazon Bedrock. Le responsable de la sécurité documente le partage des tâches selon le modèle de responsabilité partagée AWS.

    Quelles sont les deux tâches qui relèvent de la compagnie d'assurance ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Patch the operating systems of the servers that host the foundation models.", fr: "Corriger les systèmes d'exploitation des serveurs qui hébergent les modèles de fondation." } }
    - { id: b, text: { en: "Write the IAM policies that control which users and roles can invoke the models.", fr: "Rédiger les politiques IAM qui contrôlent quels utilisateurs et rôles peuvent appeler les modèles." } }
    - { id: c, text: { en: "Physically secure the data centers in which Amazon Bedrock runs.", fr: "Assurer la sécurité physique des centres de données dans lesquels Amazon Bedrock s'exécute." } }
    - { id: d, text: { en: "Classify the customer data that the application sends in prompts and protect it.", fr: "Classifier les données clients que l'application envoie dans les invites et les protéger." } }
    - { id: e, text: { en: "Operate the model deployment accounts that isolate each model provider.", fr: "Exploiter les comptes de déploiement de modèles qui isolent chaque fournisseur de modèles." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "AWS is responsible for security of the cloud: the infrastructure that runs Bedrock. The customer is responsible for security in the cloud, which depends on the service and includes the sensitivity of its data, its own requirements and applicable laws. Controlling access with IAM policies and classifying and protecting the data placed in prompts are customer tasks."
    fr: "AWS est responsable de la sécurité du cloud : l'infrastructure qui exécute Bedrock. Le client est responsable de la sécurité dans le cloud, qui dépend du service et inclut la sensibilité de ses données, ses propres exigences et les lois applicables. Contrôler l'accès avec des politiques IAM et classifier et protéger les données placées dans les invites sont des tâches du client."
  options:
    a:
      en: "Bedrock is a managed service: AWS maintains the servers that host the models."
      fr: "Bedrock est un service géré : AWS maintient les serveurs qui hébergent les modèles."
    c:
      en: "Physical security of data centers is part of security of the cloud, an AWS responsibility."
      fr: "La sécurité physique des centres de données fait partie de la sécurité du cloud, une responsabilité d'AWS."
    e:
      en: "Model deployment accounts are owned and operated by the Amazon Bedrock service team."
      fr: "Les comptes de déploiement de modèles appartiennent à l'équipe du service Amazon Bedrock, qui les exploite."
references:
  - title: "Security, Guardrails, and Observability in Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/security.html
  - title: "Data protection"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
