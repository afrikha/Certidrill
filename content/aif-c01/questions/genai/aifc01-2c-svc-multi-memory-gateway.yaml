id: aifc01-2c-svc-multi-memory-gateway
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A hotel chain is building a booking assistant agent on Amazon Bedrock AgentCore. The agent must remember each guest's preferences from one conversation to the next. The agent must also call the chain's existing reservation REST APIs and AWS Lambda functions as Model Context Protocol (MCP) tools.

    Which two AgentCore services should the company use? (Choose two.) Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une chaîne hôtelière crée un agent assistant de réservation sur Amazon Bedrock AgentCore. L'agent doit mémoriser les préférences de chaque client d'une conversation à l'autre. L'agent doit aussi appeler les API REST de réservation existantes de la chaîne et des fonctions AWS Lambda en tant qu'outils MCP (Model Context Protocol).

    Quels sont les deux services AgentCore que l'entreprise doit utiliser ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "AgentCore Code Interpreter" }
    - { id: b, text: "AgentCore Memory" }
    - { id: c, text: "AgentCore Browser" }
    - { id: d, text: "AgentCore Gateway" }
    - { id: e, text: "AgentCore Observability" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "AgentCore Memory provides short-term memory for multi-turn conversations and long-term memory that persists across sessions, so the agent can recall guest preferences. AgentCore Gateway converts existing APIs and Lambda functions into MCP-compatible tools that the agent can call."
    fr: "AgentCore Memory fournit une mémoire à court terme pour les conversations à plusieurs tours et une mémoire à long terme qui persiste entre les sessions, ce qui permet à l'agent de retrouver les préférences des clients. AgentCore Gateway convertit les API et fonctions Lambda existantes en outils compatibles MCP que l'agent peut appeler."
  options:
    a:
      en: "Code Interpreter runs code in an isolated sandbox; it neither stores preferences nor exposes APIs as tools."
      fr: "Code Interpreter exécute du code dans un bac à sable isolé ; il ne stocke pas de préférences et n'expose pas d'API en tant qu'outils."
    c:
      en: "Browser lets the agent navigate websites; the reservation system is reached through APIs, not web pages."
      fr: "Browser permet à l'agent de naviguer sur des sites web ; le système de réservation est accessible par des API, pas par des pages web."
    e:
      en: "Observability traces and monitors agent execution; it does not provide memory or tools."
      fr: "Observability trace et surveille l'exécution de l'agent ; il ne fournit ni mémoire ni outils."
references:
  - title: "Overview - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
