id: aifc01-2a-context-missing-info
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retailer's support agent gives generic answers. It ignores the company's current return policy, and it does not take into account the order that the customer mentioned earlier in the same conversation.

    Which additions to the context of each request will fix these issues? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    L'agent de support d'un détaillant donne des réponses génériques. Il ignore la politique de retour actuelle de l'entreprise et ne tient pas compte de la commande que le client a mentionnée plus tôt dans la même conversation.

    Quels ajouts au contexte de chaque requête corrigeront ces problèmes ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The return policy passages retrieved from a knowledge base for the question", fr: "Les passages de la politique de retour récupérés dans une base de connaissances pour la question" } }
    - { id: b, text: { en: "The full product catalog of 100,000 items in every request", fr: "Le catalogue complet de 100 000 produits dans chaque requête" } }
    - { id: c, text: { en: "The earlier turns of the current conversation", fr: "Les tours précédents de la conversation en cours" } }
    - { id: d, text: { en: "A higher temperature value for more creative answers", fr: "Une valeur de température plus élevée pour des réponses plus créatives" } }
    - { id: e, text: { en: "The return policy that was in force when the model was trained", fr: "La politique de retour en vigueur au moment de l'entraînement du modèle" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Retrieved knowledge and conversation history are two components of the context. RAG adds the relevant, current policy passages to the prompt, and including the earlier turns of the session lets the model use the order that the customer already described."
    fr: "Les connaissances récupérées et l'historique de conversation sont deux composantes du contexte. Le RAG ajoute à l'invite les passages pertinents et actuels de la politique, et l'inclusion des tours précédents de la session permet au modèle d'utiliser la commande que le client a déjà décrite."
  options:
    b:
      en: "Sending the whole catalog overstuffs the context, which raises cost and latency without addressing the policy or the order."
      fr: "Envoyer tout le catalogue surcharge le contexte, ce qui augmente le coût et la latence sans résoudre la question de la politique ni de la commande."
    d:
      en: "Temperature is an inference parameter; it adds no information and makes answers more random."
      fr: "La température est un paramètre d'inférence ; elle n'ajoute aucune information et rend les réponses plus aléatoires."
    e:
      en: "An old policy is not the current one, so the answers would still be wrong."
      fr: "Une ancienne politique n'est pas la politique actuelle : les réponses resteraient fausses."
references:
  - title: "Memory, context, and RAG optimization"
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentperf03.html
  - title: "Inference using Converse API"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
