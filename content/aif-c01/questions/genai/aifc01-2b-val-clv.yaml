id: aifc01-2b-val-clv
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A telecommunications company deploys a generative AI support assistant to improve customer loyalty. Leadership wants to know whether customers now stay longer and spend more over their entire relationship with the company.

    Which metric answers this question?
  fr: |
    Un opérateur de télécommunications déploie un assistant de support d'IA générative pour améliorer la fidélité des clients. La direction veut savoir si les clients restent désormais plus longtemps et dépensent davantage sur toute la durée de leur relation avec l'entreprise.

    Quelle métrique répond à cette question ?
body:
  options:
    - { id: a, text: { en: "Customer lifetime value", fr: "Valeur du cycle de vie du client" } }
    - { id: b, text: { en: "Conversion rate", fr: "Taux de conversion" } }
    - { id: c, text: { en: "Average handle time", fr: "Durée moyenne de traitement" } }
    - { id: d, text: { en: "Hallucination rate", fr: "Taux d'hallucinations" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Customer lifetime value (CLV) estimates the total revenue that a customer brings over the whole relationship. It rises when customers stay longer (lower churn) and spend more, so it captures the long-term business value of better support."
    fr: "La valeur du cycle de vie du client (CLV) estime le revenu total qu'un client apporte sur toute la relation. Elle augmente quand les clients restent plus longtemps (moins d'attrition) et dépensent davantage : elle reflète la valeur métier à long terme d'un meilleur support."
  options:
    b:
      en: "Conversion rate measures the share of users who complete one action, not loyalty over the relationship."
      fr: "Le taux de conversion mesure la part des utilisateurs qui effectuent une action, pas la fidélité sur la durée de la relation."
    c:
      en: "Average handle time measures support efficiency, not how long customers stay or how much they spend."
      fr: "La durée moyenne de traitement mesure l'efficacité du support, pas la durée de fidélité des clients ni leurs dépenses."
    d:
      en: "Hallucination rate is a model quality metric, not a measure of customer value."
      fr: "Le taux d'hallucinations est une métrique de qualité du modèle, pas une mesure de la valeur client."
references:
  - title: "Guidance for Customer Lifetime Value Analytics on AWS"
    url: https://docs.aws.amazon.com/solutions/customer-lifetime-value-analytics-on-aws/
  - title: "MLPERF01-BP01 Determine key performance indicators"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlperf01-bp01.html
