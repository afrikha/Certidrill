id: aifc01-2a-lifecycle-start-from-fm
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup wants a generative AI model for its legal documents. The startup has a small team and a limited budget.

    Which approach is the MOST cost-effective starting point?
  fr: |
    Une start-up veut un modèle d'IA générative pour ses documents juridiques. Elle dispose d'une petite équipe et d'un budget limité.

    Quelle approche est le point de départ le PLUS rentable ?
body:
  options:
    - { id: a, text: { en: "Pre-train a new model from scratch on all of the startup's documents.", fr: "Préentraîner un nouveau modèle à partir de zéro sur tous les documents de la start-up." } }
    - { id: b, text: { en: "Design a new neural network architecture for legal text.", fr: "Concevoir une nouvelle architecture de réseau neuronal pour les textes juridiques." } }
    - { id: c, text: { en: "Select an existing pre-trained FM and adapt it to the use case.", fr: "Sélectionner un FM préentraîné existant et l'adapter au cas d'utilisation." } }
    - { id: d, text: { en: "Label every document by hand before choosing a model.", fr: "Étiqueter chaque document à la main avant de choisir un modèle." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Building a foundation model from scratch is expensive and requires enormous resources. FMs are designed as a starting point: a company selects an existing pre-trained model and adapts it with prompt engineering, RAG or fine-tuning."
    fr: "Créer un modèle de fondation à partir de zéro est coûteux et demande d'énormes ressources. Les FM sont conçus comme un point de départ : une entreprise sélectionne un modèle préentraîné existant et l'adapte par ingénierie des invites, RAG ou fine-tuning."
  options:
    a:
      en: "Pre-training from scratch needs vast data and compute, which a small team with a limited budget cannot afford."
      fr: "Le préentraînement à partir de zéro demande des données et une puissance de calcul considérables, hors de portée d'une petite équipe au budget limité."
    b:
      en: "Designing a new architecture is research work that adds cost and delay; existing transformer-based FMs already handle text."
      fr: "Concevoir une nouvelle architecture est un travail de recherche qui ajoute coût et délai ; les FM existants basés sur des transformateurs traitent déjà le texte."
    d:
      en: "Labeling every document is costly and is not needed to start; many adaptations, such as prompt engineering and RAG, need no labels."
      fr: "Étiqueter chaque document est coûteux et inutile pour démarrer ; de nombreuses adaptations, comme l'ingénierie des invites et le RAG, n'ont besoin d'aucune étiquette."
references:
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
