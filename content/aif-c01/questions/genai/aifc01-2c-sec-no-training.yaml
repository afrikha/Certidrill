id: aifc01-2c-sec-no-training
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A law firm plans to send confidential contract text in prompts to foundation models in Amazon Bedrock. The firm's partners are worried that the contracts will be used to train the models.

    Which statement correctly describes how Amazon Bedrock handles this data?
  fr: |
    Un cabinet d'avocats prévoit d'envoyer le texte de contrats confidentiels dans des invites à des modèles de fondation d'Amazon Bedrock. Les associés du cabinet craignent que les contrats servent à entraîner les modèles.

    Quelle affirmation décrit correctement la façon dont Amazon Bedrock traite ces données ?
body:
  options:
    - { id: a, text: { en: "The firm must opt out in the Bedrock console to stop its prompts from being used for training.", fr: "Le cabinet doit se désinscrire dans la console Bedrock pour empêcher l'utilisation de ses invites pour l'entraînement." } }
    - { id: b, text: { en: "Prompts are used to train Amazon Nova models but not third-party models.", fr: "Les invites servent à entraîner les modèles Amazon Nova mais pas les modèles tiers." } }
    - { id: c, text: { en: "AWS and the model providers do not use Bedrock inputs or outputs to train their models.", fr: "AWS et les fournisseurs de modèles n'utilisent pas les entrées ni les sorties de Bedrock pour entraîner leurs modèles." } }
    - { id: d, text: { en: "Prompts are excluded from training only when a guardrail is attached to each request.", fr: "Les invites sont exclues de l'entraînement uniquement quand une barrière de protection est associée à chaque requête." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock does not use customer inputs or model outputs to train AWS or third-party models, and it does not share them with model providers. No opt-out or extra configuration is needed for this protection."
    fr: "Amazon Bedrock n'utilise pas les entrées des clients ni les sorties des modèles pour entraîner les modèles d'AWS ou des tiers, et il ne les partage pas avec les fournisseurs de modèles. Aucune désinscription ni configuration supplémentaire n'est nécessaire pour cette protection."
  options:
    a:
      en: "There is nothing to opt out of: Bedrock never uses customer inputs or outputs for model training."
      fr: "Il n'y a rien dont se désinscrire : Bedrock n'utilise jamais les entrées ni les sorties des clients pour entraîner des modèles."
    b:
      en: "The protection applies to all models in Bedrock, including Amazon Nova."
      fr: "La protection s'applique à tous les modèles de Bedrock, y compris Amazon Nova."
    d:
      en: "Guardrails filter harmful content; they have no effect on whether data is used for training, which never happens."
      fr: "Les barrières de protection filtrent les contenus préjudiciables ; elles n'ont aucun effet sur l'utilisation des données pour l'entraînement, qui n'a jamais lieu."
references:
  - title: "Amazon Bedrock FAQs"
    url: https://aws.amazon.com/bedrock/faqs/
