id: aifc01-2c-sec-guardrails-safety
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A video game company is launching a player-support chatbot that uses a foundation model in Amazon Bedrock. The chatbot must block hateful and violent content in prompts and responses, and it must mask players' personally identifiable information (PII) in responses.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de jeux vidéo lance un chatbot d'assistance aux joueurs qui utilise un modèle de fondation d'Amazon Bedrock. Le chatbot doit bloquer les contenus haineux et violents dans les invites et les réponses, et il doit masquer les informations d'identification personnelle (PII) des joueurs dans les réponses.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Scan the chatbot's Amazon S3 buckets with Amazon Macie.", fr: "Analyser les compartiments Amazon S3 du chatbot avec Amazon Macie." } }
    - { id: b, text: { en: "Configure a guardrail in Amazon Bedrock Guardrails with content filters and sensitive information filters.", fr: "Configurer une barrière de protection dans Amazon Bedrock Guardrails avec des filtres de contenu et des filtres d'informations sensibles." } }
    - { id: c, text: { en: "Run Amazon Inspector assessments on the chatbot's compute resources.", fr: "Exécuter des évaluations Amazon Inspector sur les ressources de calcul du chatbot." } }
    - { id: d, text: { en: "Attach an IAM policy that denies the bedrock:InvokeModel action to anonymous players.", fr: "Associer une politique IAM qui refuse l'action bedrock:InvokeModel aux joueurs anonymes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Bedrock Guardrails provides configurable safeguards for generative AI applications. Content filters detect and filter harmful content in categories such as hate, insults, sexual content and violence, with a strength set per category, and sensitive information filters block or mask PII in prompts and responses."
    fr: "Amazon Bedrock Guardrails fournit des protections configurables pour les applications d'IA générative. Les filtres de contenu détectent et filtrent les contenus préjudiciables dans des catégories comme la haine, les insultes, le contenu sexuel et la violence, avec une intensité définie par catégorie, et les filtres d'informations sensibles bloquent ou masquent les PII dans les invites et les réponses."
  options:
    a:
      en: "Macie discovers sensitive data stored in Amazon S3; it does not filter chatbot conversations."
      fr: "Macie détecte les données sensibles stockées dans Amazon S3 ; il ne filtre pas les conversations d'un chatbot."
    c:
      en: "Inspector finds software vulnerabilities; it does not inspect model prompts or responses."
      fr: "Inspector détecte des vulnérabilités logicielles ; il n'inspecte pas les invites ni les réponses des modèles."
    d:
      en: "IAM controls who can call the model, not what the prompts and responses contain."
      fr: "IAM contrôle qui peut appeler le modèle, pas ce que contiennent les invites et les réponses."
references:
  - title: "Detect and filter harmful content by using Amazon Bedrock Guardrails"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
