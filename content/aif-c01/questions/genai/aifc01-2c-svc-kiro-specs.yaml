id: aifc01-2c-svc-kiro-specs
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company wants its developers to use an AI-powered development environment. For each new feature, an AI agent must turn a short description into requirements, a design and a list of implementation tasks, and then help write the code.

    Which AWS offering will meet these requirements?
  fr: |
    Un éditeur de logiciels veut que ses développeurs utilisent un environnement de développement basé sur l'IA. Pour chaque nouvelle fonctionnalité, un agent d'IA doit transformer une courte description en exigences, en conception et en liste de tâches d'implémentation, puis aider à écrire le code.

    Quelle offre AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "AWS Transform" }
    - { id: b, text: "Kiro" }
    - { id: c, text: "Strands Agents" }
    - { id: d, text: "Amazon SageMaker JumpStart" }
answer: { optionId: b }
explanation:
  correct:
    en: "Kiro is an AI-powered development environment (IDE, CLI and other surfaces) that takes software from prototype to production. Its specs plan a feature as requirements, design and tasks, which the agent then implements; it replaces Amazon Q Developer in IDEs."
    fr: "Kiro est un environnement de développement basé sur l'IA (IDE, CLI et autres interfaces) qui mène un logiciel du prototype à la production. Ses specs planifient une fonctionnalité sous forme d'exigences, de conception et de tâches, que l'agent implémente ensuite ; il remplace Amazon Q Developer dans les IDE."
  options:
    a:
      en: "AWS Transform uses AI agents to migrate and modernize existing workloads (mainframe, VMware, .NET), not to plan and write new features in an IDE."
      fr: "AWS Transform utilise des agents d'IA pour migrer et moderniser des charges de travail existantes (mainframe, VMware, .NET), pas pour planifier et écrire de nouvelles fonctionnalités dans un IDE."
    c:
      en: "Strands Agents is an open-source SDK for building your own agents; it is not a development environment for developers."
      fr: "Strands Agents est un SDK open source qui permet de créer vos propres agents ; ce n'est pas un environnement de développement pour les développeurs."
    d:
      en: "JumpStart is a hub of pretrained ML models for SageMaker AI; it does not help developers write application code."
      fr: "JumpStart est un hub de modèles de ML préentraînés pour SageMaker AI ; il n'aide pas les développeurs à écrire du code applicatif."
references:
  - title: "Kiro documentation"
    url: https://kiro.dev/docs/
