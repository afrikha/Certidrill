id: aifc01-2a-lifecycle-selection-factors
objective: "2.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is in the model selection phase of a generative AI project.

    Which factors should the company compare between the candidate foundation models? (Choose two.)
  fr: |
    Une entreprise est dans la phase de sélection du modèle d'un projet d'IA générative.

    Quels facteurs l'entreprise doit-elle comparer entre les modèles de fondation candidats ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The input and output modalities that each model supports", fr: "Les modalités d'entrée et de sortie prises en charge par chaque modèle" } }
    - { id: b, text: { en: "The number of IAM users in the company's AWS account", fr: "Le nombre d'utilisateurs IAM dans le compte AWS de l'entreprise" } }
    - { id: c, text: { en: "The S3 storage class of the company's log files", fr: "La classe de stockage S3 des fichiers journaux de l'entreprise" } }
    - { id: d, text: { en: "The price per input and output token of each model", fr: "Le prix par jeton d'entrée et de sortie de chaque modèle" } }
    - { id: e, text: { en: "The number of Availability Zones in the company's VPC", fr: "Le nombre de zones de disponibilité dans le VPC de l'entreprise" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Model selection compares candidate models against the requirements: modality (text, image, video, audio), size, accuracy, context window, inference latency, pricing and data usage policies."
    fr: "La sélection du modèle compare les modèles candidats aux exigences : modalité (texte, image, vidéo, audio), taille, exactitude, fenêtre contextuelle, latence d'inférence, tarification et politiques d'utilisation des données."
  options:
    b:
      en: "The number of IAM users is an account management detail; it does not differ between models."
      fr: "Le nombre d'utilisateurs IAM est un détail de gestion du compte ; il ne varie pas d'un modèle à l'autre."
    c:
      en: "The storage class of log files does not depend on which model is selected."
      fr: "La classe de stockage des fichiers journaux ne dépend pas du modèle sélectionné."
    e:
      en: "The VPC design is unrelated to the capabilities of a foundation model."
      fr: "La conception du VPC n'a aucun rapport avec les capacités d'un modèle de fondation."
references:
  - title: "Generative AI lifecycle"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lifecycle.html
