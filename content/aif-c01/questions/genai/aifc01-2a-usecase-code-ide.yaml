id: aifc01-2a-usecase-code-ide
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company wants its developers to use an AI-powered development environment that generates code from specifications and helps take projects from prototype to production.

    Which AWS offering will meet this requirement?
  fr: |
    Un éditeur de logiciels veut que ses développeurs utilisent un environnement de développement doté d'IA qui génère du code à partir de spécifications et aide à mener les projets du prototype à la production.

    Quelle offre AWS répond à cette exigence ?
body:
  options:
    - { id: a, text: "Amazon Textract" }
    - { id: b, text: "Kiro" }
    - { id: c, text: "Amazon Polly" }
    - { id: d, text: "Amazon Comprehend" }
answer: { optionId: b }
explanation:
  correct:
    en: "Kiro is an AI-powered development environment, available as an IDE and a CLI, that works from specs to build software from prototype to production. Code generation is one of the main generative AI use cases."
    fr: "Kiro est un environnement de développement doté d'IA, disponible en IDE et en CLI, qui s'appuie sur des spécifications pour créer des logiciels du prototype à la production. La génération de code est l'un des principaux cas d'utilisation de l'IA générative."
  options:
    a:
      en: "Amazon Textract extracts text and data from scanned documents."
      fr: "Amazon Textract extrait le texte et les données de documents numérisés."
    c:
      en: "Amazon Polly converts text into lifelike speech."
      fr: "Amazon Polly convertit du texte en parole naturelle."
    d:
      en: "Amazon Comprehend analyzes text, for example to detect sentiment or entities; it does not generate code."
      fr: "Amazon Comprehend analyse du texte, par exemple pour détecter le sentiment ou les entités ; il ne génère pas de code."
references:
  - title: "Kiro Documentation"
    url: https://kiro.dev/docs/
