id: aifc01-2b-sel-multi-capabilities
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company is selecting a foundation model for its support assistant. The assistant must answer customers in Japanese, and it must read the screenshots of booking errors that customers upload.

    Which two capabilities must the selected model have? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une agence de voyages choisit un modèle de fondation pour son assistant de support. L'assistant doit répondre aux clients en japonais et lire les captures d'écran des erreurs de réservation que les clients téléversent.

    Quelles sont les deux capacités que le modèle choisi doit posséder ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Support for Japanese input and output", fr: "La prise en charge du japonais en entrée et en sortie" } }
    - { id: b, text: { en: "Image generation as output", fr: "La génération d'images en sortie" } }
    - { id: c, text: { en: "Image input", fr: "Les images en entrée" } }
    - { id: d, text: { en: "Embeddings as output", fr: "Les vectorisations en sortie" } }
    - { id: e, text: { en: "Speech as output", fr: "La parole en sortie" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Model capabilities must match the requirements: the model must understand and generate Japanese (multilingual support), and it must accept images as input (multimodal input) to read the screenshots. The output is text in both cases."
    fr: "Les capacités du modèle doivent correspondre aux exigences : le modèle doit comprendre et générer le japonais (prise en charge multilingue) et accepter des images en entrée (entrée multimodale) pour lire les captures d'écran. Dans les deux cas, la sortie est du texte."
  options:
    b:
      en: "The assistant reads images; it does not need to create them."
      fr: "L'assistant lit des images ; il n'a pas besoin d'en créer."
    d:
      en: "Embeddings are vectors used for search; the assistant must produce text answers."
      fr: "Les vectorisations sont des vecteurs utilisés pour la recherche ; l'assistant doit produire des réponses textuelles."
    e:
      en: "Nothing in the requirements asks for spoken answers."
      fr: "Rien dans les exigences ne demande des réponses orales."
references:
  - title: "What is Amazon Nova?"
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
