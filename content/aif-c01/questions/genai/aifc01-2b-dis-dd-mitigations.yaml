id: aifc01-2b-dis-dd-mitigations
objective: "2.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A healthcare provider pilots a generative AI assistant and finds three problems.

    Match each problem to the action that BEST addresses it. To answer, drag the appropriate action to each problem. Each action may be used once or not at all.
  fr: |
    Un prestataire de santé teste un assistant d'IA générative et constate trois problèmes.

    Associez chaque problème à l'action qui le traite le MIEUX. Pour répondre, faites glisser l'action appropriée vers chaque problème. Chaque action peut être utilisée une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: lowtemp, text: { en: "Lower the temperature.", fr: "Baisser la température." } }
    - { id: rag, text: { en: "Retrieve current documents at request time and add them to the prompt.", fr: "Récupérer des documents à jour au moment de la requête et les ajouter à l'invite." } }
    - { id: human, text: { en: "Have a qualified employee review the output before it is used.", fr: "Faire relire la sortie par un employé qualifié avant son utilisation." } }
    - { id: maxtok, text: { en: "Increase the maximum output length.", fr: "Augmenter la longueur maximale de sortie." } }
    - { id: bigctx, text: { en: "Switch to a model with a larger context window.", fr: "Passer à un modèle doté d'une fenêtre contextuelle plus large." } }
  targets:
    - { id: t1, text: { en: "Answers to the same question vary in content from one run to the next.", fr: "Les réponses à une même question varient d'une exécution à l'autre." } }
    - { id: t2, text: { en: "Answers miss clinic procedures that were published after the model was trained.", fr: "Les réponses ignorent des procédures de la clinique publiées après l'entraînement du modèle." } }
    - { id: t3, text: { en: "An incorrect statement in a letter to a patient could cause harm.", fr: "Une affirmation incorrecte dans un courrier adressé à un patient pourrait causer un préjudice." } }
answer:
  mapping: { t1: lowtemp, t2: rag, t3: human }
explanation:
  correct:
    en: "A lower temperature favors the most probable tokens and makes responses more deterministic. Retrieval Augmented Generation (RAG) supplies documents published after training so that answers are grounded in current information. Human oversight lets qualified experts review and validate critical outputs before they reach a patient."
    fr: "Une température plus basse favorise les jetons les plus probables et rend les réponses plus déterministes. La génération à enrichissement contextuel (RAG) fournit des documents publiés après l'entraînement afin d'ancrer les réponses dans des informations à jour. La supervision humaine permet à des experts qualifiés de relire et valider les sorties critiques avant qu'elles n'atteignent un patient."
  options:
    maxtok:
      en: "A longer output does not make answers consistent, current, or correct."
      fr: "Une sortie plus longue ne rend les réponses ni constantes, ni à jour, ni correctes."
    bigctx:
      en: "A larger context window lets the model read more input, but it does not add the new procedures unless they are retrieved and supplied."
      fr: "Une fenêtre contextuelle plus large permet au modèle de lire davantage d'entrées, mais elle n'ajoute pas les nouvelles procédures si elles ne sont pas récupérées et fournies."
references:
  - title: "Influence response generation with inference parameters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
