id: aifc01-2a-tokens-prompt-trim
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company sends each customer's profile to an Amazon Bedrock model with long, verbose instructions that the company rewrites for every customer. No part of the prompt is repeated between requests. Most of the cost comes from input tokens.

    Which action will reduce the cost of each request?
  fr: |
    Une entreprise envoie le profil de chaque client à un modèle Amazon Bedrock avec des instructions longues et verbeuses qu'elle réécrit pour chaque client. Aucune partie de l'invite ne se répète d'une requête à l'autre. L'essentiel du coût vient des jetons d'entrée.

    Quelle action réduira le coût de chaque requête ?
body:
  options:
    - { id: a, text: { en: "Enable prompt caching with a checkpoint after the instructions of each request.", fr: "Activer la mise en cache des invites avec un point de contrôle après les instructions de chaque requête." } }
    - { id: b, text: { en: "Rewrite the instructions to remove unnecessary words while keeping the results.", fr: "Réécrire les instructions pour supprimer les mots inutiles tout en conservant les résultats." } }
    - { id: c, text: { en: "Raise the maximum response length of the model for each customer.", fr: "Augmenter la longueur maximale de réponse du modèle pour chaque client." } }
    - { id: d, text: { en: "Send each request to the Priority service tier of the model.", fr: "Envoyer chaque requête au niveau de service Priority du modèle." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With pay-per-token pricing, every input token is billed, so reducing prompt length reduces the cost of processing the prompt. The prompt should be as short as possible while meeting the performance requirements, which the company verifies by testing."
    fr: "Avec une tarification au jeton, chaque jeton d'entrée est facturé : réduire la longueur de l'invite réduit le coût de son traitement. L'invite doit être aussi courte que possible tout en répondant aux exigences de performance, ce que l'entreprise vérifie par des tests."
  options:
    a:
      en: "Prompt caching saves cost only when a prompt prefix repeats between requests; here no part of the prompt repeats."
      fr: "La mise en cache des invites ne fait économiser que lorsqu'un préfixe d'invite se répète entre les requêtes ; ici, aucune partie de l'invite ne se répète."
    c:
      en: "A higher response length limit allows more output tokens and can increase the cost."
      fr: "Une limite de longueur de réponse plus élevée autorise davantage de jetons de sortie et peut augmenter le coût."
    d:
      en: "The Priority tier gives faster responses at a price premium, so it increases the cost."
      fr: "Le niveau Priority donne des réponses plus rapides moyennant un supplément de prix : il augmente le coût."
references:
  - title: "GENCOST03-BP01 Optimize prompt token length"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost03-bp01.html
