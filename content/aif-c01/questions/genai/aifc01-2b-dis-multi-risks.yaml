id: aifc01-2b-dis-multi-risks
objective: "2.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A hotel chain is about to launch a generative AI chatbot for guests.

    Which two risks of generative AI should the company plan for? (Choose two.)
  fr: |
    Une chaîne hôtelière s'apprête à lancer un chatbot d'IA générative pour ses clients.

    Quels sont les deux risques de l'IA générative que l'entreprise doit anticiper ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The chatbot cannot understand questions written in everyday language.", fr: "Le chatbot ne peut pas comprendre les questions rédigées en langage courant." } }
    - { id: b, text: { en: "The chatbot can produce fluent answers that are factually incorrect.", fr: "Le chatbot peut produire des réponses fluides mais factuellement incorrectes." } }
    - { id: c, text: { en: "The chatbot needs a separately trained model for every question.", fr: "Le chatbot a besoin d'un modèle entraîné séparément pour chaque question." } }
    - { id: d, text: { en: "The chatbot can answer only questions that appear word for word in its training data.", fr: "Le chatbot ne peut répondre qu'aux questions qui figurent mot pour mot dans ses données d'entraînement." } }
    - { id: e, text: { en: "The chatbot can give different answers to the same question.", fr: "Le chatbot peut donner des réponses différentes à une même question." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Generative AI can hallucinate, producing outputs that sound plausible but are factually incorrect. It is also nondeterministic: because each token is sampled from a probability distribution, the same question can receive different answers."
    fr: "L'IA générative peut halluciner, en produisant des sorties plausibles mais factuellement incorrectes. Elle est aussi non déterministe : comme chaque jeton est échantillonné dans une distribution de probabilités, une même question peut recevoir des réponses différentes."
  options:
    a:
      en: "Understanding natural language is a strength of generative AI, not a risk."
      fr: "La compréhension du langage naturel est un point fort de l'IA générative, pas un risque."
    c:
      en: "One foundation model handles many kinds of questions; no per-question model is needed."
      fr: "Un seul modèle de fondation traite de nombreux types de questions ; aucun modèle par question n'est nécessaire."
    d:
      en: "Generative models generalize to new questions; they are not limited to questions seen verbatim in training."
      fr: "Les modèles génératifs généralisent à de nouvelles questions ; ils ne se limitent pas aux questions vues mot pour mot pendant l'entraînement."
references:
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
  - title: "Influence response generation with inference parameters"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
