id: aifc01-2c-cost-multi-token-factors
objective: "2.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company uses Amazon Bedrock on-demand inference in one AWS Region for a document summarization application. The finance team wants to understand what drives the cost of each request.

    Which three factors directly affect the cost of an on-demand request? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise l'inférence à la demande d'Amazon Bedrock dans une Région AWS pour une application de résumé de documents. L'équipe financière veut comprendre ce qui détermine le coût de chaque requête.

    Quels sont les trois facteurs qui influent directement sur le coût d'une requête à la demande ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "The number of input tokens in the prompt", fr: "Le nombre de jetons d'entrée de l'invite" } }
    - { id: b, text: { en: "The number of IAM users in the account", fr: "Le nombre d'utilisateurs IAM du compte" } }
    - { id: c, text: { en: "The foundation model that processes the request", fr: "Le modèle de fondation qui traite la requête" } }
    - { id: d, text: { en: "The number of model units purchased", fr: "Le nombre d'unités de modèle achetées" } }
    - { id: e, text: { en: "The number of output tokens that the model generates", fr: "Le nombre de jetons de sortie que le modèle génère" } }
    - { id: f, text: { en: "The time the application stays idle between requests", fr: "Le temps pendant lequel l'application reste inactive entre les requêtes" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: "On-demand inference in Bedrock is billed per input token and per output token, at rates that vary by model, provider and Region. Longer prompts, longer responses and more capable models therefore increase the cost of a request."
    fr: "L'inférence à la demande de Bedrock est facturée par jeton d'entrée et par jeton de sortie, à des tarifs qui varient selon le modèle, le fournisseur et la Région. Des invites plus longues, des réponses plus longues et des modèles plus performants augmentent donc le coût d'une requête."
  options:
    b:
      en: "IAM users have no charge and do not affect token billing."
      fr: "Les utilisateurs IAM sont gratuits et n'influent pas sur la facturation des jetons."
    d:
      en: "Model units are purchased with Provisioned Throughput, not with on-demand inference."
      fr: "Les unités de modèle s'achètent avec Provisioned Throughput, pas avec l'inférence à la demande."
    f:
      en: "On-demand inference is serverless: nothing is billed while no requests are sent."
      fr: "L'inférence à la demande est sans serveur : rien n'est facturé tant qu'aucune requête n'est envoyée."
references:
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
