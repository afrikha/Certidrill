id: aifc01-2b-adv-multilingual
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A global retailer supports customers in 12 languages. It wants one assistant that understands each customer's question and answers in the customer's own language. The company wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Un détaillant international accompagne ses clients dans 12 langues. Il veut un seul assistant qui comprenne la question de chaque client et réponde dans la langue du client. L'entreprise veut le MOINS d'effort de développement possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Build a separate rules-based chatbot for each of the 12 languages.", fr: "Créer un chatbot à base de règles distinct pour chacune des 12 langues." } }
    - { id: b, text: { en: "Train a separate intent classification model for each language.", fr: "Entraîner un modèle de classification d'intentions distinct pour chaque langue." } }
    - { id: c, text: { en: "Translate every question into English and send all answers in English.", fr: "Traduire chaque question en anglais et envoyer toutes les réponses en anglais." } }
    - { id: d, text: { en: "Use one multilingual foundation model that answers in the language of each question.", fr: "Utiliser un seul modèle de fondation multilingue qui répond dans la langue de chaque question." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Large language models are flexible: one model can answer questions, summarize, and translate. A multilingual foundation model understands questions in many languages and generates answers in the same language, so one assistant serves all 12 languages without building a system per language."
    fr: "Les grands modèles de langage sont polyvalents : un même modèle peut répondre à des questions, résumer et traduire. Un modèle de fondation multilingue comprend les questions dans de nombreuses langues et génère les réponses dans la même langue : un seul assistant couvre les 12 langues sans créer un système par langue."
  options:
    a:
      en: "Twelve rules-based chatbots multiply development and maintenance effort."
      fr: "Douze chatbots à base de règles multiplient l'effort de développement et de maintenance."
    b:
      en: "Twelve classifiers need labeled data and training for each language, and a classifier does not generate answers."
      fr: "Douze classifieurs demandent des données étiquetées et un entraînement pour chaque langue, et un classifieur ne génère pas de réponses."
    c:
      en: "Answering only in English fails the requirement to answer in the customer's own language."
      fr: "Répondre uniquement en anglais ne respecte pas l'exigence de répondre dans la langue du client."
references:
  - title: "What is LLM? - Large Language Models Explained"
    url: https://aws.amazon.com/what-is/large-language-model/
