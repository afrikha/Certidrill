id: aifc01-2b-sel-speech-to-speech
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A restaurant chain wants a phone assistant that takes orders in a natural, real-time spoken conversation. Callers must be able to interrupt the assistant in the middle of a sentence without the assistant losing the context of the order. The chain wants the LEAST response latency.

    Which solution will meet these requirements?
  fr: |
    Une chaîne de restaurants veut un assistant téléphonique qui prend les commandes dans une conversation orale naturelle et en temps réel. Les appelants doivent pouvoir interrompre l'assistant au milieu d'une phrase sans que l'assistant perde le contexte de la commande. La chaîne veut la latence de réponse la plus FAIBLE possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Transcribe each complete utterance with Amazon Transcribe, send the text to a text model, and read the answer with Amazon Polly.", fr: "Transcrire chaque énoncé complet avec Amazon Transcribe, envoyer le texte à un modèle de texte et lire la réponse avec Amazon Polly." } }
    - { id: b, text: { en: "Use a speech-to-speech foundation model, such as Amazon Nova Sonic, with bidirectional audio streaming.", fr: "Utiliser un modèle de fondation parole-parole, comme Amazon Nova Sonic, avec un streaming audio bidirectionnel." } }
    - { id: c, text: { en: "Use a text-only model with the largest available context window.", fr: "Utiliser un modèle texte uniquement doté de la plus grande fenêtre de contexte disponible." } }
    - { id: d, text: { en: "Record each call and process the recordings with batch inference after the call ends.", fr: "Enregistrer chaque appel et traiter les enregistrements par inférence par lots après la fin de l'appel." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A speech-to-speech model such as Amazon Nova Sonic unifies speech understanding and generation. Over a bidirectional stream, it processes speech as it occurs, responds without waiting for complete utterances, and handles user interruptions without dropping the conversational context, which gives low-latency, natural conversations."
    fr: "Un modèle parole-parole comme Amazon Nova Sonic unifie la compréhension et la génération de la parole. Sur un flux bidirectionnel, il traite la parole au fur et à mesure, répond sans attendre la fin des énoncés et gère les interruptions de l'utilisateur sans perdre le contexte de la conversation, ce qui offre des conversations naturelles à faible latence."
  options:
    a:
      en: "A pipeline of separate services can work, but waiting for each complete utterance and chaining three stages adds latency, and the pipeline does not handle interruptions natively."
      fr: "Une chaîne de services distincts peut fonctionner, mais attendre chaque énoncé complet et enchaîner trois étapes ajoute de la latence, et cette chaîne ne gère pas nativement les interruptions."
    c:
      en: "A text-only model cannot take audio input or produce speech."
      fr: "Un modèle texte uniquement ne peut ni recevoir d'audio en entrée ni produire de la parole."
    d:
      en: "Batch inference after the call cannot hold a live conversation."
      fr: "L'inférence par lots après l'appel ne permet pas de tenir une conversation en direct."
references:
  - title: "Using the Amazon Nova Sonic Speech-to-Speech model"
    url: https://docs.aws.amazon.com/nova/latest/userguide/speech.html
