id: aifc01-2a-lifecycle-order-pretrain
objective: "2.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A research lab is building its own foundation model (FM) from scratch. The lab must complete three steps before it evaluates the model.

    Select the correct steps from the following list and put them in the correct order. Each step should be selected one time or not at all. (Select and order THREE.)
  fr: |
    Un laboratoire de recherche crée son propre modèle de fondation (FM) à partir de zéro. Le laboratoire doit effectuer trois étapes avant d'évaluer le modèle.

    Sélectionnez les étapes correctes dans la liste suivante et placez-les dans le bon ordre. Chaque étape doit être sélectionnée une fois ou pas du tout. (Sélectionnez et classez-en TROIS.)
body:
  count: 3
  actions:
    - { id: tune, text: { en: "Fine-tune the model with labeled instruction-response pairs.", fr: "Peaufiner le modèle avec des paires instruction-réponse étiquetées." } }
    - { id: feedback, text: { en: "Collect ratings of the responses from production users.", fr: "Recueillir les évaluations des réponses par les utilisateurs en production." } }
    - { id: data, text: { en: "Select and curate a large, diverse corpus of training data.", fr: "Sélectionner et organiser un corpus de données d'entraînement vaste et diversifié." } }
    - { id: deploy, text: { en: "Deploy the model to an inference endpoint.", fr: "Déployer le modèle sur un point de terminaison d'inférence." } }
    - { id: pretrain, text: { en: "Pre-train the model on the corpus with self-supervised learning.", fr: "Préentraîner le modèle sur le corpus par apprentissage autosupervisé." } }
answer:
  sequence: [ data, pretrain, tune ]
explanation:
  correct:
    en: "Data selection comes first: pre-training needs a large, diverse, curated corpus. Pre-training then teaches the model general patterns from that unlabeled data with self-supervised learning, such as predicting the next token. Fine-tuning with labeled instruction-response pairs adapts the pre-trained model to follow instructions before it is evaluated."
    fr: "La sélection des données vient en premier : le préentraînement a besoin d'un corpus vaste, diversifié et organisé. Le préentraînement apprend ensuite au modèle des schémas généraux à partir de ces données non étiquetées par apprentissage autosupervisé, par exemple en prédisant le jeton suivant. Le fine-tuning avec des paires instruction-réponse étiquetées adapte ensuite le modèle préentraîné à suivre des instructions, avant son évaluation."
  options:
    deploy:
      en: "Deployment follows evaluation; the stem asks only for the steps before evaluation."
      fr: "Le déploiement suit l'évaluation ; l'énoncé ne demande que les étapes antérieures à l'évaluation."
    feedback:
      en: "User feedback is collected after deployment, in the feedback phase of the lifecycle."
      fr: "Les commentaires des utilisateurs sont recueillis après le déploiement, dans la phase de commentaires du cycle de vie."
references:
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
  - title: "Generative AI lifecycle"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lifecycle.html
