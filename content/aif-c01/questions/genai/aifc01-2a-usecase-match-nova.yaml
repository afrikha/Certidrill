id: aifc01-2a-usecase-match-nova
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    A media company plans four generative AI features on Amazon Bedrock.

    Select the correct Amazon Nova model from the following list for each feature. Each model should be selected one time or not at all. (Select FOUR.)
  fr: |
    Une entreprise de médias prévoit quatre fonctionnalités d'IA générative sur Amazon Bedrock.

    Sélectionnez dans la liste suivante le modèle Amazon Nova correct pour chaque fonctionnalité. Chaque modèle doit être sélectionné une fois ou pas du tout. (Sélectionnez-en QUATRE.)
body:
  reuse: false
  items:
    - { id: canvas, text: "Amazon Nova Canvas" }
    - { id: reel, text: "Amazon Nova Reel" }
    - { id: sonic, text: "Amazon Nova 2 Sonic" }
    - { id: emb, text: "Amazon Nova Multimodal Embeddings" }
    - { id: micro, text: "Amazon Nova Micro" }
  targets:
    - { id: t1, text: { en: "Generate a poster image from a text description", fr: "Générer l'image d'une affiche à partir d'une description textuelle" } }
    - { id: t2, text: { en: "Generate a short video trailer from a text prompt", fr: "Générer une courte bande-annonce vidéo à partir d'une invite textuelle" } }
    - { id: t3, text: { en: "Hold real-time spoken conversations with listeners", fr: "Tenir des conversations orales en temps réel avec les auditeurs" } }
    - { id: t4, text: { en: "Find archive photos and clips that match a text query", fr: "Trouver des photos et des clips d'archives qui correspondent à une requête textuelle" } }
answer:
  mapping: { t1: canvas, t2: reel, t3: sonic, t4: emb }
explanation:
  correct:
    en: "Amazon Nova Canvas generates and edits images from text and image inputs. Amazon Nova Reel generates videos from text and image prompts. Amazon Nova 2 Sonic is a speech-to-speech model for real-time voice conversations. Amazon Nova Multimodal Embeddings maps text, images, video and audio into one vector space, which enables a text query to retrieve photos and clips."
    fr: "Amazon Nova Canvas génère et modifie des images à partir d'entrées texte et image. Amazon Nova Reel génère des vidéos à partir d'invites texte et image. Amazon Nova 2 Sonic est un modèle parole-parole pour les conversations vocales en temps réel. Amazon Nova Multimodal Embeddings projette le texte, les images, la vidéo et l'audio dans un même espace vectoriel, ce qui permet à une requête textuelle de retrouver des photos et des clips."
  options:
    micro:
      en: "Amazon Nova Micro accepts only text and generates only text."
      fr: "Amazon Nova Micro n'accepte que du texte et ne génère que du texte."
references:
  - title: "What is Amazon Nova?"
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
  - title: "What is Amazon Nova 2?"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html
