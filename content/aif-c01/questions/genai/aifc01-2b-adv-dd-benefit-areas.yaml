id: aifc01-2b-adv-dd-benefit-areas
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company lists the generative AI projects that it plans for next year.

    Match each project to the business benefit that it provides. To answer, drag the appropriate benefit to each project. Each benefit may be used once or not at all.
  fr: |
    Une entreprise pharmaceutique liste les projets d'IA générative qu'elle prévoit pour l'année prochaine.

    Associez chaque projet à l'avantage métier qu'il apporte. Pour répondre, faites glisser l'avantage approprié vers chaque projet. Chaque avantage peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: cx, text: { en: "Enhance the customer experience", fr: "Améliorer l'expérience client" } }
    - { id: prod, text: { en: "Boost employee productivity", fr: "Accroître la productivité des employés" } }
    - { id: proc, text: { en: "Optimize business processes", fr: "Optimiser les processus métier" } }
    - { id: res, text: { en: "Accelerate research", fr: "Accélérer la recherche" } }
    - { id: comp, text: { en: "Guarantee regulatory compliance", fr: "Garantir la conformité réglementaire" } }
  targets:
    - { id: t1, text: { en: "A virtual assistant resolves pharmacists' order questions on first contact.", fr: "Un assistant virtuel résout dès le premier contact les questions des pharmaciens sur leurs commandes." } }
    - { id: t2, text: { en: "Employees get first drafts of reports and code suggestions.", fr: "Les employés obtiennent des premiers jets de rapports et des suggestions de code." } }
    - { id: t3, text: { en: "Data is extracted from supplier invoices and summarized automatically for the finance team.", fr: "Les données des factures fournisseurs sont extraites et résumées automatiquement pour l'équipe financière." } }
    - { id: t4, text: { en: "Scientists find patterns in complex data and brainstorm new drug candidates.", fr: "Les chercheurs repèrent des schémas dans des données complexes et imaginent de nouveaux candidats médicaments." } }
answer:
  mapping: { t1: cx, t2: prod, t3: proc, t4: res }
explanation:
  correct:
    en: "Assistants that resolve questions on first contact enhance the customer experience. Drafts and code suggestions boost employee productivity. Extracting and summarizing invoice data optimizes a business process. Finding patterns in complex data and brainstorming candidates accelerates research, as in drug discovery."
    fr: "Les assistants qui résolvent les questions dès le premier contact améliorent l'expérience client. Les premiers jets et les suggestions de code accroissent la productivité des employés. Extraire et résumer les données des factures optimise un processus métier. Repérer des schémas dans des données complexes et imaginer des candidats accélère la recherche, comme pour la découverte de médicaments."
  options:
    comp:
      en: "Generative AI does not guarantee compliance; its outputs can be inaccurate and must be governed."
      fr: "L'IA générative ne garantit pas la conformité ; ses sorties peuvent être inexactes et doivent être encadrées."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
