id: aifc01-2a-concepts-vector-store
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company converts thousands of support articles into embeddings. When a user asks a question, the application must find the articles whose embeddings are closest to the embedding of the question.

    Where should the company store the embeddings?
  fr: |
    Une entreprise convertit des milliers d'articles de support en embeddings. Quand un utilisateur pose une question, l'application doit trouver les articles dont les embeddings sont les plus proches de l'embedding de la question.

    Où l'entreprise doit-elle stocker les embeddings ?
body:
  options:
    - { id: a, text: { en: "In the context window of the FM", fr: "Dans la fenêtre de contexte du FM" } }
    - { id: b, text: { en: "In the hyperparameters of the FM", fr: "Dans les hyperparamètres du FM" } }
    - { id: c, text: { en: "In a prompt template", fr: "Dans un modèle d'invite" } }
    - { id: d, text: { en: "In a vector database", fr: "Dans une base de données vectorielle" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Embeddings are written to a vector index (a vector database) that keeps a mapping to the original content. At query time, the question is converted into a vector and the index returns the stored vectors that are most similar to it."
    fr: "Les embeddings sont écrits dans un index vectoriel (une base de données vectorielle) qui conserve le lien avec le contenu d'origine. Au moment de la requête, la question est convertie en vecteur et l'index renvoie les vecteurs stockés qui lui sont le plus similaires."
  options:
    a:
      en: "The context window is the amount of input that the model can process in one request; it does not store or search data between requests."
      fr: "La fenêtre de contexte est la quantité d'entrée que le modèle peut traiter en une requête ; elle ne stocke ni ne recherche de données entre les requêtes."
    b:
      en: "Hyperparameters control a training process; they do not hold application data."
      fr: "Les hyperparamètres contrôlent un processus d'entraînement ; ils ne contiennent pas de données d'application."
    c:
      en: "A prompt template is a reusable prompt with placeholders; it cannot run a similarity search."
      fr: "Un modèle d'invite est une invite réutilisable avec des espaces réservés ; il ne peut pas exécuter de recherche de similarité."
references:
  - title: "How Amazon Bedrock knowledge bases work"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
