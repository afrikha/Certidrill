id: aifc01-2a-concepts-chunking-hierarchical
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an Amazon Bedrock knowledge base for its technical manuals. Retrieval must match a query against small, precise passages. However, the FM must receive the broader section around each matched passage to answer correctly.

    Which chunking strategy will meet these requirements?
  fr: |
    Une entreprise utilise une base de connaissances Amazon Bedrock pour ses manuels techniques. La récupération doit comparer la requête à des passages courts et précis. Le FM doit cependant recevoir la section plus large qui entoure chaque passage trouvé pour répondre correctement.

    Quelle stratégie de découpage répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Fixed-size chunking with a high overlap percentage", fr: "Découpage de taille fixe avec un pourcentage de chevauchement élevé" } }
    - { id: b, text: { en: "Hierarchical chunking", fr: "Découpage hiérarchique" } }
    - { id: c, text: { en: "Semantic chunking", fr: "Découpage sémantique" } }
    - { id: d, text: { en: "No chunking", fr: "Aucun découpage" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Hierarchical chunking creates nested parent and child chunks. At retrieval time, the small child chunks are matched against the query and then replaced by their broader parent chunks, so the model receives the surrounding section."
    fr: "Le découpage hiérarchique crée des fragments parents et des fragments enfants imbriqués. Lors de la récupération, les petits fragments enfants sont comparés à la requête, puis remplacés par leurs fragments parents plus larges : le modèle reçoit ainsi la section qui les entoure."
  options:
    a:
      en: "Overlap repeats a few tokens between consecutive chunks; the chunk returned is still the matched chunk, not a broader section."
      fr: "Le chevauchement répète quelques jetons entre fragments consécutifs ; le fragment renvoyé reste le fragment trouvé, pas une section plus large."
    c:
      en: "Semantic chunking places boundaries according to meaning, but it returns the matched chunk itself, with no parent level."
      fr: "Le découpage sémantique place les limites selon le sens, mais il renvoie le fragment trouvé lui-même, sans niveau parent."
    d:
      en: "With no chunking, each document is a single chunk, so retrieval cannot match small, precise passages."
      fr: "Sans découpage, chaque document forme un seul fragment : la récupération ne peut pas comparer de passages courts et précis."
references:
  - title: "How content chunking works for knowledge bases"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
