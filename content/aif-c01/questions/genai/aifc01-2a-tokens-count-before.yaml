id: aifc01-2a-tokens-count-before
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer wants to know how many input tokens a prompt will use on a specific Amazon Bedrock model before the application sends it, to estimate the cost. The developer does not want to pay for this check.

    What should the developer use?
  fr: |
    Un développeur veut savoir combien de jetons d'entrée une invite utilisera sur un modèle Amazon Bedrock précis avant que l'application ne l'envoie, afin d'estimer le coût. Le développeur ne veut pas payer pour cette vérification.

    Que doit utiliser le développeur ?
body:
  options:
    - { id: a, text: { en: "The Amazon Bedrock CountTokens API", fr: "L'API CountTokens d'Amazon Bedrock" } }
    - { id: b, text: { en: "The Amazon CloudWatch metrics of the model invocations", fr: "Les métriques Amazon CloudWatch des invocations du modèle" } }
    - { id: c, text: { en: "AWS Cost Explorer", fr: "AWS Cost Explorer" } }
    - { id: d, text: { en: "An Amazon Bedrock batch inference job", fr: "Une tâche d'inférence par lots Amazon Bedrock" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The CountTokens API returns the number of input tokens that a request would use on a given model, without running inference and at no charge. The count matches the tokens that would be billed, so it helps estimate costs and keep prompts within token limits."
    fr: "L'API CountTokens renvoie le nombre de jetons d'entrée qu'une requête utiliserait sur un modèle donné, sans exécuter d'inférence et sans frais. Ce nombre correspond aux jetons qui seraient facturés : il aide à estimer les coûts et à garder les invites dans les limites de jetons."
  options:
    b:
      en: "CloudWatch metrics report tokens after the invocations have run and been billed."
      fr: "Les métriques CloudWatch indiquent les jetons après l'exécution et la facturation des invocations."
    c:
      en: "Cost Explorer analyzes costs that have already been incurred; it does not count the tokens of a prompt."
      fr: "Cost Explorer analyse des coûts déjà engagés ; il ne compte pas les jetons d'une invite."
    d:
      en: "A batch inference job runs inference and is billed for the tokens it processes."
      fr: "Une tâche d'inférence par lots exécute l'inférence et est facturée pour les jetons traités."
references:
  - title: "Monitor your token usage by counting tokens before running inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html
