id: aifc01-2a-lifecycle-order-adapt
objective: "2.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An insurance company will build a claims assistant on an existing foundation model (FM). The company will customize the FM with 10,000 labeled examples of claim questions and approved answers. The company will not train a model from scratch.

    Select the correct steps from the following list and put them in the order of the FM lifecycle. Each step should be selected one time or not at all. (Select and order FOUR.)
  fr: |
    Une compagnie d'assurance va créer un assistant de sinistres sur un modèle de fondation (FM) existant. Elle va personnaliser le FM avec 10 000 exemples étiquetés de questions sur les sinistres et de réponses approuvées. Elle n'entraînera pas de modèle à partir de zéro.

    Sélectionnez les étapes correctes dans la liste suivante et placez-les dans l'ordre du cycle de vie du FM. Chaque étape doit être sélectionnée une fois ou pas du tout. (Sélectionnez et classez-en QUATRE.)
body:
  count: 4
  actions:
    - { id: eval, text: { en: "Evaluate the customized model against test prompts and metrics.", fr: "Évaluer le modèle personnalisé sur des invites de test et des métriques." } }
    - { id: pretrain, text: { en: "Pre-train a new model on a large corpus of unlabeled text.", fr: "Préentraîner un nouveau modèle sur un vaste corpus de texte non étiqueté." } }
    - { id: select, text: { en: "Select a pre-trained FM that fits the use case.", fr: "Sélectionner un FM préentraîné adapté au cas d'utilisation." } }
    - { id: deploy, text: { en: "Deploy the model and collect feedback from users.", fr: "Déployer le modèle et recueillir les commentaires des utilisateurs." } }
    - { id: tune, text: { en: "Fine-tune the FM with the labeled examples.", fr: "Peaufiner le FM avec les exemples étiquetés." } }
    - { id: delete, text: { en: "Delete the labeled examples so that they cannot leak.", fr: "Supprimer les exemples étiquetés afin qu'ils ne puissent pas fuiter." } }
answer:
  sequence: [ select, tune, eval, deploy ]
explanation:
  correct:
    en: "The company first selects an FM that fits the requirements, then fine-tunes it with the labeled examples. The customized model is evaluated before it is deployed, and feedback from users in production drives further improvement of the model."
    fr: "L'entreprise sélectionne d'abord un FM adapté aux exigences, puis le peaufine avec les exemples étiquetés. Le modèle personnalisé est évalué avant d'être déployé, et les commentaires des utilisateurs en production alimentent l'amélioration continue du modèle."
  options:
    pretrain:
      en: "Pre-training creates a model from scratch, which the company will not do; it starts from an existing FM."
      fr: "Le préentraînement crée un modèle à partir de zéro, ce que l'entreprise ne fera pas : elle part d'un FM existant."
    delete:
      en: "Deleting the training data is not a lifecycle step; the data is needed to evaluate and retrain the model later."
      fr: "Supprimer les données d'entraînement n'est pas une étape du cycle de vie ; ces données servent à évaluer et à réentraîner le modèle plus tard."
references:
  - title: "Generative AI lifecycle"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lifecycle.html
