id: aifc01-2b-sel-evaluate-candidates
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company must choose one of three foundation models on Amazon Bedrock to summarize its support cases. Public benchmark rankings of the three models disagree, and the company's cases use many product-specific terms.

    Which approach should the company use to select the model?
  fr: |
    Un éditeur de logiciels doit choisir l'un de trois modèles de fondation sur Amazon Bedrock pour résumer ses dossiers de support. Les classements des benchmarks publics des trois modèles divergent, et les dossiers de l'entreprise emploient de nombreux termes propres à ses produits.

    Quelle approche l'entreprise doit-elle utiliser pour choisir le modèle ?
body:
  options:
    - { id: a, text: { en: "Select the model that ranks first on a public leaderboard.", fr: "Choisir le modèle classé premier sur un classement public." } }
    - { id: b, text: { en: "Run an Amazon Bedrock model evaluation job on each candidate with a prompt dataset built from its own cases.", fr: "Exécuter une tâche d'évaluation de modèles Amazon Bedrock sur chaque candidat avec un jeu de données d'invites construit à partir de ses propres dossiers." } }
    - { id: c, text: { en: "Select the model that has the largest number of parameters.", fr: "Choisir le modèle qui a le plus grand nombre de paramètres." } }
    - { id: d, text: { en: "Select the model that was released most recently.", fr: "Choisir le modèle sorti le plus récemment." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Public benchmarks are general and often do not reflect a company's own data. Amazon Bedrock evaluations can test each candidate with a custom prompt dataset tailored to the use case, using computed metrics, a judge model, or human reviewers, so the company compares the models on its real task."
    fr: "Les benchmarks publics sont généraux et reflètent rarement les données propres d'une entreprise. Les évaluations Amazon Bedrock peuvent tester chaque candidat avec un jeu de données d'invites personnalisé adapté au cas d'usage, au moyen de métriques calculées, d'un modèle juge ou d'évaluateurs humains : l'entreprise compare ainsi les modèles sur sa tâche réelle."
  options:
    a:
      en: "A leaderboard measures general tasks; it does not show how a model handles the company's product-specific cases."
      fr: "Un classement public mesure des tâches générales ; il ne montre pas comment un modèle traite les dossiers propres aux produits de l'entreprise."
    c:
      en: "The largest model is not always the best for a task, and it usually costs more."
      fr: "Le plus grand modèle n'est pas toujours le meilleur pour une tâche, et il coûte généralement plus cher."
    d:
      en: "A newer model is not necessarily better on the company's own data; it must be evaluated like the others."
      fr: "Un modèle plus récent n'est pas forcément meilleur sur les données de l'entreprise ; il doit être évalué comme les autres."
references:
  - title: "Evaluate the performance of Amazon Bedrock resources"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
  - title: "Layer 2: Approved set of foundation models and tools"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-enterprise-ready-gen-ai-platform/model.html
