id: aifc01-2a-usecase-related-articles
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A news website wants to recommend related articles next to the article that a reader is viewing. Recommendations must be based on the meaning of the articles and must include articles published a few minutes ago, which have no reading history yet.

    Which solution will meet these requirements?
  fr: |
    Un site d'actualités veut recommander des articles connexes à côté de l'article qu'un lecteur consulte. Les recommandations doivent reposer sur le sens des articles et inclure des articles publiés il y a quelques minutes, qui n'ont encore aucun historique de lecture.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Fine-tune a text FM every night on the day's articles and ask it for related titles.", fr: "Peaufiner chaque nuit un FM de texte sur les articles du jour et lui demander des titres connexes." } }
    - { id: b, text: { en: "Create an embedding for each new article and recommend the articles with the nearest vectors.", fr: "Créer un embedding pour chaque nouvel article et recommander les articles aux vecteurs les plus proches." } }
    - { id: c, text: { en: "Ask a text FM with a high temperature to write a list of related article titles.", fr: "Demander à un FM de texte avec une température élevée d'écrire une liste de titres d'articles connexes." } }
    - { id: d, text: { en: "Recommend the articles that share the highest number of keywords with the current article.", fr: "Recommander les articles qui partagent le plus grand nombre de mots-clés avec l'article courant." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Recommendation by semantic similarity is an embeddings use case. Each article is converted into a vector as soon as it is published, and the articles whose vectors are nearest to the current article are recommended. Similarity depends on content only, so new articles without reading history are included."
    fr: "La recommandation par similarité sémantique est un cas d'utilisation des embeddings. Chaque article est converti en vecteur dès sa publication, et les articles dont les vecteurs sont les plus proches de l'article courant sont recommandés. La similarité ne dépend que du contenu : les nouveaux articles sans historique de lecture sont donc inclus."
  options:
    a:
      en: "A nightly fine-tuning job cannot include articles published a few minutes ago, and a generated list of titles is not tied to real articles."
      fr: "Une tâche de fine-tuning nocturne ne peut pas inclure des articles publiés il y a quelques minutes, et une liste de titres générée n'est pas liée à de vrais articles."
    c:
      en: "A generated list can contain titles of articles that do not exist, and a high temperature makes the output more random."
      fr: "Une liste générée peut contenir des titres d'articles inexistants, et une température élevée rend la sortie plus aléatoire."
    d:
      en: "Keyword overlap ignores meaning: related articles that use different words are missed."
      fr: "Le recoupement de mots-clés ignore le sens : des articles connexes qui emploient d'autres mots sont manqués."
references:
  - title: "Using Amazon Nova embeddings"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/embeddings.html
