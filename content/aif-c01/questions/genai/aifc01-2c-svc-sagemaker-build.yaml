id: aifc01-2c-svc-sagemaker-build
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The data science team of an insurance company wants to build, train and deploy its own machine learning models with its own algorithms and frameworks. The team wants fully managed infrastructure for training and a production-ready hosted environment for the trained models.

    Which AWS service will meet these requirements?
  fr: |
    L'équipe de science des données d'une compagnie d'assurance veut créer, entraîner et déployer ses propres modèles de machine learning avec ses propres algorithmes et frameworks. L'équipe veut une infrastructure entièrement gérée pour l'entraînement et un environnement hébergé prêt pour la production pour les modèles entraînés.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Bedrock" }
    - { id: b, text: "Amazon Quick" }
    - { id: c, text: "Amazon SageMaker AI" }
    - { id: d, text: "AWS Glue" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon SageMaker AI is the fully managed service to build, train and deploy ML models. It supports bring-your-own algorithms and frameworks, runs distributed training on managed infrastructure and deploys models to a secure, scalable hosted environment."
    fr: "Amazon SageMaker AI est le service entièrement géré qui permet de créer, d'entraîner et de déployer des modèles de ML. Il prend en charge vos propres algorithmes et frameworks, exécute l'entraînement distribué sur une infrastructure gérée et déploie les modèles dans un environnement hébergé sécurisé et évolutif."
  options:
    a:
      en: "Amazon Bedrock gives API access to existing foundation models, which can be customized; it is not the service to train models with your own algorithms and frameworks."
      fr: "Amazon Bedrock donne un accès par API à des modèles de fondation existants, que l'on peut personnaliser ; ce n'est pas le service qui permet d'entraîner des modèles avec vos propres algorithmes et frameworks."
    b:
      en: "Amazon Quick gives business users AI agents, research and business intelligence; it does not train or host custom ML models."
      fr: "Amazon Quick fournit aux utilisateurs métier des agents d'IA, de la recherche et de la business intelligence ; il n'entraîne ni n'héberge de modèles de ML personnalisés."
    d:
      en: "AWS Glue prepares and transforms data (ETL); it does not train or host models."
      fr: "AWS Glue prépare et transforme les données (ETL) ; il n'entraîne ni n'héberge de modèles."
references:
  - title: "What is Amazon SageMaker AI?"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html
