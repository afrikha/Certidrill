id: aifc01-2a-context-match-techniques
objective: "2.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is designing the context of its customer assistant built on Amazon Bedrock.

    Select the correct technique from the following list for each requirement. Each technique should be selected one time or not at all. (Select FOUR.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise conçoit le contexte de son assistant client créé sur Amazon Bedrock.

    Sélectionnez dans la liste suivante la technique correcte pour chaque exigence. Chaque technique doit être sélectionnée une fois ou pas du tout. (Sélectionnez-en QUATRE.)

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: short, text: { en: "Short-term memory", fr: "Mémoire à court terme" } }
    - { id: long, text: { en: "Long-term memory", fr: "Mémoire à long terme" } }
    - { id: rag, text: { en: "Retrieval from a knowledge base", fr: "Récupération dans une base de connaissances" } }
    - { id: cache, text: { en: "Prompt caching", fr: "Mise en cache des invites" } }
    - { id: tune, text: { en: "Fine-tuning", fr: "Fine-tuning" } }
    - { id: topp, text: { en: "Top P", fr: "Top P" } }
  targets:
    - { id: t1, text: { en: "Remember what the user said three turns ago in the same session", fr: "Se souvenir de ce que l'utilisateur a dit trois tours plus tôt dans la même session" } }
    - { id: t2, text: { en: "Recall the user's preferences in a new session next month", fr: "Retrouver les préférences de l'utilisateur dans une nouvelle session le mois suivant" } }
    - { id: t3, text: { en: "Add up-to-date passages from the product manuals", fr: "Ajouter des passages à jour des manuels produits" } }
    - { id: t4, text: { en: "Lower the cost of sending the same long instructions in every request", fr: "Réduire le coût de l'envoi des mêmes longues instructions dans chaque requête" } }
answer:
  mapping: { t1: short, t2: long, t3: rag, t4: cache }
explanation:
  correct:
    en: "Short-term memory keeps the turn-by-turn interactions of a session. Long-term memory extracts insights such as preferences and keeps them across sessions. Retrieval from a knowledge base adds current, relevant passages to the prompt. Prompt caching reuses a repeated prompt prefix at a lower input token cost."
    fr: "La mémoire à court terme conserve les interactions tour par tour d'une session. La mémoire à long terme extrait des informations comme les préférences et les conserve d'une session à l'autre. La récupération dans une base de connaissances ajoute à l'invite des passages actuels et pertinents. La mise en cache des invites réutilise un préfixe d'invite répété à un coût de jetons d'entrée plus faible."
  options:
    tune:
      en: "Fine-tuning changes the model's parameters with labeled data; it does not manage per-request context."
      fr: "Le fine-tuning modifie les paramètres du modèle avec des données étiquetées ; il ne gère pas le contexte de chaque requête."
    topp:
      en: "Top P is an inference parameter that limits candidate tokens; it adds no context."
      fr: "Le top P est un paramètre d'inférence qui limite les jetons candidats ; il n'ajoute aucun contexte."
references:
  - title: "Memory types"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-types.html
  - title: "Prompt caching for faster model inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
