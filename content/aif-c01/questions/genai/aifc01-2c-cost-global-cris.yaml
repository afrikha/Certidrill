id: aifc01-2c-cost-global-cris
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company calls a foundation model in Amazon Bedrock with on-demand inference from a single AWS Region. The company has no data residency requirements and allows its requests to be processed in any AWS commercial Region. The company wants to lower its on-demand inference cost without making a capacity commitment.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de jeux appelle un modèle de fondation dans Amazon Bedrock avec l'inférence à la demande depuis une seule Région AWS. L'entreprise n'a aucune exigence de résidence des données et accepte que ses requêtes soient traitées dans n'importe quelle Région commerciale AWS. L'entreprise veut réduire le coût de son inférence à la demande sans prendre d'engagement de capacité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Call the model through a geographic cross-Region inference profile.", fr: "Appeler le modèle au moyen d'un profil d'inférence géographique entre Régions." } }
    - { id: b, text: { en: "Purchase Provisioned Throughput with a 6-month commitment in the Region.", fr: "Acheter du Provisioned Throughput avec un engagement de 6 mois dans la Région." } }
    - { id: c, text: { en: "Deploy the application in a second Region and split the traffic between the Regions.", fr: "Déployer l'application dans une deuxième Région et répartir le trafic entre les Régions." } }
    - { id: d, text: { en: "Call the model through a global cross-Region inference profile.", fr: "Appeler le modèle au moyen d'un profil d'inférence global entre Régions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A global inference profile lets Amazon Bedrock route each request to any supported commercial Region, and it offers about 10% savings compared with geographic profiles, which use standard pricing. There is no additional routing charge, and the company keeps paying per token with no commitment."
    fr: "Un profil d'inférence global permet à Amazon Bedrock d'acheminer chaque requête vers n'importe quelle Région commerciale prise en charge, et il offre environ 10 % d'économies par rapport aux profils géographiques, qui appliquent le tarif standard. Il n'y a pas de frais de routage supplémentaires, et l'entreprise continue de payer par jeton sans engagement."
  options:
    a:
      en: "A geographic profile keeps processing within a geography such as the US or EU for data residency, at standard pricing; it does not give the extra savings of a global profile."
      fr: "Un profil géographique maintient le traitement dans une zone comme les États-Unis ou l'UE pour la résidence des données, au tarif standard ; il n'apporte pas les économies supplémentaires d'un profil global."
    b:
      en: "A 6-month commitment is a capacity commitment, which the company wants to avoid."
      fr: "Un engagement de 6 mois est un engagement de capacité, que l'entreprise veut éviter."
    c:
      en: "Splitting traffic across two Regions adds operational work and does not lower the per-token price."
      fr: "Répartir le trafic sur deux Régions ajoute du travail opérationnel et ne réduit pas le prix par jeton."
references:
  - title: "Route model inference requests across AWS Regions with cross-Region inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
