id: aifc01-2c-cost-priority-tier
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's customer-facing assistant uses on-demand inference in Amazon Bedrock. During peak hours, the bank wants the fastest possible response times for the assistant. The bank does not want to reserve capacity, make a commitment or pay for capacity by the hour, and it accepts paying more per token for these requests.

    Which solution will meet these requirements?
  fr: |
    L'assistant d'une banque destiné aux clients utilise l'inférence à la demande dans Amazon Bedrock. Aux heures de pointe, la banque veut les temps de réponse les plus rapides possibles pour l'assistant. La banque ne veut ni réserver de capacité, ni prendre d'engagement, ni payer de capacité à l'heure, et elle accepte de payer plus cher par jeton pour ces requêtes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the requests with the Flex service tier.", fr: "Envoyer les requêtes avec le niveau de service Flex." } }
    - { id: b, text: { en: "Send the requests with the Priority service tier.", fr: "Envoyer les requêtes avec le niveau de service Priority." } }
    - { id: c, text: { en: "Purchase Provisioned Throughput with no commitment.", fr: "Acheter du Provisioned Throughput sans engagement." } }
    - { id: d, text: { en: "Request the Reserved service tier from the AWS account team.", fr: "Demander le niveau de service Reserved à l'équipe de compte AWS." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Priority tier gives the fastest response times: its requests are prioritized over Standard and Flex requests. It needs no reservation, is requested per call with the service_tier parameter, and is billed per token at a premium over Standard pricing."
    fr: "Le niveau Priority offre les temps de réponse les plus rapides : ses requêtes sont prioritaires sur les requêtes Standard et Flex. Il ne nécessite aucune réservation, se demande à chaque appel avec le paramètre service_tier et est facturé par jeton avec un supplément par rapport au tarif Standard."
  options:
    a:
      en: "Flex is discounted in exchange for longer processing times, the opposite of the requirement."
      fr: "Flex est moins cher en échange de temps de traitement plus longs, ce qui est l'inverse de l'exigence."
    c:
      en: "Provisioned Throughput is billed by the hour per model unit, even without a commitment, which the bank does not want."
      fr: "Provisioned Throughput est facturé à l'heure par unité de modèle, même sans engagement, ce que la banque ne veut pas."
    d:
      en: "The Reserved tier reserves capacity for 1 or 3 months at a fixed monthly price, which is a reservation and a commitment."
      fr: "Le niveau Reserved réserve de la capacité pour 1 ou 3 mois à un prix mensuel fixe, ce qui constitue une réservation et un engagement."
references:
  - title: "Service tiers for optimizing performance and cost"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
