id: aifc01-2a-lifecycle-data-selection
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is preparing a dataset to customize a foundation model (FM) for its support chatbot.

    Which practice should the company follow during data selection?
  fr: |
    Une entreprise prépare un jeu de données pour personnaliser un modèle de fondation (FM) pour son chatbot de support.

    Quelle pratique l'entreprise doit-elle suivre pendant la sélection des données ?
body:
  options:
    - { id: a, text: { en: "Include every available record, whatever its quality, to maximize the dataset size.", fr: "Inclure tous les enregistrements disponibles, quelle que soit leur qualité, pour maximiser la taille du jeu de données." } }
    - { id: b, text: { en: "Keep relevant, high-quality examples and remove duplicates and sensitive data.", fr: "Conserver des exemples pertinents et de qualité, et supprimer les doublons et les données sensibles." } }
    - { id: c, text: { en: "Use only the examples that the company plans to keep for the final evaluation.", fr: "Utiliser uniquement les exemples que l'entreprise prévoit de garder pour l'évaluation finale." } }
    - { id: d, text: { en: "Select only examples from one product line so that the data is consistent.", fr: "Sélectionner uniquement des exemples d'une seule gamme de produits pour que les données soient cohérentes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The quality of an FM's output depends on its data. Selected data must be relevant to the use case, of good quality and representative, without duplicates. Sensitive or personal information that is not needed should be removed before training."
    fr: "La qualité des sorties d'un FM dépend de ses données. Les données sélectionnées doivent être pertinentes pour le cas d'utilisation, de bonne qualité et représentatives, sans doublons. Les informations sensibles ou personnelles inutiles doivent être supprimées avant l'entraînement."
  options:
    a:
      en: "Low-quality or irrelevant data degrades the customized model; more data does not compensate for bad data."
      fr: "Des données de mauvaise qualité ou non pertinentes dégradent le modèle personnalisé ; davantage de données ne compense pas de mauvaises données."
    c:
      en: "Evaluation data must be kept separate from training data, otherwise the evaluation does not measure performance on new inputs."
      fr: "Les données d'évaluation doivent rester séparées des données d'entraînement, sinon l'évaluation ne mesure pas les performances sur de nouvelles entrées."
    d:
      en: "Data from one product line is not representative of the questions the chatbot will receive about the other products."
      fr: "Les données d'une seule gamme de produits ne sont pas représentatives des questions que le chatbot recevra sur les autres produits."
references:
  - title: "Generative AI lifecycle"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lifecycle.html
