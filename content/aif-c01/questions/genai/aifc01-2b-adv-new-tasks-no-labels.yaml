id: aifc01-2b-adv-new-tasks-no-labels
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company has a separate ML classifier for each document type. Each classifier was trained on thousands of labeled examples. The company now wants to support new tasks, such as drafting replies to claim letters, without collecting labeled data and training a new model for each task.

    Which approach uses an advantage of generative AI to meet these requirements?
  fr: |
    Une compagnie d'assurance dispose d'un classifieur de ML distinct pour chaque type de document. Chaque classifieur a été entraîné sur des milliers d'exemples étiquetés. L'entreprise veut maintenant prendre en charge de nouvelles tâches, comme la rédaction de réponses aux courriers de sinistre, sans collecter de données étiquetées ni entraîner un nouveau modèle pour chaque tâche.

    Quelle approche utilise un avantage de l'IA générative pour répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use a pre-trained foundation model and describe each new task in the prompt, with a few examples.", fr: "Utiliser un modèle de fondation pré-entraîné et décrire chaque nouvelle tâche dans l'invite, avec quelques exemples." } }
    - { id: b, text: { en: "Train a new supervised classifier for each new task on newly labeled examples.", fr: "Entraîner un nouveau classifieur supervisé pour chaque nouvelle tâche sur des exemples nouvellement étiquetés." } }
    - { id: c, text: { en: "Use a clustering algorithm to group the claim letters by similarity.", fr: "Utiliser un algorithme de clustering pour regrouper les courriers de sinistre par similarité." } }
    - { id: d, text: { en: "Retrain the existing classifiers with more labeled documents.", fr: "Réentraîner les classifieurs existants avec davantage de documents étiquetés." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Foundation models are pre-trained on broad data and can perform many tasks from a prompt. Describing the task, optionally with a few examples (few-shot prompting), adapts the model to a new task without labeled datasets or a new training job."
    fr: "Les modèles de fondation sont pré-entraînés sur des données variées et peuvent effectuer de nombreuses tâches à partir d'une invite. Décrire la tâche, éventuellement avec quelques exemples (few-shot), adapte le modèle à une nouvelle tâche sans jeu de données étiqueté ni nouvelle tâche d'entraînement."
  options:
    b:
      en: "Training a supervised classifier per task requires the labeled data and training effort that the company wants to avoid, and a classifier cannot draft letters."
      fr: "Entraîner un classifieur supervisé par tâche exige les données étiquetées et l'effort d'entraînement que l'entreprise veut éviter, et un classifieur ne peut pas rédiger de courriers."
    c:
      en: "Clustering groups similar documents; it does not draft replies."
      fr: "Le clustering regroupe des documents similaires ; il ne rédige pas de réponses."
    d:
      en: "More labeled data still requires labeling and retraining, and the existing classifiers only classify documents."
      fr: "Davantage de données étiquetées implique toujours étiquetage et réentraînement, et les classifieurs existants ne font que classer des documents."
references:
  - title: "What is LLM? - Large Language Models Explained"
    url: https://aws.amazon.com/what-is/large-language-model/
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
