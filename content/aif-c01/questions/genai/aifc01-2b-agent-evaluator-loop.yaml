id: aifc01-2b-agent-evaluator-loop
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing company generates product descriptions with an LLM. A single generation pass often misses the brand's tone guidelines. The company wants a second LLM to critique each draft against the guidelines and the first LLM to revise the draft until the critique passes a quality threshold.

    Which agentic workflow pattern does this describe?
  fr: |
    Une agence marketing génère des descriptions de produits avec un LLM. Une seule passe de génération ne respecte souvent pas les consignes de ton de la marque. L'entreprise veut qu'un second LLM critique chaque brouillon au regard des consignes et que le premier LLM révise le brouillon jusqu'à ce que la critique atteigne un seuil de qualité.

    Quel modèle de flux de travail agentique cela décrit-il ?
body:
  options:
    - { id: a, text: { en: "Routing", fr: "Routage (routing)" } }
    - { id: b, text: { en: "Parallelization", fr: "Parallélisation" } }
    - { id: c, text: { en: "Evaluator and reflect-refine loop", fr: "Boucle évaluateur et réflexion-amélioration (reflect-refine)" } }
    - { id: d, text: { en: "Prompt chaining", fr: "Enchaînement d'invites" } }
answer: { optionId: c }
explanation:
  correct:
    en: "In the evaluator (reflect-refine) workflow, one LLM generates an output and another LLM evaluates it against criteria such as style, tone, or correctness. The feedback is used to revise the output, and the loop repeats until a convergence threshold is reached. It suits tasks where single-pass generation is not reliable enough."
    fr: "Dans le flux de travail évaluateur (réflexion-amélioration), un LLM génère une sortie et un autre LLM l'évalue selon des critères comme le style, le ton ou l'exactitude. Le retour sert à réviser la sortie, et la boucle se répète jusqu'à atteindre un seuil de convergence. Il convient aux tâches pour lesquelles une seule passe de génération n'est pas assez fiable."
  options:
    a:
      en: "Routing classifies each input and sends it to a specialized handler; it does not critique and revise an output."
      fr: "Le routage classe chaque entrée et l'envoie à un gestionnaire spécialisé ; il ne critique pas et ne révise pas une sortie."
    b:
      en: "Parallelization runs independent subtasks at the same time and aggregates them; there is no critique-and-revise loop."
      fr: "La parallélisation exécute des sous-tâches indépendantes en même temps puis agrège leurs résultats ; il n'y a pas de boucle critique-révision."
    d:
      en: "Prompt chaining runs a fixed sequence of steps; it does not repeat generation until an evaluator is satisfied."
      fr: "L'enchaînement d'invites exécute une séquence fixe d'étapes ; il ne répète pas la génération jusqu'à ce qu'un évaluateur soit satisfait."
references:
  - title: "Workflow for evaluators and reflect-refine loops"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-for-evaluators-and-reflect-refine-loops.html
