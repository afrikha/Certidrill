id: aifc01-2c-sec-artifact-soc
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An external auditor asks a bank for the System and Organization Controls (SOC) 2 report that covers the AWS services the bank uses for its generative AI application, including Amazon Bedrock.

    Which AWS service should the bank use to obtain the report?
  fr: |
    Un auditeur externe demande à une banque le rapport SOC 2 (System and Organization Controls) qui couvre les services AWS que la banque utilise pour son application d'IA générative, dont Amazon Bedrock.

    Quel service AWS la banque doit-elle utiliser pour obtenir le rapport ?
body:
  options:
    - { id: a, text: "AWS Artifact" }
    - { id: b, text: "Amazon Inspector" }
    - { id: c, text: "AWS Config" }
    - { id: d, text: "AWS Trusted Advisor" }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Artifact provides on-demand downloads of AWS security and compliance documents, such as SOC, ISO and PCI reports, free of charge. Amazon Bedrock is included in the SOC 1, 2 and 3 reports, which the bank can download and give to the auditor."
    fr: "AWS Artifact permet de télécharger à la demande et gratuitement les documents de sécurité et de conformité d'AWS, comme les rapports SOC, ISO et PCI. Amazon Bedrock est inclus dans les rapports SOC 1, 2 et 3, que la banque peut télécharger et remettre à l'auditeur."
  options:
    b:
      en: "Amazon Inspector scans workloads for software vulnerabilities; it does not provide AWS audit reports."
      fr: "Amazon Inspector analyse les charges de travail à la recherche de vulnérabilités logicielles ; il ne fournit pas les rapports d'audit d'AWS."
    c:
      en: "AWS Config records and evaluates the configuration of the bank's resources; it does not provide AWS's third-party audit reports."
      fr: "AWS Config enregistre et évalue la configuration des ressources de la banque ; il ne fournit pas les rapports d'audit tiers d'AWS."
    d:
      en: "Trusted Advisor gives best-practice recommendations on the bank's account; it does not deliver compliance reports."
      fr: "Trusted Advisor donne des recommandations de bonnes pratiques sur le compte de la banque ; il ne fournit pas de rapports de conformité."
references:
  - title: "What is AWS Artifact?"
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
  - title: "Compliance validation for Amazon Bedrock"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/compliance-validation.html
