id: aifc01-2c-svc-jumpstart-endpoint
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research company wants to use a publicly available open-weight large language model. The ML team must choose the instance type that hosts the model and must run the model on an endpoint in the company's own account. The team wants to start from a catalog of pretrained models instead of writing training code.

    Which solution will meet these requirements?
  fr: |
    Une société de recherche veut utiliser un grand modèle de langage à poids ouverts disponible publiquement. L'équipe ML doit choisir le type d'instance qui héberge le modèle et doit exécuter le modèle sur un point de terminaison dans le propre compte de l'entreprise. L'équipe veut partir d'un catalogue de modèles préentraînés au lieu d'écrire du code d'entraînement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy the model from Amazon SageMaker JumpStart to a SageMaker AI endpoint.", fr: "Déployer le modèle depuis Amazon SageMaker JumpStart vers un point de terminaison SageMaker AI." } }
    - { id: b, text: { en: "Invoke the model on demand through the Amazon Bedrock API.", fr: "Appeler le modèle à la demande au moyen de l'API Amazon Bedrock." } }
    - { id: c, text: { en: "Train the model from scratch with an Amazon SageMaker AI training job.", fr: "Entraîner le modèle à partir de zéro avec une tâche d'entraînement Amazon SageMaker AI." } }
    - { id: d, text: { en: "Connect the model to a chat agent in Amazon Quick.", fr: "Connecter le modèle à un agent de conversation dans Amazon Quick." } }
answer: { optionId: a }
explanation:
  correct:
    en: "SageMaker JumpStart is a hub of pretrained, publicly available and proprietary models. From a model card, the team chooses Deploy and the model runs on a SageMaker AI endpoint whose instance type the team selects, with no training code to write."
    fr: "SageMaker JumpStart est un hub de modèles préentraînés, publics et propriétaires. Depuis la fiche d'un modèle, l'équipe choisit Deploy et le modèle s'exécute sur un point de terminaison SageMaker AI dont l'équipe sélectionne le type d'instance, sans code d'entraînement à écrire."
  options:
    b:
      en: "Bedrock is serverless: the team calls the model through an API and does not choose the instances that host it, which fails the instance-type requirement."
      fr: "Bedrock est sans serveur : l'équipe appelle le modèle par une API et ne choisit pas les instances qui l'hébergent, ce qui ne respecte pas l'exigence sur le type d'instance."
    c:
      en: "Training from scratch requires training code and large datasets; the team wants to start from a pretrained model."
      fr: "Entraîner un modèle à partir de zéro exige du code d'entraînement et de grands jeux de données ; l'équipe veut partir d'un modèle préentraîné."
    d:
      en: "Amazon Quick is a managed service for business users; it does not host an open-weight model on an endpoint whose instance type the team chooses."
      fr: "Amazon Quick est un service géré pour les utilisateurs métier ; il n'héberge pas un modèle à poids ouverts sur un point de terminaison dont l'équipe choisit le type d'instance."
references:
  - title: "SageMaker JumpStart pretrained models"
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html
