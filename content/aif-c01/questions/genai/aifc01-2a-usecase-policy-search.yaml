id: aifc01-2a-usecase-policy-search
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Employees of a manufacturing company spend a long time searching internal policy documents stored in Amazon S3. The company wants employees to ask questions in natural language and receive generated answers that cite the source documents.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Les employés d'une entreprise industrielle passent beaucoup de temps à chercher dans des documents de politique interne stockés dans Amazon S3. L'entreprise veut que les employés posent des questions en langage naturel et reçoivent des réponses générées qui citent les documents sources.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Bedrock knowledge base with the S3 documents as the data source.", fr: "Créer une base de connaissances Amazon Bedrock avec les documents S3 comme source de données." } }
    - { id: b, text: { en: "Configure Amazon Bedrock Guardrails with the S3 documents as a word filter.", fr: "Configurer Amazon Bedrock Guardrails avec les documents S3 comme filtre de mots." } }
    - { id: c, text: { en: "Use Amazon Textract to extract the text of the S3 documents for each question.", fr: "Utiliser Amazon Textract pour extraire le texte des documents S3 à chaque question." } }
    - { id: d, text: { en: "Use Amazon Comprehend to detect the key phrases of the S3 documents.", fr: "Utiliser Amazon Comprehend pour détecter les expressions clés des documents S3." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Search over company documents is a generative AI use case served by retrieval augmented generation (RAG). An Amazon Bedrock knowledge base ingests the S3 documents, retrieves the passages relevant to each question and returns a generated answer with citations, without custom retrieval code."
    fr: "La recherche dans les documents de l'entreprise est un cas d'utilisation de l'IA générative servi par la génération à enrichissement contextuel (RAG). Une base de connaissances Amazon Bedrock ingère les documents S3, récupère les passages pertinents pour chaque question et renvoie une réponse générée avec des citations, sans code de récupération personnalisé."
  options:
    b:
      en: "Guardrails filter harmful or unwanted content in inputs and outputs; they do not answer questions from documents."
      fr: "Guardrails filtre le contenu nuisible ou indésirable des entrées et des sorties ; il ne répond pas aux questions à partir de documents."
    c:
      en: "Amazon Textract extracts text from documents but does not retrieve relevant passages or generate answers."
      fr: "Amazon Textract extrait le texte des documents, mais il ne récupère pas de passages pertinents et ne génère pas de réponses."
    d:
      en: "Key phrase detection analyzes text; it does not generate answers to questions."
      fr: "La détection d'expressions clés analyse le texte ; elle ne génère pas de réponses aux questions."
references:
  - title: "How Amazon Bedrock knowledge bases work"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
