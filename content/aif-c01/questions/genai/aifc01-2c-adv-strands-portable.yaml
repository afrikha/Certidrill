id: aifc01-2c-adv-strands-portable
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company wants to write its AI agents once and keep the freedom to run them on AWS Lambda, on Amazon EKS or on Amazon Bedrock AgentCore, and to use models from different providers. The company prefers an open-source toolkit.

    Why is Strands Agents a good fit for this company?
  fr: |
    Une fintech veut écrire ses agents d'IA une seule fois et garder la liberté de les exécuter sur AWS Lambda, sur Amazon EKS ou sur Amazon Bedrock AgentCore, et d'utiliser des modèles de différents fournisseurs. L'entreprise préfère une boîte à outils open source.

    Pourquoi Strands Agents convient-il à cette entreprise ?
body:
  options:
    - { id: a, text: { en: "It is a no-code service in which business users build agents through natural language chat.", fr: "C'est un service sans code dans lequel les utilisateurs métier créent des agents par conversation en langage naturel." } }
    - { id: b, text: { en: "It is an open-source SDK whose agents run in the application process and support many model providers.", fr: "C'est un SDK open source dont les agents s'exécutent dans le processus de l'application et prennent en charge de nombreux fournisseurs de modèles." } }
    - { id: c, text: { en: "It hosts each agent on dedicated GPU instances that AWS sizes for the selected model.", fr: "Il héberge chaque agent sur des instances GPU dédiées qu'AWS dimensionne pour le modèle sélectionné." } }
    - { id: d, text: { en: "It works only with Amazon Nova models invoked through Amazon Bedrock.", fr: "Il fonctionne uniquement avec les modèles Amazon Nova appelés au moyen d'Amazon Bedrock." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Strands Agents is an open-source toolkit for Python and TypeScript. Agents run inside the application process, so they can be deployed on Lambda, Fargate, Amazon EKS, Amazon EC2, containers or AgentCore, and the SDK supports many model providers, including Amazon Bedrock, Anthropic, OpenAI and Ollama."
    fr: "Strands Agents est une boîte à outils open source pour Python et TypeScript. Les agents s'exécutent dans le processus de l'application ; ils peuvent donc être déployés sur Lambda, Fargate, Amazon EKS, Amazon EC2, des conteneurs ou AgentCore, et le SDK prend en charge de nombreux fournisseurs de modèles, dont Amazon Bedrock, Anthropic, OpenAI et Ollama."
  options:
    a:
      en: "Strands Agents is a code SDK for developers; natural-language, no-code agents for business users are offered by Amazon Quick."
      fr: "Strands Agents est un SDK de code pour les développeurs ; les agents sans code en langage naturel pour les utilisateurs métier sont proposés par Amazon Quick."
    c:
      en: "Strands Agents does not host anything; the company chooses where the agent runs."
      fr: "Strands Agents n'héberge rien ; c'est l'entreprise qui choisit où l'agent s'exécute."
    d:
      en: "Strands Agents is not limited to Nova or to Bedrock; it supports many model providers."
      fr: "Strands Agents n'est limité ni à Nova ni à Bedrock ; il prend en charge de nombreux fournisseurs de modèles."
references:
  - title: "Strands Agents"
    url: https://strandsagents.com/latest/
