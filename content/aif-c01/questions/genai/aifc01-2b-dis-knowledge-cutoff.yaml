id: aifc01-2b-dis-knowledge-cutoff
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's internal assistant sends employee questions directly to a foundation model, without retrieving any company documents. When an employee asks about a travel regulation that changed last month, the assistant gives the rules that applied before the change.

    What is the MOST likely cause of the inaccurate answer?
  fr: |
    L'assistant interne d'une entreprise envoie les questions des employés directement à un modèle de fondation, sans récupérer aucun document de l'entreprise. Quand un employé pose une question sur une réglementation des déplacements modifiée le mois dernier, l'assistant donne les règles qui s'appliquaient avant la modification.

    Quelle est la cause la PLUS probable de cette réponse inexacte ?
body:
  options:
    - { id: a, text: { en: "The temperature of the model is set too low.", fr: "La température du modèle est trop basse." } }
    - { id: b, text: { en: "The maximum output length is too short for the answer.", fr: "La longueur maximale de sortie est trop courte pour la réponse." } }
    - { id: c, text: { en: "The model's knowledge is limited to the data it was trained on.", fr: "Les connaissances du modèle se limitent aux données sur lesquelles il a été entraîné." } }
    - { id: d, text: { en: "The model is nondeterministic, so it returned an older answer.", fr: "Le modèle est non déterministe, il a donc renvoyé une réponse plus ancienne." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A foundation model only knows what was in its training data. Without retrieved documents in the prompt, it cannot know about a change made after its training, so it answers with outdated information. Retrieval Augmented Generation (RAG) supplies current documents to ground the answer."
    fr: "Un modèle de fondation ne connaît que ce qui figurait dans ses données d'entraînement. Sans documents récupérés dans l'invite, il ne peut pas connaître une modification postérieure à son entraînement et répond avec des informations obsolètes. La génération augmentée par récupération (RAG) fournit des documents à jour pour ancrer la réponse."
  options:
    a:
      en: "A low temperature makes answers more consistent; it does not make the model unaware of recent changes."
      fr: "Une température basse rend les réponses plus cohérentes ; elle ne rend pas le modèle ignorant des modifications récentes."
    b:
      en: "A short maximum length truncates answers; it does not replace new rules with old ones."
      fr: "Une longueur maximale courte tronque les réponses ; elle ne remplace pas les nouvelles règles par les anciennes."
    d:
      en: "Nondeterminism varies the wording; the model cannot return rules that it never learned, whatever the sampling."
      fr: "Le non-déterminisme fait varier la formulation ; le modèle ne peut pas restituer des règles qu'il n'a jamais apprises, quel que soit l'échantillonnage."
references:
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
