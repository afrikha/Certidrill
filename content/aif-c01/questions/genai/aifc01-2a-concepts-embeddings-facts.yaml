id: aifc01-2a-concepts-embeddings-facts
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company plans to use Amazon Nova Multimodal Embeddings to search its archive of articles, photos and video clips.

    Which statements about embeddings are correct? (Choose two.)
  fr: |
    Une entreprise de médias prévoit d'utiliser Amazon Nova Multimodal Embeddings pour rechercher dans ses archives d'articles, de photos et de clips vidéo.

    Quelles affirmations sur les vectorisations (embeddings) sont correctes ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Content with similar meaning is represented by vectors that are close to each other.", fr: "Des contenus de sens proche sont représentés par des vecteurs proches les uns des autres." } }
    - { id: b, text: { en: "Embeddings are readable text summaries that the model writes for each item.", fr: "Les vectorisations sont des résumés textuels lisibles que le modèle rédige pour chaque élément." } }
    - { id: c, text: { en: "Creating embeddings updates the parameters of the embedding model.", fr: "La création de vectorisations met à jour les paramètres du modèle de vectorisation." } }
    - { id: d, text: { en: "Text, images and video can be mapped into the same vector space, so a text query can find matching images.", fr: "Le texte, les images et la vidéo peuvent être projetés dans le même espace vectoriel : une requête textuelle peut trouver des images correspondantes." } }
    - { id: e, text: { en: "Embeddings can be compared only when the items are written in English.", fr: "Les vectorisations ne peuvent être comparées que si les éléments sont rédigés en anglais." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "An embedding is a vector of numbers that represents an input so that items can be compared for similarity: similar content gets closer vectors. Amazon Nova Multimodal Embeddings maps text, document images, images, video and audio into a unified semantic space, which enables cross-modal search such as a text query that retrieves images or video."
    fr: "Une vectorisation (embedding) est un vecteur de nombres qui représente une entrée afin de pouvoir comparer la similarité des éléments : des contenus proches obtiennent des vecteurs plus proches. Amazon Nova Multimodal Embeddings projette le texte, les images de documents, les images, la vidéo et l'audio dans un espace sémantique unifié, ce qui permet une recherche intermodale, par exemple une requête textuelle qui retrouve des images ou des vidéos."
  options:
    b:
      en: "Embeddings are numeric vectors, not text that a person reads."
      fr: "Les vectorisations sont des vecteurs numériques, pas du texte destiné à être lu."
    c:
      en: "Generating an embedding is inference; it does not change the model's parameters."
      fr: "Générer une vectorisation est une inférence ; cela ne modifie pas les paramètres du modèle."
    e:
      en: "Embedding models are not limited to English, and multimodal embeddings also cover images, video and audio."
      fr: "Les modèles de vectorisation ne se limitent pas à l'anglais, et les vectorisations multimodales couvrent aussi les images, la vidéo et l'audio."
references:
  - title: "Using Amazon Nova embeddings"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/embeddings.html
  - title: "Key terminology"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
