id: aifc01-2a-tokens-image-billing
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company compares the on-demand costs of a text model and an image generation model on Amazon Bedrock. The text model is billed per token.

    How is the image generation model billed with on-demand inference?
  fr: |
    Une entreprise compare les coûts à la demande d'un modèle de texte et d'un modèle de génération d'images sur Amazon Bedrock. Le modèle de texte est facturé au jeton.

    Comment le modèle de génération d'images est-il facturé avec l'inférence à la demande ?
body:
  options:
    - { id: a, text: { en: "Per hour that the model is available", fr: "Par heure de disponibilité du modèle" } }
    - { id: b, text: { en: "Per gigabyte of images stored", fr: "Par gigaoctet d'images stockées" } }
    - { id: c, text: { en: "Per image generated", fr: "Par image générée" } }
    - { id: d, text: { en: "Per user of the application", fr: "Par utilisateur de l'application" } }
answer: { optionId: c }
explanation:
  correct:
    en: "With on-demand pricing on Amazon Bedrock, text models are charged per input and output token, while image generation models are charged per image generated."
    fr: "Avec la tarification à la demande d'Amazon Bedrock, les modèles de texte sont facturés par jeton d'entrée et de sortie, tandis que les modèles de génération d'images sont facturés par image générée."
  options:
    a:
      en: "On-demand inference has no hourly charge; hourly billing applies to Provisioned Throughput."
      fr: "L'inférence à la demande n'a pas de frais horaires ; la facturation horaire s'applique au Provisioned Throughput."
    b:
      en: "Storage of generated images is billed by the storage service, such as Amazon S3, not by the model."
      fr: "Le stockage des images générées est facturé par le service de stockage, comme Amazon S3, pas par le modèle."
    d:
      en: "Amazon Bedrock does not charge per application user."
      fr: "Amazon Bedrock ne facture pas par utilisateur de l'application."
references:
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
