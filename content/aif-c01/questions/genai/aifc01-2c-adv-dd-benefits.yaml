id: aifc01-2c-adv-dd-benefits
objective: "2.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A company is listing the advantages it expects from AWS generative AI services. Match each situation to the advantage that it illustrates. To answer, drag the appropriate advantage to each situation. Each advantage may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise dresse la liste des avantages qu'elle attend des services AWS d'IA générative. Associez chaque situation à l'avantage qu'elle illustre. Pour répondre, faites glisser l'avantage approprié vers chaque situation. Chaque avantage peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: access, text: { en: "Accessibility", fr: "Accessibilité" } }
    - { id: cost, text: { en: "Cost-effectiveness", fr: "Rentabilité" } }
    - { id: speed, text: { en: "Speed to market", fr: "Rapidité de mise sur le marché" } }
    - { id: redund, text: { en: "Redundancy", fr: "Redondance" } }
  targets:
    - { id: t1, text: { en: "Customer service staff with no ML background test prompts in the Amazon Bedrock console and build a prototype themselves.", fr: "Des employés du service client sans formation en ML testent des invites dans la console Amazon Bedrock et créent eux-mêmes un prototype." } }
    - { id: t2, text: { en: "A team pays only for the tokens it processes instead of buying GPU servers for a workload whose volume is uncertain.", fr: "Une équipe ne paie que les jetons qu'elle traite au lieu d'acheter des serveurs GPU pour une charge de travail dont le volume est incertain." } }
    - { id: t3, text: { en: "A team starts from a pretrained foundation model instead of collecting data and training a model, and launches its feature in weeks instead of months.", fr: "Une équipe part d'un modèle de fondation préentraîné au lieu de collecter des données et d'entraîner un modèle, et lance sa fonctionnalité en quelques semaines au lieu de plusieurs mois." } }
answer:
  mapping: { t1: access, t2: cost, t3: speed }
explanation:
  correct:
    en: "Console playgrounds let non-specialists use foundation models without code (accessibility, lower barrier to entry). On-demand token-based pricing avoids buying hardware and commitments for an uncertain volume (cost-effectiveness). Reusing a pretrained model removes data collection and training work (speed to market)."
    fr: "Les terrains de jeu de la console permettent à des non-spécialistes d'utiliser des modèles de fondation sans code (accessibilité, réduction des obstacles à l'entrée). La tarification à la demande basée sur les jetons évite d'acheter du matériel et de s'engager pour un volume incertain (rentabilité). Réutiliser un modèle préentraîné supprime la collecte de données et l'entraînement (rapidité de mise sur le marché)."
  options:
    redund:
      en: "Redundancy concerns running across several locations to survive failures; none of the situations describes it."
      fr: "La redondance consiste à fonctionner sur plusieurs emplacements pour résister aux pannes ; aucune situation ne la décrit."
references:
  - title: "Amazon Bedrock FAQs"
    url: https://aws.amazon.com/bedrock/faqs/
  - title: "Amazon Bedrock Pricing"
    url: https://aws.amazon.com/bedrock/pricing/
