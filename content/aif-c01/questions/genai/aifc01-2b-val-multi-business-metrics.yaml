id: aifc01-2b-val-multi-business-metrics
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank deploys a generative AI assistant for its customer service agents. The bank's leadership wants to report the business value of the assistant, not the technical quality of the model.

    Which two metrics should the bank report? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une banque déploie un assistant d'IA générative pour ses agents du service client. La direction de la banque veut rendre compte de la valeur métier de l'assistant, et non de la qualité technique du modèle.

    Quelles sont les deux métriques que la banque doit présenter ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "BLEU score of translated replies", fr: "Score BLEU des réponses traduites" } }
    - { id: b, text: { en: "Customer satisfaction score", fr: "Score de satisfaction client" } }
    - { id: c, text: { en: "Temperature setting of the model", fr: "Réglage de la température du modèle" } }
    - { id: d, text: { en: "Number of requests resolved per agent each day", fr: "Nombre de demandes résolues par agent chaque jour" } }
    - { id: e, text: { en: "Number of parameters of the model", fr: "Nombre de paramètres du modèle" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Business metrics measure value to the organization, such as customer satisfaction and productivity. A higher customer satisfaction score and more requests resolved per agent each day show that the assistant improves the customer experience and the efficiency of the agents."
    fr: "Les métriques métier mesurent la valeur pour l'organisation, comme la satisfaction des clients et la productivité. Un score de satisfaction client plus élevé et davantage de demandes résolues par agent chaque jour montrent que l'assistant améliore l'expérience client et l'efficacité des agents."
  options:
    a:
      en: "BLEU measures translation quality; it is a model metric."
      fr: "BLEU mesure la qualité de traduction ; c'est une métrique de modèle."
    c:
      en: "Temperature is an inference parameter, not a metric of value."
      fr: "La température est un paramètre d'inférence, pas une métrique de valeur."
    e:
      en: "The number of parameters describes the model's size, not its business impact."
      fr: "Le nombre de paramètres décrit la taille du modèle, pas son impact métier."
references:
  - title: "MLPERF01-BP01 Determine key performance indicators"
    url: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlperf01-bp01.html
  - title: "Measuring the success of generative AI in software development"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-accelerate-software-dev-lifecycle-gen-ai/measuring-success.html
