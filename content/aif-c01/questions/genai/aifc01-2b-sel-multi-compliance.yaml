id: aifc01-2b-sel-multi-compliance
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company is comparing foundation models on Amazon Bedrock for an application that processes patient messages.

    Which two factors relate to the company's compliance requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de santé compare des modèles de fondation sur Amazon Bedrock pour une application qui traite des messages de patients.

    Quels sont les deux facteurs liés aux exigences de conformité de l'entreprise ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The maximum output length of the model", fr: "La longueur maximale de sortie du modèle" } }
    - { id: b, text: { en: "The AWS Regions where inference data is processed and stored", fr: "Les Régions AWS dans lesquelles les données d'inférence sont traitées et stockées" } }
    - { id: c, text: { en: "The default temperature of the model", fr: "La température par défaut du modèle" } }
    - { id: d, text: { en: "Whether prompts and completions are shared with model providers or used to train models", fr: "Le fait que les invites et les complétions soient partagées avec les fournisseurs de modèles ou utilisées pour entraîner des modèles" } }
    - { id: e, text: { en: "The number of parameters of the model", fr: "Le nombre de paramètres du modèle" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Compliance depends on how and where data is handled. With Amazon Bedrock, customer content is stored at rest in the Region where the service is used, and inputs and outputs are not shared with model providers or used to train the models. The Regions involved in inference, including cross-Region routing, also matter for data residency."
    fr: "La conformité dépend de la manière et du lieu où les données sont traitées. Avec Amazon Bedrock, le contenu client est stocké au repos dans la Région où le service est utilisé, et les entrées et sorties ne sont ni partagées avec les fournisseurs de modèles ni utilisées pour entraîner les modèles. Les Régions impliquées dans l'inférence, y compris le routage interrégional, comptent aussi pour la résidence des données."
  options:
    a:
      en: "The maximum output length affects response size and cost, not compliance."
      fr: "La longueur maximale de sortie influe sur la taille des réponses et le coût, pas sur la conformité."
    c:
      en: "Temperature affects the randomness of responses, not data handling."
      fr: "La température influe sur le caractère aléatoire des réponses, pas sur le traitement des données."
    e:
      en: "The number of parameters relates to model complexity, cost, and latency, not to compliance."
      fr: "Le nombre de paramètres concerne la complexité, le coût et la latence du modèle, pas la conformité."
references:
  - title: "Amazon Bedrock FAQs"
    url: https://aws.amazon.com/bedrock/faqs/
  - title: "Route model inference requests across AWS Regions with cross-Region inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
