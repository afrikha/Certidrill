id: aifc01-2b-agent-short-term-memory
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A user asks a weather agent "What is the weather in Seattle today?" and then, in the same conversation, asks "What about tomorrow?" The agent must understand that the second question is about Seattle without the user repeating it.

    Which agent capability meets this requirement?
  fr: |
    Un utilisateur demande à un agent météo « Quel temps fait-il à Seattle aujourd'hui ? », puis, dans la même conversation, « Et demain ? ». L'agent doit comprendre que la seconde question porte sur Seattle sans que l'utilisateur le répète.

    Quelle capacité de l'agent répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Short-term memory that keeps the turns of the current session", fr: "Une mémoire à court terme qui conserve les échanges de la session en cours" } }
    - { id: b, text: { en: "Long-term memory that keeps user preferences across sessions", fr: "Une mémoire à long terme qui conserve les préférences de l'utilisateur d'une session à l'autre" } }
    - { id: c, text: { en: "A higher temperature for more varied responses", fr: "Une température plus élevée pour des réponses plus variées" } }
    - { id: d, text: { en: "A tool that calls an external weather API", fr: "Un outil qui appelle une API météo externe" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Short-term memory captures the turn-by-turn interactions within a single session, so the agent keeps the immediate context (Seattle) and the user does not have to repeat it."
    fr: "La mémoire à court terme capture les échanges successifs d'une même session : l'agent garde le contexte immédiat (Seattle) et l'utilisateur n'a pas à le répéter."
  options:
    b:
      en: "Long-term memory extracts insights such as preferences to reuse in later sessions; the follow-up question is in the same session."
      fr: "La mémoire à long terme extrait des informations comme les préférences pour les réutiliser lors de sessions ultérieures ; la question de suivi a lieu dans la même session."
    c:
      en: "Temperature controls the randomness of generated tokens; it does not keep conversational context."
      fr: "La température contrôle le caractère aléatoire des jetons générés ; elle ne conserve pas le contexte de la conversation."
    d:
      en: "A weather tool provides the forecast data, but without the session context the agent would not know which city the follow-up refers to."
      fr: "Un outil météo fournit les prévisions, mais sans le contexte de la session l'agent ne saurait pas à quelle ville la question de suivi fait référence."
references:
  - title: "Add memory to your Amazon Bedrock AgentCore agent"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html
