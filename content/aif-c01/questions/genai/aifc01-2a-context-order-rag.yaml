id: aifc01-2a-context-order-rag
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A company's application uses an Amazon Bedrock knowledge base to add context to each user question before the foundation model (FM) answers. The documents have already been ingested.

    Select the correct runtime steps from the following list and put them in the correct order. Each step should be selected one time or not at all. (Select and order FOUR.)
  fr: |
    L'application d'une entreprise utilise une base de connaissances Amazon Bedrock pour ajouter du contexte à chaque question d'utilisateur avant que le modèle de fondation (FM) ne réponde. Les documents ont déjà été ingérés.

    Sélectionnez les étapes d'exécution correctes dans la liste suivante et placez-les dans le bon ordre. Chaque étape doit être sélectionnée une fois ou pas du tout. (Sélectionnez et classez-en QUATRE.)
body:
  count: 4
  actions:
    - { id: augment, text: { en: "Add the retrieved chunks to the user's prompt.", fr: "Ajouter les fragments récupérés à l'invite de l'utilisateur." } }
    - { id: tune, text: { en: "Fine-tune the FM on the retrieved chunks.", fr: "Peaufiner le FM sur les fragments récupérés." } }
    - { id: embed, text: { en: "Convert the user's question into a vector with an embedding model.", fr: "Convertir la question de l'utilisateur en vecteur avec un modèle de vectorisation." } }
    - { id: generate, text: { en: "Send the augmented prompt to the FM to generate the answer.", fr: "Envoyer l'invite enrichie au FM pour générer la réponse." } }
    - { id: search, text: { en: "Search the vector index for the chunks most similar to the question.", fr: "Rechercher dans l'index vectoriel les fragments les plus proches de la question." } }
    - { id: reingest, text: { en: "Split all the source documents into chunks again.", fr: "Découper à nouveau tous les documents sources en fragments." } }
answer:
  sequence: [ embed, search, augment, generate ]
explanation:
  correct:
    en: "At runtime, an embedding model converts the user's query into a vector. The vector index is queried for the chunks that are semantically similar to the query. The prompt is augmented with these chunks, and the augmented prompt is sent to the model to generate the response."
    fr: "À l'exécution, un modèle de vectorisation convertit la requête de l'utilisateur en vecteur. L'index vectoriel est interrogé pour trouver les fragments sémantiquement proches de la requête. L'invite est enrichie avec ces fragments, puis l'invite enrichie est envoyée au modèle pour générer la réponse."
  options:
    tune:
      en: "RAG adds context to the prompt at inference time; it does not change the model's parameters."
      fr: "Le RAG ajoute du contexte à l'invite au moment de l'inférence ; il ne modifie pas les paramètres du modèle."
    reingest:
      en: "Chunking happens during ingestion, which the company has already done; it is not repeated for each question."
      fr: "Le découpage a lieu pendant l'ingestion, déjà réalisée ; il n'est pas répété à chaque question."
references:
  - title: "How Amazon Bedrock knowledge bases work"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-how-it-works.html
