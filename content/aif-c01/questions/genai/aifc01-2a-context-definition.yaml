id: aifc01-2a-context-definition
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AI team is designing an agent on Amazon Bedrock. A team member says that the project needs context engineering.

    What does context engineering mean in a foundation model (FM) application?
  fr: |
    Une équipe d'IA conçoit un agent sur Amazon Bedrock. Un membre de l'équipe dit que le projet a besoin d'ingénierie du contexte (context engineering).

    Que signifie l'ingénierie du contexte dans une application de modèle de fondation (FM) ?
body:
  options:
    - { id: a, text: { en: "Adjusting the parameters of the FM with labeled examples of the task", fr: "Ajuster les paramètres du FM avec des exemples étiquetés de la tâche" } }
    - { id: b, text: { en: "Choosing the information that fills the context window on each request", fr: "Choisir les informations qui remplissent la fenêtre de contexte à chaque requête" } }
    - { id: c, text: { en: "Selecting the AWS Region and the network settings of the application", fr: "Sélectionner la Région AWS et les paramètres réseau de l'application" } }
    - { id: d, text: { en: "Setting the temperature and top P values of the FM", fr: "Définir les valeurs de température et de top P du FM" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Context engineering designs and manages everything that is placed in the model's context window for each request: system instructions, conversation history, memory, retrieved knowledge and tool definitions. The goal is to give the model the information it needs, with the highest information density, without exceeding token limits."
    fr: "L'ingénierie du contexte conçoit et gère tout ce qui est placé dans la fenêtre de contexte du modèle à chaque requête : instructions système, historique de conversation, mémoire, connaissances récupérées et définitions d'outils. L'objectif est de donner au modèle les informations dont il a besoin, avec la plus forte densité d'information, sans dépasser les limites de jetons."
  options:
    a:
      en: "Adjusting parameters with labeled examples is fine-tuning, a model customization method."
      fr: "Ajuster les paramètres avec des exemples étiquetés est du fine-tuning, une méthode de personnalisation du modèle."
    c:
      en: "Region and network choices are infrastructure decisions, not the content given to the model."
      fr: "Le choix de la Région et du réseau relève de l'infrastructure, pas du contenu fourni au modèle."
    d:
      en: "Temperature and top P are inference parameters that shape token selection; they add no information to the context."
      fr: "La température et le top P sont des paramètres d'inférence qui orientent le choix des jetons ; ils n'ajoutent aucune information au contexte."
references:
  - title: "Memory, context, and RAG optimization"
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentperf03.html
