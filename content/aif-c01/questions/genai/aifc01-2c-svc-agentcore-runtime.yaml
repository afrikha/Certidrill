id: aifc01-2c-svc-agentcore-runtime
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank has built an AI agent with the open-source LangGraph framework. The bank wants to deploy the agent to a secure, serverless AWS environment that scales automatically and isolates each user session, without managing servers or containers.

    Which solution will meet these requirements?
  fr: |
    Une banque a créé un agent d'IA avec le framework open source LangGraph. La banque veut déployer l'agent dans un environnement AWS sécurisé et sans serveur qui se met à l'échelle automatiquement et isole chaque session utilisateur, sans gérer de serveurs ni de conteneurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Host the agent on an Amazon EC2 Auto Scaling group.", fr: "Héberger l'agent sur un groupe Auto Scaling Amazon EC2." } }
    - { id: b, text: { en: "Deploy the agent to Amazon Bedrock AgentCore Runtime.", fr: "Déployer l'agent sur Amazon Bedrock AgentCore Runtime." } }
    - { id: c, text: { en: "Rebuild the agent as an Amazon Lex bot.", fr: "Recréer l'agent sous forme de bot Amazon Lex." } }
    - { id: d, text: { en: "Deploy the agent to a SageMaker AI real-time endpoint.", fr: "Déployer l'agent sur un point de terminaison en temps réel SageMaker AI." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AgentCore Runtime is a secure, serverless environment to deploy and scale agents and tools, with session isolation and built-in identity. AgentCore works with any framework, including LangGraph, CrewAI, LlamaIndex and Strands Agents, so the agent does not need to be rewritten."
    fr: "AgentCore Runtime est un environnement sécurisé et sans serveur pour déployer et mettre à l'échelle des agents et des outils, avec isolation des sessions et identité intégrée. AgentCore fonctionne avec n'importe quel framework, dont LangGraph, CrewAI, LlamaIndex et Strands Agents ; il n'est donc pas nécessaire de réécrire l'agent."
  options:
    a:
      en: "An EC2 Auto Scaling group means managing instances, which the bank wants to avoid, and it does not isolate sessions by itself."
      fr: "Un groupe Auto Scaling EC2 implique de gérer des instances, ce que la banque veut éviter, et il n'isole pas les sessions à lui seul."
    c:
      en: "Rebuilding the agent in Amazon Lex throws away the existing LangGraph code; Lex builds intent-based bots, not a runtime for framework agents."
      fr: "Recréer l'agent dans Amazon Lex abandonne le code LangGraph existant ; Lex crée des bots basés sur des intentions, pas un environnement d'exécution pour des agents de frameworks."
    d:
      en: "A SageMaker AI real-time endpoint hosts a model on instances that you choose and pay for by the hour; it is not a serverless agent runtime with session isolation."
      fr: "Un point de terminaison en temps réel SageMaker AI héberge un modèle sur des instances que vous choisissez et payez à l'heure ; ce n'est pas un environnement d'exécution d'agents sans serveur avec isolation des sessions."
references:
  - title: "Overview - Amazon Bedrock AgentCore"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
