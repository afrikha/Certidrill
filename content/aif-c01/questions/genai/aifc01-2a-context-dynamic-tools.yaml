id: aifc01-2a-context-dynamic-tools
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An agent built on Amazon Bedrock can use 150 tools. The application sends the definitions of all 150 tools in every prompt. Inference cost and latency are high, and the model sometimes calls a tool that is unrelated to the user's request.

    Which change will address these issues?
  fr: |
    Un agent créé sur Amazon Bedrock peut utiliser 150 outils. L'application envoie les définitions des 150 outils dans chaque invite. Le coût et la latence de l'inférence sont élevés, et le modèle appelle parfois un outil sans rapport avec la demande de l'utilisateur.

    Quelle modification résout ces problèmes ?
body:
  options:
    - { id: a, text: { en: "Include only the definitions of the tools that are relevant to the current step.", fr: "N'inclure que les définitions des outils pertinents pour l'étape en cours." } }
    - { id: b, text: { en: "Move the agent to a model with a larger context window and keep all definitions.", fr: "Passer l'agent sur un modèle à fenêtre contextuelle plus grande et conserver toutes les définitions." } }
    - { id: c, text: { en: "Fine-tune the model on the descriptions of the 150 tools.", fr: "Effectuer le réglage précis du modèle sur les descriptions des 150 outils." } }
    - { id: d, text: { en: "Lower the temperature and keep all definitions in every prompt.", fr: "Baisser la température et conserver toutes les définitions dans chaque invite." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Tool definitions are part of the context and consume tokens on every request. Selecting tools dynamically, so that only the tools relevant to the current step are sent, reduces prompt size, cost and latency, and leaves the model fewer irrelevant tools to choose from."
    fr: "Les définitions d'outils font partie du contexte et consomment des jetons à chaque requête. Sélectionner les outils de façon dynamique, pour n'envoyer que ceux qui sont pertinents pour l'étape en cours, réduit la taille de l'invite, le coût et la latence, et laisse au modèle moins d'outils hors sujet parmi lesquels choisir."
  options:
    b:
      en: "A larger context window still processes and bills all 150 definitions, so cost and latency stay high."
      fr: "Une fenêtre contextuelle plus grande traite et facture toujours les 150 définitions : le coût et la latence restent élevés."
    c:
      en: "Fine-tuning is costly, and the tool definitions would still be sent in every prompt."
      fr: "Le réglage précis est coûteux, et les définitions d'outils seraient toujours envoyées dans chaque invite."
    d:
      en: "A lower temperature makes outputs more deterministic, but the prompt keeps the same tokens, cost and latency."
      fr: "Une température plus basse rend les sorties plus déterministes, mais l'invite garde les mêmes jetons, le même coût et la même latence."
references:
  - title: "Memory, context, and RAG optimization"
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentperf03.html
