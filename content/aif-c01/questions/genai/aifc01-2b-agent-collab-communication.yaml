id: aifc01-2b-agent-collab-communication
objective: "2.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A financial research company builds a multi-agent system on AWS in which a researcher agent, an analyst agent, and a critic agent collaborate as peers to produce investment scenarios. The agents run as separate services and must exchange intermediate findings with each other while they work.

    Which two mechanisms can the agents use to exchange information? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    Une société de recherche financière crée sur AWS un système multi-agents dans lequel un agent chercheur, un agent analyste et un agent critique collaborent d'égal à égal pour produire des scénarios d'investissement. Les agents s'exécutent comme des services distincts et doivent échanger leurs résultats intermédiaires pendant leur travail.

    Quels sont les deux mécanismes que les agents peuvent utiliser pour échanger des informations ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A shared memory store, such as an Amazon DynamoDB table, that every agent reads and writes", fr: "Un magasin de mémoire partagée, comme une table Amazon DynamoDB, que chaque agent lit et écrit" } }
    - { id: b, text: { en: "Fine-tuning each agent's model on the outputs of the other agents every night", fr: "Le peaufinage nocturne du modèle de chaque agent sur les sorties des autres agents" } }
    - { id: c, text: { en: "Message passing through queues or events, such as Amazon SQS or Amazon EventBridge", fr: "L'échange de messages par des files d'attente ou des événements, comme Amazon SQS ou Amazon EventBridge" } }
    - { id: d, text: { en: "A larger context window for each agent's model", fr: "Une fenêtre de contexte plus large pour le modèle de chaque agent" } }
    - { id: e, text: { en: "The short-term memory of each agent's own session, kept private to that agent", fr: "La mémoire à court terme de la session propre à chaque agent, réservée à cet agent" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "In multi-agent collaboration, agents communicate through shared memory (a blackboard that can be built on Amazon DynamoDB, Amazon S3, or OpenSearch) or by exchanging messages through queues and events (Amazon SQS, Amazon EventBridge). Either mechanism lets independent agents share findings while they work."
    fr: "Dans la collaboration multi-agents, les agents communiquent par une mémoire partagée (un tableau noir, ou blackboard, qui peut s'appuyer sur Amazon DynamoDB, Amazon S3 ou OpenSearch) ou en échangeant des messages par des files d'attente et des événements (Amazon SQS, Amazon EventBridge). L'un ou l'autre mécanisme permet à des agents indépendants de partager leurs résultats pendant leur travail."
  options:
    b:
      en: "Nightly fine-tuning changes model weights after the fact; it is not a way to exchange findings during a task."
      fr: "Un peaufinage nocturne modifie les pondérations du modèle après coup ; ce n'est pas un moyen d'échanger des résultats pendant une tâche."
    d:
      en: "A larger context window lets one model read more input, but it does not move information between separate agents."
      fr: "Une fenêtre de contexte plus large permet à un modèle de lire plus d'entrées, mais elle ne transmet pas d'informations entre des agents distincts."
    e:
      en: "Session memory that is private to one agent cannot be read by the other agents."
      fr: "Une mémoire de session réservée à un agent ne peut pas être lue par les autres agents."
references:
  - title: "Multi-agent collaboration"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/multi-agent-collaboration.html
