id: aifc01-2c-adv-multi-vs-ec2
objective: "2.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A software company currently hosts an open-source large language model on Amazon EC2 GPU instances that its team manages. The company is evaluating Amazon Bedrock for its next generative AI application.

    Which two advantages would the company gain by using Amazon Bedrock? (Choose two.)
  fr: |
    Un éditeur de logiciels héberge actuellement un grand modèle de langage open source sur des instances GPU Amazon EC2 que son équipe gère. L'entreprise évalue Amazon Bedrock pour sa prochaine application d'IA générative.

    Quels sont les deux avantages dont l'entreprise bénéficierait en utilisant Amazon Bedrock ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "There are no servers to provision, patch or scale for model inference.", fr: "Il n'y a aucun serveur à provisionner, corriger ou mettre à l'échelle pour l'inférence des modèles." } }
    - { id: b, text: { en: "Model responses are guaranteed to be accurate without any testing.", fr: "Les réponses des modèles sont garanties exactes sans aucun test." } }
    - { id: c, text: { en: "Models from several providers are available through one API.", fr: "Des modèles de plusieurs fournisseurs sont disponibles au moyen d'une seule API." } }
    - { id: d, text: { en: "AWS takes responsibility for the data that the company sends in prompts.", fr: "AWS assume la responsabilité des données que l'entreprise envoie dans les invites." } }
    - { id: e, text: { en: "Every model can be downloaded and run on premises.", fr: "Chaque modèle peut être téléchargé et exécuté sur site." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Bedrock is serverless, so the company no longer provisions, patches or scales GPU instances. Bedrock also offers foundation models from many providers (Amazon, Anthropic, Meta, Mistral AI and others) through a single API, so the company can choose and change models easily."
    fr: "Bedrock est sans serveur ; l'entreprise n'a donc plus à provisionner, corriger ni mettre à l'échelle des instances GPU. Bedrock propose aussi des modèles de fondation de nombreux fournisseurs (Amazon, Anthropic, Meta, Mistral AI, etc.) au moyen d'une seule API, ce qui permet de choisir et de changer facilement de modèle."
  options:
    b:
      en: "Foundation models can still produce inaccurate output; the company must evaluate the models for its use case."
      fr: "Les modèles de fondation peuvent toujours produire des résultats inexacts ; l'entreprise doit évaluer les modèles pour son cas d'utilisation."
    d:
      en: "Under the shared responsibility model, the customer stays responsible for its data, its classification and who can access it."
      fr: "Selon le modèle de responsabilité partagée, le client reste responsable de ses données, de leur classification et de qui peut y accéder."
    e:
      en: "Bedrock provides access to models as a managed AWS service; it does not let customers download every model to run it on premises."
      fr: "Bedrock donne accès aux modèles en tant que service AWS géré ; il ne permet pas aux clients de télécharger chaque modèle pour l'exécuter sur site."
references:
  - title: "Amazon Bedrock FAQs"
    url: https://aws.amazon.com/bedrock/faqs/
