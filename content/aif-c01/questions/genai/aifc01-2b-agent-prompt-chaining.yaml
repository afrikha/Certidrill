id: aifc01-2b-agent-prompt-chaining
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company builds an assistant that answers analysts' questions in three steps: search the sources, extract the relevant facts, and then write the answer. Each step is a separate LLM call that uses the output of the previous step. The company must be able to audit each intermediate result and to add a validation check between the steps.

    Which agentic workflow pattern meets these requirements?
  fr: |
    Une société d'études crée un assistant qui répond aux questions des analystes en trois étapes : rechercher les sources, extraire les faits pertinents, puis rédiger la réponse. Chaque étape est un appel LLM distinct qui utilise la sortie de l'étape précédente. L'entreprise doit pouvoir auditer chaque résultat intermédiaire et ajouter un contrôle de validation entre les étapes.

    Quel modèle de flux de travail agentique répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Parallelization", fr: "Parallélisation" } }
    - { id: b, text: { en: "Routing", fr: "Routage (routing)" } }
    - { id: c, text: { en: "Peer-to-peer multi-agent collaboration", fr: "Collaboration multi-agents pair à pair" } }
    - { id: d, text: { en: "Prompt chaining", fr: "Enchaînement d'invites (prompt chaining)" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Prompt chaining breaks a complex task into a sequence of discrete LLM calls in which each step builds on the output of the previous one. The intermediate results can be audited, and validation, filtering, or enrichment logic can be inserted between steps, as in a search, extract, answer pipeline."
    fr: "L'enchaînement d'invites découpe une tâche complexe en une séquence d'appels LLM distincts dans laquelle chaque étape s'appuie sur la sortie de la précédente. Les résultats intermédiaires peuvent être audités, et une logique de validation, de filtrage ou d'enrichissement peut être insérée entre les étapes, comme dans un pipeline recherche, extraction, réponse."
  options:
    a:
      en: "Parallelization fits subtasks that do not depend on each other's results; here each step needs the previous output."
      fr: "La parallélisation convient aux sous-tâches qui ne dépendent pas des résultats des autres ; ici, chaque étape a besoin de la sortie précédente."
    b:
      en: "Routing sends each input to one specialized handler; it does not run a fixed sequence of dependent steps."
      fr: "Le routage envoie chaque entrée à un seul gestionnaire spécialisé ; il n'exécute pas une séquence fixe d'étapes dépendantes."
    c:
      en: "Peer-to-peer collaboration relies on emergent coordination between agents, which is harder to audit than a fixed sequence of steps."
      fr: "La collaboration pair à pair repose sur une coordination émergente entre agents, plus difficile à auditer qu'une séquence fixe d'étapes."
references:
  - title: "Workflow for prompt chaining"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/workflow-for-prompt-chaining.html
