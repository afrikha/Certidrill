id: aifc01-2b-sel-dd-factor-categories
objective: "2.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    A retail company writes the requirements for the foundation model of its new shopping assistant.

    Match each requirement to the selection factor that it belongs to. To answer, drag the appropriate factor to each requirement. Each factor may be used once or not at all.
  fr: |
    Une enseigne de distribution rédige les exigences relatives au modèle de fondation de son nouvel assistant d'achat.

    Associez chaque exigence au facteur de sélection auquel elle appartient. Pour répondre, faites glisser le facteur approprié vers chaque exigence. Chaque facteur peut être utilisé une fois ou pas du tout.
body:
  reuse: false
  items:
    - { id: lat, text: { en: "Latency", fr: "Latence" } }
    - { id: cost, text: { en: "Cost", fr: "Coût" } }
    - { id: comp, text: { en: "Compliance", fr: "Conformité" } }
    - { id: cap, text: { en: "Capabilities", fr: "Capacités" } }
    - { id: cplx, text: { en: "Model complexity", fr: "Complexité du modèle" } }
  targets:
    - { id: t1, text: { en: "The first words of each answer must appear in under 500 milliseconds.", fr: "Les premiers mots de chaque réponse doivent apparaître en moins de 500 millisecondes." } }
    - { id: t2, text: { en: "Monthly inference spending must stay under USD 2,000.", fr: "Les dépenses mensuelles d'inférence doivent rester inférieures à 2 000 USD." } }
    - { id: t3, text: { en: "Customer data must be processed only in approved AWS Regions.", fr: "Les données des clients doivent être traitées uniquement dans des Régions AWS approuvées." } }
    - { id: t4, text: { en: "The model must accept product photos as well as text as input.", fr: "Le modèle doit accepter des photos de produits en plus du texte en entrée." } }
answer:
  mapping: { t1: lat, t2: cost, t3: comp, t4: cap }
explanation:
  correct:
    en: "A response-time target is a latency requirement. A spending limit is a cost requirement, driven by token prices, model size, and the hosting option. Restricting where data is processed is a compliance requirement, such as data residency. Accepting images as input is a capability (modality) of the model."
    fr: "Un objectif de temps de réponse est une exigence de latence. Une limite de dépenses est une exigence de coût, qui dépend du prix des jetons, de la taille du modèle et du mode d'hébergement. Restreindre le lieu de traitement des données est une exigence de conformité, comme la résidence des données. Accepter des images en entrée est une capacité (modalité) du modèle."
  options:
    cplx:
      en: "Model complexity (size and architecture) influences cost and latency, but none of the requirements is stated in terms of model size."
      fr: "La complexité du modèle (taille et architecture) influe sur le coût et la latence, mais aucune exigence n'est formulée en termes de taille de modèle."
references:
  - title: "GENCOST01-BP01 Right-size model selection to optimize inference costs"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html
  - title: "Route model inference requests across AWS Regions with cross-Region inference"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
