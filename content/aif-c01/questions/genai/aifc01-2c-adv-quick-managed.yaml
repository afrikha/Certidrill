id: aifc01-2c-adv-quick-managed
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The operations team of an energy company wants to automate repetitive tasks across its business applications and get AI answers that are grounded in the company's own documents. The company has no ML engineers and wants a single service instead of several separate products.

    Which advantage of Amazon Quick meets these requirements?
  fr: |
    L'équipe des opérations d'une société d'énergie veut automatiser des tâches répétitives dans ses applications métier et obtenir des réponses d'IA ancrées dans les propres documents de l'entreprise. L'entreprise n'a aucun ingénieur ML et veut un seul service au lieu de plusieurs produits distincts.

    Quel avantage d'Amazon Quick répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "It lets the team train its own foundation model on the company's documents.", fr: "Il permet à l'équipe d'entraîner son propre modèle de fondation sur les documents de l'entreprise." } }
    - { id: b, text: { en: "It deploys open-source models to SageMaker AI endpoints that the team manages.", fr: "Il déploie des modèles open source sur des points de terminaison SageMaker AI que l'équipe gère." } }
    - { id: c, text: { en: "It is fully managed, with no infrastructure to provision, no models to host and no ML expertise required.", fr: "Il est entièrement géré, sans infrastructure à provisionner, sans modèle à héberger et sans expertise en ML requise." } }
    - { id: d, text: { en: "It provides an open-source SDK that developers use to code workflow agents.", fr: "Il fournit un SDK open source que les développeurs utilisent pour coder des agents de flux de travail." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Quick (AWS Quick in the current documentation) is fully managed and requires no ML expertise: there is no infrastructure to provision and no model to host. In one service, Quick Flows and Quick Automate automate tasks across connected applications, and Quick Index connects company documents so that AI responses are grounded in them."
    fr: "Amazon Quick (AWS Quick dans la documentation actuelle) est entièrement géré et ne demande aucune expertise en ML : il n'y a ni infrastructure à provisionner ni modèle à héberger. Dans un seul service, Quick Flows et Quick Automate automatisent des tâches dans les applications connectées, et Quick Index connecte les documents de l'entreprise pour que les réponses de l'IA s'y ancrent."
  options:
    a:
      en: "Quick does not train foundation models; it grounds responses in connected documents through Quick Index."
      fr: "Quick n'entraîne pas de modèles de fondation ; il ancre les réponses dans les documents connectés au moyen de Quick Index."
    b:
      en: "Deploying models to SageMaker AI endpoints requires ML skills and hosting, which Quick avoids."
      fr: "Déployer des modèles sur des points de terminaison SageMaker AI exige des compétences en ML et un hébergement, ce que Quick évite."
    d:
      en: "An open-source SDK for coding agents describes Strands Agents, not Quick, and requires developers."
      fr: "Un SDK open source pour coder des agents correspond à Strands Agents, pas à Quick, et exige des développeurs."
references:
  - title: "What is AWS Quick?"
    url: https://docs.aws.amazon.com/quick/latest/userguide/what-is.html
