id: aifc01-2b-agent-excessive-agency
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company uses an AI agent that can call a refund API. During testing, the agent issued refunds that were outside its intended scope. The company wants to reduce the risk of the agent taking actions beyond its purpose.

    Which two actions should the company take? (Choose two.) Each correct answer presents part of the solution.
  fr: |
    Une enseigne de distribution utilise un agent d'IA qui peut appeler une API de remboursement. Pendant les tests, l'agent a émis des remboursements qui sortaient de son périmètre prévu. L'entreprise veut réduire le risque que l'agent effectue des actions au-delà de sa finalité.

    Quelles sont les deux actions que l'entreprise doit effectuer ? (Choisissez deux réponses.) Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Give the agent's execution role broad permissions so that its tool calls never fail.", fr: "Accorder au rôle d'exécution de l'agent des autorisations étendues pour que ses appels d'outils n'échouent jamais." } }
    - { id: b, text: { en: "Scope the agent's IAM role to the specific API actions and resources it needs.", fr: "Limiter le rôle IAM de l'agent aux actions d'API et aux ressources précises dont il a besoin." } }
    - { id: c, text: { en: "Raise the temperature so that the agent considers more alternatives before acting.", fr: "Augmenter la température pour que l'agent envisage davantage d'alternatives avant d'agir." } }
    - { id: d, text: { en: "Require a user to confirm each refund before the agent runs the action.", fr: "Exiger qu'un utilisateur confirme chaque remboursement avant que l'agent n'exécute l'action." } }
    - { id: e, text: { en: "Store all past refunds in the agent's long-term memory.", fr: "Stocker tous les remboursements passés dans la mémoire à long terme de l'agent." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Excessive agency happens when an agent decides to take actions beyond its intended scope. AWS recommends least-privilege IAM roles scoped to specific actions and resources, with permissions boundaries, and a user confirmation step before sensitive actions run."
    fr: "L'agentivité excessive se produit quand un agent décide d'effectuer des actions au-delà de son périmètre prévu. AWS recommande des rôles IAM au moindre privilège, limités à des actions et ressources précises, avec des limites d'autorisations, ainsi qu'une étape de confirmation par l'utilisateur avant l'exécution des actions sensibles."
  options:
    a:
      en: "Broad permissions increase the impact of excessive agency instead of limiting it."
      fr: "Des autorisations étendues augmentent l'impact de l'agentivité excessive au lieu de le limiter."
    c:
      en: "A higher temperature makes the agent's choices more random, not more controlled."
      fr: "Une température plus élevée rend les choix de l'agent plus aléatoires, pas mieux contrôlés."
    e:
      en: "Memory of past refunds does not restrict which actions the agent is allowed to perform."
      fr: "La mémoire des remboursements passés ne restreint pas les actions que l'agent est autorisé à effectuer."
references:
  - title: "GENSEC05-BP01 Implement least privilege access and permissions boundaries for agentic workflows"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gensec05-bp01.html
