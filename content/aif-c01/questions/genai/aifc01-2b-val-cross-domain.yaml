id: aifc01-2b-val-cross-domain
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company plans one generative AI assistant to answer HR, IT, and finance questions. In the current test set, 70% of the questions are about IT, and the assistant reaches 92% accuracy overall. Before deployment, leadership wants evidence that the assistant performs well in every domain.

    Which evaluation approach meets this requirement?
  fr: |
    Une entreprise prévoit un seul assistant d'IA générative pour répondre aux questions RH, informatiques et financières. Dans le jeu de test actuel, 70 % des questions portent sur l'informatique, et l'assistant atteint une exactitude globale de 92 %. Avant le déploiement, la direction veut la preuve que l'assistant est performant dans chaque domaine.

    Quelle approche d'évaluation répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Measure accuracy separately for HR, IT, and finance questions on a test set that covers each domain.", fr: "Mesurer l'exactitude séparément pour les questions RH, informatiques et financières sur un jeu de test qui couvre chaque domaine." } }
    - { id: b, text: { en: "Report the overall accuracy of 92% as evidence for all three domains.", fr: "Présenter l'exactitude globale de 92 % comme preuve pour les trois domaines." } }
    - { id: c, text: { en: "Measure accuracy on IT questions only, because they are the largest share.", fr: "Mesurer l'exactitude sur les seules questions informatiques, car elles sont les plus nombreuses." } }
    - { id: d, text: { en: "Measure the average latency of answers in each domain.", fr: "Mesurer la latence moyenne des réponses dans chaque domaine." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Cross-domain performance measures how well one solution performs across several domains. An overall score dominated by IT questions can hide poor results in HR or finance, so the company must evaluate each domain with test data that represents it, as AWS recommends for custom evaluations on a company's own use cases."
    fr: "Les performances interdomaines mesurent la qualité d'une même solution dans plusieurs domaines. Un score global dominé par les questions informatiques peut masquer de mauvais résultats en RH ou en finance : l'entreprise doit évaluer chaque domaine avec des données de test représentatives, comme AWS le recommande pour les évaluations personnalisées sur les cas d'usage propres à l'entreprise."
  options:
    b:
      en: "With 70% IT questions, the overall score mostly reflects IT and can hide weak HR or finance results."
      fr: "Avec 70 % de questions informatiques, le score global reflète surtout l'informatique et peut masquer de faibles résultats en RH ou en finance."
    c:
      en: "Testing IT alone gives no evidence for HR and finance."
      fr: "Tester l'informatique seule n'apporte aucune preuve pour les RH et la finance."
    d:
      en: "Latency shows speed, not whether the answers are correct in each domain."
      fr: "La latence indique la rapidité, pas l'exactitude des réponses dans chaque domaine."
references:
  - title: "Layer 2: Approved set of foundation models and tools"
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/strategy-enterprise-ready-gen-ai-platform/model.html
  - title: "Evaluate the performance of Amazon Bedrock resources"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
