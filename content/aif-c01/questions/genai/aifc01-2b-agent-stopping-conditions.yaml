id: aifc01-2b-agent-stopping-conditions
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs an AI agent that plans deliveries by calling several tools in a loop. Some runs keep calling tools for a long time after a useful result is available, and the monthly cost of the agent is unpredictable. The company wants to be able to predict the maximum cost of each run.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute un agent d'IA qui planifie les livraisons en appelant plusieurs outils en boucle. Certaines exécutions continuent d'appeler des outils longtemps après qu'un résultat utile est disponible, et le coût mensuel de l'agent est imprévisible. L'entreprise veut pouvoir prévoir le coût maximal de chaque exécution.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set stopping conditions such as a timeout on each run, timeouts on tool calls, and token limits on responses.", fr: "Définir des conditions d'arrêt comme un délai d'expiration par exécution, des délais d'expiration sur les appels d'outils et des limites de jetons sur les réponses." } }
    - { id: b, text: { en: "Raise the temperature of the model so that the agent explores more options in each run.", fr: "Augmenter la température du modèle pour que l'agent explore davantage d'options à chaque exécution." } }
    - { id: c, text: { en: "Add long-term memory so that the agent remembers the plans of previous runs.", fr: "Ajouter une mémoire à long terme pour que l'agent se souvienne des plans des exécutions précédentes." } }
    - { id: d, text: { en: "Switch the agent to a larger model with a larger context window.", fr: "Passer l'agent sur un modèle plus grand doté d'une fenêtre contextuelle plus large." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Agentic workflows consume tokens, tool execution time, and external calls for as long as they run. Stopping conditions, such as a maximum runtime, timeouts on external tools, and token limits on model responses, bound each run so that its maximum cost can be predicted."
    fr: "Les flux de travail agentiques consomment des jetons, du temps d'exécution d'outils et des appels externes tant qu'ils s'exécutent. Des conditions d'arrêt, comme une durée maximale d'exécution, des délais d'expiration sur les outils externes et des limites de jetons sur les réponses du modèle, bornent chaque exécution afin d'en prévoir le coût maximal."
  options:
    b:
      en: "A higher temperature makes responses more random; it does not limit how long the agent runs and can make the loop less predictable."
      fr: "Une température plus élevée rend les réponses plus aléatoires ; elle ne limite pas la durée d'exécution de l'agent et peut rendre la boucle moins prévisible."
    c:
      en: "Long-term memory helps personalization across sessions; it does not put an upper limit on a run."
      fr: "La mémoire à long terme aide à la personnalisation d'une session à l'autre ; elle ne fixe pas de limite supérieure à une exécution."
    d:
      en: "A larger model usually costs more per token and still lets the loop run without limit."
      fr: "Un modèle plus grand coûte généralement plus cher par jeton et laisse toujours la boucle s'exécuter sans limite."
references:
  - title: "GENCOST05-BP01 Create stopping conditions to control long-running workflows"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost05-bp01.html
