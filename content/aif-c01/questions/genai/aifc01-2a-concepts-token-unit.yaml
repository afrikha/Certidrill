id: aifc01-2a-concepts-token-unit
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is reviewing the on-demand pricing of a text model on Amazon Bedrock. The pricing is expressed per 1,000 tokens.

    What is a token?
  fr: |
    Une entreprise examine la tarification à la demande d'un modèle de texte sur Amazon Bedrock. Le prix est exprimé pour 1 000 jetons.

    Qu'est-ce qu'un jeton ?
body:
  options:
    - { id: a, text: { en: "A complete sentence of the prompt or of the generated response", fr: "Une phrase complète de l'invite ou de la réponse générée" } }
    - { id: b, text: { en: "A numeric vector that represents the meaning of a document or a passage", fr: "Un vecteur numérique qui représente le sens d'un document ou d'un passage" } }
    - { id: c, text: { en: "A sequence of characters that the model treats as a single unit of meaning", fr: "Une séquence de caractères que le modèle traite comme une seule unité de sens" } }
    - { id: d, text: { en: "A single API call that the application sends to the model endpoint", fr: "Un appel d'API unique que l'application envoie au point de terminaison du modèle" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A token is a sequence of characters that a model interprets or predicts as one unit of meaning. A token can be a whole word, a part of a word such as a suffix, a punctuation mark, or a common phrase. Text models on Amazon Bedrock are billed by the number of input and output tokens they process."
    fr: "Un jeton est une séquence de caractères qu'un modèle interprète ou prédit comme une seule unité de sens. Un jeton peut être un mot entier, une partie de mot comme un suffixe, un signe de ponctuation ou une expression courante. Les modèles de texte d'Amazon Bedrock sont facturés selon le nombre de jetons d'entrée et de sortie qu'ils traitent."
  options:
    a:
      en: "A sentence is usually made of many tokens; tokens are smaller units such as words or parts of words."
      fr: "Une phrase compte en général de nombreux jetons ; les jetons sont des unités plus petites, comme des mots ou des parties de mots."
    b:
      en: "A numeric vector that represents meaning is an embedding, not a token."
      fr: "Un vecteur numérique qui représente le sens est une vectorisation, pas un jeton."
    d:
      en: "One API call contains many tokens; token-based pricing counts the tokens processed, not the calls."
      fr: "Un appel d'API contient de nombreux jetons ; la tarification par jeton compte les jetons traités, pas les appels."
references:
  - title: "Key terminology"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html
