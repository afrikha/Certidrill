id: aifc01-2b-adv-content-generation
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online retailer adds 20,000 new products to its catalog. The marketing team needs a first draft of a description for each product, in one tone for the website and in another tone for social media. Editors will review the drafts.

    Which advantage of generative AI addresses this need?
  fr: |
    Un détaillant en ligne ajoute 20 000 nouveaux produits à son catalogue. L'équipe marketing a besoin d'un premier jet de description pour chaque produit, dans un ton pour le site web et dans un autre pour les réseaux sociaux. Des rédacteurs reliront les brouillons.

    Quel avantage de l'IA générative répond à ce besoin ?
body:
  options:
    - { id: a, text: { en: "Interpretability", fr: "Interprétabilité" } }
    - { id: b, text: { en: "Ability to generate content", fr: "Capacité à générer du contenu" } }
    - { id: c, text: { en: "Conversational capabilities", fr: "Capacités conversationnelles" } }
    - { id: d, text: { en: "Deterministic outputs", fr: "Des sorties déterministes" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Generative AI creates new content, such as text, images, or code, from a prompt. It can produce first drafts of thousands of product descriptions in several styles much faster than writing them by hand, which boosts the productivity of the marketing team."
    fr: "L'IA générative crée du contenu nouveau, comme du texte, des images ou du code, à partir d'une invite. Elle peut produire les premiers jets de milliers de descriptions de produits dans plusieurs styles bien plus vite qu'une rédaction manuelle, ce qui accroît la productivité de l'équipe marketing."
  options:
    a:
      en: "Interpretability is a limitation of generative AI, not the reason it helps produce drafts."
      fr: "L'interprétabilité est une limite de l'IA générative, pas la raison pour laquelle elle aide à produire des brouillons."
    c:
      en: "No dialogue with a user is involved; the need is to produce large amounts of new text."
      fr: "Aucun dialogue avec un utilisateur n'intervient ; le besoin est de produire de grandes quantités de texte nouveau."
    d:
      en: "Generative AI outputs vary from one run to the next; determinism is not one of its advantages."
      fr: "Les sorties de l'IA générative varient d'une exécution à l'autre ; le déterminisme ne fait pas partie de ses avantages."
references:
  - title: "What is Generative AI?"
    url: https://aws.amazon.com/what-is/generative-ai/
