id: aifc01-2a-tokens-priority-tier
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's customer-facing chat application uses an Amazon Bedrock model. During traffic peaks, the application needs the fastest possible response times. The company accepts a higher price per token, but it does not want a term commitment or to contact its AWS account team.

    Which option will meet these requirements?
  fr: |
    L'application de chat destinée aux clients d'une entreprise utilise un modèle Amazon Bedrock. Pendant les pics de trafic, l'application a besoin des temps de réponse les plus rapides possible. L'entreprise accepte un prix par jeton plus élevé, mais elle ne veut ni engagement de durée ni contacter son équipe de compte AWS.

    Quelle option répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "The Reserved service tier", fr: "Le niveau de service Reserved" } }
    - { id: b, text: { en: "The Flex service tier", fr: "Le niveau de service Flex" } }
    - { id: c, text: { en: "The Standard service tier", fr: "Le niveau de service Standard" } }
    - { id: d, text: { en: "The Priority service tier", fr: "Le niveau de service Priority" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The Priority tier is set on each request, has no term commitment and gives the fastest response times: its requests are prioritized over Standard and Flex requests. In exchange, it costs more per token than the Standard tier."
    fr: "Le niveau Priority se définit à chaque requête, sans engagement de durée, et offre les temps de réponse les plus rapides : ses requêtes passent avant celles des niveaux Standard et Flex. En contrepartie, il coûte plus cher par jeton que le niveau Standard."
  options:
    a:
      en: "The Reserved tier requires a 1-month or 3-month term at a fixed monthly price and is set up through the AWS account team."
      fr: "Le niveau Reserved exige une durée de 1 ou 3 mois à prix mensuel fixe et se met en place via l'équipe de compte AWS."
    b:
      en: "The Flex tier is discounted because it accepts longer processing times, the opposite of the requirement."
      fr: "Le niveau Flex est moins cher parce qu'il accepte des temps de traitement plus longs, à l'opposé de l'exigence."
    c:
      en: "The Standard tier is the default tier; its requests are not prioritized during peaks."
      fr: "Le niveau Standard est le niveau par défaut ; ses requêtes ne sont pas prioritaires pendant les pics."
references:
  - title: "Service tiers for optimizing performance and cost"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
