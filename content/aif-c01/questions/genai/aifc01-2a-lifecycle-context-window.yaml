id: aifc01-2a-lifecycle-context-window
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal team is selecting a foundation model (FM) on Amazon Bedrock. The team must send a complete contract of about 250,000 tokens to the model in a single request and receive a text analysis.

    Which model characteristic is MOST important for this requirement?
  fr: |
    Une équipe juridique sélectionne un modèle de fondation (FM) sur Amazon Bedrock. L'équipe doit envoyer au modèle un contrat complet d'environ 250 000 jetons en une seule requête et recevoir une analyse textuelle.

    Quelle caractéristique du modèle est la PLUS importante pour cette exigence ?
body:
  options:
    - { id: a, text: { en: "The ability of the model to generate images", fr: "La capacité du modèle à générer des images" } }
    - { id: b, text: { en: "The default value of the temperature parameter", fr: "La valeur par défaut du paramètre de température" } }
    - { id: c, text: { en: "The support of the model for fine-tuning", fr: "La prise en charge du fine-tuning par le modèle" } }
    - { id: d, text: { en: "The size of the context window", fr: "La taille de la fenêtre de contexte" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The context window is the amount of input, in tokens, that a model can process in one request. A 250,000-token contract fits only in a model with a larger context window, for example Amazon Nova Pro (300K tokens) or Amazon Nova 2 Lite (up to 1 million tokens), not Amazon Nova Micro (128K tokens)."
    fr: "La fenêtre de contexte est la quantité d'entrée, en jetons, qu'un modèle peut traiter en une requête. Un contrat de 250 000 jetons ne tient que dans un modèle à fenêtre de contexte plus grande, par exemple Amazon Nova Pro (300 000 jetons) ou Amazon Nova 2 Lite (jusqu'à 1 million de jetons), pas Amazon Nova Micro (128 000 jetons)."
  options:
    a:
      en: "The team needs a text analysis, so image generation does not matter."
      fr: "L'équipe a besoin d'une analyse textuelle : la génération d'images n'a pas d'importance."
    b:
      en: "Temperature can be set on each request; its default value does not decide whether the contract fits."
      fr: "La température se règle à chaque requête ; sa valeur par défaut ne détermine pas si le contrat tient dans la requête."
    c:
      en: "Fine-tuning changes how the model behaves, not how many tokens it accepts in one request."
      fr: "Le fine-tuning modifie le comportement du modèle, pas le nombre de jetons qu'il accepte en une requête."
references:
  - title: "What is Amazon Nova?"
    url: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
  - title: "What is Amazon Nova 2?"
    url: https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html
