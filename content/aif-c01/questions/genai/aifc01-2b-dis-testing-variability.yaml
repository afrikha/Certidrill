id: aifc01-2b-dis-testing-variability
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A quality assurance team tests a generative AI assistant by comparing each answer with an exact expected string. The tests fail randomly, even when a reviewer confirms that the answers are correct.

    Which testing approach should the team use instead?
  fr: |
    Une équipe d'assurance qualité teste un assistant d'IA générative en comparant chaque réponse à une chaîne exacte attendue. Les tests échouent de façon aléatoire, même quand un relecteur confirme que les réponses sont correctes.

    Quelle approche de test l'équipe doit-elle plutôt utiliser ?
body:
  options:
    - { id: a, text: { en: "Keep the exact-match tests and rerun each failed test until it passes.", fr: "Conserver les tests de correspondance exacte et relancer chaque test échoué jusqu'à ce qu'il réussisse." } }
    - { id: b, text: { en: "Evaluate answers against a ground truth dataset with similarity metrics or an LLM-as-a-judge.", fr: "Évaluer les réponses par rapport à un jeu de données de référence (ground truth) avec des métriques de similarité ou un LLM-as-a-judge." } }
    - { id: c, text: { en: "Increase the maximum output length so that every answer contains the expected string.", fr: "Augmenter la longueur maximale de sortie pour que chaque réponse contienne la chaîne attendue." } }
    - { id: d, text: { en: "Test the assistant only once for each release to reduce the number of failures.", fr: "Ne tester l'assistant qu'une fois par version pour réduire le nombre d'échecs." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Foundation models are nondeterministic, so a correct answer can be worded differently on each run and exact string matching fails. Evaluating responses against ground truth prompts and responses with similarity metrics, or with a separate LLM acting as a judge, measures whether the answer is correct regardless of wording."
    fr: "Les modèles de fondation sont non déterministes : une réponse correcte peut être formulée différemment à chaque exécution, et la correspondance exacte de chaînes échoue. Évaluer les réponses par rapport à des invites et réponses de référence avec des métriques de similarité, ou avec un LLM distinct jouant le rôle de juge, mesure si la réponse est correcte quelle que soit sa formulation."
  options:
    a:
      en: "Rerunning until a test passes hides real failures and does not address the variability of wording."
      fr: "Relancer jusqu'à la réussite masque les vrais échecs et ne traite pas la variabilité de la formulation."
    c:
      en: "A longer output does not make the wording match an exact expected string."
      fr: "Une sortie plus longue ne fait pas correspondre la formulation à une chaîne exacte attendue."
    d:
      en: "Fewer test runs reduce coverage; the answers still vary between runs."
      fr: "Moins d'exécutions de tests réduisent la couverture ; les réponses varient toujours d'une exécution à l'autre."
references:
  - title: "GENPERF02-BP02 Optimize inference parameters to improve response quality"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/genperf02-bp02.html
  - title: "Evaluate the performance of Amazon Bedrock resources"
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
