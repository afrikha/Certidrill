id: aifc01-2a-context-summarize-history
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A support assistant sends the full conversation history to the model on every turn. In long sessions, the prompt size, the latency and the token cost grow with each turn, even though the oldest messages are rarely useful.

    Which solution will keep the prompt size under control while preserving the important context?
  fr: |
    Un assistant de support envoie l'historique complet de la conversation au modèle à chaque tour. Dans les longues sessions, la taille de l'invite, la latence et le coût en jetons augmentent à chaque tour, alors que les messages les plus anciens sont rarement utiles.

    Quelle solution maîtrisera la taille de l'invite tout en préservant le contexte important ?
body:
  options:
    - { id: a, text: { en: "Drop the conversation history and send only the latest message.", fr: "Abandonner l'historique de conversation et n'envoyer que le dernier message." } }
    - { id: b, text: { en: "Move the assistant to a model with a larger context window.", fr: "Passer l'assistant sur un modèle à fenêtre contextuelle plus grande." } }
    - { id: c, text: { en: "Summarize the older turns and keep the recent turns verbatim.", fr: "Résumer les tours les plus anciens et conserver les tours récents mot pour mot." } }
    - { id: d, text: { en: "Raise the maximum response length of the model.", fr: "Augmenter la longueur maximale de réponse du modèle." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Sending the whole history without summarization makes prompt size and latency grow with the session length. Summarizing older turns while keeping the recent ones in full keeps the useful context and decouples the prompt size from the length of the session."
    fr: "Envoyer tout l'historique sans le résumer fait croître la taille de l'invite et la latence avec la longueur de la session. Résumer les anciens tours en gardant les récents en entier conserve le contexte utile et rend la taille de l'invite indépendante de la longueur de la session."
  options:
    a:
      en: "Without any history, the model loses the context of the conversation and cannot resolve follow-up questions."
      fr: "Sans historique, le modèle perd le contexte de la conversation et ne peut plus traiter les questions de suivi."
    b:
      en: "A larger context window accepts more tokens, but every token is still billed and processed, so cost and latency keep growing."
      fr: "Une fenêtre contextuelle plus grande accepte davantage de jetons, mais chaque jeton reste facturé et traité : le coût et la latence continuent d'augmenter."
    d:
      en: "The response length limit controls the output, not the size of the history sent as input."
      fr: "La limite de longueur de réponse contrôle la sortie, pas la taille de l'historique envoyé en entrée."
references:
  - title: "Memory, context, and RAG optimization"
    url: https://docs.aws.amazon.com/wellarchitected/latest/agentic-ai-lens/agentperf03.html
