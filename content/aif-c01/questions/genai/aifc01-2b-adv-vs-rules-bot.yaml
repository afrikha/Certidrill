id: aifc01-2b-adv-vs-rules-bot
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An energy company's support chatbot follows a decision tree. It fails when customers phrase questions in ways that the designers did not anticipate, and every new type of question needs new rules. The company wants an assistant that handles unanticipated wording and new types of questions with the LEAST ongoing maintenance. Answers must be based on the company's published policies.

    Which solution will meet these requirements?
  fr: |
    Le chatbot de support d'un fournisseur d'énergie suit un arbre de décision. Il échoue quand les clients formulent leurs questions d'une manière que les concepteurs n'avaient pas prévue, et chaque nouveau type de question exige de nouvelles règles. L'entreprise veut un assistant qui gère les formulations imprévues et les nouveaux types de questions avec le MOINS de maintenance continue possible. Les réponses doivent s'appuyer sur les politiques publiées de l'entreprise.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add more rules and synonyms to the decision tree for each new type of question.", fr: "Ajouter davantage de règles et de synonymes à l'arbre de décision pour chaque nouveau type de question." } }
    - { id: b, text: { en: "Use a foundation model assistant that answers in natural language from the policy documents added to its context.", fr: "Utiliser un assistant basé sur un modèle de fondation qui répond en langage naturel à partir des documents de politique ajoutés à son contexte." } }
    - { id: c, text: { en: "Train an intent classifier on past chats and map each intent to a fixed, prewritten answer.", fr: "Entraîner un classifieur d'intentions sur les anciennes conversations et associer chaque intention à une réponse fixe déjà rédigée." } }
    - { id: d, text: { en: "Replace the chatbot with a keyword search page over the policy documents.", fr: "Remplacer le chatbot par une page de recherche par mots-clés dans les documents de politique." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A foundation model understands questions however they are phrased and generates answers in natural language, so new types of questions do not need new rules or a new model. Adding the company's policy documents to the context grounds the answers in those policies."
    fr: "Un modèle de fondation comprend les questions quelle que soit leur formulation et génère des réponses en langage naturel : les nouveaux types de questions ne demandent ni nouvelles règles ni nouveau modèle. Ajouter les documents de politique de l'entreprise au contexte ancre les réponses dans ces politiques."
  options:
    a:
      en: "More rules keep the maintenance burden that the company wants to remove and still fail on unanticipated wording."
      fr: "Davantage de règles maintiennent la charge de maintenance que l'entreprise veut supprimer et échouent toujours face aux formulations imprévues."
    c:
      en: "A classifier handles varied wording for known intents, but every new type of question needs new labeled data, retraining, and a new prewritten answer."
      fr: "Un classifieur gère les formulations variées des intentions connues, mais chaque nouveau type de question exige de nouvelles données étiquetées, un réentraînement et une nouvelle réponse rédigée."
    d:
      en: "Keyword search returns documents instead of answering, and it depends on customers using the right keywords."
      fr: "La recherche par mots-clés renvoie des documents au lieu de répondre, et elle dépend de l'emploi des bons mots-clés par les clients."
references:
  - title: "What are Foundation Models?"
    url: https://aws.amazon.com/what-is/foundation-models/
  - title: "Definitions - Generative AI Lens"
    url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/definitions.html
