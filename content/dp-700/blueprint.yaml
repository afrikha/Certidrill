# DP-700 — Implementing Data Engineering Solutions Using Microsoft Fabric
# (Microsoft Certified: Fabric Data Engineer Associate)
# Source: official study guide, "Skills measured as of October 19, 2026" (checked on 2026-11-16):
# https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700
# WARNING: on 2026-11-16 the en-us, en-ca and fr-* URLs returned an undated outline of 49 bullets (the
# first version of the guide, 2024, "Last updated on 2026-10-30"), while the en-au edition shows
# "Skills measured as of October 19, 2026" with a change log (54 bullets: Apache Airflow, audit logs,
# OneLake security, Dataflow Gen2, OneLake shortcuts in Real-Time Intelligence...) and the en-gb edition
# the previous "July 21, 2026" version of the same list. This file follows the dated October 19, 2026
# version; re-check the en-us page before publishing.
# Real exam: 100 minutes, passing score 700/1000, proctored, access to Microsoft Learn during the exam
# (associate exam); 100 minutes is the duration of exams without labs. Microsoft Learn does not say per
# exam whether there is a case study and does not publish the number of questions (40 to 60 in general).
# typeMix: more drop-down (code completion in PySpark, T-SQL, KQL) than AZ-104.
# Readiness and progression rules are those of AZ-104. active: false until the bank and the course
# are reviewed and published.
