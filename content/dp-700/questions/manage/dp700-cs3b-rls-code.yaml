id: dp700-cs3b-rls-code
objective: "1.3.3"
type: dropdown
caseStudy: dp700-cs3b-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the security requirement for dbo.FactClaim. You have already created a schema named Security in DW-Claims.

    How should you complete the T-SQL code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de sécurité relative à dbo.FactClaim. Vous avez déjà créé un schéma nommé Security dans DW-Claims.

    Comment devez-vous compléter le code T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE FUNCTION Security.fn_adjuster(@AdjusterUpn AS varchar(256))
        RETURNS TABLE
    [[bind]]
    AS
        RETURN SELECT 1 AS fn_result
        WHERE @AdjusterUpn = [[fn]];
    GO

    CREATE SECURITY POLICY Security.AdjusterFilter
    ADD [[pred]] PREDICATE Security.fn_adjuster(AdjusterUpn)
    ON dbo.FactClaim
    WITH (STATE = ON);
    GO
  slots:
    - id: bind
      options:
        - { id: schemabinding, text: WITH SCHEMABINDING }
        - { id: encryption, text: WITH ENCRYPTION }
        - { id: executeas, text: WITH EXECUTE AS OWNER }
    - id: fn
      options:
        - { id: appname, text: APP_NAME() }
        - { id: username, text: USER_NAME() }
        - { id: hostname, text: HOST_NAME() }
        - { id: dbname, text: DB_NAME() }
    - id: pred
      options:
        - { id: filter, text: FILTER }
        - { id: block, text: BLOCK }
        - { id: masked, text: MASKED }
answer:
  values: { bind: schemabinding, fn: username, pred: filter }
explanation:
  correct:
    en: "The security predicate is an inline table-valued function created `WITH SCHEMABINDING`. It returns a row when the AdjusterUpn value of the row equals `USER_NAME()`, the identity of the user who runs the query. `ADD FILTER PREDICATE` makes the security policy silently remove the other rows from the results of read operations."
    fr: "Le prédicat de sécurité est une fonction table inline créée `WITH SCHEMABINDING`. Elle renvoie une ligne quand la valeur AdjusterUpn de la ligne est égale à `USER_NAME()`, l'identité de l'utilisateur qui exécute la requête. `ADD FILTER PREDICATE` permet à la stratégie de sécurité de retirer silencieusement les autres lignes des résultats des opérations de lecture."
  options:
    encryption: { en: "WITH ENCRYPTION obfuscates the function definition; the predicate function must be schema-bound.", fr: "WITH ENCRYPTION masque la définition de la fonction ; la fonction de prédicat doit être liée au schéma." }
    executeas: { en: "EXECUTE AS changes the execution context; it does not schema-bind the function.", fr: "EXECUTE AS change le contexte d'exécution ; il ne lie pas la fonction au schéma." }
    appname: { en: "APP_NAME() returns the client application name, not the user.", fr: "APP_NAME() renvoie le nom de l'application cliente, pas l'utilisateur." }
    hostname: { en: "HOST_NAME() returns the client computer name, not the user.", fr: "HOST_NAME() renvoie le nom de l'ordinateur client, pas l'utilisateur." }
    dbname: { en: "DB_NAME() returns the database name, which is the same for every adjuster.", fr: "DB_NAME() renvoie le nom de la base de données, identique pour tous les gestionnaires." }
    block: { en: "A block predicate restricts write operations; it does not hide rows from SELECT queries.", fr: "Un prédicat BLOCK restreint les opérations d'écriture ; il ne masque pas de lignes aux requêtes SELECT." }
    masked: { en: "MASKED belongs to dynamic data masking column definitions, not to security policies.", fr: "MASKED appartient aux définitions de colonnes du masquage dynamique des données, pas aux stratégies de sécurité." }
references:
  - title: Row-level security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
