id: dp700-cs3c-shortcut-cache
objective: "1.1.3"
type: single
caseStudy: dp700-cs3c-tailspin
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the cost requirement for partner_catalog. What should you do?
  fr: |
    Vous devez satisfaire l'exigence de coût relative à partner_catalog. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In the workspace settings of WS-Sales, on the OneLake tab, enable the cache for shortcuts and set the retention period."
        fr: "Dans les paramètres de l'espace de travail WS-Sales, sous l'onglet OneLake, activer le cache des raccourcis et définir la période de rétention."
    - id: b
      text:
        en: "Create a KQL database shortcut to the S3 bucket, enable query acceleration on it, and point the notebooks to the KQL database."
        fr: "Créer un raccourci de base de données KQL vers le compartiment S3, y activer l'accélération des requêtes et faire pointer les notebooks vers la base de données KQL."
    - id: c
      text:
        en: "Delete partner_catalog and recreate it at the top level of the Tables folder of LH-Bronze."
        fr: "Supprimer partner_catalog et le recréer au niveau supérieur du dossier Tables de LH-Bronze."
    - id: d
      text:
        en: "Turn on high concurrency mode for notebooks in the Spark settings of WS-Sales so that the notebooks share one Spark session."
        fr: "Activer le mode haute concurrence pour les notebooks dans les paramètres Spark de WS-Sales afin que les notebooks partagent une session Spark."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Shortcut caching is a workspace setting on the OneLake tab that applies to Amazon S3, S3-compatible, Google Cloud Storage and gateway shortcuts. Files read through the shortcut are kept in OneLake for the retention period (1 to 28 days, reset at each access), so repeated reads no longer leave AWS. The catalog files are under 1 GB, the size above which files are not cached.
    fr: |
      La mise en cache des raccourcis est un paramètre d'espace de travail, sous l'onglet OneLake, qui s'applique aux raccourcis Amazon S3, compatibles S3, Google Cloud Storage et passerelle. Les fichiers lus via le raccourci sont conservés dans OneLake pendant la période de rétention (1 à 28 jours, réinitialisée à chaque accès) : les lectures répétées ne sortent plus d'AWS. Les fichiers du catalogue font moins de 1 Go, la taille au-delà de laquelle les fichiers ne sont pas mis en cache.
  options:
    b:
      en: |
        Query acceleration caches data for KQL queries in an eventhouse; the notebooks read the catalog with Spark, and the change would require rewriting them.
      fr: |
        L'accélération des requêtes met des données en cache pour les requêtes KQL d'un eventhouse ; les notebooks lisent le catalogue avec Spark, et ce changement imposerait de les réécrire.
    c:
      en: |
        Moving the shortcut to the Tables folder changes table discovery, not where the data is read from; every read still leaves AWS.
      fr: |
        Déplacer le raccourci dans le dossier Tables change la découverte des tables, pas l'endroit où les données sont lues ; chaque lecture sort toujours d'AWS.
    d:
      en: |
        High concurrency mode shares Spark sessions to reduce start-up time; it does not reduce the data read from S3.
      fr: |
        Le mode haute concurrence partage des sessions Spark pour réduire le temps de démarrage ; il ne réduit pas les données lues dans S3.
references:
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
