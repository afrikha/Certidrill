id: dp700-1c-ddm-mask-outputs
objective: "1.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a table named dbo.Supplier. You add the following dynamic data masks:

    - ContactEmail (varchar(100)): email()
    - Iban (varchar(34)): partial(2,"XX",2)
    - CreditLimit (int): default()

    A user who has the Viewer role queries a row in which ContactEmail is jordan@fabrikam.com, Iban is FR7630006000 and CreditLimit is 25000.

    What does the user see for each column? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée dbo.Supplier. Vous ajoutez les masques dynamiques suivants :

    - ContactEmail (varchar(100)) : email()
    - Iban (varchar(34)) : partial(2,"XX",2)
    - CreditLimit (int) : default()

    Un utilisateur qui a le rôle Viewer interroge une ligne dans laquelle ContactEmail vaut jordan@fabrikam.com, Iban vaut FR7630006000 et CreditLimit vaut 25000.

    Que voit l'utilisateur pour chaque colonne ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      ContactEmail: [[email]]
      Iban: [[iban]]
      CreditLimit: [[limit]]
    fr: |
      ContactEmail : [[email]]
      Iban : [[iban]]
      CreditLimit : [[limit]]
  slots:
    - id: email
      options:
        - { id: e1, text: "jXXX@XXXX.com" }
        - { id: e2, text: "jXXX@fabrikam.com" }
        - { id: e3, text: "XXXX@fabrikam.com" }
        - { id: e4, text: "XXXX" }
    - id: iban
      options:
        - { id: i1, text: "FRXX00" }
        - { id: i2, text: "FRXX6000" }
        - { id: i3, text: "FR76XX" }
        - { id: i4, text: "XXXX" }
    - id: limit
      options:
        - { id: l1, text: "0" }
        - { id: l2, text: "XXXX" }
        - { id: l3, text: "NULL" }
        - { id: l4, text: "25XXX" }
answer:
  values: { email: e1, iban: i1, limit: l1 }
explanation:
  correct:
    en: |
      email() keeps the first letter and replaces the rest with the constant XXX@XXXX.com, hiding the real domain. partial(2,"XX",2) keeps the first two and last two characters with XX between them. default() on a numeric column returns 0.
    fr: |
      email() garde la première lettre et remplace le reste par la constante XXX@XXXX.com, ce qui cache le vrai domaine. partial(2,"XX",2) garde les deux premiers et les deux derniers caractères, avec XX entre eux. default() sur une colonne numérique renvoie 0.
  options:
    e2: { en: "email() also hides the domain; the suffix is always XXXX.com.", fr: "email() cache aussi le domaine ; le suffixe est toujours XXXX.com." }
    i2: { en: "The suffix argument is 2, so only the last two characters are kept.", fr: "L'argument suffix vaut 2 : seuls les deux derniers caractères sont gardés." }
    l2: { en: "XXXX is the default() result for strings; numbers become 0.", fr: "XXXX est le résultat de default() pour les chaînes ; les nombres deviennent 0." }
    l3: { en: "Masking never turns a value into NULL.", fr: "Le masquage ne transforme jamais une valeur en NULL." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
