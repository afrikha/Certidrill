id: dp700-1c-ols-shortcut-target
objective: "1.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two Fabric workspaces named WS_Core and WS_Sales.

    - WS_Core contains a lakehouse named LH_Core that uses OneLake security roles. LH_Core contains a table named dbo.Products.
    - WS_Sales contains a lakehouse named LH_Sales. LH_Sales contains a OneLake shortcut named Products that points to dbo.Products in LH_Core and uses the caller's identity.

    A user named User1 has the Viewer role in WS_Sales and no access to WS_Core. User1 is a member of a OneLake security role in LH_Sales that grants Read on all the LH_Sales tables, including the shortcut. When User1 reads the Products shortcut from a notebook, access is denied.

    You need to ensure that User1 can read the Products shortcut. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez de deux espaces de travail Fabric nommés WS_Core et WS_Sales.

    - WS_Core contient un lakehouse nommé LH_Core qui utilise des rôles de sécurité OneLake. LH_Core contient une table nommée dbo.Products.
    - WS_Sales contient un lakehouse nommé LH_Sales. LH_Sales contient un raccourci OneLake nommé Products qui pointe vers dbo.Products de LH_Core et utilise l'identité de l'appelant.

    Un utilisateur nommé User1 a le rôle Viewer dans WS_Sales et aucun accès à WS_Core. User1 est membre d'un rôle de sécurité OneLake de LH_Sales qui accorde Read sur toutes les tables de LH_Sales, y compris le raccourci. Quand User1 lit le raccourci Products depuis un notebook, l'accès est refusé.

    Vous devez faire en sorte que User1 puisse lire le raccourci Products. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add User1 to a OneLake security role in LH_Core that grants Read on dbo.Products.", fr: "Ajouter User1 à un rôle de sécurité OneLake de LH_Core qui accorde Read sur dbo.Products." } }
    - { id: b, text: { en: "Assign User1 the Viewer role in WS_Core.", fr: "Attribuer à User1 le rôle Viewer dans WS_Core." } }
    - { id: c, text: { en: "Share LH_Sales with User1 and select Read all data using Apache Spark.", fr: "Partager LH_Sales avec User1 en sélectionnant Read all data using Apache Spark." } }
    - { id: d, text: { en: "Assign User1 the Contributor role in WS_Sales.", fr: "Attribuer à User1 le rôle Contributor dans WS_Sales." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A OneLake shortcut that uses the caller's identity combines the permissions on the shortcut path with the permissions on the target. When the target item uses OneLake security, the user needs a OneLake security role on the target that covers the data, here dbo.Products in LH_Core.
    fr: |
      Un raccourci OneLake qui utilise l'identité de l'appelant combine les autorisations sur le chemin du raccourci avec celles sur la cible. Quand l'élément cible utilise la sécurité OneLake, l'utilisateur a besoin d'un rôle de sécurité OneLake sur la cible qui couvre les données, ici dbo.Products dans LH_Core.
  options:
    b: { en: "A Viewer can't read lakehouse data unless a OneLake security role grants it; the role on the target is still missing.", fr: "Un Viewer ne peut pas lire les données d'un lakehouse sans rôle de sécurité OneLake qui les lui accorde ; le rôle sur la cible manque toujours." }
    c: { en: "User1 already has access on the shortcut side; the missing permission is on the target item.", fr: "User1 a déjà l'accès côté raccourci ; l'autorisation manquante concerne l'élément cible." }
    d: { en: "Write permission on LH_Sales doesn't grant access to data in LH_Core, and it exceeds least privilege.", fr: "L'autorisation d'écriture sur LH_Sales ne donne pas accès aux données de LH_Core, et dépasse le moindre privilège." }
references:
  - title: How OneLake security controls data access
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
