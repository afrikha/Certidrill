id: dp700-cs3c-event-trigger
objective: "1.4.2"
type: single
caseStudy: dp700-cs3c-tailspin
difficulty: 2
status: draft
stem:
  en: |
    You need to configure how PL-Daily starts. The solution must meet the orchestration requirements and minimize the number of pipeline runs. What should you do?
  fr: |
    Vous devez configurer le démarrage de PL-Daily. La solution doit respecter les exigences d'orchestration et réduire au minimum le nombre d'exécutions du pipeline. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add a schedule to PL-Daily that runs it every 15 minutes, and make NB-SilverOrders list the files of the landing container."
        fr: "Ajouter à PL-Daily une planification qui l'exécute toutes les 15 minutes, et faire lister les fichiers du conteneur landing par NB-SilverOrders."
    - id: b
      text:
        en: "Add a trigger to PL-Daily on OneLake events of LH-Bronze for file creation, and pass the file name from the trigger parameters."
        fr: "Ajouter à PL-Daily un déclencheur sur les événements OneLake de LH-Bronze pour la création de fichiers, et transmettre le nom du fichier depuis les paramètres du déclencheur."
    - id: c
      text:
        en: "Add a trigger to PL-Daily on Azure Blob Storage events of sttailspin for blob creation, filtered on the landing container, and pass the file name from the trigger parameters."
        fr: "Ajouter à PL-Daily un déclencheur sur les événements Stockage Blob Azure de sttailspin pour la création d'objets blob, filtré sur le conteneur landing, et transmettre le nom du fichier depuis les paramètres du déclencheur."
    - id: d
      text:
        en: "Add an Until activity to PL-Daily that runs a Get Metadata activity on the landing container until a new file appears, and run the pipeline once a day."
        fr: "Ajouter à PL-Daily une activité Until qui exécute une activité Get Metadata sur le conteneur landing jusqu'à l'apparition d'un nouveau fichier, et exécuter le pipeline une fois par jour."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A storage event trigger starts the pipeline when Azure Blob Storage raises a blob created event, and a Subject filter limits it to the landing container. The trigger parameters, such as pipeline()?.TriggerEvent?.FileName, give the pipeline the name of the file that raised the event, and the pipeline runs only when a file arrives.
    fr: |
      Un déclencheur d'événement de stockage démarre le pipeline quand Stockage Blob Azure émet un événement de création d'objet blob, et un filtre sur le champ Subject le limite au conteneur landing. Les paramètres du déclencheur, comme pipeline()?.TriggerEvent?.FileName, donnent au pipeline le nom du fichier qui a émis l'événement, et le pipeline ne s'exécute que lorsqu'un fichier arrive.
  options:
    a:
      en: |
        A 15-minute schedule runs the pipeline about 96 times a day even though files arrive only 5 to 20 times, and it does not start as soon as a file is created.
      fr: |
        Une planification toutes les 15 minutes exécute le pipeline environ 96 fois par jour alors que les fichiers n'arrivent que 5 à 20 fois, et elle ne démarre pas dès la création d'un fichier.
    b:
      en: |
        The files land in the sttailspin storage account, not in OneLake, and no shortcut points to the landing container, so LH-Bronze raises no event for them.
      fr: |
        Les fichiers arrivent dans le compte de stockage sttailspin, pas dans OneLake, et aucun raccourci ne pointe vers le conteneur landing : LH-Bronze n'émet aucun événement pour eux.
    d:
      en: |
        A daily run with a polling loop does not start as soon as each file is created and handles only one file per run.
      fr: |
        Une exécution quotidienne avec une boucle d'interrogation ne démarre pas dès la création de chaque fichier et ne traite qu'un fichier par exécution.
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-storage-event-triggers
