id: dp700-1b-dbproj-statements
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your team plans to manage the schema of a SQL database in Fabric named SQL_Claims by using an SDK-style SQL database project, and to deploy it to a test database and to a production database named SQL_Claims_Prod.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe prévoit de gérer le schéma d'une base de données SQL dans Fabric nommée SQL_Claims avec un projet de base de données SQL de style SDK, et de le déployer sur une base de données de test et sur une base de données de production nommée SQL_Claims_Prod.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Building the project requires a connection to SQL_Claims_Prod.", fr: "La génération du projet nécessite une connexion à SQL_Claims_Prod." } }
    - { id: b, text: { en: "Publishing compares the .dacpac with SQL_Claims_Prod and applies only the changes needed.", fr: "La publication compare le fichier .dacpac à SQL_Claims_Prod et applique uniquement les modifications nécessaires." } }
    - { id: c, text: { en: "Publishing copies the rows of the SQL_Claims tables to SQL_Claims_Prod.", fr: "La publication copie les lignes des tables de SQL_Claims vers SQL_Claims_Prod." } }
    - { id: d, text: { en: "The same .dacpac file can be published to the test database and to SQL_Claims_Prod.", fr: "Le même fichier .dacpac peut être publié sur la base de données de test et sur SQL_Claims_Prod." } }
    - { id: e, text: { en: "A build warning about inconsistent casing of object names makes the build fail.", fr: "Un avertissement de build sur une casse incohérente des noms d'objets fait échouer la génération." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Publishing a .dacpac is declarative - DacFx compares the project model with the target and generates only the statements needed to make the target match. A .dacpac is a reusable artifact: the same file can be deployed many times, to every database of the release.
    fr: "La publication d'un fichier .dacpac est déclarative : DacFx compare le modèle du projet à la cible et génère uniquement les instructions nécessaires pour que la cible corresponde. Un .dacpac est un artefact réutilisable : le même fichier peut être déployé de nombreuses fois, sur chaque base de données de la mise en production."
  options:
    a: { en: "The build runs locally on the project files; only publishing or generating a script needs the target.", fr: "La génération s'exécute localement sur les fichiers du projet ; seules la publication ou la génération d'un script nécessitent la cible." }
    c: { en: "A database project deploys the schema, not table data.", fr: "Un projet de base de données déploie le schéma, pas les données des tables." }
    e: { en: "Build warnings, such as inconsistent casing of object names, are reported but don't fail the build; errors such as a broken reference do.", fr: "Les avertissements de build, comme une casse incohérente des noms d'objets, sont signalés mais ne font pas échouer la génération ; les erreurs comme une référence rompue, si." }
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
