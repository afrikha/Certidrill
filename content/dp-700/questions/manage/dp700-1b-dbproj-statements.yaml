id: dp700-1b-dbproj-statements
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Your team plans to manage the schema of a Fabric warehouse named DW_Claims by using a database project, and to deploy it to a production warehouse named DW_Claims_Prod.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe prévoit de gérer le schéma d'un entrepôt Fabric nommé DW_Claims avec un projet de base de données, et de le déployer sur un entrepôt de production nommé DW_Claims_Prod.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Building the project requires a connection to DW_Claims_Prod.", fr: "La génération du projet nécessite une connexion à DW_Claims_Prod." } }
    - { id: b, text: { en: "Publishing compares the .dacpac with DW_Claims_Prod and applies only the changes needed.", fr: "La publication compare le fichier .dacpac à DW_Claims_Prod et applique uniquement les modifications nécessaires." } }
    - { id: c, text: { en: "Publishing copies the rows of the DW_Claims tables to DW_Claims_Prod.", fr: "La publication copie les lignes des tables de DW_Claims vers DW_Claims_Prod." } }
    - { id: d, text: { en: "Only SDK-style database projects are supported for a Fabric warehouse.", fr: "Seuls les projets de base de données de style SDK sont pris en charge pour un entrepôt Fabric." } }
    - { id: e, text: { en: "The build validates the pre-deployment and post-deployment scripts against the schema model.", fr: "La génération valide les scripts de prédéploiement et de post-déploiement par rapport au modèle de schéma." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Publishing a .dacpac is declarative - DacFx compares the project model with the target and generates only the statements needed to make the target match. Warehouse projects must be SDK-style projects; other project types aren't supported.
    fr: "La publication d'un fichier .dacpac est déclarative : DacFx compare le modèle du projet à la cible et génère uniquement les instructions nécessaires pour que la cible corresponde. Les projets d'entrepôt doivent être de style SDK ; les autres types de projets ne sont pas pris en charge."
  options:
    a: { en: "The build runs locally on the project files; only publishing or generating a script needs the target.", fr: "La génération s'exécute localement sur les fichiers du projet ; seules la publication ou la génération d'un script nécessitent la cible." }
    c: { en: "A database project deploys the schema, not table data.", fr: "Un projet de base de données déploie le schéma, pas les données des tables." }
    e: { en: "Deployment scripts aren't validated at build time; their errors appear during deployment and stop it.", fr: "Les scripts de déploiement ne sont pas validés lors de la génération ; leurs erreurs apparaissent pendant le déploiement et l'arrêtent." }
references:
  - title: Develop Warehouse Projects in Visual Studio Code
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/develop-warehouse-project
  - title: Pre-deployment and post-deployment scripts for Fabric Data Warehouse (Preview)
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/pre-post-deployment-scripts
