id: dp700-1c-endorse-promote
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 in which you have the Contributor role. You built a lakehouse named LH_Customers that cleanses customer data.

    You need to signal to other data engineers that LH_Customers is ready to be shared and reused. Your organization hasn't authorized you to review items against its standards, and no Fabric administrator must be involved.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 dans lequel vous avez le rôle Contributor. Vous avez créé un lakehouse nommé LH_Customers qui nettoie des données client.

    Vous devez signaler aux autres ingénieurs données que LH_Customers est prêt à être partagé et réutilisé. Votre organisation ne vous a pas autorisé à vérifier des éléments selon ses standards, et aucun administrateur Fabric ne doit intervenir.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Endorse LH_Customers as Certified.", fr: "Approuver LH_Customers comme Certified." } }
    - { id: b, text: { en: "Endorse LH_Customers as Promoted.", fr: "Approuver LH_Customers comme Promoted." } }
    - { id: c, text: { en: "Endorse LH_Customers as Master data.", fr: "Approuver LH_Customers comme Master data." } }
    - { id: d, text: { en: "Apply the General sensitivity label to LH_Customers.", fr: "Appliquer l'étiquette de confidentialité General à LH_Customers." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Promoted means that the item's creators consider it ready for sharing and reuse. Any user who has write permission on the item, such as a Contributor, can promote it from the endorsement section of the item settings, without any admin involvement.
    fr: |
      Promoted signifie que les créateurs de l'élément le jugent prêt à être partagé et réutilisé. Tout utilisateur qui a l'autorisation d'écriture sur l'élément, comme un Contributor, peut le promouvoir depuis la section d'approbation des paramètres de l'élément, sans intervention d'un administrateur.
  options:
    a: { en: "Only reviewers authorized by a Fabric administrator can certify items.", fr: "Seuls les réviseurs autorisés par un administrateur Fabric peuvent certifier des éléments." }
    c: { en: "Master data marks a single source of truth and can be applied only by users a Fabric administrator authorized.", fr: "Master data désigne une source de vérité unique et ne peut être appliqué que par des utilisateurs autorisés par un administrateur Fabric." }
    d: { en: "A sensitivity label classifies how sensitive the data is; it doesn't signal that the item is ready for reuse.", fr: "Une étiquette de confidentialité indique le niveau de sensibilité des données ; elle ne signale pas que l'élément est prêt à être réutilisé." }
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
