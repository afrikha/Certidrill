id: dp700-1c-endorse-domain-certifiers
objective: "1.3.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Your Fabric tenant has a domain named Finance. Certification is currently disabled.

    You need to meet the following requirements:

    - Members of a security group named CentralReviewers certify items in every domain except Finance.
    - In the Finance domain, only members of a security group named FinReviewers certify items, and the Finance domain admins choose these reviewers themselves.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre locataire Fabric comporte un domaine nommé Finance. La certification est actuellement désactivée.

    Vous devez satisfaire les exigences suivantes :

    - Les membres d'un groupe de sécurité nommé CentralReviewers certifient les éléments de tous les domaines sauf Finance.
    - Dans le domaine Finance, seuls les membres d'un groupe de sécurité nommé FinReviewers certifient les éléments, et les administrateurs du domaine Finance choisissent eux-mêmes ces réviseurs.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Fabric administrator: in the Certification tenant setting, enable certification for CentralReviewers and select [[box]].
      Finance domain admin: open [[where]], expand Certification, select [[action]] and specify FinReviewers.
    fr: |
      Administrateur Fabric : dans le paramètre de locataire Certification, activer la certification pour CentralReviewers et sélectionner [[box]].
      Administrateur du domaine Finance : ouvrir [[where]], développer Certification, sélectionner [[action]] et indiquer FinReviewers.
  slots:
    - id: box
      options:
        - { id: domaincb, text: Domain admins can enable/disable }
        - { id: except, text: Except specific security groups }
        - { id: url, text: { en: "a documentation URL", fr: "une URL de documentation" } }
    - id: where
      options:
        - { id: delegated, text: { en: "the Delegated Settings tab of the Finance domain settings", fr: "l'onglet Delegated Settings des paramètres du domaine Finance" } }
        - { id: wsset, text: { en: "the settings of each Finance workspace", fr: "les paramètres de chaque espace de travail Finance" } }
        - { id: tenantset, text: { en: "the tenant settings of the admin portal", fr: "les paramètres du locataire du portail d'administration" } }
    - id: action
      options:
        - { id: override, text: Override tenant admin selection }
        - { id: exceptgrp, text: Except specific security groups }
        - { id: discover, text: Make discoverable }
answer:
  values: { box: domaincb, where: delegated, action: override }
explanation:
  correct:
    en: |
      Certification can be delegated to domains: the Fabric administrator enables it, lists the default certifiers and selects Domain admins can enable/disable. A domain admin then opens the Delegated Settings tab of the domain, expands Certification, selects Override tenant admin selection and specifies the domain's own certifiers.
    fr: |
      La certification peut être déléguée aux domaines : l'administrateur Fabric l'active, indique les certificateurs par défaut et sélectionne Domain admins can enable/disable. Un administrateur de domaine ouvre ensuite l'onglet Delegated Settings du domaine, développe Certification, sélectionne Override tenant admin selection et indique les certificateurs propres au domaine.
  options:
    except: { en: "This checkbox excludes subgroups from the certifiers; it doesn't delegate anything to domains.", fr: "Cette case exclut des sous-groupes des certificateurs ; elle ne délègue rien aux domaines." }
    wsset: { en: "Certification isn't configured per workspace.", fr: "La certification ne se configure pas par espace de travail." }
    tenantset: { en: "Domain admins can't change tenant settings; they override delegated settings in their domain.", fr: "Les administrateurs de domaine ne peuvent pas modifier les paramètres du locataire ; ils remplacent les paramètres délégués de leur domaine." }
    discover: { en: "Make discoverable belongs to semantic model endorsement, not to certification settings.", fr: "Make discoverable relève de l'approbation des modèles sémantiques, pas des paramètres de certification." }
references:
  - title: Enable item certification
    url: https://learn.microsoft.com/en-us/fabric/admin/endorsement-setup
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
