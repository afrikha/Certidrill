id: dp700-1a-onelake-diag-setup
objective: "1.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric capacity named **Cap1** that hosts a workspace named **WS-HR**. You are an admin of WS-HR.

    You need to collect the data access events of WS-HR in a lakehouse and then analyze them as Delta tables. The events must be stored in a dedicated workspace.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une capacité Fabric nommée **Cap1** qui héberge un espace de travail nommé **WS-HR**. Vous êtes administrateur de WS-HR.

    Vous devez collecter les événements d'accès aux données de WS-HR dans un lakehouse, puis les analyser sous forme de tables Delta. Les événements doivent être stockés dans un espace de travail dédié.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a workspace named WS-Diag on Cap1 and a lakehouse named LH_Diag in it.", fr: "Créer un espace de travail nommé WS-Diag sur Cap1 et un lakehouse nommé LH_Diag dans celui-ci." } }
    - { id: enable, text: { en: "In the OneLake tab of the WS-HR settings, turn on Add diagnostic events to a lakehouse and select LH_Diag.", fr: "Dans l'onglet OneLake des paramètres de WS-HR, activer Add diagnostic events to a lakehouse et sélectionner LH_Diag." } }
    - { id: transform, text: { en: "Once the events arrive, use a notebook to load the JSON files of LH_Diag into Delta tables.", fr: "Une fois les événements arrivés, utiliser un notebook pour charger les fichiers JSON de LH_Diag dans des tables Delta." } }
    - { id: othercap, text: { en: "Create a workspace named WS-Diag on another capacity and a lakehouse named LH_Diag in it.", fr: "Créer un espace de travail nommé WS-Diag sur une autre capacité et un lakehouse nommé LH_Diag dans celui-ci." } }
    - { id: cache, text: { en: "In the OneLake tab of the WS-HR settings, turn on the shortcut cache.", fr: "Dans l'onglet OneLake des paramètres de WS-HR, activer le cache des raccourcis." } }
    - { id: shortcut, text: { en: "Create a OneLake shortcut in LH_Diag that points to the lakehouses of WS-HR.", fr: "Créer dans LH_Diag un raccourci OneLake qui pointe vers les lakehouses de WS-HR." } }
answer:
  sequence: [ create, enable, transform ]
explanation:
  correct:
    en: OneLake diagnostics needs an existing destination lakehouse on the same capacity as the monitored workspace, so you create it first, then turn on Add diagnostic events to a lakehouse in the OneLake settings of WS-HR. The events arrive as JSON files within about an hour, and you can then transform them into Delta tables for analysis.
    fr: "Les diagnostics OneLake exigent un lakehouse de destination existant sur la même capacité que l'espace de travail surveillé : vous le créez donc d'abord, puis vous activez Add diagnostic events to a lakehouse dans les paramètres OneLake de WS-HR. Les événements arrivent sous forme de fichiers JSON en une heure environ, et vous pouvez ensuite les transformer en tables Delta pour les analyser."
  options:
    othercap:
      en: The destination lakehouse must reside in the same capacity as the workspace you monitor.
      fr: Le lakehouse de destination doit se trouver sur la même capacité que l'espace de travail surveillé.
    cache:
      en: The shortcut cache reduces egress for external shortcuts; it doesn't record access events.
      fr: Le cache des raccourcis réduit la sortie de données des raccourcis externes ; il n'enregistre pas d'événements d'accès.
    shortcut:
      en: A shortcut gives access to the data itself; it doesn't produce a log of who accessed it.
      fr: Un raccourci donne accès aux données elles-mêmes ; il ne produit pas de journal des accès.
references:
  - title: OneLake diagnostics
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-diagnostics-overview
