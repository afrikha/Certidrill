id: dp700-sr2-region-schedules-1
objective: "1.4.2"
type: series_yesno
series: dp700-sr2-region-schedules
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You add two schedules in the Paris time zone, one for each region.
  fr: Vous ajoutez deux planifications dans le fuseau horaire de Paris, une par région.
body:
  solution:
    en: |
      You add two daily schedules to PL-Refresh, both in the time zone of **Paris**. The first runs at **06:00** and passes Region = **EU**. The second runs at **14:00** and passes Region = **US**.
    fr: |
      Vous ajoutez deux planifications quotidiennes à PL-Refresh, toutes deux dans le fuseau horaire de **Paris**. La première s'exécute à **06:00** et passe Region = **EU**. La seconde s'exécute à **14:00** et passe Region = **US**.
answer: { value: false }
explanation:
  correct:
    en: |
      A pipeline can have several schedules, each with its own time zone and parameter values, but the US schedule here uses the wrong time zone. 14:00 in Paris is 08:00 in New York, so the US load runs six hours early. The second schedule must use the New York time zone.
    fr: |
      Un pipeline peut avoir plusieurs planifications, chacune avec son propre fuseau horaire et ses propres valeurs de paramètres, mais la planification US utilise ici le mauvais fuseau horaire. 14:00 à Paris correspond à 08:00 à New York : le chargement US s'exécute six heures trop tôt. La seconde planification doit utiliser le fuseau horaire de New York.
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs
