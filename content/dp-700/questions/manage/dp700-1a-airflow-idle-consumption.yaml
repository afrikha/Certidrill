id: dp700-1a-airflow-idle-consumption
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Prod**. Its Apache Airflow runtime setting uses a custom pool named **AirProd** with **Compute node size** set to **Large**, no extra nodes and autoscale off.

    The Microsoft Fabric Capacity Metrics app shows that Apache Airflow consumes about 10 capacity units (CUs) all weekend, although no DAG runs from Friday evening to Monday morning.

    What is the cause of this consumption?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Prod**. Son paramètre de runtime Apache Airflow utilise un pool personnalisé nommé **AirProd** dont **Compute node size** est défini sur **Large**, sans nœuds supplémentaires et sans mise à l'échelle automatique.

    L'application Microsoft Fabric Capacity Metrics montre qu'Apache Airflow consomme environ 10 unités de capacité (CU) tout le week-end, alors qu'aucun DAG ne s'exécute du vendredi soir au lundi matin.

    Quelle est la cause de cette consommation ?
body:
  options:
    - { id: b, text: { en: "The starter pool of the workspace restarts every 20 minutes", fr: "Le pool de démarrage de l'espace de travail redémarre toutes les 20 minutes" } }
    - { id: a, text: { en: "The base nodes of AirProd keep running until the pool is paused", fr: "Les nœuds de base d'AirProd continuent de tourner jusqu'à la mise en pause du pool" } }
    - { id: c, text: { en: "Autoscale keeps the extra nodes of AirProd allocated over the weekend", fr: "La mise à l'échelle automatique garde alloués les nœuds supplémentaires d'AirProd pendant le week-end" } }
    - { id: d, text: { en: "The Airflow scheduler runs DAG catch-up jobs for the missed weekend runs", fr: "Le planificateur Airflow exécute des travaux de rattrapage pour les exécutions manquées du week-end" } }
answer: { optionId: a }
explanation:
  correct:
    en: A custom pool starts with three base nodes, usually a scheduler, a web server and a worker, and they run all the time until you pause the pool manually. A large pool costs about 10 CUs for these base nodes even when no job runs, which matches the weekend consumption.
    fr: Un pool personnalisé démarre avec trois nœuds de base, en général un planificateur, un serveur web et un worker, qui tournent en permanence jusqu'à ce que vous mettiez le pool en pause manuellement. Un grand pool coûte environ 10 CU pour ces nœuds de base, même quand aucun travail ne s'exécute, ce qui correspond à la consommation du week-end.
  options:
    b:
      en: The workspace uses AirProd, not the starter pool; a starter pool shuts down after 20 minutes of inactivity instead of restarting.
      fr: L'espace de travail utilise AirProd, pas le pool de démarrage ; un pool de démarrage s'arrête après 20 minutes d'inactivité au lieu de redémarrer.
    c:
      en: Autoscale is off and AirProd has no extra nodes; with autoscale, extra nodes shut down when the load drops.
      fr: La mise à l'échelle automatique est désactivée et AirProd n'a pas de nœuds supplémentaires ; avec la mise à l'échelle automatique, les nœuds supplémentaires s'arrêtent quand la charge baisse.
    d:
      en: No DAG runs during the weekend, and the consumption matches the base nodes of a large pool, not job activity.
      fr: Aucun DAG ne s'exécute pendant le week-end, et la consommation correspond aux nœuds de base d'un grand pool, pas à une activité de travaux.
references:
  - title: Apache Airflow compute in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-compute
