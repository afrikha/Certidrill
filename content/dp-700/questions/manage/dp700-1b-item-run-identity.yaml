id: dp700-1b-item-run-identity
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two Fabric workspaces named WS-Ops and WS-Finance. WS-Finance contains a lakehouse named LH_Finance. WS-Ops contains a notebook named NB_Load, which reads LH_Finance, and a pipeline named PL_Nightly, which runs NB_Load.

    Admin1 created PL_Nightly and its daily schedule. Admin1 has access to LH_Finance. Yesterday, User7, a Contributor of WS-Ops who has no access to WS-Finance, changed the retry setting of an activity in PL_Nightly. Tonight, NB_Load fails with an access error on LH_Finance.

    Which identity does NB_Load use when PL_Nightly runs it?
  fr: |
    Vous disposez de deux espaces de travail Fabric nommés WS-Ops et WS-Finance. WS-Finance contient un lakehouse nommé LH_Finance. WS-Ops contient un notebook nommé NB_Load, qui lit LH_Finance, et un pipeline nommé PL_Nightly, qui exécute NB_Load.

    Admin1 a créé PL_Nightly et sa planification quotidienne. Admin1 a accès à LH_Finance. Hier, User7, un Contributor de WS-Ops qui n'a aucun accès à WS-Finance, a modifié le paramètre de nouvelle tentative d'une activité de PL_Nightly. Cette nuit, NB_Load échoue avec une erreur d'accès sur LH_Finance.

    Quelle identité NB_Load utilise-t-il quand PL_Nightly l'exécute ?
body:
  options:
    - { id: a, text: { en: "The identity of the user who last modified PL_Nightly", fr: "L'identité de l'utilisateur qui a modifié PL_Nightly en dernier" } }
    - { id: b, text: { en: "The identity of the user who created PL_Nightly", fr: "L'identité de l'utilisateur qui a créé PL_Nightly" } }
    - { id: c, text: { en: "The identity of the owner of NB_Load", fr: "L'identité du propriétaire de NB_Load" } }
    - { id: d, text: { en: "The workspace identity of WS-Ops", fr: "L'identité d'espace de travail de WS-Ops" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A notebook run as a pipeline activity uses the identity of the user who last modified the pipeline, not the pipeline owner or the notebook owner. After User7 edited PL_Nightly, NB_Load runs as User7, who has no access to LH_Finance. Grant User7 the access, or have an authorized user save the pipeline again.
    fr: |
      Un notebook exécuté comme activité de pipeline utilise l'identité de l'utilisateur qui a modifié le pipeline en dernier, pas celle du propriétaire du pipeline ou du notebook. Depuis que User7 a modifié PL_Nightly, NB_Load s'exécute en tant que User7, qui n'a pas accès à LH_Finance. Accordez l'accès à User7, ou faites enregistrer de nouveau le pipeline par un utilisateur autorisé.
  options:
    b: { en: "The creator's identity would have access, so the run wouldn't fail; the last modifier's identity is used instead.", fr: "L'identité du créateur aurait l'accès, et l'exécution n'échouerait pas ; c'est l'identité du dernier modificateur qui est utilisée." }
    c: { en: "The owner of the notebook doesn't provide the identity when a pipeline activity runs the notebook.", fr: "Le propriétaire du notebook ne fournit pas l'identité quand une activité de pipeline exécute le notebook." }
    d: { en: "A notebook activity doesn't run under the workspace identity in this scenario.", fr: "Dans ce scénario, une activité de notebook ne s'exécute pas sous l'identité d'espace de travail." }
references:
  - title: How to use notebooks
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/how-to-use-notebook
