id: dp700-1c-ddm-unmask-column
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a table named dbo.Employee. The Salary and NationalId columns of dbo.Employee are masked.

    A security group named Payroll has the Viewer role in the workspace. The members of Payroll must see the real Salary values. NationalId must stay masked for them, and they must not be able to change any mask.

    You need to grant the required permission. The solution must follow the principle of least privilege.

    How should you complete the T-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée dbo.Employee. Les colonnes Salary et NationalId de dbo.Employee sont masquées.

    Un groupe de sécurité nommé Payroll a le rôle Viewer dans l'espace de travail. Les membres de Payroll doivent voir les vraies valeurs de Salary. NationalId doit rester masquée pour eux, et ils ne doivent pouvoir modifier aucun masque.

    Vous devez accorder l'autorisation requise. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter l'instruction T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    GRANT [[perm]] ON [[obj]] TO [Payroll];
  slots:
    - id: perm
      options:
        - { id: unmask, text: UNMASK }
        - { id: altermask, text: ALTER ANY MASK }
        - { id: control, text: CONTROL }
        - { id: select, text: SELECT }
    - id: obj
      options:
        - { id: column, text: dbo.Employee(Salary) }
        - { id: table, text: dbo.Employee }
        - { id: schema, text: "SCHEMA::dbo" }
        - { id: database, text: "DATABASE::DW1" }
answer:
  values: { perm: unmask, obj: column }
explanation:
  correct:
    en: |
      UNMASK lets a user see the real values of masked data, and it can be granted on a single column. Granting it on dbo.Employee(Salary) reveals Salary while NationalId stays masked, and UNMASK doesn't allow changing masks.
    fr: |
      UNMASK permet à un utilisateur de voir les vraies valeurs des données masquées, et peut s'accorder sur une seule colonne. L'accorder sur dbo.Employee(Salary) révèle Salary alors que NationalId reste masquée, et UNMASK ne permet pas de modifier les masques.
  options:
    altermask: { en: "ALTER ANY MASK lets users add, change or remove masks, which Payroll must not do.", fr: "ALTER ANY MASK permet d'ajouter, de modifier ou de retirer des masques, ce que Payroll ne doit pas pouvoir faire." }
    control: { en: "CONTROL grants far more than needed, including the right to manage masks.", fr: "CONTROL accorde bien plus que nécessaire, y compris le droit de gérer les masques." }
    select: { en: "Viewers can already read the table; SELECT returns masked values.", fr: "Les Viewers lisent déjà la table ; SELECT renvoie des valeurs masquées." }
    table: { en: "UNMASK on the whole table would also reveal NationalId.", fr: "UNMASK sur toute la table révélerait aussi NationalId." }
    schema: { en: "A schema-level grant would reveal every masked column of the schema.", fr: "Une autorisation au niveau du schéma révélerait toutes les colonnes masquées du schéma." }
    database: { en: "A database-level grant would reveal every masked column of DW1.", fr: "Une autorisation au niveau de la base de données révélerait toutes les colonnes masquées de DW1." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
