id: dp700-1b-dbproj-script-rules
objective: "1.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You manage a Fabric warehouse named DW_HR by using a database project. You plan to add pre-deployment and post-deployment scripts to the project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un entrepôt Fabric nommé DW_HR avec un projet de base de données. Vous prévoyez d'ajouter des scripts de prédéploiement et de post-déploiement au projet.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          DW_HR can have two post-deployment scripts, one that loads reference data and one that recreates database roles.
        fr: |
          DW_HR peut avoir deux scripts de post-déploiement, l'un qui charge des données de référence et l'autre qui recrée des rôles de base de données.
    - id: s2
      text:
        en: |
          The post-deployment script runs after the schema changes of the deployment are applied.
        fr: |
          Le script de post-déploiement s'exécute après l'application des modifications de schéma du déploiement.
    - id: s3
      text:
        en: |
          The post-deployment script can include other script files by using the SQLCMD `:r` command.
        fr: |
          Le script de post-déploiement peut inclure d'autres fichiers de script avec la commande SQLCMD `:r`.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A warehouse supports at most one pre-deployment script and one post-deployment script, and each must be a single file, so the two tasks go into the same post-deployment script. The order is fixed - pre-deployment script, schema deployment plan, then post-deployment script. Composing scripts with the SQLCMD `:r` command isn't supported.
    fr: "Un entrepôt prend en charge au maximum un script de prédéploiement et un script de post-déploiement, chacun dans un seul fichier : les deux tâches vont donc dans le même script de post-déploiement. L'ordre est fixe : script de prédéploiement, plan de déploiement du schéma, puis script de post-déploiement. La composition de scripts avec la commande SQLCMD `:r` n'est pas prise en charge."
references:
  - title: Pre-deployment and post-deployment scripts for Fabric Data Warehouse (Preview)
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/pre-post-deployment-scripts
