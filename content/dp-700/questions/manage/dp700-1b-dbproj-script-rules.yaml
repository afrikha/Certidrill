id: dp700-1b-dbproj-script-rules
objective: "1.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A Fabric workspace named WS-HR is connected to an Azure DevOps repository and contains a SQL database named SQL_HR. Fabric source control integration stores SQL_HR as a SQL project. You plan to add a post-deployment script to SQL_HR.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un espace de travail Fabric nommé WS-HR est connecté à un dépôt Azure DevOps et contient une base de données SQL nommée SQL_HR. L'intégration du contrôle de code source de Fabric stocke SQL_HR sous forme de projet SQL. Vous prévoyez d'ajouter un script de post-déploiement à SQL_HR.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The post-deployment script runs when SQL_HR is updated from source control and when SQL_HR is deployed by a deployment pipeline.
        fr: |
          Le script de post-déploiement s'exécute quand SQL_HR est mise à jour depuis le contrôle de code source et quand SQL_HR est déployée par un pipeline de déploiement.
    - id: s2
      text:
        en: |
          The collation of SQL_HR is stored in the SQL project, so a deployment pipeline applies it to the database of the next stage.
        fr: |
          Le classement de SQL_HR est stocké dans le projet SQL : un pipeline de déploiement l'applique donc à la base de données de la phase suivante.
    - id: s3
      text:
        en: |
          When SQL_HR is updated from source control, the SQL files are built and validated before SqlPackage changes the database.
        fr: |
          Quand SQL_HR est mise à jour depuis le contrôle de code source, les fichiers SQL sont générés et validés avant que SqlPackage modifie la base de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A query moved to the Shared Queries folder and set as the post-deployment script runs as part of any update from source control and any deployment pipeline deployment. Database-level settings such as collation and compatibility level aren't included in source control or deployment pipelines; settings that T-SQL can change are set with scripts after deployment. An update from source control combines a SQL project build, which validates the syntax and produces a .dacpac, with a SqlPackage publish that applies the differences.
    fr: |
      Une requête déplacée dans le dossier Shared Queries et définie comme script de post-déploiement s'exécute lors de toute mise à jour depuis le contrôle de code source et de tout déploiement par un pipeline de déploiement. Les paramètres de base de données comme le classement et le niveau de compatibilité ne sont inclus ni dans le contrôle de code source ni dans les pipelines de déploiement ; ceux que le T-SQL peut modifier se définissent par des scripts après le déploiement. Une mise à jour depuis le contrôle de code source combine une génération (build) du projet SQL, qui valide la syntaxe et produit un .dacpac, et une publication SqlPackage qui applique les différences.
references:
  - title: Fabric SQL database source control integration
    url: https://learn.microsoft.com/en-us/fabric/database/sql/source-control
