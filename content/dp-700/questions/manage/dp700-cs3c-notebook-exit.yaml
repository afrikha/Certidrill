id: dp700-cs3c-notebook-exit
objective: "1.4.3"
type: dropdown
caseStudy: dp700-cs3c-tailspin
difficulty: 2
status: draft
stem:
  en: |
    NB-SilverOrders has a parameter cell that defines a variable named SourceFile, and stores the number of processed rows in a variable named rows_processed. PL-Daily has a storage event trigger on the landing container. An If Condition activity named **Has rows** runs after **Load silver**.

    You need to configure PL-Daily and NB-SilverOrders to meet the orchestration requirements.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    NB-SilverOrders a une cellule de paramètres qui définit une variable nommée SourceFile, et stocke le nombre de lignes traitées dans une variable nommée rows_processed. PL-Daily a un déclencheur d'événement de stockage sur le conteneur landing. Une activité If Condition nommée **Has rows** s'exécute après **Load silver**.

    Vous devez configurer PL-Daily et NB-SilverOrders pour respecter les exigences d'orchestration.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template:
    en: |
      Notebook activity "Load silver" > Settings > Base parameters
        SourceFile = [[file]]

      NB-SilverOrders, last cell
        [[exit]](str(rows_processed))

      If Condition activity "Has rows" > Expression
        @greater(int(activity('Load silver').output.result.[[val]]), 0)
    fr: |
      Activité Notebook "Load silver" > Settings > Base parameters
        SourceFile = [[file]]

      NB-SilverOrders, dernière cellule
        [[exit]](str(rows_processed))

      Activité If Condition "Has rows" > Expression
        @greater(int(activity('Load silver').output.result.[[val]]), 0)
  slots:
    - id: file
      options:
        - { id: triggerfile, text: "@pipeline()?.TriggerEvent?.FileName" }
        - { id: triggertime, text: "@pipeline().TriggerTime" }
        - { id: runid, text: "@pipeline().RunId" }
    - id: exit
      options:
        - { id: print, text: print }
        - { id: display, text: display }
        - { id: nbexit, text: notebookutils.notebook.exit }
        - { id: nbrun, text: notebookutils.notebook.run }
    - id: val
      options:
        - { id: status, text: status }
        - { id: exitvalue, text: exitValue }
        - { id: runoutput, text: runOutput }
answer:
  values: { file: triggerfile, exit: nbexit, val: exitvalue }
explanation:
  correct:
    en: "The storage event trigger sets built-in trigger parameters, and `@pipeline()?.TriggerEvent?.FileName` returns the name of the file that started the run; the base parameter overrides SourceFile in the parameter cell. `notebookutils.notebook.exit()` (the successor of mssparkutils) ends the notebook and returns a string to the Notebook activity, which exposes it as `output.result.exitValue`. Do not wrap exit() in a try/except block, or the pipeline does not receive the value."
    fr: "Le déclencheur d'événement de stockage définit des paramètres de déclencheur intégrés, et `@pipeline()?.TriggerEvent?.FileName` renvoie le nom du fichier qui a démarré l'exécution ; le paramètre de base remplace SourceFile dans la cellule de paramètres. `notebookutils.notebook.exit()` (successeur de mssparkutils) termine le notebook et renvoie une chaîne à l'activité Notebook, qui l'expose sous `output.result.exitValue`. N'encadrez pas exit() par un bloc try/except, sinon le pipeline ne reçoit pas la valeur."
  options:
    triggertime: { en: "TriggerTime returns when the run was triggered, not the file name.", fr: "TriggerTime renvoie l'heure du déclenchement, pas le nom du fichier." }
    runid: { en: "RunId identifies the pipeline run, not the file.", fr: "RunId identifie l'exécution du pipeline, pas le fichier." }
    print: { en: "print writes to the cell output; it returns no value to the pipeline.", fr: "print écrit dans la sortie de la cellule ; il ne renvoie aucune valeur au pipeline." }
    display: { en: "display renders a result in the notebook; it returns no value to the pipeline.", fr: "display affiche un résultat dans le notebook ; il ne renvoie aucune valeur au pipeline." }
    nbrun: { en: "notebook.run starts another notebook; it does not return a value from this one.", fr: "notebook.run démarre un autre notebook ; il ne renvoie pas de valeur depuis celui-ci." }
    status: { en: "The notebook's return value is exposed as exitValue, not status.", fr: "La valeur renvoyée par le notebook est exposée sous exitValue, pas status." }
    runoutput: { en: "The notebook's return value is exposed as exitValue, not runOutput.", fr: "La valeur renvoyée par le notebook est exposée sous exitValue, pas runOutput." }
references:
  - title: Transform data by running a notebook
    url: https://learn.microsoft.com/en-us/fabric/data-factory/notebook-activity
  - title: Microsoft Spark Utilities (MSSparkUtils) for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/microsoft-spark-utilities
