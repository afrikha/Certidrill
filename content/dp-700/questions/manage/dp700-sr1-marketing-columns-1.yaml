id: dp700-sr1-marketing-columns-1
objective: "1.3.3"
type: series_yesno
series: dp700-sr1-marketing-columns
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You grant SELECT on the table and mask the other columns.
  fr: Vous accordez SELECT sur la table et masquez les autres colonnes.
body:
  solution:
    en: |
      You run the following T-SQL statements in DW1:

      ```sql
      GRANT SELECT ON dbo.Customers TO [Marketing];
      ALTER TABLE dbo.Customers ALTER COLUMN CustomerName ADD MASKED WITH (FUNCTION = 'default()');
      ALTER TABLE dbo.Customers ALTER COLUMN Email ADD MASKED WITH (FUNCTION = 'email()');
      ALTER TABLE dbo.Customers ALTER COLUMN Phone ADD MASKED WITH (FUNCTION = 'default()');
      ```
    fr: |
      Vous exécutez les instructions T-SQL suivantes dans DW1 :

      ```sql
      GRANT SELECT ON dbo.Customers TO [Marketing];
      ALTER TABLE dbo.Customers ALTER COLUMN CustomerName ADD MASKED WITH (FUNCTION = 'default()');
      ALTER TABLE dbo.Customers ALTER COLUMN Email ADD MASKED WITH (FUNCTION = 'email()');
      ALTER TABLE dbo.Customers ALTER COLUMN Phone ADD MASKED WITH (FUNCTION = 'default()');
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Dynamic data masking only obfuscates the values returned to users without UNMASK; it doesn't stop them from querying the columns. Marketing could still filter on Email or Phone with WHERE predicates and infer the real values from the rows returned, which Microsoft documents as a limitation of masking. Column-level security is needed to block access to those columns.
    fr: |
      Le masquage dynamique des données ne fait qu'obscurcir les valeurs renvoyées aux utilisateurs qui n'ont pas UNMASK ; il ne les empêche pas d'interroger les colonnes. Marketing pourrait toujours filtrer sur Email ou Phone avec des prédicats WHERE et déduire les vraies valeurs des lignes renvoyées, ce que Microsoft documente comme une limite du masquage. Il faut la sécurité au niveau des colonnes pour bloquer l'accès à ces colonnes.
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
