id: dp700-1a-spark-custom-pool-prereq
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are an admin of a Fabric workspace named **WS-Risk** that is assigned to a capacity named **Cap-Risk**. You aren't a capacity admin of Cap-Risk.

    You need to create a custom Spark pool that uses memory-optimized X-Large nodes and make it the default pool of WS-Risk. In **Spark settings**, the workspace doesn't let you create a custom pool.

    What should you do first?
  fr: |
    Vous êtes administrateur d'un espace de travail Fabric nommé **WS-Risk**, attribué à une capacité nommée **Cap-Risk**. Vous n'êtes pas administrateur de la capacité Cap-Risk.

    Vous devez créer un pool Spark personnalisé qui utilise des nœuds X-Large optimisés pour la mémoire et en faire le pool par défaut de WS-Risk. Dans **Spark settings**, l'espace de travail ne vous permet pas de créer un pool personnalisé.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Turn on Customize compute configurations for items in the Spark settings of WS-Risk", fr: "Activer Customize compute configurations for items dans les paramètres Spark de WS-Risk" } }
    - { id: b, text: { en: "Create an Environment item in WS-Risk and set its compute properties to X-Large", fr: "Créer un élément Environment dans WS-Risk et définir ses propriétés de calcul sur X-Large" } }
    - { id: c, text: { en: "Ask a capacity admin to turn on Customized workspace pools for Cap-Risk", fr: "Demander à un administrateur de capacité d'activer Customized workspace pools pour Cap-Risk" } }
    - { id: d, text: { en: "Ask a Fabric administrator to assign you the Admin role on every workspace of Cap-Risk", fr: "Demander à un administrateur Fabric de vous attribuer le rôle Admin sur tous les espaces de travail de Cap-Risk" } }
answer: { optionId: c }
explanation:
  correct:
    en: Creating custom pools needs two things, the Admin role on the workspace, which you have, and the capacity setting Customized workspace pools, which a capacity admin controls in the Spark Compute settings of the capacity. Once the setting is on, you can select New Pool from Default pool for workspace and choose the node family and size.
    fr: La création de pools personnalisés exige deux choses, le rôle Admin sur l'espace de travail, que vous avez, et le paramètre de capacité Customized workspace pools, qu'un administrateur de capacité contrôle dans les paramètres Spark Compute de la capacité. Une fois ce paramètre activé, vous pouvez sélectionner New Pool dans Default pool for workspace et choisir la famille et la taille des nœuds.
  options:
    a:
      en: This toggle lets users change driver and executor sizes per item; it doesn't allow the creation of workspace pools.
      fr: Ce bouton permet aux utilisateurs de modifier la taille du pilote et des exécuteurs par élément ; il n'autorise pas la création de pools d'espace de travail.
    b:
      en: An environment runs on the pools that the workspace offers; it can't create X-Large nodes when custom pools aren't allowed.
      fr: Un environnement s'exécute sur les pools proposés par l'espace de travail ; il ne peut pas créer de nœuds X-Large quand les pools personnalisés ne sont pas autorisés.
    d:
      en: You are already an admin of WS-Risk, and admin roles on other workspaces don't change a capacity-level restriction.
      fr: Vous êtes déjà administrateur de WS-Risk, et des rôles d'administrateur sur d'autres espaces de travail ne changent rien à une restriction au niveau de la capacité.
references:
  - title: Create custom Apache Spark pools in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/create-custom-spark-pools
