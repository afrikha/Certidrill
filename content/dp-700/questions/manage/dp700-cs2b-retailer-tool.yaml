id: dp700-cs2b-retailer-tool
objective: "1.4.1"
type: single
caseStudy: dp700-cs2b-munsons
difficulty: 1
status: draft
stem:
  en: You need to recommend an item that the sales analysts will create to meet the requirement for the retailer data. What should you recommend?
  fr: Vous devez recommander l'élément que les analystes commerciaux créeront pour satisfaire l'exigence relative aux données des distributeurs. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A pipeline that has a Copy activity with SharePoint Online as the source and WH_Sales as the destination", fr: "Un pipeline doté d'une activité Copy avec SharePoint Online comme source et WH_Sales comme destination" } }
    - { id: b, text: { en: "A notebook that reads the workbooks with PySpark and writes dbo.RetailerSales", fr: "Un notebook qui lit les classeurs avec PySpark et écrit dbo.RetailerSales" } }
    - { id: c, text: { en: "A Dataflow Gen2 that has WH_Sales as its data destination", fr: "Un Dataflow Gen2 qui a WH_Sales comme destination de données" } }
    - { id: d, text: { en: "A T-SQL stored procedure in WH_Sales that reads the workbooks", fr: "Une procédure stockée T-SQL dans WH_Sales qui lit les classeurs" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Dataflow Gen2 is the low-code option of Fabric: it uses the Power Query editor that the analysts already know, connects to SharePoint and Excel, and can apply a different set of transformations to each retailer layout before writing the result to a warehouse table through a data destination.
    fr: |
      Dataflow Gen2 est l'option low-code de Fabric : il utilise l'éditeur Power Query que les analystes connaissent déjà, se connecte à SharePoint et à Excel, et peut appliquer des transformations différentes à chaque mise en page de distributeur avant d'écrire le résultat dans une table d'entrepôt via une destination de données.
  options:
    a: { en: "A Copy activity moves data with little transformation; it cannot reshape 30 different workbook layouts the way Power Query does.", fr: "Une activité Copy déplace des données avec peu de transformations ; elle ne peut pas remodeler 30 mises en page de classeurs différentes comme le fait Power Query." }
    b: { en: "A notebook requires Python code, which the analysts do not write.", fr: "Un notebook exige du code Python, que les analystes n'écrivent pas." }
    d: { en: "A stored procedure requires T-SQL, and the warehouse does not read Excel workbooks from SharePoint.", fr: "Une procédure stockée exige du T-SQL, et l'entrepôt ne lit pas de classeurs Excel depuis SharePoint." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
