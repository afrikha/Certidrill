id: dp700-1b-item-spark-access
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Curated that contains a lakehouse named LH_Curated. OneLake security is enabled on LH_Curated, and the DefaultReader role is unchanged.

    A data scientist named User4 has no access to WS-Curated. User4 must read the Delta tables of LH_Curated from Spark notebooks in another workspace. User4 must not be able to change any data or item in WS-Curated.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Curated qui contient un lakehouse nommé LH_Curated. La sécurité OneLake est activée sur LH_Curated, et le rôle DefaultReader n'a pas été modifié.

    Une data scientist nommée User4 n'a aucun accès à WS-Curated. User4 doit lire les tables Delta de LH_Curated depuis des notebooks Spark situés dans un autre espace de travail. User4 ne doit pouvoir modifier aucune donnée ni aucun élément dans WS-Curated.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Share LH_Curated with User4 and select Read all with Apache Spark.", fr: "Partager LH_Curated avec User4 et sélectionner Read all with Apache Spark." } }
    - { id: b, text: { en: "Share LH_Curated with User4 and select Read all with SQL analytics endpoint.", fr: "Partager LH_Curated avec User4 et sélectionner Read all with SQL analytics endpoint." } }
    - { id: c, text: { en: "Assign User4 the Viewer role, and add User4 to a OneLake security role that grants Read on the tables.", fr: "Attribuer à User4 le rôle Viewer, et ajouter User4 à un rôle de sécurité OneLake qui accorde Read sur les tables." } }
    - { id: d, text: { en: "Assign User4 the Contributor role in WS-Curated.", fr: "Attribuer à User4 le rôle Contributor dans WS-Curated." } }
    - { id: e, text: { en: "Assign User4 the Viewer role in WS-Curated.", fr: "Attribuer à User4 le rôle Viewer dans WS-Curated." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The ReadAll permission (Read all with Apache Spark) gives access to the lakehouse data through Spark and OneLake APIs; with OneLake security enabled, it works through the DefaultReader role, which contains every user with ReadAll. Alternatively, a Viewer has no OneLake data access by default, and a OneLake security role that grants Read on the tables provides it. Neither path grants write access.
    fr: |
      L'autorisation ReadAll (Read all with Apache Spark) donne accès aux données du lakehouse via Spark et les API OneLake ; avec la sécurité OneLake activée, elle passe par le rôle DefaultReader, qui contient tous les utilisateurs disposant de ReadAll. Autre solution, un Viewer n'a aucun accès aux données OneLake par défaut, et un rôle de sécurité OneLake qui accorde Read sur les tables le lui fournit. Aucune des deux voies n'accorde d'accès en écriture.
  options:
    b: { en: "Read all with SQL analytics endpoint gives T-SQL access, not Spark access to the files.", fr: "Read all with SQL analytics endpoint donne un accès T-SQL, pas un accès Spark aux fichiers." }
    d: { en: "Contributor can write data and modify items in WS-Curated.", fr: "Contributor peut écrire des données et modifier des éléments dans WS-Curated." }
    e: { en: "A Viewer can't read data in OneLake unless a OneLake security role grants it.", fr: "Un Viewer ne peut pas lire de données dans OneLake sauf si un rôle de sécurité OneLake le lui accorde." }
references:
  - title: Data security overview
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-security
  - title: Lakehouse sharing and permission management
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
