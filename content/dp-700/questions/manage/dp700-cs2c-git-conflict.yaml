id: dp700-cs2c-git-conflict
objective: "1.2.1"
type: ordering
caseStudy: dp700-cs2c-wide-world
difficulty: 2
status: draft
stem:
  en: |
    You need to resolve the conflict on NB_Customs. The solution must meet the requirement for NB_Customs.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez résoudre le conflit sur NB_Customs. La solution doit respecter l'exigence relative à NB_Customs.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: merge, text: { en: "In Azure DevOps, resolve the conflicts between the new branch and dev, and merge the new branch into dev.", fr: "Dans Azure DevOps, résoudre les conflits entre la nouvelle branche et dev, puis fusionner la nouvelle branche dans dev." } }
    - { id: accept, text: { en: "In the Resolve conflicts pane, select Accept incoming changes for NB_Customs.", fr: "Dans le volet Resolve conflicts, sélectionner Accept incoming changes pour NB_Customs." } }
    - { id: checkout, text: { en: "In the Source control pane of WWI-Trade-Dev, check out a new branch from the last synced branch.", fr: "Dans le volet Source control de WWI-Trade-Dev, extraire (check out) une nouvelle branche à partir de la dernière branche synchronisée." } }
    - { id: switch, text: { en: "Switch WWI-Trade-Dev back to the dev branch.", fr: "Rebasculer WWI-Trade-Dev sur la branche dev." } }
    - { id: undo, text: { en: "Select Undo for NB_Customs in the Source control pane.", fr: "Sélectionner Undo pour NB_Customs dans le volet Source control." } }
    - { id: commit, text: { en: "Commit Kenji's change to the new branch.", fr: "Valider (commit) la modification de Kenji dans la nouvelle branche." } }
answer:
  sequence: [ checkout, commit, merge, switch ]
explanation:
  correct:
    en: |
      To keep changes from both sides, resolve the conflict in Git. Checking out a new branch from the last synced branch keeps the uncommitted workspace changes, which you then commit to that branch. You resolve the conflicts and merge the new branch into dev in Azure DevOps, and finally switch the workspace back to dev, which now contains both changes. Kenji can switch branches because he is an Admin of WWI-Trade-Dev.
    fr: |
      Pour conserver les modifications des deux côtés, résolvez le conflit dans Git. L'extraction d'une nouvelle branche à partir de la dernière branche synchronisée conserve les modifications non validées de l'espace de travail, que vous validez ensuite dans cette branche. Vous résolvez les conflits et fusionnez la nouvelle branche dans dev dans Azure DevOps, puis vous rebasculez l'espace de travail sur dev, qui contient désormais les deux modifications. Kenji peut changer de branche, car il est Admin de WWI-Trade-Dev.
  options:
    accept: { en: "Accept incoming changes overwrites the workspace item with the Git version, so Kenji's change would be lost.", fr: "Accept incoming changes remplace l'élément de l'espace de travail par la version Git : la modification de Kenji serait perdue." }
    undo: { en: "Undo returns NB_Customs to its last synced state and discards Kenji's change.", fr: "Undo ramène NB_Customs à son dernier état synchronisé et supprime la modification de Kenji." }
references:
  - title: Conflict resolution
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/conflict-resolution
