id: dp700-sr2-region-schedules-2
objective: "1.4.2"
type: series_yesno
series: dp700-sr2-region-schedules
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You add two schedules in the right time zones without parameter values.
  fr: Vous ajoutez deux planifications dans les bons fuseaux horaires sans valeurs de paramètres.
body:
  solution:
    en: |
      You add a daily schedule at **06:00** in the time zone of **Paris** and a daily schedule at **14:00** in the time zone of **New York**. You don't enter any parameter value in the schedules.
    fr: |
      Vous ajoutez une planification quotidienne à **06:00** dans le fuseau horaire de **Paris** et une planification quotidienne à **14:00** dans le fuseau horaire de **New York**. Vous ne saisissez aucune valeur de paramètre dans les planifications.
answer: { value: false }
explanation:
  correct:
    en: |
      The times are right, but a run that receives no value for Region uses the parameter's default value, EU. The New York run therefore loads the EU sales again. Each schedule must pass its own value of Region.
    fr: |
      Les heures sont correctes, mais une exécution qui ne reçoit aucune valeur pour Region utilise la valeur par défaut du paramètre, EU. L'exécution de New York charge donc à nouveau les ventes EU. Chaque planification doit passer sa propre valeur de Region.
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs
