id: dp700-sr2-shared-session-1
objective: "1.1.1"
type: series_yesno
series: dp700-sr2-shared-session
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You turn on high concurrency for pipelines and use one session tag.
  fr: Vous activez la haute concurrence pour les pipelines et utilisez une seule balise de session.
body:
  solution:
    en: |
      In the Spark settings of WS-ETL, you turn on high concurrency **For pipeline running multiple notebooks**. In the **Advanced settings** of the four Notebook activities, you enter the same session tag, **nightly**.
    fr: |
      Dans les paramètres Spark de WS-ETL, vous activez la haute concurrence **For pipeline running multiple notebooks**. Dans les **Advanced settings** des quatre activités Notebook, vous saisissez la même balise de session, **nightly**.
answer: { value: false }
explanation:
  correct:
    en: |
      Notebooks share a high concurrency session only if they are run by the same user and have the same default lakehouse, the same Spark compute configuration and the same library packages. NB-Ingest and NB-Clean use LH-Bronze while NB-Conform and NB-Publish use LH-Silver, so the session tag can't bundle them into one session: at least two sessions start.
    fr: |
      Des notebooks ne partagent une session à haute concurrence que s'ils sont exécutés par le même utilisateur et ont le même lakehouse par défaut, la même configuration de calcul Spark et les mêmes packages de bibliothèques. NB-Ingest et NB-Clean utilisent LH-Bronze alors que NB-Conform et NB-Publish utilisent LH-Silver : la balise de session ne peut pas les regrouper dans une seule session, et au moins deux sessions démarrent.
references:
  - title: Configure high concurrency mode for Fabric notebooks in pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-high-concurrency-session-notebooks-in-pipelines
