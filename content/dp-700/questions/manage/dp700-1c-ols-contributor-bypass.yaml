id: dp700-1c-ols-contributor-bypass
objective: "1.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS1 that contains a lakehouse named Lakehouse1. You create a OneLake security role in Lakehouse1 that grants Read on the Files/partners folder only, and you add a group named Partners to the role.

    The members of Partners have the Contributor role in WS1. They only need to read Files/partners with Spark. They can still read every folder and table of Lakehouse1.

    You need to ensure that the OneLake security role restricts the members of Partners.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS1 qui contient un lakehouse nommé Lakehouse1. Vous créez dans Lakehouse1 un rôle de sécurité OneLake qui accorde Read sur le seul dossier Files/partners, et vous ajoutez un groupe nommé Partners au rôle.

    Les membres de Partners ont le rôle Contributor dans WS1. Ils n'ont besoin que de lire Files/partners avec Spark. Ils peuvent toujours lire tous les dossiers et toutes les tables de Lakehouse1.

    Vous devez faire en sorte que le rôle de sécurité OneLake restreigne les membres de Partners.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove Partners from the DefaultReader role of Lakehouse1.", fr: "Retirer Partners du rôle DefaultReader de Lakehouse1." } }
    - { id: b, text: { en: "Change the workspace role of Partners to Viewer.", fr: "Remplacer le rôle d'espace de travail de Partners par Viewer." } }
    - { id: c, text: { en: "Change the permission of the role from Read to ReadWrite.", fr: "Remplacer l'autorisation du rôle Read par ReadWrite." } }
    - { id: d, text: { en: "Switch the SQL analytics endpoint of Lakehouse1 to User's identity access mode.", fr: "Basculer le point de terminaison d'analytique SQL de Lakehouse1 en mode User's identity access mode." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      OneLake security roles restrict users who have the Viewer role or item permissions. Admins, Members and Contributors have write permission on every item of the workspace, so they keep full data access. As Viewers without ReadAll, the members of Partners can read only what the role grants.
    fr: |
      Les rôles de sécurité OneLake restreignent les utilisateurs qui ont le rôle Viewer ou des autorisations d'élément. Les Admins, Members et Contributors ont l'autorisation d'écriture sur tous les éléments de l'espace de travail : ils gardent un accès complet aux données. En tant que Viewers sans ReadAll, les membres de Partners ne peuvent lire que ce que le rôle accorde.
  options:
    a: { en: "Contributors get their access from their write permission, not from DefaultReader, which applies to ReadAll users.", fr: "Les Contributors tiennent leur accès de l'autorisation d'écriture, pas de DefaultReader, qui concerne les utilisateurs ReadAll." }
    c: { en: "ReadWrite grants more, not less, and doesn't restrict Contributors.", fr: "ReadWrite accorde davantage, pas moins, et ne restreint pas les Contributors." }
    d: { en: "The endpoint mode affects T-SQL queries only; the partners read the data with Spark.", fr: "Le mode du point de terminaison n'affecte que les requêtes T-SQL ; les partenaires lisent les données avec Spark." }
references:
  - title: Data security in OneLake
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-security
