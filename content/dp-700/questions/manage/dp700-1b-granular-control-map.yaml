id: dp700-1b-granular-control-map
objective: "1.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a warehouse named DW1 and a lakehouse named LH1. OneLake security is enabled on LH1. The users in the following requirements have the Viewer role.

    Which control should you use for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail qui contient un entrepôt nommé DW1 et un lakehouse nommé LH1. La sécurité OneLake est activée sur LH1. Les utilisateurs concernés par les exigences suivantes ont le rôle Viewer.

    Quel contrôle devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les contrôles appropriés vers les exigences correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: policy, text: { en: "T-SQL security policy with a filter predicate", fr: "Stratégie de sécurité T-SQL avec un prédicat de filtre" } }
    - { id: collist, text: { en: "GRANT SELECT with a column list", fr: "GRANT SELECT avec une liste de colonnes" } }
    - { id: olrow, text: { en: "OneLake security role with a row-level security rule", fr: "Rôle de sécurité OneLake avec une règle de sécurité au niveau des lignes" } }
    - { id: olfolder, text: { en: "OneLake security role that grants Read on a folder", fr: "Rôle de sécurité OneLake qui accorde Read sur un dossier" } }
    - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
  targets:
    - id: t1
      text: { en: "Regional managers see only their region's rows when they query DW1 with T-SQL", fr: "Les responsables régionaux ne voient que les lignes de leur région quand ils interrogent DW1 avec T-SQL" }
    - id: t2
      text: { en: "Regional managers see only their region's rows when they read the tables of LH1 with Spark", fr: "Les responsables régionaux ne voient que les lignes de leur région quand ils lisent les tables de LH1 avec Spark" }
    - id: t3
      text: { en: "Contractors who read LH1 with Spark can open only the Files/contracts folder", fr: "Les prestataires qui lisent LH1 avec Spark ne peuvent ouvrir que le dossier Files/contracts" }
    - id: t4
      text: { en: "Analysts who query DW1 can't read the Salary column of dbo.Employee", fr: "Les analystes qui interrogent DW1 ne peuvent pas lire la colonne Salary de dbo.Employee" }
answer:
  mapping: { t1: policy, t2: olrow, t3: olfolder, t4: collist }
explanation:
  correct:
    en: |
      In a warehouse, row-level security is a T-SQL security policy with a filter predicate, and column-level security is a GRANT SELECT on a list of columns; both apply only to queries that go through the SQL engine. For data read from OneLake by Spark, OneLake security roles apply, with a row-level rule on a table or a grant on a folder, which subfolders and files inherit.
    fr: |
      Dans un entrepôt, la sécurité au niveau des lignes est une stratégie de sécurité T-SQL avec un prédicat de filtre, et la sécurité au niveau des colonnes est un GRANT SELECT sur une liste de colonnes ; elles ne s'appliquent qu'aux requêtes qui passent par le moteur SQL. Pour les données lues dans OneLake par Spark, ce sont les rôles de sécurité OneLake qui s'appliquent, avec une règle au niveau des lignes sur une table ou une autorisation sur un dossier, dont héritent les sous-dossiers et les fichiers.
  options:
    ddm: { en: "Dynamic data masking only obfuscates values in query results; users who can query the column can still infer the values.", fr: "Le masquage dynamique des données ne fait que masquer les valeurs dans les résultats ; les utilisateurs qui peuvent interroger la colonne peuvent toujours en déduire les valeurs." }
references:
  - title: Row-Level Security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
  - title: OneLake security roles, permissions, and scopes
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
