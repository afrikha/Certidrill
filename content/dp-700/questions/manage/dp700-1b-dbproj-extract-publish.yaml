id: dp700-1b-dbproj-extract-publish
objective: "1.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Dev that contains a SQL database named SQL_Sales. SQL_Sales was created in the Fabric portal, WS-Dev isn't connected to Git, and SQL_Sales has no SQL project yet.

    You need to add a view named dbo.vw_TopCustomers to SQL_Sales by using a database project in Visual Studio Code. The SQL Database Projects and SQL Server (mssql) extensions are installed.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Dev qui contient une base de données SQL nommée SQL_Sales. SQL_Sales a été créée dans le portail Fabric, WS-Dev n'est pas connecté à Git, et SQL_Sales n'a pas encore de projet SQL.

    Vous devez ajouter une vue nommée dbo.vw_TopCustomers à SQL_Sales avec un projet de base de données dans Visual Studio Code. Les extensions SQL Database Projects et SQL Server (mssql) sont installées.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: profile, text: { en: "Create a connection profile that uses the connection string of SQL_Sales.", fr: "Créer un profil de connexion qui utilise la chaîne de connexion de SQL_Sales." } }
    - { id: extract, text: { en: "Run Create Project From Database and select the SQL_Sales profile.", fr: "Exécuter Create Project From Database et sélectionner le profil SQL_Sales." } }
    - { id: edit, text: { en: "Add a .sql file that contains the CREATE VIEW statement under the dbo folder.", fr: "Ajouter un fichier .sql contenant l'instruction CREATE VIEW sous le dossier dbo." } }
    - { id: build, text: { en: "Build the project.", fr: "Générer (Build) le projet." } }
    - { id: publish, text: { en: "Publish to an existing SQL server and select Publish.", fr: "Publier sur un serveur SQL existant et sélectionner Publish." } }
    - { id: new2022, text: { en: "Run Database Projects: New and set the target platform to SQL Server 2022.", fr: "Exécuter Database Projects: New et définir la plateforme cible sur SQL Server 2022." } }
    - { id: pipeline, text: { en: "Create a deployment pipeline and assign WS-Dev to its first stage.", fr: "Créer un pipeline de déploiement et affecter WS-Dev à sa première phase." } }
answer:
  sequence: [ profile, extract, edit, build, publish ]
explanation:
  correct:
    en: |
      Create Project From Database needs a connection profile that points to the database, and it generates one .sql file per existing object. You then add the view file, build the project to validate it and produce the .dacpac, and publish it to SQL_Sales, which applies only the difference.
    fr: |
      Create Project From Database a besoin d'un profil de connexion qui pointe vers la base de données, et il génère un fichier .sql par objet existant. Vous ajoutez ensuite le fichier de la vue, vous générez le projet pour le valider et produire le fichier .dacpac, puis vous le publiez sur SQL_Sales, ce qui applique uniquement la différence.
  options:
    new2022: { en: "A new empty project wouldn't contain the existing objects, and the project must target SQL database in Microsoft Fabric, not SQL Server 2022.", fr: "Un nouveau projet vide ne contiendrait pas les objets existants, et le projet doit cibler SQL database in Microsoft Fabric, pas SQL Server 2022." }
    pipeline: { en: "A deployment pipeline promotes items between workspaces; it isn't needed to change SQL_Sales in WS-Dev.", fr: "Un pipeline de déploiement promeut des éléments entre espaces de travail ; il n'est pas nécessaire pour modifier SQL_Sales dans WS-Dev." }
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
