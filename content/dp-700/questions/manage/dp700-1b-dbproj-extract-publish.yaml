id: dp700-1b-dbproj-extract-publish
objective: "1.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Dev that contains a warehouse named DW_Sales. DW_Sales was created in the Fabric portal and has no database project yet.

    You need to add a view named dbo.vw_TopCustomers to DW_Sales by using a database project in Visual Studio Code. The SQL Database Projects and SQL Server (mssql) extensions are installed.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Dev qui contient un entrepôt nommé DW_Sales. DW_Sales a été créé dans le portail Fabric et n'a pas encore de projet de base de données.

    Vous devez ajouter une vue nommée dbo.vw_TopCustomers à DW_Sales avec un projet de base de données dans Visual Studio Code. Les extensions SQL Database Projects et SQL Server (mssql) sont installées.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: profile, text: { en: "Create a connection profile that uses the SQL connection string of DW_Sales.", fr: "Créer un profil de connexion qui utilise la chaîne de connexion SQL de DW_Sales." } }
    - { id: extract, text: { en: "Run Create Project From Database and select the DW_Sales profile.", fr: "Exécuter Create Project From Database et sélectionner le profil DW_Sales." } }
    - { id: edit, text: { en: "Add a .sql file that contains the CREATE VIEW statement under the dbo folder.", fr: "Ajouter un fichier .sql contenant l'instruction CREATE VIEW sous le dossier dbo." } }
    - { id: build, text: { en: "Build the project.", fr: "Générer (Build) le projet." } }
    - { id: publish, text: { en: "Publish to an existing SQL server and select Publish.", fr: "Publier sur un serveur SQL existant et sélectionner Publish." } }
    - { id: new2022, text: { en: "Run Database Projects: New and set the target platform to SQL Server 2022.", fr: "Exécuter Database Projects: New et définir la plateforme cible sur SQL Server 2022." } }
    - { id: pipeline, text: { en: "Create a deployment pipeline and assign WS-Dev to its first stage.", fr: "Créer un pipeline de déploiement et affecter WS-Dev à sa première phase." } }
answer:
  sequence: [ profile, extract, edit, build, publish ]
explanation:
  correct:
    en: |
      Create Project From Database needs a connection profile that points to the warehouse SQL connection string, and it generates one .sql file per existing object. You then add the view file, build the project to validate it and produce the .dacpac, and publish it to DW_Sales, which applies only the difference.
    fr: |
      Create Project From Database a besoin d'un profil de connexion qui pointe vers la chaîne de connexion SQL de l'entrepôt, et il génère un fichier .sql par objet existant. Vous ajoutez ensuite le fichier de la vue, vous générez le projet pour le valider et produire le fichier .dacpac, puis vous le publiez sur DW_Sales, ce qui applique uniquement la différence.
  options:
    new2022: { en: "A new empty project wouldn't contain the existing objects, and a warehouse project targets Synapse Data Warehouse in Microsoft Fabric, not SQL Server 2022.", fr: "Un nouveau projet vide ne contiendrait pas les objets existants, et un projet d'entrepôt cible Synapse Data Warehouse in Microsoft Fabric, pas SQL Server 2022." }
    pipeline: { en: "A deployment pipeline promotes items between workspaces; it isn't needed to change DW_Sales in WS-Dev.", fr: "Un pipeline de déploiement promeut des éléments entre espaces de travail ; il n'est pas nécessaire pour modifier DW_Sales dans WS-Dev." }
references:
  - title: Develop Warehouse Projects in Visual Studio Code
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/develop-warehouse-project
