id: dp700-1c-endorse-master-data-setting
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric tenant. A lakehouse named LH_Products contains the product reference data that every department must use.

    The members of a security group named DataStewards have the Contributor role in the workspace that contains LH_Products. In the endorsement settings of LH_Products, they can select Promoted, but the Master data option is unavailable to them.

    You need to ensure that the data stewards can endorse LH_Products as Master data.

    What should you do?
  fr: |
    Vous disposez d'un locataire Fabric. Un lakehouse nommé LH_Products contient les données de référence des produits que tous les services doivent utiliser.

    Les membres d'un groupe de sécurité nommé DataStewards ont le rôle Contributor dans l'espace de travail qui contient LH_Products. Dans les paramètres d'approbation de LH_Products, ils peuvent sélectionner Promoted, mais l'option Master data leur est indisponible.

    Vous devez faire en sorte que les responsables des données puissent approuver LH_Products comme Master data.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign DataStewards the Admin role in the workspace that contains LH_Products.", fr: "Attribuer à DataStewards le rôle Admin dans l'espace de travail qui contient LH_Products." } }
    - { id: b, text: { en: "Certify LH_Products first, because Master data requires a certified item.", fr: "Certifier d'abord LH_Products, car Master data exige un élément certifié." } }
    - { id: c, text: { en: "Have a Fabric administrator enable master data endorsement for the DataStewards group.", fr: "Faire activer par un administrateur Fabric l'approbation Master data pour le groupe DataStewards." } }
    - { id: d, text: { en: "Share LH_Products with DataStewards and select the Share option.", fr: "Partager LH_Products avec DataStewards en sélectionnant l'option Share." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Master data badge is available only when a Fabric administrator enables master data endorsement in the tenant settings, and only to the users the administrator specifies. The data stewards already have write permission on LH_Products, which is the other requirement.
    fr: |
      Le badge Master data n'est disponible que si un administrateur Fabric active l'approbation Master data dans les paramètres du locataire, et seulement pour les utilisateurs qu'il désigne. Les responsables des données ont déjà l'autorisation d'écriture sur LH_Products, l'autre condition requise.
  options:
    a: { en: "A higher workspace role doesn't grant master data rights, which come from the tenant setting.", fr: "Un rôle d'espace de travail plus élevé n'accorde pas les droits Master data, qui viennent du paramètre de locataire." }
    b: { en: "Master data and Certified are separate badges; neither is a prerequisite for the other.", fr: "Master data et Certified sont des badges distincts ; aucun n'est un prérequis de l'autre." }
    d: { en: "Reshare permission lets users share the item; it doesn't authorize endorsement.", fr: "L'autorisation Reshare permet de partager l'élément ; elle n'autorise pas l'approbation." }
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
