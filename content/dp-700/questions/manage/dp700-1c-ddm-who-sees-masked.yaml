id: dp700-1c-ddm-who-sees-masked
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a warehouse named DW1. The Salary column of the dbo.Employee table in DW1 has the mask default(). No user has been granted UNMASK.

    The following users run SELECT * FROM dbo.Employee:

    | User | Access to DW1 |
    | --- | --- |
    | User1 | Admin role in Workspace1 |
    | User2 | Contributor role in Workspace1 |
    | User3 | Viewer role in Workspace1 |
    | User4 | No workspace role; DW1 shared with the Read all data using SQL option |
    | User5 | Member role in Workspace1 |

    Which two users see masked Salary values?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un entrepôt nommé DW1. La colonne Salary de la table dbo.Employee de DW1 a le masque default(). Aucun utilisateur n'a reçu UNMASK.

    Les utilisateurs suivants exécutent SELECT * FROM dbo.Employee :

    | Utilisateur | Accès à DW1 |
    | --- | --- |
    | User1 | Rôle Admin dans Workspace1 |
    | User2 | Rôle Contributor dans Workspace1 |
    | User3 | Rôle Viewer dans Workspace1 |
    | User4 | Aucun rôle d'espace de travail ; DW1 partagé avec l'option Read all data using SQL |
    | User5 | Rôle Member dans Workspace1 |

    Quels sont les deux utilisateurs qui voient des valeurs Salary masquées ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: u1, text: User1 }
    - { id: u2, text: User2 }
    - { id: u3, text: User3 }
    - { id: u4, text: User4 }
    - { id: u5, text: User5 }
answer: { optionIds: [ u3, u4 ] }
explanation:
  correct:
    en: |
      The Admin, Member and Contributor workspace roles have CONTROL on the warehouse database, which includes UNMASK, so they see real values. A Viewer and a user who received the item with the ReadData permission (Read all data using SQL) can read the table but have no UNMASK or CONTROL, so they get masked values.
    fr: |
      Les rôles d'espace de travail Admin, Member et Contributor ont CONTROL sur la base de données de l'entrepôt, ce qui inclut UNMASK : ils voient les vraies valeurs. Un Viewer et un utilisateur qui a reçu l'élément avec l'autorisation ReadData (Read all data using SQL) peuvent lire la table mais n'ont ni UNMASK ni CONTROL : ils obtiennent des valeurs masquées.
  options:
    u1: { en: "Admins have CONTROL on the database and see unmasked data.", fr: "Les Admins ont CONTROL sur la base de données et voient les données non masquées." }
    u2: { en: "Contributors have CONTROL on the database and see unmasked data.", fr: "Les Contributors ont CONTROL sur la base de données et voient les données non masquées." }
    u5: { en: "Members have CONTROL on the database and see unmasked data.", fr: "Les Members ont CONTROL sur la base de données et voient les données non masquées." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
