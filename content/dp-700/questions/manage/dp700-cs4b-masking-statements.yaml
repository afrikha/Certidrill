id: dp700-cs4b-masking-statements
objective: "1.3.4"
type: yesno_statements
caseStudy: dp700-cs4b-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You review the dynamic data masking configuration of dbo.DimDistributor in WH_Sales.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la configuration du masquage dynamique des données de dbo.DimDistributor dans WH_Sales.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Adding CreditControl to the Contributor role of FC-Data-Prod meets the requirement for CreditControl.
        fr: |
          L'ajout de CreditControl au rôle Contributor de FC-Data-Prod satisfait l'exigence concernant CreditControl.
    - id: s2
      text:
        en: |
          Granting CreditControl the UNMASK permission on the BankAccount column meets the requirement for CreditControl.
        fr: |
          Accorder à CreditControl l'autorisation UNMASK sur la colonne BankAccount satisfait l'exigence concernant CreditControl.
    - id: s3
      text:
        en: |
          The mask on BankAccount prevents FinanceAnalysts from confirming the value of a bank account by using it in a WHERE clause.
        fr: |
          Le masque sur BankAccount empêche FinanceAnalysts de confirmer la valeur d'un compte bancaire en l'utilisant dans une clause WHERE.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The Admin, Member and Contributor workspace roles have CONTROL on the warehouse, which includes UNMASK on every column, so a Contributor would also see TaxId unmasked. UNMASK can instead be granted on a single column, so CreditControl sees the full BankAccount values while TaxId stays masked. Masking only changes the values that a query returns: predicates are evaluated on the real data, so a user can infer a masked value by filtering on it.
    fr: |
      Les rôles d'espace de travail Admin, Member et Contributor disposent de CONTROL sur l'entrepôt, ce qui inclut UNMASK sur toutes les colonnes : un Contributor verrait aussi TaxId non masquée. UNMASK peut au contraire être accordé sur une seule colonne : CreditControl voit les valeurs complètes de BankAccount pendant que TaxId reste masquée. Le masquage ne modifie que les valeurs renvoyées par une requête : les prédicats sont évalués sur les vraies données, si bien qu'un utilisateur peut déduire une valeur masquée en filtrant dessus.
  options:
    s1:
      en: |
        No. The Contributor role gives CONTROL on the warehouse, so TaxId would also be unmasked for CreditControl, and the role grants far more than reading.
      fr: |
        Non. Le rôle Contributor donne CONTROL sur l'entrepôt : TaxId serait aussi démasquée pour CreditControl, et le rôle accorde bien plus que la lecture.
    s3:
      en: |
        No. Dynamic data masking does not stop inference through WHERE predicates; combine it with column-level security or permissions when that matters.
      fr: |
        Non. Le masquage dynamique des données n'empêche pas les déductions par des prédicats WHERE ; combinez-le avec la sécurité au niveau des colonnes ou des autorisations quand c'est important.
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
