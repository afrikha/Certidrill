id: dp700-cs3b-masking
objective: "1.3.4"
type: yesno_statements
caseStudy: dp700-cs3b-woodgrove
difficulty: 3
status: draft
stem:
  en: |
    To meet the security requirements, you run the following T-SQL statements in DW-Claims of WS-Claims-Prod, and you enable the row-level security policy that filters dbo.FactClaim on AdjusterUpn.

    ```sql
    ALTER TABLE dbo.DimPolicyholder
    ALTER COLUMN NationalId ADD MASKED WITH (FUNCTION = 'partial(0,"XXX-XX-",4)');

    GRANT UNMASK ON dbo.DimPolicyholder(NationalId) TO [FraudTeam];
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour respecter les exigences de sécurité, vous exécutez les instructions T-SQL suivantes dans DW-Claims de WS-Claims-Prod, et vous activez la stratégie de sécurité au niveau des lignes qui filtre dbo.FactClaim sur AdjusterUpn.

    ```sql
    ALTER TABLE dbo.DimPolicyholder
    ALTER COLUMN NationalId ADD MASKED WITH (FUNCTION = 'partial(0,"XXX-XX-",4)');

    GRANT UNMASK ON dbo.DimPolicyholder(NationalId) TO [FraudTeam];
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An adjuster who queries dbo.DimPolicyholder sees the last four characters of NationalId, preceded by XXX-XX-.
        fr: |
          Un gestionnaire de sinistres qui interroge dbo.DimPolicyholder voit les quatre derniers caractères de NationalId, précédés de XXX-XX-.
    - id: s2
      text:
        en: |
          The data engineers see masked NationalId values when they query dbo.DimPolicyholder in WS-Claims-Prod.
        fr: |
          Les ingénieurs données voient des valeurs NationalId masquées quand ils interrogent dbo.DimPolicyholder dans WS-Claims-Prod.
    - id: s3
      text:
        en: |
          The row-level security policy also filters the rows of dbo.FactClaim that the data engineers see in WS-Claims-Prod.
        fr: |
          La stratégie de sécurité au niveau des lignes filtre aussi les lignes de dbo.FactClaim que voient les ingénieurs données dans WS-Claims-Prod.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The partial() function exposes no leading characters, adds the padding string XXX-XX- and exposes the last four characters, which is what adjusters see because they have only the Viewer role. The data engineers have the Contributor role, which grants CONTROL on the warehouse, so they see unmasked data even without UNMASK. Row-level security works differently; its security policy applies to every user, including dbo and workspace Admins, Members and Contributors, unless the predicate itself makes an exception.
    fr: |
      La fonction partial() n'expose aucun caractère initial, ajoute la chaîne de remplissage XXX-XX- et expose les quatre derniers caractères ; c'est ce que voient les gestionnaires, qui n'ont que le rôle Viewer. Les ingénieurs données ont le rôle Contributor, qui accorde CONTROL sur l'entrepôt : ils voient les données non masquées même sans UNMASK. La sécurité au niveau des lignes fonctionne différemment : sa stratégie de sécurité s'applique à tous les utilisateurs, y compris dbo et les rôles d'espace de travail Admin, Member et Contributor, sauf si le prédicat lui-même prévoit une exception.
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
  - title: Row-level security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
