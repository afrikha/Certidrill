id: dp700-1d-interval-schedule
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Meter. PL_Meter copies rows from an Azure SQL database table named dbo.Readings, which has a ReadingTime column, to a lakehouse.

    Each run of PL_Meter must copy exactly one fixed time slice of dbo.Readings. Consecutive slices must not overlap or leave gaps, even when a run starts a few minutes late. The pipeline must not store any watermark.

    You need to configure how PL_Meter starts and how its source query receives the slice boundaries. What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Meter. PL_Meter copie vers un lakehouse les lignes d'une table de base de données Azure SQL nommée dbo.Readings, qui a une colonne ReadingTime.

    Chaque exécution de PL_Meter doit copier exactement une tranche de temps fixe de dbo.Readings. Les tranches consécutives ne doivent ni se chevaucher ni laisser de trous, même quand une exécution démarre avec quelques minutes de retard. Le pipeline ne doit stocker aucun filigrane.

    Vous devez configurer le démarrage de PL_Meter et la façon dont sa requête source reçoit les bornes de la tranche. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add a fixed hourly schedule, and filter ReadingTime between @pipeline().TriggerTime minus one hour and @pipeline().TriggerTime."
        fr: "Ajouter une planification fixe toutes les heures, et filtrer ReadingTime entre @pipeline().TriggerTime moins une heure et @pipeline().TriggerTime."
    - id: b
      text:
        en: "Add a fixed hourly schedule, and filter ReadingTime between utcNow() minus one hour and utcNow()."
        fr: "Ajouter une planification fixe toutes les heures, et filtrer ReadingTime entre utcNow() moins une heure et utcNow()."
    - id: c
      text:
        en: "Add a trigger on job events of PL_Meter for succeeded jobs, and filter ReadingTime from @pipeline().TriggerTime onward."
        fr: "Ajouter un déclencheur sur les événements de travaux de PL_Meter pour les travaux réussis, et filtrer ReadingTime à partir de @pipeline().TriggerTime."
    - id: d
      text:
        en: "Add an interval-based schedule, and filter ReadingTime between the Window start time and Window end time trigger parameters."
        fr: "Ajouter une planification par intervalle, et filtrer ReadingTime entre les paramètres de déclencheur Window start time et Window end time."
answer: { optionId: d }
explanation:
  correct:
    en: |
      An interval-based schedule (preview) runs the pipeline on fixed, non-overlapping intervals and exposes the boundaries of each interval as the Window start time and Window end time trigger parameters. Because the boundaries belong to the interval, not to the moment the run starts, a late run still processes exactly its own slice.
    fr: |
      Une planification par intervalle (préversion) exécute le pipeline sur des intervalles fixes sans chevauchement et expose les bornes de chaque intervalle comme paramètres de déclencheur Window start time et Window end time. Comme les bornes appartiennent à l'intervalle, et non au moment où l'exécution démarre, une exécution en retard traite toujours exactement sa propre tranche.
  options:
    a: { en: "TriggerTime is the time the trigger actually fired, which can differ from the scheduled time, so consecutive windows can overlap or leave gaps.", fr: "TriggerTime est l'heure à laquelle le déclencheur s'est réellement déclenché, qui peut différer de l'heure planifiée : des fenêtres consécutives peuvent donc se chevaucher ou laisser des trous." }
    b: { en: "utcNow() returns the time the expression is evaluated, so any delay shifts the window and creates gaps or overlaps.", fr: "utcNow() renvoie l'heure d'évaluation de l'expression : tout retard décale la fenêtre et crée des trous ou des chevauchements." }
    c: { en: "A trigger on its own succeeded jobs would start PL_Meter again after each run, and an open-ended filter does not define a fixed slice.", fr: "Un déclencheur sur ses propres travaux réussis relancerait PL_Meter après chaque exécution, et un filtre sans borne de fin ne définit pas une tranche fixe." }
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs
  - title: Expressions and functions for Data Factory in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/expression-language
