id: dp700-1d-disabled-schedule
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Orders. PL_Orders has a schedule that runs every 30 minutes until 01/01/2099.

    A connection used by PL_Orders lost its credentials, and the scheduled runs of PL_Orders failed 12 times in a row. You updated the credentials and a manual run of PL_Orders succeeded. Two hours later, the run history shows no new scheduled run.

    You need the schedule to start PL_Orders again. What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Orders. PL_Orders a une planification qui l'exécute toutes les 30 minutes jusqu'au 01/01/2099.

    Une connexion utilisée par PL_Orders a perdu ses informations d'identification, et les exécutions planifiées de PL_Orders ont échoué 12 fois de suite. Vous avez mis à jour les informations d'identification et une exécution manuelle de PL_Orders a réussi. Deux heures plus tard, l'historique des exécutions ne montre aucune nouvelle exécution planifiée.

    Vous devez faire en sorte que la planification démarre de nouveau PL_Orders. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Enable retries in the General settings of each activity of PL_Orders."
        fr: "Activer les nouvelles tentatives dans les paramètres généraux de chaque activité de PL_Orders."
    - id: b
      text:
        en: "Rerun the 12 failed runs of PL_Orders from the Monitor hub."
        fr: "Réexécuter les 12 exécutions ayant échoué de PL_Orders depuis le hub de surveillance."
    - id: c
      text:
        en: "Turn the schedule of PL_Orders back on in the Schedule settings."
        fr: "Réactiver la planification de PL_Orders dans les paramètres de Planification."
    - id: d
      text:
        en: "Add a failure notification for the schedule of PL_Orders."
        fr: "Ajouter une notification d'échec à la planification de PL_Orders."
answer: { optionId: c }
explanation:
  correct:
    en: |
      After repeated consecutive failures, typically 10, Fabric disables the schedule automatically to prevent further predictable failures. Fixing the cause is not enough: someone must restart the schedule manually, in the user interface, through the API or by a CI/CD process.
    fr: |
      Après des échecs consécutifs répétés, en général 10, Fabric désactive automatiquement la planification pour éviter d'autres échecs prévisibles. Corriger la cause ne suffit pas : quelqu'un doit relancer la planification manuellement, dans l'interface utilisateur, via l'API ou par un processus CI/CD.
  options:
    a: { en: "Retries apply to activities of runs that start; they do not restart a disabled schedule.", fr: "Les nouvelles tentatives s'appliquent aux activités des exécutions qui démarrent ; elles ne relancent pas une planification désactivée." }
    b: { en: "Rerunning past runs processes them again, but the schedule stays disabled and starts no future run.", fr: "Réexécuter les exécutions passées les traite de nouveau, mais la planification reste désactivée et ne lance aucune exécution future." }
    d: { en: "A failure notification only sends emails for failed scheduled runs; it does not re-enable the schedule.", fr: "Une notification d'échec envoie seulement des e-mails pour les exécutions planifiées qui échouent ; elle ne réactive pas la planification." }
references:
  - title: Job Scheduler in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
