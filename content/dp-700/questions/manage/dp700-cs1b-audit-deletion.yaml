id: dp700-cs1b-audit-deletion
objective: "1.3.7"
type: single
caseStudy: dp700-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |-
    The members of the security team have the Audit Logs role. You need to meet governance requirement 6. What should the security team use?
  fr: |-
    Les membres de l'équipe de sécurité disposent du rôle Audit Logs. Vous devez satisfaire l'exigence de gouvernance 6. Que doit utiliser l'équipe de sécurité ?
body:
  options:
    - { id: a, text: { en: "The audit log search in the Microsoft Purview portal", fr: "La recherche dans le journal d'audit du portail Microsoft Purview" } }
    - { id: b, text: { en: "The Monitoring hub, filtered on LP-Prod", fr: "Le hub de supervision, filtré sur LP-Prod" } }
    - { id: c, text: { en: "The Microsoft Fabric Capacity Metrics app", fr: "L'application Microsoft Fabric Capacity Metrics" } }
    - { id: d, text: { en: "The queryinsights.exec_requests_history view of WH_Royalty", fr: "La vue queryinsights.exec_requests_history de WH_Royalty" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Fabric records user activities, such as the deletion of an item, in the audit log. Users who have the Audit Logs role can search it in the Microsoft Purview portal and filter by date range, activity and user to find who deleted PL_LoadRoyalty.
    fr: |-
      Fabric enregistre les activités des utilisateurs, comme la suppression d'un élément, dans le journal d'audit. Les utilisateurs qui disposent du rôle Audit Logs peuvent y effectuer une recherche dans le portail Microsoft Purview et filtrer par plage de dates, activité et utilisateur pour trouver qui a supprimé PL_LoadRoyalty.
  options:
    b:
      en: |-
        The Monitoring hub shows the runs of pipelines, notebooks and other jobs; it does not record who deleted an item.
      fr: |-
        Le hub de supervision affiche les exécutions des pipelines, des notebooks et d'autres travaux ; il n'enregistre pas qui a supprimé un élément.
    c:
      en: |-
        The Capacity Metrics app reports capacity consumption by item and operation, not user actions such as deletions.
      fr: |-
        L'application Capacity Metrics indique la consommation de capacité par élément et par opération, pas les actions des utilisateurs comme les suppressions.
    d:
      en: |-
        Query insights records the T-SQL queries run against the warehouse; deleting a pipeline item is not a warehouse query.
      fr: |-
        Query Insights enregistre les requêtes T-SQL exécutées sur l'entrepôt ; la suppression d'un élément pipeline n'est pas une requête de l'entrepôt.
references:
  - title: Track user activities in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/admin/track-user-activities
