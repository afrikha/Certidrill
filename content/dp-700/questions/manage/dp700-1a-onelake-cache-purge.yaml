id: dp700-1a-onelake-cache-purge
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Vendor** whose shortcut cache is on with a retention period of 21 days. The workspace reads files from an Amazon S3 bucket through several shortcuts.

    The contract with the vendor ends today. The compliance team requires that all the vendor files cached by WS-Vendor are removed immediately.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Vendor** dont le cache des raccourcis est activé avec une période de rétention de 21 jours. L'espace de travail lit des fichiers d'un compartiment Amazon S3 via plusieurs raccourcis.

    Le contrat avec le fournisseur se termine aujourd'hui. L'équipe de conformité exige que tous les fichiers du fournisseur mis en cache par WS-Vendor soient supprimés immédiatement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the retention period to 1 day", fr: "Remplacer la période de rétention par 1 jour" } }
    - { id: b, text: { en: "Run VACUUM on the tables of the lakehouse", fr: "Exécuter VACUUM sur les tables du lakehouse" } }
    - { id: c, text: { en: "Select Reset cache in the OneLake tab of the workspace settings", fr: "Sélectionner Reset cache dans l'onglet OneLake des paramètres de l'espace de travail" } }
    - { id: d, text: { en: "Refresh the metadata of the SQL analytics endpoint", fr: "Actualiser les métadonnées du point de terminaison d'analytique SQL" } }
answer: { optionId: c }
explanation:
  correct:
    en: Reset cache, in the same OneLake settings page as the cache toggle, removes all the files from the shortcut cache of the workspace at once. You can use it at any time.
    fr: Reset cache, sur la même page de paramètres OneLake que le bouton du cache, supprime en une fois tous les fichiers du cache des raccourcis de l'espace de travail. Vous pouvez l'utiliser à tout moment.
  options:
    a:
      en: A shorter retention period only purges files that aren't accessed within that period, so files remain cached for up to a day or longer if they are read again.
      fr: "Une période de rétention plus courte ne purge que les fichiers non consultés pendant cette période : des fichiers restent en cache jusqu'à un jour, ou plus longtemps s'ils sont relus."
    b:
      en: VACUUM removes old files of Delta tables stored in OneLake; it doesn't touch the shortcut cache.
      fr: VACUUM supprime les anciens fichiers des tables Delta stockées dans OneLake ; il ne touche pas au cache des raccourcis.
    d:
      en: Refreshing the SQL analytics endpoint synchronizes table metadata; it doesn't clear cached files.
      fr: L'actualisation du point de terminaison d'analytique SQL synchronise les métadonnées des tables ; elle ne vide pas les fichiers en cache.
references:
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
