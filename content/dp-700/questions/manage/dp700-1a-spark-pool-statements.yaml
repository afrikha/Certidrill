id: dp700-1a-spark-pool-statements
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the Spark pool options of a Fabric workspace named **WS-Eng** before you change its **Default pool for workspace**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les options de pool Spark d'un espace de travail Fabric nommé **WS-Eng** avant de modifier son **Default pool for workspace**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The starter pool of WS-Eng uses Medium nodes.
        fr: Le pool de démarrage de WS-Eng utilise des nœuds Medium.
    - id: s2
      text:
        en: Setting the minimum node count of a custom pool to 1 places the driver and the executor on separate nodes.
        fr: Définir le nombre minimal de nœuds d'un pool personnalisé sur 1 place le pilote et l'exécuteur sur des nœuds distincts.
    - id: s3
      text:
        en: A custom Spark pool can be configured with up to 200 nodes.
        fr: Un pool Spark personnalisé peut être configuré avec jusqu'à 200 nœuds.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Starter pools are prehydrated pools of Medium nodes whose default and maximum sizes depend on the capacity SKU. A minimum of one node creates a single-node cluster, where the driver and the executor run on the same node. Custom Spark pools currently support a maximum of 200 nodes, and the autoscale minimum and maximum must stay within that limit.
    fr: Les pools de démarrage sont des pools préhydratés de nœuds Medium dont les tailles par défaut et maximales dépendent de la référence SKU de la capacité. Un minimum d'un nœud crée un cluster à nœud unique, où le pilote et l'exécuteur s'exécutent sur le même nœud. Les pools Spark personnalisés prennent actuellement en charge 200 nœuds au maximum, et le minimum et le maximum de la mise à l'échelle automatique doivent rester dans cette limite.
references:
  - title: Configure and manage starter pools in Fabric Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-starter-pools
  - title: Workspace administration settings in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
