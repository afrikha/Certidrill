id: dp700-1a-spark-hc-pipeline-grid
objective: "1.1.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Retail**. The High concurrency setting **For pipeline running multiple notebooks** is on, and no Spark property has been changed from its default value.

    A pipeline named **PL-Load** runs the five Notebook activities shown in the following table at the same time. The pipeline runs all the notebooks under the same user identity. Env-Std and Env-ML have the same compute settings, but Env-ML contains additional library packages. NB1 starts first.

    Answer each prompt by selecting the notebook that matches it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Retail**. Le paramètre de haute concurrence **For pipeline running multiple notebooks** est activé, et aucune propriété Spark n'a été modifiée par rapport à sa valeur par défaut.

    Un pipeline nommé **PL-Load** exécute en même temps les cinq activités Notebook présentées dans le tableau suivant. Le pipeline exécute tous les notebooks sous la même identité d'utilisateur. Env-Std et Env-ML ont les mêmes paramètres de calcul, mais Env-ML contient des packages de bibliothèques supplémentaires. NB1 démarre en premier.

    Répondez à chaque consigne en sélectionnant le notebook qui y correspond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The notebook that can't share the session of NB1 because of its default lakehouse", fr: "Le notebook qui ne peut pas partager la session de NB1 à cause de son lakehouse par défaut" }
    - id: p2
      text: { en: "The notebook that can't share the session of NB1 because of its library packages", fr: "Le notebook qui ne peut pas partager la session de NB1 à cause de ses packages de bibliothèques" }
  grid:
    header: [{ en: "Notebook", fr: "Notebook" }, { en: "Default lakehouse", fr: "Lakehouse par défaut" }, { en: "Environment", fr: "Environnement" }, { en: "Session tag", fr: "Balise de session" }, { en: "Notes", fr: "Remarques" }]
    rows:
      - [{ text: NB1, area: nb1 }, { text: LH_Sales }, { text: Env-Std }, { text: load }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: NB2, area: nb2 }, { text: LH_Sales }, { text: Env-Std }, { text: load }, { text: { en: "Installs a package inline with %pip in a cell", fr: "Installe un package en ligne avec %pip dans une cellule" } }]
      - [{ text: NB3, area: nb3 }, { text: LH_Finance }, { text: Env-Std }, { text: load }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: NB4, area: nb4 }, { text: LH_Sales }, { text: Env-ML }, { text: load }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: NB5, area: nb5 }, { text: LH_Sales }, { text: Env-Std }, { text: load }, { text: { en: "Reads tables of LH_Finance through a OneLake shortcut", fr: "Lit des tables de LH_Finance via un raccourci OneLake" } }]
answer:
  values: { p1: nb3, p2: nb4 }
explanation:
  correct:
    en: Notebooks with the same session tag share a high concurrency session only if they are run by the same user and have the same default lakehouse, the same Spark compute configuration and the same library packages. NB3 has a different default lakehouse and NB4 uses an environment with other library packages, so each gets another session. Inline installs in notebook cells, like NB2's %pip, don't prevent sharing, and NB5 reads LH_Finance through a shortcut while keeping LH_Sales as its default lakehouse.
    fr: "Des notebooks ayant la même balise de session ne partagent une session haute concurrence que s'ils sont exécutés par le même utilisateur et ont le même lakehouse par défaut, la même configuration de calcul Spark et les mêmes packages de bibliothèques. NB3 a un autre lakehouse par défaut et NB4 utilise un environnement avec d'autres packages de bibliothèques : chacun obtient donc une autre session. Les installations en ligne dans les cellules, comme le %pip de NB2, n'empêchent pas le partage, et NB5 lit LH_Finance via un raccourci tout en gardant LH_Sales comme lakehouse par défaut."
references:
  - title: Configure high concurrency mode for Fabric notebooks in pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-high-concurrency-session-notebooks-in-pipelines
