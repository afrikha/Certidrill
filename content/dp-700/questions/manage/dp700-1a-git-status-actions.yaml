id: dp700-1a-git-status-actions
objective: "1.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Dev** that is connected to a Git branch. The **Source control** pane shows four items with different Git statuses. For each item, you want the workspace and the branch to hold the same version, keeping the most recent change wherever only one side changed.

    Which action should you take for each Git status? To answer, drag the appropriate actions to the correct statuses. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Dev** connecté à une branche Git. Le volet **Source control** affiche quatre éléments ayant des états Git différents. Pour chaque élément, vous voulez que l'espace de travail et la branche contiennent la même version, en conservant la modification la plus récente lorsqu'un seul côté a changé.

    Quelle action devez-vous effectuer pour chaque état Git ? Pour répondre, faites glisser les actions appropriées vers les états correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: commit, text: { en: "Commit", fr: "Faire un commit (Commit)" } }
    - { id: update, text: { en: "Update", fr: "Mettre à jour (Update)" } }
    - { id: resolve, text: { en: "Resolve the conflict, then sync", fr: "Résoudre le conflit, puis synchroniser" } }
    - { id: none, text: { en: "No action", fr: "Aucune action" } }
    - { id: undo, text: { en: "Undo", fr: "Annuler (Undo)" } }
    - { id: switch, text: { en: "Switch branch", fr: "Changer de branche (Switch branch)" } }
  targets:
    - { id: uncommitted, text: "Uncommitted changes" }
    - { id: required, text: "Update required" }
    - { id: conflict, text: "Conflict" }
    - { id: synced, text: "Synced" }
answer:
  mapping: { uncommitted: commit, required: update, conflict: resolve, synced: none }
explanation:
  correct:
    en: Uncommitted changes means the item changed in the workspace, so you commit it to the branch. Update required means the item changed in Git, so you update the workspace. Conflict means the item changed on both sides and must be resolved before the update. Synced means both sides already hold the same content.
    fr: "Uncommitted changes signifie que l'élément a changé dans l'espace de travail : vous en faites un commit dans la branche. Update required signifie que l'élément a changé dans Git : vous mettez à jour l'espace de travail. Conflict signifie que l'élément a changé des deux côtés et doit être résolu avant la mise à jour. Synced signifie que les deux côtés contiennent déjà le même contenu."
  options:
    undo:
      en: Undo reverts a workspace change to the last synced state, which discards the most recent change.
      fr: Undo rétablit une modification de l'espace de travail dans le dernier état synchronisé, ce qui supprime la modification la plus récente.
    switch:
      en: Switching branch replaces all the workspace items with the content of another branch.
      fr: Changer de branche remplace tous les éléments de l'espace de travail par le contenu d'une autre branche.
references:
  - title: Basic concepts in Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
