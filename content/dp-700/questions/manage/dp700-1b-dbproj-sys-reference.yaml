id: dp700-1b-dbproj-sys-reference
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Fabric workspace named WS-Ops is connected to the main branch of a GitHub repository and contains a SQL database named SQL_Ops. Fabric stores SQL_Ops in the SQL_Ops.SQLDatabase folder of the branch.

    A developer clones the repository, adds a property to the .sqlproj file in that folder by hand, and merges the change into main. WS-Ops is updated from main without errors. Later, an engineer changes a view in SQL_Ops and commits it from WS-Ops. After that commit, the property is no longer in the .sqlproj file.

    What is the cause?
  fr: |
    Un espace de travail Fabric nommé WS-Ops est connecté à la branche main d'un dépôt GitHub et contient une base de données SQL nommée SQL_Ops. Fabric stocke SQL_Ops dans le dossier SQL_Ops.SQLDatabase de la branche.

    Un développeur clone le dépôt, ajoute à la main une propriété au fichier .sqlproj de ce dossier et fusionne la modification dans main. WS-Ops est mis à jour depuis main sans erreur. Plus tard, un ingénieur modifie une vue dans SQL_Ops et la valide (commit) depuis WS-Ops. Après ce commit, la propriété ne figure plus dans le fichier .sqlproj.

    Quelle est la cause ?
body:
  options:
    - { id: a, text: { en: "The update from main published SQL_Ops with ScriptDatabaseOptions set to false, which removed the property.", fr: "La mise à jour depuis main a publié SQL_Ops avec ScriptDatabaseOptions défini sur false, ce qui a supprimé la propriété." } }
    - { id: b, text: { en: "Fabric generates the .sqlproj file of SQL_Ops and overwrites manual edits at each commit from the workspace.", fr: "Fabric génère le fichier .sqlproj de SQL_Ops et écrase les modifications manuelles à chaque commit depuis l'espace de travail." } }
    - { id: c, text: { en: "The .sharedQueries folder is excluded from the build, so properties of the project file aren't kept.", fr: "Le dossier .sharedQueries est exclu du build : les propriétés du fichier projet ne sont donc pas conservées." } }
    - { id: d, text: { en: "Database-level settings aren't included in source control, so Fabric removed the property from the project.", fr: "Les paramètres de base de données ne sont pas inclus dans le contrôle de code source : Fabric a donc retiré la propriété du projet." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Fabric source control integration generates and updates the project file of a SQL database automatically. Manual edits to the project file are overwritten by the next commit from Fabric, which is why Learn advises against editing it. The update from main succeeded, but the engineer's commit rewrote the .sqlproj file without the property.
    fr: |
      L'intégration du contrôle de code source de Fabric génère et met à jour automatiquement le fichier projet d'une base de données SQL. Les modifications manuelles du fichier projet sont écrasées par le commit suivant depuis Fabric, et c'est pourquoi Learn déconseille de le modifier. La mise à jour depuis main a réussi, mais le commit de l'ingénieur a réécrit le fichier .sqlproj sans la propriété.
  options:
    a: { en: "ScriptDatabaseOptions=false is a publish option of the update; it affects what is applied to the database, not the content of the project file in Git.", fr: "ScriptDatabaseOptions=false est une option de publication de la mise à jour ; elle agit sur ce qui est appliqué à la base de données, pas sur le contenu du fichier projet dans Git." }
    c: { en: "Excluding .sharedQueries from the build keeps the deployment scripts out of the schema model; it doesn't remove properties from the project file.", fr: "Exclure .sharedQueries du build tient les scripts de déploiement hors du modèle de schéma ; cela ne retire pas de propriétés du fichier projet." }
    d: { en: "Collation and compatibility level aren't in source control, but that doesn't explain why a project file property disappears after a commit.", fr: "Le classement et le niveau de compatibilité ne sont pas dans le contrôle de code source, mais cela n'explique pas qu'une propriété du fichier projet disparaisse après un commit." }
references:
  - title: Fabric SQL database source control integration
    url: https://learn.microsoft.com/en-us/fabric/database/sql/source-control
