id: dp700-1b-dbproj-sys-reference
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an SDK-style database project for a Fabric warehouse named DW_Ops. The project contains a view named dbo.vw_ObjectList that queries sys.views. The default terminal of Visual Studio Code is PowerShell.

    The project builds without errors. When you select **Publish** and then **Generate Script** against DW_Ops, the operation fails with error SQL72033 on the reference to sys.views.

    You need to be able to publish the project. What should you do?
  fr: |
    Vous disposez d'un projet de base de données de style SDK pour un entrepôt Fabric nommé DW_Ops. Le projet contient une vue nommée dbo.vw_ObjectList qui interroge sys.views. Le terminal par défaut de Visual Studio Code est PowerShell.

    Le projet se génère sans erreur. Quand vous sélectionnez **Publish** puis **Generate Script** sur DW_Ops, l'opération échoue avec l'erreur SQL72033 sur la référence à sys.views.

    Vous devez pouvoir publier le projet. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set BlockOnPossibleDataLoss to False in the publish profile.", fr: "Définir BlockOnPossibleDataLoss sur False dans le profil de publication." } }
    - { id: b, text: { en: "Connect the publish profile to the SQL analytics endpoint of DW_Ops.", fr: "Connecter le profil de publication au point de terminaison d'analytique SQL de DW_Ops." } }
    - { id: c, text: { en: "Set DropObjectsNotInSource to True in the publish profile.", fr: "Définir DropObjectsNotInSource sur True dans le profil de publication." } }
    - { id: d, text: { en: "Add DatabaseVariableLiteralValue to the FabricDw package reference.", fr: "Ajouter DatabaseVariableLiteralValue à la référence du package FabricDw." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The project references the Fabric warehouse system objects through the `Microsoft.SqlServer.Dacpacs.FabricDw` package. Without `<DatabaseVariableLiteralValue>master</DatabaseVariableLiteralValue>` in that package reference, the build succeeds but Publish and Generate Script can fail with SQL72033 on `sys` schema references such as sys.views."
    fr: "Le projet référence les objets système de l'entrepôt Fabric via le package `Microsoft.SqlServer.Dacpacs.FabricDw`. Sans `<DatabaseVariableLiteralValue>master</DatabaseVariableLiteralValue>` dans cette référence de package, la génération réussit, mais Publish et Generate Script peuvent échouer avec l'erreur SQL72033 sur les références au schéma `sys`, comme sys.views."
  options:
    a: { en: "BlockOnPossibleDataLoss stops risky deployments; it doesn't resolve references to system objects, and production should keep it True.", fr: "BlockOnPossibleDataLoss arrête les déploiements risqués ; il ne résout pas les références aux objets système, et il doit rester True en production." }
    b: { en: "Warehouse projects connect with the warehouse SQL connection string, not the SQL analytics endpoint.", fr: "Les projets d'entrepôt se connectent avec la chaîne de connexion SQL de l'entrepôt, pas avec le point de terminaison d'analytique SQL." }
    c: { en: "DropObjectsNotInSource controls whether target objects missing from the project are dropped; it doesn't fix the system reference.", fr: "DropObjectsNotInSource détermine si les objets de la cible absents du projet sont supprimés ; il ne corrige pas la référence système." }
references:
  - title: Develop Warehouse Projects in Visual Studio Code
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/develop-warehouse-project
