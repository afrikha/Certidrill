id: dp700-1c-audit-predicate
objective: "1.3.7"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1. A service principal whose server principal name is sp-etl loads DW1 every 15 minutes.

    You need to configure the SQL audit logs of DW1 to record the text of every T-SQL batch that users run, except the batches run by sp-etl. The solution must minimize the storage used by the audit logs.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1. Un principal de service dont le nom de principal de serveur est sp-etl charge DW1 toutes les 15 minutes.

    Vous devez configurer les journaux d'audit SQL de DW1 pour enregistrer le texte de chaque lot T-SQL exécuté par les utilisateurs, sauf les lots exécutés par sp-etl. La solution doit réduire au minimum le stockage utilisé par les journaux d'audit.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Events to record: [[group]]
      Predicate expression: [[pred]]
    fr: |
      Events to record : [[group]]
      Predicate expression : [[pred]]
  slots:
    - id: group
      options:
        - { id: batch, text: Batch Was Completed }
        - { id: login, text: User Logged In }
        - { id: objchange, text: Object Was Changed }
        - { id: auditchange, text: Audit Was Changed }
    - id: pred
      options:
        - { id: notsp, text: "NOT server_principal_name = 'sp-etl'" }
        - { id: wheresp, text: "WHERE server_principal_name <> 'sp-etl'" }
        - { id: onlysp, text: "server_principal_name = 'sp-etl'" }
        - { id: stmt, text: "NOT statement LIKE 'sp-etl%'" }
answer:
  values: { group: batch, pred: notsp }
explanation:
  correct:
    en: |
      Batch Was Completed records each completed batch with its statement text. A predicate expression filters the events of the enabled groups before they're written, which reduces storage; it uses the CREATE SERVER AUDIT predicate syntax without the WHERE keyword, so NOT server_principal_name = 'sp-etl' drops the service principal's events.
    fr: |
      Batch Was Completed enregistre chaque lot terminé avec le texte de son instruction. Une expression de prédicat filtre les événements des groupes activés avant leur écriture, ce qui réduit le stockage ; elle utilise la syntaxe de prédicat de CREATE SERVER AUDIT sans le mot clé WHERE : NOT server_principal_name = 'sp-etl' écarte les événements du principal de service.
  options:
    login: { en: "User Logged In records authentications, not the batches that users run.", fr: "User Logged In enregistre les authentifications, pas les lots exécutés par les utilisateurs." }
    objchange: { en: "Object Was Changed records changes to objects, not every batch.", fr: "Object Was Changed enregistre les modifications d'objets, pas chaque lot." }
    auditchange: { en: "Audit Was Changed records changes to the audit configuration itself.", fr: "Audit Was Changed enregistre les modifications de la configuration d'audit elle-même." }
    wheresp: { en: "The predicate expression is written without the WHERE keyword.", fr: "L'expression de prédicat s'écrit sans le mot clé WHERE." }
    onlysp: { en: "This predicate keeps only the service principal's events, the opposite of the requirement.", fr: "Ce prédicat ne garde que les événements du principal de service, l'inverse de l'exigence." }
    stmt: { en: "The statement column contains the T-SQL text, not the identity that ran it.", fr: "La colonne statement contient le texte T-SQL, pas l'identité qui l'a exécuté." }
references:
  - title: SQL audit logs in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-audit-logs
  - title: How to configure SQL audit logs
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/configure-sql-audit-logs
