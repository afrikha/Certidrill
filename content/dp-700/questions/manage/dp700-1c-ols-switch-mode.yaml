id: dp700-1c-ols-switch-mode
objective: "1.3.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named WS1 that contains two lakehouses named Lakehouse1 and Lakehouse2. The SQL analytics endpoints of both lakehouses use delegated identity access mode. The endpoint of Lakehouse1 has custom SQL database roles and a T-SQL security policy.

    Lakehouse1 has OneLake security roles with row rules that Spark users already respect. You plan to switch the SQL analytics endpoint of Lakehouse1 to User's identity access mode so that T-SQL users get the same restrictions.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS1 qui contient deux lakehouses nommés Lakehouse1 et Lakehouse2. Les points de terminaison d'analytique SQL des deux lakehouses utilisent le mode d'accès avec identité déléguée (Delegated identity access mode). Le point de terminaison de Lakehouse1 comporte des rôles de base de données SQL personnalisés et une stratégie de sécurité T-SQL.

    Lakehouse1 comporte des rôles de sécurité OneLake avec des règles de lignes que les utilisateurs Spark respectent déjà. Vous prévoyez de basculer le point de terminaison d'analytique SQL de Lakehouse1 en mode User's identity access mode, pour que les utilisateurs T-SQL aient les mêmes restrictions.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The custom SQL database roles of the Lakehouse1 endpoint are deleted.", fr: "Les rôles de base de données SQL personnalisés du point de terminaison de Lakehouse1 sont supprimés." } }
    - { id: b, text: { en: "Queries running on the SQL analytics endpoint of Lakehouse2 are canceled during the switch.", fr: "Les requêtes en cours sur le point de terminaison d'analytique SQL de Lakehouse2 sont annulées pendant le basculement." } }
    - { id: c, text: { en: "The T-SQL security policy keeps filtering rows for Viewers after the switch.", fr: "La stratégie de sécurité T-SQL continue de filtrer les lignes pour les Viewers après le basculement." } }
    - { id: d, text: { en: "Only a Fabric administrator can perform the switch.", fr: "Seul un administrateur Fabric peut effectuer le basculement." } }
    - { id: e, text: { en: "After the switch, you define dynamic data masking in the OneLake security roles.", fr: "Après le basculement, vous définissez le masquage dynamique des données dans les rôles de sécurité OneLake." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Switching to User's identity access mode deletes the existing SQL roles, which can't be recovered, and makes the SQL analytics endpoints of the whole workspace temporarily unavailable, canceling running and queued queries on all of them. Plan the switch outside business hours.
    fr: |
      Basculer en mode User's identity access mode supprime les rôles SQL existants, sans possibilité de récupération, et rend temporairement indisponibles les points de terminaison d'analytique SQL de tout l'espace de travail, en annulant les requêtes en cours et en file d'attente sur chacun d'eux. Planifiez le basculement en dehors des heures ouvrées.
  options:
    c: { en: "In User's identity access mode, SQL row-level security is ignored; rows are filtered by the OneLake security roles.", fr: "En mode User's identity access mode, la sécurité SQL au niveau des lignes est ignorée ; les lignes sont filtrées par les rôles de sécurité OneLake." }
    d: { en: "Workspace Admins or Members can switch the access mode from the Security tab of the endpoint.", fr: "Les Admins ou Members de l'espace de travail peuvent changer le mode d'accès depuis l'onglet Security du point de terminaison." }
    e: { en: "Dynamic data masking isn't supported in OneLake security; it stays defined in SQL.", fr: "Le masquage dynamique des données n'est pas pris en charge dans la sécurité OneLake ; il reste défini en SQL." }
references:
  - title: OneLake security for SQL analytics endpoints
    url: https://learn.microsoft.com/en-us/fabric/onelake/sql-analytics-endpoint-onelake-security
