id: dp700-cs1c-client-access
objective: "1.3.8"
type: single
caseStudy: dp700-cs1c-trey-research
difficulty: 3
status: draft
stem:
  en: |-
    You need to grant SG-Litware access to LH_Assays. The solution must meet the client access requirement. What should you do?
  fr: |-
    Vous devez accorder à SG-Litware l'accès à LH_Assays. La solution doit respecter l'exigence relative à l'accès des clients. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share LH_Assays with SG-Litware and Read all with Apache Spark, then create a T-SQL security policy on the SQL analytics endpoint", fr: "Partager LH_Assays avec SG-Litware et Read all with Apache Spark, puis créer une stratégie de sécurité T-SQL sur le point de terminaison d'analytique SQL" } }
    - { id: b, text: { en: "Share LH_Assays with SG-Litware with no additional permission, then add the group to a OneLake security role on gold.assay_summary with row security", fr: "Partager LH_Assays avec SG-Litware sans autorisation supplémentaire, puis ajouter le groupe à un rôle de sécurité OneLake sur gold.assay_summary avec une sécurité au niveau des lignes" } }
    - { id: c, text: { en: "Assign SG-Litware the Viewer role in TR-Lab, then add the group to a OneLake security role on gold.assay_summary with row security", fr: "Attribuer à SG-Litware le rôle Viewer dans TR-Lab, puis ajouter le groupe à un rôle de sécurité OneLake sur gold.assay_summary avec une sécurité au niveau des lignes" } }
    - { id: d, text: { en: "Assign SG-Litware the Contributor role in TR-Lab, then add the group to a OneLake security role on gold.assay_summary with row security", fr: "Attribuer à SG-Litware le rôle Contributor dans TR-Lab, puis ajouter le groupe à un rôle de sécurité OneLake sur gold.assay_summary avec une sécurité au niveau des lignes" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Sharing the lakehouse without additional permissions gives SG-Litware the Read item permission on LH_Assays only, and no access to the other items of TR-Lab. A OneLake security role scoped to gold.assay_summary, with a row security predicate on ClientId, then grants the data. OneLake security is enforced for Spark and, because the endpoint uses the user's identity access mode, for the SQL analytics endpoint too.
    fr: |-
      Partager le lakehouse sans autorisation supplémentaire donne à SG-Litware l'autorisation d'élément Read sur LH_Assays uniquement, sans accès aux autres éléments de TR-Lab. Un rôle de sécurité OneLake limité à gold.assay_summary, avec un prédicat de sécurité au niveau des lignes sur ClientId, accorde ensuite l'accès aux données. La sécurité OneLake s'applique à Spark et, comme le point de terminaison utilise le mode d'accès avec l'identité de l'utilisateur, au point de terminaison d'analytique SQL également.
  options:
    a:
      en: |-
        Read all with Apache Spark is the ReadAll permission, which makes the group a member of the DefaultReader role and gives access to all the data of the lakehouse; a T-SQL security policy does not filter Spark reads.
      fr: |-
        Read all with Apache Spark correspond à l'autorisation ReadAll, qui fait du groupe un membre du rôle DefaultReader et donne accès à toutes les données du lakehouse ; une stratégie de sécurité T-SQL ne filtre pas les lectures Spark.
    c:
      en: |-
        The Viewer role applies to every item of TR-Lab, so the analysts would get access to the other items of the workspace.
      fr: |-
        Le rôle Viewer s'applique à tous les éléments de TR-Lab ; les analystes auraient donc accès aux autres éléments de l'espace de travail.
    d:
      en: |-
        Contributor applies to every item of TR-Lab and includes write access to the data, so OneLake security roles do not restrict what the group can read.
      fr: |-
        Contributor s'applique à tous les éléments de TR-Lab et inclut l'accès en écriture aux données ; les rôles de sécurité OneLake ne restreignent donc pas ce que le groupe peut lire.
references:
  - title: How OneLake security controls data access
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
  - title: Create and manage OneLake security roles
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles
