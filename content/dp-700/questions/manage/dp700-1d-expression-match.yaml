id: dp700-1d-expression-match
objective: "1.4.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric pipeline named PL_Child that is called by other pipelines through an Invoke pipeline activity. PL_Child contains a Lookup activity named Lookup1, with First row only cleared, followed by a ForEach activity.

    You need to configure dynamic content in PL_Child for the following requirements.

    Which expression should you use for each requirement? To answer, drag the appropriate expressions to the correct requirements. Each expression may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline Fabric nommé PL_Child, appelé par d'autres pipelines au moyen d'une activité Invoke pipeline. PL_Child contient une activité Lookup nommée Lookup1, avec First row only désélectionné, suivie d'une activité ForEach.

    Vous devez configurer du contenu dynamique dans PL_Child pour les exigences suivantes.

    Quelle expression devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les expressions appropriées vers les exigences correspondantes. Chaque expression peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: runid, text: "@pipeline().RunId" }
    - { id: triggertime, text: "@pipeline().TriggerTime" }
    - { id: item, text: "@item()" }
    - { id: lookupvalue, text: "@activity('Lookup1').output.value" }
    - { id: lookupfirst, text: "@activity('Lookup1').output.firstRow" }
    - { id: caller, text: "@pipeline()?.TriggeredByPipelineName" }
  targets:
    - id: log
      text: { en: "Write the unique identifier of the current run to a log table.", fr: "Écrire l'identifiant unique de l'exécution en cours dans une table de journal." }
    - id: items
      text: { en: "Set the Items property of the ForEach activity to all the rows returned by Lookup1.", fr: "Définir la propriété Items de l'activité ForEach sur toutes les lignes renvoyées par Lookup1." }
    - id: current
      text: { en: "Inside the ForEach activity, pass the row being processed to a Copy data activity.", fr: "Dans l'activité ForEach, transmettre la ligne en cours de traitement à une activité Copy data." }
    - id: parent
      text: { en: "Record the name of the pipeline that called PL_Child.", fr: "Enregistrer le nom du pipeline qui a appelé PL_Child." }
answer:
  mapping: { log: runid, items: lookupvalue, current: item, parent: caller }
explanation:
  correct:
    en: |
      RunId identifies the current pipeline run. When First row only is cleared, the Lookup activity returns its rows as an array in output.value, which feeds the Items property of a ForEach activity. Inside the loop, item() returns the current element. TriggeredByPipelineName returns the name of the calling pipeline, or null when the pipeline was not started by another one, hence the ? operator.
    fr: |
      RunId identifie l'exécution en cours du pipeline. Quand First row only est désélectionné, l'activité Lookup renvoie ses lignes sous forme de tableau dans output.value, qui alimente la propriété Items d'une activité ForEach. Dans la boucle, item() renvoie l'élément courant. TriggeredByPipelineName renvoie le nom du pipeline appelant, ou null quand le pipeline n'a pas été démarré par un autre, d'où l'opérateur ?.
  options:
    triggertime: { en: "TriggerTime is the time the trigger fired, not an identifier.", fr: "TriggerTime est l'heure de déclenchement, pas un identifiant." }
    lookupfirst: { en: "firstRow exists only when First row only is selected, and it holds one row, not an array.", fr: "firstRow n'existe que lorsque First row only est sélectionné, et contient une seule ligne, pas un tableau." }
references:
  - title: Expressions and functions for Data Factory in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/expression-language
  - title: Transform data with a ForEach activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/foreach-activity
