id: dp700-1a-domain-statements
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant contains a domain named **Supply** that has a subdomain named **Supply-Logistics**. A Fabric administrator assigned all the workspaces administered by a security group named **G-SupplyAdmins** to Supply by using the **By workspace admin** method.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre locataire Fabric contient un domaine nommé **Supply** qui possède un sous-domaine nommé **Supply-Logistics**. Un administrateur Fabric a attribué à Supply tous les espaces de travail administrés par un groupe de sécurité nommé **G-SupplyAdmins** en utilisant la méthode **By workspace admin**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Supply-Logistics can have domain admins who aren't domain admins of Supply.
        fr: Supply-Logistics peut avoir des administrateurs de domaine qui ne sont pas administrateurs du domaine Supply.
    - id: s2
      text:
        en: The items in the workspaces assigned to Supply receive a domain attribute in their metadata.
        fr: Les éléments des espaces de travail attribués à Supply reçoivent un attribut de domaine dans leurs métadonnées.
    - id: s3
      text:
        en: A workspace that a member of G-SupplyAdmins creates next month is assigned to Supply automatically.
        fr: Un espace de travail créé le mois prochain par un membre de G-SupplyAdmins est attribué automatiquement à Supply.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Subdomains don't have their own domain admins; the domain admins of the parent domain manage them. When a workspace is associated with a domain, all its items are associated too and receive a domain attribute in their metadata. Assignment by workspace admin only affects the workspaces that exist when the action runs; to cover future workspaces, configure a default domain.
    fr: Les sous-domaines n'ont pas d'administrateurs propres ; ce sont les administrateurs du domaine parent qui les gèrent. Quand un espace de travail est associé à un domaine, tous ses éléments le sont aussi et reçoivent un attribut de domaine dans leurs métadonnées. L'attribution par administrateur d'espace de travail ne concerne que les espaces de travail qui existent au moment de l'action ; pour couvrir les futurs espaces de travail, configurez un domaine par défaut.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
