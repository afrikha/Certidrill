id: dp700-1b-deploy-rule-statements
objective: "1.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline named DP-Finance that has Development, Test and Production stages. The Production stage is assigned a workspace named WS-Prod that contains a notebook named NB_Close. You plan to configure deployment rules for the Production stage.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement nommé DP-Finance qui comporte les phases Development, Test et Production. La phase Production est affectée à un espace de travail nommé WS-Prod qui contient un notebook nommé NB_Close. Vous prévoyez de configurer des règles de déploiement pour la phase Production.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A rule that you create for NB_Close in the Production stage takes effect the next time you deploy to Production.
        fr: |
          Une règle que vous créez pour NB_Close dans la phase Production prend effet lors du prochain déploiement vers Production.
    - id: s2
      text:
        en: |
          If you unassign WS-Prod from the Production stage and assign it again, its deployment rules are kept.
        fr: |
          Si vous désaffectez WS-Prod de la phase Production puis le réaffectez, ses règles de déploiement sont conservées.
    - id: s3
      text:
        en: |
          To create a rule for NB_Close, you must be the owner of NB_Close.
        fr: |
          Pour créer une règle pour NB_Close, vous devez être le propriétaire de NB_Close.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Rules are defined in the target stage and apply only when content is next deployed to that stage. Unassigning a workspace deletes the stage's deployment history and all its rules, which must be configured again. Only the owner of an item can create a rule for it, in addition to the pipeline and workspace permissions.
    fr: |
      Les règles sont définies dans la phase cible et ne s'appliquent qu'au prochain déploiement vers cette phase. La désaffectation d'un espace de travail supprime l'historique de déploiement de la phase et toutes ses règles, qu'il faut configurer de nouveau. Seul le propriétaire d'un élément peut créer une règle pour celui-ci, en plus des autorisations sur le pipeline et l'espace de travail.
references:
  - title: Create deployment rules for Fabric's ALM
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
  - title: Assign a workspace to a deployment pipeline
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/assign-pipeline
