id: dp700-1c-ols-cls-select-star
objective: "1.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a schema-enabled lakehouse named Lakehouse1 that contains a Delta table named dbo.Employee with the columns EmployeeID, FullName, Department and Salary. The SQL analytics endpoint of Lakehouse1 uses User's identity access mode.

    A user named User1 has the Viewer role in the workspace and isn't a member of DefaultReader. User1 is the only member of a OneLake security role that grants Read on dbo.Employee and sets the Salary column to Hide. In a Spark notebook, SELECT * FROM dbo.Employee returns EmployeeID, FullName and Department for User1.

    What happens when User1 runs SELECT * FROM dbo.Employee through the SQL analytics endpoint?
  fr: |
    Vous disposez d'un lakehouse avec schémas nommé Lakehouse1 qui contient une table Delta nommée dbo.Employee avec les colonnes EmployeeID, FullName, Department et Salary. Le point de terminaison d'analytique SQL de Lakehouse1 utilise le mode User's identity access mode.

    Un utilisateur nommé User1 a le rôle Viewer dans l'espace de travail et n'est pas membre de DefaultReader. User1 est l'unique membre d'un rôle de sécurité OneLake qui accorde Read sur dbo.Employee et règle la colonne Salary sur Hide. Dans un notebook Spark, SELECT * FROM dbo.Employee renvoie EmployeeID, FullName et Department pour User1.

    Que se passe-t-il quand User1 exécute SELECT * FROM dbo.Employee par le point de terminaison d'analytique SQL ?
body:
  options:
    - { id: a, text: { en: "The query returns EmployeeID, FullName and Department.", fr: "La requête renvoie EmployeeID, FullName et Department." } }
    - { id: b, text: { en: "The query returns every column, with NULL in Salary.", fr: "La requête renvoie toutes les colonnes, avec NULL dans Salary." } }
    - { id: c, text: { en: "The query returns every column, with 0 in Salary.", fr: "La requête renvoie toutes les colonnes, avec 0 dans Salary." } }
    - { id: d, text: { en: "The query fails with an error.", fr: "La requête échoue avec une erreur." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With OneLake column-level security, a SELECT * in a Spark notebook succeeds and returns only the allowed columns, but in the SQL analytics endpoint it returns an error because it references a column the user can't access. User1 must list the allowed columns explicitly.
    fr: |
      Avec la sécurité OneLake au niveau des colonnes, un SELECT * dans un notebook Spark réussit et ne renvoie que les colonnes autorisées, mais dans le point de terminaison d'analytique SQL il renvoie une erreur, car il cite une colonne inaccessible à l'utilisateur. User1 doit lister explicitement les colonnes autorisées.
  options:
    a: { en: "That is the Spark behavior; the SQL analytics endpoint rejects the query instead of dropping the column.", fr: "C'est le comportement de Spark ; le point de terminaison d'analytique SQL rejette la requête au lieu de retirer la colonne." }
    b: { en: "Column security never returns the hidden column, not even with NULL values.", fr: "La sécurité des colonnes ne renvoie jamais la colonne masquée, même avec des valeurs NULL." }
    c: { en: "Replacing values with 0 is the dynamic data masking default() behavior, not OneLake column security.", fr: "Remplacer les valeurs par 0 est le comportement de default() du masquage dynamique des données, pas de la sécurité OneLake des colonnes." }
references:
  - title: Table, column, and row-level security in OneLake
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/column-level-security
