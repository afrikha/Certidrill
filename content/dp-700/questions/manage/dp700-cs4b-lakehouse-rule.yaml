id: dp700-cs4b-lakehouse-rule
objective: "1.2.3"
type: single
caseStudy: dp700-cs4b-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the lifecycle requirement for NB_CleanPOS.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de cycle de vie concernant NB_CleanPOS.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the Development stage, create a Default lakehouse rule for NB_CleanPOS that points to LH_Sales of FC-Data-Test and FC-Data-Prod.", fr: "Dans la phase Development, créer une règle Default lakehouse pour NB_CleanPOS qui pointe vers LH_Sales de FC-Data-Test et de FC-Data-Prod." } }
    - { id: b, text: { en: "In the Test and Production stages, create a parameter rule for NB_CleanPOS that sets the lakehouse to LH_Sales of FC-Data-Test or FC-Data-Prod.", fr: "Dans les phases Test et Production, créer une règle de paramètre pour NB_CleanPOS qui définit le lakehouse sur LH_Sales de FC-Data-Test ou de FC-Data-Prod." } }
    - { id: c, text: { en: "Deploy without rules, so that auto-binding rebinds NB_CleanPOS to LH_Sales of FC-Data-Test or FC-Data-Prod.", fr: "Déployer sans règle, pour que la liaison automatique relie NB_CleanPOS à LH_Sales de FC-Data-Test ou de FC-Data-Prod." } }
    - { id: d, text: { en: "In the Test and Production stages, create a Default lakehouse rule for NB_CleanPOS set to Other, pointing to LH_Sales of FC-Data-Test or FC-Data-Prod.", fr: "Dans les phases Test et Production, créer une règle Default lakehouse pour NB_CleanPOS définie sur Other, qui pointe vers LH_Sales de FC-Data-Test ou de FC-Data-Prod." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Notebooks support one deployment rule type, the default lakehouse rule. Rules are created by the item owner in the target stage, and the Other option takes the lakehouse ID, name and workspace ID, so each stage can point to LH_Sales of its own data workspace. The rule applies from the next deployment to that stage.
    fr: |
      Les notebooks prennent en charge un seul type de règle de déploiement, la règle de lakehouse par défaut. Les règles sont créées par le propriétaire de l'élément dans la phase cible, et l'option Other prend l'ID, le nom et l'ID d'espace de travail du lakehouse : chaque phase peut ainsi pointer vers LH_Sales de son propre espace de travail de données. La règle s'applique à partir du déploiement suivant vers cette phase.
  options:
    a:
      en: |
        Deployment rules cannot be created in the Development stage; they are set on the target stage.
      fr: |
        Les règles de déploiement ne peuvent pas être créées dans la phase Development ; elles se définissent dans la phase cible.
    b:
      en: |
        Parameter rules apply to items such as semantic models and dataflows Gen1; a notebook supports only the default lakehouse rule.
      fr: |
        Les règles de paramètre s'appliquent à des éléments comme les modèles sémantiques et les dataflows Gen1 ; un notebook ne prend en charge que la règle de lakehouse par défaut.
    c:
      en: |
        Auto-binding rebinds the default lakehouse only when the lakehouse is in the same workspace as the notebook. LH_Sales is in the FC-Data workspaces, which are not part of DP-Eng.
      fr: |
        La liaison automatique ne relie de nouveau le lakehouse par défaut que si le lakehouse se trouve dans le même espace de travail que le notebook. LH_Sales se trouve dans les espaces de travail FC-Data, qui ne font pas partie de DP-Eng.
references:
  - title: Create deployment rules
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
  - title: Notebook source control and deployment
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/notebook-source-control-deployment
