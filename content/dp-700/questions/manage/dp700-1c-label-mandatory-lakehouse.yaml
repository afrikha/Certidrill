id: dp700-1c-label-mandatory-lakehouse
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your organization uses sensitivity labels in Fabric. The Microsoft Purview label policy that applies to all Fabric users has mandatory labeling turned on and has no default label. Fabric domains aren't used.

    An audit shows that users create lakehouses and warehouses that have no sensitivity label, while every new Power BI report has one.

    You need to ensure that new lakehouses and warehouses get a sensitivity label when their creator doesn't select one. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Votre organisation utilise les étiquettes de confidentialité dans Fabric. La stratégie d'étiquettes Microsoft Purview qui s'applique à tous les utilisateurs Fabric a l'étiquetage obligatoire activé et aucune étiquette par défaut. Les domaines Fabric ne sont pas utilisés.

    Un audit montre que les utilisateurs créent des lakehouses et des entrepôts sans étiquette de confidentialité, alors que chaque nouveau rapport Power BI en a une.

    Vous devez faire en sorte que les nouveaux lakehouses et entrepôts reçoivent une étiquette de confidentialité quand leur créateur n'en sélectionne aucune. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Microsoft Purview protection policy for each label.", fr: "Créer une stratégie de protection Microsoft Purview pour chaque étiquette." } }
    - { id: b, text: { en: "Turn off downstream inheritance in the Fabric tenant settings.", fr: "Désactiver l'héritage en aval dans les paramètres du locataire Fabric." } }
    - { id: c, text: { en: "Add a default label to the Microsoft Purview label policy.", fr: "Ajouter une étiquette par défaut à la stratégie d'étiquettes Microsoft Purview." } }
    - { id: d, text: { en: "Run a scheduled notebook that labels new items by using the admin REST APIs.", fr: "Exécuter un notebook planifié qui étiquette les nouveaux éléments avec les API REST d'administration." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Mandatory labeling is fully supported only for Power BI items; for lakehouses, pipelines and warehouses it isn't enforced when no default label is set, so users can save without a label. A default label in the label policy is applied to new non-Power BI items when the creator doesn't choose a label in the creation dialog.
    fr: |
      L'étiquetage obligatoire n'est entièrement pris en charge que pour les éléments Power BI ; pour les lakehouses, les pipelines et les entrepôts, il n'est pas appliqué quand aucune étiquette par défaut n'est définie, si bien que les utilisateurs peuvent enregistrer sans étiquette. Une étiquette par défaut dans la stratégie d'étiquettes est appliquée aux nouveaux éléments non Power BI quand le créateur n'en choisit aucune dans la boîte de dialogue de création.
  options:
    a: { en: "Protection policies control access to items that already carry a label; they don't apply labels.", fr: "Les stratégies de protection contrôlent l'accès aux éléments déjà étiquetés ; elles n'appliquent pas d'étiquettes." }
    b: { en: "Downstream inheritance propagates existing labels; turning it off makes labeling coverage worse, not better.", fr: "L'héritage en aval propage les étiquettes existantes ; le désactiver réduit la couverture d'étiquetage au lieu de l'améliorer." }
    d: { en: "Programmatic labeling works but requires custom code to build and maintain, which doesn't minimize administrative effort.", fr: "L'étiquetage par programme fonctionne, mais exige du code personnalisé à développer et maintenir, ce qui ne réduit pas l'effort d'administration." }
references:
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
