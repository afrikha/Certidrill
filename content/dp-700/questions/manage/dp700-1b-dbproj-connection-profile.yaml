id: dp700-1b-dbproj-connection-profile
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Ops that contains a lakehouse named LH_Stage and a warehouse named DW_Ops.

    You plan to run **Create Project From Database** in Visual Studio Code to create a database project from the current schema of DW_Ops. First, you create a connection profile in the SQL Server (mssql) extension.

    How should you configure the connection profile? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Ops qui contient un lakehouse nommé LH_Stage et un entrepôt nommé DW_Ops.

    Vous prévoyez d'exécuter **Create Project From Database** dans Visual Studio Code pour créer un projet de base de données à partir du schéma actuel de DW_Ops. Vous créez d'abord un profil de connexion dans l'extension SQL Server (mssql).

    Comment devez-vous configurer le profil de connexion ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Server name: [[server]]
      Authentication type: [[auth]]
    fr: |
      Nom du serveur : [[server]]
      Type d'authentification : [[auth]]
  slots:
    - id: server
      options:
        - { id: sqlconn, text: { en: "The SQL connection string from the settings of DW_Ops", fr: "La chaîne de connexion SQL des paramètres de DW_Ops" } }
        - { id: endpoint, text: { en: "The connection string of the SQL analytics endpoint of LH_Stage", fr: "La chaîne de connexion du point de terminaison d'analytique SQL de LH_Stage" } }
        - { id: abfs, text: { en: "The OneLake ABFS path of DW_Ops", fr: "Le chemin ABFS OneLake de DW_Ops" } }
    - id: auth
      options:
        - { id: entra, text: Microsoft Entra ID - Universal with MFA support }
        - { id: sql, text: SQL Login }
        - { id: windows, text: Windows Authentication }
answer:
  values: { server: sqlconn, auth: entra }
explanation:
  correct:
    en: |
      The server name is the SQL connection string shown in the warehouse settings (a `*.datawarehouse.fabric.microsoft.com` address), not a SQL analytics endpoint. Fabric warehouses accept only Microsoft Entra authentication, so the profile uses Microsoft Entra ID - Universal with MFA support.
    fr: |
      Le nom du serveur est la chaîne de connexion SQL affichée dans les paramètres de l'entrepôt (une adresse `*.datawarehouse.fabric.microsoft.com`), pas un point de terminaison d'analytique SQL. Les entrepôts Fabric n'acceptent que l'authentification Microsoft Entra : le profil utilise donc Microsoft Entra ID - Universal with MFA support.
  options:
    endpoint: { en: "The SQL analytics endpoint of LH_Stage exposes the lakehouse, not DW_Ops.", fr: "Le point de terminaison d'analytique SQL de LH_Stage expose le lakehouse, pas DW_Ops." }
    abfs: { en: "The ABFS path gives file access to OneLake, not a T-SQL connection.", fr: "Le chemin ABFS donne un accès aux fichiers dans OneLake, pas une connexion T-SQL." }
    sql: { en: "Fabric warehouses don't support SQL authentication.", fr: "Les entrepôts Fabric ne prennent pas en charge l'authentification SQL." }
    windows: { en: "Windows authentication isn't supported by Fabric warehouses.", fr: "L'authentification Windows n'est pas prise en charge par les entrepôts Fabric." }
references:
  - title: Develop Warehouse Projects in Visual Studio Code
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/develop-warehouse-project
