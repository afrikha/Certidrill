id: dp700-1b-dbproj-connection-profile
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Ops that contains a SQL database named SQL_Ops.

    Your team will develop the schema of SQL_Ops as an SDK-style SQL database project. Developers edit the project on their computers, and a build agent produces the artifact that is deployed to SQL_Ops.

    How should you complete the development plan? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Ops qui contient une base de données SQL nommée SQL_Ops.

    Votre équipe va développer le schéma de SQL_Ops sous forme de projet de base de données SQL de style SDK. Les développeurs modifient le projet sur leur ordinateur, et un agent de build produit l'artefact déployé sur SQL_Ops.

    Comment devez-vous compléter le plan de développement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Development tool: [[tool]]
      Build command on the agent: [[build]]
      Artifact to deploy: [[artifact]]
    fr: |
      Outil de développement : [[tool]]
      Commande de build sur l'agent : [[build]]
      Artefact à déployer : [[artifact]]
  slots:
    - id: tool
      options:
        - { id: vscode, text: { en: "Visual Studio Code with the SQL Database Projects extension", fr: "Visual Studio Code avec l'extension SQL Database Projects" } }
        - { id: vs2026, text: { en: "Visual Studio 2026 with its SQL project templates", fr: "Visual Studio 2026 avec ses modèles de projet SQL" } }
        - { id: editor, text: { en: "The SQL query editor of SQL_Ops in the Fabric portal", fr: "L'éditeur de requêtes SQL de SQL_Ops dans le portail Fabric" } }
    - id: build
      options:
        - { id: dotnet, text: dotnet build }
        - { id: extract, text: "sqlpackage /Action:Extract" }
        - { id: export, text: "sqlpackage /Action:Export" }
    - id: artifact
      options:
        - { id: dacpac, text: { en: "The .dacpac file in the bin/Debug folder", fr: "Le fichier .dacpac du dossier bin/Debug" } }
        - { id: bacpac, text: { en: "A .bacpac file with the schema and data of SQL_Ops", fr: "Un fichier .bacpac avec le schéma et les données de SQL_Ops" } }
        - { id: sqlproj, text: { en: "The .sqlproj file of the project", fr: "Le fichier .sqlproj du projet" } }
answer:
  values: { tool: vscode, build: dotnet, artifact: dacpac }
explanation:
  correct:
    en: |
      SDK-style SQL projects are the format of the SQL Database Projects extension for Visual Studio Code, where they are generally available. They build with `dotnet build` on any platform that has the .NET SDK, and the build output is a .dacpac file, by default in the bin/Debug folder, which SqlPackage publishes to the target database.
    fr: |
      Les projets SQL de style SDK sont le format de l'extension SQL Database Projects de Visual Studio Code, où ils sont en disponibilité générale. Ils se génèrent avec `dotnet build` sur toute plateforme dotée du SDK .NET, et la sortie du build est un fichier .dacpac, par défaut dans le dossier bin/Debug, que SqlPackage publie sur la base de données cible.
  options:
    vs2026: { en: "Visual Studio 2026 supports only the original SQL project format, not SDK-style projects.", fr: "Visual Studio 2026 ne prend en charge que le format de projet SQL d'origine, pas les projets de style SDK." }
    editor: { en: "The query editor runs queries against the database; it doesn't edit or build a SQL project on the developers' computers.", fr: "L'éditeur de requêtes exécute des requêtes sur la base de données ; il ne modifie ni ne génère un projet SQL sur l'ordinateur des développeurs." }
    extract: { en: "Extract creates a .dacpac from an existing database; it doesn't build the project.", fr: "Extract crée un fichier .dacpac à partir d'une base de données existante ; il ne génère pas le projet." }
    export: { en: "Export writes the schema and data of an existing database to a .bacpac file; it doesn't build the project.", fr: "Export écrit le schéma et les données d'une base de données existante dans un fichier .bacpac ; il ne génère pas le projet." }
    bacpac: { en: "A .bacpac file holds data and comes from Export; a SQL project deploys the schema as a .dacpac.", fr: "Un fichier .bacpac contient des données et provient d'Export ; un projet SQL déploie le schéma sous forme de .dacpac." }
    sqlproj: { en: "The .sqlproj file describes the project; SqlPackage publishes the built .dacpac, not the project file.", fr: "Le fichier .sqlproj décrit le projet ; SqlPackage publie le .dacpac généré, pas le fichier projet." }
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
