id: dp700-1b-deploy-value-set
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a workspace named WS-Dev that contains a variable library named VL_Config and a pipeline named PL_Ingest. VL_Config has three value sets named Default, Test and Prod. PL_Ingest reads its source folder from a variable of VL_Config.

    WS-Dev is assigned to the Development stage of a deployment pipeline. You deploy VL_Config and PL_Ingest to the empty Test stage and then to the empty Production stage. Each deployment creates a new workspace.

    PL_Ingest in the Production workspace must use the values of the Prod value set. What should you do?
  fr: |
    Vous disposez d'un espace de travail nommé WS-Dev qui contient une bibliothèque de variables nommée VL_Config et un pipeline nommé PL_Ingest. VL_Config possède trois jeux de valeurs nommés Default, Test et Prod. PL_Ingest lit son dossier source dans une variable de VL_Config.

    WS-Dev est affecté à la phase Development d'un pipeline de déploiement. Vous déployez VL_Config et PL_Ingest vers la phase Test vide, puis vers la phase Production vide. Chaque déploiement crée un nouvel espace de travail.

    PL_Ingest dans l'espace de travail de production doit utiliser les valeurs du jeu de valeurs Prod. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In WS-Dev, set Prod as the active value set of VL_Config, and then deploy again.", fr: "Dans WS-Dev, définir Prod comme jeu de valeurs actif de VL_Config, puis déployer de nouveau." } }
    - { id: b, text: { en: "In the Production stage, create a parameter rule for PL_Ingest that uses the Prod value set.", fr: "Dans la phase Production, créer une règle de paramètre pour PL_Ingest qui utilise le jeu de valeurs Prod." } }
    - { id: c, text: { en: "In the Production workspace, set Prod as the active value set of VL_Config, and save.", fr: "Dans l'espace de travail de production, définir Prod comme jeu de valeurs actif de VL_Config, puis enregistrer." } }
    - { id: d, text: { en: "In the Production stage, create a data source rule for VL_Config that uses the Prod value set.", fr: "Dans la phase Production, créer une règle de source de données pour VL_Config qui utilise le jeu de valeurs Prod." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The active value set is workspace configuration, chosen per stage, and a deployment never changes it. When a variable library is deployed to an empty stage, the new workspace starts with Default active, so you open VL_Config in the Production workspace, make Prod the active value set and save it before PL_Ingest runs.
    fr: |
      Le jeu de valeurs actif fait partie de la configuration de l'espace de travail, choisie par phase, et un déploiement ne le modifie jamais. Quand une bibliothèque de variables est déployée vers une phase vide, le nouvel espace de travail démarre avec Default actif : vous ouvrez donc VL_Config dans l'espace de travail de production, vous définissez Prod comme jeu de valeurs actif et vous enregistrez avant l'exécution de PL_Ingest.
  options:
    a: { en: "The active value set isn't deployed; changing it in WS-Dev would only change the values used in Development.", fr: "Le jeu de valeurs actif n'est pas déployé ; le modifier dans WS-Dev changerait uniquement les valeurs utilisées en développement." }
    b: { en: "Parameter rules exist for semantic models and dataflows Gen1, not for pipelines.", fr: "Les règles de paramètre existent pour les modèles sémantiques et les dataflows Gen1, pas pour les pipelines." }
    d: { en: "Data source rules don't apply to variable libraries; the value set is selected in the library itself.", fr: "Les règles de source de données ne s'appliquent pas aux bibliothèques de variables ; le jeu de valeurs se sélectionne dans la bibliothèque elle-même." }
references:
  - title: Lifecycle Management of the Microsoft Fabric Variable library
    url: https://learn.microsoft.com/en-us/fabric/cicd/variable-library/variable-library-cicd
