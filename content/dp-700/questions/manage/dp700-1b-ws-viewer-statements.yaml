id: dp700-1b-ws-viewer-statements
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS1 that contains a lakehouse named LH1, a warehouse named DW1 and a pipeline named PL1. OneLake security isn't configured on LH1, and no SQL permissions are defined in DW1.

    You assign User1 the Viewer role in WS1. User1 has no other permissions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS1 qui contient un lakehouse nommé LH1, un entrepôt nommé DW1 et un pipeline nommé PL1. La sécurité OneLake n'est pas configurée sur LH1, et aucune autorisation SQL n'est définie dans DW1.

    Vous attribuez à User1 le rôle Viewer dans WS1. User1 n'a aucune autre autorisation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          User1 can query the tables of DW1 by using T-SQL.
        fr: |
          User1 peut interroger les tables de DW1 avec T-SQL.
    - id: s2
      text:
        en: |
          User1 can read the files of LH1 from a Spark notebook.
        fr: |
          User1 peut lire les fichiers de LH1 depuis un notebook Spark.
    - id: s3
      text:
        en: |
          User1 can cancel a running execution of PL1.
        fr: |
          User1 peut annuler une exécution en cours de PL1.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A Viewer can connect to the SQL analytics endpoint and the warehouse and read data with T-SQL (ReadData). A Viewer doesn't get ReadAll, so reading the files through Spark or OneLake APIs is denied. Running or cancelling pipelines needs the Contributor role or higher.
    fr: |
      Un Viewer peut se connecter au point de terminaison d'analytique SQL et à l'entrepôt, et lire les données avec T-SQL (ReadData). Un Viewer n'obtient pas ReadAll : la lecture des fichiers via Spark ou les API OneLake est refusée. L'exécution ou l'annulation de pipelines nécessite le rôle Contributor ou supérieur.
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
  - title: Workspace Roles in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/workspace-roles
