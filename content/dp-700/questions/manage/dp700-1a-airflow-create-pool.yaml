id: dp700-1a-airflow-create-pool
objective: "1.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You are an admin of a Fabric workspace named **WS-Prod**. Its Apache Airflow jobs currently run on the starter pool.

    You need to make a new custom pool named **AirLarge**, with Large nodes and autoscale, the default Apache Airflow runtime of WS-Prod.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous êtes administrateur d'un espace de travail Fabric nommé **WS-Prod**. Ses travaux Apache Airflow s'exécutent actuellement sur le pool de démarrage.

    Vous devez faire d'un nouveau pool personnalisé nommé **AirLarge**, avec des nœuds Large et la mise à l'échelle automatique, le runtime Apache Airflow par défaut de WS-Prod.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: open, text: { en: "In the workspace settings of WS-Prod, select Apache Airflow Runtime Settings in the Data Factory section.", fr: "Dans les paramètres de l'espace de travail WS-Prod, sélectionner Apache Airflow Runtime Settings dans la section Data Factory." } }
    - { id: newpool, text: { en: "Expand Default Data Workflow Setting and select New Pool.", fr: "Développer Default Data Workflow Setting et sélectionner New Pool." } }
    - { id: props, text: { en: "Enter AirLarge as the name, set Compute node size to Large, turn on Enable autoscale, and select Create.", fr: "Saisir AirLarge comme nom, définir Compute node size sur Large, activer Enable autoscale, puis sélectionner Create." } }
    - { id: spark, text: { en: "In the workspace settings of WS-Prod, select Spark settings in the Data Engineering/Science section.", fr: "Dans les paramètres de l'espace de travail WS-Prod, sélectionner Spark settings dans la section Data Engineering/Science." } }
    - { id: defpool, text: { en: "Expand Default pool for workspace and select New Pool.", fr: "Développer Default pool for workspace et sélectionner New Pool." } }
    - { id: pause, text: { en: "Pause the starter pool of WS-Prod.", fr: "Mettre en pause le pool de démarrage de WS-Prod." } }
answer:
  sequence: [ open, newpool, props ]
explanation:
  correct:
    en: Apache Airflow runtime settings are in the Data Factory section of the workspace settings. Default Data Workflow Setting is initially set to the starter pool; selecting New Pool lets you name the pool, choose Small or Large nodes, enable autoscale or extra nodes, and create it as the workspace default.
    fr: Les paramètres du runtime Apache Airflow se trouvent dans la section Data Factory des paramètres de l'espace de travail. Default Data Workflow Setting est initialement défini sur le pool de démarrage ; la sélection de New Pool permet de nommer le pool, de choisir des nœuds Small ou Large, d'activer la mise à l'échelle automatique ou des nœuds supplémentaires, puis de le créer comme pool par défaut de l'espace de travail.
  options:
    spark:
      en: Spark settings configure the pools of notebooks and Spark job definitions, not Apache Airflow jobs.
      fr: Spark settings configure les pools des notebooks et des définitions de travail Spark, pas ceux des travaux Apache Airflow.
    defpool:
      en: Default pool for workspace creates a custom Spark pool.
      fr: Default pool for workspace crée un pool Spark personnalisé.
    pause:
      en: The starter pool shuts down by itself after 20 minutes of inactivity; there's nothing to pause before you change the default.
      fr: Le pool de démarrage s'arrête de lui-même après 20 minutes d'inactivité ; il n'y a rien à mettre en pause avant de changer la valeur par défaut.
references:
  - title: Apache Airflow Job workspace settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-workspace-settings
