id: dp700-1c-label-inheritance-statements
objective: "1.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your organization uses sensitivity labels in Fabric with the default settings. You have a Fabric workspace named Workspace1 that contains an eventhouse with a KQL database named KQLDB1, a lakehouse named Lakehouse1 and a Power BI semantic model named SM1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation utilise les étiquettes de confidentialité dans Fabric avec les paramètres par défaut. Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse avec une base de données KQL nommée KQLDB1, un lakehouse nommé Lakehouse1 et un modèle sémantique Power BI nommé SM1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If KQLDB1 is labeled Confidential, a KQL queryset that you create from KQLDB1 gets the Confidential label.
        fr: |
          Si KQLDB1 porte l'étiquette Confidential, un ensemble de requêtes KQL que vous créez à partir de KQLDB1 reçoit l'étiquette Confidential.
    - id: s2
      text:
        en: |
          If you apply the Confidential label to SM1, downstream inheritance applies it to the Fabric notebooks that read SM1 by using semantic link.
        fr: |
          Si vous appliquez l'étiquette Confidential à SM1, l'héritage en aval l'applique aux notebooks Fabric qui lisent SM1 avec le lien sémantique.
    - id: s3
      text:
        en: |
          If Lakehouse1 is labeled Confidential, a .csv file that a user exports from a Lakehouse1 table keeps the label.
        fr: |
          Si Lakehouse1 porte l'étiquette Confidential, un fichier .csv qu'un utilisateur exporte depuis une table de Lakehouse1 conserve l'étiquette.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A KQL queryset created from a KQL database inherits the database label (inheritance upon creation). Downstream inheritance works from Fabric to Fabric, Power BI to Power BI and Fabric to Power BI, but not from Power BI items to Fabric items. Labels aren't transferred to .csv exports.
    fr: |
      Un ensemble de requêtes KQL créé à partir d'une base de données KQL hérite de l'étiquette de la base (héritage à la création). L'héritage en aval fonctionne de Fabric à Fabric, de Power BI à Power BI et de Fabric à Power BI, mais pas des éléments Power BI vers les éléments Fabric. Les étiquettes ne sont pas transférées aux exportations .csv.
references:
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
