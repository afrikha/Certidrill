id: dp700-1b-deploy-warehouse-drop
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a deployment pipeline named DP-DW. The Development stage contains a warehouse named DW_Sales, and the Test stage contains the paired copy of DW_Sales.

    In the Development workspace, you drop a table named dbo.StagingOld from DW_Sales. You then deploy DW_Sales from Development to Test. The deployment completes successfully, but dbo.StagingOld still exists in the Test copy of DW_Sales.

    What is the cause?
  fr: |
    Vous disposez d'un pipeline de déploiement nommé DP-DW. La phase Development contient un entrepôt nommé DW_Sales, et la phase Test contient la copie jumelée de DW_Sales.

    Dans l'espace de travail de développement, vous supprimez une table nommée dbo.StagingOld de DW_Sales. Vous déployez ensuite DW_Sales de Development vers Test. Le déploiement se termine correctement, mais dbo.StagingOld existe toujours dans la copie de test de DW_Sales.

    Quelle est la cause ?
body:
  options:
    - { id: a, text: { en: "Warehouse schema changes reach the Test copy only after you refresh its SQL analytics endpoint.", fr: "Les modifications de schéma d'entrepôt n'atteignent la copie de test qu'après l'actualisation de son point de terminaison d'analytique SQL." } }
    - { id: b, text: { en: "Warehouse deployments don't drop objects of the target that are missing from the source.", fr: "Les déploiements d'entrepôt ne suppriment pas les objets de la cible qui sont absents de la source." } }
    - { id: c, text: { en: "Warehouse deployments add new objects but never alter the objects that already exist in the target.", fr: "Les déploiements d'entrepôt ajoutent les nouveaux objets, mais ne modifient jamais les objets qui existent déjà dans la cible." } }
    - { id: d, text: { en: "Dropped objects are deployed only when you select the related items of the warehouse.", fr: "Les objets supprimés ne sont déployés que si vous sélectionnez les éléments connexes de l'entrepôt." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Deployment pipelines deploy warehouses with DacFx, using safe settings - DropObjectsNotInSource is false and table drops are blocked. Objects that exist only in the target are kept, and the deployment can still report success, so the Test copy drifts from Development until you drop the table explicitly.
    fr: "Les pipelines de déploiement déploient les entrepôts avec DacFx, avec des paramètres prudents : DropObjectsNotInSource est à false et les suppressions de tables sont bloquées. Les objets qui n'existent que dans la cible sont conservés, et le déploiement peut tout de même indiquer une réussite : la copie de test diverge donc de Development jusqu'à ce que vous supprimiez la table explicitement."
  options:
    a: { en: "The deployment applies the schema changes itself; no refresh of an endpoint is involved.", fr: "Le déploiement applique lui-même les modifications de schéma ; aucune actualisation de point de terminaison n'intervient." }
    c: { en: "DacFx generates a plan that alters existing objects, such as modified columns, to match the source.", fr: "DacFx génère un plan qui modifie les objets existants, comme des colonnes modifiées, pour qu'ils correspondent à la source." }
    d: { en: "Selecting related items isn't supported for Fabric Data Warehouse in deployment pipelines.", fr: "La sélection des éléments connexes n'est pas prise en charge pour Fabric Data Warehouse dans les pipelines de déploiement." }
references:
  - title: Deploy Fabric Data Warehouse Using Pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/deploy-pipelines
