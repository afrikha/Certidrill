id: dp700-1b-ws-member-actions
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Sales. User3 has the Member role in WS-Sales and no other permissions.

    Which two actions can User3 perform in WS-Sales?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Sales. User3 a le rôle Member dans WS-Sales et aucune autre autorisation.

    Quelles sont les deux actions que User3 peut effectuer dans WS-Sales ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Contributor role in WS-Sales to another user", fr: "Attribuer le rôle Contributor dans WS-Sales à un autre utilisateur" } }
    - { id: b, text: { en: "Connect WS-Sales to a Git repository", fr: "Connecter WS-Sales à un dépôt Git" } }
    - { id: c, text: { en: "Assign the Admin role in WS-Sales to another user", fr: "Attribuer le rôle Admin dans WS-Sales à un autre utilisateur" } }
    - { id: d, text: { en: "Share a lakehouse and allow the recipient to reshare it", fr: "Partager un lakehouse en autorisant le destinataire à le repartager" } }
    - { id: e, text: { en: "Create a workspace identity for WS-Sales", fr: "Créer une identité d'espace de travail pour WS-Sales" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A Member can add members or people with lower permissions, such as Contributor, and can allow others to reshare items. Adding or removing admins, connecting the workspace to Git and creating a workspace identity are Admin-only capabilities.
    fr: |
      Un Member peut ajouter des membres ou des personnes disposant d'autorisations inférieures, comme Contributor, et peut autoriser d'autres utilisateurs à repartager des éléments. Ajouter ou retirer des administrateurs, connecter l'espace de travail à Git et créer une identité d'espace de travail sont réservés au rôle Admin.
  options:
    b: { en: "Only an Admin can connect a workspace to a Git repository.", fr: "Seul un Admin peut connecter un espace de travail à un dépôt Git." }
    c: { en: "Only an Admin can add or remove other admins.", fr: "Seul un Admin peut ajouter ou retirer d'autres administrateurs." }
    e: { en: "Only an Admin can create a workspace identity.", fr: "Seul un Admin peut créer une identité d'espace de travail." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
