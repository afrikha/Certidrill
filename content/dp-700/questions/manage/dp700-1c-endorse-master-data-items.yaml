id: dp700-1c-endorse-master-data-items
objective: "1.3.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Your organization has enabled master data endorsement in Fabric, and you are an authorized user. A workspace contains the following items: a lakehouse, a Power BI semantic model, a pipeline, a notebook and a Power BI report.

    Which two items can you endorse as Master data?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation a activé l'approbation Master data dans Fabric, et vous êtes un utilisateur autorisé. Un espace de travail contient les éléments suivants : un lakehouse, un modèle sémantique Power BI, un pipeline, un notebook et un rapport Power BI.

    Quels sont les deux éléments que vous pouvez approuver comme Master data ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: lh, text: { en: "The lakehouse", fr: "Le lakehouse" } }
    - { id: sm, text: { en: "The semantic model", fr: "Le modèle sémantique" } }
    - { id: pl, text: { en: "The pipeline", fr: "Le pipeline" } }
    - { id: nb, text: { en: "The notebook", fr: "Le notebook" } }
    - { id: rp, text: { en: "The report", fr: "Le rapport" } }
answer: { optionIds: [ lh, sm ] }
explanation:
  correct:
    en: |
      The Master data badge applies only to items that contain data, such as lakehouses and semantic models. Pipelines, notebooks and reports process or display data but don't hold it, so they can be promoted or certified but not marked as Master data.
    fr: |
      Le badge Master data ne s'applique qu'aux éléments qui contiennent des données, comme les lakehouses et les modèles sémantiques. Les pipelines, les notebooks et les rapports traitent ou affichent des données sans les contenir : ils peuvent être promus ou certifiés, mais pas marqués Master data.
  options:
    pl: { en: "A pipeline moves data but doesn't contain it.", fr: "Un pipeline déplace des données mais ne les contient pas." }
    nb: { en: "A notebook runs code; it doesn't contain data.", fr: "Un notebook exécute du code ; il ne contient pas de données." }
    rp: { en: "A report displays data from a semantic model; it doesn't contain the data.", fr: "Un rapport affiche les données d'un modèle sémantique ; il ne les contient pas." }
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
