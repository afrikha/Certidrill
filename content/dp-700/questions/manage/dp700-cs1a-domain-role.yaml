id: dp700-cs1a-domain-role
objective: "1.1.2"
type: single
caseStudy: dp700-cs1a-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |-
    The Operations domain has been created. You need to grant Léa Martin access that meets the governance requirement. What should you do?
  fr: |-
    Le domaine Operations a été créé. Vous devez accorder à Léa Martin un accès qui respecte l'exigence de gouvernance. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Make Léa Martin a domain contributor of Operations", fr: "Faire de Léa Martin un contributeur du domaine Operations" } }
    - { id: b, text: { en: "Assign Léa Martin the Admin role in the three workspaces", fr: "Attribuer à Léa Martin le rôle Admin dans les trois espaces de travail" } }
    - { id: c, text: { en: "Make Léa Martin a domain admin of Operations", fr: "Faire de Léa Martin un administrateur du domaine Operations" } }
    - { id: d, text: { en: "Assign Léa Martin the Fabric Administrator role", fr: "Attribuer à Léa Martin le rôle Fabric Administrator" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A domain admin can define the domain contributors, associate workspaces and override delegated tenant settings, such as certification, for that domain only. It is the least privileged role that meets the requirement, because it does not grant administration of the whole Fabric tenant.
    fr: |-
      Un administrateur de domaine peut désigner les contributeurs du domaine, y associer des espaces de travail et remplacer les paramètres de locataire délégués, comme la certification, pour ce domaine uniquement. C'est le rôle le moins privilégié qui satisfait l'exigence, car il n'accorde pas l'administration de tout le locataire Fabric.
  options:
    a:
      en: |-
        A domain contributor is a workspace admin who can assign their own workspaces to the domain; a contributor cannot specify other contributors or change the domain settings.
      fr: |-
        Un contributeur de domaine est un administrateur d'espace de travail qui peut attribuer ses propres espaces de travail au domaine ; il ne peut ni désigner d'autres contributeurs ni modifier les paramètres du domaine.
    b:
      en: |-
        Workspace roles control access to the items of each workspace; they give no right on the domain settings.
      fr: |-
        Les rôles d'espace de travail contrôlent l'accès aux éléments de chaque espace de travail ; ils ne donnent aucun droit sur les paramètres du domaine.
    d:
      en: |-
        A Fabric administrator can manage every domain and tenant setting, which is far more than required and breaks least privilege.
      fr: |-
        Un administrateur Fabric peut gérer tous les domaines et tous les paramètres du locataire, ce qui dépasse largement le besoin et enfreint le principe des privilèges minimum.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
