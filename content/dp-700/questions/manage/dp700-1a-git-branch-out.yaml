id: dp700-1a-git-branch-out
objective: "1.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Dev** that is connected to the **main** branch of an Azure Repos repository. Several developers work in WS-Dev.

    You need to develop a new version of the notebooks of WS-Dev without affecting the other developers until your work is reviewed. Your changes must then be available in WS-Dev.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Dev** connecté à la branche **main** d'un dépôt Azure Repos. Plusieurs développeurs travaillent dans WS-Dev.

    Vous devez développer une nouvelle version des notebooks de WS-Dev sans affecter les autres développeurs tant que votre travail n'a pas été relu. Vos modifications doivent ensuite être disponibles dans WS-Dev.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: branchout, text: { en: "In the Source control pane of WS-Dev, select Branch out and create a new workspace named WS-Feature with a new branch named feature-nb.", fr: "Dans le volet Source control de WS-Dev, sélectionner Branch out et créer un nouvel espace de travail nommé WS-Feature avec une nouvelle branche nommée feature-nb." } }
    - { id: edit, text: { en: "Change the notebooks in WS-Feature and commit them to feature-nb.", fr: "Modifier les notebooks dans WS-Feature et en faire un commit dans feature-nb." } }
    - { id: pr, text: { en: "In Azure Repos, create a pull request from feature-nb to main and complete it after review.", fr: "Dans Azure Repos, créer une pull request de feature-nb vers main et la terminer après la relecture." } }
    - { id: update, text: { en: "In the Source control pane of WS-Dev, select Update all.", fr: "Dans le volet Source control de WS-Dev, sélectionner Update all." } }
    - { id: switch, text: { en: "In WS-Dev, switch the connected branch to feature-nb.", fr: "Dans WS-Dev, faire passer la branche connectée sur feature-nb." } }
    - { id: commitdev, text: { en: "In the Source control pane of WS-Dev, commit all the items to main.", fr: "Dans le volet Source control de WS-Dev, faire un commit de tous les éléments dans main." } }
    - { id: checkout, text: { en: "In WS-Dev, select Checkout new branch.", fr: "Dans WS-Dev, sélectionner Checkout new branch." } }
answer:
  sequence: [ branchout, edit, pr, update ]
explanation:
  correct:
    en: Branch out creates a new Git branch from the branch of the source workspace and a branched workspace connected to it, so you work in isolation. You commit your changes to the feature branch and merge them into main through a reviewed pull request in Azure Repos. WS-Dev then shows Update required for the merged items, and Update all brings them into the workspace.
    fr: "Branch out crée une nouvelle branche Git à partir de la branche de l'espace de travail source, ainsi qu'un espace de travail branché qui y est connecté : vous travaillez ainsi isolé. Vous faites un commit de vos modifications dans la branche de fonctionnalité et les fusionnez dans main par une pull request relue dans Azure Repos. WS-Dev affiche ensuite Update required pour les éléments fusionnés, et Update all les apporte dans l'espace de travail."
  options:
    switch:
      en: Switching the branch of WS-Dev changes the shared workspace for every developer, which the requirement forbids.
      fr: Changer la branche de WS-Dev modifie l'espace de travail partagé pour tous les développeurs, ce que l'exigence interdit.
    commitdev:
      en: Committing from WS-Dev sends workspace changes to main without review, and your work isn't in WS-Dev.
      fr: Un commit depuis WS-Dev envoie les modifications de l'espace de travail dans main sans relecture, et votre travail ne se trouve pas dans WS-Dev.
    checkout:
      en: Checkout new branch changes the Git connection of WS-Dev itself, so the shared workspace would follow your branch.
      fr: "Checkout new branch modifie la connexion Git de WS-Dev lui-même : l'espace de travail partagé suivrait donc votre branche."
references:
  - title: Development process using branch workspace
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/branched-workspace
  - title: Basic concepts in Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
