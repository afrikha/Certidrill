id: dp700-1a-git-commit-blocked
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Dev** that is connected to the **main** branch of an Azure Repos repository. You changed a notebook named **NB_Clean** in WS-Dev.

    Meanwhile, a colleague merged a pull request into main that changed a pipeline named **PL_Load**. Nobody changed NB_Clean in the branch. In the **Source control** pane, you can't commit NB_Clean.

    You need to commit NB_Clean to main.

    What should you do first?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Dev** connecté à la branche **main** d'un dépôt Azure Repos. Vous avez modifié un notebook nommé **NB_Clean** dans WS-Dev.

    Entre-temps, un collègue a fusionné dans main une pull request qui modifie un pipeline nommé **PL_Load**. Personne n'a modifié NB_Clean dans la branche. Dans le volet **Source control**, vous ne pouvez pas faire de commit de NB_Clean.

    Vous devez faire un commit de NB_Clean dans main.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Select Undo for NB_Clean", fr: "Sélectionner Undo pour NB_Clean" } }
    - { id: b, text: { en: "Select Checkout new branch", fr: "Sélectionner Checkout new branch" } }
    - { id: c, text: { en: "Select Update all on the Updates tab", fr: "Sélectionner Update all dans l'onglet Updates" } }
    - { id: d, text: { en: "Disconnect WS-Dev from Git and connect it again", fr: "Déconnecter WS-Dev de Git, puis le reconnecter" } }
answer: { optionId: c }
explanation:
  correct:
    en: When the Git branch has commits that the workspace doesn't have, commits are disabled until you update the workspace. Update always applies the whole branch, so PL_Load is updated while your uncommitted change to NB_Clean is kept because the same item didn't change in Git; you can then commit NB_Clean.
    fr: "Quand la branche Git contient des commits que l'espace de travail n'a pas, les commits sont désactivés jusqu'à la mise à jour de l'espace de travail. Update applique toujours toute la branche : PL_Load est mis à jour, tandis que votre modification non commitée de NB_Clean est conservée puisque le même élément n'a pas changé dans Git ; vous pouvez ensuite faire un commit de NB_Clean."
  options:
    a:
      en: Undo reverts NB_Clean to its last synced state, so your changes would be lost.
      fr: "Undo rétablit NB_Clean dans son dernier état synchronisé : vos modifications seraient perdues."
    b:
      en: Checkout new branch connects the workspace to a new branch; your commit would go to that branch, not to main.
      fr: Checkout new branch connecte l'espace de travail à une nouvelle branche ; votre commit irait dans cette branche, pas dans main.
    d:
      en: Reconnecting overwrites the content of one side with the other instead of merging, and it isn't needed when there's no conflict.
      fr: La reconnexion écrase le contenu d'un côté avec celui de l'autre au lieu de fusionner, et elle n'est pas nécessaire en l'absence de conflit.
references:
  - title: Basic concepts in Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
