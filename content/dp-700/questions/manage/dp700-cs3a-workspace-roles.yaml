id: dp700-cs3a-workspace-roles
objective: "1.3.1"
type: dragdrop
caseStudy: dp700-cs3a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to assign workspace roles in WS-Telemetry to meet the security requirement.

    Which role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles d'espace de travail dans WS-Telemetry pour respecter l'exigence de sécurité.

    Quel rôle devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: admin, text: Admin }
    - { id: member, text: Member }
    - { id: contributor, text: Contributor }
    - { id: viewer, text: Viewer }
  targets:
    - { id: platform, text: { en: "Platform team", fr: "Équipe plateforme" } }
    - { id: engineers, text: { en: "Data engineers", fr: "Ingénieurs données" } }
    - { id: supervisors, text: { en: "Shift supervisors", fr: "Chefs d'équipe de quart" } }
    - { id: analysts, text: { en: "Analysts", fr: "Analystes" } }
answer:
  mapping: { platform: admin, engineers: contributor, supervisors: member, analysts: viewer }
explanation:
  correct:
    en: |
      Only the Admin role can connect a workspace to a Git repository and update or delete the workspace. Contributor can create, modify and run eventstreams, notebooks and KQL querysets but cannot add people. Member adds those capabilities plus adding people with the same or lower permissions. Viewer can read KQL databases and Real-Time Dashboards without changing them.
    fr: |
      Seul le rôle Admin peut connecter un espace de travail à un dépôt Git et modifier ou supprimer l'espace de travail. Contributor peut créer, modifier et exécuter des flux d'événements, des notebooks et des ensembles de requêtes KQL, mais ne peut pas ajouter de personnes. Member ajoute à ces capacités l'ajout de personnes avec des autorisations égales ou inférieures. Viewer peut lire les bases de données KQL et les tableaux de bord en temps réel sans les modifier.
  options:
    member: { en: "Member cannot connect the workspace to Git, and it would let the data engineers add people.", fr: "Member ne peut pas connecter l'espace de travail à Git, et il permettrait aux ingénieurs données d'ajouter des personnes." }
    contributor: { en: "Contributor cannot add people, which the shift supervisors need.", fr: "Contributor ne peut pas ajouter de personnes, ce dont les chefs d'équipe de quart ont besoin." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
