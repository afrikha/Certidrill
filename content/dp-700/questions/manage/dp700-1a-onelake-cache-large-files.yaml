id: dp700-1a-onelake-cache-large-files
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Media** that contains a lakehouse with a Google Cloud Storage shortcut named **gcs_assets**. The shortcut cache of WS-Media is on with a retention period of 28 days.

    gcs_assets contains two kinds of files that are never modified after they are written:

    - Parquet files of about 300 MB each
    - Parquet files of about 4 GB each

    A notebook reads all the files every morning. The egress charges for the 300 MB files dropped after you turned on the cache, but the charges for the 4 GB files didn't change.

    What is the most likely cause?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Media** qui contient un lakehouse doté d'un raccourci Google Cloud Storage nommé **gcs_assets**. Le cache des raccourcis de WS-Media est activé avec une période de rétention de 28 jours.

    gcs_assets contient deux types de fichiers, jamais modifiés après leur écriture :

    - Des fichiers Parquet d'environ 300 Mo chacun
    - Des fichiers Parquet d'environ 4 Go chacun

    Un notebook lit tous les fichiers chaque matin. Les frais de sortie des fichiers de 300 Mo ont baissé après l'activation du cache, mais ceux des fichiers de 4 Go n'ont pas changé.

    Quelle est la cause la plus probable ?
body:
  options:
    - { id: a, text: { en: "Files larger than 1 GB aren't cached", fr: "Les fichiers de plus de 1 Go ne sont pas mis en cache" } }
    - { id: b, text: { en: "Each read of a file resets its retention period", fr: "Chaque lecture d'un fichier remet sa période de rétention à zéro" } }
    - { id: c, text: { en: "OneLake reads the remote file when the remote provider has a newer version", fr: "OneLake lit le fichier distant quand le fournisseur distant en a une version plus récente" } }
    - { id: d, text: { en: "The retention period must be shorter than the interval between reads", fr: "La période de rétention doit être plus courte que l'intervalle entre deux lectures" } }
answer: { optionId: a }
explanation:
  correct:
    en: The shortcut cache skips individual files larger than 1 GB, so every read of the 4 GB files still goes to Google Cloud Storage. The 300 MB files are below the limit and are read daily, well within the 28-day retention, so they are served from the cache.
    fr: "Le cache des raccourcis ignore les fichiers de plus de 1 Go : chaque lecture des fichiers de 4 Go va donc toujours dans Google Cloud Storage. Les fichiers de 300 Mo sont sous la limite et sont lus chaque jour, bien avant la fin des 28 jours de rétention : ils sont donc servis depuis le cache."
  options:
    b:
      en: Resetting the retention period on each read keeps frequently read files in the cache; it doesn't explain why large files aren't cached.
      fr: La remise à zéro de la période de rétention à chaque lecture garde en cache les fichiers souvent lus ; elle n'explique pas pourquoi les gros fichiers ne sont pas mis en cache.
    c:
      en: This behavior is real, but the files are never modified, so the remote provider never has a newer version.
      fr: "Ce comportement existe, mais les fichiers ne sont jamais modifiés : le fournisseur distant n'en a donc jamais de version plus récente."
    d:
      en: The retention period must be longer than the interval between reads; 28 days is longer than one day.
      fr: La période de rétention doit être plus longue que l'intervalle entre deux lectures ; 28 jours est plus long qu'un jour.
references:
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
