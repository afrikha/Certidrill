id: dp700-1b-deploy-stage-config
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You use a deployment pipeline to promote the items of a workspace named WS-Dev to Test and Production. Some items must use different values in each stage.

    You need to configure each item so that the Production copy uses the production resources after deployment.

    Which mechanism should you use for each item? To answer, drag the appropriate mechanisms to the correct items. Each mechanism may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez un pipeline de déploiement pour promouvoir les éléments d'un espace de travail nommé WS-Dev vers Test et Production. Certains éléments doivent utiliser des valeurs différentes dans chaque phase.

    Vous devez configurer chaque élément pour que sa copie de production utilise les ressources de production après le déploiement.

    Quel mécanisme devez-vous utiliser pour chaque élément ? Pour répondre, faites glisser les mécanismes appropriés vers les éléments correspondants. Chaque mécanisme peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: dlr, text: { en: "Default lakehouse rule", fr: "Règle de lakehouse par défaut" } }
    - { id: dsr, text: { en: "Data source rule", fr: "Règle de source de données" } }
    - { id: param, text: { en: "Parameter rule", fr: "Règle de paramètre" } }
    - { id: varlib, text: { en: "Variable library", fr: "Bibliothèque de variables" } }
  targets:
    - id: notebook
      text: { en: "Notebook NB_Score: use LH_Gold_Prod as its default lakehouse", fr: "Notebook NB_Score : utiliser LH_Gold_Prod comme lakehouse par défaut" }
    - id: mirror
      text: { en: "Mirrored database MDB_Orders: replicate from the production Azure SQL database", fr: "Base de données mise en miroir MDB_Orders : répliquer la base de données Azure SQL de production" }
    - id: pipeline
      text: { en: "Pipeline PL_Copy: read from a different ADLS Gen2 folder", fr: "Pipeline PL_Copy : lire un dossier ADLS Gen2 différent" }
    - id: shortcut
      text: { en: "Shortcut SC_Raw in LH_Bronze: target an ADLS Gen2 account instead of an Amazon S3 bucket", fr: "Raccourci SC_Raw de LH_Bronze : cibler un compte ADLS Gen2 au lieu d'un compartiment Amazon S3" }
answer:
  mapping: { notebook: dlr, mirror: dsr, pipeline: varlib, shortcut: varlib }
explanation:
  correct:
    en: |
      Notebooks support only the default lakehouse rule, and mirrored databases support the data source rule. Pipelines and lakehouse shortcuts have no deployment rules; they read stage-specific values from a variable library, whose active value set is chosen in each stage. Parameter rules apply to semantic models and dataflows Gen1 only.
    fr: |
      Les notebooks ne prennent en charge que la règle de lakehouse par défaut, et les bases de données mises en miroir la règle de source de données. Les pipelines et les raccourcis de lakehouse n'ont pas de règles de déploiement ; ils lisent des valeurs propres à chaque phase dans une bibliothèque de variables, dont le jeu de valeurs actif est choisi dans chaque phase. Les règles de paramètre s'appliquent uniquement aux modèles sémantiques et aux dataflows Gen1.
references:
  - title: Create deployment rules for Fabric's ALM
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
  - title: Fabric Application Lifecycle Management Variable Library
    url: https://learn.microsoft.com/en-us/fabric/cicd/variable-library/variable-library-overview
