id: dp700-1b-item-notebook-share
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Eng that contains a notebook named NB_Report. Three users have no role in WS-Eng:

    - **Ops1** must run NB_Report but must not change its code.
    - **Rev1** must change the code of NB_Report but must not run it.
    - **Lead1** must be able to share NB_Report with other users, without editing or running it.

    You need to share NB_Report with each user. Which permission should you select for each user? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Eng qui contient un notebook nommé NB_Report. Trois utilisateurs n'ont aucun rôle dans WS-Eng :

    - **Ops1** doit exécuter NB_Report, mais ne doit pas modifier son code.
    - **Rev1** doit modifier le code de NB_Report, mais ne doit pas l'exécuter.
    - **Lead1** doit pouvoir partager NB_Report avec d'autres utilisateurs, sans le modifier ni l'exécuter.

    Vous devez partager NB_Report avec chaque utilisateur. Quelle autorisation devez-vous sélectionner pour chaque utilisateur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ops1: [[ops]]
      Rev1: [[rev]]
      Lead1: [[lead]]
    fr: |
      Ops1 : [[ops]]
      Rev1 : [[rev]]
      Lead1 : [[lead]]
  slots:
    - id: ops
      options:
        - { id: share, text: Share }
        - { id: edit, text: Edit }
        - { id: run, text: Run }
    - id: rev
      options:
        - { id: share, text: Share }
        - { id: edit, text: Edit }
        - { id: run, text: Run }
    - id: lead
      options:
        - { id: share, text: Share }
        - { id: edit, text: Edit }
        - { id: run, text: Run }
answer:
  values: { ops: run, rev: edit, lead: share }
explanation:
  correct:
    en: |
      The sharing dialog of a notebook offers the Share, Edit and Run permissions on top of read access. Read plus execute gives the Run only mode (run without editing), read plus write gives the Edit mode (edit without running), and Share lets the recipient share the notebook onward.
    fr: |
      La boîte de dialogue de partage d'un notebook propose les autorisations Share, Edit et Run en plus de l'accès en lecture. Lecture et exécution donnent le mode Run only (exécuter sans modifier), lecture et écriture donnent le mode Edit (modifier sans exécuter), et Share permet au destinataire de partager à son tour le notebook.
references:
  - title: How to use notebooks
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/how-to-use-notebook
