id: dp700-1b-deploy-assign-issues
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline named DP-Orders that has three stages. You are an admin of DP-Orders and an admin of the workspaces assigned to the Development and Production stages. The Test stage is empty.

    You plan to assign a workspace named WS-QA to the Test stage. WS-QA is on a Fabric capacity. When you expand **Add content to this stage**, WS-QA doesn't appear in the list of workspaces.

    Which two issues could cause this?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement nommé DP-Orders qui comporte trois phases. Vous êtes administrateur de DP-Orders et administrateur des espaces de travail affectés aux phases Development et Production. La phase Test est vide.

    Vous prévoyez d'affecter un espace de travail nommé WS-QA à la phase Test. WS-QA se trouve sur une capacité Fabric. Quand vous développez **Add content to this stage**, WS-QA n'apparaît pas dans la liste des espaces de travail.

    Quelles sont les deux causes possibles ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "WS-QA is connected to a Git repository.", fr: "WS-QA est connecté à un dépôt Git." } }
    - { id: b, text: { en: "WS-QA is already assigned to another deployment pipeline.", fr: "WS-QA est déjà affecté à un autre pipeline de déploiement." } }
    - { id: c, text: { en: "WS-QA contains items that have the same names as items in the Development workspace.", fr: "WS-QA contient des éléments qui portent les mêmes noms que des éléments de l'espace de travail de développement." } }
    - { id: d, text: { en: "You have the Member role in WS-QA.", fr: "Vous avez le rôle Member dans WS-QA." } }
    - { id: e, text: { en: "WS-QA contains a lakehouse that has OneLake shortcuts.", fr: "WS-QA contient un lakehouse qui possède des raccourcis OneLake." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Only workspaces that meet every condition are listed - you are an admin of the workspace, it isn't assigned to another deployment pipeline, it's on a Fabric capacity, and you have at least Contributor on the workspaces of the adjacent stages. A Member of WS-QA, or a WS-QA that already belongs to another pipeline, doesn't qualify.
    fr: "Seuls les espaces de travail qui remplissent toutes les conditions sont listés : vous êtes administrateur de l'espace de travail, il n'est affecté à aucun autre pipeline de déploiement, il se trouve sur une capacité Fabric, et vous avez au moins Contributor sur les espaces de travail des phases adjacentes. Un rôle Member sur WS-QA, ou un WS-QA qui appartient déjà à un autre pipeline, ne remplit pas ces conditions."
  options:
    a: { en: "Git integration and deployment pipelines are designed to be used together on the same workspace.", fr: "L'intégration Git et les pipelines de déploiement sont conçus pour être utilisés ensemble sur un même espace de travail." }
    c: { en: "Items with the same name and type are paired with the items of the adjacent stages; they don't prevent the assignment.", fr: "Les éléments de même nom et de même type sont jumelés avec ceux des phases adjacentes ; ils n'empêchent pas l'affectation." }
    e: { en: "Shortcuts are supported by deployment pipelines and don't hide the workspace.", fr: "Les raccourcis sont pris en charge par les pipelines de déploiement et ne masquent pas l'espace de travail." }
references:
  - title: Assign a workspace to a deployment pipeline
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/assign-pipeline
