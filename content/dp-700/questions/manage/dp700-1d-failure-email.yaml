id: dp700-1d-failure-email
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a notebook named NB_Daily. NB_Daily runs from a daily schedule. It is never run on demand.

    You need the members of a Microsoft Entra group named DataOps to receive an email when a scheduled run of NB_Daily fails. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un notebook nommé NB_Daily. NB_Daily s'exécute selon une planification quotidienne. Il n'est jamais exécuté à la demande.

    Les membres d'un groupe Microsoft Entra nommé DataOps doivent recevoir un e-mail quand une exécution planifiée de NB_Daily échoue. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Create a pipeline that runs NB_Daily in a Notebook activity and posts to a Teams channel on the On failure path."
        fr: "Créer un pipeline qui exécute NB_Daily dans une activité Notebook et publie dans un canal Teams sur le chemin On failure."
    - id: b
      text:
        en: "Add DataOps to the failure notifications in the Schedule settings of NB_Daily."
        fr: "Ajouter DataOps aux notifications d'échec dans les paramètres de Planification de NB_Daily."
    - id: c
      text:
        en: "Add a try/except block to NB_Daily that calls notebookutils.notebook.exit with an error message."
        fr: "Ajouter à NB_Daily un bloc try/except qui appelle notebookutils.notebook.exit avec un message d'erreur."
    - id: d
      text:
        en: "Assign DataOps the Contributor role in Workspace1 so that its members can open the Monitor hub."
        fr: "Attribuer à DataOps le rôle Contributor dans Workspace1 pour que ses membres puissent ouvrir le hub de surveillance."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Items scheduled by the Fabric job scheduler, such as notebooks, support failure notifications. You add users or groups of your Microsoft Entra tenant in the Schedule settings, and they receive an email for each failed scheduled run.
    fr: |
      Les éléments planifiés par le planificateur de travaux Fabric, comme les notebooks, prennent en charge les notifications d'échec. Vous ajoutez des utilisateurs ou des groupes de votre locataire Microsoft Entra dans les paramètres de Planification, et ils reçoivent un e-mail pour chaque exécution planifiée qui échoue.
  options:
    a: { en: "A Teams message is not an email, and building a pipeline adds effort compared with a built-in setting.", fr: "Un message Teams n'est pas un e-mail, et créer un pipeline ajoute de l'effort par rapport à un paramètre intégré." }
    c: { en: "exit() ends the notebook and returns a value to its caller; it sends no email, and it does not take effect inside a try/except block.", fr: "exit() termine le notebook et renvoie une valeur à son appelant ; il n'envoie aucun e-mail et ne prend pas effet dans un bloc try/except." }
    d: { en: "A workspace role lets the members check runs themselves, but nobody is notified when a run fails.", fr: "Un rôle d'espace de travail permet aux membres de consulter eux-mêmes les exécutions, mais personne n'est averti quand une exécution échoue." }
references:
  - title: Job Scheduler in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
