id: dp700-1c-endorse-discoverable
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are an authorized certifier in your Fabric tenant. You have the Member role in a workspace that contains a Power BI semantic model named SM_Revenue, built on a lakehouse in the same workspace.

    You are about to certify SM_Revenue. Users who don't have access to SM_Revenue must be able to find it and then request access. You must not grant them any access to SM_Revenue now.

    What should you do when you certify SM_Revenue?
  fr: |
    Vous êtes un certificateur autorisé dans votre locataire Fabric. Vous avez le rôle Member dans un espace de travail qui contient un modèle sémantique Power BI nommé SM_Revenue, basé sur un lakehouse du même espace de travail.

    Vous êtes sur le point de certifier SM_Revenue. Les utilisateurs qui n'ont pas accès à SM_Revenue doivent pouvoir le trouver, puis demander l'accès. Vous ne devez leur accorder aucun accès à SM_Revenue pour l'instant.

    Que devez-vous faire quand vous certifiez SM_Revenue ?
body:
  options:
    - { id: a, text: { en: "Also endorse SM_Revenue as Master data.", fr: "Approuver aussi SM_Revenue comme Master data." } }
    - { id: b, text: { en: "Share SM_Revenue with all users with the Read permission only.", fr: "Partager SM_Revenue avec tous les utilisateurs avec l'autorisation Read uniquement." } }
    - { id: c, text: { en: "Apply the General sensitivity label to SM_Revenue.", fr: "Appliquer l'étiquette de confidentialité General à SM_Revenue." } }
    - { id: d, text: { en: "Select the Make discoverable checkbox.", fr: "Cocher la case Make discoverable." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When you promote or certify a Power BI semantic model, the Make discoverable option lets users who don't have access to the model find it, so they can request access. It doesn't grant any permission on the model.
    fr: |
      Quand vous promouvez ou certifiez un modèle sémantique Power BI, l'option Make discoverable permet aux utilisateurs qui n'ont pas accès au modèle de le trouver, pour pouvoir demander l'accès. Elle n'accorde aucune autorisation sur le modèle.
  options:
    a: { en: "Master data marks an authoritative source; it doesn't make the model visible to users without access.", fr: "Master data désigne une source qui fait autorité ; il ne rend pas le modèle visible aux utilisateurs sans accès." }
    b: { en: "Sharing grants access now, which the requirement forbids.", fr: "Le partage accorde un accès dès maintenant, ce que l'exigence interdit." }
    c: { en: "A sensitivity label doesn't affect whether users without access can find the model.", fr: "Une étiquette de confidentialité n'influe pas sur la possibilité pour des utilisateurs sans accès de trouver le modèle." }
references:
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
