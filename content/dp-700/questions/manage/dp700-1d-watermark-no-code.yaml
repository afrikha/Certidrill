id: dp700-1d-watermark-no-code
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an on-premises SQL Server database named ERP that is reachable through an on-premises data gateway that runs the latest version. A table named dbo.Invoices in ERP has a datetime2 column named LastModified that is updated on every insert and update. Rows are never deleted.

    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Finance. You need to load dbo.Invoices to a table in LH_Finance every hour. The first run must load the existing rows, and later runs must read only new and changed rows. The solution must not require writing code or pipeline expressions.

    Which two items can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une base de données SQL Server locale nommée ERP, accessible via une passerelle de données locale à jour. Une table nommée dbo.Invoices dans ERP a une colonne datetime2 nommée LastModified, mise à jour à chaque insertion et mise à jour. Les lignes ne sont jamais supprimées.

    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Finance. Vous devez charger dbo.Invoices dans une table de LH_Finance toutes les heures. La première exécution doit charger les lignes existantes, et les exécutions suivantes ne doivent lire que les lignes nouvelles et modifiées. La solution ne doit exiger ni code ni expressions de pipeline.

    Quels sont les deux éléments que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A copy job in incremental copy mode that uses LastModified as the incremental column", fr: "Un travail de copie en mode de copie incrémentielle qui utilise LastModified comme colonne incrémentielle" } }
    - { id: b, text: { en: "A pipeline with a Lookup activity that reads the last LastModified value and a Copy data activity that filters on it", fr: "Un pipeline avec une activité Lookup qui lit la dernière valeur de LastModified et une activité Copy data qui filtre sur celle-ci" } }
    - { id: c, text: { en: "A Dataflow Gen2 that has incremental refresh configured on LastModified", fr: "Un Dataflow Gen2 dont l'actualisation incrémentielle est configurée sur LastModified" } }
    - { id: d, text: { en: "A notebook that reads dbo.Invoices and filters on the maximum LastModified value of the lakehouse table", fr: "Un notebook qui lit dbo.Invoices et filtre sur la valeur maximale de LastModified de la table du lakehouse" } }
    - { id: e, text: { en: "A Spark job definition that runs every hour and merges the changed rows", fr: "Une définition de travail Spark qui s'exécute toutes les heures et fusionne les lignes modifiées" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      A copy job supports watermark-based incremental copy on a datetime column: the first run copies everything and later runs copy only new or changed rows, all configured in a wizard. Dataflow Gen2 incremental refresh filters on a DateTime column, supports a lakehouse destination and works through a gateway that has a recent version. Neither option requires code or expressions.
    fr: |
      Un travail de copie prend en charge la copie incrémentielle basée sur un filigrane avec une colonne datetime : la première exécution copie tout et les suivantes ne copient que les lignes nouvelles ou modifiées, le tout configuré dans un Assistant. L'actualisation incrémentielle de Dataflow Gen2 filtre sur une colonne DateTime, prend en charge une destination lakehouse et fonctionne via une passerelle de version récente. Aucune de ces options n'exige de code ni d'expressions.
  options:
    b: { en: "The Lookup and Copy data pattern works, but the filter and the watermark update require pipeline expressions, which the requirements exclude.", fr: "Le modèle Lookup et Copy data fonctionne, mais le filtre et la mise à jour du filigrane exigent des expressions de pipeline, ce que les exigences excluent." }
    d: { en: "A notebook requires Spark code.", fr: "Un notebook exige du code Spark." }
    e: { en: "A Spark job definition runs Spark code, which the requirements exclude.", fr: "Une définition de travail Spark exécute du code Spark, ce que les exigences excluent." }
references:
  - title: What is Copy job in Data Factory for Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
  - title: Incremental refresh in Dataflow Gen2
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-incremental-refresh
