id: dp700-1b-granular-folder-role
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Lake that contains a lakehouse named LH1. OneLake security is enabled on LH1, and the DefaultReader role is unchanged.

    A security group named SG-Partners has no access to WS-Lake. Its members must read only the files of the Files/partner/exports folder of LH1, from Spark notebooks and from the OneLake APIs. They must not be able to write any data.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Lake qui contient un lakehouse nommé LH1. La sécurité OneLake est activée sur LH1, et le rôle DefaultReader n'a pas été modifié.

    Un groupe de sécurité nommé SG-Partners n'a aucun accès à WS-Lake. Ses membres ne doivent lire que les fichiers du dossier Files/partner/exports de LH1, depuis des notebooks Spark et depuis les API OneLake. Ils ne doivent pouvoir écrire aucune donnée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share LH1 with SG-Partners and select Read all with Apache Spark, then add SG-Partners to a OneLake security role that grants Read on Files/partner/exports.", fr: "Partager LH1 avec SG-Partners en sélectionnant Read all with Apache Spark, puis ajouter SG-Partners à un rôle de sécurité OneLake qui accorde Read sur Files/partner/exports." } }
    - { id: b, text: { en: "Assign SG-Partners the Contributor role in WS-Lake, then add SG-Partners to a OneLake security role that grants Read on Files/partner/exports.", fr: "Attribuer à SG-Partners le rôle Contributor dans WS-Lake, puis ajouter SG-Partners à un rôle de sécurité OneLake qui accorde Read sur Files/partner/exports." } }
    - { id: c, text: { en: "Share LH1 with SG-Partners with no additional permissions, then add SG-Partners to a OneLake security role that grants Read on Files/partner/exports.", fr: "Partager LH1 avec SG-Partners sans autorisation supplémentaire, puis ajouter SG-Partners à un rôle de sécurité OneLake qui accorde Read sur Files/partner/exports." } }
    - { id: d, text: { en: "Share LH1 with SG-Partners and select Read all with SQL analytics endpoint, then add SG-Partners to a OneLake security role that grants ReadWrite on Files/partner/exports.", fr: "Partager LH1 avec SG-Partners en sélectionnant Read all with SQL analytics endpoint, puis ajouter SG-Partners à un rôle de sécurité OneLake qui accorde ReadWrite sur Files/partner/exports." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      OneLake security is deny by default for users who hold only the Read item permission, so sharing LH1 without additional permissions gives no data access by itself. The custom role then grants Read on Files/partner/exports, and its files and subfolders inherit the access. The members can traverse the parent folders but can't see the sibling folders.
    fr: |
      La sécurité OneLake refuse par défaut l'accès aux utilisateurs qui n'ont que l'autorisation d'élément Read ; partager LH1 sans autorisation supplémentaire ne donne donc à lui seul aucun accès aux données. Le rôle personnalisé accorde ensuite Read sur Files/partner/exports, et ses fichiers et sous-dossiers héritent de l'accès. Les membres peuvent traverser les dossiers parents, mais ne voient pas les dossiers de même niveau.
  options:
    a: { en: "ReadAll places the group in the DefaultReader role, which gives access to all the data of LH1; roles combine as a union.", fr: "ReadAll place le groupe dans le rôle DefaultReader, qui donne accès à toutes les données de LH1 ; les rôles se combinent par union." }
    b: { en: "Contributors have write access to every item of the workspace, so OneLake security roles don't restrict them.", fr: "Les Contributors ont un accès en écriture à tous les éléments de l'espace de travail : les rôles de sécurité OneLake ne les restreignent pas." }
    d: { en: "ReadWrite lets the members create, change and delete files in the folder, which isn't allowed.", fr: "ReadWrite permet aux membres de créer, modifier et supprimer des fichiers dans le dossier, ce qui n'est pas autorisé." }
references:
  - title: OneLake security roles, permissions, and scopes
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
  - title: "OneLake security roles: create and manage"
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles
