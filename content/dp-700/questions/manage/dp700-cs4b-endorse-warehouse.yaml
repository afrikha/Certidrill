id: dp700-cs4b-endorse-warehouse
objective: "1.3.6"
type: single
caseStudy: dp700-cs4b-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the governance requirement for WH_Sales.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de gouvernance concernant WH_Sales.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Ask a member of DataGovernance to promote WH_Sales from its settings.", fr: "Demander à un membre de DataGovernance de promouvoir WH_Sales depuis ses paramètres." } }
    - { id: b, text: { en: "Ask the Fabric administrator to enable master data endorsement for DataGovernance, and then have DataGovernance label WH_Sales as master data.", fr: "Demander à l'administrateur Fabric d'activer l'approbation des données de référence pour DataGovernance, puis faire marquer WH_Sales comme données de référence par DataGovernance." } }
    - { id: c, text: { en: "Ask the Fabric administrator to enable certification for DataGovernance, and then have DataGovernance certify WH_Sales.", fr: "Demander à l'administrateur Fabric d'activer la certification pour DataGovernance, puis faire certifier WH_Sales par DataGovernance." } }
    - { id: d, text: { en: "Ask the Fabric administrator to publish a sensitivity label for DataGovernance, and then have DataGovernance apply it to WH_Sales.", fr: "Demander à l'administrateur Fabric de publier une étiquette de confidentialité pour DataGovernance, puis la faire appliquer à WH_Sales par DataGovernance." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Certified badge means that an organization-authorized reviewer has checked that the item meets the organization's quality standards. Certification is available only after a Fabric administrator enables it and specifies who can certify. A certifier also needs write permission on the item, which the members of DataGovernance have, and nobody else can apply the badge.
    fr: |
      Le badge Certified signifie qu'un réviseur autorisé par l'organisation a vérifié que l'élément respecte les normes de qualité de l'organisation. La certification n'est disponible qu'une fois qu'un administrateur Fabric l'a activée et a désigné qui peut certifier. Un certificateur a aussi besoin de l'autorisation d'écriture sur l'élément, dont disposent les membres de DataGovernance, et personne d'autre ne peut appliquer le badge.
  options:
    a:
      en: |
        Promoted only means that the creators think the item is ready for reuse, and any user with write permission on WH_Sales, such as DataEngineers, could promote it.
      fr: |
        Promoted signifie seulement que les créateurs estiment l'élément prêt à être réutilisé, et tout utilisateur disposant de l'autorisation d'écriture sur WH_Sales, comme DataEngineers, pourrait le promouvoir.
    b:
      en: |
        Master data marks a core, single source of truth such as product codes or customer lists; it does not state that the item was reviewed against quality standards.
      fr: |
        Master data désigne une source de données centrale et unique, comme des codes produits ou des listes de clients ; il n'indique pas que l'élément a été vérifié selon des normes de qualité.
    d:
      en: |
        A sensitivity label classifies how confidential the data is; it is not an endorsement of its quality.
      fr: |
        Une étiquette de confidentialité classe le niveau de confidentialité des données ; ce n'est pas une approbation de leur qualité.
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
