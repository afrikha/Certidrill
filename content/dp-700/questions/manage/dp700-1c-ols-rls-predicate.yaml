id: dp700-1c-ols-rls-predicate
objective: "1.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a schema-enabled lakehouse named Lakehouse1 that contains a Delta table named dbo.Orders. The table has a string column named Region.

    You create a OneLake security role named EuropeAsia that grants Read on dbo.Orders. Members of the role must see only the rows for the EMEA and APAC regions in every Fabric engine.

    How should you complete the row security rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse avec schémas nommé Lakehouse1 qui contient une table Delta nommée dbo.Orders. La table comporte une colonne de chaîne nommée Region.

    Vous créez un rôle de sécurité OneLake nommé EuropeAsia qui accorde Read sur dbo.Orders. Les membres du rôle ne doivent voir que les lignes des régions EMEA et APAC, dans tous les moteurs Fabric.

    Comment devez-vous compléter la règle de sécurité des lignes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT * FROM [[tbl]] WHERE [[cond]]
  slots:
    - id: tbl
      options:
        - { id: schematbl, text: dbo.Orders }
        - { id: tblonly, text: Orders }
        - { id: lhtbl, text: Lakehouse1.Orders }
        - { id: pathtbl, text: Tables.dbo.Orders }
    - id: cond
      options:
        - { id: inlist, text: "Region IN ('EMEA', 'APAC')" }
        - { id: andcond, text: "Region = 'EMEA' AND Region = 'APAC'" }
        - { id: username, text: "Region = USER_NAME()" }
        - { id: orbad, text: "Region = 'EMEA' OR 'APAC'" }
answer:
  values: { tbl: schematbl, cond: inlist }
explanation:
  correct:
    en: |
      A OneLake row security rule takes the form SELECT * FROM schema.table WHERE boolean conditions, and the schema is required when the item supports schemas. IN is true when the column value exactly matches any value of the list, so it keeps both regions.
    fr: |
      Une règle de sécurité des lignes OneLake prend la forme SELECT * FROM schéma.table WHERE conditions booléennes, et le schéma est obligatoire quand l'élément prend en charge les schémas. IN est vrai quand la valeur de la colonne correspond exactement à l'une des valeurs de la liste : les deux régions sont conservées.
  options:
    tblonly: { en: "In a schema-enabled lakehouse, the rule must include the schema name.", fr: "Dans un lakehouse avec schémas, la règle doit inclure le nom du schéma." }
    lhtbl: { en: "The rule references the schema and table, not the item name.", fr: "La règle cite le schéma et la table, pas le nom de l'élément." }
    pathtbl: { en: "The rule uses the table name, not its OneLake folder path.", fr: "La règle utilise le nom de la table, pas son chemin de dossier OneLake." }
    andcond: { en: "A single Region value can't equal both values, so no row would be returned.", fr: "Une même valeur de Region ne peut pas être égale aux deux valeurs : aucune ligne ne serait renvoyée." }
    username: { en: "OneLake row security doesn't support dynamic rules that depend on the current user.", fr: "La sécurité des lignes OneLake ne prend pas en charge les règles dynamiques qui dépendent de l'utilisateur courant." }
    orbad: { en: "Each Boolean statement needs a column, an operator and a value; 'APAC' alone isn't a condition.", fr: "Chaque instruction booléenne exige une colonne, un opérateur et une valeur ; 'APAC' seul n'est pas une condition." }
references:
  - title: Table, column, and row-level security in OneLake
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/row-level-security
  - title: Create and manage OneLake security roles
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles
