id: dp700-1c-ddm-email-function
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a warehouse named DW1. DW1 contains a table named dbo.Customer that has a column named ContactEmail.

    Support agents have the Viewer role in Workspace1 and query dbo.Customer by using T-SQL. When they read ContactEmail, they must see only the first letter of each address, and the domain name must stay hidden.

    You need to add a dynamic data mask to ContactEmail. The solution must minimize development effort.

    Which masking function should you use?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un entrepôt nommé DW1. DW1 contient une table nommée dbo.Customer qui comporte une colonne nommée ContactEmail.

    Les agents du support ont le rôle Viewer dans Workspace1 et interrogent dbo.Customer en T-SQL. Quand ils lisent ContactEmail, ils ne doivent voir que la première lettre de chaque adresse, et le nom de domaine doit rester caché.

    Vous devez ajouter un masque dynamique à ContactEmail. La solution doit réduire au minimum l'effort de développement.

    Quelle fonction de masquage devez-vous utiliser ?
body:
  options:
    - { id: a, text: "partial(0,\"XXXX\",4)" }
    - { id: b, text: "default()" }
    - { id: c, text: "email()" }
    - { id: d, text: "random(1, 100)" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The email() function exposes the first letter of the address and replaces the rest with the constant form aXXX@XXXX.com, so the real domain is never shown. It is built for this case and needs no custom padding string.
    fr: |
      La fonction email() affiche la première lettre de l'adresse et remplace le reste par la forme constante aXXX@XXXX.com, si bien que le vrai domaine n'est jamais affiché. Elle est conçue pour ce cas et ne demande aucune chaîne de remplissage personnalisée.
  options:
    a: { en: "This mask shows the last four characters of the address, which are part of the domain name (for example .com or .org).", fr: "Ce masque affiche les quatre derniers caractères de l'adresse, qui font partie du nom de domaine (par exemple .com ou .org)." }
    b: { en: "default() replaces the whole string with XXXX, so the first letter isn't shown.", fr: "default() remplace toute la chaîne par XXXX : la première lettre n'est pas affichée." }
    d: { en: "random() applies only to numeric columns; ContactEmail is a string.", fr: "random() ne s'applique qu'aux colonnes numériques ; ContactEmail est une chaîne." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
