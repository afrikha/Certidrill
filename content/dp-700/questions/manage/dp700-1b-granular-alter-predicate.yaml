id: dp700-1b-granular-alter-predicate
objective: "1.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1. A security policy named Security.RegionFilter adds a filter predicate on dbo.FactSales by using an inline table-valued function named Security.fn_region, created WITH SCHEMABINDING.

    You need to change the logic of Security.fn_region so that regional directors see all the rows. Row-level security must apply to dbo.FactSales again when you finish.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1. Une stratégie de sécurité nommée Security.RegionFilter ajoute un prédicat de filtre sur dbo.FactSales à l'aide d'une fonction table inline nommée Security.fn_region, créée WITH SCHEMABINDING.

    Vous devez modifier la logique de Security.fn_region pour que les directeurs régionaux voient toutes les lignes. La sécurité au niveau des lignes doit de nouveau s'appliquer à dbo.FactSales à la fin.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: drop, text: { en: "Run DROP SECURITY POLICY Security.RegionFilter.", fr: "Exécuter DROP SECURITY POLICY Security.RegionFilter." } }
    - { id: alter, text: { en: "Run ALTER FUNCTION Security.fn_region with the new logic.", fr: "Exécuter ALTER FUNCTION Security.fn_region avec la nouvelle logique." } }
    - { id: create, text: { en: "Run CREATE SECURITY POLICY Security.RegionFilter with ADD FILTER PREDICATE on dbo.FactSales and STATE = ON.", fr: "Exécuter CREATE SECURITY POLICY Security.RegionFilter avec ADD FILTER PREDICATE sur dbo.FactSales et STATE = ON." } }
    - { id: second, text: { en: "Run ALTER SECURITY POLICY to add a second filter predicate on dbo.FactSales.", fr: "Exécuter ALTER SECURITY POLICY pour ajouter un second prédicat de filtre sur dbo.FactSales." } }
    - { id: unmask, text: { en: "Grant UNMASK on dbo.FactSales to the regional directors.", fr: "Accorder UNMASK sur dbo.FactSales aux directeurs régionaux." } }
    - { id: deny, text: { en: "Run DENY SELECT ON dbo.FactSales to the sales representatives.", fr: "Exécuter DENY SELECT ON dbo.FactSales pour les commerciaux." } }
answer:
  sequence: [ drop, alter, create ]
explanation:
  correct:
    en: |
      A function used by a schema-bound security policy can't be modified while the policy references it. You drop the policy, alter the function, and then re-create the policy with the filter predicate and STATE = ON so that the rows are filtered again.
    fr: |
      Une fonction utilisée par une stratégie de sécurité liée au schéma ne peut pas être modifiée tant que la stratégie la référence. Vous supprimez la stratégie, vous modifiez la fonction, puis vous recréez la stratégie avec le prédicat de filtre et STATE = ON pour que les lignes soient de nouveau filtrées.
  options:
    second: { en: "A table can't have a second predicate for the same operation, whether or not the first one is enabled.", fr: "Une table ne peut pas avoir un second prédicat pour la même opération, que le premier soit activé ou non." }
    unmask: { en: "UNMASK reveals masked values; it doesn't change which rows a security policy returns.", fr: "UNMASK révèle les valeurs masquées ; il ne change pas les lignes que renvoie une stratégie de sécurité." }
    deny: { en: "DENY blocks the whole table for the representatives instead of filtering rows.", fr: "DENY bloque toute la table pour les commerciaux au lieu de filtrer des lignes." }
references:
  - title: Row-Level Security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
