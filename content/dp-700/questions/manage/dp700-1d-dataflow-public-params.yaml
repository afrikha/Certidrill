id: dp700-1d-dataflow-public-params
objective: "1.4.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a Dataflow Gen2 with CI/CD support named DF_Prices and a pipeline named PL_Prices. DF_Prices has a required query parameter named CountryCode that its filter step uses. You are the owner of DF_Prices.

    You need PL_Prices to run DF_Prices and pass the value of its pipeline parameter named Country to CountryCode at run time. The Dataflow activity must list CountryCode as soon as you select DF_Prices in it.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un Dataflow Gen2 avec prise en charge CI/CD nommé DF_Prices et un pipeline nommé PL_Prices. DF_Prices a un paramètre de requête obligatoire nommé CountryCode, utilisé par son étape de filtre. Vous êtes le propriétaire de DF_Prices.

    PL_Prices doit exécuter DF_Prices et transmettre à CountryCode la valeur de son paramètre de pipeline nommé Country au moment de l'exécution. L'activité Dataflow doit lister CountryCode dès que vous y sélectionnez DF_Prices.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: enable, text: { en: "In the Options of DF_Prices, enable the discovery and override of parameters for execution.", fr: "Dans les options de DF_Prices, activer la découverte et le remplacement des paramètres pour l'exécution." } }
    - { id: save, text: { en: "Save DF_Prices.", fr: "Enregistrer DF_Prices." } }
    - { id: activity, text: { en: "In PL_Prices, add a Dataflow activity and select DF_Prices.", fr: "Dans PL_Prices, ajouter une activité Dataflow et sélectionner DF_Prices." } }
    - { id: value, text: { en: "In the Dataflow parameters section of the activity, set CountryCode to @pipeline().parameters.Country.", fr: "Dans la section des paramètres du dataflow de l'activité, définir CountryCode sur @pipeline().parameters.Country." } }
    - { id: incremental, text: { en: "Configure incremental refresh on the query of DF_Prices.", fr: "Configurer l'actualisation incrémentielle sur la requête de DF_Prices." } }
    - { id: schedule, text: { en: "Add a schedule to DF_Prices that passes the country code.", fr: "Ajouter à DF_Prices une planification qui transmet le code pays." } }
answer:
  sequence: [ enable, save, activity, value ]
explanation:
  correct:
    en: |
      Public parameters mode exposes the query parameters of a Dataflow Gen2 with CI/CD. The owner enables the option that lets parameters be discovered and overridden for execution, then saves the dataflow so that the setting takes effect. When you then select DF_Prices in a Dataflow activity, its Dataflow parameters section lists CountryCode, marked as required, and you set its value with a pipeline expression.
    fr: |
      Le mode des paramètres publics expose les paramètres de requête d'un Dataflow Gen2 avec CI/CD. Le propriétaire active l'option qui permet de découvrir et de remplacer les paramètres pour l'exécution, puis enregistre le dataflow pour que le réglage prenne effet. Quand vous sélectionnez ensuite DF_Prices dans une activité Dataflow, sa section des paramètres du dataflow liste CountryCode, marqué comme obligatoire, et vous définissez sa valeur avec une expression de pipeline.
  options:
    incremental: { en: "Incremental refresh is not compatible with public parameters mode and does not pass a value.", fr: "L'actualisation incrémentielle n'est pas compatible avec le mode des paramètres publics et ne transmet aucune valeur." }
    schedule: { en: "A dataflow with a required public parameter cannot be scheduled, and the pipeline is the one that must pass the value.", fr: "Un dataflow doté d'un paramètre public obligatoire ne peut pas être planifié, et c'est le pipeline qui doit transmettre la valeur." }
references:
  - title: Use public parameters in Dataflow Gen2 (Preview)
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-parameters
  - title: Use the Dataflow activity to run a Dataflow Gen2
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-activity
