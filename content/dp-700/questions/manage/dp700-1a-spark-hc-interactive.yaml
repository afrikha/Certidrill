id: dp700-1a-spark-hc-interactive
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Finance**. An analyst named **User1** often runs four notebooks at the same time. The notebooks use the same default lakehouse, the same environment and the same compute settings.

    You need to ensure that the second, third and fourth notebooks start without waiting for a new Spark session, and that only one Spark session is billed for the four notebooks.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Finance**. Un analyste nommé **User1** exécute souvent quatre notebooks en même temps. Les notebooks utilisent le même lakehouse par défaut, le même environnement et les mêmes paramètres de calcul.

    Vous devez faire en sorte que les deuxième, troisième et quatrième notebooks démarrent sans attendre une nouvelle session Spark, et qu'une seule session Spark soit facturée pour les quatre notebooks.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: e, text: { en: "Set the Spark property spark.highConcurrency.max to 1 in the environment", fr: "Définir la propriété Spark spark.highConcurrency.max sur 1 dans l'environnement" } }
    - { id: b, text: { en: "Have User1 start a New high concurrency session and attach the other notebooks to it", fr: "Demander à User1 de démarrer une New high concurrency session et d'y attacher les autres notebooks" } }
    - { id: c, text: { en: "Set the same session tag in the advanced settings of the four notebooks", fr: "Définir la même balise de session dans les paramètres avancés des quatre notebooks" } }
    - { id: d, text: { en: "Turn on Reserve maximum cores for active Spark jobs", fr: "Activer Reserve maximum cores for active Spark jobs" } }
    - { id: a, text: { en: "Ensure that High concurrency For notebooks is on in the Spark settings of WS-Finance", fr: "Vérifier que le paramètre de haute concurrence For notebooks est activé dans les paramètres Spark de WS-Finance" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: High concurrency mode lets notebooks of the same user, with the same default lakehouse, compute settings and libraries, share one Spark session; later notebooks start immediately and only the notebook that started the session is billed. The workspace setting For notebooks must be on (it is on by default), and in the notebook the user selects New high concurrency session on the Run tab and attaches the other notebooks to it.
    fr: Le mode haute concurrence permet aux notebooks d'un même utilisateur, avec le même lakehouse par défaut, les mêmes paramètres de calcul et les mêmes bibliothèques, de partager une session Spark ; les notebooks suivants démarrent immédiatement et seul le notebook qui a démarré la session est facturé. Le paramètre d'espace de travail For notebooks doit être activé (il l'est par défaut), puis l'utilisateur sélectionne New high concurrency session dans l'onglet Run du notebook et y attache les autres notebooks.
  options:
    c:
      en: Session tags are a property of Notebook activities in pipelines; they don't apply to notebooks that a user runs interactively.
      fr: Les balises de session sont une propriété des activités Notebook des pipelines ; elles ne s'appliquent pas aux notebooks qu'un utilisateur exécute de façon interactive.
    d:
      en: Reserving maximum cores controls job admission on the capacity; it doesn't make notebooks share a session.
      fr: Réserver les cœurs maximaux contrôle l'admission des travaux sur la capacité ; cela ne fait pas partager une session aux notebooks.
    e:
      en: The property accepts values from 2 to 50 and raises or lowers the number of notebooks per session; the default of five already fits four notebooks.
      fr: La propriété accepte des valeurs de 2 à 50 et augmente ou réduit le nombre de notebooks par session ; la valeur par défaut de cinq suffit déjà pour quatre notebooks.
references:
  - title: Configure high concurrency mode for Fabric notebooks
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-high-concurrency-session-notebooks
  - title: High concurrency mode in Apache Spark for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/high-concurrency-overview
