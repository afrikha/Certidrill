id: dp700-1c-label-edit-permission
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your organization uses sensitivity labels from Microsoft Purview Information Protection. The Fabric tenant setting that allows users to apply sensitivity labels is enabled for all users, and the Confidential label is published to everyone.

    You have a Fabric workspace named Workspace1 that contains a lakehouse named Lakehouse1. A data steward named User1 has a Power BI Pro license and the Viewer role in Workspace1. User1 opens Lakehouse1 but can't apply the Confidential label to it. Other users of Workspace1 can apply the label.

    You need to ensure that User1 can apply sensitivity labels to the items of Workspace1. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Votre organisation utilise les étiquettes de confidentialité de Microsoft Purview Information Protection. Le paramètre de locataire Fabric qui permet aux utilisateurs d'appliquer des étiquettes de confidentialité est activé pour tous les utilisateurs, et l'étiquette Confidential est publiée pour tout le monde.

    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé Lakehouse1. Un responsable des données nommé User1 a une licence Power BI Pro et le rôle Viewer dans Workspace1. User1 ouvre Lakehouse1 mais ne peut pas lui appliquer l'étiquette Confidential. Les autres utilisateurs de Workspace1 peuvent appliquer l'étiquette.

    Vous devez faire en sorte que User1 puisse appliquer des étiquettes de confidentialité aux éléments de Workspace1. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign User1 the Contributor role in Workspace1.", fr: "Attribuer à User1 le rôle Contributor dans Workspace1." } }
    - { id: b, text: { en: "Share Lakehouse1 with User1 and select Read all data using Apache Spark.", fr: "Partager Lakehouse1 avec User1 en sélectionnant Read all data using Apache Spark." } }
    - { id: c, text: { en: "Assign User1 the Admin role in Workspace1.", fr: "Attribuer à User1 le rôle Admin dans Workspace1." } }
    - { id: d, text: { en: "Add User1 to the security group authorized to certify items.", fr: "Ajouter User1 au groupe de sécurité autorisé à certifier des éléments." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Applying a sensitivity label to a Fabric item requires a Power BI Pro or PPU license and edit permission on the item. User1 already has the license and the label, but a Viewer can't edit items. Contributor is the lowest workspace role that can edit items.
    fr: |
      Appliquer une étiquette de confidentialité à un élément Fabric exige une licence Power BI Pro ou PPU et l'autorisation de modifier l'élément. User1 a déjà la licence et l'étiquette, mais un Viewer ne peut pas modifier d'éléments. Contributor est le rôle d'espace de travail le plus bas qui permet de modifier des éléments.
  options:
    b: { en: "ReadAll lets User1 read the lakehouse files with Spark; it doesn't grant edit permission.", fr: "ReadAll permet à User1 de lire les fichiers du lakehouse avec Spark ; il n'accorde pas l'autorisation de modification." }
    c: { en: "Admin also grants edit permission, but with workspace management rights that User1 doesn't need.", fr: "Admin accorde aussi l'autorisation de modification, mais avec des droits de gestion de l'espace de travail dont User1 n'a pas besoin." }
    d: { en: "Certification rights control the Certified badge, not sensitivity labels.", fr: "Les droits de certification contrôlent le badge Certified, pas les étiquettes de confidentialité." }
references:
  - title: Apply sensitivity labels to Fabric items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/apply-sensitivity-labels
