id: dp700-1d-dependency-conditions
objective: "1.4.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric pipeline named PL_Daily that contains the activities shown in the following table. Lookup1 is the first activity of PL_Daily. Each activity has a single dependency.

    For each scenario, select the activity in the answer area that runs after Copy1 completes or is skipped. Notify, Archive and Report have no other dependencies.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline Fabric nommé PL_Daily qui contient les activités figurant dans le tableau suivant. Lookup1 est la première activité de PL_Daily. Chaque activité a une seule dépendance.

    Pour chaque scénario, sélectionnez dans la zone de réponse l'activité qui s'exécute après que Copy1 s'est terminée ou a été omise. Notify, Archive et Report n'ont pas d'autres dépendances.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Lookup1 succeeds and Copy1 fails.", fr: "Lookup1 réussit et Copy1 échoue." }
    - id: p2
      text: { en: "Lookup1 fails.", fr: "Lookup1 échoue." }
  grid:
    header: [{ en: "Activity", fr: "Activité" }, { en: "Type", fr: "Type" }, { en: "Runs after", fr: "S'exécute après" }, { en: "Condition", fr: "Condition" }]
    rows:
      - [{ text: Copy1 }, { text: Copy data }, { text: Lookup1 }, { text: On success }]
      - [{ text: Notify, area: notify }, { text: Teams }, { text: Copy1 }, { text: On failure }]
      - [{ text: Archive, area: archive }, { text: Copy data }, { text: Copy1 }, { text: On success }]
      - [{ text: Report, area: report }, { text: Stored procedure }, { text: Copy1 }, { text: On skip }]
answer:
  values: { p1: notify, p2: report }
explanation:
  correct:
    en: |
      Each dependency condition decides when the downstream activity runs: On success when the upstream activity succeeds, On failure when it fails, On completion whatever the result, and On skip when the upstream activity is skipped. When Copy1 fails, only Notify runs. When Lookup1 fails, its On success dependency is not met, so Copy1 is skipped, and Report, which depends on Copy1 On skip, runs.
    fr: |
      Chaque condition de dépendance détermine quand l'activité en aval s'exécute : On success quand l'activité en amont réussit, On failure quand elle échoue, On completion quel que soit le résultat, et On skip quand l'activité en amont est omise. Quand Copy1 échoue, seule Notify s'exécute. Quand Lookup1 échoue, sa dépendance On success n'est pas satisfaite : Copy1 est omise, et Report, qui dépend de Copy1 On skip, s'exécute.
  options:
    archive: { en: "Archive runs only when Copy1 succeeds, which happens in neither scenario.", fr: "Archive ne s'exécute que si Copy1 réussit, ce qui n'arrive dans aucun des deux scénarios." }
references:
  - title: Pipeline Canvas in Fabric Data Factory
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-canvas-experience
