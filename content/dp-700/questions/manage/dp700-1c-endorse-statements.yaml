id: dp700-1c-endorse-statements
objective: "1.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Your organization uses endorsement in Fabric and Power BI. Certification is enabled for a security group named Reviewers, and the certification setting contains the URL of the certification process.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation utilise l'approbation dans Fabric et Power BI. La certification est activée pour un groupe de sécurité nommé Reviewers, et le paramètre de certification contient l'URL du processus de certification.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who has write permission on a Power BI dashboard can promote the dashboard.
        fr: |
          Un utilisateur qui a l'autorisation d'écriture sur un tableau de bord Power BI peut promouvoir ce tableau de bord.
    - id: s2
      text:
        en: |
          A Contributor who isn't in Reviewers can see the link to the organization's certification process in the endorsement settings of a notebook.
        fr: |
          Un Contributor qui ne fait pas partie de Reviewers peut voir le lien vers le processus de certification de l'organisation dans les paramètres d'approbation d'un notebook.
    - id: s3
      text:
        en: |
          A Contributor can promote a lakehouse only after a Fabric administrator enables promotion for a security group that contains the Contributor.
        fr: |
          Un Contributor ne peut promouvoir un lakehouse qu'après qu'un administrateur Fabric a activé la promotion pour un groupe de sécurité qui contient ce Contributor.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Every Fabric and Power BI item except Power BI dashboards can be promoted or certified. Users who aren't authorized to certify see Certified unavailable, with a link that leads to the process documented by the Fabric administrator. Promotion needs only write permission on the item; only certification and master data require an administrator to enable them.
    fr: |
      Tous les éléments Fabric et Power BI, sauf les tableaux de bord Power BI, peuvent être promus ou certifiés. Les utilisateurs non autorisés à certifier voient Certified indisponible, avec un lien vers le processus documenté par l'administrateur Fabric. La promotion n'exige que l'autorisation d'écriture sur l'élément ; seules la certification et l'approbation Master data doivent être activées par un administrateur.
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
