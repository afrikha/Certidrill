id: dp700-1a-git-tenant-settings
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are a Fabric administrator. The Git integration tenant settings still have their default values.

    Two teams plan to use Git integration:

    - **Team A** will connect its workspaces to repositories in GitHub.
    - **Team B** will connect workspaces on a capacity in West Europe to an Azure DevOps repository located in the United States.

    You need to enable only the tenant settings that each team requires.

    Which tenant setting should you enable for each team? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur Fabric. Les paramètres du locataire relatifs à l'intégration Git ont toujours leurs valeurs par défaut.

    Deux équipes prévoient d'utiliser l'intégration Git :

    - **L'équipe A** connectera ses espaces de travail à des dépôts GitHub.
    - **L'équipe B** connectera des espaces de travail d'une capacité située en West Europe à un dépôt Azure DevOps situé aux États-Unis.

    Vous devez activer uniquement les paramètres du locataire dont chaque équipe a besoin.

    Quel paramètre du locataire devez-vous activer pour chaque équipe ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Team A: [[teama]]

      Team B: [[teamb]]
    fr: |
      Équipe A : [[teama]]

      Équipe B : [[teamb]]
  slots:
    - id: teama
      options:
        - { id: sync, text: "Users can synchronize workspace items with their Git repositories" }
        - { id: github, text: "Users can sync workspace items with GitHub repositories" }
        - { id: geo, text: "Users can export items to Git repositories in other geographical locations" }
        - { id: labels, text: "Users can export workspace items with applied sensitivity labels to Git repositories" }
    - id: teamb
      options:
        - { id: sync, text: "Users can synchronize workspace items with their Git repositories" }
        - { id: github, text: "Users can sync workspace items with GitHub repositories" }
        - { id: geo, text: "Users can export items to Git repositories in other geographical locations" }
        - { id: labels, text: "Users can export workspace items with applied sensitivity labels to Git repositories" }
answer:
  values: { teama: github, teamb: geo }
explanation:
  correct:
    en: Users can synchronize workspace items with their Git repositories is enabled by default, but the GitHub setting is disabled by default and must be enabled for Team A. When the workspace and the Azure repository are in different regions, a tenant admin must enable the cross-geo export setting; only item metadata is exported, and GitHub doesn't enforce this switch.
    fr: Users can synchronize workspace items with their Git repositories est activé par défaut, mais le paramètre GitHub est désactivé par défaut et doit être activé pour l'équipe A. Quand l'espace de travail et le dépôt Azure se trouvent dans des régions différentes, un administrateur du locataire doit activer le paramètre d'exportation entre zones géographiques ; seules les métadonnées des éléments sont exportées, et GitHub n'applique pas ce paramètre.
  options:
    sync:
      en: This setting is already enabled by default; it doesn't cover GitHub or cross-geo export on its own.
      fr: Ce paramètre est déjà activé par défaut ; il ne couvre pas à lui seul GitHub ni l'exportation entre zones géographiques.
    labels:
      en: This setting allows exporting items that carry sensitivity labels (without the labels); neither team needs it.
      fr: Ce paramètre autorise l'exportation d'éléments porteurs d'étiquettes de confidentialité (sans les étiquettes) ; aucune des deux équipes n'en a besoin.
references:
  - title: Git integration tenant settings
    url: https://learn.microsoft.com/en-us/fabric/admin/git-integration-admin-settings
