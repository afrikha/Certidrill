id: dp700-1a-spark-starter-default
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Analytics**. A workspace admin previously set **Default pool for workspace** to a custom Spark pool named **Pool-Medium**. No notebook selects another pool or environment.

    Data engineers complain that their interactive notebook sessions take several minutes to start. You need to minimize session start time for these notebooks. The notebooks don't need specific node sizes.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Analytics**. Un administrateur de l'espace de travail a défini précédemment **Default pool for workspace** sur un pool Spark personnalisé nommé **Pool-Medium**. Aucun notebook ne choisit un autre pool ni un autre environnement.

    Les ingénieurs de données se plaignent que le démarrage de leurs sessions de notebook interactives prend plusieurs minutes. Vous devez réduire au minimum le temps de démarrage des sessions de ces notebooks. Les notebooks n'ont pas besoin de tailles de nœuds particulières.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set Default pool for workspace to the starter pool", fr: "Définir Default pool for workspace sur le pool de démarrage (Starter pool)" } }
    - { id: b, text: { en: "Turn on Dynamically allocate executors for Pool-Medium", fr: "Activer Dynamically allocate executors pour Pool-Medium" } }
    - { id: c, text: { en: "Turn on Reserve maximum cores for active Spark jobs", fr: "Activer Reserve maximum cores for active Spark jobs" } }
    - { id: d, text: { en: "Increase the maximum node count of Pool-Medium", fr: "Augmenter le nombre maximal de nœuds de Pool-Medium" } }
answer: { optionId: a }
explanation:
  correct:
    en: The starter pool uses prehydrated live clusters, so sessions usually start in a few seconds. A custom pool provisions its nodes on demand, which can take about three minutes. Because the notebooks don't need specific node sizes, making the starter pool the workspace default is the simplest fix.
    fr: Le pool de démarrage utilise des clusters actifs préhydratés, de sorte que les sessions démarrent en général en quelques secondes. Un pool personnalisé provisionne ses nœuds à la demande, ce qui peut prendre environ trois minutes. Comme les notebooks n'ont pas besoin de tailles de nœuds particulières, faire du pool de démarrage le pool par défaut de l'espace de travail est la solution la plus simple.
  options:
    b:
      en: Dynamic allocation changes the number of executors during a job; it doesn't remove the time needed to provision the nodes of a custom pool.
      fr: L'allocation dynamique modifie le nombre d'exécuteurs pendant un travail ; elle ne supprime pas le temps de provisionnement des nœuds d'un pool personnalisé.
    c:
      en: Reserving maximum cores changes how jobs are admitted on the capacity; it doesn't make sessions start faster.
      fr: Réserver les cœurs maximaux modifie l'admission des travaux sur la capacité ; cela n'accélère pas le démarrage des sessions.
    d:
      en: More nodes let jobs scale further, but each session still waits for the custom pool's nodes to be provisioned.
      fr: Davantage de nœuds permettent aux travaux de monter davantage en charge, mais chaque session attend toujours le provisionnement des nœuds du pool personnalisé.
references:
  - title: Workspace administration settings in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
  - title: Configure and manage starter pools in Fabric Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-starter-pools
