id: dp700-sr1-feature-isolation-1
objective: "1.2.1"
type: series_yesno
series: dp700-sr1-feature-isolation
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: Ana edits the items in WS-Dev and commits only those two items.
  fr: Ana modifie les éléments dans WS-Dev et ne valide (commit) que ces deux éléments.
body:
  solution:
    en: |
      Ana edits Notebook1 and Pipeline1 directly in WS-Dev. When she's done, she opens the **Source control** pane of WS-Dev, selects only Notebook1 and Pipeline1, and commits them with a comment that describes the change.
    fr: |
      Ana modifie Notebook1 et Pipeline1 directement dans WS-Dev. Lorsqu'elle a terminé, elle ouvre le volet **Source control** de WS-Dev, sélectionne uniquement Notebook1 et Pipeline1, et les valide (commit) avec un commentaire qui décrit la modification.
answer: { value: false }
explanation:
  correct:
    en: |
      A workspace is a shared runtime environment: changes saved in WS-Dev are immediately visible to the other engineers, before any review. Committing from WS-Dev writes the changes straight to the dev branch, the branch the workspace is connected to, without a pull request. Selecting items limits what is committed, not who sees the changes.
    fr: |
      Un espace de travail est un environnement d'exécution partagé : les modifications enregistrées dans WS-Dev sont immédiatement visibles des autres ingénieurs, avant toute revue. La validation (commit) depuis WS-Dev écrit les modifications directement dans la branche dev, celle à laquelle l'espace de travail est connecté, sans demande de tirage. Sélectionner des éléments limite ce qui est validé, pas qui voit les modifications.
references:
  - title: Development process in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/manage-branches
