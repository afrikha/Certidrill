id: dp700-1c-label-inherit-creation
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named Lakehouse1. Lakehouse1 has the Confidential sensitivity label. No default label is configured for the tenant or for the domain of Workspace1.

    You create the following items:

    - A notebook created from the Lakehouse1 page
    - A pipeline created from the Lakehouse1 page
    - A warehouse created from the Workspace1 page
    - An eventhouse created from the Workspace1 page
    - An environment created from the Workspace1 page

    Which two items get the Confidential label when they're created?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé Lakehouse1. Lakehouse1 porte l'étiquette de confidentialité Confidential. Aucune étiquette par défaut n'est configurée pour le locataire ni pour le domaine de Workspace1.

    Vous créez les éléments suivants :

    - Un notebook créé depuis la page de Lakehouse1
    - Un pipeline créé depuis la page de Lakehouse1
    - Un entrepôt créé depuis la page de Workspace1
    - Un eventhouse créé depuis la page de Workspace1
    - Un environnement créé depuis la page de Workspace1

    Quels sont les deux éléments qui reçoivent l'étiquette Confidential à leur création ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: nb, text: { en: "The notebook", fr: "Le notebook" } }
    - { id: pl, text: { en: "The pipeline", fr: "Le pipeline" } }
    - { id: wh, text: { en: "The warehouse", fr: "L'entrepôt" } }
    - { id: eh, text: { en: "The eventhouse", fr: "L'eventhouse" } }
    - { id: env, text: { en: "The environment", fr: "L'environnement" } }
answer: { optionIds: [ nb, pl ] }
explanation:
  correct:
    en: |
      With inheritance upon creation, an item created from another item takes its label: a notebook, a pipeline or a shortcut created from a lakehouse inherits the lakehouse label. Items created from the workspace have no parent item, so without a default label they start unlabeled.
    fr: |
      Avec l'héritage à la création, un élément créé à partir d'un autre élément prend son étiquette : un notebook, un pipeline ou un raccourci créé à partir d'un lakehouse hérite de l'étiquette du lakehouse. Les éléments créés depuis l'espace de travail n'ont pas d'élément parent : sans étiquette par défaut, ils démarrent sans étiquette.
  options:
    wh: { en: "The warehouse isn't created from Lakehouse1, so nothing is inherited, and no default label exists.", fr: "L'entrepôt n'est pas créé à partir de Lakehouse1 : rien n'est hérité, et aucune étiquette par défaut n'existe." }
    eh: { en: "The eventhouse has no parent item to inherit from, and no default label exists.", fr: "L'eventhouse n'a aucun élément parent dont hériter, et aucune étiquette par défaut n'existe." }
    env: { en: "The environment has no parent item to inherit from, and no default label exists.", fr: "L'environnement n'a aucun élément parent dont hériter, et aucune étiquette par défaut n'existe." }
references:
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
