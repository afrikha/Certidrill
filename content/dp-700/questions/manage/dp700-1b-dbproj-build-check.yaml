id: dp700-1b-dbproj-build-check
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Dev that contains a SQL database named SQL_Sales. You manage the schema of SQL_Sales by using an SDK-style SQL database project in Visual Studio Code.

    A developer renames a column of dbo.DimCustomer in the project. A view in the project still references the old column name.

    You need to detect the broken reference on the developer's computer, without connecting to SQL_Sales.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Dev qui contient une base de données SQL nommée SQL_Sales. Vous gérez le schéma de SQL_Sales avec un projet de base de données SQL de style SDK dans Visual Studio Code.

    Un développeur renomme une colonne de dbo.DimCustomer dans le projet. Une vue du projet référence toujours l'ancien nom de colonne.

    Vous devez détecter la référence rompue sur l'ordinateur du développeur, sans vous connecter à SQL_Sales.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Publish the project to SQL_Sales and select Generate Script.", fr: "Publier le projet sur SQL_Sales et sélectionner Generate Script." } }
    - { id: b, text: { en: "Commit the project to the Azure DevOps repository.", fr: "Valider le projet dans le dépôt Azure DevOps." } }
    - { id: c, text: { en: "Build the database project.", fr: "Générer (Build) le projet de base de données." } }
    - { id: d, text: { en: "Run Create Project From Database against SQL_Sales.", fr: "Exécuter Create Project From Database sur SQL_Sales." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Building a database project validates the T-SQL of every object and the references between them, locally, and produces a .dacpac file only if there are no errors. A view that references a column that no longer exists in the project fails the build, so the developer finds the problem before anything is deployed.
    fr: |
      La génération (Build) d'un projet de base de données valide localement le T-SQL de chaque objet et les références entre objets, et ne produit un fichier .dacpac qu'en l'absence d'erreur. Une vue qui référence une colonne qui n'existe plus dans le projet fait échouer la génération : le développeur détecte le problème avant tout déploiement.
  options:
    a: { en: "Generate Script needs a connection to the target database, which the requirement excludes.", fr: "Generate Script nécessite une connexion à la base de données cible, ce que l'exigence exclut." }
    b: { en: "A commit stores the files in Git; it doesn't validate the references between objects.", fr: "Une validation (commit) stocke les fichiers dans Git ; elle ne vérifie pas les références entre objets." }
    d: { en: "Create Project From Database connects to SQL_Sales and creates a new project from its current schema; it doesn't check the edited project.", fr: "Create Project From Database se connecte à SQL_Sales et crée un nouveau projet à partir de son schéma actuel ; il ne vérifie pas le projet modifié." }
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
