id: dp700-1d-join-aggregate-items
objective: "1.4.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Silver. LH_Silver contains tables named Orders, OrderLines and Products.

    Every morning, you must join the three tables, aggregate the sales by product category and day, and write the result to a new table in LH_Silver. The team includes Power Query users and PySpark developers.

    Which two items can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Silver. LH_Silver contient des tables nommées Orders, OrderLines et Products.

    Chaque matin, vous devez joindre les trois tables, agréger les ventes par catégorie de produits et par jour, et écrire le résultat dans une nouvelle table de LH_Silver. L'équipe compte des utilisateurs de Power Query et des développeurs PySpark.

    Quels sont les deux éléments que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A copy job with Overwrite as the update method", fr: "Un travail de copie avec Overwrite comme méthode de mise à jour" } }
    - { id: b, text: { en: "A Dataflow Gen2 with LH_Silver as the data destination", fr: "Un Dataflow Gen2 avec LH_Silver comme destination de données" } }
    - { id: c, text: { en: "A pipeline with a Copy data activity that maps the columns", fr: "Un pipeline avec une activité Copy data qui mappe les colonnes" } }
    - { id: d, text: { en: "An eventstream with LH_Silver as the destination", fr: "Un flux d'événements avec LH_Silver comme destination" } }
    - { id: e, text: { en: "A notebook that uses PySpark DataFrames", fr: "Un notebook qui utilise des DataFrames PySpark" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      Joins and aggregations need medium to complex transformations. Dataflow Gen2 provides more than 300 Power Query transformation functions, including Merge queries and Group by, and writes to a lakehouse destination. A notebook performs the same joins and aggregations with Spark code. Both can be scheduled.
    fr: |
      Les jointures et agrégations exigent des transformations moyennes à complexes. Dataflow Gen2 fournit plus de 300 fonctions de transformation Power Query, dont Fusionner des requêtes et Regrouper par, et écrit dans une destination lakehouse. Un notebook effectue les mêmes jointures et agrégations avec du code Spark. Les deux peuvent être planifiés.
  options:
    a: { en: "A copy job supports only lightweight transformations such as type conversion and column mapping; it cannot join tables or aggregate rows.", fr: "Un travail de copie ne prend en charge que des transformations légères comme la conversion de type et le mappage de colonnes ; il ne peut ni joindre des tables ni agréger des lignes." }
    c: { en: "The Copy data activity performs lightweight transformations only; joins and aggregations are outside its scope.", fr: "L'activité Copy data n'effectue que des transformations légères ; les jointures et agrégations sortent de son périmètre." }
    d: { en: "An eventstream ingests and routes event data in real time; it does not read lakehouse tables on a schedule.", fr: "Un flux d'événements ingère et route des données d'événements en temps réel ; il ne lit pas des tables de lakehouse selon une planification." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
