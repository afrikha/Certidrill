id: dp700-1d-blob-trigger-steps
objective: "1.4.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Invoices. Suppliers upload PDF and CSV files to a container named invoices in an Azure Storage account named stproseware.

    You need PL_Invoices to start each time a CSV file is created in the invoices container.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Invoices. Des fournisseurs chargent des fichiers PDF et CSV dans un conteneur nommé invoices d'un compte Stockage Azure nommé stproseware.

    PL_Invoices doit démarrer chaque fois qu'un fichier CSV est créé dans le conteneur invoices.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: trigger, text: { en: "On the Home tab of PL_Invoices, select Trigger.", fr: "Dans l'onglet Accueil de PL_Invoices, sélectionner Déclencheur." } }
    - { id: source, text: { en: "Select Azure Blob Storage events as the source, and then select the subscription and stproseware.", fr: "Sélectionner les événements Stockage Blob Azure comme source, puis sélectionner l'abonnement et stproseware." } }
    - { id: filter, text: { en: "Select the Microsoft.Storage.BlobCreated event type, and filter the Subject field on the invoices container and the .csv extension.", fr: "Sélectionner le type d'événement Microsoft.Storage.BlobCreated, et filtrer le champ Subject sur le conteneur invoices et l'extension .csv." } }
    - { id: create, text: { en: "Select the workspace for the trigger items, name the Reflex item, and select Create.", fr: "Sélectionner l'espace de travail des éléments du déclencheur, nommer l'élément Reflex et sélectionner Créer." } }
    - { id: shortcut, text: { en: "Create a OneLake shortcut to the invoices container in a lakehouse.", fr: "Créer un raccourci OneLake vers le conteneur invoices dans un lakehouse." } }
    - { id: schedule, text: { en: "Add a minute-based schedule to PL_Invoices that runs every minute.", fr: "Ajouter à PL_Invoices une planification par minute qui s'exécute toutes les minutes." } }
answer:
  sequence: [ trigger, source, filter, create ]
explanation:
  correct:
    en: |
      You start from the Trigger button of the pipeline, which opens the Set alert panel. You select Azure Blob Storage events and the storage account, then the event types and a Subject filter that limits the trigger to the container and the file extension. Finally, you select where the trigger items are stored, name the Reflex item and create the trigger, which also creates an eventstream in the workspace.
    fr: |
      Vous partez du bouton Déclencheur du pipeline, qui ouvre le volet Set alert. Vous sélectionnez les événements Stockage Blob Azure et le compte de stockage, puis les types d'événements et un filtre sur le champ Subject qui limite le déclencheur au conteneur et à l'extension de fichier. Enfin, vous sélectionnez où sont stockés les éléments du déclencheur, nommez l'élément Reflex et créez le déclencheur, ce qui crée aussi un flux d'événements dans l'espace de travail.
  options:
    shortcut: { en: "The trigger subscribes to the events of the storage account directly; no shortcut is needed.", fr: "Le déclencheur s'abonne directement aux événements du compte de stockage ; aucun raccourci n'est nécessaire." }
    schedule: { en: "A schedule polls instead of reacting to the file creation event, and it is not part of an event trigger.", fr: "Une planification interroge périodiquement au lieu de réagir à l'événement de création de fichier, et elle ne fait pas partie d'un déclencheur d'événement." }
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-storage-event-triggers
