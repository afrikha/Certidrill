id: dp700-1c-audit-tenant-setting
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your organization uses Microsoft Fabric. Last month, someone changed a Fabric tenant setting, and several workspaces lost the ability to create items.

    You have the Audit Logs role. You need to identify who changed the tenant setting and when.

    What should you use?
  fr: |
    Votre organisation utilise Microsoft Fabric. Le mois dernier, quelqu'un a modifié un paramètre de locataire Fabric, et plusieurs espaces de travail ont perdu la possibilité de créer des éléments.

    Vous avez le rôle Audit Logs. Vous devez identifier qui a modifié le paramètre de locataire, et quand.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Monitoring hub in Fabric", fr: "Le hub de surveillance (Monitoring hub) de Fabric" } }
    - { id: b, text: { en: "Audit search in the Microsoft Purview portal", fr: "La recherche d'audit dans le portail Microsoft Purview" } }
    - { id: c, text: { en: "OneLake diagnostics in the workspace settings", fr: "Les diagnostics OneLake dans les paramètres de l'espace de travail" } }
    - { id: d, text: { en: "The Microsoft Fabric Capacity Metrics app", fr: "L'application Microsoft Fabric Capacity Metrics" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Fabric user and admin activities, including tenant setting changes (the UpdatedAdminFeatureSwitch operation), are recorded in the Microsoft Purview unified audit log. Users who have the Audit Logs role search it in the Microsoft Purview portal and filter by date range, activity and user.
    fr: |
      Les activités des utilisateurs et des administrateurs Fabric, y compris les modifications de paramètres de locataire (opération UpdatedAdminFeatureSwitch), sont enregistrées dans le journal d'audit unifié Microsoft Purview. Les utilisateurs qui ont le rôle Audit Logs y effectuent des recherches dans le portail Microsoft Purview, filtrées par plage de dates, activité et utilisateur.
  options:
    a: { en: "The Monitoring hub shows the runs of items such as pipelines and notebooks, not administrative changes.", fr: "Le hub de surveillance affiche les exécutions d'éléments comme les pipelines et les notebooks, pas les modifications d'administration." }
    c: { en: "OneLake diagnostics records data access in OneLake for one workspace, not tenant setting changes.", fr: "Les diagnostics OneLake enregistrent l'accès aux données dans OneLake pour un espace de travail, pas les modifications des paramètres du locataire." }
    d: { en: "The Capacity Metrics app reports capacity consumption, not who changed settings.", fr: "L'application Capacity Metrics présente la consommation de capacité, pas qui a modifié des paramètres." }
references:
  - title: Track user activities in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/admin/track-user-activities
  - title: Operation list
    url: https://learn.microsoft.com/en-us/fabric/admin/operation-list
