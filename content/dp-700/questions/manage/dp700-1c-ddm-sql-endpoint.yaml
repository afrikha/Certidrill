id: dp700-1c-ddm-sql-endpoint
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named Lakehouse1. Lakehouse1 contains a Delta table named dbo.Members that has a column named Email. The SQL analytics endpoint of Lakehouse1 uses delegated identity access mode.

    Report developers have the Viewer role and query dbo.Members through the SQL analytics endpoint. The Email column must stay in their result sets, but they must see only an obfuscated form of each address. Users who have the UNMASK permission must see the real addresses.

    What should you use?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé Lakehouse1. Lakehouse1 contient une table Delta nommée dbo.Members qui comporte une colonne nommée Email. Le point de terminaison d'analytique SQL de Lakehouse1 utilise le mode d'accès avec identité déléguée (Delegated identity access mode).

    Les développeurs de rapports ont le rôle Viewer et interrogent dbo.Members par le point de terminaison d'analytique SQL. La colonne Email doit rester dans leurs jeux de résultats, mais ils ne doivent voir qu'une forme masquée de chaque adresse. Les utilisateurs qui ont l'autorisation UNMASK doivent voir les vraies adresses.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A OneLake security role that hides the Email column", fr: "Un rôle de sécurité OneLake qui masque la colonne Email" } }
    - { id: b, text: { en: "A GRANT SELECT statement that lists every column except Email", fr: "Une instruction GRANT SELECT qui liste toutes les colonnes sauf Email" } }
    - { id: c, text: { en: "A dynamic data mask on Email in the SQL analytics endpoint", fr: "Un masque dynamique sur Email dans le point de terminaison d'analytique SQL" } }
    - { id: d, text: { en: "A Microsoft Purview protection policy on the lakehouse label", fr: "Une stratégie de protection Microsoft Purview sur l'étiquette du lakehouse" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Dynamic data masking is supported on the SQL analytics endpoint as well as on warehouses. It keeps the column in the results, shows an obfuscated value to users without UNMASK, and shows real values to users who have it.
    fr: |
      Le masquage dynamique des données est pris en charge sur le point de terminaison d'analytique SQL comme sur les entrepôts. Il garde la colonne dans les résultats, affiche une valeur masquée aux utilisateurs sans UNMASK et les vraies valeurs à ceux qui l'ont.
  options:
    a: { en: "A OneLake column rule removes access to the column; a query that selects it fails instead of returning an obfuscated value.", fr: "Une règle de colonne OneLake supprime l'accès à la colonne ; une requête qui la sélectionne échoue au lieu de renvoyer une valeur masquée." }
    b: { en: "Column-level security removes the column from what users can read, so Email wouldn't stay in their result sets.", fr: "La sécurité au niveau des colonnes retire la colonne de ce que les utilisateurs peuvent lire : Email ne resterait pas dans leurs résultats." }
    d: { en: "A protection policy allows or blocks access to the whole labeled item; it doesn't obfuscate column values.", fr: "Une stratégie de protection autorise ou bloque l'accès à tout l'élément étiqueté ; elle ne masque pas les valeurs d'une colonne." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
  - title: OneLake security for SQL analytics endpoints
    url: https://learn.microsoft.com/en-us/fabric/onelake/sql-analytics-endpoint-onelake-security
