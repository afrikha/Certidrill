id: dp700-1a-domain-default-existing
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your Fabric tenant contains two domains named **Marketing** and **Sales**. A security group named **G-SalesLeads** contains the users who administer the sales workspaces.

    A user named **Omar** is a member of G-SalesLeads. Omar is the admin of three workspaces:

    - **WS-S1**, assigned to Marketing
    - **WS-S2**, not assigned to any domain
    - **WS-S3**, not assigned to any domain

    A domain admin of Sales adds G-SalesLeads to the **Default domain** setting of Sales. Next week, Omar creates a workspace named **WS-S4**.

    Which workspaces will be assigned to Sales?
  fr: |
    Votre locataire Fabric contient deux domaines nommés **Marketing** et **Sales**. Un groupe de sécurité nommé **G-SalesLeads** contient les utilisateurs qui administrent les espaces de travail commerciaux.

    Un utilisateur nommé **Omar** est membre de G-SalesLeads. Omar est administrateur de trois espaces de travail :

    - **WS-S1**, attribué à Marketing
    - **WS-S2**, attribué à aucun domaine
    - **WS-S3**, attribué à aucun domaine

    Un administrateur du domaine Sales ajoute G-SalesLeads au paramètre **Default domain** de Sales. La semaine suivante, Omar crée un espace de travail nommé **WS-S4**.

    Quels espaces de travail seront attribués à Sales ?
body:
  options:
    - { id: b, text: { en: "WS-S2, WS-S3 and WS-S4 only", fr: "WS-S2, WS-S3 et WS-S4 uniquement" } }
    - { id: a, text: { en: "WS-S2 and WS-S3 only", fr: "WS-S2 et WS-S3 uniquement" } }
    - { id: c, text: { en: "WS-S1, WS-S2, WS-S3 and WS-S4", fr: "WS-S1, WS-S2, WS-S3 et WS-S4" } }
    - { id: d, text: { en: "WS-S4 only", fr: "WS-S4 uniquement" } }
answer: { optionId: b }
explanation:
  correct:
    en: When a default domain is set, Fabric assigns the unassigned workspaces whose admin is one of the specified users or group members, but it preserves an existing assignment such as WS-S1 in Marketing. From then on, every workspace that a specified user creates, such as WS-S4, is assigned to the default domain.
    fr: Quand un domaine par défaut est défini, Fabric attribue les espaces de travail non attribués dont l'administrateur fait partie des utilisateurs ou des membres de groupe indiqués, mais il conserve une attribution existante comme celle de WS-S1 à Marketing. Ensuite, chaque espace de travail créé par un utilisateur indiqué, comme WS-S4, est attribué au domaine par défaut.
  options:
    a:
      en: Unlike assignment by workspace admin, the default domain also applies to workspaces that the specified users create later, so WS-S4 joins Sales.
      fr: "Contrairement à l'attribution par administrateur d'espace de travail, le domaine par défaut s'applique aussi aux espaces de travail que les utilisateurs indiqués créent ensuite : WS-S4 rejoint donc Sales."
    c:
      en: The default domain doesn't override a current assignment, so WS-S1 stays in Marketing.
      fr: "Le domaine par défaut ne remplace pas une attribution existante : WS-S1 reste donc dans Marketing."
    d:
      en: The default domain also picks up the existing unassigned workspaces of the specified users, not only new ones.
      fr: Le domaine par défaut prend aussi les espaces de travail existants non attribués des utilisateurs indiqués, pas seulement les nouveaux.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
