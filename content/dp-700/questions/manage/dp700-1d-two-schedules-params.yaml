id: dp700-1d-two-schedules-params
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Load. PL_Load has a String parameter named LoadType that has no default value. PL_Load has no schedule.

    You need PL_Load to run as follows:

    - Monday to Friday at 06:00, with LoadType set to incremental
    - Saturday at 12:00, with LoadType set to full

    The solution must use only PL_Load and must not change its activities.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Load. PL_Load a un paramètre String nommé LoadType sans valeur par défaut. PL_Load n'a aucune planification.

    PL_Load doit s'exécuter comme suit :

    - du lundi au vendredi à 06:00, avec LoadType défini sur incremental
    - le samedi à 12:00, avec LoadType défini sur full

    La solution doit utiliser uniquement PL_Load et ne doit pas modifier ses activités.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a daily schedule at 06:00 and 12:00 that sets LoadType to incremental.", fr: "Ajouter une planification quotidienne à 06:00 et 12:00 qui définit LoadType sur incremental." } }
    - { id: b, text: { en: "Add a weekly schedule on Saturday at 12:00 that sets LoadType to full.", fr: "Ajouter une planification hebdomadaire le samedi à 12:00 qui définit LoadType sur full." } }
    - { id: c, text: { en: "Add a weekly schedule from Monday to Saturday at 06:00 that sets LoadType to incremental.", fr: "Ajouter une planification hebdomadaire du lundi au samedi à 06:00 qui définit LoadType sur incremental." } }
    - { id: d, text: { en: "Add a weekly schedule from Monday to Friday at 06:00 that sets LoadType to incremental.", fr: "Ajouter une planification hebdomadaire du lundi au vendredi à 06:00 qui définit LoadType sur incremental." } }
    - { id: e, text: { en: "Add a minute-based schedule every 360 minutes that sets LoadType to full.", fr: "Ajouter une planification par minute toutes les 360 minutes qui définit LoadType sur full." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      A pipeline accepts several schedules, each with its own recurrence, and each schedule can pass values to the pipeline parameters at run time, provided that the name matches the parameter name exactly. A weekly schedule on the five weekdays at 06:00 passes incremental, and a second weekly schedule on Saturday at 12:00 passes full.
    fr: |
      Un pipeline accepte plusieurs planifications, chacune avec sa propre récurrence, et chaque planification peut transmettre des valeurs aux paramètres du pipeline au moment de l'exécution, à condition que le nom corresponde exactement au nom du paramètre. Une planification hebdomadaire sur les cinq jours de semaine à 06:00 transmet incremental, et une seconde planification hebdomadaire le samedi à 12:00 transmet full.
  options:
    a: { en: "A daily schedule also runs on the weekend and at 12:00 every day, always with incremental.", fr: "Une planification quotidienne s'exécute aussi le week-end et à 12:00 chaque jour, toujours avec incremental." }
    c: { en: "This schedule adds a Saturday run at 06:00 with incremental, which the requirements do not include.", fr: "Cette planification ajoute une exécution le samedi à 06:00 avec incremental, que les exigences ne prévoient pas." }
    e: { en: "A run every 360 minutes runs four times a day, every day, with full.", fr: "Une exécution toutes les 360 minutes a lieu quatre fois par jour, tous les jours, avec full." }
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs
  - title: Job Scheduler in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
