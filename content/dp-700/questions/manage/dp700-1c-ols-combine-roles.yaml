id: dp700-1c-ols-combine-roles
objective: "1.3.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a schema-enabled lakehouse named Lakehouse1 that contains a Delta table named dbo.Sales. Lakehouse1 has the following OneLake security roles:

    | Role | Permission | Data | Rule |
    | --- | --- | --- | --- |
    | RoleEMEA | Read | dbo.Sales | Row rule: Region = 'EMEA' |
    | RoleAPAC | Read | dbo.Sales | Row rule: Region = 'APAC' |
    | RoleLanding | ReadWrite | Files/landing | None |

    User1 has the Viewer role and is a member of RoleEMEA and RoleAPAC. User2 has the Contributor role and is a member of RoleEMEA. Neither user is a member of DefaultReader.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse avec schémas nommé Lakehouse1 qui contient une table Delta nommée dbo.Sales. Lakehouse1 comporte les rôles de sécurité OneLake suivants :

    | Rôle | Autorisation | Données | Règle |
    | --- | --- | --- | --- |
    | RoleEMEA | Read | dbo.Sales | Règle de lignes : Region = 'EMEA' |
    | RoleAPAC | Read | dbo.Sales | Règle de lignes : Region = 'APAC' |
    | RoleLanding | ReadWrite | Files/landing | Aucune |

    User1 a le rôle Viewer et est membre de RoleEMEA et de RoleAPAC. User2 a le rôle Contributor et est membre de RoleEMEA. Aucun des deux n'est membre de DefaultReader.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          In a Spark notebook, User1 sees the rows of dbo.Sales for both EMEA and APAC.
        fr: |
          Dans un notebook Spark, User1 voit les lignes de dbo.Sales pour EMEA et pour APAC.
    - id: s2
      text:
        en: |
          In a Spark notebook, User2 sees only the EMEA rows of dbo.Sales.
        fr: |
          Dans un notebook Spark, User2 ne voit que les lignes EMEA de dbo.Sales.
    - id: s3
      text:
        en: |
          You can add a column security rule to RoleLanding to hide a column of a table stored under Files/landing.
        fr: |
          Vous pouvez ajouter une règle de sécurité des colonnes à RoleLanding pour masquer une colonne d'une table stockée sous Files/landing.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Roles combine as a union: row rules of different roles on the same table are joined with OR, so User1 sees EMEA and APAC rows. OneLake security doesn't restrict Admins, Members or Contributors, so User2 reads every row. Row and column rules are available only in Read roles and only on valid Delta tables under Tables, not in a ReadWrite role on a folder.
    fr: |
      Les rôles se combinent par union : les règles de lignes de rôles différents sur la même table sont reliées par OR, donc User1 voit les lignes EMEA et APAC. La sécurité OneLake ne restreint ni les Admins, ni les Members, ni les Contributors : User2 lit toutes les lignes. Les règles de lignes et de colonnes ne sont disponibles que dans les rôles Read et sur des tables Delta valides sous Tables, pas dans un rôle ReadWrite sur un dossier.
references:
  - title: How OneLake security controls data access
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
  - title: Table, column, and row-level security in OneLake
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/row-level-security
