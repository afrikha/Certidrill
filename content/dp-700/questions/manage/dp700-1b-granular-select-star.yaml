id: dp700-1b-granular-select-star
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a table named dbo.Customers with the columns CustomerID, FirstName, LastName, Email and CreditCard. You ran the following statement:

    `GRANT SELECT ON dbo.Customers (CustomerID, FirstName, LastName, Email) TO [User5];`

    User5 runs `SELECT * FROM dbo.Customers;` and receives an error stating that the SELECT permission was denied on the column CreditCard.

    User5 needs the data of the allowed columns. What should User5 do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée dbo.Customers avec les colonnes CustomerID, FirstName, LastName, Email et CreditCard. Vous avez exécuté l'instruction suivante :

    `GRANT SELECT ON dbo.Customers (CustomerID, FirstName, LastName, Email) TO [User5];`

    User5 exécute `SELECT * FROM dbo.Customers;` et reçoit une erreur indiquant que l'autorisation SELECT a été refusée sur la colonne CreditCard.

    User5 a besoin des données des colonnes autorisées. Que doit faire User5 ?
body:
  options:
    - { id: a, text: { en: "Ask an administrator to grant UNMASK on dbo.Customers.", fr: "Demander à un administrateur d'accorder UNMASK sur dbo.Customers." } }
    - { id: b, text: { en: "Create a view that selects all the columns of dbo.Customers.", fr: "Créer une vue qui sélectionne toutes les colonnes de dbo.Customers." } }
    - { id: c, text: { en: "Replace SELECT * with the list of the allowed columns.", fr: "Remplacer SELECT * par la liste des colonnes autorisées." } }
    - { id: d, text: { en: "Add a WHERE CreditCard IS NULL clause to the query.", fr: "Ajouter une clause WHERE CreditCard IS NULL à la requête." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Column-level security doesn't remove the denied columns from the result; a query that references a column without permission fails, and `SELECT *` references every column. A query that lists only CustomerID, FirstName, LastName and Email succeeds.
    fr: |
      La sécurité au niveau des colonnes ne retire pas les colonnes refusées du résultat ; une requête qui référence une colonne sans autorisation échoue, et `SELECT *` référence toutes les colonnes. Une requête qui liste uniquement CustomerID, FirstName, LastName et Email réussit.
  options:
    a: { en: "UNMASK relates to dynamic data masking; the error comes from a missing column permission.", fr: "UNMASK concerne le masquage dynamique des données ; l'erreur vient d'une autorisation de colonne manquante." }
    b: { en: "User5 has no permission to create views, and a view over CreditCard would expose the column the grant excludes.", fr: "User5 n'a pas l'autorisation de créer des vues, et une vue sur CreditCard exposerait la colonne que l'autorisation exclut." }
    d: { en: "Referencing CreditCard in the WHERE clause also requires SELECT on that column.", fr: "Référencer CreditCard dans la clause WHERE nécessite aussi SELECT sur cette colonne." }
references:
  - title: Column-Level Security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/column-level-security
