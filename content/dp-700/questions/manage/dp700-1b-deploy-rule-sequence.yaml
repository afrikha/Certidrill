id: dp700-1b-deploy-rule-sequence
objective: "1.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline named DP-Supply. Its Development, Test and Production stages are assigned workspaces named WS-Dev, WS-Test and WS-Prod. You are the pipeline admin, an admin of the three workspaces and the owner of every item.

    WS-Dev contains a notebook named NB_Clean whose default lakehouse is LH_Sales. WS-Prod contains a lakehouse named LH_Sales_Prod that holds the production data. NB_Clean has never been deployed.

    You need NB_Clean to run in WS-Prod with LH_Sales_Prod as its default lakehouse.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pipeline de déploiement nommé DP-Supply. Ses phases Development, Test et Production sont affectées aux espaces de travail WS-Dev, WS-Test et WS-Prod. Vous êtes l'administrateur du pipeline, administrateur des trois espaces de travail et propriétaire de tous les éléments.

    WS-Dev contient un notebook nommé NB_Clean dont le lakehouse par défaut est LH_Sales. WS-Prod contient un lakehouse nommé LH_Sales_Prod qui contient les données de production. NB_Clean n'a jamais été déployé.

    NB_Clean doit s'exécuter dans WS-Prod avec LH_Sales_Prod comme lakehouse par défaut.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: d2t, text: { en: "Deploy NB_Clean and LH_Sales from Development to Test.", fr: "Déployer NB_Clean et LH_Sales de Development vers Test." } }
    - { id: t2p, text: { en: "Deploy NB_Clean and LH_Sales from Test to Production.", fr: "Déployer NB_Clean et LH_Sales de Test vers Production." } }
    - { id: rule, text: { en: "In the Production stage, create a default lakehouse rule for NB_Clean that selects LH_Sales_Prod.", fr: "Dans la phase Production, créer une règle de lakehouse par défaut pour NB_Clean qui sélectionne LH_Sales_Prod." } }
    - { id: again, text: { en: "Deploy NB_Clean from Test to Production again.", fr: "Déployer de nouveau NB_Clean de Test vers Production." } }
    - { id: devrule, text: { en: "In the Development stage, create a default lakehouse rule for NB_Clean that selects LH_Sales_Prod.", fr: "Dans la phase Development, créer une règle de lakehouse par défaut pour NB_Clean qui sélectionne LH_Sales_Prod." } }
    - { id: dsrule, text: { en: "In the Production stage, create a data source rule for NB_Clean that selects LH_Sales_Prod.", fr: "Dans la phase Production, créer une règle de source de données pour NB_Clean qui sélectionne LH_Sales_Prod." } }
    - { id: git, text: { en: "Connect WS-Prod to the Git branch of WS-Dev and select Update all.", fr: "Connecter WS-Prod à la branche Git de WS-Dev et sélectionner Update all." } }
answer:
  sequence: [ d2t, t2p, rule, again ]
explanation:
  correct:
    en: |
      A rule is created under an item of the target stage, so NB_Clean must first exist in Production; you deploy it with its lakehouse through Test to Production. Then you create the default lakehouse rule in the Production stage. A rule takes effect only at the next deployment to that stage, so you deploy from Test to Production again.
    fr: |
      Une règle se crée sous un élément de la phase cible : NB_Clean doit donc d'abord exister en production, et vous le déployez avec son lakehouse via Test jusqu'à Production. Vous créez ensuite la règle de lakehouse par défaut dans la phase Production. Une règle ne prend effet qu'au déploiement suivant vers cette phase : vous déployez donc de nouveau de Test vers Production.
  options:
    devrule: { en: "Deployment rules can't be created in the development stage.", fr: "Les règles de déploiement ne peuvent pas être créées dans la phase de développement." }
    dsrule: { en: "Notebooks support only default lakehouse rules, not data source rules.", fr: "Les notebooks ne prennent en charge que les règles de lakehouse par défaut, pas les règles de source de données." }
    git: { en: "Updating WS-Prod from the development branch would bring the development definition back, with LH_Sales as default lakehouse.", fr: "Mettre à jour WS-Prod depuis la branche de développement ramènerait la définition de développement, avec LH_Sales comme lakehouse par défaut." }
references:
  - title: Create deployment rules for Fabric's ALM
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
