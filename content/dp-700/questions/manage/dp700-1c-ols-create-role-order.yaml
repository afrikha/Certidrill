id: dp700-1c-ols-create-role-order
objective: "1.3.8"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a lakehouse named Lakehouse1. You are a Member of the workspace. A security group named Auditors has the Viewer role in the workspace and isn't a member of DefaultReader.

    You need to create a OneLake security role that lets Auditors read only the dbo.Invoices table of Lakehouse1.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un lakehouse nommé Lakehouse1. Vous êtes Member de l'espace de travail. Un groupe de sécurité nommé Auditors a le rôle Viewer dans l'espace de travail et n'est pas membre de DefaultReader.

    Vous devez créer un rôle de sécurité OneLake qui permet à Auditors de lire uniquement la table dbo.Invoices de Lakehouse1.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "Open Lakehouse1 and select Manage OneLake security.", fr: "Ouvrir Lakehouse1 et sélectionner Manage OneLake security." } }
    - { id: new, text: { en: "Select New, enter a role name, and select the Read permission.", fr: "Sélectionner New, saisir un nom de rôle et sélectionner l'autorisation Read." } }
    - { id: data, text: { en: "Select Selected data, check dbo.Invoices, and select Add data.", fr: "Sélectionner Selected data, cocher dbo.Invoices et sélectionner Add data." } }
    - { id: members, text: { en: "Add Auditors as a member, and then select Create.", fr: "Ajouter Auditors comme membre, puis sélectionner Create." } }
    - { id: rw, text: { en: "Select the ReadWrite permission.", fr: "Sélectionner l'autorisation ReadWrite." } }
    - { id: share, text: { en: "Share Lakehouse1 with Auditors and select Read all data using Apache Spark.", fr: "Partager Lakehouse1 avec Auditors en sélectionnant Read all data using Apache Spark." } }
    - { id: all, text: { en: "Select All data.", fr: "Sélectionner All data." } }
answer:
  sequence: [ open, new, data, members ]
explanation:
  correct:
    en: |
      Roles are created from Manage OneLake security in the item menu. You select New, name the role and choose Read, then scope the role to Selected data and pick the table, and finally add the members and create the role. Changes take effect as soon as you save.
    fr: |
      Les rôles se créent depuis Manage OneLake security dans le menu de l'élément. Vous sélectionnez New, nommez le rôle et choisissez Read, puis limitez le rôle à Selected data en choisissant la table, et enfin ajoutez les membres et créez le rôle. Les modifications prennent effet dès l'enregistrement.
  options:
    rw: { en: "Auditors only read data; ReadWrite would let them change it.", fr: "Les auditeurs ne font que lire ; ReadWrite leur permettrait de modifier les données." }
    share: { en: "ReadAll would add Auditors to DefaultReader and give them every table.", fr: "ReadAll ajouterait Auditors à DefaultReader et leur donnerait toutes les tables." }
    all: { en: "All data covers every table and file, not only dbo.Invoices.", fr: "All data couvre toutes les tables et tous les fichiers, pas seulement dbo.Invoices." }
references:
  - title: Create and manage OneLake security roles
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles
