id: dp700-1a-onelake-diag-permissions
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric capacity that hosts two workspaces named **WS-Claims** and **WS-Audit**. WS-Audit contains a lakehouse named **LH_Diag**.

    You need to turn on OneLake diagnostics for WS-Claims and send the events to LH_Diag. You currently have the **Member** role on WS-Claims and the **Viewer** role on WS-Audit. The solution must follow the principle of least privilege.

    Which two role assignments should you request? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une capacité Fabric qui héberge deux espaces de travail nommés **WS-Claims** et **WS-Audit**. WS-Audit contient un lakehouse nommé **LH_Diag**.

    Vous devez activer les diagnostics OneLake pour WS-Claims et envoyer les événements vers LH_Diag. Vous disposez actuellement du rôle **Member** sur WS-Claims et du rôle **Viewer** sur WS-Audit. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux attributions de rôles que vous devez demander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Admin role on WS-Claims", fr: "Le rôle Admin sur WS-Claims" } }
    - { id: b, text: { en: "The Contributor role on WS-Claims", fr: "Le rôle Contributor sur WS-Claims" } }
    - { id: c, text: { en: "The Contributor role on WS-Audit", fr: "Le rôle Contributor sur WS-Audit" } }
    - { id: d, text: { en: "The Admin role on WS-Audit", fr: "Le rôle Admin sur WS-Audit" } }
    - { id: e, text: { en: "The capacity admin role", fr: "Le rôle d'administrateur de capacité" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: To turn on OneLake diagnostics, you must be a workspace admin of the workspace you monitor and a contributor to the destination lakehouse. The Contributor role on WS-Audit gives write access to LH_Diag without the extra rights of Member or Admin.
    fr: Pour activer les diagnostics OneLake, vous devez être administrateur de l'espace de travail surveillé et contributeur du lakehouse de destination. Le rôle Contributor sur WS-Audit donne l'accès en écriture à LH_Diag sans les droits supplémentaires de Member ou d'Admin.
  options:
    b:
      en: Contributor is lower than your current Member role; the monitored workspace requires the Admin role.
      fr: Contributor est inférieur à votre rôle Member actuel ; l'espace de travail surveillé exige le rôle Admin.
    d:
      en: Admin on WS-Audit would work but grants more than the contributor access that the destination lakehouse requires.
      fr: Admin sur WS-Audit fonctionnerait, mais accorde plus que l'accès de contributeur exigé pour le lakehouse de destination.
    e:
      en: Capacity admin rights aren't required; the requirement is about workspace roles on the source and on the destination.
      fr: Les droits d'administrateur de capacité ne sont pas nécessaires ; l'exigence porte sur les rôles d'espace de travail de la source et de la destination.
references:
  - title: OneLake diagnostics
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-diagnostics-overview
