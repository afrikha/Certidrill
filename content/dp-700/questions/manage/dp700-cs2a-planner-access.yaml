id: dp700-cs2a-planner-access
objective: "1.3.2"
type: single
caseStudy: dp700-cs2a-blue-yonder
difficulty: 2
status: draft
stem:
  en: You need to grant MxPlanners access to meet the access requirement. MxPlanners currently has no role in BYA-Fleet. What should you do?
  fr: Vous devez accorder l'accès à MxPlanners pour satisfaire l'exigence d'accès. MxPlanners n'a actuellement aucun rôle dans BYA-Fleet. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share LH-Fleet with MxPlanners and select only the Read all with SQL analytics endpoint permission", fr: "Partager LH-Fleet avec MxPlanners et sélectionner uniquement l'autorisation Read all with SQL analytics endpoint" } }
    - { id: b, text: { en: "Share LH-Fleet with MxPlanners and select only the Read all with Apache Spark permission", fr: "Partager LH-Fleet avec MxPlanners et sélectionner uniquement l'autorisation Read all with Apache Spark" } }
    - { id: c, text: { en: "Assign the Viewer role in BYA-Fleet to MxPlanners", fr: "Attribuer le rôle Viewer dans BYA-Fleet à MxPlanners" } }
    - { id: d, text: { en: "Share LH-Fleet with MxPlanners without selecting any additional permission", fr: "Partager LH-Fleet avec MxPlanners sans sélectionner d'autorisation supplémentaire" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Sharing an item gives access to that item only, not to the rest of the workspace. The Read permission granted by sharing is extended by Read all with SQL analytics endpoint, which lets the users read the tables through T-SQL on the SQL analytics endpoint, for example from SSMS. Without Read all with Apache Spark, they cannot read the data through Spark or the OneLake APIs.
    fr: |
      Le partage d'un élément donne accès à cet élément uniquement, pas au reste de l'espace de travail. L'autorisation Read accordée par le partage est complétée par Read all with SQL analytics endpoint, qui permet de lire les tables en T-SQL via le point de terminaison d'analytique SQL, par exemple depuis SSMS. Sans Read all with Apache Spark, les utilisateurs ne peuvent pas lire les données via Spark ou les API OneLake.
  options:
    b: { en: "Read all with Apache Spark grants exactly the Spark and OneLake API access that the planners must not have.", fr: "Read all with Apache Spark accorde précisément l'accès via Spark et les API OneLake que les planificateurs ne doivent pas avoir." }
    c: { en: "A workspace role applies to all the items of BYA-Fleet, so the planners would see the other items.", fr: "Un rôle d'espace de travail s'applique à tous les éléments de BYA-Fleet : les planificateurs verraient les autres éléments." }
    d: { en: "Read alone lets the planners open the lakehouse, but it does not let them read the table data through the SQL analytics endpoint unless SQL permissions are also granted.", fr: "Read seul permet aux planificateurs d'ouvrir le lakehouse, mais pas de lire les données des tables via le point de terminaison d'analytique SQL, sauf si des autorisations SQL sont aussi accordées." }
references:
  - title: How lakehouse sharing works
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
