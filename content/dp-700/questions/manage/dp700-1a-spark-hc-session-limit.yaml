id: dp700-1a-spark-hc-session-limit
objective: "1.1.1"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You have a Fabric workspace named **WS-Ingest**. The High concurrency setting **For pipeline running multiple notebooks** is on.

    A pipeline named **PL-Daily** runs eight Notebook activities in parallel. All the activities use the session tag `daily`, and the notebooks meet every other condition to share a session. The notebooks use an Environment item named **Env-Ingest**, and no Spark property has been changed from its default value.

    You need to identify how many high concurrency sessions PL-Daily currently creates, and then ensure that the eight notebooks share a single session.

    How should you complete the answer? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Ingest**. Le paramètre de haute concurrence **For pipeline running multiple notebooks** est activé.

    Un pipeline nommé **PL-Daily** exécute huit activités Notebook en parallèle. Toutes les activités utilisent la balise de session `daily`, et les notebooks remplissent toutes les autres conditions pour partager une session. Les notebooks utilisent un élément Environment nommé **Env-Ingest**, et aucune propriété Spark n'a été modifiée par rapport à sa valeur par défaut.

    Vous devez déterminer combien de sessions haute concurrence PL-Daily crée actuellement, puis faire en sorte que les huit notebooks partagent une seule session.

    Comment devez-vous compléter la réponse ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Sessions created today by PL-Daily: [[count]]

      Spark property to set to 8: [[prop]]

      Where to set the property: [[where]]
    fr: |
      Sessions créées aujourd'hui par PL-Daily : [[count]]

      Propriété Spark à définir sur 8 : [[prop]]

      Où définir la propriété : [[where]]
  slots:
    - id: count
      options:
        - { id: one, text: "1" }
        - { id: two, text: "2" }
        - { id: four, text: "4" }
        - { id: eight, text: "8" }
    - id: prop
      options:
        - { id: exec, text: "spark.dynamicAllocation.maxExecutors" }
        - { id: inst, text: "spark.executor.instances" }
        - { id: hc, text: "spark.highConcurrency.max" }
        - { id: sched, text: "spark.scheduler.mode" }
    - id: where
      options:
        - { id: jobs, text: { en: "Jobs section of the workspace Spark settings", fr: "Section Jobs des paramètres Spark de l'espace de travail" } }
        - { id: env, text: { en: "Spark properties of Env-Ingest, then save and publish", fr: "Propriétés Spark d'Env-Ingest, puis enregistrer et publier" } }
        - { id: capacity, text: { en: "Spark Compute settings of the capacity", fr: "Paramètres Spark Compute de la capacité" } }
        - { id: activity, text: { en: "Base parameters of each Notebook activity", fr: "Paramètres de base de chaque activité Notebook" } }
answer:
  values: { count: two, prop: hc, where: env }
explanation:
  correct:
    en: By default, a high concurrency session hosts up to five notebooks with the same session tag; the sixth notebook makes Fabric create a new session, so eight notebooks use two sessions. To change the limit, set spark.highConcurrency.max (2 to 50) in the Spark properties of the environment used by the notebooks and publish it; every notebook and pipeline activity that uses the environment inherits the new limit.
    fr: Par défaut, une session haute concurrence accueille jusqu'à cinq notebooks ayant la même balise de session ; le sixième notebook conduit Fabric à créer une nouvelle session, donc huit notebooks utilisent deux sessions. Pour changer la limite, définissez spark.highConcurrency.max (de 2 à 50) dans les propriétés Spark de l'environnement utilisé par les notebooks et publiez-le ; chaque notebook et chaque activité de pipeline qui utilise l'environnement hérite de la nouvelle limite.
  options:
    one:
      en: One session would require a limit of at least eight notebooks, but the default is five.
      fr: Une seule session exigerait une limite d'au moins huit notebooks, mais la valeur par défaut est cinq.
    eight:
      en: The notebooks share a tag and meet the conditions, so they are packed into shared sessions instead of one session each.
      fr: "Les notebooks partagent une balise et remplissent les conditions : ils sont regroupés dans des sessions partagées au lieu d'avoir chacun la sienne."
    exec:
      en: This property bounds the executors of one Spark application; it doesn't change how many notebooks share a session.
      fr: Cette propriété borne les exécuteurs d'une application Spark ; elle ne change pas le nombre de notebooks qui partagent une session.
    jobs:
      en: The Jobs section holds admission, timeout and job lifetime settings, not the high concurrency limit.
      fr: La section Jobs contient les paramètres d'admission, d'expiration et de durée de vie des travaux, pas la limite de haute concurrence.
    activity:
      en: Base parameters pass values to the notebook code; they don't configure the Spark session.
      fr: Les paramètres de base transmettent des valeurs au code du notebook ; ils ne configurent pas la session Spark.
references:
  - title: High concurrency mode in Apache Spark for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/high-concurrency-overview
  - title: Configure high concurrency mode for Fabric notebooks in pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-high-concurrency-session-notebooks-in-pipelines
