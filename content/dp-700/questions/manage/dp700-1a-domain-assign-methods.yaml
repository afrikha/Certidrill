id: dp700-1a-domain-assign-methods
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are a domain admin of two Fabric domains named **Finance** and **Retail**. You need to assign workspaces to the domains as follows:

    - All existing workspaces whose names start with `FIN-` go to Finance.
    - All workspaces that run today on a capacity named **Cap-Retail** go to Retail.
    - Every workspace that a member of a security group named **G-RetailLeads** creates in the future goes to Retail automatically.

    Which assignment method should you use for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur de deux domaines Fabric nommés **Finance** et **Retail**. Vous devez attribuer des espaces de travail aux domaines comme suit :

    - Tous les espaces de travail existants dont le nom commence par `FIN-` vont dans Finance.
    - Tous les espaces de travail qui s'exécutent aujourd'hui sur une capacité nommée **Cap-Retail** vont dans Retail.
    - Chaque espace de travail qu'un membre d'un groupe de sécurité nommé **G-RetailLeads** créera à l'avenir va automatiquement dans Retail.

    Quelle méthode d'attribution devez-vous utiliser pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      FIN- workspaces: [[fin]]

      Workspaces on Cap-Retail: [[cap]]

      Future workspaces of G-RetailLeads: [[future]]
    fr: |
      Espaces de travail FIN- : [[fin]]

      Espaces de travail sur Cap-Retail : [[cap]]

      Futurs espaces de travail de G-RetailLeads : [[future]]
  slots:
    - id: fin
      options:
        - { id: name, text: { en: "By workspace name", fr: "Par nom d'espace de travail (By workspace name)" } }
        - { id: admin, text: { en: "By workspace admin", fr: "Par administrateur d'espace de travail (By workspace admin)" } }
        - { id: capacity, text: { en: "By capacity", fr: "Par capacité (By capacity)" } }
        - { id: default, text: { en: "Default domain", fr: "Domaine par défaut (Default domain)" } }
    - id: cap
      options:
        - { id: name, text: { en: "By workspace name", fr: "Par nom d'espace de travail (By workspace name)" } }
        - { id: admin, text: { en: "By workspace admin", fr: "Par administrateur d'espace de travail (By workspace admin)" } }
        - { id: capacity, text: { en: "By capacity", fr: "Par capacité (By capacity)" } }
        - { id: default, text: { en: "Default domain", fr: "Domaine par défaut (Default domain)" } }
    - id: future
      options:
        - { id: name, text: { en: "By workspace name", fr: "Par nom d'espace de travail (By workspace name)" } }
        - { id: admin, text: { en: "By workspace admin", fr: "Par administrateur d'espace de travail (By workspace admin)" } }
        - { id: capacity, text: { en: "By capacity", fr: "Par capacité (By capacity)" } }
        - { id: default, text: { en: "Default domain", fr: "Domaine par défaut (Default domain)" } }
answer:
  values: { fin: name, cap: capacity, future: default }
explanation:
  correct:
    en: Assigning by workspace name lets you search for and select several workspaces at once, which suits a naming convention. Assigning by capacity associates all the workspaces that are on the selected capacities when the action runs. Only the default domain also covers workspaces that the specified users or group members create later.
    fr: L'attribution par nom d'espace de travail permet de rechercher et de sélectionner plusieurs espaces de travail à la fois, ce qui convient à une convention de nommage. L'attribution par capacité associe tous les espaces de travail présents sur les capacités sélectionnées au moment de l'action. Seul le domaine par défaut couvre aussi les espaces de travail que les utilisateurs ou les membres de groupe indiqués créeront plus tard.
  options:
    admin:
      en: Assignment by workspace admin covers the workspaces that the chosen users or groups administer today, not workspaces they create afterwards, and it doesn't select workspaces by name or capacity.
      fr: L'attribution par administrateur d'espace de travail couvre les espaces de travail que les utilisateurs ou groupes choisis administrent aujourd'hui, pas ceux qu'ils créeront ensuite, et elle ne sélectionne pas les espaces de travail par nom ni par capacité.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
