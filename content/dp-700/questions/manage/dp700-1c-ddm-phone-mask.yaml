id: dp700-1c-ddm-phone-mask
objective: "1.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a table named dbo.Customer. The Phone column is varchar(12) and stores values in the format 555-010-1234. The column has no mask.

    You need to add a dynamic data mask so that users without the UNMASK permission see only the last four digits of each phone number, preceded by XXX-XXX-.

    How should you complete the T-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée dbo.Customer. La colonne Phone est de type varchar(12) et stocke des valeurs au format 555-010-1234. La colonne n'a aucun masque.

    Vous devez ajouter un masque dynamique pour que les utilisateurs sans autorisation UNMASK ne voient que les quatre derniers chiffres de chaque numéro, précédés de XXX-XXX-.

    Comment devez-vous compléter l'instruction T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE dbo.Customer
    ALTER COLUMN Phone [[verb]] MASKED WITH (FUNCTION = '[[fn]]');
  slots:
    - id: verb
      options:
        - { id: add, text: ADD }
        - { id: set, text: SET }
        - { id: enable, text: ENABLE }
        - { id: alter, text: ALTER }
    - id: fn
      options:
        - { id: suffix, text: "partial(0,\"XXX-XXX-\",4)" }
        - { id: prefix, text: "partial(4,\"XXX-XXX-\",0)" }
        - { id: def, text: "default()" }
        - { id: rnd, text: "random(1000, 9999)" }
answer:
  values: { verb: add, fn: suffix }
explanation:
  correct:
    en: "A mask is added to an existing column with `ALTER TABLE ... ALTER COLUMN ... ADD MASKED WITH (FUNCTION = '...')`. The partial(prefix, padding, suffix) function exposes `prefix` leading and `suffix` trailing characters, so partial(0,\"XXX-XXX-\",4) shows XXX-XXX-1234."
    fr: "Un masque s'ajoute à une colonne existante avec `ALTER TABLE ... ALTER COLUMN ... ADD MASKED WITH (FUNCTION = '...')`. La fonction partial(prefix, padding, suffix) affiche `prefix` caractères au début et `suffix` caractères à la fin : partial(0,\"XXX-XXX-\",4) affiche XXX-XXX-1234."
  options:
    set: { en: "SET isn't valid syntax for masks; the keyword is ADD (and DROP to remove one).", fr: "SET n'est pas une syntaxe valide pour les masques ; le mot clé est ADD (et DROP pour en retirer un)." }
    enable: { en: "There is no ENABLE MASKED clause.", fr: "La clause ENABLE MASKED n'existe pas." }
    alter: { en: "ALTER is already the column clause; the mask itself is added with ADD MASKED.", fr: "ALTER est déjà la clause de colonne ; le masque lui-même s'ajoute avec ADD MASKED." }
    prefix: { en: "This exposes the first four characters (555-) and hides the end of the number.", fr: "Ce masque affiche les quatre premiers caractères (555-) et cache la fin du numéro." }
    def: { en: "default() replaces the whole value with XXXX and exposes no digits.", fr: "default() remplace toute la valeur par XXXX et n'affiche aucun chiffre." }
    rnd: { en: "random() applies only to numeric columns; Phone is varchar.", fr: "random() ne s'applique qu'aux colonnes numériques ; Phone est de type varchar." }
references:
  - title: How to implement dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/howto-dynamic-data-masking
