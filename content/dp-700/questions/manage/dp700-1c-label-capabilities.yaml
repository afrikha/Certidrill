id: dp700-1c-label-capabilities
objective: "1.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Your organization uses sensitivity labels in Fabric. You are a Fabric administrator.

    You need to meet the following requirements:

    - Apply the Confidential label to 400 existing warehouses without opening each warehouse.
    - When the label of a lakehouse named Lakehouse1 changes to Highly Confidential, the Power BI semantic model built on Lakehouse1 must get the same label without user action.

    Which labeling capability meets each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation utilise les étiquettes de confidentialité dans Fabric. Vous êtes administrateur Fabric.

    Vous devez satisfaire les exigences suivantes :

    - Appliquer l'étiquette Confidential à 400 entrepôts existants sans ouvrir chaque entrepôt.
    - Quand l'étiquette d'un lakehouse nommé Lakehouse1 devient Highly Confidential, le modèle sémantique Power BI basé sur Lakehouse1 doit recevoir la même étiquette sans action de l'utilisateur.

    Quelle fonctionnalité d'étiquetage satisfait chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      400 existing warehouses: [[bulk]]
      Semantic model built on Lakehouse1: [[model]]
    fr: |
      400 entrepôts existants : [[bulk]]
      Modèle sémantique basé sur Lakehouse1 : [[model]]
  slots:
    - id: bulk
      options:
        - { id: api, text: { en: "Programmatic labeling with the Power BI admin REST APIs", fr: "Étiquetage par programme avec les API REST d'administration Power BI" } }
        - { id: default, text: { en: "A default label in the label policy", fr: "Une étiquette par défaut dans la stratégie d'étiquettes" } }
        - { id: creation, text: { en: "Inheritance upon creation", fr: "Héritage à la création" } }
        - { id: mandatory, text: { en: "Mandatory labeling", fr: "Étiquetage obligatoire" } }
    - id: model
      options:
        - { id: downstream, text: { en: "Downstream inheritance", fr: "Héritage en aval" } }
        - { id: creation2, text: { en: "Inheritance upon creation", fr: "Héritage à la création" } }
        - { id: programmatic2, text: { en: "Programmatic labeling with the Power BI admin REST APIs", fr: "Étiquetage par programme avec les API REST d'administration Power BI" } }
        - { id: default2, text: { en: "A default label in the label policy", fr: "Une étiquette par défaut dans la stratégie d'étiquettes" } }
answer:
  values: { bulk: api, model: downstream }
explanation:
  correct:
    en: |
      Programmatic labeling through the Power BI admin REST APIs is supported for all Fabric items and labels many existing items in one operation. Downstream inheritance, on by default, propagates a label change to dependent items, including from Fabric items to Power BI items.
    fr: |
      L'étiquetage par programme avec les API REST d'administration Power BI est pris en charge pour tous les éléments Fabric et étiquette de nombreux éléments existants en une opération. L'héritage en aval, activé par défaut, propage un changement d'étiquette aux éléments dépendants, y compris des éléments Fabric vers les éléments Power BI.
  options:
    default: { en: "A default label applies only to items that are created, or updated while unlabeled.", fr: "Une étiquette par défaut ne s'applique qu'aux éléments créés, ou mis à jour alors qu'ils n'ont pas d'étiquette." }
    creation: { en: "Inheritance upon creation only applies when a new item is created from a labeled item.", fr: "L'héritage à la création ne s'applique que quand un nouvel élément est créé à partir d'un élément étiqueté." }
    mandatory: { en: "Mandatory labeling asks users to choose a label; it labels nothing in bulk.", fr: "L'étiquetage obligatoire demande aux utilisateurs de choisir une étiquette ; il n'étiquette rien en masse." }
    creation2: { en: "The semantic model already exists; inheritance upon creation doesn't react to later label changes.", fr: "Le modèle sémantique existe déjà ; l'héritage à la création ne réagit pas aux changements d'étiquette ultérieurs." }
    programmatic2: { en: "The REST APIs label items only when a script calls them; they would require custom code to run after each label change.", fr: "Les API REST n'étiquettent des éléments que quand un script les appelle ; il faudrait du code personnalisé exécuté après chaque changement d'étiquette." }
references:
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
