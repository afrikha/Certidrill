id: dp700-1b-ws-role-api
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Auto. An application uses a Microsoft Entra service principal named SP-Deploy to create notebooks in WS-Auto and run them through the Fabric REST APIs. SP-Deploy must not manage access to WS-Auto.

    You are a Member of WS-Auto. You need to grant SP-Deploy access by calling the Fabric REST API. The solution must follow the principle of least privilege.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Auto. Une application utilise un principal de service Microsoft Entra nommé SP-Deploy pour créer des notebooks dans WS-Auto et les exécuter via les API REST Fabric. SP-Deploy ne doit pas gérer les accès à WS-Auto.

    Vous êtes Member de WS-Auto. Vous devez accorder l'accès à SP-Deploy en appelant l'API REST Fabric. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    POST https://api.fabric.microsoft.com/v1/workspaces/{workspaceId}/[[ep]]

    {
      "principal": {
        "id": "8eedb1b0-3af8-4b17-8e7e-663e61e12211",
        "type": "[[ptype]]"
      },
      "role": "[[role]]"
    }
  slots:
    - id: ep
      options:
        - { id: roleassign, text: roleAssignments }
        - { id: users, text: users }
        - { id: permissions, text: permissions }
    - id: ptype
      options:
        - { id: user, text: User }
        - { id: group, text: Group }
        - { id: sp, text: ServicePrincipal }
        - { id: tenant, text: EntireTenant }
    - id: role
      options:
        - { id: viewer, text: Viewer }
        - { id: contributor, text: Contributor }
        - { id: member, text: Member }
        - { id: admin, text: Admin }
answer:
  values: { ep: roleassign, ptype: sp, role: contributor }
explanation:
  correct:
    en: "The Add Workspace Role Assignment API is `POST .../workspaces/{workspaceId}/roleAssignments`, with a principal object whose type is `ServicePrincipal` for a service principal or a managed identity. Contributor lets SP-Deploy create notebooks and start runs through the Items and Job Scheduler APIs without managing access. A Member can call this API to add principals with lower permissions."
    fr: "L'API Add Workspace Role Assignment est `POST .../workspaces/{workspaceId}/roleAssignments`, avec un objet principal dont le type est `ServicePrincipal` pour un principal de service ou une identité managée. Contributor permet à SP-Deploy de créer des notebooks et de lancer des exécutions via les API Items et Job Scheduler sans gérer les accès. Un Member peut appeler cette API pour ajouter des principaux disposant d'autorisations inférieures."
  options:
    users: { en: "The Fabric workspace API manages roles through roleAssignments; users isn't an endpoint of it.", fr: "L'API d'espace de travail Fabric gère les rôles via roleAssignments ; users n'en est pas un point de terminaison." }
    user: { en: "User is for Microsoft Entra users, not service principals.", fr: "User est destiné aux utilisateurs Microsoft Entra, pas aux principaux de service." }
    viewer: { en: "A Viewer can't create notebooks or start runs through the APIs.", fr: "Un Viewer ne peut pas créer de notebooks ni lancer d'exécutions via les API." }
    member: { en: "Member could add people to WS-Auto, which SP-Deploy must not do.", fr: "Member pourrait ajouter des personnes à WS-Auto, ce que SP-Deploy ne doit pas faire." }
references:
  - title: Workspaces - Add Workspace Role Assignment
    url: https://learn.microsoft.com/en-us/rest/api/fabric/core/workspaces/add-workspace-role-assignment
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
