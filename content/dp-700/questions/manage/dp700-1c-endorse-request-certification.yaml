id: dp700-1c-endorse-request-certification
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your organization has enabled item certification in Fabric for a security group named DataReviewers and has entered the URL of its certification process in the certification setting.

    You are a Member of a workspace that contains a warehouse named DW_Sales. You aren't a member of DataReviewers. In the endorsement settings of DW_Sales, the Certified option is unavailable.

    You need to get DW_Sales certified by following your organization's process.

    What should you do?
  fr: |
    Votre organisation a activé la certification des éléments dans Fabric pour un groupe de sécurité nommé DataReviewers et a saisi l'URL de son processus de certification dans le paramètre de certification.

    Vous êtes Member d'un espace de travail qui contient un entrepôt nommé DW_Sales. Vous n'êtes pas membre de DataReviewers. Dans les paramètres d'approbation de DW_Sales, l'option Certified est indisponible.

    Vous devez faire certifier DW_Sales en suivant le processus de votre organisation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Promote DW_Sales, which submits it for certification automatically.", fr: "Promouvoir DW_Sales, ce qui le soumet automatiquement à la certification." } }
    - { id: b, text: { en: "Ask a workspace Admin to select Certified for DW_Sales.", fr: "Demander à un Admin de l'espace de travail de sélectionner Certified pour DW_Sales." } }
    - { id: c, text: { en: "Apply a sensitivity label to DW_Sales, and then select Certified.", fr: "Appliquer une étiquette de confidentialité à DW_Sales, puis sélectionner Certified." } }
    - { id: d, text: { en: "Select the How do I get content certified link in the endorsement section.", fr: "Sélectionner le lien How do I get content certified dans la section d'approbation." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When you aren't authorized to certify, the Certified button is unavailable and the endorsement section shows a How do I get content certified link. It opens the documentation URL that the Fabric administrator entered, which describes how to request certification from the authorized reviewers.
    fr: |
      Quand vous n'êtes pas autorisé à certifier, le bouton Certified est indisponible et la section d'approbation affiche un lien How do I get content certified. Il ouvre l'URL de documentation saisie par l'administrateur Fabric, qui décrit comment demander une certification aux réviseurs autorisés.
  options:
    a: { en: "Promotion is a separate badge; it doesn't submit the item for certification.", fr: "La promotion est un badge distinct ; elle ne soumet pas l'élément à la certification." }
    b: { en: "Workspace Admins can certify only if they're in an authorized group; the workspace role doesn't grant certification rights.", fr: "Les Admins d'espace de travail ne peuvent certifier que s'ils font partie d'un groupe autorisé ; le rôle d'espace de travail n'accorde pas de droit de certification." }
    c: { en: "A sensitivity label has no effect on who can certify an item.", fr: "Une étiquette de confidentialité n'a aucun effet sur qui peut certifier un élément." }
references:
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
