id: dp700-1a-git-conflict-keep
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Dev** that is connected to the **main** branch of a GitHub repository. You changed a notebook named **NB_Pricing** in WS-Dev.

    A colleague committed another version of NB_Pricing to main, together with changes to five other items. The Git status of NB_Pricing is now **Conflict**.

    You need to keep your workspace version of NB_Pricing, make it the version in main, and get the colleague's changes to the five other items into WS-Dev. Your changes to NB_Pricing must not be lost.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Dev** connecté à la branche **main** d'un dépôt GitHub. Vous avez modifié un notebook nommé **NB_Pricing** dans WS-Dev.

    Un collègue a fait un commit d'une autre version de NB_Pricing dans main, ainsi que de modifications de cinq autres éléments. L'état Git de NB_Pricing est maintenant **Conflict**.

    Vous devez conserver votre version de NB_Pricing de l'espace de travail, en faire la version de main et récupérer dans WS-Dev les modifications du collègue sur les cinq autres éléments. Vos modifications de NB_Pricing ne doivent pas être perdues.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select Update, choose Accept incoming changes for NB_Pricing, and then commit", fr: "Sélectionner Update, choisir Accept incoming changes pour NB_Pricing, puis faire un commit" } }
    - { id: d, text: { en: "Disconnect WS-Dev, reconnect it to main, and choose to commit the workspace content to Git", fr: "Déconnecter WS-Dev, le reconnecter à main et choisir de commiter le contenu de l'espace de travail dans Git" } }
    - { id: c, text: { en: "Select Undo for NB_Pricing, and then select Update all", fr: "Sélectionner Undo pour NB_Pricing, puis Update all" } }
    - { id: b, text: { en: "Select Update, choose Keep current content for NB_Pricing, and then commit NB_Pricing", fr: "Sélectionner Update, choisir Keep current content pour NB_Pricing, puis faire un commit de NB_Pricing" } }
answer: { optionId: b }
explanation:
  correct:
    en: Selecting Update with a conflict shows Resolve Conflicts, where you choose a version per item. Keep current content keeps the workspace version of NB_Pricing while the update brings in the other items; NB_Pricing then shows Uncommitted changes, and committing it makes your version the latest one in main.
    fr: Sélectionner Update en présence d'un conflit affiche Resolve Conflicts, où vous choisissez une version par élément. Keep current content conserve la version de NB_Pricing de l'espace de travail pendant que la mise à jour apporte les autres éléments ; NB_Pricing affiche ensuite Uncommitted changes, et un commit fait de votre version la plus récente de main.
  options:
    a:
      en: Accept incoming changes overrides the workspace item with the version from Git, so your changes to NB_Pricing are lost.
      fr: "Accept incoming changes remplace l'élément de l'espace de travail par la version de Git : vos modifications de NB_Pricing sont perdues."
    c:
      en: Undo reverts NB_Pricing to its last synced state, so your changes are lost.
      fr: "Undo rétablit NB_Pricing dans son dernier état synchronisé : vos modifications sont perdues."
    d:
      en: Reconnecting and committing overwrites all the items in the branch with the workspace content, so the colleague's changes to the five other items would be lost.
      fr: "Se reconnecter et commiter écrase tous les éléments de la branche avec le contenu de l'espace de travail : les modifications du collègue sur les cinq autres éléments seraient perdues."
references:
  - title: Conflict resolution
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/conflict-resolution
