id: dp700-1a-git-permissions
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Dev** that is connected to the **main** branch of an Azure Repos repository named **repo-fabric**. The branch policy of main allows direct commits. Three users have write permission on all the items of WS-Dev:

    - **Carla**, Contributor, must switch WS-Dev to the branch **release**.
    - **Diego**, Contributor, must branch out to a new workspace.
    - **Elena**, Member, must commit her changes to main.

    You need to grant the minimum permissions. Carla, Diego and Elena already have the Read permission on repo-fabric.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Dev** connecté à la branche **main** d'un dépôt Azure Repos nommé **repo-fabric**. La stratégie de branche de main autorise les commits directs. Trois utilisateurs disposent de l'autorisation d'écriture sur tous les éléments de WS-Dev :

    - **Carla**, Contributor, doit faire passer WS-Dev sur la branche **release**.
    - **Diego**, Contributor, doit faire un branch out vers un nouvel espace de travail.
    - **Elena**, Member, doit faire un commit de ses modifications dans main.

    Vous devez accorder les autorisations minimales. Carla, Diego et Elena disposent déjà de l'autorisation Read sur repo-fabric.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Carla: a workspace admin turns on [[carla]]

      Diego: Git permissions on repo-fabric [[diego]]

      Elena: Git permissions on repo-fabric [[elena]]
    fr: |
      Carla : un administrateur de l'espace de travail active [[carla]]

      Diego : autorisations Git sur repo-fabric [[diego]]

      Elena : autorisations Git sur repo-fabric [[elena]]
  slots:
    - id: carla
      options:
        - { id: branch, text: "Allow users with at least Contributor role to change Git branch" }
        - { id: sync, text: "Users can synchronize workspace items with their Git repositories" }
        - { id: create, text: "Create workspaces" }
        - { id: compute, text: "Customize compute configurations for items" }
    - id: diego
      options:
        - { id: read, text: { en: "Read only", fr: "Read uniquement" } }
        - { id: contribute, text: "Read and Contribute" }
        - { id: createbranch, text: "Read and Create branch" }
        - { id: contribonly, text: { en: "Contribute only", fr: "Contribute uniquement" } }
    - id: elena
      options:
        - { id: read, text: { en: "Read only", fr: "Read uniquement" } }
        - { id: contribute, text: "Read and Contribute" }
        - { id: createbranch, text: "Read and Create branch" }
        - { id: contribonly, text: { en: "Contribute only", fr: "Contribute uniquement" } }
answer:
  values: { carla: branch, diego: createbranch, elena: contribute }
explanation:
  correct:
    en: Only workspace admins can switch the connected branch unless an admin turns on the workspace setting Allow users with at least Contributor role to change Git branch, which requires an active connection and write access to all items. Branching out to another workspace needs Read and Create branch in Git, and committing needs Read and Contribute, with a branch policy that allows direct commits.
    fr: Seuls les administrateurs de l'espace de travail peuvent changer la branche connectée, sauf si un administrateur active le paramètre d'espace de travail Allow users with at least Contributor role to change Git branch, qui exige une connexion active et l'accès en écriture à tous les éléments. Le branch out vers un autre espace de travail demande Read et Create branch dans Git, et le commit demande Read et Contribute, avec une stratégie de branche qui autorise les commits directs.
  options:
    sync:
      en: This tenant setting enables Git integration for the organization; it's on by default and doesn't let Contributors switch branches.
      fr: Ce paramètre du locataire active l'intégration Git pour l'organisation ; il est activé par défaut et ne permet pas aux contributeurs de changer de branche.
    create:
      en: Create workspaces is needed to branch out to a new workspace; it doesn't affect branch switching in an existing workspace.
      fr: Create workspaces est nécessaire pour un branch out vers un nouvel espace de travail ; il n'a pas d'effet sur le changement de branche dans un espace de travail existant.
    read:
      en: Read alone allows connecting, viewing status and updating, but not creating branches or committing.
      fr: Read seul permet de connecter, de voir l'état et de mettre à jour, mais pas de créer des branches ni de faire des commits.
references:
  - title: Basic concepts in Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
