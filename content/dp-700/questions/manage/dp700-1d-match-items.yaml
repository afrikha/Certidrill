id: dp700-1d-match-items
objective: "1.4.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Fabric workspace named Workspace1. Four teams describe the following requirements.

    Which item should each team use? To answer, drag the appropriate items to the correct requirements. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail Fabric nommé Workspace1. Quatre équipes décrivent les exigences suivantes.

    Quel élément chaque équipe doit-elle utiliser ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dataflow, text: Dataflow Gen2 }
    - { id: pipeline, text: { en: "Pipeline", fr: "Pipeline" } }
    - { id: notebook, text: { en: "Notebook", fr: "Notebook" } }
    - { id: copyjob, text: { en: "Copy job", fr: "Travail de copie" } }
    - { id: eventstream, text: { en: "Eventstream", fr: "Flux d'événements" } }
  targets:
    - id: profile
      text: { en: "Business analysts profile column quality and value distribution, then fix data types and remove duplicates, without writing code.", fr: "Des analystes métier profilent la qualité des colonnes et la distribution des valeurs, puis corrigent les types de données et suppriment les doublons, sans écrire de code." }
    - id: poll
      text: { en: "Without writing code, wait until a REST API reports that an export is ready, checking every five minutes, then copy the exported file to a lakehouse.", fr: "Sans écrire de code, attendre qu'une API REST signale qu'un export est prêt, en vérifiant toutes les cinq minutes, puis copier le fichier exporté dans un lakehouse." }
    - id: dedup
      text: { en: "Data engineers read 2 TB of Parquet files, remove duplicates with window functions written in PySpark, and write Delta tables.", fr: "Des ingénieurs données lisent 2 To de fichiers Parquet, suppriment les doublons avec des fonctions de fenêtrage écrites en PySpark et écrivent des tables Delta." }
    - id: events
      text: { en: "Route events from an Azure Event Hubs namespace to an eventhouse as they arrive, without code and without managing extraction schedules.", fr: "Router les événements d'un espace de noms Azure Event Hubs vers un eventhouse dès leur arrivée, sans code et sans gérer de planifications d'extraction." }
answer:
  mapping: { profile: dataflow, poll: pipeline, dedup: notebook, events: eventstream }
explanation:
  correct:
    en: |
      Dataflow Gen2 is the no-code Power Query tool for data wrangling and profiling. A pipeline provides control flow, such as an Until activity that runs a Web activity and a Wait activity, followed by a Copy data activity. A notebook runs PySpark code at scale. An eventstream ingests and routes events in real time without code. A copy job moves data without control flow, so no requirement needs it.
    fr: |
      Dataflow Gen2 est l'outil Power Query sans code pour la préparation et le profilage des données. Un pipeline fournit un flux de contrôle, par exemple une activité Until qui exécute une activité Web et une activité Wait, suivie d'une activité Copy data. Un notebook exécute du code PySpark à grande échelle. Un flux d'événements ingère et route des événements en temps réel sans code. Un travail de copie déplace des données sans flux de contrôle : aucune exigence n'en a besoin.
  options:
    copyjob: { en: "A copy job copies data in full or incremental mode, but it cannot wait for an API status or apply window functions.", fr: "Un travail de copie copie des données en mode complet ou incrémentiel, mais il ne peut ni attendre un statut d'API ni appliquer des fonctions de fenêtrage." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
  - title: Activity overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview
