id: dp700-cs3b-deploy-rule
objective: "1.2.3"
type: dropdown
caseStudy: dp700-cs3b-woodgrove
difficulty: 3
status: draft
stem:
  en: |
    MDB-Claims has been deployed to the Test and Production stages of DP-Claims. You have already configured the Test stage. You are the owner of MDB-Claims in all the stages.

    You need to ensure that MDB-Claims in WS-Claims-Prod replicates from sqldb-claims-prod.

    How should you complete the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    MDB-Claims a été déployée dans les phases Test et Production de DP-Claims. Vous avez déjà configuré la phase Test. Vous êtes le propriétaire de MDB-Claims dans toutes les phases.

    Vous devez faire en sorte que MDB-Claims dans WS-Claims-Prod réplique sqldb-claims-prod.

    Comment devez-vous compléter la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create a [[type]] for MDB-Claims in the [[stage]] stage, and then [[act]].
    fr: |
      Créer une [[type]] pour MDB-Claims dans la phase [[stage]], puis [[act]].
  slots:
    - id: type
      options:
        - { id: datasource, text: { en: "data source rule", fr: "règle de source de données" } }
        - { id: parameter, text: { en: "parameter rule", fr: "règle de paramètre" } }
        - { id: lakehouse, text: { en: "default lakehouse rule", fr: "règle de lakehouse par défaut" } }
    - id: stage
      options:
        - { id: dev, text: Development }
        - { id: test, text: Test }
        - { id: prod, text: Production }
    - id: act
      options:
        - { id: deploy, text: { en: "deploy from the Test stage to the Production stage", fr: "déployer de la phase Test vers la phase Production" } }
        - { id: commit, text: { en: "commit the change to the Azure DevOps repository", fr: "valider la modification dans le dépôt Azure DevOps" } }
        - { id: refresh, text: { en: "restart the replication of MDB-Claims in WS-Claims-Dev", fr: "redémarrer la réplication de MDB-Claims dans WS-Claims-Dev" } }
answer:
  values: { type: datasource, stage: prod, act: deploy }
explanation:
  correct:
    en: |
      Mirrored databases support data source rules, which replace the source with another source of the same type, here an Azure SQL database. A rule is created on the stage that receives the deployment, so the rule goes on the Production stage. Rules take effect only at the next deployment to that stage, so you then deploy from Test to Production.
    fr: |
      Les bases de données mises en miroir prennent en charge les règles de source de données, qui remplacent la source par une autre source du même type, ici une base de données Azure SQL. Une règle se crée sur la phase qui reçoit le déploiement : la règle va donc sur la phase Production. Les règles ne prennent effet qu'au déploiement suivant vers cette phase : vous déployez ensuite de Test vers Production.
  options:
    parameter: { en: "Parameter rules are not supported for mirrored databases.", fr: "Les règles de paramètre ne sont pas prises en charge pour les bases de données mises en miroir." }
    lakehouse: { en: "Default lakehouse rules apply to notebooks, not to mirrored databases.", fr: "Les règles de lakehouse par défaut s'appliquent aux notebooks, pas aux bases de données mises en miroir." }
    dev: { en: "Deployment rules cannot be created in the Development stage.", fr: "Les règles de déploiement ne peuvent pas être créées dans la phase Development." }
    test: { en: "A rule on the Test stage changes the Test copy, not the Production copy.", fr: "Une règle sur la phase Test modifie la copie de Test, pas celle de Production." }
    commit: { en: "Deployment rules are stored in the deployment pipeline, not in Git, and they apply only when you deploy.", fr: "Les règles de déploiement sont stockées dans le pipeline de déploiement, pas dans Git, et ne s'appliquent qu'au déploiement." }
    refresh: { en: "Restarting the replication in Development does not change the source of the Production copy.", fr: "Redémarrer la réplication dans Development ne change pas la source de la copie de Production." }
references:
  - title: Create deployment rules
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/create-rules
