id: dp700-1a-domain-contributor-admin
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant contains a domain named **Sales** and a workspace named **WS-SalesOps** that isn't assigned to any domain. A user named **Ana** is listed as a domain contributor of Sales and has the **Member** role on WS-SalesOps.

    Ana reports that she can't assign WS-SalesOps to the Sales domain from the workspace settings. You need to ensure that Ana can assign the workspace herself. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Votre locataire Fabric contient un domaine nommé **Sales** et un espace de travail nommé **WS-SalesOps** qui n'est attribué à aucun domaine. Une utilisatrice nommée **Ana** figure parmi les contributeurs du domaine Sales et dispose du rôle **Member** sur WS-SalesOps.

    Ana signale qu'elle ne parvient pas à attribuer WS-SalesOps au domaine Sales depuis les paramètres de l'espace de travail. Vous devez faire en sorte qu'Ana puisse attribuer elle-même l'espace de travail. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: b, text: { en: "Assign Ana the Contributor role on WS-SalesOps", fr: "Attribuer à Ana le rôle Contributor sur WS-SalesOps" } }
    - { id: a, text: { en: "Assign Ana the Admin role on WS-SalesOps", fr: "Attribuer à Ana le rôle Admin sur WS-SalesOps" } }
    - { id: c, text: { en: "Add Ana to the Default domain setting of Sales", fr: "Ajouter Ana au paramètre Default domain de Sales" } }
    - { id: d, text: { en: "Make Ana a capacity admin of the capacity that hosts WS-SalesOps", fr: "Faire d'Ana une administratrice de la capacité qui héberge WS-SalesOps" } }
answer: { optionId: a }
explanation:
  correct:
    en: Domain contributors assign workspaces from the workspace's own settings, and only workspaces in which they have the Admin role. Ana is already a domain contributor, so giving her the Admin role on WS-SalesOps is the missing permission.
    fr: "Les contributeurs de domaine attribuent les espaces de travail depuis les paramètres de l'espace de travail lui-même, et uniquement les espaces de travail dont ils ont le rôle Admin. Ana est déjà contributrice du domaine : lui donner le rôle Admin sur WS-SalesOps est l'autorisation qui manque."
  options:
    b:
      en: Contributor is a lower role than Member; a domain contributor needs the Admin role on the workspace.
      fr: Contributor est un rôle inférieur à Member ; un contributeur de domaine a besoin du rôle Admin sur l'espace de travail.
    c:
      en: The default domain assigns workspaces whose admin is one of the listed users; Ana isn't an admin of WS-SalesOps, so nothing would change.
      fr: Le domaine par défaut attribue les espaces de travail dont l'administrateur fait partie des utilisateurs listés ; Ana n'est pas administratrice de WS-SalesOps, donc rien ne changerait.
    d:
      en: Capacity admin rights don't let a user assign workspaces to domains.
      fr: Les droits d'administrateur de capacité ne permettent pas d'attribuer des espaces de travail à des domaines.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
