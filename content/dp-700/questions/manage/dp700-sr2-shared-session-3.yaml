stem:
  en: You select the starter pool as the default pool of the workspace.
  fr: Vous sélectionnez le pool de démarrage comme pool par défaut de l'espace de travail.
body:
  solution:
    en: |
      In the Spark settings of WS-ETL, you select **Starter Pool** as the **Default pool for workspace**.
    fr: |
      Dans les paramètres Spark de WS-ETL, vous sélectionnez **Starter Pool** comme **Default pool for workspace**.
answer: { value: false }
explanation:
  correct:
    en: |
      The starter pool can shorten the start of each session, but every Notebook activity still starts its own session. Only high concurrency mode for pipelines makes several notebooks share one session.
    fr: |
      Le pool de démarrage peut raccourcir le démarrage de chaque session, mais chaque activité Notebook démarre toujours sa propre session. Seul le mode haute concurrence pour les pipelines permet à plusieurs notebooks de partager une session.
references:
  - title: Configure high concurrency mode for Fabric notebooks in pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-high-concurrency-session-notebooks-in-pipelines
