id: dp700-1a-spark-starter-limits
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are an admin of a Fabric workspace named **WS-Dev** that uses the starter pool as its default pool. WS-Dev shares an F64 capacity with production workspaces.

    Notebooks in WS-Dev process small samples, but they sometimes scale out to the default maximum number of nodes and consume capacity that production jobs need. You need to limit the compute that Spark sessions of WS-Dev can use. Session start time must remain as short as possible.

    What should you do?
  fr: |
    Vous êtes administrateur d'un espace de travail Fabric nommé **WS-Dev** qui utilise le pool de démarrage comme pool par défaut. WS-Dev partage une capacité F64 avec des espaces de travail de production.

    Les notebooks de WS-Dev traitent de petits échantillons, mais ils montent parfois jusqu'au nombre maximal de nœuds par défaut et consomment de la capacité dont les travaux de production ont besoin. Vous devez limiter le calcul que les sessions Spark de WS-Dev peuvent utiliser. Le temps de démarrage des sessions doit rester le plus court possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a custom pool with Small nodes and make it the default pool", fr: "Créer un pool personnalisé avec des nœuds Small et en faire le pool par défaut" } }
    - { id: d, text: { en: "Lower the Spark session timeout to 5 minutes", fr: "Réduire Spark session timeout à 5 minutes" } }
    - { id: c, text: { en: "Turn on Reserve maximum cores for active Spark jobs", fr: "Activer Reserve maximum cores for active Spark jobs" } }
    - { id: b, text: { en: "Edit the starter pool details and lower the maximum nodes and executors", fr: "Modifier les détails du pool de démarrage et réduire le nombre maximal de nœuds et d'exécuteurs" } }
answer: { optionId: b }
explanation:
  correct:
    en: A workspace admin can customize the starter pool from Spark settings by selecting the pencil icon in Pool details and lowering the autoscale and executor limits with the sliders. The workspace keeps the prehydrated starter pool, so sessions still start in seconds, but each session can't grow beyond the new limits.
    fr: Un administrateur de l'espace de travail peut personnaliser le pool de démarrage depuis Spark settings en sélectionnant l'icône de crayon dans Pool details et en réduisant les limites de mise à l'échelle automatique et d'exécuteurs avec les curseurs. L'espace de travail conserve le pool de démarrage préhydraté, donc les sessions démarrent toujours en quelques secondes, mais chaque session ne peut pas dépasser les nouvelles limites.
  options:
    a:
      en: A small custom pool limits compute, but sessions on a custom pool can take minutes to start because its nodes are provisioned on demand.
      fr: Un petit pool personnalisé limite le calcul, mais les sessions d'un pool personnalisé peuvent mettre plusieurs minutes à démarrer, car ses nœuds sont provisionnés à la demande.
    c:
      en: Reserving maximum cores makes each job reserve its maximum, which can block more capacity rather than less.
      fr: Réserver les cœurs maximaux oblige chaque travail à réserver son maximum, ce qui peut bloquer davantage de capacité au lieu d'en libérer.
    d:
      en: The session timeout only ends idle sessions; it doesn't limit how many nodes an active session uses.
      fr: L'expiration de session met seulement fin aux sessions inactives ; elle ne limite pas le nombre de nœuds utilisés par une session active.
references:
  - title: Configure and manage starter pools in Fabric Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-starter-pools
