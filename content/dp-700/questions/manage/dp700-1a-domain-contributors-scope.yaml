id: dp700-1a-domain-contributors-scope
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are a domain admin of a Fabric domain named **Legal**. The domain uses the default contributor configuration.

    You need to ensure that only the members of a security group named **G-LegalWsAdmins** can assign the workspaces they administer to Legal from the workspace settings. Tenant admins and domain admins must keep their current permissions.

    How should you configure the domain? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur d'un domaine Fabric nommé **Legal**. Le domaine utilise la configuration par défaut des contributeurs.

    Vous devez faire en sorte que seuls les membres d'un groupe de sécurité nommé **G-LegalWsAdmins** puissent attribuer à Legal, depuis les paramètres de l'espace de travail, les espaces de travail qu'ils administrent. Les administrateurs du locataire et les administrateurs de domaine doivent conserver leurs autorisations actuelles.

    Comment devez-vous configurer le domaine ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Domain settings tab: [[tab]]

      Who can assign workspaces: [[who]]
    fr: |
      Onglet des paramètres du domaine : [[tab]]

      Qui peut attribuer des espaces de travail : [[who]]
  slots:
    - id: tab
      options:
        - { id: admins, text: "Admins" }
        - { id: contributors, text: "Contributors" }
        - { id: default, text: "Default domain" }
        - { id: delegated, text: "Delegated settings" }
    - id: who
      options:
        - { id: everyone, text: { en: "The entire organization", fr: "Toute l'organisation" } }
        - { id: specific, text: { en: "Specific users and groups, with G-LegalWsAdmins added", fr: "Des utilisateurs et groupes spécifiques, avec G-LegalWsAdmins ajouté" } }
        - { id: adminsonly, text: { en: "Only tenant admins and specific domain admins", fr: "Uniquement les administrateurs du locataire et des administrateurs de domaine spécifiques" } }
answer:
  values: { tab: contributors, who: specific }
explanation:
  correct:
    en: Domain contributors are workspace admins who are allowed to assign their workspaces to the domain from the workspace settings. On the Contributors tab, the default is the entire organization; selecting specific users and groups and adding G-LegalWsAdmins restricts the contributors to that group, while Fabric and domain admins can still assign workspaces from the admin portal.
    fr: Les contributeurs de domaine sont des administrateurs d'espaces de travail autorisés à attribuer leurs espaces de travail au domaine depuis les paramètres de l'espace de travail. Dans l'onglet Contributors, la valeur par défaut est toute l'organisation ; sélectionner des utilisateurs et groupes spécifiques et ajouter G-LegalWsAdmins limite les contributeurs à ce groupe, tandis que les administrateurs Fabric et de domaine peuvent toujours attribuer des espaces de travail depuis le portail d'administration.
  options:
    admins:
      en: The Admins tab lists domain admins, who can be named only by a Fabric admin; it doesn't control contributors.
      fr: L'onglet Admins liste les administrateurs de domaine, que seul un administrateur Fabric peut désigner ; il ne contrôle pas les contributeurs.
    default:
      en: The default domain assigns the listed users' workspaces automatically; it doesn't restrict who may assign workspaces.
      fr: Le domaine par défaut attribue automatiquement les espaces de travail des utilisateurs listés ; il ne restreint pas qui peut attribuer des espaces de travail.
    everyone:
      en: The entire organization is the current default, which lets any workspace admin assign workspaces to Legal.
      fr: Toute l'organisation est la valeur par défaut actuelle, qui permet à n'importe quel administrateur d'espace de travail d'attribuer des espaces de travail à Legal.
    adminsonly:
      en: This option removes the ability of workspace admins to assign their own workspaces, including the members of G-LegalWsAdmins.
      fr: Cette option retire aux administrateurs d'espaces de travail la possibilité d'attribuer leurs propres espaces de travail, y compris aux membres de G-LegalWsAdmins.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
