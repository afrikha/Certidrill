id: dp700-1c-audit-view-only-role
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your organization uses Microsoft Fabric and Microsoft Purview. A compliance analyst named User1 must search the audit log every week to review who shared, exported and deleted Fabric items across the tenant.

    User1 must not be able to change any Fabric or Purview configuration. You need to grant User1 the required access. The solution must follow the principle of least privilege.

    What should you assign to User1?
  fr: |
    Votre organisation utilise Microsoft Fabric et Microsoft Purview. Une analyste de conformité nommée User1 doit effectuer chaque semaine une recherche dans le journal d'audit pour vérifier qui a partagé, exporté et supprimé des éléments Fabric dans tout le locataire.

    User1 ne doit pouvoir modifier aucune configuration de Fabric ni de Purview. Vous devez accorder à User1 l'accès requis. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer à User1 ?
body:
  options:
    - { id: a, text: { en: "The Fabric administrator role", fr: "Le rôle d'administrateur Fabric" } }
    - { id: b, text: { en: "The Admin role in every Fabric workspace", fr: "Le rôle Admin dans chaque espace de travail Fabric" } }
    - { id: c, text: { en: "The View-Only Audit Logs role", fr: "Le rôle View-Only Audit Logs" } }
    - { id: d, text: { en: "The Organization Management role group", fr: "Le groupe de rôles Organization Management" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Searching the unified audit log, which contains the Fabric activities, requires the Audit Logs or View-Only Audit Logs role. View-Only Audit Logs gives read-only access to the audit log without any configuration right.
    fr: |
      La recherche dans le journal d'audit unifié, qui contient les activités Fabric, exige le rôle Audit Logs ou View-Only Audit Logs. View-Only Audit Logs donne un accès en lecture seule au journal d'audit, sans aucun droit de configuration.
  options:
    a: { en: "The Fabric administrator role lets User1 change tenant settings, and audit search still needs an audit role.", fr: "Le rôle d'administrateur Fabric permet à User1 de modifier les paramètres du locataire, et la recherche d'audit exige toujours un rôle d'audit." }
    b: { en: "Workspace roles manage items; they don't give access to the tenant audit log.", fr: "Les rôles d'espace de travail gèrent des éléments ; ils ne donnent pas accès au journal d'audit du locataire." }
    d: { en: "Organization Management includes the Audit Logs role but also broad administrative permissions.", fr: "Organization Management inclut le rôle Audit Logs, mais aussi de larges autorisations d'administration." }
references:
  - title: Search the audit log
    url: https://learn.microsoft.com/en-us/purview/audit-search
  - title: Track user activities in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/admin/track-user-activities
