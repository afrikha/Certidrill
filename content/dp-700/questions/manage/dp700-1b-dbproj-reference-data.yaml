id: dp700-1b-dbproj-reference-data
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You manage a Fabric warehouse named DW_Sales by using a database project. The next release adds a table named dbo.Channel to the project.

    After every deployment of the project, dbo.Channel must contain the same six reference rows. The deployment runs many times, and it must never create duplicate rows or fail because the rows already exist.

    How should you complete the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un entrepôt Fabric nommé DW_Sales avec un projet de base de données. La prochaine version ajoute au projet une table nommée dbo.Channel.

    Après chaque déploiement du projet, dbo.Channel doit contenir les six mêmes lignes de référence. Le déploiement s'exécute de nombreuses fois, et il ne doit jamais créer de lignes en double ni échouer parce que les lignes existent déjà.

    Comment devez-vous compléter la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Write the rows as [[stmt]], save the file in [[loc]], and designate it as the [[kind]] script of DW_Sales.
    fr: |
      Écrire les lignes sous la forme [[stmt]], enregistrer le fichier dans [[loc]] et le désigner comme script de [[kind]] de DW_Sales.
  slots:
    - id: stmt
      options:
        - { id: merge, text: { en: "a MERGE statement that inserts missing rows and updates changed ones", fr: "une instruction MERGE qui insère les lignes manquantes et met à jour celles qui ont changé" } }
        - { id: insert, text: { en: "an INSERT statement that adds the six rows", fr: "une instruction INSERT qui ajoute les six lignes" } }
        - { id: ctas, text: { en: "a CREATE TABLE AS SELECT statement that recreates dbo.Channel", fr: "une instruction CREATE TABLE AS SELECT qui recrée dbo.Channel" } }
    - id: loc
      options:
        - { id: shared, text: { en: "the shared queries folder of the warehouse", fr: "le dossier des requêtes partagées de l'entrepôt" } }
        - { id: tables, text: { en: "the dbo/Tables folder, next to Channel.sql", fr: "le dossier dbo/Tables, à côté de Channel.sql" } }
        - { id: bin, text: { en: "the bin/Debug folder, next to the .dacpac file", fr: "le dossier bin/Debug, à côté du fichier .dacpac" } }
    - id: kind
      options:
        - { id: pre, text: { en: "pre-deployment", fr: "prédéploiement" } }
        - { id: post, text: { en: "post-deployment", fr: "post-déploiement" } }
answer:
  values: { stmt: merge, loc: shared, kind: post }
explanation:
  correct:
    en: |
      Scripts run on every deployment, so they must be idempotent; a MERGE inserts the missing rows and updates the changed ones without duplicating anything. Deployment scripts are shared queries of the warehouse, designated in the project. The post-deployment script runs after the schema changes are applied, so dbo.Channel already exists when it runs.
    fr: |
      Les scripts s'exécutent à chaque déploiement : ils doivent donc être idempotents. Un MERGE insère les lignes manquantes et met à jour celles qui ont changé, sans rien dupliquer. Les scripts de déploiement sont des requêtes partagées de l'entrepôt, désignées dans le projet. Le script de post-déploiement s'exécute après l'application des modifications de schéma : dbo.Channel existe donc déjà quand il s'exécute.
  options:
    insert: { en: "An INSERT adds the six rows again at each deployment, which creates duplicates.", fr: "Un INSERT ajoute de nouveau les six lignes à chaque déploiement, ce qui crée des doublons." }
    ctas: { en: "Recreating the table at each deployment conflicts with the table definition managed by the project.", fr: "Recréer la table à chaque déploiement entre en conflit avec la définition de table gérée par le projet." }
    tables: { en: "Files in the object folders are part of the declarative schema model, not deployment scripts.", fr: "Les fichiers des dossiers d'objets font partie du modèle de schéma déclaratif, pas des scripts de déploiement." }
    bin: { en: "bin/Debug holds build output; files there aren't deployed as scripts.", fr: "bin/Debug contient la sortie de génération ; les fichiers qui s'y trouvent ne sont pas déployés comme scripts." }
    pre: { en: "The pre-deployment script runs before the schema changes, when the new dbo.Channel table doesn't exist yet.", fr: "Le script de prédéploiement s'exécute avant les modifications de schéma, quand la nouvelle table dbo.Channel n'existe pas encore." }
references:
  - title: Pre-deployment and post-deployment scripts for Fabric Data Warehouse (Preview)
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/pre-post-deployment-scripts
