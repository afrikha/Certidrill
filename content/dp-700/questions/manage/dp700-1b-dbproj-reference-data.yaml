id: dp700-1b-dbproj-reference-data
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A Fabric workspace named WS-Sales is connected to Git and contains a SQL database named SQL_Sales. A deployment pipeline promotes SQL_Sales to test and production. The next release adds a table named dbo.Channel to the SQL project of SQL_Sales.

    After every update from Git and every deployment, dbo.Channel must contain the same six reference rows. These operations run many times, and it must never create duplicate rows or fail because the rows already exist.

    How should you complete the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un espace de travail Fabric nommé WS-Sales est connecté à Git et contient une base de données SQL nommée SQL_Sales. Un pipeline de déploiement promeut SQL_Sales vers le test et la production. La prochaine version ajoute une table nommée dbo.Channel au projet SQL de SQL_Sales.

    Après chaque mise à jour depuis Git et chaque déploiement, dbo.Channel doit contenir les six mêmes lignes de référence. Ces opérations s'exécutent de nombreuses fois, et elles ne doivent jamais créer de lignes en double ni échouer parce que les lignes existent déjà.

    Comment devez-vous compléter la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Write the rows as [[stmt]] in a query, move the query to [[loc]], and set it as the [[kind]] script of SQL_Sales.
    fr: |
      Écrire les lignes sous la forme [[stmt]] dans une requête, déplacer la requête dans [[loc]] et la définir comme script de [[kind]] de SQL_Sales.
  slots:
    - id: stmt
      options:
        - { id: merge, text: { en: "a MERGE statement that inserts missing rows and updates changed ones", fr: "une instruction MERGE qui insère les lignes manquantes et met à jour celles qui ont changé" } }
        - { id: insert, text: { en: "an INSERT statement that adds the six rows", fr: "une instruction INSERT qui ajoute les six lignes" } }
        - { id: ctas, text: { en: "a SELECT INTO statement that creates dbo.Channel with the six rows", fr: "une instruction SELECT INTO qui crée dbo.Channel avec les six lignes" } }
    - id: loc
      options:
        - { id: shared, text: { en: "the Shared Queries folder of SQL_Sales", fr: "le dossier Shared Queries de SQL_Sales" } }
        - { id: tables, text: { en: "the dbo/Tables folder, next to Channel.sql", fr: "le dossier dbo/Tables, à côté de Channel.sql" } }
        - { id: bin, text: { en: "the bin/Debug folder, next to the .dacpac file", fr: "le dossier bin/Debug, à côté du fichier .dacpac" } }
    - id: kind
      options:
        - { id: pre, text: { en: "pre-deployment", fr: "prédéploiement" } }
        - { id: post, text: { en: "post-deployment", fr: "post-déploiement" } }
answer:
  values: { stmt: merge, loc: shared, kind: post }
explanation:
  correct:
    en: |
      In the Fabric query editor, pre-deployment and post-deployment scripts are queries of the Shared Queries folder, set with Set as Post-deployment Script. Fabric runs the script with every update from source control and every deployment pipeline deployment, so it must be idempotent; a MERGE inserts the missing rows and updates the changed ones without duplicating anything. The post-deployment script runs after the schema changes are applied, so dbo.Channel already exists when it runs.
    fr: |
      Dans l'éditeur de requêtes Fabric, les scripts de prédéploiement et de post-déploiement sont des requêtes du dossier Shared Queries, définies avec Set as Post-deployment Script. Fabric exécute le script à chaque mise à jour depuis le contrôle de code source et à chaque déploiement par un pipeline de déploiement : il doit donc être idempotent. Un MERGE insère les lignes manquantes et met à jour celles qui ont changé, sans rien dupliquer. Le script de post-déploiement s'exécute après l'application des modifications de schéma : dbo.Channel existe donc déjà quand il s'exécute.
  options:
    insert: { en: "An INSERT adds the six rows again at each run of the script, which creates duplicates.", fr: "Un INSERT ajoute de nouveau les six lignes à chaque exécution du script, ce qui crée des doublons." }
    ctas: { en: "SELECT INTO creates a new table, so it fails when dbo.Channel, defined by the project, already exists.", fr: "SELECT INTO crée une nouvelle table : il échoue donc quand dbo.Channel, définie par le projet, existe déjà." }
    tables: { en: "Files in the object folders are part of the declarative schema model, not deployment scripts.", fr: "Les fichiers des dossiers d'objets font partie du modèle de schéma déclaratif, pas des scripts de déploiement." }
    bin: { en: "bin/Debug holds build output; files there aren't deployed as scripts.", fr: "bin/Debug contient la sortie de génération ; les fichiers qui s'y trouvent ne sont pas déployés comme scripts." }
    pre: { en: "The pre-deployment script runs before the schema changes, when the new dbo.Channel table doesn't exist yet.", fr: "Le script de prédéploiement s'exécute avant les modifications de schéma, quand la nouvelle table dbo.Channel n'existe pas encore." }
references:
  - title: Fabric SQL database source control integration
    url: https://learn.microsoft.com/en-us/fabric/database/sql/source-control
