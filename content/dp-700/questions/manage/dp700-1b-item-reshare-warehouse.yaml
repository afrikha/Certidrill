id: dp700-1b-item-reshare-warehouse
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are an Admin of a Fabric workspace named WS-Fin that contains a warehouse named DW1 and several lakehouses. User11 has no role in WS-Fin. You shared DW1 with User11 and selected **Read all data using SQL**.

    User11 asks that five colleagues get the same access to DW1. The colleagues must not access the other items of WS-Fin. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous êtes Admin d'un espace de travail Fabric nommé WS-Fin qui contient un entrepôt nommé DW1 et plusieurs lakehouses. User11 n'a aucun rôle dans WS-Fin. Vous avez partagé DW1 avec User11 en sélectionnant **Read all data using SQL**.

    User11 demande que cinq collègues obtiennent le même accès à DW1. Les collègues ne doivent pas accéder aux autres éléments de WS-Fin. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant User11 the Reshare permission on DW1, and let User11 share it.", fr: "Accorder à User11 l'autorisation Reshare sur DW1, et laisser User11 le partager." } }
    - { id: b, text: { en: "Assign User11 the Contributor role, and let User11 share DW1.", fr: "Attribuer à User11 le rôle Contributor, et laisser User11 partager DW1." } }
    - { id: c, text: { en: "Assign the five colleagues the Viewer role in WS-Fin.", fr: "Attribuer aux cinq collègues le rôle Viewer dans WS-Fin." } }
    - { id: d, text: { en: "Share DW1 with the colleagues, and select Read all data using SQL.", fr: "Partager DW1 avec les collègues, et sélectionner Read all data using SQL." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Recipients of a shared warehouse can't reshare it, and only workspace Admins and Members can share a warehouse. As an Admin, you share DW1 with the colleagues and select Read all data using SQL, which gives them the same access as User11 to DW1 only.
    fr: |
      Les destinataires d'un entrepôt partagé ne peuvent pas le repartager, et seuls les Admins et les Members de l'espace de travail peuvent partager un entrepôt. En tant qu'Admin, vous partagez DW1 avec les collègues en sélectionnant Read all data using SQL, ce qui leur donne le même accès que User11, sur DW1 uniquement.
  options:
    a: { en: "A warehouse can't be reshared by its recipients; Reshare isn't granted through the sharing of a warehouse.", fr: "Un entrepôt ne peut pas être repartagé par ses destinataires ; Reshare ne s'accorde pas par le partage d'un entrepôt." }
    b: { en: "Contributors can't share a warehouse, and the role would give User11 write access to every item.", fr: "Les Contributors ne peuvent pas partager un entrepôt, et ce rôle donnerait à User11 un accès en écriture à tous les éléments." }
    c: { en: "A workspace role gives access to every item of WS-Fin, including the lakehouses.", fr: "Un rôle d'espace de travail donne accès à tous les éléments de WS-Fin, y compris les lakehouses." }
references:
  - title: Share Your Warehouse and Manage Permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
