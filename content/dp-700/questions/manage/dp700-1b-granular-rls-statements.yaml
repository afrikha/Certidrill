id: dp700-1b-granular-rls-statements
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 in a workspace named WS1. You create a security policy with a filter predicate on dbo.FactSales. The predicate returns the rows whose SalesRep column equals `USER_NAME()`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 dans un espace de travail nommé WS1. Vous créez une stratégie de sécurité avec un prédicat de filtre sur dbo.FactSales. Le prédicat renvoie les lignes dont la colonne SalesRep est égale à `USER_NAME()`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A user who has the Contributor role in WS1 sees all the rows of dbo.FactSales when querying DW1.
        fr: |
          Un utilisateur qui a le rôle Contributor dans WS1 voit toutes les lignes de dbo.FactSales quand il interroge DW1.
    - id: s2
      text:
        en: |
          A user can insert a row into dbo.FactSales that the predicate then hides from that user.
        fr: |
          Un utilisateur peut insérer dans dbo.FactSales une ligne que le prédicat lui masque ensuite.
    - id: s3
      text:
        en: |
          When the predicate filters every row for a user, the user's SELECT returns an empty result set.
        fr: |
          Quand le prédicat filtre toutes les lignes pour un utilisateur, le SELECT de cet utilisateur renvoie un jeu de résultats vide.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Security policies apply to every user, including dbo, db_owner members and workspace Admins, Members and Contributors; if some users must see all rows, the predicate logic must allow it. Filter predicates don't block inserts, so a user can insert a row that is filtered afterwards. Filtered rows disappear silently, and a query whose rows are all filtered returns an empty result set.
    fr: |
      Les stratégies de sécurité s'appliquent à tous les utilisateurs, y compris dbo, les membres de db_owner et les Admins, Members et Contributors de l'espace de travail ; si certains utilisateurs doivent voir toutes les lignes, la logique du prédicat doit le permettre. Les prédicats de filtre ne bloquent pas les insertions : un utilisateur peut insérer une ligne filtrée ensuite. Les lignes filtrées disparaissent silencieusement, et une requête dont toutes les lignes sont filtrées renvoie un jeu de résultats vide.
references:
  - title: Row-Level Security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
