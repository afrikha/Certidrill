id: dp700-1b-ws-role-teams
objective: "1.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-RTI that contains an eventhouse, KQL databases, KQL querysets and Real-Time Dashboards.

    You need to assign a workspace role to three groups. Each group must receive only the permissions it needs.

    Which role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-RTI qui contient un eventhouse, des bases de données KQL, des ensembles de requêtes KQL et des tableaux de bord en temps réel.

    Vous devez attribuer un rôle d'espace de travail à trois groupes. Chaque groupe ne doit recevoir que les autorisations dont il a besoin.

    Quel rôle devez-vous attribuer à chaque groupe ? Pour répondre, faites glisser les rôles appropriés vers les groupes correspondants. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: admin, text: Admin }
    - { id: member, text: Member }
    - { id: contributor, text: Contributor }
    - { id: viewer, text: Viewer }
  targets:
    - id: platform
      text: { en: "Platform team: create a workspace identity for WS-RTI", fr: "Équipe plateforme : créer une identité d'espace de travail pour WS-RTI" }
    - id: engineers
      text: { en: "Stream engineers: change the schema and data of the KQL databases, without adding people", fr: "Ingénieurs streaming : modifier le schéma et les données des bases de données KQL, sans ajouter de personnes" }
    - id: operators
      text: { en: "Operators: open the KQL querysets and Real-Time Dashboards without changing them", fr: "Opérateurs : ouvrir les ensembles de requêtes KQL et les tableaux de bord en temps réel sans les modifier" }
answer:
  mapping: { platform: admin, engineers: contributor, operators: viewer }
explanation:
  correct:
    en: |
      Creating a workspace identity is reserved for Admin. Contributor can write or delete the schema and data of KQL databases and eventhouses without managing access. Viewer can view and read KQL querysets and Real-Time Dashboards but change nothing. Member would add the right to add people, which no group needs.
    fr: |
      La création d'une identité d'espace de travail est réservée à Admin. Contributor peut écrire ou supprimer le schéma et les données des bases de données KQL et des eventhouses sans gérer les accès. Viewer peut consulter et lire les ensembles de requêtes KQL et les tableaux de bord en temps réel sans rien modifier. Member ajouterait le droit d'ajouter des personnes, dont aucun groupe n'a besoin.
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
