id: dp700-1c-label-enable-order
objective: "1.3.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Your organization has licenses for Microsoft Purview Information Protection but has never used sensitivity labels. All Fabric users have a Power BI Pro license.

    You need to ensure that data engineers can apply a label named Confidential to the lakehouses they create in Fabric.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Votre organisation dispose de licences Microsoft Purview Information Protection mais n'a jamais utilisé d'étiquettes de confidentialité. Tous les utilisateurs Fabric ont une licence Power BI Pro.

    Vous devez faire en sorte que les ingénieurs données puissent appliquer une étiquette nommée Confidential aux lakehouses qu'ils créent dans Fabric.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create the Confidential label in the Microsoft Purview portal.", fr: "Créer l'étiquette Confidential dans le portail Microsoft Purview." } }
    - { id: publish, text: { en: "Publish the label to the data engineers in a label policy.", fr: "Publier l'étiquette pour les ingénieurs données dans une stratégie d'étiquettes." } }
    - { id: tenant, text: { en: "In the Fabric tenant settings, enable Allow users to apply sensitivity labels for content.", fr: "Dans les paramètres du locataire Fabric, activer Allow users to apply sensitivity labels for content." } }
    - { id: apply, text: { en: "Select the sensitivity indicator in the lakehouse header and choose Confidential.", fr: "Sélectionner l'indicateur de confidentialité dans l'en-tête du lakehouse et choisir Confidential." } }
    - { id: protect, text: { en: "Create a protection policy for the Confidential label.", fr: "Créer une stratégie de protection pour l'étiquette Confidential." } }
    - { id: certify, text: { en: "Certify the lakehouse in its endorsement settings.", fr: "Certifier le lakehouse dans ses paramètres d'approbation." } }
answer:
  sequence: [ create, publish, tenant, apply ]
explanation:
  correct:
    en: |
      Labels are defined in Microsoft Purview and must be published to users and groups before you enable them on the Fabric tenant. Once the tenant setting is on, users who have the label published to them and edit permission on the item apply it from the sensitivity indicator in the item header or from the item settings.
    fr: |
      Les étiquettes se définissent dans Microsoft Purview et doivent être publiées pour des utilisateurs et des groupes avant d'être activées sur le locataire Fabric. Une fois le paramètre de locataire activé, les utilisateurs pour qui l'étiquette est publiée et qui peuvent modifier l'élément l'appliquent depuis l'indicateur de confidentialité de l'en-tête de l'élément ou depuis ses paramètres.
  options:
    protect: { en: "A protection policy restricts access to labeled items; it isn't needed to apply labels.", fr: "Une stratégie de protection restreint l'accès aux éléments étiquetés ; elle n'est pas nécessaire pour appliquer des étiquettes." }
    certify: { en: "Certification is endorsement and is unrelated to sensitivity labels.", fr: "La certification relève de l'approbation et n'a aucun rapport avec les étiquettes de confidentialité." }
references:
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
  - title: Apply sensitivity labels to Fabric items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/apply-sensitivity-labels
