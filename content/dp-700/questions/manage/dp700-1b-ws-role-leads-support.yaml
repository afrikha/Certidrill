id: dp700-1b-ws-role-leads-support
objective: "1.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Ops that contains pipelines, notebooks and a warehouse.

    You need to assign workspace roles to two security groups:

    - **SG-Leads** must add engineers to WS-Ops with the Contributor or Viewer role, and share items in a way that allows the recipients to reshare them. SG-Leads must not add workspace admins.
    - **SG-Support** must view the execution output of the pipelines and notebooks. SG-Support must not run or cancel them.

    The solution must follow the principle of least privilege. Which role should you assign to each group? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Ops qui contient des pipelines, des notebooks et un entrepôt.

    Vous devez attribuer des rôles d'espace de travail à deux groupes de sécurité :

    - **SG-Leads** doit ajouter des ingénieurs à WS-Ops avec le rôle Contributor ou Viewer, et partager des éléments en autorisant les destinataires à les repartager. SG-Leads ne doit pas ajouter d'administrateurs d'espace de travail.
    - **SG-Support** doit consulter les résultats d'exécution des pipelines et des notebooks. SG-Support ne doit pas les exécuter ni les annuler.

    La solution doit respecter le principe du moindre privilège. Quel rôle devez-vous attribuer à chaque groupe ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SG-Leads: [[leads]]
      SG-Support: [[support]]
    fr: |
      SG-Leads : [[leads]]
      SG-Support : [[support]]
  slots:
    - id: leads
      options:
        - { id: admin, text: Admin }
        - { id: member, text: Member }
        - { id: contributor, text: Contributor }
        - { id: viewer, text: Viewer }
    - id: support
      options:
        - { id: admin, text: Admin }
        - { id: member, text: Member }
        - { id: contributor, text: Contributor }
        - { id: viewer, text: Viewer }
answer:
  values: { leads: member, support: viewer }
explanation:
  correct:
    en: |
      Member can add people with the Member role or lower and can allow others to reshare items, but only Admin can add or remove admins. Viewer can view the execution output of pipelines and notebooks without being able to run or cancel them.
    fr: |
      Member peut ajouter des personnes avec le rôle Member ou un rôle inférieur et peut autoriser d'autres utilisateurs à repartager des éléments, mais seul Admin peut ajouter ou retirer des administrateurs. Viewer peut consulter les résultats d'exécution des pipelines et des notebooks sans pouvoir les exécuter ni les annuler.
  options:
    admin: { en: "Admin can also add admins and delete the workspace, which exceeds both requirements.", fr: "Admin peut aussi ajouter des administrateurs et supprimer l'espace de travail, ce qui dépasse les deux exigences." }
    contributor: { en: "Contributor can't add people, and it can run and cancel pipelines and notebooks.", fr: "Contributor ne peut pas ajouter de personnes, et il peut exécuter et annuler des pipelines et des notebooks." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
