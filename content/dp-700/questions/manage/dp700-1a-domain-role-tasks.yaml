id: dp700-1a-domain-role-tasks
objective: "1.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Your Fabric tenant contains a domain named **Sales**. Several users must perform the governance tasks shown in the answer area.

    Which role should each user receive? The solution must follow the principle of least privilege. To answer, drag the appropriate roles to the correct tasks. Each role may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre locataire Fabric contient un domaine nommé **Sales**. Plusieurs utilisateurs doivent effectuer les tâches de gouvernance présentées dans la zone de réponse.

    Quel rôle chaque utilisateur doit-il recevoir ? La solution doit respecter le principe du moindre privilège. Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: fabric, text: { en: "Fabric administrator", fr: "Administrateur Fabric" } }
    - { id: domadmin, text: { en: "Domain admin of Sales", fr: "Administrateur du domaine Sales" } }
    - { id: domcontrib, text: { en: "Domain contributor of Sales", fr: "Contributeur du domaine Sales" } }
    - { id: capadmin, text: { en: "Capacity admin", fr: "Administrateur de capacité" } }
  targets:
    - id: subdomain
      text: { en: "Create a subdomain named Sales-EMEA under Sales", fr: "Créer un sous-domaine nommé Sales-EMEA sous Sales" }
    - id: description
      text: { en: "Edit the description of the Sales domain", fr: "Modifier la description du domaine Sales" }
    - id: admins
      text: { en: "Name a new domain admin of Sales", fr: "Désigner un nouvel administrateur du domaine Sales" }
    - id: assign
      text: { en: "Assign a workspace that the user administers to Sales from its workspace settings", fr: "Attribuer à Sales, depuis ses paramètres, un espace de travail que l'utilisateur administre" }
answer:
  mapping: { subdomain: domadmin, description: domadmin, admins: fabric, assign: domcontrib }
explanation:
  correct:
    en: Domain admins can create subdomains and update the description, image and contributors of their domain. Only a Fabric admin can name or remove domain admins. A domain contributor, who must also be an admin of the workspace, assigns that workspace to the domain from the workspace settings without access to the admin portal.
    fr: Les administrateurs de domaine peuvent créer des sous-domaines et modifier la description, l'image et les contributeurs de leur domaine. Seul un administrateur Fabric peut désigner ou retirer des administrateurs de domaine. Un contributeur de domaine, qui doit aussi être administrateur de l'espace de travail, attribue cet espace de travail au domaine depuis les paramètres de l'espace de travail, sans accès au portail d'administration.
  options:
    capadmin:
      en: Capacity admins manage capacities; they have no permission on domains.
      fr: Les administrateurs de capacité gèrent les capacités ; ils n'ont aucune autorisation sur les domaines.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
