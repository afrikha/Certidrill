id: dp700-1c-ddm-contributor-unmasked
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a warehouse named DW1. In DW1, the NationalId column of the dbo.Customer table has the mask partial(0,"XXX-XX-",4).

    A security group named Analysts has the Contributor role in Workspace1. The analysts only run T-SQL queries against DW1; they don't create or edit items. They report that they see the full NationalId values.

    You need to ensure that the analysts see masked NationalId values. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un entrepôt nommé DW1. Dans DW1, la colonne NationalId de la table dbo.Customer a le masque partial(0,"XXX-XX-",4).

    Un groupe de sécurité nommé Analysts a le rôle Contributor dans Workspace1. Les analystes exécutent seulement des requêtes T-SQL sur DW1 ; ils ne créent ni ne modifient d'éléments. Ils signalent qu'ils voient les valeurs NationalId complètes.

    Vous devez faire en sorte que les analystes voient des valeurs NationalId masquées. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run REVOKE UNMASK ON dbo.Customer FROM [Analysts].", fr: "Exécuter REVOKE UNMASK ON dbo.Customer FROM [Analysts]." } }
    - { id: b, text: { en: "Change the role of Analysts in Workspace1 to Viewer.", fr: "Remplacer le rôle d'Analysts dans Workspace1 par Viewer." } }
    - { id: c, text: { en: "Replace the partial() mask on NationalId with default().", fr: "Remplacer le masque partial() de NationalId par default()." } }
    - { id: d, text: { en: "Apply the Highly Confidential sensitivity label to DW1.", fr: "Appliquer l'étiquette de confidentialité Highly Confidential à DW1." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Workspace Admins, Members and Contributors have CONTROL on the warehouse database, and CONTROL includes UNMASK, so they always see real values. The Viewer role still lets the analysts query DW1 with T-SQL, but without CONTROL they get masked results, and they lose write permissions they don't need.
    fr: |
      Les Admins, Members et Contributors de l'espace de travail ont CONTROL sur la base de données de l'entrepôt, et CONTROL inclut UNMASK : ils voient toujours les vraies valeurs. Le rôle Viewer permet encore aux analystes d'interroger DW1 en T-SQL, mais sans CONTROL ils obtiennent des résultats masqués, et ils perdent des autorisations d'écriture dont ils n'ont pas besoin.
  options:
    a: { en: "The analysts were never granted UNMASK; they see real values through CONTROL, which REVOKE UNMASK doesn't remove.", fr: "Les analystes n'ont jamais reçu UNMASK ; ils voient les vraies valeurs grâce à CONTROL, que REVOKE UNMASK ne retire pas." }
    c: { en: "Any mask function is ignored for users who have CONTROL; changing the function changes nothing for them.", fr: "Toute fonction de masquage est ignorée pour les utilisateurs qui ont CONTROL ; changer de fonction ne change rien pour eux." }
    d: { en: "A sensitivity label classifies the item and protects exports; it doesn't mask query results.", fr: "Une étiquette de confidentialité classe l'élément et protège les exportations ; elle ne masque pas les résultats des requêtes." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
