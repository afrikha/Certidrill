id: dp700-1a-onelake-cache-config
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Geo** that contains a lakehouse with an Amazon S3 shortcut named **s3_tiles**. The files in s3_tiles are smaller than 500 MB. A pipeline reads every file through s3_tiles once every 9 days.

    You plan to turn on the shortcut cache of WS-Geo. You need to ensure that the reads are served from the cache whenever possible, and that cached files that are no longer read are purged as soon as possible.

    The S3 bucket owner sometimes replaces a file with a corrected version under the same name.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Geo** qui contient un lakehouse doté d'un raccourci Amazon S3 nommé **s3_tiles**. Les fichiers de s3_tiles font moins de 500 Mo. Un pipeline lit chaque fichier via s3_tiles une fois tous les 9 jours.

    Vous prévoyez d'activer le cache des raccourcis de WS-Geo. Vous devez faire en sorte que les lectures soient servies depuis le cache chaque fois que c'est possible, et que les fichiers en cache qui ne sont plus lus soient purgés le plus tôt possible.

    Le propriétaire du compartiment S3 remplace parfois un fichier par une version corrigée portant le même nom.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Retention Period to select: [[ret]]

      After the bucket owner replaces a file, the next read is served from: [[src]]
    fr: |
      Retention Period à sélectionner : [[ret]]

      Après le remplacement d'un fichier par le propriétaire du compartiment, la lecture suivante est servie depuis : [[src]]
  slots:
    - id: ret
      options:
        - { id: d7, text: { en: "7 days", fr: "7 jours" } }
        - { id: d10, text: { en: "10 days", fr: "10 jours" } }
        - { id: d28, text: { en: "28 days", fr: "28 jours" } }
        - { id: d35, text: { en: "35 days", fr: "35 jours" } }
    - id: src
      options:
        - { id: cache, text: { en: "The cache, until the cached copy expires", fr: "Le cache, jusqu'à l'expiration de la copie en cache" } }
        - { id: remote, text: { en: "The S3 bucket, and the cached copy is updated", fr: "Le compartiment S3, et la copie en cache est mise à jour" } }
        - { id: reset, text: { en: "The cache, until someone selects Reset cache", fr: "Le cache, jusqu'à ce que quelqu'un sélectionne Reset cache" } }
answer:
  values: { ret: d10, src: remote }
explanation:
  correct:
    en: The retention period can be set from 1 to 28 days, each access resets it, and a file that isn't accessed within the period is purged. With reads every 9 days, 10 days keeps the files cached between reads while purging unused files sooner than 28 days would. When the remote provider has a more recent version of a file than the cache, OneLake serves the request from the remote provider and updates the cached file.
    fr: La période de rétention peut être définie de 1 à 28 jours, chaque accès la remet à zéro, et un fichier non consulté pendant cette période est purgé. Avec une lecture tous les 9 jours, 10 jours garde les fichiers en cache entre deux lectures tout en purgeant les fichiers inutilisés plus tôt qu'avec 28 jours. Quand le fournisseur distant possède une version plus récente d'un fichier que le cache, OneLake sert la requête depuis le fournisseur distant et met à jour le fichier en cache.
  options:
    d7:
      en: A 7-day retention purges each file before the next read, 9 days later, so every read would go to S3.
      fr: "Une rétention de 7 jours purge chaque fichier avant la lecture suivante, 9 jours plus tard : chaque lecture irait donc dans S3."
    d28:
      en: 28 days works but keeps files that are no longer read in the cache longer than necessary.
      fr: 28 jours fonctionne, mais garde en cache plus longtemps que nécessaire les fichiers qui ne sont plus lus.
    d35:
      en: The retention period can't exceed 28 days.
      fr: La période de rétention ne peut pas dépasser 28 jours.
    cache:
      en: OneLake doesn't serve a stale copy when the remote provider has a newer version of the file.
      fr: OneLake ne sert pas une copie périmée quand le fournisseur distant possède une version plus récente du fichier.
references:
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
