id: dp700-1a-onelake-diag-query
objective: "1.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    OneLake diagnostics is turned on for a Fabric workspace named **WS-Claims**, and the events are sent to a lakehouse named **LH_Diag**.

    You open a notebook that has LH_Diag as its default lakehouse. You need to list the data access operations that the user **paul@contoso.com** performed in WS-Claims during November 2026.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les diagnostics OneLake sont activés pour un espace de travail Fabric nommé **WS-Claims**, et les événements sont envoyés vers un lakehouse nommé **LH_Diag**.

    Vous ouvrez un notebook dont le lakehouse par défaut est LH_Diag. Vous devez lister les opérations d'accès aux données que l'utilisateur **paul@contoso.com** a effectuées dans WS-Claims en novembre 2026.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    ws_id = "<WS-Claims workspace ID>"
    path = "[[root]]/Workspaces/" + ws_id + "/y=2026/m=11/*/*/*/*.json"

    df = spark.read.[[fmt]](path)

    (df.filter(df.[[col]] == "paul@contoso.com")
       .select("operationName", "itemId", "accessStartTime")
       .show())
  slots:
    - id: root
      options:
        - { id: files, text: "Files/DiagnosticLogs/OneLake" }
        - { id: tables, text: "Tables/DiagnosticLogs/OneLake" }
        - { id: audit, text: "Files/AuditLogs/Fabric" }
        - { id: system, text: "Tables/sys/onelake_diagnostics" }
    - id: fmt
      options:
        - { id: parquet, text: "parquet" }
        - { id: json, text: "json" }
        - { id: csv, text: "csv" }
        - { id: delta, text: "table" }
    - id: col
      options:
        - { id: ip, text: "callerIPAddress" }
        - { id: app, text: "originatingApp" }
        - { id: upn, text: "executingUPN" }
        - { id: cat, text: "operationCategory" }
answer:
  values: { root: files, fmt: json, col: upn }
explanation:
  correct:
    en: OneLake diagnostics writes JSON files into the Files section of the destination lakehouse, under `DiagnosticLogs/OneLake/Workspaces/<workspace ID>/y=YYYY/m=MM/d=DD/h=HH/m=00/PT1H.json`, so the files are read with `spark.read.json`. The executingUPN field holds the user principal name of the caller, which identifies who performed each operation.
    fr: "Les diagnostics OneLake écrivent des fichiers JSON dans la section Files du lakehouse de destination, sous `DiagnosticLogs/OneLake/Workspaces/<workspace ID>/y=YYYY/m=MM/d=DD/h=HH/m=00/PT1H.json` : ils se lisent donc avec `spark.read.json`. Le champ executingUPN contient le nom d'utilisateur principal de l'appelant, qui identifie l'auteur de chaque opération."
  options:
    tables:
      en: The events are raw files in the Files section; they become tables only if you transform them.
      fr: Les événements sont des fichiers bruts de la section Files ; ils ne deviennent des tables que si vous les transformez.
    parquet:
      en: The diagnostic files are JSON, not Parquet.
      fr: Les fichiers de diagnostic sont au format JSON, pas Parquet.
    delta:
      en: spark.read.table reads a catalog table by name, not a folder of JSON files.
      fr: spark.read.table lit une table du catalogue par son nom, pas un dossier de fichiers JSON.
    ip:
      en: callerIPAddress identifies the client IP address, not the user.
      fr: callerIPAddress identifie l'adresse IP du client, pas l'utilisateur.
    app:
      en: originatingApp identifies the application or engine used, not the user.
      fr: originatingApp identifie l'application ou le moteur utilisé, pas l'utilisateur.
references:
  - title: OneLake diagnostics
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-diagnostics-overview
