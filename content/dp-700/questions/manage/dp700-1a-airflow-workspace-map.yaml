id: dp700-1a-airflow-workspace-map
objective: "1.1.4"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Your company has three Fabric workspaces that run Apache Airflow jobs. Each workspace is on a capacity that is large enough for any of the configurations. Every workspace must minimize capacity consumption while meeting its requirements:

    - **WS-Lab**: students test simple DAGs a few times a week; a start delay of a few minutes is acceptable.
    - **WS-Files**: simple DAGs copy files every 10 minutes, all day, and must start on schedule; the load is steady.
    - **WS-Close**: complex production DAGs must start on schedule; the number of parallel tasks triples during the monthly financial close only.

    Which Apache Airflow runtime configuration should you use for each workspace? To answer, drag the appropriate configurations to the correct workspaces. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise dispose de trois espaces de travail Fabric qui exécutent des travaux Apache Airflow. Chaque espace de travail se trouve sur une capacité assez grande pour n'importe quelle configuration. Chaque espace de travail doit réduire au minimum la consommation de capacité tout en respectant ses exigences :

    - **WS-Lab** : des étudiants testent des DAG simples quelques fois par semaine ; un délai de démarrage de quelques minutes est acceptable.
    - **WS-Files** : des DAG simples copient des fichiers toutes les 10 minutes, toute la journée, et doivent démarrer à l'heure ; la charge est stable.
    - **WS-Close** : des DAG de production complexes doivent démarrer à l'heure ; le nombre de tâches parallèles triple uniquement pendant la clôture financière mensuelle.

    Quelle configuration du runtime Apache Airflow devez-vous utiliser pour chaque espace de travail ? Pour répondre, faites glisser les configurations appropriées vers les espaces de travail correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: starter, text: { en: "Starter pool", fr: "Pool de démarrage (Starter pool)" } }
    - { id: small, text: { en: "Custom pool, Small nodes, no extra nodes", fr: "Pool personnalisé, nœuds Small, sans nœuds supplémentaires" } }
    - { id: largeauto, text: { en: "Custom pool, Large nodes, autoscale on", fr: "Pool personnalisé, nœuds Large, mise à l'échelle automatique activée" } }
    - { id: largefixed, text: { en: "Custom pool, Large nodes, three fixed extra nodes", fr: "Pool personnalisé, nœuds Large, trois nœuds supplémentaires fixes" } }
  targets:
    - { id: lab, text: "WS-Lab" }
    - { id: files, text: "WS-Files" }
    - { id: close, text: "WS-Close" }
answer:
  mapping: { lab: starter, files: small, close: largeauto }
explanation:
  correct:
    en: The starter pool shuts down after 20 minutes of inactivity, so occasional development runs don't pay for idle time, at the cost of a resume delay. A custom pool is always on, so DAGs start on schedule; Small nodes suit simple DAGs and use fewer CUs. Large nodes suit complex production DAGs, and autoscale starts extra nodes only when the load rises and stops them when it drops.
    fr: "Le pool de démarrage s'arrête après 20 minutes d'inactivité : des exécutions de développement occasionnelles ne paient donc pas le temps d'inactivité, au prix d'un délai de reprise. Un pool personnalisé reste toujours actif, donc les DAG démarrent à l'heure ; les nœuds Small conviennent aux DAG simples et consomment moins de CU. Les nœuds Large conviennent aux DAG de production complexes, et la mise à l'échelle automatique ne démarre des nœuds supplémentaires que lorsque la charge augmente et les arrête lorsqu'elle baisse."
  options:
    largefixed:
      en: Fixed extra nodes run all the time and add to the base cost, even outside the monthly close.
      fr: Les nœuds supplémentaires fixes tournent en permanence et s'ajoutent au coût de base, même en dehors de la clôture mensuelle.
references:
  - title: Apache Airflow compute in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-compute
  - title: Apache Airflow Job workspace settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-workspace-settings
