id: dp700-1a-git-lakehouse-content
objective: "1.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Dev** that is connected to an Azure Repos repository. WS-Dev contains a lakehouse named **LH_Sales**. LH_Sales contains Delta tables, files in the **Files** section, a Spark view and two OneLake shortcuts.

    You commit LH_Sales to the connected branch.

    Which two elements of LH_Sales are stored in the repository?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Dev** connecté à un dépôt Azure Repos. WS-Dev contient un lakehouse nommé **LH_Sales**. LH_Sales contient des tables Delta, des fichiers dans la section **Files**, une vue Spark et deux raccourcis OneLake.

    Vous faites un commit de LH_Sales dans la branche connectée.

    Quels sont les deux éléments de LH_Sales stockés dans le dépôt ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: e, text: { en: "The definition of the Spark view", fr: "La définition de la vue Spark" } }
    - { id: b, text: { en: "The Parquet files of the Delta tables", fr: "Les fichiers Parquet des tables Delta" } }
    - { id: c, text: { en: "The display name and description of the lakehouse", fr: "Le nom d'affichage et la description du lakehouse" } }
    - { id: d, text: { en: "The files in the Files section", fr: "Les fichiers de la section Files" } }
    - { id: a, text: { en: "The definitions of the two shortcuts", fr: "Les définitions des deux raccourcis" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Git integration tracks only lakehouse metadata, such as the display name, description and logical ID, and the OneLake shortcut definitions, stored in shortcuts.metadata.json. Tables, Spark views and the folders of the Files section aren't tracked, and Git operations never overwrite data in tables or files.
    fr: L'intégration Git ne suit que les métadonnées du lakehouse, comme le nom d'affichage, la description et l'ID logique, ainsi que les définitions des raccourcis OneLake, stockées dans shortcuts.metadata.json. Les tables, les vues Spark et les dossiers de la section Files ne sont pas suivis, et les opérations Git n'écrasent jamais les données des tables ou des fichiers.
  options:
    b:
      en: Table data isn't tracked in Git.
      fr: Les données des tables ne sont pas suivies dans Git.
    d:
      en: Folders and files in the Files section aren't tracked in Git.
      fr: Les dossiers et fichiers de la section Files ne sont pas suivis dans Git.
    e:
      en: Spark views aren't tracked in Git.
      fr: Les vues Spark ne sont pas suivies dans Git.
references:
  - title: Lakehouse git integration and deployment pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-git-deployment-pipelines
