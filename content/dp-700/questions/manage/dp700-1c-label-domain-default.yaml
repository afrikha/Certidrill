id: dp700-1c-label-domain-default
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your Fabric tenant has a domain named Finance that contains 12 workspaces. Every tenant setting that a Fabric administrator can delegate to domain admins is enabled. You are a domain admin of Finance.

    You need to ensure that new items created in the Finance workspaces automatically get the Confidential label when their creator doesn't choose a label. Workspaces outside the Finance domain must not be affected. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Votre locataire Fabric comporte un domaine nommé Finance qui contient 12 espaces de travail. Tous les paramètres de locataire qu'un administrateur Fabric peut déléguer aux administrateurs de domaine sont activés. Vous êtes administrateur du domaine Finance.

    Vous devez faire en sorte que les nouveaux éléments créés dans les espaces de travail Finance reçoivent automatiquement l'étiquette Confidential quand leur créateur ne choisit aucune étiquette. Les espaces de travail hors du domaine Finance ne doivent pas être affectés. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Microsoft Purview protection policy for the Confidential label.", fr: "Créer une stratégie de protection Microsoft Purview pour l'étiquette Confidential." } }
    - { id: b, text: { en: "Set Confidential as the default label in the Delegated settings of the Finance domain.", fr: "Définir Confidential comme étiquette par défaut dans les paramètres délégués (Delegated settings) du domaine Finance." } }
    - { id: c, text: { en: "Turn on mandatory labeling in the label policy of the Finance users.", fr: "Activer l'étiquetage obligatoire dans la stratégie d'étiquettes des utilisateurs Finance." } }
    - { id: d, text: { en: "Label the existing items manually and rely on downstream inheritance.", fr: "Étiqueter manuellement les éléments existants et compter sur l'héritage en aval." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A domain admin can set a default sensitivity label for the domain on the Delegated settings tab (Information protection). The label is applied to new items created in the domain's workspaces, and to unlabeled items when they're updated, without affecting other domains.
    fr: |
      Un administrateur de domaine peut définir une étiquette de confidentialité par défaut pour le domaine dans l'onglet Delegated settings (Information protection). L'étiquette s'applique aux nouveaux éléments créés dans les espaces de travail du domaine, et aux éléments non étiquetés quand ils sont mis à jour, sans affecter les autres domaines.
  options:
    a: { en: "A protection policy restricts access to items that already carry the label; it doesn't apply the label.", fr: "Une stratégie de protection restreint l'accès aux éléments qui portent déjà l'étiquette ; elle n'applique pas l'étiquette." }
    c: { en: "Mandatory labeling asks users to choose a label; it doesn't apply Confidential automatically, and it's fully supported only for Power BI items.", fr: "L'étiquetage obligatoire demande aux utilisateurs de choisir une étiquette ; il n'applique pas Confidential automatiquement et n'est entièrement pris en charge que pour les éléments Power BI." }
    d: { en: "Downstream inheritance only labels items that depend on a labeled item; independent new items stay unlabeled.", fr: "L'héritage en aval n'étiquette que les éléments qui dépendent d'un élément étiqueté ; les nouveaux éléments indépendants restent sans étiquette." }
references:
  - title: Domain-level default sensitivity labels in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/domain-default-sensitivity-label
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
