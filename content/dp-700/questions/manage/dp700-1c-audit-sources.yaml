id: dp700-1c-audit-sources
objective: "1.3.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS1 that contains a lakehouse named Lakehouse1 and a warehouse named DW1. The security team asks you the following questions:

    - Who deleted a warehouse named DW_Old from WS1 last week?
    - Which identities read files in Lakehouse1 through the ADLS APIs?
    - Who ran GRANT and DENY statements on the tables of DW1?

    Which source should you use to answer each question? To answer, drag the appropriate sources to the correct questions. Each source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS1 qui contient un lakehouse nommé Lakehouse1 et un entrepôt nommé DW1. L'équipe de sécurité vous pose les questions suivantes :

    - Qui a supprimé un entrepôt nommé DW_Old de WS1 la semaine dernière ?
    - Quelles identités ont lu des fichiers de Lakehouse1 par les API ADLS ?
    - Qui a exécuté des instructions GRANT et DENY sur les tables de DW1 ?

    Quelle source devez-vous utiliser pour répondre à chaque question ? Pour répondre, faites glisser les sources appropriées vers les questions correspondantes. Chaque source peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: purview, text: { en: "The Fabric audit log in Microsoft Purview", fr: "Le journal d'audit Fabric dans Microsoft Purview" } }
    - { id: diag, text: { en: "OneLake diagnostics", fr: "Les diagnostics OneLake" } }
    - { id: sqlaudit, text: { en: "The SQL audit logs of DW1", fr: "Les journaux d'audit SQL de DW1" } }
    - { id: hub, text: { en: "The Monitoring hub", fr: "Le hub de surveillance (Monitoring hub)" } }
    - { id: metrics, text: { en: "The Microsoft Fabric Capacity Metrics app", fr: "L'application Microsoft Fabric Capacity Metrics" } }
  targets:
    - { id: deleted, text: { en: "Who deleted DW_Old", fr: "Qui a supprimé DW_Old" } }
    - { id: files, text: { en: "Who read Lakehouse1 files through the ADLS APIs", fr: "Qui a lu des fichiers de Lakehouse1 par les API ADLS" } }
    - { id: grants, text: { en: "Who ran GRANT and DENY on DW1 tables", fr: "Qui a exécuté GRANT et DENY sur les tables de DW1" } }
answer:
  mapping: { deleted: purview, files: diag, grants: sqlaudit }
explanation:
  correct:
    en: |
      Item operations such as deleting a warehouse (DeleteArtifact) are control-plane events recorded in the Fabric audit log in Purview. OneLake diagnostics, turned on in the workspace OneLake settings, logs every operation made through the Blob or ADLS APIs. Permission changes inside a warehouse are SQL events, captured by the SQL audit logs with the Object Permission Was Changed action group.
    fr: |
      Les opérations sur les éléments comme la suppression d'un entrepôt (DeleteArtifact) sont des événements du plan de contrôle enregistrés dans le journal d'audit Fabric de Purview. Les diagnostics OneLake, activés dans les paramètres OneLake de l'espace de travail, consignent chaque opération effectuée par les API Blob ou ADLS. Les modifications d'autorisations dans un entrepôt sont des événements SQL, capturés par les journaux d'audit SQL avec le groupe d'actions Object Permission Was Changed.
  options:
    hub: { en: "The Monitoring hub shows item runs, not security events.", fr: "Le hub de surveillance affiche les exécutions d'éléments, pas des événements de sécurité." }
    metrics: { en: "The Capacity Metrics app reports compute consumption, not who did what.", fr: "L'application Capacity Metrics présente la consommation de calcul, pas qui a fait quoi." }
references:
  - title: Operation list
    url: https://learn.microsoft.com/en-us/fabric/admin/operation-list
  - title: SQL audit logs in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-audit-logs
