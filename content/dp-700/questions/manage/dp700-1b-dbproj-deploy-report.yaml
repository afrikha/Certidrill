id: dp700-1b-dbproj-deploy-report
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You use a database project to manage the schema of a Fabric warehouse named DW_Prod. A GitHub Actions workflow builds the project into a file named DW_Sales.dacpac.

    Before each release, an approver must receive an XML report that lists the changes a deployment of DW_Sales.dacpac would make to DW_Prod. DW_Prod must not be changed when the report is produced.

    Which SqlPackage action should the workflow run?
  fr: |
    Vous utilisez un projet de base de données pour gérer le schéma d'un entrepôt Fabric nommé DW_Prod. Un workflow GitHub Actions génère le projet dans un fichier nommé DW_Sales.dacpac.

    Avant chaque mise en production, un approbateur doit recevoir un rapport XML qui liste les modifications qu'un déploiement de DW_Sales.dacpac apporterait à DW_Prod. DW_Prod ne doit pas être modifié quand le rapport est produit.

    Quelle action SqlPackage le workflow doit-il exécuter ?
body:
  options:
    - { id: a, text: Script }
    - { id: b, text: DeployReport }
    - { id: c, text: DriftReport }
    - { id: d, text: Extract }
answer: { optionId: b }
explanation:
  correct:
    en: |
      DeployReport compares the .dacpac with the target database and writes an XML report of the changes that a Publish action would make, without changing the target. The approver can review it and the workflow then runs Publish if the release is approved.
    fr: |
      DeployReport compare le fichier .dacpac à la base de données cible et écrit un rapport XML des modifications qu'une action Publish apporterait, sans modifier la cible. L'approbateur peut le consulter, puis le workflow exécute Publish si la mise en production est approuvée.
  options:
    a: { en: "Script also leaves the target unchanged, but it produces a T-SQL update script, not an XML report.", fr: "Script laisse aussi la cible inchangée, mais il produit un script de mise à jour T-SQL, pas un rapport XML." }
    c: { en: "DriftReport lists the changes made to a registered database since it was last registered, not the changes a deployment would make.", fr: "DriftReport liste les modifications apportées à une base de données inscrite depuis sa dernière inscription, pas les modifications qu'un déploiement apporterait." }
    d: { en: "Extract creates a .dacpac from the target database; it doesn't compare it with the project.", fr: "Extract crée un fichier .dacpac à partir de la base de données cible ; il ne la compare pas au projet." }
references:
  - title: SqlPackage
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage
