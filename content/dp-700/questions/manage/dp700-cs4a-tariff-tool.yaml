id: dp700-cs4a-tariff-tool
objective: "1.4.1"
type: single
caseStudy: dp700-cs4a-city-power
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution for loading the tariff workbook into LH-Reference. The solution must meet the requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour charger le classeur des tarifs dans LH-Reference. La solution doit respecter les exigences.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A pipeline with a Copy activity that reads the workbook from SharePoint Online, with a weekly schedule", fr: "Un pipeline avec une activité Copy qui lit le classeur depuis SharePoint Online, avec une planification hebdomadaire" } }
    - { id: b, text: { en: "A notebook that reads the workbook with pandas and unpivots the month columns, with a weekly schedule", fr: "Un notebook qui lit le classeur avec pandas et dépivote les colonnes des mois, avec une planification hebdomadaire" } }
    - { id: c, text: { en: "A Dataflow Gen2 that unpivots the month columns of the workbook, with a weekly scheduled refresh", fr: "Un Dataflow Gen2 qui dépivote les colonnes des mois du classeur, avec une actualisation planifiée hebdomadaire" } }
    - { id: d, text: { en: "An eventstream that reads the workbook from SharePoint Online and writes it to LH-Reference", fr: "Un flux d'événements qui lit le classeur depuis SharePoint Online et l'écrit dans LH-Reference" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Dataflow Gen2 is a no-code, low-code tool built on Power Query, which the pricing team already knows. It connects to SharePoint Online, provides the Unpivot transformation among its 300+ functions, writes to a lakehouse table, and can be refreshed on a weekly schedule.
    fr: |
      Dataflow Gen2 est un outil sans code ou à faible code basé sur Power Query, que l'équipe tarification connaît déjà. Il se connecte à SharePoint Online, propose la transformation Dépivoter parmi ses plus de 300 fonctions, écrit dans une table de lakehouse et peut être actualisé selon une planification hebdomadaire.
  options:
    a:
      en: |
        The Copy activity supports only lightweight transformations such as type conversion and column mapping; it cannot turn the month columns into rows.
      fr: |
        L'activité Copy ne prend en charge que des transformations légères, comme la conversion de type et le mappage de colonnes ; elle ne peut pas transformer les colonnes des mois en lignes.
    b:
      en: |
        A notebook can unpivot the data, but it requires Python code that the pricing team cannot maintain.
      fr: |
        Un notebook peut dépivoter les données, mais il exige du code Python que l'équipe tarification ne peut pas maintenir.
    d:
      en: |
        Eventstream processes continuous event streams from sources such as Event Hubs, Kafka or CDC; it does not read Excel workbooks from SharePoint.
      fr: |
        Eventstream traite des flux continus d'événements provenant de sources comme Event Hubs, Kafka ou CDC ; il ne lit pas de classeurs Excel dans SharePoint.
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
