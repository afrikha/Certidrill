id: dp700-1d-item-capabilities
objective: "1.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso is designing its data integration in a Fabric workspace named Workspace1. The design uses Dataflow Gen2 items with CI/CD support, pipelines and notebooks.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit son intégration de données dans un espace de travail Fabric nommé Workspace1. La conception utilise des éléments Dataflow Gen2 avec prise en charge CI/CD, des pipelines et des notebooks.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Dataflow Gen2 can start a notebook when its refresh completes, without a pipeline.
        fr: Un Dataflow Gen2 peut démarrer un notebook à la fin de son actualisation, sans pipeline.
    - id: s2
      text:
        en: A Copy data activity in a pipeline can map source columns to destination columns and convert data types during the copy.
        fr: Une activité Copy data d'un pipeline peut mapper les colonnes sources vers les colonnes de destination et convertir les types de données pendant la copie.
    - id: s3
      text:
        en: A pipeline can pass a value to a parameter of a Dataflow Gen2 that has public parameters mode enabled.
        fr: Un pipeline peut transmettre une valeur à un paramètre d'un Dataflow Gen2 dont le mode des paramètres publics est activé.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A Dataflow Gen2 has no control flow: running a notebook after a refresh is the job of a pipeline (Dataflow activity followed by a Notebook activity). The Copy data activity supports lightweight transformations such as type conversion and column mapping. The Dataflow activity lists the public parameters of a Dataflow Gen2 with CI/CD and lets the pipeline pass a value to each one.
    fr: |
      Un Dataflow Gen2 n'a pas de flux de contrôle : exécuter un notebook après une actualisation est le rôle d'un pipeline (activité Dataflow suivie d'une activité Notebook). L'activité Copy data prend en charge des transformations légères comme la conversion de type et le mappage de colonnes. L'activité Dataflow liste les paramètres publics d'un Dataflow Gen2 avec CI/CD et permet au pipeline de transmettre une valeur à chacun.
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
  - title: Use the Dataflow activity to run a Dataflow Gen2
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-activity
