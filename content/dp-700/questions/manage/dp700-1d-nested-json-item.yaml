id: dp700-1d-nested-json-item
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named Lakehouse1. Every hour, an application writes JSON files that contain nested arrays of customer reviews to the Files/reviews folder of Lakehouse1.

    The data engineering team writes Python. The team must explode the nested arrays, score each review with an open-source sentiment library from PyPI, and write the results to Delta tables in Lakehouse1.

    You need to recommend an item for the processing. What should you recommend?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé Lakehouse1. Toutes les heures, une application écrit dans le dossier Files/reviews de Lakehouse1 des fichiers JSON qui contiennent des tableaux imbriqués d'avis clients.

    L'équipe d'ingénierie des données écrit du Python. Elle doit éclater les tableaux imbriqués, noter chaque avis avec une bibliothèque open source d'analyse des sentiments issue de PyPI et écrire les résultats dans des tables Delta de Lakehouse1.

    Vous devez recommander un élément pour ce traitement. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Dataflow Gen2 that expands the nested arrays and writes to Lakehouse1", fr: "Un Dataflow Gen2 qui développe les tableaux imbriqués et écrit dans Lakehouse1" } }
    - { id: b, text: { en: "A pipeline that has a Copy data activity with the flatten hierarchy option", fr: "Un pipeline doté d'une activité Copy data avec l'option d'aplatissement de la hiérarchie" } }
    - { id: c, text: { en: "A notebook that reads the files with PySpark and writes Delta tables", fr: "Un notebook qui lit les fichiers avec PySpark et écrit des tables Delta" } }
    - { id: d, text: { en: "A copy job that copies the files from Files/reviews to tables", fr: "Un travail de copie qui copie les fichiers de Files/reviews vers des tables" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A notebook runs code (PySpark, Scala, Spark SQL or R) and can use native Spark functions and open-source libraries, so it can explode nested arrays, call a Python sentiment library and write Delta tables. The team already writes Python, which matches the Spark skill set of the decision guide.
    fr: |
      Un notebook exécute du code (PySpark, Scala, Spark SQL ou R) et peut utiliser les fonctions natives de Spark et des bibliothèques open source : il peut donc éclater des tableaux imbriqués, appeler une bibliothèque Python d'analyse des sentiments et écrire des tables Delta. L'équipe écrit déjà du Python, ce qui correspond aux compétences Spark du guide de décision.
  options:
    a: { en: "Dataflow Gen2 offers Power Query transformations, but it cannot call a Python library from PyPI to score the reviews.", fr: "Dataflow Gen2 propose les transformations Power Query, mais il ne peut pas appeler une bibliothèque Python issue de PyPI pour noter les avis." }
    b: { en: "The Copy data activity supports only lightweight transformations such as flattening a hierarchy or mapping columns; it cannot run a sentiment library.", fr: "L'activité Copy data ne prend en charge que des transformations légères comme l'aplatissement d'une hiérarchie ou le mappage de colonnes ; elle ne peut pas exécuter une bibliothèque d'analyse des sentiments." }
    d: { en: "A copy job moves data with lightweight transformations only; it cannot apply custom Python logic.", fr: "Un travail de copie déplace des données avec des transformations légères uniquement ; il ne peut pas appliquer de logique Python personnalisée." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
