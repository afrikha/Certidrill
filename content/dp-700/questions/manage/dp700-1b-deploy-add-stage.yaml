id: dp700-1b-deploy-add-stage
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a deployment pipeline named DP-Sales that has three stages: Development, Test and Production. Each stage is assigned a workspace.

    The quality team needs a UAT stage between Test and Production, assigned to a new workspace named WS-UAT.

    What should you do?
  fr: |
    Vous disposez d'un pipeline de déploiement nommé DP-Sales qui comporte trois phases : Development, Test et Production. Chaque phase est affectée à un espace de travail.

    L'équipe qualité a besoin d'une phase UAT entre Test et Production, affectée à un nouvel espace de travail nommé WS-UAT.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Edit the stages of DP-Sales, and insert a UAT stage between Test and Production.", fr: "Modifier les phases de DP-Sales et insérer une phase UAT entre Test et Production." } }
    - { id: b, text: { en: "Rename the Test stage to UAT, and then assign WS-UAT to it next to the Test workspace.", fr: "Renommer la phase Test en UAT, puis lui affecter WS-UAT à côté de l'espace de travail de Test." } }
    - { id: c, text: { en: "Create a second pipeline that has two stages, and assign the Test workspace and WS-UAT to it.", fr: "Créer un second pipeline à deux phases, et lui affecter l'espace de travail de Test et WS-UAT." } }
    - { id: d, text: { en: "Unassign the workspaces from DP-Sales, create a pipeline that has four stages, and assign them to it.", fr: "Désaffecter les espaces de travail de DP-Sales, créer un pipeline à quatre phases et les lui affecter." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The number of stages (2 to 10) and their names are set when the pipeline is created and can't be changed. You need a new pipeline with four stages. Because a workspace can be assigned to only one deployment pipeline, you unassign the workspaces from DP-Sales before you assign them to the new pipeline.
    fr: |
      Le nombre de phases (de 2 à 10) et leurs noms sont définis à la création du pipeline et ne peuvent pas être modifiés. Il vous faut un nouveau pipeline à quatre phases. Comme un espace de travail ne peut être affecté qu'à un seul pipeline de déploiement, vous désaffectez les espaces de travail de DP-Sales avant de les affecter au nouveau pipeline.
  options:
    a: { en: "Stages can't be added to an existing pipeline.", fr: "On ne peut pas ajouter de phase à un pipeline existant." }
    b: { en: "Stage names are permanent, and each stage holds exactly one workspace.", fr: "Les noms des phases sont permanents, et chaque phase contient exactement un espace de travail." }
    c: { en: "The Test workspace is already assigned to DP-Sales, and a workspace can belong to only one pipeline.", fr: "L'espace de travail de Test est déjà affecté à DP-Sales, et un espace de travail ne peut appartenir qu'à un seul pipeline." }
references:
  - title: Get started using deployment pipelines, the Fabric Application lifecycle management (ALM) tool
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/get-started-with-deployment-pipelines
  - title: Assign a workspace to a deployment pipeline
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/assign-pipeline
