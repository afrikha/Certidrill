id: dp700-1c-audit-configure-order
objective: "1.3.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 on which SQL audit logs aren't enabled. You have the Audit permission on DW1.

    You need to record failed login attempts and permission changes on DW1 in the SQL audit logs, keep the events for one year, and capture nothing else.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 sur lequel les journaux d'audit SQL ne sont pas activés. Vous avez l'autorisation Audit sur DW1.

    Vous devez enregistrer dans les journaux d'audit SQL les tentatives de connexion échouées et les modifications d'autorisations sur DW1, conserver les événements un an et ne rien capturer d'autre.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "Open the settings of DW1 and select the SQL audit logs page.", fr: "Ouvrir les paramètres de DW1 et sélectionner la page SQL audit logs." } }
    - { id: enable, text: { en: "Enable Save events to SQL audit logs.", fr: "Activer Save events to SQL audit logs." } }
    - { id: events, text: { en: "Under Events to record, keep only User Failed To Log In and Object Permission Was Changed.", fr: "Sous Events to record, ne garder que User Failed To Log In et Object Permission Was Changed." } }
    - { id: retention, text: { en: "Set the log retention to one year.", fr: "Définir la rétention des journaux sur un an." } }
    - { id: save, text: { en: "Select Save.", fr: "Sélectionner Save." } }
    - { id: diag, text: { en: "Turn on Add diagnostic events to a lakehouse in the workspace OneLake settings.", fr: "Activer Add diagnostic events to a lakehouse dans les paramètres OneLake de l'espace de travail." } }
    - { id: grant, text: { en: "Run GRANT VIEW DATABASE SECURITY AUDIT TO yourself.", fr: "Exécuter GRANT VIEW DATABASE SECURITY AUDIT pour vous-même." } }
answer:
  sequence: [ open, enable, events, retention, save ]
explanation:
  correct:
    en: |
      SQL audit logs are configured from the SQL audit logs page of the warehouse settings. When you enable Save events to SQL audit logs, all actions are selected and kept for nine years by default, so you then narrow Events to record to the two action groups, set the retention period, and save.
    fr: |
      Les journaux d'audit SQL se configurent depuis la page SQL audit logs des paramètres de l'entrepôt. Quand vous activez Save events to SQL audit logs, toutes les actions sont sélectionnées et conservées neuf ans par défaut : vous limitez ensuite Events to record aux deux groupes d'actions, définissez la période de rétention, puis enregistrez.
  options:
    diag: { en: "OneLake diagnostics records OneLake data access, not SQL logins or permission changes.", fr: "Les diagnostics OneLake enregistrent l'accès aux données OneLake, pas les connexions SQL ni les modifications d'autorisations." }
    grant: { en: "Your Audit permission already lets you configure and query the logs.", fr: "Votre autorisation Audit vous permet déjà de configurer et d'interroger les journaux." }
references:
  - title: How to configure SQL audit logs
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/configure-sql-audit-logs
