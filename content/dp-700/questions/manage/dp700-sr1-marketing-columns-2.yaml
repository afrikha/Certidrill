id: dp700-sr1-marketing-columns-2
objective: "1.3.3"
type: series_yesno
series: dp700-sr1-marketing-columns
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You grant SELECT on a list of columns.
  fr: Vous accordez SELECT sur une liste de colonnes.
body:
  solution:
    en: |
      You run the following T-SQL statement in DW1:

      ```sql
      GRANT SELECT ON dbo.Customers (CustomerID, City, Segment) TO [Marketing];
      ```
    fr: |
      Vous exécutez l'instruction T-SQL suivante dans DW1 :

      ```sql
      GRANT SELECT ON dbo.Customers (CustomerID, City, Segment) TO [Marketing];
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      With the Read permission alone, Marketing can connect to DW1 but can't query any object until it gets a T-SQL grant. A column-level GRANT gives SELECT on the three columns only, so queries that reference CustomerName, Email, or Phone fail, and no other table becomes readable.
    fr: |
      Avec la seule autorisation Read, Marketing peut se connecter à DW1, mais ne peut interroger aucun objet tant qu'il n'a pas reçu d'autorisation T-SQL. Un GRANT au niveau des colonnes accorde SELECT sur les trois colonnes uniquement : les requêtes qui référencent CustomerName, Email ou Phone échouent, et aucune autre table ne devient lisible.
references:
  - title: Column-level security in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/column-level-security
  - title: Share your data and manage permissions
