id: dp700-1b-ws-role-engineers
objective: "1.3.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You have a Fabric workspace named WS-Eng that contains lakehouses, notebooks and Spark job definitions.

    A security group named SG-DataEng must be able to create Spark job definitions, run and cancel them, and write data to the lakehouse tables. Members of SG-DataEng must not be able to add people to WS-Eng.

    You need to assign a workspace role to SG-DataEng. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Eng qui contient des lakehouses, des notebooks et des définitions de tâche Spark.

    Un groupe de sécurité nommé SG-DataEng doit pouvoir créer des définitions de tâche Spark, les exécuter et les annuler, et écrire des données dans les tables des lakehouses. Les membres de SG-DataEng ne doivent pas pouvoir ajouter de personnes à WS-Eng.

    Vous devez attribuer un rôle d'espace de travail à SG-DataEng. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Viewer }
    - { id: b, text: Member }
    - { id: c, text: Contributor }
    - { id: d, text: Admin }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Contributor can create, edit and delete items, write lakehouse data, and run or cancel notebooks and Spark job definitions. It can't add people to the workspace, which starts with the Member role.
    fr: |
      Contributor peut créer, modifier et supprimer des éléments, écrire des données de lakehouse, et exécuter ou annuler des notebooks et des définitions de tâche Spark. Il ne peut pas ajouter de personnes à l'espace de travail, ce qui commence avec le rôle Member.
  options:
    a: { en: "Viewer can view items and run output but can't create items, run them or write data.", fr: "Viewer peut consulter les éléments et les résultats d'exécution, mais ne peut ni créer d'éléments, ni les exécuter, ni écrire de données." }
    b: { en: "Member can add people with the Member role or lower roles, which is not allowed here.", fr: "Member peut ajouter des personnes avec le rôle Member ou un rôle inférieur, ce qui n'est pas autorisé ici." }
    d: { en: "Admin can add or remove anyone and delete the workspace, far more than required.", fr: "Admin peut ajouter ou retirer n'importe qui et supprimer l'espace de travail, bien plus que nécessaire." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
