seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: Ana checks out a new branch in WS-Dev.
  fr: Ana extrait (check out) une nouvelle branche dans WS-Dev.
body:
  solution:
    en: |
      In the **Source control** pane of WS-Dev, Ana selects **Checkout new branch** to create a branch named **feature-ana** from dev. She edits Notebook1 and Pipeline1, commits them to feature-ana, and creates a pull request from feature-ana to dev in Azure DevOps.
    fr: |
      Dans le volet **Source control** de WS-Dev, Ana sélectionne **Checkout new branch** pour créer une branche nommée **feature-ana** à partir de dev. Elle modifie Notebook1 et Pipeline1, les valide (commit) dans feature-ana, puis crée une demande de tirage de feature-ana vers dev dans Azure DevOps.
answer: { value: false }
explanation:
  correct:
    en: |
      A workspace is connected to a single branch, so checking out a new branch would move the whole of WS-Dev, shared by the four engineers, to feature-ana, and Ana's edits would appear in WS-Dev at once. In addition, a Contributor can't change the branch of a workspace unless the admin enables the Allow users with at least Contributor role to change Git branch setting, which isn't the case here.
    fr: |
      Un espace de travail est connecté à une seule branche : extraire une nouvelle branche ferait passer tout WS-Dev, partagé par les quatre ingénieurs, sur feature-ana, et les modifications d'Ana apparaîtraient aussitôt dans WS-Dev. De plus, un Contributor ne peut pas changer la branche d'un espace de travail sauf si l'administrateur active le paramètre Allow users with at least Contributor role to change Git branch, ce qui n'est pas le cas ici.
references:
  - title: Development process using branch workspace
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/branched-workspace
