id: dp700-cs1c-foreach-parameter
objective: "1.4.3"
type: dropdown
caseStudy: dp700-cs1c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to meet ingestion requirement 3 for PL_Nightly and NB_Bronze. How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence d'ingestion 3 concernant PL_Nightly et NB_Bronze. Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template:
    en: |
      PL_Nightly
        ForEach activity "For each instrument"
          Items: [[items]]
          Notebook activity "Run NB_Bronze"
            Base parameter InstrumentId (String): [[value]]

      NB_Bronze
        The cell that contains InstrumentId = "" is [[cell]]
    fr: |
      PL_Nightly
        Activité ForEach "For each instrument"
          Items : [[items]]
          Activité Notebook "Run NB_Bronze"
            Paramètre de base InstrumentId (String) : [[value]]

      NB_Bronze
        La cellule qui contient InstrumentId = "" est [[cell]]
  slots:
    - id: items
      options:
        - { id: ivalue, text: "@activity('Get instruments').output.value" }
        - { id: ifirst, text: "@activity('Get instruments').output.firstRow" }
        - { id: iparam, text: "@pipeline().parameters.InstrumentId" }
    - id: value
      options:
        - { id: vparam, text: "@pipeline().parameters.InstrumentId" }
        - { id: vitem, text: "@item().InstrumentId" }
        - { id: vfirst, text: "@activity('Get instruments').output.firstRow.InstrumentId" }
    - id: cell
      options:
        - { id: cfirst, text: { en: "the first code cell of the notebook", fr: "la première cellule de code du notebook" } }
        - { id: cparam, text: { en: "toggled as the parameter cell", fr: "désignée comme cellule de paramètres" } }
        - { id: cmd, text: { en: "a Markdown cell", fr: "une cellule Markdown" } }
answer:
  values: { items: ivalue, value: vitem, cell: cparam }
explanation:
  correct:
    en: |-
      The ForEach activity iterates over the array of rows that the Lookup activity returns in its value output. Inside the loop, `@item()` returns the current element, so `@item().InstrumentId` passes the instrument of the current iteration to the base parameter. The notebook detects only the variables of its parameter cell as parameters, so the cell that defines InstrumentId must be toggled as the parameter cell for the base parameter to override its default value.
    fr: |-
      L'activité ForEach parcourt le tableau de lignes que l'activité Lookup retourne dans sa sortie value. Dans la boucle, `@item()` retourne l'élément courant ; `@item().InstrumentId` transmet donc l'instrument de l'itération courante au paramètre de base. Le notebook ne détecte comme paramètres que les variables de sa cellule de paramètres ; la cellule qui définit InstrumentId doit donc être désignée comme cellule de paramètres pour que le paramètre de base remplace sa valeur par défaut.
  options:
    ifirst:
      en: |-
        firstRow contains only the first row of the result, which is an object, not an array that ForEach can iterate over.
      fr: |-
        firstRow ne contient que la première ligne du résultat, qui est un objet et non un tableau que ForEach peut parcourir.
    vparam:
      en: |-
        A pipeline parameter has one value for the whole run, so every iteration would receive the same InstrumentId.
      fr: |-
        Un paramètre de pipeline a une seule valeur pour toute l'exécution ; chaque itération recevrait donc le même InstrumentId.
    vfirst:
      en: |-
        The first row of the Lookup output always returns the same instrument, whatever the iteration.
      fr: |-
        La première ligne de la sortie de Lookup retourne toujours le même instrument, quelle que soit l'itération.
    cfirst:
      en: |-
        The position of the cell does not matter; a variable is detected as a parameter only when its cell is the parameter cell.
      fr: |-
        La position de la cellule n'a pas d'importance ; une variable n'est détectée comme paramètre que si sa cellule est la cellule de paramètres.
references:
  - title: Transform data by running a notebook
    url: https://learn.microsoft.com/en-us/fabric/data-factory/notebook-activity
  - title: Transform data with a ForEach activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/foreach-activity
