id: dp700-1d-empty-exit-value
objective: "1.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace that contains notebooks named NB_Parent and NB_Child. NB_Child has the same default lakehouse as NB_Parent. NB_Parent contains the following code.

    ```text
    result = notebookutils.notebook.run("NB_Child", 600, {"load_date": "2026-11-16"})
    rows = int(result)
    ```

    NB_Child runs to the end without error in about two minutes, but the second line of NB_Parent fails because result is an empty string.

    Which two issues could cause this behavior?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient des notebooks nommés NB_Parent et NB_Child. NB_Child a le même lakehouse par défaut que NB_Parent. NB_Parent contient le code suivant.

    ```text
    result = notebookutils.notebook.run("NB_Child", 600, {"load_date": "2026-11-16"})
    rows = int(result)
    ```

    NB_Child s'exécute jusqu'au bout sans erreur en deux minutes environ, mais la deuxième ligne de NB_Parent échoue parce que result est une chaîne vide.

    Quels sont les deux problèmes qui pourraient provoquer ce comportement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "NB_Child calls notebookutils.notebook.exit inside a try/except block.", fr: "NB_Child appelle notebookutils.notebook.exit dans un bloc try/except." } }
    - { id: b, text: { en: "The timeout of 600 seconds is shorter than the default timeout of run().", fr: "Le délai d'expiration de 600 secondes est plus court que le délai par défaut de run()." } }
    - { id: c, text: { en: "The cell of NB_Child that defines load_date is not marked as the parameter cell.", fr: "La cellule de NB_Child qui définit load_date n'est pas marquée comme cellule de paramètres." } }
    - { id: d, text: { en: "NB_Child does not call notebookutils.notebook.exit.", fr: "NB_Child n'appelle pas notebookutils.notebook.exit." } }
    - { id: e, text: { en: "NB_Parent passes load_date as a string instead of a date value.", fr: "NB_Parent transmet load_date sous forme de chaîne au lieu d'une valeur de date." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      run() returns the exact string passed to notebookutils.notebook.exit() in the child, or an empty string when exit() is not called. An exit() call wrapped in exception handling does not take effect, so the child also ends without an exit value. Exit values are always strings, so the parent converts the result with int().
    fr: |
      run() renvoie la chaîne exacte passée à notebookutils.notebook.exit() dans l'enfant, ou une chaîne vide quand exit() n'est pas appelé. Un appel à exit() enveloppé dans une gestion d'exceptions ne prend pas effet : l'enfant se termine donc aussi sans valeur de sortie. Les valeurs de sortie sont toujours des chaînes, d'où la conversion par int() dans le parent.
  options:
    b: { en: "The default timeout of run() is 90 seconds, and 600 seconds is longer than the two-minute run; a timeout would raise an error, not return an empty string.", fr: "Le délai par défaut de run() est de 90 secondes, et 600 secondes dépassent l'exécution de deux minutes ; un dépassement lèverait une erreur et ne renverrait pas une chaîne vide." }
    c: { en: "Without a parameter cell, load_date keeps its default value, but the exit value is not affected.", fr: "Sans cellule de paramètres, load_date garde sa valeur par défaut, mais la valeur de sortie n'est pas affectée." }
    e: { en: "Arguments are passed to the parameter cell of the child as values; their type does not change the exit value that run() returns.", fr: "Les arguments sont transmis comme valeurs à la cellule de paramètres de l'enfant ; leur type ne change pas la valeur de sortie renvoyée par run()." }
references:
  - title: NotebookUtils notebook run and orchestration for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/notebookutils/notebookutils-notebook-run
