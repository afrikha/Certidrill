id: dp700-1a-airflow-stop-cost
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric capacity named **Cap-Air** that is dedicated to a workspace named **WS-Air**. The Apache Airflow runtime setting of WS-Air uses a custom pool named **AirPool** with **Small** nodes and autoscale on.

    The DAGs of WS-Air run only between 07:00 and 19:00. You need to stop all Apache Airflow capacity consumption between 19:00 and 07:00. No other workload runs on Cap-Air at night.

    Which two actions can you perform each evening? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une capacité Fabric nommée **Cap-Air** dédiée à un espace de travail nommé **WS-Air**. Le paramètre de runtime Apache Airflow de WS-Air utilise un pool personnalisé nommé **AirPool** avec des nœuds **Small** et la mise à l'échelle automatique activée.

    Les DAG de WS-Air ne s'exécutent qu'entre 07:00 et 19:00. Vous devez arrêter toute consommation de capacité par Apache Airflow entre 19:00 et 07:00. Aucune autre charge de travail ne s'exécute sur Cap-Air la nuit.

    Quelles sont les deux actions que vous pouvez effectuer chaque soir ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: e, text: { en: "Change Compute node size of AirPool to Small", fr: "Définir Compute node size d'AirPool sur Small" } }
    - { id: b, text: { en: "Turn off autoscale for AirPool", fr: "Désactiver la mise à l'échelle automatique d'AirPool" } }
    - { id: c, text: { en: "Pause Cap-Air", fr: "Suspendre Cap-Air" } }
    - { id: d, text: { en: "Set the number of extra nodes of AirPool to 0", fr: "Définir sur 0 le nombre de nœuds supplémentaires d'AirPool" } }
    - { id: a, text: { en: "Pause AirPool", fr: "Mettre AirPool en pause" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Custom pools don't shut down automatically when idle; their base nodes consume CUs as long as the pool runs. You can manually pause the custom pool or the whole Fabric capacity; while paused, the pool stops using CUs, and jobs can run again after you resume it, which takes a few minutes.
    fr: Les pools personnalisés ne s'arrêtent pas automatiquement quand ils sont inactifs ; leurs nœuds de base consomment des CU tant que le pool tourne. Vous pouvez mettre manuellement en pause le pool personnalisé ou toute la capacité Fabric ; pendant la pause, le pool cesse d'utiliser des CU, et les travaux peuvent reprendre après sa reprise, qui prend quelques minutes.
  options:
    b:
      en: Without autoscale, the base nodes still run and consume CUs.
      fr: Sans mise à l'échelle automatique, les nœuds de base tournent toujours et consomment des CU.
    d:
      en: Removing extra nodes leaves the three base nodes running.
      fr: Supprimer les nœuds supplémentaires laisse tourner les trois nœuds de base.
    e:
      en: AirPool already uses Small nodes, and a small pool still consumes about 5 CUs while it runs.
      fr: AirPool utilise déjà des nœuds Small, et un petit pool consomme toujours environ 5 CU tant qu'il tourne.
references:
  - title: Apache Airflow compute in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-compute
