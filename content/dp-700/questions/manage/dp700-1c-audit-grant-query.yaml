id: dp700-1c-audit-grant-query
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS_Sales that contains a warehouse named DW1. You are an Admin of WS_Sales, and SQL audit logs are enabled on DW1.

    An auditor named User1 has no workspace role; DW1 is shared with User1 with no additional permissions. User1 must run T-SQL queries that read the SQL audit events of DW1. User1 must not be able to change the audit configuration or open the audit files.

    You need to grant User1 the required access. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS_Sales qui contient un entrepôt nommé DW1. Vous êtes Admin de WS_Sales, et les journaux d'audit SQL sont activés sur DW1.

    Un auditeur nommé User1 n'a aucun rôle d'espace de travail ; DW1 est partagé avec User1 sans autorisation supplémentaire. User1 doit exécuter des requêtes T-SQL qui lisent les événements d'audit SQL de DW1. User1 ne doit pouvoir ni modifier la configuration d'audit ni ouvrir les fichiers d'audit.

    Vous devez accorder à User1 l'accès requis. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In DW1, run GRANT VIEW DATABASE SECURITY AUDIT TO [User1].", fr: "Dans DW1, exécuter GRANT VIEW DATABASE SECURITY AUDIT TO [User1]." } }
    - { id: b, text: { en: "In Manage permissions for DW1, grant User1 the Audit permission.", fr: "Dans Manage permissions de DW1, accorder à User1 l'autorisation Audit." } }
    - { id: c, text: { en: "Assign User1 the Admin role in WS_Sales.", fr: "Attribuer à User1 le rôle Admin dans WS_Sales." } }
    - { id: d, text: { en: "In DW1, run GRANT CONTROL ON DATABASE::DW1 TO [User1].", fr: "Dans DW1, exécuter GRANT CONTROL ON DATABASE::DW1 TO [User1]." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The VIEW DATABASE SECURITY AUDIT permission lets a user query the SQL audit logs with sys.fn_get_audit_file_v2 without a workspace Admin role. It only allows querying: it gives no access to the .XEL files and no right to change the audit configuration.
    fr: |
      L'autorisation VIEW DATABASE SECURITY AUDIT permet à un utilisateur d'interroger les journaux d'audit SQL avec sys.fn_get_audit_file_v2 sans rôle Admin d'espace de travail. Elle ne permet que l'interrogation : elle ne donne ni accès aux fichiers .XEL ni le droit de modifier la configuration d'audit.
  options:
    b: { en: "The Audit item permission lets User1 configure the audit logs as well as query them.", fr: "L'autorisation d'élément Audit permet à User1 de configurer les journaux d'audit en plus de les interroger." }
    c: { en: "Admins can configure auditing and browse the Audit folder, far beyond what User1 needs.", fr: "Les Admins peuvent configurer l'audit et parcourir le dossier Audit, bien au-delà des besoins de User1." }
    d: { en: "CONTROL on the database grants every permission in DW1, not the least privilege.", fr: "CONTROL sur la base de données accorde toutes les autorisations dans DW1, ce qui n'est pas le moindre privilège." }
references:
  - title: SQL audit logs in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-audit-logs
