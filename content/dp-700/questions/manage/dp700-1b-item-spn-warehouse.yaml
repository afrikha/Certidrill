id: dp700-1b-item-spn-warehouse
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Sales that contains a warehouse named DW_Sales and two reports. A reporting application authenticates as a Microsoft Entra service principal named SP-Report.

    SP-Report must read every table of DW_Sales by using T-SQL. SP-Report must not be able to modify data or items in WS-Sales. In the sharing dialog of DW_Sales, you can't select SP-Report.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Sales qui contient un entrepôt nommé DW_Sales et deux rapports. Une application de création de rapports s'authentifie en tant que principal de service Microsoft Entra nommé SP-Report.

    SP-Report doit lire toutes les tables de DW_Sales avec T-SQL. SP-Report ne doit pas pouvoir modifier de données ni d'éléments dans WS-Sales. Dans la boîte de dialogue de partage de DW_Sales, vous ne pouvez pas sélectionner SP-Report.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run GRANT SELECT ON SCHEMA::dbo TO [SP-Report] in DW_Sales.", fr: "Exécuter GRANT SELECT ON SCHEMA::dbo TO [SP-Report] dans DW_Sales." } }
    - { id: b, text: { en: "Assign SP-Report the Contributor role in WS-Sales.", fr: "Attribuer à SP-Report le rôle Contributor dans WS-Sales." } }
    - { id: c, text: { en: "Assign SP-Report the Viewer role in WS-Sales.", fr: "Attribuer à SP-Report le rôle Viewer dans WS-Sales." } }
    - { id: d, text: { en: "Share DW_Sales with the owner of SP-Report and select Read all data using SQL.", fr: "Partager DW_Sales avec le propriétaire de SP-Report et sélectionner Read all data using SQL." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A warehouse can't be shared directly with a service principal, but service principals can receive workspace roles. The Viewer role gives CONNECT and ReadData on each warehouse of the workspace, so SP-Report can read every table with T-SQL without being able to change data or items.
    fr: |
      Un entrepôt ne peut pas être partagé directement avec un principal de service, mais les principaux de service peuvent recevoir des rôles d'espace de travail. Le rôle Viewer donne CONNECT et ReadData sur chaque entrepôt de l'espace de travail : SP-Report peut lire toutes les tables avec T-SQL sans pouvoir modifier de données ni d'éléments.
  options:
    a: { en: "A GRANT creates the database user, but the connection fails without a workspace role or the item Read permission.", fr: "Un GRANT crée l'utilisateur de base de données, mais la connexion échoue sans rôle d'espace de travail ni autorisation Read sur l'élément." }
    b: { en: "Contributor has CONTROL on the warehouse and can modify data and items.", fr: "Contributor a CONTROL sur l'entrepôt et peut modifier des données et des éléments." }
    d: { en: "Sharing with the owner grants access to that user, not to the application's service principal.", fr: "Le partage avec le propriétaire accorde l'accès à cet utilisateur, pas au principal de service de l'application." }
references:
  - title: Share Your Warehouse and Manage Permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
  - title: Workspace Roles in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/workspace-roles
