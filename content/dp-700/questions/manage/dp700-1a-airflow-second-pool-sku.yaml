id: dp700-1a-airflow-second-pool-sku
objective: "1.1.4"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You have a Fabric F16 capacity named **Cap-Orch** that hosts a workspace named **WS-Orch1**. The Apache Airflow runtime setting of WS-Orch1 uses a custom pool with **Large** nodes and no extra nodes.

    You plan to create a workspace named **WS-Orch2** on Cap-Orch and give it a second custom pool with **Large** nodes and no extra nodes. Both pools will run all the time.

    You need to size Cap-Orch so that both pools run smoothly with some buffer, as Microsoft recommends. The solution must minimize cost.

    Which capacity SKU should you use?
  fr: |
    Vous disposez d'une capacité Fabric F16 nommée **Cap-Orch** qui héberge un espace de travail nommé **WS-Orch1**. Le paramètre de runtime Apache Airflow de WS-Orch1 utilise un pool personnalisé avec des nœuds **Large** et sans nœuds supplémentaires.

    Vous prévoyez de créer un espace de travail nommé **WS-Orch2** sur Cap-Orch et de lui donner un second pool personnalisé avec des nœuds **Large** et sans nœuds supplémentaires. Les deux pools tourneront en permanence.

    Vous devez dimensionner Cap-Orch pour que les deux pools s'exécutent sans difficulté avec une marge, comme le recommande Microsoft. La solution doit réduire les coûts au minimum.

    Quelle référence SKU de capacité devez-vous utiliser ?
body:
  options:
    - { id: f16, text: { en: "F16 (keep the current SKU)", fr: "F16 (conserver la référence SKU actuelle)" } }
    - { id: f32, text: "F32" }
    - { id: f64, text: "F64" }
    - { id: f128, text: "F128" }
answer: { optionId: f32 }
explanation:
  correct:
    en: The base nodes of a large custom pool consume about 10 CUs, and Microsoft recommends at least an F16 for one large pool. For several pools you add their needs, so two large pools need about 20 CUs, and the guidance gives F32 (32 CUs) to run them smoothly with some buffer.
    fr: "Les nœuds de base d'un grand pool personnalisé consomment environ 10 CU, et Microsoft recommande au moins une F16 pour un grand pool. Pour plusieurs pools, on additionne leurs besoins : deux grands pools demandent environ 20 CU, et les recommandations indiquent une F32 (32 CU) pour les exécuter sans difficulté avec une marge."
  options:
    f16:
      en: An F16 is the recommended minimum for one large pool; two large pools need about 20 CUs.
      fr: Une F16 est le minimum recommandé pour un seul grand pool ; deux grands pools demandent environ 20 CU.
    f64:
      en: An F64 also works but costs more than needed for about 20 CUs of base load.
      fr: Une F64 fonctionne aussi, mais coûte plus que nécessaire pour une charge de base d'environ 20 CU.
    f128:
      en: An F128 is far larger than two large pools require.
      fr: Une F128 est bien plus grande que ce qu'exigent deux grands pools.
references:
  - title: Apache Airflow compute in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-compute
