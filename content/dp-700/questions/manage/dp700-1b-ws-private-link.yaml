id: dp700-1b-ws-private-link
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant contains 40 workspaces. A workspace named WS-Finance contains a lakehouse and a warehouse with confidential data.

    WS-Finance must be reachable only from an Azure virtual network named VNet1, through a private endpoint. Users of the other workspaces must keep accessing them from the public internet.

    What should you configure?
  fr: |
    Votre locataire Fabric contient 40 espaces de travail. Un espace de travail nommé WS-Finance contient un lakehouse et un entrepôt avec des données confidentielles.

    WS-Finance ne doit être accessible que depuis un réseau virtuel Azure nommé VNet1, via un point de terminaison privé. Les utilisateurs des autres espaces de travail doivent continuer à y accéder depuis Internet.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A tenant-level private link, and block public internet access for the tenant", fr: "Une liaison privée au niveau du locataire, en bloquant l'accès Internet public pour le locataire" } }
    - { id: b, text: { en: "A managed private endpoint in WS-Finance that targets VNet1", fr: "Un point de terminaison privé managé dans WS-Finance qui cible VNet1" } }
    - { id: c, text: { en: "A workspace-level private link, and restrict inbound public access to WS-Finance", fr: "Une liaison privée au niveau de l'espace de travail, en restreignant l'accès public entrant à WS-Finance" } }
    - { id: d, text: { en: "A Microsoft Entra Conditional Access policy that targets Microsoft Fabric", fr: "Une stratégie d'accès conditionnel Microsoft Entra qui cible Microsoft Fabric" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A workspace-level private link maps one workspace to a virtual network through Azure Private Link. When inbound public access to that workspace is restricted, only resources in the approved virtual network, through a private endpoint, can reach it, and the other workspaces of the tenant aren't affected.
    fr: |
      Une liaison privée au niveau de l'espace de travail associe un espace de travail à un réseau virtuel via Azure Private Link. Quand l'accès public entrant à cet espace de travail est restreint, seules les ressources du réseau virtuel approuvé, via un point de terminaison privé, peuvent l'atteindre, et les autres espaces de travail du locataire ne sont pas affectés.
  options:
    a: { en: "A tenant-level private link with public access blocked would cut internet access to all 40 workspaces.", fr: "Une liaison privée au niveau du locataire avec blocage de l'accès public couperait l'accès Internet aux 40 espaces de travail." }
    b: { en: "Managed private endpoints are outbound connections from Fabric to data sources; they don't restrict who can reach the workspace.", fr: "Les points de terminaison privés managés sont des connexions sortantes de Fabric vers des sources de données ; ils ne limitent pas qui peut atteindre l'espace de travail." }
    d: { en: "Conditional Access applies to Fabric as a whole, not to one workspace, and doesn't route traffic through a private endpoint.", fr: "L'accès conditionnel s'applique à Fabric dans son ensemble, pas à un seul espace de travail, et il ne fait pas passer le trafic par un point de terminaison privé." }
references:
  - title: Overview of workspace-level private links
    url: https://learn.microsoft.com/en-us/fabric/security/security-workspace-level-private-links-overview
