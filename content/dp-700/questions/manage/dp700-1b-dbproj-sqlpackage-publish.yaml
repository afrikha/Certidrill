id: dp700-1b-dbproj-sqlpackage-publish
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an SDK-style SQL project named Sales.sqlproj that describes a SQL database in Fabric. An Azure DevOps pipeline builds the project and deploys it to a production SQL database in Fabric named SQL_Prod.

    You need the deployment step to update the schema of SQL_Prod to match the project. The step must stop if a change could lose data in SQL_Prod.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un projet SQL de style SDK nommé Sales.sqlproj qui décrit une base de données SQL dans Fabric. Un pipeline Azure DevOps génère le projet et le déploie sur une base de données SQL de production dans Fabric nommée SQL_Prod.

    L'étape de déploiement doit mettre à jour le schéma de SQL_Prod pour qu'il corresponde au projet. L'étape doit s'arrêter si une modification risque d'entraîner une perte de données dans SQL_Prod.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    dotnet build Sales.sqlproj
    sqlpackage /Action:[[action]] /SourceFile:bin/Debug/Sales.dacpac \
      /TargetConnectionString:"$TARGET_CONNECTION" /p:[[prop]]=true
  slots:
    - id: action
      options:
        - { id: extract, text: Extract }
        - { id: publish, text: Publish }
        - { id: export, text: Export }
        - { id: report, text: DeployReport }
    - id: prop
      options:
        - { id: drop, text: DropObjectsNotInSource }
        - { id: smart, text: GenerateSmartDefaults }
        - { id: block, text: BlockOnPossibleDataLoss }
        - { id: options, text: ScriptDatabaseOptions }
answer:
  values: { action: publish, prop: block }
explanation:
  correct:
    en: "The Publish action compares the .dacpac with the target and applies the changes needed to make the schema match. `BlockOnPossibleDataLoss=true` stops the deployment when a change, such as dropping a column or narrowing a type, could lose data. True is also the default value; setting it explicitly keeps the step safe if a publish profile changes it."
    fr: "L'action Publish compare le fichier .dacpac à la cible et applique les modifications nécessaires pour que le schéma corresponde. `BlockOnPossibleDataLoss=true` arrête le déploiement quand une modification, comme la suppression d'une colonne ou la réduction d'un type, risque d'entraîner une perte de données. True est aussi la valeur par défaut ; la définir explicitement protège l'étape si un profil de publication la modifie."
  options:
    extract: { en: "Extract creates a .dacpac from an existing database; it doesn't deploy one.", fr: "Extract crée un fichier .dacpac à partir d'une base de données existante ; il n'en déploie pas." }
    export: { en: "Export writes the schema and data of a database to a .bacpac file.", fr: "Export écrit le schéma et les données d'une base de données dans un fichier .bacpac." }
    report: { en: "DeployReport only produces an XML report of the changes; it doesn't apply them.", fr: "DeployReport produit seulement un rapport XML des modifications ; il ne les applique pas." }
    drop: { en: "DropObjectsNotInSource drops target objects that aren't in the project, which increases the risk of losing data.", fr: "DropObjectsNotInSource supprime les objets de la cible absents du projet, ce qui augmente le risque de perte de données." }
    smart: { en: "GenerateSmartDefaults provides default values for new non-nullable columns; it doesn't stop a risky deployment.", fr: "GenerateSmartDefaults fournit des valeurs par défaut pour les nouvelles colonnes non nullables ; il n'arrête pas un déploiement risqué." }
    options: { en: "ScriptDatabaseOptions controls whether database options are scripted; it has nothing to do with data loss.", fr: "ScriptDatabaseOptions détermine si les options de base de données sont incluses dans le script ; il n'a aucun rapport avec la perte de données." }
references:
  - title: SqlPackage Publish parameters, properties, and SQLCMD variables
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-publish
  - title: SqlPackage
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage
