id: dp700-1c-endorse-badges
objective: "1.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Your organization has enabled certification and master data endorsement in Fabric. You have the following items:

    - LH_Customers: the lakehouse that is the single authoritative source of customer codes for the whole company
    - DW_Finance: a warehouse that the data governance team reviewed and confirmed meets the company's quality standards
    - LH_Sandbox: a lakehouse that its author considers ready for colleagues to reuse

    Which endorsement should you apply to each item? To answer, drag the appropriate endorsements to the correct items. Each endorsement may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre organisation a activé la certification et l'approbation Master data dans Fabric. Vous disposez des éléments suivants :

    - LH_Customers : le lakehouse qui est la source unique faisant autorité pour les codes client de toute l'entreprise
    - DW_Finance : un entrepôt que l'équipe de gouvernance des données a vérifié et dont elle a confirmé la conformité aux standards de qualité de l'entreprise
    - LH_Sandbox : un lakehouse que son auteur juge prêt à être réutilisé par ses collègues

    Quelle approbation devez-vous appliquer à chaque élément ? Pour répondre, faites glisser les approbations appropriées vers les éléments correspondants. Chaque approbation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: promoted, text: Promoted }
    - { id: certified, text: Certified }
    - { id: master, text: Master data }
    - { id: discover, text: Make discoverable }
    - { id: favorite, text: { en: "Favorite", fr: "Favori" } }
  targets:
    - { id: lhc, text: LH_Customers }
    - { id: dwf, text: DW_Finance }
    - { id: lhs, text: LH_Sandbox }
answer:
  mapping: { lhc: master, dwf: certified, lhs: promoted }
explanation:
  correct:
    en: |
      Master data marks the core, single source of truth for data such as customer codes. Certified means an authorized reviewer confirmed that the item meets the organization's quality standards. Promoted means the creators think the item is ready for sharing and reuse.
    fr: |
      Master data marque la source de vérité unique pour des données de base comme les codes client. Certified signifie qu'un réviseur autorisé a confirmé que l'élément respecte les standards de qualité de l'organisation. Promoted signifie que les créateurs jugent l'élément prêt à être partagé et réutilisé.
  options:
    discover: { en: "Make discoverable is an option for semantic models when you promote or certify them, not an endorsement badge.", fr: "Make discoverable est une option des modèles sémantiques lors de leur promotion ou certification, pas un badge d'approbation." }
    favorite: { en: "Marking an item as a favorite is personal and isn't an endorsement.", fr: "Marquer un élément comme favori est personnel et ne constitue pas une approbation." }
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
