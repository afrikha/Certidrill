id: dp700-1a-spark-environment-compute
objective: "1.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are an admin of a Fabric workspace named **WS-Ops**. You have published an Environment item named **Env-Std** that contains the approved runtime version and libraries.

    You need to configure the Spark settings of WS-Ops to meet the following requirements:

    - Every notebook and Spark job definition uses the runtime and libraries of Env-Std unless it selects something else.
    - Users can't change the driver and executor cores or memory of their own items.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur d'un espace de travail Fabric nommé **WS-Ops**. Vous avez publié un élément Environment nommé **Env-Std** qui contient la version de runtime et les bibliothèques approuvées.

    Vous devez configurer les paramètres Spark de WS-Ops pour répondre aux exigences suivantes :

    - Chaque notebook et chaque définition de travail Spark utilise le runtime et les bibliothèques d'Env-Std, sauf s'il choisit autre chose.
    - Les utilisateurs ne peuvent pas modifier les cœurs ni la mémoire du pilote et des exécuteurs de leurs propres éléments.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Env-Std: [[env]]

      Customize compute configurations for items: [[compute]]
    fr: |
      Env-Std : [[env]]

      Customize compute configurations for items : [[compute]]
  slots:
    - id: env
      options:
        - { id: default, text: { en: "Select it as the default environment of the workspace", fr: "Le sélectionner comme environnement par défaut de l'espace de travail" } }
        - { id: pool, text: { en: "Select it in Default pool for workspace", fr: "Le sélectionner dans Default pool for workspace" } }
        - { id: attach, text: { en: "Attach it to the starter pool from Pool details", fr: "L'attacher au pool de démarrage depuis Pool details" } }
    - id: compute
      options:
        - { id: off, text: { en: "Off", fr: "Désactivé (Off)" } }
        - { id: on, text: { en: "On", fr: "Activé (On)" } }
        - { id: env-only, text: { en: "On, with Env-Std as the only allowed environment", fr: "Activé, avec Env-Std comme seul environnement autorisé" } }
answer:
  values: { env: default, compute: off }
explanation:
  correct:
    en: In the Environment section of the Spark settings, a workspace admin can select a published environment as the workspace default, so items inherit its runtime, Spark properties and libraries. When Customize compute configurations for items is off, users can't adjust driver and executor cores and memory per item, and the default pool's compute configuration applies to all environments of the workspace.
    fr: Dans la section Environment des paramètres Spark, un administrateur de l'espace de travail peut sélectionner un environnement publié comme environnement par défaut de l'espace de travail, afin que les éléments héritent de son runtime, de ses propriétés Spark et de ses bibliothèques. Quand Customize compute configurations for items est désactivé, les utilisateurs ne peuvent pas ajuster les cœurs et la mémoire du pilote et des exécuteurs par élément, et la configuration de calcul du pool par défaut s'applique à tous les environnements de l'espace de travail.
  options:
    pool:
      en: Default pool for workspace lists Spark pools (the starter pool or custom pools), not environments.
      fr: Default pool for workspace liste des pools Spark (le pool de démarrage ou des pools personnalisés), pas des environnements.
    attach:
      en: Pool details only adjusts the pool's node and executor limits; environments aren't attached there.
      fr: Pool details ajuste seulement les limites de nœuds et d'exécuteurs du pool ; les environnements ne s'y attachent pas.
    on:
      en: When the toggle is on, users can change driver and executor sizes for their items, which the requirement forbids.
      fr: Quand le bouton est activé, les utilisateurs peuvent modifier la taille du pilote et des exécuteurs de leurs éléments, ce que l'exigence interdit.
    env-only:
      en: The toggle has no option that restricts it to one environment; turning it on lets users change compute sizes.
      fr: Le bouton n'a pas d'option qui le limite à un environnement ; l'activer permet aux utilisateurs de modifier les tailles de calcul.
references:
  - title: Workspace administration settings in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
