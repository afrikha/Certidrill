id: dp700-1a-git-connect-role
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Git integration is enabled for your Fabric tenant. A workspace named **WS-Sales** isn't connected to Git yet.

    A data engineer named **Ana** has the **Member** role on WS-Sales, and the **Read** and **Contribute** permissions on an Azure Repos repository named **sales-fabric**. When Ana opens **Git integration** in the workspace settings, she can't connect WS-Sales to sales-fabric.

    You need to ensure that Ana can connect WS-Sales to the repository. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    L'intégration Git est activée pour votre locataire Fabric. Un espace de travail nommé **WS-Sales** n'est pas encore connecté à Git.

    Une ingénieure de données nommée **Ana** dispose du rôle **Member** sur WS-Sales, ainsi que des autorisations **Read** et **Contribute** sur un dépôt Azure Repos nommé **sales-fabric**. Quand Ana ouvre **Git integration** dans les paramètres de l'espace de travail, elle ne peut pas connecter WS-Sales à sales-fabric.

    Vous devez faire en sorte qu'Ana puisse connecter WS-Sales au dépôt. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: b, text: { en: "Assign Ana the Admin role on WS-Sales", fr: "Attribuer à Ana le rôle Admin sur WS-Sales" } }
    - { id: a, text: { en: "Grant Ana the Create branch permission on sales-fabric", fr: "Accorder à Ana l'autorisation Create branch sur sales-fabric" } }
    - { id: c, text: { en: "Turn on Allow users with at least Contributor role to change Git branch for WS-Sales", fr: "Activer Allow users with at least Contributor role to change Git branch pour WS-Sales" } }
    - { id: d, text: { en: "Assign Ana the Fabric Administrator role in Microsoft Entra ID", fr: "Attribuer à Ana le rôle Fabric Administrator dans Microsoft Entra ID" } }
answer: { optionId: b }
explanation:
  correct:
    en: Only a workspace Admin can connect, sync or disconnect a workspace and a Git repository; on the Git side, connecting only needs Read. Once the workspace is connected, Members and Contributors can commit and update with their own Git permissions.
    fr: Seul un Admin de l'espace de travail peut connecter, synchroniser ou déconnecter un espace de travail et un dépôt Git ; côté Git, la connexion ne demande que Read. Une fois l'espace de travail connecté, les membres et contributeurs peuvent faire des commits et des mises à jour avec leurs propres autorisations Git.
  options:
    a:
      en: Create branch is needed to create branches or branch out; it doesn't let a Member connect the workspace.
      fr: Create branch est nécessaire pour créer des branches ou faire un branch out ; elle ne permet pas à un Member de connecter l'espace de travail.
    c:
      en: This setting requires an active Git connection and only lets Members and Contributors switch or create branches, not connect the workspace.
      fr: Ce paramètre exige une connexion Git active et permet seulement aux membres et contributeurs de changer ou de créer des branches, pas de connecter l'espace de travail.
    d:
      en: A tenant-wide admin role grants far more than needed; the connection only requires the workspace Admin role.
      fr: Un rôle d'administration à l'échelle du locataire accorde bien plus que nécessaire ; la connexion exige seulement le rôle Admin de l'espace de travail.
references:
  - title: Basic concepts in Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process
