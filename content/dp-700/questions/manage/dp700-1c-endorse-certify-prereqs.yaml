id: dp700-1c-endorse-certify-prereqs
objective: "1.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric tenant in which item certification is disabled. A workspace named WS_Finance contains a warehouse named DW_Ledger.

    A finance controller named User1 has the Viewer role in WS_Finance. User1 must be able to certify DW_Ledger. User1 must not be able to change tenant settings.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un locataire Fabric dans lequel la certification des éléments est désactivée. Un espace de travail nommé WS_Finance contient un entrepôt nommé DW_Ledger.

    Une contrôleuse financière nommée User1 a le rôle Viewer dans WS_Finance. User1 doit pouvoir certifier DW_Ledger. User1 ne doit pas pouvoir modifier les paramètres du locataire.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable certification in the tenant settings and specify a security group that contains User1.", fr: "Activer la certification dans les paramètres du locataire et indiquer un groupe de sécurité qui contient User1." } }
    - { id: b, text: { en: "Assign User1 the Contributor role in WS_Finance.", fr: "Attribuer à User1 le rôle Contributor dans WS_Finance." } }
    - { id: c, text: { en: "Assign User1 the Fabric administrator role.", fr: "Attribuer à User1 le rôle d'administrateur Fabric." } }
    - { id: d, text: { en: "Promote DW_Ledger before User1 certifies it.", fr: "Promouvoir DW_Ledger avant que User1 le certifie." } }
    - { id: e, text: { en: "Share DW_Ledger with User1 and select the Share option.", fr: "Partager DW_Ledger avec User1 en sélectionnant l'option Share." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Certification is available only after a Fabric administrator enables it, and only to members of the security groups listed in the setting. A certifier also needs write permission on the item, which the Viewer role doesn't give; Contributor is the lowest workspace role with write permission.
    fr: |
      La certification n'est disponible qu'une fois activée par un administrateur Fabric, et seulement pour les membres des groupes de sécurité indiqués dans le paramètre. Un certificateur a aussi besoin de l'autorisation d'écriture sur l'élément, que le rôle Viewer ne donne pas ; Contributor est le rôle d'espace de travail le plus bas avec l'autorisation d'écriture.
  options:
    c: { en: "The Fabric administrator role lets User1 change tenant settings, which is forbidden, and still doesn't give write permission on DW_Ledger.", fr: "Le rôle d'administrateur Fabric permettrait à User1 de modifier les paramètres du locataire, ce qui est interdit, et ne donne toujours pas l'autorisation d'écriture sur DW_Ledger." }
    d: { en: "Promotion isn't a prerequisite for certification.", fr: "La promotion n'est pas un prérequis de la certification." }
    e: { en: "Reshare permission lets User1 share the item but doesn't give write permission.", fr: "L'autorisation Reshare permet à User1 de partager l'élément, mais ne donne pas l'autorisation d'écriture." }
references:
  - title: Enable item certification
    url: https://learn.microsoft.com/en-us/fabric/admin/endorsement-setup
  - title: Endorse Fabric and Power BI items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/endorsement-promote-certify
