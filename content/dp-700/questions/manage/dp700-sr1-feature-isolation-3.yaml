series: dp700-sr1-feature-isolation
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: Ana branches out to a new workspace.
  fr: Ana crée une branche vers un nouvel espace de travail (branch out).
body:
  solution:
    en: |
      From the **Source control** pane of WS-Dev, Ana uses **Branch out to new workspace** to create a workspace named **WS-Ana** connected to a new branch named **feature-ana**. She edits Notebook1 and Pipeline1 in WS-Ana, commits them to feature-ana, and creates a pull request from feature-ana to dev in Azure DevOps. After the pull request is merged, an engineer selects **Update** in the Source control pane of WS-Dev.
    fr: |
      Depuis le volet **Source control** de WS-Dev, Ana utilise **Branch out to new workspace** pour créer un espace de travail nommé **WS-Ana** connecté à une nouvelle branche nommée **feature-ana**. Elle modifie Notebook1 et Pipeline1 dans WS-Ana, les valide (commit) dans feature-ana, puis crée une demande de tirage de feature-ana vers dev dans Azure DevOps. Une fois la demande de tirage fusionnée, un ingénieur sélectionne **Update** dans le volet Source control de WS-Dev.
answer: { value: true }
explanation:
  correct:
    en: |
      Branching out creates a new branch from dev and a separate workspace synced to it, so Ana works in her own runtime environment while WS-Dev stays on dev. Branching out to a new workspace needs the Contributor role, the Read and Create branch Git permissions, and the right to create workspaces, which Ana has. Her changes reach dev only through the reviewed pull request, and the Update brings the merged commit into WS-Dev.
    fr: |
      La création d'une branche vers un nouvel espace de travail crée une nouvelle branche à partir de dev et un espace de travail distinct synchronisé avec elle : Ana travaille dans son propre environnement d'exécution, tandis que WS-Dev reste sur dev. Cette opération nécessite le rôle Contributor, les autorisations Git Read et Create branch, et le droit de créer des espaces de travail, ce dont Ana dispose. Ses modifications n'atteignent dev que par la demande de tirage examinée, et Update apporte la validation fusionnée dans WS-Dev.
references:
