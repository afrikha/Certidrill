id: dp700-1b-granular-tsql-script
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a schema named Sales. You shared DW1 with a security group named Analysts without additional permissions.

    Analysts must meet the following requirements:

    - Query every table and view of the Sales schema, including the tables added later, except the Sales.Commission table.
    - Run a stored procedure named Sales.usp_MonthlyReport.

    How should you complete the T-SQL statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient un schéma nommé Sales. Vous avez partagé DW1 avec un groupe de sécurité nommé Analysts sans autorisation supplémentaire.

    Analysts doit répondre aux exigences suivantes :

    - Interroger toutes les tables et vues du schéma Sales, y compris les tables ajoutées plus tard, sauf la table Sales.Commission.
    - Exécuter une procédure stockée nommée Sales.usp_MonthlyReport.

    Comment devez-vous compléter les instructions T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    GRANT SELECT ON [[scope]]::Sales TO [Analysts];
    [[verb]] SELECT ON OBJECT::Sales.Commission TO [Analysts];
    GRANT [[perm]] ON OBJECT::Sales.usp_MonthlyReport TO [Analysts];
  slots:
    - id: scope
      options:
        - { id: database, text: DATABASE }
        - { id: schema, text: SCHEMA }
        - { id: object, text: OBJECT }
    - id: verb
      options:
        - { id: revoke, text: REVOKE }
        - { id: grant, text: GRANT }
        - { id: deny, text: DENY }
    - id: perm
      options:
        - { id: execute, text: EXECUTE }
        - { id: select, text: SELECT }
        - { id: viewdef, text: VIEW DEFINITION }
answer:
  values: { scope: schema, verb: deny, perm: execute }
explanation:
  correct:
    en: "A grant on `SCHEMA::Sales` covers every table and view of the schema, including objects created later. `DENY` on Sales.Commission overrides the schema-level grant for that table. `EXECUTE` on the procedure lets the group run it."
    fr: "Une autorisation sur `SCHEMA::Sales` couvre toutes les tables et vues du schéma, y compris les objets créés plus tard. `DENY` sur Sales.Commission l'emporte sur l'autorisation au niveau du schéma pour cette table. `EXECUTE` sur la procédure permet au groupe de l'exécuter."
  options:
    database: { en: "The DATABASE scope doesn't take a schema name such as Sales.", fr: "L'étendue DATABASE ne prend pas de nom de schéma comme Sales." }
    object: { en: "Sales is a schema, not a table or view.", fr: "Sales est un schéma, pas une table ni une vue." }
    revoke: { en: "REVOKE removes an explicit permission on the table; the schema-level grant would still allow access.", fr: "REVOKE retire une autorisation explicite sur la table ; l'autorisation au niveau du schéma permettrait toujours l'accès." }
    grant: { en: "GRANT would allow access to the table that must stay hidden.", fr: "GRANT autoriserait l'accès à la table qui doit rester masquée." }
    select: { en: "SELECT doesn't apply to running a stored procedure.", fr: "SELECT ne s'applique pas à l'exécution d'une procédure stockée." }
    viewdef: { en: "VIEW DEFINITION shows the procedure's code without allowing the group to run it.", fr: "VIEW DEFINITION affiche le code de la procédure sans permettre au groupe de l'exécuter." }
references:
  - title: SQL granular permissions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-granular-permissions
