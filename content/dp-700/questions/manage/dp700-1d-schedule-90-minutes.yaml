id: dp700-1d-schedule-90-minutes
objective: "1.4.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Telemetry.

    You need to schedule PL_Telemetry to run every 90 minutes, starting on December 1, 2026, with no planned end.

    How should you configure the schedule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Telemetry.

    Vous devez planifier PL_Telemetry pour qu'il s'exécute toutes les 90 minutes, à partir du 1er décembre 2026, sans fin prévue.

    Comment devez-vous configurer la planification ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template:
    en: |
      Schedule for PL_Telemetry
        Recurrence type:  [[rec]]
        Every:            [[every]]
        Start:            12/01/2026 12:00 AM
        End:              [[end]]
    fr: |
      Planification de PL_Telemetry
        Type de récurrence :  [[rec]]
        Toutes les :          [[every]]
        Début :               12/01/2026 12:00 AM
        Fin :                 [[end]]
  slots:
    - id: rec
      options:
        - { id: minute, text: { en: "Minute-based", fr: "Par minute" } }
        - { id: hourly, text: { en: "Hourly", fr: "Toutes les heures" } }
        - { id: daily, text: { en: "Daily", fr: "Quotidienne" } }
    - id: every
      options:
        - { id: n90, text: "90" }
        - { id: n15, text: "1.5" }
        - { id: n60, text: "60" }
    - id: end
      options:
        - { id: empty, text: { en: "(empty, no end date)", fr: "(vide, aucune date de fin)" } }
        - { id: far, text: "01/01/2099 12:00 AM" }
        - { id: same, text: "12/01/2026 11:59 PM" }
answer:
  values: { rec: minute, every: n90, end: far }
explanation:
  correct:
    en: |
      A minute-based recurrence accepts an interval of 1 to 720 minutes, so it can run every 90 minutes, which an hourly recurrence (whole hours) cannot express. Open-ended schedules are not supported: a schedule needs an end date, so a permanent schedule uses a distant date such as 01/01/2099.
    fr: |
      Une récurrence par minute accepte un intervalle de 1 à 720 minutes : elle peut donc s'exécuter toutes les 90 minutes, ce qu'une récurrence horaire (en heures entières) ne peut pas exprimer. Les planifications sans fin ne sont pas prises en charge : une planification exige une date de fin, et une planification permanente utilise donc une date lointaine comme 01/01/2099.
  options:
    hourly: { en: "An hourly recurrence runs every 1 to 72 whole hours; 90 minutes is not a whole number of hours.", fr: "Une récurrence horaire s'exécute toutes les 1 à 72 heures entières ; 90 minutes ne font pas un nombre entier d'heures." }
    daily: { en: "A daily recurrence runs at up to 10 set times a day, not every 90 minutes.", fr: "Une récurrence quotidienne s'exécute à 10 heures fixes par jour au maximum, pas toutes les 90 minutes." }
    empty: { en: "A schedule must have both a start and an end date.", fr: "Une planification doit avoir une date de début et une date de fin." }
    same: { en: "An end on the first day would stop the schedule after December 1, 2026.", fr: "Une fin le premier jour arrêterait la planification après le 1er décembre 2026." }
references:
  - title: Job Scheduler in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs
