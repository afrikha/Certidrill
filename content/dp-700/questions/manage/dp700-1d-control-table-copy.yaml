id: dp700-1d-control-table-copy
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Bronze. Adatum has an Azure SQL database named OpsDB that contains about 120 tables to copy every night to LH_Bronze.

    A table named dbo.LoadConfig in OpsDB lists the schema and name of each table to copy. The data team adds rows to dbo.LoadConfig every week, and new tables must be copied from the next run without anyone editing the Fabric items. The team knows SQL and JSON but not Spark or Power Query.

    What should you create?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Bronze. Adatum dispose d'une base de données Azure SQL nommée OpsDB qui contient environ 120 tables à copier chaque nuit dans LH_Bronze.

    Une table nommée dbo.LoadConfig dans OpsDB liste le schéma et le nom de chaque table à copier. L'équipe données ajoute des lignes à dbo.LoadConfig chaque semaine, et les nouvelles tables doivent être copiées dès l'exécution suivante sans que personne ne modifie les éléments Fabric. L'équipe connaît SQL et JSON, mais ni Spark ni Power Query.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: "A copy job that selects the 120 tables of OpsDB and copies them to LH_Bronze on a nightly schedule"
        fr: "Un travail de copie qui sélectionne les 120 tables d'OpsDB et les copie dans LH_Bronze selon une planification nocturne"
    - id: b
      text:
        en: "A Dataflow Gen2 that contains one query for each table listed in dbo.LoadConfig and has LH_Bronze as its data destination"
        fr: "Un Dataflow Gen2 qui contient une requête pour chaque table listée dans dbo.LoadConfig et a LH_Bronze comme destination de données"
    - id: c
      text:
        en: "A pipeline with a Lookup activity that reads dbo.LoadConfig and a ForEach activity that runs a parameterized Copy data activity"
        fr: "Un pipeline avec une activité Lookup qui lit dbo.LoadConfig et une activité ForEach qui exécute une activité Copy data paramétrée"
    - id: d
      text:
        en: "A notebook that reads dbo.LoadConfig and loops over its rows to copy each table to LH_Bronze"
        fr: "Un notebook qui lit dbo.LoadConfig et parcourt ses lignes pour copier chaque table dans LH_Bronze"
answer: { optionId: c }
explanation:
  correct:
    en: |
      A metadata-driven pipeline reads the control table at run time: the Lookup activity returns the rows of dbo.LoadConfig, the ForEach activity iterates over them, and the Copy data activity uses @item() values for the source table and the destination. A row added to dbo.LoadConfig is copied on the next run, and the pipeline needs only SQL and JSON expressions.
    fr: |
      Un pipeline piloté par les métadonnées lit la table de contrôle au moment de l'exécution : l'activité Lookup renvoie les lignes de dbo.LoadConfig, l'activité ForEach les parcourt et l'activité Copy data utilise des valeurs @item() pour la table source et la destination. Une ligne ajoutée à dbo.LoadConfig est copiée à l'exécution suivante, et le pipeline n'exige que du SQL et des expressions JSON.
  options:
    a: { en: "A copy job copies the tables selected when it is configured; a table added to dbo.LoadConfig would require someone to edit the job.", fr: "Un travail de copie copie les tables sélectionnées lors de sa configuration ; une table ajoutée à dbo.LoadConfig obligerait quelqu'un à modifier le travail." }
    b: { en: "The queries of a dataflow are authored one by one in Power Query, a skill the team lacks, and every new table would require editing the dataflow.", fr: "Les requêtes d'un dataflow se créent une par une dans Power Query, une compétence que l'équipe n'a pas, et chaque nouvelle table exigerait de modifier le dataflow." }
    d: { en: "A notebook would read the control table dynamically, but it requires Spark code that the team does not know.", fr: "Un notebook lirait la table de contrôle dynamiquement, mais il exige du code Spark que l'équipe ne connaît pas." }
references:
  - title: Lookup activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/lookup-activity
  - title: Transform data with a ForEach activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/foreach-activity
