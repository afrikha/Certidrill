id: dp700-cs2a-airflow-pool
objective: "1.1.4"
type: single
caseStudy: dp700-cs2a-blue-yonder
difficulty: 1
status: draft
stem:
  en: You need to configure BYA-Fleet to meet the orchestration requirement. What should you do?
  fr: Vous devez configurer BYA-Fleet pour satisfaire l'exigence d'orchestration. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the Spark compute settings, set the default pool of the workspace to Starter Pool", fr: "Dans les paramètres de calcul Spark, définir Starter Pool comme pool par défaut de l'espace de travail" } }
    - { id: b, text: { en: "In the Apache Airflow runtime settings, keep the starter pool and add extra nodes to it", fr: "Dans les paramètres du runtime Apache Airflow, conserver le pool de démarrage et lui ajouter des nœuds supplémentaires" } }
    - { id: c, text: { en: "In the Spark compute settings, turn on Reserve maximum cores for active Spark jobs", fr: "Dans les paramètres de calcul Spark, activer Reserve maximum cores for active Spark jobs" } }
    - { id: d, text: { en: "In the Apache Airflow runtime settings, create a custom pool and use it as the default", fr: "Dans les paramètres du runtime Apache Airflow, créer un pool personnalisé et l'utiliser par défaut" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Apache Airflow runtime settings of a workspace offer a starter pool and custom pools. The starter pool is deprovisioned after 20 minutes of inactivity and can take up to five minutes to resume, so it is suggested for development. A custom pool is always on until it is paused manually, and you can set its node size, autoscale and extra nodes, which makes it the choice for production.
    fr: |
      Les paramètres du runtime Apache Airflow d'un espace de travail proposent un pool de démarrage et des pools personnalisés. Le pool de démarrage est libéré après 20 minutes d'inactivité et peut mettre jusqu'à cinq minutes à reprendre : il est conseillé pour le développement. Un pool personnalisé reste actif jusqu'à ce qu'il soit mis en pause manuellement, et vous pouvez définir sa taille de nœud, la mise à l'échelle automatique et des nœuds supplémentaires : c'est le choix pour la production.
  options:
    a: { en: "The Spark default pool applies to notebooks and Spark job definitions, not to the Airflow runtime.", fr: "Le pool Spark par défaut s'applique aux notebooks et aux définitions de tâche Spark, pas au runtime Airflow." }
    b: { en: "Node size, autoscale and extra nodes are settings of a custom pool; the starter pool still shuts down after 20 minutes of inactivity.", fr: "La taille de nœud, la mise à l'échelle automatique et les nœuds supplémentaires sont des paramètres d'un pool personnalisé ; le pool de démarrage s'arrête toujours après 20 minutes d'inactivité." }
    c: { en: "This setting controls the admission of Spark jobs; it has no effect on the Airflow runtime.", fr: "Ce paramètre contrôle l'admission des tâches Spark ; il n'a aucun effet sur le runtime Airflow." }
references:
  - title: Apache Airflow Job workspace settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-workspace-settings
