id: dp700-1c-label-protection-policy
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Your organization uses sensitivity labels in Fabric. Lakehouses, warehouses and notebooks in several workspaces carry a label named Finance Restricted, which is scoped to Files & other data assets and has the Control access protection setting.

    You need to ensure that only the members of a security group named FinanceTeam can access the items labeled Finance Restricted, even if other users have a workspace role or item permissions on them. The solution must keep working when the label is applied to new items in any workspace.

    What should you do?
  fr: |
    Votre organisation utilise les étiquettes de confidentialité dans Fabric. Des lakehouses, des entrepôts et des notebooks de plusieurs espaces de travail portent une étiquette nommée Finance Restricted, dont l'étendue est Files & other data assets et qui comporte le paramètre de protection Control access.

    Vous devez faire en sorte que seuls les membres d'un groupe de sécurité nommé FinanceTeam puissent accéder aux éléments étiquetés Finance Restricted, même si d'autres utilisateurs ont un rôle d'espace de travail ou des autorisations d'élément sur eux. La solution doit continuer à fonctionner quand l'étiquette est appliquée à de nouveaux éléments, dans n'importe quel espace de travail.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a OneLake security role in each lakehouse and add FinanceTeam to it.", fr: "Créer un rôle de sécurité OneLake dans chaque lakehouse et y ajouter FinanceTeam." } }
    - { id: b, text: { en: "Create a Microsoft Purview protection policy for Finance Restricted that allows FinanceTeam.", fr: "Créer une stratégie de protection Microsoft Purview pour Finance Restricted qui autorise FinanceTeam." } }
    - { id: c, text: { en: "Set Finance Restricted as the default label of a domain that contains the workspaces.", fr: "Définir Finance Restricted comme étiquette par défaut d'un domaine qui contient les espaces de travail." } }
    - { id: d, text: { en: "Certify the labeled items and authorize only FinanceTeam to certify.", fr: "Certifier les éléments étiquetés et n'autoriser que FinanceTeam à certifier." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Purview protection policy is tied to one sensitivity label. For every Fabric item that carries the label, the users and groups named in the policy keep their existing permissions, and everyone else is blocked, whatever their workspace role. The policy follows the label, so new labeled items are protected too.
    fr: |
      Une stratégie de protection Purview est liée à une étiquette de confidentialité. Pour chaque élément Fabric qui porte l'étiquette, les utilisateurs et groupes nommés dans la stratégie gardent leurs autorisations existantes, et tous les autres sont bloqués, quel que soit leur rôle d'espace de travail. La stratégie suit l'étiquette : les nouveaux éléments étiquetés sont protégés eux aussi.
  options:
    a: { en: "OneLake security roles don't restrict Admins, Members or Contributors, cover only data items such as lakehouses, and must be created item by item.", fr: "Les rôles de sécurité OneLake ne restreignent ni les Admins, ni les Members, ni les Contributors, ne couvrent que des éléments de données comme les lakehouses et doivent être créés élément par élément." }
    c: { en: "A default label only applies the label; it doesn't restrict who can access labeled items.", fr: "Une étiquette par défaut ne fait qu'appliquer l'étiquette ; elle ne restreint pas qui peut accéder aux éléments étiquetés." }
    d: { en: "Certification is a trust badge; it doesn't control access.", fr: "La certification est un badge de confiance ; elle ne contrôle pas l'accès." }
references:
  - title: Protection policies in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/protection-policies-overview
