id: dp700-1a-airflow-private-network
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Secure**. The security team requires that every workload in WS-Secure runs on a private network or a virtual network.

    Developers plan to create an Apache Airflow job in WS-Secure to orchestrate Python DAGs, and they ask you which pool to select in the Apache Airflow runtime settings of the workspace.

    What should you tell the developers?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Secure**. L'équipe de sécurité exige que chaque charge de travail de WS-Secure s'exécute sur un réseau privé ou un réseau virtuel.

    Des développeurs prévoient de créer un travail Apache Airflow dans WS-Secure pour orchestrer des DAG Python, et ils vous demandent quel pool sélectionner dans les paramètres du runtime Apache Airflow de l'espace de travail.

    Que devez-vous répondre aux développeurs ?
body:
  options:
    - { id: a, text: { en: "Select a custom pool, because custom pools can run in a virtual network", fr: "Sélectionner un pool personnalisé, car les pools personnalisés peuvent s'exécuter dans un réseau virtuel" } }
    - { id: b, text: { en: "Keep the starter pool, because it inherits the network settings of the workspace", fr: "Conserver le pool de démarrage, car il hérite des paramètres réseau de l'espace de travail" } }
    - { id: c, text: { en: "Neither pool, because Apache Airflow jobs don't support private or virtual networks", fr: "Aucun pool, car les travaux Apache Airflow ne prennent pas en charge les réseaux privés ou virtuels" } }
    - { id: d, text: { en: "Either pool, once a capacity admin turns on Customized workspace pools", fr: "N'importe quel pool, dès qu'un administrateur de capacité active Customized workspace pools" } }
answer: { optionId: c }
explanation:
  correct:
    en: The Apache Airflow job documentation states that private networks and virtual networks aren't currently supported with Apache Airflow jobs. The choice between the starter pool and a custom pool changes size, uptime and cost, not network isolation.
    fr: La documentation des travaux Apache Airflow indique que les réseaux privés et les réseaux virtuels ne sont pas pris en charge actuellement avec les travaux Apache Airflow. Le choix entre le pool de démarrage et un pool personnalisé change la taille, la disponibilité et le coût, pas l'isolation réseau.
  options:
    a:
      en: A custom pool lets you choose the node size, extra nodes and autoscale, but it doesn't add private or virtual network support.
      fr: Un pool personnalisé permet de choisir la taille des nœuds, les nœuds supplémentaires et la mise à l'échelle automatique, mais il n'ajoute pas la prise en charge des réseaux privés ou virtuels.
    b:
      en: The starter pool is the default, Fabric-managed environment and has no network option either.
      fr: Le pool de démarrage est l'environnement par défaut géré par Fabric et n'a pas non plus d'option réseau.
    d:
      en: Customized workspace pools is a Spark capacity setting; it has no effect on Apache Airflow networking.
      fr: Customized workspace pools est un paramètre de capacité Spark ; il n'a aucun effet sur la mise en réseau d'Apache Airflow.
references:
  - title: Apache Airflow Job workspace settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-workspace-settings
  - title: What is an Apache Airflow job?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-concepts
