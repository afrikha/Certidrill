id: dp700-1a-airflow-pool-facts
objective: "1.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are an admin of a Fabric workspace named **WS-Flow**. You plan to replace the starter pool of the Apache Airflow runtime settings with a custom pool.

    Which two statements about a custom pool are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur d'un espace de travail Fabric nommé **WS-Flow**. Vous prévoyez de remplacer le pool de démarrage des paramètres du runtime Apache Airflow par un pool personnalisé.

    Quelles sont les deux affirmations vraies concernant un pool personnalisé ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It starts with three base nodes, usually a scheduler, a web server and a worker.", fr: "Il démarre avec trois nœuds de base, en général un planificateur, un serveur web et un worker." } }
    - { id: b, text: { en: "It shuts down automatically after 20 minutes of inactivity.", fr: "Il s'arrête automatiquement après 20 minutes d'inactivité." } }
    - { id: c, text: { en: "Each extra node adds the capacity to run about three more workers.", fr: "Chaque nœud supplémentaire ajoute la capacité d'exécuter environ trois workers de plus." } }
    - { id: d, text: { en: "Its Compute node size can be Small, Medium or Large.", fr: "Sa Compute node size peut être Small, Medium ou Large." } }
    - { id: e, text: { en: "It consumes capacity units only while a DAG is running.", fr: "Il ne consomme des unités de capacité que pendant l'exécution d'un DAG." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A custom pool starts with three base nodes (typically one scheduler, one web server and one worker) that run until you pause the pool. Extra nodes let the pool run more DAG tasks concurrently, each one adding about three Airflow workers, either as a fixed number or through autoscale.
    fr: Un pool personnalisé démarre avec trois nœuds de base (en général un planificateur, un serveur web et un worker) qui tournent jusqu'à la mise en pause du pool. Les nœuds supplémentaires permettent au pool d'exécuter davantage de tâches de DAG en parallèle, chacun ajoutant environ trois workers Airflow, en nombre fixe ou par mise à l'échelle automatique.
  options:
    b:
      en: The 20-minute shutdown applies to the starter pool; a custom pool is always on until it's manually paused.
      fr: L'arrêt après 20 minutes concerne le pool de démarrage ; un pool personnalisé reste actif jusqu'à sa mise en pause manuelle.
    d:
      en: The compute node size of an Apache Airflow custom pool is Small or Large; Medium is a Spark node size.
      fr: La taille des nœuds d'un pool personnalisé Apache Airflow est Small ou Large ; Medium est une taille de nœud Spark.
    e:
      en: The base nodes consume CUs as long as the pool runs, even when no job is running.
      fr: Les nœuds de base consomment des CU tant que le pool tourne, même quand aucun travail ne s'exécute.
references:
  - title: Apache Airflow compute in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-compute
