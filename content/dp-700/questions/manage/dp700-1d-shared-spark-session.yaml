id: dp700-1d-shared-spark-session
objective: "1.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Nightly. PL_Nightly runs four notebooks named NB_A, NB_B, NB_C and NB_D by using four Notebook activities. The four notebooks use the same Spark compute configuration and the same libraries, and they are run by the same user.

    Most of the run time of PL_Nightly is spent starting Spark sessions. You need the four notebooks to share one Spark session.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Nightly. PL_Nightly exécute quatre notebooks nommés NB_A, NB_B, NB_C et NB_D à l'aide de quatre activités Notebook. Les quatre notebooks utilisent la même configuration de calcul Spark et les mêmes bibliothèques, et ils sont exécutés par le même utilisateur.

    La majeure partie de la durée d'exécution de PL_Nightly est consacrée au démarrage de sessions Spark. Les quatre notebooks doivent partager une seule session Spark.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the Spark settings of Workspace1, turn on [[setting]].

      In the advanced settings of each Notebook activity of PL_Nightly, set [[prop]] to the same value.

      Make sure that NB_A, NB_B, NB_C and NB_D [[cond]].
    fr: |
      Dans les paramètres Spark de Workspace1, activez [[setting]].

      Dans les paramètres avancés de chaque activité Notebook de PL_Nightly, définissez [[prop]] sur la même valeur.

      Vérifiez que NB_A, NB_B, NB_C et NB_D [[cond]].
  slots:
    - id: setting
      options:
        - { id: hcnotebooks, text: "High concurrency > For notebooks" }
        - { id: hcpipeline, text: "High concurrency > For pipeline running multiple notebooks" }
        - { id: reserve, text: "Jobs > Reserve maximum cores for active Spark jobs" }
        - { id: customize, text: "Pool > Customize compute configuration for items" }
    - id: prop
      options:
        - { id: tag, text: { en: "the session tag", fr: "la balise de session (session tag)" } }
        - { id: baseparams, text: { en: "the base parameters", fr: "les paramètres de base" } }
        - { id: connection, text: { en: "the connection", fr: "la connexion" } }
    - id: cond
      options:
        - { id: differentws, text: { en: "are stored in different workspaces", fr: "sont stockés dans des espaces de travail différents" } }
        - { id: samelh, text: { en: "have the same default lakehouse", fr: "ont le même lakehouse par défaut" } }
        - { id: paramcell, text: { en: "each have a parameter cell", fr: "ont chacun une cellule de paramètres" } }
answer:
  values: { setting: hcpipeline, prop: tag, cond: samelh }
explanation:
  correct:
    en: |
      The workspace setting High concurrency > For pipeline running multiple notebooks makes notebook sessions started by pipelines run as high concurrency sessions. Notebook activities that have the same session tag are bundled into the same shared session, up to five notebooks per session. Sharing also requires the same user, the same Spark compute configuration, the same libraries and the same default lakehouse.
    fr: |
      Le paramètre d'espace de travail High concurrency > For pipeline running multiple notebooks fait s'exécuter les sessions de notebooks démarrées par des pipelines en sessions à haute concurrence. Les activités Notebook qui ont la même balise de session sont regroupées dans la même session partagée, jusqu'à cinq notebooks par session. Le partage exige aussi le même utilisateur, la même configuration de calcul Spark, les mêmes bibliothèques et le même lakehouse par défaut.
  options:
    hcnotebooks: { en: "High concurrency for notebooks applies to interactive notebook sessions, not to notebooks run by pipelines.", fr: "La haute concurrence pour les notebooks s'applique aux sessions interactives de notebooks, pas aux notebooks exécutés par des pipelines." }
    reserve: { en: "Reserving maximum cores changes job admission; it does not share sessions.", fr: "Réserver le maximum de cœurs modifie l'admission des travaux ; cela ne partage pas les sessions." }
    customize: { en: "This setting lets items adjust their session compute properties; it does not share sessions.", fr: "Ce paramètre permet aux éléments d'ajuster les propriétés de calcul de leur session ; il ne partage pas les sessions." }
    baseparams: { en: "Base parameters pass values to the parameter cell; they do not group sessions.", fr: "Les paramètres de base transmettent des valeurs à la cellule de paramètres ; ils ne regroupent pas les sessions." }
    differentws: { en: "Notebooks that share a session should be in the same workspace.", fr: "Les notebooks qui partagent une session doivent se trouver dans le même espace de travail." }
    paramcell: { en: "A parameter cell is needed to receive base parameters, not to share a session.", fr: "Une cellule de paramètres est nécessaire pour recevoir des paramètres de base, pas pour partager une session." }
references:
  - title: Configure high concurrency mode for Fabric notebooks in pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-high-concurrency-session-notebooks-in-pipelines
  - title: Transform data by running a notebook
    url: https://learn.microsoft.com/en-us/fabric/data-factory/notebook-activity
