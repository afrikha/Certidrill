id: dp700-1a-onelake-cache-enable
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Partner** that contains a lakehouse named **LH_Partner**. LH_Partner has a shortcut named **s3_orders** that points to an Amazon S3 bucket owned by a partner.

    Several notebooks read the same files through s3_orders every day, and the company pays high cross-cloud egress charges. You need to reduce the egress charges. The notebooks must keep reading the files through s3_orders.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Partner** qui contient un lakehouse nommé **LH_Partner**. LH_Partner possède un raccourci nommé **s3_orders** qui pointe vers un compartiment Amazon S3 appartenant à un partenaire.

    Plusieurs notebooks lisent chaque jour les mêmes fichiers via s3_orders, et l'entreprise paie des frais de sortie entre clouds élevés. Vous devez réduire ces frais de sortie. Les notebooks doivent continuer à lire les fichiers via s3_orders.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the OneLake tab of the workspace settings, turn on OneLake diagnostics", fr: "Dans l'onglet OneLake des paramètres de l'espace de travail, activer les diagnostics OneLake" } }
    - { id: d, text: { en: "In the Spark settings of the workspace, set a shorter Spark session timeout", fr: "Dans les paramètres Spark de l'espace de travail, définir un Spark session timeout plus court" } }
    - { id: c, text: { en: "In the Spark settings of the workspace, turn on high concurrency for notebooks", fr: "Dans les paramètres Spark de l'espace de travail, activer la haute concurrence pour les notebooks" } }
    - { id: b, text: { en: "In the OneLake tab of the workspace settings, turn on the shortcut cache", fr: "Dans l'onglet OneLake des paramètres de l'espace de travail, activer le cache des raccourcis" } }
answer: { optionId: b }
explanation:
  correct:
    en: Shortcut caching stores the files that OneLake reads through an external shortcut in a cache for the workspace, and later reads are served from the cache instead of the remote provider, which reduces cross-cloud egress. You turn it on in the OneLake tab of the workspace settings and choose a retention period; S3 shortcuts are supported.
    fr: Le cache des raccourcis stocke dans un cache de l'espace de travail les fichiers que OneLake lit via un raccourci externe, et les lectures suivantes sont servies depuis le cache au lieu du fournisseur distant, ce qui réduit la sortie de données entre clouds. Vous l'activez dans l'onglet OneLake des paramètres de l'espace de travail et choisissez une période de rétention ; les raccourcis S3 sont pris en charge.
  options:
    a:
      en: OneLake diagnostics records who accessed which data; it doesn't change where the data is read from.
      fr: Les diagnostics OneLake enregistrent qui a accédé à quelles données ; ils ne changent pas l'emplacement depuis lequel les données sont lues.
    c:
      en: High concurrency lets notebooks share a Spark session, but every read still goes to the S3 bucket.
      fr: La haute concurrence permet aux notebooks de partager une session Spark, mais chaque lecture va toujours dans le compartiment S3.
    d:
      en: The session timeout ends idle sessions; it has no effect on the data transferred from S3.
      fr: L'expiration de session met fin aux sessions inactives ; elle n'a aucun effet sur les données transférées depuis S3.
references:
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
