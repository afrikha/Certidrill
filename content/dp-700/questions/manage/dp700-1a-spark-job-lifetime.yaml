id: dp700-1a-spark-job-lifetime
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Sales** on an F64 capacity. The workspace contains notebooks that run interactively, from pipelines and on their own schedules, and several Spark job definitions.

    Last week, a scheduled notebook looped for 11 hours and slowed down other workloads on the capacity. You need to ensure that any notebook run or Spark job definition run in WS-Sales is cancelled automatically when it runs longer than 4 hours. Lakehouse table maintenance jobs must not be affected. The solution must minimize administrative effort.

    What should you configure?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Sales** sur une capacité F64. L'espace de travail contient des notebooks exécutés de façon interactive, depuis des pipelines et selon leur propre planification, ainsi que plusieurs définitions de travail Spark.

    La semaine dernière, un notebook planifié a tourné en boucle pendant 11 heures et a ralenti les autres charges de travail de la capacité. Vous devez faire en sorte que toute exécution de notebook ou de définition de travail Spark dans WS-Sales soit annulée automatiquement lorsqu'elle dure plus de 4 heures. Les travaux de maintenance des tables de lakehouse ne doivent pas être concernés. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous configurer ?
body:
  options:
    - { id: b, text: { en: "Set maximum job lifetime set to 4 hours in the workspace Jobs settings", fr: "Set maximum job lifetime réglé sur 4 heures dans les paramètres Jobs de l'espace de travail" } }
    - { id: a, text: { en: "Spark session timeout set to 4 hours in the workspace Jobs settings", fr: "Spark session timeout réglé sur 4 heures dans les paramètres Jobs de l'espace de travail" } }
    - { id: c, text: { en: "A timeout of 4 hours on every Notebook activity of the pipelines", fr: "Un délai d'expiration de 4 heures sur chaque activité Notebook des pipelines" } }
    - { id: d, text: { en: "Reserve maximum cores for active Spark jobs in the workspace Jobs settings", fr: "Reserve maximum cores for active Spark jobs dans les paramètres Jobs de l'espace de travail" } }
answer: { optionId: b }
explanation:
  correct:
    en: Set maximum job lifetime is a workspace guardrail that cancels user jobs that exceed the configured duration. It covers interactive and scheduled notebook runs, including runs orchestrated by pipelines, Spark job definition runs and Livy sessions. System-managed jobs such as lakehouse table maintenance (optimize and vacuum) aren't affected.
    fr: Set maximum job lifetime est un garde-fou de l'espace de travail qui annule les travaux utilisateur qui dépassent la durée configurée. Il couvre les exécutions de notebooks interactives et planifiées, y compris celles orchestrées par des pipelines, les exécutions de définitions de travail Spark et les sessions Livy. Les travaux gérés par le système, comme la maintenance des tables de lakehouse (optimize et vacuum), ne sont pas concernés.
  options:
    a:
      en: The session timeout expires idle interactive notebook sessions; it doesn't cancel a job that is busy running.
      fr: L'expiration de session met fin aux sessions interactives de notebook inactives ; elle n'annule pas un travail en cours d'exécution.
    c:
      en: An activity timeout only covers notebooks started by those pipelines; scheduled notebooks and Spark job definitions would still run without limit, and each activity must be configured separately.
      fr: Le délai d'expiration d'une activité ne couvre que les notebooks lancés par ces pipelines ; les notebooks planifiés et les définitions de travail Spark resteraient sans limite, et chaque activité doit être configurée séparément.
    d:
      en: Reserving maximum cores turns off optimistic job admission; it limits how many jobs start at once but never cancels a long-running job.
      fr: Réserver les cœurs maximaux désactive l'admission optimiste des travaux ; cela limite le nombre de travaux qui démarrent en même temps mais n'annule jamais un travail long.
references:
  - title: Workspace administration settings in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
