id: dp700-1b-granular-rls-cls-roles
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a schema-enabled lakehouse named LH_Sales. OneLake security is enabled. Regional analysts have the Viewer role and read the dbo.Orders table from Spark notebooks.

    You created two OneLake security roles and added the analysts to both:

    - **RoleWest** grants Read on dbo.Orders with the row rule `SELECT * FROM dbo.Orders WHERE Region = 'West'`.
    - **RoleNoMargin** grants Read on dbo.Orders and hides the Margin column.

    The analysts' queries on dbo.Orders now fail with errors. The analysts must see only the West rows and no Margin column. What should you do?
  fr: |
    Vous disposez d'un lakehouse avec schémas nommé LH_Sales. La sécurité OneLake est activée. Les analystes régionaux ont le rôle Viewer et lisent la table dbo.Orders depuis des notebooks Spark.

    Vous avez créé deux rôles de sécurité OneLake et y avez ajouté les analystes :

    - **RoleWest** accorde Read sur dbo.Orders avec la règle de lignes `SELECT * FROM dbo.Orders WHERE Region = 'West'`.
    - **RoleNoMargin** accorde Read sur dbo.Orders et masque la colonne Margin.

    Les requêtes des analystes sur dbo.Orders échouent désormais avec des erreurs. Les analystes ne doivent voir que les lignes West, sans la colonne Margin. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Hide the Margin column in RoleWest, and remove the analysts from RoleNoMargin.", fr: "Masquer la colonne Margin dans RoleWest, et retirer les analystes de RoleNoMargin." } }
    - { id: b, text: { en: "Change the permission of RoleNoMargin from Read to ReadWrite.", fr: "Remplacer l'autorisation Read de RoleNoMargin par ReadWrite." } }
    - { id: c, text: { en: "Add the analysts to the DefaultReader role of LH_Sales.", fr: "Ajouter les analystes au rôle DefaultReader de LH_Sales." } }
    - { id: d, text: { en: "Switch the SQL analytics endpoint of LH_Sales to delegated identity mode.", fr: "Basculer le point de terminaison d'analytique SQL de LH_Sales en mode d'identité déléguée." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Row-level and column-level security can be combined on a table only when they are defined in the same OneLake security role. A user who belongs to one role with a row rule and another role with a column rule on the same table gets query errors. Defining both rules in RoleWest, and removing the analysts from RoleNoMargin, gives the West rows without the Margin column.
    fr: |
      La sécurité au niveau des lignes et celle au niveau des colonnes ne peuvent être combinées sur une table que si elles sont définies dans le même rôle de sécurité OneLake. Un utilisateur membre d'un rôle avec une règle de lignes et d'un autre rôle avec une règle de colonnes sur la même table obtient des erreurs de requête. Définir les deux règles dans RoleWest, et retirer les analystes de RoleNoMargin, donne les lignes West sans la colonne Margin.
  options:
    b: { en: "ReadWrite roles can't carry row or column rules, and they would let the analysts write data.", fr: "Les rôles ReadWrite ne peuvent pas porter de règles de lignes ou de colonnes, et ils permettraient aux analystes d'écrire des données." }
    c: { en: "DefaultReader grants access to all the data, and roles combine as a union, so the restrictions would be lost.", fr: "DefaultReader accorde l'accès à toutes les données, et les rôles se combinent par union : les restrictions seraient perdues." }
    d: { en: "The access mode of the SQL analytics endpoint doesn't affect Spark reads, and delegated mode ignores OneLake roles in T-SQL.", fr: "Le mode d'accès du point de terminaison d'analytique SQL n'affecte pas les lectures Spark, et le mode délégué ignore les rôles OneLake en T-SQL." }
references:
  - title: OneLake table, column, and row-level security
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/row-level-security
  - title: OneLake security roles, permissions, and scopes
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
