id: dp700-1d-dated-file-name
objective: "1.4.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric pipeline named PL_Export that contains a Copy data activity named Export sales. The activity writes a CSV file to the Files/exports folder of a lakehouse.

    The file name must contain the current UTC date, for example sales_20261117.csv.

    How should you complete the dynamic content of the file name? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline Fabric nommé PL_Export qui contient une activité Copy data nommée Export sales. L'activité écrit un fichier CSV dans le dossier Files/exports d'un lakehouse.

    Le nom du fichier doit contenir la date UTC du jour, par exemple sales_20261117.csv.

    Comment devez-vous compléter le contenu dynamique du nom de fichier ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    @[[f1]]('sales_', [[f2]]([[f3]], 'yyyyMMdd'), '.csv')
  slots:
    - id: f1
      options:
        - { id: concat, text: concat }
        - { id: union, text: union }
        - { id: join, text: join }
    - id: f2
      options:
        - { id: dayofmonth, text: dayOfMonth }
        - { id: formatdt, text: formatDateTime }
        - { id: fromutc, text: convertFromUtc }
    - id: f3
      options:
        - { id: runid, text: "pipeline().RunId" }
        - { id: item, text: "item()" }
        - { id: utcnow, text: "utcNow()" }
answer:
  values: { f1: concat, f2: formatdt, f3: utcnow }
explanation:
  correct:
    en: |
      concat combines the prefix, the formatted date and the extension into one string. formatDateTime returns a timestamp in the format given as its second argument, here yyyyMMdd, and utcNow() returns the current UTC timestamp.
    fr: |
      concat combine le préfixe, la date mise en forme et l'extension en une seule chaîne. formatDateTime renvoie un horodatage dans le format passé en deuxième argument, ici yyyyMMdd, et utcNow() renvoie l'horodatage UTC actuel.
  options:
    union: { en: "union returns the items of several collections; it does not build a string.", fr: "union renvoie les éléments de plusieurs collections ; il ne construit pas de chaîne." }
    join: { en: "join concatenates the items of one array with a separator, not a list of strings.", fr: "join concatène les éléments d'un tableau avec un séparateur, pas une liste de chaînes." }
    dayofmonth: { en: "dayOfMonth returns only the day number and takes no format argument.", fr: "dayOfMonth ne renvoie que le numéro du jour et n'accepte pas d'argument de format." }
    fromutc: { en: "convertFromUtc expects a destination time zone as its second argument, not a format string.", fr: "convertFromUtc attend un fuseau horaire de destination en deuxième argument, pas une chaîne de format." }
    runid: { en: "RunId is the identifier of the run, not a timestamp.", fr: "RunId est l'identifiant de l'exécution, pas un horodatage." }
    item: { en: "item() returns the current element of a ForEach loop; the activity is not inside a loop.", fr: "item() renvoie l'élément courant d'une boucle ForEach ; l'activité n'est pas dans une boucle." }
references:
  - title: Expressions and functions for Data Factory in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/expression-language
