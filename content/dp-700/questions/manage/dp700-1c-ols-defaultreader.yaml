id: dp700-1c-ols-defaultreader
objective: "1.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a schema-enabled lakehouse named Lakehouse1. You shared Lakehouse1 with a user named User1 and selected Read all data using Apache Spark. User1 has no workspace role.

    You create a OneLake security role named SalesOnly that grants Read on the dbo.Sales table only, and you add User1 to SalesOnly. Two hours later, User1 can still read every table of Lakehouse1 from a notebook.

    You need to ensure that User1 can read only dbo.Sales. User1 must keep the ability to read dbo.Sales from Spark.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse avec schémas nommé Lakehouse1. Vous avez partagé Lakehouse1 avec un utilisateur nommé User1 en sélectionnant Read all data using Apache Spark. User1 n'a aucun rôle d'espace de travail.

    Vous créez un rôle de sécurité OneLake nommé SalesOnly qui accorde Read sur la seule table dbo.Sales, et vous ajoutez User1 à SalesOnly. Deux heures plus tard, User1 peut toujours lire toutes les tables de Lakehouse1 depuis un notebook.

    Vous devez faire en sorte que User1 ne puisse lire que dbo.Sales. User1 doit pouvoir continuer à lire dbo.Sales depuis Spark.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a OneLake security role of type Deny for the other tables and add User1.", fr: "Créer un rôle de sécurité OneLake de type Deny pour les autres tables et y ajouter User1." } }
    - { id: b, text: { en: "Switch the SQL analytics endpoint of Lakehouse1 to User's identity access mode.", fr: "Basculer le point de terminaison d'analytique SQL de Lakehouse1 en mode User's identity access mode." } }
    - { id: c, text: { en: "Remove User1 from the DefaultReader role of Lakehouse1.", fr: "Retirer User1 du rôle DefaultReader de Lakehouse1." } }
    - { id: d, text: { en: "Add a row security rule to SalesOnly for dbo.Sales.", fr: "Ajouter une règle de sécurité des lignes à SalesOnly pour dbo.Sales." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The DefaultReader role grants Read on all the lakehouse data to every user who has ReadAll. OneLake security roles combine as a union, so User1 keeps full access through DefaultReader. Removing User1 from DefaultReader leaves only SalesOnly, which still allows Spark reads of dbo.Sales.
    fr: |
      Le rôle DefaultReader accorde Read sur toutes les données du lakehouse à chaque utilisateur qui a ReadAll. Les rôles de sécurité OneLake se combinent par union : User1 garde un accès complet par DefaultReader. Retirer User1 de DefaultReader ne laisse que SalesOnly, qui autorise toujours la lecture de dbo.Sales avec Spark.
  options:
    a: { en: "OneLake security supports only Grant roles; access granted by another role can't be denied.", fr: "La sécurité OneLake ne prend en charge que les rôles Grant ; un accès accordé par un autre rôle ne peut pas être refusé." }
    b: { en: "The access mode of the SQL analytics endpoint affects T-SQL queries only, not Spark.", fr: "Le mode d'accès du point de terminaison d'analytique SQL n'affecte que les requêtes T-SQL, pas Spark." }
    d: { en: "Row rules filter rows of dbo.Sales; they don't remove the access to other tables granted by DefaultReader.", fr: "Les règles de lignes filtrent les lignes de dbo.Sales ; elles ne retirent pas l'accès aux autres tables accordé par DefaultReader." }
references:
  - title: Create and manage OneLake security roles
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles
  - title: How OneLake security controls data access
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
