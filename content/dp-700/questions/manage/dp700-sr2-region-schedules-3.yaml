id: dp700-sr2-region-schedules-3
objective: "1.4.2"
type: series_yesno
series: dp700-sr2-region-schedules
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You add two schedules, each with its time zone and its Region value.
  fr: Vous ajoutez deux planifications, chacune avec son fuseau horaire et sa valeur de Region.
body:
  solution:
    en: |
      You add a daily schedule at **06:00** in the time zone of **Paris** that passes Region = **EU**, and a daily schedule at **14:00** in the time zone of **New York** that passes Region = **US**.
    fr: |
      Vous ajoutez une planification quotidienne à **06:00** dans le fuseau horaire de **Paris** qui passe Region = **EU**, et une planification quotidienne à **14:00** dans le fuseau horaire de **New York** qui passe Region = **US**.
answer: { value: true }
explanation:
  correct:
    en: |
      A Fabric pipeline can have several schedules, and each schedule has its own frequency, start and end times, time zone and parameter values. The parameter name in each schedule must match the pipeline parameter exactly. The single pipeline therefore runs twice a day with the right region, without any change to its activities.
    fr: |
      Un pipeline Fabric peut avoir plusieurs planifications, et chaque planification a sa propre fréquence, ses heures de début et de fin, son fuseau horaire et ses valeurs de paramètres. Le nom du paramètre dans chaque planification doit correspondre exactement au paramètre du pipeline. Le pipeline unique s'exécute donc deux fois par jour avec la bonne région, sans aucune modification de ses activités.
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs
