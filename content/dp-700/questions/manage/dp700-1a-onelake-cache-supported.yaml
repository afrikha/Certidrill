id: dp700-1a-onelake-cache-supported
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Hub** that contains a lakehouse named **LH_Hub**. LH_Hub contains the following shortcuts:

    | Shortcut | Target |
    | --- | --- |
    | sc_s3 | Amazon S3 bucket |
    | sc_gcs | Google Cloud Storage bucket |
    | sc_minio | S3 compatible storage |
    | sc_adls | Azure Data Lake Storage Gen2 account in another Azure region |

    You turn on the shortcut cache of WS-Hub with a retention period of 14 days. Each file is smaller than 100 MB and is read every day.

    Which shortcut's reads will still be served from the remote storage every time?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Hub** qui contient un lakehouse nommé **LH_Hub**. LH_Hub contient les raccourcis suivants :

    | Raccourci | Cible |
    | --- | --- |
    | sc_s3 | Compartiment Amazon S3 |
    | sc_gcs | Compartiment Google Cloud Storage |
    | sc_minio | Stockage compatible S3 |
    | sc_adls | Compte Azure Data Lake Storage Gen2 dans une autre région Azure |

    Vous activez le cache des raccourcis de WS-Hub avec une période de rétention de 14 jours. Chaque fichier fait moins de 100 Mo et est lu chaque jour.

    Les lectures de quel raccourci seront toujours servies depuis le stockage distant ?
body:
  options:
    - { id: a, text: "sc_s3" }
    - { id: b, text: "sc_gcs" }
    - { id: c, text: "sc_minio" }
    - { id: d, text: "sc_adls" }
answer: { optionId: d }
explanation:
  correct:
    en: Shortcut caching currently supports Google Cloud Storage, Amazon S3, S3 compatible and on-premises data gateway shortcuts. ADLS Gen2 shortcuts aren't in the supported list, so their reads keep going to the storage account even when the workspace cache is on.
    fr: "Le cache des raccourcis prend actuellement en charge les raccourcis Google Cloud Storage, Amazon S3, compatibles S3 et passerelle de données locale. Les raccourcis ADLS Gen2 ne figurent pas dans cette liste : leurs lectures continuent donc d'aller au compte de stockage, même quand le cache de l'espace de travail est activé."
  options:
    a:
      en: Amazon S3 shortcuts support caching, so daily reads within the retention period are served from the cache.
      fr: "Les raccourcis Amazon S3 prennent en charge le cache : les lectures quotidiennes pendant la période de rétention sont servies depuis le cache."
    b:
      en: Google Cloud Storage shortcuts support caching.
      fr: Les raccourcis Google Cloud Storage prennent en charge le cache.
    c:
      en: S3 compatible shortcuts support caching.
      fr: Les raccourcis compatibles S3 prennent en charge le cache.
references:
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
