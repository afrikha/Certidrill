id: dp700-cs1b-endorse-label
objective: "1.3.6"
type: yesno_statements
caseStudy: dp700-cs1b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You are planning how to meet governance requirement 5 for WH_Royalty in LP-Prod. All the users have a Power BI Pro license. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez la façon de satisfaire l'exigence de gouvernance 5 concernant WH_Royalty dans LP-Prod. Tous les utilisateurs disposent d'une licence Power BI Pro. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          A data engineer can apply the Promoted badge to WH_Royalty.
        fr: |-
          Un ingénieur données peut appliquer le badge Promoted à WH_Royalty.
    - id: s2
      text:
        en: |-
          A data engineer can apply the Certified badge to WH_Royalty.
        fr: |-
          Un ingénieur données peut appliquer le badge Certified à WH_Royalty.
    - id: s3
      text:
        en: |-
          A financial analyst can apply the Confidential sensitivity label to WH_Royalty.
        fr: |-
          Un analyste financier peut appliquer l'étiquette de confidentialité Confidential à WH_Royalty.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      Any user who has write permissions on an item can promote it, and the Contributor role of the data engineers gives them write permissions. Only the users that a Fabric administrator specified, here the members of SG-DataStewards, can certify an item; the data engineers can only request certification. Applying a sensitivity label requires edit permissions on the item, which the Viewer role of the financial analysts does not grant.
    fr: |-
      Tout utilisateur qui dispose d'autorisations d'écriture sur un élément peut le promouvoir, et le rôle Contributor des ingénieurs données leur donne ces autorisations. Seuls les utilisateurs désignés par un administrateur Fabric, ici les membres de SG-DataStewards, peuvent certifier un élément ; les ingénieurs données peuvent seulement demander la certification. L'application d'une étiquette de confidentialité exige des autorisations de modification sur l'élément, que le rôle Viewer des analystes financiers n'accorde pas.
references:
  - title: Endorsement overview
    url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
  - title: Apply sensitivity labels to Fabric items
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/apply-sensitivity-labels
