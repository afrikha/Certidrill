id: dp700-1b-item-schema-grant
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Fin that contains a warehouse named DW1. DW1 contains the schemas Finance, Sales and HR.

    A security group named Auditors has no access to WS-Fin. Auditors must query the tables and views of the Finance schema only, with read-only access. They must not access the other items of WS-Fin.

    How should you complete the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Fin qui contient un entrepôt nommé DW1. DW1 contient les schémas Finance, Sales et HR.

    Un groupe de sécurité nommé Auditors n'a aucun accès à WS-Fin. Auditors doit interroger les tables et les vues du seul schéma Finance, en lecture seule. Il ne doit pas accéder aux autres éléments de WS-Fin.

    Comment devez-vous compléter la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Share DW1 with Auditors and [[share]].
      Then run the following statement in DW1:
      GRANT [[perm]] ON [[scope]]::Finance TO [Auditors];
    fr: |
      Partager DW1 avec Auditors et [[share]].
      Puis exécuter l'instruction suivante dans DW1 :
      GRANT [[perm]] ON [[scope]]::Finance TO [Auditors];
  slots:
    - id: share
      options:
        - { id: none, text: { en: "select no additional permissions", fr: "ne sélectionner aucune autorisation supplémentaire" } }
        - { id: readdata, text: { en: "select Read all data using SQL", fr: "sélectionner Read all data using SQL" } }
        - { id: readall, text: { en: "select Read all data using Apache Spark", fr: "sélectionner Read all data using Apache Spark" } }
    - id: perm
      options:
        - { id: select, text: SELECT }
        - { id: control, text: CONTROL }
        - { id: alter, text: ALTER }
    - id: scope
      options:
        - { id: schema, text: SCHEMA }
        - { id: object, text: OBJECT }
        - { id: database, text: DATABASE }
answer:
  values: { share: none, perm: select, scope: schema }
explanation:
  correct:
    en: |
      Sharing with no additional permissions gives only Read, which lets Auditors connect to DW1 but query nothing, and doesn't expose the other items of the workspace. `GRANT SELECT ON SCHEMA::Finance` then gives read-only access to every table and view of that schema.
    fr: |
      Le partage sans autorisation supplémentaire ne donne que Read, ce qui permet à Auditors de se connecter à DW1 sans rien pouvoir interroger, et n'expose pas les autres éléments de l'espace de travail. `GRANT SELECT ON SCHEMA::Finance` donne ensuite un accès en lecture seule à toutes les tables et vues de ce schéma.
  options:
    readdata: { en: "ReadData lets the group read every table and view of DW1, including Sales and HR.", fr: "ReadData permet au groupe de lire toutes les tables et vues de DW1, y compris Sales et HR." }
    readall: { en: "ReadAll gives access to all the files of DW1 in OneLake, bypassing the schema restriction.", fr: "ReadAll donne accès à tous les fichiers de DW1 dans OneLake, ce qui contourne la restriction de schéma." }
    control: { en: "CONTROL grants full permissions on the schema, not read-only access.", fr: "CONTROL accorde toutes les autorisations sur le schéma, pas un accès en lecture seule." }
    alter: { en: "ALTER allows changing objects in the schema, not reading them.", fr: "ALTER permet de modifier les objets du schéma, pas de les lire." }
    object: { en: "Finance is a schema; OBJECT:: applies to a table, view or procedure.", fr: "Finance est un schéma ; OBJECT:: s'applique à une table, une vue ou une procédure." }
    database: { en: "DATABASE:: targets the whole database, not a schema named Finance.", fr: "DATABASE:: cible toute la base de données, pas un schéma nommé Finance." }
references:
  - title: Share Your Warehouse and Manage Permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
  - title: SQL granular permissions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-granular-permissions
