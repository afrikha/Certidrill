id: dp700-1a-git-providers
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company plans to version the items of a Fabric workspace named **WS-Data** by using Fabric Git integration. The developers can host the repository on any of the platforms listed below.

    You need to choose a repository that WS-Data can be connected to.

    Which repository should you choose?
  fr: |
    Votre entreprise prévoit de gérer les versions des éléments d'un espace de travail Fabric nommé **WS-Data** avec l'intégration Git de Fabric. Les développeurs peuvent héberger le dépôt sur l'une des plateformes listées ci-dessous.

    Vous devez choisir un dépôt auquel WS-Data peut être connecté.

    Quel dépôt devez-vous choisir ?
body:
  options:
    - { id: a, text: { en: "A repository in Azure DevOps Server installed on-premises", fr: "Un dépôt dans Azure DevOps Server installé en local" } }
    - { id: b, text: { en: "A repository in GitHub Enterprise Server on a private network", fr: "Un dépôt dans GitHub Enterprise Server sur un réseau privé" } }
    - { id: c, text: { en: "A repository in Bitbucket Cloud", fr: "Un dépôt dans Bitbucket Cloud" } }
    - { id: d, text: { en: "A repository in an Azure DevOps Services organization", fr: "Un dépôt dans une organisation Azure DevOps Services" } }
answer: { optionId: d }
explanation:
  correct:
    en: Fabric Git integration supports three cloud-based providers, Azure DevOps, GitHub and GitHub Enterprise. A repository in a cloud Azure DevOps organization (dev.azure.com) can therefore be connected, even if the organization is in another tenant.
    fr: L'intégration Git de Fabric prend en charge trois fournisseurs cloud, Azure DevOps, GitHub et GitHub Enterprise. Un dépôt d'une organisation Azure DevOps cloud (dev.azure.com) peut donc être connecté, même si l'organisation se trouve dans un autre locataire.
  options:
    a:
      en: Only the cloud-based version of Azure DevOps is supported, not an on-premises server.
      fr: Seule la version cloud d'Azure DevOps est prise en charge, pas un serveur local.
    b:
      en: GitHub Enterprise Server on a private network, with a custom domain or behind IP allowlists isn't supported.
      fr: GitHub Enterprise Server sur un réseau privé, avec un domaine personnalisé ou derrière des listes d'adresses IP autorisées, n'est pas pris en charge.
    c:
      en: Bitbucket isn't one of the supported Git providers.
      fr: Bitbucket ne fait pas partie des fournisseurs Git pris en charge.
references:
  - title: What is Microsoft Fabric Git integration?
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/intro-to-git-integration
  - title: Get started with Git integration
    url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-get-started
