id: dp700-1c-ddm-inference
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a table named dbo.Employee. The table has the columns EmployeeID, FullName, Department and Salary. Salary has the mask default().

    A user named User2 was given access to DW1 by sharing it with no additional permissions, and then by running GRANT SELECT ON dbo.Employee TO [User2]. An audit shows that User2 ran queries such as WHERE Salary BETWEEN 99000 AND 101000 to deduce salaries.

    You need to ensure that User2 can still query EmployeeID, FullName and Department but can neither read nor infer Salary values.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée dbo.Employee. La table comporte les colonnes EmployeeID, FullName, Department et Salary. Salary a le masque default().

    Un utilisateur nommé User2 a reçu l'accès à DW1 par un partage sans autorisation supplémentaire, puis par l'exécution de GRANT SELECT ON dbo.Employee TO [User2]. Un audit montre que User2 a exécuté des requêtes comme WHERE Salary BETWEEN 99000 AND 101000 pour déduire des salaires.

    Vous devez faire en sorte que User2 puisse toujours interroger EmployeeID, FullName et Department, mais ne puisse ni lire ni déduire les valeurs de Salary.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the default() mask on Salary with random(1, 200000).", fr: "Remplacer le masque default() de Salary par random(1, 200000)." } }
    - { id: b, text: { en: "Run REVOKE UNMASK ON dbo.Employee FROM [User2].", fr: "Exécuter REVOKE UNMASK ON dbo.Employee FROM [User2]." } }
    - { id: c, text: { en: "Create a security policy with a filter predicate on dbo.Employee.", fr: "Créer une stratégie de sécurité avec un prédicat de filtre sur dbo.Employee." } }
    - { id: d, text: { en: "Replace the SELECT permission on dbo.Employee with SELECT on the three other columns only.", fr: "Remplacer l'autorisation SELECT sur dbo.Employee par SELECT sur les trois autres colonnes uniquement." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Dynamic data masking only changes how values are displayed; a user who can reference the column in a WHERE clause can still infer its values. Column-level security (GRANT SELECT on a column list) removes access to Salary entirely, so any query that references it fails.
    fr: |
      Le masquage dynamique des données ne change que l'affichage des valeurs ; un utilisateur qui peut citer la colonne dans une clause WHERE peut toujours en déduire les valeurs. La sécurité au niveau des colonnes (GRANT SELECT sur une liste de colonnes) supprime tout accès à Salary : toute requête qui la cite échoue.
  options:
    a: { en: "Any mask still lets User2 filter on the real values, so range queries keep revealing salaries.", fr: "Quel que soit le masque, User2 peut toujours filtrer sur les vraies valeurs : les requêtes par plage révèlent toujours les salaires." }
    b: { en: "User2 has no UNMASK permission; the problem is inference through filters, not unmasked output.", fr: "User2 n'a pas l'autorisation UNMASK ; le problème est la déduction par filtrage, pas l'affichage non masqué." }
    c: { en: "Row-level security filters rows; User2 would still be able to filter on Salary in the rows that remain visible.", fr: "La sécurité au niveau des lignes filtre des lignes ; User2 pourrait toujours filtrer sur Salary dans les lignes restées visibles." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
