id: dp700-1b-item-share-options
objective: "1.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Sales that contains a lakehouse named LH_Sales. You plan to share LH_Sales with four users who have no role in WS-Sales. Each user must receive only the access that the user needs.

    Which option should you select in the sharing dialog for each user? To answer, drag the appropriate options to the correct users. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Sales qui contient un lakehouse nommé LH_Sales. Vous prévoyez de partager LH_Sales avec quatre utilisateurs qui n'ont aucun rôle dans WS-Sales. Chaque utilisateur ne doit recevoir que l'accès dont il a besoin.

    Quelle option devez-vous sélectionner dans la boîte de dialogue de partage pour chaque utilisateur ? Pour répondre, faites glisser les options appropriées vers les utilisateurs correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: none, text: { en: "No additional permissions", fr: "Aucune autorisation supplémentaire" } }
    - { id: sql, text: Read all with SQL analytics endpoint }
    - { id: spark, text: Read all with Apache Spark }
    - { id: share, text: Share }
    - { id: events, text: SubscribeOneLakeEvents }
  targets:
    - id: analyst
      text: { en: "Analyst: query every table of LH_Sales with T-SQL from SQL Server Management Studio", fr: "Analyste : interroger toutes les tables de LH_Sales avec T-SQL depuis SQL Server Management Studio" } 
    - id: scientist
      text: { en: "Data scientist: load the files of LH_Sales into Spark DataFrames", fr: "Data scientist : charger les fichiers de LH_Sales dans des DataFrames Spark" }
    - id: auditor
      text: { en: "Auditor: connect to the SQL analytics endpoint and read only the tables granted later with T-SQL", fr: "Auditeur : se connecter au point de terminaison d'analytique SQL et lire uniquement les tables accordées plus tard avec T-SQL" }
    - id: lead
      text: { en: "Team lead: share LH_Sales with other users", fr: "Chef d'équipe : partager LH_Sales avec d'autres utilisateurs" }
answer:
  mapping: { analyst: sql, scientist: spark, auditor: none, lead: share }
explanation:
  correct:
    en: |
      Read all with SQL analytics endpoint lets the analyst read every table with T-SQL. Read all with Apache Spark gives access to the files through Spark and OneLake APIs. Sharing with no additional permissions gives only Read, which opens the SQL analytics endpoint, so the auditor sees only what is granted with T-SQL. Share lets the team lead share the lakehouse onward.
    fr: |
      Read all with SQL analytics endpoint permet à l'analyste de lire toutes les tables avec T-SQL. Read all with Apache Spark donne accès aux fichiers via Spark et les API OneLake. Un partage sans autorisation supplémentaire ne donne que Read, qui ouvre le point de terminaison d'analytique SQL : l'auditeur ne voit que ce qui lui est accordé avec T-SQL. Share permet au chef d'équipe de partager à son tour le lakehouse.
references:
  - title: Lakehouse sharing and permission management
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
