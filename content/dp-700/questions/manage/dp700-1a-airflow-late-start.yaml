id: dp700-1a-airflow-late-start
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Logistics** that uses the default Apache Airflow runtime settings. An Apache Airflow job in WS-Logistics contains a DAG named **load_shipments** that is scheduled at the start of every hour and runs for about 15 minutes.

    The operations team reports that each run of load_shipments starts several minutes after its scheduled time. You need to ensure that the DAG runs start on schedule.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Logistics** qui utilise les paramètres par défaut du runtime Apache Airflow. Un travail Apache Airflow de WS-Logistics contient un DAG nommé **load_shipments**, planifié au début de chaque heure, qui s'exécute pendant environ 15 minutes.

    L'équipe d'exploitation signale que chaque exécution de load_shipments démarre plusieurs minutes après l'heure prévue. Vous devez faire en sorte que les exécutions du DAG démarrent à l'heure.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add extra nodes to the starter pool", fr: "Ajouter des nœuds supplémentaires au pool de démarrage" } }
    - { id: d, text: { en: "Turn on high concurrency for pipelines in the workspace", fr: "Activer la haute concurrence pour les pipelines dans l'espace de travail" } }
    - { id: c, text: { en: "Increase the Spark session timeout of the workspace to 60 minutes", fr: "Porter le Spark session timeout de l'espace de travail à 60 minutes" } }
    - { id: b, text: { en: "Create a custom pool and select it in Default Data Workflow Setting", fr: "Créer un pool personnalisé et le sélectionner dans Default Data Workflow Setting" } }
answer: { optionId: b }
explanation:
  correct:
    en: By default, Apache Airflow jobs run on the starter pool, which shuts down after 20 minutes of inactivity on the Airflow environment and takes up to 5 minutes to resume. After each 15-minute run, the environment is idle for 45 minutes, so every hourly run waits for a resume. A custom pool stays on until it's manually paused, so scheduled runs start right away.
    fr: "Par défaut, les travaux Apache Airflow s'exécutent sur le pool de démarrage, qui s'arrête après 20 minutes d'inactivité de l'environnement Airflow et met jusqu'à 5 minutes à reprendre. Après chaque exécution de 15 minutes, l'environnement reste inactif 45 minutes : chaque exécution horaire attend donc une reprise. Un pool personnalisé reste actif jusqu'à sa mise en pause manuelle, si bien que les exécutions planifiées démarrent immédiatement."
  options:
    a:
      en: The starter pool has no configurable options; extra nodes and autoscale are options of a custom pool, and they add workers rather than keep the environment running.
      fr: Le pool de démarrage n'a pas d'options configurables ; les nœuds supplémentaires et la mise à l'échelle automatique sont des options d'un pool personnalisé, et ils ajoutent des workers au lieu de garder l'environnement actif.
    c:
      en: The Spark session timeout applies to notebook sessions, not to the Apache Airflow environment.
      fr: Spark session timeout s'applique aux sessions de notebook, pas à l'environnement Apache Airflow.
    d:
      en: High concurrency lets notebook activities share Spark sessions; it has no effect on Apache Airflow jobs.
      fr: La haute concurrence permet aux activités Notebook de partager des sessions Spark ; elle n'a aucun effet sur les travaux Apache Airflow.
references:
  - title: Apache Airflow Job workspace settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-workspace-settings
