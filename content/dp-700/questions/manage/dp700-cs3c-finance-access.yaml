id: dp700-cs3c-finance-access
objective: "1.3.2"
type: single
caseStudy: dp700-cs3c-tailspin
difficulty: 2
status: draft
stem:
  en: |
    You need to grant the finance analysts access to LH-Gold. The solution must meet the security requirement. What should you do?
  fr: |
    Vous devez accorder aux analystes financiers l'accès à LH-Gold. La solution doit respecter l'exigence de sécurité. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add the finance analysts to WS-Sales with the Viewer role."
        fr: "Ajouter les analystes financiers à WS-Sales avec le rôle Viewer."
    - id: b
      text:
        en: "Share LH-Gold with the finance analysts and select Read all with SQL analytics endpoint."
        fr: "Partager LH-Gold avec les analystes financiers et sélectionner Read all with SQL analytics endpoint."
    - id: c
      text:
        en: "Add the finance analysts to WS-Sales with the Contributor role."
        fr: "Ajouter les analystes financiers à WS-Sales avec le rôle Contributor."
    - id: d
      text:
        en: "Share LH-Gold with the finance analysts and select Read all with Apache Spark."
        fr: "Partager LH-Gold avec les analystes financiers et sélectionner Read all with Apache Spark."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Sharing grants permissions on one item only, without workspace membership, so the analysts get no access to the other items of WS-Sales. The Read all with Apache Spark permission lets them read the lakehouse data through Spark and the OneLake APIs, which is what notebooks in WS-Finance use.
    fr: |
      Le partage accorde des autorisations sur un seul élément, sans appartenance à l'espace de travail : les analystes n'obtiennent aucun accès aux autres éléments de WS-Sales. L'autorisation Read all with Apache Spark leur permet de lire les données du lakehouse via Spark et les API OneLake, ce qu'utilisent les notebooks de WS-Finance.
  options:
    a:
      en: |
        A workspace role applies to every item of WS-Sales, and the Viewer role does not allow reading lakehouse data through Spark or the OneLake APIs.
      fr: |
        Un rôle d'espace de travail s'applique à tous les éléments de WS-Sales, et le rôle Viewer ne permet pas de lire les données du lakehouse via Spark ou les API OneLake.
    b:
      en: |
        This permission allows T-SQL reads through the SQL analytics endpoint only, not Spark reads from notebooks.
      fr: |
        Cette autorisation ne permet que des lectures T-SQL via le point de terminaison d'analytique SQL, pas des lectures Spark depuis des notebooks.
    c:
      en: |
        Contributor grants write access to every item of WS-Sales, which breaks least privilege.
      fr: |
        Contributor accorde l'accès en écriture à tous les éléments de WS-Sales, ce qui enfreint le moindre privilège.
references:
  - title: How lakehouse sharing works
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
