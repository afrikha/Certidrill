id: dp700-1b-deploy-permissions
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a deployment pipeline named DP-Analytics. The Development stage is assigned a workspace named WS-Dev, and the Test stage is assigned a workspace named WS-Test.

    A release manager named User1 has no access to DP-Analytics and no role in WS-Dev or WS-Test. User1 must be able to compare the stages and deploy items from Development to Test.

    You need to grant User1 the required access. The solution must follow the principle of least privilege.

    How should you complete the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline de déploiement nommé DP-Analytics. La phase Development est affectée à un espace de travail nommé WS-Dev, et la phase Test à un espace de travail nommé WS-Test.

    Un gestionnaire de mise en production nommé User1 n'a aucun accès à DP-Analytics et aucun rôle dans WS-Dev ou WS-Test. User1 doit pouvoir comparer les phases et déployer des éléments de Development vers Test.

    Vous devez accorder à User1 l'accès nécessaire. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      DP-Analytics: [[pipe]]
      WS-Dev: assign User1 the [[dev]] role.
      WS-Test: assign User1 the [[test]] role.
    fr: |
      DP-Analytics : [[pipe]]
      WS-Dev : attribuer à User1 le rôle [[dev]].
      WS-Test : attribuer à User1 le rôle [[test]].
  slots:
    - id: pipe
      options:
        - { id: admin, text: { en: "Add User1 as an admin of the pipeline.", fr: "Ajouter User1 comme administrateur du pipeline." } }
        - { id: public, text: { en: "Make the Test stage public.", fr: "Rendre la phase Test publique." } }
        - { id: none, text: { en: "No change is needed.", fr: "Aucune modification n'est nécessaire." } }
    - id: dev
      options:
        - { id: viewer, text: Viewer }
        - { id: contributor, text: Contributor }
        - { id: member, text: Member }
        - { id: admin, text: Admin }
    - id: test
      options:
        - { id: viewer, text: Viewer }
        - { id: contributor, text: Contributor }
        - { id: member, text: Member }
        - { id: admin, text: Admin }
answer:
  values: { pipe: admin, dev: contributor, test: contributor }
explanation:
  correct:
    en: |
      Admin is the only pipeline role, and every pipeline operation, including compare and deploy, requires it. To compare stages and deploy to the next stage, the pipeline admin also needs at least the Contributor role on both the source and the target workspaces. Member or Admin would grant more than needed.
    fr: |
      Administrateur est le seul rôle de pipeline, et toutes les opérations du pipeline, y compris la comparaison et le déploiement, l'exigent. Pour comparer les phases et déployer vers la phase suivante, l'administrateur du pipeline a aussi besoin au minimum du rôle Contributor sur les espaces de travail source et cible. Member ou Admin accorderaient plus que nécessaire.
  options:
    public: { en: "A public stage is shown to consumers as a regular workspace; it grants no right to deploy.", fr: "Une phase publique apparaît aux consommateurs comme un espace de travail ordinaire ; elle ne donne aucun droit de déploiement." }
    none: { en: "Without the pipeline admin role, User1 can't open the pipeline or deploy.", fr: "Sans le rôle d'administrateur du pipeline, User1 ne peut ni ouvrir le pipeline ni déployer." }
    viewer: { en: "A Viewer can't compare stages or deploy; deployment needs Contributor on both workspaces.", fr: "Un Viewer ne peut ni comparer les phases ni déployer ; le déploiement nécessite Contributor sur les deux espaces de travail." }
references:
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
