id: dp700-1d-schedule-behaviour
objective: "1.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Finance. User1 created a daily schedule for PL_Finance and added a group named FinanceOps to the failure notifications of PL_Finance. User2 has the Viewer role in Workspace1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Finance. User1 a créé une planification quotidienne pour PL_Finance et a ajouté un groupe nommé FinanceOps aux notifications d'échec de PL_Finance. User2 a le rôle Viewer dans Workspace1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If User1 runs PL_Finance on demand and the run fails, FinanceOps receives a failure email.
        fr: Si User1 exécute PL_Finance à la demande et que l'exécution échoue, FinanceOps reçoit un e-mail d'échec.
    - id: s2
      text:
        en: User2 can see the schedule of PL_Finance.
        fr: User2 peut voir la planification de PL_Finance.
    - id: s3
      text:
        en: The schedule keeps starting PL_Finance after User1 has not signed in to Fabric for 100 consecutive days.
        fr: La planification continue à démarrer PL_Finance après que User1 ne s'est pas connecté à Fabric pendant 100 jours consécutifs.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Failure notifications are sent by email only for failed scheduled runs, never for on-demand runs. Users who have only Viewer access can see existing schedules but cannot change them. A schedule expires when the user who owns it does not sign in to Fabric for 90 consecutive days, so it no longer starts runs after 100 days.
    fr: |
      Les notifications d'échec sont envoyées par e-mail uniquement pour les exécutions planifiées qui échouent, jamais pour les exécutions à la demande. Les utilisateurs qui n'ont que l'accès Viewer voient les planifications existantes sans pouvoir les modifier. Une planification expire quand l'utilisateur qui la possède ne se connecte pas à Fabric pendant 90 jours consécutifs : elle ne lance donc plus d'exécutions après 100 jours.
references:
  - title: Job Scheduler in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
