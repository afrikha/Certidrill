id: dp700-1b-ws-role-bypass
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-HR that contains a lakehouse named LH_HR. OneLake security is enabled on LH_HR. A OneLake security role named HR_Partial grants Read on the Tables/Employees table only. The DefaultReader role contains no users.

    User2 is a member of HR_Partial and has the Contributor role in WS-HR. User2 must read only Tables/Employees, from a Spark notebook in another workspace named WS-Sandbox where User2 is a Contributor.

    User2 can still read every table of LH_HR. What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-HR qui contient un lakehouse nommé LH_HR. La sécurité OneLake est activée sur LH_HR. Un rôle de sécurité OneLake nommé HR_Partial accorde Read sur la seule table Tables/Employees. Le rôle DefaultReader ne contient aucun utilisateur.

    User2 est membre de HR_Partial et possède le rôle Contributor dans WS-HR. User2 ne doit lire que Tables/Employees, depuis un notebook Spark situé dans un autre espace de travail nommé WS-Sandbox, où User2 est Contributor.

    User2 peut toujours lire toutes les tables de LH_HR. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the role of User2 in WS-HR to Viewer.", fr: "Remplacer le rôle de User2 dans WS-HR par Viewer." } }
    - { id: b, text: { en: "Remove the Contributor role of User2 in WS-Sandbox.", fr: "Retirer le rôle Contributor de User2 dans WS-Sandbox." } }
    - { id: c, text: { en: "Switch the SQL analytics endpoint of LH_HR to User's identity mode.", fr: "Basculer le point de terminaison d'analytique SQL de LH_HR en mode d'identité de l'utilisateur." } }
    - { id: d, text: { en: "Add a column-level security rule to the HR_Partial role.", fr: "Ajouter une règle de sécurité au niveau des colonnes au rôle HR_Partial." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      OneLake security roles restrict only users who read data through the Read permission, such as Viewers. Admins, Members and Contributors have write access to every item of the workspace, so roles don't restrict them. As a Viewer of WS-HR, User2 gets data access only through HR_Partial and reads only Tables/Employees.
    fr: |
      Les rôles de sécurité OneLake ne restreignent que les utilisateurs qui lisent les données grâce à l'autorisation Read, comme les Viewers. Les Admins, Members et Contributors ont un accès en écriture à tous les éléments de l'espace de travail : les rôles ne les restreignent pas. En tant que Viewer de WS-HR, User2 n'obtient l'accès aux données que par HR_Partial et ne lit que Tables/Employees.
  options:
    b: { en: "The role in WS-Sandbox only allows User2 to run the notebook; access to LH_HR comes from the role in WS-HR.", fr: "Le rôle dans WS-Sandbox permet seulement à User2 d'exécuter le notebook ; l'accès à LH_HR vient du rôle dans WS-HR." }
    c: { en: "The access mode of the SQL analytics endpoint affects T-SQL queries, not Spark reads.", fr: "Le mode d'accès du point de terminaison d'analytique SQL concerne les requêtes T-SQL, pas les lectures Spark." }
    d: { en: "A column rule would still not apply to a Contributor, and the requirement is about tables.", fr: "Une règle de colonnes ne s'appliquerait toujours pas à un Contributor, et l'exigence porte sur des tables." }
references:
  - title: OneLake security roles, permissions, and scopes
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
