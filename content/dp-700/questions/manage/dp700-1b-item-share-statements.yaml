id: dp700-1b-item-share-statements
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Data that contains a lakehouse named LH1, notebooks and pipelines. You plan to give users access to LH1 by sharing it.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Data qui contient un lakehouse nommé LH1, des notebooks et des pipelines. Vous prévoyez de donner aux utilisateurs l'accès à LH1 en le partageant.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Selecting Read all with Apache Spark also lets the recipient write files to LH1.", fr: "La sélection de Read all with Apache Spark permet aussi au destinataire d'écrire des fichiers dans LH1." } }
    - { id: b, text: { en: "Sharing LH1 always grants Read, which gives access to its SQL analytics endpoint.", fr: "Le partage de LH1 accorde toujours Read, qui donne accès à son point de terminaison d'analytique SQL." } }
    - { id: c, text: { en: "Sharing LH1 also gives the recipient read access to the notebooks of WS-Data.", fr: "Le partage de LH1 donne aussi au destinataire un accès en lecture aux notebooks de WS-Data." } }
    - { id: d, text: { en: "A Contributor of WS-Data can share LH1 only if granted the Share permission on LH1.", fr: "Un Contributor de WS-Data ne peut partager LH1 que s'il a reçu l'autorisation Share sur LH1." } }
    - { id: e, text: { en: "Sharing LH1 can be done only by the owner of LH1.", fr: "Seul le propriétaire de LH1 peut partager LH1." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Sharing a lakehouse always includes Read, which opens the item and its SQL analytics endpoint; the other options add data access. Admins and Members can share by default, while Contributors and Viewers can share only when they have the Share (reshare) permission on the lakehouse.
    fr: |
      Le partage d'un lakehouse inclut toujours Read, qui ouvre l'élément et son point de terminaison d'analytique SQL ; les autres options ajoutent un accès aux données. Les Admins et les Members peuvent partager par défaut, alors que les Contributors et les Viewers ne le peuvent qu'avec l'autorisation Share (repartage) sur le lakehouse.
  options:
    a: { en: "Sharing grants read access only; writing requires a workspace role such as Contributor.", fr: "Le partage n'accorde qu'un accès en lecture ; l'écriture nécessite un rôle d'espace de travail comme Contributor." }
    c: { en: "Sharing applies to the shared item only, not to the other items of the workspace.", fr: "Le partage s'applique uniquement à l'élément partagé, pas aux autres éléments de l'espace de travail." }
    e: { en: "Workspace Admins and Members can share LH1 by default, whoever owns it.", fr: "Les Admins et les Members de l'espace de travail peuvent partager LH1 par défaut, quel que soit son propriétaire." }
references:
  - title: Lakehouse sharing and permission management
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
