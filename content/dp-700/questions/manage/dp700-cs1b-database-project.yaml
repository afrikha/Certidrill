id: dp700-cs1b-database-project
objective: "1.2.2"
type: single
caseStudy: dp700-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |-
    You need to meet lifecycle requirement 3 for WH_Royalty. What should you use to produce the artifact that Azure Pipelines deploys to LP-Test and LP-Prod?
  fr: |-
    Vous devez satisfaire l'exigence de cycle de vie 3 concernant WH_Royalty. Que devez-vous utiliser pour produire l'artefact qu'Azure Pipelines déploie dans LP-Test et LP-Prod ?
body:
  options:
    - { id: a, text: { en: "A deployment pipeline whose stages are assigned to LP-Dev, LP-Test and LP-Prod", fr: "Un pipeline de déploiement dont les phases sont attribuées à LP-Dev, LP-Test et LP-Prod" } }
    - { id: b, text: { en: "Git integration of LP-Test and LP-Prod with lp-data, updated from the Source control pane", fr: "L'intégration Git de LP-Test et LP-Prod avec lp-data, mise à jour depuis le volet Contrôle de code source" } }
    - { id: c, text: { en: "A T-SQL notebook that contains the CREATE statements and that a pipeline runs in each workspace", fr: "Un notebook T-SQL qui contient les instructions CREATE et qu'un pipeline exécute dans chaque espace de travail" } }
    - { id: d, text: { en: "An SDK-style SQL database project that targets Fabric Data Warehouse and builds a .dacpac file", fr: "Un projet de base de données SQL de style SDK qui cible Fabric Data Warehouse et génère un fichier .dacpac" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A warehouse project developed in Visual Studio Code is an SDK-style SQL database project stored as files in Git. Building it validates every object and produces a .dacpac file, which a CI/CD system such as Azure Pipelines publishes to the target warehouse with the DacFx framework or the SqlPackage CLI. This meets the build-validation and Azure Pipelines deployment requirements.
    fr: |-
      Un projet d'entrepôt développé dans Visual Studio Code est un projet de base de données SQL de style SDK stocké sous forme de fichiers dans Git. Sa build valide tous les objets et produit un fichier .dacpac, qu'un système CI/CD comme Azure Pipelines publie dans l'entrepôt cible avec le framework DacFx ou l'interface CLI SqlPackage. Cela satisfait les exigences de validation par une build et de déploiement par Azure Pipelines.
  options:
    a:
      en: |-
        A deployment pipeline promotes items between workspaces from the Fabric portal; it involves no build in Azure Pipelines and produces no artifact for Azure Pipelines to deploy.
      fr: |-
        Un pipeline de déploiement promeut des éléments entre espaces de travail depuis le portail Fabric ; il n'implique aucune build dans Azure Pipelines et ne produit aucun artefact à déployer par Azure Pipelines.
    b:
      en: |-
        Updating each workspace from its Source control pane is a manual sync from Git, not a validated build deployed by Azure Pipelines.
      fr: |-
        Mettre à jour chaque espace de travail depuis son volet Contrôle de code source est une synchronisation manuelle depuis Git, pas une build validée déployée par Azure Pipelines.
    c:
      en: |-
        A notebook of CREATE statements is not developed in Visual Studio Code as a project, is not validated by a build, and cannot apply incremental schema changes to an existing warehouse.
      fr: |-
        Un notebook d'instructions CREATE n'est pas développé dans Visual Studio Code sous forme de projet, n'est pas validé par une build et ne peut pas appliquer de modifications de schéma incrémentielles à un entrepôt existant.
references:
  - title: Develop warehouse projects in Visual Studio Code
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/develop-warehouse-project
  - title: Development and deployment overview
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/source-control
