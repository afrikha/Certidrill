id: dp700-1a-domain-admin-actions
objective: "1.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A Fabric administrator created a domain named **Operations** and named a user named **Lea** as its only domain admin. Lea has no other admin role in Fabric.

    Which two actions can Lea perform on the Operations domain?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un administrateur Fabric a créé un domaine nommé **Operations** et a désigné une utilisatrice nommée **Lea** comme seule administratrice de ce domaine. Lea n'a aucun autre rôle d'administration dans Fabric.

    Quelles sont les deux actions que Lea peut effectuer sur le domaine Operations ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Rename the domain to Ops", fr: "Renommer le domaine en Ops" } }
    - { id: b, text: { en: "Configure a default domain for a security group", fr: "Configurer un domaine par défaut pour un groupe de sécurité" } }
    - { id: c, text: { en: "Add a second domain admin", fr: "Ajouter un deuxième administrateur de domaine" } }
    - { id: d, text: { en: "Override delegated tenant settings for the domain", fr: "Remplacer les paramètres délégués du locataire pour le domaine" } }
    - { id: e, text: { en: "Delete the domain", fr: "Supprimer le domaine" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A domain admin can update the domain description and image, define its contributors, assign workspaces, set a default domain and override the tenant settings that are delegated to the domain. Renaming or deleting the domain and adding or removing domain admins remain Fabric admin tasks.
    fr: Un administrateur de domaine peut modifier la description et l'image du domaine, définir ses contributeurs, attribuer des espaces de travail, définir un domaine par défaut et remplacer les paramètres du locataire délégués au domaine. Renommer ou supprimer le domaine, ainsi qu'ajouter ou retirer des administrateurs de domaine, restent des tâches d'administrateur Fabric.
  options:
    a:
      en: In General settings, a domain admin can only edit the description; changing the name requires a Fabric admin.
      fr: Dans General settings, un administrateur de domaine ne peut modifier que la description ; changer le nom exige un administrateur Fabric.
    c:
      en: Only a Fabric admin can add or delete domain admins.
      fr: Seul un administrateur Fabric peut ajouter ou supprimer des administrateurs de domaine.
    e:
      en: Domain admins can't delete their domain; only a Fabric admin can.
      fr: Les administrateurs de domaine ne peuvent pas supprimer leur domaine ; seul un administrateur Fabric le peut.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
