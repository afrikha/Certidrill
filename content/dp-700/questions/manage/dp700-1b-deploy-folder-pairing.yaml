id: dp700-1b-deploy-folder-pairing
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a deployment pipeline named DP-Ops that has Test and Production stages. The Test stage is assigned a workspace named WS-Test that contains a notebook named NB_Load at the root of the workspace. The Production stage is empty.

    You plan to assign an existing workspace named WS-Prod to the Production stage. WS-Prod contains two notebooks named NB_Load: the current production notebook in a folder named Ingest, and an old copy in a folder named Legacy.

    You need the next deployment from Test to Production to overwrite Ingest/NB_Load and to leave Legacy/NB_Load unchanged.

    What should you do before you assign WS-Prod?
  fr: |
    Vous disposez d'un pipeline de déploiement nommé DP-Ops qui comporte les phases Test et Production. La phase Test est affectée à un espace de travail nommé WS-Test qui contient un notebook nommé NB_Load à la racine de l'espace de travail. La phase Production est vide.

    Vous prévoyez d'affecter un espace de travail existant nommé WS-Prod à la phase Production. WS-Prod contient deux notebooks nommés NB_Load : le notebook de production actuel dans un dossier nommé Ingest, et une ancienne copie dans un dossier nommé Legacy.

    Le prochain déploiement de Test vers Production doit remplacer Ingest/NB_Load et laisser Legacy/NB_Load inchangé.

    Que devez-vous faire avant d'affecter WS-Prod ?
body:
  options:
    - { id: a, text: { en: "Rename the NB_Load notebook in the Ingest folder of WS-Prod.", fr: "Renommer le notebook NB_Load du dossier Ingest de WS-Prod." } }
    - { id: b, text: { en: "Move the NB_Load notebook of WS-Test into a folder named Ingest.", fr: "Déplacer le notebook NB_Load de WS-Test dans un dossier nommé Ingest." } }
    - { id: c, text: { en: "Create a default lakehouse rule for NB_Load in the Production stage.", fr: "Créer une règle de lakehouse par défaut pour NB_Load dans la phase Production." } }
    - { id: d, text: { en: "Plan to deploy NB_Load by selecting its related items.", fr: "Prévoir de déployer NB_Load en sélectionnant ses éléments connexes." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a workspace is assigned, items are paired by name, type and folder. If several items in a stage share a name and type, they're paired only if they are in the same folder; otherwise pairing fails. With NB_Load in an Ingest folder in WS-Test, it pairs with Ingest/NB_Load in WS-Prod, which the next deployment overwrites, and Legacy/NB_Load stays unpaired and untouched.
    fr: "Lors de l'affectation d'un espace de travail, les éléments sont jumelés selon leur nom, leur type et leur dossier. Si plusieurs éléments d'une phase partagent un nom et un type, ils ne sont jumelés que s'ils se trouvent dans le même dossier ; sinon, le jumelage échoue. Avec NB_Load dans un dossier Ingest de WS-Test, il est jumelé avec Ingest/NB_Load de WS-Prod, que le déploiement suivant remplace, et Legacy/NB_Load reste non jumelé et inchangé."
  options:
    a: { en: "After the rename, Legacy/NB_Load would be the only NB_Load in WS-Prod, so it would be paired and overwritten instead.", fr: "Après le renommage, Legacy/NB_Load serait le seul NB_Load de WS-Prod : c'est lui qui serait jumelé et remplacé." }
    c: { en: "A default lakehouse rule changes the lakehouse of a notebook; it doesn't decide which notebooks are paired.", fr: "Une règle de lakehouse par défaut change le lakehouse d'un notebook ; elle ne décide pas quels notebooks sont jumelés." }
    d: { en: "Selecting related items adds dependencies to the deployment; it doesn't change pairing, which is set at assignment.", fr: "La sélection des éléments connexes ajoute des dépendances au déploiement ; elle ne change pas le jumelage, défini lors de l'affectation." }
references:
  - title: Assign a workspace to a deployment pipeline
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/assign-pipeline
