id: dp700-1a-git-notebook-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Dev** that is connected to a GitHub repository. WS-Dev contains a PySpark notebook named **NB_Orders** that uses a lakehouse named **LH_Orders** as its default lakehouse. The last run of NB_Orders displayed several charts and tables in its cell outputs.

    You commit NB_Orders.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Dev** connecté à un dépôt GitHub. WS-Dev contient un notebook PySpark nommé **NB_Orders** qui utilise un lakehouse nommé **LH_Orders** comme lakehouse par défaut. La dernière exécution de NB_Orders a affiché plusieurs graphiques et tableaux dans les sorties de ses cellules.

    Vous faites un commit de NB_Orders.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The code of NB_Orders is stored in a file named notebook-content.py instead of an .ipynb file.
        fr: Le code de NB_Orders est stocké dans un fichier nommé notebook-content.py plutôt que dans un fichier .ipynb.
    - id: s2
      text:
        en: The cell outputs of the last run are committed with NB_Orders.
        fr: Les sorties des cellules de la dernière exécution sont commitées avec NB_Orders.
    - id: s3
      text:
        en: The reference to LH_Orders as the default lakehouse is stored in the notebook metadata.
        fr: La référence à LH_Orders comme lakehouse par défaut est stockée dans les métadonnées du notebook.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Fabric stores a committed notebook as source files in a `<name>.Notebook` folder; a PySpark notebook becomes notebook-content.py, which is easier to review in diffs. The source file keeps the notebook metadata, including the default lakehouse and attached environment, and the markdown and code cells. Cell output isn't included when syncing to Git.
    fr: Fabric stocke un notebook commité sous forme de fichiers sources dans un dossier `<name>.Notebook` ; un notebook PySpark devient notebook-content.py, plus facile à relire dans les différences. Le fichier source conserve les métadonnées du notebook, notamment le lakehouse par défaut et l'environnement attaché, ainsi que les cellules Markdown et de code. Les sorties des cellules ne sont pas incluses lors de la synchronisation avec Git.
references:
  - title: Notebook source control and deployment
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/notebook-source-control-deployment
