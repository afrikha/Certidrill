id: dp700-1c-label-domain-override
objective: "1.3.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Your Fabric tenant uses the sensitivity labels General, Confidential and Highly Confidential, in ascending order of priority. A label policy applies General as the default label.

    You are a domain admin of a domain named Sales. You set Confidential as the default sensitivity label of the Sales domain. The following table shows the items of a workspace in the Sales domain before the change.

    Answer each prompt by selecting the appropriate item.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre locataire Fabric utilise les étiquettes de confidentialité General, Confidential et Highly Confidential, par ordre de priorité croissant. Une stratégie d'étiquettes applique General comme étiquette par défaut.

    Vous êtes administrateur d'un domaine nommé Sales. Vous définissez Confidential comme étiquette de confidentialité par défaut du domaine Sales. Le tableau suivant présente les éléments d'un espace de travail du domaine Sales avant la modification.

    Répondez à chaque consigne en sélectionnant l'élément approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The item whose existing label is replaced by Confidential the next time it's updated and saved", fr: "L'élément dont l'étiquette existante est remplacée par Confidential la prochaine fois qu'il est mis à jour et enregistré" } 
    - id: p2
      text: { en: "The item that keeps a label of lower priority than Confidential after it's updated and saved", fr: "L'élément qui garde une étiquette de priorité inférieure à Confidential après avoir été mis à jour et enregistré" }
  grid:
    header: [{ en: Item, fr: Élément }, { en: Current label, fr: Étiquette actuelle }, { en: How the label was applied, fr: Mode d'application de l'étiquette }]
    rows:
      - [{ text: LH_Sales, area: lh }, { text: General }, { text: { en: "Manually by the item owner", fr: "Manuellement par le propriétaire de l'élément" } }]
      - [{ text: NB_Clean, area: nb }, { text: Highly Confidential }, { text: { en: "Automatically, by inheritance", fr: "Automatiquement, par héritage" } }]
      - [{ text: PL_Load, area: pl }, { text: General }, { text: { en: "Default label from the label policy", fr: "Étiquette par défaut de la stratégie d'étiquettes" } }]
      - [{ text: DW_Fin, area: dw }, { text: Highly Confidential }, { text: { en: "Manually by the item owner", fr: "Manuellement par le propriétaire de l'élément" } }]
answer:
  values: { p1: pl, p2: lh }
explanation:
  correct:
    en: |
      A domain-level default label never overrides a manually applied label, whatever its priority, so LH_Sales keeps General and DW_Fin keeps Highly Confidential. It replaces a label applied by a label policy default or automatically only when that label has a lower priority: PL_Load (General from the policy default) becomes Confidential, while NB_Clean keeps its higher-priority Highly Confidential label.
    fr: |
      Une étiquette par défaut de domaine ne remplace jamais une étiquette appliquée manuellement, quelle que soit sa priorité : LH_Sales garde General et DW_Fin garde Highly Confidential. Elle remplace une étiquette appliquée par défaut par une stratégie, ou automatiquement, seulement si cette étiquette a une priorité inférieure : PL_Load (General par défaut de la stratégie) devient Confidential, alors que NB_Clean garde son étiquette Highly Confidential, de priorité supérieure.
references:
  - title: Domain-level default sensitivity labels in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/domain-default-sensitivity-label
