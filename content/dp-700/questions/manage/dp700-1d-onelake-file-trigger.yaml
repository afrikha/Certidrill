id: dp700-1d-onelake-file-trigger
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Landing and a pipeline named PL_Ingest. A partner application uploads files to the Files/inbound folder of LH_Landing by using the OneLake APIs, at unpredictable times.

    You need PL_Ingest to start as soon as a file is created in Files/inbound. The solution must minimize the number of pipeline runs.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Landing et un pipeline nommé PL_Ingest. Une application partenaire charge des fichiers dans le dossier Files/inbound de LH_Landing à l'aide des API OneLake, à des heures imprévisibles.

    Vous devez faire en sorte que PL_Ingest démarre dès qu'un fichier est créé dans Files/inbound. La solution doit réduire au minimum le nombre d'exécutions du pipeline.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add a trigger to PL_Ingest on OneLake events of LH_Landing for file creation, filtered on the Files/inbound folder."
        fr: "Ajouter à PL_Ingest un déclencheur sur les événements OneLake de LH_Landing pour la création de fichiers, filtré sur le dossier Files/inbound."
    - id: b
      text:
        en: "Add a trigger to PL_Ingest on job events of LH_Landing for successful jobs, filtered on the Files/inbound folder."
        fr: "Ajouter à PL_Ingest un déclencheur sur les événements de travaux de LH_Landing pour les travaux réussis, filtré sur le dossier Files/inbound."
    - id: c
      text:
        en: "Add a minute-based schedule to PL_Ingest that runs every minute, and add a Get metadata activity that checks Files/inbound for new files."
        fr: "Ajouter à PL_Ingest une planification par minute qui s'exécute toutes les minutes, et ajouter une activité Get metadata qui vérifie la présence de nouveaux fichiers dans Files/inbound."
    - id: d
      text:
        en: "Add a trigger to PL_Ingest on workspace item events of Workspace1 for item changes, filtered on LH_Landing."
        fr: "Ajouter à PL_Ingest un déclencheur sur les événements d'éléments d'espace de travail de Workspace1 pour les modifications d'éléments, filtré sur LH_Landing."
answer: { optionId: a }
explanation:
  correct:
    en: |
      OneLake events, such as Microsoft.Fabric.OneLake.FileCreated, are raised when a file is created in a OneLake item. A pipeline trigger on these events, filtered on the folder path in the Subject field, starts PL_Ingest once for each new file, without polling.
    fr: |
      Les événements OneLake, comme Microsoft.Fabric.OneLake.FileCreated, sont émis quand un fichier est créé dans un élément OneLake. Un déclencheur de pipeline sur ces événements, filtré sur le chemin du dossier dans le champ Subject, démarre PL_Ingest une fois par nouveau fichier, sans interrogation périodique.
  options:
    b: { en: "Job events report the status of item jobs, such as a lakehouse maintenance job; a file upload through the OneLake APIs is not a job.", fr: "Les événements de travaux signalent l'état des travaux d'éléments, comme un travail de maintenance de lakehouse ; un chargement de fichier via les API OneLake n'est pas un travail." }
    c: { en: "A schedule that runs every minute starts about 1,440 runs a day, most of them for nothing.", fr: "Une planification toutes les minutes lance environ 1 440 exécutions par jour, la plupart pour rien." }
    d: { en: "Workspace item events report the creation, change or deletion of items such as a lakehouse, not of files inside the lakehouse.", fr: "Les événements d'éléments d'espace de travail signalent la création, la modification ou la suppression d'éléments comme un lakehouse, pas des fichiers qu'il contient." }
references:
  - title: Explore OneLake events in Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/explore-fabric-onelake-events
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-storage-event-triggers
