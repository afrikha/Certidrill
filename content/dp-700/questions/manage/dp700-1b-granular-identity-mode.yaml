id: dp700-1b-granular-identity-mode
objective: "1.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a lakehouse named LH_Ops. OneLake security roles with row-level and column-level rules are defined on LH_Ops. Users who have the Viewer role query LH_Ops through its SQL analytics endpoint.

    An Admin switches the SQL analytics endpoint of LH_Ops from delegated identity mode to User's identity access mode.

    Which two statements are true after the switch?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé LH_Ops. Des rôles de sécurité OneLake avec des règles au niveau des lignes et des colonnes sont définis sur LH_Ops. Des utilisateurs qui ont le rôle Viewer interrogent LH_Ops via son point de terminaison d'analytique SQL.

    Un Admin bascule le point de terminaison d'analytique SQL de LH_Ops du mode d'identité déléguée vers le mode d'identité de l'utilisateur (User's identity).

    Quelles sont les deux affirmations vraies après le basculement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Access to the tables in T-SQL queries is governed by the OneLake security roles.", fr: "L'accès aux tables dans les requêtes T-SQL est régi par les rôles de sécurité OneLake." } }
    - { id: b, text: { en: "GRANT SELECT statements defined earlier on the tables keep applying.", fr: "Les instructions GRANT SELECT définies auparavant sur les tables continuent de s'appliquer." } }
    - { id: c, text: { en: "Dynamic data masking defined in T-SQL keeps masking the columns.", fr: "Le masquage dynamique des données défini en T-SQL continue de masquer les colonnes." } }
    - { id: d, text: { en: "GRANT EXECUTE on stored procedures still controls who can run them.", fr: "GRANT EXECUTE sur les procédures stockées contrôle toujours qui peut les exécuter." } }
    - { id: e, text: { en: "The users can connect without the Read permission on LH_Ops.", fr: "Les utilisateurs peuvent se connecter sans l'autorisation Read sur LH_Ops." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      In User's identity mode, the endpoint passes the user's identity to OneLake, and table, row and column access comes from the OneLake security roles. SQL permissions still apply to nondata objects, so GRANT EXECUTE on procedures and functions and permissions on views keep working.
    fr: |
      En mode d'identité de l'utilisateur, le point de terminaison transmet l'identité de l'utilisateur à OneLake, et l'accès aux tables, aux lignes et aux colonnes provient des rôles de sécurité OneLake. Les autorisations SQL s'appliquent toujours aux objets sans données : GRANT EXECUTE sur les procédures et les fonctions, ainsi que les autorisations sur les vues, continuent de fonctionner.
  options:
    b: { en: "Table-level SQL permissions, SQL row-level security and column-level security are ignored in User's identity mode.", fr: "Les autorisations SQL au niveau des tables, la sécurité au niveau des lignes SQL et celle au niveau des colonnes sont ignorées en mode d'identité de l'utilisateur." }
    c: { en: "Dynamic data masking isn't supported with OneLake security in User's identity mode.", fr: "Le masquage dynamique des données n'est pas pris en charge avec la sécurité OneLake en mode d'identité de l'utilisateur." }
    e: { en: "In both modes, users need the Read permission on the item; otherwise the connection is rejected.", fr: "Dans les deux modes, les utilisateurs ont besoin de l'autorisation Read sur l'élément ; sinon, la connexion est refusée." }
references:
  - title: OneLake Security for SQL analytics endpoints
    url: https://learn.microsoft.com/en-us/fabric/onelake/sql-analytics-endpoint-onelake-security
