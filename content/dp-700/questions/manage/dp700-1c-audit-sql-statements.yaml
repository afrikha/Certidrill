id: dp700-1c-audit-sql-statements
objective: "1.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS1 that contains a warehouse named DW1 and a lakehouse named Lakehouse1. You are planning to use SQL audit logs for DW1 and for the SQL analytics endpoint of Lakehouse1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS1 qui contient un entrepôt nommé DW1 et un lakehouse nommé Lakehouse1. Vous prévoyez d'utiliser les journaux d'audit SQL pour DW1 et pour le point de terminaison d'analytique SQL de Lakehouse1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A newly created warehouse records login events in its SQL audit logs until you turn the feature off.
        fr: |
          Un entrepôt nouvellement créé enregistre les événements de connexion dans ses journaux d'audit SQL tant que vous ne désactivez pas la fonctionnalité.
    - id: s2
      text:
        en: |
          If you delete DW1, its SQL audit logs are deleted too.
        fr: |
          Si vous supprimez DW1, ses journaux d'audit SQL sont également supprimés.
    - id: s3
      text:
        en: |
          The SQL audit logs of the Lakehouse1 SQL analytics endpoint record the rows that a notebook inserts into Lakehouse1 tables.
        fr: |
          Les journaux d'audit SQL du point de terminaison d'analytique SQL de Lakehouse1 enregistrent les lignes qu'un notebook insère dans les tables de Lakehouse1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      SQL audit logs are off by default; a user who has the Audit permission must enable them. Deleting a warehouse deletes its audit logs, so copy the .XEL files elsewhere first if you must keep them. On a SQL analytics endpoint, DML isn't captured because lakehouse data changes go through the lakehouse runtime, not the SQL engine.
    fr: |
      Les journaux d'audit SQL sont désactivés par défaut ; un utilisateur qui a l'autorisation Audit doit les activer. Supprimer un entrepôt supprime ses journaux d'audit : copiez d'abord les fichiers .XEL ailleurs s'il faut les conserver. Sur un point de terminaison d'analytique SQL, les opérations DML ne sont pas capturées, car les modifications de données du lakehouse passent par le runtime du lakehouse, pas par le moteur SQL.
references:
  - title: SQL audit logs in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-audit-logs
