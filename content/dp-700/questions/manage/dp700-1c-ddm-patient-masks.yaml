id: dp700-1c-ddm-patient-masks
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a table named dbo.Patient. The table has the following columns:

    - BirthDate (date), not masked
    - RiskScore (int), not masked
    - Notes (varchar(500)), masked with default()

    You need to make the following changes:

    - Fully mask BirthDate for users without the UNMASK permission.
    - Show users without the UNMASK permission a random value between 1 and 100 for RiskScore.
    - Remove the mask from Notes.

    How should you complete the T-SQL code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée dbo.Patient. La table comporte les colonnes suivantes :

    - BirthDate (date), non masquée
    - RiskScore (int), non masquée
    - Notes (varchar(500)), masquée avec default()

    Vous devez effectuer les modifications suivantes :

    - Masquer entièrement BirthDate pour les utilisateurs sans autorisation UNMASK.
    - Afficher aux utilisateurs sans autorisation UNMASK une valeur aléatoire entre 1 et 100 pour RiskScore.
    - Retirer le masque de Notes.

    Comment devez-vous compléter le code T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE dbo.Patient
    ALTER COLUMN BirthDate ADD MASKED WITH (FUNCTION = '[[date]]');

    ALTER TABLE dbo.Patient
    ALTER COLUMN RiskScore ADD MASKED WITH (FUNCTION = '[[score]]');

    ALTER TABLE dbo.Patient
    ALTER COLUMN Notes [[drop]];
  slots:
    - id: date
      options:
        - { id: def, text: "default()" }
        - { id: email, text: "email()" }
        - { id: partial, text: "partial(0,\"XXXX\",0)" }
        - { id: rnd, text: "random(1, 12)" }
    - id: score
      options:
        - { id: rnd2, text: "random(1, 100)" }
        - { id: rnd1, text: "random(100)" }
        - { id: def2, text: "default(1, 100)" }
        - { id: part2, text: "partial(1,\"X\",100)" }
    - id: drop
      options:
        - { id: dropmasked, text: DROP MASKED }
        - { id: dropmask, text: DROP MASK }
        - { id: removemasked, text: REMOVE MASKED }
        - { id: dropfn, text: "DROP MASKED WITH (FUNCTION = 'default()')" }
answer:
  values: { date: def, score: rnd2, drop: dropmasked }
explanation:
  correct:
    en: |
      default() fully masks a value according to its data type; for a date column it returns 1900-01-01. random(start, end) replaces a numeric value with a random value in the range, here 1 to 100. A mask is removed with ALTER COLUMN ... DROP MASKED, which needs no function.
    fr: |
      default() masque entièrement une valeur selon son type de données ; pour une colonne de date, il renvoie 1900-01-01. random(start, end) remplace une valeur numérique par une valeur aléatoire de la plage, ici de 1 à 100. Un masque se retire avec ALTER COLUMN ... DROP MASKED, sans fonction.
  options:
    email: { en: "email() is a string mask that keeps the first letter and adds @XXXX.com; it doesn't fit a date column.", fr: "email() est un masque de chaîne qui garde la première lettre et ajoute @XXXX.com ; il ne convient pas à une colonne de date." }
    partial: { en: "partial() is a string mask; it doesn't apply to a date column.", fr: "partial() est un masque de chaîne ; il ne s'applique pas à une colonne de date." }
    rnd: { en: "random() is for numeric columns, not dates.", fr: "random() est réservé aux colonnes numériques, pas aux dates." }
    rnd1: { en: "random() takes a start value and an end value.", fr: "random() prend une valeur de début et une valeur de fin." }
    def2: { en: "default() takes no arguments and would return 0 for an int column.", fr: "default() ne prend aucun argument et renverrait 0 pour une colonne int." }
    part2: { en: "partial() is a string mask and doesn't produce a random number.", fr: "partial() est un masque de chaîne et ne produit pas de nombre aléatoire." }
    dropmask: { en: "The clause is DROP MASKED, not DROP MASK.", fr: "La clause est DROP MASKED, pas DROP MASK." }
    removemasked: { en: "REMOVE isn't a valid keyword in ALTER COLUMN.", fr: "REMOVE n'est pas un mot clé valide dans ALTER COLUMN." }
    dropfn: { en: "DROP MASKED takes no function argument.", fr: "DROP MASKED ne prend pas d'argument de fonction." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
  - title: How to implement dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/howto-dynamic-data-masking
