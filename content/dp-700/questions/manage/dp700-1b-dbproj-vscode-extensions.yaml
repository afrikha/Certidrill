id: dp700-1b-dbproj-vscode-extensions
objective: "1.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Finance that contains a SQL database named SQL_Finance. The schema of SQL_Finance is stored as an SDK-style SQL database project in an Azure DevOps repository.

    You plan to add a release pipeline that runs on a Linux build agent. The pipeline must build the project and then deploy the result to SQL_Finance.

    Which two tools should the build agent have? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Finance qui contient une base de données SQL nommée SQL_Finance. Le schéma de SQL_Finance est stocké sous forme de projet de base de données SQL de style SDK dans un dépôt Azure DevOps.

    Vous prévoyez d'ajouter un pipeline de mise en production qui s'exécute sur un agent de build Linux. Le pipeline doit générer le projet, puis déployer le résultat sur SQL_Finance.

    De quels outils l'agent de build doit-il disposer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: AzCopy }
    - { id: b, text: { en: "The .NET SDK", fr: "Le SDK .NET" } }
    - { id: c, text: Visual Studio 2026 }
    - { id: d, text: SqlPackage }
    - { id: e, text: Power Platform CLI }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      SDK-style SQL projects build with `dotnet build` on any platform that has the .NET SDK, which produces a .dacpac file. SqlPackage then publishes the .dacpac to the target database, applying only the changes needed to match the project.
    fr: |
      Les projets SQL de style SDK se génèrent avec `dotnet build` sur toute plateforme dotée du SDK .NET, ce qui produit un fichier .dacpac. SqlPackage publie ensuite le .dacpac sur la base de données cible, en appliquant uniquement les modifications nécessaires pour correspondre au projet.
  options:
    a: { en: "AzCopy copies files to and from Azure Storage; it doesn't build or deploy a SQL project.", fr: "AzCopy copie des fichiers vers et depuis Stockage Azure ; il ne génère ni ne déploie un projet SQL." }
    c: { en: "Visual Studio 2026 supports only the original SQL project format, not SDK-style projects, and the agent runs Linux.", fr: "Visual Studio 2026 ne prend en charge que le format de projet SQL d'origine, pas les projets de style SDK, et l'agent tourne sous Linux." }
    e: { en: "Power Platform CLI manages Power Platform solutions, not SQL database schemas.", fr: "Power Platform CLI gère des solutions Power Platform, pas des schémas de base de données SQL." }
references:
  - title: What are SQL database projects?
    url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/sql-database-projects
  - title: SqlPackage
    url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage
