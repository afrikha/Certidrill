id: dp700-1b-dbproj-vscode-extensions
objective: "1.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW_Finance. You have the Contributor role in the workspace that contains DW_Finance.

    You plan to develop the schema of DW_Finance as a database project in Visual Studio Code. The .NET SDK is already installed on your computer.

    Which two Visual Studio Code extensions should you install? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW_Finance. Vous avez le rôle Contributor dans l'espace de travail qui contient DW_Finance.

    Vous prévoyez de développer le schéma de DW_Finance sous la forme d'un projet de base de données dans Visual Studio Code. Le SDK .NET est déjà installé sur votre ordinateur.

    Quelles sont les deux extensions Visual Studio Code à installer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Fabric Data Engineering }
    - { id: b, text: SQL Database Projects }
    - { id: c, text: Azure Resources }
    - { id: d, text: SQL Server (mssql) }
    - { id: e, text: Power Platform Tools }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The SQL Database Projects extension creates, builds and publishes the project, and the SQL Server (mssql) extension provides the connection profiles used to extract and publish to the warehouse. Together with the .NET SDK, they are the prerequisites for warehouse projects in Visual Studio Code.
    fr: |
      L'extension SQL Database Projects crée, génère et publie le projet, et l'extension SQL Server (mssql) fournit les profils de connexion utilisés pour extraire depuis l'entrepôt et publier vers celui-ci. Avec le SDK .NET, ce sont les prérequis des projets d'entrepôt dans Visual Studio Code.
  options:
    a: { en: "The Fabric Data Engineering extension is for notebooks and Spark job definitions, not for database projects.", fr: "L'extension Fabric Data Engineering sert aux notebooks et aux définitions de tâche Spark, pas aux projets de base de données." }
    c: { en: "Azure Resources browses Azure subscriptions; it isn't needed to build or publish a warehouse project.", fr: "Azure Resources parcourt des abonnements Azure ; elle n'est pas nécessaire pour générer ou publier un projet d'entrepôt." }
    e: { en: "Power Platform Tools is for Power Platform solutions, not for Fabric warehouse schemas.", fr: "Power Platform Tools sert aux solutions Power Platform, pas aux schémas d'entrepôt Fabric." }
references:
  - title: Develop Warehouse Projects in Visual Studio Code
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/develop-warehouse-project
