id: dp700-1c-ddm-permissions
objective: "1.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1. You plan to use dynamic data masking in DW1 and to delegate the work to three groups that don't have a workspace role. Each group has only Read permission on DW1.

    You need to grant each group the permissions it needs. The solution must follow the principle of least privilege.

    Which permissions should you grant to each group? To answer, drag the appropriate permissions to the correct groups. Each permission may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1. Vous prévoyez d'utiliser le masquage dynamique des données dans DW1 et de déléguer le travail à trois groupes qui n'ont aucun rôle d'espace de travail. Chaque groupe n'a que l'autorisation Read sur DW1.

    Vous devez accorder à chaque groupe les autorisations dont il a besoin. La solution doit respecter le principe du moindre privilège.

    Quelles autorisations devez-vous accorder à chaque groupe ? Pour répondre, faites glisser les autorisations appropriées vers les groupes correspondants. Chaque autorisation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: create, text: { en: "CREATE TABLE, and ALTER on the schema", fr: "CREATE TABLE, et ALTER sur le schéma" } }
    - { id: altermask, text: { en: "ALTER ANY MASK, and ALTER on the table", fr: "ALTER ANY MASK, et ALTER sur la table" } }
    - { id: select, text: { en: "SELECT on the table", fr: "SELECT sur la table" } }
    - { id: unmask, text: { en: "UNMASK on the table", fr: "UNMASK sur la table" } }
    - { id: control, text: { en: "CONTROL on the database", fr: "CONTROL sur la base de données" } }
  targets:
    - id: builders
      text: { en: "Builders: create new tables in the Sales schema whose columns are masked at creation", fr: "Builders : créer dans le schéma Sales de nouvelles tables dont les colonnes sont masquées dès la création" }
    - id: secops
      text: { en: "SecOps: add, change and remove masks on the existing dbo.Customer table", fr: "SecOps : ajouter, modifier et retirer des masques sur la table existante dbo.Customer" }
    - id: support
      text: { en: "Support: query dbo.Customer and see masked values only", fr: "Support : interroger dbo.Customer et ne voir que des valeurs masquées" }
answer:
  mapping: { builders: create, secops: altermask, support: select }
explanation:
  correct:
    en: |
      Creating a table with masked columns requires CREATE TABLE and ALTER on the schema. Adding, replacing or removing a mask on an existing column requires ALTER ANY MASK and ALTER on the table. SELECT alone returns masked values, which is what the support team needs.
    fr: |
      Créer une table avec des colonnes masquées exige CREATE TABLE et ALTER sur le schéma. Ajouter, remplacer ou retirer un masque sur une colonne existante exige ALTER ANY MASK et ALTER sur la table. SELECT seul renvoie des valeurs masquées, ce dont l'équipe du support a besoin.
  options:
    unmask: { en: "UNMASK reveals the real values; no group needs to see them.", fr: "UNMASK révèle les vraies valeurs ; aucun groupe n'a besoin de les voir." }
    control: { en: "CONTROL includes ALTER ANY MASK and UNMASK, far beyond what any group needs.", fr: "CONTROL inclut ALTER ANY MASK et UNMASK, bien au-delà des besoins de chaque groupe." }
references:
  - title: Dynamic data masking in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking
