id: dp700-1a-onelake-diag-statements
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to turn on OneLake diagnostics for a Fabric workspace named **WS-Payroll** and send the events to a lakehouse named **LH_Logs** in a dedicated workspace named **WS-Logs** on the same capacity. You also plan to apply immutability to WS-Logs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'activer les diagnostics OneLake pour un espace de travail Fabric nommé **WS-Payroll** et d'envoyer les événements vers un lakehouse nommé **LH_Logs** situé dans un espace de travail dédié nommé **WS-Logs**, sur la même capacité. Vous prévoyez aussi d'appliquer l'immuabilité à WS-Logs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Diagnostic events can take up to one hour to begin arriving in LH_Logs after you turn on the setting.
        fr: Les événements de diagnostic peuvent mettre jusqu'à une heure à commencer à arriver dans LH_Logs après l'activation du paramètre.
    - id: s2
      text:
        en: If storage costs grow, you can shorten the immutability period of WS-Logs later.
        fr: Si les coûts de stockage augmentent, vous pouvez raccourcir plus tard la période d'immuabilité de WS-Logs.
    - id: s3
      text:
        en: The events are written as JSON files in the Files section of LH_Logs.
        fr: Les événements sont écrits sous forme de fichiers JSON dans la section Files de LH_Logs.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: It takes up to one hour for diagnostic events to start flowing into the lakehouse. An immutability policy can't be changed once set, so choose its period carefully. Events are stored as JSON files under Files/DiagnosticLogs/OneLake/Workspaces/, partitioned by year, month, day and hour, and you can transform them into Delta tables.
    fr: "Les événements de diagnostic peuvent mettre jusqu'à une heure à commencer à arriver dans le lakehouse. Une stratégie d'immuabilité ne peut plus être modifiée une fois définie : choisissez donc sa période avec soin. Les événements sont stockés sous forme de fichiers JSON dans Files/DiagnosticLogs/OneLake/Workspaces/, partitionnés par année, mois, jour et heure, et vous pouvez les transformer en tables Delta."
references:
  - title: OneLake diagnostics
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-diagnostics-overview
