id: dp700-1b-ws-group-limit
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Reports. Over time, 1,000 individual users were assigned the Viewer role in WS-Reports. When you try to assign the Viewer role to another user, the assignment fails.

    You need to give the Viewer role to 200 additional users. The users must get access to every item of WS-Reports, including items created later. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Reports. Au fil du temps, 1 000 utilisateurs individuels ont reçu le rôle Viewer dans WS-Reports. Quand vous essayez d'attribuer le rôle Viewer à un autre utilisateur, l'attribution échoue.

    Vous devez donner le rôle Viewer à 200 utilisateurs supplémentaires. Les utilisateurs doivent avoir accès à tous les éléments de WS-Reports, y compris ceux créés plus tard. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Share every item of WS-Reports with the 200 users and select Read all data using SQL.", fr: "Partager chaque élément de WS-Reports avec les 200 utilisateurs et sélectionner Read all data using SQL." } }
    - { id: b, text: { en: "Put all 1,200 users in a security group, assign it Viewer and remove the user assignments.", fr: "Placer les 1 200 utilisateurs dans un groupe de sécurité, lui attribuer Viewer et retirer les attributions individuelles." } }
    - { id: c, text: { en: "Create a second workspace for the 200 users and copy the items of WS-Reports into it.", fr: "Créer un second espace de travail pour les 200 utilisateurs et y copier les éléments de WS-Reports." } }
    - { id: d, text: { en: "Ask a Fabric administrator to raise the role assignment limit of the WS-Reports capacity.", fr: "Demander à un administrateur Fabric d'augmenter la limite d'attributions de rôle de la capacité de WS-Reports." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A workspace accepts at most 1,000 users or groups in its workspace roles, but the limit doesn't count the members of a group. Assigning the role to one security group that contains all the users, and removing the individual assignments, frees the limit and covers current and future items with a single assignment.
    fr: |
      Un espace de travail accepte au maximum 1 000 utilisateurs ou groupes dans ses rôles d'espace de travail, mais la limite ne compte pas les membres d'un groupe. Attribuer le rôle à un seul groupe de sécurité qui contient tous les utilisateurs, et retirer les attributions individuelles, libère la limite et couvre les éléments actuels et futurs avec une seule attribution.
  options:
    a: { en: "Item sharing must be repeated for every new item, and it doesn't give the workspace Viewer role.", fr: "Le partage d'éléments doit être répété pour chaque nouvel élément, et il ne donne pas le rôle Viewer de l'espace de travail." }
    c: { en: "A copy of the workspace doubles the items to maintain and doesn't receive the items created later in WS-Reports.", fr: "Une copie de l'espace de travail double les éléments à maintenir et ne reçoit pas les éléments créés plus tard dans WS-Reports." }
    d: { en: "The limit applies per workspace and isn't a capacity setting that an administrator can raise.", fr: "La limite s'applique par espace de travail et n'est pas un paramètre de capacité qu'un administrateur peut augmenter." }
references:
  - title: Workspaces - Add Workspace Role Assignment
    url: https://learn.microsoft.com/en-us/rest/api/fabric/core/workspaces/add-workspace-role-assignment
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
