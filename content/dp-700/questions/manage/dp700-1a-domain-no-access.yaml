id: dp700-1a-domain-no-access
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your Fabric tenant contains a domain named **Finance**. A workspace named **WS-FinReport** is assigned to Finance and contains a lakehouse named **LH_Ledger** and several other items.

    A financial analyst named **Paul** has no role in WS-FinReport. When Paul selects the Finance domain in the OneLake catalog, LH_Ledger doesn't appear.

    You need to ensure that Paul can discover and read LH_Ledger. Paul must not get access to the other items of WS-FinReport.

    What should you do?
  fr: |
    Votre locataire Fabric contient un domaine nommé **Finance**. Un espace de travail nommé **WS-FinReport** est attribué à Finance et contient un lakehouse nommé **LH_Ledger** ainsi que plusieurs autres éléments.

    Un analyste financier nommé **Paul** n'a aucun rôle dans WS-FinReport. Quand Paul sélectionne le domaine Finance dans le catalogue OneLake, LH_Ledger n'apparaît pas.

    Vous devez faire en sorte que Paul puisse découvrir et lire LH_Ledger. Paul ne doit pas obtenir l'accès aux autres éléments de WS-FinReport.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Make Paul a domain contributor of Finance", fr: "Faire de Paul un contributeur du domaine Finance" } }
    - { id: c, text: { en: "Assign Paul the Viewer role on WS-FinReport", fr: "Attribuer à Paul le rôle Viewer sur WS-FinReport" } }
    - { id: b, text: { en: "Share LH_Ledger with Paul", fr: "Partager LH_Ledger avec Paul" } }
    - { id: d, text: { en: "Make Paul a domain admin of Finance", fr: "Faire de Paul un administrateur du domaine Finance" } }
answer: { optionId: b }
explanation:
  correct:
    en: Domain assignment doesn't affect who can see or open items; discovery and access depend on workspace roles and item permissions. Sharing LH_Ledger gives Paul an item permission on that lakehouse only, so it appears in his OneLake catalog under the Finance domain and the other items stay hidden.
    fr: "L'attribution à un domaine n'a aucun effet sur qui peut voir ou ouvrir les éléments ; la découverte et l'accès dépendent des rôles d'espace de travail et des autorisations sur les éléments. Partager LH_Ledger donne à Paul une autorisation sur ce seul lakehouse : il apparaît alors dans son catalogue OneLake sous le domaine Finance, et les autres éléments restent masqués."
  options:
    a:
      en: Domain contributors can assign workspaces they administer to the domain; the role grants no access to items.
      fr: Les contributeurs de domaine peuvent attribuer au domaine les espaces de travail qu'ils administrent ; ce rôle n'accorde aucun accès aux éléments.
    c:
      en: The Viewer role gives read access to every item of the workspace, which the requirement forbids.
      fr: Le rôle Viewer donne un accès en lecture à tous les éléments de l'espace de travail, ce que l'exigence interdit.
    d:
      en: Domain admins manage the domain's settings and assignments; being a domain admin doesn't grant access to the items in the domain.
      fr: Les administrateurs de domaine gèrent les paramètres et les attributions du domaine ; être administrateur de domaine n'accorde pas l'accès aux éléments du domaine.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
