id: dp700-cs1c-spark-settings
objective: "1.1.1"
type: multi
caseStudy: dp700-cs1c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You are a workspace admin of TR-Lab. You need to meet the Spark requirements. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur de l'espace de travail TR-Lab. Vous devez satisfaire les exigences relatives à Spark. Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a custom Spark pool with autoscale and set it as the default pool of TR-Lab", fr: "Créer un pool Spark personnalisé avec mise à l'échelle automatique et le définir comme pool par défaut de TR-Lab" } }
    - { id: b, text: { en: "Publish an environment that contains trey_assaykit and set it as the default environment of TR-Lab", fr: "Publier un environnement qui contient trey_assaykit et le définir comme environnement par défaut de TR-Lab" } }
    - { id: c, text: { en: "Turn on high concurrency mode for notebooks in the Spark settings of TR-Lab", fr: "Activer le mode haute concurrence pour les notebooks dans les paramètres Spark de TR-Lab" } }
    - { id: d, text: { en: "Turn off Customize compute configurations for items in the Spark settings of TR-Lab", fr: "Désactiver Customize compute configurations for items dans les paramètres Spark de TR-Lab" } }
    - { id: e, text: { en: "Turn on Reserve maximum cores for active Spark jobs in the Spark settings of TR-Lab", fr: "Activer Reserve maximum cores for active Spark jobs dans les paramètres Spark de TR-Lab" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      An environment holds library dependencies, compute properties and the runtime version; when it is the default environment of the workspace, the items that use the workspace default get trey_assaykit without any change. When Customize compute configurations for items is turned off, users can no longer adjust the driver and executor cores and memory of notebooks and Spark job definitions; the default pool configuration applies.
    fr: |-
      Un environnement contient des dépendances de bibliothèques, des propriétés de calcul et la version du runtime ; quand il est l'environnement par défaut de l'espace de travail, les éléments qui utilisent la valeur par défaut de l'espace de travail obtiennent trey_assaykit sans aucune modification. Quand Customize compute configurations for items est désactivé, les utilisateurs ne peuvent plus ajuster les cœurs et la mémoire du pilote et des exécuteurs des notebooks et des définitions de travail Spark ; la configuration du pool par défaut s'applique.
  options:
    a:
      en: |-
        A custom pool changes the node size and scaling of the default compute; it neither installs a library nor prevents users from changing item-level compute properties.
      fr: |-
        Un pool personnalisé modifie la taille des nœuds et la mise à l'échelle du calcul par défaut ; il n'installe aucune bibliothèque et n'empêche pas les utilisateurs de modifier les propriétés de calcul au niveau des éléments.
    c:
      en: |-
        High concurrency mode lets several notebooks share one Spark session; it does not install libraries or lock the compute configuration.
      fr: |-
        Le mode haute concurrence permet à plusieurs notebooks de partager une session Spark ; il n'installe pas de bibliothèques et ne verrouille pas la configuration de calcul.
    e:
      en: |-
        This setting replaces optimistic job admission by reserving the maximum cores of each job; it has no effect on libraries or on who can change item compute sizes.
      fr: |-
        Ce paramètre remplace l'admission optimiste des travaux en réservant le nombre maximal de cœurs de chaque travail ; il n'a aucun effet sur les bibliothèques ni sur les personnes autorisées à modifier la taille de calcul des éléments.
references:
  - title: Data Engineering workspace administration settings in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
