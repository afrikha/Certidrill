id: dp700-1b-ws-role-highest
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Data. The workspace roles are assigned as follows:

    | Principal | Role |
    | --- | --- |
    | SG-Readers (security group) | Viewer |
    | SG-Builders (security group) | Contributor |
    | User1 | Viewer |

    User1 is a member of SG-Readers and SG-Builders.

    Which effective workspace role does User1 have in WS-Data?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Data. Les rôles d'espace de travail sont attribués comme suit :

    | Principal | Rôle |
    | --- | --- |
    | SG-Readers (groupe de sécurité) | Viewer |
    | SG-Builders (groupe de sécurité) | Contributor |
    | User1 | Viewer |

    User1 est membre de SG-Readers et de SG-Builders.

    Quel rôle d'espace de travail effectif User1 a-t-il dans WS-Data ?
body:
  options:
    - { id: a, text: { en: "Viewer, because the role assigned directly to a user overrides group roles", fr: "Viewer, car le rôle attribué directement à un utilisateur remplace les rôles de groupe" } }
    - { id: b, text: { en: "Viewer, because the most restrictive of the assigned roles applies", fr: "Viewer, car le plus restrictif des rôles attribués s'applique" } }
    - { id: c, text: { en: "Contributor, because the highest of the assigned roles applies", fr: "Contributor, car le plus élevé des rôles attribués s'applique" } }
    - { id: d, text: { en: "No role, because conflicting assignments block access to the workspace", fr: "Aucun rôle, car des attributions en conflit bloquent l'accès à l'espace de travail" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Workspace roles don't conflict. A user who receives several roles, directly or through groups, gets the highest permission provided by any of them, so User1 has the Contributor role.
    fr: |
      Les rôles d'espace de travail n'entrent pas en conflit. Un utilisateur qui reçoit plusieurs rôles, directement ou par des groupes, obtient l'autorisation la plus élevée accordée par l'un d'eux : User1 a donc le rôle Contributor.
  options:
    a: { en: "A direct assignment has no priority over a group assignment; the highest role wins.", fr: "Une attribution directe n'a pas priorité sur une attribution de groupe ; le rôle le plus élevé l'emporte." }
    b: { en: "Fabric applies the highest role, not the most restrictive one.", fr: "Fabric applique le rôle le plus élevé, pas le plus restrictif." }
    d: { en: "Several role assignments never block access; they combine into the highest role.", fr: "Plusieurs attributions de rôle ne bloquent jamais l'accès ; elles se combinent en faveur du rôle le plus élevé." }
references:
  - title: Roles in workspaces in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
