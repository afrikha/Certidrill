id: dp700-1b-deploy-empty-lakehouse
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a deployment pipeline named DP-Retail. The Development stage is assigned a workspace named WS-Dev that contains a lakehouse named LH_Sales, a notebook named NB_Transform and a pipeline named PL_Ingest. PL_Ingest loads the tables of LH_Sales, and NB_Transform reads them.

    You deploy all the items from Development to the empty Test stage. When NB_Transform runs in the Test workspace, it fails because the tables of LH_Sales are not found.

    The Test stage must use its own data, not the development data. What should you do?
  fr: |
    Vous disposez d'un pipeline de déploiement nommé DP-Retail. La phase Development est affectée à un espace de travail nommé WS-Dev qui contient un lakehouse nommé LH_Sales, un notebook nommé NB_Transform et un pipeline nommé PL_Ingest. PL_Ingest charge les tables de LH_Sales, et NB_Transform les lit.

    Vous déployez tous les éléments de Development vers la phase Test vide. Quand NB_Transform s'exécute dans l'espace de travail de Test, il échoue, car les tables de LH_Sales sont introuvables.

    La phase Test doit utiliser ses propres données, pas les données de développement. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a default lakehouse rule that points NB_Transform in Test to LH_Sales in WS-Dev.", fr: "Créer une règle de lakehouse par défaut qui fait pointer NB_Transform de Test vers LH_Sales de WS-Dev." } }
    - { id: b, text: { en: "Deploy LH_Sales again and select the related items of LH_Sales.", fr: "Déployer de nouveau LH_Sales en sélectionnant les éléments connexes de LH_Sales." } }
    - { id: c, text: { en: "Connect the Test workspace to the Git branch of WS-Dev and update it.", fr: "Connecter l'espace de travail de Test à la branche Git de WS-Dev et le mettre à jour." } }
    - { id: d, text: { en: "Run PL_Ingest in the Test workspace to load the tables of LH_Sales.", fr: "Exécuter PL_Ingest dans l'espace de travail de Test pour charger les tables de LH_Sales." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A deployment pipeline copies item definitions and metadata, never data. Deploying LH_Sales creates an empty lakehouse with the same name in the Test workspace, and NB_Transform is remapped to it. Running the deployed PL_Ingest in Test loads the tables there, so Test works with its own data.
    fr: |
      Un pipeline de déploiement copie les définitions et les métadonnées des éléments, jamais les données. Le déploiement de LH_Sales crée un lakehouse vide du même nom dans l'espace de travail de Test, et NB_Transform est remappé vers celui-ci. L'exécution du PL_Ingest déployé dans Test y charge les tables, et Test travaille avec ses propres données.
  options:
    a: { en: "Pointing the Test notebook to the development lakehouse would make Test use the development data.", fr: "Faire pointer le notebook de Test vers le lakehouse de développement ferait utiliser les données de développement par Test." }
    b: { en: "Selecting related items deploys dependencies, but a deployment still copies no data.", fr: "La sélection des éléments connexes déploie les dépendances, mais un déploiement ne copie toujours aucune donnée." }
    c: { en: "Git stores the lakehouse metadata and shortcut definitions, not its tables.", fr: "Git stocke les métadonnées du lakehouse et les définitions de raccourcis, pas ses tables." }
references:
  - title: Lakehouse git integration and deployment pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-git-deployment-pipelines
  - title: The Microsoft Fabric deployment pipelines process
    url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
