id: dp700-1b-granular-onelake-rls-rule
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a schema-enabled lakehouse named LH_Sales that contains a Delta table named dbo.Orders. dbo.Orders has the columns OrderID, Region, OrderYear and Amount. OneLake security is enabled.

    You create a OneLake security role for the central sales team. Members must see only the orders of the West and Central regions placed in 2025 or later.

    How should you complete the row security rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse avec schémas nommé LH_Sales qui contient une table Delta nommée dbo.Orders. dbo.Orders possède les colonnes OrderID, Region, OrderYear et Amount. La sécurité OneLake est activée.

    Vous créez un rôle de sécurité OneLake pour l'équipe commerciale centrale. Les membres ne doivent voir que les commandes des régions West et Central passées en 2025 ou après.

    Comment devez-vous compléter la règle de sécurité des lignes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT * FROM [[tbl]]
    WHERE Region [[op]] ('West', 'Central') AND OrderYear [[cmp]] 2025
  slots:
    - id: tbl
      options:
        - { id: orders, text: Orders }
        - { id: dbo, text: dbo.Orders }
        - { id: lh, text: LH_Sales.Orders }
        - { id: path, text: Tables.dbo.Orders }
    - id: op
      options:
        - { id: eq, text: "=" }
        - { id: in, text: IN }
        - { id: like, text: LIKE }
    - id: cmp
      options:
        - { id: gt, text: ">" }
        - { id: ge, text: ">=" }
        - { id: eq, text: "=" }
answer:
  values: { tbl: dbo, op: in, cmp: ge }
explanation:
  correct:
    en: |
      OneLake row rules use the form `SELECT * FROM {schema_name}.{table_name} WHERE ...`, and the schema name is required when the item supports schemas, so the table is `dbo.Orders`. `IN` matches any value of a list, and `>=` keeps 2025 and later years. The supported operators include `=`, `<>`, comparisons, `IN`, `NOT`, `AND` and `OR`.
    fr: |
      Les règles de lignes OneLake prennent la forme `SELECT * FROM {schema_name}.{table_name} WHERE ...`, et le nom du schéma est obligatoire quand l'élément prend en charge les schémas ; la table est donc `dbo.Orders`. `IN` correspond à n'importe quelle valeur d'une liste, et `>=` conserve 2025 et les années suivantes. Les opérateurs pris en charge incluent `=`, `<>`, les comparaisons, `IN`, `NOT`, `AND` et `OR`.
  options:
    orders: { en: "In a schema-enabled lakehouse the rule must include the schema name.", fr: "Dans un lakehouse avec schémas, la règle doit inclure le nom du schéma." }
    lh: { en: "The rule names the schema and the table, not the lakehouse.", fr: "La règle nomme le schéma et la table, pas le lakehouse." }
    path: { en: "The rule uses the schema and table names, not the OneLake folder path.", fr: "La règle utilise les noms du schéma et de la table, pas le chemin du dossier OneLake." }
    eq: { en: "= compares with a single value, and = 2025 would exclude the later years.", fr: "= compare à une seule valeur, et = 2025 exclurait les années suivantes." }
    like: { en: "LIKE isn't among the operators supported by OneLake row rules.", fr: "LIKE ne fait pas partie des opérateurs pris en charge par les règles de lignes OneLake." }
    gt: { en: "> 2025 would exclude the orders of 2025.", fr: "> 2025 exclurait les commandes de 2025." }
references:
  - title: OneLake row-level security (RLS) syntax
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/row-level-security-syntax
