id: dp700-1a-onelake-diag-stopped
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two Fabric capacities named **Cap1** and **Cap2**. A workspace named **WS-Audit** on Cap1 contains a lakehouse named **LH_Diag**, and immutability is applied to WS-Audit.

    OneLake diagnostics was turned on for a workspace named **WS-Claims** with LH_Diag as the destination. Last week, WS-Claims was moved from Cap1 to Cap2. Since then, no new diagnostic events for WS-Claims appear in LH_Diag.

    You need to resume the collection of diagnostic events for WS-Claims.

    What should you do?
  fr: |
    Vous disposez de deux capacités Fabric nommées **Cap1** et **Cap2**. Un espace de travail nommé **WS-Audit** sur Cap1 contient un lakehouse nommé **LH_Diag**, et l'immuabilité est appliquée à WS-Audit.

    Les diagnostics OneLake ont été activés pour un espace de travail nommé **WS-Claims**, avec LH_Diag comme destination. La semaine dernière, WS-Claims a été déplacé de Cap1 vers Cap2. Depuis, aucun nouvel événement de diagnostic de WS-Claims n'apparaît dans LH_Diag.

    Vous devez reprendre la collecte des événements de diagnostic de WS-Claims.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Remove the immutability policy from WS-Audit, then turn diagnostics off and on again", fr: "Retirer la stratégie d'immuabilité de WS-Audit, puis désactiver et réactiver les diagnostics" } }
    - { id: c, text: { en: "Ask a Fabric administrator to turn on Include end-user identifiers in OneLake diagnostic logs", fr: "Demander à un administrateur Fabric d'activer Include end-user identifiers in OneLake diagnostic logs" } }
    - { id: b, text: { en: "Turn diagnostics on again for WS-Claims and select a lakehouse on Cap2", fr: "Réactiver les diagnostics pour WS-Claims et sélectionner un lakehouse sur Cap2" } }
    - { id: d, text: { en: "Wait 24 hours, because events of a moved workspace are delivered in a daily batch", fr: "Attendre 24 heures, car les événements d'un espace de travail déplacé sont livrés par lot quotidien" } }
answer: { optionId: b }
explanation:
  correct:
    en: Moving a workspace to another capacity disables its diagnostic logging. The destination lakehouse must be on the same capacity as the monitored workspace, so you turn diagnostics on again for WS-Claims and select a lakehouse on Cap2 (or move the audit workspace to Cap2 first). Events start to flow within about an hour.
    fr: "Déplacer un espace de travail vers une autre capacité désactive sa journalisation de diagnostic. Le lakehouse de destination doit être sur la même capacité que l'espace de travail surveillé : vous réactivez donc les diagnostics pour WS-Claims en sélectionnant un lakehouse sur Cap2 (ou en déplaçant d'abord l'espace de travail d'audit vers Cap2). Les événements commencent à arriver en une heure environ."
  options:
    a:
      en: An immutability policy can't be changed once set, and it doesn't block new events; it only prevents changing or deleting existing ones.
      fr: Une stratégie d'immuabilité ne peut plus être modifiée une fois définie, et elle ne bloque pas les nouveaux événements ; elle empêche seulement de modifier ou de supprimer les événements existants.
    c:
      en: This tenant setting controls whether events include identifiers such as the user principal name and IP address; it doesn't stop or start the collection.
      fr: Ce paramètre du locataire détermine si les événements contiennent des identifiants comme le nom d'utilisateur principal et l'adresse IP ; il n'arrête ni ne démarre la collecte.
    d:
      en: Events are written hourly and begin to flow within about an hour; there is no daily batch, and logging stays disabled after a capacity move.
      fr: Les événements sont écrits toutes les heures et commencent à arriver en une heure environ ; il n'y a pas de lot quotidien, et la journalisation reste désactivée après un changement de capacité.
references:
  - title: OneLake diagnostics
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-diagnostics-overview
