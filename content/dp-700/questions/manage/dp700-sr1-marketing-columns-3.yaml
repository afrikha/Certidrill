id: dp700-sr1-marketing-columns-3
objective: "1.3.3"
type: series_yesno
series: dp700-sr1-marketing-columns
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You add ReadData and deny the other columns.
  fr: Vous ajoutez ReadData et refusez les autres colonnes.
body:
  solution:
    en: |
      From **Manage permissions** of DW1, you add the **Read all data using SQL** (ReadData) permission for Marketing. You then run the following T-SQL statement in DW1:

      ```sql
      DENY SELECT ON dbo.Customers (CustomerName, Email, Phone) TO [Marketing];
      ```
    fr: |
      Depuis **Manage permissions** de DW1, vous ajoutez l'autorisation **Read all data using SQL** (ReadData) pour Marketing. Vous exécutez ensuite l'instruction T-SQL suivante dans DW1 :

      ```sql
      DENY SELECT ON dbo.Customers (CustomerName, Email, Phone) TO [Marketing];
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The DENY blocks the three sensitive columns of dbo.Customers, but ReadData is equivalent to db_datareader: it gives read access to every table and view of DW1. Marketing could therefore query all the other tables, which the requirements forbid. Sharing with Read only and granting the needed columns is the least-privilege approach.
    fr: |
      Le DENY bloque les trois colonnes sensibles de dbo.Customers, mais ReadData équivaut à db_datareader : il donne un accès en lecture à toutes les tables et vues de DW1. Marketing pourrait donc interroger toutes les autres tables, ce que les exigences interdisent. Partager avec Read seulement et accorder les colonnes nécessaires est l'approche du moindre privilège.
references:
  - title: Share your data and manage permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
