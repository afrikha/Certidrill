id: dp700-1b-item-remove-readall
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1. You shared DW1 with User3 and selected **Read all data using SQL** and **Read all data using Apache Spark**. User3 has no workspace role.

    User3 must keep querying DW1 with T-SQL without interruption, but must no longer read the files of DW1 in OneLake with Spark.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1. Vous avez partagé DW1 avec User3 en sélectionnant **Read all data using SQL** et **Read all data using Apache Spark**. User3 n'a aucun rôle d'espace de travail.

    User3 doit continuer à interroger DW1 avec T-SQL sans interruption, mais ne doit plus lire les fichiers de DW1 dans OneLake avec Spark.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In Manage permissions, select Remove access for User3, and then share DW1 again with Read all data using SQL.", fr: "Dans Manage permissions, sélectionner Remove access pour User3, puis partager de nouveau DW1 avec Read all data using SQL." } }
    - { id: b, text: { en: "In Manage permissions, select Remove ReadAll for User3.", fr: "Dans Manage permissions, sélectionner Remove ReadAll pour User3." } }
    - { id: c, text: { en: "In DW1, run DENY SELECT ON SCHEMA::dbo TO [User3].", fr: "Dans DW1, exécuter DENY SELECT ON SCHEMA::dbo TO [User3]." } }
    - { id: d, text: { en: "Create a OneLake security role on DW1 that excludes User3.", fr: "Créer sur DW1 un rôle de sécurité OneLake qui exclut User3." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ReadData and ReadAll are separate item permissions. Remove ReadAll in Manage permissions takes away the Spark and OneLake file access and leaves ReadData, so User3 keeps querying DW1 with T-SQL.
    fr: |
      ReadData et ReadAll sont des autorisations d'élément distinctes. Remove ReadAll dans Manage permissions retire l'accès aux fichiers via Spark et OneLake et conserve ReadData : User3 continue d'interroger DW1 avec T-SQL.
  options:
    a: { en: "Remove access deletes every item permission, which interrupts the T-SQL access until DW1 is shared again.", fr: "Remove access supprime toutes les autorisations d'élément, ce qui interrompt l'accès T-SQL jusqu'au nouveau partage de DW1." }
    c: { en: "DENY blocks the T-SQL queries that User3 must keep, and doesn't affect Spark access to the files.", fr: "DENY bloque les requêtes T-SQL que User3 doit conserver, et n'affecte pas l'accès Spark aux fichiers." }
    d: { en: "OneLake security roles are supported on lakehouses and mirrored items, not on warehouses.", fr: "Les rôles de sécurité OneLake sont pris en charge sur les lakehouses et les éléments mis en miroir, pas sur les entrepôts." }
references:
  - title: Share Your Warehouse and Manage Permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
