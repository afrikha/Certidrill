id: dp700-1d-job-failed-trigger
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has two Fabric workspaces named WS_Partner and WS_Ops. WS_Partner contains a notebook named NB_Prices that another team schedules every night. A company policy forbids any change to NB_Prices and to its schedule. WS_Ops contains a pipeline named PL_Fallback.

    You need PL_Fallback to start automatically every time a run of NB_Prices fails, whether the run was scheduled or started manually.

    What should you do?
  fr: |
    Woodgrove dispose de deux espaces de travail Fabric nommés WS_Partner et WS_Ops. WS_Partner contient un notebook nommé NB_Prices qu'une autre équipe planifie chaque nuit. Une stratégie de l'entreprise interdit toute modification de NB_Prices et de sa planification. WS_Ops contient un pipeline nommé PL_Fallback.

    Vous devez faire en sorte que PL_Fallback démarre automatiquement chaque fois qu'une exécution de NB_Prices échoue, que l'exécution soit planifiée ou lancée manuellement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add a trigger to PL_Fallback on job events of NB_Prices for the ItemJobFailed event type."
        fr: "Ajouter à PL_Fallback un déclencheur sur les événements de travaux de NB_Prices pour le type d'événement ItemJobFailed."
    - id: b
      text:
        en: "Add the PL_Fallback owner to the failure notifications of the NB_Prices schedule, and run PL_Fallback when an email arrives."
        fr: "Ajouter le propriétaire de PL_Fallback aux notifications d'échec de la planification de NB_Prices, et exécuter PL_Fallback à la réception d'un e-mail."
    - id: c
      text:
        en: "Add a pipeline in WS_Partner that runs NB_Prices in a Notebook activity and calls PL_Fallback from an Invoke pipeline activity on the On failure path."
        fr: "Ajouter dans WS_Partner un pipeline qui exécute NB_Prices dans une activité Notebook et appelle PL_Fallback depuis une activité Invoke pipeline sur le chemin On failure."
    - id: d
      text:
        en: "Add a trigger to PL_Fallback on workspace item events of WS_Partner for changes to NB_Prices."
        fr: "Ajouter à PL_Fallback un déclencheur sur les événements d'éléments d'espace de travail de WS_Partner pour les modifications de NB_Prices."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Notebooks emit job events, and Microsoft.Fabric.ItemJobFailed is raised when a job fails, whether it was started by a schedule or manually. A pipeline trigger on this event starts PL_Fallback without changing NB_Prices or its schedule.
    fr: |
      Les notebooks émettent des événements de travaux, et Microsoft.Fabric.ItemJobFailed est émis quand un travail échoue, qu'il ait été lancé par une planification ou manuellement. Un déclencheur de pipeline sur cet événement démarre PL_Fallback sans modifier NB_Prices ni sa planification.
  options:
    b: { en: "Failure notifications send emails only for scheduled runs, require changing the schedule's settings, and cannot start a pipeline.", fr: "Les notifications d'échec n'envoient des e-mails que pour les exécutions planifiées, exigent de modifier les paramètres de la planification et ne peuvent pas démarrer de pipeline." }
    c: { en: "A new pipeline would create additional runs of NB_Prices; it would not react to the runs started by the other team's schedule or manually.", fr: "Un nouveau pipeline créerait des exécutions supplémentaires de NB_Prices ; il ne réagirait pas aux exécutions lancées par la planification de l'autre équipe ou manuellement." }
    d: { en: "Workspace item events report that an item is created, changed or deleted, not that one of its runs failed.", fr: "Les événements d'éléments d'espace de travail signalent qu'un élément est créé, modifié ou supprimé, pas que l'une de ses exécutions a échoué." }
references:
  - title: Explore Job events in Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/explore-fabric-job-events
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-storage-event-triggers
