id: dp700-1a-airflow-min-capacity
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Your company plans two Fabric workspaces, each on its own capacity:

    - **WS-Files** will run simple DAGs that move files, on a custom Apache Airflow pool with **Small** nodes.
    - **WS-Finance** will run complex production DAGs, on a custom Apache Airflow pool with **Large** nodes.

    Neither pool uses extra nodes, and no other workload runs on the two capacities. You need to choose the smallest capacity SKU that Microsoft recommends for each pool.

    Which SKU should you choose for each capacity? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre entreprise prévoit deux espaces de travail Fabric, chacun sur sa propre capacité :

    - **WS-Files** exécutera des DAG simples qui déplacent des fichiers, sur un pool Apache Airflow personnalisé avec des nœuds **Small**.
    - **WS-Finance** exécutera des DAG de production complexes, sur un pool Apache Airflow personnalisé avec des nœuds **Large**.

    Aucun des deux pools n'utilise de nœuds supplémentaires, et aucune autre charge de travail ne s'exécute sur les deux capacités. Vous devez choisir la plus petite référence SKU de capacité recommandée par Microsoft pour chaque pool.

    Quelle référence SKU devez-vous choisir pour chaque capacité ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Capacity of WS-Files: [[small]]

      Capacity of WS-Finance: [[large]]
    fr: |
      Capacité de WS-Files : [[small]]

      Capacité de WS-Finance : [[large]]
  slots:
    - id: small
      options:
        - { id: f2, text: "F2" }
        - { id: f4, text: "F4" }
        - { id: f8, text: "F8" }
        - { id: f16, text: "F16" }
    - id: large
      options:
        - { id: f8, text: "F8" }
        - { id: f16, text: "F16" }
        - { id: f32, text: "F32" }
        - { id: f64, text: "F64" }
answer:
  values: { small: f8, large: f16 }
explanation:
  correct:
    en: The base nodes of a small custom pool use about 5 CUs, and the minimum recommended capacity is an F8 (8 CUs). A large pool uses about 10 CUs for its base nodes, and the minimum recommended capacity is an F16 (16 CUs).
    fr: Les nœuds de base d'un petit pool personnalisé utilisent environ 5 CU, et la capacité minimale recommandée est une F8 (8 CU). Un grand pool utilise environ 10 CU pour ses nœuds de base, et la capacité minimale recommandée est une F16 (16 CU).
  options:
    f4:
      en: An F4 provides 4 CUs, fewer than the 5 CUs that the base nodes of a small pool use.
      fr: Une F4 fournit 4 CU, moins que les 5 CU utilisées par les nœuds de base d'un petit pool.
    f32:
      en: An F32 is the guidance for two large pools; one large pool needs at least an F16.
      fr: Une F32 correspond à la recommandation pour deux grands pools ; un seul grand pool demande au moins une F16.
references:
  - title: Apache Airflow compute in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-compute
