id: dp700-1c-ols-role-configs
objective: "1.3.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a schema-enabled lakehouse named Lakehouse1. The SQL analytics endpoint of Lakehouse1 uses User's identity access mode. All the users below have the Viewer role in the workspace and aren't members of DefaultReader.

    You need to configure OneLake security for the following groups:

    - Interns: read only the files in Files/public with Spark.
    - Partners: upload, rename and delete files in Files/landing by using OneLake file explorer, without any other access.
    - Managers: read only the EMEA rows of dbo.Sales, from Spark and from T-SQL.
    - Analysts: read dbo.Employee without the Salary column, from Spark and from T-SQL.

    Which role configuration should you create for each group? To answer, drag the appropriate configurations to the correct groups. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse avec schémas nommé Lakehouse1. Le point de terminaison d'analytique SQL de Lakehouse1 utilise le mode User's identity access mode. Tous les utilisateurs ci-dessous ont le rôle Viewer dans l'espace de travail et ne sont pas membres de DefaultReader.

    Vous devez configurer la sécurité OneLake pour les groupes suivants :

    - Interns : lire uniquement les fichiers de Files/public avec Spark.
    - Partners : charger, renommer et supprimer des fichiers dans Files/landing avec l'explorateur de fichiers OneLake, sans aucun autre accès.
    - Managers : lire uniquement les lignes EMEA de dbo.Sales, depuis Spark et en T-SQL.
    - Analysts : lire dbo.Employee sans la colonne Salary, depuis Spark et en T-SQL.

    Quelle configuration de rôle devez-vous créer pour chaque groupe ? Pour répondre, faites glisser les configurations appropriées vers les groupes correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: readfolder, text: { en: "Read on the folder", fr: "Read sur le dossier" } }
    - { id: rwfolder, text: { en: "ReadWrite on the folder", fr: "ReadWrite sur le dossier" } }
    - { id: readrow, text: { en: "Read on the table with a row security rule", fr: "Read sur la table avec une règle de sécurité des lignes" } }
    - { id: readcol, text: { en: "Read on the table with Salary set to Hide in column security", fr: "Read sur la table avec Salary réglée sur Hide dans la sécurité des colonnes" } }
    - { id: rwrow, text: { en: "ReadWrite on the table with a row security rule", fr: "ReadWrite sur la table avec une règle de sécurité des lignes" } }
    - { id: alldata, text: { en: "Read on All data", fr: "Read sur All data" } }
  targets:
    - { id: interns, text: Interns }
    - { id: partners, text: Partners }
    - { id: managers, text: Managers }
    - { id: analysts, text: Analysts }
answer:
  mapping: { interns: readfolder, partners: rwfolder, managers: readrow, analysts: readcol }
explanation:
  correct:
    en: |
      A Read role scoped to a folder gives folder-level security. ReadWrite on a folder lets users who only have Read on the item create, rename, delete and upload files there through Spark, OneLake file explorer or the OneLake APIs. Row and column rules are added to Read roles on Delta tables and are enforced by Spark and, in User's identity access mode, by the SQL analytics endpoint.
    fr: |
      Un rôle Read limité à un dossier donne une sécurité au niveau du dossier. ReadWrite sur un dossier permet aux utilisateurs qui n'ont que Read sur l'élément d'y créer, renommer, supprimer et charger des fichiers par Spark, l'explorateur de fichiers OneLake ou les API OneLake. Les règles de lignes et de colonnes s'ajoutent aux rôles Read sur des tables Delta et sont appliquées par Spark et, en mode User's identity access mode, par le point de terminaison d'analytique SQL.
  options:
    rwrow: { en: "A ReadWrite role can't contain row or column security rules.", fr: "Un rôle ReadWrite ne peut pas contenir de règles de sécurité des lignes ou des colonnes." }
    alldata: { en: "All data grants access to every table and file of the lakehouse, more than any group needs.", fr: "All data donne accès à toutes les tables et à tous les fichiers du lakehouse, plus que ce dont chaque groupe a besoin." }
references:
  - title: How OneLake security controls data access
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
  - title: Create and manage OneLake security roles
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles
