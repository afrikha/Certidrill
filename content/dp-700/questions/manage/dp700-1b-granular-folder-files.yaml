id: dp700-1b-granular-folder-files
objective: "1.3.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named LH_Sales. OneLake security is enabled, and the DefaultReader role was deleted. The users below have the Viewer role in the workspace and no other permissions. LH_Sales has two OneLake security roles:

    - **Role1** grants Read on the folder Files/sales/eu.
    - **Role2** grants Read on the folder Files/sales.

    The following table shows files of LH_Sales.

    Answer each prompt by selecting the appropriate file.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé LH_Sales. La sécurité OneLake est activée, et le rôle DefaultReader a été supprimé. Les utilisateurs ci-dessous ont le rôle Viewer dans l'espace de travail et aucune autre autorisation. LH_Sales possède deux rôles de sécurité OneLake :

    - **Role1** accorde Read sur le dossier Files/sales/eu.
    - **Role2** accorde Read sur le dossier Files/sales.

    Le tableau suivant présente des fichiers de LH_Sales.

    Répondez à chaque consigne en sélectionnant le fichier approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The only file that a member of Role1 can read", fr: "Le seul fichier qu'un membre de Role1 peut lire" }
    - id: p2
      text: { en: "The only file that a member of Role2 can't read", fr: "Le seul fichier qu'un membre de Role2 ne peut pas lire" }
  grid:
    header: [{ en: "File path", fr: "Chemin du fichier" }, { en: "Size", fr: "Taille" }]
    rows:
      - [{ text: Files/sales/summary.csv, area: f1 }, { text: 12 KB }]
      - [{ text: Files/sales/eu/2026/january.csv, area: f2 }, { text: 340 KB }]
      - [{ text: Files/sales/us/january.csv, area: f3 }, { text: 410 KB }]
      - [{ text: Files/hr/staff.csv, area: f4 }, { text: 25 KB }]
answer:
  values: { p1: f2, p2: f4 }
explanation:
  correct:
    en: |
      A permission on a folder applies to its files and to all its subfolders, so Role1 reads Files/sales/eu/2026/january.csv. Members can traverse the parent folders to reach the permitted data, but traversal doesn't give access to the files of the parent folder or to sibling folders, so summary.csv and the us folder stay hidden from Role1. Role2 reads everything under Files/sales, but nothing outside it, such as Files/hr/staff.csv.
    fr: |
      Une autorisation sur un dossier s'applique à ses fichiers et à tous ses sous-dossiers : Role1 lit donc Files/sales/eu/2026/january.csv. Les membres peuvent traverser les dossiers parents pour atteindre les données autorisées, mais cette traversée ne donne accès ni aux fichiers du dossier parent ni aux dossiers de même niveau : summary.csv et le dossier us restent masqués pour Role1. Role2 lit tout ce qui se trouve sous Files/sales, mais rien en dehors, comme Files/hr/staff.csv.
references:
  - title: OneLake security roles, permissions, and scopes
    url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
