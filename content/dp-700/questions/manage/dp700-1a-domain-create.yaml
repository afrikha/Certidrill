id: dp700-1a-domain-create
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Your company has a Fabric tenant with 40 workspaces that belong to the finance department. The finance workspaces run on two capacities named **Cap-Fin1** and **Cap-Fin2**.

    You need to create a domain named **Finance** so that the finance workspaces can be grouped and governed together.

    Which role must you have?
  fr: |
    Votre entreprise dispose d'un locataire Fabric qui contient 40 espaces de travail appartenant au service financier. Les espaces de travail financiers s'exécutent sur deux capacités nommées **Cap-Fin1** et **Cap-Fin2**.

    Vous devez créer un domaine nommé **Finance** afin de pouvoir regrouper et gouverner ensemble les espaces de travail financiers.

    Quel rôle devez-vous avoir ?
body:
  options:
    - { id: a, text: { en: "Capacity admin of Cap-Fin1 and Cap-Fin2", fr: "Administrateur de capacité de Cap-Fin1 et Cap-Fin2" } }
    - { id: b, text: { en: "Admin of every finance workspace", fr: "Admin de chaque espace de travail financier" } }
    - { id: c, text: { en: "Domain contributor of an existing domain", fr: "Contributeur de domaine d'un domaine existant" } }
    - { id: d, text: { en: "Fabric administrator", fr: "Administrateur Fabric" } }
answer: { optionId: d }
explanation:
  correct:
    en: Only a Fabric administrator (or a higher role) can create domains, and it's also the Fabric admin who names the domain admins. Domain admins then manage their own domain, for example its description, contributors, subdomains and workspace assignments.
    fr: Seul un administrateur Fabric (ou un rôle supérieur) peut créer des domaines, et c'est aussi l'administrateur Fabric qui désigne les administrateurs de domaine. Ces derniers gèrent ensuite leur propre domaine, par exemple sa description, ses contributeurs, ses sous-domaines et ses attributions d'espaces de travail.
  options:
    a:
      en: Capacity admins manage capacities and their settings; they can't create domains.
      fr: Les administrateurs de capacité gèrent les capacités et leurs paramètres ; ils ne peuvent pas créer de domaines.
    b:
      en: Workspace admins can, as domain contributors, assign their workspaces to an existing domain, but they can't create one.
      fr: Les administrateurs d'espaces de travail peuvent, en tant que contributeurs de domaine, attribuer leurs espaces de travail à un domaine existant, mais pas en créer un.
    c:
      en: A domain contributor can only assign workspaces that they administer to a domain; creating domains is reserved to Fabric admins.
      fr: Un contributeur de domaine peut seulement attribuer à un domaine les espaces de travail qu'il administre ; la création de domaines est réservée aux administrateurs Fabric.
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
