id: dp700-1c-label-export-paths
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named Lakehouse1, a Power BI semantic model named SM1 built on Lakehouse1, and a Power BI report named Report1 that uses SM1. All three items carry the Highly Confidential sensitivity label, which encrypts files.

    Users take data out of Fabric in the following ways:

    - Export Report1 to PDF.
    - Download Report1 as a .pbix file.
    - Export the data of a Report1 visual to a .csv file.
    - Write a Lakehouse1 table to a .csv file from a notebook and download it.
    - Copy Lakehouse1 files to a local folder by using OneLake file explorer.

    Which two outputs keep the sensitivity label and its protection?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé Lakehouse1, un modèle sémantique Power BI nommé SM1 basé sur Lakehouse1 et un rapport Power BI nommé Report1 qui utilise SM1. Les trois éléments portent l'étiquette de confidentialité Highly Confidential, qui chiffre les fichiers.

    Les utilisateurs sortent des données de Fabric de plusieurs façons :

    - Exporter Report1 en PDF.
    - Télécharger Report1 sous forme de fichier .pbix.
    - Exporter les données d'un visuel de Report1 dans un fichier .csv.
    - Écrire une table de Lakehouse1 dans un fichier .csv depuis un notebook, puis le télécharger.
    - Copier des fichiers de Lakehouse1 dans un dossier local avec l'explorateur de fichiers OneLake.

    Quelles sont les deux sorties qui conservent l'étiquette de confidentialité et sa protection ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: pdf, text: { en: "The PDF export of Report1", fr: "L'exportation PDF de Report1" } }
    - { id: pbix, text: { en: "The .pbix download of Report1", fr: "Le téléchargement .pbix de Report1" } }
    - { id: csv, text: { en: "The .csv export of the visual data", fr: "L'exportation .csv des données du visuel" } }
    - { id: nbcsv, text: { en: "The .csv file written by the notebook", fr: "Le fichier .csv écrit par le notebook" } }
    - { id: ole, text: { en: "The files copied with OneLake file explorer", fr: "Les fichiers copiés avec l'explorateur de fichiers OneLake" } }
answer: { optionIds: [ pdf, pbix ] }
explanation:
  correct:
    en: |
      Labels and their protection follow Power BI content only through the supported export paths: export to Excel, PDF and PowerPoint, Analyze in Excel, and download to a .pbix file. Exports to .csv or .txt aren't supported, and no other Fabric experience transfers labels to exported output.
    fr: |
      Les étiquettes et leur protection ne suivent le contenu Power BI que par les chemins d'exportation pris en charge : exportation vers Excel, PDF et PowerPoint, Analyze in Excel et téléchargement d'un fichier .pbix. Les exportations vers .csv ou .txt ne sont pas prises en charge, et aucune autre expérience Fabric ne transfère les étiquettes aux sorties exportées.
  options:
    csv: { en: "Exports to .csv aren't a supported path; the file leaves without the label.", fr: "L'exportation vers .csv n'est pas un chemin pris en charge ; le fichier sort sans l'étiquette." }
    nbcsv: { en: "Only Power BI items transfer labels on export; files produced by a notebook aren't labeled.", fr: "Seuls les éléments Power BI transfèrent les étiquettes à l'exportation ; les fichiers produits par un notebook ne sont pas étiquetés." }
    ole: { en: "Copying lakehouse files out of OneLake isn't a supported export path for labels.", fr: "Copier des fichiers de lakehouse hors de OneLake n'est pas un chemin d'exportation pris en charge pour les étiquettes." }
references:
  - title: Information protection in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/governance/information-protection
