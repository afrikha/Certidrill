id: dp700-1a-airflow-uptime
objective: "1.1.4"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You are documenting the Apache Airflow runtime settings of a Fabric workspace named **WS-Dev** for the development team. WS-Dev uses the starter pool, and the production workspace uses a custom pool.

    How should you complete the documentation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez pour l'équipe de développement les paramètres du runtime Apache Airflow d'un espace de travail Fabric nommé **WS-Dev**. WS-Dev utilise le pool de démarrage, et l'espace de travail de production utilise un pool personnalisé.

    Comment devez-vous compléter la documentation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The starter pool shuts down after [[idle]] of inactivity on the Airflow environment.

      When a pool resumes, the environment can take up to [[resume]] to be available.

      The custom pool stays on [[uptime]].
    fr: |
      Le pool de démarrage s'arrête après [[idle]] d'inactivité de l'environnement Airflow.

      Quand un pool reprend, l'environnement peut mettre jusqu'à [[resume]] pour être disponible.

      Le pool personnalisé reste actif [[uptime]].
  slots:
    - id: idle
      options:
        - { id: m10, text: { en: "10 minutes", fr: "10 minutes" } }
        - { id: m20, text: { en: "20 minutes", fr: "20 minutes" } }
        - { id: m60, text: { en: "60 minutes", fr: "60 minutes" } }
        - { id: h24, text: { en: "24 hours", fr: "24 heures" } }
    - id: resume
      options:
        - { id: s30, text: { en: "30 seconds", fr: "30 secondes" } }
        - { id: m5, text: { en: "5 minutes", fr: "5 minutes" } }
        - { id: m20, text: { en: "20 minutes", fr: "20 minutes" } }
        - { id: h1, text: { en: "1 hour", fr: "1 heure" } }
    - id: uptime
      options:
        - { id: lastrun, text: { en: "until its last DAG run completes", fr: "jusqu'à la fin de sa dernière exécution de DAG" } }
        - { id: idle20, text: { en: "until it has been idle for 20 minutes", fr: "jusqu'à 20 minutes d'inactivité" } }
        - { id: paused, text: { en: "until it's manually paused", fr: "jusqu'à sa mise en pause manuelle" } }
answer:
  values: { idle: m20, resume: m5, uptime: paused }
explanation:
  correct:
    en: The starter pool, suggested for development, shuts down after 20 minutes of inactivity on the Airflow environment so that you don't pay for idle time. Resuming the starter pool or a custom pool takes up to 5 minutes. A custom pool, suggested for production, is always on until it's manually paused.
    fr: Le pool de démarrage, conseillé pour le développement, s'arrête après 20 minutes d'inactivité de l'environnement Airflow pour éviter de payer le temps d'inactivité. La reprise du pool de démarrage ou d'un pool personnalisé prend jusqu'à 5 minutes. Un pool personnalisé, conseillé pour la production, reste actif jusqu'à sa mise en pause manuelle.
references:
  - title: Apache Airflow Job workspace settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-workspace-settings
