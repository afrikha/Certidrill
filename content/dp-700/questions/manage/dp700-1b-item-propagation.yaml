id: dp700-1b-item-propagation
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS1 that contains a warehouse named DW1. User9 has no role in WS1. Last month, you shared DW1 with User9 and selected **Read all data using SQL**.

    Today, you open **Manage permissions** for DW1 and select **Remove ReadData** for User9. Thirty minutes later, User9 still runs queries against DW1 successfully from SQL Server Management Studio.

    What is the most likely reason?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS1 qui contient un entrepôt nommé DW1. User9 n'a aucun rôle dans WS1. Le mois dernier, vous avez partagé DW1 avec User9 en sélectionnant **Read all data using SQL**.

    Aujourd'hui, vous ouvrez **Manage permissions** pour DW1 et sélectionnez **Remove ReadData** pour User9. Trente minutes plus tard, User9 exécute toujours des requêtes sur DW1 avec succès depuis SQL Server Management Studio.

    Quelle est la raison la plus probable ?
body:
  options:
    - { id: a, text: { en: "Removing ReadData takes effect only after DW1 is paused and resumed.", fr: "Le retrait de ReadData ne prend effet qu'après la suspension et la reprise de DW1." } }
    - { id: b, text: { en: "The Read permission that User9 keeps allows SELECT on every table.", fr: "L'autorisation Read que User9 conserve permet SELECT sur toutes les tables." } }
    - { id: c, text: { en: "ReadData can be removed only by running REVOKE in DW1.", fr: "ReadData ne peut être retiré qu'en exécutant REVOKE dans DW1." } }
    - { id: d, text: { en: "Permission changes can take up to two hours to propagate.", fr: "Les modifications d'autorisations peuvent mettre jusqu'à deux heures à se propager." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Changes made in Manage permissions appear immediately in the portal, but they can take up to two hours to reach the SQL engine for users who are already signed in. User9 loses access when the change propagates, or sooner after signing in again.
    fr: |
      Les modifications effectuées dans Manage permissions apparaissent immédiatement dans le portail, mais elles peuvent mettre jusqu'à deux heures à atteindre le moteur SQL pour les utilisateurs déjà connectés. User9 perd l'accès quand la modification se propage, ou plus tôt après s'être reconnecté.
  options:
    a: { en: "A warehouse isn't paused to apply permissions; the change propagates by itself.", fr: "Un entrepôt n'est pas suspendu pour appliquer des autorisations ; la modification se propage d'elle-même." }
    b: { en: "Read alone allows only a connection, like CONNECT; it doesn't allow querying tables.", fr: "Read seul permet uniquement une connexion, comme CONNECT ; il ne permet pas d'interroger les tables." }
    c: { en: "Remove ReadData in Manage permissions is a supported way to remove the item permission.", fr: "Remove ReadData dans Manage permissions est une méthode prise en charge pour retirer l'autorisation d'élément." }
references:
  - title: Share Your Warehouse and Manage Permissions
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions
