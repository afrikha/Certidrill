id: dp700-1a-spark-setting-map
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are an admin of a Fabric workspace named **WS-Data**. The default pool of WS-Data is a custom Spark pool named **Pool-Etl**.

    You need to configure Spark for WS-Data to meet the requirements shown in the answer area.

    Which setting should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur d'un espace de travail Fabric nommé **WS-Data**. Le pool par défaut de WS-Data est un pool Spark personnalisé nommé **Pool-Etl**.

    Vous devez configurer Spark pour WS-Data afin de répondre aux exigences présentées dans la zone de réponse.

    Quel paramètre devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: timeout, text: "Spark session timeout" }
    - { id: reserve, text: "Reserve maximum cores for active Spark jobs" }
    - { id: dynexec, text: "Dynamically allocate executors" }
    - { id: autoscale, text: "Autoscale" }
    - { id: lifetime, text: "Set maximum job lifetime" }
    - { id: custom, text: "Customize compute configurations for items" }
  targets:
    - id: idle
      text: { en: "Interactive notebook sessions that stay idle must release their compute after 10 minutes", fr: "Les sessions interactives de notebook restées inactives doivent libérer leur calcul au bout de 10 minutes" }
    - id: cores
      text: { en: "Each running job must hold its maximum cores, even if fewer jobs can run at the same time", fr: "Chaque travail en cours doit disposer de ses cœurs maximaux, même si moins de travaux peuvent s'exécuter en même temps" }
    - id: nodes
      text: { en: "Pool-Etl must acquire nodes while jobs run and retire them after the jobs finish", fr: "Pool-Etl doit acquérir des nœuds pendant les travaux et les retirer une fois les travaux terminés" }
    - id: executors
      text: { en: "Spark must pick the number of executors of each job, within set bounds, based on the data volume", fr: "Spark doit choisir le nombre d'exécuteurs de chaque travail, dans des bornes définies, selon le volume de données" }
answer:
  mapping: { idle: timeout, cores: reserve, nodes: autoscale, executors: dynexec }
explanation:
  correct:
    en: Spark session timeout sets when idle interactive sessions expire (20 minutes by default). Reserve maximum cores for active Spark jobs turns off optimistic job admission so that each job reserves its maximum cores. Autoscale lets a pool acquire nodes up to its maximum and retire them after the jobs, and Dynamically allocate executors lets Spark choose the executor count within the configured bounds.
    fr: Spark session timeout définit quand expirent les sessions interactives inactives (20 minutes par défaut). Reserve maximum cores for active Spark jobs désactive l'admission optimiste des travaux pour que chaque travail réserve ses cœurs maximaux. Autoscale permet à un pool d'acquérir des nœuds jusqu'à son maximum et de les retirer après les travaux, et Dynamically allocate executors permet à Spark de choisir le nombre d'exécuteurs dans les bornes configurées.
  options:
    lifetime:
      en: Set maximum job lifetime cancels jobs that run longer than a limit, whether they are idle or busy; it isn't an idle timeout.
      fr: Set maximum job lifetime annule les travaux qui durent plus longtemps qu'une limite, qu'ils soient inactifs ou non ; ce n'est pas une expiration pour inactivité.
    custom:
      en: This toggle decides whether users can change driver and executor sizes per item; it doesn't size the pool or reserve cores.
      fr: Ce bouton détermine si les utilisateurs peuvent modifier la taille du pilote et des exécuteurs par élément ; il ne dimensionne pas le pool et ne réserve pas de cœurs.
references:
  - title: Workspace administration settings in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
