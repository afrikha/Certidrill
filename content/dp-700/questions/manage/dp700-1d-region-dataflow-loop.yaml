id: dp700-1d-region-dataflow-loop
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1. Business analysts maintain the sales transformations in Power Query and have no coding skills.

    Every night, after a Copy data activity loads raw files, the same transformations must run once for each of 12 regions, with the region code as an input value. The list of regions is stored in a lakehouse table and changes during the year. The analysts must maintain a single copy of the transformations.

    You need to design the solution. What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1. Des analystes métier maintiennent les transformations des ventes dans Power Query et n'ont aucune compétence en programmation.

    Chaque nuit, après qu'une activité Copy data a chargé les fichiers bruts, les mêmes transformations doivent s'exécuter une fois pour chacune des 12 régions, avec le code de région comme valeur d'entrée. La liste des régions est stockée dans une table de lakehouse et change en cours d'année. Les analystes doivent maintenir une seule copie des transformations.

    Vous devez concevoir la solution. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Create 12 Dataflow Gen2 items, one per region, each with a region filter, and run them from the pipeline with 12 Dataflow activities."
        fr: "Créer 12 éléments Dataflow Gen2, un par région, chacun avec un filtre de région, et les exécuter depuis le pipeline avec 12 activités Dataflow."
    - id: b
      text:
        en: "Create a Dataflow Gen2 with CI/CD that has incremental refresh configured on the region column, and schedule it to refresh after the copy."
        fr: "Créer un Dataflow Gen2 avec CI/CD dont l'actualisation incrémentielle est configurée sur la colonne de région, et le planifier pour qu'il s'actualise après la copie."
    - id: c
      text:
        en: "Create a notebook that loops over the regions and applies the transformations with PySpark, and run it from a Notebook activity."
        fr: "Créer un notebook qui parcourt les régions et applique les transformations avec PySpark, et l'exécuter depuis une activité Notebook."
    - id: d
      text:
        en: "Create a Dataflow Gen2 with CI/CD that has public parameters enabled, and run it from a ForEach activity that passes each region to a Dataflow activity."
        fr: "Créer un Dataflow Gen2 avec CI/CD dont les paramètres publics sont activés, et l'exécuter depuis une activité ForEach qui transmet chaque région à une activité Dataflow."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Public parameters mode lets a Dataflow Gen2 with CI/CD support receive parameter values from outside the Power Query editor, so one dataflow serves every region. In the pipeline, a ForEach activity iterates over the regions returned by a Lookup activity, and the Dataflow activity passes @item() values in its Dataflow parameters section. The analysts keep a single dataflow in Power Query.
    fr: |
      Le mode des paramètres publics permet à un Dataflow Gen2 avec prise en charge CI/CD de recevoir des valeurs de paramètres depuis l'extérieur de l'éditeur Power Query : un seul dataflow sert toutes les régions. Dans le pipeline, une activité ForEach parcourt les régions renvoyées par une activité Lookup, et l'activité Dataflow transmet des valeurs @item() dans sa section des paramètres du dataflow. Les analystes conservent un seul dataflow dans Power Query.
  options:
    a: { en: "Twelve dataflows duplicate the transformations, and a new region would require a new dataflow and a new activity.", fr: "Douze dataflows dupliquent les transformations, et une nouvelle région exigerait un nouveau dataflow et une nouvelle activité." }
    b: { en: "Incremental refresh filters on a DateTime, Date or DateTimeZone column, not on a region code, and it is not compatible with public parameters.", fr: "L'actualisation incrémentielle filtre sur une colonne DateTime, Date ou DateTimeZone, pas sur un code de région, et elle n'est pas compatible avec les paramètres publics." }
    c: { en: "A notebook moves the transformations to PySpark code, which the analysts cannot maintain.", fr: "Un notebook déplace les transformations vers du code PySpark, que les analystes ne peuvent pas maintenir." }
references:
  - title: Use public parameters in Dataflow Gen2 (Preview)
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-parameters
  - title: Use the Dataflow activity to run a Dataflow Gen2
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-activity
