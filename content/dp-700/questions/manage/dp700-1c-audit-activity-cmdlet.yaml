id: dp700-1c-audit-activity-cmdlet
objective: "1.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are a Fabric administrator. You use the Power BI Management cmdlets in PowerShell.

    You need to retrieve every Power BI report view that occurred on November 2, 2026 (UTC) from the Power BI activity log.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur Fabric. Vous utilisez les cmdlets Power BI Management dans PowerShell.

    Vous devez récupérer, dans le journal d'activité Power BI, toutes les consultations de rapports Power BI qui ont eu lieu le 2 novembre 2026 (UTC).

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    Login-PowerBI
    $events = [[cmd]] -StartDateTime '2026-11-02T00:00:00' `
        -EndDateTime '[[end]]' -ActivityType '[[act]]' | ConvertFrom-Json
  slots:
    - id: cmd
      options:
        - { id: activity, text: Get-PowerBIActivityEvent }
        - { id: unified, text: Search-UnifiedAuditLog }
        - { id: report, text: Get-PowerBIReport }
    - id: end
      options:
        - { id: sameday, text: "2026-11-02T23:59:59" }
        - { id: nextday, text: "2026-11-03T00:00:00" }
        - { id: week, text: "2026-11-09T23:59:59" }
    - id: act
      options:
        - { id: viewreport, text: ViewReport }
        - { id: readartifact, text: ReadArtifact }
        - { id: sharereport, text: ShareReport }
        - { id: createreport, text: CreateReport }
answer:
  values: { cmd: activity, end: sameday, act: viewreport }
explanation:
  correct:
    en: |
      Get-PowerBIActivityEvent reads the Power BI activity log and requires the Fabric administrator role. StartDateTime and EndDateTime must be UTC values on the same date, so one call returns at most one day. ViewReport is the operation recorded when a user views a Power BI report.
    fr: |
      Get-PowerBIActivityEvent lit le journal d'activité Power BI et exige le rôle d'administrateur Fabric. StartDateTime et EndDateTime doivent être des valeurs UTC de la même date : un appel renvoie au plus une journée. ViewReport est l'opération enregistrée quand un utilisateur consulte un rapport Power BI.
  options:
    unified: { en: "Search-UnifiedAuditLog is an Exchange Online PowerShell cmdlet for the Purview audit log; it has no -ActivityType parameter.", fr: "Search-UnifiedAuditLog est une cmdlet Exchange Online PowerShell pour le journal d'audit Purview ; elle n'a pas de paramètre -ActivityType." }
    report: { en: "Get-PowerBIReport lists reports, not activity events.", fr: "Get-PowerBIReport liste des rapports, pas des événements d'activité." }
    nextday: { en: "The end time falls on another date; the start and end must be on the same day.", fr: "L'heure de fin tombe une autre date ; le début et la fin doivent être le même jour." }
    week: { en: "The cmdlet retrieves one day per call; a week requires seven calls.", fr: "La cmdlet récupère une journée par appel ; une semaine exige sept appels." }
    sharereport: { en: "ShareReport records report sharing, not report views.", fr: "ShareReport enregistre le partage de rapports, pas leur consultation." }
    createreport: { en: "CreateReport records report creation, not report views.", fr: "CreateReport enregistre la création de rapports, pas leur consultation." }
references:
  - title: Track user activities in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/enterprise/service-admin-auditing
  - title: Operation list
    url: https://learn.microsoft.com/en-us/fabric/admin/operation-list
