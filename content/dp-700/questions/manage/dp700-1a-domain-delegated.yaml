id: dp700-1a-domain-delegated
objective: "1.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You are a domain admin of a Fabric domain named **HR**. The tenant-level certification setting lets only a central data governance team certify items.

    You need to meet the following requirements for the items in the HR workspaces:

    - New items get the sensitivity label **Confidential - HR** unless another label is applied.
    - Two HR data stewards, and not the central team, can certify HR items.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur d'un domaine Fabric nommé **HR**. Au niveau du locataire, le paramètre de certification permet uniquement à une équipe centrale de gouvernance des données de certifier des éléments.

    Vous devez répondre aux exigences suivantes pour les éléments des espaces de travail HR :

    - Les nouveaux éléments reçoivent l'étiquette de confidentialité **Confidential - HR**, sauf si une autre étiquette est appliquée.
    - Deux responsables de données RH, et non l'équipe centrale, peuvent certifier les éléments RH.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: e, text: { en: "Create a subdomain of HR and make the two stewards its domain admins", fr: "Créer un sous-domaine de HR et désigner les deux responsables comme ses administrateurs de domaine" } }
    - { id: b, text: { en: "In the Delegated settings of HR, override certification and name the stewards as certifiers", fr: "Dans les paramètres délégués de HR, remplacer la certification et désigner les responsables comme certificateurs" } }
    - { id: c, text: { en: "Add the two stewards as domain contributors of HR", fr: "Ajouter les deux responsables comme contributeurs du domaine HR" } }
    - { id: d, text: { en: "Add the two stewards to the Default domain setting of HR", fr: "Ajouter les deux responsables au paramètre Default domain de HR" } }
    - { id: a, text: { en: "In the Delegated settings of HR, set a domain-level default sensitivity label", fr: "Dans les paramètres délégués de HR, définir une étiquette de confidentialité par défaut au niveau du domaine" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Some tenant settings can be delegated to domains. Under Information protection, a domain-level default sensitivity label applies a default label to items in the domain's workspaces. Under Certification, selecting Override tenant admin selection lets the domain enable certification, name its own certifiers and give a documentation URL.
    fr: Certains paramètres du locataire peuvent être délégués aux domaines. Sous Information protection, une étiquette de confidentialité par défaut au niveau du domaine applique une étiquette par défaut aux éléments des espaces de travail du domaine. Sous Certification, la sélection d'Override tenant admin selection permet au domaine d'activer la certification, de désigner ses propres certificateurs et de fournir une URL de documentation.
  options:
    c:
      en: Domain contributors can assign the workspaces they administer to the domain; the role doesn't let them certify items.
      fr: Les contributeurs de domaine peuvent attribuer au domaine les espaces de travail qu'ils administrent ; ce rôle ne leur permet pas de certifier des éléments.
    d:
      en: The default domain assigns the users' workspaces to the domain; it has nothing to do with certification.
      fr: Le domaine par défaut attribue au domaine les espaces de travail des utilisateurs ; il n'a aucun rapport avec la certification.
    e:
      en: Subdomains have no domain admins of their own (those of the parent apply) and only have general settings, so they can't hold certification settings.
      fr: "Les sous-domaines n'ont pas d'administrateurs propres (ceux du domaine parent s'appliquent) et n'ont que des paramètres généraux : ils ne peuvent donc pas porter de paramètres de certification."
references:
  - title: Fabric domains
    url: https://learn.microsoft.com/en-us/fabric/governance/domains
