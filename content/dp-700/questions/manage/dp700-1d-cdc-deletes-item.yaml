id: dp700-1d-cdc-deletes-item
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an on-premises SQL Server database named SalesDB that is reachable through an on-premises data gateway. Change data capture (CDC) is enabled on 25 tables of SalesDB. Fabrikam also has a Fabric workspace named Workspace1.

    You need to replicate the 25 tables to an Azure SQL database named ReportingDB. The first run must load all the rows, and later runs must apply the inserts, updates and deletes made in SalesDB. The solution must minimize development effort and must not require writing code or expressions.

    What should you create in Workspace1?
  fr: |
    Fabrikam dispose d'une base de données SQL Server locale nommée SalesDB, accessible via une passerelle de données locale. La capture des changements de données (CDC) est activée sur 25 tables de SalesDB. Fabrikam dispose aussi d'un espace de travail Fabric nommé Workspace1.

    Vous devez répliquer les 25 tables vers une base de données Azure SQL nommée ReportingDB. La première exécution doit charger toutes les lignes, et les exécutions suivantes doivent appliquer les insertions, mises à jour et suppressions effectuées dans SalesDB. La solution doit réduire au minimum l'effort de développement et ne doit exiger ni code ni expressions.

    Que devez-vous créer dans Workspace1 ?
body:
  options:
    - { id: a, text: { en: "A Dataflow Gen2 that uses incremental refresh on a ModifiedDate column of each table", fr: "Un Dataflow Gen2 qui utilise l'actualisation incrémentielle sur une colonne ModifiedDate de chaque table" } }
    - { id: b, text: { en: "A pipeline that uses a Lookup activity to read a watermark and a Copy data activity per table", fr: "Un pipeline qui utilise une activité Lookup pour lire un filigrane et une activité Copy data par table" } }
    - { id: c, text: { en: "A notebook that reads the CDC change tables and merges the changes into ReportingDB", fr: "Un notebook qui lit les tables de modifications CDC et fusionne les changements dans ReportingDB" } }
    - { id: d, text: { en: "A copy job that uses incremental copy based on CDC for the 25 tables", fr: "Un travail de copie qui utilise la copie incrémentielle basée sur la CDC pour les 25 tables" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A copy job is configured in a wizard, connects to on-premises sources through a gateway, performs an initial full copy and then switches to incremental copy. CDC-based incremental copy tracks inserts, updates and deletes, which a watermark column cannot do.
    fr: |
      Un travail de copie se configure dans un Assistant, se connecte aux sources locales via une passerelle, effectue une copie complète initiale puis passe en copie incrémentielle. La copie incrémentielle basée sur la CDC suit les insertions, les mises à jour et les suppressions, ce qu'une colonne de filigrane ne permet pas.
  options:
    a: { en: "Incremental refresh in Dataflow Gen2 filters on a DateTime column and replaces buckets of data; it does not capture rows deleted from the source.", fr: "L'actualisation incrémentielle de Dataflow Gen2 filtre sur une colonne DateTime et remplace des compartiments de données ; elle ne capture pas les lignes supprimées dans la source." }
    b: { en: "A watermark pattern needs dynamic expressions for every table and still misses deleted rows.", fr: "Un modèle de filigrane exige des expressions dynamiques pour chaque table et manque toujours les lignes supprimées." }
    c: { en: "A notebook requires writing Spark code, which the requirements exclude.", fr: "Un notebook exige d'écrire du code Spark, ce que les exigences excluent." }
references:
  - title: What is Copy job in Data Factory for Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
