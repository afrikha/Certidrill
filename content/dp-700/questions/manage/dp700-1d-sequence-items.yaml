id: dp700-1d-sequence-items
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a Dataflow Gen2 named DF_Clean, a notebook named NB_Enrich and a warehouse named DW1. DW1 contains a stored procedure named dbo.usp_Publish.

    Every night, NB_Enrich must start only after DF_Clean refreshes successfully, and dbo.usp_Publish must run only after NB_Enrich succeeds. If any step fails, a message must be posted to a Microsoft Teams channel.

    You need to implement the process. The solution must minimize development effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un Dataflow Gen2 nommé DF_Clean, un notebook nommé NB_Enrich et un entrepôt nommé DW1. DW1 contient une procédure stockée nommée dbo.usp_Publish.

    Chaque nuit, NB_Enrich ne doit démarrer qu'après la réussite de l'actualisation de DF_Clean, et dbo.usp_Publish ne doit s'exécuter qu'après la réussite de NB_Enrich. Si une étape échoue, un message doit être publié dans un canal Microsoft Teams.

    Vous devez implémenter ce processus. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Schedule DF_Clean at 01:00, NB_Enrich at 02:00 and a script that calls dbo.usp_Publish at 03:00, and configure failure notifications on each schedule."
        fr: "Planifier DF_Clean à 01:00, NB_Enrich à 02:00 et un script qui appelle dbo.usp_Publish à 03:00, et configurer des notifications d'échec sur chaque planification."
    - id: b
      text:
        en: "Create a pipeline that runs a Dataflow activity, a Notebook activity and a Stored procedure activity linked On success, with a Teams activity on the On failure paths."
        fr: "Créer un pipeline qui exécute une activité Dataflow, une activité Notebook et une activité Stored procedure reliées par On success, avec une activité Teams sur les chemins On failure."
    - id: c
      text:
        en: "Add a cell to NB_Enrich that calls notebookutils.notebook.run for DF_Clean and dbo.usp_Publish, and schedule NB_Enrich."
        fr: "Ajouter à NB_Enrich une cellule qui appelle notebookutils.notebook.run pour DF_Clean et dbo.usp_Publish, et planifier NB_Enrich."
    - id: d
      text:
        en: "Create a copy job that copies the output of DF_Clean to DW1, and schedule NB_Enrich to run after the copy job."
        fr: "Créer un travail de copie qui copie la sortie de DF_Clean vers DW1, et planifier NB_Enrich pour qu'il s'exécute après le travail de copie."
answer: { optionId: b }
explanation:
  correct:
    en: |
      A pipeline orchestrates other items: the Dataflow, Notebook and Stored procedure activities run DF_Clean, NB_Enrich and dbo.usp_Publish, and On success dependencies enforce the order. A Teams activity connected to the On failure paths posts the message when a step fails, without any code.
    fr: |
      Un pipeline orchestre d'autres éléments : les activités Dataflow, Notebook et Stored procedure exécutent DF_Clean, NB_Enrich et dbo.usp_Publish, et les dépendances On success imposent l'ordre. Une activité Teams reliée aux chemins On failure publie le message quand une étape échoue, sans aucun code.
  options:
    a: { en: "Fixed times do not create dependencies: NB_Enrich would start even if DF_Clean failed or ran late, and failure notifications send emails, not Teams messages.", fr: "Des heures fixes ne créent pas de dépendances : NB_Enrich démarrerait même si DF_Clean avait échoué ou pris du retard, et les notifications d'échec envoient des e-mails, pas des messages Teams." }
    c: { en: "notebookutils.notebook.run runs other notebooks only; it cannot refresh a dataflow or run a stored procedure, and this approach requires code.", fr: "notebookutils.notebook.run exécute uniquement d'autres notebooks ; il ne peut ni actualiser un dataflow ni exécuter une procédure stockée, et cette approche exige du code." }
    d: { en: "A copy job only moves data; it neither runs DF_Clean nor orchestrates the notebook and the stored procedure.", fr: "Un travail de copie ne fait que déplacer des données ; il n'exécute pas DF_Clean et n'orchestre ni le notebook ni la procédure stockée." }
references:
  - title: Activity overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview
  - title: Send Teams messages with the Teams activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/teams-activity
