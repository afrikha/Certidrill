id: dp700-sr2-shared-session-2
objective: "1.1.1"
type: series_yesno
series: dp700-sr2-shared-session
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You remove the default lakehouses, then use high concurrency with one session tag.
  fr: Vous supprimez les lakehouses par défaut, puis utilisez la haute concurrence avec une seule balise de session.
body:
  solution:
    en: |
      You remove the default lakehouse from the four notebooks and change their code to read and write the tables by their full OneLake (ABFS) paths. In the Spark settings of WS-ETL, you turn on high concurrency **For pipeline running multiple notebooks**, and you enter the same session tag in the **Advanced settings** of the four Notebook activities.
    fr: |
      Vous supprimez le lakehouse par défaut des quatre notebooks et modifiez leur code pour lire et écrire les tables par leurs chemins OneLake (ABFS) complets. Dans les paramètres Spark de WS-ETL, vous activez la haute concurrence **For pipeline running multiple notebooks**, et vous saisissez la même balise de session dans les **Advanced settings** des quatre activités Notebook.
answer: { value: true }
explanation:
  correct:
    en: |
      Notebooks without a default lakehouse can share a session with other notebooks that have none. The four notebooks now have the same user, default lakehouse (none), compute configuration and libraries, and the session tag bundles them. A high concurrency session hosts up to five notebooks with the same tag, so the four notebooks run in one session.
    fr: |
      Des notebooks sans lakehouse par défaut peuvent partager une session avec d'autres notebooks qui n'en ont pas. Les quatre notebooks ont maintenant le même utilisateur, le même lakehouse par défaut (aucun), la même configuration de calcul et les mêmes bibliothèques, et la balise de session les regroupe. Une session à haute concurrence accueille jusqu'à cinq notebooks ayant la même balise : les quatre notebooks s'exécutent dans une seule session.
references:
  - title: Configure high concurrency mode for Fabric notebooks in pipelines
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-high-concurrency-session-notebooks-in-pipelines
