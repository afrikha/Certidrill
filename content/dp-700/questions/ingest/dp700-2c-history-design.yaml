id: dp700-2c-history-design
objective: "2.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso Energy has an eventstream that receives 50,000 smart meter events per second. A Real-Time Dashboard refreshes every 10 seconds and queries the last 24 hours of events.

    A lakehouse named LH_History contains a Delta table that holds six years of meter readings (40 TB). A Spark job maintains the table. Analysts join the history with recent events in KQL a few times a month.

    You need to recommend a storage design that meets the following requirements:

    - Dashboard queries must have the lowest possible latency.
    - The history must not be copied.
    - Costs must be minimized.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Energy dispose d'un flux d'événements qui reçoit 50 000 événements de compteurs intelligents par seconde. Un tableau de bord en temps réel s'actualise toutes les 10 secondes et interroge les 24 dernières heures d'événements.

    Un lakehouse nommé LH_History contient une table Delta qui conserve six ans de relevés de compteurs (40 To). Un travail Spark gère la table. Les analystes joignent l'historique aux événements récents en KQL quelques fois par mois.

    Vous devez recommander une conception de stockage qui répond aux exigences suivantes :

    - Les requêtes du tableau de bord doivent avoir la latence la plus faible possible.
    - L'historique ne doit pas être copié.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Store the streaming meter events in: [[events]]

      Make the history available to KQL queries by using: [[history]]
    fr: |
      Stocker les événements de compteurs en continu dans : [[events]]

      Rendre l'historique disponible pour les requêtes KQL avec : [[history]]
  slots:
    - id: events
      options:
        - { id: native, text: { en: "A native table of an eventhouse", fr: "Une table native d'un eventhouse" } }
        - { id: lhshort, text: { en: "A lakehouse table reached through a OneLake shortcut", fr: "Une table de lakehouse atteinte par un raccourci OneLake" } }
        - { id: lhaccel, text: { en: "A lakehouse table reached through an accelerated OneLake shortcut", fr: "Une table de lakehouse atteinte par un raccourci OneLake accéléré" } }
    - id: history
      options:
        - { id: standard, text: { en: "A OneLake shortcut without query acceleration", fr: "Un raccourci OneLake sans accélération des requêtes" } }
        - { id: accel, text: { en: "A OneLake shortcut with query acceleration", fr: "Un raccourci OneLake avec accélération des requêtes" } }
        - { id: copy, text: { en: "A native table loaded by a pipeline", fr: "Une table native chargée par un pipeline" } }
        - { id: avail, text: { en: "OneLake availability on the eventhouse", fr: "La disponibilité OneLake sur l'eventhouse" } }
answer:
  values: { events: native, history: standard }
explanation:
  correct:
    en: |
      Events ingested into a native eventhouse table are indexed and queryable seconds after arrival, which gives the dashboard the lowest latency. The rarely queried history stays in the lakehouse behind a standard shortcut: no copy, and no cache or indexing cost for 40 TB that is used a few times a month.
    fr: |
      Les événements ingérés dans une table native d'eventhouse sont indexés et interrogeables quelques secondes après leur arrivée, ce qui donne au tableau de bord la latence la plus faible. L'historique rarement interrogé reste dans le lakehouse derrière un raccourci standard : aucune copie, et aucun coût de cache ni d'indexation pour 40 To utilisés quelques fois par mois.
  options:
    lhshort:
      en: "Queries over a shortcut make network calls to storage without indexes, which is slower than a native table."
      fr: "Les requêtes sur un raccourci font des appels réseau vers le stockage, sans index, ce qui est plus lent qu'une table native."
    lhaccel:
      en: "Acceleration must first index the files that land in OneLake, and it adds cache and indexing costs to data that could be ingested directly."
      fr: "L'accélération doit d'abord indexer les fichiers qui arrivent dans OneLake, et elle ajoute des coûts de cache et d'indexation pour des données qui pourraient être ingérées directement."
    accel:
      en: "Accelerated data is billed on the OneLake Premium cache meter and indexing consumes capacity, which isn't justified for occasional queries."
      fr: "Les données accélérées sont facturées sur le compteur OneLake Premium cache et l'indexation consomme de la capacité, ce qui ne se justifie pas pour des requêtes occasionnelles."
    copy:
      en: "Loading the history into a native table creates the copy that the requirements forbid."
      fr: "Charger l'historique dans une table native crée la copie que les exigences interdisent."
    avail:
      en: "OneLake availability exposes eventhouse data in OneLake; it doesn't bring lakehouse data into KQL."
      fr: "La disponibilité OneLake expose les données de l'eventhouse dans OneLake ; elle n'amène pas les données du lakehouse dans KQL."
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
