id: dp700-2c-kql-aggregations
objective: "2.2.8"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have an eventhouse that contains a table named DeviceTelemetry. DeviceTelemetry has the following columns: Timestamp, DeviceId, Site, Temperature, and Status.

    You are writing a KQL query that uses `summarize ... by Site, bin(Timestamp, 1h)`. The query must return the following values for each site and hour:

    - The number of distinct devices that sent data. An estimate is acceptable.
    - The Temperature and Status values of the most recent event.
    - The 95th percentile of Temperature.
    - The number of events whose Status is Error.

    Which aggregation function should you use for each value? To answer, drag the appropriate functions to the correct values. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse qui contient une table nommée DeviceTelemetry. DeviceTelemetry comporte les colonnes suivantes : Timestamp, DeviceId, Site, Temperature et Status.

    Vous écrivez une requête KQL qui utilise `summarize ... by Site, bin(Timestamp, 1h)`. La requête doit renvoyer les valeurs suivantes pour chaque site et chaque heure :

    - Le nombre d'appareils distincts qui ont envoyé des données. Une estimation est acceptable.
    - Les valeurs Temperature et Status de l'événement le plus récent.
    - Le 95e centile de Temperature.
    - Le nombre d'événements dont Status vaut Error.

    Quelle fonction d'agrégation devez-vous utiliser pour chaque valeur ? Pour répondre, faites glisser les fonctions appropriées vers les valeurs correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dcount, text: dcount(DeviceId) }
    - { id: argmax, text: "arg_max(Timestamp, Temperature, Status)" }
    - { id: pct, text: "percentile(Temperature, 95)" }
    - { id: countif, text: "countif(Status == \"Error\")" }
    - { id: any, text: "take_any(Temperature, Status)" }
    - { id: max, text: max(Timestamp) }
  targets:
    - { id: t1, text: { en: "Number of distinct devices", fr: "Nombre d'appareils distincts" } }
    - { id: t2, text: { en: "Temperature and Status of the most recent event", fr: "Temperature et Status de l'événement le plus récent" } }
    - { id: t3, text: { en: "95th percentile of Temperature", fr: "95e centile de Temperature" } }
    - { id: t4, text: { en: "Number of events whose Status is Error", fr: "Nombre d'événements dont Status vaut Error" } }
answer:
  mapping: { t1: dcount, t2: argmax, t3: pct, t4: countif }
explanation:
  correct:
    en: |
      dcount returns an estimate of the number of distinct values, which the requirement allows. arg_max(Timestamp, ...) returns the listed columns of the row that has the latest Timestamp in each group. percentile(Temperature, 95) returns the 95th percentile, and countif counts the rows for which the predicate is true.
    fr: |
      dcount renvoie une estimation du nombre de valeurs distinctes, ce que l'exigence autorise. arg_max(Timestamp, ...) renvoie les colonnes indiquées de la ligne dont Timestamp est le plus récent dans chaque groupe. percentile(Temperature, 95) renvoie le 95e centile, et countif compte les lignes pour lesquelles le prédicat est vrai.
  options:
    any:
      en: "take_any returns the values of an arbitrary row of the group, not those of the most recent event."
      fr: "take_any renvoie les valeurs d'une ligne arbitraire du groupe, pas celles de l'événement le plus récent."
    max:
      en: "max(Timestamp) returns only the latest time, without the Temperature and Status of that event."
      fr: "max(Timestamp) ne renvoie que l'heure la plus récente, sans les valeurs Temperature et Status de cet événement."
references:
  - title: summarize operator
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator?view=microsoft-fabric
  - title: dcount() (aggregation function)
    url: https://learn.microsoft.com/en-us/kusto/query/dcount-aggregation-function?view=microsoft-fabric
