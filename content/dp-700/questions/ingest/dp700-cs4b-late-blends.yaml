id: dp700-cs4b-late-blends
objective: "2.2.9"
type: single
caseStudy: dp700-cs4b-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You are designing the load of dbo.FactSales and dbo.DimProduct for the sales of new blends whose ProductSKU is not yet in dbo.DimProduct.

    What should you do to meet the requirements?
  fr: |
    Vous concevez le chargement de dbo.FactSales et de dbo.DimProduct pour les ventes de nouveaux mélanges dont le ProductSKU n'est pas encore dans dbo.DimProduct.

    Que devez-vous faire pour satisfaire les exigences ?
body:
  options:
    - { id: a, text: { en: "Load the sales with the key of the Unknown product member, and later update their ProductKey when the blend details arrive.", fr: "Charger les ventes avec la clé du membre de produit Unknown, puis mettre à jour leur ProductKey quand les détails du mélange arrivent." } }
    - { id: b, text: { en: "Insert an inferred DimProduct row for the SKU and use its key, and later update that row in place when the blend details arrive.", fr: "Insérer une ligne DimProduct déduite pour le SKU et utiliser sa clé, puis mettre à jour cette ligne sur place quand les détails du mélange arrivent." } }
    - { id: c, text: { en: "Keep the sales in a staging table, and load them into dbo.FactSales after the blend details arrive in dbo.DimProduct.", fr: "Conserver les ventes dans une table de préparation, et les charger dans dbo.FactSales après l'arrivée des détails du mélange dans dbo.DimProduct." } }
    - { id: d, text: { en: "Insert an inferred DimProduct row for the SKU and use its key, and later expire that row and insert a new version.", fr: "Insérer une ligne DimProduct déduite pour le SKU et utiliser sa clé, puis faire expirer cette ligne et insérer une nouvelle version." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Because the ProductSKU values are valid, the fact load can insert an inferred member with Unknown attributes and IsInferredMember set to TRUE, and store its surrogate key in the sales rows. When the details arrive, the dimension load treats them as late-arriving details rather than an SCD change: it updates the attributes of that row and sets IsInferredMember to FALSE, so the sales already loaded show the right blend without any update of dbo.FactSales.
    fr: |
      Comme les valeurs ProductSKU sont valides, le chargement des faits peut insérer un membre déduit avec des attributs Unknown et IsInferredMember défini sur TRUE, puis stocker sa clé de substitution dans les lignes de ventes. Quand les détails arrivent, le chargement de la dimension les traite comme des détails tardifs et non comme un changement de dimension à variation lente : il met à jour les attributs de cette ligne et définit IsInferredMember sur FALSE. Les ventes déjà chargées affichent ainsi le bon mélange sans aucune mise à jour de dbo.FactSales.
  options:
    a:
      en: |
        The Unknown member keeps the sales visible, but reassigning the right ProductKey later means updating rows of dbo.FactSales, which the requirements forbid.
      fr: |
        Le membre Unknown garde les ventes visibles, mais réattribuer plus tard la bonne ProductKey impose de mettre à jour des lignes de dbo.FactSales, ce que les exigences interdisent.
    c:
      en: |
        Holding the sales until the details arrive delays them by up to three days, so they do not appear in the reports on the day they are loaded.
      fr: |
        Retenir les ventes jusqu'à l'arrivée des détails les retarde jusqu'à trois jours : elles n'apparaissent pas dans les rapports le jour de leur chargement.
    d:
      en: |
        A new type 2 version gets a new surrogate key. The sales already loaded would keep pointing to the expired inferred row and its Unknown attributes.
      fr: |
        Une nouvelle version de type 2 reçoit une nouvelle clé de substitution. Les ventes déjà chargées continueraient de pointer vers la ligne déduite expirée et ses attributs Unknown.
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
