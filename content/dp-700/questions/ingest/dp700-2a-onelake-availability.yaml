id: dp700-2a-onelake-availability
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an eventhouse named **EH2** that contains a KQL database named **OpsDB**. A table named **Alarms** in OpsDB receives events continuously from an eventstream.

    Data engineers must read Alarms as a Delta table from Spark notebooks, through a shortcut in their lakehouse, and a Direct Lake semantic model must use the same data. Rows must be available to these consumers within 15 minutes of their ingestion. You must not add another ingestion path or copy process.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse nommé **EH2** qui contient une base de données KQL nommée **OpsDB**. Une table nommée **Alarms** dans OpsDB reçoit en continu des événements d'un flux d'événements.

    Les ingénieurs données doivent lire Alarms comme une table Delta depuis des notebooks Spark, via un raccourci dans leur lakehouse, et un modèle sémantique Direct Lake doit utiliser les mêmes données. Les lignes doivent être disponibles pour ces consommateurs dans les 15 minutes qui suivent leur ingestion. Vous ne devez ajouter ni autre chemin d'ingestion ni processus de copie.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on OneLake availability for the Alarms table.", fr: "Activer la disponibilité OneLake pour la table Alarms." } }
    - { id: b, text: { en: "Add a Lakehouse destination to the eventstream that feeds Alarms.", fr: "Ajouter une destination Lakehouse au flux d'événements qui alimente Alarms." } }
    - { id: c, text: { en: "Set the TargetLatencyInMinutes property of the mirroring policy of Alarms to 15.", fr: "Définir la propriété TargetLatencyInMinutes de la stratégie de mise en miroir d'Alarms sur 15." } }
    - { id: d, text: { en: "Create a OneLake shortcut in OpsDB that points to a folder of the data engineers' lakehouse.", fr: "Créer dans OpsDB un raccourci OneLake qui pointe vers un dossier du lakehouse des ingénieurs données." } }
    - { id: e, text: { en: "Create an update policy on Alarms with IsTransactional set to true.", fr: "Créer une stratégie de mise à jour sur Alarms avec IsTransactional défini sur true." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      OneLake availability exposes the KQL table as a Delta table in OneLake, which Spark (through a shortcut) and Direct Lake can read without another pipeline. By default the eventhouse can delay writes to OneLake by up to 3 hours to build large files; TargetLatencyInMinutes, between 5 minutes and 3 hours, lowers this delay to meet the 15-minute requirement.
    fr: |
      La disponibilité OneLake expose la table KQL sous forme de table Delta dans OneLake, que Spark (via un raccourci) et Direct Lake peuvent lire sans autre pipeline. Par défaut, l'eventhouse peut retarder les écritures dans OneLake jusqu'à 3 heures pour produire de gros fichiers ; TargetLatencyInMinutes, entre 5 minutes et 3 heures, réduit ce délai pour respecter l'exigence de 15 minutes.
  options:
    b: { en: "A Lakehouse destination is a second ingestion path, which the requirements forbid.", fr: "Une destination Lakehouse est un second chemin d'ingestion, ce que les exigences interdisent." }
    d: { en: "A shortcut in OpsDB reads lakehouse data from the eventhouse; it doesn't expose Alarms to Spark.", fr: "Un raccourci dans OpsDB lit des données de lakehouse depuis l'eventhouse ; il n'expose pas Alarms à Spark." }
    e: { en: "An update policy transforms data into another KQL table; it doesn't make the data available in Delta format.", fr: "Une stratégie de mise à jour transforme des données vers une autre table KQL ; elle ne rend pas les données disponibles au format Delta." }
references:
  - title: Turn on OneLake availability for an eventhouse
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-house-onelake-availability
