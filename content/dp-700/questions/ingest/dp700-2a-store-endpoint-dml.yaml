id: dp700-2a-store-endpoint-dml
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse1** that contains Delta tables loaded by a pipeline. A team of SQL developers must maintain a set of tables by using T-SQL stored procedures that run INSERT, UPDATE and MERGE statements. Some procedures must change three tables in a single transaction.

    When a developer runs an UPDATE statement against the SQL analytics endpoint of Lakehouse1, the statement fails.

    You need to provide a data store for the tables that meets the requirements.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse1** qui contient des tables Delta chargées par un pipeline. Une équipe de développeurs SQL doit maintenir un ensemble de tables avec des procédures stockées T-SQL qui exécutent des instructions INSERT, UPDATE et MERGE. Certaines procédures doivent modifier trois tables dans une seule transaction.

    Quand un développeur exécute une instruction UPDATE sur le point de terminaison d'analytique SQL de Lakehouse1, l'instruction échoue.

    Vous devez fournir un magasin de données pour les tables qui satisfasse les exigences.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant the developers the Contributor role on the workspace that contains Lakehouse1.", fr: "Attribuer aux développeurs le rôle Contributor sur l'espace de travail qui contient Lakehouse1." } }
    - { id: b, text: { en: "Create a warehouse, and load the tables into it from Lakehouse1 by using T-SQL.", fr: "Créer un entrepôt, puis y charger les tables depuis Lakehouse1 avec T-SQL." } }
    - { id: c, text: { en: "Create the stored procedures in the SQL analytics endpoint, and run them as the lakehouse owner.", fr: "Créer les procédures stockées dans le point de terminaison d'analytique SQL, et les exécuter en tant que propriétaire du lakehouse." } }
    - { id: d, text: { en: "Turn on OneLake availability for the tables of Lakehouse1.", fr: "Activer la disponibilité OneLake pour les tables de Lakehouse1." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The SQL analytics endpoint of a lakehouse is read-only for table DML and DDL: INSERT, UPDATE and DELETE are supported only in a warehouse. A Fabric warehouse supports T-SQL DML, including MERGE, and multi-table transactions with snapshot isolation, so the SQL developers can maintain the tables there.
    fr: |
      Le point de terminaison d'analytique SQL d'un lakehouse est en lecture seule pour le DML et le DDL de tables : INSERT, UPDATE et DELETE ne sont pris en charge que dans un entrepôt. Un entrepôt Fabric prend en charge le DML T-SQL, y compris MERGE, et les transactions multitables avec isolement d'instantané : les développeurs SQL peuvent y maintenir les tables.
  options:
    a: { en: "The endpoint is read-only whatever the role of the user; permissions don't enable DML.", fr: "Le point de terminaison est en lecture seule quel que soit le rôle de l'utilisateur ; les autorisations n'activent pas le DML." }
    c: { en: "Procedures can be created in the endpoint, but they still can't modify the Delta tables.", fr: "Des procédures peuvent être créées dans le point de terminaison, mais elles ne peuvent toujours pas modifier les tables Delta." }
    d: { en: "OneLake availability is an eventhouse feature that exposes KQL tables as Delta; it doesn't enable T-SQL writes.", fr: "La disponibilité OneLake est une fonctionnalité d'eventhouse qui expose des tables KQL au format Delta ; elle n'active pas les écritures T-SQL." }
references:
  - title: T-SQL surface area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  - title: Transactions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/transactions
