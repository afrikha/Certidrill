id: dp700-2d-ss-optimize-write
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse named **LH-Ops**. A Spark job definition runs a structured streaming query that writes events to a Delta table named **machine_events**. The query uses the default trigger and `partitionBy("EventDate")`.

    Queries on machine_events are slow because each micro-batch writes many small Parquet files.

    You need to reduce the number of small files written by the stream. The solution must meet the following requirements:

    - New events must be available in machine_events as often as they are today.
    - The transformation code of the DataFrame must not change.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse Fabric nommé **LH-Ops**. Une définition de travail Spark exécute une requête de streaming structuré qui écrit des événements dans une table Delta nommée **machine_events**. La requête utilise le déclencheur par défaut et `partitionBy("EventDate")`.

    Les requêtes sur machine_events sont lentes, car chaque micro-lot écrit de nombreux petits fichiers Parquet.

    Vous devez réduire le nombre de petits fichiers écrits par le flux. La solution doit satisfaire les exigences suivantes :

    - Les nouveaux événements doivent être disponibles dans machine_events aussi souvent qu'aujourd'hui.
    - Le code de transformation du DataFrame ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add .trigger(processingTime=\"10 minutes\") to the write.", fr: "Ajouter .trigger(processingTime=\"10 minutes\") à l'écriture." }
    - id: b
      text: { en: "Set spark.databricks.delta.optimizeWrite.enabled to true.", fr: "Définir spark.databricks.delta.optimizeWrite.enabled sur true." }
    - id: c
      text: { en: "Add DeviceId as a second column of partitionBy().", fr: "Ajouter DeviceId comme seconde colonne de partitionBy()." }
    - id: d
      text: { en: "Change the output mode of the query to update.", fr: "Changer le mode de sortie de la requête en update." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Optimized write is a Spark configuration that reorganizes the data of each micro-batch into fewer, larger files before writing, without a `repartition()` or `coalesce()` call in the code. The trigger is unchanged, so new events are committed as often as before, and `partitionBy()` can be kept.
    fr: |-
      L'écriture optimisée est une configuration Spark qui réorganise les données de chaque micro-lot en fichiers moins nombreux et plus gros avant l'écriture, sans appel à `repartition()` ou `coalesce()` dans le code. Le déclencheur ne change pas : les nouveaux événements sont validés aussi souvent qu'avant, et `partitionBy()` peut être conservé.
  options:
    a:
      en: |-
        A longer trigger interval produces larger batches and fewer files, but new events would be available only every 10 minutes.
      fr: |-
        Un intervalle de déclenchement plus long produit des lots plus gros et moins de fichiers, mais les nouveaux événements ne seraient disponibles que toutes les 10 minutes.
    c:
      en: |-
        Partitioning on a second, high-cardinality column creates more folders and therefore even more small files.
      fr: |-
        Partitionner sur une seconde colonne à forte cardinalité crée davantage de dossiers, et donc encore plus de petits fichiers.
    d:
      en: |-
        The update output mode is used for aggregations; it doesn't control how many files each micro-batch writes.
      fr: |-
        Le mode de sortie update sert aux agrégations ; il ne contrôle pas le nombre de fichiers écrits par chaque micro-lot.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
