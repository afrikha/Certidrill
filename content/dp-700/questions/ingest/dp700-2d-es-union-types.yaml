id: dp700-2d-es-union-types
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an eventstream named **ES-Sensors** that has two sources: **SensorsEU** and **SensorsUS**. Both sources send events that contain the `deviceId` and `temp` fields. In SensorsEU, `temp` is a `double`. In SensorsUS, `temp` is a `string`.

    You add a Union operator that merges the two streams and sends the result to a lakehouse. When you preview the output of the Union operator, the `temp` field is missing.

    You need the output of the Union operator to contain the `temp` field for the events of both sources.

    What should you do?
  fr: |
    Vous disposez d'un flux d'événements nommé **ES-Sensors** qui a deux sources : **SensorsEU** et **SensorsUS**. Les deux sources envoient des événements qui contiennent les champs `deviceId` et `temp`. Dans SensorsEU, `temp` est de type `double`. Dans SensorsUS, `temp` est de type `string`.

    Vous ajoutez un opérateur Union qui fusionne les deux flux et envoie le résultat à un lakehouse. Quand vous affichez un aperçu de la sortie de l'opérateur Union, le champ `temp` est absent.

    La sortie de l'opérateur Union doit contenir le champ `temp` pour les événements des deux sources.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Replace the Union operator with a Join operator on the deviceId field.", fr: "Remplacer l'opérateur Union par un opérateur Join sur le champ deviceId." }
    - id: b
      text: { en: "Add an Expand operator on the temp field after the Union operator.", fr: "Ajouter un opérateur Expand sur le champ temp après l'opérateur Union." }
    - id: c
      text: { en: "Add a Manage fields operator on the SensorsUS path that changes temp to double.", fr: "Ajouter un opérateur Manage fields sur le chemin de SensorsUS qui change temp en double." }
    - id: d
      text: { en: "Add a Filter operator on the SensorsUS path that removes events whose temp is null.", fr: "Ajouter un opérateur Filter sur le chemin de SensorsUS qui retire les événements dont temp est null." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The Union operator keeps only the fields that have the same name and the same data type in every input; the other fields are dropped. Changing the type of `temp` to `double` with Manage fields before the Union makes the field identical in both streams, so it's kept.
    fr: |-
      L'opérateur Union ne garde que les champs qui ont le même nom et le même type de données dans toutes les entrées ; les autres champs sont écartés. Changer le type de `temp` en `double` avec Manage fields avant l'opérateur Union rend le champ identique dans les deux flux, qui est donc conservé.
  options:
    a:
      en: |-
        Join combines two streams into one event when a matching condition is met; it doesn't append the events of both sources into one stream.
      fr: |-
        Join combine deux flux en un seul événement quand une condition de correspondance est remplie ; il n'ajoute pas les événements des deux sources dans un même flux.
    b:
      en: |-
        Expand creates one row per value of an array field; it can't restore a field that the Union already dropped.
      fr: |-
        Expand crée une ligne par valeur d'un champ de type tableau ; il ne peut pas rétablir un champ que l'opérateur Union a déjà écarté.
    d:
      en: |-
        The field is dropped because of its data type, not because of null values; filtering events doesn't change the type.
      fr: |-
        Le champ est écarté à cause de son type de données, pas à cause de valeurs null ; filtrer les événements ne change pas le type.
references:
  - title: Route data streams based on content in Microsoft Fabric eventstreams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/route-events-based-on-content
