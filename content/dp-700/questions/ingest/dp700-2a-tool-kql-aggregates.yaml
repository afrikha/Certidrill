id: dp700-2a-tool-kql-aggregates
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an eventhouse named **EH4** that contains a KQL database named **PlantDB**. A table named **MachineReadings** receives about 50,000 rows per second from an eventstream.

    A Real-Time Dashboard must show the average temperature of each machine per 5-minute interval. The results must include the most recent readings. The solution must minimize data movement and query latency.

    What should you do?
  fr: |
    Vous disposez d'un eventhouse nommé **EH4** qui contient une base de données KQL nommée **PlantDB**. Une table nommée **MachineReadings** reçoit environ 50 000 lignes par seconde d'un flux d'événements.

    Un tableau de bord en temps réel doit afficher la température moyenne de chaque machine par intervalle de 5 minutes. Les résultats doivent inclure les relevés les plus récents. La solution doit réduire au minimum les déplacements de données et la latence des requêtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a materialized view in PlantDB that summarizes MachineReadings by machine and bin(Timestamp, 5m).", fr: "Créer dans PlantDB une vue matérialisée qui agrège MachineReadings par machine et par bin(Timestamp, 5m)." } }
    - { id: b, text: { en: "Copy MachineReadings to a warehouse every 5 minutes, and compute the averages in a T-SQL view.", fr: "Copier MachineReadings dans un entrepôt toutes les 5 minutes, et calculer les moyennes dans une vue T-SQL." } }
    - { id: c, text: { en: "Run a Dataflow Gen2 every 5 minutes that aggregates MachineReadings into a lakehouse table.", fr: "Exécuter toutes les 5 minutes un Dataflow Gen2 qui agrège MachineReadings dans une table de lakehouse." } }
    - { id: d, text: { en: "Run a notebook every 5 minutes that aggregates MachineReadings into a Delta table.", fr: "Exécuter toutes les 5 minutes un notebook qui agrège MachineReadings dans une table Delta." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The data is already in an eventhouse, so KQL transforms it in place. A materialized view keeps the aggregation up to date as data is ingested, and querying the view combines its materialized part with the newest rows, so results are fresh and faster than aggregating the source table at each query.
    fr: |
      Les données sont déjà dans un eventhouse : KQL les transforme sur place. Une vue matérialisée maintient l'agrégation à jour au fil de l'ingestion, et interroger la vue combine sa partie matérialisée avec les lignes les plus récentes : les résultats sont frais et plus rapides qu'une agrégation de la table source à chaque requête.
  options:
    b: { en: "Copying to a warehouse adds data movement and a 5-minute delay before the newest readings are visible.", fr: "Copier vers un entrepôt ajoute des déplacements de données et un délai de 5 minutes avant que les derniers relevés soient visibles." }
    c: { en: "A scheduled dataflow moves the data out of the eventhouse and lags behind the newest readings.", fr: "Un dataflow planifié déplace les données hors de l'eventhouse et prend du retard sur les derniers relevés." }
    d: { en: "A scheduled notebook moves the data to Delta and can't include the readings ingested since its last run.", fr: "Un notebook planifié déplace les données vers Delta et ne peut pas inclure les relevés ingérés depuis sa dernière exécution." }
references:
  - title: Materialized views
    url: https://learn.microsoft.com/en-us/kusto/management/materialized-views/materialized-view-overview?view=microsoft-fabric
