id: dp700-2a-store-raw-files
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is planning a new analytics solution in Fabric. Data engineers will land product images, PDF manuals and raw JSON files sent by suppliers. They will then use PySpark notebooks to build curated Delta tables from the JSON files.

    You need to recommend a single data store for both the raw files and the curated tables.

    What should you recommend?
  fr: |
    Fabrikam prévoit une nouvelle solution d'analytique dans Fabric. Les ingénieurs données y déposeront des images de produits, des manuels PDF et des fichiers JSON bruts envoyés par les fournisseurs. Ils utiliseront ensuite des notebooks PySpark pour créer des tables Delta organisées à partir des fichiers JSON.

    Vous devez recommander un magasin de données unique pour les fichiers bruts et les tables organisées.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A lakehouse", fr: "Un lakehouse" } }
    - { id: b, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: c, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - { id: d, text: { en: "A SQL database in Fabric", fr: "Une base de données SQL dans Fabric" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A lakehouse stores unstructured, semi-structured and structured data: files of any format in its Files section and Delta tables in its Tables section. Its primary development experience is Spark (PySpark, Spark SQL) in notebooks, which matches the data engineers.
    fr: |
      Un lakehouse stocke des données non structurées, semi-structurées et structurées : des fichiers de tout format dans sa section Files et des tables Delta dans sa section Tables. Son expérience de développement principale est Spark (PySpark, Spark SQL) dans des notebooks, ce qui convient aux ingénieurs données.
  options:
    b: { en: "A warehouse stores relational tables managed with T-SQL; it isn't a place for images and PDF files.", fr: "Un entrepôt stocke des tables relationnelles gérées en T-SQL ; ce n'est pas un emplacement pour des images et des fichiers PDF." }
    c: { en: "An eventhouse is designed for streaming events and time-based data queried with KQL.", fr: "Un eventhouse est conçu pour les événements de diffusion en continu et les données temporelles interrogées en KQL." }
    d: { en: "A SQL database in Fabric is an operational (OLTP) database, not a store for raw files.", fr: "Une base de données SQL dans Fabric est une base opérationnelle (OLTP), pas un magasin de fichiers bruts." }
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
