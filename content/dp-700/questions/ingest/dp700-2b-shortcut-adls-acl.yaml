id: dp700-2b-shortcut-adls-acl
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Claims that has a workspace identity. WS-Claims contains a lakehouse named LH-Claims.

    An Azure Data Lake Storage Gen2 account named stadatumclaims has the hierarchical namespace enabled. It contains a container named claims that has a directory named 2026.

    You plan to create a shortcut in LH-Claims that points to claims/2026. The connection will authenticate by using the workspace identity. The storage team requires that the identity can read only the 2026 directory, controlled by access control lists (ACLs), and that it receives no Azure role that grants data access to the whole storage account.

    How should you configure the shortcut? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Claims doté d'une identité d'espace de travail. WS-Claims contient un lakehouse nommé LH-Claims.

    Un compte Azure Data Lake Storage Gen2 nommé stadatumclaims a l'espace de noms hiérarchique activé. Il contient un conteneur nommé claims qui possède un répertoire nommé 2026.

    Vous prévoyez de créer dans LH-Claims un raccourci qui pointe vers claims/2026. La connexion s'authentifiera avec l'identité d'espace de travail. L'équipe Stockage exige que l'identité ne puisse lire que le répertoire 2026, contrôlé par des listes de contrôle d'accès (ACL), et qu'elle ne reçoive aucun rôle Azure qui donne accès aux données de tout le compte de stockage.

    Comment devez-vous configurer le raccourci ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      URL of the connection: [[url]]

      Azure role assigned to the workspace identity on stadatumclaims: [[role]]
    fr: |
      URL de la connexion : [[url]]

      Rôle Azure attribué à l'identité d'espace de travail sur stadatumclaims : [[role]]
  slots:
    - id: url
      options:
        - { id: dfs, text: "https://stadatumclaims.dfs.core.windows.net" }
        - { id: blob, text: "https://stadatumclaims.blob.core.windows.net" }
        - { id: file, text: "https://stadatumclaims.file.core.windows.net" }
        - { id: onelake, text: "https://onelake.dfs.fabric.microsoft.com" }
    - id: role
      options:
        - { id: delegator, text: Storage Blob Delegator }
        - { id: reader, text: Storage Blob Data Reader }
        - { id: acctcontrib, text: Storage Account Contributor }
        - { id: armreader, text: Reader }
answer:
  values: { url: dfs, role: delegator }
explanation:
  correct:
    en: |
      An ADLS Gen2 shortcut connection must use the DFS endpoint of the storage account. With Microsoft Entra authentication, the identity needs the Generate a user delegation key action: Storage Blob Delegator grants it without data access, and the ACLs on the 2026 directory then decide what the identity can read, which gives directory-level control.
    fr: |
      La connexion d'un raccourci ADLS Gen2 doit utiliser le point de terminaison DFS du compte de stockage. Avec l'authentification Microsoft Entra, l'identité a besoin de l'action Generate a user delegation key : Storage Blob Delegator l'accorde sans accès aux données, puis les ACL du répertoire 2026 décident de ce que l'identité peut lire, ce qui donne un contrôle au niveau du répertoire.
  options:
    blob: { en: "The shortcut requires the DFS endpoint, not the Blob endpoint.", fr: "Le raccourci exige le point de terminaison DFS, pas le point de terminaison Blob." }
    file: { en: "The file endpoint serves Azure Files shares, not ADLS Gen2 data.", fr: "Le point de terminaison file sert les partages Azure Files, pas les données ADLS Gen2." }
    onelake: { en: "This is the OneLake endpoint, not the endpoint of the external storage account.", fr: "Il s'agit du point de terminaison OneLake, pas de celui du compte de stockage externe." }
    reader: { en: "Storage Blob Data Reader on the account grants read access to every container, which the storage team forbids.", fr: "Storage Blob Data Reader sur le compte accorde la lecture de tous les conteneurs, ce que l'équipe Stockage interdit." }
    acctcontrib: { en: "Storage Account Contributor manages the account but gives no user delegation key for data access.", fr: "Storage Account Contributor gère le compte mais ne fournit pas de clé de délégation d'utilisateur pour l'accès aux données." }
    armreader: { en: "Reader is a control-plane role; it doesn't include the user delegation key action.", fr: "Reader est un rôle du plan de contrôle ; il n'inclut pas l'action de clé de délégation d'utilisateur." }
references:
  - title: Create an Azure Data Lake Storage Gen2 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-adls-shortcut
