id: dp700-cs4a-expand-readings
objective: "2.3.4"
type: single
caseStudy: dp700-cs4a-city-power
difficulty: 2
status: draft
stem:
  en: |
    You need to configure ES-Meters to meet the ingestion requirement for the Readings table.

    What should you do?
  fr: |
    Vous devez configurer ES-Meters pour satisfaire l'exigence d'ingestion concernant la table Readings.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an Eventhouse destination in direct ingestion mode, and map the readings field to a dynamic column of Readings.", fr: "Ajouter une destination Eventhouse en mode d'ingestion directe, et mapper le champ readings sur une colonne dynamic de Readings." } }
    - { id: b, text: { en: "Add a Group by operator on GatewayId, and send its output to an Eventhouse destination in event processing before ingestion mode.", fr: "Ajouter un opérateur Group by sur GatewayId, et envoyer sa sortie vers une destination Eventhouse en mode de traitement des événements avant l'ingestion." } }
    - { id: c, text: { en: "Add a Manage fields operator that selects the readings field, and send its output to an Eventhouse destination in direct ingestion mode.", fr: "Ajouter un opérateur Manage fields qui sélectionne le champ readings, et envoyer sa sortie vers une destination Eventhouse en mode d'ingestion directe." } }
    - { id: d, text: { en: "Add an Expand operator on the readings field, and send its output to an Eventhouse destination in event processing before ingestion mode.", fr: "Ajouter un opérateur Expand sur le champ readings, et envoyer sa sortie vers une destination Eventhouse en mode de traitement des événements avant l'ingestion." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Expand operator expands an array value and creates a new row for each value of the array, so each element of readings becomes one row of the output stream, next to the fields of its event. An Eventhouse destination that follows an operator uses the event processing before ingestion mode. The solution is configured in the eventstream editor, without KQL code or an intermediate table.
    fr: |
      L'opérateur Expand développe une valeur de tableau et crée une ligne pour chaque valeur du tableau : chaque élément de readings devient une ligne du flux de sortie, à côté des champs de son événement. Une destination Eventhouse placée après un opérateur utilise le mode de traitement des événements avant l'ingestion. La solution se configure dans l'éditeur du flux d'événements, sans code KQL ni table intermédiaire.
  options:
    a:
      en: |
        Direct ingestion writes each event as one row. Mapping the array to a dynamic column keeps up to 200 readings in a single row instead of one row per reading.
      fr: |
        L'ingestion directe écrit chaque événement sous la forme d'une ligne. Mapper le tableau sur une colonne dynamic conserve jusqu'à 200 relevés dans une seule ligne au lieu d'une ligne par relevé.
    b:
      en: |
        Group by aggregates the events in a time window; it reduces the number of rows instead of creating one row per array element.
      fr: |
        Group by agrège les événements sur une fenêtre de temps ; il réduit le nombre de lignes au lieu de créer une ligne par élément du tableau.
    c:
      en: |
        Manage fields adds, removes or retypes fields; it does not split an array into rows. A destination placed after an operator also cannot use direct ingestion.
      fr: |
        Manage fields ajoute, supprime ou change le type de champs ; il ne divise pas un tableau en lignes. Une destination placée après un opérateur ne peut pas non plus utiliser l'ingestion directe.
references:
