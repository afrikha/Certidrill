id: dp700-cs1a-update-policy
objective: "2.3.6"
type: dropdown
caseStudy: dp700-cs1a-alpine-ski-house
difficulty: 3
status: draft
stem:
  en: |
    You need to meet requirement 2 for the Scans table. How should you complete the KQL management command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence 2 concernant la table Scans. Comment devez-vous compléter la commande de gestion KQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    .alter table [[target]] policy update
    @'[{"IsEnabled": true, "Source": "[[source]]", "Query": "ParseScans()", [[tx]]}]'
  slots:
    - id: target
      options:
        - { id: tscans, text: Scans }
        - { id: traw, text: RawScans }
        - { id: tfn, text: ParseScans }
    - id: source
      options:
        - { id: sraw, text: RawScans }
        - { id: sscans, text: Scans }
        - { id: ses, text: ES_Gates }
    - id: tx
      options:
        - { id: txfalse, text: "\"IsTransactional\": false" }
        - { id: txtrue, text: "\"IsTransactional\": true" }
        - { id: prop, text: "\"PropagateIngestionProperties\": true" }
answer:
  values: { target: tscans, source: sraw, tx: txtrue }
explanation:
  correct:
    en: |-
      An update policy is set on the target table, Scans, and its Source property names the table whose ingestions trigger it, RawScans. With IsTransactional set to true, a failure of the policy query fails the whole ingestion, so the data is written to neither table and RawScans never holds events that are missing from Scans. The default, false, keeps the data in the source table even when the policy fails.
    fr: |-
      Une stratégie de mise à jour se définit sur la table cible, Scans, et sa propriété Source désigne la table dont les ingestions la déclenchent, RawScans. Avec IsTransactional à true, l'échec de la requête de la stratégie fait échouer toute l'ingestion : les données ne sont écrites dans aucune des deux tables, et RawScans ne contient jamais d'événements absents de Scans. La valeur par défaut, false, conserve les données dans la table source même quand la stratégie échoue.
  options:
    traw:
      en: |-
        Setting the policy on RawScans would make RawScans the target; the policy must be defined on the table that receives the transformed rows.
      fr: |-
        Définir la stratégie sur RawScans en ferait la table cible ; la stratégie doit être définie sur la table qui reçoit les lignes transformées.
    ses:
      en: |-
        The Source of an update policy is a table of the same database, not an eventstream.
      fr: |-
        La source d'une stratégie de mise à jour est une table de la même base de données, pas un flux d'événements.
    prop:
      en: |-
        PropagateIngestionProperties copies ingestion properties such as extent tags to the target table; it does not make the ingestion fail when the policy fails.
      fr: |-
        PropagateIngestionProperties copie des propriétés d'ingestion, comme les balises d'extent, vers la table cible ; elle ne fait pas échouer l'ingestion quand la stratégie échoue.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
