id: dp700-2b-transform-endpoint-readonly
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named LH-Finance and a warehouse named DW-Finance. LH-Finance has a Delta table named invoices.

    A team of SQL developers must correct the Status values of invoices by running T-SQL UPDATE statements, and then serve the corrected data to analysts. When the developers connect to the SQL analytics endpoint of LH-Finance and run an UPDATE statement, the statement fails.

    You need to let the developers apply their corrections in T-SQL.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé LH-Finance et un entrepôt nommé DW-Finance. LH-Finance possède une table Delta nommée invoices.

    Une équipe de développeurs SQL doit corriger les valeurs Status d'invoices en exécutant des instructions T-SQL UPDATE, puis servir les données corrigées aux analystes. Quand les développeurs se connectent au point de terminaison d'analytique SQL de LH-Finance et exécutent une instruction UPDATE, l'instruction échoue.

    Vous devez permettre aux développeurs d'appliquer leurs corrections en T-SQL.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add the developers to the db_owner role of the SQL analytics endpoint of LH-Finance."
        fr: "Ajouter les développeurs au rôle db_owner du point de terminaison d'analytique SQL de LH-Finance."
    - id: b
      text:
        en: "Create a table in DW-Finance with CREATE TABLE AS SELECT from LH-Finance.dbo.invoices, and update that table."
        fr: "Créer une table dans DW-Finance avec CREATE TABLE AS SELECT depuis LH-Finance.dbo.invoices, puis mettre à jour cette table."
    - id: c
      text:
        en: "Create a shortcut to invoices in a second lakehouse, and run the UPDATE statements on the shortcut."
        fr: "Créer un raccourci vers invoices dans un second lakehouse, puis exécuter les instructions UPDATE sur le raccourci."
    - id: d
      text:
        en: "Create a view over invoices in the SQL analytics endpoint, and run the UPDATE statements on the view."
        fr: "Créer une vue sur invoices dans le point de terminaison d'analytique SQL, puis exécuter les instructions UPDATE sur la vue."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Insert, update and delete operations are supported only in a warehouse, not in the SQL analytics endpoint of a lakehouse. T-SQL in DW-Finance can read the lakehouse table by its three-part name because both items are in the same workspace, so CTAS copies invoices into a warehouse table that the developers can then update.
    fr: |
      Les opérations d'insertion, de mise à jour et de suppression ne sont prises en charge que dans un entrepôt, pas dans le point de terminaison d'analytique SQL d'un lakehouse. T-SQL dans DW-Finance peut lire la table du lakehouse par son nom en trois parties, car les deux éléments sont dans le même espace de travail : CTAS copie invoices dans une table d'entrepôt que les développeurs peuvent ensuite mettre à jour.
  options:
    a:
      en: |
        The endpoint is read-only for data whatever the permissions: no role enables UPDATE on lakehouse tables.
      fr: |
        Le point de terminaison est en lecture seule pour les données quelles que soient les autorisations : aucun rôle n'active UPDATE sur les tables d'un lakehouse.
    c:
      en: |
        The SQL analytics endpoint of the second lakehouse is read-only too, so the UPDATE still fails.
      fr: |
        Le point de terminaison d'analytique SQL du second lakehouse est lui aussi en lecture seule : l'UPDATE échoue toujours.
    d:
      en: |
        Views, functions and procedures can be created in the endpoint, but they can't modify the Delta data.
      fr: |
        Des vues, fonctions et procédures peuvent être créées dans le point de terminaison, mais elles ne peuvent pas modifier les données Delta.
references:
  - title: T-SQL surface area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  - title: Ingest data into the warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data
