id: dp700-2a-copyjob-mixed-cdc
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a copy job named **CJ1** that copies 12 tables from an Azure SQL database named **SalesDB** to a warehouse named **DW1**. CJ1 uses incremental copy mode and the Merge update method.

    CDC is enabled on 10 of the tables, including dbo.Orders. CDC can't be enabled on the two other tables, which have a ModifiedAt column that is updated on every change.

    After several runs, you discover that orders deleted in SalesDB are still present in DW1.

    You need to ensure that the deletions in the 10 CDC-enabled tables are applied to DW1. The two other tables must still be copied incrementally.

    What should you do?
  fr: |
    Vous disposez d'un travail de copie nommé **CJ1** qui copie 12 tables d'une base de données Azure SQL nommée **SalesDB** vers un entrepôt nommé **DW1**. CJ1 utilise le mode copie incrémentielle et la méthode de mise à jour Merge.

    La CDC est activée sur 10 des tables, dont dbo.Orders. La CDC ne peut pas être activée sur les deux autres tables, qui comportent une colonne ModifiedAt mise à jour à chaque changement.

    Après plusieurs exécutions, vous constatez que des commandes supprimées dans SalesDB sont toujours présentes dans DW1.

    Vous devez faire en sorte que les suppressions des 10 tables où la CDC est activée soient appliquées à DW1. Les deux autres tables doivent toujours être copiées de façon incrémentielle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Move the two tables without CDC to a separate copy job, so that CJ1 contains only CDC-enabled tables.", fr: "Déplacer les deux tables sans CDC vers un travail de copie distinct, afin que CJ1 ne contienne que des tables où la CDC est activée." } }
    - { id: b, text: { en: "Change the update method of CJ1 from Merge to Overwrite, so that each run replaces the destination tables.", fr: "Remplacer la méthode de mise à jour Merge de CJ1 par Overwrite, afin que chaque exécution remplace les tables de destination." } }
    - { id: c, text: { en: "Reset CJ1 to full copy for dbo.Orders, so that the next run copies the table again from the beginning.", fr: "Réinitialiser CJ1 en copie complète pour dbo.Orders, afin que la prochaine exécution recopie la table depuis le début." } }
    - { id: d, text: { en: "Select the primary key of each table as the key column of the Merge update method in CJ1.", fr: "Sélectionner la clé primaire de chaque table comme colonne clé de la méthode de mise à jour Merge dans CJ1." } }
answer: { optionId: a }
explanation:
  correct:
    en: When a copy job selects both CDC-enabled and non-CDC tables, all its tables are treated as watermark-based, and a watermark captures only inserts and updates. With the CDC-enabled tables alone in CJ1, the job uses CDC and the Merge method also deletes rows. The two other tables keep a watermark-based incremental copy in their own copy job.
    fr: Quand un travail de copie sélectionne à la fois des tables avec et sans CDC, toutes ses tables sont traitées en mode filigrane, et un filigrane ne capture que les insertions et les mises à jour. Avec uniquement les tables où la CDC est activée dans CJ1, le travail utilise la CDC et la méthode Merge supprime aussi les lignes. Les deux autres tables gardent une copie incrémentielle par filigrane dans leur propre travail de copie.
  options:
    b: { en: "In incremental mode, Overwrite would replace each destination table with only the rows changed since the last run, which loses data.", fr: "En mode incrémentiel, Overwrite remplacerait chaque table de destination par les seules lignes modifiées depuis la dernière exécution, ce qui fait perdre des données." }
    c: { en: "A reset removes today's leftovers once, but later runs are still watermark-based and keep missing new deletions.", fr: "Une réinitialisation corrige une fois les lignes en trop, mais les exécutions suivantes restent en mode filigrane et continuent de manquer les nouvelles suppressions." }
    d: { en: "Merge already uses the primary key by default; the key doesn't matter if the deletions are never captured.", fr: "Merge utilise déjà la clé primaire par défaut ; la clé ne change rien si les suppressions ne sont jamais capturées." }
references:
  - title: Change data capture (CDC) in Copy Job
    url: https://learn.microsoft.com/en-us/fabric/data-factory/cdc-copy-job
