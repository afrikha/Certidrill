id: dp700-2d-es-derived-endpoint
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that contains an eventstream named **ES-Shipments**. ES-Shipments receives shipment events from an Azure event hub. A Filter operator keeps only the events of delayed shipments, and its output is sent to a lakehouse named **LH1**.

    A partner application that runs outside Fabric must also receive the delayed shipment events in near real time by reading them from a custom endpoint.

    You need to configure ES-Shipments to meet the requirement. The solution must not change the data that LH1 receives.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui contient un flux d'événements nommé **ES-Shipments**. ES-Shipments reçoit des événements d'expédition d'un hub d'événements Azure. Un opérateur Filter ne garde que les événements des expéditions retardées, et sa sortie est envoyée à un lakehouse nommé **LH1**.

    Une application partenaire exécutée en dehors de Fabric doit aussi recevoir les événements des expéditions retardées en quasi-temps réel, en les lisant à partir d'un point de terminaison personnalisé.

    Vous devez configurer ES-Shipments pour satisfaire cette exigence. La solution ne doit pas modifier les données que reçoit LH1.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a custom endpoint destination to the default stream.", fr: "Ajouter une destination de point de terminaison personnalisé au flux par défaut." }
    - id: b
      text: { en: "Add a lakehouse shortcut to LH1, and then connect the custom endpoint to the shortcut.", fr: "Ajouter un raccourci de lakehouse vers LH1, puis connecter le point de terminaison personnalisé au raccourci." }
    - id: c
      text: { en: "Add an Activator destination after the Filter operator, and then connect the custom endpoint to it.", fr: "Ajouter une destination Activator après l'opérateur Filter, puis y connecter le point de terminaison personnalisé." }
    - id: d
      text: { en: "Add a derived stream after the Filter operator, and then add a custom endpoint destination to it.", fr: "Ajouter un flux dérivé après l'opérateur Filter, puis lui ajouter une destination de point de terminaison personnalisé." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Only the lakehouse, eventhouse (event processing before ingestion), derived stream and Activator destinations can be attached directly to the output of an operator. For any other destination, such as a custom endpoint, you publish the processed events as a derived stream and attach the destination to it. The path to LH1 isn't modified.
    fr: |-
      Seules les destinations lakehouse, eventhouse (traitement des événements avant l'ingestion), flux dérivé et Activator peuvent être attachées directement à la sortie d'un opérateur. Pour toute autre destination, comme un point de terminaison personnalisé, vous publiez les événements traités sous la forme d'un flux dérivé et vous y attachez la destination. Le chemin vers LH1 n'est pas modifié.
  options:
    a:
      en: |-
        The default stream carries all the shipment events, before the Filter operator, so the partner would also receive the shipments that aren't delayed.
      fr: |-
        Le flux par défaut transporte tous les événements d'expédition, avant l'opérateur Filter : le partenaire recevrait aussi les expéditions qui ne sont pas retardées.
    b:
      en: |-
        A shortcut exposes Delta tables in OneLake; a custom endpoint destination is fed by an eventstream, not by a lakehouse table.
      fr: |-
        Un raccourci expose des tables Delta dans OneLake ; une destination de point de terminaison personnalisé est alimentée par un flux d'événements, pas par une table de lakehouse.
    c:
      en: |-
        Activator evaluates rules and triggers actions; it isn't a stream that other destinations can be attached to.
      fr: |-
        Activator évalue des règles et déclenche des actions ; ce n'est pas un flux auquel d'autres destinations peuvent être attachées.
references:
  - title: Process Event Data by Using the Event Processing Editor
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/process-events-using-event-processor-editor
  - title: Add a derived stream destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-derived-stream
