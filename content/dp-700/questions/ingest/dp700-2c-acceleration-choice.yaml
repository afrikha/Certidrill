id: dp700-2c-acceleration-choice
objective: "2.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses an eventhouse for its KQL workloads. You need to choose how each of the following datasets should be made available to KQL queries:

    - Auditors query a 3 TB Delta table of a lakehouse a few times a year. Cost must be minimized, and the data must not be copied.
    - Every five seconds, a dashboard joins streaming events with a small customer table that is mirrored from Azure SQL Database into OneLake. No ingestion process may be built.
    - JSON events from an eventstream must be parsed into typed columns by an update policy as they arrive.
    - Data scientists occasionally explore Delta files in an Amazon S3 bucket from KQL. Cost must be minimized.

    What should you use for each dataset? To answer, drag the appropriate options to the correct datasets. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise un eventhouse pour ses charges de travail KQL. Vous devez choisir comment rendre chacun des jeux de données suivants disponible pour les requêtes KQL :

    - Des auditeurs interrogent quelques fois par an une table Delta de 3 To d'un lakehouse. Le coût doit être réduit au minimum, et les données ne doivent pas être copiées.
    - Toutes les cinq secondes, un tableau de bord joint des événements en continu à une petite table de clients mise en miroir depuis Azure SQL Database dans OneLake. Aucun processus d'ingestion ne doit être créé.
    - Des événements JSON issus d'un flux d'événements doivent être analysés en colonnes typées par une stratégie de mise à jour à leur arrivée.
    - Des data scientists explorent occasionnellement depuis KQL des fichiers Delta d'un compartiment Amazon S3. Le coût doit être réduit au minimum.

    Que devez-vous utiliser pour chaque jeu de données ? Pour répondre, faites glisser les options appropriées vers les jeux de données correspondants. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: native, text: { en: "Native table", fr: "Table native" } }
    - { id: standard, text: { en: "OneLake shortcut without query acceleration", fr: "Raccourci OneLake sans accélération des requêtes" } }
    - { id: accel, text: { en: "OneLake shortcut with query acceleration", fr: "Raccourci OneLake avec accélération des requêtes" } }
  targets:
    - { id: t1, text: { en: "3 TB audit table queried a few times a year", fr: "Table d'audit de 3 To interrogée quelques fois par an" } }
    - { id: t2, text: { en: "Mirrored customer table joined every five seconds", fr: "Table de clients mise en miroir jointe toutes les cinq secondes" } }
    - { id: t3, text: { en: "JSON events parsed by an update policy", fr: "Événements JSON analysés par une stratégie de mise à jour" } }
    - { id: t4, text: { en: "Delta files in Amazon S3 explored occasionally", fr: "Fichiers Delta dans Amazon S3 explorés occasionnellement" } }
answer:
  mapping: { t1: standard, t2: accel, t3: native, t4: standard }
explanation:
  correct:
    en: |
      Rarely queried data stays behind a standard shortcut, which adds no cache or indexing cost. A small, frequently joined dimension that lands in OneLake is the typical case for query acceleration: near-native performance without an ingestion pipeline, for a small extra cost. Data that an update policy must transform has to be ingested into a native table, because a shortcut can't be the source table of an update policy.
    fr: |
      Les données rarement interrogées restent derrière un raccourci standard, qui n'ajoute aucun coût de cache ni d'indexation. Une petite dimension souvent jointe qui arrive dans OneLake est le cas typique de l'accélération des requêtes : des performances proches d'une table native sans pipeline d'ingestion, pour un faible surcoût. Les données qu'une stratégie de mise à jour doit transformer doivent être ingérées dans une table native, car un raccourci ne peut pas être la table source d'une stratégie de mise à jour.
references:
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
