id: dp700-2d-win-kql-functions
objective: "2.3.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named **DB-Store**. A table named **Sales** contains the `StoreId`, `Timestamp` and `Amount` columns. The queries sort the rows by `StoreId` and `Timestamp` before applying any window function.

    You need to write KQL queries that meet the following requirements.

    Which function should you use for each requirement? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **DB-Store**. Une table nommée **Sales** contient les colonnes `StoreId`, `Timestamp` et `Amount`. Les requêtes trient les lignes par `StoreId` et `Timestamp` avant d'appliquer une fonction de fenêtre.

    Vous devez écrire des requêtes KQL qui satisfont les exigences suivantes.

    Quelle fonction devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bin, text: "bin()" }
    - { id: prev, text: "prev()" }
    - { id: cumsum, text: "row_cumsum()" }
    - { id: session, text: "row_window_session()" }
    - { id: number, text: "row_number()" }
  targets:
    - id: t1
      text: { en: "Total sales of each store per non-overlapping 15-minute interval, with summarize", fr: "Total des ventes de chaque magasin par intervalle de 15 minutes sans chevauchement, avec summarize" }
    - id: t2
      text: { en: "Time elapsed between each sale and the previous sale of the same store", fr: "Temps écoulé entre chaque vente et la vente précédente du même magasin" }
    - id: t3
      text: { en: "Running total of the amount of each store, reset when the store changes", fr: "Total cumulé du montant de chaque magasin, remis à zéro quand le magasin change" }
answer:
  mapping: { t1: bin, t2: prev, t3: cumsum }
explanation:
  correct:
    en: "`bin()` rounds each timestamp down to the start of its interval, which gives tumbling windows when used in the `by` clause of `summarize`. `prev()` returns the value of a column in an earlier row of the serialized row set. `row_cumsum()` computes a cumulative sum over the serialized rows and accepts a restart condition, such as `StoreId != prev(StoreId)`."
    fr: "`bin()` arrondit chaque horodatage au début de son intervalle, ce qui donne des fenêtres bascules quand il est utilisé dans la clause `by` de `summarize`. `prev()` renvoie la valeur d'une colonne dans une ligne précédente de l'ensemble de lignes sérialisé. `row_cumsum()` calcule une somme cumulée sur les lignes sérialisées et accepte une condition de redémarrage, comme `StoreId != prev(StoreId)`."
  options:
    session:
      en: |-
        row_window_session() returns the start of sessions defined by gaps between values; it doesn't sum amounts or compute the time since the previous row.
      fr: |-
        row_window_session() renvoie le début de sessions définies par des intervalles entre valeurs ; il ne cumule pas de montants et ne calcule pas le temps écoulé depuis la ligne précédente.
    number:
      en: |-
        row_number() returns the position of each row; it doesn't aggregate amounts.
      fr: |-
        row_number() renvoie la position de chaque ligne ; il n'agrège pas de montants.
references:
  - title: Window functions
    url: https://learn.microsoft.com/en-us/kusto/query/window-functions?view=microsoft-fabric
  - title: bin()
    url: https://learn.microsoft.com/en-us/kusto/query/bin-function?view=microsoft-fabric
