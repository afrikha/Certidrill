id: dp700-2b-shortcut-placement
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Data that contains a lakehouse named LH-Data and an eventhouse that has a KQL database named KQL-Data.

    You need to meet the data access requirements shown in the answer area.

    What should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Data qui contient un lakehouse nommé LH-Data et un eventhouse doté d'une base de données KQL nommée KQL-Data.

    Vous devez répondre aux exigences d'accès aux données présentées dans la zone de réponse.

    Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tables, text: { en: "A shortcut in the Tables folder of LH-Data", fr: "Un raccourci dans le dossier Tables de LH-Data" } }
    - { id: files, text: { en: "A shortcut in the Files folder of LH-Data", fr: "Un raccourci dans le dossier Files de LH-Data" } }
    - { id: kql, text: { en: "A OneLake shortcut in KQL-Data", fr: "Un raccourci OneLake dans KQL-Data" } }
    - { id: mirror, text: { en: "A mirrored database", fr: "Une base de données mise en miroir" } }
    - { id: copy, text: { en: "A Copy data activity in a pipeline", fr: "Une activité Copy data dans un pipeline" } }
  targets:
    - id: t1
      text: { en: "Query the Delta table customers of a lakehouse in another workspace with Spark and the SQL analytics endpoint of LH-Data, without copying the data", fr: "Interroger la table Delta customers d'un lakehouse d'un autre espace de travail avec Spark et le point de terminaison d'analytique SQL de LH-Data, sans copier les données" }
    - id: t2
      text: { en: "Read JSON files from a Google Cloud Storage bucket with Spark, without copying the files", fr: "Lire des fichiers JSON d'un compartiment Google Cloud Storage avec Spark, sans copier les fichiers" }
    - id: t3
      text: { en: "Query a Delta table stored in ADLS Gen2 by using external_table() in KQL, without copying the data", fr: "Interroger une table Delta stockée dans ADLS Gen2 avec external_table() en KQL, sans copier les données" }
    - id: t4
      text: { en: "Keep a continuously synchronized copy of an Azure SQL Managed Instance database in OneLake", fr: "Conserver dans OneLake une copie synchronisée en continu d'une base de données Azure SQL Managed Instance" }
answer:
  mapping: { t1: tables, t2: files, t3: kql, t4: mirror }
explanation:
  correct:
    en: |
      A top-level shortcut in Tables that points to Delta data is synchronized as a table for Spark and the SQL analytics endpoint. Files accepts shortcuts to any format, such as JSON in Google Cloud Storage. A shortcut in a KQL database is queried as an external table with external_table(). Mirroring keeps an Azure SQL Managed Instance database replicated in OneLake; a Copy data activity copies on a schedule instead of continuously.
    fr: |
      Un raccourci de niveau supérieur dans Tables qui pointe vers des données Delta est synchronisé comme une table pour Spark et le point de terminaison d'analytique SQL. Files accepte des raccourcis vers tous les formats, comme du JSON dans Google Cloud Storage. Un raccourci d'une base de données KQL s'interroge comme une table externe avec external_table(). La mise en miroir maintient une base Azure SQL Managed Instance répliquée dans OneLake ; une activité Copy data copie selon une planification, pas en continu.
references:
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
