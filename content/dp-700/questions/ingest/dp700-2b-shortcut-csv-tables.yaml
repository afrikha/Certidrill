id: dp700-2b-shortcut-csv-tables
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Sales that contains a lakehouse named LH-Sales. An Azure Data Lake Storage Gen2 account named stcontosoraw contains a folder named orders. A source system adds CSV files to the folder every night.

    A data engineer created a shortcut named orders at the top level of the Tables folder of LH-Sales. The shortcut points to the orders folder. The shortcut doesn't appear as a table in the SQL analytics endpoint, and Spark SQL queries on it fail.

    You need analysts to query the order data as a Delta table in LH-Sales. The source system must keep writing its CSV files to stcontosoraw.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Sales qui contient un lakehouse nommé LH-Sales. Un compte Azure Data Lake Storage Gen2 nommé stcontosoraw contient un dossier nommé orders. Un système source ajoute des fichiers CSV dans ce dossier chaque nuit.

    Un ingénieur Données a créé un raccourci nommé orders au niveau supérieur du dossier Tables de LH-Sales. Le raccourci pointe vers le dossier orders. Le raccourci n'apparaît pas comme une table dans le point de terminaison d'analytique SQL, et les requêtes Spark SQL qui l'utilisent échouent.

    Les analystes doivent pouvoir interroger les données de commandes sous forme de table Delta dans LH-Sales. Le système source doit continuer à écrire ses fichiers CSV dans stcontosoraw.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Move the shortcut into a subfolder of Tables named csv so that the lakehouse detects the file format."
        fr: "Déplacer le raccourci dans un sous-dossier de Tables nommé csv pour que le lakehouse détecte le format des fichiers."
    - id: b
      text:
        en: "Refresh the metadata of the SQL analytics endpoint so that it discovers the orders table."
        fr: "Actualiser les métadonnées du point de terminaison d'analytique SQL pour qu'il découvre la table orders."
    - id: c
      text:
        en: "Re-create the shortcut in the Files folder, and load its files into a Delta table with a notebook."
        fr: "Recréer le raccourci dans le dossier Files, puis charger ses fichiers dans une table Delta avec un notebook."
    - id: d
      text:
        en: "Turn on shortcut caching in the workspace settings so that the files are served from OneLake."
        fr: "Activer la mise en cache des raccourcis dans les paramètres de l'espace de travail pour que les fichiers soient servis depuis OneLake."
answer: { optionId: c }
explanation:
  correct:
    en: |
      The lakehouse recognizes a Tables shortcut as a table only when its target contains data in a supported table format such as Delta; CSV files are never discovered as a table. A shortcut in the Files folder accepts any format, so the notebook can read the CSV files in place and write them to a Delta table that analysts query. The source system keeps writing to stcontosoraw.
    fr: |
      Le lakehouse ne reconnaît un raccourci de Tables comme une table que si sa cible contient des données dans un format de table pris en charge, comme Delta ; des fichiers CSV ne sont jamais découverts comme une table. Un raccourci dans le dossier Files accepte tous les formats : le notebook peut lire les fichiers CSV sur place et les écrire dans une table Delta que les analystes interrogent. Le système source continue d'écrire dans stcontosoraw.
  options:
    a:
      en: |
        OneLake doesn't support shortcuts in subdirectories of the Tables folder, and the folder name doesn't change how the format is detected.
      fr: |
        OneLake ne prend pas en charge les raccourcis dans les sous-dossiers du dossier Tables, et le nom du dossier ne change rien à la détection du format.
    b:
      en: |
        A metadata refresh only discovers tables that are already in a supported format such as Delta; CSV files stay invisible as a table.
      fr: |
        Une actualisation des métadonnées ne découvre que des tables déjà dans un format pris en charge comme Delta ; des fichiers CSV restent invisibles en tant que table.
    d:
      en: |
        Shortcut caching applies to Amazon S3, S3-compatible, Google Cloud Storage and gateway shortcuts to reduce egress, not to ADLS Gen2, and it doesn't change the file format.
      fr: |
        La mise en cache des raccourcis concerne les raccourcis Amazon S3, compatibles S3, Google Cloud Storage et via passerelle pour réduire les sorties, pas ADLS Gen2, et elle ne change pas le format des fichiers.
references:
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
