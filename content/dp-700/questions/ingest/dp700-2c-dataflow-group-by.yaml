id: dp700-2c-dataflow-group-by
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a Dataflow Gen2 named DF_Sales. DF_Sales contains a query named Sales that has the following columns: Country, SalesChannel, CustomerID, and Units.

    You need the query to return one row per country and sales channel, with the total number of units and the number of distinct customers. The solution must use the Power Query editor without writing M code.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un Dataflow Gen2 nommé DF_Sales. DF_Sales contient une requête nommée Sales qui comporte les colonnes suivantes : Country, SalesChannel, CustomerID et Units.

    La requête doit renvoyer une ligne par pays et par canal de vente, avec le nombre total d'unités et le nombre de clients distincts. La solution doit utiliser l'éditeur Power Query sans écrire de code M.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Use **Remove duplicates** on Country, SalesChannel, and CustomerID, and then use **Group by** with a **Count rows** operation."
        fr: "Utiliser **Remove duplicates** sur Country, SalesChannel et CustomerID, puis utiliser **Group by** avec une opération **Count rows**."
    - id: b
      text:
        en: "Use **Group by** with the **Basic** option on Country, and add a **Count rows** operation and a **Sum** of Units."
        fr: "Utiliser **Group by** avec l'option **Basic** sur Country, et ajouter une opération **Count rows** et une opération **Sum** sur Units."
    - id: c
      text:
        en: "Use **Pivot column** on SalesChannel with Units as the values column and **Sum** as the aggregate function."
        fr: "Utiliser **Pivot column** sur SalesChannel avec Units comme colonne de valeurs et **Sum** comme fonction d'agrégation."
    - id: d
      text:
        en: "Use **Group by** with the **Advanced** option on Country and SalesChannel, and add a **Sum** of Units and a **Count distinct values** of CustomerID."
        fr: "Utiliser **Group by** avec l'option **Advanced** sur Country et SalesChannel, et ajouter une opération **Sum** sur Units et une opération **Count distinct values** sur CustomerID."
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Advanced option of Group by lets you group by several columns and add several aggregations. Sum adds the units of each group, and Count distinct values, available in Power Query Online and therefore in Dataflow Gen2, returns the number of distinct customers.
    fr: |
      L'option Advanced de Group by permet de regrouper sur plusieurs colonnes et d'ajouter plusieurs agrégations. Sum additionne les unités de chaque groupe, et Count distinct values, disponible dans Power Query Online et donc dans Dataflow Gen2, renvoie le nombre de clients distincts.
  options:
    b:
      en: |
        The Basic option groups by a single column (here Country only), and Count rows counts sales rows, not distinct customers.
      fr: |
        L'option Basic regroupe sur une seule colonne (ici Country seulement), et Count rows compte les lignes de vente, pas les clients distincts.
    a:
      en: |
        Removing duplicates on the three columns discards the Units of the removed rows, so a later Sum of Units would be wrong.
      fr: |
        Supprimer les doublons sur les trois colonnes élimine les Units des lignes supprimées : une opération Sum ultérieure sur Units serait fausse.
    c:
      en: |
        Pivoting creates one column per sales channel and doesn't count distinct customers.
      fr: |
        Le pivot crée une colonne par canal de vente et ne compte pas les clients distincts.
references:
  - title: How to GROUP BY or Summarize Rows - Power Query
    url: https://learn.microsoft.com/en-us/power-query/group-by
