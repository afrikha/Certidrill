id: dp700-2a-store-datasets
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is planning three new data sets in Fabric. You need to choose a data store for each data set.

    What should you choose? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit trois nouveaux jeux de données dans Fabric. Vous devez choisir un magasin de données pour chaque jeu de données.

    Que devez-vous choisir ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Scanned loan contracts (PDF) and their extracted JSON metadata, processed by PySpark notebooks: [[s1]]

      Card transaction events that fraud analysts query with KQL a few seconds after they occur: [[s2]]

      A conformed star schema for SQL-based reporting, loaded by T-SQL stored procedures: [[s3]]
    fr: |
      Contrats de prêt numérisés (PDF) et leurs métadonnées JSON extraites, traités par des notebooks PySpark : [[s1]]

      Événements de transactions par carte que les analystes antifraude interrogent en KQL quelques secondes après qu'ils se produisent : [[s2]]

      Un schéma en étoile conforme pour des rapports en SQL, chargé par des procédures stockées T-SQL : [[s3]]
  slots:
    - id: s1
      options:
        - { id: s1_lh, text: { en: Lakehouse, fr: Lakehouse } }
        - { id: s1_wh, text: { en: Warehouse, fr: Entrepôt } }
        - { id: s1_eh, text: { en: Eventhouse, fr: Eventhouse } }
        - { id: s1_sql, text: { en: SQL database, fr: Base de données SQL } }
    - id: s2
      options:
        - { id: s2_lh, text: { en: Lakehouse, fr: Lakehouse } }
        - { id: s2_wh, text: { en: Warehouse, fr: Entrepôt } }
        - { id: s2_eh, text: { en: Eventhouse, fr: Eventhouse } }
        - { id: s2_sql, text: { en: SQL database, fr: Base de données SQL } }
    - id: s3
      options:
        - { id: s3_lh, text: { en: Lakehouse, fr: Lakehouse } }
        - { id: s3_wh, text: { en: Warehouse, fr: Entrepôt } }
        - { id: s3_eh, text: { en: Eventhouse, fr: Eventhouse } }
        - { id: s3_sql, text: { en: SQL database, fr: Base de données SQL } }
answer:
  values: { s1: s1_lh, s2: s2_eh, s3: s3_wh }
explanation:
  correct:
    en: |
      A lakehouse stores unstructured files such as PDFs next to semi-structured data and Delta tables, and its main tool is Spark. An eventhouse is built for streaming events queried with KQL seconds after they arrive. A warehouse is the store for SQL-based BI on star schemas, developed and loaded with T-SQL.
    fr: |
      Un lakehouse stocke des fichiers non structurés comme des PDF à côté de données semi-structurées et de tables Delta, et son outil principal est Spark. Un eventhouse est conçu pour les événements de diffusion en continu interrogés en KQL quelques secondes après leur arrivée. Un entrepôt est le magasin de la BI en SQL sur des schémas en étoile, développés et chargés en T-SQL.
  options:
    s1_sql: { en: "A SQL database in Fabric is an operational relational database, not a store for PDF files processed by Spark.", fr: "Une base de données SQL dans Fabric est une base relationnelle opérationnelle, pas un magasin de fichiers PDF traités par Spark." }
    s2_lh: { en: "A lakehouse fed by streaming writes Delta files in batches and isn't queried with KQL.", fr: "Un lakehouse alimenté en streaming écrit des fichiers Delta par lots et ne s'interroge pas en KQL." }
    s3_sql: { en: "A SQL database targets OLTP workloads; the analytical star schema belongs in a warehouse.", fr: "Une base de données SQL cible les charges OLTP ; le schéma en étoile analytique a sa place dans un entrepôt." }
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
