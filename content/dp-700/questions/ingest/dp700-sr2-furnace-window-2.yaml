id: dp700-sr2-furnace-window-2
objective: "2.3.7"
type: series_yesno
series: dp700-sr2-furnace-window
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You use TIMESTAMP BY readingTime and a five-minute hopping window with a one-minute hop.
  fr: Vous utilisez TIMESTAMP BY readingTime et une fenêtre récurrente de cinq minutes avec un saut d'une minute.
body:
  solution:
    en: |
      You complete the query with `FROM FurnaceInput TIMESTAMP BY readingTime` and `GROUP BY furnaceId, HoppingWindow(minute, 5, 1)`.
    fr: |
      Vous complétez la requête avec `FROM FurnaceInput TIMESTAMP BY readingTime` et `GROUP BY furnaceId, HoppingWindow(minute, 5, 1)`.
answer: { value: true }
explanation:
  correct:
    en: |
      `HoppingWindow(minute, 5, 1)` defines five-minute windows that move forward by one minute, so each furnace gets one overlapping result every minute. `TIMESTAMP BY readingTime` makes the windows use the time of the reading instead of the arrival time, and the five-minute late arrival threshold keeps the readings that arrive up to two minutes late.
    fr: |
      `HoppingWindow(minute, 5, 1)` définit des fenêtres de cinq minutes qui avancent d'une minute : chaque four obtient un résultat chaque minute, sur des fenêtres qui se chevauchent. `TIMESTAMP BY readingTime` fait utiliser aux fenêtres l'heure du relevé au lieu de l'heure d'arrivée, et le seuil d'arrivée tardive de cinq minutes conserve les relevés qui arrivent jusqu'à deux minutes en retard.
references:
  - title: Hopping Window
    url: https://learn.microsoft.com/en-us/stream-analytics-query/hopping-window-azure-stream-analytics
