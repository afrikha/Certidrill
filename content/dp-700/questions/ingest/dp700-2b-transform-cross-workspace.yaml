id: dp700-2b-transform-cross-workspace
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two Fabric workspaces named WS-Ops and WS-DW. WS-Ops contains a lakehouse named LH-Ops that has a Delta table named orders, which is updated several times a day. WS-DW contains a warehouse named DW-Sales and a lakehouse named LH-Stage.

    You need a T-SQL stored procedure in DW-Sales that inserts the current rows of LH-Ops orders into the table dbo.FactOrders, transforming them with joins to the dimension tables of DW-Sales. The orders data must not be duplicated in OneLake before the procedure runs.

    What should you do?
  fr: |
    Vous disposez de deux espaces de travail Fabric nommés WS-Ops et WS-DW. WS-Ops contient un lakehouse nommé LH-Ops qui possède une table Delta nommée orders, mise à jour plusieurs fois par jour. WS-DW contient un entrepôt nommé DW-Sales et un lakehouse nommé LH-Stage.

    Une procédure stockée T-SQL de DW-Sales doit insérer les lignes actuelles de la table orders de LH-Ops dans la table dbo.FactOrders, en les transformant par des jointures avec les tables de dimension de DW-Sales. Les données orders ne doivent pas être dupliquées dans OneLake avant l'exécution de la procédure.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Grant the procedure's owner the Contributor role in WS-Ops, and select from LH-Ops.dbo.orders in INSERT...SELECT."
        fr: "Accorder au propriétaire de la procédure le rôle Contributor dans WS-Ops, puis sélectionner LH-Ops.dbo.orders dans INSERT...SELECT."
    - id: b
      text:
        en: "Run COPY INTO with the OneLake path of the Tables/orders folder of LH-Ops and FILE_TYPE = 'PARQUET'."
        fr: "Exécuter COPY INTO avec le chemin OneLake du dossier Tables/orders de LH-Ops et FILE_TYPE = 'PARQUET'."
    - id: c
      text:
        en: "Create a mirrored database of LH-Ops in WS-DW, and select from its SQL analytics endpoint in INSERT...SELECT."
        fr: "Créer une base de données mise en miroir de LH-Ops dans WS-DW, puis sélectionner son point de terminaison d'analytique SQL dans INSERT...SELECT."
    - id: d
      text:
        en: "Create a shortcut to orders in the Tables folder of LH-Stage, and select from LH-Stage.dbo.orders in INSERT...SELECT."
        fr: "Créer un raccourci vers orders dans le dossier Tables de LH-Stage, puis sélectionner LH-Stage.dbo.orders dans INSERT...SELECT."
answer: { optionId: d }
explanation:
  correct:
    en: |
      T-SQL ingestion with INSERT...SELECT reads tables of warehouses, lakehouses and mirrored databases in the same workspace by their three-part names. A shortcut in the Tables folder of LH-Stage makes orders appear as a table of LH-Stage, in WS-DW, without copying the data, so the procedure can join it to the dimensions of DW-Sales.
    fr: |
      L'ingestion T-SQL avec INSERT...SELECT lit, par leurs noms en trois parties, les tables des entrepôts, lakehouses et bases de données mises en miroir du même espace de travail. Un raccourci dans le dossier Tables de LH-Stage fait apparaître orders comme une table de LH-Stage, dans WS-DW, sans copier les données : la procédure peut la joindre aux dimensions de DW-Sales.
  options:
    a:
      en: |
        A role in WS-Ops doesn't change the rule that T-SQL ingestion sources must be in the same workspace as the warehouse.
      fr: |
        Un rôle dans WS-Ops ne change pas la règle selon laquelle les sources d'ingestion T-SQL doivent être dans le même espace de travail que l'entrepôt.
    b:
      en: |
        COPY INTO loads files into a table, which first duplicates the data in DW-Sales, and it reads Parquet files without the Delta log, so files of removed versions would be loaded too.
      fr: |
        COPY INTO charge des fichiers dans une table, ce qui duplique d'abord les données dans DW-Sales, et lit les fichiers Parquet sans le journal Delta : les fichiers des versions supprimées seraient chargés aussi.
    c:
      en: |
        A lakehouse isn't a mirroring source, and mirroring would copy the data again.
      fr: |
        Un lakehouse n'est pas une source de mise en miroir, et la mise en miroir copierait de nouveau les données.
references:
  - title: Ingest data into the warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
