id: dp700-2c-engine-statements
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware is comparing the streaming engines of Microsoft Fabric for a new telemetry platform: eventstreams, Spark structured streaming, and KQL in an eventhouse.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware compare les moteurs de diffusion en continu de Microsoft Fabric pour une nouvelle plateforme de télémétrie : les flux d'événements, le streaming structuré Spark et KQL dans un eventhouse.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Spark structured streaming processes the stream in micro-batches, and a trigger interval can be set to write fewer and larger files."
        fr: "Le streaming structuré Spark traite le flux en micro-lots, et un intervalle de déclencheur peut être défini pour écrire des fichiers moins nombreux et plus volumineux."
    - id: s2
      text:
        en: "An eventstream keeps the events it receives available for KQL queries even when it has no eventhouse destination."
        fr: "Un flux d'événements garde les événements qu'il reçoit disponibles pour des requêtes KQL même lorsqu'il n'a aucune destination eventhouse."
    - id: s3
      text:
        en: "The data of an eventhouse can be queried by using T-SQL in addition to KQL."
        fr: "Les données d'un eventhouse peuvent être interrogées avec T-SQL en plus de KQL."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      By default, Spark starts each micro-batch as soon as the previous one completes; a processing-time trigger batches the data into fewer, larger writes. An eventstream captures, transforms, and routes events, but the data becomes queryable only in a destination such as an eventhouse. Eventhouse data can be queried with KQL or T-SQL.
    fr: |
      Par défaut, Spark démarre chaque micro-lot dès que le précédent est terminé ; un déclencheur fondé sur la durée de traitement regroupe les données en écritures moins nombreuses et plus volumineuses. Un flux d'événements capture, transforme et route les événements, mais les données ne deviennent interrogeables que dans une destination comme un eventhouse. Les données d'un eventhouse peuvent être interrogées avec KQL ou T-SQL.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
  - title: What is Real-Time Intelligence in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
