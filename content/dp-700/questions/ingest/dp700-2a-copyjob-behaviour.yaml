id: dp700-2a-copyjob-behaviour
objective: "2.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You create a copy job named **CJ3** that copies tables from an Azure SQL database to a lakehouse. CJ3 uses incremental copy mode based on a watermark column and the default update method. CJ3 runs on a schedule.

    Which two statements about CJ3 are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un travail de copie nommé **CJ3** qui copie des tables d'une base de données Azure SQL vers un lakehouse. CJ3 utilise le mode copie incrémentielle basée sur une colonne de filigrane et la méthode de mise à jour par défaut. CJ3 s'exécute selon une planification.

    Quelles sont les deux affirmations vraies concernant CJ3 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The first run of CJ3 copies all the rows of the selected tables.", fr: "La première exécution de CJ3 copie toutes les lignes des tables sélectionnées." } }
    - { id: b, text: { en: "If a run of CJ3 fails, the next run starts from the end of the last successful run.", fr: "Si une exécution de CJ3 échoue, l'exécution suivante démarre à la fin de la dernière exécution réussie." } }
    - { id: c, text: { en: "When you select Run to start CJ3 manually, the job copies all the rows again.", fr: "Quand vous sélectionnez Run pour démarrer CJ3 manuellement, le travail copie de nouveau toutes les lignes." } }
    - { id: d, text: { en: "Rows deleted from the source tables are removed from the lakehouse tables.", fr: "Les lignes supprimées des tables sources sont retirées des tables du lakehouse." } }
    - { id: e, text: { en: "A changed source row replaces the existing row in the lakehouse table.", fr: "Une ligne source modifiée remplace la ligne existante dans la table du lakehouse." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: In incremental mode, the first run copies everything and later runs copy only new or changed rows. Copy job tracks the state of the last successful run, so a failed run doesn't move the starting point and no data is lost.
    fr: |
      En mode incrémentiel, la première exécution copie tout et les suivantes ne copient que les lignes nouvelles ou modifiées. Le travail de copie suit l'état de la dernière exécution réussie : une exécution en échec ne déplace pas le point de départ et aucune donnée n'est perdue.
  options:
    c: { en: "A manual run of an incremental job still transfers only the changes since the last run.", fr: "Une exécution manuelle d'un travail incrémentiel ne transfère toujours que les changements depuis la dernière exécution." }
    d: { en: "A watermark captures only inserts and updates; deletes require CDC-based copy.", fr: "Un filigrane ne capture que les insertions et les mises à jour ; les suppressions exigent une copie basée sur la CDC." }
    e: { en: "The default update method is Append: a changed row is added as a new row. Replacing it requires Merge.", fr: "La méthode de mise à jour par défaut est Append : une ligne modifiée est ajoutée comme nouvelle ligne. La remplacer exige Merge." }
references:
  - title: What is Copy job in Data Factory for Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
