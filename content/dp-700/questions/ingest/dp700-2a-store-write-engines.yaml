id: dp700-2a-store-write-engines
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are documenting how teams can write data to the items of a Fabric workspace, to help them choose a data store.

    Which native write method applies to each item? To answer, drag the appropriate methods to the correct items. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez la façon dont les équipes peuvent écrire des données dans les éléments d'un espace de travail Fabric, afin de les aider à choisir un magasin de données.

    Quelle méthode d'écriture native s'applique à chaque élément ? Pour répondre, faites glisser les méthodes appropriées vers les éléments correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: spark, text: { en: "Apache Spark notebooks (PySpark, Spark SQL)", fr: "Notebooks Apache Spark (PySpark, Spark SQL)" } }
    - { id: readonly, text: { en: "No table writes: T-SQL views, functions and SELECT queries only", fr: "Aucune écriture de table : vues, fonctions et requêtes SELECT T-SQL uniquement" } }
    - { id: tsql, text: { en: "T-SQL INSERT, UPDATE, DELETE and MERGE statements", fr: "Instructions T-SQL INSERT, UPDATE, DELETE et MERGE" } }
    - { id: kql, text: { en: "Eventstreams and KQL ingestion commands", fr: "Flux d'événements et commandes d'ingestion KQL" } }
    - { id: dax, text: { en: "DAX queries from a semantic model", fr: "Requêtes DAX depuis un modèle sémantique" } }
  targets:
    - id: lh
      text: { en: "Delta tables of a lakehouse", fr: "Tables Delta d'un lakehouse" }
    - id: ep
      text: { en: "SQL analytics endpoint of a lakehouse", fr: "Point de terminaison d'analytique SQL d'un lakehouse" }
    - id: wh
      text: { en: "Tables of a warehouse", fr: "Tables d'un entrepôt" }
    - id: kqldb
      text: { en: "Tables of a KQL database in an eventhouse", fr: "Tables d'une base de données KQL dans un eventhouse" }
answer:
  mapping: { lh: spark, ep: readonly, wh: tsql, kqldb: kql }
explanation:
  correct:
    en: |
      Lakehouse tables are written with Spark (and with pipelines or dataflows). The SQL analytics endpoint is a read-only T-SQL surface: you can create views, functions and stored procedures, but not insert, update or delete rows. A warehouse supports full T-SQL DML, including MERGE. Eventhouse tables receive data from eventstreams and KQL ingestion commands.
    fr: |
      Les tables d'un lakehouse sont écrites avec Spark (et avec des pipelines ou des dataflows). Le point de terminaison d'analytique SQL est une surface T-SQL en lecture seule : vous pouvez créer des vues, des fonctions et des procédures stockées, mais pas insérer, mettre à jour ni supprimer de lignes. Un entrepôt prend en charge tout le DML T-SQL, y compris MERGE. Les tables d'un eventhouse reçoivent des données de flux d'événements et de commandes d'ingestion KQL.
  options:
    dax: { en: "DAX queries a semantic model; it doesn't write to any of these items.", fr: "DAX interroge un modèle sémantique ; il n'écrit dans aucun de ces éléments." }
references:
  - title: What is the SQL analytics endpoint for a lakehouse?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
