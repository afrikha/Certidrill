id: dp700-2a-scd-handling
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **DW1** that contains a dimension table named **dbo.DimEmployee**. Fact tables reference employees by their surrogate key. You are designing how the nightly load processes four kinds of changes received from the HR system.

    How should the load handle each change? To answer, drag the appropriate actions to the correct changes. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **DW1** qui contient une table de dimension nommée **dbo.DimEmployee**. Les tables de faits référencent les employés par leur clé de substitution. Vous concevez la façon dont le chargement nocturne traite quatre types de changements reçus du système RH.

    Comment le chargement doit-il traiter chaque changement ? Pour répondre, faites glisser les actions appropriées vers les changements correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: type1, text: { en: "Update the attribute in the existing row", fr: "Mettre à jour l'attribut dans la ligne existante" } }
    - { id: type2, text: { en: "Expire the current row, and insert a new row with a new surrogate key", fr: "Expirer la ligne courante, puis insérer une nouvelle ligne avec une nouvelle clé de substitution" } }
    - { id: type3, text: { en: "Copy the current value to a previous-value column, and then update the attribute", fr: "Copier la valeur actuelle dans une colonne de valeur précédente, puis mettre à jour l'attribut" } }
    - { id: soft, text: { en: "Set the IsDeleted flag of the row", fr: "Définir l'indicateur IsDeleted de la ligne" } }
    - { id: hard, text: { en: "Delete the row from dbo.DimEmployee", fr: "Supprimer la ligne de dbo.DimEmployee" } }
  targets:
    - id: email
      text: { en: "An employee's misspelled email address is corrected; reports must show only the corrected value.", fr: "L'adresse e-mail mal orthographiée d'un employé est corrigée ; les rapports ne doivent afficher que la valeur corrigée." }
    - id: dept
      text: { en: "An employee moves to another department; sales must be reported by the department the employee belonged to on the date of each sale.", fr: "Un employé change de service ; les ventes doivent être présentées selon le service auquel l'employé appartenait à la date de chaque vente." }
    - id: region
      text: { en: "An employee's region changes; reports must show the current region and the previous region side by side, and no other history is needed.", fr: "La région d'un employé change ; les rapports doivent afficher côte à côte la région actuelle et la région précédente, sans autre historique." }
    - id: left
      text: { en: "An employee leaves the company and is removed from the HR system; past sales still reference the employee.", fr: "Un employé quitte l'entreprise et est retiré du système RH ; des ventes passées référencent toujours cet employé." }
answer:
  mapping: { email: type1, dept: type2, region: type3, left: soft }
explanation:
  correct:
    en: |
      A correction with no history is an SCD type 1 change: overwrite the attribute. Reporting by the value valid at the time of each fact is SCD type 2: expire the current version and insert a new version with its own surrogate key. A previous-value column with no further history is SCD type 3. A member removed at the source but referenced by facts is soft deleted with a flag such as IsDeleted.
    fr: |
      Une correction sans historique est un changement SCD de type 1 : on remplace l'attribut. Présenter les faits selon la valeur valide à leur date relève du SCD de type 2 : on expire la version courante et on insère une nouvelle version avec sa propre clé de substitution. Une colonne de valeur précédente sans autre historique correspond au SCD de type 3. Un membre retiré de la source mais référencé par des faits fait l'objet d'une suppression réversible avec un indicateur comme IsDeleted.
  options:
    hard: { en: "Dimension members that have related facts must not be physically deleted; Learn recommends a soft delete.", fr: "Un membre de dimension qui a des faits associés ne doit pas être supprimé physiquement ; Learn recommande une suppression réversible." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
