id: dp700-2b-transform-kql-statements
objective: "2.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named KQL-Logs. You transform data in KQL-Logs by using ingest-from-query commands and update policies.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée KQL-Logs. Vous transformez les données de KQL-Logs avec des commandes d'ingestion à partir d'une requête et des stratégies de mise à jour.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the target table doesn't exist, the .append command creates it.
        fr: Si la table cible n'existe pas, la commande .append la crée.
    - id: s2
      text:
        en: When .set-or-append adds rows to an existing table, the columns of the query are matched to the table columns by type and position, not by name.
        fr: Quand .set-or-append ajoute des lignes à une table existante, les colonnes de la requête sont associées aux colonnes de la table par type et par position, pas par nom.
    - id: s3
      text:
        en: The target table of an update policy must have the same schema as its source table.
        fr: La table cible d'une stratégie de mise à jour doit avoir le même schéma que sa table source.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      .append fails when the table doesn't exist; .set-or-append or .set create it. Ingest-from-query commands match columns by type, not by name, so the query must return its columns in the order of the table. An update policy's query output must match the target schema, but the target can have a different schema, retention and other policies than the source.
    fr: |
      .append échoue quand la table n'existe pas ; .set-or-append ou .set la créent. Les commandes d'ingestion à partir d'une requête associent les colonnes par type, pas par nom : la requête doit renvoyer ses colonnes dans l'ordre de la table. La sortie de la requête d'une stratégie de mise à jour doit correspondre au schéma de la cible, mais la cible peut avoir un schéma, une rétention et d'autres stratégies différents de ceux de la source.
references:
  - title: Ingest from query (.set, .append, .set-or-append, .set-or-replace)
    url: https://learn.microsoft.com/en-us/kusto/management/data-ingestion/ingest-from-query?view=microsoft-fabric
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
