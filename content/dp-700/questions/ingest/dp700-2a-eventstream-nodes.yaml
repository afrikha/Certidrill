id: dp700-2a-eventstream-nodes
objective: "2.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have an eventstream named **ES4** that receives events from an Azure IoT Hub source. ES4 has the destinations shown in the following table.

    Answer each prompt by selecting the appropriate destination.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un flux d'événements nommé **ES4** qui reçoit des événements d'une source Azure IoT Hub. ES4 comporte les destinations figurant dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la destination appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which destination has no toggle to pause and resume it?", fr: "Quelle destination n'a pas de bouton bascule pour la suspendre et la reprendre ?" }
    - id: p2
      text: { en: "Which destination offers Optimize table in notebook in its Details pane in Live view?", fr: "Quelle destination propose Optimize table in notebook dans son volet Details en mode Live ?" }
  grid:
    caption: { en: "Destinations of ES4", fr: "Destinations d'ES4" }
    header: [{ en: Destination, fr: Destination }, Type, { en: Ingestion mode, fr: Mode d'ingestion }, { en: Connected to, fr: Connectée à }]
    rows:
      - [{ text: Dest1, area: d1 }, { text: Eventhouse }, { text: Direct ingestion }, { text: { en: Default stream, fr: Flux par défaut } }]
      - [{ text: Dest2, area: d2 }, { text: Eventhouse }, { text: Event processing before ingestion }, { text: { en: Filter operator, fr: Opérateur Filter } }]
      - [{ text: Dest3, area: d3 }, { text: Lakehouse }, { text: "-" }, { text: { en: Manage fields operator, fr: Opérateur Manage fields } }]
      - [{ text: Dest4, area: d4 }, { text: { en: Derived stream, fr: Flux dérivé } }, { text: "-" }, { text: { en: Filter operator, fr: Opérateur Filter } }]
answer:
  values: { p1: d1, p2: d3 }
explanation:
  correct:
    en: |
      An Eventhouse destination that uses Direct ingestion doesn't support pause and resume, so its node has no toggle; Event processing before ingestion, Lakehouse and derived stream nodes can be paused and resumed from the last stop, now or a custom time. A Lakehouse destination writes small streaming files, and its Details pane in Live view offers Optimize table in notebook, which runs a Spark job that compacts them.
    fr: |
      Une destination Eventhouse qui utilise Direct ingestion ne prend pas en charge la pause et la reprise : son nœud n'a pas de bouton bascule ; les nœuds Event processing before ingestion, Lakehouse et flux dérivé peuvent être suspendus puis repris depuis le dernier arrêt, maintenant ou à une heure personnalisée. Une destination Lakehouse écrit de petits fichiers de streaming, et son volet Details en mode Live propose Optimize table in notebook, qui exécute un travail Spark de compactage.
references:
  - title: Pause and resume data streams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/pause-resume-data-streams
  - title: Add a lakehouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-lakehouse
