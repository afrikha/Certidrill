id: dp700-2a-store-gold-layer
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that contains two lakehouses named **LH_Bronze** and **LH_Silver**. Data engineers load both layers by using PySpark notebooks.

    You need to design the gold layer. The solution must meet the following requirements:

    - SQL developers must maintain the gold star schema by using T-SQL stored procedures that run UPDATE and MERGE statements in multi-table transactions.
    - Data scientists must read the gold tables from Spark notebooks in their own lakehouse.
    - The gold data must not be copied to another item.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui contient deux lakehouses nommés **LH_Bronze** et **LH_Silver**. Les ingénieurs données chargent ces deux couches avec des notebooks PySpark.

    Vous devez concevoir la couche or. La solution doit satisfaire les exigences suivantes :

    - Les développeurs SQL doivent maintenir le schéma en étoile de la couche or avec des procédures stockées T-SQL qui exécutent des instructions UPDATE et MERGE dans des transactions multitables.
    - Les scientifiques des données doivent lire les tables or depuis des notebooks Spark dans leur propre lakehouse.
    - Les données or ne doivent pas être copiées dans un autre élément.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a lakehouse named LH_Gold, and create the stored procedures in its SQL analytics endpoint.", fr: "Créer un lakehouse nommé LH_Gold, et créer les procédures stockées dans son point de terminaison d'analytique SQL." } }
    - { id: b, text: { en: "Create a warehouse named WH_Gold in WS1, and create the gold tables and stored procedures in it.", fr: "Créer un entrepôt nommé WH_Gold dans WS1, et y créer les tables or et les procédures stockées." } }
    - { id: c, text: { en: "Copy the gold tables to the data scientists' lakehouse every night by using a pipeline Copy activity.", fr: "Copier chaque nuit les tables or dans le lakehouse des scientifiques des données avec une activité Copy de pipeline." } }
    - { id: d, text: { en: "In the data scientists' lakehouse, create OneLake shortcuts to the gold tables.", fr: "Dans le lakehouse des scientifiques des données, créer des raccourcis OneLake vers les tables or." } }
    - { id: e, text: { en: "Create an eventhouse for the gold tables, and turn on OneLake availability.", fr: "Créer un eventhouse pour les tables or, et activer la disponibilité OneLake." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      A warehouse supports T-SQL DML, including UPDATE and MERGE, and multi-table transactions, which a lakehouse SQL analytics endpoint doesn't. Warehouse tables are stored in OneLake in Delta format, so a shortcut in the data scientists' lakehouse lets Spark read them in place, without a copy.
    fr: |
      Un entrepôt prend en charge le DML T-SQL, y compris UPDATE et MERGE, ainsi que les transactions multitables, ce que ne permet pas le point de terminaison d'analytique SQL d'un lakehouse. Les tables d'entrepôt sont stockées dans OneLake au format Delta : un raccourci dans le lakehouse des scientifiques des données permet à Spark de les lire sur place, sans copie.
  options:
    a: { en: "The SQL analytics endpoint is read-only: procedures created there can't run UPDATE or MERGE on the tables.", fr: "Le point de terminaison d'analytique SQL est en lecture seule : les procédures qui y sont créées ne peuvent pas exécuter UPDATE ou MERGE sur les tables." }
    c: { en: "A nightly copy duplicates the gold data, which the requirements forbid.", fr: "Une copie nocturne duplique les données or, ce que les exigences interdisent." }
    e: { en: "An eventhouse targets streaming data queried with KQL; it doesn't support T-SQL stored procedures with multi-table transactions.", fr: "Un eventhouse cible les données de diffusion en continu interrogées en KQL ; il ne prend pas en charge les procédures stockées T-SQL avec transactions multitables." }
references:
  - title: Transactions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/transactions
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
