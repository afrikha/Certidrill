id: dp700-cs4a-billing-mirroring
objective: "2.2.4"
type: multi
caseStudy: dp700-cs4a-city-power
difficulty: 2
status: draft
stem:
  en: |
    You need to prepare BillingDB and sql-cpl-billing to meet the requirement for the billing data.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez préparer BillingDB et sql-cpl-billing pour satisfaire l'exigence relative aux données de facturation.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable change data capture (CDC) on BillingDB.", fr: "Activer la capture des changements de données (CDC) sur BillingDB." } }
    - { id: b, text: { en: "Turn on the system-assigned managed identity of sql-cpl-billing.", fr: "Activer l'identité managée affectée par le système de sql-cpl-billing." } }
    - { id: c, text: { en: "Add a primary key to each of the twelve legacy tables.", fr: "Ajouter une clé primaire à chacune des douze tables héritées." } }
    - { id: d, text: { en: "Install an on-premises data gateway that can reach sql-cpl-billing.", fr: "Installer une passerelle de données locale qui peut atteindre sql-cpl-billing." } }
    - { id: e, text: { en: "Create a database user for Fabric that has the mirroring permissions, such as ALTER ANY EXTERNAL MIRROR.", fr: "Créer pour Fabric un utilisateur de base de données qui dispose des autorisations de mise en miroir, comme ALTER ANY EXTERNAL MIRROR." } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      Mirroring an Azure SQL database requires a system-assigned or user-assigned managed identity that is the primary identity of the logical server, because the server publishes the changes to OneLake with it. The connection used by Fabric needs a database user granted SELECT, ALTER ANY EXTERNAL MIRROR, VIEW DATABASE PERFORMANCE STATE and VIEW DATABASE SECURITY STATE. Mirroring then replicates the tables in near real time without any copy pipeline.
    fr: |
      La mise en miroir d'une base de données Azure SQL exige une identité managée affectée par le système ou par l'utilisateur, définie comme identité principale du serveur logique, car le serveur publie les modifications dans OneLake avec elle. La connexion utilisée par Fabric a besoin d'un utilisateur de base de données qui dispose de SELECT, ALTER ANY EXTERNAL MIRROR, VIEW DATABASE PERFORMANCE STATE et VIEW DATABASE SECURITY STATE. La mise en miroir réplique ensuite les tables en quasi temps réel sans pipeline de copie.
  options:
    a:
      en: |
        Mirroring does not use CDC. A database with CDC enabled cannot be mirrored, so enabling it would block the solution.
      fr: |
        La mise en miroir n'utilise pas CDC. Une base de données sur laquelle CDC est activée ne peut pas être mise en miroir : l'activer bloquerait la solution.
    c:
      en: |
        Since April 2025, a table can be mirrored even if it has no primary key, so the legacy tables do not need to change.
      fr: |
        Depuis avril 2025, une table peut être mise en miroir même si elle n'a pas de clé primaire : les tables héritées n'ont pas besoin d'être modifiées.
    d:
      en: |
        A data gateway is needed only when the database is not publicly accessible and does not allow Azure services. sql-cpl-billing allows both.
      fr: |
        Une passerelle de données n'est nécessaire que si la base de données n'est pas accessible publiquement et n'autorise pas les services Azure. sql-cpl-billing autorise les deux.
references:
  - title: "Tutorial: Configure Microsoft Fabric mirrored databases from Azure SQL Database"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-tutorial
  - title: Limitations in Microsoft Fabric mirrored databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-limitations
