id: dp700-2a-identity-key
objective: "2.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are creating a dimension table named **dbo.DimStore** in a warehouse named **DW1**. The surrogate key StoreKey must be generated automatically by Fabric Data Warehouse when rows are inserted. StoreCode is the business key of the source system.

    How should you complete the T-SQL statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une table de dimension nommée **dbo.DimStore** dans un entrepôt nommé **DW1**. La clé de substitution StoreKey doit être générée automatiquement par Fabric Data Warehouse à l'insertion des lignes. StoreCode est la clé métier du système source.

    Comment devez-vous compléter l'instruction T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE dbo.DimStore
    (
        StoreKey [[type]] [[gen]],
        StoreCode varchar(10) NOT NULL,
        StoreName varchar(100) NOT NULL,
        City varchar(50) NOT NULL
    );
  slots:
    - id: type
      options:
        - { id: int, text: INT }
        - { id: bigint, text: BIGINT }
        - { id: smallint, text: SMALLINT }
        - { id: guid, text: UNIQUEIDENTIFIER }
    - id: gen
      options:
        - { id: identity, text: IDENTITY }
        - { id: identity11, text: "IDENTITY(1,1)" }
        - { id: newid, text: "DEFAULT NEWID()" }
answer:
  values: { type: bigint, gen: identity }
explanation:
  correct:
    en: |
      In Fabric Data Warehouse, an IDENTITY column must be of type bigint; any other type returns an error. You can't specify a seed or an increment: the system manages the values, which are unique and positive but not guaranteed to be sequential.
    fr: |
      Dans Fabric Data Warehouse, une colonne IDENTITY doit être de type bigint ; tout autre type renvoie une erreur. Vous ne pouvez pas spécifier de valeur de départ ni d'incrément : le système gère les valeurs, uniques et positives mais sans garantie d'ordre séquentiel.
  options:
    int: { en: "IDENTITY supports only bigint in Fabric Data Warehouse.", fr: "IDENTITY ne prend en charge que bigint dans Fabric Data Warehouse." }
    smallint: { en: "IDENTITY supports only bigint in Fabric Data Warehouse.", fr: "IDENTITY ne prend en charge que bigint dans Fabric Data Warehouse." }
    guid: { en: "A GUID isn't an integer surrogate key; Learn recommends the smallest practical integer type and IDENTITY.", fr: "Un GUID n'est pas une clé de substitution entière ; Learn recommande le plus petit type entier pratique et IDENTITY." }
    identity11: { en: "A custom seed and increment can't be specified in Fabric Data Warehouse.", fr: "Une valeur de départ et un incrément personnalisés ne peuvent pas être spécifiés dans Fabric Data Warehouse." }
    newid: { en: "NEWID() generates GUIDs, not bigint surrogate keys.", fr: "NEWID() génère des GUID, pas des clés de substitution bigint." }
references:
  - title: IDENTITY columns in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/identity
