id: dp700-2b-pipeline-overwrite
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a pipeline that runs every night. A Copy data activity reads a full extract of the dbo.Products table of an Azure SQL database and writes it to a Delta table named products in the Tables folder of a lakehouse named LH-Ref.

    Products that are deleted in the source must disappear from the products table after the next run. Data engineers must still be able to query the state of the table before each run by using Delta time travel.

    How should you configure the Table action of the destination?
  fr: |
    Vous disposez d'un pipeline qui s'exécute chaque nuit. Une activité Copy data lit un extrait complet de la table dbo.Products d'une base de données Azure SQL et l'écrit dans une table Delta nommée products dans le dossier Tables d'un lakehouse nommé LH-Ref.

    Les produits supprimés dans la source doivent disparaître de la table products après l'exécution suivante. Les ingénieurs Données doivent toujours pouvoir interroger l'état de la table avant chaque exécution avec le voyage dans le temps Delta.

    Comment devez-vous configurer l'action de table (Table action) de la destination ?
body:
  options:
    - id: a
      text:
        en: "Append, with partitioning enabled on the ModifiedDate column"
        fr: "Append, avec le partitionnement activé sur la colonne ModifiedDate"
    - id: b
      text:
        en: "Upsert, with ProductID as the key column"
        fr: "Upsert, avec ProductID comme colonne clé"
    - id: c
      text:
        en: "Append, without partitioning"
        fr: "Append, sans partitionnement"
    - id: d
      text:
        en: "Overwrite, with the default settings"
        fr: "Overwrite, avec les paramètres par défaut"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Overwrite replaces the existing data of the table with the new full extract, so products deleted in the source are gone after the run. The previous versions stay in the Delta log and can still be read through time travel.
    fr: |
      Overwrite remplace les données existantes de la table par le nouvel extrait complet : les produits supprimés dans la source ont disparu après l'exécution. Les versions précédentes restent dans le journal Delta et restent lisibles par le voyage dans le temps.
  options:
    a:
      en: |
        Append adds every row of the full extract again, which duplicates the products and keeps the deleted ones; partitioning doesn't change that.
      fr: |
        Append ajoute à nouveau chaque ligne de l'extrait complet, ce qui duplique les produits et conserve ceux qui ont été supprimés ; le partitionnement n'y change rien.
    b:
      en: |
        Upsert inserts new rows and updates existing ones by key, but it never removes the rows that are missing from the source.
      fr: |
        Upsert insère les nouvelles lignes et met à jour les lignes existantes par clé, mais ne supprime jamais les lignes absentes de la source.
    c:
      en: |
        Append duplicates the products at each run and keeps the products deleted in the source.
      fr: |
        Append duplique les produits à chaque exécution et conserve les produits supprimés dans la source.
references:
  - title: Configure lakehouse in a copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/connector-lakehouse-copy-activity
