id: dp700-2c-kafka-endpoint
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has an ordering application that publishes events by using an Apache Kafka producer client. The application currently sends the events to an on-premises Kafka cluster that will be decommissioned next month.

    You need to receive the events in Fabric and route them to an eventhouse. The application team can change only the connection settings of the application, not its code. The solution must not use any Azure resource outside Fabric.

    What should you use?
  fr: |
    Tailspin Toys dispose d'une application de commande qui publie des événements avec un client producteur Apache Kafka. L'application envoie actuellement les événements à un cluster Kafka local qui sera mis hors service le mois prochain.

    Vous devez recevoir les événements dans Fabric et les router vers un eventhouse. L'équipe de l'application ne peut modifier que les paramètres de connexion de l'application, pas son code. La solution ne doit utiliser aucune ressource Azure en dehors de Fabric.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "An eventstream with an Apache Kafka source that connects to the on-premises Kafka cluster"
        fr: "Un flux d'événements avec une source Apache Kafka qui se connecte au cluster Kafka local"
    - id: b
      text:
        en: "A Get data from Azure Event Hubs connection in the eventhouse"
        fr: "Une connexion Obtenir des données depuis Azure Event Hubs dans l'eventhouse"
    - id: c
      text:
        en: "An eventstream with a custom endpoint source, whose Kafka connection settings are configured in the application"
        fr: "Un flux d'événements avec une source de point de terminaison personnalisé, dont les paramètres de connexion Kafka sont configurés dans l'application"
    - id: d
      text:
        en: "A Spark structured streaming job that reads the topic of the on-premises Kafka cluster"
        fr: "Un travail de streaming structuré Spark qui lit la rubrique du cluster Kafka local"
answer: { optionId: c }
explanation:
  correct:
    en: |
      The custom endpoint source of an eventstream exposes an endpoint that applications using the Kafka protocol can reach by updating their connection settings, because eventstreams use Azure Event Hubs under the hood. The eventstream then routes the events to the eventhouse.
    fr: |
      La source de point de terminaison personnalisé d'un flux d'événements expose un point de terminaison que les applications utilisant le protocole Kafka peuvent joindre en mettant à jour leurs paramètres de connexion, car les flux d'événements utilisent Azure Event Hubs en interne. Le flux d'événements route ensuite les événements vers l'eventhouse.
  options:
    a:
      en: |
        The Apache Kafka source reads from an existing Kafka cluster, and this cluster is being decommissioned.
      fr: |
        La source Apache Kafka lit un cluster Kafka existant, et ce cluster va être mis hors service.
    d:
      en: |
        A Spark job reading the on-premises cluster also depends on the cluster that is being decommissioned, and it requires code.
      fr: |
        Un travail Spark qui lit le cluster local dépend lui aussi du cluster qui va être mis hors service, et il nécessite du code.
    b:
      en: |
        An Event Hubs data connection needs an Azure Event Hubs instance, which is an Azure resource outside Fabric.
      fr: |
        Une connexion de données Event Hubs nécessite une instance Azure Event Hubs, qui est une ressource Azure en dehors de Fabric.
references:
  - title: Microsoft Fabric Eventstreams Overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/overview
