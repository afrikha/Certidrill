id: dp700-2c-accelerate-dashboard
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a lakehouse named LH_Orders that contains a Delta table named orders. A Spark job appends new orders to the table every few minutes. You also have an eventhouse named EH_Ops that contains a KQL database named OpsDB.

    A Real-Time Dashboard queries the orders of the last 30 days every minute and joins them with telemetry stored in OpsDB. Query performance must be comparable to data ingested into OpsDB. You must not build or maintain an ingestion process for orders.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse nommé LH_Orders qui contient une table Delta nommée orders. Un travail Spark ajoute de nouvelles commandes à la table toutes les quelques minutes. Vous disposez aussi d'un eventhouse nommé EH_Ops qui contient une base de données KQL nommée OpsDB.

    Un tableau de bord en temps réel interroge chaque minute les commandes des 30 derniers jours et les joint à la télémétrie stockée dans OpsDB. Les performances des requêtes doivent être comparables à celles de données ingérées dans OpsDB. Vous ne devez ni créer ni maintenir de processus d'ingestion pour les commandes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Create a OneLake shortcut to orders in OpsDB, and create a materialized view over the shortcut."
        fr: "Créer un raccourci OneLake vers orders dans OpsDB, et créer une vue matérialisée sur le raccourci."
    - id: b
      text:
        en: "Create a OneLake shortcut to orders in OpsDB without query acceleration, and set the caching policy of OpsDB to 30 days."
        fr: "Créer un raccourci OneLake vers orders dans OpsDB sans accélération des requêtes, et définir la stratégie de mise en cache d'OpsDB sur 30 jours."
    - id: c
      text:
        en: "Create a OneLake shortcut to orders in OpsDB, set **Accelerate** to **On**, and set a caching period of 30 days."
        fr: "Créer un raccourci OneLake vers orders dans OpsDB, définir **Accelerate** sur **On** et définir une période de mise en cache de 30 jours."
    - id: d
      text:
        en: "Create a pipeline that copies the new orders into a native table of OpsDB every minute."
        fr: "Créer un pipeline qui copie chaque minute les nouvelles commandes dans une table native d'OpsDB."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Query acceleration indexes and caches the shortcut's Delta data as it lands in OneLake, which gives performance comparable to ingested data without any ingestion pipeline to manage. The caching period limits acceleration to the files modified during the last 30 days, which is the range the dashboard queries.
    fr: |
      L'accélération des requêtes indexe et met en cache les données Delta du raccourci à mesure qu'elles arrivent dans OneLake, ce qui offre des performances comparables à celles de données ingérées, sans pipeline d'ingestion à gérer. La période de mise en cache limite l'accélération aux fichiers modifiés au cours des 30 derniers jours, la plage interrogée par le tableau de bord.
  options:
    b:
      en: |
        The database caching policy applies to data stored in the eventhouse; a standard shortcut still reads the files from OneLake without indexes at each query.
      fr: |
        La stratégie de mise en cache de la base de données s'applique aux données stockées dans l'eventhouse ; un raccourci standard lit toujours les fichiers dans OneLake sans index à chaque requête.
    d:
      en: |
        A pipeline that copies the orders is the ingestion process that you must not build or maintain.
      fr: |
        Un pipeline qui copie les commandes est le processus d'ingestion que vous ne devez ni créer ni maintenir.
    a:
      en: |
        Materialized views aren't supported over shortcuts, whether they are accelerated or not.
      fr: |
        Les vues matérialisées ne sont pas prises en charge sur des raccourcis, qu'ils soient accélérés ou non.
references:
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
