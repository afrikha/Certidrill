id: dp700-2b-mirror-dacpac
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have an Azure SQL database named sqldb-inventory that is mirrored into a Fabric workspace. Schema changes to sqldb-inventory are deployed by a release pipeline that publishes a .dacpac file from a SQL database project by using SqlPackage.

    Since mirroring was enabled, the deployments complete but don't apply the changes to the mirrored tables, such as a new column in dbo.StockLevels.

    You need the deployments to alter the mirrored tables. Mirroring must keep running for the tables that the deployment doesn't change.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée sqldb-inventory mise en miroir dans un espace de travail Fabric. Les changements de schéma de sqldb-inventory sont déployés par un pipeline de mise en production qui publie un fichier .dacpac issu d'un projet de base de données SQL avec SqlPackage.

    Depuis l'activation de la mise en miroir, les déploiements se terminent mais n'appliquent pas les changements aux tables mises en miroir, comme une nouvelle colonne dans dbo.StockLevels.

    Les déploiements doivent modifier les tables mises en miroir. La mise en miroir doit continuer de fonctionner pour les tables que le déploiement ne modifie pas.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Stop mirroring before each deployment, and then start mirroring again after the deployment."
        fr: "Arrêter la mise en miroir avant chaque déploiement, puis la redémarrer après le déploiement."
    - id: b
      text:
        en: "Add the /p:DoNotAlterReplicatedObjects=False property to the SqlPackage publish action."
        fr: "Ajouter la propriété /p:DoNotAlterReplicatedObjects=False à l'action de publication SqlPackage."
    - id: c
      text:
        en: "Grant ALTER ANY EXTERNAL MIRROR to the identity that runs the release pipeline."
        fr: "Accorder ALTER ANY EXTERNAL MIRROR à l'identité qui exécute le pipeline de mise en production."
    - id: d
      text:
        en: "Add the /p:BlockOnPossibleDataLoss=False property to the SqlPackage publish action."
        fr: "Ajouter la propriété /p:BlockOnPossibleDataLoss=False à l'action de publication SqlPackage."
answer: { optionId: b }
explanation:
  correct:
    en: |
      By default, a .dacpac deployment doesn't alter replicated objects; mirrored tables need /p:DoNotAlterReplicatedObjects=False so that SqlPackage modifies them. After a supported DDL change, mirroring restarts a complete snapshot of the changed table only, so the other tables keep replicating.
    fr: |
      Par défaut, un déploiement .dacpac ne modifie pas les objets répliqués ; les tables mises en miroir nécessitent /p:DoNotAlterReplicatedObjects=False pour que SqlPackage les modifie. Après un changement DDL pris en charge, la mise en miroir redémarre un instantané complet de la seule table modifiée : les autres tables continuent d'être répliquées.
  options:
    a:
      en: |
        Stopping mirroring disables it completely, and starting it again reseeds every table, which interrupts the tables that don't change.
      fr: |
        Arrêter la mise en miroir la désactive complètement, et la redémarrer réamorce toutes les tables, ce qui interrompt les tables qui ne changent pas.
    c:
      en: |
        ALTER ANY EXTERNAL MIRROR is the permission of the principal that Fabric uses to mirror; it doesn't change how SqlPackage treats replicated objects.
      fr: |
        ALTER ANY EXTERNAL MIRROR est l'autorisation du principal utilisé par Fabric pour la mise en miroir ; elle ne change pas la façon dont SqlPackage traite les objets répliqués.
    d:
      en: |
        BlockOnPossibleDataLoss controls whether a deployment stops when data could be lost; it doesn't make SqlPackage alter replicated objects.
      fr: |
        BlockOnPossibleDataLoss détermine si un déploiement s'arrête quand des données risquent d'être perdues ; il ne fait pas modifier les objets répliqués par SqlPackage.
references:
  - title: Limitations in Microsoft Fabric mirrored databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-limitations
