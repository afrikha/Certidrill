id: dp700-2b-shortcut-create-steps
objective: "2.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH-Logs. An Azure Data Lake Storage Gen2 account named stwingtiplogs has the hierarchical namespace enabled and is reachable from Fabric. It contains a folder named weblogs.

    You need to make the files of the weblogs folder available in the Files folder of LH-Logs without copying them.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH-Logs. Un compte Azure Data Lake Storage Gen2 nommé stwingtiplogs a l'espace de noms hiérarchique activé et est accessible depuis Fabric. Il contient un dossier nommé weblogs.

    Vous devez rendre les fichiers du dossier weblogs disponibles dans le dossier Files de LH-Logs sans les copier.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: open, text: { en: "In LH-Logs, open the context menu of the Files folder and select New shortcut.", fr: "Dans LH-Logs, ouvrir le menu contextuel du dossier Files et sélectionner Nouveau raccourci." } }
    - { id: source, text: { en: "Under External sources, select Azure Data Lake Storage Gen2.", fr: "Sous Sources externes, sélectionner Azure Data Lake Storage Gen2." } }
    - { id: conn, text: { en: "Enter the DFS URL of stwingtiplogs and create a connection with an authentication kind.", fr: "Saisir l'URL DFS de stwingtiplogs et créer une connexion avec un type d'authentification." } }
    - { id: target, text: { en: "Browse to the weblogs folder, select it, and then select Create.", fr: "Accéder au dossier weblogs, le sélectionner, puis sélectionner Créer." } }
    - { id: gateway, text: { en: "Install an on-premises data gateway and register it in Fabric.", fr: "Installer une passerelle de données locale et l'inscrire dans Fabric." } }
    - { id: accel, text: { en: "Turn on query acceleration for the Files folder of LH-Logs.", fr: "Activer l'accélération des requêtes pour le dossier Files de LH-Logs." } }
answer:
  sequence: [ open, source, conn, target ]
explanation:
  correct:
    en: |
      A shortcut is created from the lakehouse: select New shortcut on the folder, pick Azure Data Lake Storage Gen2 under the external sources, provide the DFS endpoint URL and a connection that holds the credentials, then select the target folder and create the shortcut. The files are then read in place.
    fr: |
      Un raccourci se crée depuis le lakehouse : sélectionnez Nouveau raccourci sur le dossier, choisissez Azure Data Lake Storage Gen2 parmi les sources externes, indiquez l'URL du point de terminaison DFS et une connexion qui détient les informations d'identification, puis sélectionnez le dossier cible et créez le raccourci. Les fichiers sont ensuite lus sur place.
  options:
    gateway: { en: "The storage account is reachable from Fabric, so no gateway is needed.", fr: "Le compte de stockage est accessible depuis Fabric : aucune passerelle n'est nécessaire." }
    accel: { en: "Query acceleration is an option of shortcuts in a KQL database, not of lakehouse folders.", fr: "L'accélération des requêtes est une option des raccourcis d'une base de données KQL, pas des dossiers d'un lakehouse." }
references:
  - title: Create an Azure Data Lake Storage Gen2 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-adls-shortcut
