id: dp700-2b-transform-pyspark-todate
objective: "2.2.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    In a Fabric notebook, you have a PySpark DataFrame named orders that has the columns OrderID, OrderTs and Amount. OrderTs is a string in the format yyyy-MM-dd HH:mm:ss. The notebook imports `pyspark.sql.functions as F`.

    You need a DataFrame that keeps all the columns of orders and adds a column named OrderDate of the date type.

    Which two expressions should you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans un notebook Fabric, vous disposez d'un DataFrame PySpark nommé orders qui possède les colonnes OrderID, OrderTs et Amount. OrderTs est une chaîne au format yyyy-MM-dd HH:mm:ss. Le notebook importe `pyspark.sql.functions as F`.

    Vous avez besoin d'un DataFrame qui conserve toutes les colonnes d'orders et ajoute une colonne nommée OrderDate de type date.

    Quelles sont les deux expressions à utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: 'orders.withColumn("OrderDate", F.to_date("OrderTs"))' }
    - { id: b, text: 'orders.withColumnRenamed("OrderTs", "OrderDate")' }
    - { id: c, text: 'orders.select(F.to_date("OrderTs").alias("OrderDate"))' }
    - { id: d, text: 'orders.select("*", F.to_date("OrderTs").alias("OrderDate"))' }
    - { id: e, text: 'orders.withColumn("OrderDate", F.col("OrderTs").alias("date"))' }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      withColumn() returns the DataFrame with a new column, and to_date() converts the string to the date type. select("*", ...) keeps every existing column and adds the converted column under the alias OrderDate, which gives the same result.
    fr: |
      withColumn() renvoie le DataFrame avec une nouvelle colonne, et to_date() convertit la chaîne en type date. select("*", ...) conserve toutes les colonnes existantes et ajoute la colonne convertie sous l'alias OrderDate, ce qui donne le même résultat.
  options:
    b: { en: "withColumnRenamed() only renames OrderTs; the column stays a string and OrderTs disappears.", fr: "withColumnRenamed() ne fait que renommer OrderTs ; la colonne reste une chaîne et OrderTs disparaît." }
    c: { en: "This select() returns only the OrderDate column and drops the other columns.", fr: "Ce select() ne renvoie que la colonne OrderDate et supprime les autres colonnes." }
    e: { en: "alias() only names the expression; the new column is still a string copy of OrderTs.", fr: "alias() ne fait que nommer l'expression ; la nouvelle colonne reste une copie de type chaîne d'OrderTs." }
references:
  - title: "Lakehouse tutorial: Prepare and transform data in the lakehouse"
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/tutorial-lakehouse-data-preparation
