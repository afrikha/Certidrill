id: dp700-2c-shortcut-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named RetailDB that contains a OneLake shortcut named customers. The shortcut points to a Delta table in a lakehouse named LH_CRM. A notebook updates the Delta table every hour. The table has a column named Address of the Delta type struct.

    The shortcut doesn't use query acceleration.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée RetailDB qui contient un raccourci OneLake nommé customers. Le raccourci pointe vers une table Delta d'un lakehouse nommé LH_CRM. Un notebook met à jour la table Delta toutes les heures. La table comporte une colonne nommée Address de type Delta struct.

    Le raccourci n'utilise pas l'accélération des requêtes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The rows of the customers table are stored only in LH_CRM; RetailDB doesn't keep a copy of them."
        fr: "Les lignes de la table customers ne sont stockées que dans LH_CRM ; RetailDB n'en conserve pas de copie."
    - id: s2
      text:
        en: "A query on external_table('customers') returns the rows written by the notebook's latest completed update."
        fr: "Une requête sur external_table('customers') renvoie les lignes écrites par la dernière mise à jour terminée du notebook."
    - id: s3
      text:
        en: "In KQL queries, the Address column has the string type."
        fr: "Dans les requêtes KQL, la colonne Address est de type string."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A shortcut references the data in place, so nothing is copied into the eventhouse and each query reads what the Delta table contains at that moment. Delta struct, array, and map columns are mapped to the KQL dynamic type, so Address is dynamic and its fields are accessed with dot notation, for example Address.City.
    fr: |
      Un raccourci référence les données sur place : rien n'est copié dans l'eventhouse, et chaque requête lit ce que contient la table Delta à ce moment-là. Les colonnes Delta struct, array et map sont mappées vers le type KQL dynamic : Address est de type dynamic et ses champs s'atteignent avec la notation pointée, par exemple Address.City.
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
