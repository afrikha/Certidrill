id: dp700-2c-reference-shortcut
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains an eventhouse named EH_Plant and a lakehouse named LH_Master. LH_Master contains a Delta table named dim_product that has 20,000 rows and is rewritten every night by a notebook.

    Analysts join the telemetry stored in EH_Plant with dim_product a few times a week by using KQL. You must not create a second copy of dim_product or an ingestion process.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un eventhouse nommé EH_Plant et un lakehouse nommé LH_Master. LH_Master contient une table Delta nommée dim_product qui comporte 20 000 lignes et qui est réécrite chaque nuit par un notebook.

    Les analystes joignent quelques fois par semaine la télémétrie stockée dans EH_Plant à dim_product en utilisant KQL. Vous ne devez créer ni seconde copie de dim_product ni processus d'ingestion.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Create a pipeline that copies dim_product every night into a native table of the KQL database."
        fr: "Créer un pipeline qui copie chaque nuit dim_product dans une table native de la base de données KQL."
    - id: b
      text:
        en: "Create a Dataflow Gen2 that loads dim_product every night into a native table of the KQL database."
        fr: "Créer un Dataflow Gen2 qui charge chaque nuit dim_product dans une table native de la base de données KQL."
    - id: c
      text:
        en: "Enable OneLake availability on the KQL database of EH_Plant."
        fr: "Activer la disponibilité OneLake sur la base de données KQL d'EH_Plant."
    - id: d
      text:
        en: "In the KQL database of EH_Plant, create a OneLake shortcut to dim_product, and query it by using external_table()."
        fr: "Dans la base de données KQL d'EH_Plant, créer un raccourci OneLake vers dim_product, et l'interroger avec external_table()."
answer: { optionId: d }
explanation:
  correct:
    en: |
      A OneLake shortcut in a KQL database references the lakehouse table without moving the data, so there is no copy to load or keep in sync. KQL queries read it with external_table(), and they always see what the table contains at query time, including the nightly rewrite.
    fr: |
      Un raccourci OneLake dans une base de données KQL référence la table du lakehouse sans déplacer les données : il n'y a aucune copie à charger ni à synchroniser. Les requêtes KQL la lisent avec external_table() et voient toujours ce que contient la table au moment de la requête, y compris après la réécriture nocturne.
  options:
    a:
      en: |
        A nightly copy creates the second copy and the ingestion process that you must avoid.
      fr: |
        Une copie nocturne crée la seconde copie et le processus d'ingestion à éviter.
    c:
      en: |
        OneLake availability exposes eventhouse data to other engines; it doesn't bring lakehouse tables into KQL.
      fr: |
        La disponibilité OneLake expose les données de l'eventhouse aux autres moteurs ; elle n'amène pas les tables du lakehouse dans KQL.
    b:
      en: |
        A Dataflow Gen2 load is also an ingestion process that stores a second copy of the table.
      fr: |
        Un chargement par Dataflow Gen2 est aussi un processus d'ingestion qui stocke une seconde copie de la table.
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
