id: dp700-2b-denorm-dataflow-merge
objective: "2.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named DF-Customers that contains two queries:

    - Customers: CustomerID, Name, RegionID
    - Regions: RegionID, RegionName, Country

    Business analysts maintain the dataflow without writing code. You need the Customers query to output one table that includes RegionName and Country for each customer. Customers whose RegionID has no match in Regions must be kept.

    How should you complete the steps? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé DF-Customers qui contient deux requêtes :

    - Customers : CustomerID, Name, RegionID
    - Regions : RegionID, RegionName, Country

    Des analystes métier maintiennent le dataflow sans écrire de code. La requête Customers doit produire une seule table qui inclut RegionName et Country pour chaque client. Les clients dont le RegionID n'a pas de correspondance dans Regions doivent être conservés.

    Comment devez-vous compléter les étapes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. Select the Customers query, and then select [[op]] on the Home tab.
      2. Select Regions as the second table, select RegionID in both tables, and select the join kind [[kind]].
      3. On the new Regions column, select [[step]], and then select RegionName and Country.
    fr: |
      1. Sélectionnez la requête Customers, puis sélectionnez [[op]] sous l'onglet Accueil.
      2. Sélectionnez Regions comme seconde table, sélectionnez RegionID dans les deux tables, puis sélectionnez le type de jointure [[kind]].
      3. Sur la nouvelle colonne Regions, sélectionnez [[step]], puis sélectionnez RegionName et Country.
  slots:
    - id: op
      options:
        - { id: o_merge, text: Merge queries }
        - { id: o_append, text: Append queries }
        - { id: o_group, text: Group by }
        - { id: o_combine, text: Combine files }
    - id: kind
      options:
        - { id: k_left, text: Left outer }
        - { id: k_inner, text: Inner }
        - { id: k_right, text: Right outer }
        - { id: k_anti, text: Left anti }
    - id: step
      options:
        - { id: s_expand, text: Expand }
        - { id: s_aggregate, text: Aggregate }
        - { id: s_drill, text: Drill down }
answer:
  values: { op: o_merge, kind: k_left, step: s_expand }
explanation:
  correct:
    en: |
      Merge queries joins the selected query, as the left table, to a second table on matching columns. A left outer join keeps all the rows of Customers and the matching rows of Regions. The merge adds a column that holds a table value for each row, and Expand pulls the selected fields of Regions into Customers; Power Query Online supports only Expand on that column.
    fr: |
      Merge queries joint la requête sélectionnée, comme table de gauche, à une seconde table sur des colonnes correspondantes. Une jointure externe gauche conserve toutes les lignes de Customers et les lignes correspondantes de Regions. La fusion ajoute une colonne qui contient une valeur de table pour chaque ligne, et Expand ramène les champs sélectionnés de Regions dans Customers ; Power Query Online ne prend en charge qu'Expand sur cette colonne.
  options:
    o_append: { en: "Append queries stacks the rows of tables; it doesn't add columns from another table.", fr: "Append queries empile les lignes de tables ; il n'ajoute pas de colonnes d'une autre table." }
    o_group: { en: "Group by aggregates rows; it doesn't combine two queries.", fr: "Group by agrège des lignes ; il ne combine pas deux requêtes." }
    o_combine: { en: "Combine files merges the files of a folder, not two queries on a key.", fr: "Combine files fusionne les fichiers d'un dossier, pas deux requêtes sur une clé." }
    k_inner: { en: "Inner keeps only matching rows, so customers without a region disappear.", fr: "Inner ne conserve que les lignes correspondantes : les clients sans région disparaissent." }
    k_right: { en: "Right outer keeps all regions and drops unmatched customers.", fr: "Right outer conserve toutes les régions et supprime les clients sans correspondance." }
    k_anti: { en: "Left anti returns only the customers that have no match.", fr: "Left anti ne renvoie que les clients sans correspondance." }
    s_aggregate: { en: "Aggregate summarizes the nested table and isn't available in Power Query Online.", fr: "Aggregate résume la table imbriquée et n'est pas disponible dans Power Query Online." }
    s_drill: { en: "Drill down returns the content of a single value instead of adding columns to every row.", fr: "Drill down renvoie le contenu d'une seule valeur au lieu d'ajouter des colonnes à chaque ligne." }
references:
  - title: Merge queries overview
    url: https://learn.microsoft.com/en-us/power-query/merge-queries-overview
