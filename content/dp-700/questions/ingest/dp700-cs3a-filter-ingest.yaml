id: dp700-cs3a-filter-ingest
objective: "2.3.4"
type: single
caseStudy: dp700-cs3a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to ingest the turbine telemetry into the Telemetry table. The solution must meet the ingestion requirements. What should you do?
  fr: |
    Vous devez ingérer la télémétrie des éoliennes dans la table Telemetry. La solution doit respecter les exigences d'ingestion. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Create an eventstream that reads turbine-telemetry, ingest all events into a staging table of TurbineDB, and add an update policy that copies the rows where IsTest is false into Telemetry."
        fr: "Créer un flux d'événements qui lit turbine-telemetry, ingérer tous les événements dans une table intermédiaire de TurbineDB, et ajouter une stratégie de mise à jour qui copie dans Telemetry les lignes où IsTest vaut false."
    - id: b
      text:
        en: "Create a notebook that uses Spark structured streaming to read turbine-telemetry, filter out the rows where IsTest is true, and write the result to Telemetry."
        fr: "Créer un notebook qui utilise le streaming structuré Spark pour lire turbine-telemetry, exclure les lignes où IsTest vaut true et écrire le résultat dans Telemetry."
    - id: c
      text:
        en: "Create an eventstream that reads turbine-telemetry, add a Filter operator that keeps the events where IsTest is false, and route the output to Telemetry with event processing before ingestion."
        fr: "Créer un flux d'événements qui lit turbine-telemetry, ajouter un opérateur Filter qui conserve les événements où IsTest vaut false, et acheminer la sortie vers Telemetry avec le traitement des événements avant l'ingestion."
    - id: d
      text:
        en: "Create an eventstream that sends all events from turbine-telemetry directly to Telemetry, and create a stored KQL function that returns only the rows where IsTest is false."
        fr: "Créer un flux d'événements qui envoie directement tous les événements de turbine-telemetry vers Telemetry, et créer une fonction KQL stockée qui ne renvoie que les lignes où IsTest vaut false."
answer: { optionId: c }
explanation:
  correct:
    en: |
      An eventstream connects to Azure Event Hubs without code, and its Filter operator drops the test events in the stream. Because the eventhouse destination uses event processing before ingestion, only the filtered events reach TurbineDB, so test events are never stored.
    fr: |
      Un flux d'événements se connecte à Azure Event Hubs sans code, et son opérateur Filter supprime les événements de test dans le flux. Comme la destination eventhouse utilise le traitement des événements avant l'ingestion, seuls les événements filtrés atteignent TurbineDB : les événements de test ne sont jamais stockés.
  options:
    a:
      en: |
        The staging table stores the test events in TurbineDB before the update policy runs, which violates the requirement.
      fr: |
        La table intermédiaire stocke les événements de test dans TurbineDB avant l'exécution de la stratégie de mise à jour, ce qui enfreint l'exigence.
    b:
      en: |
        Spark structured streaming can filter the events, but it requires writing and maintaining code, which does not minimize development effort.
      fr: |
        Le streaming structuré Spark peut filtrer les événements, mais il faut écrire et maintenir du code, ce qui ne réduit pas l'effort de développement.
    d:
      en: |
        A stored function only hides the test rows at query time; the test events are still ingested into Telemetry.
      fr: |
        Une fonction stockée ne masque les lignes de test qu'au moment de la requête ; les événements de test sont tout de même ingérés dans Telemetry.
