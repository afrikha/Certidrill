id: dp700-2c-hot-policy
objective: "2.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a KQL database that contains a OneLake shortcut named sales_history. The shortcut points to a Delta table in a lakehouse.

    You need to accelerate queries on the data files of sales_history that were modified during the last 14 days. The solution must use a management command.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL qui contient un raccourci OneLake nommé sales_history. Le raccourci pointe vers une table Delta d'un lakehouse.

    Vous devez accélérer les requêtes sur les fichiers de données de sales_history modifiés au cours des 14 derniers jours. La solution doit utiliser une commande de gestion.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    .[[cmd]] external table sales_history policy query_acceleration
        '{"IsEnabled": true, "Hot": "[[hot]]"}'
  slots:
    - id: cmd
      options:
        - { id: alter, text: alter }
        - { id: show, text: show }
        - { id: delete, text: delete }
        - { id: setreplace, text: set-or-replace }
    - id: hot
      options:
        - { id: d14, text: "14.00:00:00" }
        - { id: h14, text: "14:00:00" }
        - { id: m14, text: "00:14:00" }
        - { id: d336, text: "336.00:00:00" }
answer:
  values: { cmd: alter, hot: d14 }
explanation:
  correct:
    en: |
      `.alter external table ... policy query_acceleration` sets the query acceleration policy of an external delta table, such as the table behind a shortcut. IsEnabled and Hot are required, and Hot is a timespan (minimum one day): 14.00:00:00 is 14 days, counted by default from each file's modificationTime in the Delta log.
    fr: |
      `.alter external table ... policy query_acceleration` définit la stratégie d'accélération des requêtes d'une table delta externe, comme la table derrière un raccourci. IsEnabled et Hot sont obligatoires, et Hot est une durée (au minimum un jour) : 14.00:00:00 correspond à 14 jours, comptés par défaut à partir du modificationTime de chaque fichier dans le journal Delta.
  options:
    show:
      en: "The show command returns the current policy; it doesn't accept a policy to set."
      fr: "La commande show renvoie la stratégie actuelle ; elle n'accepte pas de stratégie à définir."
    delete:
      en: "The delete command removes the policy, which stops acceleration."
      fr: "La commande delete supprime la stratégie, ce qui arrête l'accélération."
    setreplace:
      en: ".set-or-replace ingests the results of a query into a table; it doesn't manage policies."
      fr: ".set-or-replace ingère les résultats d'une requête dans une table ; il ne gère pas les stratégies."
    h14:
      en: "14:00:00 is 14 hours, which is also below the one-day minimum."
      fr: "14:00:00 correspond à 14 heures, ce qui est aussi inférieur au minimum d'un jour."
    m14:
      en: "00:14:00 is 14 minutes."
      fr: "00:14:00 correspond à 14 minutes."
    d336:
      en: "336.00:00:00 is 336 days; 336 is the number of hours in 14 days, not of days."
      fr: "336.00:00:00 correspond à 336 jours ; 336 est le nombre d'heures de 14 jours, pas de jours."
references:
  - title: .alter query acceleration policy command
    url: https://learn.microsoft.com/en-us/kusto/management/alter-query-acceleration-policy-command?view=microsoft-fabric
