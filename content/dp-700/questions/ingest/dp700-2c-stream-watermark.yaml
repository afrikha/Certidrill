id: dp700-2c-stream-watermark
objective: "2.2.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Spark structured streaming job that reads sensor events and writes 5-minute counts per device to a Delta table in a lakehouse. Events can arrive several minutes after their event time. The job contains the following code:

    ```python
    counts = (events
        .withWatermark("event_time", "10 minutes")
        .groupBy(F.window("event_time", "5 minutes"), "device_id")
        .count())
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un travail de streaming structuré Spark qui lit des événements de capteurs et écrit des comptages par appareil sur 5 minutes dans une table Delta d'un lakehouse. Des événements peuvent arriver plusieurs minutes après leur heure d'événement. Le travail contient le code suivant :

    ```python
    counts = (events
        .withWatermark("event_time", "10 minutes")
        .groupBy(F.window("event_time", "5 minutes"), "device_id")
        .count())
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "An event that arrives 4 minutes after its event_time is included in the count of its window."
        fr: "Un événement qui arrive 4 minutes après son event_time est inclus dans le comptage de sa fenêtre."
    - id: s2
      text:
        en: "With the append output mode, the count of a window is written only after the watermark has passed the end of the window."
        fr: "Avec le mode de sortie append, le comptage d'une fenêtre n'est écrit qu'après que le filigrane a dépassé la fin de la fenêtre."
    - id: s3
      text:
        en: "With the complete output mode, the state of old windows is dropped when the watermark passes."
        fr: "Avec le mode de sortie complete, l'état des anciennes fenêtres est supprimé quand le filigrane est dépassé."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The watermark keeps the state of a window until the window end is 10 minutes older than the latest event_time seen, so records that arrive within the threshold are always processed. In append mode, a window's row is written once the watermark passes, because it can no longer change. In complete mode, the whole result is rewritten at each trigger and the state isn't dropped.
    fr: |
      Le filigrane conserve l'état d'une fenêtre jusqu'à ce que la fin de la fenêtre soit antérieure de 10 minutes au dernier event_time observé : les enregistrements qui arrivent dans ce seuil sont toujours traités. En mode append, la ligne d'une fenêtre est écrite une fois le filigrane dépassé, car elle ne peut plus changer. En mode complete, tout le résultat est réécrit à chaque déclencheur et l'état n'est pas supprimé.
references:
  - title: Apply watermarks to control data processing thresholds
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/watermarks
