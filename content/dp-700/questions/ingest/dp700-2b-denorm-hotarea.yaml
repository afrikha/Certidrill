id: dp700-2b-denorm-hotarea
objective: "2.2.7"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW-Sales. dbo.DimCustomer is a type 2 slowly changing dimension: it has one row per version of each customer, with an IsCurrent column, and every CustomerID of the sales exists in it. Some customers have no geography, so their GeographyKey is NULL.

    You write the query shown in the following table to build a denormalized table of sales lines. The query must return each sales line exactly once.

    Answer each prompt by selecting the appropriate line of the query.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW-Sales. dbo.DimCustomer est une dimension à variation lente de type 2 : elle comporte une ligne par version de chaque client, avec une colonne IsCurrent, et chaque CustomerID des ventes y existe. Certains clients n'ont pas de géographie : leur GeographyKey est NULL.

    Vous écrivez la requête présentée dans le tableau suivant pour créer une table dénormalisée des lignes de ventes. La requête doit renvoyer chaque ligne de ventes exactement une fois.

    Répondez à chaque consigne en sélectionnant la ligne appropriée de la requête.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which line causes some sales lines to be returned several times?", fr: "Quelle ligne fait que certaines lignes de ventes sont renvoyées plusieurs fois ?" }
    - id: p2
      text: { en: "Which line removes the sales of customers that have no geography?", fr: "Quelle ligne supprime les ventes des clients qui n'ont pas de géographie ?" }
  grid:
    header: [{ en: "Line", fr: "Ligne" }, { en: "Query", fr: "Requête" }]
    rows:
      - [{ text: "1" }, { text: "SELECT s.SalesLineID, s.Amount, c.CustomerName, c.Segment, g.Region", area: l1 }]
      - [{ text: "2" }, { text: "FROM stg.SalesLine AS s", area: l2 }]
      - [{ text: "3" }, { text: "JOIN dbo.DimCustomer AS c ON c.CustomerID = s.CustomerID", area: l3 }]
      - [{ text: "4" }, { text: "LEFT JOIN dbo.DimGeography AS g ON g.GeographyKey = c.GeographyKey", area: l4 }]
      - [{ text: "5" }, { text: "WHERE g.Region <> 'Test';", area: l5 }]
answer:
  values: { p1: l3, p2: l5 }
explanation:
  correct:
    en: |
      Line 3 joins on the business key CustomerID only, so a sale matches every version of its customer and is returned once per version; it needs a condition such as c.IsCurrent = 1, or the version valid at the sale date. Line 4 keeps customers without geography with a NULL Region, but the WHERE clause on line 5 compares NULL with 'Test', which isn't true, so those rows are filtered out; the test must handle NULL or move into the ON clause.
    fr: |
      La ligne 3 joint uniquement sur la clé métier CustomerID : une vente correspond à chaque version de son client et est renvoyée une fois par version ; il faut une condition comme c.IsCurrent = 1, ou la version valide à la date de la vente. La ligne 4 conserve les clients sans géographie avec une valeur Region NULL, mais la clause WHERE de la ligne 5 compare NULL à 'Test', ce qui n'est pas vrai : ces lignes sont éliminées ; le test doit gérer NULL ou passer dans la clause ON.
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
