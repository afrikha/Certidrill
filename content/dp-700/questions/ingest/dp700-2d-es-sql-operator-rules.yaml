id: dp700-2d-es-sql-operator-rules
objective: "2.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an eventstream named **ES-Orders** that receives order events from an Azure event hub. In ES-Orders, a Filter operator removes test orders and sends its output to a lakehouse destination named **LH-Orders**.

    You plan to add a SQL operator to ES-Orders to compute order totals per store by using the Stream Analytics query language. The totals must be sent to an eventhouse and the detailed orders to a lakehouse.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un flux d'événements nommé **ES-Orders** qui reçoit des événements de commande d'un hub d'événements Azure. Dans ES-Orders, un opérateur Filter retire les commandes de test et envoie sa sortie à une destination lakehouse nommée **LH-Orders**.

    Vous prévoyez d'ajouter un opérateur SQL à ES-Orders pour calculer les totaux de commandes par magasin avec le langage de requête Stream Analytics. Les totaux doivent être envoyés à un eventhouse et les commandes détaillées à un lakehouse.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "You can place the SQL operator after the Filter operator on the same processing path.", fr: "Vous pouvez placer l'opérateur SQL après l'opérateur Filter sur le même chemin de traitement." }
    - id: b
      text: { en: "One SQL operator can write to both destinations by using two SELECT ... INTO statements.", fr: "Un seul opérateur SQL peut écrire dans les deux destinations à l'aide de deux instructions SELECT ... INTO." }
    - id: c
      text: { en: "The SQL operator uses the event time of the source by default, without a TIMESTAMP BY clause.", fr: "L'opérateur SQL utilise par défaut l'heure de l'événement de la source, sans clause TIMESTAMP BY." }
    - id: d
      text: { en: "The outputs of the SQL operator require new destination nodes instead of the LH-Orders node.", fr: "Les sorties de l'opérateur SQL demandent de nouveaux nœuds de destination au lieu du nœud LH-Orders." }
    - id: e
      text: { en: "You can chain a second SQL operator after the first one to split the logic into steps.", fr: "Vous pouvez enchaîner un second opérateur SQL après le premier pour découper la logique en étapes." }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      A SQL operator can contain several `SELECT ... INTO` statements, each writing to its own output alias, ideally reading the input once through a `WITH` clause. Existing destination nodes can't be reused with a SQL operator; you create new destination nodes for its outputs.
    fr: |-
      Un opérateur SQL peut contenir plusieurs instructions `SELECT ... INTO`, chacune écrivant dans son propre alias de sortie, idéalement en lisant l'entrée une seule fois avec une clause `WITH`. Les nœuds de destination existants ne peuvent pas être réutilisés avec un opérateur SQL ; vous créez de nouveaux nœuds de destination pour ses sorties.
  options:
    a:
      en: |-
        The SQL operator is designed to hold all the transformation logic of its path, so it can't be combined with other built-in operators, such as Filter, on the same processing path.
      fr: |-
        L'opérateur SQL est conçu pour regrouper toute la logique de transformation de son chemin : il ne peut pas être combiné avec d'autres opérateurs intégrés, comme Filter, sur le même chemin de traitement.
    c:
      en: |-
        By default, the SQL operator uses the arrival time of the events; event time must be set explicitly with TIMESTAMP BY.
      fr: |-
        Par défaut, l'opérateur SQL utilise l'heure d'arrivée des événements ; l'heure de l'événement doit être définie explicitement avec TIMESTAMP BY.
    e:
      en: |-
        Chaining several SQL operators in a single path isn't supported; the steps go into one query, for example with WITH clauses.
      fr: |-
        L'enchaînement de plusieurs opérateurs SQL sur un même chemin n'est pas pris en charge ; les étapes vont dans une seule requête, par exemple avec des clauses WITH.
references:
  - title: Process events by using a SQL operator
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/process-events-using-sql-code-editor
