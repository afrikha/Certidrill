id: dp700-2d-kql-policy-failures
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named **DB-Sales**. An eventstream ingests events into a table named **RawSales**. A non-transactional update policy transforms each ingested batch into a table named **Sales**.

    Since this morning, new rows appear in RawSales, but some batches are missing from Sales.

    You need to identify why the batches are missing.

    Which command should you run first?
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **DB-Sales**. Un flux d'événements ingère des événements dans une table nommée **RawSales**. Une stratégie de mise à jour non transactionnelle transforme chaque lot ingéré dans une table nommée **Sales**.

    Depuis ce matin, de nouvelles lignes apparaissent dans RawSales, mais certains lots sont absents de Sales.

    Vous devez déterminer pourquoi les lots sont absents.

    Quelle commande devez-vous exécuter en premier ?
body:
  options:
    - id: a
      text: ".show table Sales policy retention | project Policy"
    - id: b
      text: ".show table Sales extents | where MinCreatedOn > ago(1d)"
    - id: c
      text: ".show table RawSales policy update | project Policy"
    - id: d
      text: ".show ingestion failures | where OriginatesFromUpdatePolicy == true"
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With a non-transactional policy, a failure of the policy query doesn't stop the ingestion into the source table, so the data lands in RawSales but not in Sales. `.show ingestion failures`, filtered on `OriginatesFromUpdatePolicy`, lists the failures caused by update policies with their details, such as a schema mismatch or a query error.
    fr: |-
      Avec une stratégie non transactionnelle, un échec de la requête de la stratégie n'arrête pas l'ingestion dans la table source : les données arrivent dans RawSales mais pas dans Sales. `.show ingestion failures`, filtré sur `OriginatesFromUpdatePolicy`, liste les échecs causés par les stratégies de mise à jour avec leurs détails, comme une différence de schéma ou une erreur de requête.
  options:
    a:
      en: |-
        The retention policy controls how long data is kept; it doesn't explain why recent batches never reached Sales.
      fr: |-
        La stratégie de rétention contrôle la durée de conservation des données ; elle n'explique pas pourquoi des lots récents ne sont jamais arrivés dans Sales.
    b:
      en: |-
        The extents of Sales show the data that arrived today, not the errors that prevented the other batches from arriving.
      fr: |-
        Les extents de Sales montrent les données arrivées aujourd'hui, pas les erreurs qui ont empêché les autres lots d'arriver.
    c:
      en: |-
        The update policy is defined on the target table, Sales, not on RawSales; and its definition doesn't show the failures.
      fr: |-
        La stratégie de mise à jour se définit sur la table cible, Sales, et non sur RawSales ; de plus, sa définition n'affiche pas les échecs.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
