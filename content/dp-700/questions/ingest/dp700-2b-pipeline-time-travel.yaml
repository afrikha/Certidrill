id: dp700-2b-pipeline-time-travel
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named LH-Sales that contains a Delta table named orders. A load that started at 01:00 UTC on 17 November 2026 wrote incorrect data to orders. Version 42 of orders, committed at 23:10 UTC on 16 November 2026, is the last correct version, and no other load ran between version 42 and the incorrect load.

    You need a Copy data activity to copy the content of orders as it was before the incorrect load to a table named orders_restore in a lakehouse named LH-Archive.

    Which two source settings can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé LH-Sales qui contient une table Delta nommée orders. Un chargement démarré à 01:00 UTC le 17 novembre 2026 a écrit des données incorrectes dans orders. La version 42 d'orders, validée à 23:10 UTC le 16 novembre 2026, est la dernière version correcte, et aucun autre chargement ne s'est exécuté entre la version 42 et le chargement incorrect.

    Une activité Copy data doit copier le contenu d'orders tel qu'il était avant le chargement incorrect vers une table nommée orders_restore d'un lakehouse nommé LH-Archive.

    Quels sont les deux paramètres de source que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable staging with workspace staging", fr: "Enable staging avec le stockage intermédiaire de l'espace de travail" } }
    - { id: b, text: { en: "Filter by last modified with the end time 2026-11-17T01:00:00.000Z", fr: "Filter by last modified avec l'heure de fin 2026-11-17T01:00:00.000Z" } }
    - { id: c, text: { en: "Timestamp set to 2026-11-17T00:30:00Z", fr: "Timestamp défini sur 2026-11-17T00:30:00Z" } }
    - { id: d, text: { en: "Version set to 42", fr: "Version définie sur 42" } }
    - { id: e, text: { en: "Recursively selected on the Tables root folder", fr: "Recursively activé sur le dossier racine Tables" } }
answer: { optionIds: [ d, c ] }
explanation:
  correct:
    en: |
      In table mode, the advanced settings of a lakehouse source can read an older snapshot of a Delta table by version or by timestamp (time travel). Version 42 is the correct state, and a timestamp between 23:10 and 01:00 also resolves to version 42, because no other version was committed in between.
    fr: |
      En mode table, les paramètres avancés d'une source lakehouse peuvent lire un ancien instantané d'une table Delta par version ou par horodatage (voyage dans le temps). La version 42 est l'état correct, et un horodatage entre 23:10 et 01:00 correspond aussi à la version 42, car aucune autre version n'a été validée entre-temps.
  options:
    b: { en: "The last-modified filter selects files in the Files root folder; it doesn't read an older version of a Delta table.", fr: "Le filtre de dernière modification sélectionne des fichiers du dossier racine Files ; il ne lit pas une ancienne version d'une table Delta." }
    a: { en: "Staging changes the copy path through interim storage, not the version of the data that is read.", fr: "Le stockage intermédiaire change le chemin de la copie, pas la version des données lues." }
    e: { en: "Recursively applies to folders in the Files root folder, not to the version of a table.", fr: "Recursively s'applique aux dossiers du dossier racine Files, pas à la version d'une table." }
references:
  - title: Configure lakehouse in a copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/connector-lakehouse-copy-activity
