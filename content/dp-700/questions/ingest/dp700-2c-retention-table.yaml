id: dp700-2c-retention-table
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an eventhouse named EH_Ops that contains a KQL database named OpsDB. An eventstream receives telemetry from 5,000 wind turbines.

    You need to store the telemetry so that it meets the following requirements:

    - The eventhouse deletes the telemetry automatically 30 days after ingestion.
    - Queries over the last 7 days use the hot cache of the eventhouse.
    - An update policy extracts the alarm codes into a separate table as the data arrives.

    Where should you store the telemetry?
  fr: |
    Vous disposez d'un eventhouse nommé EH_Ops qui contient une base de données KQL nommée OpsDB. Un flux d'événements reçoit la télémétrie de 5 000 éoliennes.

    Vous devez stocker la télémétrie de façon à répondre aux exigences suivantes :

    - L'eventhouse supprime automatiquement la télémétrie 30 jours après son ingestion.
    - Les requêtes sur les 7 derniers jours utilisent le cache chaud de l'eventhouse.
    - Une stratégie de mise à jour extrait les codes d'alarme dans une table distincte à l'arrivée des données.

    Où devez-vous stocker la télémétrie ?
body:
  options:
    - id: a
      text:
        en: "In a native table of OpsDB, with a retention policy and a caching policy"
        fr: "Dans une table native d'OpsDB, avec une stratégie de rétention et une stratégie de mise en cache"
    - id: b
      text:
        en: "In a lakehouse table, reached from OpsDB through a OneLake shortcut that has query acceleration with a 7-day caching period"
        fr: "Dans une table de lakehouse, atteinte depuis OpsDB par un raccourci OneLake avec accélération des requêtes et une période de mise en cache de 7 jours"
    - id: c
      text:
        en: "In a Fabric warehouse table, reached from OpsDB through a OneLake shortcut"
        fr: "Dans une table d'entrepôt Fabric, atteinte depuis OpsDB par un raccourci OneLake"
    - id: d
      text:
        en: "In a lakehouse table, reached from OpsDB through a OneLake shortcut"
        fr: "Dans une table de lakehouse, atteinte depuis OpsDB par un raccourci OneLake"
answer: { optionId: a }
explanation:
  correct:
    en: |
      Data ingested into a native table is managed by the eventhouse: a retention policy deletes it after the retention period, a caching policy keeps the recent part in the hot cache, and the table can be the source of an update policy. A shortcut leaves the data in the source item, so the eventhouse neither deletes it nor runs update policies on it.
    fr: |
      Les données ingérées dans une table native sont gérées par l'eventhouse : une stratégie de rétention les supprime après la période de rétention, une stratégie de mise en cache garde la partie récente dans le cache chaud, et la table peut être la source d'une stratégie de mise à jour. Un raccourci laisse les données dans l'élément source : l'eventhouse ne les supprime pas et n'exécute pas de stratégies de mise à jour sur elles.
  options:
    d:
      en: |
        Behind a standard shortcut, the lakehouse controls the data's lifetime, the data isn't cached by the eventhouse, and the shortcut can't be the source table of an update policy.
      fr: |
        Derrière un raccourci standard, c'est le lakehouse qui contrôle la durée de vie des données, l'eventhouse ne les met pas en cache et le raccourci ne peut pas être la table source d'une stratégie de mise à jour.
    b:
      en: |
        Query acceleration caches the last 7 days, but the eventhouse still doesn't delete the lakehouse data, and an accelerated shortcut can't be the source table of an update policy.
      fr: |
        L'accélération des requêtes met en cache les 7 derniers jours, mais l'eventhouse ne supprime toujours pas les données du lakehouse, et un raccourci accéléré ne peut pas être la table source d'une stratégie de mise à jour.
    c:
      en: |
        An eventstream can't write to a warehouse, and a shortcut to a warehouse table has the same limits as a shortcut to a lakehouse table.
      fr: |
        Un flux d'événements ne peut pas écrire dans un entrepôt, et un raccourci vers une table d'entrepôt a les mêmes limites qu'un raccourci vers une table de lakehouse.
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
