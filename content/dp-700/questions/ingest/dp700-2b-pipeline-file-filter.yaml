id: dp700-2b-pipeline-file-filter
objective: "2.2.5"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You have a lakehouse named LH-Landing. The Files/sales folder of LH-Landing contains one subfolder per store, and each subfolder receives CSV and JSON files.

    You are configuring the source of a Copy data activity. The activity must copy only the CSV files of all the store subfolders that were last modified on 16 November 2026 (UTC). Files modified on any other day must be ignored.

    How should you complete the source settings? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé LH-Landing. Le dossier Files/sales de LH-Landing contient un sous-dossier par magasin, et chaque sous-dossier reçoit des fichiers CSV et JSON.

    Vous configurez la source d'une activité Copy data. L'activité doit copier uniquement les fichiers CSV de tous les sous-dossiers de magasins dont la dernière modification date du 16 novembre 2026 (UTC). Les fichiers modifiés un autre jour doivent être ignorés.

    Comment devez-vous compléter les paramètres de la source ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Root folder:                 Files
    File path type:              [[ptype]]
    Folder and file name:        sales / *.csv
    Recursively:                 [[rec]]
    Filter by last modified
      Start time (UTC):          2026-11-16T00:00:00.000Z
      End time (UTC):            [[end]]
  slots:
    - id: ptype
      options:
        - { id: p_path, text: File path }
        - { id: p_wild, text: Wildcard file path }
        - { id: p_list, text: List of files }
    - id: rec
      options:
        - { id: r_on, text: Selected }
        - { id: r_off, text: Cleared }
    - id: end
      options:
        - { id: e_16_0, text: "2026-11-16T00:00:00.000Z" }
        - { id: e_16_23, text: "2026-11-16T23:59:59.000Z" }
        - { id: e_17_0, text: "2026-11-17T00:00:00.000Z" }
        - { id: e_17_23, text: "2026-11-17T23:59:59.000Z" }
answer:
  values: { ptype: p_wild, rec: r_on, end: e_17_0 }
explanation:
  correct:
    en: |
      A wildcard file path filters names with `*`, so `*.csv` keeps only the CSV files, and Recursively reads the subfolders of sales as well. The last-modified filter uses UTC, with an inclusive start time and an exclusive end time: from 2026-11-16T00:00:00.000Z up to, but not including, 2026-11-17T00:00:00.000Z covers exactly the whole day of 16 November.
    fr: |
      Un chemin de fichier générique filtre les noms avec `*` : `*.csv` ne garde que les fichiers CSV, et Recursively lit aussi les sous-dossiers de sales. Le filtre de dernière modification utilise l'heure UTC, avec une heure de début incluse et une heure de fin exclue : de 2026-11-16T00:00:00.000Z jusqu'à 2026-11-17T00:00:00.000Z non inclus couvre exactement toute la journée du 16 novembre.
  options:
    p_path: { en: "File path copies one file or folder without a name pattern.", fr: "File path copie un fichier ou un dossier sans modèle de nom." }
    p_list: { en: "List of files reads paths from a text file, and the last-modified filter and Recursively don't apply to it.", fr: "List of files lit des chemins dans un fichier texte, et ni le filtre de dernière modification ni Recursively ne s'y appliquent." }
    r_off: { en: "Without Recursively, the files in the store subfolders aren't read.", fr: "Sans Recursively, les fichiers des sous-dossiers de magasins ne sont pas lus." }
    e_16_0: { en: "An end time equal to the start time selects no file.", fr: "Une heure de fin égale à l'heure de début ne sélectionne aucun fichier." }
    e_16_23: { en: "The end time is exclusive, so files modified during the last second of the day would be missed.", fr: "L'heure de fin est exclue : les fichiers modifiés pendant la dernière seconde de la journée seraient manqués." }
    e_17_23: { en: "This end time also includes almost all of 17 November.", fr: "Cette heure de fin inclut aussi presque tout le 17 novembre." }
references:
  - title: Configure lakehouse in a copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/connector-lakehouse-copy-activity
