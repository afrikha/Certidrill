id: dp700-2c-acceleration-cost
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to enable query acceleration on several OneLake shortcuts in an eventhouse. The finance team asks how acceleration affects Fabric costs.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'activer l'accélération des requêtes sur plusieurs raccourcis OneLake d'un eventhouse. L'équipe financière demande comment l'accélération influe sur les coûts Fabric.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The caching period has no effect on the amount of accelerated data that is charged.", fr: "La période de mise en cache n'a aucun effet sur la quantité de données accélérées facturée." } }
    - { id: b, text: { en: "Accelerated data is charged on the OneLake Premium cache meter, like the data of native eventhouse tables.", fr: "Les données accélérées sont facturées sur le compteur OneLake Premium cache, comme les données des tables natives d'un eventhouse." } }
    - { id: c, text: { en: "Acceleration charges appear in the Fabric Capacity Metrics app under the source lakehouse.", fr: "Les frais d'accélération apparaissent dans l'application Fabric Capacity Metrics sous le lakehouse source." } }
    - { id: d, text: { en: "Indexing the accelerated data can consume capacity units.", fr: "L'indexation des données accélérées peut consommer des unités de capacité." } }
    - { id: e, text: { en: "Acceleration adds no cost because the data stays in OneLake.", fr: "L'accélération n'ajoute aucun coût, car les données restent dans OneLake." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Accelerated data is billed on the OneLake Premium cache meter, as native eventhouse tables are, and the indexing activity uses capacity units. The charges appear in the metrics app under the eventhouse where the accelerated shortcut was created.
    fr: |
      Les données accélérées sont facturées sur le compteur OneLake Premium cache, comme les tables natives d'un eventhouse, et l'activité d'indexation consomme des unités de capacité. Les frais apparaissent dans l'application de métriques sous l'eventhouse où le raccourci accéléré a été créé.
  options:
    e:
      en: "The source files stay in OneLake, but the cache and the indexing are charged to the eventhouse."
      fr: "Les fichiers sources restent dans OneLake, mais le cache et l'indexation sont facturés à l'eventhouse."
    a:
      en: "The number of days to cache limits the amount of accelerated data, and therefore its cost."
      fr: "Le nombre de jours à mettre en cache limite la quantité de données accélérées, et donc leur coût."
    c:
      en: "The charges appear under the eventhouse that contains the accelerated shortcut, not under the source item."
      fr: "Les frais apparaissent sous l'eventhouse qui contient le raccourci accéléré, pas sous l'élément source."
references:
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
