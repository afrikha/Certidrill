id: dp700-2b-mirror-limits
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to mirror an Azure SQL database named sqldb-crm into a Fabric workspace by using the default Mirror all data option. The database uses row-level security on several tables.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de mettre en miroir une base de données Azure SQL nommée sqldb-crm dans un espace de travail Fabric avec l'option par défaut Mirror all data. La base de données utilise la sécurité au niveau des lignes sur plusieurs tables.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can mirror sqldb-crm while change data capture (CDC) is enabled on the database.
        fr: Vous pouvez mettre en miroir sqldb-crm alors que la capture des changements de données (CDC) est activée sur la base de données.
    - id: s2
      text:
        en: The row-level security policies of sqldb-crm are applied automatically to the mirrored tables in OneLake.
        fr: Les stratégies de sécurité au niveau des lignes de sqldb-crm sont appliquées automatiquement aux tables mises en miroir dans OneLake.
    - id: s3
      text:
        en: Tables that are created in sqldb-crm after mirroring starts are also mirrored.
        fr: Les tables créées dans sqldb-crm après le démarrage de la mise en miroir sont également mises en miroir.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A database that has change data capture enabled can't be mirrored. Row-level security, object-level permissions and dynamic data masking are supported in the source but aren't propagated to OneLake, so granular security must be configured again in Fabric. With Mirror all data, tables created after mirroring starts are mirrored too, up to the limit of 1,000 tables.
    fr: |
      Une base de données sur laquelle la capture des changements de données est activée ne peut pas être mise en miroir. La sécurité au niveau des lignes, les autorisations au niveau des objets et le masquage dynamique des données sont pris en charge dans la source mais ne sont pas propagés vers OneLake : la sécurité granulaire doit être reconfigurée dans Fabric. Avec Mirror all data, les tables créées après le démarrage de la mise en miroir sont aussi mises en miroir, dans la limite de 1 000 tables.
references:
  - title: Limitations in Microsoft Fabric mirrored databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-limitations
  - title: "Tutorial: Configure Microsoft Fabric mirrored databases from Azure SQL Database"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-tutorial
