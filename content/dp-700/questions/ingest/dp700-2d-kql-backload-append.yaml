id: dp700-2d-kql-backload-append
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named **DB-Energy**. An eventstream ingests meter events into a table named **RawMeters**. An update policy on a table named **Meters** transforms each batch ingested into RawMeters. Meters already contains six months of transformed data.

    A table named **ArchiveMeters** in DB-Energy contains older raw events that use the RawMeters schema. You need to load the ArchiveMeters events into RawMeters so that the update policy also transforms them into Meters. The solution must meet the following requirements:

    - The data already in RawMeters and Meters must be kept.
    - ArchiveMeters must keep all its data.

    Which command should you run?
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **DB-Energy**. Un flux d'événements ingère des événements de compteurs dans une table nommée **RawMeters**. Une stratégie de mise à jour sur une table nommée **Meters** transforme chaque lot ingéré dans RawMeters. Meters contient déjà six mois de données transformées.

    Une table nommée **ArchiveMeters** de DB-Energy contient des événements bruts plus anciens qui utilisent le schéma de RawMeters. Vous devez charger les événements d'ArchiveMeters dans RawMeters pour que la stratégie de mise à jour les transforme aussi dans Meters. La solution doit satisfaire les exigences suivantes :

    - Les données déjà présentes dans RawMeters et Meters doivent être conservées.
    - ArchiveMeters doit conserver toutes ses données.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - id: a
      text: ".set-or-replace RawMeters <| ArchiveMeters"
    - id: b
      text: ".set-or-append RawMeters <| ArchiveMeters"
    - id: c
      text: ".move extents all from table ArchiveMeters to table RawMeters"
    - id: d
      text: ".set-or-replace Meters <| ArchiveMeters"
answer: { optionId: b }
explanation:
  correct:
    en: "`.set-or-append` appends the result of the query to RawMeters, and ingestion commands such as `.set-or-append` trigger the update policies of the target table's dependents, so the archived events are also transformed into Meters. The existing data of both tables and of ArchiveMeters is left unchanged."
    fr: "`.set-or-append` ajoute le résultat de la requête à RawMeters, et les commandes d'ingestion comme `.set-or-append` déclenchent les stratégies de mise à jour qui utilisent cette table comme source : les événements archivés sont donc aussi transformés dans Meters. Les données existantes des deux tables et d'ArchiveMeters restent inchangées."
  options:
    a:
      en: |-
        .set-or-replace replaces the data of RawMeters and can also replace or remove data in the tables derived from it by update policies, such as Meters.
      fr: |-
        .set-or-replace remplace les données de RawMeters et peut aussi remplacer ou supprimer des données dans les tables qui en dérivent par des stratégies de mise à jour, comme Meters.
    c:
      en: |-
        Moving extents triggers the update policy, but it removes the extents from ArchiveMeters, which must keep its data.
      fr: |-
        Le déplacement d'extents déclenche la stratégie de mise à jour, mais il retire les extents d'ArchiveMeters, qui doit conserver ses données.
    d:
      en: |-
        This command writes raw events directly into Meters without the transformation and replaces the six months of data already there.
      fr: |-
        Cette commande écrit les événements bruts directement dans Meters sans la transformation et remplace les six mois de données qui s'y trouvent déjà.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
