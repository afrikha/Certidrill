id: dp700-2a-tool-csv-cleanse
objective: "2.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse4**. Every day, about 5 GB of CSV files land in the Files/landing folder. The data must be cleansed (duplicate rows removed, missing values replaced, one column split into two) and written to a Delta table in Lakehouse4.

    Which two tools can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse4**. Chaque jour, environ 5 Go de fichiers CSV arrivent dans le dossier Files/landing. Les données doivent être nettoyées (suppression des lignes en double, remplacement des valeurs manquantes, fractionnement d'une colonne en deux) et écrites dans une table Delta de Lakehouse4.

    Quels sont les deux outils que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "T-SQL statements in the SQL analytics endpoint of Lakehouse4", fr: "Des instructions T-SQL dans le point de terminaison d'analytique SQL de Lakehouse4" } }
    - { id: b, text: { en: "A Dataflow Gen2 with a Lakehouse Tables data destination", fr: "Un Dataflow Gen2 avec une destination de données Lakehouse Tables" } }
    - { id: c, text: { en: "A KQL update policy in an eventhouse", fr: "Une stratégie de mise à jour KQL dans un eventhouse" } }
    - { id: d, text: { en: "A notebook that uses PySpark", fr: "Un notebook qui utilise PySpark" } }
    - { id: e, text: { en: "A copy job with the Merge update method", fr: "Un travail de copie avec la méthode de mise à jour Merge" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Dataflow Gen2 offers hundreds of Power Query transformations, including removing duplicates, replacing values and splitting columns, and can write to lakehouse tables. A PySpark notebook can read the CSV files, apply the same cleansing and write a Delta table. Both handle this volume.
    fr: |
      Dataflow Gen2 propose des centaines de transformations Power Query, dont la suppression des doublons, le remplacement de valeurs et le fractionnement de colonnes, et peut écrire dans des tables de lakehouse. Un notebook PySpark peut lire les fichiers CSV, appliquer le même nettoyage et écrire une table Delta. Les deux gèrent ce volume.
  options:
    a: { en: "The SQL analytics endpoint is read-only and can't create or load tables.", fr: "Le point de terminaison d'analytique SQL est en lecture seule et ne peut ni créer ni charger de tables." }
    c: { en: "An update policy writes to eventhouse tables, not to a Delta table of a lakehouse.", fr: "Une stratégie de mise à jour écrit dans des tables d'eventhouse, pas dans une table Delta de lakehouse." }
    e: { en: "A copy job performs only lightweight transformations; it can't replace values or split columns.", fr: "Un travail de copie n'effectue que des transformations légères ; il ne peut ni remplacer de valeurs ni fractionner de colonnes." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
  - title: What is Dataflow Gen2?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-overview
