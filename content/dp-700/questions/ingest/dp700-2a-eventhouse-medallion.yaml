id: dp700-2a-eventhouse-medallion
objective: "2.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have an eventhouse named **EH3** that contains a KQL database named **FleetDB**. An eventstream ingests raw GPS events from trucks into a table named **BronzeGps**.

    You need to implement a medallion loading pattern inside FleetDB by using KQL features only. The solution must meet the requirements shown in the answer area.

    What should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse nommé **EH3** qui contient une base de données KQL nommée **FleetDB**. Un flux d'événements ingère les événements GPS bruts des camions dans une table nommée **BronzeGps**.

    Vous devez implémenter un modèle de chargement en médaillon dans FleetDB en utilisant uniquement des fonctionnalités KQL. La solution doit satisfaire les exigences présentées dans la zone de réponse.

    Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: update, text: { en: "An update policy on SilverGps", fr: "Une stratégie de mise à jour sur SilverGps" } }
    - { id: mv, text: { en: "A materialized view that uses arg_max()", fr: "Une vue matérialisée qui utilise arg_max()" } }
    - { id: onelake, text: { en: "OneLake availability on SilverGps", fr: "La disponibilité OneLake sur SilverGps" } }
    - { id: retention, text: { en: "A retention policy with a soft-delete period of 0s on BronzeGps", fr: "Une stratégie de rétention avec une période de suppression réversible de 0s sur BronzeGps" } }
    - { id: cache, text: { en: "A caching policy on SilverGps", fr: "Une stratégie de mise en cache sur SilverGps" } }
    - { id: shortcut, text: { en: "A OneLake shortcut in FleetDB", fr: "Un raccourci OneLake dans FleetDB" } }
  targets:
    - id: silver
      text: { en: "Parse BronzeGps into a typed table named SilverGps when the events are ingested", fr: "Analyser BronzeGps vers une table typée nommée SilverGps au moment de l'ingestion des événements" }
    - id: gold
      text: { en: "Return the latest position of each truck, always up to date, for a real-time dashboard", fr: "Renvoyer la dernière position de chaque camion, toujours à jour, pour un tableau de bord en temps réel" }
    - id: delta
      text: { en: "Let Spark notebooks read SilverGps as a Delta table without a copy job", fr: "Permettre aux notebooks Spark de lire SilverGps comme une table Delta sans travail de copie" }
    - id: purge
      text: { en: "Stop keeping the raw events in BronzeGps once they're transformed", fr: "Ne plus conserver les événements bruts dans BronzeGps une fois transformés" }
answer:
  mapping: { silver: update, gold: mv, delta: onelake, purge: retention }
explanation:
  correct:
    en: |
      An update policy runs a query on the rows ingested into a source table and writes the result to the target table. A materialized view with arg_max(Timestamp, *) by truck keeps one up-to-date record per truck and returns fresh results by combining its materialized part with new rows. OneLake availability exposes the table as Delta for Spark. A soft-delete period of 0s removes the source rows once the transactional update policy has run.
    fr: |
      Une stratégie de mise à jour exécute une requête sur les lignes ingérées dans une table source et écrit le résultat dans la table cible. Une vue matérialisée avec arg_max(Timestamp, *) par camion conserve un enregistrement à jour par camion et renvoie des résultats frais en combinant sa partie matérialisée avec les nouvelles lignes. La disponibilité OneLake expose la table au format Delta pour Spark. Une période de suppression réversible de 0s retire les lignes sources une fois la stratégie de mise à jour transactionnelle exécutée.
  options:
    cache: { en: "A caching policy decides which data stays in hot cache; it doesn't transform, expose or delete data.", fr: "Une stratégie de mise en cache détermine les données conservées dans le cache chaud ; elle ne transforme, n'expose ni ne supprime de données." }
    shortcut: { en: "A shortcut in FleetDB reads external data from the eventhouse; it doesn't expose FleetDB tables to Spark.", fr: "Un raccourci dans FleetDB lit des données externes depuis l'eventhouse ; il n'expose pas les tables de FleetDB à Spark." }
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
  - title: Create materialized view
    url: https://learn.microsoft.com/en-us/kusto/management/materialized-views/materialized-view-create?view=microsoft-fabric
