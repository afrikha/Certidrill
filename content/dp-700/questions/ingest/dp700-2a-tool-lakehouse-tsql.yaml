id: dp700-2a-tool-lakehouse-tsql
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named **LH_Sales**. Notebooks load the Delta tables of LH_Sales.

    A team of SQL developers must build new aggregated tables from the LH_Sales tables by using only T-SQL. When late corrections arrive, the developers must fix the aggregated tables by using T-SQL UPDATE statements. The solution must minimize the number of copy steps.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé **LH_Sales**. Des notebooks chargent les tables Delta de LH_Sales.

    Une équipe de développeurs SQL doit créer de nouvelles tables agrégées à partir des tables de LH_Sales en utilisant uniquement T-SQL. Quand des corrections tardives arrivent, les développeurs doivent corriger les tables agrégées avec des instructions T-SQL UPDATE. La solution doit réduire au minimum le nombre d'étapes de copie.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create the aggregated tables in the SQL analytics endpoint of LH_Sales by using CREATE TABLE AS SELECT statements.", fr: "Créer les tables agrégées dans le point de terminaison d'analytique SQL de LH_Sales avec des instructions CREATE TABLE AS SELECT." } }
    - { id: b, text: { en: "Create a Dataflow Gen2 that copies the LH_Sales tables to a warehouse, and then build the aggregated tables there by using T-SQL.", fr: "Créer un Dataflow Gen2 qui copie les tables de LH_Sales dans un entrepôt, puis y créer les tables agrégées en T-SQL." } }
    - { id: c, text: { en: "Create a KQL database with shortcuts to the LH_Sales tables, and build the aggregated tables by using update policies.", fr: "Créer une base de données KQL avec des raccourcis vers les tables de LH_Sales, et créer les tables agrégées avec des stratégies de mise à jour." } }
    - { id: d, text: { en: "Create a warehouse in the same workspace, and build the aggregated tables with CREATE TABLE AS SELECT statements that read LH_Sales by using three-part names.", fr: "Créer un entrepôt dans le même espace de travail, et créer les tables agrégées avec des instructions CREATE TABLE AS SELECT qui lisent LH_Sales avec des noms en trois parties." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Only a warehouse supports T-SQL DDL and DML such as CREATE TABLE AS SELECT and UPDATE. Within the same workspace, warehouse queries can read the SQL analytics endpoint of a lakehouse with three-part names, so CTAS builds the aggregated tables directly from the LH_Sales tables, with no separate copy step.
    fr: |
      Seul un entrepôt prend en charge le DDL et le DML T-SQL comme CREATE TABLE AS SELECT et UPDATE. Dans le même espace de travail, les requêtes d'entrepôt peuvent lire le point de terminaison d'analytique SQL d'un lakehouse avec des noms en trois parties : CTAS crée donc les tables agrégées directement à partir des tables de LH_Sales, sans étape de copie distincte.
  options:
    a: { en: "The SQL analytics endpoint is read-only: creating tables and running UPDATE statements are supported only in a warehouse.", fr: "Le point de terminaison d'analytique SQL est en lecture seule : la création de tables et les instructions UPDATE ne sont prises en charge que dans un entrepôt." }
    b: { en: "Copying the tables to the warehouse first adds a copy step that cross-database queries make unnecessary.", fr: "Copier d'abord les tables dans l'entrepôt ajoute une étape de copie que les requêtes inter-bases rendent inutile." }
    c: { en: "Update policies are written in KQL, not T-SQL, and the developers must fix rows with T-SQL UPDATE statements.", fr: "Les stratégies de mise à jour s'écrivent en KQL, pas en T-SQL, et les développeurs doivent corriger des lignes avec des instructions T-SQL UPDATE." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
  - title: Transactions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/transactions
