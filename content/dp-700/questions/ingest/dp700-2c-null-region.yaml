id: dp700-2c-null-region
objective: "2.2.9"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a notebook that reads a lakehouse table into a PySpark DataFrame named df. In some rows, the Region column is null.

    You need to replace the null values of Region with the string Unknown. All the rows of df must be kept, and the existing Region values must not change.

    Which two code snippets achieve the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un notebook qui lit une table de lakehouse dans un DataFrame PySpark nommé df. Dans certaines lignes, la colonne Region est null.

    Vous devez remplacer les valeurs null de Region par la chaîne Unknown. Toutes les lignes de df doivent être conservées, et les valeurs Region existantes ne doivent pas changer.

    Quels sont les deux extraits de code qui permettent d'atteindre l'objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`df = df.withColumn(\"Region\", F.lit(\"Unknown\"))`" }
    - { id: b, text: "`df = df.fillna({\"Region\": \"Unknown\"})`" }
    - { id: c, text: "`df = df.dropna(subset=[\"Region\"])`" }
    - { id: d, text: "`df = df.replace(\"null\", \"Unknown\", subset=[\"Region\"])`" }
    - { id: e, text: "`df = df.withColumn(\"Region\", F.coalesce(F.col(\"Region\"), F.lit(\"Unknown\")))`" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      fillna with a dictionary replaces the nulls of the listed columns with the given value. coalesce returns its first non-null argument, so it keeps the existing Region value and returns Unknown only when Region is null.
    fr: |
      fillna avec un dictionnaire remplace les valeurs null des colonnes indiquées par la valeur donnée. coalesce renvoie son premier argument non null : il conserve la valeur Region existante et ne renvoie Unknown que lorsque Region est null.
  options:
    c:
      en: |
        dropna removes the rows whose Region is null instead of keeping them.
      fr: |
        dropna supprime les lignes dont Region est null au lieu de les conserver.
    a:
      en: |
        `F.lit("Unknown")` overwrites the Region value of every row, including the existing values.
      fr: |
        `F.lit("Unknown")` écrase la valeur Region de toutes les lignes, y compris les valeurs existantes.
    d:
      en: |
        replace matches the four-character string `"null"`, not null values.
      fr: |
        replace recherche la chaîne de quatre caractères `"null"`, pas les valeurs null.
references:
  - title: Shape and clean data
    url: https://learn.microsoft.com/en-us/training/modules/fabric-transform-data-notebooks/3-shape-clean-data
