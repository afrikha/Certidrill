id: dp700-cs3a-accelerated-shortcut
objective: "2.3.3"
type: single
caseStudy: dp700-cs3a-proseware
difficulty: 3
status: draft
stem:
  en: |
    You need to make maintenance_history available to the KQL queries of the analysts. The solution must meet the requirements. What should you do?
  fr: |
    Vous devez rendre maintenance_history disponible pour les requêtes KQL des analystes. La solution doit respecter les exigences. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In TurbineDB, create a OneLake shortcut to maintenance_history without query acceleration, and query it by using external_table()."
        fr: "Dans TurbineDB, créer un raccourci OneLake vers maintenance_history sans accélération des requêtes, et l'interroger avec external_table()."
    - id: b
      text:
        en: "In TurbineDB, create a OneLake shortcut to maintenance_history, enable query acceleration, and set a caching period."
        fr: "Dans TurbineDB, créer un raccourci OneLake vers maintenance_history, activer l'accélération des requêtes et définir une période de mise en cache."
    - id: c
      text:
        en: "Create a pipeline that copies maintenance_history every night into a native table of TurbineDB after the notebook rewrites it."
        fr: "Créer un pipeline qui copie chaque nuit maintenance_history dans une table native de TurbineDB après sa réécriture par le notebook."
    - id: d
      text:
        en: "Enable OneLake availability on TurbineDB, and run the joins from the SQL analytics endpoint of LH-Maintenance."
        fr: "Activer la disponibilité OneLake sur TurbineDB, et exécuter les jointures depuis le point de terminaison d'analytique SQL de LH-Maintenance."
answer: { optionId: b }
explanation:
  correct:
    en: |
      An accelerated OneLake shortcut leaves the Delta table in the lakehouse and caches its data in the eventhouse as it lands in OneLake, so there is no ingestion process or second copy to manage. Queries over the cached data are much faster than over a standard shortcut, and the extra cost is small for a dimension-like table of this size.
    fr: |
      Un raccourci OneLake accéléré laisse la table Delta dans le lakehouse et met ses données en cache dans l'eventhouse à mesure qu'elles arrivent dans OneLake : il n'y a ni processus d'ingestion ni deuxième copie à gérer. Les requêtes sur les données en cache sont beaucoup plus rapides que sur un raccourci standard, et le coût supplémentaire est faible pour une table de type dimension de cette taille.
  options:
    a:
      en: |
        A standard shortcut avoids a copy, but each query reads the files from OneLake without indexes, so it does not give the lowest latency for tiles that refresh every 30 seconds.
      fr: |
        Un raccourci standard évite une copie, mais chaque requête lit les fichiers dans OneLake sans index : il n'offre pas la latence la plus faible pour des vignettes actualisées toutes les 30 secondes.
    c:
      en: |
        A nightly copy creates the ingestion process and the second copy of the table that Proseware does not want to maintain.
      fr: |
        Une copie nocturne crée le processus d'ingestion et la deuxième copie de la table que Proseware ne veut pas maintenir.
    d:
      en: |
        OneLake availability exposes eventhouse data to other engines; it does not bring maintenance_history into KQL queries, and the analysts must join the data in KQL.
      fr: |
        La disponibilité OneLake expose les données de l'eventhouse aux autres moteurs ; elle n'amène pas maintenance_history dans les requêtes KQL, alors que les analystes doivent joindre les données en KQL.
references:
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
