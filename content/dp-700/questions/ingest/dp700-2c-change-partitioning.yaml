id: dp700-2c-change-partitioning
objective: "2.3.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a KQL database that contains an accelerated OneLake shortcut named events. The shortcut points to a Delta table in a lakehouse that is partitioned by EventDate. Several KQL functions and dashboards query the shortcut by its name.

    Data engineers must change the partitioning of the Delta table to EventDate and Region. After the change, queries on events must be accelerated again. The shortcut must be kept.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données KQL qui contient un raccourci OneLake accéléré nommé events. Le raccourci pointe vers une table Delta d'un lakehouse partitionnée par EventDate. Plusieurs fonctions KQL et tableaux de bord interrogent le raccourci par son nom.

    Les ingénieurs données doivent changer le partitionnement de la table Delta en EventDate et Region. Après la modification, les requêtes sur events doivent de nouveau être accélérées. Le raccourci doit être conservé.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: disable, text: { en: "Disable the query acceleration policy of events.", fr: "Désactiver la stratégie d'accélération des requêtes d'events." } }
    - { id: rewrite, text: { en: "Rewrite the Delta table partitioned by EventDate and Region.", fr: "Réécrire la table Delta partitionnée par EventDate et Region." } }
    - { id: enable, text: { en: "Enable the query acceleration policy of events.", fr: "Activer la stratégie d'accélération des requêtes d'events." } }
    - { id: delete, text: { en: "Delete the events shortcut.", fr: "Supprimer le raccourci events." } }
    - { id: optimize, text: { en: "Run OPTIMIZE on the Delta table.", fr: "Exécuter OPTIMIZE sur la table Delta." } }
    - { id: hotzero, text: { en: "Set the Hot property of the policy to 0 days.", fr: "Définir la propriété Hot de la stratégie sur 0 jour." } }
answer:
  sequence: [ disable, rewrite, enable ]
explanation:
  correct:
    en: |
      Query acceleration assumes that advanced Delta features such as partitioning and column mapping don't change. To change them, you disable the policy, make the change, and then re-enable the policy, which accelerates the rewritten files.
    fr: |
      L'accélération des requêtes suppose que les fonctionnalités Delta avancées comme le partitionnement et le mappage de colonnes ne changent pas. Pour les modifier, vous désactivez la stratégie, effectuez la modification, puis réactivez la stratégie, qui accélère les fichiers réécrits.
  options:
    delete:
      en: "Deleting the shortcut breaks the functions and dashboards that reference it, and the shortcut must be kept."
      fr: "Supprimer le raccourci casse les fonctions et tableaux de bord qui le référencent, et le raccourci doit être conservé."
    optimize:
      en: "OPTIMIZE compacts files but doesn't change the partitioning, and it isn't needed for acceleration."
      fr: "OPTIMIZE compacte les fichiers mais ne change pas le partitionnement, et il n'est pas nécessaire à l'accélération."
    hotzero:
      en: "The minimum value of Hot is one day; you disable the policy with IsEnabled instead."
      fr: "La valeur minimale de Hot est d'un jour ; c'est IsEnabled qui désactive la stratégie."
references:
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
