id: dp700-2d-ss-job-retry
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Prod** that contains a lakehouse named **LH-Telemetry** and a notebook named **NB-Ingest**. NB-Ingest runs a PySpark structured streaming query that reads from an Azure event hub and writes to a Delta table in LH-Telemetry with a checkpoint location.

    An engineer starts NB-Ingest manually. When the query fails, the stream stays stopped until someone restarts the notebook.

    You need the stream to run continuously in production and to restart automatically after a failure. The solution must minimize development effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Prod** qui contient un lakehouse nommé **LH-Telemetry** et un notebook nommé **NB-Ingest**. NB-Ingest exécute une requête de streaming structuré PySpark qui lit un hub d'événements Azure et écrit dans une table Delta de LH-Telemetry avec un emplacement de point de contrôle.

    Un ingénieur démarre NB-Ingest manuellement. Quand la requête échoue, le flux reste arrêté jusqu'à ce que quelqu'un redémarre le notebook.

    Le flux doit s'exécuter en continu en production et redémarrer automatiquement après un échec. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add NB-Ingest to a pipeline that is scheduled to run every five minutes.", fr: "Ajouter NB-Ingest à un pipeline planifié pour s'exécuter toutes les cinq minutes." }
    - id: b
      text: { en: "Enable high concurrency mode for notebooks in the WS-Prod settings.", fr: "Activer le mode haute concurrence pour les notebooks dans les paramètres de WS-Prod." }
    - id: c
      text: { en: "Run the code as a Spark job definition that has the retry policy enabled.", fr: "Exécuter le code comme une définition de travail Spark dont la stratégie de nouvelle tentative est activée." }
    - id: d
      text: { en: "Change the trigger of the query to availableNow and schedule NB-Ingest daily.", fr: "Changer le déclencheur de la requête en availableNow et planifier NB-Ingest chaque jour." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      For continuous production streams, Microsoft recommends a Spark job definition, a non-interactive job, rather than a notebook. Its retry policy, on the **Optimization** tab, restarts the job after a failure with a maximum number of retries and an interval between them. The existing checkpoint lets each restart resume where the stream stopped.
    fr: |-
      Pour les flux de production continus, Microsoft recommande une définition de travail Spark, un travail non interactif, plutôt qu'un notebook. Sa stratégie de nouvelle tentative, dans l'onglet **Optimisation**, redémarre le travail après un échec, avec un nombre maximal de tentatives et un intervalle entre elles. Le point de contrôle existant permet à chaque redémarrage de reprendre là où le flux s'est arrêté.
  options:
    a:
      en: |-
        A continuous stream never ends, so scheduled runs would overlap and start new queries on the same checkpoint instead of restarting a failed one.
      fr: |-
        Un flux continu ne se termine jamais : les exécutions planifiées se chevaucheraient et démarreraient de nouvelles requêtes sur le même point de contrôle au lieu de redémarrer une requête en échec.
    b:
      en: |-
        High concurrency mode lets several notebooks share a Spark session; it doesn't restart a failed query.
      fr: |-
        Le mode haute concurrence permet à plusieurs notebooks de partager une session Spark ; il ne redémarre pas une requête en échec.
    d:
      en: |-
        availableNow processes the available data and then stops, so the data would arrive once a day instead of continuously.
      fr: |-
        availableNow traite les données disponibles puis s'arrête : les données arriveraient une fois par jour au lieu d'arriver en continu.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
  - title: How to create an Apache Spark job definition in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/create-spark-job-definition
