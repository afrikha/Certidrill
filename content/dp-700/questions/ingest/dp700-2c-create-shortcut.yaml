id: dp700-2c-create-shortcut
objective: "2.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database named FleetDB and a lakehouse named LH_Sales in the same Fabric workspace. LH_Sales contains a Delta table named customers.

    You need to query customers from a KQL queryset without ingesting the data into FleetDB.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'une base de données KQL nommée FleetDB et d'un lakehouse nommé LH_Sales dans le même espace de travail Fabric. LH_Sales contient une table Delta nommée customers.

    Vous devez interroger customers depuis un ensemble de requêtes KQL sans ingérer les données dans FleetDB.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: new, text: { en: "In FleetDB, select **New** > **OneLake shortcut**.", fr: "Dans FleetDB, sélectionner **New** > **OneLake shortcut**." } }
    - { id: source, text: { en: "Under **Internal sources**, select **Microsoft OneLake**, and then select LH_Sales.", fr: "Sous **Internal sources**, sélectionner **Microsoft OneLake**, puis LH_Sales." } }
    - { id: table, text: { en: "Expand **Tables**, select customers, and then select **Create**.", fr: "Développer **Tables**, sélectionner customers, puis sélectionner **Create**." } }
    - { id: query, text: { en: "Run a query that starts with `external_table('customers')`.", fr: "Exécuter une requête qui commence par `external_table('customers')`." } }
    - { id: create, text: { en: "Run `.create table customers` in FleetDB.", fr: "Exécuter `.create table customers` dans FleetDB." } }
    - { id: avail, text: { en: "Enable OneLake availability on FleetDB.", fr: "Activer la disponibilité OneLake sur FleetDB." } }
    - { id: tablefn, text: { en: "Run a query that starts with `table('customers')`.", fr: "Exécuter une requête qui commence par `table('customers')`." } }
answer:
  sequence: [ new, source, table, query ]
explanation:
  correct:
    en: |
      You create the shortcut from the KQL database with New > OneLake shortcut, choose Microsoft OneLake and the lakehouse, select the table, and create the shortcut, which then appears under Shortcuts. The shortcut is queried as an external table with external_table().
    fr: |
      Vous créez le raccourci depuis la base de données KQL avec New > OneLake shortcut, choisissez Microsoft OneLake et le lakehouse, sélectionnez la table et créez le raccourci, qui apparaît alors sous Shortcuts. Le raccourci s'interroge comme une table externe avec external_table().
  options:
    create:
      en: "Creating a native table prepares an ingestion target, which the requirement excludes."
      fr: "Créer une table native prépare une cible d'ingestion, ce que l'exigence exclut."
    avail:
      en: "OneLake availability exposes FleetDB data to other engines; it isn't needed to read lakehouse data from KQL."
      fr: "La disponibilité OneLake expose les données de FleetDB aux autres moteurs ; elle n'est pas nécessaire pour lire des données de lakehouse depuis KQL."
    tablefn:
      en: "table() doesn't resolve shortcuts; external_table() does."
      fr: "table() ne résout pas les raccourcis ; external_table() le fait."
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
  - title: Query acceleration over OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration
