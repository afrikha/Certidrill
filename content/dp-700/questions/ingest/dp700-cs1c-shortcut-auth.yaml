id: dp700-cs1c-shortcut-auth
objective: "2.2.3"
type: single
caseStudy: dp700-cs1c-trey-research
difficulty: 2
status: draft
stem:
  en: |-
    You plan to create an Azure Data Lake Storage Gen2 shortcut in LH_Assays that points to the plate-readers folder. The storage administrators will configure sttrinstruments as needed. You need to meet ingestion requirement 1. Which authentication kind should the shortcut connection use?
  fr: |-
    Vous prévoyez de créer dans LH_Assays un raccourci Azure Data Lake Storage Gen2 qui pointe vers le dossier plate-readers. Les administrateurs du stockage configureront sttrinstruments selon les besoins. Vous devez satisfaire l'exigence d'ingestion 1. Quel type d'authentification la connexion du raccourci doit-elle utiliser ?
body:
  options:
    - { id: a, text: { en: "Organizational account", fr: "Compte d'organisation" } }
    - { id: b, text: { en: "Service principal", fr: "Principal de service" } }
    - { id: c, text: { en: "Shared Access Signature (SAS)", fr: "Signature d'accès partagé (SAS)" } }
    - { id: d, text: { en: "Workspace identity", fr: "Identité d'espace de travail" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Trusted workspace access lets a workspace that has a workspace identity reach a firewall-enabled ADLS Gen2 account, after the storage administrators add a resource instance rule for TR-Lab and grant the identity a Storage Blob Data role. The workspace identity is managed by Fabric, so there is no user account and no secret to rotate.
    fr: |-
      L'accès à l'espace de travail approuvé permet à un espace de travail doté d'une identité d'espace de travail d'atteindre un compte ADLS Gen2 protégé par un pare-feu, une fois que les administrateurs du stockage ont ajouté une règle d'instance de ressource pour TR-Lab et accordé à l'identité un rôle Storage Blob Data. L'identité d'espace de travail est gérée par Fabric : il n'y a donc ni compte d'utilisateur ni secret à renouveler.
  options:
    a:
      en: |-
        An organizational account is supported with trusted workspace access, but it is a user account, which the requirement forbids.
      fr: |-
        Un compte d'organisation est pris en charge avec l'accès à l'espace de travail approuvé, mais c'est un compte d'utilisateur, ce que l'exigence interdit.
    b:
      en: |-
        A service principal is supported with trusted workspace access, but its client secret or certificate must be rotated.
      fr: |-
        Un principal de service est pris en charge avec l'accès à l'espace de travail approuvé, mais son secret client ou son certificat doit être renouvelé.
    c:
      en: |-
        A SAS token is a secret that expires and must be renewed, and SAS is not one of the authentication methods supported for shortcuts that use trusted workspace access.
      fr: |-
        Un jeton SAS est un secret qui expire et doit être renouvelé, et la SAS ne fait pas partie des méthodes d'authentification prises en charge pour les raccourcis qui utilisent l'accès à l'espace de travail approuvé.
references:
  - title: Trusted workspace access
    url: https://learn.microsoft.com/en-us/fabric/security/security-trusted-workspace-access
  - title: Create an Azure Data Lake Storage Gen2 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-adls-shortcut
