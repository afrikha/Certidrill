id: dp700-2b-denorm-kql-lookup
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a KQL database that contains two tables:

    - Telemetry: several billion rows with the columns Timestamp, DeviceId and Temp
    - Devices: 2,000 rows with the columns DeviceId, Model and Site

    You need a query that adds Model and Site to every Telemetry row. Telemetry rows whose DeviceId isn't in Devices must be kept, and the output must contain a single DeviceId column.

    Which query should you use?
  fr: |
    Vous disposez d'une base de données KQL qui contient deux tables :

    - Telemetry : plusieurs milliards de lignes avec les colonnes Timestamp, DeviceId et Temp
    - Devices : 2 000 lignes avec les colonnes DeviceId, Model et Site

    Vous avez besoin d'une requête qui ajoute Model et Site à chaque ligne de Telemetry. Les lignes de Telemetry dont le DeviceId n'est pas dans Devices doivent être conservées, et la sortie doit contenir une seule colonne DeviceId.

    Quelle requête devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Telemetry | lookup kind=leftouter Devices on DeviceId" }
    - { id: b, text: "Devices | lookup kind=leftouter Telemetry on DeviceId" }
    - { id: c, text: "Telemetry | lookup kind=inner Devices on DeviceId" }
    - { id: d, text: "Devices | join kind=inner Telemetry on DeviceId" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      lookup extends a fact table (left) with values from a dimension table (right), and leftouter, its default kind, keeps every left row, with nulls when there's no match. The right table is broadcast, so it must be small, which suits Devices. Unlike join, lookup doesn't repeat the key columns of the right table, so the output has one DeviceId column.
    fr: |
      lookup étend une table de faits (à gauche) avec des valeurs d'une table de dimension (à droite), et leftouter, son type par défaut, conserve chaque ligne de gauche, avec des valeurs NULL en l'absence de correspondance. La table de droite est diffusée (broadcast) : elle doit être petite, ce qui convient à Devices. Contrairement à join, lookup ne répète pas les colonnes clés de la table de droite : la sortie n'a qu'une colonne DeviceId.
  options:
    c: { en: "kind=inner drops the Telemetry rows whose DeviceId has no match in Devices.", fr: "kind=inner supprime les lignes de Telemetry dont le DeviceId n'a pas de correspondance dans Devices." }
    b: { en: "With the tables reversed, the huge Telemetry table would be broadcast, and the query would fail when the right side exceeds several tens of MB; it would also keep devices rather than telemetry rows.", fr: "Avec les tables inversées, l'énorme table Telemetry serait diffusée, et la requête échouerait dès que le côté droit dépasse quelques dizaines de Mo ; elle conserverait aussi les appareils plutôt que les lignes de télémétrie." }
    d: { en: "An inner join drops unmatched telemetry rows, and join repeats the right key column in the output.", fr: "Une jointure interne supprime les lignes de télémétrie sans correspondance, et join répète la colonne clé de droite dans la sortie." }
references:
  - title: lookup operator
    url: https://learn.microsoft.com/en-us/kusto/query/lookup-operator?view=microsoft-fabric
