id: dp700-2d-kql-policy-hotarea
objective: "2.3.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named **DB-IoT**. A table named **Telemetry** has the update policy shown in the following table. Data is ingested into **RawTelemetry** with extent tags that identify the source plant.

    Answer each prompt by selecting the property that you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **DB-IoT**. Une table nommée **Telemetry** a la stratégie de mise à jour présentée dans le tableau suivant. Les données sont ingérées dans **RawTelemetry** avec des étiquettes d'étendue (extent tags) qui identifient l'usine d'origine.

    Répondez à chaque consigne en sélectionnant la propriété que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The ingestion into RawTelemetry must fail when ParseTelemetry() fails.", fr: "L'ingestion dans RawTelemetry doit échouer quand ParseTelemetry() échoue." }
    - id: p2
      text: { en: "The extents created in Telemetry must carry the extent tags specified when ingesting into RawTelemetry.", fr: "Les extents créés dans Telemetry doivent porter les étiquettes d'étendue indiquées lors de l'ingestion dans RawTelemetry." }
  grid:
    caption: { en: "Update policy of the Telemetry table", fr: "Stratégie de mise à jour de la table Telemetry" }
    header: [{ en: "Property", fr: "Propriété" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: IsEnabled, area: isEnabled }, { text: "true" }]
      - [{ text: Source, area: source }, { text: RawTelemetry }]
      - [{ text: Query, area: query }, { text: ParseTelemetry() }]
      - [{ text: IsTransactional, area: isTransactional }, { text: "false" }]
      - [{ text: PropagateIngestionProperties, area: propagate }, { text: "false" }]
answer:
  values: { p1: isTransactional, p2: propagate }
explanation:
  correct:
    en: |-
      When `IsTransactional` is `false`, a failed policy leaves the data in the source table and the ingestion succeeds; set to `true`, the failure makes the ingestion into both tables fail. `PropagateIngestionProperties` set to `true` applies the properties specified during ingestion into the source table, such as extent tags and creation time, to the target table.
    fr: |-
      Quand `IsTransactional` vaut `false`, une stratégie en échec laisse les données dans la table source et l'ingestion réussit ; avec `true`, l'échec fait échouer l'ingestion dans les deux tables. `PropagateIngestionProperties` défini sur `true` applique à la table cible les propriétés indiquées lors de l'ingestion dans la table source, comme les étiquettes d'étendue et l'heure de création.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
