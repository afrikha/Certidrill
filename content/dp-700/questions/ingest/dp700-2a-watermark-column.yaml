id: dp700-2a-watermark-column
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named **Lakehouse1**. You plan to create a copy job that incrementally copies a table named **dbo.Invoices** from an Azure SQL database to Lakehouse1. CDC isn't enabled on the database and can't be enabled.

    dbo.Invoices contains the following columns.

    | Column | Data type | Behavior |
    | --- | --- | --- |
    | InvoiceID | int | Identity value assigned when a row is inserted |
    | InvoiceDate | date | Date of the invoice, never changes |
    | UpdatedAt | datetime2 | Set to the current time when a row is inserted or updated |
    | Status | varchar(20) | Current status of the invoice |

    Each run must copy the invoices that were inserted or updated since the previous run.

    Which column should you select as the incremental column?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé **Lakehouse1**. Vous prévoyez de créer un travail de copie qui copie de façon incrémentielle une table nommée **dbo.Invoices** d'une base de données Azure SQL vers Lakehouse1. La CDC n'est pas activée sur la base de données et ne peut pas l'être.

    dbo.Invoices contient les colonnes suivantes.

    | Colonne | Type de données | Comportement |
    | --- | --- | --- |
    | InvoiceID | int | Valeur d'identité attribuée à l'insertion d'une ligne |
    | InvoiceDate | date | Date de la facture, ne change jamais |
    | UpdatedAt | datetime2 | Définie sur l'heure actuelle à l'insertion ou à la mise à jour d'une ligne |
    | Status | varchar(20) | Statut actuel de la facture |

    Chaque exécution doit copier les factures insérées ou mises à jour depuis l'exécution précédente.

    Quelle colonne devez-vous sélectionner comme colonne incrémentielle ?
body:
  options:
    - { id: a, text: InvoiceID }
    - { id: b, text: InvoiceDate }
    - { id: c, text: UpdatedAt }
    - { id: d, text: Status }
answer: { optionId: c }
explanation:
  correct:
    en: A watermark-based incremental copy reads the rows whose incremental column is greater than the value saved by the last successful run. Only UpdatedAt increases on both inserts and updates, so it is the only column that detects changed invoices. Datetime is one of the supported incremental column types, with rowversion, date, integer and string interpreted as datetime.
    fr: |
      Une copie incrémentielle basée sur un filigrane lit les lignes dont la colonne incrémentielle est supérieure à la valeur enregistrée par la dernière exécution réussie. Seule UpdatedAt augmente à la fois lors des insertions et des mises à jour : c'est la seule colonne qui détecte les factures modifiées. Datetime fait partie des types de colonne incrémentielle pris en charge, avec rowversion, date, entier et chaîne interprétée comme datetime.
  options:
    a: { en: "An identity value grows only when rows are inserted; updated invoices keep their InvoiceID and would never be copied again.", fr: "Une valeur d'identité n'augmente qu'à l'insertion de lignes ; les factures mises à jour gardent leur InvoiceID et ne seraient plus jamais copiées." }
    b: { en: "InvoiceDate never changes, so an update to an old invoice isn't detected.", fr: "InvoiceDate ne change jamais : la mise à jour d'une ancienne facture n'est pas détectée." }
    d: { en: "Status is a text value that doesn't increase over time, so it can't serve as a watermark.", fr: "Status est une valeur texte qui n'augmente pas dans le temps : elle ne peut pas servir de filigrane." }
references:
  - title: What is Copy job in Data Factory for Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
