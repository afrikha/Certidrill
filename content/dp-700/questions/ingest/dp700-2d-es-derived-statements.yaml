id: dp700-2d-es-derived-statements
objective: "2.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS-Fleet** that contains an eventstream named **ES-Fleet**. ES-Fleet has an Azure event hub source. Its default stream feeds a Filter operator that keeps the events of vehicles whose engine temperature is too high. The output of the Filter operator is published as a derived stream named **DS-Overheat**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS-Fleet** qui contient un flux d'événements nommé **ES-Fleet**. ES-Fleet a une source de hub d'événements Azure. Son flux par défaut alimente un opérateur Filter qui garde les événements des véhicules dont la température moteur est trop élevée. La sortie de l'opérateur Filter est publiée sous la forme d'un flux dérivé nommé **DS-Overheat**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Users who browse the Real-Time hub can find DS-Overheat there.
        fr: |-
          Les utilisateurs qui parcourent le hub Real-Time peuvent y trouver DS-Overheat.
    - id: s2
      text:
        en: |-
          A user who has the Viewer role in WS-Fleet can add a Manage fields operator after DS-Overheat and publish ES-Fleet.
        fr: |-
          Un utilisateur qui a le rôle Viewer dans WS-Fleet peut ajouter un opérateur Manage fields après DS-Overheat et publier ES-Fleet.
    - id: s3
      text:
        en: |-
          You can connect the output of the Filter operator directly to an Eventhouse destination that uses the Direct ingestion mode.
        fr: |-
          Vous pouvez connecter la sortie de l'opérateur Filter directement à une destination Eventhouse qui utilise le mode d'ingestion directe.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      A derived stream is a logical stream created from the default stream by transformations such as filters; it's available in the Real-Time hub for further consumption. Adding operators or destinations and publishing an eventstream requires Contributor or higher permissions in the workspace. An Eventhouse destination attached to the output of an operator uses the **Event processing before ingestion** mode; Direct ingestion takes the default stream or a derived stream without processing.
    fr: |-
      Un flux dérivé est un flux logique créé à partir du flux par défaut par des transformations comme des filtres ; il est disponible dans le hub Real-Time pour d'autres usages. Ajouter des opérateurs ou des destinations et publier un flux d'événements exige l'autorisation Contributor ou supérieure dans l'espace de travail. Une destination Eventhouse attachée à la sortie d'un opérateur utilise le mode **Traitement des événements avant l'ingestion** ; l'ingestion directe prend le flux par défaut ou un flux dérivé, sans traitement.
references:
  - title: Add a derived stream destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-derived-stream
  - title: Add an Eventhouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-kql-database
