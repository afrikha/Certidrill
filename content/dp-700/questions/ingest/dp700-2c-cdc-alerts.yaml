id: dp700-2c-cdc-alerts
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure SQL Database named PaymentsDB. Change data capture (CDC) is enabled on the dbo.Transfers table. You have a Fabric workspace that contains an eventhouse named EH_Risk and an Activator item named ACT_Risk.

    You need to meet the following requirements:

    - Capture every insert and update on dbo.Transfers as a separate event, so that the full sequence of changes is kept in EH_Risk.
    - Make each change queryable in EH_Risk within seconds.
    - Notify the fraud team through ACT_Risk when a transfer over 50,000 is inserted.
    - Minimize development effort.

    What should you use?
  fr: |
    Woodgrove Bank dispose d'une base de données Azure SQL Database nommée PaymentsDB. La capture des changements de données (CDC) est activée sur la table dbo.Transfers. Vous disposez d'un espace de travail Fabric qui contient un eventhouse nommé EH_Risk et un élément Activator nommé ACT_Risk.

    Vous devez répondre aux exigences suivantes :

    - Capturer chaque insertion et chaque mise à jour de dbo.Transfers sous forme d'événement distinct, pour conserver la séquence complète des modifications dans EH_Risk.
    - Rendre chaque modification interrogeable dans EH_Risk en quelques secondes.
    - Avertir l'équipe de lutte contre la fraude par ACT_Risk lorsqu'un virement supérieur à 50 000 est inséré.
    - Réduire au minimum l'effort de développement.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "A pipeline that runs a Copy activity every five minutes to copy the new rows of dbo.Transfers to EH_Risk"
        fr: "Un pipeline qui exécute une activité Copy toutes les cinq minutes pour copier les nouvelles lignes de dbo.Transfers vers EH_Risk"
    - id: b
      text:
        en: "An eventstream with an Azure SQL Database CDC source, an eventhouse destination, and an Activator destination"
        fr: "Un flux d'événements avec une source CDC Azure SQL Database, une destination eventhouse et une destination Activator"
    - id: c
      text:
        en: "A Spark structured streaming job that reads dbo.Transfers through JDBC and writes to EH_Risk"
        fr: "Un travail de streaming structuré Spark qui lit dbo.Transfers via JDBC et écrit dans EH_Risk"
    - id: d
      text:
        en: "A mirrored database for PaymentsDB, and a OneLake shortcut in EH_Risk to the mirrored dbo.Transfers table"
        fr: "Une base de données mise en miroir pour PaymentsDB, et un raccourci OneLake dans EH_Risk vers la table dbo.Transfers mise en miroir"
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Azure SQL Database CDC connector of an eventstream turns each captured change into an event without code. The eventhouse destination stores every change event, queryable within seconds, and the Activator destination evaluates the condition on the same stream to notify the fraud team.
    fr: |
      Le connecteur CDC Azure SQL Database d'un flux d'événements transforme chaque modification capturée en événement, sans code. La destination eventhouse stocke chaque événement de modification, interrogeable en quelques secondes, et la destination Activator évalue la condition sur le même flux pour avertir l'équipe de lutte contre la fraude.
  options:
    d:
      en: |
        Mirroring keeps a replica of the current state of the table in OneLake; it doesn't keep each change as a separate event, and nothing sends the inserts to Activator.
      fr: |
        La mise en miroir conserve une réplique de l'état actuel de la table dans OneLake ; elle ne conserve pas chaque modification sous forme d'événement distinct, et rien n'envoie les insertions à Activator.
    a:
      en: |
        A Copy activity every five minutes misses the seconds-level latency, copies only the current rows instead of each change, and doesn't notify Activator.
      fr: |
        Une activité Copy toutes les cinq minutes ne respecte pas la latence de quelques secondes, ne copie que les lignes actuelles au lieu de chaque modification et n'avertit pas Activator.
    c:
      en: |
        JDBC isn't a streaming source of change events, and a Spark job requires code, which doesn't minimize development effort.
      fr: |
        JDBC n'est pas une source de diffusion en continu d'événements de modification, et un travail Spark nécessite du code, ce qui ne réduit pas l'effort de développement.
references:
  - title: Microsoft Fabric Eventstreams Overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/overview
