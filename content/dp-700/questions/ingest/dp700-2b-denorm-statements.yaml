id: dp700-2b-denorm-statements
objective: "2.2.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are designing the dimension tables of a Fabric warehouse named DW-Sales. The source system stores products in three normalized tables: Product, Subcategory and Category.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les tables de dimension d'un entrepôt Fabric nommé DW-Sales. Le système source stocke les produits dans trois tables normalisées : Product, Subcategory et Category.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Storing the subcategory and category names in every row of a single DimProduct table adds redundant data, but it usually improves query performance and usability.
        fr: Stocker les noms de sous-catégorie et de catégorie dans chaque ligne d'une seule table DimProduct ajoute des données redondantes, mais améliore généralement les performances des requêtes et la facilité d'utilisation.
    - id: s2
      text:
        en: If you keep the three tables as a snowflake dimension, a view that joins them can deliver a denormalized product dimension to a semantic model.
        fr: Si vous conservez les trois tables sous forme de dimension en flocon, une vue qui les joint peut fournir une dimension produit dénormalisée à un modèle sémantique.
    - id: s3
      text:
        en: When you load a fact table, an INNER JOIN to DimProduct keeps the fact rows whose product key has no matching row in DimProduct.
        fr: Quand vous chargez une table de faits, une jointure INNER JOIN avec DimProduct conserve les lignes de faits dont la clé de produit n'a pas de ligne correspondante dans DimProduct.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Dimension tables should almost always be denormalized: they're small compared to facts, so the cost of redundant hierarchy attributes is outweighed by better performance and usability. A semantic model hierarchy must come from a single table, so a snowflake dimension should be delivered through a view that joins its tables. An INNER JOIN keeps only matching rows; fact rows without a dimension match need an outer join and an Unknown member, such as key -1.
    fr: |
      Les tables de dimension doivent presque toujours être dénormalisées : elles sont petites par rapport aux faits, donc le coût des attributs de hiérarchie redondants est compensé par de meilleures performances et une meilleure facilité d'utilisation. Une hiérarchie de modèle sémantique doit provenir d'une seule table : une dimension en flocon doit donc être fournie par une vue qui joint ses tables. Une jointure INNER JOIN ne conserve que les lignes correspondantes ; les lignes de faits sans correspondance dans la dimension exigent une jointure externe et un membre Unknown, comme la clé -1.
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
