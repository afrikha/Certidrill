id: dp700-2c-acceleration-statements
objective: "2.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named TelemetryDB that has a caching policy of 14 days. You create a OneLake shortcut in TelemetryDB to a Delta table in a lakehouse and set **Accelerate** to **On** without entering a caching period.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée TelemetryDB dont la stratégie de mise en cache est de 14 jours. Vous créez dans TelemetryDB un raccourci OneLake vers une table Delta d'un lakehouse et définissez **Accelerate** sur **On** sans saisir de période de mise en cache.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The shortcut accelerates the data files of the last 14 days."
        fr: "Le raccourci accélère les fichiers de données des 14 derniers jours."
    - id: s2
      text:
        en: "By default, the age of a data file is measured from the modificationTime recorded in the Delta log."
        fr: "Par défaut, l'âge d'un fichier de données se mesure à partir du modificationTime enregistré dans le journal Delta."
    - id: s3
      text:
        en: "The shortcut could also be accelerated if the Delta table had 1,200 columns."
        fr: "Le raccourci pourrait aussi être accéléré si la table Delta comportait 1 200 colonnes."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      When no caching period is set, an accelerated shortcut uses the caching period of the database that contains it, here 14 days. The period is counted from the modificationTime of each file in the Delta log. Query acceleration supports external tables of up to 900 columns.
    fr: |
      Quand aucune période de mise en cache n'est définie, un raccourci accéléré utilise la période de mise en cache de la base de données qui le contient, ici 14 jours. La période se compte à partir du modificationTime de chaque fichier dans le journal Delta. L'accélération des requêtes prend en charge les tables externes de 900 colonnes au plus.
references:
  - title: Query acceleration over OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
