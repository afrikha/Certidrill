id: dp700-2d-win-tumbling-equivalent
objective: "2.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have an eventstream named **ES-Freezers** that receives temperature readings from freezers. Each event contains the `freezerId`, `temperature` and `readTime` fields. You add a SQL operator that uses `TIMESTAMP BY readTime` and computes `AVG(temperature)` per freezer.

    The operator must output one row per freezer every 5 minutes, and each reading must be included in exactly one result.

    Which two GROUP BY clauses meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un flux d'événements nommé **ES-Freezers** qui reçoit les mesures de température de congélateurs. Chaque événement contient les champs `freezerId`, `temperature` et `readTime`. Vous ajoutez un opérateur SQL qui utilise `TIMESTAMP BY readTime` et calcule `AVG(temperature)` par congélateur.

    L'opérateur doit produire une ligne par congélateur toutes les 5 minutes, et chaque mesure doit être incluse dans exactement un résultat.

    Quelles sont les deux clauses GROUP BY qui satisfont l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: "GROUP BY freezerId, HoppingWindow(minute, 10, 5)"
    - id: b
      text: "GROUP BY freezerId, HoppingWindow(minute, 5, 5)"
    - id: c
      text: "GROUP BY freezerId, SlidingWindow(minute, 5)"
    - id: d
      text: "GROUP BY freezerId, SessionWindow(minute, 5, 5)"
    - id: e
      text: "GROUP BY freezerId, TumblingWindow(minute, 5)"
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |-
      A tumbling window of 5 minutes cuts time into contiguous segments that don't overlap, so each reading belongs to one window and a result is emitted at the end of each window. A hopping window whose hop equals its size behaves exactly like a tumbling window, so `HoppingWindow(minute, 5, 5)` gives the same result.
    fr: |-
      Une fenêtre bascule (tumbling) de 5 minutes découpe le temps en segments contigus qui ne se chevauchent pas : chaque mesure appartient à une seule fenêtre et un résultat est émis à la fin de chaque fenêtre. Une fenêtre récurrente (hopping) dont le saut est égal à la taille se comporte exactement comme une fenêtre bascule : `HoppingWindow(minute, 5, 5)` donne donc le même résultat.
  options:
    a:
      en: |-
        A 10-minute window that hops every 5 minutes produces a row every 5 minutes, but each reading is counted in two overlapping windows.
      fr: |-
        Une fenêtre de 10 minutes qui avance toutes les 5 minutes produit une ligne toutes les 5 minutes, mais chaque mesure est comptée dans deux fenêtres qui se chevauchent.
    c:
      en: |-
        A sliding window outputs a row each time an event enters or leaves the window, and a reading can belong to several windows.
      fr: |-
        Une fenêtre glissante (sliding) produit une ligne chaque fois qu'un événement entre dans la fenêtre ou en sort, et une mesure peut appartenir à plusieurs fenêtres.
    d:
      en: |-
        A session window starts with the first event and depends on the timeout between events, so its results don't follow a fixed 5-minute schedule.
      fr: |-
        Une fenêtre de session commence au premier événement et dépend du délai entre les événements : ses résultats ne suivent pas un rythme fixe de 5 minutes.
references:
  - title: Introduction to Stream Analytics windowing functions
    url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-window-functions
  - title: Hopping Window
    url: https://learn.microsoft.com/en-us/stream-analytics-query/hopping-window-azure-stream-analytics
