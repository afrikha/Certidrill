id: dp700-2d-es-filter-activator
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named **WS1** that contains an eventstream named **ES1**. ES1 receives telemetry from an Azure event hub. Each event contains the `deviceId`, `temperature` and `status` fields. ES1 sends all the events to an eventhouse named **EH1**.

    You need to also send to an Activator item named **Alerts1** only the events whose `status` field equals `error`. EH1 must keep receiving all the events. The solution must minimize development effort.

    What should you add to ES1 between the default stream and the Alerts1 destination?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé **WS1** qui contient un flux d'événements nommé **ES1**. ES1 reçoit de la télémétrie d'un hub d'événements Azure. Chaque événement contient les champs `deviceId`, `temperature` et `status`. ES1 envoie tous les événements à un eventhouse nommé **EH1**.

    Vous devez aussi envoyer à un élément Activator nommé **Alerts1** uniquement les événements dont le champ `status` est égal à `error`. EH1 doit continuer à recevoir tous les événements. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous ajouter à ES1 entre le flux par défaut et la destination Alerts1 ?
body:
  options:
    - id: a
      text: { en: "A Group by operator", fr: "Un opérateur Group by" }
    - id: b
      text: { en: "A Filter operator", fr: "Un opérateur Filter" }
    - id: c
      text: { en: "A Manage fields operator", fr: "Un opérateur Manage fields" }
    - id: d
      text: { en: "A Union operator", fr: "Un opérateur Union" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Filter operator keeps only the events that meet a condition, here `status` equals `error`. Placed on the path that leads to Alerts1 only, it leaves the path to EH1 unchanged, and it's configured on the canvas without code. Activator is one of the destinations that accept processed events directly.
    fr: |-
      L'opérateur Filter ne garde que les événements qui remplissent une condition, ici `status` égal à `error`. Placé uniquement sur le chemin qui mène à Alerts1, il ne change pas le chemin vers EH1, et il se configure sur le canevas sans code. Activator fait partie des destinations qui acceptent directement des événements traités.
  options:
    a:
      en: |-
        Group by aggregates the events over time windows; it returns aggregated values, not the individual error events.
      fr: |-
        Group by agrège les événements sur des fenêtres de temps ; il renvoie des valeurs agrégées, pas les événements d'erreur individuels.
    c:
      en: |-
        Manage fields adds, removes, renames or retypes fields; it doesn't remove events from the stream.
      fr: |-
        Manage fields ajoute, supprime, renomme des champs ou change leur type ; il ne retire aucun événement du flux.
    d:
      en: |-
        Union merges several streams into one; it doesn't select events based on a condition.
      fr: |-
        Union fusionne plusieurs flux en un seul ; il ne sélectionne pas d'événements selon une condition.
references:
