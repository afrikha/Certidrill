id: dp700-cs2c-supplier-upsert
objective: "2.2.5"
type: multi
caseStudy: dp700-cs2c-wide-world
difficulty: 2
status: draft
stem:
  en: |
    You need to configure Copy suppliers to meet the requirement for the suppliers.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer Copy suppliers pour satisfaire l'exigence relative aux fournisseurs.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the write behavior of the destination to Upsert, with SupplierID as the key column.", fr: "Définir le comportement d'écriture de la destination sur Upsert, avec SupplierID comme colonne clé." } }
    - { id: b, text: { en: "Set the table option of the destination to Auto create table.", fr: "Définir l'option de table de la destination sur Auto create table." } }
    - { id: c, text: { en: "Add a pre-copy script that runs TRUNCATE TABLE dbo.Suppliers.", fr: "Ajouter un script de pré-copie qui exécute TRUNCATE TABLE dbo.Suppliers." } }
    - { id: d, text: { en: "Enable staging in the settings of the Copy activity, with Workspace as the staging storage.", fr: "Activer le staging dans les paramètres de l'activité Copy, avec Workspace comme stockage intermédiaire." } }
    - { id: e, text: { en: "Keep the Insert write behavior and add SupplierID as a key column.", fr: "Conserver le comportement d'écriture Insert et ajouter SupplierID comme colonne clé." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      The Upsert write behavior of a warehouse destination updates the rows whose key columns match and inserts the others; SupplierID is unique in the source, as the key columns must be. A warehouse destination is loaded with the COPY statement, which reads directly only from Azure Blob Storage or ADLS Gen2, so a copy from Azure SQL Database must be staged; Workspace staging uses storage that Fabric creates automatically.
    fr: |
      Le comportement d'écriture Upsert d'une destination entrepôt met à jour les lignes dont les colonnes clés correspondent et insère les autres ; SupplierID est unique dans la source, comme doivent l'être les colonnes clés. Une destination entrepôt est chargée avec l'instruction COPY, qui ne lit directement que depuis Stockage Blob Azure ou ADLS Gen2 : une copie depuis Azure SQL Database doit donc passer par un staging ; le staging Workspace utilise un stockage créé automatiquement par Fabric.
  options:
    b: { en: "Auto create table only creates the destination table when it does not exist; dbo.Suppliers already exists, and the option does not update rows.", fr: "Auto create table crée la table de destination uniquement si elle n'existe pas ; dbo.Suppliers existe déjà, et cette option ne met pas à jour de lignes." }
    c: { en: "The source returns only the suppliers changed in the last 24 hours, so truncating the table would delete all the other suppliers.", fr: "La source ne renvoie que les fournisseurs modifiés au cours des dernières 24 heures : vider la table supprimerait tous les autres fournisseurs." }
    e: { en: "Key columns are used only by the Upsert write behavior; Insert appends every row and creates duplicates for the changed suppliers.", fr: "Les colonnes clés ne sont utilisées que par le comportement d'écriture Upsert ; Insert ajoute toutes les lignes et crée des doublons pour les fournisseurs modifiés." }
references:
  - title: Configure a warehouse in a copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/connector-data-warehouse-copy-activity
  - title: Optimizing Copy Activity Performance from SQL Databases
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-performance-sql-databases
