id: dp700-2c-nonadditive-average
objective: "2.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse that contains a Delta table named silver_orders with one row per order and the columns OrderID, OrderDate, StoreID, RegionID, and Amount.

    A notebook creates a table named gold_store_daily that contains one row per store and day, with a column named AvgOrderValue that contains the average order amount.

    Analysts must calculate the exact average order value per region and month from gold_store_daily only, without reading silver_orders.

    Which two columns should you add to gold_store_daily? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse qui contient une table Delta nommée silver_orders avec une ligne par commande et les colonnes OrderID, OrderDate, StoreID, RegionID et Amount.

    Un notebook crée une table nommée gold_store_daily qui contient une ligne par magasin et par jour, avec une colonne nommée AvgOrderValue qui contient le montant moyen des commandes.

    Les analystes doivent calculer la valeur moyenne exacte des commandes par région et par mois à partir de gold_store_daily uniquement, sans lire silver_orders.

    Quelles sont les deux colonnes à ajouter à gold_store_daily ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The median Amount for the store and day", fr: "Le montant Amount médian pour le magasin et le jour" } }
    - { id: b, text: { en: "The maximum Amount for the store and day", fr: "Le montant Amount maximal pour le magasin et le jour" } }
    - { id: c, text: { en: "The sum of Amount for the store and day", fr: "La somme d'Amount pour le magasin et le jour" } }
    - { id: d, text: { en: "The average of AvgOrderValue over the previous 30 days", fr: "La moyenne d'AvgOrderValue sur les 30 jours précédents" } }
    - { id: e, text: { en: "The number of orders for the store and day", fr: "Le nombre de commandes pour le magasin et le jour" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      An average is not additive: averaging the daily averages gives the same weight to a day with 3 orders and a day with 300 orders. If the table stores the sum of the amounts and the number of orders, analysts can add both columns at any level (region, month) and divide the total amount by the total number of orders to get the exact average.
    fr: |
      Une moyenne n'est pas additive : faire la moyenne des moyennes journalières donne le même poids à un jour de 3 commandes et à un jour de 300 commandes. Si la table stocke la somme des montants et le nombre de commandes, les analystes peuvent additionner ces deux colonnes à n'importe quel niveau (région, mois) et diviser le montant total par le nombre total de commandes pour obtenir la moyenne exacte.
  options:
    b:
      en: |
        A maximum can be rolled up, but it doesn't help to compute an average.
      fr: |
        Un maximum peut être agrégé à un niveau supérieur, mais il n'aide pas à calculer une moyenne.
    a:
      en: |
        A median is not additive either: the median of a month can't be computed from daily medians.
      fr: |
        Une médiane n'est pas additive non plus : la médiane d'un mois ne se calcule pas à partir de médianes journalières.
    d:
      en: |
        A rolling average of averages is still not weighted by the number of orders, and it doesn't match calendar months.
      fr: |
        Une moyenne glissante de moyennes n'est toujours pas pondérée par le nombre de commandes et ne correspond pas aux mois civils.
references:
  - title: Combine and aggregate data
    url: https://learn.microsoft.com/en-us/training/modules/fabric-transform-data-notebooks/4-combine-aggregate
