id: dp700-2b-transform-kql-set-append
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an eventhouse that contains a KQL database named KQL-Plant. KQL-Plant has a table named RawReadings.

    You need a scheduled management command that stores hourly averages of RawReadings in a table named HourlyReadings. HourlyReadings doesn't exist yet. The first run must create the table, and each later run must add its rows to the rows already stored.

    Which command should you use?
  fr: |
    Vous disposez d'un eventhouse qui contient une base de données KQL nommée KQL-Plant. KQL-Plant possède une table nommée RawReadings.

    Une commande de gestion planifiée doit stocker les moyennes horaires de RawReadings dans une table nommée HourlyReadings. HourlyReadings n'existe pas encore. La première exécution doit créer la table et chaque exécution suivante doit ajouter ses lignes à celles déjà stockées.

    Quelle commande devez-vous utiliser ?
body:
  options:
    - { id: a, text: ".set HourlyReadings <| ..." }
    - { id: b, text: ".append HourlyReadings <| ..." }
    - { id: c, text: ".set-or-replace HourlyReadings <| ..." }
    - { id: d, text: ".set-or-append HourlyReadings <| ..." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      .set-or-append creates the table and ingests the query result when the table doesn't exist, and appends the result when it exists. It preserves the existing rows, which is what each later run needs.
    fr: |
      .set-or-append crée la table et ingère le résultat de la requête quand la table n'existe pas, et ajoute le résultat quand elle existe. Elle conserve les lignes existantes, ce dont chaque exécution suivante a besoin.
  options:
    a: { en: ".set creates the table but fails when the table already exists, so the second run fails.", fr: ".set crée la table mais échoue quand la table existe déjà : la deuxième exécution échoue." }
    b: { en: ".append fails when the table doesn't exist, so the first run fails.", fr: ".append échoue quand la table n'existe pas : la première exécution échoue." }
    c: { en: ".set-or-replace replaces the existing data at each run instead of adding to it.", fr: ".set-or-replace remplace les données existantes à chaque exécution au lieu de les compléter." }
references:
  - title: Ingest from query (.set, .append, .set-or-append, .set-or-replace)
    url: https://learn.microsoft.com/en-us/kusto/management/data-ingestion/ingest-from-query?view=microsoft-fabric
