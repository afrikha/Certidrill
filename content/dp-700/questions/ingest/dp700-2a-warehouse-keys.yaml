id: dp700-2a-warehouse-keys
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **DW1**. You create a dimension table named **dbo.DimSupplier** that has a bigint IDENTITY column named SupplierKey. You create a fact table named **dbo.FactPurchases** with a FOREIGN KEY constraint on SupplierKey that references dbo.DimSupplier and is created with NOT ENFORCED.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **DW1**. Vous créez une table de dimension nommée **dbo.DimSupplier** qui comporte une colonne IDENTITY de type bigint nommée SupplierKey. Vous créez une table de faits nommée **dbo.FactPurchases** avec une contrainte FOREIGN KEY sur SupplierKey qui référence dbo.DimSupplier et est créée avec NOT ENFORCED.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An INSERT into dbo.FactPurchases fails if its SupplierKey value doesn't exist in dbo.DimSupplier.
        fr: Une instruction INSERT dans dbo.FactPurchases échoue si sa valeur SupplierKey n'existe pas dans dbo.DimSupplier.
    - id: s2
      text:
        en: You can insert an Unknown member with SupplierKey = -1 by running SET IDENTITY_INSERT dbo.DimSupplier ON before the INSERT statement.
        fr: Vous pouvez insérer un membre Unknown avec SupplierKey = -1 en exécutant SET IDENTITY_INSERT dbo.DimSupplier ON avant l'instruction INSERT.
    - id: s3
      text:
        en: The SupplierKey values generated by two separate loads are always contiguous and in insertion order.
        fr: Les valeurs SupplierKey générées par deux chargements distincts sont toujours contiguës et dans l'ordre d'insertion.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Fabric Data Warehouse accepts foreign keys only as NOT ENFORCED: they document the model but never reject rows, so the fact load must check referential integrity itself. Explicit values, such as -1 for a special member, can be inserted with SET IDENTITY_INSERT ON and a column list. IDENTITY values are unique but not guaranteed to be sequential, and separate ingestion tasks can receive non-contiguous ranges.
    fr: |
      Fabric Data Warehouse n'accepte les clés étrangères qu'avec NOT ENFORCED : elles documentent le modèle mais ne rejettent jamais de lignes, et le chargement des faits doit donc vérifier lui-même l'intégrité référentielle. Des valeurs explicites, comme -1 pour un membre spécial, peuvent être insérées avec SET IDENTITY_INSERT ON et une liste de colonnes. Les valeurs IDENTITY sont uniques mais sans garantie d'ordre séquentiel, et des tâches d'ingestion distinctes peuvent recevoir des plages non contiguës.
references:
  - title: IDENTITY columns in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/identity
  - title: T-SQL surface area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
