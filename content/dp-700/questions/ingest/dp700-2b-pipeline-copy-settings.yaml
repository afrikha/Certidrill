id: dp700-2b-pipeline-copy-settings
objective: "2.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You have a pipeline that contains a Copy data activity named CopyClaims. CopyClaims copies CSV files from an Azure Blob Storage account to a Fabric warehouse.

    You need to configure CopyClaims to meet the requirements shown in the answer area.

    Which setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline qui contient une activité Copy data nommée CopyClaims. CopyClaims copie des fichiers CSV d'un compte Stockage Blob Azure vers un entrepôt Fabric.

    Vous devez configurer CopyClaims pour respecter les exigences présentées dans la zone de réponse.

    Quel paramètre devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fault, text: Fault tolerance }
    - { id: verify, text: Data consistency verification }
    - { id: logging, text: Enable logging }
    - { id: staging, text: Enable staging }
    - { id: ito, text: Intelligent throughput optimization }
    - { id: parallel, text: Degree of copy parallelism }
  targets:
    - id: t1
      text: { en: "Skip the rows that have incompatible values instead of failing the copy", fr: "Ignorer les lignes qui ont des valeurs incompatibles au lieu de faire échouer la copie" }
    - id: t2
      text: { en: "Check that the total row count of the destination matches the source", fr: "Vérifier que le nombre total de lignes de la destination correspond à celui de la source" }
    - id: t3
      text: { en: "Keep a record of the rows and files that were skipped", fr: "Conserver une trace des lignes et des fichiers ignorés" }
    - id: t4
      text: { en: "Copy the data through an interim ADLS Gen2 location", fr: "Copier les données via un emplacement ADLS Gen2 intermédiaire" }
answer:
  mapping: { t1: fault, t2: verify, t3: logging, t4: staging }
explanation:
  correct:
    en: |
      Fault tolerance skips errors such as incompatible rows. Data consistency verification checks the total row count for tabular data, at the price of a slower copy. Enable logging records copied files, skipped files and skipped rows. Enable staging copies through an interim store, either workspace staging or an external Blob Storage or ADLS Gen2 connection. Intelligent throughput optimization and degree of copy parallelism tune performance only.
    fr: |
      Fault tolerance ignore des erreurs comme les lignes incompatibles. Data consistency verification vérifie le nombre total de lignes pour des données tabulaires, au prix d'une copie plus lente. Enable logging enregistre les fichiers copiés, les fichiers ignorés et les lignes ignorées. Enable staging copie via un magasin intermédiaire, soit le stockage intermédiaire de l'espace de travail, soit une connexion externe Stockage Blob ou ADLS Gen2. Intelligent throughput optimization et Degree of copy parallelism ne règlent que les performances.
references:
  - title: How to copy data using copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-data-activity
