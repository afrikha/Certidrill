id: dp700-2a-streaming-statements
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are designing streaming loads in a Fabric workspace that contains an eventstream named **ES5**, a lakehouse named **Lakehouse1** and an eventhouse named **EH1**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez des chargements de diffusion en continu dans un espace de travail Fabric qui contient un flux d'événements nommé **ES5**, un lakehouse nommé **Lakehouse1** et un eventhouse nommé **EH1**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can connect an Eventhouse destination that uses Direct ingestion to the output of a Filter operator in ES5.
        fr: Vous pouvez connecter une destination Eventhouse qui utilise Direct ingestion à la sortie d'un opérateur Filter dans ES5.
    - id: s2
      text:
        en: A Spark structured streaming query that writes to Lakehouse1 and is restarted with the same checkpoint location resumes from the last processed offsets.
        fr: Une requête de streaming structuré Spark qui écrit dans Lakehouse1 et qui redémarre avec le même emplacement de point de contrôle reprend aux derniers offsets traités.
    - id: s3
      text:
        en: When a Lakehouse destination of ES5 creates a new Delta table, the schema of the table comes from the first record that the destination receives.
        fr: Quand une destination Lakehouse d'ES5 crée une table Delta, le schéma de la table provient du premier enregistrement reçu par la destination.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Direct ingestion attaches only to the default stream or a derived stream; after an operator, the Eventhouse destination uses Event processing before ingestion. The checkpoint location stores the progress and state of a streaming query, which lets it restart where it stopped. A Lakehouse destination that creates a table takes its schema from the first record, and later records with another schema can lose columns.
    fr: |
      Direct ingestion ne se rattache qu'au flux par défaut ou à un flux dérivé ; après un opérateur, la destination Eventhouse utilise Event processing before ingestion. L'emplacement du point de contrôle stocke la progression et l'état d'une requête de streaming, ce qui lui permet de redémarrer là où elle s'est arrêtée. Une destination Lakehouse qui crée une table prend son schéma dans le premier enregistrement, et des enregistrements ultérieurs d'un autre schéma peuvent perdre des colonnes.
references:
  - title: Add an Eventhouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-kql-database
  - title: Add a lakehouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-lakehouse
