id: dp700-2a-dfg2-buckets
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You configure incremental refresh for a query in a Dataflow Gen2 named **DF2**. The data destination is a table in a lakehouse named **Lakehouse1**. The filter column is OrderDate, the change detection column is ModifiedDate, data is extracted from the past 12 months, and the bucket size is Month.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez l'actualisation incrémentielle d'une requête dans un Dataflow Gen2 nommé **DF2**. La destination des données est une table d'un lakehouse nommé **Lakehouse1**. La colonne de filtrage est OrderDate, la colonne de détection des changements est ModifiedDate, les données sont extraites sur les 12 derniers mois et la taille de compartiment est Month.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: During a refresh, DF2 skips a month whose maximum ModifiedDate value hasn't changed since the previous refresh.
        fr: Lors d'une actualisation, DF2 ignore un mois dont la valeur maximale de ModifiedDate n'a pas changé depuis l'actualisation précédente.
    - id: s2
      text:
        en: For a month that changed, DF2 merges the changed rows into the existing rows of Lakehouse1 by using a key column.
        fr: Pour un mois qui a changé, DF2 fusionne les lignes modifiées avec les lignes existantes de Lakehouse1 à l'aide d'une colonne clé.
    - id: s3
      text:
        en: During each refresh, DF2 deletes the rows of Lakehouse1 whose OrderDate is older than the first bucket.
        fr: Lors de chaque actualisation, DF2 supprime les lignes de Lakehouse1 dont la valeur OrderDate est antérieure au premier compartiment.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      For each bucket, the dataflow compares the current maximum of the change detection column with the value of the last refresh and skips the bucket if it didn't change. A changed bucket isn't merged by key: the dataflow deletes the destination data in the bucket's time range and inserts the fresh data (the update method is always replace, per bucket). Data older than the first bucket isn't modified or removed.
    fr: |
      Pour chaque compartiment, le dataflow compare le maximum actuel de la colonne de détection des changements à la valeur de la dernière actualisation et ignore le compartiment s'il n'a pas changé. Un compartiment modifié n'est pas fusionné sur une clé : le dataflow supprime les données de destination de la plage de temps du compartiment et insère les données fraîches (la méthode de mise à jour est toujours le remplacement, par compartiment). Les données antérieures au premier compartiment ne sont ni modifiées ni supprimées.
references:
  - title: Incremental refresh in Dataflow Gen2
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-incremental-refresh
