id: dp700-cs1a-stream-engines
objective: "2.3.1"
type: dragdrop
caseStudy: dp700-cs1a-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You need to choose a streaming engine for three of the requirements. The solution must minimize development effort.

    What should you use for each requirement? To answer, drag the appropriate engines to the correct requirements. Each engine may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir un moteur de diffusion en continu pour trois des exigences. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les moteurs appropriés vers les exigences correspondantes. Chaque moteur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: es, text: { en: "An eventstream", fr: "Un flux d'événements" } }
    - { id: sss, text: { en: "Spark structured streaming", fr: "Le streaming structuré Spark" } }
    - { id: mv, text: { en: "A KQL materialized view", fr: "Une vue matérialisée KQL" } }
    - { id: up, text: { en: "A KQL update policy", fr: "Une stratégie de mise à jour KQL" } }
    - { id: df, text: { en: "A Dataflow Gen2", fr: "Un Dataflow Gen2" } }
  targets:
    - id: r1
      text: { en: "Requirement 1: send the gate scans to KDB_Ops and to LH_Archive", fr: "Exigence 1 : envoyer les passages aux portiques vers KDB_Ops et vers LH_Archive" }
    - id: r3
      text: { en: "Requirement 3: provide the most recent scan of each gate to the dashboard", fr: "Exigence 3 : fournir au tableau de bord le passage le plus récent de chaque portique" }
    - id: r4
      text: { en: "Requirement 4: score the snow-cannon telemetry with the PySpark library", fr: "Exigence 4 : évaluer la télémétrie des canons à neige avec la bibliothèque PySpark" }
answer:
  mapping: { r1: es, r3: mv, r4: sss }
explanation:
  correct:
    en: |-
      An eventstream can send the same stream to several destinations, such as an eventhouse and a lakehouse, by configuration only, without code. A materialized view that uses `arg_max()` by GateId keeps a precomputed aggregation in the KQL database, so the dashboard query reads stored results instead of scanning every scan. Scoring with an existing PySpark library requires Spark, so Spark structured streaming is the engine for the snow-cannon telemetry.
    fr: |-
      Un flux d'événements peut envoyer le même flux vers plusieurs destinations, comme un eventhouse et un lakehouse, par simple configuration, sans code. Une vue matérialisée qui utilise `arg_max()` par GateId conserve une agrégation précalculée dans la base de données KQL ; la requête du tableau de bord lit donc des résultats stockés au lieu d'analyser tous les passages. L'évaluation avec une bibliothèque PySpark existante exige Spark ; le streaming structuré Spark est donc le moteur adapté à la télémétrie des canons à neige.
  options:
    up:
      en: |-
        An update policy transforms each ingested batch into a target table at ingestion time. It does not keep a precomputed latest value per gate, and it cannot route events to a lakehouse.
      fr: |-
        Une stratégie de mise à jour transforme chaque lot ingéré dans une table cible au moment de l'ingestion. Elle ne conserve pas de dernière valeur précalculée par portique et ne peut pas router d'événements vers un lakehouse.
    df:
      en: |-
        Dataflow Gen2 runs Power Query transformations on a schedule or on demand; it is not a streaming engine and cannot run a PySpark library.
      fr: |-
        Dataflow Gen2 exécute des transformations Power Query selon une planification ou à la demande ; ce n'est pas un moteur de diffusion en continu et il ne peut pas exécuter une bibliothèque PySpark.
references:
  - title: Materialized views
    url: https://learn.microsoft.com/en-us/kusto/management/materialized-views/materialized-view-overview?view=microsoft-fabric
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
