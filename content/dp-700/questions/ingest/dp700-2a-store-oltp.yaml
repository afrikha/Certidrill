id: dp700-2a-store-oltp
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware is building a web application for its field technicians. Hundreds of technicians update work orders at the same time, mostly single rows in the same few tables. The database must enforce foreign keys between work orders, technicians and sites.

    Analysts must query the data in Fabric without adding load to the transactional workload and without building an ingestion pipeline.

    What should you use?
  fr: |
    Proseware développe une application web pour ses techniciens de terrain. Des centaines de techniciens mettent à jour des ordres de travail en même temps, surtout des lignes individuelles dans les mêmes quelques tables. La base de données doit appliquer les clés étrangères entre les ordres de travail, les techniciens et les sites.

    Les analystes doivent interroger les données dans Fabric sans ajouter de charge à la charge de travail transactionnelle et sans créer de pipeline d'ingestion.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A warehouse, with FOREIGN KEY constraints created with NOT ENFORCED", fr: "Un entrepôt, avec des contraintes FOREIGN KEY créées avec NOT ENFORCED" } }
    - { id: b, text: { en: "A lakehouse, with the application writing Delta tables through Spark", fr: "Un lakehouse, avec l'application qui écrit des tables Delta via Spark" } }
    - { id: c, text: { en: "An eventhouse, with update policies that keep the latest version of each work order", fr: "Un eventhouse, avec des stratégies de mise à jour qui conservent la dernière version de chaque ordre de travail" } }
    - { id: d, text: { en: "A SQL database in Fabric, with the analysts querying its SQL analytics endpoint", fr: "Une base de données SQL dans Fabric, avec les analystes qui interrogent son point de terminaison d'analytique SQL" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SQL database in Fabric is the Fabric home for OLTP workloads: high concurrency, full ACID transactions and enforced foreign keys. Its data is replicated automatically to OneLake in near real time, and analysts query it through its SQL analytics endpoint, which doesn't affect transactional performance and needs no pipeline.
    fr: |
      Une base de données SQL dans Fabric est l'emplacement Fabric des charges OLTP : forte concurrence, transactions ACID complètes et clés étrangères appliquées. Ses données sont répliquées automatiquement dans OneLake en quasi-temps réel, et les analystes les interrogent via son point de terminaison d'analytique SQL, sans effet sur les performances transactionnelles et sans pipeline.
  options:
    a: { en: "Warehouse foreign keys aren't enforced, and write conflicts are evaluated per table, so concurrent updates of the same table fail.", fr: "Les clés étrangères d'un entrepôt ne sont pas appliquées, et les conflits d'écriture sont évalués par table : des mises à jour concurrentes de la même table échouent." }
    b: { en: "A lakehouse isn't an operational database: it has no enforced foreign keys and isn't designed for concurrent single-row updates.", fr: "Un lakehouse n'est pas une base opérationnelle : il n'a pas de clés étrangères appliquées et n'est pas conçu pour des mises à jour concurrentes de lignes individuelles." }
    c: { en: "An eventhouse is append-oriented event storage; it doesn't provide relational transactions or foreign keys.", fr: "Un eventhouse est un stockage d'événements orienté ajout ; il n'offre ni transactions relationnelles ni clés étrangères." }
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
  - title: SQL database in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/sql/overview
