id: dp700-2a-store-statements
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are comparing Fabric data stores for a new project that will use a lakehouse, a warehouse and an eventhouse.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez les magasins de données Fabric pour un nouveau projet qui utilisera un lakehouse, un entrepôt et un eventhouse.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create T-SQL views, functions and stored procedures in the SQL analytics endpoint of the lakehouse.
        fr: Vous pouvez créer des vues, des fonctions et des procédures stockées T-SQL dans le point de terminaison d'analytique SQL du lakehouse.
    - id: s2
      text:
        en: The data of the eventhouse is available in OneLake in Delta format as soon as the eventhouse is created, without any setting.
        fr: Les données de l'eventhouse sont disponibles dans OneLake au format Delta dès la création de l'eventhouse, sans aucun paramètre.
    - id: s3
      text:
        en: Two transactions that update different rows of the same warehouse table at the same time both commit successfully.
        fr: Deux transactions qui mettent à jour en même temps des lignes différentes de la même table d'entrepôt sont toutes deux validées avec succès.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The SQL analytics endpoint is read-only for table data, but it supports views, functions and stored procedures over the Delta tables. Eventhouse data is in the open Delta format only when you opt in by turning on OneLake availability. Warehouse write-write conflicts are evaluated at the table level: when two transactions update the same table, the first to commit succeeds and the other fails, even if they touch different rows.
    fr: |
      Le point de terminaison d'analytique SQL est en lecture seule pour les données des tables, mais il prend en charge les vues, fonctions et procédures stockées sur les tables Delta. Les données d'un eventhouse ne sont au format ouvert Delta que si vous l'activez explicitement avec la disponibilité OneLake. Les conflits d'écriture d'un entrepôt sont évalués au niveau de la table : quand deux transactions mettent à jour la même table, la première validée réussit et l'autre échoue, même si elles touchent des lignes différentes.
references:
  - title: What is the SQL analytics endpoint for a lakehouse?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint
  - title: Transactions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/transactions
