id: dp700-2d-win-sliding-alert
objective: "2.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an eventstream named **ES-SignIns** that receives sign-in events. Each event contains the `sourceIp`, `result` and `signInTime` fields. You add a SQL operator that filters the events where `result` equals `failure` and uses `TIMESTAMP BY signInTime`. Its output goes to an Activator item.

    You need the operator to output a row as soon as an IP address has at least three failed sign-ins within any period of 10 minutes, whatever the start time of the period. The solution must avoid outputting rows for periods in which nothing changed.

    Which GROUP BY clause should you use with `HAVING COUNT(*) >= 3`?
  fr: |
    Vous disposez d'un flux d'événements nommé **ES-SignIns** qui reçoit des événements de connexion. Chaque événement contient les champs `sourceIp`, `result` et `signInTime`. Vous ajoutez un opérateur SQL qui filtre les événements dont `result` est égal à `failure` et utilise `TIMESTAMP BY signInTime`. Sa sortie va vers un élément Activator.

    L'opérateur doit produire une ligne dès qu'une adresse IP compte au moins trois échecs de connexion au cours d'une période quelconque de 10 minutes, quelle que soit l'heure de début de la période. La solution doit éviter de produire des lignes pour des périodes où rien n'a changé.

    Quelle clause GROUP BY devez-vous utiliser avec `HAVING COUNT(*) >= 3` ?
body:
  options:
    - id: a
      text: "GROUP BY sourceIp, TumblingWindow(minute, 10)"
    - id: b
      text: "GROUP BY sourceIp, SlidingWindow(minute, 10)"
    - id: c
      text: "GROUP BY sourceIp, HoppingWindow(minute, 10, 1)"
    - id: d
      text: "GROUP BY sourceIp, System.Timestamp()"
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A sliding window outputs results only at the points in time when its content changes, that is, when an event enters or leaves the window, so it evaluates every possible 10-minute period that ends with an event. The row is produced when the third failure arrives, and no row is produced for periods without changes.
    fr: |-
      Une fenêtre glissante (sliding) ne produit de résultats qu'aux instants où son contenu change, c'est-à-dire quand un événement entre dans la fenêtre ou en sort : elle évalue donc toute période de 10 minutes qui se termine par un événement. La ligne est produite à l'arrivée du troisième échec, et aucune ligne n'est produite pour les périodes sans changement.
  options:
    a:
      en: |-
        Tumbling windows have fixed boundaries; three failures that straddle two windows wouldn't be detected, and the result comes only at the end of each window.
      fr: |-
        Les fenêtres bascules (tumbling) ont des limites fixes : trois échecs répartis sur deux fenêtres ne seraient pas détectés, et le résultat n'arrive qu'à la fin de chaque fenêtre.
    c:
      en: |-
        A hopping window with a 1-minute hop detects most cases but outputs a result every minute whether or not anything changed, and still only at fixed boundaries.
      fr: |-
        Une fenêtre récurrente (hopping) avec un saut d'une minute détecte la plupart des cas, mais produit un résultat chaque minute, que quelque chose ait changé ou non, et toujours sur des limites fixes.
    d:
      en: |-
        Grouping by System.Timestamp() creates snapshot windows, which group only the events that have exactly the same timestamp.
      fr: |-
        Regrouper par System.Timestamp() crée des fenêtres d'instantané (snapshot), qui ne regroupent que les événements ayant exactement le même horodatage.
references:
  - title: Introduction to Stream Analytics windowing functions
    url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-window-functions
