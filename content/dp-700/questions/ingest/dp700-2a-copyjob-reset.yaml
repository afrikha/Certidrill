id: dp700-2a-copyjob-reset
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a copy job named **CJ2** that copies a table named **dbo.Policies** from an Azure SQL database to a table in a lakehouse named **Lakehouse1**. CJ2 uses watermark-based incremental copy on a column named ModifiedAt, uses the Merge update method, and runs every hour.

    After a failed release, the database administrators restored dbo.Policies from a backup. The restored rows have ModifiedAt values that are older than the watermark stored by CJ2, and the Lakehouse1 table no longer matches the source.

    You need the Lakehouse1 table to match dbo.Policies again. Later runs must continue to copy only the changes. The solution must minimize effort.

    What should you do?
  fr: |
    Vous disposez d'un travail de copie nommé **CJ2** qui copie une table nommée **dbo.Policies** d'une base de données Azure SQL vers une table d'un lakehouse nommé **Lakehouse1**. CJ2 utilise une copie incrémentielle basée sur un filigrane sur une colonne nommée ModifiedAt, utilise la méthode de mise à jour Merge et s'exécute toutes les heures.

    Après une mise en production ratée, les administrateurs de bases de données ont restauré dbo.Policies à partir d'une sauvegarde. Les lignes restaurées ont des valeurs ModifiedAt antérieures au filigrane stocké par CJ2, et la table de Lakehouse1 ne correspond plus à la source.

    Vous devez faire en sorte que la table de Lakehouse1 corresponde de nouveau à dbo.Policies. Les exécutions suivantes doivent continuer à ne copier que les changements. La solution doit réduire l'effort au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select Run on CJ2 to start an extra run immediately.", fr: "Sélectionner Run sur CJ2 pour démarrer immédiatement une exécution supplémentaire." } }
    - { id: b, text: { en: "Reset CJ2 to full copy for dbo.Policies, with the option to truncate the destination before the full load selected.", fr: "Réinitialiser CJ2 en copie complète pour dbo.Policies, avec l'option de troncation de la destination avant le chargement complet sélectionnée." } }
    - { id: c, text: { en: "Change the update method of CJ2 from Merge to Overwrite.", fr: "Remplacer la méthode de mise à jour Merge de CJ2 par Overwrite." } }
    - { id: d, text: { en: "Replace CJ2 with a pipeline whose Copy activity copies the whole table every hour.", fr: "Remplacer CJ2 par un pipeline dont l'activité Copy copie la table entière toutes les heures." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      You can reset a copy job from incremental to full copy at any time, for the whole job or for one table. The next run reloads dbo.Policies completely, and the truncate option clears the destination first so that no stale row remains. Later runs are incremental again from the new watermark.
    fr: |
      Vous pouvez réinitialiser à tout moment un travail de copie incrémentielle en copie complète, pour tout le travail ou pour une seule table. L'exécution suivante recharge entièrement dbo.Policies, et l'option de troncation vide d'abord la destination pour qu'aucune ligne obsolète ne subsiste. Les exécutions suivantes redeviennent incrémentielles à partir du nouveau filigrane.
  options:
    a: { en: "A manual run of an incremental job still copies only the rows above the stored watermark, so the restored rows are ignored.", fr: "Une exécution manuelle d'un travail incrémentiel ne copie toujours que les lignes au-dessus du filigrane stocké : les lignes restaurées sont ignorées." }
    c: { en: "With incremental copy, Overwrite replaces the destination with only the changed rows of each run.", fr: "Avec la copie incrémentielle, Overwrite remplace la destination par les seules lignes modifiées de chaque exécution." }
    d: { en: "A full copy every hour no longer copies only the changes, and building a pipeline takes more effort.", fr: "Une copie complète toutes les heures ne copie plus seulement les changements, et créer un pipeline demande plus d'effort." }
references:
  - title: What is Copy job in Data Factory for Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
