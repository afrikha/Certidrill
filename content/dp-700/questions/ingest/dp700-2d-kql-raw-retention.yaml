id: dp700-2d-kql-raw-retention
objective: "2.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named **DB-Logs**. An eventstream ingests JSON logs into a table named **RawLogs**. An update policy on a table named **Logs** runs a function named `ParseLogs()` on each batch ingested into RawLogs. The policy has `IsTransactional` set to `false`.

    You need to meet the following requirements:

    - RawLogs must not keep the raw logs after they're transformed, to reduce storage.
    - When `ParseLogs()` fails because of a transient error, the batch must not be lost from Logs; the ingestion must fail so that it can be retried.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **DB-Logs**. Un flux d'événements ingère des journaux JSON dans une table nommée **RawLogs**. Une stratégie de mise à jour sur une table nommée **Logs** exécute une fonction nommée `ParseLogs()` sur chaque lot ingéré dans RawLogs. La stratégie a `IsTransactional` défini sur `false`.

    Vous devez satisfaire les exigences suivantes :

    - RawLogs ne doit pas conserver les journaux bruts une fois transformés, pour réduire le stockage.
    - Quand `ParseLogs()` échoue à cause d'une erreur temporaire, le lot ne doit pas être perdu pour Logs ; l'ingestion doit échouer pour pouvoir être relancée.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Set the soft-delete period of the retention policy of Logs to 0s.", fr: "Définir sur 0s la période de suppression réversible de la stratégie de rétention de Logs." }
    - id: b
      text: { en: "Set IsTransactional to true in the update policy of Logs.", fr: "Définir IsTransactional sur true dans la stratégie de mise à jour de Logs." }
    - id: c
      text: { en: "Set PropagateIngestionProperties to true in the update policy of Logs.", fr: "Définir PropagateIngestionProperties sur true dans la stratégie de mise à jour de Logs." }
    - id: d
      text: { en: "Set the soft-delete period of the retention policy of RawLogs to 0s.", fr: "Définir sur 0s la période de suppression réversible de la stratégie de rétention de RawLogs." }
    - id: e
      text: { en: "Create a materialized view over RawLogs that runs ParseLogs().", fr: "Créer sur RawLogs une vue matérialisée qui exécute ParseLogs()." }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      With `IsTransactional` set to `true`, a failure of the policy query makes the whole ingestion fail, so neither RawLogs nor Logs receives the batch and it can be retried. A soft-delete period of `0s` on the source table removes the raw data once the policy has run, and a source with a `0s` soft-delete period requires every update policy that references it to be transactional.
    fr: |-
      Avec `IsTransactional` défini sur `true`, un échec de la requête de la stratégie fait échouer toute l'ingestion : ni RawLogs ni Logs ne reçoivent le lot, qui peut être relancé. Une période de suppression réversible de `0s` sur la table source supprime les données brutes une fois la stratégie exécutée, et une source dont la période de suppression réversible est de `0s` exige que toute stratégie de mise à jour qui la référence soit transactionnelle.
  options:
    a:
      en: |-
        A 0s retention on Logs would delete the transformed data, which is the data to keep.
      fr: |-
        Une rétention de 0s sur Logs supprimerait les données transformées, qui sont celles à conserver.
    c:
      en: |-
        PropagateIngestionProperties applies ingestion properties such as extent tags to the target; it doesn't change failure handling or storage.
      fr: |-
        PropagateIngestionProperties applique à la cible des propriétés d'ingestion comme les étiquettes d'étendue (extent tags) ; il ne change ni la gestion des échecs ni le stockage.
    e:
      en: |-
        A materialized view must end with a summarize aggregation and keeps its own copy; it doesn't remove raw data or make the ingestion transactional.
      fr: |-
        Une vue matérialisée doit se terminer par une agrégation summarize et garde sa propre copie ; elle ne supprime pas les données brutes et ne rend pas l'ingestion transactionnelle.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
