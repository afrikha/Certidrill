id: dp700-2b-shortcut-s3-cache
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS-Market that contains a lakehouse named LH-Market. LH-Market has several shortcuts that point to Parquet files in an Amazon S3 bucket.

    Several Spark notebooks read the same files many times a day, and the egress charges of the bucket are increasing.

    You need to reduce the egress charges. The files must stay in the S3 bucket, and you must not build an ingestion process.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS-Market qui contient un lakehouse nommé LH-Market. LH-Market possède plusieurs raccourcis qui pointent vers des fichiers Parquet d'un compartiment Amazon S3.

    Plusieurs notebooks Spark lisent les mêmes fichiers de nombreuses fois par jour, et les frais de sortie du compartiment augmentent.

    Vous devez réduire les frais de sortie. Les fichiers doivent rester dans le compartiment S3 et vous ne devez pas créer de processus d'ingestion.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Turn on query acceleration for the shortcuts of LH-Market."
        fr: "Activer l'accélération des requêtes pour les raccourcis de LH-Market."
    - id: b
      text:
        en: "Replace the shortcuts with a mirrored database of the bucket."
        fr: "Remplacer les raccourcis par une base de données mise en miroir du compartiment."
    - id: c
      text:
        en: "Run the OPTIMIZE command on the shortcut data every night."
        fr: "Exécuter la commande OPTIMIZE sur les données des raccourcis chaque nuit."
    - id: d
      text:
        en: "Turn on shortcut caching on the OneLake tab of the WS-Market settings."
        fr: "Activer la mise en cache des raccourcis dans l'onglet OneLake des paramètres de WS-Market."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Shortcut caching reduces the egress costs of cross-cloud access for Amazon S3, S3-compatible, Google Cloud Storage and gateway shortcuts. It's enabled per workspace on the OneLake tab, files read through the shortcut are kept in the cache for the retention period (1 to 28 days), and the data still lives in the bucket.
    fr: |
      La mise en cache des raccourcis réduit les coûts de sortie de l'accès multicloud pour les raccourcis Amazon S3, compatibles S3, Google Cloud Storage et via passerelle. Elle s'active par espace de travail dans l'onglet OneLake ; les fichiers lus via le raccourci restent en cache pendant la période de rétention (1 à 28 jours), et les données restent dans le compartiment.
  options:
    a:
      en: |
        Query acceleration is an option of OneLake shortcuts in a KQL database (eventhouse); it doesn't apply to lakehouse shortcuts read by Spark.
      fr: |
        L'accélération des requêtes est une option des raccourcis OneLake d'une base de données KQL (eventhouse) ; elle ne s'applique pas aux raccourcis de lakehouse lus par Spark.
    b:
      en: |
        Mirroring replicates databases such as Azure SQL Database or Snowflake; an S3 bucket of Parquet files isn't a mirroring source.
      fr: |
        La mise en miroir réplique des bases de données comme Azure SQL Database ou Snowflake ; un compartiment S3 de fichiers Parquet n'est pas une source de mise en miroir.
    c:
      en: |
        OPTIMIZE compacts Delta tables; it doesn't stop the notebooks from reading the files from the bucket and paying egress each time.
      fr: |
        OPTIMIZE compacte des tables Delta ; il n'empêche pas les notebooks de lire les fichiers dans le compartiment et de payer les sorties à chaque fois.
references:
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
