id: dp700-2b-denorm-header-lines
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW-Retail. The staging schema contains two tables loaded from an ERP system:

    - stg.OrderHeader: OrderID, OrderDate, CustomerID, StoreID
    - stg.OrderLine: OrderID, LineNo, ProductID, Quantity, Amount

    You need to create a single fact table named dbo.FactSales at the order line grain. Reports must filter sales by order date, customer, store and product without joining the two staging tables at query time.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW-Retail. Le schéma de préparation contient deux tables chargées depuis un ERP :

    - stg.OrderHeader : OrderID, OrderDate, CustomerID, StoreID
    - stg.OrderLine : OrderID, LineNo, ProductID, Quantity, Amount

    Vous devez créer une seule table de faits nommée dbo.FactSales au grain de la ligne de commande. Les rapports doivent filtrer les ventes par date de commande, client, magasin et produit sans joindre les deux tables de préparation au moment de la requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Join stg.OrderLine to stg.OrderHeader on OrderID, and copy OrderDate, CustomerID and StoreID to each line row."
        fr: "Joindre stg.OrderLine à stg.OrderHeader sur OrderID, et copier OrderDate, CustomerID et StoreID dans chaque ligne."
    - id: b
      text:
        en: "Group stg.OrderLine by OrderID, sum Quantity and Amount, and join the result to stg.OrderHeader."
        fr: "Grouper stg.OrderLine par OrderID, additionner Quantity et Amount, puis joindre le résultat à stg.OrderHeader."
    - id: c
      text:
        en: "Combine stg.OrderHeader and stg.OrderLine with UNION ALL, and fill the missing columns with NULL."
        fr: "Combiner stg.OrderHeader et stg.OrderLine avec UNION ALL, et remplir les colonnes manquantes avec NULL."
    - id: d
      text:
        en: "Load each staging table into its own fact table, and relate the two fact tables on OrderID."
        fr: "Charger chaque table de préparation dans sa propre table de faits, et relier les deux tables de faits sur OrderID."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Denormalizing the header into the lines pushes the header attributes down to the line grain: every line row carries its OrderDate, CustomerID and StoreID next to its ProductID. The fact table then relates directly to the date, customer, store and product dimensions, and reports don't need the header table.
    fr: |
      Dénormaliser l'en-tête dans les lignes fait descendre les attributs de l'en-tête au grain de la ligne : chaque ligne porte son OrderDate, son CustomerID et son StoreID à côté de son ProductID. La table de faits se relie alors directement aux dimensions date, client, magasin et produit, et les rapports n'ont plus besoin de la table d'en-tête.
  options:
    b:
      en: |
        Aggregating to the order changes the grain to the order and loses the product of each line.
      fr: |
        Agréger à la commande change le grain en commande et perd le produit de chaque ligne.
    c:
      en: |
        UNION ALL stacks rows instead of combining columns, so no row has both the product and the order date.
      fr: |
        UNION ALL empile des lignes au lieu de combiner des colonnes : aucune ligne n'a à la fois le produit et la date de commande.
    d:
      en: |
        Two related fact tables keep the join at query time and don't give a single fact table.
      fr: |
        Deux tables de faits reliées conservent la jointure au moment de la requête et ne donnent pas une seule table de faits.
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Fact tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables
