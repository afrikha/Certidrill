id: dp700-2c-having-revenue
objective: "2.2.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named WH1 that contains a table named dbo.Sales. dbo.Sales has the following columns: StoreID, SaleDate, and Amount.

    You need a query that returns the StoreID and the total 2026 amount of each store whose total 2026 amount is greater than 100,000.

    Which two queries return the required result? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé WH1 qui contient une table nommée dbo.Sales. dbo.Sales comporte les colonnes suivantes : StoreID, SaleDate et Amount.

    Vous avez besoin d'une requête qui renvoie le StoreID et le montant total 2026 de chaque magasin dont le montant total 2026 est supérieur à 100 000.

    Quelles sont les deux requêtes qui renvoient le résultat attendu ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: "`SELECT StoreID, SUM(Amount) AS Revenue FROM dbo.Sales WHERE YEAR(SaleDate) = 2026 AND Amount > 100000 GROUP BY StoreID;`"
    - id: b
      text: "`SELECT StoreID, SUM(Amount) AS Revenue FROM dbo.Sales WHERE YEAR(SaleDate) = 2026 GROUP BY StoreID HAVING SUM(Amount) > 100000;`"
    - id: c
      text: "`SELECT StoreID, SUM(Amount) AS Revenue FROM dbo.Sales WHERE YEAR(SaleDate) = 2026 GROUP BY StoreID HAVING Revenue > 100000;`"
    - id: d
      text: "`WITH s AS (SELECT StoreID, SUM(Amount) AS Revenue FROM dbo.Sales WHERE YEAR(SaleDate) = 2026 GROUP BY StoreID) SELECT StoreID, Revenue FROM s WHERE Revenue > 100000;`"
    - id: e
      text: "`SELECT StoreID, SUM(Amount) AS Revenue FROM dbo.Sales WHERE YEAR(SaleDate) = 2026 AND SUM(Amount) > 100000 GROUP BY StoreID;`"
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      HAVING filters the groups after aggregation, so `HAVING SUM(Amount) > 100000` keeps only the stores whose total exceeds the threshold. Computing the totals in a common table expression and filtering the Revenue column of the CTE with WHERE gives the same result, because the outer WHERE runs on the aggregated rows.
    fr: |
      HAVING filtre les groupes après l'agrégation : `HAVING SUM(Amount) > 100000` ne conserve que les magasins dont le total dépasse le seuil. Calculer les totaux dans une expression de table commune (CTE) et filtrer sa colonne Revenue avec WHERE donne le même résultat, car le WHERE externe s'applique aux lignes agrégées.
  options:
    c:
      en: |
        T-SQL evaluates HAVING before the SELECT list, so the Revenue alias is unknown in HAVING and the query fails with an invalid column name error.
      fr: |
        T-SQL évalue HAVING avant la liste SELECT : l'alias Revenue y est inconnu et la requête échoue avec une erreur de nom de colonne non valide.
    a:
      en: |
        This WHERE condition filters individual sale rows over 100,000 before grouping, instead of filtering the store totals.
      fr: |
        Cette condition WHERE filtre les lignes de vente individuelles supérieures à 100 000 avant le regroupement, au lieu de filtrer les totaux par magasin.
    e:
      en: |
        An aggregate function can't appear in a WHERE clause, so the query fails.
      fr: |
        Une fonction d'agrégation ne peut pas figurer dans une clause WHERE : la requête échoue.
references:
  - title: Combine and aggregate data
    url: https://learn.microsoft.com/en-us/training/modules/fabric-transform-data-notebooks/4-combine-aggregate
