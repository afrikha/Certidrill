id: dp700-2b-pipeline-gateway-steps
objective: "2.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a SQL Server 2022 database in its on-premises datacenter. There's no VPN or ExpressRoute connection between the datacenter and Azure. The datacenter firewall allows the outbound connections that an on-premises data gateway requires.

    You need a Fabric pipeline to copy tables from the database to a lakehouse named LH-Ops.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. dispose d'une base de données SQL Server 2022 dans son centre de données local. Il n'existe aucune connexion VPN ou ExpressRoute entre le centre de données et Azure. Le pare-feu du centre de données autorise les connexions sortantes dont une passerelle de données locale a besoin.

    Un pipeline Fabric doit copier des tables de la base de données vers un lakehouse nommé LH-Ops.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: install, text: { en: "Install an on-premises data gateway on a server in the Litware datacenter and sign in.", fr: "Installer une passerelle de données locale sur un serveur du centre de données de Litware et se connecter." } }
    - { id: conn, text: { en: "In Manage connections and gateways, create an on-premises connection to the database that uses the gateway.", fr: "Dans Gérer les connexions et les passerelles, créer une connexion locale à la base de données qui utilise la passerelle." } }
    - { id: pipe, text: { en: "Create a pipeline and open the copy assistant of a Copy data activity.", fr: "Créer un pipeline et ouvrir l'assistant de copie d'une activité Copy data." } }
    - { id: run, text: { en: "Select the on-premises connection as the source and LH-Ops as the destination, and then run the pipeline.", fr: "Sélectionner la connexion locale comme source et LH-Ops comme destination, puis exécuter le pipeline." } }
    - { id: vnet, text: { en: "Create a virtual network data gateway in an Azure virtual network.", fr: "Créer une passerelle de données de réseau virtuel dans un réseau virtuel Azure." } }
    - { id: mirror, text: { en: "Create a mirrored SQL Server database in the workspace of LH-Ops.", fr: "Créer une base de données SQL Server mise en miroir dans l'espace de travail de LH-Ops." } }
answer:
  sequence: [ install, conn, pipe, run ]
explanation:
  correct:
    en: |
      A pipeline reaches an on-premises source through an on-premises data gateway installed in the local network. You install and register the gateway, create a connection of the on-premises type that uses the gateway cluster, then select that connection as the source of the Copy data activity and run the pipeline.
    fr: |
      Un pipeline atteint une source locale via une passerelle de données locale installée dans le réseau local. Vous installez et inscrivez la passerelle, créez une connexion de type local qui utilise le cluster de passerelles, puis sélectionnez cette connexion comme source de l'activité Copy data et exécutez le pipeline.
  options:
    vnet: { en: "A virtual network data gateway reaches sources through an Azure virtual network; without VPN or ExpressRoute, it can't reach the datacenter.", fr: "Une passerelle de données de réseau virtuel atteint des sources via un réseau virtuel Azure ; sans VPN ni ExpressRoute, elle ne peut pas joindre le centre de données." }
    mirror: { en: "Mirroring is a separate replication item; the requirement is a pipeline that copies the tables.", fr: "La mise en miroir est un élément de réplication distinct ; l'exigence est un pipeline qui copie les tables." }
references:
  - title: How to access on-premises data sources in Data Factory
    url: https://learn.microsoft.com/en-us/fabric/data-factory/how-to-access-on-premises-data
