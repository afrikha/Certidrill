id: dp700-2b-mirror-open-files
objective: "2.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation develops an application that will replicate the Orders table of its proprietary database into an open mirrored database named OM-Adatum in Fabric.

    The application will write an initial full extract of Orders, followed by files that contain inserted, updated and deleted orders. The key of Orders is OrderID.

    You need to ensure that the updates and deletes are applied correctly to the mirrored Orders table.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation développe une application qui répliquera la table Orders de sa base de données propriétaire vers une base de données mise en miroir ouverte nommée OM-Adatum dans Fabric.

    L'application écrira un extrait complet initial d'Orders, puis des fichiers qui contiennent les commandes insérées, mises à jour et supprimées. La clé d'Orders est OrderID.

    Vous devez vous assurer que les mises à jour et les suppressions sont correctement appliquées à la table Orders mise en miroir.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a _metadata.json file that lists OrderID in keyColumns to the Orders folder of the landing zone.", fr: "Ajouter au dossier Orders de la zone d'atterrissage un fichier _metadata.json qui indique OrderID dans keyColumns." } }
    - { id: b, text: { en: "Write each change file as a Delta table that has its own _delta_log folder.", fr: "Écrire chaque fichier de changements comme une table Delta dotée de son propre dossier _delta_log." } }
    - { id: c, text: { en: "Add a __rowMarker__ column with the value 0 to every row of the initial extract.", fr: "Ajouter une colonne __rowMarker__ avec la valeur 0 à chaque ligne de l'extrait initial." } }
    - { id: d, text: { en: "Place the __rowMarker__ column as the last column of every change file.", fr: "Placer la colonne __rowMarker__ en dernière colonne de chaque fichier de changements." } }
    - { id: e, text: { en: "Name each change file with a new GUID so that file names never collide.", fr: "Nommer chaque fichier de changements avec un nouveau GUID pour que les noms de fichiers ne se chevauchent jamais." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Without keyColumns in _metadata.json, updates and deletes aren't possible, because the service can't find the target row; the key can't be changed once it's added. Incremental files need a __rowMarker__ column, which must be the last column of the file, to say whether each row is an insert, update, delete or upsert.
    fr: |
      Sans keyColumns dans _metadata.json, les mises à jour et les suppressions sont impossibles, car le service ne peut pas trouver la ligne cible ; la clé ne peut plus être changée une fois ajoutée. Les fichiers incrémentiels ont besoin d'une colonne __rowMarker__, qui doit être la dernière colonne du fichier, pour indiquer si chaque ligne est une insertion, une mise à jour, une suppression ou un upsert.
  options:
    b: { en: "The landing zone accepts Parquet or delimited text files; mirroring itself converts them to Delta tables.", fr: "La zone d'atterrissage accepte des fichiers Parquet ou de texte délimité ; c'est la mise en miroir qui les convertit en tables Delta." }
    c: { en: "For the initial load, __rowMarker__ is optional and not recommended: a file without it is treated as inserts.", fr: "Pour le chargement initial, __rowMarker__ est facultatif et déconseillé : un fichier sans cette colonne est traité comme des insertions." }
    e: { en: "Files must have 20-digit names with continuous, increasing numbers, which give the order of the changes.", fr: "Les fichiers doivent avoir des noms de 20 chiffres aux numéros continus et croissants, qui donnent l'ordre des changements." }
references:
  - title: Open mirroring landing zone requirements and format
    url: https://learn.microsoft.com/en-us/fabric/mirroring/open-mirroring-landing-zone-format
