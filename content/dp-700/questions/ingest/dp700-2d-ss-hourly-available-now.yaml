id: dp700-2d-ss-hourly-available-now
objective: "2.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric lakehouse named **LH-Shop** that contains a Delta table named **bronze_orders**. An eventstream appends order events to bronze_orders continuously.

    A notebook named **NB-Silver** reads bronze_orders by using `spark.readStream`, cleans the orders, and writes them to a Delta table named **silver_orders** with a checkpoint location. NB-Silver runs all day with the default trigger.

    Analysts need silver_orders to be refreshed only once per hour. You need to reduce the capacity consumption of NB-Silver. The solution must meet the following requirements:

    - No Spark session must run between two refreshes.
    - Each refresh must process only the rows that the previous refresh didn't process.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé **LH-Shop** qui contient une table Delta nommée **bronze_orders**. Un flux d'événements ajoute en continu des événements de commande à bronze_orders.

    Un notebook nommé **NB-Silver** lit bronze_orders avec `spark.readStream`, nettoie les commandes et les écrit dans une table Delta nommée **silver_orders** avec un emplacement de point de contrôle. NB-Silver s'exécute toute la journée avec le déclencheur par défaut.

    Les analystes n'ont besoin que d'une actualisation de silver_orders par heure. Vous devez réduire la consommation de capacité de NB-Silver. La solution doit satisfaire les exigences suivantes :

    - Aucune session Spark ne doit s'exécuter entre deux actualisations.
    - Chaque actualisation ne doit traiter que les lignes que l'actualisation précédente n'a pas traitées.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Change the trigger to trigger(processingTime=\"1 hour\").", fr: "Changer le déclencheur en trigger(processingTime=\"1 hour\")." }
    - id: b
      text: { en: "Schedule NB-Silver to run every hour.", fr: "Planifier l'exécution de NB-Silver toutes les heures." }
    - id: c
      text: { en: "Replace readStream with read and overwrite silver_orders.", fr: "Remplacer readStream par read et remplacer le contenu de silver_orders." }
    - id: d
      text: { en: "Change the trigger to trigger(availableNow=True).", fr: "Changer le déclencheur en trigger(availableNow=True)." }
    - id: e
      text: { en: "Remove the checkpointLocation option from the write.", fr: "Supprimer l'option checkpointLocation de l'écriture." }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |-
      With `trigger(availableNow=True)`, the query processes all the records available when it starts as an incremental batch and then stops, so the session can end. Scheduling NB-Silver every hour starts one such run per hour, and the checkpoint makes each run read only the rows of bronze_orders added since the previous run.
    fr: |-
      Avec `trigger(availableNow=True)`, la requête traite comme un lot incrémentiel tous les enregistrements disponibles à son démarrage, puis s'arrête, ce qui permet à la session de se terminer. Planifier NB-Silver toutes les heures démarre une telle exécution par heure, et le point de contrôle fait lire à chaque exécution uniquement les lignes de bronze_orders ajoutées depuis l'exécution précédente.
  options:
    a:
      en: |-
        A one-hour processing-time trigger writes once per hour, but the query and its Spark session keep running between micro-batches.
      fr: |-
        Un déclencheur processingTime d'une heure écrit une fois par heure, mais la requête et sa session Spark continuent de s'exécuter entre les micro-lots.
    c:
      en: |-
        A batch read of the whole table reprocesses every row at each refresh instead of only the new ones.
      fr: |-
        Une lecture par lots de toute la table retraite toutes les lignes à chaque actualisation au lieu des seules nouvelles lignes.
    e:
      en: |-
        Without a checkpoint, a new run doesn't know which rows were already processed, so it can't process only the new rows.
      fr: |-
        Sans point de contrôle, une nouvelle exécution ne sait pas quelles lignes ont déjà été traitées : elle ne peut pas traiter uniquement les nouvelles lignes.
references:
  - title: Configure Structured Streaming trigger intervals
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/triggers
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
