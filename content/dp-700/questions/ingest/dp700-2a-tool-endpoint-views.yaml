id: dp700-2a-tool-endpoint-views
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse3** that contains curated Delta tables maintained by data engineers. A team of report developers knows only T-SQL.

    The report developers need reusable logic that joins and filters the curated tables for their reports. They must not modify the tables, and the data must not be copied.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse3** qui contient des tables Delta organisées, maintenues par des ingénieurs données. Une équipe de développeurs de rapports ne connaît que T-SQL.

    Les développeurs de rapports ont besoin d'une logique réutilisable qui joint et filtre les tables organisées pour leurs rapports. Ils ne doivent pas modifier les tables, et les données ne doivent pas être copiées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a warehouse, and load the joined data into it by using a T-SQL stored procedure.", fr: "Créer un entrepôt, et y charger les données jointes avec une procédure stockée T-SQL." } }
    - { id: b, text: { en: "Create T-SQL views in the SQL analytics endpoint of Lakehouse3.", fr: "Créer des vues T-SQL dans le point de terminaison d'analytique SQL de Lakehouse3." } }
    - { id: c, text: { en: "Create a Dataflow Gen2 that writes the joined data to a new table in Lakehouse3.", fr: "Créer un Dataflow Gen2 qui écrit les données jointes dans une nouvelle table de Lakehouse3." } }
    - { id: d, text: { en: "Create KQL functions in a KQL database that has shortcuts to the curated tables.", fr: "Créer des fonctions KQL dans une base de données KQL qui a des raccourcis vers les tables organisées." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The SQL analytics endpoint exposes the Delta tables of a lakehouse to T-SQL in read-only mode, and you can create views, functions and stored procedures in it to encapsulate reusable query logic. The views read the tables in place, so nothing is copied and the tables can't be modified through the endpoint.
    fr: |
      Le point de terminaison d'analytique SQL expose en lecture seule les tables Delta d'un lakehouse à T-SQL, et vous pouvez y créer des vues, des fonctions et des procédures stockées pour encapsuler une logique de requête réutilisable. Les vues lisent les tables sur place : rien n'est copié et les tables ne peuvent pas être modifiées via le point de terminaison.
  options:
    a: { en: "Loading the joined data into a warehouse copies it.", fr: "Charger les données jointes dans un entrepôt les copie." }
    c: { en: "A dataflow that writes a new table copies the data, and the developers know only T-SQL.", fr: "Un dataflow qui écrit une nouvelle table copie les données, et les développeurs ne connaissent que T-SQL." }
    d: { en: "KQL functions require KQL skills, which the report developers don't have.", fr: "Les fonctions KQL exigent des compétences KQL, que les développeurs de rapports n'ont pas." }
references:
  - title: What is the SQL analytics endpoint for a lakehouse?
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint
