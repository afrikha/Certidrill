id: dp700-2a-staging-tables
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are designing the staging layer of a warehouse named **DW1**. Each night, source data is extracted into staging tables before the dimension and fact tables of DW1 are processed. A failed run must be restartable without extracting the data from the source systems again.

    You need to follow Fabric guidance for staging tables.

    What should you do?
  fr: |
    Vous concevez la couche de mise en lots d'un entrepôt nommé **DW1**. Chaque nuit, les données sources sont extraites dans des tables de mise en lots avant le traitement des tables de dimension et de faits de DW1. Une exécution en échec doit pouvoir redémarrer sans extraire de nouveau les données des systèmes sources.

    Vous devez suivre les recommandations Fabric pour les tables de mise en lots.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create the staging tables in the dbo schema, and keep all extracted rows so that analysts can audit past loads.", fr: "Créer les tables de mise en lots dans le schéma dbo, et conserver toutes les lignes extraites pour que les analystes puissent auditer les chargements passés." } }
    - { id: b, text: { en: "Create the staging tables in a dedicated schema, truncate them at the start of each run, and don't expose them to business users.", fr: "Créer les tables de mise en lots dans un schéma dédié, les tronquer au début de chaque exécution, et ne pas les exposer aux utilisateurs métier." } }
    - { id: c, text: { en: "Create the staging tables with the surrogate keys of the dimensions, and expose them to analysts through views.", fr: "Créer les tables de mise en lots avec les clés de substitution des dimensions, et les exposer aux analystes au moyen de vues." } }
    - { id: d, text: { en: "Create the staging tables as views over the source tables, so that the data is read again at each processing step.", fr: "Créer les tables de mise en lots sous forme de vues sur les tables sources, afin que les données soient relues à chaque étape de traitement." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Learn recommends a dedicated schema, such as staging, with tables that resemble the source tables, truncated at the start of each run. Staging data must never be exposed to business users. Because the extracted data stays in the staging tables during the run, a failed load can restart without reading the sources again.
    fr: |
      Learn recommande un schéma dédié, comme staging, avec des tables proches des tables sources, tronquées au début de chaque exécution. Les données de mise en lots ne doivent jamais être exposées aux utilisateurs métier. Comme les données extraites restent dans les tables de mise en lots pendant l'exécution, un chargement en échec peut redémarrer sans relire les sources.
  options:
    a: { en: "Staging data must not be exposed to business users, and keeping every extract isn't the purpose of staging; tables are truncated at each run.", fr: "Les données de mise en lots ne doivent pas être exposées aux utilisateurs métier, et conserver chaque extraction n'est pas le rôle de la mise en lots ; les tables sont tronquées à chaque exécution." }
    c: { en: "Staging tables resemble the source tables; surrogate keys are assigned during dimension processing, and staging is never exposed to users.", fr: "Les tables de mise en lots ressemblent aux tables sources ; les clés de substitution sont attribuées pendant le traitement des dimensions, et la mise en lots n'est jamais exposée aux utilisateurs." }
    d: { en: "Views read the sources at every step, which adds load on the source systems and prevents a restart without extracting again.", fr: "Des vues relisent les sources à chaque étape, ce qui charge les systèmes sources et empêche un redémarrage sans nouvelle extraction." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
