id: dp700-2a-unknown-member
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **DW1** that contains a fact table named **dbo.FactReturns** and a dimension table named **dbo.DimStore**. A nightly stored procedure loads dbo.FactReturns from a staging table.

    Some returns are keyed in manually, and their StoreCode value is sometimes mistyped, so it matches no row in dbo.DimStore. These store codes aren't reliable and must not create new store members.

    You need to load every return. The returns with an unmatched StoreCode must be corrected later, when the right store is known.

    What should you do with the unmatched returns during the load?
  fr: |
    Vous disposez d'un entrepôt nommé **DW1** qui contient une table de faits nommée **dbo.FactReturns** et une table de dimension nommée **dbo.DimStore**. Une procédure stockée nocturne charge dbo.FactReturns à partir d'une table de mise en lots.

    Certains retours sont saisis manuellement, et leur valeur StoreCode est parfois mal tapée : elle ne correspond alors à aucune ligne de dbo.DimStore. Ces codes de magasin ne sont pas fiables et ne doivent pas créer de nouveaux membres de magasin.

    Vous devez charger tous les retours. Les retours dont le StoreCode est sans correspondance devront être corrigés plus tard, quand le bon magasin sera connu.

    Que devez-vous faire des retours sans correspondance pendant le chargement ?
body:
  options:
    - { id: a, text: { en: "Insert an inferred member into dbo.DimStore for each unmatched StoreCode, and store the key of that member.", fr: "Insérer un membre déduit dans dbo.DimStore pour chaque StoreCode sans correspondance, et stocker la clé de ce membre." } }
    - { id: b, text: { en: "Store NULL in the StoreKey column, because the foreign key of dbo.FactReturns is created as NOT ENFORCED.", fr: "Stocker NULL dans la colonne StoreKey, car la clé étrangère de dbo.FactReturns est créée avec NOT ENFORCED." } }
    - { id: c, text: { en: "Skip the unmatched returns, and write them to an error table that the store managers review.", fr: "Ignorer les retours sans correspondance, et les écrire dans une table d'erreurs que les responsables de magasin examinent." } }
    - { id: d, text: { en: "Store the key of the special Unknown member of dbo.DimStore, and update those rows when the store is known.", fr: "Stocker la clé du membre spécial Unknown de dbo.DimStore, et mettre à jour ces lignes quand le magasin est connu." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a dimension lookup fails, the fact row must not be dropped: store a valid key, such as the key of a special Unknown member (often -1), and correct it later by a process that updates the dimension key. An inferred member is an option only when the natural key can be trusted, which isn't the case here.
    fr: |
      Quand la recherche d'une dimension échoue, la ligne de faits ne doit pas être écartée : on stocke une clé valide, comme celle d'un membre spécial Unknown (souvent -1), puis on la corrige plus tard par un processus qui met à jour la clé de dimension. Un membre déduit n'est envisageable que si la clé naturelle est fiable, ce qui n'est pas le cas ici.
  options:
    a: { en: "Inferred members are created only for trusted natural keys; mistyped codes would create fake stores.", fr: "Les membres déduits ne sont créés que pour des clés naturelles fiables ; des codes mal tapés créeraient de faux magasins." }
    b: { en: "Dimension keys of a fact table should be NOT NULL and point to a special member; NULL keys break joins and reports.", fr: "Les clés de dimension d'une table de faits doivent être NOT NULL et pointer vers un membre spécial ; des clés NULL cassent les jointures et les rapports." }
    c: { en: "Every return must be loaded; skipped rows make the fact table incomplete.", fr: "Tous les retours doivent être chargés ; des lignes ignorées rendent la table de faits incomplète." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
