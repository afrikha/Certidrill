id: dp700-2c-acceleration-progress
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You enabled query acceleration on three OneLake shortcuts in a KQL database named LogsDB. The source Delta tables are large, and dashboard queries are still slower than expected one hour later.

    You need to check how far the acceleration of each shortcut has progressed.

    What should you use?
  fr: |
    Vous avez activé l'accélération des requêtes sur trois raccourcis OneLake d'une base de données KQL nommée LogsDB. Les tables Delta sources sont volumineuses, et les requêtes des tableaux de bord restent plus lentes que prévu une heure plus tard.

    Vous devez vérifier l'état d'avancement de l'accélération de chaque raccourci.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "The Microsoft Fabric Capacity Metrics app", fr: "L'application Microsoft Fabric Capacity Metrics" }
    - id: b
      text: "`.show ingestion failures`"
    - id: c
      text: "`.show tables details`"
    - id: d
      text: "`.show external table operations query_acceleration statistics`"
answer: { optionId: d }
explanation:
  correct:
    en: |
      The initial acceleration time depends on the size of the external table. Running `.show external table operations query_acceleration statistics` in a KQL queryset returns the progress and settings of the accelerated tables, so you can see whether the data is still being accelerated.
    fr: |
      La durée de l'accélération initiale dépend de la taille de la table externe. Exécuter `.show external table operations query_acceleration statistics` dans un ensemble de requêtes KQL renvoie l'avancement et les paramètres des tables accélérées : vous voyez si les données sont encore en cours d'accélération.
  options:
    b:
      en: |
        Accelerating a shortcut isn't an ingestion; this command lists the failures of ingestion operations into native tables.
      fr: |
        Accélérer un raccourci n'est pas une ingestion ; cette commande liste les échecs des opérations d'ingestion dans des tables natives.
    c:
      en: |
        This command returns details of the database's native tables, not the acceleration status of external tables.
      fr: |
        Cette commande renvoie des détails sur les tables natives de la base de données, pas l'état d'accélération des tables externes.
    a:
      en: |
        The Capacity Metrics app shows the capacity consumed by acceleration, not how much of each table is accelerated.
      fr: |
        L'application Capacity Metrics montre la capacité consommée par l'accélération, pas la part accélérée de chaque table.
references:
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
