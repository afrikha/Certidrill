id: dp700-2a-star-load-order
objective: "2.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **DW1** that contains a star schema with the following tables:

    - dbo.DimGeography
    - dbo.DimCustomer, which has a GeographyKey column that references dbo.DimGeography
    - dbo.FactSales, which references dbo.DimCustomer

    A semantic model named **SM1** imports these tables. You are designing the nightly load from the source systems. The source data must be extracted only once per run, and the load must follow Fabric guidance for dimensional models.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un entrepôt nommé **DW1** qui contient un schéma en étoile composé des tables suivantes :

    - dbo.DimGeography
    - dbo.DimCustomer, qui comporte une colonne GeographyKey référençant dbo.DimGeography
    - dbo.FactSales, qui référence dbo.DimCustomer

    Un modèle sémantique nommé **SM1** importe ces tables. Vous concevez le chargement nocturne depuis les systèmes sources. Les données sources ne doivent être extraites qu'une fois par exécution, et le chargement doit suivre les recommandations Fabric pour les modèles dimensionnels.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: stage, text: { en: "Truncate the staging tables, and then load them with the source data.", fr: "Tronquer les tables de mise en lots, puis les charger avec les données sources." } }
    - { id: geo, text: { en: "Process dbo.DimGeography.", fr: "Traiter dbo.DimGeography." } }
    - { id: cust, text: { en: "Process dbo.DimCustomer.", fr: "Traiter dbo.DimCustomer." } }
    - { id: fact, text: { en: "Load dbo.FactSales by looking up the surrogate keys of the dimensions.", fr: "Charger dbo.FactSales en recherchant les clés de substitution des dimensions." } }
    - { id: refresh, text: { en: "Refresh SM1.", fr: "Actualiser SM1." } }
    - { id: truncdim, text: { en: "Truncate dbo.DimCustomer, and then reload it from the staging tables.", fr: "Tronquer dbo.DimCustomer, puis la recharger à partir des tables de mise en lots." } }
    - { id: dropfk, text: { en: "Drop the foreign key constraints of dbo.FactSales.", fr: "Supprimer les contraintes de clé étrangère de dbo.FactSales." } }
answer:
  sequence: [stage, geo, cust, fact, refresh]
explanation:
  correct:
    en: |
      Fabric guidance loads staging tables first (truncated at the start of each run), then processes the dimensions in dependency order (the geography dimension used by the customer dimension first), then the facts, which need the surrogate keys of every dimension. Post-processing, such as refreshing dependent semantic models, comes last.
    fr: |
      Les recommandations Fabric chargent d'abord les tables de mise en lots (tronquées au début de chaque exécution), traitent ensuite les dimensions dans l'ordre des dépendances (la dimension géographique utilisée par la dimension client en premier), puis les faits, qui ont besoin des clés de substitution de chaque dimension. Le post-traitement, comme l'actualisation des modèles sémantiques dépendants, vient en dernier.
  options:
    truncdim: { en: "Truncating and reloading a dimension with generated surrogate keys breaks the keys stored in the fact table.", fr: "Tronquer et recharger une dimension à clés de substitution générées casse les clés stockées dans la table de faits." }
    dropfk: { en: "Fabric Data Warehouse doesn't enforce foreign keys (NOT ENFORCED), so they never block the load.", fr: "Fabric Data Warehouse n'applique pas les clés étrangères (NOT ENFORCED) : elles ne bloquent jamais le chargement." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
