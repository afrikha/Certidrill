id: dp700-cs2c-transform-tools
objective: "2.2.2"
type: dragdrop
caseStudy: dp700-cs2c-wide-world
difficulty: 2
status: draft
stem:
  en: |
    You need to choose how to develop each of the following transformations. The solution must meet the requirement for the transformations.

    What should you use for each transformation? To answer, drag the appropriate tools to the correct transformations. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir comment développer chacune des transformations suivantes. La solution doit respecter l'exigence relative aux transformations.

    Que devez-vous utiliser pour chaque transformation ? Pour répondre, faites glisser les outils appropriés vers les transformations correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tsql, text: { en: "T-SQL stored procedures", fr: "Procédures stockées T-SQL" } }
    - { id: notebook, text: { en: "A PySpark notebook", fr: "Un notebook PySpark" } }
    - { id: dataflow, text: "Dataflow Gen2" }
    - { id: kql, text: { en: "A KQL update policy", fr: "Une stratégie de mise à jour KQL" } }
    - { id: copy, text: { en: "A pipeline Copy activity", fr: "Une activité Copy de pipeline" } }
  targets:
    - id: star
      text: { en: "Warehouse team: build the dimension and fact tables of WH_Trade from its staging tables", fr: "Équipe entrepôt : construire les tables de dimension et de faits de WH_Trade à partir de ses tables intermédiaires" }
    - id: json
      text: { en: "Data engineers: flatten the nested JSON customs documents of customs_docs into Delta tables of LH_Trade", fr: "Ingénieurs données : aplatir les documents douaniers JSON imbriqués de customs_docs dans des tables Delta de LH_Trade" }
    - id: fees
      text: { en: "Procurement analysts: clean the port fees list and load it into WH_Trade", fr: "Analystes achats : nettoyer la liste des frais portuaires et la charger dans WH_Trade" }
    - id: pings
      text: { en: "Data engineers: parse each batch of rows ingested into VesselPings into a typed table in EH_Vessels, as the data is ingested", fr: "Ingénieurs données : analyser chaque lot de lignes ingéré dans VesselPings vers une table typée dans EH_Vessels, au fil de l'ingestion" }
answer:
  mapping: { star: tsql, json: notebook, fees: dataflow, pings: kql }
explanation:
  correct:
    en: |
      The warehouse team works only in T-SQL, and stored procedures transform the staging tables inside WH_Trade. Nested JSON files in a lakehouse are a code-first Spark task for the PySpark engineers. Dataflow Gen2 gives the procurement analysts a no-code Power Query interface with a SharePoint connector and a warehouse destination. The data engineers also write KQL, and an update policy runs a KQL query each time data is ingested into its source table and writes the result to a target table of the same database.
    fr: |
      L'équipe entrepôt travaille uniquement en T-SQL, et des procédures stockées transforment les tables intermédiaires à l'intérieur de WH_Trade. Des fichiers JSON imbriqués dans un lakehouse relèvent d'un traitement Spark avec du code, pour les ingénieurs PySpark. Dataflow Gen2 offre aux analystes achats une interface Power Query sans code, avec un connecteur SharePoint et une destination entrepôt. Les ingénieurs données écrivent aussi du KQL, et une stratégie de mise à jour exécute une requête KQL chaque fois que des données sont ingérées dans sa table source et écrit le résultat dans une table cible de la même base de données.
  options:
    copy: { en: "A Copy activity moves data with only lightweight transformations such as column mapping and type conversion.", fr: "Une activité Copy déplace des données avec seulement des transformations légères, comme le mappage de colonnes et la conversion de types." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
