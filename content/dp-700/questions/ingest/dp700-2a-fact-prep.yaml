id: dp700-2a-fact-prep
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are preparing source sales rows for loading into a fact table named **dbo.FactSales** in a warehouse named **DW1**. dbo.FactSales references a date dimension, a customer dimension and a product dimension. The source rows contain the order date, the customer and product business keys, the quantity, the unit price and the discount.

    Which two transformations should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez des lignes de ventes sources en vue de leur chargement dans une table de faits nommée **dbo.FactSales** d'un entrepôt nommé **DW1**. dbo.FactSales référence une dimension de dates, une dimension client et une dimension produit. Les lignes sources contiennent la date de commande, les clés métier du client et du produit, la quantité, le prix unitaire et la remise.

    Quelles sont les deux transformations à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace the customer and product business keys with the surrogate keys of the matching dimension rows.", fr: "Remplacer les clés métier du client et du produit par les clés de substitution des lignes de dimension correspondantes." } }
    - { id: b, text: { en: "Copy the customer name and city into dbo.FactSales to avoid joins with the customer dimension.", fr: "Copier le nom et la ville du client dans dbo.FactSales pour éviter les jointures avec la dimension client." } }
    - { id: c, text: { en: "Convert the order date to an integer date key in the YYYYMMDD format.", fr: "Convertir la date de commande en clé de date entière au format YYYYMMDD." } }
    - { id: d, text: { en: "Remove the rows whose customer isn't found in the customer dimension.", fr: "Supprimer les lignes dont le client est introuvable dans la dimension client." } }
    - { id: e, text: { en: "Replace the discount amount with a discount percentage of the line amount.", fr: "Remplacer le montant de la remise par un pourcentage de remise du montant de la ligne." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Fact rows store the surrogate keys of the dimensions, found by looking up each business key (the current version for an SCD type 2 dimension). Date keys are usually computed directly from the date in the YYYYMMDD format, without a lookup.
    fr: |
      Les lignes de faits stockent les clés de substitution des dimensions, trouvées en recherchant chaque clé métier (la version courante pour une dimension SCD de type 2). Les clés de date sont généralement calculées directement à partir de la date au format YYYYMMDD, sans recherche.
  options:
    b: { en: "Descriptive attributes belong in the dimension; the fact table stays narrow and joins on keys.", fr: "Les attributs descriptifs appartiennent à la dimension ; la table de faits reste étroite et se joint sur les clés." }
    d: { en: "A fact row must never be dropped for a failed lookup; use the Unknown member or an inferred member.", fr: "Une ligne de faits ne doit jamais être écartée pour une recherche en échec ; utilisez le membre Unknown ou un membre déduit." }
    e: { en: "A percentage is non-additive; Learn recommends storing the components, such as the discount amount.", fr: "Un pourcentage n'est pas additif ; Learn recommande de stocker les composants, comme le montant de la remise." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Fact tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables
