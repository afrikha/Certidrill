id: dp700-2c-python-scoring
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam receives machine events in an Azure Event Hubs instance. The event payload is a proprietary binary format that can be decoded only by an in-house Python library. You have a Fabric workspace that contains a lakehouse named LH_Plant.

    You need to decode each event, score it by using a scikit-learn model, and upsert the results by MachineID into a Delta table in LH_Plant within one minute of arrival.

    Which streaming engine should you use?
  fr: |
    Fabrikam reçoit des événements de machines dans une instance Azure Event Hubs. La charge utile des événements est un format binaire propriétaire qui ne peut être décodé que par une bibliothèque Python interne. Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé LH_Plant.

    Vous devez décoder chaque événement, le noter avec un modèle scikit-learn et effectuer une opération upsert des résultats par MachineID dans une table Delta de LH_Plant dans la minute qui suit leur arrivée.

    Quel moteur de diffusion en continu devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "An eventstream that uses a Manage fields operator"
        fr: "Un flux d'événements qui utilise un opérateur Manage fields"
    - id: b
      text:
        en: "An eventhouse that uses an update policy"
        fr: "Un eventhouse qui utilise une stratégie de mise à jour"
    - id: c
      text:
        en: "An eventstream that uses the SQL operator"
        fr: "Un flux d'événements qui utilise l'opérateur SQL"
    - id: d
      text:
        en: "Spark structured streaming"
        fr: "Le streaming structuré Spark"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Spark structured streaming runs PySpark code, so it can import custom Python libraries and machine learning models, read Event Hubs, and write each micro-batch to Delta tables, including merges by key. The trigger interval keeps the latency within the minute.
    fr: |
      Le streaming structuré Spark exécute du code PySpark : il peut importer des bibliothèques Python personnalisées et des modèles d'apprentissage automatique, lire Event Hubs et écrire chaque micro-lot dans des tables Delta, y compris par fusion sur une clé. L'intervalle du déclencheur maintient la latence en dessous de la minute.
  options:
    c:
      en: |
        The SQL operator of an eventstream expresses filters, joins, windows, and aggregations in SQL; it can't call a Python library or a scikit-learn model.
      fr: |
        L'opérateur SQL d'un flux d'événements exprime en SQL des filtres, des jointures, des fenêtres et des agrégations ; il ne peut pas appeler une bibliothèque Python ni un modèle scikit-learn.
    b:
      en: |
        An update policy runs KQL at ingestion into eventhouse tables; it doesn't run Python libraries or upsert into Delta tables of a lakehouse.
      fr: |
        Une stratégie de mise à jour exécute du KQL à l'ingestion dans des tables d'eventhouse ; elle n'exécute pas de bibliothèques Python et n'effectue pas d'upsert dans des tables Delta d'un lakehouse.
    a:
      en: |
        Manage fields adds, removes, renames, or retypes fields; it can't decode a proprietary binary payload.
      fr: |
        Manage fields ajoute, supprime, renomme ou change le type de champs ; il ne peut pas décoder une charge utile binaire propriétaire.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
