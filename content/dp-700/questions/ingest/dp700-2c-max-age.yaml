id: dp700-2c-max-age
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a KQL database that contains an accelerated OneLake shortcut named inventory. The policy of the shortcut is set to `{"IsEnabled": true, "Hot": "30.00:00:00"}`. A Spark job updates the source Delta table by using MERGE statements.

    After large MERGE operations, the index refresh of inventory sometimes falls 10 to 20 minutes behind. During those periods, dashboard queries on inventory become much slower.

    The dashboards can show inventory data that is up to 30 minutes old. You need the queries to keep using the accelerated data during those periods.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL qui contient un raccourci OneLake accéléré nommé inventory. La stratégie du raccourci est définie sur `{"IsEnabled": true, "Hot": "30.00:00:00"}`. Un travail Spark met à jour la table Delta source avec des instructions MERGE.

    Après de grosses opérations MERGE, l'actualisation de l'index d'inventory prend parfois 10 à 20 minutes de retard. Pendant ces périodes, les requêtes des tableaux de bord sur inventory deviennent beaucoup plus lentes.

    Les tableaux de bord peuvent afficher des données d'inventaire datant de 30 minutes au plus. Vous devez faire en sorte que les requêtes continuent d'utiliser les données accélérées pendant ces périodes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add a HotWindows property that covers the last 30 minutes to the policy."
        fr: "Ajouter à la stratégie une propriété HotWindows qui couvre les 30 dernières minutes."
    - id: b
      text:
        en: "Run OPTIMIZE on the source Delta table after each MERGE operation."
        fr: "Exécuter OPTIMIZE sur la table Delta source après chaque opération MERGE."
    - id: c
      text:
        en: "Add `\"MaxAge\": \"00:30:00\"` to the query acceleration policy of inventory."
        fr: "Ajouter `\"MaxAge\": \"00:30:00\"` à la stratégie d'accélération des requêtes d'inventory."
    - id: d
      text:
        en: "Change the Hot property of the policy to `\"60.00:00:00\"`."
        fr: "Remplacer la propriété Hot de la stratégie par `\"60.00:00:00\"`."
answer: { optionId: c }
explanation:
  correct:
    en: |
      An accelerated external table returns accelerated data only if its last index refresh is more recent than now minus MaxAge; otherwise it operates in non-accelerated mode and reads the files directly. MaxAge defaults to 5 minutes, so a 10 to 20 minute lag makes queries fall back to the slow mode. Setting MaxAge to 30 minutes keeps the accelerated data in use while respecting the 30-minute freshness tolerance.
    fr: |
      Une table externe accélérée ne renvoie des données accélérées que si sa dernière actualisation d'index est plus récente que maintenant moins MaxAge ; sinon, elle fonctionne en mode non accéléré et lit directement les fichiers. MaxAge vaut 5 minutes par défaut : un retard de 10 à 20 minutes fait basculer les requêtes dans le mode lent. Définir MaxAge sur 30 minutes maintient l'utilisation des données accélérées tout en respectant la tolérance de fraîcheur de 30 minutes.
  options:
    d:
      en: |
        Hot defines how many days of files are accelerated; a longer period adds data to index and doesn't change the fallback when the index lags.
      fr: |
        Hot définit combien de jours de fichiers sont accélérés ; une période plus longue ajoute des données à indexer et ne change pas le basculement quand l'index prend du retard.
    a:
      en: |
        HotWindows adds time windows of data files to accelerate; it doesn't control how stale the index can be.
      fr: |
        HotWindows ajoute des fenêtres de temps de fichiers de données à accélérer ; il ne contrôle pas l'ancienneté tolérée de l'index.
    b:
      en: |
        Running OPTIMIZE rewrites files that must then be accelerated again, which increases the indexing lag.
      fr: |
        Exécuter OPTIMIZE réécrit des fichiers qui doivent ensuite être de nouveau accélérés, ce qui augmente le retard d'indexation.
references:
  - title: .alter query acceleration policy command
    url: https://learn.microsoft.com/en-us/kusto/management/alter-query-acceleration-policy-command?view=microsoft-fabric
  - title: Query acceleration policy
    url: https://learn.microsoft.com/en-us/kusto/management/query-acceleration-policy?view=microsoft-fabric
