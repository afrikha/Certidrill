id: dp700-2a-tool-analysts
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Finance analysts at Northwind Traders maintain monthly budget files as Excel workbooks in SharePoint. The analysts know Power Query but don't write code.

    They need to clean the workbooks (remove header rows, unpivot the month columns, change data types) and load the result into a table in a lakehouse named **Lakehouse1**. The analysts will maintain the transformation themselves.

    What should they use?
  fr: |
    Les analystes financiers de Northwind Traders gèrent des fichiers de budget mensuels sous forme de classeurs Excel dans SharePoint. Les analystes connaissent Power Query mais n'écrivent pas de code.

    Ils doivent nettoyer les classeurs (supprimer des lignes d'en-tête, dépivoter les colonnes de mois, changer les types de données) et charger le résultat dans une table d'un lakehouse nommé **Lakehouse1**. Les analystes maintiendront eux-mêmes la transformation.

    Que doivent-ils utiliser ?
body:
  options:
    - { id: a, text: { en: "A notebook that uses PySpark", fr: "Un notebook qui utilise PySpark" } }
    - { id: b, text: { en: "A T-SQL stored procedure in a warehouse", fr: "Une procédure stockée T-SQL dans un entrepôt" } }
    - { id: c, text: { en: "A KQL update policy in an eventhouse", fr: "Une stratégie de mise à jour KQL dans un eventhouse" } }
    - { id: d, text: { en: "A Dataflow Gen2", fr: "Un Dataflow Gen2" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Dataflow Gen2 is a low-code tool built on Power Query, with more than 150 connectors (including SharePoint and Excel) and more than 300 transformation functions. It writes to destinations such as lakehouse tables, so analysts who know Power Query can build and maintain the transformation without code.
    fr: |
      Dataflow Gen2 est un outil low-code fondé sur Power Query, avec plus de 150 connecteurs (dont SharePoint et Excel) et plus de 300 fonctions de transformation. Il écrit dans des destinations comme les tables de lakehouse : des analystes qui connaissent Power Query peuvent créer et maintenir la transformation sans code.
  options:
    a: { en: "A notebook requires writing PySpark code, which the analysts don't do.", fr: "Un notebook demande d'écrire du code PySpark, ce que les analystes ne font pas." }
    b: { en: "A stored procedure is T-SQL code and writes to warehouse tables, not to Lakehouse1.", fr: "Une procédure stockée est du code T-SQL et écrit dans des tables d'entrepôt, pas dans Lakehouse1." }
    c: { en: "An update policy is KQL code that transforms data ingested into an eventhouse table.", fr: "Une stratégie de mise à jour est du code KQL qui transforme des données ingérées dans une table d'eventhouse." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
