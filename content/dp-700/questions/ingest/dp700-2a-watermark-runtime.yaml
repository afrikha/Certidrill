id: dp700-2a-watermark-runtime
objective: "2.1.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are designing a pipeline that loads the new and changed rows of a table named **dbo.Claims** from an Azure SQL database to a lakehouse. dbo.Claims has a LastModified column that is updated on every insert and update. A control table stores the watermark of the last successful load.

    Each changed row must be copied exactly once, even if a run fails.

    Which three actions should the pipeline perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous concevez un pipeline qui charge les lignes nouvelles et modifiées d'une table nommée **dbo.Claims** d'une base de données Azure SQL vers un lakehouse. dbo.Claims comporte une colonne LastModified mise à jour à chaque insertion et mise à jour. Une table de contrôle stocke le filigrane du dernier chargement réussi.

    Chaque ligne modifiée doit être copiée exactement une fois, même si une exécution échoue.

    Quelles sont les trois actions que le pipeline doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: lookups, text: { en: "Read the stored watermark and the current maximum LastModified value of dbo.Claims.", fr: "Lire le filigrane stocké et la valeur maximale actuelle de LastModified dans dbo.Claims." } }
    - { id: copy, text: { en: "Copy the rows whose LastModified value is greater than the stored watermark and less than or equal to the current maximum.", fr: "Copier les lignes dont la valeur LastModified est supérieure au filigrane stocké et inférieure ou égale au maximum actuel." } }
    - { id: save, text: { en: "If the copy succeeds, save the current maximum as the new watermark in the control table.", fr: "Si la copie réussit, enregistrer le maximum actuel comme nouveau filigrane dans la table de contrôle." } }
    - { id: savenow, text: { en: "Save the current date and time as the new watermark in the control table.", fr: "Enregistrer la date et l'heure actuelles comme nouveau filigrane dans la table de contrôle." } }
    - { id: trunc, text: { en: "Truncate the destination table in the lakehouse.", fr: "Tronquer la table de destination dans le lakehouse." } }
    - { id: copyge, text: { en: "Copy the rows whose LastModified value is greater than or equal to the stored watermark.", fr: "Copier les lignes dont la valeur LastModified est supérieure ou égale au filigrane stocké." } }
answer:
  sequence: [lookups, copy, save]
explanation:
  correct:
    en: |
      The pipeline first reads both bounds, then copies the rows between them (old value excluded, new value included), and saves the new value only after the copy succeeds. If the copy fails, the watermark doesn't move and the next run copies the same range again.
    fr: |
      Le pipeline lit d'abord les deux bornes, copie ensuite les lignes comprises entre elles (ancienne valeur exclue, nouvelle valeur incluse), puis n'enregistre la nouvelle valeur qu'après la réussite de la copie. Si la copie échoue, le filigrane ne bouge pas et l'exécution suivante recopie la même plage.
  options:
    savenow: { en: "The current time isn't the upper bound used by the copy: rows changed during the run would be skipped.", fr: "L'heure actuelle n'est pas la borne supérieure utilisée par la copie : les lignes modifiées pendant l'exécution seraient ignorées." }
    trunc: { en: "Truncating the destination removes the rows loaded by previous runs; an incremental load keeps them.", fr: "Tronquer la destination supprime les lignes chargées par les exécutions précédentes ; un chargement incrémentiel les conserve." }
    copyge: { en: "Greater than or equal copies again the rows equal to the old watermark, and without an upper bound the range isn't the one saved.", fr: "Supérieur ou égal recopie les lignes égales à l'ancien filigrane, et sans borne supérieure la plage n'est pas celle qui est enregistrée." }
references:
  - title: Incrementally load data from Data Warehouse to Lakehouse
    url: https://learn.microsoft.com/en-us/fabric/data-factory/tutorial-incremental-copy-data-warehouse-lakehouse
