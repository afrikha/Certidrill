id: dp700-2d-ss-write-statements
objective: "2.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse named **LH-Plant**. A Spark job definition reads machine events from an Azure event hub into a streaming DataFrame named `events`, which has no aggregation, and runs the following code.

    ```python
    (events.writeStream
        .format("delta")
        .outputMode("append")
        .option("checkpointLocation", "Files/checkpoints/telemetry")
        .partitionBy("EventDate")
        .trigger(processingTime="2 minutes")
        .toTable("telemetry"))
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé **LH-Plant**. Une définition de travail Spark lit des événements de machines d'un hub d'événements Azure dans un DataFrame de streaming nommé `events`, sans agrégation, et exécute le code suivant.

    ```python
    (events.writeStream
        .format("delta")
        .outputMode("append")
        .option("checkpointLocation", "Files/checkpoints/telemetry")
        .partitionBy("EventDate")
        .trigger(processingTime="2 minutes")
        .toTable("telemetry"))
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          Each micro-batch adds its new rows to telemetry without rewriting the rows written by earlier micro-batches.
        fr: |-
          Chaque micro-lot ajoute ses nouvelles lignes à telemetry sans réécrire les lignes écrites par les micro-lots précédents.
    - id: s2
      text:
        en: |-
          A second streaming query that writes the same events to a table named telemetry_archive can use Files/checkpoints/telemetry as its checkpoint location.
        fr: |-
          Une seconde requête de streaming qui écrit les mêmes événements dans une table nommée telemetry_archive peut utiliser Files/checkpoints/telemetry comme emplacement de point de contrôle.
    - id: s3
      text:
        en: |-
          If a micro-batch takes three minutes to complete, Spark starts the next micro-batch while the current one is still running.
        fr: |-
          Si un micro-lot prend trois minutes, Spark démarre le micro-lot suivant pendant que le micro-lot en cours s'exécute encore.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      The append output mode writes only the new rows of each micro-batch to the Delta table. A checkpoint records the progress and state of one query, so every query needs its own checkpoint location. A processing-time trigger sets how often Spark checks for new data; micro-batches don't overlap, and when one takes longer than the interval, the next one starts as soon as it completes.
    fr: |-
      Le mode de sortie append n'écrit dans la table Delta que les nouvelles lignes de chaque micro-lot. Un point de contrôle enregistre la progression et l'état d'une seule requête : chaque requête a donc besoin de son propre emplacement de point de contrôle. Un déclencheur processingTime définit la fréquence à laquelle Spark vérifie l'arrivée de nouvelles données ; les micro-lots ne se chevauchent pas, et quand l'un d'eux dure plus longtemps que l'intervalle, le suivant démarre dès qu'il se termine.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
  - title: Configure Structured Streaming trigger intervals
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/triggers
