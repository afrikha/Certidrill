id: dp700-2d-kql-feature-match
objective: "2.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named **DB-Web**. An eventstream ingests raw web server logs into a table named **RawHits**.

    You need to meet the following requirements by using KQL database features.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **DB-Web**. Un flux d'événements ingère des journaux bruts de serveurs web dans une table nommée **RawHits**.

    Vous devez satisfaire les exigences suivantes à l'aide de fonctionnalités de base de données KQL.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - id: policy
      text: { en: "Update policy", fr: "Stratégie de mise à jour" }
    - id: mview
      text: { en: "Materialized view", fr: "Vue matérialisée" }
    - id: function
      text: { en: "Stored function", fr: "Fonction stockée" }
    - id: retention
      text: { en: "Retention policy", fr: "Stratégie de rétention" }
    - id: setappend
      text: { en: "The .set-or-append command", fr: "La commande .set-or-append" }
  targets:
    - id: t1
      text: { en: "Write each new batch of RawHits into a table named Hits with typed columns parsed from the raw text", fr: "Écrire chaque nouveau lot de RawHits dans une table nommée Hits avec des colonnes typées extraites du texte brut" }
    - id: t2
      text: { en: "Maintain a version of Hits that contains one record per RequestId, without duplicates", fr: "Maintenir une version de Hits qui contient un enregistrement par RequestId, sans doublons" }
    - id: t3
      text: { en: "Share a parameterized query that several dashboards and querysets call", fr: "Partager une requête paramétrée que plusieurs tableaux de bord et ensembles de requêtes appellent" }
    - id: t4
      text: { en: "Automatically remove the rows of Hits that are older than 90 days", fr: "Supprimer automatiquement les lignes de Hits de plus de 90 jours" }
answer:
  mapping: { t1: policy, t2: mview, t3: function, t4: retention }
explanation:
  correct:
    en: |-
      An update policy runs a query on each batch ingested into a source table and writes the result to a target table. A materialized view that uses `take_any(*)` by a key deduplicates the source continuously. A stored function holds reusable, parameterized query logic. A retention policy removes data older than its soft-delete period.
    fr: |-
      Une stratégie de mise à jour exécute une requête sur chaque lot ingéré dans une table source et écrit le résultat dans une table cible. Une vue matérialisée qui utilise `take_any(*)` par clé déduplique la source en continu. Une fonction stockée contient une logique de requête réutilisable et paramétrée. Une stratégie de rétention supprime les données plus anciennes que sa période de suppression réversible.
  options:
    setappend:
      en: |-
        .set-or-append writes the result of a query once, when you run it; it doesn't transform each new batch automatically.
      fr: |-
        .set-or-append écrit une seule fois le résultat d'une requête, quand vous l'exécutez ; il ne transforme pas automatiquement chaque nouveau lot.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
  - title: Create materialized view
    url: https://learn.microsoft.com/en-us/kusto/management/materialized-views/materialized-view-create?view=microsoft-fabric
