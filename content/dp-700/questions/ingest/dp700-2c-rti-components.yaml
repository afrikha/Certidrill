id: dp700-2c-rti-components
objective: "2.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind uses Fabric Real-Time Intelligence. An eventstream named ES_Sensors receives sensor events and sends them to a KQL database named SensorDB in an eventhouse.

    You need to meet the following requirements:

    - Parse the raw JSON events into typed columns of another table automatically as they are ingested into SensorDB.
    - Keep the latest reading of each sensor always up to date in SensorDB for fast lookups.
    - Publish a filtered subset of the events of ES_Sensors so that other teams can discover and use it in the Real-Time hub.
    - Let data engineers read the SensorDB tables from Spark notebooks as Delta tables, without building a copy process.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind utilise Fabric Real-Time Intelligence. Un flux d'événements nommé ES_Sensors reçoit des événements de capteurs et les envoie à une base de données KQL nommée SensorDB dans un eventhouse.

    Vous devez répondre aux exigences suivantes :

    - Analyser les événements JSON bruts en colonnes typées d'une autre table, automatiquement à leur ingestion dans SensorDB.
    - Maintenir toujours à jour dans SensorDB le dernier relevé de chaque capteur pour des recherches rapides.
    - Publier un sous-ensemble filtré des événements d'ES_Sensors pour que d'autres équipes puissent le découvrir et l'utiliser dans le hub en temps réel.
    - Permettre aux ingénieurs données de lire les tables de SensorDB depuis des notebooks Spark comme des tables Delta, sans créer de processus de copie.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: update, text: { en: "Update policy", fr: "Stratégie de mise à jour" } }
    - { id: mv, text: { en: "Materialized view", fr: "Vue matérialisée" } }
    - { id: derived, text: { en: "Derived stream", fr: "Flux dérivé" } }
    - { id: availability, text: { en: "OneLake availability", fr: "Disponibilité OneLake" } }
    - { id: activator, text: Activator }
    - { id: dashboard, text: { en: "Real-Time Dashboard", fr: "Tableau de bord en temps réel" } }
  targets:
    - { id: t1, text: { en: "Parse raw JSON into typed columns at ingestion", fr: "Analyser le JSON brut en colonnes typées à l'ingestion" } }
    - { id: t2, text: { en: "Latest reading of each sensor, always up to date", fr: "Dernier relevé de chaque capteur, toujours à jour" } }
    - { id: t3, text: { en: "Filtered subset discoverable in the Real-Time hub", fr: "Sous-ensemble filtré visible dans le hub en temps réel" } }
    - { id: t4, text: { en: "SensorDB tables readable as Delta tables by Spark", fr: "Tables de SensorDB lisibles comme tables Delta par Spark" } }
answer:
  mapping: { t1: update, t2: mv, t3: derived, t4: availability }
explanation:
  correct:
    en: |
      An update policy runs a KQL query on the data ingested into a source table and writes the result, such as parsed columns, to a target table. A materialized view with arg_max keeps the latest record per key up to date. A derived stream is the output of eventstream operators such as Filter; it can be routed to destinations and appears in the Real-Time hub. OneLake availability exposes the eventhouse data in OneLake in Delta format for other engines.
    fr: |
      Une stratégie de mise à jour exécute une requête KQL sur les données ingérées dans une table source et écrit le résultat, par exemple des colonnes analysées, dans une table cible. Une vue matérialisée avec arg_max maintient à jour le dernier enregistrement par clé. Un flux dérivé est la sortie d'opérateurs de flux d'événements comme Filter ; il peut être routé vers des destinations et apparaît dans le hub en temps réel. La disponibilité OneLake expose les données de l'eventhouse dans OneLake au format Delta pour les autres moteurs.
  options:
    activator:
      en: "Activator detects conditions and triggers actions such as alerts; it doesn't transform or store the data."
      fr: "Activator détecte des conditions et déclenche des actions comme des alertes ; il ne transforme ni ne stocke les données."
    dashboard:
      en: "A Real-Time Dashboard visualizes query results; it doesn't create tables or streams."
      fr: "Un tableau de bord en temps réel affiche des résultats de requêtes ; il ne crée ni tables ni flux."
references:
  - title: What is Real-Time Intelligence in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
