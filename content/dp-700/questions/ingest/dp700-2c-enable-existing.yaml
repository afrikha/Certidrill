id: dp700-2c-enable-existing
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database named SalesDB that contains a OneLake shortcut named sales_history. The shortcut was created without query acceleration. You have the Contributor role in the workspace.

    You need to enable query acceleration on sales_history. The solution must minimize effort and keep the existing shortcut.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL nommée SalesDB qui contient un raccourci OneLake nommé sales_history. Le raccourci a été créé sans accélération des requêtes. Vous avez le rôle Contributor dans l'espace de travail.

    Vous devez activer l'accélération des requêtes sur sales_history. La solution doit réduire l'effort au minimum et conserver le raccourci existant.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Set the caching policy of SalesDB to the number of days to accelerate."
        fr: "Définir la stratégie de mise en cache de SalesDB sur le nombre de jours à accélérer."
    - id: b
      text:
        en: "Enable OneLake availability on SalesDB."
        fr: "Activer la disponibilité OneLake sur SalesDB."
    - id: c
      text:
        en: "In the source lakehouse, run OPTIMIZE with V-Order on the Delta table."
        fr: "Dans le lakehouse source, exécuter OPTIMIZE avec V-Order sur la table Delta."
    - id: d
      text:
        en: "Select sales_history, select **Manage** > **Data policies**, and set **Query acceleration** to **On**."
        fr: "Sélectionner sales_history, sélectionner **Manage** > **Data policies** et définir **Query acceleration** sur **On**."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Query acceleration can be turned on for an existing shortcut from Manage > Data policies, where you can also enter the number of days to cache. The Admin, Member, or Contributor workspace role is required.
    fr: |
      L'accélération des requêtes peut être activée sur un raccourci existant depuis Manage > Data policies, où vous pouvez aussi saisir le nombre de jours à mettre en cache. Le rôle d'espace de travail Admin, Member ou Contributor est requis.
  options:
    a:
      en: |
        The database caching policy applies to the data stored in the database; it doesn't turn on acceleration for a shortcut, although it is the default caching period of accelerated shortcuts.
      fr: |
        La stratégie de mise en cache de la base de données s'applique aux données stockées dans la base ; elle n'active pas l'accélération d'un raccourci, même si elle sert de période de mise en cache par défaut aux raccourcis accélérés.
    b:
      en: |
        OneLake availability exposes KQL database data in OneLake; it doesn't accelerate shortcuts.
      fr: |
        La disponibilité OneLake expose les données de la base de données KQL dans OneLake ; elle n'accélère pas les raccourcis.
    c:
      en: |
        OPTIMIZE compacts the Delta files; it doesn't create the acceleration policy, and on an accelerated table it triggers reacceleration of the rewritten files.
      fr: |
        OPTIMIZE compacte les fichiers Delta ; il ne crée pas la stratégie d'accélération, et sur une table accélérée il déclenche la réaccélération des fichiers réécrits.
references:
  - title: Query acceleration over OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration
