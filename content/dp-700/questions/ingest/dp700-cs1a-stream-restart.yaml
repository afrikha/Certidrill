id: dp700-cs1a-stream-restart
objective: "2.1.3"
type: single
caseStudy: dp700-cs1a-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |-
    You need to meet requirement 4 for the snow-cannon scoring. What should you do?
  fr: |-
    Vous devez satisfaire l'exigence 4 concernant l'évaluation de la télémétrie des canons à neige. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Schedule a pipeline that runs NB_ScoreStream every 15 minutes", fr: "Planifier un pipeline qui exécute NB_ScoreStream toutes les 15 minutes" } }
    - { id: b, text: { en: "Turn on high concurrency mode and run NB_ScoreStream in a shared session", fr: "Activer le mode haute concurrence et exécuter NB_ScoreStream dans une session partagée" } }
    - { id: c, text: { en: "Run the stream in a Spark job definition that has a retry policy", fr: "Exécuter le flux dans une définition de travail Spark dotée d'une stratégie de nouvelle tentative" } }
    - { id: d, text: { en: "Increase the Spark session timeout of ASH-Snow to its maximum", fr: "Augmenter au maximum le délai d'expiration de session Spark de ASH-Snow" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Notebooks are meant to develop and test streaming logic; continuous production streams should run as Spark job definitions, which are non-interactive. A retry policy on the Spark job definition restarts the job automatically after an unexpected stop, with a configurable number of retries and interval, so the stream keeps running until someone stops it.
    fr: |-
      Les notebooks servent à développer et tester la logique de streaming ; les flux de production continus doivent s'exécuter dans des définitions de travail Spark, qui ne sont pas interactives. Une stratégie de nouvelle tentative sur la définition de travail Spark redémarre automatiquement le travail après un arrêt inattendu, avec un nombre de tentatives et un intervalle configurables ; le flux s'exécute ainsi jusqu'à ce que quelqu'un l'arrête.
  options:
    a:
      en: |-
        A schedule starts new runs at fixed times but does not restart a stream that stops between two runs, and it can start a second run while the first one is still active.
      fr: |-
        Une planification lance de nouvelles exécutions à heures fixes, mais ne redémarre pas un flux qui s'arrête entre deux exécutions, et elle peut lancer une deuxième exécution alors que la première est toujours active.
    b:
      en: |-
        High concurrency mode lets several notebooks share one Spark session to reduce start time; it does not restart a stopped stream.
      fr: |-
        Le mode haute concurrence permet à plusieurs notebooks de partager une session Spark pour réduire le temps de démarrage ; il ne redémarre pas un flux arrêté.
    d:
      en: |-
        The session timeout only controls when an idle interactive session expires; it does not restart the stream after an infrastructure failure.
      fr: |-
        Le délai d'expiration de session détermine seulement quand une session interactive inactive expire ; il ne redémarre pas le flux après une défaillance de l'infrastructure.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
  - title: Data Engineering workspace administration settings in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
