id: dp700-2b-shortcut-sources
objective: "2.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH-Partners. Partners of your company store data in the following locations:

    - an Amazon S3 bucket
    - an Azure SQL database
    - a Google Cloud Storage bucket
    - an Azure Cosmos DB account
    - an Azure Database for PostgreSQL server

    You need to give LH-Partners access to partner data without copying the data.

    Which two locations can you reference by using a OneLake shortcut?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH-Partners. Les partenaires de votre société stockent des données aux emplacements suivants :

    - un compartiment Amazon S3
    - une base de données Azure SQL
    - un compartiment Google Cloud Storage
    - un compte Azure Cosmos DB
    - un serveur Azure Database pour PostgreSQL

    Vous devez donner à LH-Partners l'accès aux données des partenaires sans copier les données.

    Quels sont les deux emplacements que vous pouvez référencer avec un raccourci OneLake ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Azure Database for PostgreSQL server", fr: "Le serveur Azure Database pour PostgreSQL" } }
    - { id: b, text: { en: "The Azure SQL database", fr: "La base de données Azure SQL" } }
    - { id: c, text: { en: "The Google Cloud Storage bucket", fr: "Le compartiment Google Cloud Storage" } }
    - { id: d, text: { en: "The Azure Cosmos DB account", fr: "Le compte Azure Cosmos DB" } }
    - { id: e, text: { en: "The Amazon S3 bucket", fr: "Le compartiment Amazon S3" } }
answer: { optionIds: [ e, c ] }
explanation:
  correct:
    en: |
      External OneLake shortcuts support storage and file sources such as Amazon S3, S3-compatible storage, Azure Data Lake Storage Gen2, Azure Blob Storage, Google Cloud Storage and Dataverse. The data stays at the source and is read in place.
    fr: |
      Les raccourcis OneLake externes prennent en charge des sources de stockage et de fichiers comme Amazon S3, le stockage compatible S3, Azure Data Lake Storage Gen2, Stockage Blob Azure, Google Cloud Storage et Dataverse. Les données restent à la source et sont lues sur place.
  options:
    b: { en: "Azure SQL Database isn't a shortcut source; you bring it into OneLake with mirroring.", fr: "Azure SQL Database n'est pas une source de raccourci ; vous l'amenez dans OneLake par la mise en miroir." }
    d: { en: "Azure Cosmos DB is a mirroring source, not a shortcut source.", fr: "Azure Cosmos DB est une source de mise en miroir, pas une source de raccourci." }
    a: { en: "Azure Database for PostgreSQL is a mirroring source, not a shortcut source.", fr: "Azure Database pour PostgreSQL est une source de mise en miroir, pas une source de raccourci." }
references:
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
