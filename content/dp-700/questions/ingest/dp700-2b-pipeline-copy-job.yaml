id: dp700-2b-pipeline-copy-job
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named sqldb-erp that contains 30 tables. Each table has a primary key and a LastModified datetime column. Change data capture isn't enabled, and you aren't allowed to enable it.

    You have a Fabric warehouse named DW-Erp that contains one existing table for each source table.

    You need to load only the new and changed rows into the DW-Erp tables every hour, updating the existing rows by key. The solution must minimize development effort and doesn't need any other orchestration.

    What should you create?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée sqldb-erp qui contient 30 tables. Chaque table possède une clé primaire et une colonne datetime LastModified. La capture des changements de données n'est pas activée et vous n'êtes pas autorisé à l'activer.

    Vous disposez d'un entrepôt Fabric nommé DW-Erp qui contient une table existante pour chaque table source.

    Vous devez charger toutes les heures uniquement les lignes nouvelles et modifiées dans les tables de DW-Erp, en mettant à jour les lignes existantes par clé. La solution doit réduire au minimum l'effort de développement et ne nécessite aucune autre orchestration.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: "A pipeline that uses Lookup, Copy data and Stored procedure activities to manage a watermark for each table"
        fr: "Un pipeline qui utilise des activités Lookup, Copy data et Stored procedure pour gérer un filigrane pour chaque table"
    - id: b
      text:
        en: "A copy job that uses incremental copy on LastModified and the Merge update method, with an hourly schedule"
        fr: "Un travail de copie qui utilise la copie incrémentielle sur LastModified et la méthode de mise à jour Merge, avec une planification horaire"
    - id: c
      text:
        en: "A mirrored Azure SQL database that replicates sqldb-erp, and a schedule that refreshes its SQL analytics endpoint"
        fr: "Une base de données Azure SQL mise en miroir qui réplique sqldb-erp, et une planification qui actualise son point de terminaison d'analytique SQL"
    - id: d
      text:
        en: "A Dataflow Gen2 that has one query and an incremental refresh setting for each of the 30 tables"
        fr: "Un Dataflow Gen2 qui comporte une requête et un paramètre d'actualisation incrémentielle pour chacune des 30 tables"
answer: { optionId: b }
explanation:
  correct:
    en: |
      A copy job moves many tables through a guided experience without building a pipeline. When CDC isn't available, watermark-based incremental copy on a reliable datetime column copies only new and changed rows, and the job tracks the state between runs. The Merge update method updates existing rows by key (the primary key by default), and a schedule runs the job every hour.
    fr: |
      Un travail de copie déplace de nombreuses tables via une expérience guidée, sans créer de pipeline. Quand CDC n'est pas disponible, la copie incrémentielle basée sur un filigrane, sur une colonne datetime fiable, ne copie que les lignes nouvelles et modifiées, et le travail suit l'état entre les exécutions. La méthode de mise à jour Merge met à jour les lignes existantes par clé (la clé primaire par défaut), et une planification exécute le travail toutes les heures.
  options:
    a:
      en: |
        A hand-built watermark pipeline works, but you must develop and maintain the watermark logic that a copy job provides out of the box.
      fr: |
        Un pipeline à filigrane créé à la main fonctionne, mais vous devez développer et maintenir la logique de filigrane qu'un travail de copie fournit d'emblée.
    c:
      en: |
        Mirroring writes into a mirrored database item, not into the existing tables of DW-Erp.
      fr: |
        La mise en miroir écrit dans un élément base de données mise en miroir, pas dans les tables existantes de DW-Erp.
    d:
      en: |
        Thirty queries with their own incremental refresh settings need far more development than one copy job.
      fr: |
        Trente requêtes avec leurs propres paramètres d'actualisation incrémentielle demandent bien plus de développement qu'un seul travail de copie.
references:
  - title: What is Copy job in Data Factory for Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
