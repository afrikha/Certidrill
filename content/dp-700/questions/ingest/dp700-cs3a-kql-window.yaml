id: dp700-cs3a-kql-window
objective: "2.3.7"
type: dropdown
caseStudy: dp700-cs3a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You are writing the KQL query of the Ops-Live tile that shows the turbine power.

    You need to complete the query to meet the dashboard requirement.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la requête KQL de la vignette d'Ops-Live qui affiche la puissance des éoliennes.

    Vous devez compléter la requête pour respecter l'exigence relative au tableau de bord.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    Telemetry
    | where Timestamp > ago(1d)
    | [[op]] AvgPowerKw = [[agg]](PowerKw) by TurbineId, [[win]]
    | order by TurbineId asc
  slots:
    - id: op
      options:
        - { id: summarize, text: summarize }
        - { id: extend, text: extend }
        - { id: project, text: project }
    - id: agg
      options:
        - { id: avg, text: avg }
        - { id: sum, text: sum }
        - { id: max, text: max }
        - { id: dcount, text: dcount }
    - id: win
      options:
        - { id: raw, text: Timestamp }
        - { id: bin1d, text: "bin(Timestamp, 1d)" }
        - { id: bin5m, text: "bin(Timestamp, 5m)" }
        - { id: hour, text: startofhour(Timestamp) }
answer:
  values: { op: summarize, agg: avg, win: bin5m }
explanation:
  correct:
    en: "`summarize` groups the rows and computes one aggregate per group, and `avg()` returns the average power. Grouping by `bin(Timestamp, 5m)` rounds each timestamp down to the start of its 5-minute interval, which creates consecutive, non-overlapping (tumbling) windows for each TurbineId."
    fr: "`summarize` regroupe les lignes et calcule un agrégat par groupe, et `avg()` renvoie la puissance moyenne. Le regroupement par `bin(Timestamp, 5m)` arrondit chaque horodatage au début de son intervalle de 5 minutes, ce qui crée des fenêtres consécutives et sans chevauchement (fenêtres bascules) pour chaque TurbineId."
  options:
    extend: { en: "extend adds a calculated column to each row; it does not aggregate by group.", fr: "extend ajoute une colonne calculée à chaque ligne ; il n'agrège pas par groupe." }
    project: { en: "project selects or computes columns row by row; it accepts no by clause.", fr: "project sélectionne ou calcule des colonnes ligne par ligne ; il n'accepte pas de clause by." }
    sum: { en: "sum returns the total power of the interval, not the average.", fr: "sum renvoie la puissance totale de l'intervalle, pas la moyenne." }
    max: { en: "max returns the peak value of the interval, not the average.", fr: "max renvoie la valeur maximale de l'intervalle, pas la moyenne." }
    dcount: { en: "dcount counts distinct values; it does not compute an average.", fr: "dcount compte les valeurs distinctes ; il ne calcule pas de moyenne." }
    raw: { en: "Grouping by the raw timestamp creates one group per event instead of 5-minute intervals.", fr: "Regrouper par l'horodatage brut crée un groupe par événement au lieu d'intervalles de 5 minutes." }
    bin1d: { en: "A 1-day bin produces daily averages, not 5-minute intervals.", fr: "Un intervalle d'un jour produit des moyennes journalières, pas des intervalles de 5 minutes." }
    hour: { en: "startofhour() produces hourly groups, not 5-minute intervals.", fr: "startofhour() produit des groupes horaires, pas des intervalles de 5 minutes." }
references:
  - title: bin()
    url: https://learn.microsoft.com/en-us/kusto/query/bin-function?view=microsoft-fabric
  - title: summarize operator
    url: https://learn.microsoft.com/en-us/kusto/query/summarize-operator?view=microsoft-fabric
