id: dp700-2b-mirror-cost
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that is assigned to an F64 capacity. The workspace contains three mirrored Azure SQL databases that store a total of 20 TB in OneLake. Analysts query the mirrored tables every day by using T-SQL and Power BI.

    Which statement describes the cost of this solution?
  fr: |
    Vous disposez d'un espace de travail Fabric affecté à une capacité F64. L'espace de travail contient trois bases de données Azure SQL mises en miroir qui stockent au total 20 To dans OneLake. Les analystes interrogent les tables mises en miroir chaque jour avec T-SQL et Power BI.

    Quelle affirmation décrit le coût de cette solution ?
body:
  options:
    - id: a
      text:
        en: "Replication consumes capacity units of the F64, and the 20 TB of storage is free."
        fr: "La réplication consomme des unités de capacité de la F64, et les 20 To de stockage sont gratuits."
    - id: b
      text:
        en: "Replication is free, and the 20 TB is billed as OneLake storage from the first terabyte."
        fr: "La réplication est gratuite, et les 20 To sont facturés comme stockage OneLake dès le premier téraoctet."
    - id: c
      text:
        en: "Replication and the 20 TB of storage are free, and the queries consume capacity units."
        fr: "La réplication et les 20 To de stockage sont gratuits, et les requêtes consomment des unités de capacité."
    - id: d
      text:
        en: "Replication and the queries are free, and the storage beyond 1 TB is billed."
        fr: "La réplication et les requêtes sont gratuites, et le stockage au-delà de 1 To est facturé."
answer: { optionId: c }
explanation:
  correct:
    en: |
      The compute that replicates data into OneLake is free and doesn't consume capacity units. Mirroring storage is free up to 1 TB per capacity unit, which is 64 TB on an F64, so 20 TB costs nothing. Querying the data with SQL, Power BI or Spark is billed to the capacity at regular rates.
    fr: |
      Le calcul qui réplique les données dans OneLake est gratuit et ne consomme pas d'unités de capacité. Le stockage de la mise en miroir est gratuit jusqu'à 1 To par unité de capacité, soit 64 To sur une F64 : 20 To ne coûtent rien. L'interrogation des données avec SQL, Power BI ou Spark est facturée à la capacité au tarif normal.
  options:
    a: { en: "Background replication doesn't consume capacity units.", fr: "La réplication en arrière-plan ne consomme pas d'unités de capacité." }
    b: { en: "Storage is free up to 1 TB per capacity unit, 64 TB for an F64.", fr: "Le stockage est gratuit jusqu'à 1 To par unité de capacité, soit 64 To pour une F64." }
    d: { en: "Queries are charged at regular rates, and the free storage is 1 TB per capacity unit, not 1 TB in total.", fr: "Les requêtes sont facturées au tarif normal, et le stockage gratuit est de 1 To par unité de capacité, pas de 1 To au total." }
references:
  - title: What is Mirroring in Fabric?
    url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
