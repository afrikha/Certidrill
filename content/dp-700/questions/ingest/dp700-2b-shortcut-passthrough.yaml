id: dp700-2b-shortcut-passthrough
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have two Fabric workspaces named WS-Finance and WS-Reporting. WS-Finance contains a lakehouse named LH-Finance that has a Delta table named gl_entries. WS-Reporting contains a lakehouse named LH-Reporting.

    LH-Reporting has a shortcut named gl_entries that points to the gl_entries table of LH-Finance. The shortcut was created with the default authentication settings.

    A user named User1 is a member of the Contributor role in WS-Reporting and has no permissions in WS-Finance. When User1 runs a notebook in WS-Reporting that reads the gl_entries shortcut, the read fails with an authorization error.

    You need User1 to read the data through the shortcut. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Vous disposez de deux espaces de travail Fabric nommés WS-Finance et WS-Reporting. WS-Finance contient un lakehouse nommé LH-Finance qui possède une table Delta nommée gl_entries. WS-Reporting contient un lakehouse nommé LH-Reporting.

    LH-Reporting possède un raccourci nommé gl_entries qui pointe vers la table gl_entries de LH-Finance. Le raccourci a été créé avec les paramètres d'authentification par défaut.

    Un utilisateur nommé User1 est membre du rôle Contributor de WS-Reporting et ne dispose d'aucune autorisation dans WS-Finance. Quand User1 exécute dans WS-Reporting un notebook qui lit le raccourci gl_entries, la lecture échoue avec une erreur d'autorisation.

    User1 doit pouvoir lire les données via le raccourci. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Grant User1 read access to the gl_entries data of LH-Finance."
        fr: "Accorder à User1 un accès en lecture aux données gl_entries de LH-Finance."
    - id: b
      text:
        en: "Assign User1 the Contributor role in WS-Finance."
        fr: "Attribuer à User1 le rôle Contributor dans WS-Finance."
    - id: c
      text:
        en: "Assign User1 the Admin role in WS-Reporting."
        fr: "Attribuer à User1 le rôle Admin dans WS-Reporting."
    - id: d
      text:
        en: "Turn on shortcut caching in the settings of WS-Reporting."
        fr: "Activer la mise en cache des raccourcis dans les paramètres de WS-Reporting."
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, an internal shortcut passes the identity of the calling user to the target, so OneLake checks that User1 can read the data in LH-Finance. When a user accesses a shortcut, the most restrictive permission of the two locations applies. Read access on the target data, through an item permission or a OneLake security role, is the smallest grant that works.
    fr: |
      Par défaut, un raccourci interne transmet l'identité de l'utilisateur appelant à la cible : OneLake vérifie donc que User1 peut lire les données de LH-Finance. Quand un utilisateur accède à un raccourci, l'autorisation la plus restrictive des deux emplacements s'applique. Un accès en lecture aux données cibles, par une autorisation sur l'élément ou un rôle de sécurité OneLake, est l'octroi le plus réduit qui fonctionne.
  options:
    c:
      en: |
        A role in the workspace that holds the shortcut doesn't give access to the target; User1 already has enough permissions on the shortcut side.
      fr: |
        Un rôle dans l'espace de travail qui contient le raccourci ne donne pas accès à la cible ; User1 dispose déjà d'autorisations suffisantes côté raccourci.
    b:
      en: |
        Contributor in WS-Finance would let User1 read the data, but it also lets User1 change every item of the workspace, which exceeds the requirement.
      fr: |
        Le rôle Contributor dans WS-Finance permettrait à User1 de lire les données, mais aussi de modifier tous les éléments de l'espace de travail, ce qui dépasse le besoin.
    d:
      en: |
        Caching reduces egress for external shortcuts such as Amazon S3; it doesn't change how an internal shortcut authorizes the caller.
      fr: |
        La mise en cache réduit les sorties des raccourcis externes comme Amazon S3 ; elle ne change pas la façon dont un raccourci interne autorise l'appelant.
references:
  - title: Secure and manage OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcut-security
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
