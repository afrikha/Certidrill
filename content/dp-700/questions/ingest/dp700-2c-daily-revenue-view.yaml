id: dp700-2c-daily-revenue-view
objective: "2.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an eventhouse that contains a KQL database named RetailDB. An eventstream ingests sales events continuously into a table named SalesEvents in RetailDB. SalesEvents contains two years of data.

    A Real-Time Dashboard shows the daily revenue per store over the two years. The tiles are slow because each query aggregates the whole table.

    You need to provide daily revenue per store that is always up to date, including the events ingested in the last few seconds. The solution must minimize development and maintenance effort.

    What should you create?
  fr: |
    Vous disposez d'un eventhouse qui contient une base de données KQL nommée RetailDB. Un flux d'événements ingère en continu des événements de vente dans une table nommée SalesEvents de RetailDB. SalesEvents contient deux ans de données.

    Un tableau de bord en temps réel affiche le chiffre d'affaires quotidien par magasin sur les deux ans. Les vignettes sont lentes, car chaque requête agrège toute la table.

    Vous devez fournir un chiffre d'affaires quotidien par magasin toujours à jour, y compris pour les événements ingérés au cours des dernières secondes. La solution doit réduire au minimum l'effort de développement et de maintenance.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: "A materialized view in a Fabric warehouse that reads SalesEvents through the SQL analytics endpoint"
        fr: "Une vue matérialisée dans un entrepôt Fabric qui lit SalesEvents par le point de terminaison d'analytique SQL"
    - id: b
      text:
        en: "An update policy on SalesEvents that writes sum(Amount) by StoreId and bin(Timestamp, 1d) to a table named DailySales"
        fr: "Une stratégie de mise à jour sur SalesEvents qui écrit sum(Amount) par StoreId et bin(Timestamp, 1d) dans une table nommée DailySales"
    - id: c
      text:
        en: "A materialized view over SalesEvents that summarizes sum(Amount) by StoreId and bin(Timestamp, 1d)"
        fr: "Une vue matérialisée sur SalesEvents qui calcule sum(Amount) par StoreId et bin(Timestamp, 1d)"
    - id: d
      text:
        en: "A pipeline scheduled every hour that runs a KQL command to replace a table named DailySales with the aggregated results"
        fr: "Un pipeline planifié toutes les heures qui exécute une commande KQL pour remplacer une table nommée DailySales par les résultats agrégés"
answer: { optionId: c }
explanation:
  correct:
    en: |
      A materialized view keeps an aggregation over a source table: its materialized part holds the already processed groups, and a query on the view combines it with the delta of newly ingested records, so the result is always up to date. Querying the view uses far fewer resources than aggregating two years of raw events, and the eventhouse maintains it without code.
    fr: |
      Une vue matérialisée conserve une agrégation sur une table source : sa partie matérialisée contient les groupes déjà traités, et une requête sur la vue la combine avec le delta des enregistrements nouvellement ingérés, si bien que le résultat est toujours à jour. Interroger la vue consomme beaucoup moins de ressources qu'agréger deux ans d'événements bruts, et l'eventhouse la maintient sans code.
  options:
    b:
      en: |
        An update policy runs on each ingested batch separately, so DailySales would receive several partial rows per store and day that queries must aggregate again.
      fr: |
        Une stratégie de mise à jour s'exécute séparément sur chaque lot ingéré : DailySales recevrait plusieurs lignes partielles par magasin et par jour, que les requêtes devraient agréger à nouveau.
    d:
      en: |
        An hourly replacement leaves the table up to an hour behind and adds a pipeline to maintain.
      fr: |
        Un remplacement toutes les heures laisse la table jusqu'à une heure en retard et ajoute un pipeline à maintenir.
    a:
      en: |
        Fabric Data Warehouse doesn't support materialized views, and SalesEvents is a KQL table of the eventhouse.
      fr: |
        Fabric Data Warehouse ne prend pas en charge les vues matérialisées, et SalesEvents est une table KQL de l'eventhouse.
references:
  - title: Materialized views
    url: https://learn.microsoft.com/en-us/kusto/management/materialized-views/materialized-view-overview?view=microsoft-fabric
