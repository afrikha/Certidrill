id: dp700-cs3b-mirroring
objective: "2.2.4"
type: single
caseStudy: dp700-cs3b-woodgrove
difficulty: 1
status: draft
stem:
  en: |
    You need to bring the data of sqldb-claims-dev into WS-Claims-Dev. The solution must meet the ingestion requirements. What should you create?
  fr: |
    Vous devez amener les données de sqldb-claims-dev dans WS-Claims-Dev. La solution doit respecter les exigences d'ingestion. Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: "A pipeline with a Copy activity that reads the changed rows, and a schedule that runs it every five minutes"
        fr: "Un pipeline avec une activité Copy qui lit les lignes modifiées, et une planification qui l'exécute toutes les cinq minutes"
    - id: b
      text:
        en: "A OneLake shortcut in a lakehouse that points to the tables of sqldb-claims-dev"
        fr: "Un raccourci OneLake dans un lakehouse qui pointe vers les tables de sqldb-claims-dev"
    - id: c
      text:
        en: "A mirrored Azure SQL Database item that replicates sqldb-claims-dev into OneLake"
        fr: "Un élément Azure SQL Database mis en miroir qui réplique sqldb-claims-dev dans OneLake"
    - id: d
      text:
        en: "A Dataflow Gen2 with incremental refresh that writes the tables to DW-Claims every five minutes"
        fr: "Un Dataflow Gen2 avec actualisation incrémentielle qui écrit les tables dans DW-Claims toutes les cinq minutes"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Mirroring continuously replicates the Azure SQL database into OneLake in Delta format, without any ETL to build or schedule, and exposes it through a read-only SQL analytics endpoint. The compute used to replicate the data into OneLake is free, so the replication cost is minimized.
    fr: |
      La mise en miroir réplique en continu la base de données Azure SQL dans OneLake au format Delta, sans ETL à créer ni à planifier, et l'expose via un point de terminaison d'analytique SQL en lecture seule. Le calcul utilisé pour répliquer les données dans OneLake est gratuit : le coût de la réplication est réduit au minimum.
  options:
    a:
      en: |
        A scheduled Copy activity is an ETL process to build, schedule and monitor, and each run consumes capacity.
      fr: |
        Une activité Copy planifiée est un processus ETL à créer, planifier et superviser, et chaque exécution consomme de la capacité.
    b:
      en: |
        OneLake shortcuts do not support Azure SQL Database as a source.
      fr: |
        Les raccourcis OneLake ne prennent pas en charge Azure SQL Database comme source.
    d:
      en: |
        A Dataflow Gen2 is a scheduled ETL process that consumes capacity at each refresh, which the requirements exclude.
      fr: |
        Un Dataflow Gen2 est un processus ETL planifié qui consomme de la capacité à chaque actualisation, ce que les exigences excluent.
references:
  - title: Mirroring Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
