id: dp700-2c-shortcut-limits
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You plan to create OneLake shortcuts in a KQL database named SalesDB to expose several lakehouse tables to KQL queries instead of ingesting them.

    Which two statements about OneLake shortcuts in a KQL database are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer des raccourcis OneLake dans une base de données KQL nommée SalesDB pour exposer plusieurs tables de lakehouse aux requêtes KQL au lieu de les ingérer.

    Quelles sont les deux affirmations vraies sur les raccourcis OneLake dans une base de données KQL ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Column changes in the source table appear only after you re-create the shortcut.", fr: "Les modifications de colonnes de la table source n'apparaissent qu'après la recréation du raccourci." } }
    - { id: b, text: { en: "Each shortcut connects to a single table or subfolder.", fr: "Chaque raccourci se connecte à une seule table ou à un seul sous-dossier." } }
    - { id: c, text: { en: "A shortcut can't be renamed after it's created.", fr: "Un raccourci ne peut pas être renommé après sa création." } }
    - { id: d, text: { en: "A shortcut is queried by its name, in the same way as a native table.", fr: "Un raccourci s'interroge par son nom, de la même façon qu'une table native." } }
    - { id: e, text: { en: "A shortcut can target only a lakehouse in the same workspace as the KQL database.", fr: "Un raccourci ne peut cibler qu'un lakehouse du même espace de travail que la base de données KQL." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      In a KQL database, each shortcut connects to only one subfolder or table, so you create one shortcut per table, and shortcuts can't be renamed once created.
    fr: |
      Dans une base de données KQL, chaque raccourci ne se connecte qu'à un sous-dossier ou à une table : vous créez un raccourci par table, et les raccourcis ne peuvent pas être renommés une fois créés.
  options:
    a:
      en: "Schema sync is on by default, so added, deleted, renamed, or retyped columns are reflected automatically."
      fr: "La synchronisation du schéma est activée par défaut : les colonnes ajoutées, supprimées, renommées ou dont le type change sont reflétées automatiquement."
    e:
      en: "Shortcuts can target lakehouses, warehouses, and KQL databases in OneLake, and external storage such as Azure Data Lake Storage, Amazon S3, and Google Cloud Storage."
      fr: "Les raccourcis peuvent cibler des lakehouses, des entrepôts et des bases de données KQL dans OneLake, ainsi que des stockages externes comme Azure Data Lake Storage, Amazon S3 et Google Cloud Storage."
    d:
      en: "A shortcut is queried as an external table with external_table('name')."
      fr: "Un raccourci s'interroge comme une table externe avec external_table('nom')."
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
