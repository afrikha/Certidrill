id: dp700-2b-mirror-rowmarker
objective: "2.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an open mirrored database named OM-Retail. An application writes the changes of a Customers table to the landing zone of OM-Retail. The _metadata.json file of the Customers folder sets keyColumns to CustomerID.

    The initial load was written in a file named 00000000000000000001.parquet and has been processed. The next file must update the city of customer C002 and delete customer C003, which both exist in OM-Retail.

    How should you complete the next file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données mise en miroir ouverte nommée OM-Retail. Une application écrit les changements d'une table Customers dans la zone d'atterrissage d'OM-Retail. Le fichier _metadata.json du dossier Customers définit keyColumns sur CustomerID.

    Le chargement initial a été écrit dans un fichier nommé 00000000000000000001.parquet et a été traité. Le fichier suivant doit mettre à jour la ville du client C002 et supprimer le client C003, qui existent tous les deux dans OM-Retail.

    Comment devez-vous compléter le fichier suivant ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    File: Files/LandingZone/Customers/[[file]]

    CustomerID | City  | __rowMarker__
    C002       | Lyon  | [[m1]]
    C003       | NULL  | [[m2]]
  slots:
    - id: file
      options:
        - { id: f2, text: 00000000000000000002.parquet }
        - { id: f1, text: 00000000000000000001.parquet }
        - { id: fdate, text: Customers_20261117.parquet }
        - { id: fguid, text: 9f1c2d7e-0b4a-4e5f-a1c3-7d2e8b6f4a10.parquet }
    - id: m1
      options:
        - { id: m1_0, text: "0" }
        - { id: m1_1, text: "1" }
        - { id: m1_2, text: "2" }
    - id: m2
      options:
        - { id: m2_0, text: "0" }
        - { id: m2_1, text: "1" }
        - { id: m2_2, text: "2" }
answer:
  values: { file: f2, m1: m1_1, m2: m2_2 }
explanation:
  correct:
    en: |
      Landing zone files use 20-digit names whose numbers are continuous and increasing, so the file after 00000000000000000001.parquet is 00000000000000000002.parquet. The __rowMarker__ column, placed last, gives the operation of each row: 1 updates the row whose key exists, and 2 deletes it; only the key columns matter for a delete.
    fr: |
      Les fichiers de la zone d'atterrissage portent des noms de 20 chiffres dont les numéros sont continus et croissants : le fichier qui suit 00000000000000000001.parquet est 00000000000000000002.parquet. La colonne __rowMarker__, placée en dernier, donne l'opération de chaque ligne : 1 met à jour la ligne dont la clé existe et 2 la supprime ; seules les colonnes clés comptent pour une suppression.
  options:
    f1: { en: "This number was already used; names must keep increasing.", fr: "Ce numéro a déjà été utilisé ; les noms doivent continuer à croître." }
    fdate: { en: "File names must be 20-digit sequence numbers, not dates.", fr: "Les noms de fichiers doivent être des numéros de séquence de 20 chiffres, pas des dates." }
    fguid: { en: "A GUID doesn't give the increasing sequence that orders the changes.", fr: "Un GUID ne donne pas la séquence croissante qui ordonne les changements." }
    m1_0: { en: "0 inserts the row without a duplicate-key check, so C002 would exist twice.", fr: "0 insère la ligne sans vérifier les doublons de clé : C002 existerait deux fois." }
    m2_1: { en: "1 updates C003 with a NULL city instead of deleting it.", fr: "1 met à jour C003 avec une ville NULL au lieu de le supprimer." }
references:
  - title: Open mirroring landing zone requirements and format
    url: https://learn.microsoft.com/en-us/fabric/mirroring/open-mirroring-landing-zone-format
