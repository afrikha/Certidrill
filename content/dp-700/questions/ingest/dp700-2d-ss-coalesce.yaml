id: dp700-2d-ss-coalesce
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric notebook that runs a Spark structured streaming query. The query reads events from an Azure event hub, parses them into a DataFrame named `parsed`, and appends them to a Delta table named **sensor_readings**. Each micro-batch of `parsed` has 64 in-memory partitions, so it writes 64 files.

    You need to modify the DataFrame code so that each micro-batch is written as 8 files. The solution must minimize data movement between executors. Optimized write must not be used.

    What should you add to `parsed` before `writeStream`?
  fr: |
    Vous disposez d'un notebook Fabric qui exécute une requête de streaming structuré Spark. La requête lit des événements d'un hub d'événements Azure, les analyse dans un DataFrame nommé `parsed` et les ajoute à une table Delta nommée **sensor_readings**. Chaque micro-lot de `parsed` a 64 partitions en mémoire : il écrit donc 64 fichiers.

    Vous devez modifier le code du DataFrame pour que chaque micro-lot soit écrit en 8 fichiers. La solution doit réduire au minimum les déplacements de données entre exécuteurs. L'écriture optimisée ne doit pas être utilisée.

    Que devez-vous ajouter à `parsed` avant `writeStream` ?
body:
  options:
    - id: a
      text: ".coalesce(8)"
    - id: b
      text: ".repartition(8)"
    - id: c
      text: ".repartition(8, \"DeviceId\")"
    - id: d
      text: ".sortWithinPartitions(\"DeviceId\")"
answer: { optionId: a }
explanation:
  correct:
    en: "`coalesce()` only decreases the number of in-memory partitions, by merging existing partitions without a full shuffle, which minimizes data movement. Each micro-batch then has 8 partitions and writes 8 files."
    fr: "`coalesce()` ne fait que réduire le nombre de partitions en mémoire, en fusionnant des partitions existantes sans brassage complet, ce qui réduit au minimum les déplacements de données. Chaque micro-lot a alors 8 partitions et écrit 8 fichiers."
  options:
    b:
      en: |-
        repartition() also produces 8 partitions, but it performs a full shuffle of the data, which moves more data than coalesce().
      fr: |-
        repartition() produit aussi 8 partitions, mais il effectue un brassage complet des données, ce qui déplace plus de données que coalesce().
    c:
      en: |-
        Repartitioning by a column also performs a full shuffle; it groups rows by DeviceId at the cost of more data movement.
      fr: |-
        Repartitionner par colonne effectue aussi un brassage complet ; il regroupe les lignes par DeviceId au prix de davantage de déplacements de données.
    d:
      en: |-
        Sorting within partitions keeps the 64 partitions, so each micro-batch still writes 64 files.
      fr: |-
        Trier au sein des partitions conserve les 64 partitions : chaque micro-lot écrit toujours 64 fichiers.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
