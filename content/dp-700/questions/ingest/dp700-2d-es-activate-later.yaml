id: dp700-2d-es-activate-later
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named **LH-Sales**. You create an eventstream named **ES-CDC** that has an Azure SQL Database CDC source. In ES-CDC, a Filter operator keeps the changes of the Orders table, and its output goes to a lakehouse destination that writes to LH-Sales. You publish ES-CDC.

    After publishing, you discover that some rows of the initial snapshot taken by the CDC source never reached LH-Sales, although the changes captured later are present.

    You need to rebuild ES-CDC so that the lakehouse destination receives all the events, including the initial snapshot.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé **LH-Sales**. Vous créez un flux d'événements nommé **ES-CDC** qui a une source CDC Azure SQL Database. Dans ES-CDC, un opérateur Filter garde les modifications de la table Orders, et sa sortie va vers une destination lakehouse qui écrit dans LH-Sales. Vous publiez ES-CDC.

    Après la publication, vous constatez que certaines lignes de l'instantané initial pris par la source CDC ne sont jamais arrivées dans LH-Sales, alors que les modifications capturées ensuite sont présentes.

    Vous devez recréer ES-CDC pour que la destination lakehouse reçoive tous les événements, y compris l'instantané initial.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a derived stream between the Filter operator and the lakehouse destination.", fr: "Ajouter un flux dérivé entre l'opérateur Filter et la destination lakehouse." }
    - id: b
      text: { en: "Clear Activate ingestion on the destination, publish, then activate it from a custom time.", fr: "Décocher l'activation de l'ingestion sur la destination, publier, puis l'activer à partir d'une heure personnalisée." }
    - id: c
      text: { en: "Replace the Filter operator with a SQL operator that writes to the lakehouse.", fr: "Remplacer l'opérateur Filter par un opérateur SQL qui écrit dans le lakehouse." }
    - id: d
      text: { en: "Replace the lakehouse destination with an eventhouse that uses Direct ingestion.", fr: "Remplacer la destination lakehouse par un eventhouse qui utilise l'ingestion directe." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Ingestion from the source can start before the routing to the destination is fully initialized, so events captured early, such as a CDC initial snapshot, can be missed. Clearing **Activate ingestion** when you add the lakehouse destination, then activating it after publishing with the **Custom time** option set before the snapshot, makes the destination read those events.
    fr: |-
      L'ingestion depuis la source peut commencer avant que le routage vers la destination soit entièrement initialisé : des événements capturés tôt, comme l'instantané initial d'une source CDC, peuvent alors être manqués. Décocher l'activation de l'ingestion quand vous ajoutez la destination lakehouse, puis l'activer après la publication avec l'option d'heure personnalisée réglée avant l'instantané, permet à la destination de lire ces événements.
  options:
    a:
      en: |-
        A derived stream publishes the processed events for reuse, but it doesn't change the moment when the destination starts to receive events.
      fr: |-
        Un flux dérivé publie les événements traités pour leur réutilisation, mais il ne change pas le moment où la destination commence à recevoir des événements.
    c:
      en: |-
        The problem is the start of routing, not the transformation logic; a SQL operator is subject to the same timing.
      fr: |-
        Le problème vient du démarrage du routage, pas de la logique de transformation ; un opérateur SQL est soumis au même délai.
    d:
      en: |-
        Direct ingestion doesn't accept the output of an operator, and the data must land in LH-Sales.
      fr: |-
        L'ingestion directe n'accepte pas la sortie d'un opérateur, et les données doivent arriver dans LH-Sales.
references:
  - title: Add an Eventhouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-kql-database
