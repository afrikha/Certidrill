difficulty: 2
status: draft
stem:
  en: You create an accelerated OneLake shortcut.
  fr: Vous créez un raccourci OneLake accéléré.
body:
  solution:
    en: |
      In KDB1, you create a OneLake shortcut named **DimDevice** to the dim_device table of LH-Ref, with **Accelerate** set to **On** and a caching period of 7 days. The analysts join Telemetry with `external_table('DimDevice')`.
    fr: |
      Dans KDB1, vous créez un raccourci OneLake nommé **DimDevice** vers la table dim_device de LH-Ref, avec **Accelerate** défini sur **On** et une période de mise en cache de 7 jours. Les analystes joignent Telemetry à `external_table('DimDevice')`.
answer: { value: false }
explanation:
  correct:
    en: |
      Query acceleration makes the eventhouse index and cache the data of the shortcut's Delta table, and that cache is billed like eventhouse storage. EH1 would therefore hold indexed and cached dim_device data, which the requirements forbid. A standard shortcut, without acceleration, is enough for a few ad hoc queries.
    fr: |
      L'accélération des requêtes fait indexer et mettre en cache par l'eventhouse les données de la table Delta du raccourci, et ce cache est facturé comme le stockage de l'eventhouse. EH1 contiendrait donc des données de dim_device indexées et mises en cache, ce que les exigences interdisent. Un raccourci standard, sans accélération, suffit pour quelques requêtes ad hoc.
references:
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
