id: dp700-2b-mirror-private-network
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure SQL database named sqldb-orders on a logical server named sql-tailspin. Public network access to sql-tailspin is disabled, and the server is reachable only through a private endpoint in a virtual network named vnet-data.

    The system-assigned managed identity of sql-tailspin is enabled and is the primary identity. A database user that has the permissions required for mirroring exists.

    You need to mirror sqldb-orders into a Fabric workspace named WS-Orders. Public network access to sql-tailspin must remain disabled.

    What should you include in the configuration of the mirroring connection?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée sqldb-orders sur un serveur logique nommé sql-tailspin. L'accès réseau public à sql-tailspin est désactivé et le serveur n'est accessible que par un point de terminaison privé dans un réseau virtuel nommé vnet-data.

    L'identité managée affectée par le système de sql-tailspin est activée et constitue l'identité principale. Un utilisateur de base de données qui dispose des autorisations requises pour la mise en miroir existe.

    Vous devez mettre en miroir sqldb-orders dans un espace de travail Fabric nommé WS-Orders. L'accès réseau public à sql-tailspin doit rester désactivé.

    Que devez-vous inclure dans la configuration de la connexion de mise en miroir ?
body:
  options:
    - id: a
      text:
        en: "A resource instance rule for WS-Orders on sql-tailspin, configured through trusted workspace access"
        fr: "Une règle d'instance de ressource pour WS-Orders sur sql-tailspin, configurée par l'accès approuvé à l'espace de travail"
    - id: b
      text:
        en: "A virtual network data gateway that can reach the private endpoint, selected as the data gateway"
        fr: "Une passerelle de données de réseau virtuel qui peut joindre le point de terminaison privé, sélectionnée comme passerelle de données"
    - id: c
      text:
        en: "The Allow Azure services and resources to access this server setting, enabled on sql-tailspin"
        fr: "Le paramètre Allow Azure services and resources to access this server, activé sur sql-tailspin"
    - id: d
      text:
        en: "The workspace identity of WS-Orders, selected as the authentication kind of the connection"
        fr: "L'identité d'espace de travail de WS-Orders, sélectionnée comme type d'authentification de la connexion"
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the database isn't publicly accessible and doesn't allow Azure services, mirroring connects through a virtual network data gateway or an on-premises data gateway. The gateway's network must reach the server through the private endpoint, and you select the gateway in the Data gateway field of the connection.
    fr: |
      Quand la base de données n'est pas accessible publiquement et n'autorise pas les services Azure, la mise en miroir se connecte via une passerelle de données de réseau virtuel ou une passerelle de données locale. Le réseau de la passerelle doit joindre le serveur par le point de terminaison privé, et vous sélectionnez la passerelle dans le champ Passerelle de données de la connexion.
  options:
    a:
      en: |
        Trusted workspace access lets a workspace reach a firewall-enabled ADLS Gen2 storage account; it doesn't open a network path to an Azure SQL logical server.
      fr: |
        L'accès approuvé à l'espace de travail permet à un espace de travail de joindre un compte de stockage ADLS Gen2 protégé par un pare-feu ; il n'ouvre pas de chemin réseau vers un serveur logique Azure SQL.
    c:
      en: |
        Allowing Azure services relies on public network access, which must stay disabled.
      fr: |
        Autoriser les services Azure repose sur l'accès réseau public, qui doit rester désactivé.
    d:
      en: |
        The authentication kind decides who signs in to the database; it doesn't give Fabric a network path to the private endpoint.
      fr: |
        Le type d'authentification décide qui se connecte à la base de données ; il ne donne pas à Fabric de chemin réseau vers le point de terminaison privé.
references:
  - title: "Tutorial: Configure Microsoft Fabric mirrored databases from Azure SQL Database"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database-tutorial
  - title: Microsoft Fabric Mirrored Databases from Azure SQL Database
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-sql-database
