id: dp700-2c-log-analytics
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has an eventstream that receives application logs from several services. Site reliability engineers must run ad hoc queries over the last 90 days of logs, use time-series functions to detect anomalies, and see new log entries within seconds of their arrival.

    You need to choose where the eventstream should send the logs.

    What should you use?
  fr: |
    Litware dispose d'un flux d'événements qui reçoit les journaux d'application de plusieurs services. Les ingénieurs de fiabilité de site doivent exécuter des requêtes ad hoc sur les 90 derniers jours de journaux, utiliser des fonctions de séries chronologiques pour détecter des anomalies et voir les nouvelles entrées de journal quelques secondes après leur arrivée.

    Vous devez choisir la destination vers laquelle le flux d'événements doit envoyer les journaux.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "A KQL database in an eventhouse, queried by using KQL"
        fr: "Une base de données KQL dans un eventhouse, interrogée avec KQL"
    - id: b
      text:
        en: "A Fabric warehouse, queried by using T-SQL"
        fr: "Un entrepôt Fabric, interrogé avec T-SQL"
    - id: c
      text:
        en: "A derived stream, queried in the Real-Time hub"
        fr: "Un flux dérivé, interrogé dans le hub en temps réel"
    - id: d
      text:
        en: "A lakehouse table, queried by using Spark SQL in a notebook"
        fr: "Une table de lakehouse, interrogée avec Spark SQL dans un notebook"
answer: { optionId: a }
explanation:
  correct:
    en: |
      An eventhouse is the Real-Time Intelligence store for time-based streaming data: events are queryable seconds after ingestion, data is organized by arrival time for fast queries, and KQL provides time-series and anomaly detection functions for ad hoc analysis.
    fr: |
      Un eventhouse est le magasin de Real-Time Intelligence pour les données de diffusion en continu horodatées : les événements sont interrogeables quelques secondes après l'ingestion, les données sont organisées par heure d'arrivée pour des requêtes rapides, et KQL fournit des fonctions de séries chronologiques et de détection d'anomalies pour l'analyse ad hoc.
  options:
    d:
      en: |
        A lakehouse destination stores events as Delta tables for Spark workloads; ad hoc Spark queries don't give second-level freshness or KQL time-series functions.
      fr: |
        Une destination lakehouse stocke les événements dans des tables Delta pour des charges de travail Spark ; les requêtes Spark ad hoc n'offrent ni une fraîcheur à la seconde ni les fonctions de séries chronologiques de KQL.
    b:
      en: |
        A warehouse isn't an eventstream destination, and it's designed for relational analytics rather than streaming logs.
      fr: |
        Un entrepôt n'est pas une destination de flux d'événements, et il est conçu pour l'analytique relationnelle plutôt que pour des journaux en continu.
    c:
      en: |
        A derived stream is a transformed stream that can be routed to destinations; it doesn't store 90 days of data for queries.
      fr: |
        Un flux dérivé est un flux transformé qui peut être routé vers des destinations ; il ne stocke pas 90 jours de données pour des requêtes.
references:
  - title: What is Real-Time Intelligence in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/overview
