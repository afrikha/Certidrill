id: dp700-2d-ss-checkpoint-reset
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric lakehouse named **LH1**. A Spark structured streaming query reads events from an Azure event hub, with a starting position set to the start of the stream, and appends them to a Delta table named **bronze_events** in LH1. The query writes its checkpoint to `Files/tmp/stream`. A cleanup notebook deletes all the content of `Files/tmp` every night.

    Each time the streaming query is restarted after a cleanup, bronze_events receives duplicate events.

    You need to ensure that a restarted query continues from the last events it processed.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse Fabric nommé **LH1**. Une requête de streaming structuré Spark lit des événements d'un hub d'événements Azure, avec une position de départ définie au début du flux, et les ajoute à une table Delta nommée **bronze_events** dans LH1. La requête écrit son point de contrôle dans `Files/tmp/stream`. Un notebook de nettoyage supprime chaque nuit tout le contenu de `Files/tmp`.

    Chaque fois que la requête de streaming est redémarrée après un nettoyage, bronze_events reçoit des événements en double.

    Vous devez faire en sorte qu'une requête redémarrée reprenne à partir des derniers événements qu'elle a traités.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the output mode of the query to complete.", fr: "Changer le mode de sortie de la requête en complete." }
    - id: b
      text: { en: "Enable optimized write for the Spark session of the query.", fr: "Activer l'écriture optimisée pour la session Spark de la requête." }
    - id: c
      text: { en: "Run OPTIMIZE on bronze_events after each restart of the query.", fr: "Exécuter OPTIMIZE sur bronze_events après chaque redémarrage de la requête." }
    - id: d
      text: { en: "Move the checkpoint to a dedicated folder that the cleanup doesn't delete.", fr: "Déplacer le point de contrôle vers un dossier dédié que le nettoyage ne supprime pas." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The checkpoint location stores the progress of the query, including the event hub offsets already written. When the checkpoint is deleted, the restarted query has no record of its progress and reads the event hub again from its starting position. A persistent checkpoint folder, used only by this query, lets it resume where it stopped.
    fr: |-
      L'emplacement du point de contrôle (checkpointLocation) enregistre la progression de la requête, dont les décalages du hub d'événements déjà écrits. Quand le point de contrôle est supprimé, la requête redémarrée n'a plus trace de sa progression et relit le hub d'événements depuis sa position de départ. Un dossier de point de contrôle permanent, utilisé uniquement par cette requête, lui permet de reprendre là où elle s'est arrêtée.
  options:
    a:
      en: |-
        The complete mode rewrites the whole result table at each trigger and is meant for aggregations; it doesn't record which events were processed.
      fr: |-
        Le mode complete réécrit toute la table de résultats à chaque déclenchement et est destiné aux agrégations ; il n'enregistre pas les événements traités.
    b:
      en: |-
        Optimized write controls the size of the files written by each micro-batch; it doesn't prevent events from being read again.
      fr: |-
        L'écriture optimisée contrôle la taille des fichiers écrits par chaque micro-lot ; elle n'empêche pas les événements d'être relus.
    c:
      en: |-
        OPTIMIZE compacts small files; it doesn't remove duplicate rows or keep the progress of the stream.
      fr: |-
        OPTIMIZE compacte les petits fichiers ; il ne supprime pas les lignes en double et ne garde pas la progression du flux.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
