id: dp700-2a-cdc-stream-dest
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure SQL database named **OrdersDB** on which CDC is enabled. You need to capture the change events of OrdersDB in near real time and make them available to analysts who query by using KQL. The schema of some source tables changes occasionally. The solution must minimize development effort.

    What should you do?
  fr: |
    Vous disposez d'une base de données Azure SQL nommée **OrdersDB** sur laquelle la CDC est activée. Vous devez capturer les événements de changement d'OrdersDB en quasi-temps réel et les mettre à la disposition d'analystes qui interrogent les données avec KQL. Le schéma de certaines tables sources change de temps en temps. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an eventstream with an Azure SQL Database CDC source and a Lakehouse destination.", fr: "Créer un flux d'événements avec une source CDC Azure SQL Database et une destination Lakehouse." } }
    - { id: b, text: { en: "Create a copy job with CDC-based incremental copy that runs every hour and writes to a lakehouse.", fr: "Créer un travail de copie avec une copie incrémentielle basée sur la CDC qui s'exécute toutes les heures et écrit dans un lakehouse." } }
    - { id: c, text: { en: "Create an eventstream with an Azure SQL Database CDC source and an Eventhouse destination.", fr: "Créer un flux d'événements avec une source CDC Azure SQL Database et une destination Eventhouse." } }
    - { id: d, text: { en: "Create a notebook that reads the CDC tables of OrdersDB every hour and appends the rows to a KQL table.", fr: "Créer un notebook qui lit les tables CDC d'OrdersDB toutes les heures et ajoute les lignes à une table KQL." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Eventstreams have built-in database CDC sources, including Azure SQL Database, and route the change events continuously, with no code. An Eventhouse destination stores them in KQL tables that the analysts query a few seconds after the change.
    fr: |
      Les flux d'événements disposent de sources CDC de base de données intégrées, dont Azure SQL Database, et routent les événements de changement en continu, sans code. Une destination Eventhouse les stocke dans des tables KQL que les analystes interrogent quelques secondes après le changement.
  options:
    a: { en: "Learn advises against a Lakehouse destination for streams whose schema changes, such as database CDC, and analysts query with KQL.", fr: "Learn déconseille une destination Lakehouse pour les flux dont le schéma change, comme la CDC de base de données, et les analystes interrogent en KQL." }
    b: { en: "An hourly copy job isn't near real time, and it writes to a lakehouse rather than a KQL table.", fr: "Un travail de copie horaire n'est pas en quasi-temps réel, et il écrit dans un lakehouse plutôt que dans une table KQL." }
    d: { en: "An hourly notebook is code to maintain and isn't near real time.", fr: "Un notebook horaire est du code à maintenir et n'est pas en quasi-temps réel." }
references:
  - title: Overview of Microsoft Fabric eventstreams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/overview
  - title: Add a lakehouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-lakehouse
