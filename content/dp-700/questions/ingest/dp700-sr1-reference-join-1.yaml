id: dp700-sr1-reference-join-1
objective: "2.3.2"
type: series_yesno
series: dp700-sr1-reference-join
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You copy dim_device into a native KDB1 table every day.
  fr: Vous copiez chaque jour dim_device dans une table native de KDB1.
body:
  solution:
    en: |
      You create a pipeline that contains a Copy activity. The activity reads dim_device from LH-Ref and overwrites a native KDB1 table named **DimDevice**. You schedule the pipeline to run daily at 23:00, and the analysts join Telemetry with DimDevice.
    fr: |
      Vous créez un pipeline qui contient une activité Copy. L'activité lit dim_device dans LH-Ref et remplace le contenu d'une table native de KDB1 nommée **DimDevice**. Vous planifiez l'exécution quotidienne du pipeline à 23:00, et les analystes joignent Telemetry à DimDevice.
answer: { value: false }
explanation:
  correct:
    en: |
      Ingesting dim_device into a native table stores a second copy of the data in EH1, which the requirements forbid. A fixed daily schedule also leaves the copy stale between the notebook run and 23:00, because the notebook runs at an unpredictable time, and the pipeline adds development effort.
    fr: |
      Ingérer dim_device dans une table native stocke une seconde copie des données dans EH1, ce que les exigences interdisent. Une planification quotidienne fixe laisse aussi la copie obsolète entre l'exécution du notebook et 23:00, car le notebook s'exécute à une heure imprévisible, et le pipeline ajoute un effort de développement.
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
