id: dp700-2a-tool-warehouse-agg
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **DW2** that contains a table named **dbo.SalesDetail**. You need a table named **dbo.SalesMonthly** in DW2 that contains the total sales amount per store and per month. dbo.SalesMonthly must be rebuilt every night.

    Which two tools can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **DW2** qui contient une table nommée **dbo.SalesDetail**. Vous avez besoin, dans DW2, d'une table nommée **dbo.SalesMonthly** qui contient le montant total des ventes par magasin et par mois. dbo.SalesMonthly doit être reconstruite chaque nuit.

    Quels sont les deux outils que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A T-SQL stored procedure in DW2 that truncates dbo.SalesMonthly and reloads it with INSERT...SELECT and GROUP BY", fr: "Une procédure stockée T-SQL dans DW2 qui tronque dbo.SalesMonthly et la recharge avec INSERT...SELECT et GROUP BY" } }
    - { id: b, text: { en: "A KQL update policy on dbo.SalesDetail that writes the totals to dbo.SalesMonthly", fr: "Une stratégie de mise à jour KQL sur dbo.SalesDetail qui écrit les totaux dans dbo.SalesMonthly" } }
    - { id: c, text: { en: "A copy job that copies dbo.SalesDetail to dbo.SalesMonthly with a column mapping", fr: "Un travail de copie qui copie dbo.SalesDetail vers dbo.SalesMonthly avec un mappage de colonnes" } }
    - { id: d, text: { en: "A Dataflow Gen2 that groups the rows of dbo.SalesDetail and writes to dbo.SalesMonthly with the Replace update method", fr: "Un Dataflow Gen2 qui regroupe les lignes de dbo.SalesDetail et écrit dans dbo.SalesMonthly avec la méthode de mise à jour Replace" } }
    - { id: e, text: { en: "An eventstream with an Aggregate operator", fr: "Un flux d'événements avec un opérateur Aggregate" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Set-based T-SQL in the warehouse can aggregate dbo.SalesDetail into dbo.SalesMonthly without moving the data. Dataflow Gen2 can also read the warehouse table, group the rows with Power Query and replace the content of a warehouse table, a good fit when the logic is maintained by Power Query users.
    fr: |
      Du T-SQL ensembliste dans l'entrepôt peut agréger dbo.SalesDetail dans dbo.SalesMonthly sans déplacer les données. Dataflow Gen2 peut aussi lire la table d'entrepôt, regrouper les lignes avec Power Query et remplacer le contenu d'une table d'entrepôt, ce qui convient quand la logique est maintenue par des utilisateurs de Power Query.
  options:
    b: { en: "Update policies are KQL objects of eventhouse tables; they don't apply to warehouse tables.", fr: "Les stratégies de mise à jour sont des objets KQL des tables d'eventhouse ; elles ne s'appliquent pas aux tables d'entrepôt." }
    c: { en: "A copy job performs only lightweight transformations such as column mapping; it can't aggregate rows.", fr: "Un travail de copie n'effectue que des transformations légères comme le mappage de colonnes ; il ne peut pas agréger de lignes." }
    e: { en: "An eventstream processes events from streaming sources, and its destinations are eventhouses, lakehouses, Activator, custom endpoints and derived streams, not warehouse tables.", fr: "Un flux d'événements traite des événements de sources de diffusion en continu, et ses destinations sont des eventhouses, des lakehouses, Activator, des points de terminaison personnalisés et des flux dérivés, pas des tables d'entrepôt." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
