id: dp700-2a-store-mixed-skills
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has several terabytes of sales data in Parquet files. The data engineering team writes PySpark and must transform the data into Delta tables by using notebooks. A group of business analysts must query the curated tables by using T-SQL, but they never modify them.

    You need to recommend a data store. The solution must minimize data duplication.

    What should you recommend?
  fr: |
    Tailspin Toys dispose de plusieurs téraoctets de données de ventes dans des fichiers Parquet. L'équipe d'ingénierie données écrit du PySpark et doit transformer les données en tables Delta avec des notebooks. Un groupe d'analystes métier doit interroger les tables organisées en T-SQL, sans jamais les modifier.

    Vous devez recommander un magasin de données. La solution doit réduire au minimum la duplication des données.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A warehouse that the data engineers load by using T-SQL COPY INTO statements", fr: "Un entrepôt que les ingénieurs données chargent avec des instructions T-SQL COPY INTO" } }
    - { id: b, text: { en: "An eventhouse that the analysts query by using KQL querysets", fr: "Un eventhouse que les analystes interrogent avec des ensembles de requêtes KQL" } }
    - { id: c, text: { en: "A lakehouse for the notebooks, plus a warehouse that holds a copy of the curated tables", fr: "Un lakehouse pour les notebooks, plus un entrepôt qui contient une copie des tables organisées" } }
    - { id: d, text: { en: "A lakehouse that the analysts query through its SQL analytics endpoint", fr: "Un lakehouse que les analystes interrogent via son point de terminaison d'analytique SQL" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A lakehouse fits a team that mixes PySpark and T-SQL skills: engineers transform the data with notebooks into Delta tables, and T-SQL users query the same tables through the read-only SQL analytics endpoint, with no copy. Read-only access is enough because the analysts never modify the data.
    fr: |
      Un lakehouse convient à une équipe qui mélange des compétences PySpark et T-SQL : les ingénieurs transforment les données en tables Delta avec des notebooks, et les utilisateurs T-SQL interrogent les mêmes tables via le point de terminaison d'analytique SQL en lecture seule, sans copie. L'accès en lecture seule suffit, car les analystes ne modifient jamais les données.
  options:
    a: { en: "The engineers write PySpark in notebooks, not T-SQL; a warehouse doesn't match their skills.", fr: "Les ingénieurs écrivent du PySpark dans des notebooks, pas du T-SQL ; un entrepôt ne correspond pas à leurs compétences." }
    b: { en: "An eventhouse targets streaming and time-series data queried with KQL, not T-SQL analysts working on batch Parquet data.", fr: "Un eventhouse cible les données de diffusion en continu et les séries chronologiques interrogées en KQL, pas des analystes T-SQL travaillant sur des données Parquet par lots." }
    c: { en: "Copying the curated tables into a warehouse duplicates the data without need, since the analysts only read it.", fr: "Copier les tables organisées dans un entrepôt duplique les données sans nécessité, puisque les analystes ne font que les lire." }
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
