id: dp700-2b-mirror-snowflake
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders stores its sales data in a Snowflake database. You have a Fabric workspace named WS-Sales.

    You need to make the Snowflake tables available in OneLake as Delta tables for Power BI reports in Direct Lake mode. Changes made in Snowflake must reach OneLake continuously, without any job to schedule or monitor. The solution must minimize development effort.

    What should you create in WS-Sales?
  fr: |
    Northwind Traders stocke ses données de ventes dans une base de données Snowflake. Vous disposez d'un espace de travail Fabric nommé WS-Sales.

    Vous devez rendre les tables Snowflake disponibles dans OneLake sous forme de tables Delta pour des rapports Power BI en mode Direct Lake. Les changements effectués dans Snowflake doivent arriver dans OneLake en continu, sans travail à planifier ni à superviser. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous créer dans WS-Sales ?
body:
  options:
    - id: a
      text:
        en: "A copy job that uses incremental copy and runs every hour"
        fr: "Un travail de copie qui utilise la copie incrémentielle et s'exécute toutes les heures"
    - id: b
      text:
        en: "A pipeline with a Copy data activity and a schedule trigger"
        fr: "Un pipeline avec une activité Copy data et un déclencheur planifié"
    - id: c
      text:
        en: "A mirrored Snowflake database that replicates the tables"
        fr: "Une base de données Snowflake mise en miroir qui réplique les tables"
    - id: d
      text:
        en: "A Dataflow Gen2 with incremental refresh to a lakehouse"
        fr: "Un Dataflow Gen2 avec actualisation incrémentielle vers un lakehouse"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Snowflake is a database mirroring source. Mirroring continuously replicates the tables into OneLake in Delta format, with changes published as often as every 15 seconds, and it's fully managed: there's no ETL to build, schedule or monitor. Power BI can then read the mirrored tables in Direct Lake mode.
    fr: |
      Snowflake est une source de mise en miroir de base de données. La mise en miroir réplique en continu les tables dans OneLake au format Delta, avec des changements publiés jusqu'à toutes les 15 secondes, et elle est entièrement managée : aucun ETL à créer, planifier ou superviser. Power BI peut ensuite lire les tables mises en miroir en mode Direct Lake.
  options:
    a:
      en: |
        A copy job runs on a schedule, so the data isn't replicated continuously and the job must be monitored.
      fr: |
        Un travail de copie s'exécute selon une planification : les données ne sont pas répliquées en continu et le travail doit être supervisé.
    b:
      en: |
        A scheduled pipeline is an ETL process to build and monitor, and it copies only when it runs.
      fr: |
        Un pipeline planifié est un processus ETL à créer et à superviser, et il ne copie que lorsqu'il s'exécute.
    d:
      en: |
        A Dataflow Gen2 refresh is a scheduled job with its own queries to develop; it doesn't replicate changes continuously.
      fr: |
        L'actualisation d'un Dataflow Gen2 est un travail planifié avec ses propres requêtes à développer ; elle ne réplique pas les changements en continu.
references:
  - title: What is Mirroring in Fabric?
    url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
