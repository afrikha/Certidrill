id: dp700-2c-spark-job-definition
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a notebook named NB_Stream. NB_Stream contains Spark structured streaming code that reads events from Azure Event Hubs and writes them to a Delta table. The code has been tested.

    You need to run the stream in production. The stream must run continuously and restart automatically after unexpected stops, such as infrastructure patching. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un notebook nommé NB_Stream. NB_Stream contient du code de streaming structuré Spark qui lit des événements dans Azure Event Hubs et les écrit dans une table Delta. Le code a été testé.

    Vous devez exécuter le flux en production. Le flux doit s'exécuter en continu et redémarrer automatiquement après des arrêts inattendus, comme une mise à jour corrective de l'infrastructure. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Run NB_Stream in a high concurrency session and keep the session open."
        fr: "Exécuter NB_Stream dans une session à haute concurrence et garder la session ouverte."
    - id: b
      text:
        en: "Move the code to a Spark job definition and configure a retry policy."
        fr: "Déplacer le code dans une définition de travail Spark et configurer une stratégie de nouvelle tentative."
    - id: c
      text:
        en: "Rewrite the logic as an eventstream that uses the SQL operator."
        fr: "Réécrire la logique sous forme de flux d'événements qui utilise l'opérateur SQL."
    - id: d
      text:
        en: "Add NB_Stream to a pipeline and schedule the pipeline to run every 15 minutes."
        fr: "Ajouter NB_Stream à un pipeline et planifier le pipeline toutes les 15 minutes."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft recommends developing streaming code in notebooks and running continuous production streams as Spark job definitions, which are non-interactive and more robust. A retry policy on the Spark job definition restarts the job automatically after an unexpected stop, with a configurable number of retries and interval.
    fr: |
      Microsoft recommande de développer le code de streaming dans des notebooks et d'exécuter les flux de production continus sous forme de définitions de travail Spark, non interactives et plus robustes. Une stratégie de nouvelle tentative sur la définition de travail Spark redémarre automatiquement le travail après un arrêt inattendu, avec un nombre de tentatives et un intervalle configurables.
  options:
    d:
      en: |
        A schedule starts new runs but doesn't keep a continuous stream running; a stop leaves a gap until the next run, and overlapping runs must be managed.
      fr: |
        Une planification démarre de nouvelles exécutions mais ne maintient pas un flux continu ; un arrêt laisse un trou jusqu'à l'exécution suivante, et les exécutions qui se chevauchent doivent être gérées.
    a:
      en: |
        An interactive session isn't restarted automatically when it stops, so someone must monitor and restart it.
      fr: |
        Une session interactive n'est pas redémarrée automatiquement quand elle s'arrête : quelqu'un doit la surveiller et la redémarrer.
    c:
      en: |
        Rewriting tested code adds development effort, and the requirement is about running the existing stream reliably.
      fr: |
        Réécrire du code testé ajoute un effort de développement, alors que l'exigence porte sur l'exécution fiable du flux existant.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
