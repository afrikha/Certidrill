id: dp700-2b-transform-syntax-match
objective: "2.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Your team transforms semi-structured data in two places: KQL queries in an eventhouse, and PySpark notebooks in a lakehouse.

    You need to identify the function or operator to use for each transformation shown in the answer area.

    What should you use? To answer, drag the appropriate functions or operators to the correct transformations. Each function or operator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe transforme des données semi-structurées à deux endroits : des requêtes KQL dans un eventhouse et des notebooks PySpark dans un lakehouse.

    Vous devez identifier la fonction ou l'opérateur à utiliser pour chaque transformation présentée dans la zone de réponse.

    Que devez-vous utiliser ? Pour répondre, faites glisser les fonctions ou opérateurs appropriés vers les transformations correspondantes. Chaque fonction ou opérateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mvexpand, text: mv-expand }
    - { id: explode, text: "explode()" }
    - { id: parsejson, text: "parse_json()" }
    - { id: fromjson, text: "from_json()" }
    - { id: tojson, text: "to_json()" }
    - { id: makelist, text: "summarize make_list()" }
  targets:
    - id: t1
      text: { en: "KQL: create one record for each element of a dynamic array column", fr: "KQL : créer un enregistrement pour chaque élément d'une colonne de tableau dynamique" }
    - id: t2
      text: { en: "PySpark: create one row for each element of an array column", fr: "PySpark : créer une ligne pour chaque élément d'une colonne de type tableau" }
    - id: t3
      text: { en: "KQL: convert a string column that contains JSON into a dynamic value", fr: "KQL : convertir une colonne de chaîne qui contient du JSON en valeur dynamique" }
    - id: t4
      text: { en: "PySpark: convert a string column that contains JSON into a struct by using a schema", fr: "PySpark : convertir une colonne de chaîne qui contient du JSON en structure à l'aide d'un schéma" }
answer:
  mapping: { t1: mvexpand, t2: explode, t3: parsejson, t4: fromjson }
explanation:
  correct:
    en: |
      In KQL, mv-expand expands a dynamic array or property bag so that each element becomes its own record, and parse_json() turns a JSON string into a dynamic value. In PySpark, explode() returns one row per array element, and from_json() parses a JSON string column into a struct that follows a given schema. to_json() and summarize make_list() go the other way: they serialize or collect values.
    fr: |
      En KQL, mv-expand développe un tableau dynamique ou un conteneur de propriétés pour que chaque élément devienne un enregistrement, et parse_json() transforme une chaîne JSON en valeur dynamique. En PySpark, explode() renvoie une ligne par élément du tableau, et from_json() analyse une colonne de chaîne JSON en structure qui suit un schéma donné. to_json() et summarize make_list() vont dans l'autre sens : elles sérialisent ou regroupent des valeurs.
references:
  - title: mv-expand operator
    url: https://learn.microsoft.com/en-us/kusto/query/mv-expand-operator?view=microsoft-fabric
