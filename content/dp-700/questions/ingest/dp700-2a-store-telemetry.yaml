id: dp700-2a-store-telemetry
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum operates 40,000 connected water meters that send a reading every few seconds. Analysts need interactive queries over billions of rows, time series and geospatial functions, and Power BI reports that show the readings a few seconds after they're produced.

    Which data store should you use?
  fr: |
    Adatum exploite 40 000 compteurs d'eau connectés qui envoient un relevé toutes les quelques secondes. Les analystes ont besoin de requêtes interactives sur des milliards de lignes, de fonctions de séries chronologiques et géospatiales, et de rapports Power BI qui affichent les relevés quelques secondes après leur production.

    Quel magasin de données devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A lakehouse", fr: "Un lakehouse" } }
    - { id: b, text: { en: "An eventhouse", fr: "Un eventhouse" } }
    - { id: c, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: d, text: { en: "A SQL database in Fabric", fr: "Une base de données SQL dans Fabric" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An eventhouse is the Fabric store for streaming event data and high-granularity activity data. It handles billions of rows with fast response times, provides time series and geospatial analysis in KQL, and supports a fast DirectQuery mode in Power BI for data that is seconds old.
    fr: |
      Un eventhouse est le magasin Fabric des données d'événements de diffusion en continu et des données d'activité à forte granularité. Il traite des milliards de lignes avec des temps de réponse rapides, offre l'analyse de séries chronologiques et géospatiale en KQL, et prend en charge un mode DirectQuery rapide dans Power BI pour des données vieilles de quelques secondes.
  options:
    a: { en: "A lakehouse targets big data engineering with Spark; it doesn't offer KQL time series functions or second-level freshness.", fr: "Un lakehouse cible l'ingénierie Big Data avec Spark ; il n'offre ni fonctions de séries chronologiques KQL ni fraîcheur à la seconde." }
    c: { en: "A warehouse targets SQL-based BI on star schemas loaded in batches.", fr: "Un entrepôt cible la BI en SQL sur des schémas en étoile chargés par lots." }
    d: { en: "A SQL database in Fabric is an operational OLTP database, not a store for billions of telemetry readings.", fr: "Une base de données SQL dans Fabric est une base opérationnelle OLTP, pas un magasin pour des milliards de relevés de télémétrie." }
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
