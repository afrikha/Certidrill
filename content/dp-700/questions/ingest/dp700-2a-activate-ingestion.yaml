id: dp700-2a-activate-ingestion
objective: "2.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an eventstream named **ES2** that has an Azure SQL Database CDC source. You plan to add a Filter operator and an Eventhouse destination that uses **Event processing before ingestion**.

    When the source starts, it first produces a snapshot of the source tables. None of the snapshot events must be missed by the destination.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un flux d'événements nommé **ES2** qui a une source CDC Azure SQL Database. Vous prévoyez d'ajouter un opérateur Filter et une destination Eventhouse qui utilise **Event processing before ingestion**.

    Au démarrage, la source produit d'abord un instantané des tables sources. La destination ne doit manquer aucun événement de cet instantané.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: add, text: { en: "Add the Eventhouse destination after the Filter operator, and clear Activate ingestion after adding the data source.", fr: "Ajouter la destination Eventhouse après l'opérateur Filter, et décocher Activate ingestion after adding the data source." } }
    - { id: publish, text: { en: "Publish ES2.", fr: "Publier ES2." } }
    - { id: activate, text: { en: "Activate ingestion of the destination, and select Custom time with a time earlier than the start of the source.", fr: "Activer l'ingestion de la destination, et sélectionner Custom time avec une heure antérieure au démarrage de la source." } }
    - { id: direct, text: { en: "Change the destination to Direct ingestion, and connect it to the default stream.", fr: "Passer la destination en Direct ingestion, et la connecter au flux par défaut." } }
    - { id: now, text: { en: "Activate ingestion of the destination, and select Now.", fr: "Activer l'ingestion de la destination, et sélectionner Now." } }
    - { id: deact, text: { en: "Deactivate the CDC source, and then remove the Filter operator.", fr: "Désactiver la source CDC, puis supprimer l'opérateur Filter." } }
answer:
  sequence: [add, publish, activate]
explanation:
  correct:
    en: |
      On publish, data can reach the eventstream before the routing to the destination is initialized, so the initial CDC snapshot may never arrive. Clearing Activate ingestion when you add the destination, publishing, and then activating ingestion with a custom time earlier than the start processes and routes those first events.
    fr: |
      À la publication, des données peuvent atteindre le flux d'événements avant que le routage vers la destination soit initialisé : l'instantané CDC initial risque de ne jamais arriver. Décocher Activate ingestion lors de l'ajout de la destination, publier, puis activer l'ingestion avec une heure personnalisée antérieure au démarrage permet de traiter et de router ces premiers événements.
  options:
    direct: { en: "Direct ingestion can't follow an operator and doesn't support pause and resume, so it offers no custom start time.", fr: "Direct ingestion ne peut pas suivre un opérateur et ne prend pas en charge la pause et la reprise : elle n'offre pas d'heure de départ personnalisée." }
    now: { en: "Now resumes from the current time, after the snapshot events were produced.", fr: "Now reprend à l'heure actuelle, après la production des événements de l'instantané." }
    deact: { en: "Removing the Filter operator changes the design, and deactivating the source doesn't recover the snapshot.", fr: "Supprimer l'opérateur Filter modifie la conception, et désactiver la source ne récupère pas l'instantané." }
references:
  - title: Add an Eventhouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-kql-database
  - title: Pause and resume data streams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/pause-resume-data-streams
