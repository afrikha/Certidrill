id: dp700-2d-es-operator-match
objective: "2.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are designing an eventstream named **ES-Buildings** that processes events from smart building sensors. Each event contains the `devId`, `buildingId` and `reading` fields, and a `samples` field that holds an array of measurements. `reading` arrives as a string.

    You need to meet the following processing requirements by using no-code operators.

    Which operator should you use for each requirement? To answer, drag the appropriate operators to the correct requirements. Each operator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez un flux d'événements nommé **ES-Buildings** qui traite les événements de capteurs de bâtiments intelligents. Chaque événement contient les champs `devId`, `buildingId` et `reading`, ainsi qu'un champ `samples` qui contient un tableau de mesures. `reading` arrive sous forme de chaîne.

    Vous devez satisfaire les exigences de traitement suivantes à l'aide d'opérateurs sans code.

    Quel opérateur devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les opérateurs appropriés vers les exigences correspondantes. Chaque opérateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: filter, text: Filter }
    - { id: manage, text: Manage fields }
    - { id: aggregate, text: Aggregate }
    - { id: groupby, text: Group by }
    - { id: expand, text: Expand }
    - { id: join, text: Join }
    - { id: union, text: Union }
  targets:
    - id: t1
      text: { en: "Rename devId to DeviceId and convert reading to a double", fr: "Renommer devId en DeviceId et convertir reading en double" }
    - id: t2
      text: { en: "Output one row for each measurement in the samples array", fr: "Produire une ligne pour chaque mesure du tableau samples" }
    - id: t3
      text: { en: "Add the floor number to each event by matching buildingId with the events of a second stream", fr: "Ajouter le numéro d'étage à chaque événement en faisant correspondre buildingId avec les événements d'un second flux" }
    - id: t4
      text: { en: "Compute the average reading per building for each hour", fr: "Calculer la valeur moyenne de reading par bâtiment pour chaque heure" }
answer:
  mapping: { t1: manage, t2: expand, t3: join, t4: groupby }
explanation:
  correct:
    en: |-
      Manage fields renames fields and changes their data type. Expand creates a new row for each value of an array. Join combines two streams based on a matching condition. Group by computes aggregations over time windows, optionally grouped by columns such as buildingId.
    fr: |-
      Manage fields renomme des champs et change leur type de données. Expand crée une nouvelle ligne pour chaque valeur d'un tableau. Join combine deux flux selon une condition de correspondance. Group by calcule des agrégations sur des fenêtres de temps, éventuellement groupées par des colonnes comme buildingId.
  options:
    aggregate:
      en: |-
        Aggregate recalculates a Sum, Minimum, Maximum or Average each time a new event arrives; it doesn't produce one result per building for each fixed hour, which Group by does with a time window.
      fr: |-
        Aggregate recalcule une somme, un minimum, un maximum ou une moyenne à chaque nouvel événement ; il ne produit pas un résultat par bâtiment pour chaque heure fixe, ce que fait Group by avec une fenêtre de temps.
    union:
      en: |-
        Union appends the events of several streams; it doesn't match events on a key to add fields.
      fr: |-
        Union ajoute bout à bout les événements de plusieurs flux ; il ne fait pas correspondre les événements sur une clé pour ajouter des champs.
references:
  - title: Eventstream transformations
    url: https://learn.microsoft.com/en-us/training/modules/explore-event-streams-microsoft-fabric/4-route-event-data-to-destinations
  - title: Route data streams based on content in Microsoft Fabric eventstreams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/route-events-based-on-content
