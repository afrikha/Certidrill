id: dp700-2b-denorm-higher-grain
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW-Sales. DW-Sales contains a denormalized dimension table named DimProduct with the columns ProductKey, ProductName, SubcategoryName and CategoryName, and a fact table named FactSales at the product grain.

    You need to add a fact table named FactSalesTarget that stores monthly sales targets. Targets are set per subcategory only. Analysts must filter targets and sales together by subcategory and by category. The targets must not be changed or estimated.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW-Sales. DW-Sales contient une table de dimension dénormalisée nommée DimProduct avec les colonnes ProductKey, ProductName, SubcategoryName et CategoryName, et une table de faits nommée FactSales au grain du produit.

    Vous devez ajouter une table de faits nommée FactSalesTarget qui stocke des objectifs de ventes mensuels. Les objectifs sont fixés uniquement par sous-catégorie. Les analystes doivent filtrer ensemble les objectifs et les ventes par sous-catégorie et par catégorie. Les objectifs ne doivent être ni modifiés ni estimés.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Split each target evenly across the products of its subcategory, and store FactSalesTarget at the product grain."
        fr: "Répartir chaque objectif à parts égales entre les produits de sa sous-catégorie, et stocker FactSalesTarget au grain du produit."
    - id: b
      text:
        en: "Create a subcategory dimension table with a surrogate key, and add that key to DimProduct and to FactSalesTarget."
        fr: "Créer une table de dimension des sous-catégories avec une clé de substitution, et ajouter cette clé à DimProduct et à FactSalesTarget."
    - id: c
      text:
        en: "Add a column that holds the monthly target of the subcategory to each row of DimProduct."
        fr: "Ajouter à chaque ligne de DimProduct une colonne qui contient l'objectif mensuel de la sous-catégorie."
    - id: d
      text:
        en: "Store SubcategoryName in FactSalesTarget, and relate it to the SubcategoryName column of DimProduct."
        fr: "Stocker SubcategoryName dans FactSalesTarget, et le relier à la colonne SubcategoryName de DimProduct."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Keeping a key for the subcategory level is one of the reasons to keep part of a hierarchy normalized: it relates the dimension to facts stored at a higher grain. FactSalesTarget references the subcategory key, DimProduct carries the same key for its products, so both fact tables filter by subcategory and category without changing the targets.
    fr: |
      Conserver une clé pour le niveau sous-catégorie est l'une des raisons de garder une partie d'une hiérarchie normalisée : elle relie la dimension aux faits stockés à un grain plus élevé. FactSalesTarget référence la clé de sous-catégorie, DimProduct porte la même clé pour ses produits : les deux tables de faits se filtrent par sous-catégorie et par catégorie sans modifier les objectifs.
  options:
    a:
      en: |
        Splitting the targets invents product-level values, which the requirement forbids; facts are hard to split to a lower grain.
      fr: |
        Répartir les objectifs invente des valeurs au niveau du produit, ce que l'exigence interdit ; des faits se répartissent difficilement à un grain plus fin.
    c:
      en: |
        Repeating the target in each product row makes it a dimension attribute, and summing it across products overstates the target.
      fr: |
        Répéter l'objectif dans chaque ligne de produit en fait un attribut de dimension, et l'additionner sur les produits surestime l'objectif.
    d:
      en: |
        SubcategoryName isn't unique in DimProduct, so the relationship is many-to-many; a surrogate key is the stable way to relate tables.
      fr: |
        SubcategoryName n'est pas unique dans DimProduct : la relation est de plusieurs à plusieurs ; une clé de substitution est le moyen stable de relier des tables.
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Fact tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables
