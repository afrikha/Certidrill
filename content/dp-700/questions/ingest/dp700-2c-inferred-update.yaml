id: dp700-2c-inferred-update
objective: "2.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse that contains a dimension table named dbo.DimCustomer and a fact table named dbo.FactSales. dbo.DimCustomer is a type 2 slowly changing dimension for the City attribute and has the columns CustomerKey, CustomerCode, City, IsCurrent, and IsInferredMember.

    Yesterday, the fact load received sales for a customer code C-981 that wasn't in dbo.DimCustomer. It inserted an inferred member with Unknown attributes and IsInferredMember = 1, and it stored the member's CustomerKey in the fact rows.

    Today, the customer's details arrive in the staging table.

    You need to load the details into dbo.DimCustomer. Existing fact rows must reference the customer's real attributes, and no history must be recorded for the placeholder values.

    What should the dimension load do?
  fr: |
    Vous disposez d'un entrepôt Fabric qui contient une table de dimension nommée dbo.DimCustomer et une table de faits nommée dbo.FactSales. dbo.DimCustomer est une dimension à variation lente de type 2 pour l'attribut City et comporte les colonnes CustomerKey, CustomerCode, City, IsCurrent et IsInferredMember.

    Hier, le chargement des faits a reçu des ventes pour un code client C-981 absent de dbo.DimCustomer. Il a inséré un membre déduit avec des attributs Unknown et IsInferredMember = 1, et il a stocké la CustomerKey de ce membre dans les lignes de faits.

    Aujourd'hui, les informations du client arrivent dans la table intermédiaire (staging).

    Vous devez charger ces informations dans dbo.DimCustomer. Les lignes de faits existantes doivent référencer les vrais attributs du client, et aucun historique ne doit être enregistré pour les valeurs provisoires.

    Que doit faire le chargement de la dimension ?
body:
  options:
    - id: a
      text:
        en: "Delete the inferred member row and insert a new row with the real attributes and a new CustomerKey."
        fr: "Supprimer la ligne du membre déduit et insérer une nouvelle ligne avec les vrais attributs et une nouvelle CustomerKey."
    - id: b
      text:
        en: "Update the inferred member row with the real attributes and set IsInferredMember to 0."
        fr: "Mettre à jour la ligne du membre déduit avec les vrais attributs et définir IsInferredMember sur 0."
    - id: c
      text:
        en: "Keep the inferred member row and insert a second row for C-981 with IsCurrent = 1 and IsInferredMember = 0."
        fr: "Conserver la ligne du membre déduit et insérer une deuxième ligne pour C-981 avec IsCurrent = 1 et IsInferredMember = 0."
    - id: d
      text:
        en: "Set IsCurrent to 0 on the inferred member row and insert a new current row with the real attributes."
        fr: "Définir IsCurrent sur 0 sur la ligne du membre déduit et insérer une nouvelle ligne actuelle avec les vrais attributs."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Changes to an inferred member are late-arriving dimension details, not a type 2 change. Updating the row in place keeps its CustomerKey, so the fact rows already loaded now show the real attributes, and clearing the flag tells later loads to apply normal SCD logic.
    fr: |
      Les modifications d'un membre déduit sont des informations de dimension tardives, pas une modification de type 2. Mettre à jour la ligne sur place conserve sa CustomerKey : les lignes de faits déjà chargées affichent maintenant les vrais attributs, et la remise à zéro de l'indicateur indique aux chargements suivants d'appliquer la logique SCD normale.
  options:
    d:
      en: |
        Treating the arrival as a type 2 change records the Unknown placeholder as history, and the existing facts stay linked to the expired Unknown row.
      fr: |
        Traiter l'arrivée comme une modification de type 2 enregistre la valeur provisoire Unknown comme historique, et les faits existants restent liés à la ligne Unknown expirée.
    a:
      en: |
        Deleting the row leaves the existing fact rows with a CustomerKey that no longer exists, and Fabric Warehouse doesn't enforce foreign keys to prevent it.
      fr: |
        Supprimer la ligne laisse les lignes de faits existantes avec une CustomerKey qui n'existe plus, et Fabric Warehouse n'applique pas les clés étrangères pour l'empêcher.
    c:
      en: |
        A second row creates two members for the same customer code, and the existing facts still point to the Unknown values.
      fr: |
        Une deuxième ligne crée deux membres pour le même code client, et les faits existants pointent toujours vers les valeurs Unknown.
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
