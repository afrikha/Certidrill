id: dp700-2a-dim-truncate
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a warehouse named **DW1** that contains a dimension table named **dbo.DimProduct** and a fact table named **dbo.FactSales**. ProductKey in dbo.DimProduct is a bigint IDENTITY column, and dbo.FactSales stores ProductKey values. dbo.DimProduct keeps the history of price category changes as an SCD type 2 dimension.

    A developer proposes to truncate dbo.DimProduct and reload it entirely from the source every night to simplify the load.

    Why should you reject the proposal?
  fr: |
    Vous disposez d'un entrepôt nommé **DW1** qui contient une table de dimension nommée **dbo.DimProduct** et une table de faits nommée **dbo.FactSales**. ProductKey dans dbo.DimProduct est une colonne IDENTITY de type bigint, et dbo.FactSales stocke des valeurs ProductKey. dbo.DimProduct conserve l'historique des changements de catégorie de prix sous forme de dimension SCD de type 2.

    Un développeur propose de tronquer dbo.DimProduct et de la recharger entièrement depuis la source chaque nuit pour simplifier le chargement.

    Pourquoi devez-vous rejeter cette proposition ?
body:
  options:
    - { id: a, text: { en: "The reload generates new ProductKey values, so the existing fact rows point to the wrong products, and the past product versions may not be rebuilt.", fr: "Le rechargement génère de nouvelles valeurs ProductKey : les lignes de faits existantes pointent vers de mauvais produits, et les versions passées des produits risquent de ne pas pouvoir être reconstruites." } }
    - { id: b, text: { en: "TRUNCATE TABLE isn't supported in Fabric Data Warehouse, so the reload would have to delete the rows in batches and would take too long.", fr: "TRUNCATE TABLE n'est pas pris en charge dans Fabric Data Warehouse : le rechargement devrait supprimer les lignes par lots et prendrait trop de temps." } }
    - { id: c, text: { en: "After TRUNCATE TABLE, the IDENTITY column can't generate values until you run DBCC CHECKIDENT with a new seed value.", fr: "Après TRUNCATE TABLE, la colonne IDENTITY ne peut plus générer de valeurs tant que vous n'exécutez pas DBCC CHECKIDENT avec une nouvelle valeur de départ." } }
    - { id: d, text: { en: "Fabric Data Warehouse enforces the foreign key between dbo.FactSales and dbo.DimProduct, so the truncation fails.", fr: "Fabric Data Warehouse applique la clé étrangère entre dbo.FactSales et dbo.DimProduct : la troncation échoue." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Fabric guidance says never to truncate and fully reload a dimension whose surrogate keys are generated automatically. New IDENTITY values invalidate the keys already stored in the facts, and the historical versions of an SCD type 2 dimension may be impossible to regenerate from the source. Dimensions are processed incrementally instead.
    fr: |
      Les recommandations Fabric interdisent de tronquer et recharger entièrement une dimension dont les clés de substitution sont générées automatiquement. De nouvelles valeurs IDENTITY invalident les clés déjà stockées dans les faits, et les versions historiques d'une dimension SCD de type 2 peuvent être impossibles à régénérer depuis la source. Les dimensions sont plutôt traitées de façon incrémentielle.
  options:
    b: { en: "TRUNCATE TABLE is supported in Fabric Data Warehouse; Learn recommends it for staging tables.", fr: "TRUNCATE TABLE est pris en charge dans Fabric Data Warehouse ; Learn le recommande pour les tables de mise en lots." }
    c: { en: "The IDENTITY column keeps generating values; DBCC CHECKIDENT supports only RESEED without a custom value.", fr: "La colonne IDENTITY continue de générer des valeurs ; DBCC CHECKIDENT ne prend en charge que RESEED sans valeur personnalisée." }
    d: { en: "Foreign keys in Fabric Data Warehouse are NOT ENFORCED and never block a statement.", fr: "Les clés étrangères de Fabric Data Warehouse sont NOT ENFORCED et ne bloquent jamais une instruction." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
