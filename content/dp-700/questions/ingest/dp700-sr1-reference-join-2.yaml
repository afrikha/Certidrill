id: dp700-sr1-reference-join-2
objective: "2.3.2"
type: series_yesno
series: dp700-sr1-reference-join
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create a standard OneLake shortcut and query it with external_table().
  fr: Vous créez un raccourci OneLake standard et l'interrogez avec external_table().
body:
  solution:
    en: |
      In KDB1, you create a OneLake shortcut named **DimDevice** to the dim_device table of LH-Ref, with **Accelerate** set to **Off**. The analysts use queries such as the following:

      ```kusto
      Telemetry
      | where Timestamp > ago(7d)
      | join kind=leftouter (external_table('DimDevice')) on DeviceId
      ```
    fr: |
      Dans KDB1, vous créez un raccourci OneLake nommé **DimDevice** vers la table dim_device de LH-Ref, avec **Accelerate** défini sur **Off**. Les analystes utilisent des requêtes telles que la suivante :

      ```kusto
      Telemetry
      | where Timestamp > ago(7d)
      | join kind=leftouter (external_table('DimDevice')) on DeviceId
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      A standard shortcut references the Delta table in place, without moving the data, so EH1 stores no copy and every query reads the version that LH-Ref holds at query time. The shortcut is queried with the external_table() function. Queries over a shortcut are slower than over a native table, which is acceptable for a few ad hoc queries a week.
    fr: |
      Un raccourci standard référence la table Delta sur place, sans déplacer les données : EH1 ne stocke aucune copie, et chaque requête lit la version que LH-Ref contient au moment de la requête. Le raccourci s'interroge avec la fonction external_table(). Les requêtes sur un raccourci sont plus lentes que sur une table native, ce qui est acceptable pour quelques requêtes ad hoc par semaine.
references:
  - title: Create OneLake shortcuts in a KQL database
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts
