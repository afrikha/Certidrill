id: dp700-2c-email-duplicates
objective: "2.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Dataflow Gen2 that loads a list of newsletter subscribers into a lakehouse table. The Email column contains values such as Ann.Lee@contoso.com and ann.lee@contoso.com for the same subscriber.

    You apply **Remove duplicates** to the Email column, but both rows remain.

    You need to keep a single row for each email address.

    What should you do before you remove the duplicates?
  fr: |
    Vous disposez d'un Dataflow Gen2 qui charge une liste d'abonnés à une lettre d'information dans une table de lakehouse. La colonne Email contient des valeurs comme Ann.Lee@contoso.com et ann.lee@contoso.com pour le même abonné.

    Vous appliquez **Remove duplicates** à la colonne Email, mais les deux lignes restent.

    Vous devez conserver une seule ligne par adresse e-mail.

    Que devez-vous faire avant de supprimer les doublons ?
body:
  options:
    - id: a
      text:
        en: "Apply **Keep duplicates** to the Email column."
        fr: "Appliquer **Keep duplicates** à la colonne Email."
    - id: b
      text:
        en: "Transform the Email column to lowercase."
        fr: "Transformer la colonne Email en minuscules."
    - id: c
      text:
        en: "Change the data type of the Email column to Text."
        fr: "Changer le type de données de la colonne Email en Texte."
    - id: d
      text:
        en: "Trim the Email column."
        fr: "Supprimer les espaces de la colonne Email (Trim)."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Power Query compares values in a case-sensitive way, so Ann.Lee@contoso.com and ann.lee@contoso.com are different values for Remove duplicates. Converting the column to lowercase (or uppercase) first makes the two values identical, so one of the rows is removed.
    fr: |
      Power Query compare les valeurs en respectant la casse : Ann.Lee@contoso.com et ann.lee@contoso.com sont des valeurs différentes pour Remove duplicates. Convertir d'abord la colonne en minuscules (ou en majuscules) rend les deux valeurs identiques, et l'une des lignes est supprimée.
  options:
    d:
      en: |
        Trim removes leading and trailing spaces; it doesn't change the case of the letters.
      fr: |
        Trim supprime les espaces de début et de fin ; il ne change pas la casse des lettres.
    a:
      en: |
        Keep duplicates keeps only the rows whose value is repeated, and the two values still differ by case.
      fr: |
        Keep duplicates ne conserve que les lignes dont la valeur est répétée, et les deux valeurs diffèrent toujours par la casse.
    c:
      en: |
        The values are already text; the data type doesn't affect case-sensitive comparison.
      fr: |
        Les valeurs sont déjà du texte ; le type de données ne change rien à la comparaison sensible à la casse.
references:
  - title: Working with duplicate values - Power Query
    url: https://learn.microsoft.com/en-us/power-query/working-with-duplicates
