id: dp700-2b-denorm-notebook-steps
objective: "2.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse that contains three Delta tables loaded from a snowflaked source:

    - stg_product: ProductID, ProductName, SubcategoryID
    - stg_subcategory: SubcategoryID, SubcategoryName, CategoryID
    - stg_category: CategoryID, CategoryName

    You need a PySpark notebook to build a denormalized table named dim_product that has one row per product with its subcategory and category names. Products without a subcategory must be kept.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un lakehouse qui contient trois tables Delta chargées depuis une source en flocon :

    - stg_product : ProductID, ProductName, SubcategoryID
    - stg_subcategory : SubcategoryID, SubcategoryName, CategoryID
    - stg_category : CategoryID, CategoryName

    Un notebook PySpark doit créer une table dénormalisée nommée dim_product qui comporte une ligne par produit avec les noms de sa sous-catégorie et de sa catégorie. Les produits sans sous-catégorie doivent être conservés.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: read, text: { en: "Read the three tables into DataFrames.", fr: "Lire les trois tables dans des DataFrames." } }
    - { id: j1, text: { en: "Left join the product DataFrame to the subcategory DataFrame on SubcategoryID.", fr: "Joindre à gauche le DataFrame des produits au DataFrame des sous-catégories sur SubcategoryID." } }
    - { id: j2, text: { en: "Left join the result to the category DataFrame on CategoryID.", fr: "Joindre à gauche le résultat au DataFrame des catégories sur CategoryID." } }
    - { id: write, text: { en: "Select the product, subcategory and category columns, and write them to dim_product in overwrite mode.", fr: "Sélectionner les colonnes du produit, de la sous-catégorie et de la catégorie, puis les écrire dans dim_product en mode overwrite." } }
    - { id: jcat, text: { en: "Inner join the product DataFrame to the category DataFrame on CategoryID.", fr: "Joindre en interne le DataFrame des produits au DataFrame des catégories sur CategoryID." } }
    - { id: group, text: { en: "Group the product DataFrame by SubcategoryID and count the products.", fr: "Grouper le DataFrame des produits par SubcategoryID et compter les produits." } }
answer:
  sequence: [ read, j1, j2, write ]
explanation:
  correct:
    en: |
      Flattening a snowflake follows its keys: products carry only SubcategoryID, so they join to subcategories first, and the CategoryID of the subcategory then joins to categories. Left joins keep products that have no subcategory, with null names. The selected columns are then written as one denormalized dimension table.
    fr: |
      Aplatir un flocon suit ses clés : les produits ne portent que SubcategoryID, ils se joignent donc d'abord aux sous-catégories, puis le CategoryID de la sous-catégorie se joint aux catégories. Les jointures gauches conservent les produits sans sous-catégorie, avec des noms NULL. Les colonnes sélectionnées sont ensuite écrites sous la forme d'une seule table de dimension dénormalisée.
  options:
    jcat: { en: "stg_product has no CategoryID column, and an inner join would drop products.", fr: "stg_product n'a pas de colonne CategoryID, et une jointure interne supprimerait des produits." }
    group: { en: "Grouping changes the grain to the subcategory; the dimension needs one row per product.", fr: "Le regroupement change le grain en sous-catégorie ; la dimension doit avoir une ligne par produit." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
