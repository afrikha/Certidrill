id: dp700-2a-tool-warehouse-proc
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named **DW1** that contains staging tables loaded by a pipeline named **PL1**. A team of SQL developers must build the transformation that loads the dimension and fact tables of DW1 from the staging tables.

    The developers know only T-SQL, and the data must not leave DW1 during the transformation. The transformation must run in PL1 after the staging load.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt nommé **DW1** qui contient des tables de mise en lots chargées par un pipeline nommé **PL1**. Une équipe de développeurs SQL doit créer la transformation qui charge les tables de dimension et de faits de DW1 à partir des tables de mise en lots.

    Les développeurs ne connaissent que T-SQL, et les données ne doivent pas quitter DW1 pendant la transformation. La transformation doit s'exécuter dans PL1 après le chargement de mise en lots.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Implement the transformation as [[impl]].

      In PL1, run it by using a [[act]] activity that runs after the staging load succeeds.
    fr: |
      Implémentez la transformation sous forme de [[impl]].

      Dans PL1, exécutez-la avec une activité [[act]] qui s'exécute après la réussite du chargement de mise en lots.
  slots:
    - id: impl
      options:
        - { id: i_proc, text: { en: "stored procedures in DW1", fr: "procédures stockées dans DW1" } }
        - { id: i_dfg, text: { en: "a Dataflow Gen2 that writes to DW1", fr: "Dataflow Gen2 qui écrit dans DW1" } }
        - { id: i_nb, text: { en: "a notebook that uses Spark SQL", fr: "notebook qui utilise Spark SQL" } }
        - { id: i_kql, text: { en: "KQL functions in an eventhouse", fr: "fonctions KQL dans un eventhouse" } }
    - id: act
      options:
        - { id: a_proc, text: Stored procedure }
        - { id: a_nb, text: Notebook }
        - { id: a_dfg, text: Dataflow Gen2 }
        - { id: a_lookup, text: Lookup }
answer:
  values: { impl: i_proc, act: a_proc }
explanation:
  correct:
    en: |
      Set-based T-SQL in stored procedures is the natural choice for SQL developers whose data is already in a warehouse: the transformation runs inside DW1 without moving data. Fabric guidance for dimensional models uses pipelines to orchestrate the ETL, and the Stored procedure activity runs a procedure of a warehouse after the previous activity succeeds.
    fr: |
      Du T-SQL ensembliste dans des procédures stockées est le choix naturel pour des développeurs SQL dont les données sont déjà dans un entrepôt : la transformation s'exécute dans DW1 sans déplacer de données. Les recommandations Fabric pour les modèles dimensionnels utilisent des pipelines pour orchestrer l'ETL, et l'activité Stored procedure exécute une procédure d'un entrepôt après la réussite de l'activité précédente.
  options:
    i_dfg: { en: "A Dataflow Gen2 is built with Power Query, not T-SQL, and reads the data out of DW1 to transform it.", fr: "Un Dataflow Gen2 se crée avec Power Query, pas en T-SQL, et lit les données hors de DW1 pour les transformer." }
    i_nb: { en: "A notebook runs on Spark outside the warehouse engine, and the developers know only T-SQL.", fr: "Un notebook s'exécute sur Spark en dehors du moteur d'entrepôt, et les développeurs ne connaissent que T-SQL." }
    i_kql: { en: "KQL functions run in an eventhouse, not against warehouse tables.", fr: "Les fonctions KQL s'exécutent dans un eventhouse, pas sur des tables d'entrepôt." }
    a_lookup: { en: "A Lookup activity returns a result set to the pipeline; it isn't the activity for running a transformation procedure.", fr: "Une activité Lookup renvoie un jeu de résultats au pipeline ; ce n'est pas l'activité qui exécute une procédure de transformation." }
references:
  - title: "Dimensional modeling in Microsoft Fabric Warehouse: Load tables"
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-load-tables
  - title: Activity overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview
