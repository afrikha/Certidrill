id: dp700-2b-shortcut-delegated
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two Fabric workspaces in the same tenant: WS-HR contains a lakehouse named LH-HR, and WS-Analytics contains a lakehouse named LH-Analytics.

    LH-Analytics has a shortcut named employees that points to a table of LH-HR. The shortcut was created with the default authentication settings.

    The HR data owner requires that analysts read the data through the employees shortcut without receiving any permission in WS-HR or on LH-HR. Access must be controlled by OneLake security roles defined on the shortcut in LH-Analytics.

    What should you do?
  fr: |
    Vous disposez de deux espaces de travail Fabric dans le même locataire : WS-HR contient un lakehouse nommé LH-HR et WS-Analytics contient un lakehouse nommé LH-Analytics.

    LH-Analytics possède un raccourci nommé employees qui pointe vers une table de LH-HR. Le raccourci a été créé avec les paramètres d'authentification par défaut.

    Le propriétaire des données RH exige que les analystes lisent les données via le raccourci employees sans recevoir d'autorisation dans WS-HR ni sur LH-HR. L'accès doit être contrôlé par des rôles de sécurité OneLake définis sur le raccourci dans LH-Analytics.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Open the properties of the employees shortcut and change its authentication to Delegated identity."
        fr: "Ouvrir les propriétés du raccourci employees et changer son authentification en Delegated identity."
    - id: b
      text:
        en: "Delete the employees shortcut and create it again, selecting Delegated identity as the authentication."
        fr: "Supprimer le raccourci employees et le créer de nouveau en sélectionnant Delegated identity comme authentification."
    - id: c
      text:
        en: "Add the analysts to the Viewer role of WS-HR and define a OneLake security role on LH-HR."
        fr: "Ajouter les analystes au rôle Viewer de WS-HR et définir un rôle de sécurité OneLake sur LH-HR."
    - id: d
      text:
        en: "Add the analysts to the Contributor role of WS-Analytics so that OneLake security roles don't apply."
        fr: "Ajouter les analystes au rôle Contributor de WS-Analytics pour que les rôles de sécurité OneLake ne s'appliquent pas."
answer: { optionId: b }
explanation:
  correct:
    en: |
      A same-tenant OneLake shortcut uses passthrough by default, which checks the caller's own permissions at the target. Delegated authentication reads the target with an intermediate credential, so users don't need direct access to LH-HR, and OneLake security on the shortcut controls what they see. The mode is chosen when the shortcut is created: to change it, you delete and re-create the shortcut.
    fr: |
      Un raccourci OneLake dans le même locataire utilise par défaut le mode passthrough, qui vérifie les autorisations propres de l'appelant sur la cible. L'authentification déléguée lit la cible avec des informations d'identification intermédiaires : les utilisateurs n'ont pas besoin d'un accès direct à LH-HR, et la sécurité OneLake du raccourci contrôle ce qu'ils voient. Le mode se choisit à la création du raccourci : pour le changer, vous supprimez et recréez le raccourci.
  options:
    a:
      en: |
        An existing shortcut can't be switched between passthrough and delegated authentication; it must be deleted and re-created.
      fr: |
        Un raccourci existant ne peut pas basculer entre l'authentification passthrough et déléguée ; il doit être supprimé et recréé.
    c:
      en: |
        A role in WS-HR gives the analysts a permission on the HR side, which the data owner forbids.
      fr: |
        Un rôle dans WS-HR donne aux analystes une autorisation côté RH, ce que le propriétaire des données interdit.
    d:
      en: |
        Contributors bypass OneLake security roles, so access would no longer be controlled by them, and a passthrough shortcut would still require access to LH-HR.
      fr: |
        Les membres du rôle Contributor ne sont pas limités par les rôles de sécurité OneLake : l'accès ne serait plus contrôlé par ces rôles, et un raccourci passthrough exigerait toujours un accès à LH-HR.
references:
  - title: Secure and manage OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcut-security
