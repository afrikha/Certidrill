id: dp700-cs1b-data-stores
objective: "2.2.1"
type: dragdrop
caseStudy: dp700-cs1b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the data store requirement for the new data projects.

    Which Fabric item should you use for each data set? To answer, drag the appropriate items to the correct data sets. Each item may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence relative aux magasins de données pour les nouveaux projets.

    Quel élément Fabric devez-vous utiliser pour chaque jeu de données ? Pour répondre, faites glisser les éléments appropriés vers les jeux de données correspondants. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lh, text: { en: "Lakehouse", fr: "Lakehouse" } }
    - { id: wh, text: { en: "Warehouse", fr: "Entrepôt" } }
    - { id: eh, text: { en: "Eventhouse", fr: "Eventhouse" } }
    - { id: sqldb, text: { en: "SQL database", fr: "Base de données SQL" } }
    - { id: mirror, text: { en: "Mirrored database", fr: "Base de données mise en miroir" } }
  targets:
    - id: royalty
      text: { en: "Royalty statements", fr: "Relevés de droits d'auteur" }
    - id: manuscripts
      text: { en: "Manuscripts", fr: "Manuscrits" }
    - id: telemetry
      text: { en: "E-reader telemetry", fr: "Télémétrie des liseuses" }
    - id: orders
      text: { en: "Online shop orders", fr: "Commandes de la boutique en ligne" }
answer:
  mapping: { royalty: wh, manuscripts: lh, telemetry: eh, orders: sqldb }
explanation:
  correct:
    en: |-
      A warehouse suits a star schema built by T-SQL developers and supports full SQL transactions across tables. A lakehouse stores unstructured and semi-structured files, such as PDF and JSON, for PySpark notebooks. An eventhouse is built for high-volume streaming JSON events and time-series analysis with KQL. A SQL database in Fabric is the operational store for an application with many small concurrent transactions.
    fr: |-
      Un entrepôt convient à un schéma en étoile construit par des développeurs T-SQL et prend en charge les transactions SQL complètes sur plusieurs tables. Un lakehouse stocke des fichiers non structurés et semi-structurés, comme des PDF et du JSON, pour des notebooks PySpark. Un eventhouse est conçu pour de grands volumes d'événements JSON en flux et l'analyse de séries chronologiques avec KQL. Une base de données SQL dans Fabric est le magasin opérationnel d'une application qui exécute de nombreuses petites transactions simultanées.
  options:
    mirror:
      en: |-
        A mirrored database is a read-only replica of an external database in OneLake; an application cannot write its transactions to it.
      fr: |-
        Une base de données mise en miroir est une réplique en lecture seule d'une base de données externe dans OneLake ; une application ne peut pas y écrire ses transactions.
references:
  - title: "Microsoft Fabric decision guide: choose a data store"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-data-store
