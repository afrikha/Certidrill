id: dp700-2c-rollup-results
objective: "2.2.8"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse that contains a table named dbo.Sales. The Region and Store columns of dbo.Sales never contain null values.

    You run the following query:

    ```sql
    SELECT Region, Store, SUM(Amount) AS Total
    FROM dbo.Sales
    GROUP BY ROLLUP (Region, Store);
    ```

    The query returns the rows shown in the following table.

    Answer each prompt by selecting the appropriate row number.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric qui contient une table nommée dbo.Sales. Les colonnes Region et Store de dbo.Sales ne contiennent jamais de valeurs null.

    Vous exécutez la requête suivante :

    ```sql
    SELECT Region, Store, SUM(Amount) AS Total
    FROM dbo.Sales
    GROUP BY ROLLUP (Region, Store);
    ```

    La requête renvoie les lignes figurant dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le numéro de ligne approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The row that contains the total amount of all the stores of all the regions", fr: "La ligne qui contient le montant total de tous les magasins de toutes les régions" }
    - id: p2
      text: { en: "The row that contains the total amount of the West region", fr: "La ligne qui contient le montant total de la région West" }
  grid:
    header: [{ en: "Row", fr: "Ligne" }, Region, Store, Total]
    rows:
      - [{ text: "1", area: r1 }, { text: East }, { text: S01 }, { text: "120" }]
      - [{ text: "2", area: r2 }, { text: East }, { text: S02 }, { text: "180" }]
      - [{ text: "3", area: r3 }, { text: East }, { text: "NULL" }, { text: "300" }]
      - [{ text: "4", area: r4 }, { text: West }, { text: S03 }, { text: "250" }]
      - [{ text: "5", area: r5 }, { text: West }, { text: "NULL" }, { text: "250" }]
      - [{ text: "6", area: r6 }, { text: "NULL" }, { text: "NULL" }, { text: "550" }]
answer:
  values: { p1: r6, p2: r5 }
explanation:
  correct:
    en: |
      ROLLUP (Region, Store) produces the grouping sets (Region, Store), (Region), and (). Because the source columns never contain nulls, a NULL in the result marks a rolled-up level: Store = NULL is the subtotal of a region (row 5 for West, even though West has a single store), and Region = NULL with Store = NULL is the grand total (row 6).
    fr: |
      ROLLUP (Region, Store) produit les ensembles de regroupement (Region, Store), (Region) et (). Comme les colonnes sources ne contiennent jamais de null, un NULL dans le résultat marque un niveau agrégé : Store = NULL est le sous-total d'une région (ligne 5 pour West, même si West n'a qu'un magasin), et Region = NULL avec Store = NULL est le total général (ligne 6).
  options:
    r4:
      en: "Row 4 is the detail row of store S03; it has the same amount as the West subtotal only because West has one store."
      fr: "La ligne 4 est la ligne de détail du magasin S03 ; elle a le même montant que le sous-total de West uniquement parce que West n'a qu'un magasin."
    r3:
      en: "Row 3 is the subtotal of the East region."
      fr: "La ligne 3 est le sous-total de la région East."
references:
  - title: GROUP BY (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql?view=fabric
