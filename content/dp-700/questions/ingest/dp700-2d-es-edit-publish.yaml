id: dp700-2d-es-edit-publish
objective: "2.3.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a published eventstream named **ES-Boilers** that has an Azure IoT Hub source. Each event contains the `boilerId` and `temperature` fields. You have the Contributor role in the workspace.

    You need to store only the events whose temperature is above 80 in a lakehouse table. You must check the output of the transformation before the change is applied to the running eventstream.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un flux d'événements publié nommé **ES-Boilers** qui a une source Azure IoT Hub. Chaque événement contient les champs `boilerId` et `temperature`. Vous avez le rôle Contributor dans l'espace de travail.

    Vous devez stocker dans une table de lakehouse uniquement les événements dont la température est supérieure à 80. Vous devez vérifier la sortie de la transformation avant que la modification ne s'applique au flux d'événements en cours d'exécution.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: edit, text: { en: "Select **Edit** on the ribbon.", fr: "Sélectionner **Modifier** dans le ruban." } }
    - { id: add, text: { en: "Add a Filter operator after the default stream, and connect a Lakehouse destination to its output.", fr: "Ajouter un opérateur Filter après le flux par défaut, et connecter une destination Lakehouse à sa sortie." } }
    - { id: refresh, text: { en: "Select **Refresh** and review the **Test result** tab.", fr: "Sélectionner **Actualiser** et examiner l'onglet **Résultat du test**." } }
    - { id: publish, text: { en: "Select **Publish**.", fr: "Sélectionner **Publier**." } }
    - { id: derived, text: { en: "Add a derived stream between the Filter operator and the Lakehouse destination.", fr: "Ajouter un flux dérivé entre l'opérateur Filter et la destination Lakehouse." } }
    - { id: pause, text: { en: "Deactivate the IoT Hub source in Live view.", fr: "Désactiver la source IoT Hub dans la vue en direct." } }
answer:
  sequence: [ edit, add, refresh, publish ]
explanation:
  correct:
    en: |-
      Changes to an eventstream are made in Edit mode. You insert the Filter operator and connect the Lakehouse destination, which accepts processed events directly. **Refresh** validates the operators and shows a preview on the Test result tab, and **Publish** saves the logic and applies it in Live view.
    fr: |-
      Les modifications d'un flux d'événements se font en mode Édition. Vous insérez l'opérateur Filter et connectez la destination Lakehouse, qui accepte directement les événements traités. **Actualiser** valide les opérateurs et affiche un aperçu dans l'onglet Résultat du test, et **Publier** enregistre la logique et l'applique dans la vue en direct.
  options:
    derived: { en: "A derived stream is needed only for destinations that can't be attached to an operator; a lakehouse can be.", fr: "Un flux dérivé n'est nécessaire que pour les destinations qui ne peuvent pas être attachées à un opérateur ; un lakehouse peut l'être." }
    pause: { en: "Editing doesn't require stopping the source; the running eventstream keeps its current logic until you publish.", fr: "La modification n'exige pas d'arrêter la source ; le flux d'événements en cours garde sa logique actuelle jusqu'à la publication." }
references:
  - title: Process Event Data by Using the Event Processing Editor
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/process-events-using-event-processor-editor
