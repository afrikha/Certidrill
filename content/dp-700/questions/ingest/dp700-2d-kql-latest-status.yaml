id: dp700-2d-kql-latest-status
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named **DB-Fleet**. A table named **VehicleEvents** receives about 50 million events per day. Each event contains the `VehicleId`, `EventTime`, `Status` and `Location` columns.

    A Real-Time Dashboard must show the latest event of each vehicle. The results must include the events ingested a few seconds ago, and the dashboard queries must not scan all the events of VehicleEvents each time they run.

    What should you create?
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **DB-Fleet**. Une table nommée **VehicleEvents** reçoit environ 50 millions d'événements par jour. Chaque événement contient les colonnes `VehicleId`, `EventTime`, `Status` et `Location`.

    Un tableau de bord en temps réel doit afficher le dernier événement de chaque véhicule. Les résultats doivent inclure les événements ingérés il y a quelques secondes, et les requêtes du tableau de bord ne doivent pas analyser tous les événements de VehicleEvents à chaque exécution.

    Que devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "A materialized view that uses summarize take_any(*) by VehicleId", fr: "Une vue matérialisée qui utilise summarize take_any(*) by VehicleId" }
    - id: b
      text: { en: "A stored function that runs summarize arg_max(EventTime, *) by VehicleId", fr: "Une fonction stockée qui exécute summarize arg_max(EventTime, *) by VehicleId" }
    - id: c
      text: { en: "A materialized view that uses summarize arg_max(EventTime, *) by VehicleId", fr: "Une vue matérialisée qui utilise summarize arg_max(EventTime, *) by VehicleId" }
    - id: d
      text: { en: "An update policy that runs summarize arg_max(EventTime, *) by VehicleId", fr: "Une stratégie de mise à jour qui exécute summarize arg_max(EventTime, *) by VehicleId" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A materialized view keeps the aggregation up to date in the background, with one record per group-by key. `arg_max(EventTime, *)` keeps the row with the latest EventTime for each vehicle. Querying the view by name combines the materialized part with the records not yet processed, so the result is always fresh without scanning the whole table.
    fr: |-
      Une vue matérialisée garde l'agrégation à jour en arrière-plan, avec un enregistrement par clé de regroupement. `arg_max(EventTime, *)` garde la ligne dont EventTime est la plus récente pour chaque véhicule. Interroger la vue par son nom combine la partie matérialisée et les enregistrements pas encore traités : le résultat est toujours à jour sans analyser toute la table.
  options:
    a:
      en: |-
        take_any(*) keeps an arbitrary record per vehicle, which suits deduplication but not the latest event.
      fr: |-
        take_any(*) garde un enregistrement quelconque par véhicule, ce qui convient à la déduplication mais pas au dernier événement.
    b:
      en: |-
        A stored function returns the right rows, but it aggregates the whole table each time the dashboard runs it.
      fr: |-
        Une fonction stockée renvoie les bonnes lignes, mais elle agrège toute la table à chaque exécution du tableau de bord.
    d:
      en: |-
        An update policy runs on each ingested batch separately, so its target would hold one row per vehicle per batch, not one latest row per vehicle.
      fr: |-
        Une stratégie de mise à jour s'exécute sur chaque lot ingéré séparément : sa cible contiendrait une ligne par véhicule et par lot, pas une seule dernière ligne par véhicule.
references:
  - title: Materialized views
    url: https://learn.microsoft.com/en-us/kusto/management/materialized-views/materialized-view-overview?view=microsoft-fabric
  - title: Create materialized view
    url: https://learn.microsoft.com/en-us/kusto/management/materialized-views/materialized-view-create?view=microsoft-fabric
