stem:
  en: You use left joins from silver_product and coalesce the names.
  fr: Vous utilisez des jointures externes gauches depuis silver_product et appliquez coalesce aux noms.
body:
  solution:
    en: |
      You add the following code to the notebook and run it:

      ```python
      dim = (p.join(s, "SubcategoryID", "left")
              .join(c, "CategoryID", "left")
              .select("ProductID", "ProductName",
                      F.coalesce("SubcategoryName", F.lit("Unknown")).alias("Subcategory"),
                      F.coalesce("CategoryName", F.lit("Unknown")).alias("Category")))
      dim.write.mode("overwrite").saveAsTable("gold_dim_product")
      ```
    fr: |
      Vous ajoutez le code suivant au notebook et l'exécutez :

      ```python
      dim = (p.join(s, "SubcategoryID", "left")
              .join(c, "CategoryID", "left")
              .select("ProductID", "ProductName",
                      F.coalesce("SubcategoryName", F.lit("Unknown")).alias("Subcategory"),
                      F.coalesce("CategoryName", F.lit("Unknown")).alias("Category")))
      dim.write.mode("overwrite").saveAsTable("gold_dim_product")
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      Starting from silver_product with left joins keeps every product, including those whose SubcategoryID is null, and the unique keys of the lookup tables prevent duplicate rows. For the products without a match, SubcategoryName and CategoryName are null, and coalesce replaces them with Unknown. The snowflaked hierarchy is flattened into one dimension table.
    fr: |
      Partir de silver_product avec des jointures externes gauches conserve tous les produits, y compris ceux dont SubcategoryID est null, et l'unicité des clés des tables de recherche évite les lignes en double. Pour les produits sans correspondance, SubcategoryName et CategoryName sont null, et coalesce les remplace par Unknown. La hiérarchie en flocon est aplatie en une seule table de dimension.
