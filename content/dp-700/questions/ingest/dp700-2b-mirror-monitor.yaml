id: dp700-2b-mirror-monitor
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a mirrored database named MDB-Inventory. MDB-Inventory replicates 40 tables from an Azure SQL Managed Instance database.

    Users report that some product quantities look out of date. You need to check, for each mirrored table, its status, the cumulative number of rows replicated, and the last time the table was refreshed from the source.

    What should you use?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient une base de données mise en miroir nommée MDB-Inventory. MDB-Inventory réplique 40 tables d'une base de données Azure SQL Managed Instance.

    Des utilisateurs signalent que certaines quantités de produits semblent obsolètes. Vous devez vérifier, pour chaque table mise en miroir, son état, le nombre cumulé de lignes répliquées et la dernière fois que la table a été actualisée depuis la source.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "The Microsoft Fabric Capacity Metrics app"
        fr: "L'application Microsoft Fabric Capacity Metrics"
    - id: b
      text:
        en: "The queryinsights views of the SQL analytics endpoint"
        fr: "Les vues queryinsights du point de terminaison d'analytique SQL"
    - id: c
      text:
        en: "The Feature Usage and Adoption report of the admin monitoring workspace"
        fr: "Le rapport Feature Usage and Adoption de l'espace de travail de supervision d'administration"
    - id: d
      text:
        en: "The Monitor replication pane of MDB-Inventory"
        fr: "Le volet Monitor replication de MDB-Inventory"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Monitor replication shows the status of the mirrored database and, for each table, its status, the Rows replicated column (the cumulative count of inserts, updates and deletes applied) and the Last completed time. For history and alerts, workspace monitoring adds the MirroredDatabaseTableExecution logs.
    fr: |
      Monitor replication affiche l'état de la base de données mise en miroir et, pour chaque table, son état, la colonne Rows replicated (le nombre cumulé d'insertions, de mises à jour et de suppressions appliquées) et l'heure Last completed. Pour l'historique et les alertes, la supervision de l'espace de travail ajoute les journaux MirroredDatabaseTableExecution.
  options:
    a:
      en: |
        The Capacity Metrics app reports capacity consumption by item and operation, not replication status per table.
      fr: |
        L'application Capacity Metrics indique la consommation de capacité par élément et par opération, pas l'état de réplication par table.
    b:
      en: |
        queryinsights records the queries run against the endpoint; it doesn't report replication progress.
      fr: |
        queryinsights enregistre les requêtes exécutées sur le point de terminaison ; il n'indique pas la progression de la réplication.
    c:
      en: |
        The admin monitoring reports describe tenant activity and adoption, not the replication of a mirrored table.
      fr: |
        Les rapports de supervision d'administration décrivent l'activité et l'adoption du locataire, pas la réplication d'une table mise en miroir.
references:
  - title: Monitor Fabric mirrored database replication
    url: https://learn.microsoft.com/en-us/fabric/mirroring/monitor
