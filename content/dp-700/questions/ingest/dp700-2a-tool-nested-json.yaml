id: dp700-2a-tool-nested-json
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a lakehouse named **Lakehouse2**. Every day, about 2 TB of nested JSON documents land in its Files section. Each document contains arrays of line items that must be flattened into one row per line item. The transformation must call an open-source Python library to normalize postal addresses.

    A team of data engineers who know Python will maintain the solution. Business analysts will only consume the result. The result must be written to Delta tables in Lakehouse2.

    What should you use?
  fr: |
    Vous disposez d'un lakehouse nommé **Lakehouse2**. Chaque jour, environ 2 To de documents JSON imbriqués arrivent dans sa section Files. Chaque document contient des tableaux de lignes de commande qui doivent être aplatis à raison d'une ligne par ligne de commande. La transformation doit appeler une bibliothèque Python open source pour normaliser les adresses postales.

    Une équipe d'ingénieurs données qui connaissent Python maintiendra la solution. Les analystes métier se contenteront de consommer le résultat. Le résultat doit être écrit dans des tables Delta de Lakehouse2.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Dataflow Gen2 with Lakehouse2 as its data destination", fr: "Un Dataflow Gen2 avec Lakehouse2 comme destination des données" } }
    - { id: b, text: { en: "A pipeline Copy data activity that flattens the hierarchy", fr: "Une activité Copy data de pipeline qui aplatit la hiérarchie" } }
    - { id: c, text: { en: "A notebook that uses PySpark", fr: "Un notebook qui utilise PySpark" } }
    - { id: d, text: { en: "A T-SQL stored procedure in the SQL analytics endpoint of Lakehouse2", fr: "Une procédure stockée T-SQL dans le point de terminaison d'analytique SQL de Lakehouse2" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Spark processes large volumes of semi-structured data in parallel, can explode nested arrays, and can use open-source Python libraries, which the low-code tools can't. The data engineers write and maintain the PySpark code in a notebook and write the result to Delta tables in the lakehouse.
    fr: |
      Spark traite en parallèle de gros volumes de données semi-structurées, peut éclater des tableaux imbriqués et utiliser des bibliothèques Python open source, ce que les outils low-code ne permettent pas. Les ingénieurs données écrivent et maintiennent le code PySpark dans un notebook et écrivent le résultat dans des tables Delta du lakehouse.
  options:
    a: { en: "Dataflow Gen2 offers Power Query transformations but can't call an open-source Python library.", fr: "Dataflow Gen2 propose des transformations Power Query mais ne peut pas appeler une bibliothèque Python open source." }
    b: { en: "The Copy data activity performs only lightweight transformations, such as flattening a hierarchy or mapping columns; it can't run Python code.", fr: "L'activité Copy data n'effectue que des transformations légères, comme aplatir une hiérarchie ou mapper des colonnes ; elle ne peut pas exécuter de code Python." }
    d: { en: "The SQL analytics endpoint is read-only and can't write Delta tables.", fr: "Le point de terminaison d'analytique SQL est en lecture seule et ne peut pas écrire de tables Delta." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
