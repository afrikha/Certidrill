id: dp700-2d-win-session-visits
objective: "2.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an eventstream named **ES-Clicks** that receives the clicks of the users of an e-commerce website. Each event contains the `userId` field and a `clickTime` field. You add a SQL operator that uses `TIMESTAMP BY clickTime`.

    You need to count the clicks of each visit. A visit groups the consecutive clicks of one user and ends when the user hasn't clicked for 20 minutes. The window must use a maximum duration of 120 minutes.

    Which GROUP BY clause should you use?
  fr: |
    Vous disposez d'un flux d'événements nommé **ES-Clicks** qui reçoit les clics des utilisateurs d'un site de commerce électronique. Chaque événement contient le champ `userId` et un champ `clickTime`. Vous ajoutez un opérateur SQL qui utilise `TIMESTAMP BY clickTime`.

    Vous devez compter les clics de chaque visite. Une visite regroupe les clics consécutifs d'un utilisateur et se termine quand l'utilisateur n'a pas cliqué pendant 20 minutes. La fenêtre doit utiliser une durée maximale de 120 minutes.

    Quelle clause GROUP BY devez-vous utiliser ?
body:
  options:
    - id: a
      text: "GROUP BY userId, HoppingWindow(minute, 120, 20)"
    - id: b
      text: "GROUP BY userId, SlidingWindow(minute, 20)"
    - id: c
      text: "GROUP BY userId, TumblingWindow(minute, 20)"
    - id: d
      text: "GROUP BY userId, SessionWindow(minute, 20, 120) OVER (PARTITION BY userId)"
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A session window starts with the first event and extends while new events arrive within the timeout; it closes after the timeout without events or when the maximum duration is reached. `SessionWindow(minute, 20, 120)` sets a 20-minute timeout and a 120-minute maximum duration, and the partition key applies the session to each user independently.
    fr: |-
      Une fenêtre de session commence au premier événement et s'étend tant que de nouveaux événements arrivent dans le délai d'expiration ; elle se ferme après ce délai sans événement ou quand la durée maximale est atteinte. `SessionWindow(minute, 20, 120)` définit un délai de 20 minutes et une durée maximale de 120 minutes, et la clé de partition applique la session à chaque utilisateur indépendamment.
  options:
    a:
      en: |-
        A hopping window has a fixed size and fixed start times; it doesn't end after 20 minutes of inactivity.
      fr: |-
        Une fenêtre récurrente (hopping) a une taille et des heures de début fixes ; elle ne se termine pas après 20 minutes d'inactivité.
    b:
      en: |-
        A sliding window outputs a result each time an event enters or leaves a fixed 20-minute window; it doesn't group a visit of variable length.
      fr: |-
        Une fenêtre glissante (sliding) produit un résultat chaque fois qu'un événement entre dans une fenêtre fixe de 20 minutes ou en sort ; elle ne regroupe pas une visite de durée variable.
    c:
      en: |-
        A tumbling window cuts time into fixed 20-minute segments, so one visit can be split across several windows.
      fr: |-
        Une fenêtre bascule (tumbling) découpe le temps en segments fixes de 20 minutes : une même visite peut être répartie sur plusieurs fenêtres.
references:
  - title: Session Window
    url: https://learn.microsoft.com/en-us/stream-analytics-query/session-window-azure-stream-analytics
