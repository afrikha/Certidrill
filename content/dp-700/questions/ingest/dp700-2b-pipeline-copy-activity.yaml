id: dp700-2b-pipeline-copy-activity
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named LH-Raw and a notebook named NB-Clean. An Azure Data Lake Storage Gen2 account contains 2 TB of Parquet files.

    You need to build a pipeline that lands the Parquet files in the Files folder of LH-Raw without any transformation, and then runs NB-Clean. The first step must scale to large volumes and require no code.

    Which activity should you use for the first step?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé LH-Raw et un notebook nommé NB-Clean. Un compte Azure Data Lake Storage Gen2 contient 2 To de fichiers Parquet.

    Vous devez créer un pipeline qui dépose les fichiers Parquet dans le dossier Files de LH-Raw sans aucune transformation, puis exécute NB-Clean. La première étape doit pouvoir traiter de gros volumes et ne nécessiter aucun code.

    Quelle activité devez-vous utiliser pour la première étape ?
body:
  options:
    - id: a
      text:
        en: "Copy data"
        fr: "Copy data"
    - id: b
      text:
        en: "Dataflow Gen2"
        fr: "Dataflow Gen2"
    - id: c
      text:
        en: "Notebook"
        fr: "Notebook"
    - id: d
      text:
        en: "Get Metadata"
        fr: "Get Metadata"
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Copy data activity moves data from a source connector to a destination at large scale, configured without code, and it can be followed by a Notebook activity in the same pipeline. It's the right tool when no transformation is needed beyond mapping or type conversion.
    fr: |
      L'activité Copy data déplace des données d'un connecteur source vers une destination à grande échelle, configurée sans code, et elle peut être suivie d'une activité Notebook dans le même pipeline. C'est l'outil adapté quand aucune transformation n'est nécessaire au-delà du mappage ou de la conversion de types.
  options:
    b:
      en: |
        A Dataflow Gen2 is designed for Power Query transformations; for a plain copy of files it adds work and cost without benefit.
      fr: |
        Un Dataflow Gen2 est conçu pour des transformations Power Query ; pour une simple copie de fichiers, il ajoute du travail et du coût sans bénéfice.
    c:
      en: |
        A Notebook activity runs Spark code, which the requirement excludes for this step.
      fr: |
        Une activité Notebook exécute du code Spark, ce que l'exigence exclut pour cette étape.
    d:
      en: |
        Get Metadata returns information about the data, such as its structure or whether it exists; it doesn't move data.
      fr: |
        Get Metadata renvoie des informations sur les données, comme leur structure ou leur existence ; il ne déplace pas de données.
references:
  - title: How to copy data using copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-data-activity
