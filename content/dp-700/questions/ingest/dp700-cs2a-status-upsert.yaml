id: dp700-cs2a-status-upsert
objective: "2.1.3"
type: single
caseStudy: dp700-cs2a-blue-yonder
difficulty: 2
status: draft
stem:
  en: You need to meet the requirement for aircraft_status. What should you do in SJD-Telemetry?
  fr: Vous devez satisfaire l'exigence relative à aircraft_status. Que devez-vous faire dans SJD-Telemetry ?
body:
  options:
    - { id: a, text: { en: "Write the stream to aircraft_status with outputMode(\"update\"), so that the row of each TailNumber is replaced by the new reading", fr: "Écrire le flux dans aircraft_status avec outputMode(\"update\"), afin que la ligne de chaque TailNumber soit remplacée par le nouveau relevé" } }
    - { id: b, text: { en: "Write the stream with foreachBatch and, in the batch function, merge the latest reading of each TailNumber into aircraft_status", fr: "Écrire le flux avec foreachBatch et, dans la fonction de lot, fusionner (MERGE) le dernier relevé de chaque TailNumber dans aircraft_status" } }
    - { id: c, text: { en: "Apply dropDuplicates(\"TailNumber\") to the stream and append the result to aircraft_status with outputMode(\"append\")", fr: "Appliquer dropDuplicates(\"TailNumber\") au flux et ajouter le résultat à aircraft_status avec outputMode(\"append\")" } }
    - { id: d, text: { en: "Append the stream to aircraft_status with outputMode(\"append\") and enable the delta.enableChangeDataFeed table property", fr: "Ajouter le flux à aircraft_status avec outputMode(\"append\") et activer la propriété de table delta.enableChangeDataFeed" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Delta streaming sink only appends rows (or rewrites the table in complete mode); it cannot update a row by key. foreachBatch runs a batch function on every micro-batch, and that function can run a Delta MERGE that updates the row of each existing TailNumber and inserts the new ones. Keep only the latest reading of each aircraft in the micro-batch before the merge, because a merge fails when several source rows match the same target row.
    fr: |
      Le récepteur de streaming Delta ne fait qu'ajouter des lignes (ou réécrire la table en mode complete) ; il ne peut pas mettre à jour une ligne par clé. foreachBatch exécute une fonction de lot sur chaque micro-lot, et cette fonction peut lancer un MERGE Delta qui met à jour la ligne de chaque TailNumber existant et insère les nouveaux. Ne gardez que le dernier relevé de chaque avion dans le micro-lot avant la fusion, car une fusion échoue quand plusieurs lignes sources correspondent à la même ligne cible.
  options:
    a: { en: "Update mode does not upsert into a Delta table: without an aggregation it writes the new rows, so aircraft_status would get one row per reading.", fr: "Le mode update n'effectue pas d'upsert dans une table Delta : sans agrégation, il écrit les nouvelles lignes, et aircraft_status recevrait une ligne par relevé." }
    c: { en: "dropDuplicates keeps the first row seen for each TailNumber and discards the later readings, so the table would never show the most recent reading.", fr: "dropDuplicates conserve la première ligne vue pour chaque TailNumber et écarte les relevés suivants : la table n'afficherait jamais le relevé le plus récent." }
    d: { en: "The change data feed records the changes made to a table; it does not turn appended rows into one row per aircraft.", fr: "Le flux de données modifiées enregistre les modifications d'une table ; il ne transforme pas les lignes ajoutées en une ligne par avion." }
references:
  - title: Use foreachBatch to write to arbitrary data sinks
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/foreach
  - title: Upsert into a Delta Lake table using merge
    url: https://learn.microsoft.com/en-us/azure/databricks/delta/merge
