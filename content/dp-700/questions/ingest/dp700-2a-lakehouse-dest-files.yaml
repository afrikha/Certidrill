id: dp700-2a-lakehouse-dest-files
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have an eventstream named **ES3** that sends about 200 events per second to a Lakehouse destination named **LakeDest**. The Delta table written by LakeDest contains a very large number of small Parquet files, and queries on the table are slow.

    Spark users must keep reading every event from the Delta table. Data in the table can be up to 10 minutes old.

    You need to reduce the number of files that LakeDest writes.

    What should you do?
  fr: |
    Vous disposez d'un flux d'événements nommé **ES3** qui envoie environ 200 événements par seconde à une destination Lakehouse nommée **LakeDest**. La table Delta écrite par LakeDest contient un très grand nombre de petits fichiers Parquet, et les requêtes sur la table sont lentes.

    Les utilisateurs Spark doivent continuer à lire chaque événement dans la table Delta. Les données de la table peuvent avoir jusqu'à 10 minutes de retard.

    Vous devez réduire le nombre de fichiers écrits par LakeDest.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an Aggregate operator before LakeDest that groups the events into 10-minute windows.", fr: "Ajouter avant LakeDest un opérateur Aggregate qui regroupe les événements en fenêtres de 10 minutes." } }
    - { id: b, text: { en: "Replace LakeDest with an Eventhouse destination that uses Direct ingestion.", fr: "Remplacer LakeDest par une destination Eventhouse qui utilise Direct ingestion." } }
    - { id: c, text: { en: "Run Optimize table in notebook from the Details pane of LakeDest every hour.", fr: "Exécuter Optimize table in notebook depuis le volet Details de LakeDest toutes les heures." } }
    - { id: d, text: { en: "In the advanced settings of LakeDest, increase Minimum rows and set Maximum duration to 10 minutes.", fr: "Dans les paramètres avancés de LakeDest, augmenter Minimum rows et définir Maximum duration sur 10 minutes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The advanced settings of a Lakehouse destination control how many rows are written per file (Minimum rows, 1 to 2 million) and how long rows accumulate before a file is written (Maximum duration, 1 minute to 2 hours). Larger values within the accepted latency produce fewer, larger files.
    fr: |
      Les paramètres avancés d'une destination Lakehouse contrôlent le nombre de lignes écrites par fichier (Minimum rows, de 1 à 2 millions) et la durée d'accumulation des lignes avant l'écriture d'un fichier (Maximum duration, de 1 minute à 2 heures). Des valeurs plus élevées, dans la latence acceptée, produisent des fichiers moins nombreux et plus gros.
  options:
    a: { en: "Aggregating replaces the events with window results, but Spark users must keep reading every event.", fr: "L'agrégation remplace les événements par des résultats de fenêtre, alors que les utilisateurs Spark doivent continuer à lire chaque événement." }
    b: { en: "An eventhouse doesn't write the Delta table that the Spark users read.", fr: "Un eventhouse n'écrit pas la table Delta que lisent les utilisateurs Spark." }
    c: { en: "Optimizing compacts the files after they're written, but LakeDest keeps writing as many small files.", fr: "L'optimisation compacte les fichiers après leur écriture, mais LakeDest continue d'écrire autant de petits fichiers." }
references:
  - title: Add a lakehouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-lakehouse
