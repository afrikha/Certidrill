id: dp700-2c-view-source
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam sends device events to Azure Event Hubs. A Spark job reads the events and appends them to a Delta table named device_events in a lakehouse named LH_Raw. You have an eventhouse named EH1.

    Operators need a KQL lookup that returns the latest event of each device. The lookup must stay up to date as events arrive and must not rescan the whole event history at each query.

    What should you do?
  fr: |
    Fabrikam envoie des événements d'appareils à Azure Event Hubs. Un travail Spark lit les événements et les ajoute à une table Delta nommée device_events dans un lakehouse nommé LH_Raw. Vous disposez d'un eventhouse nommé EH1.

    Les opérateurs ont besoin d'une recherche KQL qui renvoie le dernier événement de chaque appareil. La recherche doit rester à jour à mesure que les événements arrivent et ne doit pas relire tout l'historique des événements à chaque requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Create a OneLake shortcut in EH1 to device_events, and create a stored function that runs arg_max over external_table()."
        fr: "Créer un raccourci OneLake dans EH1 vers device_events, et créer une fonction stockée qui exécute arg_max sur external_table()."
    - id: b
      text:
        en: "Create a OneLake shortcut in EH1 to device_events, and create a materialized view that uses arg_max over the shortcut."
        fr: "Créer un raccourci OneLake dans EH1 vers device_events, et créer une vue matérialisée qui utilise arg_max sur le raccourci."
    - id: c
      text:
        en: "Ingest the events from Event Hubs into a native table of EH1 by using an eventstream, and create a materialized view that uses arg_max over that table."
        fr: "Ingérer les événements d'Event Hubs dans une table native d'EH1 avec un flux d'événements, et créer une vue matérialisée qui utilise arg_max sur cette table."
    - id: d
      text:
        en: "Enable OneLake availability on EH1, and query device_events from the KQL database by using arg_max."
        fr: "Activer la disponibilité OneLake sur EH1, et interroger device_events depuis la base de données KQL avec arg_max."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A materialized view keeps the latest record per device up to date, but its source must be a table of the database (or another materialized view). Ingesting the events into a native table lets the view process only the newly ingested records instead of the whole history.
    fr: |
      Une vue matérialisée maintient à jour le dernier enregistrement par appareil, mais sa source doit être une table de la base de données (ou une autre vue matérialisée). Ingérer les événements dans une table native permet à la vue de ne traiter que les enregistrements nouvellement ingérés au lieu de tout l'historique.
  options:
    b:
      en: |
        A shortcut is an external table, and materialized views aren't supported over external tables, even accelerated ones.
      fr: |
        Un raccourci est une table externe, et les vues matérialisées ne sont pas prises en charge sur des tables externes, même accélérées.
    a:
      en: |
        A stored function runs its query at each call, so every lookup rescans the event history through the shortcut.
      fr: |
        Une fonction stockée exécute sa requête à chaque appel : chaque recherche relit l'historique des événements par le raccourci.
    d:
      en: |
        OneLake availability exposes eventhouse tables to other engines; it doesn't make lakehouse tables queryable in KQL.
      fr: |
        La disponibilité OneLake expose les tables de l'eventhouse aux autres moteurs ; elle ne rend pas les tables du lakehouse interrogeables en KQL.
references:
  - title: Materialized views
    url: https://learn.microsoft.com/en-us/kusto/management/materialized-views/materialized-view-overview?view=microsoft-fabric
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
