id: dp700-2a-load-method-match
objective: "2.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Fabric workspace that contains a warehouse named **DW1**. You need to load four source tables into DW1 every hour. The solution must minimize development effort and must avoid reloading rows that didn't change, except where a requirement can't be met otherwise.

    Which loading method should you use for each table? To answer, drag the appropriate methods to the correct tables. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail Fabric qui contient un entrepôt nommé **DW1**. Vous devez charger quatre tables sources dans DW1 toutes les heures. La solution doit réduire au minimum l'effort de développement et éviter de recharger les lignes qui n'ont pas changé, sauf si une exigence ne peut pas être satisfaite autrement.

    Quelle méthode de chargement devez-vous utiliser pour chaque table ? Pour répondre, faites glisser les méthodes appropriées vers les tables correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: full, text: { en: "Copy job in full copy mode, with the Overwrite update method", fr: "Travail de copie en mode copie complète, avec la méthode de mise à jour Overwrite" } }
    - { id: cdc, text: { en: "Copy job in incremental copy mode based on CDC, with the Merge update method", fr: "Travail de copie en mode copie incrémentielle basée sur la CDC, avec la méthode de mise à jour Merge" } }
    - { id: wm, text: { en: "Copy job in incremental copy mode based on a watermark column, with the Merge update method", fr: "Travail de copie en mode copie incrémentielle basée sur une colonne de filigrane, avec la méthode de mise à jour Merge" } }
    - { id: dfg, text: { en: "Dataflow Gen2 incremental refresh", fr: "Actualisation incrémentielle de Dataflow Gen2" } }
    - { id: append, text: { en: "Copy job in full copy mode, with the Append update method", fr: "Travail de copie en mode copie complète, avec la méthode de mise à jour Append" } }
  targets:
    - id: countries
      text: { en: "Countries (250 rows) in Azure SQL Database: no column records changes, CDC isn't enabled, and rows deleted at the source must disappear from DW1", fr: "Countries (250 lignes) dans Azure SQL Database : aucune colonne n'enregistre les changements, la CDC n'est pas activée, et les lignes supprimées à la source doivent disparaître de DW1" }
    - id: orders
      text: { en: "Orders in Azure SQL Database: CDC is enabled, and inserts, updates and deletes must be applied to DW1", fr: "Orders dans Azure SQL Database : la CDC est activée, et les insertions, mises à jour et suppressions doivent être appliquées à DW1" }
    - id: products
      text: { en: "Products in an on-premises SQL Server database reached through a gateway: CDC can't be enabled, a LastModified column is updated on every insert and update, and rows are never deleted", fr: "Products dans une base de données SQL Server locale accessible via une passerelle : la CDC ne peut pas être activée, une colonne LastModified est mise à jour à chaque insertion et mise à jour, et aucune ligne n'est jamais supprimée" }
    - id: sales
      text: { en: "Sales history prepared by a Power Query query that analysts maintain: the query has OrderDate and ModifiedDate columns, and only the months that contain changes must be reloaded", fr: "Historique des ventes préparé par une requête Power Query que des analystes maintiennent : la requête comporte les colonnes OrderDate et ModifiedDate, et seuls les mois qui contiennent des changements doivent être rechargés" }
answer:
  mapping: { countries: full, orders: cdc, products: wm, sales: dfg }
explanation:
  correct:
    en: Without a change column or CDC, a small table is simply copied in full and overwritten, which also removes deleted rows. CDC-based incremental copy with Merge applies inserts, updates and deletes. When CDC isn't available, a watermark column captures inserts and updates, which is enough when rows are never deleted. Dataflow Gen2 incremental refresh reloads only the buckets (here months) whose change-detection column changed.
    fr: Sans colonne de changement ni CDC, une petite table est simplement copiée en entier et remplacée, ce qui retire aussi les lignes supprimées. La copie incrémentielle basée sur la CDC avec Merge applique les insertions, mises à jour et suppressions. Quand la CDC n'est pas disponible, une colonne de filigrane capture les insertions et les mises à jour, ce qui suffit lorsque aucune ligne n'est supprimée. L'actualisation incrémentielle de Dataflow Gen2 ne recharge que les compartiments (ici les mois) dont la colonne de détection des changements a changé.
  options:
    append: { en: "A full copy with Append adds every source row again at each run, so DW1 would contain duplicates and keep deleted rows.", fr: "Une copie complète avec Append ajoute de nouveau toutes les lignes sources à chaque exécution : DW1 contiendrait des doublons et garderait les lignes supprimées." }
references:
  - title: What is Copy job in Data Factory for Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
  - title: Incremental refresh in Dataflow Gen2
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-incremental-refresh
