id: dp700-2b-mirror-feature-match
objective: "2.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Your company plans to bring several data sources into a Fabric workspace named WS-Hub. The requirements for each source are shown in the answer area.

    You need to recommend a solution for each source. The solution must minimize development effort.

    What should you recommend? To answer, drag the appropriate solutions to the correct sources. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre société prévoit d'amener plusieurs sources de données dans un espace de travail Fabric nommé WS-Hub. Les exigences de chaque source figurent dans la zone de réponse.

    Vous devez recommander une solution pour chaque source. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous recommander ? Pour répondre, faites glisser les solutions appropriées vers les sources correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dbmirror, text: { en: "Database mirroring", fr: "Mise en miroir de base de données" } }
    - { id: metamirror, text: { en: "Metadata mirroring", fr: "Mise en miroir des métadonnées" } }
    - { id: openmirror, text: { en: "Open mirroring", fr: "Mise en miroir ouverte" } }
    - { id: shortcut, text: { en: "A OneLake shortcut", fr: "Un raccourci OneLake" } }
    - { id: copyjob, text: { en: "A copy job", fr: "Un travail de copie" } }
  targets:
    - id: t1
      text: { en: "An Oracle database: replicate its tables into OneLake as Delta tables and keep them in sync in near real time", fr: "Une base de données Oracle : répliquer ses tables dans OneLake sous forme de tables Delta et les garder synchronisées en quasi-temps réel" }
    - id: t2
      text: { en: "An Azure Databricks Unity Catalog: expose its catalogs, schemas and tables in Fabric while the data stays in the Databricks storage", fr: "Un catalogue Azure Databricks Unity Catalog : exposer ses catalogues, schémas et tables dans Fabric en laissant les données dans le stockage Databricks" }
    - id: t3
      text: { en: "A partner's proprietary application: push its inserts, updates and deletes into a mirrored database through public APIs", fr: "L'application propriétaire d'un partenaire : envoyer ses insertions, mises à jour et suppressions dans une base de données mise en miroir via des API publiques" }
    - id: t4
      text: { en: "An Amazon S3 bucket of Parquet files: read the files in place without replicating them", fr: "Un compartiment Amazon S3 de fichiers Parquet : lire les fichiers sur place sans les répliquer" }
answer:
  mapping: { t1: dbmirror, t2: metamirror, t3: openmirror, t4: shortcut }
explanation:
  correct:
    en: |
      Database mirroring replicates whole databases or tables, such as Oracle, and keeps them in sync, with changes published as often as every 15 seconds. Metadata mirroring syncs only the catalog of Azure Databricks and reads the data in place through shortcuts. Open mirroring lets any application write change data to a landing zone of a mirrored database. A shortcut reads S3 files without replication. A copy job copies on a schedule, which needs more setup than mirroring here.
    fr: |
      La mise en miroir de base de données réplique des bases ou des tables entières, comme Oracle, et les garde synchronisées, avec des changements publiés jusqu'à toutes les 15 secondes. La mise en miroir des métadonnées ne synchronise que le catalogue d'Azure Databricks et lit les données sur place via des raccourcis. La mise en miroir ouverte permet à toute application d'écrire des données de changement dans une zone d'atterrissage d'une base de données mise en miroir. Un raccourci lit les fichiers S3 sans réplication. Un travail de copie copie selon une planification, ce qui demande plus de configuration que la mise en miroir ici.
references:
  - title: What is Mirroring in Fabric?
    url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
  - title: Open mirroring in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/mirroring/open-mirroring
