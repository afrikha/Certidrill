stem:
  en: You use left joins from silver_subcategory and coalesce the names.
  fr: Vous utilisez des jointures externes gauches depuis silver_subcategory et appliquez coalesce aux noms.
body:
  solution:
    en: |
      You add the following code to the notebook and run it:

      ```python
      dim = (s.join(p, "SubcategoryID", "left")
              .join(c, "CategoryID", "left")
              .select("ProductID", "ProductName",
                      F.coalesce("SubcategoryName", F.lit("Unknown")).alias("Subcategory"),
                      F.coalesce("CategoryName", F.lit("Unknown")).alias("Category")))
      dim.write.mode("overwrite").saveAsTable("gold_dim_product")
      ```
    fr: |
      Vous ajoutez le code suivant au notebook et l'exécutez :

      ```python
      dim = (s.join(p, "SubcategoryID", "left")
              .join(c, "CategoryID", "left")
              .select("ProductID", "ProductName",
                      F.coalesce("SubcategoryName", F.lit("Unknown")).alias("Subcategory"),
                      F.coalesce("CategoryName", F.lit("Unknown")).alias("Category")))
      dim.write.mode("overwrite").saveAsTable("gold_dim_product")
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      A left join keeps every row of the left table, which is silver_subcategory here. The subcategories without products produce rows with a null ProductID, and the products whose SubcategoryID is null have no matching row on the left, so they are lost. The result doesn't contain exactly one row for each product.
    fr: |
      Une jointure externe gauche conserve toutes les lignes de la table de gauche, ici silver_subcategory. Les sous-catégories sans produit produisent des lignes avec un ProductID null, et les produits dont SubcategoryID est null n'ont aucune ligne correspondante à gauche : ils sont perdus. Le résultat ne contient pas exactement une ligne par produit.
