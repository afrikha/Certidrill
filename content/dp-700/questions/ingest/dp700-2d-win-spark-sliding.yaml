id: dp700-2d-win-spark-sliding
objective: "2.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric notebook that runs a Spark structured streaming query on a streaming DataFrame named `trades`, which has the `Symbol`, `TradeTime` and `Price` columns. The query contains the following aggregation.

    ```python
    stats = (trades
        .withWatermark("TradeTime", "5 minutes")
        .groupBy(F.window("TradeTime", "1 hour", "15 minutes"), "Symbol")
        .agg(F.avg("Price").alias("AvgPrice")))
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un notebook Fabric qui exécute une requête de streaming structuré Spark sur un DataFrame de streaming nommé `trades`, qui a les colonnes `Symbol`, `TradeTime` et `Price`. La requête contient l'agrégation suivante.

    ```python
    stats = (trades
        .withWatermark("TradeTime", "5 minutes")
        .groupBy(F.window("TradeTime", "1 hour", "15 minutes"), "Symbol")
        .agg(F.avg("Price").alias("AvgPrice")))
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Each window contains 15 minutes of trades.", fr: "Chaque fenêtre contient 15 minutes de transactions." }
    - id: b
      text: { en: "Each trade is counted in four windows.", fr: "Chaque transaction est comptée dans quatre fenêtres." }
    - id: c
      text: { en: "A window closes after 15 minutes without trades for the symbol.", fr: "Une fenêtre se ferme après 15 minutes sans transaction sur le symbole." }
    - id: d
      text: { en: "A new window starts every 15 minutes.", fr: "Une nouvelle fenêtre commence toutes les 15 minutes." }
    - id: e
      text: { en: "Each trade is counted in exactly one window.", fr: "Chaque transaction est comptée dans exactement une fenêtre." }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: "In `window(\"TradeTime\", \"1 hour\", \"15 minutes\")`, the second argument is the window duration and the third is the slide duration. Each window covers one hour and a new one starts every 15 minutes, so the windows overlap and each trade falls into 60 / 15 = 4 windows."
    fr: "Dans `window(\"TradeTime\", \"1 hour\", \"15 minutes\")`, le deuxième argument est la durée de la fenêtre et le troisième la durée de glissement. Chaque fenêtre couvre une heure et une nouvelle commence toutes les 15 minutes : les fenêtres se chevauchent et chaque transaction tombe dans 60 / 15 = 4 fenêtres."
  options:
    a:
      en: |-
        15 minutes is the slide between window starts; each window lasts one hour.
      fr: |-
        15 minutes est l'intervalle entre les débuts de fenêtre ; chaque fenêtre dure une heure.
    c:
      en: |-
        Closing after a period of inactivity is the behavior of session_window(), not of window() with a slide duration.
      fr: |-
        La fermeture après une période d'inactivité est le comportement de session_window(), pas de window() avec une durée de glissement.
    e:
      en: |-
        Only tumbling windows, where the slide equals the duration, place each event in exactly one window.
      fr: |-
        Seules les fenêtres bascules, dont le glissement est égal à la durée, placent chaque événement dans exactement une fenêtre.
references:
  - title: Apply watermarks to control data processing thresholds
    url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/watermarks
