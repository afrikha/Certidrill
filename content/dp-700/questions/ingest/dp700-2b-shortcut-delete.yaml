id: dp700-2b-shortcut-delete
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH-Ops. The Files folder of LH-Ops contains a shortcut named vendor_files that points to a folder named vendor in an Azure Data Lake Storage Gen2 account named stfabrikamlake. The vendor folder contains subfolders named 2025 and 2026.

    You have write permissions on the vendor folder in stfabrikamlake.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH-Ops. Le dossier Files de LH-Ops contient un raccourci nommé vendor_files qui pointe vers un dossier nommé vendor d'un compte Azure Data Lake Storage Gen2 nommé stfabrikamlake. Le dossier vendor contient les sous-dossiers 2025 et 2026.

    Vous disposez d'autorisations d'écriture sur le dossier vendor de stfabrikamlake.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you delete the vendor_files shortcut from LH-Ops, the vendor folder is deleted from stfabrikamlake.
        fr: Si vous supprimez le raccourci vendor_files de LH-Ops, le dossier vendor est supprimé de stfabrikamlake.
    - id: s2
      text:
        en: If you delete the folder vendor_files/2025 from LH-Ops, the 2025 folder is deleted from stfabrikamlake.
        fr: Si vous supprimez le dossier vendor_files/2025 de LH-Ops, le dossier 2025 est supprimé de stfabrikamlake.
    - id: s3
      text:
        en: You can create a shortcut that points to the vendor/2026 folder in a subfolder of the Tables folder of LH-Ops.
        fr: Vous pouvez créer un raccourci qui pointe vers le dossier vendor/2026 dans un sous-dossier du dossier Tables de LH-Ops.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Shortcuts don't support cascading deletes: deleting the shortcut removes only the shortcut object and the target stays unchanged. Deleting a file or folder inside a shortcut deletes it at the target when you have permission there, so vendor_files/2025 removes the 2025 folder from the storage account. In the Tables folder, shortcuts can be created only at the top level, never in a subfolder.
    fr: |
      Les raccourcis ne prennent pas en charge les suppressions en cascade : supprimer le raccourci ne supprime que l'objet raccourci et la cible reste inchangée. Supprimer un fichier ou un dossier à l'intérieur d'un raccourci le supprime dans la cible si vous y disposez de l'autorisation : vendor_files/2025 supprime le dossier 2025 du compte de stockage. Dans le dossier Tables, les raccourcis ne peuvent être créés qu'au niveau supérieur, jamais dans un sous-dossier.
references:
  - title: Unify data sources with OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
