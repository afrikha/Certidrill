stem:
  en: You use TIMESTAMP BY readingTime and a five-minute sliding window.
  fr: Vous utilisez TIMESTAMP BY readingTime et une fenêtre glissante de cinq minutes.
body:
  solution:
    en: |
      You complete the query with `FROM FurnaceInput TIMESTAMP BY readingTime` and `GROUP BY furnaceId, SlidingWindow(minute, 5)`.
    fr: |
      Vous complétez la requête avec `FROM FurnaceInput TIMESTAMP BY readingTime` et `GROUP BY furnaceId, SlidingWindow(minute, 5)`.
answer: { value: false }
explanation:
  correct:
    en: |
      A sliding window produces output only when an event enters or leaves the window, not on a fixed schedule. FurnaceAvg would receive a row at irregular times for each change instead of one row per furnace every minute. A fixed-size window that moves forward every minute is a hopping window.
    fr: |
      Une fenêtre glissante ne produit une sortie que lorsqu'un événement entre dans la fenêtre ou en sort, pas selon un rythme fixe. FurnaceAvg recevrait une ligne à des moments irréguliers à chaque changement, au lieu d'une ligne par four chaque minute. Une fenêtre de taille fixe qui avance chaque minute est une fenêtre récurrente.
references:
  - title: Introduction to Stream Analytics windowing functions
    url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-window-functions
