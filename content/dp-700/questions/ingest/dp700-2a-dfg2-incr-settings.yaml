id: dp700-2a-dfg2-incr-settings
objective: "2.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named **DF1** that loads a query named **Sales** into a table in a warehouse named **DW1**. The Sales query fully folds to the source and returns the following columns:

    - SalesID: the order line identifier
    - OrderDate: the date of the order
    - ModifiedDate: the date and time of the last insert or update of the row
    - Amount: the line amount

    An order line can be modified up to 60 days after its order date.

    You need to configure incremental refresh for Sales. The solution must meet the following requirements:

    - Load the orders of the last two years.
    - Reload only the periods that contain changed rows.
    - Use the smallest bucket size that respects the limit on the number of buckets per query.

    How should you complete the incremental refresh settings? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé **DF1** qui charge une requête nommée **Sales** dans une table d'un entrepôt nommé **DW1**. La requête Sales est entièrement repliée vers la source et renvoie les colonnes suivantes :

    - SalesID : l'identifiant de la ligne de commande
    - OrderDate : la date de la commande
    - ModifiedDate : la date et l'heure de la dernière insertion ou mise à jour de la ligne
    - Amount : le montant de la ligne

    Une ligne de commande peut être modifiée jusqu'à 60 jours après sa date de commande.

    Vous devez configurer l'actualisation incrémentielle de Sales. La solution doit satisfaire les exigences suivantes :

    - Charger les commandes des deux dernières années.
    - Recharger uniquement les périodes qui contiennent des lignes modifiées.
    - Utiliser la plus petite taille de compartiment qui respecte la limite du nombre de compartiments par requête.

    Comment devez-vous compléter les paramètres d'actualisation incrémentielle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Choose a DateTime column to filter by: [[filter]]

      Bucket size: [[bucket]]

      Only extract new data when the maximum value in this column changes: [[detect]]
    fr: |
      Colonne de filtrage (Choose a DateTime column to filter by) : [[filter]]

      Taille de compartiment (Bucket size) : [[bucket]]

      Colonne de détection des changements (Only extract new data when the maximum value in this column changes) : [[detect]]
  slots:
    - id: filter
      options:
        - { id: f_order, text: OrderDate }
        - { id: f_mod, text: ModifiedDate }
        - { id: f_id, text: SalesID }
    - id: bucket
      options:
        - { id: b_day, text: Day }
        - { id: b_week, text: Week }
        - { id: b_month, text: Month }
        - { id: b_quarter, text: Quarter }
    - id: detect
      options:
        - { id: d_mod, text: ModifiedDate }
        - { id: d_order, text: OrderDate }
        - { id: d_id, text: SalesID }
answer:
  values: { filter: f_order, bucket: b_month, detect: d_mod }
explanation:
  correct:
    en: |
      The filter column assigns each row to one bucket, so it must be a date that doesn't change: OrderDate. The change-detection column must change when a row is modified: ModifiedDate, compared bucket by bucket with its previous maximum. A query is limited to 50 buckets: two years are about 730 days or 104 weeks, but 24 months, so Month is the smallest valid size.
    fr: |
      La colonne de filtrage affecte chaque ligne à un compartiment : ce doit être une date qui ne change pas, OrderDate. La colonne de détection des changements doit changer quand une ligne est modifiée : ModifiedDate, dont le maximum est comparé compartiment par compartiment avec la valeur précédente. Une requête est limitée à 50 compartiments : deux ans représentent environ 730 jours ou 104 semaines, mais 24 mois, donc Month est la plus petite taille valide.
  options:
    f_mod: { en: "Filtering by ModifiedDate moves a row to another bucket each time it changes, which can miss changes or create duplicates; Learn warns against using the same column for filtering and change detection.", fr: "Filtrer sur ModifiedDate fait changer une ligne de compartiment à chaque modification, ce qui peut manquer des changements ou créer des doublons ; Learn déconseille d'utiliser la même colonne pour le filtrage et la détection." }
    b_day: { en: "Two years of daily buckets exceed the limit of 50 buckets per query.", fr: "Deux ans de compartiments quotidiens dépassent la limite de 50 compartiments par requête." }
    b_week: { en: "About 104 weekly buckets still exceed the limit of 50 per query.", fr: "Environ 104 compartiments hebdomadaires dépassent encore la limite de 50 par requête." }
    b_quarter: { en: "Quarters respect the limit, but Month is smaller and also respects it.", fr: "Les trimestres respectent la limite, mais Month est plus petit et la respecte aussi." }
    d_order: { en: "OrderDate doesn't change when a line is modified, so modified buckets would never be detected.", fr: "OrderDate ne change pas quand une ligne est modifiée : les compartiments modifiés ne seraient jamais détectés." }
references:
  - title: Incremental refresh in Dataflow Gen2
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-incremental-refresh
