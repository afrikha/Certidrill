id: dp700-2b-pipeline-lookup-limit
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a pipeline named PL-Meta that ingests files into a lakehouse. A Lookup activity named GetFiles queries a control table named ctl.FileList, which has two short columns, FileID and FilePath, and returns its rows to a ForEach activity that copies each file.

    ctl.FileList now contains 7,500 rows. The last run of PL-Meta succeeded, but only 5,000 files were copied.

    You need every file listed in ctl.FileList to be copied by each run.

    What should you do?
  fr: |
    Vous disposez d'un pipeline nommé PL-Meta qui ingère des fichiers dans un lakehouse. Une activité Lookup nommée GetFiles interroge une table de contrôle nommée ctl.FileList, qui possède deux colonnes courtes, FileID et FilePath, et renvoie ses lignes à une activité ForEach qui copie chaque fichier.

    ctl.FileList contient maintenant 7 500 lignes. La dernière exécution de PL-Meta a réussi, mais seuls 5 000 fichiers ont été copiés.

    Chaque exécution doit copier tous les fichiers indiqués dans ctl.FileList.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Split ctl.FileList into FileID ranges that each return fewer than 5,000 rows to their own Lookup and ForEach."
        fr: "Découper ctl.FileList en plages de FileID qui renvoient chacune moins de 5 000 lignes à leurs propres Lookup et ForEach."
    - id: b
      text:
        en: "Increase the timeout of the GetFiles activity so that it returns all the rows."
        fr: "Augmenter le délai d'expiration de l'activité GetFiles pour qu'elle renvoie toutes les lignes."
    - id: c
      text:
        en: "Increase the Batch count of the ForEach activity so that more items are processed."
        fr: "Augmenter le Batch count de l'activité ForEach pour que davantage d'éléments soient traités."
    - id: d
      text:
        en: "Select the Sequential option of the ForEach activity so that no item is skipped."
        fr: "Activer l'option Sequential de l'activité ForEach pour qu'aucun élément ne soit ignoré."
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Lookup activity returns up to 5,000 rows; a larger result set is truncated to the first 5,000 rows without an error, which explains the successful run. Querying the control table in ranges that each stay under 5,000 rows, and well under the 4 MB output limit, lets every file be processed.
    fr: |
      Une activité Lookup renvoie au maximum 5 000 lignes ; un jeu de résultats plus grand est tronqué aux 5 000 premières lignes sans erreur, ce qui explique la réussite de l'exécution. Interroger la table de contrôle par plages qui restent chacune sous 5 000 lignes, et largement sous la limite de sortie de 4 Mo, permet de traiter chaque fichier.
  options:
    c:
      en: |
        Batch count controls how many items run in parallel; the ForEach already received only 5,000 items.
      fr: |
        Batch count contrôle le nombre d'éléments exécutés en parallèle ; le ForEach n'a reçu que 5 000 éléments.
    b:
      en: |
        The activity didn't time out; the row limit truncated its result.
      fr: |
        L'activité n'a pas expiré ; c'est la limite de lignes qui a tronqué son résultat.
    d:
      en: |
        Sequential processing changes the order and parallelism, not the number of items returned by the Lookup.
      fr: |
        Le traitement séquentiel change l'ordre et le parallélisme, pas le nombre d'éléments renvoyés par l'activité Lookup.
references:
  - title: Lookup activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/lookup-activity
