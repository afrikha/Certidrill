id: dp700-2c-eventstream-facts
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum is evaluating Fabric eventstreams to capture payment events from Azure Event Hubs and deliver them to an eventhouse and a lakehouse.

    Which two statements about eventstreams are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum évalue les flux d'événements Fabric pour capturer des événements de paiement depuis Azure Event Hubs et les livrer à un eventhouse et à un lakehouse.

    Quelles sont les deux affirmations vraies sur les flux d'événements ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Events are delivered at least once, so a destination can receive the same event more than once.", fr: "Les événements sont livrés au moins une fois : une destination peut recevoir plusieurs fois le même événement." } }
    - { id: b, text: { en: "Filtering events before a destination requires the SQL operator.", fr: "Filtrer des événements avant une destination nécessite l'opérateur SQL." } }
    - { id: c, text: { en: "An eventstream can retain events for up to one year.", fr: "Un flux d'événements peut conserver les événements jusqu'à un an." } }
    - { id: d, text: { en: "One eventstream can send the same events to an eventhouse and to a lakehouse at the same time.", fr: "Un même flux d'événements peut envoyer les mêmes événements à un eventhouse et à un lakehouse en même temps." } }
    - { id: e, text: { en: "An eventstream accepts messages of up to 10 MB.", fr: "Un flux d'événements accepte des messages jusqu'à 10 Mo." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Eventstreams provide at-least-once delivery, so downstream processing must tolerate duplicates (for example with deduplication in the eventhouse). Several destinations can receive data from the same eventstream without interfering with each other.
    fr: |
      Les flux d'événements offrent une livraison au moins une fois : le traitement en aval doit tolérer les doublons (par exemple avec une déduplication dans l'eventhouse). Plusieurs destinations peuvent recevoir les données d'un même flux d'événements sans interférer entre elles.
  options:
    c:
      en: "Event retention in an eventstream is limited to 90 days."
      fr: "La rétention des événements dans un flux d'événements est limitée à 90 jours."
    e:
      en: "The maximum message size is 1 MB."
      fr: "La taille maximale d'un message est de 1 Mo."
    b:
      en: "The no-code Filter operator filters events; the SQL operator is an optional code-first alternative."
      fr: "L'opérateur sans code Filter filtre les événements ; l'opérateur SQL est une alternative facultative fondée sur le code."
references:
  - title: Microsoft Fabric Eventstreams Overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/overview
