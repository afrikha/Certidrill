id: dp700-2c-route-events
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Event Hubs namespace that receives telemetry from delivery trucks. You have a Fabric workspace that contains an eventhouse named EH_Fleet and an Activator item named ACT_Fleet.

    You need to send every telemetry event to a table in EH_Fleet and send the events whose EngineTemp value is greater than 110 to ACT_Fleet. The solution must not require writing code.

    What should you use?
  fr: |
    Contoso dispose d'un espace de noms Azure Event Hubs qui reçoit la télémétrie de camions de livraison. Vous disposez d'un espace de travail Fabric qui contient un eventhouse nommé EH_Fleet et un élément Activator nommé ACT_Fleet.

    Vous devez envoyer chaque événement de télémétrie vers une table d'EH_Fleet et envoyer les événements dont la valeur EngineTemp est supérieure à 110 vers ACT_Fleet. La solution ne doit pas nécessiter d'écrire du code.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "A Spark structured streaming notebook that reads Event Hubs and writes to EH_Fleet and ACT_Fleet"
        fr: "Un notebook de streaming structuré Spark qui lit Event Hubs et écrit dans EH_Fleet et ACT_Fleet"
    - id: b
      text:
        en: "An eventstream that has an Event Hubs source, an eventhouse destination, and a Filter operator before an Activator destination"
        fr: "Un flux d'événements avec une source Event Hubs, une destination eventhouse et un opérateur Filter avant une destination Activator"
    - id: c
      text:
        en: "A pipeline with a Copy activity that copies the events from Event Hubs to EH_Fleet every minute"
        fr: "Un pipeline avec une activité Copy qui copie les événements d'Event Hubs vers EH_Fleet toutes les minutes"
    - id: d
      text:
        en: "A Dataflow Gen2 that reads Event Hubs, filters on EngineTemp, and has two data destinations"
        fr: "Un Dataflow Gen2 qui lit Event Hubs, filtre sur EngineTemp et possède deux destinations de données"
answer: { optionId: b }
explanation:
  correct:
    en: |
      An eventstream captures events from sources such as Event Hubs, transforms them with no-code operators such as Filter, and routes them to several destinations at once, including an eventhouse and Activator. Each destination receives its own flow without interfering with the others.
    fr: |
      Un flux d'événements capture les événements de sources comme Event Hubs, les transforme avec des opérateurs sans code comme Filter et les route vers plusieurs destinations à la fois, notamment un eventhouse et Activator. Chaque destination reçoit son propre flux sans interférer avec les autres.
  options:
    a:
      en: |
        Spark structured streaming requires writing PySpark or Scala code, and the requirement is a no-code solution.
      fr: |
        Le streaming structuré Spark nécessite d'écrire du code PySpark ou Scala, alors que l'exigence est une solution sans code.
    c:
      en: |
        A scheduled Copy activity is a batch load: it adds latency and doesn't route the filtered events to Activator.
      fr: |
        Une activité Copy planifiée est un chargement par lots : elle ajoute de la latence et ne route pas les événements filtrés vers Activator.
    d:
      en: |
        Dataflow Gen2 runs batch refreshes; it isn't a streaming engine and doesn't send events to Activator.
      fr: |
        Dataflow Gen2 exécute des actualisations par lots ; ce n'est pas un moteur de diffusion en continu et il n'envoie pas d'événements à Activator.
references:
  - title: Microsoft Fabric Eventstreams Overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/overview
