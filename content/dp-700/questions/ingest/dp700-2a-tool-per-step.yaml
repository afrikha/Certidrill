id: dp700-2a-tool-per-step
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are designing three transformations in a Fabric workspace. Each transformation must use the tool that matches the store that holds the data and the skills of the team that maintains it.

    What should you use for each transformation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez trois transformations dans un espace de travail Fabric. Chaque transformation doit utiliser l'outil qui correspond au magasin qui contient les données et aux compétences de l'équipe qui la maintient.

    Que devez-vous utiliser pour chaque transformation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Parse raw syslog strings into typed columns as they're ingested into a KQL database, maintained by real-time analysts: [[s1]]

      Expire changed rows and insert new versions in an SCD type 2 dimension of a warehouse, maintained by SQL developers: [[s2]]

      Deduplicate daily change files and merge them into Delta tables of a lakehouse, maintained by Python developers: [[s3]]
    fr: |
      Analyser des chaînes syslog brutes en colonnes typées au moment de leur ingestion dans une base de données KQL, maintenu par des analystes temps réel : [[s1]]

      Expirer les lignes modifiées et insérer de nouvelles versions dans une dimension SCD de type 2 d'un entrepôt, maintenu par des développeurs SQL : [[s2]]

      Dédupliquer des fichiers de changements quotidiens et les fusionner dans des tables Delta d'un lakehouse, maintenu par des développeurs Python : [[s3]]
  slots:
    - id: s1
      options:
        - { id: s1_dfg, text: Dataflow Gen2 }
        - { id: s1_nb, text: { en: Notebook, fr: Notebook } }
        - { id: s1_tsql, text: T-SQL }
        - { id: s1_kql, text: KQL }
    - id: s2
      options:
        - { id: s2_dfg, text: Dataflow Gen2 }
        - { id: s2_nb, text: { en: Notebook, fr: Notebook } }
        - { id: s2_tsql, text: T-SQL }
        - { id: s2_kql, text: KQL }
    - id: s3
      options:
        - { id: s3_dfg, text: Dataflow Gen2 }
        - { id: s3_nb, text: { en: Notebook, fr: Notebook } }
        - { id: s3_tsql, text: T-SQL }
        - { id: s3_kql, text: KQL }
answer:
  values: { s1: s1_kql, s2: s2_tsql, s3: s3_nb }
explanation:
  correct:
    en: |
      In an eventhouse, parsing at ingestion time is done in KQL, with a function used by an update policy. Warehouse tables are transformed with set-based T-SQL, such as UPDATE and INSERT statements in stored procedures. Delta tables of a lakehouse maintained by Python developers are transformed in a notebook, where PySpark can deduplicate the changes and run a Delta MERGE.
    fr: |
      Dans un eventhouse, l'analyse au moment de l'ingestion se fait en KQL, avec une fonction utilisée par une stratégie de mise à jour. Les tables d'entrepôt se transforment en T-SQL ensembliste, par exemple avec des instructions UPDATE et INSERT dans des procédures stockées. Les tables Delta d'un lakehouse maintenues par des développeurs Python se transforment dans un notebook, où PySpark peut dédupliquer les changements et exécuter un MERGE Delta.
  options:
    s1_dfg: { en: "A dataflow runs on a schedule; it doesn't transform rows at the moment they're ingested into a KQL table.", fr: "Un dataflow s'exécute selon une planification ; il ne transforme pas les lignes au moment de leur ingestion dans une table KQL." }
    s2_nb: { en: "The team knows SQL and the data is in a warehouse: T-SQL avoids moving the data to Spark.", fr: "L'équipe connaît SQL et les données sont dans un entrepôt : T-SQL évite de déplacer les données vers Spark." }
    s3_tsql: { en: "T-SQL can't write to lakehouse Delta tables, whose SQL analytics endpoint is read-only.", fr: "T-SQL ne peut pas écrire dans les tables Delta d'un lakehouse, dont le point de terminaison d'analytique SQL est en lecture seule." }
references:
  - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
