id: dp700-sr2-furnace-window-3
objective: "2.3.7"
type: series_yesno
series: dp700-sr2-furnace-window
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You use a five-minute hopping window with a one-minute hop, without TIMESTAMP BY.
  fr: Vous utilisez une fenêtre récurrente de cinq minutes avec un saut d'une minute, sans TIMESTAMP BY.
body:
  solution:
    en: |
      You complete the query with `FROM FurnaceInput` and `GROUP BY furnaceId, HoppingWindow(minute, 5, 1)`.
    fr: |
      Vous complétez la requête avec `FROM FurnaceInput` et `GROUP BY furnaceId, HoppingWindow(minute, 5, 1)`.
answer: { value: false }
explanation:
  correct:
    en: |
      The window shape is right, but without `TIMESTAMP BY` an eventstream processes events by their arrival time. A reading that arrives two minutes late is counted in the window of its arrival, so the averages don't cover the readings taken during the previous five minutes. Event time must be set explicitly with `TIMESTAMP BY readingTime`.
    fr: |
      La forme de la fenêtre est correcte, mais sans `TIMESTAMP BY` un flux d'événements traite les événements selon leur heure d'arrivée. Un relevé qui arrive deux minutes en retard est compté dans la fenêtre de son arrivée : les moyennes ne portent pas sur les relevés effectués pendant les cinq minutes précédentes. L'heure de l'événement doit être définie explicitement avec `TIMESTAMP BY readingTime`.
references:
  - title: Process events by using a SQL operator
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/process-events-using-sql-code-editor
