id: dp700-2a-direct-ingestion
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains an eventstream named **ES1** and an eventhouse named **EH1**. ES1 receives JSON events from an Azure Event Hubs source.

    You need to store all the events in a KQL table in EH1 without transforming them. Analysts will transform the data later by using KQL. The solution must minimize development effort.

    What should you add to ES1?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un flux d'événements nommé **ES1** et un eventhouse nommé **EH1**. ES1 reçoit des événements JSON d'une source Azure Event Hubs.

    Vous devez stocker tous les événements dans une table KQL d'EH1 sans les transformer. Les analystes transformeront les données plus tard avec KQL. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous ajouter à ES1 ?
body:
  options:
    - { id: a, text: { en: "A Manage fields operator, followed by an Eventhouse destination that uses Event processing before ingestion", fr: "Un opérateur Manage fields, suivi d'une destination Eventhouse qui utilise Event processing before ingestion" } }
    - { id: b, text: { en: "A Lakehouse destination, followed by a OneLake shortcut to its Delta table in a KQL database of EH1", fr: "Une destination Lakehouse, suivie d'un raccourci OneLake vers sa table Delta dans une base de données KQL d'EH1" } }
    - { id: c, text: { en: "An Eventhouse destination that uses Direct ingestion, connected to the default stream", fr: "Une destination Eventhouse qui utilise Direct ingestion, connectée au flux par défaut" } }
    - { id: d, text: { en: "A Custom endpoint destination, read by an application that ingests the events into EH1", fr: "Une destination Custom endpoint, lue par une application qui ingère les événements dans EH1" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Direct ingestion stores the events as they arrive, with no processing, and it attaches to the default stream or a derived stream. You finish the setup from the destination in Live view by choosing or creating the KQL table and the mapping, and the analysts transform the data later in the eventhouse.
    fr: |
      Direct ingestion stocke les événements tels qu'ils arrivent, sans traitement, et se rattache au flux par défaut ou à un flux dérivé. Vous terminez la configuration depuis la destination en mode Live en choisissant ou en créant la table KQL et le mappage, et les analystes transforment ensuite les données dans l'eventhouse.
  options:
    a: { en: "An operator adds a processing step that isn't needed, because the events must be stored without transformation.", fr: "Un opérateur ajoute une étape de traitement inutile, car les événements doivent être stockés sans transformation." }
    b: { en: "This writes the events to a lakehouse first and adds a shortcut, which is more work and doesn't store the events in a KQL table.", fr: "Cette solution écrit d'abord les événements dans un lakehouse et ajoute un raccourci, ce qui demande plus de travail et ne stocke pas les événements dans une table KQL." }
    d: { en: "A custom application must be written and run to ingest the events, which doesn't minimize development effort.", fr: "Une application personnalisée doit être écrite et exécutée pour ingérer les événements, ce qui ne réduit pas l'effort de développement." }
references:
  - title: Add an Eventhouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-kql-database
