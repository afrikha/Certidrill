id: dp700-2c-native-features
objective: "2.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are deciding whether to ingest data into native tables of an eventhouse or to reference it through standard OneLake shortcuts (without query acceleration).

    Which option has each characteristic? To answer, drag the appropriate options to the correct characteristics. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez décider entre ingérer des données dans des tables natives d'un eventhouse ou les référencer par des raccourcis OneLake standard (sans accélération des requêtes).

    Quelle option présente chaque caractéristique ? Pour répondre, faites glisser les options appropriées vers les caractéristiques correspondantes. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: native, text: { en: "Native table", fr: "Table native" } }
    - { id: shortcut, text: { en: "Standard OneLake shortcut", fr: "Raccourci OneLake standard" } }
  targets:
    - { id: t1, text: { en: "Can be the source table of an update policy", fr: "Peut être la table source d'une stratégie de mise à jour" } }
    - { id: t2, text: { en: "The data stays in the source item; no second copy is stored", fr: "Les données restent dans l'élément source ; aucune seconde copie n'est stockée" } }
    - { id: t3, text: { en: "The eventhouse indexes the data, which gives the fastest queries", fr: "L'eventhouse indexe les données, ce qui donne les requêtes les plus rapides" } }
    - { id: t4, text: { en: "Queried by using the external_table() function", fr: "S'interroge avec la fonction external_table()" } }
answer:
  mapping: { t1: native, t2: shortcut, t3: native, t4: shortcut }
explanation:
  correct:
    en: |
      Ingested data is stored and indexed in the eventhouse, which gives the best query performance and supports update policies and materialized views. A standard shortcut leaves the data in its source, without a copy, and is queried as an external table with external_table(); queries are slower because of network calls to storage and the lack of indexes.
    fr: |
      Les données ingérées sont stockées et indexées dans l'eventhouse, ce qui offre les meilleures performances de requête et prend en charge les stratégies de mise à jour et les vues matérialisées. Un raccourci standard laisse les données dans leur source, sans copie, et s'interroge comme une table externe avec external_table() ; les requêtes sont plus lentes à cause des appels réseau vers le stockage et de l'absence d'index.
references:
  - title: Query acceleration for OneLake shortcuts - overview
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview
