id: dp700-2d-kql-policy-statements
objective: "2.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains two KQL databases named **DB-Ops** and **DB-Ref**. In DB-Ops, a table named **RawEvents** already contains 30 days of events. You create a function named `ParseEvents()` and an update policy on a table named **Events** in DB-Ops, with RawEvents as the source. No managed identity is configured for the policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient deux bases de données KQL nommées **DB-Ops** et **DB-Ref**. Dans DB-Ops, une table nommée **RawEvents** contient déjà 30 jours d'événements. Vous créez une fonction nommée `ParseEvents()` et une stratégie de mise à jour sur une table nommée **Events** de DB-Ops, avec RawEvents comme source. Aucune identité managée n'est configurée pour la stratégie.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          If ParseEvents() returns the right columns but in a different order from the columns of Events, the update policy fails.
        fr: |-
          Si ParseEvents() renvoie les bonnes colonnes mais dans un ordre différent de celui des colonnes d'Events, la stratégie de mise à jour échoue.
    - id: s2
      text:
        en: |-
          When the update policy is created, the 30 days of events already in RawEvents are transformed and written to Events.
        fr: |-
          Quand la stratégie de mise à jour est créée, les 30 jours d'événements déjà présents dans RawEvents sont transformés et écrits dans Events.
    - id: s3
      text:
        en: |-
          ParseEvents() can join RawEvents with a table of DB-Ref and still run as the query of the update policy.
        fr: |-
          ParseEvents() peut joindre RawEvents à une table de DB-Ref tout en restant exécutable comme requête de la stratégie de mise à jour.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      The schema of the policy function and of the target table must match in column types and order, and a mismatch is a common cause of update policy failures. An update policy runs when data is ingested into the source or extents are created in it; it doesn't process the data already stored when it's created. The function can reference another database only when the policy has a `ManagedIdentity` property and that identity has the viewer role on the referenced database.
    fr: |-
      Le schéma de la fonction de la stratégie et celui de la table cible doivent correspondre en types et en ordre de colonnes, et une différence est une cause fréquente d'échec des stratégies de mise à jour. Une stratégie de mise à jour s'exécute quand des données sont ingérées dans la source ou que des extents y sont créés ; elle ne traite pas les données déjà stockées au moment de sa création. La fonction ne peut référencer une autre base de données que si la stratégie a une propriété `ManagedIdentity` et que cette identité a le rôle viewer sur la base référencée.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
