stem:
  en: You use inner joins from silver_product and coalesce the names.
  fr: Vous utilisez des jointures internes depuis silver_product et appliquez coalesce aux noms.
body:
  solution:
    en: |
      You add the following code to the notebook and run it:

      ```python
      dim = (p.join(s, "SubcategoryID", "inner")
              .join(c, "CategoryID", "inner")
              .select("ProductID", "ProductName",
                      F.coalesce("SubcategoryName", F.lit("Unknown")).alias("Subcategory"),
                      F.coalesce("CategoryName", F.lit("Unknown")).alias("Category")))
      dim.write.mode("overwrite").saveAsTable("gold_dim_product")
      ```
    fr: |
      Vous ajoutez le code suivant au notebook et l'exécutez :

      ```python
      dim = (p.join(s, "SubcategoryID", "inner")
              .join(c, "CategoryID", "inner")
              .select("ProductID", "ProductName",
                      F.coalesce("SubcategoryName", F.lit("Unknown")).alias("Subcategory"),
                      F.coalesce("CategoryName", F.lit("Unknown")).alias("Category")))
      dim.write.mode("overwrite").saveAsTable("gold_dim_product")
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      An inner join keeps only the rows that match in both tables. A null SubcategoryID never matches, so the products without a subcategory are dropped from gold_dim_product, and the coalesce calls never produce Unknown. The table wouldn't contain one row for each product.
    fr: |
      Une jointure interne ne conserve que les lignes qui ont une correspondance dans les deux tables. Un SubcategoryID null ne correspond jamais : les produits sans sous-catégorie disparaissent de gold_dim_product, et les appels à coalesce ne produisent jamais Unknown. La table ne contiendrait pas une ligne par produit.
