id: dp700-2b-denorm-rebuild-table
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW-Retail that contains the staging tables stg.Product, stg.Subcategory and stg.Category, and a table named dbo.DimProduct. No semantic model uses dbo.DimProduct yet.

    Each night, after the staging tables are loaded, a stored procedure must rebuild dbo.DimProduct as one denormalized row per product by joining the three staging tables. Queries on dbo.DimProduct must not run the joins at query time.

    Which two T-SQL approaches can the procedure use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW-Retail qui contient les tables de préparation stg.Product, stg.Subcategory et stg.Category, ainsi qu'une table nommée dbo.DimProduct. Aucun modèle sémantique n'utilise encore dbo.DimProduct.

    Chaque nuit, après le chargement des tables de préparation, une procédure stockée doit reconstruire dbo.DimProduct à raison d'une ligne dénormalisée par produit en joignant les trois tables de préparation. Les requêtes sur dbo.DimProduct ne doivent pas exécuter les jointures au moment de la requête.

    Quelles sont les deux approches T-SQL que la procédure peut utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "CREATE VIEW dbo.vDimProduct with a SELECT that joins the staging tables", fr: "CREATE VIEW dbo.vDimProduct avec un SELECT qui joint les tables de préparation" } }
    - { id: b, text: { en: "TRUNCATE TABLE dbo.DimProduct, followed by INSERT INTO dbo.DimProduct with a SELECT that joins the staging tables", fr: "TRUNCATE TABLE dbo.DimProduct, suivi d'INSERT INTO dbo.DimProduct avec un SELECT qui joint les tables de préparation" } }
    - { id: c, text: { en: "DROP TABLE dbo.DimProduct, followed by CREATE TABLE dbo.DimProduct AS SELECT that joins the staging tables", fr: "DROP TABLE dbo.DimProduct, suivi de CREATE TABLE dbo.DimProduct AS SELECT qui joint les tables de préparation" } }
    - { id: d, text: { en: "INSERT INTO dbo.DimProduct with a SELECT that joins the staging tables, without removing the existing rows", fr: "INSERT INTO dbo.DimProduct avec un SELECT qui joint les tables de préparation, sans supprimer les lignes existantes" } }
    - { id: e, text: { en: "COPY INTO dbo.DimProduct with the three staging tables as the source", fr: "COPY INTO dbo.DimProduct avec les trois tables de préparation comme source" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Both approaches store the joined result in a table, so queries read the denormalized rows directly. TRUNCATE TABLE is supported in a warehouse and empties the table before INSERT...SELECT reloads it. CREATE TABLE AS SELECT creates and fills the table from the query after the old table is dropped; dropping a table would affect a semantic model that uses it, which isn't the case here.
    fr: |
      Les deux approches stockent le résultat de la jointure dans une table : les requêtes lisent directement les lignes dénormalisées. TRUNCATE TABLE est pris en charge dans un entrepôt et vide la table avant qu'INSERT...SELECT la recharge. CREATE TABLE AS SELECT crée et remplit la table à partir de la requête une fois l'ancienne table supprimée ; supprimer une table affecterait un modèle sémantique qui l'utilise, ce qui n'est pas le cas ici.
  options:
    a: { en: "A view runs its joins each time it's queried, which the requirement forbids.", fr: "Une vue exécute ses jointures à chaque interrogation, ce que l'exigence interdit." }
    d: { en: "Inserting without removing the existing rows duplicates every product each night.", fr: "Insérer sans supprimer les lignes existantes duplique chaque produit chaque nuit." }
    e: { en: "COPY INTO loads files from storage, not the result of a join between tables.", fr: "COPY INTO charge des fichiers depuis un stockage, pas le résultat d'une jointure entre tables." }
references:
  - title: T-SQL surface area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
  - title: Ingest data into the warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/ingest-data
