id: dp700-3c-microbatch-properties
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH_IoT that contains a Delta table named readings. A Spark job merges a micro-batch of sensor data into readings every two minutes. The table accumulates small files, and reads slow down between the weekly OPTIMIZE runs.

    You need to configure readings to meet the following requirements:

    - Each micro-batch must write fewer, larger files.
    - Fragmented partitions must be compacted automatically right after a write, without a separate scheduled job.

    Which two table properties should you set to true? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH_IoT qui contient une table Delta nommée readings. Un travail Spark fusionne un micro-lot de données de capteurs dans readings toutes les deux minutes. La table accumule de petits fichiers, et les lectures ralentissent entre les exécutions hebdomadaires d'OPTIMIZE.

    Vous devez configurer readings pour satisfaire les exigences suivantes :

    - Chaque micro-lot doit écrire des fichiers moins nombreux et plus grands.
    - Les partitions fragmentées doivent être compactées automatiquement juste après une écriture, sans travail planifié séparé.

    Quelles sont les deux propriétés de table à définir sur true ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "delta.autoOptimize.optimizeWrite" }
    - { id: b, text: "delta.parquet.vorder.enabled" }
    - { id: c, text: "delta.autoOptimize.autoCompact" }
    - { id: d, text: "delta.enableDeletionVectors" }
    - { id: e, text: "delta.targetFileSize.adaptive" }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Optimized write (delta.autoOptimize.optimizeWrite) bin-packs the data in memory before writing, so each MERGE writes fewer, larger files; it suits frequent small writes and operations such as MERGE. Auto compaction (delta.autoOptimize.autoCompact) checks the partitions after each write and runs a synchronous OPTIMIZE when they contain too many small files, so no separate job is needed.
    fr: |
      L'écriture optimisée (delta.autoOptimize.optimizeWrite) regroupe les données en mémoire avant l'écriture : chaque MERGE écrit des fichiers moins nombreux et plus grands ; elle convient aux petites écritures fréquentes et aux opérations comme MERGE. Le compactage automatique (delta.autoOptimize.autoCompact) vérifie les partitions après chaque écriture et exécute un OPTIMIZE synchrone quand elles contiennent trop de petits fichiers : aucun travail séparé n'est nécessaire.
  options:
    b:
      en: |
        V-Order changes the sorting, encoding and compression inside each Parquet file; it does not reduce the number of files.
      fr: |
        V-Order modifie le tri, l'encodage et la compression à l'intérieur de chaque fichier Parquet ; il ne réduit pas le nombre de fichiers.
    d:
      en: |
        Deletion vectors avoid rewriting whole files on updates and deletes; they do not compact small files.
      fr: |
        Les vecteurs de suppression évitent de réécrire des fichiers entiers lors des mises à jour et suppressions ; ils ne compactent pas les petits fichiers.
    e:
      en: |
        delta.targetFileSize.adaptive is where Fabric records the evaluated adaptive target size; it is not a switch that you set to true.
      fr: |
        delta.targetFileSize.adaptive est l'emplacement où Fabric enregistre la taille cible adaptative évaluée ; ce n'est pas un commutateur à définir sur true.
references:
  - title: Tune File Size
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/tune-file-size
  - title: Table Compaction
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/table-compaction
