id: dp700-3b-runaway-query
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse. The eventhouse contains a KQL database that has a table named Readings with 45 columns and a table named Devices.

    An analyst runs a query that joins the last 30 days of Readings with Devices. The analysis needs only the DeviceId, Timestamp, and Temperature columns of Readings. The query fails with the following error: "The HashJoin operator has exceeded the memory budget during evaluation. Results might be incorrect or incomplete (E_RUNAWAY_QUERY)."

    Which two actions can you perform to resolve the error? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse. L'eventhouse contient une base de données KQL qui comporte une table nommée Readings de 45 colonnes et une table nommée Devices.

    Un analyste exécute une requête qui joint les 30 derniers jours de Readings avec Devices. L'analyse n'a besoin que des colonnes DeviceId, Timestamp et Temperature de Readings. La requête échoue avec l'erreur suivante : « The HashJoin operator has exceeded the memory budget during evaluation. Results might be incorrect or incomplete (E_RUNAWAY_QUERY). »

    Quelles sont les deux actions qui permettent de résoudre l'erreur ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add `set notruncation;` before the query.", fr: "Ajouter `set notruncation;` avant la requête." } }
    - { id: b, text: { en: "Add `| project DeviceId, Timestamp, Temperature` to the Readings side before the join.", fr: "Ajouter `| project DeviceId, Timestamp, Temperature` du côté de Readings avant la jointure." } }
    - { id: c, text: { en: "Add `set servertimeout = 1h;` before the query.", fr: "Ajouter `set servertimeout = 1h;` avant la requête." } }
    - { id: d, text: { en: "Add `set maxmemoryconsumptionperiterator = 16106127360;` before the query.", fr: "Ajouter `set maxmemoryconsumptionperiterator = 16106127360;` avant la requête." } }
    - { id: e, text: { en: "Add `set truncationmaxrecords = 100000;` before the query.", fr: "Ajouter `set truncationmaxrecords = 100000;` avant la requête." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      E_RUNAWAY_QUERY means that an operator such as join exceeded its memory budget per node. Reducing the data that reaches the join, here by projecting only the three needed columns, lowers the memory the operator needs. Raising maxmemoryconsumptionperiterator (up to 30 GB) gives the operator a larger budget.
    fr: |
      E_RUNAWAY_QUERY signifie qu'un opérateur comme join a dépassé son budget mémoire par nœud. Réduire les données qui atteignent la jointure, ici en projetant uniquement les trois colonnes utiles, diminue la mémoire dont l'opérateur a besoin. Relever maxmemoryconsumptionperiterator (jusqu'à 30 Go) donne à l'opérateur un budget plus élevé.
  options:
    a: { en: "notruncation removes the limits on the result set size, not the memory limit of an operator.", fr: "notruncation supprime les limites de taille du jeu de résultats, pas la limite mémoire d'un opérateur." }
    c: { en: "servertimeout extends the execution time, but the error is about memory.", fr: "servertimeout prolonge la durée d'exécution, mais l'erreur porte sur la mémoire." }
    e: { en: "truncationmaxrecords limits the rows returned to the client, not the memory used by the join.", fr: "truncationmaxrecords limite les lignes renvoyées au client, pas la mémoire utilisée par la jointure." }
references:
  - title: Query limits
    url: https://learn.microsoft.com/en-us/kusto/concepts/query-limits?view=microsoft-fabric
