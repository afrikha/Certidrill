id: dp700-cs3a-vibration-alert
objective: "3.1.4"
type: single
caseStudy: dp700-cs3a-proseware
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the monitoring requirement for turbine vibration. What should you create?
  fr: |
    Vous devez satisfaire l'exigence de supervision relative à la vibration des éoliennes. Que devez-vous créer ?
body:
  options:
    - id: a
      text:
        en: "An Azure Monitor metric alert rule on the incoming messages of turbine-telemetry, with an action group that posts to Teams"
        fr: "Une règle d'alerte de métrique Azure Monitor sur les messages entrants de turbine-telemetry, avec un groupe d'actions qui publie dans Teams"
    - id: b
      text:
        en: "A tile in Ops-Live with conditional formatting that highlights the turbines whose VibrationMmS is above 12"
        fr: "Une vignette dans Ops-Live avec une mise en forme conditionnelle qui met en évidence les éoliennes dont VibrationMmS dépasse 12"
    - id: c
      text:
        en: "A scheduled notebook that queries TurbineDB every minute and calls the Teams API for each turbine above the threshold"
        fr: "Un notebook planifié qui interroge TurbineDB chaque minute et appelle l'API Teams pour chaque éolienne au-dessus du seuil"
    - id: d
      text:
        en: "An Activator rule on the eventstream, with TurbineId as the object ID, the condition VibrationMmS above 12, and a Teams message action"
        fr: "Une règle Activator sur le flux d'événements, avec TurbineId comme ID d'objet, la condition VibrationMmS supérieure à 12 et une action de message Teams"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Fabric Activator subscribes to the eventstream and evaluates its rules as events arrive. Grouping the events by the TurbineId object key evaluates the condition separately for each turbine, and the rule sends a Teams message without any custom code.
    fr: |
      Fabric Activator s'abonne au flux d'événements et évalue ses règles à l'arrivée des événements. Le regroupement des événements par la clé d'objet TurbineId évalue la condition séparément pour chaque éolienne, et la règle envoie un message Teams sans aucun code personnalisé.
  options:
    a:
      en: |
        Event Hubs metrics count messages; they do not evaluate the VibrationMmS value inside each event or evaluate each turbine separately.
      fr: |
        Les métriques Event Hubs comptent les messages ; elles n'évaluent ni la valeur VibrationMmS de chaque événement ni chaque éolienne séparément.
    b:
      en: |
        Conditional formatting only changes how the tile looks; it sends no message to the on-call engineer.
      fr: |
        La mise en forme conditionnelle change seulement l'apparence de la vignette ; elle n'envoie aucun message à l'ingénieur d'astreinte.
    c:
      en: |
        A notebook that calls the Teams API is custom code, which the requirement forbids.
      fr: |
        Un notebook qui appelle l'API Teams est du code personnalisé, ce que l'exigence interdit.
references:
  - title: What is Fabric Activator?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-introduction
