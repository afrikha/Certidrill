id: dp700-3a-ingest-monitor-yesno
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum ingests data into Fabric by using pipelines, copy jobs and an eventstream named ES_Sensors. Data engineers use the Job runs page of the Monitor hub and the monitoring tabs of the eventstream editor.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum ingère des données dans Fabric à l'aide de pipelines, de tâches de copie et d'un flux d'événements (eventstream) nommé ES_Sensors. Les ingénieurs données utilisent la page Job runs du hub de surveillance et les onglets de supervision de l'éditeur du flux d'événements.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: While a pipeline run is in progress, the Job runs page updates its status automatically until the run ends.
        fr: Pendant qu'une exécution de pipeline est en cours, la page Job runs met automatiquement à jour son statut jusqu'à la fin de l'exécution.
    - id: s2
      text:
        en: When the list of items spans several pages, the keyword search box of the Job runs page only finds items loaded on the current page.
        fr: Quand la liste des éléments s'étend sur plusieurs pages, la zone de recherche par mot-clé de la page Job runs ne trouve que les éléments chargés dans la page courante.
    - id: s3
      text:
        en: A user who has the Viewer role on the workspace can open the Data insights and Runtime logs tabs of ES_Sensors.
        fr: Un utilisateur qui a le rôle Viewer sur l'espace de travail peut ouvrir les onglets Data insights et Runtime logs de ES_Sensors.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The Job runs page retrieves job data when it loads and doesn't update continuously: you select the reload icon to see the latest status. Keyword search only checks the items loaded on the current page, unlike the drop-down filters, so narrow the list with the filters first. Monitoring an eventstream requires Viewer or higher permissions on its workspace.
    fr: |
      La page Job runs récupère les données des tâches à son chargement et ne s'actualise pas en continu : vous sélectionnez l'icône d'actualisation pour voir le dernier statut. La recherche par mot-clé ne porte que sur les éléments chargés dans la page courante, contrairement aux filtres déroulants : réduisez d'abord la liste avec les filtres. La supervision d'un flux d'événements demande au moins le rôle Viewer sur son espace de travail.
references:
  - title: Monitor job runs in the Monitor hub (preview)
    url: https://learn.microsoft.com/en-us/fabric/admin/monitoring-hub-jobs
  - title: Monitor the status and performance of an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor
