id: dp700-3a-ingest-monitor-yesno
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum ingests data into Fabric by using pipelines, copy jobs and an eventstream named ES_Sensors. ES_Sensors reads events from an Azure Event Hubs source. Data engineers use the Monitoring hub and the monitoring tabs of the eventstream editor.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum ingère des données dans Fabric à l'aide de pipelines, de tâches de copie et d'un flux d'événements (eventstream) nommé ES_Sensors. ES_Sensors lit des événements depuis une source Azure Event Hubs. Les ingénieurs données utilisent le hub de surveillance (Monitoring hub) et les onglets de supervision de l'éditeur du flux d'événements.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In the Monitoring hub, the data engineers can filter the pipeline runs by the user who submitted them.
        fr: Dans le hub de surveillance, les ingénieurs données peuvent filtrer les exécutions de pipelines selon l'utilisateur qui les a soumises.
    - id: s2
      text:
        en: The Data insights tab of the Azure Event Hubs source node of ES_Sensors shows the Connector Errors Logged metric.
        fr: L'onglet Data insights du nœud source Azure Event Hubs de ES_Sensors affiche la métrique Connector Errors Logged.
    - id: s3
      text:
        en: A user who has the Viewer role on the workspace can open the Data insights and Runtime logs tabs of ES_Sensors.
        fr: Un utilisateur qui a le rôle Viewer sur l'espace de travail peut ouvrir les onglets Data insights et Runtime logs de ES_Sensors.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The filter pane of the Monitoring hub filters pipeline runs by Status, Item Type, Start Time, Submitter and Location. An Azure Event Hubs node shows metrics such as Input events, Backlogged input events and Runtime errors; the Connector metrics belong to streaming connector sources such as Apache Kafka or Google Cloud Pub/Sub. Monitoring an eventstream requires Viewer or higher permissions on its workspace.
    fr: |
      Le volet de filtres du hub de surveillance filtre les exécutions de pipelines par Status, Item Type, Start Time, Submitter et Location. Un nœud Azure Event Hubs affiche des métriques comme Input events, Backlogged input events et Runtime errors ; les métriques Connector sont celles des sources de connecteur de streaming comme Apache Kafka ou Google Cloud Pub/Sub. La supervision d'un flux d'événements demande au moins le rôle Viewer sur son espace de travail.
references:
  - title: How to monitor pipeline runs in Monitoring hub
    url: https://learn.microsoft.com/en-us/fabric/data-factory/monitoring-hub-pipeline-runs
  - title: Monitor the status and performance of an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor
