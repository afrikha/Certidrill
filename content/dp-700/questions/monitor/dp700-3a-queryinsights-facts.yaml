id: dp700-3a-queryinsights-facts
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware transforms data by using T-SQL in a warehouse named DW_Retail and by querying the SQL analytics endpoint of a lakehouse named LH_Retail. The data team plans to use query insights to analyze the transformation queries.

    Which two statements about query insights are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware transforme des données en T-SQL dans un entrepôt nommé DW_Retail et en interrogeant le point de terminaison d'analytique SQL d'un lakehouse nommé LH_Retail. L'équipe données prévoit d'utiliser Query insights pour analyser les requêtes de transformation.

    Quelles sont les deux affirmations vraies concernant Query insights ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The history of completed queries is kept for 30 days.", fr: "L'historique des requêtes terminées est conservé 30 jours." } }
    - { id: b, text: { en: "exec_requests_history also lists the queries that are still running.", fr: "exec_requests_history liste aussi les requêtes encore en cours d'exécution." } }
    - { id: c, text: { en: "A user who has the Viewer role on the workspace can query the views.", fr: "Un utilisateur qui a le rôle Viewer sur l'espace de travail peut interroger les vues." } }
    - { id: d, text: { en: "The views are available in the SQL analytics endpoint of LH_Retail.", fr: "Les vues sont disponibles dans le point de terminaison d'analytique SQL de LH_Retail." } }
    - { id: e, text: { en: "System queries run by the service are stored with the user queries.", fr: "Les requêtes système exécutées par le service sont stockées avec les requêtes des utilisateurs." } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Query insights applies to warehouses and SQL analytics endpoints, in the queryinsights schema. It keeps 30 days of history for completed requests and sessions run in a user's context.
    fr: |
      Query insights s'applique aux entrepôts et aux points de terminaison d'analytique SQL, dans le schéma queryinsights. Il conserve 30 jours d'historique des requêtes et des sessions terminées exécutées dans le contexte d'un utilisateur.
  options:
    b:
      en: |
        exec_requests_history returns information about completed requests only.
      fr: |
        exec_requests_history renvoie uniquement des informations sur les requêtes terminées.
    c:
      en: |
        Using query insights requires the Contributor role or higher on the workspace.
      fr: |
        L'utilisation de Query insights demande le rôle Contributor ou supérieur sur l'espace de travail.
    e:
      en: |
        Only queries run in a user's context are included; system queries aren't stored.
      fr: |
        Seules les requêtes exécutées dans le contexte d'un utilisateur sont incluses ; les requêtes système ne sont pas stockées.
references:
  - title: Query insights in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights
