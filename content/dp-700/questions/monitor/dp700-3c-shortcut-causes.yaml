id: dp700-3c-shortcut-causes
objective: "3.2.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named Lakehouse1. Lakehouse1 has three shortcuts that report problems:

    - **sc_inventory** was created at the top level of the Tables folder. It targets a folder in an Azure Data Lake Storage Gen2 account that contains only Parquet files. It appears as an unidentified folder instead of a table.
    - **sc_returns** is in the Files folder and worked yesterday. Today, every read through sc_returns fails because the path cannot be found. Nobody changed the shortcut.
    - **sc_hr** is a shortcut to a table of a lakehouse named LH_HR in another workspace. User4 is a Viewer of the workspace of Lakehouse1 and receives an access denied error when reading sc_hr from a notebook.

    You need to identify the cause of each problem.

    What should you identify for each shortcut? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé Lakehouse1. Lakehouse1 possède trois raccourcis qui présentent des problèmes :

    - **sc_inventory** a été créé au premier niveau du dossier Tables. Il cible un dossier d'un compte Azure Data Lake Storage Gen2 qui ne contient que des fichiers Parquet. Il apparaît comme un dossier non identifié au lieu d'une table.
    - **sc_returns** se trouve dans le dossier Files et fonctionnait hier. Aujourd'hui, chaque lecture par sc_returns échoue parce que le chemin est introuvable. Personne n'a modifié le raccourci.
    - **sc_hr** est un raccourci vers une table d'un lakehouse nommé LH_HR, situé dans un autre espace de travail. User4 est Viewer de l'espace de travail de Lakehouse1 et reçoit une erreur d'accès refusé en lisant sc_hr depuis un notebook.

    Vous devez identifier la cause de chaque problème.

    Que devez-vous identifier pour chaque raccourci ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      sc_inventory: [[c1]]

      sc_returns: [[c2]]

      sc_hr: [[c3]]
    fr: |
      sc_inventory : [[c1]]

      sc_returns : [[c2]]

      sc_hr : [[c3]]
  slots:
    - id: c1
      options:
        - { id: delta, text: { en: "The target data is not in Delta format", fr: "Les données cibles ne sont pas au format Delta" } }
        - { id: moved, text: { en: "The target path was moved, renamed, or deleted", fr: "Le chemin cible a été déplacé, renommé ou supprimé" } }
        - { id: perm, text: { en: "The user lacks read permission on the target", fr: "L'utilisateur n'a pas l'autorisation de lecture sur la cible" } }
        - { id: conn, text: { en: "The user lacks permission on a cloud connection", fr: "L'utilisateur n'a pas d'autorisation sur une connexion cloud" } }
    - id: c2
      options:
        - { id: delta, text: { en: "The target data is not in Delta format", fr: "Les données cibles ne sont pas au format Delta" } }
        - { id: moved, text: { en: "The target path was moved, renamed, or deleted", fr: "Le chemin cible a été déplacé, renommé ou supprimé" } }
        - { id: perm, text: { en: "The user lacks read permission on the target", fr: "L'utilisateur n'a pas l'autorisation de lecture sur la cible" } }
        - { id: conn, text: { en: "The user lacks permission on a cloud connection", fr: "L'utilisateur n'a pas d'autorisation sur une connexion cloud" } }
    - id: c3
      options:
        - { id: delta, text: { en: "The target data is not in Delta format", fr: "Les données cibles ne sont pas au format Delta" } }
        - { id: moved, text: { en: "The target path was moved, renamed, or deleted", fr: "Le chemin cible a été déplacé, renommé ou supprimé" } }
        - { id: perm, text: { en: "The user lacks read permission on the target", fr: "L'utilisateur n'a pas l'autorisation de lecture sur la cible" } }
        - { id: conn, text: { en: "The user lacks permission on a cloud connection", fr: "L'utilisateur n'a pas d'autorisation sur une connexion cloud" } }
answer:
  values: { c1: delta, c2: moved, c3: perm }
explanation:
  correct:
    en: |
      A shortcut in Tables is discovered as a table only when its target contains a Delta table; plain Parquet files are not recognized. A shortcut breaks when its target path is moved, renamed or deleted, even if the shortcut itself is unchanged. For an internal shortcut, OneLake authorizes the read with the identity of the calling user, so User4 needs read access to the target table in LH_HR; cloud connections are used only by external shortcuts.
    fr: |
      Un raccourci dans Tables n'est découvert comme table que si sa cible contient une table Delta ; de simples fichiers Parquet ne sont pas reconnus. Un raccourci est cassé quand son chemin cible est déplacé, renommé ou supprimé, même si le raccourci lui-même n'a pas changé. Pour un raccourci interne, OneLake autorise la lecture avec l'identité de l'utilisateur appelant : User4 a besoin d'un accès en lecture à la table cible de LH_HR ; les connexions cloud ne servent qu'aux raccourcis externes.
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
