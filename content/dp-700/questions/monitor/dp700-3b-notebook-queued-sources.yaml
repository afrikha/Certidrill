id: dp700-3b-notebook-queued-sources
objective: "3.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that is assigned to an F16 capacity. At peak hours, all the Spark VCores of the capacity, including bursting, are in use. The capacity isn't throttled, and queueing uses the default behavior.

    During peak hours, which two job submissions are queued and retried automatically instead of failing with an HTTP 430 error?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 affecté à une capacité F16. Aux heures de pointe, tous les VCores Spark de la capacité, bursting compris, sont utilisés. La capacité n'est pas limitée (throttled) et la mise en file d'attente utilise le comportement par défaut.

    Aux heures de pointe, quelles sont les deux soumissions de tâches qui sont mises en file d'attente et relancées automatiquement au lieu d'échouer avec une erreur HTTP 430 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A notebook cell that a user runs interactively", fr: "Une cellule de notebook qu'un utilisateur exécute de manière interactive" } }
    - { id: b, text: { en: "A notebook run by a Notebook activity in a pipeline", fr: "Un notebook exécuté par une activité Notebook dans un pipeline" } }
    - { id: c, text: { en: "A notebook run submitted through the notebook public API", fr: "Une exécution de notebook soumise via l'API publique des notebooks" } }
    - { id: d, text: { en: "A Spark job definition run by a schedule", fr: "Une définition de tâche Spark exécutée par une planification" } }
    - { id: e, text: { en: "A Load to Table action started from the lakehouse explorer", fr: "Une action Load to Table lancée depuis l'explorateur du lakehouse" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      With queueing, jobs triggered from pipelines, the scheduler and Spark job definitions wait in a FIFO queue and are retried automatically when cores become available. They expire 24 hours after submission. The queue limit of an F16 is 16 jobs.
    fr: |
      Avec la mise en file d'attente, les tâches déclenchées par les pipelines, le planificateur et les définitions de tâches Spark attendent dans une file FIFO et sont relancées automatiquement quand des cœurs se libèrent. Elles expirent 24 heures après leur soumission. La limite de file d'attente d'une F16 est de 16 tâches.
  options:
    a: { en: "Interactive notebook jobs aren't queued; they're rejected with HTTP 430.", fr: "Les tâches de notebook interactives ne sont pas mises en file d'attente ; elles sont rejetées avec HTTP 430." }
    c: { en: "Notebook jobs submitted through the notebook public API aren't queued either.", fr: "Les tâches de notebook soumises via l'API publique des notebooks ne sont pas non plus mises en file d'attente." }
    e: { en: "Lakehouse jobs such as Load to Table are rejected with HTTP 430 when the capacity is full.", fr: "Les tâches de lakehouse comme Load to Table sont rejetées avec HTTP 430 quand la capacité est pleine." }
references:
  - title: Concurrency limits and queueing in Apache Spark for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-job-concurrency-and-queueing
