id: dp700-3b-eventstream-config
objective: "3.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventstream named ES_Meters and an eventhouse named EH1. ES_Meters has a custom endpoint source that receives up to 60 MB/s at peak hours. A Group by operator aggregates the events over one-minute tumbling windows, and the output must be written to EH1.

    You are fixing the following issues:

    - At peak hours, the backlog of ES_Meters grows because Event throughput is set to Low.
    - The EH1 destination receives the raw events instead of the aggregated output.
    - Each night, you deactivate the EH1 destination for 10 minutes. After reactivation, the destination must continue from the point where it was deactivated.

    How should you configure ES_Meters? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventstream nommé ES_Meters et un eventhouse nommé EH1. ES_Meters possède une source de point de terminaison personnalisé qui reçoit jusqu'à 60 Mo/s aux heures de pointe. Un opérateur Group by agrège les événements sur des fenêtres bascule (tumbling) d'une minute, et la sortie doit être écrite dans EH1.

    Vous corrigez les problèmes suivants :

    - Aux heures de pointe, le backlog d'ES_Meters augmente car Event throughput est défini sur Low.
    - La destination EH1 reçoit les événements bruts au lieu de la sortie agrégée.
    - Chaque nuit, vous désactivez la destination EH1 pendant 10 minutes. Après la réactivation, la destination doit reprendre à partir du moment où elle a été désactivée.

    Comment devez-vous configurer ES_Meters ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Event throughput: [[thr]]

      Ingestion mode of the EH1 destination: [[mode]]

      Resume option after the nightly deactivation: [[res]]
    fr: |
      Event throughput : [[thr]]

      Mode d'ingestion de la destination EH1 : [[mode]]

      Option de reprise après la désactivation nocturne : [[res]]
  slots:
    - id: thr
      options:
        - { id: low, text: Low }
        - { id: medium, text: Medium }
        - { id: high, text: High }
    - id: mode
      options:
        - { id: direct, text: Direct ingestion }
        - { id: processing, text: Event processing before ingestion }
    - id: res
      options:
        - { id: now, text: Now }
        - { id: custom, text: Custom time }
        - { id: last, text: When streaming was last stopped }
answer:
  values: { thr: medium, mode: processing, res: last }
explanation:
  correct:
    en: |
      The Medium throughput level covers 10 to 100 MB/s, which fits a peak of 60 MB/s. Direct ingestion sends the events to the eventhouse without processing; output from operators such as Group by requires the Event processing before ingestion mode. That mode supports pause and resume, and When streaming was last stopped resumes from the point where the destination was deactivated.
    fr: |
      Le niveau de débit Medium couvre 10 à 100 Mo/s, ce qui convient à un pic de 60 Mo/s. Direct ingestion envoie les événements à l'eventhouse sans traitement ; la sortie d'opérateurs comme Group by nécessite le mode Event processing before ingestion. Ce mode prend en charge la pause et la reprise, et When streaming was last stopped reprend à partir du moment où la destination a été désactivée.
  options:
    low: { en: "Low is meant for less than 10 MB/s and causes the current backlog.", fr: "Low correspond à moins de 10 Mo/s et provoque le backlog actuel." }
    high: { en: "High is meant for more than 100 MB/s; Medium already covers 60 MB/s.", fr: "High correspond à plus de 100 Mo/s ; Medium couvre déjà 60 Mo/s." }
    direct: { en: "Direct ingestion takes the unprocessed stream, which is why EH1 receives raw events, and it doesn't support pause and resume.", fr: "Direct ingestion prend le flux non traité, ce qui explique les événements bruts dans EH1, et ne prend pas en charge la pause et la reprise." }
    now: { en: "Now resumes from the current time and skips the events of the 10-minute gap.", fr: "Now reprend à l'heure actuelle et ignore les événements des 10 minutes d'interruption." }
    custom: { en: "Custom time resumes from a timestamp that you choose; resuming from the stop point is the purpose of When streaming was last stopped.", fr: "Custom time reprend à un horodatage que vous choisissez ; reprendre au point d'arrêt est le rôle de When streaming was last stopped." }
references:
  - title: Configure Settings for a Fabric Eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/configure-settings
  - title: Add an Eventhouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-kql-database
