id: dp700-3b-or-failure-expression
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Daily.

    In PL_Daily, two Copy data activities named Copy Orders and Copy Customers run in parallel. Both are connected to an If Condition activity named Check Failures by an Upon Completion dependency. The True activities of Check Failures contain a Script activity named Log Error.

    You need Log Error to run when at least one of the two copy activities fails.

    How should you complete the expression of Check Failures? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Daily.

    Dans PL_Daily, deux activités Copy data nommées Copy Orders et Copy Customers s'exécutent en parallèle. Elles sont toutes deux reliées à une activité If Condition nommée Check Failures par une dépendance Upon Completion. Les activités True de Check Failures contiennent une activité Script nommée Log Error.

    Log Error doit s'exécuter quand au moins une des deux activités de copie échoue.

    Comment devez-vous compléter l'expression de Check Failures ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    @[[fn]](
        equals(activity('Copy Orders').Status, '[[v1]]'),
        equals(activity('Copy Customers').Status, '[[v2]]')
    )
  slots:
    - id: fn
      options:
        - { id: and, text: and }
        - { id: or, text: or }
        - { id: coalesce, text: coalesce }
        - { id: union, text: union }
    - id: v1
      options:
        - { id: failure1, text: Failure }
        - { id: error1, text: Error }
        - { id: failed1, text: Failed }
        - { id: skipped1, text: Skipped }
    - id: v2
      options:
        - { id: failed2, text: Failed }
        - { id: failure2, text: Failure }
        - { id: skipped2, text: Skipped }
        - { id: error2, text: Error }
answer:
  values: { fn: or, v1: failed1, v2: failed2 }
explanation:
  correct:
    en: "The Status property of an activity returns Succeeded or Failed, so each comparison tests for 'Failed'. or() returns true when either comparison is true, which runs the True activities when at least one copy fails. The Upon Completion dependencies make Check Failures run whatever the outcome of the copies."
    fr: "La propriété Status d'une activité renvoie Succeeded ou Failed : chaque comparaison teste donc 'Failed'. or() renvoie true dès qu'une des comparaisons est vraie, ce qui exécute les activités True quand au moins une copie échoue. Les dépendances Upon Completion font exécuter Check Failures quel que soit le résultat des copies."
  options:
    and: { en: "and() is true only when both copies fail.", fr: "and() n'est vrai que si les deux copies échouent." }
    coalesce: { en: "coalesce() returns the first non-null value, not a logical result of the two tests.", fr: "coalesce() renvoie la première valeur non nulle, pas le résultat logique des deux tests." }
    union: { en: "union() combines arrays or objects; it doesn't evaluate conditions.", fr: "union() combine des tableaux ou des objets ; elle n'évalue pas de conditions." }
    failure1: { en: "The status value is Failed, not Failure (Upon Failure is the name of the dependency).", fr: "La valeur de statut est Failed, pas Failure (Upon Failure est le nom de la dépendance)." }
    error1: { en: "Error isn't a status value of an activity.", fr: "Error n'est pas une valeur de statut d'activité." }
    skipped1: { en: "A copy activity that ran and failed has the status Failed, not Skipped.", fr: "Une activité de copie qui s'est exécutée et a échoué a le statut Failed, pas Skipped." }
references:
  - title: Pipeline failure and error message
    url: https://learn.microsoft.com/en-us/azure/data-factory/tutorial-pipeline-failure-error-handling
