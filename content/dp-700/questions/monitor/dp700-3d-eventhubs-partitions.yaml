id: dp700-3d-eventhubs-partitions
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric eventstream named ES2. The source of ES2 is an Azure Event Hubs source in basic features mode that reads from an event hub named eh-orders. The event hub has two partitions. The destination of ES2 is an eventhouse that uses **Event processing before ingestion**.

    The **Event throughput** setting of ES2 is **High**. The producers send about 40 MB of events per second to eh-orders, but ES2 reads only about 10 MB per second, and the consumer lag of eh-orders keeps growing.

    You need to increase the rate at which ES2 reads the events.

    What should you do?
  fr: |
    Vous disposez d'un eventstream Fabric nommé ES2. La source d'ES2 est une source Azure Event Hubs en mode fonctionnalités de base qui lit un hub d'événements nommé eh-orders. Ce hub d'événements possède deux partitions. La destination d'ES2 est un eventhouse qui utilise **Event processing before ingestion**.

    Le paramètre **Event throughput** d'ES2 est réglé sur **High**. Les producteurs envoient environ 40 Mo d'événements par seconde à eh-orders, mais ES2 n'en lit qu'environ 10 Mo par seconde, et le retard de consommation d'eh-orders ne cesse d'augmenter.

    Vous devez augmenter le débit auquel ES2 lit les événements.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the Event throughput setting of ES2 to Medium.", fr: "Régler le paramètre Event throughput d'ES2 sur Medium." } }
    - { id: b, text: { en: "Change the eventhouse destination of ES2 to Direct ingestion.", fr: "Faire passer la destination eventhouse d'ES2 en Direct ingestion." } }
    - { id: c, text: { en: "Increase the retention of ES2 to 90 days.", fr: "Augmenter la rétention d'ES2 à 90 jours." } }
    - { id: d, text: { en: "Read from an event hub that has 16 partitions instead.", fr: "Lire plutôt un hub d'événements qui possède 16 partitions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "For an Azure Event Hubs source, the throughput of the eventstream depends on both the throughput level and the partition count of the event hub. With fewer than four partitions, the partitions cap the throughput whatever the level, at around 10 MB/s for two or three partitions. With 4, 16 or 32 partitions, the selected level applies, so the High level can then take effect."
    fr: "Pour une source Azure Event Hubs, le débit de l'eventstream dépend à la fois du niveau de débit et du nombre de partitions du hub d'événements. Avec moins de quatre partitions, les partitions plafonnent le débit quel que soit le niveau, à environ 10 Mo/s pour deux ou trois partitions. Avec 4, 16 ou 32 partitions, le niveau sélectionné s'applique : le niveau High peut alors produire son effet."
  options:
    a: { en: "A lower level cannot raise the rate; the two partitions are the limit at any level.", fr: "Un niveau inférieur ne peut pas augmenter le débit ; les deux partitions constituent la limite à tous les niveaux." }
    b: { en: "The bottleneck is the source, not the destination mode.", fr: "Le goulot d'étranglement est la source, pas le mode de la destination." }
    c: { en: "Retention controls how long events remain available, not the read rate.", fr: "La rétention contrôle la durée de disponibilité des événements, pas le débit de lecture." }
references:
  - title: Configure settings for a Fabric eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/configure-settings
