id: dp700-3b-notebook-configure-cell
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a notebook named NB_Transform and a pipeline named PL_Nightly. PL_Nightly runs NB_Transform by using a Notebook activity.

    The first code cell of NB_Transform imports libraries and defines helper functions. The second cell contains a %%configure magic command that sets the driver and executor memory.

    When a data engineer runs NB_Transform interactively, the engineer restarts the Spark session after the second cell and the notebook succeeds. The runs of PL_Nightly fail at the Notebook activity, and the error indicates that the session can't be restarted.

    You need PL_Nightly to run NB_Transform successfully with the custom memory settings.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un notebook nommé NB_Transform et un pipeline nommé PL_Nightly. PL_Nightly exécute NB_Transform au moyen d'une activité Notebook.

    La première cellule de code de NB_Transform importe des bibliothèques et définit des fonctions utilitaires. La deuxième cellule contient une commande magique %%configure qui définit la mémoire du pilote et des exécuteurs.

    Quand un ingénieur Données exécute NB_Transform de manière interactive, il redémarre la session Spark après la deuxième cellule et le notebook réussit. Les exécutions de PL_Nightly échouent sur l'activité Notebook, et l'erreur indique que la session ne peut pas être redémarrée.

    PL_Nightly doit exécuter NB_Transform avec succès en appliquant les paramètres de mémoire personnalisés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a boolean parameter named _inlineInstallationEnabled set to True to the Notebook activity", fr: "Ajouter à l'activité Notebook un paramètre booléen nommé _inlineInstallationEnabled défini sur True" } }
    - { id: b, text: { en: "Move the %%configure cell so that it's the first code cell of NB_Transform", fr: "Déplacer la cellule %%configure pour qu'elle soit la première cellule de code de NB_Transform" } }
    - { id: c, text: { en: "Set a session tag on the Notebook activity of PL_Nightly", fr: "Définir une balise de session (session tag) sur l'activité Notebook de PL_Nightly" } }
    - { id: d, text: { en: "Turn on high concurrency mode for pipelines running multiple notebooks in Workspace1", fr: "Activer le mode haute concurrence pour les pipelines exécutant plusieurs notebooks dans Workspace1" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      %%configure settings take effect only when the session starts, so in interactive mode you either run it first or restart the session. A pipeline run can't restart the session: if %%configure isn't in the first code cell, the run fails. Moving the cell to the top applies the memory settings when the session starts.
    fr: |
      Les paramètres de %%configure ne prennent effet qu'au démarrage de la session : en mode interactif, vous l'exécutez en premier ou vous redémarrez la session. Une exécution de pipeline ne peut pas redémarrer la session : si %%configure n'est pas dans la première cellule de code, l'exécution échoue. Placer la cellule en tête applique les paramètres de mémoire au démarrage de la session.
  options:
    a: { en: "This parameter enables %pip install in pipeline runs; it has nothing to do with session configuration.", fr: "Ce paramètre active %pip install dans les exécutions de pipeline ; il n'a rien à voir avec la configuration de session." }
    c: { en: "A session tag reuses an existing Spark session; it doesn't let %%configure run after other cells.", fr: "Une balise de session réutilise une session Spark existante ; elle ne permet pas d'exécuter %%configure après d'autres cellules." }
    d: { en: "High concurrency lets several notebooks share a session; it doesn't allow a session restart in the middle of a run.", fr: "La haute concurrence permet à plusieurs notebooks de partager une session ; elle ne permet pas de redémarrer la session au milieu d'une exécution." }
references:
  - title: Develop, execute, and manage notebooks
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/author-execute-notebook
