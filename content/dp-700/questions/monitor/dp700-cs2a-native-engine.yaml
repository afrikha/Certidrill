id: dp700-cs2a-native-engine
objective: "3.3.5"
type: yesno_statements
caseStudy: dp700-cs2a-blue-yonder
difficulty: 1
status: draft
stem:
  en: |
    To meet the requirement for the duration of NB-FleetStats, you plan to turn on **Enable native execution engine** on the Acceleration page of ENV-Fleet, and then publish the environment.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire l'exigence relative à la durée de NB-FleetStats, vous prévoyez d'activer **Enable native execution engine** dans la page Acceleration d'ENV-Fleet, puis de publier l'environnement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "NB-FleetStats can run faster without any change to its code.", fr: "NB-FleetStats peut s'exécuter plus rapidement sans aucune modification de son code." } }
    - { id: s2, text: { en: "The stream processing of SJD-Telemetry is also accelerated by the native execution engine.", fr: "Le traitement de flux de SJD-Telemetry est lui aussi accéléré par le moteur d'exécution natif." } }
    - { id: s3, text: { en: "When NB-FleetStats runs an operation that the native execution engine does not support, the notebook run fails.", fr: "Quand NB-FleetStats exécute une opération que le moteur d'exécution natif ne prend pas en charge, l'exécution du notebook échoue." } }
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The native execution engine runs Spark SQL and DataFrame operations on Parquet and Delta data in a vectorized C++ engine, without code changes, on Fabric Runtime 1.3 and 2.0; it benefits batch joins and aggregations such as NB-FleetStats. Structured streaming is not supported, so SJD-Telemetry keeps running on the regular Spark engine. When an operator is not supported, the operation falls back to the JVM Spark engine automatically instead of failing.
    fr: |
      Le moteur d'exécution natif exécute les opérations Spark SQL et DataFrame sur des données Parquet et Delta dans un moteur C++ vectorisé, sans modification de code, sur Fabric Runtime 1.3 et 2.0 ; il profite aux jointures et agrégations par lots comme celles de NB-FleetStats. Le streaming structuré n'est pas pris en charge : SJD-Telemetry continue de s'exécuter sur le moteur Spark classique. Quand un opérateur n'est pas pris en charge, l'opération bascule automatiquement sur le moteur Spark JVM au lieu d'échouer.
references:
  - title: Native execution engine for Fabric Data Engineering
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/native-execution-engine-overview
