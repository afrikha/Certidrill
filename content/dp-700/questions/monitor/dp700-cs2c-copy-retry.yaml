id: dp700-cs2c-copy-retry
objective: "3.2.1"
type: single
caseStudy: dp700-cs2c-wide-world
difficulty: 1
status: draft
stem:
  en: You need to meet the requirement for Copy stock movements. What should you do?
  fr: Vous devez satisfaire l'exigence relative à Copy stock movements. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the General settings of Copy stock movements, set Timeout to 0.00:15:00", fr: "Dans les paramètres General de Copy stock movements, définir Timeout sur 0.00:15:00" } }
    - { id: b, text: { en: "Add a second Copy activity that copies the stock movements on the On failure path of Copy stock movements", fr: "Ajouter une seconde activité Copy qui copie les mouvements de stock sur le chemin On failure de Copy stock movements" } }
    - { id: c, text: { en: "In the General settings of Copy stock movements, set Retry to 3 and Retry interval (sec) to 300", fr: "Dans les paramètres General de Copy stock movements, définir Retry sur 3 et Retry interval (sec) sur 300" } }
    - { id: d, text: { en: "Change the schedule of PL_Trade so that the pipeline runs every five minutes between 01:00 and 01:20", fr: "Modifier la planification de PL_Trade pour que le pipeline s'exécute toutes les cinq minutes entre 01:00 et 01:20" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each pipeline activity has General settings that include Retry, the maximum number of retry attempts, and Retry interval (sec), the number of seconds between attempts. Setting them to 3 and 300 makes the Copy activity try again up to three times, five minutes apart, which covers the restart window of WWI-ERP without changing the other activities.
    fr: |
      Chaque activité de pipeline possède des paramètres General qui incluent Retry, le nombre maximal de nouvelles tentatives, et Retry interval (sec), le nombre de secondes entre les tentatives. Les définir sur 3 et 300 fait relancer l'activité Copy jusqu'à trois fois, à cinq minutes d'intervalle, ce qui couvre la fenêtre de redémarrage de WWI-ERP sans modifier les autres activités.
  options:
    a: { en: "Timeout limits how long one attempt may run; it does not retry a failed attempt.", fr: "Timeout limite la durée d'une tentative ; il ne relance pas une tentative en échec." }
    b: { en: "A second activity gives only one more attempt, starts immediately without waiting five minutes, and duplicates the copy logic.", fr: "Une seconde activité ne donne qu'une tentative de plus, démarre immédiatement sans attendre cinq minutes et duplique la logique de copie." }
    d: { en: "Running the whole pipeline several times reruns every activity, including those that succeeded, instead of retrying only the failed copy.", fr: "Exécuter tout le pipeline plusieurs fois relance chaque activité, y compris celles qui ont réussi, au lieu de ne relancer que la copie en échec." }
references:
  - title: Activity overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview
