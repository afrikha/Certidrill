id: dp700-3c-column-types
objective: "3.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are creating a table named dbo.OrderLine in a Fabric warehouse. The columns have the following characteristics:

    - ProductCode: always exactly 9 characters, with leading zeros.
    - Quantity: a whole number between 1 and 500,000.
    - UnitPrice: up to 99,999.99, with two decimal places.
    - Comment: optional text of up to 200 characters.

    You need to define the columns by using the data types that give the best query performance, as Microsoft recommends for Fabric Data Warehouse.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une table nommée dbo.OrderLine dans un entrepôt Fabric. Les colonnes ont les caractéristiques suivantes :

    - ProductCode : toujours exactement 9 caractères, avec des zéros non significatifs.
    - Quantity : un nombre entier compris entre 1 et 500 000.
    - UnitPrice : jusqu'à 99 999,99, avec deux décimales.
    - Comment : texte facultatif de 200 caractères au plus.

    Vous devez définir les colonnes avec les types de données qui donnent les meilleures performances de requête, comme Microsoft le recommande pour Fabric Data Warehouse.

    Comment devez-vous compléter l'instruction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    CREATE TABLE dbo.OrderLine
    (
        OrderLineID bigint NOT NULL,
        ProductCode [[code]] NOT NULL,
        Quantity    [[qty]] NOT NULL,
        UnitPrice   [[price]] NOT NULL,
        Comment     [[comment]] NULL
    );
  slots:
    - id: code
      options:
        - { id: char9, text: "char(9)" }
        - { id: int, text: int }
        - { id: vchar8000, text: "varchar(8000)" }
        - { id: nchar9, text: "nchar(9)" }
    - id: qty
      options:
        - { id: smallint, text: smallint }
        - { id: int, text: int }
        - { id: decimal, text: decimal }
        - { id: float, text: float }
    - id: price
      options:
        - { id: dec72, text: "decimal(7,2)" }
        - { id: decimal, text: decimal }
        - { id: money, text: money }
        - { id: float, text: float }
    - id: comment
      options:
        - { id: v200, text: "varchar(200)" }
        - { id: vmax, text: "varchar(max)" }
        - { id: v8000, text: "varchar(8000)" }
        - { id: nv200, text: "nvarchar(200)" }
answer:
  values: { code: char9, qty: int, price: dec72, comment: v200 }
explanation:
  correct:
    en: |
      A fixed-length code whose formatting matters, such as leading zeros, is stored as char(n); an integer type would drop the zeros. Whole numbers use the smallest integer type that fits: 500,000 exceeds smallint, so int. decimal(7,2) holds 99,999.99 with the smallest precision, while a bare decimal is decimal(18,0) and loses the cents. varchar(200) is the smallest string length that fits; long declared lengths and varchar(max) hurt performance.
    fr: |
      Un code de longueur fixe dont la mise en forme compte, comme des zéros non significatifs, est stocké en char(n) ; un type entier supprimerait les zéros. Les nombres entiers utilisent le plus petit type entier qui convient : 500 000 dépasse smallint, donc int. decimal(7,2) contient 99 999,99 avec la plus petite précision, alors qu'un decimal sans précision vaut decimal(18,0) et perd les centimes. varchar(200) est la plus petite longueur de chaîne qui convient ; les longueurs déclarées trop grandes et varchar(max) nuisent aux performances.
  options:
    nchar9:
      en: |
        nchar is not supported in warehouse tables.
      fr: |
        nchar n'est pas pris en charge dans les tables d'entrepôt.
    smallint:
      en: |
        smallint stops at 32,767, below the maximum quantity of 500,000.
      fr: |
        smallint s'arrête à 32 767, en dessous de la quantité maximale de 500 000.
    money:
      en: |
        money is not supported in warehouse tables; decimal is the recommended replacement.
      fr: |
        money n'est pas pris en charge dans les tables d'entrepôt ; decimal est le remplacement recommandé.
    nv200:
      en: |
        nvarchar is not supported in warehouse tables; use varchar, which stores Unicode text with a UTF-8 collation.
      fr: |
        nvarchar n'est pas pris en charge dans les tables d'entrepôt ; utilisez varchar, qui stocke le texte Unicode avec un classement UTF-8.
references:
  - title: Performance guidelines in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
  - title: Data types in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-types
