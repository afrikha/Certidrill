id: dp700-3d-eventstream-settings
objective: "3.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage a Fabric eventstream named ES4. ES4 has an Azure SQL Database CDC source, which supports pause and resume, and a lakehouse destination. Its **Event throughput** setting is **Low** and its retention is 1 day.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un eventstream Fabric nommé ES4. ES4 a une source CDC Azure SQL Database, qui prend en charge la pause et la reprise, et une destination lakehouse. Son paramètre **Event throughput** est réglé sur **Low** et sa rétention est de 1 jour.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can set the retention of ES4 to 30 days.
        fr: Vous pouvez définir la rétention d'ES4 sur 30 jours.
    - id: s2
      text:
        en: Increasing the retention of ES4 to 7 days increases the number of events that ES4 can process per second.
        fr: Augmenter la rétention d'ES4 à 7 jours augmente le nombre d'événements qu'ES4 peut traiter par seconde.
    - id: s3
      text:
        en: To change the Event throughput setting of ES4, you first deactivate the CDC source.
        fr: Pour modifier le paramètre Event throughput d'ES4, vous désactivez d'abord la source CDC.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Eventstream retention is 1 day by default and can be set up to 90 days; it only defines how long events remain available. Throughput depends on the Event throughput level (Low, Medium or High), not on retention. When an eventstream contains nodes that support pause and resume, you deactivate them, change the throughput setting, and then reactivate them."
    fr: "La rétention d'un eventstream est de 1 jour par défaut et peut aller jusqu'à 90 jours ; elle définit seulement la durée pendant laquelle les événements restent disponibles. Le débit dépend du niveau Event throughput (Low, Medium ou High), pas de la rétention. Quand un eventstream contient des nœuds qui prennent en charge la pause et la reprise, vous les désactivez, modifiez le paramètre de débit, puis les réactivez."
references:
  - title: Configure settings for a Fabric eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/configure-settings
