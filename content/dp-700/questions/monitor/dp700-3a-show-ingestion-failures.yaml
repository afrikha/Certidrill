id: dp700-3a-show-ingestion-failures
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an eventhouse named EH-Fleet that contains a KQL database named FleetDB. Several applications ingest telemetry into FleetDB. Workspace monitoring is not enabled for the workspace.

    You need to list the ingestion operations that failed in FleetDB during the last three days, with their error details.

    Which command should you run in FleetDB?
  fr: |
    Fabrikam dispose d'un eventhouse nommé EH-Fleet qui contient une base de données KQL nommée FleetDB. Plusieurs applications ingèrent des données de télémétrie dans FleetDB. La supervision de l'espace de travail n'est pas activée pour l'espace de travail.

    Vous devez lister les opérations d'ingestion qui ont échoué dans FleetDB au cours des trois derniers jours, avec le détail de leurs erreurs.

    Quelle commande devez-vous exécuter dans FleetDB ?
body:
  options:
    - { id: a, text: ".show extents" }
    - { id: b, text: ".show journal" }
    - { id: c, text: ".show table Telemetry policy ingestionbatching" }
    - { id: d, text: ".show ingestion failures" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      `.show ingestion failures` returns the failures of the ingestion commands of the database, with the table, the time and the error details. Failures are kept for 14 days, which covers the last three days, and the command doesn't require workspace monitoring.
    fr: |
      `.show ingestion failures` renvoie les échecs des commandes d'ingestion de la base de données, avec la table, l'heure et le détail de l'erreur. Les échecs sont conservés 14 jours, ce qui couvre les trois derniers jours, et la commande ne demande pas la supervision de l'espace de travail.
  options:
    a:
      en: |
        `.show extents` lists the data shards that were created; a failed ingestion creates no extent, so it doesn't appear.
      fr: |
        `.show extents` liste les partitions de données (extents) créées ; une ingestion en échec ne crée aucun extent et n'y apparaît donc pas.
    b:
      en: |
        `.show journal` lists metadata operations such as table or policy changes, not failed ingestion operations.
      fr: |
        `.show journal` liste les opérations sur les métadonnées, comme les modifications de tables ou de stratégies, pas les opérations d'ingestion en échec.
    c:
      en: |
        This command shows how ingestion is batched for the table; it reports no failure.
      fr: |
        Cette commande montre comment l'ingestion est regroupée en lots pour la table ; elle ne signale aucun échec.
references:
  - title: .show ingestion failures command
    url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures
