id: dp700-3b-lookup-failure-causes
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a warehouse named DW_Config and a pipeline named PL_Config.

    PL_Config starts with a Lookup activity named Get Tables that runs a stored procedure in DW_Config. A ForEach activity iterates over the output of Get Tables. Get Tables fails on some days and succeeds on others.

    Which two issues could cause Get Tables to fail?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un entrepôt nommé DW_Config et un pipeline nommé PL_Config.

    PL_Config commence par une activité Lookup nommée Get Tables qui exécute une procédure stockée dans DW_Config. Une activité ForEach parcourt la sortie de Get Tables. Get Tables échoue certains jours et réussit d'autres jours.

    Quels sont les deux problèmes qui peuvent provoquer l'échec de Get Tables ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On some days, the stored procedure returns 6,000 rows.", fr: "Certains jours, la procédure stockée renvoie 6 000 lignes." } }
    - { id: b, text: { en: "On some days, the stored procedure returns two result sets.", fr: "Certains jours, la procédure stockée renvoie deux jeux de résultats." } }
    - { id: c, text: { en: "On some days, the output of Get Tables is larger than 4 MB.", fr: "Certains jours, la sortie de Get Tables dépasse 4 Mo." } }
    - { id: d, text: { en: "The ForEach activity processes the items in parallel with a batch count of 20.", fr: "L'activité ForEach traite les éléments en parallèle avec un Batch count de 20." } }
    - { id: e, text: { en: "On some days, the stored procedure runs for 30 minutes.", fr: "Certains jours, la procédure stockée s'exécute pendant 30 minutes." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "A query or stored procedure used by a Lookup activity must return one and exactly one result set, otherwise the activity fails. The Lookup output is also limited to 4 MB, and the activity fails when the output exceeds that size."
    fr: "Une requête ou une procédure stockée utilisée par une activité Lookup doit renvoyer un et un seul jeu de résultats, sinon l'activité échoue. La sortie de Lookup est aussi limitée à 4 Mo, et l'activité échoue quand la sortie dépasse cette taille."
  options:
    a: { en: "Above 5,000 rows, Lookup returns the first 5,000 rows instead of failing.", fr: "Au-delà de 5 000 lignes, Lookup renvoie les 5 000 premières lignes au lieu d'échouer." }
    d: { en: "A batch count of 20 is a valid parallelism for ForEach and has no effect on the Lookup activity.", fr: "Un Batch count de 20 est un parallélisme valide pour ForEach et n'a aucun effet sur l'activité Lookup." }
    e: { en: "30 minutes is far below the default activity timeout of 12 hours and the Lookup limit of 24 hours.", fr: "30 minutes est très inférieur au délai d'expiration par défaut de 12 heures d'une activité et à la limite de 24 heures de Lookup." }
references:
  - title: Lookup activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/lookup-activity
