id: dp700-3a-directlake-etl-window
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind has a pipeline named PL_Nightly that loads eight Delta tables in a lakehouse named LH_Sales, one after the other. The pipeline finishes between 02:00 and 05:00, depending on the volume. A Direct Lake on OneLake semantic model named SM_Sales uses the tables of LH_Sales and has the default settings.

    Users report that, during the night, some reports combine new and old data. You need to ensure that SM_Sales exposes the new data only after all eight tables are loaded. The solution must keep Direct Lake mode and make the new data available as soon as possible.

    What should you do?
  fr: |
    Northwind dispose d'un pipeline nommé PL_Nightly qui charge huit tables Delta d'un lakehouse nommé LH_Sales, l'une après l'autre. Le pipeline se termine entre 02:00 et 05:00, selon le volume. Un modèle sémantique Direct Lake sur OneLake nommé SM_Sales utilise les tables de LH_Sales et a les paramètres par défaut.

    Des utilisateurs signalent que, pendant la nuit, certains rapports mélangent des données nouvelles et anciennes. Vous devez faire en sorte que SM_Sales n'expose les nouvelles données qu'une fois les huit tables chargées. La solution doit conserver le mode Direct Lake et rendre les nouvelles données disponibles le plus tôt possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the default settings, then schedule a refresh of SM_Sales every day at 05:30", fr: "Conserver les paramètres par défaut, puis planifier une actualisation de SM_Sales chaque jour à 05:30" } }
    - { id: b, text: { en: "Turn off Keep your Direct Lake data up to date, then schedule a refresh of SM_Sales at 05:30", fr: "Désactiver Keep your Direct Lake data up to date, puis planifier une actualisation de SM_Sales à 05:30" } }
    - { id: c, text: { en: "Set the Direct Lake behavior of SM_Sales to DirectQueryOnly while PL_Nightly is running", fr: "Régler le comportement Direct Lake de SM_Sales sur DirectQueryOnly pendant l'exécution de PL_Nightly" } }
    - { id: d, text: { en: "Turn off Keep your Direct Lake data up to date, then refresh SM_Sales at the end of PL_Nightly", fr: "Désactiver Keep your Direct Lake data up to date, puis actualiser SM_Sales à la fin de PL_Nightly" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Keep your Direct Lake data up to date is enabled by default, so SM_Sales frames each table as soon as its Delta table changes, which mixes new and old tables during the load. Turning it off is recommended when an ETL process must finish before new data is exposed. A refresh at the end of the pipeline, such as a Semantic model refresh activity after the last load, then frames all the tables right after the last load, whatever the finish time.
    fr: |
      Keep your Direct Lake data up to date est activé par défaut : SM_Sales trame chaque table dès que sa table Delta change, ce qui mélange tables nouvelles et anciennes pendant le chargement. Le désactiver est recommandé quand un processus ETL doit se terminer avant que les nouvelles données soient exposées. Une actualisation à la fin du pipeline, par exemple une activité Semantic model refresh après le dernier chargement, trame ensuite toutes les tables juste après le dernier chargement, quelle que soit l'heure de fin.
  options:
    a:
      en: |
        With automatic updates still on, the model keeps framing each table as it changes during the night.
      fr: |
        Avec les mises à jour automatiques toujours activées, le modèle continue de tramer chaque table à mesure qu'elle change pendant la nuit.
    b:
      en: |
        This exposes complete data, but when the pipeline ends at 02:00, users wait until 05:30, so the data isn't available as soon as possible.
      fr: |
        Cela expose des données complètes, mais quand le pipeline se termine à 02:00, les utilisateurs attendent jusqu'à 05:30 : les données ne sont pas disponibles le plus tôt possible.
    c:
      en: |
        DirectQuery fallback doesn't exist for Direct Lake on OneLake, and DirectQuery would read the tables as they are being loaded.
      fr: |
        Le basculement vers DirectQuery n'existe pas pour Direct Lake sur OneLake, et DirectQuery lirait les tables pendant leur chargement.
references:
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
  - title: Semantic model refresh activity in Data Factory for Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/semantic-model-refresh-activity
