id: dp700-3a-rerun-failed-order
objective: "3.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a pipeline named PL_Load that runs eight Copy activities in sequence, followed by a notebook activity. Last night, the sixth Copy activity failed because of a transient network error, and the remaining activities didn't run. The cause is now resolved.

    You need to complete the load from the legacy Monitoring hub. The five Copy activities that succeeded must not run again.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un pipeline nommé PL_Load qui exécute huit activités Copy à la suite, puis une activité de notebook. La nuit dernière, la sixième activité Copy a échoué à cause d'une erreur réseau temporaire, et les activités suivantes ne se sont pas exécutées. La cause est maintenant résolue.

    Vous devez terminer le chargement depuis l'ancien hub de surveillance (Monitoring hub). Les cinq activités Copy qui ont réussi ne doivent pas s'exécuter de nouveau.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: filter, text: { en: "Open the Monitoring hub and filter the runs on Status Failed and Item type Pipeline.", fr: "Ouvrir le hub de surveillance et filtrer les exécutions sur Status Failed et Item type Pipeline." } }
    - { id: open, text: { en: "Select the name of the failed PL_Load run to open its pipeline run detail page.", fr: "Sélectionner le nom de l'exécution en échec de PL_Load pour ouvrir sa page de détail d'exécution de pipeline." } }
    - { id: rerun, text: { en: "Rerun the pipeline from the failed activity.", fr: "Relancer le pipeline à partir de l'activité en échec." } }
    - { id: run, text: { en: "Open PL_Load in the pipeline editor and select Run.", fr: "Ouvrir PL_Load dans l'éditeur de pipeline et sélectionner Run." } }
    - { id: down, text: { en: "In Column Options, turn on the Downstream runs column.", fr: "Dans Column Options, activer la colonne Downstream runs." } }
    - { id: wsmon, text: { en: "Enable workspace monitoring for the workspace.", fr: "Activer la supervision de l'espace de travail." } }
answer:
  sequence: [filter, open, rerun]
explanation:
  correct:
    en: |
      In the Monitoring hub, you filter to find the failed run, then select the pipeline name to open the run detail page, which lists the activity runs. From the run detail view, you can rerun the pipeline from the failed activity, so the activities that already succeeded are not run again.
    fr: |
      Dans le hub de surveillance, vous filtrez pour trouver l'exécution en échec, puis vous sélectionnez le nom du pipeline pour ouvrir la page de détail de l'exécution, qui liste les exécutions d'activités. Depuis cette vue de détail, vous pouvez relancer le pipeline à partir de l'activité en échec : les activités qui ont déjà réussi ne sont pas réexécutées.
  options:
    run: { en: "Running the pipeline from the editor starts a new run from the first activity, so the five successful copies would run again.", fr: "Exécuter le pipeline depuis l'éditeur démarre une nouvelle exécution à partir de la première activité : les cinq copies réussies seraient réexécutées." }
    down: { en: "Downstream runs shows the jobs a run started; it isn't needed to rerun the pipeline.", fr: "Downstream runs montre les tâches démarrées par une exécution ; cette colonne n'est pas nécessaire pour relancer le pipeline." }
    wsmon: { en: "Workspace monitoring collects logs for querying; it isn't needed to rerun a pipeline and doesn't backfill last night's run.", fr: "La supervision de l'espace de travail collecte des journaux à interroger ; elle n'est pas nécessaire pour relancer un pipeline et ne récupère pas l'exécution de la nuit dernière." }
references:
  - title: How to monitor pipeline runs in Monitoring hub
    url: https://learn.microsoft.com/en-us/fabric/data-factory/monitoring-hub-pipeline-runs
