id: dp700-3c-vorder-precedence
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric environment named Env_Lake that sets the Spark property spark.sql.parquet.vorder.default to true. All the notebooks of the workspace use Env_Lake.

    A notebook named NB_Stage writes only to a Delta table named stg_events, many times per hour. To speed up these writes, a data engineer ran the following statement.

    `ALTER TABLE stg_events SET TBLPROPERTIES ("delta.parquet.vorder.enabled" = "false")`

    New files of stg_events are still written with V-Order.

    You need the writes of NB_Stage to stg_events to stop using V-Order. The writes of the other notebooks must continue to use V-Order.

    What should you do?
  fr: |
    Vous disposez d'un environnement Fabric nommé Env_Lake qui définit la propriété Spark spark.sql.parquet.vorder.default sur true. Tous les notebooks de l'espace de travail utilisent Env_Lake.

    Un notebook nommé NB_Stage n'écrit que dans une table Delta nommée stg_events, plusieurs fois par heure. Pour accélérer ces écritures, un ingénieur données a exécuté l'instruction suivante.

    `ALTER TABLE stg_events SET TBLPROPERTIES ("delta.parquet.vorder.enabled" = "false")`

    Les nouveaux fichiers de stg_events sont toujours écrits avec V-Order.

    Les écritures de NB_Stage dans stg_events ne doivent plus utiliser V-Order. Les écritures des autres notebooks doivent continuer à utiliser V-Order.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run ALTER TABLE stg_events UNSET TBLPROPERTIES (\"delta.parquet.vorder.enabled\").", fr: "Exécuter ALTER TABLE stg_events UNSET TBLPROPERTIES (\"delta.parquet.vorder.enabled\")." } }
    - { id: b, text: { en: "Remove spark.sql.parquet.vorder.default from Env_Lake.", fr: "Supprimer spark.sql.parquet.vorder.default de Env_Lake." } }
    - { id: c, text: { en: "Run spark.conf.set(\"spark.fabric.resourceProfile\", \"readHeavyForPBI\") at the start of NB_Stage.", fr: "Exécuter spark.conf.set(\"spark.fabric.resourceProfile\", \"readHeavyForPBI\") au début de NB_Stage." } }
    - { id: d, text: { en: "Run spark.conf.set(\"spark.sql.parquet.vorder.default\", \"false\") at the start of NB_Stage.", fr: "Exécuter spark.conf.set(\"spark.sql.parquet.vorder.default\", \"false\") au début de NB_Stage." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The session setting spark.sql.parquet.vorder.default takes precedence over the delta.parquet.vorder.enabled table property, so the true value inherited from Env_Lake keeps V-Order on despite the property. Setting the session property to false at run time in NB_Stage overrides the environment for that session only, so the other notebooks keep writing with V-Order.
    fr: |
      Le paramètre de session spark.sql.parquet.vorder.default est prioritaire sur la propriété de table delta.parquet.vorder.enabled : la valeur true héritée de Env_Lake maintient V-Order malgré la propriété. Définir la propriété de session sur false à l'exécution dans NB_Stage remplace l'environnement pour cette session seulement, et les autres notebooks continuent d'écrire avec V-Order.
  options:
    a:
      en: |
        Without the table property, the writes inherit the session setting, which is still true.
      fr: |
        Sans la propriété de table, les écritures héritent du paramètre de session, qui reste true.
    b:
      en: |
        Removing the property from the environment returns every notebook of the workspace to the default, V-Order disabled, which breaks the requirement for the other notebooks.
      fr: |
        Supprimer la propriété de l'environnement ramène tous les notebooks de l'espace de travail à la valeur par défaut, V-Order désactivé, ce qui ne respecte pas l'exigence pour les autres notebooks.
    c:
      en: |
        The readHeavyForPBI profile enables V-Order; it would not stop V-Order in NB_Stage.
      fr: |
        Le profil readHeavyForPBI active V-Order ; il n'arrêterait pas V-Order dans NB_Stage.
references:
  - title: Optimize Delta Lake tables with V-Order in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/delta-optimization-and-v-order
