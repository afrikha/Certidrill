id: dp700-3b-dataflow-oauth-gateway
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a Dataflow Gen2 named DF_Logs. DF_Logs reads files from an Azure Data Lake Storage Gen2 account that is reachable only through private endpoints, so DF_Logs uses a virtual network data gateway. The connection uses OAuth2 credentials of an organizational account.

    Refreshes that take less than 40 minutes succeed. Refreshes that run longer than one hour fail with AccessUnauthorized errors, even though the credentials of the connection were updated yesterday.

    You need to ensure that the refreshes of DF_Logs succeed. The connection must keep its current authentication method.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un Dataflow Gen2 nommé DF_Logs. DF_Logs lit des fichiers d'un compte Azure Data Lake Storage Gen2 accessible uniquement via des points de terminaison privés : DF_Logs utilise donc une passerelle de données de réseau virtuel. La connexion utilise les informations d'identification OAuth2 d'un compte professionnel.

    Les actualisations de moins de 40 minutes réussissent. Les actualisations de plus d'une heure échouent avec des erreurs AccessUnauthorized, alors que les informations d'identification de la connexion ont été mises à jour hier.

    Vous devez faire en sorte que les actualisations de DF_Logs réussissent. La connexion doit conserver sa méthode d'authentification actuelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Split the queries across several dataflows so that each refresh finishes in less than one hour", fr: "Répartir les requêtes sur plusieurs dataflows pour que chaque actualisation se termine en moins d'une heure" } }
    - { id: b, text: { en: "Replace the virtual network data gateway with an on-premises data gateway that reaches the private endpoints", fr: "Remplacer la passerelle de données de réseau virtuel par une passerelle de données locale qui atteint les points de terminaison privés" } }
    - { id: c, text: { en: "Sign in again in the connection settings, and then rerun the refresh", fr: "Se reconnecter dans les paramètres de la connexion, puis relancer l'actualisation" } }
    - { id: d, text: { en: "Enable staging for the queries of DF_Logs", fr: "Activer le staging pour les requêtes de DF_Logs" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With OAuth2 credentials, a gateway can't refresh the access token automatically, and the token expires one hour after the refresh starts. Refreshes longer than one hour therefore fail with InvalidConnectionCredentials or AccessUnauthorized errors, for virtual network and on-premises gateways alike. Keeping each refresh under one hour avoids the limitation.
    fr: |
      Avec des informations d'identification OAuth2, une passerelle ne peut pas actualiser automatiquement le jeton d'accès, qui expire une heure après le début de l'actualisation. Les actualisations de plus d'une heure échouent donc avec des erreurs InvalidConnectionCredentials ou AccessUnauthorized, aussi bien avec une passerelle de réseau virtuel qu'avec une passerelle locale. Garder chaque actualisation sous une heure évite cette limitation.
  options:
    b: { en: "The one-hour limitation applies to on-premises data gateways as well.", fr: "La limitation d'une heure s'applique aussi aux passerelles de données locales." }
    c: { en: "Fresh credentials still produce a token that expires one hour after the refresh starts.", fr: "De nouvelles informations d'identification produisent toujours un jeton qui expire une heure après le début de l'actualisation." }
    d: { en: "Staging doesn't change how the gateway handles OAuth2 tokens.", fr: "Le staging ne change pas la façon dont la passerelle gère les jetons OAuth2." }
references:
  - title: Data Factory limitations overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-limitations
