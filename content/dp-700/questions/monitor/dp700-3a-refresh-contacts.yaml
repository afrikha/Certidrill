id: dp700-3a-refresh-contacts
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has a workspace on a Fabric capacity. The workspace contains an import-mode semantic model named SM_Margin that refreshes on a schedule four times a day. The owner of SM_Margin is a user named Admin1.

    You need to ensure that the members of a Microsoft Entra security group named BI-Support receive an email whenever a scheduled refresh of SM_Margin fails. The solution must minimize cost.

    What should you configure?
  fr: |
    Woodgrove dispose d'un espace de travail sur une capacité Fabric. L'espace de travail contient un modèle sémantique en mode importation nommé SM_Margin qui s'actualise selon une planification quatre fois par jour. Le propriétaire de SM_Margin est un utilisateur nommé Admin1.

    Vous devez faire en sorte que les membres d'un groupe de sécurité Microsoft Entra nommé BI-Support reçoivent un e-mail chaque fois qu'une actualisation planifiée de SM_Margin échoue. La solution doit réduire les coûts.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "In the Monitor hub, a schedule failure email for SM_Margin with BI-Support as the recipient", fr: "Dans le hub de surveillance, un e-mail d'échec de planification pour SM_Margin avec BI-Support comme destinataire" } }
    - { id: b, text: { en: "In the Monitor hub, an Activator-based alert rule on the failed runs of SM_Margin", fr: "Dans le hub de surveillance, une règle d'alerte basée sur Activator sur les exécutions en échec de SM_Margin" } }
    - { id: c, text: { en: "In the refresh settings of SM_Margin, BI-Support in Email these contacts when the refresh fails", fr: "Dans les paramètres d'actualisation de SM_Margin, BI-Support dans Email these contacts when the refresh fails" } }
    - { id: d, text: { en: "A subscription for BI-Support to the report that uses SM_Margin, after each refresh", fr: "Un abonnement de BI-Support au rapport qui utilise SM_Margin, après chaque actualisation" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Refresh failure notifications are emailed to the model owner by default, and you can add recipients in Email these contacts when the refresh fails; the recipients must be in the Microsoft Entra tenant, and groups are accepted. These notifications are sent for scheduled refreshes at no extra cost.
    fr: |
      Les notifications d'échec d'actualisation sont envoyées par défaut au propriétaire du modèle, et vous pouvez ajouter des destinataires dans Email these contacts when the refresh fails ; les destinataires doivent appartenir au locataire Microsoft Entra, et les groupes sont acceptés. Ces notifications sont envoyées pour les actualisations planifiées sans coût supplémentaire.
  options:
    a:
      en: |
        The Schedule failure emails page of the Monitor hub doesn't support semantic models yet.
      fr: |
        La page Schedule failure emails du hub de surveillance ne prend pas encore en charge les modèles sémantiques.
    b:
      en: |
        Activator-based job alerts don't list semantic models among their supported job types, and they are billed as Activator usage.
      fr: |
        Les alertes de tâche basées sur Activator ne comptent pas les modèles sémantiques parmi les types de tâches pris en charge, et elles sont facturées comme une consommation Activator.
    d:
      en: |
        A subscription sends report snapshots on a schedule; it doesn't tell the recipients that a refresh failed.
      fr: |
        Un abonnement envoie des captures du rapport selon une planification ; il n'informe pas les destinataires de l'échec d'une actualisation.
references:
  - title: Data refresh in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-data
  - title: Set up job alerts in the Monitor hub (preview)
    url: https://learn.microsoft.com/en-us/fabric/admin/monitoring-hub-alerts
