id: dp700-3a-jobruns-filter
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has three Fabric workspaces named Sales-Ingest, Finance-Ingest and HR-Ingest. Each workspace contains several pipelines and copy jobs that load data into lakehouses. Workspace monitoring is not enabled in any of the workspaces.

    You need to review, in a single list, the pipeline and copy job runs that failed in the three workspaces during the last 24 hours. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Contoso dispose de trois espaces de travail Fabric nommés Sales-Ingest, Finance-Ingest et HR-Ingest. Chaque espace de travail contient plusieurs pipelines et tâches de copie (Copy job) qui chargent des données dans des lakehouses. La supervision de l'espace de travail n'est activée dans aucun des espaces de travail.

    Vous devez examiner, dans une seule liste, les exécutions de pipelines et de tâches de copie qui ont échoué dans les trois espaces de travail au cours des dernières 24 heures. La solution doit réduire l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Microsoft Fabric Capacity Metrics app, filtered on the three workspaces", fr: "L'application Microsoft Fabric Capacity Metrics, filtrée sur les trois espaces de travail" } }
    - { id: b, text: { en: "The Recent runs pane of each pipeline and copy job, opened from each workspace", fr: "Le volet Recent runs de chaque pipeline et de chaque tâche de copie, ouvert depuis chaque espace de travail" } }
    - { id: c, text: { en: "The Monitoring hub, filtered by status, item type, start time and location", fr: "Le hub de surveillance (Monitoring hub), filtré par statut, type d'élément, heure de début et emplacement" } }
    - { id: d, text: { en: "Workspace monitoring enabled in each workspace, then a KQL query on the job event logs", fr: "La supervision de l'espace de travail activée dans chaque espace de travail, puis une requête KQL sur les journaux d'événements de tâche" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Monitoring hub is a central list of the runs of the items you can view. Its filter pane filters by Status, Item Type, Start Time, Submitter and Location, so you keep only the failed pipeline and copy job runs of the last 24 hours in the three workspaces, without any setup.
    fr: |
      Le hub de surveillance (Monitoring hub) est une liste centrale des exécutions des éléments que vous pouvez consulter. Son volet de filtres filtre par Status, Item Type, Start Time, Submitter et Location : vous ne gardez que les exécutions en échec des pipelines et des tâches de copie des dernières 24 heures dans les trois espaces de travail, sans aucune configuration.
  options:
    a:
      en: |
        The Capacity Metrics app shows capacity unit consumption and throttling per item; it is not a list of failed runs.
      fr: |
        L'application Capacity Metrics montre la consommation d'unités de capacité et la limitation par élément ; ce n'est pas une liste d'exécutions en échec.
    b:
      en: |
        Recent runs shows the history of one item at a time, so you would have to open every pipeline and copy job separately.
      fr: |
        Recent runs affiche l'historique d'un seul élément à la fois : il faudrait ouvrir chaque pipeline et chaque tâche de copie séparément.
    d:
      en: |
        Workspace monitoring doesn't backfill earlier activity, so enabling it now cannot show the failures of the last 24 hours, and it requires setup in each workspace.
      fr: |
        La supervision de l'espace de travail ne récupère pas l'activité antérieure : l'activer maintenant ne peut pas montrer les échecs des dernières 24 heures, et elle demande une configuration dans chaque espace de travail.
references:
