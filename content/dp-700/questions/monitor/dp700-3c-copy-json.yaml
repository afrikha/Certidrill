id: dp700-3c-copy-json
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are editing the JSON definition of a Copy activity named Copy_Invoices in a Fabric pipeline.

    You need to configure Copy_Invoices to meet the following requirements:

    - Limit the compute allocated to the copy to 32.
    - Use at most 8 threads to read the source and write the destination.
    - Copy the data through an interim staging store.

    How should you complete the JSON? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous modifiez la définition JSON d'une activité Copy nommée Copy_Invoices dans un pipeline Fabric.

    Vous devez configurer Copy_Invoices pour satisfaire les exigences suivantes :

    - Limiter à 32 la puissance de calcul allouée à la copie.
    - Utiliser au plus 8 threads pour lire la source et écrire la destination.
    - Copier les données par une zone de transit intermédiaire.

    Comment devez-vous compléter le JSON ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "name": "Copy_Invoices",
      "type": "Copy",
      "typeProperties": {
        [[k1]]: 32,
        [[k2]]: 8,
        [[k3]]: true
      }
    }
  slots:
    - id: k1
      options:
        - { id: k1_diu, text: "\"dataIntegrationUnits\"" }
        - { id: k1_par, text: "\"parallelCopies\"" }
        - { id: k1_apt, text: "\"adaptivePerformanceTuning\"" }
    - id: k2
      options:
        - { id: k2_diu, text: "\"dataIntegrationUnits\"" }
        - { id: k2_par, text: "\"parallelCopies\"" }
        - { id: k2_apt, text: "\"adaptivePerformanceTuning\"" }
    - id: k3
      options:
        - { id: k3_stage, text: "\"enableStaging\"" }
        - { id: k3_valid, text: "\"validateDataConsistency\"" }
        - { id: k3_skip, text: "\"enableSkipIncompatibleRow\"" }
        - { id: k3_comp, text: "\"enableCompression\"" }
answer:
  values: { k1: k1_diu, k2: k2_par, k3: k3_stage }
explanation:
  correct:
    en: |
      Intelligent throughput optimization, which sets the compute of the copy from 4 to 256, is stored as dataIntegrationUnits. Degree of copy parallelism, the maximum number of threads that read and write, is stored as parallelCopies. Enable staging, which copies the data through an interim store, is stored as enableStaging.
    fr: |
      Intelligent throughput optimization, qui fixe la puissance de calcul de la copie entre 4 et 256, est stocké sous dataIntegrationUnits. Degree of copy parallelism, le nombre maximal de threads qui lisent et écrivent, est stocké sous parallelCopies. Enable staging, qui fait passer les données par un magasin intermédiaire, est stocké sous enableStaging.
  options:
    k1_apt:
      en: |
        adaptivePerformanceTuning (preview) lets the service apply its own tuning; it does not set a compute value.
      fr: |
        adaptivePerformanceTuning (préversion) laisse le service appliquer son propre réglage ; il ne fixe pas une valeur de calcul.
    k3_valid:
      en: |
        validateDataConsistency checks the copied data after the transfer; it does not stage the data.
      fr: |
        validateDataConsistency contrôle les données copiées après le transfert ; il ne place pas les données en zone de transit.
    k3_skip:
      en: |
        enableSkipIncompatibleRow is part of fault tolerance and skips incompatible rows.
      fr: |
        enableSkipIncompatibleRow fait partie de la tolérance de panne et ignore les lignes incompatibles.
    k3_comp:
      en: |
        enableCompression compresses data during a staged copy; it does not enable staging by itself.
      fr: |
        enableCompression compresse les données pendant une copie avec zone de transit ; il n'active pas la zone de transit à lui seul.
references:
  - title: How to copy data using copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-data-activity
