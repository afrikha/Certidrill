id: dp700-3b-schedule-parameter-name
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Load. PL_Load has a string parameter named SourceRegion with a default value of EU.

    You create a daily schedule for PL_Load. In the schedule, you add a parameter named Region with a direct value of US.

    The scheduled runs succeed, but the run details show that they processed EU data. When you run PL_Load manually and enter US for SourceRegion, US data is processed.

    You need the scheduled runs to process US data.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Load. PL_Load possède un paramètre de type chaîne nommé SourceRegion, dont la valeur par défaut est EU.

    Vous créez une planification quotidienne pour PL_Load. Dans la planification, vous ajoutez un paramètre nommé Region avec la valeur directe US.

    Les exécutions planifiées réussissent, mais leurs détails montrent qu'elles ont traité les données EU. Quand vous exécutez PL_Load manuellement en saisissant US pour SourceRegion, ce sont les données US qui sont traitées.

    Vous devez faire en sorte que les exécutions planifiées traitent les données US.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the schedule, replace the Region parameter with a parameter named SourceRegion", fr: "Dans la planification, remplacer le paramètre Region par un paramètre nommé SourceRegion" } }
    - { id: b, text: { en: "In PL_Load, remove the default value of the SourceRegion parameter", fr: "Dans PL_Load, supprimer la valeur par défaut du paramètre SourceRegion" } }
    - { id: c, text: { en: "In the schedule, set the time zone to the time zone of the US source system", fr: "Dans la planification, définir le fuseau horaire sur celui du système source US" } }
    - { id: d, text: { en: "In the schedule, reference the Region value from a variable library instead of a direct value", fr: "Dans la planification, référencer la valeur de Region depuis une bibliothèque de variables plutôt qu'une valeur directe" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Parameter names in a schedule must exactly match the parameter names defined in the pipeline, and mismatched names are ignored at runtime. The Region value was ignored, so the pipeline used the default value EU. Naming the schedule parameter SourceRegion passes US to the pipeline."
    fr: "Les noms des paramètres d'une planification doivent correspondre exactement à ceux définis dans le pipeline, et les noms qui ne correspondent pas sont ignorés à l'exécution. La valeur de Region a été ignorée, donc le pipeline a utilisé la valeur par défaut EU. Nommer le paramètre de la planification SourceRegion transmet US au pipeline."
  options:
    b: { en: "The schedule value would still be ignored because of the name mismatch; the run would get no value instead of US.", fr: "La valeur de la planification serait toujours ignorée à cause de la différence de nom ; l'exécution ne recevrait aucune valeur au lieu de US." }
    c: { en: "The time zone decides when the schedule fires, not which parameter values are passed.", fr: "Le fuseau horaire détermine quand la planification se déclenche, pas quelles valeurs de paramètre sont transmises." }
    d: { en: "A variable library changes where the value comes from, but a parameter named Region is still ignored by PL_Load.", fr: "Une bibliothèque de variables change l'origine de la valeur, mais un paramètre nommé Region reste ignoré par PL_Load." }
references:
  - title: Run, schedule, or use events to trigger a pipeline
    url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs
