id: dp700-sr1-error-code-query-1
objective: "3.3.6"
type: series_yesno
series: dp700-sr1-error-code-query
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You filter on Timestamp first and replace contains with has.
  fr: Vous filtrez d'abord sur Timestamp et remplacez contains par has.
body:
  solution:
    en: |
      You change the query to the following:

      ```kusto
      AppLogs
      | where Timestamp > ago(1h)
      | where Message has "E4012"
      | project Timestamp, ServerId, Message
      ```
    fr: |
      Vous remplacez la requête par la suivante :

      ```kusto
      AppLogs
      | where Timestamp > ago(1h)
      | where Message has "E4012"
      | project Timestamp, ServerId, Message
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      Kusto recommends applying datetime predicates first, because the datetime index can eliminate whole shards, and then term-level string predicates. The has operator looks up the term in the term index instead of scanning every value for a substring. Because each error code is a separate word of five characters, has "E4012" matches exactly the rows that contains "E4012" matched.
    fr: |
      Kusto recommande d'appliquer d'abord les prédicats datetime, car l'index datetime peut éliminer des partitions (shards) entières, puis les prédicats de chaîne au niveau des termes. L'opérateur has recherche le terme dans l'index de termes au lieu d'analyser chaque valeur à la recherche d'une sous-chaîne. Comme chaque code d'erreur est un mot distinct de cinq caractères, has "E4012" renvoie exactement les lignes que renvoyait contains "E4012".
