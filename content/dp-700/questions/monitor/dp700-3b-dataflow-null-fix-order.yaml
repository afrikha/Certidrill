id: dp700-3b-dataflow-null-fix-order
objective: "3.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Returns and a Dataflow Gen2 named DF_Returns.

    DF_Returns contains a query named Returns. Its data destination is a table named Returns in LH_Returns, which the dataflow created. The RefundDate column of the query legitimately contains null values for open returns.

    Each refresh now fails with the following error: "Couldn't refresh entity because of an issue with the mashup document. We can't insert null data into a non-nullable column."

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Returns et un Dataflow Gen2 nommé DF_Returns.

    DF_Returns contient une requête nommée Returns. Sa destination de données est une table nommée Returns dans LH_Returns, créée par le dataflow. La colonne RefundDate de la requête contient légitimement des valeurs nulles pour les retours en cours.

    Chaque actualisation échoue désormais avec l'erreur suivante : « Couldn't refresh entity because of an issue with the mashup document. We can't insert null data into a non-nullable column. »

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: stage, text: { en: "Enable staging for the Returns query.", fr: "Activer le staging pour la requête Returns." } }
    - { id: drop, text: { en: "Delete the Returns table from LH_Returns.", fr: "Supprimer la table Returns de LH_Returns." } }
    - { id: append, text: { en: "Change the update method of the destination to Append.", fr: "Remplacer la méthode de mise à jour de la destination par Append." } }
    - { id: remove, text: { en: "Remove the data destination from the Returns query.", fr: "Retirer la destination de données de la requête Returns." } }
    - { id: types, text: { en: "Change the column types of the Returns query to nullable types, for example type nullable date.", fr: "Remplacer les types de colonnes de la requête Returns par des types nullables, par exemple type nullable date." } }
    - { id: add, text: { en: "Add the data destination to the Returns query again.", fr: "Ajouter de nouveau la destination de données à la requête Returns." } }
answer:
  sequence: [ drop, remove, types, add ]
explanation:
  correct:
    en: |
      Power Query can detect a nullable column as non-nullable, and the destination table was created with that definition. The documented fix is to delete the table from the destination, remove the destination from the query, set the column types to nullable types (Table.TransformColumnTypes with type nullable ...), and then add the destination again so that the table is recreated with nullable columns.
    fr: |
      Power Query peut détecter une colonne nullable comme non nullable, et la table de destination a été créée avec cette définition. La correction documentée consiste à supprimer la table de la destination, retirer la destination de la requête, définir les types de colonnes comme nullables (Table.TransformColumnTypes avec type nullable ...), puis ajouter de nouveau la destination pour que la table soit recréée avec des colonnes nullables.
  options:
    stage: { en: "Staging doesn't change the nullability of the destination columns.", fr: "Le staging ne change pas le caractère nullable des colonnes de destination." }
    append: { en: "Append keeps the existing table definition, so the column stays non-nullable.", fr: "Append conserve la définition de table existante : la colonne reste non nullable." }
references:
  - title: Dataflow Gen2 data destinations and managed settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-and-managed-settings
