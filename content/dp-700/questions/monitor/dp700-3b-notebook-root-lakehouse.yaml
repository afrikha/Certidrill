id: dp700-3b-notebook-root-lakehouse
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains two lakehouses named LH_Silver and LH_Gold and two notebooks named NB_Main and NB_Clean.

    The default lakehouse of NB_Main is LH_Gold. The default lakehouse of NB_Clean is LH_Silver. NB_Main runs NB_Clean by calling notebookutils.notebook.run(), and the execution of NB_Clean is blocked.

    You need NB_Main to run NB_Clean, with NB_Clean using LH_Gold as its default lakehouse during these runs. NB_Clean must not be modified.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient deux lakehouses nommés LH_Silver et LH_Gold et deux notebooks nommés NB_Main et NB_Clean.

    Le lakehouse par défaut de NB_Main est LH_Gold. Le lakehouse par défaut de NB_Clean est LH_Silver. NB_Main exécute NB_Clean en appelant notebookutils.notebook.run(), et l'exécution de NB_Clean est bloquée.

    NB_Main doit exécuter NB_Clean, NB_Clean utilisant LH_Gold comme lakehouse par défaut pendant ces exécutions. NB_Clean ne doit pas être modifié.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `\"useRootDefaultLakehouse\": True` to the arguments passed to `notebookutils.notebook.run()`", fr: "Ajouter `\"useRootDefaultLakehouse\": True` aux arguments passés à `notebookutils.notebook.run()`" } }
    - { id: b, text: { en: "Pass the workspace ID of Workspace1 as the workspace argument of notebookutils.notebook.run()", fr: "Passer l'ID de Workspace1 comme argument workspace de notebookutils.notebook.run()" } }
    - { id: c, text: { en: "Increase the timeout_seconds argument of notebookutils.notebook.run() to 1800", fr: "Augmenter l'argument timeout_seconds de notebookutils.notebook.run() à 1800" } }
    - { id: d, text: { en: "Call notebookutils.notebook.runMultiple() with a DAG that contains NB_Clean", fr: "Appeler notebookutils.notebook.runMultiple() avec un DAG qui contient NB_Clean" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A reference run works only when the child notebook uses the same lakehouse as the parent, inherits it, or neither defines one; otherwise the execution is blocked. Setting useRootDefaultLakehouse to True in the arguments makes the child use the default lakehouse of the root notebook, LH_Gold, without changing NB_Clean.
    fr: |
      Une exécution de référence ne fonctionne que si le notebook enfant utilise le même lakehouse que le parent, en hérite, ou si aucun des deux n'en définit ; sinon l'exécution est bloquée. Définir useRootDefaultLakehouse sur True dans les arguments fait utiliser à l'enfant le lakehouse par défaut du notebook racine, LH_Gold, sans modifier NB_Clean.
  options:
    b: { en: "Both notebooks are already in Workspace1; the workspace argument is for notebooks in another workspace.", fr: "Les deux notebooks sont déjà dans Workspace1 ; l'argument workspace sert aux notebooks d'un autre espace de travail." }
    c: { en: "The run is blocked because of the lakehouse mismatch, not because it times out.", fr: "L'exécution est bloquée à cause de la différence de lakehouse, pas parce qu'elle expire." }
    d: { en: "runMultiple() also performs reference runs, so the same lakehouse rule blocks NB_Clean.", fr: "runMultiple() effectue aussi des exécutions de référence : la même règle sur le lakehouse bloque NB_Clean." }
references:
  - title: NotebookUtils notebook run and orchestration for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/notebookutils/notebookutils-notebook-run
