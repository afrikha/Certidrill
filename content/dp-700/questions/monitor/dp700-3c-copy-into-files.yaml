id: dp700-3c-copy-into-files
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW_Finance. Every night, an external system exports one uncompressed CSV file of about 40 GB to Azure Data Lake Storage Gen2, and a COPY INTO statement loads the file into a table named stg.Ledger. The load takes much longer than expected.

    You can change how the external system writes the export.

    You need to reduce the duration of the load.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW_Finance. Chaque nuit, un système externe exporte un fichier CSV non compressé d'environ 40 Go vers Azure Data Lake Storage Gen2, et une instruction COPY INTO charge ce fichier dans une table nommée stg.Ledger. Le chargement prend beaucoup plus de temps que prévu.

    Vous pouvez modifier la façon dont le système externe écrit l'export.

    Vous devez réduire la durée du chargement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Split the export into many files of 100 MB to 1 GB each, and load the folder with COPY INTO.", fr: "Découper l'export en de nombreux fichiers de 100 Mo à 1 Go chacun, et charger le dossier avec COPY INTO." } }
    - { id: b, text: { en: "Load the file with one INSERT ... VALUES statement per batch of 1,000 rows.", fr: "Charger le fichier avec une instruction INSERT ... VALUES par lot de 1 000 lignes." } }
    - { id: c, text: { en: "Split the export into one file of about 10 KB per account.", fr: "Découper l'export en un fichier d'environ 10 Ko par compte." } }
    - { id: d, text: { en: "Disable V-Order on DW_Finance before the load, and enable it again after the load.", fr: "Désactiver V-Order sur DW_Finance avant le chargement, puis le réactiver après." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      COPY INTO is the recommended bulk load method, and its throughput depends on parallelism across files. Microsoft recommends files of 100 MB to 1 GB and as many files as possible while staying at or above 100 MB, so one 40 GB file becomes about 40 to 400 files that are loaded in parallel.
    fr: |
      COPY INTO est la méthode de chargement en bloc recommandée, et son débit dépend du parallélisme entre les fichiers. Microsoft recommande des fichiers de 100 Mo à 1 Go et autant de fichiers que possible tout en restant à 100 Mo ou plus : un fichier de 40 Go devient environ 40 à 400 fichiers chargés en parallèle.
  options:
    b:
      en: |
        Many small INSERT statements are trickle inserts; each one creates new Parquet files and they are far slower than a bulk load.
      fr: |
        De nombreuses petites instructions INSERT sont des insertions au compte-gouttes ; chacune crée de nouveaux fichiers Parquet, et elles sont bien plus lentes qu'un chargement en bloc.
    c:
      en: |
        Files below 100 MB add overhead; the recommended minimum file size is 100 MB.
      fr: |
        Des fichiers de moins de 100 Mo ajoutent une surcharge ; la taille minimale recommandée est de 100 Mo.
    d:
      en: |
        Disabling V-Order on a warehouse is irreversible, so it cannot be enabled again after the load.
      fr: |
        La désactivation de V-Order sur un entrepôt est irréversible : il ne peut pas être réactivé après le chargement.
references:
  - title: Performance guidelines in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
