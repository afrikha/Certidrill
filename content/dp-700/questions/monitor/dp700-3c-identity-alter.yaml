id: dp700-3c-identity-alter
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW_Sales that contains a table named dbo.DimCustomer. dbo.DimCustomer has 2 million rows and no surrogate key.

    You run the following statement, and it fails.

    `ALTER TABLE dbo.DimCustomer ADD CustomerKey bigint IDENTITY;`

    You need dbo.DimCustomer to have a CustomerKey column whose values are generated automatically for new rows.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW_Sales qui contient une table nommée dbo.DimCustomer. dbo.DimCustomer contient 2 millions de lignes et aucune clé de substitution.

    Vous exécutez l'instruction suivante, et elle échoue.

    `ALTER TABLE dbo.DimCustomer ADD CustomerKey bigint IDENTITY;`

    dbo.DimCustomer doit avoir une colonne CustomerKey dont les valeurs sont générées automatiquement pour les nouvelles lignes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the ALTER TABLE statement again with IDENTITY(1,1) to specify the seed and the increment.", fr: "Réexécuter l'instruction ALTER TABLE avec IDENTITY(1,1) pour préciser la valeur initiale et l'incrément." } }
    - { id: b, text: { en: "Run SET IDENTITY_INSERT dbo.DimCustomer ON, and then run the ALTER TABLE statement again.", fr: "Exécuter SET IDENTITY_INSERT dbo.DimCustomer ON, puis réexécuter l'instruction ALTER TABLE." } }
    - { id: c, text: { en: "Run the ALTER TABLE statement again with the int data type instead of bigint.", fr: "Réexécuter l'instruction ALTER TABLE avec le type de données int au lieu de bigint." } }
    - { id: d, text: { en: "Create a new table that defines CustomerKey as bigint IDENTITY, and then load it from dbo.DimCustomer.", fr: "Créer une nouvelle table qui définit CustomerKey en bigint IDENTITY, puis la charger à partir de dbo.DimCustomer." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ALTER TABLE cannot add an IDENTITY column to an existing table in Fabric Data Warehouse. You create a table that declares the column as bigint IDENTITY and copy the existing rows into it, for example with INSERT ... SELECT that lists the other columns; the warehouse then generates the key values.
    fr: |
      ALTER TABLE ne peut pas ajouter une colonne IDENTITY à une table existante dans Fabric Data Warehouse. Vous créez une table qui déclare la colonne en bigint IDENTITY et vous y copiez les lignes existantes, par exemple avec un INSERT ... SELECT qui liste les autres colonnes ; l'entrepôt génère alors les valeurs de clé.
  options:
    a:
      en: |
        Seed and increment values are not supported: the warehouse manages identity values internally. The column still cannot be added with ALTER TABLE.
      fr: |
        Les valeurs initiale et d'incrément ne sont pas prises en charge : l'entrepôt gère les valeurs d'identité en interne. La colonne ne peut toujours pas être ajoutée avec ALTER TABLE.
    b:
      en: |
        IDENTITY_INSERT allows explicit values to be inserted into an existing identity column; it does not let ALTER TABLE add one.
      fr: |
        IDENTITY_INSERT permet d'insérer des valeurs explicites dans une colonne d'identité existante ; il ne permet pas à ALTER TABLE d'en ajouter une.
    c:
      en: |
        Only bigint is supported for IDENTITY columns; another data type returns an error.
      fr: |
        Seul bigint est pris en charge pour les colonnes IDENTITY ; un autre type de données renvoie une erreur.
references:
  - title: IDENTITY Columns in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/identity
