id: dp700-3a-alerts-yesno
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a workspace named WS-Data that contains scheduled pipelines and notebooks. Some pipelines have several schedules. Engineers sometimes start the same pipelines manually by selecting Run. The team plans to use the failure notifications of the item schedules and Activator rules on Job events in Real-Time hub.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un espace de travail nommé WS-Data qui contient des pipelines et des notebooks planifiés. Certains pipelines ont plusieurs planifications. Les ingénieurs démarrent parfois manuellement les mêmes pipelines en sélectionnant Run. L'équipe prévoit d'utiliser les notifications d'échec des planifications des éléments et des règles Activator sur les événements de tâche (Job events) dans Real-Time hub.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a pipeline that an engineer started by selecting Run fails, the failure notification recipients of its schedule are notified.
        fr: Quand un pipeline qu'un ingénieur a démarré en sélectionnant Run échoue, les destinataires des notifications d'échec de sa planification sont prévenus.
    - id: s2
      text:
        en: An Activator rule on the Job events of a pipeline can run another pipeline when a run of the first pipeline fails.
        fr: Une règle Activator sur les événements de tâche d'un pipeline peut exécuter un autre pipeline quand une exécution du premier pipeline échoue.
    - id: s3
      text:
        en: For a pipeline that has several schedules, the failure notifications must be configured separately in each schedule.
        fr: Pour un pipeline qui a plusieurs planifications, les notifications d'échec doivent être configurées séparément dans chaque planification.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Failure notifications are sent only for failures of scheduled runs, not for manually triggered runs. An Activator rule on Job events can react to the ItemJobFailed event and run a Fabric activity, such as a pipeline, a notebook or a copy job. Failure notifications are configured at the item level and apply to all the schedules of the item.
    fr: |
      Les notifications d'échec ne sont envoyées que pour les échecs d'exécutions planifiées, pas pour les exécutions déclenchées manuellement. Une règle Activator sur les événements de tâche peut réagir à l'événement ItemJobFailed et exécuter une activité Fabric, comme un pipeline, un notebook ou une tâche de copie. Les notifications d'échec se configurent au niveau de l'élément et s'appliquent à toutes ses planifications.
references:
  - title: Job Scheduler in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
  - title: Set alerts on Job events in Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/set-alerts-fabric-job-events
