id: dp700-3a-alerts-yesno
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a workspace named WS-Data that contains scheduled pipelines and notebooks. Engineers sometimes start the same pipelines manually by selecting Run. The team plans to use the alerts of the Monitor hub.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un espace de travail nommé WS-Data qui contient des pipelines et des notebooks planifiés. Les ingénieurs démarrent parfois manuellement les mêmes pipelines en sélectionnant Run. L'équipe prévoit d'utiliser les alertes du hub de surveillance.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a pipeline that an engineer started by selecting Run fails, its schedule failure email recipients are notified.
        fr: Quand un pipeline qu'un ingénieur a démarré en sélectionnant Run échoue, les destinataires de ses e-mails d'échec de planification sont prévenus.
    - id: s2
      text:
        en: Activator-based alert rules created from the Job runs page are charged as Activator capacity usage.
        fr: Les règles d'alerte basées sur Activator créées depuis la page Job runs sont facturées comme une consommation de capacité Activator.
    - id: s3
      text:
        en: Before you create an Activator-based alert rule, you must create an eventhouse in WS-Data to store the alerts.
        fr: Avant de créer une règle d'alerte basée sur Activator, vous devez créer un eventhouse dans WS-Data pour stocker les alertes.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Schedule failure emails apply only to scheduled runs, not to manual runs. Activator-based alert rules are paid and billed as Activator capacity usage. They require workspace monitoring, which provisions a monitoring item to store the alerts; an eventhouse isn't required.
    fr: |
      Les e-mails d'échec de planification ne s'appliquent qu'aux exécutions planifiées, pas aux exécutions manuelles. Les règles d'alerte basées sur Activator sont payantes et facturées comme une consommation de capacité Activator. Elles demandent la supervision de l'espace de travail, qui provisionne un élément de supervision pour stocker les alertes ; un eventhouse n'est pas nécessaire.
references:
  - title: Set up job alerts in the Monitor hub (preview)
    url: https://learn.microsoft.com/en-us/fabric/admin/monitoring-hub-alerts
