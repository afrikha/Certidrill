id: dp700-3d-kql-unixtime
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database in a Fabric eventhouse. An eventstream ingests events into a table named Clicks. The event time is stored in a column named EventTimeMs of type long, as Unix time in milliseconds.

    All the dashboard queries filter on the event time, for example:

    ```kusto
    Clicks
    | where unixtime_milliseconds_todatetime(EventTimeMs) > ago(1h)
    | summarize count() by PageId
    ```

    The queries scan the whole table and are slow. You need to improve the performance of all the time-filtered queries. The solution must minimize the work done at query time.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL dans un eventhouse Fabric. Un eventstream ingère des événements dans une table nommée Clicks. L'heure de l'événement est stockée dans une colonne nommée EventTimeMs de type long, en temps Unix exprimé en millisecondes.

    Toutes les requêtes des tableaux de bord filtrent sur l'heure de l'événement, par exemple :

    ```kusto
    Clicks
    | where unixtime_milliseconds_todatetime(EventTimeMs) > ago(1h)
    | summarize count() by PageId
    ```

    Les requêtes analysent toute la table et sont lentes. Vous devez améliorer les performances de toutes les requêtes filtrées sur le temps. La solution doit réduire au minimum le travail effectué au moment de la requête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Use an update policy to write the events to a table that stores the event time in a datetime column, and filter on that column.", fr: "Utiliser une stratégie de mise à jour pour écrire les événements dans une table qui stocke l'heure de l'événement dans une colonne datetime, et filtrer sur cette colonne." } }
    - { id: b, text: { en: "Add an extend operator that computes the datetime value, and then filter on the calculated column.", fr: "Ajouter un opérateur extend qui calcule la valeur datetime, puis filtrer sur la colonne calculée." } }
    - { id: c, text: { en: "Increase the hot cache period of Clicks to include all the data in the table.", fr: "Augmenter la période de cache chaud de Clicks pour y inclure toutes les données de la table." } }
    - { id: d, text: { en: "Wrap the conversion in a stored function and call the function in each dashboard query.", fr: "Encapsuler la conversion dans une fonction stockée et appeler cette fonction dans chaque requête de tableau de bord." } }
answer: { optionId: a }
explanation:
  correct:
    en: "KQL best practices recommend storing time values in the datetime type rather than long, and converting Unix time to datetime at ingestion with an update policy instead of calling conversion functions in queries. A filter on a stored datetime column uses the time index to skip data shards, while a conversion in the where clause must be evaluated on every row."
    fr: "Les bonnes pratiques KQL recommandent de stocker les valeurs de temps dans le type datetime plutôt que long, et de convertir le temps Unix en datetime à l'ingestion avec une stratégie de mise à jour au lieu d'appeler des fonctions de conversion dans les requêtes. Un filtre sur une colonne datetime stockée utilise l'index temporel pour ignorer des partitions de données (shards), alors qu'une conversion dans la clause where doit être évaluée sur chaque ligne."
  options:
    b: { en: "Filtering on a calculated column still converts every row at query time and cannot use the index.", fr: "Filtrer sur une colonne calculée convertit toujours chaque ligne au moment de la requête et ne peut pas utiliser l'index." }
    c: { en: "A larger hot cache makes reads faster but the query still converts and scans every row.", fr: "Un cache chaud plus grand accélère les lectures, mais la requête convertit et analyse toujours chaque ligne." }
    d: { en: "A stored function only reuses the expression; the conversion still runs on every row of each query.", fr: "Une fonction stockée ne fait que réutiliser l'expression ; la conversion s'exécute toujours sur chaque ligne de chaque requête." }
references:
  - title: Best practices for Kusto Query Language queries
    url: https://learn.microsoft.com/en-us/kusto/query/best-practices?view=microsoft-fabric
