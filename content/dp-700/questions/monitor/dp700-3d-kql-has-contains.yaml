id: dp700-3d-kql-has-contains
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database in a Fabric eventhouse. The database contains a table named AppTraces with 8 billion rows. A Real-Time Dashboard tile runs the following query and takes more than 30 seconds:

    ```kusto
    AppTraces
    | where Timestamp > ago(1d)
    | where Message contains "timeout"
    | summarize count() by bin(Timestamp, 1h)
    ```

    The tile must count the messages that contain the whole word **timeout**. You need to reduce the duration of the query.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL dans un eventhouse Fabric. La base contient une table nommée AppTraces de 8 milliards de lignes. Une vignette d'un tableau de bord en temps réel exécute la requête suivante, qui dure plus de 30 secondes :

    ```kusto
    AppTraces
    | where Timestamp > ago(1d)
    | where Message contains "timeout"
    | summarize count() by bin(Timestamp, 1h)
    ```

    La vignette doit compter les messages qui contiennent le mot entier **timeout**. Vous devez réduire la durée de la requête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the second filter with: where Message has \"timeout\"", fr: "Remplacer le deuxième filtre par : where Message has \"timeout\"" } }
    - { id: b, text: { en: "Replace the second filter with: search \"timeout\"", fr: "Remplacer le deuxième filtre par : search \"timeout\"" } }
    - { id: c, text: { en: "Replace the second filter with: where Message matches regex \"timeout\"", fr: "Remplacer le deuxième filtre par : where Message matches regex \"timeout\"" } }
    - { id: d, text: { en: "Replace the second filter with: extend m = tolower(Message) | where m contains \"timeout\"", fr: "Remplacer le deuxième filtre par : extend m = tolower(Message) | where m contains \"timeout\"" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The has operator looks for whole terms by using the term index, while contains scans for substrings in every value. Because the tile needs the whole word timeout, has returns the expected rows and is much cheaper on a large table. The datetime filter already comes first, which is the other key practice."
    fr: "L'opérateur has recherche des termes entiers en utilisant l'index de termes, alors que contains recherche des sous-chaînes dans chaque valeur. Comme la vignette a besoin du mot entier timeout, has renvoie les lignes attendues et coûte beaucoup moins cher sur une grande table. Le filtre datetime vient déjà en premier, ce qui est l'autre bonne pratique essentielle."
  options:
    b: { en: "search without a column runs a full-text search across all columns, which costs more.", fr: "search sans colonne lance une recherche en texte intégral sur toutes les colonnes, ce qui coûte plus cher." }
    c: { en: "A regular expression is evaluated on each value and cannot use the term index.", fr: "Une expression régulière est évaluée sur chaque valeur et ne peut pas utiliser l'index de termes." }
    d: { en: "Filtering on a calculated column prevents the use of the index and adds a conversion of every row.", fr: "Filtrer sur une colonne calculée empêche l'utilisation de l'index et ajoute une conversion de chaque ligne." }
references:
  - title: Best practices for Kusto Query Language queries
    url: https://learn.microsoft.com/en-us/kusto/query/best-practices?view=microsoft-fabric
