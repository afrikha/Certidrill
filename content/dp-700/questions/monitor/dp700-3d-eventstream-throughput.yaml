id: dp700-3d-eventstream-throughput
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains an eventstream named ES1. ES1 has a custom endpoint source and a lakehouse destination named Lakehouse1. The **Event throughput** setting of ES1 is **Low**.

    The client applications now send about 60 MB of events per second to ES1. Events reach Lakehouse1 with a delay that keeps growing. The utilization of the Fabric capacity stays below 50 percent.

    You need to ensure that ES1 keeps up with the incoming events. Every event must still reach Lakehouse1.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un eventstream nommé ES1. ES1 a une source de point de terminaison personnalisé et une destination lakehouse nommée Lakehouse1. Le paramètre **Event throughput** d'ES1 est réglé sur **Low**.

    Les applications clientes envoient désormais environ 60 Mo d'événements par seconde à ES1. Les événements arrivent dans Lakehouse1 avec un retard qui ne cesse d'augmenter. L'utilisation de la capacité Fabric reste inférieure à 50 %.

    Vous devez faire en sorte qu'ES1 absorbe les événements entrants. Chaque événement doit toujours arriver dans Lakehouse1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the retention of ES1 from 1 day to 7 days.", fr: "Augmenter la rétention d'ES1 de 1 jour à 7 jours." } }
    - { id: b, text: { en: "Scale the Fabric capacity to the next larger SKU.", fr: "Passer la capacité Fabric à la SKU supérieure." } }
    - { id: c, text: { en: "Change the Event throughput setting of ES1 to Medium.", fr: "Régler le paramètre Event throughput d'ES1 sur Medium." } }
    - { id: d, text: { en: "Add a Filter operator before the Lakehouse1 destination.", fr: "Ajouter un opérateur Filter avant la destination Lakehouse1." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The Event throughput setting sizes the eventstream for its incoming and outgoing events: Low is for less than 10 MB/s and Medium for 10 to 100 MB/s. At 60 MB/s, ES1 needs the Medium level. If the eventstream has nodes that support pause and resume, you deactivate them while you change the setting."
    fr: "Le paramètre Event throughput dimensionne l'eventstream pour ses événements entrants et sortants : Low correspond à moins de 10 Mo/s et Medium à 10 à 100 Mo/s. À 60 Mo/s, ES1 a besoin du niveau Medium. Si l'eventstream contient des nœuds qui prennent en charge la pause et la reprise, vous les désactivez pendant le changement du paramètre."
  options:
    a: { en: "Retention only defines how long events stay available; it does not increase the processing rate.", fr: "La rétention définit seulement la durée pendant laquelle les événements restent disponibles ; elle n'augmente pas le débit de traitement." }
    b: { en: "The capacity is not saturated; the limit comes from the throughput level of the eventstream.", fr: "La capacité n'est pas saturée ; la limite vient du niveau de débit de l'eventstream." }
    d: { en: "A filter drops events, but every event must reach Lakehouse1.", fr: "Un filtre écarte des événements, alors que chaque événement doit arriver dans Lakehouse1." }
references:
  - title: Configure settings for a Fabric eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/configure-settings
