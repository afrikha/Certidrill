id: dp700-3b-spark-session-settings
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains notebooks used by analysts and by scheduled jobs.

    You receive the following reports:

    - Analysts lose their cached DataFrames because their interactive sessions expire after 20 minutes. They need sessions to stay available for two hours.
    - Last week, a user-submitted Spark job ran for 30 hours because of a coding error. Such jobs must be stopped automatically after six hours.

    Which workspace setting should you configure for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient des notebooks utilisés par des analystes et par des tâches planifiées.

    Vous recevez les signalements suivants :

    - Les analystes perdent leurs DataFrames mis en cache parce que leurs sessions interactives expirent au bout de 20 minutes. Ils ont besoin que les sessions restent disponibles pendant deux heures.
    - La semaine dernière, une tâche Spark soumise par un utilisateur s'est exécutée pendant 30 heures à cause d'une erreur de code. Ces tâches doivent être arrêtées automatiquement au bout de six heures.

    Quel paramètre de l'espace de travail devez-vous configurer pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Keep interactive sessions available for two hours: [[a]]

      Stop user-submitted jobs that run longer than six hours: [[b]]
    fr: |
      Garder les sessions interactives disponibles pendant deux heures : [[a]]

      Arrêter les tâches soumises par les utilisateurs qui durent plus de six heures : [[b]]
  slots:
    - id: a
      options:
        - { id: a-timeout, text: Spark session timeout }
        - { id: a-lifetime, text: Set maximum job lifetime }
        - { id: a-reserve, text: Reserve maximum cores for active Spark jobs }
        - { id: a-hc, text: { en: "High concurrency mode for notebooks", fr: "Mode haute concurrence pour les notebooks" } }
    - id: b
      options:
        - { id: b-reserve, text: Reserve maximum cores for active Spark jobs }
        - { id: b-timeout, text: Spark session timeout }
        - { id: b-hc, text: { en: "High concurrency mode for notebooks", fr: "Mode haute concurrence pour les notebooks" } }
        - { id: b-lifetime, text: Set maximum job lifetime }
answer:
  values: { a: a-timeout, b: b-lifetime }
explanation:
  correct:
    en: |
      Spark session timeout customizes the expiry of all interactive notebook sessions, which is 20 minutes by default. Set maximum job lifetime is a guardrail that terminates any user-submitted Spark job running longer than the configured duration; system-managed jobs aren't affected.
    fr: |
      Spark session timeout personnalise l'expiration de toutes les sessions interactives de notebook, fixée à 20 minutes par défaut. Set maximum job lifetime est un garde-fou qui arrête toute tâche Spark soumise par un utilisateur et dont la durée dépasse la valeur configurée ; les tâches gérées par le système ne sont pas concernées.
  options:
    a-reserve: { en: "Reserving maximum cores turns off optimistic job admission; it doesn't change session expiry or job duration.", fr: "Réserver le nombre maximal de cœurs désactive l'admission optimiste des tâches ; cela ne change ni l'expiration des sessions ni la durée des tâches." }
    a-hc: { en: "High concurrency lets several notebooks share one session; it doesn't extend the session timeout or stop long jobs.", fr: "La haute concurrence permet à plusieurs notebooks de partager une session ; elle ne prolonge pas le délai d'expiration et n'arrête pas les tâches longues." }
references:
  - title: Workspace administration settings in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
