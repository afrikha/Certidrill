id: dp700-3a-refresh-inactivity
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Fabric workspace that contains an import-mode semantic model named SM_Returns. SM_Returns had a daily refresh schedule, and the reports that use it were used only during an annual audit.

    The owner of SM_Returns received an email, and the refresh schedule now shows Disabled. The refresh history shows no failed refresh. The audit starts next week, and SM_Returns must be refreshed daily again.

    What should you do?
  fr: |
    Fabrikam dispose d'un espace de travail Fabric qui contient un modèle sémantique en mode importation nommé SM_Returns. SM_Returns avait une planification d'actualisation quotidienne, et les rapports qui l'utilisent ne servaient que pendant un audit annuel.

    Le propriétaire de SM_Returns a reçu un e-mail, et la planification d'actualisation affiche maintenant Disabled. L'historique des actualisations ne montre aucun échec d'actualisation. L'audit commence la semaine prochaine, et SM_Returns doit de nouveau être actualisé chaque jour.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Update the credentials of the data source of SM_Returns, then apply the schedule", fr: "Mettre à jour les informations d'identification de la source de données de SM_Returns, puis appliquer la planification" } }
    - { id: b, text: { en: "Take over SM_Returns, then reduce the schedule to one refresh a week", fr: "Prendre en charge SM_Returns, puis réduire la planification à une actualisation par semaine" } }
    - { id: c, text: { en: "Move the workspace to a Fabric capacity, then recreate the schedule", fr: "Déplacer l'espace de travail vers une capacité Fabric, puis recréer la planification" } }
    - { id: d, text: { en: "Open a report that uses SM_Returns, then turn the refresh schedule back on", fr: "Ouvrir un rapport qui utilise SM_Returns, puis réactiver la planification d'actualisation" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Power BI pauses scheduled refresh after two months during which no one viewed a dashboard or report built on the semantic model, emails the owner and shows the schedule as Disabled. To resume, you open a report or dashboard that uses the model and turn the schedule back on if needed.
    fr: |
      Power BI suspend l'actualisation planifiée après deux mois pendant lesquels personne n'a consulté de tableau de bord ou de rapport basé sur le modèle sémantique, envoie un e-mail au propriétaire et affiche la planification comme Disabled. Pour reprendre, vous ouvrez un rapport ou un tableau de bord qui utilise le modèle et réactivez la planification si nécessaire.
  options:
    a:
      en: |
        Expired credentials deactivate the schedule after a failed refresh, but the history shows no failure: the schedule was paused for inactivity.
      fr: |
        Des informations d'identification expirées désactivent la planification après un échec d'actualisation, mais l'historique ne montre aucun échec : la planification a été suspendue pour inactivité.
    b:
      en: |
        Taking over changes the owner, and a weekly schedule doesn't meet the daily requirement; neither action resumes a schedule paused for inactivity.
      fr: |
        La prise en charge change le propriétaire, et une planification hebdomadaire ne satisfait pas l'exigence quotidienne ; aucune de ces actions ne reprend une planification suspendue pour inactivité.
    c:
      en: |
        Capacity type changes the maximum number of scheduled refreshes, not the inactivity pause.
      fr: |
        Le type de capacité change le nombre maximal d'actualisations planifiées, pas la suspension pour inactivité.
references:
  - title: Configure scheduled refresh
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-scheduled-refresh
