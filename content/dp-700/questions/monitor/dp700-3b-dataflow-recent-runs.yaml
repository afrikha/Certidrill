id: dp700-3b-dataflow-recent-runs
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_CRM and a Dataflow Gen2 named DF_Customers. DF_Customers contains five queries. Each query has a data destination that is a table in LH_CRM.

    The last scheduled refresh of DF_Customers failed.

    You need to identify which query failed to load and view the error message of that load.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_CRM et un Dataflow Gen2 nommé DF_Customers. DF_Customers contient cinq requêtes. Chaque requête a une destination de données qui est une table de LH_CRM.

    La dernière actualisation planifiée de DF_Customers a échoué.

    Vous devez identifier la requête dont le chargement a échoué et afficher le message d'erreur de ce chargement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Open Recent runs of DF_Customers, select the failed run, and review its tables and activities", fr: "Ouvrir Recent runs de DF_Customers, sélectionner l'exécution en échec et examiner ses tables et ses activités" } }
    - { id: b, text: { en: "Open Recent runs of DF_Customers, select the failed run, and select Download CSV", fr: "Ouvrir Recent runs de DF_Customers, sélectionner l'exécution en échec et sélectionner Download CSV" } }
    - { id: c, text: { en: "Open the Microsoft Fabric Capacity Metrics app and filter the items on DF_Customers", fr: "Ouvrir l'application Microsoft Fabric Capacity Metrics et filtrer les éléments sur DF_Customers" } }
    - { id: d, text: { en: "Open LH_CRM and review the properties of each destination table", fr: "Ouvrir LH_CRM et examiner les propriétés de chaque table de destination" } }
answer: { optionId: a }
explanation:
  correct: 
    en: |
      The refresh history (Recent runs) lists each run; selecting a run shows its details, with a Tables section for the loaded entities and an Activities section for actions such as writing to a destination. Opening the failed table or activity shows its status and error, which identifies the failing query.
    fr: |
      L'historique d'actualisation (Recent runs) liste chaque exécution ; sélectionner une exécution affiche ses détails, avec une section Tables pour les entités chargées et une section Activities pour les actions comme l'écriture dans une destination. Ouvrir la table ou l'activité en échec affiche son statut et son erreur, ce qui identifie la requête fautive.
  options:
    b: { en: "Download CSV exports the list of refreshes, not the error of each query load.", fr: "Download CSV exporte la liste des actualisations, pas l'erreur du chargement de chaque requête." }
    c: { en: "The Capacity Metrics app reports capacity consumption, not refresh errors per query.", fr: "L'application Capacity Metrics présente la consommation de la capacité, pas les erreurs d'actualisation par requête." }
    d: { en: "Table properties don't contain the errors of the dataflow refresh.", fr: "Les propriétés des tables ne contiennent pas les erreurs de l'actualisation du dataflow." }
references:
  - title: View refresh history and monitor your dataflows
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor
