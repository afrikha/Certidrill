id: dp700-3d-staging-softdelete
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a KQL database named DB4 in a Fabric eventhouse. An eventstream ingests raw JSON events into a table named StagingEvents. A transactional update policy on a table named Events transforms each batch ingested into StagingEvents.

    No user or process queries StagingEvents. The retention policies of the database and of both tables use the default values.

    You need to minimize the storage and the background processing that StagingEvents consumes. Events must keep receiving all the transformed rows.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL nommée DB4 dans un eventhouse Fabric. Un eventstream ingère des événements JSON bruts dans une table nommée StagingEvents. Une stratégie de mise à jour transactionnelle définie sur une table nommée Events transforme chaque lot ingéré dans StagingEvents.

    Aucun utilisateur ni aucun processus n'interroge StagingEvents. Les stratégies de rétention de la base et des deux tables utilisent les valeurs par défaut.

    Vous devez réduire au minimum le stockage et le traitement en arrière-plan que consomme StagingEvents. Events doit continuer à recevoir toutes les lignes transformées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the caching policy of StagingEvents to 0 days.", fr: "Définir la stratégie de mise en cache de StagingEvents sur 0 jour." } }
    - { id: b, text: { en: "Set the retention policy of DB4 to a soft-delete period of 0 seconds.", fr: "Définir la stratégie de rétention de DB4 sur une période de suppression réversible de 0 seconde." } }
    - { id: c, text: { en: "Replace the update policy with a materialized view on StagingEvents.", fr: "Remplacer la stratégie de mise à jour par une vue matérialisée sur StagingEvents." } }
    - { id: d, text: { en: "Set the retention policy of StagingEvents to a soft-delete period of 0 seconds.", fr: "Définir la stratégie de rétention de StagingEvents sur une période de suppression réversible de 0 seconde." } }
answer: { optionId: d }
explanation:
  correct:
    en: "When a source table is only used to feed an update policy, setting its soft-delete period to 0 seconds removes the source data right after the transformation, which saves storage and reduces grooming overhead. The update policies that use such a table must be transactional, which is already the case. Events keeps its own retention, so the transformed rows are kept."
    fr: "Quand une table source ne sert qu'à alimenter une stratégie de mise à jour, définir sa période de suppression réversible sur 0 seconde supprime les données sources juste après la transformation, ce qui économise du stockage et réduit le travail de nettoyage. Les stratégies de mise à jour qui utilisent une telle table doivent être transactionnelles, ce qui est déjà le cas. Events conserve sa propre rétention : les lignes transformées sont conservées."
  options:
    a: { en: "A caching policy only moves data out of the hot cache; the rows are still stored.", fr: "Une stratégie de mise en cache ne fait que sortir les données du cache chaud ; les lignes restent stockées." }
    b: { en: "A database-level retention applies to Events too, because Events has no table-level policy, so the transformed rows would be deleted.", fr: "Une rétention au niveau de la base s'applique aussi à Events, qui n'a pas de stratégie de table : les lignes transformées seraient supprimées." }
    c: { en: "A materialized view stores an aggregation; StagingEvents would still keep all its raw rows.", fr: "Une vue matérialisée stocke une agrégation ; StagingEvents conserverait toujours toutes ses lignes brutes." }
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
