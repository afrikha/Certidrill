id: dp700-3b-notebook-exit-try
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a notebook named NB_Count and a pipeline named PL_Check. A Notebook activity in PL_Check runs NB_Count, and the next activity reads the exit value of NB_Count.

    The last cell of NB_Count contains the following code.

    ```python
    try:
        row_count = df.count()
        notebookutils.notebook.exit(str(row_count))
    except Exception as e:
        print(e)
    ```

    The cell runs without error, but the exit value isn't returned as expected.

    You need NB_Count to return the row count as its exit value.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un notebook nommé NB_Count et un pipeline nommé PL_Check. Une activité Notebook de PL_Check exécute NB_Count, et l'activité suivante lit la valeur de sortie de NB_Count.

    La dernière cellule de NB_Count contient le code suivant.

    ```python
    try:
        row_count = df.count()
        notebookutils.notebook.exit(str(row_count))
    except Exception as e:
        print(e)
    ```

    La cellule s'exécute sans erreur, mais la valeur de sortie n'est pas renvoyée comme prévu.

    NB_Count doit renvoyer le nombre de lignes comme valeur de sortie.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace notebookutils.notebook.exit() with mssparkutils.notebook.exit()", fr: "Remplacer notebookutils.notebook.exit() par mssparkutils.notebook.exit()" } }
    - { id: b, text: { en: "Pass row_count to exit() as an integer instead of a string", fr: "Passer row_count à exit() sous forme d'entier plutôt que de chaîne" } }
    - { id: c, text: { en: "Increase the timeout of the Notebook activity in PL_Check", fr: "Augmenter le délai d'expiration de l'activité Notebook dans PL_Check" } }
    - { id: d, text: { en: "Call notebookutils.notebook.exit() at the top level of a separate final cell, outside the try block", fr: "Appeler notebookutils.notebook.exit() au niveau supérieur d'une dernière cellule distincte, en dehors du bloc try" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      notebookutils.notebook.exit() doesn't take effect when it's wrapped in exception handling, so it must be called at the top level of the code. Because exit() also overwrites the output of its cell, Microsoft recommends putting it in a separate cell. In a pipeline run, the Notebook activity then returns the value and the session stops.
    fr: |
      notebookutils.notebook.exit() ne prend pas effet quand il est encapsulé dans une gestion d'exceptions : il doit être appelé au niveau supérieur du code. Comme exit() remplace aussi la sortie de sa cellule, Microsoft recommande de le placer dans une cellule distincte. Dans une exécution de pipeline, l'activité Notebook renvoie alors la valeur et la session s'arrête.
  options:
    a: { en: "mssparkutils is the former name of the same utilities and behaves the same way inside try/except.", fr: "mssparkutils est l'ancien nom des mêmes utilitaires et se comporte de la même façon dans un try/except." }
    b: { en: "Exit values are always strings; converting the value doesn't change the try/except problem.", fr: "Les valeurs de sortie sont toujours des chaînes ; convertir la valeur ne règle pas le problème du try/except." }
    c: { en: "The notebook doesn't time out; the exit call is ignored because of the exception handling.", fr: "Le notebook n'expire pas ; l'appel à exit est ignoré à cause de la gestion d'exceptions." }
references:
  - title: NotebookUtils notebook run and orchestration for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/notebookutils/notebookutils-notebook-run
