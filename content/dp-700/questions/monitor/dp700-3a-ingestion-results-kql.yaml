id: dp700-3a-ingestion-results-kql
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a workspace named WS-Telemetry that contains an eventhouse named EH-Plant. EH-Plant contains a KQL database named PlantDB. Several applications ingest files into the tables of PlantDB by using queued ingestion. Workspace monitoring isn't enabled for WS-Telemetry.

    You need a KQL query that returns, for the last 10 days, the number of permanent ingestion failures for each table of PlantDB.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un espace de travail nommé WS-Telemetry qui contient un eventhouse nommé EH-Plant. EH-Plant contient une base de données KQL nommée PlantDB. Plusieurs applications ingèrent des fichiers dans les tables de PlantDB par ingestion en file d'attente. La supervision de l'espace de travail n'est pas activée pour WS-Telemetry.

    Vous avez besoin d'une requête KQL qui renvoie, pour les 10 derniers jours, le nombre d'échecs d'ingestion permanents pour chaque table de PlantDB.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    .show ingestion failures
    | where FailedOn > [[time]]
    | where [[kind]] == "Permanent"
    | summarize Failures = count() by [[col]]
  slots:
    - id: time
      options:
        - { id: now, text: now(10d) }
        - { id: raw, text: 10d }
        - { id: ago, text: ago(10d) }
    - id: kind
      options:
        - { id: code, text: ErrorCode }
        - { id: fk, text: FailureKind }
        - { id: op, text: OperationKind }
    - id: col
      options:
        - { id: db, text: Database }
        - { id: src, text: IngestionSourcePath }
        - { id: opid, text: OperationId }
        - { id: table, text: Table }
answer:
  values: { time: ago, kind: fk, col: table }
explanation:
  correct:
    en: |
      `.show ingestion failures` returns the ingestion failures that are kept for 14 days, which covers the last 10 days, and its output can be filtered and summarized. `ago(10d)` returns the time 10 days before now, `FailureKind` takes the values Permanent or Transient, and grouping by `Table` gives one count per table.
    fr: |
      `.show ingestion failures` renvoie les échecs d'ingestion conservés 14 jours, ce qui couvre les 10 derniers jours, et sa sortie peut être filtrée et agrégée. `ago(10d)` renvoie l'heure qu'il était il y a 10 jours, `FailureKind` prend les valeurs Permanent ou Transient, et le regroupement par `Table` donne un nombre par table.
  options:
    now: { en: "now(10d) returns a time 10 days in the future, so no failure matches.", fr: "now(10d) renvoie une heure située 10 jours dans le futur : aucun échec ne correspond." }
    raw: { en: "A timespan can't be compared with the datetime value of FailedOn.", fr: "Une durée ne peut pas être comparée à la valeur datetime de FailedOn." }
    code: { en: "ErrorCode holds the ingestion error code, not the Permanent or Transient type.", fr: "ErrorCode contient le code d'erreur d'ingestion, pas le type Permanent ou Transient." }
    op: { en: "OperationKind is the ingestion phase during which the failure was registered.", fr: "OperationKind est la phase d'ingestion pendant laquelle l'échec a été enregistré." }
    db: { en: "Database groups by KQL database, which returns a single group for PlantDB.", fr: "Database regroupe par base de données KQL, ce qui renvoie un seul groupe pour PlantDB." }
    src: { en: "IngestionSourcePath groups by source file or blob, not by table.", fr: "IngestionSourcePath regroupe par fichier ou objet blob source, pas par table." }
    opid: { en: "OperationId groups by ingestion operation, not by table.", fr: "OperationId regroupe par opération d'ingestion, pas par table." }
references:
  - title: .show ingestion failures command
    url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures?view=microsoft-fabric
