id: dp700-3b-leaf-status-hotarea
objective: "3.2.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Nightly. Last night's run of PL_Nightly has the status Failed. The following table shows the activity runs and the dependencies of each activity. No other activity or dependency exists in PL_Nightly.

    Select the activity whose outcome causes the pipeline run to be reported as Failed.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Nightly. L'exécution de PL_Nightly de la nuit dernière a le statut Failed. Le tableau suivant présente les exécutions d'activités et les dépendances de chaque activité. PL_Nightly ne contient aucune autre activité ni dépendance.

    Sélectionnez l'activité dont le résultat fait signaler l'exécution du pipeline comme Failed.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Activity that causes the Failed status of the run", fr: "Activité qui provoque le statut Failed de l'exécution" }
  grid:
    header: [{ en: Activity, fr: Activité }, { en: Dependency, fr: Dépendance }, { en: Status, fr: Statut }]
    rows:
      - [{ text: Copy Products, area: copy-products }, { text: { en: "None", fr: "Aucune" } }, { text: Failed }]
      - [{ text: Log Products, area: log-products }, { text: "Copy Products (Upon Failure)" }, { text: Succeeded }]
      - [{ text: Copy Prices, area: copy-prices }, { text: { en: "None", fr: "Aucune" } }, { text: Failed }]
      - [{ text: Merge Prices, area: merge-prices }, { text: "Copy Prices (Upon Success)" }, { text: Skipped }]
      - [{ text: Log Prices, area: log-prices }, { text: "Copy Prices (Upon Failure)" }, { text: Succeeded }]
answer:
  values: { p1: copy-prices }
explanation:
  correct:
    en: |
      The pipeline status is computed from the leaf activities: Log Products, Merge Prices and Log Prices. When a leaf was skipped, its parent is evaluated instead, so Merge Prices is replaced by Copy Prices, which failed (Do-If-Else pattern). Copy Products isn't a leaf: its failure is handled by Log Products, which succeeded (Try-Catch pattern), so it doesn't fail the run.
    fr: |
      Le statut du pipeline est calculé à partir des activités feuilles : Log Products, Merge Prices et Log Prices. Quand une feuille a été ignorée, c'est son parent qui est évalué : Merge Prices est donc remplacée par Copy Prices, qui a échoué (modèle Do-If-Else). Copy Products n'est pas une feuille : son échec est traité par Log Products, qui a réussi (modèle Try-Catch), et ne fait donc pas échouer l'exécution.
references:
  - title: Pipeline failure and error message
    url: https://learn.microsoft.com/en-us/azure/data-factory/tutorial-pipeline-failure-error-handling
