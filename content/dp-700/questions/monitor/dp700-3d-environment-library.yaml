id: dp700-3d-environment-library
objective: "3.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS4 that contains 30 notebooks. Every notebook uses the **Workspace default** environment option, and its first cell runs `%pip install` to install the same public library from PyPI, which adds about one minute to each run.

    You need all the notebooks of WS4 to get the library without running `%pip install`. You are a workspace admin of WS4.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS4 qui contient 30 notebooks. Chaque notebook utilise l'option d'environnement **Workspace default**, et sa première cellule exécute `%pip install` pour installer la même bibliothèque publique de PyPI, ce qui ajoute environ une minute à chaque exécution.

    Tous les notebooks de WS4 doivent obtenir la bibliothèque sans exécuter `%pip install`. Vous êtes administrateur de l'espace de travail WS4.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create an environment named Env4.", fr: "Créer un environnement nommé Env4." } }
    - { id: addlib, text: { en: "In the Libraries section of Env4, add the library as a public library from PyPI.", fr: "Dans la section Libraries d'Env4, ajouter la bibliothèque comme bibliothèque publique de PyPI." } }
    - { id: publish, text: { en: "Save and publish Env4.", fr: "Enregistrer et publier Env4." } }
    - { id: default, text: { en: "In the Spark settings of WS4, turn on Set default environment and select Env4.", fr: "Dans les paramètres Spark de WS4, activer Set default environment et sélectionner Env4." } }
    - { id: resources, text: { en: "Upload the library package to the Resources section of Env4.", fr: "Charger le package de la bibliothèque dans la section Resources d'Env4." } }
    - { id: pool, text: { en: "Create a custom Spark pool with Large nodes and set it as the default pool of WS4.", fr: "Créer un pool Spark personnalisé avec des nœuds Large et le définir comme pool par défaut de WS4." } }
answer:
  sequence: [ create, addlib, publish, default ]
explanation:
  correct:
    en: "Libraries installed in an environment replace per-run `%pip` commands. Changes to the Libraries section are only staged when you save them and take effect when you publish the environment. Turning on Set default environment in the workspace Spark settings makes every notebook that uses Workspace default inherit the libraries and compute configuration of Env4."
    fr: "Les bibliothèques installées dans un environnement remplacent les commandes `%pip` exécutées à chaque fois. Les modifications de la section Libraries sont seulement mises en attente à l'enregistrement et prennent effet à la publication de l'environnement. Activer Set default environment dans les paramètres Spark de l'espace de travail fait hériter à chaque notebook qui utilise Workspace default les bibliothèques et la configuration de calcul d'Env4."
  options:
    resources: { en: "The Resources section stores files for the notebooks; it does not install libraries.", fr: "La section Resources stocke des fichiers pour les notebooks ; elle n'installe pas de bibliothèques." }
    pool: { en: "Node size does not install libraries, and a custom pool starts more slowly than the starter pool.", fr: "La taille des nœuds n'installe pas de bibliothèques, et un pool personnalisé démarre plus lentement que le pool de démarrage." }
references:
  - title: Create, configure, and use an environment in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/create-and-use-environment
