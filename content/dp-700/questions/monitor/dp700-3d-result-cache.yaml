id: dp700-3d-result-cache
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW2. Result set caching uses its default setting on DW2. A table named FactSales contains 500 million rows and is loaded once per night.

    A dashboard runs the following query every minute. The query returns 30 rows.

    ```sql
    SELECT StoreId, SUM(Amount) AS Sales
    FROM dbo.FactSales
    WHERE OrderDate >= DATEADD(day, -7, CAST(GETDATE() AS date))
    GROUP BY StoreId;
    ```

    In queryinsights.exec_requests_history, the result_cache_hit column is 0 for every execution of this query. You need the repeated executions to be served from the result set cache.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW2. La mise en cache des jeux de résultats utilise son paramètre par défaut sur DW2. Une table nommée FactSales contient 500 millions de lignes et est chargée une fois par nuit.

    Un tableau de bord exécute la requête suivante toutes les minutes. La requête renvoie 30 lignes.

    ```sql
    SELECT StoreId, SUM(Amount) AS Sales
    FROM dbo.FactSales
    WHERE OrderDate >= DATEADD(day, -7, CAST(GETDATE() AS date))
    GROUP BY StoreId;
    ```

    Dans queryinsights.exec_requests_history, la colonne result_cache_hit vaut 0 pour chaque exécution de cette requête. Les exécutions répétées doivent être servies depuis le cache des jeux de résultats.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run ALTER DATABASE DW2 SET RESULT_SET_CACHING ON.", fr: "Exécuter ALTER DATABASE DW2 SET RESULT_SET_CACHING ON." } }
    - { id: b, text: { en: "Have the dashboard pass the start date as a literal value instead of calling GETDATE().", fr: "Faire transmettre par le tableau de bord la date de début sous forme de valeur littérale au lieu d'appeler GETDATE()." } }
    - { id: c, text: { en: "Run the query inside an explicit transaction with BEGIN TRANSACTION and COMMIT.", fr: "Exécuter la requête dans une transaction explicite avec BEGIN TRANSACTION et COMMIT." } }
    - { id: d, text: { en: "Run UPDATE STATISTICS on the OrderDate column of FactSales after each nightly load.", fr: "Exécuter UPDATE STATISTICS sur la colonne OrderDate de FactSales après chaque chargement nocturne." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Result set caching is enabled by default on Fabric warehouses and SQL analytics endpoints, and it stores the final result of eligible SELECT queries. A query that uses runtime constants such as GETDATE() is not eligible, which is why result_cache_hit stays 0 (not applicable). With a literal date, the query qualifies: the first run creates the cache (1) and later runs hit it (2) until FactSales changes."
    fr: "La mise en cache des jeux de résultats est activée par défaut sur les entrepôts Fabric et les points de terminaison d'analytique SQL, et elle stocke le résultat final des requêtes SELECT éligibles. Une requête qui utilise des constantes d'exécution comme GETDATE() n'est pas éligible, d'où la valeur 0 (non applicable) de result_cache_hit. Avec une date littérale, la requête devient éligible : la première exécution crée le cache (1) et les suivantes l'utilisent (2) jusqu'à la modification de FactSales."
  options:
    a: { en: "Result set caching is already on by default; the query itself is not eligible.", fr: "La mise en cache des jeux de résultats est déjà activée par défaut ; c'est la requête elle-même qui n'est pas éligible." }
    c: { en: "Queries inside an explicit transaction are not eligible for result set caching either.", fr: "Les requêtes exécutées dans une transaction explicite ne sont pas non plus éligibles à la mise en cache des jeux de résultats." }
    d: { en: "Statistics help the optimizer choose a plan; they do not make the query eligible for the cache.", fr: "Les statistiques aident l'optimiseur à choisir un plan ; elles ne rendent pas la requête éligible au cache." }
references:
  - title: Result set caching
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/result-set-caching
