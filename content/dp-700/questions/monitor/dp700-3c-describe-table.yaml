id: dp700-3c-describe-table
objective: "3.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric lakehouse that contains a Delta table named silver.telemetry. Before you change the maintenance settings of silver.telemetry, you need to review its current state from a notebook.

    The code must return the following information:

    - The current number of data files, the total size, and the table properties, including the evaluated adaptive target file size.
    - The list of the write and maintenance operations that were committed on the table.

    How should you complete the PySpark code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric qui contient une table Delta nommée silver.telemetry. Avant de modifier les paramètres de maintenance de silver.telemetry, vous devez examiner son état actuel depuis un notebook.

    Le code doit renvoyer les informations suivantes :

    - Le nombre actuel de fichiers de données, la taille totale et les propriétés de la table, y compris la taille cible de fichier adaptative évaluée.
    - La liste des opérations d'écriture et de maintenance validées sur la table.

    Comment devez-vous compléter le code PySpark ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    spark.sql("[[c1]] silver.telemetry") \
        .select("numFiles", "sizeInBytes", "properties").show(truncate=False)

    spark.sql("[[c2]] silver.telemetry") \
        .select("version", "timestamp", "operation").show()
  slots:
    - id: c1
      options:
        - { id: detail, text: DESCRIBE DETAIL }
        - { id: history, text: DESCRIBE HISTORY }
        - { id: tblprops, text: SHOW TBLPROPERTIES }
        - { id: extended, text: DESCRIBE TABLE EXTENDED }
    - id: c2
      options:
        - { id: detail, text: DESCRIBE DETAIL }
        - { id: history, text: DESCRIBE HISTORY }
        - { id: tblprops, text: SHOW TBLPROPERTIES }
        - { id: extended, text: DESCRIBE TABLE EXTENDED }
answer:
  values: { c1: detail, c2: history }
explanation:
  correct:
    en: |
      DESCRIBE DETAIL returns one row that describes the current table, with columns such as numFiles, sizeInBytes and properties; the delta.targetFileSize.adaptive property shows the evaluated target size. DESCRIBE HISTORY returns one row per commit, with the version, the timestamp and the operation, such as WRITE, MERGE or OPTIMIZE, which shows the write and maintenance patterns.
    fr: |
      DESCRIBE DETAIL renvoie une ligne qui décrit la table actuelle, avec des colonnes comme numFiles, sizeInBytes et properties ; la propriété delta.targetFileSize.adaptive indique la taille cible évaluée. DESCRIBE HISTORY renvoie une ligne par validation, avec la version, l'horodatage et l'opération, par exemple WRITE, MERGE ou OPTIMIZE, ce qui montre les modèles d'écriture et de maintenance.
  options:
    tblprops:
      en: |
        SHOW TBLPROPERTIES returns key and value pairs only, without the file count or size.
      fr: |
        SHOW TBLPROPERTIES ne renvoie que des paires clé-valeur, sans le nombre ni la taille des fichiers.
    extended:
      en: |
        DESCRIBE TABLE EXTENDED returns the columns and general metadata of the table as rows of names and values, not a numFiles column or the commit history.
      fr: |
        DESCRIBE TABLE EXTENDED renvoie les colonnes et les métadonnées générales de la table sous forme de lignes de noms et de valeurs, pas une colonne numFiles ni l'historique des validations.
references:
  - title: Cross-Workload Table Maintenance and Optimization in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/table-maintenance-optimization
  - title: Tune File Size
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/tune-file-size
