id: dp700-3a-dataflow-logs-order
objective: "3.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You have a workspace that contains a Dataflow Gen2 named DF_Orders. Yesterday's refresh of DF_Orders failed. Microsoft support asks you for the Power Query mashup engine logs of that refresh.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail qui contient un Dataflow Gen2 nommé DF_Orders. L'actualisation de DF_Orders d'hier a échoué. Le support Microsoft vous demande les journaux du moteur mashup Power Query de cette actualisation.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: recent, text: { en: "In the workspace, open the menu of DF_Orders and select Recent runs.", fr: "Dans l'espace de travail, ouvrir le menu de DF_Orders et sélectionner Recent runs." } }
    - { id: select, text: { en: "Select the start time of yesterday's refresh to open its details.", fr: "Sélectionner l'heure de début de l'actualisation d'hier pour ouvrir ses détails." } }
    - { id: download, text: { en: "Select Download detailed logs.", fr: "Sélectionner Download detailed logs." } }
    - { id: validate, text: { en: "Open DF_Orders in the editor and run the validation.", fr: "Ouvrir DF_Orders dans l'éditeur et lancer la validation." } }
    - { id: csv, text: { en: "Select several runs and download them as a CSV file.", fr: "Sélectionner plusieurs exécutions et les télécharger dans un fichier CSV." } }
    - { id: capacity, text: { en: "Open the Capacity and cost page of the Monitor hub.", fr: "Ouvrir la page Capacity and cost du hub de surveillance." } }
answer:
  sequence: [recent, select, download]
explanation:
  correct:
    en: |
      Recent runs opens the refresh history of the dataflow. Selecting a run opens its details, and Download detailed logs, at the bottom of the details screen, downloads a ZIP archive of the mashup engine logs. The logs are available a few minutes after the refresh, for up to 28 days, to users who have at least the Viewer role.
    fr: |
      Recent runs ouvre l'historique des actualisations du dataflow. Sélectionner une exécution ouvre ses détails, et Download detailed logs, en bas de l'écran de détail, télécharge une archive ZIP des journaux du moteur mashup. Les journaux sont disponibles quelques minutes après l'actualisation, pendant 28 jours au plus, pour les utilisateurs qui ont au moins le rôle Viewer.
  options:
    validate: { en: "Validation checks the queries in the editor; it doesn't produce the logs of a past refresh.", fr: "La validation vérifie les requêtes dans l'éditeur ; elle ne produit pas les journaux d'une actualisation passée." }
    csv: { en: "The CSV export lists runs and their status, not the mashup engine logs.", fr: "L'export CSV liste les exécutions et leur statut, pas les journaux du moteur mashup." }
    capacity: { en: "Capacity and cost reports capacity consumption, not dataflow logs.", fr: "Capacity and cost indique la consommation de capacité, pas les journaux du dataflow." }
references:
  - title: View Dataflow Gen2 refresh history and monitoring
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor
