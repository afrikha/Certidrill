id: dp700-3b-notebook-run-timeout
objective: "3.2.3"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains two notebooks named NB_Orchestrate and NB_Load_Silver. NB_Load_Silver takes up to 25 minutes to run and returns a status string by calling notebookutils.notebook.exit().

    NB_Orchestrate currently calls NB_Load_Silver with the default timeout, and the call fails after 90 seconds.

    You need NB_Orchestrate to run NB_Load_Silver, pass it a load date, and receive its exit value.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient deux notebooks nommés NB_Orchestrate et NB_Load_Silver. L'exécution de NB_Load_Silver dure jusqu'à 25 minutes et renvoie une chaîne de statut en appelant notebookutils.notebook.exit().

    NB_Orchestrate appelle actuellement NB_Load_Silver avec le délai d'expiration par défaut, et l'appel échoue au bout de 90 secondes.

    NB_Orchestrate doit exécuter NB_Load_Silver, lui transmettre une date de chargement et recevoir sa valeur de sortie.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    load_date = "2026-11-01"
    result = notebookutils.notebook.[[m]]("NB_Load_Silver", [[t]], {"load_date": load_date})
    print(result)
  slots:
    - id: m
      options:
        - { id: exit, text: exit }
        - { id: run, text: run }
        - { id: runmultiple, text: runMultiple }
        - { id: validate, text: validateDAG }
    - id: t
      options:
        - { id: t25, text: "25" }
        - { id: t90, text: "90" }
        - { id: t600, text: "600" }
        - { id: t1800, text: "1800" }
answer:
  values: { m: run, t: t1800 }
explanation:
  correct:
    en: |
      notebookutils.notebook.run(path, timeout_seconds, arguments) runs the child notebook and returns the string that the child passes to exit(). The timeout is in seconds and defaults to 90, so a child that runs up to 25 minutes needs more than 1,500 seconds; 1800 gives 30 minutes.
    fr: |
      notebookutils.notebook.run(path, timeout_seconds, arguments) exécute le notebook enfant et renvoie la chaîne que l'enfant passe à exit(). Le délai est exprimé en secondes et vaut 90 par défaut : un enfant qui s'exécute jusqu'à 25 minutes a besoin de plus de 1 500 secondes ; 1800 donne 30 minutes.
  options:
    exit: { en: "exit() ends the current notebook with a value; it doesn't run another notebook.", fr: "exit() termine le notebook courant avec une valeur ; il n'exécute pas un autre notebook." }
    runmultiple: { en: "runMultiple() takes a DAG or a list of notebooks, not a path, a timeout and arguments.", fr: "runMultiple() prend un DAG ou une liste de notebooks, pas un chemin, un délai et des arguments." }
    validate: { en: "validateDAG() only checks a DAG definition before runMultiple().", fr: "validateDAG() vérifie seulement une définition de DAG avant runMultiple()." }
    t25: { en: "The value is in seconds, not minutes: 25 seconds is even shorter than the default.", fr: "La valeur est en secondes, pas en minutes : 25 secondes est encore plus court que la valeur par défaut." }
    t90: { en: "90 seconds is the default that already makes the call fail.", fr: "90 secondes est la valeur par défaut qui fait déjà échouer l'appel." }
    t600: { en: "600 seconds is 10 minutes, shorter than the 25-minute run.", fr: "600 secondes correspondent à 10 minutes, moins que l'exécution de 25 minutes." }
references:
  - title: NotebookUtils notebook run and orchestration for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/notebookutils/notebookutils-notebook-run
