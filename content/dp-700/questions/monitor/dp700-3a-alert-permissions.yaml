id: dp700-3a-alert-permissions
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a workspace named WS-Load that contains a scheduled notebook named NB_Load. A user named User1 must configure and edit the schedule failure emails of NB_Load in the Monitor hub. User1 currently has no access to WS-Load.

    Which two role or permission assignments would each allow User1 to configure the notifications? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un espace de travail nommé WS-Load qui contient un notebook planifié nommé NB_Load. Un utilisateur nommé User1 doit configurer et modifier les e-mails d'échec de planification de NB_Load dans le hub de surveillance. User1 n'a actuellement aucun accès à WS-Load.

    Quelles sont les deux attributions de rôle ou d'autorisation qui permettraient chacune à User1 de configurer les notifications ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Viewer role on WS-Load", fr: "Le rôle Viewer sur WS-Load" } }
    - { id: b, text: { en: "The Contributor role on WS-Load", fr: "Le rôle Contributor sur WS-Load" } }
    - { id: c, text: { en: "Read permission on NB_Load only", fr: "L'autorisation Read sur NB_Load uniquement" } }
    - { id: d, text: { en: "Write permission on NB_Load", fr: "L'autorisation Write sur NB_Load" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Configuring, editing or removing schedule failure emails requires at least the Contributor role in the workspace, or Write permission on the item. Permission to view the scheduled item is enough only to view the notifications.
    fr: |
      Configurer, modifier ou supprimer des e-mails d'échec de planification demande au moins le rôle Contributor dans l'espace de travail, ou l'autorisation Write sur l'élément. Le droit de consulter l'élément planifié suffit seulement pour voir les notifications.
  options:
    a:
      en: |
        Viewer lets User1 view NB_Load and its notifications, not configure them.
      fr: |
        Viewer permet à User1 de consulter NB_Load et ses notifications, pas de les configurer.
    c:
      en: |
        Read permission on the item allows viewing it, not configuring its notifications.
      fr: |
        L'autorisation Read sur l'élément permet de le consulter, pas de configurer ses notifications.
references:
  - title: Set up job alerts in the Monitor hub (preview)
    url: https://learn.microsoft.com/en-us/fabric/admin/monitoring-hub-alerts
