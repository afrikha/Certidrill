id: dp700-3c-shortcut-delete
objective: "3.2.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have two Fabric workspaces named WS_Ops and WS_Archive. WS_Ops contains a lakehouse named LH_Ops, and WS_Archive contains a lakehouse named LH_Archive.

    The Files folder of LH_Ops contains a shortcut named sc_archive that targets the Files/archive folder of LH_Archive. User1 is a Contributor of both workspaces. The Files/archive folder contains one subfolder per year.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez de deux espaces de travail Fabric nommés WS_Ops et WS_Archive. WS_Ops contient un lakehouse nommé LH_Ops, et WS_Archive contient un lakehouse nommé LH_Archive.

    Le dossier Files de LH_Ops contient un raccourci nommé sc_archive qui cible le dossier Files/archive de LH_Archive. User1 est Contributor des deux espaces de travail. Le dossier Files/archive contient un sous-dossier par année.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If User1 deletes the sc_archive shortcut from LH_Ops, the files of Files/archive in LH_Archive are deleted.
        fr: Si User1 supprime le raccourci sc_archive de LH_Ops, les fichiers de Files/archive de LH_Archive sont supprimés.
    - id: s2
      text:
        en: If User1 deletes the folder sc_archive/2024 in LH_Ops, the 2024 folder is deleted from Files/archive in LH_Archive.
        fr: Si User1 supprime le dossier sc_archive/2024 dans LH_Ops, le dossier 2024 est supprimé de Files/archive dans LH_Archive.
    - id: s3
      text:
        en: If the Files/archive folder of LH_Archive is renamed archive_old, sc_archive starts to point to Files/archive_old.
        fr: Si le dossier Files/archive de LH_Archive est renommé archive_old, sc_archive se met à pointer vers Files/archive_old.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Deleting a shortcut removes only the shortcut object; the target data is not affected. Deleting a file or folder through a shortcut deletes it in the target when the user has write permission there, which User1 has as a Contributor of WS_Archive. A shortcut stores a target path, so moving, renaming or deleting the target can break it; it does not follow the rename.
    fr: |
      Supprimer un raccourci ne supprime que l'objet raccourci ; les données cibles ne sont pas touchées. Supprimer un fichier ou un dossier par un raccourci le supprime dans la cible si l'utilisateur y a l'autorisation d'écriture, ce qui est le cas de User1 comme Contributor de WS_Archive. Un raccourci enregistre un chemin cible : déplacer, renommer ou supprimer la cible peut le casser, il ne suit pas le renommage.
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
