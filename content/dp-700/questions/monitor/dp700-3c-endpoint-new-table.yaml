id: dp700-3c-endpoint-new-table
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named Lakehouse1.

    A notebook creates a new Delta table named sales_2026 in the Tables folder of Lakehouse1. Immediately after the notebook completes, an analyst runs `SELECT TOP (10) * FROM dbo.sales_2026;` against the SQL analytics endpoint of Lakehouse1 and receives the error "Invalid object name 'dbo.sales_2026'". A Spark query on the same table succeeds.

    You need the analyst to be able to query the table from the SQL analytics endpoint as soon as possible.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé Lakehouse1.

    Un notebook crée une nouvelle table Delta nommée sales_2026 dans le dossier Tables de Lakehouse1. Juste après la fin du notebook, un analyste exécute `SELECT TOP (10) * FROM dbo.sales_2026;` sur le point de terminaison d'analytique SQL de Lakehouse1 et reçoit l'erreur « Invalid object name 'dbo.sales_2026' ». Une requête Spark sur la même table réussit.

    L'analyste doit pouvoir interroger la table depuis le point de terminaison d'analytique SQL le plus rapidement possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run OPTIMIZE on sales_2026 from a notebook to compact the files of the table.", fr: "Exécuter OPTIMIZE sur sales_2026 depuis un notebook pour compacter les fichiers de la table." } }
    - { id: b, text: { en: "Grant the analyst the SELECT permission on the dbo schema of the SQL analytics endpoint.", fr: "Accorder à l'analyste l'autorisation SELECT sur le schéma dbo du point de terminaison d'analytique SQL." } }
    - { id: c, text: { en: "Run CREATE TABLE dbo.sales_2026 in the SQL analytics endpoint with the same columns.", fr: "Exécuter CREATE TABLE dbo.sales_2026 dans le point de terminaison d'analytique SQL avec les mêmes colonnes." } }
    - { id: d, text: { en: "Start a metadata refresh of the SQL analytics endpoint of Lakehouse1.", fr: "Lancer une actualisation des métadonnées du point de terminaison d'analytique SQL de Lakehouse1." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The SQL analytics endpoint discovers new and changed Delta tables through a background metadata sync, so a table created a moment ago can be missing for a short time. Starting an on-demand metadata refresh, from the portal or with the Refresh SQL analytics endpoint metadata REST API, makes the new table visible without waiting for the automatic sync.
    fr: |
      Le point de terminaison d'analytique SQL découvre les tables Delta nouvelles ou modifiées grâce à une synchronisation des métadonnées en arrière-plan : une table créée à l'instant peut donc manquer pendant un court moment. Lancer une actualisation des métadonnées à la demande, depuis le portail ou avec l'API REST Refresh SQL analytics endpoint metadata, rend la nouvelle table visible sans attendre la synchronisation automatique.
  options:
    a:
      en: |
        Compaction reduces the number of files and can shorten later syncs, but the error comes from metadata that has not been synchronized yet, not from the file layout.
      fr: |
        Le compactage réduit le nombre de fichiers et peut raccourcir les synchronisations suivantes, mais l'erreur vient de métadonnées pas encore synchronisées, pas de la disposition des fichiers.
    c:
      en: |
        Creating tables is supported only in a warehouse, not in the SQL analytics endpoint of a lakehouse, and the endpoint creates its tables automatically from the Delta tables.
      fr: |
        La création de tables n'est prise en charge que dans un entrepôt, pas dans le point de terminaison d'analytique SQL d'un lakehouse, qui crée ses tables automatiquement à partir des tables Delta.
    b:
      en: |
        A missing permission returns a permission error, not "Invalid object name". The object does not exist yet in the endpoint metadata.
      fr: |
        Une autorisation manquante renvoie une erreur d'autorisation, pas « Invalid object name ». L'objet n'existe pas encore dans les métadonnées du point de terminaison.
references:
  - title: SQL Analytics Endpoint Performance Considerations
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/sql-analytics-endpoint-performance
