id: dp700-3c-load-methods
objective: "3.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a warehouse named DW_Sales and a lakehouse named LH_Sales. You need to load data into DW_Sales by using T-SQL. Each load must use the method that Microsoft recommends for performance.

    Which statement should you use for each load? To answer, drag the appropriate statements to the correct loads. Each statement may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un entrepôt nommé DW_Sales et un lakehouse nommé LH_Sales. Vous devez charger des données dans DW_Sales en T-SQL. Chaque chargement doit utiliser la méthode que Microsoft recommande pour les performances.

    Quelle instruction devez-vous utiliser pour chaque chargement ? Pour répondre, faites glisser les instructions appropriées vers les chargements correspondants. Chaque instruction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: copy, text: COPY INTO }
    - { id: ctas, text: CREATE TABLE AS SELECT }
    - { id: insertsel, text: INSERT ... SELECT }
    - { id: insertval, text: INSERT ... VALUES }
  targets:
    - id: t_files
      text: { en: "Load Parquet files from an Azure Data Lake Storage Gen2 account into the existing table stg.Orders", fr: "Charger des fichiers Parquet d'un compte Azure Data Lake Storage Gen2 dans la table existante stg.Orders" }
    - id: t_new
      text: { en: "Create the new table dbo.DimStore from the dim_store table of LH_Sales", fr: "Créer la nouvelle table dbo.DimStore à partir de la table dim_store de LH_Sales" }
    - id: t_append
      text: { en: "Append the rows of the returns table of LH_Sales to the existing table dbo.FactReturns", fr: "Ajouter les lignes de la table returns de LH_Sales à la table existante dbo.FactReturns" }
answer:
  mapping: { t_files: copy, t_new: ctas, t_append: insertsel }
explanation:
  correct:
    en: |
      COPY INTO is the recommended way to bulk load files from external storage into an existing warehouse table. For data that is already in a lakehouse table of the same workspace, CTAS and INSERT ... SELECT are often faster and more efficient than pipelines: CTAS creates the new table in one statement, and INSERT ... SELECT appends to an existing table. Row-by-row INSERT ... VALUES statements fragment the table into small files.
    fr: |
      COPY INTO est la méthode recommandée pour charger en bloc des fichiers d'un stockage externe dans une table d'entrepôt existante. Pour des données déjà présentes dans une table de lakehouse du même espace de travail, CTAS et INSERT ... SELECT sont souvent plus rapides et plus efficaces que les pipelines : CTAS crée la nouvelle table en une instruction, et INSERT ... SELECT ajoute des lignes à une table existante. Des instructions INSERT ... VALUES ligne à ligne fragmentent la table en petits fichiers.
references:
  - title: Performance guidelines in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
