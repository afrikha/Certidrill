id: dp700-3c-staging-timeout
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric pipeline that copies a large table from an Azure SQL database to a Fabric warehouse named DW_Hist. The Copy activity has Enable staging selected with the Workspace staging type.

    The source table has grown, and the copy now needs about three hours. The activity fails after about 60 minutes every night, although its own timeout is set to 12 hours.

    You need the copy to complete. The data must still be loaded into DW_Hist.

    What should you do?
  fr: |
    Vous disposez d'un pipeline Fabric qui copie une grande table depuis une base de données Azure SQL vers un entrepôt Fabric nommé DW_Hist. L'activité Copy a l'option Enable staging sélectionnée avec le type de zone de transit Workspace.

    La table source a grossi, et la copie a désormais besoin d'environ trois heures. L'activité échoue chaque nuit au bout d'environ 60 minutes, alors que son propre délai d'expiration est défini sur 12 heures.

    La copie doit se terminer. Les données doivent toujours être chargées dans DW_Hist.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Clear Enable staging so that the copy writes directly to DW_Hist.", fr: "Désélectionner Enable staging pour que la copie écrive directement dans DW_Hist." } }
    - { id: b, text: { en: "Set the retry count of the Copy activity to 3.", fr: "Définir le nombre de nouvelles tentatives de l'activité Copy sur 3." } }
    - { id: c, text: { en: "Change the staging type to External and select an Azure Data Lake Storage Gen2 connection.", fr: "Changer le type de zone de transit en External et sélectionner une connexion Azure Data Lake Storage Gen2." } }
    - { id: d, text: { en: "Increase the timeout of the Copy activity to 24 hours.", fr: "Augmenter le délai d'expiration de l'activité Copy à 24 heures." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Workspace staging uses built-in storage and times out after 60 minutes, so Microsoft recommends external staging for long-running jobs. With the External type, the copy stages the data in an Azure Blob Storage or Azure Data Lake Storage Gen2 account that you connect, and the load into the warehouse can run beyond one hour.
    fr: |
      La zone de transit Workspace utilise un stockage intégré et expire au bout de 60 minutes : Microsoft recommande une zone de transit externe pour les travaux de longue durée. Avec le type External, la copie place les données dans un compte Stockage Blob Azure ou Azure Data Lake Storage Gen2 que vous connectez, et le chargement dans l'entrepôt peut durer plus d'une heure.
  options:
    a:
      en: |
        Staging is required when the destination is a Fabric warehouse.
      fr: |
        La zone de transit est obligatoire quand la destination est un entrepôt Fabric.
    b:
      en: |
        Each retry starts the same three-hour copy through the same workspace staging, which fails again after 60 minutes.
      fr: |
        Chaque nouvelle tentative relance la même copie de trois heures par la même zone de transit Workspace, qui échoue de nouveau au bout de 60 minutes.
    d:
      en: |
        The activity timeout is already 12 hours; the limit that is reached is the 60-minute timeout of workspace staging.
      fr: |
        Le délai d'expiration de l'activité est déjà de 12 heures ; la limite atteinte est le délai de 60 minutes de la zone de transit Workspace.
references:
  - title: How to copy data using copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-data-activity
  - title: Copy activity performance with SQL databases
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-performance-sql-databases
