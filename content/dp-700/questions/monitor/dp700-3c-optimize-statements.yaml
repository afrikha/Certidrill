id: dp700-3c-optimize-statements
objective: "3.3.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric lakehouse that contains a Delta table named silver.events. The delta.parquet.vorder.enabled property of silver.events is set to true. No Spark property related to V-Order is set in the environment or in the session.

    You plan to run table maintenance on silver.events from a notebook.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric qui contient une table Delta nommée silver.events. La propriété delta.parquet.vorder.enabled de silver.events est définie sur true. Aucune propriété Spark liée à V-Order n'est définie dans l'environnement ni dans la session.

    Vous prévoyez d'exécuter la maintenance de silver.events depuis un notebook.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: OPTIMIZE silver.events ZORDER BY (device_id) VORDER performs bin compaction, then Z-Order, and then V-Order.
        fr: OPTIMIZE silver.events ZORDER BY (device_id) VORDER effectue le compactage par regroupement, puis le Z-Order, puis le V-Order.
    - id: s2
      text:
        en: Running VACUUM silver.events after OPTIMIZE reduces the number of files that queries on silver.events read.
        fr: Exécuter VACUUM silver.events après OPTIMIZE réduit le nombre de fichiers lus par les requêtes sur silver.events.
    - id: s3
      text:
        en: OPTIMIZE silver.events, without the VORDER keyword, writes the compacted files with V-Order.
        fr: OPTIMIZE silver.events, sans le mot clé VORDER, écrit les fichiers compactés avec V-Order.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When OPTIMIZE combines the options, Spark applies bin compaction, then Z-Order, then V-Order. After OPTIMIZE, queries already read only the new compacted files; VACUUM deletes the unreferenced old files to reclaim storage but does not improve the active layout. A plain OPTIMIZE inherits the delta.parquet.vorder.enabled table property when it is set, so the rewritten files get V-Order.
    fr: |
      Quand OPTIMIZE combine les options, Spark applique le compactage par regroupement, puis le Z-Order, puis le V-Order. Après OPTIMIZE, les requêtes ne lisent déjà que les nouveaux fichiers compactés ; VACUUM supprime les anciens fichiers non référencés pour libérer du stockage mais n'améliore pas la disposition active. Un OPTIMIZE simple hérite de la propriété de table delta.parquet.vorder.enabled quand elle est définie : les fichiers réécrits reçoivent V-Order.
references:
  - title: Table Compaction
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/table-compaction
  - title: Cross-Workload Table Maintenance and Optimization in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/table-maintenance-optimization
