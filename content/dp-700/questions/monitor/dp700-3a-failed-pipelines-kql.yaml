id: dp700-3a-failed-pipelines-kql
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an eventhouse named EH-Fleet that contains a KQL database named FleetDB. An eventstream ingests vehicle events into a table named VehicleEvents. Each event has an EventTime column that the vehicle sets when it sends the event. The IngestionTime policy of VehicleEvents is enabled.

    You need a KQL query that returns, for each hour of the last 24 hours of ingestion, the number of records ingested and the longest delay between the time an event was sent and the time it was ingested.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un eventhouse nommé EH-Fleet qui contient une base de données KQL nommée FleetDB. Un flux d'événements (eventstream) ingère des événements de véhicules dans une table nommée VehicleEvents. Chaque événement a une colonne EventTime que le véhicule renseigne quand il envoie l'événement. La stratégie IngestionTime de VehicleEvents est activée.

    Vous avez besoin d'une requête KQL qui renvoie, pour chaque heure des dernières 24 heures d'ingestion, le nombre d'enregistrements ingérés et le plus long délai entre l'heure d'envoi d'un événement et son heure d'ingestion.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    VehicleEvents
    | where [[col]] > ago(24h)
    | summarize Records = [[agg]], MaxDelay = max([[delay]]) by bin(ingestion_time(), 1h)
  slots:
    - id: col
      options:
        - { id: event, text: EventTime }
        - { id: ingest, text: ingestion_time() }
        - { id: now, text: now() }
    - id: agg
      options:
        - { id: count, text: count() }
        - { id: dcount, text: dcount(EventTime) }
        - { id: countif, text: countif(isnull(EventTime)) }
    - id: delay
      options:
        - { id: lag, text: ingestion_time() - EventTime }
        - { id: neg, text: EventTime - ingestion_time() }
        - { id: age, text: now() - ingestion_time() }
answer:
  values: { col: ingest, agg: count, delay: lag }
explanation:
  correct:
    en: |
      `ingestion_time()` returns the approximate time at which each record was ingested, when the IngestionTime policy was enabled at ingestion. Filtering on it keeps the records ingested in the last 24 hours, `count()` counts them per hourly bin, and `ingestion_time() - EventTime` is the delay between sending and ingestion, so `max()` returns the longest one.
    fr: |
      `ingestion_time()` renvoie l'heure approximative à laquelle chaque enregistrement a été ingéré, quand la stratégie IngestionTime était activée lors de l'ingestion. Filtrer sur cette valeur garde les enregistrements ingérés au cours des dernières 24 heures, `count()` les compte par tranche d'une heure, et `ingestion_time() - EventTime` est le délai entre l'envoi et l'ingestion : `max()` renvoie donc le plus long.
  options:
    event: { en: "EventTime filters on the time the events were sent; late events ingested in the last 24 hours would be missed.", fr: "EventTime filtre sur l'heure d'envoi des événements : des événements tardifs ingérés au cours des dernières 24 heures seraient ignorés." }
    now: { en: "now() is the same for every record, so the filter keeps all or none of the rows.", fr: "now() est identique pour chaque enregistrement : le filtre garde toutes les lignes ou aucune." }
    dcount: { en: "dcount(EventTime) counts distinct send times; events sent at the same time are counted once.", fr: "dcount(EventTime) compte les heures d'envoi distinctes : des événements envoyés au même moment ne sont comptés qu'une fois." }
    countif: { en: "countif(isnull(EventTime)) counts only the records without an event time.", fr: "countif(isnull(EventTime)) ne compte que les enregistrements sans heure d'événement." }
    neg: { en: "EventTime - ingestion_time() is negative, so max() returns the shortest delay.", fr: "EventTime - ingestion_time() est négatif : max() renvoie donc le délai le plus court." }
    age: { en: "now() - ingestion_time() measures how long ago a record was ingested, not its ingestion delay.", fr: "now() - ingestion_time() mesure depuis combien de temps un enregistrement a été ingéré, pas son délai d'ingestion." }
references:
  - title: ingestion_time()
    url: https://learn.microsoft.com/en-us/kusto/query/ingestion-time-function?view=microsoft-fabric
