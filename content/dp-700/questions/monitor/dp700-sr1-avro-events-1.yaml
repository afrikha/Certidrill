id: dp700-sr1-avro-events-1
objective: "3.2.5"
type: series_yesno
series: dp700-sr1-avro-events
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You raise the Event throughput setting of ES1.
  fr: Vous augmentez le paramètre Event throughput de ES1.
body:
  solution:
    en: |
      In the settings of ES1, you change **Event throughput** from **Low** to **Medium**, and you reactivate the nodes as required.
    fr: |
      Dans les paramètres de ES1, vous faites passer **Event throughput** de **Low** à **Medium**, puis vous réactivez les nœuds si nécessaire.
answer: { value: false }
explanation:
  correct:
    en: |
      The Event throughput level scales the eventstream for higher data rates; it helps when Backlogged input events and watermark delay grow. Here the backlog is 0 and every input event fails deserialization because the source expects JSON while the events are Avro. More throughput would only process the same failing events faster.
    fr: |
      Le niveau Event throughput met le flux d'événements à l'échelle pour des débits plus élevés ; il aide quand Backlogged input events et le délai de filigrane augmentent. Ici, le backlog est de 0 et chaque événement d'entrée échoue à la désérialisation, car la source attend du JSON alors que les événements sont en Avro. Plus de débit ne ferait que traiter plus vite les mêmes événements en échec.
