id: dp700-sr1-avro-events-2
objective: "3.2.5"
type: series_yesno
series: dp700-sr1-avro-events
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You add a Manage fields operator that converts the field types.
  fr: Vous ajoutez un opérateur Manage fields qui convertit les types des champs.
body:
  solution:
    en: |
      You add a **Manage fields** operator between the Filter operator and the eventhouse destination. The operator casts each field to the type of the matching column of the destination table. You publish ES1.
    fr: |
      Vous ajoutez un opérateur **Manage fields** entre l'opérateur Filter et la destination eventhouse. L'opérateur convertit chaque champ dans le type de la colonne correspondante de la table de destination. Vous publiez ES1.
answer: { value: false }
explanation:
  correct:
    en: |
      Deserialization errors count input events that the eventstream engine can't read at the source, before any operator runs. Type casting addresses data conversion errors, which occur when output events don't fit the destination schema. As long as the source reads Avro events as JSON, no event reaches the operators.
    fr: |
      Les erreurs de désérialisation comptent les événements d'entrée que le moteur du flux d'événements ne peut pas lire à la source, avant l'exécution de tout opérateur. La conversion de types traite les erreurs de conversion des données, qui se produisent quand les événements de sortie ne correspondent pas au schéma de la destination. Tant que la source lit des événements Avro comme du JSON, aucun événement n'atteint les opérateurs.
references:
  - title: Monitor the status and performance of an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor
