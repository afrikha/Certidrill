id: dp700-cs4a-ingestion-failures
objective: "3.1.1"
type: single
caseStudy: dp700-cs4a-city-power
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the requirement for investigating the failed ingestion operations of EH-Grid.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence d'analyse des opérations d'ingestion ayant échoué dans EH-Grid.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the .show ingestion failures command in KDB-Grid.", fr: "Exécuter la commande .show ingestion failures dans KDB-Grid." } }
    - { id: b, text: { en: "Review the Data insights and Runtime logs panes of ES-Meters.", fr: "Examiner les volets Data insights et Runtime logs de ES-Meters." } }
    - { id: c, text: { en: "Install the Microsoft Fabric Capacity Metrics app and filter it on EH-Grid.", fr: "Installer l'application Microsoft Fabric Capacity Metrics et la filtrer sur EH-Grid." } }
    - { id: d, text: { en: "Enable workspace monitoring for CPL-Grid and query the ingestion results logs.", fr: "Activer la supervision de l'espace de travail pour CPL-Grid et interroger les journaux des résultats d'ingestion." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Workspace monitoring adds a monitoring eventhouse to the workspace. Its ingestion results logs report the outcome of the eventhouse's queued ingestion operations, including failures, and are queried with KQL. The data is retained for 30 days by default, which covers the required period.
    fr: |
      La supervision de l'espace de travail ajoute un eventhouse de supervision à l'espace de travail. Ses journaux des résultats d'ingestion indiquent le résultat des opérations d'ingestion en file d'attente de l'eventhouse, y compris les échecs, et s'interrogent en KQL. Les données sont conservées 30 jours par défaut, ce qui couvre la période requise.
  options:
    a:
      en: |
        The .show ingestion failures command keeps ingestion failures for only 14 days, which does not cover the last 30 days.
      fr: |
        La commande .show ingestion failures ne conserve les échecs d'ingestion que 14 jours, ce qui ne couvre pas les 30 derniers jours.
    c:
      en: |
        The Capacity Metrics app shows capacity unit consumption and throttling; it does not list failed ingestion operations and is not queried with KQL.
      fr: |
        L'application Capacity Metrics montre la consommation d'unités de capacité et la limitation ; elle ne liste pas les opérations d'ingestion ayant échoué et ne s'interroge pas en KQL.
    b:
      en: |
        The Data insights and Runtime logs panes show the metrics and engine logs of the eventstream nodes in the editor. They are not a log store that the team can query with KQL over the last 30 days.
      fr: |
        Les volets Data insights et Runtime logs montrent les métriques et les journaux du moteur des nœuds du flux d'événements dans l'éditeur. Ce ne sont pas un magasin de journaux que l'équipe peut interroger en KQL sur les 30 derniers jours.
references:
  - title: Eventhouse monitoring
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/monitor-eventhouse
  - title: .show ingestion failures command
    url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures
