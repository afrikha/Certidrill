id: dp700-cs4a-ingestion-failures
objective: "3.1.1"
type: single
caseStudy: dp700-cs4a-city-power
difficulty: 2
status: draft
stem:
  en: |
    Three days ago, several ingestion operations into KDB-Grid failed. Workspace monitoring isn't enabled for CPL-Grid.

    You need to use KQL to list the failed ingestion operations of the last three days, with their error codes and failure details.

    What should you do?
  fr: |
    Il y a trois jours, plusieurs opérations d'ingestion dans KDB-Grid ont échoué. La supervision de l'espace de travail n'est pas activée pour CPL-Grid.

    Vous devez utiliser KQL pour lister les opérations d'ingestion ayant échoué au cours des trois derniers jours, avec leurs codes d'erreur et le détail des échecs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the .show ingestion failures command in KDB-Grid.", fr: "Exécuter la commande .show ingestion failures dans KDB-Grid." } }
    - { id: b, text: { en: "Review the Data insights and Runtime logs panes of ES-Meters.", fr: "Examiner les volets Data insights et Runtime logs de ES-Meters." } }
    - { id: c, text: { en: "Install the Microsoft Fabric Capacity Metrics app and filter it on EH-Grid.", fr: "Installer l'application Microsoft Fabric Capacity Metrics et la filtrer sur EH-Grid." } }
    - { id: d, text: { en: "Enable workspace monitoring for CPL-Grid and query the ingestion results logs.", fr: "Activer la supervision de l'espace de travail pour CPL-Grid et interroger les journaux des résultats d'ingestion." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The .show ingestion failures command returns the ingestion failures of the database with the table, the time, the ErrorCode, the Details and the FailureKind of each failure. Failures are kept for 14 days, which covers the last three days, and the output can be filtered with a where clause.
    fr: |
      La commande .show ingestion failures renvoie les échecs d'ingestion de la base de données avec la table, l'heure, le code ErrorCode, le détail Details et le type FailureKind de chaque échec. Les échecs sont conservés 14 jours, ce qui couvre les trois derniers jours, et la sortie peut être filtrée avec une clause where.
  options:
    b:
      en: |
        The Data insights and Runtime logs panes show the metrics and engine logs of the eventstream nodes in the editor. They don't list the failed ingestion operations of the KQL database, and they aren't queried with KQL.
      fr: |
        Les volets Data insights et Runtime logs montrent les métriques et les journaux du moteur des nœuds du flux d'événements dans l'éditeur. Ils ne listent pas les opérations d'ingestion ayant échoué de la base de données KQL et ne s'interrogent pas en KQL.
    c:
      en: |
        The Capacity Metrics app shows capacity unit consumption and throttling; it does not list failed ingestion operations and is not queried with KQL.
      fr: |
        L'application Capacity Metrics montre la consommation d'unités de capacité et la limitation ; elle ne liste pas les opérations d'ingestion ayant échoué et ne s'interroge pas en KQL.
    d:
      en: |
        Workspace monitoring doesn't backfill earlier activity: enabled now, it can't show the failures of three days ago.
      fr: |
        La supervision de l'espace de travail ne récupère pas l'activité antérieure : activée maintenant, elle ne peut pas montrer les échecs d'il y a trois jours.
references:
  - title: .show ingestion failures command
    url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures?view=microsoft-fabric
