id: dp700-3b-eventstream-statements
objective: "3.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventstream named ES_Logistics. ES_Logistics has an Azure Event Hubs source, an eventhouse destination that uses Direct ingestion, and a lakehouse destination. You are preparing a troubleshooting procedure for ES_Logistics.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventstream nommé ES_Logistics. ES_Logistics possède une source Azure Event Hubs, une destination eventhouse qui utilise Direct ingestion et une destination lakehouse. Vous préparez une procédure de dépannage pour ES_Logistics.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "You can deactivate the eventhouse destination during an investigation and later resume it from when streaming was last stopped."
        fr: "Vous pouvez désactiver la destination eventhouse pendant une investigation, puis la reprendre à partir du moment où le streaming a été arrêté."
    - id: s2
      text:
        en: "The runtime logs of the lakehouse destination node can be filtered to show only entries of the error severity."
        fr: "Les journaux d'exécution du nœud de destination lakehouse peuvent être filtrés pour n'afficher que les entrées de gravité error."
    - id: s3
      text:
        en: "You can delete specific malformed events from ES_Logistics before its retention period ends."
        fr: "Vous pouvez supprimer des événements mal formés précis d'ES_Logistics avant la fin de sa période de rétention."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      An eventhouse destination that uses Direct ingestion doesn't support pause and resume; the Event processing before ingestion mode does. Runtime logs have three severity levels (warning, error, information) and can be filtered by severity or type. Events become unavailable only when the retention period ends: you can't explicitly delete them.
    fr: |
      Une destination eventhouse en Direct ingestion ne prend pas en charge la pause et la reprise ; le mode Event processing before ingestion les prend en charge. Les journaux d'exécution ont trois niveaux de gravité (warning, error, information) et peuvent être filtrés par gravité ou par type. Les événements ne deviennent indisponibles qu'à la fin de la période de rétention : vous ne pouvez pas les supprimer explicitement.
references:
  - title: Pause and resume data streams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/pause-resume-data-streams
  - title: Monitor the Status and Performance of an Eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor
