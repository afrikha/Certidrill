id: dp700-3a-dataflow-90-days
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has a workspace named WS-Finance that contains two Dataflow Gen2 items. DF_Ledger was created a year ago and is refreshed every 30 minutes. DF_Budget was created ten months ago and is refreshed once a week.

    You need to determine how far back the refresh history of each dataflow goes when you open its Recent runs.

    What does the refresh history show?
  fr: |
    Woodgrove dispose d'un espace de travail nommé WS-Finance qui contient deux éléments Dataflow Gen2. DF_Ledger a été créé il y a un an et est actualisé toutes les 30 minutes. DF_Budget a été créé il y a dix mois et est actualisé une fois par semaine.

    Vous devez déterminer jusqu'où remonte l'historique des actualisations de chaque dataflow quand vous ouvrez ses Recent runs.

    Que montre l'historique des actualisations ?
body:
  options:
    - { id: a, text: { en: "DF_Ledger: the last six months. DF_Budget: the last six months.", fr: "DF_Ledger : les six derniers mois. DF_Budget : les six derniers mois." } }
    - { id: b, text: { en: "DF_Ledger: about the last 25 hours. DF_Budget: about the last six months.", fr: "DF_Ledger : environ les 25 dernières heures. DF_Budget : environ les six derniers mois." } }
    - { id: c, text: { en: "DF_Ledger: about the last 25 hours. DF_Budget: every refresh since its creation.", fr: "DF_Ledger : environ les 25 dernières heures. DF_Budget : toutes les actualisations depuis sa création." } }
    - { id: d, text: { en: "DF_Ledger: the last 28 days. DF_Budget: the last 28 days.", fr: "DF_Ledger : les 28 derniers jours. DF_Budget : les 28 derniers jours." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The refresh history shows up to 50 refreshes or up to six months of history, whichever comes first. DF_Ledger reaches 50 refreshes in about 25 hours (two refreshes per hour). DF_Budget has only about 26 refreshes in six months, so the six-month limit applies first.
    fr: |
      L'historique des actualisations affiche jusqu'à 50 actualisations ou jusqu'à six mois d'historique, selon la limite atteinte en premier. DF_Ledger atteint 50 actualisations en environ 25 heures (deux actualisations par heure). DF_Budget n'a qu'environ 26 actualisations en six mois : la limite de six mois s'applique donc en premier.
  options:
    a:
      en: |
        Six months applies only when fewer than 50 refreshes ran in that period; DF_Ledger exceeds 50 refreshes in about a day.
      fr: |
        Les six mois ne s'appliquent que si moins de 50 actualisations ont eu lieu sur cette période ; DF_Ledger dépasse 50 actualisations en environ une journée.
    c:
      en: |
        DF_Budget was created ten months ago, so its refreshes older than six months are beyond the history limit.
      fr: |
        DF_Budget a été créé il y a dix mois : ses actualisations de plus de six mois dépassent la limite de l'historique.
    d:
      en: |
        28 days is how long the detailed logs of a refresh stay available for download, not the depth of the refresh history.
      fr: |
        28 jours est la durée pendant laquelle les journaux détaillés d'une actualisation restent téléchargeables, pas la profondeur de l'historique des actualisations.
references:
  - title: View Dataflow Gen2 refresh history and monitoring
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor
