id: dp700-3a-dataflow-90-days
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has a workspace named WS-Finance that contains a Dataflow Gen2 named DF_Ledger. DF_Ledger is refreshed every 30 minutes. Workspace monitoring is not enabled.

    Starting now, the finance analysts must be able to query the status and duration of every refresh of DF_Ledger over a rolling 90-day period by using KQL.

    What should you do?
  fr: |
    Woodgrove dispose d'un espace de travail nommé WS-Finance qui contient un Dataflow Gen2 nommé DF_Ledger. DF_Ledger est actualisé toutes les 30 minutes. La supervision de l'espace de travail n'est pas activée.

    À partir de maintenant, les analystes financiers doivent pouvoir interroger en KQL le statut et la durée de chaque actualisation de DF_Ledger sur une période glissante de 90 jours.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Ask the analysts to open the Recent runs of DF_Ledger and filter the refresh history", fr: "Demander aux analystes d'ouvrir les Recent runs de DF_Ledger et de filtrer l'historique des actualisations" } }
    - { id: b, text: { en: "Enable workspace monitoring, then set the retention of the monitoring KQL database to 90 days", fr: "Activer la supervision de l'espace de travail, puis régler la rétention de la base de données KQL de supervision sur 90 jours" } }
    - { id: c, text: { en: "Download the detailed logs of each refresh every week and load them into an eventhouse", fr: "Télécharger chaque semaine les journaux détaillés de chaque actualisation et les charger dans un eventhouse" } }
    - { id: d, text: { en: "Enable workspace monitoring and keep the default settings of the monitoring KQL database", fr: "Activer la supervision de l'espace de travail et conserver les paramètres par défaut de la base de données KQL de supervision" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Workspace monitoring collects Dataflow Gen2 logs into an eventhouse that you query with KQL. Its data is retained for 30 days by default, so you change the retention to 90 days in the monitoring KQL database (Manage > Data policies). Collection only covers activity after it is turned on, which matches "starting now".
    fr: |
      La supervision de l'espace de travail collecte les journaux de Dataflow Gen2 dans un eventhouse que vous interrogez en KQL. Ses données sont conservées 30 jours par défaut : vous réglez donc la rétention sur 90 jours dans la base de données KQL de supervision (Manage > Data policies). La collecte ne couvre que l'activité postérieure à son activation, ce qui correspond à « à partir de maintenant ».
  options:
    a:
      en: |
        The refresh history shows at most 50 refreshes or six months; at 48 refreshes a day, it covers about one day, and it can't be queried with KQL.
      fr: |
        L'historique des actualisations affiche au plus 50 actualisations ou six mois ; à 48 actualisations par jour, il couvre environ une journée, et il ne s'interroge pas en KQL.
    c:
      en: |
        Detailed logs are Power Query mashup engine diagnostics kept for 28 days; downloading them for every refresh is a manual, high-effort process.
      fr: |
        Les journaux détaillés sont des diagnostics du moteur mashup Power Query conservés 28 jours ; les télécharger pour chaque actualisation est un processus manuel et coûteux en effort.
    d:
      en: |
        With the default settings, the monitoring data is retained for only 30 days, not 90.
      fr: |
        Avec les paramètres par défaut, les données de supervision ne sont conservées que 30 jours, pas 90.
references:
  - title: What is workspace monitoring (preview)?
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/workspace-monitoring-overview
  - title: View Dataflow Gen2 refresh history and monitoring
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor
