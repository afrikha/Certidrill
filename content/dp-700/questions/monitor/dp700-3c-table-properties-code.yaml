id: dp700-3c-table-properties-code
objective: "3.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse that contains a Delta table named gold.dim_store. A Direct Lake semantic model reads gold.dim_store. Several notebooks write to the table. No Spark property related to V-Order or compaction is set in the environment.

    You need to meet the following requirements for gold.dim_store only:

    - Future writes use V-Order and auto compaction.
    - The existing data files are rewritten with V-Order.

    How should you complete the Spark SQL code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric qui contient une table Delta nommée gold.dim_store. Un modèle sémantique Direct Lake lit gold.dim_store. Plusieurs notebooks écrivent dans la table. Aucune propriété Spark liée à V-Order ou au compactage n'est définie dans l'environnement.

    Vous devez satisfaire les exigences suivantes pour gold.dim_store uniquement :

    - Les écritures futures utilisent V-Order et le compactage automatique.
    - Les fichiers de données existants sont réécrits avec V-Order.

    Comment devez-vous compléter le code Spark SQL ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    ALTER TABLE gold.dim_store SET TBLPROPERTIES (
        [[p1]] = 'true',
        [[p2]] = 'true'
    );

    [[p3]] gold.dim_store VORDER;
  slots:
    - id: p1
      options:
        - { id: tbl_vorder, text: "'delta.parquet.vorder.enabled'" }
        - { id: sess_vorder, text: "'spark.sql.parquet.vorder.default'" }
        - { id: write_vorder, text: "'parquet.vorder.enabled'" }
        - { id: optwrite, text: "'delta.autoOptimize.optimizeWrite'" }
    - id: p2
      options:
        - { id: tbl_compact, text: "'delta.autoOptimize.autoCompact'" }
        - { id: sess_compact, text: "'spark.databricks.delta.autoCompact.enabled'" }
        - { id: fast, text: "'spark.microsoft.delta.optimize.fast.enabled'" }
    - id: p3
      options:
        - { id: optimize, text: OPTIMIZE }
        - { id: vacuum, text: VACUUM }
        - { id: analyze, text: ANALYZE TABLE }
answer:
  values: { p1: tbl_vorder, p2: tbl_compact, p3: optimize }
explanation:
  correct:
    en: |
      delta.parquet.vorder.enabled and delta.autoOptimize.autoCompact are the table properties for V-Order and auto compaction, so they apply to this table whatever notebook writes to it. A change of the V-Order property affects only future writes; OPTIMIZE ... VORDER rewrites the existing files with V-Order.
    fr: |
      delta.parquet.vorder.enabled et delta.autoOptimize.autoCompact sont les propriétés de table de V-Order et du compactage automatique : elles s'appliquent à cette table quel que soit le notebook qui y écrit. Une modification de la propriété V-Order n'affecte que les écritures futures ; OPTIMIZE ... VORDER réécrit les fichiers existants avec V-Order.
  options:
    sess_vorder:
      en: |
        spark.sql.parquet.vorder.default is a session configuration that applies to all the writes of a session, not a table property.
      fr: |
        spark.sql.parquet.vorder.default est une configuration de session qui s'applique à toutes les écritures d'une session, pas une propriété de table.
    write_vorder:
      en: |
        parquet.vorder.enabled is a DataFrame write option for a single write operation.
      fr: |
        parquet.vorder.enabled est une option d'écriture de DataFrame pour une seule opération d'écriture.
    optwrite:
      en: |
        Optimized write bin-packs data before writing; it does not enable V-Order.
      fr: |
        L'écriture optimisée regroupe les données avant l'écriture ; elle n'active pas V-Order.
    sess_compact:
      en: |
        spark.databricks.delta.autoCompact.enabled is the session-level setting, not the table property.
      fr: |
        spark.databricks.delta.autoCompact.enabled est le paramètre de niveau session, pas la propriété de table.
    fast:
      en: |
        Fast optimize makes OPTIMIZE skip bins unlikely to reach the target size; it does not compact after writes.
      fr: |
        L'optimisation rapide fait ignorer à OPTIMIZE les groupes peu susceptibles d'atteindre la taille cible ; elle ne compacte pas après les écritures.
    vacuum:
      en: |
        VACUUM deletes unreferenced files; it does not rewrite the active files, and VORDER is not one of its options.
      fr: |
        VACUUM supprime les fichiers non référencés ; il ne réécrit pas les fichiers actifs, et VORDER ne fait pas partie de ses options.
    analyze:
      en: |
        ANALYZE TABLE computes statistics; it does not rewrite data files.
      fr: |
        ANALYZE TABLE calcule des statistiques ; il ne réécrit pas les fichiers de données.
references:
  - title: Optimize Delta Lake tables with V-Order in Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/delta-optimization-and-v-order
  - title: Table Compaction
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/table-compaction
