id: dp700-3b-update-policy-column-order
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse. The eventhouse contains a KQL database that has a table named Silver_Readings with the following columns, in this order: Timestamp (datetime), DeviceId (string), Temperature (real).

    An update policy on Silver_Readings uses a function named ParseReadings() as its query. The function ends with the following line:

    ```kusto
    | project DeviceId, Timestamp, Temperature
    ```

    No rows reach Silver_Readings, and .show ingestion failures returns failures for which OriginatesFromUpdatePolicy is true.

    You need to resolve the failures.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse. L'eventhouse contient une base de données KQL qui comporte une table nommée Silver_Readings avec les colonnes suivantes, dans cet ordre : Timestamp (datetime), DeviceId (string), Temperature (real).

    Une stratégie de mise à jour sur Silver_Readings utilise une fonction nommée ParseReadings() comme requête. La fonction se termine par la ligne suivante :

    ```kusto
    | project DeviceId, Timestamp, Temperature
    ```

    Aucune ligne n'arrive dans Silver_Readings, et .show ingestion failures renvoie des échecs pour lesquels OriginatesFromUpdatePolicy vaut true.

    Vous devez résoudre ces échecs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the last line of ParseReadings() to `| project Timestamp, DeviceId, Temperature`", fr: "Remplacer la dernière ligne de ParseReadings() par `| project Timestamp, DeviceId, Temperature`" } }
    - { id: b, text: { en: "Set IsTransactional to false in the update policy", fr: "Définir IsTransactional sur false dans la stratégie de mise à jour" } }
    - { id: c, text: { en: "Create a JSON ingestion mapping on Silver_Readings", fr: "Créer un mappage d'ingestion JSON sur Silver_Readings" } }
    - { id: d, text: { en: "Set PropagateIngestionProperties to true in the update policy", fr: "Définir PropagateIngestionProperties sur true dans la stratégie de mise à jour" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The output schema of an update policy function must match the target table in column types and order. ParseReadings() returns a string column first, where Silver_Readings expects a datetime, so the policy fails. Projecting the columns in the order of the table fixes the mismatch.
    fr: |
      Le schéma de sortie de la fonction d'une stratégie de mise à jour doit correspondre à la table cible par les types et l'ordre des colonnes. ParseReadings() renvoie d'abord une colonne string, là où Silver_Readings attend un datetime : la stratégie échoue. Projeter les colonnes dans l'ordre de la table corrige l'écart.
  options:
    b: { en: "A non-transactional policy lets the source ingestion succeed, but the target table still receives no rows.", fr: "Une stratégie non transactionnelle laisse l'ingestion source réussir, mais la table cible ne reçoit toujours aucune ligne." }
    c: { en: "Ingestion mappings apply to data ingested from a source format, not to the output of an update policy query.", fr: "Les mappages d'ingestion s'appliquent aux données ingérées depuis un format source, pas à la sortie de la requête d'une stratégie de mise à jour." }
    d: { en: "This property passes ingestion properties such as extent tags to the target; it doesn't change the schema.", fr: "Cette propriété transmet des propriétés d'ingestion comme les étiquettes d'extent à la cible ; elle ne change pas le schéma." }
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
