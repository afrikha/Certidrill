id: dp700-3c-shortcut-connection
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS_Lake that contains a lakehouse named LH_Raw. User1 is a Contributor of WS_Lake.

    A cloud connection named conn-adls-sales authenticates to an Azure Data Lake Storage Gen2 account by using a service principal. Other engineers use conn-adls-sales to create shortcuts in LH_Raw.

    When User1 creates a new Azure Data Lake Storage Gen2 shortcut in LH_Raw, conn-adls-sales is not available for selection.

    You need User1 to be able to create the shortcut by using conn-adls-sales.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS_Lake qui contient un lakehouse nommé LH_Raw. User1 est Contributor de WS_Lake.

    Une connexion cloud nommée conn-adls-sales s'authentifie auprès d'un compte Azure Data Lake Storage Gen2 avec un principal de service. D'autres ingénieurs utilisent conn-adls-sales pour créer des raccourcis dans LH_Raw.

    Quand User1 crée un nouveau raccourci Azure Data Lake Storage Gen2 dans LH_Raw, conn-adls-sales n'est pas proposée.

    User1 doit pouvoir créer le raccourci avec conn-adls-sales.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign User1 the Storage Blob Data Reader role on the storage account.", fr: "Attribuer à User1 le rôle Storage Blob Data Reader sur le compte de stockage." } }
    - { id: b, text: { en: "Assign User1 the Admin role on WS_Lake.", fr: "Attribuer à User1 le rôle Admin sur WS_Lake." } }
    - { id: c, text: { en: "Add User1 as a user of conn-adls-sales in Manage connections and gateways.", fr: "Ajouter User1 comme utilisateur de conn-adls-sales dans Manage connections and gateways." } }
    - { id: d, text: { en: "Assign the service principal the Contributor role on WS_Lake.", fr: "Attribuer au principal de service le rôle Contributor sur WS_Lake." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      External shortcuts to Azure Data Lake Storage Gen2 delegate authorization to a cloud connection, and only users who have permission on that connection can bind a shortcut to it. Sharing conn-adls-sales with User1 makes it selectable; the service principal of the connection already has access to the data.
    fr: |
      Les raccourcis externes vers Azure Data Lake Storage Gen2 délèguent l'autorisation à une connexion cloud, et seuls les utilisateurs qui ont une autorisation sur cette connexion peuvent y lier un raccourci. Partager conn-adls-sales avec User1 la rend sélectionnable ; le principal de service de la connexion a déjà accès aux données.
  options:
    a:
      en: |
        Access to the data goes through the connection's service principal, not through User1's identity, and a storage role does not grant permission on the Fabric connection.
      fr: |
        L'accès aux données passe par le principal de service de la connexion, pas par l'identité de User1, et un rôle de stockage n'accorde pas d'autorisation sur la connexion Fabric.
    b:
      en: |
        Contributor already allows creating shortcuts in the lakehouse. Connections have their own permissions that workspace roles do not grant.
      fr: |
        Contributor permet déjà de créer des raccourcis dans le lakehouse. Les connexions ont leurs propres autorisations, que les rôles d'espace de travail n'accordent pas.
    d:
      en: |
        The service principal authenticates to the storage account; a workspace role for it does not let User1 use the connection.
      fr: |
        Le principal de service s'authentifie auprès du compte de stockage ; un rôle d'espace de travail pour lui ne permet pas à User1 d'utiliser la connexion.
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
