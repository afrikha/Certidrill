id: dp700-3a-dataflow-rows-written
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Dataflow Gen2 named DF_Products that cleans product data and writes it to a table in a lakehouse named LH_Silver by using an output destination.

    After a refresh, you need to check how many rows DF_Products wrote to LH_Silver during that refresh.

    Where should you look?
  fr: |
    Vous disposez d'un Dataflow Gen2 nommé DF_Products qui nettoie des données de produits et les écrit dans une table d'un lakehouse nommé LH_Silver à l'aide d'une destination de sortie.

    Après une actualisation, vous devez vérifier combien de lignes DF_Products a écrites dans LH_Silver pendant cette actualisation.

    Où devez-vous regarder ?
body:
  options:
    - { id: a, text: { en: "In the refresh details, the Tables section, then the details of the query", fr: "Dans les détails de l'actualisation, la section Tables, puis le détail de la requête" } }
    - { id: b, text: { en: "In the workspace list, the Status column of DF_Products", fr: "Dans la liste de l'espace de travail, la colonne Status de DF_Products" } }
    - { id: c, text: { en: "In the Microsoft Fabric Capacity Metrics app, the details of DF_Products", fr: "Dans l'application Microsoft Fabric Capacity Metrics, le détail de DF_Products" } }
    - { id: d, text: { en: "In the refresh details, the Activities section, then the details of the activity", fr: "Dans les détails de l'actualisation, la section Activities, puis le détail de l'activité" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In the refresh details, the Activities section lists the actions performed during the refresh, such as loading data to an output destination. The details of an activity include its statistics: bytes and rows read and written, depending on what the connector reports.
    fr: |
      Dans les détails de l'actualisation, la section Activities liste les actions réalisées pendant l'actualisation, comme le chargement des données vers une destination de sortie. Le détail d'une activité comprend ses statistiques : octets et lignes lus et écrits, selon ce que le connecteur signale.
  options:
    a:
      en: |
        The Tables section lists the queries with loading enabled, which the dataflow stages in its staging area; the load to the output destination is an activity.
      fr: |
        La section Tables liste les requêtes dont le chargement est activé, que le dataflow place dans sa zone de transit (staging) ; le chargement vers la destination de sortie est une activité.
    b:
      en: |
        The Status column shows whether the last refresh, save or validation failed, not row counts.
      fr: |
        La colonne Status indique si la dernière actualisation, le dernier enregistrement ou la dernière validation a échoué, pas des nombres de lignes.
    c:
      en: |
        The Capacity Metrics app reports capacity units consumed, not the rows written by a refresh.
      fr: |
        L'application Capacity Metrics indique les unités de capacité consommées, pas les lignes écrites par une actualisation.
references:
  - title: View Dataflow Gen2 refresh history and monitoring
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor
