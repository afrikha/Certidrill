id: dp700-3a-refresh-limits
objective: "3.1.3"
type: dropdown
difficulty: 1
shuffle: false
status: draft
stem:
  en: |
    Tailspin has two workspaces that contain import-mode semantic models. WS-Pro uses Power BI Pro licenses on shared capacity. WS-Fabric is assigned to an F64 capacity. The BI team plans refresh schedules and wants to know the refresh limits of each workspace.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose de deux espaces de travail qui contiennent des modèles sémantiques en mode importation. WS-Pro utilise des licences Power BI Pro sur une capacité partagée. WS-Fabric est affecté à une capacité F64. L'équipe BI prépare les planifications d'actualisation et veut connaître les limites d'actualisation de chaque espace de travail.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A semantic model in WS-Pro can have up to [[pro]] scheduled refreshes per day.

      A semantic model in WS-Fabric can have up to [[fab]] scheduled refreshes per day.

      A data refresh in WS-Pro must complete in less than [[shared]].

      A data refresh in WS-Fabric can run for up to [[premium]], unless it is started through the XMLA endpoint.
    fr: |
      Un modèle sémantique de WS-Pro peut avoir jusqu'à [[pro]] actualisations planifiées par jour.

      Un modèle sémantique de WS-Fabric peut avoir jusqu'à [[fab]] actualisations planifiées par jour.

      Une actualisation des données dans WS-Pro doit se terminer en moins de [[shared]].

      Une actualisation des données dans WS-Fabric peut durer jusqu'à [[premium]], sauf si elle est démarrée via le point de terminaison XMLA.
  slots:
    - id: pro
      options:
        - { id: p4, text: "4" }
        - { id: p8, text: "8" }
        - { id: p12, text: "12" }
        - { id: p24, text: "24" }
    - id: fab
      options:
        - { id: f12, text: "12" }
        - { id: f24, text: "24" }
        - { id: f30, text: "30" }
        - { id: f48, text: "48" }
    - id: shared
      options:
        - { id: s30, text: { en: "30 minutes", fr: "30 minutes" } }
        - { id: s1, text: { en: "1 hour", fr: "1 heure" } }
        - { id: s2, text: { en: "2 hours", fr: "2 heures" } }
        - { id: s5, text: { en: "5 hours", fr: "5 heures" } }
    - id: premium
      options:
        - { id: h3, text: { en: "3 hours", fr: "3 heures" } }
        - { id: h5, text: { en: "5 hours", fr: "5 heures" } }
        - { id: h8, text: { en: "8 hours", fr: "8 heures" } }
        - { id: h12, text: { en: "12 hours", fr: "12 heures" } }
answer:
  values: { pro: p8, fab: f48, shared: s2, premium: h5 }
explanation:
  correct:
    en: |
      On shared capacity (Pro), a semantic model can have up to 8 scheduled refreshes per day, and a data refresh must complete in less than two hours. On Premium, Premium per user or Fabric capacity, the limit is 48 scheduled refreshes per day and the maximum refresh duration is five hours; a refresh through the XMLA endpoint can bypass the five-hour limit.
    fr: |
      Sur une capacité partagée (Pro), un modèle sémantique peut avoir jusqu'à 8 actualisations planifiées par jour, et une actualisation des données doit se terminer en moins de deux heures. Sur une capacité Premium, Premium par utilisateur ou Fabric, la limite est de 48 actualisations planifiées par jour et la durée maximale d'une actualisation est de cinq heures ; une actualisation via le point de terminaison XMLA peut contourner la limite de cinq heures.
references:
  - title: Data refresh in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-data
