id: dp700-3b-dataflow-fixed-schema
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Sales and a Dataflow Gen2 named DF_Orders.

    DF_Orders contains a query named Orders whose data destination is a table named Orders in LH_Sales. The destination uses manual settings: the update method is Replace and the schema option is Fixed schema.

    You add a column named DiscountCode to the Orders query. Publishing DF_Orders now fails.

    You need the Orders table to contain the DiscountCode column after the next refresh. No relationships or measures depend on the Orders table.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Sales et un Dataflow Gen2 nommé DF_Orders.

    DF_Orders contient une requête nommée Orders dont la destination de données est une table nommée Orders dans LH_Sales. La destination utilise des paramètres manuels : la méthode de mise à jour est Replace et l'option de schéma est Fixed schema.

    Vous ajoutez une colonne nommée DiscountCode à la requête Orders. La publication de DF_Orders échoue désormais.

    La table Orders doit contenir la colonne DiscountCode après la prochaine actualisation. Aucune relation ni mesure ne dépend de la table Orders.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the update method to Append, and then publish DF_Orders", fr: "Remplacer la méthode de mise à jour par Append, puis publier DF_Orders" } }
    - { id: b, text: { en: "Enable staging for the Orders query, and then publish DF_Orders", fr: "Activer le staging pour la requête Orders, puis publier DF_Orders" } }
    - { id: c, text: { en: "Set Synchronize SQL Analytics Endpoint metadata to False, and then publish DF_Orders", fr: "Définir Synchronize SQL Analytics Endpoint metadata sur False, puis publier DF_Orders" } }
    - { id: d, text: { en: "Change the schema option to Dynamic schema, update the column mapping, and then publish DF_Orders", fr: "Remplacer l'option de schéma par Dynamic schema, mettre à jour le mappage de colonnes, puis publier DF_Orders" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With Fixed schema, schema changes aren't possible, and publishing fails when the query schema no longer matches the destination. Dynamic schema (available with Replace) allows the change: with manual settings you update the mapping, and the table is dropped and recreated with the new schema. That can remove relationships or measures, which isn't an issue here.
    fr: |
      Avec Fixed schema, les modifications de schéma sont impossibles, et la publication échoue quand le schéma de la requête ne correspond plus à la destination. Dynamic schema (disponible avec Replace) autorise la modification : avec des paramètres manuels, vous mettez à jour le mappage, et la table est supprimée puis recréée avec le nouveau schéma. Cela peut supprimer des relations ou des mesures, ce qui ne pose pas de problème ici.
  options:
    a: { en: "Schema changes aren't possible with Append, so the new column still can't reach the table.", fr: "Les modifications de schéma sont impossibles avec Append : la nouvelle colonne ne peut toujours pas atteindre la table." }
    b: { en: "Staging changes how the query is processed, not whether the destination schema can change.", fr: "Le staging change la façon dont la requête est traitée, pas la possibilité de modifier le schéma de destination." }
    c: { en: "This option controls the metadata sync of the SQL analytics endpoint after a refresh, not the schema check at publish time.", fr: "Cette option contrôle la synchronisation des métadonnées du point de terminaison d'analytique SQL après une actualisation, pas la vérification du schéma à la publication." }
references:
  - title: Dataflow Gen2 data destinations and managed settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-and-managed-settings
