id: dp700-3a-alert-report-visual
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Power BI report named Daily Orders that uses a semantic model in a Fabric workspace. A visual of the report shows the number of orders received per warehouse.

    When the number of orders of a warehouse drops below 100, a pipeline named PL_Reconcile must run automatically and the warehouse manager must receive an email. The solution must not require any code.

    What should you create?
  fr: |
    Northwind dispose d'un rapport Power BI nommé Daily Orders qui utilise un modèle sémantique dans un espace de travail Fabric. Un visuel du rapport affiche le nombre de commandes reçues par entrepôt logistique.

    Quand le nombre de commandes d'un entrepôt logistique passe sous 100, un pipeline nommé PL_Reconcile doit s'exécuter automatiquement et le responsable de l'entrepôt doit recevoir un e-mail. La solution ne doit demander aucun code.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An Activator rule set on the visual, with actions that run PL_Reconcile and send an email", fr: "Une règle Activator définie sur le visuel, avec des actions qui exécutent PL_Reconcile et envoient un e-mail" } }
    - { id: b, text: { en: "A subscription to the Daily Orders report, sent each morning to every warehouse manager", fr: "Un abonnement au rapport Daily Orders, envoyé chaque matin à chaque responsable d'entrepôt" } }
    - { id: c, text: { en: "An Activator-based alert rule on the semantic model, created from the Job runs page", fr: "Une règle d'alerte basée sur Activator sur le modèle sémantique, créée depuis la page Job runs" } }
    - { id: d, text: { en: "A schedule failure email on PL_Reconcile with the warehouse managers as recipients", fr: "Un e-mail d'échec de planification sur PL_Reconcile avec les responsables d'entrepôt comme destinataires" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Fabric Activator can monitor Power BI reports: it takes periodic observations of the visual's data and evaluates the rule for each warehouse. When the condition is met, a rule can run a Fabric item such as a pipeline and send an email, without code.
    fr: |
      Fabric Activator peut surveiller des rapports Power BI : il prend des observations périodiques des données du visuel et évalue la règle pour chaque entrepôt logistique. Quand la condition est remplie, une règle peut exécuter un élément Fabric comme un pipeline et envoyer un e-mail, sans code.
  options:
    b:
      en: |
        A subscription sends report snapshots on a schedule; it doesn't evaluate a threshold or run a pipeline.
      fr: |
        Un abonnement envoie des captures du rapport selon une planification ; il n'évalue pas de seuil et n'exécute pas de pipeline.
    c:
      en: |
        Job alerts react to job events such as a run failing or succeeding, not to values in the data, and semantic models aren't among their supported job types.
      fr: |
        Les alertes de tâche réagissent à des événements de tâche, comme l'échec ou la réussite d'une exécution, pas aux valeurs des données, et les modèles sémantiques ne font pas partie des types de tâches pris en charge.
    d:
      en: |
        A schedule failure email reports a failed scheduled run of PL_Reconcile; it doesn't start PL_Reconcile.
      fr: |
        Un e-mail d'échec de planification signale une exécution planifiée en échec de PL_Reconcile ; il ne démarre pas PL_Reconcile.
references:
  - title: What is Fabric Activator?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-introduction
