id: dp700-3a-stream-metrics-grid
objective: "3.1.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Proseware has an eventstream named ES_Meters. ES_Meters reads events from an Azure Event Hubs source named EH-Meters and sends them to a lakehouse destination named LH-Meters and to an eventhouse destination named KQL-Meters that uses the Event processing before ingestion mode.

    The Data insights tab shows the following totals for the last hour.

    Answer each prompt by selecting the appropriate cell.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un flux d'événements (eventstream) nommé ES_Meters. ES_Meters lit des événements depuis une source Azure Event Hubs nommée EH-Meters et les envoie vers une destination lakehouse nommée LH-Meters et vers une destination eventhouse nommée KQL-Meters qui utilise le mode Event processing before ingestion.

    L'onglet Data insights affiche les totaux suivants pour la dernière heure.

    Répondez à chaque consigne en sélectionnant la cellule appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Rows are missing in the LH-Meters table although every event reached that destination node. Select the cell that explains the missing rows.", fr: "Des lignes manquent dans la table de LH-Meters alors que tous les événements ont atteint ce nœud de destination. Sélectionnez la cellule qui explique les lignes manquantes." }
    - id: p2
      text: { en: "Select the cell that shows that the engine is falling behind the events it must process.", fr: "Sélectionnez la cellule qui montre que le moteur prend du retard sur les événements qu'il doit traiter." }
  grid:
    header: [{ en: Node, fr: Nœud }, Input events, Output events, Backlogged input events, Data conversion errors, Deserialization errors]
    rows:
      - [{ text: EH-Meters }, { text: "60,000", area: eh-in }, { text: "60,000", area: eh-out }, { text: "0", area: eh-back }, { text: "0", area: eh-conv }, { text: "0", area: eh-deser }]
      - [{ text: LH-Meters }, { text: "60,000", area: lh-in }, { text: "57,600", area: lh-out }, { text: "0", area: lh-back }, { text: "2,400", area: lh-conv }, { text: "0", area: lh-deser }]
      - [{ text: KQL-Meters }, { text: "60,000", area: kql-in }, { text: "41,000", area: kql-out }, { text: "19,000", area: kql-back }, { text: "0", area: kql-conv }, { text: "0", area: kql-deser }]
answer:
  values: { p1: lh-conv, p2: kql-back }
explanation:
  correct:
    en: |
      LH-Meters received all 60,000 input events but wrote only 57,600 output events: the 2,400 data conversion errors are output events that couldn't be converted to the expected output schema of the table. KQL-Meters has 19,000 backlogged input events, which are events waiting in the engine; its lower output count reflects the backlog, not errors, because its error counters are 0.
    fr: |
      LH-Meters a reçu les 60 000 événements d'entrée mais n'a écrit que 57 600 événements de sortie : les 2 400 erreurs de conversion de données sont des événements de sortie qui n'ont pas pu être convertis vers le schéma de sortie attendu de la table. KQL-Meters a 19 000 événements d'entrée en attente (backlog) dans le moteur ; son nombre de sorties plus faible reflète ce retard, pas des erreurs, car ses compteurs d'erreurs sont à 0.
  options:
    lh-out: { en: "Output events shows that rows are missing, not why they are missing.", fr: "Output events montre que des lignes manquent, pas pourquoi elles manquent." }
    kql-out: { en: "The lower output count of KQL-Meters is a consequence; the backlog metric is what shows the engine falling behind.", fr: "Le nombre de sorties plus faible de KQL-Meters est une conséquence ; c'est la métrique de backlog qui montre que le moteur prend du retard." }
references:
  - title: Monitor the status and performance of an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor
