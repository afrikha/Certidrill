id: dp700-3a-alert-mechanism-match
objective: "3.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a workspace on a Fabric capacity. The workspace contains a scheduled notebook named NB_Score, a pipeline named PL_Orders that contains a Copy activity named Copy_Orders, an import-mode semantic model named SM_Orders with a refresh schedule, and a pipeline named PL_Cleanup. Workspace monitoring is enabled.

    You need to choose an alerting mechanism for each requirement.

    Which mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail sur une capacité Fabric. L'espace de travail contient un notebook planifié nommé NB_Score, un pipeline nommé PL_Orders qui contient une activité Copy nommée Copy_Orders, un modèle sémantique en mode importation nommé SM_Orders doté d'une planification d'actualisation, et un pipeline nommé PL_Cleanup. La supervision de l'espace de travail est activée.

    Vous devez choisir un mécanisme d'alerte pour chaque exigence.

    Quel mécanisme devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sched, text: { en: "Schedule failure emails", fr: "E-mails d'échec de planification (Schedule failure emails)" } }
    - { id: teams, text: { en: "A Teams activity on the failure path of Copy_Orders", fr: "Une activité Teams sur le chemin d'échec de Copy_Orders" } }
    - { id: contacts, text: { en: "Email these contacts when the refresh fails", fr: "Email these contacts when the refresh fails" } }
    - { id: events, text: { en: "A Fabric workspace item event with an Activator rule", fr: "Un événement d'élément d'espace de travail Fabric avec une règle Activator" } }
    - { id: paid, text: { en: "An Activator-based alert rule from the Job runs page", fr: "Une règle d'alerte basée sur Activator depuis la page Job runs" } }
    - { id: capacity, text: { en: "The Microsoft Fabric Capacity Metrics app", fr: "L'application Microsoft Fabric Capacity Metrics" } }
  targets:
    - id: t1
      text: { en: "At no cost, email the data science group when a scheduled run of NB_Score fails.", fr: "Sans coût, envoyer un e-mail au groupe de science des données quand une exécution planifiée de NB_Score échoue." }
    - id: t2
      text: { en: "From inside PL_Orders, post a message with the run ID to a Teams channel when Copy_Orders fails.", fr: "Depuis PL_Orders, publier un message avec l'ID d'exécution dans un canal Teams quand Copy_Orders échoue." }
    - id: t3
      text: { en: "Email the BI team when a scheduled refresh of SM_Orders fails.", fr: "Envoyer un e-mail à l'équipe BI quand une actualisation planifiée de SM_Orders échoue." }
    - id: t4
      text: { en: "Run PL_Cleanup automatically when an item is deleted from the workspace.", fr: "Exécuter automatiquement PL_Cleanup quand un élément est supprimé de l'espace de travail." }
answer:
  mapping: { t1: sched, t2: teams, t3: contacts, t4: events }
explanation:
  correct:
    en: |
      Schedule failure emails are free and cover failed scheduled runs. A Teams activity runs inside the pipeline flow and can include dynamic content such as the run ID. Semantic models aren't supported on the Schedule failures page, so refresh failures are emailed through the model's Email these contacts when the refresh fails setting. Fabric events, such as workspace item events, can feed an Activator rule whose action runs a pipeline.
    fr: |
      Les e-mails d'échec de planification sont gratuits et couvrent les exécutions planifiées en échec. Une activité Teams s'exécute dans le flux du pipeline et peut inclure du contenu dynamique comme l'ID d'exécution. Les modèles sémantiques ne sont pas pris en charge dans la page Schedule failures : les échecs d'actualisation sont donc envoyés par e-mail via le paramètre Email these contacts when the refresh fails du modèle. Les événements Fabric, comme les événements d'éléments d'espace de travail, peuvent alimenter une règle Activator dont l'action exécute un pipeline.
  options:
    paid: { en: "Activator-based job alerts are paid, react to job events rather than item deletion, and run outside the pipeline flow.", fr: "Les alertes de tâche basées sur Activator sont payantes, réagissent à des événements de tâche plutôt qu'à la suppression d'un élément, et s'exécutent en dehors du flux du pipeline." }
    capacity: { en: "The Capacity Metrics app reports capacity consumption; it sends no alert.", fr: "L'application Capacity Metrics indique la consommation de capacité ; elle n'envoie aucune alerte." }
references:
  - title: Set up job alerts in the Monitor hub (preview)
    url: https://learn.microsoft.com/en-us/fabric/admin/monitoring-hub-alerts
  - title: What is Fabric Activator?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-introduction
