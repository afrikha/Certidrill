id: dp700-3a-refresh-tool-match
objective: "3.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has a workspace on a Fabric capacity. The workspace contains a lakehouse named LH_Sales, a pipeline named PL_Sales that loads LH_Sales, and an import-mode semantic model named SM_Sales.

    You need to choose a tool for each monitoring requirement of SM_Sales.

    Which tool should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un espace de travail sur une capacité Fabric. L'espace de travail contient un lakehouse nommé LH_Sales, un pipeline nommé PL_Sales qui charge LH_Sales et un modèle sémantique en mode importation nommé SM_Sales.

    Vous devez choisir un outil pour chaque exigence de supervision de SM_Sales.

    Quel outil devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les outils appropriés vers les exigences correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: history, text: { en: "The refresh history of SM_Sales", fr: "L'historique des actualisations de SM_Sales" } }
    - { id: activity, text: { en: "A Semantic model refresh activity in PL_Sales", fr: "Une activité Semantic model refresh dans PL_Sales" } }
    - { id: capacity, text: { en: "The Microsoft Fabric Capacity Metrics app", fr: "L'application Microsoft Fabric Capacity Metrics" } }
    - { id: insights, text: { en: "The queryinsights views of LH_Sales", fr: "Les vues queryinsights de LH_Sales" } }
    - { id: spark, text: { en: "The Spark application detail page", fr: "La page de détail de l'application Spark" } }
  targets:
    - id: t1
      text: { en: "Read the error message of each failed scheduled refresh attempt of SM_Sales.", fr: "Lire le message d'erreur de chaque tentative d'actualisation planifiée en échec de SM_Sales." }
    - id: t2
      text: { en: "Refresh SM_Sales only after PL_Sales loads LH_Sales, and see a refresh failure in the pipeline run.", fr: "Actualiser SM_Sales uniquement après le chargement de LH_Sales par PL_Sales, et voir un échec d'actualisation dans l'exécution du pipeline." }
    - id: t4
      text: { en: "Find how many capacity units the refreshes of SM_Sales consume compared to other items.", fr: "Déterminer combien d'unités de capacité les actualisations de SM_Sales consomment par rapport aux autres éléments." }
answer:
  mapping: { t1: history, t2: activity, t4: capacity }
explanation:
  correct:
    en: |
      The refresh history shows the status, duration and error message of each refresh attempt. A Semantic model refresh activity placed after the load refreshes the model and, with Wait on completion, fails when the refresh fails. The Capacity Metrics app shows which items consume the capacity.
    fr: |
      L'historique des actualisations affiche le statut, la durée et le message d'erreur de chaque tentative d'actualisation. Une activité Semantic model refresh placée après le chargement actualise le modèle et, avec Wait on completion, échoue quand l'actualisation échoue. L'application Capacity Metrics montre quels éléments consomment la capacité.
  options:
    insights: { en: "Query insights records T-SQL queries on the SQL analytics endpoint, not model refreshes.", fr: "Query insights enregistre les requêtes T-SQL sur le point de terminaison d'analytique SQL, pas les actualisations du modèle." }
    spark: { en: "The Spark application detail page monitors notebooks and Spark job definitions, not semantic model refreshes.", fr: "La page de détail de l'application Spark supervise les notebooks et les définitions de tâche Spark, pas les actualisations de modèles sémantiques." }
references:
  - title: Configure scheduled refresh
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-scheduled-refresh
