id: dp700-3a-alert-guest-recipient
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a scheduled pipeline named PL_Export that sends files to a logistics partner. Litware added failure notifications to the schedule of PL_Export.

    A support engineer at the partner, who uses an email address in the partner's own domain, must also receive these failure emails. The engineer has no account in the Microsoft Entra tenant of Litware.

    What should you do?
  fr: |
    Litware dispose d'un pipeline planifié nommé PL_Export qui envoie des fichiers à un partenaire logistique. Litware a ajouté des notifications d'échec à la planification de PL_Export.

    Un ingénieur support du partenaire, qui utilise une adresse e-mail du domaine du partenaire, doit aussi recevoir ces e-mails d'échec. L'ingénieur n'a pas de compte dans le locataire Microsoft Entra de Litware.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Type the engineer's external email address in the failure notification recipients", fr: "Saisir l'adresse e-mail externe de l'ingénieur dans les destinataires des notifications d'échec" } }
    - { id: b, text: { en: "Add the engineer's address to Email these contacts when the refresh fails on a semantic model", fr: "Ajouter l'adresse de l'ingénieur dans Email these contacts when the refresh fails d'un modèle sémantique" } }
    - { id: c, text: { en: "Add a Teams activity to PL_Export that posts to a group chat with the engineer's address", fr: "Ajouter à PL_Export une activité Teams qui publie dans une conversation de groupe avec l'adresse de l'ingénieur" } }
    - { id: d, text: { en: "Invite the engineer as a B2B guest user, then add the guest to the recipients", fr: "Inviter l'ingénieur comme utilisateur invité B2B, puis ajouter l'invité aux destinataires" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Recipients of the failure notifications of a schedule must be users or groups of your Microsoft Entra tenant, and B2B guest users are supported. Direct external email addresses aren't supported, so you invite the engineer as a guest first.
    fr: |
      Les destinataires des notifications d'échec d'une planification doivent être des utilisateurs ou des groupes de votre locataire Microsoft Entra, et les utilisateurs invités B2B sont pris en charge. Les adresses e-mail externes saisies directement ne sont pas prises en charge : vous invitez donc d'abord l'ingénieur comme invité.
  options:
    a:
      en: |
        Failure notifications don't support direct external email addresses.
      fr: |
        Les notifications d'échec ne prennent pas en charge les adresses e-mail externes saisies directement.
    b:
      en: |
        Refresh failure contacts concern semantic model refreshes, not PL_Export, and they must also be in the Entra tenant.
      fr: |
        Les contacts d'échec d'actualisation concernent les actualisations de modèles sémantiques, pas PL_Export, et ils doivent eux aussi appartenir au locataire Entra.
    c:
      en: |
        The Teams activity posts to a channel or to a group chat you belong to, not to an external email address, and it changes the pipeline.
      fr: |
        L'activité Teams publie dans un canal ou dans une conversation de groupe dont vous êtes membre, pas vers une adresse e-mail externe, et elle modifie le pipeline.
references:
  - title: Job Scheduler in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
