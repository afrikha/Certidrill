id: dp700-3c-small-files-optimize
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH_Pos that contains a Delta table named transactions. A streaming job has appended data to transactions every minute for six months.

    Spark queries on transactions have become slow. DESCRIBE DETAIL shows that the table contains about 480,000 data files with an average size of 40 KB.

    You need to improve the read performance of the existing data in transactions.

    What should you do?
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH_Pos qui contient une table Delta nommée transactions. Un travail de streaming ajoute des données à transactions toutes les minutes depuis six mois.

    Les requêtes Spark sur transactions sont devenues lentes. DESCRIBE DETAIL indique que la table contient environ 480 000 fichiers de données d'une taille moyenne de 40 Ko.

    Vous devez améliorer les performances de lecture des données existantes de transactions.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run OPTIMIZE on transactions to compact the small files.", fr: "Exécuter OPTIMIZE sur transactions pour compacter les petits fichiers." } }
    - { id: b, text: { en: "Run VACUUM on transactions with the default retention period.", fr: "Exécuter VACUUM sur transactions avec la période de rétention par défaut." } }
    - { id: c, text: { en: "Rewrite transactions partitioned by the transaction_id column.", fr: "Réécrire transactions en la partitionnant sur la colonne transaction_id." } }
    - { id: d, text: { en: "Set the delta.parquet.vorder.enabled table property to true.", fr: "Définir la propriété de table delta.parquet.vorder.enabled sur true." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Frequent small appends leave many small Parquet files, and reading them is slow. OPTIMIZE performs bin compaction: it groups the small files and rewrites them into fewer, larger files, which directly speeds up reads of the existing data.
    fr: |
      Des ajouts fréquents et petits laissent de nombreux petits fichiers Parquet, dont la lecture est lente. OPTIMIZE effectue un compactage par regroupement : il rassemble les petits fichiers et les réécrit en fichiers moins nombreux et plus grands, ce qui accélère directement la lecture des données existantes.
  options:
    b:
      en: |
        VACUUM deletes data files that the table no longer references. It reclaims storage but does not change the layout of the active files.
      fr: |
        VACUUM supprime les fichiers de données que la table ne référence plus. Il libère du stockage mais ne change pas la disposition des fichiers actifs.
    c:
      en: |
        Partitioning on a high-cardinality column such as an ID creates a partition per value and many more small files.
      fr: |
        Partitionner sur une colonne à cardinalité élevée comme un ID crée une partition par valeur et beaucoup plus de petits fichiers.
    d:
      en: |
        A change to the V-Order table property applies only to future writes; the existing small files keep their layout.
      fr: |
        Une modification de la propriété de table V-Order ne s'applique qu'aux écritures futures ; les petits fichiers existants gardent leur disposition.
references:
  - title: Table Compaction
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/table-compaction
