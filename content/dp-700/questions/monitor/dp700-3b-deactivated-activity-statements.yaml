id: dp700-3b-deactivated-activity-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Finance. While you troubleshoot PL_Finance, you want to stop some activities from running without deleting them, and you review how its dependencies behave.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Finance. Pendant que vous dépannez PL_Finance, vous voulez empêcher certaines activités de s'exécuter sans les supprimer, et vous examinez le comportement de ses dépendances.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If you set the Activity state of an activity to Deactivated and Mark activity as to Failed, the activities connected to it by an Upon Failure dependency run."
        fr: "Si vous définissez Activity state d'une activité sur Deactivated et Mark activity as sur Failed, les activités qui y sont reliées par une dépendance Upon Failure s'exécutent."
    - id: s2
      text:
        en: "In a pipeline run, a deactivated activity appears with the status Inactive."
        fr: "Dans une exécution de pipeline, une activité désactivée apparaît avec le statut Inactive."
    - id: s3
      text:
        en: "An activity can be connected to one downstream activity by an Upon Completion dependency and to another downstream activity by an Upon Failure dependency."
        fr: "Une activité peut être reliée à une activité en aval par une dépendance Upon Completion et à une autre activité en aval par une dépendance Upon Failure."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "A deactivated activity doesn't execute; Mark activity as decides which branch follows, and Failed runs the Upon Failure or Upon Completion branch. During the run, the deactivated activity is shown as a placeholder with the reserved status Inactive. Upon Completion can't coexist with Upon Success or Upon Failure from the same activity."
    fr: "Une activité désactivée ne s'exécute pas ; Mark activity as détermine la branche qui suit, et Failed exécute la branche Upon Failure ou Upon Completion. Pendant l'exécution, l'activité désactivée apparaît comme un élément d'espace réservé avec le statut réservé Inactive. Upon Completion ne peut pas coexister avec Upon Success ou Upon Failure depuis la même activité."
references:
  - title: Activity overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview
  - title: Pipeline failure and error message
    url: https://learn.microsoft.com/en-us/azure/data-factory/tutorial-pipeline-failure-error-handling
