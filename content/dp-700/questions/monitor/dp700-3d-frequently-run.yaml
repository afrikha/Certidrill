id: dp700-3d-frequently-run
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that is queried by several reports and applications. You plan to optimize the queries that consume the most resources overall.

    You need to identify the query shapes that run the most often on DW1 and see how many times each one succeeded. The solution must minimize development effort.

    Which view should you query?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 interrogé par plusieurs rapports et applications. Vous prévoyez d'optimiser les requêtes qui consomment globalement le plus de ressources.

    Vous devez identifier les formes de requêtes exécutées le plus souvent sur DW1 et voir combien de fois chacune a réussi. La solution doit réduire au minimum l'effort de développement.

    Quelle vue devez-vous interroger ?
body:
  options:
    - { id: a, text: queryinsights.long_running_queries }
    - { id: b, text: queryinsights.exec_sessions_history }
    - { id: c, text: queryinsights.frequently_run_queries }
    - { id: d, text: queryinsights.sql_pool_insights }
answer: { optionId: c }
explanation:
  correct:
    en: "queryinsights.frequently_run_queries aggregates the completed queries by query shape, so runs that differ only in predicate values count together, and it includes the number of successful runs. You can then drill into individual executions in exec_requests_history by using query_hash. Query insights keeps 30 days of history."
    fr: "queryinsights.frequently_run_queries agrège les requêtes terminées par forme de requête : les exécutions qui ne diffèrent que par les valeurs des prédicats sont comptées ensemble, et la vue inclut le nombre d'exécutions réussies. Vous pouvez ensuite examiner les exécutions individuelles dans exec_requests_history avec query_hash. Query insights conserve 30 jours d'historique."
  options:
    a: { en: "long_running_queries ranks query shapes by execution time, not by how often they run.", fr: "long_running_queries classe les formes de requêtes par durée d'exécution, pas par fréquence." }
    b: { en: "exec_sessions_history has one row per completed session, not statistics per query.", fr: "exec_sessions_history contient une ligne par session terminée, pas de statistiques par requête." }
    d: { en: "sql_pool_insights reports resource allocation and pool pressure, not query frequency.", fr: "sql_pool_insights rend compte de l'allocation des ressources et de la pression sur les pools, pas de la fréquence des requêtes." }
references:
  - title: Query insights in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights
