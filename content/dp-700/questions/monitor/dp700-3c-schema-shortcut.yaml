id: dp700-3c-schema-shortcut
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have two schema-enabled lakehouses named LH_Source and LH_Analytics. The sales schema of LH_Source contains 35 Delta tables, and new tables are added every month.

    A data engineer tries to create shortcuts in a folder named Tables/sales_import of LH_Analytics, one for each table, and the creation fails.

    You need all the current and future tables of the sales schema of LH_Source to be available in LH_Analytics. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Vous disposez de deux lakehouses avec schémas nommés LH_Source et LH_Analytics. Le schéma sales de LH_Source contient 35 tables Delta, et de nouvelles tables sont ajoutées chaque mois.

    Un ingénieur données essaie de créer des raccourcis dans un dossier nommé Tables/sales_import de LH_Analytics, un par table, et la création échoue.

    Toutes les tables actuelles et futures du schéma sales de LH_Source doivent être disponibles dans LH_Analytics. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create one shortcut at the top level of Tables in LH_Analytics that targets the sales schema of LH_Source.", fr: "Créer dans LH_Analytics un raccourci au premier niveau de Tables qui cible le schéma sales de LH_Source." } }
    - { id: b, text: { en: "Create 35 shortcuts at the top level of Tables in LH_Analytics, one for each table of the sales schema.", fr: "Créer dans LH_Analytics 35 raccourcis au premier niveau de Tables, un pour chaque table du schéma sales." } }
    - { id: c, text: { en: "Create one shortcut in the Files folder of LH_Analytics that targets the sales schema folder of LH_Source.", fr: "Créer dans le dossier Files de LH_Analytics un raccourci qui cible le dossier du schéma sales de LH_Source." } }
    - { id: d, text: { en: "Create a shortcut in Tables/sales_import that targets the Tables folder of LH_Source.", fr: "Créer dans Tables/sales_import un raccourci qui cible le dossier Tables de LH_Source." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the Tables folder, shortcuts are supported only at the top level, which is why the creation in Tables/sales_import fails. In a schema-enabled lakehouse, a top-level shortcut can target a schema, the parent folder of several tables, so one shortcut exposes every table of the sales schema, including tables added later.
    fr: |
      Dans le dossier Tables, les raccourcis ne sont pris en charge qu'au premier niveau, ce qui explique l'échec de la création dans Tables/sales_import. Dans un lakehouse avec schémas, un raccourci de premier niveau peut cibler un schéma, le dossier parent de plusieurs tables : un seul raccourci expose donc toutes les tables du schéma sales, y compris celles ajoutées plus tard.
  options:
    b:
      en: |
        These shortcuts work, but new tables need new shortcuts every month, which does not minimize administrative effort.
      fr: |
        Ces raccourcis fonctionnent, mais chaque nouvelle table exige un nouveau raccourci chaque mois, ce qui ne réduit pas au minimum l'effort d'administration.
    c:
      en: |
        Shortcuts in Files are accessible as folders, but table discovery does not happen there, so the tables are not available as tables.
      fr: |
        Les raccourcis de Files sont accessibles comme des dossiers, mais aucune découverte de tables n'y a lieu : les tables ne sont pas disponibles en tant que tables.
    d:
      en: |
        A shortcut in a subfolder of Tables is not supported, whatever its target.
      fr: |
        Un raccourci dans un sous-dossier de Tables n'est pas pris en charge, quelle que soit sa cible.
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
