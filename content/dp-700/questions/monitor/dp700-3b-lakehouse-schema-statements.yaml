id: dp700-3b-lakehouse-schema-statements
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH1 and an eventstream named ES_Devices. ES_Devices writes events to an existing Delta table named Devices in LH1. Devices has three columns named DeviceId, Model, and Firmware.

    After an upstream change, some events contain a new field named Region, and some events no longer contain the Firmware field.

    Which two statements describe how ES_Devices writes these events to Devices?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH1 et un eventstream nommé ES_Devices. ES_Devices écrit des événements dans une table Delta existante nommée Devices dans LH1. Devices comporte trois colonnes nommées DeviceId, Model et Firmware.

    Après une modification en amont, certains événements contiennent un nouveau champ nommé Region, et certains événements ne contiennent plus le champ Firmware.

    Quelles sont les deux affirmations qui décrivent la façon dont ES_Devices écrit ces événements dans Devices ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Region values aren't written to Devices.", fr: "Les valeurs de Region ne sont pas écrites dans Devices." } }
    - { id: b, text: { en: "A Region column is added to Devices automatically.", fr: "Une colonne Region est ajoutée automatiquement à Devices." } }
    - { id: c, text: { en: "Events without Firmware are written with a null Firmware value.", fr: "Les événements sans Firmware sont écrits avec une valeur Firmware nulle." } }
    - { id: d, text: { en: "Events without Firmware are dropped from the stream.", fr: "Les événements sans Firmware sont supprimés du flux." } }
    - { id: e, text: { en: "The destination stops writing until the events match the table schema again.", fr: "La destination cesse d'écrire jusqu'à ce que les événements correspondent de nouveau au schéma de la table." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Writes to a lakehouse table must be compatible with the schema of the target table at write time. Columns that the table doesn't have aren't included in the data written, and columns that the incoming data lacks are written with null values. Only a record with no column in common with the table causes a schema conversion failure.
    fr: |
      Les écritures dans une table de lakehouse doivent être compatibles avec le schéma de la table cible au moment de l'écriture. Les colonnes que la table ne possède pas ne sont pas incluses dans les données écrites, et les colonnes absentes des données entrantes sont écrites avec des valeurs nulles. Seul un enregistrement sans aucune colonne commune avec la table provoque un échec de conversion de schéma.
  options:
    b: { en: "The table schema isn't evolved by the eventstream; extra columns are left out.", fr: "L'eventstream ne fait pas évoluer le schéma de la table ; les colonnes supplémentaires sont ignorées." }
    d: { en: "The events are written, with null in the missing column.", fr: "Les événements sont écrits, avec une valeur nulle dans la colonne manquante." }
    e: { en: "The events still share DeviceId and Model with the table, so the writes continue.", fr: "Les événements partagent toujours DeviceId et Model avec la table : les écritures continuent." }
references:
  - title: Add a lakehouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-lakehouse
