id: dp700-3c-vacuum-retention
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse named LH_Logs that contains a Delta table named app_events. app_events is rewritten every night, and its storage grows quickly.

    Your company decides that app_events only needs two days of history for time travel. You run the following statement in a notebook, and it fails.

    `VACUUM app_events RETAIN 48 HOURS`

    You need to remove the files of app_events that are no longer referenced and are older than 48 hours.

    What should you do first?
  fr: |
    Vous disposez d'un lakehouse Fabric nommé LH_Logs qui contient une table Delta nommée app_events. app_events est réécrite chaque nuit, et son stockage augmente rapidement.

    Votre entreprise décide que app_events n'a besoin que de deux jours d'historique pour le voyage dans le temps. Vous exécutez l'instruction suivante dans un notebook, et elle échoue.

    `VACUUM app_events RETAIN 48 HOURS`

    Vous devez supprimer les fichiers de app_events qui ne sont plus référencés et qui datent de plus de 48 heures.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Run OPTIMIZE on app_events to compact the files before you run VACUUM.", fr: "Exécuter OPTIMIZE sur app_events pour compacter les fichiers avant d'exécuter VACUUM." } }
    - { id: b, text: { en: "Set spark.databricks.delta.retentionDurationCheck.enabled to false.", fr: "Définir spark.databricks.delta.retentionDurationCheck.enabled sur false." } }
    - { id: c, text: { en: "Run Maintenance on app_events from the lakehouse explorer with a two-day retention.", fr: "Exécuter Maintenance sur app_events depuis l'explorateur du lakehouse avec une rétention de deux jours." } }
    - { id: d, text: { en: "Set the delta.autoOptimize.autoCompact table property of app_events to true.", fr: "Définir la propriété de table delta.autoOptimize.autoCompact de app_events sur true." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The default retention threshold of VACUUM is 7 days, and a shorter retention fails by default to protect time travel and concurrent readers. Setting spark.databricks.delta.retentionDurationCheck.enabled to false, for example in the environment, disables this check so that VACUUM app_events RETAIN 48 HOURS can run.
    fr: |
      Le seuil de rétention par défaut de VACUUM est de 7 jours, et une rétention plus courte échoue par défaut pour protéger le voyage dans le temps et les lecteurs simultanés. Définir spark.databricks.delta.retentionDurationCheck.enabled sur false, par exemple dans l'environnement, désactive cette vérification pour que VACUUM app_events RETAIN 48 HOURS puisse s'exécuter.
  options:
    a:
      en: |
        OPTIMIZE compacts the active files; it does not change the retention check that makes VACUUM fail.
      fr: |
        OPTIMIZE compacte les fichiers actifs ; il ne change pas la vérification de rétention qui fait échouer VACUUM.
    c:
      en: |
        Maintenance requests from the portal or the API with a retention under 7 days also fail by default, until the retention check is disabled.
      fr: |
        Les demandes de maintenance depuis le portail ou l'API avec une rétention inférieure à 7 jours échouent aussi par défaut, tant que la vérification de rétention n'est pas désactivée.
    d:
      en: |
        Auto compaction merges small files after writes. It does not delete unreferenced files.
      fr: |
        Le compactage automatique fusionne les petits fichiers après les écritures. Il ne supprime pas les fichiers non référencés.
references:
  - title: Delta Table Maintenance in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-table-maintenance
