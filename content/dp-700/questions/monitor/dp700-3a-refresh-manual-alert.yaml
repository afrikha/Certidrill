id: dp700-3a-refresh-manual-alert
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a pipeline named PL_Close that loads the month-end data into a lakehouse and then runs a Semantic model refresh activity for an import-mode semantic model named SM_Close. An accountant starts PL_Close manually after each month-end close. Wait on completion is turned on in the Semantic model refresh activity.

    BI-Support is listed in Email these contacts when the refresh fails for SM_Close, but nobody was notified when last month's refresh failed.

    You need BI-Support to be notified in their Teams channel whenever the refresh of SM_Close started by PL_Close fails.

    What should you do?
  fr: |
    Contoso dispose d'un pipeline nommé PL_Close qui charge les données de fin de mois dans un lakehouse, puis exécute une activité Semantic model refresh pour un modèle sémantique en mode importation nommé SM_Close. Un comptable démarre PL_Close manuellement après chaque clôture mensuelle. Wait on completion est activé dans l'activité Semantic model refresh.

    BI-Support figure dans Email these contacts when the refresh fails pour SM_Close, mais personne n'a été prévenu quand l'actualisation du mois dernier a échoué.

    Vous devez faire en sorte que BI-Support soit prévenu dans son canal Teams chaque fois que l'actualisation de SM_Close démarrée par PL_Close échoue.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a Teams activity on the failure path of the Semantic model refresh activity in PL_Close", fr: "Ajouter une activité Teams sur le chemin d'échec de l'activité Semantic model refresh dans PL_Close" } }
    - { id: b, text: { en: "Configure a schedule failure email for PL_Close in the Monitor hub with BI-Support as the recipient", fr: "Configurer un e-mail d'échec de planification pour PL_Close dans le hub de surveillance avec BI-Support comme destinataire" } }
    - { id: c, text: { en: "Turn off Wait on completion so that the refresh runs as a scheduled refresh of SM_Close", fr: "Désactiver Wait on completion pour que l'actualisation s'exécute comme une actualisation planifiée de SM_Close" } }
    - { id: d, text: { en: "Add the Teams channel address of BI-Support to Email these contacts when the refresh fails", fr: "Ajouter l'adresse du canal Teams de BI-Support dans Email these contacts when the refresh fails" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Power BI sends refresh failure emails only for scheduled refreshes, not for on-demand or programmatic refreshes such as the one started by the pipeline. With Wait on completion on, the Semantic model refresh activity ends when the refresh ends, so a failed refresh fails the activity, and a Teams activity on its failure path posts a message to the channel.
    fr: |
      Power BI n'envoie les e-mails d'échec d'actualisation que pour les actualisations planifiées, pas pour les actualisations à la demande ou programmatiques comme celle que démarre le pipeline. Avec Wait on completion activé, l'activité Semantic model refresh se termine à la fin de l'actualisation : une actualisation en échec fait échouer l'activité, et une activité Teams sur son chemin d'échec publie un message dans le canal.
  options:
    b:
      en: |
        Schedule failure emails cover scheduled runs only; PL_Close is started manually.
      fr: |
        Les e-mails d'échec de planification ne couvrent que les exécutions planifiées ; PL_Close est démarré manuellement.
    c:
      en: |
        Without Wait on completion, the activity doesn't wait for the refresh, so it succeeds even when the refresh fails; the refresh is still not a scheduled refresh.
      fr: |
        Sans Wait on completion, l'activité n'attend pas l'actualisation : elle réussit même si l'actualisation échoue, et l'actualisation n'est toujours pas une actualisation planifiée.
    d:
      en: |
        Refresh failure emails aren't sent for refreshes triggered programmatically, whatever the recipients are.
      fr: |
        Les e-mails d'échec d'actualisation ne sont pas envoyés pour les actualisations déclenchées par programmation, quels que soient les destinataires.
references:
  - title: Data refresh in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-data
  - title: Semantic model refresh activity in Data Factory for Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/semantic-model-refresh-activity
