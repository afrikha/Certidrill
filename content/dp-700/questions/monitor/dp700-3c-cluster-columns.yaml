id: dp700-3c-cluster-columns
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You are creating a table named dbo.FactTrips in a Fabric warehouse. The table will receive about 20 million rows per day in a single nightly load. It has the following columns:

    - TripID: bigint IDENTITY
    - TripDate: date
    - DriverID: int, about 80,000 distinct values
    - IsCancelled: bit
    - Region: varchar(20), six distinct values
    - Notes: varchar(max)

    Most queries filter on a range of TripDate values and on a single DriverID value in the same WHERE clause.

    You need to choose the clustering columns of dbo.FactTrips to minimize the files scanned by these queries.

    Which two columns should you include in the CLUSTER BY option? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une table nommée dbo.FactTrips dans un entrepôt Fabric. La table recevra environ 20 millions de lignes par jour en un seul chargement nocturne. Elle comporte les colonnes suivantes :

    - TripID : bigint IDENTITY
    - TripDate : date
    - DriverID : int, environ 80 000 valeurs distinctes
    - IsCancelled : bit
    - Region : varchar(20), six valeurs distinctes
    - Notes : varchar(max)

    La plupart des requêtes filtrent sur une plage de valeurs de TripDate et sur une seule valeur de DriverID dans la même clause WHERE.

    Vous devez choisir les colonnes de clustering de dbo.FactTrips pour réduire au minimum les fichiers analysés par ces requêtes.

    Quelles sont les deux colonnes à inclure dans l'option CLUSTER BY ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: TripID }
    - { id: b, text: TripDate }
    - { id: c, text: DriverID }
    - { id: d, text: IsCancelled }
    - { id: e, text: Region }
    - { id: f, text: Notes }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |
      Data clustering works best on mid-to-high cardinality columns that queries use together in range or selective WHERE filters, so TripDate and DriverID are the right pair; multi-column clustering helps mainly when all the columns appear together in the predicates, as here. Each nightly load is well above the one million rows that DML operations should have to benefit from clustering.
    fr: |
      Le clustering des données fonctionne le mieux sur des colonnes de cardinalité moyenne à élevée que les requêtes utilisent ensemble dans des filtres WHERE de plage ou sélectifs : TripDate et DriverID forment donc la bonne paire ; le clustering sur plusieurs colonnes aide surtout quand toutes les colonnes figurent ensemble dans les prédicats, comme ici. Chaque chargement nocturne dépasse largement le million de lignes que les opérations DML devraient compter pour profiter du clustering.
  options:
    a:
      en: |
        IDENTITY columns cannot be used as clustering columns, and the queries do not filter on TripID.
      fr: |
        Les colonnes IDENTITY ne peuvent pas être des colonnes de clustering, et les requêtes ne filtrent pas sur TripID.
    d:
      en: |
        The bit data type is not supported for clustering columns.
      fr: |
        Le type de données bit n'est pas pris en charge pour les colonnes de clustering.
    e:
      en: |
        A low-cardinality column such as Region offers limited file skipping, and the queries do not filter on it.
      fr: |
        Une colonne à faible cardinalité comme Region offre peu d'élimination de fichiers, et les requêtes ne filtrent pas dessus.
    f:
      en: |
        varchar(max) columns are not supported as clustering columns.
      fr: |
        Les colonnes varchar(max) ne sont pas prises en charge comme colonnes de clustering.
references:
  - title: Data clustering in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-clustering
