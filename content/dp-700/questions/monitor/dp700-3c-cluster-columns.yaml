id: dp700-3c-cluster-columns
objective: "3.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You are creating a table named dbo.FactTrips in a Fabric warehouse named DW_Mobility. Every night, about 20 million new trips must be loaded into dbo.FactTrips from a Delta table named trips_silver in a lakehouse of the same workspace. In trips_silver, DriverID is stored as a string that always contains a whole number.

    Most queries join dbo.FactTrips to a table named dbo.DimDriver on DriverID. In dbo.DimDriver, DriverID is int.

    You need to design the column and the nightly load to maximize the performance of the load and of the queries.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une table nommée dbo.FactTrips dans un entrepôt Fabric nommé DW_Mobility. Chaque nuit, environ 20 millions de nouveaux trajets doivent être chargés dans dbo.FactTrips depuis une table Delta nommée trips_silver d'un lakehouse du même espace de travail. Dans trips_silver, DriverID est stocké sous forme de chaîne qui contient toujours un nombre entier.

    La plupart des requêtes joignent dbo.FactTrips à une table nommée dbo.DimDriver sur DriverID. Dans dbo.DimDriver, DriverID est de type int.

    Vous devez concevoir la colonne et le chargement nocturne pour optimiser les performances du chargement et des requêtes.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Define DriverID in dbo.FactTrips as varchar(max) to accept any source value.", fr: "Définir DriverID dans dbo.FactTrips en varchar(max) pour accepter toute valeur source." } }
    - { id: b, text: { en: "Define DriverID in dbo.FactTrips as int.", fr: "Définir DriverID dans dbo.FactTrips en int." } }
    - { id: c, text: { en: "Load the rows with one INSERT ... SELECT statement that reads trips_silver.", fr: "Charger les lignes avec une seule instruction INSERT ... SELECT qui lit trips_silver." } }
    - { id: d, text: { en: "Load the rows from a notebook that runs one INSERT ... VALUES statement per trip.", fr: "Charger les lignes depuis un notebook qui exécute une instruction INSERT ... VALUES par trajet." } }
    - { id: e, text: { en: "Run OPTIMIZE on dbo.FactTrips after each nightly load.", fr: "Exécuter OPTIMIZE sur dbo.FactTrips après chaque chargement nocturne." } }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |
      An int column matches the type of dbo.DimDriver.DriverID, so the join needs no conversion, and Microsoft recommends integer types for identifiers. Reading the lakehouse table with INSERT ... SELECT (or CTAS) loads the rows in one set-based operation, which can be more efficient than other methods and avoids many small transactions.
    fr: |
      Une colonne int a le même type que dbo.DimDriver.DriverID : la jointure ne demande aucune conversion, et Microsoft recommande les types entiers pour les identifiants. Lire la table du lakehouse avec INSERT ... SELECT (ou CTAS) charge les lignes en une seule opération ensembliste, ce qui peut être plus efficace que d'autres méthodes et évite de nombreuses petites transactions.
  options:
    a:
      en: |
        varchar(max) is the opposite of the smallest suitable type, and it differs from the int type of the dimension key, which forces conversions in joins.
      fr: |
        varchar(max) est l'inverse du plus petit type adapté, et il diffère du type int de la clé de dimension, ce qui impose des conversions dans les jointures.
    d:
      en: |
        Each singleton INSERT creates a new Parquet file; 20 million row-level transactions make the load slow and fragment the table.
      fr: |
        Chaque INSERT unitaire crée un nouveau fichier Parquet ; 20 millions de transactions ligne par ligne ralentissent le chargement et fragmentent la table.
    e:
      en: |
        Data compaction runs automatically in a warehouse; OPTIMIZE is for lakehouse Delta tables written by Spark.
      fr: |
        Le compactage des données s'exécute automatiquement dans un entrepôt ; OPTIMIZE concerne les tables Delta de lakehouse écrites par Spark.
references:
  - title: Performance guidelines in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
