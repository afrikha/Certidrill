id: dp700-3d-spark-compute-statements
objective: "3.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You manage the Spark settings of a Fabric workspace named WS5. Notebooks in WS5 run on the starter pool, and a Spark job definition runs on a custom pool named Pool5 that has dynamic allocation of executors enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez les paramètres Spark d'un espace de travail Fabric nommé WS5. Les notebooks de WS5 s'exécutent sur le pool de démarrage, et une définition de travail Spark s'exécute sur un pool personnalisé nommé Pool5 dont l'allocation dynamique des exécuteurs est activée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can configure the starter pool of WS5 to use Large nodes.
        fr: Vous pouvez configurer le pool de démarrage de WS5 pour qu'il utilise des nœuds Large.
    - id: s2
      text:
        en: The Spark job definition releases executors of Pool5 when its jobs finish or when it becomes idle.
        fr: La définition de travail Spark libère des exécuteurs de Pool5 quand ses travaux se terminent ou quand elle devient inactive.
    - id: s3
      text:
        en: The time that a notebook session of WS5 spends starting is billed as Spark compute.
        fr: Le temps que met une session de notebook de WS5 à démarrer est facturé comme calcul Spark.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Starter pools only use Medium nodes; other node sizes require a custom pool. With dynamic allocation, the application requests executors when tasks exceed the current capacity and releases them when jobs finish or the application is idle. Fabric bills only the active session time: session startup and idle pool time are not billed."
    fr: "Les pools de démarrage n'utilisent que des nœuds Medium ; les autres tailles de nœuds nécessitent un pool personnalisé. Avec l'allocation dynamique, l'application demande des exécuteurs quand les tâches dépassent la capacité actuelle et les libère quand les travaux se terminent ou que l'application est inactive. Fabric ne facture que le temps de session active : le démarrage de session et le temps d'inactivité du pool ne sont pas facturés."
references:
  - title: Overview of Apache Spark compute in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-compute
