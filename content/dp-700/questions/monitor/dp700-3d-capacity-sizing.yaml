id: dp700-3d-capacity-sizing
objective: "3.3.5"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You plan to run a Spark job definition in a Fabric workspace. The job definition must run on a custom pool named Pool6 that uses Large nodes, and during its peak stage it needs 20 nodes running at the same time. No other Spark workload runs on the capacity during the job.

    You need to assign the workspace to a capacity. The solution must use the smallest SKU that allows the job to reach 20 nodes.

    Which SKU should you use?
  fr: |
    Vous prévoyez d'exécuter une définition de travail Spark dans un espace de travail Fabric. La définition de travail doit s'exécuter sur un pool personnalisé nommé Pool6 qui utilise des nœuds Large, et pendant sa phase de pointe elle a besoin de 20 nœuds en même temps. Aucune autre charge de travail Spark ne s'exécute sur la capacité pendant le travail.

    Vous devez affecter l'espace de travail à une capacité. La solution doit utiliser la plus petite SKU qui permet au travail d'atteindre 20 nœuds.

    Quelle SKU devez-vous utiliser ?
body:
  options:
    - { id: a, text: F16 }
    - { id: b, text: F32 }
    - { id: c, text: F64 }
    - { id: d, text: F128 }
answer: { optionId: c }
explanation:
  correct:
    en: "Each capacity unit provides 2 Spark VCores, and Spark can burst up to three times that amount. A Large node has 16 vCores, so 20 nodes need 320 VCores. An F32 offers 64 VCores, or 192 with bursting (12 Large nodes), while an F64 offers 128 VCores, or 384 with bursting, which allows up to 24 Large nodes."
    fr: "Chaque unité de capacité fournit 2 VCores Spark, et Spark peut utiliser en rafale jusqu'à trois fois cette quantité. Un nœud Large a 16 vCores : 20 nœuds nécessitent 320 VCores. Une F32 offre 64 VCores, soit 192 en rafale (12 nœuds Large), alors qu'une F64 offre 128 VCores, soit 384 en rafale, ce qui permet jusqu'à 24 nœuds Large."
  options:
    a: { en: "An F16 provides 96 VCores with bursting, enough for 6 Large nodes only.", fr: "Une F16 fournit 96 VCores en rafale, de quoi faire tourner 6 nœuds Large seulement." }
    b: { en: "An F32 provides 192 VCores with bursting, enough for 12 Large nodes only.", fr: "Une F32 fournit 192 VCores en rafale, de quoi faire tourner 12 nœuds Large seulement." }
    d: { en: "An F128 works but is larger than needed, because an F64 already allows 24 Large nodes.", fr: "Une F128 convient, mais elle est plus grande que nécessaire, car une F64 permet déjà 24 nœuds Large." }
references:
  - title: Overview of Apache Spark compute in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-compute
