id: dp700-3a-directlake-refresh-tab
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a lakehouse named LH_Gold and a Direct Lake on OneLake semantic model named SM_Gold that uses the Delta tables of LH_Gold. Automatic updates are enabled for SM_Gold.

    Report users say that SM_Gold has not shown new data since yesterday. You suspect that a refresh of SM_Gold failed.

    Where should you look for the refresh failures of SM_Gold?
  fr: |
    Tailspin dispose d'un lakehouse nommé LH_Gold et d'un modèle sémantique Direct Lake sur OneLake nommé SM_Gold qui utilise les tables Delta de LH_Gold. Les mises à jour automatiques sont activées pour SM_Gold.

    Des utilisateurs de rapports signalent que SM_Gold n'affiche plus de nouvelles données depuis hier. Vous soupçonnez l'échec d'une actualisation de SM_Gold.

    Où devez-vous chercher les échecs d'actualisation de SM_Gold ?
body:
  options:
    - { id: a, text: { en: "The queryinsights views of the SQL analytics endpoint of LH_Gold", fr: "Les vues queryinsights du point de terminaison d'analytique SQL de LH_Gold" } }
    - { id: b, text: { en: "The Direct Lake tab of the refresh history of SM_Gold", fr: "L'onglet Direct Lake de l'historique des actualisations de SM_Gold" } }
    - { id: c, text: { en: "The runs of LH_Gold in the Job runs page of the Monitor hub", fr: "Les exécutions de LH_Gold dans la page Job runs du hub de surveillance" } }
    - { id: d, text: { en: "The Diagnostics tab of the last Spark application that wrote to LH_Gold", fr: "L'onglet Diagnostics de la dernière application Spark qui a écrit dans LH_Gold" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Direct Lake refresh is framing: it reads the Delta table metadata and points the model to the latest files. Refresh failures of Direct Lake models appear in the Direct Lake tab of the refresh history in the Fabric portal. After a non-recoverable refresh error, Power BI also suspends automatic updates until an on-demand refresh succeeds.
    fr: |
      Une actualisation Direct Lake est un tramage (framing) : elle lit les métadonnées des tables Delta et pointe le modèle vers les fichiers les plus récents. Les échecs d'actualisation des modèles Direct Lake apparaissent dans l'onglet Direct Lake de l'historique des actualisations du portail Fabric. Après une erreur d'actualisation non récupérable, Power BI suspend aussi les mises à jour automatiques jusqu'à ce qu'une actualisation à la demande réussisse.
  options:
    a:
      en: |
        Query insights records T-SQL queries on the endpoint; a Direct Lake on OneLake model reads the Delta tables directly, and framing isn't a T-SQL query.
      fr: |
        Query insights enregistre les requêtes T-SQL sur le point de terminaison ; un modèle Direct Lake sur OneLake lit directement les tables Delta, et le tramage n'est pas une requête T-SQL.
    c:
      en: |
        The runs of a lakehouse are its own jobs, such as table maintenance and table loads; the refresh of SM_Gold is a job of the semantic model, not of LH_Gold.
      fr: |
        Les exécutions d'un lakehouse sont ses propres tâches, comme la maintenance et le chargement de tables ; l'actualisation de SM_Gold est une tâche du modèle sémantique, pas de LH_Gold.
    d:
      en: |
        The Spark application shows the job that wrote the data, not the refresh of the semantic model.
      fr: |
        L'application Spark montre la tâche qui a écrit les données, pas l'actualisation du modèle sémantique.
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
