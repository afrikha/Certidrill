id: dp700-3b-pipeline-skip-path
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Sales. PL_Sales contains the following activities:

    - A Copy data activity named Copy Sales
    - A Notebook activity named Transform Sales, connected to Copy Sales by an Upon Success dependency
    - A Script activity named Log Failure, connected to Copy Sales by an Upon Failure dependency. Log Failure writes a row to an error table.

    Last night, Copy Sales failed, Log Failure succeeded, and the pipeline run was reported as Failed.

    You need to ensure that when Copy Sales fails and Log Failure succeeds, the pipeline run is reported as Succeeded. When Copy Sales succeeds, Transform Sales must still run. The existing activities and dependencies must be kept.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Sales. PL_Sales contient les activités suivantes :

    - Une activité Copy data nommée Copy Sales
    - Une activité Notebook nommée Transform Sales, reliée à Copy Sales par une dépendance Upon Success
    - Une activité Script nommée Log Failure, reliée à Copy Sales par une dépendance Upon Failure. Log Failure écrit une ligne dans une table d'erreurs.

    La nuit dernière, Copy Sales a échoué, Log Failure a réussi et l'exécution du pipeline a été signalée comme Failed.

    Vous devez faire en sorte que, lorsque Copy Sales échoue et que Log Failure réussit, l'exécution du pipeline soit signalée comme Succeeded. Lorsque Copy Sales réussit, Transform Sales doit toujours s'exécuter. Les activités et dépendances existantes doivent être conservées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the dependency between Copy Sales and Transform Sales to Upon Completion", fr: "Remplacer la dépendance entre Copy Sales et Transform Sales par Upon Completion" } }
    - { id: b, text: { en: "Add a Fail activity, and connect Log Failure to it by using an Upon Success dependency", fr: "Ajouter une activité Fail et y relier Log Failure par une dépendance Upon Success" } }
    - { id: c, text: { en: "Add a Wait activity, and connect Transform Sales to it by using an Upon Skip dependency", fr: "Ajouter une activité Wait et y relier Transform Sales par une dépendance Upon Skip" } }
    - { id: d, text: { en: "Add an Upon Completion dependency from Copy Sales to Log Failure", fr: "Ajouter une dépendance Upon Completion de Copy Sales vers Log Failure" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The pipeline status is computed from the leaf activities, and a skipped leaf is replaced by its parent. Today, when Copy Sales fails, the leaf Transform Sales is skipped, so its failed parent Copy Sales makes the run fail (Do-If-Else pattern). With a Wait activity on the Upon Skip path of Transform Sales (Do-If-Skip-Else), that Wait runs and succeeds when Copy Sales fails, so every evaluated leaf succeeds; when Copy Sales succeeds, the Wait is skipped and Transform Sales is evaluated instead.
    fr: |
      Le statut du pipeline est calculé à partir des activités feuilles, et une feuille ignorée est remplacée par son parent. Aujourd'hui, quand Copy Sales échoue, la feuille Transform Sales est ignorée : son parent Copy Sales, en échec, fait échouer l'exécution (modèle Do-If-Else). Avec une activité Wait sur le chemin Upon Skip de Transform Sales (Do-If-Skip-Else), ce Wait s'exécute et réussit quand Copy Sales échoue, si bien que toutes les feuilles évaluées réussissent ; quand Copy Sales réussit, le Wait est ignoré et c'est Transform Sales qui est évalué.
  options:
    a: { en: "Transform Sales would also run after a failed copy, on incomplete data, which the requirement doesn't allow.", fr: "Transform Sales s'exécuterait aussi après un échec de la copie, sur des données incomplètes, ce que l'exigence n'autorise pas." }
    b: { en: "A Fail activity makes the pipeline run fail on purpose, the opposite of the requirement.", fr: "Une activité Fail fait échouer volontairement l'exécution du pipeline, à l'inverse de l'exigence." }
    d: { en: "Upon Completion can't coexist with Upon Success or Upon Failure from the same activity, and Log Failure would also run after a successful copy.", fr: "Upon Completion ne peut pas coexister avec Upon Success ou Upon Failure depuis la même activité, et Log Failure s'exécuterait aussi après une copie réussie." }
references:
  - title: Pipeline failure and error message
    url: https://learn.microsoft.com/en-us/azure/data-factory/tutorial-pipeline-failure-error-handling
  - title: Activity overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview
