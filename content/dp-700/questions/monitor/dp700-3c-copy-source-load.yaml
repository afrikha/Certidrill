id: dp700-3c-copy-source-load
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric pipeline that copies a table named dbo.Telemetry from an Azure SQL database to a Fabric lakehouse every night. The Copy activity uses the Dynamic range partition option with predefined bounds and the default settings for everything else.

    During the copy, the source database reaches 100 percent CPU, and the output of the activity shows more than 200 parallel copies. Applications that use the database report suspended queries.

    You need to reduce the load on the source database during the copy. The copy must keep reading the table in parallel partitions.

    What should you do?
  fr: |
    Vous disposez d'un pipeline Fabric qui copie chaque nuit une table nommée dbo.Telemetry d'une base de données Azure SQL vers un lakehouse Fabric. L'activité Copy utilise l'option de partition Dynamic range avec des bornes prédéfinies et les paramètres par défaut pour tout le reste.

    Pendant la copie, la base de données source atteint 100 % du processeur, et la sortie de l'activité indique plus de 200 copies parallèles. Les applications qui utilisent la base de données signalent des requêtes suspendues.

    Vous devez réduire la charge sur la base de données source pendant la copie. La copie doit continuer à lire la table par partitions parallèles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set Degree of copy parallelism to 50.", fr: "Définir Degree of copy parallelism sur 50." } }
    - { id: b, text: { en: "Set Intelligent throughput optimization to Standard.", fr: "Définir Intelligent throughput optimization sur Standard." } }
    - { id: c, text: { en: "Set the Isolation level of the source to Read committed.", fr: "Définir l'Isolation level de la source sur Read committed." } }
    - { id: d, text: { en: "Set the partition option to None.", fr: "Définir l'option de partition sur None." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each parallel copy opens a session on the source database, and the default Auto value of Degree of copy parallelism can generate hundreds of them. Setting an explicit value such as 50 caps the concurrent sessions; in Microsoft's tests on a heap table, it kept the copy fast while using far fewer capacity units and source resources than Auto.
    fr: |
      Chaque copie parallèle ouvre une session sur la base de données source, et la valeur par défaut Auto de Degree of copy parallelism peut en générer des centaines. Définir une valeur explicite comme 50 plafonne les sessions simultanées ; dans les tests de Microsoft sur une table de tas, la copie restait rapide tout en consommant beaucoup moins d'unités de capacité et de ressources de la source qu'avec Auto.
  options:
    b:
      en: |
        ITO limits the compute that Fabric allocates to the copy. It does not cap the number of sessions opened on the source.
      fr: |
        ITO limite la puissance de calcul que Fabric alloue à la copie. Il ne plafonne pas le nombre de sessions ouvertes sur la source.
    c:
      en: |
        Microsoft recommends leaving the isolation level at None when parallelism is Auto; a specified level with Auto can overtax the source further.
      fr: |
        Microsoft recommande de laisser le niveau d'isolation sur None quand le parallélisme est Auto ; un niveau spécifié avec Auto peut surcharger encore plus la source.
    d:
      en: |
        None uses a single copy without partitioning, which breaks the requirement to keep reading in parallel partitions.
      fr: |
        None utilise une copie unique sans partitionnement, ce qui ne respecte pas l'exigence de lecture par partitions parallèles.
references:
  - title: Copy activity performance with SQL databases
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-performance-sql-databases
