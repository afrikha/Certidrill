id: dp700-cs2a-capacity-430
objective: "3.2.3"
type: single
caseStudy: dp700-cs2a-blue-yonder
difficulty: 2
status: draft
stem:
  en: You need to meet the requirement for the reprocessing runs of NB-FleetStats. What should you do?
  fr: Vous devez satisfaire l'exigence relative aux exécutions de retraitement de NB-FleetStats. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Turn on high concurrency for notebooks in BYA-Fleet, so that the reprocessing runs share an existing Spark session", fr: "Activer le mode haute concurrence pour les notebooks dans BYA-Fleet, afin que les exécutions de retraitement partagent une session Spark existante" } }
    - { id: b, text: { en: "Ask the capacity administrator to turn on Disable job-level bursting, so that each job uses fewer Spark cores", fr: "Demander à l'administrateur de la capacité d'activer Disable job-level bursting, afin que chaque tâche utilise moins de cœurs Spark" } }
    - { id: c, text: { en: "Start the reprocessing runs from a pipeline that contains a Notebook activity for NB-FleetStats, instead of running the notebook interactively", fr: "Lancer les exécutions de retraitement depuis un pipeline qui contient une activité Notebook pour NB-FleetStats, au lieu d'exécuter le notebook de manière interactive" } }
    - { id: d, text: { en: "Increase the Spark session timeout of BYA-Fleet, so that the interactive session waits until cores are available", fr: "Augmenter le délai d'expiration de session Spark de BYA-Fleet, afin que la session interactive attende que des cœurs soient disponibles" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Error 430 means that the Spark cores of the capacity are all in use. Interactive notebook runs are rejected with this error, whereas jobs started from pipelines, the scheduler or Spark job definitions are queued and start automatically when cores become free (the queue entries expire after 24 hours). Running NB-FleetStats from a pipeline therefore meets the requirement without scaling up the capacity.
    fr: |
      L'erreur 430 signifie que tous les cœurs Spark de la capacité sont utilisés. Les exécutions interactives de notebooks sont rejetées avec cette erreur, alors que les tâches lancées depuis des pipelines, le planificateur ou des définitions de tâche Spark sont mises en file d'attente et démarrent automatiquement dès que des cœurs se libèrent (les entrées de la file expirent au bout de 24 heures). Exécuter NB-FleetStats depuis un pipeline satisfait donc l'exigence sans augmenter la capacité.
  options:
    a: { en: "High concurrency lets compatible notebooks of one user share a running session; it does not queue a job when the capacity has no free cores.", fr: "Le mode haute concurrence permet à des notebooks compatibles d'un même utilisateur de partager une session en cours ; il ne met pas une tâche en file d'attente quand la capacité n'a plus de cœurs libres." }
    b: { en: "Disabling job-level bursting caps the cores of each job; interactive runs are still rejected when all the cores are used, and nothing starts them later.", fr: "La désactivation du bursting au niveau des tâches limite les cœurs de chaque tâche ; les exécutions interactives sont toujours rejetées quand tous les cœurs sont utilisés, et rien ne les relance ensuite." }
    d: { en: "The session timeout controls when an idle interactive session expires; it does not make a rejected job wait in a queue.", fr: "Le délai d'expiration de session détermine quand une session interactive inactive expire ; il ne fait pas attendre une tâche rejetée dans une file." }
references:
  - title: Concurrency limits and queueing in Apache Spark for Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-job-concurrency-and-queueing
