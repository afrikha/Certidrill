id: dp700-3c-warehouse-statements
objective: "3.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named WH_Gold that uses the default settings. Pipelines load WH_Gold every hour, and Direct Lake semantic models read its tables. Queries on WH_Gold often filter on CustomerID and OrderDate together.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé WH_Gold qui utilise les paramètres par défaut. Des pipelines chargent WH_Gold toutes les heures, et des modèles sémantiques Direct Lake lisent ses tables. Les requêtes sur WH_Gold filtrent souvent sur CustomerID et OrderDate ensemble.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You must schedule a job that compacts the small Parquet files created by the hourly loads of WH_Gold.
        fr: Vous devez planifier un travail qui compacte les petits fichiers Parquet créés par les chargements horaires de WH_Gold.
    - id: s2
      text:
        en: You can run CREATE STATISTICS to create one statistics object on the CustomerID and OrderDate columns together.
        fr: Vous pouvez exécuter CREATE STATISTICS pour créer un seul objet de statistiques sur les colonnes CustomerID et OrderDate ensemble.
    - id: s3
      text:
        en: The tables of WH_Gold are written with V-Order.
        fr: Les tables de WH_Gold sont écrites avec V-Order.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Data compaction runs automatically in the background of a warehouse and merges small Parquet files; you do not schedule OPTIMIZE as you would for a lakehouse. Manual statistics support only single-column histograms, and multi-column statistics are not supported. V-Order is enabled by default in a warehouse, which benefits Direct Lake reads.
    fr: |
      Le compactage des données s'exécute automatiquement en arrière-plan d'un entrepôt et fusionne les petits fichiers Parquet ; vous ne planifiez pas d'OPTIMIZE comme pour un lakehouse. Les statistiques manuelles ne prennent en charge que les histogrammes sur une seule colonne, et les statistiques multicolonnes ne sont pas prises en charge. V-Order est activé par défaut dans un entrepôt, ce qui profite aux lectures Direct Lake.
references:
  - title: Performance guidelines in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
  - title: Statistics
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/statistics
