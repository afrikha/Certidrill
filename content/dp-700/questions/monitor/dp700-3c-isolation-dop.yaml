id: dp700-3c-isolation-dop
objective: "3.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric pipeline that copies a heap table named dbo.Payments from an Azure SQL database to a Fabric warehouse. The Copy activity has the following settings:

    - Partition option: Dynamic range on PaymentID, with predefined bounds
    - Degree of copy parallelism: Auto
    - Isolation level: Read committed
    - Staging: enabled

    The copy fails intermittently because the source database is overloaded. The isolation level is not required for the correctness of the data.

    You need to make the copy reliable. The copy must keep using the Dynamic range partition option.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline Fabric qui copie une table de tas nommée dbo.Payments d'une base de données Azure SQL vers un entrepôt Fabric. L'activité Copy a les paramètres suivants :

    - Partition option : Dynamic range sur PaymentID, avec des bornes prédéfinies
    - Degree of copy parallelism : Auto
    - Isolation level : Read committed
    - Staging : activé

    La copie échoue par intermittence parce que la base de données source est surchargée. Le niveau d'isolation n'est pas nécessaire à l'exactitude des données.

    Vous devez rendre la copie fiable. La copie doit continuer à utiliser l'option de partition Dynamic range.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set Intelligent throughput optimization to Maximum.", fr: "Définir Intelligent throughput optimization sur Maximum." } }
    - { id: b, text: { en: "Set Isolation level to None.", fr: "Définir Isolation level sur None." } }
    - { id: c, text: { en: "Clear Enable staging.", fr: "Désélectionner Enable staging." } }
    - { id: d, text: { en: "Set Degree of copy parallelism to 50.", fr: "Définir Degree of copy parallelism sur 50." } }
    - { id: e, text: { en: "Remove the bounds so that the service calculates them at run time.", fr: "Supprimer les bornes pour que le service les calcule à l'exécution." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Microsoft recommends leaving the isolation level at None when Degree of copy parallelism is Auto, because a specified isolation level combined with Auto can overtax the source and make the copy fail. Alternatively, an explicit Degree of copy parallelism such as 50 caps the number of sessions on the source; in Microsoft's tests, Dynamic range with 50 parallel copies completed with each isolation level.
    fr: |
      Microsoft recommande de laisser le niveau d'isolation sur None quand Degree of copy parallelism est Auto, car un niveau d'isolation spécifié combiné à Auto peut surcharger la source et faire échouer la copie. Autre solution, un Degree of copy parallelism explicite comme 50 plafonne le nombre de sessions sur la source ; dans les tests de Microsoft, Dynamic range avec 50 copies parallèles s'est terminé avec chaque niveau d'isolation.
  options:
    a:
      en: |
        More compute on the Fabric side does not reduce the sessions opened on the source; it can add pressure on it.
      fr: |
        Plus de puissance de calcul côté Fabric ne réduit pas les sessions ouvertes sur la source ; elle peut même accentuer la pression.
    c:
      en: |
        Staging is required when the destination is a Fabric warehouse, and it has no effect on the source load.
      fr: |
        La zone de transit est obligatoire quand la destination est un entrepôt Fabric, et elle n'a aucun effet sur la charge de la source.
    e:
      en: |
        Without bounds, the service queries the source to find them, which adds load and time.
      fr: |
        Sans bornes, le service interroge la source pour les trouver, ce qui ajoute de la charge et du temps.
references:
  - title: Copy activity performance with SQL databases
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-performance-sql-databases
