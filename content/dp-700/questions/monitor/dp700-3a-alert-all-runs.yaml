id: dp700-3a-alert-all-runs
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a workspace named WS-Ingest that contains 12 pipelines. The pipelines run on schedules, and analysts also start them manually during the day. Workspace monitoring is enabled for WS-Ingest.

    You need the operations team to be notified by email when any run of the pipelines fails and when a run of PL_Master succeeds. The solution must not require any change to the pipelines.

    What should you use?
  fr: |
    Fabrikam dispose d'un espace de travail nommé WS-Ingest qui contient 12 pipelines. Les pipelines s'exécutent selon des planifications, et des analystes les démarrent aussi manuellement pendant la journée. La supervision de l'espace de travail est activée pour WS-Ingest.

    Vous devez faire en sorte que l'équipe d'exploitation soit prévenue par e-mail quand une exécution quelconque des pipelines échoue et quand une exécution de PL_Master réussit. La solution ne doit demander aucune modification des pipelines.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Schedule failure emails configured for each of the 12 pipelines", fr: "Des e-mails d'échec de planification configurés pour chacun des 12 pipelines" } }
    - { id: b, text: { en: "Activator-based alert rules created from the Job runs page of the Monitor hub", fr: "Des règles d'alerte basées sur Activator créées depuis la page Job runs du hub de surveillance" } }
    - { id: c, text: { en: "Teams activities on the success and failure paths of the activities of each pipeline", fr: "Des activités Teams sur les chemins de réussite et d'échec des activités de chaque pipeline" } }
    - { id: d, text: { en: "The refresh failure notification contacts of the workspace semantic models", fr: "Les contacts de notification d'échec d'actualisation des modèles sémantiques de l'espace de travail" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Activator-based alert rules, created from Job runs > Create and manage alerts > Alerts (paid), react to job events such as Started and Succeeded, not only to failures of scheduled runs, and they support pipelines. They require workspace monitoring, which is already enabled, and don't change the pipelines.
    fr: |
      Les règles d'alerte basées sur Activator, créées depuis Job runs > Create and manage alerts > Alerts (paid), réagissent à des événements de tâche comme Started et Succeeded, pas seulement aux échecs d'exécutions planifiées, et elles prennent en charge les pipelines. Elles demandent la supervision de l'espace de travail, déjà activée, et ne modifient pas les pipelines.
  options:
    a:
      en: |
        Schedule failure emails cover only failures of scheduled runs: they miss manual runs and can't report a success.
      fr: |
        Les e-mails d'échec de planification ne couvrent que les échecs d'exécutions planifiées : ils ignorent les exécutions manuelles et ne peuvent pas signaler une réussite.
    c:
      en: |
        Teams activities require editing every pipeline, which the requirement forbids, and they post to Teams rather than email.
      fr: |
        Les activités Teams demandent de modifier chaque pipeline, ce que l'exigence interdit, et elles publient dans Teams plutôt que par e-mail.
    d:
      en: |
        Refresh failure notifications concern scheduled refreshes of semantic models, not pipeline runs.
      fr: |
        Les notifications d'échec d'actualisation concernent les actualisations planifiées des modèles sémantiques, pas les exécutions de pipelines.
references:
  - title: Set up job alerts in the Monitor hub (preview)
    url: https://learn.microsoft.com/en-us/fabric/admin/monitoring-hub-alerts
