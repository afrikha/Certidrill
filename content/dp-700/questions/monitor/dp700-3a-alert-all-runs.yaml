id: dp700-3a-alert-all-runs
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a workspace named WS-Ingest that contains 12 pipelines. The pipelines run on schedules, and analysts also start them manually during the day.

    You need the operations team to be notified by email when any run of the pipelines fails and when a run of PL_Master succeeds. The solution must not require any change to the pipelines.

    What should you use?
  fr: |
    Fabrikam dispose d'un espace de travail nommé WS-Ingest qui contient 12 pipelines. Les pipelines s'exécutent selon des planifications, et des analystes les démarrent aussi manuellement pendant la journée.

    Vous devez faire en sorte que l'équipe d'exploitation soit prévenue par e-mail quand une exécution quelconque des pipelines échoue et quand une exécution de PL_Master réussit. La solution ne doit demander aucune modification des pipelines.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Failure notifications configured in the schedule of each of the 12 pipelines", fr: "Des notifications d'échec configurées dans la planification de chacun des 12 pipelines" } }
    - { id: b, text: { en: "Activator alert rules on the Job events of the pipelines in Real-Time hub", fr: "Des règles d'alerte Activator sur les événements de tâche (Job events) des pipelines dans Real-Time hub" } }
    - { id: c, text: { en: "Teams activities on the success and failure paths of the activities of each pipeline", fr: "Des activités Teams sur les chemins de réussite et d'échec des activités de chaque pipeline" } }
    - { id: d, text: { en: "The refresh failure notification contacts of the workspace semantic models", fr: "Les contacts de notification d'échec d'actualisation des modèles sémantiques de l'espace de travail" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Job events in Real-Time hub are raised for every run of an item, whether it is scheduled or started manually: ItemJobFailed when a run fails and ItemJobSucceeded when it completes successfully. An Activator alert rule on these events can send an email, and it doesn't change the pipelines.
    fr: |
      Les événements de tâche (Job events) de Real-Time hub sont émis pour chaque exécution d'un élément, qu'elle soit planifiée ou démarrée manuellement : ItemJobFailed quand une exécution échoue et ItemJobSucceeded quand elle se termine avec succès. Une règle d'alerte Activator sur ces événements peut envoyer un e-mail, et elle ne modifie pas les pipelines.
  options:
    a:
      en: |
        Failure notifications cover only failures of scheduled runs: they miss manual runs and can't report a success.
      fr: |
        Les notifications d'échec ne couvrent que les échecs d'exécutions planifiées : elles ignorent les exécutions manuelles et ne peuvent pas signaler une réussite.
    c:
      en: |
        Teams activities require editing every pipeline, which the requirement forbids, and they post to Teams rather than email.
      fr: |
        Les activités Teams demandent de modifier chaque pipeline, ce que l'exigence interdit, et elles publient dans Teams plutôt que par e-mail.
    d:
      en: |
        Refresh failure notifications concern scheduled refreshes of semantic models, not pipeline runs.
      fr: |
        Les notifications d'échec d'actualisation concernent les actualisations planifiées des modèles sémantiques, pas les exécutions de pipelines.
references:
  - title: Explore Job events in Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/explore-fabric-job-events
  - title: Set alerts on Job events in Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/set-alerts-fabric-job-events
