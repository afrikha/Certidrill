id: dp700-3a-activator-actions
objective: "3.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin uses Fabric Activator to monitor an eventstream of baggage scanner events. When a scanner reports repeated errors, an Activator rule must start a Fabric item that reroutes the affected bags, without any custom code to call the item.

    Which two types of Fabric items can the rule run directly as an action?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin utilise Fabric Activator pour surveiller un flux d'événements de scanners de bagages. Quand un scanner signale des erreurs répétées, une règle Activator doit démarrer un élément Fabric qui réachemine les bagages concernés, sans code personnalisé pour appeler l'élément.

    Quels sont les deux types d'éléments Fabric que la règle peut exécuter directement comme action ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Real-Time Dashboard", fr: "Un tableau de bord en temps réel (Real-Time Dashboard)" } }
    - { id: b, text: { en: "A pipeline", fr: "Un pipeline" } }
    - { id: c, text: { en: "A KQL queryset", fr: "Un ensemble de requêtes KQL" } }
    - { id: d, text: { en: "A warehouse", fr: "Un entrepôt" } }
    - { id: e, text: { en: "A notebook", fr: "Un notebook" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      Besides email, Teams messages and Power Automate flows, an Activator rule can run Fabric items: pipelines, notebooks, Spark job definitions, dataflows, copy jobs and user data functions. The rule triggers the item and keeps monitoring without waiting for the item to finish.
    fr: |
      En plus des e-mails, des messages Teams et des flux Power Automate, une règle Activator peut exécuter des éléments Fabric : pipelines, notebooks, définitions de tâche Spark, dataflows, tâches de copie et fonctions de données utilisateur. La règle déclenche l'élément et continue la surveillance sans attendre la fin de l'élément.
  options:
    a:
      en: |
        A Real-Time Dashboard is a source that Activator can monitor, not an item that a rule runs.
      fr: |
        Un tableau de bord en temps réel est une source qu'Activator peut surveiller, pas un élément qu'une règle exécute.
    c:
      en: |
        A KQL queryset stores queries; it isn't among the items an Activator action can run.
      fr: |
        Un ensemble de requêtes KQL stocke des requêtes ; il ne fait pas partie des éléments qu'une action Activator peut exécuter.
    d:
      en: |
        A warehouse isn't an item that an Activator action can run; to run T-SQL, the rule could start a pipeline that calls a stored procedure.
      fr: |
        Un entrepôt n'est pas un élément qu'une action Activator peut exécuter ; pour exécuter du T-SQL, la règle pourrait démarrer un pipeline qui appelle une procédure stockée.
references:
  - title: What is Fabric Activator?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-introduction
