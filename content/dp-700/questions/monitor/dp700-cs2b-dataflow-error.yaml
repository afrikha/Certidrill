id: dp700-cs2b-dataflow-error
objective: "3.2.2"
type: single
caseStudy: dp700-cs2b-munsons
difficulty: 2
status: draft
stem:
  en: You need to meet the requirement for DF_Prices. What should you do first?
  fr: Vous devez satisfaire l'exigence relative à DF_Prices. Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable staging for the queries of DF_Prices", fr: "Activer le staging (Enable staging) pour les requêtes de DF_Prices" } }
    - { id: b, text: { en: "Change the update method of the WH_Sales data destination from Replace to Append", fr: "Remplacer la méthode de mise à jour de la destination de données WH_Sales, Replace, par Append" } }
    - { id: c, text: { en: "Grant sp-dataflows the Contributor role in MP-Analytics", fr: "Attribuer le rôle Contributor dans MP-Analytics à sp-dataflows" } }
    - { id: d, text: { en: "Update the credentials of the connection that DF_Prices uses for WH_Sales with the new client secret", fr: "Mettre à jour les informations d'identification de la connexion utilisée par DF_Prices pour WH_Sales avec le nouveau secret client" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      DestinationQueryChallenge is the validation error raised when the dataflow cannot authenticate or is not authorized on its data destination. It is checked at the start of each refresh, so every refresh fails. The old secret of sp-dataflows was deleted, so the connection to WH_Sales must be reauthenticated with the new secret before the next refresh.
    fr: |
      DestinationQueryChallenge est l'erreur de validation renvoyée quand le dataflow ne peut pas s'authentifier ou n'est pas autorisé sur sa destination de données. Elle est vérifiée au début de chaque actualisation : chaque actualisation échoue donc. L'ancien secret de sp-dataflows a été supprimé : la connexion à WH_Sales doit être réauthentifiée avec le nouveau secret avant la prochaine actualisation.
  options:
    a: { en: "Staging changes where the queries are evaluated before loading; it does not fix the authentication to the destination.", fr: "Le staging change l'endroit où les requêtes sont évaluées avant le chargement ; elle ne corrige pas l'authentification auprès de la destination." }
    b: { en: "The update method decides whether rows are replaced or appended; the refresh fails before any row is written.", fr: "La méthode de mise à jour détermine si les lignes sont remplacées ou ajoutées ; l'actualisation échoue avant l'écriture de la moindre ligne." }
    c: { en: "The dataflow ran successfully with the same permissions until the secret changed; a role does not replace a valid credential.", fr: "Le dataflow s'exécutait correctement avec les mêmes autorisations jusqu'au changement de secret ; un rôle ne remplace pas des informations d'identification valides." }
references:
  - title: Dataflow Gen2 data destinations validation rules
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-validation-rules
  - title: View refresh history and monitor your dataflows
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor
