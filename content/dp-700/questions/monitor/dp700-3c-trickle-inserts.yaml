id: dp700-3c-trickle-inserts
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW_Web. An application writes each page view to a table named dbo.PageViews by running one INSERT ... VALUES statement per row, about 50 times per second.

    Queries on dbo.PageViews have become slower over time, and the table is fragmented into many small files.

    You need to change the ingestion so that it no longer degrades query performance. Data can be up to 15 minutes late.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW_Web. Une application écrit chaque page vue dans une table nommée dbo.PageViews en exécutant une instruction INSERT ... VALUES par ligne, environ 50 fois par seconde.

    Les requêtes sur dbo.PageViews sont devenues plus lentes avec le temps, et la table est fragmentée en de nombreux petits fichiers.

    Vous devez modifier l'ingestion pour qu'elle ne dégrade plus les performances des requêtes. Les données peuvent arriver jusqu'à 15 minutes en retard.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Schedule OPTIMIZE dbo.PageViews to run every 15 minutes in DW_Web.", fr: "Planifier OPTIMIZE dbo.PageViews toutes les 15 minutes dans DW_Web." } }
    - { id: b, text: { en: "Run CREATE STATISTICS on the columns of dbo.PageViews after each INSERT statement.", fr: "Exécuter CREATE STATISTICS sur les colonnes de dbo.PageViews après chaque instruction INSERT." } }
    - { id: c, text: { en: "Wrap each INSERT statement in an explicit BEGIN TRAN ... COMMIT TRAN transaction.", fr: "Encadrer chaque instruction INSERT dans une transaction explicite BEGIN TRAN ... COMMIT TRAN." } }
    - { id: d, text: { en: "Write the rows to files and load them every 15 minutes with one COPY INTO statement.", fr: "Écrire les lignes dans des fichiers et les charger toutes les 15 minutes avec une seule instruction COPY INTO." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Each singleton INSERT, UPDATE or DELETE creates a new Parquet file, so trickle inserts fragment the table. Microsoft recommends batching the writes and using COPY INTO for bulk loads, which writes far fewer, larger files; the 15-minute latency allows a batch per interval.
    fr: |
      Chaque INSERT, UPDATE ou DELETE ligne à ligne crée un nouveau fichier Parquet : les insertions au compte-gouttes fragmentent la table. Microsoft recommande de regrouper les écritures en lots et d'utiliser COPY INTO pour les chargements en bloc, qui écrit beaucoup moins de fichiers, plus grands ; la latence de 15 minutes permet un lot par intervalle.
  options:
    a:
      en: |
        OPTIMIZE is a Spark command for lakehouse Delta tables; the warehouse compacts files automatically in the background, and the cause of the fragmentation remains.
      fr: |
        OPTIMIZE est une commande Spark pour les tables Delta de lakehouse ; l'entrepôt compacte les fichiers automatiquement en arrière-plan, et la cause de la fragmentation demeure.
    c:
      en: |
        An explicit transaction around a single INSERT still writes one small file per statement.
      fr: |
        Une transaction explicite autour d'un seul INSERT écrit toujours un petit fichier par instruction.
    b:
      en: |
        Statistics help the optimizer choose plans; they do not reduce the number of files, and creating them after every row adds more work.
      fr: |
        Les statistiques aident l'optimiseur à choisir les plans ; elles ne réduisent pas le nombre de fichiers, et les créer après chaque ligne ajoute du travail.
references:
  - title: Performance guidelines in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
