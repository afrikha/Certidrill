id: dp700-3a-upstream-run
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a notebook named NB_Stage. NB_Stage is run by several pipelines and also on demand by data engineers. You use the Monitoring hub to browse the runs of NB_Stage.

    For each run of NB_Stage, you need to identify the pipeline run that started it.

    What should you do in the Monitoring hub?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un notebook nommé NB_Stage. NB_Stage est exécuté par plusieurs pipelines, ainsi qu'à la demande par des ingénieurs données. Vous utilisez le hub de surveillance (Monitoring hub) pour parcourir les exécutions de NB_Stage.

    Pour chaque exécution de NB_Stage, vous devez identifier l'exécution de pipeline qui l'a démarrée.

    Que devez-vous faire dans le hub de surveillance ?
body:
  options:
    - { id: a, text: { en: "Filter the list on the Submitter of each run", fr: "Filtrer la liste sur l'auteur (Submitter) de chaque exécution" } }
    - { id: b, text: { en: "In Column Options, turn on the Upstream run column", fr: "Dans Column Options, activer la colonne Upstream run" } }
    - { id: c, text: { en: "In Column Options, turn on the Downstream runs column", fr: "Dans Column Options, activer la colonne Downstream runs" } }
    - { id: d, text: { en: "Filter the list on the Location of each run", fr: "Filtrer la liste sur l'emplacement (Location) de chaque exécution" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Upstream run column shows the job that invoked a run, so a notebook run started by a pipeline shows that pipeline run. This job hierarchy is different from the parent-child relationship of items shown in the workspace view.
    fr: |
      La colonne Upstream run indique la tâche qui a déclenché une exécution : une exécution de notebook démarrée par un pipeline affiche cette exécution de pipeline. Cette hiérarchie de tâches est différente de la relation parent-enfant des éléments affichée dans la vue de l'espace de travail.
  options:
    a:
      en: |
        The submitter is the user or identity that ran the job; it doesn't identify the pipeline run that called the notebook.
      fr: |
        L'auteur est l'utilisateur ou l'identité qui a exécuté la tâche ; il n'identifie pas l'exécution de pipeline qui a appelé le notebook.
    c:
      en: |
        Downstream runs shows the jobs that a run started, which is the opposite direction: it would be useful on the pipeline run, not on the notebook run.
      fr: |
        Downstream runs montre les tâches qu'une exécution a démarrées, c'est-à-dire le sens inverse : cette colonne est utile sur l'exécution du pipeline, pas sur celle du notebook.
    d:
      en: |
        Location is the workspace of the item; every run of NB_Stage has the same location.
      fr: |
        Location est l'espace de travail de l'élément ; toutes les exécutions de NB_Stage ont le même emplacement.
references:
  - title: How to monitor pipeline runs in Monitoring hub
    url: https://learn.microsoft.com/en-us/fabric/data-factory/monitoring-hub-pipeline-runs
