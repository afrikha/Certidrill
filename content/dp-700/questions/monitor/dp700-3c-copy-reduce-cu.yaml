id: dp700-3c-copy-reduce-cu
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric pipeline that runs a Copy activity every night to load files from Azure Blob Storage into a lakehouse. The Copy activity uses the default settings and finishes in 40 minutes. The load window allows up to two hours.

    The capacity administrator asks you to reduce the capacity units that the Copy activity consumes. A longer copy duration is acceptable.

    Which setting should you change?
  fr: |
    Vous disposez d'un pipeline Fabric qui exécute chaque nuit une activité Copy pour charger des fichiers depuis Stockage Blob Azure vers un lakehouse. L'activité Copy utilise les paramètres par défaut et se termine en 40 minutes. La fenêtre de chargement autorise jusqu'à deux heures.

    L'administrateur de la capacité vous demande de réduire les unités de capacité consommées par l'activité Copy. Une durée de copie plus longue est acceptable.

    Quel paramètre devez-vous modifier ?
body:
  options:
    - { id: a, text: { en: "Set Intelligent throughput optimization to a lower custom value.", fr: "Définir Intelligent throughput optimization sur une valeur personnalisée plus basse." } }
    - { id: b, text: { en: "Select Enable staging with workspace staging storage.", fr: "Sélectionner Enable staging avec le stockage intermédiaire de l'espace de travail." } }
    - { id: c, text: { en: "Select Data consistency verification.", fr: "Sélectionner Data consistency verification." } }
    - { id: d, text: { en: "Select Enable logging for the copied and skipped files.", fr: "Sélectionner Enable logging pour les fichiers copiés et ignorés." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Intelligent throughput optimization sets the maximum CPU, memory and network resources that the copy can use, and the default Auto lets the service choose. A lower custom value, from 4 to 256, lengthens the copy but reduces the capacity units consumed; in Microsoft's test, a lower ITO increased the duration by about a third and cut the capacity units by almost half.
    fr: |
      Intelligent throughput optimization fixe le maximum de ressources processeur, mémoire et réseau que la copie peut utiliser, et la valeur par défaut Auto laisse le service choisir. Une valeur personnalisée plus basse, de 4 à 256, allonge la copie mais réduit les unités de capacité consommées ; dans le test de Microsoft, un ITO plus bas a augmenté la durée d'environ un tiers et réduit les unités de capacité de près de moitié.
  options:
    b:
      en: |
        Staging adds an interim copy step; it does not reduce the compute of the copy and is needed only in specific scenarios.
      fr: |
        La mise en zone de transit ajoute une étape de copie intermédiaire ; elle ne réduit pas la puissance de calcul de la copie et n'est nécessaire que dans certains scénarios.
    c:
      en: |
        Data consistency verification adds checks after the copy and affects its performance; it does not lower the compute allocated.
      fr: |
        Data consistency verification ajoute des contrôles après la copie et affecte ses performances ; elle ne réduit pas la puissance de calcul allouée.
    d:
      en: |
        Logging records the copied and skipped items; it does not change the resources that the copy uses.
      fr: |
        La journalisation enregistre les éléments copiés et ignorés ; elle ne change pas les ressources utilisées par la copie.
references:
