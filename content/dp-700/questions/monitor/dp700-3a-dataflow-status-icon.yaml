id: dp700-3a-dataflow-status-icon
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a workspace that contains a Dataflow Gen2 named DF_Customers. A data engineer edited the queries of DF_Customers this morning.

    In the workspace list, the Status column of DF_Customers now shows a red exclamation mark. Hovering over it indicates that the last validation failed. The refresh history shows that the last scheduled refresh succeeded.

    What should you do to find and fix the cause?
  fr: |
    Vous disposez d'un espace de travail qui contient un Dataflow Gen2 nommé DF_Customers. Un ingénieur données a modifié les requêtes de DF_Customers ce matin.

    Dans la liste de l'espace de travail, la colonne Status de DF_Customers affiche maintenant un point d'exclamation rouge. Son survol indique que la dernière validation a échoué. L'historique des actualisations montre que la dernière actualisation planifiée a réussi.

    Que devez-vous faire pour trouver et corriger la cause ?
body:
  options:
    - { id: a, text: { en: "Open the refresh history and download the detailed logs of the last refresh", fr: "Ouvrir l'historique des actualisations et télécharger les journaux détaillés de la dernière actualisation" } }
    - { id: b, text: { en: "Open the Job runs page of the Monitor hub and rerun the last refresh", fr: "Ouvrir la page Job runs du hub de surveillance et relancer la dernière actualisation" } }
    - { id: c, text: { en: "Open DF_Customers in the editor, run the validation and fix the reported errors", fr: "Ouvrir DF_Customers dans l'éditeur, lancer la validation et corriger les erreurs signalées" } }
    - { id: d, text: { en: "Open the refresh history and export the last runs as a CSV file", fr: "Ouvrir l'historique des actualisations et exporter les dernières exécutions dans un fichier CSV" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Status column reports the last refresh and the last save and validation. A failed refresh is investigated in the refresh history, but a failed save or validation is investigated by opening the dataflow in the editor and running validation, which reports the errors introduced by the edit.
    fr: |
      La colonne Status reflète la dernière actualisation ainsi que le dernier enregistrement et la dernière validation. Un échec d'actualisation s'analyse dans l'historique des actualisations, mais un échec d'enregistrement ou de validation s'analyse en ouvrant le dataflow dans l'éditeur et en lançant la validation, qui signale les erreurs introduites par la modification.
  options:
    a:
      en: |
        The last refresh succeeded and ran before the edit; its logs say nothing about the failed validation.
      fr: |
        La dernière actualisation a réussi et s'est exécutée avant la modification ; ses journaux ne disent rien de la validation en échec.
    b:
      en: |
        Rerunning a refresh doesn't fix the queries that failed validation.
      fr: |
        Relancer une actualisation ne corrige pas les requêtes dont la validation a échoué.
    d:
      en: |
        A CSV export lists refresh runs; it doesn't contain the validation errors of the edited queries.
      fr: |
        Un export CSV liste les exécutions d'actualisation ; il ne contient pas les erreurs de validation des requêtes modifiées.
references:
  - title: View Dataflow Gen2 refresh history and monitoring
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor
