id: dp700-3a-spark-detail-tabs
objective: "3.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a notebook named NB_Enrich that transforms data in a lakehouse. A scheduled run of NB_Enrich failed. You open the Spark application detail page of the run from the Monitor hub.

    You need to identify which tab to use for each task.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un notebook nommé NB_Enrich qui transforme des données dans un lakehouse. Une exécution planifiée de NB_Enrich a échoué. Vous ouvrez la page de détail de l'application Spark de l'exécution depuis le hub de surveillance.

    Vous devez identifier l'onglet à utiliser pour chaque tâche.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To search and download the driver log of the run, use the [[driver]] tab.

      To view how many executors were allocated and used during the run, use the [[exec]] tab.

      To read the Spark advisor recommendations and the root-cause analysis of the failure, use the [[diag]] tab.
    fr: |
      Pour rechercher et télécharger le journal du pilote (driver) de l'exécution, utilisez l'onglet [[driver]].

      Pour voir combien d'exécuteurs ont été alloués et utilisés pendant l'exécution, utilisez l'onglet [[exec]].

      Pour lire les recommandations de Spark Advisor et l'analyse de la cause racine de l'échec, utilisez l'onglet [[diag]].
  slots:
    - id: driver
      options:
        - { id: jobs, text: Jobs }
        - { id: logs, text: Logs }
        - { id: data, text: Data }
        - { id: snap, text: Item snapshots }
    - id: exec
      options:
        - { id: res, text: Resources }
        - { id: jobs, text: Jobs }
        - { id: logs, text: Logs }
        - { id: diag, text: Diagnostics }
    - id: diag
      options:
        - { id: logs, text: Logs }
        - { id: snap, text: Item snapshots }
        - { id: res, text: Resources }
        - { id: diag, text: Diagnostics }
answer:
  values: { driver: logs, exec: res, diag: diag }
explanation:
  correct:
    en: |
      The Logs tab shows the Livy, Prelaunch and Driver logs, with keyword search and a Download log button. The Resources tab shows a near real-time graph of executor allocation and utilization. The Diagnostics tab shows Spark advisor recommendations and error analysis, including the root cause of failures.
    fr: |
      L'onglet Logs affiche les journaux Livy, Prelaunch et Driver, avec une recherche par mot-clé et un bouton Download log. L'onglet Resources affiche un graphique quasiment en temps réel de l'allocation et de l'utilisation des exécuteurs. L'onglet Diagnostics affiche les recommandations de Spark Advisor et l'analyse des erreurs, y compris la cause racine des échecs.
  options:
    jobs: { en: "Jobs lists the Spark jobs with stages, tasks, data read and written and a code snippet.", fr: "Jobs liste les travaux Spark avec leurs étapes, leurs tâches, les données lues et écrites et un extrait de code." }
    data: { en: "Data lists the input and output files of the application.", fr: "Data liste les fichiers d'entrée et de sortie de l'application." }
    snap: { en: "Item snapshots shows the notebook code and parameters as they were at execution time.", fr: "Item snapshots montre le code et les paramètres du notebook tels qu'ils étaient au moment de l'exécution." }
references:
  - title: Apache Spark application detail monitoring
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-detail-monitoring
