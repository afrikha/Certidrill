id: dp700-3b-notruncation-ignored
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse. A data engineer runs the following KQL query against a table named Readings to export about 800,000 rows into a one-time reconciliation file.

    ```kusto
    set truncationmaxsize = 134217728;
    set notruncation;
    Readings
    | where Timestamp between (datetime(2026-11-01) .. datetime(2026-11-02))
    ```

    The query fails with the following error: "Query result set has exceeded the internal record count limit 500000 (E_QUERY_RESULT_SET_TOO_LARGE)."

    You need the query to return all the rows.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse. Un ingénieur Données exécute la requête KQL suivante sur une table nommée Readings pour exporter environ 800 000 lignes dans un fichier de rapprochement ponctuel.

    ```kusto
    set truncationmaxsize = 134217728;
    set notruncation;
    Readings
    | where Timestamp between (datetime(2026-11-01) .. datetime(2026-11-02))
    ```

    La requête échoue avec l'erreur suivante : « Query result set has exceeded the internal record count limit 500000 (E_QUERY_RESULT_SET_TOO_LARGE). »

    La requête doit renvoyer toutes les lignes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add `| take 800000` at the end of the query", fr: "Ajouter `| take 800000` à la fin de la requête" } }
    - { id: b, text: { en: "Add `set servertimeout = 1h;` before the query", fr: "Ajouter `set servertimeout = 1h;` avant la requête" } }
    - { id: c, text: { en: "Remove the `set truncationmaxsize` statement", fr: "Supprimer l'instruction `set truncationmaxsize`" } }
    - { id: d, text: { en: "Add `set maxmemoryconsumptionperiterator = 32212254720;` before the query", fr: "Ajouter `set maxmemoryconsumptionperiterator = 32212254720;` avant la requête" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When notruncation is set together with truncationmaxsize, truncationmaxrecords or query_take_max_records, notruncation is ignored. The query therefore keeps the default limit of 500,000 records. Without truncationmaxsize, notruncation removes the truncation limits.
    fr: |
      Quand notruncation est défini en même temps que truncationmaxsize, truncationmaxrecords ou query_take_max_records, notruncation est ignoré. La requête conserve donc la limite par défaut de 500 000 enregistrements. Sans truncationmaxsize, notruncation supprime les limites de troncation.
  options:
    a: { en: "take limits the number of rows returned; it doesn't raise the result set limit.", fr: "take limite le nombre de lignes renvoyées ; il ne relève pas la limite du jeu de résultats." }
    b: { en: "The error is about result size, not duration.", fr: "L'erreur porte sur la taille du résultat, pas sur la durée." }
    d: { en: "This option limits the memory of an operator per node (E_RUNAWAY_QUERY); it doesn't change result truncation.", fr: "Cette option limite la mémoire d'un opérateur par nœud (E_RUNAWAY_QUERY) ; elle ne change pas la troncation du résultat." }
references:
  - title: Query limits
    url: https://learn.microsoft.com/en-us/kusto/concepts/query-limits?view=microsoft-fabric
