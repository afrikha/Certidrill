id: dp700-3b-copy-warehouse-staging
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a warehouse named DW1 and a pipeline named PL_Ingest.

    PL_Ingest contains a Copy data activity named Copy Files that copies delimited text files from a folder in an Azure Data Lake Storage Gen2 account to a table in DW1. The source has Recursively selected, and staging is disabled.

    The files are produced by a Linux application and use only a line feed (LF) as the row delimiter. Copy Files fails.

    You need to ensure that Copy Files loads the files into DW1. The solution must not change the source files.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un entrepôt nommé DW1 et un pipeline nommé PL_Ingest.

    PL_Ingest contient une activité Copy data nommée Copy Files qui copie des fichiers de texte délimité d'un dossier d'un compte Azure Data Lake Storage Gen2 vers une table de DW1. L'option Recursively est sélectionnée sur la source et le staging est désactivé.

    Les fichiers sont produits par une application Linux et utilisent uniquement un saut de ligne (LF) comme délimiteur de lignes. Copy Files échoue.

    Vous devez faire en sorte que Copy Files charge les fichiers dans DW1. La solution ne doit pas modifier les fichiers source.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the Settings tab, select Fault tolerance so that incompatible rows are skipped", fr: "Dans l'onglet Settings, sélectionner Fault tolerance pour ignorer les lignes incompatibles" } }
    - { id: b, text: { en: "In the destination settings, set Table option to Auto create table", fr: "Dans les paramètres de destination, définir Table option sur Auto create table" } }
    - { id: c, text: { en: "In the Settings tab, set Intelligent throughput optimization to Maximum", fr: "Dans l'onglet Settings, définir Intelligent throughput optimization sur Maximum" } }
    - { id: d, text: { en: "In the Settings tab, select Enable staging", fr: "Dans l'onglet Settings, sélectionner Enable staging" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The COPY statement of a warehouse reads delimited text from Azure Data Lake Storage Gen2 directly only when the default row delimiter fits the files, which is the case for \\r\\n. For any other delimiter, you enable staging, so that the copy activity converts the data into a COPY-compatible format before it calls the COPY statement."
    fr: "L'instruction COPY d'un entrepôt lit directement du texte délimité depuis Azure Data Lake Storage Gen2 seulement quand le délimiteur de lignes par défaut convient aux fichiers, ce qui est le cas pour \\r\\n. Pour tout autre délimiteur, vous activez le staging : l'activité de copie convertit alors les données dans un format compatible avec COPY avant d'appeler l'instruction COPY."
  options:
    a: { en: "Fault tolerance skips individual incompatible rows; it doesn't change how the files are read, so rows would be lost instead of loaded.", fr: "Fault tolerance ignore des lignes incompatibles isolées ; il ne change pas la façon dont les fichiers sont lus : des lignes seraient perdues au lieu d'être chargées." }
    b: { en: "Auto create table only creates the destination table from the source schema; the files still can't be read by a direct COPY.", fr: "Auto create table crée seulement la table de destination à partir du schéma source ; les fichiers ne peuvent toujours pas être lus par un COPY direct." }
    c: { en: "Throughput optimization changes the copy performance, not the file format compatibility.", fr: "L'optimisation du débit change les performances de la copie, pas la compatibilité du format de fichier." }
references:
  - title: Configure a warehouse in a copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/connector-data-warehouse-copy-activity
