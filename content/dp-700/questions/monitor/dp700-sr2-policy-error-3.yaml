id: dp700-sr2-policy-error-3
objective: "3.2.4"
type: series_yesno
series: dp700-sr2-policy-error
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You show the update policy of the Readings table.
  fr: Vous affichez la stratégie de mise à jour de la table Readings.
body:
  solution:
    en: |
      In PlantDB, you run `.show table Readings policy update` and you review the result.
    fr: |
      Dans PlantDB, vous exécutez `.show table Readings policy update` et vous examinez le résultat.
answer: { value: false }
explanation:
  correct:
    en: |
      This command returns the definition of the update policy, such as its source table, query and transactional setting, not the errors of its runs. The policy itself still looks valid, because it isn't revalidated when a function it calls changes.
    fr: |
      Cette commande retourne la définition de la stratégie de mise à jour, comme sa table source, sa requête et son paramètre transactionnel, et non les erreurs de ses exécutions. La stratégie elle-même paraît toujours valide, car elle n'est pas revalidée quand une fonction qu'elle appelle est modifiée.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
