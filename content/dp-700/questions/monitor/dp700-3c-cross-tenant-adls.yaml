id: dp700-3c-cross-tenant-adls
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your company uses a Microsoft Entra tenant named contoso.com and has a Fabric lakehouse named LH_Partners.

    A partner company named Fabrikam stores data in an Azure Data Lake Storage Gen2 account named stfabrikamdata, which belongs to the fabrikam.com tenant. Fabrikam created a guest account for you in fabrikam.com and assigned it the Storage Blob Data Reader role on the account.

    You try to create an ADLS Gen2 shortcut in LH_Partners to stfabrikamdata by using the Organizational account authentication kind, and the shortcut cannot access the data.

    You need to create the shortcut.

    What should you use for the connection?
  fr: |
    Votre entreprise utilise un locataire Microsoft Entra nommé contoso.com et dispose d'un lakehouse Fabric nommé LH_Partners.

    Une entreprise partenaire nommée Fabrikam stocke des données dans un compte Azure Data Lake Storage Gen2 nommé stfabrikamdata, qui appartient au locataire fabrikam.com. Fabrikam a créé pour vous un compte invité dans fabrikam.com et lui a attribué le rôle Storage Blob Data Reader sur le compte.

    Vous essayez de créer dans LH_Partners un raccourci ADLS Gen2 vers stfabrikamdata avec le type d'authentification Organizational account, et le raccourci ne peut pas accéder aux données.

    Vous devez créer le raccourci.

    Que devez-vous utiliser pour la connexion ?
body:
  options:
    - { id: a, text: { en: "The workspace identity of the workspace that contains LH_Partners", fr: "L'identité de l'espace de travail qui contient LH_Partners" } }
    - { id: b, text: { en: "Your guest account in fabrikam.com with the Organizational account kind", fr: "Votre compte invité dans fabrikam.com avec le type Organizational account" } }
    - { id: c, text: { en: "A service principal registered in fabrikam.com that has a Storage Blob Data role", fr: "Un principal de service inscrit dans fabrikam.com qui dispose d'un rôle Storage Blob Data" } }
    - { id: d, text: { en: "A managed private endpoint from the workspace to stfabrikamdata", fr: "Un point de terminaison privé managé de l'espace de travail vers stfabrikamdata" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A storage account in a different Microsoft Entra tenant can be reached by an ADLS Gen2 shortcut only with a service principal or a shared access signature (SAS). A service principal of fabrikam.com that has Storage Blob Data Reader, Contributor or Owner on the account meets this requirement.
    fr: |
      Un compte de stockage situé dans un autre locataire Microsoft Entra n'est accessible à un raccourci ADLS Gen2 qu'avec un principal de service ou une signature d'accès partagé (SAS). Un principal de service de fabrikam.com qui dispose de Storage Blob Data Reader, Contributor ou Owner sur le compte satisfait cette exigence.
  options:
    a:
      en: |
        The workspace identity belongs to the contoso.com tenant and does not work across tenants.
      fr: |
        L'identité d'espace de travail appartient au locataire contoso.com et ne fonctionne pas entre locataires.
    b:
      en: |
        Organizational account authentication does not work for a storage account in another tenant, even with a guest account.
      fr: |
        L'authentification Organizational account ne fonctionne pas pour un compte de stockage d'un autre locataire, même avec un compte invité.
    d:
      en: |
        OneLake shortcuts do not support ADLS Gen2 accounts reached through managed private endpoints, and a network path does not solve an authentication problem.
      fr: |
        Les raccourcis OneLake ne prennent pas en charge les comptes ADLS Gen2 joints par des points de terminaison privés managés, et un chemin réseau ne résout pas un problème d'authentification.
references:
  - title: Create an Azure Data Lake Storage Gen2 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-adls-shortcut
