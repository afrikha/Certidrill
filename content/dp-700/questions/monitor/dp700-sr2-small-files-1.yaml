id: dp700-sr2-small-files-1
objective: "3.3.1"
type: series_yesno
series: dp700-sr2-small-files
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You enable auto compaction on the table and run OPTIMIZE once.
  fr: Vous activez le compactage automatique sur la table et exécutez OPTIMIZE une fois.
body:
  solution:
    en: |
      You run `ALTER TABLE device_events SET TBLPROPERTIES ('delta.autoOptimize.autoCompact' = 'true')`, and then you run `OPTIMIZE device_events` once.
    fr: |
      Vous exécutez `ALTER TABLE device_events SET TBLPROPERTIES ('delta.autoOptimize.autoCompact' = 'true')`, puis vous exécutez `OPTIMIZE device_events` une fois.
answer: { value: true }
explanation:
  correct:
    en: |
      `OPTIMIZE` rewrites the existing small files into larger ones. With the table property `delta.autoOptimize.autoCompact` set, each write of the stream is followed by an evaluation of the file layout, and a synchronous `OPTIMIZE` runs when there are too many small files. The writer maintains the table itself, without any scheduled job.
    fr: |
      `OPTIMIZE` réécrit les petits fichiers existants en fichiers plus grands. Avec la propriété de table `delta.autoOptimize.autoCompact` définie, chaque écriture du flux est suivie d'une évaluation de la disposition des fichiers, et un `OPTIMIZE` synchrone s'exécute quand il y a trop de petits fichiers. Le processus d'écriture entretient lui-même la table, sans aucun travail planifié.
references:
  - title: Compacting Delta tables
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/table-compaction
