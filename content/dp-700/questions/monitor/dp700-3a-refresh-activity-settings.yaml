id: dp700-3a-refresh-activity-settings
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a pipeline named PL_Finance that loads a table named FactBudget in a lakehouse. After the load, PL_Finance must refresh an import-mode semantic model named SM_Finance by using a Semantic model refresh activity. The model contains 12 tables.

    You need to configure the activity to meet the following requirements:

    - The pipeline run must show a failure when the refresh fails.
    - A failed refresh must be retried up to two times.
    - Only the FactBudget table must be refreshed.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un pipeline nommé PL_Finance qui charge une table nommée FactBudget dans un lakehouse. Après le chargement, PL_Finance doit actualiser un modèle sémantique en mode importation nommé SM_Finance à l'aide d'une activité Semantic model refresh. Le modèle contient 12 tables.

    Vous devez configurer l'activité pour satisfaire les exigences suivantes :

    - L'exécution du pipeline doit indiquer un échec quand l'actualisation échoue.
    - Une actualisation en échec doit être relancée jusqu'à deux fois.
    - Seule la table FactBudget doit être actualisée.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To report the failure in the pipeline run: [[wait]]

      To retry a failed refresh: set [[retry]] to 2.

      To refresh FactBudget only: [[scope]]
    fr: |
      Pour signaler l'échec dans l'exécution du pipeline : [[wait]]

      Pour relancer une actualisation en échec : régler [[retry]] sur 2.

      Pour n'actualiser que FactBudget : [[scope]]
  slots:
    - id: wait
      options:
        - { id: mp, text: { en: "set Max parallelism to 1", fr: "régler Max parallelism sur 1" } }
        - { id: wait, text: { en: "keep Wait on completion turned on", fr: "laisser Wait on completion activé" } }
        - { id: trans, text: { en: "set the commit mode to Transactional", fr: "régler le mode de validation sur Transactional" } }
    - id: retry
      options:
        - { id: retry, text: Retry Count }
        - { id: mp, text: Max parallelism }
        - { id: timeout, text: Semantic model refresh timeout }
    - id: scope
      options:
        - { id: empty, text: { en: "leave the table and partition selection empty", fr: "laisser vide la sélection des tables et partitions" } }
        - { id: partial, text: { en: "set the commit mode to Partial Batch", fr: "régler le mode de validation sur Partial Batch" } }
        - { id: select, text: { en: "select FactBudget in the table and partition selection", fr: "sélectionner FactBudget dans la sélection des tables et partitions" } }
answer:
  values: { wait: wait, retry: retry, scope: select }
explanation:
  correct:
    en: |
      Wait on completion, on by default, makes the activity wait until the refresh finishes, so a failed refresh fails the activity and the pipeline run. Retry Count sets how many times the refresh is retried. You can select specific tables and partitions to refresh; without a selection, the activity runs a full refresh of the model.
    fr: |
      Wait on completion, activé par défaut, fait attendre l'activité jusqu'à la fin de l'actualisation : une actualisation en échec fait échouer l'activité et l'exécution du pipeline. Retry Count définit le nombre de nouvelles tentatives de l'actualisation. Vous pouvez sélectionner des tables et des partitions précises à actualiser ; sans sélection, l'activité exécute une actualisation complète du modèle.
  options:
    mp: { en: "Max parallelism limits how many objects are processed in parallel; it neither retries nor reports the result.", fr: "Max parallelism limite le nombre d'objets traités en parallèle ; il ne relance pas l'actualisation et n'en signale pas le résultat." }
    trans: { en: "Transactional commits the whole refresh at once; without waiting for completion, the activity still doesn't report the refresh result.", fr: "Transactional valide toute l'actualisation en une fois ; sans attente de la fin, l'activité ne signale toujours pas le résultat de l'actualisation." }
    timeout: { en: "The timeout limits how long the refresh may run; it doesn't retry it.", fr: "Le délai d'expiration limite la durée de l'actualisation ; il ne la relance pas." }
    empty: { en: "Without a selection, the activity runs a full refresh of all 12 tables.", fr: "Sans sélection, l'activité exécute une actualisation complète des 12 tables." }
    partial: { en: "Partial Batch commits the refresh in batches; it doesn't limit the refresh to one table.", fr: "Partial Batch valide l'actualisation par lots ; il ne limite pas l'actualisation à une table." }
references:
  - title: Semantic model refresh activity in Data Factory for Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/semantic-model-refresh-activity
