id: dp700-cs2c-moved-target
objective: "3.2.7"
type: single
caseStudy: dp700-cs2c-wide-world
difficulty: 2
status: draft
stem:
  en: You need to meet the requirement for the customs documents. What should you do?
  fr: Vous devez satisfaire l'exigence relative aux documents douaniers. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete the customs_docs shortcut, and then create a shortcut that targets partners/archive/customs", fr: "Supprimer le raccourci customs_docs, puis créer un raccourci qui cible partners/archive/customs" } }
    - { id: b, text: { en: "Select Reset cache in the OneLake settings of WWI-Trade, and then read customs_docs again", fr: "Sélectionner Reset cache dans les paramètres OneLake de WWI-Trade, puis relire customs_docs" } }
    - { id: c, text: { en: "Create a pipeline that copies partners/archive/customs into Files/customs_docs of LH_Trade", fr: "Créer un pipeline qui copie partners/archive/customs dans Files/customs_docs de LH_Trade" } }
    - { id: d, text: { en: "Delete LH_Trade and its shortcuts, and then recreate the lakehouse and the shortcut", fr: "Supprimer LH_Trade et ses raccourcis, puis recréer le lakehouse et le raccourci" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A shortcut points to a fixed target path, so moving, renaming or deleting the target folder breaks it. Pointing a shortcut at partners/archive/customs restores access without copying data. Deleting a shortcut removes only the shortcut; the files in stwwipartners are not deleted.
    fr: |
      Un raccourci pointe vers un chemin cible fixe : déplacer, renommer ou supprimer le dossier cible le rend inutilisable. Faire pointer un raccourci vers partners/archive/customs rétablit l'accès sans copier les données. La suppression d'un raccourci ne supprime que le raccourci ; les fichiers de stwwipartners ne sont pas supprimés.
  options:
    b: { en: "Shortcut caching applies to Google Cloud Storage, Amazon S3 and gateway shortcuts, not to ADLS Gen2; resetting it does not change the target path.", fr: "La mise en cache des raccourcis s'applique aux raccourcis Google Cloud Storage, Amazon S3 et passerelle, pas à ADLS Gen2 ; la réinitialiser ne change pas le chemin cible." }
    c: { en: "A copy of the documents into OneLake violates the requirement that the documents must not be copied.", fr: "Une copie des documents dans OneLake enfreint l'exigence selon laquelle les documents ne doivent pas être copiés." }
    d: { en: "Deleting the lakehouse removes all its tables and files; only the broken shortcut needs to change.", fr: "Supprimer le lakehouse supprime toutes ses tables et tous ses fichiers ; seul le raccourci rompu doit changer." }
references:
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
