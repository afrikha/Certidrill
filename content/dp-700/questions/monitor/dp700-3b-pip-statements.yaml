id: dp700-3b-pip-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a notebook named NB_Score. NB_Score installs Python libraries inline, and several of its runs failed with errors related to missing libraries or lost variables.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un notebook nommé NB_Score. NB_Score installe des bibliothèques Python en ligne, et plusieurs de ses exécutions ont échoué avec des erreurs liées à des bibliothèques manquantes ou à des variables perdues.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A library installed with !pip is available on the executor nodes of the Spark session."
        fr: "Une bibliothèque installée avec !pip est disponible sur les nœuds exécuteurs de la session Spark."
    - id: s2
      text:
        en: "Running %pip install restarts the Python interpreter, so variables defined in earlier cells are lost."
        fr: "L'exécution de %pip install redémarre l'interpréteur Python : les variables définies dans les cellules précédentes sont perdues."
    - id: s3
      text:
        en: "%pip install is supported when NB_Score runs in a high concurrency session."
        fr: "%pip install est pris en charge quand NB_Score s'exécute dans une session à haute concurrence."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      !pip is an IPython shell command that installs a package only on the driver node, whereas %pip installs on the driver and the executors. The system restarts the Python interpreter to apply inline library changes, so install commands belong at the beginning of the notebook. %pip install isn't supported in high concurrency mode.
    fr: |
      !pip est une commande shell IPython qui n'installe un package que sur le nœud pilote, alors que %pip l'installe sur le pilote et les exécuteurs. Le système redémarre l'interpréteur Python pour appliquer les modifications de bibliothèques en ligne : les commandes d'installation doivent figurer au début du notebook. %pip install n'est pas pris en charge en mode haute concurrence.
references:
  - title: Manage Apache Spark libraries
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/library-management
