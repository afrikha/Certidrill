id: dp700-3d-native-engine-enable
objective: "3.3.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that uses Runtime 1.3. A notebook named NB3 runs complex joins and aggregations on Delta tables in a lakehouse and takes 50 minutes. NB3 uses an environment named Env3.

    You need to reduce the duration of NB3. The solution must not change the code of the transformations, the node size or the number of nodes.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric qui utilise Runtime 1.3. Un notebook nommé NB3 exécute des jointures et des agrégations complexes sur des tables Delta d'un lakehouse et dure 50 minutes. NB3 utilise un environnement nommé Env3.

    Vous devez réduire la durée de NB3. La solution ne doit modifier ni le code des transformations, ni la taille des nœuds, ni le nombre de nœuds.

    Quelles sont les deux actions possibles ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a first cell to NB3 that runs %%sql SET spark.native.enabled=FALSE.", fr: "Ajouter à NB3 une première cellule qui exécute %%sql SET spark.native.enabled=FALSE." } }
    - { id: b, text: { en: "In Env3, select Enable native execution engine on the Acceleration page, and then publish Env3.", fr: "Dans Env3, sélectionner Enable native execution engine dans la page Acceleration, puis publier Env3." } }
    - { id: c, text: { en: "Publish Env3 in Full mode instead of Quick mode.", fr: "Publier Env3 en mode Full au lieu du mode Quick." } }
    - { id: d, text: { en: "Add a first cell to NB3 that uses %%configure to set spark.native.enabled to true.", fr: "Ajouter à NB3 une première cellule qui utilise %%configure pour définir spark.native.enabled sur true." } }
    - { id: e, text: { en: "Set spark.fabric.resourceProfile to writeHeavy in Env3.", fr: "Définir spark.fabric.resourceProfile sur writeHeavy dans Env3." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The native execution engine runs supported Spark operators on Parquet and Delta data in a vectorized engine, without code changes, on Runtime 1.3 and 2.0; complex joins and aggregations benefit most. You can enable it for every notebook of an environment on the Acceleration page of Spark compute, or for one notebook with spark.native.enabled in a %%configure cell."
    fr: "Le moteur d'exécution natif exécute les opérateurs Spark pris en charge sur des données Parquet et Delta dans un moteur vectorisé, sans modification du code, sur Runtime 1.3 et 2.0 ; les jointures et agrégations complexes en profitent le plus. Vous pouvez l'activer pour tous les notebooks d'un environnement dans la page Acceleration de Spark compute, ou pour un seul notebook avec spark.native.enabled dans une cellule %%configure."
  options:
    a: { en: "Setting spark.native.enabled to FALSE turns the native execution engine off for the following cells, so NB3 keeps running on the JVM engine.", fr: "Définir spark.native.enabled sur FALSE désactive le moteur d'exécution natif pour les cellules suivantes : NB3 continue de s'exécuter sur le moteur JVM." }
    c: { en: "Full mode controls how libraries are published, not how queries run.", fr: "Le mode Full contrôle la publication des bibliothèques, pas l'exécution des requêtes." }
    e: { en: "writeHeavy tunes Delta writes for ingestion-heavy workloads (V-Order off); it does not accelerate joins and aggregations.", fr: "writeHeavy règle les écritures Delta pour les charges d'ingestion (V-Order désactivé) ; il n'accélère pas les jointures et les agrégations." }
references:
  - title: Native execution engine for Fabric Data Engineering
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/native-execution-engine-overview
