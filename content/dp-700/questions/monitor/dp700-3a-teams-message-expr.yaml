id: dp700-3a-teams-message-expr
objective: "3.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has a pipeline named PL_Child that is called by several parent pipelines through an Invoke pipeline activity. You add a Teams activity on the failure path of the main Copy activity of PL_Child.

    The Teams message must show the name of PL_Child (not its ID), the ID of the failed run, and the name of the parent pipeline that called it.

    How should you complete the message? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un pipeline nommé PL_Child qui est appelé par plusieurs pipelines parents via une activité Invoke pipeline. Vous ajoutez une activité Teams sur le chemin d'échec de l'activité Copy principale de PL_Child.

    Le message Teams doit afficher le nom de PL_Child (et non son ID), l'ID de l'exécution en échec et le nom du pipeline parent qui l'a appelé.

    Comment devez-vous compléter le message ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: text
  template: |
    Pipeline @{pipeline().[[name]]} failed.
    Run ID: [[run]]
    Called by: @{pipeline()?.[[parent]]}
  slots:
    - id: name
      options:
        - { id: pipeline, text: Pipeline }
        - { id: pname, text: PipelineName }
        - { id: df, text: DataFactory }
        - { id: trigger, text: TriggerName }
    - id: run
      options:
        - { id: bare, text: "@pipeline().RunId" }
        - { id: escaped, text: "@@{pipeline().RunId}" }
        - { id: interp, text: "@{pipeline().RunId}" }
        - { id: group, text: "@{pipeline().GroupId}" }
    - id: parent
      options:
        - { id: trigger, text: TriggerName }
        - { id: parentrun, text: TriggeredByPipelineRunId }
        - { id: pname, text: PipelineName }
        - { id: parentname, text: TriggeredByPipelineName }
answer:
  values: { name: pname, run: interp, parent: parentname }
explanation:
  correct:
    en: |
      `pipeline().PipelineName` returns the name of the pipeline, whereas `pipeline().Pipeline` returns its ID. Inside a text, an expression is evaluated only when wrapped in `@{...}`, so `@{pipeline().RunId}` inserts the ID of the run. `pipeline()?.TriggeredByPipelineName` returns the name of the pipeline that called this run, and null when no pipeline called it.
    fr: |
      `pipeline().PipelineName` renvoie le nom du pipeline, alors que `pipeline().Pipeline` renvoie son ID. Dans un texte, une expression n'est évaluée que si elle est entourée de `@{...}` : `@{pipeline().RunId}` insère donc l'ID de l'exécution. `pipeline()?.TriggeredByPipelineName` renvoie le nom du pipeline qui a appelé cette exécution, et null quand aucun pipeline ne l'a appelée.
  options:
    pipeline: { en: "pipeline().Pipeline returns the ID of the pipeline, not its name.", fr: "pipeline().Pipeline renvoie l'ID du pipeline, pas son nom." }
    df: { en: "pipeline().DataFactory returns the ID of the workspace.", fr: "pipeline().DataFactory renvoie l'ID de l'espace de travail." }
    bare: { en: "In the middle of a text, an expression that isn't wrapped in @{...} isn't evaluated.", fr: "Au milieu d'un texte, une expression qui n'est pas entourée de @{...} n'est pas évaluée." }
    escaped: { en: "@@ escapes the @ character, so the expression appears as literal text.", fr: "@@ échappe le caractère @ : l'expression apparaît comme du texte littéral." }
    group: { en: "GroupId identifies the group to which the run belongs, not the run itself.", fr: "GroupId identifie le groupe auquel appartient l'exécution, pas l'exécution elle-même." }
    trigger: { en: "TriggerName is the name of the trigger that invoked the run, not of the parent pipeline.", fr: "TriggerName est le nom du déclencheur qui a lancé l'exécution, pas celui du pipeline parent." }
    parentrun: { en: "TriggeredByPipelineRunId returns the run ID of the parent pipeline, not its name.", fr: "TriggeredByPipelineRunId renvoie l'ID d'exécution du pipeline parent, pas son nom." }
references:
  - title: Expressions and functions for Data Factory in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-factory/expression-language
  - title: Teams activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/teams-activity
