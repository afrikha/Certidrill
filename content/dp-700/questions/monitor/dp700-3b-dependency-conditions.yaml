id: dp700-3b-dependency-conditions
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1. You are fixing a pipeline named PL_Stock whose error handling doesn't run as expected. PL_Stock contains four activities named Validate Files, Load Stock, Log Error, and Close Run.

    The pipeline must meet the following requirements:

    - Load Stock runs only if Validate Files succeeds.
    - Log Error runs only if Load Stock fails.
    - Close Run runs only when Load Stock didn't run because Validate Files failed.

    How should you configure the dependencies? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1. Vous corrigez un pipeline nommé PL_Stock dont la gestion des erreurs ne fonctionne pas comme prévu. PL_Stock contient quatre activités nommées Validate Files, Load Stock, Log Error et Close Run.

    Le pipeline doit satisfaire les exigences suivantes :

    - Load Stock ne s'exécute que si Validate Files réussit.
    - Log Error ne s'exécute que si Load Stock échoue.
    - Close Run ne s'exécute que lorsque Load Stock ne s'est pas exécuté parce que Validate Files a échoué.

    Comment devez-vous configurer les dépendances ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      From Validate Files to Load Stock: [[s1]]

      From Load Stock to Log Error: [[s2]]

      From Load Stock to Close Run: [[s3]]
    fr: |
      De Validate Files vers Load Stock : [[s1]]

      De Load Stock vers Log Error : [[s2]]

      De Load Stock vers Close Run : [[s3]]
  slots:
    - id: s1
      options:
        - { id: s1-success, text: Upon Success }
        - { id: s1-failure, text: Upon Failure }
        - { id: s1-completion, text: Upon Completion }
        - { id: s1-skip, text: Upon Skip }
    - id: s2
      options:
        - { id: s2-success, text: Upon Success }
        - { id: s2-failure, text: Upon Failure }
        - { id: s2-completion, text: Upon Completion }
        - { id: s2-skip, text: Upon Skip }
    - id: s3
      options:
        - { id: s3-success, text: Upon Success }
        - { id: s3-failure, text: Upon Failure }
        - { id: s3-completion, text: Upon Completion }
        - { id: s3-skip, text: Upon Skip }
answer:
  values: { s1: s1-success, s2: s2-failure, s3: s3-skip }
explanation:
  correct:
    en: "Upon Success runs the next activity only when the previous one succeeded, and Upon Failure only when it failed. Upon Skip runs the next activity when the previous activity didn't run, which is what happens to Load Stock when Validate Files fails. Upon Failure and Upon Skip can both leave Load Stock; only Upon Completion can't be combined with Upon Success or Upon Failure from the same activity."
    fr: "Upon Success n'exécute l'activité suivante que si la précédente a réussi, et Upon Failure que si elle a échoué. Upon Skip exécute l'activité suivante quand la précédente ne s'est pas exécutée, ce qui arrive à Load Stock quand Validate Files échoue. Upon Failure et Upon Skip peuvent partir tous deux de Load Stock ; seul Upon Completion ne peut pas être combiné avec Upon Success ou Upon Failure depuis la même activité."
  options:
    s1-completion: { en: "Load Stock would also run after a failed validation.", fr: "Load Stock s'exécuterait aussi après un échec de la validation." }
    s2-completion: { en: "Log Error would also run after a successful load.", fr: "Log Error s'exécuterait aussi après un chargement réussi." }
    s3-failure: { en: "Upon Failure runs Close Run when Load Stock ran and failed, not when it was skipped.", fr: "Upon Failure exécute Close Run quand Load Stock s'est exécuté et a échoué, pas quand il a été ignoré." }
references:
  - title: Pipeline failure and error message
    url: https://learn.microsoft.com/en-us/azure/data-factory/tutorial-pipeline-failure-error-handling
  - title: Activity overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview
