id: dp700-3b-update-policy-join-streaming
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse named EH1. EH1 contains a KQL database named DB_IoT that has three tables named RawReadings, Devices, and EnrichedReadings. All the tables use the default policies of the eventhouse.

    You create a function named EnrichReadings() that uses the join operator to add device attributes from Devices to the rows of RawReadings. You define an update policy on EnrichedReadings that uses RawReadings as its source and EnrichReadings() as its query. EnrichedReadings stays empty.

    You need the update policy to populate EnrichedReadings by using EnrichReadings().

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse nommé EH1. EH1 contient une base de données KQL nommée DB_IoT qui comporte trois tables nommées RawReadings, Devices et EnrichedReadings. Toutes les tables utilisent les stratégies par défaut de l'eventhouse.

    Vous créez une fonction nommée EnrichReadings() qui utilise l'opérateur join pour ajouter aux lignes de RawReadings des attributs d'appareil issus de Devices. Vous définissez sur EnrichedReadings une stratégie de mise à jour qui utilise RawReadings comme source et EnrichReadings() comme requête. EnrichedReadings reste vide.

    La stratégie de mise à jour doit alimenter EnrichedReadings au moyen d'EnrichReadings().

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set IsTransactional to true in the update policy", fr: "Définir IsTransactional sur true dans la stratégie de mise à jour" } }
    - { id: b, text: { en: "Set PropagateIngestionProperties to true in the update policy", fr: "Définir PropagateIngestionProperties sur true dans la stratégie de mise à jour" } }
    - { id: c, text: { en: "Set MaximumBatchingTimeSpan of the RawReadings ingestion batching policy to 00:00:20", fr: "Définir MaximumBatchingTimeSpan de la stratégie de traitement par lot d'ingestion de RawReadings sur 00:00:20" } }
    - { id: d, text: { en: "Disable the streaming ingestion policy of the RawReadings table", fr: "Désactiver la stratégie d'ingestion de streaming de la table RawReadings" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      By default, the streaming ingestion policy is enabled for all the tables of an eventhouse. To use a function that contains the join operator in an update policy, the streaming ingestion policy must be disabled on the source table, with .alter table ... policy streamingingestion. In a cascade, it must be disabled on all the upstream tables.
    fr: |
      Par défaut, la stratégie d'ingestion de streaming est activée pour toutes les tables d'un eventhouse. Pour utiliser dans une stratégie de mise à jour une fonction qui contient l'opérateur join, la stratégie d'ingestion de streaming doit être désactivée sur la table source, avec .alter table ... policy streamingingestion. Dans une cascade, elle doit être désactivée sur toutes les tables en amont.
  options:
    a: { en: "IsTransactional decides what happens to the source data when the policy fails; it doesn't lift the join restriction.", fr: "IsTransactional détermine ce qu'il advient des données source quand la stratégie échoue ; il ne lève pas la restriction sur join." }
    b: { en: "This property copies ingestion properties such as extent tags to the target; it has no effect on the join.", fr: "Cette propriété copie des propriétés d'ingestion comme les étiquettes d'extent vers la cible ; elle n'a aucun effet sur join." }
    c: { en: "The batching policy applies to queued ingestion latency; it doesn't change what an update policy can run.", fr: "La stratégie de traitement par lot concerne la latence de l'ingestion en file d'attente ; elle ne change pas ce qu'une stratégie de mise à jour peut exécuter." }
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
