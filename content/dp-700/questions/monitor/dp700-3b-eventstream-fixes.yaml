id: dp700-3b-eventstream-fixes
objective: "3.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains several eventstreams. Developers report the issues shown in the answer area.

    You need to resolve each issue.

    Which action should you perform for each issue? To answer, drag the appropriate actions to the correct issues. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient plusieurs eventstreams. Des développeurs signalent les problèmes présentés dans la zone de réponse.

    Vous devez résoudre chaque problème.

    Quelle action devez-vous effectuer pour chaque problème ? Pour répondre, faites glisser les actions appropriées vers les problèmes correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: publish, text: { en: "Publish the eventstream", fr: "Publier l'eventstream" } }
    - { id: format, text: { en: "Change the data format of the source to Avro", fr: "Remplacer le format de données de la source par Avro" } }
    - { id: dest, text: { en: "Use an eventhouse, custom endpoint, or derived stream destination", fr: "Utiliser une destination eventhouse, point de terminaison personnalisé ou flux dérivé" } }
    - { id: throughput, text: { en: "Raise the Event throughput level", fr: "Relever le niveau Event throughput" } }
    - { id: consumer, text: { en: "Create a new consumer group on the event hub", fr: "Créer un nouveau groupe de consommateurs sur le hub d'événements" } }
    - { id: retention, text: { en: "Increase the retention period", fr: "Augmenter la période de rétention" } }
  targets:
    - { id: t1, text: { en: "A custom application can't send events to the custom endpoint source that was just added to an eventstream.", fr: "Une application personnalisée ne peut pas envoyer d'événements à la source de point de terminaison personnalisé qui vient d'être ajoutée à un eventstream." } }
    - { id: t2, text: { en: "An Azure Event Hubs source configured with the JSON format reports deserialization errors for Avro-encoded events.", fr: "Une source Azure Event Hubs configurée au format JSON signale des erreurs de désérialisation pour des événements encodés en Avro." } }
    - { id: t3, text: { en: "A source associated with a schema from the schema registry can't be connected to a lakehouse destination.", fr: "Une source associée à un schéma du registre de schémas ne peut pas être reliée à une destination lakehouse." } }
    - { id: t4, text: { en: "Backlogged input events keep increasing on a source whose event hub has 32 partitions.", fr: "Backlogged input events ne cesse d'augmenter sur une source dont le hub d'événements comporte 32 partitions." } }
answer:
  mapping: { t1: publish, t2: format, t3: dest, t4: throughput }
explanation:
  correct:
    en: |
      A new custom endpoint source takes effect only after you publish the eventstream. The data format of an Azure Event Hubs source (JSON, Avro or CSV with header) must match the events. Only eventhouse, custom endpoint and derived stream destinations support eventstreams with associated schemas. With 4, 16 or 32 partitions, the throughput follows the selected Event throughput level, so raising the level reduces the backlog.
    fr: |
      Une nouvelle source de point de terminaison personnalisé ne prend effet qu'après la publication de l'eventstream. Le format de données d'une source Azure Event Hubs (JSON, Avro ou CSV avec en-tête) doit correspondre aux événements. Seules les destinations eventhouse, point de terminaison personnalisé et flux dérivé prennent en charge les eventstreams associés à des schémas. Avec 4, 16 ou 32 partitions, le débit suit le niveau Event throughput sélectionné : relever le niveau réduit le backlog.
  options:
    consumer: { en: "A consumer group separates readers of an event hub; it fixes none of these issues.", fr: "Un groupe de consommateurs sépare les lecteurs d'un hub d'événements ; il ne corrige aucun de ces problèmes." }
    retention: { en: "Retention keeps events longer; it doesn't speed up processing or fix formats.", fr: "La rétention conserve les événements plus longtemps ; elle n'accélère pas le traitement et ne corrige pas les formats." }
references:
  - title: Add a custom endpoint or custom app source to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-source-custom-app
  - title: Configure Settings for a Fabric Eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/configure-settings
