id: dp700-3c-endpoint-update
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that contains a lakehouse named LH_Retail. LH_Retail contains a Delta table named customers.

    A data engineer connects to the SQL analytics endpoint of LH_Retail and runs an UPDATE statement to correct the email addresses of 200 customers. The statement fails.

    You need to correct the rows in the customers table. The solution must minimize development effort.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé LH_Retail. LH_Retail contient une table Delta nommée customers.

    Un ingénieur données se connecte au point de terminaison d'analytique SQL de LH_Retail et exécute une instruction UPDATE pour corriger les adresses e-mail de 200 clients. L'instruction échoue.

    Vous devez corriger les lignes de la table customers. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run the UPDATE statement as Spark SQL in a notebook attached to LH_Retail.", fr: "Exécuter l'instruction UPDATE en Spark SQL dans un notebook attaché à LH_Retail." } }
    - { id: b, text: { en: "Assign the data engineer the Contributor role and rerun the statement in the endpoint.", fr: "Attribuer le rôle Contributor à l'ingénieur données et relancer l'instruction dans le point de terminaison." } }
    - { id: c, text: { en: "Create a view on customers in the endpoint and run the UPDATE statement on the view.", fr: "Créer une vue sur customers dans le point de terminaison et exécuter l'instruction UPDATE sur la vue." } }
    - { id: d, text: { en: "Wrap the UPDATE statement in BEGIN TRAN and COMMIT TRAN and rerun it in the endpoint.", fr: "Encadrer l'instruction UPDATE par BEGIN TRAN et COMMIT TRAN et la relancer dans le point de terminaison." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      INSERT, UPDATE and DELETE are supported only in a warehouse, not in the SQL analytics endpoint of a lakehouse. The lakehouse tables are Delta tables that Spark can modify directly, so running the same UPDATE as Spark SQL in a notebook corrects the rows with almost no extra work.
    fr: |
      INSERT, UPDATE et DELETE ne sont pris en charge que dans un entrepôt, pas dans le point de terminaison d'analytique SQL d'un lakehouse. Les tables du lakehouse sont des tables Delta que Spark peut modifier directement : exécuter le même UPDATE en Spark SQL dans un notebook corrige les lignes presque sans travail supplémentaire.
  options:
    b:
      en: |
        The failure does not come from a missing role. The endpoint does not support data modification statements for any user.
      fr: |
        L'échec ne vient pas d'un rôle manquant. Le point de terminaison ne prend en charge les instructions de modification de données pour aucun utilisateur.
    c:
      en: |
        You can create views in the endpoint, but they do not make the underlying Delta table writable through T-SQL.
      fr: |
        Vous pouvez créer des vues dans le point de terminaison, mais elles ne rendent pas la table Delta sous-jacente modifiable en T-SQL.
    d:
      en: |
        An explicit transaction does not change the statements the endpoint supports; the UPDATE still fails.
      fr: |
        Une transaction explicite ne change pas les instructions prises en charge par le point de terminaison : l'UPDATE échoue toujours.
references:
  - title: T-SQL Surface Area in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area
