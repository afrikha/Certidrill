id: dp700-cs1c-schema-mismatch
objective: "3.2.3"
type: single
caseStudy: dp700-cs1c-trey-research
difficulty: 1
status: draft
stem:
  en: |-
    You need to resolve the NB_Bronze failure. The solution must meet ingestion requirement 2. What should you do?
  fr: |-
    Vous devez résoudre l'échec de NB_Bronze. La solution doit respecter l'exigence d'ingestion 2. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add .option(\"overwriteSchema\", \"true\") to the append write", fr: "Ajouter .option(\"overwriteSchema\", \"true\") à l'écriture en mode append" } }
    - { id: b, text: { en: "Add .option(\"mergeSchema\", \"true\") to the append write", fr: "Ajouter .option(\"mergeSchema\", \"true\") à l'écriture en mode append" } }
    - { id: c, text: { en: "Change the write mode to overwrite and add .option(\"overwriteSchema\", \"true\")", fr: "Remplacer le mode d'écriture par overwrite et ajouter .option(\"overwriteSchema\", \"true\")" } }
    - { id: d, text: { en: "Enable V-Order on bronze.results_raw before the write", fr: "Activer V-Order sur bronze.results_raw avant l'écriture" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      By default, Delta enforces the table schema on write and rejects a DataFrame that contains unexpected columns. The mergeSchema option on an append adds the new columns, such as Wavelength, to the table schema; it never removes columns or changes the existing column types.
    fr: |-
      Par défaut, Delta applique le schéma de la table à l'écriture et rejette un DataFrame qui contient des colonnes inattendues. L'option mergeSchema sur un ajout (append) ajoute les nouvelles colonnes, comme Wavelength, au schéma de la table ; elle ne supprime jamais de colonnes et ne modifie pas les types des colonnes existantes.
  options:
    a:
      en: |-
        overwriteSchema replaces the table schema and is used with the overwrite mode; it is not the option that evolves the schema of an append.
      fr: |-
        overwriteSchema remplace le schéma de la table et s'utilise avec le mode overwrite ; ce n'est pas l'option qui fait évoluer le schéma lors d'un ajout.
    c:
      en: |-
        Overwriting replaces the data and the schema of the table with the incoming DataFrame, so every row already loaded for the other instruments would be lost.
      fr: |-
        L'écrasement remplace les données et le schéma de la table par le DataFrame entrant ; toutes les lignes déjà chargées pour les autres instruments seraient donc perdues.
    d:
      en: |-
        V-Order optimizes the layout of the Parquet files for reads; it does not change how schema differences are handled.
      fr: |-
        V-Order optimise l'organisation des fichiers Parquet pour la lecture ; il ne change pas la gestion des différences de schéma.
references:
  - title: Schema evolution for Delta tables
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/delta-lake-schema-evolution
