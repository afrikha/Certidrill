id: dp700-cs2b-statistics
objective: "3.3.3"
type: yesno_statements
caseStudy: dp700-cs2b-munsons
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing how statistics are managed in WH_Sales, to explain the slow first queries after the nightly load.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la façon dont les statistiques sont gérées dans WH_Sales, pour expliquer la lenteur des premières requêtes après le chargement nocturne.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - { id: s1, text: { en: "When a query needs a histogram that does not exist on a column of dbo.FactSales, the warehouse creates it during that query, and the creation time is part of the query duration.", fr: "Quand une requête a besoin d'un histogramme qui n'existe pas sur une colonne de dbo.FactSales, l'entrepôt le crée pendant cette requête, et le temps de création fait partie de la durée de la requête." } }
    - { id: s2, text: { en: "You can create a single statistics object on the RetailerKey and DateKey columns of dbo.FactSales to describe their combined distribution.", fr: "Vous pouvez créer un seul objet de statistiques sur les colonnes RetailerKey et DateKey de dbo.FactSales pour décrire leur distribution combinée." } }
    - { id: s3, text: { en: "After the nightly load, you can run UPDATE STATISTICS with FULLSCAN on a statistics object that you created on dbo.FactSales.", fr: "Après le chargement nocturne, vous pouvez exécuter UPDATE STATISTICS avec FULLSCAN sur un objet de statistiques que vous avez créé sur dbo.FactSales." } }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Fabric Data Warehouse creates missing statistics synchronously at query time and refreshes stale ones automatically, and that time is included in the duration of the query that triggered it. Only single-column histogram statistics can be created manually; multi-column statistics are not supported. User-defined statistics can be refreshed with UPDATE STATISTICS ... WITH FULLSCAN, which is recommended after large loads.
    fr: |
      Fabric Data Warehouse crée les statistiques manquantes de manière synchrone au moment de la requête et actualise automatiquement les statistiques obsolètes ; ce temps est inclus dans la durée de la requête qui l'a déclenché. Seules des statistiques d'histogramme sur une seule colonne peuvent être créées manuellement : les statistiques multicolonnes ne sont pas prises en charge. Les statistiques définies par l'utilisateur peuvent être actualisées avec UPDATE STATISTICS ... WITH FULLSCAN, ce qui est recommandé après des chargements volumineux.
references:
  - title: Statistics
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/statistics
