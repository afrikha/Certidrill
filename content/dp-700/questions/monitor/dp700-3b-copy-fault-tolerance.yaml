id: dp700-3b-copy-fault-tolerance
objective: "3.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_CRM and a pipeline named PL_Customers.

    PL_Customers contains a Copy data activity named Copy Customers that copies a daily CSV file to a table in LH_CRM. Each day, a few rows contain values that can't be converted to the data types of the destination table, and Copy Customers fails.

    You need Copy Customers to load all the other rows. You also need a record of the skipped rows so that the data owners can review them.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_CRM et un pipeline nommé PL_Customers.

    PL_Customers contient une activité Copy data nommée Copy Customers qui copie un fichier CSV quotidien vers une table de LH_CRM. Chaque jour, quelques lignes contiennent des valeurs impossibles à convertir dans les types de données de la table de destination, et Copy Customers échoue.

    Vous devez faire en sorte que Copy Customers charge toutes les autres lignes. Vous avez aussi besoin d'une trace des lignes ignorées pour que les propriétaires des données puissent les examiner.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the Settings tab of Copy Customers, select Enable staging.", fr: "Dans l'onglet Settings de Copy Customers, sélectionner Enable staging." } }
    - { id: b, text: { en: "In the Settings tab of Copy Customers, select Fault tolerance.", fr: "Dans l'onglet Settings de Copy Customers, sélectionner Fault tolerance." } }
    - { id: c, text: { en: "In the General settings of Copy Customers, set Retry to 3.", fr: "Dans les paramètres General de Copy Customers, définir Retry sur 3." } }
    - { id: d, text: { en: "In the Settings tab of Copy Customers, select Enable logging.", fr: "Dans l'onglet Settings de Copy Customers, sélectionner Enable logging." } }
    - { id: e, text: { en: "In the General settings of Copy Customers, select Secure output.", fr: "Dans les paramètres General de Copy Customers, sélectionner Secure output." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Fault tolerance lets the copy activity ignore errors such as rows that are incompatible between the source and the destination, so the other rows are loaded. Enable logging records the copied and skipped files and rows, which gives the data owners the list of rejected rows."
    fr: "Fault tolerance permet à l'activité de copie d'ignorer des erreurs comme les lignes incompatibles entre la source et la destination : les autres lignes sont chargées. Enable logging journalise les fichiers et lignes copiés et ignorés, ce qui donne aux propriétaires des données la liste des lignes rejetées."
  options:
    a: { en: "Staging copies the data through an interim store; the incompatible rows would still make the activity fail.", fr: "Le staging fait transiter les données par un magasin intermédiaire ; les lignes incompatibles feraient toujours échouer l'activité." }
    c: { en: "The error isn't transient: each retry meets the same rows and fails again.", fr: "L'erreur n'est pas temporaire : chaque nouvelle tentative rencontre les mêmes lignes et échoue à nouveau." }
    e: { en: "Secure output hides the activity output from the logs; it neither skips rows nor records them.", fr: "Secure output masque la sortie de l'activité dans les journaux ; il n'ignore pas de lignes et ne les consigne pas." }
references:
  - title: How to copy data using copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-data-activity
