id: dp700-3a-spark-run-locations
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You have a Spark job definition named SJD_Aggregate that aggregates sales data in a lakehouse. SJD_Aggregate runs every night on a schedule.

    You need to review the Spark jobs, the stages and the executor usage of last night's run of SJD_Aggregate.

    From which two places can you open the Spark application detail page of the run? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une définition de tâche Spark nommée SJD_Aggregate qui agrège des données de ventes dans un lakehouse. SJD_Aggregate s'exécute chaque nuit selon une planification.

    Vous devez examiner les travaux Spark, les étapes et l'utilisation des exécuteurs de l'exécution de la nuit dernière de SJD_Aggregate.

    Depuis quels deux emplacements pouvez-vous ouvrir la page de détail de l'application Spark de l'exécution ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Capacity and cost page of the Monitor hub", fr: "La page Capacity and cost du hub de surveillance" } }
    - { id: b, text: { en: "The Monitor hub list of runs, by selecting the run of SJD_Aggregate", fr: "La liste des exécutions du hub de surveillance, en sélectionnant l'exécution de SJD_Aggregate" } }
    - { id: c, text: { en: "The queryinsights views of the lakehouse SQL analytics endpoint", fr: "Les vues queryinsights du point de terminaison d'analytique SQL du lakehouse" } }
    - { id: d, text: { en: "The Recent runs pane of SJD_Aggregate, by selecting the run", fr: "Le volet Recent runs de SJD_Aggregate, en sélectionnant l'exécution" } }
    - { id: e, text: { en: "The Data insights tab of the lakehouse", fr: "L'onglet Data insights du lakehouse" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The Spark application detail page opens from the Monitor hub or from the Recent runs panel of the notebook or Spark job definition. It shows the Jobs, Resources, Logs, Data, Item snapshots and Diagnostics tabs.
    fr: |
      La page de détail de l'application Spark s'ouvre depuis le hub de surveillance ou depuis le volet Recent runs du notebook ou de la définition de tâche Spark. Elle propose les onglets Jobs, Resources, Logs, Data, Item snapshots et Diagnostics.
  options:
    a:
      en: |
        Capacity and cost monitors capacity health and consumption, not the details of a Spark application.
      fr: |
        Capacity and cost surveille l'état et la consommation de la capacité, pas le détail d'une application Spark.
    c:
      en: |
        Query insights records T-SQL queries run against the SQL analytics endpoint, not Spark jobs.
      fr: |
        Query insights enregistre les requêtes T-SQL exécutées sur le point de terminaison d'analytique SQL, pas les travaux Spark.
    e:
      en: |
        Data insights is a monitoring tab of the eventstream editor; lakehouses don't have it.
      fr: |
        Data insights est un onglet de supervision de l'éditeur de flux d'événements ; les lakehouses ne l'ont pas.
references:
  - title: Apache Spark application detail monitoring
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-detail-monitoring
