id: dp700-3b-dataflow-warehouse-settings
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a warehouse named DW1 and a Dataflow Gen2 named DF_Budget. DF_Budget contains a query named Budget.

    You add DW1 as the data destination of Budget, and the editor displays a warning about the destination. You need to resolve the warning and meet the following requirements:

    - Each refresh must overwrite all the rows of the destination table.
    - The table must never be dropped, because views in DW1 reference it.

    How should you configure Budget? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un entrepôt nommé DW1 et un Dataflow Gen2 nommé DF_Budget. DF_Budget contient une requête nommée Budget.

    Vous ajoutez DW1 comme destination de données de Budget, et l'éditeur affiche un avertissement sur la destination. Vous devez résoudre l'avertissement et satisfaire les exigences suivantes :

    - Chaque actualisation doit remplacer toutes les lignes de la table de destination.
    - La table ne doit jamais être supprimée, car des vues de DW1 la référencent.

    Comment devez-vous configurer Budget ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Query setting: [[stg]]

      Destination settings: [[dest]]
    fr: |
      Paramètre de la requête : [[stg]]

      Paramètres de la destination : [[dest]]
  slots:
    - id: stg
      options:
        - { id: disable, text: { en: "Disable staging", fr: "Désactiver le staging" } }
        - { id: enable, text: { en: "Enable staging", fr: "Activer le staging" } }
        - { id: auto, text: { en: "Turn on Use automatic settings", fr: "Activer Use automatic settings" } }
    - id: dest
      options:
        - { id: append, text: { en: "Update method Append", fr: "Méthode de mise à jour Append" } }
        - { id: dynamic, text: { en: "Update method Replace with Dynamic schema", fr: "Méthode de mise à jour Replace avec Dynamic schema" } }
        - { id: fixed, text: { en: "Update method Replace with Fixed schema", fr: "Méthode de mise à jour Replace avec Fixed schema" } }
answer:
  values: { stg: enable, dest: fixed }
explanation:
  correct:
    en: |
      Loading into a warehouse requires staging before the write, and the editor warns when staging is off for a query that targets a warehouse. Replace overwrites the data at each refresh, and Fixed schema replaces only the rows without dropping the table, which is also the only schema option a warehouse destination supports.
    fr: |
      Le chargement dans un entrepôt nécessite le staging avant l'écriture, et l'éditeur affiche un avertissement quand le staging est désactivé pour une requête qui cible un entrepôt. Replace remplace les données à chaque actualisation, et Fixed schema ne remplace que les lignes sans supprimer la table ; c'est aussi la seule option de schéma prise en charge par une destination entrepôt.
  options:
    disable: { en: "Without staging, the warehouse destination keeps showing the warning and can't be loaded.", fr: "Sans staging, la destination entrepôt affiche toujours l'avertissement et ne peut pas être chargée." }
    auto: { en: "Automatic settings are supported for lakehouse, Azure SQL Database and Snowflake destinations, and they drop and recreate the table.", fr: "Les paramètres automatiques sont pris en charge pour les destinations lakehouse, Azure SQL Database et Snowflake, et ils suppriment puis recréent la table." }
    append: { en: "Append adds rows at each refresh instead of overwriting them.", fr: "Append ajoute des lignes à chaque actualisation au lieu de les remplacer." }
    dynamic: { en: "Dynamic schema can drop and recreate the table, and a warehouse destination supports only Fixed schema.", fr: "Dynamic schema peut supprimer puis recréer la table, et une destination entrepôt ne prend en charge que Fixed schema." }
references:
  - title: Dataflow Gen2 data destinations and managed settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-and-managed-settings
