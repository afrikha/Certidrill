id: dp700-3d-warehouse-query-design
objective: "3.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW3 that contains the following tables:

    - FactOrders: 2 billion rows and 45 columns. The CustomerKey column is varchar(20) and contains whole numbers.
    - DimCustomer: 3 million rows. The CustomerKey column is int.

    A report runs the following query, which is slow even when the data is already cached:

    ```sql
    SELECT *
    FROM dbo.FactOrders AS f
    JOIN dbo.DimCustomer AS c ON CAST(f.CustomerKey AS int) = c.CustomerKey
    WHERE c.Country = 'France';
    ```

    The report only displays OrderDate, Amount and CustomerName. You need to reduce the resources used by the query.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW3 qui contient les tables suivantes :

    - FactOrders : 2 milliards de lignes et 45 colonnes. La colonne CustomerKey est de type varchar(20) et contient des nombres entiers.
    - DimCustomer : 3 millions de lignes. La colonne CustomerKey est de type int.

    Un rapport exécute la requête suivante, qui est lente même quand les données sont déjà en cache :

    ```sql
    SELECT *
    FROM dbo.FactOrders AS f
    JOIN dbo.DimCustomer AS c ON CAST(f.CustomerKey AS int) = c.CustomerKey
    WHERE c.Country = 'France';
    ```

    Le rapport n'affiche que OrderDate, Amount et CustomerName. Vous devez réduire les ressources utilisées par la requête.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run OPTIMIZE and VACUUM on FactOrders.", fr: "Exécuter OPTIMIZE et VACUUM sur FactOrders." } }
    - { id: b, text: { en: "Change CustomerKey of DimCustomer to varchar(8000).", fr: "Changer CustomerKey de DimCustomer en varchar(8000)." } }
    - { id: c, text: { en: "Replace SELECT * with the three columns that the report displays.", fr: "Remplacer SELECT * par les trois colonnes affichées par le rapport." } }
    - { id: d, text: { en: "Disable V-Order on DW3.", fr: "Désactiver V-Order sur DW3." } }
    - { id: e, text: { en: "Recreate FactOrders by using CTAS so that CustomerKey is an int column.", fr: "Recréer FactOrders avec CTAS pour que CustomerKey soit une colonne int." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Selecting only the needed columns reduces the data read from a columnar table with 45 columns, because SELECT * is costly. Columns compared in JOIN predicates should have the same data type: storing CustomerKey as int in FactOrders removes the explicit conversion of 2 billion values and lets the join compare integers directly."
    fr: "Sélectionner uniquement les colonnes nécessaires réduit les données lues dans une table en colonnes de 45 colonnes, car SELECT * est coûteux. Les colonnes comparées dans les prédicats JOIN doivent avoir le même type de données : stocker CustomerKey en int dans FactOrders supprime la conversion explicite de 2 milliards de valeurs et permet à la jointure de comparer directement des entiers."
  options:
    a: { en: "OPTIMIZE and VACUUM are Spark commands for lakehouse Delta tables; the warehouse compacts its files automatically.", fr: "OPTIMIZE et VACUUM sont des commandes Spark pour les tables Delta d'un lakehouse ; l'entrepôt compacte ses fichiers automatiquement." }
    d: { en: "V-Order improves reads; disabling it is irreversible and only suits write-intensive warehouses.", fr: "V-Order améliore les lectures ; le désactiver est irréversible et ne convient qu'aux entrepôts très sollicités en écriture." }
    b: { en: "Joining on a varchar(8000) column is more expensive than an integer comparison and goes against using the smallest type that fits.", fr: "Joindre sur une colonne varchar(8000) coûte plus cher qu'une comparaison d'entiers et va à l'encontre de l'utilisation du plus petit type adapté." }
references:
  - title: Performance guidelines in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
