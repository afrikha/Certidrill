id: dp700-cs3c-table-maintenance
objective: "3.3.1"
type: yesno_statements
caseStudy: dp700-cs3c-tailspin
difficulty: 2
status: draft
stem:
  en: |
    To meet the performance requirement for fact_sales, the data engineers plan to run table maintenance on fact_sales from the Lakehouse explorer, with compaction (V-Order selected) and VACUUM. They also plan to set the table property delta.parquet.vorder.enabled to true. No Spark property has been changed in the environment of WS-Sales.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour respecter l'exigence de performances relative à fact_sales, les ingénieurs données prévoient d'exécuter la maintenance de table sur fact_sales depuis l'explorateur Lakehouse, avec le compactage (V-Order sélectionné) et VACUUM. Ils prévoient aussi de définir la propriété de table delta.parquet.vorder.enabled sur true. Aucune propriété Spark n'a été modifiée dans l'environnement de WS-Sales.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The compaction step reduces the number of small Parquet files in fact_sales.
        fr: |
          L'étape de compactage réduit le nombre de petits fichiers Parquet de fact_sales.
    - id: s2
      text:
        en: |
          The data engineers can set a VACUUM retention of two days in the maintenance dialog, and the request succeeds.
        fr: |
          Les ingénieurs données peuvent définir une rétention VACUUM de deux jours dans la boîte de dialogue de maintenance, et la demande aboutit.
    - id: s3
      text:
        en: |
          Setting delta.parquet.vorder.enabled to true rewrites the existing Parquet files of fact_sales with V-Order.
        fr: |
          Définir delta.parquet.vorder.enabled sur true réécrit les fichiers Parquet existants de fact_sales avec V-Order.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Compaction (OPTIMIZE) merges small Parquet files into larger ones, which speeds up reads. Maintenance requests with a retention under seven days fail by default; you must first set spark.databricks.delta.retentionDurationCheck.enabled to false in the environment, and a shorter retention reduces time travel history. The V-Order table property applies only to future writes; existing files keep their layout until they are rewritten, for example by compaction with V-Order.
    fr: |
      Le compactage (OPTIMIZE) fusionne les petits fichiers Parquet en fichiers plus grands, ce qui accélère les lectures. Les demandes de maintenance avec une rétention inférieure à sept jours échouent par défaut ; il faut d'abord définir spark.databricks.delta.retentionDurationCheck.enabled sur false dans l'environnement, et une rétention plus courte réduit l'historique de voyage dans le temps. La propriété de table V-Order ne s'applique qu'aux écritures futures ; les fichiers existants gardent leur disposition jusqu'à leur réécriture, par exemple par un compactage avec V-Order.
references:
  - title: Run Delta table maintenance in lakehouse
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-table-maintenance
  - title: Optimize Delta Lake tables with V-order
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/delta-optimization-and-v-order
