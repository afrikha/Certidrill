id: dp700-3c-add-clustering
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW_Logistics that contains a table named dbo.Deliveries. dbo.Deliveries has 3 billion rows and was created without data clustering.

    Most queries on dbo.Deliveries filter on a range of DeliveryDate values, and they scan almost all the files of the table.

    You need to store the rows of dbo.Deliveries clustered on DeliveryDate.

    What should you do?
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW_Logistics qui contient une table nommée dbo.Deliveries. dbo.Deliveries contient 3 milliards de lignes et a été créée sans clustering des données.

    La plupart des requêtes sur dbo.Deliveries filtrent sur une plage de valeurs de DeliveryDate, et elles analysent presque tous les fichiers de la table.

    Les lignes de dbo.Deliveries doivent être stockées avec un clustering sur DeliveryDate.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run ALTER TABLE dbo.Deliveries with a CLUSTER BY (DeliveryDate) option.", fr: "Exécuter ALTER TABLE dbo.Deliveries avec une option CLUSTER BY (DeliveryDate)." } }
    - { id: b, text: { en: "Run SELECT ... INTO a new table with the CLUSTER BY (DeliveryDate) option.", fr: "Exécuter SELECT ... INTO vers une nouvelle table avec l'option CLUSTER BY (DeliveryDate)." } }
    - { id: c, text: { en: "Create a new table with CTAS and WITH (CLUSTER BY (DeliveryDate)), and use it instead of dbo.Deliveries.", fr: "Créer une nouvelle table par CTAS avec WITH (CLUSTER BY (DeliveryDate)), et l'utiliser à la place de dbo.Deliveries." } }
    - { id: d, text: { en: "Run OPTIMIZE dbo.Deliveries ZORDER BY (DeliveryDate) from a notebook.", fr: "Exécuter OPTIMIZE dbo.Deliveries ZORDER BY (DeliveryDate) depuis un notebook." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Data clustering is defined when a table is created, with CREATE TABLE or CTAS and the WITH (CLUSTER BY (...)) option. It cannot be added to an existing table or changed later, so you create a clustered copy of the table with CTAS; the rows are clustered during ingestion, and range filters on DeliveryDate can then skip files.
    fr: |
      Le clustering des données est défini à la création d'une table, avec CREATE TABLE ou CTAS et l'option WITH (CLUSTER BY (...)). Il ne peut pas être ajouté à une table existante ni modifié ensuite : vous créez donc une copie clusterisée de la table par CTAS ; les lignes sont regroupées pendant l'ingestion, et les filtres de plage sur DeliveryDate peuvent alors ignorer des fichiers.
  options:
    a:
      en: |
        An existing table cannot be converted to a clustered table, and its clustering columns cannot be modified.
      fr: |
        Une table existante ne peut pas être convertie en table clusterisée, et ses colonnes de clustering ne peuvent pas être modifiées.
    b:
      en: |
        SELECT INTO is not supported for creating clustered tables.
      fr: |
        SELECT INTO n'est pas pris en charge pour créer des tables clusterisées.
    d:
      en: |
        OPTIMIZE and Z-Order apply to lakehouse Delta tables written by Spark, not to warehouse tables.
      fr: |
        OPTIMIZE et le Z-Order s'appliquent aux tables Delta de lakehouse écrites par Spark, pas aux tables d'entrepôt.
references:
  - title: Data clustering in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-clustering
