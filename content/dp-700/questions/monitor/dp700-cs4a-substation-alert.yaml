id: dp700-cs4a-substation-alert
objective: "3.1.4"
type: single
caseStudy: dp700-cs4a-city-power
difficulty: 2
status: draft
stem:
  en: |
    You create an Activator rule on the ES-Meters stream to meet the alerting requirement. The rule monitors objects identified by SubstationId and sends a Teams message.

    Which condition should you configure for the rule?
  fr: |
    Vous créez une règle Activator sur le flux ES-Meters pour satisfaire l'exigence d'alerte. La règle surveille des objets identifiés par SubstationId et envoie un message Teams.

    Quelle condition devez-vous configurer pour la règle ?
body:
  options:
    - { id: a, text: { en: "Is less than 1 on BusVoltage, with the occurrence When it has been true for 10 minutes", fr: "Is less than 1 sur BusVoltage, avec l'occurrence When it has been true for 10 minutes" } }
    - { id: b, text: { en: "Object first appearance, with SubstationId as the object ID", fr: "Object first appearance, avec SubstationId comme ID d'objet" } }
    - { id: c, text: { en: "No presence of data, with a duration of 10 minutes", fr: "No presence of data, avec une durée de 10 minutes" } }
    - { id: d, text: { en: "Changes on SentAt, with the occurrence When it has been true for 10 minutes", fr: "Changes sur SentAt, avec l'occurrence When it has been true for 10 minutes" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The No presence of data heartbeat condition activates when no new event arrives for an object within the specified time. Because the rule tracks objects by SubstationId, each substation that stays silent for 10 minutes triggers its own Teams message.
    fr: |
      La condition de pulsation No presence of data se déclenche quand aucun nouvel événement n'arrive pour un objet dans le délai indiqué. Comme la règle suit les objets par SubstationId, chaque poste électrique silencieux pendant 10 minutes déclenche son propre message Teams.
  options:
    a:
      en: |
        A state condition is evaluated on incoming events. A substation that sends no reading produces no event, so a BusVoltage condition never becomes true for it.
      fr: |
        Une condition d'état est évaluée sur les événements reçus. Un poste électrique qui n'envoie aucun relevé ne produit aucun événement : une condition sur BusVoltage ne devient donc jamais vraie pour lui.
    b:
      en: |
        Object first appearance activates the first time an object ID appears in the stream, not when it stops sending data.
      fr: |
        Object first appearance se déclenche la première fois qu'un ID d'objet apparaît dans le flux, pas quand il cesse d'envoyer des données.
    d:
      en: |
        Changes activates when a value changes in an incoming event; it cannot detect the absence of events.
      fr: |
        Changes se déclenche quand une valeur change dans un événement reçu ; il ne peut pas détecter l'absence d'événements.
references:
  - title: Detection settings in Activator
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-detection-conditions
