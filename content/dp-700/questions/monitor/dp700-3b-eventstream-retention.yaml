id: dp700-3b-eventstream-retention
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventstream named ES_Sales. ES_Sales uses the default settings and has an Azure Event Hubs source and a lakehouse destination.

    During a three-day maintenance, the lakehouse destination was deactivated. When you reactivated it with the When streaming was last stopped option, only the events of the last day of the maintenance were written to the lakehouse.

    Future maintenance windows can last up to five days. You need to ensure that no events are lost during these windows.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventstream nommé ES_Sales. ES_Sales utilise les paramètres par défaut et possède une source Azure Event Hubs et une destination lakehouse.

    Pendant une maintenance de trois jours, la destination lakehouse a été désactivée. Quand vous l'avez réactivée avec l'option When streaming was last stopped, seuls les événements du dernier jour de la maintenance ont été écrits dans le lakehouse.

    Les prochaines fenêtres de maintenance peuvent durer jusqu'à cinq jours. Vous devez faire en sorte qu'aucun événement ne soit perdu pendant ces fenêtres.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the Retention setting of ES_Sales to 7 days", fr: "Définir le paramètre Retention d'ES_Sales sur 7 jours" } }
    - { id: b, text: { en: "Set the Event throughput setting of ES_Sales to High", fr: "Définir le paramètre Event throughput d'ES_Sales sur High" } }
    - { id: c, text: { en: "Reactivate the destination with the Custom time option instead", fr: "Réactiver plutôt la destination avec l'option Custom time" } }
    - { id: d, text: { en: "Set the Maximum duration of the lakehouse destination to 2 hours", fr: "Définir Maximum duration de la destination lakehouse sur 2 heures" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An eventstream keeps events for its retention period, one day by default and up to 90 days. An event becomes unavailable once that period has passed since it was accepted, so after three days only the last day was still there. A retention longer than the maintenance window, such as 7 days, keeps the events until the destination is reactivated.
    fr: |
      Un eventstream conserve les événements pendant sa période de rétention, un jour par défaut et jusqu'à 90 jours. Un événement devient indisponible une fois cette période écoulée depuis son acceptation : au bout de trois jours, seul le dernier jour était encore disponible. Une rétention plus longue que la fenêtre de maintenance, par exemple 7 jours, conserve les événements jusqu'à la réactivation de la destination.
  options:
    b: { en: "Throughput sizes the event processing; it doesn't keep events longer.", fr: "Le débit dimensionne le traitement des événements ; il ne conserve pas les événements plus longtemps." }
    c: { en: "Custom time can only replay events that are still within the retention period.", fr: "Custom time ne peut rejouer que les événements encore compris dans la période de rétention." }
    d: { en: "Maximum duration controls how long rows are batched into a file, not how long events are kept.", fr: "Maximum duration contrôle la durée de regroupement des lignes dans un fichier, pas la durée de conservation des événements." }
references:
  - title: Configure Settings for a Fabric Eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/configure-settings
  - title: Pause and resume data streams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/pause-resume-data-streams
