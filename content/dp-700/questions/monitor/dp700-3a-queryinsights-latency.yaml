id: dp700-3a-queryinsights-latency
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a warehouse named DW_Sales. You have the Contributor role on the workspace. Five minutes ago, you ran a MERGE statement that transforms the staging data of DW_Sales into a fact table, and the statement completed successfully.

    You query `queryinsights.exec_requests_history` in DW_Sales, but the MERGE statement doesn't appear.

    What is the most likely reason?
  fr: |
    Vous disposez d'un entrepôt nommé DW_Sales. Vous avez le rôle Contributor sur l'espace de travail. Il y a cinq minutes, vous avez exécuté une instruction MERGE qui transforme les données de transit de DW_Sales dans une table de faits, et l'instruction s'est terminée avec succès.

    Vous interrogez `queryinsights.exec_requests_history` dans DW_Sales, mais l'instruction MERGE n'apparaît pas.

    Quelle est la raison la plus probable ?
body:
  options:
    - { id: a, text: { en: "Only the Admin role can see the requests of other users and your own", fr: "Seul le rôle Admin peut voir les requêtes des autres utilisateurs et les vôtres" } }
    - { id: b, text: { en: "A completed query can take up to 15 minutes to appear in the view", fr: "Une requête terminée peut mettre jusqu'à 15 minutes à apparaître dans la vue" } }
    - { id: c, text: { en: "The view records only SELECT statements, not data modification statements", fr: "La vue n'enregistre que les instructions SELECT, pas les instructions de modification de données" } }
    - { id: d, text: { en: "The view keeps the history of the current session only", fr: "La vue ne conserve que l'historique de la session courante" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Query insights stores completed requests run in a user's context, but they can take up to 15 minutes to appear, and the delay grows with the number of concurrent queries. Contributor is enough to use the views, and the history is kept for 30 days.
    fr: |
      Query insights stocke les requêtes terminées exécutées dans le contexte d'un utilisateur, mais elles peuvent mettre jusqu'à 15 minutes à apparaître, et le délai augmente avec le nombre de requêtes simultanées. Le rôle Contributor suffit pour utiliser les vues, et l'historique est conservé 30 jours.
  options:
    a:
      en: |
        Contributor or higher can use the query insights views; Admin, Member and Contributor can see the complete query text.
      fr: |
        Contributor ou supérieur peut utiliser les vues Query insights ; Admin, Member et Contributor peuvent voir le texte complet des requêtes.
    c:
      en: |
        exec_requests_history records every completed request run by users, including data modification statements such as MERGE.
      fr: |
        exec_requests_history enregistre toutes les requêtes terminées exécutées par les utilisateurs, y compris les instructions de modification de données comme MERGE.
    d:
      en: |
        The history is kept for 30 days across sessions; completed sessions are also listed in exec_sessions_history.
      fr: |
        L'historique est conservé 30 jours, toutes sessions confondues ; les sessions terminées sont aussi listées dans exec_sessions_history.
references:
  - title: Query insights in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights
