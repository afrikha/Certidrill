id: dp700-sr2-small-files-3
objective: "3.3.1"
type: series_yesno
series: dp700-sr2-small-files
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You run VACUUM on the table with the default retention.
  fr: Vous exécutez VACUUM sur la table avec la rétention par défaut.
body:
  solution:
    en: |
      You run `VACUUM device_events` with the default retention threshold.
    fr: |
      Vous exécutez `VACUUM device_events` avec le seuil de rétention par défaut.
answer: { value: false }
explanation:
  correct:
    en: |
      `VACUUM` deletes only the files that the Delta log no longer references and that are older than the retention threshold, seven days by default. The small files of the current table version are still referenced, so they stay as they are; nothing is compacted.
    fr: |
      `VACUUM` supprime uniquement les fichiers que le journal Delta ne référence plus et qui sont plus anciens que le seuil de rétention, sept jours par défaut. Les petits fichiers de la version actuelle de la table sont toujours référencés : ils restent tels quels et rien n'est compacté.
references:
  - title: Run Delta table maintenance in lakehouse
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-table-maintenance
