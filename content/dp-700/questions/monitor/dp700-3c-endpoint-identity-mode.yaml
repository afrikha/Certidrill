id: dp700-3c-endpoint-identity-mode
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named WS_HR that contains a lakehouse named LH_People. The employees table of LH_People has a OneLake security role that filters rows by country.

    You have a second workspace named WS_Analytics that contains a lakehouse named LH_Reporting. LH_Reporting has a shortcut named employees in its Tables folder that targets the employees table of LH_People. The SQL analytics endpoint of LH_Reporting uses its default settings.

    Analysts who are members of the OneLake security role can read the employees shortcut from a notebook. Every T-SQL query on dbo.employees through the SQL analytics endpoint of LH_Reporting fails, even for analysts who have the SELECT permission on the table.

    You need the analysts to query dbo.employees from the SQL analytics endpoint and see only the rows that the OneLake security role allows.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS_HR qui contient un lakehouse nommé LH_People. La table employees de LH_People possède un rôle de sécurité OneLake qui filtre les lignes par pays.

    Vous disposez d'un second espace de travail nommé WS_Analytics qui contient un lakehouse nommé LH_Reporting. LH_Reporting possède dans son dossier Tables un raccourci nommé employees qui cible la table employees de LH_People. Le point de terminaison d'analytique SQL de LH_Reporting utilise ses paramètres par défaut.

    Les analystes membres du rôle de sécurité OneLake peuvent lire le raccourci employees depuis un notebook. Toutes les requêtes T-SQL sur dbo.employees par le point de terminaison d'analytique SQL de LH_Reporting échouent, même pour les analystes qui ont l'autorisation SELECT sur la table.

    Les analystes doivent pouvoir interroger dbo.employees depuis le point de terminaison d'analytique SQL et ne voir que les lignes autorisées par le rôle de sécurité OneLake.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant the owner of LH_Reporting unrestricted read access to the employees table of LH_People.", fr: "Accorder au propriétaire de LH_Reporting un accès en lecture sans restriction à la table employees de LH_People." } }
    - { id: b, text: { en: "Switch the SQL analytics endpoint of LH_Reporting to User's identity access mode.", fr: "Faire passer le point de terminaison d'analytique SQL de LH_Reporting en mode User's identity access mode." } }
    - { id: c, text: { en: "Recreate the shortcut with delegated authentication by using the identity of an analyst.", fr: "Recréer le raccourci avec une authentification déléguée en utilisant l'identité d'un analyste." } }
    - { id: d, text: { en: "Create a security policy with a filter predicate on dbo.employees in the SQL analytics endpoint.", fr: "Créer une stratégie de sécurité avec un prédicat de filtre sur dbo.employees dans le point de terminaison d'analytique SQL." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A new SQL analytics endpoint uses Delegated identity access mode: it reads OneLake with the identity of the item owner, and it blocks access to a shortcut whose source table has OneLake row-level or column-level security. In User's identity access mode, the endpoint passes the signed-in user's identity to OneLake, so each analyst gets the rows allowed by the OneLake security role. An Admin or Member of the workspace switches the mode on the Security tab of the endpoint.
    fr: |
      Un nouveau point de terminaison d'analytique SQL utilise le mode Delegated identity access mode : il lit OneLake avec l'identité du propriétaire de l'élément et bloque l'accès à un raccourci dont la table source a une sécurité au niveau des lignes ou des colonnes OneLake. En mode User's identity access mode, le point de terminaison transmet à OneLake l'identité de l'utilisateur connecté : chaque analyste obtient les lignes autorisées par le rôle de sécurité OneLake. Un Admin ou un Member de l'espace de travail change le mode dans l'onglet Security du point de terminaison.
  options:
    a:
      en: |
        Unrestricted owner access could make the delegated queries run, but every analyst would then read through the owner's identity and the country filter of the OneLake role would not apply.
      fr: |
        Un accès sans restriction du propriétaire pourrait faire fonctionner les requêtes déléguées, mais chaque analyste lirait alors avec l'identité du propriétaire, et le filtre par pays du rôle OneLake ne s'appliquerait pas.
    c:
      en: |
        A delegated shortcut would read every row with one analyst's access for all users, and the endpoint would still read it with the owner's identity.
      fr: |
        Un raccourci délégué lirait chaque ligne avec l'accès d'un seul analyste pour tous les utilisateurs, et le point de terminaison le lirait toujours avec l'identité du propriétaire.
    d:
      en: |
        SQL row-level security filters rows the endpoint can already read. It does not lift the block on a shortcut whose source has OneLake security, and it would duplicate the existing role.
      fr: |
        La sécurité au niveau des lignes SQL filtre les lignes que le point de terminaison peut déjà lire. Elle ne lève pas le blocage d'un raccourci dont la source a une sécurité OneLake, et elle dupliquerait le rôle existant.
references:
  - title: OneLake Security for SQL analytics endpoints
    url: https://learn.microsoft.com/en-us/fabric/onelake/sql-analytics-endpoint-onelake-security
  - title: Secure and manage OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcut-security
