id: dp700-3a-schedule-failure-email
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a pipeline named PL_Nightly that runs on a schedule at 01:00 every day. PL_Nightly is never run manually.

    You need to ensure that the members of a Microsoft Entra group named Data-Ops receive an email when a scheduled run of PL_Nightly fails. The solution must minimize cost and must not require any change to PL_Nightly.

    What should you configure?
  fr: |
    Contoso dispose d'un pipeline nommé PL_Nightly qui s'exécute selon une planification à 01:00 chaque jour. PL_Nightly n'est jamais exécuté manuellement.

    Vous devez faire en sorte que les membres d'un groupe Microsoft Entra nommé Data-Ops reçoivent un e-mail quand une exécution planifiée de PL_Nightly échoue. La solution doit réduire les coûts et ne doit demander aucune modification de PL_Nightly.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An Activator-based alert rule on PL_Nightly from the Job runs page", fr: "Une règle d'alerte basée sur Activator sur PL_Nightly depuis la page Job runs" } }
    - { id: b, text: { en: "A Teams activity on the failure path of each activity of PL_Nightly", fr: "Une activité Teams sur le chemin d'échec de chaque activité de PL_Nightly" } }
    - { id: c, text: { en: "Workspace monitoring, then a KQL queryset that lists the failed runs of PL_Nightly", fr: "La supervision de l'espace de travail, puis un ensemble de requêtes KQL qui liste les exécutions en échec de PL_Nightly" } }
    - { id: d, text: { en: "A schedule failure email for PL_Nightly in the Alerts page of the Monitor hub", fr: "Un e-mail d'échec de planification pour PL_Nightly dans la page Alerts du hub de surveillance" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Schedule failure emails are free and send an email when a scheduled job fails. You configure them per scheduled item in Monitor > Alerts > Schedule failure emails, and the recipients can be users or groups of the Microsoft Entra tenant. They don't cover manual runs, which PL_Nightly doesn't have.
    fr: |
      Les e-mails d'échec de planification sont gratuits et envoient un e-mail quand une tâche planifiée échoue. Vous les configurez par élément planifié dans Monitor > Alerts > Schedule failure emails, et les destinataires peuvent être des utilisateurs ou des groupes du locataire Microsoft Entra. Ils ne couvrent pas les exécutions manuelles, que PL_Nightly n'a pas.
  options:
    a:
      en: |
        Activator-based alert rules are billed as Activator capacity usage, so they don't minimize cost.
      fr: |
        Les règles d'alerte basées sur Activator sont facturées comme une consommation de capacité Activator : elles ne réduisent pas les coûts.
    b:
      en: |
        Adding activities changes PL_Nightly, which the requirement forbids.
      fr: |
        Ajouter des activités modifie PL_Nightly, ce que l'exigence interdit.
    c:
      en: |
        A KQL queryset lists failures when someone runs it; it doesn't email anyone by itself.
      fr: |
        Un ensemble de requêtes KQL liste les échecs quand quelqu'un l'exécute ; il n'envoie aucun e-mail de lui-même.
references:
  - title: Set up job alerts in the Monitor hub (preview)
    url: https://learn.microsoft.com/en-us/fabric/admin/monitoring-hub-alerts
