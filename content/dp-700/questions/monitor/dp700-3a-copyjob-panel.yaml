id: dp700-3a-copyjob-panel
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a copy job named CJ_ERP that copies 20 tables from an Azure SQL database to a lakehouse named LH_Raw. CJ_ERP uses incremental copy for most tables.

    After each run, you need to check, for each copied table, the rows read and written, the load type and the incremental lower and upper bounds that were used.

    Where should you look?
  fr: |
    Litware dispose d'une tâche de copie (Copy job) nommée CJ_ERP qui copie 20 tables d'une base de données Azure SQL vers un lakehouse nommé LH_Raw. CJ_ERP utilise la copie incrémentielle pour la plupart des tables.

    Après chaque exécution, vous devez vérifier, pour chaque table copiée, les lignes lues et écrites, le type de chargement, ainsi que les bornes incrémentielles inférieure et supérieure utilisées.

    Où devez-vous regarder ?
body:
  options:
    - { id: a, text: { en: "The monitoring panel of CJ_ERP, in the per-table details of the run", fr: "Le panneau de supervision de CJ_ERP, dans le détail par table de l'exécution" } }
    - { id: b, text: { en: "The Capacity and cost page of the Monitor hub, filtered on CJ_ERP", fr: "La page Capacity and cost du hub de surveillance, filtrée sur CJ_ERP" } }
    - { id: c, text: { en: "The queryinsights views of the SQL analytics endpoint of LH_Raw", fr: "Les vues queryinsights du point de terminaison d'analytique SQL de LH_Raw" } }
    - { id: d, text: { en: "The Data insights tab of an eventstream that reads the change feed of the database", fr: "L'onglet Data insights d'un flux d'événements (eventstream) qui lit le flux de modifications de la base de données" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The copy job panel shows job-level metrics for recent runs and, for each copied table, the status, rows and data read and written, duration, throughput, load type (full or incremental) and the incremental lower and upper bounds. Selecting View run history opens earlier runs.
    fr: |
      Le panneau de la tâche de copie montre les métriques des exécutions récentes et, pour chaque table copiée, le statut, les lignes et les données lues et écrites, la durée, le débit, le type de chargement (complet ou incrémentiel) et les bornes incrémentielles inférieure et supérieure. View run history ouvre les exécutions précédentes.
  options:
    b:
      en: |
        Capacity and cost reports capacity consumption, not rows copied or incremental bounds per table.
      fr: |
        Capacity and cost indique la consommation de capacité, pas les lignes copiées ni les bornes incrémentielles par table.
    c:
      en: |
        Query insights records T-SQL queries run against the endpoint by users; it doesn't record the copy job's writes per table.
      fr: |
        Query insights enregistre les requêtes T-SQL exécutées par les utilisateurs sur le point de terminaison ; il n'enregistre pas les écritures de la tâche de copie par table.
    d:
      en: |
        CJ_ERP doesn't use an eventstream; Data insights only shows metrics of eventstream nodes.
      fr: |
        CJ_ERP n'utilise pas de flux d'événements ; Data insights ne montre que les métriques des nœuds d'un flux d'événements.
references:
  - title: How to monitor a Copy job in Data Factory
    url: https://learn.microsoft.com/en-us/fabric/data-factory/monitor-copy-job
