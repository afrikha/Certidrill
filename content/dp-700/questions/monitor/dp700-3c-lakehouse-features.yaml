id: dp700-3c-lakehouse-features
objective: "3.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You manage the Delta tables of a Fabric lakehouse named LH_Fleet. The tables are written by Spark notebooks.

    You need to choose the feature that meets each requirement.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez les tables Delta d'un lakehouse Fabric nommé LH_Fleet. Les tables sont écrites par des notebooks Spark.

    Vous devez choisir la fonctionnalité qui répond à chaque exigence.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vacuum, text: VACUUM }
    - { id: zorder, text: Z-Order }
    - { id: vorder, text: V-Order }
    - { id: fast, text: { en: "Fast optimize", fr: "Optimisation rapide (fast optimize)" } }
    - { id: partition, text: { en: "Partitioning by vehicle_id", fr: "Partitionnement par vehicle_id" } }
    - { id: autocompact, text: { en: "Auto compaction", fr: "Compactage automatique" } }
  targets:
    - id: t_storage
      text: { en: "Reclaim the storage used by data files that the table no longer references", fr: "Libérer le stockage occupé par les fichiers de données que la table ne référence plus" }
    - id: t_skip
      text: { en: "Let queries that filter on vehicle_id, a column with millions of values, skip files", fr: "Permettre aux requêtes qui filtrent sur vehicle_id, une colonne de millions de valeurs, d'ignorer des fichiers" }
    - id: t_pbi
      text: { en: "Improve the read performance of a Direct Lake semantic model on the table", fr: "Améliorer les performances de lecture d'un modèle sémantique Direct Lake sur la table" }
    - id: t_amp
      text: { en: "Reduce write amplification by skipping bins that are unlikely to reach the target size during OPTIMIZE", fr: "Réduire l'amplification d'écriture en ignorant, pendant OPTIMIZE, les groupes peu susceptibles d'atteindre la taille cible" }
answer:
  mapping: { t_storage: vacuum, t_skip: zorder, t_pbi: vorder, t_amp: fast }
explanation:
  correct:
    en: |
      VACUUM deletes unreferenced files older than the retention period to reclaim storage. Z-Order co-locates values of selective filter columns so that whole files are skipped. V-Order optimizes Parquet sorting, encoding and compression for Direct Lake and is recommended when Direct Lake is a primary consumer. Fast optimize skips bins of small files where compaction is unlikely to help, which limits rewrites.
    fr: |
      VACUUM supprime les fichiers non référencés plus anciens que la période de rétention pour libérer du stockage. Le Z-Order regroupe les valeurs des colonnes de filtre sélectives pour que des fichiers entiers soient ignorés. V-Order optimise le tri, l'encodage et la compression Parquet pour Direct Lake et est recommandé quand Direct Lake est un consommateur principal. L'optimisation rapide ignore les groupes de petits fichiers dont le compactage a peu de chances d'être utile, ce qui limite les réécritures.
  options:
    partition:
      en: |
        Partitioning on a high-cardinality column creates a partition per value and many small files.
      fr: |
        Partitionner sur une colonne à cardinalité élevée crée une partition par valeur et de nombreux petits fichiers.
    autocompact:
      en: |
        Auto compaction runs OPTIMIZE after writes when files are fragmented; it does not choose which bins OPTIMIZE skips.
      fr: |
        Le compactage automatique exécute OPTIMIZE après les écritures quand les fichiers sont fragmentés ; il ne choisit pas les groupes qu'OPTIMIZE ignore.
references:
  - title: Table Compaction
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/table-compaction
  - title: Cross-Workload Table Maintenance and Optimization in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/table-maintenance-optimization
