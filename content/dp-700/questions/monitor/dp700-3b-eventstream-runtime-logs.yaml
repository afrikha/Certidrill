id: dp700-3b-eventstream-runtime-logs
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventstream named ES_Orders. ES_Orders has an Azure Event Hubs source and a lakehouse destination.

    The lakehouse destination node displays the Warning status. You need to read the detailed warning and error messages reported for this node.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventstream nommé ES_Orders. ES_Orders possède une source Azure Event Hubs et une destination lakehouse.

    Le nœud de destination lakehouse affiche le statut Warning. Vous devez lire les messages d'avertissement et d'erreur détaillés signalés pour ce nœud.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Select the destination node, open the Data insights tab, and review the Runtime errors metric", fr: "Sélectionner le nœud de destination, ouvrir l'onglet Data insights et examiner la métrique Runtime errors" } }
    - { id: b, text: { en: "Select the destination node, open the Runtime logs tab, and filter the list by severity", fr: "Sélectionner le nœud de destination, ouvrir l'onglet Runtime logs et filtrer la liste par gravité" } }
    - { id: c, text: { en: "Open the Settings of ES_Orders and review the Event throughput setting", fr: "Ouvrir les paramètres (Settings) d'ES_Orders et examiner le paramètre Event throughput" } }
    - { id: d, text: { en: "Open the lakehouse and review the history of the destination Delta table", fr: "Ouvrir le lakehouse et examiner l'historique de la table Delta de destination" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Runtime logs tab of a node lists its log entries with three severity levels: warning, error and information. You can filter by severity or type, search by keyword, and refresh to see the latest entries, which gives the detailed messages behind the Warning status.
    fr: |
      L'onglet Runtime logs d'un nœud liste ses entrées de journal avec trois niveaux de gravité : warning, error et information. Vous pouvez filtrer par gravité ou par type, rechercher par mot-clé et actualiser pour voir les dernières entrées, ce qui donne les messages détaillés derrière le statut Warning.
  options:
    a: { en: "Data insights shows metrics such as the count of runtime errors, not the messages themselves.", fr: "Data insights affiche des métriques comme le nombre d'erreurs d'exécution, pas les messages eux-mêmes." }
    c: { en: "The throughput setting is a configuration value; it doesn't contain error messages.", fr: "Le paramètre de débit est une valeur de configuration ; il ne contient pas de messages d'erreur." }
    d: { en: "The Delta table history records the writes that succeeded, not the warnings of the eventstream node.", fr: "L'historique de la table Delta enregistre les écritures réussies, pas les avertissements du nœud de l'eventstream." }
references:
  - title: Monitor the Status and Performance of an Eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor
