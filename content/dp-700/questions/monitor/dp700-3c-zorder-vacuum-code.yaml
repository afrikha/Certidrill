id: dp700-3c-zorder-vacuum-code
objective: "3.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric lakehouse that contains a Delta table named gold.fact_orders. Most queries on gold.fact_orders filter on customer_id, a column that has millions of distinct values. The table contains many small files and old files that are no longer referenced.

    You need to write Spark SQL code that meets the following requirements:

    - Compact the small files and co-locate rows that have the same customer_id values.
    - Remove the unreferenced files that are older than seven days.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric qui contient une table Delta nommée gold.fact_orders. La plupart des requêtes sur gold.fact_orders filtrent sur customer_id, une colonne qui compte des millions de valeurs distinctes. La table contient de nombreux petits fichiers et d'anciens fichiers qui ne sont plus référencés.

    Vous devez écrire un code Spark SQL qui satisfait les exigences suivantes :

    - Compacter les petits fichiers et regrouper les lignes qui ont les mêmes valeurs de customer_id.
    - Supprimer les fichiers non référencés de plus de sept jours.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    [[cmd1]] gold.fact_orders [[clause]] (customer_id);
    [[cmd2]] gold.fact_orders RETAIN [[hours]] HOURS;
  slots:
    - id: cmd1
      options:
        - { id: optimize, text: OPTIMIZE }
        - { id: analyze, text: ANALYZE TABLE }
        - { id: reorg, text: REORG TABLE }
    - id: clause
      options:
        - { id: zorder, text: ZORDER BY }
        - { id: partitioned, text: PARTITIONED BY }
        - { id: distribute, text: DISTRIBUTE BY }
    - id: cmd2
      options:
        - { id: vacuum, text: VACUUM }
        - { id: optimize2, text: OPTIMIZE }
        - { id: restore, text: RESTORE TABLE }
    - id: hours
      options:
        - { id: h24, text: "24" }
        - { id: h168, text: "168" }
        - { id: h720, text: "720" }
answer:
  values: { cmd1: optimize, clause: zorder, cmd2: vacuum, hours: h168 }
explanation:
  correct:
    en: |
      OPTIMIZE compacts the small files, and ZORDER BY sorts the rewritten data on customer_id so that queries that filter on a selective column skip whole files. VACUUM deletes the files that are no longer referenced by the Delta log and older than the retention, and seven days is 168 hours, which is also the default threshold.
    fr: |
      OPTIMIZE compacte les petits fichiers, et ZORDER BY trie les données réécrites sur customer_id pour que les requêtes qui filtrent sur une colonne sélective ignorent des fichiers entiers. VACUUM supprime les fichiers qui ne sont plus référencés par le journal Delta et qui dépassent la rétention ; sept jours font 168 heures, ce qui est aussi le seuil par défaut.
  options:
    partitioned:
      en: |
        Partitioning on a column with millions of values creates a partition per value and many small files.
      fr: |
        Partitionner sur une colonne de millions de valeurs crée une partition par valeur et de nombreux petits fichiers.
    h24:
      en: |
        24 hours is one day; a retention under seven days also fails by default.
      fr: |
        24 heures font un jour ; une rétention inférieure à sept jours échoue en outre par défaut.
references:
  - title: Table Compaction
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/table-compaction
  - title: Delta Table Maintenance in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-table-maintenance
