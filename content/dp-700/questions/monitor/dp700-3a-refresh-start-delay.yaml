id: dp700-3a-refresh-start-delay
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an import-mode semantic model named SM_Stock in a workspace on a Fabric capacity. SM_Stock has a scheduled refresh at 07:00 every day. The refresh history shows that every refresh succeeded and took about 20 minutes. On most days the refresh starts between 07:00 and 07:10, but on some days it starts as late as 07:45.

    What explains the late start times?
  fr: |
    Adatum dispose d'un modèle sémantique en mode importation nommé SM_Stock dans un espace de travail sur une capacité Fabric. SM_Stock a une actualisation planifiée à 07:00 chaque jour. L'historique des actualisations montre que toutes les actualisations ont réussi et ont duré environ 20 minutes. La plupart des jours, l'actualisation démarre entre 07:00 et 07:10, mais certains jours elle ne démarre qu'à 07:45.

    Qu'est-ce qui explique ces démarrages tardifs ?
body:
  options:
    - { id: a, text: { en: "The schedule uses a time zone that differs from the time zone of the report users", fr: "La planification utilise un fuseau horaire différent de celui des utilisateurs des rapports" } }
    - { id: b, text: { en: "Each late refresh first failed, and the history shows only the automatic retry", fr: "Chaque actualisation tardive a d'abord échoué, et l'historique n'affiche que la nouvelle tentative automatique" } }
    - { id: c, text: { en: "Resources weren't available sooner; a scheduled refresh can start up to an hour late", fr: "Les ressources n'étaient pas disponibles plus tôt ; une actualisation planifiée peut démarrer jusqu'à une heure en retard" } }
    - { id: d, text: { en: "The schedule exceeds the number of scheduled refreshes allowed per day on the capacity", fr: "La planification dépasse le nombre d'actualisations planifiées autorisées par jour sur la capacité" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Power BI aims to start a scheduled refresh within 15 minutes of its time slot, but a delay of up to one hour can occur when the service can't allocate the required resources sooner. Occasional late starts with successful refreshes match this behavior.
    fr: |
      Power BI vise à démarrer une actualisation planifiée dans les 15 minutes suivant son créneau, mais un retard pouvant aller jusqu'à une heure peut se produire quand le service ne peut pas allouer plus tôt les ressources nécessaires. Des démarrages tardifs occasionnels avec des actualisations réussies correspondent à ce comportement.
  options:
    a:
      en: |
        A time zone difference would shift every refresh by the same offset, not only some days.
      fr: |
        Un écart de fuseau horaire décalerait chaque actualisation du même écart, pas seulement certains jours.
    b:
      en: |
        Failed attempts appear in the refresh history with a Show link to their details; the history shows no failure.
      fr: |
        Les tentatives en échec apparaissent dans l'historique des actualisations avec un lien Show vers leurs détails ; l'historique ne montre aucun échec.
    d:
      en: |
        One refresh a day is far below the 48 scheduled refreshes allowed on a Fabric capacity.
      fr: |
        Une actualisation par jour est très en deçà des 48 actualisations planifiées autorisées sur une capacité Fabric.
references:
  - title: Configure scheduled refresh
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-scheduled-refresh
