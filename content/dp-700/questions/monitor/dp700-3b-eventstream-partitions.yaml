id: dp700-3b-eventstream-partitions
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventstream named ES_Clicks. ES_Clicks uses an Azure Event Hubs source at the basic feature level. The source reads an event hub named eh-clicks that has two partitions.

    The applications send about 40 MB/s of events to eh-clicks. The Event throughput setting of ES_Clicks is set to High. On the source node, Backlogged input events and Watermark delay keep increasing.

    You need ES_Clicks to process the events without a growing backlog.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventstream nommé ES_Clicks. ES_Clicks utilise une source Azure Event Hubs au niveau de fonctionnalités de base. La source lit un hub d'événements nommé eh-clicks qui comporte deux partitions.

    Les applications envoient environ 40 Mo/s d'événements à eh-clicks. Le paramètre Event throughput d'ES_Clicks est défini sur High. Sur le nœud source, Backlogged input events et Watermark delay ne cessent d'augmenter.

    ES_Clicks doit traiter les événements sans backlog croissant.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the Retention setting of ES_Clicks to 7 days", fr: "Définir le paramètre Retention d'ES_Clicks sur 7 jours" } }
    - { id: b, text: { en: "Create a second Azure Event Hubs source on eh-clicks with another consumer group", fr: "Créer une seconde source Azure Event Hubs sur eh-clicks avec un autre groupe de consommateurs" } }
    - { id: c, text: { en: "Set the Event throughput setting of ES_Clicks to Medium", fr: "Définir le paramètre Event throughput d'ES_Clicks sur Medium" } }
    - { id: d, text: { en: "Send the events to an event hub that has 16 partitions, and use it as the source", fr: "Envoyer les événements vers un hub d'événements de 16 partitions et l'utiliser comme source" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For an Azure Event Hubs source at the basic feature level, a partition count below four limits the throughput regardless of the selected level, to about 9 to 10 MB/s. With 4, 16 or 32 partitions, the throughput follows the selected level, and High is meant for more than 100 MB/s. An event hub with 16 partitions lets the High setting absorb 40 MB/s.
    fr: |
      Pour une source Azure Event Hubs au niveau de fonctionnalités de base, un nombre de partitions inférieur à quatre limite le débit, quel que soit le niveau sélectionné, à environ 9 à 10 Mo/s. Avec 4, 16 ou 32 partitions, le débit suit le niveau sélectionné, et High correspond à plus de 100 Mo/s. Un hub d'événements de 16 partitions permet au paramètre High d'absorber 40 Mo/s.
  options:
    a: { en: "Retention keeps events longer but doesn't increase the processing throughput, so the backlog keeps growing.", fr: "La rétention conserve les événements plus longtemps mais n'augmente pas le débit de traitement : le backlog continue de croître." }
    b: { en: "A second source reads the same two partitions again and duplicates the events instead of processing them faster.", fr: "Une seconde source relit les deux mêmes partitions et duplique les événements au lieu de les traiter plus vite." }
    c: { en: "A lower level doesn't help: the two partitions cap the throughput whatever the level.", fr: "Un niveau plus bas n'aide pas : les deux partitions plafonnent le débit quel que soit le niveau." }
references:
  - title: Configure Settings for a Fabric Eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/configure-settings
