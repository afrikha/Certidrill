id: dp700-sr2-policy-error-2
objective: "3.2.4"
type: series_yesno
series: dp700-sr2-policy-error
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You review the Copy activity of the latest PL-Readings run.
  fr: Vous examinez l'activité Copy de la dernière exécution de PL-Readings.
body:
  solution:
    en: |
      In the Monitor hub, you open the latest run of PL-Readings and review the output and the error details of its Copy activity.
    fr: |
      Dans le hub de surveillance, vous ouvrez la dernière exécution de PL-Readings et examinez la sortie et les détails d'erreur de son activité Copy.
answer: { value: false }
explanation:
  correct:
    en: |
      By default, an update policy isn't transactional: when its query fails, the data is still ingested into the source table and the ingestion is reported as successful. The Copy activity therefore succeeds and shows no error; the failure is visible only in the eventhouse.
    fr: |
      Par défaut, une stratégie de mise à jour n'est pas transactionnelle : quand sa requête échoue, les données sont quand même ingérées dans la table source et l'ingestion est signalée comme réussie. L'activité Copy réussit donc et n'affiche aucune erreur ; l'échec n'est visible que dans l'eventhouse.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
