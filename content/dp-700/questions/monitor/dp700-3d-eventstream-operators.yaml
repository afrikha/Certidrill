id: dp700-3d-eventstream-operators
objective: "3.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric eventstream named ES3 that receives telemetry from 20,000 devices located in several buildings. Each event contains the fields DeviceId, Building, Temperature and EventTime. ES3 currently sends every event to an eventhouse by using **Direct ingestion**, and the eventhouse stores far more rows than the reports need.

    You need to change ES3 so that the eventhouse receives only the events of the building named B2, as one row per device per minute that contains the average temperature.

    Which two operators should you add to ES3 before the eventhouse destination? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un eventstream Fabric nommé ES3 qui reçoit la télémétrie de 20 000 appareils répartis dans plusieurs bâtiments. Chaque événement contient les champs DeviceId, Building, Temperature et EventTime. ES3 envoie actuellement chaque événement à un eventhouse en **Direct ingestion**, et l'eventhouse stocke beaucoup plus de lignes que les rapports n'en ont besoin.

    Vous devez modifier ES3 pour que l'eventhouse ne reçoive que les événements du bâtiment nommé B2, sous la forme d'une ligne par appareil et par minute contenant la température moyenne.

    Quels sont les deux opérateurs à ajouter à ES3 avant la destination eventhouse ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Filter }
    - { id: b, text: Expand }
    - { id: c, text: Group by }
    - { id: d, text: Union }
    - { id: e, text: Join }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The Filter operator keeps only the events that meet a condition, here Building equals B2. The Group by operator aggregates the events within a time window, optionally grouped by columns, so a one-minute window grouped by DeviceId with an average of Temperature produces one row per device per minute. The eventhouse destination placed after these operators uses the Event processing before ingestion mode."
    fr: "L'opérateur Filter ne conserve que les événements qui remplissent une condition, ici Building égal à B2. L'opérateur Group by agrège les événements dans une fenêtre de temps, éventuellement par colonnes : une fenêtre d'une minute regroupée par DeviceId avec la moyenne de Temperature produit une ligne par appareil et par minute. La destination eventhouse placée après ces opérateurs utilise le mode Event processing before ingestion."
  options:
    b: { en: "Expand creates one row per array element, which increases the number of rows.", fr: "Expand crée une ligne par élément de tableau, ce qui augmente le nombre de lignes." }
    d: { en: "Union combines several streams into one; ES3 has a single stream to reduce.", fr: "Union combine plusieurs flux en un seul ; ES3 n'a qu'un flux à réduire." }
    e: { en: "Join combines two streams or enriches events with reference data; it does not reduce or aggregate the events.", fr: "Join combine deux flux ou enrichit les événements avec des données de référence ; il ne réduit ni n'agrège les événements." }
references:
  - title: Route data streams based on content in Microsoft Fabric eventstreams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/route-events-based-on-content
  - title: Add an Eventhouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-kql-database
