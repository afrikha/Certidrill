id: dp700-3a-copy-skipped-rows
objective: "3.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a pipeline named PL_Orders that contains a Copy activity. The Copy activity loads CSV files from the Files section of a lakehouse named LH_Landing into a Delta table in a lakehouse named LH_Bronze. Fault tolerance is configured to skip incompatible rows.

    After each run, the data team must be able to:

    - Review the rows that were skipped.
    - Confirm that the number of rows read equals the number of rows copied plus the number of skipped rows.

    Which two settings should you enable in the Copy activity? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline nommé PL_Orders qui contient une activité Copy. L'activité Copy charge des fichiers CSV de la section Files d'un lakehouse nommé LH_Landing dans une table Delta d'un lakehouse nommé LH_Bronze. La tolérance de panne est configurée pour ignorer les lignes incompatibles.

    Après chaque exécution, l'équipe données doit pouvoir :

    - Examiner les lignes qui ont été ignorées.
    - Vérifier que le nombre de lignes lues est égal au nombre de lignes copiées plus le nombre de lignes ignorées.

    Quels sont les deux paramètres à activer dans l'activité Copy ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Intelligent throughput optimization set to Maximum", fr: "Intelligent throughput optimization réglé sur Maximum" } }
    - { id: b, text: { en: "Enable logging", fr: "Enable logging" } }
    - { id: c, text: { en: "Degree of copy parallelism set to a fixed value", fr: "Degree of copy parallelism réglé sur une valeur fixe" } }
    - { id: d, text: { en: "Enable staging", fr: "Enable staging" } }
    - { id: e, text: { en: "Data consistency verification", fr: "Data consistency verification" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      With fault tolerance, the Copy activity continues past incompatible rows; Enable logging writes the copied and skipped files and rows to a log, so the team can review what was skipped. Data consistency verification checks, for tabular data, that the rows read equal the rows copied plus the skipped incompatible rows. Verification adds overhead, so it slows the copy somewhat.
    fr: |
      Avec la tolérance de panne, l'activité Copy poursuit malgré les lignes incompatibles ; Enable logging enregistre dans un journal les fichiers et les lignes copiés et ignorés, ce qui permet à l'équipe d'examiner ce qui a été ignoré. Data consistency verification vérifie, pour les données tabulaires, que les lignes lues sont égales aux lignes copiées plus les lignes incompatibles ignorées. La vérification ajoute un coût et ralentit un peu la copie.
  options:
    a:
      en: |
        Intelligent throughput optimization only changes the compute power used by the copy; it doesn't log or check rows.
      fr: |
        Intelligent throughput optimization modifie seulement la puissance de calcul utilisée par la copie ; il n'enregistre ni ne vérifie les lignes.
    c:
      en: |
        The degree of copy parallelism controls how many parallel copies load the data, not what is logged or verified.
      fr: |
        Le degré de parallélisme de copie détermine le nombre de copies parallèles qui chargent les données, pas ce qui est enregistré ou vérifié.
    d:
      en: |
        Staging stores data in an interim location during the copy; it doesn't record skipped rows or compare row counts.
      fr: |
        La mise en zone de transit (staging) stocke les données dans un emplacement temporaire pendant la copie ; elle n'enregistre pas les lignes ignorées et ne compare pas les nombres de lignes.
references:
  - title: How to copy data using copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-data-activity
