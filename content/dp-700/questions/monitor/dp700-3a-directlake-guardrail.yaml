id: dp700-3a-directlake-guardrail
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware has a workspace on an F32 capacity. The workspace contains a lakehouse named LH_Web and a Direct Lake on OneLake semantic model named SM_Web. A streaming job appends small files to a Delta table named clicks in LH_Web. The clicks table contains 120 million rows in 1,400 Parquet files.

    The refresh of SM_Web now fails, and reports can't query the model. Queries must keep running in Direct Lake mode, without DirectQuery.

    Which two actions would each resolve the issue? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un espace de travail sur une capacité F32. L'espace de travail contient un lakehouse nommé LH_Web et un modèle sémantique Direct Lake sur OneLake nommé SM_Web. Une tâche de streaming ajoute de petits fichiers à une table Delta nommée clicks dans LH_Web. La table clicks contient 120 millions de lignes dans 1 400 fichiers Parquet.

    L'actualisation de SM_Web échoue maintenant, et les rapports ne peuvent pas interroger le modèle. Les requêtes doivent continuer à s'exécuter en mode Direct Lake, sans DirectQuery.

    Quelles sont les deux actions qui résoudraient chacune le problème ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run OPTIMIZE on the clicks table to compact its files, then refresh SM_Web", fr: "Exécuter OPTIMIZE sur la table clicks pour compacter ses fichiers, puis actualiser SM_Web" } }
    - { id: b, text: { en: "Run VACUUM on the clicks table to remove unreferenced files, then refresh SM_Web", fr: "Exécuter VACUUM sur la table clicks pour supprimer les fichiers non référencés, puis actualiser SM_Web" } }
    - { id: c, text: { en: "Scale the capacity to F64, then refresh SM_Web", fr: "Mettre la capacité à l'échelle F64, puis actualiser SM_Web" } }
    - { id: d, text: { en: "Set the Direct Lake behavior of SM_Web to Automatic, then refresh SM_Web", fr: "Régler le comportement Direct Lake de SM_Web sur Automatic, puis actualiser SM_Web" } }
    - { id: e, text: { en: "Refresh SM_Web from a pipeline with a longer Semantic model refresh timeout", fr: "Actualiser SM_Web depuis un pipeline avec un délai Semantic model refresh timeout plus long" } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      On F32, a Direct Lake table is limited to 1,000 Parquet files and 1,000 row groups (300 million rows). When a table exceeds a guardrail, the refresh of a Direct Lake on OneLake model fails until the Delta tables are brought back within the limits. Compacting the table with OPTIMIZE reduces the number of files and row groups, and F64 raises the limits to 5,000 files and row groups and 1,500 million rows.
    fr: |
      Sur F32, une table Direct Lake est limitée à 1 000 fichiers Parquet et 1 000 groupes de lignes (300 millions de lignes). Quand une table dépasse une limite (guardrail), l'actualisation d'un modèle Direct Lake sur OneLake échoue jusqu'à ce que les tables Delta reviennent dans les limites. Compacter la table avec OPTIMIZE réduit le nombre de fichiers et de groupes de lignes, et F64 relève les limites à 5 000 fichiers et groupes de lignes et 1 500 millions de lignes.
  options:
    b:
      en: |
        VACUUM deletes old files that the current version of the table no longer references; the current version still has 1,400 files.
      fr: |
        VACUUM supprime les anciens fichiers que la version actuelle de la table ne référence plus ; la version actuelle compte toujours 1 400 fichiers.
    d:
      en: |
        Direct Lake on OneLake doesn't support DirectQuery fallback, and the requirement excludes DirectQuery anyway.
      fr: |
        Direct Lake sur OneLake ne prend pas en charge le basculement vers DirectQuery, et l'exigence exclut de toute façon DirectQuery.
    e:
      en: |
        The refresh fails because of the guardrail, not because it runs too long; framing takes only seconds.
      fr: |
        L'actualisation échoue à cause de la limite, pas parce qu'elle dure trop longtemps ; le tramage ne prend que quelques secondes.
references:
  - title: Direct Lake overview
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview
  - title: How Direct Lake works
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-how-it-works
