id: dp700-3a-refresh-history-yesno
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an import-mode semantic model named SM_Fleet on a Fabric capacity. The query caches are enabled for SM_Fleet. Data engineers review the refresh history of SM_Fleet every morning, and a Power Automate flow also refreshes SM_Fleet at noon.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un modèle sémantique en mode importation nommé SM_Fleet sur une capacité Fabric. Les caches de requêtes sont activés pour SM_Fleet. Les ingénieurs données examinent chaque matin l'historique des actualisations de SM_Fleet, et un flux Power Automate actualise aussi SM_Fleet à midi.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A refresh attempt can show a successful Data operation and a failed Query Cache operation.
        fr: Une tentative d'actualisation peut afficher une opération Data réussie et une opération Query Cache en échec.
    - id: s2
      text:
        en: When a refresh fails, Power BI retries it automatically, and each failed attempt has a Show link to its details.
        fr: Quand une actualisation échoue, Power BI la relance automatiquement, et chaque tentative en échec a un lien Show vers ses détails.
    - id: s3
      text:
        en: If the noon refresh fails, the owner of SM_Fleet receives a refresh failure email.
        fr: Si l'actualisation de midi échoue, le propriétaire de SM_Fleet reçoit un e-mail d'échec d'actualisation.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Each refresh attempt runs a Data operation and then a Query Cache operation: the query cache refresh starts only if the data refresh succeeds, and it can still fail after a successful data refresh. Power BI makes several attempts after a failure, and Show beside a failure opens its details. Failure emails are sent for scheduled refreshes, not for refreshes triggered programmatically, such as through Power Automate.
    fr: |
      Chaque tentative d'actualisation exécute une opération Data puis une opération Query Cache : l'actualisation du cache de requêtes ne démarre que si l'actualisation des données réussit, et elle peut quand même échouer après une actualisation des données réussie. Power BI fait plusieurs tentatives après un échec, et Show à côté d'un échec ouvre ses détails. Les e-mails d'échec sont envoyés pour les actualisations planifiées, pas pour les actualisations déclenchées par programmation, par exemple via Power Automate.
references:
  - title: Data refresh in Power BI
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-data
