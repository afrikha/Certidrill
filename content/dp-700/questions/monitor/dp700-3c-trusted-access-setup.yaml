id: dp700-3c-trusted-access-setup
objective: "3.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS_Data on an F32 capacity. WS_Data contains a lakehouse named LH_Landing. WS_Data does not have a workspace identity.

    You have an Azure Data Lake Storage Gen2 account named stlanding. Public network access to stlanding is disabled. A storage administrator already deployed a resource instance rule for WS_Data on stlanding by using an ARM template.

    You try to create a shortcut in LH_Landing to stlanding, and the creation fails with an authorization error.

    You need to create the shortcut by using trusted workspace access.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS_Data sur une capacité F32. WS_Data contient un lakehouse nommé LH_Landing. WS_Data n'a pas d'identité d'espace de travail.

    Vous disposez d'un compte Azure Data Lake Storage Gen2 nommé stlanding. L'accès réseau public à stlanding est désactivé. Un administrateur du stockage a déjà déployé une règle d'instance de ressource pour WS_Data sur stlanding avec un modèle ARM.

    Vous essayez de créer dans LH_Landing un raccourci vers stlanding, et la création échoue avec une erreur d'autorisation.

    Vous devez créer le raccourci en utilisant l'accès approuvé à l'espace de travail.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: ident, text: { en: "Create a workspace identity for WS_Data.", fr: "Créer une identité d'espace de travail pour WS_Data." } }
    - { id: role, text: { en: "Assign the workspace identity the Storage Blob Data Reader role on stlanding.", fr: "Attribuer à l'identité de l'espace de travail le rôle Storage Blob Data Reader sur stlanding." } }
    - { id: shortcut, text: { en: "Create the shortcut with the URL https://stlanding.dfs.core.windows.net and the Workspace identity authentication kind.", fr: "Créer le raccourci avec l'URL https://stlanding.dfs.core.windows.net et le type d'authentification Workspace identity." } }
    - { id: mpe, text: { en: "Create a managed private endpoint from WS_Data to stlanding.", fr: "Créer un point de terminaison privé managé de WS_Data vers stlanding." } }
    - { id: blob, text: { en: "Create the shortcut with the URL https://stlanding.blob.core.windows.net and the Workspace identity authentication kind.", fr: "Créer le raccourci avec l'URL https://stlanding.blob.core.windows.net et le type d'authentification Workspace identity." } }
    - { id: public, text: { en: "Enable public network access from all networks on stlanding.", fr: "Activer l'accès réseau public depuis tous les réseaux sur stlanding." } }
answer:
  sequence: [ident, role, shortcut]
explanation:
  correct:
    en: |
      Trusted workspace access needs a workspace identity, so you create it first. The identity used by the shortcut then needs a Storage Blob Data role on the account; the role can be assigned only once the identity exists. Finally, you create the shortcut with the DFS endpoint of the account and the Workspace identity authentication kind; the resource instance rule already lets WS_Data through the firewall.
    fr: |
      L'accès approuvé à l'espace de travail exige une identité d'espace de travail : vous la créez d'abord. L'identité utilisée par le raccourci a ensuite besoin d'un rôle Storage Blob Data sur le compte ; ce rôle ne peut être attribué qu'une fois l'identité créée. Enfin, vous créez le raccourci avec le point de terminaison DFS du compte et le type d'authentification Workspace identity ; la règle d'instance de ressource laisse déjà passer WS_Data à travers le pare-feu.
  options:
    mpe:
      en: |
        OneLake shortcuts do not support ADLS Gen2 accounts reached through managed private endpoints.
      fr: |
        Les raccourcis OneLake ne prennent pas en charge les comptes ADLS Gen2 joints par des points de terminaison privés managés.
    blob:
      en: |
        An ADLS Gen2 shortcut must use the DFS endpoint of the account, not the blob endpoint.
      fr: |
        Un raccourci ADLS Gen2 doit utiliser le point de terminaison DFS du compte, pas le point de terminaison blob.
    public:
      en: |
        Trusted workspace access works with public access disabled; opening the account to all networks is not needed and weakens its security.
      fr: |
        L'accès approuvé à l'espace de travail fonctionne avec l'accès public désactivé ; ouvrir le compte à tous les réseaux n'est pas nécessaire et affaiblit sa sécurité.
references:
  - title: Trusted workspace access in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/security/security-trusted-workspace-access
  - title: Create an Azure Data Lake Storage Gen2 shortcut
    url: https://learn.microsoft.com/en-us/fabric/onelake/create-adls-shortcut
