id: dp700-3c-pipeline-duration
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric pipeline named PL_Master that contains the following activities, connected by On success dependencies in this order:

    1. Copy_Customers, a Copy activity that writes the customers table of a lakehouse.
    2. Wait_5min, a Wait activity of 300 seconds.
    3. Copy_Products, a Copy activity that writes the products table.
    4. Copy_Stores, a Copy activity that writes the stores table.

    The three Copy activities read different source tables, and none of them uses the output of another activity. The Wait activity was added during testing and is no longer needed.

    You need to reduce the duration of PL_Master. All three tables must still be loaded at each run.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un pipeline Fabric nommé PL_Master qui contient les activités suivantes, reliées par des dépendances On success dans cet ordre :

    1. Copy_Customers, une activité Copy qui écrit la table customers d'un lakehouse.
    2. Wait_5min, une activité Wait de 300 secondes.
    3. Copy_Products, une activité Copy qui écrit la table products.
    4. Copy_Stores, une activité Copy qui écrit la table stores.

    Les trois activités Copy lisent des tables sources différentes, et aucune n'utilise la sortie d'une autre activité. L'activité Wait a été ajoutée pendant les tests et n'est plus nécessaire.

    Vous devez réduire la durée de PL_Master. Les trois tables doivent toujours être chargées à chaque exécution.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Delete Wait_5min and connect Copy_Customers to Copy_Products.", fr: "Supprimer Wait_5min et relier Copy_Customers à Copy_Products." } }
    - { id: b, text: { en: "Select Data consistency verification on the three Copy activities.", fr: "Sélectionner Data consistency verification sur les trois activités Copy." } }
    - { id: c, text: { en: "Remove all the dependencies so that the three Copy activities start at the same time.", fr: "Supprimer toutes les dépendances pour que les trois activités Copy démarrent en même temps." } }
    - { id: d, text: { en: "Move the three Copy activities into a ForEach activity that has Sequential selected.", fr: "Déplacer les trois activités Copy dans une activité ForEach dont l'option Sequential est sélectionnée." } }
    - { id: e, text: { en: "Set Intelligent throughput optimization to Standard on the three Copy activities.", fr: "Définir Intelligent throughput optimization sur Standard sur les trois activités Copy." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Removing the unneeded Wait activity saves five minutes at each run. The three copies are independent, so activities without dependencies between them run in parallel, and the pipeline then lasts about as long as the longest copy instead of the sum of the three. Either change reduces the duration and still loads the three tables.
    fr: |
      Supprimer l'activité Wait devenue inutile fait gagner cinq minutes à chaque exécution. Les trois copies sont indépendantes : des activités sans dépendance entre elles s'exécutent en parallèle, et le pipeline dure alors à peu près autant que la copie la plus longue au lieu de la somme des trois. Chacune de ces modifications réduit la durée et charge toujours les trois tables.
  options:
    b:
      en: |
        Data consistency verification adds checks to each copy and affects its performance; it makes the pipeline slower.
      fr: |
        Data consistency verification ajoute des contrôles à chaque copie et affecte ses performances ; elle ralentit le pipeline.
    d:
      en: |
        With Sequential selected, the ForEach processes its items one at a time, so the copies still run one after the other.
      fr: |
        Avec Sequential sélectionné, le ForEach traite ses éléments un par un : les copies s'exécutent toujours l'une après l'autre.
    e:
      en: |
        The default is Auto; a fixed Standard value limits the compute of each copy and does not shorten the pipeline.
      fr: |
        La valeur par défaut est Auto ; une valeur fixe Standard limite la puissance de calcul de chaque copie et ne raccourcit pas le pipeline.
references:
  - title: Copy Activity Performance and Scalability Guide
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-activity-performance-and-scalability-guide
  - title: ForEach Activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/foreach-activity
