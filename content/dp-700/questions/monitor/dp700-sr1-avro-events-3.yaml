id: dp700-sr1-avro-events-3
objective: "3.2.5"
type: series_yesno
series: dp700-sr1-avro-events
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You replace the source with one that uses the Avro data format.
  fr: Vous remplacez la source par une source qui utilise le format de données Avro.
body:
  solution:
    en: |
      You remove the Azure Event Hubs source from ES1 and add a new Azure Event Hubs source that reads orders-hub with the consumer group es1, with **Data format** set to **Avro**. You connect the new source in place of the old one, so that its events reach the Filter operator, and you publish ES1.
    fr: |
      Vous supprimez la source Azure Event Hubs de ES1 et ajoutez une nouvelle source Azure Event Hubs qui lit orders-hub avec le groupe de consommateurs es1, avec **Data format** défini sur **Avro**. Vous connectez la nouvelle source à la place de l'ancienne, afin que ses événements atteignent l'opérateur Filter, puis vous publiez ES1.
answer: { value: true }
explanation:
  correct:
    en: |
      The Data format of an Azure Event Hubs source (JSON, Avro, or CSV with header) tells the eventstream engine how to deserialize the incoming events. With Avro selected, the events produced by the updated application deserialize again, so they flow through the Filter operator to the eventhouse destination.
    fr: |
      Le paramètre Data format d'une source Azure Event Hubs (JSON, Avro ou CSV avec en-tête) indique au moteur du flux d'événements comment désérialiser les événements entrants. Avec Avro sélectionné, les événements produits par l'application mise à jour sont de nouveau désérialisés : ils traversent l'opérateur Filter jusqu'à la destination eventhouse.
references:
  - title: Add an Azure Event Hubs source to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-source-azure-event-hubs
