id: dp700-3b-notebook-430-interactive
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that is assigned to an F8 capacity. The capacity isn't throttled.

    A data engineer runs a notebook named NB_Profile interactively and receives the following error: "[TooManyRequestsForCapacity] HTTP Response code 430: This Spark job can't be run because you have hit a Spark compute or API rate limit."

    Three Spark jobs that another engineer started this morning are still running and are no longer needed.

    You need the data engineer to run NB_Profile interactively as soon as possible. The capacity SKU must not change.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 affecté à une capacité F8. La capacité n'est pas limitée (throttled).

    Un ingénieur Données exécute de manière interactive un notebook nommé NB_Profile et reçoit l'erreur suivante : « [TooManyRequestsForCapacity] HTTP Response code 430: This Spark job can't be run because you have hit a Spark compute or API rate limit. »

    Trois tâches Spark lancées ce matin par un autre ingénieur sont toujours en cours d'exécution et ne sont plus nécessaires.

    L'ingénieur Données doit pouvoir exécuter NB_Profile de manière interactive le plus tôt possible. La référence SKU de la capacité ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the Spark session timeout in the workspace settings, and then run NB_Profile again", fr: "Augmenter le délai d'expiration de session Spark dans les paramètres de l'espace de travail, puis réexécuter NB_Profile" } }
    - { id: b, text: { en: "Turn on Reserve maximum cores for active Spark jobs in the workspace settings", fr: "Activer Reserve maximum cores for active Spark jobs dans les paramètres de l'espace de travail" } }
    - { id: c, text: { en: "Leave the request as it is, because Fabric queues it and runs it when cores are free", fr: "Laisser la demande en l'état, car Fabric la met en file d'attente et l'exécute quand des cœurs sont libres" } }
    - { id: d, text: { en: "Cancel the unneeded Spark jobs from the Monitoring hub, and then run NB_Profile again", fr: "Annuler les tâches Spark inutiles depuis le hub de surveillance, puis réexécuter NB_Profile" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      HTTP 430 means that the Spark VCores of the capacity, including bursting, are all in use. Interactive notebook jobs aren't queued, so the error itself suggests cancelling an active Spark job through the Monitoring hub, choosing a larger SKU, or trying later; cancelling the unneeded jobs frees cores immediately.
    fr: |
      HTTP 430 signifie que tous les VCores Spark de la capacité, bursting compris, sont utilisés. Les tâches de notebook interactives ne sont pas mises en file d'attente : l'erreur elle-même propose d'annuler une tâche Spark active depuis le hub de surveillance, de choisir une référence SKU plus grande ou de réessayer plus tard ; annuler les tâches inutiles libère immédiatement des cœurs.
  options:
    a: { en: "The session timeout decides when idle interactive sessions expire; it doesn't free cores for a new session.", fr: "Le délai d'expiration de session détermine quand les sessions interactives inactives expirent ; il ne libère pas de cœurs pour une nouvelle session." }
    b: { en: "Reserving maximum cores turns off optimistic admission, so each job holds more cores and fewer jobs can run.", fr: "Réserver le nombre maximal de cœurs désactive l'admission optimiste : chaque tâche monopolise plus de cœurs et moins de tâches peuvent s'exécuter." }
    c: { en: "Queueing applies to pipeline, scheduler and Spark job definition jobs, not to interactive notebook runs, which are rejected.", fr: "La mise en file d'attente s'applique aux tâches de pipeline, du planificateur et de définition de tâche Spark, pas aux exécutions interactives de notebook, qui sont rejetées." }
references:
  - title: Concurrency limits and queueing in Apache Spark for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-job-concurrency-and-queueing
