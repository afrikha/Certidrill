id: dp700-3a-stream-metrics-match
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an eventstream named ES_Orders. ES_Orders reads events from an Azure Event Hubs source and routes them to a lakehouse destination and to an eventhouse destination that uses the Event processing before ingestion mode.

    You need to identify which Data insights metric answers each question of the operations team.

    Which metric should you use for each question? To answer, drag the appropriate metrics to the correct questions. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un flux d'événements (eventstream) nommé ES_Orders. ES_Orders lit des événements depuis une source Azure Event Hubs et les achemine vers une destination lakehouse et vers une destination eventhouse qui utilise le mode Event processing before ingestion.

    Vous devez identifier la métrique de Data insights qui répond à chaque question de l'équipe d'exploitation.

    Quelle métrique devez-vous utiliser pour chaque question ? Pour répondre, faites glisser les métriques appropriées vers les questions correspondantes. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: incoming, text: IncomingMessages }
    - { id: outbytes, text: OutgoingBytes }
    - { id: deser, text: Deserialization errors }
    - { id: watermark, text: Watermark delay }
    - { id: inbytes, text: Input event bytes }
    - { id: backlog, text: Backlogged input events }
  targets:
    - id: q1
      text: { en: "How many events did the producers send to the ES_Orders eventstream node during the period?", fr: "Combien d'événements les producteurs ont-ils envoyés au nœud de flux d'événements ES_Orders pendant la période ?" }
    - id: q2
      text: { en: "Since a producer switched its payload from JSON to Avro, are events from the Event Hubs source still readable by the engine?", fr: "Depuis qu'un producteur a fait passer ses données de JSON à Avro, les événements de la source Event Hubs sont-ils encore lisibles par le moteur ?" }
    - id: q3
      text: { en: "How many seconds behind real time is the processing for the lakehouse destination?", fr: "De combien de secondes le traitement de la destination lakehouse est-il en retard sur le temps réel ?" }
    - id: q4
      text: { en: "How much data, in bytes, does the ES_Orders eventstream node send out?", fr: "Quelle quantité de données, en octets, le nœud de flux d'événements ES_Orders envoie-t-il ?" }
answer:
  mapping: { q1: incoming, q2: deser, q3: watermark, q4: outbytes }
explanation:
  correct:
    en: |
      The eventstream node charts IncomingMessages, OutgoingMessages, IncomingBytes and OutgoingBytes. Source and destination nodes such as Event Hubs, a lakehouse or an eventhouse in Event processing before ingestion mode add engine metrics: Deserialization errors counts input events the engine can't deserialize, such as events in an unexpected format, and Watermark delay measures, in seconds, how far processing lags behind wall-clock time.
    fr: |
      Le nœud de flux d'événements trace IncomingMessages, OutgoingMessages, IncomingBytes et OutgoingBytes. Les nœuds source et destination comme Event Hubs, un lakehouse ou un eventhouse en mode Event processing before ingestion ajoutent des métriques du moteur : Deserialization errors compte les événements d'entrée que le moteur ne peut pas désérialiser, comme des événements dans un format inattendu, et Watermark delay mesure, en secondes, le retard du traitement sur l'heure réelle.
  options:
    inbytes: { en: "Input event bytes is the volume of events pulled by a source or destination node, not what the eventstream node sends out.", fr: "Input event bytes est le volume des événements lus par un nœud source ou destination, pas ce que le nœud de flux d'événements envoie." }
    backlog: { en: "Backlogged input events counts events waiting in the engine; it doesn't tell whether events can be read or how late processing is in seconds.", fr: "Backlogged input events compte les événements en attente dans le moteur ; il n'indique ni si les événements sont lisibles ni le retard du traitement en secondes." }
references:
  - title: Monitor the status and performance of an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor
