id: dp700-3c-resource-profile-pbi
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS_BI that was created in October 2026. WS_BI contains a lakehouse named LH_Gold and an environment named Env_Gold. Twelve notebooks that write the Delta tables of LH_Gold use Env_Gold. No Spark property is set in Env_Gold or in the notebooks.

    Power BI semantic models in Direct Lake mode read the tables of LH_Gold, and their queries are slow.

    You need all the future writes of the twelve notebooks to use V-Order and optimized write. The solution must not require changes to the notebooks or to the table definitions.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS_BI créé en octobre 2026. WS_BI contient un lakehouse nommé LH_Gold et un environnement nommé Env_Gold. Douze notebooks qui écrivent les tables Delta de LH_Gold utilisent Env_Gold. Aucune propriété Spark n'est définie dans Env_Gold ni dans les notebooks.

    Des modèles sémantiques Power BI en mode Direct Lake lisent les tables de LH_Gold, et leurs requêtes sont lentes.

    Toutes les écritures futures des douze notebooks doivent utiliser V-Order et l'écriture optimisée. La solution ne doit exiger aucune modification des notebooks ni des définitions de tables.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set spark.sql.parquet.vorder.default to true in Env_Gold.", fr: "Définir spark.sql.parquet.vorder.default sur true dans Env_Gold." } }
    - { id: b, text: { en: "Set spark.fabric.resourceProfile to writeHeavy in Env_Gold.", fr: "Définir spark.fabric.resourceProfile sur writeHeavy dans Env_Gold." } }
    - { id: c, text: { en: "Set spark.fabric.resourceProfile to readHeavyForPBI in Env_Gold.", fr: "Définir spark.fabric.resourceProfile sur readHeavyForPBI dans Env_Gold." } }
    - { id: d, text: { en: "Set the delta.parquet.vorder.enabled property to true on each table of LH_Gold.", fr: "Définir la propriété delta.parquet.vorder.enabled sur true sur chaque table de LH_Gold." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      New workspaces use the writeHeavy resource profile, which disables V-Order. The readHeavyForPBI profile is designed for Power BI queries on Delta tables: it enables V-Order and optimized write with 1 GB bins. Setting spark.fabric.resourceProfile in the environment applies it to every notebook that uses Env_Gold, without code changes.
    fr: |
      Les nouveaux espaces de travail utilisent le profil de ressources writeHeavy, qui désactive V-Order. Le profil readHeavyForPBI est conçu pour les requêtes Power BI sur des tables Delta : il active V-Order et l'écriture optimisée avec des groupes de 1 Go. Définir spark.fabric.resourceProfile dans l'environnement l'applique à chaque notebook qui utilise Env_Gold, sans modifier le code.
  options:
    a:
      en: |
        This session property enables V-Order only. The workspace keeps the writeHeavy profile, which does not turn on optimized write.
      fr: |
        Cette propriété de session n'active que V-Order. L'espace de travail garde le profil writeHeavy, qui n'active pas l'écriture optimisée.
    b:
      en: |
        writeHeavy is already the default profile of new workspaces, and it keeps V-Order disabled.
      fr: |
        writeHeavy est déjà le profil par défaut des nouveaux espaces de travail, et il laisse V-Order désactivé.
    d:
      en: |
        Changing the property of each table changes the table definitions and does not enable optimized write.
      fr: |
        Modifier la propriété de chaque table change les définitions de tables et n'active pas l'écriture optimisée.
references:
  - title: Configure Resource Profile Configurations in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-resource-profile-configurations
