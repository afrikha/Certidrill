id: dp700-3b-eventstream-activate-order
objective: "3.2.5"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse named EH_Stock and an eventstream named ES_Inventory. ES_Inventory reads an Azure SQL Database CDC source and applies a Filter operator.

    When you previously added a destination to ES_Inventory, the events of the initial snapshot of the CDC source were never routed to that destination.

    You need to add EH_Stock as a destination after the Filter operator and ensure that all the events, including the initial snapshot, are routed to EH_Stock.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse nommé EH_Stock et un eventstream nommé ES_Inventory. ES_Inventory lit une source CDC Azure SQL Database et applique un opérateur Filter.

    Lorsque vous avez précédemment ajouté une destination à ES_Inventory, les événements de l'instantané initial de la source CDC n'ont jamais été routés vers cette destination.

    Vous devez ajouter EH_Stock comme destination après l'opérateur Filter et faire en sorte que tous les événements, y compris l'instantané initial, soient routés vers EH_Stock.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: direct, text: { en: "Add an EH_Stock destination that uses Direct ingestion.", fr: "Ajouter une destination EH_Stock qui utilise Direct ingestion." } }
    - { id: add, text: { en: "Add an EH_Stock destination that uses Event processing before ingestion, and clear Activate ingestion.", fr: "Ajouter une destination EH_Stock qui utilise Event processing before ingestion, et décocher Activate ingestion." } }
    - { id: now, text: { en: "Activate the EH_Stock destination with the Now option.", fr: "Activer la destination EH_Stock avec l'option Now." } }
    - { id: publish, text: { en: "Publish ES_Inventory.", fr: "Publier ES_Inventory." } }
    - { id: retention, text: { en: "Set the retention of ES_Inventory to 90 days.", fr: "Définir la rétention d'ES_Inventory sur 90 jours." } }
    - { id: custom, text: { en: "Activate the EH_Stock destination with the Custom time option and a timestamp earlier than the first event.", fr: "Activer la destination EH_Stock avec l'option Custom time et un horodatage antérieur au premier événement." } }
answer:
  sequence: [ add, publish, custom ]
explanation:
  correct:
    en: |
      Ingestion can start before routing to a new destination is fully initialized, so events such as an initial CDC snapshot may never reach it. For an Eventhouse (Event processing before ingestion) or lakehouse destination, you clear Activate ingestion when you add it, publish the eventstream, and then activate ingestion manually with Custom time set to an earlier timestamp. A destination after an operator must use Event processing before ingestion.
    fr: |
      L'ingestion peut commencer avant que le routage vers une nouvelle destination soit totalement initialisé : des événements comme l'instantané initial d'une source CDC peuvent alors ne jamais l'atteindre. Pour une destination Eventhouse (Event processing before ingestion) ou lakehouse, vous décochez Activate ingestion à l'ajout, publiez l'eventstream, puis activez manuellement l'ingestion avec Custom time défini sur un horodatage antérieur. Une destination placée après un opérateur doit utiliser Event processing before ingestion.
  options:
    direct: { en: "Direct ingestion takes the unprocessed stream, so it can't receive the output of the Filter operator, and it doesn't support pause and resume.", fr: "Direct ingestion prend le flux non traité : elle ne peut pas recevoir la sortie de l'opérateur Filter et ne prend pas en charge la pause et la reprise." }
    now: { en: "Now starts from the current time and skips the earlier events.", fr: "Now démarre à l'heure actuelle et ignore les événements antérieurs." }
    retention: { en: "Retention doesn't solve the routing issue; Custom time already replays the retained events.", fr: "La rétention ne résout pas le problème de routage ; Custom time rejoue déjà les événements conservés." }
references:
  - title: Add an Eventhouse destination to an eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-destination-kql-database
  - title: Pause and resume data streams
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/pause-resume-data-streams
