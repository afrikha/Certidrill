difficulty: 1
status: draft
stem:
  en: You limit the number of rows returned.
  fr: Vous limitez le nombre de lignes renvoyées.
body:
  solution:
    en: |
      You change the query to the following:

      ```kusto
      AppLogs
      | where Message contains "E4012"
      | where Timestamp > ago(1h)
      | project Timestamp, ServerId, Message
      | limit 1000
      ```
    fr: |
      Vous remplacez la requête par la suivante :

      ```kusto
      AppLogs
      | where Message contains "E4012"
      | where Timestamp > ago(1h)
      | project Timestamp, ServerId, Message
      | limit 1000
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The limit operator returns at most 1,000 arbitrary rows of the result, so the query no longer returns exactly the same rows whenever more than 1,000 rows match. It also leaves the slow substring scan of contains in place.
    fr: |
      L'opérateur limit renvoie au plus 1 000 lignes arbitraires du résultat : la requête ne renvoie plus exactement les mêmes lignes dès que plus de 1 000 lignes correspondent. Il laisse aussi en place l'analyse lente des sous-chaînes de contains.
references:
  - title: Best practices for Kusto Query Language queries
    url: https://learn.microsoft.com/en-us/kusto/query/best-practices?view=microsoft-fabric
