id: dp700-3d-pool-settings
objective: "3.3.5"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    You are a workspace admin of a Fabric workspace named WS7. The default pool of WS7 is a custom Spark pool named Pool7, configured as shown in the following table.

    You need to make two changes to Pool7:

    - Each node must provide 16 vCores and 128 GB of memory.
    - A running Spark application must release the executors it no longer needs when its jobs finish or when it becomes idle.

    Which setting should you change for each requirement? To answer, select the appropriate setting in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous êtes administrateur d'un espace de travail Fabric nommé WS7. Le pool par défaut de WS7 est un pool Spark personnalisé nommé Pool7, configuré comme indiqué dans le tableau suivant.

    Vous devez apporter deux modifications à Pool7 :

    - Chaque nœud doit fournir 16 vCores et 128 Go de mémoire.
    - Une application Spark en cours d'exécution doit libérer les exécuteurs dont elle n'a plus besoin quand ses travaux se terminent ou qu'elle devient inactive.

    Quel paramètre devez-vous modifier pour chaque exigence ? Pour répondre, sélectionnez le paramètre approprié dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Each node provides 16 vCores and 128 GB of memory", fr: "Chaque nœud fournit 16 vCores et 128 Go de mémoire" }
    - id: p2
      text: { en: "Executors are released when jobs finish or the application is idle", fr: "Les exécuteurs sont libérés quand les travaux se terminent ou que l'application est inactive" }
  grid:
    caption: Pool7
    header: [{ en: Setting, fr: Paramètre }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: Node family, area: family }, { text: Memory optimized }]
      - [{ text: Node size, area: size }, { text: Medium }]
      - [{ text: Autoscale, area: autoscale }, { text: { en: "Enabled, 1 to 8 nodes", fr: "Activé, de 1 à 8 nœuds" } }]
      - [{ text: Dynamically allocate executors, area: dynalloc }, { text: { en: Disabled, fr: Désactivé } }]
answer:
  values: { p1: size, p2: dynalloc }
explanation:
  correct:
    en: "Node size sets the vCores and memory of each node: Medium is 8 vCores and 64 GB, Large is 16 vCores and 128 GB. Dynamic allocation lets the application request more executors when tasks exceed the current capacity and release them when jobs finish or the application is idle. Autoscale changes the number of nodes of the pool, not the executors of an application, and the node family does not set the size of the nodes."
    fr: "Node size définit les vCores et la mémoire de chaque nœud : Medium correspond à 8 vCores et 64 Go, Large à 16 vCores et 128 Go. L'allocation dynamique permet à l'application de demander plus d'exécuteurs quand les tâches dépassent la capacité actuelle et de les libérer quand les travaux se terminent ou que l'application est inactive. La mise à l'échelle automatique modifie le nombre de nœuds du pool, pas les exécuteurs d'une application, et la famille de nœuds ne définit pas la taille des nœuds."
references:
  - title: Create custom Spark pools in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/create-custom-spark-pools
  - title: Overview of Apache Spark compute in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-compute
