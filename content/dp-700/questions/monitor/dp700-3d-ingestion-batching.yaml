id: dp700-3d-ingestion-batching
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric eventhouse that contains a KQL database named DB1. An application uses queued ingestion to load small log files into a table named AppLogs in DB1. The application sends about 200 files per hour, and each file is smaller than 1 MB. The ingestion batching policy of AppLogs uses the default values.

    New log records become queryable about five minutes after the application sends them. You need the records to be queryable within one minute. The solution must minimize the impact on the other tables of DB1.

    What should you do?
  fr: |
    Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée DB1. Une application utilise l'ingestion en file d'attente pour charger de petits fichiers journaux dans une table nommée AppLogs de DB1. L'application envoie environ 200 fichiers par heure, et chaque fichier fait moins de 1 Mo. La stratégie de traitement par lots de l'ingestion d'AppLogs utilise les valeurs par défaut.

    Les nouveaux enregistrements deviennent interrogeables environ cinq minutes après leur envoi par l'application. Vous devez faire en sorte qu'ils soient interrogeables en moins d'une minute. La solution doit réduire au minimum l'impact sur les autres tables de DB1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set MaximumNumberOfItems to 5000 in the ingestion batching policy of AppLogs.", fr: "Définir MaximumNumberOfItems sur 5000 dans la stratégie de traitement par lots de l'ingestion d'AppLogs." } }
    - { id: b, text: { en: "Set MaximumBatchingTimeSpan to 00:00:30 in the ingestion batching policy of DB1.", fr: "Définir MaximumBatchingTimeSpan sur 00:00:30 dans la stratégie de traitement par lots de l'ingestion de DB1." } }
    - { id: c, text: { en: "Set MaximumBatchingTimeSpan to 00:00:30 in the ingestion batching policy of AppLogs.", fr: "Définir MaximumBatchingTimeSpan sur 00:00:30 dans la stratégie de traitement par lots de l'ingestion d'AppLogs." } }
    - { id: d, text: { en: "Set MaximumRawDataSizeMB to 4096 in the ingestion batching policy of AppLogs.", fr: "Définir MaximumRawDataSizeMB sur 4096 dans la stratégie de traitement par lots de l'ingestion d'AppLogs." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A batch is sealed when the first of its limits is reached: 5 minutes, 500 items or 1 GB by default. With about 200 small files per hour, the time limit always triggers first, so lowering MaximumBatchingTimeSpan (minimum 10 seconds) is the lever for latency. Setting it on the AppLogs table leaves the other tables of DB1 unchanged."
    fr: "Un lot est scellé dès que la première de ses limites est atteinte : 5 minutes, 500 éléments ou 1 Go par défaut. Avec environ 200 petits fichiers par heure, c'est toujours la limite de temps qui se déclenche en premier : réduire MaximumBatchingTimeSpan (10 secondes minimum) est donc le levier de la latence. La définir sur la table AppLogs laisse les autres tables de DB1 inchangées."
  options:
    a: { en: "A higher item count makes batches wait longer; the time limit still seals the batch after 5 minutes.", fr: "Un nombre d'éléments plus élevé fait attendre les lots plus longtemps ; la limite de temps scelle toujours le lot au bout de 5 minutes." }
    b: { en: "A database-level policy applies to every table that has no table-level policy, which affects the other tables of DB1.", fr: "Une stratégie au niveau de la base s'applique à toutes les tables sans stratégie de table, ce qui touche les autres tables de DB1." }
    d: { en: "The files never approach 1 GB per batch; raising the size limit does not shorten the wait.", fr: "Les fichiers n'approchent jamais 1 Go par lot ; augmenter la limite de taille ne réduit pas l'attente." }
references:
  - title: Ingestion batching policy
    url: https://learn.microsoft.com/en-us/kusto/management/batching-policy?view=microsoft-fabric
