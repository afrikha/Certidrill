id: dp700-3d-starter-pool
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named WS2. The default pool of WS2 is a custom Spark pool named Pool1 that uses Medium nodes and autoscales from one to four nodes. WS2 has no default environment, the notebooks install no libraries, and the tenant uses neither Private Links nor managed virtual networks.

    Each notebook session in WS2 takes about three minutes to start. You need sessions to start in a few seconds. The notebooks only need Medium nodes.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS2. Le pool par défaut de WS2 est un pool Spark personnalisé nommé Pool1 qui utilise des nœuds Medium et se met à l'échelle automatiquement entre un et quatre nœuds. WS2 n'a pas d'environnement par défaut, les notebooks n'installent aucune bibliothèque, et le locataire n'utilise ni Private Links ni réseaux virtuels managés.

    Chaque session de notebook dans WS2 met environ trois minutes à démarrer. Les sessions doivent démarrer en quelques secondes. Les notebooks n'ont besoin que de nœuds Medium.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the maximum number of nodes of Pool1 to 10.", fr: "Porter le nombre maximal de nœuds de Pool1 à 10." } }
    - { id: b, text: { en: "Enable dynamic allocation of executors on Pool1.", fr: "Activer l'allocation dynamique des exécuteurs sur Pool1." } }
    - { id: c, text: { en: "Enable the native execution engine for WS2.", fr: "Activer le moteur d'exécution natif pour WS2." } }
    - { id: d, text: { en: "Set the default pool of WS2 to Starter Pool.", fr: "Définir Starter Pool comme pool par défaut de WS2." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Starter pools are prewarmed clusters of Medium nodes: with no extra libraries or custom properties, a session typically starts in 5 to 10 seconds. A custom pool gets its nodes from Azure on demand, which takes about three minutes. Because the notebooks only need Medium nodes, the starter pool meets the requirement."
    fr: "Les pools de démarrage sont des clusters préchauffés de nœuds Medium : sans bibliothèque ni propriété personnalisée supplémentaire, une session démarre en général en 5 à 10 secondes. Un pool personnalisé obtient ses nœuds d'Azure à la demande, ce qui prend environ trois minutes. Comme les notebooks n'ont besoin que de nœuds Medium, le pool de démarrage répond à l'exigence."
  options:
    a: { en: "More nodes add capacity to the session but do not shorten the on-demand startup of a custom pool.", fr: "Plus de nœuds ajoutent de la capacité à la session, mais ne raccourcissent pas le démarrage à la demande d'un pool personnalisé." }
    b: { en: "Dynamic allocation adjusts executors during a job; the pool still starts on demand.", fr: "L'allocation dynamique ajuste les exécuteurs pendant un travail ; le pool démarre toujours à la demande." }
    c: { en: "The native execution engine speeds up query execution, not session startup.", fr: "Le moteur d'exécution natif accélère l'exécution des requêtes, pas le démarrage de la session." }
references:
  - title: Overview of Apache Spark compute in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-compute
