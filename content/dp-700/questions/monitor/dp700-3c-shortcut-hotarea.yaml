id: dp700-3c-shortcut-hotarea
objective: "3.2.7"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric lakehouse named Lakehouse1 that contains the shortcuts shown in the following table. LH_Sales is a lakehouse in the same workspace, and adlsweb is an Azure Data Lake Storage Gen2 account reached through a cloud connection. All the users have the required permissions on the targets and the connection.

    Answer each prompt by selecting the appropriate shortcut.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un lakehouse Fabric nommé Lakehouse1 qui contient les raccourcis présentés dans le tableau suivant. LH_Sales est un lakehouse du même espace de travail, et adlsweb est un compte Azure Data Lake Storage Gen2 joint par une connexion cloud. Tous les utilisateurs disposent des autorisations nécessaires sur les cibles et sur la connexion.

    Répondez à chaque consigne en sélectionnant le raccourci approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The only shortcut that an analyst can query as a table from the SQL analytics endpoint of Lakehouse1", fr: "Le seul raccourci qu'un analyste peut interroger comme une table depuis le point de terminaison d'analytique SQL de Lakehouse1" }
    - id: p2
      text: { en: "The shortcut that becomes a table if its target data is converted to Delta format, with no other change", fr: "Le raccourci qui devient une table si ses données cibles sont converties au format Delta, sans autre modification" }
  grid:
    header: [{ en: "Shortcut", fr: "Raccourci" }, { en: "Location in Lakehouse1", fr: "Emplacement dans Lakehouse1" }, { en: "Target", fr: "Cible" }, { en: "Target content", fr: "Contenu de la cible" }]
    rows:
      - [{ text: sc_orders, area: orders }, { text: Tables }, { text: "LH_Sales/Tables/orders" }, { text: { en: "Delta table", fr: "Table Delta" } }]
      - [{ text: Customer List, area: customers }, { text: Tables }, { text: "LH_Sales/Tables/customers" }, { text: { en: "Delta table", fr: "Table Delta" } }]
      - [{ text: sc_clicks, area: clicks }, { text: Files }, { text: "adlsweb/web/clicks" }, { text: { en: "JSON files", fr: "Fichiers JSON" } }]
      - [{ text: sc_products, area: products }, { text: Tables }, { text: "adlsweb/export/products" }, { text: { en: "Parquet files", fr: "Fichiers Parquet" } }]
      - [{ text: sc_returns, area: returns }, { text: Files }, { text: "LH_Sales/Tables/returns" }, { text: { en: "Delta table", fr: "Table Delta" } }]
answer:
  values: { p1: orders, p2: products }
explanation:
  correct:
    en: |
      Only shortcuts at the top level of Tables whose target is a Delta table and whose name has no space are discovered as tables and synchronized to the SQL analytics endpoint: sc_orders meets all three conditions. Customer List fails because of the space in its name, and shortcuts in Files are never discovered as tables, even when they target a Delta table like sc_returns. sc_products is already in Tables with a valid name, so converting its Parquet files to Delta is the only change it needs.
    fr: |
      Seuls les raccourcis situés au premier niveau de Tables, dont la cible est une table Delta et dont le nom ne contient pas d'espace, sont découverts comme tables et synchronisés vers le point de terminaison d'analytique SQL : sc_orders remplit les trois conditions. Customer List échoue à cause de l'espace dans son nom, et les raccourcis de Files ne sont jamais découverts comme tables, même quand ils ciblent une table Delta comme sc_returns. sc_products est déjà dans Tables avec un nom valide : convertir ses fichiers Parquet en Delta est la seule modification nécessaire.
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
