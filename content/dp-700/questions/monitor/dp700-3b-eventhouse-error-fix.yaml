id: dp700-3b-eventhouse-error-fix
objective: "3.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse. Users report the issues shown in the answer area.

    You need to resolve each issue.

    Which action should you perform for each issue? To answer, drag the appropriate actions to the correct issues. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse. Des utilisateurs signalent les problèmes présentés dans la zone de réponse.

    Vous devez résoudre chaque problème.

    Quelle action devez-vous effectuer pour chaque problème ? Pour répondre, faites glisser les actions appropriées vers les problèmes correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: aggregate, text: { en: "Aggregate the results or return fewer rows and columns", fr: "Agréger les résultats ou renvoyer moins de lignes et de colonnes" } }
    - { id: timeout, text: { en: "Set the servertimeout option of the query", fr: "Définir l'option servertimeout de la requête" } }
    - { id: fixfile, text: { en: "Fix the source file and ingest it again", fr: "Corriger le fichier source et l'ingérer de nouveau" } }
    - { id: fixpolicy, text: { en: "Fix the update policy query so that its output matches the target table", fr: "Corriger la requête de la stratégie de mise à jour pour que sa sortie corresponde à la table cible" } }
    - { id: memory, text: { en: "Raise maxmemoryconsumptionperiterator", fr: "Relever maxmemoryconsumptionperiterator" } }
    - { id: batching, text: { en: "Lower MaximumBatchingTimeSpan in the ingestion batching policy", fr: "Réduire MaximumBatchingTimeSpan dans la stratégie de traitement par lot d'ingestion" } }
  targets:
    - { id: t1, text: { en: "A dashboard query fails with E_QUERY_RESULT_SET_TOO_LARGE.", fr: "Une requête de tableau de bord échoue avec E_QUERY_RESULT_SET_TOO_LARGE." } }
    - { id: t2, text: { en: "A query that needs eight minutes stops at the default timeout.", fr: "Une requête qui a besoin de huit minutes s'arrête au délai d'expiration par défaut." } }
    - { id: t3, text: { en: ".show ingestion failures reports Stream_ClosingQuoteMissing for a CSV file.", fr: ".show ingestion failures signale Stream_ClosingQuoteMissing pour un fichier CSV." } }
    - { id: t4, text: { en: "Rows reach the source table but not the target table, and the failures have OriginatesFromUpdatePolicy set to true.", fr: "Des lignes arrivent dans la table source mais pas dans la table cible, et les échecs ont OriginatesFromUpdatePolicy à true." } }
answer:
  mapping: { t1: aggregate, t2: timeout, t3: fixfile, t4: fixpolicy }
explanation:
  correct:
    en: |
      By default, a result set is limited to 500,000 records or 64 MB, so a dashboard should aggregate or return fewer rows and columns. Queries time out after 4 minutes by default, and servertimeout extends this up to 1 hour. Stream_ClosingQuoteMissing is a permanent failure caused by malformed CSV data. A failing non-transactional update policy leaves rows in the source only; its query must produce the columns of the target table in the same types and order.
    fr: |
      Par défaut, un jeu de résultats est limité à 500 000 enregistrements ou 64 Mo : un tableau de bord doit agréger ou renvoyer moins de lignes et de colonnes. Les requêtes expirent par défaut au bout de 4 minutes, et servertimeout prolonge ce délai jusqu'à 1 heure. Stream_ClosingQuoteMissing est un échec permanent dû à des données CSV mal formées. Une stratégie de mise à jour non transactionnelle en échec ne laisse les lignes que dans la source ; sa requête doit produire les colonnes de la table cible avec les mêmes types et le même ordre.
  options:
    memory: { en: "maxmemoryconsumptionperiterator addresses E_RUNAWAY_QUERY, which none of these issues reports.", fr: "maxmemoryconsumptionperiterator traite E_RUNAWAY_QUERY, qu'aucun de ces problèmes ne signale." }
    batching: { en: "The batching policy changes ingestion latency; it doesn't fix failed ingestions or queries.", fr: "La stratégie de traitement par lot change la latence d'ingestion ; elle ne corrige ni les ingestions ni les requêtes en échec." }
references:
  - title: Query limits
    url: https://learn.microsoft.com/en-us/kusto/concepts/query-limits?view=microsoft-fabric
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
