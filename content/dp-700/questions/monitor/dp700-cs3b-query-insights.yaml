id: dp700-cs3b-query-insights
objective: "3.3.3"
type: single
caseStudy: dp700-cs3b-woodgrove
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the performance requirement for DW-Claims. What should you query?
  fr: |
    Vous devez satisfaire l'exigence de performances relative à DW-Claims. Que devez-vous interroger ?
body:
  options:
    - { id: a, text: sys.dm_exec_requests }
    - { id: b, text: queryinsights.exec_sessions_history }
    - { id: c, text: queryinsights.frequently_run_queries }
    - { id: d, text: queryinsights.long_running_queries }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Query insights is built into every warehouse and keeps 30 days of history of the completed queries, so two weeks are covered with nothing to deploy. The queryinsights.long_running_queries view lists queries ordered by execution time, which identifies the slowest queries to tune.
    fr: |
      Query insights est intégré à chaque entrepôt et conserve 30 jours d'historique des requêtes terminées : deux semaines sont couvertes sans rien déployer. La vue queryinsights.long_running_queries liste les requêtes triées par durée d'exécution, ce qui identifie les requêtes les plus lentes à optimiser.
  options:
    a:
      en: |
        sys.dm_exec_requests shows only the requests that are running now, not the history of the previous two weeks.
      fr: |
        sys.dm_exec_requests ne montre que les requêtes en cours d'exécution, pas l'historique des deux semaines précédentes.
    b:
      en: |
        exec_sessions_history describes completed sessions, not the execution time of each query.
      fr: |
        exec_sessions_history décrit les sessions terminées, pas la durée d'exécution de chaque requête.
    c:
      en: |
        frequently_run_queries focuses on how often queries run, not on which queries took the longest.
      fr: |
        frequently_run_queries s'intéresse à la fréquence d'exécution des requêtes, pas aux requêtes les plus longues.
references:
  - title: Query insights in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights
