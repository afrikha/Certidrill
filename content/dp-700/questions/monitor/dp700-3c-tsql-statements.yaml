id: dp700-3c-tsql-statements
objective: "3.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a table named dbo.DimProduct. You plan the following T-SQL changes in DW1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée dbo.DimProduct. Vous prévoyez les modifications T-SQL suivantes dans DW1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After you add PRIMARY KEY NONCLUSTERED (ProductKey) NOT ENFORCED to dbo.DimProduct, an INSERT that duplicates an existing ProductKey value succeeds.
        fr: Après l'ajout de PRIMARY KEY NONCLUSTERED (ProductKey) NOT ENFORCED à dbo.DimProduct, un INSERT qui duplique une valeur ProductKey existante réussit.
    - id: s2
      text:
        en: A stored procedure can use SAVE TRANSACTION to roll back only the last step of an explicit transaction.
        fr: Une procédure stockée peut utiliser SAVE TRANSACTION pour annuler uniquement la dernière étape d'une transaction explicite.
    - id: s3
      text:
        en: An explicit transaction can add a nullable column to dbo.DimProduct with ALTER TABLE, run an INSERT, and roll back both changes if the INSERT fails.
        fr: Une transaction explicite peut ajouter une colonne nullable à dbo.DimProduct avec ALTER TABLE, exécuter un INSERT, et annuler les deux modifications si l'INSERT échoue.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Primary keys in a warehouse are only supported as NOT ENFORCED, so the engine does not reject duplicates; the loading process must guarantee uniqueness. Savepoints, like named and distributed transactions, are not supported. Supported DDL, such as ALTER TABLE ... ADD of a nullable column, can run in an explicit transaction, and a failure rolls back every statement of the transaction, schema changes included.
    fr: |
      Dans un entrepôt, les clés primaires ne sont prises en charge qu'avec NOT ENFORCED : le moteur ne rejette donc pas les doublons, et le processus de chargement doit garantir l'unicité. Les points d'enregistrement, comme les transactions nommées et distribuées, ne sont pas pris en charge. Le DDL pris en charge, comme ALTER TABLE ... ADD d'une colonne nullable, peut s'exécuter dans une transaction explicite, et un échec annule toutes les instructions de la transaction, modifications de schéma comprises.
references:
  - title: Transactions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/transactions
  - title: Primary keys, foreign keys, and unique keys in Warehouse in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/table-constraints
