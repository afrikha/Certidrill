id: dp700-3b-notebook-environment-order
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a notebook named NB_Forecast and a pipeline named PL_Forecast. PL_Forecast runs NB_Forecast every night by using a Notebook activity.

    The first cell of NB_Forecast runs %pip install holidays. The interactive runs succeed, but the runs of PL_Forecast fail because the holidays library can't be imported.

    You need the library to be available in every run of NB_Forecast, with consistent results from run to run. The solution must not use inline installation.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un notebook nommé NB_Forecast et un pipeline nommé PL_Forecast. PL_Forecast exécute NB_Forecast chaque nuit au moyen d'une activité Notebook.

    La première cellule de NB_Forecast exécute %pip install holidays. Les exécutions interactives réussissent, mais les exécutions de PL_Forecast échouent car la bibliothèque holidays ne peut pas être importée.

    La bibliothèque doit être disponible dans chaque exécution de NB_Forecast, avec des résultats cohérents d'une exécution à l'autre. La solution ne doit pas utiliser l'installation en ligne.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: inline, text: { en: "Add the _inlineInstallationEnabled parameter set to True to the Notebook activity.", fr: "Ajouter le paramètre _inlineInstallationEnabled défini sur True à l'activité Notebook." } }
    - { id: create, text: { en: "Create an environment in Workspace1.", fr: "Créer un environnement dans Workspace1." } }
    - { id: publish, text: { en: "Publish the environment.", fr: "Publier l'environnement." } }
    - { id: add, text: { en: "Add the holidays library from PyPI to the libraries of the environment.", fr: "Ajouter la bibliothèque holidays depuis PyPI aux bibliothèques de l'environnement." } }
    - { id: attach, text: { en: "Attach the environment to NB_Forecast and remove the %pip install cell.", fr: "Attacher l'environnement à NB_Forecast et supprimer la cellule %pip install." } }
    - { id: hc, text: { en: "Turn on high concurrency mode for pipelines running multiple notebooks.", fr: "Activer le mode haute concurrence pour les pipelines exécutant plusieurs notebooks." } }
answer:
  sequence: [ create, add, publish, attach ]
explanation:
  correct:
    en: |
      Inline commands for managing Python libraries are disabled in notebook pipeline runs by default, and %pip install can give inconsistent results from run to run. Microsoft recommends installing the library in an environment: you create the environment, add the library, publish the environment so that the libraries take effect, and then attach it to the notebook used by the pipeline.
    fr: |
      Les commandes en ligne de gestion des bibliothèques Python sont désactivées par défaut dans les exécutions de notebook par un pipeline, et %pip install peut donner des résultats incohérents d'une exécution à l'autre. Microsoft recommande d'installer la bibliothèque dans un environnement : vous créez l'environnement, ajoutez la bibliothèque, publiez l'environnement pour que les bibliothèques prennent effet, puis l'attachez au notebook utilisé par le pipeline.
  options:
    inline: { en: "This parameter re-enables inline installation, which the solution must not use.", fr: "Ce paramètre réactive l'installation en ligne, que la solution ne doit pas utiliser." }
    hc: { en: "High concurrency shares sessions between notebooks; %pip install isn't even supported in high concurrency mode.", fr: "La haute concurrence partage des sessions entre notebooks ; %pip install n'est même pas pris en charge en mode haute concurrence." }
references:
  - title: Manage Apache Spark libraries
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/library-management
