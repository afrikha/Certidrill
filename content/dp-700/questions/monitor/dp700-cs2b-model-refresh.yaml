id: dp700-cs2b-model-refresh
objective: "3.1.3"
type: single
caseStudy: dp700-cs2b-munsons
difficulty: 1
status: draft
stem:
  en: You need to meet the requirement for SM_Sales. What should you do?
  fr: Vous devez satisfaire l'exigence relative à SM_Sales. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Fix the reference to the renamed column in SM_Sales, then turn the refresh schedule of SM_Sales back on", fr: "Corriger la référence à la colonne renommée dans SM_Sales, puis réactiver la planification d'actualisation de SM_Sales" } }
    - { id: b, text: { en: "Fix the reference to the renamed column in SM_Sales, then wait for the next scheduled refresh at 06:00", fr: "Corriger la référence à la colonne renommée dans SM_Sales, puis attendre la prochaine actualisation planifiée de 06:00" } }
    - { id: c, text: { en: "Reduce the number of scheduled refreshes of SM_Sales, then run an on-demand refresh", fr: "Réduire le nombre d'actualisations planifiées de SM_Sales, puis lancer une actualisation à la demande" } }
    - { id: d, text: { en: "Take over SM_Sales, then run an on-demand refresh to restart the schedule", fr: "Prendre en charge SM_Sales, puis lancer une actualisation à la demande pour relancer la planification" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Power BI deactivates the refresh schedule of a semantic model after four consecutive failures, which is why no refresh has run since the fourth failure. You must first remove the cause of the error, here the reference to the renamed column, and then set the refresh schedule to On again; the refresh history shows the status and error message of each attempt.
    fr: |
      Power BI désactive la planification d'actualisation d'un modèle sémantique après quatre échecs consécutifs : c'est pourquoi aucune actualisation ne s'est exécutée depuis le quatrième échec. Vous devez d'abord supprimer la cause de l'erreur, ici la référence à la colonne renommée, puis réactiver la planification d'actualisation ; l'historique d'actualisation affiche l'état et le message d'erreur de chaque tentative.
  options:
    b: { en: "The schedule is deactivated, so no refresh runs at 06:00 until it is turned back on.", fr: "La planification est désactivée : aucune actualisation ne s'exécute à 06:00 tant qu'elle n'est pas réactivée." }
    c: { en: "One refresh a day is far below the 48 scheduled refreshes allowed on a capacity, and the column error would still make the refresh fail.", fr: "Une actualisation par jour est très en deçà des 48 actualisations planifiées autorisées sur une capacité, et l'erreur de colonne ferait toujours échouer l'actualisation." }
    d: { en: "Taking over changes the owner and its credentials; it neither fixes the renamed column nor turns the schedule back on.", fr: "La prise en charge change le propriétaire et ses informations d'identification ; elle ne corrige pas la colonne renommée et ne réactive pas la planification." }
references:
  - title: Configure scheduled refresh
    url: https://learn.microsoft.com/en-us/power-bi/connect-data/refresh-scheduled-refresh
