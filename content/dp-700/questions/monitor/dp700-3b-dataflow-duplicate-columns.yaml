id: dp700-3b-dataflow-duplicate-columns
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Catalog and a Dataflow Gen2 named DF_Products.

    DF_Products contains a query named Products that merges two sources. The output of Products contains a column named ProductCode from the first source and a column named productcode from the second source. The productcode column holds the supplier's own code, which no report uses. The data destination of Products is a new table in LH_Catalog.

    Each refresh of DF_Products fails with a duplicate columns error, although the query preview in the editor works.

    Which two actions can you perform to resolve the error? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Catalog et un Dataflow Gen2 nommé DF_Products.

    DF_Products contient une requête nommée Products qui fusionne deux sources. La sortie de Products contient une colonne nommée ProductCode issue de la première source et une colonne nommée productcode issue de la seconde. La colonne productcode contient le code propre au fournisseur, qu'aucun rapport n'utilise. La destination de données de Products est une nouvelle table de LH_Catalog.

    Chaque actualisation de DF_Products échoue avec une erreur de colonnes en double, alors que l'aperçu de la requête fonctionne dans l'éditeur.

    Quelles sont les deux actions qui permettent de résoudre l'erreur ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Rename the productcode column to SupplierCode in the Products query.", fr: "Renommer la colonne productcode en SupplierCode dans la requête Products." } }
    - { id: b, text: { en: "Change the update method of the destination to Append.", fr: "Remplacer la méthode de mise à jour de la destination par Append." } }
    - { id: c, text: { en: "Enable staging for the Products query.", fr: "Activer le staging pour la requête Products." } }
    - { id: d, text: { en: "Remove the productcode column from the Products query.", fr: "Supprimer la colonne productcode de la requête Products." } }
    - { id: e, text: { en: "Turn off Enable use of V-Order compression for the destination.", fr: "Désactiver Enable use of V-Order compression pour la destination." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Power Query allows column names that differ only by case, but the Delta Lake specification doesn't support case-sensitive column names, so ProductCode and productcode produce a duplicate columns error in the lakehouse table. Giving the second column a distinct name, or not writing it to the destination, leaves only one of the two names in the table.
    fr: |
      Power Query accepte des noms de colonnes qui ne diffèrent que par la casse, mais la spécification Delta Lake ne prend pas en charge les noms de colonnes sensibles à la casse : ProductCode et productcode provoquent une erreur de colonnes en double dans la table du lakehouse. Donner un nom distinct à la seconde colonne, ou ne pas l'écrire dans la destination, ne laisse qu'un des deux noms dans la table.
  options:
    b: { en: "The update method doesn't change the column names written to the Delta table.", fr: "La méthode de mise à jour ne change pas les noms de colonnes écrits dans la table Delta." }
    c: { en: "Staging changes where the query is processed; the destination table still receives two names that differ only by case.", fr: "Le staging change l'endroit où la requête est traitée ; la table de destination reçoit toujours deux noms qui ne diffèrent que par la casse." }
    e: { en: "V-Order is a write optimization of the Parquet files; it has no effect on column names.", fr: "V-Order est une optimisation de l'écriture des fichiers Parquet ; il n'a aucun effet sur les noms de colonnes." }
references:
