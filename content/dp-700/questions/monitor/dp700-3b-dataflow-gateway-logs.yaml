id: dp700-3b-dataflow-gateway-logs
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a Dataflow Gen2 named DF_ERP. DF_ERP reads data from an on-premises SQL Server database through an on-premises data gateway named GW1. You have the Member role in Workspace1 and you are an administrator of GW1.

    A refresh of DF_ERP failed. You download the detailed logs of the run, but they don't include any information collected on GW1.

    You need the detailed logs of future refreshes to include the information collected on GW1.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un Dataflow Gen2 nommé DF_ERP. DF_ERP lit les données d'une base de données SQL Server locale via une passerelle de données locale nommée GW1. Vous avez le rôle Member dans Workspace1 et vous êtes administrateur de GW1.

    Une actualisation de DF_ERP a échoué. Vous téléchargez les journaux détaillés de l'exécution, mais ils ne contiennent aucune information collectée sur GW1.

    Vous devez faire en sorte que les journaux détaillés des prochaines actualisations incluent les informations collectées sur GW1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Install the latest monthly update of GW1", fr: "Installer la dernière mise à jour mensuelle de GW1" } }
    - { id: b, text: { en: "Ask an administrator to assign you the Admin role in Workspace1", fr: "Demander à un administrateur de vous attribuer le rôle Admin dans Workspace1" } }
    - { id: c, text: { en: "Turn on Admin consent for gateway diagnostics on GW1", fr: "Activer Admin consent for gateway diagnostics sur GW1" } }
    - { id: d, text: { en: "Enable staging for the queries of DF_ERP", fr: "Activer le staging pour les requêtes de DF_ERP" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Detailed refresh logs contain the diagnostics of the Power Query mashup engine. For a dataflow refreshed through a gateway, the gateway diagnostics are included only after the Admin consent for gateway diagnostics feature is enabled at the gateway level.
    fr: |
      Les journaux d'actualisation détaillés contiennent les diagnostics du moteur mashup Power Query. Pour un dataflow actualisé via une passerelle, les diagnostics de la passerelle ne sont inclus qu'une fois la fonctionnalité Admin consent for gateway diagnostics activée au niveau de la passerelle.
  options:
    a: { en: "A supported gateway version is required to refresh, but updating it doesn't add its diagnostics to the logs.", fr: "Une version prise en charge de la passerelle est nécessaire pour actualiser, mais la mettre à jour n'ajoute pas ses diagnostics aux journaux." }
    b: { en: "The Viewer role is enough to download the detailed logs; a higher workspace role doesn't change their content.", fr: "Le rôle Viewer suffit pour télécharger les journaux détaillés ; un rôle d'espace de travail plus élevé ne change pas leur contenu." }
    d: { en: "Staging changes where the queries are processed; it has no effect on gateway diagnostics.", fr: "Le staging change l'endroit où les requêtes sont traitées ; il n'a aucun effet sur les diagnostics de la passerelle." }
references:
  - title: View refresh history and monitor your dataflows
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor
