id: dp700-3b-pipeline-activity-timeout
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_History and a pipeline named PL_Archive.

    PL_Archive contains a Copy data activity named Copy Archive that copies about 40 TB of historical files from an Azure Data Lake Storage Gen2 account to the Files section of LH_History. Copy Archive uses the default general settings.

    Every run of Copy Archive fails after exactly 12 hours with a timeout error while the copy is still in progress. Tests show that a complete copy takes about 16 hours.

    You need to ensure that Copy Archive completes.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_History et un pipeline nommé PL_Archive.

    PL_Archive contient une activité Copy data nommée Copy Archive qui copie environ 40 To de fichiers historiques d'un compte Azure Data Lake Storage Gen2 vers la section Files de LH_History. Copy Archive utilise les paramètres généraux par défaut.

    Chaque exécution de Copy Archive échoue au bout de 12 heures exactement avec une erreur de délai d'expiration, alors que la copie est toujours en cours. Des tests montrent qu'une copie complète dure environ 16 heures.

    Vous devez faire en sorte que Copy Archive aboutisse.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the General settings of Copy Archive, set Retry to 2 and Retry interval (sec) to 600", fr: "Dans les paramètres General de Copy Archive, définir Retry sur 2 et Retry interval (sec) sur 600" } }
    - { id: b, text: { en: "In the General settings of Copy Archive, set Timeout to 0.20:00:00", fr: "Dans les paramètres General de Copy Archive, définir Timeout sur 0.20:00:00" } }
    - { id: c, text: { en: "In the Settings tab of Copy Archive, select Fault tolerance", fr: "Dans l'onglet Settings de Copy Archive, sélectionner Fault tolerance" } }
    - { id: d, text: { en: "In the Settings tab of Copy Archive, select Enable staging and use Workspace staging", fr: "Dans l'onglet Settings de Copy Archive, sélectionner Enable staging et utiliser le staging Workspace" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The Timeout setting of an activity defaults to 12 hours, which is why every run stops at that point. It uses the format D.HH:MM:SS, so 0.20:00:00 gives the copy 20 hours, enough for a 16-hour run."
    fr: "Le paramètre Timeout d'une activité vaut 12 heures par défaut, ce qui explique l'arrêt de chaque exécution à ce moment-là. Il utilise le format J.HH:MM:SS : 0.20:00:00 laisse 20 heures à la copie, ce qui suffit pour une exécution de 16 heures."
  options:
    a: { en: "Each retry starts the copy again with the same 12-hour timeout, so every attempt fails in the same way.", fr: "Chaque nouvelle tentative relance la copie avec le même délai de 12 heures : chaque tentative échoue de la même façon." }
    c: { en: "Fault tolerance skips incompatible rows or files deleted during the copy; it doesn't extend how long the activity can run.", fr: "Fault tolerance ignore les lignes incompatibles ou les fichiers supprimés pendant la copie ; il ne prolonge pas la durée d'exécution autorisée de l'activité." }
    d: { en: "Staging isn't needed for a copy into lakehouse files, and Workspace staging itself times out after 60 minutes.", fr: "Le staging n'est pas nécessaire pour une copie vers les fichiers d'un lakehouse, et le staging Workspace expire lui-même au bout de 60 minutes." }
references:
  - title: Activity overview
    url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview
  - title: How to copy data using copy activity
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-data-activity
