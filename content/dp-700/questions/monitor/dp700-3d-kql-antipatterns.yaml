id: dp700-3d-kql-antipatterns
objective: "3.3.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You review the KQL queries of a Fabric eventhouse and find the following patterns:

    - A filter `where Status =~ "failed"` on a column whose values are always stored in lowercase.
    - A `let` statement that defines a costly tabular expression, which the query references three times.
    - A `summarize count() by SessionId` on a table that contains 40 million distinct SessionId values.

    You need to rewrite each pattern to reduce the resources that the queries use. The results must not change.

    What should you use for each pattern? To answer, drag the appropriate elements to the correct patterns. Each element may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les requêtes KQL d'un eventhouse Fabric et trouvez les modèles suivants :

    - Un filtre `where Status =~ "failed"` sur une colonne dont les valeurs sont toujours stockées en minuscules.
    - Une instruction `let` qui définit une expression tabulaire coûteuse, référencée trois fois par la requête.
    - Un `summarize count() by SessionId` sur une table qui contient 40 millions de valeurs distinctes de SessionId.

    Vous devez réécrire chaque modèle pour réduire les ressources utilisées par les requêtes. Les résultats ne doivent pas changer.

    Qu'est-ce qui doit être utilisé pour chaque modèle ? Pour répondre, faites glisser les éléments appropriés vers les modèles correspondants. Chaque élément peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: eq, text: "==" }
    - { id: has, text: has }
    - { id: materialize, text: materialize() }
    - { id: shufflekey, text: hint.shufflekey }
    - { id: broadcast, text: hint.strategy=broadcast }
  targets:
    - { id: t1, text: { en: "Status =~ \"failed\" on lowercase values", fr: "Status =~ \"failed\" sur des valeurs en minuscules" } }
    - { id: t2, text: { en: "let expression referenced three times", fr: "Expression let référencée trois fois" } }
    - { id: t3, text: { en: "summarize by 40 million distinct SessionId values", fr: "summarize sur 40 millions de valeurs distinctes de SessionId" } }
answer:
  mapping: { t1: eq, t2: materialize, t3: shufflekey }
explanation:
  correct:
    en: "Case-sensitive operators such as == are cheaper than =~, and when the data is already lowercase the result is the same. materialize() caches the result of a let expression that is used more than once, so it is computed once. hint.shufflekey spreads a summarize across nodes when the group-by keys have high cardinality, ideally more than one million values."
    fr: "Les opérateurs sensibles à la casse comme == coûtent moins cher que =~, et quand les données sont déjà en minuscules le résultat est identique. materialize() met en cache le résultat d'une expression let utilisée plusieurs fois : elle n'est calculée qu'une fois. hint.shufflekey répartit un summarize sur les nœuds quand les clés de regroupement ont une forte cardinalité, idéalement plus d'un million de valeurs."
  options:
    has: { en: "has searches for terms inside a string; it is not an equality comparison and could match other values.", fr: "has recherche des termes dans une chaîne ; ce n'est pas une comparaison d'égalité et il pourrait correspondre à d'autres valeurs." }
    broadcast: { en: "hint.strategy=broadcast applies to a join whose left side is small, not to summarize or let.", fr: "hint.strategy=broadcast s'applique à une jointure dont le côté gauche est petit, pas à summarize ni à let." }
references:
  - title: Best practices for Kusto Query Language queries
    url: https://learn.microsoft.com/en-us/kusto/query/best-practices?view=microsoft-fabric
