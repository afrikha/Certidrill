id: dp700-cs3a-cache-retention
objective: "3.3.4"
type: dropdown
caseStudy: dp700-cs3a-proseware
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to configure the Telemetry table to meet the data management requirement.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la table Telemetry pour respecter l'exigence de gestion des données.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    .alter-merge table Telemetry policy retention softdelete = [[ret]]

    .alter table Telemetry policy [[pol]] hot = [[hot]]
  slots:
    - id: ret
      options:
        - { id: d30, text: 30d }
        - { id: d180, text: 180d }
        - { id: d365, text: 365d }
    - id: pol
      options:
        - { id: caching, text: caching }
        - { id: retention, text: retention }
        - { id: sharding, text: sharding }
    - id: hot
      options:
        - { id: h1, text: 1d }
        - { id: h30, text: 30d }
        - { id: h365, text: 365d }
answer:
  values: { ret: d365, pol: caching, hot: h30 }
explanation:
  correct:
    en: "The retention policy removes data automatically after its soft-delete period, so `softdelete = 365d` keeps one year of telemetry. The caching policy keeps the most recent data on the local SSD of the eventhouse, so `hot = 30d` gives the best performance to queries over the last 30 days; older data stays queryable but is slower to read. The caching period must not exceed the retention period."
    fr: "La stratégie de rétention supprime automatiquement les données après leur période de suppression réversible : `softdelete = 365d` conserve un an de télémétrie. La stratégie de mise en cache garde les données les plus récentes sur le SSD local de l'eventhouse : `hot = 30d` donne les meilleures performances aux requêtes sur les 30 derniers jours ; les données plus anciennes restent interrogeables mais sont plus lentes à lire. La période de mise en cache ne doit pas dépasser la période de rétention."
  options:
    d30: { en: "As a retention value, 30d would delete the data after 30 days instead of 365.", fr: "Comme valeur de rétention, 30d supprimerait les données au bout de 30 jours au lieu de 365." }
    d180: { en: "A 180-day retention deletes the telemetry after six months instead of one year.", fr: "Une rétention de 180 jours supprime la télémétrie au bout de six mois au lieu d'un an." }
    retention: { en: "The retention policy controls deletion, not which data is kept in the hot cache.", fr: "La stratégie de rétention contrôle la suppression, pas les données conservées dans le cache chaud." }
    sharding: { en: "The sharding policy controls how data shards (extents) are created; it does not define a hot cache period.", fr: "La stratégie de sharding contrôle la création des partitions de données (extents) ; elle ne définit pas de période de cache chaud." }
    h1: { en: "A 1-day hot cache leaves 29 of the 30 required days in cold storage.", fr: "Un cache chaud d'un jour laisse 29 des 30 jours requis dans le stockage froid." }
    h365: { en: "As a hot cache value, 365d caches the whole year, which increases cost for data that is rarely queried.", fr: "Comme valeur de cache chaud, 365d met en cache toute l'année, ce qui augmente le coût pour des données rarement interrogées." }
references:
  - title: .alter table policy caching command
    url: https://learn.microsoft.com/en-us/kusto/management/alter-table-cache-policy-command?view=microsoft-fabric
  - title: .alter-merge table policy retention command
    url: https://learn.microsoft.com/en-us/kusto/management/alter-merge-table-retention-policy-command?view=microsoft-fabric
