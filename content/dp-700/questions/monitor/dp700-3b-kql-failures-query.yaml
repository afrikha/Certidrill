id: dp700-3b-kql-failures-query
objective: "3.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse. The eventhouse contains a KQL database whose tables are populated by update policies.

    You need a command that lists the ingestion failures of the last 24 hours that were raised while an update policy ran and that won't succeed if they're retried as they are.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse. L'eventhouse contient une base de données KQL dont les tables sont alimentées par des stratégies de mise à jour.

    Vous avez besoin d'une commande qui liste les échecs d'ingestion des dernières 24 heures survenus pendant l'exécution d'une stratégie de mise à jour et qui ne réussiront pas s'ils sont relancés en l'état.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    .show ingestion failures
    | where FailedOn > [[t]]
    | where OriginatesFromUpdatePolicy == [[b]] and FailureKind == "[[k]]"
    | project FailedOn, Table, ErrorCode, Details
  slots:
    - id: t
      options:
        - { id: now, text: now(1d) }
        - { id: ago, text: ago(1d) }
        - { id: raw, text: 1d }
        - { id: dt, text: datetime(1d) }
    - id: b
      options:
        - { id: "true", text: "true" }
        - { id: "false", text: "false" }
        - { id: "null", text: "null" }
    - id: k
      options:
        - { id: transient, text: Transient }
        - { id: failed, text: Failed }
        - { id: permanent, text: Permanent }
answer:
  values: { t: ago, b: "true", k: permanent }
explanation:
  correct:
    en: |
      ago(1d) returns the time 24 hours before now, so FailedOn > ago(1d) keeps the last day. OriginatesFromUpdatePolicy is true when the failure occurred while an update policy ran. FailureKind is either Permanent or Transient; Permanent failures don't succeed on retry and must be fixed first.
    fr: |
      ago(1d) renvoie l'heure qu'il était il y a 24 heures : FailedOn > ago(1d) conserve le dernier jour. OriginatesFromUpdatePolicy vaut true quand l'échec s'est produit pendant l'exécution d'une stratégie de mise à jour. FailureKind vaut Permanent ou Transient ; les échecs Permanent ne réussissent pas en cas de nouvelle tentative et doivent d'abord être corrigés.
  options:
    now: { en: "now(1d) returns a time one day in the future.", fr: "now(1d) renvoie une heure située un jour dans le futur." }
    raw: { en: "A timespan can't be compared with the datetime column FailedOn.", fr: "Une durée ne peut pas être comparée à la colonne datetime FailedOn." }
    dt: { en: "datetime() expects a date literal, not a timespan.", fr: "datetime() attend un littéral de date, pas une durée." }
    "false": { en: "false keeps the failures that didn't come from an update policy.", fr: "false conserve les échecs qui ne proviennent pas d'une stratégie de mise à jour." }
    transient: { en: "Transient failures can succeed when they're retried.", fr: "Les échecs Transient peuvent réussir lors d'une nouvelle tentative." }
    failed: { en: "Failed isn't a value of FailureKind.", fr: "Failed n'est pas une valeur de FailureKind." }
references:
  - title: .show ingestion failures command
    url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures?view=microsoft-fabric
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
