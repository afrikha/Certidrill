id: dp700-3c-dynamic-range-bounds
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric pipeline that performs a one-time historical copy of a table named dbo.Orders from an Azure SQL database to a lakehouse. dbo.Orders is a heap that has an integer column named OrderID.

    The Copy activity uses the Dynamic range partition option on OrderID with Degree of copy parallelism set to 50. Before any rows are transferred, the activity spends several minutes querying dbo.Orders.

    You need to eliminate the time that the Copy activity spends querying the source to determine the partitions.

    What should you do?
  fr: |
    Vous disposez d'un pipeline Fabric qui effectue une copie historique unique d'une table nommée dbo.Orders depuis une base de données Azure SQL vers un lakehouse. dbo.Orders est une table de tas (heap) qui possède une colonne entière nommée OrderID.

    L'activité Copy utilise l'option de partition Dynamic range sur OrderID avec Degree of copy parallelism défini sur 50. Avant tout transfert de lignes, l'activité passe plusieurs minutes à interroger dbo.Orders.

    Vous devez supprimer le temps que l'activité Copy passe à interroger la source pour déterminer les partitions.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set Intelligent throughput optimization to Maximum.", fr: "Définir Intelligent throughput optimization sur Maximum." } }
    - { id: b, text: { en: "Change the partition option to Physical partitions of table.", fr: "Changer l'option de partition en Physical partitions of table." } }
    - { id: c, text: { en: "Set Degree of copy parallelism to Auto.", fr: "Définir Degree of copy parallelism sur Auto." } }
    - { id: d, text: { en: "Specify the upper and lower bounds of OrderID in the partition settings.", fr: "Indiquer les bornes supérieure et inférieure de OrderID dans les paramètres de partition." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With Dynamic range, the bounds of the partition column are optional. When you omit them, the service first queries the source to find them, which adds time before the transfer starts. Predefining the upper and lower bounds is recommended for one-time historical loads.
    fr: |
      Avec Dynamic range, les bornes de la colonne de partition sont facultatives. Si vous les omettez, le service interroge d'abord la source pour les trouver, ce qui ajoute du temps avant le début du transfert. Prédéfinir les bornes supérieure et inférieure est recommandé pour les chargements historiques uniques.
  options:
    a:
      en: |
        ITO sets the compute available to the copy; the service still queries the source for the bounds first.
      fr: |
        ITO fixe la puissance de calcul disponible pour la copie ; le service interroge toujours la source pour trouver les bornes.
    b:
      en: |
        dbo.Orders is a heap without partitions, so physical partitions cannot split the read.
      fr: |
        dbo.Orders est une table de tas sans partitions : les partitions physiques ne peuvent pas répartir la lecture.
    c:
      en: |
        Auto changes the number of parallel copies, often to many more sessions, but the bounds are still discovered by querying the source.
      fr: |
        Auto change le nombre de copies parallèles, souvent pour beaucoup plus de sessions, mais les bornes sont toujours découvertes en interrogeant la source.
references:
  - title: Copy activity performance with SQL databases
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-performance-sql-databases
