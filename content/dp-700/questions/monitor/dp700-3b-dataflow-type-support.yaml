id: dp700-3b-dataflow-type-support
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains a lakehouse named LH1, a warehouse named DW1, and a Dataflow Gen2 named DF_Pricing. Several refreshes of DF_Pricing failed because of data type issues on its destinations.

    You review which column types the destinations accept without any conversion step in the queries.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH1, un entrepôt nommé DW1 et un Dataflow Gen2 nommé DF_Pricing. Plusieurs actualisations de DF_Pricing ont échoué à cause de problèmes de types de données sur ses destinations.

    Vous examinez les types de colonnes que les destinations acceptent sans aucune étape de conversion dans les requêtes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A column of type Currency can be loaded into a table in DW1."
        fr: "Une colonne de type Currency peut être chargée dans une table de DW1."
    - id: s2
      text:
        en: "A column of type Date/Time/Timezone can be loaded into a table in LH1."
        fr: "Une colonne de type Date/Time/Timezone peut être chargée dans une table de LH1."
    - id: s3
      text:
        en: "A column of type Currency can be loaded into a table in LH1."
        fr: "Une colonne de type Currency peut être chargée dans une table de LH1."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Currency is supported by a lakehouse destination but not by a Fabric Warehouse destination, where you convert it to a decimal type. DateTimeZone (Date/Time/Timezone) and Time aren't supported by either lakehouse or warehouse destinations.
    fr: |
      Currency est pris en charge par une destination lakehouse, mais pas par une destination Fabric Warehouse, où vous le convertissez en type décimal. DateTimeZone (Date/Time/Timezone) et Time ne sont pris en charge ni par les destinations lakehouse ni par les destinations entrepôt.
references:
  - title: Dataflow Gen2 data destinations and managed settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-and-managed-settings
