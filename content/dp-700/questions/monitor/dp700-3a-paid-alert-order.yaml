id: dp700-3a-paid-alert-order
objective: "3.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a workspace named WS-ML that contains a notebook named NB_Train. You have the Contributor role on WS-ML.

    You need to be notified by email each time a run of NB_Train succeeds or fails, whether the run is scheduled or manual. You plan to use an alert on Job events in Real-Time hub.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un espace de travail nommé WS-ML qui contient un notebook nommé NB_Train. Vous avez le rôle Contributor sur WS-ML.

    Vous devez être prévenu par e-mail chaque fois qu'une exécution de NB_Train réussit ou échoue, qu'elle soit planifiée ou manuelle. Vous prévoyez d'utiliser une alerte sur les événements de tâche (Job events) dans Real-Time hub.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: open, text: { en: "In Real-Time hub, select Fabric events, and then select Set alert for Job events.", fr: "Dans Real-Time hub, sélectionner Fabric events, puis sélectionner Set alert pour Job events." } }
    - { id: source, text: { en: "Select the ItemJobSucceeded and ItemJobFailed event types, and then select WS-ML and NB_Train as the item.", fr: "Sélectionner les types d'événements ItemJobSucceeded et ItemJobFailed, puis sélectionner WS-ML et NB_Train comme élément." } }
    - { id: action, text: { en: "Select the Send email action, and then save the rule in a new Activator item.", fr: "Sélectionner l'action Send email, puis enregistrer la règle dans un nouvel élément Activator." } }
    - { id: enable, text: { en: "In the workspace settings of WS-ML, enable workspace monitoring.", fr: "Dans les paramètres de l'espace de travail WS-ML, activer la supervision de l'espace de travail." } }
    - { id: schedule, text: { en: "Add failure notifications to the schedule of NB_Train.", fr: "Ajouter des notifications d'échec à la planification de NB_Train." } }
    - { id: eventhouse, text: { en: "Create an eventhouse in WS-ML to store the job events.", fr: "Créer un eventhouse dans WS-ML pour stocker les événements de tâche." } }
answer:
  sequence: [open, source, action]
explanation:
  correct:
    en: |
      You start from Fabric events in Real-Time hub and select Set alert for Job events. In the Monitor section, you select the event types, raised for scheduled and manual runs, and the item. In the Action section, you choose Send email, and the Save location section stores the rule in an existing or new Activator item.
    fr: |
      Vous partez de Fabric events dans Real-Time hub et sélectionnez Set alert pour Job events. Dans la section Monitor, vous sélectionnez les types d'événements, émis pour les exécutions planifiées et manuelles, et l'élément. Dans la section Action, vous choisissez Send email, et la section Save location enregistre la règle dans un élément Activator existant ou nouveau.
  options:
    enable: { en: "An alert on Job events in Real-Time hub doesn't require workspace monitoring.", fr: "Une alerte sur les événements de tâche dans Real-Time hub ne demande pas la supervision de l'espace de travail." }
    schedule: { en: "Failure notifications cover only failed scheduled runs, not successes or manual runs.", fr: "Les notifications d'échec ne couvrent que les exécutions planifiées en échec, pas les réussites ni les exécutions manuelles." }
    eventhouse: { en: "The rule reads the events directly and is stored in an Activator item; no eventhouse is needed.", fr: "La règle lit directement les événements et est stockée dans un élément Activator ; aucun eventhouse n'est nécessaire." }
references:
  - title: Set alerts on Job events in Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/set-alerts-fabric-job-events
  - title: Explore Job events in Fabric Real-Time hub
    url: https://learn.microsoft.com/en-us/fabric/real-time-hub/explore-fabric-job-events
