id: dp700-3a-paid-alert-order
objective: "3.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a workspace named WS-ML that contains a notebook named NB_Train. You have the Contributor role on WS-ML. Workspace monitoring isn't enabled.

    You need to be notified each time a run of NB_Train succeeds or fails, whether the run is scheduled or manual. You plan to use an Activator-based alert rule from the Monitor hub.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un espace de travail nommé WS-ML qui contient un notebook nommé NB_Train. Vous avez le rôle Contributor sur WS-ML. La supervision de l'espace de travail n'est pas activée.

    Vous devez être prévenu chaque fois qu'une exécution de NB_Train réussit ou échoue, qu'elle soit planifiée ou manuelle. Vous prévoyez d'utiliser une règle d'alerte basée sur Activator depuis le hub de surveillance.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: enable, text: { en: "In the workspace settings of WS-ML, select Monitoring, select Enable, and then save.", fr: "Dans les paramètres de l'espace de travail WS-ML, sélectionner Monitoring, sélectionner Enable, puis enregistrer." } }
    - { id: open, text: { en: "On the Job runs page, select the ellipsis next to NB_Train, and then select Create and manage alerts > Alerts (paid).", fr: "Dans la page Job runs, sélectionner les points de suspension à côté de NB_Train, puis Create and manage alerts > Alerts (paid)." } }
    - { id: define, text: { en: "Specify the triggering events and the recipients of the rule.", fr: "Indiquer les événements déclencheurs et les destinataires de la règle." } }
    - { id: eventhouse, text: { en: "Create an eventhouse in WS-ML to store the alerts.", fr: "Créer un eventhouse dans WS-ML pour stocker les alertes." } }
    - { id: free, text: { en: "Select Create and manage alerts > Schedule failure emails (free).", fr: "Sélectionner Create and manage alerts > Schedule failure emails (free)." } }
    - { id: schedule, text: { en: "Create a schedule for NB_Train.", fr: "Créer une planification pour NB_Train." } }
answer:
  sequence: [enable, open, define]
explanation:
  correct:
    en: |
      Activator-based alert rules depend on workspace monitoring, which you enable in the Monitoring page of the workspace settings; this provisions a monitoring item that stores the alerts. You then open Create and manage alerts > Alerts (paid) next to the item on the Job runs page, and the rule specifies the triggering events, the recipients and any automated actions.
    fr: |
      Les règles d'alerte basées sur Activator dépendent de la supervision de l'espace de travail, que vous activez dans la page Monitoring des paramètres de l'espace de travail ; cela provisionne un élément de supervision qui stocke les alertes. Vous ouvrez ensuite Create and manage alerts > Alerts (paid) à côté de l'élément dans la page Job runs, et la règle indique les événements déclencheurs, les destinataires et les éventuelles actions automatisées.
  options:
    eventhouse: { en: "The monitoring item stores the alerts; an eventhouse isn't required.", fr: "L'élément de supervision stocke les alertes ; un eventhouse n'est pas nécessaire." }
    free: { en: "Schedule failure emails cover failures of scheduled runs only, not successes or manual runs.", fr: "Les e-mails d'échec de planification ne couvrent que les échecs d'exécutions planifiées, pas les réussites ni les exécutions manuelles." }
    schedule: { en: "The rule must cover manual runs too, so a schedule isn't needed.", fr: "La règle doit aussi couvrir les exécutions manuelles : une planification n'est pas nécessaire." }
references:
  - title: Set up job alerts in the Monitor hub (preview)
    url: https://learn.microsoft.com/en-us/fabric/admin/monitoring-hub-alerts
