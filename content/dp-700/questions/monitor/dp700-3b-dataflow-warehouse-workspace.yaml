id: dp700-3b-dataflow-warehouse-workspace
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have two Fabric workspaces named WS_Ingest and WS_DW. WS_Ingest contains a Dataflow Gen2 named DF_Finance. WS_DW contains a warehouse named DW_Finance.

    DF_Finance contains a query named Ledger whose data destination is a table in DW_Finance. Staging is enabled for Ledger. The refresh of DF_Finance fails when it writes to DW_Finance.

    You verify that the connection credentials are valid and that you have the Contributor role in both workspaces.

    You need Ledger to be loaded into DW_Finance by a Dataflow Gen2.

    What should you do?
  fr: |
    Vous disposez de deux espaces de travail Fabric nommés WS_Ingest et WS_DW. WS_Ingest contient un Dataflow Gen2 nommé DF_Finance. WS_DW contient un entrepôt nommé DW_Finance.

    DF_Finance contient une requête nommée Ledger dont la destination de données est une table de DW_Finance. Le staging est activé pour Ledger. L'actualisation de DF_Finance échoue lors de l'écriture dans DW_Finance.

    Vous vérifiez que les informations d'identification de la connexion sont valides et que vous avez le rôle Contributor dans les deux espaces de travail.

    Ledger doit être chargée dans DW_Finance par un Dataflow Gen2.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Disable staging for the Ledger query", fr: "Désactiver le staging pour la requête Ledger" } }
    - { id: b, text: { en: "Change the schema option of the destination to Dynamic schema", fr: "Remplacer l'option de schéma de la destination par Dynamic schema" } }
    - { id: c, text: { en: "Create the Ledger query in a Dataflow Gen2 in WS_DW", fr: "Créer la requête Ledger dans un Dataflow Gen2 de WS_DW" } }
    - { id: d, text: { en: "Ask an administrator to assign you the Admin role in WS_DW", fr: "Demander à un administrateur de vous attribuer le rôle Admin dans WS_DW" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Loading into a warehouse requires staging, and only a warehouse in the same workspace as the dataflow is supported. DF_Finance is in WS_Ingest, so it can't write to DW_Finance; a Dataflow Gen2 in WS_DW, with staging enabled, can.
    fr: |
      Le chargement dans un entrepôt nécessite le staging, et seul un entrepôt situé dans le même espace de travail que le dataflow est pris en charge. DF_Finance se trouve dans WS_Ingest : il ne peut pas écrire dans DW_Finance, alors qu'un Dataflow Gen2 de WS_DW, avec le staging activé, le peut.
  options:
    a: { en: "Staging is required before writing to a warehouse; disabling it only adds a warning.", fr: "Le staging est obligatoire avant l'écriture dans un entrepôt ; le désactiver ne fait qu'ajouter un avertissement." }
    b: { en: "A warehouse destination supports only Fixed schema, and the schema isn't the cause of the failure.", fr: "Une destination entrepôt ne prend en charge que Fixed schema, et le schéma n'est pas la cause de l'échec." }
    d: { en: "Contributor is enough to load data; the limitation comes from the workspace of the dataflow, not from your role.", fr: "Contributor suffit pour charger des données ; la limitation vient de l'espace de travail du dataflow, pas de votre rôle." }
references:
  - title: Dataflow Gen2 data destinations and managed settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-and-managed-settings
