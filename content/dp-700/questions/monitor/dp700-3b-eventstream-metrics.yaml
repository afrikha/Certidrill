id: dp700-3b-eventstream-metrics
objective: "3.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventstream named ES_Payments. ES_Payments has an Azure Event Hubs source and an eventhouse destination that uses Event processing before ingestion. Some payments are missing from the eventhouse.

    You need to choose which Data insights metric to review for each investigation.

    Which metric should you review for each investigation? To answer, drag the appropriate metrics to the correct investigations. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventstream nommé ES_Payments. ES_Payments possède une source Azure Event Hubs et une destination eventhouse qui utilise Event processing before ingestion. Certains paiements sont absents de l'eventhouse.

    Vous devez choisir la métrique Data insights à examiner pour chaque investigation.

    Quelle métrique devez-vous examiner pour chaque investigation ? Pour répondre, faites glisser les métriques appropriées vers les investigations correspondantes. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: deser, text: Deserialization errors }
    - { id: conv, text: Data conversion errors }
    - { id: backlog, text: Backlogged input events }
    - { id: watermark, text: Watermark delay }
    - { id: runtime, text: Runtime errors }
    - { id: bytes, text: Input event bytes }
  targets:
    - { id: t1, text: { en: "Check whether incoming events can be read with the data format selected for the source", fr: "Vérifier si les événements entrants peuvent être lus avec le format de données sélectionné pour la source" } }
    - { id: t2, text: { en: "Check whether output events fit the schema expected by the destination", fr: "Vérifier si les événements de sortie correspondent au schéma attendu par la destination" } }
    - { id: t3, text: { en: "Check whether events pile up in the eventstream engine before they're processed", fr: "Vérifier si des événements s'accumulent dans le moteur de l'eventstream avant d'être traités" } }
    - { id: t4, text: { en: "Check how far the output lags behind the wall-clock time", fr: "Vérifier l'ampleur du retard de la sortie par rapport à l'heure réelle" } }
answer:
  mapping: { t1: deser, t2: conv, t3: backlog, t4: watermark }
explanation:
  correct:
    en: |
      Deserialization errors counts input events that the engine can't deserialize, typically because the selected format doesn't match the events. Data conversion errors counts output events that can't be converted to the expected output schema. Backlogged input events counts the events waiting in the engine. Watermark delay is the wall-clock time minus the largest watermark across the partitions.
    fr: |
      Deserialization errors compte les événements d'entrée que le moteur ne peut pas désérialiser, généralement parce que le format sélectionné ne correspond pas aux événements. Data conversion errors compte les événements de sortie qui ne peuvent pas être convertis dans le schéma de sortie attendu. Backlogged input events compte les événements en attente dans le moteur. Watermark delay est l'heure réelle moins le plus grand filigrane (watermark) de toutes les partitions.
  options:
    runtime: { en: "Runtime errors is the total of processing errors; it doesn't isolate any of these causes.", fr: "Runtime errors est le total des erreurs de traitement ; il n'isole aucune de ces causes." }
    bytes: { en: "Input event bytes measures the volume pulled from the source, not errors or delays.", fr: "Input event bytes mesure le volume extrait de la source, pas des erreurs ou des retards." }
references:
  - title: Monitor the Status and Performance of an Eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor
