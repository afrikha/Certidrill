id: dp700-3c-shortcut-space-name
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have two lakehouses named LH_Bronze and LH_Gold in the same workspace. LH_Bronze contains a Delta table named customer_master.

    In the Tables folder of LH_Gold, you create a shortcut named **Customer Master** that targets the customer_master table. The shortcut does not appear as a table in LH_Gold, and it cannot be queried from the SQL analytics endpoint of LH_Gold. Other shortcuts to LH_Bronze tables work.

    You need the shortcut to be available as a table in LH_Gold.

    What should you do?
  fr: |
    Vous disposez de deux lakehouses nommés LH_Bronze et LH_Gold dans le même espace de travail. LH_Bronze contient une table Delta nommée customer_master.

    Dans le dossier Tables de LH_Gold, vous créez un raccourci nommé **Customer Master** qui cible la table customer_master. Le raccourci n'apparaît pas comme une table dans LH_Gold et ne peut pas être interrogé depuis le point de terminaison d'analytique SQL de LH_Gold. Les autres raccourcis vers des tables de LH_Bronze fonctionnent.

    Le raccourci doit être disponible comme table dans LH_Gold.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Recreate the shortcut in a subfolder of Tables named customers.", fr: "Recréer le raccourci dans un sous-dossier de Tables nommé customers." } }
    - { id: b, text: { en: "Recreate the shortcut with a name that contains no space, such as customer_master.", fr: "Recréer le raccourci avec un nom sans espace, par exemple customer_master." } }
    - { id: c, text: { en: "Run OPTIMIZE on customer_master in LH_Bronze, and then refresh the endpoint metadata.", fr: "Exécuter OPTIMIZE sur customer_master dans LH_Bronze, puis actualiser les métadonnées du point de terminaison." } }
    - { id: d, text: { en: "Recreate the shortcut in the Files folder of LH_Gold with the same name.", fr: "Recréer le raccourci dans le dossier Files de LH_Gold avec le même nom." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Delta does not support space characters in table names, so OneLake does not recognize a shortcut whose name contains a space as a Delta table. A shortcut with the same target and a name such as customer_master is discovered as a table and synchronized to the SQL analytics endpoint.
    fr: |
      Delta ne prend pas en charge les espaces dans les noms de table : OneLake ne reconnaît donc pas comme table Delta un raccourci dont le nom contient un espace. Un raccourci avec la même cible et un nom comme customer_master est découvert comme table et synchronisé vers le point de terminaison d'analytique SQL.
  options:
    a:
      en: |
        Shortcuts in the Tables folder are supported only at the top level, not in subfolders.
      fr: |
        Les raccourcis du dossier Tables ne sont pris en charge qu'au premier niveau, pas dans des sous-dossiers.
    c:
      en: |
        The target table works through other shortcuts, so its files are not the problem; the name of this shortcut is.
      fr: |
        La table cible fonctionne par d'autres raccourcis : ses fichiers ne sont pas en cause, c'est le nom de ce raccourci qui l'est.
    d:
      en: |
        Table discovery does not happen in the Files folder, so the shortcut would still not appear as a table.
      fr: |
        La découverte des tables n'a pas lieu dans le dossier Files : le raccourci n'apparaîtrait toujours pas comme une table.
references:
  - title: Unify Data Sources With OneLake Shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
