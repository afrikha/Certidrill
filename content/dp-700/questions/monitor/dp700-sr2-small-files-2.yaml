stem:
  en: You run OPTIMIZE on the table once.
  fr: Vous exécutez OPTIMIZE sur la table une fois.
body:
  solution:
    en: |
      You run `OPTIMIZE device_events` once.
    fr: |
      Vous exécutez `OPTIMIZE device_events` une fois.
answer: { value: false }
explanation:
  correct:
    en: |
      A single `OPTIMIZE` compacts the files that exist today, but the stream keeps appending a small micro-batch every minute. Without auto compaction or a recurring maintenance job, which the requirements exclude, the small files accumulate again.
    fr: |
      Un seul `OPTIMIZE` compacte les fichiers qui existent aujourd'hui, mais le flux continue d'ajouter un petit micro-lot chaque minute. Sans compactage automatique ni travail de maintenance récurrent, que les exigences excluent, les petits fichiers s'accumulent à nouveau.
references:
  - title: Compacting Delta tables
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/table-compaction
