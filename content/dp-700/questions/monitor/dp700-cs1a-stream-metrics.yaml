id: dp700-cs1a-stream-metrics
objective: "3.1.2"
type: single
caseStudy: dp700-cs1a-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |-
    You need to meet the monitoring requirement for the scoring stream. What should the data engineers use?
  fr: |-
    Vous devez satisfaire l'exigence de supervision concernant le flux d'évaluation. Que doivent utiliser les ingénieurs données ?
body:
  options:
    - { id: a, text: { en: "The Microsoft Fabric Capacity Metrics app", fr: "L'application Microsoft Fabric Capacity Metrics" } }
    - { id: b, text: { en: "The Structured Streaming tab in the Monitoring hub", fr: "L'onglet de streaming structuré du hub de supervision" } }
    - { id: c, text: { en: "The .show ingestion failures command in KDB_Ops", fr: "La commande .show ingestion failures dans KDB_Ops" } }
    - { id: d, text: { en: "The run history of a pipeline that starts the stream", fr: "L'historique des exécutions d'un pipeline qui démarre le flux" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The Fabric Monitoring hub provides a Structured Streaming tab for Spark streaming applications. It shows metrics such as the input rate, the process rate, the input rows, the batch duration and the operation duration.
    fr: |-
      Le hub de supervision Fabric propose un onglet de streaming structuré pour les applications de streaming Spark. Il affiche des métriques comme le taux d'entrée, le taux de traitement, les lignes d'entrée, la durée de traitement par lot et la durée de l'opération.
  options:
    a:
      en: |-
        The Capacity Metrics app reports capacity unit consumption and throttling by item, not the per-batch metrics of a stream.
      fr: |-
        L'application Capacity Metrics indique la consommation d'unités de capacité et la limitation par élément, pas les métriques par lot d'un flux.
    c:
      en: |-
        This command lists failed ingestion operations in a KQL database; the scoring stream writes to a lakehouse, not to KDB_Ops.
      fr: |-
        Cette commande liste les opérations d'ingestion ayant échoué dans une base de données KQL ; le flux d'évaluation écrit dans un lakehouse, pas dans KDB_Ops.
    d:
      en: |-
        A pipeline run history shows the status and duration of activity runs, not the input rate or batch duration of a running stream.
      fr: |-
        L'historique des exécutions d'un pipeline affiche l'état et la durée des exécutions d'activités, pas le taux d'entrée ni la durée de traitement par lot d'un flux en cours.
references:
  - title: Data streaming into a lakehouse with Spark
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data
