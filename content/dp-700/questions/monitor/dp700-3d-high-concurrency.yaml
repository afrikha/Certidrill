id: dp700-3d-high-concurrency
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named WS3. The default pool of WS3 is a custom Spark pool that uses Large nodes, and each new session takes about three minutes to start.

    A data engineer named User1 works interactively in four notebooks of WS3. The four notebooks use the same default lakehouse, the same Spark compute settings and the same libraries. User1 waits for a new session every time they switch to another notebook.

    You need to reduce the time User1 waits when switching notebooks. The solution must minimize the capacity units consumed and must not change the pool.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS3. Le pool par défaut de WS3 est un pool Spark personnalisé qui utilise des nœuds Large, et chaque nouvelle session met environ trois minutes à démarrer.

    Un ingénieur de données nommé User1 travaille de manière interactive dans quatre notebooks de WS3. Les quatre notebooks utilisent le même lakehouse par défaut, les mêmes paramètres de calcul Spark et les mêmes bibliothèques. User1 attend une nouvelle session chaque fois qu'il passe à un autre notebook.

    Vous devez réduire le temps d'attente de User1 lors du passage d'un notebook à l'autre. La solution doit réduire au minimum les unités de capacité consommées et ne doit pas modifier le pool.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the native execution engine in the environment of the notebooks.", fr: "Activer le moteur d'exécution natif dans l'environnement des notebooks." } }
    - { id: b, text: { en: "Start a high concurrency session and attach the four notebooks to it.", fr: "Démarrer une session à haute concurrence et y attacher les quatre notebooks." } }
    - { id: c, text: { en: "Publish the environment of the notebooks in Full mode.", fr: "Publier l'environnement des notebooks en mode Full." } }
    - { id: d, text: { en: "Set the resource profile of the notebooks to readHeavyForSpark.", fr: "Définir le profil de ressources des notebooks sur readHeavyForSpark." } }
answer: { optionId: b }
explanation:
  correct:
    en: "High concurrency mode lets up to five notebooks of the same user, with the same default lakehouse, Spark compute configuration and libraries, share one running Spark session. The attached notebooks run immediately instead of starting their own session. Only the notebook that started the shared session is billed for Spark compute."
    fr: "Le mode haute concurrence permet à jusqu'à cinq notebooks du même utilisateur, avec le même lakehouse par défaut, la même configuration de calcul Spark et les mêmes bibliothèques, de partager une session Spark en cours. Les notebooks attachés s'exécutent immédiatement au lieu de démarrer leur propre session. Seul le notebook qui a démarré la session partagée est facturé pour le calcul Spark."
  options:
    a: { en: "The native execution engine accelerates queries once the session runs; each notebook still starts its own session.", fr: "Le moteur d'exécution natif accélère les requêtes une fois la session lancée ; chaque notebook démarre toujours sa propre session." }
    c: { en: "Full mode adds one to three minutes at session startup on a regular pool; it does not let notebooks share a session.", fr: "Le mode Full ajoute une à trois minutes au démarrage de session sur un pool standard ; il ne permet pas aux notebooks de partager une session." }
    d: { en: "A resource profile tunes write and read settings; it does not change how sessions start.", fr: "Un profil de ressources règle les paramètres d'écriture et de lecture ; il ne change pas le démarrage des sessions." }
references:
  - title: High concurrency mode in Apache Spark compute for Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/high-concurrency-overview
  - title: Configure high concurrency mode for Fabric notebooks
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-high-concurrency-session-notebooks
