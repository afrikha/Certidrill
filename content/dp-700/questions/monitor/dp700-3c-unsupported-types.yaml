id: dp700-3c-unsupported-types
objective: "3.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are migrating a table from a SQL Server database to a Fabric warehouse named DW1. The CREATE TABLE statement fails in DW1 because four columns use data types that Fabric Data Warehouse does not support in tables.

    You need to replace each data type with the type that Microsoft recommends for Fabric Data Warehouse.

    Which data type should you use for each column? To answer, drag the appropriate data types to the correct columns. Each data type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous migrez une table d'une base de données SQL Server vers un entrepôt Fabric nommé DW1. L'instruction CREATE TABLE échoue dans DW1, car quatre colonnes utilisent des types de données que Fabric Data Warehouse ne prend pas en charge dans les tables.

    Vous devez remplacer chaque type de données par le type que Microsoft recommande pour Fabric Data Warehouse.

    Quel type de données devez-vous utiliser pour chaque colonne ? Pour répondre, faites glisser les types de données appropriés vers les colonnes correspondantes. Chaque type de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dec, text: "decimal(19,4)" }
    - { id: dt2, text: "datetime2(3)" }
    - { id: vch, text: "varchar(200)" }
    - { id: sint, text: smallint }
    - { id: nch, text: "nchar(200)" }
    - { id: dto, text: datetimeoffset }
    - { id: bigint, text: bigint }
  targets:
    - { id: t_money, text: "UnitPrice money" }
    - { id: t_datetime, text: "OrderTime datetime" }
    - { id: t_nvarchar, text: "ProductName nvarchar(200)" }
    - { id: t_tinyint, text: "Priority tinyint" }
answer:
  mapping: { t_money: dec, t_datetime: dt2, t_nvarchar: vch, t_tinyint: sint }
explanation:
  correct:
    en: |
      money is replaced by decimal, datetime by datetime2 (up to six fractional digits), nvarchar by varchar because Parquet has no Unicode string type (UTF-8 collations store Unicode text in varchar), and tinyint by smallint. nchar and datetimeoffset are themselves unsupported in tables, and bigint is larger than needed for values that fit in tinyint.
    fr: |
      money est remplacé par decimal, datetime par datetime2 (jusqu'à six chiffres fractionnaires), nvarchar par varchar, car Parquet n'a pas de type de chaîne Unicode (les classements UTF-8 stockent le texte Unicode en varchar), et tinyint par smallint. nchar et datetimeoffset ne sont eux-mêmes pas pris en charge dans les tables, et bigint est plus grand que nécessaire pour des valeurs qui tiennent dans un tinyint.
references:
  - title: Data types in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/data-types
