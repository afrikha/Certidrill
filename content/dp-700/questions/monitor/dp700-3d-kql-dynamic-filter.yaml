id: dp700-3d-kql-dynamic-filter
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have a KQL database in a Fabric eventhouse. A table named Events contains 15 billion rows. Its Properties column is of type dynamic and stores a JSON property bag that includes a TenantId key. Each tenant ID appears in only a tiny fraction of the rows.

    An analyst runs the following query:

    ```kusto
    Events
    | where Timestamp > ago(7d)
    | where Properties.TenantId == "t-78213"
    ```

    You need to rewrite the second filter so that the query returns the same rows and uses the fewest resources.

    Which filter should you use?
  fr: |
    Vous disposez d'une base de données KQL dans un eventhouse Fabric. Une table nommée Events contient 15 milliards de lignes. Sa colonne Properties est de type dynamic et stocke un sac de propriétés JSON qui contient une clé TenantId. Chaque ID de locataire n'apparaît que dans une infime partie des lignes.

    Un analyste exécute la requête suivante :

    ```kusto
    Events
    | where Timestamp > ago(7d)
    | where Properties.TenantId == "t-78213"
    ```

    Vous devez réécrire le deuxième filtre pour que la requête renvoie les mêmes lignes en utilisant le moins de ressources possible.

    Quel filtre devez-vous utiliser ?
body:
  options:
    - { id: a, text: "| extend Tenant = tostring(Properties.TenantId) | where Tenant == \"t-78213\"" }
    - { id: b, text: "| where Properties.TenantId =~ \"t-78213\"" }
    - { id: c, text: "| where tostring(Properties.TenantId) contains \"t-78213\"" }
    - { id: d, text: "| where Properties has \"t-78213\" | where Properties.TenantId == \"t-78213\"" }
answer: { optionId: d }
explanation:
  correct:
    en: "For a rare value in a dynamic column, first filter with has on the whole column: the term index discards most records without parsing the JSON. The second filter then parses only the remaining rows and keeps the exact match on TenantId, so the result is unchanged."
    fr: "Pour une valeur rare dans une colonne dynamic, filtrez d'abord avec has sur toute la colonne : l'index de termes écarte la plupart des enregistrements sans analyser le JSON. Le second filtre n'analyse ensuite que les lignes restantes et conserve la correspondance exacte sur TenantId : le résultat est inchangé."
  options:
    a: { en: "Filtering on a calculated column still extracts the key from every row and cannot use the index.", fr: "Filtrer sur une colonne calculée extrait toujours la clé de chaque ligne et ne peut pas utiliser l'index." }
    b: { en: "A case-insensitive comparison is more expensive, can return other rows, and still parses every row.", fr: "Une comparaison insensible à la casse coûte plus cher, peut renvoyer d'autres lignes et analyse toujours chaque ligne." }
    c: { en: "contains scans substrings, parses every row and can match longer tenant IDs.", fr: "contains recherche des sous-chaînes, analyse chaque ligne et peut correspondre à des ID de locataire plus longs." }
references:
  - title: Best practices for Kusto Query Language queries
    url: https://learn.microsoft.com/en-us/kusto/query/best-practices?view=microsoft-fabric
