id: dp700-3d-resource-profile
objective: "3.3.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace that was created recently. Its notebooks use an environment named Env1 that keeps the default resource profile of new workspaces.

    A notebook named NB2 writes Delta tables that are queried mainly by Power BI. You need NB2 to write these tables with V-Order and optimized write. The solution must not change Env1 and must not affect the other notebooks.

    How should you complete the first cell of NB2? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric créé récemment. Ses notebooks utilisent un environnement nommé Env1 qui conserve le profil de ressources par défaut des nouveaux espaces de travail.

    Un notebook nommé NB2 écrit des tables Delta interrogées principalement par Power BI. NB2 doit écrire ces tables avec V-Order et l'écriture optimisée. La solution ne doit pas modifier Env1 ni affecter les autres notebooks.

    Comment devez-vous compléter la première cellule de NB2 ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    spark.conf.set("[[key]]", "[[value]]")
  slots:
    - id: key
      options:
        - { id: profile, text: spark.fabric.resourceProfile }
        - { id: vorder, text: spark.sql.parquet.vorder.default }
        - { id: native, text: spark.native.enabled }
        - { id: binsize, text: spark.databricks.delta.optimizeWrite.binSize }
    - id: value
      options:
        - { id: pbi, text: readHeavyForPBI }
        - { id: rspark, text: readHeavyForSpark }
        - { id: write, text: writeHeavy }
        - { id: custom, text: custom }
answer:
  values: { key: profile, value: pbi }
explanation:
  correct:
    en: "New workspaces use the writeHeavy profile, in which V-Order is disabled. The readHeavyForPBI profile enables V-Order and optimized write with 1 GB bins, which suits tables read by Power BI. Setting spark.fabric.resourceProfile with spark.conf.set applies to the current session only and takes precedence over the environment configuration."
    fr: "Les nouveaux espaces de travail utilisent le profil writeHeavy, dans lequel V-Order est désactivé. Le profil readHeavyForPBI active V-Order et l'écriture optimisée avec des lots de 1 Go, ce qui convient aux tables lues par Power BI. Définir spark.fabric.resourceProfile avec spark.conf.set ne s'applique qu'à la session en cours et prévaut sur la configuration de l'environnement."
  options:
    vorder: { en: "This property controls V-Order only, and a profile name is not a valid value for it.", fr: "Cette propriété ne contrôle que V-Order, et un nom de profil n'est pas une valeur valide pour elle." }
    native: { en: "This property turns on the native execution engine; it does not set V-Order or optimized write.", fr: "Cette propriété active le moteur d'exécution natif ; elle ne définit ni V-Order ni l'écriture optimisée." }
    binsize: { en: "This property only sets the size of optimized write bins.", fr: "Cette propriété ne définit que la taille des lots de l'écriture optimisée." }
    rspark: { en: "readHeavyForSpark enables optimized write with 128 MB bins but leaves V-Order off.", fr: "readHeavyForSpark active l'écriture optimisée avec des lots de 128 Mo, mais laisse V-Order désactivé." }
    write: { en: "writeHeavy is the current default, with V-Order disabled.", fr: "writeHeavy est le profil par défaut actuel, avec V-Order désactivé." }
    custom: { en: "A custom profile only contains the settings that you define yourself.", fr: "Un profil personnalisé ne contient que les paramètres que vous définissez vous-même." }
references:
  - title: Configure resource profile configurations in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-resource-profile-configurations
