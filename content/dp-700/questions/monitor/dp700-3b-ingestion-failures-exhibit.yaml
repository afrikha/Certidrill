id: dp700-3b-ingestion-failures-exhibit
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse. The eventhouse contains a KQL database that has two tables named RawOrders and RawShipments, both loaded by queued ingestion from files in Azure Storage.

    You run .show ingestion failures and receive the output shown in the Ingestion failures exhibit.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse. L'eventhouse contient une base de données KQL qui comporte deux tables nommées RawOrders et RawShipments, toutes deux chargées par ingestion en file d'attente depuis des fichiers de Stockage Azure.

    Vous exécutez .show ingestion failures et obtenez la sortie présentée dans la pièce Ingestion failures.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
exhibits:
  - id: failures
    title: Ingestion failures
    body: |
      | FailedOn | Table | FailureKind | ErrorCode | OriginatesFromUpdatePolicy |
      | --- | --- | --- | --- | --- |
      | 2026-11-16 02:10 | RawOrders | Permanent | Stream_ClosingQuoteMissing | false |
      | 2026-11-16 04:40 | RawShipments | Permanent | Download_Forbidden | false |
body:
  choose: 2
  options:
    - { id: a, text: { en: "The RawOrders failure is caused by malformed CSV data in the source file.", fr: "L'échec de RawOrders est dû à des données CSV mal formées dans le fichier source." } }
    - { id: b, text: { en: "Both failures will succeed if the ingestion service retries them without any change.", fr: "Les deux échecs réussiront si le service d'ingestion les relance sans aucune modification." } }
    - { id: c, text: { en: "The RawShipments failure is caused by the source storage refusing access to the file.", fr: "L'échec de RawShipments est dû au refus d'accès au fichier par le stockage source." } }
    - { id: d, text: { en: "The RawOrders failure occurred while an update policy of RawOrders ran.", fr: "L'échec de RawOrders s'est produit pendant l'exécution d'une stratégie de mise à jour de RawOrders." } }
    - { id: e, text: { en: "These records remain available in .show ingestion failures for 90 days.", fr: "Ces enregistrements restent disponibles dans .show ingestion failures pendant 90 jours." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Stream_ClosingQuoteMissing indicates a CSV value with an opening quote and no closing quote, so the file must be fixed and ingested again. Download_Forbidden means that the ingestion couldn't download the source file because access was denied, so the permissions on the storage must be fixed.
    fr: |
      Stream_ClosingQuoteMissing indique une valeur CSV avec un guillemet ouvrant sans guillemet fermant : le fichier doit être corrigé puis ingéré de nouveau. Download_Forbidden signifie que l'ingestion n'a pas pu télécharger le fichier source parce que l'accès a été refusé : les autorisations sur le stockage doivent être corrigées.
  options:
    b: { en: "Both failures are Permanent: retrying the same file with the same access fails again.", fr: "Les deux échecs sont de type Permanent : relancer le même fichier avec le même accès échoue de nouveau." }
    d: { en: "OriginatesFromUpdatePolicy is false for both rows, so the failures didn't come from an update policy.", fr: "OriginatesFromUpdatePolicy vaut false pour les deux lignes : les échecs ne proviennent pas d'une stratégie de mise à jour." }
    e: { en: "Ingestion failures are kept for 14 days.", fr: "Les échecs d'ingestion sont conservés 14 jours." }
references:
  - title: .show ingestion failures command
    url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures?view=microsoft-fabric
