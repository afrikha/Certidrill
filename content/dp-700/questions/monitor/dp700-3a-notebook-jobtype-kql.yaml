id: dp700-3a-notebook-jobtype-kql
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a workspace named WS-Transform that contains 15 notebooks. Some notebooks are run by pipelines, some on a schedule, and some interactively by data engineers. Workspace monitoring is enabled for WS-Transform.

    You need a KQL query that returns, for the last seven days, the average duration of each notebook for the completed runs that were started by a pipeline only.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un espace de travail nommé WS-Transform qui contient 15 notebooks. Certains notebooks sont exécutés par des pipelines, certains selon une planification et certains de manière interactive par des ingénieurs données. La supervision de l'espace de travail est activée pour WS-Transform.

    Vous avez besoin d'une requête KQL qui renvoie, pour les sept derniers jours, la durée moyenne de chaque notebook pour les seules exécutions terminées qui ont été démarrées par un pipeline.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    ItemJobEventLogs
    | where Timestamp > ago(7d)
    | where JobType == "[[type]]" and JobStatus == "Completed"
    | summarize AvgDurationMs = [[agg]](DurationMs) by [[by]]
  slots:
    - id: type
      options:
        - { id: run, text: RunNotebook }
        - { id: inter, text: RunNotebookInteractive }
        - { id: pipe, text: PipelineRunNotebook }
        - { id: livy, text: LivyBatch }
    - id: agg
      options:
        - { id: sum, text: sum }
        - { id: avg, text: avg }
        - { id: max, text: max }
    - id: by
      options:
        - { id: name, text: ItemName }
        - { id: inst, text: JobInstanceId }
        - { id: principal, text: ExecutingPrincipalId }
answer:
  values: { type: pipe, agg: avg, by: name }
explanation:
  correct:
    en: |
      For notebooks, `ItemJobEventLogs` uses the job types RunNotebook, RunNotebookInteractive and PipelineRunNotebook; PipelineRunNotebook identifies the runs started by a pipeline. `avg(DurationMs)` grouped by `ItemName` returns one average duration per notebook.
    fr: |
      Pour les notebooks, `ItemJobEventLogs` utilise les types de tâche RunNotebook, RunNotebookInteractive et PipelineRunNotebook ; PipelineRunNotebook identifie les exécutions démarrées par un pipeline. `avg(DurationMs)` regroupé par `ItemName` renvoie une durée moyenne par notebook.
  options:
    run: { en: "RunNotebook is a notebook job that isn't started by a pipeline, such as a scheduled run.", fr: "RunNotebook est une tâche de notebook qui n'est pas démarrée par un pipeline, comme une exécution planifiée." }
    inter: { en: "RunNotebookInteractive is an interactive session of a data engineer.", fr: "RunNotebookInteractive est une session interactive d'un ingénieur données." }
    livy: { en: "LivyBatch is a job type of lakehouses, not of notebooks.", fr: "LivyBatch est un type de tâche des lakehouses, pas des notebooks." }
    sum: { en: "sum returns the total time spent, not the average duration.", fr: "sum renvoie le temps total passé, pas la durée moyenne." }
    max: { en: "max returns the longest run, not the average duration.", fr: "max renvoie l'exécution la plus longue, pas la durée moyenne." }
    inst: { en: "Grouping by JobInstanceId returns one row per run instead of one row per notebook.", fr: "Le regroupement par JobInstanceId renvoie une ligne par exécution au lieu d'une ligne par notebook." }
    principal: { en: "Grouping by ExecutingPrincipalId returns one row per identity that ran the jobs.", fr: "Le regroupement par ExecutingPrincipalId renvoie une ligne par identité qui a exécuté les tâches." }
references:
  - title: Monitor Fabric items with item job event logs
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/item-job-event-logs
