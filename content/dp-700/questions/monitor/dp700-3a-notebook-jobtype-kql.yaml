id: dp700-3a-notebook-jobtype-kql
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a warehouse named DW_Transform. Every night, a pipeline runs stored procedures that transform the staging tables of DW_Transform by using UPDATE statements. Some statements fail or are canceled and are run again. You have the Contributor role on the workspace.

    You need a query that returns, for the last seven days, the average duration of the UPDATE statements that completed successfully, with one row for each query shape.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un entrepôt nommé DW_Transform. Chaque nuit, un pipeline exécute des procédures stockées qui transforment les tables de transit de DW_Transform avec des instructions UPDATE. Certaines instructions échouent ou sont annulées, puis sont exécutées à nouveau. Vous avez le rôle Contributor sur l'espace de travail.

    Vous avez besoin d'une requête qui renvoie, pour les sept derniers jours, la durée moyenne des instructions UPDATE terminées avec succès, avec une ligne par forme de requête.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT query_hash, COUNT(*) AS Runs, AVG([[dur]]) AS AvgDurationMs
    FROM [[src]]
    WHERE start_time >= DATEADD(day, -7, GETUTCDATE())
      AND statement_type = 'UPDATE'
      AND status = [[status]]
    GROUP BY [[grp]];
  slots:
    - id: src
      options:
        - { id: sessions, text: queryinsights.exec_sessions_history }
        - { id: requests, text: queryinsights.exec_requests_history }
        - { id: frequent, text: queryinsights.frequently_run_queries }
    - id: dur
      options:
        - { id: cpu, text: allocated_cpu_time_ms }
        - { id: elapsed, text: total_elapsed_time_ms }
        - { id: rows, text: row_count }
    - id: status
      options:
        - { id: completed, text: "'Completed'" }
        - { id: succeeded, text: "'Succeeded'" }
        - { id: success, text: "'Success'" }
    - id: grp
      options:
        - { id: stmt, text: distributed_statement_id }
        - { id: hash, text: query_hash }
        - { id: session, text: session_id }
answer:
  values: { src: requests, dur: elapsed, status: succeeded, grp: hash }
explanation:
  correct:
    en: |
      `queryinsights.exec_requests_history` has one row per completed request, with `statement_type`, `status` and `total_elapsed_time_ms`. The `status` column takes the values Succeeded, Failed or Canceled, so `'Succeeded'` keeps the successful runs. Grouping by `query_hash`, which identifies queries of the same shape, returns one average per shape.
    fr: |
      `queryinsights.exec_requests_history` contient une ligne par requête terminée, avec `statement_type`, `status` et `total_elapsed_time_ms`. La colonne `status` prend les valeurs Succeeded, Failed ou Canceled : `'Succeeded'` garde donc les exécutions réussies. Le regroupement par `query_hash`, qui identifie les requêtes de même forme, renvoie une moyenne par forme.
  options:
    sessions: { en: "exec_sessions_history describes completed sessions, not individual statements.", fr: "exec_sessions_history décrit les sessions terminées, pas les instructions une par une." }
    frequent: { en: "frequently_run_queries is an aggregated view of frequent queries; it isn't filtered on each run's start time and status.", fr: "frequently_run_queries est une vue agrégée des requêtes fréquentes ; elle ne se filtre pas sur l'heure de début et le statut de chaque exécution." }
    cpu: { en: "allocated_cpu_time_ms is the CPU time allocated to the query, not its duration.", fr: "allocated_cpu_time_ms est le temps processeur alloué à la requête, pas sa durée." }
    rows: { en: "row_count is the number of rows retrieved, not a duration.", fr: "row_count est le nombre de lignes récupérées, pas une durée." }
    completed: { en: "Completed isn't a value of the status column of query insights.", fr: "Completed n'est pas une valeur de la colonne status de query insights." }
    success: { en: "Success isn't a value of the status column of query insights.", fr: "Success n'est pas une valeur de la colonne status de query insights." }
    stmt: { en: "distributed_statement_id is unique for each run, so each group holds a single run, and query_hash in the SELECT list wouldn't be grouped.", fr: "distributed_statement_id est unique pour chaque exécution : chaque groupe ne contiendrait qu'une exécution, et query_hash dans la liste SELECT ne serait pas regroupé." }
    session: { en: "session_id groups by user session, not by query shape.", fr: "session_id regroupe par session utilisateur, pas par forme de requête." }
references:
  - title: queryinsights.exec_requests_history (Transact-SQL)
    url: https://learn.microsoft.com/en-us/sql/relational-databases/system-views/queryinsights-exec-requests-history-transact-sql?view=fabric
  - title: Query insights in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights
