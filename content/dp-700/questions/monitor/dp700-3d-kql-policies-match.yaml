id: dp700-3d-kql-policies-match
objective: "3.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database named DB2 in a Fabric eventhouse. You need to meet the following requirements for the tables of DB2:

    - Queries on the last 14 days of the Clicks table must read data from local SSD.
    - JSON documents loaded into the RawOrders table must be converted into typed rows of the Orders table once, when they are ingested.
    - The total number of clicks per page and per hour must be precomputed and kept up to date as new clicks arrive.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une base de données KQL nommée DB2 dans un eventhouse Fabric. Vous devez satisfaire les exigences suivantes pour les tables de DB2 :

    - Les requêtes sur les 14 derniers jours de la table Clicks doivent lire les données depuis le SSD local.
    - Les documents JSON chargés dans la table RawOrders doivent être convertis une seule fois, à leur ingestion, en lignes typées de la table Orders.
    - Le nombre total de clics par page et par heure doit être précalculé et tenu à jour à l'arrivée de nouveaux clics.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: caching, text: { en: "Caching policy", fr: "Stratégie de mise en cache" } }
    - { id: retention, text: { en: "Retention policy", fr: "Stratégie de rétention" } }
    - { id: batching, text: { en: "Ingestion batching policy", fr: "Stratégie de traitement par lots de l'ingestion" } }
    - { id: update, text: { en: "Update policy", fr: "Stratégie de mise à jour" } }
    - { id: mview, text: { en: "Materialized view", fr: "Vue matérialisée" } }
  targets:
    - { id: t1, text: { en: "Read the last 14 days of Clicks from local SSD", fr: "Lire les 14 derniers jours de Clicks depuis le SSD local" } }
    - { id: t2, text: { en: "Convert RawOrders into Orders at ingestion", fr: "Convertir RawOrders en Orders à l'ingestion" } }
    - { id: t3, text: { en: "Keep the clicks per page and per hour precomputed", fr: "Tenir à jour le précalcul des clics par page et par heure" } }
answer:
  mapping: { t1: caching, t2: update, t3: mview }
explanation:
  correct:
    en: "The caching policy defines how long data stays in the hot cache on local SSD, here hot = 14d on Clicks. An update policy runs a query on each batch ingested into a source table and writes the result to a target table, so the JSON is parsed once. A materialized view stores an aggregation (summarize count() by page and hour) and updates it as data is ingested."
    fr: "La stratégie de mise en cache définit combien de temps les données restent dans le cache chaud sur le SSD local, ici hot = 14d sur Clicks. Une stratégie de mise à jour exécute une requête sur chaque lot ingéré dans une table source et écrit le résultat dans une table cible : le JSON n'est analysé qu'une fois. Une vue matérialisée stocke une agrégation (summarize count() par page et par heure) et la met à jour au fil de l'ingestion."
  options:
    retention: { en: "The retention policy deletes data older than a period; it does not decide which data is on SSD.", fr: "La stratégie de rétention supprime les données plus anciennes qu'une période ; elle ne décide pas quelles données sont sur le SSD." }
    batching: { en: "The ingestion batching policy controls when batches are sealed, which affects ingestion latency only.", fr: "La stratégie de traitement par lots de l'ingestion contrôle le moment où les lots sont scellés, ce qui n'agit que sur la latence d'ingestion." }
references:
  - title: Caching policy (hot and cold cache)
    url: https://learn.microsoft.com/en-us/kusto/management/cache-policy?view=microsoft-fabric
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
