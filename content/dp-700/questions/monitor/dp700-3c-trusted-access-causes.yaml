id: dp700-3c-trusted-access-causes
objective: "3.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    You have a Fabric workspace named WS_Finance that has a workspace identity. A lakehouse in WS_Finance contains a shortcut to an Azure Data Lake Storage Gen2 account named stfinance. Public network access to stfinance is enabled only from selected virtual networks and IP addresses.

    The shortcut was configured with trusted workspace access and used the following settings:

    - A resource instance rule for WS_Finance, created with an ARM template.
    - The Storage Blob Data Reader role for the workspace identity at the scope of stfinance.
    - The URL https://stfinance.dfs.core.windows.net and the Workspace identity authentication kind.

    The shortcut worked for several months and then stopped working.

    Which two changes could have caused the problem?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé WS_Finance qui possède une identité d'espace de travail. Un lakehouse de WS_Finance contient un raccourci vers un compte Azure Data Lake Storage Gen2 nommé stfinance. L'accès réseau public à stfinance n'est autorisé qu'à partir de réseaux virtuels et d'adresses IP sélectionnés.

    Le raccourci a été configuré avec l'accès approuvé à l'espace de travail et utilisait les paramètres suivants :

    - Une règle d'instance de ressource pour WS_Finance, créée avec un modèle ARM.
    - Le rôle Storage Blob Data Reader pour l'identité de l'espace de travail, dans l'étendue de stfinance.
    - L'URL https://stfinance.dfs.core.windows.net et le type d'authentification Workspace identity.

    Le raccourci a fonctionné pendant plusieurs mois, puis il a cessé de fonctionner.

    Quelles sont les deux modifications qui ont pu provoquer le problème ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "WS_Finance was reassigned from an F64 capacity to a Fabric trial capacity.", fr: "WS_Finance a été réaffecté d'une capacité F64 à une capacité d'évaluation Fabric." } }
    - { id: b, text: { en: "A Conditional Access policy for workload identities that includes all service principals was enabled.", fr: "Une stratégie d'accès conditionnel pour les identités de charge de travail qui inclut tous les principaux de service a été activée." } }
    - { id: c, text: { en: "Public network access to stfinance was changed to Disabled.", fr: "L'accès réseau public à stfinance a été changé en Disabled." } }
    - { id: d, text: { en: "Resource instance rules for 50 other Fabric workspaces were added to stfinance.", fr: "Des règles d'instance de ressource pour 50 autres espaces de travail Fabric ont été ajoutées à stfinance." } }
    - { id: e, text: { en: "The role of the workspace identity was changed to Storage Blob Data Contributor.", fr: "Le rôle de l'identité de l'espace de travail a été changé en Storage Blob Data Contributor." } }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Trusted workspace access requires a workspace on a purchased F SKU capacity; when the workspace moves to a trial or non-F capacity, it stops working after one hour. It also fails when a Conditional Access policy for workload identities includes all service principals, because the workspace identity is a service principal; the fix is to exclude the Fabric workspace identities from the policy.
    fr: |
      L'accès approuvé à l'espace de travail exige un espace de travail sur une capacité de SKU F achetée ; quand l'espace de travail passe sur une capacité d'évaluation ou non F, il cesse de fonctionner au bout d'une heure. Il échoue aussi quand une stratégie d'accès conditionnel pour les identités de charge de travail inclut tous les principaux de service, car l'identité d'espace de travail est un principal de service ; la correction consiste à exclure les identités d'espace de travail Fabric de la stratégie.
  options:
    c:
      en: |
        Trusted workspace access works both when public access is limited to selected networks and when public access is disabled.
      fr: |
        L'accès approuvé à l'espace de travail fonctionne aussi bien quand l'accès public est limité à des réseaux sélectionnés que quand il est désactivé.
    d:
      en: |
        A storage account supports up to 200 resource instance rules, so 51 rules remain within the limit.
      fr: |
        Un compte de stockage accepte jusqu'à 200 règles d'instance de ressource : 51 règles restent dans la limite.
    e:
      en: |
        Storage Blob Data Contributor is one of the roles accepted for shortcuts and includes read access to the data.
      fr: |
        Storage Blob Data Contributor fait partie des rôles acceptés pour les raccourcis et inclut l'accès en lecture aux données.
references:
  - title: Trusted workspace access in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/security/security-trusted-workspace-access
