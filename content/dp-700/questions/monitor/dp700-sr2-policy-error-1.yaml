id: dp700-sr2-policy-error-1
objective: "3.2.4"
type: series_yesno
series: dp700-sr2-policy-error
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You list the ingestion failures that originate from an update policy.
  fr: Vous listez les échecs d'ingestion qui proviennent d'une stratégie de mise à jour.
body:
  solution:
    en: |
      In PlantDB, you run `.show ingestion failures | where OriginatesFromUpdatePolicy == true` and you review the **Details** column of the rows for Readings.
    fr: |
      Dans PlantDB, vous exécutez `.show ingestion failures | where OriginatesFromUpdatePolicy == true` et vous examinez la colonne **Details** des lignes concernant Readings.
answer: { value: true }
explanation:
  correct:
    en: |
      Update policy failures are recorded as ingestion failures for 14 days, with OriginatesFromUpdatePolicy set to true and the root cause in Details. Here the error is most likely a schema mismatch: the function output must match the target table in column types and order. The policy wasn't revalidated when the function changed, because validation runs only when the policy is created or altered.
    fr: |
      Les échecs d'une stratégie de mise à jour sont enregistrés comme échecs d'ingestion pendant 14 jours, avec OriginatesFromUpdatePolicy à true et la cause dans Details. Ici, l'erreur est très probablement une incompatibilité de schéma : la sortie de la fonction doit correspondre à la table cible par les types et l'ordre des colonnes. La stratégie n'a pas été revalidée lors de la modification de la fonction, car la validation n'a lieu qu'à la création ou à la modification de la stratégie.
references:
  - title: Update policy overview
    url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
  - title: .show ingestion failures command
    url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures?view=microsoft-fabric
