id: dp700-3b-eventhouse-show-failures
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventhouse named EH1. EH1 contains a KQL database named DB_Telemetry that has a table named Readings.

    A pipeline loads files into Readings every hour. Over the last three days, data from some of the files is missing from Readings.

    You need to find out why these loads didn't succeed, including the error code of each problem and whether retrying could succeed.

    Which command should you run?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventhouse nommé EH1. EH1 contient une base de données KQL nommée DB_Telemetry qui comporte une table nommée Readings.

    Un pipeline charge des fichiers dans Readings toutes les heures. Au cours des trois derniers jours, les données de certains fichiers sont absentes de Readings.

    Vous devez déterminer pourquoi ces chargements n'ont pas abouti, avec le code d'erreur de chaque problème et la possibilité ou non de réussir en relançant.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: ".show queries" }
    - { id: b, text: ".show table Readings extents" }
    - { id: c, text: ".show ingestion failures" }
    - { id: d, text: ".show table Readings policy ingestionbatching" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      .show ingestion failures returns the failures of data ingestion commands, kept for 14 days, with columns such as Table, FailedOn, ErrorCode, Details and FailureKind (Permanent or Transient). You can filter it, for example with where FailedOn > ago(3d) and Table == "Readings".
    fr: |
      .show ingestion failures renvoie les échecs des commandes d'ingestion de données, conservés 14 jours, avec des colonnes comme Table, FailedOn, ErrorCode, Details et FailureKind (Permanent ou Transient). Vous pouvez filtrer le résultat, par exemple avec where FailedOn > ago(3d) and Table == "Readings".
  options:
    a: { en: ".show queries lists queries that ran on the database, not ingestion failures.", fr: ".show queries liste les requêtes exécutées sur la base de données, pas les échecs d'ingestion." }
    b: { en: "Extents are the data shards that were ingested successfully; failed ingestions create none.", fr: "Les extents sont les partitions de données ingérées avec succès ; les ingestions en échec n'en créent pas." }
    d: { en: "The batching policy controls how queued ingestion groups data; it doesn't report failures.", fr: "La stratégie de traitement par lot contrôle la façon dont l'ingestion en file d'attente regroupe les données ; elle ne signale pas les échecs." }
references:
  - title: .show ingestion failures command
    url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures?view=microsoft-fabric
