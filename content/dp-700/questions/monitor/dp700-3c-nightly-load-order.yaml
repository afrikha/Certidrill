id: dp700-3c-nightly-load-order
objective: "3.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW_Retail that contains a staging table named stg.Sales and a fact table named dbo.FactSales. Statistics were created earlier on the dbo.FactSales columns that reports use in joins and filters.

    Every night, Parquet files of the day's sales land in an Azure Data Lake Storage Gen2 account. After each load, the first report queries are slow because they wait for statistics to be refreshed.

    You need to design the nightly T-SQL load so that the data reaches dbo.FactSales and the first report queries do not wait for statistics updates.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW_Retail qui contient une table de transit nommée stg.Sales et une table de faits nommée dbo.FactSales. Des statistiques ont été créées auparavant sur les colonnes de dbo.FactSales que les rapports utilisent dans les jointures et les filtres.

    Chaque nuit, des fichiers Parquet des ventes du jour arrivent dans un compte Azure Data Lake Storage Gen2. Après chaque chargement, les premières requêtes des rapports sont lentes, car elles attendent l'actualisation des statistiques.

    Vous devez concevoir le chargement T-SQL nocturne pour que les données arrivent dans dbo.FactSales et que les premières requêtes des rapports n'attendent pas la mise à jour des statistiques.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: copy, text: { en: "Load the Parquet files into stg.Sales with COPY INTO.", fr: "Charger les fichiers Parquet dans stg.Sales avec COPY INTO." } }
    - { id: insert, text: { en: "Insert the transformed rows of stg.Sales into dbo.FactSales with INSERT ... SELECT.", fr: "Insérer les lignes transformées de stg.Sales dans dbo.FactSales avec INSERT ... SELECT." } }
    - { id: stats, text: { en: "Run UPDATE STATISTICS on the statistics of dbo.FactSales.", fr: "Exécuter UPDATE STATISTICS sur les statistiques de dbo.FactSales." } }
    - { id: optimize, text: { en: "Run OPTIMIZE on dbo.FactSales.", fr: "Exécuter OPTIMIZE sur dbo.FactSales." } }
    - { id: show, text: { en: "Run DBCC SHOW_STATISTICS on the statistics of dbo.FactSales.", fr: "Exécuter DBCC SHOW_STATISTICS sur les statistiques de dbo.FactSales." } }
    - { id: multi, text: { en: "Create multi-column statistics on the join columns of dbo.FactSales.", fr: "Créer des statistiques multicolonnes sur les colonnes de jointure de dbo.FactSales." } }
answer:
  sequence: [copy, insert, stats]
explanation:
  correct:
    en: |
      COPY INTO is the recommended way to bulk load files into the staging table, and INSERT ... SELECT then moves the transformed rows to the fact table in one batch. Updating the statistics after the data has reached dbo.FactSales, as part of the load, means that SELECT queries do not have to update them before they build their plans.
    fr: |
      COPY INTO est la méthode recommandée pour charger en bloc les fichiers dans la table de transit, puis INSERT ... SELECT déplace les lignes transformées vers la table de faits en un seul lot. Mettre à jour les statistiques une fois les données arrivées dans dbo.FactSales, dans le cadre du chargement, évite que les requêtes SELECT aient à les mettre à jour avant de construire leurs plans.
  options:
    optimize:
      en: |
        OPTIMIZE is not used in a warehouse: compaction runs automatically in the background.
      fr: |
        OPTIMIZE ne s'utilise pas dans un entrepôt : le compactage s'exécute automatiquement en arrière-plan.
    show:
      en: |
        DBCC SHOW_STATISTICS displays a histogram; it does not refresh it.
      fr: |
        DBCC SHOW_STATISTICS affiche un histogramme ; il ne l'actualise pas.
    multi:
      en: |
        Multi-column statistics are not supported in Fabric Data Warehouse.
      fr: |
        Les statistiques multicolonnes ne sont pas prises en charge dans Fabric Data Warehouse.
references:
  - title: Statistics
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/statistics
  - title: Performance guidelines in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance
