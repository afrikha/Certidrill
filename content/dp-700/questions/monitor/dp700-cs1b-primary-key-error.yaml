id: dp700-cs1b-primary-key-error
objective: "3.2.6"
type: single
caseStudy: dp700-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |-
    You need to resolve the error of the script that creates dbo.DimTitle in LP-Test. The solution must meet the lifecycle requirements. What should you do?
  fr: |-
    Vous devez résoudre l'erreur du script qui crée dbo.DimTitle dans LP-Test. La solution doit respecter les exigences de cycle de vie. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Declare the inline constraint as PRIMARY KEY NONCLUSTERED NOT ENFORCED in the CREATE TABLE statement", fr: "Déclarer la contrainte en ligne PRIMARY KEY NONCLUSTERED NOT ENFORCED dans l'instruction CREATE TABLE" } }
    - { id: b, text: { en: "Remove the inline constraint, then run ALTER TABLE to add a PRIMARY KEY CLUSTERED constraint on TitleKey", fr: "Supprimer la contrainte en ligne, puis exécuter ALTER TABLE pour ajouter une contrainte PRIMARY KEY CLUSTERED sur TitleKey" } }
    - { id: c, text: { en: "Remove the inline constraint, then run ALTER TABLE to add a PRIMARY KEY NONCLUSTERED constraint on TitleKey with NOT ENFORCED", fr: "Supprimer la contrainte en ligne, puis exécuter ALTER TABLE pour ajouter une contrainte PRIMARY KEY NONCLUSTERED sur TitleKey avec NOT ENFORCED" } }
    - { id: d, text: { en: "Remove the inline constraint and declare TitleKey as an IDENTITY column", fr: "Supprimer la contrainte en ligne et déclarer TitleKey comme colonne IDENTITY" } }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Fabric Data Warehouse does not accept these constraints inline in CREATE TABLE. You create the table first, then add the primary key with ALTER TABLE, and the only supported form is PRIMARY KEY NONCLUSTERED with NOT ENFORCED. The constraint is metadata that tools can use to discover relationships, while the load process keeps the keys unique.
    fr: |-
      Fabric Data Warehouse n'accepte pas ces contraintes en ligne dans CREATE TABLE. Vous créez d'abord la table, puis vous ajoutez la clé primaire avec ALTER TABLE, et la seule forme prise en charge est PRIMARY KEY NONCLUSTERED avec NOT ENFORCED. La contrainte est une métadonnée que les outils peuvent utiliser pour détecter les relations, tandis que le processus de chargement garantit l'unicité des clés.
  options:
    a:
      en: |-
        Even with NONCLUSTERED and NOT ENFORCED, a primary key cannot be declared inside CREATE TABLE in a Fabric warehouse; it must be added with ALTER TABLE.
      fr: |-
        Même avec NONCLUSTERED et NOT ENFORCED, une clé primaire ne peut pas être déclarée dans CREATE TABLE dans un entrepôt Fabric ; elle doit être ajoutée avec ALTER TABLE.
    b:
      en: |-
        A Fabric warehouse supports primary keys only as NONCLUSTERED and NOT ENFORCED, so a clustered primary key fails.
      fr: |-
        Un entrepôt Fabric ne prend en charge les clés primaires qu'en NONCLUSTERED et NOT ENFORCED ; une clé primaire cluster échoue donc.
    d:
      en: |-
        An IDENTITY column generates values but declares no primary key, so tools could not discover the relationships, which breaks requirement 4.
      fr: |-
        Une colonne IDENTITY génère des valeurs mais ne déclare aucune clé primaire ; les outils ne pourraient donc pas détecter les relations, ce qui enfreint l'exigence 4.
references:
  - title: Primary keys, foreign keys, and unique keys in Warehouse in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/table-constraints
