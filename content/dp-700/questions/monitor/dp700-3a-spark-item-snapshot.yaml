id: dp700-3a-spark-item-snapshot
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a pipeline named PL_Daily that runs a notebook named NB_Clean and passes it a parameter named load_date. Since the run, a developer has changed the code of NB_Clean. Last night's run of NB_Clean produced unexpected results.

    You need to review the code of NB_Clean and the value of load_date exactly as they were when last night's run executed.

    Which tab of the Spark application detail page should you use?
  fr: |
    Vous disposez d'un pipeline nommé PL_Daily qui exécute un notebook nommé NB_Clean et lui passe un paramètre nommé load_date. Depuis l'exécution, un développeur a modifié le code de NB_Clean. L'exécution de NB_Clean de la nuit dernière a produit des résultats inattendus.

    Vous devez examiner le code de NB_Clean et la valeur de load_date tels qu'ils étaient lors de l'exécution de la nuit dernière.

    Quel onglet de la page de détail de l'application Spark devez-vous utiliser ?
body:
  options:
    - { id: a, text: Item snapshots }
    - { id: b, text: Logs }
    - { id: c, text: Data }
    - { id: d, text: Jobs }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Item snapshots tab shows the items related to the run. A notebook snapshot shows its code and parameter values at execution time, and when a pipeline triggered the run, the pipeline and its activity also appear, so later edits of NB_Clean don't hide what ran.
    fr: |
      L'onglet Item snapshots montre les éléments liés à l'exécution. Un instantané de notebook montre son code et les valeurs de ses paramètres au moment de l'exécution, et quand un pipeline a déclenché l'exécution, le pipeline et son activité apparaissent aussi : les modifications ultérieures de NB_Clean ne masquent donc pas ce qui s'est exécuté.
  options:
    b:
      en: |
        Logs shows the Livy, Prelaunch and Driver logs, not the notebook code and parameters as a snapshot.
      fr: |
        Logs affiche les journaux Livy, Prelaunch et Driver, pas un instantané du code et des paramètres du notebook.
    c:
      en: |
        Data lists the input and output files of the application.
      fr: |
        Data liste les fichiers d'entrée et de sortie de l'application.
    d:
      en: |
        Jobs lists the Spark jobs with their stages, tasks and a code snippet per job, but not the parameter values passed by the pipeline.
      fr: |
        Jobs liste les travaux Spark avec leurs étapes, leurs tâches et un extrait de code par travail, mais pas les valeurs de paramètres passées par le pipeline.
references:
  - title: Apache Spark application detail monitoring
    url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-detail-monitoring
