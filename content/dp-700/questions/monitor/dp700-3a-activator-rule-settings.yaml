id: dp700-3a-activator-rule-settings
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an eventstream named ES_Freezers that receives an event from each store freezer every 30 seconds. Each event contains FreezerId, StoreId and Temperature.

    You create an Activator rule on ES_Freezers. The store manager must receive an email for a freezer only when its temperature stays above -15 for 10 minutes. A short peak above -15 must not trigger an email.

    How should you complete the rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un flux d'événements (eventstream) nommé ES_Freezers qui reçoit un événement de chaque congélateur de magasin toutes les 30 secondes. Chaque événement contient FreezerId, StoreId et Temperature.

    Vous créez une règle Activator sur ES_Freezers. Le responsable du magasin doit recevoir un e-mail pour un congélateur seulement quand sa température reste au-dessus de -15 pendant 10 minutes. Un pic bref au-dessus de -15 ne doit pas déclencher d'e-mail.

    Comment devez-vous compléter la règle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Object ID: [[id]]

      Condition on Temperature: [[cond]] -15

      Occurrence: [[occ]]
    fr: |
      ID d'objet : [[id]]

      Condition sur Temperature : [[cond]] -15

      Occurrence : [[occ]]
  slots:
    - id: id
      options:
        - { id: store, text: StoreId }
        - { id: freezer, text: FreezerId }
        - { id: temp, text: Temperature }
    - id: cond
      options:
        - { id: gt, text: Is greater than }
        - { id: inc, text: Increases above }
        - { id: changes, text: Changes }
    - id: occ
      options:
        - { id: every, text: Every time the condition is met }
        - { id: times, text: When it has been true for 10 times }
        - { id: duration, text: When it has been true for 10 minutes }
answer:
  values: { id: freezer, cond: gt, occ: duration }
explanation:
  correct:
    en: |
      Activator groups events into objects by an ID, and each object is evaluated independently, so FreezerId gives one state per freezer. Is greater than is a state condition that stays true while the temperature is above -15, and the occurrence When it has been true for 10 minutes fires only when that state lasts 10 minutes, which ignores short peaks.
    fr: |
      Activator regroupe les événements en objets selon un ID, et chaque objet est évalué indépendamment : FreezerId donne un état par congélateur. Is greater than est une condition d'état qui reste vraie tant que la température est au-dessus de -15, et l'occurrence When it has been true for 10 minutes ne se déclenche que si cet état dure 10 minutes, ce qui ignore les pics brefs.
  options:
    store: { en: "Grouping by StoreId mixes the events of all the freezers of a store into one object.", fr: "Le regroupement par StoreId mélange les événements de tous les congélateurs d'un magasin dans un seul objet." }
    temp: { en: "Temperature is the monitored property, not an identifier of the freezer.", fr: "Temperature est la propriété surveillée, pas un identifiant du congélateur." }
    inc: { en: "Increases above is a change condition that detects the moment the value crosses -15, not a state that lasts.", fr: "Increases above est une condition de changement qui détecte le moment où la valeur franchit -15, pas un état qui dure." }
    changes: { en: "Changes fires whenever the value changes, without a threshold.", fr: "Changes se déclenche à chaque changement de valeur, sans seuil." }
    every: { en: "Every time the condition is met would fire on a short peak.", fr: "Every time the condition is met se déclencherait sur un pic bref." }
    times: { en: "Ten true evaluations take about 5 minutes at one event every 30 seconds, not 10 minutes.", fr: "Dix évaluations vraies prennent environ 5 minutes à raison d'un événement toutes les 30 secondes, pas 10 minutes." }
references:
  - title: Detection settings in Activator
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-detection-conditions
  - title: What is Fabric Activator?
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-introduction
