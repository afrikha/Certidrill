id: dp700-3c-partition-options
objective: "3.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are designing Fabric pipelines that copy four tables from an Azure SQL database to a lakehouse. For each table, you must use the partition option that Microsoft recommends for the source table, and minimize configuration effort.

    Which partition option should you use for each table? To answer, drag the appropriate partition options to the correct tables. Each partition option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez des pipelines Fabric qui copient quatre tables d'une base de données Azure SQL vers un lakehouse. Pour chaque table, vous devez utiliser l'option de partition que Microsoft recommande pour la table source, et réduire au minimum l'effort de configuration.

    Quelle option de partition devez-vous utiliser pour chaque table ? Pour répondre, faites glisser les options de partition appropriées vers les tables correspondantes. Chaque option de partition peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: none, text: None }
    - { id: physical, text: Physical partitions of table }
    - { id: dynamic, text: Dynamic range }
  targets:
    - id: t_sales
      text: { en: "dbo.Sales: 900 million rows, partitioned by month into 72 partitions of similar size", fr: "dbo.Sales : 900 millions de lignes, partitionnée par mois en 72 partitions de taille comparable" }
    - id: t_events
      text: { en: "dbo.Events: 600 million rows, a heap with a bigint EventID column", fr: "dbo.Events : 600 millions de lignes, une table de tas avec une colonne bigint EventID" }
    - id: t_claims
      text: { en: "dbo.Claims: 400 million rows, partitioned by year, with 90 percent of the rows in the current-year partition", fr: "dbo.Claims : 400 millions de lignes, partitionnée par année, avec 90 % des lignes dans la partition de l'année en cours" }
    - id: t_codes
      text: { en: "dbo.CountryCodes: 250 rows, copied once a day", fr: "dbo.CountryCodes : 250 lignes, copiée une fois par jour" }
answer:
  mapping: { t_sales: physical, t_events: dynamic, t_claims: dynamic, t_codes: none }
explanation:
  correct:
    en: |
      Physical partitions of table detects the partition column of an already partitioned table and runs one copy per partition, which suits dbo.Sales and its many even partitions. A heap has no partitions to use, and a table with skewed partitions would leave one copy doing most of the work, so Dynamic range on a column is recommended for dbo.Events and dbo.Claims. A tiny table gains nothing from parallel reads; None is the simplest option and uses the fewest capacity units.
    fr: |
      Physical partitions of table détecte la colonne de partition d'une table déjà partitionnée et exécute une copie par partition, ce qui convient à dbo.Sales et à ses nombreuses partitions équilibrées. Une table de tas n'a pas de partitions à exploiter, et une table aux partitions déséquilibrées laisserait une seule copie faire l'essentiel du travail : Dynamic range sur une colonne est recommandé pour dbo.Events et dbo.Claims. Une toute petite table ne gagne rien aux lectures parallèles ; None est l'option la plus simple et celle qui consomme le moins d'unités de capacité.
references:
  - title: Copy activity performance with SQL databases
    url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-performance-sql-databases
