id: dp700-3b-eventstream-private-endpoint
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains an eventstream named ES_Telemetry. You have an Azure Event Hubs namespace whose public network access is restricted to selected networks.

    You add an Azure Event Hubs source to ES_Telemetry by using a valid shared access key, but the source can't connect to the event hub. The security policy of your company forbids enabling public access to the namespace.

    You need ES_Telemetry to receive the events.

    What should you do?
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un eventstream nommé ES_Telemetry. Vous disposez d'un espace de noms Azure Event Hubs dont l'accès au réseau public est limité à des réseaux sélectionnés.

    Vous ajoutez une source Azure Event Hubs à ES_Telemetry avec une clé d'accès partagé valide, mais la source ne parvient pas à se connecter au hub d'événements. La stratégie de sécurité de votre entreprise interdit d'activer l'accès public à l'espace de noms.

    ES_Telemetry doit recevoir les événements.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a dedicated consumer group for ES_Telemetry and use it in the source", fr: "Créer un groupe de consommateurs dédié à ES_Telemetry et l'utiliser dans la source" } }
    - { id: b, text: { en: "Regenerate the shared access key and update the source", fr: "Régénérer la clé d'accès partagé et mettre à jour la source" } }
    - { id: c, text: { en: "Connect to the event hub by using a managed private endpoint", fr: "Se connecter au hub d'événements au moyen d'un point de terminaison privé managé" } }
    - { id: d, text: { en: "Set the Event throughput setting of ES_Telemetry to High", fr: "Définir le paramètre Event throughput d'ES_Telemetry sur High" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An eventstream reaches an Azure event hub that is within a protected network through a managed private endpoint. Otherwise, the event hub must be publicly accessible and not behind a firewall, which the security policy doesn't allow here.
    fr: |
      Un eventstream atteint un hub d'événements Azure situé dans un réseau protégé au moyen d'un point de terminaison privé managé. Sinon, le hub d'événements doit être accessible publiquement et ne pas se trouver derrière un pare-feu, ce que la stratégie de sécurité n'autorise pas ici.
  options:
    a: { en: "A consumer group separates readers; it doesn't let the connection cross the network restriction.", fr: "Un groupe de consommateurs sépare les lecteurs ; il ne permet pas à la connexion de franchir la restriction réseau." }
    b: { en: "The key is valid; the connection is blocked at the network level, not by authentication.", fr: "La clé est valide ; la connexion est bloquée au niveau réseau, pas par l'authentification." }
    d: { en: "Throughput sizes the processing of events; it doesn't affect network access to the source.", fr: "Le débit dimensionne le traitement des événements ; il n'influe pas sur l'accès réseau à la source." }
references:
  - title: Add an Azure Event Hubs Source to an Eventstream
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-source-azure-event-hubs
