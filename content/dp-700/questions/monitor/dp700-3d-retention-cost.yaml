id: dp700-3d-retention-cost
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have a KQL database named DB3 in a Fabric eventhouse. DB3 contains a table named SensorData that receives 50 GB of data per day. The data policies of DB3 and SensorData have never been changed.

    Users only query the last 30 days of SensorData, and the company only needs to keep 90 days of data.

    You need to minimize the storage used by SensorData.

    What should you do?
  fr: |
    Vous disposez d'une base de données KQL nommée DB3 dans un eventhouse Fabric. DB3 contient une table nommée SensorData qui reçoit 50 Go de données par jour. Les stratégies de données de DB3 et de SensorData n'ont jamais été modifiées.

    Les utilisateurs n'interrogent que les 30 derniers jours de SensorData, et l'entreprise n'a besoin de conserver que 90 jours de données.

    Vous devez réduire au minimum le stockage utilisé par SensorData.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the caching policy of SensorData to 30 days.", fr: "Définir la stratégie de mise en cache de SensorData sur 30 jours." } }
    - { id: b, text: { en: "Set the retention policy of SensorData to 90 days.", fr: "Définir la stratégie de rétention de SensorData sur 90 jours." } }
    - { id: c, text: { en: "Set the ingestion batching policy of SensorData to 30 seconds.", fr: "Définir la stratégie de traitement par lots de l'ingestion de SensorData sur 30 secondes." } }
    - { id: d, text: { en: "Create a materialized view that summarizes SensorData by day.", fr: "Créer une vue matérialisée qui synthétise SensorData par jour." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The retention policy removes data automatically once it is older than its period. The default retention of a KQL database is 3,650 days, so without a change SensorData keeps about ten years of data. A 90-day retention deletes everything that the company no longer needs."
    fr: "La stratégie de rétention supprime automatiquement les données plus anciennes que sa période. La rétention par défaut d'une base de données KQL est de 3 650 jours : sans modification, SensorData conserve environ dix ans de données. Une rétention de 90 jours supprime tout ce dont l'entreprise n'a plus besoin."
  options:
    a: { en: "The caching policy moves older data out of the hot cache, but the data stays stored until the retention period ends.", fr: "La stratégie de mise en cache sort les données plus anciennes du cache chaud, mais elles restent stockées jusqu'à la fin de la période de rétention." }
    c: { en: "The batching policy affects ingestion latency, not the amount of data kept.", fr: "La stratégie de traitement par lots agit sur la latence d'ingestion, pas sur la quantité de données conservée." }
    d: { en: "A materialized view adds storage; the source rows remain until they are deleted by retention.", fr: "Une vue matérialisée ajoute du stockage ; les lignes sources restent jusqu'à leur suppression par la rétention." }
references:
  - title: Change data policies
    url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-policies
