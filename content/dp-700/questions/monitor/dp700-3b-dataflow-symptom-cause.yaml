id: dp700-3b-dataflow-symptom-cause
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You have a Fabric workspace named Workspace1 that contains several Dataflow Gen2 items. Users report the issues shown in the answer area.

    You need to identify the cause of each issue.

    Which cause should you identify for each issue? To answer, drag the appropriate causes to the correct issues. Each cause may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient plusieurs Dataflow Gen2. Des utilisateurs signalent les problèmes présentés dans la zone de réponse.

    Vous devez identifier la cause de chaque problème.

    Quelle cause devez-vous identifier pour chaque problème ? Pour répondre, faites glisser les causes appropriées vers les problèmes correspondants. Chaque cause peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: existing, text: { en: "The destination is configured to use an existing table", fr: "La destination est configurée pour utiliser une table existante" } }
    - { id: append, text: { en: "The update method of the destination is Append", fr: "La méthode de mise à jour de la destination est Append" } }
    - { id: kql, text: { en: "The destination type supports only the Append update method", fr: "Le type de destination ne prend en charge que la méthode de mise à jour Append" } }
    - { id: staging, text: { en: "Staging is disabled for the query", fr: "Le staging est désactivé pour la requête" } }
    - { id: limit, text: { en: "The dataflow has more than 50 queries with staging or a destination", fr: "Le dataflow compte plus de 50 requêtes avec staging ou destination" } }
    - { id: vorder, text: { en: "V-Order compression is enabled for the destination", fr: "La compression V-Order est activée pour la destination" } }
  targets:
    - { id: t1, text: { en: "A table that someone deleted from the destination lakehouse isn't recreated by the next refresh.", fr: "Une table supprimée de la destination lakehouse n'est pas recréée par l'actualisation suivante." } }
    - { id: t2, text: { en: "Publishing succeeds, but a column added to a query never appears in its destination table.", fr: "La publication réussit, mais une colonne ajoutée à une requête n'apparaît jamais dans sa table de destination." } }
    - { id: t3, text: { en: "Replace can't be selected for a query whose destination is a table in a KQL database.", fr: "Replace ne peut pas être sélectionné pour une requête dont la destination est une table d'une base de données KQL." } }
    - { id: t4, text: { en: "The editor shows a warning after a warehouse is selected as the destination of a query.", fr: "L'éditeur affiche un avertissement après la sélection d'un entrepôt comme destination d'une requête." } }
answer:
  mapping: { t1: existing, t2: append, t3: kql, t4: staging }
explanation:
  correct:
    en: |
      Dataflow Gen2 recreates only the tables it created; an existing table that was deleted isn't recreated. Schema changes aren't possible with Append. Fabric KQL databases and Azure Data Explorer don't support Replace. A warehouse destination requires staging, and a warning appears when staging is off.
    fr: |
      Dataflow Gen2 ne recrée que les tables qu'il a créées ; une table existante qui a été supprimée n'est pas recréée. Les modifications de schéma sont impossibles avec Append. Les bases de données KQL Fabric et Azure Data Explorer ne prennent pas en charge Replace. Une destination entrepôt nécessite le staging, et un avertissement apparaît quand le staging est désactivé.
  options:
    limit: { en: "The 50-query limit concerns the number of queries that write data, not these symptoms.", fr: "La limite de 50 requêtes concerne le nombre de requêtes qui écrivent des données, pas ces symptômes." }
    vorder: { en: "V-Order affects write time and read performance, not table creation, schema or update methods.", fr: "V-Order influe sur la durée d'écriture et les performances de lecture, pas sur la création de table, le schéma ou les méthodes de mise à jour." }
references:
  - title: Dataflow Gen2 data destinations and managed settings
    url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-and-managed-settings
