id: dp700-3d-dataframe-cache
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric notebook that reads three Delta tables and joins them into a DataFrame named `enriched`. The notebook then computes four different aggregations of `enriched` and writes each result to a separate table. After the four writes, the notebook runs a memory-intensive machine-learning feature step that does not use `enriched`.

    The Spark UI shows that the joins that build `enriched` run four times. You need to prevent the joins from being recomputed and to free the executor memory used by `enriched` before the feature step starts.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un notebook Fabric qui lit trois tables Delta et les joint dans un DataFrame nommé `enriched`. Le notebook calcule ensuite quatre agrégations différentes de `enriched` et écrit chaque résultat dans une table distincte. Après les quatre écritures, le notebook exécute une étape de préparation de caractéristiques gourmande en mémoire qui n'utilise pas `enriched`.

    L'interface utilisateur Spark montre que les jointures qui construisent `enriched` s'exécutent quatre fois. Vous devez éviter que les jointures soient recalculées et libérer la mémoire des exécuteurs utilisée par `enriched` avant le début de l'étape de préparation des caractéristiques.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Call enriched.collect() before the first aggregation.", fr: "Appeler enriched.collect() avant la première agrégation." } }
    - { id: b, text: { en: "Call enriched.cache() before the first aggregation.", fr: "Appeler enriched.cache() avant la première agrégation." } }
    - { id: c, text: { en: "Call enriched.coalesce(1) before the first aggregation.", fr: "Appeler enriched.coalesce(1) avant la première agrégation." } }
    - { id: d, text: { en: "Call enriched.unpersist() after the last write.", fr: "Appeler enriched.unpersist() après la dernière écriture." } }
    - { id: e, text: { en: "Call enriched.explain() after the last write.", fr: "Appeler enriched.explain() après la dernière écriture." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Spark evaluates DataFrames lazily, so each action recomputes the whole lineage of `enriched`, including the joins. Caching keeps the result in executor memory after the first action, and the next aggregations reuse it. Cache only data that you reuse, and call unpersist() when you no longer need it so that the memory is available for the following steps."
    fr: "Spark évalue les DataFrames de manière différée : chaque action recalcule toute la lignée de `enriched`, jointures comprises. La mise en cache conserve le résultat dans la mémoire des exécuteurs après la première action, et les agrégations suivantes le réutilisent. Ne mettez en cache que les données réutilisées, et appelez unpersist() quand vous n'en avez plus besoin, pour que la mémoire soit disponible pour les étapes suivantes."
  options:
    a: { en: "collect() brings every row to the driver, which can exhaust its memory, and the next aggregations still recompute the DataFrame.", fr: "collect() rapatrie toutes les lignes sur le pilote, ce qui peut saturer sa mémoire, et les agrégations suivantes recalculent toujours le DataFrame." }
    c: { en: "coalesce(1) reduces the DataFrame to one partition, which removes parallelism and does not keep the result.", fr: "coalesce(1) réduit le DataFrame à une seule partition, ce qui supprime le parallélisme et ne conserve pas le résultat." }
    e: { en: "explain() displays the execution plan; it does not release memory.", fr: "explain() affiche le plan d'exécution ; il ne libère pas de mémoire." }
references:
  - title: Optimize Apache Spark jobs in Azure Synapse Analytics
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/spark/apache-spark-performance
