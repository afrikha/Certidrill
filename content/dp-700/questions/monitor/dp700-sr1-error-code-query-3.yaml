stem:
  en: You compute a time flag with extend and filter on it.
  fr: Vous calculez un indicateur de temps avec extend et filtrez sur celui-ci.
body:
  solution:
    en: |
      You change the query to the following:

      ```kusto
      AppLogs
      | extend IsRecent = Timestamp > ago(1h)
      | where IsRecent and Message contains "E4012"
      | project Timestamp, ServerId, Message
      ```
    fr: |
      Vous remplacez la requête par la suivante :

      ```kusto
      AppLogs
      | extend IsRecent = Timestamp > ago(1h)
      | where IsRecent and Message contains "E4012"
      | project Timestamp, ServerId, Message
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      The query returns the same rows, but Kusto best practices say to filter on table columns, not on calculated columns: a predicate on the IsRecent column produced by extend can't use the datetime index of Timestamp to skip shards. The query also keeps contains, which scans every Message value instead of using the term index, so it isn't faster.
    fr: |
      La requête renvoie les mêmes lignes, mais les bonnes pratiques Kusto recommandent de filtrer sur des colonnes de table et non sur des colonnes calculées : un prédicat sur la colonne IsRecent produite par extend ne peut pas utiliser l'index datetime de Timestamp pour ignorer des partitions (shards). La requête conserve aussi contains, qui analyse chaque valeur de Message au lieu d'utiliser l'index de termes : elle n'est pas plus rapide.
references:
  - title: Best practices for Kusto Query Language queries
    url: https://learn.microsoft.com/en-us/kusto/query/best-practices?view=microsoft-fabric
