id: dp700-3c-copy-into-rejects
objective: "3.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You have a Fabric warehouse named DW1 that contains a table named stg.Shipments. Every night, the following statement loads CSV files from a storage account named stlitware.

    ```sql
    COPY INTO stg.Shipments
    FROM 'https://stlitware.blob.core.windows.net/exports/shipments/'
    WITH (FILE_TYPE = 'CSV');
    ```

    Last night the statement failed with error 13812, "Bulk load data conversion error". You discover the following:

    - The first line of each file contains the column names.
    - A few rows contain the value N/A in the numeric column Weight.

    You need to modify the statement so that the load succeeds when a small number of rows are invalid, and the rejected rows are saved for review. The identity that runs the statement can write to the exports container.

    Which three options should you add to the WITH clause? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée stg.Shipments. Chaque nuit, l'instruction suivante charge des fichiers CSV depuis un compte de stockage nommé stlitware.

    ```sql
    COPY INTO stg.Shipments
    FROM 'https://stlitware.blob.core.windows.net/exports/shipments/'
    WITH (FILE_TYPE = 'CSV');
    ```

    La nuit dernière, l'instruction a échoué avec l'erreur 13812, « Bulk load data conversion error ». Vous constatez ce qui suit :

    - La première ligne de chaque fichier contient les noms des colonnes.
    - Quelques lignes contiennent la valeur N/A dans la colonne numérique Weight.

    Vous devez modifier l'instruction pour que le chargement réussisse quand un petit nombre de lignes sont invalides, et que les lignes rejetées soient enregistrées pour analyse. L'identité qui exécute l'instruction peut écrire dans le conteneur exports.

    Quelles sont les trois options à ajouter à la clause WITH ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: "FIRSTROW = 2" }
    - { id: b, text: "MAXERRORS = 100" }
    - { id: c, text: "ERRORFILE = 'https://stlitware.blob.core.windows.net/exports/rejects/'" }
    - { id: d, text: "ERRORFILE = 'https://stlitwarelogs.blob.core.windows.net/rejects/'" }
    - { id: e, text: "FILE_TYPE = 'PARQUET'" }
    - { id: f, text: "IDENTITY_INSERT = 'ON'" }
answer: { optionIds: [a, b, c] }
explanation:
  correct:
    en: |
      FIRSTROW = 2 skips the header line, which would otherwise be parsed as data. MAXERRORS sets how many rejected rows are tolerated before the load fails, so a few N/A values no longer stop it. ERRORFILE writes the rejected rows (row.csv) and their diagnostics (error.jsonl) under a _rejectedrows folder; it must be in the same storage location as the source, and the reading identity needs permission to create files there.
    fr: |
      FIRSTROW = 2 ignore la ligne d'en-tête, qui serait sinon analysée comme des données. MAXERRORS fixe le nombre de lignes rejetées tolérées avant l'échec du chargement : quelques valeurs N/A ne l'arrêtent plus. ERRORFILE écrit les lignes rejetées (row.csv) et leurs diagnostics (error.jsonl) dans un dossier _rejectedrows ; il doit se trouver dans le même emplacement de stockage que la source, et l'identité qui lit les données doit pouvoir y créer des fichiers.
  options:
    d:
      en: |
        The error file must be configured in the same storage location as the source files, not in a different storage account.
      fr: |
        Le fichier d'erreurs doit être configuré dans le même emplacement de stockage que les fichiers sources, pas dans un autre compte de stockage.
    e:
      en: |
        The files are CSV. Declaring Parquet would make every file fail, and rejected-row files are not generated for Parquet loads.
      fr: |
        Les fichiers sont au format CSV. Déclarer Parquet ferait échouer chaque fichier, et aucun fichier de lignes rejetées n'est généré pour les chargements Parquet.
    f:
      en: |
        IDENTITY_INSERT loads explicit values into an IDENTITY column; it does not handle header lines or invalid values.
      fr: |
        IDENTITY_INSERT charge des valeurs explicites dans une colonne IDENTITY ; il ne traite ni les lignes d'en-tête ni les valeurs invalides.
references:
  - title: Troubleshoot Transact-SQL Ingestion Errors Using Error Files
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/troubleshoot-ingestion-errors
