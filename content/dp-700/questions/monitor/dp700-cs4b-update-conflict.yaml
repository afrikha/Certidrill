id: dp700-cs4b-update-conflict
objective: "3.2.6"
type: single
caseStudy: dp700-cs4b-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You need to resolve the errors of PL_LoadProducts and PL_LoadPrices to meet the operations requirement.

    What should you do?
  fr: |
    Vous devez résoudre les erreurs de PL_LoadProducts et de PL_LoadPrices pour satisfaire l'exigence d'exploitation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run PL_LoadPrices after PL_LoadProducts completes, and add retry logic to the statements that modify dbo.DimProduct.", fr: "Exécuter PL_LoadPrices une fois PL_LoadProducts terminé, et ajouter une logique de nouvelle tentative aux instructions qui modifient dbo.DimProduct." } }
    - { id: b, text: { en: "Add SET TRANSACTION ISOLATION LEVEL READ COMMITTED at the start of the statements of both pipelines.", fr: "Ajouter SET TRANSACTION ISOLATION LEVEL READ COMMITTED au début des instructions des deux pipelines." } }
    - { id: c, text: { en: "Add a WHERE clause on ProductKey ranges so that each pipeline updates a separate set of rows of dbo.DimProduct.", fr: "Ajouter une clause WHERE sur des plages de ProductKey pour que chaque pipeline mette à jour un ensemble distinct de lignes de dbo.DimProduct." } }
    - { id: d, text: { en: "Scale the capacity of FC-Data-Prod to a larger F SKU while both pipelines keep starting at 02:00.", fr: "Faire évoluer la capacité de FC-Data-Prod vers une référence F plus grande, les deux pipelines continuant de démarrer à 02:00." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Fabric Data Warehouse detects write-write conflicts at the table level: two transactions that run UPDATE, DELETE or MERGE on the same table conflict even when they change different rows, and the one that commits second fails with error 24556. Running the two pipelines one after the other removes the concurrency on dbo.DimProduct, and about 80 minutes from 02:00 still ends before 06:00. Retry logic is the recommended safeguard for any remaining conflict.
    fr: |
      Fabric Data Warehouse détecte les conflits d'écriture au niveau de la table : deux transactions qui exécutent UPDATE, DELETE ou MERGE sur la même table entrent en conflit même si elles modifient des lignes différentes, et celle qui valide en second échoue avec l'erreur 24556. Exécuter les deux pipelines l'un après l'autre supprime la concurrence sur dbo.DimProduct, et environ 80 minutes à partir de 02:00 se terminent encore avant 06:00. La logique de nouvelle tentative est la protection recommandée contre tout conflit restant.
  options:
    b:
      en: |
        Fabric Data Warehouse always applies snapshot isolation; a change of isolation level in T-SQL is ignored at execution time.
      fr: |
        Fabric Data Warehouse applique toujours l'isolement de capture instantanée ; un changement de niveau d'isolation en T-SQL est ignoré à l'exécution.
    c:
      en: |
        The pipelines already modify different rows. Conflicts are evaluated at the table level, so separating the rows does not prevent them.
      fr: |
        Les pipelines modifient déjà des lignes différentes. Les conflits sont évalués au niveau de la table : séparer les lignes ne les empêche pas.
    d:
      en: |
        An update conflict is not a resource problem. With both pipelines still updating dbo.DimProduct at the same time, the conflicts continue on a larger capacity.
      fr: |
        Un conflit de mise à jour n'est pas un problème de ressources. Si les deux pipelines mettent toujours à jour dbo.DimProduct en même temps, les conflits continuent sur une capacité plus grande.
references:
  - title: Transactions in Fabric Data Warehouse
    url: https://learn.microsoft.com/en-us/fabric/data-warehouse/transactions
