id: dp700-cs3b-woodgrove
status: draft
title:
  en: Woodgrove Insurance
  fr: Woodgrove Insurance
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Woodgrove Insurance sells home and car insurance in Canada. About 400 claims adjusters handle the claims that policyholders submit.

        Woodgrove wants a claims analytics warehouse in Microsoft Fabric, fed from its operational claims database, with a controlled promotion process from development to production.
      fr: |
        Woodgrove Insurance vend des assurances habitation et automobile au Canada. Environ 400 gestionnaires de sinistres traitent les déclarations de sinistre des assurés.

        Woodgrove souhaite un entrepôt d'analyse des sinistres dans Microsoft Fabric, alimenté par sa base de données opérationnelle des sinistres, avec un processus de promotion contrôlé du développement vers la production.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Operational databases.** The claims application writes continuously to Azure SQL Database (vCore, General Purpose). There is one database per environment: **sqldb-claims-dev**, **sqldb-claims-test** and **sqldb-claims-prod**. The logical servers allow access from Azure services.

        **Fabric.** Woodgrove has three workspaces on an F32 capacity.

        | Workspace | Contents |
        | --- | --- |
        | WS-Claims-Dev | Warehouse **DW-Claims**; connected to an Azure DevOps repository |
        | WS-Claims-Test | Warehouse **DW-Claims** |
        | WS-Claims-Prod | Warehouse **DW-Claims** |

        A deployment pipeline named **DP-Claims** has three stages, Development, Test and Production, assigned to the three workspaces in that order. Content has already been deployed to all three stages.

        In DW-Claims, the table **dbo.FactClaim** has a column named AdjusterUpn that contains the user principal name (UPN) of the adjuster assigned to the claim. The table **dbo.DimPolicyholder** has a column named NationalId.

        **People.** Adjusters have the Viewer role in WS-Claims-Prod and query DW-Claims with T-SQL. The members of a Microsoft Entra group named **FraudTeam** also have the Viewer role. The data engineers have the Contributor role in all three workspaces.
      fr: |
        **Bases de données opérationnelles.** L'application des sinistres écrit en continu dans Azure SQL Database (vCore, General Purpose). Il existe une base de données par environnement : **sqldb-claims-dev**, **sqldb-claims-test** et **sqldb-claims-prod**. Les serveurs logiques autorisent l'accès depuis les services Azure.

        **Fabric.** Woodgrove dispose de trois espaces de travail sur une capacité F32.

        | Espace de travail | Contenu |
        | --- | --- |
        | WS-Claims-Dev | Entrepôt **DW-Claims** ; connecté à un dépôt Azure DevOps |
        | WS-Claims-Test | Entrepôt **DW-Claims** |
        | WS-Claims-Prod | Entrepôt **DW-Claims** |

        Un pipeline de déploiement nommé **DP-Claims** comporte trois phases, Development, Test et Production, affectées aux trois espaces de travail dans cet ordre. Du contenu a déjà été déployé dans les trois phases.

        Dans DW-Claims, la table **dbo.FactClaim** a une colonne nommée AdjusterUpn qui contient le nom d'utilisateur principal (UPN) du gestionnaire affecté au sinistre. La table **dbo.DimPolicyholder** a une colonne nommée NationalId.

        **Personnes.** Les gestionnaires de sinistres ont le rôle Viewer dans WS-Claims-Prod et interrogent DW-Claims en T-SQL. Les membres d'un groupe Microsoft Entra nommé **FraudTeam** ont aussi le rôle Viewer. Les ingénieurs données ont le rôle Contributor dans les trois espaces de travail.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Ingestion**

        1. The claims data must be available in Fabric within minutes of each change in the source database. Woodgrove does not want to build, schedule or monitor ETL processes, and the compute cost of the replication must be minimized.
        2. In each stage of DP-Claims, a mirrored database named **MDB-Claims** must replicate from the database of the same environment (for example, sqldb-claims-prod for Production). MDB-Claims was created in WS-Claims-Dev from sqldb-claims-dev.

        **Security**

        3. When adjusters query dbo.FactClaim, they must see only the claims assigned to them.
        4. In dbo.DimPolicyholder, adjusters must see only the last four characters of NationalId. The members of FraudTeam must see the full values.

        **Performance**

        5. Every month, the data engineers must identify the DW-Claims queries that had the longest execution times during the previous two weeks. No additional monitoring component must be deployed.
      fr: |
        **Ingestion**

        1. Les données de sinistres doivent être disponibles dans Fabric quelques minutes après chaque modification dans la base de données source. Woodgrove ne veut ni créer, ni planifier, ni superviser de processus ETL, et le coût de calcul de la réplication doit être réduit au minimum.
        2. Dans chaque phase de DP-Claims, une base de données mise en miroir nommée **MDB-Claims** doit répliquer la base de données du même environnement (par exemple sqldb-claims-prod pour Production). MDB-Claims a été créée dans WS-Claims-Dev à partir de sqldb-claims-dev.

        **Sécurité**

        3. Quand les gestionnaires de sinistres interrogent dbo.FactClaim, ils ne doivent voir que les sinistres qui leur sont affectés.
        4. Dans dbo.DimPolicyholder, les gestionnaires de sinistres ne doivent voir que les quatre derniers caractères de NationalId. Les membres de FraudTeam doivent voir les valeurs complètes.

        **Performances**

        5. Chaque mois, les ingénieurs données doivent identifier les requêtes de DW-Claims qui ont eu les durées d'exécution les plus longues pendant les deux semaines précédentes. Aucun composant de supervision supplémentaire ne doit être déployé.
