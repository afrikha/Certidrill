chapter: 12-lifecycle-management
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Fabric workspace named **WS-Data** is connected to a branch of an Azure DevOps repository. WS-Data contains several notebooks and one item of a type that Git integration doesn't support.

        What happens to the unsupported item when you commit the workspace content?
      fr: |
        Un espace de travail Fabric nommé **WS-Data** est connecté à une branche d'un dépôt Azure DevOps. WS-Data contient plusieurs notebooks et un élément d'un type que l'intégration Git ne prend pas en charge.

        Qu'advient-il de l'élément non pris en charge quand vous faites un commit du contenu de l'espace de travail ?
    body:
      options:
        - { id: a, text: { en: "Fabric deletes it from the workspace at the next update from Git", fr: "Fabric le supprime de l'espace de travail à la prochaine mise à jour depuis Git" } }
        - { id: b, text: { en: "Fabric blocks every commit until the item is removed", fr: "Fabric bloque tous les commits jusqu'à la suppression de l'élément" } }
        - { id: c, text: { en: "It stays in the workspace and isn't versioned in the branch", fr: "Il reste dans l'espace de travail et n'est pas versionné dans la branche" } }
        - { id: d, text: { en: "Fabric commits only its name and description to the branch", fr: "Fabric ne valide que son nom et sa description dans la branche" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Git integration versions only the supported items of the workspace. An unsupported item shows the Unsupported item status: it is ignored by commits and updates, and it stays in the workspace unchanged.
        fr: |
          L'intégration Git ne versionne que les éléments pris en charge de l'espace de travail. Un élément non pris en charge affiche l'état Unsupported item : il est ignoré par les commits et les mises à jour, et il reste inchangé dans l'espace de travail.
      options:
        a: { en: "Unsupported items are ignored, not deleted: an update from Git doesn't remove them.", fr: "Les éléments non pris en charge sont ignorés, pas supprimés : une mise à jour depuis Git ne les retire pas." }
        b: { en: "Commits of the supported items work normally; the unsupported item is simply left out.", fr: "Les commits des éléments pris en charge fonctionnent normalement ; l'élément non pris en charge est simplement laissé de côté." }
        d: { en: "Nothing of an unsupported item is written to the branch, not even its name or description.", fr: "Rien d'un élément non pris en charge n'est écrit dans la branche, pas même son nom ni sa description." }
    references:
      - title: Basic concepts in Git integration
        url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-12-02
    objective: "1.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a deployment pipeline whose Development and Test stages are assigned workspaces named **WS-Dev** and **WS-Test**. You deploy a notebook and a lakehouse from Development to Test.

        Which of the following does the deployment copy to WS-Test?
      fr: |
        Vous disposez d'un pipeline de déploiement dont les phases Development et Test sont attribuées aux espaces de travail nommés **WS-Dev** et **WS-Test**. Vous déployez un notebook et un lakehouse de la phase Development vers la phase Test.

        Lequel des éléments suivants le déploiement copie-t-il dans WS-Test ?
    body:
      options:
        - { id: a, text: { en: "The workspace role assignments of WS-Dev", fr: "Les attributions de rôles d'espace de travail de WS-Dev" } }
        - { id: b, text: { en: "The definitions of the notebook and of the lakehouse", fr: "Les définitions du notebook et du lakehouse" } }
        - { id: c, text: { en: "The Spark settings of the WS-Dev workspace", fr: "Les paramètres Spark de l'espace de travail WS-Dev" } }
        - { id: d, text: { en: "The rows of the tables of the lakehouse", fr: "Les lignes des tables du lakehouse" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A deployment copies item definitions and metadata, and the relationships between items, to the target stage. Data, permissions and workspace settings aren't copied: each stage is its own workspace with its own roles and settings.
        fr: |
          Un déploiement copie les définitions et les métadonnées des éléments, ainsi que les relations entre éléments, vers la phase cible. Les données, les autorisations et les paramètres de l'espace de travail ne sont pas copiés : chaque phase est son propre espace de travail, avec ses propres rôles et paramètres.
      options:
        a: { en: "Permissions aren't copied; the target workspace keeps its own role assignments.", fr: "Les autorisations ne sont pas copiées ; l'espace de travail cible garde ses propres attributions de rôles." }
        c: { en: "Workspace settings, including the Spark settings, aren't copied: each stage keeps its own.", fr: "Les paramètres de l'espace de travail, y compris les paramètres Spark, ne sont pas copiés : chaque phase garde les siens." }
        d: { en: "Deployment pipelines copy metadata only; the lakehouse arrives empty and must be loaded in Test.", fr: "Les pipelines de déploiement ne copient que des métadonnées ; le lakehouse arrive vide et doit être chargé dans Test." }
    references:
      - title: The deployment pipelines process
        url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-12-03
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Fabric workspace named **WS-App** is connected to a GitHub repository and contains a SQL database named **SQLDB_App**. You commit SQLDB_App to the connected branch for the first time.

        What does the branch contain for SQLDB_App?
      fr: |
        Un espace de travail Fabric nommé **WS-App** est connecté à un dépôt GitHub et contient une base de données SQL nommée **SQLDB_App**. Vous faites pour la première fois un commit de SQLDB_App dans la branche connectée.

        Que contient la branche pour SQLDB_App ?
    body:
      options:
        - { id: a, text: { en: "A .dacpac file that Fabric builds from the current database schema", fr: "Un fichier .dacpac que Fabric génère à partir du schéma actuel de la base" } }
        - { id: b, text: { en: "A JSON file that lists the tables of the database and their rows", fr: "Un fichier JSON qui liste les tables de la base et leurs lignes" } }
        - { id: c, text: { en: "A SQL project folder with a .sql file for each database object", fr: "Un dossier de projet SQL avec un fichier .sql pour chaque objet de la base" } }
        - { id: d, text: { en: "A single T-SQL script that creates all the objects in dependency order", fr: "Un script T-SQL unique qui crée tous les objets dans l'ordre des dépendances" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Fabric reads the object definitions of the SQL database and writes them as a SQL project: a folder named SQLDB_App.SQLDatabase that holds the project file and one .sql file per object. Table data isn't stored, and neither are database settings such as collation or compatibility level.
        fr: |
          Fabric lit les définitions des objets de la base de données SQL et les écrit sous forme de projet SQL : un dossier nommé SQLDB_App.SQLDatabase qui contient le fichier projet et un fichier .sql par objet. Les données des tables ne sont pas stockées, pas plus que les paramètres de base comme le classement ou le niveau de compatibilité.
      options:
        a: { en: "A .dacpac is produced by building the project, for example during an update from Git; it isn't what the branch stores.", fr: "Un .dacpac est produit par la génération du projet, par exemple lors d'une mise à jour depuis Git ; ce n'est pas ce que stocke la branche." }
        b: { en: "Git integration stores object definitions as code, never the rows of the tables.", fr: "L'intégration Git stocke les définitions des objets sous forme de code, jamais les lignes des tables." }
        d: { en: "The project is declarative, with one file per object, not one script that runs in order.", fr: "Le projet est déclaratif, avec un fichier par objet, pas un script unique exécuté dans l'ordre." }
    references:
      - title: SQL database source control integration in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/sql/source-control

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-12-04
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric workspace named **WS-Sales** that is connected to the **main** branch of an Azure DevOps repository. The items of WS-Sales are organized in workspace folders. In the **Source control** pane, two items named **PL_Orders** and **NB_Prices** have the status **Update required**, and no item has uncommitted changes.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé **WS-Sales** connecté à la branche **main** d'un dépôt Azure DevOps. Les éléments de WS-Sales sont organisés en dossiers d'espace de travail. Dans le volet **Source control**, deux éléments nommés **PL_Orders** et **NB_Prices** ont l'état **Update required**, et aucun élément n'a de modifications non validées.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "You can update PL_Orders from main and leave NB_Prices at its current workspace version.", fr: "Vous pouvez mettre à jour PL_Orders depuis main et laisser NB_Prices dans sa version actuelle de l'espace de travail." } }
        - { id: s2, text: { en: "A user who has the Viewer role on WS-Sales sees the Update required status of the two items.", fr: "Un utilisateur qui a le rôle Viewer sur WS-Sales voit l'état Update required des deux éléments." } }
        - { id: s3, text: { en: "The workspace folders of WS-Sales are kept as folders in main, up to 10 levels deep.", fr: "Les dossiers d'espace de travail de WS-Sales sont conservés comme dossiers dans main, jusqu'à 10 niveaux de profondeur." } }
    answer: { values: { s1: false, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          No: Update always applies the whole branch up to its latest commit; unlike commit and undo, it doesn't let you select items. No: a Viewer can't perform any Git action and doesn't see any Git information of the workspace. Yes: workspace folders are kept as Git folders, and the folder structure is maintained up to 10 levels deep.
        fr: |
          Non : Update applique toujours toute la branche jusqu'à son dernier commit ; contrairement au commit et à l'annulation, il ne permet pas de sélectionner des éléments. Non : un Viewer ne peut effectuer aucune action Git et ne voit aucune information Git de l'espace de travail. Oui : les dossiers de l'espace de travail sont conservés comme dossiers Git, et l'arborescence est maintenue jusqu'à 10 niveaux de profondeur.
    references:
      - title: Basic concepts in Git integration
        url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-12-05
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a deployment pipeline named **DP-Retail**. The Development stage is assigned a workspace named **WS-Retail-Dev** that contains 450 items. The Test stage is assigned a workspace named **WS-Retail-Test**.

        You need to promote all 450 items to the Test stage by using DP-Retail.

        What should you do?
      fr: |
        Vous disposez d'un pipeline de déploiement nommé **DP-Retail**. La phase Development est attribuée à un espace de travail nommé **WS-Retail-Dev** qui contient 450 éléments. La phase Test est attribuée à un espace de travail nommé **WS-Retail-Test**.

        Vous devez promouvoir les 450 éléments vers la phase Test à l'aide de DP-Retail.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select all 450 items, select Select related, and deploy them in one deployment", fr: "Sélectionner les 450 éléments, choisir Select related, puis les déployer en un seul déploiement" } }
        - { id: b, text: { en: "Assign WS-Retail-Dev to a second pipeline and deploy 150 items from that pipeline", fr: "Attribuer WS-Retail-Dev à un second pipeline et déployer 150 éléments depuis ce pipeline" } }
        - { id: c, text: { en: "Run at least two selective deployments, each with 300 items or fewer", fr: "Effectuer au moins deux déploiements sélectifs, chacun de 300 éléments au plus" } }
        - { id: d, text: { en: "Ask a Fabric administrator to raise the item limit in the tenant settings", fr: "Demander à un administrateur Fabric d'augmenter la limite d'éléments dans les paramètres du locataire" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A single deployment can contain at most 300 items. Deploying the 450 items in several selective deployments of 300 items or fewer promotes all of them through DP-Retail; include the items that provide dependencies in the same deployment as the items that use them, or deploy them first.
        fr: |
          Un seul déploiement peut contenir au plus 300 éléments. Déployer les 450 éléments en plusieurs déploiements sélectifs de 300 éléments au plus les promeut tous via DP-Retail ; incluez les éléments qui fournissent des dépendances dans le même déploiement que les éléments qui les utilisent, ou déployez-les d'abord.
      options:
        a: { en: "Select related adds dependencies to the selection; it doesn't lift the limit of 300 items per deployment.", fr: "Select related ajoute les dépendances à la sélection ; il ne lève pas la limite de 300 éléments par déploiement." }
        b: { en: "A workspace can be assigned to only one deployment pipeline, so WS-Retail-Dev can't join a second one.", fr: "Un espace de travail ne peut être attribué qu'à un seul pipeline de déploiement : WS-Retail-Dev ne peut pas rejoindre un second pipeline." }
        d: { en: "The limit of 300 items per deployment is a fixed limit of deployment pipelines, not a tenant setting.", fr: "La limite de 300 éléments par déploiement est une limite fixe des pipelines de déploiement, pas un paramètre du locataire." }
    references:
      - title: The deployment pipelines process
        url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-12-06
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        A Fabric workspace named **WS-Dev** is connected to the **main** branch of a GitHub repository. WS-Dev contains two lakehouses, **LH_Ref** and **LH_Sales**, which are both committed to main. LH_Ref contains a Delta table named **dim_store**. LH_Sales contains Delta tables, a Spark view and a OneLake shortcut named **sc_store** in its Tables section that points to dim_store in LH_Ref.

        You create an empty workspace named **WS-QA**, connect it to main and update it from Git. You don't run any other process in WS-QA.

        Which two statements describe WS-QA after the update?

        NOTE: Each correct selection is worth one point.
      fr: |
        Un espace de travail Fabric nommé **WS-Dev** est connecté à la branche **main** d'un dépôt GitHub. WS-Dev contient deux lakehouses, **LH_Ref** et **LH_Sales**, tous deux validés dans main. LH_Ref contient une table Delta nommée **dim_store**. LH_Sales contient des tables Delta, une vue Spark et un raccourci OneLake nommé **sc_store** dans sa section Tables, qui pointe vers dim_store dans LH_Ref.

        Vous créez un espace de travail vide nommé **WS-QA**, vous le connectez à main et vous le mettez à jour depuis Git. Vous n'exécutez aucun autre processus dans WS-QA.

        Quelles sont les deux affirmations qui décrivent WS-QA après la mise à jour ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "LH_Sales contains no Delta table rows and no files.", fr: "LH_Sales ne contient aucune ligne de table Delta ni aucun fichier." } }
        - { id: b, text: { en: "The update fails until dim_store exists in LH_Ref of WS-QA.", fr: "La mise à jour échoue tant que dim_store n'existe pas dans LH_Ref de WS-QA." } }
        - { id: c, text: { en: "sc_store points to dim_store in LH_Ref of WS-Dev, with its data.", fr: "sc_store pointe vers dim_store dans LH_Ref de WS-Dev, avec ses données." } }
        - { id: d, text: { en: "sc_store becomes valid only after dim_store is created in WS-QA.", fr: "sc_store ne devient valide qu'après la création de dim_store dans WS-QA." } }
        - { id: e, text: { en: "The Spark view of LH_Sales is recreated from its Git definition.", fr: "La vue Spark de LH_Sales est recréée à partir de sa définition Git." } }
    answer: { optionIds: [ a, d ] }
    explanation:
      correct:
        en: |
          Git stores only lakehouse metadata and shortcut definitions, so the update creates empty lakehouses in WS-QA. OneLake shortcuts with internal targets are updated during the sync to point to the items of the workspace, and the target must exist in that workspace: until dim_store exists in LH_Ref of WS-QA, sc_store is invalid and appears in the Unidentified section.
        fr: |
          Git ne stocke que les métadonnées du lakehouse et les définitions des raccourcis : la mise à jour crée donc des lakehouses vides dans WS-QA. Les raccourcis OneLake à cible interne sont mis à jour pendant la synchronisation pour pointer vers les éléments de l'espace de travail, et la cible doit exister dans cet espace de travail : tant que dim_store n'existe pas dans LH_Ref de WS-QA, sc_store n'est pas valide et apparaît dans la section Unidentified.
      options:
        b: { en: "The update succeeds; an internal shortcut whose target is missing is moved to the Unidentified section instead of failing the sync.", fr: "La mise à jour réussit ; un raccourci interne dont la cible manque est déplacé dans la section Unidentified au lieu de faire échouer la synchronisation." }
        c: { en: "Internal OneLake shortcuts are updated to target the synced workspace, not the workspace the branch came from.", fr: "Les raccourcis OneLake internes sont mis à jour pour cibler l'espace de travail synchronisé, pas l'espace de travail d'où vient la branche." }
        e: { en: "Spark views aren't tracked in Git, so they aren't recreated in WS-QA.", fr: "Les vues Spark ne sont pas suivies dans Git : elles ne sont donc pas recréées dans WS-QA." }
    references:
      - title: Lakehouse git integration and deployment pipelines
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-git-deployment-pipelines

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-12-07
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        You manage the schema of a SQL database in Fabric by using a SQL database project. A release pipeline builds the project into **AppDB.dacpac** and deploys it with SqlPackage to a test database and then to a production database.

        The release must meet four requirements, listed in the answer area.

        Which deployment option meets each requirement? To answer, drag the matching option onto each requirement. Each option may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous gérez le schéma d'une base de données SQL dans Fabric avec un projet de base de données SQL. Un pipeline de mise en production génère le projet en **AppDB.dacpac** et le déploie avec SqlPackage vers une base de test, puis vers une base de production.

        La mise en production doit répondre à quatre exigences, listées dans la zone de réponse.

        Quelle option de déploiement répond à chaque exigence ? Pour répondre, faites glisser l'option qui convient sur chaque exigence. Chaque option peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: drop, text: "/p:DropObjectsNotInSource=True" }
        - { id: block, text: "/p:BlockOnPossibleDataLoss=True" }
        - { id: script, text: "/Action:Script" }
        - { id: extract, text: "/Action:Extract" }
        - { id: pre, text: { en: "A pre-deployment script", fr: "Un script de prédéploiement" } }
        - { id: post, text: { en: "A post-deployment script", fr: "Un script de post-déploiement" } }
      targets:
        - { id: t1, text: { en: "Test: tables removed from the project are also removed from the test database", fr: "Test : les tables retirées du projet sont aussi supprimées de la base de test" } }
        - { id: t2, text: { en: "Production: the release stops if a change would narrow a column type", fr: "Production : la mise en production s'arrête si une modification réduisait le type d'une colonne" } }
        - { id: t3, text: { en: "Production: an approver reads the T-SQL of the changes before the database is changed", fr: "Production : un approbateur lit le T-SQL des modifications avant que la base ne soit modifiée" } }
        - { id: t4, text: { en: "Each deployment: a row is written to dbo.DeployLog before the schema changes are applied", fr: "Chaque déploiement : une ligne est écrite dans dbo.DeployLog avant l'application des modifications de schéma" } }
    answer: { mapping: { t1: drop, t2: block, t3: script, t4: pre } }
    explanation:
      correct:
        en: |
          DropObjectsNotInSource drops target objects that aren't in the .dacpac, which suits development and test. BlockOnPossibleDataLoss=True (its default) ends the deployment at schema validation when a change could lose data, such as narrowing a type. The Script action creates the T-SQL incremental update script without applying it, so it can be reviewed. A pre-deployment script runs before the deployment plan is executed, every time the project is deployed.
        fr: |
          DropObjectsNotInSource supprime les objets de la cible absents du .dacpac, ce qui convient au développement et au test. BlockOnPossibleDataLoss=True (sa valeur par défaut) arrête le déploiement à la validation du schéma quand une modification pourrait perdre des données, comme la réduction d'un type. L'action Script crée le script T-SQL de mise à jour incrémentielle sans l'appliquer, ce qui permet de le relire. Un script de prédéploiement s'exécute avant l'exécution du plan de déploiement, à chaque déploiement du projet.
      options:
        extract: { en: "Extract creates a .dacpac from an existing database; it doesn't compare the project with a target.", fr: "Extract crée un .dacpac à partir d'une base existante ; il ne compare pas le projet à une cible." }
        post: { en: "A post-deployment script runs after the deployment plan completes, too late for a row written before the schema changes.", fr: "Un script de post-déploiement s'exécute après la fin du plan de déploiement, trop tard pour une ligne écrite avant les modifications de schéma." }
    references:
      - title: SqlPackage Publish parameters, properties, and SQLCMD variables
        url: https://learn.microsoft.com/en-us/sql/tools/sqlpackage/sqlpackage-publish
      - title: Pre-deployment and post-deployment scripts overview
        url: https://learn.microsoft.com/en-us/sql/tools/sql-database-projects/concepts/pre-post-deployment-scripts

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-12-08
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a deployment pipeline whose Development stage is assigned a workspace named **WS-Dev**. The Test stage is empty. WS-Dev contains two lakehouses:

        - **LH_Silver**, which contains Delta tables loaded by a notebook
        - **LH_Gold**, which has a OneLake shortcut named **sc_silver** that points to a table of LH_Silver, and an Amazon S3 shortcut named **sc_s3** that points to a bucket named **dev-landing**

        You deploy LH_Silver and LH_Gold to the Test stage. You run nothing else in the Test workspace.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un pipeline de déploiement dont la phase Development est attribuée à un espace de travail nommé **WS-Dev**. La phase Test est vide. WS-Dev contient deux lakehouses :

        - **LH_Silver**, qui contient des tables Delta chargées par un notebook
        - **LH_Gold**, qui a un raccourci OneLake nommé **sc_silver** pointant vers une table de LH_Silver, et un raccourci Amazon S3 nommé **sc_s3** pointant vers un compartiment nommé **dev-landing**

        Vous déployez LH_Silver et LH_Gold vers la phase Test. Vous n'exécutez rien d'autre dans l'espace de travail de test.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "In the Test workspace, sc_silver targets LH_Silver of the Test stage, not LH_Silver of WS-Dev.", fr: "Dans l'espace de travail de test, sc_silver cible LH_Silver de la phase Test, pas LH_Silver de WS-Dev." } }
        - { id: s2, text: { en: "In the Test workspace, queries on sc_silver return the rows of the table it points to.", fr: "Dans l'espace de travail de test, les requêtes sur sc_silver renvoient les lignes de la table vers laquelle il pointe." } }
        - { id: s3, text: { en: "In the Test workspace, sc_s3 still points to the dev-landing bucket.", fr: "Dans l'espace de travail de test, sc_s3 pointe toujours vers le compartiment dev-landing." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          Yes: internal OneLake shortcuts within the same workspace are remapped to the corresponding items of the target stage. No: the deployment creates an empty LH_Silver in Test, and the target tables, folders and files of a shortcut aren't created automatically, so sc_silver has nothing to return until LH_Silver is loaded in Test. Yes: external shortcuts such as S3 keep the same target in every stage, unless you use variables or edit the shortcut after deployment.
        fr: |
          Oui : les raccourcis OneLake internes au même espace de travail sont remappés vers les éléments correspondants de la phase cible. Non : le déploiement crée un LH_Silver vide dans Test, et les tables, dossiers et fichiers cibles d'un raccourci ne sont pas créés automatiquement ; sc_silver n'a donc rien à renvoyer tant que LH_Silver n'est pas chargé dans Test. Oui : les raccourcis externes comme S3 gardent la même cible dans toutes les phases, sauf si vous utilisez des variables ou modifiez le raccourci après le déploiement.
    references:
      - title: Lakehouse git integration and deployment pipelines
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-git-deployment-pipelines

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-12-09
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        A Fabric workspace named **WS-App** is connected to the **main** branch of an Azure DevOps repository and contains a SQL database named **SQLDB_App**. A developer edits the SQL project of SQLDB_App in Visual Studio Code and merges a pull request into main. The pull request adds a stored procedure that uses a T-SQL feature that SQL database in Fabric doesn't support. Other developers have since merged valid changes into main.

        When you select **Update** in WS-App, the update of SQLDB_App fails. You need WS-App to receive the latest valid changes of main. The valid changes in main must be kept.

        What should you do?
      fr: |
        Un espace de travail Fabric nommé **WS-App** est connecté à la branche **main** d'un dépôt Azure DevOps et contient une base de données SQL nommée **SQLDB_App**. Un développeur modifie le projet SQL de SQLDB_App dans Visual Studio Code et fusionne une pull request dans main. La pull request ajoute une procédure stockée qui utilise une fonctionnalité T-SQL non prise en charge par la base de données SQL dans Fabric. D'autres développeurs ont depuis fusionné des modifications valides dans main.

        Quand vous sélectionnez **Update** dans WS-App, la mise à jour de SQLDB_App échoue. Vous devez faire en sorte que WS-App reçoive les dernières modifications valides de main. Les modifications valides de main doivent être conservées.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Revert the stored procedure change in main, and then select Update in WS-App", fr: "Annuler dans main la modification de la procédure stockée, puis sélectionner Update dans WS-App" } }
        - { id: b, text: { en: "Select Undo for SQLDB_App in WS-App, and then select Update again", fr: "Sélectionner Undo pour SQLDB_App dans WS-App, puis sélectionner de nouveau Update" } }
        - { id: c, text: { en: "Disconnect WS-App, reconnect it to main, and commit the workspace content", fr: "Déconnecter WS-App, le reconnecter à main, puis valider le contenu de l'espace de travail" } }
        - { id: d, text: { en: "Create the stored procedure in SQLDB_App with the query editor, and then commit", fr: "Créer la procédure stockée dans SQLDB_App avec l'éditeur de requêtes, puis faire un commit" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          An update of a SQL database from Git builds the SQL project and publishes the result with SqlPackage. A syntax error or an unsupported feature makes the update fail, and the change must be reverted in source control before you can continue. After the revert is in main, Update applies the whole branch, including the other developers' valid changes.
        fr: |
          Une mise à jour d'une base de données SQL depuis Git génère le projet SQL et publie le résultat avec SqlPackage. Une erreur de syntaxe ou une fonctionnalité non prise en charge fait échouer la mise à jour, et la modification doit être annulée dans le contrôle de code source avant de pouvoir continuer. Une fois l'annulation dans main, Update applique toute la branche, y compris les modifications valides des autres développeurs.
      options:
        b: { en: "Undo discards uncommitted changes of the workspace; the failing change is in main, so the next update fails again.", fr: "Undo annule les modifications non validées de l'espace de travail ; la modification en échec est dans main, donc la mise à jour suivante échoue encore." }
        c: { en: "Committing the workspace content overwrites main with the workspace version and loses the valid changes merged by the other developers.", fr: "Valider le contenu de l'espace de travail écrase main avec la version de l'espace de travail et perd les modifications valides fusionnées par les autres développeurs." }
        d: { en: "The feature isn't supported by SQL database in Fabric, so the procedure can't be created in the database either; main still holds the failing change.", fr: "La fonctionnalité n'est pas prise en charge par la base de données SQL dans Fabric : la procédure ne peut pas non plus être créée dans la base, et main contient toujours la modification en échec." }
    references:
      - title: SQL database source control integration in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/database/sql/source-control
      - title: Basic concepts in Git integration
        url: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/git-integration-process

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-12-10
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a deployment pipeline that has Test and Production stages. A lakehouse named **LH_Sales** exists in both stages, and the two copies are paired. LH_Sales in Test has an Amazon S3 shortcut named **sc_feed** that points to a bucket named **test-feed**.

        In the Production workspace, an engineer made the following changes directly to LH_Sales:

        - Edited sc_feed so that it points to a bucket named **prod-feed**
        - Created a OneLake shortcut named **sc_audit** that exists only in Production
        - Loaded the production tables of LH_Sales

        You deploy LH_Sales from Test to Production.

        Which two results occur in the Production workspace?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un pipeline de déploiement qui comporte les phases Test et Production. Un lakehouse nommé **LH_Sales** existe dans les deux phases, et ses deux copies sont appariées. LH_Sales dans Test a un raccourci Amazon S3 nommé **sc_feed** qui pointe vers un compartiment nommé **test-feed**.

        Dans l'espace de travail de production, un ingénieur a apporté directement les modifications suivantes à LH_Sales :

        - Il a modifié sc_feed pour qu'il pointe vers un compartiment nommé **prod-feed**
        - Il a créé un raccourci OneLake nommé **sc_audit** qui n'existe qu'en production
        - Il a chargé les tables de production de LH_Sales

        Vous déployez LH_Sales de la phase Test vers la phase Production.

        Quels sont les deux résultats qui se produisent dans l'espace de travail de production ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "sc_feed points to test-feed again.", fr: "sc_feed pointe de nouveau vers test-feed." } }
        - { id: b, text: { en: "sc_feed keeps pointing to prod-feed.", fr: "sc_feed continue de pointer vers prod-feed." } }
        - { id: c, text: { en: "sc_audit is kept, because Test has no shortcut of that name.", fr: "sc_audit est conservé, car Test n'a aucun raccourci de ce nom." } }
        - { id: d, text: { en: "The production tables of LH_Sales keep their rows.", fr: "Les tables de production de LH_Sales gardent leurs lignes." } }
        - { id: e, text: { en: "LH_Sales gets a new item ID and a new URL.", fr: "LH_Sales reçoit un nouvel ID d'élément et une nouvelle URL." } }
    answer: { optionIds: [ a, d ] }
    explanation:
      correct:
        en: |
          A deployment overrides the state of shortcuts in the target lakehouse: shortcuts are created, updated or deleted to match the source, and an external shortcut keeps the target defined in the source, so sc_feed points to test-feed again and sc_audit is deleted. Deployments copy metadata only and never overwrite table data, so the production rows stay.
        fr: |
          Un déploiement remplace l'état des raccourcis du lakehouse cible : les raccourcis sont créés, mis à jour ou supprimés pour correspondre à la source, et un raccourci externe garde la cible définie dans la source ; sc_feed pointe donc de nouveau vers test-feed et sc_audit est supprimé. Les déploiements ne copient que des métadonnées et n'écrasent jamais les données des tables : les lignes de production restent.
      options:
        b: { en: "The manual edit in Production is overwritten by the source definition; a per-stage target needs variables or an edit after each deployment.", fr: "La modification manuelle en production est écrasée par la définition source ; une cible par phase exige des variables ou une modification après chaque déploiement." }
        c: { en: "Shortcuts of the target lakehouse that don't exist in the source are deleted by the deployment.", fr: "Les raccourcis du lakehouse cible qui n'existent pas dans la source sont supprimés par le déploiement." }
        e: { en: "Overwriting a paired item changes only its content; its ID, URL and permissions stay the same.", fr: "L'écrasement d'un élément apparié ne change que son contenu ; son ID, son URL et ses autorisations restent les mêmes." }
    references:
      - title: Lakehouse git integration and deployment pipelines
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-git-deployment-pipelines
      - title: The deployment pipelines process
        url: https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/understand-the-deployment-process
