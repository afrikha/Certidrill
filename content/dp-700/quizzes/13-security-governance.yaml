chapter: 13-security-governance
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace named WS-Data. You need to connect WS-Data to a branch of an Azure DevOps Git repository so that the data engineers can commit the items of the workspace.

        Which workspace role must you have in WS-Data?
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS-Data. Vous devez connecter WS-Data à une branche d'un dépôt Git Azure DevOps pour que les ingénieurs de données puissent valider (commit) les éléments de l'espace de travail.

        Quel rôle d'espace de travail devez-vous avoir dans WS-Data ?
    body:
      options:
        - { id: a, text: Admin }
        - { id: b, text: Member }
        - { id: c, text: Contributor }
        - { id: d, text: Viewer }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Connecting a workspace to a Git repository is a workspace setting, and only the Admin role can change workspace settings. The same applies to the Spark settings of the workspace and to creating a workspace identity.
        fr: |
          Connecter un espace de travail à un dépôt Git est un paramètre de l'espace de travail, et seul le rôle Admin peut modifier les paramètres de l'espace de travail. Il en va de même pour les paramètres Spark de l'espace de travail et pour la création d'une identité d'espace de travail.
      options:
        b: { en: "Member can add people with lower roles and share items, but it can't change workspace settings such as the Git connection.", fr: "Member peut ajouter des personnes avec des rôles inférieurs et partager des éléments, mais il ne peut pas modifier les paramètres de l'espace de travail comme la connexion Git." }
        c: { en: "Contributor creates, edits and runs items; it doesn't manage the workspace or its Git connection.", fr: "Contributor crée, modifie et exécute des éléments ; il ne gère ni l'espace de travail ni sa connexion Git." }
        d: { en: "Viewer is read-only: it can view items and query tables with T-SQL, nothing more.", fr: "Viewer est en lecture seule : il peut consulter les éléments et interroger les tables en T-SQL, rien de plus." }
    references:
      - title: Roles in workspaces in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-13-02
    objective: "1.3.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric warehouse named DW1 that contains a table named dbo.Patient. The BirthDate column of dbo.Patient uses the date data type and has the mask `default()`.

        A user who has the Viewer role in the workspace queries the row of a patient born on 1984-06-12.

        Which value does the user see in BirthDate?
      fr: |
        Vous disposez d'un entrepôt Fabric nommé DW1 qui contient une table nommée dbo.Patient. La colonne BirthDate de dbo.Patient utilise le type de données date et porte le masque `default()`.

        Un utilisateur qui a le rôle Viewer dans l'espace de travail interroge la ligne d'un patient né le 1984-06-12.

        Quelle valeur l'utilisateur voit-il dans BirthDate ?
    body:
      options:
        - { id: a, text: "`0001-01-01`" }
        - { id: b, text: "`1900-01-01`" }
        - { id: c, text: "`XXXX`" }
        - { id: d, text: "`NULL`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The `default()` function applies a full mask that depends on the data type: `XXXX` for strings, 0 for numbers and 1900-01-01 for dates. The Viewer role has no `CONTROL` permission on the warehouse, so the user sees the masked value unless granted `UNMASK`.
        fr: |
          La fonction `default()` applique un masque complet qui dépend du type de données : `XXXX` pour les chaînes, 0 pour les nombres et 1900-01-01 pour les dates. Le rôle Viewer n'a pas l'autorisation `CONTROL` sur l'entrepôt : l'utilisateur voit donc la valeur masquée, sauf s'il reçoit `UNMASK`.
      options:
        a: { en: "0001-01-01 is the lowest value of the date type, not the value that default() returns for dates.", fr: "0001-01-01 est la plus petite valeur du type date, pas la valeur que default() renvoie pour les dates." }
        c: { en: "XXXX is the default mask of string columns; a date column keeps a date value.", fr: "XXXX est le masque par défaut des colonnes de type chaîne ; une colonne date garde une valeur de date." }
        d: { en: "Masking replaces the value with a masked value of the same type; it doesn't return NULL.", fr: "Le masquage remplace la valeur par une valeur masquée du même type ; il ne renvoie pas NULL." }
    references:
      - title: Dynamic data masking in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-13-03
    objective: "1.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Your organization uses sensitivity labels from Microsoft Purview Information Protection. The tenant setting that allows users to apply sensitivity labels is enabled for the whole organization, and a label named Confidential is published to every user.

        A workspace named WS-Fin is assigned to an F64 capacity. A data engineer named User1 has a Fabric (Free) license and the Contributor role in WS-Fin. User1 creates lakehouses in WS-Fin but can't apply the Confidential label to them.

        You need to ensure that User1 can apply the Confidential label. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Votre organisation utilise les étiquettes de confidentialité de Microsoft Purview Information Protection. Le paramètre du locataire qui permet aux utilisateurs d'appliquer des étiquettes de confidentialité est activé pour toute l'organisation, et une étiquette nommée Confidential est publiée pour tous les utilisateurs.

        Un espace de travail nommé WS-Fin est attribué à une capacité F64. Un ingénieur de données nommé User1 a une licence Fabric (Free) et le rôle Contributor dans WS-Fin. User1 crée des lakehouses dans WS-Fin mais ne peut pas leur appliquer l'étiquette Confidential.

        Vous devez faire en sorte que User1 puisse appliquer l'étiquette Confidential. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign User1 the Member role in WS-Fin.", fr: "Attribuer à User1 le rôle Member dans WS-Fin." } }
        - { id: b, text: { en: "Assign User1 a Power BI Pro license.", fr: "Attribuer à User1 une licence Power BI Pro." } }
        - { id: c, text: { en: "Ask a Fabric administrator to add User1 to the tenant setting that allows applying labels.", fr: "Demander à un administrateur Fabric d'ajouter User1 au paramètre du locataire qui permet d'appliquer des étiquettes." } }
        - { id: d, text: { en: "Set Confidential as the default label of the domain of WS-Fin.", fr: "Définir Confidential comme étiquette par défaut du domaine de WS-Fin." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Applying a sensitivity label to a Fabric item requires a Power BI Pro or Premium Per User license and edit permission on the item. User1 already has edit permission through the Contributor role; only the license is missing.
        fr: |
          Appliquer une étiquette de confidentialité à un élément Fabric exige une licence Power BI Pro ou Premium par utilisateur et l'autorisation de modification sur l'élément. User1 a déjà l'autorisation de modification grâce au rôle Contributor ; il ne manque que la licence.
      options:
        a: { en: "Contributor already gives edit permission on the items; Member adds access management but not the missing license.", fr: "Contributor donne déjà l'autorisation de modification sur les éléments ; Member ajoute la gestion des accès mais pas la licence manquante." }
        c: { en: "The tenant setting is already enabled for the whole organization, which includes User1; the license is what's missing.", fr: "Le paramètre du locataire est déjà activé pour toute l'organisation, User1 compris ; c'est la licence qui manque." }
        d: { en: "A domain default label is applied automatically but doesn't let User1 choose or change labels, and it affects every workspace of the domain.", fr: "Une étiquette par défaut de domaine s'applique automatiquement mais ne permet pas à User1 de choisir ou de modifier des étiquettes, et elle touche tous les espaces de travail du domaine." }
    references:
      - title: Apply sensitivity labels to Fabric items
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/apply-sensitivity-labels

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-13-04
    objective: "1.3.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace named WS-Lake that contains a lakehouse named LH1. A data engineer named User1 has the Contributor role in WS-Lake.

        User1 must create and maintain the OneLake security roles of LH1 for the analysts. User1 must not be able to delete WS-Lake, add workspace admins or change the workspace settings. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS-Lake qui contient un lakehouse nommé LH1. Un ingénieur de données nommé User1 a le rôle Contributor dans WS-Lake.

        User1 doit créer et maintenir les rôles de sécurité OneLake de LH1 pour les analystes. User1 ne doit pas pouvoir supprimer WS-Lake, ajouter des administrateurs de l'espace de travail ni modifier les paramètres de l'espace de travail. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the role of User1 in WS-Lake to Admin.", fr: "Changer le rôle de User1 dans WS-Lake en Admin." } }
        - { id: b, text: { en: "Add User1 to the DefaultReader role of LH1.", fr: "Ajouter User1 au rôle DefaultReader de LH1." } }
        - { id: c, text: { en: "Change the role of User1 in WS-Lake to Member.", fr: "Changer le rôle de User1 dans WS-Lake en Member." } }
        - { id: d, text: { en: "Share LH1 with User1 and select Read all data using Apache Spark.", fr: "Partager LH1 avec User1 en sélectionnant Read all data using Apache Spark." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          OneLake security roles are created and edited by users who hold Write and Reshare on the item, which in practice means the Admin and Member workspace roles. Contributor has Write but can't edit OneLake security. Member is the lowest role that can, and it can't delete the workspace, add admins or change workspace settings.
        fr: |
          Les rôles de sécurité OneLake sont créés et modifiés par les utilisateurs qui détiennent Write et Reshare sur l'élément, c'est-à-dire en pratique les rôles d'espace de travail Admin et Member. Contributor a Write mais ne peut pas modifier la sécurité OneLake. Member est le rôle le plus bas qui le peut, et il ne peut ni supprimer l'espace de travail, ni ajouter des administrateurs, ni modifier les paramètres de l'espace de travail.
      options:
        a: { en: "Admin can manage the roles too, but it can also delete the workspace and change its settings, which User1 must not do.", fr: "Admin peut aussi gérer les rôles, mais il peut également supprimer l'espace de travail et modifier ses paramètres, ce que User1 ne doit pas faire." }
        b: { en: "DefaultReader grants read access to the data; membership in a role never allows managing roles.", fr: "DefaultReader accorde l'accès en lecture aux données ; l'appartenance à un rôle ne permet jamais de gérer les rôles." }
        d: { en: "ReadAll gives read access to the files with Spark and OneLake APIs; it doesn't allow managing OneLake security.", fr: "ReadAll donne l'accès en lecture aux fichiers avec Spark et les API OneLake ; il ne permet pas de gérer la sécurité OneLake." }
    references:
      - title: Data security overview
        url: https://learn.microsoft.com/en-us/fabric/onelake/security/get-started-security
      - title: "OneLake security roles: create and manage"
        url: https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-13-05
    objective: "1.3.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso uses Microsoft Fabric, and every user has a Microsoft 365 E5 license. The compliance team searches the audit log in the Microsoft Purview portal to review who viewed, shared and deleted Fabric items.

        A new internal rule requires these Fabric activity records to remain searchable for one year.

        You need to meet the requirement. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso utilise Microsoft Fabric, et chaque utilisateur a une licence Microsoft 365 E5. L'équipe de conformité effectue des recherches dans le journal d'audit du portail Microsoft Purview pour savoir qui a consulté, partagé et supprimé des éléments Fabric.

        Une nouvelle règle interne exige que ces enregistrements d'activité Fabric restent consultables pendant un an.

        Vous devez répondre à cette exigence. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable SQL audit logs on every warehouse of the tenant, and keep the audit files for one year.", fr: "Activer les journaux d'audit SQL sur chaque entrepôt du locataire, et conserver les fichiers d'audit pendant un an." } }
        - { id: b, text: { en: "Enable OneLake diagnostics in every workspace, and keep the diagnostic events for one year.", fr: "Activer les diagnostics OneLake dans chaque espace de travail, et conserver les événements de diagnostic pendant un an." } }
        - { id: c, text: { en: "Export the Power BI activity log every day with Get-PowerBIActivityEvent, and store the files for one year.", fr: "Exporter chaque jour le journal d'activité Power BI avec Get-PowerBIActivityEvent, et stocker les fichiers pendant un an." } }
        - { id: d, text: { en: "Create an audit log retention policy in the Microsoft Purview portal that keeps the Fabric records for one year.", fr: "Créer une stratégie de rétention du journal d'audit dans le portail Microsoft Purview qui conserve les enregistrements Fabric pendant un an." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Fabric activities are recorded in the Microsoft Purview unified audit log, which keeps them for 180 days by default. With E5 licenses, an audit log retention policy that targets these records can keep them for up to one year, in the same place the compliance team already searches, with no recurring task.
        fr: |
          Les activités Fabric sont enregistrées dans le journal d'audit unifié Microsoft Purview, qui les conserve 180 jours par défaut. Avec des licences E5, une stratégie de rétention du journal d'audit qui cible ces enregistrements peut les conserver jusqu'à un an, à l'endroit où l'équipe de conformité fait déjà ses recherches, sans aucune tâche récurrente.
      options:
        a: { en: "SQL audit logs record warehouse events such as logins and object access, not item views, sharing or deletions across Fabric.", fr: "Les journaux d'audit SQL enregistrent les événements des entrepôts comme les connexions et les accès aux objets, pas les consultations, partages ou suppressions d'éléments dans Fabric." }
        b: { en: "OneLake diagnostics record data access to OneLake files, not user activities on items such as sharing and deleting.", fr: "Les diagnostics OneLake enregistrent les accès aux données des fichiers OneLake, pas les activités des utilisateurs sur les éléments comme le partage et la suppression." }
        c: { en: "The activity log covers Power BI activities only, and a daily export adds a script to run and maintain.", fr: "Le journal d'activité ne couvre que les activités Power BI, et un export quotidien ajoute un script à exécuter et à maintenir." }
    references:
      - title: Track user activities in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/admin/track-user-activities
      - title: Manage audit log retention policies
        url: https://learn.microsoft.com/en-us/purview/audit-log-retention-policies

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-13-06
    objective: "1.3.6"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware has a Fabric tenant. Sensitivity labels are enabled, and certification is enabled for a security group named DataReviewers. A workspace named WS-Corp contains a warehouse named DW_Finance, a warehouse named DW_HR, a lakehouse named LH_HR and several Power BI reports.

        The governance team lists the requirements shown in the answer area.

        Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un locataire Fabric. Les étiquettes de confidentialité sont activées, et la certification est activée pour un groupe de sécurité nommé DataReviewers. Un espace de travail nommé WS-Corp contient un entrepôt nommé DW_Finance, un entrepôt nommé DW_HR, un lakehouse nommé LH_HR et plusieurs rapports Power BI.

        L'équipe de gouvernance liste les exigences présentées dans la zone de réponse.

        Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: promoted, text: { en: "Promoted endorsement", fr: "Approbation Promoted" } }
        - { id: certified, text: { en: "Certified endorsement", fr: "Approbation Certified" } }
        - { id: label, text: { en: "Sensitivity label", fr: "Étiquette de confidentialité" } }
        - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
        - { id: cls, text: { en: "GRANT SELECT on a column list", fr: "GRANT SELECT sur une liste de colonnes" } }
        - { id: purview, text: { en: "Fabric audit log in Microsoft Purview", fr: "Journal d'audit Fabric dans Microsoft Purview" } }
        - { id: sqlaudit, text: { en: "SQL audit logs of the warehouse", fr: "Journaux d'audit SQL de l'entrepôt" } }
      targets:
        - id: trusted
          text: { en: "DW_Finance, which DataReviewers checked against the company standards, must show a trust badge and appear ahead of similar items in the OneLake catalog.", fr: "DW_Finance, que DataReviewers a vérifié selon les standards de l'entreprise, doit afficher un badge de confiance et apparaître avant les éléments similaires dans le catalogue OneLake." }
        - id: exports
          text: { en: "Excel and PDF files exported from the reports built on LH_HR must stay encrypted outside Fabric.", fr: "Les fichiers Excel et PDF exportés depuis les rapports créés sur LH_HR doivent rester chiffrés en dehors de Fabric." }
        - id: salary
          text: { en: "Viewers who query dbo.Employee in DW_HR with T-SQL must neither read nor deduce the values of its Salary column.", fr: "Les Viewers qui interrogent dbo.Employee dans DW_HR en T-SQL ne doivent ni lire ni déduire les valeurs de sa colonne Salary." }
        - id: views
          text: { en: "The security team must find which users opened a report named Budget2026 during the last month.", fr: "L'équipe de sécurité doit trouver quels utilisateurs ont ouvert un rapport nommé Budget2026 au cours du dernier mois." }
    answer:
      mapping: { trusted: certified, exports: label, salary: cls, views: purview }
    explanation:
      correct:
        en: |
          Certified marks an item reviewed against the organization's standards by authorized reviewers, and endorsed items rank higher in the OneLake catalog. A sensitivity label flows from LH_HR to the Power BI items built on it, and its protection follows exports to Excel and PDF. Column-level security makes the Salary column unreadable, so it can't be filtered on to infer values. Report views are user activities recorded in the Fabric audit log, searched in the Purview portal.
        fr: |
          Certified marque un élément vérifié selon les standards de l'organisation par des réviseurs autorisés, et les éléments approuvés sont mieux classés dans le catalogue OneLake. Une étiquette de confidentialité se propage de LH_HR aux éléments Power BI créés à partir de lui, et sa protection suit les exportations vers Excel et PDF. La sécurité au niveau des colonnes rend la colonne Salary illisible : elle ne peut donc pas servir de filtre pour déduire des valeurs. Les consultations de rapports sont des activités d'utilisateurs enregistrées dans le journal d'audit Fabric, consulté dans le portail Purview.
      options:
        promoted: { en: "Promoted shows a badge too, but it only expresses the creator's opinion; it doesn't say that reviewers checked the item.", fr: "Promoted affiche aussi un badge, mais il n'exprime que l'avis du créateur ; il n'indique pas que des réviseurs ont vérifié l'élément." }
        ddm: { en: "Masking hides values in results only; a user who can query the column can still infer values with range filters.", fr: "Le masquage ne cache les valeurs que dans les résultats ; un utilisateur qui peut interroger la colonne peut encore déduire les valeurs avec des filtres de plage." }
        sqlaudit: { en: "SQL audit logs record events of the warehouse engine, such as logins and object access, not report views.", fr: "Les journaux d'audit SQL enregistrent les événements du moteur de l'entrepôt, comme les connexions et les accès aux objets, pas les consultations de rapports." }
    references:
      - title: Endorsement overview
        url: https://learn.microsoft.com/en-us/fabric/governance/endorsement-overview
      - title: Dynamic data masking in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dynamic-data-masking

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-13-07
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric workspace named WS1 that contains a warehouse named DW1. A user named User3 has no role in WS1. You shared DW1 with User3 with no additional permissions, and then you ran the following T-SQL statements in DW1.

        ```sql
        GRANT SELECT, UPDATE ON dbo.FactSales TO [User3];

        CREATE SECURITY POLICY Security.RepFilter
        ADD FILTER PREDICATE Security.fn_rep(SalesRep) ON dbo.FactSales
        WITH (STATE = ON);
        ```

        The inline table-valued function Security.fn_rep returns a row only when its argument equals `USER_NAME()`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS1 qui contient un entrepôt nommé DW1. Un utilisateur nommé User3 n'a aucun rôle dans WS1. Vous avez partagé DW1 avec User3 sans autorisation supplémentaire, puis vous avez exécuté les instructions T-SQL suivantes dans DW1.

        ```sql
        GRANT SELECT, UPDATE ON dbo.FactSales TO [User3];

        CREATE SECURITY POLICY Security.RepFilter
        ADD FILTER PREDICATE Security.fn_rep(SalesRep) ON dbo.FactSales
        WITH (STATE = ON);
        ```

        La fonction table inline Security.fn_rep ne renvoie une ligne que lorsque son argument est égal à `USER_NAME()`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When User3 runs SELECT COUNT(*) FROM dbo.FactSales, the result counts only the rows whose SalesRep value is User3.", fr: "Quand User3 exécute SELECT COUNT(*) FROM dbo.FactSales, le résultat ne compte que les lignes dont la valeur SalesRep est User3." }
        - id: s2
          text: { en: "When User3 runs UPDATE dbo.FactSales SET Discount = 0 without a WHERE clause, the rows of every sales representative are updated.", fr: "Quand User3 exécute UPDATE dbo.FactSales SET Discount = 0 sans clause WHERE, les lignes de tous les commerciaux sont mises à jour." }
        - id: s3
          text: { en: "User3 can read every row of dbo.FactSales from a Spark notebook by using the OneLake path of DW1.", fr: "User3 peut lire toutes les lignes de dbo.FactSales depuis un notebook Spark en utilisant le chemin OneLake de DW1." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A filter predicate silently removes the rows that don't match from SELECT, UPDATE and DELETE, so aggregates and updates by User3 only see User3's rows. Reading the Delta files of DW1 with Spark bypasses T-SQL security, but it requires ReadAll, which a share with no additional permissions doesn't give: User3 can't read the files at all.
        fr: |
          Un prédicat de filtre retire silencieusement les lignes qui ne correspondent pas des SELECT, UPDATE et DELETE : les agrégats et les mises à jour de User3 ne voient donc que les lignes de User3. Lire les fichiers Delta de DW1 avec Spark contourne la sécurité T-SQL, mais exige ReadAll, qu'un partage sans autorisation supplémentaire ne donne pas : User3 ne peut pas lire les fichiers du tout.
      options:
        s2: { en: "Rows filtered by the predicate can't be updated; only the rows whose SalesRep is User3 change.", fr: "Les lignes filtrées par le prédicat ne peuvent pas être mises à jour ; seules les lignes dont SalesRep est User3 changent." }
        s3: { en: "Spark access to the files needs ReadAll (Read all data using Apache Spark); Read and the T-SQL grants don't give it.", fr: "L'accès aux fichiers par Spark exige ReadAll (Read all data using Apache Spark) ; Read et les autorisations T-SQL ne le donnent pas." }
    references:
      - title: Row-level security in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
      - title: Share your data and manage permissions
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-13-08
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace named WS-Sales that contains a warehouse named DW_Sales. A security group named RegionalAnalysts has no role in WS-Sales. Last year, DW_Sales was shared with RegionalAnalysts with **Read all data using SQL** and **Read all data using Apache Spark** selected. The analysts now use only Power BI reports and SQL clients.

        A new policy requires that each analyst sees only the rows of the dbo.FactOrders table for the analyst's own region, whatever tool the analyst uses. A table named Security.AnalystRegion in DW_Sales maps each analyst to a region.

        You need to implement the policy. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS-Sales qui contient un entrepôt nommé DW_Sales. Un groupe de sécurité nommé RegionalAnalysts n'a aucun rôle dans WS-Sales. L'an dernier, DW_Sales a été partagé avec RegionalAnalysts avec **Read all data using SQL** et **Read all data using Apache Spark** sélectionnés. Les analystes n'utilisent plus que des rapports Power BI et des clients SQL.

        Une nouvelle règle exige que chaque analyste ne voie que les lignes de la table dbo.FactOrders de sa propre région, quel que soit l'outil qu'il utilise. Une table nommée Security.AnalystRegion dans DW_Sales associe chaque analyste à une région.

        Vous devez appliquer cette règle. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a security policy that adds a filter predicate based on Security.AnalystRegion to dbo.FactOrders, and keep the current permissions of RegionalAnalysts.", fr: "Créer une stratégie de sécurité qui ajoute à dbo.FactOrders un prédicat de filtre fondé sur Security.AnalystRegion, et conserver les autorisations actuelles de RegionalAnalysts." } }
        - { id: b, text: { en: "Create a security policy that adds a filter predicate based on Security.AnalystRegion to dbo.FactOrders, and remove ReadAll from RegionalAnalysts.", fr: "Créer une stratégie de sécurité qui ajoute à dbo.FactOrders un prédicat de filtre fondé sur Security.AnalystRegion, et retirer ReadAll à RegionalAnalysts." } }
        - { id: c, text: { en: "Create a OneLake security role with a row rule for each region on DW_Sales, and remove RegionalAnalysts from the DefaultReader role.", fr: "Créer sur DW_Sales un rôle de sécurité OneLake avec une règle de lignes par région, et retirer RegionalAnalysts du rôle DefaultReader." } }
        - { id: d, text: { en: "Add a dynamic data mask to the Region column of dbo.FactOrders, and remove ReadAll from RegionalAnalysts.", fr: "Ajouter un masque dynamique des données à la colonne Region de dbo.FactOrders, et retirer ReadAll à RegionalAnalysts." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In a warehouse, row-level security is a T-SQL security policy with a filter predicate, and one predicate that looks up Security.AnalystRegion serves every region. T-SQL security applies only to queries that go through the SQL engine, while ReadAll lets the analysts read the same Delta files with Spark and see every row. Removing ReadAll closes that path without affecting Power BI and SQL clients, which use ReadData.
        fr: |
          Dans un entrepôt, la sécurité au niveau des lignes est une stratégie de sécurité T-SQL avec un prédicat de filtre, et un seul prédicat qui consulte Security.AnalystRegion sert toutes les régions. La sécurité T-SQL ne s'applique qu'aux requêtes qui passent par le moteur SQL, alors que ReadAll permet aux analystes de lire les mêmes fichiers Delta avec Spark et de voir toutes les lignes. Retirer ReadAll ferme ce chemin sans toucher aux rapports Power BI ni aux clients SQL, qui utilisent ReadData.
      options:
        a: { en: "With ReadAll, the analysts can still read the Delta files of DW_Sales with Spark, where the T-SQL policy doesn't apply.", fr: "Avec ReadAll, les analystes peuvent encore lire les fichiers Delta de DW_Sales avec Spark, où la stratégie T-SQL ne s'applique pas." }
        c: { en: "OneLake security roles are defined on lakehouses and mirrored items, not on warehouses; one role per region would also add administration.", fr: "Les rôles de sécurité OneLake se définissent sur les lakehouses et les éléments mis en miroir, pas sur les entrepôts ; un rôle par région ajouterait en outre de l'administration." }
        d: { en: "A mask hides the Region values in results but returns every row; it doesn't filter rows.", fr: "Un masque cache les valeurs de Region dans les résultats mais renvoie toutes les lignes ; il ne filtre pas les lignes." }
    references:
      - title: Row-level security in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/row-level-security
      - title: Share your data and manage permissions
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/share-warehouse-manage-permissions

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-13-09
    objective: "1.3.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a Fabric workspace named WS-Sales that contains a schema-enabled lakehouse named LH1. LH1 contains a Delta table named dbo.Sales that has a Region column. OneLake security is enabled on LH1, and the DefaultReader role was deleted.

        A OneLake security role named RoleEMEA grants Read on dbo.Sales with the row rule `SELECT * FROM dbo.Sales WHERE Region = 'EMEA'`. The SQL analytics endpoint of LH1 uses delegated identity access mode, and no T-SQL permission or security policy is defined on it.

        Both users below are members of RoleEMEA:

        - User1 has the Viewer role in WS-Sales.
        - User2 has the Contributor role in WS-Sales.

        Which rows does each user see? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS-Sales qui contient un lakehouse avec schémas nommé LH1. LH1 contient une table Delta nommée dbo.Sales qui a une colonne Region. La sécurité OneLake est activée sur LH1, et le rôle DefaultReader a été supprimé.

        Un rôle de sécurité OneLake nommé RoleEMEA accorde Read sur dbo.Sales avec la règle de lignes `SELECT * FROM dbo.Sales WHERE Region = 'EMEA'`. Le point de terminaison d'analytique SQL de LH1 utilise le mode d'identité déléguée, et aucune autorisation T-SQL ni aucune stratégie de sécurité n'y est définie.

        Les deux utilisateurs ci-dessous sont membres de RoleEMEA :

        - User1 a le rôle Viewer dans WS-Sales.
        - User2 a le rôle Contributor dans WS-Sales.

        Quelles lignes chaque utilisateur voit-il ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          User1 reads dbo.Sales in a Spark notebook and sees [[u1spark]].

          User1 queries dbo.Sales through the SQL analytics endpoint and sees [[u1sql]].

          User2 reads dbo.Sales in a Spark notebook and sees [[u2spark]].
        fr: |
          User1 lit dbo.Sales dans un notebook Spark et voit [[u1spark]].

          User1 interroge dbo.Sales via le point de terminaison d'analytique SQL et voit [[u1sql]].

          User2 lit dbo.Sales dans un notebook Spark et voit [[u2spark]].
      slots:
        - id: u1spark
          options:
            - { id: emea, text: { en: "only the EMEA rows", fr: "uniquement les lignes EMEA" } }
            - { id: all, text: { en: "all the rows", fr: "toutes les lignes" } }
            - { id: none, text: { en: "no rows, because access is denied", fr: "aucune ligne, car l'accès est refusé" } }
        - id: u1sql
          options:
            - { id: emea, text: { en: "only the EMEA rows", fr: "uniquement les lignes EMEA" } }
            - { id: all, text: { en: "all the rows", fr: "toutes les lignes" } }
            - { id: none, text: { en: "no rows, because access is denied", fr: "aucune ligne, car l'accès est refusé" } }
        - id: u2spark
          options:
            - { id: emea, text: { en: "only the EMEA rows", fr: "uniquement les lignes EMEA" } }
            - { id: all, text: { en: "all the rows", fr: "toutes les lignes" } }
            - { id: none, text: { en: "no rows, because access is denied", fr: "aucune ligne, car l'accès est refusé" } }
    answer:
      values: { u1spark: emea, u1sql: all, u2spark: all }
    explanation:
      correct:
        en: |
          Spark reads go through OneLake, so the row rule of RoleEMEA applies to User1, a Viewer. In delegated identity mode, the SQL analytics endpoint ignores OneLake security and uses the T-SQL permissions: the Viewer role includes ReadData, and no T-SQL security filters the table, so User1 sees every row. Contributor has Write on the lakehouse, which bypasses OneLake security roles, so User2 sees every row in Spark.
        fr: |
          Les lectures Spark passent par OneLake : la règle de lignes de RoleEMEA s'applique donc à User1, qui est Viewer. En mode d'identité déléguée, le point de terminaison d'analytique SQL ignore la sécurité OneLake et utilise les autorisations T-SQL : le rôle Viewer inclut ReadData, et aucune sécurité T-SQL ne filtre la table ; User1 voit donc toutes les lignes. Contributor a Write sur le lakehouse, ce qui contourne les rôles de sécurité OneLake ; User2 voit donc toutes les lignes dans Spark.
      options:
        none: { en: "A Viewer doesn't need DefaultReader when a custom role grants Read; access is denied only to users who are in no role.", fr: "Un Viewer n'a pas besoin de DefaultReader quand un rôle personnalisé accorde Read ; l'accès n'est refusé qu'aux utilisateurs qui ne sont dans aucun rôle." }
    references:
      - title: OneLake security roles, permissions, and scopes
        url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
      - title: Roles in workspaces in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-13-10
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a Fabric workspace named WS-Curated that contains a schema-enabled lakehouse named LH1. OneLake security is enabled on LH1, and its DefaultReader role is unchanged. A OneLake security role named SalesOnly grants Read on the dbo.Sales table. The SQL analytics endpoint of LH1 uses delegated identity access mode, and no T-SQL permission is defined on it.

        A data scientist named User5 has no role in WS-Curated and has the Contributor role in another workspace named WS-Lab. You share LH1 with User5 and select **Read all data using SQL** and **Read all data using Apache Spark**.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS-Curated qui contient un lakehouse avec schémas nommé LH1. La sécurité OneLake est activée sur LH1, et son rôle DefaultReader n'a pas été modifié. Un rôle de sécurité OneLake nommé SalesOnly accorde Read sur la table dbo.Sales. Le point de terminaison d'analytique SQL de LH1 utilise le mode d'identité déléguée, et aucune autorisation T-SQL n'y est définie.

        Une data scientist nommée User5 n'a aucun rôle dans WS-Curated et a le rôle Contributor dans un autre espace de travail nommé WS-Lab. Vous partagez LH1 avec User5 en sélectionnant **Read all data using SQL** et **Read all data using Apache Spark**.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "User5 can read every table of LH1 from a notebook in WS-Lab.", fr: "User5 peut lire toutes les tables de LH1 depuis un notebook de WS-Lab." } }
        - { id: b, text: { en: "If you add User5 to SalesOnly, the notebooks of User5 can read only dbo.Sales.", fr: "Si vous ajoutez User5 à SalesOnly, les notebooks de User5 ne peuvent lire que dbo.Sales." } }
        - { id: c, text: { en: "User5 can share LH1 with colleagues and give them the same permissions.", fr: "User5 peut partager LH1 avec des collègues et leur donner les mêmes autorisations." } }
        - { id: d, text: { en: "User5 can query every table of LH1 through its SQL analytics endpoint.", fr: "User5 peut interroger toutes les tables de LH1 via son point de terminaison d'analytique SQL." } }
        - { id: e, text: { en: "User5 can upload files to the Files folder of LH1 by using OneLake file explorer.", fr: "User5 peut charger des fichiers dans le dossier Files de LH1 avec l'explorateur de fichiers OneLake." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          ReadAll places User5 in DefaultReader, which grants Read on all the data of LH1 to Spark and the OneLake APIs, from any workspace. ReadData works like db_datareader, and in delegated identity mode the endpoint applies the T-SQL permissions, so User5 can query every table.
        fr: |
          ReadAll place User5 dans DefaultReader, qui accorde Read sur toutes les données de LH1 à Spark et aux API OneLake, depuis n'importe quel espace de travail. ReadData fonctionne comme db_datareader, et en mode d'identité déléguée le point de terminaison applique les autorisations T-SQL : User5 peut donc interroger toutes les tables.
      options:
        b: { en: "OneLake security roles combine as a union: User5 keeps full access through DefaultReader until removed from it.", fr: "Les rôles de sécurité OneLake se combinent par union : User5 garde un accès complet par DefaultReader tant qu'il n'en est pas retiré." }
        c: { en: "The Share (Reshare) option wasn't selected, so User5 can't share LH1 onward.", fr: "L'option Share (Reshare) n'a pas été sélectionnée : User5 ne peut donc pas repartager LH1." }
        e: { en: "Sharing never grants write permission; uploading files needs a workspace role with Write or a ReadWrite OneLake security role.", fr: "Le partage n'accorde jamais l'autorisation d'écriture ; charger des fichiers exige un rôle d'espace de travail avec Write ou un rôle de sécurité OneLake ReadWrite." }
    references:
      - title: Lakehouse sharing and permission management
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sharing
      - title: OneLake security roles, permissions, and scopes
        url: https://learn.microsoft.com/en-us/fabric/onelake/security/data-access-control-model
