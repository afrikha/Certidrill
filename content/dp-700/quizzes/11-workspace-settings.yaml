chapter: 11-workspace-settings
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A data engineer named **Mia** must change the **Default pool for workspace** in the Spark settings of a Fabric workspace named **WS-Eng**.

        Which workspace role must Mia have in WS-Eng?
      fr: |
        Une ingénieure données nommée **Mia** doit modifier le **Default pool for workspace** dans les paramètres Spark d'un espace de travail Fabric nommé **WS-Eng**.

        Quel rôle d'espace de travail Mia doit-elle avoir dans WS-Eng ?
    body:
      options:
        - { id: a, text: Viewer }
        - { id: b, text: Contributor }
        - { id: c, text: Member }
        - { id: d, text: Admin }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Spark settings of a workspace (pool, environment, jobs, high concurrency) are managed by workspace admins: changing them requires the Admin role on the workspace. The other roles can run notebooks on the pool that the admin selected, but can't change the workspace default.
        fr: |
          Les paramètres Spark d'un espace de travail (pool, environnement, travaux, haute concurrence) sont gérés par les administrateurs de l'espace de travail : les modifier exige le rôle Admin sur l'espace de travail. Les autres rôles peuvent exécuter des notebooks sur le pool choisi par l'administrateur, mais ne peuvent pas modifier la valeur par défaut de l'espace de travail.
      options:
        a: { en: "Viewer can only view and read content; it can't change any workspace setting.", fr: "Viewer peut seulement consulter et lire le contenu ; il ne peut modifier aucun paramètre de l'espace de travail." }
        b: { en: "Contributor can create and edit items such as notebooks, but the Spark settings of the workspace are reserved for admins.", fr: "Contributor peut créer et modifier des éléments comme des notebooks, mais les paramètres Spark de l'espace de travail sont réservés aux administrateurs." }
        c: { en: "Member can also share items and add members, but changing the Spark settings still requires the Admin role.", fr: "Member peut en plus partager des éléments et ajouter des membres, mais modifier les paramètres Spark exige toujours le rôle Admin." }
    references:
      - title: Workspace administration settings in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-11-02
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You turn on **Add diagnostic events to a lakehouse** in the OneLake settings of a Fabric workspace named **WS-Claims**, and you select a lakehouse named **LH_Diag** as the destination.

        Which events will be written to LH_Diag?
      fr: |
        Vous activez **Add diagnostic events to a lakehouse** dans les paramètres OneLake d'un espace de travail Fabric nommé **WS-Claims**, et vous choisissez un lakehouse nommé **LH_Diag** comme destination.

        Quels événements seront écrits dans LH_Diag ?
    body:
      options:
        - { id: a, text: { en: "Data access operations on the OneLake data of WS-Claims, such as file reads and writes", fr: "Les opérations d'accès aux données OneLake de WS-Claims, comme les lectures et écritures de fichiers" } }
        - { id: b, text: { en: "Item management activities in WS-Claims, such as creating, sharing or deleting items", fr: "Les activités de gestion des éléments de WS-Claims, comme la création, le partage ou la suppression d'éléments" } }
        - { id: c, text: { en: "Capacity unit consumption of each item of WS-Claims, aggregated by hour", fr: "La consommation d'unités de capacité de chaque élément de WS-Claims, agrégée par heure" } }
        - { id: d, text: { en: "Driver and executor logs of the Spark sessions that run in WS-Claims", fr: "Les journaux du pilote et des exécuteurs des sessions Spark qui s'exécutent dans WS-Claims" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          OneLake diagnostics streams data access events (who accessed which data, when and how, through the web experience, APIs, pipelines or engines) as JSON files into the selected lakehouse. It answers "who read or wrote this data", not "who changed this item".
        fr: |
          Les diagnostics OneLake envoient les événements d'accès aux données (qui a accédé à quelles données, quand et comment, via l'interface web, les API, les pipelines ou les moteurs) sous forme de fichiers JSON dans le lakehouse choisi. Ils répondent à « qui a lu ou écrit ces données », pas à « qui a modifié cet élément ».
      options:
        b: { en: "Creating, sharing or deleting items are activities of the Fabric audit log, not OneLake diagnostic events.", fr: "Créer, partager ou supprimer des éléments sont des activités du journal d'audit Fabric, pas des événements de diagnostic OneLake." }
        c: { en: "Capacity unit consumption is reported by the Microsoft Fabric Capacity Metrics app, not by OneLake diagnostics.", fr: "La consommation d'unités de capacité est présentée par l'application Microsoft Fabric Capacity Metrics, pas par les diagnostics OneLake." }
        d: { en: "Spark driver and executor logs are in the Spark monitoring experiences of the session, not in OneLake diagnostics.", fr: "Les journaux du pilote et des exécuteurs Spark se trouvent dans les outils de supervision Spark de la session, pas dans les diagnostics OneLake." }
    references:
      - title: OneLake diagnostics
        url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-diagnostics-overview

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-11-03
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Your Fabric tenant has a domain named **Finance**. A user named **Rosa** is a domain admin of Finance and has no other admin role in Fabric. Finance contains 30 workspaces.

        Business users must be able to find the accounting workspaces and the treasury workspaces separately, while both groups stay under Finance. Rosa must set this up herself, without help from a Fabric administrator.

        What should Rosa do?
      fr: |
        Votre locataire Fabric comporte un domaine nommé **Finance**. Une utilisatrice nommée **Rosa** est administratrice du domaine Finance et n'a aucun autre rôle d'administration dans Fabric. Finance contient 30 espaces de travail.

        Les utilisateurs métier doivent pouvoir trouver séparément les espaces de travail de comptabilité et ceux de trésorerie, tandis que les deux groupes restent rattachés à Finance. Rosa doit mettre cela en place elle-même, sans l'aide d'un administrateur Fabric.

        Que doit faire Rosa ?
    body:
      options:
        - { id: a, text: { en: "Create two domains named Accounting and Treasury, and assign the workspaces to them", fr: "Créer deux domaines nommés Accounting et Treasury, puis leur attribuer les espaces de travail" } }
        - { id: b, text: { en: "Create two subdomains of Finance named Accounting and Treasury, and assign the workspaces to them", fr: "Créer deux sous-domaines de Finance nommés Accounting et Treasury, puis leur attribuer les espaces de travail" } }
        - { id: c, text: { en: "Add the accounting admins and the treasury admins as two groups in the Default domain setting of Finance", fr: "Ajouter les administrateurs de comptabilité et ceux de trésorerie comme deux groupes dans le paramètre Default domain de Finance" } }
        - { id: d, text: { en: "Name an accounting lead and a treasury lead as domain admins of Finance, each for their own workspaces", fr: "Nommer un responsable comptabilité et un responsable trésorerie administrateurs du domaine Finance, chacun pour ses espaces de travail" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Subdomains refine the grouping inside a domain, and a domain admin can create them and assign workspaces to them. The subdomains stay under Finance and are managed by the domain admins of Finance, so Rosa needs no Fabric administrator.
        fr: |
          Les sous-domaines affinent le regroupement à l'intérieur d'un domaine, et un administrateur de domaine peut les créer et leur attribuer des espaces de travail. Les sous-domaines restent sous Finance et sont gérés par les administrateurs du domaine Finance : Rosa n'a besoin d'aucun administrateur Fabric.
      options:
        a: { en: "Only a Fabric administrator can create domains, and two new domains wouldn't stay under Finance.", fr: "Seul un administrateur Fabric peut créer des domaines, et deux nouveaux domaines ne resteraient pas sous Finance." }
        c: { en: "The default domain assigns the workspaces of the listed users to Finance itself; it doesn't create separate groups inside the domain.", fr: "Le domaine par défaut attribue les espaces de travail des utilisateurs listés à Finance même ; il ne crée pas de groupes distincts dans le domaine." }
        d: { en: "Domain admins can't add other domain admins, and a domain admin manages the whole domain, not a subset of workspaces.", fr: "Les administrateurs de domaine ne peuvent pas ajouter d'autres administrateurs de domaine, et un administrateur de domaine gère tout le domaine, pas une partie des espaces de travail." }
    references:
      - title: Fabric domains
        url: https://learn.microsoft.com/en-us/fabric/governance/domains

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-11-04
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric workspace named **WS-Dev**. Its **Apache Airflow Runtime Settings** use the starter pool. Its Spark settings use a custom Spark pool named **Pool-Big** as the **Default pool for workspace**.

        An Apache Airflow job in WS-Dev runs a DAG named **dag_export** at 08:00 and at 14:00 every day. Each run lasts about 10 minutes, and nothing else runs in the Apache Airflow environment.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé **WS-Dev**. Ses **Apache Airflow Runtime Settings** utilisent le pool de démarrage. Ses paramètres Spark utilisent un pool Spark personnalisé nommé **Pool-Big** comme **Default pool for workspace**.

        Un travail Apache Airflow de WS-Dev exécute un DAG nommé **dag_export** à 08:00 et à 14:00 chaque jour. Chaque exécution dure environ 10 minutes, et rien d'autre ne s'exécute dans l'environnement Apache Airflow.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The 14:00 run of dag_export can wait for the Apache Airflow runtime to resume before it starts.", fr: "L'exécution de 14:00 de dag_export peut attendre la reprise du runtime Apache Airflow avant de démarrer." } }
        - { id: s2, text: { en: "The tasks of dag_export run on the nodes of Pool-Big.", fr: "Les tâches de dag_export s'exécutent sur les nœuds de Pool-Big." } }
        - { id: s3, text: { en: "Selecting a custom Apache Airflow pool would reduce the capacity consumption of WS-Dev between the two runs.", fr: "Choisir un pool Apache Airflow personnalisé réduirait la consommation de capacité de WS-Dev entre les deux exécutions." } }
    answer: { values: { s1: true, s2: false, s3: false } }
    explanation:
      correct:
        en: |
          Yes: the starter pool shuts down after 20 minutes of inactivity, so after the 08:00 run it stops, and the 14:00 run waits for the runtime to resume (up to about 5 minutes). No: Apache Airflow jobs run on the pool selected in the Data Factory runtime settings; the Spark default pool is a separate setting used by notebooks and Spark job definitions. No: a custom pool is always on until it is paused and consumes capacity units without DAG activity, so it would increase consumption between the runs.
        fr: |
          Oui : le pool de démarrage s'arrête après 20 minutes d'inactivité ; il s'arrête donc après l'exécution de 08:00 et l'exécution de 14:00 attend la reprise du runtime (jusqu'à 5 minutes environ). Non : les travaux Apache Airflow s'exécutent sur le pool choisi dans les paramètres de runtime Data Factory ; le pool Spark par défaut est un paramètre distinct, utilisé par les notebooks et les définitions de travail Spark. Non : un pool personnalisé reste actif jusqu'à une pause et consomme des unités de capacité sans activité de DAG ; il augmenterait donc la consommation entre les exécutions.
    references:
      - title: Apache Airflow Job workspace settings
        url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-workspace-settings

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-11-05
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Tailspin Toys has two Fabric capacities. **Cap1** hosts workspaces named **WS-Sales** and **WS-HR**. **Cap2** hosts a workspace named **WS-Ops**.

        You need to turn on OneLake diagnostics for the three workspaces. The events must be stored in lakehouses that are in workspaces dedicated to diagnostics, and you must minimize the number of destination lakehouses.

        How many destination lakehouses should you create?
      fr: |
        Tailspin Toys dispose de deux capacités Fabric. **Cap1** héberge les espaces de travail nommés **WS-Sales** et **WS-HR**. **Cap2** héberge un espace de travail nommé **WS-Ops**.

        Vous devez activer les diagnostics OneLake pour les trois espaces de travail. Les événements doivent être stockés dans des lakehouses situés dans des espaces de travail dédiés aux diagnostics, et vous devez réduire au minimum le nombre de lakehouses de destination.

        Combien de lakehouses de destination devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "One, in a dedicated workspace on Cap1", fr: "Un, dans un espace de travail dédié sur Cap1" } }
        - { id: b, text: { en: "Two, one in a dedicated workspace on each capacity", fr: "Deux, un dans un espace de travail dédié sur chaque capacité" } }
        - { id: c, text: { en: "Three, one in a dedicated workspace per monitored workspace", fr: "Trois, un dans un espace de travail dédié par espace de travail surveillé" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The destination lakehouse must be on the same capacity as the workspace it receives events from, and several workspaces of the same capacity can send their events to a single lakehouse, each in its own WorkspaceId folder. One lakehouse on Cap1 serves WS-Sales and WS-HR, and a second one on Cap2 serves WS-Ops.
        fr: |
          Le lakehouse de destination doit être sur la même capacité que l'espace de travail dont il reçoit les événements, et plusieurs espaces de travail d'une même capacité peuvent envoyer leurs événements dans un seul lakehouse, chacun dans son dossier WorkspaceId. Un lakehouse sur Cap1 sert WS-Sales et WS-HR, et un second sur Cap2 sert WS-Ops.
      options:
        a: { en: "A lakehouse on Cap1 can't receive the events of WS-Ops, which runs on Cap2.", fr: "Un lakehouse sur Cap1 ne peut pas recevoir les événements de WS-Ops, qui s'exécute sur Cap2." }
        c: { en: "Workspaces of the same capacity can share one destination lakehouse, so a third lakehouse isn't needed.", fr: "Les espaces de travail d'une même capacité peuvent partager un lakehouse de destination : un troisième lakehouse n'est pas nécessaire." }
    references:
      - title: OneLake diagnostics
        url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-diagnostics-overview

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-11-06
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric workspace named **WS-Lab** in which high concurrency **For notebooks** is on. No Spark property has been changed from its default value.

        A user named **User1** opens a notebook named **NB1**, selects **New high concurrency session** and runs a cell that defines a variable named `df_orders`. User1 then attaches a notebook named **NB2** to the same session. NB1 and NB2 have the same default lakehouse, environment and compute settings.

        A second user named **User2** owns a notebook named **NB3**, which has the same default lakehouse, environment and compute settings as NB1.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé **WS-Lab** dans lequel la haute concurrence **For notebooks** est activée. Aucune propriété Spark n'a été modifiée par rapport à sa valeur par défaut.

        Un utilisateur nommé **User1** ouvre un notebook nommé **NB1**, sélectionne **New high concurrency session** et exécute une cellule qui définit une variable nommée `df_orders`. User1 attache ensuite un notebook nommé **NB2** à la même session. NB1 et NB2 ont le même lakehouse par défaut, le même environnement et les mêmes paramètres de calcul.

        Un second utilisateur nommé **User2** possède un notebook nommé **NB3**, qui a le même lakehouse par défaut, le même environnement et les mêmes paramètres de calcul que NB1.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A cell in NB2 can read the content of `df_orders` without defining it again.", fr: "Une cellule de NB2 peut lire le contenu de `df_orders` sans le redéfinir." } }
        - { id: s2, text: { en: "The Spark compute of the shared session is reported against NB1 in the Capacity Metrics app.", fr: "Le calcul Spark de la session partagée est imputé à NB1 dans l'application Capacity Metrics." } }
        - { id: s3, text: { en: "User2 can attach NB3 to the session that User1 started, because NB3 meets the other conditions.", fr: "User2 peut attacher NB3 à la session démarrée par User1, puisque NB3 remplit les autres conditions." } }
    answer: { values: { s1: false, s2: true, s3: false } }
    explanation:
      correct:
        en: |
          No: each notebook of a high concurrency session gets its own REPL core, which isolates its execution state, so variables of NB1 aren't visible in NB2. Yes: only the notebook that starts the shared Spark application is billed, and Capacity Metrics reports the usage against that initiating notebook. No: sessions are shared only within a single-user boundary; NB3, run by User2, gets its own session even with the same lakehouse, environment and compute.
        fr: |
          Non : chaque notebook d'une session haute concurrence reçoit son propre cœur REPL, qui isole son état d'exécution ; les variables de NB1 ne sont donc pas visibles dans NB2. Oui : seul le notebook qui démarre l'application Spark partagée est facturé, et Capacity Metrics impute l'utilisation à ce notebook initiateur. Non : les sessions ne se partagent qu'à l'intérieur de la limite d'un seul utilisateur ; NB3, exécuté par User2, obtient sa propre session même avec le même lakehouse, le même environnement et le même calcul.
    references:
      - title: High concurrency mode in Apache Spark for Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/high-concurrency-overview

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-11-07
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a Fabric workspace named **WS-Ext** that contains a lakehouse named **LH_Ext**. The shortcut cache of WS-Ext is on, with the longest retention period that the setting allows. LH_Ext has the following shortcuts, and their remote files are never modified:

        - **sc_archive** points to an Amazon S3 bucket. A job reads its 600 MB files once every 35 days.
        - **sc_video** points to a Google Cloud Storage bucket. A notebook reads its 3 GB files every day.
        - **sc_erp** points to on-premises storage through an on-premises data gateway. A pipeline reads its 80 MB files every week.
        - **sc_iot** points to S3 compatible storage. A notebook reads its 200 MB files every two days.
        - **sc_ref** points to an Azure Data Lake Storage Gen2 account in another Azure region. A notebook reads its 50 MB files every day.

        For which two shortcuts will the repeated reads be served from the cache?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé **WS-Ext** qui contient un lakehouse nommé **LH_Ext**. Le cache des raccourcis de WS-Ext est activé, avec la période de rétention la plus longue que le paramètre autorise. LH_Ext comporte les raccourcis suivants, et leurs fichiers distants ne sont jamais modifiés :

        - **sc_archive** pointe vers un compartiment Amazon S3. Un travail lit ses fichiers de 600 Mo une fois tous les 35 jours.
        - **sc_video** pointe vers un compartiment Google Cloud Storage. Un notebook lit ses fichiers de 3 Go chaque jour.
        - **sc_erp** pointe vers un stockage local via une passerelle de données locale. Un pipeline lit ses fichiers de 80 Mo chaque semaine.
        - **sc_iot** pointe vers un stockage compatible S3. Un notebook lit ses fichiers de 200 Mo tous les deux jours.
        - **sc_ref** pointe vers un compte Azure Data Lake Storage Gen2 d'une autre région Azure. Un notebook lit ses fichiers de 50 Mo chaque jour.

        Pour quels deux raccourcis les lectures répétées seront-elles servies depuis le cache ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: sc_archive }
        - { id: b, text: sc_video }
        - { id: c, text: sc_erp }
        - { id: d, text: sc_iot }
        - { id: e, text: sc_ref }
    answer: { optionIds: [ c, d ] }
    explanation:
      correct:
        en: |
          The cache supports S3, S3 compatible, Google Cloud Storage and on-premises data gateway shortcuts, keeps files of 1 GB or less, and purges a file that isn't read within the retention period, which is at most 28 days; each read resets that period. sc_erp (gateway, read weekly) and sc_iot (S3 compatible, read every two days) meet all three conditions.
        fr: |
          Le cache prend en charge les raccourcis S3, compatibles S3, Google Cloud Storage et passerelle de données locale, conserve les fichiers de 1 Go au plus, et purge un fichier qui n'est pas lu pendant la période de rétention, de 28 jours au maximum ; chaque lecture remet cette période à zéro. sc_erp (passerelle, lu chaque semaine) et sc_iot (compatible S3, lu tous les deux jours) remplissent les trois conditions.
      options:
        a: { en: "The longest retention period is 28 days: a file read every 35 days is purged before the next read, which goes to S3.", fr: "La période de rétention la plus longue est de 28 jours : un fichier lu tous les 35 jours est purgé avant la lecture suivante, qui va vers S3." }
        b: { en: "Google Cloud Storage shortcuts are supported, but files larger than 1 GB are never cached.", fr: "Les raccourcis Google Cloud Storage sont pris en charge, mais les fichiers de plus de 1 Go ne sont jamais mis en cache." }
        e: { en: "Azure Data Lake Storage Gen2 shortcuts aren't in the list of shortcut types that the cache supports.", fr: "Les raccourcis Azure Data Lake Storage Gen2 ne figurent pas dans la liste des types de raccourcis pris en charge par le cache." }
    references:
      - title: OneLake shortcuts
        url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-11-08
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Your Fabric tenant contains a domain named **Operations** and a capacity named **Cap-Ops**. On Monday, Cap-Ops hosts the following workspaces, none of which is assigned to a domain:

        - **WS-O1** and **WS-O2**, two shared workspaces
        - The My workspace of a user named **Ben**

        On Monday, a Fabric administrator assigns workspaces to Operations by using the **By capacity** method and selects Cap-Ops. On Wednesday, a user creates a workspace named **WS-O3** on Cap-Ops. On Thursday, an existing unassigned workspace named **WS-O4** is moved from another capacity to Cap-Ops.

        On Friday, which workspaces are assigned to Operations?
      fr: |
        Votre locataire Fabric contient un domaine nommé **Operations** et une capacité nommée **Cap-Ops**. Le lundi, Cap-Ops héberge les espaces de travail suivants, dont aucun n'est attribué à un domaine :

        - **WS-O1** et **WS-O2**, deux espaces de travail partagés
        - L'espace Mon espace de travail d'un utilisateur nommé **Ben**

        Le lundi, un administrateur Fabric attribue des espaces de travail à Operations avec la méthode **By capacity** et sélectionne Cap-Ops. Le mercredi, un utilisateur crée un espace de travail nommé **WS-O3** sur Cap-Ops. Le jeudi, un espace de travail existant et non attribué nommé **WS-O4** est déplacé d'une autre capacité vers Cap-Ops.

        Le vendredi, quels espaces de travail sont attribués à Operations ?
    body:
      options:
        - { id: a, text: { en: "WS-O1, WS-O2, WS-O3 and WS-O4", fr: "WS-O1, WS-O2, WS-O3 et WS-O4" } }
        - { id: b, text: { en: "WS-O1, WS-O2 and the My workspace of Ben", fr: "WS-O1, WS-O2 et l'espace Mon espace de travail de Ben" } }
        - { id: c, text: { en: "WS-O1, WS-O2 and WS-O3", fr: "WS-O1, WS-O2 et WS-O3" } }
        - { id: d, text: { en: "WS-O1 and WS-O2 only", fr: "WS-O1 et WS-O2 uniquement" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The By capacity method assigns the shared workspaces that are on the selected capacity when the assignment is made, and it excludes My workspaces. It isn't a rule for the future: workspaces created on the capacity later, or moved to it later, aren't assigned. On Friday, only WS-O1 and WS-O2 belong to Operations.
        fr: |
          La méthode By capacity attribue les espaces de travail partagés présents sur la capacité choisie au moment de l'attribution, et exclut les espaces Mon espace de travail. Ce n'est pas une règle pour l'avenir : les espaces de travail créés plus tard sur la capacité, ou déplacés plus tard vers elle, ne sont pas attribués. Le vendredi, seuls WS-O1 et WS-O2 appartiennent à Operations.
      options:
        a: { en: "WS-O3 and WS-O4 arrived on Cap-Ops after the assignment; By capacity affects only the workspaces present at that time.", fr: "WS-O3 et WS-O4 sont arrivés sur Cap-Ops après l'attribution ; By capacity ne concerne que les espaces de travail présents à ce moment-là." }
        b: { en: "My workspaces are excluded from the By capacity method, even when they run on the selected capacity.", fr: "Les espaces Mon espace de travail sont exclus de la méthode By capacity, même quand ils s'exécutent sur la capacité choisie." }
        c: { en: "A workspace created on Cap-Ops after the assignment isn't assigned automatically; only a default domain applies to future workspaces.", fr: "Un espace de travail créé sur Cap-Ops après l'attribution n'est pas attribué automatiquement ; seul un domaine par défaut s'applique aux futurs espaces de travail." }
    references:
      - title: Fabric domains
        url: https://learn.microsoft.com/en-us/fabric/governance/domains

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-11-09
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric capacity named **Cap-Shared** that hosts several workspaces. Spark jobs of other workspaces run on Cap-Shared every night between 22:00 and 05:00.

        A workspace named **WS-AirDev** on Cap-Shared uses the starter pool in its Apache Airflow runtime settings. Developers trigger DAG runs at irregular times between 09:00 and 18:00 on weekdays, often more than 30 minutes apart, and the first run after each pause waits several minutes before it starts.

        You need to ensure that DAG runs triggered during working hours start without waiting for the Apache Airflow runtime. Apache Airflow capacity consumption outside working hours must be minimized, and the nightly Spark jobs must not be affected.

        What should you do?
      fr: |
        Vous disposez d'une capacité Fabric nommée **Cap-Shared** qui héberge plusieurs espaces de travail. Des travaux Spark d'autres espaces de travail s'exécutent sur Cap-Shared chaque nuit entre 22:00 et 05:00.

        Un espace de travail nommé **WS-AirDev** sur Cap-Shared utilise le pool de démarrage dans ses paramètres de runtime Apache Airflow. Les développeurs déclenchent des exécutions de DAG à des heures irrégulières entre 09:00 et 18:00 en semaine, souvent à plus de 30 minutes d'intervalle, et la première exécution après chaque pause attend plusieurs minutes avant de démarrer.

        Vous devez faire en sorte que les exécutions de DAG déclenchées pendant les heures de travail démarrent sans attendre le runtime Apache Airflow. La consommation de capacité d'Apache Airflow en dehors des heures de travail doit être réduite au minimum, et les travaux Spark de nuit ne doivent pas être affectés.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select a custom pool as the default, pause the pool each evening and resume it each morning before 09:00", fr: "Choisir un pool personnalisé par défaut, mettre le pool en pause chaque soir et le reprendre chaque matin avant 09:00" } }
        - { id: b, text: { en: "Select a custom pool as the default, pause Cap-Shared each evening and resume it each morning before 09:00", fr: "Choisir un pool personnalisé par défaut, suspendre Cap-Shared chaque soir et la reprendre chaque matin avant 09:00" } }
        - { id: c, text: { en: "Select a custom pool with Enable autoscale on, so that the pool releases all its nodes outside working hours", fr: "Choisir un pool personnalisé avec Enable autoscale activé, pour que le pool libère tous ses nœuds en dehors des heures de travail" } }
        - { id: d, text: { en: "Keep the starter pool, and add extra nodes to it so that it resumes faster after each idle period", fr: "Garder le pool de démarrage et lui ajouter des nœuds supplémentaires pour qu'il reprenne plus vite après chaque période d'inactivité" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The starter pool shuts down after 20 minutes of inactivity, which causes the wait; a custom pool is always on until it is paused, so runs start without delay. Because a custom pool consumes capacity units even without DAG activity, pausing it after working hours and resuming it early enough (resume takes up to 5 minutes) minimizes consumption without touching the rest of Cap-Shared.
        fr: |
          Le pool de démarrage s'arrête après 20 minutes d'inactivité, ce qui provoque l'attente ; un pool personnalisé reste actif jusqu'à une pause, donc les exécutions démarrent sans délai. Comme un pool personnalisé consomme des unités de capacité même sans activité de DAG, le mettre en pause après les heures de travail et le reprendre assez tôt (la reprise prend jusqu'à 5 minutes) réduit la consommation sans toucher au reste de Cap-Shared.
      options:
        b: { en: "Pausing Cap-Shared stops every workload of the capacity, including the nightly Spark jobs of the other workspaces.", fr: "Suspendre Cap-Shared arrête toutes les charges de la capacité, y compris les travaux Spark de nuit des autres espaces de travail." }
        c: { en: "Autoscale adds and removes extra nodes with the load, but the base nodes keep running and consuming capacity until the pool is paused.", fr: "La mise à l'échelle automatique ajoute et retire des nœuds supplémentaires selon la charge, mais les nœuds de base continuent de tourner et de consommer de la capacité jusqu'à une pause du pool." }
        d: { en: "The starter pool has no scaling options, and extra nodes add workers, not faster resumes; it would still shut down after 20 idle minutes.", fr: "Le pool de démarrage n'a pas d'options de mise à l'échelle, et les nœuds supplémentaires ajoutent des workers, pas une reprise plus rapide ; il s'arrêterait toujours après 20 minutes d'inactivité." }
    references:
      - title: Apache Airflow Job workspace settings
        url: https://learn.microsoft.com/en-us/fabric/data-factory/apache-airflow-jobs-workspace-settings

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-11-10
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You are an admin of a Fabric workspace named **WS-Risk**. The **Default pool for workspace** is the starter pool, and **Customize compute configurations for items** is off. The capacity setting **Customized workspace pools** is on.

        Analysts run interactive notebooks in WS-Risk all day. A new Spark job definition named **SJD-VaR** needs memory-optimized X-Large nodes.

        You need to run SJD-VaR on X-Large nodes. Interactive notebook sessions must keep starting in seconds, and the other items must keep their current compute.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous êtes administrateur d'un espace de travail Fabric nommé **WS-Risk**. Le **Default pool for workspace** est le pool de démarrage, et **Customize compute configurations for items** est désactivé. Le paramètre de capacité **Customized workspace pools** est activé.

        Des analystes exécutent des notebooks interactifs dans WS-Risk toute la journée. Une nouvelle définition de travail Spark nommée **SJD-VaR** a besoin de nœuds X-Large optimisés pour la mémoire.

        Vous devez exécuter SJD-VaR sur des nœuds X-Large. Les sessions de notebook interactives doivent continuer à démarrer en quelques secondes, et les autres éléments doivent garder leur calcul actuel.

        Quelles sont les trois actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Create a custom Spark pool with memory-optimized X-Large nodes", fr: "Créer un pool Spark personnalisé avec des nœuds X-Large optimisés pour la mémoire" } }
        - { id: b, text: { en: "Set the custom Spark pool as the Default pool for workspace", fr: "Définir le pool Spark personnalisé comme Default pool for workspace" } }
        - { id: c, text: { en: "Turn on Customize compute configurations for items", fr: "Activer Customize compute configurations for items" } }
        - { id: d, text: { en: "Attach to SJD-VaR an environment whose Environment pool is the custom pool", fr: "Attacher à SJD-VaR un environnement dont l'Environment pool est le pool personnalisé" } }
        - { id: e, text: { en: "Raise the maximum nodes of the starter pool in the Pool settings", fr: "Augmenter le nombre maximal de nœuds du pool de démarrage dans les paramètres Pool" } }
        - { id: f, text: { en: "Turn on Reserve maximum cores for active Spark jobs", fr: "Activer Reserve maximum cores for active Spark jobs" } }
    answer: { optionIds: [ a, c, d ] }
    explanation:
      correct:
        en: |
          The starter pool uses Medium nodes, so X-Large nodes require a custom pool, which the workspace admin can create because Customized workspace pools is on. The workspace default stays the starter pool for fast interactive sessions, and only SJD-VaR selects the custom pool through an environment. Selecting a pool in an environment requires Customize compute configurations for items: while it is off, the Compute section of environments is disabled and every job uses the default pool.
        fr: |
          Le pool de démarrage utilise des nœuds Medium : des nœuds X-Large exigent un pool personnalisé, que l'administrateur de l'espace de travail peut créer puisque Customized workspace pools est activé. Le pool par défaut reste le pool de démarrage pour des sessions interactives rapides, et seul SJD-VaR choisit le pool personnalisé via un environnement. Choisir un pool dans un environnement exige Customize compute configurations for items : tant qu'il est désactivé, la section Compute des environnements est désactivée et tous les travaux utilisent le pool par défaut.
      options:
        b: { en: "Making the custom pool the workspace default would move every notebook to it, and sessions would take minutes to start.", fr: "Faire du pool personnalisé le pool par défaut y basculerait tous les notebooks, et les sessions mettraient des minutes à démarrer." }
        e: { en: "More nodes don't change the node size: the starter pool keeps its Medium nodes.", fr: "Plus de nœuds ne change pas la taille des nœuds : le pool de démarrage garde ses nœuds Medium." }
        f: { en: "Reserving maximum cores changes job admission on the capacity; it doesn't give a job larger nodes.", fr: "Réserver les cœurs maximaux modifie l'admission des travaux sur la capacité ; cela ne donne pas de nœuds plus grands à un travail." }
    references:
      - title: Workspace administration settings in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/workspace-admin-settings
      - title: Spark compute configuration settings in Fabric environments
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/environment-manage-compute
