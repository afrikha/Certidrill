chapter: 22-batch-data
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-22-01
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have an eventhouse that contains a KQL database named **SalesDB**. You create a OneLake shortcut named **StoreTargets** in SalesDB. The shortcut points to a Delta table in a lakehouse.

        You need to query StoreTargets from a KQL queryset.

        How should the query reference StoreTargets?
      fr: |
        Vous disposez d'un eventhouse qui contient une base de données KQL nommée **SalesDB**. Vous créez un raccourci OneLake nommé **StoreTargets** dans SalesDB. Le raccourci pointe vers une table Delta d'un lakehouse.

        Vous devez interroger StoreTargets depuis un ensemble de requêtes KQL.

        Comment la requête doit-elle référencer StoreTargets ?
    body:
      options:
        - { id: a, text: "`table('StoreTargets')`" }
        - { id: b, text: "`materialized_view('StoreTargets')`" }
        - { id: c, text: "`external_table('StoreTargets')`" }
        - { id: d, text: "`database('SalesDB').StoreTargets`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In a KQL database, a OneLake shortcut is exposed as an external table, so a query reads it with `external_table('<shortcut-name>')`. Each shortcut points to one folder or table, and it can't be renamed after it's created.
        fr: |
          Dans une base de données KQL, un raccourci OneLake est exposé comme une table externe : une requête le lit donc avec `external_table('<shortcut-name>')`. Chaque raccourci pointe vers un seul dossier ou une seule table, et il ne peut pas être renommé après sa création.
      options:
        a: { en: "`table()` references a native table of the database; a shortcut isn't a native table.", fr: "`table()` référence une table native de la base de données ; un raccourci n'est pas une table native." }
        b: { en: "`materialized_view()` reads a materialized view, which a shortcut isn't.", fr: "`materialized_view()` lit une vue matérialisée, ce qu'un raccourci n'est pas." }
        d: { en: "Qualifying the name with the database still references a native table; a shortcut is reached through `external_table()`.", fr: "Qualifier le nom par la base de données référence toujours une table native ; un raccourci s'atteint par `external_table()`." }
    references:
      - title: Create OneLake shortcuts in a KQL database
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-22-02
    objective: "2.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace that is assigned to an F32 capacity. The workspace contains a mirrored database named **MDB_Sales** that replicates an Azure SQL database.

        The capacity was paused for the weekend and resumed on Monday morning. On Monday afternoon, analysts report that the changes made in the source database since Friday don't appear in MDB_Sales. Monitor replication shows the status **Paused**.

        You need to restart the replication with the least administrative effort. What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric attribué à une capacité F32. L'espace de travail contient une base de données mise en miroir nommée **MDB_Sales** qui réplique une base de données Azure SQL.

        La capacité a été suspendue pendant le week-end et reprise le lundi matin. Le lundi après-midi, les analystes signalent que les changements effectués dans la base source depuis vendredi n'apparaissent pas dans MDB_Sales. Monitor replication affiche l'état **Paused**.

        Vous devez relancer la réplication avec un minimum d'effort administratif. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Wait for the capacity to finish resuming: replication restarts by itself.", fr: "Attendre que la capacité ait fini de reprendre : la réplication redémarre d'elle-même." } }
        - { id: b, text: { en: "Scale the capacity to F64, then wait for the replication to restart.", fr: "Faire passer la capacité à F64, puis attendre que la réplication redémarre." } }
        - { id: c, text: { en: "Delete MDB_Sales, then create a new mirrored database for the source.", fr: "Supprimer MDB_Sales, puis créer une nouvelle base de données mise en miroir pour la source." } }
        - { id: d, text: { en: "Open MDB_Sales in the Fabric portal and select Resume replication.", fr: "Ouvrir MDB_Sales dans le portail Fabric et sélectionner Resume replication." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Pausing the capacity stops mirroring. When the capacity is resumed, the mirrored database stays in the Paused status and source changes aren't replicated until you select Resume replication on the mirrored database; mirroring then continues from where it stopped (after a very long pause, it can reseed the data).
        fr: |
          Suspendre la capacité arrête la mise en miroir. Quand la capacité est reprise, la base de données mise en miroir reste à l'état Paused et les changements de la source ne sont pas répliqués tant que vous ne sélectionnez pas Resume replication sur la base mise en miroir ; la mise en miroir reprend alors là où elle s'était arrêtée (après une très longue suspension, elle peut réamorcer les données).
      options:
        a: { en: "Unlike a throttled capacity, a resumed capacity leaves mirroring in the Paused status until someone resumes the replication.", fr: "Contrairement à une capacité limitée, une capacité reprise laisse la mise en miroir à l'état Paused jusqu'à ce que quelqu'un reprenne la réplication." }
        b: { en: "Scaling changes compute and the free storage limit, but it doesn't resume a paused replication.", fr: "La mise à l'échelle change le calcul et la limite de stockage gratuit, mais elle ne reprend pas une réplication suspendue." }
        c: { en: "Re-creating the item works but replicates all the data again from the start: far more effort than resuming the replication.", fr: "Recréer l'élément fonctionne mais réplique de nouveau toutes les données depuis le début : bien plus d'effort que reprendre la réplication." }
    references:
      - title: Troubleshoot Fabric mirrored databases
        url: https://learn.microsoft.com/en-us/fabric/mirroring/troubleshooting
      - title: Monitor Fabric mirrored database replication
        url: https://learn.microsoft.com/en-us/fabric/mirroring/monitor

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-22-03
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a Fabric workspace named **WS_Retail** that contains a warehouse named **DW_Retail** and a lakehouse named **LH_Web**. DW_Retail contains a table named dbo.Customers. Data engineers load a Delta table named web_sessions into LH_Web by using notebooks.

        A SQL analyst must write a T-SQL query that joins dbo.Customers with web_sessions. The data must not be copied, and the analyst must not maintain any ingestion process.

        What should the analyst do?
      fr: |
        Woodgrove Bank dispose d'un espace de travail Fabric nommé **WS_Retail** qui contient un entrepôt nommé **DW_Retail** et un lakehouse nommé **LH_Web**. DW_Retail contient une table nommée dbo.Customers. Les ingénieurs données chargent une table Delta nommée web_sessions dans LH_Web avec des notebooks.

        Un analyste SQL doit écrire une requête T-SQL qui joint dbo.Customers à web_sessions. Les données ne doivent pas être copiées, et l'analyste ne doit maintenir aucun processus d'ingestion.

        Que doit faire l'analyste ?
    body:
      options:
        - { id: a, text: { en: "Copy web_sessions into DW_Retail every night with a Copy data activity, then join the two warehouse tables.", fr: "Copier web_sessions dans DW_Retail chaque nuit avec une activité Copy data, puis joindre les deux tables de l'entrepôt." } }
        - { id: b, text: { en: "Query from DW_Retail and reference the lakehouse table by its three-part name, LH_Web.dbo.web_sessions.", fr: "Interroger depuis DW_Retail et référencer la table du lakehouse par son nom en trois parties, LH_Web.dbo.web_sessions." } }
        - { id: c, text: { en: "Create a mirrored database for LH_Web, then join dbo.Customers with the mirrored copy of web_sessions.", fr: "Créer une base de données mise en miroir pour LH_Web, puis joindre dbo.Customers à la copie mise en miroir de web_sessions." } }
        - { id: d, text: { en: "In the SQL analytics endpoint of LH_Web, insert dbo.Customers into a new lakehouse table, then join the tables.", fr: "Dans le point de terminaison d'analytique SQL de LH_Web, insérer dbo.Customers dans une nouvelle table du lakehouse, puis joindre les tables." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A warehouse and the SQL analytics endpoint of a lakehouse of the same workspace can be queried together: after adding LH_Web to the explorer, the query references its table as `LH_Web.dbo.web_sessions`. Both stores keep their data in OneLake, so the join reads the Delta table in place, with nothing to copy or schedule.
        fr: |
          Un entrepôt et le point de terminaison d'analytique SQL d'un lakehouse du même espace de travail peuvent être interrogés ensemble : après avoir ajouté LH_Web à l'explorateur, la requête référence sa table par `LH_Web.dbo.web_sessions`. Les deux magasins gardent leurs données dans OneLake : la jointure lit la table Delta sur place, sans rien à copier ni à planifier.
      options:
        a: { en: "A nightly copy duplicates the data and is an ingestion process the analyst would have to maintain.", fr: "Une copie nocturne duplique les données et constitue un processus d'ingestion que l'analyste devrait maintenir." }
        c: { en: "Mirroring replicates external databases into OneLake; a lakehouse is already in OneLake, and a mirror would be a second copy.", fr: "La mise en miroir réplique des bases de données externes dans OneLake ; un lakehouse est déjà dans OneLake, et un miroir serait une seconde copie." }
        d: { en: "The SQL analytics endpoint of a lakehouse is read-only for tables, and this approach would copy dbo.Customers.", fr: "Le point de terminaison d'analytique SQL d'un lakehouse est en lecture seule pour les tables, et cette approche copierait dbo.Customers." }
    references:
      - title: Query the warehouse or SQL analytics endpoint
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-warehouse

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-22-04
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a pipeline named **PL_Nightly** that contains a Notebook activity named **BuildSilver**, followed by a Stored procedure activity named **LoadFacts**. BuildSilver overwrites Delta tables in a lakehouse named **LH_Silver**. LoadFacts runs in a warehouse and reads the LH_Silver tables by using three-part names.

        On some nights, LoadFacts reads the data of the previous night even though BuildSilver succeeded.

        You need LoadFacts to read the data that BuildSilver has just written. What should you add between BuildSilver and LoadFacts?
      fr: |
        Vous disposez d'un pipeline nommé **PL_Nightly** qui contient une activité Notebook nommée **BuildSilver**, suivie d'une activité Stored procedure nommée **LoadFacts**. BuildSilver remplace des tables Delta d'un lakehouse nommé **LH_Silver**. LoadFacts s'exécute dans un entrepôt et lit les tables de LH_Silver avec des noms en trois parties.

        Certaines nuits, LoadFacts lit les données de la nuit précédente alors que BuildSilver a réussi.

        Vous devez faire en sorte que LoadFacts lise les données que BuildSilver vient d'écrire. Que devez-vous ajouter entre BuildSilver et LoadFacts ?
    body:
      options:
        - { id: a, text: { en: "A Lakehouse maintenance activity that optimizes the LH_Silver tables", fr: "Une activité Lakehouse maintenance qui optimise les tables de LH_Silver" } }
        - { id: b, text: { en: "A Wait activity that pauses the pipeline for ten minutes", fr: "Une activité Wait qui met le pipeline en pause pendant dix minutes" } }
        - { id: c, text: { en: "A Get metadata activity that lists the files of the LH_Silver tables", fr: "Une activité Get metadata qui liste les fichiers des tables de LH_Silver" } }
        - { id: d, text: { en: "A Refresh SQL analytics endpoint activity for the LH_Silver endpoint", fr: "Une activité Refresh SQL analytics endpoint pour le point de terminaison de LH_Silver" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The SQL analytics endpoint of a lakehouse doesn't always reflect Delta changes immediately after a Spark write. The Refresh SQL analytics endpoint activity updates the endpoint metadata within the pipeline, so the next activity reads the data just written; refreshing after a notebook writes to a lakehouse is one of its documented scenarios.
        fr: |
          Le point de terminaison d'analytique SQL d'un lakehouse ne reflète pas toujours les changements Delta immédiatement après une écriture Spark. L'activité Refresh SQL analytics endpoint met à jour les métadonnées du point de terminaison dans le pipeline : l'activité suivante lit alors les données tout juste écrites. Actualiser après l'écriture d'un notebook dans un lakehouse fait partie de ses scénarios documentés.
      options:
        a: { en: "Lakehouse maintenance compacts and cleans the tables; it doesn't synchronize the SQL analytics endpoint.", fr: "Lakehouse maintenance compacte et nettoie les tables ; elle ne synchronise pas le point de terminaison d'analytique SQL." }
        b: { en: "A fixed wait delays every run and still doesn't guarantee that the endpoint has synchronized the new data.", fr: "Une attente fixe retarde chaque exécution sans garantir que le point de terminaison a synchronisé les nouvelles données." }
        c: { en: "Get metadata reads information about files and folders; it doesn't refresh what the endpoint exposes to T-SQL.", fr: "Get metadata lit des informations sur les fichiers et les dossiers ; elle n'actualise pas ce que le point de terminaison expose à T-SQL." }
    references:
      - title: Refresh SQL analytics endpoint activity
        url: https://learn.microsoft.com/en-us/fabric/data-factory/refresh-sql-endpoint-activity
      - title: Activity overview
        url: https://learn.microsoft.com/en-us/fabric/data-factory/activity-overview

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-22-05
    objective: "2.2.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a lakehouse that contains a table named **gold_store_daily**, with one row per store and day. The table has the columns StoreID, OrderDate, Revenue (the sum of the order amounts) and Customers (the number of distinct customers who placed an order that day).

        An analyst calculates the number of customers of each store for November 2026 by summing Customers over the days of November.

        How does the result compare with the real number of distinct customers of each store in November?
      fr: |
        Vous disposez d'un lakehouse qui contient une table nommée **gold_store_daily**, avec une ligne par magasin et par jour. La table a les colonnes StoreID, OrderDate, Revenue (la somme des montants des commandes) et Customers (le nombre de clients distincts qui ont passé une commande ce jour-là).

        Un analyste calcule le nombre de clients de chaque magasin pour novembre 2026 en additionnant Customers sur les jours de novembre.

        Comment le résultat se compare-t-il au nombre réel de clients distincts de chaque magasin en novembre ?
    body:
      options:
        - { id: a, text: { en: "Equal to it, because each daily value is already a distinct count", fr: "Il lui est égal, car chaque valeur journalière est déjà un nombre distinct" } }
        - { id: b, text: { en: "Equal to it or lower, because days without any order have no row", fr: "Il lui est égal ou inférieur, car les jours sans commande n'ont pas de ligne" } }
        - { id: c, text: { en: "Equal to it or higher, because a repeat customer is counted on each day", fr: "Il lui est égal ou supérieur, car un client récurrent est compté chaque jour" } }
        - { id: d, text: { en: "Equal to it only if Revenue is summed over the same days too", fr: "Il lui est égal seulement si Revenue est aussi additionné sur les mêmes jours" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A distinct count is non-additive: summing daily distinct counts counts a customer once for every day on which they ordered. The monthly figure must be computed from the order-level data (for example `countDistinct()` grouped by store and month), or stored as its own aggregate.
        fr: |
          Un nombre distinct n'est pas additif : additionner des nombres distincts journaliers compte un client une fois pour chaque jour où il a commandé. Le chiffre mensuel doit être calculé à partir des données au niveau des commandes (par exemple `countDistinct()` groupé par magasin et par mois), ou stocké comme un agrégat à part.
      options:
        a: { en: "Each day is distinct on its own, but the same customer can appear in several days, so the sum isn't distinct over the month.", fr: "Chaque jour est distinct en lui-même, mais le même client peut apparaître sur plusieurs jours : la somme n'est pas distincte sur le mois." }
        b: { en: "A missing day adds nothing to the sum and removes no customer from the month: it can't make the sum lower than the real count.", fr: "Un jour manquant n'ajoute rien à la somme et ne retire aucun client du mois : il ne peut pas rendre la somme inférieure au nombre réel." }
        d: { en: "Revenue is additive and has no effect on how customers are counted.", fr: "Revenue est additif et n'a aucun effet sur la façon dont les clients sont comptés." }
    references:
      - title: "Dimensional modeling in Microsoft Fabric Warehouse: Fact tables"
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-22-06
    objective: "2.2.9"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a lakehouse named **LH_Sales**. A notebook reads CSV extracts of order lines into a PySpark DataFrame named **lines** that has the columns OrderID, LineNo, ProductID, Channel, Comment and Amount. OrderID and LineNo together identify an order line.

        The extracts have the following problems:

        - Some files were delivered twice, so some rows are exact copies of other rows.
        - Some rows have no OrderID and can't be used.
        - Channel is null in some rows. Comment is often null, which is valid.

        You need a DataFrame that removes the copies and the unusable rows and replaces the null values of Channel with Unknown. Every order line must be kept, and all the other values must stay unchanged.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un lakehouse nommé **LH_Sales**. Un notebook lit des extraits CSV de lignes de commande dans un DataFrame PySpark nommé **lines** qui a les colonnes OrderID, LineNo, ProductID, Channel, Comment et Amount. OrderID et LineNo identifient ensemble une ligne de commande.

        Les extraits présentent les problèmes suivants :

        - Certains fichiers ont été livrés deux fois : certaines lignes sont des copies exactes d'autres lignes.
        - Certaines lignes n'ont pas d'OrderID et sont inutilisables.
        - Channel est nul dans certaines lignes. Comment est souvent nul, ce qui est valide.

        Vous avez besoin d'un DataFrame qui retire les copies et les lignes inutilisables et remplace les valeurs nulles de Channel par Unknown. Chaque ligne de commande doit être conservée, et toutes les autres valeurs doivent rester inchangées.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        clean = (lines
            .[[dup]]
            .[[miss]]
            .[[fill]])
      slots:
        - id: dup
          options:
            - { id: d_all, text: "dropDuplicates()" }
            - { id: d_order, text: "dropDuplicates([\"OrderID\"])" }
            - { id: d_na, text: "dropna(how=\"all\")" }
        - id: miss
          options:
            - { id: m_any, text: "dropna()" }
            - { id: m_sub, text: "dropna(subset=[\"OrderID\"])" }
            - { id: m_keep, text: "filter(\"OrderID IS NULL\")" }
            - { id: m_zero, text: "fillna(0, subset=[\"OrderID\"])" }
        - id: fill
          options:
            - { id: f_all, text: "fillna(\"Unknown\")" }
            - { id: f_sub, text: "fillna(\"Unknown\", subset=[\"Channel\"])" }
            - { id: f_drop, text: "dropna(subset=[\"Channel\"])" }
            - { id: f_rep, text: "replace(\"null\", \"Unknown\", subset=[\"Channel\"])" }
    answer:
      values: { dup: d_all, miss: m_sub, fill: f_sub }
    explanation:
      correct:
        en: |
          `dropDuplicates()` without columns removes only the rows that are identical on every column, which are the copies of the files delivered twice. `dropna(subset=["OrderID"])` drops only the rows that lack the required key, so a null Comment doesn't remove a row. `fillna("Unknown", subset=["Channel"])` replaces the nulls of Channel only and leaves the other columns as they are.
        fr: |
          `dropDuplicates()` sans colonnes retire uniquement les lignes identiques sur toutes les colonnes, c'est-à-dire les copies des fichiers livrés deux fois. `dropna(subset=["OrderID"])` écarte uniquement les lignes auxquelles il manque la clé obligatoire : un Comment nul ne retire donc pas de ligne. `fillna("Unknown", subset=["Channel"])` remplace les valeurs nulles de Channel uniquement et laisse les autres colonnes telles quelles.
      options:
        d_order: { en: "An order has several lines with the same OrderID: deduplicating on OrderID alone keeps an arbitrary line of each order and drops the others.", fr: "Une commande a plusieurs lignes avec le même OrderID : dédoublonner sur OrderID seul garde une ligne arbitraire de chaque commande et écarte les autres." }
        d_na: { en: "This removes rows whose values are all null; it doesn't remove copies of complete rows.", fr: "Cette instruction retire les lignes dont toutes les valeurs sont nulles ; elle ne retire pas les copies de lignes complètes." }
        m_any: { en: "Without a subset, any null removes the row, so every line with a null Comment or Channel would be lost.", fr: "Sans sous-ensemble, n'importe quelle valeur nulle retire la ligne : toutes les lignes avec un Comment ou un Channel nul seraient perdues." }
        m_keep: { en: "This keeps only the unusable rows instead of removing them.", fr: "Cette instruction garde uniquement les lignes inutilisables au lieu de les retirer." }
        m_zero: { en: "Filling the key with 0 keeps unusable rows and invents an order number.", fr: "Remplir la clé avec 0 garde des lignes inutilisables et invente un numéro de commande." }
        f_all: { en: "Without a subset, the value fills the nulls of every string column, including the valid null values of Comment.", fr: "Sans sous-ensemble, la valeur remplit les valeurs nulles de toutes les colonnes de type chaîne, y compris les valeurs nulles valides de Comment." }
        f_drop: { en: "Dropping the rows with a null Channel loses order lines that must be kept.", fr: "Écarter les lignes dont Channel est nul perd des lignes de commande qui doivent être conservées." }
        f_rep: { en: "`replace()` swaps the string \"null\", not null values.", fr: "`replace()` remplace la chaîne \"null\", pas les valeurs nulles." }
    references:
      - title: Shape and clean data
        url: https://learn.microsoft.com/en-us/training/modules/fabric-transform-data-notebooks/3-shape-clean-data

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-22-07
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has an eventhouse that contains a KQL database named **TelemetryDB**. An eventstream ingests JSON events into a table named **RawTelemetry**.

        A team of SQL developers must maintain a transformation that parses RawTelemetry into a typed table named **Telemetry**. The solution must meet the following requirements:

        - Telemetry must be filled automatically each time data is ingested into RawTelemetry.
        - The data must not leave the eventhouse.
        - Development effort must be minimized.

        What should the team do?
      fr: |
        Litware dispose d'un eventhouse qui contient une base de données KQL nommée **TelemetryDB**. Un flux d'événements ingère des événements JSON dans une table nommée **RawTelemetry**.

        Une équipe de développeurs SQL doit maintenir une transformation qui analyse RawTelemetry vers une table typée nommée **Telemetry**. La solution doit répondre aux exigences suivantes :

        - Telemetry doit être remplie automatiquement chaque fois que des données sont ingérées dans RawTelemetry.
        - Les données ne doivent pas quitter l'eventhouse.
        - L'effort de développement doit être réduit au minimum.

        Que doit faire l'équipe ?
    body:
      options:
        - { id: a, text: { en: "Write the parsing as a T-SQL INSERT...SELECT into Telemetry, and run it from a KQL queryset after each ingestion.", fr: "Écrire l'analyse sous forme d'INSERT...SELECT T-SQL dans Telemetry, et l'exécuter depuis un ensemble de requêtes KQL après chaque ingestion." } }
        - { id: b, text: { en: "Write the parsing as a T-SQL view in TelemetryDB, and create an update policy on Telemetry that selects from the view.", fr: "Écrire l'analyse sous forme de vue T-SQL dans TelemetryDB, et créer une stratégie de mise à jour sur Telemetry qui lit la vue." } }
        - { id: c, text: { en: "Write the parsing as a KQL stored function, and create an update policy on Telemetry that runs the function at ingestion.", fr: "Écrire l'analyse sous forme de fonction stockée KQL, et créer une stratégie de mise à jour sur Telemetry qui exécute la fonction à l'ingestion." } }
        - { id: d, text: { en: "Write the parsing as a T-SQL stored procedure in a warehouse that reads RawTelemetry through OneLake availability.", fr: "Écrire l'analyse sous forme de procédure stockée T-SQL dans un entrepôt qui lit RawTelemetry via la disponibilité OneLake." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Transformations at ingestion time in an eventhouse are KQL: an update policy runs a stored function on each batch ingested into the source table and writes the result to the target table. T-SQL in a KQL database supports only queries (DQL), so it can't create objects or insert rows; the developers can still type a T-SQL SELECT preceded by `explain` to get the equivalent KQL as a starting point for the function.
        fr: |
          Les transformations au moment de l'ingestion dans un eventhouse se font en KQL : une stratégie de mise à jour exécute une fonction stockée sur chaque lot ingéré dans la table source et écrit le résultat dans la table cible. T-SQL dans une base de données KQL ne prend en charge que des requêtes (DQL) : il ne peut ni créer d'objets ni insérer de lignes. Les développeurs peuvent toutefois saisir un SELECT T-SQL précédé de `explain` pour obtenir le KQL équivalent comme point de départ de la fonction.
      options:
        a: { en: "INSERT isn't supported by T-SQL in a KQL database, and running a query after each ingestion isn't automatic.", fr: "INSERT n'est pas pris en charge par T-SQL dans une base de données KQL, et lancer une requête après chaque ingestion n'est pas automatique." }
        b: { en: "CREATE isn't supported by T-SQL in a KQL database, and an update policy runs a KQL query or stored function.", fr: "CREATE n'est pas pris en charge par T-SQL dans une base de données KQL, et une stratégie de mise à jour exécute une requête ou une fonction stockée KQL." }
        d: { en: "The data would leave the eventhouse for a warehouse, and OneLake availability writes in batches rather than at each ingestion.", fr: "Les données quitteraient l'eventhouse pour un entrepôt, et la disponibilité OneLake écrit par lots plutôt qu'à chaque ingestion." }
    references:
      - title: Query data using T-SQL
        url: https://learn.microsoft.com/en-us/kusto/query/t-sql?view=microsoft-fabric
      - title: Update policy overview
        url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-22-08
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a warehouse named **DW_Orders** that contains a staging table named **stg.RawOrders** with the columns OrderID (int) and Payload (varchar(8000)). Payload contains a JSON document such as the following one.

        ```json
        {"customer": {"id": "C042", "segment": "Retail"},
         "lines": [{"sku": "P-17", "qty": 2}, {"sku": "P-31", "qty": 1}]}
        ```

        You need to load a table named **dbo.OrderLines** that has one row for each element of lines, with the columns OrderID, CustomerID, Sku and Qty. An order whose lines array is empty must not produce any row.

        How should you complete the T-SQL statement? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un entrepôt nommé **DW_Orders** qui contient une table de mise en lots nommée **stg.RawOrders** avec les colonnes OrderID (int) et Payload (varchar(8000)). Payload contient un document JSON tel que le suivant.

        ```json
        {"customer": {"id": "C042", "segment": "Retail"},
         "lines": [{"sku": "P-17", "qty": 2}, {"sku": "P-31", "qty": 1}]}
        ```

        Vous devez charger une table nommée **dbo.OrderLines** qui a une ligne pour chaque élément de lines, avec les colonnes OrderID, CustomerID, Sku et Qty. Une commande dont le tableau lines est vide ne doit produire aucune ligne.

        Comment devez-vous compléter l'instruction T-SQL ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        INSERT INTO dbo.OrderLines (OrderID, CustomerID, Sku, Qty)
        SELECT o.OrderID,
               [[cust]](o.Payload, '$.customer.id'),
               l.Sku,
               l.Qty
        FROM stg.RawOrders AS o
        [[apply]] OPENJSON(o.Payload, [[path]])
            WITH (Sku varchar(20) '$.sku', Qty int '$.qty') AS l;
      slots:
        - id: cust
          options:
            - { id: c_value, text: JSON_VALUE }
            - { id: c_query, text: JSON_QUERY }
            - { id: c_isjson, text: ISJSON }
        - id: apply
          options:
            - { id: a_outer, text: OUTER APPLY }
            - { id: a_cross, text: CROSS APPLY }
            - { id: a_join, text: INNER JOIN }
        - id: path
          options:
            - { id: p_first, text: "'$.lines[0]'" }
            - { id: p_root, text: "'$'" }
            - { id: p_lines, text: "'$.lines'" }
    answer:
      values: { cust: c_value, apply: a_cross, path: p_lines }
    explanation:
      correct:
        en: |
          `JSON_VALUE` extracts a scalar value such as the customer id. `OPENJSON` with the path `'$.lines'` returns one row per element of the array, and its `WITH` clause maps `sku` and `qty` to typed columns. `CROSS APPLY` runs OPENJSON for each order and keeps only the orders that return at least one row, so an empty array produces nothing. Fabric Data Warehouse supports OPENJSON.
        fr: |
          `JSON_VALUE` extrait une valeur scalaire comme l'identifiant du client. `OPENJSON` avec le chemin `'$.lines'` renvoie une ligne par élément du tableau, et sa clause `WITH` associe `sku` et `qty` à des colonnes typées. `CROSS APPLY` exécute OPENJSON pour chaque commande et ne garde que les commandes qui renvoient au moins une ligne : un tableau vide ne produit donc rien. Fabric Data Warehouse prend en charge OPENJSON.
      options:
        c_query: { en: "JSON_QUERY returns an object or an array; for a scalar such as the id it returns NULL in the default lax mode.", fr: "JSON_QUERY renvoie un objet ou un tableau ; pour un scalaire comme l'identifiant, il renvoie NULL dans le mode lax par défaut." }
        c_isjson: { en: "ISJSON only tests whether a string is valid JSON; it doesn't take a path or extract a value.", fr: "ISJSON teste seulement si une chaîne est un JSON valide ; il ne prend pas de chemin et n'extrait aucune valeur." }
        a_outer: { en: "OUTER APPLY also returns orders for which OPENJSON returns no row, with null Sku and Qty: an empty array would produce a row.", fr: "OUTER APPLY renvoie aussi les commandes pour lesquelles OPENJSON ne renvoie aucune ligne, avec Sku et Qty nuls : un tableau vide produirait une ligne." }
        a_join: { en: "A JOIN can't pass a column of the outer table (o.Payload) to a table-valued function: that requires APPLY.", fr: "Une jointure ne peut pas passer une colonne de la table externe (o.Payload) à une fonction table : cela demande APPLY." }
        p_first: { en: "This path points to the first element only: OPENJSON returns a single row per order, for its first line, and the other lines are lost.", fr: "Ce chemin pointe uniquement vers le premier élément : OPENJSON renvoie une seule ligne par commande, pour sa première ligne, et les autres lignes sont perdues." }
        p_root: { en: "The root is the order object, which has no sku or qty property: OPENJSON returns a single row per order, with null Sku and Qty.", fr: "La racine est l'objet commande, qui n'a pas de propriété sku ni qty : OPENJSON renvoie une seule ligne par commande, avec Sku et Qty nuls." }
    references:
      - title: OPENJSON (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/functions/openjson-transact-sql?view=fabric

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-22-09
    objective: "2.2.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a lakehouse that contains three Delta tables loaded from a snowflaked source:

        - **products**: ProductID, ProductName, SubcategoryID
        - **subcats**: SubcategoryID, SubcategoryName, CategoryID
        - **cats**: CategoryID, CategoryName

        SubcategoryID is null for some products. You write the following code to build a denormalized product dimension. The notebook imports `pyspark.sql.functions as F`.

        ```python
        dim = (spark.read.table("products")
            .join(spark.read.table("subcats"), "SubcategoryID", "left")
            .join(F.broadcast(spark.read.table("cats")), "CategoryID", "left")
            .fillna("Unknown", subset=["SubcategoryName", "CategoryName"]))
        dim.write.mode("overwrite").saveAsTable("dim_product")
        ```

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un lakehouse qui contient trois tables Delta chargées depuis une source en flocon :

        - **products** : ProductID, ProductName, SubcategoryID
        - **subcats** : SubcategoryID, SubcategoryName, CategoryID
        - **cats** : CategoryID, CategoryName

        SubcategoryID est nul pour certains produits. Vous écrivez le code suivant pour construire une dimension produit dénormalisée. Le notebook importe `pyspark.sql.functions as F`.

        ```python
        dim = (spark.read.table("products")
            .join(spark.read.table("subcats"), "SubcategoryID", "left")
            .join(F.broadcast(spark.read.table("cats")), "CategoryID", "left")
            .fillna("Unknown", subset=["SubcategoryName", "CategoryName"]))
        dim.write.mode("overwrite").saveAsTable("dim_product")
        ```

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A product whose SubcategoryID is null appears in dim_product with Unknown as its SubcategoryName and its CategoryName.", fr: "Un produit dont SubcategoryID est nul apparaît dans dim_product avec Unknown comme SubcategoryName et comme CategoryName." }
        - id: s2
          text: { en: "If a SubcategoryID value appears in two rows of subcats, each product of that subcategory still appears in only one row of dim_product.", fr: "Si une valeur SubcategoryID apparaît dans deux lignes de subcats, chaque produit de cette sous-catégorie n'apparaît toujours que dans une ligne de dim_product." }
        - id: s3
          text: { en: "The broadcast hint sends a copy of cats to every executor, so the second join doesn't shuffle the result of the first join.", fr: "L'indicateur broadcast envoie une copie de cats à chaque exécuteur : la seconde jointure n'effectue donc pas de lecture aléatoire (shuffle) du résultat de la première." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Left joins keep every product, and a product without a subcategory gets null names from both joins, which `fillna()` replaces with Unknown. A join returns one output row per matching pair, so a business key duplicated in a lookup table multiplies the matching products: the lookup tables must be unique on their keys before denormalizing. Broadcasting a small table avoids shuffling the large side of the join.
        fr: |
          Les jointures externes gauches gardent tous les produits, et un produit sans sous-catégorie reçoit des noms nuls des deux jointures, que `fillna()` remplace par Unknown. Une jointure renvoie une ligne de sortie par paire correspondante : une clé métier dupliquée dans une table de recherche multiplie donc les produits correspondants, et les tables de recherche doivent être uniques sur leur clé avant la dénormalisation. Diffuser (broadcast) une petite table évite une lecture aléatoire (shuffle) du côté volumineux de la jointure.
      options:
        s2: { en: "Both subcategory rows match, so each product of the subcategory appears twice in dim_product.", fr: "Les deux lignes de sous-catégorie correspondent : chaque produit de la sous-catégorie apparaît donc deux fois dans dim_product." }
    references:
      - title: "Dimensional modeling in Microsoft Fabric Warehouse: Dimension tables"
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-dimension-tables
      - title: Combine and aggregate data
        url: https://learn.microsoft.com/en-us/training/modules/fabric-transform-data-notebooks/4-combine-aggregate

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-22-10
    objective: "2.2.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a lakehouse that contains a Delta table named **silver_sales**, with one row per sale, and a Delta table named **gold_store_daily**, partitioned by OrderDate, with one row per StoreID and OrderDate. Sales can reach silver_sales up to two days after their OrderDate.

        Every night, a notebook recomputes from silver_sales the aggregates of the last three order dates into a DataFrame named **daily**, and then writes daily to gold_store_daily. The notebook is sometimes run a second time after a failure.

        gold_store_daily must keep the older dates, include the late sales, and never contain two rows for the same StoreID and OrderDate.

        Which two write methods meet the requirements? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un lakehouse qui contient une table Delta nommée **silver_sales**, avec une ligne par vente, et une table Delta nommée **gold_store_daily**, partitionnée par OrderDate, avec une ligne par StoreID et OrderDate. Les ventes peuvent arriver dans silver_sales jusqu'à deux jours après leur OrderDate.

        Chaque nuit, un notebook recalcule depuis silver_sales les agrégats des trois dernières dates de commande dans un DataFrame nommé **daily**, puis écrit daily dans gold_store_daily. Le notebook est parfois exécuté une seconde fois après un échec.

        gold_store_daily doit conserver les dates plus anciennes, inclure les ventes tardives et ne jamais contenir deux lignes pour les mêmes StoreID et OrderDate.

        Quelles sont les deux méthodes d'écriture qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Append daily to gold_store_daily, because each run only contains the last three order dates.", fr: "Ajouter daily à gold_store_daily, puisque chaque exécution ne contient que les trois dernières dates de commande." } }
        - { id: b, text: { en: "Set spark.sql.sources.partitionOverwriteMode to dynamic, then INSERT OVERWRITE gold_store_daily with the rows of daily.", fr: "Mettre spark.sql.sources.partitionOverwriteMode à dynamic, puis exécuter INSERT OVERWRITE sur gold_store_daily avec les lignes de daily." } }
        - { id: c, text: { en: "Write daily to gold_store_daily with mode(\"overwrite\"), so that a second run replaces the rows of the first one.", fr: "Écrire daily dans gold_store_daily avec mode(\"overwrite\"), pour qu'une seconde exécution remplace les lignes de la première." } }
        - { id: d, text: { en: "Append daily, then rewrite gold_store_daily after dropDuplicates([\"StoreID\", \"OrderDate\"]) on the whole table.", fr: "Ajouter daily, puis réécrire gold_store_daily après dropDuplicates([\"StoreID\", \"OrderDate\"]) sur toute la table." } }
        - { id: e, text: { en: "MERGE daily into gold_store_daily on StoreID and OrderDate, updating the matched rows and inserting the others.", fr: "Fusionner daily dans gold_store_daily par MERGE sur StoreID et OrderDate, en mettant à jour les lignes correspondantes et en insérant les autres." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Both methods are idempotent: rerunning them, or reprocessing a date that already has rows, gives the same result. With the dynamic partition overwrite mode, INSERT OVERWRITE replaces only the OrderDate partitions present in daily (the last three dates, recomputed with the late sales) and leaves the older partitions intact. A MERGE on the grain keys updates the recomputed store-day rows and inserts the new ones.
        fr: |
          Les deux méthodes sont idempotentes : les relancer, ou retraiter une date qui a déjà des lignes, donne le même résultat. Avec le mode de remplacement dynamique des partitions, INSERT OVERWRITE remplace uniquement les partitions OrderDate présentes dans daily (les trois dernières dates, recalculées avec les ventes tardives) et laisse intactes les partitions plus anciennes. Un MERGE sur les clés du grain met à jour les lignes magasin-jour recalculées et insère les nouvelles.
      options:
        a: { en: "Each run recomputes dates that are already in the table, so appending duplicates the store-day rows of those dates.", fr: "Chaque exécution recalcule des dates déjà présentes dans la table : ajouter duplique les lignes magasin-jour de ces dates." }
        c: { en: "A plain overwrite replaces the whole table with three days of data and loses all the older dates.", fr: "Un remplacement simple remplace toute la table par trois jours de données et perd toutes les dates plus anciennes." }
        d: { en: "dropDuplicates() keeps an arbitrary row of each key, which can be the old aggregate without the late sales, and it rewrites the whole table.", fr: "dropDuplicates() garde une ligne arbitraire par clé, qui peut être l'ancien agrégat sans les ventes tardives, et réécrit toute la table." }
    references:
      - title: Replace Delta tables
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/delta-lake-replace
