chapter: 33-optimize-performance
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-33-01
    objective: "3.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric lakehouse named LH_Retail that contains a Delta table named sales. The table contains many small Parquet files, and a Direct Lake semantic model that reads it is slow.

        A business analyst who doesn't write code must compact the existing files of sales and apply V-Order to them.

        What should the analyst do?
      fr: |
        Vous disposez d'un lakehouse Fabric nommé LH_Retail qui contient une table Delta nommée sales. La table contient de nombreux petits fichiers Parquet, et un modèle sémantique Direct Lake qui la lit est lent.

        Un analyste métier qui n'écrit pas de code doit compacter les fichiers existants de sales et leur appliquer V-Order.

        Que doit faire l'analyste ?
    body:
      options:
        - { id: a, text: { en: "Run `OPTIMIZE sales VORDER` in the SQL query editor of the SQL analytics endpoint of LH_Retail.", fr: "Exécuter `OPTIMIZE sales VORDER` dans l'éditeur de requêtes SQL du point de terminaison d'analytique SQL de LH_Retail." } }
        - { id: b, text: { en: "In the Lakehouse explorer, open Maintenance for sales, turn on VACUUM with the default retention, and run it.", fr: "Dans l'explorateur du lakehouse, ouvrir Maintenance pour sales, activer VACUUM avec la rétention par défaut, puis l'exécuter." } }
        - { id: c, text: { en: "In the Lakehouse explorer, open Maintenance for sales, turn on compaction with Apply V-order, and run it.", fr: "Dans l'explorateur du lakehouse, ouvrir Maintenance pour sales, activer le compactage avec Apply V-order, puis l'exécuter." } }
        - { id: d, text: { en: "In the properties of sales, set `delta.parquet.vorder.enabled` to true so that the files are rewritten.", fr: "Dans les propriétés de sales, définir `delta.parquet.vorder.enabled` sur true pour que les fichiers soient réécrits." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Maintenance command of a Delta table in the Lakehouse explorer runs table maintenance without code. Turning on compaction rewrites the small Parquet files into larger ones, and the Apply V-order option writes them with V-Order. The job can be followed in the Monitoring hub.
        fr: |
          La commande Maintenance d'une table Delta dans l'explorateur du lakehouse exécute la maintenance de table sans code. Activer le compactage réécrit les petits fichiers Parquet en fichiers plus grands, et l'option Apply V-order les écrit avec V-Order. La tâche se suit dans le hub de surveillance.
      options:
        a: { en: "`OPTIMIZE` is a Delta Lake command run by Spark; the SQL analytics endpoint doesn't run it, and writing T-SQL is code.", fr: "`OPTIMIZE` est une commande Delta Lake exécutée par Spark ; le point de terminaison d'analytique SQL ne l'exécute pas, et écrire du T-SQL reste du code." }
        b: { en: "VACUUM deletes unreferenced files older than the retention; it doesn't compact the active files or apply V-Order.", fr: "VACUUM supprime les fichiers non référencés plus anciens que la rétention ; il ne compacte pas les fichiers actifs et n'applique pas V-Order." }
        d: { en: "The table property applies V-Order to future writes only: existing files keep their layout until they are rewritten.", fr: "La propriété de table applique V-Order aux seules écritures futures : les fichiers existants gardent leur disposition jusqu'à leur réécriture." }
    references:
      - title: Delta Table Maintenance in Microsoft Fabric - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-table-maintenance
      - title: Optimize Delta Lake tables with V-order in Fabric - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/delta-optimization-and-v-order

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-33-02
    objective: "3.3.4"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You have a Fabric eventhouse that contains a KQL database named DB_Logs. Applications load small files into the tables of DB_Logs by using queued ingestion.

        To reduce latency, a colleague set the database-level ingestion batching policy of DB_Logs to a MaximumBatchingTimeSpan of 00:00:10. Since then, the ingestion cost has increased, and the latency of the busiest tables has also increased.

        The new requirement is that each batch must be sealed at most two minutes after its first data arrives. The solution must minimize cost.

        To which value should you set MaximumBatchingTimeSpan in the database-level policy?
      fr: |
        Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée DB_Logs. Des applications chargent de petits fichiers dans les tables de DB_Logs en utilisant l'ingestion en file d'attente.

        Pour réduire la latence, un collègue a défini la stratégie de traitement par lots de l'ingestion de niveau base de données de DB_Logs avec une valeur MaximumBatchingTimeSpan de 00:00:10. Depuis, le coût de l'ingestion a augmenté, et la latence des tables les plus chargées a aussi augmenté.

        La nouvelle exigence est que chaque lot soit scellé au plus deux minutes après l'arrivée de ses premières données. La solution doit réduire le coût au minimum.

        Sur quelle valeur devez-vous définir MaximumBatchingTimeSpan dans la stratégie de niveau base de données ?
    body:
      options:
        - { id: a, text: "00:00:10" }
        - { id: b, text: "00:00:30" }
        - { id: c, text: "00:02:00" }
        - { id: d, text: "00:05:00" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft recommends setting the batching time from the upper bound of the latency requirement. Very small values increase cost and can even increase end-to-end latency, because many small ingestion processes run in parallel. Two minutes meets the requirement with the largest, cheapest batches.
        fr: |
          Microsoft recommande de fixer le temps de traitement par lots d'après la borne supérieure de l'exigence de latence. Des valeurs très faibles augmentent le coût et peuvent même augmenter la latence de bout en bout, car de nombreux petits processus d'ingestion s'exécutent en parallèle. Deux minutes répondent à l'exigence avec les lots les plus grands, donc les moins chers.
      options:
        a: { en: "Ten seconds is the minimum value and the cause of the higher cost and latency.", fr: "Dix secondes est la valeur minimale et la cause de la hausse du coût et de la latence." }
        b: { en: "30 seconds meets the requirement but creates more, smaller batches than needed, which costs more.", fr: "30 secondes répondent à l'exigence mais créent plus de lots, plus petits, que nécessaire, ce qui coûte plus cher." }
        d: { en: "Five minutes is the default, but it lets a batch wait longer than the two minutes allowed.", fr: "Cinq minutes est la valeur par défaut, mais elle laisse un lot attendre plus que les deux minutes autorisées." }
    references:
      - title: IngestionBatching policy - Kusto
        url: https://learn.microsoft.com/en-us/kusto/management/batching-policy?view=microsoft-fabric

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-33-03
    objective: "3.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace that contains a lakehouse named LH_Ops and a pipeline named PL_Events. Every night, a Copy activity in PL_Events copies the whole table dbo.AppEvents from an Azure SQL database and overwrites a table in LH_Ops.

        dbo.AppEvents contains 400 million rows. Rows are only inserted, never updated or deleted, and about 2 million rows are added each day. Each row has an indexed datetime2 column named CreatedAt.

        You need to reduce both the duration of the copy and the capacity units that it consumes.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé LH_Ops et un pipeline nommé PL_Events. Chaque nuit, une activité Copy de PL_Events copie toute la table dbo.AppEvents depuis une base de données Azure SQL et remplace une table de LH_Ops.

        dbo.AppEvents contient 400 millions de lignes. Les lignes sont uniquement insérées, jamais mises à jour ni supprimées, et environ 2 millions de lignes sont ajoutées chaque jour. Chaque ligne a une colonne datetime2 indexée nommée CreatedAt.

        Vous devez réduire à la fois la durée de la copie et les unités de capacité qu'elle consomme.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set Intelligent throughput optimization to Maximum and Degree of copy parallelism to 256.", fr: "Définir Intelligent throughput optimization sur Maximum et Degree of copy parallelism sur 256." } }
        - { id: b, text: { en: "Copy only the rows whose CreatedAt is later than a stored watermark, append them, and then update the watermark.", fr: "Copier uniquement les lignes dont CreatedAt est postérieur à un filigrane enregistré, les ajouter, puis mettre à jour le filigrane." } }
        - { id: c, text: { en: "Set the partition option of the source to Dynamic range on CreatedAt, without upper and lower bounds.", fr: "Définir l'option de partition de la source sur Dynamic range sur CreatedAt, sans bornes supérieure et inférieure." } }
        - { id: d, text: { en: "Enable staging in the Copy activity so that the data goes through an interim store before the lakehouse.", fr: "Activer la zone de transit dans l'activité Copy pour que les données passent par un magasin intermédiaire avant le lakehouse." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Filtering at the source is the most effective optimization: an incremental load with a watermark copies only the 2 million new rows instead of 400 million. Lookups read the previous and the new watermark, the Copy activity's source query filters the rows between them, and a final step stores the new watermark. Less data moved means a shorter copy and fewer capacity units.
        fr: |
          Filtrer à la source est l'optimisation la plus efficace : un chargement incrémentiel avec un filigrane ne copie que les 2 millions de nouvelles lignes au lieu de 400 millions. Des activités Lookup lisent l'ancien et le nouveau filigrane, la requête source de l'activité Copy filtre les lignes comprises entre les deux, et une dernière étape enregistre le nouveau filigrane. Moins de données déplacées, c'est une copie plus courte et moins d'unités de capacité.
      options:
        a: { en: "More compute and parallelism can shorten the copy, but they increase the capacity units and the load on the source.", fr: "Plus de calcul et de parallélisme peuvent raccourcir la copie, mais ils augmentent les unités de capacité et la charge sur la source." }
        c: { en: "Dynamic range parallelizes the read of the same 400 million rows, and without bounds it first queries the source to find them.", fr: "Dynamic range parallélise la lecture des mêmes 400 millions de lignes, et sans bornes il interroge d'abord la source pour les trouver." }
        d: { en: "Staging adds an extra hop: it's required for a warehouse destination, not a lakehouse, and it doesn't reduce the data copied.", fr: "La zone de transit ajoute une étape : elle est obligatoire pour une destination entrepôt, pas lakehouse, et ne réduit pas les données copiées." }
    references:
      - title: Incrementally load data from Data Warehouse to Lakehouse - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/tutorial-incremental-copy-data-warehouse-lakehouse
      - title: Copy activity performance with SQL databases - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-performance-sql-databases

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-33-04
    objective: "3.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace named WS_Silver that was created in October 2026. WS_Silver contains a lakehouse named LH_Silver and an environment named Env_Silver. Fifteen notebooks that use Env_Silver write the Delta tables of LH_Silver. No Spark property is set in Env_Silver or in the notebooks.

        The tables of LH_Silver are read many times a day by other Spark notebooks. No Power BI semantic model uses them.

        You need the future writes of the fifteen notebooks to use optimized write, without the write overhead of V-Order. The notebooks must not be modified.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS_Silver créé en octobre 2026. WS_Silver contient un lakehouse nommé LH_Silver et un environnement nommé Env_Silver. Quinze notebooks qui utilisent Env_Silver écrivent les tables Delta de LH_Silver. Aucune propriété Spark n'est définie dans Env_Silver ni dans les notebooks.

        Les tables de LH_Silver sont lues de nombreuses fois par jour par d'autres notebooks Spark. Aucun modèle sémantique Power BI ne les utilise.

        Vous devez faire en sorte que les écritures futures des quinze notebooks utilisent l'écriture optimisée, sans le surcoût d'écriture de V-Order. Les notebooks ne doivent pas être modifiés.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `spark.fabric.resourceProfile` to `writeHeavy` in the Spark properties of Env_Silver.", fr: "Définir `spark.fabric.resourceProfile` sur `writeHeavy` dans les propriétés Spark d'Env_Silver." } }
        - { id: b, text: { en: "Set `spark.fabric.resourceProfile` to `readHeavyForPBI` in the Spark properties of Env_Silver.", fr: "Définir `spark.fabric.resourceProfile` sur `readHeavyForPBI` dans les propriétés Spark d'Env_Silver." } }
        - { id: c, text: { en: "Set `spark.fabric.resourceProfile` to `readHeavyForSpark` in the Spark properties of Env_Silver.", fr: "Définir `spark.fabric.resourceProfile` sur `readHeavyForSpark` dans les propriétés Spark d'Env_Silver." } }
        - { id: d, text: { en: "Add `spark.conf.set(\"spark.fabric.resourceProfile\", \"readHeavyForSpark\")` to the first cell of each notebook.", fr: "Ajouter `spark.conf.set(\"spark.fabric.resourceProfile\", \"readHeavyForSpark\")` à la première cellule de chaque notebook." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The `readHeavyForSpark` profile turns on optimized write (128 MB bins) for workloads that Spark reads often, and it doesn't turn on V-Order. Set in the Spark properties of the environment, it applies to every notebook that uses Env_Silver without any change to their code.
        fr: |
          Le profil `readHeavyForSpark` active l'écriture optimisée (lots de 128 Mo) pour les charges de travail que Spark lit souvent, et il n'active pas V-Order. Défini dans les propriétés Spark de l'environnement, il s'applique à tous les notebooks qui utilisent Env_Silver sans modifier leur code.
      options:
        a: { en: "`writeHeavy` is already the default of new workspaces, and it doesn't turn on optimized write.", fr: "`writeHeavy` est déjà la valeur par défaut des nouveaux espaces de travail, et il n'active pas l'écriture optimisée." }
        b: { en: "`readHeavyForPBI` also turns on V-Order, whose write overhead must be avoided for tables that no Power BI model reads.", fr: "`readHeavyForPBI` active aussi V-Order, dont le surcoût d'écriture doit être évité pour des tables qu'aucun modèle Power BI ne lit." }
        d: { en: "The right profile, but setting it at run time modifies the fifteen notebooks, which isn't allowed.", fr: "C'est le bon profil, mais le définir à l'exécution modifie les quinze notebooks, ce qui n'est pas autorisé." }
    references:
      - title: Configure Resource Profile Configurations in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-resource-profile-configurations

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-33-05
    objective: "3.3.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have two Fabric warehouses named WH_Staging and WH_Gold. WH_Staging receives 12 tables every night from files in an Azure Data Lake Storage Gen2 account, and its tables are only read once, by the procedures that load WH_Gold. You review the design to improve performance.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez de deux entrepôts Fabric nommés WH_Staging et WH_Gold. WH_Staging reçoit chaque nuit 12 tables à partir de fichiers d'un compte Azure Data Lake Storage Gen2, et ses tables ne sont lues qu'une fois, par les procédures qui chargent WH_Gold. Vous examinez la conception pour améliorer les performances.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If you run `ALTER DATABASE CURRENT SET VORDER = OFF` in WH_Staging and read performance degrades later, you can turn V-Order back on for WH_Staging.", fr: "Si vous exécutez `ALTER DATABASE CURRENT SET VORDER = OFF` dans WH_Staging et que les performances de lecture se dégradent ensuite, vous pouvez réactiver V-Order pour WH_Staging." }
        - id: s2
          text: { en: "A column declared as `decimal` without precision and scale in WH_Gold is created as `decimal(18,0)`.", fr: "Une colonne déclarée `decimal` sans précision ni échelle dans WH_Gold est créée en `decimal(18,0)`." }
        - id: s3
          text: { en: "To shorten the nightly load, you can run the 12 `COPY INTO` statements of WH_Staging in parallel, one per table.", fr: "Pour raccourcir le chargement de nuit, vous pouvez exécuter en parallèle les 12 instructions `COPY INTO` de WH_Staging, une par table." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Disabling V-Order in a warehouse is irreversible: once disabled, it can't be enabled again, which is why it only suits write-intensive staging warehouses. A bare `decimal` becomes `decimal(18,0)`, so always state the precision and scale you need. Microsoft recommends running several `COPY INTO` statements in parallel for different tables to maximize load parallelism.
        fr: |
          Désactiver V-Order dans un entrepôt est irréversible : une fois désactivé, il ne peut pas être réactivé ; c'est pourquoi cela ne convient qu'aux entrepôts de transit très orientés écriture. Un `decimal` sans précision devient `decimal(18,0)` : indiquez donc toujours la précision et l'échelle nécessaires. Microsoft recommande d'exécuter plusieurs instructions `COPY INTO` en parallèle pour des tables différentes afin de maximiser le parallélisme du chargement.
      options:
        s1: { en: "The V-Order setting of a warehouse can be turned off once, at the warehouse level, and never turned on again.", fr: "Le paramètre V-Order d'un entrepôt peut être désactivé une fois, au niveau de l'entrepôt, et jamais réactivé." }
    references:
      - title: Disable V-Order in Warehouse - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/disable-v-order
      - title: Performance Guidelines - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/guidelines-warehouse-performance

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-33-06
    objective: "3.3.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has two Fabric workspaces:

        - **WS_Dev** uses the default network settings. Its default pool is the starter pool.
        - **WS_Secure** has a managed virtual network. Its default pool is a custom pool with Medium nodes.

        Data engineers complain about the time their notebook sessions take to start in both workspaces. You review the options before changing anything.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de deux espaces de travail Fabric :

        - **WS_Dev** utilise les paramètres réseau par défaut. Son pool par défaut est le pool de démarrage.
        - **WS_Secure** dispose d'un réseau virtuel managé. Son pool par défaut est un pool personnalisé avec des nœuds Medium.

        Les ingénieurs données se plaignent du temps de démarrage de leurs sessions de notebook dans les deux espaces de travail. Vous examinez les options avant de modifier quoi que ce soit.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "In WS_Secure, setting the default pool to the starter pool makes sessions start in about 5 to 10 seconds.", fr: "Dans WS_Secure, définir le pool de démarrage comme pool par défaut fait démarrer les sessions en 5 à 10 secondes environ." }
        - id: s2
          text: { en: "In WS_Dev, attaching an environment that installs three custom libraries keeps the session start of the notebooks at about 5 to 10 seconds.", fr: "Dans WS_Dev, attacher un environnement qui installe trois bibliothèques personnalisées maintient le démarrage des sessions des notebooks à 5 à 10 secondes environ." }
        - id: s3
          text: { en: "In WS_Dev, a notebook that needs only Medium nodes, no extra libraries and no custom Spark properties usually gets a session in about 5 to 10 seconds.", fr: "Dans WS_Dev, un notebook qui n'a besoin que de nœuds Medium, sans bibliothèque supplémentaire ni propriété Spark personnalisée, obtient généralement une session en 5 à 10 secondes environ." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Starter pools use prewarmed Medium nodes and usually start in 5 to 10 seconds when no extra library or custom Spark property is needed. They aren't supported in workspaces with a managed virtual network or tenant Private Links, where Fabric creates the cluster on demand and adds minutes. Libraries installed from an environment are added at session start, which adds from 30 seconds to several minutes even on the starter pool.
        fr: |
          Les pools de démarrage utilisent des nœuds Medium préchauffés et démarrent généralement en 5 à 10 secondes quand aucune bibliothèque supplémentaire ni propriété Spark personnalisée n'est nécessaire. Ils ne sont pas pris en charge dans les espaces de travail dotés d'un réseau virtuel managé ou de liaisons privées de locataire, où Fabric crée le cluster à la demande, ce qui ajoute plusieurs minutes. Les bibliothèques installées depuis un environnement s'ajoutent au démarrage de la session, ce qui ajoute de 30 secondes à plusieurs minutes, même sur le pool de démarrage.
      options:
        s1: { en: "With a managed virtual network, sessions are created on demand whatever the pool, which takes minutes.", fr: "Avec un réseau virtuel managé, les sessions sont créées à la demande quel que soit le pool, ce qui prend plusieurs minutes." }
        s2: { en: "Custom libraries are installed when the session starts, which adds from 30 seconds to several minutes.", fr: "Les bibliothèques personnalisées s'installent au démarrage de la session, ce qui ajoute de 30 secondes à plusieurs minutes." }
    references:
      - title: Apache Spark compute for Data Engineering and Data Science - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-compute

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-33-07
    objective: "3.3.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a Fabric lakehouse named LH_IoT that contains a Delta table named telemetry. telemetry contains 900 GB of data and is partitioned by device_id, which has about 300,000 distinct values. A streaming job appends new rows to telemetry every minute.

        Analysts query telemetry through the SQL analytics endpoint of LH_IoT. Their queries filter on event_date, and they're slow. The new data also takes longer than usual to appear in the endpoint.

        You need to improve the performance of the SQL analytics endpoint queries on telemetry over time.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un lakehouse Fabric nommé LH_IoT qui contient une table Delta nommée telemetry. telemetry contient 900 Go de données et est partitionnée par device_id, qui compte environ 300 000 valeurs distinctes. Un travail de streaming ajoute de nouvelles lignes à telemetry toutes les minutes.

        Des analystes interrogent telemetry par le point de terminaison d'analytique SQL de LH_IoT. Leurs requêtes filtrent sur event_date, et elles sont lentes. Les nouvelles données mettent aussi plus de temps que d'habitude à apparaître dans le point de terminaison.

        Vous devez améliorer durablement les performances des requêtes du point de terminaison d'analytique SQL sur telemetry.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Rewrite telemetry partitioned by a column that gives partitions of 1 GB or more, such as the event month.", fr: "Réécrire telemetry partitionnée par une colonne qui donne des partitions de 1 Go ou plus, comme le mois de l'événement." } }
        - { id: b, text: { en: "Schedule `VACUUM telemetry RETAIN 168 HOURS` every night to remove the old files of the table.", fr: "Planifier chaque nuit `VACUUM telemetry RETAIN 168 HOURS` pour supprimer les anciens fichiers de la table." } }
        - { id: c, text: { en: "Schedule `OPTIMIZE telemetry` regularly, or enable auto compaction on the table.", fr: "Planifier régulièrement `OPTIMIZE telemetry`, ou activer le compactage automatique sur la table." } }
        - { id: d, text: { en: "Set a static target file size of 32 MB for the writes so that the endpoint scans more files in parallel.", fr: "Définir une taille de fichier cible statique de 32 Mo pour les écritures afin que le point de terminaison lise plus de fichiers en parallèle." } }
        - { id: e, text: { en: "Limit each Parquet file written to telemetry to 100,000 rows so that the files stay small enough to scan quickly.", fr: "Limiter chaque fichier Parquet écrit dans telemetry à 100 000 lignes pour que les fichiers restent assez petits pour être lus rapidement." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A high-cardinality partition column creates a partition per value: 900 GB over 300,000 partitions gives about 3 MB each, so even compacted files stay tiny and the metadata to scan and sync is huge. Repartitioning on a column that produces partitions of about 1 GB or more fixes the layout. Because the streaming job keeps adding small files, regular `OPTIMIZE` (or auto compaction) is also needed to keep the files right-sized.
        fr: |
          Une colonne de partition à forte cardinalité crée une partition par valeur : 900 Go sur 300 000 partitions donnent environ 3 Mo chacune, donc même compactés les fichiers restent minuscules et les métadonnées à lire et à synchroniser sont énormes. Repartitionner sur une colonne qui produit des partitions d'environ 1 Go ou plus corrige la disposition. Comme le travail de streaming continue d'ajouter de petits fichiers, un `OPTIMIZE` régulier (ou le compactage automatique) est aussi nécessaire pour garder des fichiers de bonne taille.
      options:
        b: { en: "VACUUM reduces retained storage but doesn't change the layout of the active files that queries read.", fr: "VACUUM réduit le stockage conservé mais ne change pas la disposition des fichiers actifs que lisent les requêtes." }
        d: { en: "Static small targets create many small files; the default adaptive target file size of Runtime 2.0 should be kept.", fr: "Des cibles statiques petites créent beaucoup de petits fichiers ; il faut garder la taille de fichier cible adaptative par défaut du runtime 2.0." }
        e: { en: "A row limit ignores row width and creates small files for narrow tables, which adds overhead.", fr: "Une limite de lignes ignore la largeur des lignes et crée de petits fichiers pour les tables étroites, ce qui ajoute une surcharge." }
    references:
      - title: SQL Analytics Endpoint Performance Considerations - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/sql-analytics-endpoint-performance

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-33-08
    objective: "3.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        You have a Fabric workspace named WS_Gold that contains a lakehouse named LH_Gold and an environment named Env_Gold. No Spark property related to V-Order is set in the workspace, in Env_Gold or in the notebooks.

        You need to meet the requirements shown in the answer area. The notebooks must not be modified unless a requirement concerns a single notebook.

        What should you use for each requirement? To answer, drag the appropriate elements to the correct requirements. Each element may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS_Gold qui contient un lakehouse nommé LH_Gold et un environnement nommé Env_Gold. Aucune propriété Spark liée à V-Order n'est définie dans l'espace de travail, dans Env_Gold ni dans les notebooks.

        Vous devez répondre aux exigences de la zone de réponse. Les notebooks ne doivent pas être modifiés, sauf si une exigence concerne un seul notebook.

        Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: writeopt, text: "`.option(\"parquet.vorder.enabled\", \"true\")`" }
        - { id: session, text: "`spark.conf.set(\"spark.sql.parquet.vorder.default\", \"true\")`" }
        - { id: tblprop, text: "`ALTER TABLE ... SET TBLPROPERTIES (\"delta.parquet.vorder.enabled\" = \"true\")`" }
        - { id: pbi, text: { en: "`readHeavyForPBI` resource profile in Env_Gold", fr: "Profil de ressources `readHeavyForPBI` dans Env_Gold" } }
        - { id: spark, text: { en: "`readHeavyForSpark` resource profile in Env_Gold", fr: "Profil de ressources `readHeavyForSpark` dans Env_Gold" } }
        - { id: optimize, text: "`OPTIMIZE ... VORDER`" }
      targets:
        - id: r1
          text: { en: "In a notebook named NB_Load, only the write to the dim_date table uses V-Order; the other writes of the same session don't.", fr: "Dans un notebook nommé NB_Load, seule l'écriture dans la table dim_date utilise V-Order ; les autres écritures de la même session non." }
        - id: r2
          text: { en: "Every future write to the fact_sales table uses V-Order, whichever notebook performs it.", fr: "Chaque écriture future dans la table fact_sales utilise V-Order, quel que soit le notebook qui l'effectue." }
        - id: r3
          text: { en: "All the notebooks that use Env_Gold write with V-Order and optimized write in 1 GB bins.", fr: "Tous les notebooks qui utilisent Env_Gold écrivent avec V-Order et l'écriture optimisée en lots de 1 Go." }
        - id: r4
          text: { en: "The files already stored in the fact_sales table are rewritten with V-Order.", fr: "Les fichiers déjà stockés dans la table fact_sales sont réécrits avec V-Order." }
    answer:
      mapping: { r1: writeopt, r2: tblprop, r3: pbi, r4: optimize }
    explanation:
      correct:
        en: |
          The DataFrame writer option `parquet.vorder.enabled` applies V-Order to one write when the session setting is off. The table property `delta.parquet.vorder.enabled` applies to every future write to the table while no session setting overrides it. The `readHeavyForPBI` profile, set in the environment, turns on V-Order and optimized write with 1 GB bins for all its notebooks. Changing settings never touches existing files: `OPTIMIZE ... VORDER` rewrites them.
        fr: |
          L'option d'écriture DataFrame `parquet.vorder.enabled` applique V-Order à une écriture quand le paramètre de session est désactivé. La propriété de table `delta.parquet.vorder.enabled` s'applique à chaque écriture future dans la table tant qu'aucun paramètre de session ne la remplace. Le profil `readHeavyForPBI`, défini dans l'environnement, active V-Order et l'écriture optimisée avec des lots de 1 Go pour tous ses notebooks. Modifier des paramètres ne touche jamais les fichiers existants : `OPTIMIZE ... VORDER` les réécrit.
      options:
        session: { en: "The session setting applies V-Order to every write of the session, not only to dim_date, and in other notebooks it would require code changes.", fr: "Le paramètre de session applique V-Order à toutes les écritures de la session, pas seulement à dim_date, et dans les autres notebooks il exigerait des modifications du code." }
        spark: { en: "`readHeavyForSpark` turns on optimized write with 128 MB bins but not V-Order.", fr: "`readHeavyForSpark` active l'écriture optimisée avec des lots de 128 Mo, mais pas V-Order." }
    references:
      - title: Optimize Delta Lake tables with V-order in Fabric - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/delta-optimization-and-v-order
      - title: Configure Resource Profile Configurations in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/configure-resource-profile-configurations

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-33-09
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace that contains a pipeline named PL_Sync. A Lookup activity returns the names of 240 tables of an Azure SQL database. A ForEach activity iterates over them with **Sequential** selected. Inside the ForEach, a Copy activity copies one table to a lakehouse by using the Dynamic range partition option with predefined bounds and **Degree of copy parallelism** set to Auto. PL_Sync now takes more than 16 hours.

        Tests show that each copy takes about 4 minutes with a degree of copy parallelism of 4 or more.

        You need to modify PL_Sync to meet the following requirements:

        - PL_Sync must complete in less than two hours.
        - PL_Sync must never open more than 40 concurrent sessions on the source database.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient un pipeline nommé PL_Sync. Une activité Lookup renvoie les noms de 240 tables d'une base de données Azure SQL. Une activité ForEach les parcourt avec **Sequential** coché. Dans la ForEach, une activité Copy copie une table vers un lakehouse en utilisant l'option de partition Dynamic range avec des bornes prédéfinies et **Degree of copy parallelism** défini sur Auto. PL_Sync prend désormais plus de 16 heures.

        Des tests montrent que chaque copie prend environ 4 minutes avec un degré de parallélisme de copie de 4 ou plus.

        Vous devez modifier PL_Sync pour répondre aux exigences suivantes :

        - PL_Sync doit se terminer en moins de deux heures.
        - PL_Sync ne doit jamais ouvrir plus de 40 sessions simultanées sur la base de données source.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Clear Sequential, set Batch count to 40, and keep Degree of copy parallelism at Auto.", fr: "Décocher Sequential, définir Batch count sur 40 et laisser Degree of copy parallelism sur Auto." } }
        - { id: b, text: { en: "Clear Sequential, set Batch count to 5, and set Degree of copy parallelism to 8.", fr: "Décocher Sequential, définir Batch count sur 5 et définir Degree of copy parallelism sur 8." } }
        - { id: c, text: { en: "Clear Sequential, set Batch count to 20, and set Degree of copy parallelism to 4.", fr: "Décocher Sequential, définir Batch count sur 20 et définir Degree of copy parallelism sur 4." } }
        - { id: d, text: { en: "Clear Sequential, set Batch count to 10, and set Degree of copy parallelism to 4.", fr: "Décocher Sequential, définir Batch count sur 10 et définir Degree of copy parallelism sur 4." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Without Sequential, the ForEach runs up to Batch count items at the same time, and each parallel copy is a session on the source database. Ten copies with four parallel copies each open at most 40 sessions, and 240 tables in batches of 10 at about 4 minutes each take about 96 minutes.
        fr: |
          Sans Sequential, la ForEach exécute jusqu'à Batch count éléments en même temps, et chaque copie parallèle est une session sur la base de données source. Dix copies de quatre copies parallèles chacune ouvrent au plus 40 sessions, et 240 tables par lots de 10 à environ 4 minutes chacune prennent environ 96 minutes.
      options:
        a: { en: "With Auto, each Copy activity can generate many parallel copies (hundreds on a dynamic range), so 40 copies far exceed 40 sessions.", fr: "Avec Auto, chaque activité Copy peut générer de nombreuses copies parallèles (des centaines avec Dynamic range) : 40 copies dépassent largement 40 sessions." }
        b: { en: "5 × 8 = 40 sessions, but only five tables run at a time: 240 / 5 × 4 minutes is about 3 hours and 12 minutes.", fr: "5 × 8 = 40 sessions, mais seulement cinq tables s'exécutent à la fois : 240 / 5 × 4 minutes font environ 3 heures et 12 minutes." }
        c: { en: "20 copies with four parallel copies each can open 80 sessions, twice the limit.", fr: "20 copies de quatre copies parallèles chacune peuvent ouvrir 80 sessions, soit le double de la limite." }
    references:
      - title: ForEach Activity - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/foreach-activity
      - title: Copy activity performance with SQL databases - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/copy-performance-sql-databases

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-33-10
    objective: "3.3.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a Fabric eventhouse that contains a KQL database with the following tables. Both have a datetime column named Timestamp and a string column named SessionId.

        - **Sessions**: one row per session. Over the last day, about 10 million rows (several GB).
        - **Events**: one row per event. Over the last day, about 400 million rows.

        You need a query that returns, for the last day, the number of events per country of the session. SessionId has a very high cardinality. Even after filtering, each side of the join is much larger than 100 MB. The query must return exact results and use the fewest resources.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un eventhouse Fabric qui contient une base de données KQL avec les tables suivantes. Les deux ont une colonne datetime nommée Timestamp et une colonne de type chaîne nommée SessionId.

        - **Sessions** : une ligne par session. Sur le dernier jour, environ 10 millions de lignes (plusieurs Go).
        - **Events** : une ligne par événement. Sur le dernier jour, environ 400 millions de lignes.

        Vous avez besoin d'une requête qui renvoie, pour le dernier jour, le nombre d'événements par pays de la session. SessionId a une cardinalité très élevée. Même après filtrage, chaque côté de la jointure est bien plus volumineux que 100 Mo. La requête doit renvoyer des résultats exacts et utiliser le moins de ressources possible.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: kusto
      template: |
        [[left]]
        | where Timestamp > ago(1d)
        | [[op]] (
            [[right]]
            | where Timestamp > ago(1d)
          ) on SessionId
        | summarize EventCount = count() by Country
      slots:
        - id: left
          options:
            - { id: sessions, text: Sessions }
            - { id: events, text: Events }
        - id: op
          options:
            - { id: plain, text: "join kind=inner" }
            - { id: broadcast, text: "join kind=inner hint.strategy = broadcast" }
            - { id: shuffle, text: "join kind=inner hint.shufflekey = SessionId" }
            - { id: lookup, text: "lookup kind=inner" }
        - id: right
          options:
            - { id: sessions, text: Sessions }
            - { id: events, text: Events }
    answer:
      values: { left: sessions, op: shuffle, right: events }
    explanation:
      correct:
        en: |
          Put the table with the fewest rows on the left of a join: Sessions, with Events on the right. When both sides are too large for the broadcast or lookup strategies and the join key has a high cardinality, `hint.shufflekey = SessionId` spreads the join over all the nodes, each one processing a partition of the keys. Both sides are filtered on the datetime column first, which uses the time index.
        fr: |
          Placez la table qui a le moins de lignes à gauche d'une jointure : Sessions, avec Events à droite. Quand les deux côtés sont trop volumineux pour les stratégies broadcast ou lookup et que la clé de jointure a une cardinalité élevée, `hint.shufflekey = SessionId` répartit la jointure sur tous les nœuds, chacun traitant une partition des clés. Les deux côtés sont d'abord filtrés sur la colonne datetime, ce qui utilise l'index temporel.
      options:
        events: { en: "Events has 40 times more rows: as the left side it makes the join match far more rows.", fr: "Events a 40 fois plus de lignes : à gauche, il fait apparier bien plus de lignes à la jointure." }
        plain: { en: "The default strategy processes the high-cardinality join without spreading it by key, which uses more memory per node.", fr: "La stratégie par défaut traite la jointure à forte cardinalité sans la répartir par clé, ce qui consomme plus de mémoire par nœud." }
        broadcast: { en: "Broadcast suits a small left side, up to about 100 MB; here the left side is several GB.", fr: "Broadcast convient à un petit côté gauche, jusqu'à environ 100 Mo ; ici, le côté gauche fait plusieurs Go." }
        lookup: { en: "lookup suits a small right side; with a right side larger than several tens of MB, the query fails.", fr: "lookup convient à un petit côté droit ; avec un côté droit de plus de quelques dizaines de Mo, la requête échoue." }
    references:
      - title: Best practices for Kusto Query Language queries - Kusto
        url: https://learn.microsoft.com/en-us/kusto/query/best-practices?view=microsoft-fabric
      - title: Shuffle query - Kusto
        url: https://learn.microsoft.com/en-us/kusto/query/shuffle-query?view=microsoft-fabric
