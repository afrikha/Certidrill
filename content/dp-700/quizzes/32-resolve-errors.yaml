chapter: 32-resolve-errors
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-32-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Finance. PL_Finance runs six activities in sequence.

        Last night's run of PL_Finance failed at the fifth activity, a Copy data activity named Copy Ledger, because the password of its connection had expired. The first four activities succeeded. You have updated the credentials of the connection.

        You need to complete the processing without running the first four activities again. The definition of PL_Finance must not be changed.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Finance. PL_Finance exécute six activités en séquence.

        L'exécution de la nuit dernière de PL_Finance a échoué à la cinquième activité, une activité Copy data nommée Copy Ledger, parce que le mot de passe de sa connexion avait expiré. Les quatre premières activités ont réussi. Vous avez mis à jour les informations d'identification de la connexion.

        Vous devez terminer le traitement sans exécuter à nouveau les quatre premières activités. La définition de PL_Finance ne doit pas être modifiée.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select Run on the canvas of PL_Finance to start a new run of the pipeline.", fr: "Sélectionner Run sur le canevas de PL_Finance pour démarrer une nouvelle exécution du pipeline." } }
        - { id: b, text: { en: "Open the failed run in the Monitoring hub and rerun it from the failed activity.", fr: "Ouvrir l'exécution en échec dans le hub de surveillance et la relancer à partir de l'activité en échec." } }
        - { id: c, text: { en: "Set Retry to 1 in the General settings of Copy Ledger and wait for the next run.", fr: "Définir Retry sur 1 dans les paramètres généraux de Copy Ledger et attendre la prochaine exécution." } }
        - { id: d, text: { en: "Set the first four activities to Deactivated and Succeeded, and run the pipeline.", fr: "Définir les quatre premières activités sur Deactivated et Succeeded, puis exécuter le pipeline." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The run details in the Monitoring hub let you rerun a pipeline run from its failed activity. The activities that already succeeded aren't repeated, and the pipeline definition stays as it is.
        fr: |
          Le détail de l'exécution dans le hub de surveillance permet de relancer une exécution de pipeline à partir de son activité en échec. Les activités déjà réussies ne sont pas répétées, et la définition du pipeline reste inchangée.
      options:
        a: { en: "A new run starts from the first activity, so the four activities that succeeded run again.", fr: "Une nouvelle exécution démarre à la première activité : les quatre activités réussies s'exécutent donc à nouveau." }
        c: { en: "Retry repeats an activity inside a run for transient errors; it changes the pipeline, and the next run still starts from the first activity.", fr: "Retry répète une activité au sein d'une exécution pour les erreurs temporaires ; il modifie le pipeline, et la prochaine exécution démarre toujours à la première activité." }
        d: { en: "Deactivating activities skips them, but it changes the definition of PL_Finance, which isn't allowed.", fr: "Désactiver des activités évite bien de les exécuter, mais cela modifie la définition de PL_Finance, ce qui n'est pas autorisé." }
    references:
      - title: How to monitor pipeline runs in Monitoring hub - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/monitoring-hub-pipeline-runs

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-32-02
    objective: "3.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace that contains a lakehouse named LH_Sales and an eventhouse named EH_Ops. A KQL database in EH_Ops contains a OneLake shortcut named SalesHistory that targets a Delta table of LH_Sales.

        An analyst runs the query `SalesHistory | take 10` in the KQL database. The query fails because SalesHistory can't be resolved as a table.

        How should the analyst write the query?
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient un lakehouse nommé LH_Sales et un eventhouse nommé EH_Ops. Une base de données KQL d'EH_Ops contient un raccourci OneLake nommé SalesHistory qui cible une table Delta de LH_Sales.

        Un analyste exécute la requête `SalesHistory | take 10` dans la base de données KQL. La requête échoue, car SalesHistory ne peut pas être résolu comme une table.

        Comment l'analyste doit-il écrire la requête ?
    body:
      options:
        - { id: a, text: "`table('SalesHistory') | take 10`" }
        - { id: b, text: "`database('LH_Sales').SalesHistory | take 10`" }
        - { id: c, text: "`external_table('SalesHistory') | take 10`" }
        - { id: d, text: "`materialized_view('SalesHistory') | take 10`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A OneLake shortcut in a KQL database is listed under Shortcuts and is queried as an external table, with the `external_table()` function and the name of the shortcut. It isn't a regular table of the database, so its bare name doesn't resolve.
        fr: |
          Un raccourci OneLake dans une base de données KQL est listé sous Shortcuts et s'interroge comme une table externe, avec la fonction `external_table()` et le nom du raccourci. Ce n'est pas une table ordinaire de la base, donc son nom seul n'est pas résolu.
      options:
        a: { en: "`table()` references a table of the database, the same as the bare name; a shortcut isn't one.", fr: "`table()` référence une table de la base, comme le nom seul ; un raccourci n'en est pas une." }
        b: { en: "`database()` references another KQL database; a lakehouse isn't a KQL database.", fr: "`database()` référence une autre base de données KQL ; un lakehouse n'est pas une base de données KQL." }
        d: { en: "`materialized_view()` queries a materialized view, not a shortcut.", fr: "`materialized_view()` interroge une vue matérialisée, pas un raccourci." }
    references:
      - title: Create OneLake shortcuts in a KQL database - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-32-03
    objective: "3.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace that contains an eventstream named ES_Fleet and an eventhouse named EH_Fleet. ES_Fleet reads JSON events from an Azure Event Hubs source, applies a Filter operator, and writes to an existing table in EH_Fleet by using Event processing before ingestion.

        After a firmware update of the vehicles, some events no longer reach EH_Fleet. In Data insights, the source node shows no deserialization errors and no backlogged input events. The eventhouse destination node shows a growing number of data conversion errors.

        What is the most likely cause?
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient un eventstream nommé ES_Fleet et un eventhouse nommé EH_Fleet. ES_Fleet lit des événements JSON depuis une source Azure Event Hubs, applique un opérateur Filter et écrit dans une table existante d'EH_Fleet en utilisant Event processing before ingestion.

        Après une mise à jour du microprogramme des véhicules, certains événements n'arrivent plus dans EH_Fleet. Dans Data insights, le nœud source n'affiche aucune erreur de désérialisation et aucun événement d'entrée en backlog. Le nœud de destination eventhouse affiche un nombre croissant d'erreurs de conversion de données.

        Quelle est la cause la plus probable ?
    body:
      options:
        - { id: a, text: { en: "The data format selected for the source no longer matches the encoding of the events.", fr: "Le format de données choisi pour la source ne correspond plus à l'encodage des événements." } }
        - { id: b, text: { en: "The Event throughput setting of ES_Fleet is too low for the new volume of events.", fr: "Le paramètre Event throughput d'ES_Fleet est trop faible pour le nouveau volume d'événements." } }
        - { id: c, text: { en: "Some events have exceeded the retention period of ES_Fleet before being processed.", fr: "Certains événements ont dépassé la période de rétention d'ES_Fleet avant d'être traités." } }
        - { id: d, text: { en: "Some output events no longer fit the schema of the table, such as a field whose type changed.", fr: "Certains événements de sortie ne correspondent plus au schéma de la table, par exemple un champ dont le type a changé." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Data conversion errors count the output events that can't be converted to the schema expected by the destination. The events are read and processed (no deserialization error, no backlog), but some of them fail at the destination, which points to a schema change: fix the mapping or add a transformation.
        fr: |
          Les erreurs de conversion de données comptent les événements de sortie qui ne peuvent pas être convertis dans le schéma attendu par la destination. Les événements sont lus et traités (aucune erreur de désérialisation, aucun backlog), mais certains échouent à la destination, ce qui désigne un changement de schéma : corrigez le mappage ou ajoutez une transformation.
      options:
        a: { en: "A wrong source format makes the input events impossible to read: the source node would report deserialization errors.", fr: "Un mauvais format de source rend les événements d'entrée illisibles : le nœud source signalerait des erreurs de désérialisation." }
        b: { en: "Insufficient throughput shows as backlogged input events and a growing watermark delay, not as conversion errors.", fr: "Un débit insuffisant se traduit par des événements d'entrée en backlog et un délai de filigrane croissant, pas par des erreurs de conversion." }
        c: { en: "Expired events are simply no longer available; they don't produce conversion errors at the destination.", fr: "Les événements expirés ne sont simplement plus disponibles ; ils ne produisent pas d'erreurs de conversion à la destination." }
    references:
      - title: Monitor the Status and Performance of an Eventstream - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-32-04
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace named Workspace1 that contains a notebook named NB_Geo and a pipeline named PL_Geo. The first cell of NB_Geo runs `%pip install geopy`. A Notebook activity in PL_Geo runs NB_Geo.

        NB_Geo succeeds when it runs interactively, but it fails in every run of PL_Geo because the geopy library can't be installed.

        You need the runs of PL_Geo to succeed. NB_Geo must not be modified.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un notebook nommé NB_Geo et un pipeline nommé PL_Geo. La première cellule de NB_Geo exécute `%pip install geopy`. Une activité Notebook de PL_Geo exécute NB_Geo.

        NB_Geo réussit quand il s'exécute en interactif, mais il échoue dans chaque exécution de PL_Geo, car la bibliothèque geopy ne peut pas être installée.

        Vous devez faire en sorte que les exécutions de PL_Geo réussissent. NB_Geo ne doit pas être modifié.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the Boolean parameter `_inlineInstallationEnabled` with the value True to the Notebook activity.", fr: "Ajouter le paramètre booléen `_inlineInstallationEnabled` avec la valeur True à l'activité Notebook." } }
        - { id: b, text: { en: "Turn on high concurrency mode for notebooks run by pipelines in the settings of Workspace1.", fr: "Activer le mode haute concurrence pour les notebooks exécutés par des pipelines dans les paramètres de Workspace1." } }
        - { id: c, text: { en: "Set Retry to 3 and Retry interval to 120 seconds in the General settings of the Notebook activity.", fr: "Définir Retry sur 3 et Retry interval sur 120 secondes dans les paramètres généraux de l'activité Notebook." } }
        - { id: d, text: { en: "Replace `%pip install geopy` with `!pip install geopy` in the first cell of the notebook.", fr: "Remplacer `%pip install geopy` par `!pip install geopy` dans la première cellule du notebook." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Inline library commands such as `%pip install` are disabled by default in notebook pipeline runs. Adding `_inlineInstallationEnabled` as a Boolean parameter set to True in the Notebook activity parameters enables them without touching the notebook. An environment remains the recommended long-term solution, but attaching it would modify NB_Geo.
        fr: |
          Les commandes de bibliothèque en ligne comme `%pip install` sont désactivées par défaut dans les exécutions de notebooks par un pipeline. Ajouter `_inlineInstallationEnabled` comme paramètre booléen défini sur True dans les paramètres de l'activité Notebook les active sans toucher au notebook. Un environnement reste la solution recommandée à long terme, mais l'attacher modifierait NB_Geo.
      options:
        b: { en: "`%pip install` isn't supported in high concurrency mode, so this would not fix the installation.", fr: "`%pip install` n'est pas pris en charge en mode haute concurrence : cela ne corrigerait pas l'installation." }
        c: { en: "The failure isn't transient: inline installation stays disabled in every retry.", fr: "L'échec n'est pas temporaire : l'installation en ligne reste désactivée à chaque nouvelle tentative." }
        d: { en: "This modifies NB_Geo, and `!pip` installs the library on the driver only, not on the executors.", fr: "Cela modifie NB_Geo, et `!pip` installe la bibliothèque sur le pilote uniquement, pas sur les exécuteurs." }
    references:
      - title: Manage Apache Spark libraries in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/library-management

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-32-05
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric workspace named Workspace1 that contains a lakehouse named LH_Ops and a Dataflow Gen2 named DF_Shifts. The queries of DF_Shifts load data into tables of LH_Ops. Several team members report problems with DF_Shifts, and you prepare a troubleshooting checklist.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Ops et un Dataflow Gen2 nommé DF_Shifts. Les requêtes de DF_Shifts chargent des données dans des tables de LH_Ops. Plusieurs membres de l'équipe signalent des problèmes avec DF_Shifts, et vous préparez une liste de vérification pour le dépannage.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A query column of type Duration that holds shift lengths can be loaded into a table of LH_Ops without converting it.", fr: "Une colonne de requête de type Duration qui contient la durée des postes peut être chargée dans une table de LH_Ops sans être convertie." }
        - id: s2
          text: { en: "A red exclamation mark in the Status column of DF_Shifts can mean that the last save and validation failed, even if no refresh failed.", fr: "Un point d'exclamation rouge dans la colonne Status de DF_Shifts peut signifier que le dernier enregistrement et la dernière validation ont échoué, même si aucune actualisation n'a échoué." }
        - id: s3
          text: { en: "A query of DF_Shifts that returns a list of employee IDs can be given LH_Ops as its data destination.", fr: "Une requête de DF_Shifts qui renvoie une liste d'ID d'employés peut avoir LH_Ops comme destination des données." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Duration is supported only by the Azure Data Explorer destination, so it must be converted (for example to a number of minutes) before loading into a lakehouse. The Status column shows both the last refresh and the last save and validation: a failed validation is investigated in the dataflow editor. Data destinations apply only to tabular queries, not to lists or functions.
        fr: |
          Duration n'est pris en charge que par la destination Azure Data Explorer : il faut le convertir (par exemple en nombre de minutes) avant de le charger dans un lakehouse. La colonne Status affiche à la fois la dernière actualisation et le dernier enregistrement avec validation : une validation en échec s'examine dans l'éditeur de dataflow. Les destinations des données ne s'appliquent qu'aux requêtes tabulaires, pas aux listes ni aux fonctions.
      options:
        s1: { en: "Lakehouse and warehouse destinations don't support Duration; convert the column first.", fr: "Les destinations lakehouse et entrepôt ne prennent pas en charge Duration ; convertissez d'abord la colonne." }
        s3: { en: "Convert the list into a table, for example with Table.FromList, before adding a destination.", fr: "Convertissez la liste en table, par exemple avec Table.FromList, avant d'ajouter une destination." }
    references:
      - title: Dataflow Gen2 data destinations and managed settings - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflow-gen2-data-destinations-and-managed-settings
      - title: View Dataflow Gen2 refresh history and monitoring - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-32-06
    objective: "3.2.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a Fabric workspace that contains a warehouse named DW_Retail and a lakehouse named LH_Retail. You are migrating a deployment script from SQL Server. The script runs the following statements in this order, each against the target shown.

        | Step | Target | Statement |
        | --- | --- | --- |
        | 1 | SQL analytics endpoint of LH_Retail | `CREATE VIEW dbo.vOpenOrders AS SELECT OrderID, StoreID FROM dbo.orders WHERE Status = 'Open';` |
        | 2 | DW_Retail | `ALTER TABLE dbo.Orders ADD Region varchar(10) NOT NULL DEFAULT ('EU');` |
        | 3 | DW_Retail | `EXEC sp_rename 'dbo.Orders.Chanel', 'Channel', 'COLUMN';` |
        | 4 | DW_Retail | `ALTER TABLE dbo.Orders ADD CONSTRAINT PK_Orders PRIMARY KEY NONCLUSTERED (OrderID) NOT ENFORCED;` |
        | 5 | DW_Retail | `CREATE TRIGGER trg_Orders_Audit ON dbo.Orders AFTER UPDATE AS INSERT INTO dbo.OrdersAudit SELECT OrderID, SYSDATETIME() FROM inserted;` |

        The objects that the statements reference exist, and you have the required permissions.

        Which two steps will fail?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient un entrepôt nommé DW_Retail et un lakehouse nommé LH_Retail. Vous migrez un script de déploiement depuis SQL Server. Le script exécute les instructions suivantes dans cet ordre, chacune sur la cible indiquée.

        | Étape | Cible | Instruction |
        | --- | --- | --- |
        | 1 | Point de terminaison d'analytique SQL de LH_Retail | `CREATE VIEW dbo.vOpenOrders AS SELECT OrderID, StoreID FROM dbo.orders WHERE Status = 'Open';` |
        | 2 | DW_Retail | `ALTER TABLE dbo.Orders ADD Region varchar(10) NOT NULL DEFAULT ('EU');` |
        | 3 | DW_Retail | `EXEC sp_rename 'dbo.Orders.Chanel', 'Channel', 'COLUMN';` |
        | 4 | DW_Retail | `ALTER TABLE dbo.Orders ADD CONSTRAINT PK_Orders PRIMARY KEY NONCLUSTERED (OrderID) NOT ENFORCED;` |
        | 5 | DW_Retail | `CREATE TRIGGER trg_Orders_Audit ON dbo.Orders AFTER UPDATE AS INSERT INTO dbo.OrdersAudit SELECT OrderID, SYSDATETIME() FROM inserted;` |

        Les objets référencés par les instructions existent, et vous disposez des autorisations nécessaires.

        Quelles sont les deux étapes qui vont échouer ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Step 1", fr: "Étape 1" } }
        - { id: b, text: { en: "Step 2", fr: "Étape 2" } }
        - { id: c, text: { en: "Step 3", fr: "Étape 3" } }
        - { id: d, text: { en: "Step 4", fr: "Étape 4" } }
        - { id: e, text: { en: "Step 5", fr: "Étape 5" } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Fabric Data Warehouse supports only a subset of `ALTER TABLE`: adding nullable columns, dropping columns and adding or dropping `NOT ENFORCED` constraints; adding a `NOT NULL` column is blocked, so step 2 fails (add the column as nullable instead). Triggers aren't supported in Fabric Data Warehouse, so step 5 fails; move the audit logic into the loading process.
        fr: |
          Fabric Data Warehouse ne prend en charge qu'un sous-ensemble d'`ALTER TABLE` : l'ajout de colonnes nullables, la suppression de colonnes et l'ajout ou la suppression de contraintes `NOT ENFORCED` ; l'ajout d'une colonne `NOT NULL` est bloqué, donc l'étape 2 échoue (ajoutez plutôt la colonne comme nullable). Les déclencheurs ne sont pas pris en charge dans Fabric Data Warehouse, donc l'étape 5 échoue ; déplacez la logique d'audit dans le processus de chargement.
      options:
        a: { en: "The SQL analytics endpoint is read-only for tables, but views, functions and procedures can be created on it.", fr: "Le point de terminaison d'analytique SQL est en lecture seule pour les tables, mais on peut y créer des vues, des fonctions et des procédures." }
        c: { en: "`sp_rename` is the supported way to rename a column of a warehouse table.", fr: "`sp_rename` est la méthode prise en charge pour renommer une colonne d'une table d'entrepôt." }
        d: { en: "Primary keys are supported when they are `NONCLUSTERED` and `NOT ENFORCED`, which is exactly this statement.", fr: "Les clés primaires sont prises en charge lorsqu'elles sont `NONCLUSTERED` et `NOT ENFORCED`, ce qui est exactement le cas de cette instruction." }
    references:
      - title: T-SQL Surface Area in Fabric Data Warehouse - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/tsql-surface-area

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-32-07
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric workspace named WS_Analytics that is assigned to an F32 capacity. The capacity uses its default Spark settings. WS_Analytics uses a custom Spark pool with Medium nodes (8 VCores each) and autoscale up to 24 nodes.

        Every night, a pipeline named PL_Nightly runs a Notebook activity named Score Customers. Other workloads of the capacity sometimes use all its Spark VCores, and the capacity was throttled twice last month after overconsumption.

        You are documenting why some runs of Score Customers failed or started late.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS_Analytics affecté à une capacité F32. La capacité utilise ses paramètres Spark par défaut. WS_Analytics utilise un pool Spark personnalisé avec des nœuds Medium (8 VCores chacun) et une mise à l'échelle automatique jusqu'à 24 nœuds.

        Chaque nuit, un pipeline nommé PL_Nightly exécute une activité Notebook nommée Score Customers. D'autres charges de travail de la capacité utilisent parfois tous ses VCores Spark, et la capacité a été limitée (throttled) deux fois le mois dernier après une surconsommation.

        Vous documentez pourquoi certaines exécutions de Score Customers ont échoué ou ont démarré en retard.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If the capacity is throttled when PL_Nightly starts Score Customers, the Spark job is queued and starts automatically when the throttling ends.", fr: "Si la capacité est limitée quand PL_Nightly démarre Score Customers, la tâche Spark est mise en file d'attente et démarre automatiquement à la fin de la limitation." }
        - id: s2
          text: { en: "If all the Spark VCores are in use, a Score Customers job that is still queued 24 hours after its submission is removed from the queue and must be submitted again.", fr: "Si tous les VCores Spark sont utilisés, une tâche Score Customers encore en file d'attente 24 heures après sa soumission est retirée de la file et doit être soumise à nouveau." }
        - id: s3
          text: { en: "When no other Spark job runs on the capacity, a single run of Score Customers can use more than 64 Spark VCores.", fr: "Quand aucune autre tâche Spark ne s'exécute sur la capacité, une seule exécution de Score Customers peut utiliser plus de 64 VCores Spark." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Jobs submitted by pipelines are queued (FIFO) only while the capacity is fully used; while it's throttled, new Spark jobs are rejected instead of queued. A queued job expires 24 hours after submission and must be resubmitted. An F32 provides 64 Spark VCores (two per capacity unit) and bursts up to three times, 192 VCores; with default settings a single job can use the burst cores, and the pool allows 24 × 8 = 192 VCores.
        fr: |
          Les tâches soumises par des pipelines sont mises en file d'attente (FIFO) seulement quand la capacité est entièrement utilisée ; quand elle est limitée, les nouvelles tâches Spark sont rejetées au lieu d'être mises en file d'attente. Une tâche en file d'attente expire 24 heures après sa soumission et doit être soumise à nouveau. Une F32 fournit 64 VCores Spark (deux par unité de capacité) et monte en rafale jusqu'à trois fois plus, soit 192 VCores ; avec les paramètres par défaut, une seule tâche peut utiliser les cœurs de rafale, et le pool autorise 24 × 8 = 192 VCores.
      options:
        s1: { en: "A throttled capacity rejects new Spark jobs, whatever their source: the pipeline run fails and must be run again.", fr: "Une capacité limitée rejette les nouvelles tâches Spark, quelle que soit leur origine : l'exécution du pipeline échoue et doit être relancée." }
        s3: { en: "64 VCores is the base of an F32; bursting lets a single job go up to 192 VCores by default.", fr: "64 VCores est la base d'une F32 ; la rafale permet par défaut à une seule tâche de monter jusqu'à 192 VCores." }
    references:
      - title: Concurrency limits and queueing in Apache Spark for Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/spark-job-concurrency-and-queueing

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-32-08
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric workspace that contains an eventhouse named EH_Plant. A KQL database in EH_Plant contains two tables named RawReadings and Readings. A pipeline loads files into RawReadings every hour by using queued ingestion. An update policy on Readings uses RawReadings as its source and a function named ParseReadings() as its query. The update policy was created without setting IsTransactional.

        Analysts report that readings from several loads of the last three weeks are missing from Readings, although every run of the pipeline succeeded. You plan the investigation and a backfill.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient un eventhouse nommé EH_Plant. Une base de données KQL d'EH_Plant contient deux tables nommées RawReadings et Readings. Un pipeline charge des fichiers dans RawReadings toutes les heures en utilisant l'ingestion en file d'attente. Une stratégie de mise à jour sur Readings utilise RawReadings comme source et une fonction nommée ParseReadings() comme requête. La stratégie de mise à jour a été créée sans définir IsTransactional.

        Des analystes signalent qu'il manque dans Readings des relevés de plusieurs chargements des trois dernières semaines, alors que toutes les exécutions du pipeline ont réussi. Vous planifiez l'investigation et un rattrapage.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "For a failure listed by `.show ingestion failures` with OriginatesFromUpdatePolicy set to true, the rows of that load are in RawReadings but not in Readings.", fr: "Pour un échec listé par `.show ingestion failures` avec OriginatesFromUpdatePolicy défini sur true, les lignes de ce chargement sont dans RawReadings mais pas dans Readings." }
        - id: s2
          text: { en: "`.show ingestion failures` lists the failures of the loads that ran 20 days ago.", fr: "`.show ingestion failures` liste les échecs des chargements exécutés il y a 20 jours." }
        - id: s3
          text: { en: "A `.set-or-append Readings <| ...` command that needs about 8 minutes to backfill the missing rows completes within the default timeout.", fr: "Une commande `.set-or-append Readings <| ...` qui a besoin d'environ 8 minutes pour rattraper les lignes manquantes se termine dans le délai d'expiration par défaut." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          With IsTransactional left at false, a failing update policy doesn't fail the ingestion: the data lands in the source table only, which explains successful pipeline runs with rows missing from Readings. Ingestion failures are kept for 14 days, so the oldest loads can't be investigated with this command. Management commands such as `.set-or-append` have a default timeout of 10 minutes (queries have 4 minutes).
        fr: |
          Avec IsTransactional laissé à false, une stratégie de mise à jour en échec ne fait pas échouer l'ingestion : les données n'arrivent que dans la table source, ce qui explique des exécutions de pipeline réussies avec des lignes manquantes dans Readings. Les échecs d'ingestion sont conservés 14 jours : les chargements les plus anciens ne peuvent donc pas être examinés avec cette commande. Les commandes de gestion comme `.set-or-append` ont un délai d'expiration par défaut de 10 minutes (4 minutes pour les requêtes).
      options:
        s2: { en: "The command keeps failures for 14 days only, so the failures of loads that ran 20 days ago are no longer listed.", fr: "La commande ne conserve les échecs que 14 jours : les échecs des chargements exécutés il y a 20 jours ne sont plus listés." }
    references:
      - title: Update policy overview - Kusto
        url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
      - title: .show ingestion failures command - Kusto
        url: https://learn.microsoft.com/en-us/kusto/management/ingestion-failures?view=microsoft-fabric

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-32-09
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace that contains a pipeline named PL_Close. In PL_Close, three Copy data activities named Copy GL, Copy AP and Copy AR run in parallel. A Teams activity named Notify Finance is connected to each of the three copy activities by an Upon Failure dependency.

        Last night, Copy AP failed and the other two copy activities succeeded. Notify Finance didn't run.

        You need to modify PL_Close to meet the following requirements:

        - Notify Finance runs exactly once in every run in which at least one copy activity fails, and doesn't run otherwise.
        - Such runs are reported as Failed with the error code FIN_CLOSE_LOAD.
        - Runs in which the three copy activities succeed are reported as Succeeded.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient un pipeline nommé PL_Close. Dans PL_Close, trois activités Copy data nommées Copy GL, Copy AP et Copy AR s'exécutent en parallèle. Une activité Teams nommée Notify Finance est reliée à chacune des trois activités de copie par une dépendance Upon Failure.

        La nuit dernière, Copy AP a échoué et les deux autres activités de copie ont réussi. Notify Finance ne s'est pas exécutée.

        Vous devez modifier PL_Close pour répondre aux exigences suivantes :

        - Notify Finance s'exécute exactement une fois dans chaque exécution où au moins une activité de copie échoue, et ne s'exécute pas dans les autres cas.
        - Ces exécutions sont signalées comme Failed avec le code d'erreur FIN_CLOSE_LOAD.
        - Les exécutions où les trois activités de copie réussissent sont signalées comme Succeeded.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the Upon Failure dependencies, and connect a Fail activity with the error code FIN_CLOSE_LOAD to Notify Finance by Upon Success.", fr: "Conserver les dépendances Upon Failure, et relier à Notify Finance par Upon Success une activité Fail avec le code d'erreur FIN_CLOSE_LOAD." } }
        - { id: b, text: { en: "Connect the copy activities by Upon Completion to Notify Finance, then connect a Fail activity with the error code FIN_CLOSE_LOAD to it by Upon Success.", fr: "Relier les activités de copie à Notify Finance par Upon Completion, puis y relier par Upon Success une activité Fail avec le code d'erreur FIN_CLOSE_LOAD." } }
        - { id: c, text: { en: "Connect the copy activities by Upon Completion to an If Condition that checks for a Failed status, and run Notify Finance and then a Fail activity with FIN_CLOSE_LOAD in True.", fr: "Relier les activités de copie par Upon Completion à une If Condition qui recherche un statut Failed, et exécuter dans True Notify Finance puis une activité Fail avec FIN_CLOSE_LOAD." } }
        - { id: d, text: { en: "Connect each copy activity by Upon Failure to its own copy of Notify Finance, and connect a Fail activity with FIN_CLOSE_LOAD to each copy by Upon Success.", fr: "Relier chaque activité de copie par Upon Failure à sa propre copie de Notify Finance, et relier à chaque copie par Upon Success une activité Fail avec FIN_CLOSE_LOAD." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Several incoming dependencies combine with AND: Notify Finance only ran if all three copies failed. Upon Completion arrows into one If Condition with an `or()` of `equals(activity('...').Status, 'Failed')` give the OR logic, so Notify Finance runs once. The Fail activity in the True branch then fails the run with the custom error code, and an all-success run takes the empty False branch and succeeds.
        fr: |
          Plusieurs dépendances entrantes se combinent par un ET : Notify Finance ne s'exécutait que si les trois copies échouaient. Des flèches Upon Completion vers une seule If Condition avec un `or()` de `equals(activity('...').Status, 'Failed')` donnent la logique OU, donc Notify Finance s'exécute une fois. L'activité Fail de la branche True fait ensuite échouer l'exécution avec le code d'erreur personnalisé, et une exécution entièrement réussie prend la branche False vide et réussit.
      options:
        a: { en: "The three Upon Failure arrows still combine with AND, so Notify Finance and the Fail activity run only if all three copies fail.", fr: "Les trois flèches Upon Failure se combinent toujours par un ET : Notify Finance et l'activité Fail ne s'exécutent que si les trois copies échouent." }
        b: { en: "Upon Completion is met whether the copies succeed or fail, so the notification and the Fail activity would run in every run.", fr: "Upon Completion est satisfaite que les copies réussissent ou échouent : la notification et l'activité Fail s'exécuteraient à chaque exécution." }
        d: { en: "When two or three copies fail, Notify Finance runs several times, which breaks the exactly-once requirement.", fr: "Quand deux ou trois copies échouent, Notify Finance s'exécute plusieurs fois, ce qui enfreint l'exigence d'une exécution unique." }
    references:
      - title: Pipeline failure and error message - Azure Data Factory
        url: https://learn.microsoft.com/en-us/azure/data-factory/tutorial-pipeline-failure-error-handling
      - title: Fail activity - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/fail-activity

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-32-10
    objective: "3.2.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a Fabric workspace named WS_Treasury that is assigned to a Fabric trial capacity. WS_Treasury contains a lakehouse named LH_Treasury and has a workspace identity that has the Contributor role in the workspace.

        You have an Azure Data Lake Storage Gen2 account named sttreasury. Public network access to sttreasury is disabled. A storage administrator deployed a resource instance rule for WS_Treasury on sttreasury by using an ARM template.

        A data engineer named User1 tries to create a shortcut in LH_Treasury to sttreasury by using the URL `https://sttreasury.dfs.core.windows.net` and the Organizational account authentication kind with User1's account. User1 has the Storage Account Contributor role on sttreasury and no other role. The creation fails.

        You need User1 to create the shortcut. The shortcut must keep the Organizational account authentication kind, public network access must stay disabled, and the solution must follow the principle of least privilege.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS_Treasury affecté à une capacité d'évaluation Fabric. WS_Treasury contient un lakehouse nommé LH_Treasury et possède une identité d'espace de travail qui a le rôle Contributor dans l'espace de travail.

        Vous disposez d'un compte Azure Data Lake Storage Gen2 nommé sttreasury. L'accès réseau public à sttreasury est désactivé. Un administrateur du stockage a déployé une règle d'instance de ressource pour WS_Treasury sur sttreasury à l'aide d'un modèle ARM.

        Un ingénieur données nommé User1 tente de créer un raccourci dans LH_Treasury vers sttreasury en utilisant l'URL `https://sttreasury.dfs.core.windows.net` et le type d'authentification Organizational account avec le compte de User1. User1 a le rôle Storage Account Contributor sur sttreasury et aucun autre rôle. La création échoue.

        Vous devez permettre à User1 de créer le raccourci. Le raccourci doit conserver le type d'authentification Organizational account, l'accès réseau public doit rester désactivé, et la solution doit respecter le principe du moindre privilège.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Assign the Storage Blob Data Reader role on sttreasury to the workspace identity of WS_Treasury.", fr: "Attribuer le rôle Storage Blob Data Reader sur sttreasury à l'identité d'espace de travail de WS_Treasury." } }
        - { id: b, text: { en: "Reassign WS_Treasury to a capacity with an F SKU.", fr: "Réaffecter WS_Treasury à une capacité de SKU F." } }
        - { id: c, text: { en: "Assign the Storage Blob Data Reader role on sttreasury to User1.", fr: "Attribuer le rôle Storage Blob Data Reader sur sttreasury à User1." } }
        - { id: d, text: { en: "Create the resource instance rule for WS_Treasury again in the Azure portal.", fr: "Recréer la règle d'instance de ressource pour WS_Treasury dans le portail Azure." } }
        - { id: e, text: { en: "Assign the Storage Account Contributor role on sttreasury to the workspace identity of WS_Treasury.", fr: "Attribuer le rôle Storage Account Contributor sur sttreasury à l'identité d'espace de travail de WS_Treasury." } }
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          Trusted workspace access, which lets a shortcut reach a storage account whose public access is disabled, isn't supported on trial capacities: the workspace must run on an F SKU capacity. The principal used by the shortcut, here User1's organizational account, must also hold a Storage Blob Data role (Reader is enough to read); Storage Account Contributor is a control plane role with no data access through Microsoft Entra authorization.
        fr: |
          L'accès approuvé à l'espace de travail, qui permet à un raccourci d'atteindre un compte de stockage dont l'accès public est désactivé, n'est pas pris en charge sur les capacités d'évaluation : l'espace de travail doit être sur une capacité de SKU F. Le principal utilisé par le raccourci, ici le compte professionnel de User1, doit aussi détenir un rôle Storage Blob Data (Reader suffit pour lire) ; Storage Account Contributor est un rôle du plan de contrôle sans accès aux données par l'autorisation Microsoft Entra.
      options:
        a: { en: "The shortcut authenticates with User1's account, not with the workspace identity, so the data role must be given to User1.", fr: "Le raccourci s'authentifie avec le compte de User1, pas avec l'identité d'espace de travail : le rôle de données doit donc être attribué à User1." }
        d: { en: "Resource instance rules for Fabric workspaces can't be created in the Azure portal, and the ARM rule already exists.", fr: "Les règles d'instance de ressource pour les espaces de travail Fabric ne peuvent pas être créées dans le portail Azure, et la règle ARM existe déjà." }
        e: { en: "Storage Account Contributor gives no data access, and the workspace identity isn't the principal used by this shortcut.", fr: "Storage Account Contributor ne donne aucun accès aux données, et l'identité d'espace de travail n'est pas le principal utilisé par ce raccourci." }
    references:
      - title: Trusted workspace access in Microsoft Fabric - Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/security/security-trusted-workspace-access
