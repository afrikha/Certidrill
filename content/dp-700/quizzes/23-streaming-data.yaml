chapter: 23-streaming-data
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-23-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware publishes order events to a topic of Google Cloud Pub/Sub. You have a Fabric workspace that contains an eventhouse named **EH-Orders**.

        You need the events to reach a table of EH-Orders within seconds of their publication. The solution must not require writing code.

        What should you use?
      fr: |
        Litware publie des événements de commande dans une rubrique de Google Cloud Pub/Sub. Vous disposez d'un espace de travail Fabric qui contient un eventhouse nommé **EH-Orders**.

        Les événements doivent arriver dans une table d'EH-Orders quelques secondes après leur publication. La solution ne doit pas demander d'écrire du code.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "A Spark job definition that reads the topic by using the Pub/Sub client library for Python", fr: "Une définition de travail Spark qui lit la rubrique en utilisant la bibliothèque cliente Pub/Sub pour Python" } }
        - { id: b, text: { en: "An eventstream that has a Google Cloud Pub/Sub source and an Eventhouse destination", fr: "Un flux d'événements qui a une source Google Cloud Pub/Sub et une destination Eventhouse" } }
        - { id: c, text: { en: "A OneLake shortcut in the KQL database of EH-Orders that points to Google Cloud Storage", fr: "Un raccourci OneLake dans la base de données KQL d'EH-Orders qui pointe vers Google Cloud Storage" } }
        - { id: d, text: { en: "A pipeline that runs a Copy activity from Google Cloud Pub/Sub every minute", fr: "Un pipeline qui exécute une activité de copie depuis Google Cloud Pub/Sub chaque minute" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Google Cloud Pub/Sub is one of the messaging sources that an eventstream connects to without code. The eventstream routes the events to an Eventhouse destination as they arrive, so they can be queried in seconds.
        fr: |
          Google Cloud Pub/Sub fait partie des sources de messagerie auxquelles un flux d'événements se connecte sans code. Le flux d'événements route les événements vers une destination Eventhouse à mesure qu'ils arrivent ; ils sont donc interrogeables en quelques secondes.
      options:
        a: { en: "A Spark job definition can consume the topic, but only with code, which the requirement excludes.", fr: "Une définition de travail Spark peut consommer la rubrique, mais seulement avec du code, ce que l'exigence exclut." }
        c: { en: "A shortcut references files that are stored in a bucket; it doesn't subscribe to a Pub/Sub topic, so it receives no events.", fr: "Un raccourci référence des fichiers stockés dans un compartiment ; il ne s'abonne pas à une rubrique Pub/Sub et ne reçoit donc aucun événement." }
        d: { en: "A scheduled pipeline is a batch process: it doesn't deliver each event within seconds, and Pub/Sub isn't the streaming source of a Copy activity.", fr: "Un pipeline planifié est un traitement par lots : il ne livre pas chaque événement en quelques secondes, et Pub/Sub n'est pas la source de streaming d'une activité de copie." }
    references:
      - title: Add and manage an event source in an eventstream
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/add-manage-eventstream-sources

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-23-02
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a KQL database named **DB-Sales** that contains a OneLake shortcut named **stores**. The shortcut points to a Delta table in a lakehouse and doesn't use query acceleration. A data engineer adds a column named `Region` to the Delta table.

        Analysts must filter on `Region` in queries that use `external_table('stores')`.

        What should you do in DB-Sales?
      fr: |
        Vous disposez d'une base de données KQL nommée **DB-Sales** qui contient un raccourci OneLake nommé **stores**. Le raccourci pointe vers une table Delta d'un lakehouse et n'utilise pas l'accélération des requêtes. Un ingénieur de données ajoute une colonne nommée `Region` à la table Delta.

        Les analystes doivent filtrer sur `Region` dans des requêtes qui utilisent `external_table('stores')`.

        Que devez-vous faire dans DB-Sales ?
    body:
      options:
        - { id: a, text: { en: "Delete the stores shortcut and create it again so that it reads the new schema", fr: "Supprimer le raccourci stores et le recréer pour qu'il lise le nouveau schéma" } }
        - { id: b, text: { en: "Turn on query acceleration for stores so that the new column is indexed", fr: "Activer l'accélération des requêtes sur stores pour que la nouvelle colonne soit indexée" } }
        - { id: c, text: { en: "Nothing, because the schema of the shortcut is synchronized with the source table by default", fr: "Rien, car le schéma du raccourci est synchronisé par défaut avec la table source" } }
        - { id: d, text: { en: "Ingest the stores table into a native table so that the new column becomes available", fr: "Ingérer la table stores dans une table native pour que la nouvelle colonne devienne disponible" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The table schema of a shortcut in a KQL database is synchronized automatically: column additions, deletions, renames and type changes in the source are reflected without manual updates. This behavior is on by default, so `Region` is already available through `external_table('stores')`.
        fr: |
          Le schéma de table d'un raccourci dans une base de données KQL est synchronisé automatiquement : les ajouts, suppressions, renommages et changements de type de colonnes de la source sont répercutés sans mise à jour manuelle. Ce comportement est actif par défaut ; `Region` est donc déjà disponible via `external_table('stores')`.
      options:
        a: { en: "Recreating the shortcut isn't needed, and shortcuts referenced by functions or dashboards would break while it's missing.", fr: "Recréer le raccourci n'est pas nécessaire, et les fonctions ou tableaux de bord qui le référencent seraient cassés pendant son absence." }
        b: { en: "Query acceleration improves performance and adds cache costs; it isn't needed to see a new column.", fr: "L'accélération des requêtes améliore les performances et ajoute des coûts de cache ; elle n'est pas nécessaire pour voir une nouvelle colonne." }
        d: { en: "Ingesting creates a second copy of the data and an ingestion process, for a change that the shortcut already handles.", fr: "L'ingestion crée une seconde copie des données et un processus d'ingestion, pour un changement que le raccourci gère déjà." }
    references:
      - title: Create OneLake shortcuts in a KQL database
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/onelake-shortcuts

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-23-03
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an eventstream named **ES-Pumps** that receives pressure readings from pumps. Each event contains the `pumpId`, `pressure` and `readTime` fields.

        Each time a new reading arrives, ES-Pumps must produce the maximum pressure of the pump over the last 10 minutes and send it to a lakehouse. You must use a no-code operator.

        Which operator should you add?
      fr: |
        Vous disposez d'un flux d'événements nommé **ES-Pumps** qui reçoit des mesures de pression de pompes. Chaque événement contient les champs `pumpId`, `pressure` et `readTime`.

        Chaque fois qu'une nouvelle mesure arrive, ES-Pumps doit produire la pression maximale de la pompe sur les 10 dernières minutes et l'envoyer à un lakehouse. Vous devez utiliser un opérateur sans code.

        Quel opérateur devez-vous ajouter ?
    body:
      options:
        - { id: a, text: Group by }
        - { id: b, text: Join }
        - { id: c, text: Expand }
        - { id: d, text: Aggregate }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Aggregate operator calculates a Sum, Minimum, Maximum or Average every time a new event occurs, over a period of time that you set, optionally grouped by a field such as `pumpId`. It produces a result for each new reading, as required.
        fr: |
          L'opérateur Aggregate calcule une somme, un minimum, un maximum ou une moyenne chaque fois qu'un nouvel événement se produit, sur une période que vous définissez, éventuellement par champ comme `pumpId`. Il produit un résultat pour chaque nouvelle mesure, comme demandé.
      options:
        a: { en: "Group by aggregates the events of each time window and outputs one result per window, not one result each time a reading arrives.", fr: "Group by agrège les événements de chaque fenêtre de temps et produit un résultat par fenêtre, pas un résultat à chaque arrivée de mesure." }
        b: { en: "Join combines two streams on a matching condition; it doesn't compute a maximum over a period.", fr: "Join combine deux flux sur une condition de correspondance ; il ne calcule pas de maximum sur une période." }
        c: { en: "Expand creates one row per element of an array field; the readings contain no array to expand.", fr: "Expand crée une ligne par élément d'un champ tableau ; les mesures ne contiennent aucun tableau à développer." }
    references:
      - title: Eventstream transformations
        url: https://learn.microsoft.com/en-us/training/modules/explore-event-streams-microsoft-fabric/4-route-event-data-to-destinations
      - title: Route data streams based on content in Microsoft Fabric eventstreams
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/route-events-based-on-content

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-23-04
    objective: "2.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Spark job definition that reads telemetry from 80,000 devices in an Azure event hub and appends it to a Delta table named **telemetry** every minute by using `partitionBy("DeviceId")`.

        Each micro-batch writes tens of thousands of tiny Parquet files. Most queries on telemetry filter on the `EventDate` column.

        You need the stream to write well-sized files. The data must keep arriving every minute. What should you do?
      fr: |
        Vous disposez d'une définition de travail Spark qui lit la télémétrie de 80 000 appareils dans un hub d'événements Azure et l'ajoute chaque minute à une table Delta nommée **telemetry** en utilisant `partitionBy("DeviceId")`.

        Chaque micro-lot écrit des dizaines de milliers de fichiers Parquet minuscules. La plupart des requêtes sur telemetry filtrent sur la colonne `EventDate`.

        Le flux doit écrire des fichiers de bonne taille. Les données doivent continuer d'arriver chaque minute. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace the partition column with EventDate in partitionBy()", fr: "Remplacer la colonne de partition par EventDate dans partitionBy()" } }
        - { id: b, text: { en: "Partition the table by both DeviceId and EventDate in partitionBy()", fr: "Partitionner la table à la fois par DeviceId et EventDate dans partitionBy()" } }
        - { id: c, text: { en: "Keep DeviceId and set the trigger interval to 10 seconds", fr: "Garder DeviceId et définir l'intervalle du déclencheur à 10 secondes" } }
        - { id: d, text: { en: "Keep DeviceId and add repartition(80000) before writeStream", fr: "Garder DeviceId et ajouter repartition(80000) avant writeStream" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A partition column must have a cardinality that produces well-sized files: 80,000 device folders split every micro-batch into tiny files. EventDate creates one folder per day, so each micro-batch writes into a few partitions, and the column also matches the filters of the queries.
        fr: |
          Une colonne de partition doit avoir une cardinalité qui produit des fichiers de bonne taille : 80 000 dossiers d'appareils éclatent chaque micro-lot en fichiers minuscules. EventDate crée un dossier par jour ; chaque micro-lot écrit donc dans peu de partitions, et la colonne correspond aussi aux filtres des requêtes.
      options:
        b: { en: "Adding EventDate under DeviceId keeps the 80,000 device folders and multiplies them by days: even more tiny files.", fr: "Ajouter EventDate sous DeviceId garde les 80 000 dossiers d'appareils et les multiplie par les jours : encore plus de fichiers minuscules." }
        c: { en: "A shorter trigger interval makes smaller micro-batches, which writes even smaller files more often.", fr: "Un intervalle de déclencheur plus court crée des micro-lots plus petits, qui écrivent des fichiers encore plus petits plus souvent." }
        d: { en: "Repartitioning into 80,000 in-memory partitions adds a shuffle and still writes files per device folder; the partition column remains the cause.", fr: "Répartir en 80 000 partitions en mémoire ajoute un shuffle et écrit toujours des fichiers par dossier d'appareil ; la colonne de partition reste la cause." }
    references:
      - title: Data streaming into a lakehouse with Spark
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-23-05
    objective: "2.3.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an eventstream named **ES-Scans** that receives the results of a parcel scanner. The scanner sends its results in bursts: all the parcels of a burst carry the same `scanTime` value.

        You add a SQL operator that uses `TIMESTAMP BY scanTime`. It must output the number of parcels of each line for each distinct `scanTime` value, and no result may combine two bursts.

        Which GROUP BY clause should you use?
      fr: |
        Vous disposez d'un flux d'événements nommé **ES-Scans** qui reçoit les résultats d'un scanner de colis. Le scanner envoie ses résultats par rafales : tous les colis d'une rafale portent la même valeur `scanTime`.

        Vous ajoutez un opérateur SQL qui utilise `TIMESTAMP BY scanTime`. Il doit produire le nombre de colis de chaque ligne pour chaque valeur distincte de `scanTime`, et aucun résultat ne doit combiner deux rafales.

        Quelle clause GROUP BY devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "`GROUP BY lineId, TumblingWindow(second, 1)`" }
        - { id: b, text: "`GROUP BY lineId, SlidingWindow(second, 1)`" }
        - { id: c, text: "`GROUP BY lineId, System.Timestamp()`" }
        - { id: d, text: "`GROUP BY lineId, SessionWindow(second, 1, 10)`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Adding `System.Timestamp()` to the GROUP BY clause creates a snapshot window: it groups the events that have exactly the same timestamp. With `TIMESTAMP BY scanTime`, each burst becomes one group per line.
        fr: |
          Ajouter `System.Timestamp()` à la clause GROUP BY crée une fenêtre d'instantané (snapshot) : elle groupe les événements qui ont exactement le même horodatage. Avec `TIMESTAMP BY scanTime`, chaque rafale devient un groupe par ligne.
      options:
        a: { en: "A one-second tumbling window groups every timestamp of the same second, so two bursts within one second are combined.", fr: "Une fenêtre bascule d'une seconde groupe tous les horodatages de la même seconde : deux rafales dans la même seconde sont combinées." }
        b: { en: "A sliding window outputs a result each time an event enters or leaves it, and its results can contain two close bursts.", fr: "Une fenêtre glissante produit un résultat chaque fois qu'un événement y entre ou en sort, et ses résultats peuvent contenir deux rafales proches." }
        d: { en: "A session window keeps extending while events arrive within the timeout, so bursts less than a second apart end up in one session.", fr: "Une fenêtre de session s'étend tant que des événements arrivent dans le délai : des rafales espacées de moins d'une seconde finissent dans une même session." }
    references:
      - title: Introduction to Stream Analytics windowing functions
        url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-window-functions

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-23-06
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a lakehouse named **LH-Logistics** that contains a Delta table named **shipments**. The table has 300 columns and about 40,000 data files. A weekly Spark job compacts the table into Parquet files of about 8 GB compressed each.

        In an eventhouse, a KQL database named **DB-Ops** contains a OneLake shortcut named **shipments** with query acceleration enabled and a `Hot` period of 30 days. Dashboard queries on the last 30 days of shipments remain much slower than queries on native tables. `.show external table operations query_acceleration statistics` shows that a large part of the data isn't accelerated.

        You need the dashboard queries to use accelerated data. The shortcut must be kept, and no ingestion process may be built. What should you do?
      fr: |
        Fabrikam dispose d'un lakehouse nommé **LH-Logistics** qui contient une table Delta nommée **shipments**. La table a 300 colonnes et environ 40 000 fichiers de données. Un travail Spark hebdomadaire compacte la table en fichiers Parquet d'environ 8 Go compressés chacun.

        Dans un eventhouse, une base de données KQL nommée **DB-Ops** contient un raccourci OneLake nommé **shipments**, avec l'accélération des requêtes activée et une période `Hot` de 30 jours. Les requêtes des tableaux de bord sur les 30 derniers jours de shipments restent beaucoup plus lentes que les requêtes sur des tables natives. `.show external table operations query_acceleration statistics` montre qu'une grande partie des données n'est pas accélérée.

        Les requêtes des tableaux de bord doivent utiliser des données accélérées. Le raccourci doit être conservé, et aucun processus d'ingestion ne doit être créé. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Increase the Hot period of the query acceleration policy of shipments to 60 days", fr: "Porter à 60 jours la période Hot de la stratégie d'accélération des requêtes de shipments" } }
        - { id: b, text: { en: "Change the Spark job so that it writes Parquet files smaller than 6 GB compressed", fr: "Modifier le travail Spark pour qu'il écrive des fichiers Parquet de moins de 6 Go compressés" } }
        - { id: c, text: { en: "Disable the query acceleration policy of shipments, and then enable it again", fr: "Désactiver la stratégie d'accélération des requêtes de shipments, puis la réactiver" } }
        - { id: d, text: { en: "Add a MaxAge property of one hour to the query acceleration policy of shipments", fr: "Ajouter une propriété MaxAge d'une heure à la stratégie d'accélération des requêtes de shipments" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Query acceleration doesn't cache Parquet files whose compressed size is higher than 6 GB, so the 8 GB files produced by the compaction job are never accelerated. The other limits aren't reached (300 columns is under 900, and 40,000 files is far below 2.5 million), so the file size is the cause. Writing smaller files lets the eventhouse index and cache them.
        fr: |
          L'accélération des requêtes ne met pas en cache les fichiers Parquet dont la taille compressée dépasse 6 Go : les fichiers de 8 Go produits par le travail de compactage ne sont jamais accélérés. Les autres limites ne sont pas atteintes (300 colonnes, sous les 900, et 40 000 fichiers, très loin des 2,5 millions) ; la taille des fichiers est donc la cause. Écrire des fichiers plus petits permet à l'eventhouse de les indexer et de les mettre en cache.
      options:
        a: { en: "A longer Hot period extends the cached time range but doesn't make the eventhouse cache files over 6 GB; it also raises the cache cost.", fr: "Une période Hot plus longue étend la plage de temps mise en cache mais ne fait pas mettre en cache les fichiers de plus de 6 Go ; elle augmente aussi le coût du cache." }
        c: { en: "Restarting the policy starts the acceleration again over the same files, which are still too large to be cached.", fr: "Redémarrer la stratégie relance l'accélération sur les mêmes fichiers, qui restent trop gros pour être mis en cache." }
        d: { en: "MaxAge lets queries use accelerated data that is slightly behind the source; it doesn't cache files that were never accelerated.", fr: "MaxAge permet aux requêtes d'utiliser des données accélérées légèrement en retard sur la source ; il ne met pas en cache des fichiers jamais accélérés." }
    references:
      - title: Query acceleration for OneLake shortcuts - overview
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/query-acceleration-overview

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-23-07
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have an eventstream named **ES-Line** that receives events from production lines. Its default stream feeds a Filter operator that removes test events, and the output of the Filter operator goes to a lakehouse destination named **LH-Raw**.

        You plan to add Stream Analytics query logic to ES-Line. The logic must count the events of each line per minute and send the counts to an Activator item. LH-Raw must keep receiving the filtered events.

        Which two configurations are supported by ES-Line?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un flux d'événements nommé **ES-Line** qui reçoit les événements de lignes de production. Son flux par défaut alimente un opérateur Filter qui supprime les événements de test, et la sortie de l'opérateur Filter va vers une destination lakehouse nommée **LH-Raw**.

        Vous prévoyez d'ajouter à ES-Line une logique de requête Stream Analytics. Cette logique doit compter les événements de chaque ligne par minute et envoyer les comptages à un élément Activator. LH-Raw doit continuer de recevoir les événements filtrés.

        Quelles sont les deux configurations prises en charge par ES-Line ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Connect the output of the Filter operator to a SQL operator that computes the counts.", fr: "Connecter la sortie de l'opérateur Filter à un opérateur SQL qui calcule les comptages." } }
        - { id: b, text: { en: "Connect the default stream to a SQL operator that computes the counts.", fr: "Connecter le flux par défaut à un opérateur SQL qui calcule les comptages." } }
        - { id: c, text: { en: "Connect a first SQL operator that removes test events to a second SQL operator that computes the counts.", fr: "Connecter un premier opérateur SQL qui supprime les événements de test à un second opérateur SQL qui calcule les comptages." } }
        - { id: d, text: { en: "Send the output of the SQL operator to a new Activator destination node.", fr: "Envoyer la sortie de l'opérateur SQL vers un nouveau nœud de destination Activator." } }
        - { id: e, text: { en: "Send the output of the SQL operator to a Manage fields operator that renames the count field.", fr: "Envoyer la sortie de l'opérateur SQL vers un opérateur Manage fields qui renomme le champ de comptage." } }
      choose: 2
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The SQL operator centralizes the transformation logic of its path: it can't be used with other built-in operators in the same processing path, and SQL operators can't be chained. It can read the default stream directly (its query can filter the test events itself) and supports every Real-Time Intelligence destination, including Activator, through new destination nodes.
        fr: |
          L'opérateur SQL centralise la logique de transformation de son chemin : il ne peut pas être utilisé avec d'autres opérateurs intégrés sur le même chemin de traitement, et les opérateurs SQL ne peuvent pas être chaînés. Il peut lire directement le flux par défaut (sa requête peut elle-même filtrer les événements de test) et prend en charge toutes les destinations Real-Time Intelligence, dont Activator, par de nouveaux nœuds de destination.
      options:
        a: { en: "Placing the SQL operator after the Filter operator puts it in the same processing path as a built-in operator, which isn't supported.", fr: "Placer l'opérateur SQL après l'opérateur Filter le met sur le même chemin de traitement qu'un opérateur intégré, ce qui n'est pas pris en charge." }
        c: { en: "Chaining several SQL operators in one path isn't supported; one SQL query can filter and count.", fr: "Chaîner plusieurs opérateurs SQL sur un même chemin n'est pas pris en charge ; une seule requête SQL peut filtrer et compter." }
        e: { en: "A built-in operator after the SQL operator is in the same path, which isn't supported; rename the field with AS in the query.", fr: "Un opérateur intégré après l'opérateur SQL est sur le même chemin, ce qui n'est pas pris en charge ; renommez le champ avec AS dans la requête." }
    references:
      - title: Process events by using a SQL operator
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/process-events-using-sql-code-editor

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-23-08
    objective: "2.3.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a Fabric warehouse named **DW-Retail** that contains a table named **dbo.DailyStoreSales** with the `StoreId`, `SalesDate` and `Amount` columns. The table has exactly one row per store and per day, with no missing day.

        You need a query that returns, for each row:
        - `PrevDayAmount`: the amount of the same store on the previous day.
        - `Moving7Day`: the total amount of the same store over the last seven days, including the current day.

        How should you complete the query? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un entrepôt Fabric nommé **DW-Retail** qui contient une table nommée **dbo.DailyStoreSales** avec les colonnes `StoreId`, `SalesDate` et `Amount`. La table a exactement une ligne par magasin et par jour, sans jour manquant.

        Vous avez besoin d'une requête qui renvoie, pour chaque ligne :
        - `PrevDayAmount` : le montant du même magasin la veille.
        - `Moving7Day` : le montant total du même magasin sur les sept derniers jours, jour courant inclus.

        Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: sql
      template: |
        SELECT StoreId, SalesDate, Amount,
            [[prev]] OVER (PARTITION BY StoreId ORDER BY SalesDate) AS PrevDayAmount,
            SUM(Amount) OVER ([[part]] ORDER BY SalesDate
                [[frame]]) AS Moving7Day
        FROM dbo.DailyStoreSales;
      slots:
        - id: prev
          options:
            - { id: lag1, text: "LAG(Amount, 1)" }
            - { id: lead1, text: "LEAD(Amount, 1)" }
            - { id: first, text: "FIRST_VALUE(Amount)" }
        - id: part
          options:
            - { id: date, text: "PARTITION BY SalesDate" }
            - { id: store, text: "PARTITION BY StoreId" }
            - { id: both, text: "PARTITION BY StoreId, SalesDate" }
        - id: frame
          options:
            - { id: r7, text: "ROWS BETWEEN 7 PRECEDING AND CURRENT ROW" }
            - { id: unb, text: "RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW" }
            - { id: r6, text: "ROWS BETWEEN 6 PRECEDING AND CURRENT ROW" }
            - { id: fol, text: "ROWS BETWEEN CURRENT ROW AND 6 FOLLOWING" }
    answer: { values: { prev: lag1, part: store, frame: r6 } }
    explanation:
      correct:
        en: |
          `LAG(Amount, 1)` returns the value of the previous row in the store's partition ordered by date, which is the previous day because no day is missing. The moving total must restart for each store (`PARTITION BY StoreId`), and seven days including the current one are the current row plus the six preceding rows: `ROWS BETWEEN 6 PRECEDING AND CURRENT ROW`.
        fr: |
          `LAG(Amount, 1)` renvoie la valeur de la ligne précédente dans la partition du magasin triée par date, c'est-à-dire la veille puisqu'aucun jour ne manque. Le total mobile doit repartir pour chaque magasin (`PARTITION BY StoreId`), et sept jours jour courant inclus correspondent à la ligne courante plus les six lignes précédentes : `ROWS BETWEEN 6 PRECEDING AND CURRENT ROW`.
      options:
        lead1: { en: "LEAD returns the next row, which is the following day, not the previous one.", fr: "LEAD renvoie la ligne suivante, c'est-à-dire le lendemain, pas la veille." }
        first: { en: "FIRST_VALUE returns the first row of the frame, which is the store's first day here, not the previous day.", fr: "FIRST_VALUE renvoie la première ligne du cadre, ici le premier jour du magasin, pas la veille." }
        date: { en: "Partitioning by date mixes all the stores of one day and never looks at previous days.", fr: "Partitionner par date mélange tous les magasins d'un jour et ne regarde jamais les jours précédents." }
        both: { en: "One row per store and day means each partition has a single row, so the total is just the current amount.", fr: "Une ligne par magasin et par jour : chaque partition n'a qu'une ligne, et le total se réduit au montant courant." }
        r7: { en: "Seven preceding rows plus the current row cover eight days.", fr: "Sept lignes précédentes plus la ligne courante couvrent huit jours." }
        unb: { en: "This frame, the default when ORDER BY is given without a frame, is a running total since the first day, not a seven-day total.", fr: "Ce cadre, utilisé par défaut quand ORDER BY est donné sans cadre, est un total cumulé depuis le premier jour, pas un total sur sept jours." }
        fol: { en: "This frame looks at the six following days instead of the previous ones.", fr: "Ce cadre regarde les six jours suivants au lieu des précédents." }
    references:
      - title: SELECT - OVER clause (Transact-SQL)
        url: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql?view=fabric

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-23-09
    objective: "2.3.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a Fabric lakehouse named **LH-IoT**. A Spark job definition runs two structured streaming queries on a streaming DataFrame named `events` that reads an Azure event hub. Each event has the `DeviceId` and `EventTime` columns. The first query writes the raw events to a table named **bronze_events** with the checkpoint `Files/checkpoints/bronze_events`. The second writes cleaned events to **silver_events** with the checkpoint `Files/checkpoints/silver_events`.

        You add a third query to the job. It must maintain a Delta table named **device_totals** that always contains exactly one row per device, with the number of events of the device since the stream started, refreshed at each micro-batch.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un lakehouse Fabric nommé **LH-IoT**. Une définition de travail Spark exécute deux requêtes de streaming structuré sur un DataFrame de streaming nommé `events` qui lit un hub d'événements Azure. Chaque événement a les colonnes `DeviceId` et `EventTime`. La première requête écrit les événements bruts dans une table nommée **bronze_events** avec le point de contrôle `Files/checkpoints/bronze_events`. La deuxième écrit les événements nettoyés dans **silver_events** avec le point de contrôle `Files/checkpoints/silver_events`.

        Vous ajoutez une troisième requête au travail. Elle doit maintenir une table Delta nommée **device_totals** qui contient toujours exactement une ligne par appareil, avec le nombre d'événements de l'appareil depuis le démarrage du flux, actualisée à chaque micro-lot.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        totals = (events
            .[[grp]]
            .count())

        (totals.writeStream
            .format("delta")
            .outputMode("[[mode]]")
            .option("checkpointLocation", "[[chk]]")
            .toTable("device_totals"))
      slots:
        - id: grp
          options:
            - { id: dev, text: "groupBy(\"DeviceId\")" }
            - { id: day, text: "groupBy(F.window(\"EventTime\", \"1 day\"), \"DeviceId\")" }
            - { id: ses, text: "groupBy(F.session_window(\"EventTime\", \"30 minutes\"), \"DeviceId\")" }
        - id: mode
          options:
            - { id: append, text: append }
            - { id: update, text: update }
            - { id: complete, text: complete }
        - id: chk
          options:
            - { id: bronze, text: Files/checkpoints/bronze_events }
            - { id: totals, text: Files/checkpoints/device_totals }
            - { id: silver, text: Files/checkpoints/silver_events }
    answer: { values: { grp: dev, mode: complete, chk: totals } }
    explanation:
      correct:
        en: |
          A count since the start of the stream is an aggregation by `DeviceId` alone, without a time window. Complete mode writes the whole result of the aggregation at each trigger, so the Delta table holds exactly one up-to-date row per device. Each streaming query needs its own checkpoint location.
        fr: |
          Un comptage depuis le démarrage du flux est une agrégation par `DeviceId` seul, sans fenêtre de temps. Le mode complete écrit tout le résultat de l'agrégation à chaque déclenchement : la table Delta contient donc exactement une ligne à jour par appareil. Chaque requête de streaming a besoin de son propre emplacement de point de contrôle.
      options:
        day: { en: "A one-day window produces one row per device and per day, not one total per device since the start.", fr: "Une fenêtre d'un jour produit une ligne par appareil et par jour, pas un total par appareil depuis le démarrage." }
        ses: { en: "A session window produces one row per device session, not one row per device.", fr: "Une fenêtre de session produit une ligne par session d'appareil, pas une ligne par appareil." }
        append: { en: "Append mode emits only rows that will never change; a running count without a window and watermark never becomes final.", fr: "Le mode append n'émet que des lignes qui ne changeront plus ; un comptage sans fenêtre ni filigrane ne devient jamais définitif." }
        update: { en: "Update mode emits only the rows that changed; Delta tables don't support it as a streaming sink, and appending changed rows would duplicate devices.", fr: "Le mode update n'émet que les lignes modifiées ; les tables Delta ne le prennent pas en charge comme récepteur de streaming, et ajouter les lignes modifiées dupliquerait les appareils." }
        bronze: { en: "This checkpoint belongs to the bronze query; two queries must never share a checkpoint.", fr: "Ce point de contrôle appartient à la requête bronze ; deux requêtes ne doivent jamais partager un point de contrôle." }
        silver: { en: "This checkpoint belongs to the silver query; two queries must never share a checkpoint.", fr: "Ce point de contrôle appartient à la requête silver ; deux requêtes ne doivent jamais partager un point de contrôle." }
    references:
      - title: Select an output mode for Structured Streaming
        url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/output-mode
      - title: Data streaming into a lakehouse with Spark
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-streaming-data

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-23-10
    objective: "2.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric eventhouse that contains a KQL database named **DB-Plant**. An eventstream ingests raw machine events into a table named **RawEvents**. The database has the following update policies:
        - On a table named **Parsed**: source RawEvents, function `ParseEvents()`, `IsTransactional` set to `true`.
        - On a table named **Alerts**: source Parsed, function `DetectAlerts()`, `IsTransactional` set to `false`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un eventhouse Fabric qui contient une base de données KQL nommée **DB-Plant**. Un flux d'événements ingère des événements bruts de machines dans une table nommée **RawEvents**. La base de données a les stratégies de mise à jour suivantes :
        - Sur une table nommée **Parsed** : source RawEvents, fonction `ParseEvents()`, `IsTransactional` défini à `true`.
        - Sur une table nommée **Alerts** : source Parsed, fonction `DetectAlerts()`, `IsTransactional` défini à `false`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The rows that the Parsed update policy writes into Parsed are processed by the Alerts update policy."
            fr: "Les lignes que la stratégie de mise à jour de Parsed écrit dans Parsed sont traitées par la stratégie de mise à jour d'Alerts."
        - id: s2
          text:
            en: "If DetectAlerts() fails on a batch, the rows of that batch are also missing from Parsed."
            fr: "Si DetectAlerts() échoue sur un lot, les lignes de ce lot manquent aussi dans Parsed."
        - id: s3
          text:
            en: "You can set the soft-delete period of the retention policy of Parsed to 0s and keep the Alerts update policy non-transactional."
            fr: "Vous pouvez définir à 0s la période de suppression réversible de la stratégie de rétention de Parsed et garder non transactionnelle la stratégie de mise à jour d'Alerts."
    answer: { values: { s1: true, s2: false, s3: false } }
    explanation:
      correct:
        en: |
          Update policies can cascade: data that a policy writes into Parsed is an ingestion into Parsed, which triggers the policy of Alerts (each table in the chain receives the data once). The Alerts policy is non-transactional, so its failure leaves the data in its source, Parsed, and only Alerts misses it. A source table with a soft-delete period of 0s requires every update policy that reads it to be transactional, so the Alerts policy would have to change.
        fr: |
          Les stratégies de mise à jour peuvent s'enchaîner : les données qu'une stratégie écrit dans Parsed sont une ingestion dans Parsed, qui déclenche la stratégie d'Alerts (chaque table de la chaîne reçoit les données une fois). La stratégie d'Alerts est non transactionnelle : son échec laisse les données dans sa source, Parsed, et seule Alerts les manque. Une table source dont la période de suppression réversible vaut 0s exige que toutes les stratégies de mise à jour qui la lisent soient transactionnelles ; la stratégie d'Alerts devrait donc changer.
      options:
        s2: { en: "Only a transactional policy makes the ingestion into its source fail; the Alerts policy is non-transactional.", fr: "Seule une stratégie transactionnelle fait échouer l'ingestion dans sa source ; la stratégie d'Alerts est non transactionnelle." }
        s3: { en: "With a 0s soft-delete period on Parsed, the Alerts policy must have IsTransactional set to true.", fr: "Avec une période de suppression réversible de 0s sur Parsed, la stratégie d'Alerts doit avoir IsTransactional à true." }
    references:
      - title: Update policy overview
        url: https://learn.microsoft.com/en-us/kusto/management/update-policy?view=microsoft-fabric
