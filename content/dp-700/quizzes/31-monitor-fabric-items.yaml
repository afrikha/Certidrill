chapter: 31-monitor-fabric-items
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-31-01
    objective: "3.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a warehouse named **DW-Sales**. Nightly T-SQL procedures transform its staging tables.

        You need to list the slowest transformation queries of the last weeks, ranked by execution time, with queries of the same shape grouped together.

        Which view should you query?
      fr: |
        Vous disposez d'un entrepôt nommé **DW-Sales**. Des procédures T-SQL nocturnes transforment ses tables de préparation.

        Vous devez lister les requêtes de transformation les plus lentes des dernières semaines, classées par durée d'exécution, en regroupant les requêtes de même forme.

        Quelle vue devez-vous interroger ?
    body:
      options:
        - { id: a, text: "`queryinsights.frequently_run_queries`" }
        - { id: b, text: "`queryinsights.exec_sessions_history`" }
        - { id: c, text: "`queryinsights.long_running_queries`" }
        - { id: d, text: "`queryinsights.sql_pool_insights`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `long_running_queries` returns the queries by execution time, and query insights groups queries that have the same shape (the same `query_hash`) even when their predicates differ. It covers the completed queries of the last 30 days.
        fr: |
          `long_running_queries` renvoie les requêtes selon leur durée d'exécution, et les informations sur les requêtes regroupent les requêtes de même forme (même `query_hash`), même quand leurs prédicats diffèrent. La vue couvre les requêtes terminées des 30 derniers jours.
      options:
        a: { en: "frequently_run_queries ranks the query shapes by how often they run, not by how long they take.", fr: "frequently_run_queries classe les formes de requêtes selon leur fréquence d'exécution, pas selon leur durée." }
        b: { en: "exec_sessions_history describes completed sessions, not the duration of each query shape.", fr: "exec_sessions_history décrit les sessions terminées, pas la durée de chaque forme de requête." }
        d: { en: "sql_pool_insights describes the warehouse pools as a whole, not the execution time of each query shape.", fr: "sql_pool_insights décrit les pools de l'entrepôt dans leur ensemble, pas la durée d'exécution de chaque forme de requête." }
    references:
      - title: Query Insights in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-31-02
    objective: "3.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Direct Lake semantic model named **SM-Gold** over the Delta tables of a lakehouse. A pipeline refreshes SM-Gold after each load, and the refresh history shows that each refresh completes in a few seconds.

        What does the refresh of SM-Gold do?
      fr: |
        Vous disposez d'un modèle sémantique Direct Lake nommé **SM-Gold** sur les tables Delta d'un lakehouse. Un pipeline actualise SM-Gold après chaque chargement, et l'historique d'actualisation montre que chaque actualisation se termine en quelques secondes.

        Que fait l'actualisation de SM-Gold ?
    body:
      options:
        - { id: a, text: { en: "It copies the rows added to the Delta tables since the previous refresh into the model.", fr: "Elle copie dans le modèle les lignes ajoutées aux tables Delta depuis l'actualisation précédente." } }
        - { id: b, text: { en: "It updates the model metadata so that it references the latest version of the Delta tables.", fr: "Elle met à jour les métadonnées du modèle pour qu'il référence la dernière version des tables Delta." } }
        - { id: c, text: { en: "It runs the queries of the reports against the SQL analytics endpoint to refresh their cache.", fr: "Elle exécute les requêtes des rapports sur le point de terminaison d'analytique SQL pour actualiser leur cache." } }
        - { id: d, text: { en: "It compacts the Parquet files of the Delta tables so that they stay within the guardrails.", fr: "Elle compacte les fichiers Parquet des tables Delta pour qu'ils restent dans les garde-fous." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Direct Lake refresh is framing: it analyzes the metadata of the latest version of the Delta tables and updates the model's references to the latest files in OneLake. Only metadata is copied, which is why it takes seconds and costs little, unlike an import refresh.
        fr: |
          Une actualisation Direct Lake est un framing (cadrage) : elle analyse les métadonnées de la dernière version des tables Delta et met à jour les références du modèle vers les derniers fichiers de OneLake. Seules des métadonnées sont copiées ; c'est pourquoi elle prend quelques secondes et coûte peu, contrairement à une actualisation en mode import.
      options:
        a: { en: "Copying data into the model is what an import refresh does; Direct Lake reads the Delta files directly.", fr: "Copier des données dans le modèle est le rôle d'une actualisation en mode import ; Direct Lake lit directement les fichiers Delta." }
        c: { en: "Framing doesn't run report queries; Direct Lake uses the SQL analytics endpoint only when a Direct Lake on SQL model falls back to DirectQuery.", fr: "Le framing n'exécute pas de requêtes de rapports ; Direct Lake n'utilise le point de terminaison d'analytique SQL que quand un modèle Direct Lake sur SQL bascule en DirectQuery." }
        d: { en: "A refresh never rewrites the Delta tables; compacting files is table maintenance, such as OPTIMIZE.", fr: "Une actualisation ne réécrit jamais les tables Delta ; compacter les fichiers relève de la maintenance de table, comme OPTIMIZE." }
    references:
      - title: Direct Lake overview
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-31-03
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a pipeline named **PL-Finance** that runs four activities in sequence: Copy_Rates, Copy_Invoices, NB_Convert and Copy_Publish. Last night's run succeeded, but Copy_Invoices copied an incomplete source file. The source file has been replaced.

        You need to run Copy_Invoices and the activities after it again from the legacy Monitoring hub. Copy_Rates must not run again, and PL-Finance must not be modified.

        What should you do?
      fr: |
        Vous disposez d'un pipeline nommé **PL-Finance** qui exécute quatre activités en séquence : Copy_Rates, Copy_Invoices, NB_Convert et Copy_Publish. L'exécution de la nuit dernière a réussi, mais Copy_Invoices a copié un fichier source incomplet. Le fichier source a été remplacé.

        Vous devez exécuter de nouveau Copy_Invoices et les activités qui la suivent depuis l'ancien hub de surveillance. Copy_Rates ne doit pas être réexécutée, et PL-Finance ne doit pas être modifié.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the run detail page of last night's run, rerun the pipeline from the failed activity.", fr: "Dans la page de détail de l'exécution de la nuit dernière, relancer le pipeline à partir de l'activité en échec." } }
        - { id: b, text: { en: "In the list of runs, hover over last night's run and select the Retry icon.", fr: "Dans la liste des exécutions, survoler l'exécution de la nuit dernière et sélectionner l'icône Retry." } }
        - { id: c, text: { en: "In the run detail page of last night's run, select Copy_Invoices and rerun from the selected activity.", fr: "Dans la page de détail de l'exécution de la nuit dernière, sélectionner Copy_Invoices et relancer à partir de l'activité sélectionnée." } }
        - { id: d, text: { en: "In the pipeline editor, deactivate Copy_Rates and run PL-Finance, then activate Copy_Rates again.", fr: "Dans l'éditeur de pipeline, désactiver Copy_Rates et exécuter PL-Finance, puis réactiver Copy_Rates." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In the pipeline run detail view, you can rerun a pipeline from the failed activity or from a selected activity. Selecting Copy_Invoices reruns it and the activities after it, while Copy_Rates, which comes before it, isn't run again.
        fr: |
          Dans la vue de détail d'une exécution de pipeline, vous pouvez relancer le pipeline à partir de l'activité en échec ou à partir d'une activité sélectionnée. Sélectionner Copy_Invoices la relance avec les activités qui la suivent, sans réexécuter Copy_Rates, qui la précède.
      options:
        a: { en: "The run succeeded, so it has no failed activity to start from.", fr: "L'exécution a réussi : elle n'a aucune activité en échec à partir de laquelle repartir." }
        b: { en: "Retry reruns the whole pipeline, including Copy_Rates.", fr: "Retry relance tout le pipeline, y compris Copy_Rates." }
        d: { en: "Deactivating an activity changes the pipeline, which the requirement forbids, and it isn't done from the Monitoring hub.", fr: "Désactiver une activité modifie le pipeline, ce que l'exigence interdit, et cela ne se fait pas depuis le hub de surveillance." }
    references:
      - title: Browse pipeline runs in the Monitoring hub
        url: https://learn.microsoft.com/en-us/fabric/data-factory/monitoring-hub-pipeline-runs

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-31-04
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have an eventstream named **ES-Orders** that has an Azure Event Hubs source and a lakehouse destination named **LH-Orders**. On the **Data insights** tab, the LH-Orders node shows 120 **Runtime errors** during the last hour.

        You need to read the error messages logged by the eventstream engine to find the cause. What should you use?
      fr: |
        Vous disposez d'un flux d'événements nommé **ES-Orders** qui a une source Azure Event Hubs et une destination lakehouse nommée **LH-Orders**. Dans l'onglet **Data insights**, le nœud LH-Orders affiche 120 **Runtime errors** pendant la dernière heure.

        Vous devez lire les messages d'erreur journalisés par le moteur du flux d'événements pour trouver la cause. Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "The Data insights tab of the eventstream node of ES-Orders", fr: "L'onglet Data insights du nœud de flux d'événements d'ES-Orders" } }
        - { id: b, text: { en: "The `.show ingestion failures` command in a KQL queryset", fr: "La commande `.show ingestion failures` dans un ensemble de requêtes KQL" } }
        - { id: c, text: { en: "The Recent runs pane of the LH-Orders lakehouse", fr: "Le volet Recent runs du lakehouse LH-Orders" } }
        - { id: d, text: { en: "The Runtime logs tab of ES-Orders, filtered on the Error level", fr: "L'onglet Runtime logs d'ES-Orders, filtré sur le niveau Error" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Runtime logs tab shows the detailed logs of the eventstream engine, at the warning, error and information levels, and lets you filter them by severity or keyword. It explains the errors that Data insights only counts.
        fr: |
          L'onglet Runtime logs affiche les journaux détaillés du moteur du flux d'événements, aux niveaux avertissement, erreur et information, et permet de les filtrer par gravité ou par mot-clé. Il explique les erreurs que Data insights se contente de compter.
      options:
        a: { en: "The eventstream node only charts message and byte counts (IncomingMessages, OutgoingMessages...), without error messages.", fr: "Le nœud de flux d'événements ne trace que des nombres de messages et d'octets (IncomingMessages, OutgoingMessages...), sans messages d'erreur." }
        b: { en: "`.show ingestion failures` lists the ingestion failures of a KQL database; the destination here is a lakehouse.", fr: "`.show ingestion failures` liste les échecs d'ingestion d'une base de données KQL ; la destination est ici un lakehouse." }
        c: { en: "The runs of a lakehouse are its own jobs, such as table maintenance; they don't hold the eventstream engine logs.", fr: "Les exécutions d'un lakehouse sont ses propres tâches, comme la maintenance de table ; elles ne contiennent pas les journaux du moteur du flux d'événements." }
    references:
      - title: Monitor the status and performance of an eventstream
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/event-streams/monitor

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-31-05
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Dataflow Gen2 named **DF-Customers** that is refreshed four times a day, every day. A data engineer has the Viewer role on the workspace and opens **Recent runs** for DF-Customers.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un Dataflow Gen2 nommé **DF-Customers** qui est actualisé quatre fois par jour, tous les jours. Un ingénieur de données a le rôle Viewer sur l'espace de travail et ouvre **Recent runs** pour DF-Customers.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The refreshes of 10 days ago are listed on the refresh history page."
            fr: "Les actualisations d'il y a 10 jours sont listées dans la page d'historique des actualisations."
        - id: s2
          text:
            en: "The refreshes of 20 days ago are listed on the refresh history page."
            fr: "Les actualisations d'il y a 20 jours sont listées dans la page d'historique des actualisations."
        - id: s3
          text:
            en: "The data engineer can download the detailed logs of a refresh of 10 days ago."
            fr: "L'ingénieur de données peut télécharger les journaux détaillés d'une actualisation d'il y a 10 jours."
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          The refresh history page shows up to 50 refreshes or six months, whichever comes first. At four refreshes a day, 50 refreshes cover about 12 days: the refreshes of 10 days ago are listed, those of 20 days ago aren't. Detailed logs remain available for up to 28 days and need at least the Viewer role.
        fr: |
          La page d'historique des actualisations affiche jusqu'à 50 actualisations ou six mois, selon la première limite atteinte. À quatre actualisations par jour, 50 actualisations couvrent environ 12 jours : les actualisations d'il y a 10 jours sont listées, celles d'il y a 20 jours ne le sont pas. Les journaux détaillés restent disponibles jusqu'à 28 jours et demandent au moins le rôle Viewer.
      options:
        s2: { en: "Twenty days of four refreshes a day is about 80 refreshes ago, beyond the 50 refreshes the page shows.", fr: "Vingt jours à quatre actualisations par jour remontent à environ 80 actualisations, au-delà des 50 que la page affiche." }
    references:
      - title: View refresh history and monitor your dataflows
        url: https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-monitor

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-31-06
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has a warehouse named **DW-Finance**. Every morning between 08:00 and 09:00, T-SQL procedures that transform the ledger data run much slower than at night, although their code and data volumes are unchanged. Many report queries run at the same time.

        You need to determine, by querying DW-Finance, whether the warehouse was under resource pressure during those periods, so that you can correlate the pressure with the slow procedures. The solution must minimize effort.

        What should you query?
      fr: |
        Adatum dispose d'un entrepôt nommé **DW-Finance**. Chaque matin entre 08:00 et 09:00, les procédures T-SQL qui transforment les données comptables s'exécutent beaucoup plus lentement que la nuit, alors que leur code et les volumes de données n'ont pas changé. De nombreuses requêtes de rapports s'exécutent au même moment.

        Vous devez déterminer, en interrogeant DW-Finance, si l'entrepôt était soumis à une pression sur ses ressources pendant ces périodes, afin de mettre cette pression en relation avec les procédures lentes. La solution doit réduire l'effort au minimum.

        Que devez-vous interroger ?
    body:
      options:
        - { id: a, text: "`queryinsights.long_running_queries`" }
        - { id: b, text: "`queryinsights.frequently_run_queries`" }
        - { id: c, text: "`queryinsights.exec_sessions_history`" }
        - { id: d, text: "`queryinsights.sql_pool_insights`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `sql_pool_insights` returns pool-level metrics of the warehouse: resource allocation, configuration changes and pressure indicators. It answers whether the SQL pool was under pressure during query execution and lets you correlate pressure events with slow-running queries.
        fr: |
          `sql_pool_insights` renvoie des métriques de l'entrepôt au niveau des pools : allocation des ressources, changements de configuration et indicateurs de pression. Elle indique si le pool SQL était sous pression pendant l'exécution des requêtes et permet de relier les événements de pression aux requêtes lentes.
      options:
        a: { en: "long_running_queries confirms that the procedures are slow, which is already known, but it doesn't show whether the pool was under pressure.", fr: "long_running_queries confirme que les procédures sont lentes, ce que l'on sait déjà, mais n'indique pas si le pool était sous pression." }
        b: { en: "frequently_run_queries shows which query shapes run most often; it can't tell whether resources were under pressure.", fr: "frequently_run_queries montre les formes de requêtes les plus souvent exécutées ; elle ne dit pas si les ressources étaient sous pression." }
        c: { en: "exec_sessions_history lists completed sessions; it has no pressure indicators.", fr: "exec_sessions_history liste les sessions terminées ; elle n'a pas d'indicateurs de pression." }
    references:
      - title: Query Insights in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-31-07
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has a lakehouse named **LH-Web** and a semantic model named **SM-Web** whose tables use the Direct Lake on SQL storage mode, with fallback to DirectQuery allowed. A new streaming job now appends thousands of small Parquet files to a table named clicks every day.

        Since last week, the refresh of SM-Web completes with a warning instead of a success, and the report pages that use clicks have become much slower. The other pages are unchanged.

        What is the most likely cause?
      fr: |
        Contoso dispose d'un lakehouse nommé **LH-Web** et d'un modèle sémantique nommé **SM-Web** dont les tables utilisent le mode de stockage Direct Lake sur SQL, avec le repli vers DirectQuery autorisé. Un nouveau travail de streaming ajoute désormais chaque jour des milliers de petits fichiers Parquet à une table nommée clicks.

        Depuis la semaine dernière, l'actualisation de SM-Web se termine avec un avertissement au lieu d'une réussite, et les pages de rapport qui utilisent clicks sont devenues beaucoup plus lentes. Les autres pages n'ont pas changé.

        Quelle est la cause la plus probable ?
    body:
      options:
        - { id: a, text: { en: "The Query Cache phase of the refresh fails, so the report pages that use clicks no longer use cached results.", fr: "La phase Query Cache de l'actualisation échoue : les pages de rapport qui utilisent clicks n'utilisent plus de résultats en cache." } }
        - { id: b, text: { en: "The clicks table exceeds a guardrail of the capacity, so queries on clicks fall back to DirectQuery.", fr: "La table clicks dépasse un garde-fou de la capacité : les requêtes sur clicks basculent en DirectQuery." } }
        - { id: c, text: { en: "The refresh now copies the rows of clicks into the model, which exceeds the memory of the capacity.", fr: "L'actualisation copie désormais les lignes de clicks dans le modèle, ce qui dépasse la mémoire de la capacité." } }
        - { id: d, text: { en: "The automatic updates of SM-Web are turned off, so the model still points to an old version of clicks.", fr: "Les mises à jour automatiques de SM-Web sont désactivées : le modèle pointe toujours vers une ancienne version de clicks." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When a table exceeds the guardrails of the SKU (for example the number of Parquet files), a Direct Lake on SQL model falls back to DirectQuery if fallback is allowed. The refresh succeeds with a warning and queries still return results, but slower, which matches the symptoms limited to clicks. A Direct Lake on OneLake model would fail its refresh instead.
        fr: |
          Quand une table dépasse les garde-fous de la SKU (par exemple le nombre de fichiers Parquet), un modèle Direct Lake sur SQL bascule en DirectQuery si le repli est autorisé. L'actualisation réussit avec un avertissement et les requêtes renvoient toujours des résultats, mais plus lentement, ce qui correspond aux symptômes limités à clicks. Un modèle Direct Lake sur OneLake ferait échouer son actualisation à la place.
      options:
        a: { en: "The Query Cache phase concerns premium query caches and dashboard tiles; it wouldn't slow only the pages that use one table, and the queries would still run in Direct Lake.", fr: "La phase Query Cache concerne les caches de requêtes premium et les vignettes de tableau de bord ; elle ne ralentirait pas seulement les pages qui utilisent une table, et les requêtes s'exécuteraient toujours en Direct Lake." }
        c: { en: "A Direct Lake refresh is framing: it copies only metadata, never the rows of the Delta tables.", fr: "Une actualisation Direct Lake est un framing : elle ne copie que des métadonnées, jamais les lignes des tables Delta." }
        d: { en: "A model pointing to an old version shows stale data, but the queries wouldn't become slower and the refresh wouldn't raise a warning.", fr: "Un modèle qui pointe vers une ancienne version affiche des données périmées, mais les requêtes ne ralentiraient pas et l'actualisation ne lèverait pas d'avertissement." }
    references:
      - title: Direct Lake overview
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/direct-lake-overview

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-31-08
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware has two warehouses named **DW-Sales** and **DW-Finance** in a workspace named **WS-BI**. A transformation procedure runs while connected to DW-Sales; it reads a table of DW-Finance by using a cross-database query and loads the result into DW-Sales. The procedure runs every hour with a different date range in its `WHERE` clause.

        An auditor has the Viewer role on WS-BI. You plan to analyze the procedure by using query insights.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose de deux entrepôts nommés **DW-Sales** et **DW-Finance** dans un espace de travail nommé **WS-BI**. Une procédure de transformation s'exécute en étant connectée à DW-Sales ; elle lit une table de DW-Finance par une requête entre bases de données et charge le résultat dans DW-Sales. La procédure s'exécute toutes les heures avec une plage de dates différente dans sa clause `WHERE`.

        Un auditeur a le rôle Viewer sur WS-BI. Vous prévoyez d'analyser la procédure en utilisant les informations sur les requêtes (query insights).

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "The cross-database query of the procedure appears in the query insights of DW-Finance."
            fr: "La requête entre bases de données de la procédure apparaît dans les informations sur les requêtes de DW-Finance."
        - id: s2
          text:
            en: "The hourly executions of the query have the same query_hash, even though their date ranges differ."
            fr: "Les exécutions horaires de la requête ont le même query_hash, bien que leurs plages de dates diffèrent."
        - id: s3
          text:
            en: "The auditor can query the queryinsights views of DW-Sales to review the executions."
            fr: "L'auditeur peut interroger les vues queryinsights de DW-Sales pour examiner les exécutions."
    answer: { values: { s1: false, s2: true, s3: false } }
    explanation:
      correct:
        en: |
          A cross-database query appears in the query insights of the warehouse you were connected to, here DW-Sales, not in the other warehouse. Query insights considers queries with the same shape as the same query even if their predicates differ, and the `query_hash` column groups them. Access to query insights requires Contributor or higher, so a Viewer can't use it.
        fr: |
          Une requête entre bases de données apparaît dans les informations sur les requêtes de l'entrepôt auquel vous étiez connecté, ici DW-Sales, et non dans l'autre entrepôt. Les informations sur les requêtes considèrent comme identiques les requêtes de même forme, même si leurs prédicats diffèrent, et la colonne `query_hash` les regroupe. L'accès aux informations sur les requêtes demande le rôle Contributor ou supérieur ; un Viewer ne peut donc pas les utiliser.
      options:
        s1: { en: "The query is recorded once, in the warehouse of the connection: DW-Sales.", fr: "La requête est enregistrée une seule fois, dans l'entrepôt de la connexion : DW-Sales." }
        s3: { en: "Query insights needs at least the Contributor role on the workspace.", fr: "Les informations sur les requêtes demandent au moins le rôle Contributor sur l'espace de travail." }
    references:
      - title: Query Insights in Fabric Data Warehouse
        url: https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-31-09
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin has a workspace that contains a notebook named **NB-Score**. NB-Score runs on a schedule every night, and data scientists also start it manually during the day.

        The ML team must receive a Teams message each time a run of NB-Score fails and each time a run succeeds, whether the run was scheduled or started manually. The solution must not require changing NB-Score.

        What should you do?
      fr: |
        Tailspin dispose d'un espace de travail qui contient un notebook nommé **NB-Score**. NB-Score s'exécute selon une planification chaque nuit, et les scientifiques des données le lancent aussi manuellement dans la journée.

        L'équipe ML doit recevoir un message Teams chaque fois qu'une exécution de NB-Score échoue et chaque fois qu'une exécution réussit, que l'exécution soit planifiée ou lancée manuellement. La solution ne doit pas demander de modifier NB-Score.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Configure the failure notifications in the schedule of NB-Score, and add the ML team as recipients.", fr: "Configurer les notifications d'échec dans la planification de NB-Score, et ajouter l'équipe ML comme destinataire." } }
        - { id: b, text: { en: "Create a pipeline that runs NB-Score, with Teams activities on its Upon Success and Upon Failure paths.", fr: "Créer un pipeline qui exécute NB-Score, avec des activités Teams sur ses chemins Upon Success et Upon Failure." } }
        - { id: c, text: { en: "In the Real-Time hub, set an alert on the Job events of NB-Score, with a Teams action.", fr: "Dans le hub Real-Time, définir une alerte sur les événements Job de NB-Score, avec une action Teams." } }
        - { id: d, text: { en: "Create an Activator rule on the eventstream that receives the results of NB-Score, with a Teams action.", fr: "Créer une règle Activator sur le flux d'événements qui reçoit les résultats de NB-Score, avec une action Teams." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Fabric Job events in the Real-Time hub are raised for jobs triggered manually or on a schedule, including `ItemJobSucceeded` and `ItemJobFailed`. **Set alert** on these events creates an Activator rule that can send a Teams message, without touching NB-Score.
        fr: |
          Les événements Job de Fabric dans le hub Real-Time sont émis pour les tâches déclenchées manuellement ou par planification, dont `ItemJobSucceeded` et `ItemJobFailed`. **Set alert** sur ces événements crée une règle Activator qui peut envoyer un message Teams, sans toucher à NB-Score.
      options:
        a: { en: "Schedule failure notifications are emails sent only for failed scheduled runs: no manual runs, no successes, no Teams message.", fr: "Les notifications d'échec de planification sont des e-mails envoyés seulement pour les exécutions planifiées en échec : pas d'exécutions manuelles, pas de réussites, pas de message Teams." }
        b: { en: "The pipeline would notify only for the runs it starts itself; the manual runs of the data scientists wouldn't send any message.", fr: "Le pipeline ne notifierait que les exécutions qu'il lance lui-même ; les exécutions manuelles des scientifiques des données n'enverraient aucun message." }
        d: { en: "An eventstream carries the data produced by the scoring, not the status of the notebook runs; a failed run sends no result at all.", fr: "Un flux d'événements transporte les données produites par le scoring, pas le statut des exécutions du notebook ; une exécution en échec n'envoie aucun résultat." }
    references:
      - title: Explore Job events in Fabric Real-Time hub
        url: https://learn.microsoft.com/en-us/fabric/real-time-hub/explore-fabric-job-events

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-31-10
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind has an eventstream named **ES-ColdChain** that receives a reading every 30 seconds from the temperature sensor of each refrigerated shipment. Each event contains `shipmentId`, `truckId` and `tempC`. A truck carries up to 20 shipments.

        You create an Activator rule on ES-ColdChain. The quality team must receive one Teams message for a shipment when its temperature leaves the range from 2 to 8 °C. No other message may be sent while the temperature stays outside the range; a new message must be sent only if the temperature comes back into the range and leaves it again.

        How should you complete the rule? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'un flux d'événements nommé **ES-ColdChain** qui reçoit toutes les 30 secondes une mesure du capteur de température de chaque envoi réfrigéré. Chaque événement contient `shipmentId`, `truckId` et `tempC`. Un camion transporte jusqu'à 20 envois.

        Vous créez une règle Activator sur ES-ColdChain. L'équipe qualité doit recevoir un message Teams pour un envoi quand sa température sort de la plage de 2 à 8 °C. Aucun autre message ne doit être envoyé tant que la température reste hors de la plage ; un nouveau message ne doit être envoyé que si la température revient dans la plage puis en ressort.

        Comment devez-vous compléter la règle ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Group the events into objects by: [[obj]]
          Monitor: [[on]]
          Condition: [[cond]]
          Action: send a Teams message to the quality team
        fr: |
          Regrouper les événements en objets par : [[obj]]
          Surveiller : [[on]]
          Condition : [[cond]]
          Action : envoyer un message Teams à l'équipe qualité
      slots:
        - id: obj
          options:
            - { id: truck, text: truckId }
            - { id: ship, text: shipmentId }
            - { id: temp, text: tempC }
        - id: on
          options:
            - { id: events, text: { en: "each event that arrives on ES-ColdChain", fr: "chaque événement qui arrive sur ES-ColdChain" } }
            - { id: prop, text: { en: "the tempC property of each object", fr: "la propriété tempC de chaque objet" } }
        - id: cond
          options:
            - { id: inc, text: { en: "tempC INCREASES above 8", fr: "tempC INCREASES au-dessus de 8" } }
            - { id: exit, text: { en: "tempC EXIT RANGE 2 to 8", fr: "tempC EXIT RANGE de 2 à 8" } }
            - { id: dec, text: { en: "tempC DECREASES below 2", fr: "tempC DECREASES en dessous de 2" } }
            - { id: none, text: { en: "No presence of tempC data for 10 minutes", fr: "Absence de données tempC pendant 10 minutes" } }
    answer: { values: { obj: ship, on: prop, cond: exit } }
    explanation:
      correct:
        en: |
          The alert is per shipment, so the objects are identified by `shipmentId`. A rule on the tempC property keeps a state for each object, and a stateful `EXIT RANGE` condition catches both a value below 2 and a value above 8. Stateful rules fire only on entry into a new state, so the message isn't repeated while the shipment stays outside the range, and it fires again after the value returns into the range and leaves it.
        fr: |
          L'alerte est par envoi : les objets sont donc identifiés par `shipmentId`. Une règle sur la propriété tempC garde un état pour chaque objet, et une condition avec état `EXIT RANGE` détecte à la fois une valeur inférieure à 2 et une valeur supérieure à 8. Les règles avec état ne se déclenchent qu'à l'entrée dans un nouvel état : le message n'est pas répété tant que l'envoi reste hors de la plage, et il se déclenche de nouveau après un retour dans la plage suivi d'une nouvelle sortie.
      options:
        truck: { en: "Grouping by truck mixes up to 20 shipments in one object, so one shipment can hide the change of another.", fr: "Regrouper par camion mélange jusqu'à 20 envois dans un objet : un envoi peut masquer le changement d'un autre." }
        temp: { en: "The object ID identifies the monitored entity; a measured value isn't an ID.", fr: "L'ID d'objet identifie l'entité surveillée ; une valeur mesurée n'est pas un ID." }
        events: { en: "A rule on events fires for every event that meets the condition, so a message would be sent every 30 seconds while the shipment is out of range.", fr: "Une règle sur les événements se déclenche pour chaque événement qui remplit la condition : un message partirait toutes les 30 secondes tant que l'envoi est hors de la plage." }
        inc: { en: "INCREASES above 8 ignores a shipment that becomes too cold.", fr: "INCREASES au-dessus de 8 ignore un envoi qui devient trop froid." }
        dec: { en: "DECREASES below 2 ignores a shipment that becomes too warm.", fr: "DECREASES en dessous de 2 ignore un envoi qui devient trop chaud." }
        none: { en: "An absence-of-data rule detects a silent sensor (heartbeat), not a temperature outside the range.", fr: "Une règle d'absence de données détecte un capteur muet (pulsation), pas une température hors de la plage." }
    references:
      - title: Fabric Activator rules
        url: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/data-activator/activator-rules-overview
