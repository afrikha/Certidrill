chapter: 14-orchestration
questions:
  # ------------------------------------------------------------------ 1
  - id: dp700-qz-14-01
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan a Fabric item that runs other items and copy steps in a controlled order. The item must offer ForEach, If condition, Switch and Until activities that you configure on a canvas, without writing code.

        Which item should you use?
      fr: |
        Vous prévoyez un élément Fabric qui exécute d'autres éléments et des étapes de copie dans un ordre maîtrisé. L'élément doit proposer des activités ForEach, If condition, Switch et Until que vous configurez sur un canevas, sans écrire de code.

        Quel élément devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Dataflow Gen2 }
        - { id: b, text: { en: "Copy job", fr: "Travail de copie" } }
        - { id: c, text: Notebook }
        - { id: d, text: Pipeline }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A pipeline is the orchestration item of Fabric: its control flow activities (ForEach, If condition, Switch, Until, Wait, Fail, Invoke pipeline) are configured on the canvas with low-code expressions. It can run dataflows, notebooks, stored procedures and Copy data activities in sequence.
        fr: |
          Le pipeline est l'élément d'orchestration de Fabric : ses activités de flux de contrôle (ForEach, If condition, Switch, Until, Wait, Fail, Invoke pipeline) se configurent sur le canevas avec des expressions low-code. Il peut exécuter dans l'ordre des dataflows, des notebooks, des procédures stockées et des activités Copy data.
      options:
        a: { en: "A Dataflow Gen2 ingests and transforms data with Power Query; it has no control flow, only one refresh.", fr: "Un Dataflow Gen2 ingère et transforme des données avec Power Query ; il n'a aucun flux de contrôle, seulement une actualisation." }
        b: { en: "A copy job copies data, fully or incrementally, from a wizard; it doesn't orchestrate other items.", fr: "Un travail de copie copie des données, en totalité ou de façon incrémentielle, depuis un assistant ; il n'orchestre pas d'autres éléments." }
        c: { en: "A notebook can implement loops and conditions, but in Python code, not as activities on a canvas.", fr: "Un notebook peut implémenter des boucles et des conditions, mais en code Python, pas sous forme d'activités sur un canevas." }
    references:
      - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
      - title: If Condition activity
        url: https://learn.microsoft.com/en-us/fabric/data-factory/if-condition-activity

  # ------------------------------------------------------------------ 2
  - id: dp700-qz-14-02
    objective: "1.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric pipeline named PL_Files that has a trigger on OneLake events for the files created in a lakehouse folder. A Copy data activity of PL_Files must use the name of the file that started the run.

        You also want to test PL_Files by running it manually, without an error on this expression.

        Which expression should you use?
      fr: |
        Vous disposez d'un pipeline Fabric nommé PL_Files qui a un déclencheur sur les événements OneLake des fichiers créés dans un dossier d'un lakehouse. Une activité Copy data de PL_Files doit utiliser le nom du fichier qui a démarré l'exécution.

        Vous voulez aussi tester PL_Files en l'exécutant manuellement, sans erreur sur cette expression.

        Quelle expression devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "`@pipeline().TriggerEvent.FileName`" }
        - { id: b, text: "`@pipeline()?.TriggerEvent?.FileName`" }
        - { id: c, text: "`@triggerBody().fileName`" }
        - { id: d, text: "`@pipeline().parameters.FileName`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The trigger exposes the file and folder names as built-in parameters under `pipeline().TriggerEvent`. They're null when no file event started the run, as in a manual test, so the null-safe `?` operator returns null instead of failing.
        fr: |
          Le déclencheur expose les noms du fichier et du dossier comme paramètres intégrés sous `pipeline().TriggerEvent`. Ils sont null quand aucun événement de fichier n'a démarré l'exécution, comme lors d'un test manuel : l'opérateur `?` sans risque de null renvoie alors null au lieu d'échouer.
      options:
        a: { en: "This path returns the file name for triggered runs, but it fails during a manual run, where TriggerEvent is null.", fr: "Ce chemin renvoie le nom du fichier pour les exécutions déclenchées, mais il échoue lors d'une exécution manuelle, où TriggerEvent est null." }
        c: { en: "triggerBody() is the syntax of Azure Data Factory storage event triggers, not of Fabric pipeline triggers.", fr: "triggerBody() est la syntaxe des déclencheurs d'événements de stockage d'Azure Data Factory, pas des déclencheurs de pipeline Fabric." }
        d: { en: "The trigger doesn't fill a pipeline parameter named FileName; its values come from TriggerEvent.", fr: "Le déclencheur ne renseigne pas de paramètre de pipeline nommé FileName ; ses valeurs viennent de TriggerEvent." }
    references:
      - title: Run, schedule, or use events to trigger a pipeline
        url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs

  # ------------------------------------------------------------------ 3
  - id: dp700-qz-14-03
    objective: "1.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace that contains notebooks named NB_Main and NB_Clean. They use the same default lakehouse. NB_Main contains the following line.

        `result = notebookutils.notebook.run("NB_Clean")`

        One cell of NB_Clean runs for about four minutes. Each run of NB_Main fails on this line after about a minute and a half, while NB_Clean is still running. NB_Clean runs without error when started on its own.

        You need NB_Main to run NB_Clean to completion. What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient des notebooks nommés NB_Main et NB_Clean. Ils utilisent le même lakehouse par défaut. NB_Main contient la ligne suivante.

        `result = notebookutils.notebook.run("NB_Clean")`

        Une cellule de NB_Clean s'exécute pendant environ quatre minutes. Chaque exécution de NB_Main échoue sur cette ligne au bout d'une minute et demie environ, alors que NB_Clean est encore en cours d'exécution. NB_Clean s'exécute sans erreur quand il est lancé seul.

        Vous devez faire en sorte que NB_Main exécute NB_Clean jusqu'au bout. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a call to notebookutils.notebook.exit in the last cell of NB_Clean.", fr: "Ajouter un appel à notebookutils.notebook.exit dans la dernière cellule de NB_Clean." } }
        - { id: b, text: { en: "Pass a timeout of 600 seconds as the second argument of notebookutils.notebook.run.", fr: "Passer un délai d'expiration de 600 secondes comme deuxième argument de notebookutils.notebook.run." } }
        - { id: c, text: { en: "Replace the call with notebookutils.notebook.runMultiple and keep its default settings.", fr: "Remplacer l'appel par notebookutils.notebook.runMultiple en conservant ses paramètres par défaut." } }
        - { id: d, text: { en: "Turn on high concurrency mode for notebooks in the Spark settings of the workspace.", fr: "Activer le mode haute concurrence pour les notebooks dans les paramètres Spark de l'espace de travail." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The `timeout_seconds` argument of `notebookutils.notebook.run` defaults to 90 seconds, so a child that runs for four minutes always times out. Passing a larger value, such as 600, as the second argument lets NB_Clean finish.
        fr: |
          L'argument `timeout_seconds` de `notebookutils.notebook.run` vaut 90 secondes par défaut : un enfant qui s'exécute pendant quatre minutes expire donc toujours. Passer une valeur plus grande, comme 600, en deuxième argument permet à NB_Clean de se terminer.
      options:
        a: { en: "exit() sets the value that run() returns; it doesn't change the timeout of the call.", fr: "exit() définit la valeur que renvoie run() ; il ne modifie pas le délai d'expiration de l'appel." }
        c: { en: "runMultiple applies a default timeout of 90 seconds per cell (timeoutPerCellInSeconds), so the four-minute cell would still time out.", fr: "runMultiple applique par défaut un délai de 90 secondes par cellule (timeoutPerCellInSeconds) : la cellule de quatre minutes expirerait donc encore." }
        d: { en: "High concurrency mode shares Spark sessions between notebooks; it doesn't extend the timeout of a run() call.", fr: "Le mode haute concurrence partage des sessions Spark entre notebooks ; il ne prolonge pas le délai d'expiration d'un appel run()." }
    references:
      - title: NotebookUtils notebook run and orchestration for Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-engineering/notebookutils/notebookutils-notebook-run

  # ------------------------------------------------------------------ 4
  - id: dp700-qz-14-04
    objective: "1.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric workspace named Workspace1 that contains a pipeline named PL_Meters. PL_Meters has no schedule.

        PL_Meters must run every day at 00:00, 02:00, 04:00 and every two hours after that, until 22:00, in the UTC time zone, starting next Monday. The solution must minimize the number of schedules to create and maintain.

        What should you do?
      fr: |
        Vous disposez d'un espace de travail Fabric nommé Workspace1 qui contient un pipeline nommé PL_Meters. PL_Meters n'a aucune planification.

        PL_Meters doit s'exécuter chaque jour à 00:00, 02:00, 04:00 puis toutes les deux heures, jusqu'à 22:00, dans le fuseau horaire UTC, à partir de lundi prochain. La solution doit réduire au minimum le nombre de planifications à créer et à maintenir.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add one daily schedule that lists the 12 run times.", fr: "Ajouter une planification quotidienne qui liste les 12 heures d'exécution." } }
        - { id: b, text: { en: "Add two daily schedules that list six run times each.", fr: "Ajouter deux planifications quotidiennes qui listent chacune six heures d'exécution." } }
        - { id: c, text: { en: "Add one hourly schedule that repeats every 2 hours from 00:00.", fr: "Ajouter une planification horaire qui se répète toutes les 2 heures à partir de 00:00." } }
        - { id: d, text: { en: "Add 12 daily schedules that each run at one of the times.", fr: "Ajouter 12 planifications quotidiennes qui s'exécutent chacune à l'une des heures." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An hourly schedule repeats every 1 to 72 hours from its start time, so one schedule with an interval of 2 hours, starting at 00:00, produces the 12 daily runs. Like every Fabric schedule, it needs an end date, which can be a distant one.
        fr: |
          Une planification horaire se répète toutes les 1 à 72 heures à partir de son heure de début : une seule planification avec un intervalle de 2 heures, qui commence à 00:00, produit donc les 12 exécutions quotidiennes. Comme toute planification Fabric, elle exige une date de fin, qui peut être lointaine.
      options:
        a: { en: "A daily schedule accepts at most 10 run times per day, so it can't list 12.", fr: "Une planification quotidienne accepte au plus 10 heures d'exécution par jour : elle ne peut pas en lister 12." }
        b: { en: "Two daily schedules work, but they're one more schedule than needed.", fr: "Deux planifications quotidiennes fonctionnent, mais c'est une planification de plus que nécessaire." }
        d: { en: "Twelve daily schedules produce the runs, but they multiply the schedules to create and maintain.", fr: "Douze planifications quotidiennes produisent les exécutions, mais elles multiplient les planifications à créer et à maintenir." }
    references:
      - title: Job Scheduler in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
      - title: Run, schedule, or use events to trigger a pipeline
        url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs

  # ------------------------------------------------------------------ 5
  - id: dp700-qz-14-05
    objective: "1.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        You have a Fabric pipeline named PL_Publish. Its first activity is a Lookup activity named CheckRows, with First row only selected, that returns the number of rows of a staging table in a column named Cnt.

        When Cnt is 0, the run of PL_Publish must stop immediately with the Failed status and show the error code NODATA and a custom message in the run history. Otherwise, the next activities must run.

        What should you add after CheckRows?
      fr: |
        Vous disposez d'un pipeline Fabric nommé PL_Publish. Sa première activité est une activité Lookup nommée CheckRows, avec First row only sélectionné, qui renvoie le nombre de lignes d'une table intermédiaire dans une colonne nommée Cnt.

        Quand Cnt vaut 0, l'exécution de PL_Publish doit s'arrêter immédiatement avec le statut Failed et afficher le code d'erreur NODATA et un message personnalisé dans l'historique des exécutions. Sinon, les activités suivantes doivent s'exécuter.

        Que devez-vous ajouter après CheckRows ?
    body:
      options:
        - { id: a, text: { en: "A Fail activity linked to CheckRows by an On failure dependency", fr: "Une activité Fail reliée à CheckRows par une dépendance On failure" } }
        - { id: b, text: { en: "An If condition activity on Cnt, with a Fail activity in its True activities", fr: "Une activité If condition sur Cnt, avec une activité Fail dans ses activités True" } }
        - { id: c, text: { en: "An If condition activity on Cnt, with a Teams activity in its True activities", fr: "Une activité If condition sur Cnt, avec une activité Teams dans ses activités True" } }
        - { id: d, text: { en: "An Until activity that repeats CheckRows until Cnt is greater than 0", fr: "Une activité Until qui répète CheckRows jusqu'à ce que Cnt soit supérieur à 0" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The If condition activity evaluates a Boolean expression such as `@equals(activity('CheckRows').output.firstRow.Cnt, 0)`. In its True branch, the Fail activity ends the run as failed with the error code and message that you set, which appear in the run history.
        fr: |
          L'activité If condition évalue une expression booléenne comme `@equals(activity('CheckRows').output.firstRow.Cnt, 0)`. Dans sa branche True, l'activité Fail termine l'exécution en échec avec le code d'erreur et le message que vous définissez, qui apparaissent dans l'historique des exécutions.
      options:
        a: { en: "CheckRows succeeds when it returns 0, so an activity on its On failure path never runs.", fr: "CheckRows réussit quand il renvoie 0 : une activité sur son chemin On failure ne s'exécute donc jamais." }
        c: { en: "A Teams activity posts a message, but the run doesn't fail and shows no error code.", fr: "Une activité Teams publie un message, mais l'exécution n'échoue pas et n'affiche aucun code d'erreur." }
        d: { en: "Until waits for rows to arrive instead of stopping the run with a failure.", fr: "Until attend l'arrivée de lignes au lieu d'arrêter l'exécution en échec." }
    references:
      - title: Fail activity
        url: https://learn.microsoft.com/en-us/fabric/data-factory/fail-activity
      - title: If Condition activity
        url: https://learn.microsoft.com/en-us/fabric/data-factory/if-condition-activity

  # ------------------------------------------------------------------ 6
  - id: dp700-qz-14-06
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has a Fabric workspace named Workspace1 that contains a lakehouse named LH_Geo. Every hour, the addresses added to the dbo.NewCustomers table of LH_Geo must be geocoded by an open-source Python library from PyPI, and the results must be written to a Delta table.

        The data engineers write Python. When an hourly run fails, the members of a Microsoft Entra group named GeoOps must receive an email. The process is never started manually.

        You need to implement the process. The solution must minimize the number of items to create and maintain.

        What should you do?
      fr: |
        Woodgrove dispose d'un espace de travail Fabric nommé Workspace1 qui contient un lakehouse nommé LH_Geo. Toutes les heures, les adresses ajoutées à la table dbo.NewCustomers de LH_Geo doivent être géocodées par une bibliothèque Python open source de PyPI, et les résultats doivent être écrits dans une table Delta.

        Les ingénieurs de données écrivent du Python. Quand une exécution horaire échoue, les membres d'un groupe Microsoft Entra nommé GeoOps doivent recevoir un e-mail. Le traitement n'est jamais lancé manuellement.

        Vous devez mettre en œuvre ce traitement. La solution doit réduire au minimum le nombre d'éléments à créer et à maintenir.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a Dataflow Gen2 that geocodes the addresses, and give it an hourly schedule with GeoOps in the failure notifications.", fr: "Créer un Dataflow Gen2 qui géocode les adresses, et lui donner une planification horaire avec GeoOps dans les notifications d'échec." } }
        - { id: b, text: { en: "Create a pipeline whose Copy data activity geocodes the addresses, and give it an hourly schedule with GeoOps in the failure notifications.", fr: "Créer un pipeline dont l'activité Copy data géocode les adresses, et lui donner une planification horaire avec GeoOps dans les notifications d'échec." } }
        - { id: c, text: { en: "Create a notebook that geocodes the addresses, and a pipeline that runs it every hour and emails GeoOps from an Office 365 Outlook activity on failure.", fr: "Créer un notebook qui géocode les adresses, et un pipeline qui l'exécute toutes les heures et envoie un e-mail à GeoOps depuis une activité Office 365 Outlook en cas d'échec." } }
        - { id: d, text: { en: "Create a notebook that geocodes the addresses, and give it an hourly schedule with GeoOps in the failure notifications.", fr: "Créer un notebook qui géocode les adresses, et lui donner une planification horaire avec GeoOps dans les notifications d'échec." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Calling an open-source Python library and writing Delta tables is notebook work. A notebook uses the Fabric job scheduler directly, and the failure notifications of its schedule email users or groups when a scheduled run fails, which covers every run here. One item meets all the requirements.
        fr: |
          Appeler une bibliothèque Python open source et écrire des tables Delta relève du notebook. Un notebook utilise directement le planificateur de travaux Fabric, et les notifications d'échec de sa planification envoient un e-mail à des utilisateurs ou des groupes quand une exécution planifiée échoue, ce qui couvre ici toutes les exécutions. Un seul élément répond à toutes les exigences.
      options:
        a: { en: "Dataflow Gen2 transforms data with Power Query and can't call a Python library from PyPI.", fr: "Dataflow Gen2 transforme les données avec Power Query et ne peut pas appeler une bibliothèque Python de PyPI." }
        b: { en: "A Copy data activity performs only light transformations, such as type conversion and column mapping; it can't run Python code.", fr: "Une activité Copy data n'effectue que des transformations légères, comme la conversion de types et le mappage de colonnes ; elle ne peut pas exécuter de code Python." }
        c: { en: "This design works, but it adds a pipeline to maintain; the notebook's own schedule already sends failure emails for scheduled runs.", fr: "Cette conception fonctionne, mais elle ajoute un pipeline à maintenir ; la planification du notebook envoie déjà des e-mails d'échec pour les exécutions planifiées." }
    references:
      - title: "Microsoft Fabric decision guide: copy activity, Copy job, dataflow, Eventstream, or Spark"
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/decision-guide-pipeline-dataflow-spark
      - title: Job Scheduler in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler

  # ------------------------------------------------------------------ 7
  - id: dp700-qz-14-07
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        You have a Fabric workspace named WS-Dev that is connected to a Git repository and assigned to the Development stage of a deployment pipeline. WS-Dev contains a pipeline named PL1 that has one weekly schedule.

        User3 has the Viewer role in WS-Dev. You have the Contributor role in WS-Dev.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric nommé WS-Dev, connecté à un dépôt Git et attribué à l'étape Development d'un pipeline de déploiement. WS-Dev contient un pipeline nommé PL1 qui a une planification hebdomadaire.

        User3 a le rôle Viewer dans WS-Dev. Vous avez le rôle Contributor dans WS-Dev.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When you add a trigger on Azure Blob Storage events to PL1 from its Home tab, an Activator (Reflex) item and an eventstream are created in WS-Dev.", fr: "Quand vous ajoutez à PL1, depuis son onglet Home, un déclencheur sur les événements de Stockage Blob Azure, un élément Activator (Reflex) et un flux d'événements sont créés dans WS-Dev." }
        - id: s2
          text: { en: "User3 can add a daily schedule to PL1 next to the weekly one.", fr: "User3 peut ajouter à PL1 une planification quotidienne à côté de la planification hebdomadaire." }
        - id: s3
          text: { en: "When PL1 is deployed to the Test stage, its weekly schedule is deployed with it.", fr: "Quand PL1 est déployé vers l'étape Test, sa planification hebdomadaire est déployée avec lui." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          An event trigger is an Activator (Reflex) rule fed by a new eventstream, both created in the workspace. Creating or changing schedules requires the Contributor role or Write on the item; Viewers only see them. Schedules are part of the item definition: deployment pipelines carry them, and Git stores them in a `.schedules` file.
        fr: |
          Un déclencheur d'événement est une règle Activator (Reflex) alimentée par un nouveau flux d'événements, tous deux créés dans l'espace de travail. Créer ou modifier des planifications exige le rôle Contributor ou Write sur l'élément ; les Viewers ne font que les voir. Les planifications font partie de la définition de l'élément : les pipelines de déploiement les emportent, et Git les stocke dans un fichier `.schedules`.
      options:
        s2: { en: "A Viewer can see the schedules of PL1 but can't create or modify them.", fr: "Un Viewer peut voir les planifications de PL1 mais ne peut ni en créer ni en modifier." }
    references:
      - title: Job Scheduler in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/job-scheduler
      - title: Run, schedule, or use events to trigger a pipeline
        url: https://learn.microsoft.com/en-us/fabric/data-factory/pipeline-runs

  # ------------------------------------------------------------------ 8
  - id: dp700-qz-14-08
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has two Fabric workspaces named WS-Ops and WS-Common. WS-Common contains a pipeline named PL_Validate that has a String parameter named TableName. WS-Ops contains a pipeline named PL_Master and has a workspace identity. The tenant setting **Service principals can call Fabric public APIs** is enabled.

        PL_Master must run PL_Validate and pass it a table name. Each run of PL_Validate must appear as a child run in the monitoring of PL_Master. The call must authenticate with the workspace identity of WS-Ops. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Contoso dispose de deux espaces de travail Fabric nommés WS-Ops et WS-Common. WS-Common contient un pipeline nommé PL_Validate qui a un paramètre String nommé TableName. WS-Ops contient un pipeline nommé PL_Master et dispose d'une identité d'espace de travail. Le paramètre du locataire **Service principals can call Fabric public APIs** est activé.

        PL_Master doit exécuter PL_Validate et lui passer un nom de table. Chaque exécution de PL_Validate doit apparaître comme exécution enfant dans la supervision de PL_Master. L'appel doit s'authentifier avec l'identité d'espace de travail de WS-Ops. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add an Invoke pipeline (Legacy) activity that calls PL_Validate, and give the identity of WS-Ops the Contributor role in WS-Common.", fr: "Ajouter une activité Invoke pipeline (Legacy) qui appelle PL_Validate, et donner à l'identité de WS-Ops le rôle Contributor dans WS-Common." } }
        - { id: b, text: { en: "Add an Invoke pipeline activity that calls PL_Validate through a workspace identity connection, and give the identity of WS-Ops the Viewer role in WS-Common.", fr: "Ajouter une activité Invoke pipeline qui appelle PL_Validate via une connexion d'identité d'espace de travail, et donner à l'identité de WS-Ops le rôle Viewer dans WS-Common." } }
        - { id: c, text: { en: "Add an Invoke pipeline activity that calls PL_Validate through a workspace identity connection, and give the identity of WS-Ops the Contributor role in WS-Common.", fr: "Ajouter une activité Invoke pipeline qui appelle PL_Validate via une connexion d'identité d'espace de travail, et donner à l'identité de WS-Ops le rôle Contributor dans WS-Common." } }
        - { id: d, text: { en: "Add a trigger to PL_Validate on the job events of PL_Master, and read TableName from the trigger parameters.", fr: "Ajouter à PL_Validate un déclencheur sur les événements de travail de PL_Master, et lire TableName dans les paramètres du déclencheur." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The current Invoke pipeline activity calls pipelines in other workspaces through a connection (organizational account, service principal or workspace identity), passes parameters and shows child runs in monitoring. When the child pipeline is in another workspace, the workspace identity needs at least the Contributor role there, because running a pipeline requires Contributor.
        fr: |
          L'activité Invoke pipeline actuelle appelle des pipelines d'autres espaces de travail via une connexion (compte professionnel, principal de service ou identité d'espace de travail), passe des paramètres et affiche les exécutions enfants dans la supervision. Quand le pipeline enfant est dans un autre espace de travail, l'identité d'espace de travail a besoin au moins du rôle Contributor dans celui-ci, car l'exécution d'un pipeline exige Contributor.
      options:
        a: { en: "The legacy activity calls only pipelines of the same workspace, and only the parent run is monitored.", fr: "L'activité héritée n'appelle que des pipelines du même espace de travail, et seule l'exécution parente est supervisée." }
        b: { en: "Viewer can't run pipelines; the identity needs at least Contributor on the workspace of the child pipeline.", fr: "Viewer ne peut pas exécuter de pipelines ; l'identité a besoin au moins de Contributor sur l'espace de travail du pipeline enfant." }
        d: { en: "A job event trigger starts PL_Validate after a run of PL_Master ends, as a separate run that isn't a child of PL_Master and gets no table name from it.", fr: "Un déclencheur sur événement de travail démarre PL_Validate après la fin d'une exécution de PL_Master, comme une exécution distincte qui n'est pas enfant de PL_Master et n'en reçoit aucun nom de table." }
    references:
      - title: Invoke pipeline activity
        url: https://learn.microsoft.com/en-us/fabric/data-factory/invoke-pipeline-activity
      - title: Roles in workspaces in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces

  # ------------------------------------------------------------------ 9
  - id: dp700-qz-14-09
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        You have a Fabric workspace that contains a notebook named NB_Load and a pipeline named PL_Daily. PL_Daily runs NB_Load by using a Notebook activity. In the Base parameters of the activity, a String parameter receives the value `@formatDateTime(pipeline().TriggerTime, 'yyyy-MM-dd')`.

        In NB_Load, the first cell contains `load_date = "2026-01-01"`, and the other cells filter the source data on load_date. Every run of PL_Daily succeeds but loads the data of 2026-01-01.

        Which two issues could cause this behavior?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un espace de travail Fabric qui contient un notebook nommé NB_Load et un pipeline nommé PL_Daily. PL_Daily exécute NB_Load au moyen d'une activité Notebook. Dans les Base parameters de l'activité, un paramètre String reçoit la valeur `@formatDateTime(pipeline().TriggerTime, 'yyyy-MM-dd')`.

        Dans NB_Load, la première cellule contient `load_date = "2026-01-01"`, et les autres cellules filtrent les données sources sur load_date. Chaque exécution de PL_Daily réussit mais charge les données du 2026-01-01.

        Quels sont les deux problèmes qui pourraient provoquer ce comportement ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The first cell of NB_Load isn't marked as the parameter cell.", fr: "La première cellule de NB_Load n'est pas marquée comme cellule de paramètres." } }
        - { id: b, text: { en: "The Notebook activity has no session tag.", fr: "L'activité Notebook n'a aucune balise de session." } }
        - { id: c, text: { en: "The base parameter is named LoadDate, while the notebook variable is named load_date.", fr: "Le paramètre de base est nommé LoadDate, alors que la variable du notebook est nommée load_date." } }
        - { id: d, text: { en: "NB_Load calls notebookutils.notebook.exit inside a try/except block.", fr: "NB_Load appelle notebookutils.notebook.exit dans un bloc try/except." } }
        - { id: e, text: { en: "The value uses a single expression instead of string interpolation with @{...}.", fr: "La valeur utilise une expression unique au lieu de l'interpolation de chaîne avec @{...}." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A Notebook activity overrides only the variables defined in the cell marked as the parameter cell; without that cell, no parameter is passed and the default stays. A base parameter whose name differs from the variable, Python names being case-sensitive, creates another variable and leaves load_date at its default.
        fr: |
          Une activité Notebook ne remplace que les variables définies dans la cellule marquée comme cellule de paramètres ; sans cette cellule, aucun paramètre n'est transmis et la valeur par défaut reste. Un paramètre de base dont le nom diffère de la variable, les noms Python respectant la casse, crée une autre variable et laisse load_date à sa valeur par défaut.
      options:
        b: { en: "A session tag only lets Notebook activities share a Spark session; it has no effect on parameters.", fr: "Une balise de session permet seulement aux activités Notebook de partager une session Spark ; elle n'a aucun effet sur les paramètres." }
        d: { en: "An exit() call inside try/except affects the value returned to the pipeline, not the parameters received by the notebook.", fr: "Un appel à exit() dans un bloc try/except affecte la valeur renvoyée au pipeline, pas les paramètres reçus par le notebook." }
        e: { en: "formatDateTime already returns a string, so the single expression passes the same date as an interpolated value would.", fr: "formatDateTime renvoie déjà une chaîne : l'expression unique transmet donc la même date qu'une valeur interpolée." }
    references:
      - title: Transform data by running a notebook
        url: https://learn.microsoft.com/en-us/fabric/data-factory/notebook-activity
      - title: Expressions and functions for Data Factory in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/expression-language

  # ------------------------------------------------------------------ 10
  - id: dp700-qz-14-10
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        You have a Fabric pipeline named PL_Export that has the following parameters:

        - BatchSize, of type Int, with the value 42
        - Region, of type String, with the value emea

        You enter the values shown in the answer area in properties of the activities of PL_Export.

        What does each value return at run time? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous disposez d'un pipeline Fabric nommé PL_Export qui a les paramètres suivants :

        - BatchSize, de type Int, avec la valeur 42
        - Region, de type String, avec la valeur emea

        Vous saisissez les valeurs présentées dans la zone de réponse dans des propriétés des activités de PL_Export.

        Que renvoie chaque valeur à l'exécution ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          `@pipeline().parameters.BatchSize` returns [[v1]].

          `@{pipeline().parameters.BatchSize}` returns [[v2]].

          `Files/@pipeline().parameters.Region/` returns [[v3]].

          `Region: @@{pipeline().parameters.Region}` returns [[v4]].
        fr: |
          `@pipeline().parameters.BatchSize` renvoie [[v1]].

          `@{pipeline().parameters.BatchSize}` renvoie [[v2]].

          `Files/@pipeline().parameters.Region/` renvoie [[v3]].

          `Region: @@{pipeline().parameters.Region}` renvoie [[v4]].
      slots:
        - id: v1
          options:
            - { id: num, text: { en: "the number 42", fr: "le nombre 42" } }
            - { id: str, text: { en: "the string \"42\"", fr: "la chaîne « 42 »" } }
            - { id: lit, text: { en: "the text of the expression, unevaluated", fr: "le texte de l'expression, non évalué" } }
        - id: v2
          options:
            - { id: num, text: { en: "the number 42", fr: "le nombre 42" } }
            - { id: str, text: { en: "the string \"42\"", fr: "la chaîne « 42 »" } }
            - { id: lit, text: { en: "the text of the expression, unevaluated", fr: "le texte de l'expression, non évalué" } }
        - id: v3
          options:
            - { id: eval, text: "`Files/emea/`" }
            - { id: lit, text: "`Files/@pipeline().parameters.Region/`" }
            - { id: err, text: { en: "a validation error", fr: "une erreur de validation" } }
        - id: v4
          options:
            - { id: eval, text: "`Region: emea`" }
            - { id: lit, text: "`Region: @{pipeline().parameters.Region}`" }
            - { id: at, text: "`Region: @emea`" }
    answer:
      values: { v1: num, v2: str, v3: lit, v4: lit }
    explanation:
      correct:
        en: |
          When the whole value is one expression that starts with `@`, its type is kept, so BatchSize stays a number. String interpolation with `@{...}` always returns a string. A value that doesn't start with `@` and contains no `@{...}` is literal text, so the Region reference in the middle of the path isn't evaluated. `@@` escapes the at sign, so `@@{...}` returns the literal characters `@{...}`.
        fr: |
          Quand la valeur entière est une seule expression qui commence par `@`, son type est conservé : BatchSize reste donc un nombre. L'interpolation de chaîne avec `@{...}` renvoie toujours une chaîne. Une valeur qui ne commence pas par `@` et ne contient aucun `@{...}` est du texte littéral : la référence à Region au milieu du chemin n'est donc pas évaluée. `@@` échappe l'arobase : `@@{...}` renvoie donc les caractères littéraux `@{...}`.
      options:
        eval: { en: "Files/emea/ needs interpolation: Files/@{pipeline().parameters.Region}/. Region: emea needs a single @ before the braces.", fr: "Files/emea/ exige l'interpolation : Files/@{pipeline().parameters.Region}/. Region: emea exige un seul @ avant les accolades." }
    references:
      - title: Expressions and functions for Data Factory in Microsoft Fabric
        url: https://learn.microsoft.com/en-us/fabric/data-factory/expression-language
