id: dp700-sr1-marketing-columns
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has a Fabric workspace named **WS-Sales** that contains a warehouse named **DW1**. DW1 contains several tables, including a table named **dbo.Customers** that has the following columns: CustomerID, CustomerName, City, Segment, Email, and Phone.

    A Microsoft Entra group named **Marketing** has no role in WS-Sales. DW1 is shared with Marketing with the **Read** permission only, without any additional permission.

    You need to ensure that the members of Marketing can query the **CustomerID**, **City**, and **Segment** columns of dbo.Customers. Marketing must not be able to read or infer the values of any other column of dbo.Customers, and must not be able to query any other table in DW1.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient un entrepôt nommé **DW1**. DW1 contient plusieurs tables, dont une table nommée **dbo.Customers** qui comporte les colonnes suivantes : CustomerID, CustomerName, City, Segment, Email et Phone.

    Un groupe Microsoft Entra nommé **Marketing** n'a aucun rôle dans WS-Sales. DW1 est partagé avec Marketing avec l'autorisation **Read** uniquement, sans aucune autorisation supplémentaire.

    Vous devez faire en sorte que les membres de Marketing puissent interroger les colonnes **CustomerID**, **City** et **Segment** de dbo.Customers. Marketing ne doit pouvoir ni lire ni déduire les valeurs des autres colonnes de dbo.Customers, et ne doit pouvoir interroger aucune autre table de DW1.
