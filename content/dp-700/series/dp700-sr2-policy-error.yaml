id: dp700-sr2-policy-error
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has a Fabric eventhouse that contains a KQL database named **PlantDB**. A pipeline named **PL-Readings** runs every 15 minutes and uses a Copy activity to load CSV files into a PlantDB table named **RawReadings**. A table named **Readings** has an update policy that uses RawReadings as its source and calls a stored function named **ParseReadings()**. The update policy uses the default settings.

    Yesterday, a developer modified ParseReadings() so that it returns an additional column. Since then, Readings has received no new rows, while RawReadings still receives new rows and every run of PL-Readings succeeds.

    You need to identify the error raised by the update policy.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose d'un eventhouse Fabric qui contient une base de données KQL nommée **PlantDB**. Un pipeline nommé **PL-Readings** s'exécute toutes les 15 minutes et utilise une activité Copy pour charger des fichiers CSV dans une table de PlantDB nommée **RawReadings**. Une table nommée **Readings** a une stratégie de mise à jour qui utilise RawReadings comme source et appelle une fonction stockée nommée **ParseReadings()**. La stratégie de mise à jour utilise les paramètres par défaut.

    Hier, un développeur a modifié ParseReadings() pour qu'elle retourne une colonne supplémentaire. Depuis, Readings ne reçoit plus de nouvelles lignes, alors que RawReadings reçoit toujours de nouvelles lignes et que toutes les exécutions de PL-Readings réussissent.

    Vous devez identifier l'erreur générée par la stratégie de mise à jour.
