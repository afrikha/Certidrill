id: dp700-sr2-region-schedules
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has a Fabric workspace named **WS-Sales** that contains a pipeline named **PL-Refresh**. PL-Refresh has a string parameter named **Region** whose default value is **EU**. The activities of PL-Refresh load the sales of the region passed in Region.

    You need to ensure that PL-Refresh runs automatically:

    - Every day at 06:00 Paris time, with Region set to **EU**.
    - Every day at 14:00 New York time, with Region set to **US**.

    You must not create another pipeline or modify the activities of PL-Refresh.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un espace de travail Fabric nommé **WS-Sales** qui contient un pipeline nommé **PL-Refresh**. PL-Refresh a un paramètre de type chaîne nommé **Region** dont la valeur par défaut est **EU**. Les activités de PL-Refresh chargent les ventes de la région passée dans Region.

    Vous devez faire en sorte que PL-Refresh s'exécute automatiquement :

    - Tous les jours à 06:00, heure de Paris, avec Region défini sur **EU**.
    - Tous les jours à 14:00, heure de New York, avec Region défini sur **US**.

    Vous ne devez pas créer d'autre pipeline ni modifier les activités de PL-Refresh.
