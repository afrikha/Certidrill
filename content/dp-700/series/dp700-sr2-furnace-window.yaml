id: dp700-sr2-furnace-window
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum has a Fabric eventstream named **ES-Furnaces** that receives temperature readings from industrial furnaces. Each event contains the fields furnaceId, temperature and readingTime. readingTime is the time at which the sensor took the reading. Because of the plant network, events can reach ES-Furnaces up to two minutes after their readingTime.

    You add a SQL operator to ES-Furnaces. The input of the operator is named **FurnaceInput** and its output is named **FurnaceAvg**. The late arrival threshold in the advanced settings of the operator is set to five minutes. The query starts with the following clause:

    ```text
    SELECT furnaceId, AVG(temperature) AS avgTemp, System.Timestamp() AS windowEnd
    INTO FurnaceAvg
    ```

    You need to complete the query so that, every minute, FurnaceAvg receives for each furnace the average temperature of the readings taken during the previous five minutes.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum dispose d'un flux d'événements Fabric nommé **ES-Furnaces** qui reçoit les relevés de température de fours industriels. Chaque événement contient les champs furnaceId, temperature et readingTime. readingTime est l'heure à laquelle le capteur a effectué le relevé. En raison du réseau de l'usine, les événements peuvent arriver dans ES-Furnaces jusqu'à deux minutes après leur readingTime.

    Vous ajoutez un opérateur SQL à ES-Furnaces. L'entrée de l'opérateur est nommée **FurnaceInput** et sa sortie **FurnaceAvg**. Le seuil d'arrivée tardive des paramètres avancés de l'opérateur est défini sur cinq minutes. La requête commence par la clause suivante :

    ```text
    SELECT furnaceId, AVG(temperature) AS avgTemp, System.Timestamp() AS windowEnd
    INTO FurnaceAvg
    ```

    Vous devez compléter la requête pour que, chaque minute, FurnaceAvg reçoive pour chaque four la température moyenne des relevés effectués pendant les cinq minutes précédentes.
