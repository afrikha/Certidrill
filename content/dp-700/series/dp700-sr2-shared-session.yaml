id: dp700-sr2-shared-session
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has a Fabric workspace named **WS-ETL** that contains two lakehouses named **LH-Bronze** and **LH-Silver**, and a pipeline named **PL-Nightly**. PL-Nightly runs four Notebook activities in sequence:

    - **NB-Ingest** and **NB-Clean** have LH-Bronze as their default lakehouse.
    - **NB-Conform** and **NB-Publish** have LH-Silver as their default lakehouse.

    PL-Nightly is always run by the same user, and the four notebooks use the same environment and the same Spark compute configuration. Today, each Notebook activity starts its own Spark session, and the session start-up time accounts for most of the run time.

    You need to ensure that the four notebooks run in a single Spark session. You can modify the notebooks, the pipeline and the workspace settings.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un espace de travail Fabric nommé **WS-ETL** qui contient deux lakehouses nommés **LH-Bronze** et **LH-Silver**, ainsi qu'un pipeline nommé **PL-Nightly**. PL-Nightly exécute quatre activités Notebook en séquence :

    - **NB-Ingest** et **NB-Clean** ont LH-Bronze comme lakehouse par défaut.
    - **NB-Conform** et **NB-Publish** ont LH-Silver comme lakehouse par défaut.

    PL-Nightly est toujours exécuté par le même utilisateur, et les quatre notebooks utilisent le même environnement et la même configuration de calcul Spark. Aujourd'hui, chaque activité Notebook démarre sa propre session Spark, et le temps de démarrage des sessions représente l'essentiel de la durée d'exécution.

    Vous devez faire en sorte que les quatre notebooks s'exécutent dans une seule session Spark. Vous pouvez modifier les notebooks, le pipeline et les paramètres de l'espace de travail.
