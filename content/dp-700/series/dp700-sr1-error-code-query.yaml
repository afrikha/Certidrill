id: dp700-sr1-error-code-query
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a Fabric eventhouse that contains a KQL database named **OpsDB**. OpsDB contains a table named **AppLogs** that holds several billion rows, with the following columns: Timestamp (datetime), ServerId (string), and Message (string).

    Error codes have the format **E** followed by four digits, are always uppercase, and appear in Message as separate words delimited by spaces. A dashboard tile runs the following query, which is too slow:

    ```kusto
    AppLogs
    | where Message contains "E4012"
    | where Timestamp > ago(1h)
    | project Timestamp, ServerId, Message
    ```

    You need to reduce the execution time of the query. The query must keep returning exactly the same rows.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un eventhouse Fabric qui contient une base de données KQL nommée **OpsDB**. OpsDB contient une table nommée **AppLogs** de plusieurs milliards de lignes, avec les colonnes suivantes : Timestamp (datetime), ServerId (string) et Message (string).

    Les codes d'erreur ont le format **E** suivi de quatre chiffres, sont toujours en majuscules et apparaissent dans Message sous forme de mots distincts séparés par des espaces. Une vignette de tableau de bord exécute la requête suivante, qui est trop lente :

    ```kusto
    AppLogs
    | where Message contains "E4012"
    | where Timestamp > ago(1h)
    | project Timestamp, ServerId, Message
    ```

    Vous devez réduire le temps d'exécution de la requête. La requête doit continuer à renvoyer exactement les mêmes lignes.
