id: dp700-sr1-reference-join
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has a Fabric workspace named **WS-Plant** that contains an eventhouse named **EH1** and a lakehouse named **LH-Ref**. EH1 contains a KQL database named **KDB1**. An eventstream ingests machine telemetry into a native KDB1 table named **Telemetry**, which has Timestamp and DeviceId columns.

    LH-Ref contains a Delta table named **dim_device** of about 20,000 rows, keyed on DeviceId. A notebook overwrites dim_device once a day, at an unpredictable time.

    Analysts run a few ad hoc KQL queries each week that join Telemetry with dim_device. You need to meet the following requirements:

    - The queries must use the latest version of dim_device as soon as the notebook has written it.
    - No copy of the dim_device data, including indexed or cached data, may be stored in EH1.
    - Development effort must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'un espace de travail Fabric nommé **WS-Plant** qui contient un eventhouse nommé **EH1** et un lakehouse nommé **LH-Ref**. EH1 contient une base de données KQL nommée **KDB1**. Un flux d'événements ingère la télémétrie des machines dans une table native de KDB1 nommée **Telemetry**, qui comporte les colonnes Timestamp et DeviceId.

    LH-Ref contient une table Delta nommée **dim_device** d'environ 20 000 lignes, dont la clé est DeviceId. Un notebook remplace dim_device une fois par jour, à une heure imprévisible.

    Les analystes exécutent chaque semaine quelques requêtes KQL ad hoc qui joignent Telemetry à dim_device. Vous devez respecter les exigences suivantes :

    - Les requêtes doivent utiliser la dernière version de dim_device dès que le notebook l'a écrite.
    - Aucune copie des données de dim_device, y compris des données indexées ou mises en cache, ne doit être stockée dans EH1.
    - L'effort de développement doit être réduit au minimum.
