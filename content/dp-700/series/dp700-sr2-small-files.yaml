id: dp700-sr2-small-files
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a Fabric lakehouse named **LH-Events** that contains an unpartitioned Delta table named **device_events**. A Spark job definition runs a structured streaming query that appends a micro-batch to device_events every minute.

    Queries on device_events from the SQL analytics endpoint have become slow. You discover that the table consists of tens of thousands of small Parquet files.

    You need to compact the existing small files of device_events and ensure that the small files written by the stream from now on are also compacted. The solution must not add a scheduled job, a pipeline or a notebook.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un lakehouse Fabric nommé **LH-Events** qui contient une table Delta non partitionnée nommée **device_events**. Une définition de travail Spark exécute une requête de streaming structuré qui ajoute un micro-lot à device_events chaque minute.

    Les requêtes sur device_events depuis le point de terminaison d'analytique SQL sont devenues lentes. Vous découvrez que la table est constituée de dizaines de milliers de petits fichiers Parquet.

    Vous devez compacter les petits fichiers existants de device_events et faire en sorte que les petits fichiers écrits désormais par le flux soient également compactés. La solution ne doit ajouter ni travail planifié, ni pipeline, ni notebook.
