id: dp700-sr1-avro-events
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a Fabric eventstream named **ES1**. ES1 has an Azure Event Hubs source that reads an event hub named **orders-hub** by using a consumer group named **es1**, with the **Data format** set to **JSON**. A Filter operator sends the events to an eventhouse destination that uses **Event processing before ingestion**. The Event throughput setting of ES1 is **Low**.

    Since an update of the producer application yesterday, no new rows reach the destination table. The **Data insights** tab of the source node shows the following:

    - **Input events**: about 2,000 per minute, as before the update
    - **Deserialization errors**: equal to Input events
    - **Backlogged input events**: 0

    The producer team confirms that the application now serializes each event in the **Avro** format, and the application can't be changed.

    You need to restore the flow of new events to the destination table.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un flux d'événements Fabric nommé **ES1**. ES1 a une source Azure Event Hubs qui lit un hub d'événements nommé **orders-hub** à l'aide d'un groupe de consommateurs nommé **es1**, avec le paramètre **Data format** défini sur **JSON**. Un opérateur Filter envoie les événements vers une destination eventhouse qui utilise **Event processing before ingestion**. Le paramètre Event throughput de ES1 est **Low**.

    Depuis une mise à jour de l'application productrice hier, aucune nouvelle ligne n'atteint la table de destination. L'onglet **Data insights** du nœud source affiche les informations suivantes :

    - **Input events** : environ 2 000 par minute, comme avant la mise à jour
    - **Deserialization errors** : égal à Input events
    - **Backlogged input events** : 0

    L'équipe productrice confirme que l'application sérialise désormais chaque événement au format **Avro**, et l'application ne peut pas être modifiée.

    Vous devez rétablir le flux des nouveaux événements vers la table de destination.
