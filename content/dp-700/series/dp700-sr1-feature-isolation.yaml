id: dp700-sr1-feature-isolation
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam has a Fabric workspace named **WS-Dev** that is connected to the **dev** branch of an Azure DevOps repository. Four data engineers work in WS-Dev every day. WS-Dev contains a notebook named **Notebook1** and a pipeline named **Pipeline1**.

    A data engineer named **Ana** has the **Contributor** role in WS-Dev and can create workspaces. In the repository, Ana has the Read, Contribute, and Create branch permissions. The admin of WS-Dev hasn't enabled **Allow users with at least Contributor role to change Git branch**.

    Ana must change Notebook1 and Pipeline1. Her changes must not appear in WS-Dev or in the dev branch until a pull request has been reviewed and merged in Azure DevOps. The other engineers must keep working in WS-Dev on the dev branch without interruption.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam dispose d'un espace de travail Fabric nommé **WS-Dev** connecté à la branche **dev** d'un dépôt Azure DevOps. Quatre ingénieurs données travaillent chaque jour dans WS-Dev. WS-Dev contient un notebook nommé **Notebook1** et un pipeline nommé **Pipeline1**.

    Une ingénieure données nommée **Ana** a le rôle **Contributor** dans WS-Dev et peut créer des espaces de travail. Dans le dépôt, Ana dispose des autorisations Read, Contribute et Create branch. L'administrateur de WS-Dev n'a pas activé **Allow users with at least Contributor role to change Git branch**.

    Ana doit modifier Notebook1 et Pipeline1. Ses modifications ne doivent apparaître ni dans WS-Dev ni dans la branche dev tant qu'une demande de tirage (pull request) n'a pas été examinée et fusionnée dans Azure DevOps. Les autres ingénieurs doivent continuer à travailler dans WS-Dev sur la branche dev sans interruption.
