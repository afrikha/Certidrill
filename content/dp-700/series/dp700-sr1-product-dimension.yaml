id: dp700-sr1-product-dimension
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders has a Fabric lakehouse named **LH-Sales** that contains the following Delta tables:

    - **silver_product**: ProductID, ProductName, SubcategoryID. SubcategoryID is null for some products.
    - **silver_subcategory**: SubcategoryID, SubcategoryName, CategoryID. Some subcategories have no products.
    - **silver_category**: CategoryID, CategoryName.

    Every CategoryID in silver_subcategory exists in silver_category, and the ID columns are unique in their own tables.

    You need to create a table named **gold_dim_product** that has **exactly one row for each product** in silver_product, with the columns ProductID, ProductName, Subcategory, and Category. For products without a subcategory, Subcategory and Category must contain **Unknown**.

    A notebook attached to LH-Sales starts with the following code:

    ```python
    from pyspark.sql import functions as F
    p = spark.read.table("silver_product")
    s = spark.read.table("silver_subcategory")
    c = spark.read.table("silver_category")
    ```
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders dispose d'un lakehouse Fabric nommé **LH-Sales** qui contient les tables Delta suivantes :

    - **silver_product** : ProductID, ProductName, SubcategoryID. SubcategoryID est null pour certains produits.
    - **silver_subcategory** : SubcategoryID, SubcategoryName, CategoryID. Certaines sous-catégories n'ont aucun produit.
    - **silver_category** : CategoryID, CategoryName.

    Chaque CategoryID de silver_subcategory existe dans silver_category, et les colonnes d'ID sont uniques dans leur propre table.

    Vous devez créer une table nommée **gold_dim_product** qui contient **exactement une ligne par produit** de silver_product, avec les colonnes ProductID, ProductName, Subcategory et Category. Pour les produits sans sous-catégorie, Subcategory et Category doivent contenir **Unknown**.

    Un notebook attaché à LH-Sales commence par le code suivant :

    ```python
    from pyspark.sql import functions as F
    p = spark.read.table("silver_product")
    s = spark.read.table("silver_subcategory")
    c = spark.read.table("silver_category")
    ```
