# DP-700 objectives — official study guide, skills measured as of 2026-10-19 (en-au edition; the en-us
# URL returned the 2024 outline on 2026-11-16, see blueprint.yaml).
# French: fr-fr page for the bullets it still shares with the dated version. The fr-fr page did not carry
# the October 2026 list, so these French texts are OUR translations (Microsoft Learn terminology), to be
# replaced by the official wording when the fr-fr page is updated: 1.1.4, 1.3.3, 1.3.7, 1.3.8, 1.4.1,
# 2.2.2, 2.2.3, 2.3.2, 2.3.3, 3.2.2, 3.2.7. Group 3.1: the fr-fr page says "Monitorer des événements
# Fabric" (slip for "items"); corrected to "éléments".
# `code` is the stable key referenced by question files and course sections.
manage:
- group:
    en: Configure Microsoft Fabric workspace settings
    fr: Configurer les paramètres d'un espace de travail Microsoft Fabric
  objectives:
  - code: 1.1.1
    en: Configure Spark workspace settings
    fr: Configurer les paramètres d'un espace de travail Spark
  - code: 1.1.2
    en: Configure domain workspace settings
    fr: Configurer les paramètres d'un espace de travail de domaine
  - code: 1.1.3
    en: Configure OneLake workspace settings
    fr: Configurer les paramètres d'un espace de travail OneLake
  - code: 1.1.4
    en: Configure Apache Airflow workspace settings
    fr: Configurer les paramètres d'un espace de travail Apache Airflow
- group:
    en: Implement lifecycle management in Fabric
    fr: Implémenter la gestion de cycle de vie dans Fabric
  objectives:
  - code: 1.2.1
    en: Configure version control
    fr: Configurer la gestion de version
  - code: 1.2.2
    en: Implement database projects
    fr: Implémenter des projets de base de données
  - code: 1.2.3
    en: Create and configure deployment pipelines
    fr: Créer et configurer des pipelines de déploiement
- group:
    en: Configure security and governance
    fr: Configurer la sécurité et la gouvernance
  objectives:
  - code: 1.3.1
    en: Implement workspace-level access controls
    fr: Implémenter des contrôles d'accès au niveau de l'espace de travail
  - code: 1.3.2
    en: Implement item-level access controls
    fr: Implémenter des contrôles d'accès au niveau de l'élément
  - code: 1.3.3
    en: Implement row-level, column-level, object-level, and folder/file-level access controls
    fr: Implémenter des contrôles d'accès au niveau des lignes, au niveau des colonnes, au niveau de l'objet et au niveau du dossier/fichier
  - code: 1.3.4
    en: Implement dynamic data masking
    fr: Mettez en œuvre le masquage des données dynamiques
  - code: 1.3.5
    en: Apply sensitivity labels to items
    fr: Appliquer des étiquettes de confidentialité à des éléments
  - code: 1.3.6
    en: Endorse items
    fr: Approuver des éléments
  - code: 1.3.7
    en: Implement and use Microsoft Fabric audit logs
    fr: Implémenter et utiliser les journaux d'audit Microsoft Fabric
  - code: 1.3.8
    en: Configure and implement OneLake security
    fr: Configurer et implémenter la sécurité OneLake
- group:
    en: Orchestrate processes
    fr: Orchestrer des processus
  objectives:
  - code: 1.4.1
    en: Choose between Dataflow gen 2, a pipeline and a notebook
    fr: Choisir entre Dataflow Gen2, un pipeline et un notebook
  - code: 1.4.2
    en: Design and implement schedules and event-based triggers
    fr: Concevoir et implémenter des planifications et des déclencheurs basés sur un événement
  - code: 1.4.3
    en: Implement orchestration patterns with notebooks and pipelines, including parameters and dynamic expressions
    fr: Implémenter des modèles d'orchestration avec des notebooks et des pipelines, notamment les paramètres et les expressions dynamiques
ingest:
- group:
    en: Design and implement loading patterns
    fr: Concevoir et implémenter des modèles de chargement
  objectives:
  - code: 2.1.1
    en: Design and implement full and incremental data loads
    fr: Concevoir et implémenter des chargements de données incrémentiels et complets
  - code: 2.1.2
    en: Prepare data for loading into a dimensional model
    fr: Préparer des données à charger dans un modèle dimensionnel
  - code: 2.1.3
    en: Design and implement a loading pattern for streaming data
    fr: Concevoir et implémenter un modèle de chargement pour les données de diffusion en continu
- group:
    en: Ingest and transform batch data
    fr: Ingérer et transformer des données par lots
  objectives:
  - code: 2.2.1
    en: Choose an appropriate data store
    fr: Choisissez un magasin de données approprié
  - code: 2.2.2
    en: Choose between Dataflows Gen2, notebooks, KQL, and T-SQL for data transformation
    fr: Choisir entre Dataflow Gen2, les notebooks, KQL et T-SQL pour la transformation des données
  - code: 2.2.3
    en: Create and manage OneLake shortcuts
    fr: Créer et gérer des raccourcis OneLake
  - code: 2.2.4
    en: Implement mirroring
    fr: Implémenter la mise en miroir
  - code: 2.2.5
    en: Ingest data by using pipelines
    fr: Ingérer des données en utilisant des pipelines
  - code: 2.2.6
    en: Transform data by using PySpark, SQL, and KQL
    fr: Transformer des données en utilisant PySpark, SQL et KQL
  - code: 2.2.7
    en: Denormalize data
    fr: Dénormaliser les données
  - code: 2.2.8
    en: Group and aggregate data
    fr: Grouper et agréger des données
  - code: 2.2.9
    en: Handle duplicate, missing, and late-arriving data
    fr: Gérer des données en double, manquantes ou tardives
- group:
    en: Ingest and transform streaming data
    fr: Ingérer et transformer les données de diffusion en continu
  objectives:
  - code: 2.3.1
    en: Choose an appropriate streaming engine
    fr: Choisir un moteur de diffusion en continu approprié
  - code: 2.3.2
    en: Choose between native tables and OneLake shortcuts in Real-Time Intelligence
    fr: Choisir entre des tables natives et des raccourcis OneLake dans Real-Time Intelligence
  - code: 2.3.3
    en: Choose between Query acceleration for OneLake shortcuts and standard OneLake shortcuts in Real-Time Intelligence
    fr: Choisir entre l'accélération des requêtes pour les raccourcis OneLake et les raccourcis OneLake standard dans Real-Time Intelligence
  - code: 2.3.4
    en: Process data by using Eventstream
    fr: Traiter des données en utilisant des flux d'événements
  - code: 2.3.5
    en: Process data by using Spark structured streaming
    fr: Traiter des données en utilisant le streaming structuré Spark
  - code: 2.3.6
    en: Process data by using KQL
    fr: Traiter des données en utilisant KQL
  - code: 2.3.7
    en: Create windowing functions
    fr: Créer des fonctions de fenêtrage
monitor:
- group:
    en: Monitor Fabric items
    fr: Monitorer des éléments Fabric
  objectives:
  - code: 3.1.1
    en: Monitor data ingestion
    fr: Monitorer l'ingestion des données
  - code: 3.1.2
    en: Monitor data transformation
    fr: Monitorer la transformation des données
  - code: 3.1.3
    en: Monitor semantic model refresh
    fr: Monitorer l'actualisation du modèle sémantique
  - code: 3.1.4
    en: Configure alerts
    fr: Configurer des alertes
- group:
    en: Identify and resolve errors
    fr: Identifier et résoudre les erreurs
  objectives:
  - code: 3.2.1
    en: Identify and resolve pipeline errors
    fr: Identifier et résoudre les erreurs de pipeline
  - code: 3.2.2
    en: Identify and resolve Dataflow Gen2 errors
    fr: Identifier et résoudre les erreurs de Dataflow Gen2
  - code: 3.2.3
    en: Identify and resolve notebook errors
    fr: Identifier et résoudre les erreurs de notebook
  - code: 3.2.4
    en: Identify and resolve Eventhouse errors
    fr: Identifier et résoudre les erreurs d'eventhouse
  - code: 3.2.5
    en: Identify and resolve Eventstream errors
    fr: Identifier et résoudre les erreurs de flux d'événements
  - code: 3.2.6
    en: Identify and resolve T-SQL errors
    fr: Identifier et résoudre les erreurs T-SQL
  - code: 3.2.7
    en: Identify and resolve OneLake shortcut errors
    fr: Identifier et résoudre les erreurs de raccourci OneLake
- group:
    en: Optimize performance
    fr: Optimiser les performances
  objectives:
  - code: 3.3.1
    en: Optimize a Lakehouse table
    fr: Optimiser une table lakehouse
  - code: 3.3.2
    en: Optimize a pipeline
    fr: Optimiser un pipeline
  - code: 3.3.3
    en: Optimize a data warehouse
    fr: Optimiser un entrepôt de données
  - code: 3.3.4
    en: Optimize Eventstream and Eventhouse
    fr: Optimiser des flux d'événements et des eventhouses
  - code: 3.3.5
    en: Optimize Spark performance
    fr: Optimiser les performances de Spark
  - code: 3.3.6
    en: Optimize query performance
    fr: Optimiser les performances des requêtes
