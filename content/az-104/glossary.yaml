    - "'une instance App Service' / 'une instance Groupes de machines virtuelles identiques Azure' is how the study guide renders 'an App Service' / 'Azure Virtual Machine Scale Sets'."
    - "The networking domain is 'Implémenter et gérer des réseaux virtuels' on the study guide (not 'la mise en réseau virtuelle'); the monitoring domain is 'Superviser les ressources Azure et en assurer la maintenance' (not 'Surveiller et tenir à jour')."
learning_paths_fr:  # module titles seen on fr-fr AZ-104 learning paths
  - url: "https://learn.microsoft.com/fr-fr/training/paths/az-104-manage-identities-governance/"
    modules: ["Comprendre Microsoft Entra ID", "Créer, configurer et gérer des identités", "Décrire les principaux composants architecturaux d’Azure", "Initiatives de la politique Azure", "Sécuriser vos ressources Azure avec le contrôle d’accès en fonction du rôle Azure (Azure RBAC)", "Autoriser les utilisateurs à réinitialiser leur mot de passe avec la réinitialisation de mot de passe en libre-service Microsoft Entra"]
  - url: "https://learn.microsoft.com/fr-fr/training/paths/az-104-manage-storage/"
    modules: ["Configurer des comptes de stockage", "Configurer Stockage Blob Azure", "Configurer la sécurité du Stockage Azure", "Configurer Azure Files"]
  - url: "https://learn.microsoft.com/fr-fr/training/paths/az-104-manage-compute-resources/"
    modules: ["Présentation des machines virtuelles Azure", "Configurer la disponibilité des machines virtuelles", "Configurer des plans Azure App Service", "Configurer Azure App Service", "Configurer Azure Container Instances"]
  - url: "https://learn.microsoft.com/fr-fr/training/paths/az-104-manage-virtual-networks/"
    modules: ["Configurer des réseaux virtuels", "Configurer des groupes de sécurité réseau", "Héberger votre domaine sur Azure DNS", "Configurer un peering de réseaux virtuels Azure", "Gérer et contrôler le flux de trafic dans votre déploiement Azure à l’aide de routes", "Introduction à Azure Load Balancer", "Introduction à Azure Application Gateway", "Introduction à Azure Network Watcher"]
  - url: "https://learn.microsoft.com/fr-fr/training/paths/az-104-monitor-backup-resources/"
    modules: ["Présentation d’Sauvegarde Azure (sic)", "Protéger vos machines virtuelles en utilisant Sauvegarde Azure", "Surveillez vos machines virtuelles Azure avec Azure Monitor"]
