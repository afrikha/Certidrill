# AZ-104 EN -> FR terminology glossary, built from Microsoft Learn en-us / fr-fr page pairs.
# confirmed: true  = the French term was seen verbatim (case/plural-insensitive) on the fetched fr-fr page in `source`.
# confirmed: false = not seen on any fetched fr-fr page; do not use without checking.
# also_seen = other FR variants Microsoft also uses for the same concept on fetched pages.
source_note: "Terms collected from Microsoft Learn en-us / fr-fr on 2026-11-11 (about 120 page pairs: docs, the AZ-104 study guide, and the 5 AZ-104 learning paths)."
typography:
  - "Space before ':' in French: 'Niveau chaud : …'. Microsoft uses a non-breaking space (U+00A0) about 40% of the time and a plain space otherwise; never omit it."
  - "Space before '?' ('Qu'est-ce qu'Azure Bastion ?'), '!' and ';' as well; Microsoft uses a plain space or U+00A0."
  - "Quotation marks are French guillemets with inner spaces: « Lecture seule » (usually U+00A0 inside). Straight quotes appear only in code."
  - "Typographic apostrophe ’ (U+2019) is used in prose: l’accès, d’administration."
  - "Space before '%': '20-25 %' (study guide)."
  - "UI labels and blade names are quoted or bolded in their FR portal form: 'Vérifier + créer', 'Vue d’ensemble', 'Contrôle d’accès (IAM)'."
  - "Commands, cmdlets, JSON property names, SKU names and enum values stay in English: CanNotDelete, ReadOnly, Standard_LRS, Microsoft.Storage, az vm create, NotActions."
  - "Acronyms are kept in English and often expanded in FR in parentheses: 'groupes de sécurité réseau (NSG)', 'signature d’accès partagé (SAS)', 'réinitialisation de mot de passe en libre-service (SSPR)'."
  - "'e-mail' (not 'courriel')."
  - "Lowercase for common nouns after the product: 'coffre Recovery Services', 'espace de travail Log Analytics', 'plan App Service'."
